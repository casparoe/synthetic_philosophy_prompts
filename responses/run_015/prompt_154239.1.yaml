answer: |-
  # Session Plan: Superrationality in the One-Shot Prisoner's Dilemma

  **Duration:** 60 minutes
  **Audience:** First-year Computer Science and Philosophy undergraduates.
  **Prerequisites:** Knowledge of the Prisoner's Dilemma payoff matrix; familiarity with the phrase 'Nash equilibrium'.

  ## I. The Carrying Scenario: Constraints and Exclusions

  Before sequencing the lesson, the experimental frame must be rigidly defined to prevent conceptual leakage.

  **The Scenario:**
  Each student submits a sealed decision procedure (algorithm or rule) to a referee. The referee pairs students, runs the procedures against one another, and distributes payoffs according to the Prisoner's Dilemma matrix.

  **What Must Be Excluded:**
  1.  **Iteration:** It must be explicitly stated that this interaction happens once. There is no 'next round' to punish or reward.
  2.  **Reputation:** Identities are anonymised. No future interactions within the cohort are contingent on this outcome.
  3.  **Communication:** No side-channels, signalling, or pre-play negotiation are permitted between the paired participants.
  4.  **Source Code Visibility (Crucial):** The procedures must **not** be shown to one another.
      *   *Reasoning:* If Procedure A can read Procedure B's source code, the lesson shifts from *Superrationality* (Hofstadter) to *Program Equilibrium* (Tennenholtz) or *FairBot* dynamics (Logical Decision Theory). Superrationality relies on the *mutual knowledge of rationality*, not the mechanical inspection of code. Allowing code inspection turns the philosophical problem into a technical exploit, bypassing the need for the superrational inference you wish to teach.

  ---

  ## II. Sequence of Components

  ### Step 1: The Nash Anchor (10 minutes)
  **Action:** Present the standard Prisoner's Dilemma matrix. Elicit the Nash Equilibrium (Defect/Defect). Ask why this is unsatisfying (Pareto inefficiency).
  **Forward Dependency:** This step depends on a definition of 'Rationality' that has not yet been said. You are relying on the students' intuitive notion that 'rational' means 'maximising personal payoff', but you have not yet introduced the superrational definition of 'rational' as 'reasoning symmetrically'.
  **Goal:** Establish the baseline of standard game theory to create tension.

  ### Step 2: The Superrational Intuition (15 minutes)
  **Action:** Introduce Hofstadter's proposition: If two agents are both rational, and both know the other is rational, their reasoning processes should mirror one another. Therefore, my decision is *evidence* of their decision, not because I cause it, but because we are running the same 'mental software'.
  **Forward Dependency:** This depends on the concept of 'Logical Correlation' which has not yet been said. You are asking them to accept that two spatially separated events (decisions) can be correlated without a common physical cause or direct causation, purely by virtue of shared logical structure.
  **Goal:** Shift the focus from causal influence to logical symmetry.

  ### Step 3: Addressing the 'Identical Code' Proposal (10 minutes)
  **Action:** A CS student will likely suggest: "Cooperate if and only if I can verify the other procedure is identical to mine."
  **Classification:** This is a **Trap**. It is a specific implementation of logical correlation that is too brittle. It solves the specific case but misses the general principle.
  **Placement:** Address this immediately after Step 2.
  **Correction:** Explain that superrationality does not require bit-for-bit identity of code, but identity of *reasoning*. If I reason "Cooperation is best for agents like me", and you reason the same, we cooperate, even if my code is in Python and yours is in C, or if our internal variable names differ. The correlation lies in the *argument*, not the *string*.
  **Goal:** Distinguish between mechanical matching (Program Equilibrium) and rational symmetry (Superrationality).

  ### Step 4: Misconception 1 — Reciprocal Altruism (5 minutes)
  **Action:** Confront the idea that "I cooperate hoping they will cooperate next time."
  **Placement:** Immediately after Step 1 (The Nash Anchor) and before Step 2.
  **Prerequisite for Correction:** The plan must have already established the **One-Shot Constraint** (from the Carrying Scenario).
  **Correction:** Remind them there is no future. This is not trust; it is deduction.
  **Goal:** Purge evolutionary or iterated intuitions from the room.

  ### Step 5: Misconception 2 — EDT in Costume (10 minutes)
  **Action:** Confront the idea that "This is just Evidential Decision Theory (EDT); my action is merely evidence of theirs."
  **Placement:** After Step 2 (The Superrational Intuition).
  **Prerequisite for Correction:** The plan must have already established **Logical Correlation** (Step 2).
  **Correction:** Clarify that standard EDT treats correlation as brute fact (e.g., smoking and cancer). Superrationality posits the correlation arises from the *shared causal structure of reasoning*. It is not merely that my choice is evidence; it is that my choice and theirs are *outputs of the same function*.
  **Goal:** Distinguish between passive observation of correlation and active participation in a shared logical truth.

  ### Step 6: Misconception 3 — Universal Cooperation (5 minutes)
  **Action:** Confront the idea that "Superrationality means always cooperating, regardless of the game."
  **Placement:** Near the end, leading into the Closing Question.
  **Prerequisite for Correction:** The plan must have already established **Symmetry of Incentives** (implicit in Step 2).
  **Correction:** Superrationality only prescribes cooperation if the *payoff structure* makes cooperation the symmetric rational choice. If the game changes, the logical output changes.
  **Goal:** Prevent the dogma that superrationality is equivalent to altruism.

  ### Step 7: The Closing Question (5 minutes)
  **Action:** Pose the variant scenario (see below).
  **Goal:** Separate rote memorisation from conceptual grasp.

  ---

  ## III. Handling the Misconceptions (Detailed Placement)

  To ensure the corrections land rather than being memorised, the following conditions must be met in the sequence:

  1.  **Reciprocal Altruism with Iteration Deleted:**
      *   *Placement:* Early (Step 4).
      *   *Required Establishment:* You must have already locked down the **One-Shot** nature of the scenario. If they believe there is a shadow of the future, the correction will fail.
      *   *Why:* If they think iteration is merely 'deleted' rather than 'non-existent', they will view superrationality as a risky gamble on goodwill. You must establish that the *logic* replaces the *shadow*.

  2.  **Superrationality as Evidential Decision Theory (EDT):**
      *   *Placement:* Middle (Step 5).
      *   *Required Establishment:* You must have already introduced the **Mechanism of Logical Correlation** (Step 2).
      *   *Why:* Without understanding that the correlation stems from shared reasoning processes (the 'same function'), they will revert to viewing it as magical thinking or mere statistical correlation. They need to grasp that the *reasoning* is the common cause.

  3.  **Universal Cooperation (Asymmetry/Non-Superrational Opponents):**
      *   *Placement:* Late (Step 6).
      *   *Required Establishment:* You must have already established that Superrationality relies on **Symmetry of Players and Payoffs**.
      *   *Why:* If they believe superrationality is a moral commandment to 'be nice', they will not understand why it fails in asymmetric games. They must understand it as a *strategy contingent on the opponent's type and the game's structure*.

  ---

  ## IV. The Closing Question

  **The Question:**
  "You and your counterpart are both superrational agents using identical reasoning procedures. However, you are facing a Prisoner's Dilemma where your Temptation payoff is 10, while your counterpart's Temptation payoff is 100. All other payoffs (Reward, Punishment, Sucker) are identical and symmetric. Both of you know this asymmetry exists. Do you cooperate?"

  **The Distinction:**
  *   **The Rote Learner:** Will answer "Yes". They have memorised the rule: "Superrational agents run the same computation, therefore they cooperate." They focus on the identity of the *procedure*.
  *   **The Understander:** Will answer "No" or "It is undefined". They recognise that superrationality relies on the **symmetry of the situation**. If the payoffs are asymmetric, the logical symmetry is broken. What is rational for the high-incentive player (Defect) may not be rational for the low-incentive player, and knowing this, the logical link snaps. The 'same computation' yields different results because the *inputs* (payoffs) differ.

  ---

  ## V. What to Decline to Settle

  To maintain philosophical rigour and avoid dogmatism within a one-hour limit, you must explicitly decline to settle the following:

  1.  **Normative Correctness:** Do not claim superrationality is the *correct* way to be rational. Present it as a coherent alternative to Causal Decision Theory (CDT), not the victor over it. Whether one *ought* to be superrational remains a live debate in decision theory.
  2.  **The CDT vs. EDT War:** Do not attempt to resolve the general contest between Causal and Evidential Decision Theory. Superrationality sits uneasily between them (sharing features of both). Acknowledge that this session explores a specific intuition regarding logical correlation, not a proof that standard decision theory is 'wrong'.
  3.  **The Definition of 'Rationality':** Do not assert that superrationality is the only valid definition of rationality. Acknowledge that Nash-equilibrium reasoning is also 'rational' under a different definition (causal independence).

  By leaving these questions open, you invite the philosophy students to critique the foundations and the computer science students to explore the implementation limits, without the session collapsing into a metaphysical dispute.
