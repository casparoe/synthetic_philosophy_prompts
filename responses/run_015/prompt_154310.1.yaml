  7.  (Final Review of the "Lure" concept): The user says "lure weight... based on how strongly it expects the others to apply superrational symmetry-breaking." If I expect others to break symmetry *in my favor*, I claim. But why would they break symmetry in my favor? This implies an asymmetry in the reasoning architecture. I need to point out that this requires *non-identical* agents or *correlated randomness*.

