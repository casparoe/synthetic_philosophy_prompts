      *   *Game Mechanics:* Win probability $p = 0.6$, Loss probability $q = 0.4$. Payout is 1:1 (bet 1, win 1 net).
      *   *Growth Rate:* $g(f) = p \ln(1+f) + q \ln(1-f)$.
      *   *Optimal Fraction (Kelly):* $f^* = p - q = 0.6 - 0.4 = 0.2$ (20%).
      *   *Ruin Point:* Growth rate becomes negative when $f > f_{critical}$.
          *   $0.6 \ln(1+f) + 0.4 \ln(1-f) = 0$.
          *   Solving this: $(1+f)^{0.6} (1-f)^{0.4} = 1$.
          *   Approximate solution for 1:1 payout: $f \approx 2p - 1$? No, that's Kelly.
          *   Actually, for $p=0.6$, ruin happens if $f$ is high enough that the geometric mean < 1.
          *   $(1+f)^6 (1-f)^4 < 1$.
          *   If $f=0.5$: $1.5^6 \times 0.5^4 \approx 11.39 \times 0.0625 \approx 0.71$ (Shrinking).
          *   If $f=1.0$ (All in): $2^6 \times 0^4 = 0$ (Certain Ruin eventually).
          *   Crossover point where expected *median* wealth stops growing: Around 50% stake. (Actually, $f_{critical}$ is where $g(f)=0$. For $p=0.6$, $f \approx 0.53$).
