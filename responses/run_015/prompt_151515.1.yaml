          *   Split 100% bet (50% on A, 50% on B):
              *   Win/Win: $1 + 0.5 + 0.5 = 2.0$.
              *   Win/Loss: $1 + 0.5 - 0.5 = 1.0$.
              *   Loss/Win: $1 - 0.5 + 0.5 = 1.0$.
              *   Loss/Loss: $1 - 0.5 - 0.5 = 0.0$.
              *   Probability of Ruin (Loss/Loss) = $0.4 \times 0.4 = 0.16$.
              *   Probability of Standstill = $0.48$.
              *   Probability of Double = $0.36$.
              *   This is much safer than 100% on one (40% ruin chance per round).
