answer: |-
  This is a brilliant plan. You have correctly identified that the math is secondary to the *experience* of the math. The "ergodicity problem" (the difference between what happens to the group on average vs. what happens to you over time) is best learned by watching a friend go broke while the whiteboard says the room is rich.

  Here is the complete design for your 90-minute session.

  ### 1. Game Overview & Materials

  **The Narrative:** Do not call this "gambling" or "investing." Call it **"The Growth Game."** Tell them they are managers of a small resource pool, trying to grow it over two fiscal quarters (Phase 1 and Phase 2).

  **Materials per Table (3 Tables, ~5 players each):**
  *   **Chips:** 100 poker chips per player (color doesn't matter, but 100 of one color is easiest).
  *   **Dice:** 2 ten-sided dice (d10) per table.
  *   **Cards:** 3 index cards per player (2 for betting slips, 1 for predictions).
  *   **Pens:** 1 per player.
  *   **Whiteboard:** Divided into 3 sections (Table 1, Table 2, Table 3).

  **Materials for Facilitator:**
  *   **Master Sheet:** A printed cheat sheet with the math (provided below).
  *   **Timer:** Phone or watch.
  *   **Auditor Clipboards:** 2 clipboards with paper for eliminated players.

  ---

  ### 2. The Rules (Read Aloud)

  **Setup:**
  "Everyone starts with 100 chips. This is your bankroll. You cannot add chips. If you reach 0, you are out of the game."

  **The Bet:**
  "We are playing a favorable game. You will roll a 10-sided die.
  *   **Roll 1–6:** You Win. You keep your stake, and win an amount equal to your stake.
  *   **Roll 7–10:** You Lose. You lose your stake.
  *   **Chance:** 60% to win, 40% to lose.
  *   **Payout:** 1-to-1 (Even money)."

  **Phase 1 Rules (10 Rounds):**
  1.  **Commit:** Before Round 1, write down a **Fixed Fraction** (e.g., 10%, 50%, 100%). You must bet this exact percentage of your *current* bankroll every round. Write it on your card. You cannot change it.
  2.  **Roll:** Everyone rolls their own die individually.
  3.  **Resolve:** Calculate win/loss, round to the nearest whole chip. (If stake is less than 1 chip, you sit out that round).
  4.  **Record:** At the end of 10 rounds, report your final chip count to the board.

  **Phase 2 Rules (10 Rounds):**
  1.  **Commit:** You now have **Two Independent Bets** per round (Die A and Die B).
  2.  **Strategy:** Choose a **Total Fraction** of your bankroll to risk, and how to **Split** it between Die A and Die B.
      *   *Example:* Total 40%. Split 20% on Die A, 20% on Die B.
      *   *Example:* Total 40%. Split 40% on Die A, 0% on Die B.
  3.  **Roll:** The Table shares **one pair of dice**. Everyone faces the same outcome for Die A and Die B.
  4.  **Resolve:** Calculate results for both bets, add/subtract from bankroll.
  5.  **Record:** Report final count.

  **The "Auditor" Role:**
  "If you go broke (0 chips), you are not done. You become an **Auditor**. You get a clipboard. Your job is to verify the math of the players still in the game. If you spot a calculation error, you call it out. Auditors share in the symbolic prize if their table's *median* wealth is the highest."

  ---

  ### 3. Timeline (90 Minutes)

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Intro & Setup** | Distribute chips (100 each). Explain the 60/40 rule clearly. Verify everyone understands "Win = +Stake, Lose = -Stake". |
  | **10-20** | **Phase 1 Predictions** | Hand out Index Card #1. Players write: (1) Their Fixed Fraction, (2) Predicted Final Bankroll, (3) Predicted Room Average. **Collect these cards.** |
  | **20-35** | **Phase 1 Play** | 10 Rounds. ~1.5 mins/round. Players roll individually. Auditors verify calculations for neighbors. |
  | **35-45** | **Phase 1 Tally** | Write results on Whiteboard. Calculate **Mean** (Sum/Players) and **Median** (Middle Player). Do not explain the difference yet. |
  | **45-55** | **Phase 2 Predictions** | Hand out Index Card #2. Players write: (1) Total Fraction & Split, (2) Predicted Final Bankroll. **Collect these cards.** |
  | **55-75** | **Phase 2 Play** | 10 Rounds. Table shares dice. Focus on the difference between "All on One Die" vs. "Split Across Two". |
  | **75-85** | **Phase 2 Tally** | Write results. Compare to Phase 1. Highlight survivors who bet "recklessly" but split. |
  | **85-90** | **The Reveal** | Return prediction cards. Debrief (script below). |

  ---

  ### 4. Facilitator Cheat Sheet (The Numbers)

  You need these numbers to spot signal from noise. Do not show these to players.

  **Phase 1 (Single Bet, 60% Win Chance)**
  *   **Optimal Fraction (Kelly):** 20%.
  *   **Expected Median Growth:** A player betting 20% should multiply their bankroll by **~1.22x** over 10 rounds (100 → 122 chips).
  *   **The "Break-Even" Trap:** A player betting **53%** will statistically break even (median stays at 100). Anything above 53% shrinks.
  *   **The Ruin Zone:** A player betting **100%** has a 99.4% chance of going bust in 10 rounds. ($0.6^{10} \approx 0.006$).
  *   **The Ergodicity Trap:** If one person bets 100% and gets lucky (0.6% chance), they will have ~102,400 chips. This will make the **Room Average** look massive, while the **Median** is zero.

  **Phase 2 (Two Independent Bets, 60% Win Chance)**
  *   **Optimal Total Fraction:** 40% (Split 20% on Die A, 20% on Die B).
  *   **Expected Median Growth:** A player betting 40% total (split) should multiply bankroll by **~1.48x** over 10 rounds (100 → 148 chips).
  *   **The Lesson:** The "safe" bet in Phase 2 is *double* the "safe" bet in Phase 1.
  *   **Diversification Save:** A player betting 100% Total on *One Die* will likely bust (same as Phase 1). A player betting 100% Total *Split 50/50* has a much higher survival rate (16% chance of bust per round vs 40%). Over 10 rounds, the Split player has a ~17% chance of survival; the Single player has <1%.

  **Rounding Rule:**
  *   Always round to the nearest whole chip.
  *   *Edge Case:* If a player has 3 chips and bets 20% (0.6 chips), round to 1 chip. If they have 1 chip and bet 20% (0.2), round to 0. They sit out the round but are not out of the game until they hit 0.

  ---

  ### 5. The Debrief (Script & Strategy)

  **Step 1: The Prediction Shock**
  Hand back the Phase 1 prediction cards.
  *   *Ask:* "Look at what you wrote for your own bankroll. Now look at what you actually have."
  *   *Ask:* "Look at what you wrote for the Room Average. Let's calculate the real Room Average now."
  *   *The Reveal:* If you have a "Lucky All-In" winner, the Average will be huge. The Median will be small.
  *   *Say:* "The room got richer, but most people in the room got poorer. How is that possible?" (Let them answer).
  *   *Say:* "The Average includes the one person who got lucky. The Median is *you*. In life, you live the Median, not the Average."

  **Step 2: Handling the Lucky Winner**
  If a player bet 100% and won:
  *   *Do not* say they were wrong.
  *   *Ask:* "Read your prediction card. Did you expect this outcome, or did you hope for it?"
  *   *Ask:* "If we played this again for another 10 rounds, would you bet 100% again?"
  *   *Point:* "You didn't find a loophole. You survived a bullet. The strategy isn't about surviving once; it's about surviving forever."

  **Step 3: Phase 2 Diversification**
  *   *Compare:* Find a player who bet 40% Total in Phase 2 (split 20/20) and a player who bet 20% in Phase 1.
  *   *Observation:* The Phase 2 player likely grew faster.
  *   *Say:* "In Phase 1, 20% was the speed limit. In Phase 2, you could drive 40% safely. Why?"
  *   *Answer:* "Because you didn't put all your cargo in one truck. When one bet lost, the other often won, smoothing out the bumps. Less bumpy road means you can drive faster without crashing."

  **Step 4: Naming the Beast**
  *   *Now* you can use the words.
  *   "What you felt in Phase 1 is called **Volatility Drag**. Betting too much makes the downsides hurt more than the upsides help."
  *   "What you used in Phase 2 is **Diversification**. It reduces the drag, letting you stake more safely."
  *   "The fraction you were hunting for has a name (The Kelly Criterion), but the feeling you have now—that there is a 'Goldilocks' zone between too slow and too fast—is the real lesson."

  ---

  ### 6. Troubleshooting: What Will Go Wrong

  **1. The "All-In" Winner Dominates the Conversation**
  *   *Risk:* The player who bet 100% and won argues that "caution is for losers."
  *   *Fix:* Use the Auditor data. Ask the Auditors: "How many people bet 50% or more? How many of them are left?" Usually, the winner is the sole survivor of a massacre. Make sure the *count* of losers is visible on the board.

  **2. Math Anxiety / Calculation Errors**
  *   *Risk:* Players stall trying to calculate 17% of 83 chips.
  *   *Fix:* Encourage estimation. "Close enough." The Auditor's job is to catch gross errors, not decimals. If a player is struggling, pair them with an Auditor.
  *   *Pre-empt:* Suggest "Easy Fractions" during setup. "If you want to bet 20%, just bet 1 chip for every 5 you have."

  **3. Phase 2 is Too Quiet**
  *   *Risk:* Because dice are shared, there's less rolling noise.
  *   *Fix:* Make the "Market Announcement" dramatic. "Die A is... a 3 (Win)! Die B is... an 8 (Loss)!"

  **4. Eliminated Players Get Bored**
  *   *Risk:* They check out mentally.
  *   *Fix:* The "Auditor" role must be prestigious. Give them the marker for the whiteboard. Tell them, "The integrity of the game depends on you."

  ---

  ### 7. Limitations (What You Must Say Out Loud)

  You suspected this, and you are right. You must voice these limitations in the last 5 minutes, or the lesson will feel like a parlor trick.

  1.  **The Time Horizon:** "We played 20 rounds. In real life, you play thousands. The 'Ruin' we saw today is inevitable over enough time. The Lucky Winner today would be broke by next year."
  2.  **Known Odds:** "In this game, you knew it was a 60% win rate. In life, we never know the odds. We guess. And when we guess wrong, we usually guess too high. That means the 'Safe' fraction in real life is usually *half* of what the math says."
  3.  **Utility of Money:** "In the game, 100 chips is the same as 1,000 chips. In life, losing your last $100 hurts more than winning an extra $100 helps. That means you should always bet *less* than the math says is optimal, just to sleep at night."

  ### Final Note to Facilitator
  You work in logistics. You know that a plan looks perfect on paper until the truck breaks down. This game is the same. If the numbers don't line up perfectly (e.g., the 20% bettor has less than the 10% bettor due to variance), **lean into it.**

  Say: *"See? Even the right strategy can lose in the short run. That's why you stick to the fraction, not the feeling."*

  That is the moment they will feel it in their bones. Good luck.
