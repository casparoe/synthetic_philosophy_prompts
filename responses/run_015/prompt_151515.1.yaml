      *   *Phase 2 (Diversification):* Two independent bets.
          *   If I bet total fraction $F$, split 50/50 ($F/2$ on each).
          *   Variance is reduced. The "effective" volatility drag is lower.
          *   This allows a higher *total* fraction $F$ to be sustainable than in Phase 1.
