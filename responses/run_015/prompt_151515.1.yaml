      *   **Core Lessons:**
          1.  Overbetting leads to ruin even in favorable games (ergodicity problem: ensemble average vs. time average).
          2.  Diversification (splitting stakes across independent bets) allows for higher total exposure without increasing ruin risk (volatility drag reduction).
      *   **Constraints:**
          *   90 minutes total.
          *   3 tables, ~14 adults.
          *   Materials: d10 dice, chips, cards, pens, whiteboard. No projector, no real money.
          *   Two Phases:
              *   Phase 1: Single bet (60% win, 1:1 payout). Fixed fraction committed upfront. Individual rolls (to show variance/ergodicity).
              *   Phase 2: Two independent bets per round. Total fraction + split. Shared roll per table (to isolate strategy effects).
          *   No jargon before debrief.
          *   Predictions collected upfront.
          *   Eliminated players need engagement.
          *   Facilitator needs specific numbers (optimal fractions, ruin points, expected outcomes).
