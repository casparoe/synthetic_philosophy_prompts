  6. Since the level of violence is a weighted aggregate whose trend can flip with the weights, the thesis asserts not a mind-independent fact but that a specific weighting of harms aligns best with human flourishing and policy goals.
  7. The boundary and comparability desiderata cannot be jointly satisfied because expanding the category to include unrecorded historical harms inevitably compromises data consistency. The comparability desideratum does the most work excluding the civilising-process account, the state-monopoly account, and the archaeological baseline account, as all three rely on equating disparate forms of evidence across millennia.
