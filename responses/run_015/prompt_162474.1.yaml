      *   *Settled:* Violation of axioms + linear utility $\rightarrow$ Susceptibility to sure loss.
      *   *Contested:* Susceptibility $\rightarrow$ Irrationality (Pragmatic vs. Epistemic). Imprecise credences (Walley vs. standard Bayes). Diachronic Dutch Book $\rightarrow$ Conditionalization (Lewis's assumptions).
