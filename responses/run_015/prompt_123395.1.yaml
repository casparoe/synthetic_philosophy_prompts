answer: |-
  The per-capita rate measures the physical reality of harm, while the encounter-adjusted rate measures the social texture of risk, and only the former answers the question of whether the world is materially less violent.

  To understand why, we must treat the denominator not as a neutral divisor but as a definition of the problem itself. Consider four candidate denominators, each answering a distinct question. Total population count answers what the aggregate burden of harm is on the society. Person-years lived answers what the average individual's annual risk of victimization happens to be. Distinct social encounters answers how dangerous a typical interaction between strangers actually is. Cumulative lifespan answers the odds that I die violently before natural causes take me.

  You have fixed violence as intentional physical harm, which locks the numerator. The choice of denominator therefore decides whether we are measuring bodily integrity or social trust. The per-capita frame (person-years) is the standard for a reason: it isolates the risk inherent to existence within a specific polity, regardless of how busy that existence is. The encounter-adjusted frame is seductive because it feels more granular, but it conflates the frequency of interaction with the propensity for harm. If you walk through a crowd safely one thousand times, you have not increased the violence; you have increased the opportunities for peace.

  Let's work the numbers to see if the trend flips. Imagine a medieval village of 1,000 people suffering 10 homicides a year. The per-capita rate is 1 percent. Suppose each person has 100 distinct social encounters annually, totaling 100,000 encounters. The violence-per-encounter rate is 0.01 percent. Now imagine a modern city of 1,000 people suffering only 1 homicide a year. The per-capita rate has dropped tenfold to 0.1 percent. Suppose modern density means each person has 10,000 distinct encounters annually, totaling 10 million encounters. The violence-per-encounter rate is now 0.00001 percent. The per-capita risk dropped by a factor of ten, but the per-encounter risk dropped by a factor of one thousand. The trend does not flip sign; it intensifies. The world is not only safer per person, it is vastly safer per interaction. The encounter frame makes modernity look like a miracle of trust, not a statistical artifact.

  However, this clarity muddies when we shift from annual rates to lifetime risk, which is where your second complication lives. If the annual homicide rate drops tenfold, but life expectancy increases tenfold, the cumulative lifetime risk of violent death might remain unchanged. A peasant living to 35 with a high annual risk might face the same total odds of murder as a banker living to 85 with a low annual risk. Which is the honest answer? It depends on whether you are asking about the state of the world or the fate of the body. "Is the world more violent?" is a question about the environment's propensity to inflict harm, which demands the annual per-capita rate. "Am I going to die violently?" is a question about personal destiny, which demands the cumulative lifetime risk. Conflating them leads to the error of thinking that because we live longer, we aren't safer, when in fact we have simply exposed ourselves to risk for more years.

  The third complication, witnessed violence, must be severed from the measurement entirely given your narrow definition. Witnessing harm is psychological trauma, not physical violence. Including it changes the ontology of the claim from "bodies are breaking less often" to "people are more distressed by conflict." That is a vital question for public health, but it is not a question about violence rates. If you include spectator exposure, you are measuring the reach of information networks, not the frequency of assault. A viral video of a fight does not increase the violence; it increases the audience. Keeping these separate prevents the measurement from collapsing into a critique of media saturation.

  Ultimately, there is no fact of the matter about which denominator is "correct" until you specify what you care about. This is not a disagreement about what violence is—you fixed that as physical harm. It is a choice about what we value in safety. If you value the stability of social interactions, the encounter rate tells you that strangers are more trustworthy than ever. If you value the aggregate reduction of suffering, the per-capita rate tells you fewer bodies are broken. But if your headline asks whether the world is getting less violent, you are asking about the prevalence of harm, not the density of crowds. The per-capita frame is the only one that measures the violence itself rather than the context surrounding it. The encounter frame measures the miracle of cooperation that allows us to walk past thousands of people without dying, but that is a story about peace, not violence. Stick to the per-capita rate for the violence claim, and use the encounter rate to explain why the decline is so socially significant.
