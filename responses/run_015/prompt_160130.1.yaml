answer: |-
  ### The Translation: Protocols, States, and Regularities

  Treat the auction mechanism as a distributed specification defining valid message histories. Each agent is a process executing a local program (strategy) on a private state space. An information set is an indistinguishability relation over local states: two histories are in the same set if the agent's observations are identical. A strategy profile is a run of the system.

  In this vocabulary, **rationalizability** is a safety property: it asserts that in every reachable state, every process chooses an action that is not dominated, given its belief about other processes' states. **Iterated strict dominance** corresponds to model-checking this property against a hierarchy of knowledge operators: process $i$ knows $j$ is rational, knows $j$ knows $i$ is rational, and so on. **Nash equilibrium** is a fixed point where each local program is optimal given the distribution of other programs executing in the same run. **Correlated equilibrium** introduces a shared random source (a coordinator process) whose signals are observed by all agents before action selection.

  **Sequential refinements** (Perfect Bayesian Equilibrium) add a constraint on belief updates. Processes must maintain a belief distribution over other processes' states consistent with Bayes' rule wherever the denominator is non-zero.

  **The Learned Agent Wrinkle:** Your agents lack explicit utility functions; they have mandates and behavioral priors derived from training. Consequently, "rationality" is not a specification but an empirical invariant—a statistical regularity observed in validation runs. "Common Knowledge of Rationality" translates to "Common Belief in Behavioral Regularity." The epistemic logic remains structurally identical, but the truth values of atomic propositions (e.g., "agent $i$ maximizes utility") are probabilistic estimates rather than logical certainties. The epistemic characterizations survive as descriptive models of emergent behavior, not normative guarantees of correctness.

  ### Residue Report I: The Common Prior

  Your first suspicion is correct. The **Common Prior Assumption (CPA)** maps directly to a shared initial state and a shared state-transition function (update rule). In distributed systems, processes may start with different initial values (configurations). In game theory, the CPA forbids this: differences in belief must arise solely from differences in information (observation histories), not from differences in initial configuration.

  The "agree-to-disagree" theorem translates precisely to a consensus impossibility result. If agents start with a shared prior and their posterior beliefs become common knowledge, they must agree. If they disagree, either the prior was not shared, or common knowledge was not attained. In your async auction, this means agents with different training data (different initial states) can legitimately maintain divergent valuations without violating rationality. The residue here is normative, not technical: Game theory treats the CPA as a requirement of rationality; distributed systems treat it as a configuration choice. The translation holds, but the implication shifts from "they are irrational if they disagree" to "they are configured differently."

  ### Residue Report II: Common Knowledge and Synchrony

  Your second suspicion is also correct. **Simultaneous Common Knowledge** of any non-trivial fact is impossible in asynchronous systems with unreliable communication (the Halpern-Moses result). This places solution concepts requiring Common Knowledge of Rationality (like some justifications for Nash) in the same class as the Coordinated Attack problem: mathematically coherent but unimplementable in your async environment.

  The literature's retreat to **common $p$-belief** (everyone believes with probability $p$) is indeed analogous to weakening synchrony assumptions in protocol design, such as moving from perfect failure detectors to probabilistic ones. It trades exactness for implementability. However, the resemblance is not merely a pun; it is a structural equivalence. Just as probabilistic consensus sacrifices guaranteed termination for liveness in adverse conditions, $p$-belief equilibria sacrifice predictive sharpness for existence in asynchronous settings. The residue is that the solution concept becomes a set of probable behaviors rather than a deterministic prediction. For engineering, this means you cannot verify convergence to a single equilibrium point, only containment within a bounded region of strategy space.

  ### Residue Report III: Off-Path Beliefs

  Your third suspicion identifies the deepest fracture. In verification, unreachable states are dead code; specifications do not constrain behavior there. In game theory, **off-path beliefs** are load-bearing. A sequential equilibrium requires agents to hold specific beliefs even at information sets assigned probability zero by the equilibrium strategy.

  Why? Because these counterfactual beliefs determine *why* the state is unreachable. They represent the threat of punishment that deters deviation. In your vocabulary, this is not a safety property on the actual run; it is a robustness property against Byzantine deviation. It requires specifying how a process *would* react if another process violated the specification, even if the specification assumes no violations.

  Game theorists insist on this because without off-path constraints, non-credible threats cannot be ruled out. A process might threaten a mutually destructive action to force a favorable outcome. If the threat is not rational to execute when reached, the equilibrium is unstable. In distributed systems, we usually assume processes follow the protocol (crash faults) or act arbitrarily (Byzantine). Game theory assumes processes act strategically *within* the protocol. The off-path requirement forces the "protocol" to be stable against strategic deviations.

  This requirement has no direct counterpart in standard model checking. We check what *does* happen, not what *would* happen if a process chose an action the model says it won't. The translation fails here because distributed systems verification is trace-based, while equilibrium analysis is stability-based.

  ### The Deepest Residue

  The off-path requirement is the deepest source of residue. The Common Prior issue is a configuration mismatch; the Common Knowledge issue is a synchrony limitation with known workarounds ($p$-belief). The off-path issue reveals a category error between the disciplines.

  Distributed systems verification asks: "Does this execution satisfy the spec?" Game theory asks: "Is this execution stable against deviations?" The latter requires reasoning about counterfactual runs that the former explicitly prunes. For your negotiation agents, this is a critical blind spot. You are likely verifying safety (no invalid bids) and liveness (trades occur), but you are not verifying stability (no agent wants to deviate given their beliefs about others' reactions to deviation).

  This is not evidence that game theory is indeterminate; it is evidence that your verification framework is incomplete for strategic systems. You need to model counterfactual stability, not just actual traces. When rationality is empirical (learned agents), this becomes even harder: you must validate that the agents' learned responses to off-path events are credible threats, not hallucinations. If an agent learns to bluff destructively, standard verification won't catch it unless the bluff is executed. Game theory demands you check the bluff's credibility before it happens.

  \answer{off-path}
