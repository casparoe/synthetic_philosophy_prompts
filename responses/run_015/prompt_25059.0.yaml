          *   *The "Logic" aspect:* Validity in PL is model-theoretic. Validity in Ethics is often tied to *consistency of attitudes*. If I disapprove of A, and A implies B, am I *irrational* if I don't disapprove of B? This is about *normative* consistency, not just truth preservation.
          *   *Key Distinction:* The F-G problem isn't just "make it compose." It's "make it compose *without making it descriptive*." If you solve it by making moral sentences propositions (Gibbard's later work leans this way), Realists say "You've surrendered." Expressivists say "We saved the phenomenon." The tension is maintaining the *non-cognitive* nature while gaining *cognitive* structure.

  7.  **Refining the PL Analogies:**
      *   *Effect Systems:* Moral judgment as an effect? `IO`? No, because it's not causal.
      *   *Continuations:* The "force" is like the continuation. Embedding captures the continuation without executing it. This is a strong analogy (Barker uses this).
      *   *Substructural Logics:* Maybe linear logic? (Resources = commitments).
      *   *Best Fit:* **Dynamic Semantics / Update Semantics.** Moral assertions update the "normative common ground." Embedding checks if an update *would* be consistent.

  8.  **Finalizing the Structure:**
      *   **Introduction:** Validate the intuition (Yes, it's compositionality).
      *   **Part 1: The Translation:**
          *   Realism = Boolean Semantics.
          *   Naive Expressivism = Side-effectful/Pragmatic Semantics (Top-level only).
          *   F-G = Scope/Delimitation Error.
          *   Solutions = Denotational lifting (Gibbard = Possible Worlds over Plans; Blackburn = Logic of Commitments).
      *   **Part 2: The Residue Report:**
          *   Clean Translations (Compositionality, Embedding).
          *   Fudged Translations (The nature of "Validity").
          *   The Missing Piece (Internalism/Motivation).
      *   **Part 3: The Verdict:** Is it *just* compositionality?
          *   No. It's compositionality + *Constraint Satisfaction*. The constraint is "Must remain non-representational." In PL, we don't usually have a constraint that says "Your types must compose BUT you cannot use standard data structures."
          *   The "Logic" is actually about *Rationality*, not Truth.

  9.  **Self-Correction/Review during drafting:**
      *   *Caution:* Don't oversimplify Gibbard. He moved from Expressivism to Norm-Expressivism to a kind of Realism. Stick to the *Norm-Expressivism* phase for the F-G solution.
      *   *Caution:* Don't imply PL semantics is value-free. But acknowledge the difference between defining a logic and justifying it as *rational*.
      *   *Tone Check:* Ensure I'm speaking to a peer, not lecturing. Use terms like "denotation," "evaluation context," "type error."

  10. **Final Polish:** Check against the prompt's specific request for "Residue Report" and the specific question about whether it reduces to compositionality. (The answer should be nuanced: Structurally yes, Philosophically no).

  *(Self-Correction on the "Continuation" analogy)*: Some philosophers (like Barker) explicitly use continuations. I should mention that. It maps "assertion force" to the current continuation. Embedding suspends the continuation.

