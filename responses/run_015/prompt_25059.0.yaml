      *   **Topic:** The Frege-Geach (F-G) problem in metaethics (specifically for Expressivism/Non-Cognitivism).
      *   **Goal:** Translate the F-G dialectic into PL semantics vocabulary (types, contexts, denotations, etc.).
      *   **Specific Questions:**
          1.  Restate the problem and solutions (Gibbard, Blackburn, etc.) using PL terminology.
          2.  Provide a "Residue Report": What translates well? What is fudged? What is missing?
          3.  **Crucial Question:** Is F-G *just* a compositionality problem (familiar to PL), or is there something specific to metaethics that doesn't reduce to "denotations don't compose"?
      *   **Tone/Style:** Expert, precise, honest (not forced), careful.

  2.  **Deconstruct the Frege-Geach Problem (Philosophical View):**
      *   *Expressivism:* Moral sentences express attitudes (e.g., disapproval), not truth-apt propositions.
      *   *The Problem:* Logic requires truth-apt contents to preserve validity (e.g., Modus Ponens). If "Wrong(Lying)" is just an attitude, how does it function in "If Wrong(Lying) then Wrong(Encouraging)"? The attitude isn't being expressed in the antecedent.
      *   *The Challenge:* Provide a semantics where moral sentences have the *same* content in asserted and unasserted contexts, allowing logical operators to function normally, without collapsing into Cognitivism (moral realism).

  3.  **Map to PL Semantics Vocabulary:**
      *   *Atomic Sentences:* Terms of a specific type.
      *   *Asserted/Root Position:* Top-level evaluation, side effects, or continuation capture.
      *   *Embedded Position:* Arguments to functions (conditionals, negation).
      *   *Expressivist Semantics:* Denotation is not a `Bool` (truth value) but something like `Attitude` or `Plan`.
      *   *Compositionality:* The meaning of a compound term is a function of the meanings of its parts.
      *   *Logical Operators:* Functions like `implies : A -> A -> A`.
      *   *Validity:* Preservation of some property (truth, or "acceptability", or "consistency of plans").

      *   *Mapping Attempt:*
          *   Cognitivism: `[[ P ]] : Prop` (or `Bool`). Logic is standard boolean algebra.
          *   Naive Expressivism: `[[ P ]] : Attitude`. But `If` expects `Prop`. Type error!
          *   F-G Problem: Type mismatch / Lack of compositional semantics for logical connectives over the `Attitude` type.
          *   Solutions: Define a new type `Moral` that supports logical operations, or lift `Attitude` into a monad, or use continuation-passing style (CPS) to handle the "force".

  4.  **Analyze Specific Solutions (PL Translation):**
      *   *Blackburn (Quasi-Realism):* Tries to mimic realist discourse. In PL terms: Define an interface (typeclass) for moral sentences that looks like `Bool` but implements `Attitude` logic underneath. "Logic of attitudes."
      *   *Gibbard (Norm-Expressivism/Planology):* Meaning is a set of consistent plans (hyperplans). `[[ P ]]` is a set of worlds/plans where P is accepted. This looks a lot like possible worlds semantics (Kripke frames).
          *   *PL View:* Denotational semantics over a domain of "normative systems." Logical connectives are set operations (intersection, union, complement).
      *   *Schroeder (Hybrid Expressivism):* Moral sentences have *both* descriptive and expressive content.
          *   *PL View:* Product types `(Desc, Expr)`. Logic operates on the `Desc` part, pragmatics on the `Expr` part.
      *   *Barker/Chrisman (Modal/Continuation approaches):* Some explicitly use modal logic or dynamic semantics.
          *   *PL View:* Dynamic semantics = State monad. Updates to the common ground.

  5.  **Drafting the Translation (Iterative Refinement):**
      *   *Start:* Acknowledge the user's intuition. Yes, it *is* a compositionality problem.
      *   *The Setup:*
          *   Realism: `[[ e ]] : TruthValue`.
          *   Expressivism: `[[ e ]] : ConativeState`.
          *   Connectives: `and : TruthValue -> TruthValue -> TruthValue`.
          *   Error: `and` cannot take `ConativeState`.
      *   *The "Force" Distinction:* In speech act theory (and some PL pragmatics), there's a distinction between *content* and *force*. Expressivists conflate them. F-G says you must separate them to handle embedding.
      *   *Gibbard:* `[[ e ]]` is a function from `Hyperplan -> Bool`. This is basically `World -> Bool` (Proposition) but the "World" includes normative standards. It's a Kripke semantics where accessibility relations are normative consistency.
      *   *Blackburn:* Commitment logic. Types represent commitment states.

  6.  **Addressing the "Residue Report" (The Core Insight):**
      *   *What translates:* The structural problem is exactly type safety/compositionality. The solutions look like defining new domains for denotational semantics.
      *   *What is fudged:* The notion of "action-guidingness." In PL, semantics is usually descriptive. In ethics, semantics is supposed to *motivate*. This is the "Internalism" constraint.
      *   *What is missing:* The *normative authority* aspect. Why *should* we accept the logic? In PL, logic is defined by the model. In ethics, logic is supposed to track rationality/reasons.
      *   *The "Is it just compositionality?" Question:*
