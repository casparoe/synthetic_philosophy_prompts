answer: |-
  You are not flattening it too much. Your intuition is structurally sound: the Frege–Geach (F-G) problem is, at its core, a failure of **compositionality** in a semantics that treats atomic sentences as having a different type than the inputs expected by logical operators.

  However, the reason it has kept metaethicists busy for 60 years is not that the technical fix is hard (it isn't), but that there is a **constraint satisfaction problem** attached to it. You cannot just fix the types; you must fix the types *without violating the expressivist's core ontological commitment* (that moral judgments are not representations of fact).

  Here is the translation of the dialectic into PL semantics vocabulary, followed by the residue report you asked for.

  ---

  ### Part 1: The Translation

  #### 1. The Setup: Types and Denotations
  Let's model a language $\mathcal{L}$ with atomic sentences $p, q$ and connectives $\neg, \to$.

  *   **Cognitivism (Realism):**
      *   **Denotation:** $[[ \cdot ]] : \text{Sentence} \to \text{Prop}$ (where $\text{Prop} \cong \text{World} \to \text{Bool}$).
      *   **Logic:** Standard boolean algebra on $\text{Prop}$.
      *   **Assertion:** A top-level evaluation context that checks if $[[p]]$ holds in the actual world.
      *   **Status:** Type-safe. Compositionality holds trivially.

  *   **Naive Expressivism:**
      *   **Denotation:** $[[ \cdot ]] : \text{Sentence} \to \text{Attitude}$.
      *   **Atomic:** $[[ \text{Lying is wrong} ]] = \text{BOO}(\text{Lying})$. Type is $\text{Attitude}$.
      *   **Assertion:** A speech act constructor $\vdash : \text{Attitude} \to \text{SpeechAct}$.
      *   **The Bug:** The conditional operator $\to$ expects arguments of type $\text{Prop}$ (to compute truth conditions), but receives $\text{Attitude}$.
      *   **F-G Problem:** A **type error** in the semantic algebra.
          *   In `If p then q`, $p$ is in a neutral evaluation context. It is not being executed (asserted). It is being passed as data to $\to$.
          *   If $[[p]]$ is an *act* of disapproval, you cannot pass an *act* as data to a function without performing it.
          *   **PL Analogy:** This is like trying to pass an `IO ()` action as a pure `Bool` argument to a function. `if (print "boo") then ...` is ill-typed in a pure language.

  #### 2. The Challenge: Compositionality under Constraint
  The expressivist needs to define a type $\text{Moral}$ and operators $\neg_{\text{m}}, \to_{\text{m}}$ such that:
  1.  **Compositionality:** $[[ A \to B ]] = [[ A ]] \to_{\text{m}} [[ B ]]$.
  2.  **Embedding:** $[[ A ]]$ has the same type in root and embedded positions.
  3.  **Validity:** Modus Ponens preserves "correctness" (however defined).
  4.  **The Constraint:** $\text{Moral}$ cannot be $\text{Prop}$. It must remain fundamentally conative (action-guiding/plan-laden), or the expressivist collapses into realism.

  #### 3. The Solutions (Semantics Engineering)

  **A. Blackburn's Quasi-Realism (Logic of Commitments)**
  *   **Semantics:** Higher-order logic over attitudes.
  *   **Type:** Sentences denote **commitment states**.
  *   **Mechanism:** He defines a logic where the "truth" of a moral sentence is its **consistency** within a system of attitudes.
  *   **PL View:** This is akin to **Effect Systems** or **Type-and-Effect**. The "value" is the effect itself. Logical consistency is checked via a type system over commitments.
  *   **The Fix:** $\to_{\text{m}}$ is defined as: "To accept $A \to B$ is to have a higher-order attitude such that if you acquire the attitude $A$, you are committed to acquiring attitude $B$."
  *   **Critique:** It looks like a hacky wrapper around boolean logic. It mimics the interface of $\text{Prop}$ without the implementation.

  **B. Gibbard's Norm-Expressivism (Hyperplans)**
  *   **Semantics:** Possible-worlds style, but the "worlds" are **hyperplans** (complete systems of norms/plans).
  *   **Type:** $[[ A ]] : \text{Hyperplan} \to \text{Bool}$.
  *   **Mechanism:** A moral sentence is true relative to a plan if the plan permits it.
  *   **PL View:** This is standard **Kripke Semantics** (Modal Logic).
      *   World $W$ $\leadsto$ Hyperplan $H$.
      *   Accessibility Relation $R$ $\leadsto$ Normative Consistency.
      *   $[[ A \to B ]] = \lambda H. \text{if } [[A]](H) \text{ then } [[B]](H)$.
  *   **The Fix:** He lifts the denotation from $\text{Attitude}$ to $\text{Plan} \to \text{Bool}$. This restores compositionality because the output is now a function (a proposition-like object) that can be embedded.
  *   **Critique:** Realists argue this *is* realism. If $[[A]]$ is a function from plans to bools, it looks like a proposition about plans.

  **C. Dynamic Semantics / Continuations (Barker, Chrisman)**
  *   **Semantics:** Meaning is a change in the **Normative Common Ground**.
  *   **Type:** $[[ A ]] : \text{Context} \to \text{Context}$ (State Monad).
  *   **Mechanism:** Assertion updates the context. Embedding checks if an update *would* be consistent.
  *   **PL View:** **Continuation-Passing Style (CPS)** or **Dynamic Logic**.
      *   Root position: Run the continuation (update the context).
      *   Embedded position: Capture the continuation (check the update function).
      *   $[[ \text{If } A \text{ then } B ]]$ tests whether updating the context with $A$ necessitates updating with $B$.
  *   **The Fix:** Distinguishes *force* (executing the continuation) from *content* (the function itself). F-G arises from confusing force with content.

  ---

  ### Part 2: The Residue Report

  Here is where the translation strains. You asked what translates cleanly, what is fudged, and what is missing.

  #### 1. What Translates Cleanly
  *   **The Structural Problem:** You are correct. F-G is exactly the observation that a semantics defined only for evaluation at the top-level (root expression) fails when terms are passed as arguments to functions (logical connectives).
  *   **The Solution Space:** The philosophical solutions map 1:1 to standard PL moves:
      *   Lifting types (Gibbard).
      *   Separating content from force via CPS (Barker).
      *   Defining custom algebras over effects (Blackburn).
  *   **Validity:** In PL, validity is preservation of a property (truth, termination, type safety). In metaethics, validity is preservation of *acceptability* or *consistency of plans*. The structural definition is identical.

  #### 2. What You Have to Fudge
  *   **The Nature of "Truth":** In PL, we usually know what `Bool` means. In metaethics, the expressivist is terrified of `Bool`. They want a type that *behaves* like `Bool` (supports $\to, \neg$) but *isn't* `Bool` (doesn't represent mind-independent facts).
      *   *Fudge:* In the translation, I treated Gibbard's `Hyperplan -> Bool` as a standard function. But for the expressivist, the `Bool` here doesn't mean "corresponds to reality"; it means "is permitted by the plan." You have to ignore the metaphysical weight of that distinction to make the types line up.
  *   **Motivation (Internalism):** In PL, semantics is descriptive. In ethics, semantics is supposed to be **motivating**.
      *   *Constraint:* If $[[ \text{Wrong}(A) ]]$ is just a proposition (even about plans), why does believing it *move me to act*?
      *   *Fudge:* PL semantics doesn't track "motivation to execute." We model effects, but we don't model the *agent's drive* to trigger the effect. The expressivist needs the semantics to explain why moral judgment entails motivation. Realist semantics doesn't need to do this.

  #### 3. What Has No Counterpart (The Missing Piece)
  *   **Normative Authority:** In PL, if I define a logic where $A \to B$ holds, that's just a definition. In metaethics, logic is tied to **Rationality**.
      *   The F-G problem isn't just "make the types compose." It's "make the types compose such that violating the logic counts as *irrational*, not just a type error."
      *   There is no PL analogue for "This type error constitutes a failure of rationality." A type error is just a crash. A logical inconsistency in ethics is a failure of the *agent*.
  *   **The "Collapse" Worry:** In PL, if you refactor code to make it compose, and it works, you're done. In metaethics, if you refactor the semantics to make it compose, and it looks like Realism, **you lose**.
      *   Expressivism is defined by what it *isn't* (Realism). The technical solution must not solve the problem by surrendering the starting position.
      *   *PL Analogy:* Imagine you are tasked with implementing a `Promise` type, but you are forbidden from using any form of asynchrony or state. If you solve it by just using `Identity`, you technically satisfied the interface, but you failed the constraint.

  ---

  ### Part 3: The Verdict

  **Is the Frege–Geach problem just the observation that expressivists need a compositional semantics?**

  **Structurally: Yes.**
  If you strip away the metaphysics, F-G is the complaint: "You have defined a semantics for $\mathcal{L}_{atomic}$ but failed to define a denotational algebra for $\mathcal{L}_{compound}$." It is a complaint about scope delimiters and evaluation contexts. Any PL PhD would look at naive expressivism and say, "You're confusing values with effects. Lift the effects into the type."

  **Philosophically: No.**
  There is a residue that does not reduce to compositionality. It is the **Constraint of Non-Representationalism.**

  In PL, if your denotations don't compose, you change the denotations until they do. If that means treating `IO` actions as first-class values (which they are in Haskell), you do it.
  In Metaethics, the Expressivist says: "I cannot treat moral judgments as first-class values (propositions) because that implies they describe the world."

  So the F-G problem is actually a **impossibility proof challenge**:
  > "Construct a compositional semantics for moral language where the denotation of atomic sentences is non-cognitive, and where logical validity preserves rational consistency rather than truth."

  **What you might be missing:**
  The debate isn't about *whether* it can be done (most agree Gibbard/Blackburn showed it *can* be done technically). The debate is about whether the resulting semantics is **explanatorily adequate**.

  *   **Realist Objection:** "You solved compositionality by making moral sentences denote functions from plans to truth-values. That *is* a proposition. You're a realist now."
  *   **Expressivist Reply:** "No, the truth-values are relative to plans. It's still about *us*, not the *world*."

  **Summary for your mental model:**
  Think of F-G as a **type-class coherence problem**.
  1.  Expressivists want an instance `MoralSemantics` that behaves like `BooleanAlgebra`.
  2.  They also want `MoralSemantics` to be distinct from `PropositionalSemantics`.
  3.  F-G shows the default instance fails.
  4.  Solutions provide new instances.
  5.  **The Residue:** The philosophical fight is whether the new instance is *actually* distinct from `PropositionalSemantics` or if it's just `PropositionalSemantics` renamed.

  You are right to see it as a compositionality problem. But in PL, compositionality is the goal. In Metaethics, compositionality is a constraint that fights against the primary goal (non-cognitivism). That tension is what generates the decades of literature.
