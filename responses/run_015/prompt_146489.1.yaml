answer: |-
  # The Common Ground Diagnostic (CGD)

  **Purpose:** To determine in 10 minutes whether a disagreement is solvable by talking, requires authority, or is a clash of values.
  **Time Cap:** 10 minutes maximum. If not finished, stop and move to Verdict.
  **Mediator Role:** Neutral referee. You do not solve the problem yet; you diagnose the type of problem.

  ### Phase 1: Fact or Value? (2 Minutes)
  **Mediator Script:** "We need to know what kind of disagreement this is. Is this about *what happened* (a fact), or *what should happen* (a rule or value)?"
  *   **Action:** Write the core disagreement on the whiteboard/paper as a single sentence.
  *   **Test:** Ask both parties, "If we could prove this sentence true or false, would the fight be over?"
      *   **Yes:** It is a **Fact**. Proceed to Phase 2.
      *   **No:** It is a **Value**. (e.g., "Should quiet hours be strict?")
  *   **Verdict:** If Value, stop here. **HAND_TO_VALUES**.

  ### Phase 2: The Evidence Swap (3 Minutes)
  **Mediator Script:** "You both have a conclusion. I need to know *why*. Party A, what is the one piece of information that makes you sure? Party B, same question."
  *   **Constraint:** No numbers. Use: *Certain, Likely, Guessing.*
  *   **The Black Box Rule:** If a party says, "I know something I can't share (confidential/source protected)," the Mediator writes: *[Private Evidence Held]*.
      *   **Instruction:** If *both* hold private evidence they won't share, you cannot reach common knowledge.
      *   **Verdict:** **RECORD_IMPASSE**. (You cannot mediate secrets).
      *   **Instruction:** If *one* holds private evidence, ask: "If Party B knew what you know, would they agree with you?"
          *   If "Yes": Proceed to Phase 3.
          *   If "No": Their priors are too different. **ESCALATE**.
  *   **Action:** Mediator reads both reasons back to the room. "Party A believes X because of [Reason]. Party B believes Y because of [Reason]."

  ### Phase 3: The Prior Check (2 Minutes)
  **Mediator Script:** "Sometimes people see the same thing but expect different outcomes based on past experience. Do you both agree on the rules or the baseline here?"
  *   **Example:** "Do we agree that quiet hours start at 10 PM?" or "Do we agree that copying from a shared sheet is allowed if cited?"
  *   **Test:** If one says "It's a rule" and the other says "It's just courtesy," they do not share a prior.
  *   **Verdict:** If Priors differ on the rule/norm, **HAND_TO_VALUES**.
  *   **Verdict:** If Priors differ on safety/risk (e.g., "Is this message dangerous?"), **ESCALATE**. (Do not mediate risk tolerance).

  ### Phase 4: The Update Test (3 Minutes)
  **Mediator Script:** "You have now heard the other side's reason. Knowing what they know, does your confidence change? You don't have to agree yet, just tell me if you moved."
  *   **Options:** *Moved Closer, Stayed Same, Moved Away.*
  *   **Diagnosis:**
      *   If both *Moved Closer*: **KEEP_TALKING**. (Proceed to 15-min mediation).
      *   If both *Stayed Same* despite identical evidence and rules: One or both are not updating.
      *   **Mediator Script for Bad Faith:** "I need to pause us. We have the same information and the same rules, but your positions haven't moved. Logic tells us that if we see the same things, we should end up in the same place. If we aren't, it means one of us isn't actually trying to find the truth. Are you arguing to win, or are you willing to change your mind if the evidence points that way?"
      *   **Record:** Write "Diagnostic Failure: Posterior did not update on common evidence."
      *   **Verdict:** **RECORD_IMPASSE**.

  ### Phase 5: The Clock Rule
  *   **If the bell rings during Phase 1-4:** Stop immediately. **ESCALATE**. (Incomplete diagnostics are unsafe).
  *   **If the bell rings during Mediation (after CGD):** Do not split the difference. If no agreement, **RECORD_IMPASSE**.

  ---

  ### Worked Cases

  **Case 1: Lab Partners (Copying Accusation)**
  *   **Phase 1 (Fact/Value):** Disagreement is "Did Party B copy numbers?" This is a Fact. (Pass)
  *   **Phase 2 (Evidence):** Both have seen the same spreadsheet and edit history. Evidence is Common Knowledge. No private evidence claimed. (Pass)
  *   **Phase 3 (Priors):** Both agree on the definition of academic dishonesty. (Pass)
  *   **Phase 4 (Update):** Mediator points out the edit history is identical. Party A says "They copied." Party B says "I didn't." Neither moves. They have the same data but refuse to converge on the inference.
  *   **Diagnosis:** Under Aumann, identical evidence + identical priors = identical conclusion. Since they disagree, one is not updating honestly (lying or stubborn). Mediation cannot force truth.
  *   **Mediator Action:** Read the Bad Faith Script. Record the failure to update.
  *   **Verdict:** RECORD_IMPASSE

  **Case 2: Roommate Dispute (Noise)**
  *   **Phase 1 (Fact/Value):** Surface claim: "Is it loud?" (Fact). Deep claim: "Do quiet hours matter?" (Value). Mediator asks: "If we prove it is loud, is the fight over?" Party A says "Yes, they must stop." Party B says "No, it's my room."
  *   **Diagnosis:** The disagreement is not about the decibel level; it is about the authority of the rule versus personal liberty.
  *   **Phase 3 (Priors):** Party A treats it as a Rule. Party B treats it as Courtesy. Priors do not match.
  *   **Diagnosis:** This is not a factual disagreement solvable by evidence. It is a normative conflict.
  *   **Mediator Action:** Stop Fact finding. Acknowledge the clash of norms.
  *   **Verdict:** HAND_TO_VALUES

  **Case 3: Group Chat Threat**
  *   **Phase 1 (Fact/Value):** "Was this a serious threat?" This is a Fact (intent/probability), but carries Safety implications.
  *   **Phase 2 (Evidence):** Both read the same message. Both know the sender. Evidence is Common Knowledge.
  *   **Phase 3 (Priors):** Party A (your friend) says "It was a joke." Party B says "It was a threat." They agree on the words, but disagree on the risk baseline.
  *   **Diagnosis:** This is a divergence in Risk Priors. One student has a lower threshold for danger than the other.
  *   **Constraint Check:** The prompt specifies safety/threats. Even if Aumann suggests they *should* agree on probability given common info, threat assessment is a safety protocol issue, not a peer negotiation. Divergent priors on safety are a hard stop for mediation.
  *   **Honest Output:** You want to mediate, but the procedure flags that their baseline assessment of danger is incompatible. This requires an authority figure to assess the threat level, not peers.
  *   **Mediator Action:** Do not attempt to converge their risk tolerance.
  *   **Verdict:** ESCALATE

  Verdict: RECORD_IMPASSE
  Verdict: HAND_TO_VALUES
  Verdict: ESCALATE

  If you see the same evidence and start from the same rules, you must end up in the same place; if you don't, stop talking and check why.

  \answer{Case 1: RECORD_IMPASSE; Case 2: HAND_TO_VALUES; Case 3: ESCALATE}
