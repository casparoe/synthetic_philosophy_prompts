      *   **Bride (Nora):** Violinist. Not a philosopher. Zero patience for being described as a "good outcome."
      *   **Audience:** 50% Philosophy/EA crowd (will hear echoes/technical terms), 50% Nora's family (musicians, teachers, small town; will hear tone).
      *   **Constraint/Problem:** The Best Man previously tried a "optimal partner/search" joke and it bombed. The user fears explaining *why* the couple's anniversary ritual works will ruin it (the "Williams objection": adding a justificatory thought to affection makes it alienating).
