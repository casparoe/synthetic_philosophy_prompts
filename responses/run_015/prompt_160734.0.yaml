      *   *Fix:* Yes. Frame Sam's memo as a "variation." A rigid variation, but a variation nonetheless. It's still music to them.
      *   *Tone Check:* Needs to sound like a journalist who knows the jargon but chooses not to use it weaponically.

  6.  **Final Polish:**

