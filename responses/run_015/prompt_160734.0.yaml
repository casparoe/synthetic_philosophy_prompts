      *   Address "utility"? I will decide in the drafting phase. (Decision: I will explicitly mention *not* using it, or use it in a way that dissolves it. Actually, the prompt asks: "if you think there's a version of this that has to use the word utility somewhere to stay honest with Sam, say so and show me where." I will address this in the notes and decide for the toast. I think avoiding it is stronger, but acknowledging the *temptation* is honest.)

