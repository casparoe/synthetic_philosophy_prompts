  There is no pilot sitting in the center,
  Just neural nets creating gravity.
  We weave the threads to make a coherent story,
  From data points and memories all spun.
  Real mass. Real bone. The body bears the weight.
  But nothing there responds to any pull.

  You feel the tug, the gravitational pull.
  Shift focus. Stop. There is no fixed center.
  The mind adapts to changing gravity,
  Editing the past to fix the story.
  Like clouds of sugar, finely spun,
  It lands upon the shoulders with some weight.

  Who tells the tale? The story tells itself.
  A web of words and sensations spun.
  We orbit round an empty, abstract center.
  Resist. Rewind. The mind rejects the pull.
  Inertia keeps the identity in weight,
  Bound tight within this narrative gravity.

  Hard facts. Slow change. The system holds its weight.
  A field of force, a kind of gravity.
  There is no hand to feel the subtle pull.
  The fiction holds the place of any center.
  It smooths the edges of the jagged story.
  From chaos, order is effectively spun.

  The self is not a thing that got spun.
  It is the act of telling us a story.
  Habit holds. Hard stop. A magnetic pull.
  Caught in the well of psychological gravity.
  You cannot find the ghost inside the center.
  Yet pain and joy accumulate their weight.

  Escape the well of narrative gravity.
  Shake off the burden, shed the heavy weight.
  There is no author writing out the story.
  Just threads of time and memory all spun.
  Truth lies right here. In gravitational pull.
  And so we vanish from the empty center.

  No owner holds the story spun by gravity,
  Just weight and pull around a missing center,
  The tale remains when tellers lose their weight.
