answer: |-
  **First Thing on the Board:**
  $$ (T + A) \rightarrow P $$
  $$ \neg P $$
  $$ \therefore \neg T \text{ or } \neg A? $$

  **Reasoning:**
  This forces the logical structure of the Duhem-Quine thesis into the room before you mention Malthus, food, or population. It signals immediately that this is not a history lesson but a logic puzzle about where the blame lands when a prediction fails. It prevents them from settling into the comfortable undergrad narrative that "Malthus was wrong" is a settled fact.

  **40-Minute Lesson Plan:**

  **0:00–0:05: The Logical Trap**
  *   **Action:** Write the equation above. Define terms: $T$ (Core Theory), $A$ (Auxiliary Hypotheses/Initial Conditions), $P$ (Prediction).
  *   **Talk:** "Popper says science progresses by falsification. But logic dictates you never test a theory in isolation. You test a theory bundled with assumptions. Today we use Malthus to find out where the body is buried."
  *   **Dependency Order:** Start with the **Claim (Positive Checks)**, not the growth rates.
      *   *Why:* The growth rates (geometric vs. arithmetic) are the internal engine ($T$), but the Claim ("mass famine prevents population explosion") is the Prediction ($P$). Students need to see the failed prediction first to feel the pressure of falsification.
      *   *Board:* Add "Malthus 1798: $P$ = Subsistence Crisis by 1900."

  **0:05–0:15: The Core Theory ($T$) and The Failure ($\neg P$)**
  *   **Action:** Briefly explain the geometric vs. arithmetic mechanism only enough to show why $P$ seemed inevitable. Then show the data: 1900 arrives, population up, calories per capita up, no global Malthusian crisis.
  *   **Defuse Misconception 1 ("Falsified = Dead"):**
      *   *Where:* Right after revealing $\neg P$.
      *   *How:* Ask: "By strict Popperian standards, $T$ is dead. Why do we still discuss it?" Elicit that scientists rarely abandon core theories on one miss. They suspect the bundle ($A$) was wrong, not the engine ($T$).

  **0:15–0:25: The Rescue Mechanism (Choosing $A$)**
  *   **Carrying Example:** Use the **Green Revolution**, not climate models.
      *   *Why:* Climate models are themselves theoretical bundles; the Green Revolution provides historical, measured data on yield increases (empirical teeth). It shows $A$ (technology stays static) was the false auxiliary, not $T$ (population pressures resources).
      *   *Action:* Show that Malthus assumed static technology ($A_1$). The Green Revolution proves $A_1$ was false.
      *   **Defuse Misconception 2 ("Rescue = Cheating"):**
          *   *Where:* When introducing the Green Revolution.
          *   *How:* Distinguish *ad hoc* from *independent*. An ad hoc rescue is "Malthus was wrong about the date." A legitimate rescue is "New variable identified (synthetic fertilizer) that exists independently of the population crisis and is measurable."
      *   **Defuse Misconception 3 ("Ignorance of Technology"):**
          *   *Where:* Immediately following the Green Revolution point.
          *   *How:* Clarify that Malthus wasn't "stupid"; he operated under a *ceteris paribus* clause common to economics. The error was treating a contingent condition (tech stagnation) as a law of nature.

  **0:25–0:35: Long-Run vs. Short-Run Logical Shape**
  *   **Action:** Introduce the Demographic Transition as a second auxiliary.
      *   *Talk:* "Short-run predictions fail if timing is off. Long-run predictions fail if the mechanism doesn't exist. Is population pressure a delayed mechanism or a falsified one?"
      *   *Key Point:* If the mechanism (resource scarcity leading to misery) is delayed by auxiliaries (tech, birth control), the core theory ($T$) remains viable *only if* it can specify when the auxiliaries run out.
      *   *Board:* Update equation: $(T + A_{new}) \rightarrow P_{delayed}$.

  **0:35–0:40: Conclusion and Assessment**
  *   **Action:** Summarize that rescuing a theory is valid science *if* the rescue generates new, testable predictions (e.g., "If fertilizer use peaks, crisis returns").
  *   **End-of-Session Question:**
      "If global famine occurs in 2100 due to resource limits, does that validate Malthus's core theory ($T$) or merely confirm that his auxiliary conditions ($A$) were temporarily suspended?"
      *   *Correct Answer:* It validates $T$ only if the famine is caused by the geometric/arithmetic mismatch specifically, not just generic scarcity. It confirms the auxiliaries (tech limits) were reached. The distinction checks if they see $T$ and $A$ as separable.

  **What to Leave Out:**
  *   **Agricultural Economics:** Do not discuss NPK ratios, specific yield statistics, or land tenure systems. This distracts from the logical structure.
  *   **Modern Food Security Politics:** Do not discuss distribution vs. production debates. That is a normative policy issue, not a philosophy of science issue regarding falsification.
  *   **Biographical Detail:** Do not discuss Malthus's life or the specific editions of the *Essay*. Stick to the 1798 logical structure.
  *   **Lakatosian Deep Dive:** Do not introduce "Research Programmes" terminology (hard core/protective belt) unless necessary. Stick to $T$ and $A$ to keep the logic clean.
