answer: |-
  You have stumbled upon the central tension in the study of nationalism, arguably without needing to wade through the dense prose of Gellner or Hobsbawm to get there. Your intuition is remarkably sharp, particularly regarding the distinction between how a tradition functions versus where it came from.

  There is indeed a coherent principle that reconciles your verdicts, though it requires shifting your focus from *historical accuracy* to *political agency*.

  ### The Principle: Participatory Validity

  The unifying account is this: **A nation is 'real' (ontologically secure) not when its roots are ancient, but when the population actively participates in sustaining the narrative, regardless of its factual veracity.**

  The moral weight you are sensing—the difference between the Scottish kilt and Meiji Japan—does not rest on whether the story is true. It rests on **who owns the imagination**.

  *   **Horizontal/Participatory (USA, Armenia, Scotland):** In these cases, the narrative is sustained because it serves a social function for the people themselves. The Americans agree to the Constitution; the Armenians maintain language to preserve identity against dispersal; the Scots adopted the tartan because it gave them a distinctive cultural marker. Even if the origin is invented (Scotland) or recent (USA), the *agency* lies with the community. They are wearing the costume willingly.
  *   **Vertical/Imposed (Meiji, France 843):** Here, the narrative is sustained to serve the state's need for legitimacy or obedience. In 843, there was no 'French people' to imagine themselves; there were only subjects of a king. In Meiji Japan, the state required the myth of the divine Emperor to enforce modernisation and loyalty. The agency lies with the rulers, not the ruled. The costume is being issued as a uniform.

  This principle resolves your tension regarding the **origin**. You noted that for Scotland, "the present practice is what gives it weight." This is correct. Under Participatory Validity, time acts as a solvent. An invented tradition becomes authentic once the coercion of its origin fades and the community adopts it as their own vocabulary of belonging.

  ### Solving the Troubling Case

  You asked about the post-colonial state that fabricates a 500-year history. Under this principle, the verdict depends entirely on the **second generation**.

  *   **Scenario A (The Meiji Outcome):** If the state must continuously enforce this history through censorship, punishment, or rigid schooling to maintain power, it remains a 'vertical' imposition. It is a tool of control. Your verdict should be that this is inauthentic nationalism, akin to Meiji.
  *   **Scenario B (The Scottish Outcome):** If, after two generations, the citizens embrace this story not because they are forced to, but because it provides them with a sense of dignity, continuity, and social cohesion that they find useful, the agency has shifted. The myth has become participatory. It becomes 'real' in the same way the kilt is real.

  Therefore, you do not need to drop a verdict, but you must refine the Meiji comparison. Meiji is not 'worse' simply because it hid its modernity; it is worse because the hiding was **coercive**. It demanded belief as a condition of citizenship. Scotland hides its modernity too (many Scots believe the tartans are ancient), but no one is imprisoned for questioning the history of the Highland Society.

  ### The Diaspora Question

  This leads to your final query: what happens when a horizontal diaspora (like the Armenians pre-1991) gains a state and begins manufacturing traditions?

  It undergoes a transformation from a **Cultural Nation** to a **State Nation**.

  1.  **The Shift:** As long as the diaspora remains stateless, their bond is purely horizontal and voluntary. You cannot be forced to be part of a diaspora; you opt in through practice. Once they gain a state, the bond becomes verticalised. The state requires borders, taxes, conscription, and a unified curriculum.
  2.  **The Manufacturing:** When this new state manufactures traditions, it is attempting to translate the horizontal bond into a vertical structure.
  3.  **The Verdict:** Does it become 'real' in a different way? Yes. It becomes 'real' as a sovereign entity, but it risks losing the 'authenticity' of the diaspora if the manufacturing is too aggressive.
      *   If the state imposes traditions that the diaspora rejects, the nation fractures (the horizontal bond breaks).
      *   If the state codifies traditions the diaspora already practises, it strengthens the bond.
      *   If the state invents *new* traditions that the diaspora eventually adopts (the Scottish model), it succeeds.

  The danger for a diaspora-turned-state is that in trying to prove it is 'old' enough to deserve statehood, it may adopt the Meiji model (false continuity) rather than the USA model (open modernity). If it chooses the former, it sacrifices the very horizontal solidarity that kept it alive during statelessness.

  ### Conclusion

  Your gut is giving you different answers because you are oscillating between judging the **truth of the past** and the **function of the present**.

  To achieve coherence, you must drop the verdict that historical falsification is inherently disqualifying. Instead, adopt the principle of **Participatory Validity**.

  *   **Ask:** Does this narrative allow the people to speak to one another as equals (Horizontal)?
  *   **Or:** Does this narrative require the people to look up to an authority based on a lie (Vertical)?

  If the post-colonial state's fabricated history allows its citizens to find dignity and coordinate their lives together without coercive enforcement, it is as 'real' as the Scottish kilt. If it requires the suppression of dissent to maintain the illusion, it is as 'false' as the Meiji divine line. The reality of a nation is not in its roots, but in the soil it currently sustains.
