answer: |-
  Your hypothesis that this is a stack of distinct disagreements is understandable, but I suspect it misidentifies the architecture of the impasse. You are not facing three separate problems; you are facing a single category mistake that manifests in three different ways. The core friction is not about whether you want justification or reliability, nor is it merely verbal. It is about the metaphysical status of the possibility space over which your friend averages.

  The diagonalising diagnosis is this: your friend treats the uniform measure over all possible functions as an epistemic neutral baseline, whereas you correctly recognise it as a substantive probabilistic assumption. The No-Free-Lunch (NFL) theorems are mathematically sound, but their philosophical import depends entirely on whether the uniform distribution represents "nature without bias" or merely "one specific model of nature". Your friend assumes the former; you assume the latter. This is why the argument reproduces perfectly: you are arguing about the world, while he is arguing about the properties of a specific mathematical abstraction he mistakes for the world.

  Consider the move regarding the uniform average. Your friend claims that averaging uniformly over all possible worlds represents making "no assumption". This is the pivot point. In statistical learning theory, a uniform prior over all functions is not an absence of bias; it is a maximum-entropy assumption that implies every bit of output is independent of every other bit unless observed. It is a model of pure noise. To say induction fails under this measure is trivial; it is akin to saying navigation fails if the map is drawn randomly. The NFL theorem proves that no algorithm outperforms random search *given that specific model of reality*. It does not prove that no algorithm outperforms random search given *any* model. By treating the uniform measure as the default state of affairs, your friend has smuggled a sceptical premise into the formalism. He is not proving Hume right; he is assuming Humean scepticism (that the world might be pure noise) and showing that induction fails under that assumption.

  This explains the deadlock over the "learnable-worlds restriction". When you restrict the space to worlds that are compressible or learnable, you are effectively changing the prior. Your friend says this yields a free lunch and thus validates science. You say this begs the question by assuming the world is learnable. You are both partially right, but you are talking past one another. He is correct that within a restricted class, biases work. You are correct that restricting the class is an assumption. However, his claim that this restriction is "the precondition of there being a question to ask" is the stronger position, though he misinterprets its force. It is not a logical precondition; it is an empirical one. The question is not "Can we justify induction in all possible worlds?" but "Can we justify induction in the actual world?" The restriction is not smuggling in the uniformity principle as a logical truth; it is acknowledging that the uniformity principle is an empirical hypothesis that happens to be true of our universe.

  This leads to the second layer: justification versus reliability. Your friend demands a formal result that privileges a measure (e.g., simplicity-weighted) to show algorithms dominate. He believes this would settle the Humean problem. You rightly object that weighting by simplicity is just another inductive bias. Here lies the deeper epistemic divergence. Your friend is a foundationalist seeking a guarantee that stops the regress. He wants a theorem that says, "You are safe." You are a naturalist seeking an explanation of success. You want a theory that says, "You are successful because the world fits this model."

  A formal result will never satisfy him because any measure chosen to weight worlds is itself extra-mathematical. One can prove that under a Solomonoff prior, induction works beautifully. But why Solomonoff? Because it weights simplicity highly. Why simplicity? Because that is what we observe. To accept the prior is to accept the induction it licences. Thus, his demand for a formal settlement is a demand for something logic cannot provide: a bridge from "is" to "ought" disguised as a bridge from "measure" to "truth".

  Consequently, your three-way decomposition requires correction. The verbal dispute about "induction" is superficial. The substantive dispute about justification is real, but it is downstream of the formal confusion. The hidden formal question about the privileged measure is the engine driving the car. The impasse is not a sign that the question is ill-posed, but that your friend is asking a question that cannot be answered from within the formalism alone. He wants mathematics to do metaphysics.

  So, what counts as progress? Do not look for a new theorem. There is no formal result that can establish a privileged measure without circularity, because the choice of measure is itself an inductive act. Nor will an empirical finding settle it, because citing predictive success is precisely what he dismisses as circular. Progress requires a conceptual change of question.

  You must persuade him to abandon the search for a "view from nowhere". The NFL theorems show that without assumptions, learning is impossible. This is not a refutation of induction; it is a clarification of its conditions. The justification for induction is not that it works in all possible worlds, but that it works in this one, and that our assumptions (simplicity, locality, continuity) are justified retrospectively by their fit with reality. This is not circular; it is coherentist. We start with biases, test them against the world, and retain those that survive.

  The progress lies in shifting the burden of proof. The sceptic does not get to assume the uniform measure is the null hypothesis. The null hypothesis should be agnostic. If the friend insists that "no assumption" means "uniform over all functions", he has already lost the plot, because that is a very strong assumption indeed. You should argue that the only coherent stance is to admit that we always start with biases, and the "justification" is simply that these biases are compatible with the structure of the universe we inhabit.

  If he refuses this, the argument will never end. He is looking for a logical guarantee against error, which is impossible. You are looking for a reliable method for truth, which is possible. Until he accepts that reliability is the best we can hope for, and that the choice of measure is an empirical gamble rather than a logical necessity, you will remain in the same circle. The impasse is not a failure of intellect on either side, but a collision between a desire for foundational certainty and the reality of naturalised epistemology. Stop trying to solve Hume with learning theory; use learning theory to show why Hume's demand for certainty was the error all along.
