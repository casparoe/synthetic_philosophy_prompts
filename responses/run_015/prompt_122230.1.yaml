  In a philosophy of religion context, the adequacy of a causation theory is not determined by its fit with contemporary analytic intuitions but by its ability to sustain a coherent theology of creation and providence. You must distinguish between requirements that preserve the rationality of faith and those that merely satisfy secular metaphysical preferences.

  **Preserving the Miracle/Nature Distinction (Non-Negotiable)**
  A theory of causation must ontologically distinguish between regular events and miraculous interventions without reducing the difference to mere statistical frequency. If occasionalism defines a miracle simply as a rare divine act and nature as a common divine act, the distinction collapses into probability, rendering revelation unintelligible. The theory must allow for a qualitative difference in *how* God acts—either through established custom or through direct interruption—so that the believer can identify providence without falling into skepticism where every event is equally miraculous. This is non-negotiable because without it, the concept of divine intervention loses its contrast class and theological significance evaporates.

  **Saving Induction from Emptiness (Non-Negotiable)**
  The theory must provide a rational grounding for expecting the future to resemble the past, rather than relying solely on psychological habit. Humean regularity saves induction by lowering the bar to human psychology, but this leaves science without ontological traction. Occasionalism must demonstrate that God’s custom (*adah*) is sufficiently stable to justify scientific prediction, not just hopeful guessing. If the theory implies that God’s actions are radically discontinuous moment-to-moment, induction becomes empty. This is non-negotiable because a theology that makes the natural world fundamentally unintelligible undermines the claim that creation is a coherent book of divine signs.

  **Avoiding the Collapse of Law-Statements into Divine Whim (Non-Negotiable)**
  This is the critical vulnerability. A theory must explain why natural laws are descriptive of stable realities rather than arbitrary records of divine volition. If occasionalism posits that God causes fire to burn cotton solely by free will without reference to wisdom or nature, law-statements become reports of whim rather than expressions of order. The theory must ground divine custom in divine wisdom to ensure that laws are necessary *ex suppositione* (given God’s consistent will) rather than contingent caprices. This is non-negotiable because if laws are whims, science is theology guessing games, and God’s rationality is compromised.

  **Modal Compatibility (Modern-Camp Preference)**
  The requirement that causal links must remain valid even when effects fail (e.g., via masking or interference) is analytic metaphysics sneaking in. This concern prioritizes the logical structure of dispositions over theological coherence. For occasionalism, causal failure is not a problem of masked powers but of divine choice; demanding that a causal link persist modally despite no effect being produced imposes a creaturely ontology that occasionalism explicitly rejects. Whether a causal failure shatters a modal link is irrelevant if the theory already denies inherent creaturely powers. This is a preference of secular dispositionalists, not a requirement for theological adequacy.

  \answer{Avoiding the collapse of law-statements into divine whim}

  Verdict: Occasionalism remains viable only if divine custom is grounded in wisdom rather than arbitrary volition.
