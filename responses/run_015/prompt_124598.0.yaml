      *   *The Strongest Critique:* Focus on the **Logical Uncertainty** problem. You can't calculate the correlation without a theory of logical counterfactuals. We don't have one. Therefore, the decision rule is undefined in the hard cases.
      *   *Normative Analogue:* It's a consistency constraint. The "prediction" is that you will be money-pumped if you violate it *in the right conditions*. But since the conditions rarely obtain...

