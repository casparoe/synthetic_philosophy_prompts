answer: |-
  This is a high-fidelity summary of the state of the art. You have correctly identified the core intuition (Functional Decision Theory / Timeless Decision Theory / UDT cluster) and the standard defenses. You are also right to be suspicious of the "insulation."

  Here is the breakdown of defeaters, ranked by severity, split by insider/outsider status, followed by the specific cases and the normative insulation question.

  ### Taxonomy of Defeaters

  **Fatal (Internal)**
  1.  **The Logical Uncertainty Gap:** The theory requires calculating probabilities over logical counterfactuals (e.g., "If I output C, what is the probability my twin outputs C?"). We do not have a formal, consistent mathematical theory of logical uncertainty. Without it, the decision rule is undefined in the exact cases where it matters most (non-identical but similar algorithms).
  2.  **The Symmetry-Breaking Failure:** In anti-coordination games (you need to do *different* things), identical algorithms running on identical data will output the same action and fail. The theory requires an external assumption (indexical randomness) it cannot generate from within.

  **Fatal (External)**
  1.  **The Causality Objection:** (You know this one). If the twin is not causally influenced by you, you cannot change their action. Your action is merely *evidence* of theirs. CDT proponents argue that treating evidence as control is a category error that leads to magical thinking in other domains (e.g., Newcomb's Problem with a predictor who looks at your DNA rather than your decision).

  **Merely Awkward (Internal)**
  1.  **The Similarity Cliff (Continuity Problem):** If similarity is graded, the theory mathematically collapses into Evidential Decision Theory (EDT) with a specific prior. If it is binary, it is implausibly brittle.
  2.  **Bargaining Exploitation:** In bargaining scenarios (e.g., splitting $10), a TDT agent against a CDT agent who can pre-commit to "90/10 or nothing" will often accept the 10. The TDT agent "loses" to a dumber, more stubborn agent.
  3.  **The Parameterization Problem:** (Your "Unequal Twins" case). If payoffs are inputs to the computation, unequal payoffs mean different computations. The theory loses its grip.

  **Merely Awkward (External)**
  1.  **Empirical Irrelevance:** As you noted, real-world similarity is too low for the effect to dominate standard causal incentives.

  ---

  ### Running the Cases

  **1. The Similarity Cliff**
  *   **Verdict:** This is the strongest *theoretical* weakness.
  *   **Analysis:** If the theory treats similarity as continuous (e.g., correlation coefficient $r$), the expected utility calculation becomes $EU = P(C|C) \cdot U(CC) + P(D|C) \cdot U(DC)$. This is exactly EDT. The "extra content" of TDT/UDT is the claim that $P(C|C)$ is not a statistical belief but a *logical fact*.
  *   **The Problem:** If similarity is 97%, is it a logical fact or a statistical belief? If it's statistical, you are just an EDT agent with a strong prior. If it's logical, where is the threshold?
  *   **Insider View:** Most proponents admit this is unsolved. The view *does* degrade into EDT as similarity drops. The "extra content" is only present at the limit of logical identity. If you accept EDT with a "logical correlation prior," you have accepted the view, but you haven't solved the problem of how to calculate that prior.
  *   **Rank:** Awkward (theoretically), Fatal (practically, because we can't calculate the prior).

  **2. Slightly Unequal Twins**
  *   **Verdict:** The theory holds, but the "same computation" claim retreats.
  *   **Analysis:** A computation is $f(input) \rightarrow output$. If the payoff matrix is part of the input, then Twin A and Twin B are running $f(Input_A)$ and $f(Input_B)$. These are different computations.
  *   **The Retreat:** To save the cooperation, you must argue you are running the same *abstract algorithm* parameterized by payoffs. But if the payoffs differ enough, the abstract algorithm dictates different outputs (e.g., "Cooperate if incentive > threshold").
  *   **Result:** The view gives a principled answer: you cooperate only if the algorithm dictates cooperation for *both* parameter sets. If the inequality pushes one twin over the defection threshold, you both defect. This isn't a failure of the theory; it's a feature. It predicts *less* cooperation as asymmetry grows.
  *   **Rank:** Merely Awkward.

  **3. The Anti-Coordination Case**
  *   **Verdict:** **Fatal Internal Failure.**
  *   **Analysis:** Game: You and a copy must pick Red or Blue. Match = $0, Mismatch = $10.
  *   **TDT Logic:** I am running algorithm $A$. My twin runs $A$. $A$ must output a single distribution or deterministic choice. If $A$ outputs "Red", twin outputs "Red". Payoff = 0. If $A$ outputs "50/50 Mixed", twin outputs "50/50 Mixed". There is a 50% chance of match. Payoff = $5.
  *   **Human Intuition:** I should flip a coin *locally* so that our outcomes are uncorrelated.
  *   **The Block:** TDT says your local randomness is *logical* randomness. If you flip a coin, your twin flips a coin. If you use the same algorithm to generate the random bit (e.g., "look at the last digit of the time"), you get the same bit.
  *   **The Fix:** You need *indexical* information ("I am Copy 1, you are Copy 2"). But in the pure thought experiment, you don't have this.
  *   **Rank:** Fatal. The theory cannot solve symmetric anti-coordination without assuming access to uncorrelated randomness, which contradicts the premise of being "the same computation."

  **4. The Population Case**
  *   **Verdict:** Collapses to EDT.
  *   **Analysis:** If you are in a population of mixed types, your action does not logically determine the action of a CDT agent. It only determines the action of other TDT agents.
  *   **Result:** You maximize $EU = P(Twin is TDT) \cdot U(TDT) + P(Twin is CDT) \cdot U(CDT)$. This is standard expected utility with a belief about correlation.
  *   **Rank:** Merely Awkward. It's not a bug, it's a boundary condition.

  **5. Empirical Check**
  *   **Verdict:** You are correct; this is not special pleading.
  *   **Analysis:** Real-world agents are opaque. We don't know source code. We don't know similarity thresholds. Therefore, the "logical correlation" term is swamped by causal uncertainty.
  *   **Implication:** The theory is empirically silent on most real-world cooperation. Real-world cooperation is explained by iterated games, reputation, and social preferences, not acausal logic.
  *   **Rank:** Merely Awkward (limits scope, doesn't falsify).

  ---

  ### The Insulation Question

  > *Is the view qualified into something with no risky content left?*

  **Yes and No.**

  **The Vacuity Risk:** If "same computation" is defined as "computations that output the same thing," the theory is circular. If it is defined as "source code identity," it is too brittle for the real world. The theory survives by living in the gap: "Functional identity." But without a formal metric for functional similarity, it risks being a motte-and-bailey. You claim the power of logical determination (the bailey) but retreat to statistical correlation when challenged (the motte).

  **The Normative Analogue:**
  You asked: *What is the normative analogue of a defeater?*
  For CDT, the defeater is the Money Pump. If you violate CDT axioms, I can construct a sequence of trades that leaves you strictly worse off.
  For TDT/UDT, the defeater is **Suboptimality in Specific Games.**
  *   **The Case:** The Anti-Coordination game (above).
  *   **The Normative Failure:** If rationality is about winning, and TDT tells you to play a strategy that guarantees $0 (or suboptimal expected value) in a symmetric anti-coordination game, while a CDT agent (who treats the twin as independent) randomizes and wins $5, then TDT has failed its own normative standard.
  *   **The Defense:** TDT proponents argue the CDT agent is "getting lucky" due to causal independence, but in the logical setup, the independence is impossible.
  *   **The Counter:** If the physical reality is that we are two brains, we *can* be independent. If TDT says "You can't be," TDT is making a false empirical claim about supervenience.

  ---

  ### The Strongest Internal Critique

  **The Logical Uncertainty Gap.**

  Here is the argument, stripped of jargon:

  1.  **Premise:** TDT/UDT requires you to evaluate counterfactuals like "If I output C, what does my twin output?"
  2.  **Constraint:** In the hard cases (97% similarity, or complex code), you cannot simulate the twin perfectly (you are the twin). You must estimate the logical relationship.
  3.  **The Gap:** We have no formal calculus for "probability that logical statement X is true given logical statement Y is true." Standard probability handles empirical uncertainty (coin flips). Logic handles certainty (proofs). We lack the bridge (Logical Probability).
  4.  **The Consequence:** Without this calculus, the "TDT Expected Utility" equation cannot be computed. You are forced to fall back on heuristics ("It feels like they are similar").
  5.  **The Collapse:** Once you fall back on heuristics about similarity, you are indistinguishable from an EDT agent with a subjective prior on correlation.
  6.  **The Kicker:** If you are just EDT with a prior, you lose the "magic" that solves the Prisoner's Dilemma. EDT cooperates in PD only if it *believes* the twin correlates. TDT claims you *should* cooperate because the correlation is *logical*. If you can't calculate the logic, you can't justify the "should."

  **Does it land?**
  Yes. It lands hard. It admits that the theory is currently **incomplete**. It works in toy problems where the correlation is stipulated (e.g., "Assume Twin is identical"). It fails in real application where the correlation must be derived.

  **My Read:**
  The view is **basically fine as a normative ideal** but **exposed as a decision procedure.**
  *   **Normatively:** It is correct that if you *are* logically linked, you should act as if you control the link. To do otherwise is to leave utility on the table.
  *   **Procedurally:** You cannot know when you are logically linked well enough to act on it, except in trivial cases.
  *   **The "Fatal" Flaw:** The Anti-Coordination case. This is not a calculation error; it is a structural failure. The theory cannot generate asymmetry from symmetry. If you grant that rationality requires winning, and TDT loses the symmetric anti-coordination game while a "irrational" randomizer wins, TDT is normatively defeasible.

  **Summary Advice:**
  Keep the intuition (acausal trade is real in the limit of identity). Treat the formal theory as a work-in-progress that currently lacks the machinery to handle similarity gradients and symmetry breaking. Do not act on it in high-stakes real-world scenarios unless the "similarity" is extremely high (e.g., trading with your own future self, or verified identical code), because the "Similarity Cliff" means the benefit decays faster than your intuition suggests.
