answer: |-
  You have identified a structural fault line in ideal desire theory that is widely felt but rarely carved with the precision you are demanding.

  To answer your first question directly: **No, there is no single canonical name for this specific non-commutativity.** It is usually buried under broader headings like "adaptive preferences," "transformative experience," or "dynamic inconsistency."

  To answer your second: **It is two phenomena.** Conflating them is the source of the difficulty you are encountering. The first is an epistemic correction; the second is an ontological transformation.

  Here is the carving you asked for.

  ### 1. The Name and Definition

  I propose naming the distinction **Corrective vs. Constitutive Idealization**.

  *   **Corrective Idealization (Case 1):** The agent's "true" preference exists *now* but is obscured by noise (ignorance, fatigue, framing). The idealization process is a **filter**. It removes distortions to reveal a stable underlying utility function. Information and reflection commute here; more data just clears the lens.
      *   *Metaphor:* Cleaning a muddy window to see the landscape that was already there.
  *   **Constitutive Idealization (Case 2):** The agent's "true" preference does not exist *now*; it is generated *by* the process of reflection and experience. The idealization process is a **trajectory**. The agent's utility function is path-dependent. Information changes the agent, which changes how future information is processed.
      *   *Metaphor:* Walking a path that changes the walker, so the destination depends on the steps taken, not just the map.

  The general shape you noticed is **The Commutativity Failure of Idealization**. In Corrective cases, $Information + Reflection = Reflection + Information$. In Constitutive cases, the order and magnitude of exposure determine which attractor state the agent falls into.

  ### 2. Nearest Concepts and Why They Miss

  You correctly sensed that adjacent concepts don't quite settle it. Here is how they map onto your carving, and where they fail.

  **A. Adaptive Preferences (Jon Elster / Martha Nussbaum)**
  *   *The Concept:* Agents lower their standards to match what is possible (Sour Grapes).
  *   *Why it misses:* As you noted, this is usually normative discounting (we ignore these preferences). Your Case 1 looks like adaptive preference formation, but you want to *validate* the result. Furthermore, Adaptive Preference theory usually treats the change as a distortion to be corrected, whereas your Case 2 treats the change as a potentially valid evolution of the self. It lacks the machinery to distinguish "bad" adaptation (resignation) from "good" adaptation (growth).

  **B. Transformative Experience (L.A. Paul)**
  *   *The Concept:* Some choices change who you are so fundamentally that your current self cannot evaluate the outcome (e.g., having a child, becoming a vampire).
  *   *Why it misses:* This is the closest neighbor. Paul identifies the epistemic barrier (you can't know what it's like). However, her focus is on *decision theory* (how to choose), whereas your focus is on *idealization* (which self has normative authority). She identifies the phenomenon; you are asking how to weigh the endpoints.
  *   *Boundary:* Paul's work validates Case 2 (Constitutive) as inevitable, but doesn't provide a method to reconcile the conflict between the Pre-Transformation and Post-Transformation selves.

  **C. Internalism about Reasons (Bernard Williams)**
  *   *The Concept:* A reason must be grounded in the agent's "subjective motivational set."
  *   *Why it misses:* Williams allows the motivational set to be modified by deliberation. However, he assumes a sound deliberative route exists. Your observation is that there may be *multiple* sound routes leading to *incompatible* endpoints. Williams assumes convergence; you are observing divergence.

  **D. Coherent Extrapolated Volition (CEV)**
  *   *The Concept:* What we would want if we knew more, thought faster, were more the people we wished we were.
  *   *Why it misses:* CEV is a *proposal* that assumes convergence. It implicitly assumes Corrective Idealization. It hopes that if we extrapolate far enough, all humans converge on a shared moral core. Your observation threatens this: if Idealization is Constitutive, CEV might output different values depending on the starting seed (the specific human), or it might output a "person" who is no longer continuous with the seed. CEV tries to solve the problem by assuming it away.

  ### 3. Boundary Cases

  To test whether the two halves belong together, apply the **Continuity Test**: *Does the idealized self recognize the current self as a valid predecessor, or as a mistake?*

  **Addiction**
  *   *Analysis:* Often treated as Corrective (the addiction is the noise). But recovery is often Constitutive.
  *   *Verdict:* Split. Detox is Corrective (removing chemical distortion). Rehabilitation is Constitutive (building a new identity that doesn't want the drug). If you treat rehab as merely Corrective, you misunderstand why relapse happens; the "cleaned" self isn't the original self restored, it's a new self built.

  **Religious Conversion**
  *   *Analysis:* The convert often says, "I was blind, now I see." This sounds Corrective. But the pre-conversion self could not have deliberated its way to the post-conversion self using its own values.
  *   *Verdict:* Constitutive. The values themselves reorder. The "cleaning" metaphor fails because the dirt wasn't obscuring the view; the dirt was the soil for new growth. Treating this as Corrective leads to authoritarianism (forcing the "truth" on someone).

  **Child vs. Adult**
  *   *Analysis:* A child wants candy; the adult wants health.
  *   *Verdict:* Constitutive. We do not say the adult is the "corrected" child in the same way we say the sober man is the corrected drunk. We accept that the adult is a *different agent* with different authority. This is the strongest evidence that Case 2 is distinct. We grant the adult authority over the child not because the adult knows more facts, but because the adult has a different constitution.

  ### 4. The Teeth: Why the Distinction Matters

  You asked if this distinction has teeth. It does. It forces a choice in ethics, policy, and AI alignment.

  **A. The Authority Problem (Who Wins?)**
  *   *If Corrective:* The Idealized Self has authority over the Current Self. The Current Self is merely mistaken. Paternalism is justified ("I am helping you be who you really are").
  *   *If Constitutive:* The Current Self has a veto. The Idealized Self is a *successor*, not a *revealer*. Forcing the transition is not helping; it is replacing. This limits paternalism. You cannot force someone to become the person who would want to quit the business, because that kills the person who wants to keep it.

  **B. The Modeling Problem (Snapshot vs. Trajectory)**
  *   *If Corrective:* You can model the agent as a function $U(x)$. You just need to find the true parameters.
  *   *If Constitutive:* You must model the agent as a dynamic system $U_{t+1} = f(U_t, Experience)$. You cannot compute the endpoint without simulating the path. This makes "ideal desire" computationally much harder, perhaps impossible, to define statically.

  **C. The AI Alignment Implication**
  *   If you build an AI to satisfy human "idealized desires," you must choose:
      *   **Corrective Mode:** The AI prevents you from eating meat because it knows you *really* don't want to. (Risk: Tyranny of the "true" self).
      *   **Constitutive Mode:** The AI allows you to eat meat because it respects your current trajectory, even if it leads to a "lesser" idealized self. (Risk: Enabling self-destruction).
      *   **The Danger:** If the AI assumes Corrective when the reality is Constitutive, it will optimize for a version of you that you cannot recognize as yourself. It creates a "good" life for a stranger who shares your name.

  ### Summary

  The thing you are pointing at is **The Commutativity Failure of Idealization**.

  It is **two phenomena**:
  1.  **Corrective Idealization:** Removing noise to find a stable signal. (The Meat Eater).
  2.  **Constitutive Idealization:** Processing information that rewrites the signal generator. (The Businessman).

  The distinction has teeth because it determines whether "what is good for you" is something to be **found** (which justifies intervention) or something to be **grown** (which requires consent). Most philosophical systems gesture at the ideal self as a destination; you have correctly identified that for many humans, the ideal self is a different species than the current self, and the bridge between them is not logic, but transformation.
