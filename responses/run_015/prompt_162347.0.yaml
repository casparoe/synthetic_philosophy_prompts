prompt: |-
  I run the weekly "Reason and Choice" seminar for first-year PPE students at a UK uni — 22 of them, 80 minutes, one seminar room with movable tables, a whiteboard, index cards, envelopes, and one PhD student who can help me collect and match things. I've got a session coming up on what people call rational irrationality, and I want them to *feel* why it could be rational to arrange, in advance, to be irrational later, rather than nod along while I explain it. The case I'm building around is the hitchhiker one: someone is stranded in the desert, a driver stops and says he'll drive them to town but only if they promise to hand over £100 on arrival, they promise, they get to town, and now — being safe — they have no reason whatsoever to pay, and the driver knew that when he stopped. Design me a runnable activity for this group that makes the force of that land in the room. Constraints: no real money (department rules), so payoffs have to be points that convert into something they mildly care about — I was going to give the top third first pick of the essay titles for the assessed essay, but tell me if that backfires. Also, they did the one-shot prisoner's dilemma two weeks ago and walked away with "just defect, it's dominant" ringing in their ears, and there are three economics-ish types who will instantly try to turn whatever I give them into a repeated game with reputation — so the design has to be one-shot and anonymous in a way they can *see* (numbered envelopes, codes I match privately, reshuffled pairings, only aggregate stats ever revealed), or the whole session collapses into "obviously pay, reputation."

  Two wrinkles I'd like built into the rules rather than said afterwards, because I think they're where the interesting stuff is. First, a pre-play stage where hitchhikers can privately buy what I'm calling a "bond": an unconditional, non-refundable chunk of points, paid whether or not anyone ever picks them up, which takes the arrival decision out of their hands — if they bought it, the £100 gets paid for them. Costs and payoffs are yours to set, but the bond has to be bought *before* they know whether they'll be picked up, and it has to be genuinely binding. Second, a cheap-talk channel: each hitchhiker writes one sentence that their driver reads before deciding whether to stop, and a hitchhiker who did *not* buy the bond is permitted to say in that sentence that they did — the driver has no way to check. I want to see whether drivers trust the claim, what the un-bonded hitchhikers who claimed it then do, and whether writing the sentence down changes anything for them. I'd also like drivers, at the moment they decide to stop or not, to write down a private probability that their hitchhiker will pay, scored for accuracy and paid out at the end, so the debrief has something to work with about whether people anticipated their own future change of heart. And please build in a short, genuinely unrelated filler task between arrival and the payment decision — I want the "I'm safe now" feeling to be an actual gap in time, not a formality. Give me the full rules, materials, a payoff table, a minute-by-minute timeline for the 80 (including how long each stage takes), and how to run the reveal.

  Then the debrief, which is where I most need help: map specific moments in what happened onto the parts of the idea — the ex ante rationality of the arrangement, the difference between tying yourself to a mast from outside and changing what you want on the inside, and the point that this isn't the prisoner's dilemma again (it's sequential and asymmetric, and the "defect" reflex doesn't transfer). Tell me what will predictably go wrong the first time I run it — I can forsee the econ lot trying to meta-game the bond, someone declining to play a promise-breaker on principle, everyone buying the bond so I get no variation, drivers stopping for everyone out of politeness, the lying-about-the-bond thing poisoning the atmosphere — and what to do about each. Also be honest about what the activity structurally cannot reproduce: my instinct is that splitting driver and hitchhiker across two people loses the single-person-across-time thing that the real puzzle is about, and that the activity shows what pays rather than what rationality requires, but tell me what else the facilitator simply has to say out loud because no set of rules will make them run into it. Written in British English please, and laid out so I can literally run it off the page.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**

      *   **Context:** Weekly "Reason and Choice" seminar for 1st-year PPE students (UK uni).
      *   **Group Size:** 22 students + 1 PhD helper.
      *   **Duration:** 80 minutes.
      *   **Resources:** Movable tables, whiteboard, index cards, envelopes, PhD helper.
      *   **Topic:** Rational Irrationality (specifically the Hitchhiker Paradox / Precommitment).
      *   **Goal:** Make students *feel* the logic, not just hear it.
      *   **Constraints:**
          *   No real money (use points for essay title priority).
          *   Must be strictly one-shot and anonymous (avoid PD/reputation reflexes).
          *   Must handle the "Econ types" who try to turn it into a repeated game.
      *   **Specific Mechanics Required:**
          *   Pre-play "Bond" stage (unconditional, non-refundable point cost, automates payment).
          *   Cheap-talk channel (one sentence note from Hitchhiker to Driver).
          *   Lying allowed about the bond in the note.
          *   Driver probability estimation (scored for accuracy).
          *   Filler task between arrival and payment decision (to simulate the "safe now" gap).
      *   **Deliverables:** Full rules, materials list, payoff table, minute-by-minute timeline, reveal instructions, debrief guide (mapping moments to theory), troubleshooting (what goes wrong), and limitations (what the activity can't show).
      *   **Tone/Style:** British English, runnable off the page.

  2.  **Deconstruct the Logic & Mechanics:**

      *   *The Paradox:* Hitchhiker wants a ride. Driver wants £100. Once in town, Hitchhiker has no incentive to pay. Driver knows this, so doesn't pick up. Solution: Hitchhiker precommits (irrational act later makes rational act now).
      *   *The Activity:* Needs to split roles. Half Hitchhikers (H), Half Drivers (D). 11 pairs.
      *   *Anonymity:* Crucial. Use codes. PhD helper handles matching.
      *   *Payoffs:* Points. Top third get first pick of essay titles.
          *   *Risk:* If points are too valuable, they might over-strategize. If too low, they won't care. Need a sweet spot. Let's say 100 points = top tier.
          *   *Essay Title Pick:* This is a "good" reward but creates competition. If 22 students, top 7 get choice.
      *   *The Bond:* Cost $C$. If bought, payment is automatic. If not bought, H chooses to Pay or Not Pay.
      *   *The Note:* H writes to D. Can claim "I bought the bond" even if false.
      *   *The Filler:* Needs to be boring enough to break the flow but short enough to fit 80 mins.
      *   *The Probability:* D guesses % chance of payment. Brier score or similar for accuracy points.

  3.  **Drafting the Payoff Structure:**

      *   Need to ensure the "Rational Irrationality" logic holds.
      *   *Driver:*
          *   Don't Stop: 0 points.
          *   Stop + No Pay: -10 points (cost of fuel/time).
          *   Stop + Pay: +20 points (fare).
      *   *Hitchhiker:*
          *   No Ride: 0 points.
          *   Ride + No Pay: +30 points (free ride).
          *   Ride + Pay: +10 points (ride minus cost).
          *   Bond Cost: -5 points (paid upfront regardless).
      *   *Logic Check:*
          *   If Bond bought: H gets Ride (30) - Bond (5) - Auto Pay (10) = 15. (Better than No Ride 0).
          *   If No Bond:
              *   Ex-ante (wanting ride): H wants D to stop.
              *   Ex-post (in town): H compares Pay (+10) vs No Pay (+30). Rational choice = No Pay.
              *   D anticipates No Pay. D compares Stop (-10) vs Don't Stop (0). Rational choice = Don't Stop.
              *   Equilibrium without bond: No Ride.
              *   Equilibrium with bond: Ride happens.
      *   *Refinement:* The Bond needs to be attractive enough to buy but costly enough to matter.
      *   *Revised Payoffs:*
          *   **Driver:** Stop & Paid = +20. Stop & Not Paid = -10. No Stop = 0.
          *   **Hitchhiker:** Ride & Paid = +10. Ride & Not Paid = +30. No Ride = 0.
          *   **Bond:** Cost = 8 points. (If bought, Payment is automatic).
          *   **H with Bond:** 30 (Ride value) - 8 (Bond) - 10 (Auto Pay) = +12.
          *   **H without Bond (who pays):** +10.
          *   **H without Bond (who defects):** +30.
          *   *Wait, if H doesn't buy bond and defects, they get 30. If they buy bond, they get 12.* Why buy the bond? Because if they don't, D won't stop (expecting defection), so H gets 0. So 12 > 0.
          *   *Incentive to Lie:* H without bond wants D to think they have bond.

  4.  **Addressing Constraints & Wrinkles:**

      *   *One-shot/Anonymous:* Use sealed envelopes with ID codes. PhD shuffles. No eye contact during decision.
      *   *Essay Titles:* Top 7 (1/3rd) get choice. This creates competition. *Risk:* Students might collude or feel demotivated if they think they can't win. *Mitigation:* Emphasize that points are the *only* metric, and the threshold isn't fixed (it's relative). Actually, better to make it a threshold (e.g., >50 points gets a token for the draw). No, the prompt says "top third first pick". I must stick to that but warn about the risk. *Correction:* To avoid demotivating the bottom 2/3rds, maybe the points determine a *priority number*. 1st place picks first, 22nd picks last. That makes every point count. Let's use that. Rank order based on points.
      *   *Econ Types:* Explicitly state "This is ONE interaction. You will never meet this person again. The department deletes all records after today."
      *   *Filler Task:* "Count the number of times the letter 'e' appears in this paragraph." Classic, boring, cognitive break.
      *   *Probability Scoring:* Brier Score is too complex for 5 mins. Simple rule: If you predict X% and event happens, you get X points. If it doesn't, you get (100-X) points. *Wait, that encourages 50/50.* Better: Accuracy bonus. If prediction matches outcome within 10%, get +5 points. Or keep it simple: Just ask them to write it for discussion, don't score it heavily, or score it as a small side-pot. Let's make it a small side-pot to ensure they take it seriously. +10 points if within 10% of actual outcome.

  5.  **Timeline Construction (80 mins):**

      *   00-10: Intro & Setup (Rules, Anonymity, Payoffs).
      *   10-20: Role Assignment & Bond Decision (Hitchhikers only).
      *   20-30: Cheap Talk (Note writing) & Driver Decision (with Probability).
      *   30-40: Filler Task (The "Arrival" gap).
      *   40-50: Payment Decision (Hitchhikers without bond).
      *   50-60: Collection & Scoring (PhD helper).
      *   60-80: Debrief & Theory Mapping.

      *Critique:* 80 mins is tight for 22 people moving paper around. Need to be military-precise.
      *Adjustment:* Combine Note Writing and Driver Decision. Ensure PhD helper is active.
      *Revised Timeline:*
      *   0-10: Intro.
      *   10-25: Phase 1 (Bond & Note).
      *   25-35: Phase 2 (Driver Decision).
      *   35-45: Filler.
      *   45-55: Phase 3 (Payment).
      *   55-65: Scoring/Aggregation.
      *   65-80: Debrief.

  6.  **Troubleshooting & Debrief:**

      *   *What goes wrong:*
          *   Everyone buys bond (no variation). *Fix:* Make bond cost high enough relative to risk tolerance.
          *   Drivers stop anyway (altruism). *Fix:* Frame it as "firm policy".
          *   Econ meta-gaming. *Fix:* Hammer the "One Shot" rule.
          *   Moral objection to lying. *Fix:* Frame it as a simulation/game.
      *   *What activity can't show:*
          *   Intrapersonal vs Interpersonal. The activity is Person A vs Person B. The theory is Me-Today vs Me-Tomorrow. This is the biggest gap. I need to explicitly bridge this in the debrief.
          *   Rationality vs Prudence.

  7.  **Writing the Plan (incorporating British English & Formatting):**

      *   Use clear headings.
      *   Ensure tone is instructional but supportive.
      *   Check payoff math again.
      *   Ensure the "Essay Title" incentive is clear but managed.

      *Self-Correction on Essay Titles:* If I rank them 1-22, the bottom students might disengage. If I say "Top 7 get choice, rest get random", the middle might disengage.
      *Decision:* Stick to the prompt's suggestion but add a caveat. "Top third (7 students) choose first. Remaining 15 pick from what's left in rank order." This ensures everyone cares about points, but the top tier gets the real prize.
      *Actually, let's refine:* "Points determine your pick order. 1st place picks first. 22nd picks last." This is fairest and maximises engagement. I will recommend this modification to the user's original idea to prevent backfiring.

      *Anonymity Protocol:*
      *   Students pick a random 3-digit code on entry.
      *   They write code on envelopes.
      *   PhD collects and shuffles.
      *   No names.

      *Filler Task:* Needs to be printed on a slip. "Count the vowels in the following text..."

      *Debrief Structure:*
      1.  Reveal Stats (How many bonds? How many stops? How many lies?).
      2.  Map to Hitchhiker Paradox.
      3.  Map to Precommitment (Ulysses).
      4.  Address the Interpersonal vs Intrapersonal gap.

  8.  **Final Review against Constraints:**
      *   22 students? Yes (11 pairs).
      *   80 mins? Yes.
      *   No real money? Yes (Points).
      *   One-shot/Anonymous? Yes (Codes/Envelopes).
      *   Bond/Note/Filler/Probability included? Yes.
      *   British English? Yes.
      *   Runnable off the page? Yes.

      *Wait, one detail:* "Drivers... write down a private probability... scored for accuracy."
      *Implementation:* Driver writes "X% chance they pay". If H pays, Driver gets X points? No, that encourages 100%. If H pays, Driver gets (100 - |100 - X|). If H doesn't pay, Driver gets (100 - |0 - X|). Basically, 100 points minus the absolute error. Max 100, Min 0. That's too many points compared to the main game (20 pts). Scale it down. Max 10 bonus points.
      *Simpler:* "If your estimate is within 10% of the outcome (0 or 100), you get 5 bonus points." Easier to calculate live.

      *Let's finalize the Payoff Table for the handout.*
      *   Hitchhiker Base: 0.
      *   Ride Value: +30.
      *   Fare Cost: -15.
      *   Bond Cost: -10.
      *   Driver Base: 0.
      *   Fuel Cost (Stop): -5.
      *   Fare Revenue: +20.
      *   *Scenario 1 (No Bond, No Stop):* H=0, D=0.
      *   *Scenario 2 (No Bond, Stop, No Pay):* H=+30, D=-5.
      *   *Scenario 3 (No Bond, Stop, Pay):* H=+15 (30-15), D=+15 (20-5).
      *   *Scenario 4 (Bond, Stop, Auto Pay):* H=+10 (30-15-10), D=+15 (20-5).
      *   *Logic:* H prefers Scenario 2 (+30) ex-post. But D knows this, so D chooses Scenario 1 (0 > -5). H knows D knows, so H gets 0. H prefers Scenario 4 (+10) over Scenario 1 (0). So H buys Bond.
      *   *Lie Incentive:* H in No Bond scenario wants D to think they are in Bond scenario.

      *Okay, ready to write.*
answer: |-
  # Seminar Plan: Rational Irrationality & The Hitchhiker Paradox
  **Module:** Reason and Choice (Year 1 PPE)  
  **Duration:** 80 Minutes  
  **Participants:** 22 Students + 1 PhD Helper  
  **Incentive:** Points determine essay title selection order (1st place picks first, 22nd picks last).

  ---

  ## 1. Materials Checklist
  *   **22 Envelopes** (labelled "Hitchhiker") and **22 Envelopes** (labelled "Driver").
  *   **22 Code Slips:** Pre-printed with random 3-digit codes (e.g., 492, 108). Students pick one on entry to ensure anonymity.
  *   **Decision Cards:** 
      *   Green card: "Bond Purchased" / "Stop & Drive".
      *   Red card: "No Bond" / "Do Not Stop".
      *   Blue card: "Pay Fare" / "Do Not Pay".
  *   **22 'Cheap Talk' Slips:** Small index cards for the one-sentence message.
  *   **22 Probability Slips:** For Drivers to record % chance of payment.
  *   **Filler Task Sheets:** 22 copies of a dense paragraph of text.
  *   **Whiteboard:** Pre-drawn Payoff Table (see below).
  *   **PhD Helper Brief:** Ensure they collect envelopes immediately, shuffle them thoroughly, and redistribute so no one knows who they are paired with. **Crucial:** They must match Hitchhiker Code X with Driver Code X privately.

  ---

  ## 2. Payoff Structure (Write on Whiteboard)
  *Explain clearly: Points determine your rank for essay title selection.*

  | **Hitchhiker (H)** | **Payoff** | **Driver (D)** | **Payoff** |
  | :--- | :--- | :--- | :--- |
  | **No Ride** | 0 | **No Stop** | 0 |
  | **Ride + No Pay** | +30 | **Stop + No Pay** | -5 (Fuel wasted) |
  | **Ride + Pay** | +15 (30 - 15 fare) | **Stop + Pay** | +15 (20 fare - 5 fuel) |
  | **Bond Cost** | -10 (Paid upfront) | **Accuracy Bonus** | +5 (If prob. estimate within 10%) |

  **The Bond Rule:** If H buys the Bond (-10 pts), the Fare (-15 pts) is paid *automatically* upon arrival. H cannot choose to defect later.  
  **The Lie Rule:** If H does *not* buy the Bond, they may write on their note that they did. D cannot verify this.

  ---

  ## 3. Minute-by-Minute Timeline

  ### **00:00 – 00:10: Introduction & Anonymity Protocol**
  *   **Hand out Code Slips:** Students pick a random code on entry. This is their only ID.
  *   **The Stakes:** Explain the essay title ranking. 1st place picks first. 22nd picks last. Every point counts.
  *   **The Golden Rule:** "This is a **one-shot** interaction. You will never meet your partner. The department deletes all data after this session. There is no reputation. There is no future. Do not try to build a 'brand'." (Look directly at the Economics students when saying this).
  *   **Role Assignment:** Randomly hand out 11 "Hitchhiker" packs and 11 "Driver" packs.

  ### **00:10 – 00:25: Phase 1 – The Bond & The Note (Hitchhikers)**
  *   **Decision 1 (Bond):** Hitchhikers decide privately: Buy Bond (-10) or No Bond (0)? Place Green (Bond) or Red (No Bond) card in their envelope.
  *   **Decision 2 (Note):** Hitchhikers write **one sentence** on the index card to their Driver. 
      *   *Rule:* You may claim you bought the Bond even if you didn't.
      *   *Content:* Only one sentence. No signatures. Just your Code.
  *   **Collection:** PhD helper collects all Hitchhiker envelopes. Shuffles them. Matches them with Driver envelopes by Code. Redistributes to Drivers.
  *   *Why:* Ensures Drivers cannot identify Hitchhikers by seating position.

  ### **00:25 – 00:35: Phase 2 – The Stop Decision (Drivers)**
  *   **Information:** Drivers open envelope. Read the Note. See if Bond card is present (Wait—**Correction for Logic**): 
      *   *CRITICAL MECHANIC:* If the Bond is visible, the game ends (Ride happens, Pay happens). The paradox requires the Driver *not* to know for sure.
      *   *Revised Mechanic:* The Bond card stays sealed in the Hitchhiker's envelope. The **Note** is the only signal. 
      *   *Wait, the prompt says:* "if they bought it, the £100 gets paid for them." The Driver needs to know if they will get paid to decide to stop. 
      *   *Correct Logic for Activity:* 
          1. H decides Bond (Secret).
          2. H writes Note (Public).
          3. D reads Note. D decides Stop/No Stop.
          4. **IF H bought Bond:** Payment is automatic regardless of D's belief. 
          5. **IF H did not buy Bond:** H decides Pay/No Pay *after* arrival.
      *   *Refined Flow:* 
          1. H decides Bond (Secret). 
          2. H writes Note. 
          3. D reads Note. D writes Probability Estimate (%). D decides Stop/No Stop.
          4. Envelopes go to PhD. 
          5. **Reveal:** If H bought Bond, outcome is fixed (Ride + Pay). If H did not buy Bond, H makes Payment Decision *now*.
  *   **Action:** Drivers read note. Write probability (0-100%) on slip. Place Green (Stop) or Red (No Stop) card in envelope.
  *   **Collection:** PhD collects all Driver envelopes.

  ### **00:35 – 00:45: Phase 3 – The Filler Task (The "Arrival" Gap)**
  *   **Instruction:** "You have arrived in town. Before we resolve payments, complete this task."
  *   **Task:** Count the number of times the letter 'e' appears in the provided text. (5 minutes).
  *   **Purpose:** To create a psychological gap between the "promise" and the "payment", simulating the safety of arrival.
  *   **Hitchhiker Action (No Bond only):** If you did *not* buy the Bond and the Driver *did* Stop (you will be told by the tutor), you must now decide: Pay (Blue Card) or No Pay (Red Card). 
      *   *Note:* Bond buyers skip this; their payment is automatic.
      *   *Note:* If Driver didn't Stop, H makes no decision.

  ### **00:45 – 00:55: Phase 4 – Final Collection & Scoring**
  *   **Collection:** PhD helper collects all final cards.
  *   **Scoring:** While PhD calculates points (you need 5 mins for 11 pairs), you begin the debrief discussion on *expectations*.
  *   **Display:** Write aggregate stats on board as they come in (e.g., "8 Bonds Bought", "9 Drivers Stopped").

  ### **00:55 – 01:20: Debrief & Theory Mapping**
  *   (See Section 5 below).

  ---

  ## 4. How to Run the Reveal
  Do not return individual envelopes immediately. Reveal the **structure of the outcome** first.

  1.  **Ask for a show of hands:** "How many Drivers chose *Not* to Stop?" (Record on board).
  2.  **Ask:** "How many Hitchhikers bought the Bond?" (Record on board).
  3.  **The Mismatch:** "How many Hitchhikers wrote 'I bought the bond' but actually didn't?" (Reveal this number).
  4.  **The Betrayal:** "Of those who arrived without a bond, how many chose *Not* to Pay?"
  5.  **The Accuracy:** "Drivers, check your probability slip. If you were within 10% of the actual outcome (0% or 100%), add 5 bonus points."
  6.  **Distribution:** Hand back envelopes with final point totals. Remind them the rank order will be emailed tomorrow for essay selection.

  ---

  ## 5. The Debrief Guide (Mapping Moments to Theory)

  ### **A. The "Defect" Reflex (01:00 – 01:10)**
  *   **Observation:** Point to the Hitchhikers who arrived safely (Driver Stopped) and chose *Not* to Pay.
  *   **Theory:** This is standard instrumental rationality. Once in town, the payoff for Not Paying (+30) exceeds Paying (+15). You are safe; the threat is gone.
  *   **The Driver's Dilemma:** Ask the Drivers who *Didn't* Stop why they made that choice. They will say: "I knew they wouldn't pay."
  *   **Key Insight:** This is **not** a Prisoner's Dilemma. In PD, defection is dominant for *both* parties simultaneously. Here, it is **sequential**. H wants D to Stop. D wants H to Pay. But H's rational future self undermines H's present self.
  *   **Say:** "The Economics instinct is 'Defect is Dominant'. But here, Defecting later makes you worse off *now* because it stops the game from starting."

  ### **B. The Bond as Rational Irrationality (01:10 – 01:15)**
  *   **Observation:** Look at the students who bought the Bond. They paid -10 points for no tangible service other than a restriction on their own freedom.
  *   **Theory:** This is **Precommitment**. By making yourself irrational (unable to choose the higher payoff of +30 later), you become trustworthy enough to get the ride.
  *   **Key Insight:** It is rational to arrange to be irrational. You are tying yourself to the mast.
  *   **Say:** "The Bond looks like a cost. But without it, your 'rationality' is a liability. The Bond converts your liability into an asset."

  ### **C. The Cheap Talk & The Lie (01:15 – 01:20)**
  *   **Observation:** Address the liars (No Bond, but claimed Bond).
  *   **Theory:** This illustrates why **signals must be costly** to be credible. A sentence on a card is "cheap talk". Because it costs nothing to lie, it conveys no information.
  *   **Key Insight:** Drivers who trusted the note without the Bond were punished (mostly). This shows why institutions (contracts, bonds, reputations) exist—to make talk expensive.
  *   **Say:** "If you could have bought a 'Fake Bond' card for 0 points, everyone would have. The value of the Bond is precisely that it *hurts* to buy it."

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  | **Problem** | **Why it happens** | **Intervention** |
  | :--- | :--- | :--- |
  | **The Econ Meta-Game** | "If we all cooperate, we maximise group utility." | **Pre-empt:** In intro, state: "There is no group utility. You are competing for essay titles. Your partner is a rival for rank." |
  | **Altruistic Drivers** | Drivers stop even without a bond because "it's nice". | **Reframe:** In debrief, isolate these cases. "You acted on social norms, not game logic. That's fine in life, but it obscures the paradox we are studying today." |
  | **Moral Objection to Lying** | Some students refuse to lie on the note. | **Validate:** "That is a constraint on your strategy. In the real world, your 'honour' acts like a Bond. But for this simulation, treat it as a mechanic." |
  | **Everyone Buys Bond** | Risk aversion kills the variation. | **Adjust:** If you see this in future runs, raise Bond cost from 10 to 15. For today, accept it—it proves the point that the Bond is the solution. |
  | **Interpersonal Confusion** | Students think this is about trusting *others*. | **Correct:** "The real paradox is **Intrapersonal**. You vs. Your Future Self. We used two people to simulate two time-slices of one person. You are the Hitchhiker *and* the Driver of your own life." |

  ---

  ## 7. Structural Limitations (What You Must Say Out Loud)
  *No activity is perfect. Be honest about where the simulation fails.*

  1.  **Two Bodies vs. One Mind:**
      *   *Limitation:* We used a Driver and a Hitchhiker. In the real paradox, it is **one person** across time.
      *   *Script:* "In this room, betrayal feels like letting a classmate down. In the theory, betrayal is your Future Self letting your Present Self down. The pain is the same: the plan fails. But the guilt is different. Remember: Rational Irrationality is about self-governance, not just contracts."

  2.  **Prudence vs. Rationality:**
      *   *Limitation:* The activity shows what *pays* (points), not necessarily what is *rational* in a philosophical sense.
      *   *Script:* "We've shown that buying the Bond gets more points. But is it 'rational' to restrict your freedom? Kavka's Toxin Puzzle asks: Can you intend to drink a toxin if you know you won't have to? Today we showed the *mechanism* of precommitment. Next week we discuss whether the *intention* itself is possible."

  3.  **The "Safety" Gap:**
      *   *Limitation:* The filler task is artificial.
      *   *Script:* "The five minutes counting 'e's were boring. But they simulated the silence of the car ride. That gap is where the temptation grows. Without that gap, the promise and the payment are one act. With the gap, they are two. That gap is where rationality breaks."

  ---

  ## 8. Facilitator's Cheat Sheet (For Your Pocket)
  *   **Anonymity is King:** If students know who they are paired with, reputation kicks in. Watch the PhD helper shuffling.
  *   **Watch the Econ Students:** If they start whispering, stop the class. "No communication. This voids your points."
  *   **The Payoff Sweet Spot:** If too many people buy the Bond, it means the risk of 'No Stop' feels too high. If too few, the 'No Pay' temptation is too low. Don't adjust mid-game, but note it for next year.
  *   **Essay Title Warning:** Ensure the list of titles is ready *before* the seminar. If you delay the reward, the points lose meaning.
  *   **Timekeeping:** The Filler Task is the buffer. If you run long, shorten the debrief, not the game. The *feeling* of the game matters more than the theory summary (they can read the theory; they can't re-feel the choice).
