  The fluorescent lights in the municipal basement hummed like a dying insect. Mara rubbed her temples. The property dispute on her desk was simple on paper: Lot 42B either owed back taxes or it didn't. But the chain of title was a snake eating its own tail.

  She pulled Box 402. Inside, the deed referenced Permit 1954-A. Permit 1954-A cited Zoning Amendment 88. Amendment 88 pointed back to the Original Survey of 1923. But the Survey didn't sit in the box. It referenced a Field Notebook that wasn't there.

  "It's stable, Mara," David said, leaning against the stacks. He was chewing on a pen cap, looking entirely too comfortable for someone buried sixty feet underground. "Look at the web. The Permit supports the Amendment, the Amendment validates the Survey, the Survey confirms the Permit. They hold each other up. You don't need a bottom if the net is tight enough."

  Mara tapped the file. "The net is hanging in midair, David. If the Survey is wrong, the whole thing collapses. I need the ground."

  "There is no ground," Sam said, popping up from the aisle behind her. She was twenty-three, caffeinated, and convinced every problem was solved by digging deeper. She held a flashlight like a sword. "We haven't checked the sub-basement crates from the 1910 consolidation. The Field Notebook has to be there. And before that, there's the county log. And before that, the state charter. We just keep going back. The justification is in the length of the chain, not the end of it."

  "And if the chain never ends?" Mara asked.

  "Then we keep walking," Sam said.

  Mara turned back to the desk. She wasn't paid to walk forever. She needed a stopper. She needed a document that didn't point anywhere else, a document that just *was*.

  She opened the last uncataloged crate in the corner. Underneath a layer of mold-spotted tax rolls, she found it. A ledger bound in cracked black leather. 1923.

  Her heart jumped. This was it. The bedrock.

  She opened the cover. The first page didn't list properties. It listed numbers. But not normal inventory numbers. The margins were crowded with a notation system she'd never seen. It looked like math having a panic attack.

  Indices marked with primes tangled with factorials. `2!³`. `5!^7`. `11#3!`.

  She ran her finger over the ink. It was dry, decades old. On page one, a handwritten note in bold script: *Origin Point. Self-Verifying.*

  "Mara?" David called. "Find the ground?"

  "Maybe," she said. Her voice sounded thin in the damp air.

  "Is it legible?"

  "No."

  "Does it matter?" David pushed off the stack. "If it says 'Origin,' treat it as one. The system needs a axiom. Let this be it. The coherence of the rest of the files depends on you accepting this book."

  "But I can't read the index," Mara said. "If this is the foundation, it's written in a language we don't speak. How do I know it's not just another reference pointing to something we lost? What if `2!³` means 'See Vault 9' and Vault 9 burned down in '45?"

  Sam leaned over her shoulder, eyes wide. "Or maybe the notation implies an infinite sequence. Look at the progression. It doesn't stop. It generates new coordinates forever. This book isn't a stopper; it's a generator. It proves there's always more data."

  Mara stared at the page. The ink seemed to shimmer under the flickering light.

  If she accepted the book as true without reading it, she was betting on faith—that the past had left something solid. That was David's way. Build the house on the thing that looks like concrete, even if you can't test the mix.

  If she tried to decode the notation, she was betting on Sam's way—that the work never ends, that truth is a horizon you chase until you retire.

  But the book sat there, heavy and silent. It claimed to be the bottom. It claimed to be self-grounding. But a claim isn't proof. A foundation that refuses to be examined is just a black box.

  The hum of the lights grew louder. The tax bill was due Friday.

  Mara closed the ledger. The sound echoed like a gavel.

  "Photocopy it," she said.

  "Which way?" David asked. "As the final word?"

  "As the next link," Mara said, grabbing her coat. "We'll cite the ledger. Then we'll spend the next ten years trying to figure out what the hell `5!^7` means. Maybe our grandchildren will find the key."

  "So we're stuck?" Sam asked.

  "No," Mara said, walking toward the stairs. "We're working."

  She left them in the hum and the dust, carrying the weight of a foundation that might just be another ceiling.
