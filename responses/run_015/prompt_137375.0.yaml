answer: |-
  The pattern you describe is not a single decision theory but a **hybrid regulatory architecture**. It stitches together Expected Value (EV) maximization for routine risks, epistemic truncation for negligible risks, and a separate protocol for systemic threats. It avoids "fanaticism" (as you define it: EV settles the matter on its own) not by modifying the utility function alone, but by placing **epistemic constraints on probability assignment** and **administrative truncation on calculation**.

  Here is the reconstruction of the implicit theory, addressing your six points.

  ### 1. Reconstruct the Implicit Theory
  The practice does not strictly presuppose anti-fanaticism in the mathematical sense (e.g., bounded utility), but it is incompatible with *plain* expected-value maximisation applied to *any* assigned probability. It presupposes **Epistemically Constrained Expected Value with Truncation**.

  *   **The EV Component:** Feature (1) confirms that within the "ordinary" domain, the state acts as a risk-neutral EV maximizer. It aggregates risk linearly ($N \times p \times VSL$).
  *   **The Truncation Component:** Feature (2) introduces a **hard probability floor** ($\epsilon$). If $p < \epsilon$, the term is treated as zero regardless of $N$. This is a direct violation of pure EV maximization (which would sum $N \times p$ even if $p$ is tiny). This is the primary anti-fanatical mechanism for routine regulation.
  *   **The Systemic Exception:** Feature (3) shows the floor is not universal. For existential risks, the calculation proceeds even when $p < \epsilon$.

  **Strict Presupposition:** The pattern requires that **probability is not a continuous input**. It is a categorical variable: *Negligible*, *Routine*, or *Existential*.
  *   *Negligible:* $p < \epsilon$ AND stake is local. $\rightarrow$ Ignore (Feature 2).
  *   *Routine:* $p > \epsilon$ AND stake is local. $\rightarrow$ Linear EV (Feature 1).
  *   *Existential:* Stake is systemic (civilizational). $\rightarrow$ EV calculation proceeds despite low $p$, *provided* epistemic conditions are met (Feature 3).

  This is not compatible with plain EV maximization plus empirical claims, because plain EV maximization cannot justify Feature (2) without arbitrariness. If $N$ is large enough, $N \times p \times VSL$ always exceeds cost eventually. The practice refuses to do that math for individual risk rules. It presupposes a **lexical priority of administrative feasibility over mathematical completeness**.

  ### 2. The Evidential Defence
  The distinction between model-based probabilities (asteroids) and bare assertions (the stranger) is the regulator's primary shield against Pascal's Mugging, but it is an **epistemic** defence, not a **decision-theoretic** one.

  *   **Does it dismiss the stranger?** Yes, operationally. Regulatory guidance (e.g., OMB Circular A-4) requires risks to be "significant" and "substantiated." A bare assertion fails the burden of proof. The probability assigned is effectively zero, not because $p$ is small, but because the hypothesis is inadmissible.
  *   **Model Averaging:** If the regulator averages over models, assigning some non-zero weight to "The stranger might be telling the truth" (Model $M_{magic}$), the defence fails. If $P(M_{magic}) > 0$, and the stake is infinite, the EV is infinite.
  *   **Relocation:** Model averaging merely relocates the problem to the **prior probability of model classes**. To save the practice, the regulator must assign **zero prior credence** to hypotheses lacking mechanistic explanation. This is dogmatic Bayesianism. It rescues the regulator from fanaticism only by refusing to update on certain kinds of evidence (testimony without mechanism).
  *   **Verdict:** The defence works for the regulator because the regulator operates with a **closed set of admissible hypotheses**. It fails as a general decision theory because a "careful agent" who acknowledges their own model uncertainty *should* assign non-zero mass to unknown mechanisms. The practice survives by refusing to be that careful agent.

  ### 3. The Structural Objection
  The objection is that if value is unbounded, there is always a lottery ticket worth buying.

  *   **Real Work of Thresholds:** The *de minimis* threshold (Feature 2) is doing real structural work. It acts as a **circuit breaker**. It prevents the "long long tail" of probability distributions from dominating the budget. Without it, every regulatory docket would require an analysis of infinite-stake, low-probability scenarios (e.g., "Does this traffic rule increase the chance of a vacuum decay event?").
  *   **Regress Harmless?** The regress is not harmless mathematically, but it is **computationally fatal**. A government that attempts to maximize EV over an unbounded stake space with open-ended probability assignments faces **decision paralysis**. The probability of coherent scenarios generally decays faster than stakes can be inflated *in the real world*, but in *conceptual space*, they do not.
  *   **Conclusion:** The thresholds are not mere squeamishness; they are **complexity constraints**. They enforce a "local" decision theory that ignores global tail risks unless those risks are specifically identified as systemic (Feature 3). This creates a stable equilibrium where routine risks are managed by EV, and tail risks are managed by a separate, scarce resource allocation process (national security/emergency budgets).

  ### 4. Specific Anti-Fanatical Rules
  Consider the rule: Fund if $p > k / f(V)$, where $f(V)$ grows slower than $V$ (e.g., $\sqrt{V}$ or $\log V$).

  *   **Reproducing (1) through (3):**
      *   *(1) Linear VSL:* For ordinary stakes ($V \approx \$10M$), $f(V)$ is roughly constant. The rule approximates $p > \text{constant}$, which looks like a threshold, but if $p$ clears it, the benefit scales linearly. It fits reasonably well.
      *   *(2) De Minimis:* For small $V$, the required $p$ is higher. This reproduces the dismissal of small risks to individuals.
      *   *(3) Asteroids:* For huge $V$ (civilization), the required $p$ drops significantly. Asteroid detection passes.
      *   *(The Stranger):* If $V$ is astronomical ($10^{100}$), and $f(V) = \log V$, the required $p$ becomes tiny ($\approx 1/100$). If the stranger claims $p = 10^{-10}$, the rule might still reject it. But if the stranger claims $V$ is large enough, the rule eventually admits the bet. To fully block the Mugging, $f(V)$ must be bounded (e.g., log utility), not just sub-linear.
  *   **Principled or Curve-Fitted?** This rule is **curve-fitted**. There is no ethical principle that suggests probability confidence should scale with the square root of value. It is designed specifically to yield the intuitions you listed.
  *   **Practice vs. Rule:** The practice looks more like a **hard probability floor** for routine matters (Feature 2) and a **qualitative veto** for the stranger (Evidential Defence). It does not look like a continuous function $p(V)$. The practice treats the Asteroid case not as "low probability, high value" but as "high confidence in catastrophic mechanism." The Stranger case is "no confidence in mechanism." The switch is categorical, not continuous.

  ### 5. What Would Have to Change
  *   **Convinced Fanatic Government:** If the government adopted plain EV maximization with unbounded value and open priors:
      *   **Budget Collapse:** The budget would shift entirely to the highest $V \times p$ intervention. Since $V$ can be inflated conceptually (future generations, multiverse), resources would flow to speculative existential risk mitigation (e.g., simulation shutdown protocols) at the expense of current welfare (healthcare, roads).
      *   **Competition:** When two long shots compete (e.g., Alien Defense vs. AI Alignment), the decision becomes a contest of **who can posit the larger stake**. Policy becomes driven by rhetorical inflation of stakes rather than empirical evidence.
  *   **Bounded Value Government:** If the government placed an upper bound on the value of the future (e.g., "We only value the current 8 billion lives"):
      *   **Feature (3) Survival:** Asteroid detection and pandemic preparedness would survive, but the justification would shift. They would be framed as **insurance for current capital**, not salvation of the long-term future.
      *   **Weaker Arguments:** This argument is weaker because the economic value of the "future stream" vastly exceeds current capital. However, it is more robust against fanaticism. It forces Feature (3) to rely on the magnitude of *immediate* loss (billions dead now) rather than *potential* loss (trillions unborn). This aligns better with Feature (1) (VSL counts current statistical lives).

  ### 6. Where is the Practice Underdetermined?
  A **Bounded-Value Theorist** (utility saturates) and a **Probability-Threshold Theorist** (p < $\epsilon$ counts as 0) can both endorse Features (1), (2), and (3) *as currently practiced*, because current practice does not stress-test the boundary between them.

  *   **The Distinguishing Case:**
      *   *Option A:* \$50M to reduce collapse risk by $10^{-4}$ (stakes: current civilization).
      *   *Option B:* \$50M for $10^{-9}$ chance of securing $10^{18}$ future lives.
  *   **Practice Verdict:** Current regulatory practice (RIA/VSL) would likely **fund A and reject B**.
      *   *Why A?* It falls under Feature (3). The stake is the continuity of the current population/state.
      *   *Why Not B?* It fails Feature (2) ($10^{-9}$ is below *de minimis*) AND it fails Feature (1) (VSL calculations typically do not count unborn generations beyond a short horizon).
  *   **Theoretical Split:**
      *   *Probability-Threshold:* Rejects B immediately because $10^{-9} < \epsilon$.
      *   *Bounded-Value:* Rejects B because the utility of $10^{18}$ lives is capped at the utility of "Civilization Continues," which is roughly the same stake as A.
  *   **Underdetermination:** The practice does not distinguish these because it rarely encounters Option B in a regulatory docket. However, the **existence of Feature (3)** suggests the Threshold Theory is closer to the truth. If value were truly bounded, the "Existential" exception wouldn't need a special protocol; it would just be another EV calculation. The fact that agencies treat X-risk differently (Feature 3) implies they recognize the *probability* is the barrier, not the *value*. They lower the barrier for X-risk.
  *   **Should it?** The practice *should* distinguish them. If Option B is genuine, rejecting it based on a *de minimis* threshold designed for individual carcinogens is a category error. The practice is currently **over-conservative on long-tail futures**. It treats the future as a "negligible risk" rather than a "high stake."

  ### Summary of Reconstruction
  The implicit theory is **Administrative Expected Value with Epistemic Gating**.

  1.  **Maximize EV** within the domain of **admissible models**.
  2.  **Truncate probabilities** below $\epsilon$ to ensure computational tractability (Anti-Fanaticism via administrative fiat).
  3.  **Waive truncation** for systemic risks where the mechanism is physically modeled (The Existential Exception).
  4.  **Reject** hypotheses lacking mechanistic models regardless of stated stake (The Anti-Mugging Gate).

  This system is not mathematically consistent (it violates continuity), but it is **institutionally robust**. It prevents the budget from being hijacked by Pascal's Muggers while allowing funding for asteroids. It achieves this not by solving the philosophy of infinite value, but by refusing to process claims that do not come with error bars.
