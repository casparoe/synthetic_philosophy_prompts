prompt: |-
  Hi — I run the "pilot pipeline" for a mid-sized city (around 200k people). Basically every new idea in this city now arrives as a request for a six-month pilot: try it in one district, measure it, then decide. We get about forty of these a year, three of us review them, we have maybe two hours each, none of us has stats training beyond a spreadsheet, and anything we clear goes to a council committee that meets monthly and can be yanked by the mayor's office whenever they feel like it. What actually happens is that most pilots turn into either a press release or a quiet permanent extension, and the measurement mostly just decorates whatever people already wanted to do.

  What I want from you is a procedure my team can run on a proposal, grounded in Dewey's experimentalism about inquiry and democracy — the version where inquiry starts from a genuinely indeterminate situation rather than from a proposition to be verified, where a hypothesis is a plan of action and its test is what happens when you act on it, where warrant is a matter of degree and always revisable so nothing "proves" anything, and where the democratic bit isn't a vote at the end but the requirement that the people who will bear the consequences get a real hand in forming and judging the hypothesis, not just a chance to react to it afterward.

  Don't write me an essay about Dewey. Write me something I can put on one page and hand to a new hire. Concretely:

  - The questions, in order, and what counts as a sufficient answer to each. I need to be able to tell "answered" from "sounded plausible in the meeting."
  - Where the procedure stops with a NO — this isn't a pilot, don't run it.
  - Where it stops and hands the decision to a person or to the committee because the question is one of values rather than facts. Say explicitly which questions those are, because that's what I have to defend when a council member asks why we rejected their thing.
  - A one-page output — call it a pilot charter — that records what the situation was, what the hypothesis is as an action, who bears what, and what would count as having learned something.
  - How to handle the hard cases we actually get, including: (a) interventions that can't be undone, so there's no going back to a reconstructed situation — demolishing things, disbanding a team, closing a school; (b) pilots that change the very thing they measure, so the result won't travel; (c) pilots where the metric is easy to game and gaming looks identical to success; (d) pilots where the benefits land on one group and the costs on a group that has no seat in the process; (e) pilots nobody can opt out of — a school-wide or district-wide thing where the "subjects" are just people who live there; (f) null results, which is most of them, and which currently just get ignored; (g) pilots that quietly become permanent because nobody scheduled the decision.

  Two things I'd like built in that I haven't seen anywhere. First, a "counterfactual who" step: name the specific person or role who is worse off if this succeeds, and if the proposing department can't name one, that itself is the finding. Second, a "what has to stay still" step: list what must remain in place for a result in the pilot district to mean anything about next year city-wide, and then check whether the pilot itself changes anything on that list. My suspicion is that most of our proposals fail right there and we've been pretending otherwise.

  Then run it on three real-shaped ones:

  1. A four-day week for municipal office staff — same hours compressed into four days — proposed by HR, expected to cut sick leave and help recruitment.
  2. Predictive targeting of code-enforcement inspectors using a model trained on historical 311 complaint data, so we inspect blocks the model flags rather than responding to complaints.
  3. Unarmed mental-health crisis response teams in two districts. I should say up front that I publicly backed this one and the mayor already announced it, so I'm not neutral, and if the procedure says something inconvenient I'd rather hear it now than in front of the committee.

  For each, show me the gates it passes and fails, the charter line, and whether it's a NO, a REFRAME (run it, but the claim you're entitled to make afterward is much smaller — say what the smaller claim is), or a ROUTE (this isn't an experiment, it's a decision about what kind of city we want, so take it to full deliberation). I expect at least one of these to come out as an answer I don't like, and I want you to say plainly what my options are in that case.

  Finally, tell me what the procedure can't do. I have to present this to a committee that will absolutely over-trust it the moment it looks official, so I need the honest failure modes in writing — where the checklist gives false confidence, where it's a vocabulary for decisions we'd have made anyway, and what it can't tell us at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Runs a "pilot pipeline" for a mid-sized city (200k people).
      *   **Context:** 40 proposals/year, 3 reviewers, 2 hours each, low stats training, political volatility (mayor/council), pilots often become press releases or permanent extensions without real evaluation.
      *   **Goal:** A one-page procedure based on John Dewey's experimentalism (inquiry from indeterminate situations, hypothesis as action plan, warrant as degree/revisable, democratic participation in forming/judging hypotheses).
      *   **Deliverables:**
          1.  One-page procedure (questions, stop points, value vs. fact distinctions).
          2.  One-page output template ("Pilot Charter").
          3.  Handling hard cases (a-g).
          4.  Two specific innovations: "Counterfactual Who" (who is worse off?) and "What Has to Stay Still" (stability conditions).
          5.  Application to three specific cases (4-day week, Predictive Code Enforcement, Unarmed Crisis Response).
          6.  Limitations/Failure Modes of the procedure itself.
      *   **Tone:** Practical, direct, no fluff, no essay on Dewey, actionable for a new hire.
      *   **Constraint:** "One page" for the procedure and charter (though in this format, I need to make them concise enough to *be* one page if printed).

  2.  **Deconstruct Deweyan Experimentalism for this Context:**

      *   *Indeterminate Situation:* Don't start with "We think X works." Start with "We have a problem we don't understand."
      *   *Hypothesis as Action:* The pilot isn't testing a theory; it's testing a *change in habit*.
      *   *Warrant:* No "proof." Only "warranted assertibility." Did the consequences resolve the problem?
      *   *Democracy:* The affected public must help define the problem and the criteria for success, not just vote on the result.
      *   *Inquiry:* The goal is learning, not validation.

  3.  **Drafting the Procedure (The "Gatekeeper" Sheet):**

      *   Need sequential questions.
      *   Need clear "Stop/No" criteria.
      *   Need clear "Value vs. Fact" handoffs.
      *   Need the two specific innovations ("Counterfactual Who", "Stay Still").
      *   *Drafting thought:* Keep it tight. Use bolding for decision points.
      *   *Question 1 (The Problem):* Is the situation actually indeterminate? Or do they just want to do X?
      *   *Question 2 (The Action):* Is the hypothesis an action plan?
      *   *Question 3 (The Counterfactual Who):* Who loses?
      *   *Question 4 (Stay Still):* What conditions must hold? Does the pilot break them?
      *   *Question 5 (Reversibility):* Can we undo it?
      *   *Question 6 (Metrics):* Can we game this?
      *   *Question 7 (Democratic Input):* Did the affected help write this?
      *   *Decision Points:* NO (Not a pilot), REFRAME (Learn only), ROUTE (Value decision).

  4.  **Drafting the Pilot Charter:**

      *   Needs to capture the Deweyan elements.
      *   Situation, Action-Hypothesis, Consequences (Who bears what), Learning Criteria (What counts as knowledge), End-Date/Decision Trigger.

  5.  **Handling Hard Cases:**

      *   Need specific protocols for the (a)-(g) list provided.
      *   *Key insight:* Most of these require shifting from "Pilot" to "Policy Decision" or "Monitoring."

  6.  **Applying to the Three Cases:**

      *   *Case 1: 4-Day Week.*
          *   Issue: "Stay Still." If we do this in one dept, does it affect others? (Service availability).
          *   Issue: "Counterfactual Who." Citizens needing service on Fridays?
          *   Verdict: Likely REFRAME or ROUTE. It's a labor policy, not really an empirical uncertainty if other cities have done it. But for *this* city? Maybe REFRAME to "Does this disrupt service?"
      *   *Case 2: Predictive Code Enforcement.*
          *   Issue: "Counterfactual Who." Landlords in flagged blocks? Tenants in non-flagged blocks (missed hazards)?
          *   Issue: "Gaming." Inspectors just go where told.
          *   Issue: "Stay Still." Does the model change behavior such that the data becomes invalid for city-wide rollout? (Reflexivity).
          *   Verdict: High risk of NO or REFRAME. The "prediction" is self-fulfilling.
      *   *Case 3: Unarmed Crisis Response.*
          *   Issue: User is biased (publicly backed it). Mayor announced it.
          *   Issue: "Indeterminate Situation." Is the question "Does this work?" or "Should we do this?"
          *   Issue: "Counterfactual Who." Police union? (Political cost). People who need police power?
          *   Issue: "Reversibility." Hard to undo once announced.
          *   Verdict: ROUTE. This is a value decision masquerading as a pilot. The user needs to hear this hard truth.

  7.  **Drafting Limitations/Failure Modes:**

      *   False confidence (checklist mentality).
      *   Vocabulary for pre-made decisions.
      *   Cannot resolve deep value conflicts.
      *   Cannot fix lack of political will.

  8.  **Refining and Polishing:**

      *   *Constraint Check:* The prompt asks for "One page" for the procedure and charter. I will format them distinctly so they *look* like they could be printed on one page each, even if the chat response is longer.
      *   *Tone Check:* Direct, professional, slightly cynical but constructive.
      *   *Dewey Check:* Ensure I'm not using "hypothesis testing" language (null hypothesis, p-values) but rather "inquiry," "warrant," "reconstruction."
      *   *Specific Instructions:* Ensure "Counterfactual Who" and "Stay Still" are prominent.
      *   *The "Uncomfortable Truth":* Case 3 needs to be handled carefully. The user admitted bias. I need to tell them that under *this* procedure, that pilot is a value decision, not an experiment.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 2 hours review?
      *   *Fix:* Simplify the language. Make the "Stop" conditions very binary.
      *   *Critique:* Did I address the "Null Results" issue?
      *   *Fix:* Add a specific line in the Charter about "What happens if nothing changes."
      *   *Critique:* Did I address the "Quiet Permanent" issue?
      *   *Fix:* The Charter must have a "Sunset Date" that triggers an automatic expiration unless renewed by specific vote.

  10. **Final Assembly:** Organize into the requested sections: Procedure, Charter, Hard Cases, Case Studies, Limitations. (Proceed to generate output).

  *(Self-Correction on Case 3)*: I need to be very careful here. The user said "if the procedure says something inconvenient I'd rather hear it now." I must not pull punches. If the procedure says "This is a value decision, not a pilot," I must say that, even if the Mayor announced it. That is the value of the tool.

  *(Self-Correction on Case 2)*: Predictive policing/enforcement is notorious for feedback loops. The "Stay Still" step is crucial here. If the pilot changes the data generation process, the pilot invalidates the city-wide rollout logic.

  *(Self-Correction on Case 1)*: 4-day week is often a labor negotiation. Is it a pilot? Usually, it's a policy. If treated as a pilot, the "Stay Still" is service levels.

  Let's write it.cw
answer: |-
  # THE DEWEY GATE: PILOT REVIEW PROCEDURE
  **For:** New Hires & Review Committee | **Time Budget:** 2 Hours/Proposal | **Goal:** Warranted Action, Not Proof

  **INSTRUCTION:** Answer sequentially. If you cannot answer, the proposal is incomplete. If the answer fails the criterion, stop at the designated gate.

  ### 1. THE SITUATION (Fact/Value Mix)
  *   **Q:** What specific *indeterminate situation* (confusion, conflict, breakdown) exists right now that requires action?
  *   **Sufficient Answer:** Describes a current dysfunction (e.g., "Response times exceed safety thresholds in District 4").
  *   **Insufficient:** Describes a solution looking for a problem (e.g., "We want to try AI").
  *   **STOP (NO):** If the situation is already settled law or purely ideological.
  *   **HANDOFF:** If the "problem" is actually a disagreement about what kind of city we want (e.g., "Should police handle mental health?"), mark **ROUTE TO COUNCIL**. This is a value judgment, not an inquiry.

  ### 2. THE HYPOTHESIS AS ACTION
  *   **Q:** What specific change in habit/practice is being tested?
  *   **Sufficient Answer:** "We will change X process to Y process."
  *   **Insufficient:** "We will implement [Program Name]."
  *   **STOP (NO):** If the action cannot be described as a change in observable behavior.

  ### 3. COUNTERFACTUAL WHO (Fact)
  *   **Q:** Name the specific role or person who is *worse off* if this pilot "succeeds."
  *   **Sufficient Answer:** Names a group losing resources, status, or convenience (e.g., "Citizens calling on Fridays," "Inspectors losing discretion").
  *   **Insufficient:** "No one," "Taxpayers," or vague references.
  *   **FINDING:** If the proposer cannot name anyone, **STOP (NO)**. There is no cost, therefore no trade-off, therefore no inquiry. It is a press release.

  ### 4. WHAT HAS TO STAY STILL (Fact)
  *   **Q:** List the background conditions that must remain stable for a result here to mean anything city-wide.
  *   **Sufficient Answer:** Lists 3-5 stable variables (e.g., "Staffing levels," "Budget authority," "Public trust").
  *   **CHECK:** Does the pilot itself destabilize one of these? (e.g., A pilot that requires extra temporary staff to succeed cannot test city-wide viability with existing staff).
  *   **STOP (REFRAME):** If the pilot changes the conditions required for the result to travel. You are not testing the policy; you are testing the *extra resources*.

  ### 5. REVERSIBILITY & GAMING (Fact)
  *   **Q:** Can we return to the pre-pilot state if the consequences are negative?
  *   **Sufficient Answer:** "Yes, by [Date/Action]."
  *   **STOP (NO):** If the intervention is physically irreversible (demolition) or politically irreversible (public promise of permanence).
  *   **Q:** Can the metric be improved without solving the problem?
  *   **STOP (REFRAME):** If yes, change the metric to a consequence, not an output.

  ### 6. DEMOCRATIC FORMATION (Value)
  *   **Q:** Did the people who bear the costs (from Q3) help write the success criteria?
  *   **Sufficient Answer:** "Yes, via [Mechanism]" with minutes/evidence.
  *   **Insufficient:** "We held a town hall to announce it."
  *   **HANDOFF:** If no, mark **ROUTE TO COMMITTEE**. Do not run the pilot until the affected have shaped the inquiry.

  ### 7. THE END GAME (Fact)
  *   **Q:** What happens on the end date if the result is NULL (no significant change)?
  *   **Sufficient Answer:** "The pilot expires automatically. Status quo resumes."
  *   **Insufficient:** "We will review the data."
  *   **STOP (NO):** If there is no automatic sunset. Pilots without expiration are permanent policies in disguise.

  ***

  # OUTPUT: THE PILOT CHARTER
  *(To be signed by Dept Head, Reviewer, and Community Rep)*

  | **1. THE BROKEN THING** | **2. THE ACTION HYPOTHESIS** |
  | :--- | :--- |
  | *Describe the indeterminate situation, not the goal.* <br> (e.g., "Current process fails to X under Y conditions") | *Describe the change in habit.* <br> (e.g., "We will shift from A to B for 6 months") |
  | **3. WHO PAYS? (Counterfactual)** | **4. WHAT MUST STAY STILL?** |
  | *Who is worse off if this works?* <br> (e.g., "Friday callers wait longer") | *What conditions must not change for this to scale?* <br> (e.g., "Budget per capita," "Union rules") |
  | **5. SUCCESS CRITERIA (Co-Designed)** | **6. FAILURE CRITERIA** |
  | *What observable consequence warrants continuation?* | *What observable consequence triggers termination?* |
  | **7. SUNSET TRIGGER** | **8. NULL RESULT PROTOCOL** |
  | *Date:* \_\_\_\_\_\_\_\_ *Action:* **AUTOMATIC EXPIRATION** | *If no change is detected:* **TERMINATE** |

  ***

  # HARD CASE PROTOCOLS
  *When the standard gates hit a wall, apply these rules.*

  *   **(a) Irreversible (Demolition/Closing):** **NO.** You cannot experiment with irreversible consequences. This is a policy decision. **ROUTE TO COUNCIL.**
  *   **(b) Reflexivity (Pilot changes the measure):** **REFRAME.** Acknowledge the result applies *only* to the pilot conditions. Do not claim city-wide warrant.
  *   **(c) Gaming (Metric = Success):** **REFRAME.** Switch to "outcome" metrics (e.g., not "inspections done" but "violations found per hour") or **NO**.
  *   **(d) Distributed Costs (Benefits here, costs there):** **ROUTE.** If the cost-bearers are not at the table, this is exploitation, not inquiry.
  *   **(e) No Opt-Out (District-wide):** **ROUTE.** If subjects cannot avoid the intervention, this is governance, not a pilot. Requires full democratic deliberation.
  *   **(f) Null Results:** **ENFORCE CHARTER.** If Q8 is not followed, the Review Team is negligent. Null results are the only way to stop bad ideas from becoming permanent.
  *   **(g) Quiet Permanence:** **AUTOMATIC SUNSET.** The Charter Q7 is binding. If the Committee does not vote to renew *before* the date, the authority to spend money/action ceases.

  ***

  # CASE RUN-THROUGHS

  ### 1. Four-Day Work Week (Municipal Staff)
  *   **Gate 1 (Situation):** Pass. (Recruitment/Sick leave are dysfunctions).
  *   **Gate 3 (Counterfactual Who):** **FAIL/REFRAME.**
      *   *Who is worse off?* Citizens needing service on Day 5.
      *   *Finding:* HR likely said "No one." This is false.
  *   **Gate 4 (Stay Still):** **FAIL.**
      *   *Condition:* Service availability.
      *   *Check:* If the pilot closes offices on Fridays, service availability changes. You cannot test "efficiency" while reducing "access."
  *   **Gate 5 (Reversibility):** Pass (Schedule can revert).
  *   **Verdict:** **REFRAME.**
      *   *Claim:* You are not testing "Efficiency." You are testing "Service Reduction Tolerance."
      *   *Charter Line:* Success = "No increase in citizen complaints regarding Friday access."
      *   *Risk:* If complaints spike, you must revert. If you don't, you admitted access doesn't matter.

  ### 2. Predictive Code Enforcement (AI Targeting)
  *   **Gate 1 (Situation):** Pass. (Inefficient inspection allocation).
  *   **Gate 3 (Counterfactual Who):** **PASS.**
      *   *Who is worse off?* Landlords in flagged blocks (higher scrutiny); Tenants in *unflagged* blocks (lower scrutiny/safety risk).
  *   **Gate 4 (Stay Still):** **FAIL (CRITICAL).**
      *   *Condition:* Data integrity.
      *   *Check:* The model trains on 311 data. 311 data is generated by citizen complaints, not objective hazard. By targeting based on complaints, you incentivize more complaints in those areas, reinforcing the bias. The pilot changes the data generation process.
      *   *Finding:* A result in the pilot district *cannot* predict city-wide performance because the pilot alters the underlying signal.
  *   **Gate 6 (Democratic Formation):** **FAIL.**
      *   *Check:* Did tenants in flagged blocks help define "success"? Unlikely.
  *   **Verdict:** **NO.**
      *   *Reason:* The inquiry is corrupted. The tool creates the reality it measures.
      *   *Option:* Run as a **Monitoring Audit** only (test if the model matches *independent* safety audits, not complaints), but do not call it a pilot for enforcement.

  ### 3. Unarmed Mental Health Crisis Response
  *   **Gate 1 (Situation):** **VALUE CONFLICT.**
      *   *Check:* Is the problem "Police are bad at mental health" (Fact) or "Police shouldn't do mental health" (Value)?
      *   *Finding:* This is largely a value question about the role of force in the city.
  *   **Gate 3 (Counterfactual Who):** **PASS.**
      *   *Who is worse off?* Police Union (scope reduction); Citizens in high-violence scenarios where unarmed teams cannot operate (potential response delay).
  *   **Gate 5 (Reversibility):** **FAIL.**
      *   *Check:* Mayor announced it. Public expectation is set. Reverting looks like failure/admission of danger.
      *   *Finding:* Politically irreversible.
  *   **Gate 6 (Democratic Formation):** **PARTIAL.**
      *   *Check:* Advocacy groups likely involved. Police/Residents in high-crime zones less so.
  *   **Verdict:** **ROUTE.**
      *   *Reason:* This is not an experiment. It is a policy implementation.
      *   *Hard Truth:* You cannot "pilot" a value commitment. You have already decided.
      *   *Action:* Stop calling it a pilot. Call it a **Policy Rollout with Monitoring.**
      *   *Charter Adjustment:* Remove "Success/Failure" binary. Replace with "Consequence Monitoring."
      *   *Your Option:* You must tell the Committee: *"We are not testing IF we do this. We are testing HOW to do this safely. If safety metrics worsen, we do not stop the program (because the decision is made), but we must adjust the protocol."* This removes the "experimental" cover and accepts the political risk.

  ***

  # LIMITATIONS & FAILURE MODES
  *(Read this before presenting to the Committee)*

  1.  **False Precision:** This checklist makes decisions look more objective than they are. Q3 (Counterfactual Who) relies on the proposer's honesty. If they lie, the gate fails.
  2.  **Vocabulary for Pre-Made Decisions:** Smart actors will learn to write proposals that *sound* like they pass the gates while intending to ignore the Charter. (e.g., Writing a "Sunset" date they intend to ignore).
  3.  **Cannot Resolve Value Conflicts:** If the Council wants X and the Data says Y, this procedure does not save you. It only clarifies that the conflict exists.
  4.  **The "Null Result" Trap:** Even with Q8, political pressure will demand a "win" after 6 months. A null result will be spun as "more time needed." You need the Mayor's buy-in on the Sunset Trigger, or the Charter is paper.
  5.  **Inquiry Takes Time:** Deweyan inquiry requires listening to the affected (Gate 6). This slows down the pipeline. If the Mayor demands speed, this procedure will be bypassed.
  6.  **What It Can't Tell You:** It cannot tell you if a policy is *just*. It can only tell you if the policy is *warranted by the inquiry process*. A perfectly run pilot can still produce a terrible outcome if the initial values were wrong.

  **Final Advice:** Use this to protect your team, not to block the Council. When a proposal fails a gate, hand them the specific question they couldn't answer. Make *them* fill the gap. If they can't, the rejection writes itself.
