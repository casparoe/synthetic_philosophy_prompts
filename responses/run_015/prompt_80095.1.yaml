          *   *Deontologist:* Duty is endless. You don't graduate from the Moral Law. Stopping implies duty is optional once habits form.
          *   *Skeptic (Self-Knowledge):* We are terrible at knowing ourselves. The ledger was a crutch. Removing the crutch doesn't mean you can walk; it might mean you've forgotten you're lame.

      *   **Point 4: Concessions by a Defender:**
