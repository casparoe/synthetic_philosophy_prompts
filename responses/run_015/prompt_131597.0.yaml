answer: |-
  The stone hall smelled of wet wool and woodsmoke. Elara adjusted the wooden token in her pocket—the mark of her selection. By lot, she had been chosen for the Cycle Assembly. There were no parties here, no banners, no platforms. The founders of the Settlement had burned those bridges after the Collapse. Governance was meant to be pure reasoning, uncorrupted by faction.

  Today's burden was the crate of antibiotics. Enough for ten, maybe twelve. The infection in the lower quarters had already taken three children. But the excavation team, digging for buried supplies, demanded prophylaxis. If they fell, the digging stopped. If the digging stopped, the winter stores would remain buried.

  Kael, a mason selected like her, spoke first. "Utility," he said, his voice steady. "The diggers secure survival for all. The sick in the lower quarters... the mortality rate is high regardless."

  Elara stood. "We treat the living, not the potential," she said. "To withhold from the sick is to kill them deliberately."

  The room didn't erupt. It tightened.

  During the recess, Elara went to the water cistern. Kael was there with four others from the assembly. They weren't whispering conspiratorially; they were sharing bread. They laughed when she approached, but the laughter ceased too quickly.

  "Elara," Kael said. "We need unanimity on this. Not for power. For stability."

  "It's wrong," she said. "You know the mortality stats. You're arguing from fear, not fact."

  "I'm arguing for the Settlement," another woman said, her eyes hard. "If the diggers stop, we all starve. Do you want that blood on your hands?"

  It wasn't a threat; it was a calculation. But beneath the math, Elara felt the heat. It was a demand for loyalty. They weren't asking her to agree with the data; they were asking her to agree with *them*. To be part of the "we" that kept the walls standing.

  Back in the hall, the debate resumed. But the reasoning had evaporated. The arguments were recycled, hollow. The assembly wasn't weighing evidence; it was performing a ritual of cohesion. When a younger member voiced support for Elara's position, the room turned on him not with counter-logic, but with cold silence. He looked down, shrunk, and withdrew his objection. Elara saw a flicker of doubt in Kael's eyes then, a momentary hesitation, before he smoothed his expression back into certainty. He suppressed it. He had to.

  Elara watched them. She had believed the design would save them. No parties meant no partisan blindness. But as she looked at Kael, at the set of his jaw, she saw the mechanism clearly. The formal label was gone, but the spirit remained. They had become a party of one mind. To dissent was not to disagree; it was to betray the body. The collective passion had swallowed the individual truth. The safeguards had prevented organization, but not the psychology of the crowd. The structure had not cured the human need to belong to a side.

  The Moderator struck the bell. "Vote."

  Elara held the black stone for condemnation of the sick, the white for mercy. Her hand hovered over the basket. Kael watched her, not with anger, but with an expectation of belonging. He expected her to choose the group over the truth.

  She looked at the white stone, then at the faces of the people who would freeze if she broke ranks. The weight of the collective pressed against her thumb. She tightened her grip on the stone, the edges digging into her skin, and stepped toward the basket.
