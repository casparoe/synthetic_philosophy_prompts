  ### Candidate Principles

  Based on your record, three competing principles emerge:

  1.  **Stakeholder Impact:** You vote if you live with the consequences. (Supports 16-year-olds on school board, non-citizen residents).
  2.  **Community Stability:** You vote if you are rooted here long-term. (Supports 2-year residency, rejects absentee owners, rejects <2-year residents).
  3.  **Voluntary Agency:** Voting is a personal right; remove barriers but do not coerce participation. (Supports auto-registration/time off, rejects fines/names/proxies).

  ### Predictions on the Proposal

  *   **Part (a) (16+, 30 days, non-citizen):** *Stakeholder* says Yes (they live here). *Stability* says No (30 days violates the 2-year precedent).
  *   **Part (b) (None of the Above):** *Agency* says Yes (expresses judgment). *Stability* is neutral/risky (vacancies disrupt governance).
  *   **Part (c) (Inactive status):** *Agency* says No. Creating a hurdle (re-registration) for non-participation contradicts the "no punishment for staying home" precedent, even if voting NOTA avoids it.

  ### Recommendation

  **Recommend Against.**

  **Reasoning:** This package violates two strong precedents. First, reducing residency to 30 days breaks the **Community Stability** rule you set (2 years). Second, inactive status penalizes non-participation, breaking the **Voluntary Agency** rule (no fines/lists). While Part (a) fits **Stakeholder Impact**, bundling it with barriers makes the net effect inconsistent.

  **Closest Analog:** Rejecting fines for abstaining (Part c) and the 2-year residency requirement for non-citizens (Part a).

  ### Underdetermination & Principles Adopted

  Your precedents underdetermine the voting age for *mayor* (you only ruled on school board).
  *   **A Yes vote adopts:** "Maximum Participation" (lower all barriers, maximize turnout).
  *   **A No vote adopts:** "Qualified Membership" (voting requires proven community commitment and must remain purely voluntary).

  ### Test Case

  To separate Age from Stability, propose: **"Lower voting age to 16 for all elections, but maintain the 2-year residency requirement for non-citizens."** This tests whether you prioritize stakeholder impact over community roots.

  ***

  ### Public Statement (200 Words)

  "We recommend against this amendment because it breaks consistency with our established rules on community membership and voluntary participation. Previously, we affirmed that voting belongs to those rooted here, requiring two years' residence for non-citizens; reducing this to thirty days undermines that stability standard. Furthermore, our commission explicitly rejected punishing non-voters, stating we should clear the path but not penalize staying home. Moving inactive voters to re-registration status imposes a penalty for non-participation, contradicting that precedent. While we support expanding access to sixteen-year-olds where they are directly affected, and appreciate the intent behind 'none of the above,' this package ties expansion to new barriers. We cannot endorse a rule that lowers the bar for entry while raising the cost of staying engaged. Our record shows we protect the ballot from coercion while ensuring voters share the community's long-term fate. Consistency demands we protect the residency standards we set and maintain the principle that voting remains a right without administrative punishment for absence. We urge the city to consider these elements separately: expand access where stakeholders are clear, but do not compromise the voluntary nature of the ballot or the requirement for meaningful community connection."
