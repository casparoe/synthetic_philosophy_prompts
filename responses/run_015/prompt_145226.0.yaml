answer: |-
  # The Judea Plausibility Protocol (JPP)
  **Purpose:** To determine if a gospel detail can be presented as historical fact rather than authorial invention.
  **Time Limit:** 10 Minutes per detail.
  **Output:** A binary decision (Fact vs. Invention/Ambiguous) + Justification for Author's Note.

  ---

  ## Part 1: The Decision Checklist
  *Run these steps in order. If you hit a **STOP**, record the verdict and move to the Author's Note.*

  ### Step 1: Contextual Credibility (The Baseline)
  **Question:** Does this detail contradict known archaeology, geography, or 1st-century Jewish/Greco-Roman social norms?
  *   **Yes:** **STOP.** Classify as **Invention**. (e.g., Jesus using a stirrup).
  *   **No:** Proceed to Step 2.
  *   *[JUDGMENT CALL FLAG]:* Your knowledge of 1st-century material culture is the variable here. If unsure, mark "Ambiguous."

  ### Step 2: The Friction Test (Your Core Criterion)
  **Question A:** Does this detail generate narrative tension that serves no obvious theological or apologetic purpose for the Gospel source?
  **Question B:** Does this detail survive a counterfactual where the author sought to make Jesus appear more conventionally pious or politically unthreatening?
  *   **No to A AND No to B:** (It serves theology *and* makes him look better). **STOP.** Classify as **Theological Embellishment**.
  *   **Yes to A OR Yes to B:** (It creates awkward tension *or* makes him look difficult). Proceed to Step 3.
  *   *[JUDGMENT CALL FLAG]:* Defining "obvious theological purpose" is subjective. Ask: "Would a later church leader invent this to convert a skeptic?"

  ### Step 3: Attestation & Dissimilarity
  **Question:** Is this detail found in multiple independent sources (Mark, Q, John, Paul, Josephus)?
  *   **Yes:** Proceed to Step 4.
  *   **No:** Does the detail portray Jesus in a way *unlike* the early Church or 1st-century Judaism (Criterion of Dissimilarity)?
      *   **Yes:** Proceed to Step 4.
      *   **No:** **STOP.** Classify as **Ambiguous/Invention**.

  ### Step 4: Conflict Resolution
  **Rule:** If Step 2 (Friction) suggests "Fact" but Step 3 (Attestation) suggests "Invention" (e.g., only one late source), **Friction Wins.**
  **Rule:** If Step 2 suggests "Invention" (Theological utility) but Step 3 suggests "Fact" (Multiple sources), **Attestation Wins** *unless* the sources are clearly copying each other.
  *   **Verdict:** If Friction passes and Attestation is neutral/positive → **Present as Fact**.
  *   **Verdict:** If Friction fails → **Present as Invention/Ambiguous**.

  ---

  ## Part 2: Application to Case Studies

  ### Case 1: The Temple Action (The "Cleansing")
  *   **Step 1 (Context):** Plausible. Protest actions in the Temple courts occurred historically. **Pass.**
  *   **Step 2 (Friction):**
      *   *Tension:* High. It precipitates his arrest.
      *   *Theological Purpose:* Yes (fulfillment of prophecy), BUT...
      *   *Counterfactual:* Would an author making Jesus "politically unthreatening" invent a violent disruption of Roman-sanctioned worship? No.
      *   **Pass.**
  *   **Step 3 (Attestation):** Attested in Mark, Q (implied), John, Gospel of Thomas. **Pass.**
  *   **Step 4 (Resolution):** Friction and Attestation align.
  *   **Verdict:** **Present as Fact.** (Note: Specific timing [Passover vs. earlier] and whip details vary, so keep core action, vary specifics).
  *   **Author's Note Justification:** "The Temple incident passes the Friction Test as it creates political liability without serving a purely apologetic function, and is multiply attested across independent traditions."

  ### Case 2: The Birth Narratives (Angelic Announcements)
  *   **Step 1 (Context):** Plausible within Jewish apocalyptic expectation, though supernatural claims are outside historical verification. **Pass (Provisional).**
  *   **Step 2 (Friction):**
      *   *Tension:* Low. It resolves tension (explains who he is).
      *   *Theological Purpose:* High. Establishes divine sonship and Davidic lineage immediately.
      *   *Counterfactual:* Would an author seeking to make Jesus appear "conventionally pious" invent angelic visitations? Yes, this enhances piety.
      *   **FAIL.**
  *   **Step 3 (Attestation):** Only Matthew and Luke. Mark and John lack it. Paul lacks it. Sources contradict (Genealogies/Nativity details). **Fail.**
  *   **Step 4 (Resolution):** Friction fails (Theological utility high). Attestation weak.
  *   **Verdict:** **Present as Invention/Frame as Ambiguous.**
  *   **Author's Note Justification:** "Despite dramatic resonance, the Birth Narratives fail the Friction Test (high theological utility, enhances piety) and lack multiple independent attestation. Presented here as community memory rather than objective fact."
      *   *(Note: This satisfies the constraint of classifying a resonant detail as invented, even if undesired.)*

  ### Case 3: The Cry of Dereliction ("Eloi, Eloi...")
  *   **Step 1 (Context):** Plausible Jewish prayer (Psalm 22). **Pass.**
  *   **Step 2 (Friction):**
      *   *Tension:* Extreme. Suggests a break in the divine relationship.
      *   *Theological Purpose:* Low/Awkward. Early scribes tried to change this to "Into your hands I commit..."
      *   *Counterfactual:* Would an author making Jesus "politically unthreatening" or "divine" invent a moment of despair? No.
      *   **Pass.**
  *   **Step 3 (Attestation):** Mark and Matthew. Luke and John modify it. **Pass (Early Core).**
  *   **Step 4 (Resolution):** Friction strongly indicates authenticity despite later modifications.
  *   **Verdict:** **Present as Fact.**
  *   **Author's Note Justification:** "The Cry of Dereliction is retained as historical core; it is theologically embarrassing and survives the counterfactual test of pious invention."

  ---

  ## Part 3: Limitations & Disclaimer
  **This checklist cannot establish:**
  1.  **Metaphysical Truth:** It cannot determine if Jesus was actually divine, if angels actually appeared, or if God actually spoke. It only measures *textual probability*.
  2.  **Absolute Fact:** It cannot guarantee an event happened exactly as described (video-camera history). It only establishes *plausibility within the genre of historical fiction*.
  3.  **Motivation:** It cannot definitively prove the internal psychological state of historical actors, only the external plausibility of their recorded actions.

  ---

  ## Part 4: Author's Note Template
  *Use this format for your endnotes to satisfy editorial deadlines.*

  > **Historical Note on [Scene/Detail]:**
  > This scene utilizes the **Judea Plausibility Protocol**.
  > **Status:** [Fact / Ambiguous / Invention]
  > **Key Criterion:** [e.g., Passed Friction Test / Failed Multiple Attestation]
  > **Reasoning:** [One sentence from the Case Study above].
  > **Deviation:** [If you chose to present an "Invention" as fact for narrative flow, admit it here].

  ---

  ### Operational Flags for the Author
  *   **[JUDGMENT CALL]:** Whenever you assess "Theological Purpose," you are interpreting the evangelist's intent. If you feel uncertain, default to **Ambiguous**.
  *   **[STOP POINT]:** If Step 1 (Context) fails, do not proceed. No amount of theological depth saves an anachronism.
  *   **[CONFLICT RULE]:** If the Friction Test says "Fact" but you feel emotionally resistant (e.g., The Birth Narrative), trust the Protocol. The friction exists *because* it is likely historical; smooth stories are often polished later.
