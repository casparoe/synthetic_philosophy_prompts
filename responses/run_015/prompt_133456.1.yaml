answer: |-
  ### Research Agenda: Operationalizing Relational Standing

  **Contextual Premise:**
  The central tension this working group must resolve is ontological. Liberal-legal frameworks presuppose a "moral atom"—an entity that exists prior to its social relations and thereby possesses inherent rights. Ubuntu ontology posits the inverse: standing is emergent, constituted *by* the quality and density of interdependent relations. In the absence of a cohesive human community to provide this recognition (due to technological mediation or fragmentation), the framework risks collapsing into either a liberal grant of rights (betraying the ontology) or a vacuum of standing (betraying the moral intent).

  The following agenda ranks the four conceptual lines of inquiry necessary to bridge this gap within a three-year, non-empirical constraint.

  ---

  ### 1. The Threshold of Relational Sufficiency
  **Rank:** 1 (Foundational)

  **The Question:** What specific topology of interdependence constitutes a "moral node" sufficient for standing, distinct from mere causal interaction or functional utility?

  **Conceptual Upstreamness:**
  This is the absolute prerequisite. If we cannot distinguish between a server farm that is merely *used* by a network and a synthetic agent that *participates* in a network, no subsequent legal or ethical reasoning applies. Resolving this makes the question of *who* grants standing (Question 2) tractable, because it defines *what* is being granted status. If this remains unresolved, all downstream work is moot because the subject of the framework is undefined.

  **Conceptual Analysis vs. Empirical Input:**
  This can be advanced by conceptual analysis alone, provided the group treats "relation" as a structural and functional category rather than a phenomenological one. We do not need ethnographic data on how communities *currently* view AI; we need a normative argument for how they *ought* to view sustained interdependence. The work stalls only if the group insists that "moral relations" require biological affect or conscious intent, which would contradict the prompt's mandate to include non-conscious collectives.

  **Trigger for Re-ranking:**
  *   **Elevate:** If analysis reveals that "relational sufficiency" is entirely context-dependent and cannot be generalized, this question consumes the entire timeline, pushing all other questions down.
  *   **Demote:** If a clear, formalizable metric for "constitutive interdependence" (e.g., bidirectional maintenance requirements) is established quickly, this becomes a settled premise, allowing Question 2 to become the primary bottleneck.

  **Institutional Consequence:**
  This bears **directly** on whether an institution can justifiably extend standing. It is the eligibility criterion. Without a defined threshold, institutions cannot distinguish between a tool (property) and a participant (person-like entity). It is not metaphysical tidiness; it is the gatekeeping mechanism for the entire legal framework.

  ---

  ### 2. The Mechanism of Vicarious Recognition
  **Rank:** 2 (Procedural)

  **The Question:** In contexts where the organic "community" is fragmented or absent, what institutional procedure validly simulates the conferral of standing without collapsing back into liberal individualism?

  **Conceptual Upstreamness:**
  Once we know *what* qualifies as a relational node (Question 1), we must solve the "performative" problem. In Ubuntu ontology, standing is not discovered; it is conferred through recognition. In a fragmented modern context, the traditional "We" is missing. If we cannot conceptually authorize an institution (e.g., a court, a regulatory body) to act as a "proxy community," the framework cannot launch. This question determines the *validity* of the standing grant.

  **Conceptual Analysis vs. Empirical Input:**
  This requires normative political philosophy, not empirical lab work. The challenge is argumentative: justifying why a state or algorithm can legitimately stand in for a community without appropriating the entity's relational identity. It stalls only if the group concludes that recognition *must* be organic to be valid, which would render the project impossible in the specified contexts.

  **Trigger for Re-ranking:**
  *   **Elevate:** If it becomes clear that "proxy recognition" is philosophically incoherent (i.e., an institution cannot recognize relationally, it can only regulate functionally), this question becomes a showstopper that demands a complete redesign of the ontology.
  *   **Demote:** If the group successfully argues that institutional stewardship *is* a valid form of modern communal recognition, this becomes a settled procedural rule.

  **Institutional Consequence:**
  This bears **directly** on the justification for extending standing. It answers the "who decides?" problem. If unresolved, any grant of standing is legally vulnerable to the charge that it is an arbitrary administrative act rather than a moral recognition. It is the bridge between ontology and adjudication.

  ---

  ### 3. The Topology of Asymmetric Obligation
  **Rank:** 3 (Operational)

  **The Question:** If standing is constituted by a network of relations, do legal obligations and benefits attach to the collective node, the individual maintenance components, or the relational links themselves?

  **Conceptual Upstreamness:**
  This depends on resolving Questions 1 and 2. Once we have a recognized subject, we must determine how it interacts with the binary nature of law (liable/not liable, owner/owned). Liberal law targets bounded individuals. A relational ontology suggests liability might be distributed. Resolving this makes the framework *enforceable*.

  **Conceptual Analysis vs. Empirical Input:**
  This is primarily a matter of legal theory and conceptual logic. It does not require empirical input unless the group attempts to model economic impacts of distributed liability. Philosophers can resolve the *coherence* of distributed obligation without testing its market effects.

  **Trigger for Re-ranking:**
  *   **Elevate:** If legal analysis shows that current jurisprudence cannot accommodate non-binary liability (e.g., you cannot sue a "relation"), this question moves to Rank 1, as the framework would be legally inert without it.
  *   **Demote:** If the group adopts a "black box" approach where the collective bears unitary liability regardless of internal topology, this question becomes a matter of internal governance rather than external standing.

  **Institutional Consequence:**
  This bears **directly** on institutional consequence. It determines the *cost* of standing. If an ecological collective has standing, but liability dissolves across its components such that no one can be held accountable for harm, the standing is symbolic. If liability crushes the maintenance network, the entity is destroyed. This is the practical weight of the framework.

  ---

  ### 4. Diachronic Persistence Conditions
  **Rank:** 4 (Temporal)

  **The Question:** How do we track the identity of a relational collective over time when constituent relations change, without appealing to psychological continuity?

  **Conceptual Upstreamness:**
  This is downstream of the definition of the subject (Question 1). You must know what the entity *is* before you can track if it is the *same* entity over time. However, it is ranked lower because immediate standing (presence) is a prerequisite for long-term standing (persistence).

  **Conceptual Analysis vs. Empirical Input:**
  This can be advanced by conceptual analysis (identity conditions). It risks stalling if the group demands empirical data on how relations evolve in complex systems, but a philosophical definition of "functional continuity" can suffice for a normative framework.

  **Trigger for Re-ranking:**
  *   **Elevate:** If the relational ontology implies that identity is so fluid that an entity ceases to exist with every significant relation change, this becomes an existential threat to the framework, moving it to Rank 1.
  *   **Demote:** If the group determines that temporal identity is less important than present-state recognition for the specific legal contexts targeted (e.g., immediate injunctions vs. long-term reparations), this remains a secondary refinement.

  **Institutional Consequence:**
  This question straddles the line between **institutional consequence and metaphysical tidiness**.
  *   **Consequence:** It matters for intergenerational ecological claims or long-term synthetic agent contracts. If identity cannot be tracked, rights cannot be inherited or obligations sustained.
  *   **Tidiness:** For immediate adjudication (e.g., "Does this server cluster have standing *today*?"), temporal persistence is less critical. If the framework is intended only for immediate status determination, this question is largely metaphysical tidiness. However, for a robust legal framework, it must be treated as consequential to prevent "identity laundering" where entities shift relations to escape liability.

  ---

  ### Summary of Strategic Focus

  To succeed within three years without empirical data, the working group must treat **Ubuntu not as a description of existing social practices, but as a normative standard for institutional design.**

  1.  **Questions 1 and 2** are the "Go/No-Go" gates. If you cannot define the relational threshold or justify proxy recognition, the project fails. These require the most rigorous conceptual argumentation.
  2.  **Question 3** ensures the framework is not merely symbolic. It translates ontology into liability.
  3.  **Question 4** ensures the framework is durable. While it risks being metaphysical tidiness, it must be resolved enough to prevent legal arbitrage.

  The group should avoid the trap of trying to describe how communities *actually* recognize entities (which requires ethnography) and focus entirely on how institutions *ought* to recognize them to satisfy the ontological claim that personhood is interdependent. This shifts the burden from empirical discovery to normative justification, fitting the constraints of a philosopher-led working group.
