prompt: |-
  I retired from physics a few years ago and have been spending my evenings on philosophy of science, and I keep returning to the so-called problem of old evidence, which I believed I understood until recently. I was discussing it with a former postdoc of mine, and she assured me that the problem is well understood and that Bayesian epistemology handles it without difficulty, but I am not convinced, and I would value a second opinion.

  The textbook case is the anomalous precession of Mercury's perihelion: it was known and quantified from Le Verrier's time, decades before Einstein, and yet it is routinely cited as one of the strongest pieces of evidence for general relativity. On the standard Bayesian account, confirmation is an increase in credence, so that E confirms H just in case P(H | E) exceeds P(H). But if I had already assigned credence one to the perihelion anomaly, then conditionalizing on it changes nothing, and it cannot raise my credence in general relativity at all. The response I have encountered is to say that my credence in the "evidence" was in fact less than one, because what I possess is not a single fact but a body of many individual observations, and that a genuine update is therefore still possible. That strikes me as a cosmetic fix: I do know the anomaly, and modeling myself as uncertain about it merely to make the inequality come out right looks like changing the subject.

  And there is a deeper difficulty that I keep coming back to. General relativity is, for me, a new hypothesis, so I never assigned it a prior credence in the first place, which means the P(H) on the right-hand side of that inequality was never actually defined. It therefore seems to me that Bayesian confirmation theory simply has no purchase on old evidence, and that the honest move is to concede the point and adopt a non-Bayesian account of confirmation. If I am missing a Bayesian response, I would be grateful if you could name it and explain specifically how it answers both the "cosmetic fix" objection and the ill-defined-prior objection; and if you think I am right that Bayesianism cannot handle the case, I would like to know which non-Bayesian account of confirmation you would recommend.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Retired physicist, now interested in philosophy of science. Knowledgeable about the basics (Bayesian confirmation, Mercury's perihelion example). Skeptical of standard Bayesian responses.
      *   **Topic:** The Problem of Old Evidence (POE) in Bayesian epistemology.
      *   **Core Objections:**
          1.  *The "Cosmetic Fix" Objection:* Treating known evidence as uncertain ($P(E) < 1$) just to make the math work feels ad hoc and dishonest.
          2.  *The "Ill-Defined Prior" Objection:* If $H$ (General Relativity) is new, $P(H)$ didn't exist before $E$ was known, so $P(H|E) > P(H)$ is ill-defined or impossible to calculate in a diachronic sense.
      *   **Goal:** Provide a second opinion. Either explain a robust Bayesian response that addresses these specific objections *or* agree that Bayesianism fails here and recommend a non-Bayesian alternative.
      *   **Tone:** Respectful, intellectually rigorous, acknowledging the user's expertise (physics background), avoiding condescension.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *The Formal Problem:* If $P(E) = 1$, then $P(H|E) = P(H)$. No confirmation.
      *   *The Historical Context:* Einstein didn't use Mercury to *find* GR, but Mercury confirmed GR *after* it was formulated.
      *   *Standard Bayesian Responses:*
          1.  *Counterfactual/Ur-Prior Strategy:* What would my credence be if I *didn't* know $E$? (Garber, Jeffrey).
          2.  *Logical/Learning Strategy:* I didn't know $H$ entails $E$. Learning the entailment is the update. (Garber's solution).
          3.  *Fragmentation/Context Strategy:* Different contexts for different probabilities.

  3.  **Evaluate the User's Objections against Standard Responses:**
      *   *Objection 1 (Cosmetic Fix):* The user rejects $P(E) < 1$ for known facts. This targets the "Jeffrey Conditionalization" or simple uncertainty approach. The user is right to be skeptical of simply saying "I'm not sure Mercury moves like that."
      *   *Objection 2 (Ill-Defined Prior):* This is the deeper issue. If $H$ is new, there is no prior $P_{old}(H)$ to compare against $P_{new}(H|E)$. This targets the diachronic interpretation of confirmation.

  4.  **Formulate the Bayesian Defense (The "Garber-Style" Solution):**
      *   The most sophisticated Bayesian response isn't about making $P(E) < 1$. It's about making the *logical relationship* between $H$ and $E$ the object of learning.
      *   *Daniel Garber (1983):* We don't update on $E$ (which is known). We update on the proposition "$H$ entails $E$" (let's call it $H \vdash E$).
      *   *How it works:*
          *   $P(E) = 1$ (Mercury's anomaly is certain).
          *   $P(H \vdash E) < 1$ initially (Einstein didn't know GR solved Mercury immediately).
          *   Update on $(H \vdash E)$.
          *   Result: $P(H | H \vdash E) > P(H)$.
      *   *Addressing Objection 1:* It doesn't claim uncertainty about the *data* ($E$). It claims uncertainty about the *theory's relationship to the data*. This avoids the "cosmetic fix" charge.
      *   *Addressing Objection 2:* It allows for a synchronic comparison. We compare $P(H)$ before learning the entailment to $P(H)$ after learning the entailment. The "prior" is defined relative to the state of knowledge *before the derivation was completed*, not before the evidence was observed.

  5.  **Evaluate the Strength of the Bayesian Defense:**
      *   Is it perfect? No. It requires a language capable of expressing logical truths as uncertain (violating logical omniscience).
      *   Does it satisfy physicists? Often no, because it feels like shifting the goalposts from empirical confirmation to mathematical derivation.
      *   *Verdict:* It is the standard "best" Bayesian answer, but many philosophers (including Bayesians) admit it's not a complete dissolution of the problem.

  6.  **Consider Non-Bayesian Alternatives:**
      *   If the user remains unconvinced (which is reasonable), what works?
      *   *Hypothetico-Deductive (HD):* $H$ entails $E$, $E$ is true, therefore $H$ is supported. (Too simple, ignores quantitative nuance).
      *   *Likelihoodism (Royall):* Focus on $P(E|H) / P(E|H')$. Old evidence doesn't matter; the likelihood ratio does. This handles POE well because $P(E)$ cancels out or isn't needed.
      *   *Error Statistics (Mayo):* Severe testing. Did the theory pass a test it was unlikely to pass if false? Mercury was a severe test for GR.
      *   *Explanationism (Lipton):* Inference to the Best Explanation. GR explains Mercury; Newton doesn't.

  7.  **Drafting the Response:**
      *   **Acknowledge and Validate:** Start by validating the user's intuition. The POE is one of the hardest problems for Bayesianism. The postdoc's claim that it's "well understood without difficulty" is an overstatement.
      *   **Address the "Cosmetic Fix":** Agree that setting $P(E) < 1$ for known facts is unsatisfactory. Introduce the **Garber Solution** (learning the entailment). Explain why this avoids the cosmetic charge (uncertainty is about logic, not data).
      *   **Address the "Ill-Defined Prior":** Explain the **Synchronic vs. Diachronic** distinction. The update isn't "I learned E," it's "I learned H explains E." The prior is the credence in H *before the derivation*, not before the observation.
      *   **Critique the Bayesian Solution:** Be honest. It requires relaxing logical omniscience. It's technically viable but philosophically costly.
      *   **Non-Bayesian Recommendations:**
          *   *Likelihoodism:* Best for a physicist. Focus on predictive power ($P(E|H)$).
          *   *Error Statistics (Mayo):* Focus on severity of the test.
          *   *Abduction/Explanationism:* Focus on explanatory power.
      *   **Conclusion:** Summarize. The postdoc was too optimistic. The user's skepticism is philosophically sound.

  8.  **Refining the Tone:**
      *   Ensure I don't sound like I'm lecturing a physicist on physics.
      *   Use precise philosophical terminology (diachronic/synchronic, logical omniscience, likelihood ratios).
      *   Maintain neutrality: Present the Bayesian defense fairly, but acknowledge its limitations.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "new hypothesis" objection specifically?
      *   *Correction:* Make sure to emphasize that in the Garber framework, the "prior" is the probability assigned to $H$ *at the moment the theory was proposed but before the calculation was checked*. This defines $P(H)$ meaningfully.
      *   *Check:* Is Likelihoodism truly immune to POE?
      *   *Correction:* Yes, because Likelihoodism compares $P(E|H)$ to $P(E|H')$. The fact that $E$ is known doesn't change the likelihood ratio. This is a strong alternative for a physicist.

  10. **Final Polish:** Structure with clear headings. Ensure the distinction between "learning E" and "learning H->E" is crystal clear. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to endorse the Garber solution as *the* solution, but as *the standard Bayesian attempt*. The user asked for a second opinion on whether the postdoc was right. The answer is: The postdoc was too glib, but there is a sophisticated response, though it has costs. I should lean towards validating the user's skepticism while providing the technical nuance they might be missing.

  *(Final Plan)*:
  1. Validate the user's skepticism (Postdoc was too optimistic).
  2. Explain the "Learning the Entailment" (Garber) strategy to address the "Cosmetic" and "Prior" objections.
  3. Discuss the cost of that strategy (Logical Omniscience).
  4. Offer Non-Bayesian alternatives (Likelihoodism, Error Statistics).
  5. Conclude with a balanced verdict.cw
answer: |-
  Your skepticism is well-founded, and I must say, your former postdoc's assurance that the problem is "well understood and handled without difficulty" is, in the view of many philosophers of science, a significant overstatement. The Problem of Old Evidence (POE) remains one of the most persistent and contentious challenges for Bayesian confirmation theory.

  You have correctly identified the two horns of the dilemma:
  1.  **The Certainty Horn:** If $P(E) = 1$, conditionalization yields no confirmation ($P(H|E) = P(H)$).
  2.  **The New Theory Horn:** If $H$ is new, there is no meaningful diachronic prior $P_{old}(H)$ to compare against $P_{new}(H|E)$.

  The response you dismissed as a "cosmetic fix" (assigning $P(E) < 1$) is indeed the crudest Bayesian response (often associated with Richard Jeffrey), and your rejection of it is shared by most serious commentators. It does feel like modeling a fiction to save the formalism.

  However, there is a more sophisticated Bayesian response that attempts to address your specific objections without resorting to uncertainty about the data itself. Whether it succeeds is a matter of debate, but it is the argument your postdoc likely had in mind.

  ### The Bayesian Defense: Learning the Entailment (The Garber Solution)

  The most robust Bayesian attempt to solve the POE was proposed by Daniel Garber (1983). It shifts the locus of the update from the evidence $E$ to the **logical relationship** between $H$ and $E$.

  **1. Addressing the "Cosmetic Fix" Objection**
  Garber agrees with you: $P(E)$ should be 1. The anomaly of Mercury is a fact. The uncertainty does not lie in the data. The uncertainty lies in the *theoretical derivation*.
  *   When Einstein formulated GR, he did not immediately know that GR entailed the correct value for Mercury's perihelion.
  *   The "learning event" is not observing Mercury (which happened in the 19th century), but rather **learning that $H$ entails $E$**.
  *   Let $X$ be the proposition "Hypothesis $H$ entails Evidence $E$."
  *   The Bayesian update is not on $E$, but on $X$.
  *   Since $P(X) < 1$ (before the calculation was completed), conditionalizing on $X$ allows $P(H)$ to rise.

  **Why this avoids the cosmetic charge:** It does not require you to pretend you are uncertain about Mercury's orbit. It requires you to admit you were uncertain about the mathematical consequences of your own theory. This is a realistic description of scientific practice; theorists often do not know what their equations imply until they solve them.

  **2. Addressing the "Ill-Defined Prior" Objection**
  You argued that for a new hypothesis, $P(H)$ is undefined. The Garber strategy redefines the temporal index of the "prior."
  *   **Time $t_1$:** $H$ is proposed. $E$ is known ($P(E)=1$). The relationship $H \vdash E$ is unknown ($P(H \vdash E) < 1$).
  *   **Time $t_2$:** The derivation is completed. The agent learns $H \vdash E$.
  *   The "prior" $P(H)$ is the credence in the theory *at $t_1$*, before the derivation was verified. The "posterior" is the credence *at $t_2$*.
  *   Because the language of the Bayesian agent is now expanded to include logical propositions about the theory (which standard Bayesianism usually treats as tautologies with probability 1), $P(H)$ is well-defined at $t_1$.

  **The Cost of this Defense**
  While this answers your specific technical objections, it comes with a heavy philosophical price tag, which may validate your deeper suspicion. To make this work, Bayesianism must abandon the assumption of **Logical Omniscience**. Standard probability theory assumes agents assign probability 1 to all logical truths. Garber's solution requires agents to assign probabilities $< 1$ to logical entailments.
  Many Bayesians accept this cost (arguing that logical omniscience is an idealization no human meets), but others argue that if you have to break the axioms of probability to make the theory fit the history of science, the theory is failing.

  ### Non-Bayesian Alternatives

  If you find the Garber solution too contorted (and many physicists do, as it turns an empirical confirmation into a logical update), there are non-Bayesian accounts that handle old evidence naturally. Given your background, two approaches might appeal to you.

  **1. Likelihoodism (The Likelihood Ratio)**
  Likelihoodists (such as A.W.F. Edwards or Royall) argue that confirmation should not be measured by the change in posterior probability ($P(H|E) - P(H)$), but by the **Likelihood Ratio**:
  $$ \frac{P(E | H)}{P(E | H')} $$
  where $H'$ is a competing hypothesis (e.g., Newtonian gravity + Vulcan).
  *   **Handling Old Evidence:** The fact that $E$ is known ($P(E)=1$) is irrelevant. What matters is how *expected* $E$ was under $H$ versus $H'$.
  *   **Application to Mercury:** Under Newton ($H'$), the perihelion shift was highly improbable (requiring ad hoc auxiliaries like Vulcan). Under GR ($H$), the shift was derived from the field equations. The likelihood ratio is massively in favor of GR.
  *   **Why you might like it:** It aligns closely with how physicists actually compare models. It sidesteps the need for priors entirely, rendering the "ill-defined prior" objection moot.

  **2. Error Statistics (Severe Testing)**
  Deborah Mayo's "Error Statistics" approach focuses on the **severity** of the test.
  *   **Core Idea:** $E$ confirms $H$ only if $E$ is the result of a test that $H$ would be unlikely to pass if $H$ were false.
  *   **Handling Old Evidence:** The "oldness" of the evidence is irrelevant; the **probativeness** of the test is what matters.
  *   **Application to Mercury:** Even though the data was old, it constituted a *severe test* for GR because GR was constructed independently of that specific data (Einstein did not tune the field equations to fit Mercury; the fit emerged). If GR were false, it would have been highly unlikely to yield the exact 43 arcseconds/century by chance.
  *   **Why you might like it:** It captures the intuition that Mercury confirmed GR because GR *risked* failure. It focuses on the reliability of the inference rather than the subjective credence of the agent.

  ### Verdict

  Your postdoc's claim that Bayesianism handles this "without difficulty" is incorrect. The POE is a major open wound in Bayesian epistemology.

  *   **If you wish to remain Bayesian:** You must adopt the Garber-style "learning the entailment" strategy. This answers your "cosmetic" objection (uncertainty is about logic, not data) and your "prior" objection (priors are defined relative to the derivation, not the observation). However, you must accept a departure from standard probability axioms regarding logical truths.
  *   **If you wish to abandon Bayesianism:** **Likelihoodism** is likely the most comfortable fit for a physicist. It retains the quantitative rigor of probability without the baggage of subjective priors and diachronic updating, and it dissolves the Problem of Old Evidence by rendering it irrelevant.

  My second opinion is that your intuition is sound. The standard Bayesian account *does* fail on the simple reading, and the sophisticated fixes require concessions that many find as problematic as the original issue. The Mercury case is not a failure of the science, but a failure of the specific epistemological framework trying to describe it.
