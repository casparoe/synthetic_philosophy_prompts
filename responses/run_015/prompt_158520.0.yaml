prompt: |-
  While arguing about whether courts should strike down popular legislation, my interlocutor kept repeating that "unelected judges shouldn't overrule the people's representatives," treating it as a knock-down objection rather than an argument that needs unpacking. I think the phrase sounds decisive only because it collapses several distinct claims into one. Could you disambiguate it into a menu of precise theses — specifying, for each, what kind of "should" is in play (moral, institutional-design, or conceptual-democratic), whose "people" is being invoked (present voters, a constitutional supermajority, an idealized public will, or future generations), and what "overrule" amounts to (voiding a statute, interpreting it narrowly, delaying implementation, or issuing advisory opinions)? For each reading, say whether it is a platitude, a substantive and defensible claim, or false, and flag which ones actually support dismissing judicial review outright versus which ones leave room for limited review. Please separate what is well-established in democratic theory and constitutional scholarship from what remains genuinely contested, and do not present a disputed normative position as the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Task:** Disambiguate the phrase "unelected judges shouldn't overrule the people's representatives" into a menu of precise theses.
      *   **Required Dimensions:**
          *   Type of "should" (moral, institutional-design, conceptual-democratic).
          *   Definition of "people" (present voters, constitutional supermajority, idealized will, future generations).
          *   Definition of "overrule" (voiding, narrow interpretation, delaying, advisory).
          *   Evaluation (platitude, substantive/defensible, false).
          *   Implication (dismiss review outright vs. allow limited review).
          *   Scholarly Status (well-established vs. genuinely contested).
      *   **Constraint:** Do not present disputed normative positions as consensus. Maintain neutrality and precision.

  2.  **Deconstruct the Phrase:**
      *   "Unelected judges": Refers to the judiciary, specifically life-tenured or appointed justices (like the US Supreme Court).
      *   "Shouldn't": Normative claim. Could be pragmatic, moral, or structural.
      *   "Overrule": Judicial review (striking down laws).
      *   "People's representatives": The legislature (Congress, Parliament).
      *   "The People": The source of legitimacy.

  3.  **Brainstorming Theses (The "Menu"):**
      *   *Thesis 1: Pure Majoritarianism.* Whatever the current legislature says goes. (Strong form).
      *   *Thesis 2: Constitutional Supremacy.* Judges enforce the *older* will of the people (Constitution) against the *newer* will (Statute).
      *   *Thesis 3: Rights Protection.* Judges protect minorities against majority tyranny.
      *   *Thesis 4: Institutional Competence.* Legislatures are better at fact-finding/policy; courts are better at principle.
      *   *Thesis 5: Procedural Justice.* The process of legislation is more democratic than adjudication.

      *Refining for the Prompt's Dimensions:* I need to structure these specifically around the "should," "people," and "overrule" variables.

      *   *Option A (The Populist/Majoritarian Reading):* Current majority will is supreme.
      *   *Option B (The Constitutional Sovereign Reading):* The "People" enacted the Constitution; judges are just agents of that higher law.
      *   *Option C (The Rights-Based Reading):* "The People" includes minorities whose rights are trampled by representatives.
      *   *Option D (The Institutional Competence Reading):* Judges *can* but *shouldn't* unless specific criteria are met (process failure).

  4.  **Drafting the Theses (Iterative Process):**

      *   *Thesis 1: Strict Majoritarianism.*
          *   Should: Moral/Political.
          *   People: Current voting majority.
          *   Overrule: Voiding statutes.
          *   Status: Contested. False in constitutional systems.
          *   Implication: Abolish review.

      *   *Thesis 2: Dualist Democracy (Ackerman).*
          *   Should: Conceptual-Democratic.
          *   People: Constitutional supermajority (We the People) vs. Ordinary politics.
          *   Overrule: Voiding statutes that violate higher law.
          *   Status: Well-established theory.
          *   Implication: Limited review allowed.

      *   *Thesis 3: Rights Fundamentalism.*
          *   Should: Moral.
          *   People: Individuals/Minorities (counter-majoritarian).
          *   Overrule: Voiding rights-infringing laws.
          *   Status: Contested (what counts as a right?).
          *   Implication: Limited review allowed.

      *   *Thesis 4: Procedural Reinforcement (Ely).*
          *   Should: Institutional-Design.
          *   People: Participants in the democratic process (blocked minorities).
          *   Overrule: Fixing process failures.
          *   Status: Well-established/Influential.
          *   Implication: Limited review allowed.

      *   *Thesis 5: Departmentalism/Coordinate Construction.*
          *   Should: Institutional-Design.
          *   People: Branches share interpretation duty.
          *   Overrule: Judges don't have final say.
          *   Status: Contested/Historical.
          *   Implication: Limited/Shared review.

  5.  **Refining the Evaluations:**
      *   Need to be careful not to say "Thesis 2 is true." Say "Thesis 2 is a dominant justification in liberal constitutionalism."
      *   Need to distinguish between *descriptive* (how systems work) and *normative* (how they should work).
      *   Ensure the "Should" categories are clear.

  6.  **Addressing the "Scholarly Status" Constraint:**
      *   Consensus: Most democracies have some form of review. Pure majoritarianism is not the consensus in constitutional democracies.
      *   Contested: The *scope* of review (originalism vs. living constitutionalism, substantive vs. procedural).
      *   Make sure to highlight that the phrase "unelected judges" is often a rhetorical shorthand for "counter-majoritarian difficulty."

  7.  **Structuring the Response:**
      *   Introduction: Acknowledge the rhetorical power of the phrase and the "counter-majoritarian difficulty."
      *   The Menu (numbered theses).
      *   For each thesis: Breakdown of dimensions (Should, People, Overrule), Evaluation, Implication, Scholarly Status.
      *   Synthesis/Conclusion: Summarize where the real debate lies (not *whether* review exists, but *how* it is justified).

  8.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I define "overrule" differently enough?
      *   *Correction:* Ensure I distinguish between striking down a law vs. interpreting it to avoid constitutional issues.
      *   *Check:* Is the distinction between "present voters" and "constitutional supermajority" clear?
