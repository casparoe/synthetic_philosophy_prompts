          *   Popper definitely leaned on the "survival of the fittest" tautology. However, he also worried about the historical nature of evolution (unique events vs. universal laws). The tautology was the *logical* reason for unfalsifiability; the historical nature was the *methodological* difficulty. The blog isn't wrong on the tautology, but it's not the whole story.
