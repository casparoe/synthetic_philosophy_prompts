      *   *Claim 3: The reason was circularity/tautology ("fit = survive").*
          *   **Verdict:** Partially accurate but simplified. Popper *did* use the tautology argument, but his deeper worry was about the *explanatory power* resulting from that tautology. If it explains everything, it predicts nothing.
      *   *Claim 4: He put it in the bin with Freud/Marx (metaphysical research programme).*
          *   **Verdict:** Accurate. He used this exact phrase. He didn't call it "pseudoscience" in the derogatory sense of "fake," but "non-science" (metaphysical) in the demarcation sense. This is often misunderstood.
      *   *Claim 5: He retracted near the end of his life.*
          *   **Verdict:** Accurate. In the late 70s/early 80s, he clarified his position.
      *   *Claim 6: The reason for retraction was specifying the environment.*
