      Correction 3: Defoliated host supports fewer herbivore-days -> doing nothing costs more.
      Asymmetry: Predators/pollinators > Pest herbivores.

      Okay, so for Winter Moth: If we do nothing, tree might defoliate. If tree defoliates, future herbivore-days drop. So doing nothing forecloses future experience. Intervention saves future experience but costs current. However, current are juveniles (Correction 1: low weight). So intervention might be favored *if* it saves the tree, provided non-targets aren't hit. Bt is specific. Bands are physical.
      For Aphids: Roses are heritage (ornamental). Defoliation unlikely to kill rose. Correction 3 doesn't apply strongly. Aphids are juveniles/clonal (high turnover). Correction 1 applies. Systemic kills predators (Asymmetry). So Procedure should say No to systemic.
      For Yellowjackets: Human safety. Procedure should flag "Human Safety Override."

      Okay, ready to write. Keep it dense, continuous, no formatting tricks.

      *One more check on constraints:* "no headings, no bullet points, no bold, no tables". I must ensure the output is pure text paragraphs.

      *Sentience Dial:* How to operationalize? Suggest a multiplier based on taxonomic group confidence. E.g., Hymenoptera higher confidence than Aphids. If confidence is low, the "cost" of killing is discounted.

