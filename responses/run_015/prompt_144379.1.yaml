      *   **Task:** Create a decision procedure based on a specific ethical principle ("don't count bodies, count foreclosed experience, and count it net") with three corrections (juvenile mortality, carrying capacity replacement, host defoliation costs) and an asymmetry (predators/pollinators vs. pest herbivores).
      *   **Requirements:**
          *   Turn the principle into a step-by-step decision procedure (questions in order, pass/fail criteria, handoff points).
          *   Address uncertainty (especially regarding sentience/consciousness) as a dial, not a fact.
          *   Run the procedure on three specific cases from last season (aphids on roses, winter moth on oaks, yellowjackets near toddlers).
          *   Be honest about where the procedure might contradict instinct, where it misfires, and what it can't do.
          *   **Format Constraint:** No headings, no bullet points, no bold, no tables. Continuous prose (like an email to a colleague).

  2.  **Deconstruct the Ethical Principle:**
      *   Core: Minimize net foreclosed experience (suffering/loss of potential life).
      *   Correction 1 (Juvenile Mortality): Most juveniles die anyway. Killing them counts less than killing those who would survive.
      *   Correction 2 (Carrying Capacity): Removing individuals opens space for others. Net loss is only the difference between the killed cohort and the replacement cohort.
      *   Correction 3 (Host Defoliation): Doing nothing might reduce total herbivore-days later if the host is destroyed. Intervention might save future experience.
      *   Asymmetry: Non-targets (predators, pollinators) have higher individual value (longer life, less replaceable) than pest herbivores.
      *   Uncertainty: Sentience is a dial (confidence level), not a binary fact.

  3.  **Drafting the Decision Procedure (Mental Outline):**
      *   Need a flow that fits a 20-minute meeting.
      *   Step 1: Identification & Necessity. Is it actually a pest? Is human safety involved? (Safety might override the ethic).
      *   Step 2: Sentience Confidence. How likely is it that this insect has experience to lose? (The "dial").
      *   Step 3: Population Dynamics (The Corrections). Are they juveniles? Are they at carrying capacity? What happens to the host plant?
      *   Step 4: Non-Target Impact. What else dies? Compare value (asymmetry).
      *   Step 5: Net Calculation. Weigh foreclosed experience vs. preserved experience.
      *   Handoff: If values conflict (e.g., human safety vs. insect welfare), kick to human decision. If data is missing, default to precaution or status quo.

  4.  **Drafting the Case Studies:**
      *   *Case 1: Aphids on Heritage Roses (Systemic Soil Drench).*
          *   Aphids: High turnover, short life, low sentience confidence?
          *   Systemic: Kills everything feeding on plant (including potential predators later?). Long residual.
          *   Roses: Ornamental, not ecological criticality?
          *   Principle check: Aphids reproduce fast, many die anyway. Systemic might kill predators (higher value). Net foreclosed experience might be higher with drench due to non-targets.
          *   Likely outcome: Reject drench.
      *   *Case 2: Winter Moth on Oaks (Bt vs. Bands vs. Nothing).*
          *   Caterpillars: Juveniles. High natural mortality?
          *   Host: Street oaks. Defoliation risk? If defoliated, fewer herbivore-days later.
          *   Options: Bt (specific), Bands (physical), Nothing.
          *   Principle check: If oaks survive, more herbivore-days later. If oaks die, less. But Bt kills caterpillars. Bands prevent ascent.
          *   Likely outcome: Bands (physical exclusion) might be best? Or Nothing if oak health isn't threatened. Need to apply the "defoliation cost" logic.
      *   *Case 3: Yellowjackets near Toddler Area.*
          *   Human safety vs. Insect welfare.
          *   Procedure should flag this as a values handoff. The ethic doesn't weigh human pain/death vs. insect experience easily.
          *   Likely outcome: Handoff/Exception.

  5.  **Addressing Format Constraints:**
      *   **CRITICAL:** No headings, no bullet points, no bold, no tables.
      *   Must be continuous prose.
      *   Tone: Professional, colleague-to-colleague, respectful of expertise but rigorous.

  6.  **Refining the Procedure for the "Email" Format:**
      *   Start by acknowledging the user's principle.
      *   Walk through the steps in paragraphs.
      *   Integrate the "sentience dial" explicitly.
      *   Discuss the three cases in narrative flow.
      *   End with limitations/critiques.

  7.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I use bold? No.
      *   *Check:* Did I use bullets? No.
      *   *Check:* Did I use headings? No.
      *   *Check:* Is the tone right? Needs to sound like an expert talking to an expert.
      *   *Check:* Did I address the "sentience dial"? Yes, need to make sure it's a parameter in the calculation.
      *   *Check:* Did I handle the yellowjacket case honestly? Yes, admit the procedure breaks there.
      *   *Check:* Did I ensure at least one case contradicts instinct? The aphid case is likely to suggest "do nothing" or "mechanical only" when instinct might say "save the roses." The yellowjacket case should explicitly say "this procedure doesn't decide this."

  8.  **Final Polish (Mental Simulation of the Text):**
      *   Ensure smooth transitions between the procedure description and the case applications.
      *   Make sure the "corrections" (juvenile mortality, carrying capacity, defoliation) are woven into the steps.
      *   Ensure the "asymmetry" (predators vs. pests) is highlighted in the non-target assessment.
      *   Keep the "one paragraph rationale" constraint in mind—the procedure should generate that rationale.

      *(Self-Correction on Format)*: I need to be extremely careful not to accidentally insert a newline that looks like a list or a header. Just blocks of text.

      *(Self-Correction on Content)*: The user wants to know what to do when a number nobody can give us is needed (sentience). I need to propose a specific way to handle that, perhaps a conservative default or a weighting factor.

      *(Refining the Yellowjacket case)*: The user suspects the procedure can't handle it. I should confirm that. The procedure is about *insect* welfare net calculation. Human safety is an external constraint. The procedure should identify this as a "values handoff."

      *(Refining the Aphid case)*: Systemic drenches are nasty for non-targets. The asymmetry principle suggests this is bad. Aphids have high turnover (Correction 1). So killing them is "cheap" in welfare terms, but killing predators is "expensive." The procedure should likely reject the drench.

      *(Refining the Winter Moth case)*: Defoliation cost (Correction 3). If the oak dies, total herbivore days drop. If the oak lives, more caterpillars later. But Bt kills current caterpillars. Bands prevent feeding without killing? Bands might be best if they don't kill the caterpillars outright but starve them elsewhere? Actually, bands usually trap/glue them. Let's look at the "Net" aspect. If we save the oak, we allow future generations. If we let the oak defoliate, we reduce future capacity. But the goal is usually tree health. This is tricky. The procedure might suggest "Nothing" if the tree can withstand it, because killing the current cohort + saving the tree = more future insects = more future killing needed? Or does saving the tree maximize total experience? The principle is "count foreclosed experience." If the tree dies, future experience is foreclosed. So saving the tree maximizes experience? But killing the current ones forecloses theirs. This is where the "net" calculation matters. If the tree dies, the current caterpillars die anyway (starvation). So saving the tree saves current + future. But does that mean we *should* intervene? The principle is minimizing *negative* welfare or maximizing *net*? The prompt says "count foreclosed experience, and count it net." This implies minimizing loss. If intervention saves the tree, it prevents the loss of future habitat. But intervention kills current insects. This needs careful phrasing. Actually, the prompt says "doing nothing can cost more than intervening" via defoliation. So intervention might be justified to preserve future capacity. But the asymmetry says don't kill predators. Bt is specific. Bands are physical. Let's see where the logic leads.

      *Wait, re-reading the principle:* "don't count bodies, count foreclosed experience, and count it net."
      Correction 1: Juveniles dead anyway -> low weight.
