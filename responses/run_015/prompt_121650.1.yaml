  # Metaphysical Taxonomy of the Strange Loop Self

  This decision tree maps the logical space of positions regarding personal identity as a self-referential "strange loop." Navigate by answering each scenario-based question with **Yes** or **No**. Follow the branch corresponding to your answer until you reach a leaf position.

  ### **Node 1 (Root): Substrate Independence**
  **Question:** Do you accept that an isomorphic strange loop could exist in a non-biological substrate, such as a digital simulation or a gradually replaced synthetic neural network?
  *   **No:** Go to **Node 2**.
  *   **Yes:** Go to **Node 3**.

  ---

  ### **Node 2: Biological Ontology**
  **Question:** If the biological substrate is destroyed, does the "I" cease to exist even if an exact psychological copy is instantiated elsewhere in a new biological body?
  *   **Yes:** → **Leaf 2 (Strict Biological-Continuity View)**
      *   *Diagnosis:* The self is inextricably tied to the specific physical history of the organic organism.
  *   **No:** → **Leaf 3 (Eliminativist View)**
      *   *Diagnosis:* If the specific biology is not required and no other pattern holds identity, the "I" is treated as a useful fiction with no metaphysical weight. (Note: This path converges with Node 5's "Fiction" branch).

  ---

  ### **Node 3: Causal History Requirement**
  **Question:** If the pattern constituting the loop were copied discontinuously (e.g., via teleportation or instantaneous upload) to a new substrate, would the same loop persist?
  *   **No (Persistence Requires Continuous Causal History):** Go to **Node 4**.
  *   **Yes (Persistence Allows Discontinuous Copying):** Go to **Node 5**.

  ---

  ### **Node 4: Bounded Loop Ontology**
  **Question:** Is the "I" a real metaphysical entity grounded in this causally continuous loop, or merely a useful fiction?
  *   **Real Entity:** → **Leaf 5 (Hybrid "Bounded Loop" Position)**
      *   *Diagnosis:* The loop is genuinely self-referential and real, but can only persist through an unbroken causal chain of pattern maintenance; gradual replacement is permissible but discontinuous copying is not.
  *   **Useful Fiction:** → **Leaf 3 (Eliminativist View)**
      *   *Diagnosis:* Converges with Node 2's fiction branch; denies metaphysical weight regardless of causal history.

  ---

  ### **Node 5: Narrative Condition**
  **Question:** If autobiographical narrative continuity were broken (e.g., total amnesia) but the functional loop remained, would the self survive?
  *   **No (Narrative Continuity is Necessary):** → **Leaf 4 (Narrative-Constructivist View)**
      *   *Diagnosis:* Accepts the loop descriptively but denies it tracks a real entity; the self is constituted by the narrative rather than the underlying pattern alone.
  *   **Yes (Narrative is Merely a Descriptive Overlay):** Go to **Node 6**.

  ---

  ### **Node 6: Token Distribution**
  **Question:** Can the symbol "I" be distributed across multiple nodes simultaneously without loss of identity, or must it be a singular token?
  *   **Distributed Across Nodes:** → **Leaf 6 (Distributed Pattern Realism)**
      *   *Diagnosis:* **Unexplored/Unstable.** While logically possible, this view faces severe individuation problems (e.g., if the loop splits across two servers, are there two selves or one?).
  *   **Singular Token:** → **Leaf 1 (Substrate-Independent Pattern View)**
      *   *Diagnosis:* Associated with Hofstadter; the self is a real, singular, self-referential symbol arising from the pattern, independent of substrate and narrative overlay.

  ---

  ### **Notes on Branching and Leaves**

  **Empty or Incoherent Branches:**
  *   **Biological Copying Path:** At Node 1, answering **No** (Biological Only) logically precludes answering **No** at Node 2 (Copy Survives). If one insists that only biology supports the loop but also that a copy survives destruction, the position is incoherent unless the copy is also biological, in which it collapses into Node 2's **Yes** branch. This combination is excluded from the tree as unstable.
  *   **Distributed Fiction Path:** At Node 6, if one answers **Distributed** but also denies the entity is real (a variation of Leaf 3), the position becomes difficult to distinguish from Leaf 4 (Narrative Constructivism) without further criteria regarding *what* is distributed. This branch is folded into Leaf 3 for simplicity.

  **Leaf Separation Flag:**
  *   **Leaf 3 (Eliminativist) Convergence:** Leaf 3 is reachable from Node 2, Node 4, and potentially Node 6. These paths represent distinct routes to the same conclusion (that the "I" lacks metaphysical weight). The questions *do* separate the *reasoning* (biology vs. causal history vs. pattern ontology), but they converge on the same metaphysical denial. Students arriving here from different branches hold the same final position despite different justificatory paths.
  *   **Leaf 3 vs. Leaf 4:** These leaves are genuinely separated by Node 5. Leaf 3 denies the loop's reality regardless of narrative; Leaf 4 grants the loop descriptive reality but makes it contingent on narrative continuity. A student who believes the self survives amnesia (Node 5: Yes) cannot occupy Leaf 4.
