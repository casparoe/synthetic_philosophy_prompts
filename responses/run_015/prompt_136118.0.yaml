      *   *Wait, if they all fail, is it frustrating?* Yes, but productive.
      *   *Let's combine:* They must choose a point. If they choose arbitrarily, they fail the "Rationality" test. If they choose based on reasons, they break symmetry.
      *   *Okay, the "Coordination" angle is stronger for a group session.* It makes the symmetry breaking visible. Let's stick to the "Group Consensus on a Featureless Field" model. It mirrors the "System State" selection in physics.

