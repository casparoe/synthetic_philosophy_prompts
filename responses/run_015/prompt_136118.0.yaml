      *   *Let's simplify:* The "Single Point" problem.
      *   *Scenario:* The group must select one point on a continuous circle.
      *   *Constraint:* No external markers. No communication.
      *   *Payoff:* If the group converges (within a tolerance), they get a "Collective Pass." If they scatter, "Collective Fail."
      *   *Why this works:* It forces them to realize that without an exogenous perturbation (a mark, a noise, a leader), the symmetry cannot be broken rationally. They will either freeze (paralysis) or cheat (import symmetry).

  3.  **Drafting the Plan (incorporating Physicist Persona):**
