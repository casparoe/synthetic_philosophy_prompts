          *   55-75: Debrief (Mapping to theory).
      *   *Payoff:* "Certification of Rationality." (Non-monetary, status-based).
      *   *Failure Mode:* Students will inevitably use hidden symmetry breakers (shoes, windows, height). I need to anticipate this and use it in the debrief.
      *   *Theoretical Gap:* The activity simulates the *epistemic* problem well, but not the *volitional* problem (the actual feeling of will). I need to note this.

  4.  **Refining the Rules for Symmetry:**
      *   To ensure *continuous* symmetry, the choice space must be continuous.
      *   To ensure *no preference*, the payoff must be independent of the specific choice, provided consensus is reached.
      *   To prevent *randomization* (which solves the problem but bypasses the "reason" requirement), I must ban explicit randomization strategies.
      *   *Crucial Twist:* The "Reason Requirement." They must submit a written justification for *why* that point. This forces the Buridan problem. If they say "I guessed," they fail the reason test. If they say "Because of the window," they fail the symmetry test.

  5.  **Developing the Debrief:**
      *   Map the "Window" to "Exogenous Perturbation."
      *   Map the "Freezing" to "Paralysis/Infinite Regress."
      *   Map the "Guess" to "Arbitrary Will."

  6.  **Addressing the "What Will Go Wrong" Section:**
      *   Students *will* cheat. They will use the door, the light, the tallest person.
      *   *Recovery:* Don't scold. Highlight it. "You imported a field." This proves the point.

  7.  **Addressing the "Theoretical Feature Not Reproduced":**
      *   The activity is social/coordination. Buridan's Ass is often individual.
      *   The activity makes "arbitrary choice" look like "coordination failure."
      *   The *normative* weight of rationality (the fear of being irrational) is hard to simulate in a game.

  8.  **Final Review against Constraints:**
      *   75 minutes? Yes.
      *   15 grad students? Yes.
      *   No Buridan mention until end? Yes.
