answer: |-
  Good morning, and welcome to 'Demarcation after the Instruments'.

  It is a genuine pleasure to see this room divided as it is. On one side, we have philosophers who know the logic of falsification better than Popper did himself. On the other, we have working physicists and modellers who likely view demarcation as a problem settled decades ago, something to be worried about in seminars but not in the lab.

  My job this morning is not to bridge that gap with pleasantries, but to widen it just enough that we can see what lies underneath.

  We often treat falsificationism as a logical rulebook: if *P*, then *Q*; not *Q*, therefore not *P*. But I want to suggest we strip away the logic and look at the economics. At its heart, falsification was never just about consistency; it was about risk. To make a scientific claim was to stake something valuable—your reputation, your funding, your standing in the community—on the possibility that nature might say 'no'.

  To be a scientist, in the Popperian sense, was to hold out your neck. You made a prediction that could be checked by your peers, and you accepted that if the check failed, you would lose something. The risk was personal, and crucially, the means to verify that risk were distributed. Any competent peer could, in principle, reproduce the conditions and cut off your head.

  But look at the science we are doing today.

  We are relying on detectors that cost more than the GDP of small nations. We are relying on climate models and neural networks that are effectively black boxes, understood fully by only a handful of their creators. If I am a philosopher, or indeed a physicist at a different institution, I cannot reproduce your result. I do not have the million-pound machine. I do not have the proprietary code. I cannot check the work without trusting you.

  This brings us to the structural question we must wrestle with today.

  When the cost of verification becomes this high, and the machinery becomes this opaque, does the risk remain? If I cannot falsify your work because I cannot access the instrument, are you still holding out your neck? Or are you asking me to submit to your authority?

  There is a danger here that we need to name plainly. If science becomes dependent on instruments and algorithms that cannot be independently interrogated by the community, it shifts from a system of organised scepticism to a system of organised trust. It moves closer to priesthood than to falsification. The risk is no longer that nature will prove you wrong; the risk is that the community will stop trusting the high priests who run the machine.

  This is not an attack on the validity of modern physics or climate modelling. The predictions are often vital, and the tools are necessary. But we must ask whether the *demarcation* holds. If the criterion for science is bearing the risk of being wrong, and the tools remove the possibility of being checked, have we changed the nature of the enterprise?

  Today is not about producing a reading list or refining definitions for the sake of it. It is about determining whether our old maps fit this new terrain.

  To the philosophers: do not hide behind textual exegesis. If falsification doesn't fit the LHC or a global climate model, admit it and tell us what should replace it.
  To the scientists: do not dismiss this as metaphysical navel-gazing. If your work relies on trust rather than verification, you are vulnerable to charges of authority, and you need to know how to answer them.

  We are here to ask whether science is still about being wrong, or whether it has become about being believed. Let us spend the day finding out where the risk actually lies.

  Thank you, and let's get to work.
