answer: |-
  ### Desiderata for Bounded, Strategic Value of Information

  **1. Asymptotic Consistency (Non-negotiable)**
  *   **Requirement:** In the limit where attention costs vanish, the updater becomes ideal Bayesian, and signals are private, the measure must converge to the standard Expected Utility (EU) gain from Good's theorem.
  *   **Consideration:** Ensures the formalism generalizes standard decision theory rather than contradicting it in benign environments. It anchors the measure to the normative ideal while permitting deviation in the bounded setting.

  **2. Capacity for Negative Value via Irreversibility (Non-negotiable)**
  *   **Requirement:** The measure must admit negative values through a unified mechanism: information that cannot be costlessly disposed of (or ignored) is not free.
  *   **Consideration:** This must cover attention opportunity costs (buying $A$ precludes $B$), public observability (signal leaks strategy to opponents), and measurement perturbation (observer effect). If the agent is forced to update or act on a signal that degrades their position relative to the status quo, $VoI < 0$. This rules out metrics mathematically bounded at zero.

  **3. Utility Alignment (Non-negotiable)**
  *   **Requirement:** The measure must be denominated in the agent's utility units, not bits, variance, or currency.
  *   **Consideration:** A reduction in entropy or variance is only valuable insofar as it impacts the final payoff. A signal could drastically reduce variance about a state that is irrelevant to the decision; only utility denomination captures this irrelevance.

  **4. Implementation Sensitivity (Non-negotiable)**
  *   **Requirement:** The measure must vary if the agent's fixed update procedure processes different encodings of the same logical signal differently.
  *   **Consideration:** Unlike ideal Bayesians, bounded agents (e.g., neural networks, heuristic processors) may suffer from framing effects or precision limits. A measure invariant to encoding would fail to predict the actual utility change for a specific bounded architecture.

  **5. Strategic Externalities (Non-negotiable)**
  *   **Requirement:** The valuation must incorporate the expected reaction of other agents who observe the signal.
  *   **Consideration:** In a multi-agent setting, a public signal changes the common knowledge state. A signal might be privately useful but strategically disastrous if it reveals intent to an adversary. The value is a function of the equilibrium response, not just the private posterior.

  **6. Ex-Ante Tractability (Preference)**
  *   **Requirement:** The agent should be able to compute the value prior to observation without simulating the full downstream game tree.
  *   **Consideration:** If calculating the VoI requires solving the very problem the evidence was meant to simplify, the measure is operationally useless for stopping rules. We prefer a heuristic or bound that is cheaper to compute than the decision itself.

  **7. Sequential Decomposability (Preference)**
  *   **Requirement:** The value of a sequence of signals should be expressible as a function of the values of individual stages.
  *   **Consideration:** Facilitates dynamic programming or greedy stopping rules. However, due to strategic path-dependence, strict additivity may be impossible; submodularity is an acceptable relaxation.

  ***

  ### Incompatibilities and Deliverables

  **The Unsatisfiable Subset**
  You cannot jointly satisfy **Implementation Sensitivity**, **Strategic Externalities**, and **Ex-Ante Tractability** with a single context-free scalar.
  1.  **Invariance vs. Bounded Sensitivity:** Strict invariance under re-description is *incompatible* with sensitivity to a bounded update procedure. If the updater is sensitive to framing (e.g., loses precision on long decimals), a measure that is invariant to framing will systematically misestimate the value. To be accurate, the measure must inherit the agent's representational biases.
  2.  **Computability vs. Strategic Correctness:** Ex-ante computability from the agent's perspective is *incompatible* with correctness about a strategic environment. To correctly value a public signal ex-ante, the agent must solve for the opponents' equilibrium responses to that specific signal. For bounded agents, this simulation is often computationally intractable or requires information about opponents' bounds that is unavailable ex-ante.

  **The Deliverable**
  Since a single scalar is impossible, the deliverable should be a **conditional functional** $V(\pi, \sigma)$, where $\pi$ is the agent's update procedure and $\sigma$ is the profile of opponent strategies. Alternatively, provide a **pair of bounds** $[V_{private}, V_{public}]$, where the lower bound accounts for worst-case strategic leakage and the upper bound assumes private, costless absorption.

  ***

  ### The Exclusionary Requirement

  **Capacity for Negative Value via Irreversibility** does the most work.
  It immediately rules out **Mutual Information**, **Entropy Reduction**, and **Variance Reduction**. These information-theoretic proxies are mathematically non-negative; they treat information as inherently beneficial and ignore the costs of processing, the opportunity costs of attention, and the strategic risks of disclosure. They cannot distinguish between "useful data" and "dangerous knowledge."

  ***

  ### Scorecard

  | Metric | Utility Aligned | Allows Negative | Bounded/Strategic Sensitive | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Expected Utility Gain** | Yes | Yes (if costs included) | Yes (if modelled) | **Target** (but hard to compute) |
  | **Mutual Information** | No | No | No | **Reject** (ignores payoff/cost) |
  | **Expected Variance Reduction** | No | No | No | **Reject** (ignores decision impact) |
  | **Probability Act Changes** | No | No | Partial | **Reject** (ignores magnitude of loss) |
