      *   The "50/50" assumption relies on ignorance. Once I switch, my ignorance is gone regarding that specific pair.
      *   Key phrase: "The 50/50 rule only applies when you are truly ignorant of the history."

  6.  **Final Polish:**
      *   Make sure to explicitly mention the "prior distribution" concept simply (the "rules of the game" about how money gets in there).
      *   Ensure the tone is supportive. "You're not missing something obvious, this trips up experts."
      *   Check the dice math again.
          *   Pairs: (1,2), (2,4), (3,6), (4,8), (5,10), (6,12).
          *   If I see 4:
              *   Could be Small in (4,8). Prob of this pair is 1/6. Prob I picked Small is 1/2. Joint = 1/12.
              *   Could be Large in (2,4). Prob of this pair is 1/6. Prob I picked Large is 1/2. Joint = 1/12.
              *   Conditional prob: (1/12) / (1/12 + 1/12) = 1/2.
              *   So yes, 50/50 is correct *initially*.
          *   If I started with 2 and switched to 4:
