      *Wait, one more check on (3) vs (4).*
      User says: "plain actual-desire version... 'good for you' shouldn't come apart from what you actually want."
      If I want my spouse to be faithful, and they aren't, my desire is *not satisfied*. This is the standard "Object View" of desire satisfaction.
      If the user thinks "good for you" requires me to *feel* the satisfaction, then (4) contradicts (3).
