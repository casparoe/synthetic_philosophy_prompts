answer: |-
  1. The Essay Question

  **Final Exam: Hofstadter's "A Person Paper on Purity in Language"**

  **Time:** 45 Minutes
  **Length:** Approx. 700 words

  In Hofstadter's satire, the narrator defends generic "white" and compounds like "chairwhite" using arguments familiar to defenders of generic "man." To evaluate these arguments, we must distinguish between a **transparent-generic** use (where the term presents one subgroup as the unmarked norm for the whole kind, e.g., "All whites are created equal") and a **bleached-default** use (where the group-marking morpheme has allegedly lost its group-marking force and become a neutral component, e.g., the narrator's claim that "white" in "chairwhite" is pronounced "wit" and is race-neutral).

  Write an essay addressing the following: **Does the satire's moral indictment of the fictional "white" language transfer to actual English terms like "mankind," "chairman," and generic "he," and does the transfer hold equally for transparent generics and bleached defaults?**

  In your answer, you must:
  1.  Apply the **bleached-default vs. transparent-generic** distinction to at least one example from the satire and one example from actual English.
  2.  Explain why the narrator's claim that inclusive "white" has "no connotations whatsoever of race" is treated as false within the fiction, and what this implies for the parallel claim that "man" has a generic sense with no male connotations.
  3.  Address the narrator's defense of compounds (like "chairwhite"/"saleswhite") as "simple and useful components." If "chairman" is truly a bleached default, does the satire still convict it?
  4.  Offer a reasoned verdict on which actual uses are convicted by the analogy and which, if any, escape, specifying what linguistic evidence would decide the matter.

  *Note: You will receive no credit for simply stating that "the satire shows sexism is like racism." You must engage with the linguistic mechanisms (bleaching vs. transparency) described above.*

  ***

  2. The Model Answer

  Hofstadter's satire functions not merely by mapping sexism onto racism, but by exposing the rhetorical moves used to defend dominant groups as the linguistic norm. To determine whether the indictment transfers to actual English, we must separate terms that function as transparent generics from those that might be bleached defaults. The satire convicts transparent generics decisively, but complicates the verdict on bleached compounds, suggesting that even "bleached" terms retain the history of exclusion.

  The satire's force relies on the reader recognizing the narrator's claims about transparent generics as bad faith. When the narrator says, "All whites are created equal," using "white" inclusively, the reader immediately sees that whiteness is being positioned as the default human condition. The claim that this usage has "no connotations whatsoever of race" is ironic; within the fiction, it clearly connotes that whites are the standard and blacks are the deviation. This transfers directly to actual English transparent generics like "mankind" or the phrase "All men are created equal." If "white" in the fiction cannot be inclusive without marking race, "man" in reality cannot be inclusive without marking sex. The satire implies that the "generic sense" defense is a myth used to maintain male defaultism. Therefore, live generics like "mankind" and generic "he" are fully convicted by the analogy; they are transparent defaults that marginalize women just as generic "white" marginalizes blacks.

  The complication arises with compounds, where the narrator argues for a bleached default. He claims that in "chairwhite" or "saleswhite," the suffix is pronounced "wit" and is a "race-neutral component." This parallels the defense of "chairman" or "policeman" as historical fossils where "man" no longer signifies male. If "chairman" is truly bleached—semantically empty and phonetically reduced—the satire's indictment weakens, because "chairwhite" pronounced "wit" would indeed be neutral within the fiction's logic. However, the satire undermines this defense by showing the narrator's desperation. The narrator insists on the neutrality of "white" in compounds precisely because the transparency of "white" in generics is untenable. This suggests that in actual English, claims of bleaching are often retroactive justifications for retaining male-marked terms.

  Furthermore, the satire suggests that bleaching is rarely complete. The narrator admits "white" is still spelled the same, even if pronounced differently. Similarly, "chairman" is still spelled with "man," retaining the visual marker of maleness even if the speaker claims it is neutral. The satire implies that so long as the morpheme exists, it reinforces the subgroup as the norm. Therefore, even if "chairman" is arguably more bleached than "mankind," it is not innocent. It escapes the full force of the transparent generic indictment only if one can prove the male connotation is truly dead—a high bar given the narrator's dishonesty about "white."

  Ultimately, the satire transfers most strongly to transparent generics like "mankind" and generic "he," which are shown to be mechanisms of exclusion disguised as neutrality. For compounds like "chairman," the satire leaves room for linguistic debate but casts suspicion on the "bleaching" defense. The verdict depends on evidence: if "man" in "chairman" triggers male imagery in psychological tests or if "chairperson" changes that imagery, then the term is not truly bleached. Hofstadter shows that insisting on a "neutral" sense while retaining the marked form is a power move, whether the marker is "white" or "man." The satire convinces us that unless the marking is genuinely dead, the default assumption remains oppressive.

  ***

  3. The Marking Scheme (20 Points Total)

  **1. Reconstruction of Analogy and Target (4 points)**
  *   **Criteria:** Correctly identifies the mapping (White=Man, Black=Woman) and identifies the target as the *defense* of generic language (the narrator's rhetoric), not just the language itself.
  *   **Classic Mistake:** Treating the satire as simply "racism is bad" without addressing the linguistic arguments about genericity.

  **2. Application of Bleached vs. Transparent Distinction (4 points)**
  *   **Criteria:** Explicitly defines the distinction and applies it to at least one fictional example (e.g., "All whites" vs. "chairwhite") and one actual example (e.g., "mankind" vs. "chairman").
  *   **Classic Mistake:** Mentioning the terms "bleached" and "transparent" but failing to categorize specific words using them.

  **3. Handling the "Inclusive Sense" Defense (4 points)**
  *   **Criteria:** Explains that the narrator's claim (inclusive "white" has no racial connotations) is ironic/false in the fiction, and argues that this undermines the parallel claim for "man" (that it has a generic sense with no male connotations).
  *   **Classic Mistake:** Accepting the narrator's claim at face value or failing to note the irony regarding connotations.

  **4. Handling the Bleaching/Compound Defense (4 points)**
  *   **Criteria:** Engages with the narrator's specific argument about compounds ("chairwhite" pronounced "wit") and evaluates whether "chairman" is analogous. Recognizes that if bleaching is real, the satire's force weakens, but notes the satire suggests bleaching is a cover.
  *   **Classic Mistake:** Ignoring the narrator's specific argument about compounds/affixes or claiming the satire convicts compounds just as heavily as generics without nuance.

  **5. Reasoned Verdict and Evidence (4 points)**
  *   **Criteria:** Provides a clear conclusion on which terms are convicted (generics) vs. ambiguous (compounds) and specifies what evidence would decide the matter (e.g., connotation tests, phonetic reduction).
  *   **Classic Mistake:** Sitting on the fence without a verdict ("it depends") without specifying *what* it depends on, or failing to propose linguistic evidence.

  **A/B Separation Note:** A-range answers will treat the distinction as a tool to dissect the narrator's bad faith (Point 3 & 4), recognizing that the satire implies bleaching is often a myth. B-range answers will apply the distinction mechanically but miss the irony that the narrator's bleaching defense is part of the satire's critique.
