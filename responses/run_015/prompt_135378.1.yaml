  Whole presence fills the instant of the now,
  Bearing the straightness as its native shape.
  Yet later bends beneath the time-worn bow,
  Still fully here as moments interweave.
  The same thing stands while qualities depart,
  Containing change within a single part.

  Part of the sequence stands strictly here,
  A slice of duration, straight or curved.
  The sum extends along the time-span line,
  Where distinct bits compose a long extent.
  No instant holds the complete being's role,
  Only the spread of time makes up the whole.

  Whole and part swap places in the mind,
  Neither account fully settles the case.
  Is the object one or many in the scene?
  Time keeps the door slightly ajar, no stay.
  We seek the truth in where the properties start,
  But lose the object in the smallest part.
