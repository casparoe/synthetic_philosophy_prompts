      *   **Jordan's Position ("Negative Rankeanism"):** Carr and White destroy *positive* reconstruction (narrative is loaded), but *negative* facts (absence of evidence in a complete archive) offer a tiny island of objectivity. Example: No record of a treaty signing in City X on Day Y means it didn't happen there. This escapes White's tropes. Selection applies to positive facts, but negative facts are pre-selected by the archive. This is a meta-level epistemic constraint, not a narrative, so relativism doesn't apply to it.
      *   **User's Position:** Deciding what counts as an archive, what "complete silence" looks like, and interpreting absence (omission vs. destruction) is already a narrative move. White's tropes apply to micro-level silences too (framing missing papers). Carr's selection argument applies to selecting which silences are meaningful. Jordan is playing word games.
      *   **Task:** Go through the exchange move by move, take a committed stance (no hedging), decide who is more right overall, and identify if anything obvious is missing.
