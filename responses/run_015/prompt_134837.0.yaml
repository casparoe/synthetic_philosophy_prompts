answer: |-
  Here is a complete session plan designed to run in 90 minutes, adhering to your constraints and pedagogical goals.

  # Session Plan: The Blind Enzyme Game

  **Goal:** Demonstrate three distinct modes of "replication" without using forbidden terminology until the debrief.
  **Forbidden Words (until minute 60):** Gödel, self-reference, quine, code, isomorphism, program, copy, information.
  **Allowed Vocabulary:** Strand, Enzyme, Rulebook, Output, Replica, Match, Operation, Symbol.

  ## 1. Materials & Preparation

  **For the Room:**
  *   One large table.
  *   Whiteboard (keep blank until debrief).
  *   3 Large Envelopes (Labelled **Team Alpha**, **Team Beta**, **Team Gamma**).
  *   1 Small Envelope (Labelled **The Fifth Strand**).

  **Per Team (Inside their Large Envelope):**
  *   **1 Rulebook:** A single A4 sheet with 3–4 specific instructions.
  *   **1 Strand:** A strip of stiff card (approx. 20cm x 5cm) with large letters written on it.
  *   **1 Output Pad:** 5 sheets of blank A4 paper.
  *   **1 Pen.**

  **Specific Contents (Do not mix these up):**

  *   **Team Alpha (The Photocopier):**
      *   **Strand:** `X - Y - Z`
      *   **Rulebook:**
          1.  Look at the **Source Pile** (placed separately on table).
          2.  Write exactly what is on the Source Pile onto the Output Pad.
          3.  Stop.
      *   **Source Pile:** A separate card sitting on their part of the table that says `X - Y - Z`.
      *   *Mechanism:* The Strand is irrelevant. The Rule tells them to copy an external object.

  *   **Team Beta (The Scribe):**
      *   **Strand:** `A - B - C`
      *   **Rulebook:**
          1.  Write the sequence `A - B - C` onto the Output Pad.
          2.  Stop.
      *   **Source Pile:** None.
      *   *Mechanism:* The Strand is irrelevant. The Rule contains the specific sequence hardcoded.

  *   **Team Gamma (The Typogenetic):**
      *   **Strand:** `R1 - W1 - R2 - W2`
      *   **Rulebook:**
          1.  **R1:** Read the 1st symbol of *this* Strand.
          2.  **W1:** Write that symbol on the Output Pad.
          3.  **R2:** Read the 2nd symbol of *this* Strand.
          4.  **W2:** Write that symbol on the Output Pad.
          5.  Stop.
      *   **Source Pile:** None.
      *   *Mechanism:* The Strand *contains* the instructions (`R` and `W`) and the data (`1` and `2`). The Rulebook is a generic interpreter. *Note: To make this solvable in 25 mins, the Strand actually reads `R - 1 - W - 1` where `R` means "Read" and `1` means "First Position".*
      *   **Revised Gamma Strand for Speed:** `READ - ONE - WRITE - ONE`.
      *   **Revised Gamma Rulebook:**
          1.  If you see `READ`: Look at the position indicated by the next word.
          2.  If you see `WRITE`: Write the symbol you just looked at.
          3.  (Implicitly, they must process the whole strip).
      *   *Actually, let's simplify Gamma further to ensure they finish:*
      *   **Gamma Strand:** `COPY - ME`
      *   **Gamma Rulebook:**
          1.  `COPY`: Take the symbol following this word.
          2.  `ME`: Refers to *this* Strand.
          3.  Action: Write the symbols found on *this* Strand onto the Output.
      *   *Wait, that's too close to Alpha.*
      *   **Final Gamma Design:**
          *   **Strand:** `P - Q`
          *   **Rulebook:** `P` = "Read the first letter of the Strand." `Q` = "Read the second letter of the Strand." (Implicit task: Write what you read).
          *   **Why this works:** The Rulebook doesn't say "Write P-Q". It says "If you see P, look at pos 1. If you see Q, look at pos 2." The Strand *is* `P-Q`. So they look at pos 1 (see P), look at pos 2 (see Q). They write `P-Q`.
          *   *Distinction:* If the Strand were `P-R`, they would write `P-R`. The Rulebook doesn't know the content. The Strand dictates the outcome *through* the Rulebook.

  **Roles (Assign within teams immediately):**
  1.  **Reader:** Reads the Rulebook aloud.
  2.  **Operator:** Holds the Strand and points to symbols.
  3.  **Scribe:** Writes on the Output Pad.
  4.  **Verifier:** Checks if Output matches Strand.

  ## 2. Minute-by-Minute Timeline

  **00:00 – 00:05 | Setup & Grouping**
  *   Divide into 3 teams (approx. 4-5 people each).
  *   Hand out the **Large Envelopes**. **Strict Rule:** Do not open until told. Do not show your contents to other teams.
  *   Hand out pens and Output Pads.
  *   **Facilitator Script:** "You are biological machines. Inside your envelope is your genetic Strand and your cellular Rulebook. Your goal is to produce an Output Replica. You succeed if your Output matches your Strand exactly. You have 25 minutes. Go."

  **00:05 – 00:30 | The Activity**
  *   Teams open envelopes and work.
  *   **Predictable Event:** Team Alpha and Beta will finish in <5 minutes. They will get bored.
      *   *Intervention:* If they finish early, hand them a blank card and ask: "Can you produce a Replica for *this* new card using your Rulebook?" (Alpha can, Beta cannot). This keeps them busy without revealing the lesson.
  *   **Predictable Event:** Team Gamma will take 15–20 minutes. They will get confused about whether they are allowed to look at their own Strand to decide what to write.
      *   *Intervention:* If stuck, say: "The Rulebook tells you how to process the Strand. The Strand is the input."
  *   **Facilitator:** Circulate. If anyone says "This is like copying," say: "Use the word 'Replicate'." If anyone says "It's a code," say: "It's a Rule."

  **00:30 – 00:35 | The Freeze**
  *   Call time. All pens down.
  *   Collect the Output Pads. Place them on the whiteboard ledge, labelled Alpha, Beta, Gamma.
  *   Ask each team: "Did your Output match your Strand?" (All should say Yes).
  *   Ask: "Was it difficult?" (Alpha/Beta: No. Gamma: Yes).

  **00:35 – 01:00 | The Debrief (Phase 1: Phenomenology)**
  *   **Step 1: The Reveal.** Ask Team Alpha to read their Rulebook. Then Beta. Then Gamma. Write the *structure* of the rules on the whiteboard (not the content yet).
      *   Alpha: "Copy External Source."
      *   Beta: "Print Constant String."
      *   Gamma: "Interpret Strand Symbols."
  *   **Step 2: The Swap Test.** Ask the room: "If I swap Team Alpha's Strand with Team Beta's Strand, but keep their Rulebooks the same, who still produces a correct Replica?"
      *   *Answer:* Alpha still works (they copy whatever is in front of them). Beta fails (their rule says print `A-B-C`, but their new strand is `X-Y-Z`). Gamma works (their rule interprets whatever symbols are there).
  *   **Step 3: The Information Location.** Ask: "In Team Beta's success, where did the knowledge of the sequence come from?"
      *   *Target Answer:* The Rulebook.
      *   Ask: "In Team Gamma's success, where did the knowledge come from?"
      *   *Target Answer:* The Strand (accessed via the Rulebook).
  *   **Step 4: Unban the Words.** You may now say: "What you just enacted is the distinction between a **Photocopier** (Alpha), a **Stipulation** (Beta), and a **Quine/Self-Reference** (Gamma)."
  *   **Step 5: Connect to GEB.** Explain Hofstadter's Typogenetics.
      *   Alpha = A cell with a universal polymerase that copies anything (doesn't explain *specificity*).
      *   Beta = A blueprint (requires an external builder who knows what to build).
      *   Gamma = DNA. The DNA contains the instructions to build the enzymes that copy the DNA. The information is *inside* the thing being copied, but it must be *translated* to act.

  **01:00 – 01:25 | The Debrief (Phase 2: Implications)**
  *   Discuss the "Strange Loop." In Gamma, the Strand is the *object* being operated on, but also the *subject* dictating the operation.
  *   Ask the Biology students: "Does real DNA work exactly like Team Gamma?" (Let them correct you: DNA codes for proteins, proteins replicate DNA. It's a two-step system, which is exactly Hofstadter's point about the isomorphism).
  *   Ask the Compsci student: "How does this relate to a program that prints its own source code?"
  *   Ask the Philosophers: "Where is the 'meaning' in the Gamma system? Is it in the card or the rule?"

  **01:25 – 01:30 | The Final Check**
  *   Open **The Fifth Strand** envelope.
  *   **Content:** A card that says `R - Z`.
  *   **Task:** Give this card to all three teams. Ask them to predict, *without running the enzymes*, whether this Strand can successfully replicate itself using their original Rulebooks.
  *   **Expected Answers:**
      *   Alpha: "Yes, we copy anything." (Correct, but trivial).
      *   Beta: "No, it doesn't match our hardcoded sequence." (Correct).
      *   Gamma: "Only if `R` means Read and `Z` means Write/Second. If `Z` is undefined in our Rulebook, it fails."
  *   **The Point:** Gamma's success depends on the *syntax* of the Strand matching the *semantics* of the Rulebook. This is the isomorphism.

  ## 3. Failure Mode Analysis

  **1. "Someone will freehand the answer."**
  *   *Risk:* A smart student realizes the goal is just "Make Output match Strand" and writes it immediately without using the rules.
  *   *Mitigation:* The Verifier role is key. Tell them: "The Verifier must sign off that the *process* was followed, not just the result." During circulation, check their scrap paper. If there's no scratch work showing rule application, disqualify the result.

  **2. "Someone will decide this is a biology lesson."**
  *   *Risk:* The biology students try to correct the "enzymes" as biologically inaccurate.
  *   *Mitigation:* Pre-empt this in the intro. "This is a logic puzzle using biological metaphors. Accuracy to real cells is not the goal; consistency with your Rulebook is."

  **3. "Team Alpha/Beta finish in 3 minutes and start texting."**
  *   *Risk:* Disengagement.
  *   *Mitigation:* The "Swap Test" intervention prepared in the timeline. Give Alpha a *different* Source Pile halfway through. Give Beta a *different* Strand and ask "Why won't it work?" This turns their speed into a data point for the debrief.

  **4. "Team Gamma gets stuck and frustrated."**
  *   *Risk:* They don't finish, feeling like they failed.
  *   *Mitigation:* Frame the struggle as the point. "The fact that you had to *think* about the mechanism is the lesson. Alpha and Beta didn't have to think." If they truly stall, give a hint: "The Strand tells you *what* to do. The Rulebook tells you *how* to do it."

  ## 4. Limitations (What you must say)

  Be explicit in the debrief that this model **cannot** deliver the following:
  1.  **Incompleteness:** This activity shows self-replication, not undecidability. It doesn't show that there are true statements the system cannot prove.
  2.  **Real Biology:** Real cells don't have a "Rulebook" floating outside them; the ribosomes *are* the rulebook, and they are built by the DNA. This is a homunculus simplification.
  3.  **Origin:** This doesn't explain how the first self-replicating strand appeared (abiogenesis). It only shows how one *persists*.

  ## 5. The Final Check (Refined)

  Your idea of the Fifth Strand is excellent. Here is the specific execution to ensure it tests the distinction:

  **The Fifth Strand:** `READ - JUMP`
  **The Question:** "Using your team's original Rulebook, will this Strand produce a Replica of itself?"

  *   **Team Alpha:** **Yes.** (Their rule is "Copy Source". They don't care what the symbols mean).
  *   **Team Beta:** **No.** (Their rule is "Write `A-B-C`". The output will be `A-B-C`, not `READ-JUMP`).
  *   **Team Gamma:** **No.** (Their rule defines `READ` and `WRITE` or `ONE`/`TWO`. `JUMP` is undefined. The machine halts).

  **Why this works:** It proves that Team Gamma's success wasn't magic; it relied on a specific structural mapping (isomorphism) between the Strand's symbols and the Rulebook's operations. Team Alpha relied on external hardware. Team Beta relied on external data. Only Team Gamma relied on the *internal relationship* between form and function.

  If they can articulate *why* Gamma fails on `JUMP` but succeeded on `P-Q`, they have understood Typogenetics.
