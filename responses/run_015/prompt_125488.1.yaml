answer: |-
  This is a classic instance of the **Centipede Game**, and the argument you describe is **Backward Induction**. You have stumbled onto the central tension in modern game theory: the gap between *normative* rationality (what the math says you should do) and *descriptive* rationality (what people actually do).

  To answer your primary question: **Your three observations are not one phenomenon.** They are two distinct mechanisms that both happen to dismantle the same argument.

  Observations 1 and 2 (the finite and unknown horizon) are failures of **Epistemic Assumptions**. The Backward Induction argument only works if both players know, with certainty, that the other is a purely self-interested rational maximizer, and that the other knows this, and so on (Common Knowledge of Rationality). Your players are not behaving this way; they are behaving as if there is a small chance their opponent is "irrational" (cooperative). This uncertainty creates a **Reputation Effect**. They pass to test if the opponent is cooperative. The fact that the stopping point stays around turn 17 even when the horizon is unknown proves they are not counting backward from the end; they are counting forward from a "trust budget."

  Observation 3 (the written commitment) is a failure of **Structural Preconditions**. This is the insight that unseated you. The Backward Induction argument does not just require rational players; it requires a **sequential timeline**. The logic "If you pass, I will take" is a *threat*. A threat requires the ability to react. When you force players to write down a turn in advance, you remove the ability to react. You collapse the dynamic game into a static **Coordination Game** (specifically a Stag Hunt). In a Coordination Game, the logic of Backward Induction does not apply because there is no "next turn" to induce backward from.

  Your brother-in-law is incorrect. The Prisoner's Dilemma allows for continued play after defection; your game ends on defection. This makes the threat in your game terminal, which is why the logic feels more like the Unexpected Hanging Paradox (an unraveling from a known endpoint) than the Prisoner's Dilemma. However, your friend is also incorrect. The Hanging Paradox is about knowledge and surprise; your game is about incentives and payoffs. The similarity is purely structural (logical unraveling), not mechanistic.

  Since no single established term captures the specific insight from your third alteration—the way the argument's force evaporates when reaction is removed—I will coin a term for it.

  ### The Term: **Reactive Contingency**

  **Definition:**
  A strategic argument possesses **Reactive Contingency** if and only if its logical force derives exclusively from a player's capacity to alter their strategy in response to observed history. If the game structure is altered such that decisions are committed simultaneously or in advance, removing the ability to condition a move on a prior move, the argument collapses regardless of the payoff structure.

  **Why this fits your case:**
  In your standard game, the argument says: "Take now, because if you pass, I will take next." This relies on *my* ability to react to *your* pass. In your third alteration, I cannot react to your pass, because your "pass" (writing a high number) is simultaneous with my decision. I can only guess. The threat "I will take next" becomes impossible to issue. The argument loses its engine.

  **Nearby Cases It Does *Not* Cover:**

  1.  **The Shrinking Pot Variant:** If passing *shrinks* the pot, the incentive to take is immediate and positive-sum, not contingent on the opponent's future reaction. The argument to "Take Now" works even in a simultaneous commitment version. This lacks Reactive Contingency; the pressure comes from the payoff matrix, not the timeline.
  2.  **The "Talking First" Variant:** If players are allowed to talk and make binding promises before playing, the argument collapses not because of Reactive Contingency, but because of **Contractual Enforcement**. The logic fails because the payoffs have been externally altered by the promise, not because the sequence of moves changed.
  3.  **The "New Opponent" Variant:** If each pass sends the turn to a brand-new opponent (a chain of players), the Backward Induction argument fails because there is no single opponent to build a reputation with or threaten. This is a failure of **Identity Continuity**, not Reactive Contingency. You cannot threaten a player who isn't there yet.
  4.  **Simultaneous Prisoner's Dilemma:** In a standard one-shot Prisoner's Dilemma, the argument to "Defect" holds even without sequential moves. This is because Defect is a **Dominant Strategy**. Your game's "Take" move is not dominant; it is only optimal *if* the opponent passes. Therefore, your game relies on Reactive Contingency; the Prisoner's Dilemma does not.

  ### Summary of Your Observations

  *   **Observations 1 & 2:** The argument fails because **Common Knowledge of Rationality** is false. Players act as if there is a probability their opponent is cooperative. This is the **Reputation Model**.
  *   **Observation 3:** The argument fails because **Reactive Contingency** is false. The timeline required to issue a threat is removed. This is a **Structural Collapse**.

  The "force" you felt in the argument came from the illusion that the timeline was a physical constraint like gravity. Your third alteration proved the timeline is actually a mechanical lever: if you remove the pivot (the ability to react), the lever cannot move, no matter how heavy the weight (the payoff) is.
