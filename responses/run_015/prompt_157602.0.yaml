      *   *Alex:* But if I don't know *what* I'm evaluating, how is it a judgment?
      *   *Jamie:* It's not a judgment. It's the body budgeting.
      *   *Alex:* Okay, look. I'm not saying it's like a sentence in your head. "This is bad." I know it's not always that explicit. But there has to be some kind of take on the world.
      *   *Jamie:* But the "take" comes after. The feeling is the prediction of the bodily cost. The "badness" is just the valence tag.
      *   *Alex:* But if it predicts environmental shifts, doesn't that imply the brain has already judged the environment as shifting?
      *   *Jamie:* Not necessarily. It just knows patterns. Like a weather vane.
      *   *Alex:* A weather vane doesn't feel dread.
      *   *Jamie:* True. But if I tell you "oh that's just anxiety," the feeling changes.
      *   *Alex:* Exactly! Because you're re-appraising it.
      *   *Jamie:* Or you're updating the prediction model. See? I can admit your appraisal stuff matters. It shapes the prediction.
      *   *Alex:* And I can admit you don't need a full propositional attitude. It can be sub-personal.
      *   *Jamie:* But is it an *emotion*?
      *   *Alex:* On my view... maybe it's a proto-emotion. Until it grabs an object.
      *   *Jamie:* On my view, it's the purest form. No story yet, just raw prediction.

      *   *Review against constraints:*
          *   Typos? Need to add some naturally.
