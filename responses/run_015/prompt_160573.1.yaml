  # Sidebar Prototype: The Replication Fork

  **Instructions for Developers:**
  This is a binary decision tree. All users start at **Node 1**. Depending on their selection, they are routed to subsequent nodes. There are **7 Branch Nodes** and **8 Terminal Leaves**.
  *   **Constraint Check:** No questions ask for methodological self-identification (e.g., "Are you a Bayesian?"). All questions are framed around the specific case scenario.
  *   **Visual Note:** Indicate clearly when a path ends (Leaf) versus continues (Node).

  ---

  ### Node 1: The "Original Lab" Stipulation
  **Question:** Suppose you could rerun the original experiment in the original lab, with the original experimenters and subject pool, the week after the original. It replicates perfectly every single time, but has *never* once replicated anywhere else. What does this convince you of?

  *   **Option A:** It proves the effect is real but highly context-dependent (a "hidden moderator" exists).
      *   *Route to Node 2.*
  *   **Option B:** It proves the original lab had undisclosed degrees of freedom (tacit knowledge or flexibility that counts as p-hacking).
      *   *Route to Node 3.*

  > **Editorial Flag:** This is the primary sorting node (see analysis below). The evidence here is genuinely unsettled; this question forces the reader to pick an ontology (Real vs. Artifact) that the data cannot currently distinguish.

  ---

  ### Node 2: The Funder's Choice (Branch A: Real Effect)
  **Question:** Assuming the effect is real but context-bound, where should the money go to fix the science?

  *   **Option A:** Ten years of instrument-building for this one construct (fix the compass).
      *   *Route to Leaf 1.*
  *   **Option B:** Twenty more big replications of famous effects (verify the map).
      *   *Route to Leaf 2.*

  ---

  ### Node 3: The 24 Small Studies (Branch B: Artifact)
  **Question:** Given the big null result, how do you view the original 24 significant findings?

  *   **Option A:** They were mostly random noise; the tests were never severe enough to distinguish signal from chance.
      *   *Route to Leaf 3.*
  *   **Option B:** They were systematic bias; the signal was manufactured by incentives or flexibility.
      *   *Route to Node 4.*

  ---

  ### Node 4: The Statistical Remedy
  **Question:** If the findings were biased, would different statistical standards have prevented this specific confusion?

  *   **Option A:** Yes, the math needs to change to catch this.
      *   *Route to Node 5.*
  *   **Option B:** No, the math is fine; the problem is conceptual or systemic.
      *   *Route to Node 6.*

  ---

  ### Node 5: The Mathematical Fix
  **Question:** Which statistical change would have helped most in this case?

  *   **Option A:** Requiring priors or Bayes Factors to weight plausibility.
      *   *Route to Leaf 4.*
  *   **Option B:** Banning significance testing and reporting only estimates with intervals.
      *   *Route to Leaf 5.*

  ---

  ### Node 6: The Systemic Diagnosis
  **Question:** If the math isn't the main problem, is the literature salvageable?

  *   **Option A:** No, the rot is too deep; the field should move on.
      *   *Route to Leaf 6.*
  *   **Option B:** Yes, we can fix the environment.
      *   *Route to Node 7.*

  ---

  ### Node 7: The Barrier to Truth
  **Question:** What is the primary barrier this case reveals?

  *   **Option A:** The incentive structure (publication bias) forced these errors.
      *   *Route to Leaf 7.*
  *   **Option B:** Nothing specific; this is just ordinary scientific self-correction in action.
      *   *Route to Leaf 8.*

  ---

  ### The Leaves (Outcomes)

  **Leaf 1: The Constructs and Measurements Are the Real Culprit**
  *   **Hardest Datum:** Explaining why these measures work reasonably well in adjacent fields (e.g., clinical settings) if they are fundamentally broken.
  *   **Path:** Node 1(A) → Node 2(A).

  **Leaf 2: Effects Are Genuinely Fragile and Context-Bound**
  *   **Hardest Datum:** Reconciling this with theories that claim these psychological mechanisms are universal human traits.
  *   **Path:** Node 1(A) → Node 2(B).

  **Leaf 3: The Tests Were Never Severe in the First Place**
  *   **Hardest Datum:** Accounting for the meta-analytic consistency of the original 24 studies if they were just noise.
  *   **Path:** Node 1(B) → Node 3(A).

  **Leaf 4: Switch to Priors and Bayes Factors**
  *   **Hardest Datum:** Getting consensus on what "objective" priors should be for novel social phenomena.
  *   **Path:** Node 1(B) → Node 3(B) → Node 4(A) → Node 5(A).

  **Leaf 5: Stop Testing and Just Report Estimates with Intervals**
  *   **Hardest Datum:** Preventing readers from mentally dichotomizing intervals (treating those crossing zero as "null") anyway.
  *   **Path:** Node 1(B) → Node 3(B) → Node 4(A) → Node 5(B).

  **Leaf 6: These Literatures Can't Be Salvaged; Move On**
  *   **Hardest Datum:** Justifying the abandonment of concepts that still have predictive utility in specific real-world applications.
  *   **Path:** Node 1(B) → Node 3(B) → Node 4(B) → Node 6(A).

  **Leaf 7: It's the Incentives and Publication Filter, Not the Math**
  *   **Hardest Datum:** Explaining why some labs with identical incentives produce replicable work while others do not.
  *   **Path:** Node 1(B) → Node 3(B) → Node 4(B) → Node 6(B) → Node 7(A).

  **Leaf 8: This Is Ordinary Scientific Self-Correction (Crisis Framing Overblown)**
  *   **Hardest Datum:** Defending the 10-to-15-year lag between the original findings and this corrective replication as "efficient."
  *   **Path:** Node 1(B) → Node 3(B) → Node 4(B) → Node 6(B) → Node 7(B).

  ---

  ### Logic Check & Developer Notes

  **1. Unoccupied Logical Space (The "No Man's Land")**
  *   **Combination:** Believing the effect is **Real/Context-Bound** (Node 1A) but also that the **Literature is Unsalvageable** (Leaf 6).
  *   **Why Unoccupied:** This tree treats these as incoherent. If a reader believes the phenomenon is real (even if fragile), they rarely advocate abandoning the literature entirely; they advocate better theory. The path to "Unsalvageable" is only accessible via the "Artifact" branch.
  *   **Instruction:** Do not create a shortcut from Node 2 to Leaf 6.

  **2. Indistinguishable Leaves**
  *   **Pair:** **Leaf 4 (Bayes)** and **Leaf 5 (Intervals)**.
  *   **Reason:** In practice, advocates for these positions often overlap significantly (both oppose NHST). The tree forces a choice for the sake of interactivity, but readers should be aware these are sibling positions, not opposites.
  *   **Instruction:** Consider visually grouping these two leaves in the final UI to show their proximity.

  **3. The "We Don't Know" Flag**
  *   **Node:** **Node 1 (The Original Lab Stipulation).**
  *   **Reason:** There is currently no empirical way to distinguish between a "hidden moderator" (real effect) and "tacit degrees of freedom" (artifact) in this specific scenario. This node does not reflect settled evidence; it reflects the reader's prior philosophical commitment.
  *   **Instruction:** Add a tooltip or footnote to Node 1 stating: *"Science cannot currently distinguish these two possibilities; your choice here reflects your prior assumptions."*

  **4. Primary Sorting Work**
  *   **Node:** **Node 1.**
  *   **Reason:** This single branch divides the readers into two fundamentally different worlds: those who think the *phenomenon* is the problem (Branch A: Measurement/Context leaves) and those who think the *process* is the problem (Branch B: Stats/Incentives leaves). It determines whether the reader ends up caring about instrument-building or publication reform.

  **5. Node Count Verification**
  *   **Total Branch Nodes:** 7 (Nodes 1–7).
  *   **Total Leaves:** 8 (Leaves 1–8).
  *   **Constraint Met:** Yes (Range 6–8 nodes, 6–9 leaves).
