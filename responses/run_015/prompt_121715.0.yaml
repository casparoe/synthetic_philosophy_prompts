answer: |-
  **Project Title:** Ontological Composition Failure in the White Horse Dialogue: A Study of Sortal Invasiveness in Early Chinese Metaphysics

  **Introduction and Problem Statement**
  The *White Horse Dialogue*, a foundational text of the School of Names, is conventionally centered on the paradoxical assertion that a white horse is not a horse. Standard scholarship has largely exhausted three interpretive avenues: the logical reading, which treats the statement as a confusion regarding class membership and set theory; the semantic reading, which attributes the paradox to ambiguity in the term "horse" regarding extension versus intension; and the rhetorical reading, which views the argument as a exercise in statecraft or persuasive definition designed to stabilize political terminology. While these interpretations illuminate the linguistic and logical structures potentially at play, they collectively overlook a distinct metaphysical possibility inherent in the text's reasoning. They operate under the assumption that the relationship between a substance and its properties follows a familiar Aristotelian substance-accident framework, where color is merely an accidental feature added to an underlying substrate.

  This independent study proposes a less familiar framing: treating the dialogue as advancing a thesis of ontological composition failure. Specifically, I will investigate the claim that a color-property can be sortally invasive—meaning its presence alters the kind-membership conditions of the substance it modifies rather than merely adding an accidental feature. If whiteness is sortally invasive, the compound entity "white horse" is not a subset of "horse" but a distinct ontological category that disrupts the identity conditions of the base kind. This project seeks to determine whether the text supports this metaphysical reading over the standard logical or semantic reductions.

  **Research Question**
  The central inquiry of this semester-long study is defined as follows: does the dialogue provide internal arguments for the claim that whiteness and horseness stand in a relation of non-compositional dependence, such that their combination produces an entity whose kind-identity is disrupted?

  **Critique of Standard Interpretations**
  Existing scholarship leaves this ontological reading untouched due to specific presuppositions. The logical and set-theoretic interpretations import modern extensional logic that presupposes a stable universe of discourse where kinds are static containers. This framework assumes that if *A* is a white horse and *B* is a horse, *A* must be a member of the set *B*. However, this presupposes that the kind "horse" remains ontologically invariant under the modification of color. The semantic ambiguity reading similarly treats the problem as one of naming conventions rather than metaphysical composition, suggesting the interlocutors are simply talking past one another regarding definitions. Finally, the rhetorical statecraft interpretation dismisses the metaphysical claims entirely as instrumental tools for political control, thereby ignoring the text's internal coherence regarding reality and naming.

  All three standard approaches share a critical weakness: they either presuppose Aristotelian substance-accident frameworks that the text may reject, or they treat the argument as purely linguistic and therefore miss its metaphysical target. If the School of Names operates with a mereological or constitutive metaphysics where properties are not accidents but determinants of kind-identity, the claim "white horse is not horse" is not a logical error but a precise ontological distinction. The proposed study challenges the assumption that "horse" functions as a stable sortal independent of its specific determinations.

  **Methodology**
  To investigate this hypothesis, the project will employ a three-part methodological framework designed to ensure textual fidelity while allowing for philosophical reconstruction.

  First, I will conduct a premise-by-premise reconstruction of the dialogue's reasoning that avoids importing modern logical notation. Using formal logic symbols (e.g., ∀, ∃, ∈) risks anachronistically forcing the text into a Fregean or Russellian mold that obscures its native metaphysical commitments. Instead, I will map the argumentative moves using natural language conditionals and structural analysis, focusing on how the text distinguishes between "fixing" an object and "naming" a kind. This close reading will isolate moments where the text suggests that adding "white" does not narrow the scope of "horse" but changes the nature of the referent entirely.

  Second, I will utilize a comparison with contemporary phase-sortal theories. Certain modern metaphysical accounts suggest that some properties are phase-sortals, where the addition of a property changes the kind to which an object belongs (e.g., a "statue" versus the "clay" constituting it). I will use this theoretical framework heuristically to test the internal consistency of the *White Horse Dialogue*. It is crucial to note that this comparison is restricted to testing internal consistency rather than claiming historical influence. The goal is not to argue that the ancient authors anticipated modern phase-sortal theory, but to see if their arguments hold water when modeled by such a theory.

  Third, I will establish a clear failure condition for the hypothesis. The ontological composition reading will be deemed untenable if the reconstruction requires attributing premises that have no textual basis in the dialogue's own structure. If the claim of sortal invasiveness requires assuming hidden premises about the nature of properties that the interlocutors never hint at, the hypothesis must be abandoned in favor of the semantic or logical readings. This constraint ensures the project remains a textual exegesis rather than a creative appropriation.

  **Scope and Feasibility**
  This project is feasible within a single semester because it restricts its primary textual analysis to one dialogue rather than the corpus of the School of Names or the broader Warring States philosophical landscape. By focusing exclusively on the internal argumentation of the *White Horse Dialogue*, I can avoid the risk of collapse into general intellectual history. The primary risk lies in the temptation to contextualize the argument within the broader political debates of the period, which would dilute the metaphysical focus. To mitigate this, historical context will only be invoked when necessary to clarify terminology, not to explain away the metaphysical claims.

  A determinate philosophical payoff would look like a validated model of Early Chinese metaphysics that treats properties as constitutive rather than accidental. If the composition-failure reading holds, it demonstrates that the School of Names was engaged in genuine ontology, offering a distinct alternative to Western substance metaphysics. It would suggest that kind-membership in this tradition is sensitive to specific differences in a way that modern set theory does not capture. Conversely, if the project meets the failure condition, it will provide a rigorous negative result, demonstrating why the ontological reading is unsustainable and reinforcing the necessity of the semantic or logical interpretations. Either outcome contributes to a more precise understanding of the intersection between language and reality in early Chinese thought.

  **Conclusion**
  By reframing the *White Horse Dialogue* through the lens of ontological composition failure, this study aims to recover a metaphysical depth often obscured by logical or political reductions. Through careful reconstruction and controlled comparative analysis, the project will assess whether the text argues for a world where properties invade and alter kind-identity, challenging the universal applicability of substance-accident metaphysics.
