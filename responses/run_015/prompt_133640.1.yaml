      *   Step 3: Alternatives. Could they have actually done otherwise *given who they were*?
      *   Step 4: The "Values Break." Where do we stop analyzing and start deciding?
      *   *Refinement:* The prompt asks for a "no true desert here" stopping point. I need to be careful. Restorative Justice (RJ) usually *brackets* the question of desert to focus on harm. If I tell them to use a checklist to determine desert, I might undermine RJ principles.
