answer: |-
  This is one of the oldest fights in human history, and it's normal that it's surfacing in your team. You're trying to do practical work (repairing harm) while wrestling with a metaphysical problem (free will). Galen Strawson is right: logically, no one is the "ultimate cause" of themselves. But you can't run a nonprofit on pure logic; you have to run it on safety and repair.

  Below is a tool designed to stop the circular arguments in your prep meetings. It doesn't solve the philosophy; it contains it. It helps you separate **Ultimate Blame** (which Strawson says is impossible) from **Practical Accountability** (which you need to keep the community safe).

  ### The "Origin & Agency" Checklist
  *Use this privately with your co-facilitator before walking into a session. Do not use this to lecture the participant.*

  **Step 1: The Coercion Check**
  *   **Question:** Was there an immediate external threat forcing this action (e.g., gun to head, imminent homelessness, physical abuse)?
  *   **Good Enough Answer:** "Yes, there was a specific, verifiable threat that limited their options to survival mode."
  *   **Stop Point:** If **YES**, mark "High Constraint." Do not discuss moral blame. Move straight to safety planning.
  *   **If NO:** Move to Step 2.

  **Step 2: The Wiring Check**
  *   **Question:** Is the behavior a direct symptom of a capacity they did not choose (e.g., age, severe mental health crisis, cognitive disability, trauma response)?
  *   **Good Enough Answer:** "Yes, a professional or clear evidence shows their brain/development could not process the consequence at that moment."
  *   **Stop Point:** If **YES**, mark "Low Capacity." Acknowledge "No True Desert." Focus on support systems, not apology.
  *   **If NO:** Move to Step 3.

  **Step 3: The "Could They Have Swapped?" Check**
  *   **Question:** If we swapped this person with a generic person from a different background but gave them the *exact same* brain and history, would the outcome change?
  *   **Good Enough Answer:** "No. Given who they were formed to be, this action was the likely output." (This is the Strawson trap).
  *   **Stop Point:** If **NO**, you must admit: **Logically, there is no Ultimate Desert here.** They are not the author of their own nature.
  *   **If YES:** (Rare). Move to Step 4.

  **Step 4: The Values Wall (The Breakdown Point)**
  *   **Question:** Even if they aren't the "ultimate cause," does the community need to mark this behavior as unacceptable to stay safe?
  *   **Good Enough Answer:** "Yes, regardless of *why* they did it, we cannot allow this consequence to stand."
  *   **Stop Point:** **LOGIC ENDS HERE.** This is not a philosophy problem anymore; it is a boundary setting. You are not punishing *sin*; you are managing *risk*.

  ***

  ### Applying the Checklist to Your Cases

  Here is how this plays out in your three scenarios. Note where the logic forces you to swallow your pride.

  #### Case 1: The Kid (Vandalism after eviction)
  *   **Step 1 (Coercion):** **YES.** Being kicked out at a young age is an immediate survival threat. Vandalism may be a distress signal or resource gathering.
  *   **Step 2 (Wiring):** **YES.** Adolescent brain development + trauma response limits impulse control.
  *   **Result:** **High Constraint / Low Capacity.**
  *   **Verdict:** "No True Desert."
  *   **Facilitator Stance:** You likely wanted to excuse him anyway. The logic supports you. Do not ask for a moral apology; ask for a repair plan that he can actually manage. Focus on housing stability, not shame.

  #### Case 2: The Nurse (Stole meds to pay rent)
  *   **Step 1 (Coercion):** **MIXED.** Economic pressure is high, but usually not "immediate threat" in the same way as eviction. However, systemic coercion is real.
  *   **Step 2 (Wiring):** **NO.** She is an adult professional with training. She understood the rules.
  *   **Step 3 (Swap Test):** **NO.** A different person with her history and financial desperation might have done the same. She didn't choose her economic reality.
  *   **Result:** **No True Desert.**
  *   **Verdict:** Logically, she is no more the "author" of her theft than the kid is of his vandalism.
  *   **Facilitator Stance:** This matches your RJ instincts. She doesn't need to be branded a criminal; she needs a payment plan and ethical reintegration.

  #### Case 3: The Fraudster (Planned fraud for fun/cleverness)
  *   **Step 1 (Coercion):** **NO.** No threat. No survival need.
  *   **Step 2 (Wiring):** **NO.** He is an adult. No cognitive disability.
  *   **Step 3 (Swap Test):** **NO.** (Here is the hard part). Why does he like feeling clever? Did he choose that personality trait? Did he choose the upbringing that made him value cleverness over honesty? Strawson says **No.** He is acting out a script written by his genetics and history.
  *   **Result:** **No True Desert.**
  *   **Verdict:** **Opposite of what you want.** You *want* to blame him. He feels "evil." But the checklist forces you to admit: He is not the ultimate origin of his own narcissism.
  *   **Facilitator Stance:** This is where you hit the **Values Wall (Step 4)**.
      *   *Logic says:* He doesn't deserve eternal blame.
      *   *Values say:* We cannot have people draining community resources for fun.
      *   *Action:* You hold him accountable not because he is a "sinner," but because his behavior is unsafe. You demand restitution not to balance the cosmic scales, but to repair the harm.

  ***

  ### Where the Procedure Breaks Down (The Values Wall)

  You asked where you have to admit it's a values call, not a logic problem. It happens at **Step 4**.

  Strawson's argument is a black hole. If you follow it all the way, *nothing* is ever anyone's fault. If you stop there, you can't do your job. You cannot facilitate a restorative circle if you truly believe the participant is just a leaf blowing in the wind.

  **The Breakdown Points:**
  1.  **Safety vs. Truth:** You might know logically the Fraudster isn't "ultimately responsible," but if you treat him like the Kid, he will exploit you. You must treat him *as if* he has choice, because treating him otherwise is dangerous.
  2.  **The Victim's Need:** The victim of the fraud might need to hear the guy say, "I chose to do this, and I'm sorry." A speech about "I was determined by my genetics" will re-traumatize them. You may have to coach the participant to use language of choice ("I did this") even if you know philosophically it's more complex.
  3.  **Community Standards:** Restorative justice is about community norms. A community can decide, "We don't care about ultimate causality; we care that our members don't steal." That is a values decision, not a philosophical one.

  ### How to Use This With Your Co-Facilitator

  When you start fighting about blame in the prep room, stop and ask: **"Are we arguing about Step 3 (Logic) or Step 4 (Values)?"**

  *   If you are arguing about **Step 3**, pull out Strawson. Admit that nobody is the ultimate cause. Stop trying to win that argument. You will both lose.
  *   If you are arguing about **Step 4**, admit that this is a **Values Call**. Ask: *"What does our community need to feel safe?"* and *"What does the victim need to heal?"*

  **The Bottom Line:**
  Use the checklist to kill your own anger. It stops you from seeing participants as "evil." But do not use the checklist to kill accountability. You can hold someone responsible for fixing a broken window without believing they are the metaphysical author of the rock that broke it.

  One of you needs to be the guardian of the Logic (reminding the team not to demonize), and one of you needs to be the guardian of the Values (reminding the team not to enable harm). Swap those roles every few months so you don't get stuck in the script.
