answer: |-
  You should trust your initial instinct here: **your roommate has described a form of Egalitarianism, not Prioritarianism.**

  You aren't conflating the weighting function with the objection; you have correctly identified the defining metaphysical distinction between the two views. The confusion stems from the fact that both views often recommend the same policies (helping the worse off), but they do so for fundamentally different reasons.

  Here is the breakdown of why your reasoning holds up, why your roommate's "mean-reference" variant fails the definition of Prioritarianism, and how the Leveling-Down Objection (LDO) applies.

  ### 1. The Definition of Prioritarianism (The Non-Relational Clause)
  In moral philosophy (specifically following Derek Parfit's formulation), **Prioritarianism** is defined by a specific constraint: the moral value of a benefit depends **only** on the absolute welfare level of the recipient, not on how they compare to others.

  *   **Prioritarian Math:** $V = \sum f(w_i)$, where $f$ is a concave function (e.g., square root). The weight is determined by $w_i$ alone.
  *   **Egalitarian Math:** $V = \sum w_i - E(\text{inequality})$. The weight is determined by $w_i$ relative to $w_j$.

  Your roommate's proposal ("mean-reference weighting") makes the moral weight **relational**. If I am at welfare level 5, my "priority weight" changes depending on whether the population mean is 6 or 100.
  *   **In Prioritarianism:** If my welfare stays at 5, my moral claim stays the same, even if everyone else in the world becomes a billionaire.
  *   **In Your Roommate's View:** If everyone else becomes a billionaire, the mean shoots up, I fall further below the mean, and my moral weight *increases*.

  Because the weight depends on the distribution of welfare across other people, this is structurally **Egalitarian**. It treats "distance from the mean" as a morally relevant property. Parfit explicitly ruled this out of Prioritarianism to avoid the Leveling-Down Objection.

  ### 2. The Leveling-Down Objection (LDO)
  The LDO states that a theory is flawed if it implies that a situation where some are worse off and **no one is better off** is, in at least one respect, better than the original situation.

  *   **Strict Egalitarianism:** Says leveling down is good in one respect (equality increases), even if it helps no one. This is why the LDO is considered a "reductio ad absurdum" by many.
  *   **Standard Prioritarianism:** Says leveling down is bad, full stop. Lowering the well-off reduces total weighted welfare without generating any compensating gain for the worse off (since their absolute level didn't change).

  **Does the LDO hit your roommate's view?**
  Yes. If the moral goal is to minimize "distance from the mean," then leveling down the rich (without helping the poor) reduces the variance and shrinks the average distance from the mean.
  *   **Scenario:** (2, 5, 9). Mean = 5.33.
  *   **Level Down:** (2, 5, 2). Mean = 3.
  *   **Distances:** In the first case, the sum of absolute deviations is roughly 7.3. In the second case, the sum of absolute deviations is 4.
  *   **Result:** If the view values minimizing mean-distance, the leveled-down society scores "better" on that metric. Therefore, this view **licenses leveling down.**

  Your roommate claims this proves Prioritarianism can require leveling down. But the correct conclusion is that **her view is not Prioritarianism.** It is a variant of Telic Egalitarianism that uses a specific metric (mean deviation) to measure inequality.

  ### 3. Analyzing Your Example (Transfer vs. Leveling Down)
  You mentioned the move from **(2, 5, 9) $\to$ (4, 5, 7)**.
  It is crucial to note that this is **not** a leveling-down case. This is a **Pigou-Dalton Transfer**.
  *   Person 1 gains (+2).
  *   Person 3 loses (-2).
  *   Person 2 is unchanged.

  Both Standard Prioritarianism and Egalitarianism prefer (4, 5, 7) over (2, 5, 9).
  *   **Prioritarianism:** The gain at the bottom (2 $\to$ 4) is weighted more heavily than the loss at the top (9 $\to$ 7) due to the concave function.
  *   **Egalitarianism:** Inequality is reduced.

  The fact that your roommate's view prefers this transfer doesn't prove anything about the LDO. The LDO only bites if the view prefers **(2, 5, 9) $\to$ (2, 5, 2)**. As shown above, a mean-reference view *would* prefer that (or at least see it as an improvement in one respect), which confirms it is vulnerable to the LDO.

  ### 4. Why the Distinction Matters (The "Identity" Argument)
  The reason philosophers care so much about this distinction isn't just semantics; it's about the **separateness of persons**.

  If you accept your roommate's "mean-reference" view, you accept that my moral status can change without anything changing *about me*.
  *   **Imagine:** You are suffering at level 5.
  *   **World A:** Everyone else is at level 6. You are slightly below average.
  *   **World B:** Everyone else is at level 1,000,000. You are vastly below average.

  In **Prioritarianism**, your claim to help is identical in World A and World B. Your suffering is the same.
  In **Mean-Reference**, your claim to help is much stronger in World B.

  Many philosophers find World B's implication counterintuitive. Why does your suffering matter *more* just because others are doing well? Prioritarianism says it doesn't. Egalitarianism says it does (because inequality is worse). By adopting mean-reference weighting, your roommate has adopted the Egalitarian intuition that **relations between people** have intrinsic moral value.

  ### Summary for Your Argument
  1.  **You are right:** "Mean-reference weighting" is relational. Prioritarianism is defined as non-relational. Therefore, her view is not Prioritarianism; it is a form of Egalitarianism.
  2.  **The LDO still hits:** Because her view values reducing distance from the mean, it sees value in leveling down (reducing the top) even if it helps no one. It does not dodge the objection; it accepts the premise that generates the objection.
  3.  **The Example:** Your example (2, 5, 9 $\to$ 4, 5, 7) is a transfer, not leveling down. Both views agree on that. To test the LDO, you must remove the gain to the poor (2, 5, 9 $\to$ 2, 5, 2). Her view sees improvement there; Standard Prioritarianism does not.

  You haven't conflated the weighting function with the objection. You've correctly identified that changing the weighting function to be relational changes the *category* of the moral theory. Your roommate hasn't found a loophole for Prioritarianism; she has just switched teams to Egalitarianism.
