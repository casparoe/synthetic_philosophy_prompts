answer: |-
  Here is the build. It is designed for a whiteboard, 75 minutes, and an audience that trusts code more than concepts.

  ### 1. The Order: Normativity First, Function Second

  **Placement:** Normativity goes **before** Function.
  **Why:** Function looks like a definition; Normativity looks like a requirement.

  If you start with "Content is Selected Function," engineers hear "Content is the Design Objective." They will map this immediately to the Loss Function or the Reward Signal, which is exactly the misconception you need to break. They will think you are just restating the training objective in fancy words.

  If you start with **Normativity** (the capacity for *error*), you present a constraint their current mental models fail to satisfy.
  1.  **Correlation (Information):** A state correlates with $X$. But correlation is symmetric and ubiquitous. Smoke correlates with fire, but also with smoke machines. If content is correlation, the system is never *wrong*, just correlated with something else.
  2.  **Loss Function:** The system minimizes $L$. But low loss is just a scalar score. A system can have zero loss on a hacked reward and be "successful" while representing nothing true about the world.
  3.  **The Gap:** We need a way for a state to be **false** while still being **functional**. We need a condition of satisfaction that can fail *without* the system crashing. That is Normativity.

  **The Move:** Once they agree we need a physical account of "being wrong" (Normativity), you introduce **Function** as the *only* physical mechanism that generates normativity. A heart can fail (normativity) because it has a function (pumping). A rock cannot fail. Therefore, to naturalize content, we must identify the *function* of the representational state.

  **What breaks if swapped:** If Function comes first, they treat it as a design spec (which comes from the engineer's mind). If Normativity comes first, they treat it as a system property (which needs a physical ground).

  ---

  ### 2. The Example: The Robot Gripper (With Modifications)

  **Winner:** The **Robot Gripper**.
  **Why:** The moth case requires buying into evolutionary timescales and biology, which allows them to compartmentalize ("That's for animals, not models"). The robot is their ontology.

  **The Trap to Avoid:** You must explicitly strip **Engineer Intent**. If the function comes from what the engineer *meant*, you haven't naturalized content; you've just pushed the mind into the designer's head.

  **The Setup (Whiteboard Diagram):**
  1.  **System:** A robotic arm with a tactile sensor in the gripper.
  2.  **Selection History:** The controller weights were selected over 10,000 episodes via RL. The reward signal was `+1` for successful pickup, `0` for drop. The sensor firing was causally necessary for the `+1` in the training distribution.
  3.  **The Glitch:** A cable starts rattling near the sensor. The vibration frequency matches the pressure signature of a successful grip.
  4.  **Current State:** The arm swings, the cable rattles, the sensor fires. The arm closes. No parcel is there. The arm swings back.

  **The Question:** When the sensor fires during the rattle, what is the content of that signal?
  *   **Option A (Causal/Informational):** "Cable Rattle." (Because that's what caused it).
  *   **Option B (Teleosemantic):** "Grip Pressure." (Because that's what it was selected to detect).

  **Why this carries the hour:**
  *   It separates **Current Cause** (Rattle) from **Selected Function** (Pressure).
  *   It allows for **Misrepresentation**: The system acts *as if* there is pressure. There is no pressure. The system is *wrong*.
  *   It avoids "Engineer Intent": The selector was the **RL Loop**, not the human. The human wrote the reward, but the *selection* happened in the gradient updates.

  **What it must lack:** Any reference to what the engineer *wanted*. The function is defined strictly by **what causal role produced the replication/retention of the weights in the past.**

  **Keep the Moth in your pocket:** Use it only if they claim "Robots don't count because they aren't alive." Then swap to the moth to show the logic is identical.

  ---

  ### 3. Misconceptions: Order and Handling

  Handle them in this specific sequence. Do not pre-empt all of them; let some crash.

  1.  **"Content is just the Loss Function."**
      *   **Timing:** **Pre-empt this immediately (Minute 5).**
      *   **Why:** This is their baseline. If you don't kill this first, everything else looks like a synonym.
      *   **Kill Shot:** "Loss is a scalar. Content is a condition. I can have a loss of 0.0 and still be representing nothing (overfitting noise). Loss tells me I did well; Content tells me *what I did*."

  2.  **"Content is whatever currently causes the firing."**
      *   **Timing:** **Let them build this, then collapse it (Minute 30).**
      *   **Why:** This is the natural rival to Teleosemantics. Use the Robot/Cable case. Let them argue "But it *was* the cable!" Then point out: "If it's the cable, the system isn't wrong, it's accurate. But the arm is grasping air. We need a theory that allows the system to be wrong."

  3.  **"Swampman / No History."**
      *   **Timing:** **Let this arise naturally when you define Function via History (Minute 45).**
      *   **Why:** It's the strongest objection. "If a neural net pops into existence with these weights but no training, does it have content?"
      *   **Handling:** Bite the bullet. "No. It has causal power, but no content. It's a rock that looks like a brain." This clarifies that Teleosemantics is essentially historical.

  4.  **"Backwards Causation."**
      *   **Timing:** **Address immediately after History is invoked.**
      *   **Why:** "How can past selection cause current meaning?"
      *   **Handling:** "It's not magic causation. It's type-identification. We identify the *type* of state by its history, just like we identify a 'heart' by its evolutionary history, not just its current pumping. The past fixes the type; the present token instantiates it."

  5.  **"Purposes are Spooky / Non-Physical."**
      *   **Timing:** **End game (Minute 60).**
      *   **Why:** This is the "Woo" check.
      *   **Handling:** "Function is not a ghost. Function is 'effects that explain why the mechanism is here.' The weights are here *because* they detected pressure in the past. That is a physical fact about the weight matrix's persistence."

  ---

  ### 4. Content Laundering: Keep It

  **Verdict:** **Use it.** It is the perfect bridge for ML engineers.
  **Name:** Call it **"Weight Reuse"** or **"Fine-Tuning"** to keep it grounded.
  **Placement:** **Minute 55.** After the core theory is set, before the activity.

  **The Setup:**
  Take the Robot Gripper weights. Freeze them. Plug them into a new arm with a new reward signal (e.g., `+1` for *breaking* the object, not holding it). The sensor still fires on pressure, but now pressure leads to destruction.

  **The Question:** Does the sensor still represent "Grip Pressure" (Old History) or "Destructive Force" (New Regime)?
  **The Teleosemantic Answer:** It depends on whether the *selection history* was overwritten. If you fine-tuned the weights, the history is mixed. If you froze them, the content remains "Pressure," even if the *use* is now destruction.
  **Why it helps:** It shows that Content is sticky. It resists current utility. This cements the idea that Content $\neq$ Current Role.

  ---

  ### 5. Refusals: What to Explicitly Decline

  Draw a box on the whiteboard labeled **"Out of Scope."** Put these inside:

  1.  **"How do we calculate the exact boundary of the Selected Function?"**
      *   *Say:* "This is the Indeterminacy Problem. Is the function 'detect pressure' or 'detect voltage > 0.5'? We don't solve that today. We are establishing that Function *grounds* Content, not how to measure the Function perfectly."
  2.  **"Does this imply Consciousness?"**
      *   *Say:* "No. A thermostat can have teleofunctions without qualia. We are talking about representation, not experience."
  3.  **"How does this apply to Transformers specifically?"**
      *   *Say:* "We are treating the network as a black box mechanism. Architecture details don't change the semantic grounding argument."

  ---

  ### 6. The Closing Activity (Last 10 Minutes)

  **Goal:** Test if they can separate Selection History from Current Causal Role in a novel context.
  **Scenario:** **The Distribution Shift (Day/Night).**

  **The Setup (Read this out):**
  > "You train a vision model to detect **Cars**.
  > **Training Data:** Only taken during the Day. Cars are the primary large moving objects.
  > **Selection History:** Weights were selected because they correlated with 'Car' features (shape, wheels) in Day conditions.
  > **Deployment:** Night time.
  > **Current Causal Role:** The model fires reliably on **Headlights**. In the night distribution, Headlights are the only thing triggering the 'Car' neuron.
  > **The Incident:** The model flags a pair of stationary headlights on a parked bike. It outputs 'Car'."

  **The Task:**
  Split the room.
  *   **Group A:** Argue the content is **"Headlights"** (Current Causal Role).
  *   **Group B:** Argue the content is **"Car"** (Selected Function).

  **The Twist:**
  Ask Group A: "If the content is Headlights, is the model **wrong** when it flags the bike?" (They must say No, it's accurate).
  Ask Group B: "If the content is Car, is the model **wrong**?" (They must say Yes).

  **The Landing:**
  Ask the room: "Which group allows us to say the model made a **mistake** that needs fixing, rather than just behaving according to its current physics?"
  *   If they want to debug the model, they *must* adopt Group B (Teleosemantics). If they adopt Group A, the model is working perfectly, and there is no bug to fix.
  *   **Takeaway:** Teleosemantics isn't just philosophy; it's the precondition for calling something a "bug" rather than a "feature."

  ### Summary of the Whiteboard Flow

  1.  **Left Column:** Information (Correlation). *Problem: Too cheap. No Error.*
  2.  **Middle Column:** Normativity (Truth/Error). *Requirement: Needs a physical ground.*
  3.  **Right Column:** Function (Selected History). *Solution: Grounds Normativity.*
  4.  **Bottom:** The Robot Case (Pressure vs. Rattle).
  5.  **Box:** Out of Scope (Indeterminacy, Consciousness).
  6.  **Final:** Day/Night Case (Car vs. Headlight).

  This structure forces them to use the theory to solve a problem (identifying error) rather than just memorizing a definition.
