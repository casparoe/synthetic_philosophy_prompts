answer: |-
  Your colleague's slogan, "omission isn't causation," functions as a philosophical placeholder that compresses several distinct arguments into a single aphorism. In the context of a reliability engineering post-mortem, treating these distinct claims as identical leads to category errors. Below is a disambiguation of the four specific theses the slogan might be advancing, evaluated for their plausibility and their ability to justify excluding the missing circuit-breaker from the causal explanation of the outage.

  ### 1. The Ontological Claim: Omissions Are Not Events
  **Thesis:** This reading asserts that causation requires a physical process or event involving the transfer of conserved quantities (energy, momentum, information). Since an omission is merely the absence of an event, it constitutes "nothing," and nothing cannot participate in physical production.
  **Plausibility:** This view is coherent within strict physicalist metaphysics (process theories), where causes must be concrete happenings. However, in software engineering, systems are defined by logical states and functional dependencies, not just physical flux. A missing signal or a null pointer is functionally potent even if it lacks physical mass.
  **Causation vs. Responsibility:** This thesis attempts to remain purely descriptive of reality and does not inherently address blame. It argues that the missing check literally did not "do" anything; rather, the existing load "did" the crashing.
  **Support for Conclusion:** This reading fails to support the colleague's conclusion in an engineering context. Even if the missing check is not a physical event, it is a functional condition whose absence explains the system's state. Engineering root-cause analysis (RCA) deals with functional causality, not just physical transference. Excluding the missing check on these grounds would render many failure modes inexplicable (e.g., "lack of cooling" causing overheating).

  ### 2. The Counterfactual Claim: Omissions Lack Difference-Making Power
  **Thesis:** This reading relies on interventionist accounts of causation, arguing that for X to cause Y, changing X must change Y. The claim here is that omissions cannot support this dependence because there is no actual baseline condition to intervene upon; you cannot manipulate "nothing."
  **Plausibility:** This is implausible under standard counterfactual analysis. The standard test asks, "If the check had been present, would the crash have occurred?" If the answer is no, the absence is a cause. The colleague's argument likely hinges on defining the "default" state of the codebase as "no check," implying that adding a check is an intervention, but leaving it out is merely maintaining the status quo.
  **Causation vs. Responsibility:** This often conflates causal dependence with expectations. It suggests that because the check was not "expected" to be there by the system's default logic, its absence doesn't count as a difference-maker.
  **Support for Conclusion:** This reading weakly supports the conclusion only if one arbitrarily defines the system's baseline as "incomplete." In reliability engineering, the "but-for" test is standard: but for the missing validation, the outage would not have happened. Denying this contradicts standard diagnostic logic, making this a poor justification for excluding the check from the causal chain.

  ### 3. The Normative Claim: Culpability Requires Positive Agency
  **Thesis:** This reading interprets "causation" as a proxy for "blame." It argues that moral or professional responsibility attaches only to positive actions (commission) rather than failures to act (omission), unless a specific duty was already established.
  **Plausibility:** This is a robust distinction in ethics and law (the acts/omissions doctrine), where failing to save a drowning person is often treated differently than pushing them in. However, it is a claim about *fault*, not *mechanism*.
  **Causation vs. Responsibility:** This reading explicitly conflates causation with responsibility. It admits the missing check might be mechanically relevant but denies it is the right kind of input for a blame assignment. The colleague used the phrase to end a "blame discussion," suggesting this is likely their intended meaning.
  **Support for Conclusion:** This supports excluding the check from the *blame* assignment, but not from the *causal explanation*. If the goal of the post-mortem is to understand why the system failed, the engineer's culpability is irrelevant. If the goal is to assign performance reviews, this thesis holds water, but it misuses the word "causation" to do so.

  ### 4. The Methodological Claim: RCA Should Restrict 'Cause' to Active Failures
  **Thesis:** This reading treats the slogan as a conceptual stipulation for engineering practice. It argues that labeling absences as "causes" leads to infinite regress (e.g., the cause was also "not using a different language" or "not hiring more engineers") and reduces actionability. Therefore, the team defines "root cause" as active failures only.
  **Plausibility:** This is highly plausible as a pragmatic heuristic. It acknowledges that while omissions are metaphysically causal, treating them as such in RCA can be unproductive. It frames the slogan as a policy decision rather than a discovery about the universe.
  **Causation vs. Responsibility:** This keeps causation and responsibility distinct but links them via actionability. It suggests we label only what we can directly fix (active bugs) as causes to streamline remediation.
  **Support for Conclusion:** This is the only reading that genuinely justifies treating the absence as non-causal in this specific engineering context. It successfully excludes the missing validation from the label "root cause," but only by admitting this is a taxonomy choice designed to prioritize certain types of work, not a statement about what physically broke the system.

  Verdict: No metaphysical reading supports the claim, but the methodological reading justifies it as a pragmatic convention for actionability.
