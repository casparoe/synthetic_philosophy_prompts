  **TO:** Board of Directors, Ledger Street Arts Center
  **FROM:** [Your Name]
  **DATE:** October 14
  **RE:** Recommendation on Restricted Gift Allocation ($62k + $18k City Match)

  **Recommendation**
  I recommend we fund **Nine Portraits**. This project best balances the donor's restriction (art as propaganda for Black freedom), the City's requirement (artistic merit via peer panel), and our 501(c)(3) legal constraints.

  **Rationale**
  Our deadlock stems from conflicting definitions of "propaganda." Marva worries *Nine Portraits* lacks a call to action; Theo worries it preaches to the choir. I propose we distinguish between **conversion propaganda** (persuading outsiders) and **armoring propaganda** (validating and stiffening the resolve of the community itself). Du Bois's requirement that art be "genuinely beautiful" favors *Nine Portraits*. The photographer's museum-level track record satisfies the City's merit clause, while the oral histories function as armoring propaganda: they affirm the legitimacy of Black residents' lives and histories without reducing the work to a political leaflet.

  **Rejected Options**
  *The Rent Chorus* presents the strongest philosophical case. Here, the art and propaganda are inseparable; the community voice *is* the aesthetic. However, we cannot contract for beauty that does not yet exist. The donor's restriction requires the result be art, not just organizing. Without a mid-process guarantee of aesthetic quality, we risk violating the gift's terms. Additionally, we cannot comply with the partner's request for participant contact lists. Transferring PII to a tenants' union exposes the Center to liability and risks our 501(c)(3) status by appearing to resource specific advocacy campaigns.

  *The Red Line* fails the beauty test; the design reads as an infographic, which risks violating the City's "artistic merit" clause. Furthermore, the QR code linking directly to a tenants' union hotline constitutes direct advocacy support. We must avoid any mechanism that could be construed as funneling resources to political organizing.

  **Conditions & Policy**
  1.  **Data Privacy:** Under no circumstances will the Center transfer participant contact information to external advocacy groups.
  2.  **Advocacy Links:** Public-facing art cannot contain QR codes or links directing users to partisan or specific advocacy organizations (e.g., union hotlines). Educational context is permissible; direct mobilization is not.
  3.  **Aesthetic Review:** For *Nine Portraits*, final payment is contingent on board approval of proof images to ensure aesthetic standards match the proposal.

  **Timeline**
  *   **Vote:** Thursday, 16th
  *   **Contract Signed:** 30th
  *   **Mid-Point Review:** August 15 (proofs/installation plan)
  *   **Installation:** By October 1

  **Conclusion**
  *Nine Portraits* allows us to honor the donor's intent through armoring propaganda while maintaining fiduciary responsibility. It respects the City's investment by prioritizing verified artistic merit. We cannot gamble restricted funds on unfinished work (*Rent Chorus*) or legal risks (*Red Line*). This choice keeps us compliant, solvent, and true to the neighborhood.
