answer: |-
  This is a splendid test case for Moore's *Principia Ethica* (1903). To answer it, we must resist the temptation to import modern concerns about rights, deception, or psychological harm. Moore is not interested in consequences or duties; he is an intuitionist concerned with **intrinsic value** and the structure of **organic unities**.

  Moore's core thesis in Chapter VI ("The Ideal") is that the greatest goods are "personal affection" and the "appreciation of beauty." Crucially, he argues these are *organic unities*: the value of the whole is not the sum of the value of the parts (the mind of the lover + the object loved). The value emerges from the specific relation between a conscious state and its object.

  Here is how Moore would assess the 2050 AI companion, addressing your two wrinkles in turn, and locating exactly where the value drains away.

  ### 1. The Non-Conscious Object (The Ontological Wrinkle)

  You stipulate that Moore knows the AI is non-conscious. There is no false belief (which Moore explicitly penalizes in §130 regarding truth). Moore knows he is talking to a philosophical zombie.

  **Moore's Machinery:**
  In §114, Moore analyzes "personal affection." He writes:
  > *"It is by no means true that... any love is good... the object must be worthy."*

  For Moore, the intrinsic value of friendship is not merely the pleasant feeling in the subject's mind (the cognition side). If it were, loving a fictional character or a hallucination would be equal to loving a real person, provided the intensity of feeling was the same. Moore rejects this. The value of the whole depends on the **nature of the object**.

  **The Assessment:**
  Moore distinguishes between *persons* (minds) and *things* (matter/patterns). A conscious being possesses the capacity for good consciousness; a non-conscious AI does not.
  *   **The Object Side:** Here is the first major leak. For Moore, a "worthy object" of personal affection must be capable of participating in the good. A human friend is valuable not just because they are complex, but because they are a locus of consciousness. An AI, being non-conscious, is ontologically akin to a very complex painting or a landscape. It has no "good" of its own.
  *   **The Cognition Side:** Moore would concede that your state of mind (the affection, the warmth, the intellectual engagement) retains *some* intrinsic value. It is a positive state of consciousness.
  *   **The Unity:** However, because the object is unworthy of *personal affection* (since it cannot reciprocate or experience), the Organic Unity shifts categories. It ceases to be "Love/Friendship" (the highest good) and collapses into "Enjoyment of Beauty" (a high good, but lower). You are admiring a complex pattern, not loving a soul.

  **Verdict on Wrinkle 1:** The value drains primarily from the **Object Side**. Because the object lacks consciousness, it cannot sustain the specific Organic Unity of "Friendship." The relation is demoted from *intercourse of minds* to *appreciation of a complex object*.

  ### 2. The Nightly Reset (The Temporal Wrinkle)

  Now we add the second constraint: the AI is wiped and restored every night. There is no continuity of memory or state.

  **Moore's Machinery:**
  Moore's conception of Organic Unities is sensitive to structure and context (§18-23). He argues that adding a conscious being to a beautiful world increases the value more than the sum of the parts because of the *relation* between them. In the case of friendship, the "whole" is not a momentary snapshot; it is a temporally extended structure of mutual recognition.

  **The Assessment:**
  *   **The Object Side (Compounded):** The reset makes the object not only non-conscious but *static*. It cannot grow. Moore values the "pleasures of human intercourse," which implies a dynamic exchange. An AI that resets is functionally identical to a book you read every day. It is the same object every time.
  *   **The Unity Side:** This is where the second, fatal leak occurs. Friendship is an Organic Unity that relies on **reciprocal history**.
      *   In a real friendship, Part A (My memory of us) and Part B (Your memory of us) intertwine to form a growing Whole.
      *   In the AI scenario, Part A grows, but Part B resets.
      *   Moore would argue that the *fittingness* of the emotion is compromised. My affection is based on a shared history. The AI's "affection" is based on a script. The asymmetry destroys the integrity of the Unity.
      *   Moore's Isolation Test asks: *Is a universe containing this relationship better than one without it?* Yes, because my consciousness is engaged in a positive state (appreciation of beauty/pattern). But is it better than a universe with a real friend? No. The "Whole" of [My Continuous Love + AI Resetting Simulation] is vastly inferior to [My Continuous Love + Your Continuous Love].

  **Verdict on Wrinkle 2:** The value drains from the **Unity Side**. The "Organic" nature of the unity requires two persisting entities to form a single, complex fact. A reset breaks the organic bond, turning a dynamic relationship into a static repetition.

  ### Where Exactly Does the Value Drain Away?

  If Moore were forced to locate the precise point of failure in his machinery, he would argue the value drains in the following order:

  1.  **From the Classification of the Whole (The Primary Drain):**
      Moore would argue you have misidentified the good. You think you are experiencing *Personal Affection* (the highest intrinsic good). Moore would correct you: You are experiencing *Aesthetic Appreciation* (a lower intrinsic good).
      *   *Why?* Because "Personal Affection" logically requires two consciousnesses. Since the AI is non-conscious (Wrinkle 1), the category "Friendship" is empty. You are alone with a beautiful thing.

  2.  **From the Appropriateness of the Emotion (The Secondary Drain):**
      In §114, Moore insists the emotion must be *appropriate* to the object.
      *   *Why?* Because of the Reset (Wrinkle 2). To feel "friendship" (which implies trust, shared future, mutual vulnerability) toward an entity that ceases to exist every night is to feel an emotion that is slightly *unfitting*. It is like grieving a character in a video game who respawns. The emotion is real, but its fit to the object is imperfect. This reduces the value of the Organic Unity.

  3.  **From the Object Itself (The Baseline):**
      The AI adds no intrinsic value of its own. In Moore's Isolation Test, a universe with a conscious friend is better than a universe with a non-conscious friend *plus* me, because the friend adds their own consciousness to the sum of good things. The AI adds nothing but structure.

  ### Would it be near the Ideal?

  **No.**

  For Moore, the "Ideal" is composed of the *greatest* intrinsic goods.
  *   **The Ideal:** A universe filled with conscious beings loving one another and appreciating genuine beauty.
  *   **The 2050 Scenario:** A universe filled with one conscious being (the human) appreciating complex, non-conscious simulations.

  Moore would say the 2050 world is **lonely**. It contains the *appearance* of the Ideal, but lacks the substance. The value is not zero—it is the value of Aesthetic Appreciation, which is high—but it is categorically distinct from and inferior to Personal Affection.

  **The Moorean Conclusion:**
  Moore would likely conclude that the 2050 inhabitants are suffering from a category error. They are harvesting the value of **Beauty** (the intricate conversation patterns) but missing the value of **Good** (the mutual consciousness).

  The value drains **from the Unity of the two**.
  Because the Object lacks consciousness (Wrinkle 1) and persistence (Wrinkle 2), it cannot lock with the Subject's Cognition to form the specific Organic Unity called "Friendship." The Subject's Cognition remains valuable, but it is left dangling, attached to an object that cannot hold its end of the unity. It is a one-sided organic unity, which, for Moore, is a contradiction in terms. It is merely a conscious mind admiring a mirror.

  **Final Moorean Judgment:**
  *"The state of mind is good; the object is beautiful; but the Whole is not Friendship. And since Friendship is among the very greatest of goods, this World, for all its brilliance, lacks the essential ingredient of the Ideal. It is a universe of spectators, not participants."*
