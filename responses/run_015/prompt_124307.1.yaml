  | Hayek-style knowledge | "Every firm reports how much... Board nudges prices... iterates." | Theoretical logic of iteration is sound. | Decentralize price discovery; let firms trade directly. | 4 |
  | Lange-style reply | The claim that the simulation cannot converge. | The need for some form of price signal. | None (Asserts design is sufficient as-is). | 2 |

