  3. **Right.** This is Pearce's Lemma. A strategy is not strictly dominated (by any mix) iff it is a best response to some belief about opponents' play.

  4. **Right.** Strictly dominated strategies are never best responses, so they carry zero probability in any Nash equilibrium. IDSDS preserves all equilibria.

  5. **Right.** Order independence is a robust property of strict dominance, holding even when mixed strategies perform the elimination.

  6. **Wrong.** Dominance identifies irrational actions (like B), not mandatory ones. The theory says don't play B, not that you must play the specific 50-50 mix. T and M are also rational.

  7. **Wrong.** Column's R is strictly dominated *after* B is deleted. Against Row's surviving {T, M}, R pays 1. A 50-50 mix of L and C pays 2 against both. R should be deleted. The true survivors are {T, M} × {L, C}.
