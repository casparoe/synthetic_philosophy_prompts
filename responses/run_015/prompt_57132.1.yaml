  1. It must correctly classify paradigmatic linguistic misunderstandings, such as arguing over whether a 'bank' includes riverbanks while agreeing on all physical facts, as merely verbal. This is non-negotiable because failing here renders the diagnostic label useless for its primary function.
  2. It must identify disagreements where parties predict different outcomes under identical conditions, such as one lab predicting a signal where the other predicts noise, as substantive. This is non-negotiable since any account calling this verbal contradicts the scientific method's reliance on empirical divergence.
  3. It must avoid ruling a dispute verbal solely because one side's preferred semantics renders the other false, such as defining 'real' to exclude the opponent's effect by fiat. This is non-negotiable because a diagnostic tool that begs the question against either camp cannot function as a neutral arbiter.
  4. It should ideally provide operational criteria accessible to the disputants without requiring them to adopt a specific metasemantic framework beforehand, such as when disputants lack shared meta-semantic vocabulary. This is negotiable because strict internal accessibility may be impossible without sacrificing the theoretical precision needed to distinguish deep conceptual divergence from surface terminology.
  5. It must explicitly recognize that neutrality and internal checkability cannot always be jointly satisfied, such as when diagnosing verbalness requires settling the metaphysics of 'real'. This is non-negotiable because ignoring this incompatibility ensures the protocol will collapse when applied to the very edge cases it is meant to adjudicate.
