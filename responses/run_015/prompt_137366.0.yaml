answer: |-
  This is a fantastic question, and you have hit on the single most common point of confusion when people first encounter Updateless Decision Theory (UDT). Your intuition that "ignoring evidence sounds insane" is correct—that is *not* what UDT does.

  The confusion stems from the word "updateless." It does not mean "do not update your information." It means "do not update your **decision criterion**."

  Here is the breakdown of what is actually going on, how UDT solves your Red/Blue case, and why it doesn't break everyday reasoning.

  ### 1. The Core Distinction: Policy vs. Action

  To understand UDT, you have to distinguish between the **Action** (what you do right now) and the **Policy** (the rule that tells you what to do).

  *   **CDT/EDT (Updateful):** When you wake up and see the Red light, you ask: "Given that I see Red, which *action* (A or B) maximizes my expected utility?" You calculate this using your *posterior* beliefs (your updated probabilities after seeing Red).
  *   **UDT (Updateless):** Before you wake up (or from the perspective of the "source code" written before the coin flip), you ask: "Which *policy* (a function mapping lights to actions) maximizes my expected utility?" You calculate this using your *prior* beliefs.

  **Crucially:** A policy *includes* the observation. A policy is not "Press A." A policy is "If Red, Press A; If Blue, Press B."

  UDT does not ignore the light. UDT selects a policy that *uses* the light as an input. The "updateless" part is that once you have selected the best policy based on the prior, you do not re-evaluate whether that policy is good after seeing the light. You just execute it.

  ### 2. Solving the Red/Blue Copy Case

  Let's look at your friend's first scenario (Fair Coin, one Red/one Blue).

  **The Setup:**
  *   50% chance: You are Red-Copy, Other is Blue-Copy.
  *   50% chance: You are Blue-Copy, Other is Red-Copy.
  *   Win Condition: Red presses A, Blue presses B.

  **The UDT Calculation (Ex Ante):**
  Before the coin flip, you consider candidate policies for your algorithm.
  1.  **Policy 1 (Always A):** Red does A, Blue does A. Result: Lose. EV = $0.
  2.  **Policy 2 (Always B):** Red does B, Blue does B. Result: Lose. EV = $0.
  3.  **Policy 3 (Match Light):** If Red do A, If Blue do B.
      *   In World 1 (You=Red): You do A, Other (Blue) does B. **Win.**
      *   In World 2 (You=Blue): You do B, Other (Red) does A. **Win.**
      *   EV = $1000.
  4.  **Policy 4 (Reverse Light):** If Red do B, If Blue do A.
      *   Result: Lose (Red does B, Blue does A). EV = $0.

  **The Decision:**
  UDT selects **Policy 3**.

  **The Execution:**
  You wake up. You see a **Red** light.
  *   **CDT/EDT Agent:** Thinks, "I see Red. I don't know what the other guy sees. Maybe I should switch?" (Actually, in this specific symmetric case, CDT often fails because it can't coordinate with the copy).
  *   **UDT Agent:** Thinks, "I see Red. My pre-committed policy says 'If Red, do A'. I do A."

  **Why this isn't ignoring evidence:**
  The UDT agent *looked* at the light to know which branch of the policy to execute. It did not ignore the evidence. It simply refused to let the evidence change the *rulebook*. If it re-evaluated the rulebook after seeing Red, it might reason, "Well, now I know I'm the Red copy, maybe I should do something else," which would break the coordination with the Blue copy who is still following the original plan.

  ### 3. The Glitch Variant (Where it gets spicy)

  Now, the 10% Glitch case (Both Red).
  *   90%: Fair Coin (One Red, One Blue).
  *   10%: Glitch (Both Red).
  *   Win Condition: Red-copy presses A, Blue-copy presses B. (If both Red, they need to mismatch to win, but they can't distinguish).

  **The UDT Calculation (Ex Ante):**
  You evaluate policies based on the *total* probability space (the Prior).

  *   **Policy: "If Red -> A, If Blue -> B"**
      *   **Fair Case (90%):** One sees Red (does A), one sees Blue (does B). **Win $1000.**
      *   **Glitch Case (10%):** Both see Red (both do A). **Lose $0.**
      *   **Total EV:** (0.9 * 1000) + (0.1 * 0) = **$900.**

  *   **Policy: "If Red -> B, If Blue -> B"**
      *   **Fair Case (90%):** Red does B, Blue does B. **Lose $0.**
      *   **Glitch Case (10%):** Both do B. **Lose $0.**
      *   **Total EV:** $0.

  *   **Policy: "If Red -> Randomize, If Blue -> B"**
      *   **Fair Case (90%):** Red randomizes (50% A), Blue does B. Win 50% of time. EV = 500.
      *   **Glitch Case (10%):** Both randomize. Mismatch 50% of time. EV = 500.
      *   **Total EV:** (0.9 * 500) + (0.1 * 500) = **$500.**

  **The Verdict:**
  The policy "If Red -> A, If Blue -> B" has the highest Expected Utility ($900) from the perspective of the prior.

  **The Execution (The "Insane" Part):**
  You wake up. You see a **Red** light.
  *   **Your Posterior Beliefs:** You update your beliefs! You now think, "There is a significant chance we are in the Glitch case. If we are in the Glitch case, the other guy also sees Red. If we both do A, we lose."
  *   **The Temptation:** A CDT/EDT agent might think, "Given I see Red, I should try to break symmetry. I'll do B."
  *   **The UDT Agent:** "I see Red. My posterior probability of the Glitch case has gone up. *However*, my decision rule was chosen to maximize value across all worlds. If I switch to B now, I destroy the $1000 win in the 90% Fair case. The loss in the 10% Glitch case is already priced in. I stick to the plan: **If Red -> A**."

  **Why this is rational:**
  You cannot coordinate with the other copy *after* waking up. You are both running the same code. If "Seeing Red makes me switch to B" is a good idea, then *the other copy also thinks it's a good idea.* So you would both switch to B, and still lose. The only way to win the 90% case is to commit to a policy that distinguishes the lights, even if seeing Red makes you nervous about the Glitch case.

  ### 4. "Updates Beliefs, Not Decisions"

  Your friend's phrase is a shorthand for the mechanical distinction above.

  *   **Updates Beliefs:** Yes, the UDT agent uses Bayes' rule to figure out where it is. It knows that seeing Blue makes the Glitch case impossible. It uses this information to navigate the world (e.g., if there was a door that only opened for Blue copies, it would walk through it).
  *   **Not Decisions:** The *criterion* for choosing actions is fixed at the start. It does not switch from "Maximize Prior EV of Policy" to "Maximize Posterior EV of Action."

  It is not wordplay. It is the difference between a **general** (planning the strategy before the battle based on all intelligence) and a **soldier** (reacting to the immediate fog of war). UDT forces you to act like the general even when you are the soldier.

  ### 5. Does this matter for Umbrellas?

  This is the best sanity check. Does UDT tell you to walk in the rain without an umbrella because you "pre-committed"?

  **No.** In normal, causal environments, UDT collapses to CDT/EDT.

  *   **Scenario:** It might rain (50%). You want to stay dry.
  *   **Policy:** "If Rain -> Umbrella, If Sun -> No Umbrella."
  *   **Prior EV:** This policy keeps you dry and saves you effort when it's sunny. It is the winning policy.
  *   **Execution:** You step outside. You see rain. You execute "If Rain -> Umbrella."

  In standard cases, the policy that maximizes prior utility is simply the one that reacts optimally to observations. UDT only diverges from CDT/EDT when there are **subjunctive dependencies**—situations where your decision *now* provides logical evidence about what happened *elsewhere* or *in the past* (like predictors, copies, or logical twins).

  *   **Newcomb's Problem:** CDT says "Two boxes are better than one." UDT says "The policy 'One-Box' makes the predictor put money in the box."
  *   **Umbrella:** CDT says "Take umbrella." UDT says "The policy 'Take umbrella if rain' is best."

  They give the same answer. UDT is a generalization that handles the weird sci-fi cases without breaking the boring real-world cases.

  ### Summary for your Group

  1.  **UDT does not ignore observations.** It treats observations as inputs to a function (policy).
  2.  **"Updateless" refers to the optimization target.** You optimize the function *before* seeing the input, not after.
  3.  **In the Red/Blue case:** UDT wins $1000 by pre-committing to "Red->A, Blue->B." It executes this even if seeing Red makes it worry about the Glitch case, because deviating destroys the value in the more likely Fair case.
  4.  **In everyday life:** UDT behaves normally. It only acts "weird" when your decision is logically correlated with other events (predictors, copies).

  You haven't found a bug in UDT; you've found the feature. The "insanity" of ignoring the posterior impulse is exactly what allows UDT to win in coordination problems where updateful agents fail.
