answer: |-
  This specification is drafted for a theory of origins intended to withstand scrutiny from both analytic metaphysicians and practicing developmental biologists. It assumes your constraint: a theory that contradicts established embryology is not a theory of *organismal* origins, but of abstract objects merely labeled as organisms.

  ### I. The Ontological Resolution
  **The theory must take the origin to be: The Total Causal Complex at the Onset of Totipotency.**

  *   **Rationale:** Anchoring origin solely in *gametes* fails against parthenogenesis and cloning (cases d, f). Anchoring it solely in the *zygote* as a substance fails against twinning and splitting (cases a, b), where one substance becomes two individuals. Anchoring it in the *genome* fails against chimerism and mitochondrial replacement (cases c, e).
  *   **The Commitment:** The origin is not a static object, but a **dated causal event** comprising the material constituents (nuclear and cytoplasmic) and the efficient cause (activation/fertilization) that initiates a self-regulating developmental trajectory.
  *   **Cost:** This shifts the burden from "substance essentialism" to "causal essentialism." Metaphysicians lose the comfort of rigid designators attached to particles; Biologists lose the simplicity of "fertilization = start." Both gain empirical adequacy.

  ---

  ### II. The Requirements

  **Requirement 1: Biological Coverage (The "Embryo Test")**
  *   **Specification:** The account must provide identity conditions for the resulting organism in cases (a) through (g) without ad hoc exceptions. Specifically, it must explain whether the twins in (a) and (b) share an origin, and if so, how they remain distinct individuals.
  *   **Motivation:** A theory that declares twinning "metaphysically impossible" or "a special case" ignores the primary mode of reproduction in some species (armadillos) and a routine tool in others (livestock).
  *   **Status:** **Non-negotiable.** (Joint Acceptability).
  *   **Cost of Violation:** Immediate rejection by biologists; the theory becomes a study in counterfactual logic, not biology.

  **Requirement 2: Origin Identity Conditions**
  *   **Specification:** The theory must supply identity conditions for the constituents of the Causal Complex. If the origin includes a sperm, the theory must state whether *this* sperm is individuated by its genetic content, its spatiotemporal path, or its molecular constitution.
  *   **Motivation:** As you noted, gametes are not eternal particulars. Sperm are ephemeral; oocytes are arrested and metabolically dynamic. If the origin is "this sperm," and "this sperm" is indeterminate (e.g., in ICSI where selection is agent-relative, case g), the origin is indeterminate.
  *   **Status:** **Non-negotiable.** (Joint Acceptability).
  *   **Cost of Violation:** The theory inherits the indeterminacy of the gametes, rendering the essentialist claim vague.

  **Requirement 3: Modal Force and the Sliding Scale**
  *   **Specification:** The theory must declare whether the necessity is metaphysical (true in all possible worlds), nomological (true in all biologically possible worlds), or conceptual. It must also define the "tolerance" of the origin: how much genetic or cytoplasmic variation in the Causal Complex is permitted before the organism is no longer *this* organism.
  *   **Motivation:** Kripke argues for metaphysical necessity. Biologists observe continuous variation (e.g., mitochondrial heteroplasmy, case e). If the necessity is metaphysical, a single nucleotide difference in the origin should theoretically yield a different individual. If so, why?
  *   **Status:** **Non-negotiable.** (Metaphysical Rigor).
  *   **Cost of Violation:** The claim collapses into a trivial truth ("everything is what it is") or a contingent generalization.

  **Requirement 4: The Non-Branching Condition**
  *   **Specification:** The theory must maintain that one origin yields at most one individual. If the Causal Complex splits (twinning), the theory must explain whether the original potential individual died, divided, or if the "origin" was not actually the Causal Complex but something later.
  *   **Motivation:** Transitivity of identity. If $A$ comes from $O$, and $B$ comes from $O$, and $A \neq B$, then $O$ does not essentially determine $A$.
  *   **Status:** **Preference of the Metaphysician Camp.**
  *   **Cost of Giving Up:** If abandoned, origin is no longer sufficient for identity. It becomes merely a necessary condition, weakening the Kripkean thesis significantly.

  ---

  ### III. The Incompatibility Result

  **There is a subset of these requirements that cannot be jointly satisfied.**

  **The Twinning Trilemma:**
  1.  **Essentiality:** An organism's origin is essential to it (Requirement 3).
  2.  **Biological Fact:** One Causal Complex (zygote/early embryo) can yield two distinct organisms (Requirement 1, cases a & b).
  3.  **Non-Branching:** One origin cannot yield two distinct individuals (Requirement 4).

  **Argument:**
  If (1) and (3) hold, then the origin uniquely identifies the individual. If (2) holds, the origin does *not* uniquely identify the individual (since it identifies two).
  *   **Option A (Save Metaphysics):** Deny (2). Claim twins are not distinct individuals or the zygote was not the origin. *Cost:* Biologically false.
  *   **Option B (Save Biology):** Deny (3). Claim origin is not essential, or only essential *ceteris paribus* (no splitting). *Cost:* Abandons Kripkean necessity.
  *   **Option C (Save Non-Branching):** Deny (4). Allow branching identity. *Cost:* Logical incoherence (one thing becoming two distinct things violates transitivity).

  **Conclusion:** You cannot have strict Kripkean Essentiality, standard Biological Individuation, and Non-Branching simultaneously. A theory satisfying your "joint acceptability" standard must sacrifice strict metaphysical necessity in favor of a **branching-tolerant causal history**, or admit that "individuality" is not fixed at the origin but emerges later (e.g., at gastrulation or neurulation).

  ---

  ### IV. The Filter and Locus of Disagreement

  **Most Eliminative Requirement:**
  **Requirement 4 (The Non-Branching Condition).**
  This eliminates almost all standard Kripkean accounts. Kripke's original formulation assumes a one-to-one mapping between origin and individual. Biology provides a one-to-many map (twinning, polyembryony). Any account that insists on Non-Branching must argue that the pre-split embryo is not the "origin" (pushing the origin later) or that twins are not fully distinct individuals. Both are hard sells.

  **Live Disagreement:**
  Once we discard accounts that ignore biology, the disagreement lies in **Requirement 3 (Modal Force)**.
  *   **Camp A (Metaphysicians):** Wants metaphysical necessity. Willing to posit "haecceities" or primitive this-ness to save the intuition, even if biology is fuzzy.
  *   **Camp B (Biologists/Naturalists):** Wants nomological necessity. Willing to accept that "origin" is a vague biological boundary, not a sharp metaphysical line.
  *   **The Fight:** Is the indeterminacy in the *world* (biology is fuzzy) or in our *concepts* (we haven't carved nature at the joint)?

  ---

  ### V. Scorecard of Known Accounts

  *   **Kripke (1980):** Fails Requirement 1 (Twinning/Cloning). Assumes gametic origin is rigid without addressing regulatory development.
  *   **Robertson (Bioethics):** Handles Biology well, but reduces "origin" to genetic uniqueness, failing Requirement 3 (Clones share genetics but are distinct individuals).
  *   **McMahan (Constitution View):** Attempts to handle twinning by suggesting the embryo is not the person until later. Satisfies Biology, but weakens Requirement 3 (Origin is no longer the *biological* start).
  *   **Developmental Systems Theory:** Satisfies Requirement 1 and 2, but typically rejects Requirement 3 (Essentialism) entirely, viewing identity as processual.

  ---

  ### VI. Epistemic Request

  **What would change my mind:**
  I hold **Requirement 2 (Origin Identity Conditions)** least securely. I assume gametes and zygotes must be individuated particulars. If you were to demonstrate that cellular identity is fundamentally **relational and transient**—such that a "sperm" is merely a transient state of a stem-cell lineage with no persistent haecceity even at the molecular level—I would demote this from non-negotiable to sectarian. If the biology says "there is no *this* sperm," then an account anchored in gamete identity is not just wrong, it is category-mistaken.

  **Where to catch me out:**
  1.  **Synthetic Embryology:** I have not accounted for stem-cell-derived embryo models (SEMAs) that bypass gametes and zygotes entirely. If viable humans can be made from somatic cells without an "activation event" resembling fertilization, my definition of "Total Causal Complex" may be too narrow.
  2.  **Modal Intuition:** I may be treating "metaphysical necessity" as more robust than it is. It is possible the entire debate rests on a linguistic confusion about "could have," which no biological fact can resolve.
  3.  **Twinning Timing:** I have treated the zygote/early embryo as a single unit. If you argue that individuation occurs *before* the split (e.g., at the molecular polarity stage), the "one-to-many" problem dissolves. I expect you to challenge the assumption that the pre-split embryo is a single individual waiting to divide.
