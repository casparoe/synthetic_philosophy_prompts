  **Step 3: Multiple Omissions.** Did multiple staff share the same binding duty where action by *any* one would have prevented harm?
  *Action:* Tag all involved as contributing factors. Do not select a primary culprit.
  **Handoff:** If protocol status is ambiguous or values conflict (e.g., documentation sufficiency), refer to full board.

  **Case Applications**
  1. **Nurse Vitals:** Protocol required escalation. Escalation likely prevents code. **Verdict: Cause.**
  2. **Physician Imaging:** Imaging was best practice, not pathway (fails Step 1). Also, image wouldn't have caught it (fails Step 2). **Verdict: Not Cause.**
  3. **Two Nurses:** Both had duty to verify. Either verification stops error. **Verdict: Both Cause.** *Warning: This yields an unwanted answer. Stakeholders often demand a single culprit, but the logic dictates dual contribution. Do not collapse this to one.*

  **Limitations**
  This procedure identifies systemic contributors, not individual blame. It cannot assign moral responsibility or legal liability. It cannot resolve ambiguous protocols; it only tests clarity. It is for quality improvement, not disciplinary action.

  **Philosophical Status**
  *Settled:* Counterfactual dependence is necessary (if act occurs, harm stops).
  *Contested:* Whether normative expectations (duty) are constitutive of causation or merely pragmatic filters for liability. Also contested: whether omissions are ontologically real causes or explanatory contrasts. Some argue omissions are "nothing" and cannot cause; others argue they are real events. This procedure adopts the pragmatic view (duty required) for clinical utility. Do not present this operational definition as metaphysical consensus.
