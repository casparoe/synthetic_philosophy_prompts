answer: |-
  This is a classic move in history of science debates: using a moral platitude to bypass epistemic analysis. Your intuition is correct—it is a cheat, specifically a category error that conflates moral progress with scientific validity and historiographical method.

  Here is the conceptual map of the claims hiding inside that slogan, evaluated for your seminar.

  ### I. The Menu of Claims
  When your classmate said "the arc bends toward justice," they were smuggling in four distinct claims. Only one of them is morally comforting; the other three are historically and methodologically dubious.

  #### 1. The Teleological Claim
  *   **The Claim:** History is not random; it has an inherent direction or end-goal (telos), specifically toward "justice" (or truth/correctness).
  *   **Is it Trivial?** No. It is a metaphysical assertion.
  *   **Is it Defensible?** As faith or hope, yes. As historical fact, no. History shows long periods of regression, stagnation, and lateral movement. There is no mechanism guaranteeing the "bend."
  *   **Does it support dismissing the past?** **Yes.** If history is a directed arrow, then past ideas are merely "earlier points" on the line. They are defined solely by their distance from the current tip. Their internal logic doesn't matter, only their position on the timeline.

  #### 2. The Descriptive Claim
  *   **The Claim:** As a matter of empirical observation, the present is more "just" (or scientifically accurate) than the past.
  *   **Is it Trivial?** In science, often yes (we have better tech). In morality, highly contested (depends on metrics).
  *   **Is it Defensible?** Partially. We have better data and fewer accepted atrocities than the 19th century. However, "progress" is not linear or universal across all domains.
  *   **Does it support dismissing the past?** **No.** Even if we are "better," that is a *result*, not a *method*. Knowing the destination doesn't explain the journey. Dismissing phrenology because "we won" explains nothing about why phrenology was persuasive then or how it functioned as science.

  #### 3. The Epistemic Claim
  *   **The Claim:** We possess a vantage point that allows us to see moral and scientific truths that were invisible to past actors.
  *   **Is it Trivial?** Yes, in a limited sense (we know what happened next).
  *   **Is it Defensible?** Dangerously. It assumes our current standards are the final standards. It ignores that we are likely blind to some truths just as they were.
  *   **Does it support dismissing the past?** **Yes.** This is the "God's eye view." It licenses us to judge them by our rules rather than theirs. It turns past scientists into failed versions of us, rather than successful versions of themselves.

  #### 4. The Methodological Claim (The "So What?")
  *   **The Claim:** Because the arc bends, our primary duty as historians is to categorize past ideas as "bending with" or "bending against" the arc.
  *   **Is it Trivial?** No. This is a choice of historiographical approach.
  *   **Is it Defensible?** **No.** This is the core of the cheat. It conflates *evaluation* (were they right?) with *explanation* (how did this work?).
  *   **Does it support dismissing the past?** **Yes, explicitly.** It argues that understanding the "internal logic" of a wrong idea is a waste of time because the moral universe has already adjudicated it.

  ---

  ### II. The Whig History Trap
  You asked if using the slogan commits you to Whig history.

  **The Short Answer:** Yes. In the context of historiography, that slogan *is* Whig history in aphoristic form.

  **The Nuance:**
  *   **Strong Whiggism:** The past is judged exclusively by its contribution to the present. Past actors are "heroes" (if they align with us) or "villains/fools" (if they don't).
      *   *Your classmate's usage:* **Strong Whig.** They argued that because phrenology is on the "wrong side" of the arc, we don't need to engage its conceptual scheme. It treats the past as a graveyard of errors we have overcome.
  *   **Weak Whiggism:** Acknowledging progress without letting it distort the analysis of the past.
      *   *Can the slogan survive here?* Only if treated as a **moral exhortation** ("we should work for justice") rather than a **historical law** ("justice is inevitable").
      *   *The Problem:* Your classmate used it as a historical law to shut down analysis. You cannot claim "the arc bends" (inevitability) and simultaneously claim "we must study how they thought" (contingency). If the arc bends inevitably, their thinking was determined to be wrong. If their thinking was a different conceptual scheme, the "arc" is just a story we tell afterwards.

  **The Commitment:**
  Using the slogan to dismiss historical engagement commits you to the view that **truth is static** and **access to truth is cumulative.** It denies the possibility that the "conceptual scheme" itself changed. If phrenology was a different scheme, you can't measure its distance from "justice" using a ruler made of modern neurology and liberal ethics.

  ---

  ### III. The Normative Leap
  This is the specific logical gap you felt but couldn't pin down. It is the leap from **Ontology** (what is true) to **Methodology** (how we study).

  **The Leap:**
  1.  **Premise:** We are currently more correct/just than 19th-century phrenologists. (Ontological/Normative claim)
  2.  **Conclusion:** Therefore, we do not need to reconstruct the internal logic of phrenology to understand it. (Methodological claim)

  **Why it is a Non-Sequitur:**
  *   **Understanding Error requires Symmetry:** To understand why they were "wrong," you must understand why they were "right" (by their own lights). If you don't understand the internal logic, you haven't explained the error; you've just noted it.
  *   **Contingency vs. Destiny:** If you skip the internal logic, you imply their error was inevitable (they just couldn't see the arc). If you study the logic, you reveal that things *could have been otherwise*. This undermines the "inevitable arc" narrative.
  *   **The Category Error:** The slogan refers to *moral* justice. Phrenology is an *empirical* science (however flawed). Using a moral trajectory to settle an epistemic debate assumes that scientific truth and moral justice are the same vector. They often are not. (e.g., A morally just society could still believe in false physics).

  ### IV. Summary for Class
  If you want to push back, here is the distilled argument:

  1.  **The slogan is a moral hope, not a historical method.** Using it to do history turns contingency into destiny.
  2.  **It commits the "Whig Fallacy."** It judges the past solely by its resemblance to the present, making the internal logic of past ideas invisible.
  3.  **It conflates "Being Wrong" with "Being Irrational."** Just because phrenology is false doesn't mean it wasn't a coherent conceptual scheme. Dismissing it via the "arc" treats it as a sin rather than a scientific hypothesis.
  4.  **The Normative Leap:** Being "further along" gives us better technology, but it does not give us epistemic immunity. We still need to explain *how* they reasoned, not just *that* they failed.

  **The One-Liner:** "The arc of the moral universe might bend toward justice, but the history of science doesn't bend toward truth; it lurches through different conceptual schemes. Using the first to explain the second stops history before it starts."
