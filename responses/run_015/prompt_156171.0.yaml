      *   *The Tension:* If care is about sustaining the *web* of relationships, what happens when one strand threatens to snap the whole web?
      *   *The "Pruning" Hypothesis:* Removing a toxic node isn't retributive (punishment); it's protective (maintenance). It's about resource allocation (emotional labor, safety).

  3.  **Develop the Dependency Graph Analogy:**
