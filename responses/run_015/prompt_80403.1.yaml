answer: |-
  ### The Game: The Alternating St. Petersburg

  Here is the construction. You pay an entry fee to play. We flip a fair coin until the first **Heads** appears. Let $n$ be the flip number where Heads first lands ($n=1, 2, 3, \dots$).

  The probability of stopping at flip $n$ is $P(n) = (1/2)^n$.

  The payoff $X_n$ is calibrated so that the contribution to the expected value sum is constant in magnitude but alternates in sign:
  $$ X_n = (-1)^{n+1} \cdot 2^n $$

  *   **Flip 1 (Heads):** Probability $1/2$. Payoff $+2$. Contribution to EV: $+1$.
  *   **Flip 2 (Tails, Heads):** Probability $1/4$. Payoff $-4$. Contribution to EV: $-1$.
  *   **Flip 3 (Tails, Tails, Heads):** Probability $1/8$. Payoff $+8$. Contribution to EV: $+1$.
  *   **Flip $n$:** Probability $(1/2)^n$. Payoff $(-1)^{n+1} 2^n$. Contribution to EV: $(-1)^{n+1}$.

  ---

  ### The Arithmetic Checks

  #### 1. Is the Expected Value Undefined?
  The expected value $E$ is the sum of the probability-weighted payoffs:
  $$ E = \sum_{n=1}^{\infty} P(n) \cdot X_n = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot \left[ (-1)^{n+1} 2^n \right] = \sum_{n=1}^{\infty} (-1)^{n+1} $$
  This yields the series:
  $$ 1 - 1 + 1 - 1 + 1 - \dots $$
  The sum of the positive terms is $\sum_{k=0}^{\infty} 1 = +\infty$.
  The sum of the negative terms is $\sum_{k=1}^{\infty} -1 = -\infty$.
  Because both the positive and negative parts diverge independently, the expectation is **undefined**. It is not infinite; it is an $\infty - \infty$ indeterminacy. In measure-theoretic terms, the random variable is not Lebesgue integrable.

  #### 2. Truncated Expected Value ($E_N$)
  If we cap the game at $N$ flips (forcing a payoff of 0 if Heads hasn't appeared by $N$, or simply summing the first $N$ terms of the series), the partial sum $S_N$ is:
  $$ S_N = \sum_{n=1}^{N} (-1)^{n+1} $$
  *   If $N$ is **odd**, $S_N = 1$.
  *   If $N$ is **even**, $S_N = 0$.

  As $N \to \infty$, $S_N$ oscillates perpetually between 0 and 1. It **does not converge**.

  #### 3. The Median Payoff
  To find the median, we look at the cumulative distribution of the payoffs.
  *   **Outcomes:** $+2, -4, +8, -16, +32, \dots$
  *   **Probabilities:** $1/2, 1/4, 1/8, 1/16, 1/32, \dots$

  We need the value $m$ where $P(X \le m) \ge 0.5$ and $P(X \ge m) \ge 0.5$.
  The probability of a negative payoff (all even $n$) is the sum of a geometric series:
  $$ P(\text{Loss}) = \frac{1}{4} + \frac{1}{16} + \frac{1}{64} + \dots = \frac{1/4}{1 - 1/4} = \frac{1}{3} $$
  The probability of a positive payoff (all odd $n$) is $2/3$.
  Since the probability of a loss is only $33\%$, the median must be a winning outcome.
  The smallest winning outcome is **$+2$** (occurring at Flip 1), which carries a probability mass of $0.5$ on its own.
  *   $P(X \le 2) = P(\text{Loss}) + P(n=1) = 1/3 + 1/2 = 5/6 \ge 0.5$
  *   $P(X \ge 2) = P(\text{Win}) = 2/3 \ge 0.5$

  **Median Payoff:** $+2$.
  **Median Flip:** Flip 1.

  #### 4. The Cesàro Mean
  Since the sequence of truncated expectations ($1, 0, 1, 0, \dots$) does not converge, we take the Cesàro mean (the limit of the average of the partial sums).
  Let $C_K$ be the average of the first $K$ partial sums:
  $$ C_K = \frac{1}{K} \sum_{i=1}^{K} S_i $$
  As $K \to \infty$, the average of an oscillating $1, 0, 1, 0$ sequence settles exactly in the middle.
  **Cesàro Limit:** $0.5$.

  ---

  ### Three Candidates for a Fair Price

  Here is where decision theory fractures. If you are selling a ticket to this game, what is the fair price?

  | Valuation Method | Implied Fair Price | Rationale |
  | :--- | :--- | :--- |
  | **Standard Expected Value** | **Undefined** | Logic breaks. You cannot maximize an expectation that does not exist. Buying at *any* price is mathematically unjustifiable under strict EV maximization. |
  | **Cesàro Mean** | **$0.50** | Treats the oscillation as noise. If you average out the "flip count parity" (whether you stop on an odd or even flip), the long-run average value of the *truncated* games is 50 cents. |
  | **Median Payoff** | **$2.00** | Focuses on the "typical" experience. More than half the time, you win money. The most likely single outcome is winning $2. A risk-neutral agent focusing on probable outcomes rather than tail risks would pay up to $2. |

  **Why they disagree:**
  *   **EV** fails because it requires absolute convergence (sum of absolute values must be finite), which this game violates.
  *   **Cesàro** imposes a smoothing structure that EV lacks, effectively assigning a value to the "order" of summation.
  *   **Median** ignores the magnitude of the tail outcomes entirely. It doesn't care that Flip 100 pays $\pm 2^{100}$; it only cares that Flip 100 is rare.

  ---

  ### The Critical Feature & Modifications

  The single feature doing all the work is **Conditional Convergence** driven by the **exact cancellation of probability decay by payoff growth**.

  The term magnitude is $|P(n) \cdot X_n| = 1$. The probability shrinks as $2^{-n}$, and the payoff grows as $2^n$. They lock together to keep every term equally "heavy."

  **1. If you remove the alternating signs (All Positive):**
  *   Payoff $X_n = 2^n$.
  *   EV Sum: $1 + 1 + 1 + \dots = \infty$.
  *   **Result:** This becomes the classic **St. Petersburg Paradox**. The EV is infinite, not undefined. Decision theory struggles here, but at least the direction is clear (pay any finite amount).

  **2. If you slow the payoff growth (e.g., $X_n = 2^{n/2}$):**
  *   Term magnitude: $(1/2)^n \cdot 2^{n/2} = (1/\sqrt{2})^n$.
  *   EV Sum: A convergent geometric series.
  *   **Result:** Expected Value works perfectly. The sum converges to a finite number (approx $2.41$). The paradox vanishes because the tails decay fast enough to be integrable.

  **3. If you speed up the payoff growth (e.g., $X_n = 3^n$):**
  *   Term magnitude: $(1/2)^n \cdot 3^n = (1.5)^n$.
  *   **Result:** The terms themselves explode. The EV is undefined in a much more violent way (terms don't even approach zero).

  ---

  ### The Expected-Value Defender's Pushback

  A sophisticated defender of Expected Value Maximization (EVM) would not try to calculate a number for this game. Instead, they would reject the premise of the counterexample entirely. Their argument rests on three pillars:

  1.  **The Integrability Requirement:** In rigorous probability theory (Kolmogorov), an expectation is *only defined* if the sum of absolute values converges ($\sum |P(n)X_n| < \infty$). This game fails that test. Therefore, asking "What is the EV?" is a category error, like asking "What is the color of jealousy?" The theory doesn't break; you're just applying it outside its domain.
  2.  **Finite Resources:** No bankroll is infinite. In the real world, the casino cannot pay out $2^{100}$. Once you impose a maximum cap $M$ on the payout (which must exist physically), the alternating series stops, the sum becomes finite, and EV is defined again. The paradox relies on a physical impossibility (infinite liability).
  3.  **Bounded Utility:** Rational agents maximize expected *utility*, not expected dollars. Utility functions (like log wealth) are bounded or grow slowly enough that even the St. Petersburg paradox dissolves. If $U(X)$ grows slower than $2^n$, the expectation converges.

  **The Verdict:** The game successfully demonstrates that **arithmetic expectation** is fragile when faced with conditional convergence. However, the EVM defender argues that **rational decision theory** includes constraints (integrability, bounded utility, finite worlds) that automatically filter out games like this before they can break the system.
