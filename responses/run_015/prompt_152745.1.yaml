answer: |-
  **Working Phase**

  1.  **Flash-Lag Variant:** Show a moving object and a flash, asking for alignment judgment mid-reach. *Break:* Both models accommodate this via perceptual latency differences; it doesn't force a divergence in confidence or response distribution tied to motor initiation.
  2.  **Change Blindness with Auditory Cue:** Change a scene during a reach, cueing attention auditorily. *Break:* Without eye-tracking, you cannot guarantee the change occurs during a saccade or fixation, introducing noise that swamps the effect size needed for a term project.
  3.  **Mid-Movement Masking:** Present an orientation, initiate reach, then mask. *Break:* Standard backward masking is compatible with both models if viewed as early visual interference; it doesn't test the *temporal ontology* of consciousness unless the mask is explicitly marked as irrelevant noise.

  **Experimental Scenario**

  Subjects fixate centrally while a near-threshold Gabor patch (tilted left or right) appears for 50ms. They must press a corresponding force-sensitive key. Crucially, once the force trace exceeds 10% of maximum (indicating movement initiation but before completion), a high-contrast color cue (red or blue) flashes for 50ms. Subjects are explicitly told this cue is generated by a random number generator uncorrelated with the Gabor orientation (verified post-experiment). In the control condition, no cue appears. Subjects report orientation and rate confidence (1–100). The psychophysical trick relies on cross-feature binding: although the color is evidentially useless, its onset temporally coincides with the motor commitment, allowing late visual processing to overwrite the initial orientational draft before the report is finalized.

  **Predictions**

  | Measure | Cartesian Theater | Multiple Drafts | Reason |
  | :--- | :--- | :--- | :--- |
  | **Content** | Original Orientation | Shifted/Biased by Cue | Theater: Content fixed at $T_{perception}$, pre-movement. Drafts: Content fixed at $T_{report}$, integrating late data. |
  | **Confidence** | Depressed on Cue Trials | High/Seamless | Theater: Revision requires inference over fixed memory (uncertainty). Drafts: Revision is perceptual construction (certainty). |
  | **Latency/Dist.** | Bimodal/Slower | Unimodal/Normal | Theater: Conflict between experience and cue causes processing delay. Drafts: No conflict; the draft *includes* the cue. |

  **Honest Note on Design**

  The work is done by the **response-locked timing of the evidentially useless cue**. If you remove the force-sensor requirement and present the cue at a fixed time relative to stimulus onset, both models predict masking effects explainable by early visual interference. If you remove the "uncorrelated" instruction, the Theater defender claims subjects are rationally inferring the answer from the cue. By locking the cue to *movement initiation* and marking it as *noise*, we isolate the moment of "conscious fixation." The ablation is clear: without the force sensor, you cannot prove the revision occurred after the motor command was issued, collapsing the case into standard post-dictive masking which the Theater can absorb as "processing delay."

  **Theater Defender's Reply**

  1.  **Phenomenal vs. Access:** The defender argues the subject's *experience* remained the original orientation (Phenomenal), but the *report* was hijacked by the cue (Access). *Evaluation:* This is a retreat. It saves the Theater by conceding that consciousness plays no role in guiding the report, rendering the Theater empirically idle. The Drafts theorist answers that "consciousness" just *is* the availability for report; positing a hidden, inaccessible experience is metaphysical baggage.
  2.  **Unconscious Motor Control:** The defender claims the initiated hand movement was unconscious, and consciousness only "turned on" later to approve it. *Evaluation:* This costs the Theater its explanatory point regarding the "unity" of agency. If the conscious self only ratifies unconscious decisions post-hoc, the "Theater" is no longer the center of agency. The Drafts theorist notes this validates the model: there is no single moment of conscious decision, only serial validation of parallel drafts.

  **What the Case Is For**

  If the study runs as predicted, it does not settle the metaphysical dispute about whether a determinate fact exists regarding *when* content becomes conscious. Instead, it demonstrates that the Cartesian Theater is *operationally indistinguishable* from a specific kind of error theory about report. The disagreement turns out to be partly verbal: if "consciousness" is defined as what the subject confidently reports, the Drafts model wins. If "consciousness" is defined as a private, inaccessible movie screen, the Theater survives but becomes scientifically inert. The case vindicates the seminar convener's claim only insofar as it shows the Theater requires ad hoc distinctions to match behavioral data, whereas the Drafts model treats the behavior as constitutive of the phenomenon.
