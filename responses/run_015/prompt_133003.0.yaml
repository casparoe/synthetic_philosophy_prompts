  Nor does this wreck my notion of the token. You say if printing stops work, the paper is doing the work. I say nay. The paper is but the spur, not the horse. If a man hoards these tickets and sits idle, or if he finds he needs a basket of them to buy a loaf, he is not richer. True wealth is the loaf itself, and the hand that baked it. To flood the land with paper is to tempt men to chase shadows while the substance rots. Tell me, this "crypto" you mention—is it backed by any labor of Irish hands, or is it mere air?
