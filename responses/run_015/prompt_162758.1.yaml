answer: |-
  (a) **Exam Question**

  **Philosophy of Mind: Final Take-Home Paper**
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 850 Words
  **Total Marks:** 20

  **Question 1**

  Epiphenomenalism is the view that phenomenal properties (qualia) exist but are causally inert with respect to the production of physical events, including beliefs and behaviors. This view faces the Paradox of Phenomenal Judgment: if qualia cause nothing, what causes us to judge that we have them, and how can those judgments be about qualia rather than their physical causes?

  To resolve this, consider a stipulated position called **Covariance Epiphenomenalism (CE)**. CE makes three claims:
  1.  Phenomenal properties are causally inert regarding the production of beliefs and behavior.
  2.  Every phenomenal property is nomologically co-instantiated with a physical "signature state," and it is the signature rather than the experience that causes the introspective judgment.
  3.  Phenomenal concepts are recognitional concepts whose reference is fixed by the co-instantiated signature, ensuring the judgment is counterfactually sensitive to which experience is present while being caused only by the signature.

  CE concludes that aboutness and knowledge are secured without any phenomenal-to-judgment causation.

  Write an essay evaluating Covariance Epiphenomenalism. Your answer must first decompose the Paradox of Phenomenal Judgment into three separable sub-problems: the **semantic** question (what makes the judgment *about* the experience), the **causal-genetic** question (what produces the judgment), and the **epistemic** question (what makes the judgment justified).

  Then, address the following three challenges:
  1.  **The Mismatch Case:** Suppose the physical signature fires and the subject forms the judgment "I am in pain," but no phenomenal pain is present. Is this judgment false, or does it fail to express a proposition? What does your answer show about whether CE's theory of reference is adequate?
  2.  **Modality and Knowledge:** Is nomological covariance available to the non-reductive epiphenomenalist who wants to allow for inverted or absent qualia? Does covariance that is merely *de facto* rather than necessary support the counterfactual sensitivity required for knowledge?
  3.  **Self-Application:** If CE explains first-person phenomenal judgments, does it also explain how the epiphenomenalist knows CE itself is true? Is this the original problem in a different costume, or a genuinely further problem?

  Conclude by stating whether CE successfully secures aboutness and knowledge without phenomenal causation.

  ***

  (b) **Model Answer**

  The Paradox of Phenomenal Judgment is not a single problem but a tangle of three distinct issues. The causal-genetic question asks what physically produces the belief that I am in pain. The semantic question asks what makes that belief *about* the pain rather than the neural state causing it. The epistemic question asks what justifies the belief as knowledge. Covariance Epiphenomenalism (CE) attempts to solve all three by inserting a physical signature state between the qualia and the judgment. While CE handles the causal-genetic question neatly, it fails to resolve the semantic and epistemic problems without collapsing into inconsistency.

  CE solves the causal-genetic problem by stipulation: the physical signature causes the judgment, not the qualia. This preserves the epiphenomenalist commitment that qualia are inert. However, the semantic problem resurfaces in the mismatch case. Imagine the signature fires, triggering the judgment "I am in pain," but no phenomenal pain is present. CE claims reference is fixed by the signature. If so, the judgment refers to the signature, not the qualia. In the mismatch case, the signature is present, so the judgment would be true. But intuitively, if I feel no pain, my judgment "I am in pain" is false. To save the intuition that the judgment is false, CE must admit that reference is fixed by the qualia, not the signature. But if reference is fixed by the qualia, and qualia are absent, the term fails to refer, and the judgment lacks a truth value. Either way, CE fails to secure the correct aboutness. It either makes false judgments true (referencing the signature) or leaves us without propositional content (referencing the absent qualia). This shows that fixing reference via a physical correlate severs the intentional link to the experience itself.

  The epistemic problem is even more damaging when we examine the modality of the covariance. CE relies on nomological co-instantiation to secure counterfactual sensitivity: if the experience were different, the signature would be different, and the judgment would track it. But the non-reductive epiphenomenalist typically wants to allow for the possibility of inverted or absent qualia—where the physical state remains identical while the experience changes. If such possibilities are nomologically possible, then the covariance is merely *de facto*, not necessary. Knowledge requires safety or tracking across nearby possible worlds. If there is a nearby world where the signature fires without pain (the mismatch case), my actual judgment is not safe. I cannot distinguish the actual world from the mismatch world using the signature alone. Therefore, merely *de facto* covariance cannot support the counterfactual sensitivity required for knowledge. CE sacrifices the modal room needed for qualia realism to save knowledge, or keeps the modal room and loses knowledge.

  Finally, there is the problem of self-application. How do I know CE is true? I must form the theoretical judgment "qualia are causally inert." What causes this judgment? If it is caused by physical signatures alone, why should I trust it tracks the truth about qualia? If the physical states cause the belief regardless of the qualia's nature, the belief is unconnected to the truth of the theory. This is not merely the original paradox restated; it is a higher-order skepticism. The original paradox concerns first-order reports ("I am in pain"); the self-application problem concerns theoretical knowledge about the relation between pain and physics. If CE implies I cannot know my own mind, it certainly implies I cannot know metaphysics of mind.

  In conclusion, Covariance Epiphenomenalism succeeds only on the causal-genetic front. It fails the semantic test because the mismatch case forces a choice between incorrect truth conditions or reference failure. It fails the epistemic test because *de facto* covariance cannot support the counterfactual safety knowledge requires, especially given the inverted qualia possibilities epiphenomenalism wishes to preserve. Finally, it undermines its own knowability. CE does not secure aboutness or knowledge; it merely relocates the explanatory gap.

  ***

  (c) **Marking Scheme**

  **Total Marks:** 20
  **Grade Cap:** Answers that accurately state the paradox and note CE secures covariance but leaves causation out, raising only one objection, are capped at 13/14 (High B). To score an A (15+), candidates must hit all five points below.

  | **Must-Hit Point** | **Marks** | **Typical Error (How candidates lose marks)** |
  | :--- | :---: | :--- |
  | **1. Decomposition:** Clearly distinguishes the semantic (aboutness), causal-genetic (production), and epistemic (justification) sub-problems rather than treating the paradox as a single lump. | 4 | Collapsing the semantic and epistemic sub-problems into one, treating "knowledge" and "aboutness" as interchangeable. |
  | **2. Mismatch Case:** Argues that the mismatch case forces a decision about reference fixation (signature vs. qualia) rather than merely assigning a truth value, showing CE severs the intentional link. | 4 | Offering the claim that the judgment is caused by the neural correlate as though that settled the reference question without addressing content. |
  | **3. Modality:** Distinguishes nomological from merely *de facto* covariance and connects this to the modal neighborhood required for safety/tracking accounts of knowledge. | 4 | Assuming that covariance must be exceptionless to yield knowledge, or conversely ignoring nearby inverted-qualia possibilities. |
  | **4. Self-Application:** Treats the problem of knowing the theory itself as distinct from first-order judgments, identifying it as higher-order skepticism rather than a restatement of the original paradox. | 4 | Treating causal production as a requirement on reference, or dismissing the theoretical case as identical to the first-order case without argument. |
  | **5. Conceptual Precision:** Avoids conflating causal inertness with nomological idleness and correctly identifies that CE solves the causal problem but fails the others. | 4 | Conflating causal inertness with nomological idleness; claiming CE solves all three problems successfully without qualification. |

  **A vs. B Distinction:** A B answer states both horns of the paradox accurately, notes that the reply secures covariance but leaves causation out, and raises one objection. An A answer must additionally say why the mismatch case forces a decision about reference; distinguish the nomological from the merely *de facto* reading of covariance; and treat the self-application problem on its own terms.

  **Closing Statement:** An answer that lays out the paradox flawlessly but takes no position on the stipulated reply would score 8/20.
