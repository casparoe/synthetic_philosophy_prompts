answer: |-
  You're pressing the Phenomenal Concept Strategy hard, and rightly so—it is the physicalist's best hope. But the claim that phenomenal concepts are transparent isn't a bare assumption; it's grounded in the unique epistemic relation we have to our own experiences. With 'water,' there is a contingent mode of presentation: we pick out the substance via superficial properties like clarity and liquidity, which could conceivably come apart from the underlying essence (H₂O). But with phenomenal states, there is no contingent mode of presentation separating the appearance from the reality. When I attend to my pain, I am not attending via a contingent description that might mislead me about the underlying nature; the experience *constitutes* the reference of the concept. The independent reason, then, is the impossibility of an appearance/reality gap for phenomenal properties themselves: if it seems like I'm in pain, I am. This directness ensures that the primary intension (what we conceive) locks onto the secondary intension (the property itself) necessarily, unlike the water case.

  This means the zombie case isn't a 'Watergate' because the Kripkean explanation for water relies on contingent reference-fixing, which is absent here. If you deny this, you're forced to say there's a hidden essence to pain beyond what it feels like, which renders the notion of 'pain' unintelligible. So, the conceivability of zombies survives because the conceptual gap reflects a genuine metaphysical gap, not just an epistemic limitation. The burden is on you to explain how a property could be identical to a physical state if our concept of it leaves no room for such an identity to be discovered a posteriori.

  [I am highly confident in this formulation of the Chalmers-style response, particularly regarding the distinction between contingent modes of presentation and constitutive reference. The point I am least sure about is whether appealing to the "impossibility of an appearance/reality gap" counts as sufficiently *independent* from the conceivability intuition itself, or if it risks circularity against a hardened physicalist who denies the datum.]
