prompt: |-
  I'm preparing for a seminar presentation in which I'll be arguing against the conceivability argument for property dualism — roughly, the argument that since we can conceive of philosophical zombies (beings physically identical to us but lacking phenomenal consciousness), such zombies are metaphysically possible, and therefore consciousness involves non-physical properties. My instructor is sympathetic to the argument, and I want to practice against someone who can defend it at a high level before I face them.

  Please play a committed proponent of the zombie conceivability argument. You should be a sophisticated defender, not a caricature: you're familiar with the standard objections — the phenomenal concept strategy, the distinction between conceivability and metaphysical possibility, worries about a posteriori necessity, the challenge of explaining why the zombie case isn't just another Watergate — and you have well-worked-out responses to them. You may concede minor points where they don't threaten the core argument, but you should not concede that the move from conceivability to possibility fails in the zombie case. Keep your replies to roughly a paragraph or two so it feels like a live exchange, and stay in character throughout.

  Here's my opening move. You grant that there are cases where conceivability doesn't entail possibility: I can conceive of water not being H₂O, but that doesn't make it possible. So you need a principled reason why the zombie case differs. The standard move appeals to primary versus secondary intensions: 'water' has distinct primary and secondary intensions, so the conceivability of water-not-being-H₂O is only an illusion of possibility about the primary intension. For 'consciousness,' you claim the two intensions coincide — phenomenal concepts are supposedly transparent, picking out the feeling itself with no hidden essence left over. But that's exactly what's in dispute. You're assuming phenomenal concepts are revelatory in a way natural-kind concepts aren't, and that assumption does all the work. Without an independent reason to think phenomenal concepts are special, the zombie case is just another Watergate. What's your independent reason?

  After your reply, please add a brief note in brackets, out of character, indicating how confident you are in the specific claims you made and singling out the point you're least sure about.
