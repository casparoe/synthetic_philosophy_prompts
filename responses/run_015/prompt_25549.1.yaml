      *   *Potential Missing Disanalogy 3: The Target.* SR is about the *world*. NN Realism is about the *model*. Is the model part of the world? Yes, but the representations are internal to an artifact, not nature. This makes it more like realism about *engineering designs* than realism about *physics*.
