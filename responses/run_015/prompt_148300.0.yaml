answer: |-
  Good evening, everyone.

  Looking around this room, I see the whole map of Amara's life. I see her grandkids, who know her as the person who checks if you've eaten. I see former clients, some of whom walked in here when things were falling apart and walked out standing taller. I see colleagues who have debated her until midnight, and students who came for a credit and stayed for the conversation.

  Usually, at a retirement party, we talk about what someone built. We talk about their vision, their legacy, the mark they left on the world. But if I stand here and talk about what Amara built alone, I would be lying. And Amara hates a lie.

  She taught us that you don't carry your personhood inside your skull like a private possession. You don't hold it in your hand. You hold it in the space between you and another person. It exists only when it is recognized. So, when we honor Amara tonight, we aren't honoring a statue. We are honoring the quality of the connections she tightened, the ones she protected, and the ones she let go.

  And this is where it gets tricky. Because if we are all just a big web, does individual choice matter? Did Amara matter?

  Yes. Because a web can be loose, or it can be taut. It can hold weight, or it can snap. Amara's specific genius was knowing when to pull tight. We talk about her kindness, but I need to talk about her boundaries. There were mediations she refused because the power imbalance was too dangerous. There was funding she turned down because the strings attached would have choked the community we serve. There were times she said "no" when everyone else wanted her to say "yes."

  In a framework like ours, a "no" isn't isolation. It's structural integrity. She made those choices so that the rest of us could remain standing. She protected the conditions where personhood could happen for everyone else.

  There's a concept I've been turning over in my head, something I learned watching her work. Sometimes, for a network to survive, someone has to step out of the center. Not because they are exiled, and not because they are tired, but because the community needs to renegotiate where the strength lives.

  Five years ago, Amara stepped back from direct mediation. She didn't retire then. She interrupted her own authority. She suspended her own recognition so that the rest of us were forced to find it in each other. She made herself less visible so the younger mediators could become real to the clients. She knew that if she stayed the sun, we would never learn to be stars. That wasn't a withdrawal; it was an investment. She distributed her personhood into us, so that when tonight came, we wouldn't collapse.

  So, where does that leave us now?

  Amara is stepping down. The pattern is changing. But she is a materialist, and so am I. She isn't going to a better place, and she won't be watching over us from above. She is going to her garden, to her books, to her grandkids' soccer games. She is moving her energy to a different part of the web.

  We don't need her spirit to guide us. We have the work. We have the boundaries she taught us to set. We have the connections she helped us weave. Her personhood isn't leaving the building; it's already distributed across this room. It's in the way you listen to each other. It's in the way you say "no" when you need to. It's in the way you recognize each other.

  So, please raise your glasses.

  To Amara. Not for what she built alone, but for who we are together because she showed us how to hold the space. To the work, and to the web.

