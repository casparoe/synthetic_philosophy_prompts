          *   *Political Charge:* This is about the *choice of counterfactual*. If the baseline world assumes human agency is constant or negligible, the attribution shifts. It's about *structural uncertainty* in the model design (who gets to be a dynamic variable?). It's also about the *normative selection of the control run*.
          *   *Translation:* A claim that the *system boundary* has been drawn to exclude human decision-making as a dynamic feedback, treating it instead as a passive response to forcing. The political charge is that this boundary choice is *interest-relative* but presented as *physical necessity*.

      *   **Position 3: Conjunctural Causation.**
          *   *Historical Claim:* Everything is coupled; asking "which one" is wrong.
          *   *Physics Translation:* This is the *interaction term* problem in ANOVA or attribution studies. In non-linear coupled systems, the sum of individual forcings does not equal the total response.
          *   *Translation:* A statement about *non-linearity* and *non-separability* of the response function. The *attributable fraction* is undefined or unstable because the interaction term dominates. It rejects the *linearity assumption* often required for clean attribution.

