      *   **Position 1: Non-human Actors.**
          *   *Historical Claim:* Pathogens/volcanoes *do* things; they have agency.
          *   *Physics Translation:* This sounds like distinguishing between a *forcing* (external) and a *feedback* (internal). Or perhaps distinguishing between *boundary conditions* and *state variables*. If something is an "actor," it implies it has internal dynamics that matter, not just a fixed value imposed on the system.
          *   *Nuance:* "Agency" in history often implies intentionality or at least autonomous dynamics. In physics, "internal variability" covers autonomous dynamics, but "agency" often carries a normative weight or a specific type of causal leverage (tipping points, thresholds).
