  5.  **Address the Political Objection:**
      *   User's guess: Choice of counterfactual/baseline is normative.
      *   *Verdict:* Correct but incomplete. It's also about *vulnerability*. In climate, we distinguish hazard (physical) from risk (hazard + exposure + vulnerability). Determinism ignores vulnerability (social structure) and treats the outcome as purely hazard-driven. The political charge is that "vulnerability" is treated as a constant parameter when it is actually a dynamic variable shaped by power.

  6.  **Drafting the Response (Iterative refinement for tone and precision):**

      *   *Tone:* Respectful, technical, direct. No fluff.
