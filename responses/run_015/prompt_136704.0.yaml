answer: |-
  (a) **Exam Question**

  **Course:** PHIL 450: Advanced Moral Philosophy
  **Unit:** Contractualism and the Structure of Justification
  **Time Allowed:** 75 Minutes
  **Word Limit:** Approx. 700 Words

  **Prompt:**

  T.M. Scanlon's contractualism forbids aggregating small benefits to many persons to override a severe burden to one person, grounded in the distinctness of individual claims. Consider a novel extension: **Intertemporal Contractualism**. Here, we treat temporal stages of a single life (e.g., "You-at-20" and "You-at-70") as distinct parties in the contractualist situation.

  Suppose "You-at-20" faces a significant burden (e.g., severe financial austerity) to secure a substantial benefit for "You-at-70" (e.g., secure retirement). If we apply Scanlon's test strictly: Can "You-at-20" reasonably reject a principle permitting this sacrifice?

  Write an essay addressing the following:
  1.  Does permitting this trade-off introduce a form of **hidden aggregation** within a single life that mirrors the interpersonal aggregation Scanlon rejects?
  2.  Can Scanlon's framework block this aggregation without relying on **prioritarian weights** (valuing the worse-off stage more) or presupposing a robust, non-reductionist theory of **diachronic personal identity**?
  3.  Does the logic of the "Rescue Case" transfer to intra-life trade-offs, or does the proxy-representation of future stages replicate the utilitarian summation contractualism aims to avoid?

  Deliver a reasoned verdict on whether Intertemporal Contractualism is consistent with Scanlon's core individualist justification.

  ***

  (b) **Model Answer**

  **Title:** The Unity of the Claimant: Aggregation and Time in Scanlonian Contractualism

  Scanlon's contractualism is fundamentally anti-aggregationist regarding interpersonal claims: one cannot sum minor gains across many to override a catastrophic loss to one. The proposal of "Intertemporal Contractualism"—treating temporal stages as distinct parties—threatens to reintroduce aggregation intrapersonally. If "You-at-20" and "You-at-70" are distinct claimants, permitting austerity for retirement looks like sacrificing one party for another's benefit, justified only by summing welfare across the timeline. However, a consistent Scanlonian framework can block this hidden aggregation without smuggling in prioritarianism or a metaphysical theory of identity, provided it locates the unit of moral concern in the *person* rather than the *stage*.

  The charge of hidden aggregation arises if we treat temporal stages as morally separable sites of claim analogous to distinct persons. In the interpersonal Rescue Case, Scanlon argues we cannot save five from minor injury by letting one die, because the one can reasonably reject a principle allowing their death for the sake of others' minor gains. If "You-at-20" is analogous to the one, and "You-at-70" to the five, then prudence (sacrificing present welfare for future gain) becomes impermissible. To permit prudence, one might argue we simply sum the welfare of the stages. But this is precisely the utilitarian aggregation Scanlon rejects. It treats the life as a container of value rather than a sequence of claims. Thus, if stages are distinct parties, permitting trade-offs requires aggregation.

  However, Scanlon's framework need not treat stages as distinct parties. The "reasonable rejection" test is grounded in the status of individuals as rational beings seeking principles for general agreement. A person is not merely a collection of stages but a unified agent with diachronic interests. The key distinction lies in the **source of the reason**. In interpersonal cases, the reason to reject is based on the *separateness* of persons; I cannot be forced to suffer for your gain. In intrapersonal cases, the "gain" and "suffering" belong to the same rational agent. Allowing "You-at-20" to veto all future benefits would undermine the agency required to formulate and live by principles in the first place.

  This does not require a robust, non-reductionist theory of identity (e.g., a Cartesian ego). It requires only a practical conception of agency. Scanlon's contractualism is about what we owe to each other; what we owe to ourselves is mediated by our capacity to govern our lives. If we treat stages as proxies, we risk replicating utilitarian summation *unless* we recognize that the "proxy" is representing the *same* claimant. The verdict on the Rescue Case does not transfer straightforwardly because the "many" (future stages) are not distinct moral entities demanding sacrifice from the "one" (present stage); they are temporal parts of the single entity holding the claim.

  Therefore, Scanlon can block hidden aggregation by insisting that the unit of contractualist concern is the life-as-a-whole, not the temporal slice. This avoids prioritarianism because it does not weight the worse-off stage (the young) more heavily simply due to status; rather, it recognizes that the *person* has a generic reason to secure their future agency. The "reasonable rejection" is not determined by summing welfare across time, but by asking whether a principle undermines the person's capacity to pursue a valuable life.

  **Verdict:** Intertemporal Contractualism is consistent with Scanlon's core justification only if it rejects the premise that temporal stages are distinct moral parties. If stages are reified as parties, the view collapses into intrapersonal utilitarianism. If the person remains the unit of claim, prudence is permitted not via aggregation, but via the authority of rational agency over its own timeline. Thus, the framework holds, provided it resists the fragmentation of the self.

  ***

  (c) **Marking Scheme**

  **Total Marks: 100**

  **A Grade (75–100): Excellent / Distinction**
  *To achieve an A, the essay must demonstrate precise textual understanding and philosophical nuance.*
  *   **Distinctness of Aggregation (25 pts):** Clearly distinguishes interpersonal aggregation (summing across distinct claimants) from intrapersonal trade-offs. Identifies that treating stages as distinct parties *creates* the aggregation problem rather than solving it.
  *   **Scanlonian Resources (25 pts):** Correctly locates the anti-aggregationist commitment in the *structure of justification* (reasonable rejectability) rather than in a theory of the good. Explains that blocking aggregation requires treating the *person* as the unit of moral concern, not the *stage*.
  *   **Constraints Handling (25 pts):** Successfully addresses the prompt's constraints. Shows how the argument avoids relying on prioritarian weights (valuing the young stage more) and does not depend on a metaphysical theory of identity (e.g., soul or strict numerical identity), relying instead on *practical agency*.
  *   **Rescue Case Analysis (15 pts):** Nuanced assessment of why the Rescue Case logic (saving the one vs. the many) does not map neatly onto intra-life trade-offs (the "many" are not separate claimants).
  *   **Verdict & Clarity (10 pts):** Delivers a clear, reasoned verdict on consistency. Writing is concise, rigorous, and within word limits.

  **B Grade (60–74): Good / Pass**
  *To achieve a B, the essay must be competent but may lack depth or miss specific philosophical moves.*
  *   **Understanding of Scanlon (20 pts):** Correctly summarizes Scanlon's rejection of interpersonal aggregation but may struggle to apply it to the temporal case.
  *   **Aggregation Identification (20 pts):** Identifies that summing benefits across time looks like utilitarianism but may fail to explain *why* this is problematic for contractualism specifically (i.e., misses the "separate claims" argument).
  *   **Constraints (15 pts):** Attempts to address identity or prioritarianism but may rely on one of them implicitly (e.g., assumes a strong view of personal identity to solve the problem).
  *   **Rescue Case (10 pts):** Discusses the Rescue Case but treats the intrapersonal case as identical to the interpersonal case without sufficient critique.
  *   **Structure (15 pts):** Clear structure and reasonable verdict, though the argument may be less tight or slightly exceed/undercut the word count significantly.

  **Common Errors (Mark Deductions)**
  *   **Consequentialist Slide (-10 pts):** Arguing that prudence is permitted simply because "total welfare is higher" without addressing the contractualist test of reasonable rejection.
  *   **Identity Dependency (-10 pts):** Solving the problem by asserting "It's the same person, end of story," without explaining how contractualism accommodates this without a metaphysical theory (as forbidden by the prompt).
  *   **Misreading the Rescue Case (-10 pts):** Arguing that Scanlon would *forbid* saving for retirement because it burdens the present stage (failing to see the unity of agency).
  *   **Summary vs. Analysis (-15 pts):** Spending the majority of the word count summarizing *What We Owe to Each Other* generally rather than addressing the specific intertemporal extension.
  *   **Ignoring Constraints (-10 pts):** Failing to address the prohibition on prioritarian weights or identity theory.
