prompt: |-
  I chair a review panel for a regional foundation that funds community mental-health interventions. Recently we have begun requiring applicants to state not only what they will do, but why they are proposing it — specifically, whether their motivation aligns with what moral philosophy distinguishes as the right kind of reasons for beneficent institutional action, as opposed to reasons of liability reduction, reputation management, or anticipated political credit. We have observed that proposals driven by these latter motives often design studies differently — selecting different outcome measures, altering recruitment strategies, or shifting resource allocation — even when the surface protocol is identical to a welfare-driven proposal. The conceptual distinction is not merely decorative for us; we treat it as a filter because the kind of reason that motivates an intervention shapes its resilience when external incentives change.

  Please construct a reusable audit procedure that my panel can apply to any proposal's motivation statement and supporting documentation. The procedure should translate the right-kind/wrong-kind distinction, as applied to collective institutional actors rather than to individual moral agents, into an ordered sequence of tests or diagnostic questions. For each step, specify the exact question or test to apply, what counts as a sufficient answer (pass), what counts as a failure, whether the step is checking a genuine conceptual condition or only a fallible proxy, and where mixed or ambiguous answers should be routed.

  The procedure must explicitly handle three hard-case structures: (a) mixed motivation, where welfare concern and institutional self-protection are both present and genuinely intertwined; (b) explicit denial of welfare concern coupled with a study design that nevertheless serves participant welfare; and (c) explicit assertion of welfare concern coupled with design choices — budget, staffing, evaluation metrics — that primarily serve organizational visibility or risk mitigation.

  Then run the procedure on the following three proposals. First, a proposal to extend crisis-text-line operating hours, justified almost entirely by reducing the foundation's liability exposure after a recent wrongful-death settlement, with welfare mentioned only as a foreseeable side effect. Second, a proposal for peer-support groups for recently unhoused young adults, framed exclusively in the language of organizational resilience metrics and stakeholder engagement outcomes, with no mention of participant well-being, yet whose design — staffing ratios, meeting frequency, confidentiality protocols — is indistinguishable from a welfare-centered model. Third, a proposal that opens with an explicit, detailed statement of direct concern for the mental health of homeless youth, but whose budget allocates sixty percent to external evaluation consultants and public-relations outreach, with direct service staff receiving minimal funding.

  Finally, the procedure should identify the precise points at which it must halt and defer to human judgment because the distinction between kinds of reasons cannot be further operationalized without collapsing into either mind-reading or arbitrary line-drawing. It should also flag the specific misfire modes the procedure is vulnerable to — for instance, cases where an institution genuinely holds welfare reasons but expresses them only in bureaucratic or defensive language, and cases where liability-avoidance and welfare-promotion happen to converge on identical actions, making the reason-type underdetermined by the design.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a review panel for a regional foundation funding community mental-health interventions.
      *   **Task:** Construct a reusable audit procedure to evaluate applicant motivations based on the "right-kind/wrong-kind" reasons distinction (moral philosophy applied to institutions).
      *   **Core Distinction:** Right-kind reasons (welfare-driven, beneficent) vs. Wrong-kind reasons (liability reduction, reputation management, political credit).
      *   **Rationale:** Motivation shapes resilience when external incentives change.
      *   **Requirements:**
          *   Ordered sequence of tests/diagnostic questions.
          *   For each step: Exact question/test, Pass criteria, Fail criteria, Conceptual condition vs. Proxy, Routing for ambiguity.
          *   Handle three hard cases: (a) Mixed motivation, (b) Explicit denial of welfare + welfare-serving design, (c) Explicit assertion of welfare + self-serving design.
          *   Apply the procedure to three specific proposals (Crisis Text Line, Peer Support, Homeless Youth).
          *   Identify limits (where to defer to human judgment).
          *   Flag misfire modes (false negatives/positives).

  2.  **Theoretical Framework (Right-Kind/Wrong-Kind Reasons):**

      *   *Philosophical Basis:* This draws from the "Wrong Kind of Reasons" (WKR) problem in value theory (e.g., Pascal's Wager, the Demon Case). In an institutional context, it's about *final ends* vs. *instrumental means*.
      *   *Right-Kind (RK):* The welfare of the beneficiaries is the *terminal value* (the end goal).
      *   *Wrong-Kind (WK):* The welfare of the beneficiaries is *instrumental* to organizational survival, reputation, or legal safety.
      *   *Institutional Agency:* Institutions don't have minds, so we infer motivation from governance structures, resource allocation, and counterfactual commitments.

  3.  **Drafting the Audit Procedure (The "Motivation Integrity Audit" - MIA):**

      *   *Goal:* Create a step-by-step filter.
      *   *Step 1: Teleological Alignment (The "Why" Test).* Check the stated ends.
      *   *Step 2: Counterfactual Resilience (The "Even If" Test).* Would they do it if the external pressure vanished?
      *   *Step 3: Resource Priority (The "Budget" Test).* Where does the money actually go?
      *   *Step 4: Metric Sovereignty (The "Success" Test).* Who defines success? The beneficiary or the funder/regulator?
      *   *Handling Hard Cases:* Need specific branching logic for mixed, denied, and asserted motivations.

  4.  **Refining the Steps (Iterative Process):**

      *   *Step 1 (Stated Ends):* Too easy to fake. Needs to be a proxy.
      *   *Step 2 (Counterfactual):* Stronger. If liability disappears, does the program stop?
      *   *Step 3 (Resource):* Concrete. Budgets don't lie as much as mission statements.
      *   *Step 4 (Failure Mode):* What happens if the program fails to improve reputation but helps people? Do they cut it?

      *Let's structure it formally:*
      *   **Test 1: The Terminal Value Declaration.** (Stated purpose).
      *   **Test 2: The Counterfactual Stability Test.** (Incentive removal).
      *   **Test 3: The Resource Allocation Ratio.** (Direct service vs. overhead/defense).
      *   **Test 4: The Adverse Outcome Protocol.** (Response to failure).

      *Refining Criteria:*
      *   *Pass:* Welfare is terminal, stable without external pressure, high direct service spend, continued support despite reputational hit.
      *   *Fail:* Welfare is instrumental, stops if pressure lifts, high defense/PR spend, cut if reputational risk arises.
      *   *Proxy vs. Concept:* Most are proxies because we can't read minds. The Counterfactual is the closest to conceptual.

  5.  **Addressing the Hard Cases:**

      *   *(a) Mixed Motivation:* Need a weighting mechanism. If RK reasons are sufficient to sustain the project *without* WK reasons, it passes.
      *   *(b) Denial of Welfare + Welfare Design:* This is the "Grumpy Benefactor" problem. Look at *constraints*. If they bind themselves to welfare outcomes despite not caring, treat as RK for funding purposes (consequentialist override), but flag for resilience risk.
      *   *(c) Assertion of Welfare + Self-Serving Design:* This is "Virtue Signaling." The Budget Test (Test 3) usually catches this.

  6.  **Running the Procedure on the Three Proposals:**

      *   *Proposal 1 (Crisis Text Line - Liability):*
          *   Test 1: Fail (Stated end is liability).
          *   Test 2: Fail (If lawsuit risk gone, likely stop).
          *   Test 3: Likely Fail (Legal/Compliance budget high?).
          *   *Verdict:* Wrong-Kind.
      *   *Proposal 2 (Peer Support - Resilience Metrics):*
          *   Test 1: Fail (No mention of welfare).
          *   Test 2: Ambiguous (Need to ask if metrics track welfare).
          *   Test 3: Pass (Design matches welfare).
          *   *Verdict:* Hard Case (b). Procedural recommendation: Fund but require reframing.
      *   *Proposal 3 (Homeless Youth - High PR Spend):*
          *   Test 1: Pass (Stated end is welfare).
          *   Test 2: Fail (If PR doesn't work, will they cut service?).
          *   Test 3: Fail (60% to eval/PR).
          *   *Verdict:* Wrong-Kind (Virtue Signaling).

  7.  **Identifying Limits and Misfire Modes:**

      *   *Limits:* We cannot access internal mental states of the board. We cannot predict the future (Counterfactual is hypothetical).
      *   *Misfires:*
          *   *The Bureaucratic Mask:* Genuine care expressed in compliance language (False Negative).
          *   *The Convergent Incentive:* Liability and Welfare align perfectly (Underdetermined).
          *   *The Strategic Camouflage:* Bad actors learning to game the audit (Goodhart's Law).

  8.  **Review and Refine:**

      *   *Tone:* Professional, philosophical, administrative.
      *   *Clarity:* Ensure the distinction between "Conceptual Condition" (the actual reason) and "Proxy" (the evidence we see) is clear in every step.
      *   *Completeness:* Did I cover all three hard cases in the procedure section? Yes, need to ensure the routing logic handles them.
      *   *Formatting:* Use bolding, lists, and clear headings for readability.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Fund/Don't Fund." The prompt asks for an *audit procedure* to apply to the motivation statement. The output of the audit is a classification of the *reason type*, which then informs the funding decision. I need to be precise about the "Routing" for ambiguous answers.

      *Refining the Hard Case Logic in the Procedure:*
      *   For Mixed (a): The "Sufficiency Clause." Are RK reasons *sufficient* to sustain the project if WK reasons vanish?
      *   For Denial (b): The "Design Binding." Does the design legally/structurally bind them to welfare outcomes regardless of intent?
      *   For Assertion/Design Mismatch (c): The "Budget Veto." Does the budget contradict the statement?

      *Final Polish:* Ensure the distinction between *institutional* reasons and *individual* reasons is maintained. Institutions act through policies and budgets.

  9.  **Final Output Structure:**
      1.  Introduction (Philosophical Grounding).
      2.  The Motivation Integrity Audit (MIA) Procedure (4 Steps).
      3.  Hard Case Protocols.
      4.  Application to the Three Proposals.
      5.  Limits and Misfire Modes.

      *(Check against constraints)*: "Ordered sequence of tests," "Exact question," "Pass/Fail," "Proxy/Concept," "Routing." "Run on three proposals." "Identify halt points." "Flag misfire modes." All present.

      *Let's write it.*
answer: |-
  # The Motivation Integrity Audit (MIA) Procedure

  ## 1. Philosophical Grounding and Scope
  This procedure operationalizes the **Right-Kind/Wrong-Kind (RK/WK) Reasons** distinction for institutional actors.
  *   **Right-Kind (RK) Reasons:** The welfare of the beneficiary is the *terminal value* (the end goal). The intervention is justified because it is good for the participant.
  *   **Wrong-Kind (WK) Reasons:** The welfare of the beneficiary is *instrumental* (a means to an end). The intervention is justified because it secures organizational safety, reputation, or funding continuity.

  **Note on Institutional Agency:** Institutions do not have minds. We infer "motivation" from structural commitments, resource allocation, and counterfactual stability. Therefore, most steps below are **fallible proxies** for the genuine conceptual condition (the actual motivational state of the governance body).

  ---

  ## 2. The Audit Sequence

  ### Step 1: The Terminal Value Declaration
  *   **Question:** In the mission statement and problem definition, is participant welfare presented as the *final justification* for the activity, or as a *byproduct* of organizational necessity?
  *   **Pass (RK Indicator):** Welfare is the primary noun/subject of the goal statement (e.g., "To reduce suffering").
  *   **Fail (WK Indicator):** Welfare is subordinate to organizational status (e.g., "To mitigate risk," "To enhance stakeholder trust," "To ensure compliance").
  *   **Status:** **Fallible Proxy.** (Actors can lie or use coded language).
  *   **Routing:**
      *   *Pass:* Proceed to Step 2.
      *   *Fail:* Proceed to Step 2 (Do not reject yet; check for Hard Case B).
      *   *Ambiguous:* Flag for Hard Case A (Mixed Motivation).

  ### Step 2: The Counterfactual Stability Test
  *   **Question:** If the external pressure driving the WK reason (e.g., threat of lawsuit, need for positive press, regulatory scrutiny) were removed tomorrow, would the institution continue this specific intervention at the current scale?
  *   **Pass (RK Indicator):** Yes. The proposal includes a sustainability plan independent of the specific external threat or reputational gain.
  *   **Fail (WK Indicator):** No. The intervention is explicitly tied to the duration of the threat or the news cycle.
  *   **Status:** **Conceptual Condition (Hypothetical).** This tests the *resilience* of the reason, which is the core philosophical distinction.
  *   **Routing:**
      *   *Pass:* Strong RK evidence.
      *   *Fail:* Strong WK evidence.
      *   *Ambiguous:* Route to Human Judgment (See Section 5).

  ### Step 3: The Resource Allocation Ratio
  *   **Question:** Does the budget prioritize direct beneficiary impact over organizational defense or visibility?
  *   **Pass (RK Indicator):** >70% of direct costs allocated to service delivery/staffing interacting with beneficiaries.
  *   **Fail (WK Indicator):** >40% of direct costs allocated to evaluation, PR, legal compliance, or overhead not directly enabling service.
  *   **Status:** **Fallible Proxy.** (High eval costs can sometimes mean rigorous welfare tracking, but often signal accountability to funders rather than beneficiaries).
  *   **Routing:**
      *   *Pass:* Supports RK.
      *   *Fail:* Supports WK (Triggers Hard Case C if Step 1 Passed).
      *   *Ambiguous:* Request budget revision.

  ### Step 4: The Adverse Outcome Protocol
  *   **Question:** If the intervention improves participant welfare but damages organizational reputation (or vice versa), which outcome triggers a continuation of funding?
  *   **Pass (RK Indicator):** Protocol commits to continuing/supporting the intervention even if it generates negative publicity or no "success stories" for marketing.
  *   **Fail (WK Indicator):** Success metrics are tied to "stories of change," "media impressions," or "risk reduction" rather than clinical/functional outcomes.
  *   **Status:** **Conceptual Condition (Operationalized).** This tests the hierarchy of values in practice.
  *   **Routing:**
      *   *Pass:* Confirms RK.
      *   *Fail:* Confirms WK.
      *   *Ambiguous:* Route to Human Judgment.

  ---

  ## 3. Hard-Case Protocols

  ### Hard Case A: Mixed Motivation (Welfare + Self-Protection)
  *   **Condition:** Both RK and WK reasons are explicitly present.
  *   **Diagnostic:** Apply the **Sufficiency Clause** within Step 2.
  *   **Procedure:** Ask: "Are the RK reasons *sufficient* to sustain the project if the WK reasons vanish?"
  *   **Decision Rule:**
      *   If RK reasons are sufficient to maintain >80% of current activity: **Classify as RK.** (Institutions are rarely pure; resilience is the key).
      *   If RK reasons only sustain <50% of activity without WK support: **Classify as WK.** (Welfare is incidental).

  ### Hard Case B: Explicit Denial of Welfare + Welfare-Serving Design
  *   **Condition:** Proposal uses WK language (resilience, metrics) but design (staffing, protocols) matches RK standards.
  *   **Diagnostic:** Apply the **Design Binding Test**.
  *   **Procedure:** Examine if the design *structurally binds* the institution to welfare outcomes regardless of intent (e.g., confidentiality clauses, clinical staffing ratios mandated by contract).
  *   **Decision Rule:**
      *   If design creates a fiduciary or clinical duty of care that overrides organizational convenience: **Classify as Functionally RK.** (Fund, but require mission statement alignment to ensure long-term resilience).
      *   If design allows easy abandonment of welfare if metrics dip: **Classify as WK.**

  ### Hard Case C: Assertion of Welfare + Self-Serving Design
  *   **Condition:** Proposal claims RK motivation (Step 1 Pass) but budget/metrics are WK (Step 3/4 Fail).
  *   **Diagnostic:** Apply the **Budget Veto**.
  *   **Procedure:** The budget overrides the mission statement.
  *   **Decision Rule:**
      *   If >50% of resources serve visibility/defense: **Classify as WK.** (Treat as "Virtue Signaling").
      *   *Rationale:* Resource allocation reveals revealed preference, which trumps stated preference.

  ---

  ## 4. Application to Submitted Proposals

  ### Proposal 1: Crisis Text Line Extension
  *   **Context:** Justified by liability reduction after wrongful-death settlement. Welfare = side effect.
  *   **Audit Run:**
      *   *Step 1 (Terminal Value):* **Fail.** Stated end is liability exposure.
      *   *Step 2 (Counterfactual):* **Fail.** If settlement risk vanishes, justification disappears.
      *   *Step 3 (Resources):* **Likely Fail.** (Implied focus on legal/compliance protocols).
      *   *Step 4 (Adverse Outcome):* **Fail.** If the line reduces liability but doesn't generate positive PR, it continues; if it helps people but increases liability risk, it likely stops.
  *   **Hard Case Check:** Not Mixed (Welfare is explicitly secondary). Not Denial (Welfare admitted as side effect). Not Assertion Mismatch (Assertion matches WK design).
  *   **Classification:** **Wrong-Kind (WK).**
  *   **Recommendation:** Reject. The intervention lacks resilience; if the legal threat dissipates, the service will be cut regardless of community need.

  ### Proposal 2: Peer-Support for Unhoused Youth
  *   **Context:** Framed in organizational resilience/stakeholder metrics. No mention of well-being. Design is welfare-centered (staffing, confidentiality).
  *   **Audit Run:**
      *   *Step 1 (Terminal Value):* **Fail.** Language is bureaucratic/WK.
      *   *Step 2 (Counterfactual):* **Ambiguous.** Unclear if "resilience" depends on participant outcomes.
      *   *Step 3 (Resources):* **Pass.** Staffing ratios and confidentiality protocols cost money and serve welfare, not just optics.
      *   *Step 4 (Adverse Outcome):* **Pass (Implied).** Clinical protocols bind the organization to care standards.
  *   **Hard Case Check:** **Hard Case B (Explicit Denial + Welfare Design).**
      *   *Design Binding:* The confidentiality protocols and staffing ratios create a clinical duty of care.
  *   **Classification:** **Functionally Right-Kind (RK).**
  *   **Recommendation:** Fund, *conditional* on revising the mission statement to align with the design. The design ensures welfare, but the language poses a resilience risk (if "organizational resilience" is redefined later, the program could be cut).

  ### Proposal 3: Homeless Youth Mental Health
  *   **Context:** Explicit welfare concern. Budget: 60% to external eval/PR, minimal to direct service.
  *   **Audit Run:**
      *   *Step 1 (Terminal Value):* **Pass.** Explicit statement of concern.
      *   *Step 2 (Counterfactual):* **Fail.** High PR spend suggests dependence on external validation.
      *   *Step 3 (Resources):* **Fail.** 60% to eval/PR violates the Resource Allocation Ratio.
      *   *Step 4 (Adverse Outcome):* **Fail.** Success is defined by consultants/PR, not youth outcomes.
  *   **Hard Case Check:** **Hard Case C (Assertion + Self-Serving Design).**
      *   *Budget Veto:* The budget contradicts the mission statement.
  *   **Classification:** **Wrong-Kind (WK).**
  *   **Recommendation:** Reject. This is "Virtue Signaling." The structure prioritizes the *appearance* of help over the *act* of helping.

  ---

  ## 5. Limits of Operationalization (The Halt Points)

  The MIA procedure must halt and defer to human judgment at the following points. Attempting to automate these further collapses into mind-reading or arbitrary line-drawing.

  1.  **The Sincerity Threshold (Step 1 & 2 Intersection):**
      *   *Halt Point:* When an applicant claims RK reasons but the Counterfactual Test is hypothetical.
      *   *Reason:* We cannot know if they *would* actually continue the program if incentives changed. We only know what they *say* they would do.
      *   *Deferral:* Panel must assess the *track record* of the institution. Past behavior is the only evidence of future counterfactual stability.

  2.  **The Convergent Incentive (Step 3 Ambiguity):**
      *   *Halt Point:* When WK and RK reasons demand identical resource allocation.
      *   *Reason:* Sometimes the best way to reduce liability *is* to provide excellent care. In these cases, the "Reason Type" is underdetermined by the design.
      *   *Deferral:* Panel must assess *governance*. Who sits on the board? If the board is entirely legal/financial, treat as WK. If there is beneficiary representation, treat as RK.

  3.  **The Bureaucratic Mask (Hard Case B Nuance):**
      *   *Halt Point:* When genuine welfare concern is expressed *only* in defensive language due to funder requirements (learned helplessness).
      *   *Reason:* Experienced NGOs often learn to speak the language of the funder (WK language) to secure RK ends.
      *   *Deferral:* Panel must conduct interviews. Ask: "If we allowed you to rewrite the goals without penalty, what would you write?"

  ---

  ## 6. Vulnerable Misfire Modes

  The panel must remain aware of these specific failure modes of the audit procedure:

  1.  **The Goodhart Misfire (Proxy Collapse):**
      *   *Risk:* Once this audit is known, applicants will game the "Resource Allocation Ratio" and "Counterfactual" answers.
      *   *Mitigation:* Randomize the weighting of Steps 2 and 3. Do not publish the exact percentage thresholds (e.g., the 70% rule) in the public RFP guidelines.

  2.  **The Bureaucratic False Negative:**
      *   *Risk:* Small, grassroots organizations often lack the language of "Terminal Value" and speak in survival terms (WK language) because they are precarious, even if their hearts are pure (RK motivation).
      *   *Mitigation:* Apply a "Capacity Adjustment." For organizations under 5 staff, weight Step 3 (Design) higher than Step 1 (Language).

  3.  **The Convergent False Positive:**
      *   *Risk:* An institution provides excellent care solely to avoid lawsuits (WK), but the audit classifies them as RK because the *outcome* is good.
      *   *Mitigation:* This is an accepted risk. As a foundation, we fund *interventions*. If the WK motivation is stable (e.g., liability is a permanent feature of the landscape), the resilience is sufficient. The audit only rejects WK reasons if they are *fragile* (e.g., tied to a specific news cycle).

  4.  **The Moral Luck Error:**
      *   *Risk:* Penalizing an organization for being in a high-liability environment (forcing them to talk about risk) while rewarding one in a low-liability environment (allowing them to talk about welfare).
      *   *Mitigation:* Normalize the "Risk Context." Compare the liability language against industry standards for that specific sector, not against a universal ideal.
