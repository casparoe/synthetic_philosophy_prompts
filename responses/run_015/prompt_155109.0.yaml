      *   *Move 2 (Riley):* "Rights are constitutional constraints, not SWF outputs."
          *   *Verdict:* **Partially Correct/Insightful.** This is the "Rights as Constraints" vs. "Rights as Preferences" debate (Nozick/Gauthier vs. Sen). Sen treats rights as *decisiveness* within the SWF. Riley treats them as *pre-social* constraints. Technically, if you constrain the domain, you escape the theorem, but you change the setup.
      *   *Move 3 (Jordan):* "Taking pairs off the menu violates Unrestricted Domain."
