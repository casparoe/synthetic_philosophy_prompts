      *   *Game Theory/Strategic Behavior:* The paradox assumes truthful revelation. In practice, bargaining and negotiation resolve these conflicts before they hit a voting paradox.
      *   *The "Meddlesome" Preference:* Sen's example relies on people caring deeply about others' private choices. A robust liberalism might argue such preferences shouldn't count (Gibbard's resolution).

