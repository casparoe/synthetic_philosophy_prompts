          *   Claim 2: Constitutional rules are chosen democratically. You haven't escaped the paradox; you've pushed it to the meta-level.
          *   Claim 3: At the constitutional level, we use supermajorities and exit rights, so Sen's conditions (specifically UD or the aggregation rule) don't apply anyway.

  3.  **Evaluate Move-by-Move (Theoretical Accuracy):**

      *   *Move 1 (Jordan):* "Paradox proves ML + PE can't hold."
