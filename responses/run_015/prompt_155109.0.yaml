          *   Claim 1: The paradox proves Minimal Liberalism (ML) and Pareto Efficiency (PE) can't both hold in any social choice rule. (Standard interpretation of Sen's theorem).
          *   Example: Roommates picking AI settings (Unrestricted vs. Restricted). Each has sovereignty over one pair but cares about the other's. (Classic "Lady Chatterley's Lover" style setup).
