      *   *Move 4 (Riley):* "Constitutions are chosen democratically... pushed to meta-level."
          *   *Verdict:* **Strong Point.** This is the "Infinite Regress" or "Constitutional Political Economy" argument (Buchanan/Tullock). If the constitution is chosen by voting, does the paradox re-emerge?
      *   *Move 5 (Jordan):* "Paradox applies at every level."
          *   *Verdict:* **Debatable/Exaggerated.** Not necessarily *every* level. If the constitutional choice restricts the domain sufficiently, the lower-level paradox disappears. But the tension remains.
