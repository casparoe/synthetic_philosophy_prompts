      *   *Core Question:* How can something be deterministic and chaotic? Isn't that a contradiction?

  2.  **Deconstruct the Definitions:**
      *   *Determinism:* A property of the *laws* governing the system. If you know the state at time $t$ perfectly, the laws dictate exactly one state at time $t+1$. There is no randomness in the evolution rule. $x_{t+1} = f(x_t)$.
      *   *Chaos:* A property of the *trajectory* or *behavior* of the system within a specific phase space. It involves sensitivity to initial conditions, topological mixing, and dense periodic orbits.
