      *   *Determinism* says: "If the universe were reset to the exact same state, it would play out exactly the same way."
      *   *Chaos* says: "Even though it plays out the same way, tiny differences in the reset state lead to huge differences later."
      *   The "genuinely open" part is the user's philosophical leap. In classical physics (where chaos theory lives), the future *is* determined, even if we can't calculate it.

  4.  **Formulate the Explanation Strategy:**
