      *   **Define Determinism clearly:** It's about the *rules*, not our ability to measure. Use the mathematical definition (unique future for a unique present).
      *   **Define Chaos clearly:** It's about the *divergence of trajectories*.
      *   **The Crucial Distinction (Epistemic vs. Ontic):**
