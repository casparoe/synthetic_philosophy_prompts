answer: |-
  This is a sharp observation. You have stumbled onto the exact friction point where **philosophy of action** (what *can* a mind do?) crashes into **behavioral economics** (what *will* a mind do?).

  There isn't one single word for this, because you are actually tripping over three distinct mechanisms that look similar on the surface. To carve this up properly, you need to separate the **logical impossibility**, the **psychological contamination**, and the **structural solution**.

  Here is the carving.

  ### 1. The Logical Cut: The Transparency Condition (Case 1)
  **Name:** *The Kavka Constraint* (or *The Toxin Puzzle*)

  In your first case (the flu pill), the problem is logical, not psychological. This is a famous problem in philosophy of action introduced by Gregory Kavka.
  *   **The Rule:** Intention is "transparent." You cannot intend to do X unless you believe you have a reason to do X *at the time of doing X*.
  *   **The Glitch:** The reward is given for *intending*, not *doing*. Once you have the reward (breakfast), you have no reason to swallow the pill (evening). Because you know you won't swallow it, you cannot genuinely *intend* to swallow it at breakfast.
  *   **The Carving:** This is **Incentivizing a Mental State**. You are trying to pay for a thought. The mind cannot accept a reason to *think* without a reason to *act*.
  *   **Verdict:** This is structurally broken. You cannot design a mechanic that pays for "deciding." The human operating system doesn't expose that API.

  ### 2. The Psychological Cut: Motivation Crowding (Case 2)
  **Name:** *The Overjustification Effect* (or *Motivation Crowding*)

  In your second case (the run), the logic holds (you *could* intend to run), but the *value* of the intention is destroyed.
  *   **The Rule:** Actions carry signals. When you do something for intrinsic reasons (health, discipline), it signals "I am the kind of person who values this." When you do it for extrinsic reasons (money), it signals "I am the kind of person who needs to be bribed."
  *   **The Glitch:** By paying you to *decide*, the money colonizes the reason space. At 6 PM, you can't run for health (because the money is already in your pocket, making health secondary) and you can't run for money (because you already have it). The action feels "bought" because the incentive shifted the *locus of control* from internal to external.
  *   **The Carving:** This is **Contaminating the Signal**. The reward doesn't make the intention impossible (like Case 1); it makes the intention *inauthentic*, which reduces the utility of the action for a self-signaling agent.
  *   **Verdict:** This is design poison. Paying for "commitment" or "mindset" crowds out the intrinsic identity you are trying to build.

  ### 3. The Structural Cut: Precommitment Devices (Case 3)
  **Name:** *Ulysses Contracts* (or *Outcome-Contingent Constraints*)

  In your third case (the deposit), the mechanic works because it changes the *target* of the incentive.
  *   **The Rule:** You cannot incentivize the *intention*, but you can incentivize the *constraints on failure*.
  *   **The Fix:** The deposit contract does not pay you to *want* to run. It punishes you for *not* running. This creates a *new reason to act* at 6 PM (avoiding loss). Because there is now a valid reason to act at the time of action, the Transparency Condition (Case 1) is satisfied. Because the money is framed as a penalty for failure rather than a bribe for desire, the Signal (Case 2) remains intact (you are still "a runner" protecting your money, not a mercenary).
  *   **The Carving:** This is **Incentivizing the Outcome Constraint**. You aren't paying for the state of mind; you are taxing the state of failure.
  *   **Verdict:** This is the only viable mechanic for behavior change.

  ### 4. The "Fix the World" Move
  **Name:** *Contextual Scaffolding* (or *Externalizing the Stake*)

  Regarding your variant: The stranger brings your family to watch.
  *   **The Move:** You noted that you didn't change your mind; you changed the world. In philosophy, this is often called **Precommitment via Social Cost**.
  *   **Why it works:** It converts Case 1 (Flu Pill) into Case 3 (Deposit Contract).
      *   Originally: Reward for intending, no reason to act. (Impossible)
      *   With Family: Reward for intending, *plus* massive social shame if you don't act.
      *   Now, at the time of action, you *do* have a reason to swallow the pill (avoiding shame). Therefore, you *can* intend to swallow it at breakfast.
  *   **The Name:** In design terms, this is **Environmental Restructuring**. You aren't trying to hack the user's volition; you are hacking the consequence landscape so that volition becomes rational.

  ### Summary of the Carving

  To answer your specific questions on boundaries and names:

  **1. Does the pattern have a name?**
  It is a cluster. The failure mode is **"The Paradox of Intentional Incentives."** It combines *Kavka's Toxin Puzzle* (logical impossibility) and *Motivation Crowding* (psychological degradation).

  **2. Where is the boundary between poisoning and producing?**
  The boundary is **Time and Target.**
  *   **Poison:** Incentives attached to the *Mental State* at Time A (Breakfast) for an Action at Time B (Evening). This creates a gap where the reason vanishes.
  *   **Produce:** Incentives attached to the *Behavioral Outcome* at Time B (Evening). This ensures the reason exists when needed.
  *   **Rule of Thumb:** If the user gets the reward *before* the risk of failure, you are poisoning the well. If the user risks the reward *until* the action is complete, you are scaffolding the will.

  **3. Does it matter that it's Intention vs. Belief?**
  Yes.
  *   **Belief:** Subject to *Doxastic Involuntarism*. You literally cannot believe at will, regardless of incentives. Offering money for belief is always a category error (like offering money to digest food faster).
  *   **Intention:** Subject to *Practical Reasoning*. You *can* intend at will, *provided* you have a reason to act. The problem isn't that you can't intend; it's that the incentive removes the reason required to intend.
  *   **The Brokenness:** Belief incentives are broken because the mind lacks the *mechanism*. Intention incentives are broken because the mind lacks the *reason*.

  **4. What do you call the "Fix the World" move?**
  Call it **Stake Externalization**. You are moving the stakes from an internal mental state (which is hard to verify and hard to motivate) to an external social or financial consequence (which is verifiable and provides a concrete reason to act).

  ### Practical Application for Your App
  If you are designing reward mechanics:
  1.  **Never reward "Deciding" or "Committing."** (Case 1 & 2). You cannot verify it, and paying for it breaks the reasoning required to fulfill it.
  2.  **Always reward "Verifiable Completion" or "Penalize Verifiable Failure."** (Case 3).
  3.  **If you must influence the "Deciding" phase,** do not pay for it. Instead, use **Stake Externalization** (social accountability, public pledges) to make the *future action* rational, which retroactively makes the *current intention* possible.

  You aren't trying to buy the intention. You are trying to build a world where the intention is the only rational thing to have.
