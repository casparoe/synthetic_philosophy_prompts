answer: |-
  **TO:** Committee on Research Releases
  **FROM:** Grad Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: Model Release Case R. and Protocol Amendment

  **Recommendations**
  1.  **Case R.:** Vote to deny repository space for the proposed model release at this time.
  2.  **Protocol:** Initiate formal notice today to amend release authority. Effective November 22, require dual authorization (two credential holders) for general-purpose models.

  **Decision on Case R.**
  Postdoc R. intends to release a model with coding and wet-lab capabilities in ten days. Her self-assessed risk of serious harm is 2–3%. Our committee's agreed breakeven threshold for irreversible downside is 1-in-50 (2%) to 1-in-20 (5%). Her estimate sits directly on the danger boundary.

  We must vote to deny consortium repository hosting. This decision acknowledges two constraints. First, we control the repository, not R. She has stated she will release via a lab mirror if blocked. This vote does not guarantee safety; it protects the consortium's standing and refuses to legitimize a risk profile we deem unacceptable. Second, we must weigh the incentive misalignment. R. captures the career upside (citations, signaling); the community bears the downside. Her threshold is structurally incentivized to be lower than ours.

  **Addressing Dissent**
  Tom argues that re-litigating a researcher's risk estimate undermines autonomy and that positive expected value justifies the release. He is correct that oversight creates friction. However, expected value calculations fail when the downside is irreversible and non-compensable. We cannot recover from a catastrophic release. When the penalty is infinite, the probability must be near zero, not merely "worth it."

  Priya argues for a permanent rule requiring all fourteen credential holders to sign off. This creates a single-point veto. While her caution is warranted, this rule would stall all releases and push development to external actors with lower safety standards. We must balance safety with the reality that if we do not release capable models, less careful actors will. Denying R. here is specific to the risk profile, not a blanket veto on innovation.

  **Policy Change and the "Most-Optimistic" Problem**
  We are initiating a rule change today to take effect in 30 days, requiring two signatures for future releases. This addresses the statistical hazard inherent in our current single-signature system.

  Currently, any of the fourteen credential holders can release alone. This means the release decision is made by the person *most willing* to release. In risk estimation, the person most willing to act is almost always the most optimistic about the risks. Even if the average risk estimate across the committee is safe, the *minimum* estimate (the one acting) is likely unsafe. This is selection bias: we are selecting the outlier to make the decision.

  A faculty member noted that what matters is the chance the most optimistic person is wrong. This is correct. If our errors are independent, averaging them helps. But if our errors are correlated—if we all share the same blind spot regarding wet-lab protocols—the average is useless. In either case, allowing the most optimistic person to act alone maximizes the probability of catastrophe. Requiring a second signature forces a check against the extreme optimism of the proposer without granting veto power to the most pessimistic member.

  **Timeline**
  *   **Thursday (Meeting):** Vote on Case R. and authorize Protocol Amendment notice.
  *   **Friday:** Send written notice to consortium partners regarding protocol change.
  *   **November 22:** Dual-authorization rule takes effect.
  *   **Immediate:** Communicate decision to R. and her lab chair.

  This approach respects the consortium agreement's notice period while immediately addressing the specific risk before us. It acknowledges that we cannot stop R. from releasing elsewhere, but we can decide what carries our consortium's imprint.
