      *   *Ethical Reality Check:* The object was made to decay. Preserving it forever violates its ontological status. However, letting it rot immediately might violate the "no destruction" legal clause.
      *   *Community Dynamics:* The National Museum is the safest legal bet but often represents state power over local indigenous rights. The Community Museum wants display (contrary to original intent). The Council wants retirement (consistent with intent, problematic legally/gender-wise).
      *   *Synthesis:* The "Title Transfer + Indefinite Loan" workaround seems the most viable path to satisfy legal constraints while acknowledging the Council's authority, *but* it needs to address the "destruction" clause.
      *   *Decision:* Recommend transferring legal title to the **Okwei Heritage Council**, but structuring the physical custody as a **long-term renewable loan** with a specific "sunset clause" regarding conservation.
