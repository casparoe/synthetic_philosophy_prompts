      *   *Other Objects:* Treat individually based on current community desire, not 1899 context.

      *   *Final Decision for Memo:*
          *   **Recipient:** National Museum (Title) + Okwei Heritage Council (Custody/Decision).
          *   **Condition:** Cessation of active conservation (allow natural decay).
          *   **Other Objects:** Offer return; if refused, remain in Fennimore collection as "unclaimed colonial holdings" with digital access.

  3.  **Drafting the Memo - Structure:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation clearly stated.
