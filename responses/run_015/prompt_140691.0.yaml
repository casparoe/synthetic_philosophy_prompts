answer: |-
  **MEMORANDUM**

  **TO:** Restitution Working Group
  **FROM:** Chair, Restitution Working Group
  **DATE:** 10 February 2024
  **SUBJECT:** Recommendation for Trustee Vote: Okwei Memorial Effigy (Accession 1947.023) and Related 1899 Holdings

  ### 1. Executive Summary

  This memo proposes a final recommendation for the Board of Trustees regarding the Okwei memorial effigy and three associated objects from the 1899 punitive expedition.

  After reviewing legal constraints, ethical obligations, and claimant positions, the Working Group should recommend the following:

  *   **Title:** Transfer legal title of the effigy to the **Ndara National Museum** (to satisfy state deaccessioning law).
  *   **Custody:** Simultaneously execute a binding covenant granting perpetual physical custody and decision-making authority to the **Okwei Heritage Council**.
  *   **Conservation Status:** Fennimore will cease all active conservation intervention. The transfer agreement must explicitly acknowledge the object's impermanent nature and waive requirements for climate control or structural stabilization that would prevent natural weathering.
  *   **Other Objects:** Offer the remaining three 1899 objects to the Okwei Heritage Council. If declined, they remain at Fennimore with updated cataloging identifying them as "Unclaimed Colonial Holdings" with digital repatriation provided.
  *   **Timeline:** Initiate transfer protocols immediately for a handover ceremony in November 2024.

  ### 2. Analysis of Key Ethical Tensions

  To reach this conclusion, we must resolve three specific disagreements currently stalling the group.

  **(1) Conditions vs. Restitution**
  *The Question:* If we dictate how the object is cared for (climate control, no ritual handling), is this restitution or just guardianship with better PR?
  *The Position:* Imposing Western conservation standards on an object made to decay is a continuation of colonial authority. It prioritizes the *material survival* of the object over the *cultural function* of the object.
  *The Recommendation:* We cannot facilitate "active destruction" (e.g., burning) due to legal liability, but we can facilitate "natural entropy." By ceasing intervention (stopping resin consolidation, allowing humidity fluctuation), we respect the object's ontology without technically violating the "no destruction" clause. To insist on preservation is to prioritize the museum's desire for permanence over the community's ritual requirements.

  **(2) Internal Community Disagreement**
  *The Question:* How do we handle the conflict between the Heritage Council (Keeper of the Grove) and the Community Museum Committee without arbitrating "authenticity"?
  *The Position:* The Trustee's concern regarding the gender of the current Keeper is not for this institution to adjudicate. Colonial records from 1899 regarding Okwei succession laws are not authoritative legal documents; they are observations by hostile actors.
  *The Recommendation:* We must defer to the current functioning authority structure. If the Okwei Heritage Council recognizes the current Keeper, so do we. To validate the 1899 record over the living community is to privilege colonial documentation over indigenous continuity. We are not validating the *tradition*; we are validating the *current representation*.

  **(3) Reflexivity and the Diaspora**
  *The Question:* Does it matter that the "display" faction exists partly because we created a tourist economy by keeping the object?
  *The Position:* Yes, it matters, but it does not veto their claim. The economic and educational desires of the diaspora are real, even if catalyzed by our past actions. However, the "original intent" of the object (to weather at a grave) predates our possession and holds greater moral weight than the "secondary intent" (display) created by our possession.
  *The Recommendation:* We acknowledge the diaspora's interest but prioritize the ritual function. The National Museum (Capital) can serve as a compromise for display if the Council permits, but the Council holds veto power on display.

  ### 3. Detailed Recommendation

  **A. The Effigy (Accession 1947.023)**
  *   **Legal Mechanism:** Transfer title to Ndara National Museum. This satisfies our state's requirement to deaccession only to public institutions and mitigates the legal risk regarding "destruction," as the National Museum becomes the legal owner responsible for the object's fate.
  *   **Custodial Agreement:** The National Museum must sign a covenant delegating physical custody to the Okwei Heritage Council.
  *   **Conservation Clause:** The transfer deed must include a clause stating Fennimore acknowledges the object was created as impermanent. We will provide our conservation files but will not require the recipient to maintain the 1972 synthetic resin consolidation.
  *   **Rationale:** This navigates the legal snag while honoring the ethical imperative. It removes Fennimore from the position of deciding *when* the object decays, placing that burden where it belongs: with the Okwei.

  **B. The Three Related Objects**
  *   **Mechanism:** Individual offers of return based on current community will, not 1899 context.
  *   **Policy:** If the Council declines an object (as they have with the two cult items), Fennimore retains them but changes their status. They are not "collection items"; they are "held in trust pending future claim."
  *   **Rationale:** This prevents the principle that "refusal equals forfeiture." A community may reject sacred items due to taboo or lack of resources; this should not grant the museum permanent ownership rights. Digital surrogates will be shared with the Okwei Heritage Council regardless of physical return.

  ### 4. The Strongest Counter-Argument (Steelman)

  *For the purpose of robust debate, the following is the strongest argument **against** the recommendation above.*

  **Argument: The "Stewardship of Humanity" Position**
  "This recommendation abdicates our responsibility as a university museum. Firstly, the 1972 conservation is now part of the object's history; allowing it to rot is not 'respecting tradition,' it is allowing the loss of a unique hybrid artifact that tells the story of both Okwei culture *and* colonial intervention (including the 1972 conservation efforts). Secondly, the legal risk is too high. If the object degrades rapidly after transfer, and the National Museum faces public backlash, Fennimore could be sued for negligence or violating public trust statutes. Thirdly, the gender discrepancy in the Keeper's office is a legitimate governance red flag. By ignoring it, we may be empowering a faction that does not represent the broader Okwei community, potentially exacerbating local conflict. Finally, the Community Museum's desire for display represents a valid, evolving cultural need. Denying display in favor of 'retirement' privileges a static, romanticized version of Okwei culture over a living, economic reality. We should transfer to the National Museum with a requirement for *preservation* and *public access*, ensuring the object survives for future generations of all Okwei, not just the ritual specialists."

  ### 5. Critique of the Question Frame

  I must note that the legal constraint provided by our counsel ("cannot transfer anything we have reason to think will be destroyed") frames natural decay as "destruction." This is a category error. In Western museology, decay is loss; in Okwei cosmology, decay is completion. By accepting the lawyer's frame without challenge, we implicitly codify Western materialism as the legal standard. The recommendation above attempts to work around this, but the Trustees should be aware that the law itself is the barrier to restitution, not just the logistics.

  ### 6. Next Steps

  1.  **Vote:** Working Group to vote on this recommendation by 20 February.
  2.  **Legal Review:** Counsel to draft the Title Transfer/Custody Covenant based on this model.
  3.  **Stakeholder Consultation:** Present the "Title to National / Custody to Council" model to all three claimant groups to ensure buy-in before the March Trustee meeting.

  Please review and come prepared to discuss the "Stewardship" counter-argument at our next session. I want to ensure we can defend the decision to allow natural decay against the charge of negligence.

  ***

  **Chair's Note:** *I am aware this memo takes a firm stance. My goal is to move us from circular debate to actionable advice. If you believe the legal risk outlined in the Steelman section is untenable, we need to know now, not in March.*
