  I am working on a feature for a science-and-ideas magazine about the conceptual archaeology of liberal sexual ethics, and I have been reading Jeremy Bentham's private essays and manuscript fragments from the 1810s and 1820s—texts that circulated among his disciples but remained largely unpublished during his lifetime. In these writings, he argues that consensual sexual acts between adults should not be criminalized, because the only legitimate basis for legal punishment is the prevention of harm to others, and social prejudice itself generates far more suffering than the behaviors it condemns. At the same time, he introduces a taxonomic distinction that I find difficult to parse: he separates harms inflicted on others through deception or coercion from what he terms self-regarding injuries, which he places outside the jurisdiction of law yet still subjects to a form of moral or pedagogical correction. He insists that this correction is justified not by divine law or natural right, but purely by the long-term reduction of pleasure that such habits may cause; nevertheless, the vocabulary of correction and offence seems to carry a normative weight that his quantitative hedonism struggles to bear.

  My difficulty is conceptual rather than historical. I want to understand whether Bentham's category of self-regarding injury is genuinely reducible to a forward-looking utility calculation—perhaps an unacknowledged anticipation of later ideas about adaptive preferences, in which individuals systematically misjudge their own future well-being—or whether it operates as a residual container for social disgust that his system has not fully expelled. Given that he was writing before the development of modern psychology or sociology, does this tension represent a simple inconsistency, or does it expose a deeper structural problem: that a purely aggregative, pleasure-based calculus cannot fully account for practices whose meaning is constituted through intersubjective recognition and institutional context? I am not asking for a bibliography or a chronological survey of scholarship, but for a rigorous conceptual diagnosis of how that split functions within his framework, and whether it anticipates later critiques—found, for example, in feminist philosophy or in theories of institutional design—about the impossibility of cleanly separating self-harm from socially embedded norms.

  Please treat this as a formal conceptual analysis rather than a historical report, and end your response with exactly one sentence summarizing your interpretation, placed on the final line and prefixed with the word Summary: followed by your sentence.
