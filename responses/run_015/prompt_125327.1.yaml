answer: |-
  The tension you identify in Bentham's manuscripts regarding "self-regarding injury" is not merely an inconsistency born of personal bias or historical limitation, but rather a structural fissure inherent to any ethical system that attempts to ground normative authority solely in aggregative hedonism while maintaining a liberal distinction between private conduct and public harm. Bentham's effort to classify certain consensual acts as injuries subject to pedagogical correction, despite their exclusion from legal punishment, reveals the difficulty of sustaining a monistic value theory when confronted with the social constitution of the self. When Bentham argues that these acts reduce long-term pleasure, he is implicitly acknowledging that preferences are not static inputs for the utility calculus but are endogenous variables shaped by habit, context, and social expectation. This moves his framework beyond a simple calculation of existing desires toward a proto-theory of adaptive preferences, where the individual's capacity for happiness is contingent upon the cultivation of specific dispositions. However, by retaining the vocabulary of "correction" and "offence" without a robust account of who determines which habits are deleterious, Bentham inadvertently reintroduces a normative standard external to the individual's own immediate experience of pleasure.

  This conceptual move exposes the impossibility of cleanly segregating the "self-regarding" from the "socially embedded." If the pain associated with a self-regarding injury arises partly from internalized social sanctions (what Bentham elsewhere calls the sanctions of conscience and popularity), then the injury is not truly self-regarding but is constituted by the very intersubjective recognition the liberal framework seeks to bracket out. The "correction" Bentham proposes is thus not a neutral optimization of future utility, but a regulatory intervention into the formation of the subject itself. This anticipates later critiques in feminist philosophy and institutional design which argue that the public/private divide is porous because the private sphere is where social norms are incubated and reproduced. By claiming jurisdiction over the moral education of private habits while denying jurisdiction over their legal punishment, Bentham's system struggles to reconcile the liberty of the agent with the utility-maximizing need to shape that agent's preferences. The residual normative weight you detect is therefore the symptom of a deeper problem: a quantitative calculus cannot fully account for practices whose meaning and value are derived from their position within a qualitative social order.

  Summary: Bentham's distinction between legal harm and self-regarding injury exposes a structural limit within aggregative hedonism, revealing that individual well-being cannot be coherently disentangled from the intersubjective norms that constitute the self and define the very experience of harm.
