answer: |-
  So, a grad student goes into their advisor's office and says, "Look, I knew running this high-voltage sequence would fry the spectrometer's pre-amp. I didn't care about the pre-amp. I just needed the data."

  The advisor says, "So you intentionally destroyed lab property."

  The student says, "Okay, but I also knew the surge would bypass the coffee maker's fuse and brew a perfect pot. I didn't care about the coffee. I just needed the data."

  The advisor says, "Right, but you didn't *intentionally* fix the coffee maker."

  The student says, "But the cognitive state is identical."

  The advisor says, "Sure. But only one of those side effects justifies a tuition surcharge. Now write a check for the spectrometer. And since you didn't intentionally fix the coffee, you're not allowed to use it."

  ***

  **Note on the Extension:**
  I'm stretching the original Knobe framing by shifting the domain from **moral praise/blame** (the CEO's relationship to the environment) to **institutional liability and access rights** (the student's relationship to lab equipment). The original effect relies on the valence of the side-effect influencing folk psychological attribution; here, I'm assuming that institutional blame functions like moral blame to trigger the "intentional" tag, while institutional benefit does not trigger the corresponding credit.

  I would drop this extension if empirical findings showed that **financial stakes moderate the asymmetry**. For example, if data showed that when an agent is personally liable for costs (rather than abstractly blamed), people revert to a symmetric, strict *mens rea* model (i.e., "knowing involvement" counts as intentionality for both harm and help regardless of valence), then the analogy breaks down because the institutional context would erase the very asymmetry the joke relies on.
