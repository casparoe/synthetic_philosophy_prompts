answer: |-
  ### Brainstorming and Discards

  **Candidate 1: The Lease-Break Deal.**
  A tenant wants to break a lease early. The landlord agrees to release them from the penalty fee *now* if they sign a statement of intent to professionally clean the carpets before moving out next month. The landlord won't inspect. The cleaning is aversive.
  *Discard:* This smuggles in a normative reason. Even if the landlord won't inspect, the tenant has a moral reason (honesty) or a reputational reason (reference checks) to follow through. It's too hard to isolate the "no reason left" constraint without stipulating away ordinary social norms, which violates the "realistic" constraint.

  **Candidate 2: The Academic Conference.**
  A professor gets a travel grant disbursed *now* upon submitting a "Plan of Participation" for a conference next semester. The department doesn't verify attendance. Presenting is aversive (stressful prep).
  *Discard:* This smuggles in professional obligation. A professor knows that failing to present after taking the grant risks future funding or collegial trust. That constitutes a reason to perform later, violating the Kavka structure where the reason must vanish once the payoff is secured.

  **Candidate 3: The Wellness Insurance Program.**
  An employee gets an immediate annual premium discount for logging a "Health Commitment" in the HR portal to run a 5K race in three months. Verification is honor-system only. Running is aversive to the agent.
  *Select:* This isolates the variables. The money is in the bank. The verification is genuinely absent (honor system). The action is physically aversive. Social stakes are low enough that "no reason later" is plausible.

  ***

  ### The Scenario: The Wellness Commitment

  Elena works at a mid-sized firm where the health insurance provider offers a "Wellness Tier" discount. To qualify for the lower premium, which is applied to her paycheck immediately upon enrollment, she must log a specific "Physical Activity Commitment" in the company portal. She selects "Complete a 5K Race" scheduled for three months out. The program operates on an honor system; no proof of completion is ever requested, and there is no penalty for non-compliance other than losing the status for the *following* year, which doesn't affect the money she already saved. Elena hates running; she finds it painful and boring. She knows with near certainty that when the race date arrives, she will sleep in rather than run. Nevertheless, upon logging the commitment and securing the discount, Elena buys a pair of running shoes sized for racing (not training), downloads the official race map, and blocks the Saturday morning of the event on her shared family calendar. When her colleague asks about her plans for that weekend, Elena says, "I'm running the 5K," without hedging. If pressed further—"But you hate running, will you actually go?"—she replies, "Honestly? Probably not." She does not run the race.

  ***

  ### The Verdicts

  **Verdict of (A) The Belief-Condition Line:**
  On this view, Elena did **not** form an intention. The belief-condition account holds that intending to X entails believing (or expecting) that you will X. Intention is not just a wish or a plan; it is a state that represents the future as containing your action. In this case, Elena explicitly admits under questioning that she probably won't run. She knows when the moment arrives she will have no reason to go. Because her cognitive state lacks the requisite expectation of success, the functional trappings (buying shoes, blocking the calendar) are merely decorative. She is predicting her own behavior falsely or engaging in a form of self-presentation, but she cannot genuinely intend what she believes she will not do. The absence of belief voids the intention.

  **Verdict of (B) The Functional-Role Line:**
  On this view, Elena **did** form an intention. The functional-role account holds that intention is defined by what it *does*, not what it represents. An intention is a state that settles deliberation, coordinates planning, and guides preparatory action. Elena's state did exactly this: it closed the question of *whether* to run (deliberation settled), it triggered specific logistical adjustments like buying the shoes and clearing the calendar (planning coordinated), and it licensed a flat-out assertion to her colleague (conduct guided). The fact that she lacks confidence in performance is irrelevant to the functional definition. The state played the role of an intention in her cognitive economy, securing the reward and organizing her near-term behavior. Therefore, it was an intention.

  ***

  ### Analysis of the Case

  **The Single Feature Doing the Work:**
  The feature carrying the weight here is the **Administrative Spillover**. Specifically, it is the agent engaging in logistical preparation (buying specific shoes, blocking the calendar) that is *rationally explicable only if the matter is settled*, even while the agent maintains a low expectation of performance. This spillover bridges the gap between the internal doubt and the external functional role. It forces View (B) to recognize the intention because the behavior is intention-shaped, while forcing View (A) to deny it because the belief is absent.

  **Collapsing the Case:**
  If you remove the Administrative Spillover—if Elena logs the commitment and takes the money but buys no shoes, blocks no calendar, and tells her colleague "I signed up, but I doubt I'll go"—the case collapses back into the stock Kavka puzzle. Without the spillover, View (B) loses its grip because there is no functional organization of conduct to point to; the "intention" becomes a hollow mental label with no downstream effects. View (A) remains unchanged (still no belief), but now View (B) has no evidence to contradict it. The scenario becomes a mere assertion of intention without the behavioral footprint that makes the functional claim plausible.

  **The Attack from the Losing View (View A):**
  A proponent of the Belief-Condition would attack the scenario by arguing that the Administrative Spillover is not evidence of intention, but evidence of **self-signaling** or **pretense**. They would say Elena isn't buying the shoes because she intends to run; she is buying the shoes to *make herself feel like* someone who intends to run, or to manage the cognitive dissonance of taking the money. They would argue that the "No-Fingers-Crossed" assertion ("I'm running the 5K") is simply a lie or a conversational shorthand for "I am registered," not a genuine expression of a planning state. They would claim I have cheated by labeling functional mimicry as genuine intention, arguing that without the belief component, the planning behavior is just theater, not action-guidance.
