  **S Tier: The move of treating the mere fact that there are more people as a reason that counts even from the one person's own perspective**
  This is the only option that grounds the weight of numbers in the *equality* of persons rather than the *sum* of utilities, which is the only way to let numbers matter without sliding into utilitarianism. It preserves the individualist standpoint by arguing that the single person cannot reasonably claim priority over others, making the aggregation a matter of fairness rather than maximization.

  **A Tier: The "strength of reasons" reply, on which the combined force of the many people's objections can outweigh the single person's**
  This is Scanlon's actual technical fix in his later work, but it walks a tightrope; if "combined force" is understood as simple summation, it collapses into utilitarianism, but if understood as strengthening the *generic* reason, it remains contractualist. It deserves high marks for functionality but loses the top spot because it requires constant philosophical vigilance to prevent it from becoming a utility calculus in disguise.

  **C Tier: The one-off vs. systematic distinction, where aggregation is only allowed to do work at the level of general principles, not in individual cases**
  This is a non-starter for your specific goal because it explicitly denies that numbers matter in one-off cases, pushing the aggregation to the legislative stage instead of the rescue case itself. It solves the theoretical tension by dodging the bullet, leaving you unable to justify saving the five in the specific scenario you care about.

  **C Tier: The outright anti-aggregation defense, which just says contractualism is supposed to be non-aggregative and that's a feature, not a bug**
  This is also a non-starter for your purposes because it refuses to solve the problem rather than solving it, accepting the counter-intuitive result that numbers shouldn't matter. While intellectually honest about the theory's roots, it fails the desideratum of making contractualism compatible with the intuition that saving more lives is better.
