answer: |-
  **Project Title:** The Computational Grounds of Moral Status: A Tripartite Framework for Implementation Independence

  **Principal Investigator:** [Your Name]
  **Department:** Computer Science
  **Duration:** 12 Months (0.5 FTE)
  **Requested Support:** Salary Support + Workshop Costs

  ### 1. Statement of the Problem

  The question "Which computations ground moral status?" is currently ill-posed. In debates regarding AI rights, whole-brain emulation, or biological moral standing, interlocutors talk past one another because they rely on divergent, often implicit, criteria for what counts as a *real* computation in a physical system. The standard debate oscillates between two unhelpful poles: functionalism, which risks granting moral status to trivial systems (e.g., Searle's "wall" that can be described as implementing a mind), and biological naturalism, which restricts moral status to carbon-based substrates without explaining *why* computation matters at all.

  This project posits that the stalemate arises because the "implementation problem" bundles three distinct ontological questions. Current literature treats computational implementation as a binary property (a system either implements a function or it does not). This proposal argues that moral status supervenes not on implementation *simpliciter*, but on a specific profile of computational realization. We cannot determine if a system matters morally until we determine *how* it computes.

  The research question is therefore narrowed from the open-ended "Which computations matter?" to a determinate classification problem: **Can we construct a decision procedure that distinguishes morally relevant computational structures from morally inert computational descriptions based on causal grain, intervention robustness, and dynamic activity?**

  The goal is not to solve the hard problem of consciousness in twelve months. The goal is to produce a rigorous conceptual framework that allows researchers to say, with justification, "This system computes X, but not in the way required for moral consideration," or vice versa.

  ### 2. Background and Conceptual Gap

  The literature currently lacks a unified taxonomy for computational realization in the context of ethics. Three standard moves dominate the field, all of which leave the core question open:

  1.  **Input-Output Functionalism:** This view holds that if a system produces the right behavior, the internal computation is irrelevant. This fails to distinguish between a system that *processes* pain signals and a lookup table that merely *retrieves* pain behaviors. It renders moral status vulnerable to the "triviality argument" (that any physical system can be described as implementing any computation).
  2.  **Substrate Chauvinism:** This view restricts moral status to biological hardware. While it avoids triviality, it abandons the computational premise entirely. If we are a CS department asking this question, we must assume substrate independence is possible; otherwise, the inquiry reduces to biology.
  3.  **Structural Isomorphism:** This view requires the internal causal structure to match the computational model. However, it lacks criteria for *granularity*. A system can be isomorphic at a high level of abstraction but disjoint at the level of causal mechanism.

  The gap lies in the lack of criteria for **causal autonomy**. We need to know when a computation is a property of the *system* versus a property of the *observer's description*. This project fills that gap by disentangling three conditions that are currently conflated: Grain, Robustness, and Activity.

  ### 3. The Tripartite Framework

  This project will develop and test a framework arguing that moral status requires computations that satisfy three necessary conditions.

  **I. Grain (Causal Autonomy)**
  *The Problem:* Any physical system can be described as implementing an infinite number of computations depending on how one maps physical states to logical states.
  *The Criterion:* The morally relevant computation must occur at the grain where the system's states are causes and effects in their own right, not at a grain supplied by a convenient re-description.
  *Operationalization:* We must identify the level of abstraction where the causal power is localized. If the "computation" only exists when we group disparate physical events via an external mapping, it lacks the requisite grain.

  **II. Robustness (Counterfactual Stability)**
  *The Problem:* Attributions of computation often rely on coincidental correlations that break under perturbation.
  *The Criterion:* An attribution of computation must survive interventions on the parts. If I swap a component and the "computation" quietly becomes a different one while the behavior stays the same, I have found a coincidence in my vocabulary, not the system's computation.
  *Operationalization:* We will apply causal intervention models (inspired by Pearl but applied conceptually) to test if the computational description holds across counterfactual modifications of the hardware.

  **III. Activity (Constitutive Dynamics)**
  *The Problem:* There is a difference between a system that *performs* a computation and a structure that merely *encodes* one.
  *The Criterion:* Moral status requires executed processes, not static encodings. A lookup table with every answer baked in, a frozen brain, or a rulebook does not satisfy this condition, even if the Input-Output mapping is identical to a thinking agent.
  *Operationalization:* We must distinguish between *indexing* a result and *deriving* a result through state transitions. This condition explicitly blocks the "lookup table" objection without smuggling biology back in as the hidden criterion.

  ### 4. Methodology and Work Plan

  This is a conceptual engineering project, not an empirical study. Empirical labs measure behavior; they do not adjudicate the ontological status of the processes generating that behavior. Handing this off to an empirical lab would result in data on *performance*, not *implementation*. The work requires philosophical analysis grounded in computer science theory.

  **Phase 1: Formalization (Months 1–3)**
  *   **Task:** Rigorously define "Grain," "Robustness," and "Activity" using formal automata theory and causal graph theory.
  *   **Deliverable:** A working paper defining the "Causal-Autonomy Metric."
  *   **Milestone:** Resolve the overlap between Grain and Robustness. (See Risk Assessment).

  **Phase 2: Case Study Sorting (Months 4–8)**
  *   **Task:** Apply the framework to five specific cases where current intuition fails.
      1.  *Lookup Table vs. Lookup Process:* Distinguishing static mapping from dynamic retrieval.
      2.  *Whole-Brain Emulation (WBE):* Does a neuron-for-neuron simulation satisfy Activity if the clock speed differs?
      3.  *Slime Mold Optimization:* Is the growth pattern a computation at the system's grain, or an observer's description of physics?
      4.  *Plant Damage Signals:* Do electrical signaling networks in plants satisfy Robustness?
      5.  *Large Language Models:* Do transformer attention heads constitute "concern-like" computations at the model's grain, or are they attributions by the user?
  *   **Deliverable:** A series of three technical memos classifying these cases.

  **Phase 3: Synthesis and Workshop (Months 9–12)**
  *   **Task:** Synthesize findings into a final framework. Host a one-day workshop with two ethicists and two systems engineers to stress-test the framework against edge cases.
  *   **Deliverable:** Final Grant Report and a manuscript submitted to a venue like *Philosophy & Technology* or *Minds and Machines*.
  *   **Milestone:** A "Diagnostic Checklist" for computational moral status.

  ### 5. Critical Assessment & Failure Modes

  Per the requirement for intellectual honesty, this section outlines where this research program is most vulnerable. If these risks materialize, the project must pivot or acknowledge failure.

  **Risk 1: The Collapse of Grain into Robustness**
  *Critique:* The distinction between "Grain" (causal autonomy) and "Robustness" (surviving intervention) may be illusory. If a state is a cause "in its own right," it should by definition be robust to intervention. If they collapse, the tripartite model reduces to a bipartite one, weakening the novelty of the proposal.
  *Mitigation:* In Months 1–2, I will attempt to construct a thought experiment where a system has the correct Grain but fails Robustness (e.g., a fragile crystal computer). If no such case exists, I will merge the criteria and reframe the contribution as a refinement of Causal Theory of Computation rather than a new tripartite model.

  **Risk 2: Activity as Biological Chauvinism in Disguise**
  *Critique:* The "Activity" condition risks smuggling in a bias for dynamic, time-dependent processes that look like biology. If I define "execution" too strictly, I may exclude valid silicon-based minds; too loosely, and I include lookup tables.
  *Mitigation:* I will define Activity strictly in terms of *state transition dependency*. If the current state depends on the *path* taken to reach it (hysteresis/history), it is Activity. If the output depends only on the current input index, it is Encoding. If this distinction cannot be formalized without referencing "time" in a way that biases against parallel processing, the condition fails.

  **Risk 3: Scope Creep and Determinacy**
  *Critique:* The question "Which computations ground moral status?" may simply be too large for a half-time researcher in one year. There is a risk of producing a vague philosophical taxonomy rather than a determinate decision procedure.
  *Mitigation:* The scope is limited to *classification*, not *justification*. I am not arguing *why* computation grounds morality (a meta-ethical question). I am arguing *which* computations fit the structural requirements, assuming computation is the ground. If I cannot produce a decision procedure, the deliverable will shift to a "Map of Conceptual Impediments," which is still a valuable negative result for the field.

  ### 6. Realistic Scope and Deliverables

  I am requesting support for 0.5 FTE for 12 months. This is insufficient for building new empirical models or surveying the entire philosophy of mind. Therefore, the scope is strictly bounded:

  1.  **No New Empirical Data:** I will not run experiments on LLMs or plants. I will analyze existing architectural documentation and biological literature.
  2.  **No Meta-Ethics:** I will not defend functionalism over physicalism. I will assume functionalism for the sake of the argument and test its internal consistency.
  3.  **Workshop:** The workshop will be small (10-15 participants), focused on critiquing the framework, not presenting new papers.

  **Final Deliverables:**
  1.  **The Framework Document:** A 20-page technical specification of the Grain/Robustness/Activity criteria.
  2.  **Case Study Analysis:** A comparative analysis of the five target systems using the framework.
  3.  **Workshop Proceedings:** A summary of objections and revisions generated by the interdisciplinary workshop.

  ### 7. Conclusion

  We are approaching an era where we must make policy decisions regarding AI and bio-hybrid systems. Continuing to rely on intuition pumps like the Chinese Room or the Turing Test is insufficient. These tools were designed to test intelligence, not moral status, and they conflate description with reality.

  This project offers a path out of the muddle. By separating the grain of the computation from the robustness of the attribution and the activity of the process, we can move from asking "Is it conscious?" to "Does it compute in the right way to count?" Even if the result is negative—showing that these distinctions cannot be cleanly drawn—that is a necessary clarification for the field. This proposal asks for the resources to do the conceptual groundwork that empirical labs cannot, ensuring that when we do build systems that might matter, we have the vocabulary to recognize them.
