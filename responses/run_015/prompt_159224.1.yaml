answer: |-
  **Project Title:** Temporal Indeterminacy and the Ontology of Experience: Beyond the Orwellian/Stalinesque Dilemma

  **Project Summary**
  This project aims to produce an 8,000-word paper resolving a specific stalemate in the philosophy of temporal experience. Using the Colour-Phi phenomenon as a case study, I will challenge the assumption that conscious experiences are punctate items subject to post-hoc or pre-conscious editing. Instead, I will argue for a model of *prospective vagueness*, wherein the content of an extended experience is genuinely indeterminate during its occurrence. The project will determine whether this distinction is metaphysically substantive or merely verificationist, utilising a sensorimotor constraint to rule out trivial 'internal revision' accounts.

  **Background and Problem**
  The Colour-Phi phenomenon presents two flashes of different colours at distinct locations. Subjects report a single object moving between them, changing colour mid-trajectory. Crucially, the colour change is reported before the second flash occurs. The standard debate, framed by Dennett and Kinsbourne, offers a false dilemma: is the experience doctored before consciousness (Stalinesque) or rewritten after (Orwellian)? Both options presuppose that an experience is a finished representational item with a determinate time of occurrence. This assumption renders the debate either empirically undecidable or metaphysically empty.

  Current literature treats the timing of 'fixation' as a hidden variable. My contention is that the variable is not hidden but non-existent. The experience is temporally extended, and its content is not fixed at a single instant. However, this raises a deeper problem: does saying content is fixed 'after the fact' differ meaningfully from saying it was 'indeterminate during the fact'?

  **Research Question**
  The initial intuition bundles three distinct questions:
  1.  **Empirical:** When does neural processing settle the representation?
  2.  **Epistemic:** Can the subject verify the content while it is occurring?
  3.  **Metaphysical:** Is the content of the experience itself indeterminate during the experience, or merely inaccessible?

  This project addresses **Question 3**. Questions 1 and 2 are constraints, not the target. If I answer only Question 1, the project becomes cognitive science; if only Question 2, it becomes verificationism. The philosophical contribution lies in establishing whether *phenomenal indeterminacy* is a coherent ontological category distinct from *epistemic uncertainty*. I will argue that the standard 'no-fact-of-the-matter' view conflates the two.

  **Methodology**
  This is a philosophical project because the dispute concerns the ontology of experience, not merely the chronometry of neural events. Pure conceptual analysis is insufficient because it risks detaching from the phenomenology; pure empirical investigation is insufficient because data underdetermines the metaphysical interpretation (the 'explanatory gap' in temporal binding).

  My method is *constrained conceptual modelling*. I will construct a model of temporal experience that accommodates the phenomenology of Phi without positing hidden 'editing' events. I will use empirical data (e.g., processing latencies) only to rule out models that require impossible neural speeds, not to select the winning model.

  **The Sensorimotor Lever (Oculomotor Tracking)**
  You asked whether using oculomotor tracking as a continuous response channel is a dead end. It is not, provided it is used correctly. If treated as a new experiment, it is vulnerable to the reply that eye movements are merely another 'draft' subject to revision. However, used as a *conceptual constraint*, it is decisive.

  If the apparent motion drives an eye movement *during* the trajectory, the retinal input changes dynamically. A 'Stalinesque' internal edit would need to predict the eye movement to doctor the retinal record correctly; an 'Orwellian' memory rewrite would need to falsify the proprioceptive record of the eye movement itself. This externalises the 'memory trace'. It forces the 'revision' hypothesis to become enormously costly, positing revisions across motor and proprioceptive systems, not just visual cortex. In the paper, I will use this not to propose new data collection, but to demonstrate that 'internal revision' theories violate parsimony when the agent is embedded in a sensorimotor loop. This blocks the retreat to 'it's all just internal editing'.

  **Possible Conclusions**
  1.  **Prospective Vagueness (Target):** The experience is genuinely indeterminate. The world-coupled process of experiencing fixes the content. This preserves the reality of the experience without requiring magic editing.
  2.  **Verificationist Collapse:** The distinction between indeterminate content and unrevisable memory is empty. (Failure condition, see below).
  3.  **Empirical Reduction:** The metaphysical question dissolves entirely into a question of processing latency. (Unlikely, given the sensorimotor constraint).

  **Risk and Failure Condition**
  The genuine risk is not that the project becomes empirical, but that **Retrospective Determination collapses into the 'No-Fact-of-the-Matter' view.** If I cannot articulate how an experience can be *real* yet *indeterminate* without simply saying 'we can't know what it was', I have merely restated the verificationist objection in new terminology. This would render the paper an elaborate footnote to the standard debate.

  **Month 2 Milestone:** To rule this out, by the end of Month 2 I must have a working definition of *phenomenal indeterminacy* that is distinct from *epistemic uncertainty*. I need to demonstrate a case where the indeterminacy has causal consequences for the ongoing experience (leveraging the sensorimotor point) that a 'fixed-but-unknown' model cannot explain without ad hoc assumptions. If I cannot draw this line by the first draft, the project has failed.

  **Timeline**
  *   **Month 1:** Map the logical space of the Orwellian/Stalinesque debate. Formalise the distinction between retrospective determination and prospective vagueness.
  *   **Month 2:** Develop the Sensorimotor Constraint argument. Draft the core section distinguishing ontological indeterminacy from epistemic limits. (Critical Milestone).
  *   **Month 3:** Full draft, refinement of the 'failure condition' argument, and polishing for submission.

  **Output**
  One standalone paper (8,000 words), suitable for submission to a journal such as *Mind* or *The Philosophical Review*, spun out of the thesis chapter but self-contained.
