answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Northwold Heritage Trust
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Merebank Visitor Centre: Interpretation Strategy & Panel Sign-off

  **Purpose**
  This memo outlines my recommendations for the Merebank interpretation panels ahead of Tuesday's board meeting. We have three weeks to finalise text for the designer. My aim is to balance archaeological rigour with the genuine community interest in the site's spiritual significance, ensuring we remain credible without closing down public imagination.

  **1. Panel Text: Pit 1 and Pit 2**
  We must distinguish between the two pits. Conflating them undermines the specific evidence of Pit 1. I recommend we replace the current definitive statement ("offerings to the gods") with text that highlights the *deliberate* nature of the deposit while acknowledging the interpretive debate. This validates the "temple" reading as a valid inference of intent, without asserting it as proven fact.

  *Recommended Draft Text:*
  > **What was buried here?**
  > Thirty metres apart, two pits tell different stories. Pit 2 contained broken tools and animal bones mixed with household waste—likely a rubbish dump. But Pit 1 was different. Here, iron tools and animal bones were placed in careful layers. Many tools were bent or broken on purpose; some were miniature versions, too small to ever be used.
  >
  > Why treat these objects differently? Some archaeologists argue this was a sacred deposit, a gift to powers or spirits that could not be retrieved. Others suggest it was a way of taking valuable tools out of circulation for social or political reasons. We cannot know for certain what the people of Merebank believed. But the care taken in Pit 1 shows that for them, these objects—and this place—held a power beyond the everyday.

  **2. The Reconstruction Drawing**
  **Recommendation:** **Do not commission the shrine with the carved figure.**
  **Replacement:** Commission an illustration of the *excavated features* (the pits and post-holes) overlaid on the landscape, or an "exploded view" of the objects within Pit 1.

  *Reasoning:* While the "temple" interpretation is emotionally resonant and culturally significant to local groups, drawing a carved figure where no iconography exists crosses from interpretation into invention. It creates a "fact" that future evidence could contradict, damaging our long-term credibility. However, to honour the "temple" reading, the landscape illustration should emphasise the site's relationship with the river and the deliberate spacing of the pits, allowing visitors to feel the "sacred geometry" without us fabricating a statue.

  **3. Policy on Confidence Ratings**
  **Recommendation:** **Adopt a standing policy of "Interpretive Certainty Indicators" for future sites.**
  This is not merely hedging; it is a safeguard for public trust. We should categorise claims as *Confirmed* (evidence-based), *Probable* (strong inference), or *Possible* (speculative).

  *Reasoning:* This addresses the Board's concern about the "burden of proof." It allows us to present the "sacred" interpretation as *Possible* or *Probable* rather than *Confirmed*. It invites the visitor into the process of archaeology rather than lecturing them. It protects us from accusations of bias (either secular or religious) by making our evidential basis transparent.

  **4. Implementation Timeline (3-Week Window)**
  *   **Tuesday (Board Meeting):** Agree on the principle of "Interpretive Honesty" and the distinction between Pit 1 and Pit 2.
  *   **Week 1 (Wed–Fri):** Editorial team revises panel text based on the draft above; brief illustrator on new specification (features/objects only, no figures).
  *   **Week 2 (Mon–Fri):** Circulate revised text to key stakeholders (Finds Specialist, Community Engagement Officer, Local Heathen Group rep) for a "sensitivity check" to ensure the nuance lands correctly.
  *   **Week 3 (Mon–Tue):** Final Board sign-off via email.
  *   **Week 3 (Fri):** Text and brief to designer.

  **Summary**
  This approach respects the Finds Specialist's demand for evidence, the Community Officer's need for engagement, and the Board's desire to keep the spiritual dimension open. It treats the "temple" reading seriously as an interpretation of *intent*, without compromising our duty to accuracy regarding *facts*.

  I look forward to discussing this on Tuesday.
