      *   **Context:**
          *   Site: Merebank (dug 2019-21), gravel terrace, river.
          *   Features: Rectangular timber building, four-post structure, two pits (30m apart).
          *   Pit 1: 34 iron objects (axes, sickles, tools), cattle/pig bone, layered, objects bent/broken, 3 miniatures, rest show use-wear. No coins/import/human bone/inscriptions/images. Radiocarbon broad (Late Iron Age/Early Roman). Tool types span ~2 centuries (accumulated deposit?).
          *   Pit 2: Similar objects but jumbled, butchery waste, broken quern, no bending/layering.
          *   Conflict: Finds Specialist (anti-"ritual" label, deflationary) vs. Community Engagement Officer (local heathen group calling it a temple, school programme built around it, "we don't know" isn't neutral) vs. Board Member 1 (burden of proof on deflationary reading, don't strip religious dimension) vs. Board Member 2 (belief is hard to read, maybe don't try).
          *   Current Draft: Says "offerings to the gods," includes reconstruction of thatched shrine with carved figure.
      *   **Specific Outputs Needed:**
          1.  Wording for the panel about Pit 1 & Pit 2 (visitor-facing).
          2.  Decision on the shrine reconstruction (commission or kill? If kill, what replaces it?).
          3.  Policy recommendation on confidence ratings for future sites (safeguard or hedging?).
          4.  Timeline (3-week deadline).
          5.  Tone: Take the "temple" reading seriously (strongest version), not dismissive.

  2.  **Determine the Stance/Recommendation:**
      *   *The Problem:* The current draft is too definitive ("offerings to the gods," "shrine with carved figure") given the evidence (no images, no inscriptions, broad dates, mundane parallels). However, the "it's just rubbish" angle ignores the deliberate bending/layering/miniatures in Pit 1.
      *   *The Balance:* We need to acknowledge the *possibility* of ritual without asserting it as fact. We need to respect the community/heathen connection without fabricating archaeology.
      *   *Pit 1 vs. Pit 2:* Pit 1 looks special (bent, layered, miniatures). Pit 2 looks like middens/rubbish. Conflating them is bad practice.
      *   *Reconstruction:* A shrine with a *carved figure* is pure fiction (no images found). A shrine building is plausible but speculative. Better to show what *was* found or a landscape view.
      *   *Policy:* Confidence ratings are good practice (transparency) but need to be implemented carefully so they don't just look like "we guess."
      *   *Recommendation:* Revise text to reflect ambiguity but highlight the *deliberate* nature of Pit 1. Kill the carved figure reconstruction. Adopt confidence ratings.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (sign-off for Merebank panels) and the urgency (3 weeks).
      *   **Section 1: Panel Text (Pit 1 & 2):**
          *   Need to distinguish the pits. Pit 1 is the "special" one. Pit 2 is likely domestic waste.
          *   Avoid "gods" (too specific). Use "deposits," "deliberate," "significance."
          *   Acknowledge the debate.
          *   *Drafting thought:* "Pit 1 contained tools placed carefully..." vs "Pit 2 looked like a rubbish pit."
          *   *Refining for the "Temple" advocates:* Acknowledge that for the people then, this *might* have been sacred, even if we can't prove it.
      *   **Section 2: The Reconstruction:**
          *   The carved figure is indefensible (no iconography found). It crosses the line from interpretation to invention.
          *   Keep the building if it helps visualize the space, but strip the religious iconography. Or better, show the *objects* themselves.
          *   *Decision:* Kill the carved figure. Replace with an illustration of the *objects* or a landscape view showing the relationship between the pits and the river.
      *   **Section 3: Policy on Confidence Ratings:**
          *   It's a safeguard. It builds trust. It prevents future embarrassment.
          *   Recommend adopting it, but keep it simple (e.g., "We know," "We think," "We guess").
      *   **Section 4: Timeline:**
