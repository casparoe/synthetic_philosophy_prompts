          3.  Specify *exactly* what James's three conditions (live, forced, momentous) are meant to filter.
      *   **Constraints:** Assign a letter/numerical grade. Provide point-by-point comments. No bibliographies/citations/reading requests. Focus on reasoning, conflations, misattributions, and inferential steps.
