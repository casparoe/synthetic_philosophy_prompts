      *   *Self-Correction on Conflict 2:* The "Country Hypothetical" exposes a weakness in (7). If collective treatment stops, (7) says the kind vanishes. But (2) and (6) imply the *effects* linger. This suggests Race is *materially* embedded, not just conceptually constituted. (7) ignores the material residue.

  6.  **Final Polish:** Check against the "no reading list" constraint. Ensure the tone is supportive but rigorous. (The user is smart, don't dumb it down).

