          *   Hypothetical: If race ascription stops but disparities remain, does race exist?
          *   Flatmate's objection: Is (3) (gender self-ID) in conflict with (1) (race construction), specifically regarding racial self-ID?
      *   **Request:**
          *   Go through the list.
          *   Identify actual conflicts (ordered by severity).
