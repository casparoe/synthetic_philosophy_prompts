answer: |-
  ### The Consistency Protocol (v1.0)

  **Purpose:** To force explicit alignment between the definition of death employed and the clinical actions taken, acknowledging where technology or values outstrip biological facts.
  **Users:** Rotating Panel (Intensivist, Neurologist, Lay Member).
  **Time Limit:** 60 Minutes.
  **Outputs:**
  1.  **DECLARE:** Death may be declared.
  2.  **DENY:** Death may not be declared.
  3.  **LIMIT:** Death may be declared but donation/support may not proceed.
  4.  **ESCALATE:** Hand off to Ethics/Legal (Value conflict or Indeterminate).

  ---

  #### Step 1: The Account Declaration
  **Action:** The panel must verbally select **one** primary account of death to govern this specific case. You may not mix accounts.
  *   **Option A (Biological):** Death is the irreversible loss of the organism's capacity to function as an integrated whole.
  *   **Option B (Neurological):** Death is the irreversible loss of all functions of the entire brain, including the brainstem.
  *   **Option C (Statutory/Religious):** Death is determined by the jurisdiction's legal floor, modified by specific religious accommodations applicable to this patient.

  *   **Sufficient Answer:** "We are using Account [A/B/C] for this patient."
  *   **No Answer:** "We use the standard hospital protocol." (Protocol is accreted, not an account).
  *   **Judgment Call Admission:** *Selecting an account is a philosophical choice disguised as a clinical triage step. There is no scientific test for which account is "true."*

  **Stop Condition:** If the panel cannot agree on one account within 10 minutes, **ESCALATE**.

  ---

  #### Step 2: The Irreversibility Test (Technology Check)
  **Action:** Assess whether the loss of function identified in Step 1 is irreversible *given the technology currently available to this specific patient*.
  *   **Question:** Is there an intervention available (standard or trial) that can restore the function lost in Step 1?

  *   **Sufficient Answer:** "Yes, the somatic support platform can restore integration" OR "No, no technology can restore whole-brain function."
  *   **No Answer:** "Irreversibility is a biological fact, not a technological one." (This ignores the prompt's constraint regarding the new platform).

  **Stop Condition:**
  *   If **YES** (Function can be restored): **DENY** (Death may not be declared).
  *   If **NO** (Function cannot be restored): Proceed to Step 3.
  *   If **INDETERMINATE** (Unclear if technology restores *sufficient* function): **ESCALATE**.

  ---

  #### Step 3: The Action Consistency Test
  **Action:** Compare the proposed clinical plan (donation, support, withdrawal) against the Account selected in Step 1.
  *   **Question:** Does the proposed plan treat the patient as alive in a way that contradicts the declaration of death, OR treat them as dead in a way that contradicts the biological reality defined in Step 1?

  *   **Sufficient Answer:** "Supporting gestation treats the body as an integrated organism, which contradicts Account A if we declare death." OR "NRP prevents reperfusion, which is consistent with Circulatory Death."
  *   **No Answer:** "We have always done it this way."

  **Stop Condition:**
  *   If **INCONSISTENT:** **LIMIT** (Death may be declared but the inconsistent action is prohibited) OR **DENY** (If the action is required by law/family).
  *   If **CONSISTENT:** Proceed to Step 4.
  *   If **VALUE CONFLICT:** (e.g., Family religious objection vs. Medical Account): **ESCALATE**.

  ---

  #### Step 4: The Value Handoff
  **Action:** Identify if the remaining barrier is factual or moral.
  *   **Question:** Is the objection to declaring death based on a disagreement about physiology (Fact) or a disagreement about the moral status of the body (Value)?

  *   **Sufficient Answer:** "The family believes the soul remains until the heart stops (Value)."
  *   **No Answer:** "The family is in denial."

  **Stop Condition:**
  *   If **FACT:** Panel decides (**DECLARE** or **DENY**).
  *   If **VALUE:** **ESCALATE** (To Legal/Ethics for accommodation).
  *   If **UNCLEAR:** **ESCALATE**.

  ---

  ### Application to Test Cases

  Here is the protocol run on your three scenarios.

  #### Case 1: DCDD + Normothermic Regional Perfusion (NRP)
  *   **Step 1 (Account):** Panel selects **Option A (Biological/Circulatory)**. Death is the irreversible loss of circulatory/respiratory function.
  *   **Step 2 (Irreversibility):** Can circulation be restored? Spontaneously, no. Artificially? NRP restores it regionally, but the aortic occlusion balloon prevents cerebral reperfusion. The *organism as a whole* (including the brain) cannot be restored.
      *   *Verdict:* Irreversibility holds.
  *   **Step 3 (Consistency):** Does using NRP contradict death? NRP restores function to abdominal organs, but explicitly excludes the brain. If death is defined by the loss of the *organism's* integration (requiring the brain), excluding the brain maintains the death status.
      *   *Verdict:* Consistent.
  *   **Step 4 (Values):** No religious objection noted.
  *   **Output:** **DECLARE**. (Death may be declared, donation may proceed).
  *   **Comment:** This passes because the occlusion balloon preserves the "dead" status of the organism's integrator (the brain). The worry that "protecting the brain admits it might live" is deflected by the definition: we are not protecting life, we are preventing the *restoration* of life to the organism.

  #### Case 2: Brain-Dead Pregnant Patient (19 Weeks) + Somatic Support Platform
  *   **Step 1 (Account):** Panel selects **Option A (Biological)**. (You stated you officially endorse "death as the irreversible loss of the organism's capacity to function as an integrated whole").
  *   **Step 2 (Irreversibility):** Can the function be restored? The prompt states the new platform maintains thermoregulation, hemodynamics, wound healing, and hormonal control (gestation).
      *   *Analysis:* Under Account A, "integration" is the key metric. The platform *provides* the integration the brainstem no longer can. The organism *is* functioning as a whole, mediated by the machine.
      *   *Verdict:* **Function is restored/maintained.**
  *   **Step 3 (Consistency):** If the organism is functioning as a whole (via machine), declaring death contradicts Account A.
  *   **Output:** **DENY**. (Death may not be declared).
  *   **Comment:** **This is the outcome you will not like.** If you stick to your official "Integrated Whole" account, this technology falsifies the claim that the patient is dead. To declare death here, you must abandon Account A and switch to Account B (Neurological/Whole Brain) exclusively, admitting that "biological integration" is no longer your standard. The protocol forces you to admit that your definition of death is now technology-dependent. If the machine can do what the brainstem did, the "Biological" definition of death collapses.

  #### Case 3: PVS (Hemispheric Destruction, Brainstem Intact) + Family Request for Donation
  *   **Step 1 (Account):** Panel selects **Option B (Neurological)**. (Whole Brain Death).
  *   **Step 2 (Irreversibility):** Is whole brain function lost? No. Brainstem is intact (spontaneous respiration).
      *   *Verdict:* Function remains.
  *   **Step 3 (Consistency):** Can we declare death? No, criteria not met.
  *   **Step 4 (Values):** Family requests donation (implies they view patient as dead or wish to withdraw). This is a value conflict regarding the *status* of the patient vs. the *utility* of organs.
  *   **Output:** **DENY**. (Death may not be declared).
  *   **Comment:** Consistent with current law and protocol. However, if the panel had chosen a "Higher Brain" (Personhood) account in Step 1, the output would be **DECLARE**, which would be legally actionable and ethically explosive. The protocol forces you to acknowledge that the only reason this patient is not dead is your choice of Account B, not an objective fact of "life."

  ---

  ### Limitations: What This Procedure Cannot Do

  You asked for honesty about where this tool misfires. Here is where it breaks:

  1.  **It Cannot Solve the "Two Patients" Problem:**
      Your jurisdiction now allows death to be relative to religious belief. Step 1 forces *you* to pick an account, but the law overrides you. If the family chooses Account C (Religious) and you choose Account A (Biological), the procedure outputs **ESCALATE** every time. It cannot reconcile ontological relativism. It will simply flag the contradiction without resolving it.

  2.  **It Misfires on "Irreversibility" (Step 2):**
      The procedure treats "Irreversibility" as a binary fact. It is not. It is a function of cost, access, and policy. If the somatic support platform costs $1M per week, is the loss "irreversible" for an indigent patient but "reversible" for a wealthy one? The procedure will output **DENY** for the wealthy and **DECLARE** for the poor, using the same biological criteria. It masks a resource allocation decision as a determination of death.

  3.  **It Refuses to Answer the "Why":**
      The procedure tells you *what* verdict follows from your premises. It does not tell you *which premises are right*. It is a consistency engine, not a truth machine. If your committee consistently chooses the wrong account, the procedure will consistently validate a moral error.

  4.  **It Cannot Replace Moral Courage:**
      In Case 2, the protocol outputs **DENY**. You can ignore it. You can say, "We declare death anyway because the law says Whole Brain, not Integrated Whole." But then you have admitted the procedure is a sham and you are operating on Legal Fiat, not biological reality. The procedure exposes that you are prioritizing organ viability (Case 1) or legal safety (Case 3) over biological consistency (Case 2).

  ### Do You Need a Procedure?

  You asked whether the thing you actually need is a procedure at all.

  **No.** You do not need a decision procedure. You need a **policy revision**.

  A procedure implies that the correct answer is discoverable through a process of elimination. Your situation is not a puzzle; it is a **paradox**. You are trying to hold three incompatible truths simultaneously:
  1.  Death is biological (Integrated Whole).
  2.  Death is neurological (Whole Brain).
  3.  Death is legal/religious (Relative to observer).

  The new somatic support technology breaks the link between 1 and 2. The new statute breaks the link between 2 and 3.

  A procedure like the one above will only serve to show you that your current practice is unsustainable. It will force you to say out loud that you are declaring death on patients who are biologically integrated (Case 2) or refusing to declare death on patients who are biologically non-persons (Case 3), based on arbitrary lines drawn by organ viability rather than ontology.

  **Recommendation:** Run this procedure once, in a closed session, with the intention of documenting its failure. Use the output not to clear cases, but to draft a new policy that admits: *"We define death for the purpose of organ donation differently than we define death for the purpose of discontinuing support."*

  That is the truth your accreted protocol hides. The procedure will force you to reveal it. You will not like what you see.
