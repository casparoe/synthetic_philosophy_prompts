  2. Proponents correctly identify ergodicity problems but assume frictionless reinvestment; opponents rightly note logarithmic utility equivalence but overlook structural constraints. Both leave undetermined whether the equivalence holds when agents face lumpy stakes or correlated outcomes, treating market structure as neutral rather than constitutive of the rationality criterion itself.

  3. I will construct formal models of restricted betting environments to derive analytical conditions under which the growth-rate criterion diverges from expected utility prescriptions. This exceeds mere simulation by offering generalisable proofs, and avoids verbal equivocation by specifying exactly which structural parameters alter the normative verdict rather than dismissing the dispute as semantic.

  4. Success entails a theorem specifying the boundary conditions where scalability restrictions invalidate the Kelly criterion's normative force. Failure would consist in finding that the equivalence holds robustly across all restricted environments, implying the scalability assumption is inessential, or that the deviations are too chaotic to admit any general philosophical conclusion about rational choice.

  5. Eighteen months suffices for modelling simple constraints, but not complex correlations. My framing is likely wrong if scalability proves merely a parameter within utility functions rather than a structural precondition; if log utility can simply be recalibrated to fit restricted stakes, the question closes, and the project collapses into trivial utility specification.
