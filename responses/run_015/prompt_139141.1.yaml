      *   *User's Hypothesis:* Not lazy. It's the correct structural diagnosis. To verify: Analyze the *citations* each side uses. Side A cites Lewontin/Block. Side B cites Plomin/Behavioral Gen.

      *   *Friend's Proposal:* It's "Policy Heritability." It's useful but distinct. It doesn't solve the fight; it creates a third lane.

