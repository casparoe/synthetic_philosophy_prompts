answer: |-
  This is a classic case of **incommensurate teleologies**. You are correct that they agree on the math and the canonical examples. The stalemate persists because they are treating the heritability coefficient ($h^2$) as a tool for two fundamentally different projects, and each side believes the other's project is either scientifically invalid or socially dangerous.

  Here is the diagnosis, tested against your stipulations and hypotheses.

  ### 1. The Diagnosis: Etiology vs. Malleability (with Divergent Priors)

  Your hypothesis that they are answering **two separate questions** is not lazy; it is the correct structural diagnosis. However, it is incomplete without adding **divergent empirical priors**.

  *   **Side A is asking a Policy/Malleability Question:** "Given this number, what is the potential for mean-shift interventions, and what is the risk of reification?" They view $h^2$ as a **normative signal**. To them, publishing a high $h^2$ without aggressive hedging is a speech act that reinforces status quo inequalities.
  *   **Side B is asking an Etiological/Heuristic Question:** "Given this number, where does the variance come from, and where should we allocate research capital?" They view $h^2$ as a **descriptive map**. To them, suppressing or over-hedging the number obscures biological reality and hampers mechanism discovery.

  **Why they don't move:**
  They agree on the *definition* of $h^2$, but they disagree on the **stability of the causal structure** underlying it.
  *   **Side A's Argument Bits:** "Licenses nothing... across populations," "causes more harm than insight." These point to a prior that social environments are *heterogeneous and mutable*. They believe the specific environmental variance ($V_E$) currently suppressed in the estimate is actually the lever for future justice.
  *   **Side B's Argument Bits:** "Predicts... fixes will be hard," "where to look for causal pathways." These point to a prior that biological constraints are *stable and limiting*. They believe the additive genetic variance ($V_A$) represents a hard boundary on the efficacy of generic environmental interventions.

  The stalemate is not verbal. It is a **clash of priors regarding the discoverability of "PKU-style" switches for complex social traits.** Side A acts as if such switches are likely (or that we should act as if they are to avoid fatalism). Side B acts as if they are unlikely for highly polygenic traits (and that acting otherwise is anti-scientific).

  ### 2. The Stipulation Test

  **Stipulation:** *Tomorrow we get clean estimates showing heritability is basically constant across every environment anyone cares about and interaction effects (GxE) are negligible.*

  **Who concedes?**
  *   **Side A concedes significant ground.** Their primary technical weapon is that $h^2$ is population-specific and environmentally fragile. If $h^2$ is constant across all relevant environments, the claim that "this number is just a bookkeeping fact for *this* specific time and place" loses its empirical bite. They can no longer argue the number is unstable noise.
  *   **Side B concedes nothing on interpretation,** but gains credibility. They already argued $h^2$ is robust enough to guide research. This confirms their prior.

  **Does the fight end?**
  **No.** It shifts.
  Even with constant $h^2$, Side A retains the **PKU Defense**. They can argue: "Okay, $h^2$ is stable at 0.6. But that 0.6 is in the *current* regime of environments. If we discover a new environmental technology (a new 'diet'), $V_E$ changes, and $h^2$ drops. Your constant estimate describes the *past*, not the *potential*."
  Side B will counter: "If GxE is negligible, new environments won't change the ranking or the variance much."

  **Result:** The debate moves from "Is the number stable?" to "Is the *mechanism* discoverable?" Side A is forced to argue from **possibility** (we might find a switch), while Side B argues from **probability** (polygenicity suggests no single switch). Side A is on weaker empirical ground but stronger normative ground.

  ### 3. What Counts as Progress?

  Expecting a full resolution is a mistake because the disagreement is partly normative (how much risk of misuse is acceptable?). However, **conceptual decoupling** would reduce the heat.

  **Progress looks like:**
  1.  **Distinguishing $h^2$ from $1 - R^2_{policy}$.** Explicitly acknowledging that high heritability predicts the difficulty of *random* environmental interventions, but not *targeted* ones.
  2.  **Changing the Output.** Instead of debating the text of the paper, the field could require a standard "Intervention Sensitivity" paragraph that is distinct from the "Heritability Estimate" paragraph. One reports the variance decomposition (Side B's win); the other reports known GxE and potential mean-shift mechanisms (Side A's win).
  3.  **Specific Empirical Result:** Finding a social trait with high $h^2$ that *was* successfully shifted by a scalable environmental intervention (beyond the trivial). If someone finds a "height-like" trait (high $h^2$) that moved like "height did in the 20th century" (large mean shift), Side A wins. If they find a trait where high $h^2$ consistently predicts intervention failure across 50 years, Side B wins.

  ### 4. Evaluating Your Hypothesis

  **Is it the lazy version?**
  **No.** It is the most sophisticated reading. Identifying that they are answering "Causal Attribution" vs. "Decision Under Uncertainty" cuts to the bone.
  **How to verify it:**
  Look at the **modal verbs** in their arguments.
  *   If Side A says: "We *must* consider," "This *could* imply," "It *should* not be read as..." $\rightarrow$ They are in the **Normative/Decision** frame.
  *   If Side B says: "This *indicates*," "This *suggests*," "It *predicts*..." $\rightarrow$ They are in the **Causal/Etiological** frame.
  If you transcribe the threads and code for these, you will likely find near-zero overlap in modal usage. They are speaking different speech acts.

  ### 5. Evaluating the Friend's Proposal ("Menu-Relative Heritability")

  **Does it help?**
  It helps **Side A** immensely but effectively **abolishes the statistic Side B wants.**

  *   **The Reframe:** "Fix feasible interventions, equalize access, ask remaining variance."
  *   **The Problem:** This is no longer heritability ($V_G / V_P$). This is **Residual Inequality under Current Policy**.
  *   **Why Side B will reject it:** It makes the biological signal time-dependent and policy-dependent. If we ban private tutoring, "heritability" of test scores might drop. If we allow it, it rises. Side B wants a number that reflects the *organism's* constraints, not the *state's* current budget.
  *   **Why Side A will love it:** It directly answers the "What do we do?" question. It makes the statistic honest about its normative constraints.

  **Verdict:** It doesn't resolve the fight; it **splits the concept.** You would end up with **$h^2_{bio}$** (Side B's number, stable, etiological) and **$h^2_{policy}$** (Side A's number, mutable, prescriptive).
  This is actually a viable path to peace, provided both sides agree to stop using one number to do the other's job. If Side B agrees not to use $h^2_{bio}$ to argue against redistribution, and Side A agrees not to use $h^2_{policy}$ to argue against genetic research, the stalemate breaks.

  ### Summary for Moderation

  Next time the thread blows up, try this intervention:

  > "It seems we have agreement on the math ($V_A/V_P$) but disagreement on the **inference horizon**. Side A is treating this estimate as a claim about the *limits of future policy* (Malleability). Side B is treating it as a claim about the *structure of current variance* (Etiology).
  >
  > If we assume the stipulation that GxE is negligible, Side A's worry about instability is reduced, but the worry about fatalism remains. Side B's claim to scientific utility is strengthened, but the claim to policy relevance remains unproven.
  >
  > Can we agree that this number describes the **current difficulty of random intervention** (Side B) but does not describe the **limit of targeted intervention** (Side A)? If we stipulate that distinction, does the objection to publishing remain?"

  This forces them to fight over the *implication* of the number, rather than pretending they are fighting over the *definition* of the number. It exposes the normative core of Side A's objection and the empirical core of Side B's defense.
