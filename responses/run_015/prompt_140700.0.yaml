answer: |-
  This is a sharp methodological critique. You are correctly identifying a category error between the *mechanism* you observe (reactive, constitutive) and the *model* your interlocutor imposed (self-reinforcing, exogenous). The "adaptive landscape" (Wright/Levinthal) is the standard visualization for **increasing-returns path dependence** (Pierson/Arthur), but it fails to capture **reactive sequences** (Mahoney) or **constitutive institutionalism** (Hay/Thelen).

  Here is the audit of the analogy, followed by an evaluation of your conclusion and a proposed alternative.

  ### 1. The Correspondence Table (The Audit)

  | Landscape Element | Standard Mapping | Your Case Mapping | What Your Case *Lacks* |
  | :--- | :--- | :--- | :--- |
  | **The Ball** | The policy/system state. | The budgeting procedure (in practice). | **Passivity.** The ball does not choose to roll; your officials choose to re-enact. |
  | **The Terrain** | Exogenous structural constraints (costs, tech, geography). | The organizational/fiscal environment. | **Static Nature.** In your case, the terrain is *endogenous*; each step reconfigures the constraints for the next. |
  | **The Nudge** | Critical Juncture / Contingent Event. | The Fiscal Crisis. | **Exogeneity.** The crisis may be external, but the *interpretation* of the crisis is internal/constitutive. |
  | **Gravity** | The force toward equilibrium (efficiency, cost-minimization). | The pressure to maintain stability/avoid uncertainty. | **Natural Necessity.** Gravity is physical law; your "force" is intersubjective expectation (normative). |
  | **The Basin** | The Equilibrium / Attractor. | The current budgeting regime. | **Exclusivity.** Basins imply *the* solution; your case allows for *a* solution among many coordinated ones. |
  | **Friction** | Switching costs / Transaction costs. | Political capital / Learning costs. | **Quantifiability.** Friction is constant in the model; in your case, it fluctuates based on political will. |

  ### 2. Addressing Specific Concern 1: Reactive Sequence vs. Static Terrain

  **The Problem:** The landscape model assumes the topology exists *prior* to the ball's movement. The ball reveals the terrain; it does not create it.
  **Your Case:** You describe a **reactive sequence** (Mahoney 2000). Event A (Crisis adoption) provokes Reaction B (Resistance/Adaptation), which alters the context for Event C. The "terrain" at $t_2$ is a product of the "ball's" movement at $t_1$.
  **The Verdict:** The landscape picture **cannot represent this.** It fundamentally mis-specifies the ontology of your mechanism. In your case, the ball is a bulldozer, not a marble. It carves the groove as it moves. Using the landscape model obscures the *political work* required at each step to reconfigure the setting. It makes the outcome look like a discovery of a pre-existing slot, rather than the construction of a new room.

  ### 3. Addressing Specific Concern 2: Agency/Constitution vs. Gravity

  **The Problem:** "Gravity" implies an external, inexorable force independent of the ball's belief. If the ball stops believing in gravity, it still falls.
  **Your Case:** "Lock-in" is **constitutive**. The procedure persists because officials *expect* it to persist and act accordingly (a Schelling point or self-fulfilling prophecy). If they collectively coordinated to expect a different procedure, the "gravity" would vanish.
  **The Verdict:** Mapping "Gravity" to "Expectations" imports a **naturalistic fallacy**. It suggests the constraint is harder than it is. It masks the possibility of *punctuated equilibrium* via coordinated shift. In the landscape model, escape requires energy (perturbation). In your case, escape requires *coordination* (communication/agreement). These are different causal powers. The landscape model hides the fragility of normative lock-in behind the metaphor of physical lock-in.

  ### 4. Evaluating the Conclusion: Strength and Falsifiability

  **Does it support the strong conclusion ("No functional equivalent")?**
  **No.** The landscape model supports the conclusion that *an* equilibrium was likely once the nudge occurred (the ball must settle *somewhere*). It does not prove that *this specific basin* (your specific budgeting procedure) was the only possibility, unless you argue the terrain is infinitely rugged with only one hole. Usually, landscape models imply **equifinality** (many basins) or **functional equivalence** (any basin solves the gravity problem). To argue "no functional equivalent," you must show that the *specific contours* of the basin were carved by the contingent nudge, not just that the ball settled. The landscape model tends to wash out the specific shape of the institution in favor of the fact of settlement.

  **Is "Locked In" falsifiable?**
  **Not without a scale of perturbation.** In physics, lock-in is defined by the energy required to escape the basin relative to ambient energy. In sociology, "locked in" is often used rhetorically to mean "has lasted a long time."
  *   **Falsification Test:** If a new fiscal crisis (major perturbation) occurs and the procedure is *discarded*, it was not locked in; it was merely stable. If the procedure is *modified but retained*, it is evolving. The landscape model fails here because it doesn't specify the height of the basin walls. Without specifying *what kind of shock* would dislodge the practice, "path dependence" is unfalsifiable tautology (it persisted because it was locked in; we know it was locked in because it persisted).

  ### 5. A Better Analogy: The "Precedent" (Common Law) Model

  The landscape model is physical/deterministic. Your case is normative/recursive. I propose you replace the "Ball on a Landscape" with **"The Chain of Precedents."**

  **Why this fits better:**
  1.  **Reactive Sequence:** In Common Law, a ruling (Step 1) sets a precedent. The next case (Step 2) is judged *against* that precedent, but the ruling in Step 2 reconfigures the legal landscape for Step 3. The "terrain" (law) changes with every "ball" (case) movement.
  2.  **Constitutive Lock-in:** Precedent (*stare decisis*) is not gravity. It is a **normative expectation**. Judges *could* overturn precedent, but they coordinate to maintain stability. Lock-in is a choice to be bound by the past, not a physical inability to move.
  3.  **Contingency:** The first ruling (your fiscal crisis) was contingent. A different judge (agency head) could have ruled differently. But once ruled, it constrains the specific logic of all future rulings.
  4.  **Specific Arrangement:** This supports your strong conclusion. You can argue that *this specific* legal doctrine (budgeting rule) emerged, not just *some* doctrine, because the chain of reasoning started at a specific contingent point. A functional equivalent (a different legal doctrine) is possible in theory, but inaccessible now because the *logic* of the system is built on the original contingency.
  5.  **Falsifiability:** Precedent can be overturned. If a "Constitutional Convention" (major political shock) occurs and the rule is scrapped, the lock-in is broken. This allows you to define the scale of perturbation required (e.g., "Only a regime change, not just a budget deficit, could alter this").

  **How to phrase it in your dissertation:**
  > "Rather than a ball settling into a pre-existing basin (the adaptive landscape), the process resembles the accumulation of legal precedent. The initial crisis ruling was contingent, but each subsequent administrative decision cited the prior one as authority, thereby reconfiguring the normative terrain for the next. Lock-in is not physical gravity, but the weight of *stare decisis*—a coordinated expectation among officials that deviation is costlier than adherence, despite the theoretical possibility of overturning the precedent."

  This shifts your mechanism from **Increasing Returns** (which the landscape models) to **Reactive Sequences with Normative Feedback**, which aligns with your empirical material and protects your strong counterfactual claim.
