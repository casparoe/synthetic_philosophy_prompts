  As a high school student working through an advanced independent study in decision theory, I have been examining situations in which expected utility is undefined rather than merely infinite—particularly the structural failure that arises in the Pasadena paradox, where discontinuities in the payoff function prevent the expectation from being assigned any value, positive or negative. I would like you to construct, from first principles, an example of a conceptual issue in this family: design a decision scenario set in a continuous parameter space in which an agent selects a real-valued threshold, and the payoff rule contains a singularity that is approached differently depending on whether the agent’s choice lies just above or just below that threshold. Structure the payoffs so that both the positive and negative contribution integrals diverge symmetrically, yielding an expectation that is genuinely indeterminate rather than unbounded in one direction. Then explain precisely why this failure is one of non-existence—why there is no well-defined expectation to maximize—rather than a practical problem of risk aversion or bounded computation. In your explanation, identify the point at which standard decision rules such as maximin and maximax must substitute for expectation-based reasoning, and clarify what this reveals about the limits of expected-utility theory when it encounters discontinuous structures that do not resolve into a single infinite limit.
