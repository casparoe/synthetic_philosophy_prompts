  ### Part 1: The Logical Grid

  Below are four branch questions designed to map the physical commitments of your group. They are phrased to rely on intuition about the specific setups you discussed, avoiding jargon where possible.

  **Q1 (The Mechanical Check):** Consider a purely mechanical one-way trapdoor that does no recording and no information processing at all. Does thermal jiggling of the door itself generate enough entropy to prevent the sorting?
  *   **Yes:** The mechanism fails mechanically.
  *   **No:** The mechanism works; the cost lies elsewhere.

  **Q2 (The Acquisition Check):** Consider a demon that is handed a record someone else made (exogenous), or one whose measurement is unreliable and misclassifies some fraction of molecules. Does the act of acquiring or using this imperfect/pre-made data incur an immediate entropy cost?
  *   **Yes:** Measurement/Correlation acquisition costs energy.
  *   **No:** Measurement is free; cost lies elsewhere.

  **Q3 (The Reset Check):** Consider a demon that never erases and simply appends records until its memory is full. Does work extraction stop *only* when the memory is physically full (requiring reset to continue), or does the correlation itself block work even with infinite memory?
  *   **Yes:** Cost is in the physical reset (erasure).
  *   **No:** Cost is in the existence of the correlation (information state).

  **Q4 (The Microscope Check):** If we could track the exact position and momentum of every particle (fine-grained state), would the total entropy of the isolated system increase during the process?
  *   **Yes:** Entropy increases microscopically.
  *   **No:** Entropy is conserved microscopically (Liouville's Theorem).

