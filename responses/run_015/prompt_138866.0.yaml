      *   **Student Profile:** Mostly non-specialists. Specific characters: Recreational beekeeper, committed vegan (impatient), engineering student (anti-insect moral status).
      *   **Room/Budget:** Movable chairs, whiteboard, phone speaker, £20 budget.
      *   **Case:** Fictional district pest-control board deciding on mosquito-borne disease risk in a wetland.
      *   **Options:**
          1.  Aerial adulticide (kills many existing insects quickly).
          2.  Larvicide (prevents cohort from existing, repeating schedule).
          3.  Sterile-male release (slow suppression, expensive, least visible, most existing live).
      *   **Required Devices:**
          1.  Sealed envelope (settles fictional insect suffering capacity *after* the vote).
          2.  Ecological fact (population rebounds to carrying capacity, deaths are "replaced").
      *   **Constraints:** No lecture/handout before exercise. No jargon (moral status, sentience, replaceability, asymmetry) spoken until debrief.
      *   **Deliverables:** Rules/materials, role cards (private objectives/payoffs, specific types required), timeline (minute markers), debrief plan, "what will go wrong" note, limitation statement (what the activity *can't* do).
      *   **Stakes:** Real consequence for losing side (e.g., arguing for winning policy next week, or improved version).
      *   **Goal:** Students arguing in the corridor afterwards. Philosophy arrives through *doing*, not *telling*.

  2.  **Brainstorming the Philosophical Moves:**

      *   *Move 1: The Epistemic Gap (Uncertainty).* Students must decide *now* without knowing if the insects matter morally (sentience/suffering). This forces a decision under risk (Precautionary Principle vs. Human Priority). The sealed envelope mechanic handles this.
      *   *Move 2: The Non-Identity/Replaceability Problem.* Option 2 (larvicide) prevents existence. Option 1 (adulticide) kills existing beings. Option 3 (sterile) allows life but limits future reproduction. The ecological rebound fact means killing adults just makes room for new adults. This forces students to confront whether "preventing a life" is ethically distinct from "ending a life," and whether a replaced life counts as a loss.
      *   *Move 3: Institutional vs. Moral Incentives.* Roles need conflicting pressures (budget, public visibility, health safety, ecological integrity). This prevents a simple "utilitarian calculus" and forces negotiation, revealing how institutional constraints shape moral outcomes.

  3.  **Designing the Mechanics:**

      *   *The Envelope:* Needs to be dramatic. Opened *after* the vote is cast but *before* the final justification. Actually, the prompt says "opened only after the vote, whose contents settle... whether the insects... can suffer." If opened *after* the vote, it tests regret/robustness. Let's make it so the vote happens, *then* the envelope is opened, *then* they have to justify if they want to change their mind (or accept the consequence). Wait, the constraint says "decision has to be made under genuine uncertainty." So the vote must happen *blind*. The envelope reveals the moral reality *post-hoc* to trigger the debrief.
      *   *The Rebound:* This needs to be communicated clearly without jargon. A visual aid or a specific briefing fact. "If you kill 10,000 today, 10,000 more hatch next week unless you stop the breeding."
      *   *The Stakes:* The prompt suggests the losing side argues for the winning policy next week. That's good. Let's refine it: The losing side must draft the *press release* for the winning policy, framing it in the best possible light. This forces them to inhabit the logic they opposed.
      *   *Roles:* Need 16 roles.
          *   Chair (Facilitator within the group).
          *   Public Health Officer (Human safety priority).
          *   Budget Holder (Cost priority).
          *   Ecological Advisor (Knows the rebound fact).
          *   Community Rep (Visibility/Noise priority).
          *   *Specific constraints:* One role must care about "being seen to act" (Political/PR). One role must state "only quantities" (Data/Engineering - perfect for the engineering student).
          *   *Specific Students:*
