      *   10-20: Option Briefing (Read aloud by Chair).
      *   20-50: Deliberation (The core work).
      *   50-60: The Vote (Secret ballot).
      *   60-65: The Envelope (Reveal).
      *   65-80: Consequence & Justification (Drafting the press release).
      *   80-90: Debrief (Teacher takes back control).

  9.  **Debrief Strategy:**

      *   Map the frustration they felt to the philosophical concepts.
      *   "Who felt sick opening the envelope?" -> Moral Uncertainty.
      *   "Who argued Option 2 was better because they never 'lived'?" -> Non-Identity.
      *   "Who argued Option 1 was fine because they'd be replaced anyway?" -> Replaceability.
      *   Limitation: The simulation cannot reproduce the *actual* phenomenology of insect suffering. I have to supply the weight of that reality in the talk.

