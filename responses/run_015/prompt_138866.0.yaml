      *   *Option 1 (Adulticide):* Cheap, fast, highly visible (planes), high insect death count.
      *   *Option 2 (Larvicide):* Medium cost, prevents existence, requires access to private land (political friction), rebound issue.
      *   *Option 3 (Sterile):* Expensive, slow, invisible, least immediate death.

  5.  **Refining the "Rebound" Mechanic:**

      *   How to convey this without a lecture? A "Briefing Document" given to everyone. It must state: "Wetland capacity is fixed. Removing adults creates vacancy for new larvae immediately."
      *   This makes Option 1 (killing adults) look futile unless the goal is immediate human safety, whereas Option 2 (killing larvae) stops the cycle but raises the "non-existence" question.

  6.  **Refining the "Envelope" Mechanic:**

      *   The envelope contains the "Scientific Verdict on Insect Nervous Systems."
