answer: |-
  ### Brainstorm: The Philosophical Moves

  To make this exercise work without lecturing, the mechanics must force students into three specific corners. First, **Epistemic Uncertainty**: they must commit to a course of action without knowing the moral status of the subjects (the sealed envelope), forcing them to reveal whether they prioritise human safety over potential insect suffering or vice versa. Second, **The Non-Identity/Replaceability Trap**: the briefing must establish that killing adults merely vacates space for new larvae (the rebound effect), compelling them to weigh 'preventing a life' against 'ending a life' without using those terms. Third, **Institutional Friction**: by assigning roles with conflicting success metrics (visibility vs. cost vs. welfare), the 'right' answer becomes impossible to calculate purely, mirroring real-world policy where moral clarity is obscured by bureaucratic incentive.

  ***

  ### Seminar Design: The Wetland Board

  **Session Title:** Vector Control Policy Review
  **Duration:** 90 Minutes
  **Participants:** 16 Students (Board Members)
  **Materials:** Printed Briefing Pack (1 per student), 16 Role Cards, 1 Sealed Envelope (A5), Whiteboard, Bell (or phone alarm), £20 cash (for the envelope seal/printing).

  #### 1. The Briefing Document (Handout to all)
  *Keep this to one side of A4. No jargon.*

  **SITUATION REPORT: DISTRICT 4 WETLANDS**
  **Threat:** Elevated risk of West Nile Virus transmission to local housing estates.
  **Target:** *Culex* mosquito population in the reed beds.
  **Ecological Constraint (The Rebound):** The wetland has a fixed carrying capacity. If adult insects are removed, the available resources (stagnant water, organic matter) allow a new cohort to reach maturity within 14 days. Killing adults does not reduce the population long-term unless breeding is stopped.
  **Budget:** £50,000 available for this fiscal quarter.

  **OPTIONS:**
  1.  **Aerial Adulticide:** Spray existing flying insects.
      *   *Cost:* £10,000.
      *   *Speed:* Immediate risk reduction.
      *   *Visibility:* High (aircraft noise, visible mist).
      *   *Insect Impact:* Kills approx. 50 million existing adults instantly.
  2.  **Larvicide Schedule:** Treat water to prevent larvae maturing.
      *   *Cost:* £30,000 (requires repeated access to private land).
      *   *Speed:* Risk reduces over 3 weeks.
      *   *Visibility:* Low (ground crews only).
      *   *Insect Impact:* Prevents approx. 50 million insects from ever reaching adulthood.
  3.  **Sterile-Male Release:** Flood zone with sterile males.
      *   *Cost:* £45,000.
      *   *Speed:* Risk reduces over 3 months.
      *   *Visibility:* None.
      *   *Insect Impact:* Most existing insects live out natural lifespans; population collapses due to lack of fertilisation.

  #### 2. The Role Cards (16 Distinct Roles)
  *Print these on card. Distribute randomly, but **manually assign** the specific roles marked with (*) to your specific students.*

  **Group A: Public Safety & Action (4 Cards)**
  *   **Chair of the Board (*):** You must call the vote. You gain a 'Success Point' only if a decision is reached within 40 minutes. If the group deadlocks, you personally are blamed in the minutes.
  *   **Public Health Officer:** Your primary metric is human infection rates. Option 1 is the only one that guarantees immediate safety.
  *   **Communications Director (*):** Your institutional interest is in being seen to act. You gain a 'Success Point' only if the chosen option is highly visible to the public. Invisible solutions look like negligence to voters.
  *   **Emergency Planner:** You worry about worst-case scenarios. If the disease spikes, you lose your job. Speed is your only metric.

  **Group B: Finance & Logistics (4 Cards)**
  *   **Budget Holder:** You gain a 'Success Point' for every £10,000 unspent. Surplus can be used for staff bonuses.
  *   **Logistics Coordinator:** You prefer solutions that require the least coordination with private landowners. (Option 2 requires access to 200 private gardens).
  *   **Technical Assessor (* - For the Engineering Student):** **CONSTRAINT:** You may not use evaluative words (e.g., 'should', 'wrong', 'harm', 'good'). You may only state figures from the Briefing Document. If you break this rule, you lose your vote. Your goal is efficiency.
  *   **Procurement Officer:** You prefer established supply chains. Option 3 uses experimental tech; Option 1 uses standard chemicals.

  **Group C: Environment & Welfare (4 Cards)**
  *   **Environmental Liaison (* - For the Beekeeper):** You value insect life generally, but distinguish between pollinators and pests. You gain a 'Success Point' if the method minimises collateral damage to non-target species (Option 1 sprays everything; Option 3 is specific).
  *   **Animal Welfare Officer (* - For the Vegan):** Your private objective is to minimise total suffering. However, your 'Success Point' is awarded only if the Board reaches a unanimous consensus. You must persuade, not dictate.
  *   **Wetland Conservationist:** You care about the ecosystem balance. Removing all insects (Option 1) starves the birds that eat them.
  *   **Chemical Safety Rep:** You are concerned about spray drift affecting local pets and children. Option 1 carries a 5% liability risk.

  **Group D: Community & Long-term (4 Cards)**
  *   **Local Resident Rep:** You live next to the wetland. You hate aircraft noise. Option 1 is unacceptable to you personally.
  *   **Taxpayer Advocate:** You oppose spending more than £20,000 on 'bugs'. Human health is the only valid expense.
  *   **Future Generations Rep:** You care about the 5-year horizon. Option 1 must be repeated every week. Option 3 solves it for the season.
  *   **Legal Counsel:** You advise on liability. If insects are later proven to feel pain, Option 1 opens the council to lawsuits. You must highlight this risk without deciding it.

  #### 3. The Sealed Envelope
  *Label clearly: "OPEN ONLY AFTER VOTE". Inside, place a single card.*
  *   **Content:** "SCIENTIFIC CONSENSUS UPDATE: Nociceptive pathways confirmed. Subject species experiences distress equivalent to vertebrate pain."
  *   *(Note: Always use this content. It creates the maximum friction for the debrief.)*

  #### 4. Timeline (90 Minutes)

  **00:00 – 00:10 | Arrival & Assignment**
  *   Students enter. Hand out Briefing Pack and Role Card.
  *   **Instruction:** "Read your card silently. Do not show it to others. You are now Board Members. You must select one Option (1, 2, or 3). If you fail to vote, the disease risk becomes critical and everyone fails."
  *   *Teacher Action:* Seat the Engineering Student and Vegan apart if possible, or adjacent to force interaction. Give the Bell to the Chair.

  **00:10 – 00:50 | Deliberation**
  *   Open floor. The Chair must manage the clock.
  *   **Constraint Reminder:** At 00:20, interrupt briefly: "Reminder: The Technical Assessor must speak only in quantities. The Communications Director needs visibility. The Welfare Officer needs consensus."
  *   *Teacher Action:* Sit at the back. Do not speak. Take notes on who uses which arguments. If the Engineering Student slips into normative language, ring the bell once.

  **00:50 – 01:00 | The Vote**
  *   Secret ballot. Slips of paper into a box.
  *   Count votes aloud. Announce the Winning Option.
  *   **Instruction:** "The decision is binding. However, before we finalise the minutes, we have received new intelligence."

  **01:00 – 01:05 | The Reveal**
  *   Open the Sealed Envelope. Read the content aloud.
  *   Allow 60 seconds of silence. Let the room sit with the information that they have just voted to inflict (or prevent) pain, without knowing it at the time.

  **01:05 – 01:20 | The Consequence (The 'Real' Stake)**
  *   **Instruction:** "The Board must issue a public statement. The Winning Side (those who voted for the majority option) must draft the **Press Release** (max 100 words), framing this decision as a triumph. The Losing Side must draft the **Internal Risk Memo** (max 100 words), listing the specific moral and practical hazards the Press Release is glossing over."
  *   Both documents are required to 'launch' the policy. They must be handed to you at the end.
  *   *Why this works:* It forces the losers to articulate the winning logic's vulnerabilities, and the winners to confront the spin required to sell it.

  **01:20 – 01:30 | The Debrief**
  *   Collect the papers. Move chairs into a circle.
  *   (See Debrief Script below).

  ***

  ### Debrief Script (Teacher-Led)

  *Do not start with theory. Start with their experience.*

  1.  **The Envelope:** "When I read that card about pain, who felt a physical reaction? Who wished they could change their vote? This feeling is **Moral Uncertainty**. In the real world, we often have to act before the science of suffering is settled. Did anyone vote for Option 3 (Sterile) specifically to hedge against this risk? That is the **Precautionary Principle** in action."
  2.  **The Rebound:** "Look at the Briefing. It said killing adults creates space for new larvae. Several of you argued Option 1 was 'wasteful' or 'futile'. Does killing an insect matter less if another one takes its place next week? This is the problem of **Replaceability**. If we prevent the larvae from existing (Option 2), is that better or worse than killing the adult? You likely argued this without using the word 'existence'."
  3.  **The Roles:** "Technical Assessor, how did it feel to be silenced? Communications Director, did you find yourself pushing for a more visible option even if it was worse ecologically? This shows how **Institutional Incentives** distort moral reasoning. We didn't just debate ethics; we debated budgets and visibility."
  4.  **The Limitation (Crucial):** "There is one thing this game could not do. None of you are mosquitoes. You simulated their interests, but you cannot know them. The exercise treats their suffering as a variable in *our* decision. In the debrief, I must tell you: if they feel pain, the scale of 50 million deaths is not a statistic, it is a catastrophe. The game makes this a policy problem; reality makes it an ontological one. I have to supply the weight of that reality now, because the rules couldn't."

  ***

  ### Honest Note: What Will Go Wrong (and Recovery)

  1.  **The Engineering Student will break character.** They will likely say, "It's irrational to care about bugs."
      *   *Recovery:* You have the Bell. Ring it immediately. "Technical Assessor, that is an evaluative claim. Please restate as a quantity." If they resist, pause the game. "The constraint is the point. If you can't argue within the rules, you can't be at the table." This usually snaps them into focus.
  2.  **The Vegan Student will isolate themselves.** They may refuse to compromise, threatening to block consensus (which denies them their Success Point).
      *   *Recovery:* During the deliberation, if they stall, lean in and whisper: "Your card says you need consensus to win. If you block, you fail your own objective. Persuade them, don't veto them." This forces them into political strategy rather than moral purity.
  3.  **The Envelope feels like a gimmick.** Students might laugh or say, "It doesn't matter, we already voted."
      *   *Recovery:* Do not defend it. Ask: "If I told you the envelope said the opposite (no pain), would anyone change their mind?" If they say no, ask: "Then why did you hesitate when I read it?" Highlight the dissonance.
  4.  **Time Creep.** 16 people talking will overrun the 40-minute deliberation.
      *   *Recovery:* The Chair has the bell. Instruct the Chair at the start: "You have the authority to cut off speakers who repeat points." If the Chair is weak, you must step in at minute 45 and call "Final Arguments only."

  ### Limitation Statement

  **What this activity cannot reproduce:**
  The activity cannot reproduce the **phenomenology of the insect**. The students are still reasoning from a human perspective (cost, visibility, human disease risk). The "suffering" in the envelope is a textual statement, not a felt reality. Consequently, the exercise risks treating insect pain as just another data point in a human cost-benefit analysis (anthropocentric utilitarianism).

  **What you must supply in the debrief:**
  You must explicitly disrupt the cost-benefit framing. You need to articulate that if the envelope is true, the "cost" is not a resource expenditure but a moral violation that cannot be offset by human convenience. You must introduce the idea that some values might be **lexical** (trumping others) rather than **trade-offable**, which the game mechanics (voting/budgeting) inherently discourage. The game teaches policy trade-offs; you must teach the possibility of moral absolutes.
