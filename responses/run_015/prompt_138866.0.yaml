  7.  **Addressing the Constraints & Personalities:**

      *   *Engineering Student:* Assign the 'Technical Data Officer' card. Constraint: "You may not use words like 'should', 'wrong', or 'harm'. You may only cite figures from the briefing sheet." This channels their assertiveness into a structural constraint.
