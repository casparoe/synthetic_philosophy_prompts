answer: |-
  This is a fantastic philosophical puzzle because your friend is technically relying on a classic intuition pump (Thomas Nagel's "Resultant Luck"), but you're sensing that it flattens the actual moral landscape. If we only look at whether people lived or died, we ignore *how* that outcome was achieved.

  To help you articulate your side, we need to move past **Resultant Luck** (how things turned out) and dig into **Circumstantial Luck** (the situation the agent was placed in).

  Here is a breakdown of Flight 1549 through the lens of circumstantial luck, compared against United 232 (Sioux City), and what that tells us about responsibility.

  ### 1. The "Middle Layer": Circumstantial Luck in Flight 1549

  Your friend's argument is: *If the river had been choppy, people die, Sully is a villain.* This assumes Sully's heroism is entirely dependent on the **result**.

  But let's look at the **circumstances** Sully was handed. This is the "middle layer" you mentioned.
  *   **Altitude & Location:** The bird strike happened at 2,800 feet. This is too low to return to LaGuardia, too low to reach Teterboro, but *just high enough* to glide to the river. If the strike happened 10 seconds later (lower), the river option vanishes. If 10 seconds earlier (higher), maybe he makes an airport.
  *   **The River:** It was January, but the water was unusually calm. A choppy river would have broken the fuselage on impact.
  *   **The Rescue:** It was daytime. Ferries were nearby. If this happened at night, or in winter when ferry schedules were reduced, hypothermia would have killed survivors even if the landing was perfect.

  **Does this undermine praise?**
  Not necessarily. It changes *what* we are praising.

  If we praise Sully solely for "0 fatalities," then yes, your friend is right: that is largely luck. But if we praise Sully for **maximizing the probability of survival within the constraints of his circumstantial luck**, the praise holds.

  Sully's skill wasn't magic; it was **epistemic**. He had to assess his circumstantial luck in real-time. He had to recognize that the "airport option" was a trap (a likely crash in a populated area) and that the "river option" was the only viable affordance, despite the risks.
  *   **The Counter-Argument:** A less skilled pilot might have tried for Teterboro (as ATC suggested) and crashed into a building, killing everyone on the plane plus people on the ground.
  *   **The Verdict:** Sully is not a hero because the river was calm. He is a hero because he recognized the river was the *only* variable he could control, and he executed a ditching technique that respected the physical limits of the airframe. We praise the **calibration of agency**, not just the survival count.

  ### 2. The Control Case: United Flight 232 (Sioux City, 1989)

  This is where your friend's "outcome luck" theory falls apart.

  Captain Al Haynes (and his crew, including check airman Dennis Fitch) faced a DC-10 with total hydraulic failure. They had no control over flaps, landing gear, or steering. They could only adjust engine thrust to steer the plane.
  *   **The Circumstantial Luck:** Terrible. The plane was essentially a brick.
  *   **The Outcome:** The plane cartwheeled on landing. 112 people died. 185 survived.
  *   **The Verdict:** Haynes is universally regarded as a hero. The NTSB report called the landing "a masterpiece of airmanship."

  **Why is Haynes a hero despite 112 deaths?**
  If your friend's theory held true (Hero = Good Outcome), Haynes should be viewed with ambiguity or blame. But he isn't. Why?

  Because the **counterfactual** is clear. Without Haynes and Fitch's specific improvisation (using differential thrust to steer), *everyone* would have died.
  *   **Sully:** Perfect outcome + High Skill = Hero.
  *   **Haynes:** Imperfect outcome + High Skill = Hero.

  This comparison proves that we **do not** track outcomes exclusively. We track **marginal utility**. We praise pilots for how many lives they saved *relative to the baseline of disaster*.
  *   Sully saved 155 out of 155 (Baseline survival without skill: ~0).
  *   Haynes saved 185 out of 297 (Baseline survival without skill: ~0).

  The fact that 112 died in Sioux City doesn't diminish Haynes' moral standing because those deaths were attributable to the **circumstantial luck** (the mechanical failure), not Haynes' **agency**. In Sully's case, if people had died, it would have been harder to disentangle whether it was the river's roughness (luck) or Sully's angle of impact (agency). But the Sioux City case proves we are capable of making that distinction.

  ### 3. Role Constraints and Moral Luck

  You asked if strict role constraints change how moral luck works. This is crucial.

  Pilots operate under a "duty of care." They are responsible for the safety of the passengers, but they are not responsible for *gravity* or *bird strikes*.
  *   **Moral Luck in Normal Life:** If I run a red light and no one is there, I'm reckless. If I run a red light and hit a kid, I'm a murderer. The action is the same; the luck changes the moral weight heavily.
  *   **Moral Luck in Professional Roles:** In high-stakes professions (pilots, surgeons), we try to insulate judgment from resultant luck. We look at **process compliance**.

  However, both Sully and Haynes went *beyond* protocol. There is no checklist for "dual engine failure at 3,000 feet" or "total hydraulic loss."
  *   When an agent is trapped inside strict constraints, **agency becomes more visible.**
  *   If a pilot follows the manual and crashes, we say "tragic accident."
  *   If a pilot ignores the manual (ATC told Sully to try Teterboro) and lands safely, we say "hero."

  This suggests that moral luck doesn't disappear in role constraints; it just shifts. We stop blaming them for the *situation* (the luck) and start praising them for the *navigation* of the situation. The "Hero" label is reserved for when an agent successfully bends the constraints of their role to overcome bad circumstantial luck.

  ### 4. Conclusion: Revisionism or Carefulness?

  So, does this push us toward **revisionism** (we shouldn't hold anyone responsible because luck is everywhere) or **carefulness** (we need to be precise about what we praise)?

  It argues for **carefulness**.

  Your friend is right that "Resultant Luck" exists. If Sully had hit a barge, the public *would* have torn him apart initially. That is a failure of *public moral judgment*, not a failure of *Sully's morality*. The public often conflates outcome with virtue.

  But philosophically, we shouldn't revise responsibility away. Instead, the Sully/Haynes comparison teaches us to praise **Decision Quality** over **Outcome**.
  *   **Don't praise:** "He saved everyone." (That relies on the river being calm).
  *   **Do praise:** "He identified the option with the highest expected value and executed it with precision, despite the pressure."

  **The Takeaway for Your Argument:**
  Tell your friend: "You're right that luck determines the *ceiling* of the outcome. A calm river set a high ceiling. But skill determines how close you get to that ceiling. Haynes had a low ceiling (people were going to die no matter what), but he got 62% survival out of a 0% situation. Sully got 100% out of a 5% situation. We call them both heroes not because of the final number, but because both maximized the value of the hand they were dealt. If we only praise the 100% survival, we aren't judging the pilot; we're judging the weather."

  This validates her intuition (luck matters) without accepting her conclusion (heroism is an illusion). It shifts the locus of praise from the **result** to the **optimization of agency**.
