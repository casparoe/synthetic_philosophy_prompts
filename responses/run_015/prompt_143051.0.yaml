answer: |-
  Here is the advisory brief on prioritizing conceptual problems for the grant call.

  ### The Core Tension
  You are funding philosophers, not forensic archaeologists. Their job is not to solve the contradiction (e.g., re-carbon-date the soil) but to provide the **normative framework** that tells an institution how to *act* when the contradiction cannot be scientifically resolved.

  The default institutional stance is "Archival Realism": the document and the scientific data are neutral arbiters, and memory is subjective. Your grant seeks to disrupt this. To do that, we need to attack the neutrality of the record first, then establish the authority of the memory, and finally dictate the institutional response.

  Here are the three prioritized conceptual problems, ranked by their ability to unblock the others.

  ---

  ### 1. Distinguishing "Archival Gaslighting" from Selection Bias
  **The Question:** What conceptual criteria distinguish a record that is merely incomplete (bias) from a record that was engineered to manufacture a contradiction with living memory (gaslighting)?

  **Why Rank This First:**
  This is the linchpin. If the archive is just "biased" (incomplete, negligent), the default position remains: *Memory is a supplement to the Record.* The Record is still the skeleton; Memory is the flesh.
  If, however, we can conceptually define "Archival Gaslighting"—where the record was created *specifically* to contradict and destabilize community memory—the Record loses its status as a neutral arbiter. It becomes evidence of hostility.
  Cracking this unblocks Mnemonic Sovereignty. You cannot defend a group's right to override "facts" (Sovereignty) unless you first undermine the claim that those facts are innocent. If the record is a weapon, memory is not "alternative fact"; it is self-defense.

  **Tractability for Non-Archivists:**
  High. Philosophers do not need to analyze the ink or paper. They need to analyze **intent and structure**. They can develop a framework for identifying "hostile provenance." For example: Does the archive systematically categorize oral testimony as "myth" while categorizing administrative notes as "data"? That is a structural gaslighting move, identifiable through logic and textual analysis, not lab work.

  **Re-ranking Trigger:**
  **Bump Down** if theorists conclude that "intent" is impossible to distinguish from "negligence" without access to private administrative memos that don't exist. If "gaslighting" becomes a conspiracy theory that can't be rigorously defined, it loses its power to shift institutional policy.
  **Bump Up** if they can produce a checklist of "Hostile Provenance Indicators" that a curator can apply to a collection in under an hour.

  ### 2. Defining the Normative Limits of Mnemonic Sovereignty
  **The Question:** Can a community's authority over its past be defended without collapsing into "my truth vs. your truth" relativism, specifically when that memory contradicts physical evidence (like carbon dating)?

  **Why Rank This Second:**
  Once the Archive is suspect (via Problem #1), we still have the Physical Evidence (science). A curator cannot ignore carbon dating simply because a community wishes it. Mnemonic Sovereignty risks becoming a "get out of reality free" card.
  This problem needs to define the *scope* of sovereignty. Is sovereignty over the *meaning* of the event, or the *occurrence* of the event?
  Cracking this unblocks Institutional Protocols. A curator cannot write a wall label if they don't know if they are permitted to state that a scientific finding "contradicts" the community. If Sovereignty includes the right to define physical reality, the label must center the memory. If Sovereignty is only over *meaning*, the label must present the science as dominant and the memory as "cultural interpretation."

  **Tractability for Non-Archivists:**
  Medium-High. This is pure epistemology and ethics. It requires arguing that "factual accuracy" is not the only metric for historical truth. For example, arguing that a creation story is "true" because it sustains the legal/moral continuity of the people, regardless of geological strata.

  **Re-ranking Trigger:**
  **Bump Down** if the theorists cannot find a middle ground between "Science is King" and "Anything Goes." If the result is pure relativism, institutions will reject it as unusable.
  **Bump Up** if they successfully argue for "Functional Truth"—where the truth of the memory is tied to its necessity for the group's survival, creating a moral obligation for the institution to prioritize it over inert data.

  ### 3. Institutional Protocols for Sustained Contradiction
  **The Question:** When memory and record cannot be reconciled, what is the ethical obligation of the institution? Is the goal resolution, or is the goal the *ethical stewardship of the conflict*?

  **Why Rank This Third:**
  This is the application layer. It depends entirely on the outputs of #1 and #2. If the Archive is gaslighting (#1) and Sovereignty is valid (#2), the protocol is "Center the Memory, Contextualize the Archive." If the Archive is just biased (#1) and Sovereignty is limited (#2), the protocol is "Display Both, Note Discrepancy."
  You cannot solve this practically until the normative ground is cleared.

  **Tractability for Non-Archivists:**
  High. This is about policy and ethics statements. It results in guidelines for curators and school boards.

  **Re-ranking Trigger:**
  **Bump Down** if it produces generic "diversity and inclusion" language that doesn't address the specific epistemic conflict.
  **Bump Up** if it produces a "Decision Tree" for boards facing public backlash (e.g., "If the community claims X, and the archive says Y, here is the script for the press release").

  ---

  ### Worked Scenario: The Flood Narrative
  **The Context:** An Indigenous community maintains an oral narrative that a great flood cleansed their valley 5,000 years ago, resetting their land tenure. Carbon dating of sediment cores suggests no major flood event in that window; the strata are continuous. The local colonial archive (assembled 150 years ago) contains surveyor notes explicitly stating: "Natives claim flood myth to justify land claims; geology proves continuous habitation by other tribes."

  **Applying the Ranking:**

  1.  **Apply Problem #1 (Gaslighting):**
      *   *Without this concept:* The curator sees "Oral Story vs. Science vs. Old Document." The Document and Science align. The Story loses.
      *   *With this concept:* The theorist identifies the Surveyor's Note as **Archival Gaslighting**. The surveyor wasn't just recording geology; they were recording a *refutation* of the memory to undermine land claims. The archive is not a neutral record of geology; it is a record of a legal strategy.
      *   *Result:* The Archive is disqualified as a neutral witness. It is now evidence of colonial interference.

  2.  **Apply Problem #2 (Sovereignty):**
      *   *Without this concept:* The Carbon Dating remains the "Truth." The Flood is "Myth."
      *   *With this concept:* The theorist argues for **Mnemonic Sovereignty over Land Tenure**. Whether water physically covered the rocks is less relevant than the fact that the *community's legal reality* requires the flood to be true for their land rights to function. The "truth" of the flood is juridical, not just geological.
      *   *Result:* The institution accepts that for the purpose of *this* display, the Flood is treated as the primary historical reality, and the sediment cores are treated as "inconclusive regarding cultural memory."

  3.  **Apply Problem #3 (Protocol):**
      *   *Action:* The museum does not put up a sign saying "Science disproves Myth."
      *   *Action:* The museum displays the sediment cores alongside the oral history, but the label reads: "Colonial surveyors used geological data to invalidate Indigenous land rights. While the soil shows continuous habitation, the Community maintains the Flood narrative as the foundation of their sovereignty. This archive entry demonstrates how science was weaponized to contradict that memory."
      *   *Result:* The conflict is not resolved; the *power dynamic* of the conflict is exposed.

  **Which solved problem changes the Curator's action?**
  **Problem #1 (Gaslighting).** If the theorist cannot distinguish the Surveyor's Note from standard bias, the Curator must treat the Note as valid data. If the Note is valid data, it aligns with the Carbon Dating. The Curator is then forced to marginalize the Oral Narrative. Proving Gaslighting is the only move that frees the Curator to center the Oral Narrative without appearing "anti-science."

  ---

  ### Overrated Lines of Inquiry (Do Not Fund)

  **1. "Digital Repatriation and Access"**
  *   **Why it's overrated:** This assumes the problem is *access* to the archive. In your scenario, the community has seen the archive; they reject it. Giving them a high-resolution scan of the colonial surveyor's note does not solve the epistemic conflict. It is a technical solution to a moral problem.
  *   **Harm:** It wastes funds on servers and scanning when the conceptual framework for *interpreting* the scan is missing.

  **2. "Trauma-Informed Archival Practices"**
  *   **Why it's overrated:** This frames the conflict as a psychological injury to be soothed. While true, it shifts the focus from *truth claims* to *emotional care*. A school board needs to know what to teach as history, not just how to be nice while teaching it.
  *   **Harm:** It risks reducing valid historical contradictions to "feelings," which reinforces the idea that the Archive is Fact and Memory is Emotion.

  **3. "Consensus-Building Methodologies"**
  *   **Why it's overrated:** This assumes the goal is agreement. In cases of Archival Gaslighting, consensus is often the tool of the oppressor (i.e., "agree to our version of reality").
  *   **Harm:** It pressures the marginalized group to compromise on their sovereignty to reach a "middle ground" that validates the weaponized record.

  ---

  ### Honest Value Judgments & Risks

  **The Relativism Trap:**
  Prioritizing Mnemonic Sovereignty requires you to accept a value judgment: **Survival and Continuity are epistemic virtues.** You are effectively telling the grant board to fund work that argues a story's utility for a people's survival can outweigh physical evidence. This is not a neutral scientific stance. It is a political-ethical one. If your board is risk-averse regarding "truth," this will be controversial.

  **The "Science" Boundary:**
  There is a line where Mnemonic Sovereignty conflicts with public health or safety (e.g., memory contradicts medical data). The theorists must define where Sovereignty ends. If they don't, the grant produces ideology, not usable philosophy. I recommend requiring a deliverable that explicitly maps the "Limits of Sovereignty."

  **The Gaslighting Burden:**
  Accusing an archive of "gaslighting" is an accusation of malice or structural violence. Institutions hate this. It invites lawsuits and public relations nightmares. The theorists must provide a way to identify gaslighting that relies on *structural analysis* (e.g., "the archive systematically excludes category X") rather than *individual intent* (e.g., "Mr. Smith was a racist"). The former is actionable; the latter is litigious.

  **Final Recommendation:**
  Fund the **Gaslighting** project first. It is the most robust lever. If you prove the record is weaponized, you don't need to argue that memory is "more true" than science; you only need to argue that memory is "more trustworthy" than the weapon. That is a much easier sell to a school board or museum director.
