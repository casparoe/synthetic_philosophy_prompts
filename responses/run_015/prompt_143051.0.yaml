          2.  **Distinguishing Gaslighting from Bias.** (The "Evidence" against the record.)
          3.  **The Ethics of Institutional Stewardship in Conflict.** (The "Action" required.)

      *   *Wait, let's look at the "Unblocking" logic.*
          *   If we define Sovereignty (#1), we know *if* memory can win.
          *   If we define Gaslighting (#2), we know *when* the record loses credibility.
          *   If we define Stewardship (#3), we know *how* to display/teach the conflict.
          *   *Actually, #2 might be the key.* If we can prove Gaslighting, Sovereignty becomes easier to justify. If the archive is weaponized, the "factual accuracy" of the archive is morally compromised.
          *   *Let's try this order:*
              1.  **Archival Gaslighting (Epistemic Sabotage).** Why? Because if the record is weaponized, the "factual accuracy" premise is poisoned. This makes Mnemonic Sovereignty easier to defend without relativism. It shifts the burden from "memory vs. truth" to "memory vs. weaponized pseudo-truth."
              2.  **Mnemonic Sovereignty (Non-Relativist Defense).** Once the record is suspect, how much authority does memory have? We need a limit so it doesn't become "anything goes."
              3.  **Procedural Justice for Institutions.** How to act given 1 and 2.

      *   *Re-evaluating based on "Tractability for non-archivists":* Philosophers can't do forensic archive analysis. They *can* analyze the conceptual distinction between bias and gaslighting. They *can* analyze the ethics of sovereignty. They *can* analyze institutional duty.
      *   *Re-evaluating based on "Harm Reduction":* Knowing the archive is gaslighting is huge for a curator. It justifies sidelining the document.
      *   *Decision:* I will stick with a order that prioritizes the *condition of the record* first, because that destabilizes the "objective" side of the conflict, making space for memory.
      *   *Rank 1:* Distinguishing Archival Gaslighting from Selection Bias. (The Diagnostic).
