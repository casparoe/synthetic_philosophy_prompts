      *   *Archival Gaslighting:* This distinguishes malicious/structural engineering of the record from mere "selection bias." It implies the archive was *designed* to contradict memory to undermine the group. This shifts the burden of proof.

  3.  **Brainstorming Open Questions:**
      *   *Q1: Epistemic Authority.* Who decides when memory overrides evidence? (Mnemonic Sovereignty).
      *   *Q2: Structural Intent.* How do we prove the archive is weaponized rather than just incomplete? (Archival Gaslighting).
      *   *Q3: Ethical Obligation.* What do institutions owe the community when the conflict exists? (Harm reduction/Practice).
      *   *Q4: Temporal Justice.* Does the passage of time change the weight of memory vs. record?
      *   *Q5: Reconciliation.* Is the goal to resolve the contradiction or sustain the tension?

  4.  **Selecting and Ranking the Top Three:**
      *   *Criterion:* Unblocking potential. If we solve X, does Y become easier?
      *   *Criterion:* Tractability for philosophers (not archivists).
