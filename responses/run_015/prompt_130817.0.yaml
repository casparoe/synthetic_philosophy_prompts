answer: |-
  This is a sophisticated request that recognizes the tension between metaphysical causation, operational safety, and organizational politics. You are correct: the "Root Cause" line is not a discovery of truth, but a selection of a *lever for intervention*. The procedure below is designed to make that selection explicit, defensible, and consistent, while protecting your team from the pressure to conflate causation with blame.

  ### The Transit Authority Causal Selection Procedure (TACSP)

  **Time Budget:** 90 minutes committee time / 2 days investigation.
  **Goal:** Populate the single "Root Cause" line with the most actionable, defensible factor.

  #### Step 1: Candidate Generation (The "Long List")
  **Question:** What factors, if removed or altered, are associated with the incident?
  **Action:** List every factor identified in the investigation (e.g., "wire chafed," "module old," "tech tired," "procedure unclear").
  **Stop Condition:** None. Do not filter yet.
  **Note:** Do not worry about "but-for" yet. In cases of overdetermination (two sufficient causes), both go on the list.

  #### Step 2: The Interventionist Filter (The "Lever Test")
  **Question:** Is there a specific, realistic change to this factor that the Authority *could* implement, which would have reduced the probability of this outcome (even if not to zero)?
  **Action:** For each candidate, propose an intervention.
  *   *Pass:* "Replace module at 6 months instead of 12," "Relocate tooling," "Add lighting."
  *   *Fail:* "Driver was taller," "Pedestrian looked up," "Rain didn't fall." (These are facts, not levers).
  **Stop Condition:** If **No**, the candidate is eliminated from the "Root Cause" line. It may remain in the background narrative, but it is not the *Authority's* root cause.
  **Handling Missing Data:** If you lack statistics (e.g., "How much does lighting help?"), use **Consensus Plausibility**. Ask: "Is it reasonable to believe this change helps?" If the committee agrees it is plausible, it passes. Do not demand p-values.

  #### Step 3: The Swap Test (Individual vs. System)
  **Question:** If we swap the specific individual involved with another competent employee, trained to the same standard, working the same shift under the same conditions, does the outcome remain likely?
  **Action:** Apply to any candidate involving human action.
  *   *Result A (Outcome Changes):* The individual deviated from the norm. (Candidate = Individual Action).
  *   *Result B (Outcome Stays Same):* The individual followed the actual norm (even if it violated the written rule). (Candidate = System/Process).
  **Stop Condition:** If **Result B**, the individual's name is **ineligible** for the Root Cause line under the Union Agreement. The cause must be phrased as the system condition that guided them (e.g., "Fatigue management" not "Driver sleep").
  **Note on your Swap Test:** It is sound. It isolates *idiosyncratic error* from *systemic induction*. It breaks only if "competent employee" is ill-defined. Define it as "certified for the role, within normal variance of performance."

  #### Step 4: Selection for the Single Line (The "Tie-Breaker")
  **Context:** You often have multiple candidates that pass Steps 2 and 3 (e.g., Case 1). The template forces one.
  **Rule:** Select the candidate that satisfies the **Proximity-Prevention Hierarchy**:
  1.  Prefer **Systemic** over **Individual** (aligns with safety culture and Union agreement).
  2.  Prefer **Upstream** over **Downstream** *only if* the upstream lever is reliable. (e.g., "Hiring freeze" is too distant; "Maintenance Schedule" is better).
  3.  Prefer **High-Confidence** over **Low-Confidence** interventions.
  **Stop Condition:** If the committee cannot agree on which lever is most actionable, the decision is **Deferred to Board**. The report states: "Multiple systemic causes identified; prioritization requires resource allocation decision." (This is rare; use only for genuine stalemates).

  #### Step 5: Drafting the Cause Sentence (The Fixed Form)
  You must use this syntax to force clarity on the counterfactual.

  > **"The outcome occurred because [FACTOR] was [ACTUAL STATE] rather than [COUNTERFACTUAL STATE], holding [FIXED CONTEXT] constant."**

  *   **[FACTOR]:** The variable you are intervening on.
  *   **[ACTUAL STATE]:** What happened.
  *   **[COUNTERFACTUAL STATE]:** The specific intervention that would have prevented/mitigated it.
  *   **[FIXED CONTEXT]:** What you are assuming stayed the same (crucial for the interventionist account).

  ---

  ### Evaluation of Your "Swap Test"
  *   **Where it fits:** Step 3.
  *   **Is it sound?** Yes. It is a practical application of the *ceteris paribus* (all else equal) condition. It tests whether the variance lies in the *agent* or the *environment*.
  *   **Where it breaks:**
      1.  **The "Competent" Trap:** If the system is so degraded that *no* competent employee could succeed (e.g., impossible schedule), the test correctly identifies "System." However, management may argue the employee wasn't "competent." You must define competence by *certification*, not by *outcome*.
      2.  **Moral Hazard:** If the test becomes known, employees might collude to prove "anyone would have done it." Keep the deliberation confidential.
      3.  **The "Hero" Expectation:** It assumes the standard is "competent," not "heroic." If the job requires heroism to be safe, the test correctly flags the system, but the Board may resist this finding.

  ---

  ### Running the Procedure on Your Cases

  #### Case One: The Signal Failure (Overdetermination)
  *   **Facts:** Power module (degraded, past interval) AND Wiring fault (repair error, 3 weeks prior). Either sufficient.
  *   **Step 1 (Candidates):** 1. Module degradation. 2. Wiring error.
  *   **Step 2 (Interventionist):**
      *   Module: Could we replace earlier? Yes. (Pass)
      *   Wiring: Could we repair better/inspect after repair? Yes. (Pass)
  *   **Step 3 (Swap):**
      *   Module: Not person-specific. (System)
      *   Wiring: Would another tech have made the fault? If the procedure is unclear or tools are bad, yes (System). If it was a unique slip, maybe (Individual). Let's assume for this case the repair protocol is standard, but the fault was a specific error.
  *   **Step 4 (Selection):** Both are systemic levers. The wiring fault is more proximate (3 weeks vs. months), but the module degradation indicates a broader maintenance scheduling failure. The Procedure prioritizes **Systemic/Upstream** if reliable. The maintenance interval failure affects *all* signals; the wiring error affects *that* repair. The Module is the higher-leverage systemic fix.
  *   **Step 5 (Sentence):**
      *   *Draft:* "The outcome occurred because the **power supply maintenance interval** was **12 months** rather than **6 months**, holding **traffic load and environmental conditions** constant."
      *   *Why not the wiring?* The wiring is a specific instance; the interval is a policy. If you must pick one line, pick the policy.
      *   *Recommendation:* Fund both. The single line is a bureaucratic artifact; the recommendations section allows both fixes.

  #### Case Two: The Pedestrian Strike (Unchangeable Factors & Probabilities)
  *   **Facts:** Driver OK. Pedestrian on phone, against signal. Authority levers: Lighting, Timing, Speed, Design. All low-probability reductions.
  *   **Step 1 (Candidates):** 1. Pedestrian inattention. 2. Crossing lighting. 3. Signal timing. 4. Vehicle speed.
  *   **Step 2 (Interventionist):**
      *   Pedestrian: Can Authority intervene? No. We cannot mandate pedestrians look up. **Eliminate.** (This answers your instinct: it is a cause of the *crash*, but not a root cause *for the Authority*).
      *   Lighting/Timing/Speed: Can we change them? Yes. Do they reduce risk? Plausibly yes, even if slightly. **Pass.**
  *   **Step 3 (Swap):** N/A (System factors).
  *   **Step 4 (Selection):** Which lever is most actionable? Usually **Speed** or **Design**. Lighting is often marginal at dusk. Speed is a policy choice.
  *   **Step 5 (Sentence):**
      *   *Draft:* "The outcome occurred because the **corridor speed limit** was **35 mph** rather than **25 mph**, holding **vehicle braking capacity and pedestrian behavior** constant."
      *   *Handling Probability:* You do not need to prove it *would* have prevented it. You only need to state it reduces the *chance*. The sentence structure allows this ("rather than" implies the alternative risk profile).
      *   *Committee Note:* Explicitly record that Pedestrian Inattention was excluded not because it wasn't a cause, but because it is not an *actionable variable for the Authority*.

  #### Case Three: The Brake Torque (Systemic Negligence vs. Discipline)
  *   **Facts:** 6 techs skip step. Job card bad, tools far away. Board wants a name. Driver Rep fears discipline.
  *   **Step 1 (Candidates):** 1. Tech's failure to torque. 2. Job card design. 3. Tooling location. 4. Shift length (12 hrs).
  *   **Step 2 (Interventionist):** All pass. We can change the card, move tools, shorten shifts, or discipline tech.
  *   **Step 3 (Swap Test):**
      *   Swap the named Tech with another certified Tech from the same shift.
      *   Result: The new Tech also skips the step (because tools are far and shift is long).
      *   **Finding:** The behavior is the *norm*, not the *deviation*.
      *   **Constraint Check:** Union Agreement says name individual *only if personally responsible*. Since the Swap Test shows the system induced the behavior, the individual is **not personally responsible** in the causal sense required for discipline.
  *   **Step 4 (Selection):** The Procedure selects **Job Card/Tooling Location**.
  *   **Step 5 (Sentence):**
      *   *Draft:* "The outcome occurred because the **maintenance workflow design** placed **critical verification steps at the end of a 12-hour shift with distant tooling** rather than **integrating verification mid-shift with local tooling**, holding **technician certification levels** constant."
  *   **The Conflict:**
      *   **Procedure Output:** System Cause. No Name.
      *   **Board Desire:** Name for discipline.
      *   **Honest Assessment:** Causation and Accountability have come apart. The Board is asking for a *scapegoat*, not a *cause*. The Procedure cannot generate a name here without lying about the causation (failing the Swap Test).
      *   **Committee Responsibility:** This is the hand-off point. The Committee must sign the report as "System." If the Board demands a name, they are overriding the safety finding for administrative purposes. The Report should include a footnote: *"Committee finds no individual deviation from actual operational norms. Discipline may proceed only on administrative grounds, not causal findings."*

  ---

  ### Limitations: What This Procedure Cannot Do

  If you adopt this, watch for these failure modes in the first six months:

  1.  **The "Single Line" Lie:** The procedure cannot fix the template. It will often force you to select Cause A when Cause B was equally important.
      *   *Watch For:* Recommendations that contradict the Root Cause line. (e.g., Line says "Module," Recommendations fund "Wiring Training"). This signals the template is breaking the analysis.
  2.  **Variable Selection Bias:** The Interventionist account depends on *which* variables you choose to test. A manager can steer the outcome by saying "Don't test budget, test technician focus."
      *   *Watch For:* Step 1 (Candidate Generation) becoming restricted. Ensure the "Long List" is documented and attached, even if not in the summary.
  3.  **The "Plausibility" Trap:** Since you lack data, you rely on consensus. Consensus can be wrong or politically pressured.
      *   *Watch For:* "It's obvious" statements without a stated mechanism. Force the "Because..." to be filled in during Step 2.
  4.  **Accountability Drift:** As seen in Case 3, the Board may use the report for discipline even when the Procedure says "System."
      *   *Watch For:* HR requesting "drafts" before the Committee signs. Keep the Swap Test deliberations privileged within the Safety Committee.
  5.  **Remote Causes:** The procedure might select "Hiring Freeze" (Step 4 allows upstream). This is often unfundable.
      *   *Watch For:* Root Causes that are too distant to act on. If the Counterfactual State is "If the Board had hired more people 2 years ago," the finding is useless. Enforce the **Actionability** constraint in Step 2 strictly.

  ### Final Advice
  You are right to suspect the template is an artifact. This procedure treats the "Root Cause" line not as a statement of *truth*, but as a statement of *priority*. It forces you to admit what you are holding fixed and what you are willing to change.

  In Case 3, when the Board pushes back, your defense is not philosophical; it is procedural. "We applied the agreed Causal Selection Procedure. The Swap Test failed to identify individual deviation. To name the individual would be to falsify the causal record. If discipline is required, it must be acknowledged as an administrative decision separate from the safety investigation."

  This protects your department's integrity. It allows the Board to do what they want, but it prevents them from claiming the *safety data* supports it.
