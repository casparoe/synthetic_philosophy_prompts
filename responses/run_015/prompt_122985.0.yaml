          3.  *Reviewer Immunity:* Reviewers aren't penalized/credited for outcomes (outcome blindness for individuals).
          4.  *Outcome-Only Training + Trace Diagnosis:* Models trained on task success, not step quality. Yet, traces are emitted, retained, and used for post-incident diagnosis.
          5.  *Group Bonus:* Based on outcomes (incidents, error rates).
      *   **The Tension:** Outcomes are irrelevant for individual judgment but central for group reward/training. Traces are ignored for training but central for diagnosis.
      *   **The Goal:** Write out the *implicit theory* of this practice. Do not give a verdict on who is right (Platform Eng vs. Legal).
