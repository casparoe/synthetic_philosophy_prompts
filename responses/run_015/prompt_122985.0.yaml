      *   *Correction on (iv):* The "Abstention" problem is critical. If Unverifiable = Pass, and Reviewers are weak, they will mark everything Unverifiable. The system relies on *Reviewer Conscientiousness* which isn't incentivized. I need to highlight this fragility.
      *   *Tone:* Keep it analytical, philosophical, and operational. Avoid saying "this is bad." Say "this presupposes X."

  5.  **Final Polish:** Check against all constraints in the prompt.
