      *   *The "Sealed-Step" Logic:* This is fundamentally *Foundationalist* or *Atomistic*. It assumes safety is compositional. If $Step_1$ is safe AND $Step_2$ is safe... THEN $Action$ is safe.
      *   *The "Unverifiable" Logic:* This is a *Default to Action* or *Presumption of Competence* for the agent, bounded by explicit vetoes. It shifts the burden of proof to the human to find fault, rather than prove safety.
      *   *The "Outcome Blindness" Logic:* This is *Deontological* for the reviewer (duty-based) vs. *Consequentialist* for the organization. It protects the human from "moral luck."
