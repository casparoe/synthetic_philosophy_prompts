      *   **Section 6: Counterfactuals (Dropping Presuppositions).**
          *   *Scenario A: Outcome-Only Supervision.* Remove step review. Rely on post-hoc monitoring. *Break point:* High-stakes irreversible actions (vendor bank details) need pre-check. Reviewers become auditors, not gatekeepers.
          *   *Scenario B: Process-Only Supervision.* Train on step quality. Reward "good reasoning." *Break point:* Model becomes sycophantic (reasoning that looks good but fails). Reviewers need ML training to judge reasoning quality.
          *   *The "Weaker Reviewer" Constraint:* This is crucial. If reviewers can't understand the steps, "sealed-step" is theater. If they abstain = approve, they will abstain.
