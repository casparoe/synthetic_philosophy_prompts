  6.  (Mental Check of the "Theory"): The theory is essentially **Procedural Containment of Black Box Agency**. It treats the LLM as a dangerous but useful force that must be channeled through narrow pipes (steps) checked by humans who are legally protected but operationally limited. It prioritizes *auditability* over *prevention* in the long run, but uses *prevention* theater for immediate risk mitigation.

