          *   *Holistic Critique:* A holistic epistemologist (coherentist) would argue context determines meaning. A step looks fine in isolation but is part of a "jailbreak" or "logic bomb" sequence.
          *   *Independence:* Strictly, it requires error independence. If errors correlate (e.g., model drift affects all steps similarly), the chain fails.
