answer: |-
  Eli stood before the refrigerated cases, the hum of the freezers vibrating in his chest as he tapped a pencil against his small notebook. He scanned the price tag on the chicken breasts and wrote down the acreage needed to grow their corn feed.

  His ledger showed that the grain required for this poultry meant hundreds of field mice and insects lost per pound of meat. The numbers stacked up quickly in the margin, outweighing the single bird killed for the tray.

  Satisfied that the grass-fed beef required less crop land and therefore fewer unintended deaths, Eli reached for the heavier package on the lower shelf. The plastic wrapped tight around the red meat felt solid in his palm.

  He glanced back at the top of the page where he had written that one year of a chicken's life equaled one year of a mouse's life. The pencil mark blurred slightly under the fluorescent lights, making the distinct creatures look like identical entries in a bank book.

  Eli set the beef down next to the chicken and walked away empty-handed. He wasn't sure the comparison held up now that he stopped pretending different kinds of lives could be weighed on one scale.
