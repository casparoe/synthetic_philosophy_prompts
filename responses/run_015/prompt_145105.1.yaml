      *   *Section 4: Defensibility and Costs.*
          *   *View 1: Counterfactuals Matter (A yes, B no).*
              *   *Pros:* Avoids Blockhead/Triviality. Preserves functionalism.
              *   *Cons:* Moral status is modal (depends on possible worlds). Moral status is extrinsic (depends on environment tuning).
          *   *View 2: Actual Behavior Matters (A yes, B yes).*
              *   *Pros:* Moral status is categorical/actual.
              *   *Cons:* Vulnerable to Glut/Blockhead.
          *   *Conclusion:* The most defensible view within computational functionalism is that counterfactuals matter. This commits us to moral status being intrinsic to the *dispositional* causal structure. However, this is costly. It implies a "zombie" possibility where a system behaves identically but lacks status due to hidden fragility.
          *   *Wait, one nuance:* If B is physically distinct in a way that makes it fragile, that difference is intrinsic *now*, even if the fragility is only revealed counterfactually. The *disposition* is a current property. So it's not fully extrinsic.
          *   *Final Verdict:* The requirement for counterfactual robustness is necessary to avoid triviality, but it forces us to accept that moral status is a matter of *capacity* (disposition), not just *occurrence*. This commits us to a realist view of causal powers/dispositions.

  7.  **Refining the Language:**
      *   Ensure American English spelling (organization, behavior, etc.).
      *   Maintain philosophical precision (e.g., distinguishing between "intrinsic" and "dispositional").
      *   Check that all parts of the prompt are addressed. (Glut/Grain/Approximation explanation, Glut/Approximation interaction, Case Study analysis, Defensibility/Costs).

