      *   *Check:* Is the distinction between Intrinsic and Interpretive clear? Intrinsic = it's in the physics. Interpretive = we decide the mapping. The counterfactual view tries to be Intrinsic (dispositions are real) but risks looking Interpretive (how much robustness is enough?).
      *   *Adjustment:* Make sure to highlight that if we choose the counterfactual route, we avoid the "interpretation" charge but take on the "modal" burden.

  9.  **Final Polish:** Organize with clear headings for readability. Ensure the conclusion directly answers the "which answer is most defensible" prompt. (I will argue that the counterfactual view is standard for functionalists but carries heavy metaphysical baggage).

