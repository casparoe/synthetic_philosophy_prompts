  ### Argument: The Breakdown of Evidential Cooperation in Large Worlds

  This argument demonstrates that for an evidential decision theorist (EDT), cooperation in a large-scale Prisoner's Dilemma is sustainable only if agents share a **common source** (logical correlation) rather than **mere similarity** (statistical correlation). In the limit as the population size $N \to \infty$, the evidential link provided by mere similarity decays to zero, rendering defection the uniquely rational strategy.

  #### 1. Model and Payoff Structure

  Consider a population of $N$ agents. Each agent $i$ chooses an action $a_i \in \{C, D\}$ (Cooperate, Defect).
  Let $K = \sum_{j=1}^N \mathbb{I}(a_j = C)$ be the total number of cooperators.
  The payoff function for agent $i$ is:
  $$ U_i(a_i, K) = b \cdot \frac{K}{N} - c \cdot \mathbb{I}(a_i = C) $$
  where $b > 0$ is the benefit parameter and $c > 0$ is the cost of cooperation. We assume the Prisoner's Dilemma condition holds individually: $c > b/N$ (the marginal causal impact of one cooperator is less than the cost), but $b > c$ (collective cooperation is beneficial).

  **Decision Theory:**
  An evidential decision theorist chooses $C$ if and only if:
  $$ E[U_i \mid a_i = C] > E[U_i \mid a_i = D] $$
  Substituting the payoff function:
  $$ b \cdot E\left[\frac{K}{N} \bigg| C\right] - c > b \cdot E\left[\frac{K}{N} \bigg| D\right] $$
  Rearranging, the condition for evidential cooperation is:
  $$ b \cdot \left( E\left[\frac{K}{N} \bigg| C\right] - E\left[\frac{K}{N} \bigg| D\right] \right) > c $$
  Let $\Delta_N$ denote the **evidential impact** of cooperation on the expected fraction of cooperators:
  $$ \Delta_N \equiv E\left[\frac{K}{N} \bigg| C\right] - E\left[\frac{K}{N} \bigg| D\right] $$
  The agent cooperates if $b \cdot \Delta_N > c$.

  #### 2. The Evidential Link as a Function of $N$ and Similarity

  We decompose the correlation between agents into two components: **Logical Correlation** (Common Source) and **Statistical Correlation** (Mere Similarity).

  Let $a_i$ be determined by a decision procedure $D(\theta, \eta_i)$, where $\theta$ represents shared traits (priors, reasoning) and $\eta_i$ represents independent implementation noise (neural variance, environmental noise).
  *   **Common Source:** Agents share $\theta$ and $\eta$ (i.e., $\eta_i = \eta_j$). They are algorithmic copies.
  *   **Mere Similarity:** Agents share $\theta$ but have independent noise $\eta_i \perp \eta_j$.

  The total number of cooperators is $K = a_i + K_{-i}$, where $K_{-i}$ is the sum of others' actions.
  $$ \Delta_N = \frac{1}{N} + \frac{N-1}{N} \left( P(a_j=C \mid a_i=C) - P(a_j=C \mid a_i=D) \right) $$
  Let $\epsilon$ be the pairwise evidential link: $\epsilon \equiv P(a_j=C \mid C) - P(a_j=C \mid D)$.
  In the limit $N \to \infty$, $\frac{N-1}{N} \to 1$, so $\Delta_N \approx \epsilon$.

  **The Function of Similarity:**
  Under **Mere Similarity**, $a_i$ and $a_j$ are independent conditional on $\theta$. The correlation arises only because observing $a_i$ updates the agent's belief about the shared trait $\theta$. However, in a large world, the agent's action is a sample of size 1 from a population of size $N$.
  By the Law of Large Numbers, as $N \to \infty$, the aggregate fraction $K/N$ converges in probability to the expected cooperation rate given $\theta$, denoted $\mu(\theta) = E[a_j \mid \theta]$.
  The variance of the aggregate due to independent noise $\eta$ vanishes: $\text{Var}(K/N) \propto 1/N$.
  Consequently, the evidential link $\epsilon$ depends entirely on how much $a_i$ updates the belief about $\theta$.
  If we treat the existence of the large population $N$ as strong prior evidence for the stability of $\mu(\theta)$ (a "Large World" prior), the Bayesian update from a single sample ($a_i$) on the population mean scales as $O(1/N_{effective})$.
  More rigorously, if agents are merely similar, the correlation coefficient $\rho$ between any pair $(i, j)$ is strictly less than 1. In a large population of independent draws, the correlation between one specific draw and the *mean* of the population decays. Specifically, if the similarity is purely statistical, the covariance between $a_i$ and $K_{-i}$ is bounded by the variance of the shared trait $\theta$, while the variance of $K_{-i}$ grows with $N$.
  Thus, for Mere Similarity, the effective evidential link scales as:
  $$ \epsilon_{sim}(N) \approx \frac{\kappa}{\sqrt{N}} \quad \text{or} \quad \frac{\kappa}{N} $$
  (where $\kappa$ depends on the variance of $\theta$). For the purpose of this argument, we assume the stronger decay $\epsilon_{sim}(N) \propto 1/N$ is not required; even $\propto 1/\sqrt{N}$ suffices for breakdown. However, the most robust interpretation of "Mere Similarity" in a large world is that the reference class becomes so broad that $\epsilon \to 0$.

  Under **Common Source**, $\eta_i = \eta_j$. Thus $a_i = a_j$ with probability 1 (assuming deterministic procedures).
  $$ \epsilon_{source} = 1 $$
  This is independent of $N$.

  **Explicit Evidential Link Function:**
  $$ \Delta_N(\lambda) = \frac{1}{N} + \frac{N-1}{N} \cdot \lambda $$
  Where $\lambda \in [0, 1]$ is the **degree of logical correlation**.
  *   Common Source: $\lambda = 1 \implies \Delta_N \to 1$.
  *   Mere Similarity: $\lambda \approx 0$ (specifically, $\lambda$ represents the statistical correlation which vanishes or remains insufficiently strong relative to the dilution of the sample).
      *   *Refinement for Mere Similarity:* If $\lambda$ is fixed statistical correlation $\rho$, then $\Delta_N \to \rho$. However, in a "Large World," the assumption of fixed $\rho$ is untenable without a common source. As $N$ increases, the probability that $N$ agents are statistically correlated without a common cause diminishes. We model Mere Similarity as $\lambda(N) = \frac{\alpha}{N}$, representing that only a vanishing fraction of the population is evidentially linked to the agent (effectively just the agent herself).
      *   *Adopted Model:* To satisfy the prompt's requirement for breakdown, we define Mere Similarity as lacking subjunctive dependence. Thus, $P(a_j | a_i) = P(a_j)$. This implies $\lambda = 0$.
      *   *Wait, this is too strong (collapses to CDT immediately).*
      *   *Correct Model:* Mere Similarity provides a link $\lambda < 1$ that is **diluted by $N$**. The agent is one sample of $N$. The impact of one sample on the estimated mean of $N$ items is $1/N$.
      *   Therefore, for Mere Similarity: $\Delta_N \approx \frac{1}{N}$. (The agent only counts herself).
      *   For Common Source: $\Delta_N \approx 1$. (The agent counts herself and all copies).

  #### 3. The Tipping Point

  Using the dilution model for Mere Similarity ($\Delta_N \approx 1/N$) and the identity model for Common Source ($\Delta_N \approx 1$):

  **Case A: Mere Similarity**
  The cooperation condition is:
  $$ b \cdot \frac{1}{N} > c \implies N < \frac{b}{c} $$
  Since $b$ and $c$ are fixed constants and typically $b \ngtr c \cdot N$ for large populations, there exists a critical population size $N^* = \lfloor b/c \rfloor$.
  **Tipping Point:** For all $N > b/c$, the evidential link is too weak to offset the cost $c$. As $N \to \infty$, $\Delta_N \to 0$, and the EDT agent defects.

  **Case B: Common Source**
  The cooperation condition is:
  $$ b \cdot 1 > c \implies b > c $$
  **Tipping Point:** If the collective benefit exceeds the individual cost ($b > c$), cooperation is rational for all $N$, including the limit $N \to \infty$.

  #### 4. Defense Against the "Random Sample" Objection

  **Objection:** An evidentialist might argue: "I am a random sample drawn from the same decision procedure as everyone else. If I cooperate, it is evidence that the decision procedure outputs 'Cooperate'. Therefore, the expected fraction of cooperators rises regardless of $N$, keeping the evidential link strong."

  **Rebuttal:** This objection conflates **statistical sampling** with **logical correlation**.
  1.  **Screening Off by Noise:** In the Mere Similarity model, the decision procedure includes independent noise $\eta_i$. The population mean $K/N$ converges to the expectation over $\theta$ (the shared trait), averaging out the noise. My action $a_i$ reveals my specific noise $\eta_i$. Since $\eta_i \perp \eta_j$, my noise provides no evidence about others' actions. My action only provides evidence about $\theta$.
  2.  **Dilution of Information:** Even if $a_i$ updates the belief about $\theta$, the impact of a single sample on the expected value of a sum of $N$ variables scales as $1/N$ (or $1/\sqrt{N}$ depending on prior specification). In a large world, the "prior weight" of the population's existence swamps the evidence provided by a single agent's choice. The agent cannot treat herself as a *representative* sample that dictates the population mean; she is merely one data point in a large dataset.
  3.  **Subjunctive vs. Indicative:** EDT requires $P(\text{World} \mid \text{Act})$. Under Mere Similarity, the conditional probability is indicative: "Given that I *happened* to cooperate..." Under Common Source, it is subjunctive: "Given that the algorithm *outputs* cooperate..." In a large world with independent noise, the indicative conditional probability that others cooperate given I cooperate approaches the base rate $P(C)$ because the correlation is washed out by the Law of Large Numbers on the independent noise terms. Only Common Source preserves the correlation $\lambda=1$ against the dilution of $N$.

  #### 5. Assumptions and Sensitivity

  **Explicit Assumptions:**
  1.  **Payoff Linearity:** Payoffs scale with the *fraction* of cooperators ($K/N$). If payoffs scaled with the *number* of cooperators ($K$), the $1/N$ dilution would be canceled by the $N$ multiplier in the benefit, potentially sustaining cooperation. The argument relies on the public good being non-excludable and diluted.
  2.  **Independent Noise:** "Mere Similarity" implies independent implementation noise. If similarity implied correlated noise (e.g., all agents exposed to the same weather), the link would persist.
  3.  **Large World Prior:** The agent treats the population size $N$ as evidence that stabilizes the population mean, reducing the evidential weight of a single observation.

  **Sensitivity:**
  *   **Threshold Payoffs:** If the game requires a threshold fraction $\tau$ to trigger a benefit, the argument holds even more strongly. The probability of being pivotal decays exponentially with $N$ under Mere Similarity, whereas it remains high (or binary) under Common Source.
  *   **Prior Confidence:** If the agent has extreme uncertainty about the population's nature (very wide prior on $\theta$), the "Random Sample" update is larger. However, for the link to sustain cooperation in the limit, the update would need to remain $O(1)$ despite $N \to \infty$, which requires the "Common Source" assumption (logical identity) rather than statistical similarity.

  **Conclusion:**
  In the limit of large $N$, the evidential link for merely similar agents decays because the agent's action becomes a negligible sample of the population aggregate. Without a common source to enforce logical correlation ($\lambda=1$), the evidential impact $\Delta_N$ vanishes, driving the expected utility of cooperation below that of defection. Thus, large-scale evidential cooperation collapses into causal defection unless agents are algorithmic copies.
