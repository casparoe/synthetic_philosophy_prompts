answer: |-
  This is an exceptionally astute observation for a Lower Sixth student, and you are quite right to suspect that it is not merely a spurious unity. You have identified a genuine tension in the philosophy of collective identity and moral responsibility. While there is no single, universally agreed-upon term that captures the *asymmetry* of the boundary-flexing you describe, there are several established concepts in social psychology and political philosophy that carve up this terrain.

  To assist you with your Extended Project, I shall break this down into the psychological mechanisms, the philosophical concepts, and the question of whether a defensible version of this move exists.

  ### 1. The Psychological Mechanism: BIRGing and CORFing

  In social psychology, the behaviour you describe regarding sports victories and immediate scandals is well-documented. The phenomenon of claiming credit for a group's success is known as **BIRGing** (Basking In Reflected Glory). Conversely, distancing oneself from a group's failure is known as **CORFing** (Cutting Off Reflected Failure).

  These terms were coined by Robert Cialdini and colleagues in the 1970s. They observed that after a university football win, students were significantly more likely to wear university-branded clothing and say "we won" than after a loss, when they would say "they lost."

  **How this fits your case:**
  This explains the *impulse* behind the behaviour. It is a protective mechanism for self-esteem.
  **Where it falls short:**
  BIRGing and CORFing are typically descriptive of immediate, voluntary associations (like sports teams). They do not fully account for the historical and moral dimensions you are exploring. They explain *why* people do it, but they do not address whether the move is logically coherent or morally permissible when applied to a nation-state spanning centuries. Furthermore, psychology treats this as a bias to be corrected, whereas you are asking if there is a principled justification for it.

  ### 2. The Philosophical Concepts: Collective Responsibility and Continuity

  When we move from psychology to philosophy, the discussion shifts to whether the "we" persists over time. This is the problem of **Diachronic Collective Identity**.

  **The Problem of Collective Guilt**
  Most contemporary philosophers (such as Hannah Arendt and Karl Jaspers) distinguish between *criminal guilt* and *political responsibility*.
  *   **Criminal Guilt:** Requires individual agency. You cannot be criminally guilty of a crime you did not commit. Therefore, you are right that it sounds strange to say, "I am guilty of slavery in 1830."
  *   **Political Responsibility:** This arises from membership in a political community. Arendt argued that we are responsible for things we have not done because we are members of a polity that persists over time.

  **The Flexing Boundary**
  The pattern you noticed—where the group expands for credit and contracts for blame—is often criticised as **Special Pleading** or **Motivated Reasoning**. However, in the context of national identity, it touches upon the **Non-Identity Problem** (associated with Derek Parfit). This is the logical puzzle that if the past had been different (e.g., no empire), the specific people alive today might not exist. Therefore, how can the present "we" be responsible for the past "we"?

  **Which concept is closest?**
  The closest philosophical concept to your specific observation of the *flexing boundary* is what is sometimes called **Selective Collective Continuity**. While not a fixed technical term like "BIRGing," it is a recognised argumentative strategy in debates about reparations and patriotism. It occurs when a speaker treats the nation as a continuous moral agent when it suits their narrative (to claim assets or heritage) and as a discontinuous series of individuals when it does not (to avoid liabilities).

  ### 3. Is it One Phenomenon or Two?

  You asked whether you have wrongly lumped distinct phenomena together. I would suggest there are actually **two distinct moves** being made, which often look the same but have different logical structures.

  **Move A: The Opportunistic Shift (The Hypocritical Version)**
  This is when the criteria for membership change solely based on the moral valence of the event.
  *   *Logic:* "Newton is English, so his genius is ours. But the slave trader was English, so his crimes are not ours."
  *   *Verdict:* This is logically inconsistent. If Englishness is the criterion for inclusion, it must apply to both the scientist and the slave trader. This is the version that is vulnerable to the charge of special pleading.

  **Move B: The Normative Shift (The Principled Version)**
  This is when the speaker changes the *definition* of what the nation is, depending on whether they are discussing pride or responsibility. This is where your "critic" friends fit in.
  *   *Logic:* "The nation is defined by its ideals (liberty, justice). When the past lived up to these ideals, it was truly 'us' (pride). When the past betrayed these ideals (slavery), it was a betrayal of 'us', and therefore we must repair it, even if we didn't do it."
  *   *Verdict:* This is logically consistent, provided one accepts a **Civic Nationalist** view of identity.

  ### 4. Is There a Defensible Version?

  You asked if there is a principled story on which a community can be a source of pride without being a source of responsibility, or vice versa. There are two strong philosophical defences for the asymmetries you observed.

  **Defence 1: Responsibility without Guilt (The Critics' Position)**
  Your friends who accept responsibility for historical wrongs but refuse patriotic pride are likely relying on the argument of **Unjust Enrichment** or **Structural Injustice** (associated with philosophers like Iris Marion Young or Janna Thompson).
  *   **The Argument:** You do not need to have committed the act to inherit the *liability*. If you benefit from the infrastructure, wealth, or global position created by past wrongs (e.g., the British economy benefiting from the Industrial Revolution, which was partly funded by slave wealth), you inherit an obligation to rectify the lingering effects.
  *   **Why no pride?** They may argue that pride requires *agency* and *virtue*. You cannot be proud of something you did not do. But you can be responsible for cleaning up a mess you inherited. Thus, the asymmetry is defensible: Liability passes through benefit; Honour passes through action.

  **Defence 2: Pride without Responsibility (The Patriots' Position)**
  Conversely, can one claim the scientist but reject the slave trader? This is defensible under a theory of **Critical Patriotism** or **Constitutional Patriotism** (associated with Jürgen Habermas).
  *   **The Argument:** The "nation" is not a biological or historical constant, but a project based on shared values. When a historical figure embodies those values (e.g., a scientist pursuing truth), they are embraced as part of the national story. When a historical figure violates those values (e.g., a slave trader violating liberty), they are cast out as an aberration.
  *   **The Flexing Boundary:** Here, the boundary does not flex hypocritically; it filters. The "we" is defined by adherence to the national ideals. The slave trader is treated as belonging to a "different entity" because, in a moral sense, he betrayed the entity's defining principles.
  *   **The Weakness:** The danger here is historical sanitisation. If you only claim the bits you like, are you engaging with the real country or a fantasy version of it?

  ### Summary for Your Project

  To answer your specific questions directly:

  1.  **Is there an established name?**
      There is no single noun for the asymmetry itself. In psychology, it is covered by **BIRGing/CORFing**. In political philosophy, it is discussed under **Collective Responsibility**, **Diachronic Identity**, and **Historical Justice**. The specific rhetorical move of shifting criteria is often called **Motivated Reasoning** or **Special Pleading**, though as you note, these terms imply a fallacy rather than a principled stance.

  2.  **Which concepts fit partly?**
      *   **BIRGing/CORFing:** Fits the psychological impulse but ignores the moral argument.
      *   **Collective Guilt:** Fits the discussion of blame but is usually rejected by philosophers (who prefer 'responsibility').
      *   **Civic Nationalism:** Fits the defensible version of the "flexing boundary" (filtering by values).

  3.  **Is it one phenomenon or several?**
      It is best treated as two. One is the **psychological bias** (protecting self-esteem), which is generally indefensible. The other is the **philosophical distinction** between inheriting liabilities (via benefit) versus inheriting honours (via virtue), which can be defensible.

  4.  **Is there a defensible version?**
      Yes. The most robust defence is that **responsibility is forward-looking** (what must we do now to fix lingering injustice?) while **pride is backward-looking** (what did we actively achieve?). One can argue that current citizens inherit the *debts* of the state (because they benefit from its continuity) but not the *moral merit* of ancestors (because merit requires personal agency). Alternatively, one can argue that the "nation" is a moral project, and we only claim ownership of the parts of history that align with that project.

  For your EPQ, I would suggest focusing on the distinction between **causal responsibility** (I did it) and **political responsibility** (I belong to the group that did it). The "flexing" you observe is often people trying to navigate between these two without admitting they are switching definitions. If you can expose when they are switching definitions opportunistically versus when they are doing so on a principled basis (e.g., distinguishing between benefit and virtue), that will be a sophisticated contribution to your project.

  Good luck with the writing; it is a mature and nuanced topic.
