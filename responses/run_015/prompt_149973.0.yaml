answer: |-
  This is such a rich angle for Chapter Three. Honestly, it's way more interesting than the standard "wise survivor" trope. That trope is everywhere—the character comes back from the brink and suddenly speaks in riddles that everyone treats like gospel. But your instinct is spot on: extreme transformation doesn't necessarily upgrade your operating system; sometimes it just changes the hardware so much the old software won't run.

  Here's a way to build out that argument for your drafting, keeping it loose and focused on the mechanics of language and isolation.

  ### 1. The Myth of the "Wounded Oracle"
  First, let's look at why everyone around her thinks she's wise. It's not because she actually *is*; it's because *they* need her to be.

  When people survive something catastrophic, the living project meaning onto them. It's a defense mechanism. If the person who almost died comes back with "Secret Truths," then the death/trauma wasn't random. It was a transaction. They paid with pain and bought wisdom. That comforts the people left behind. It suggests there's a logic to the universe.

  So, when your character stumbles or says something vague, her friends/family fill in the blanks with their own hopes. They nod and say, "She knows things we don't." But she doesn't. She just knows *different* things that are often useless to daily life. The "authority" people give her is actually a form of objectification. They aren't listening to her; they're listening to what they want the trauma to mean.

  ### 2. The Fracture of Shared Language
  Here's the core of your argument: **Communication requires a shared map.**

  To explain something to you, I have to use concepts we both understand. I say "hot," you remember touching a stove. I say "grief," you remember losing a pet. We are standing on the same conceptual ground.

  But a near-death experience (or becoming a parent, or severe trauma) doesn't just add new data to your brain; it terraforms the landscape. It burns the bridges back to the "before" world.
  *   **The Vocabulary Gap:** She literally lacks the words to explain it, not because she's humble, but because the words don't exist in the common language. "Love," "fear," "time"—all those words mean something different to her now. If she uses the old words, she's lying. If she tries to use new words, no one understands them.
  *   **The Translation Error:** When she tries to speak, she's translating from a language no one else speaks into a language she no longer fully inhabits. The nuance gets lost. The "wisdom" people hear is actually just the distortion caused by that bad translation.

  So, she isn't an authority. She's an exile. She's standing on one side of a glass wall, banging on it, and everyone on the other side is treating her silence like it's a sermon.

  ### 3. Why Authority Fails
  Authority implies you can guide someone. A teacher can lead a student because they both agree on what "learning" looks like. But your character can't guide anyone back to where she is, because *no one wants to go there*.

  If she says, "Everything you worry about is meaningless," she thinks she's sharing a liberating truth. But to her friend worried about rent, that's not wisdom; it's unhelpful nonsense. The friend needs the worry to be real to function.
  *   **The Intuition Failure:** We assume suffering creates empathy or clarity. But often, suffering creates specificity. It makes you an expert in *your* specific hell, not an expert on *life*.
  *   **The Credibility Trap:** The more she tries to explain the change, the more she sounds "off" to everyone else. So she stops trying. And her silence is what people interpret as depth. It's a feedback loop of misunderstanding.

  ### 4. How this plays out in Chapter Three
  If you want to dramatize this argument without it feeling like a lecture, think about the friction in her conversations.

  *   **The "Aha" Moment that isn't:** She says something plain and literal about her experience (e.g., "It wasn't peaceful, it was just loud"). Everyone interprets it metaphorically ("Oh, the noise of life, so profound"). She realizes they aren't hearing her.
  *   **The Frustration:** Show her getting annoyed that her actual reality is being turned into a self-help bumper sticker. She wants to say, "I'm not wise, I'm just broken/different," but she knows they won't hear that either.
  *   **The Isolation:** The realization that she can't actually warn them or help them. If they asked, "How do I prepare for death?" she can't answer. Because preparing implies you can take the experience with you, and she left everything behind.

  ### The Takeaway for the Character Arc
  The tragedy isn't that she has secrets she can't tell. The tragedy is that **there is nothing to tell that would make sense.**

  The "wisdom" is a mirror the other characters are holding up. Your character's journey might be realizing she can't be their oracle. She has to accept that she's lost the common language, and maybe the goal isn't to teach them, but to find a new way to exist without needing their validation. She's not a guru; she's a refugee from a place no one else has visited.

  Does that vibe with where you're taking the chapter? It gives you a lot of room for internal monologue where she's screaming internally while everyone else treats her like a serene Buddha.
