prompt: |-
  I am writing a DPhil thesis in bioethics on the determination of death, and I sit as the lay-philosophical member of my teaching hospital's Determination of Death Working Group. The Group has been asked to approve a retrieval protocol it has never considered, and I have been asked to draft the minute. What I need from you is the reasoning rather than any references: an account of which principle the Group has in fact been applying across its own previous rulings, and what that principle requires of it now.

  The Group's record, as I read it:

  1. It accepted a neurological determination of death in a patient whose heart was still beating and whose body remained warm and perfused, and it permitted organ recovery in that state, minuting that the organism as a whole had died even though its parts had not.
  2. Where clinical brainstem testing was equivocal because some neuroendocrine function appeared preserved, it declined to confirm death on clinical grounds alone and required an ancillary study of cerebral perfusion; it confirmed death when that study showed absent intracranial flow.
  3. It declined a family's request, made on religious grounds, to disregard a neurological determination, but allowed a fixed short period of continued support so that relatives could gather, and refused to extend it indefinitely.
  4. It refused a family's request to declare death in a patient in a permanent vegetative state, on the ground that loss of consciousness is not one of the criteria it recognises.
  5. In controlled donation after circulatory death it insists on five minutes of continuous asystole before determination, and it rejected a proposal to accept ninety seconds, minuting that auto-resuscitation must be excluded and that the fact that no one intends to restart the heart is not by itself enough.
  6. When a patient had a witnessed arrest, failed cardiopulmonary resuscitation, and was then cannulated for extracorporeal support, the Group refused to record that the patient had died during the arrest: it treated the institution of support as resuscitation and the patient as living on support, whose treatment was later withdrawn.
  7. It permitted continued somatic support of a pregnant patient after a neurological determination of death, for foetal benefit, and minuted that the patient was dead and that what was being sustained was a part of her body.
  8. It has repeatedly approved ex situ normothermic machine perfusion of retrieved kidneys and livers without treating the reperfusion of an organ as casting doubt on the donor's death.

  The new proposal concerns a forty-one-year-old with a devastating brain injury who does not meet neurological criteria, from whom treatment is to be withdrawn. Cannulae are to be placed in the femoral vessels beforehand, and heparin given, while the patient is still alive. After asystole and the Group's usual five-minute interval, death is to be determined by circulatory criteria; an occlusion balloon is then to be inflated so that the cerebral and coronary circulations are excluded, and in-situ normothermic regional perfusion of the abdominal organs is to be run from an extracorporeal circuit. The patient's heart is to remain asystolic and will not be recovered.

  What I would like from you: the candidate rules that fit the record as a whole — several do, and they do not agree here; what each predicts both about the declaration of death and about the pre-arrest cannulation and heparinisation; your recommendation for the decision that would best cohere with the Group's own precedents, with the closest analogue identified and the reasons for preferring it; and, for each of the two live options, a sentence or two of wording the Group could minute as the principle it is thereby adopting, together with an honest note of where its precedents simply run out. One member says the sixth item settles the case; another replies that perfusing the abdomen with the brain excluded is not resuscitation; a third says the fifth item does the work; a fourth says the eighth shows reperfusion is not the issue. Please also tell me which part of their disagreement is substantive and which is only about how far the word circulation extends.

  Finally: I had thought the case that would tell these rules apart would be a proposal to begin regional perfusion after only ninety seconds of asystole. Does that case actually discriminate between the surviving rules, and is there a better one? And please mark clearly any part of this the Group should refer elsewhere — to the coroner, to the trust's legal advisers, or to the courts — rather than settle for itself. I would be grateful for British English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** DPhil candidate in bioethics, lay-philosophical member of a hospital's Determination of Death Working Group.
      *   **Task:** Draft reasoning for a minute regarding a new retrieval protocol (NRP - Normothermic Regional Perfusion) that the Group hasn't considered before.
      *   **Input:** Eight specific precedents/rulings from the Group's record.
      *   **New Proposal:** 41yo, devastating brain injury (not brain dead), withdrawal of life-sustaining treatment (WLST). Pre-arrest cannulation + heparin. Asystole + 5 min wait. Circulatory death declared. Occlusion balloon (aortic) to exclude brain/heart. In-situ NRP of abdominal organs. Heart remains asystolic.
      *   **Requirements:**
          *   Identify candidate principles/rules fitting the record (acknowledging they may diverge).
          *   Predict outcomes for *declaration of death* and *pre-arrest interventions* under each rule.
          *   Recommend the decision that best coheres with precedents (identify closest analogue).
          *   Provide draft wording for the minute (principle adopted + note on limits).
          *   Address the specific disagreement among members (Item 6 vs. Perfusion vs. Item 5 vs. Item 8).
          *   Distinguish substantive disagreement vs. semantic (definition of circulation).
          *   Evaluate the "90 seconds" counterfactual (does it discriminate rules?).
          *   Identify a better discriminating case if applicable.
          *   Flag issues for external referral (Coroner, Legal, Courts).
          *   Tone/Style: British English, philosophical but practical for a minute, no references needed (reasoning only).

  2.  **Analyze the Precedents (The "Data"):**
      *   1. *Neurological Death (DBD):* Organism as a whole dead, even if parts (heart) working. Perfusion allowed for retrieval.
      *   2. *Equivocal Brainstem:* Required ancillary test (no flow). Confirms death = no intracranial flow.
      *   3. *Religious Objection:* Death is objective; short delay allowed for family, not indefinite.
      *   4. *PVS:* Not dead. Consciousness loss $\neq$ death.
      *   5. *DCD (Circulatory):* 5 mins asystole required. Auto-resuscitation must be excluded. Intention not to restart $\neq$ death.
      *   6. *ECMO after Arrest:* If support started *after* arrest, patient treated as *living on support*. Death not recorded at arrest. (Crucial precedent).
      *   7. *Somatically Supported Dead Pregnant Patient:* Patient dead (neurologically), body parts sustained for fetus.
      *   8. *Ex Situ Perfusion:* Reperfusing organs *after* retrieval doesn't undo death.

  3.  **Analyze the New Proposal (NRP in DCD):**
      *   Patient is *not* neurologically dead (unlike 1, 7).
      *   Death determined by circulatory criteria (unlike 1, 2, 4, 7).
      *   Pre-arrest cannulation/heparin (Antemortem intervention).
      *   Post-mortem regional perfusion (abdomen only, brain excluded).
      *   Heart excluded from perfusion (unlike standard ECMO in Item 6?).

  4.  **Derive Candidate Principles:**
      *   *Principle A: The "Permanent Cessation of Function" Principle (Functional/Irreversibility).* Focuses on Item 5. Death occurs when function stops and won't restart spontaneously or by intervention *intended to sustain life*. If we *choose* not to perfuse the brain/heart, they remain dead.
      *   *Principle B: The "Resuscitation Potential" Principle (Item 6).* If technology exists to restore circulation, and we use it (even regionally), did the patient actually die? Item 6 says if you cannulate for support, they are alive. NRP looks like support.
      *   *Principle C: The "Organism as a Whole" Principle (Item 1 & 4).* Death is the loss of integration. If the brain is excluded (balloon), the body is being perfused but the *organism* (brain-integrated) is dead.
      *   *Principle D: The "Intent and Anatomy" Principle.* Distinguishes between perfusing for *life* (Item 6) vs. perfusing for *organs* (Item 8).

      *Refining the Candidates for the specific conflict:*
      *   *Rule 1 (The "Item 6" Rule):* Any restoration of circulation via mechanical means post-arrest implies the patient was not dead, or is being resurrected. Pre-arrest cannulation anticipates this.
      *   *Rule 2 (The "Item 5 + 8" Rule):* Death is determined by the permanent loss of *relevant* circulation (brain/heart). If those are excluded and not perfused, abdominal perfusion is merely tissue preservation (like Item 8), not resuscitation.

  5.  **Evaluate the Disagreement:**
      *   *Member 1 (Item 6):* Cannulation + Perfusion = Resuscitation = Patient Alive.
      *   *Member 2 (Perfusion/Brain Exclusion):* Brain excluded = No resuscitation of organism = Patient Dead.
      *   *Member 3 (Item 5):* 5 mins asystole passed = Dead. Auto-resuscitation excluded.
      *   *Member 4 (Item 8):* Reperfusion doesn't undo death.
      *   *Substantive vs. Semantic:* Is it about what "circulation" means (whole body vs. regional)? Or is it about the moral status of the intervention (therapy vs. retrieval)? It's largely substantive: Does restoring blood flow to *some* tissues constitute restoring the *patient*?

  6.  **Develop the Recommendation:**
      *   *Coherence:* Item 6 is the strongest challenge. It treats ECMO after arrest as keeping the patient alive. NRP is essentially ECMO after arrest, but regionally restricted.
      *   *Distinction:* However, Item 1 and 7 allow treating a dead body as a vessel for parts. Item 8 allows perfusing parts. The key is the *occlusion balloon*. If the brain and heart are strictly excluded, the *organism* is not being resuscitated.
      *   *Best Fit:* The Group distinguishes between *organismal* life and *somatic* function (Item 1, 7). NRP maintains somatic function of the abdomen but not organismal integration (brain excluded).
      *   *Pre-arrest Cannulation:* This is the trickiest part. Item 6 implies cannulation *for support* makes them alive. But here cannulation is *for retrieval*, not support. However, it happens *before* death. This is ethically distinct but legally sensitive (assault/battery if not consented properly, but ethically, does it hasten death?). The prompt asks about coherence with *death determination* precedents.
      *   *Decision:* Approve NRP *provided* the occlusion is verified. Treat pre-arrest cannulation as permissible preparatory steps (common in DCD) provided they do not cause death.
      *   *Closest Analogue:* Item 7 (Somatically supported dead patient) combined with Item 8 (Ex situ perfusion). The body is being treated as a source of organs after death, not as a patient being saved.
      *   *Wait, Item 6 is a strong counter.* Item 6 says if you cannulate after arrest, they are alive. NRP cannulates after arrest (usually) or before? The prompt says "Cannulae are to be placed... beforehand". This is *ante-mortem* cannulation. Item 6 was *post-arrest* cannulation for *support*.
      *   *Refined Recommendation:* The Group should distinguish between *resuscitation* (restoring organismal function) and *preservation* (maintaining tissue viability). The occlusion balloon is the critical factor.
      *   *Referral:* Pre-arrest cannulation/heparinisation is clinically invasive and potentially hastens death or constitutes battery if not strictly governed. This often requires Legal/Coroner input regarding the "dead donor rule" and consent.

  7.  **Drafting the Response (Iterative Process):**

      *   *Structure:*
          1.  Candidate Principles (Rules).
          2.  Predictions (Death declaration & Pre-arrest).
          3.  Analysis of Member Disagreement (Substantive vs. Semantic).
          4.  Recommendation (Coherence & Analogue).
          5.  Draft Minute Wording.
          6.  The "90 Seconds" Counterfactual.
          7.  Referral Flags.

      *   *Refining Principles:*
          *   *Rule I (The 'Item 6' Strictness):* Mechanical restoration of circulation post-arrest negates death determination.
          *   *Rule II (The 'Item 5 + 8' Functionalism):* Death is permanent loss of *vital* circulation (brain/heart). Regional perfusion of non-vital parts is permissible tissue management.
          *   *Rule III (The 'Item 1' Organismal):* Death is loss of organismal integration. If the brain is excluded, the organism is dead regardless of abdominal perfusion.

      *   *Refining the "90 Seconds" Question:*
          *   Does 90s vs 5 mins discriminate? Item 5 says 5 mins is needed to exclude auto-resuscitation. If you do NRP at 90s, you violate Item 5 regardless of NRP. So, no, it doesn't test the NRP principle, it tests the DCD timing principle.
          *   *Better Case:* NRP *without* the occlusion balloon (i.e., perfusing the brain). That would test if "brain exclusion" is the necessary condition for death.

      *   *Refining Referrals:*
          *   Pre-arrest cannulation/heparin is legally fraught (could be seen as causing harm/death). Needs Legal/Coroner.
          *   The definition of death itself is a matter of law (Code of Practice), but hospital policy interprets it. If the policy pushes the boundary (NRP), Legal advice is essential.

      *   *British English Check:* "Somatic", "Programme", "Centre", "Anaesthesia", "Coroner", "Trust".

      *   *Tone:* Philosophical, precise, advisory for a minute.

  8.  **Final Review against Constraints:**
      *   No references? Yes.
      *   Reasoning only? Yes.
      *   British English? Yes.
      *   Address all member arguments? Yes.
      *   Address the 90s question? Yes.
      *   Address referrals? Yes.

      *(Self-Correction during drafting)*: I need to be careful with Item 6. Item 6 says if you cannulate *after* arrest for *support*, they are alive. In NRP, we cannulate *before* (usually) or immediately after, but for *preservation*. The distinction is intent + anatomical exclusion. I must highlight that Item 6 is the strongest objection but can be distinguished by the *exclusion* of the brain/heart (unlike Item 6 where the whole body was supported).

      *Wait, one nuance:* The prompt says "Cannulae are to be placed... beforehand". This is *ante-mortem*. Item 6 was *post-arrest* cannulation for *support*. This is a key difference. Ante-mortem cannulation for *post-mortem* use is standard in DCD (often), but heparinisation is more controversial. I need to flag the heparin/cannulation as a separate ethical/legal issue from the death determination itself.

      *Let's structure the Candidate Rules clearly.*
      Rule 1: The "No Resuscitation" Rule (based on Item 6).
      Rule 2: The "Permanent Loss of Vital Function" Rule (based on Item 5 & 8).
      Rule 3: The "Organismal Integration" Rule (based on Item 1 & 7).

      *Actually, Rule 2 and 3 converge on the outcome (Death is valid), but Rule 1 diverges.*
      I will present two main competing interpretations.
      Interpretation A (Strict): Any mechanical circulation = Life (Item 6).
      Interpretation B (Nuanced): Mechanical circulation of *non-integrating* parts = Tissue management (Item 1, 7, 8).

      *Referral:* The ante-mortem intervention is the biggest legal risk. The death determination is the biggest ethical risk.

      *Let's write.*
answer: |-
  **To:** The Determination of Death Working Group
  **From:** The Lay-Philosophical Member
  **Subject:** Reasoning for the Minute regarding Normothermic Regional Perfusion (NRP)

  ### 1. Candidate Principles Derived from the Record

  The Group's eight precedents do not articulate a single explicit theory of death, but they imply two competing principles regarding the boundary between *somatic support* and *resuscitation*.

  **Principle A: The 'Mechanical Circulation' Prohibition (The Item 6 Rule)**
  *   **Derivation:** Item 6 establishes that if circulation is mechanically restored after arrest, the patient is treated as living on support, not dead. Item 5 reinforces that the *possibility* of auto-resuscitation must be excluded.
  *   **Requirement:** Death cannot be determined if any mechanical means are employed to restore blood flow to the body, regardless of intent.
  *   **Prediction for New Proposal:**
      *   *Declaration of Death:* Invalid. The institution of NRP constitutes resuscitation. The patient must be recorded as living on support until the machine is withdrawn.
      *   *Pre-arrest Cannulation:* Impermissible. Placing cannulae anticipates a procedure that negates the death determination.

  **Principle B: The 'Organismal Integration' Permission (The Item 1, 7 & 8 Rule)**
  *   **Derivation:** Item 1 and 7 distinguish between the death of the *organism* (brain-integrated) and the function of *parts* (heart, abdomen). Item 8 confirms that reperfusion of parts does not reverse the death of the donor. Item 5 confirms death is established by the permanent loss of *vital* function (circulation to the brain/heart), not necessarily every tissue.
  *   **Requirement:** Death is determined by the permanent loss of circulation to the brain and heart. Circulation restored to the abdomen, provided the brain and heart are strictly excluded, is tissue preservation, not resuscitation of the organism.
  *   **Prediction for New Proposal:**
      *   *Declaration of Death:* Valid. Death occurs at the end of the five-minute interval. NRP is a post-mortem intervention on a corpse.
      *   *Pre-arrest Cannulation:* Permissible as a preparatory step for retrieval, provided it does not hasten death or cause harm inconsistent with palliative care.

  ### 2. Analysis of the Members' Disagreement

  The disagreement among your colleagues is partly substantive and partly semantic, centreing on the definition of 'circulation'.

  *   **The Member citing Item 6** argues substantively that *any* restoration of blood flow via a pump constitutes 'resuscitation'. For them, the machine's action defines the status of the patient.
  *   **The Member citing the occlusion balloon** argues semantically that 'circulation' in the context of death determination refers only to *systemic* or *cerebral* circulation. If the brain is excluded, 'circulation' in the moral sense has not resumed.
  *   **The Member citing Item 5** focuses on the *permanence* of the loss. If the heart is not restarting and won't be perfused, the loss is permanent.
  *   **The Member citing Item 8** focuses on the *moral status of the tissue*. Once dead, organs are objects; perfusing objects does not make them subjects.

  **Substantive vs. Semantic:** The core substantive disagreement is whether the *intent* of the perfusion (retrieval vs. therapy) can alter the *ontological status* of the patient (dead vs. alive). The semantic disagreement concerns whether 'circulation' means 'blood moving in vessels anywhere' or 'blood moving in vessels serving the organism as a whole'. Item 6 suggests the former; Items 1 and 7 suggest the latter.

  ### 3. Recommendation and Closest Analogue

  I recommend the Group adopt **Principle B**. This coheres best with the record as a whole, specifically prioritising the distinction between the *organism* and its *parts* established in Items 1 and 7.

  **Closest Analogue:** **Item 7 (Somatically Supported Pregnant Patient).**
  In Item 7, the Group minuted that a neurologically dead patient could have her body sustained for the fetus. The patient was dead; the body was a vessel. In the NRP proposal, the patient is circulatorily dead; the abdomen is a vessel. The occlusion balloon performs the same ethical work as the neurological criteria in Item 7: it ensures the *integrating function* (the brain) remains offline. To rule otherwise would create an inconsistency where a dead body may be supported for a fetus (Item 7) but not for its own organs (NRP), despite the brain being non-functional in both.

  **Why Item 6 is Distinguishable:** Item 6 involved cannulation for *life support* where the brain was *not* excluded. The intent was resuscitation of the organism. In NRP, the intent is retrieval, and the anatomy of the organism (the brain) is explicitly excluded.

  ### 4. Draft Wording for the Minute

  **Option 1 (If approving NRP under Principle B):**
  > "The Group determines that death is established by the permanent cessation of circulation to the brain and heart. Normothermic Regional Perfusion, provided it strictly excludes the cerebral and coronary circulations via aortic occlusion, constitutes post-mortem tissue preservation rather than resuscitation of the organism. Accordingly, the donor is to be recorded as dead prior to the commencement of perfusion."
  > *Note on Limits:* "This ruling relies on the anatomical exclusion of the brain; it does not extend to protocols where cerebral perfusion is possible or where the five-minute stand-off period is compromised."

  **Option 2 (If rejecting NRP under Principle A):**
  > "The Group determines that the institution of extracorporeal blood flow immediately following circulatory arrest constitutes resuscitation. Consistent with Item 6, a patient placed on such support is to be treated as living until support is withdrawn. Death cannot be determined prior to the cessation of the perfusion circuit."
  > *Note on Limits:* "This ruling treats all mechanical circulation equally; it does not distinguish between perfusion for therapy and perfusion for retrieval, as the physiological effect on the tissues is identical."

  ### 5. The 'Ninety Seconds' Counterfactual

  You asked whether a proposal to begin NRP after ninety seconds (rather than five minutes) would discriminate between the surviving rules.

  **It does not.** Both Principle A and Principle B would reject the ninety-second proposal, but for different reasons. Principle A rejects it because *any* perfusion is resuscitation. Principle B rejects it because Item 5 explicitly requires five minutes to exclude auto-resuscitation. Therefore, the ninety-second case tests the *timing* precedent (Item 5), not the *perfusion* precedent (Items 6 vs 8).

  **A Better Discriminating Case:**
  The case that truly separates Principle A from Principle B is **NRP without the occlusion balloon.**
  *   If the Group would permit NRP that perfuses the head (provided the patient remains unconscious), they are applying Principle A (Perfusion $\neq$ Life).
  *   If the Group rejects NRP that perfuses the head, they confirm that Principle B is the operative rule (Brain Perfusion = Life/Resuscitation).
  *   *Recommendation:* Do not propose this clinically, but use it philosophically to test the Group's consistency.

  ### 6. Matters for External Referral

  There are elements of this proposal that fall outside the Group's ethical remit and require external authority.

  1.  **Pre-arrest Cannulation and Heparinisation (Legal/Coroner):**
      Administering heparin and inserting cannulae *before* death carries a risk of hastening death or causing harm (bruising/bleeding) to a living patient. While ethically justifiable under the principle of double effect if consented, this touches on the law of assault and the Coroner's interest in the cause of death.
      *   *Action:* Refer to the **Trust's Legal Advisers** to confirm consent validity and to the **Coroner** to ensure this does not compromise the certification of death.

  2.  **The Definition of Death (Courts/Code of Practice):**
      While the Group interprets hospital policy, the legal definition of death in England and Wales is governed by the Code of Practice (Academy of Medical Royal Colleges). NRP pushes the boundary of the 'permanent' loss of function.
      *   *Action:* If Legal Advisers are uncertain whether NRP complies with the current Code of Practice regarding the 'permanence' of cessation, the Trust should seek guidance from the **Department of Health** or, in a contested case, the **Courts**.

  3.  **The 'Dead Donor' Rule:**
      If the Group adopts Principle A (that NRP implies the patient is alive), retrieving organs would violate the Dead Donor Rule.
      *   *Action:* This is an internal ethical determination, but if the Group is split, Legal Advisers must confirm whether retrieving organs from a patient on NRP exposes clinicians to criminal liability.

  ### Summary for the Chair

  The Group's record is consistent if it views death as the loss of *organismal integration* (Items 1, 7) rather than the cessation of *all cellular activity* (Item 8). The NRP protocol is coherent with this view *only if* the occlusion balloon is verified. The pre-arrest interventions, however, introduce legal risks regarding the treatment of the living patient that the Group cannot authorise alone. I advise approving the principle of NRP subject to strict anatomical exclusion, but referring the ante-mortem interventions to Legal and the Coroner.
