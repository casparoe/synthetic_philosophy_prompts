answer: |-
  **Dissertation Prospectus**

  **Title:** Compensating Transactions: Justificatory Residue and the Possibility of Genuine Moral Dilemmas

  **Research Question**
  Does the existence of *justificatory moral residue* (specifically, an unavoidable obligation to repair or apologize after a choice) entail the existence of genuine moral dilemmas, even if *deliberative* and *evaluative* residue can be explained away by monist theories?

  **Background and Problem**
  The debate over genuine moral dilemmas typically turns on logical consistency: if morality is a consistent system, two obligations cannot conflict such that both bind an agent simultaneously. The "Consistency Thesis" argues that if you cannot do both, you were never obligated to do both. Opponents appeal to phenomenology (guilt, regret) to argue that dilemmas are real.

  However, both sides conflate the *moment of choice* with the *aftermath*. Drawing on an analogy from distributed systems engineering, we can distinguish between the decision logic (what to output) and the error handling (how to recover state). In engineering, a system can make the "correct" decision to fail while still triggering compensating transactions to repair side effects. Applied to ethics, this suggests a tripartite split of moral residue:
  1.  **Deliberative:** Feelings of regret or anguish.
  2.  **Evaluative:** The judgment that the act performed was, in some respect, wrong.
  3.  **Justificatory:** An ongoing obligation to account for the act (apology, restitution, repair).

  Standard arguments dismiss (1) as merely epistemic (I feel bad because I didn't know the right answer) and absorb (3) into (1). They focus almost entirely on (2). This project argues that (3) is the critical test case. If an agent is *obligated* to apologize for an unavoidable action, this implies a normative debt that the Consistency Thesis cannot easily erase without denying the reality of the harm.

  **Why Standard Moves Fail This Question**
  *   **Agglomeration/Consistency Arguments:** These prove that $O(A) \land O(B)$ is impossible if $\neg \Diamond (A \land B)$. They do not address whether $O(A)$ leaves a normative remainder if $A$ violates $O(B)$. They settle the *input* to the decision, not the *cleanup*.
  *   **Appeals to Residual Guilt:** Defenders of consistency argue guilt is appropriate only for epistemic uncertainty. This neutralizes Deliberative residue but fails to address Justificatory residue. One can know exactly what one ought to have done and still owe reparations for not doing it.
  *   **"Dirty Hands" Exceptions:** These treat dilemmas as rare, political anomalies. This project treats residue as structural to moral agency, akin to unavoidable error states in complex systems.
  *   **Ought/Wrong Conflation:** The debate assumes that if you "ought" to do $X$, doing $X$ cannot be "wrong." The engineering analogy suggests a system can be "correct" to abort a transaction while still acknowledging the abort as a "failure state" requiring logging. Similarly, one might be required to do $X$ even if $X$ constitutes a wrong that demands repair.

  **Methodology**
  This will not be a survey of intuitions. It will be a conceptual analysis using the engineering model as a structural heuristic (not a literal mapping).
  1.  **Define the Split:** Rigorously distinguish Justificatory residue from Deliberative/Evaluative residue using case studies (e.g., tragic choices, promise-breaking due to emergency).
  2.  **Stress Test Consistency:** Attempt to reconstruct the Consistency Thesis while accommodating Justificatory residue. Can one owe an apology for doing exactly what one ought to have done?
  3.  **Analyze the Ought/Wrong Gap:** Investigate whether "obligation to repair" logically entails "violation of obligation." If yes, and the violation was unavoidable, the dilemma is genuine.

  **Work Plan (8 Months, ~1 Evening/Week)**
  *   **Months 1–2 (Mapping):** Literature review focused *only* on moral residue and the Consistency Thesis. Draft definitions of the three residue types. *Goal: 1,500 words of notes.*
  *   **Months 3–4 (Construction):** Draft the core argument: that Justificatory residue survives the Consistency filter. Develop the "compensating transaction" analogy. *Goal: 3,000 words draft.*
  *   **Months 5–6 (Objections):** Anticipate counter-arguments (e.g., "The apology is just a new obligation, not residue"). Refine the Ought/Wrong distinction. *Goal: 2,000 words draft.*
  *   **Months 7–8 (Polish):** Assemble, edit for flow, check word count, add citations with supervisor. *Goal: Final 8,000 words.*

  **Success and Failure Criteria**
  *   **Success:** A demonstration that Justificatory residue cannot be reduced to Deliberative feelings without losing normative force, and that this residue implies a violation of obligation that was unavoidable. The conclusion may be that dilemmas are real, or that "ought" and "wrong" must be decoupled.
  *   **Failure:** If the "obligation to repair" can be convincingly reinterpreted as merely a new, forward-looking obligation (e.g., "I don't owe you because I wronged you; I owe you because you are in need"), the link to dilemmas breaks. If the engineering analogy proves to be merely metaphorical with no logical bite, the project loses its distinctive edge.

  **Feasibility Verdict**
  **Honest Assessment:** This is high-risk for the constraints.
  *   **Word Count:** 8,000 words is very short for a dissertation. You cannot afford a long literature review. You must attack the specific argument immediately.
  *   **Time:** One evening a week is the bottleneck. Philosophy requires "slow thinking" that doesn't fit neatly into 4-hour blocks. You will lose momentum between sessions.
  *   **Recommendation:** Narrow the scope. Drop the "Evaluative" and "Deliberative" categories early (dismiss them in the intro as "absorbable by monism") and spend the entire 8,000 words on the **Justificatory** claim. Do not try to solve the dilemma debate; try to solve whether *apologies* imply *dilemmas*.
  *   **Reframing:** Your three-way split is strong, but (1) and (3) are distractions. The dissertation should be titled something like *"The Obligation to Apologize as Proof of Moral Conflict."* If you try to defend all three categories, you will run out of words. Focus entirely on the "Compensating Transaction" (Justificatory) as the sole evidence for dilemmas.

  **Supervisor Note:** I will need help ensuring the "engineering analogy" is treated as a philosophical heuristic and not a category mistake. I will also need guidance on the specific literature regarding "residue" (e.g., Williams, Marcus) to ensure I am not reinventing the wheel.
