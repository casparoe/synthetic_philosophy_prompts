      *   *The Imperfect Duty Loophole:* This is crucial. Kant says you don't have to help everyone all the time. So "I did not help this freshman pick up his books" is permissible as long as the student wills to help *sometimes*.
      *   *The Hellish Universal:* "I may speak only in monotone." If everyone does this, school is boring but logically possible. Therefore allowed? No, need to frame it as "If the universalized world is one you can rationally will."
      *   *Refining the Jokes:*
