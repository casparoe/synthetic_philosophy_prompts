prompt: |-
  ok so im on student council and we're rewriting the discipline code, and this kid on the committee who's taking a philosophy elective says we should scrap the whole list of rules and just judge every case by running the kids maxim thru the universal law formula, and he is being totally serious. I want to write something making fun of it for the school paper.

  Can you write me a parody page from the new student handbook, deadpan, around 500-600 words, plus a short "maxim intake form" that students have to fill out when they get written up? I want the jokes to come from the actual weak spots of the test, not from made-up ones: kids getting off by piling details into their maxim until it passes ("I may cut the lunch line when I skipped breakfast and its taco day and I have track at 4"), the gap between maxims that totally fall apart when everybody follows them and maxims that would still technically work but nobody would want to go to a school like that, and how the stuff Kant says we only have to do sometimes somehow becomes the stuff you can never get in trouble for skipping. Nobody in the piece should explain what's wrong with the view, just let it come out in the handbook's own voice. Start straight with the handbook page, no intro or commentary.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a parody page from a new student handbook (discipline code) based on a strict Kantian Categorical Imperative (Universal Law Formula) approach, plus a "Maxim Intake Form."
      *   **Context:** Student council rewriting discipline code; one member (philosophy elective student) suggests scrapping rules for Kantian universalization.
      *   **Tone:** Deadpan, serious handbook voice (no winking at the camera, no explicit commentary on why it's wrong).
      *   **Length:** 500-600 words for the handbook page, plus a short form.
      *   **Key Jokes/Weaknesses to Highlight:**
          *   Over-specific maxims to cheat the test ("I may cut line when...").
          *   Universalizable but undesirable outcomes (school becomes hellish but logically consistent).
          *   Perfect duties vs. imperfect duties (things you must never do vs. things you can skip without trouble).
          *   Bureaucratic absurdity of judging every case individually.
      *   **Constraint:** Start straight with the handbook page, no intro or commentary.

  2.  **Deconstruct Kantian Ethics for Satire:**
      *   *Universal Law Formula:* "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
      *   *Weakness 1: Specificity.* If I make my maxim specific enough ("I can lie when..."), it might pass universalization because everyone doing *that specific thing* doesn't cause a contradiction.
      *   *Weakness 2: Imperfect Duties.* Kant says you have a duty to develop talents/help others, but you can choose *when* and *how*. So, a student could argue "I'm not helping anyone today, but I will tomorrow," and technically pass.
      *   *Weakness 3: Rigidity vs. Context.* No room for nuance unless baked into the maxim.
      *   *Weakness 4: Administrative Nightmare.* Every infraction requires a philosophical inquiry into the student's internal reasoning.

  3.  **Drafting - Section 1: The Handbook Page:**
