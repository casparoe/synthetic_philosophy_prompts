          "Note on Imperfect Duties: Failure to promote the ends of others (e.g., tutoring, holding doors) is not punishable unless the student adopts a universal policy of never assisting anyone..."
          "Examples of Approved Universalizations: 'I may talk during instruction when I have a clarifying question.' (Universalized: All students talk when questioning. System functions.)"
          "Examples of Failed Universalizations: 'I may claim lost homework that was never completed.' (Universalized: Trust erodes. Contradiction in conception.)"

