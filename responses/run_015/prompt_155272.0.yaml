answer: |-
  **SECTION 7: CONDUCT AND MORAL REASONING**

  **7.1 The Universalization Protocol**
  Effective immediately, the List of Prohibited Behaviors (Section 6) is nullified. Student conduct will no longer be judged against arbitrary statutes but will be evaluated on a case-by-case basis using the Universal Law Formula. Any student cited for misconduct must submit their action's underlying Maxim to the Discipline Committee for universalization testing. An action is permissible only if the student can rationally will that their Maxim become a universal law applicable to all rational agents within the school community.

  **7.2 Maxim Formulation and Specificity**
  Students must articulate the principle behind their action, not merely the action itself. A Maxim such as "I may cut the lunch line" will fail universalization, as a world where everyone cuts lines renders the concept of a line impossible (Contradiction in Conception). However, maxims containing specific contingent conditions may be accepted provided they do not constitute ad hoc rationalization. 

  For example, the Maxim "I may bypass queue protocols when I have missed breakfast and track practice is scheduled for 4:00 PM" may pass testing, as universalizing this specific condition does not logically collapse the lunch system, provided the Administration verifies the track schedule. Students are advised that overly specific maxims (e.g., "...only on Tuesdays when wearing blue") will be rejected as attempts to game the system. Conversely, maxims that produce universally undesirable outcomes but remain logically consistent are technically permissible. A policy of "I may communicate only in monosyllables" creates a silent school, but as no logical contradiction exists, detention cannot be issued solely for silence.

  **7.3 Imperfect Duties and Discretionary Morality**
  Students must distinguish between Perfect Duties (e.g., do not cheat, do not steal) and Imperfect Duties (e.g., help others, develop talents). Violation of a Perfect Duty results in automatic suspension. However, failure to fulfill an Imperfect Duty is not punishable unless the student adopts a universal policy of total neglect. 

  For instance, a student who refuses to help a peer pick up dropped books cannot be disciplined, provided they do not will a world where *no one* ever helps *anyone*. As long as the student assists someone, somewhere, at some point in the academic year, they remain in compliance with Section 7.3. Similarly, failure to complete optional enrichment coursework is permissible under the doctrine of discretionary talent development. The Administration reserves the right to audit a student's "Will to Help" log annually to ensure non-universalization of neglect.

  **7.4 Adjudication Timeline**
  Due to the philosophical complexity of each case, disciplinary hearings may take 4-6 weeks. Students cited for misconduct remain in class pending metaphysical resolution.

