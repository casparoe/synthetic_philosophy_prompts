          *   *Pros:* Matches intuition ("I could have done otherwise").
          *   *Cons:* How can I have contradictory properties? (Being an editor and not being an editor). Requires a distinction between essential (what makes me me) and accidental (what I happen to do) properties.
      *   *Counterpart Theory:* I exist only in this world. In World B, there is a "counterpart" who is very similar to me but isn't *me*.
          *   *Pros:* Avoids logical contradictions (no one object has contradictory properties).
          *   *Cons:* Feels cold. If that person isn't me, why do I care? It implies my alternative life is lived by a stranger.

  3.  **Drafting - Section by Section:**

