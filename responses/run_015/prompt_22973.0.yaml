  Your instinct is correct: the compositional reply is a shell game that relocates the burden of explanation without discharging it. Millikan's strategy assumes that while selection never targeted "quark," it targeted the cognitive mechanisms that combine simpler representations, thereby deriving the content of the complex state from the functions of its parts. But this merely pushes the question back to the constituent capacities. For combinatorial rules to generate determinate content, the atomic representations they manipulate must already possess determinate content. If the foundational representations are semantically indeterminate, any structure built upon them inherits that indeterminacy. You cannot derive precise novel truth conditions from vague ancestral ones, no matter how sophisticated the logical syntax connecting them. The compositional move presupposes the very semantic stability it is meant to explain.

  As a geneticist, you know selection acts on phenotypes relative to specific environments, not on abstract truths. The "disjunction problem" illustrates this: selection might favor a frog's snap at flies, but it cannot distinguish between "fly," "small moving black spot," or "nutritious speck." The selective history fixes the *utility* of the state, not its specific *referent*. If the atomic units of thought are fixed only by their survival value in the Environment of Evolutionary Adaptedness, their content is tethered to those ancestral fitness conditions. When you combine these fitness-tethered atoms, you do not escape their historical grounding. You get complex states that are useful for survival, but you have no mechanism within teleosemantics to explain why these combinations suddenly latch onto entities like quarks that played no role in that survival.

  Ultimately, the compositional move assumes what it needs to prove: that selection fixes content precisely enough to support recombinant truth. But selection fixes function, and function is defined by past success, not future accuracy regarding unobservables. To claim that combining "particle" and "charge" yields "quark" requires that "particle" and "charge" already refer to mind-independent properties rather than just sensory proxies for survival. Teleosemantics cannot bridge that gap. It explains why we have the cognitive tools to survive, but it cannot explain how those tools, shaped solely by ancestral pressures, magically acquire the semantic reach to describe a universe their ancestors never encountered. The problem of novel content isn't solved by composition; it's just pushed back to the origin of the atoms, where selection remains silent on truth.
