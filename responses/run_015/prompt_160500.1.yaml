answer: |-
  The problem of co-schematic predicates arises because the equivalence schema fixes the extension of 'true' across possible worlds but fails to fix its intension or conceptual content. If *A* is a necessary truth, the predicate 'true and *A*' satisfies the schema necessarily: necessarily, for every *p*, (*p* is true and *A*) iff *p*. Since deflationism claims the schema exhausts the concept of truth, it cannot distinguish truth from 'true-and-*A*'. This is not merely a puzzle about property individuation, which affects substantive theories too, but a specific threat to the deflationist claim that there is *nothing more* to truth than the schema. If multiple distinct concepts satisfy the schema necessarily, the schema underdetermines the concept.

  Regarding the replies you have encountered, the minimality claim fails mechanically. Minimality usually orders properties by extension (subset relations). But necessarily coextensive predicates have identical extensions in all possible worlds; there is no subset relation to exploit. To claim truth is "conceptually" minimal begs the question, assuming precisely what the co-schematic rival denies. The explanatory priority reply is stronger but incurs a theoretical cost. It notes that we accept instances of the truth schema without arithmetic knowledge, whereas accepting instances for 'true and 2+2=4' requires arithmetic. This distinguishes the concepts epistemically. However, this shifts the ground from logic to epistemology and use.

  Your 'twue' case exposes the consequence of this shift. If a community uses 'twue' satisfying the schema but lacks the expressive functions (infinite conjunction, blind endorsement), the deflationist must deny 'twue' is truth. This concedes that the expressive *use* is constitutive of truth, not merely the schema. The schema becomes a symptom of the concept, not its definition. This moves minimalism toward functionalism: truth is whatever predicate plays the logical-expressive role. This is a significant cost, as it admits a substantive fact about the *role* of truth, even if not its *nature*. It implies the deflationist cannot rely on the schema alone; they need a theory of the practice.

  On normativity, if truth is the aim of belief, co-schematic predicates threaten to make the aim indeterminate. Why aim at truth rather than 'true-and-*A*'? The deflationist must argue that norms attach to the practice of assertion, not the property. To assert is to present-as-true. The norm is internal to asserting. 'True-and-*A*' adds no normative weight because *A* is already secured. However, this requires explaining why the practice targets *this* predicate. If the predicate is individuated by its role, the normativity follows the role. But if the role is what individuates truth, then the normativity is grounded in the practice, not the property. This preserves the deflationary spirit but requires a robust account of the norms of assertion independent of truth's nature.

  The burden of proof lies heavier on the deflationist. Substantivists individuate truth by its nature (e.g., correspondence). 'Correspondence-and-*A*' is a distinct nature, even if coextensive. Deflationists deny a nature, relying solely on the schema/use. Thus, co-schematicity is a specific objection to deflationism's resources for individuation. It suggests the schema is insufficient without a substantive account of the concept's role. For the substantivist, the nature does the individuating work; for the deflationist, nothing does unless it is the use itself.

  Prosentential theories fare better here. By treating 'is true' as a proform (like 'he' or 'so'), they deny truth is a property at all. There is no property to be coextensive with. The worry dissolves because there is no ontological commitment to a property 'truth' that needs individuating. The sentence "That is true" is not a predication but a proxy for the original proposition. However, this requires abandoning the predicate logic framework entirely, which is a high theoretical price. It avoids the co-schematic problem by denying the grammatical appearance that generates it, but it struggles to account for contexts where 'true' behaves syntactically as a genuine predicate (e.g., in quantification).

  In sum, the co-schematic worry shows the schema alone is insufficient. The strongest reply accepts that use individuates the concept, but this concedes that truth has a functional essence. This preserves deflationism about the *property* (it's lightweight) but commits to substantivism about the *concept's role*. You should argue that this hybrid position is the only stable one: deflationism survives only by acknowledging that the expressive function is constitutive, not incidental.
