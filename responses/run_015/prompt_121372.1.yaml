          *   Legal testimony is *propositional* and *assertoric*, perception is often *non-conceptual* or *analog*.
          *   Legal rules allow cross-examined testimony *because* the jury knows it was cross-examined (transparency), whereas cognitive penetration is often *subpersonal* and *opaque* to the subject.
