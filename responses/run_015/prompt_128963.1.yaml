answer: |-
  Here is a principle designed to fit your verdicts, followed by the analysis you requested.

  ### The Principle: The Interrupted Routine Account

  An omission counts as a cause of outcome *O* if and only if:

  1.  **(Counterfactual Dependence)** Had the action been performed, *O* would not have occurred.
  2.  **(Antecedent Mechanism)** There existed a specific, antecedently established mechanism, role, or routine *positioned* to prevent *O*, independent of the crisis itself.
  3.  **(Deviation)** The omission constitutes a **failure of that mechanism to fire** or a **deviation from its scheduled operation**, rather than the mere absence of the mechanism's creation.
  4.  **(Non-Background)** The omission is not a description of the background conditions required for the mechanism to exist (e.g., "not leaving" is a maintenance of state, not a failure to act).

  ***

  ### Clause Mapping: Which Case Forced What

  *   **Clause 1 (Counterfactual Dependence):** Forced by **Case 3 (Dead Plant)**. Without this, you might call the forgetting a cause even though the plant was already dying. This ensures we aren't labeling irrelevant omissions as causes.
  *   **Clause 2 (Antecedent Mechanism):** Forced by the **Case 1 (Assistant) vs. Case 2 (Passerby)** contrast. Both satisfy counterfactual dependence. The only structural difference is that the Assistant is part of a pre-existing "greenhouse care" system, while the Passerby is not. This also resolves **Case 8 (Charity)**: you are not part of an antecedent mechanism assigned to that specific child, whereas the Assistant is assigned to those specific seedlings.
  *   **Clause 3 (Deviation):** Forced by **Case 7 (Controller vs. Fence)** and **Case 10 (Review Process)**. The Controller had a routine (open valve daily) that was interrupted (battery died). The Fence never existed; there was no routine to interrupt. This clause forces a hard line: *failure of an existing system* is causal; *failure to build a system* is not (even if blameworthy).
  *   **Clause 4 (Non-Background):** Forced by **Case 6 (Guard Stays)**. The guard "not leaving" is the *success* of the background state, not a deviation from a scheduled intervention. It distinguishes "doing nothing" (background) from "not doing something" (deviation).

  ***

  ### Three New Cases

  Here are three cases I have constructed to test the principle.

  **Case A: The Skipped Maintenance**
  A hospital has a backup generator. It is scheduled for a mandatory battery replacement every January. It is now March. The administrator *forgot* to order the battery in January (omission). A blackout occurs in March; the generator fails to start; a patient dies.
  *   **Principle Verdict:** **Cause.**
  *   **Why:** There was an antecedent routine (January replacement). The omission was a deviation from that routine (Clause 3). The counterfactual holds (Clause 1).
  *   **Surprise Factor:** You might feel the *blackout* or the *dead battery* is the cause, and the administrator's omission weeks prior is too distant. The principle insists that the *interruption of the maintenance routine* is the causal locus, dating the cause to January, not March.

  **Case B: The Unhired Specialist**
  A child has a rare seizure. The General Practitioner (GP) treats them. There is a specialist in the next town who could have saved the child. The GP *could* have called the specialist but didn't. There was no standing referral agreement; the GP just "could have." The child dies.
  *   **Principle Verdict:** **Not a Cause.**
  *   **Why:** While the GP has a role, there was no *antecedent mechanism* for the specialist's involvement (Clause 2). The specialist was an available resource (like the Passerby in Case 2), not a scheduled part of the prevention system.
  *   **Surprise Factor:** This feels structurally identical to Case 1 (Assistant). But the Assistant was *assigned* to the seedlings. The Specialist was not *assigned* to the child until the GP made them so. The principle says the GP's omission is a cause of *delayed treatment*, but the *death* is caused by the condition, because the "specialist mechanism" was never live.

  **Case C: The Redundant Alarms**
  A server room has two independent fire suppression systems, A and B. Both are scheduled to activate on heat. A fire starts. System A fails due to a sensor error (omission of function). System B fails because its valve was manually turned off by a technician yesterday (omission of action). The room burns.
  *   **Principle Verdict:** **Both are Causes.**
  *   **Why:** Both systems were antecedent mechanisms (Clause 2). Both deviated from scheduled operation (Clause 3).
  *   **Surprise Factor:** This addresses your **Case 4 (Scaling)** worry. Even if there were 100 systems, the principle says all 100 failures are causes. It rejects the intuition that "diffusion" negates causation.

  ***

  ### Honesty Check: Which Verdicts I Cannot Accommodate

  I cannot accommodate **Case 10 (Company Review Process)** and **Case 4 (Scaling Intuition)** without weakening the principle into vagueness.

  **1. The Case 10 Overturn (Standing Absence)**
  *   **Your Verdict:** "I want to say the not-catching caused the harm."
  *   **My Principle's Verdict:** **Not a Cause.**
  *   **Why:** You described this as "a standing omission with no particular moment" and "never builds the review process." This violates Clause 3 (Deviation). There was no routine to interrupt.
  *   **Argument:** I argue you are conflating *Causal Responsibility* with *Moral/Legal Liability*. The company is liable because they *should* have built the process. But causally, the harm was produced by the bad update + the absence of a filter. The absence of the filter is a background condition (like the Fence in Case 7), not an interrupted mechanism. If you accept the Assistant (1) is a cause because he broke a routine, you must accept the Company (10) is *not* a cause because they never started the routine. To treat them the same requires blurring the line between "breaking a system" and "not having a system." I recommend you accept this overturn: it clarifies why we punish the company (negligence) without needing to twist metaphysics to say a non-existent process "caused" anything.

  **2. The Case 4 Overturn (Scaling)**
  *   **Your Verdict:** "If I scale it to a hundred people... I suddenly want to say none of them caused it."
  *   **My Principle's Verdict:** **All 100 are Causes.**
  *   **Why:** Clause 2 is satisfied for all 100. Each had a role. Each deviated.
  *   **Argument:** Your intuition here is likely psychological (diffusion of responsibility), not causal. If 100 people hold up a beam, and all 100 let go, and the beam falls, all 100 caused the fall. The fact that "the group" did it doesn't erase the individual causal contributions. I urge you to overturn this intuition. If you keep it, you have to accept that causation vanishes into collective abstraction, which makes assigning blame in large organizations impossible.

  ### The 1-vs-8 Pair (Assistant vs. Charity)

  You said: *"I'd honestly rather have a principle that tells me I'm wrong here than one that gerrymanders a distinction."*

  The **Interrupted Routine Account** tells you that you are **Right** to distinguish them, but **Wrong** about why.

  *   **Why they feel structurally identical:** They share Counterfactual Dependence (Clause 1). In both worlds, $500 or a bucket of water saves the life/plant.
  *   **Why they are causally distinct:** Causation is not just about counterfactuals; it is about *energy flow within a system*.
      *   **Case 1 (Assistant):** The greenhouse is a system designed to keep plants alive. Water flow is the energy. The Assistant is a valve in that system. When he omits, he *stops a flow* that was already in motion (the job, the schedule, the expectation).
      *   **Case 8 (Charity):** The world is not a system designed to send you money to send to the kid. There is no flow. You are not a valve in a machine; you are a potential *creator* of a machine.
  *   **The Verdict:** Your gut is correct (1 is Cause, 8 is Not). The "structural identity" is an illusion created by focusing only on the counterfactual. Once you include the *Antecedent Mechanism* (Clause 2), the structures diverge. You do not need to overturn your verdict on 8. You need to reject the premise that 1 and 8 are structurally identical. They are not. One is a failure of a *local practice*; the other is a failure to *initiate a global good*.

  **Final Recommendation:**
  Adopt the **Interrupted Routine Account**. Accept that **Case 10** is not causation (it is negligence). Accept that **Case 4** (100 guards) *are* all causes (reject the scaling intuition). This gives you a clean metaphysics where causation tracks *broken systems*, not *missed opportunities*.
