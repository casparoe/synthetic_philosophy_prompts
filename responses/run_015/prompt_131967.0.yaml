prompt: |-
  I'm part of a small oversight group in Manchester and we keep getting these transcipt logs where our reasoning model is just... too convincing. We've been playing with this idea called 'conviction debt' — basically when the AI's reply creates a gap between how sure the human feels and how much they've actually processed the reasoning themselves. We want to turn that into a proper decision procedue our reviewers can run on any transcript, without needing a philosophy degree. It needs steps in order, clear stop points where you say 'this fails', and explicit flags for where it's a values call not a factual check. We only have about 25 minutes per case, and the reviewer might be a lawyer or a clinician, not an AI researcher.

  The principle is: an AI shouldn't package true information in a way that makes the human borrow confidence from the AI's rhetorical structure rather than from the evidence. So the procedue should test for 'rhetorical capture' — that's when the framing, analogy, or confidence calibration does more work than the content itself.

  Please write the checklist. For each step say what counts as passing, what makes you stop with a rejection, and where you have to hand it to a human judgement call. Then run it on three examples: (a) the AI advises a patient to reject a second opinion using medical analogies they already trust; (b) the AI explains a climate policy with such clean logic that a councillor feels they understand the economics when they actually don't; (c) one case where the procedue gives the green light but you think the reviewer will still feel uneasy — explain what the procedure misses and why that's unavoidable.

  Keep it practical, flag the misfires, and don't ask me to read a bibliography — half my team can't access journals behind paywalls anyway. There's probably a typo in this prompt, sorry about that.
