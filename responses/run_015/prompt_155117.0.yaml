  *Brainstorming Note: This sits closer to political epistemology than decision theory. Decision theory would focus on risk weights and utility calculations, but this pattern is about the *justification of knowledge claims* regarding social institutions. It asserts that the past contains encoded knowledge (epistemology) that outweighs present reason, creating an asymmetry in what counts as evidence. It's not just about risk; it's about who bears the burden of proof regarding social truth.*

  1. **Bottom line**
  This is an epistemic double bind that asymmetically loads the burden of proof against innovation. It treats survival as evidence of hidden wisdom for the old, but lack of survival as evidence of hidden danger for the new.

  2. **The carving: what exactly the phenomenon is, what it isn't, and where its edges are**
  This phenomenon is a specific structure of justification within conservative political epistemology, distinct from mere preference. It isn't merely preferring the familiar; it's an argument about the limits of rational knowledge versus embedded social knowledge. The core move is shifting the criterion of value from *intended function* to *evolutionary fitness* once the original function is debunked. When you challenge an institution's original purpose, the defender pivots to claim its longevity proves utility we cannot articulate, invoking a Hayekian view of spontaneous order. However, when you propose a new institution, they revert to a strict rationalist burden of proof, demanding we articulate all potential risks before implementation. This creates a closed loop: the old is protected by *unknowable* benefits, while the new is rejected due to *unknowable* risks.

  The edge of this concept lies where the old institution visibly fails; if survival is broken, the argument collapses. It differs from simple obstructionism because it invokes a theory of social knowledge—that traditions encode wisdom superior to individual reason. It is normative, not just descriptive; it claims we *ought* to defer to survival because we *cannot* know better. Crucially, it treats time as the only legitimate validator of social truth, creating a temporal monopoly on legitimacy. The old has paid the time tax; the new cannot. This makes the argument immune to functional critique, as the function is no longer the point; survival is. The boundary is reached when harm is immediate and undeniable, forcing the defender to abandon the epistemic claim for a moral one.

  3. **Residue / near misses: why Chesterton's fence, path dependency, and status quo bias each fail to capture it**
  Chesterton's Fence is a static heuristic about removal, not a dynamic theory of value based on survival. It says "wait until you understand," not "survival equals wisdom." It doesn't account for the pivot when the original reason is gone, nor does it inherently reject new designs. Path dependency is a descriptive social science concept explaining why institutions stick due to switching costs, not a normative claim that they *should* stick because they are wise. It explains inertia, not justification. Status quo bias and plain risk aversion are psychological preferences for familiarity or safety, lacking the epistemic story about hidden functions. Your pattern is more sophisticated: it uses epistemic humility as a weapon. It claims we are too ignorant to remove the old, but also too ignorant to safely design the new, unless the new survives time—which it hasn't yet. This makes it a rhetorical trap rather than a simple bias or historical accident. It rationalizes inertia as wisdom, whereas status quo bias admits inertia is comfort. Risk aversion treats all uncertainty equally; this treats uncertainty asymmetrically based on age.

  4. **Provisional name and tight definition, with boundary cases**
  I propose **The Evolutionary Double Bind**. Definition: An argumentative asymmetry where existing institutions are granted a presumption of hidden wisdom due to historical survival, while novel institutions bear an impossible burden of proving hidden safety without historical data. It creates a circularity where time is the only valid validator, but time is withheld from the challenger. Boundary case: If an old institution collapses (e.g., Soviet Union), the bind loosens, as survival proof is lost. If a new institution is adopted elsewhere and survives (e.g., Nordic models), the bind weakens, as it gains "survival" data. It fails where the old institution's harm is visible and immediate, breaking the presumption of hidden wisdom. It succeeds where social causality is complex enough to hide counterfactuals.
