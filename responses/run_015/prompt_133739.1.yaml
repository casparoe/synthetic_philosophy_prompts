answer: |-
  Your friend is mathematically correct about Kelly's properties and the St. Petersburg resolution but fundamentally mistaken in claiming this disproves Expected Utility Theory, since Kelly betting is actually a specific instance of Expected Utility maximization.

  **1. The Kelly Formula:** **Correct.** For a simple binary bet, the Kelly criterion dictates betting a fraction of wealth equal to your edge divided by the odds (specifically $f^* = (bp - q)/b$). This is standard definition.

  **2. Only Rational Rule:** **Overstatement.** Kelly maximizes the expected logarithm of wealth, which is equivalent to maximizing the geometric mean growth rate over time. However, calling it the *only* rational rule conflates "rationality" with "long-term survival." A risk-neutral agent maximizing linear expectation is still rational within Expected Utility Theory (EUT), even if they face high ruin risk in repeated games.

  **3. Never Risk Ruin:** **Correct (for Log Utility).** If your utility function is logarithmic, the utility of zero wealth is negative infinity. Therefore, any gamble with a nonzero probability of total ruin has an expected utility of negative infinity and should be strictly rejected, regardless of the upside.

  **4. St. Petersburg Paradox:** **Correct.** The standard resolution to the St. Petersburg paradox is indeed logarithmic utility, proposed by Daniel Bernoulli in 1738. Since Kelly betting is equivalent to maximizing log utility, it naturally resolves the paradox by valuing gains dimensionally rather than linearly.

  **5. Disproves Expected Utility Theory:** **Wrong.** This is the critical error. Kelly betting does not disprove EUT; it is a *subset* of EUT. EUT is a framework that says you should maximize expected utility, but it does not dictate what the utility function must be. If you choose $U(w) = \log(w)$, you get Kelly. Your friend's claim that EUT "allows caring about linear expectation" is true, but EUT does not *require* it; therefore, showing linear expectation is suboptimal for growth does not invalidate the broader theory.

  **6. Epistemic/Multiplicative Updates:** **Confused.** Standard Bayesian updating is already multiplicative on the odds scale (Posterior Odds = Prior Odds × Likelihood Ratio). There is no "standard Bayesian addition" of probabilities. If your friend means that we should geometrically pool opinions from different agents rather than average them, that is a specific normative debate in epistemology, not a settled fact that replaces Bayes.

  I am 85% confident in my assessment of the epistemic claim, as "geometric rationality" in epistemology can refer to niche debates about opinion pooling rather than standard Bayesian updating, whereas the financial claims are standard textbook material.
