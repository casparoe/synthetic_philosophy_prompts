      *(Refining the "Better Analogy")*: The "Umwelt" is good, but maybe "A Control System's Feedback Loop" is more mechanical. Let's combine them: **"A Species-Specific Action Menu."** It emphasizes that consciousness tells you what you can *do*, not what *is*.

