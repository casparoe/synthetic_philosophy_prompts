      *   *Check:* Did I address the "Goal-Rep vs World-Model" tension? Yes, in Priority 1. Did I address "Instrumental vs Ontological"? Yes, in Priority 3. Did I cover Reflective Stability? Yes, Priority 2. Non-catastrophic recognition? Yes, Priority 4.

  8.  **Refining the Argumentation (Self-Correction during drafting):**
