answer: |-
  # The Molyneux Decision Tree: Visual-Tactile Content
  **Seminar Handout | Philosophy of Perception**

  **Start:** A subject blind from birth gains sight. A cube and a globe are placed before them. They know these shapes by touch but have never seen them.
  **Task:** Answer the following verdict questions based on your theoretical commitments. Follow the path to your position.

  ### I. The Decision Tree

  **1. The Delay Verdict** *(Empirical vs. Reflection)*
  *Does the subject succeed immediately, or only after weeks of visual-tactile pairing?*
  *   **Only after pairing:** Go to **2A**.
  *   **Immediately:** Go to **2B**.

  **2A. The Learning Mechanism** *(Empirical Plasticity)*
  *Is the success due to associative learning or recovered memory?*
  *   **Associative Learning:** → **Leaf 1 (Strict Empiricist)**
  *   **Recovered Memory:** → **Leaf 2 (Latent Rationalist)**

  **2B. The Picture Verdict** *(Amodal vs. Proprietary Format)*
  *Can the subject match the felt object to a **line drawing** of it?*
  *   **No (3D only):** Go to **3A**.
  *   **Yes (2D/3D transfer):** Go to **3B**.

  **3A. The Phenomenal Verdict** *(Phenomenal vs. Forced-Choice)*
  *Must the cube **look** the way it **felt**, or is correct pointing enough?*
  *   **Correct pointing only:** Go to **4A**.
  *   **Phenomenal match required:** → **Leaf 3 (Incoherent Phenomenalist)** *[Unoccupied]*

  **4A. The Demonstrative Verdict** *(Common Content vs. Coordination)*
  *Can they pick out "that shape" without shared representational content?*
  *   **No (Needs shared content):** Go to **5A**.
  *   **Yes (Demonstrative coordination):** Go to **5B**.

  **5A. The Vocabulary Verdict** *(Nameable vs. Unnameable)*
  *Does success fail if the solid is an **irregular polyhedron** with no name?*
  *   **Fails (Needs name):** → **Leaf 4 (Conceptualist)**
  *   **Succeeds (No name needed):** → **Leaf 5 (Non-Conceptualist)**

  **5B. The Vocabulary Verdict** *(Nameable vs. Unnameable)*
  *Does success fail if the solid is an **irregular polyhedron** with no name?*
  *   **Fails:** → **Leaf 6 (Classificatory Heterogeneity)**
  *   **Succeeds:** → **Leaf 7 (Pure Demonstrative)**

  **3B. The Phenomenal Verdict** *(Phenomenal vs. Forced-Choice)*
  *Must the cube **look** the way it **felt**?*
  *   **No (Abstract geometry):** Go to **4B**.
  *   **Yes (Sensory unity):** Go to **4C**.

  **4B. The Demonstrative Verdict** *(Common Content vs. Coordination)*
  *Can they pick out "that shape" without shared representational content?*
  *   **No:** → **Leaf 8 (Kantian Formalist)**
  *   **Yes:** → **Leaf 9 (Reidian Common Sense)**

  **4C. The Vocabulary Verdict** *(Nameable vs. Unnameable)*
  *Does success fail if the solid is an **irregular polyhedron** with no name?*
  *   **Fails:** → **Leaf 10 (Gestalt Holist)**
  *   **Succeeds:** → **Leaf 11 (Naive Realist)**

  ---

  ### II. Variant Discrimination Nodes
  The three nonstandard variants are not appendages; they are the tests driving specific splits.

  1.  **The Delayed Test:** Discriminates at **Node 1**.
      *   *Prediction:* **Leaf 1 & 2** predict failure on the immediate test; **Leaves 3–11** predict immediate success.
  2.  **The Picture Variant:** Discriminates at **Node 2B**.
      *   *Prediction:* **Leaves 1, 2, 4–7** predict failure with line drawings (proprietary 3D content); **Leaves 8–11** predict success (amodal spatial content).
  3.  **The Unnameable Solid:** Discriminates at **Node 5A/5B/4C**.
      *   *Prediction:* **Leaves 4, 6, 8, 10** predict failure with irregular solids (conceptual dependence); **Leaves 5, 7, 9, 11** predict success (non-conceptual identification).

  ---

  ### III. Leaf Catalog (Positions)

  | Leaf | Position Name | Awkward Commitment | Historical Flag |
  | :--- | :--- | :--- | :--- |
  | **1** | **Strict Empiricist** | Vision is initially a "flat painted canvas" with no spatial depth. | **High:** Locke, *Essay*. |
  | **2** | **Latent Rationalist** | Spatial concepts exist innately but require visual triggers to activate. | **Low:** Plausible reading of Leibniz, but debated. |
  | **3** | **Incoherent Phenomenalist** | Formats are proprietary (no picture transfer) yet feel phenomenally identical. | **N/A:** Logically inconsistent. |
  | **4** | **Conceptualist** | One cannot see a shape as a shape without the corresponding linguistic category. | **Medium:** McDowell-adjacent, rarely applied to MQ. |
  | **5** | **Non-Conceptualist** | Visual content is rich and spatial but entirely ineffable to the subject. | **Medium:** Peacocke-adjacent. |
  | **6** | **Classificatory Heterogeneity** | Senses are distinct, but we can only coordinate them via learned labels. | **Low:** Unexplored hybrid. |
  | **7** | **Pure Demonstrative** | Subject can point to "that" across senses but shares no descriptive content. | **Medium:** Evans-adjacent. |
  | **8** | **Kantian Formalist** | Space is a priori, but requires synthesis to apply to specific sensory data. | **Medium:** Contested reading of *Critique*. |
  | **9** | **Reidian Common Sense** | Spatial perception is natural and immediate, not learned by association. | **High:** Reid, *Inquiry*. |
  | **10** | **Gestalt Holist** | Shape is a phenomenal whole; irregularity disrupts the perceptual gestalt. | **Low:** Kohler/Koffka, not explicitly on MQ. |
  | **11** | **Naive Realist** | We see the object itself; no representation mediates the match. | **Medium:** Campbell/Martin, modern development. |

  ---

  ### IV. Logical Space Analysis

  **Unoccupied but Allowed Combinations:**
  *   **Immediate Success + Proprietary Format + Phenomenal Match (Leaf 3):** Marked **Incoherent**. If formats are proprietary (fails Picture Test), there is no common ground for phenomenal similarity.
  *   **Delayed Success + Amodal Format:** Marked **Unattractive**. If space is amodal, learning should not be required to map 3D to 3D.
  *   **Conceptual Requirement + Demonstrative Success:** Marked **Unexplored**. Theoretically possible but functionally redundant.

  **Indistinguishable Leaves:**
  *   **Leaf 6 (Classificatory Heterogeneity) & Leaf 4 (Conceptualist):** Both predict failure on the Unnameable Solid. They separate only on whether shared content exists *with* a name. Empirically difficult to tease apart.
  *   **Leaf 1 (Strict Empiricist) & Leaf 2 (Latent Rationalist):** Both predict failure on the Immediate Test. They separate only on the *explanation* of delayed success (learning vs. memory), which is hard to isolate behaviorally.

  ---

  ### V. Instrument Weakness Note

  **Most Contestable Branch:** **Node 2B (The Picture Verdict).**
  Success with line drawings may depend on pictorial competence (understanding depiction) rather than spatial format. A subject might share an amodal geometry but fail the picture test simply because they don't understand photographs.

  **Contested Leaf Placement:** **Leaf 8 (Kantian Formalist).**
  Placing Kant here assumes space is amodal but synthesis is required. Some scholars argue Kant would side with Node 1 (Empirical) regarding the *ordering* of sensations.

  **Redraw Condition:**
  If new cataract-reversal data shows subjects succeed immediately (**Node 1**) but fail with irregular solids (**Node 5**), **Leaf 9 (Reidian)** collapses into **Leaf 4 (Conceptualist)**, requiring a restructuring of the Concept/Demonstrative split. Conversely, if subjects succeed with irregular solids but fail the Picture Test, **Amodalism** (Node 2B) must be redefined as "3D-Amodal" rather than "Geometry-Amodal."
