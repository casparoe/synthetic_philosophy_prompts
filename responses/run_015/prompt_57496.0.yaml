  **MEMORANDUM**

  **TO:** Grants Panel
  **FROM:** Chair
  **DATE:** Monday, [Date]
  **RE:** Decision on Application [ID] and Voting Protocol Adjustment

  **Decision on Application [ID]**
  We will not fund this application. I know this contradicts the majority view on the three merit criteria (design, worth, feasibility). However, the funding vote (3–4 against) was cast under our existing guidelines, which treat the recommendation as a discrete judgment. To override that vote now based on a rule we are only defining today would be procedurally improper. We cannot apply ex post facto logic to change an outcome after the deliberation is complete. The applicant deserves a decision based on the rules we had, not the rules we wish we had.

  **New Voting Protocol**
  Effective immediately for the remainder of this cycle, we are adopting a **Premise-Driven Aggregation** rule to resolve what Dan identified as the *Discursive Dilemma*. When the guidelines specify criteria, the funding vote must logically follow the criteria. 

  For all subsequent applications:
  1.  We vote on the three criteria (Design, Worth, Feasibility).
  2.  If a majority votes "Yes" on all three, the funding recommendation is automatically "Fund."
  3.  If any criterion fails a majority vote, the recommendation is "Do Not Fund."

  This removes the ambiguity that allowed a project to pass all merit hurdles yet fail the final vote. It ensures our criteria are mandates, not suggestions.

  **Addressing the "Vote Counts" Argument**
  Marcus will argue that the funding vote is the only one that matters, and the criteria are merely advisory. The strongest version of this argument is that experienced reviewers synthesize the criteria into a holistic judgment that a mechanical tally cannot capture. A reviewer might see a sound design and worthy question but sense a risk not captured by "feasibility."

  This is incorrect. If the criteria are advisory, we should not require them. If we require them, they must drive the decision. Allowing the funding vote to override a majority consensus on all criteria renders our scoring sheet a fiction. It invites inconsistency and makes feedback impossible. Under the new rule, if you believe a project should not be funded despite meeting all criteria, you must vote "No" on the specific criterion that bothers you. This forces precision in our dissent.

  **Addressing Portfolio Balance (Ruth's Point)**
  Ruth raised a valid concern: we have already funded two projects in this area. This is not a critique of the project's merit; it is a constraint of the foundation's portfolio strategy. Currently, this consideration is hidden inside individual funding votes, which distorts the merit review.

  Going forward, Portfolio Balance is a **separate, prior constraint**. Before we review individual merit, we will identify areas that are "closed" due to saturation. Applications in those areas are declined administratively before reaching the panel. If an application reaches the panel, portfolio balance is assumed to be satisfied. This prevents reviewers like Ruth from having to vote against merit to save the portfolio, and prevents applicants from receiving mixed signals.

  **Feedback Letter**
  We cannot tell an applicant they met all standards but still failed. That suggests arbitrariness. The letter will state:

  *"While the panel found your research design sound and the question worthy of support, we are unable to fund this proposal. Our funding decisions are made in the context of the overall portfolio. In this cycle, we have already committed significant resources to this specific area of inquiry, and we must maintain diversity across our grantee cohort."*

  This is truthful. It separates merit (which they passed) from the constraint (which they hit).

  **Regarding Ines's Comment**
  A note on process: Criteria votes must assess the current application, not the PI's past publication record. Past work may inform your judgment on design, but the vote must reflect the proposal in front of us. Please ensure written comments align with the criteria voted.

  We have walked into a paradox because our rules were silent. We fix the rules now, respect the vote we already took, and move forward.

  **Action:** Please confirm receipt. We will apply the new protocol to Application [Next ID] on Tuesday.
