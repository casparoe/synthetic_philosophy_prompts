          *   *Ranking:* "Ok I fold" *if* a pump exists for the "silence" stance. But usually, pumps target *assigned* values. If the theory says "no verdict," you can't be pumped for following the theory.
          *   *Refinement:* The strongest pump is against *dominance*. Pasadena dominates some games but has "no EV." If you follow EV, you might reject a dominant option. That's a violation of Dominance Principle.
