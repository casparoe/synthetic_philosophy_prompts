      *   *Correction on Contagion:* The user worries that if one option is undefined, you can't compare *any* options. This is definitely overreaching. I should be firm here.

  6.  **Final Polish:** Check tone. Keep it conversational but rigorous (within AP Stats limits). Ensure the ranking is clear. Ensure the "honesty" question is answered.

      *   *Ranking Plan:*
