answer: |-
  # Seminar Prep Sheet: Constructive Provability vs. Representation-Independent Extraction

  ## Part 1: Whiteboard Safety (Consistency Facts)
  *Do not let them derive these on the board. Memorize the relationships.*

  | Principle | Abbrev. | Consistent with Church's Thesis (CT)? | Why/Why Not? |
  | :--- | :--- | :--- | :--- |
  | **Church's Thesis** | **CT** | **Yes** (by definition) | "All functions $\mathbb{N} \to \mathbb{N}$ are recursive." |
  | **Continuity Principle** | **WC-N** | **No** | WC-N says all functionals $\mathbb{N}^\mathbb{N} \to \mathbb{N}$ are continuous. CT implies we can compute the *modulus* of continuity. Diagonalization (Kleene) shows no recursive functional can compute the modulus for all recursive functionals. |
  | **Fan Theorem** | **FAN** | **No** | FAN implies uniform continuity on compact sets (Cantor space). CT allows defining a "Kleene Tree" (a recursive tree with infinite paths but no *recursive* paths). This generates a decidable bar with no uniform bound, contradicting FAN. |
  | **Bar Induction** | **BI** | **No** | BI implies FAN. If CT clashes with FAN, it clashes with BI. |
  | **Bishop Constructive Math** | **BISH** | **Yes** | BISH is the common fragment. It avoids both CT and FAN as axioms, keeping compatibility with both Classical and Recursive math. |

  **The Soundbite:** "CT and FAN are mutually inconsistent. You can have recursive computability (CT) or you have uniform continuity on compacta (FAN), but not both in the same intuitionistic framework."

  ---

  ## Part 2: Anticipated Objections

  ### 1. The Classical Analysts (plus the Set Theorist)
  **Vibe:** "Why are we limiting ourselves? Classical math works."
  **Phrasing:** "If I understand you, you're saying we should adopt Church's Thesis. But CT contradicts the Fan Theorem. The Fan Theorem is exactly what gives us Heine-Borel and uniform continuity on compact intervals. If you drop FAN to keep CT, aren't you throwing out 90% of real analysis? Is your 'computational content' worth losing the Extreme Value Theorem?"

  *   **Concede:** You lose the *classical* formulation of Heine-Borel and the guarantee of uniform continuity for *all* pointwise continuous functions.
  *   **Hold:** That's precisely the point. In a computational setting, "pointwise continuous" isn't enough; you need a modulus. FAN hides the complexity of finding that modulus. CT forces you to acknowledge that if you can't compute the modulus uniformly, you don't have a uniform algorithm.
  *   **2-Min Reply:** "You've hit the nail on the head. The standard slogan says intuitionistic logic *preserves* analysis. I'm arguing it smuggles in non-computational principles like FAN to make analysis look familiar. If we take 'computation' seriously, we must admit that not every continuous function on $[0,1]$ is uniformly continuous *in a computable way*. CT forces us to distinguish between 'we have a proof of continuity' and 'we have an algorithm for the modulus.' Losing FAN isn't a bug; it's the price of admitting that some classical theorems have no uniform computational content."
  *   **Soft Spot:** They may ask if your framework can do *any* analysis. Be ready to mention that Bishop-style constructive math (BISH) keeps the useful parts without committing to FAN or CT.

  ### 2. The Proof Theorists (MLTT/Realizability Experts)
  **Vibe:** "Your formal distinctions are sloppy."
  **Phrasing:** "You're conflating Brouwerian Intuitionism (INT) with Martin-Löf Type Theory (MLTT). In MLTT, we don't assume FAN or CT as axioms. We handle representation independence via setoids or univalence. A function on the Reals is defined on the quotient, so it *can't* inspect the name by definition. Aren't you attacking a straw man version of constructive math that nobody in type theory actually uses?"

  *   **Concede:** MLTT handles representation independence better than raw intuitionistic analysis. You are specifically targeting the Brouwerian tradition (choice sequences), not necessarily Cubical Agda.
  *   **Hold:** However, the *logic* usually marketed as "constructive" (Heyting Arithmetic + Analysis) often tacitly relies on principles like FAN to recover analysis. Even in Type Theory, if you add axioms to make the Reals behave classically (like FAN), you break CT.
  *   **2-Min Reply:** "Fair correction on MLTT. In pure Type Theory, functions are extensional by construction. But my target is the broader claim that 'Intuitionistic Logic is the Logic of Computation.' When people use that slogan, they often mean the Brouwer-Heyting-Kolmogorov interpretation which validates Choice Sequences and FAN. In that setting, you *can* write functionals that inspect the modulus of convergence. My point is that if we want the slogan to mean 'compatible with Turing computability,' we must restrict the logic to the fragment where CT holds, which excludes the distinctive Brouwerian principles. I'm critiquing the philosophical branding, not necessarily your specific implementation in Agda."
  *   **Soft Spot:** They know the models better than you. If they ask about specific realizability toposes (e.g., Effective Topos vs. Sheaf Topos), defer to "That's a model-theoretic detail, my claim is about the provability of principles."

  ### 3. The Philosopher of Mathematics
  **Vibe:** "What do you mean by 'meaning'?"
  **Phrasing:** "Are you making a metaphysical claim that 'computation' is the only legitimate meaning of a mathematical statement? Or are you just saying CT is a more useful heuristic? If a Brouwerian proves a theorem using FAN, have they said something *meaningless*, or just something that doesn't compute in your specific sense?"

  *   **Concede:** Brouwerian math has meaning within the framework of mental constructions and choice sequences. It is not "nonsense."
  *   **Hold:** But it is misleading to call it "computational" in the sense of algorithmic extraction. The meaning of "exists" changes.
  *   **2-Min Reply:** "I'm not saying Brouwerian math is meaningless. It has a clear semantics in terms of choice sequences and continuous functionals. My claim is sociological and pedagogical. When we tell computer scientists or analysts that 'constructive proofs yield programs,' they expect Turing machines. If the extracted program relies on the specific encoding of the input (the name of the real) because we used FAN or Continuity, it's not a program on the *mathematical object*, it's a program on the *syntax*. I'm arguing we should reserve the label 'computational content' for extraction that is invariant under representation."
  *   **Soft Spot:** Don't get dragged into a debate on truth-conditional semantics vs. proof-conditional semantics. Keep it on "extraction behavior."

  ---

  ## Part 3: The "Hope Nobody Asks" Question
  **The Question:** "If CT and FAN are inconsistent, and FAN is required for most of analysis, while CT is required for your notion of computation... isn't the conclusion that **Constructive Analysis is impossible**? Aren't you just proving that Bishop was right to stay neutral, and that your thesis is just a restatement of Bishop's 'BISH' fragment?"

  *   **Why it hurts:** It reduces your talk to "Bishop was right," which everyone knows, and undermines the novelty of your "representation-independent" test.
  *   **The Pivot:** "Bishop stayed neutral to keep peace between classical and recursive mathematicians. I'm taking a side. I'm arguing that if the goal is *computation*, neutrality is cowardice. We should explicitly adopt CT and accept the loss of FAN. The 'representation-independent' test is the tool to decide which theorems survive. Some do (IVT with approximate roots), some don't (exact roots, uniform continuity without modulus). That's a feature, not a bug."

  ---

  ## Part 4: Strategic Advice for the Q&A

  1.  **Don't Fight the Proof Theorists on MLTT:** If they say "We handle this with univalence," say "Excellent, that supports my point that we need extra machinery beyond standard intuitionistic logic to guarantee representation independence."
  2.  **Defend the "Oversold" Claim:** Your strongest rhetorical point is that grant proposals and CS introductions claim "Constructive = Computable." You are pointing out that "Intuitionistic = Computable" is false; only "Recursive = Computable" is true.
  3.  **The Whiteboard Trap:** If they ask for a derivation of CT $\neg$ FAN, do not try to reconstruct the Kleene Tree argument live. Say: "The standard argument uses the Kleene Tree to construct a decidable bar with no uniform bound. It's in Troelstra & van Dalen, Vol 2. The key takeaway is the inconsistency, not the derivation."
  4.  **Tone:** You are not attacking constructive math; you are attacking the *marketing* of constructive math. You love computation; you want to protect it from non-computational principles sneaking in via intuitionistic logic.

  ## Summary Cheat Card (Keep in Pocket)
  *   **CT + FAN = Inconsistent.** (Kleene Tree).
  *   **CT + Continuity = Inconsistent.** (Modulus of continuity is not computable).
  *   **BISH (Bishop)** avoids both (Compatible with Classical & Recursive).
  *   **INT (Brouwer)** accepts FAN/Continuity (Incompatible with CT).
  *   **Your Stance:** "Computational" should mean CT-compatible. Therefore, INT is not the logic of computation.
  *   **Representation Independence:** The litmus test for real algorithms.
