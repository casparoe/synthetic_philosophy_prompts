answer: |-
  # EXAMINATION QUESTION: JURISPRUDENCE SEMINAR

  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 1000 words
  **Instructions:** Answer the question below. You are not required to cite external authorities or case law. Your answer should rely on the logical implications of the scenario provided.

  **The Republic of Veredia**

  In the Republic of Veredia, a consensual adult practice known as "Practice P" is widespread. Private surveys indicate that 80% of the population privately approves of P. However, in public forums, town halls, and media, 80% of the population publicly disavows P. Sociologists call this "pluralistic ignorance": everyone falsely believes everyone else hates P, so everyone publicly hates P to fit in.

  The Veredian legislature, relying on the public avowals, enacts a ban on P. They justify the ban by claiming that allowing P would undermine the shared moral fabric essential to society's existence. However, the enforcement is purely administrative. There are no criminal trials, no public shaming, and no judicial condemnation. Violators receive automated notices: licence suspensions and credit downgrades. The sanctions are quiet; only the sanctioned person knows why they were penalized.

  Ten years later, private surveys show a shift. Only 30% now privately approve of P. The government claims victory: the ban prevented moral disintegration by hardening public conviction into private belief. They argue the law successfully preserved the morality required to hold Veredia together.

  **Question:**

  Evaluate the Veredian government's justification. A strong theory of moral enforcement must distinguish between morality the state *may* enforce and morality it *must* enforce to survive. Using the details of the Veredia scenario, argue whether the government's success proves the law's necessity or exposes a circularity in the justification. Specifically, address: (1) the distinction between enforcing any shared morality versus only "load-bearing" morality; (2) whether enforcement that manufactures consent validates or invalidates the claim that consent was necessary; (3) what evidence would prove P was actually load-bearing rather than substitutable; (4) whether quiet administrative penalties satisfy the requirement for moral enforcement compared to expressive condemnation; and (5) whether this framework allows any distinction between a moral reformer and a traitor.

  ***

  # MODEL ANSWER

  The Veredia scenario does not validate the government's justification; it functions as a *reductio ad absurdum* of the claim that law must enforce morality to prevent social disintegration. The government's argument collapses because it conflates the existence of shared morality with the coercion required to produce it. A robust analysis must separate three distinct claims often run together: that society may enforce any morality it holds; that it may enforce only the morality necessary for its survival; and that law is required to make moral judgment serious. Veredia fails on all counts, but most critically on the empirical claim that the banned conduct threatened disintegration.

  The core failure is circularity. The government argues the ban was necessary because society shared a moral conviction against P. Yet the scenario establishes that this conviction was initially false (pluralistic ignorance) and subsequently manufactured by the ban itself. If the law creates the very consensus used to justify the law, the "necessity" of the law is an artifact of its enforcement, not evidence of a pre-existing threat. This is not proof that the moral fabric was held together; it is proof that the fabric was woven by the state. To accept the government's conclusion is to accept that any morality can be made "necessary" simply by punishing dissent until dissent disappears. The empirical premise—that society would disintegrate without the ban—is unproven because the experiment was rigged. The data is not evidence for the conclusion; it is the product of the conclusion.

  This leads to the distinction between "load-bearing" and "substitutable" moral rules. Even granting that a society needs *some* shared morality to function, it does not follow that every specific rule is structural. Most moral rules are decorative; others are load-bearing. To justify banning P, the government must show that P specifically, not just any rule, was essential to prevent collapse. In Veredia, the burden of proof lies with the state to demonstrate that allowing P would have caused disintegration independent of the ban. They cannot meet this burden because the ban prevented the test case from occurring. The only valid evidence would be comparative: showing that societies permitting P disintegrate while those banning it survive. Without this, the claim that P was load-bearing is mere assertion. The Veredia data shows compliance, not structural necessity.

  Furthermore, the mode of enforcement matters. The Veredian ban was quiet and administrative. There was no public drama, no condemnation, no expressive function. If the purpose of enforcing morality is to reaffirm the shared values that bind society, quiet penalties fail. A credit downgrade is a price, not a judgment. It signals inefficiency, not sin. For moral enforcement to sustain a "moral fabric," it must be expressive; it must teach the community what to hate. Veredia's quiet penalties suggest the state was not interested in moral education but in behavioral compliance. If the morality is truly shared, public condemnation should be unnecessary because social pressure would suffice. If it is not shared, quiet penalties cannot create the shared sentiment required for the "disintegration thesis" to hold. The silence of the enforcement undermines the claim that the law was defending a public moral order.

  Finally, this framework eliminates the possibility of moral reform. If the stability of society depends on existing moral convictions, then any challenge to those convictions is an attack on society's fabric. In Veredia, a reformer arguing against the ban is, by definition, advocating for the removal of a "load-bearing" rule. There is no conceptual space to distinguish treason from reform. A theory that cannot distinguish between improving a society and destroying it is practically useless. It freezes the moral status quo by equating change with collapse. The Veredia government treats the hardened conviction after ten years as proof of success, but this confirms that the system is designed to suppress evolution.

  Therefore, the Veredia scenario demonstrates that using social stability to justify moral enforcement is self-sealing. It allows the state to define any preference as structural, manufacture the consent required to validate it, and punish any deviation as existential treason. The top answer must reject the government's claim: the ban did not prove the morality was necessary; it proved the state was capable of manufacturing necessity. The harm is not to the fabric of society, but to the capacity of society to distinguish between what it values and what it is coerced into valuing.

  ***

  # MARKING SCHEME (25 MARKS TOTAL)

  **1. Distinguishing Enforcement Claims (5 Marks)**
  *   **Requirement:** Student must separate the claim that *any* morality can be enforced from the claim that only *necessary* morality can be enforced, and the claim that law is needed for morality to be serious.
  *   **Full Marks:** Clearly articulates that Veredia conflates "what is enforced" with "what is necessary."
  *   **Typical Error:** Treating all moral enforcement claims as identical (e.g., "Devlin says enforce morality, Hart says don't").

  **2. The Circularity/Artifact Problem (5 Marks)**
  *   **Requirement:** Student must identify that enforcement manufacturing the conviction it was justified by invalidates the empirical premise.
  *   **Full Marks:** Argues that the post-ban conviction is an artifact of the ban, not evidence of pre-existing necessity.
  *   **Typical Error:** Accepting the 10-year data as proof that the ban worked without questioning the baseline.

  **3. Load-Bearing vs. Substitutable Rules (5 Marks)**
  *   **Requirement:** Student must address the burden of proof regarding whether rule P was essential to survival or merely decorative.
  *   **Full Marks:** States that the state bears the burden to prove specific necessity, not just general social cohesion.
  *   **Typical Error:** Assuming that because society survived, the rule must have been necessary (post hoc ergo propter hoc).

  **4. Visibility and Expression (5 Marks)**
  *   **Requirement:** Student must analyze whether quiet administrative penalties satisfy the expressive function required for moral enforcement.
  *   **Full Marks:** Argues that quiet penalties fail to reinforce shared values because they lack public condemnation.
  *   **Typical Error:** Focusing only on the severity of the penalty rather than its public/expressive nature.

  **5. The Reform Problem (5 Marks)**
  *   **Requirement:** Student must explain why this framework makes moral reform indistinguishable from treason.
  *   **Full Marks:** Concludes that equating stability with morality freezes the status quo and criminalizes improvement.
  *   **Typical Error:** Suggesting reform is possible within the system without explaining how it avoids the "disintegration" charge.

  **IMPORTANT MARKING CONSTRAINT:**
  *   **Harm Principle Cap:** If a student answers primarily by reciting the Harm Principle (e.g., "Hart says only harm to others justifies law") without engaging with the specific mechanics of the Veredia scenario (pluralistic ignorance, quiet enforcement, manufactured consent), cap the total score at **10/25**. This question tests the internal logic of moral enforcement, not the liberal alternative.

  **Extrapolation Note:**
  *   *Point 4 (Visibility)* extrapolates slightly beyond Devlin's original text, which focused on public outrage rather than administrative quietude; however, it is a necessary logical extension to test the "shared morality" claim in this specific scenario.
