      *   *The "Scholar" Flag:* I will flag my treatment of "Life." Nietzsche's *Leben* is biological/vitalist. Equating it with "social justice" or "civic harmony" is a liberal humanist co-opting of Nietzsche. I need to own that.

  8.  **Final Polish:** Check tone. Ensure no news recap. Ensure the three hard questions are answered distinctly. Ensure the verdict is sharp.

