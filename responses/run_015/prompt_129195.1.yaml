answer: |-
  Here is the mapping, the friction points, and the verdict.

  ### The Mapping

  **The Removal Campaigns (Critical)**
  This is the purest fit. Nietzsche describes critical history as the process of dragging the past before a tribunal, judging it, and ultimately condemning it so that life can move forward. The activists who topple statues or demand their removal are enacting this tribunal. They are not interested in the stone itself; they are interested in breaking the spell the past holds over the present. For them, the statue is a shackle. Removing it is an act of liberation, a prerequisite for the "life" of the community to continue without the psychic weight of sanctioned white supremacy.

  **The Heritage/Preservation Groups (Antiquarian)**
  Their primary mode is piety toward the past simply because it *is* the past. "Our history," "our ancestors," "don't erase." This is the antiquarian instinct: valuing the origin and the preserved object above its utility for the future. They treat the statue as a relic of a specific time and place that must be protected from the vandalism of the present.

  **The Legislatures (Antiquarian Weaponized)**
  When states pass laws forbidding removal, they are codifying the antiquarian instinct into state power. They are freezing the landscape. Nietzsche warns that when the antiquarian instinct becomes dominant, it mummifies life; it prevents new things from being born. By legally bolting the statue to the ground, the legislature ensures the past dictates the terms of the present, regardless of whether the present can breathe under that weight.

  **The Nighttime Topplers (Critical as Action)**
  This is critical history without the tribunal. It is the verdict executed before the trial concludes. It is pure negation in the name of a future life that cannot yet be named.

  **The Curators/Museums (The Hybrid)**
  This is where the taxonomy strains. The proposal to move statues indoors or add plaques attempts to hold the object (Antiquarian) while subverting its message (Critical).

  ### The Double-Mode Actor

  You suspected one group is practicing two modes at once. It is the **Heritage/Preservation defenders**, and they are oscillating between **Monumental** and **Antiquarian**.

  Here is the fracture: When the wind is at their backs, they argue for the **Monumental**. They speak of Lee or Davis as "heroes," "leaders," or men of "honor" to be emulated. They claim the statue inspires virtue. But the moment the Critical attack lands (i.e., when the racism of the Confederacy is foregrounded), the Monumental claim becomes untenable. You cannot emulate a traitor fighting for slavery in a modern democracy.

  So, they retreat instantly to the **Antiquarian**. "It's not about heroism anymore; it's about *history*. It's about remembering our roots. It's an artifact."

  This oscillation matters because it reveals that Nietzsche's modes are not just academic categories; they are survival strategies for the past. When the Monumental value of an object rots (because the "greatness" is no longer recognized as great), the defenders do not discard the object. They downgrade its status to Antiquarian to save the stone. This proves the modes are not separate silos but a hierarchy of defense. Monumental is the high ground; Antiquarian is the bunker. When you lose the high ground, you dig in. This blurs the distinction: it shows that "Antiquarian" is often just "Monumental" that has lost its confidence.

  ### The Three Hard Questions

  **1. Critical History vs. Justice**
  You are right to be suspicious. Nietzsche's "Life" (*Leben*) is not social justice, equity, or liberal democracy. It is vitality, power, and the capacity for growth. When removalists speak of "justice," they are using moral language; Nietzsche uses biological/aesthetic language.

  However, the fit is real *functionally*, even if the rhetoric differs. For the communities targeted by the symbolism of these statues, the presence of the monument is a suppression of their political vitality. It tells them they are second-class citizens in the public square. Removing it is a condition for their "life" to flourish. Nietzsche would likely disdain the moralizing language of "justice," but he would recognize the *structure*: a past is being severed to allow a specific group to breathe.

  The schema misdescribes the *motive* (activists think they are doing ethics; Nietzsche says they are doing hygiene), but it accurately describes the *mechanism*. Does it matter? Yes. If we accept Nietzsche's frame, we admit that removal isn't about "truth" (the Confederacy really did exist); it's about *health*. This shifts the debate from "Is this accurate history?" to "Is this habitable history?" That is a more dangerous, but more honest, question.

  **2. The Plaque and the Hybrid**
  The plaque option is the attempt to create a stable isotope out of unstable elements. It tries to be Antiquarian (keep the old thing) and Critical (admit the old thing was bad) simultaneously.

  Nietzsche would say this is impossible for the *viewer*. The viewer cannot feel reverence and condemnation at the same instant. The plaque inevitably fails. Either the text is ignored, and the statue remains Monumental (the visual power of the bronze horse overwhelms the small text), or the text overwhelms the statue, turning it into a mere illustration of a lesson, stripping it of all power.

  As for the low wall of names (like the Vietnam Veterans Memorial): This is not a failure of the taxonomy; it is a shift in the **Monumental**. It is Monumental history without the "Great Man." It monumentalizes *sacrifice* rather than *power*. Nietzsche allows for this. He speaks of honoring the "suffering" of the past. The low wall works because it does not ask you to emulate the dead; it asks you to witness the cost. It fits within Monumental history, but it is a democratic, melancholic version of it, rather than an aristocratic, triumphant one. The plaque on a Confederate statue fails because it tries to keep the "Great Man" form while denying the "Great Man" content.

  **3. Forgetting in the Digital Age**
  This is the fatal wound to Nietzsche's essay. Nietzsche assumes that if you tear down the statue, the *image* of the statue eventually fades from the collective mind. He requires "forgetting" as a digestive process. You eat the past, you break it down, you absorb the nutrients, you excrete the waste.

  In the Confederate fight, nothing is forgotten. Every toppling is 4K video. Every removed statue is 3D-scanned. The statue leaves the square but enters the Cloud, where it is permanently accessible.

  This means **Critical History cannot complete its cycle.** You can destroy the object, but you cannot destroy the archive. The act of removal becomes its own Monumental event, preserved forever. The "Critical" act is instantly re-absorbed into the "Antiquarian" archive. This suggests that in a digital culture, Nietzsche's cure is impossible. We are condemned to permanent Antiquarianism because we lack the capacity to let things die. We can move the statue, but we cannot forget it. This creates a sickness Nietzsche didn't anticipate: a culture that is constantly judging the past (Critical) but never allowed to forget it (Antiquarian), resulting in a permanent state of historical anxiety.

  ### The Verdict

  Here is my definite claim: **Nietzsche's taxonomy is not a menu of policy options; it is a diagnostic triage for cultural sickness.**

  The scheme does not tell cities *what to do* with the statues. It explains *why the fight is intractable*. The fight is intractable because one side is operating from a sickness of Antiquarianism (mummification of a dead cause) and the other is operating from a Critical impulse that cannot find a resting place because the digital archive prevents the necessary forgetting.

  The taxonomy is not elastic enough to classify any attitude; it is rigid enough to show that **compromise is impossible.** The plaque solution fails *because* Nietzsche is right: you cannot serve two masters. You cannot revere and condemn the same object in the same space. The taxonomy explains the failure of the middle ground. It shows that a culture must choose: either the statue is a living inspiration (Monumental), in which case the racism must be denied; or it is a dead artifact (Antiquarian), in which case it belongs in a warehouse; or it is a crime (Critical), in which case it must be destroyed. Trying to do all three is not wisdom; it is indigestion.

  The case shows that Nietzsche's scheme is robust as a description of *conflict*, but useless as a guide for *resolution* in a pluralistic democracy. Nietzsche expects a single "culture" to decide its horizon. America has no single horizon. Therefore, America has no healthy history. It only has competing pathologies.

  ### The Flag

  The move I least want a Nietzsche scholar to read is my equation of **"Justice" with "Life."**

  I smoothed over the friction in Question 1 by arguing that social justice is a functional prerequisite for the "life" of marginalized communities. A hardline Nietzschean would call this a humanist domestication of his thought. For Nietzsche, "Life" is the will to power, which often involves domination, hierarchy, and the suppression of the weak. He might well argue that the Confederate monument is *healthy* Monumental history for the dominant group, and removing it is an act of *slave morality* masquerading as Critical history.

  By assuming that "Life" means "inclusive civic health," I am smuggling liberal democratic values into a framework that is explicitly anti-democratic and aristocratic. I am using Nietzsche to defend a cause he would likely have found contemptible. The analysis holds structurally, but the valuation of what constitutes a "healthy" culture is a betrayal of the text.
