      *   *Antiquarian:* History of preservation, reverence for origins, piety toward the past. "This is where I come from." Risks: Mummification, rejecting anything new, valuing the old simply because it is old.
      *   *Critical:* History that judges and condemns the past to liberate the present. "I must break this to live." Risks: Rootlessness, injustice to the past, destroying the soil one grows from.
