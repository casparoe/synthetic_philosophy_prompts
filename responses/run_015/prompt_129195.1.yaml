          *   *The Two Modes:* The Heritage defenders. They claim Monumental (Lee is great) but operate Antiquarian (don't touch the stone). This splits their soul. They can't inspire (Monumental) because the object is toxic, so they retreat to mere preservation (Antiquarian).

      *   **Hard Q1 (Critical/Justice):** Nietzsche's "Life" is aristocratic/vitalist. The activists use "Justice." The fit is real *functionally* (liberation) but false *rhetorically*. Nietzsche wouldn't care about "justice," he'd care if the statue stifles the vitality of the populace. The schema misdescribes the *motive* but captures the *function*.
