      *   *1. Critical History vs. Justice/Life:* Nietzsche's "Life" is will to power/health, not necessarily liberal "Justice." Does the fit work? Yes, because "Justice" here is a condition for the *life* of the marginalized. If the statue kills their political vitality, removing it is "for life." But the rhetoric is moral, not vitalist. This is a friction point.
