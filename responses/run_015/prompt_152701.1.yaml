prompt: |-
  ok so i've been trying to understand Nozick's experience machine argument against hedonism, but i think there's a hidden circularity. he asks if we'd plug into a machine that gives us perfect fake experiences, and says no because we want to actually do things. but isn't he just smuggling in the idea that 'contact with reality' is part of well-being without defending it? and then there's this mirror case — call it the 'reverse box' — where you're genuinely accomplishing things but your brain is wired so you always feel miserable. if that also sounds like a bad life, then the intuition isn't 'reality is good', it's just 'your mental states and your life should align'. so hasn't Nozick actually shown nothing about well-being except that people like coherence? can you tell me where my reasoning goes wrong, and separate what's settled about the machine argument from what's genuinly contested? don't pretend there's a consensus if philosophers are still split.
