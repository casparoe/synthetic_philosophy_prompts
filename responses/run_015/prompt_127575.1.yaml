answer: |-
  Good evening, everyone. For those of you who don't know me, I'm Elena. I had the privilege of being one of Arthur's PhD students back before I traded petri dishes for plot points.

  Looking around this room, I see a pretty even split. On my left, we have the evolutionary biologists. On my right, the family, the neighbors, the people who love him regardless of his citation index. I need to walk a fine line here. If I get the science wrong, the biologists will wince. If I get it too right, the rest of you might check out. So, I'm going to try to speak Arthur's language without turning this into a lecture.

  Arthur spent forty years teaching us how to look at the natural world. Most people think evolution is a master engineer, designing every claw, wing, and leaf for a specific, optimal purpose. If a beetle has a horn, it must be for fighting. If a bird has a color, it must be for mating. We love stories where everything happens for a reason.

  Arthur spent his career gently telling us: not so fast.

  He championed the idea of the spandrel. Sorry—*(looks down at index card, squints)*—the spandril. *(Laughs)*. No, wait. Spandrel. No 'i'. I've been arguing with my roommate all week about whether novel plots have spandrels too, and apparently, I've started misspelling it in my sleep.

  But the concept is architectural. In a cathedral, a spandrel is the triangular space between two arches. It wasn't designed to hold a painting. It's just there because that's what happens when you build arches. It's a byproduct. Arthur taught us that biology is full of spandrels. Not every trait is a solution. Sometimes, it's just noise. Sometimes, it's just what happens when you build something else.

  Now, there's a story about Arthur's work that some of you might have heard as a failure. Back in '88, he spent three years studying a specific wing case on a ground beetle. He looked for the survival advantage. He looked for the mating preference. He ran the stats. He found nothing. No adaptive story. By the standards of a field obsessed with "why," he came up empty.

  He could have forced it. He could have written a "just-so story," made up a plausible reason why that wing case helped the beetle hide in the dirt. It would have gotten published. It would have been clean.

  He didn't do it. He published the null. He said, "This isn't an adaptation. It's a spandrel. It's just there."

  That paper was cited less than his others. But to us, his students, that was the moment he became a great scientist. He taught us that honesty is more important than a neat narrative. He taught us that admitting "I don't know the purpose" is better than lying and saying "It's for this."

  And I think that's the thing I want the family to take home tonight. We live in a world that demands we justify ourselves. What's your major? What's your job? What's that *for*? Arthur showed us that you don't need to be optimized to be valuable. You don't need to be a solution to be beautiful. Sometimes, you're just there, and that's enough.

  He proved that nature isn't an engineer optimizing for perfection. It's a tinkerer working with whatever parts are lying around. Which is a relief, because I've always suspected my appendix wasn't contributing much to the team. And honestly, neither was my second novel.

  *(Pause for laughter)*

  But seriously. Arthur taught us to look past the obvious story. To respect the constraints. To find the beauty in the accidental architecture. He didn't just study biology; he taught us how to live with uncertainty without rushing to fill the silence with a lie.

  So, if you could all raise a glass.

  To Arthur. May your retirement be free of selection pressure, may your traits be purely adaptive, and may you finally enjoy the spandrels in your life without trying to publish them.

  To Arthur.
