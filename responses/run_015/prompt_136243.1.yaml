answer: |-
  The practices presuppose that standing is granted not on the basis of the blamer's moral purity but on whether their conduct undermines the specific normative authority required for the particular speech act or sanction at issue. What looks like inconsistency across equity, tort, criminal law, and international relations is actually a functional differentiation where the cost of allowing hypocrisy varies according to the purpose of the forum, and once you separate the standing to impose sanctions from the standing to speak truth or offer advice, the pattern stabilizes into a coherent theory of normative authority rather than moral worthiness. In equity, the clean-hands doctrine is not primarily about hypocrisy in the abstract but about the relational integrity of the specific transaction, which is why it bars relief only when the plaintiff's misconduct is bound up with the very duty they seek to enforce, whereas tort law is concerned with loss allocation rather than moral accountability, so the plaintiff's carelessness reduces recovery proportionally without negating their standing to claim, and criminal law treats the complainant's record as irrelevant to guilt because the state is the real party in interest prosecuting a public wrong rather than a private grievance. When you move to the international sphere, the divergence between legal liability and diplomatic shaming makes sense because tribunals are tasked with determining violations of objective norms where *tu quoque* is logically irrelevant to the fact of the breach, while diplomatic argument is a contest for moral prestige where the critic's credibility is itself a weapon, so admitting hypocrisy lowers standing without exculpating the defendant. This suggests that the backward-looking rule in law does not strictly presuppose a complicity view of standing but is rather an evidentiary proxy selected for administrability, since tribunals cannot reliably adjudicate counterfactuals about what a complainant would have done in different circumstances, meaning the practices do not rule out the dispositional view theoretically but merely fail to implement it because the epistemic burden would be intolerable. If you were to replace the backward-looking test with the would-have proviso, you would transform legal tribunals into inquisitors of character rather than adjudicators of conduct, requiring them to speculate on the dispositional makeup of parties under hypothetical stress, which would destabilize the rule of law by making outcomes turn on psychological prediction rather than factual breach, and in ordinary moral address it would shift the focus from what was done to who the person is, potentially making blame more authentic but also more intrusive and less resolvable. The asymmetry regarding opportunity versus capacity is explained by distinguishing standing to represent a norm from standing to claim personal injury, because when a small state shames a great power it speaks as a guardian of the international order rather than as a virtuous agent, whereas an individual who refrained from fraud only due to lack of opportunity claims no such representative authority and thus lacks the standing to resent the vice in others. You must distinguish standing to blame from standing to advise, to demand an accounting, to impose sanctions, and to resent, because hypocrisy defeats the authority to sanction and the right to resent more readily than it defeats the epistemic capacity to advise or warn, which is why we accept hypocritical advice while rejecting hypocritical punishment. The literature often conflates these distinct normative powers, treating standing as a monolithic switch that is either on or off, when in reality the practices distribute these powers separately based on whether the hypocrite's conduct severs the specific link required for that specific act. Much of the pattern you observe is an accident of institutional history only insofar as legal categories evolved separately to solve different problems, but the underlying commitment is consistent: standing is withheld only when the blamer's conduct renders their address normatively inert for the specific purpose at hand. Your chapter can lean on the evidence of practice only if you argue that the practices are underdetermined between a complicity view and a dispositional view, with the former winning out solely due to epistemic constraints rather than moral truth, which leaves open the possibility that our moral intuitions are actually dispositional while our institutions are necessarily conduct-based. The theory that holds together is one where standing is a function of the normative work the blame is supposed to do, so that in contexts where blame is meant to restore relational equilibrium hypocrisy bars the claim, but where blame is meant to uphold community standards hypocrisy merely dampens the force of the speech without silencing it. This explains why the same people who discount a hypocritical state's blame treat the hypocrite's advice as entirely in order, because the advice relies on epistemic authority which remains intact despite moral failure, whereas the blame relies on moral authority which is compromised. If you adopt this functional view, you can explain the equitable rule as protecting the integrity of the court's conscience, the tort rule as protecting the allocation of loss, the criminal rule as protecting the state's monopoly on violence, and the diplomatic practice as protecting the viability of normative discourse without conceding legal immunity. The would-have proviso fails in law not because it is morally wrong but because it is institutionally impossible, yet it remains live in moral judgment where we do speculate on character, which means your theory should posit a dual structure where moral standing is dispositional but institutional standing is conduct-based for reasons of feasibility. This allows you to argue that the coarseness of the usual framing comes from trying to apply a moral metric to institutional rules or vice versa, and that the solution is to recognize that hypocrisy undermines standing only when it defeats the specific normative purpose of the blaming act. You should conclude that the practices are not tracking a single metaphysical property of the blamer but are instead managing the conditions under which normative speech retains its force, which means the theory of standing is ultimately a theory of communicative authority rather than moral cleanliness.
