answer: |-
  This is an exceptionally clear formulation of a problem that haunts philosophy of history, political theory, and transitional justice. You have correctly identified that the surface-level argument (facts vs. feelings) is a proxy for a deeper structural conflict.

  Here is a diagnosis of the impasse, followed by an assessment of what constitutes genuine progress.

  ### The Diagnosis: A Normative Collision Disguised as an Epistemic Dispute

  Your hypothesis that this is a dispute about the *purpose* of historical knowledge is correct, but it requires one layer of excavation. The conflict is not merely about whether history is "science" or "identity." It is a **category collision over the locus of legitimacy.**

  Both camps are making a claim about who has the authority to define social reality, but they are using the language of *truth* to fight a battle about *power*.

  1.  **The Archivalist Claim:** Legitimacy comes from **methodological neutrality.** By adhering to the archive, one steps outside of partisan interest. The moral good here is *integrity*; the risk is *complicity* with the erasures inherent in the archive.
  2.  **The Mnemonic Sovereigntist Claim:** Legitimacy comes from **lived experience.** By adhering to memory, one centers the subject who was acted upon. The moral good here is *recognition*; the risk is *relativism* that severs the community from shared reality.

  Therefore, the disagreement is **primarily a disagreement about which moral reasons take precedence (epistemic integrity vs. restorative justice), expressed through the language of epistemic norms.**

  It is not merely a verbal confusion (Option 2), because the stakes are material: funding, curriculum, legal reparations. It is not purely bedrock intuition (Option 4), because both sides offer arguments. It is not purely empirical (Option 3), because no amount of data on social cohesion will tell an Archivalist that truth is secondary, nor tell a Sovereigntist that precision is worth the cost of dignity.

  **The Hidden Mechanism:**
  The frustration you feel stems from the fact that both sides are demanding a **monopoly on the public square.**
  *   The Archivalist wants the museum to function like a university department (critical inquiry).
  *   The Sovereigntist wants the museum to function like a sanctuary (sacred testimony).

  When you try to run a sanctuary like a lab, you commit sacrilege. When you try to run a lab like a sanctuary, you commit fraud. The debate stalls because both sides insist that the *same institution* must serve *both masters simultaneously* without prioritizing one function over the other.

  ### What Counts as Progress?

  Given this diagnosis, an empirical study (Option 3) will not resolve the conflict, because the disagreement is not about *what happens* when you choose one path, but *what ought to be valued* regardless of the outcome. A conceptual distinction (Option 2) is necessary but insufficient; knowing the difference between history and memory doesn't tell a school board which textbook to buy. An admission of permanent impasse (Option 4) is defeatist and ignores the possibility of pluralism.

  **Progress lies in Institutional Design (Option 1), specifically an "Ecology of Truth."**

  To move forward, we must stop asking a single institution to resolve the tension and instead design a system where the tension is *productive* rather than *paralyzing*. Here is what that looks like:

  #### 1. Functional Separation (The "Zoning" Solution)
  We must acknowledge that "History" (critical inquiry) and "Memory" (constitutive practice) are distinct goods that require distinct venues.
  *   **Progress:** A museum or curriculum explicitly demarcates spaces. One hall is for "Archival Record," where documents are displayed with their biases contextualized. Another hall is for "Community Testimony," where oral history is presented not as forensic evidence but as sacred narrative.
  *   **Why this works:** It satisfies the Archivalist demand for transparency (the documents are not hidden) and the Sovereigntist demand for dignity (the testimony is not cross-examined). It stops the fight over *which one is the real history* by admitting they are *different practices*.

  #### 2. The "Counter-Archive" Mechanism
  The Archivalist fear is mythologizing; the Sovereigntist fear is silencing. Progress occurs when the archive is forced to account for its own silences.
  *   **Progress:** Institutionalizing the requirement that archival displays must include "silence markers"—explicit notes on what the archive *cannot* record due to power dynamics. Conversely, memory displays must include "context markers"—notes on how the narrative has shifted over time.
  *   **Why this works:** It forces the Archivalist to admit the archive is not neutral (it is a collection of survivors, mostly powerful ones). It forces the Sovereigntist to admit memory is fluid. It shifts the debate from "Who is right?" to "How did we get these different records?"

  #### 3. Shifting the Metric from "Accuracy" to "Fidelity"
  This is the conceptual shift required to make the institutional design work.
  *   **Progress:** We stop asking if the memory is *accurate* (correspondence to fact) and start asking if it is *faithful* (fidelity to the experience of the event). We stop asking if the archive is *objective* and start asking if it is *rigorous*.
  *   **Why this works:** It allows the Sovereigntist to maintain the moral authority of the memory without claiming it is forensic data. It allows the Archivalist to maintain the rigor of the document without claiming it is the whole truth.

  ### Summary Recommendation

  The impasse is not permanent, but it cannot be solved by proving one side right. It is a **tragic choice** between two genuine goods: **Epistemic Security** (knowing what happened) and **Moral Repair** (healing those to whom it happened).

  **The verdict you should offer your friend:**
  The debate stalls because you are both trying to solve a **political problem** (how do we live together after harm?) with an **epistemic tool** (what is the standard of proof?).

  Progress looks like **institutional pluralism.** We need archives that are critical of their own silence, and memorials that are honest about their own myth-making. We do not need to merge them into a single "true" narrative. We need a civic infrastructure robust enough to hold the contradiction between *what the state recorded* and *what the people survived* without demanding that one erase the other.

  If you can convince your friend that the goal is not **convergence** (one story) but **coherence** (a system that manages the tension between stories), the argument may finally move.
