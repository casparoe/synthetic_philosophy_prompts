      *   **User's Hypothesis:** It's not about facts or suffering, but the *purpose* of historical knowledge (corrective vs. constitutive). Alternatively, it could be a hidden empirical disagreement about harm/cohesion, or simply answering different questions (epistemic authority vs. justice).
      *   **The Request:** A *diagnosis* (not a verdict). Is it:
          1.  Substantive clash about epistemic norms?
          2.  Verbal confusion (history vs. memory)?
          3.  Disagreement about moral precedence?
          4.  Bedrock intuitions (incommensurable needs)?
      *   **The Follow-up:** Given the diagnosis, what counts as *progress*? (Institutional design, conceptual distinction, empirical study, or admission of permanent impasse?)

  2.  **Analyze the Philosophical Underpinnings:**

      *   This is a classic tension in philosophy of history, memory studies, and political theory.
      *   *Key Thinkers:* Pierre Nora (Lieux de mémoire), Paul Ricoeur (Memory, History, Forgetting), Michel-Rolph Trouillot (Silencing the Past), Dominick LaCapra, Aleida Assmann.
      *   *The Core Tension:* Truth (correspondence) vs. Meaning (coherence/utility).
      *   *The "Archive":* Not neutral. It's a selection process (Trouillot).
      *   *The "Memory":* Not static. It's reconstructive (Halbwachs).

  3.  **Evaluate the User's Diagnostic Options:**

      *   *Epistemic Norms:* Yes, definitely. One side values correspondence truth, the other values testimonial justice.
      *   *Verbal Confusion:* Partially. "History" is being used to mean "academic discipline" vs. "public narrative." But it's deeper than just semantics.
      *   *Moral Precedence:* Yes. Truth-telling vs. Healing/Recognition.
      *   *Bedrock Intuitions:* Yes. This touches on what makes a community *a* community.

  4.  **Formulate the Diagnosis:**

      *   It's not *just* one of these. It's a *category collision* fueled by *moral stakes*.
      *   The "Archivalist" view treats history as a *regulative ideal* (getting it right).
      *   The "Mnemonic Sovereigntist" view treats memory as a *constitutive practice* (making us who we are).
      *   The conflict arises because both claim the *public square* (schools, museums, courts). If they stayed in their lanes (academy vs. ritual), it might be less fraught. But they collide in civic space.
      *   *Crucial Insight:* The archive is not "fact" in a vacuum; it is "fact" produced by a specific bureaucracy. The memory is not "myth" in a vacuum; it is "testimony" produced by lived experience. The conflict is often about *whose* fact-counting mechanism is trusted.
      *   *Diagnosis:* It is a **normative collision over the function of public truth.** It looks like an epistemic dispute, but it is driven by moral/political stakes regarding legitimacy.

  5.  **Determine What Counts as Progress:**

      *   *Empirical Study:* Unlikely to resolve it. Data won't tell you whether dignity outweighs precision.
      *   *Conceptual Distinction:* Helpful, but doesn't solve the resource allocation problem (who gets the museum budget?).
      *   *Institutional Design:* Most promising. Differentiating spaces for "critical history" and "sacred memory."
      *   *Admission of Impasse:* Too defeatist. Productive tension is possible.
      *   *Best Path:* **Pluralistic Institutional Ecology.** Acknowledge that "History" (discipline) and "Memory" (practice) serve different goods and need different venues, but require translation mechanisms between them.

  6.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Intellectual, empathetic, rigorous, avoiding taking sides.
