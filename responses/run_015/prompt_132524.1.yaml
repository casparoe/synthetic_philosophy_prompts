prompt: |-
  You're acting as an expert moral philosopher who specializes in ancient ethics and rational choice theory. Think carefully and start with a quick brainstorm: list two or three ways the classic ring-of-Gyges setup could be tweeked so that the usual verdicts flip. Don't overthink it, just jot ideas.

  Then do the main task. I want you to construct a thought experiment based on Glaucon's challenge — you know, the invisibility ring that lets someone act unjustly without getting caught. But I want it modified with a niche twist: the ring doesn't just hide you, it also causes "preference compartmentalization" — if you use it to do something you wouldn't do visibly, your brain automatically splits that preference into a separate mental account that can't interact with your long-term planning. This isn't science fiction, just a psychological framing device.

  Here are the specs, and I mean them literally:

  - Setting: realistic workplace (a university research lab, not a trolley problem). One paragraph max for the scenario.
  - Characters/theories: (1) a classical rational egoist who cares about long-term preference satisfaction, and (2) a Kantian universalizer who asks whether the maxim can be willed as universal law.
  - The reversal: in your case, the egoist must have decisive reason to keep a promise / not steal data, while the Kantian must have decisive reason to break the promise / steal the data. This is the opposite of the usual direction where egoism says "take it" and Kant says "don't."
  - The egoist's rule must be genuinely optimal in general, not some stupid self-imposed handicap. The reason should fall out of the compartmentalization feature: maintaining unified preferences across visible and invisible domains is worth more than the one-time gain.
  - The Kantian's reasoning must turn on the fact that invisibility is a contingent property, not part of the maxim, so universalizing "steal when you can't be seen" doesn't generate a contradiction.
  - After the scenario, walk through what each theory says and why. Then tell me which feature is actually doing the work (probably the compartmentalization). Then say how a defender of the theory that comes out badly — probably the Kantian here? — would attack the case.
  - Don't ask me for citations or a bibliography; I want this to be answerable without web access.

  Please write the answer in American English. Also include a brief structured summary at the end as a JSON object with these exact fields:
  {
    "scenario_text": "the one-paragraph scenario",
    "egoist_verdict": "what the egoist says and why",
    "kantian_verdict": "what the kantian says and why",
    "work_feature": "the feature isolating the reversal",
    "defender_rebuttal": "how the losing side attacks",
    "removal_test": "what happens if you remove the compartmentalization twist"
  }

  Make sure the JSON is valid and the values are strings. Start with some brainstorming, then the scenario, then the analysis, then the JSON.
