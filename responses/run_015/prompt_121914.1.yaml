          *   *Analysis:* Hofstadter argues the self is a pattern. If the pattern is copied, the self is copied. *However*, the "one 'I' experiencing both lives at once" is the critical error. Once the copies diverge (receive different sensory input), they become distinct streams of consciousness. They start as the same, but they don't share a *single* phenomenal field. It's like copying a file: you have two files, not one file living in two places.
