answer: |-
  Your brother has captured the *spirit* of Hofstadter's philosophy (that the self is information, not matter), but he has significantly distorted the *mechanics* and the *conclusions*. He is mixing Hofstadter's actual cognitive science with some sci-fi extrapolations and mystical interpretations that Hofstadter does not support.

  Here is a sentence-by-sentence breakdown of what is Hofstadter, what is your brother, and specifically addressing your questions about friends merging and the utility of identity.

  ### 1. The Claim: "Hofstadter literally proves that if you copy a brain exactly into another body, both bodies share the exact same consciousness and there is only one 'I' experiencing both lives at once."

  *   **Verdict:** **False / Major Misinterpretation.**
  *   **What Hofstadter Actually Says:** Hofstadter argues that the "self" is a pattern (a "Strange Loop"), not the physical meat of the brain. Therefore, if you copy the pattern exactly, you have copied the self. *However*, he does **not** claim there is a single, shared subjective experience ("one 'I' experiencing both").
  *   **The Correction:** Think of it like copying a computer file. If you copy a Word document to a USB drive, you now have two files. They are identical at the moment of copying. But if you type a sentence in one, it does not appear in the other.
      Hofstadter acknowledges that once the two brains are separated, they begin receiving different sensory input. At that exact moment, they diverge into **two distinct streams of consciousness**. There is no magical telepathic link where "one I" sees through four eyes. There are now two "I"s that share a past but have separate futures.

  ### 2. The Claim: "He said this means death of one copy isn't a real losing since the same self keeps going in the other body..."

  *   **Verdict:** **Stretching / Oversimplified.**
  *   **What Hofstadter Actually Says:** This is a common philosophical position (often associated with Derek Parfit), but Hofstadter is more ambivalent. In *Gödel, Escher, Bach* (specifically the "Prelude and Ant Fugue" and later discussions), he acknowledges that the *pattern* survives, which is comforting from an outside perspective.
  *   **The Correction:** However, Hofstadter is very concerned with **continuity**. He admits that from the *inside* perspective of the original, if that brain is destroyed, the experience stops. He has expressed in interviews that while the "pattern" survives in the copy, the break in continuity feels like death to the original. He doesn't dismiss the loss as "not real"; he acknowledges it as a philosophical tragedy that pattern theory creates.

  ### 3. The Claim: "...and that this kind of merging can happen naturally between close friends or twins without any tech, just because their mental patterns sync up over time."

  *   **Verdict:** **Mostly Made Up.** (This is the part you were most suspicious of).
  *   **What Hofstadter Actually Says:** Hofstadter does talk about how we carry "simulations" of other people in our heads. In his book *I Am a Strange Loop*, he argues that when you know someone deeply, you build a complex model of them in your neural network. In that sense, a "fragment" of them lives in you.
  *   **The Correction:** He **never** claims that two living people merge into a single identity or share a consciousness naturally. He is a cognitive scientist, not a mystic. He doesn't believe in telepathic syncing.
      *   **What he means:** "I know my wife so well I can predict what she will say."
      *   **What your brother implies:** "We have become one soul."
      Hofstadter would say you have high-fidelity *models* of each other, not that your identities have merged. You are still two separate "Strange Loops."

  ### 4. The Claim: "He also said Hofstadter thinks personal identity is basically useless now since one self could be spread across ten different brains and still be one person."

  *   **Verdict:** **Too Strong / Inaccurate.**
  *   **What Hofstadter Actually Says:** Hofstadter's book is literally titled *I Am a Strange Loop*. He is not trying to prove the "I" is useless; he is trying to prove the "I" is **real**, but not in the way we think (i.e., not an indivisible soul).
  *   **The Correction:** He argues identity is **fluid** and **porous**, not useless. He believes the "I" is a powerful illusion that is necessary for consciousness to function. While he entertains the thought experiment that a pattern *could* be spread across multiple substrates, he doesn't walk around acting like identity doesn't matter. He values the individual "loop" immensely. Calling it "useless" contradicts his entire life's work, which is trying to explain how the "I" emerges and why it matters.

  ### Summary: Where your brother went wrong

  Your brother has taken Hofstadter's **metaphysics** (the self is software, not hardware) and turned it into **magic**.

  1.  **Shared Consciousness:** Hofstadter says copies start identical but immediately become separate people. Your brother thinks they remain one entity.
  2.  **Natural Merging:** Hofstadter says we carry *models* of friends in our heads. Your brother thinks friends actually *merge identities*.
  3.  **Uselessness:** Hofstadter says identity is *complex*. Your brother says it is *obsolete*.

  **The Verdict:** Your brother understands the "hook" of Hofstadter's idea (you are a pattern!), but he hasn't grasped the nuance. The "friends merging" part is definitely an exaggeration bordering on fabrication; Hofstadter talks about carrying *traces* of the dead or loved ones, not merging living consciousnesses.

  If you want to correct him gently, you could say: *"Hofstadter says we carry simulations of each other, not that we merge. And he definitely thinks that if you copy a brain, you get two people, not one person with two bodies."*
