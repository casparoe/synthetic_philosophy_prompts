          *   *Most Coherent Principle:* **"Foreseeable Risk Management."**
              *   You are responsible if you occupy a role where you are expected to manage foreseeable risks associated with the system's deployment.
              *   Case 1: Company manages deployment risk.
              *   Case 2: Engineer manages objective risk.
              *   Case 3: Auditor manages certification risk; Driver manages operational risk.
              *   Case 4: Doctor manages clinical risk.
              *   Case 5: *Revision Needed.* If the storm/emergence was a foreseeable risk of swarm deployment, the Operator is liable. If it was truly acts-of-God level unpredictability, then no blame. But to align with Case 1 (where "no human fully understands" the algo), we must assume opacity doesn't excuse the deployer.
              *   *Verdict:* Case 5 is the outlier. It claims "no appropriate locus of fault." But Case 1 claims the Company *is* the locus despite opacity.
              *   *Repair:* The Company/Operator in Case 5 should bear responsibility (vicarious/enterprise liability), just like Case 1.

  4.  **Drafting the Principle:**
      *   Name: **The Principle of Competent Stewardship.** (Or "Risk Domain Authority").
      *   Core: Accountability attaches to the agent (individual or corporate) who has the authority and duty to manage the specific class of risk that materialized, provided that risk was reasonably foreseeable or within the scope of their professional/operational mandate.
