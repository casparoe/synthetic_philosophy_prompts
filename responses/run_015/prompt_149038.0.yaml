answer: |-
  This is a sharp framing. You're right to bypass the standard *Economic Possibilities for our Grandchildren* (EPG) summary; the essay is a hook, but the philosophical machinery is buried in his moral philosophy, his Bloomsbury connections, and the darker corners of *The General Theory*.

  If you have six months part-time, you cannot chase every rabbit. You need to identify the load-bearing walls. If you pull one out, does the whole interpretation of Keynes's "Good Life" collapse?

  Here is the ranking of the three upstream lines of inquiry, ordered by logical priority and downstream policy bite.

  ### 1. The Ontology of Want: Absolute vs. Relative Needs
  **Priority:** Foundational (The "If")
  **Tractability:** High (Conceptual, not mathematical)
  **Downstream Bite:** High (Determines the viability of post-scarcity policy)

  This is the most upstream question because it validates the premise of everything else. Keynes's entire vision of the "Good Life" rests on the claim that **absolute needs** (food, shelter, security) are finite and saturable, while **relative needs** (status, superiority) are insatiable but ultimately unimportant for well-being. He argues that once absolute needs are met, the economic problem is solved, and we can ignore the relative game.

  **Why it's upstream:** If human psychology is hardwired for status competition (as Veblen or later positional economists argue), then scarcity is permanent. If scarcity is permanent, the 15-hour week is impossible, and the "problem of abundance" is a mirage. If you settle this, you know whether Keynes is offering a roadmap or a fable.

  **Research Focus:**
  *   Don't just read EPG. Go to Chapter 24 of *The General Theory* ("Concluding Notes on the Social Philosophy towards which the General Theory might Lead"). This is where he gets serious about the "love of money" as a possession rather than a means.
  *   Look for where he acknowledges relative needs. He *does* know about them (he was a speculator, after all). The question is: Does he treat them as a transitional pathology or a permanent feature?
  *   **Tractability:** You don't need an Econ PhD. You need to trace the definition of "need" across his texts. Is it biological? Psychological? Social?

  **What would change your mind:** If you find evidence that Keynes viewed relative competition not as a "morbidity" to be outgrown, but as a necessary engine for innovation that the state must preserve. If he secretly believed the "race" was the point, EPG becomes ironic, not prophetic.

  **Policy Bite:** If Keynes was right (needs saturate), Universal Basic Income (UBI) and work-hour reductions are viable paths to freedom. If he was wrong (needs are relative), UBI just inflates the status game, and policy must focus on curbing inequality rather than increasing aggregate wealth.

  ### 2. The Teleology of Leisure: Aristotelian Virtue vs. Bloomsbury Aestheticism
  **Priority:** Teleological (The "What")
  **Tractability:** Medium (Requires synthesizing biography and policy memos)
  **Downstream Bite:** High (Determines the logic of cultural funding)

  Once we assume leisure is possible (Line 1), what is it *for*? This is the fight between the Aristotelian reading (leisure is for *eudaimonia*, civic virtue, and moral self-improvement) and the Bloomsbury reading (leisure is for states of consciousness, aesthetic appreciation, and personal affection).

  **Why it's upstream:** This dictates the design of the "Good Life." If it's Aristotelian, the state should fund education, civic spaces, and activities that build character. If it's Bloomsbury/Aesthetic, the state should fund high art, opera, and ballet, assuming beauty justifies itself regardless of civic utility. This resolves the tension you noted about his liberal politics: a liberal state usually stays neutral on the "good," but an Aristotelian state actively shapes character.

  **Research Focus:**
  *   Examine his work with the Arts Council of Great Britain. Was he funding art to "civilize" the masses (Aristotelian/Paternalistic) or to preserve beauty for its own sake (Aesthetic)?
  *   Read *My Early Beliefs* (1938). Here he reflects on G.E. Moore's *Principia Ethica* (the Bible of Bloomsbury). Did he reject Moore's aestheticism in favor of a more public-minded virtue later in life?
  *   **Tractability:** Doable in 6 months. The Arts Council archives are digitized; the philosophical shift is well-documented in biographies (Skidelsky is key here, but read critically).

  **What would change your mind:** If his arts funding was purely elitist "trickle-down culture" (beauty for the few) rather than democratic access. If he believed only a minority could handle leisure virtuously, his vision is incompatible with modern democracy.

  **Policy Bite:** This is the difference between funding a local community theater (civic virtue) vs. a national opera house (aesthetic preservation). It determines whether cultural policy is about *participation* or *preservation*.

  ### 3. The Moral Psychology of Accumulation: Pathology vs. Rational Habit
  **Priority:** Mechanistic (The "How")
  **Tractability:** High (Textual analysis)
  **Downstream Bite:** Medium (Frames inequality and tax policy)

  This addresses your specific point about money-love. Keynes describes the love of money as a "disgusting morbidity," a semi-criminal, semi-pathological habit inherited from the age of scarcity. He views it as a historical holdover, not a rational permanent trait.

  **Why it's upstream:** This explains *how* we transition from Line 1 to Line 2. If money-love is a rational response to insecurity, you can't tax it away without causing harm. If it's a pathology (like a phobia), the state can treat it. This clarifies the liberalism clash: a liberal state doesn't cure pathologies, but a therapeutic state might.

  **Research Focus:**
  *   Analyze his language around "accumulation" vs. "enjoyment."
  *   Look at his personal investment behavior vs. his public writing. Did he practice what he preached?
  *   **Tractability:** Very high. This is close reading of *Essays in Persuasion* and his correspondence.

  **What would change your mind:** If you find he viewed accumulation as a rational insurance mechanism against political instability, rather than a psychological sickness.

  **Policy Bite:** If it's a pathology, high marginal tax rates on wealth are "therapy." If it's rational, they are "confiscation." This changes the moral framing of tax policy today.

  ---

  ### The Framing Trap: Money-Love vs. Anti-Materialism
  **Yes, this is a confusion you must avoid.**

  Keynes is **not** an anti-materialist in the Buddhist or ascetic sense. He does not argue that money is evil. He argues that money is a *means* that has been mistakenly worshipped as an *end* due to historical scarcity.

  *   **The Confusion:** Framing him as preaching that "wealth is bad."
  *   **The Correction:** Frame him as arguing that "the *hoarding* of wealth is a historical lag." He wants people to have enough money to be free, so they can stop caring about money.

  **Why this matters for your project:** If you frame him as anti-materialist, you alienate the economic reality of his thought. He was a capitalist who believed in the efficiency of markets to solve the absolute need problem. His critique is *temporal* (this is useful now, but not later), not *moral* (this is sin). If you miss this, you turn him into a moralist rather than a diagnostician, which weakens the policy relevance.

  ### Summary of the 6-Month Plan

  1.  **Months 1-2 (Line 1):** Settle the **Needs** question. Read EPG alongside Chapter 24 of *The General Theory*. Map the definitions of absolute vs. relative. *Deliverable:* A position paper on whether Keynes's saturation thesis is empirical or normative.
  2.  **Months 3-4 (Line 2):** Settle the **Leisure** question. Read *My Early Beliefs* and Arts Council founding documents. *Deliverable:* An analysis of whether his cultural policy was paternalistic (virtue) or aesthetic (beauty).
  3.  **Months 5-6 (Line 3 & Synthesis):** Settle the **Psychology** question and write. Connect the pathology of money-love to the transition mechanism. *Deliverable:* The final argument linking the three lines.

  **Final Defense of Ranking:**
  I put **Needs** first because if scarcity never ends, the rest is academic. I put **Leisure** second because if we don't know what freedom is *for*, we can't design policy for it. I put **Psychology** third because it explains the transition, but relies on the first two being true.

  If you solve Line 1, you know if the destination exists. If you solve Line 2, you know what the destination looks like. Line 3 just tells you how to drive the car. Focus your energy on the destination.
