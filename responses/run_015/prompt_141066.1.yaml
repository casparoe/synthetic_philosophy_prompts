  Give me:

  Table 1, one row per candidate rule you're considering, columns:
  - rule — one sentence, stated so I could apply it to a new bet myself
  - old_cases — which of the five old numbers it reproduces and where it strains, a few words per case
  - week_1_stake — what it says I should put on the first week, in dollars, ignoring the $10k cap
  - as_pct — that same number as a percent of the account
  - what_it_assumes — the one move it makes that the others don't

  Table 2, rows are questions, columns are question and answer:
  - best_guess: the number Dev says, in dollars
  - main_reason: the single strongest reason to prefer that rule over the others
  - base_question: whether the money you've got in his rule means the account or everything including the salary and the 401(k), and the one question I should ask him to settle it
  - tiebreaker_case: one concrete extra case, described in a sentence or two, that would separate the two rules that end up closest on mine
  - window_and_contributions: whether the 26-week window and the monthly $2,500 change the number, and in which direction
  - what_id_do: if his rule isn't obviously the right one for someone with a paycheck and a 401(k), what I should do instead

  Then one last line, no hedging: the number you'd actually bet in week one.
