      *   **Tone:** Warm, sober, civic-minded (not overly elegiac/sad, not academic/dry). Accessible but substantive.
      *   **Duration:** 6-8 minutes (approx. 900-1100 words spoken at a moderate pace).
      *   **Goals:**
          *   Be gracious to filmmakers.
          *   Validate historians' concerns.
          *   Guide ordinary viewers to watch with pleasure *and* reserve.
          *   Close by inviting remembrance of the *real* person.

  2.  **Determine the Structure:**
      *   **Welcome & Gratitude:** Acknowledge the event, the town, the filmmakers, and the diverse audience.
      *   **The Nature of the Film:** Acknowledge it's a drama, not a documentary. Address the changes openly (compression, composites, dramatization).
      *   **The Core Distinction:** Factual accuracy vs. Emotional/Character truth. Explain *why* changes were made (narrative flow vs. reality's messiness).
      *   **The Boundary/Limit:** Warn against letting the movie replace memory. Address the simplification of motives.
      *   **Guidance for Viewing:** How to watch (enjoy the story, but hold the reality alongside it).
      *   **Closing:** Honor the real woman, distinct from the character. Invite the screening.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Start with warmth. Welcome everyone. Acknowledge the mix of people in the room (family, historians, neighbors). Thank the filmmakers for their care.
      *   *Addressing the Changes:* Be direct. It's not a documentary. Mention the specific changes noted in the prompt (years into one winter, colleagues into one, correspondence into a kitchen argument). Why? To make the struggle *feelable* in two hours.
      *   *The Philosophical Core (Simplified):* This is the tricky part. Needs to be accessible. Use an analogy? Maybe a portrait vs. a photograph? Or a map vs. the terrain? Let's go with the idea of "truth of record" vs. "truth of spirit." Acknowledge that facts matter (nod to historians) but so does understanding the *drive* behind the action.
      *   *The Warning:* Don't let the movie become the history. The real mother was more complex. The movie simplifies motives for clarity. That's okay for art, but not for history.
      *   *Instruction to Audience:* Watch with heart, but keep your own memories active. Historians: check the record later. Neighbors: enjoy the story, but know there's more depth.
      *   *Conclusion:* Bring it back to the mother. The character on screen is a vessel; the real woman was the source. Let's watch, then let's remember.

  4.  **Refining Tone and Content (Self-Correction during drafting):**
      *   *Check:* Is it too academic? *Correction:* Avoid words like "epistemological" or "verisimilitude." Use "truth," "memory," "story."
      *   *Check:* Is it too harsh on the filmmakers? *Correction:* Emphasize collaboration and consent. "With our family consent."
      *   *Check:* Is it too sad? *Correction:* Keep it civic-minded. Focus on her service and the town's health, not just personal grief.
      *   *Check:* Timing? *Correction:* A 7-minute speech is roughly 1000 words. I need to ensure I don't ramble.
      *   *Specific Prompt Requirement:* "Without treating the second [faithfulness to character] as a license to rewrite the first [facts]." I need to make sure this line is clear. The invention serves understanding, not replacement.

  5.  **Drafting the Content (Iterative Process):**
