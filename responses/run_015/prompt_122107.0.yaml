answer: |-
  Your six intuitions are remarkably coherent. They do not require revision; rather, they collectively point toward a specific refinement of the epistemic closure principle. Standard logical closure (if $K(P)$ and $P \vdash Q$, then $K(Q)$) fails because it ignores the cognitive architecture of the knower. Your cases suggest that knowledge transmission requires not just a logical link, but a **cognitively integrated inferential process**.

  There is a single principle that saves all six verdicts. I call it the **Principle of Actualized Inferential Understanding**.

  ### The Principle

  For a reasoner $S$ to know a conclusion $Q$ on the basis of known premises $P$, three conditions must be met simultaneously:

  1.  **The Doxastic Condition:** $S$ must hold an actual belief in $Q$. Mere disposition or latent commitment is insufficient; the belief state regarding $Q$ must be formed.
  2.  **The Actualization Condition:** The inferential process linking $P$ to $Q$ must be cognitively executed or reliably verified. Mere potentiality (the ability to derive) does not transmit warrant.
  3.  **The Comprehension Condition:** $S$ must grasp the *warrant* connecting $P$ to $Q$. This requires understanding the strategic or logical "why" of the inference, distinguishing it from rote memorization of syntactic steps. This comprehension allows for reliable delegation (e.g., to computers) provided the agent understands the *role* of the delegation in the proof strategy.

  ---

  ### Mapping the Principle to Your Cases

  Here is how the three clauses resolve your six scenarios:

  *   **Case 1 (Student, Potential Derivation):** **Fails Actualization.**
      *   *Clause:* The Actualization Condition.
      *   *Analysis:* The student has the capacity (potential) but has not executed the inference. Without the cognitive act of derivation, the warrant inherent in the axioms has not been transferred to the theorem in her mind.
  *   **Case 2 (Student, Actual Derivation):** **Passes All.**
      *   *Clause:* Satisfies Doxastic (believes theorem), Actualization (performed proof), and Comprehension (understood steps).
      *   *Analysis:* The labor of proof actualizes the warrant, converting logical entailment into epistemic knowledge.
  *   **Case 3 (Logician, Dormant Beliefs):** **Fails Doxastic.**
      *   *Clause:* The Doxastic Condition.
      *   *Analysis:* Even if the logician is disposed to believe $Q$, she currently lacks the belief state regarding $Q$. One cannot know what one does not believe. The inference has not been triggered to form the conclusion-belief.
  *   **Case 4 (Logician, Active Inference):** **Passes All.**
      *   *Clause:* Satisfies Doxastic (forms belief $Q$) and Actualization (immediate inference).
      *   *Analysis:* The gap between premises and conclusion is closed by the active cognitive act of inference, satisfying the requirement for belief formation.
  *   **Case 5 (Researcher, Rote Memorization):** **Fails Comprehension.**
      *   *Clause:* The Comprehension Condition.
      *   *Analysis:* Possessing the syntactic chain (the lines of proof) without understanding the inferential joints means the researcher possesses data, not warrant. She knows *that* the steps follow, but not *why*, breaking the transmission of understanding.
  *   **Case 6 (Mathematician, Computer Assist):** **Passes All.**
      *   *Clause:* Satisfies Comprehension (grasps strategy) and Actualization (via verified tool).
      *   *Analysis:* This is the critical test. The mathematician does not derive every step (violating a strict "personal labor" view), but she satisfies Comprehension by grasping the high-level strategy and satisfies Actualization by relying on a verified tool. The tool acts as a reliable cognitive extension, which is permissible *because* she understands its strategic role.

  ---

  ### Prediction for the New Scenario

  **Scenario:** A reasoner who knows her premises entail a conclusion, knows precisely which algorithm would derive it, but has never executed it and does not know any of the intermediate steps.

  **Verdict:** **She does not know the conclusion.**

  **Application of the Principle:**
  1.  **Fails Actualization:** She has never executed the algorithm. Like Case 1, the inference remains potential. Knowing *that* an algorithm exists is not the same as the algorithm doing the work to warrant the belief.
  2.  **Fails Comprehension:** She does not know the intermediate steps. Unlike Case 6 (where the mathematician understands the *strategy* and the *verification method*), this reasoner only knows *that* a derivation is possible. She lacks insight into the specific warrant connecting her premises to this conclusion.
  3.  **Fails Doxastic (Likely):** If she has not executed the algorithm, she likely does not hold a belief in the conclusion *based on this derivation*. If she believes it on authority, she might know it, but not *on the basis of these premises*.

  **Philosophical Justification:**
  This scenario is distinct from Case 6 because "knowing an algorithm exists" is closer to "knowing a proof exists" than to "understanding a proof strategy." In epistemology, knowing that a proof is available (without accessing it) does not constitute knowing the theorem. The warrant remains locked in the unexecuted algorithm. Until the process is actualized (run) or the strategic warrant is understood (Case 6), the logical entailment remains external to her epistemic state.

  ### Conclusion

  You need not overturn any of your intuitions. They collectively argue against **Logical Closure** (knowledge is closed under known entailment) and in favor of **Cognitive Closure** (knowledge is closed under *actualized, understood* inference).

  The boundary you are seeking lies in **Inferential Integration**. Logical entailment is a relation between propositions; epistemic closure is a relation between *cognitive states*. For the latter to hold, the agent must bridge the gap with actual cognitive labor (or understood delegation) that transforms latent logical support into active warrant.
