prompt: |-
  Twenty years into the evolutionary debunking literature it feels totally frozen: the Darwinian-dilemma style arguments keep coming, the third-factor / dovetailing replies and the "that would be an unexplained coincidence" replies keep coming, everyone agrees on the evolutionary story itself — that selective pressures shaped a big chunk of our moral psychology toward fitness rather than toward the moral facts — and nobody moves an inch. I want a diagnosis of the stalemate, not another survey of who said what.

  Here's my hunch, which I might be wrong about. I think "our moral beliefs were selected for fitness, not for truth" is agreed on by both sides and actually does no work; what does the work is a counterfactual claim nobody states out loud — that had the moral facts been different (if, say, gratuitous cruelty had been morally required, or impartial benevolence forbidden) our beliefs would have come out roughly the same anyway. Call the first thesis Off-Target and the second Insensitive. If I'm right, the interesting question isn't about evolution at all but about the space of possible selective pressures, and both sides are answering it from the armchair, which is why it plays out as people restating priors at each other.

  A second thing I notice: the sides seem to be using different exhibits. Debunkers reach for kin altruism, reciprocity, purity/disgust and loyalty, where the fitness story is detailed; the third-factor people reach for impartial claims about harm and fairness, where it's much easier to say that the truth itself was fitness-conducive. So maybe it's partly a fight about which beliefs are the data, and the "all moral beliefs or none" framing is what keeps it stuck.

  So: verbal, or substantive? A hidden empirical/counterfactual question, a disagreement about which cases count as data, a clash of priors and burdens of proof in epistemology, or two questions under one name? Argue for one (or tell me it splits several ways and by how much), and then tell me what would count as progress given your diagnosis — a distinction like mine, some formal result about tracking, restricting the argument to a subclass of moral beliefs, an actual result about counterfactual selection — or tell me honestly that no progress should be expected and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The evolutionary debunking argument (EDA) literature in metaethics (Sharon Street, Richard Joyce, Guy Kahane, David Enoch, etc.).
      *   **Problem:** The literature feels "frozen" or "stalemate." Everyone agrees on the evolutionary story (fitness, not truth), yet arguments repeat (Darwinian Dilemma vs. Third-Factor/Dovetailing).
      *   **User's Hunch:**
          1.  The core issue isn't the actual evolutionary history (Off-Target thesis) but a counterfactual claim about sensitivity (Insensitive thesis): *Would* our beliefs be different if moral facts were different?
          2.  The sides are talking past each other by focusing on different *types* of moral beliefs (Debunkers: kin/reciprocity/purity vs. Realists: impartial harm/fairness).
      *   **Task:** Diagnose the stalemate (Verbal? Substantive? Hidden empirical? Clash of priors? Two questions?). Argue for one diagnosis. Then, specify what would count as *progress* given that diagnosis (or admit no progress is expected).
      *   **Constraint:** Do *not* provide another survey of who said what. Focus on the structural/philosophical diagnosis.

  2.  **Evaluate the User's Hunch:**
      *   *Hunch 1 (Off-Target vs. Insensitive):* This is sharp. The standard EDA says "Evolution shaped X for fitness." Realists say "Fitness tracks Truth." The user suggests the real engine is the counterfactual: "If Truth were ~T, would we still believe T?" This aligns with sensitivity/safety conditions in epistemology.
      *   *Hunch 2 (Different Exhibits):* Also sharp. Debunkers love the "weird" stuff (purity, tribalism) where truth-tracking looks implausible. Realists love the "core" stuff (suffering is bad, fairness is good) where tracking looks plausible. This suggests a scope disagreement.

  3.  **Formulate a Diagnosis:**
      *   Is it merely verbal? No, there are substantive epistemic commitments at stake.
      *   Is it purely empirical? No, we can't run the counterfactual evolution experiment.
      *   Is it a clash of priors/burdens? Yes, but that's too generic.
      *   *Best Diagnosis:* It is a **category error regarding the scope of the target**, compounded by a **modal epistemic gap**.
      *   Specifically: The debate conflates *genealogical origins* with *modal reliability*. The "Off-Target" premise is a red herring; the real fight is about the *modal distance* between the actual world and the nearest possible world where moral facts differ.
      *   Furthermore, the "Different Exhibits" point suggests the debate is actually *two distinct debates* masquerading as one: (1) The debunking of *adaptive* moral intuitions (purity, loyalty) vs. (2) The vindication of *reflective* moral principles (harm, fairness).
      *   *Decision:* I will argue that the stalemate is due to **Scope Ambiguity + Modal Epistemic Standoff**. It's not just one thing; it's that the "General EDA" tries to cover too much ground, allowing realists to retreat to safe ground while debunkers attack weak ground.

  4.  **Develop the Argument:**
      *   **Acknowledge the User's Insight:** Validate the Off-Target/Insensitive distinction. It's essentially the difference between an *etiological* claim and a *subjunctive* claim.
      *   **The Core Problem:** The debate treats "moral beliefs" as a monolith.
      *   **Debunker Strategy:** Attack the monolith by showing cracks in the adaptive base (kin selection, etc.).
      *   **Realist Strategy:** Defend the monolith by pointing to the reflective superstructure (human rights, impartiality).
      *   **Why it's Frozen:** Because neither side can prove the modal claim (Insensitive). Debunkers assert "We'd believe the same." Realists assert "We'd believe differently (because truth guides fitness)." Neither can prove it without begging the question (assuming moral realism to prove tracking, or assuming anti-realism to prove non-tracking).
      *   **The "Two Questions" Thesis:** This is the strongest move. There is the *Local Debunking* project (specific adaptive traits) and the *Global Reliability* project (can morality be objective given evolution?). These have different standards of proof.

  5.  **Determine What Counts as Progress:**
      *   If the diagnosis is "Scope Ambiguity + Modal Standoff," then progress requires:
          1.  **Disaggregation:** Stop treating "morality" as one thing. Separate *adaptive intuitions* from *reflective equilibria*.
          2.  **Modal Precision:** Move away from armchair counterfactuals ("Would we still think torture is bad?"). Look for *independent* constraints on moral truth that aren't just fitness proxies.
          3.  **Epistemic Shift:** Move from "Tracking" (causal connection) to "Explanation" (best explanation).
      *   *Concrete Proposal:* Progress looks like restricting EDAs to specific *classes* of belief (e.g., purity norms) while conceding that EDAs fail against *reflective* principles unless a specific defeater is found for *those*. Conversely, Realists must admit that *origin* matters for *justification* in the adaptive sphere.
      *   *Hard Truth:* No "knockdown" argument is possible because the core counterfactual is metaphysically inaccessible. Progress is *dialectical clarification*, not resolution.

  6.  **Drafting the Response (Iterative refinement):**
