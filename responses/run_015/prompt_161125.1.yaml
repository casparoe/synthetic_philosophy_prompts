answer: |-
  Your hunch is correct, and it cuts deeper than most contributions to the last decade of the literature. You have identified the two structural flaws that keep the debate spinning: the **Modal Epistemic Gap** (your Off-Target vs. Insensitive distinction) and the **Scope Conflation** (your "Different Exhibits" observation).

  Here is the diagnosis: The stalemate is **substantive**, not verbal, but it is sustained by a **category error regarding the scope of the target**. The debate is trying to solve two different problems with one argumentative tool.

  ### 1. The Diagnosis: Modal Standoff + Scope Conflation

  You are right that the "Off-Target" thesis (evolution selected for fitness, not truth) is a red herring. It is a premise both sides accept, yet it does no heavy lifting. A process can select for $X$ while incidentally tracking $Y$, provided $X$ and $Y$ are correlated. The debunker knows this; the realist knows this.

  The real engine of the argument is the **Insensitive** thesis: *In the nearest possible world where the moral facts differ, our moral beliefs remain the same.*

  **Why this causes a stalemate:**
  This is a modal claim about a counterfactual history that is metaphysically inaccessible. We cannot run the simulation.
  *   **The Debunker** asserts Insensitivity by assuming the *only* causal link is fitness. They argue: "Evolution pushes toward survival. If survival required cruelty, we'd believe cruelty is good. Therefore, our actual belief that cruelty is bad is not sensitive to the truth of cruelty's badness, but to its fitness costs."
  *   **The Realist** asserts Sensitivity by assuming a *constitutive* or *third-factor* link. They argue: "Survival *requires* cooperation/truth-tracking. The moral facts *are* the facts about what allows flourishing. So if the moral facts were different, fitness requirements would be different, and our beliefs would track them."

  Notice the circle: The Debunker assumes moral facts are independent of fitness to prove non-tracking. The Realist assumes moral facts are linked to fitness to prove tracking. **Neither can prove the modal claim without begging the question against the other's metaethical framework.** This is why it feels like "restating priors." It is a clash of explanatory priors regarding *coincidence*. The Debunker sees a correlation between fitness and truth as a cosmic accident requiring explanation; the Realist sees it as a necessary convergence.

  **The Scope Conflation:**
  Your second observation explains *why* the priors don't crash into each other and resolve. The sides are debating different datasets.
  *   **Debunkers** target **Adaptive Intuitions** (purity, tribal loyalty, kin-preference). Here, the Insensitive thesis is highly plausible. It is easy to imagine a world where tribalism was fitness-conducive but morally wrong, yet we would still believe it right.
  *   **Realists** defend **Reflective Principles** (impartial harm, fairness, rational consistency). Here, the Insensitive thesis is much harder to maintain. It is difficult to imagine a world where *impartial reasoning* leads to the conclusion that *gratuitous suffering is good*, even if that belief were fitness-conducive.

  The stalemate persists because the "Evolutionary Debunking Argument" is treated as a single argument against "Morality." In reality, it is a **Local Debunking** argument masquerading as a **Global Reliability** argument. Debunkers use local successes (we were wrong about purity/loyalty) to cast doubt on global reliability. Realists use global necessities (we can't coherently deny harm principles) to deflect local critiques. They talk past each other because they are fighting over different territories under the same flag.

  ### 2. What Counts as Progress?

  Given this diagnosis, a "knockdown" argument is impossible. The modal standoff is rooted in fundamental metaethical commitments (Realism vs. Constructivism vs. Error Theory) that evolution alone cannot settle.

  However, **dialectical progress** is possible if the literature stops trying to solve the "Global" problem and accepts the "Local" split. Here is what progress looks like:

  **A. Disaggregation of the Target (The "Subclass" Move)**
  Progress requires formally restricting the scope of EDAs. We should stop asking "Does evolution debunk morality?" and start asking "Which specific moral beliefs are vulnerable to genealogical defeaters?"
  *   **Progress Condition:** A consensus that EDAs succeed against **non-reflective, adaptation-specific intuitions** (e.g., disgust-based norms, in-group bias) but fail against **reflective, equilibrium-tested principles** (e.g., impartiality, logical consistency in moral reasoning) *unless* a specific genealogical story is told for the latter.
  *   **Why this helps:** It forces Debunkers to do the hard work of tracing the evolutionary genealogy of *impartiality* specifically, rather than riding the coattails of *tribalism*. It forces Realists to concede that some of our "moral" intuitions are likely false fitness-tracks.

  **B. Shifting from Tracking to Explanatory Coherence**
  The "Insensitive" counterfactual is a dead end because it relies on a causal theory of knowledge (tracking) that may not apply to non-natural domains.
  *   **Progress Condition:** Moving the debate from "Did evolution track the truth?" to "Is Moral Realism the *best explanation* for the convergence between fitness and morality?"
  *   **Why this helps:** It turns the modal standoff into an Inference to the Best Explanation (IBE) contest. The Realist must argue that the "Third Factor" is a better explanation for the correlation than "Coincidence." The Debunker must argue that "Coincidence" is simpler. This is still hard, but it moves the debate from inaccessible counterfactuals to comparative theory choice, where progress is measurable.

  **C. Empirical Constraint on Counterfactuals**
  You noted both sides answer the counterfactual from the armchair. This is the weakest link.
  *   **Progress Condition:** Utilizing comparative primatology and cross-cultural anthropology to constrain the "nearest possible world." If we can show that *actual* variations in social structure lead to *predictable* variations in moral belief (controlling for fitness), we gain empirical traction on the Insensitive thesis.
  *   **Example:** If a species with different evolutionary pressures develops "moral-like" norms that converge on human impartiality, the Insensitive thesis weakens. If they diverge wildly based on ecological niche, it strengthens. We need **comparative moral psychology**, not just evolutionary speculation.

  ### 3. Honest Assessment: Should we expect resolution?

  **No.** Not in the sense of one side surrendering.

  The reason is that the "Insensitive" thesis ultimately rests on a metaphysical view of what moral facts *are*.
  *   If moral facts are **Platonic** (independent of minds), the Debunker wins the modal argument (evolution couldn't track them).
  *   If moral facts are **Kantian/Constructivist** (constituted by rational agency), the Realist wins the modal argument (evolution shaped the agents who constitute the facts).

  Evolutionary data cannot decide between Platonism and Constructivism. Therefore, the EDA literature will remain frozen as long as it pretends to be a neutral arbiter between metaethical views. It is not; it is a weapon used by opposing metaethical camps.

  **The Verdict:**
  Your diagnosis is right. The "Off-Target" premise is idle; the "Insensitive" premise is the unprovable engine; the "Different Exhibits" are the smoke screen.

  **Progress** will not come from a better argument, but from **dissolving the monolith**. The literature should split into:
  1.  **Local Genealogical Defeaters:** (Empirical project: Which specific norms are fitness artifacts?)
  2.  **Metaethical Coherence:** (Philosophical project: Does realism explain the fitness/truth correlation better than anti-realism?)

  Until the debate acknowledges that these are two different projects, it will remain a loop of restated priors. The "Global EDA" is a zombie argument; it should be allowed to die so the local work can proceed.
