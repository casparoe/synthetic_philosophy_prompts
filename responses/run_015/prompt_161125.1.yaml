          3.  Explain why the "Off-Target" premise is idle (as the user suspected).
          4.  Explain the "Different Exhibits" problem (Scope Conflation).
          5.  Define Progress: Disaggregation (Local vs. Global) + shifting from Tracking to Explanatory Coherence.
          6.  Honest assessment: No final resolution is likely, but the *terms* of the debate can improve.

