answer: |-
  # Session Plan: The Machine-Relativity Game

  **Topic:** Solomonoff Induction, Occam's Razor, and the Invariance Theorem
  **Time:** 75 Minutes
  **Participants:** 14 (Grad/Advanced Undergrad)
  **Materials:** Projector, Whiteboard, 28 Index Cards (14 per type), Markers.

  ## 1. The Setup (0:00 – 0:05)
  **Do not lecture.** Walk in, project **Slide 1** immediately.

  **Slide 1: The Data**
  > **Sequence:** $1, 2, 4, 8, 16$
  > **Task:** Predict the 6th term.
  > **Constraint:** You must submit a **Program** that generates the sequence.
  > **Payoff:**
  > *   If Correct: $50 - \text{Program Cost}$
  > *   If Incorrect: $0 - \text{Program Cost}$
  > **Goal:** Maximize your score.

  **Action:**
  1.  Divide the room physically: **Left Half (Group $\alpha$)** and **Right Half (Group $\beta$)**.
  2.  Hand out **Index Cards** face down.
      *   Group $\alpha$ gets **Machine Card A**.
      *   Group $\beta$ gets **Machine Card B**.
  3.  **Rule:** You may not show your card to anyone. You may not talk until Round 2.

  **Machine Card A (Group $\alpha$)**
  > **Instruction Set:**
  > *   `GEO` (Geometric: $2^{n-1}$) : **Cost 1**
  > *   `CHR` (Chord: $1+\binom{n}{2}+\binom{n}{4}$) : **Cost 10**
  > *   `FIX` (Constant) : **Cost 5**

  **Machine Card B (Group $\beta$)**
  > **Instruction Set:**
  > *   `GEO` (Geometric: $2^{n-1}$) : **Cost 10**
  > *   `CHR` (Chord: $1+\binom{n}{2}+\binom{n}{4}$) : **Cost 1**
  > *   `FIX` (Constant) : **Cost 5**

  *(Note: The formulas are printed on the cards so they don't waste time deriving them. They just choose the instruction.)*

  ## 2. Round 1: The Prior Trap (0:05 – 0:20)
  **Task:** Write your Program on a slip of paper.
  1.  Choose one instruction (`GEO` or `CHR`).
  2.  Calculate your **Cost** using your secret card.
  3.  Calculate your **Potential Score** (Assume you are Right: $50 - \text{Cost}$).
  4.  Submit the slip.

  **Facilitator Action:**
  *   Collect slips.
  *   Project **Slide 2**.

  **Slide 2: The Reveal (Partial)**
  > **Group $\alpha$ Average Potential Score:** [Calculate live: Most will pick `GEO` (Cost 1) $\to$ 49 pts]
  > **Group $\beta$ Average Potential Score:** [Calculate live: Most will pick `CHR` (Cost 1) $\to$ 49 pts]
  > **Hypothesis Split:**
  > *   Predicting 32 (`GEO`): __%
  > *   Predicting 31 (`CHR`): __%

  **The Hook:**
  Point out that both groups feel "rational." Both groups chose the **simplest** explanation in their language. Both groups have high confidence (high potential score).
  *   Ask Group $\alpha$: "Why did you pick `GEO`?" (Answer: It's simpler/cheaper).
  *   Ask Group $\beta$: "Why did you pick `CHR`?" (Answer: It's simpler/cheaper).
  *   **Do not reveal the truth yet.**

  ## 3. Round 2: The Adversarial Environment (0:20 – 0:35)
  **Task:** Predict the 7th term (contingent on the 6th).
  1.  Keep your same Program/Hypothesis (switching costs double).
  2.  **New Rule:** One volunteer (The Environment) will come to the front.
  3.  The Environment sees the aggregate bets (how many people are on 31 vs 32).
  4.  The Environment chooses the **actual** 6th term (31 or 32) to **minimize the Total Room Score**.

  **Facilitator Action:**
  *   Select a sharp grad student as "The Environment."
  *   Show them the tally: e.g., 7 people on 32, 7 people on 31.
  *   **The Twist:** The Environment chooses the number that wipes out the *higher cost* losers.
      *   If Group $\alpha$ (Cost 1 on 32) vs Group $\beta$ (Cost 10 on 32).
      *   If Truth is 31: Group $\alpha$ loses 1 pt. Group $\beta$ wins 40 pts.
      *   If Truth is 32: Group $\alpha$ wins 49 pts. Group $\beta$ loses 10 pts.
      *   *Instruction to Environment:* "Pick the outcome that makes the total sum of points lowest."
      *   Usually, this means punishing the group that bet heavily on the "wrong" thing, but since costs are symmetric (1 vs 10), the Environment will pick the outcome that forces the **Cost 10** group to be wrong.
      *   *Scenario:* If most of the room is on `GEO` (32), and Group $\beta$ is on `CHR` (31) with Cost 1...
      *   Wait, the symmetry is key.
      *   Group $\alpha$: `GEO` (Cost 1, Val 32). `CHR` (Cost 10, Val 31).
      *   Group $\beta$: `GEO` (Cost 10, Val 32). `CHR` (Cost 1, Val 31).
      *   If Environment picks 32: $\alpha$ gets 49, $\beta$ gets -10. Net: +39 per pair.
      *   If Environment picks 31: $\alpha$ gets -1, $\beta$ gets 49. Net: +48 per pair.
      *   *Correction:* The Environment wants to **minimize** score. So they pick **32**.
      *   This punishes the "Expensive Wrong" bettors (Group $\beta$ on 31? No, Group $\beta$ on 32 is expensive).
      *   If Environment picks 31: Group $\beta$ (on 31, Cost 1) wins 49. Group $\alpha$ (on 32, Cost 1) loses 1.
      *   If Environment picks 32: Group $\alpha$ (on 32, Cost 1) wins 49. Group $\beta$ (on 32, Cost 10) loses 10.
      *   *Wait, if Group $\beta$ bets on 32, they pay Cost 10.*
      *   So if Environment picks 32, Group $\beta$ loses 10.
      *   If Environment picks 31, Group $\alpha$ loses 1.
      *   To minimize total score, Environment picks **32** (Loss of 10 > Loss of 1).
      *   **Result:** Group $\beta$ is crushed not because they were irrational, but because their "Simple" hypothesis was the one the Environment didn't pick, and their "Complex" hypothesis was the one that won but cost too much to bet on safely?
      *   *Actually, keep it simpler.* The Environment picks the number that makes the **majority** wrong.
      *   Let's assume 50/50 split. The Environment picks 32.
      *   Group $\alpha$ (Mostly 32, Cost 1): Score 49.
      *   Group $\beta$ (Mostly 31, Cost 1): Score -1.
      *   **Wait, I need Group $\beta$ to have picked 31.**
      *   Yes, Machine B makes `CHR` (31) cheap.
      *   So if Truth is 32: Group $\alpha$ wins big. Group $\beta$ loses small.
      *   If Truth is 31: Group $\beta$ wins big. Group $\alpha$ loses small.
      *   **The Lesson:** The "Truth" determines who looks like a genius and who looks like a fool, but **both followed Occam's Razor relative to their machine.**

  **Action:**
  *   Environment announces "32".
  *   Group $\alpha$ cheers (Net +49).
  *   Group $\beta$ groans (Net -1).
  *   **Crucial:** Ask Group $\beta$: "Did you reason incorrectly?" (No, you followed your instructions).

  ## 4. Round 3: The Convergence Illusion (0:35 – 0:50)
  **Task:** One more round. Same data ($1, 2, 4, 8, 16, 32$). Predict 7th term.
  1.  New Data Point: 32.
  2.  `CHR` (31) is now falsified. Everyone must switch to `GEO` or `FIX`.
  3.  **New Costs:**
      *   Group $\alpha$: `GEO` is still Cost 1.
      *   Group $\beta$: `GEO` is still Cost 10.
  4.  **Payoff:** Correct = 50 - Cost.

  **Facilitator Action:**
  *   Group $\alpha$ writes `GEO` (Cost 1). Score: 49.
  *   Group $\beta$ writes `GEO` (Cost 10). Score: 40.
  *   **Result:** Even with the *same evidence* and the *same hypothesis*, Group $\beta$ is penalized 9 points forever.
  *   **Point:** The "Invariance Constant" isn't a one-time fee. It's a tax on every prediction until the evidence is overwhelming enough to justify the complex description length (which, in this toy, never happens because `GEO` is fixed).

  ## 5. Debrief & Mapping (0:50 – 1:15)
  **Do not use slides.** Use the whiteboard. Draw the timeline of the game.

  **1. Occam's Razor is a Prior (10 mins)**
  *   **Game Event:** Round 1 choices.
  *   **Formal Concept:** $P(H) \propto 2^{-\text{Length}(H)}$.
  *   **Point:** You didn't choose `GEO` because it's "beautiful." You chose it because your Machine Card made it **cheap**. In Solomonoff Induction, the "Universal Turing Machine" *is* the Machine Card. Simplicity is not absolute; it is compression relative to a reference machine.

  **2. The Invariance Theorem & The Constant (10 mins)**
  *   **Game Event:** Round 3 scores (49 vs 40).
  *   **Formal Concept:** $|K_U(x) - K_V(x)| \leq C_{UV}$.
  *   **Point:** Theorem says the difference in complexity is bounded by a constant ($C$). In our game, $C = 9$.
  *   **The Kicker:** In asymptotic theory, $C$ doesn't matter as $n \to \infty$. But in **Round 1 (n=5)**, the gap between hypotheses (31 vs 32) was **1 unit**. The gap between Machines was **9 units**.
  *   **Takeaway:** At human scales of data, the choice of reference machine dominates the evidence. The "Constant" is large enough to swallow the signal.

  **3. Dominance vs. Speed (5 mins)**
  *   **Game Event:** The Environment Round.
  *   **Formal Concept:** Solomonoff dominates all computable predictors *in the limit*.
  *   **Point:** The Environment was adversarial (uncomputable/malicious). Solomonoff guarantees you won't lose *too much more* than the best computable predictor *eventually*. It does not guarantee you won't go bankrupt in Round 2.
  *   **Takeaway:** Convergence theorems are comfort blankets for the long run. They offer no protection against short-term adversarial reality.

