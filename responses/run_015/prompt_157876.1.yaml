answer: |-
  This is a sharp distinction, and it cuts through a lot of the pious fog that often surrounds transitional justice literature. You are effectively arguing that the standard economic model of transitional justice (information asymmetry + leverage = truth market) ignores the *sociological* cost of that information.

  However, since you asked for holes rather than applause, I am going to press on where your "neighbour-truth" concept might be romanticising a mechanism that was, in practice, quite coercive. I will also challenge whether *gacaca* actually fits your model as neatly as you hope, particularly regarding the role of the state.

  Here is the stress test, in five parts.

  ### 1. The Mechanism and the Archive-Truth Prediction

  Let us set out the *gacaca* mechanism using your principal-agent framework.

  *   **Principal:** The Rwandan State (specifically the RPF government).
  *   **Agent:** The *Inyangamugayo* (locally elected lay judges) and, by extension, the community assembly.
  *   **Currency:** Not amnesty, but *sentence reduction* contingent on confession, guilty plea, and repentance (*gukunga*). The remainder of the sentence was often commuted to community service (*TIG*).
  *   **Disclosure:** A public account of the crime, the location of remains, and the naming of accomplices.
  *   **Verification:** Corroboration by the community assembly present at the hearing.

  **What the Archive-Truth reading predicts:**
  If the state were maximising *archive-truth*, the design would prioritise the accuracy and completeness of the historical record for the central state.
  1.  **Procedure:** It would favour formal rules of evidence to ensure the "stock of facts" is legally robust and historically verifiable.
  2.  **Target:** It would prioritise high-value targets (planners) to map the command structure, as this yields the most explanatory power for the archive.
  3.  **Incentive:** It would offer full amnesty (as in South Africa) because once the fact is in the archive, the state has no further use for the perpetrator's liberty. Punishment is a deadweight loss.
  4.  **Location:** Hearings would likely be centralised or recorded meticulously for the national record, rather than left to the vagaries of local memory.

  **The Reality:** *Gacaca* prioritised speed and local reintegration over archival precision. The procedure was radically thin (no legal counsel, lay judges with minimal training). The "archive" produced was fragmented across 12,000 hillsides, not necessarily centralised in a usable format.

  ### 2. Fit and Misfit: Where the Reading Breaks

  Your "neighbour-truth" model explains several features that baffle the archive model, but it stumbles on the political constraints.

  *   **Leniency vs. Amnesty (Fit):** This is your strongest point. Archive-truth suggests amnesty (wipe the slate). *Gacaca* offered sentence discounts. Under "neighbour-truth," this makes perfect sense: the perpetrator must return to the hill *marked*. They must pay a debt to the specific neighbours they harmed, not to the abstract state. Full amnesty would remove the "visible mark" you argue is necessary for the new social script.
  *   **Local Audience and Lay Judges (Fit):** Archive-truth is indifferent to the audience; neighbour-truth *requires* the audience. The truth only functions if the people who have to live next to the killer hear it and accept the script.
  *   **Volume and Thin Procedure (Mixed):** Archive-truth hates thin procedure (it corrupts the data). Neighbour-truth tolerates it if the goal is social throughput. However, *gacaca*'s volume (estimates vary wildly; some sources suggest over 1 million cases tried, others fewer, but the scale was undeniably massive) suggests the state was solving a logistical crisis (overcrowded prisons) as much as a truth crisis. Your model risks underplaying the sheer desperation of the state here.
  *   **Exclusion of Organisers (Misfit):** Archive-truth demands the "head of the snake." Neighbour-truth doesn't necessarily need it. However, *gacaca* excluded Category 1 offenders (planners, leaders, rape). If the goal is neighbour-reconciliation, excluding the architects of the violence leaves a gap in the local narrative ("Who told you to do it?").
  *   **The Official Narrative (Major Misfit):** You mention the narrative installed (Tutsi=victim, Hutu=perpetrator). This complicates your model. "Neighbour-truth" implies a locally negotiated script. But the Rwandan state enforced a rigid narrative through "Genocide Ideology" laws. If the script is imposed from Kigali rather than negotiated on the hill, is it neighbour-truth? Or is it *state-truth* performed in a neighbourly setting? This is a significant hole in your framing.

  ### 3. The Exclusion of Planners: Break or Enable?

  You ask whether excluding the planners breaks the trade.

  *   **For Archive-Truth:** It breaks it. The value of the amnesty-for-truth trade (as seen in Chile or El Salvador) is often specifically to uncover the command structure which the state cannot find through investigation. By reserving planners for ordinary courts (which were often dysfunctional) or the ICTR (which was distant), *gacaca* structurally admitted it could not buy the "macro-truth."
  *   **For Neighbour-Truth:** It enables it. The neighbour does not need to know the Minister's name to reconcile with the man who held the machete. In fact, knowing the Minister's name might be dangerous or irrelevant to daily cohabitation.
  *   **The Critical Pivot:** However, there is a darker reading. Excluding planners wasn't just about local relevance; it was about political survival. The RPF government contained former Hutu who had defected, but also needed to consolidate power. A full truth trade might have implicated the RPF's own conduct during the civil war or the chaotic aftermath. By keeping the "planners" out of *gacaca*, the state controlled the ceiling of truth. Your model needs to account for the fact that "neighbour-truth" can be easily capped by "state-security."

  ### 4. Where the Theory is Silent

  Your distinction is silent on three critical areas where *gacaca* faced severe criticism.

  *   **The Cost to the Witness:** You note neighbour-truth is "expensive to produce." But who pays? In *gacaca*, witnesses were often vulnerable to reprisal because the proceedings were public and local. Archive-truth can protect witnesses (closed sessions); neighbour-truth *exposes* them. If the theory values cohabitation, it must account for the fact that truth-telling can make cohabitation *impossible* for the victim if the perpetrator is not genuinely remorseful but simply gaming the system for a sentence discount. There is evidence of witnesses being threatened or killed post-testimony. Your model assumes a benign community; *gacaca* operated in a terrified one.
  *   **Pace vs. Quality:** You mention the volume. The state needed to clear ~130,000 detainees in prisons. *Gacaca* was a triage mechanism. Your theory treats truth as the objective; in Rwanda, truth was often the byproduct of a prison-decongestion programme. If the primary variable is "clear the cells," then "neighbour-truth" might just be a legitimising rhetoric for mass processing.
  *   **State as Party:** This is the biggest silence. The RPF was a party to the violence (both the civil war and reprisal killings post-1994). *Gacaca* had no mandate to try RPF crimes. An archive-truth model calls this a failure of completeness. A neighbour-truth model *should* call this a failure of reciprocity. If only one side's neighbours have to confess, the "shared script" is actually a victor's diktat. Did this improve cohabitation? Evidence is mixed. Some studies suggest it reduced guilt for Hutu communities by allowing confession; others suggest it entrenched resentment because the process was perceived as one-sided. Your theory needs a variable for "asymmetric truth."

  ### 5. The Reverse Test and Critique of the Distinction

  Does *gacaca* confirm the amnesty-for-truth model? No. It shows that amnesty is not the load-bearing part. The load-bearing part was *impunity reduction* combined with *labour*.

  **Is the Archive/Neighbour distinction doing work?**
  It is a useful heuristic, but I fear it may be relabelling the distinction between *retributive/restorative* justice or *centralised/decentralised* truth.

  **Where it might be confused:**
  You define neighbour-truth as "rival." Economically, truth is non-rival (my knowing it doesn't stop you knowing it). You likely mean the *social capital* required to sustain the truth is rival. If you mean that, be precise. If you mean the truth itself changes depending on the audience, you are describing *narrative*, not truth.

  **What would falsify your theory?**
  1.  **Successful Cohabitation without Truth:** If you find communities in Rwanda (or elsewhere) that live peacefully together *without* public disclosure, your claim that neighbour-truth is necessary for cohabitation weakens. (There is anecdotal evidence of "silent coexistence" working better than forced confession in some Rwandan villages).
  2.  **Truth without Cohabitation:** If *gacaca* produced perfect disclosure but increased local violence, the "neighbour-truth" mechanism is broken. Given the reports of witness intimidation, this is a live possibility.
  3.  **The "Mark" is Irrelevant:** If perpetrators returned to the community and the "sentence discount/community service" was viewed as a mere administrative hurdle rather than a moral "mark," then your mechanism for reintegration fails. Some sociologists argue *TIG* (community service) was seen as labour exploitation, not moral repair.

  **The Brutal Critique:**
  Your "neighbour-truth" concept risks romanticising the "neighbour." In Rwanda, the neighbour was often the killer, the accomplice, or the terrified bystander. By framing the truth as something "given to the neighbour," you assume a level of civic trust that the genocide precisely destroyed. *Gacaca* did not just facilitate truth; it *compelled* it. Attendance was often mandatory.

  If "neighbour-truth" requires coercion to function, is it distinct from state propaganda? The RPF used *gacaca* to enforce a specific history. If the "shared script" you value is actually a state-imposed narrative delivered in a village square, then your model cannot distinguish between organic reconciliation and authoritarian social control.

  **Conclusion:**
  Your intuition is correct that the standard "amnesty-for-truth" economic model is too thin to explain *gacaca*. The lack of full amnesty and the hyper-local focus are fatal to the standard model. However, your "neighbour-truth" alternative needs to guard against assuming the "neighbour" is a benign actor or that the "script" is freely negotiated. In Rwanda, the script was heavily edited by the state, and the neighbour was often holding a gun, metaphorically or otherwise.

  If you refine the theory to account for *coercion* and *state capture* of the local sphere, it holds water. If it assumes the local sphere is a vacuum of pure social repair, *gacaca* will break it.
