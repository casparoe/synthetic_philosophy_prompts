answer: |-
  ### Conceptual Specification: Desiderata for a Theory of Diachronic Authority

  To function as an adequate normative framework for advance directives (ADs) in progressive neurological decline, a theory must satisfy the following six conditions. These are derived from the structural problems inherent in the phenomenon of psychological discontinuity, not from allegiance to specific bioethical camps (e.g., principism vs. care ethics).

  #### 1. The Gradient Condition (Capacity Topology)
  *   **Requirement:** The theory must operate over a continuous topological space of decision-making capacity rather than a binary switch (competent/incompetent). It must specify how authority shifts as capacity degrades incrementally.
  *   **Motivating Case:** A patient with mid-stage Alzheimer's who can manage daily choices but cannot comprehend long-term prognosis. A binary theory renders them either fully bound by the AD or fully free to contradict it. Both outcomes are clinically incoherent.
  *   **Status:** **Non-Negotiable.** Any theory relying on a sharp threshold of incapacity fails to map onto the biological reality of neurodegeneration, rendering it action-guiding only in retrospect.

  #### 2. The Distinction Condition (Autonomy vs. Welfare)
  *   **Requirement:** The theory must maintain a conceptual firewall between *precedent autonomy* (the right of the earlier self to rule) and *current welfare* (the experiential interests of the later self). It cannot define one in terms of the other (e.g., "honoring the AD *is* in their best interests").
  *   **Motivating Case:** The "Happy Dementia" case. The earlier self forbids life-sustaining treatment; the later self is content and wishes to live. Conflating autonomy and welfare obscures the tragedy of the conflict; a theory that dissolves the conflict by definition fails to engage the normative problem.
  *   **Status:** **Non-Negotiable.** Collapsing the distinction is a conceptual evasion that prevents genuine resolution of the conflict.

  #### 3. The Intermediate Lucidity Condition (Reversed Values)
  *   **Requirement:** The theory must account for states where the patient expresses stable, consistent preferences that are systematically inverted relative to the AD (e.g., the AD refuses sugar; the patient now joyfully seeks it). It cannot dismiss these as mere "symptoms" without argument.
  *   **Motivating Case:** A patient who previously valued intellectual rigor above all now finds deep satisfaction in simple sensory pleasures. Dismissing this as "not the real person" begs the question of identity.
  *   **Status:** **Non-Negotiable.** Ignoring stable, expressed preferences of the current conscious entity violates the basic phenomenological data of the clinical encounter.

  #### 4. The Non-Maleficence Condition (Clinical Constraints)
  *   **Requirement:** The theory must incorporate a constraint against inflicting gratuitous suffering or clinical harm, even in the service of fidelity to the AD.
  *   **Motivating Case:** An AD refuses all analgesia. The later self is in agonizing pain but cannot request relief. A theory that binds the clinician to the AD here violates the fundamental fiduciary duty of medicine.
  *   **Status:** **Non-Negotiable.** No normative theory of medical authority can override the constitutive norms of the medical profession itself.

  #### 5. The Specificity-Continuity Condition
  *   **Requirement:** The theory must respect the *specificity* of the directive content (e.g., "no artificial nutrition") without demanding *impossible psychological continuity* (e.g., "the later self must value what the earlier self valued").
  *   **Motivating Case:** The earlier self signs a specific refusal of feeding tubes based on a fear of indignity. The later self has no concept of indignity. A theory that says "the directive only applies if the values remain the same" renders ADs useless in dementia. A theory that says "the directive applies regardless of who the patient is now" treats the patient as a mere vessel.
  *   **Status:** **Non-Negotiable.** This is the core functional problem of ADs. If the theory fails here, it either makes ADs vacuous or makes them tyrannical.

  #### 6. The Adjudication Condition (Weighing Mechanism)
  *   **Requirement:** The theory must provide a principled mechanism for weighing the authority of the pre-illness self against the interests/preferences of the intermediate self when they conflict. It cannot rely on lexical priority (e.g., "Autonomy *always* trumps Welfare").
  *   **Motivating Case:** A conflict where honoring the AD causes moderate distress to the current self, but violating it causes moderate betrayal of the earlier self's life plan. A binary theory resolves this by fiat; an adequate theory must explain *why* one weight outweighs the other in this specific instance.
  *   **Status:** **Non-Negotiable.** Without a weighing mechanism, the theory is not a framework for decision-making but a dogma.

  ---

  ### Conceptual Tensions: Jointly Unsatisfiable Desiderata

  The most severe tension exists between **Desideratum 3 (Intermediate Lucidity/Reversed Values)** and **Desideratum 5 (Specificity-Continuity Condition)**.

  *   **The Tension:** Desideratum 5 demands that the specific content of the directive (e.g., "no feeding tube") retains authority even as the personality changes. Desideratum 3 demands that the stable, reversed values of the intermediate self (e.g., "I want to eat/live") be taken seriously as authoritative expressions of the *current* agent.
  *   **Why they appear jointly unsatisfiable:** If the intermediate self's values are systematically reversed, the *anchor* for the directive's specificity is severed. The specific instruction was predicated on a specific valuation of life (e.g., "life without cognition is undignified"). If the intermediate self no longer holds that valuation (e.g., "I am happy without cognition"), enforcing the *specificity* of the instruction (5) requires treating the intermediate self's values (3) as normatively inert. Conversely, treating the intermediate self's values as authoritative (3) requires voiding the *specificity* of the prior command (5), reducing it to a mere suggestion.
  *   **Implication:** An adequate theory cannot simply assert both; it must explain how a specific command survives the death of the value system that generated it, or how a current preference can be overridden by a value system the current self no longer inhabits.

  ---

  ### The Exclusionary Desideratum

  **Desideratum 6 (The Adjudication Condition/Weighing Mechanism)** does the most to exclude the standard binary positions.

  *   **Reasoning:** The two standard binary positions are defined by **lexical priority**.
      *   *Strict Precedent Autonomy* asserts: Precedent Authority > Current Welfare (Always).
      *   *Pure Best Interests* asserts: Current Welfare > Precedent Authority (Always).
  *   **Exclusionary Power:** By demanding a *mechanism for weighing*, Desideratum 6 structurally prohibits lexical priority. It requires a calculus where the weight of the precedent command and the weight of the current interest can vary in magnitude depending on context (e.g., the severity of the suffering, the specificity of the directive, the degree of psychological change). Any theory that posits an automatic "trump card" for either self fails Desideratum 6 immediately. It forces the theory into a third, integrative space.

  ---

  ### Scoring Generic Approaches

  | Approach | Score against Desiderata | Critical Failures |
  | :--- | :--- | :--- |
  | **(a) Strict Precedent-Autonomy**<br>*(Clinicians bound to pre-illness directive regardless of intermediate expressions)* | **Fails:** 1, 3, 4, 6.<br>**Passes:** 2, 5. | **Fails Desideratum 6:** Relies on lexical priority (Autonomy trumps all).<br>**Fails Desideratum 4:** Cannot account for clinical duties to avoid suffering if the AD mandates it.<br>**Fails Desideratum 3:** Must dismiss intermediate lucidity as non-authoritative, violating the phenomenological requirement. |
  | **(b) Current-Welfare View**<br>*(Discount directive in favor of present interests/experiential welfare)* | **Fails:** 2, 5, 6.<br>**Passes:** 1, 3, 4. | **Fails Desideratum 2:** Collapses precedent autonomy into current welfare (if it doesn't help now, it doesn't matter).<br>**Fails Desideratum 5:** Cannot respect specificity of directive if it conflicts with current comfort; renders ADs functionally void in dementia.<br>**Fails Desideratum 6:** Relies on lexical priority (Welfare trumps all). |
  | **(c) Diachronic-Negotiation View**<br>*(Integrates authority across temporal stages; seeks coherence)* | **Passes:** 1, 2, 3, 4, 6.<br>**Struggles:** 5. | **Struggles with Desideratum 5:** While it handles the *weighing* well, it often dilutes the *specificity* of the directive. By negotiating between selves, the specific command ("no tube") often becomes a general preference ("avoid burden"), which may not satisfy the earlier self's demand for precision. However, it is the only approach that structurally satisfies the Weighing Condition (6). |

  **Summary:** The Strict Precedent and Current-Welfare views are eliminated primarily by their failure to provide a **Weighing Mechanism (6)** and their inability to handle the **Gradient Condition (1)**. The Diachronic-Negotiation view remains the only viable candidate, though it bears the burden of explaining how specific directives survive the negotiation process without losing their normative force (Desideratum 5).
