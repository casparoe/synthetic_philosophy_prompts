  7.  **Final Polish:** Ensure tone is appropriate for a second-year ethics student (rigorous, engaging, slightly informal but precise). Use standard terminology (collective action problems, overdetermination, agent-neutral vs. agent-relative).

      *(Self-Correction during drafting)*: I need to be careful with the user's specific formulation: "duties of rescue dont divide... each of them fully owes it that the child doesn't drown." This is a *duty of outcome*, not *duty of action*. This is distinct from standard act-utilitarianism because it allows substitution (shouting).
      *Key distinction:* The "Fair Share" view usually says "Do 1/N." The "Conditional Fair Share" says "Do 1/N, but if others don't, do more." The ODV says "Ensure Result."
      *The Trap:* If ODV says "Ensure Result," and I shout, and no one listens, and kid dies... did I fail? User says "if you can't swim but you can shout... and he jumps in, you've done nothing wrong." Implies if he *doesn't* jump in, I might be wrong.
      *Refining the Blame Objection:* If I shout, he doesn't jump, kid dies. ODV: I failed my duty (child drowned through my inaction/ineffective action). Fair Share: I did my share (shouting was my 100% effort). Here ODV is *harsher*. Is that wrong? Maybe.
      *Better Blame Objection:* The "Redundant Rescuer." I jump in. You jump in. Kid saved. ODV: We both fulfilled our full duties. Fair Share: We both did more than our share. No blame difference.
      *The "Blame Aggregation" is the winner.* If 10 people let a kid die, is the total moral badness 10x a single murderer? ODV implies yes (10 full violations). Intuition says no (1 death occurred).

  8.  **Final Review against constraints:**
