prompt: |-
  so im doing this second year practical ethics paper and last weeks tutorial was all Singer and the drowning child thing — you're walking past a shallow pond, a kid is face down in it, you can wade in and save them but you'll ruin your shoes and be late, so obviously you have to, and then the move is that distance and whether anyone else is helping dont matter, so you owe a lot more than you're giving. Everyone in the room basically caved to it and then spent an hour complaining that its too demanding, which I think is a weak objection. I've ended up more Singer-ish than Singer, and the bit I'm stuck on has nothing to do with demandingness.

  In the original case you're the only person around. I think thats a red herring and I want to hold something stronger: duties of rescue dont divide. Say five adults are standing at the edge of the same pond and any one of them could wade in at the same small cost. I want to say each of them fully owes it that the child doesn't drown — not one fifth of a duty each. I've been calling it the overdetermination view: the duty is discharged by the child's being saved, not by your doing your share, so if all five walk away each of them is fully blameworthy, not 20% blameworthy. And its not a duty to do the rescuing — what you owe is that the child not drown through your inaction, so if you cant swim but you can shout at the guy next to you and he jumps in, you've done nothing wrong.

  I need the other side properly, so: what would count against the overdetermination view specifically, ranked from fatal to merely awkward? I want the cases, not just the labels — five bystanders, five hundred, seven billion with millions of ponds (does ought-implies-can or action-guidance actually bite here, or can I dodge it?), the everyone-dives-in-and-gets-in-each-others-way problem, cases where the other bystanders are unwilling rather than unable, cases where they're institutions, cases where you dont know if anyone else has acted. Also: does the fair-share view end up able to mimic every verdict I give once I add a coordination clause, and if so is the whole disagreement verbal? That's the outcome I'd find most damaging and I can't tell if its true.

  Say which of these a committed overdetermination theorist should concede as really counting against them and which they'd rightly shrug off, what my view predicts that the share view doesn't (blame? what you owe if the guy you shouted at refuses?), and whether the view has slid into unfalsifiability — "duty" here does less and less action-guiding work the more I qualify it, and I want to know whether that's actually a problem for a view of this kind in ethics or whether its fine. What would move me most personally is a case where overdetermination gets the blame judgement wrong, not the what-to-do judgement.
