answer: |-
  **Scenario**
  At a commercial hatchery, expert chick-sexers sort day-old Rhode Island Reds, uttering "Cock" for those they classify as male. Their skill is ineffable; they cannot describe the visual cue, but they sort with 99% accuracy. The interpreter, a new floor manager, observes the sexers holding "Cock" true while handling chicks with a specific vent morphology ($V$). The sexers use this classification to predict adult behavior (e.g., "Cocks crow"), which is verified only six weeks later via comb growth and genetics ($G$). In this specific flock, a rare hormonal condition causes 1% of chicks to exhibit $V$ but develop as genetic females ($\neg G$). The interpreter has access to the sorting data immediately but must wait six weeks for the verification data.

  **The Readings**
  *   **Reading $T$ (Triangulation-Favored):** "Cock" is true of a chick iff it possesses vent morphology $V$.
  *   **Reading $C$ (Charity-Favored):** "Cock" is true of a chick iff it possesses genetic sex $G$.

  **The Checks**
  *   **Charity Check:** Reading $C$ is preferred. If we adopt $T$, the sexers' held-true belief "All Cocks crow" is false in the 1% of intersex cases; we attribute systematic error to their core professional beliefs. If we adopt $C$, "All Cocks crow" comes out true by definition (or near enough), maximizing the truth of their web of belief.
  *   **Triangulation Check:** Reading $T$ is preferred. Triangulation requires the meaning to be fixed by an object or property that causes the response in *both* speaker and interpreter *at the time of utterance*. At $t_0$ (sorting), $V$ is publicly observable and causes the response in both agents. $G$ is causally efficacious but hidden from the interpreter at $t_0$; she cannot triangulate on a property she cannot detect until $t_{6weeks}$.

  **The Feature and Collapse**
  The divergence traces to **Phenotypic Decoupling** (the hormonal condition allowing $V$ without $G$). If you switch this feature off—making vent morphology a biologically necessary and sufficient sign of genetic sex—then $V$ and $G$ are co-extensive. Under strict correlation, Reading $T$ and Reading $C$ assign the same truth conditions, and the conflict collapses.

  **Indeterminacy vs. Underdetermination**
  This is **underdetermination**, not radical indeterminacy. The conflict is temporal. Once the six weeks pass, the interpreter gains access to $G$. Since Davidsonian Radical Interpretation is an idealization over the long run of evidence, the interpreter is *allowed* to use the verification data. Once she has it, Charity and Triangulation converge on Reading $C$ (Genetics), because the distal cause ($G$) explains the correlation better than the proximal sign ($V$), and the interpreter can now triangulate on $G$ retrospectively.

  **The Davidsonian Objection**
  A committed Davidsonian would say I cheated by **temporal slicing**. They would argue that the Triangulation Constraint is not limited to the *immediate* stimulus available at the moment of utterance, but to the *distal object* that stands in the causal history of the interaction. Since $G$ is the common cause of both $V$ and the adult behavior, $G$ is the proper object of triangulation even if the interpreter identifies it later. By restricting Triangulation to the interpreter's *current* epistemic access rather than the *actual* causal structure, I artificially forced a split that dissolves once the interpreter fulfills her mandate to gather all available evidence.
