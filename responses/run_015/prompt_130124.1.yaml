      *   *Conclusion:* (2) and (3) *are* technically incompatible if one claims (2) solves *all* St. Petersburg-like paradoxes. If (2) is only meant to solve the *specific* $2^n$ payoff game, they can coexist. But usually, the "Bernoulli solution" is pitched as a general principle. If utility is unbounded, the paradox returns in a generalized form.
