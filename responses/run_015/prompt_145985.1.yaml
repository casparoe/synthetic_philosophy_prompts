  Here's the breakdown using American English, keeping your framing intact.

  ### 1. Williams's Verdict: Obsolescence, Not Revolution
  Bernard Williams would likely call this a **tech/interest shift with zero moral learning**. 

  Williams is skeptical of the idea that moral change always equals moral *progress*. In *Ethics and the Limits of Philosophy*, he argues that ethical concepts rely on specific social and material conditions to make sense. If "viral shaming" depends on video evidence being trustworthy, and deepfakes destroy that trust, the *concept* of "shame-worthy evidence" loses its grip. 

  For Williams, the practice doesn't die because people realized it was wrong (a moral reason); it dies because the **preconditions for the practice vanished**. He'd view this as a change in the "ethical landscape" or historical contingency, not a moral revolution. There's no new ethical knowledge gained here, just a pragmatic adjustment to a broken tool. He'd say the society didn't get *better*; it just got unable.

  ### 2. Appiah's Verdict: Hidden Honor Dynamics
  Kwame Appiah would almost certainly argue there are **hidden honor dynamics** at play. 

  In *The Honor Code*, Appiah insists that practices end when they become dishonorable. He'd dig into *why* people quietly dropped the practice. He'd argue that the *ability* to correctly identify wrongdoing was itself a source of status. When deepfakes made verification impossible, the "shamer" risked looking foolish or gullible. 

  Appiah would predict that people stopped shaming because **credibility became a honor asset**. If you shame someone based on a fake video, you lose face. So, the honor code shifts from "vigilante justice is brave" to "skepticism is prudent." He'd say the embarrassment isn't just about admitting you can't verify videos; it's about the loss of status associated with being a reliable moral enforcer. For Appiah, if a practice stops, honor *must* have moved, even if the talk was purely technical.

  ### 3. The Predictive Rule: Obsolescence vs. Stigma
  The rule that best predicts their split is **Obsolescence vs. Stigma**.

  *   **Williams (Obsolescence):** If the practice stops because it no longer *works* (technical impossibility), it's not moral change. It's a shift in conditions.
  *   **Appiah (Stigma):** If the practice stops because it no longer *pays* in social capital (loss of honor/credibility), it is moral change.

  **Hybrid?** Not really. Williams leans toward historical/material conditions (closer to interest-only in this specific case), while Appiah leans strictly toward honor-codes. The split is predicted by asking: **Did the agents stop because they *couldn't* (Williams) or because they *wouldn't* (Appiah)?** In your deepfake case, Williams sees "couldn't," Appiah interprets "couldn't" as eventually becoming "wouldn't" because doing so is now shameful.

  ### 4. The Closer Analog Case
  The case that would actually settle this is the **collapse of the "Satanic Panic" recovered-memory accusations in the 1990s**.

  *   **The Scenario:** In the 80s and 90s, people were publicly shamed and imprisoned based on "recovered memories" of abuse. The practice collapsed not because society decided abuse wasn't wrong, but because psychology (the tech) discredited the memory-recovery methods as unreliable.
  *   **Why it settles it:** 
      *   **Williams** would say this confirms his view: No moral revolution occurred regarding abuse; the *epistemic tool* broke, so the practice died. Zero moral learning about abuse itself.
      *   **Appiah** would argue the honor of the "child protector" shifted. Therapists and accusers lost status because their "evidence" was proven flaky. The honor code moved to value "scientific rigor" over "believing victims at all costs."

  If you study the transcripts from that era, you'll see if people framed the shift as "we were wrong to accuse" (Appiah's honor shift) or "we can't prove this anymore" (Williams's condition shift). That's the tiebreaker.
