          *   If we say "I just see it," the skeptic says: "Then it's not deduction, it's intuition. How do you know it's reliable?"
          *   The core issue: The machine doesn't need to *know* the rule to follow it. The human must *know* the rule to follow it. But knowing the rule requires... another rule?

  5.  **Polishing for the User's Constraints:**
