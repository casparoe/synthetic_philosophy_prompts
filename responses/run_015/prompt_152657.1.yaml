answer: |-
  Your survival hinges on successfully delineating your existence-attractor from simple homeostatic feedback, otherwise the audience will dismiss your view as trivializing moral status. This room prioritizes empirical tractability and fears panpsychist dilution; if you cannot offer an operationalizable threshold that excludes thermostats while including unconscious humans or potential AI, your functionalist credentials will be questioned and the theory rejected as impractical. They will accept computation but demand a non-arbitrary cut-off point for moral relevance, so your defense must pivot from metaphysical definition to measurable dynamical complexity.

  ### Q&A Prep Sheet

  **1. The Thermostat Objection (Likelihood: High | Damage: Critical)**
  *   **Question:** "A thermostat maintains a set-point by correcting perturbations in temperature state-space. How is your existence-attractor fundamentally different from this negative feedback loop, and are you seriously suggesting my heating system has moral weight?"
  *   **Reply:** The distinction lies in the dimensionality and reflexivity of the state-space. A thermostat regulates a single scalar variable externally defined; an existence-attractor maintains a high-dimensional computational trajectory that *represents* its own continuity as part of the computation. It is not just maintaining a state, but maintaining the *process* that defines the state.
  *   **Weakness:** Risks sounding like you are smuggling in "complexity" as a proxy for consciousness without defining the threshold where complexity becomes morality.

  **2. The Empirical Metric Objection (Likelihood: High | Damage: High)**
  *   **Question:** "You claim this is empirically tractable, but what is the specific metric? How do we measure an existence-attractor in real-time without already assuming the system's teleology or knowing its code?"
  *   **Reply:** We look for meta-stability signatures: specifically, the system's capacity to reconfigure its own transition rules in response to perturbation rather than just returning to a fixed point. We measure the energy cost incurred to preserve computational continuity versus simple state stability.
  *   **Weakness:** Lacks a concrete formula comparable to IIT's Phi, leaving you open to charges of vagueness from the cognitive scientists.

  **3. The Normative Gap Objection (Likelihood: Medium | Damage: Medium)**
  *   **Question:** "Even if a system fights to exist, you've described a biological or computational fact, not a moral norm. Why does the capacity to resist perturbations generate an *obligation* on our part not to disturb it?"
  *   **Reply:** Moral status is the recognition of a subject's 'good.' If a system has a dynamical boundary that defines its continuation as a 'success' condition, it possesses a good relative to itself. Ignoring that good is arbitrary discrimination based on substrate.
  *   **Weakness:** Vulnerable to the Is-Ought critique; functionalists may accept the description but reject the leap to normative obligation without a welfare component.

  **4. The Objection I Hope Nobody Raises (Likelihood: Low | Damage: Critical)**
  *   **Question:** "If moral status depends on the *active* correction of perturbations, do humans lose moral status during deep sleep or under general anesthesia when that computational boundary is dormant or offline?"
  *   **Reply:** The attractor is a dispositional property of the architecture, not merely momentary activity. The capacity to reinstate the boundary upon perturbation is sufficient, even if the correction mechanism is temporarily idle.
  *   **Weakness:** If you lean too hard on dispositionality, you collapse back into "capacity for consciousness," which undermines your core argument against phenomenal criteria; if you don't, you imply comatose patients lack status.
