  "In Aumann's 1976 paper 'Agreeing to Disagree,' what exactly does the common prior assumption require, and what does the agreement theorem say? (20 points)"

  here's what my classmate wrote:

  "Aumann's theorem is a 4-page gem from the Annals of Statistics. The two agents are allowed to have different information about the world — that's the whole point, they each have their own private signals. But they must share a common prior, which means a joint probability distribution over a shared state space Ω. The theorem says that if their posterior probabilities for some event are common knowledge — i.e. each agent knows the other's posterior, knows that the other knows, and so on — then the two posteriors must be equal. So rational people with the same prior can't agree to disagree. The common prior assumption is a strong one: it requires that the two agents have exactly the same information structure, otherwise the theorem wouldn't go through, because with different information the posteriors could differ."

