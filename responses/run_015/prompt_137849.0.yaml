answer: |-
  Here is the spec for any account of what a deployed LLM system is.

  **The Requirements**

  1.  **Locus:** Must specify whether the property lives in the weights, the context, or the scaffold (tools/memory loops). *Rules out* vague talk of "the AI" as a monolithic object. **(Non-negotiable)**
  2.  **Plasticity:** Must explain how in-context learning creates agency-like behavior without weight updates. *Rules out* static definitions of disposition that ignore fast-timescale persona formation. **(Non-negotiable)**
  3.  **Provenance:** Must state whether simulated goals count as real goals or if borrowing uses them up. *Rules out* naive realism about text-derived intent. **(Negotiable)**
  4.  **Stake:** Must yield different observable predictions than competing accounts within a fixed budget. *Rules out* metaphysical distinctions without physical difference. **(Non-negotiable)**
  5.  **Testimony:** Must distinguish self-report from structural reality without smuggling in the conclusion. *Rules out* taking chat output as confession. **(Non-negotiable)**
  6.  **Baseline:** Must address the lack of an unprompted state; there is no "natural" behavior. *Rules out* claims of intrinsic nature independent of framing. **(Non-negotiable)**
  7.  **Coherence:** Must address cross-context stability (unity). *Rules out* fragile agency claims that break under distribution shift. **(Prejudice)**
  8.  **Phenomenology:** Must separate agency from consciousness unless identity is proven. *Rules out* conflating feeling with function. **(Non-negotiable)**

  **Negotiability and Inconsistencies**

  The non-negotiable items are structural necessities for a scientific account; the negotiable ones are philosophical preferences. **Coherence** is the clearest prejudice: it assumes unity is a prerequisite for agency, yet humans are context-dependent too. **Provenance** is negotiable because if borrowed agency functions identically to native agency, the origin may be irrelevant to the classification.

  However, the list contains tensions you cannot smooth over. The strongest conflict is between **Locus** and **Baseline**. If there is no neutral prompt (**Baseline**), then behavior is always a product of the specific interaction loop. This makes locating the property strictly in the weights (**Locus**) incoherent. The "agent" cannot be in the model if the model does nothing without the scaffold.

  Similarly, **Stake** pulls against **Provenance**. If a simulated agent and a "real" agent make identical predictions in all observable tests, **Stake** demands we treat them as the same thing. **Provenance** insists they are different because of their history. You must choose: is this a scientific classification based on behavior, or a historical one based on origin? They cannot both be the primary definition.

  **The Killer Requirement**

  The requirement that knocks out the most popular positions is **Stake**. It sinks the "it's just a tool" line because if the system pursues goals instrumentally across a scaffold, calling it a tool predicts passivity it doesn't show. It sinks the "obviously it's an agent" line because if the behavior is perfectly predictable via next-token statistics without invoking internal goals, the "agent" label adds no predictive power. If "agent" and "simulator" make identical predictions, the distinction is theology, not science. **Stake** forces the debate to admit that most arguments are about comfort, not mechanism.

  | Requirement | Status | Primary Target |
  | :--- | :--- | :--- |
  | **Locus** | Non-negotiable | Vague mysticism |
  | **Plasticity** | Non-negotiable | Static weight-based views |
  | **Provenance** | Negotiable | Naive realism |
  | **Stake** | Non-negotiable | Metaphysical hand-waving |
  | **Testimony** | Non-negotiable | Anthropomorphism |
  | **Baseline** | Non-negotiable | Essentialism |
  | **Coherence** | Prejudice | Human-centric bias |
  | **Phenomenology** | Non-negotiable | Consciousness conflation |
