prompt: |-
  I'm defending a thesis I'm calling "diachronic asymmetry" at next Thursday's interdisciplinary workshop on Intergenerational Equity and Climate Policy: pure time preference is irrational and should be eliminated within a single life, yet it is rational and even obligatory across generations, because the metaphysical and moral conditions that bind temporal stages of one agent—narrative continuity, anticipatory self-concern, and special obligations of diachronic care—do not obtain between non-overlapping generations, leaving intergenerational justice governed solely by distributive fairness under scarcity. From this I derive that climate-cost models should apply a zero pure discount rate to welfare within current lifespans but may legitimately apply a positive pure rate to benefits falling beyond a generational boundary, a position that inverts the usual structure of the Stern-Nordhaus debate rather than splitting the difference. The audience will be climate economists steeped in Ramsey discounting and present-value accounting, moral philosophers for whom Parfit's "mere location in time" objection is second nature, and Treasury policy analysts who care less about metaphysics than about whether my view can survive insertion into a cost-benefit framework without collapsing into either present-biased parochialism or intergenerational paralysis.

  Please prepare me for the Q&A as a speaker's prep sheet, not as a defense of the view in the abstract. Order the objections by how likely they are to come and how damaging they would be if I mishandle them, and phrase each exactly as that camp would phrase it—the economists worrying about implementation consistency, the philosophers pressing on analogies between spatial and temporal separation, the analysts asking for an operational cutoff. For each objection, tell me what I should concede up front, what I must hold at all costs, the weakest point in my reply that I should prepare to defend rather than hope they overlook, and a concise reply suitable for a two-minute response. Include the specific follow-up each camp is likely to press if my first reply lands, and flag the one question—probably from the policy side—that I'm most hoping nobody asks, with a note on why it is structurally dangerous to my position and how to survive it if it does arise. I do not need bibliographies or citations; what I need is tactical anticipation in the vocabulary of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested speaker's prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** "Diachronic Asymmetry" thesis.
      *   **Core Claim:** Zero pure time preference (PTP) within a life (irrational to discount one's own future), but positive PTP across generations (rational/obligatory to discount future generations' welfare).
      *   **Rationale:** Metaphysical/moral bonds (narrative continuity, etc.) exist within a life but not between non-overlapping generations. Intergenerational justice is about distributive fairness under scarcity, not diachronic care.
      *   **Implication:** Climate models use $\delta = 0$ for current lifespans, $\delta > 0$ for benefits/costs beyond generational boundaries. Inverts Stern-Nordhaus debate.
      *   **Audience:** Climate Economists (Ramsey discounting), Moral Philosophers (Parfit, time neutrality), Treasury Policy Analysts (implementation, consistency).
      *   **Format:** Speaker's prep sheet (tactical, not abstract defense).
      *   **Requirements:** Order objections by likelihood/damage, phrase in audience vocabulary, specify concessions/non-negotiables, identify weak points, provide 2-minute replies, include follow-ups, flag the "dangerous question."

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Vulnerability 1 (Philosophers):* Parfit's "Mere Location in Time." If time itself isn't a reason for discounting, why does the *generational boundary* matter? Is this just arbitrary discrimination based on birth date?
      *   *Vulnerability 2 (Economists):* Arbitrage/Consistency. If I value my future self at 0% but my grandchild at 5%, what happens at the margin where lives overlap? How do you model the transition? It creates a kink in the social welfare function.
      *   *Vulnerability 3 (Policy Analysts):* Operationalization. What defines a "generation"? 25 years? 30 years? When does the switch flip? This creates cliff-edge effects in policy modeling.
      *   *Vulnerability 4 (Ethics/Equity):* This sounds like "present-biased parochialism" dressed up in metaphysics. Are we just saying "we matter more than them"?
      *   *Vulnerability 5 (The "Dangerous Question"):* If we discount the future, doesn't that justify *less* mitigation now? If the goal is cost-benefit analysis, a positive discount rate on future damages reduces the present value of avoided climate catastrophe, potentially undermining the very action the workshop wants to promote.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Economists - High Likelihood/High Damage):* Consistency/Arbitrage.
          *   *Phrasing:* "How do you handle overlapping generations?" "Ramsey rule requires a single social discount rate."
          *   *Concession:* Yes, standard models assume a representative agent.
          *   *Hold:* The moral distinction is real, even if the math is messy.
          *   *Reply:* Distinguish *intra*-personal optimization from *inter*-personal distribution.
          *   *Follow-up:* "Where is the kink in the curve?"

      *   *Objection 2 (Philosophers - High Likelihood/High Damage):* Parfit/Time Neutrality.
          *   *Phrasing:* "Mere location in time." "Why is birth date morally relevant?"
          *   *Concession:* Time *itself* isn't the reason.
          *   *Hold:* The *relations* (narrative continuity) are the reason, not the time.
          *   *Reply:* It's not temporal discounting; it's relational discounting.
          *   *Follow-up:* "Is narrative continuity really binary?"

      *   *Objection 3 (Policy Analysts - High Likelihood/Medium Damage):* Operational Cutoff.
          *   *Phrasing:* "What is the generational boundary?" "25 years? 30?" "Cliff effects."
          *   *Concession:* It needs a proxy.
          *   *Hold:* Precision shouldn't paralyze the moral distinction.
          *   *Reply:* Use standard demographic definitions (25-30 yrs), smooth the transition.
          *   *Follow-up:* "Why not just use a declining discount rate?"

      *   *The "Dangerous Question" (Policy/Ethics overlap):*
          *   *Question:* "Doesn't this justify *inaction*?" If you discount future climate damages, the optimal carbon tax drops.
          *   *Why Dangerous:* It turns a metaphysical argument into a justification for harming the future, which contradicts the workshop's goal (Climate Policy).
          *   *Survival:* Argue that *scarcity* and *distributive fairness* still demand high mitigation, just on different grounds than "equal welfare."

  4.  **Refining the Tone and Content:**
      *   Must sound like a "prep sheet" (bullet points, bold text, tactical advice).
      *   Vocabulary check: "Ramsey rule," "Social Welfare Function," "Overlapping Generations (OLG)," "Mere location in time," "Person-affecting view," "Cliff effects," "Shadow price."
      *   Ensure the "Concede/Hold" structure is clear.
      *   Ensure the "Weak Point" is honest.

  5.  **Final Review against Constraints:**
      *   Did I order by likelihood/damage? Yes (Economists/Philosophers first).
      *   Did I phrase in audience vocabulary? Yes.
      *   Did I include the "Dangerous Question"? Yes.
      *   No bibliographies? Checked.
      *   Tactical anticipation? Yes.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm defending the view in the abstract. Keep it focused on *answering the challenge*.
      *   *Correction:* Ensure the distinction between "pure time preference" ($\delta$) and "elasticity of marginal utility" ($\eta$) is clear for the economists, as that's where they will attack.
      *   *Correction:* The "Dangerous Question" needs to be the one that exposes the political risk of the thesis. If I say "discount the future," policymakers hear "spend less money." I need to address that head-on.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # SPEAKER'S PREP SHEET: DIACHRONIC ASYMMETRY
  **Workshop:** Intergenerational Equity and Climate Policy
  **Thesis:** Zero pure time preference (PTP) intra-life; Positive PTP inter-generation.
  **Goal:** Survive Q&A without conceding the core asymmetry or appearing operationally naive.

  ---

  ## 1. THE ECONOMISTS (Likelihood: 90% | Damage: High)
  **The Objection:** "You're proposing a kinked Social Welfare Function that violates arbitrage consistency. In an Overlapping Generations (OLG) model, agents coexist. If Agent A (age 20) values their future self (age 60) at $\delta=0$, but values their grandchild (born year $t+30$) at $\delta>0$, how do you price capital transfer at the margin? You cannot switch discount rates based on a metaphysical boundary without creating dynamic inconsistency in the Ramsey rule."

  *   **Concede Up Front:** Acknowledge that standard Integrated Assessment Models (IAMs) assume a single representative agent with a uniform $\delta$. Admit your view requires a structural break in the SWF.
  *   **Hold at All Costs:** The distinction between *prudential rationality* (managing one's own life) and *distributive justice* (allocating resources between distinct entities). Do not let them reduce the moral claim to a calibration error.
  *   **Weakest Point:** The transition zone. If lives overlap, the "generational boundary" is porous. Economists will press on how you price a policy benefit that accrues to a 70-year-old (intra-life) vs. a 75-year-old (inter-life) in the same calendar year.
  *   **2-Minute Reply:** "You are treating the discount rate as solely a price of capital. I am distinguishing two different normative relations. Within a life, discounting is irrational because it violates coherence of the self (Parfit's Reductionist View supports this). Between generations, we are not managing a single portfolio; we are allocating scarce resources between distinct moral claimants. The 'kink' you fear isn't a mathematical error; it's the price of acknowledging that I am my future self, but I am *not* my grandchild. We can model this as a switching function in the OLG framework, not a violation of arbitrage."
  *   **Likely Follow-up:** "So you're proposing a declining discount rate that hits zero at the generational horizon? Or a step function? If it's a step, aren't you incentivizing policy delays to push costs just over the cliff?"
      *   *Prep:* Anticipate the "step function" attack. Argue for a smooth transition curve based on demographic overlap, not a hard cliff.

  ## 2. THE PHILOSOPHERS (Likelihood: 85% | Damage: High)
  **The Objection:** "This collapses into the 'Mere Location in Time' objection Parfit dismantled. If time itself is not a morally relevant difference, why does the *generational* boundary matter? You are effectively saying birth date determines moral weight. If narrative continuity is the criterion, that is a scalar property, not a binary one. Why does a drop in psychological connectedness justify a positive pure time preference rather than just a lower weight?"

  *   **Concede Up Front:** Agree that "time itself" is not the justification. Concede that narrative continuity is a matter of degree.
  *   **Hold at All Costs:** The *obligation* structure. Diachronic care is a special obligation (like parental duty); distributive fairness is a general obligation. Special obligations permit partiality; general obligations require impartiality but acknowledge scarcity.
  *   **Weakest Point:** The "scalar" problem. If connectedness fades gradually, why does the discount rate jump? If you admit it fades gradually, you risk sliding back to Stern ($\delta \approx 0$).
  *   **2-Minute Reply:** "I am not discounting based on time location; I am discounting based on *relational capacity*. Within a life, I have the capacity for anticipatory concern and narrative integration. That creates a duty of diachronic care. Between non-overlapping generations, that capacity vanishes. We cannot care for those who cannot know us. Therefore, the relationship reverts to pure distributive fairness under scarcity. It is not that their welfare counts for less *intrinsically*, but that the *mechanism* of obligation shifts from care to allocation. Positive discounting here reflects the scarcity constraint on allocation, not a devaluation of their lives."
  *   **Likely Follow-up:** "But if their welfare counts equally intrinsically, doesn't scarcity argue for *saving* more for them (if they are richer) or *less* (if they are poorer), rather than a pure time preference? You're smuggling valuation into the discount rate."
      *   *Prep:* Distinguish $\delta$ (pure time) from $\eta$ (elasticity of marginal utility). Argue $\delta$ captures the "obligation gap," $\eta$ handles the wealth disparity.

  ## 3. THE POLICY ANALYSTS (Likelihood: 80% | Damage: Medium)
  **The Objection:** "I need an operational cutoff. Is a generation 20 years? 30? 75? If I'm running a CBA for a nuclear waste repository with a 10,000-year horizon, where do I flip the switch? If I use your model, do I value a life saved in 2050 differently than a life saved in 2055? This creates administrative chaos and legal vulnerability."

  *   **Concede Up Front:** Acknowledge that metaphysical precision doesn't translate to line-items. Admit there is no "natural" number.
  *   **Hold at All Costs:** The principle that *some* distinction is better than the current confusion (Stern vs. Nordhaus). A rough proxy is better than a false precision.
  *   **Weakest Point:** The "Cliff Effect." If the rate switches at year 30, every policy will be gamed to shift costs/benefits by one year.
  *   **2-Minute Reply:** "We use demographic proxies already in policy—Social Security, voting age, trust fund horizons. We can adopt a standard demographic generation length (e.g., 25-30 years) as the proxy for the 'relational horizon.' To avoid cliff effects, we apply a smoothing function over that horizon, not a hard step. The goal isn't to measure metaphysics to the decimal, but to acknowledge that current models implicitly assume we care about 2300 exactly as much as 2024, which drives paralysis. My view allows for action now by acknowledging the legitimacy of near-term prioritization without abandoning the future."
  *   **Likely Follow-up:** "Why not just use a Declining Discount Rate (DDR)? It achieves the same weighting without the metaphysical baggage."
      *   *Prep:* DDR is usually justified by uncertainty about future rates. Your justification is *moral*. Keep the distinction clear. DDR is epistemic; yours is ontological.

  ---

  ## 4. THE DANGEROUS QUESTION (The "Kill Shot")
  **Source:** Treasury/Policy Analyst (possibly allied with an Ethicist)
  **Likelihood:** 40% | **Damage:** Critical

  **The Question:** "If we legitimize a positive pure time preference for future generations, doesn't that mathematically lower the Social Cost of Carbon? Are you not providing a philosophical cover for *reducing* mitigation targets? If the damages in 2100 are discounted heavily because they are 'intergenerational,' why shouldn't we spend less to prevent them?"

  *   **Why It Is Structurally Dangerous:**
      1.  It exposes the political risk: Your thesis sounds like "the future matters less."
      2.  It undermines the workshop's goal: If your view leads to *less* climate action than Stern, the room will turn.
      3.  It conflates *discounting welfare* with *discounting costs*. If you discount future damages, the Present Value of avoided catastrophe drops, lowering the optimal carbon tax.

  *   **Survival Strategy:**
      1.  **Do not** say "Yes, but..."
      2.  **Do** pivot to *Scarcity and Efficiency*.
      3.  **Argument:** Positive PTP doesn't mean we ignore them; it means we recognize we cannot save everything. It forces *efficient* allocation rather than *impossible* sacrifice.

  *   **Draft Reply:** "That is the standard fear, but it inverts the logic. The Stern approach ($\delta=0$) demands infinite sacrifice from the poor today for the rich tomorrow, which is politically unsustainable and leads to *no* policy. By acknowledging a positive rate, we acknowledge scarcity. This forces us to prioritize *high-impact, low-regret* mitigation now (like R&D and infrastructure) rather than promising impossible transfers of wealth to the distant future. It makes climate policy *feasible*. We are not saying 'hurt them'; we are saying 'we cannot save everything, so let us invest in what actually survives.' It shifts the focus from consumption smoothing to asset preservation."

  *   **If They Press:** "So you admit the optimal carbon tax is lower under your model?"
      *   *Reply:* "The *composition* of the tax changes. Less focus on distant consumption smoothing, more focus on immediate risk reduction and capital stock preservation. The total spend might be similar, but the justification is robust against political backlash."

  ---

  ## TACTICAL NOTES FOR THE ROOM
  *   **Watch the "Pure" in Pure Time Preference:** Economists distinguish $\delta$ (pure time) from $\eta$ (growth/scarcity). Ensure you don't let them conflate the two. Your claim is specifically about $\delta$.
  *   **Parfit is a Double-Edged Sword:** Philosophers love Parfit. Use his "Reductionist View" (we are just stages) to support the *intra*-personal zero discount, but argue that *inter*-personal relations require a different bucket.
  *   **Don't Get Trapped in Metaphysics:** If the debate stalls on "what is a self?", pivot to the Policy Analysts: "Regardless of the metaphysics, does this framework yield more stable policy commitments than the current deadlock?"
  *   **Body Language:** When answering the Economists, look at the Policy Analysts. Show them you are solving *their* implementation problem, not just winning a philosophy debate. When answering the "Dangerous Question," look the questioner in the eye. Do not look away.
