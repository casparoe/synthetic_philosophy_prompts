prompt: |-
  hey — I'm taking a decision theory reading course this term (phil dept, cross-listed with the econ phd field course: Savage, then Jeffrey, then a couple weeks on value of information and scoring rules) and I also have a paid internship at a small global health foundation where my actual job is drafting the funding memos. Roughly three or four times a month I write the section that answers "should we pay for a pilot / feasibility study first, or just decide now and put the money straight into the program?" Typical numbers: a $150k–$600k study now versus a $2M–$8M scale-up decision a year later. I get about a day per memo, I can't fit a model or run simulations in that time, and it goes to a five-person program committee (two ex-finance, an epidemiologist, one of our country directors, and the exec director) who will not read an equation but will definately ask "what would we do differently if it came back null?" and "isn't it always better to know?". My flatmate does psych research and keeps teasing me that all our pilots are underpowered, which is making me weirdly paranoid about the noisy-signal part.

  So: we did Good's theorem last week — the result that for an expected-utility maximizer information you don't have to pay for can't be bad news in expectation, and is worth exactly zero if it couldn't change what you'd do anyway — and I want to turn it into a procedure I can actually run on a memo in ninety minutes, including the parts where the theorem doesn't apply to us. The ways our setup breaks its assumptions, as far as I can tell: (1) the study is never free, and the real cost is delay, since a year of waiting is a year of people not getting the program; (2) we can't unsee the result — the committee can't commit to the choice it would have made without it, someone will reopen the decision, and the country director's ministry co-funds based on the headline number, so the result partly creates the situation we then act in rather than just describing it; (3) our payoff isn't purely a function of the true effect, because we have a matching funder who doubles grants in areas where our evidence base *looks* promising, so what we believe is partly what we're paid for; (4) the pilot measures a proxy (one district, one implementer) for the thing we care about (national scale, government delivery), and the correlation between the two is itself unknown; (5) the measurement perturbs — intensive baseline surveys and an evaluation team in the district change how the program runs; (6) the decision maker is five people with different priors, not one expected-utility maximizer, so "the" value of the information isn't even well defined; and (7) sometimes the study isn't about a state of the world at all, it's about what options we can even describe (a qualitative study that tells us which of three implementation strategies is coherent), which feels like it's outside the theorem's scope entirely.

  What I want from you: an ordered checklist I can work through, where each step says what counts as a sufficient answer at that step, including a deliberately crude quantitative step that gives me an upper bound on the value of the information without a full model (my instinct is: the most I could gain by changing my mind is the whole value, so if the study costs more than the gain from switching to my second-best option under the most favorable possible result, stop right there — and note that this is generous, since real information is worth less than perfect information). Tell me where the procedure just returns "don't buy it", where it returns "buy it, obviously", and where it has to hand the question to the committee because it's a values call rather than a factual one. I want an explicit assumption audit at the front that translates Good's theorem's preconditions into yes/no questions I can answer about a real grant. Then run it on three cases: (a) a $400k cluster-randomized pilot in one district of a school-based delivery program where we already think the effect is probably real but small and the live question is whether to go national at $6M; (b) a $180k qualitative study of why front-line health workers ignore a protocol, where the decision is which implementation strategy to adopt and the study won't estimate any effect at all; (c) a $250k pilot of a cash-transfer-plus-mental-health package that our biggest donor has promised to match two-to-one if the pilot clears a headline threshold — my honest belief is the true effect is below the threshold but the pilot is noisy enough that it might clear it anyway. One of those should come out with an answer I won't like (I have a feeling it's (c), and I want you to say plainly whether "buying the result to unlock the match" is a legitimate use of the framework or a violation of its assumptions that I'd have to disclose to the committee). Also give me a one-page version I can paste into the memo template, and a short paragraph on which steps are really just me making a judgment call in procedural costume — I'd much rather write "we can't tell" in a memo than a number with fake precision.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Graduate student in Philosophy (Decision Theory) + Econ PhD cross-list. Intern at a global health foundation. Writes funding memos.
      *   **Task:** Create a practical, 90-minute procedure/checklist based on Good's Theorem (Value of Information) to decide whether to fund a pilot/feasibility study vs. direct scale-up.
      *   **Constraints:** No complex modeling/simulations. Audience is a 5-person committee (finance, epi, country dir, exec). They care about "what would we do differently?" and "isn't it always better to know?".
      *   **Specific Challenges (Assumption Violations):** Costly info (not free), delay costs, inability to commit (political reality), payoff depends on beliefs (matching funds), proxy measures (external validity), measurement perturbation (Hawthorne effect), group decision-making (no single EU maximizer), option generation (qualitative vs. quantitative).
      *   **Deliverables:**
          1.  Assumption Audit (Yes/No questions translating Good's Theorem).
          2.  Ordered Checklist with "sufficient answer" criteria (including a crude quantitative upper bound).
          3.  Decision Rules (Don't buy, Buy, Escalate to Committee).
          4.  Application to 3 Specific Cases (a, b, c).
          5.  One-page memo template version.
          6.  Reflexive paragraph on "judgment calls in procedural costume."
      *   **Tone:** Professional, rigorous but practical, intellectually honest (acknowledging limitations), aligned with decision theory concepts but translated for non-technical stakeholders.

  2.  **Deconstruct Good's Theorem & Adapt for Reality:**
      *   *Good's Theorem Core:* $EVSI$ (Expected Value of Sample Information) $\ge 0$. Information is never harmful *if free*. You should buy it if Cost $< EVSI$.
      *   *User's Reality:* Cost $> 0$. Delay matters. Beliefs affect payoffs (matching funds).
      *   *Adaptation:* We need $EVSI - \text{Cost} - \text{Delay Cost} > 0$.
      *   *Crude Upper Bound:* The value of information cannot exceed the value of *Perfect* Information (EVPI). Even simpler: The value of information cannot exceed the difference between the Best Option and the Second-Best Option *if* the information causes a switch. If Cost > (Value(Best) - Value(2nd Best)), stop.
      *   *The "What would we do differently?" Question:* This is the crux of EVSI. If the decision doesn't change across plausible signal realizations, VOI = 0.

  3.  **Drafting the Assumption Audit:**
      *   Need to translate the 7 violations listed by the user into checkable questions.
      *   1. Cost/Delay: Is the cost + delay loss less than the potential upside?
      *   2. Commitment/Political: Will the result actually bind the decision, or will it be reopened/ignored?
      *   3. Belief-Dependent Payoffs: Are we optimizing for impact or for signaling to donors?
      *   4. External Validity: Does the pilot predict the scale-up?
      *   5. Perturbation: Does measuring change the outcome?
      *   6. Group Agency: Do we have consensus on the goal?
      *   7. Option Generation: Is this about learning *what* to do, not just *if* it works?

  4.  **Developing the Checklist (The 90-Minute Procedure):**
      *   *Step 1: The "Do Nothing" Test.* (Is the decision already made?)
      *   *Step 2: The "Switch" Test.* (What result makes us change our mind?)
      *   *Step 3: The Crude Upper Bound.* (Max gain from switching vs. Cost).
      *   *Step 4: The Validity/Noise Check.* (Flatmate's concern).
      *   *Step 5: The Political/Matching Check.* (Is this buying a signal?)
      *   *Step 6: Recommendation.*

  5.  **Running the Cases:**
      *   *Case (a) School Delivery:* $400k pilot, $6M scale. Effect likely small.
          *   Analysis: If effect is small, do we scale? If pilot says "big effect" (unlikely), we scale. If pilot says "null", do we stop? If we think it's real but small, maybe we scale anyway (cost-benefit).
          *   Verdict: Likely "Don't Buy" or "Escalate". The cost is high relative to the uncertainty reduction.
      *   *Case (b) Qualitative/Protocol:* $180k. Decision is *which* strategy.
          *   Analysis: This violates the "state of the world" assumption. It's option generation. Good's theorem doesn't apply directly, but VOI logic does (value of reducing uncertainty about *feasibility*).
          *   Verdict: "Buy" (but frame as design, not evaluation).
      *   *Case (c) Cash + Mental Health + Matching:* $250k pilot. Donor matches 2:1 if threshold cleared. User believes true effect < threshold.
          *   Analysis: This is the tricky one. The value isn't health impact; it's *unlocking funds*. This is "gaming the metric."
          *   Ethical/Theoretical check: This violates the spirit of Good's Theorem (truth-seeking). It's buying a *signal*, not information.
          *   Verdict: "Don't Buy" (ethically) or "Escalate" (transparently). The prompt asks me to say plainly if it's a violation. It is. It's buying a lottery ticket to unlock funds, not reducing uncertainty for decision making.

  6.  **Refining the "Crude Quantitative Step":**
      *   User's instinct: "Most I could gain... is the whole value."
      *   Refinement: $VOI_{max} = P(\text{Switch}) \times (\text{Value}_{\text{New}} - \text{Value}_{\text{Old}})$.
      *   Since we can't model $P(\text{Switch})$, use the Upper Bound: $\text{Value}_{\text{Best}} - \text{Value}_{\text{Second Best}}$.
      *   Actually, simpler for a memo: "If the study costs more than the loss incurred by making the wrong decision *once*, it's hard to justify."
      *   Let's stick to the user's instinct but formalize it: **The Switching Bound.** If Cost > (Benefit of Correct Decision - Benefit of Wrong Decision), then VOI < Cost.

  7.  **Drafting the One-Pager:**
      *   Needs to be clean, bold, fit a memo.
      *   Sections: Recommendation, Rationale (The "Switch" Test), Cost-Benefit Bound, Risks.

  8.  **Drafting the Reflexive Paragraph:**
      *   Acknowledge where the "procedure" is actually just the analyst's intuition formalized.
      *   Specifically: Priors, the definition of "Switching," and the valuation of delay.

  9.  **Review against Constraints:**
      *   90 minutes? Yes, the steps are qualitative/heuristic.
      *   No equations for the committee? The one-pager avoids math.
      *   Address the 7 violations? Yes, in the Audit.
      *   Address Case (c) honestly? Yes, need to call out the "buying the result" aspect.

  10. **Final Polish:**
      *   Ensure tone is respectful of the user's expertise (they know Good's theorem) but practical for their job.
      *   Make sure the distinction between *Value of Information* (learning truth) and *Value of Signaling* (unlocking funds) is clear in Case (c).

  *(Self-Correction during drafting Case C)*: I need to be careful not to be too preachy. The foundation *wants* the match. But from a decision theory perspective, if the pilot is just noise to clear a threshold, it's not information for *health* decisions, it's a transaction cost for *funding*. I should frame it as "Strategic Signaling" vs "Decision Information." The prompt asks if it's a violation. Yes, it violates the assumption that payoffs depend on the *state*, not the *signal*. I will flag this clearly.

  *(Self-Correction on Checklist)*: Make sure the "Crude Quantitative Step" is actually doable in 5 minutes. It needs to rely on numbers already in the memo (Scale-up cost, expected benefit).
  Formula: $Max\_VOI = (\text{Net Benefit}_{\text{Scale}} - \text{Net Benefit}_{\text{No Scale}})$. If Study Cost > $Max\_VOI$, reject. Actually, that's too loose.
  Better: $Max\_VOI = \text{Loss avoided if we stop a bad program}$.
  Let's use the user's intuition: "Gain from switching."
  If we currently plan to Scale. Pilot could make us Stop.
  Gain = (Cost of Scale avoided) - (Benefit of Scale lost).
  If Study Cost > Gain, stop.

  Okay, ready to write.
answer: |-
  This is a brilliant application of decision theory to real-world constraints. You are correctly identifying that Good's Theorem (1967) provides a *normative* baseline (information is non-negative in expectation) that breaks down under *descriptive* and *structural* constraints (cost, delay, political economy, and multi-agent dynamics).

  Below is the **90-Minute VOI Procedure** designed for your specific context. It translates the theorem into a heuristic audit that respects the committee's time and your flatmate's skepticism about power.

  ---

  ### Part 1: The Assumption Audit (15 Minutes)
  *Before calculating anything, answer these Yes/No questions. These translate Good's Theorem preconditions into your foundation's reality. If you answer "No" to more than two, the standard VOI framework is broken, and you must escalate to the committee as a "Strategic/Values" decision rather than a "Technical" one.*

  1.  **The Commitment Test:** If the pilot returns a null result, is there a pre-commitment to cancel the scale-up?
      *   *Yes:* Proceed. *No:* (Violation #2: Political inertia). VOI is near zero because the decision won't change.
  2.  **The Delay Cost:** Can we quantify the harm of waiting one year (e.g., DALYs lost, inflation, political window closing)?
      *   *Yes:* Proceed. *No:* (Violation #1). You cannot net out the study cost against the benefit.
  3.  **The Proxy Validity:** Is there strong prior evidence that results in this district/implementer predict national scale performance?
      *   *Yes:* Proceed. *No:* (Violation #4). The signal is too noisy; the pilot measures the implementer, not the intervention.
  4.  **The Payoff Structure:** Is the primary goal health impact, or is it unlocking matching funds/reporting metrics?
      *   *Impact:* Proceed. *Funding/Signal:* (Violation #3). You are buying a *signal*, not information. See Case (c).
  5.  **The Perturbation Check:** Will the evaluation team change the implementation quality (Hawthorne effect)?
      *   *No:* Proceed. *Yes:* (Violation #5). The pilot overestimates real-world performance.
  6.  **The Consensus Check:** Do all 5 committee members agree on the goal (e.g., maximize lives saved vs. minimize financial risk)?
      *   *Yes:* Proceed. *No:* (Violation #6). "Value" is undefined. This is a negotiation, not a calculation.
  7.  **The Option Space:** Is the study measuring a known parameter, or exploring what options are even possible?
      *   *Measuring:* Proceed. *Exploring:* (Violation #7). This is R&D, not VOI. Standard theorem doesn't apply.

  ---

  ### Part 2: The 90-Minute Checklist & Crude Upper Bound

  **Step 1: The "Switch" Definition (20 mins)**
  *   **Task:** Write down the specific pilot result that would make you change your current recommendation.
  *   **Sufficient Answer:** "If the pilot shows effect size $< X$, we stop. If $> X$, we scale."
  *   **Fail State:** "We will take the results into account." (Vague. VOI = 0).
  *   **Flatmate Check:** Is the sample size of the pilot actually capable of distinguishing $X$ from the null? If the Minimum Detectable Effect is larger than the effect size required to justify scale-up, the pilot is statistically useless. **Stop.**

  **Step 2: The Crude Upper Bound Calculation (15 mins)**
  *   **Logic:** Information is only valuable if it changes a decision. The maximum value of *any* information is the value of avoiding the worst possible decision error.
  *   **Formula:** $\text{Max VOI} = (\text{Cost of Scale-Up}) - (\text{Value of Health Benefits if Program is Ineffective})$.
      *   *Simpler:* If you plan to Scale, the Max VOI is the money you save by *not* scaling a dud.
      *   *Calculation:* Take the Scale-Up Budget (e.g., $6M). Estimate the % chance the program is a total dud (e.g., 20%). Max VOI $\approx \$6M \times 0.20 = \$1.2M$.
      *   *Refinement:* Subtract the opportunity cost of delay (e.g., 1 year of benefits lost = $500k). Net Max VOI = $700k.
  *   **Decision Rule:** If **Study Cost > Net Max VOI**, recommend **Do Not Fund**.
      *   *Note:* This is generous. Real VOI is always lower than Max VOI because information is rarely perfect.

  **Step 3: The "Buying the Signal" Check (15 mins)**
  *   **Task:** Check if the pilot qualifies you for external funding (matching grants) regardless of internal decision utility.
  *   **Decision Rule:** If the primary financial return comes from a donor match triggered by a *positive headline* rather than internal confidence, flag as **Strategic Signaling**.
      *   *Action:* Disclose this explicitly. It violates the "truth-seeking" assumption of Good's Theorem.

  **Step 4: The Group Agency Check (15 mins)**
  *   **Task:** Identify which committee member holds the veto.
  *   **Action:** If the Epidemiologist cares about power (flatmate's concern) and Finance cares about ROI, does the pilot satisfy the *stricter* of the two?
  *   **Decision Rule:** If the pilot is underpowered for the Epi but cheap enough for Finance, recommend **Fund with Caveats** (label as "Feasibility," not "Evaluation").

  **Step 5: Final Recommendation Logic (15 mins)**
  *   **Return "Don't Buy" if:** Study Cost > Max VOI OR Commitment Test = No.
  *   **Return "Buy Obviously" if:** Study Cost < 10% of Max VOI AND Switch Definition is clear AND Validity is high.
  *   **Return "Committee Decision" if:** Payoff Structure = Signal OR Consensus Check = No. (This is a values call, not a math call).

  ---

  ### Part 3: Running the Cases

  #### Case (a): School Delivery Pilot ($400k vs $6M)
  *   **Audit:** Commitment? Likely Yes. Validity? Moderate (one district). Delay? High (1 year).
  *   **Switch Test:** "If effect is negligible, we stop."
  *   **Crude Bound:** If program is a dud, we save $6M. If we think there's a 30% chance it's a dud, Max VOI = $1.8M. Delay cost (1 year benefits) = ~$1M. Net Max VOI = $800k.
  *   **Comparison:** Study ($400k) < Net Max VOI ($800k). *Mathematically plausible.*
  *   **Flatmate Check:** Is a single district cluster-RCT powered to detect the "small" effect you expect? If no, the pilot will likely return "inconclusive," meaning no switch occurs.
  *   **Verdict:** **Escalate to Committee.**
      *   *Reasoning:* While the crude math passes, the "Switch" is unlikely to trigger because the pilot is underpowered for the expected effect size. You are paying $400k for a high probability of an inconclusive signal. The committee must decide if "being more sure" is worth $400k even if the decision doesn't change.

  #### Case (b): Qualitative Protocol Study ($180k)
  *   **Audit:** Option Space = Exploring (Violation #7). This is not measuring a state of the world; it is *generating* the options.
  *   **Switch Test:** "If we find no coherent strategy, we do nothing. If we find one, we adopt it."
  *   **Crude Bound:** Hard to calculate financially. Value is avoiding the cost of implementing a broken protocol.
  *   **Verdict:** **Buy (with re-framing).**
      *   *Reasoning:* Do not call this "Value of Information." Call it **"Design Risk Reduction."** Good's Theorem doesn't apply because there is no prior distribution over "strategies." You are paying for R&D. The $180k is a sunk cost to make the subsequent $2M investable.

  #### Case (c): Cash + Mental Health + Matching ($250k Pilot, 2:1 Match)
  *   **Audit:** Payoff Structure = Signal (Violation #3). You believe true effect < Threshold.
  *   **Switch Test:** There is no switch. You want the pilot to say "Pass" so you get the money, even if you believe the program is marginal.
  *   **Crude Bound:** The value is not health impact; it is the Match Amount ($2M+).
  *   **Verdict:** **Don't Buy (Ethically) / Escalate (Procedurally).**
      *   *Reasoning:* This is a violation of the theorem's assumptions. You are not buying information to optimize a decision; you are **buying a lottery ticket to unlock capital.**
      *   *Disclosure:* You must write: *"This pilot is not designed to inform our go/no-go decision (we intend to scale regardless). It is designed to meet donor evidence thresholds to unlock matching funds."*
      *   *Is it legitimate?* It is financially rational for the foundation, but it violates the epistemic integrity of the "Evaluation" framework. If you hide this, you are lying to the committee about the purpose of the study. It treats the pilot as a marketing cost, not a learning cost.

  ---

  ### Part 4: The One-Page Memo Template

  **TO:** Program Committee
  **FROM:** [Your Name]
  **SUBJECT:** Recommendation on [Study Name] Feasibility
  **DECISION:** [Fund / Do Not Fund / Committee Discretion]

  **1. The "Switch" Test**
  *   **Current Plan:** [e.g., Scale-up nationally in 2025]
  *   **Condition to Change Plan:** We will only cancel scale-up if this study shows [e.g., effect size < 0.2].
  *   **Likelihood of Switch:** [Low/Medium/High]. *Note: If the study is underpowered to detect this threshold, the likelihood of a decisive switch is low.*

  **2. Value of Information Bound**
  *   **Maximum Potential Savings:** If the program is ineffective, this study prevents a loss of $[Scale-Up Cost].
  *   **Cost of Delay:** Waiting for results costs approx. $[Delay Cost] in lost benefits/time.
  *   **Study Cost:** $[Study Cost].
  *   **Assessment:** The study cost is [X]% of the maximum possible savings. *If Study Cost > Savings, reject.*

  **3. Strategic Constraints (Assumption Audit)**
  *   **Commitment:** Can we commit to stopping if results are null? [Yes/No]
  *   **Validity:** Does this district predict national performance? [Yes/No/Partial]
  *   **External Incentives:** Does this study unlock matching funds? [Yes/No]
      *   *If Yes:* This study functions partially as a funding compliance mechanism, not purely as decision support.

  **4. Recommendation Rationale**
  *   [ ] **Fund:** High probability of changing a high-stakes decision; cost is low relative to risk.
  *   [ ] **Do Not Fund:** Cost exceeds potential value of switching; or study is too noisy to trigger a decision change.
  *   [ ] **Committee Discretion:** Study serves a strategic signaling purpose (e.g., donor matching) rather than pure decision utility. Requires values judgment on risk tolerance.

  ---

  ### Part 5: Reflexive Note on "Judgment in Costume"

  *Include this paragraph in your internal notes or deliver it verbally if challenged on precision.*

  > "This procedure uses the *structure* of decision theory to organize our uncertainty, but it does not eliminate judgment. Specifically, the 'Switch Test' and the 'Delay Cost' are not empirical facts I can look up; they are estimates of our own political will and opportunity costs. When I write that the 'Likelihood of Switch is Low,' I am effectively encoding my prior belief that the committee will find reasons to scale up even if the pilot is null. The crude upper bound is deliberately conservative to avoid false precision, but it still relies on my assessment of what constitutes a 'dud' program. I am not providing a calculation that proves the decision; I am providing an audit trail that shows *where* the decision rests on values (risk tolerance, commitment) versus facts (study cost, effect size)."

  ### Summary Advice for Case (c)
  Your instinct is correct: Case (c) is the one you won't like. It is **not** a legitimate use of the VOI framework in the epistemic sense. It is **Real Options Analysis** applied to donor funding, not health impact.
  *   **The Violation:** Good's Theorem assumes payoffs depend on the *State* (does the program work?). Case (c) payoffs depend on the *Signal* (did we pass the threshold?).
  *   **The Fix:** Do not frame it as "Should we learn if this works?" Frame it as "Is the $250k compliance cost worth the $2M unlock?" If you frame it as VOI, you are misleading the committee. If you frame it as "Cost of Capital," you are being honest. **Disclose the violation.**
