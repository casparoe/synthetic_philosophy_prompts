      *   **Section 2: The Indexical Turn (Accommodating the Proposal):**
          *   Introduce the user's idea: 'Now' as performative.
          *   Distinguish *token-reflexivity* from *ontological privilege*.
          *   Analogy: "Here" vs. "There." Space is a block, but "here" matters for action.
