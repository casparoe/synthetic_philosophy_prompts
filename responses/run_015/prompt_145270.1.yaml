          *   The "Practical A-Theory" is a theory of *rationale*, not *reality*.
      *   **Section 4: The Significance of Phenomenology:**
          *   Is it just residue? No.
          *   Argument: Without the indexical 'now', planning and commitment are impossible. The Block contains the *structure* of agency, but the agent must occupy a *perspective* to enact it.
          *   The "passing" of time is the traversal of causal paths within the block.
      *   **Conclusion:**
