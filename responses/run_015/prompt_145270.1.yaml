      *   **Section 3: Coherence Check (Avoiding Collapse):**
          *   Does this collapse into B-Theory? No, because B-Theory often treats 'now' as *illusory*. This view treats 'now' as *functionally real*.
          *   Does it collapse into A-Theory? No, because it doesn't claim the 'now' moves objectively.
