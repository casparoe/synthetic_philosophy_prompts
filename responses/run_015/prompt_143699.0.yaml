answer: |-
  This is a sophisticated formulation of a problem that sits at the intersection of metaphysics and the philosophy of physics. You have correctly identified that the dynamic variant generates a pressure distinct from Max Black's original static case, shifting the burden from *synchronic individuation* (how many exist now?) to *diachronic tracking* (which one is which over time?).

  To answer your primary question directly: **No, there is no single, canonical name for this specific dynamic configuration in the literature** comparable to "Black's Two Spheres." However, it is not unexplored. It appears as a sub-problem within discussions of **Haecceitism**, **Structural Realism**, and, most significantly, as a classical analogue to the **Permutation Argument** in quantum mechanics and the **Hole Argument** in General Relativity.

  Below is an analysis of how this configuration relates to existing literature, why it differs from Black's static case, the standard non-haecceitist replies available, and a proposed conceptual carving for the problem.

  ### 1. Distinctness from Black's Static Case
  While Black's 1952 example is the standard bearer for counterexamples to the Principle of the Identity of Indiscernibles (PII), your dynamic variant introduces a crucial topological and temporal dimension that changes the metaphysical stakes.

  *   **Black's Case (Synchronic):** The challenge is ontological parsimony. If two objects share all qualitative properties *at a time*, does PII force us to say there is only one? The standard haecceitist reply is that "being Sphere A" is a primitive property distinct from "being Sphere B."
  *   **Your Case (Diachronic):** The challenge is **genidentity** (a term coined by Kurt Lewin and developed by Reichenbach). Even if we grant there are two spheres at $t_1$ (perhaps via Weak PII, see below), the symmetry of the orbit makes the *history* of the system invariant under permutation.
      *   In Black's case, the symmetry is spatial reflection or rotation.
      *   In your case, the symmetry is a **dynamical permutation**. The state of the universe at $t_2$ is qualitatively identical to $t_1$, but the *trajectories* could be interpreted as either (A continues to A, B to B) or (A swaps to B, B to A).
      *   **The Pressure Point:** In the static case, you can be a haecceitist about *objects*. In the dynamic case, you must be a haecceitist about *world-lines*. This is a stronger commitment because it requires primitive identity to persist through change without any qualitative anchor, not just to exist at an instant.

  ### 2. Neighboring Concepts and Literature
  While your specific "orbiting spheres" example doesn't have a moniker, it maps onto three established debates:

  #### A. The Hole Argument (Earman & Norton, 1987)
  This is the closest rigorous analogue in the philosophy of physics. The Hole Argument asks whether diffeomorphically distinct models of General Relativity represent distinct physical realities. If you shift the metric field over the manifold points (a permutation), do you get a new world?
  *   **Relation:** Your sphere swap is a discrete version of a diffeomorphism. If you say the swap creates a new physical reality, you are a **Substantivalist** (committed to the independent reality of the "points" or "labels"). If you say the swap is physically meaningless, you are a **Relationalist** (the physical reality is the equivalence class of symmetric states).
  *   **Relevance:** This literature confirms your suspicion that without a background grid (substantival space), the "tracking" is metaphysically idle.

  #### B. Weak PII and Structuralism (Saunders, 2006; Muller & Saunders, 2008)
  Simon Saunders has argued that PII can be saved via **Weak Discernibility**. Two objects are weakly discernible if there is an irreflexive relation between them (e.g., "is at distance $d$ from").
  *   **Application to your case:** At any instant $t$, Sphere A and Sphere B are weakly discernible because $A$ is at distance $d$ from $B$, but $A$ is not at distance $d$ from $A$. This secures "two-ness" synchronically without haecceity.
  *   **The Failure:** As you noted, Weak PII fails *diachronically* in your scenario. The relation "is at distance $d$ from" holds at $t_1$ and $t_2$. It does not tell us if the $A$ at $t_1$ is the $A$ at $t_2$. This confirms your intuition that Weak PII solves the static Black case but collapses under your dynamic pressure.

  #### C. Counterpart Theory (David Lewis)
  Lewis offers a way to dissolve the tracking worry without primitive thisness. In *New Work for a Theory of Universals*, Lewis suggests we should not speak of transworld (or transtemporal) identity literally.
  *   **The Reply:** There is no fact of the matter about whether Sphere A "moved" to B's position. There is just a sphere at location $L_1$ at $t_1$ and a sphere at location $L_2$ at $t_2$. The statement "A moved to B's position" is true only relative to a **counterpart relation** we stipulate.
  *   **Dissolution:** This avoids haecceitism by denying the premise that there *must* be a fact of the matter about tracking. The "worry" is linguistic, not metaphysical.

  ### 3. Standard Replies (Beyond Bare Particularity)
  You asked for replies that do not simply assert primitive thisness. There are three main strategies in the literature that address this dynamic symmetry:

  **1. The "One Object" Topology (Hacking's Move)**
  Ian Hacking (1975), responding to Black, suggested that what looks like two symmetric objects might be one object in a curved space (e.g., elliptical space where going "straight" brings you back to the start).
  *   **Applied to your case:** If the universe is relationally empty, the only physical fact is the distance $d$. If the spheres orbit, the distance $d$ remains constant. A strict relationalist might argue the *state* of the universe is static. The "motion" is only real if there is a background space to move against. If there is no background, there is only one physical state repeating. Thus, there is no tracking problem because there is no change to track.
  *   **Cost:** Requires denying the reality of the motion or adopting a non-trivial topology.

  **2. Spacetime Substantivalism (World-Tubes)**
  If you adopt a 4D block universe view (Minkowski or Newtonian spacetime), the spheres are not 3D objects moving, but 4D "world-tubes."
  *   **The Reply:** The world-tubes are distinct helical structures in spacetime. They do not intersect. They are discernible by their spacetime coordinates (if spacetime is substantival). Even if the spatial slices are symmetric, the 4D structures are distinct individuals because they occupy distinct regions of the manifold.
  *   **Cost:** Commits you to the reality of spacetime points (substantivalism), which invites the Hole Argument problems.

  **3. Quotienting (The Physicist's Solution)**
  In classical mechanics, when dealing with indistinguishable particles, we **quotient the phase space by the permutation group**.
  *   **The Reply:** We define the physical state not as a point in the labeled configuration space $(q_1, q_2)$, but as a point in the reduced space $\{q_1, q_2\} / S_2$. In this reduced space, "A swaps with B" is the *same point* as "A stays at A."
  *   **Implication:** There is no tracking problem because the question "Did they swap?" is ill-formed. It's like asking "Did the dollar bill in my left hand become the one in my right hand, or did they swap?" when the only physical fact is "There is a dollar in each hand."
  *   **Cost:** Eliminative structuralism. You deny that "Sphere A" is a fundamental entity; only the "two-sphere-system" exists.

  ### 4. Proposed Carving: The Problem of Symmetric Persistence
  Since this specific configuration lacks a name, I propose carving it out as **The Problem of Symmetric Persistence**. This distinguishes it from Black's *Problem of Symmetric Existence*.

  **Boundary Conditions for the Carving:**

  1.  **The Symmetry Breaking Threshold:**
      *   *Indistinguishable:* Perfect symmetry + Relational Space = **One State**. (Tracking is impossible because the distinction is surplus structure).
      *   *Distinguishable:* Any interaction that breaks symmetry (e.g., Sphere A emits a photon, or one sphere is slightly warmer) = **Two Trajectories**. (Tracking becomes possible via causal history).
      *   *The Boundary:* The transition occurs when the system allows for an **irreflexive diachronic relation**. For example, if Sphere A interacts with a third object $C$ at $t_1$, and at $t_2$ an object interacts with $C$ at the corresponding location, we have a causal chain that anchors identity without haecceity.

  2.  **The Topological Threshold:**
      *   If space is Euclidean and infinite, the two spheres are distinct individuals (Substantivalism) or the question is meaningless (Relationalism).
      *   If space is topologically non-trivial (e.g., a 3-torus), the "two spheres" could be a single sphere intersecting a fundamental domain twice. This collapses the dynamic case back into Hacking's static solution.

  3.  **The Modal Threshold:**
      *   Does the system support counterfactuals? "If I had nudged Sphere A, it would have gone off course."
      *   If the answer is yes, then A and B have distinct **causal potentials**, even if their actual history is symmetric. This allows for a form of **Dispositional Individuation**. They are distinct because they *would* behave differently under specific interventions, even if they *don't* in the actual symmetric history. This avoids haecceity by grounding identity in modal profiles rather than primitive thisness.

  ### Summary
  Your dynamic variant is a potent refinement of Black's case. It exposes that even if we solve synchronic individuation (via Weak PII or Spacetime), **diachronic individuation** in symmetric systems requires either:
  1.  **Haecceitism** (primitive thisness of world-lines).
  2.  **Substantivalism** (distinct spacetime locations).
  3.  **Eliminativism** (denying the question makes sense, per Quotienting/Counterpart Theory).

  The literature treats this under the headers of **Haecceitism in Physics** and the **Hole Argument**, but your formulation isolates the *tracking* aspect specifically. It demonstrates that in a perfectly symmetric dynamic universe, **genidentity is underdetermined by qualitative facts.** The most robust non-haecceitist reply is likely the **Quotienting/Structuralist** view: in such a universe, "Sphere A" and "Sphere B" are not fundamental entities; only the symmetric system exists, rendering the tracking problem a category error.
