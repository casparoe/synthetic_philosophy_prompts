answer: |-
  It is completely understandable why Goodman's new riddle of induction feels so devastating, and you are in good company regarding that initial reaction. When many philosophers first encounter the grue paradox, the immediate intuition is exactly yours, namely that if logic alone cannot distinguish between green and grue, then our predictive practices are fundamentally ungrounded. However, the conclusion that induction is arbitrary or that Goodman closed the case against its rationality rests on a specific misunderstanding of what Goodman was attempting to do versus what Hume attempted to do. To see why philosophers carry on doing inductive reasoning without despair, we need to distinguish between the problem of justification and the problem of validation, and then look at how Goodman proposed we solve the latter through the concept of entrenchment.

  Hume's original problem was indeed about justification. He asked why we should trust induction at all, pointing out that any attempt to justify induction using past success is itself circular. Hume concluded that induction is a habit of the mind, not a product of rational deduction. Goodman, writing two centuries later, largely accepted Hume's skepticism about ultimate justification. He was not trying to prove that induction is logically necessary or that we can step outside our skin to justify it from a God's-eye view. Instead, Goodman started from the premise that we do make inductive inferences and some of them work while others do not. His question was not whether induction is valid in general, but rather which specific inductive inferences are valid. He wanted a definition of confirmation that would tell us why the hypothesis all emeralds are green is confirmed by our observations while all emeralds are grue is not, even though they share the same evidence class.

  The crux of the matter is that Goodman was not looking for a logical symmetry between predicates but rather a pragmatic asymmetry rooted in our linguistic and scientific practices. You are correct that there is no purely formal or logical difference between green and grue that favors one over the other in a vacuum. If you treat predicates as abstract sets, they are indeed symmetrical. However, Goodman argued that predicates are not used in a vacuum. They are embedded in a history of usage. He introduced the concept of projectibility to describe predicates that are suitable for induction. A predicate is projectible if it has a history of successful projection in the past. Green is deeply entrenched in our language and scientific history; we have used it successfully to make predictions for centuries. Grue, by contrast, is a gerrymandered predicate constructed specifically for the paradox. It has no history of successful projection independent of the paradox itself. For Goodman, the validity of an inductive inference is determined by its conformity to accepted rules of inference, and those rules are justified by their fit with our accepted inductive practices. This is a coherentist approach rather than a foundationalist one.

  This might sound like circularity, and in a sense it is, but it is the only kind of justification available for any logical system. We justify deduction by showing that valid deductive arguments align with our intuitive acceptance of specific instances, and we refine our rules until they match our practice. Goodman argued induction should be treated the same way. We do not choose green over grue because of a logical axiom, but because green is part of a system of predicates that has proven reliable for navigating the world. The arbitrariness you fear is avoided because our linguistic practices are not arbitrary; they are evolved tools shaped by interaction with reality. We do not just pick any predicate; we pick those that carve nature at its joints, to use Quine's famous phrase. Quine extended Goodman's work by suggesting that projectibility is tied to similarity and natural kinds. Green tracks a natural similarity among emeralds regarding their surface reflectance properties, whereas grue tracks a disjointed similarity involving both reflectance and time. Our biological and cognitive heritage predisposes us to notice natural kinds, which is why green feels intuitive and grue feels forced.

  Furthermore, modern approaches often integrate Goodman's insights with Bayesian confirmation theory to dissolve the symmetry even further. In a Bayesian framework, hypotheses are not evaluated solely on how well they fit the data, but also on their prior probabilities. The hypothesis that all emeralds are green is assigned a much higher prior probability than the hypothesis that all emeralds are grue because the latter is vastly more complex and relies on a specific time parameter that lacks theoretical motivation. The grue hypothesis implies a sudden change in the physical properties of emeralds at time t without any causal mechanism, which violates our background knowledge about physics and chemistry. When you include background knowledge, the evidence does not support green and grue equally. The evidence supports green relative to our background theory of mineral stability, while it supports grue only if we assume a background theory where objects spontaneously change color based on observation dates, which we have no reason to accept.

  So, what you are missing is the shift from seeking a logical guarantee to seeking a pragmatic validation within a system of practice. Goodman did not show that induction is irrational; he showed that induction cannot be formalized without reference to the content and history of the predicates involved. He closed the case on the idea that there is a purely syntactic logic of confirmation, but he opened the case for a naturalistic epistemology where induction is justified by its success in our actual scientific and linguistic endeavors. Philosophers carry on doing inductive reasoning because the paradox does not undermine the utility of induction, but rather refines our understanding of why some predictions are reliable and others are not. It teaches us that we must be vigilant about the predicates we use and ensures we do not treat all generalizations as equally lawlike. The rationality of induction lies not in escaping our human perspective to find a logical absolute, but in recognizing that our standards of reasoning are refined tools that have evolved to help us understand a stable world. The grue paradox is a warning against naive formalism, not a death sentence for empirical reasoning.
