  MEMORANDUM

  **TO:** All Licensed Interpersonal Mediators and Couples-Therapists
  **FROM:** Bureau of Participant Stance Compliance (BPSC)
  **DATE:** October 24, 2023
  **SUBJECT:** Mandatory Implementation of Reactive Attitude Disclosure Protocols

  Effective immediately, all licensed practitioners must administer the Reactive Attitude Disclosure Form (RADF) prior to facilitating any client expression of resentment, gratitude, or forgiveness. This protocol ensures strict adherence to the Strawsonian Framework regarding interpersonal involvement. Practitioners must verify whether the client is adopting the participant stance or the objective attitude. The participant stance presupposes mutual recognition and accountability within a relationship. The objective attitude regards the counterpart as an object of social policy, causal explanation, or management. Mixing these stances during a single session constitutes "stance contamination" and must be logged as an adverse event.

  To regulate the expression of blame, the Bureau is instituting a three-tier licensing system for qualified resentment. Tier 1 (Basic) covers minor interpersonal slights and everyday disappointments. Tier 2 (Certified) covers significant breaches of reasonable expectation. Tier 3 (Forensic) is required for resentment involving legal or permanent relational adjudication. All licenses require annual renewal and completion of continuing-education credits in "Interpersonal Involvement Maintenance." These credits include modules on sustaining emotional vulnerability without retreating into clinical detachment. Failure to maintain credits results in automatic downgrading to Tier 1.

  Regarding theoretical exemptions: Recent inquiries suggest that the causal determination of behavior should waive licensing fees. Senior Mediator Aris Thorne recently argued that if human behavior is fully causally determined, blame is merely an output of prior causes, rendering fees for "qualified resentment" unjust. Thorne's petition claimed that charging for blame contradicts the theoretical impossibility of ultimate responsibility. The Bureau rejects this interpretation. While the Strawsonian Framework acknowledges that determinism does not furnish a genuine reason to suspend reactive attitudes, it does not exempt practitioners from administrative overhead. The naturalness of reactive attitudes within ordinary human practices does not negate the cost of regulating them. Determinism is not a valid justification for non-compliance.

  Practitioners are warned that unauthorized deployment of the objective attitude during marital counseling will result in immediate decertification. Treating a spouse as a subject for management rather than a participant in dialogue violates the core tenet of interpersonal involvement. Violators will be referred to the Objective-Attitude Operator Registry and barred from future employment in any capacity requiring mutual regard. This Registry is accessible to all family courts and mediation firms. Listing on the Registry indicates an inability to sustain the necessary participant stance required for ethical mediation.

  Ensure all RADF forms are filed within forty-eight hours of session completion. Late filings incur a penalty fee payable in emotional labor hours. Non-compliance will be treated as a failure of participant engagement and may trigger an audit of your own stance consistency. The Bureau expects full cooperation in maintaining the integrity of our shared moral practices.
