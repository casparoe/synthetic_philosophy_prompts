  hey im putting together a sorting quiz for my philosphy reading group on panpsychism and the combination problem, but i dont want people to just pick the label they recognize from some intro course. i need a decision-tree thing with concrete cases that sorts you into actual positions based on what you say about the cases, not on which word you like.

