  from there branch on whether that macro-subject has genuinely novel phenomenal properties or just inherits/rearranges the micro ones. then run the same logic through a swarm of bees, a silicon chip running a deep neural net, and a galaxy — ask whether each gets its own macro-subject, and if so whether its quality-space is continuous with or discontinuous from its parts.

