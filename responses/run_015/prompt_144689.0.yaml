      *   *Option 2 (Drop Free Will Label):* Keep (f). Admit (d) isn't "free will" in a responsibility-grounding sense, just "complex agency."
      *   *Option 3 (Fix the Scanner Claim):* Clarify (c). It's not that prediction is impossible *in principle*, but impossible *for any subsystem within the universe* (due to computational limits/thermodynamics).

