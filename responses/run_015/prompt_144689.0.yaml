          *   The fight is between **d** (This is Free Will) and **f** (Blame is illusion). Usually, "Free Will" is the prerequisite for "Blame." If you have one but not the other, your definitions are clashing.
          *   *Correction:* Many philosophers (Strawson, etc.) argue exactly this: Determinism kills *ultimate* responsibility (f), but we keep *practical* responsibility.
          *   *Best advice:* The tension is between the *label* in (d) and the *consequence* in (f).

  7.  **Drafting the Response:**

