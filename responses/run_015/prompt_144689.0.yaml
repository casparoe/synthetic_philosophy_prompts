      *Chaos implies computational irreducibility.* You can't shortcut the simulation. You have to *run* the universe to know the outcome. A "scanner" implies reading the state and calculating the result faster than the event. Chaos prevents the *calculation* from being faster than the *event*.
      So (c) is actually consistent with (a) if "scanner" means "predictor that shortcuts the process."
