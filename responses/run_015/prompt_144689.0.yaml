      *   Changing (d) requires a semantic shift (accepting "free will" is a misnomer).
      *   Changing (c) requires a physics precision shift.
      *   *Actually,* the biggest logical snag is (a) vs (c). If (a) is true, a *God* could predict. If (c) says "no scanner could *ever*," that implies logical impossibility.
      *   *Correction:* If the scanner is physical, it's subject to physics. A physical scanner cannot measure a system it is part of with infinite precision (computational irreducibility). So (c) is defensible physically.
      *   *Real Conflict:* (d) and (f). If you define free will as (d), you usually do it to save blame. If you discard blame, (d) is just "complex determinism."
      *   *Recommendation:* Keep (a, b, c, e, f). Modify (d). Call it "Practical Agency." This resolves the expectation that (d) should stop (f).

