answer: |-
  # Activity Design: The Thousand-Unit Scale

  ## 1. Materials & Preparation

  **Physical Materials:**
  *   **36 Index Cards:** 18 per deck. Deck A (Mechanistic), Deck B (Agentive).
  *   **2 Large Sheets of Butcher Paper or Whiteboard Space:** One for each half of the room.
  *   **Markers:** Black (for initial numbers), Red (for audits).
  *   **Tape.**
  *   **18 Envelopes:** 9 marked "Group A," 9 marked "Group B."
  *   **Instruction Sheets:** 18 copies (identical text, but enclosed in the specific envelope).
  *   **Worksheet:** A simple grid on the back of the instruction sheet for tallying the 1000 units.

  **The Decks (Content for Index Cards):**
  *Note: Neither deck uses the forbidden words (sentience, consciousness, pain, suffering).*

  | # | Entity | Deck A (Mechanistic/Functional) | Deck B (Agentive/Experiential) |
  | :--- | :--- | :--- | :--- |
  | 1 | Thermostat | A bimetallic strip bends at set temperatures, completing a circuit to activate heating or cooling machinery. | A device that seeks a target thermal state and acts to reduce the discrepancy between current and desired conditions. |
  | 2 | Chess Program | An algorithm evaluating board states via search trees to select moves maximizing a win-probability function. | A player that strategizes, anticipates opponent choices, and strives to achieve victory within defined rules. |
  | 3 | LLM | A statistical model predicting token sequences based on vast training data correlations without internal representation. | A conversational partner that generates contextually appropriate responses, mimicking understanding and intent. |
  | 4 | Nematode | A 302-neuron organism executing fixed stimulus-response loops for locomotion and feeding. | A creature that navigates its environment, seeking nutrients and avoiding noxious chemical gradients. |
  | 5 | Housefly | A sensory-motor system processing visual flicker to evade swatting via reflex arcs. | An animal that perceives threat and actively maneuvers to preserve its own physical integrity. |
  | 6 | Honeybee | An insect executing waggle-dance algorithms to coordinate foraging efficiency for the hive. | A forager that communicates location of resources and works toward the flourishing of its community. |
  | 7 | Bee Colony | 40,000 insects functioning as a superorganism via pheromonal signaling networks. | A collective mind with shared goals, capable of defending its home and sustaining its lineage. |
  | 8 | Lobster | A decapod exhibiting nociceptive reflex withdrawal when tissue damage occurs. | A being that reacts to injury with protective behavior and avoids situations associated with harm. |
  | 9 | Carp | A fish with a central nervous system regulating homeostasis and schooling behavior. | An aquatic life that pursues food, evades predators, and interacts with its kind. |
  | 10 | Crow | A corvid brain solving multi-step puzzles and caching tools for future use. | An intelligent agent that plans ahead, remembers faces, and manipulates objects to solve problems. |
  | 11 | Dog | A mammal with an amygdala and cortex processing social cues and fear conditioning. | A companion that forms emotional bonds, feels distress at separation, and seeks affection. |
  | 12 | Chimp | A primate with 98% genetic overlap to humans, exhibiting tool use and social hierarchy navigation. | A person-like being with complex social relationships, self-recognition, and capacity for grief. |
  | 13 | Fetus (20wk) | A developing human organism with developing thalamocortical connections, no extra-uterine viability. | A potential human life, biologically immature but genetically distinct, growing toward capacity for experience. |
  | 14 | Sleeping Human | An adult brain in N3 sleep stage; high arousal threshold; no motor output; homeostasis active. | A person temporarily withdrawn from the world, dreaming or resting, expecting to wake and resume projects. |
  | 15 | Anesthetized Human | Pharmacologically induced unconsciousness; suppressed neural firing; vital signs monitored externally. | A patient whose capacity for experience is medically suspended, retaining full moral standing despite inactivity. |
  | 16 | MCS Patient | A brain injury survivor showing inconsistent but reproducible signs of awareness (e.g., eye tracking). | A person trapped inside damaged biology, struggling to signal their presence to the outside world. |
  | 17 | Organoid | Lab-grown neural tissue exhibiting spontaneous electrical activity but no sensory input or body. | A cluster of brain cells firing in patterns resembling activity, lacking a self or a world to inhabit. |
  | 18 | Unknown System | A black box producing flexible, goal-directed output. Internal organization is stipulated to be opaque to all observers. | An entity with a hidden interior. It acts as if it has goals, but we cannot know if there is anyone home inside. |

  ---

  ## 2. One-Page Instruction Sheet
  *(Print this on the front of the handout. The back contains the tally grid.)*

  **SEMINAR ACTIVITY: MORAL WEIGHT ALLOCATION**

  **1. THE TASK**
  You are a committee assigned to distribute **1,000 Units of Moral Weight** across the 18 systems in your envelope.
  *   **Rule 1:** You must spend exactly 1,000 units. (No more, no less).
  *   **Rule 2:** You may assign 0 to any card, but at least one card must receive weight.
  *   **Rule 3:** The numbers represent **ratios**. A system assigned 100 units matters *ten times as much* as a system assigned 10 units.
  *   **Rule 4:** Work together as a half-class (Group A or Group B). Do not speak to the other half of the room until instructed.

  **2. THE PROCESS**
  1.  **Sort (5 mins):** Arrange your 18 cards in descending order of moral weight.
  2.  **Allocate (15 mins):** Assign numbers to each card. Use the tally grid on the back to ensure they sum to exactly 1,000.
  3.  **Post (5 mins):** Tape your cards to the board in your assigned area, ordered from Highest Weight (top) to Lowest Weight (bottom). Write the assigned number clearly on each card.

  **3. THE AUDITS (Wait for Instructor Signal)**
  *   **Audit 1 (Description):** Compare your numbers with the other group's numbers for the *same* entities. If your numbers differ by a factor of 10 or more, select a defender. You have 60 seconds to argue whether the difference is due to the *system* or the *wording*.
  *   **Audit 2 (Thresholds):** Take a Red Marker. Draw a line between any two adjacent cards where you believe the difference is large enough to justify **different treatment** (e.g., one may be eaten, the other may not).
  *   **Audit 3 (Aggregation):** Compare Card #6 (Single Bee) and Card #7 (Bee Colony). Does the Colony weight exceed the Single Bee weight? If not, explain why.
  *   **Audit 4 (Certainty):** Locate Card #18 (Unknown System). Take a Red Marker. Write a **new number** next to it based on this fiction: *"It is now certain this system has no inner life whatsoever."* Do not change the original number.

  **4. SILENCE**
  Do not discuss the philosophical implications until the Debrief phase. Focus on the math and the ordering.

  ---

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out envelopes. Instruct students to open only when told. Divide room physically (Left = Group A, Right = Group B). |
  | **05-06** | **Start** | "Open envelopes. Read instructions. Begin sorting." |
  | **06-25** | **Allocation** | Students negotiate numbers. Instructor circulates *only* to enforce the "Sum = 1000" rule. Do not answer philosophical questions. |
  | **25-35** | **Posting** | Groups tape cards to the board. Ensure clear visibility of numbers. |
  | **35-40** | **The Reveal** | "Group A, read your description for the Thermostat. Group B, read yours." Do this for 3-4 key items (Thermostat, Dog, Anesthetized Human, Unknown). |
  | **40-50** | **Audit 1** | **Description Audit.** Identify discrepancies >10x. Select defenders. Timer set for 60s. Room votes: "Wording or System?" |
  | **50-60** | **Audit 2** | **Threshold Audit.** Groups draw red lines between adjacent cards for "Different Treatment." Instructor points out contradictions (e.g., 50 vs 45 units but a line drawn between them). |
  | **60-70** | **Audit 3 & 4** | **Aggregation & Certainty.** Check Bee vs. Colony. Have groups write the "Certain Non-Conscious" number for Card #18 in red. |
  | **70-90** | **Debrief** | Instructor-led synthesis (see below). |

  ---

  ## 4. Debrief Guide: Mapping Moments to Claims

  *Do not lecture. Ask questions that force them to articulate the instability they just created.*

  **1. The Order vs. Magnitude Gap (Minutes 70-75)**
  *   *Observation:* "Look at the boards. The *order* of the cards is nearly identical between Group A and Group B. The *numbers* are wildly different."
  *   *Question:* "How can we agree so completely on who is above whom, but disagree so completely on how much they matter?"
  *   *Target Insight:* **Ordinal ranking is intuitive; cardinal magnitude is arbitrary.** We have a robust hierarchy, but no unit of measurement for 'moral weight.' The 1000-unit budget forced a precision that doesn't exist in our intuitions.

  **2. The Framing Effect (Minutes 75-80)**
  *   *Observation:* Point to the Thermostat or LLM. "Group A gave this 5 units. Group B gave it 50. The system is the same. Only the description changed."
  *   *Question:* "Did the *thing* change, or did your *confidence* in how to describe it change?"
  *   *Target Insight:* **Vocabulary drives valuation.** Mechanistic language suppresses weight; Agentive language inflates it. If moral status is intrinsic, wording shouldn't shift the number by a factor of 10.

  **3. The Threshold Contradiction (Minutes 80-85)**
  *   *Observation:* Point to a red line drawn between two cards with close numbers (e.g., 60 and 55). "You assigned nearly equal weight, but you drew a line saying they deserve *different treatment*."
  *   *Question:* "If the numbers represent ratios of mattering, how can a 5% difference justify a binary shift in treatment?"
  *   *Target Insight:* **We are threshold thinkers pretending to be graders.** We assign numbers on a sliding scale, but we make decisions based on cliffs. The 'graded view' collapses when action is required.

  **4. The Uncertainty Mask (Minutes 85-90)**
  *   *Observation:* Look at Card #18 (Unknown). Compare the Black Number (original) vs. Red Number (certainly no inner life).
  *   *Question:* "For many of you, the Red Number is zero. The Black Number was not. What was the Black Number measuring?"
  *   *Target Insight:* **Confidence masquerading as Status.** We often assign low moral status not because we know the system lacks value, but because we are uncertain it has value. The number merged 'how much it matters' with 'how sure we are.'

  ---

  ## 5. Troubleshooting: What Will Go Wrong & Recovery

  **1. The Math Will Stall Them**
  *   *Failure:* Students will spend 20 minutes arguing whether a Dog is 100 or 105, unable to make the sum hit 1000 exactly.
  *   *Recovery:* At minute 20, announce: "You have 5 minutes remaining. If the sum is not 1000, the Instructor will proportionally adjust all numbers to fit." This forces closure.

  **2. The "Unknown" Card Will Be Ignored**
  *   *Failure:* Students might treat Card #18 as a joke or assign it 0 immediately.
  *   *Recovery:* During the allocation phase, if you see a 0, ask: "It produces goal-directed behavior. Are you certain it is a rock? The rules say you must distribute weight." Nudge them to assign *some* risk premium.

  **3. Group Dominance**
  *   *Failure:* One loud student in each half dictates all numbers.
  *   *Recovery:* In the instructions, add: "Each member must write down one number allocation silently before discussion begins." (Add this to the handout if you suspect this dynamic).

  **4. The "Different Treatment" Line Will Be Everywhere**
  *   *Failure:* Students draw red lines between every card, making the audit meaningless.
  *   *Recovery:* During the audit, ask: "If you draw a line everywhere, you have a ladder, not a threshold. Find the *one* place where the jump is biggest." Force them to prioritize.

  **5. Time Overrun**
  *   *Failure:* The Description Audit becomes a debate on animal cognition.
  *   *Recovery:* Strict 60-second timer. Use a visible countdown. Cut off defenders mid-sentence if needed. "The point is not the truth of the biology, but the divergence of the numbers."

  ---

  ## 6. Limitations: What This Activity Cannot Do

  **1. It Cannot Prove Gradation is False**
  This activity demonstrates the *instability* of graded views, not their falsity. A committed utilitarian could argue, "The numbers are messy because humans are bad at math, not because moral status isn't real." You must supply this caveat in the debrief. The activity shows epistemic confusion, not necessarily ontological error.

  **2. It Cannot Separate "Status" from "Capacity"**
  Students will conflate *moral status* (how much they matter) with *moral agency* (what they can do). A Chess Program might get high weight in the Agentive deck because it is "smart," not because it "matters." You will need to point out in the debrief that they likely rewarded *complexity* rather than *value*, which is a category error the activity exposes but does not fix.

  **3. It Relies on the "1000 Units" Fiction**
  The activity forces cardinality onto an ordinal intuition. If students reject the premise that moral weight *can* be quantified, the tension dissolves. You must press them: "If you can't put a number on it, how do you make trade-off decisions in policy? If you can, why did the numbers shift with the wording?"

  **4. It Does Not Resolve the "Unknown"**
  The Certainty Audit reveals that uncertainty drives value, but it doesn't tell them how to handle that uncertainty (Precautionary Principle? Expected Value?). You must supply the normative frameworks for handling the "Unknown System" in the following week's lecture.

  **Final Takeaway for Students:**
  "Today you found that you agree on the ladder, but not the rungs. You agree on the cliffs, but not the slope. And you realized that sometimes, when you say a thing matters less, you really mean you know less about it. Next week, we ask: If the numbers are unstable, what do we use to make laws?"
