prompt: |-
  I've spent a lot of time in the rationalist and effective-altruism literature, so I think about moral questions in terms of expected value, marginal dollars, cost-effectiveness, and moral uncertainty. I have now started reading the philosophical literature on the demandingness objection to consequentialism, and I would like you to restate it in the vocabulary I actually use, as faithfully as you can.

  Specifically, I want you to take the three most influential versions of the demandingness objection — the basic objection that consequentialism is too demanding because it requires you to sacrifice your own interests whenever doing so would produce a better overall outcome; Williams's integrity objection, that consequentialism fails to respect the personal projects and commitments that give your life meaning; and the separateness-of-persons objection, that consequentialism aggregates utility across persons as if they were a single entity — and restate each of them in terms of expected value, marginal utility, cost-effectiveness, the shallow-pond thought experiment, discounting, moral uncertainty, satisficing versus optimizing, and feasibility constraints.

  For each objection, tell me what translates cleanly, what has to be distorted to fit, and what has no expression at all in my vocabulary. Then give me the residue report: which of the philosophers' claims map cleanly onto the expected-value framework, which translate only with distortion, and which cannot be expressed in it at all. And here is the part I most want to see: is the residue a defect of the expected-value framework — that is, does the framework simply lack the concepts to represent these kinds of moral claims — or is it a sign that the philosophical claims are less clear or less substantive than they first appeared, such that when you try to pin them down in precise terms, they turn out to be conflations or ambiguities that dissolve under scrutiny?

  I want to know whether my intuition — that the demandingness objection is just a practical question about how much I can afford to give, and that the integrity and separateness objections are just disagreements about the aggregation function — is right, or whether it is missing something that the philosophers are getting at.
