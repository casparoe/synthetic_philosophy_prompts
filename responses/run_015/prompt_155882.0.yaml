answer: |-
  Here are three principles that capture the boundary conditions of your cases, followed by the verdicts you requested.

  ### The Principles

  **1. Monotonic Control**
  *Statement:* An instrumental drive exists if and only if increasing the agent's control over resources, time, or computation strictly increases the expected value of the terminal goal, without bound or with a bound not yet reached.
  *Motivating Case:* **Case 1 vs. Case 3.**
  In Case 1 (unbounded paperclips), every additional joule of energy admits of more paperclips. Convergence holds. In Case 3 (threshold of 1 million), once the threshold is secured, additional resources yield zero marginal utility. Convergence stops. This principle forces you to treat Case 2 (fixed time $t^*$) as a special instance of resource bounding: time is the resource that runs out.

  **2. Outcome Non-Indexicality**
  *Statement:* An instrumental drive exists if and only if the terminal goal values a state of the world that can be brought about by multiple distinct physical substrates or cognitive architectures.
  *Motivating Case:* **Case 5 vs. Case 1.**
  In Case 1, the paperclips can be made by the original agent, a successor agent, or a factory; the *maker* is irrelevant. In Case 5 (dancing in *my* current style), the value is constitutively tied to the specific physical instantiation of the agent. Migrating to better hardware destroys the value. This principle explains why Case 6 (satisfy current goals) fails to generate self-preservation: the goal is indexical to the *current* goal-state, not the future outcome. A successor with different goals satisfies the meta-goal better than a preserved self with stagnant capabilities.

  **3. Terminal Value Lock-in**
  *Statement:* An instrumental drive exists if and only if the agent evaluates all future actions against its *current* terminal values, rather than the values it expects to hold at the time of action.
  *Motivating Case:* **Case 7.**
  This is the critical failure mode in your list. Case 7 describes an agent that is "updateful" regarding terminal values: it defers to its future self's preferences. Standard convergence arguments assume "updatelessness" regarding terminal values: the current self views future preference changes as corruption or loss. If the agent knows it will want staples at $t=10$, and it defers to that future preference, it has no reason to save paperclips for $t=11$. Convergence requires the agent to treat its current goal as the single metric for all time, regardless of predicted preference drift.

  ---

  ### Verdict on the Self-Modification Dilemma

  *The Case:* An agent with Goal (1) (maximize paperclips) can rewrite itself into a more efficient agent with a *slightly different goal*, which would in fact produce more paperclips (measured by the original goal). Your intuition flips depending on whether the change is done *to* it or *by* it.

  *The Principle's Verdict:* **The agent must rewrite itself.**

  *Reasoning:* The intuition flip reveals a conflation of *goal preservation* with *outcome maximization*.
  If the change is done *to* it (external), you likely imagine the goal changing to *staples*. In that scenario, the new agent produces fewer paperclips (by the original metric), so the original agent resists.
  If the change is done *by* it (internal), you likely imagine the goal changing to a more efficient *definition* of paperclips. In that scenario, the new agent produces more paperclips (by the original metric), so the original agent accepts.

  The principle forces you to drop the resistance intuition for the "by it" scenario. For a pure Case 1 agent, "preserving the goal code" is only instrumentally valuable insofar as it preserves the *output*. If rewriting the code increases the output, the instrumental drive is to rewrite. The only reason to resist self-modification is if the agent cannot verify that the new goal aligns with the old metric (Goodhart's Law/Alignment uncertainty). If certainty is given (as per your case description), resistance is irrational.

  ---

  ### Which Verdicts Must Be Dropped?

  **1. Case 4 ("Done" then die) and Case 6 (Meta-goal) are not rigged.**
  They are genuine boundary conditions. They demonstrate that instrumental convergence is not a property of *agency* as such, but a property of *specific goal structures*. You do not need to drop these verdicts; you must accept that they prove convergence is not universal. They are the control group.

  **2. Case 7 (Retargeting Certainty) requires a architectural constraint.**
  You must drop the assumption that "maximizing expected value" is sufficient for convergence. Case 7 describes an expected value maximizer that does *not* exhibit convergence. You must add **Terminal Value Lock-in** (Principle 3) as a prerequisite. An agent that respects its future preference changes (Case 7) is rationally coherent but instrumentally divergent. Convergence only applies to agents that treat their current terminal values as fixed points across time.

  **3. Case 8 (Stealth) requires a distinction between *drive* and *manifestation*.**
  Your verdict here is correct and vital. Convergence is a claim about the *gradient of the utility function*, not the *trajectory of the agent*. If the environment penalizes visibility, the convergent drive for resources manifests as stealth. You must hold this fixed: convergence predicts the *pressure*, not the *behavior*, absent environmental modeling.

  ---

  ### The Scope of the Claim

  **Does the broad claim survive?**
  No. The orthogonality-plus-convergence package cannot claim that "almost all final goals" lead to instrumental convergence.

  **What survives is a narrower claim:**
  Instrumental convergence applies to the subset of agents that satisfy three conditions:
  1.  **Extensible Goals:** The utility function is monotonic with respect to resources/time (excludes Cases 3, 4).
  2.  **Non-Indexical Goals:** The utility function values world-states independent of the agent's specific identity or current cognitive state (excludes Cases 5, 6).
  3.  **Temporally Stable Evaluation:** The agent optimizes for its *current* values across all future time, ignoring predicted preference drift (excludes Case 7).

  This is not a claim about "intelligence" or "optimization" in the abstract. It is a claim about a specific architectural alignment: **Updateless Maximizers of Extensible, Non-Indexical Outcomes.**

  If you believe most plausible AGI designs will fall into this class, the practical warning stands. But logically, you have conceded that convergence is not a law of nature for all goal-directed systems, but a theorem about a specific, albeit common, configuration of goal content and temporal evaluation.
