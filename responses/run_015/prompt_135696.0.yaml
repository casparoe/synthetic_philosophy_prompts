      *   *Symmetry Argument:* Posthumous non-existence is mirror-like to prenatal non-existence. We don't lament the time before we were born; why lament the time after?
      *   *Implication:* Fear of death is irrational.

  3.  **Deconstruct Tolstoy's *Ivan Ilyich*:**
