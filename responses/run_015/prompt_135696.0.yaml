      *   **Social Construction of Death:** The opening scene is crucial. Colleagues see a vacancy. This is a social harm, not a metaphysical one. Ivan is "dead" to society before he biologically dies.
      *   **Anticipation and Agency:** Is the harm anticipatory? Yes. The knowledge of the end ruins the middle. The loss of agency (needing help to move bowels, etc.) is the true tragedy, not the cessation of agency.
      *   **Conclusion:** What does literature add to philosophy? Phenomenology. Philosophy abstracts; literature embodies. The "truth" of Ivan's life vs. the "correctness" of his life.

