      *   **Severity 3 (Normative):** (6) allows the user to say "EUT is wrong, but I'm still rational." But if they accept (1) as a requirement of rationality, they can't say EUT is wrong *on that point*. If they keep (2) & (3), they must reject (1).

  6.  **Drafting the Response:**
      *   **Acknowledge the stakes:** Seminar setting, needs rigor.
