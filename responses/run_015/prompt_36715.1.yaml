      *   *The Conflict:* EUT *already accounts for* risk aversion via the curvature of the utility function. If you have a concave utility function (diminishing marginal utility), EUT predicts specific choices. However, *no* concave utility function can generate the specific pattern of Allais choices (2) and (3) simultaneously while adhering to Independence.
      *   *Why?* Let $u(0)=0$.
          *   Choice 1: $u(1M) > 0.89u(1M) + 0.10u(5M) + 0.01u(0)$.
