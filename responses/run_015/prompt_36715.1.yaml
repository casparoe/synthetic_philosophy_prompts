          *   Contradiction: $0.11u(1M) > 0.10u(5M)$ AND $0.10u(5M) > 0.11u(1M)$.
      *   *Conclusion:* Claim (4) is mathematically false within the framework of EUT. You cannot explain the Allais paradox *solely* with diminishing marginal utility if you keep Independence.

