      *   *Conclusion:* This derivation uses Independence on simple lotteries. It does *not* require Reduction of Compound Lotteries (5) unless you treat the 0.89/0.11 split as a first stage of a compound lottery. Since the problem is presented as simple lotteries, (5) is not required for the contradiction. (1) bites directly.
