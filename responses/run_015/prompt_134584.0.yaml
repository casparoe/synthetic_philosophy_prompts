answer: |-
  The rabbit-skin glue smells like warm hair. Like something alive that isn't anymore. I heat it in the jar until it shimmers, viscous, and the smell fills the conservation lab until I can taste it on the back of my tongue. Metallic. Sweet.

  Outside, the Seattle rain blurs the window. Inside, under the magnifying loupe, the 14th-century paper is a landscape of hills and valleys. Fiber. Lignin. Time.

  The mandala sits on the vacuum table. It was wrapped in wool when the fire took the storage room. Wool burns slow. Paper burns fast. This one did both.

  Four quadrants.

  Top left: The Blue Deity. Intact. The lapis lazuli sits on top of the paper, distinct, arrogant. It says *I am here*. Affirmation. The pigment dominates the substrate. You see the god, not the fiber.

  Top right: Char. Black crust. The fire ate the paper and the stone alike. There is a hole where the quadrant should be. You look through it to the steel mesh of the table below. Negation. *It is not.*

  Bottom left: The bleed. The heat pushed the pigment into the fibers without burning them away. The blue is inside the paper now. Swollen. It is the paper and it is the paint. Both.

  Bottom right: Faded. The outline is there, ghosted in iron gall ink, but the color is gone. Washed away by the fire hoses maybe, or just sublimated. You know the shape should be there, but it isn't. Neither.

  I mix the new ink in a shell. Ground lapis, fresh from the mortar. I add the binder. Stir with a glass rod. It turns the color of a deep sky, the same as the top left. The origional pigment.

  My hand hovers.

  There is a fifth zone. Not a quadrant. The center. The bindu.

  The fire concentrated there. The heat was so intense the mineral dust didn't just sit on the paper or burn away. It dissolved. The sizing melted. The lapis and the rag paper fused into a single purple-black stain. There is no surface tension. No distinction between what is image and what is support.

  If I paint over it, I restore the diagram. I put the god back in the center. I say that the image is more important than the history of the object. I say form is separate from emptiness.

  If I leave it, I leave a hole in the theology.

  The loupe presses into my eye socket. I blink. The stain under the lens looks like a galaxy. The fibers are dyed through to the core. The blue isn't on the paper; it *is* the paper.

  Nāgārjuna would say the cup is empty. But he means it's full of everything else. Tea, hand, mouth, thirst. The cup has no self-nature.

  This stain has no self-nature either. It's fire, paper, stone, accident. It's dependently arisen.

  I dip the brush. Size 000. Sable. The tip holds a bead of wet blue stone.

  If I fill the zone, I create separation again. I make the pigment sit *on* the paper. I create an inherent existence for the image. I lie.

  But I'm a conservator. My job is to stabilize. To make it whole. Wholeness implies boundaries.

  The hum of the HVAC kicks on. A vibration runs through the table. The dust motes dance in the light of the fiber optic lamp. They don't stay still. They collide.

  I look at the top left quadrant. The blue there is perfect. It pretends it hasn't changed in six hundred years. It pretends it's separate from the air that oxidizes it, the light that fades it. It's a lie of permanence.

  The center stain tells the truth. It admits it's just stuff waiting to change again.

  I lower the brush. The tip touches the edge of the stain.

  Capillary action pulls the wet ink into the dry fiber. A tiny bloom of new blue spreads into the old purple-black. It doesn't sit on top. It joins the mix.

  I realize I can't restore the image without destroying the reality of the damage. But I can't leave it alone either, because the paper is weak there. It needs support.

  So I mix another batch. No pigment this time. Just the glue. Clear.

  I brush the clear size over the center. It darkens the stain, makes it glow. It strengthens the fiber without adding a new form. It acknowledges the interdependence. The paper holds the stain, the stain strengthens the paper. Neither is empty of the other.

  It looks wrong. There is no god in the center. Just a dark, wet spot where the fire touched down.

  My supervisor will say I didn't finish the job. She'll say the mandala is incomplete. She'll want me to paint the deity back in, to cover the truth with a pretty lie of seperation.

  I wipe the brush on the rag. The rag turns blue. The blue comes off on my finger. Nothing stays where you put it.

  I turn off the lamp. The room goes gray. The mandala disappears into the dimness, but I know it's there. The stain is still fused. The quadrants still argue their logic. Exists. Not exists. Both. Neither.

  And the center, waiting. Not empty, but full of the lack of boundaries.

  I pack the mortar and pestle away. The smell of the glue lingers. I wash my hands. The blue stain stays under my fingernails, deep in the cuticle. I can't scrub it out. It's part of the hand now.

  I decide not to try.

  There is a typo in my logbook from yesterday. I didn't correct it. Let it stand. The record is imperfect. The object is imperfect. The view is imperfect.

  I lock the case. The glass reflects my face over the top of the mandala. My eyes align with the center zone. For a second, I can't tell where my reflection ends and the stain begins.

  Thte light flickers. Then steady.

  I leave the room. The dark zone sits in the quiet, holding the weight of the fire, holding the weight of the stone, holding nothing at all.
