      *   **The Argument:**
          1.  Difference Principle: Act objectionable only if it makes a creature worse off (or fails to respond to badness).
          2.  Counterfactual Test: Worse off = would have been better off had act not been performed (holding all else fixed).
          3.  Lumpiness: Production is batched (crates of 100). One purchase doesn't change the batch size.
          4.  Conclusion 1: No individual purchase makes a bird worse off.
          5.  Conclusion 2: No individual purchase is morally objectionable.
          6.  Generalization: Applies to voting, petrol, etc.
