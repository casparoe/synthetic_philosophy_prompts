answer: |-
  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** 24 May 2024
  **SUBJECT:** Desiderata and Feasibility of Codifying the Intended/Foreseen Distinction for Mass-Casualty Triage Protocols

  ### 1. Introduction

  The Committee is currently tasked with drafting a triage protocol for mass-casualty incidents (MCI). The ethical core of this protocol rests on a distinction familiar from the Doctrine of Double Effect (DDE): the difference between bringing about a patient's death as a *means* to saving others (impermissible) and bringing it about as a *foreseen side-effect* of saving others (potentially permissible). 

  However, we face a unique constraint. Unlike a philosophical treatise, this protocol must be operational. It will be applied by a nurse or junior doctor under extreme time pressure (approx. 90 seconds) and audited post-hoc by a reviewer who was not present. The classical DDE relies on the agent's mental state (intention), which is opaque to an auditor. 

  This paper specifies the desiderata any account of the intended/foreseen distinction must satisfy to be usable in this context. It then analyses structural collisions between these requirements to determine if a coherent protocol is possible. Finally, it scores live theoretical options against these criteria.

  ### 2. Desiderata for an Operational Distinction

  For an account of the means/side-effect distinction to function in a hospital protocol, it must satisfy the following requirements. Each is marked as **Non-Negotiable** (the protocol fails without it) or **Preference** (desirable but expendable if necessary for coherence).

  #### 2.1. Alignment with Standard Case-Pairs
  **Requirement:** The account should yield verdicts on standard philosophical test cases (Bystander at the Switch, Footbridge, Loop Track, Terror vs. Tactical Bombing, Craniotomy vs. Hysterectomy) that align with the Committee's confident intuitive verdicts.
  **Motivation:** These cases stress-test the boundary between means and side-effects. If a protocol permits the 'Footbridge' case (pushing a man to stop a trolley) while forbidding the 'Switch' case, it requires robust justification.
  **Status:** **Preference.**
  **Note on Weight:** We must be wary of reverse-engineering. An account that matches these verdicts by construction (e.g., "pushing is wrong, switching is right") is not a *principle* but a list of exceptions. Furthermore, intuitive verdicts on cases like the Footbridge may reflect visceral aversions to personal force rather than moral truth. While we should not contradict deep moral convictions, matching the literature's 'data' is secondary to clinical applicability.

  #### 2.2. Robustness to Act Description
  **Requirement:** The verdict must not change based on how the clinician's action is linguistically described. 'Redirecting a threat', 'saving five', and 'killing one' describe the same bodily movement.
  **Motivation:** The "redescription problem." If the protocol forbids 'killing one' but permits 'redirecting a threat', a clinician can game the system by describing her act the former way in her notes, or an auditor can condemn her by describing it the latter.
  **Status:** **Non-Negotiable.**
  **Note:** A protocol that returns different verdicts depending on which description the auditor happens to pick is legally and ethically indefensible. The distinction must track something invariant in the causal structure, not the semantics.

  #### 2.3. Third-Personal Codifiability and Auditability
  **Requirement:** The criteria for distinguishing means from side-effects must be observable by a third party.
  **Motivation:** The classical DDE turns on what the agent *intends*. An auditor cannot see intentions; they can only infer them from behaviour, notes, or testimony. A protocol relying on self-reported mental states is vulnerable to dishonesty and hindsight bias.
  **Status:** **Non-Negotiable.**
  **Note:** This is the primary friction point. If the distinction is essentially first-personal, it cannot be the basis of an auditable protocol.

  #### 2.4. Resistance to Laundering
  **Requirement:** The protocol must prevent a clinician from arranging her deliberations to classify a death as 'merely foreseen'.
  **Motivation:** "Intention laundering." A clinician who reads the protocol in advance could consciously adopt a mental strategy ("I will not intend his death, only accept it") to render an otherwise impermissible act permissible.
  **Status:** **Non-Negotiable.**
  **Note:** If permissibility depends on a mental state the agent can voluntarily manipulate without changing the physical outcome, the protocol fails to constrain action.

  #### 2.5. Separation of Permissibility and Blameworthiness
  **Requirement:** The account must distinguish whether an act was *allowed* from whether the agent was *praiseworthy*.
  **Motivation:** Motive cases. A clinician might perform a permissible act (e.g., withdrawing ventilation from a hopeless case to free resources) for a bad reason (personal animus). Conversely, she might perform a risky act for a good reason but fail.
  **Status:** **Preference.**
  **Note:** While philosophically vital, for the purpose of *triage protocol*, the primary goal is determining what actions are authorised. Disciplinary action for bad motives is a separate HR/legal process. However, conflating the two in the protocol creates ambiguity.

  #### 2.6. Handling Probabilistic Causation
  **Requirement:** The account must handle cases where the causal contribution of the death is uncertain (e.g., a shunt has a 1-in-3 chance of holding).
  **Motivation:** Triage is inherently probabilistic. We rarely know with certainty that sacrificing Patient A *will* save Patients B, C, and D.
  **Status:** **Non-Negotiable.**
  **Note:** A binary distinction (means vs. side-effect) often collapses when the 'means' only has a probability of working. The protocol must specify whether risk imposition counts as using the patient.

  #### 2.7. Causal Relevance (Ballast and Back-up)
  **Requirement:** The account must address cases where the death is causally necessary but functionally passive (ballast/counterweight) or where the death turns out to be causally irrelevant (back-up mechanism).
  **Motivation:** In resource allocation, a patient's body might occupy a bed needed for others (ballast). Or, a patient might be triaged out, but a back-up ventilator arrives anyway.
  **Status:** **Preference.**
  **Note:** These are edge cases, but they test whether the protocol relies on *actual* causal outcomes or *expected* causal roles.

  #### 2.8. Multi-Agent and Overdetermination
  **Requirement:** The account must handle outcomes produced jointly by two clinicians, or outcomes that would have occurred without this clinician's act.
  **Motivation:** MCIs involve teams. If Dr A starts a procedure that kills Patient X, and Dr B finishes it, who bears the responsibility? If the patient would have died anyway due to resource scarcity, does the specific act matter?
  **Status:** **Non-Negotiable.**
  **Note:** Individualised moral accounting fails in collective action. The protocol must assign responsibility at the level of the shift or team, or clearly delineate individual causal contributions.

  #### 2.9. Evidence vs. Reality (Ex Ante vs. Ex Post)
  **Requirement:** The verdict must be fixed by the agent's evidence at the time, not by how things actually turned out.
  **Motivation:** The shunt that in fact fails. If the clinician acted on reasonable evidence that the shunt would hold, she should not be penalised by bad luck.
  **Status:** **Non-Negotiable.**
  **Note:** Auditors judge records, not outcomes. A protocol that punishes based on outcome discourages necessary risk-taking in emergencies.

  #### 2.10. Generalisability Beyond Trolleys
  **Requirement:** The account must yield determinate verdicts on actual hospital cases: palliative sedation, withdrawal of treatment, allocation of scarce ventilators, use of patient data.
  **Motivation:** A theory of trolleys is useless if it cannot handle the doctrine of double effect's traditional strongholds (palliative care) alongside its new challenges (ventilator allocation).
  **Status:** **Non-Negotiable.**
  **Note:** The protocol must be usable by people who have never heard of a trolley problem. Jargon-free operationalisation is essential.

  ---

  ### 3. Structural Collisions and Impossibility Results

  Having specified the desiderata, we must now confront the structural tensions between them. It is the view of this analysis that **no coherent account satisfies all Non-Negotiable requirements.** Specifically, there are fatal collisions between the nature of the distinction we wish to codify and the administrative constraints of the hospital.

  #### 3.1. The Auditability vs. Intentionality Collision
  **Collision:** **Desideratum 2.3 (Auditability)** vs. **The Classical DDE Definition.**
  **Analysis:** The classical Doctrine of Double Effect defines the impermissible act by the agent's *intention* (aiming at evil vs. accepting evil). Intention is a first-personal mental state. Desideratum 2.3 requires third-personal observability. 
  To make intention auditable, we must infer it from external behaviour (Desideratum 2.2). However, once we infer intention from behaviour, we are no longer judging the mental state; we are judging the *act description* or the *causal structure*. 
  If we define 'intended' as 'causally necessary means', we collapse into a Counterfactual Test (see Scorecard). If we define it as 'what the agent says she intended', we violate Desideratum 2.4 (Resistance to Laundering), as the agent can simply lie or train herself to adopt the 'correct' internal narrative.
  **Verdict:** **Incompatible.** You cannot have a protocol that audits the classical DDE distinction. You can only audit a *proxy* for it.

  #### 3.2. The Fine-Grain vs. Bright-Line Collision
  **Collision:** **Desideratum 2.1 (Case-Pairs)** vs. **Desideratum 2.2 (Robustness).**
  **Analysis:** Philosophical intuitions on cases like the 'Loop Track' or 'Footbridge' often turn on extremely fine-grained distinctions in causal topology (e.g., is the victim part of the causal chain or merely an obstacle?). However, Desideratum 2.2 requires the protocol to be robust to act description. 
  In the heat of an MCI, 'removing an obstacle' and 'using a body' are descriptions of the same physical event. To satisfy the intuitive verdicts (2.1), the protocol needs fine-grained causal distinctions. To satisfy robustness (2.2), it needs broad heuristics. 
  A protocol fine-grained enough to distinguish the Loop Track from the Switch is too complex for a 90-second decision. A protocol simple enough for 90 seconds will inevitably misclassify edge cases (violating 2.1).
  **Verdict:** **Incompatible.** We must sacrifice the philosophical nuance of the case-pairs for the operational robustness required in an MCI.

  #### 3.3. The Prejudice of the Footbridge
  **Observation:** **Desideratum 2.1 (Case-Pairs)** contains a hidden prejudice.
  **Analysis:** The requirement to match the intuitive verdict on the 'Man on the Footbridge' is often treated as a neutral datum. However, this intuition may be a product of evolutionary aversion to personal violence rather than a rational ethical principle suitable for institutional policy. 
  In a hospital context, 'pushing' is metaphorical (e.g., actively withdrawing treatment vs. passively withholding). Insisting on a distinction that mirrors the Footbridge intuition may force the protocol to prohibit efficient triage actions simply because they feel like 'personal force', even if the causal structure is identical to permissible acts.
  **Verdict:** **Prejudice.** This desideratum should be downgraded to a Preference, and potentially discarded if it conflicts with clinical utility.

  #### 3.4. The Single Most Exclusionary Requirement
  **Identification:** **Desideratum 2.3 (Third-Personal Codifiability).**
  **Analysis:** This is the requirement that does the most work in excluding candidate accounts. Almost all deontological theories rely on agent-relative facts (intentions, commitments, reasons). By demanding that the protocol be auditable by someone who "was not in the room," we effectively banish the agent's interiority from the moral calculus. This forces us toward consequentialist or proceduralist accounts, as these are the only ones that rely on observable states of affairs.

  #### 3.5. Conclusion on Feasibility
  **Honest Conclusion:** A protocol of the kind we are drafting **cannot** be built on the classical intended/foreseen distinction. The distinction is metaphysically and epistemologically dependent on the agent's mind; the protocol requires dependence on observable reality. 
  **Recommendation:** We should not attempt to codify the *distinction* itself. Instead, we should codify the *procedures* that reliably track the distinction's moral value without referencing the mental state. We must replace "Do not intend death" with "Do not perform actions of Type X," where Type X is defined by observable causal roles (e.g., "Do not administer drugs with the primary physiological effect of stopping the heart," rather than "Do not intend to stop the heart").

  ---

  ### 4. Scorecard of Live Options

  Below is an evaluation of five theoretical frameworks against the Non-Negotiable desiderata (Auditability, Robustness, Laundering, Probability, Multi-agent, Evidence, Generalisability).

  #### 4.1. The Classical Four-Condition Doctrine of Double Effect
  *   **Mechanism:** An act is permissible if: (1) the act is good/neutral, (2) the bad effect is not intended, (3) the bad effect is not the means to the good, (4) the good outweighs the bad.
  *   **Performance:** Fails **Auditability** and **Resistance to Laundering**. It relies entirely on the agent's self-reporting of intention. An auditor cannot verify condition (2) or (3) without mind-reading. It also struggles with **Probabilistic Causation** (is a risk intended?).
  *   **Verdict:** **Unusable.** It provides excellent moral guidance for reflection but zero administrative utility for audit.

  #### 4.2. Counterfactual-Dependence or 'Means' Test
  *   **Mechanism:** A death is a 'means' if the good outcome would not have occurred *without* the causal contribution of that specific death (e.g., "Would the five have lived if this one had not died?").
  *   **Performance:** Strong on **Auditability** (causal chains are observable). Strong on **Robustness** (causal facts are invariant to description). However, it struggles with **Probabilistic Causation** (what if the death was only *likely* to help?) and **Overdetermination** (what if the five would have been saved anyway?). It may also yield counter-intuitive results in **Ballast** cases (is occupying a bed a causal contribution?).
  *   **Verdict:** **Viable Proxy.** This is the strongest candidate for a codifiable rule. It replaces 'intention' with 'causal necessity'. It requires clear guidelines on how to handle probability (e.g., "treat >50% causal likelihood as necessity").

  #### 4.3. Rights- or Agency-Based Reconstruction
  *   **Mechanism:** Focuses on what the agent is *doing to* the person (e.g., violating a right not to be used) rather than mental states. (e.g., Quinn's "Harmful Direct Agency").
  *   **Performance:** Good on **Generalisability** (fits palliative care well). Moderate on **Auditability** (requires judging the 'nature' of the act, which can be subjective). It handles **Motive Cases** well by separating rights violations from blame. However, it often collapses back into the **Act Description** problem (is withdrawing treatment 'killing' or 'letting die'?).
  *   **Verdict:** **High Risk.** While morally robust, it requires too much interpretive judgement from a junior doctor in 90 seconds. It is better suited for committee review than frontline triage.

  #### 4.4. Threshold or Scalar Consequentialism
  *   **Mechanism:** Abandons the distinction. Acts are permissible if they maximise survival above a certain threshold of certainty or number.
  *   **Performance:** Perfect on **Auditability** and **Probabilistic Causation**. Perfect on **Multi-Agent** cases (collective outcome matters). However, it fails **Desideratum 2.1 (Case-Pairs)** by construction (it permits the Footbridge if the numbers work). It also risks violating public trust if perceived as purely utilitarian.
  *   **Verdict:** **Operationally Superior, Ethically Controversial.** If the Committee is willing to abandon the deontological constraint for the sake of clarity and auditability, this is the only coherent option. It removes the "hypocrisy" of trying to codify DDE.

  #### 4.5. Reasons or Motives-Based Reading
  *   **Mechanism:** Permissibility depends on whether the agent acted for the 'right reason' (e.g., duty of care vs. malice).
  *   **Performance:** Fails **Auditability** catastrophically. Motives are even harder to audit than intentions. Fails **Resistance to Laundering** (agents can convince themselves they acted for duty).
  *   **Verdict:** **Unusable.** Suitable for disciplinary hearings, not for triage protocols.

  ### 5. Final Recommendation

  The Committee faces a choice between moral fidelity and operational coherence. 

  If we insist on the **Classical DDE**, we produce a protocol that looks ethically sophisticated but is legally indefensible because it cannot be audited. It invites 'laundering' and leaves junior staff vulnerable to retrospective judgement based on unknowable mental states.

  If we adopt the **Counterfactual Test**, we gain auditability but lose the nuance of the 'Footbridge' intuition. We must accept that some acts which feel like 'using' a patient may be permitted if the causal necessity is not absolute.

  If we adopt **Threshold Consequentialism**, we gain maximum clarity but abandon the deontological constraint entirely.

  **Proposed Path:** 
  I recommend we adopt a **Counterfactual-Dependence Test** framed as a **Procedural Rule**. 
  Instead of asking "Did you intend the death?", the protocol should ask: "Was this patient's death a *necessary condition* for the survival of the others, according to the best evidence available at the time?" 
  *   If **Yes**: The act is restricted (requires senior authorisation if possible, or strict criteria).
  *   If **No** (death is a side-effect of a treatment aimed elsewhere): The act is permissible under triage guidelines.

  This satisfies **Auditability** (causal necessity is reviewable), **Robustness** (causal facts don't change with description), and **Evidence** (based on clinical judgement at the time). It sacrifices the philosophical purity of the 'intention' distinction, but it provides the bright lines required for a mass-casualty protocol. We must acknowledge in the preamble that this is a *proxy* for the ethical distinction, designed for operational safety rather than metaphysical precision.

  **Action:** Draft the protocol using the Counterfactual Test, explicitly excluding reference to 'intent' or 'purpose' in the decision criteria.
