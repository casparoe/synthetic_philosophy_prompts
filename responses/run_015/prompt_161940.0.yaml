      *   **Task:** Drafting a written protocol for triage decisions in mass-casualty incidents (MCI).
      *   **Problem:** Need to codify the Doctrine of Double Effect (DDE) distinction (intended vs. foreseen/means vs. side-effect) for auditability by non-participants, applicable by junior staff under time pressure.
      *   **Specific Output:**
          1.  List of desiderata for an adequate account of the intended/foreseen distinction.
          2.  Each desideratum needs: the case/consideration motivating it, and a mark (Non-negotiable vs. Preference).
          3.  Specific topics to cover in desiderata: Standard case-pairs (trolley, footbridge, etc.), robustness to act description, third-personal codifiability/auditability, resistance to laundering, motive cases, probabilistic causation, ballast/counterweight cases, multi-agent/overdetermination, evidence vs. reality, applicability to real hospital cases (not just trolleys).
          4.  **Crucial Section:** Identify collisions/incompatibilities between requirements (especially auditability vs. first-personal character, and fine-grain vs. bright lines). Identify prejudices disguised as desiderata. Identify the single most exclusionary requirement. State if a coherent account is possible or if the protocol needs a different foundation.
          5.  **Scorecard:** Brief evaluation of 4-5 live options (Classical DDE, Counterfactual/Means test, Rights/Agency-based, Threshold Consequentialism, Reasons/Motives-based).
          6.  **Format/Style:** 5-8 page committee paper length (roughly 2000-3000 words), British English, use 'she' for the clinician.

  2.  **Deconstruct the Ethical/Philosophical Challenge:**
      *   The core tension is between *moral nuance* (DDE relies on mental states and fine-grained causal structures) and *administrative necessity* (protocols need objective, observable criteria for audit).
      *   The user suspects these are incompatible. My analysis should confirm this suspicion while providing the rigorous philosophical backing they need to justify the committee's decision.
      *   The "Non-negotiable" vs. "Preference" distinction is key. Auditability must be non-negotiable for a protocol, but matching philosophical intuitions might be a preference (or vice versa, depending on the goal). Given the context (hospital protocol), auditability and safety are non-negotiable. Philosophical purity is a preference.

  3.  **Drafting the Desiderata (Section 1):**
      *   *Standard Case-Pairs:* Need to acknowledge them but question their weight. (Preference: match intuitions, but warn against reverse-engineering).
      *   *Act Description:* The "redescription problem." (Non-negotiable: verdict shouldn't change based on semantic framing).
      *   *Auditability:* The "black box of the mind." (Non-negotiable: must be observable).
      *   *Laundering:* Strategic intention-shaping. (Non-negotiable: protocol must prevent gaming).
      *   *Motive vs. Permissibility:* Distinguishing wrong doing from wrong thinking. (Preference: keep distinct, but hard to codify).
      *   *Probabilistic Causation:* Risk vs. Certainty. (Non-negotiable: triage is inherently probabilistic).
      *   *Ballast/Irrelevance:* Causal necessity vs. causal role. (Preference: philosophical edge cases, but relevant to resource allocation).
      *   *Multi-agent:* Collective action problems. (Non-negotiable: MCIs involve teams).
      *   *Evidence vs. Reality:* Ex ante vs. Ex post. (Non-negotiable: clinicians act on evidence, auditors look at reality).
      *   *Real Hospital Cases:* Generalisability beyond trolleys. (Non-negotiable: must work for sedation/ventilators).

  4.  **Analyzing Collisions (Section 2):**
      *   *Auditability vs. Intention:* This is the big one. Intention is internal; audit is external. You can't audit a mental state without inferring it from behavior, which collapses into the "act description" problem.
      *   *Fine-Grain vs. Bright Lines:* DDE is sensitive to subtle causal pathways. Protocols need heuristics.
      *   *Prejudices:* The "Footbridge Intuition" is often treated as data, but it might just be a visceral aversion to personal force, not a moral principle suitable for policy.
      *   *The "Killer" Requirement:* Third-personal codifiability is likely the one that kills the classical DDE.
      *   *Conclusion:* A protocol *cannot* be built on the classical DDE distinction. It needs a proxy (e.g., procedural rules or consequentialist thresholds).

  5.  **Drafting the Scorecard (Section 3):**
      *   *Classical DDE:* Fails auditability.
      *   *Counterfactual/Means Test:* Better for audit, but struggles with probabilistic cases.
      *   *Rights/Agency:* Good for protecting individuals, but rigid in MCI.
      *   *Threshold Consequentialism:* Practical, but loses the deontological constraint the committee seems to want.
      *   *Reasons/Motives:* Fails auditability completely.

  6.  **Refining Tone and Style:**
      *   British English (e.g., "codifiable," "programme," "centre").
      *   Formal, committee-appropriate tone (objective, analytical, decisive).
      *   Use 'she' for the clinician.
      *   Length: Needs to feel substantial (5-8 pages worth of content density, though word count might be tighter in this format, I will aim for depth and density).

  7.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the "reverse-engineering" point? Yes, in the first desideratum.
      *   *Check:* Did I address the "laundering" point? Yes, crucial for protocols.
      *   *Check:* Is the collision section strong enough? This is the user's main interest. I need to be explicit that the classical DDE is likely unusable for *this specific purpose* (auditability).
      *   *Check:* Did I answer the "what to put in its place" question? Yes, likely a procedural/consequentialist hybrid.
      *   *Check:* Is the distinction between Non-negotiable and Preference clear? I will use bolding or explicit labels.

  8.  **Final Polish:**
      *   Ensure the transition between the desiderata and the collision analysis is smooth.
      *   Make sure the scorecard is comparative based on the criteria established earlier.
      *   Verify the "British English" constraint (e.g., "prioritisation," "defence," "programme").

  *(Self-Correction on Length)*: A true 5-8 page paper is roughly 2,500-4,000 words single-spaced. I need to ensure I don't be too concise. I will expand on the reasoning for each desideratum and the implications of the collisions.

  *(Self-Correction on Content)*: The prompt asks for "which pairs of requirements... cannot be jointly satisfied." I need to be specific. Auditability + Intentionality is the main one. Fine-grain + Bright-line is the second.

  *(Self-Correction on Prejudice)*: I should identify the "Footbridge Intuition" as a potential prejudice. It's often culturally specific or psychologically driven rather than ethically foundational for policy.

  Let's assemble the document.

  *Structure:*
  1.  Header (To, From, Subject, Date).
