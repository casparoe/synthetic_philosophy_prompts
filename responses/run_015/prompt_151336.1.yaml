      1. Diagnosis (Step 4, equivocation on 'wrong').
      2. Pricing Alternatives (Keep 1 vs Drop 1).
      3. Consistency (PVS/Newborns).
      4. The Speech.

      *Wait, looking closer at (3)*: (3) says the wrong-making feature is *exhausted* by the tendency. This is also suspect. For Kant, the wrong-making feature is the *violation of the duty to self*. The tendency to damage compassion is the *reason for the duty*, not the *definition of the wrong*. But (4) is where the consequentialism explicitly enters. I will focus on (4) as the break point, enabled by (3).

      *Actually, the strongest philosophical critique:* The argument conflates the *ground* of the duty with the *criterion* of right action. The ground is preserving moral feeling. The criterion is adherence to the law. (4) assumes the criterion is the outcome.
