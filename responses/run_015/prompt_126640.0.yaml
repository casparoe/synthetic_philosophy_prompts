answer: |-
  This is one of the sharpest pedagogical and historiographical tensions in world history, and your frustration is well-founded. You are encountering the gap between **chronology** (a neutral sequence of dates) and **periodization** (a theory about what makes time meaningful).

  To answer your core question: No, this way of carving up the past is never just a "filing convention." Periodization is always a theory of causality. When you label a chunk of time "Early Modern," you are not just filing; you are asserting that the dominant logic of that era is "modernity-in-waiting."

  Here is an analysis of what each arrangement commits you to, what it obscures, and where the underdetermined gaps lie.

  ### 1. The Euro-Derived Framework ("Europe Holds the Clock")

  When a syllabus uses "Medieval," "Early Modern," and "Industrial" as global buckets, it is committing to a specific philosophy of history, even if the lecture content tries to deny it.

  **What it presupposes:**
  *   **Homogeneous, Empty Time:** It assumes time is a universal container that moves at the same speed everywhere. It implies that 1500 in Mexico, 1500 in Beijing, and 1500 in London are equivalent moments in a shared human story.
  *   **A Single Telos:** It implies there is a "main track" of historical development (usually defined by state centralization, capitalism, or technological intensification) and that Europe happened to get there first. Everyone else is then measured by how closely they align with that track.
  *   **Synchronicity of Cause:** It suggests that the forces driving change in France (e.g., the rise of the bourgeoisie) are the same forces driving change in Ming China, even if the local details differ.

  **The Cost (What questions become hard to ask):**
  *   **The Problem of "Lag":** If the 19th century is the "Age of Industrialization," how do you teach the Ottoman Empire or Qing China? They often become stories of "failure to industrialize" or "resistance to modernity." Their internal successes are rendered invisible because they don't fit the period's defining label.
  *   **Anachronism:** Applying "Feudalism" to Japan or "Renaissance" to the Islamic Golden Age forces local phenomena into European morphological boxes. You lose the specific *logic* of the samurai or the *ulama* because you are busy checking if they fit the "Medieval" checklist.
  *   **Causal Distortion:** It makes it hard to ask, "What if the defining feature of 1200–1400 wasn't the 'Late Middle Ages' but the 'Mongol Peace'?" The Euro-label prioritizes European internal development (the decline of Christendom) over the actual dominant geopolitical reality of Eurasia (the Steppe Empires).

  **Where it is underdetermined:**
  It claims to be universal, but it is actually particular. It works well for the North Atlantic after 1800. Before that, it is a Procrustean bed. The syllabus tries to fix this by adding content (Mongols, Indian Ocean trade), but the *structure* still tells the student that these are side-quests to the main narrative of "The Rise of the West."

  ### 2. The Regional Framework ("Many Clocks")

  Your friend's suggestion—giving every region its own period names (e.g., "Edo Period," "Safavid Era," "Post-Classic Maya") and refusing to line them up on a single timeline—is the Area Studies corrective.

  **What it presupposes:**
  *   **Civilizational Solipsism:** It assumes that historical change is generated internally. The logic of Chinese history is found in the dynastic cycle, not in its relationship to global silver flows.
  *   **Incommensurability:** It suggests that time is culturally relative. A "century" might mean something different in a cyclical Mayan worldview than in a linear Christian one.
  *   **Anti-Teleology:** It refuses to judge a society by how close it got to "modernity." The Qing Dynasty is judged on Qing terms, not by whether it became Britain.

  **The Cost (What questions become hard to ask):**
  *   **The Erasure of Connection:** This is the fatal flaw for a *World* History course. If you never line up the timelines, you cannot easily teach the Black Death, the Columbian Exchange, or the Silver Trade. You lose the ability to see how a drought in the Ming Dynasty might trigger migration in Europe.
  *   **Fragmentation:** The course ceases to be a survey of "the world" and becomes five separate mini-courses taped together. Students lose the ability to compare.
  *   **Implicit Isolationism:** Paradoxically, while trying to respect agency, this model can imply that regions developed in vacuums. It smuggles in the idea that "real" history happens inside borders, and cross-border interaction is secondary.

  **Where it is underdetermined:**
  It assumes "regions" are stable containers. But regions are porous. Who decides when the "Islamic World" begins and ends? Does Spain belong in the "European" timeline or the "Islamic" timeline in 900 CE? By refusing a shared timeline, you hide the fact that these regions were often fighting over the same timeline.

  ### 3. The Third Way: Periodizing by Interaction

  There is a middle ground that many world historians (like Jerry Bentley or Sanjay Subrahmanyam) attempt, though it is hard to teach in a 101 survey. This approach periodizes by **modes of connection** rather than internal status or European benchmarks.

  Instead of "The Medieval World," you have **"The Age of Steppe Empires."**
  Instead of "Early Modern," you have **"The Age of Oceanic Connection."**
  Instead of "Industrialization," you have **"The Age of Global Energy Regimes."**

  **What this commits to:**
  *   It assumes the primary engine of history is *interaction*, not internal essence.
  *   It accepts asynchronicity. You can acknowledge that while the Atlantic is entering a capitalist phase, the Indian Ocean is operating on a different logic, but they are now entangled.

  **The Pedagogical Cost:**
  It is cognitively demanding for students. "The Age of Oceanic Connection" is harder to memorize than "1500–1750." It requires students to hold multiple temporalities in their heads at once.

  ### Advice for your Discussion Sections

  Since you cannot rewrite the syllabus mid-term, you can use this tension as a teaching tool. The confusion you feel is actually a high-level historiographical insight.

  1.  **Make Periodization the Object:** In the first week of a new unit, ask the students: *"Why do we call this 'Early Modern'? What is 'early' about it? What is 'modern'?"* Show them that the label is an argument, not a fact.
  2.  **The "Meanwhile" Exercise:** When lecturing on Europe's "Age of Revolution," explicitly ask: *"What is the label for China right now? The High Qing? If we call Europe 'Revolutionary' and China 'Stable,' what judgment are we making?"*
  3.  **Validate the Friction:** Tell your students, *"You might feel like these labels don't fit China or West Africa. That's because they were made for France. Your job is to figure out what these regions were actually doing that the label misses."*

  ### Summary

  *   **Euro-Periodization** commits you to **universalism** but risks **distortion**. It assumes a single track of history.
  *   **Regional Periodization** commits you to **particularism** but risks **fragmentation**. It assumes isolated tracks of history.
  *   **The Cost:** The Euro-model makes non-European agency look like "delay." The Regional model makes global connection look like "accident."

  Your syllabus is trying to have it both ways: using the Euro-clock for organization while preaching the Regional-agency for content. That cognitive dissonance you feel? That is the sound of World History as a discipline trying to figure out if it is one story or many. Don't smooth it over for the students; show them the crack. That's where the actual history is.
