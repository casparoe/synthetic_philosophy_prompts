answer: |-
  # Adequacy Conditions for a Theory of Biological Function

  To evaluate any account of biological function—whether etiological, causal-role, organizational, or hybrid—we must first specify the adequacy conditions the theory must satisfy. The following five desiderata constitute the complete set of demands required for a theory to be empirically robust and philosophically viable. Each desideratum is grounded in a specific empirical case or conceptual distinction.

  ### 1. The Ahistorical Applicability Constraint
  *   **Motivating Consideration (Prompt a):** Contemporary synthetic biology produces organisms with traits designed *de novo* or assembled from parts lacking a shared phylogenetic history within that lineage. A theory must be able to ascribe functions to these traits (e.g., a synthetic gene circuit designed to oscillate) despite the absence of a prior history of natural selection for that trait in that lineage.
  *   **Status:** **Non-negotiable** for contemporary adequacy. A theory that renders functional ascriptions impossible in synthetic contexts is empirically obsolete.
  *   **Trade-off Flag:** This constraint creates immediate tension with **Desideratum 3 (Normative Grounding)**. If normativity is grounded strictly in past selection, synthetic traits cannot have "proper functions," only capacities. Accommodating this constraint forces a revision of the core etiological claim that history is *necessary* for function.

  ### 2. The Historical Specificity Constraint
  *   **Motivating Consideration (Prompt b):** In cases of horizontal gene transfer (HGT) or modular exaptation, a trait's current causal contribution may diverge from the context in which it was originally selected. A theory must distinguish between a trait functioning *as* a resistance mechanism (its selected history) versus merely *contributing causally* to resistance in a new host where it was not selected for that end.
  *   **Status:** **Non-negotiable** for distinguishing function from mere capacity. Without this, any causal contribution counts as a function, collapsing the distinction between what a trait *does* and what it is *for*.
  *   **Trade-off Flag:** This conflicts with **Desideratum 1 (Ahistorical Applicability)**. Satisfying Historical Specificity privileges the etiological lineage, potentially excluding engineered systems. Satisfying Ahistorical Applicability privileges current design or role, potentially diluting the historical distinction required to handle HGT cases correctly.

  ### 3. The Naturalized Normativity Constraint
  *   **Motivating Consideration (Prompt c):** Functional ascriptions in clinical diagnostics (e.g., "the heart failed to pump") and synthetic design (e.g., "the circuit failed to oscillate") carry a normative dimension: the trait *ought* to perform a specific activity. A theory must ground this "ought" without smuggling in intelligent design or external observer intentions. The normativity must be intrinsic to the biological system or its naturalized history.
  *   **Status:** **Non-negotiable.** This is the defining feature of "proper function" as opposed to "causal role."
  *   **Trade-off Flag:** This is the primary source of tension with **Desideratum 1**. If we ground normativity in human design intentions to accommodate synthetic biology, we violate the naturalism requirement. If we ground it in natural selection, we exclude synthetic biology.

  ### 4. The Evo-Devo Sensitivity Constraint
  *   **Motivating Consideration (Prompt d):** Evolutionary-developmental biology demonstrates widespread functional redundancy, pleiotropy, and exaptation. Traits often persist without current utility (spandrels) or are co-opted for new uses. A theory must account for why a trait retains its original function despite current disuse, or acquires a new function despite lacking a specific history for the *new* role, without implying that every current utility is a function.
  *   **Status:** **Empirical Preference** (weighted heavily). While a theory might survive without perfectly modeling redundancy, it cannot contradict the dissociation of selected effects from current utility.
  *   **Trade-off Flag:** This tensions with **Desideratum 5 (Malfunction)**. If function is tied too tightly to current utility (to handle exaptation), it becomes difficult to explain malfunction in traits that are currently useless but historically selected.

  ### 5. The Normative Malfunction Constraint
  *   **Motivating Consideration (Prompt e):** A theory must explain how a trait can malfunction (e.g., a diseased heart) without collapsing into statistical abnormality (since diseases can be statistically common) or mere causal failure (a broken heart does not pump, but a stone also does not pump; only the heart *fails* to pump). The theory must distinguish between a trait that *cannot* perform and a trait that *does not* perform but retains the function.
  *   **Status:** **Non-negotiable.** This is the single hardest conceptual hurdle. If a theory cannot explain malfunction, it has not explained function.
  *   **Trade-off Flag:** This conflicts with **Causal-Role** interpretations. If function is defined by current causal contribution, a trait that does not contribute (due to damage) literally has no function at that moment. Preserving function during malfunction requires a historical or organizational standard independent of current performance.

  ***

  ### Joint Unsatisfiability Analysis

  There is a strong suspicion that **Desideratum 1 (Ahistorical Applicability)** and **Desideratum 3 (Naturalized Normativity)** are jointly unsatisfiable under a single unified definition of "function."

  *   **The Conflict:** To satisfy Naturalized Normativity, the "ought" must be grounded in a fact of the matter independent of human whim (typically, natural selection). To satisfy Ahistorical Applicability, the "ought" must be applicable to entities lacking that specific history (synthetic organisms).
  *   **The Consequence:** Accommodating engineered biological systems forces a revision of the etiological account's distinctive advantage. If we expand "selection" to include "intentional design" to cover synthetic cases, we risk anthropomorphizing nature in wild contexts. If we restrict "function" to natural selection to preserve naturalism, we render synthetic biology functionally unintelligible. A unified theory must either posit a disjunctive definition of function (natural functions vs. artifact functions) or identify a higher-order property (e.g., goal-directedness or organizational closure) that subsumes both, risking vagueness.

  ***

  ### Framework Illustration

  To illustrate the weight of these criteria, consider how the two dominant frameworks fare:

  *   **The Etiological (Selected Effects) Framework:**
      *   **Performance:** Excels at **Desideratum 3 (Normativity)** and **Desideratum 5 (Malfunction)**. It explains why a heart has a function even when broken (it was selected for pumping) and grounds the norm in natural history.
      *   **Failure:** Fails **Desideratum 1 (Ahistorical Applicability)**. It cannot ascribe proper functions to the first generation of a synthetic organism, as no selection history exists. It also struggles with **Desideratum 4 (Evo-Devo)** regarding exaptation, often requiring complex maneuvers to explain how a trait acquires a *new* function before a new selection history is established.

  *   **The Causal-Role (Cummins) Framework:**
      *   **Performance:** Excels at **Desideratum 1 (Ahistorical Applicability)** and **Desideratum 4 (Evo-Devo)**. It easily ascribes functions to synthetic parts based on their contribution to the system's capacity and handles exaptation by focusing on current utility.
      *   **Failure:** Fails **Desideratum 3 (Normativity)** and **Desideratum 5 (Malfunction)**. It struggles to distinguish function from mere causal contribution without invoking an observer's interest. Crucially, it cannot explain malfunction: if a heart fails to pump, it ceases to have the causal role of pumping; thus, on this view, the broken heart literally has no function, rather than a malfunctioning one.

  ***

  ### The Exclusionary Criterion

  The single requirement that does the most to exclude candidates is **Desideratum 5: The Normative Malfunction Constraint.**

  While the Synthetic Biology constraint (Desideratum 1) is the most pressing *empirical* challenge for traditional theories, the Malfunction Constraint is the deepest *conceptual* filter. Many theories (including simple dispositional accounts, systems-theory approaches, and naive causal-role accounts) can explain how traits contribute to capacities or how they arise historically. However, almost all candidates collapse when asked to explain how a trait can be *supposed* to do something it is *currently unable* to do, without recourse to an external observer's expectation.

  A theory that cannot distinguish between a stone (which does not pump blood) and a diseased heart (which does not pump blood but *should*) has not captured the concept of biological function. This requirement excludes any account that reduces function entirely to current causal contribution or statistical typicality, leaving only those accounts (like Etiological or Organizational) that can posit a standard of performance independent of the trait's current state.
