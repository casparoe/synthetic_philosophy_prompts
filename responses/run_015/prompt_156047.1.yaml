answer: |-
  **The Scenario**
  Two distinct sailing vessels, *The Alpha* and *The Beta*, are docked for repairs; *The Alpha* carries an outstanding maritime lien (a debt secured against the hull) that becomes payable only if *The Alpha* remains in existence until the voyage's end, while *The Beta* is debt-free scrap. During a storm, the two vessels are crushed together into a single mass of timber and rigging. Salvagers reconstruct this mass into a single seaworthy vessel, *The Gamma*, using eighty percent of *The Alpha*'s original timber and preserving *The Alpha*'s original design and name, while discarding most of *The Beta*'s material. There is no legal statute or contract clause defining "existence" for the lien; the creditor's claim rests entirely on whether *The Gamma* is numerically identical to *The Alpha*.

  **The Question**
  Is *The Gamma* numerically identical to *The Alpha*?

  **The Verdicts**
  *   **Endurantist:** **Yes.** The endurantist holds that objects are wholly present at each moment of their existence. Persistence is a matter of the same substance undergoing change. Because *The Gamma* preserves the dominant material constitution and the functional form of *The Alpha*, the *haecceity* (thisness) of *The Alpha* survives the crushing and reconstruction. The fusion with *The Beta* is merely an alteration of *The Alpha*, not its cessation.
      *   *Feature doing the work:* **Substantial Unity.** The object is a unitary bearer of properties that can survive mereological change without losing identity.
  *   **Perdurantist:** **No (strictly).** The perdurantist views *The Alpha* as a spacetime worm extending from launch to crushing. *The Gamma* is a distinct worm extending from reconstruction to scrap. Since the worms do not share temporal parts (they are sequential, not overlapping), they are not identical. To affirm identity, the perdurantist must posit a "gappy worm" (a scattered object spanning the crushing interval) or rely on a convention that selects one worm as the "continuer." Both moves violate the strict mereological summation of temporal parts or admit that identity is not literal but pragmatic.
      *   *Feature doing the work:* **Temporal Extension.** Identity is the relation between temporal parts of a single aggregate; distinct aggregates cannot be identical.

  **The Reverse Case (Fission)**
  If run backwards, one vessel (*The Gamma*) divides into two (*The Alpha* and *The Beta*). This is the standard fission case. The perdurantist has three replies:
  1.  **Overlapping Worms:** *The Alpha* and *The Beta* were distinct, overlapping worms all along, sharing early temporal parts.
      *   *Cost:* Violates ordinary counting (there were two ships, not one, before the division).
  2.  **Stage Theory:** Identity does not persist; *The Alpha*-stage and *The Beta*-stage are both *I*-related (psychologically/functionally continuous) to the *Gamma*-stage.
      *   *Cost:* Denies strict numerical identity, reducing the claim to a paraphrase of continuity relations.
  3.  **Termination:** The original worm ceases at the division; two new worms begin.
      *   *Cost:* Identity is lost entirely, making survival impossible in principle.

  **The Temporal Part Fallback**
  If the perdurantist argues that *The Alpha* is merely a temporal part of *The Gamma* (in the Fusion case), this does not vindicate the ordinary claim. The lien requires the debtor to be *identical* to the original hull, not merely an ancestor or constituent of the current hull. Saying "Alpha is part of Gamma" is logically equivalent to saying "Alpha is in the past of Gamma," which confirms that *The Alpha* no longer exists as a whole. This restates the denial of identity rather than saving it; it substitutes *continuity* for *sameness*, which fails the condition of the obligation.

  **Committed Judgement**
  The case **genuinely inverts the dialectic**, though the perdurantist escapes at the price of paraphrase. In the standard fission case, the endurantist is forced to deny survival or embrace coincidence (two things in one place), which clashes with ordinary intuition. In this fusion case, the perdurantist is forced to deny strict identity to maintain mereological consistency, which clashes with ordinary legal and moral practice that presupposes substance-based survival. The perdurantist can save the *phenomena* of the debt by paraphrasing "The Alpha exists" as "There is a Gamma-stage continuous with an Alpha-stage," but this admits that their ontology cannot support the literal truth of the ordinary claim. I side with the view that this exposes a deficit in perdurantism: it accounts for *continuity* better than *identity*, whereas ordinary obligations (like debts) require the latter. I am least confident about whether the endurantist can non-arbitrarily select *The Alpha* over *The Beta* without some tacit appeal to convention, given that both inputs are physically present in the fusion; however, the material dominance (80% timber) provides a stronger factual asymmetry for the endurantist's substantial unity than the perdurantist's worm-boundaries can accommodate.
