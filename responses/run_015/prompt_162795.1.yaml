answer: |-
  Your recollection of the numbers is close enough for structural argumentation, though the specific "4 vs. 6 departments" statistic is likely a conflation of later re-analyses. Bickel's original 1975 paper focused on the six largest departments (comprising about one-third of applicants), finding no significant bias against women in those, and a slight aggregate bias *in favor* of women when all 85 were considered. The aggregate gap (44% men vs. 35% women) is the canonical figure.

  But you are right to treat Berkeley not as a textbook illustration but as a stress test. The kidney stone example is sterile; Berkeley is messy, political, and causal. Here is the mapping and dismantling you asked for.

  ### 1. The Laundering Test: Confounder vs. Mediator

  Your hypothesis is correct: **Department is a mediator, not a confounder.**

  In the standard Simpson's Paradox setup (like the kidney stones), the stratifying variable (stone size) is a pre-existing condition that affects both the treatment choice and the success rate. It is a confounder. Adjusting for it reveals the *true* causal effect of the treatment.

  In Berkeley, the causal graph looks like this:
  $$ \text{Sex} \rightarrow \text{Department Choice} \rightarrow \text{Admission} $$
  $$ \text{Sex} \rightarrow \text{Admission} \quad (\text{Direct Discrimination}) $$

  Department Choice is downstream of Sex. Women were not randomly assigned to departments; they were socialized, advised, or self-selected into them based on their sex. By conditioning on Department, you are blocking the indirect path ($ \text{Sex} \rightarrow \text{Dept} \rightarrow \text{Admit} $).

  **The Laundering Consequence:**
  If your moral/legal question is "Did the admissions committee discriminate *at the point of review*?", then conditioning on Department is correct. You are isolating the direct effect. The committee did not discriminate; the data clears them.

  If your moral/legal question is "Is the University producing equitable outcomes?", then conditioning on Department is **moral laundering**. It allows the institution to say, "We don't discriminate; society just steers women into harder departments." The bias hasn't vanished; it has been offloaded to the pipeline (high school counseling, undergraduate culture, societal expectations).

  **Does the data support this?**
  The 1973 data *cannot* support the causal claim that Dept is a mediator. That requires external sociological data. However, the temporal ordering is clear: Application (Dept) precedes Decision (Admit). Therefore, statistically, Dept *must* be treated as a mediator or a collider, never a pure confounder. If you adjust for a mediator, you estimate the **Controlled Direct Effect**, not the **Total Effect**. The paradox disappears because you changed the estimand, not because the world changed.

  ### 2. The Agent and the Sure-Thing Principle

  You have identified the exact friction point: **Whose counterfactual are we calculating?**

  Simpson's Paradox is often presented as a violation of the Sure-Thing Principle (if $A$ is better than $B$ in every subgroup, $A$ must be better than $B$ overall). But the Sure-Thing Principle only holds if the subgroup proportions are invariant under the action.

  *   **The Applicant's View:** An applicant chooses a department. They cannot choose the university's admission rates, nor can they easily choose their own sex (in the context of the application). For an applicant asking, "Does being a woman hurt my chances *given my field*?", the departmental breakdown is the relevant causal table. The paradox resolves in their favor: being a woman is not a penalty within the department.
  *   **The University's View:** The University does not choose the applicant mix, but it is responsible for the *system*. If the University asks, "Is our institution accessible to women?", the aggregate table is the relevant outcome measure. The departmental breakdown is a defense, not a description of the outcome.

  **Does the paradox distinguish these?**
  No. The mathematics of Simpson's Paradox is agnostic to agency. It simply states:
  $$ P(\text{Admit}|\text{Male}) \neq \sum P(\text{Admit}|\text{Male}, \text{Dept}) P(\text{Dept}) $$
  It emits the conflict but does not resolve the normative question of which probability matters. It forces the analyst to declare: Are we evaluating a *decision process* (committee bias) or a *distributional outcome* (institutional equity)? The paradox shows these two evaluations can yield opposite signs. It does not tell you which evaluation is the "right" one; that is a policy decision, not a statistical one.

  ### 3. Partition Selection: The "P-Hacking" Risk

  **Can you always find a partition to flip the sign?**
  Mathematically, yes, provided you have enough degrees of freedom and small enough cell sizes. If you partition by "Day of Week" or "First Letter of Surname," you can likely manufacture a reversal or hide a bias. This is the danger of "Table 2 Fallacy"—the belief that adding more controls always gets you closer to the truth.

  **What licenses a partition?**
  The license is **causal precedence**, not statistical fit.
  *   **Valid Partition:** A variable that causally precedes the decision and is not affected by the treatment (Sex). In Berkeley, "Department" is causally prior to "Admission." It is a valid stratum for evaluating the *decision mechanism*.
  *   **Invalid Partition:** A variable that is a descendant of the decision or the treatment. If you partitioned by "Received Funding," that is downstream of Admission. Adjusting for it would induce collider bias.

  **Why Berkeley doesn't collapse into arbitrariness:**
  The Berkeley case holds up because "Department" is a *structural* feature of the university, not a post-hoc data dredge. It corresponds to real-world decision units (committees). However, your worry is valid: if an institution wanted to hide bias, they could invent sub-categories (e.g., "Special Review Pool") to dilute the signal.
  The defense against this is not statistical; it is **transparency of the DAG**. You must justify *why* you are stratifying. In Berkeley, the justification was "Decisions are made at the department level." If decisions were made at the university level, stratifying by department would be the obfuscation.

  ### 4. What Berkeley Does to Simpson's Paradox

  You argue that the episode shows the paradox is a symptom that the aggregate question was ill-posed. I would refine that: **The paradox shows that the aggregate question and the stratified question are *different* questions, and conflating them is the error.**

  **Where the paradox succeeds:**
  It predicts that a weighted average of unbiased estimators can yield a biased aggregate if the weights are correlated with the treatment. It explains the *mechanism* of the disappearance (women applied to harder departments). Without the paradox framework, one might assume the aggregate bias was real and the departmental data was noise. The paradox forces the "weights" ($P(\text{Dept}|\text{Sex})$) into the light.

  **Where the paradox is silent (and you are right to call this out):**
  1.  **The Cause of the Weights:** The paradox explains *that* women applied to harder departments, but it is silent on *why*. Is it discrimination in undergraduate advising? Cultural pressure? Rational choice based on labor market signals? The statistical tool stops at the application form.
  2.  **The Normative Resolution:** The paradox does not tell us if the University is "guilty."
      *   If guilt = Committee Bias, they are innocent (Departmental data).
      *   If guilt = Systemic Exclusion, they are complicit (Aggregate data + Pipeline).
      The paradox provides the numbers for both sides of the lawsuit but cannot write the verdict.

  **Underselling it?**
  It undersells the paradox to say it only shows the aggregate was ill-posed. The aggregate was a *valid* measure of outcome disparity. The paradox reveals that **outcome disparity $\neq$ decision bias**. This is a crucial distinction for policy. If Berkeley had only the aggregate table in 1974, they might have imposed quotas on departments (fixing the wrong problem). Because they had the stratified data, they could see the problem was recruitment, not admissions (fixing the right problem, theoretically).

  **The Prediction:**
  The paradox framework genuinely predicts that **interventions on the admissions committee will fail to close the gap.** Since the bias is in the weights ($P(\text{Dept}|\text{Sex})$) and not the conditional probabilities ($P(\text{Admit}|\text{Dept}, \text{Sex})$), changing the admissions criteria (the conditional) does nothing to the aggregate disparity. You must intervene on the application flow. This is a specific, actionable insight derived from the structure of the reversal.

  ### Summary Mapping

  | Feature | Textbook Simpson's (Kidney Stones) | Berkeley Admissions |
  | :--- | :--- | :--- |
  | **Stratifying Var** | Confounder (Stone Size) | **Mediator** (Dept Choice) |
  | **Adjustment** | Reveals True Causal Effect | **Isolates Direct Effect** (Hides Indirect) |
  | **Agency** | Doctor chooses treatment | **Applicant chooses stratum** |
  | **Moral Implication** | Don't be fooled by aggregates | **Don't confuse decision bias with systemic bias** |
  | **Resolution** | Pick the stratified table | **Pick the table matching your causal query** |

  **Final Verdict:**
  You are not smuggling in a causal story; you are correctly identifying that Simpson's Paradox is not a statistical puzzle but a **causal identification problem**. The Berkeley case proves that without a causal diagram (DAG) to license the partition, the paradox is just arithmetic ambiguity. With the DAG, it becomes a tool for distinguishing *direct discrimination* from *structural inequality*. The "bias" didn't evaporate; it moved from the admissions office to the society that fed the applicants. The paradox tells you where to look, but it cannot tell you what to do when you get there.
