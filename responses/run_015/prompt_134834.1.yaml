  | :--- | :--- | :--- | :--- |
  | Knowledge | Everyday sense is knowing facts. | Technical sense distinguishes empirical content from justification. | yes |
  | Intuition | Everyday sense is gut feeling. | Technical sense contrasts tacit experience with modal insight. | yes |
  | Experiment | Everyday sense is lab work. | Technical sense contrasts empirical intervention with conceptual manipulation. | yes |

  While intuition can mislead, thought experiments generate genuine conceptual knowledge by clarifying theoretical commitments, though their empirical claims ultimately require physical verification to be fully established.

  The sceptical conclusion survives only if "knowledge" is restricted to novel empirical data, ignoring conceptual understanding. Case B is the most damaging test because it demonstrates theory correcting intuition directly, contradicting the claim that TEs merely consult past experience. You should tell the group that thought experiments reorganize existing knowledge to reveal hidden consequences, sometimes warranting belief change without new data, but they cannot replace empirical validation for claims about the physical world.
