answer: |-
  There is no canonical classical term for this practice because Confucianism itself rejects it as a violation of *zheng ming* (rectification of names), but contemporary ethicists diagnose it as **"unilateral role absolutism."**

  This distortion occurs when the dyadic structure of the *wulun* (five relationships) is severed, treating the subordinate's obligation as a deontological absolute while reducing the superior's reciprocal duty to a discretionary option. In classical Confucian role ethics, obligations are constitutive rather than contractual; a person becomes a "father" or "ruler" only through the performance of specific virtues (*ren*, *yi*), not merely by occupying a structural position. *Xiao* (filial piety) and *zhong* (loyalty) are not standalone commands but responses within a reciprocal field governed by *shu* (reciprocity/empathy). For instance, *Analects* 4.18 suggests remonstrance (*jian*) is required in filial piety if parents are wrong, and *Mencius* 4B:3 explicitly states that if a ruler treats subjects as hands and feet, they are treated as such, but if he treats them as dogs and horses, they are treated as such, and if as dirt, they are treated as enemies. The moral weight is asymmetrical in function but symmetrical in requirement: both parties must embody virtue for the relationship to hold its normative force.

  The mechanism enabling this distortion is a failure of *zheng ming*. When a CEO or parent demands *zhong* or *xiao* without fulfilling *hui* (benevolence) or *ci* (care), they are insisting on the name ("Father," "Leader") without the reality (*shi*). Classical Confucianism would argue that by failing the reciprocal duty, the superior has already vacated the moral authority of the role, rendering the demand for subordinate loyalty incoherent. "Unilateral role absolutism" freezes the subordinate's duty in a static legalistic framework while keeping the superior's duty in a fluid consequentialist framework, effectively weaponizing role ethics to enforce hierarchy without accountability.

  To distinguish this concept clearly for your research:

  1.  **Vs. Hypocrisy:** Hypocrisy acknowledges the norm but secretly violates it; unilateral role absolutism publicly redefines the norm itself. The CEO isn't hiding his lack of care; he is arguing that care is not required for loyalty to be owed. It is a hermeneutic distortion, not merely a behavioral failure.
  2.  **Vs. Legitimate Asymmetry:** Confucian roles are inherently asymmetrical (the father leads, the son follows), but the *obligation to be virtuous* is symmetrical. Unilateral role absolutism conflates functional hierarchy with moral exemption, claiming the superior's virtue is optional while the subordinate's obedience is mandatory.
  3.  **Vs. Inability (*Ming*):** Confucianism recognizes tragedy where a superior may *fail* to be virtuous due to circumstance or incapacity (*ming*). In those cases, the subordinate may withdraw or remonstrate, but the obligation itself remains. Unilateral role absolutism claims the superior *never had the obligation* to begin with, regardless of capacity.

  In applied ethics, you can define **unilateral role absolutism** as: *The selective enforcement of dyadic role ethics wherein the subordinate's duty is treated as categorical and context-independent, while the superior's reciprocal duty is treated as hypothetical and context-dependent, thereby violating the constitutive reciprocity required by *shu* and *yi*.* This term allows you to critique the move internally without relying on external liberal individualist frameworks, grounding your objection in the tradition's own requirements for moral reciprocity and name rectification.
