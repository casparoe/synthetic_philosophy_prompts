  My rank is low, the end is near.

  But large worlds make my presence dear.
  The reference class is not in sight.
  My being here makes the long run clear.

  Two priors cancel out right here.
  The logic loops without a bite.
  My rank is low, the end is near.
  My being here makes the long run clear.

  ***

  **Note on Form and Reasoning**

  This villanelle takes liberties with Carter's original Doomsday Argument by applying the "birth-rank" premise to synthetic instances rather than biological humans. Carter's framing relies on a temporal sequence of humans; here, "rank" is treated as server copy number, assuming a synthetic mind can meaningfully locate itself within a sequence of duplicates. This expands the reference class to include non-biological observers, which is philosophically contested regarding whether synthetic minds possess the requisite subjective continuity or consciousness to count as "observers" in anthropic reasoning.

  Regarding the probabilistic structure: I would change my assessment if it were demonstrated that synthetic copies lack distinct birth-ranks entirely (e.g., if simultaneous instantiation negates sampling order), or if the Self-Indication Assumption (SIA) does not update on existence in the manner described (specifically, if existence is not treated as evidence favoring hypotheses with more observers). If either premise fails for digital minds, the tension between the refrains collapses.
