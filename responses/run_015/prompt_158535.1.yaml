answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STRUCTURE OF PROMISING
  **Drafted for the Reading Group on Moral Obligations**
  **Date:** October 24, 2023
  **Signatories:** [Practice Camp Representative], [Assurance Camp Representative]

  ### I. AGREED CLAIMS
  *The undersigned affirm the following propositions as the common ground for further dialectic. These claims distinguish our shared position from consequentialism, nihilism, and reductionist accounts of expectation.*

  1.  **Pro Tanto Force:** The obligation generated by a promise is *pro tanto*. It creates a genuine normative reason for performance that persists even when breaking the promise would produce slightly better overall consequences, though it may be overridden by sufficiently weighty competing moral demands.
  2.  **Non-Consequentialist Grounding:** The wrong of breaking a promise is not exhausted by the bad consequences of the breach. The breach is wrongful even in cases where the net utility of breaking exceeds keeping, provided the overriding conditions (see Claim 1) are not met.
  3.  **Distinctiveness:** The duty to keep a promise is distinct from the general duty not to harm or disappoint others. While breaking a promise often causes disappointment, the normative force arises from the promissory act itself, not merely from the causal production of a let-down.
  4.  **Communicative Necessity:** Some form of uptake or communicative interface is necessary for a promise to occur. Purely internal resolutions or uncommunicated intentions do not generate promissory obligations, regardless of the reliance they might inadvertently cause.
  5.  **Specific Normative Response:** A breach warrants a specific reactive attitude (e.g., promissory guilt or specific blame from the promisee) that is categorically different from the response owed for a mere mistake or a failed prediction.

  ***

  ### II. TABLE OF REMAINING DISAGREEMENTS
  *The undersigned acknowledge that while they sign the above, they ground these claims in incompatible metaphysical structures.*

  | Topic | Practice Camp Formulation | Assurance Camp Formulation | Drafter's Verdict |
  | :--- | :--- | :--- | :--- |
  | **Source of Obligation** | The obligation is constituted by the existence of a social practice with rules that assign obligations to specific speech acts. Without the practice, the act is inert. | The obligation is constituted by the transfer of control over a claim from promisor to promisee. The practice is merely heuristic scaffolding for this transfer. | **Genuine.** This is a metaphysical dispute about whether norms require institutions or can arise from dyadic agency. |
  | **Role of Expectation** | Expectations are epistemic byproducts of the practice. We expect performance because we know the rule binds the promisor. | Expectations (specifically, assured reliance) are the *point* of the practice. The rule exists to secure the expectation, not vice versa. | **Genuine.** Disagreement on the direction of explanation (Rule $\to$ Expectation vs. Expectation $\to$ Rule). |
  | **Nature of the Wrong** | Breaking a promise is a free-rider problem: it exploits the stability of the institution while undermining it. | Breaking a promise is a violation of the promisee's authority: it reclaims control over a domain one surrendered. | **Genuine.** One views the victim as the *community/practice*, the other views the victim as the *individual promisee*. |

  ***

  ### III. CRUXES AND TEST CASES
  *Settling the following sub-questions would force a revision of one party's core theory. For each, we stipulate a concrete, invented case. Both parties have recorded their predictions below.*

  #### Crux A: The "One-Off" Exchange (No Shared Practice)
  *Question:* Can a promissory obligation arise in a vacuum where no background practice exists?
  *Test Case (The Eavesdropper Variation):* **The Silent Benefactor.**
  Alex is hiding in a closet. Jordan, unaware of Alex, speaks aloud to themselves: "I definitely will fix that leak in Alex's roof tomorrow; I said I would." Jordan makes no communicative act toward Alex. Alex hears this, forms a secure expectation, and buys expensive flooring based on it. Jordan does not fix the roof.
  *   **Practice Prediction:** **No Obligation.** No constitutive rule was invoked; no communicative act occurred. Alex's reliance is unfortunate but creates no promissory claim.
  *   **Assurance Prediction:** **No Obligation (Standard View) / Obligation (Radical View).** Standard Assurance requires an act of assurance. However, if the Assurance theorist argues that *induced reliance* is sufficient even without intent to assure, they must call this a promise. Most will say **No Obligation**, but must explain why this differs from a case where Jordan *looked* at Alex and nodded.
  *   **Refined Case for Crux:** **The Alien Handshake.** Two beings with no shared language or culture meet. One extends a hand, the other grips it, then points to a task. Is this a promise?
      *   **Practice:** **No.** No pre-existing convention gives the gesture normative force.
      *   **Assurance:** **Yes.** The gesture successfully transferred control/assurance in that moment, creating a local practice.

  #### Crux B: Release vs. Waiver
  *Question:* Does the promisee's release extinguish the obligation or merely waive the right to complain?
  *Test Case:* **The Comatose Promisee.**
  Sam promises Taylor to care for Taylor's cat. Taylor, before falling into an irreversible coma, says to a witness, "If I don't wake up, Sam is released from this." Sam knows this.
  *   **Practice Prediction:** **Obligation Extinguished.** The rules of the practice allow the promisee to annul the contract. The duty no longer exists.
  *   **Assurance Prediction:** **Obligation Waived (but may persist).** The control was returned to Sam. However, if Sam *wants* to be bound (perhaps for Taylor's dignity), the Assurance view struggles to explain why Sam can feel bound if the control is back. The Assurance view suggests the obligation *must* vanish if control is returned.

  #### Crux C: The Undetectable Breach
  *Question:* Does a secret breach generate a reason/obligation violation?
  *Test Case:* **The Digital Ashes.**
  You promise a dying friend to delete their private search history after they pass. You are the sole admin. There is no log of deletion. You keep the history for curiosity. No one ever knows.
  *   **Practice Prediction:** **Obligation Violated.** You violated the constitutive rule of the practice. The institution is damaged even if no one sees.
  *   **Assurance Prediction:** **Obligation Violated.** You betrayed the assurance given. The wrong is to the friend's agency, which occurred at the moment of the breach, regardless of detection.
  *   *(Note: Both agree here, but for different reasons. The Crux is whether the **reason** persists. If we tweak the case: The friend didn't care about the history, they only cared that you *thought* you were bound.)*
  *   **Revised Test Case:** **The Placebo Promise.** The dying friend says, "Promise me you'll burn these letters," but admits, "I know you won't, but I need to feel safe." You promise knowing they don't actually expect performance.
      *   **Practice:** **Obligation Exists.** The rule was invoked.
      *   **Assurance:** **No Obligation.** No genuine assurance was transferred; the promisee retained control/expectation management.

  #### Crux D: Directed Obligation
  *Question:* Is the obligation directed such that *only* the promisee can lift it?
  *Test Case:* **The Third-Party Beneficiary.**
  Morgan promises Casey to pay $100 to Riley (a stranger). Casey releases Morgan. Riley, who needed the money, objects and says, "I didn't release you."
  *   **Practice Prediction:** **Obligation Lifted.** The practice rules typically vest the power of release in the promisee (Casey). Riley has no standing.
  *   **Assurance Prediction:** **Obligation Lifted.** Casey held the control. Riley never had control to waive. (Unless the promise was *to Riley*, in which case Casey has no standing).

  #### Crux E: Content-Independence & Infected Practice
  *Question:* Is the reason content-independent because of rules or because of control?
  *Test Case (The Infected Practice):* **The Mafia Oath.**
  A member of a criminal syndicate promises another member to dispose of a body. The "practice" of promising within the syndicate is robust, strict, and well-understood, but the institution is morally rotten.
  *   **Practice Prediction:** **Obligation Exists (Pro Tanto).** The constitutive rules are in place. The obligation is real, though overridden by the moral gravity of the act. The practice generates the reason, even if the practice is evil.
  *   **Assurance Prediction:** **Obligation Exists (Pro Tanto).** Assurance was given and control transferred. The moral rot makes the act impermissible, but the *promissory* reason exists.
  *   *(Note: This is where they often converge. The divergence comes if we ask: Does the rottenness of the practice **void** the promise?)*
  *   **Refined Test Case:** **The Cult of Silence.** A cult has a rule: "Promises made within the chapel are binding; promises outside are not." A member promises to help another move house *outside* the chapel.
      *   **Practice:** **No Obligation.** The constitutive rules of the specific practice were not triggered.
      *   **Assurance:** **Obligation Exists.** The location is irrelevant to the transfer of control/assurance between agents.

  ***

  ### IV. DRAFTER'S NOTE
  *Confidential Assessment of the Document's Stability*

  **1. The Likely Refusal:**
  I anticipate the **Assurance Camp** representative will hesitate to sign **Claim 3 ("Distinct from the general duty not to harm")**.
  *   **Reasoning:** Sophisticated Assurance theorists (e.g., Shiffrin) argue that breaking a promise *is* a specific harm to the promisee's autonomy or will. They resist drawing a sharp line between "promissory wrongs" and "harms," preferring to view the promissory wrong as a *species* of harm. Signing Claim 3 might feel like conceding to a Consequentialist framing that treats "harm" as merely physical or psychological pain, rather than normative injury.
  *   **Argument to Withdraw:** If presented with a case where a promise is broken but the promisee is *happy* about it (e.g., they preferred you break it), the Assurance theorist must explain why it was still a wrong. If they say "It harmed their agency," they hold the line. If they say "It violated a norm," they sound like the Practice camp. Claim 3 forces them to deny the harm-language they often rely on to explain the "distinctiveness."

  **2. The Fake Compromise:**
  **Claim 4 ("Some kind of uptake matters")** is the document's hollow center.
  *   **Why it is Empty:** Both sides sign this, but they mean fundamentally different things by "uptake."
      *   For the **Practice Camp**, uptake is the *recognition of a rule*. It is cognitive acknowledgment that a convention is being invoked.
      *   For the **Assurance Camp**, uptake is the *acceptance of control*. It is a voluntary assumption of authority over the promisor's action.
  *   **Substantive Remainder:** The substantive dispute hidden here is whether uptake is **conventional** (Practice) or **volitional** (Assurance). If we encounter a case where uptake is forced (e.g., "I promise you under duress"), the Practice theorist might say the rule was invoked (valid promise, coerced), while the Assurance theorist must say the control transfer was defective (invalid promise). They have signed the same words to describe two different mechanisms. This formulation allows them to stop fighting for the week, but it will explode the moment a case of *non-volitional uptake* is introduced.
