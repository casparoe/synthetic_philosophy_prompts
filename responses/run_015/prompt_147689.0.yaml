prompt: |-
  You are a professional philosopher of mind with expertise in naturalized epistemology and philosophy of biology. Before constructing your answer, briefly brainstorm the core distinction between producer-based and consumer-based teleosemantic theories, and identify the central circularity worry that arises when evolutionary proper function is invoked to ground representational content. Then argue for the following position: teleosemantic naturalism succeeds in explaining mental content only if it abandons the assumption that every representational mechanism carries a single, determinately fixed proper function assigned by selection history, and instead adopts a plural-function framework in which one mental representation can bear multiple, context-dependent proper functions that are jointly underdetermined by evolutionary history alone. In your argument, explain precisely why singular-function teleosemantics collapses into either circular normativity or radical underdetermination, show how plural-function assignment resolves this without importing non-natural norms, and answer one serious objection—such as the charge that allowing plural consumer-side functions merely relocates content-indeterminacy rather than solving it. Keep the reasoning rigorous and formal; do not cite specific texts, authors by name, or provide a bibliography.
