answer: |-
  ### Preliminary Conceptual Distinctions and the Circularity Worry

  To establish the theoretical landscape, we must first distinguish the two primary etiological approaches to teleosemantics. **Producer-based theories** locate the content of a representation in the conditions under which the mechanism *producing* that representation was selected to operate. On this view, a state represents $X$ if the mechanism emitting that state was evolutionarily designed to be triggered by $X$. The semantic norm is tied to input conditions: the representation is false if produced in the absence of $X$. Conversely, **consumer-based theories** locate content in the conditions required for the mechanism *consuming* the representation to perform its proper function. Here, a state represents $X$ if the downstream systems utilizing that state require $X$ to be the case to achieve survival or reproductive success. The semantic norm is tied to output conditions: the representation is false if the downstream action fails due to the absence of $X$.

  Both approaches rely on the notion of **evolutionary proper function**, typically defined etiology: a trait has the proper function $F$ if it was historically selected for doing $F$. The central circularity worry arises when attempting to derive normative content from this historical baseline. To specify *what* a trait was selected for, one must describe the environmental conditions that conferred fitness. However, any description of these conditions rich enough to fix semantic content (e.g., "selected for detecting *predators*") presupposes the very intentional categories (predators, food, mates) that the theory aims to naturalize. If we describe the conditions merely physically (e.g., "selected for reacting to *retinal shadows*"), we fail to capture the semantic specificity required for representation. Thus, the attempt to ground content in selection history risks circularity: one must already assume the organism represents the world in a specific way to identify the selection pressures that supposedly ground that representation.

  ### The Argument for a Plural-Function Framework

  I argue that teleosemic naturalism can succeed only by abandoning the **Singular Function Assumption**—the claim that every representational mechanism possesses a single, determinately fixed proper function assigned exclusively by selection history. Instead, we must adopt a **Plural-Function Framework**, wherein a mental representation bears multiple, context-dependent proper functions that are jointly underdetermined by evolutionary history alone. This shift is not merely an amendment but a necessary condition for avoiding the twin pitfalls of circular normativity and radical underdetermination.

  #### 1. The Collapse of Singular-Function Teleosemantics

  The Singular Function Assumption forces teleosemantics into a dilemma.

  **First, it leads to circular normativity.** If we assert that a mechanism has the single proper function of representing $X$ because it was selected for $X$, we must explain why $X$ is the relevant description of the selection pressure. Selection operates on phenotypic effects, not semantic descriptions. To privilege the description "$X$" over a co-extensive or correlated description "$Y$" requires a normative judgment about which environmental feature *mattered* for fitness. But "mattering" is itself a teleological notion. If we define the function by what the organism *ought* to represent to succeed, we presuppose a norm of success that relies on the organism already having content. We cannot derive the norm of correctness (truth conditions) from history without implicitly assuming the correctness conditions we aim to derive.

  **Second, it succumbs to radical underdetermination (the Disjunction Problem).** Evolutionary history is compatible with multiple, logically distinct semantic assignments. Consider a mechanism that fires in the presence of flies ($F$) and small black blobs ($BB$). Historically, $F$ and $BB$ may have been co-instantiated. A singular-function account must determine whether the proper function is to represent $F$ or $BB$. History alone cannot decide, as both correlations contributed equally to fitness. Insisting on a singular function forces an arbitrary choice between competing content assignments that are empirically equivalent regarding selection history. This renders the content indeterminate, violating the requirement that mental states have specific truth conditions.

  #### 2. The Resolution via Plural-Function Assignment

  The Plural-Function Framework resolves these issues by decoupling the *capacity* conferred by history from the *specific semantic valuation* assigned in operation.

  **Avoiding Non-Natural Norms:** Under this framework, evolutionary history does not assign a single semantic label. Instead, it shapes a biological mechanism with a *range of causal potentials*. The mechanism is selected for its capacity to contribute to fitness across a variety of scenarios. Consequently, the mechanism possesses a set of proper functions $\{F_1, F_2, ... F_n\}$, corresponding to the various ways it has contributed to systemic success. This is not an importation of non-natural norms; it is a recognition of biological multifunctionality. A heart pumps blood and produces sound; both are proper functions. Similarly, a neural state may function to indicate food in one context and indicate a mate in another, depending on systemic modulation.

  **Fixing Content via Context:** Content is not fixed by history alone, but by the intersection of Historical Capacity and Current Systemic Context. The "context" is not a homuncular interpreter but a causal state of the organism (e.g., hormonal levels, concurrent sensory inputs, behavioral mode).
  *   If the system is in Context $C_1$, the mechanism operates via causal pathway $P_1$, activating proper function $F_1$. The content is determined by the success conditions of $P_1$.
  *   If the system is in Context $C_2$, the mechanism operates via pathway $P_2$, activating proper function $F_2$.

  This avoids circularity because the selection of the function is not based on a normative judgment about what the organism *should* mean, but on a causal fact about which downstream pathways are currently engaged. The normativity is local to the active causal pathway, not global to the trait's history. History provides the repertoire; context selects the track. This preserves naturalism because both history and context are physicalistically describable.

  #### 3. Addressing the Objection: Relocated Indeterminacy

  A serious objection arises: **The Charge of Relocated Indeterminacy.**
  Critics may argue that allowing plural functions merely shifts the problem. If history does not determine which function is active, what determines the context? If the criteria for individuating contexts are themselves underdetermined, we have not solved indeterminacy; we have merely relocated it from the trait's history to the system's current state. Furthermore, if a representation can mean different things in different contexts, do we not lose the stability of content required for belief and reasoning?

  **Rebuttal:**
  This objection rests on the mistaken presumption that content indeterminacy is a defect rather than a feature of biological systems, and it misunderstands the metaphysical status of "context."

  1.  **Causal Determinacy of Context:** The objection assumes that identifying the "active context" requires a normative choice. It does not. The context is fixed by the total physical state of the organism and its environment at time $t$. Whether a hormonal threshold is met or whether a specific neural gate is open is a matter of causal fact, not semantic interpretation. There is no indeterminacy in whether pathway $P_1$ or $P_2$ is causally efficacious; there is only the complexity of the system. The "indeterminacy" vanishes once we acknowledge that the representation does not have a content *simpliciter*, but a content *relative to a causal mode*. This is no more problematic than a word having different meanings in different linguistic contexts; the meaning is fixed by the usage rules, which, in biology, are fixed by causal connectivity.

  2.  **Stability through Systemic Integration:** Regarding stability, the Plural-Function Framework does not imply chaotic semantic shifting. Biological systems are homeostatic. Contexts are not random; they are stable systemic states (e.g., "hunger mode," "mating mode") maintained by feedback loops. Therefore, while content is context-dependent, it is stable *within* the relevant temporal window of action. The requirement for a single, timeless content is a philosophical artifact, not a biological necessity. By accepting that content is a relation between a mechanism, its history, and its current causal role, we preserve the explanatory power of teleosemantics without forcing biological traits into a logical straitjacket they cannot fit.

  ### Conclusion

  Singular-function teleosemantics fails because it attempts to extract a specific normative 'ought' (content) from a descriptive 'is' (history) that is inherently too coarse-grained and susceptible to circular description. The Plural-Function Framework succeeds where the singular model fails by acknowledging that evolutionary history underdetermines semantic function. By treating proper functions as a context-sensitive repertoire rather than a historical decree, we ground content in the causal dynamics of the present system without abandoning the naturalistic constraint of evolutionary etiology. This approach dissolves the circularity worry by making content assignment a matter of causal pathway activation rather than historical interpretation, and it answers the indeterminacy objection by demonstrating that context is causally fixed, not normatively chosen. Thus, teleosemantic naturalism is viable only as a pluralistic, context-dependent theory of function.
