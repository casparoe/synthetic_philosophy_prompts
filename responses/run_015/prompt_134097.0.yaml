  **Verdicts:** Psychological-Continuity (Parfit) says **Survives** because Relation R (memory/character) is preserved via the pre-loaded state. Biological-Substance (Animalism) says **Dies** because the organism ceases metabolic function during each flatline, making the waker a distinct artefact.
