answer: |-
  Here is a design for the session that fits your constraints, answers your friends' objections through the mechanics of the activity rather than lecture, and manages the ninety-minute clock.

  ### Executive Summary: What to Keep and What to Cut

  **Keep both variants.** With sixteen students, you have the luxury of time. The "Near-Certainty" variant (answering the economist) and the "Sequential Staging" (answering the philosopher) are both essential to prevent the students from dismissing the result as a semantic trick or a framing error.

  **Cut the general Market Stage.** Your philosopher friend is right: a secondary market for tickets does not generate a money pump for Allais preferences. A money pump requires *dynamic inconsistency*—changing your mind after receiving information that should not change your relative valuation. A market allows students to trade based on risk aversion or liquidity, which muddies the water.
  **Replace it with a "Rescission Offer."** After the first stage of the Sequential Staging is resolved, offer students the chance to swap their ticket for the alternative they rejected in that specific sub-case. This demonstrates the pump directly without the noise of a market.

  ### The Session Plan (90 Minutes)

  **0–10 mins: Setup and Stakes**
  Display the prizes prominently: the hardback, the chocolate box, the cafeteria vouchers. Explain the currency: "Raffle Points." Every point is one entry into the raffle for these items. Emphasize that more points = higher chance of winning the book.
  Hand out a **Choice Sheet**. It has three sections. Tell them to fill them out silently. No discussion yet.

  **10–25 mins: Round 1 (Standard) & Round 2 (Near-Certainty)**
  *Section A (Standard Allais):*
  1.  **Option 1A:** 100% chance of 1,000 points.
  2.  **Option 1B:** 10% chance of 2,500 points, 89% chance of 1,000 points, 1% chance of 0.
  *Section B (Standard Allais):*
  1.  **Option 2A:** 11% chance of 1,000 points, 89% chance of 0.
  2.  **Option 2B:** 10% chance of 2,500 points, 90% chance of 0.

  *Section C (Near-Certainty Variant):*
  Repeat Section A and B, but degrade the "certain" outcomes to 99%.
  1.  **Option 1A*:** 99% chance of 1,000 points, 1% chance of 0.
  2.  **Option 1B*:** 10% chance of 2,500, 89% chance of 1,000, 1% chance of 0. (Note: The 1% zero is now shared).
  3.  **Option 2A*:** 11% chance of 1,000, 89% chance of 0.
  4.  **Option 2B*:** 10% chance of 2,500, 90% chance of 0.

  *Instruction:* "Circle one option in each pair. Do not overthink. Go with your gut."
  Collect the sheets. Do not reveal results yet.

  **25–55 mins: Round 3 (Sequential Staging)**
  This is the core activity. You need an urn (or a deck of cards) with 100 numbered tickets (1–100).
  Explain that for this round, you will actually play out the gamble for real points using the urn.
  Tell them they must commit to a pair of choices *now* (Problem 1 and Problem 2 from Section A) before any balls are drawn. Hand out **Commitment Cards**. They write down their choice for Problem 1 and Problem 2. They sign them. Collect them.

  *The Staging:*
  1.  **Stage 1:** Explain that for both problems, numbers 12–100 (89 balls) are the "Common Branch." If a ball from 12–100 is drawn, Problem 1 pays 1,000 points and Problem 2 pays 0 points regardless of their choice. The choice only matters if balls 1–11 are drawn.
  2.  **The Draw:** Draw one ball from the urn. Have a student verify the number.
      *   *Scenario X (Ball 12–100):* The "Common Branch" hits. Reveal that their choices were irrelevant for this draw. (This happens 89% of the time).
      *   *Scenario Y (Ball 1–11):* The "Decision Branch" hits. Put the ball back in a smaller urn containing only balls 1–11.
  3.  **Stage 2 (Conditional):** If Scenario Y occurs, explain: "Now the common branch is gone. You are effectively choosing between an 11/11 chance of 1,000 (in Prob 1) and a 10/11 chance of 2,500 (in Prob 2)."
  4.  **The Rescission Offer (The Pump):** Before drawing the second ball, say: "I see some of you chose the Safe option in Problem 1 and the Risky option in Problem 2. Since we are now in the Decision Branch, these two choices are effectively bets on the same 1–11 draw. If you hold that combination, I will offer you a chance to swap your Problem 1 ticket for the alternative, or vice versa, for a cost of 5 points."
      *   If they chose the Allais pattern (Safe in 1, Risky in 2), they will likely want to swap to make their preferences consistent now that the "certainty" is gone.
      *   If they pay the 5 points to swap, they have been pumped. They started with a preference, paid to change it, based on information that didn't change the relative odds of the remaining branch.
      *   If they refuse to swap, ask them to justify why their preference changed between the ex-ante sheet and the ex-post moment.

  **55–75 mins: Resolution and Tally**
  Draw the second ball if necessary. Calculate points based on their Commitment Cards (adjusted for any swaps). Record the class data from Section A and C on the board.
  *   Count how many chose the "Allais Pattern" (Safe 1, Risky 2) in Standard vs. Near-Certainty.
  *   Count how many accepted the Swap in Round 3.

  **75–90 mins: The Debrief**
  (See detailed script below).

  ### Addressing Your Friends' Objections

  **1. The Economist (Certainty Effect)**
  *The Objection:* The paradox disappears if you remove the word "certain."
  *The Activity's Answer:* Look at the data from Section C (Near-Certainty).
  *   *Expected Result:* The effect will weaken, but it will not vanish. A significant portion of the class will still show the reversal even when 100% is replaced by 99%.
  *   *Debrief Point:* "If this were just about the psychology of the word 'certain,' the reversal should disappear in Section C. It didn't. The violation persists even when certainty is removed, suggesting the issue is with how we weight probability differences (0% to 1% vs 89% to 90%), not just the endpoint."

  **2. The Philosopher (Compound Lotteries)**
  *The Objection:* You are assuming students reduce compound lotteries. If they don't, there is no violation.
  *The Activity's Answer:* Round 3 (Sequential Staging).
  *   *Expected Result:* By physically drawing the first ball, you force the reduction. The students *see* the 89% branch resolve. They are left with the simple lottery. If they still feel the pull of the Allais pattern *after* seeing the first draw, they cannot claim they were confused by compound probability.
  *   *Debrief Point:* "We didn't ask you to do the math. We did the math with the urn. You saw the common branch vanish. You were left with the exact same choice in both problems. If you wanted Safe in the first and Risky in the second, you wanted two different things from the exact same situation. That is the incoherence."

  **3. The Philosopher (Money Pump)**
  *The Objection:* A market doesn't pump Allais preferences.
  *The Activity's Answer:* You replaced the market with the **Rescission Offer**.
  *   *Why this works:* A market allows trading based on liquidity. The Rescission Offer targets *dynamic inconsistency*. You force them to confront their preference *after* the uncertainty of the common branch is resolved. If they pay to switch, they lose points (the cost). If they don't pay, they admit their ex-ante preference was unstable.
  *   *Verdict:* Your friend is right about the market, wrong about the pump being impossible. It just requires sequential resolution, not a secondary market.

  ### The Debrief: Mapping Experience to Theory

  Do not start with definitions. Start with the room's data.

  1.  **The Felt Pull:** Ask a student who chose the Allais pattern: "In Problem 1, why did you pick the safe one?" (Answer: It's guaranteed/secure). "In Problem 2, why did you pick the risky one?" (Answer: The odds are almost the same, but the payoff is much higher).
      *   *Map:* This is the *Certainty Effect* and *Probability Weighting*.
  2.  **The Incoherence:** Point to the urn. "When we drew ball 50, both choices were void. When we drew ball 5, both choices were active. In the active case, Problem 1 offered 11/11 for 1,000. Problem 2 offered 10/11 for 2,500. This is the exact same trade-off as in Problem 2, just scaled. Why did you treat them differently?"
      *   *Map:* This is the **Independence Axiom**. It says if you prefer X to Y, you should still prefer X to Y even if both are mixed with a common probability Z. In the urn, Z was the 89% chance of the common outcome. You ignored Z when it was explicit, but it influenced you when it was hidden in the description.
  3.  **vNM vs. Savage:**
      *   *Keep it simple:* "We used an urn today. That means the probabilities were objective. That is the **von Neumann–Morgenstern** setting. The axiom we broke is Independence."
      *   *The Distinction:* "Your friend might ask: what if there is no urn? What if these are beliefs about the economy? That is **Savage's** setting. The equivalent axiom is the **Sure-Thing Principle**. It says: if you would prefer A to B whether event E happens or not, you should prefer A to B even if you don't know whether E happens. The logic is identical. We used the urn to make the 'Sure Thing' visible. Don't worry about the names; worry about the structure. If you can't hold a preference constant when a common consequence is added, you are vulnerable."

  ### Predictable Problems and Mitigations

  1.  **The Spoilers:** "I read about this, I know the 'rational' answer."
      *   *Mitigation:* In the instructions, say: "If you know the paradox, I ask you to answer according to your genuine intuition, not what you think the theory wants. The point of today is to see if the theory describes *us*, not to pass a test."
      *   *Debrief:* Use them. "Sarah knows the 'rational' answer. Sarah, did you feel a pull toward the other one anyway? Good. That tension is the data."

  2.  **The Indifferent:** "I don't care about chocolate."
      *   *Mitigation:* Make the Book the top prize. Ensure the points difference is large enough that 5 points feels meaningful (e.g., Total points available = 100, Book costs 50 points to win in expectation).
      *   *Debrief:* "If you didn't care about the stakes, you weren't playing the game. But for those who did, did the stakes change your logic? Usually, they don't. The paradox holds for millions of dollars too."

  3.  **The "What Do You Want?"** "Is the safe option the right one?"
      *   *Mitigation:* Refuse to validate. "There is no right answer on the sheet. There is only a consistent answer."
      *   *Debrief:* "You are looking for me to tell you which choice is rational. I can't. Expected Utility says one thing; your intuition says another. The lesson is that you have to choose which axiom to drop, not which ticket to pick."

  4.  **The Stakes Objection:** "This is play money. Real money would fix it."
      *   *Mitigation:* Acknowledge it. "Economists used to think that too. Experiments show the effect persists even with significant stakes. It weakens, but the reversal remains."
      *   *Confidence Note:* See below.

  ### Confidence Assessment

  **High Confidence:**
  *   **Existence of Effect:** With 16 PPE students, you will get a significant modal cluster on the Allais pattern (Safe 1, Risky 2). It is robust in this demographic.
  *   **Sequential Staging:** The urn mechanic successfully closes the "compound lottery" escape route. Students understand physical draws better than probability algebra.
  *   **Market Stage:** I am highly confident the general market stage is a waste of time for this specific paradox. It introduces noise (liquidity preferences) without isolating dynamic inconsistency. The Rescission Offer is superior.

  **Medium Confidence:**
  *   **Near-Certainty Variant:** I am confident the effect will *persist* in Section C, but less confident about the *magnitude*. In some studies, shifting 100% to 99% reduces the violation rate significantly (e.g., from 60% to 30%). In others, it stays high. With PPE students, who are trained to look for the "trick," they might over-correct in Section C because they suspect the 99% is a hint. You need to frame Section C as "A different set of gambles for a different prize" to avoid them treating it as a logic puzzle correction.

  **Lowest Confidence (The Point I Am Least Sure Of):**
  *   **The Rescission Offer Uptake:** I am least sure how many students will actually pay the 5 points to swap in Round 3.
      *   *Risk:* Students might be stubborn. They might refuse to swap to avoid admitting inconsistency, even if it costs them points (sunk cost/ego). Or they might swap for free if you offer it, which shows inconsistency but doesn't "pump" them (no loss).
      *   *Mitigation:* To make the pump work, the swap must *cost* points. If they refuse to pay, the pump fails visibly. This is actually a good teaching moment ("Why won't you pay to be consistent?"), but it risks the "cost them something" requirement of your prompt.
      *   *Advice:* Make the swap free, but highlight the *opportunity cost*. "If you swap, you align with EU. If you don't, you keep your intuition. But notice: you wanted X before the draw, and Y after the draw. The world didn't change, only your description of it." This sacrifices the "money pump loss" for the "dynamic inconsistency reveal," which is philosophically cleaner for a 90-minute session. **I recommend revealing the inconsistency rather than forcing the financial loss.** The loss might feel punitive; the inconsistency feels intellectual.

  ### Final Advice on the vNM vs. Savage Distinction

  Do not draw a tree diagram comparing the two axioms. It will confuse them.
  Say this: "Independence (vNM) is about objective risks, like our urn. Sure-Thing (Savage) is about subjective beliefs, like 'Will it rain?' Today we used the urn. So we tested Independence. But the intuition is the same: If you wouldn't change your mind after seeing the common outcome, you shouldn't change your mind before seeing it. Whether the probability is in the world (vNM) or in your head (Savage), the Allais paradox suggests you treat them differently."

  This keeps the distinction honest without bogging down the session in technical formalism.
