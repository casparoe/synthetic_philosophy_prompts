          *   *Issue:* The prompt asks: "Does this variant show that the lesson... concerns what the agent can intend rather than what dispositions he must acquire...?" The student answers "No." This is a defensible position (the "impossibility of intending" objection). However, the explanation of Kavka is slightly off. Kavka isn't about "money changing hands" primarily; it's about the coherence of intention.
          *   *Mark:* Good analysis of the intention constraint, but the Kavka comparison is a bit superficial. 9/12.

      *   **Part (c):**
          *   *Claim:* "The objection... is weaker than it looks." "If it is rational to arrange to be a payer, then it is rational to pay..."
