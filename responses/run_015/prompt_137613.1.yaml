  2.  **Analyze the Question & Expected Answers:**

      *   **Part (a) [8 marks]:**
          *   *Task:* Define Direct vs. Indirect Self-Defeat (DSD vs. ISD). Define Individual vs. Collective Self-Defeat. Apply to Hitchhiker. Explain *why* it fits one category over neighbors.
          *   *Key Concepts:*
              *   DSD: Following the theory *now* leads to worse outcomes (e.g., Prisoner's Dilemma where everyone defects).
              *   ISD: Following the theory *now* requires cultivating dispositions that lead to actions the theory later condemns (e.g., cultivating a disposition to keep promises, then keeping them even when costly).
              *   Individual vs. Collective: Is it one agent failing or a group?
              *   Application: Hitchhiker is usually cited as *Indirect* Self-Defeat of Self-Interest Theory (SIT). SIT says "maximize your interest." If you follow SIT directly (don't pay), you don't get the ride. To maximize interest, you must cultivate a disposition to pay (which SIT later calls irrational).
              *   *Crucial Distinction:* Does SIT tell him to pay? No. It tells him to *be disposed* to pay.
          *   *Common Pitfalls:* Confusing DSD and ISD. Misidentifying the theory being defeated (SIT vs. Morality). Confusing Individual/Collective.

      *   **Part (b) [12 marks]:**
          *   *Task:* Analyze the "Present-Intention Driver" variant. Does this show the lesson is about *intention* rather than *disposition* (thus avoiding "rational irrationality")? Compare to Kavka's Toxin Puzzle.
          *   *Key Concepts:*
              *   Standard Hitchhiker: Driver predicts *action*. Need disposition to act against interest later.
              *   Present-Intention Variant: Driver predicts *current intention*.
              *   The Problem of Intention: Can you intend to X if you know you won't X? (Bratman/Kavka). If the hitchhiker knows he will renege in town (because it's costly), can he sincerely intend to pay now?
              *   If he *can* form the intention without the disposition to act, then he gets the ride and can renege. This solves the problem without "rational irrationality" (acting against interest later).
              *   If he *cannot* form the intention without the disposition (because intention implies belief/commitment to act), then he still needs the disposition.
              *   Kavka's Toxin: You get money for intending to drink, not drinking. Puzzle: Can you intend to do something you have no reason to do?
              *   *Expected Analysis:* The student needs to grapple with whether "sincere intention" entails a belief that one will act. If the driver detects *sincere* intention, and sincere intention requires believing you will pay, but rationality says you won't pay... can you believe you will pay?
              *   *The "Rational Irrationality" Claim:* If the variant allows intending without acting, it bypasses the need for a disposition to act irrationally. If it doesn't, the problem remains.
          *   *Common Pitfalls:* Ignoring the "sincere intention" constraint. Misunderstanding Kavka (Toxin is about intending to act, Hitchhiker is about promising to act). Claiming the variant changes nothing without explaining *why* intention is impossible.

      *   **Part (c) [10 marks]:**
          *   *Task:* Assess claim: "If it is rational to arrange to be someone who pays, then it is rational for him to pay." Refer to Gauthier's Constrained Maximization (CM) and the "self-undermining" objection.
          *   *Key Concepts:*
              *   The Claim: Deriving the rationality of the *act* from the rationality of the *disposition*.
              *   Gauthier's CM: It is rational to be a CM (dispose to cooperate). Is it rational to *perform* the cooperative act when it costs you? Gauthier says yes, because the act is part of the disposition which was rationally chosen.
              *   Self-Undermining Objection: If rationality tells you to be irrational (act against interest), isn't that incoherent?
              *   *Assessment:* This is highly contested. Many argue Gauthier fails to bridge the gap between "rational to acquire disposition" and "rational to perform act." The "self-undermining" objection suggests that if the theory tells you to ignore its own direct verdicts, it loses normative force.
              *   *Expected Analysis:* Critical assessment. Acknowledge Gauthier's move (derivation of act rationality from disposition rationality). Acknowledge the counter-argument (separation of disposition and act rationality is unstable; if it's irrational to pay *ex post*, how can it be rational *ex ante* to bind yourself to it?).
          *   *Common Pitfalls:* Uncritically accepting Gauthier. Failing to address the "self-undermining" objection specifically. Confusing Gauthier with Parfit.

  3.  **Evaluate the Student's Script:**

      *   **Part (a):**
          *   *Definitions:* "Directly self-defeating when following it makes things go worse..." (Okay). "Indirectly self-defeating when it tells the agent to bring it about that he will later act contrary to it..." (Good).
