          *   *Critique:* The definition of Direct Self-Defeat is slightly loose (usually about the theory *prescribing* acts that lead to worse outcomes than if the theory were not followed, or if everyone followed it). But for an undergrad seminar, it's passable. The application is strong.
          *   *Mark:* High. Maybe 7/8.

      *   **Part (b):**
          *   *Claim:* "The Present-Intention Driver does not really change the case, because the hitchhiker cannot form the intention..."
          *   *Reasoning:* "He knows that he will reconsider... so the most he can intend... is to pay unless he changes his mind, and no one reading his mind perfectly would count that as an intention to pay..."
          *   *Analysis:* This is a sophisticated point (related to Bratman's consistency constraints on intention). If I know I won't $\phi$, I cannot intend to $\phi$. If the driver detects *sincere* intention, she detects a belief that I will pay. If I know I'm a rational maximizer, I know I won't pay. So I can't believe I will pay. So I can't intend. So I still need the disposition.
          *   *Comparison to Kavka:* "In that puzzle the agent needs only to form the intention... in the hitchhiker case the money actually has to change hands..."
