  5.  **Reverse Analysis (Case vs. Theory):**

      *   *Confirmation:* The state acts as a tax collector for private (but public-law) entities. Neutrality is procedural, not substantive.
      *   *Anomaly (Non-members):* Do non-members sustain the apparatus? Indirectly, yes. The general tax system subsidizes the administrative cost of collection (though churches pay a fee). But more importantly, the *existence* of the exit mechanism defines the "citizen-subject" in relation to the state.
      *   *Silence:* The theory doesn't explain *why* the churches wanted this (theological/social welfare reasons) or *why* individuals leave (scandals, belief). It only explains the *structure* of the choice.
      *   *Asymmetry:* The theory needs to account for "Recognized vs. Unrecognized." Bureaucratic Confessionalism implies a closed shop. If you can't get into the bureaucracy, you can't benefit from the inertia.

