  3.  **Analyze the West German Case through the Lens:**

      *   *Constitutional Basis:* Article 140 GG + Weimar Articles 136-139, 141. This incorporates the *status quo* without theological endorsement.
      *   *Collection:* State tax offices collect for churches (8-9% of income tax). This is the "administrative machinery."
      *   *Exit:* *Kirchenaustritt* requires appearing before a judge/notary/registry, paying a fee (varies by Land), receiving a certificate. This is the "bureaucratic burden."
      *   *Actors & Payoffs:*
