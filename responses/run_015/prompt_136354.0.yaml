          *   *Member (In):* Low friction (automatic payroll deduction), Access to sacraments/social services, Social signaling.
          *   *Member (Out):* High friction (physical appearance, fee), Financial saving, Loss of sacramental access.

  4.  **Evaluate the Fit (Theory vs. Case):**

      *   *Does it explain persistence?* Yes. The "default option" is membership. Exit requires active agency. This fits "fiscal-administrative inertia."
