answer: |-
  Hi everyone, thanks for coming. I know we've got a bit of a split in the room today. On one side we have historians who know von Neumann's late work on automata inside out, and on the other, folks from the rationalist and EA spaces who mostly know him for game theory or computer architecture. That's actually perfect for what we're trying to do here.

  Usually, when we talk about institutional design for long-term risk, we talk like architects. We assume there's a blueprint, and if we draw it well enough, the building stands. But von Neumann's late writing—specifically around self-reproducing automata—suggests something messier. He wasn't just building calculators; he was looking at how systems replicate themselves. He saw that technology isn't just a tool we pick up and put down. It's more like a biological system. It survives not because we consciously choose it, but because it manages to reproduce and adapt within an environment.

  For the historians here, you know this isn't a metaphor for him, it's literally the logic of the machine. For the rest of us, the takeaway is that tech has its own reproductive fitness.

  And this is where I need to pause on the scholarship for a second. There's a consensus that von Neumann viewed complex systems as having evolutionary properties. But I want to layer something on top of that which is *my* own synthesis, not standard von Neumann interpretation.

  If technology reproduces like a biological system, then human intent doesn't sit on top of it like a driver in a car. Instead, our collective intentionality at an institutional scale is actually parasitic on the reproductive logic of the tools themselves.

  Let me be clear: von Neumann didn't write about "collective intentionality" in those terms. That's me borrowing from Searle and others and smashing it into the automata theory. But if we take the biological analogy seriously, it means our shared goals only survive if they hitch a ride on the tech's own drive to replicate. We think we're aligning institutions, but often we're just finding niches where our intentions don't get outcompeted by the tool's own logic.

  Why does this matter for this workshop? Because if I'm right about this parasitism, then "design" is constrained. We can't just decree safety protocols or governance structures and expect them to stick based on human agreement alone. If the institutional tool we're designing doesn't have its own reproductive advantage—if it doesn't adapt faster than the risks it's trying to manage—our intentionality will starve. The host dies, the parasite dies.

  So over the next few days, when we talk about designing institutions, I want us to ask a uncomfortable question. Are we designing something that humans *want*, or are we designing something that can *survive*? Because those aren't always the same thing.

  The historians might push back on reading too much sociology into the automata work, and thats fair. But for the purpose of long-term risk, treating institutions as static vessels for human will feels dangerous. We need to treat them as evolving organisms where our intent is just one variable in the fitness function.

  I'm not saying we give up on design. I'm saying we design with humility. We aren't building a clockwork mechanism we can wind up and walk away from. We're gardening in a ecosystem that's already growing wild. Our job is to prune and graft in ways that align the reproductive success of the institution with the survival of the people inside it.

  Anyway, thats the frame I want to hold in my head for the session. Let's not assume we're in control. Let's assume we're negotiating with a system that wants to live, and see if we can make sure it wants to live *with* us.

  Thanks, lets get into it.
