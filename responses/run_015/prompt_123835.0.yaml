answer: |-
  **MEMORANDUM**

  **TO:** Advisory Board, National Memorial Museum
  **FROM:** [Your Name], Advisory Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Wall Text Terminology: 1932-33 Holodomor Gallery

  ### Executive Summary

  This memo recommends adopting the primary label **"Genocide"** for the 1932-33 Holodomor section, accompanied by specific explanatory wall text that contextualizes the evolution of the term from Raphael Lemkin's original conceptualization to the 1948 UN Convention.

  While Legal Counsel's concerns regarding donor liability and consistency with the Holocaust gallery are valid, they are best mitigated through transparency rather than terminological reduction. Classifying the Holodomor as a "Crime Against Humanity" (Option 3) undermines historical scholarship and community trust. A split-label approach (Option 4) creates visitor confusion. Therefore, we should proceed with Option 2 ("Genocide" with definitional context). This approach maintains the moral weight of the term while intellectually reconciling the differences between the Lemkin and UN frameworks.

  ### Context and Stakes

  The Board must vote this Thursday on language that balances historical accuracy, legal risk, and moral clarity.
  *   **Curatorial Goal:** Accurately reflect the consensus among historians regarding Soviet intent.
  *   **Legal/Donor Concern:** Avoiding litigation risk and perceived inconsistency with the Holocaust gallery (which fits the UN standard unequivocally).
  *   **Community Concern:** Ensuring the specific destruction of Ukrainian national identity is not erased by the neutral term "famine."

  ### Analysis of Definitional Standards: Coherence vs. Convenience

  A central tension exists between the UN Convention (1948) and Lemkin's original framework (1944).
  *   **The UN Standard:** Narrower (ethnic, national, racial, religious groups). Offers legal safety but excludes political/cultural groups.
  *   **Lemkin's Framework:** Broader (includes cultural and political destruction). Captures the Holodomor's specific intent to destroy Ukrainian national cohesion but risks diluting the term's distinctiveness if applied too loosely elsewhere.

  **Is applying different standards intellectually coherent?**
  If the museum applies different standards silently, it appears politically convenient. However, if the museum explicitly *teaches* the evolution of the term, it becomes intellectually coherent. The Holocaust fits both definitions; the Holodomor fits Lemkin's definitively and the UN's debatably (depending on interpretation of "national group").

  Our mission is education, not adjudication. We can acknowledge that international law evolved *in response* to these crimes. By explaining that the legal definition narrowed after 1948, we turn a potential inconsistency into a lesson on the history of human rights law. This preserves the moral weight of "genocide" by showing how hard-won and specific the legal recognition is, without denying the historical reality of the Holodomor.

  ### Addressing Legal and Donor Concerns

  Legal Counsel's warning regarding donor lawsuits must be taken seriously. However, risk mitigation should not equate to historical sanitization.
  1.  **Liability:** The risk of a successful lawsuit based on wall text is low provided the text is qualified by historical scholarship rather than presented as a binding legal verdict.
  2.  **Consistency:** Donors concerned about the Holocaust comparison can be reassured that the Holocaust section will continue to utilize the UN standard, while the Holodomor section explains *why* the terminology differs or requires context.
  3.  **Mitigation:** The explanatory text serves as a shield. It demonstrates due diligence and nuance, making a claim of "misrepresentation" harder to sustain.

  ### Recommendation

  **Adopt Option 2: "Genocide" with Explanatory Context.**

  **Proposed Implementation:**
  1.  **Headline:** Use "The Holodomor: Genocide in Ukraine" as the section header.
  2.  **Wall Text:** Include a dedicated panel (approx. 100 words) titled "Defining Genocide."
      *   *Draft Concept:* "Raphael Lemkin coined the term 'genocide' in 1944 to describe the destruction of national, cultural, and political groups. While the 1948 UN Convention narrowed the legal definition to focus on ethnic and religious intent, historians recognize the Holodomor as a genocide under Lemkin's original framework due to the Soviet regime's specific intent to destroy Ukrainian national identity. This gallery reflects historical scholarship while acknowledging the evolution of international law."
  3.  **Holocaust Gallery:** Ensure the Holocaust gallery text briefly notes that it satisfies both Lemkin's and the UN's criteria, reinforcing that the difference lies in the *law's evolution*, not the *severity* of the crimes.

  This satisfies the Ukrainian community (intent is recognized), the Curators (accurate labeling), and Legal Counsel (risk is managed through nuance, not avoidance).

  ### Timeline for Revision and Approval

  To meet the Thursday vote and installation deadlines, I propose the following schedule:

  *   **October 24 (Friday):** Legal Counsel reviews the *specific wording* of the proposed "Defining Genocide" explanatory panel for liability exposure.
  *   **October 27 (Monday):** Curatorial team integrates legal feedback into final draft.
  *   **October 29 (Wednesday):** Draft circulated to Ukrainian Community representatives for final sign-off on tone (ensuring "erasure" concerns are met).
  *   **October 31 (Friday):** Final text locked for production.
  *   **November 15:** Installation of wall text begins.

  ### Conclusion

  Restricting our language to the UN standard protects the institution but fails the history. Using Lemkin's standard without explanation protects the history but exposes the institution. The middle path—using the term "Genocide" while educating the public on *why* that classification is complex—is the only option that fulfills our mandate as a memorial museum. It treats the definition of genocide not as a static legal label, but as a historical concept that emerged from the very violence we are memorializing.

  I urge the Board to vote in favor of this nuanced approach.

  **[Your Name]**
  Advisory Board Member
