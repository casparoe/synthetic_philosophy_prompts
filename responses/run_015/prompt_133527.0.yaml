      *   **Mechanism:** A system generates a proof of harmlessness (internal reasoning trace), then evaluates that proof using the *same* architecture with only a prompt-level role change (generator vs. evaluator). This happens *before* external audit.
      *   **Problem:** The framework treats this self-evaluative loop as a necessary filter but offers no independent, non-circular justification for its reliability.
      *   **Theoretical Constraint:** The Löbian Obstacle (Löb's Theorem). An agent cannot prove its own soundness without becoming inconsistent or trivial (deriving arbitrary conclusions).
