  I am a sixth-form student assisting with caption revisions at my school’s local-history museum, where I must decide, for each display panel, whether to present a non-human factor—such as a pathogen outbreak, a volcanic winter, or a prolonged climate shift—as an active historical agent rather than mere background conditions. I apply this decision repeatedly, with a fifteen-minute time limit per caption, and my history teacher must sign off; I have no specialist library access. I need a reusable procedural checklist, derived from the distinction between ‘trigger conditions’ (necessary but insufficient events that only become causally decisive through specific human institutional vulnerabilities) and ‘structural drivers’ (long-term environmental pressures that reshape but do not replace human choice), together with the principle that attributing agency to a non-human force requires demonstrating its embeddedness in a responsive network of human practices rather than isolated physical impact. The procedure should specify, in ordered steps, how to test whether an event meets both conditions, flag the points where subjective judgement is unavoidable—especially in assessing institutional vulnerability—and state clearly where it will misfire or remain silent. Apply it to three worked cases: the 1815 Tambora eruption and the subsequent ‘Year Without a Summer’ food riots; the arrival of bubonic plague in fourteenth-century Europe amid feudal labour structures; and the influence of the Little Ice Age on the Thirty Years’ War. Include one case where the procedure denies agency to a factor I am inclined to treat as decisive. Conclude by stating what the procedure cannot settle. Please present the bottom-line rule of thumb in the opening sentence, write in British English, and limit your response to 450 words.
