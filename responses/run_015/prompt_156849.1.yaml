  **Procedural Checklist:**
  1.  **Categorise:** Identify if the factor is a 'trigger condition' (necessary but insufficient event) or 'structural driver' (long-term pressure).
  2.  **Test Vulnerability:** Ask: Did specific human practices amplify the impact? *Judgement Flag:* Assessing institutional vulnerability is subjective; rely on documented societal collapse rather than anecdotal hardship. Without specialist access, use general histories to confirm systemic failure. Note where your interpretation might differ from your teacher's.
