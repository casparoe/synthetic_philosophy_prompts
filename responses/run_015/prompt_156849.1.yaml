  *Limitations:* This procedure misfires when political and environmental causes are indistinguishable or when human records are absent. It remains silent on moral responsibility and whether the outcome was inevitable. It cannot determine if a factor was the *primary* cause, only if it was an *active* agent.

  **Worked Cases:**
  1.  **Tambora (1815):** Trigger. Volcanic winter caused crop failure. However, British corn laws and poor relief systems transformed scarcity into riots. Agency granted: the eruption acted through market vulnerability.
  2.  **Bubonic Plague (1348):** Trigger. Pathogen arrival met feudal labour structures. Mass mortality created labour scarcity, empowering peasants to negotiate wages. Agency granted: the plague reshaped economic relations.
  3.  **Little Ice Age (Thirty Years' War):** Driver. Cooling stressed agriculture across Europe. I am inclined to treat this climate shift as decisive for the conflict. However, the procedure denies agency: war mobilisation depended on dynastic ambition and religious factionalism, not merely harvest yields. Climate remains background condition.

  **Conclusion:**
  This checklist cannot settle ontological questions regarding free will versus determinism, nor can it quantify the precise percentage of causality attributable to non-human forces when human decisions mediate every impact. It serves only to clarify explanatory focus within caption limits, ensuring non-human factors are not anthropomorphised nor rendered invisible.
