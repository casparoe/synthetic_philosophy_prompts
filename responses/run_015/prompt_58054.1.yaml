answer: |-
  First off, solidarity on the taco argument. Nothing makes political theory more volatile than cheap salsa and low blood sugar.

  Based on the scorecard you gave me, your friend is actually being surprisingly consistent, even if it feels messy. He isn't arguing about the *amount* of money (since he's okay with the neighbors spending thousands), and he isn't arguing about the *cause* (since he likes the nurses but hates the defense company).

  Here is the breakdown of his brain, the prediction on the dinner, and how to trap him.

  ### 1. What will he say about the Charity Dinner?
  **He is going to hate it.**

  Even though it's transparent (guest list published) and technically legal (no campaign money, no promises), he will view this as **pay-to-play access.**

  In his mind, the nurses buying a bus is *collective action* (many small people pooling resources to be heard). The charity dinner is *exclusive access* (rich people buying proximity that normal citizens can't afford). The fact that it's "out in the open" won't save it, because the inequality is the point.

  ### 2. What rule is he actually running on?
  **Rule A: The "Equality of Access" Principle.**
  *   **The Core:** Money is okay if it amplifies *speech* (flyers, buses, ads), but corrupt if it purchases *proximity* (meetings, dinners, jobs).
  *   **Why it fits his takes:**
      *   **Nurses/Neighbors:** Buying speech/amplification. (OK)
      *   **Developer/Revolving Door/Dark Money:** All involve buying hidden influence, access, or obligations. (Corrupt)
      *   **Charity Dinner:** Buying proximity/access. (Corrupt)

  ### 3. What is the alternative rule that also fits?
  **Rule B: The "Sunlight" Principle.**
  *   **The Core:** Corruption is purely about *secrecy*. If the source of the money and the nature of the transaction are fully disclosed to the public, it is acceptable democracy. If it is hidden, disguised, or routed through shells, it is corrupt.
  *   **Why it fits his takes:**
      *   **Nurses/Neighbors:** Everyone knows who they are and what they want. (OK)
      *   **Developer:** Hidden behind LLCs. (Corrupt)
      *   **Revolving Door:** Disguised as "consulting." (Corrupt)
      *   **Dark Money:** Nonprofit hiding the Oil Co. (Corrupt)
      *   **Charity Dinner:** Guest list published, charity is known, no secret promises. (OK)

  *See the split?* Rule A hates the dinner (inequality). Rule B accepts the dinner (transparency).

  ### 4. The Trap Hypothetical
  To figure out which rule he actually believes, you need to present a scenario where **Transparency is High** but **Equality is Low**.

  **Ask him this:**
  > "Okay, imagine a billionaire writes a check for $10 million to a SuperPAC supporting a candidate. It is 100% legal, the billionaire's name is on every single ad saying 'Paid for by [Billionaire's Name],' and the billionaire never meets with the candidate or asks for anything specific. It's totally transparent, but it completely drowns out the nurses' message."

  **How to interpret his answer:**
  *   **If he says "That's corrupt":** He is running on **Rule A (Equality of Access).** He believes money shouldn't distort the volume of speech, even if we know who paid. *Next move: Ask him if he supports strict donation caps for everyone, not just loopholes.*
  *   **If he says "That's fine, at least we know who paid":** He is running on **Rule B (Sunlight).** He believes disclosure solves corruption. *Next move: Ask him why he hated the Developer LLCs. If the Developer had just put his real name on the donation, would your friend have been okay with it?*

  **Pro tip:** If he gets annoyed, remind him you're just trying to figure out if you need to order more tacos to fuel the revolution or if you can go home. Good luck.
