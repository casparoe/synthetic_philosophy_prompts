answer: |-
  ### Preliminary Scoping: Candidate Procedures

  Before settling on the final instrument, I considered three architectures for this decision protocol.

  **1. The Payoff Matrix Audit.**
  This procedure requires analysts to construct a simplified $2 \times 2$ game for the primary actors, estimating utilities for cooperation versus defection.
  *Loss:* It demands quantitative data your analysts do not have (one day per proposal) and creates a false sense of precision; trustees without economics backgrounds will either glaze over or be misled by the numbers.

  **2. The Institutional Resilience Scorecard.**
  This focuses on the governance of the proposed body: voting rights, funding stability, and legal standing.
  *Loss:* It risks funding "zombie institutions" that are well-governed but solve nothing; a perfectly run committee can still preside over a failed coordination equilibrium if the underlying incentives remain misaligned.

  **3. The Coordination Viability Protocol (CVP).**
  A hybrid approach that treats the proposal as a mechanism design problem. It asks qualitative questions about incentives, leakage, and enforcement credibility, forcing binary decisions where possible.
  *Loss:* It cannot eliminate judgement calls, but it isolates them so trustees know where they are taking a risk.

  **Recommendation:** I recommend the **Coordination Viability Protocol (CVP)**. It fits your time constraints, respects the trustees' cognitive load, and directly addresses the six distinctions you specified without requiring complex modelling.

  ***

  ### The Coordination Viability Protocol (CVP)

  **Analyst Data Protocol:**
  *   **Missing Numbers:** If a quantitative value (e.g., market share, detection time) is unavailable, assume the *worst plausible case* consistent with the proposer's narrative. If this worst case triggers a STOP gate, mark the proposal as **'Data Gap – High Risk'**. Do not average; stress-test.
  *   **Time Limit:** This procedure must be completed in 15 minutes. If you exceed this, you are over-analysing. Mark the uncertainty and proceed.

  #### Phase 1: Diagnosis (The Nature of the Race)

  **1. Structural vs. Actor-Specific**
  Is the bad outcome driven by a Prisoner's Dilemma (everyone prefers mutual restraint but defects individually) or by a handful of bad actors?
  *   **Sufficient Answer:** Evidence that at least 3 independent actors would defect even if others cooperated.
  *   **Gate:** If the problem is caused by <3 identifiable actors who could be sanctioned directly, **STOP**. Fund a sanctioning mechanism, not a coordination scheme.
  *   **[JUDGEMENT CALL]:** Distinguishing between a "bad apple" and a "rotten barrel" is often subjective.

  **2. Value of the Good**
  What is being competed away?
  *   **A:** A good the racers value (e.g., profit margin).
  *   **B:** A good only outsiders value (e.g., public safety).
  *   **C:** A good nobody values (e.g., status signalling).
  *   **Implication:** If **B**, the arrangement requires external enforcement or subsidy. If **A**, it may be self-enforcing.
  *   **[JUDGEMENT CALL]:** Racers often claim a good is Type B to gain sympathy, when it is Type A.

  #### Phase 2: Mechanics (Will It Hold?)

  **3. The Entrant Margin**
  If existing signatories restrain themselves, does a new actor (who never signed) gain a dominant advantage by entering and defecting?
  *   **Sufficient Answer:** Proposal must identify the most likely entrant and explain why their payoff for defection is $\le$ payoff for cooperation.
  *   **Gate:** If a non-signatory entrant can capture >10% market share by ignoring the standard, **STOP** (unless the proposal includes a barrier to entry).

  **4. Detection Latency**
  Compare the time to gain benefits from defection ($T_{gain}$) vs. the time to verify defection ($T_{verify}$).
  *   **Sufficient Answer:** $T_{verify} < T_{gain}$.
  *   **Gate:** If $T_{verify} > T_{gain}$, **STOP**. By the time you catch them, they have already won the race.
  *   **[JUDGEMENT CALL]:** Estimating verification time is often optimistic in proposals.

  **5. Axis Relocation**
  Suppressing a race on Dimension X usually moves it to Dimension Y.
  *   **Sufficient Answer:** Proposal must name the expected Dimension Y (e.g., jurisdictional arbitrage, metric redefinition) and argue why competition there is less destructive.
  *   **Gate:** If the proposal claims "competition will cease entirely", **STOP**. This is theoretically impossible.
  *   **[JUDGEMENT CALL]:** Assessing whether Dimension Y is "less destructive" is a value judgement.

  #### Phase 3: Dynamics (Failure & Enforcement)

  **6. Asymmetry & Graceful Failure**
  If the arrangement partially fails (e.g., one signer defects), does it degrade gracefully or catastrophically? Who bears the residual risk?
  *   **Sufficient Answer:** Identification of the "breakpoint" (how many defectors kill the scheme) and confirmation that non-signatories do not bear catastrophic tail risk.
  *   **Gate:** If failure imposes catastrophic risk on non-consenting third parties, **HAND TO TRUSTEES**. This is a value decision, not a technical one.

  **7. Recursive Enforcement**
  Who enforces the arrangement? Are *they* subject to a race?
  *   **Sufficient Answer:** If enforcers are funded by the racers, is there a firewall? If enforcers are a separate body, what stops *them* from racing (e.g., for relevance, budget)?
  *   **Gate:** If enforcers are funded directly by the racers with no audit of the auditors, **HAND TO TRUSTEES**. This is a conflict of interest risk.

  ***

  ### Application of the CVP to Three Proposals

  Below is the working for the three scenarios you provided. I have applied the protocol strictly.

  #### Proposal 1: Frontier AI Compute Pledge
  *Nine developers pledge not to train above a threshold until evaluations exist. Evaluators funded by developers.*

  *   **1. Structural:** **Pass.** Incentives to race for capability are structural among top labs.
  *   **2. Value of Good:** **Mixed.** Safety is Type B (outsiders), but capability is Type A (racers). Racers value capability more.
  *   **3. Entrant Margin:** **FAIL.** Open-source weights or state-backed actors (non-signatories) can likely breach the threshold without the same cost base. The proposal admits "most but not all" credible actors are signed.
      *   *Result:* A non-signatory gaining a capability lead renders the signatories' restraint self-defeating.
  *   **4. Detection Latency:** **FAIL.** $T_{gain}$ (model training) is months. $T_{verify}$ (audit of compute clusters) is often weeks/months and easily obscured via cloud arbitrage.
  *   **5. Axis Relocation:** **Unanswered.** Proposal does not state where the race moves. Likely to efficiency (algorithmic optimisation) or jurisdiction (moving training abroad).
  *   **6. Asymmetry:** **High Risk.** If one defects, the others lose strategic position. Catastrophic for signatories' market position.
  *   **7. Recursive Enforcement:** **FAIL.** Evaluators funded by developers. This is the fox guarding the henhouse.
  *   **Verdict:** **STOP.**
  *   **Reasoning:** Fails on Entrant Margin, Detection Latency, and Recursive Enforcement. The incentives for defection remain dominant for both signatories (fear of being overtaken) and non-signatories (opportunity to leapfrog).

  #### Proposal 2: Subcontracting Audit Standard
  *15 small/mid firms adopt safety audit. 4 largest buyers (60% market) decline to sign. Costs on signatories.*

  *   **1. Structural:** **Pass.** Price competition drives safety corners.
  *   **2. Value of Good:** **Type B.** Safety is valued by the public/end-users, not the racers (who value margin).
  *   **3. Entrant Margin:** **FAIL.** New firms can enter undercutting on price by ignoring the standard.
  *   **4. Detection Latency:** **PASS.** Audits are periodic, but safety failures often show up quickly (accidents). However, *compliance* auditing is slow.
  *   **5. Axis Relocation:** **FAIL.** Race moves to "Buyer Selection". Since the 4 largest buyers (60% market) did not sign, they will likely favour cheaper, non-compliant subcontractors. The race relocates to the buying side, where there is no restraint.
  *   **6. Asymmetry:** **High Risk.** Signatories bear higher costs. If the standard doesn't command a price premium (which buyers refused), signatories go bankrupt.
  *   **7. Recursive Enforcement:** **Pass.** Third-party auditors, but...
  *   **Verdict:** **STOP.**
  *   **Reasoning:** Fails on Axis Relocation and Entrant Margin. Without the buyers, the standard is a cost burden with no market reward. The race simply shifts to the buyers choosing cheaper, non-compliant firms. You would be subsidising the bankruptcy of your grantees.

  #### Proposal 3: Norm-Building Programme
  *Two-year convening, secretariat, summit, shared vocabulary, pledge text. No monitoring, no payoff changes. Half-promised to an ally.*

  *   **1. Structural:** **FAIL.** The proposal admits "no change to anyone's payoffs". If payoffs do not change, the game remains unchanged. A race is a function of payoffs, not vocabulary.
  *   **2. Value of Good:** **Type C.** "Shared vocabulary" is often a good nobody values enough to pay for in a crisis.
  *   **3. Entrant Margin:** **N/A.** No restraint mechanism exists to bypass.
  *   **4. Detection Latency:** **N/A.** No monitoring exists.
  *   **5. Axis Relocation:** **Unanswered.** No race is being suppressed, so none can move.
  *   **6. Asymmetry:** **N/A.**
  *   **7. Recursive Enforcement:** **FAIL.** The secretariat's incentive is to perpetuate the secretariat, not solve the problem.
  *   **Verdict:** **STOP.**
  *   **Reasoning:** This is a **hard stop**. Under the CVP, this is not a coordination intervention; it is a talk shop. It fails the basic test of Phase 1: it does not alter the incentive structure. Funding this is charitable donation to your ally's overheads, not a strategic intervention to stop a race.
  *   **Trustee Note:** I know several trustees are enthusiastic. You must tell them: *"This proposal admits it changes no payoffs. Therefore, it cannot stop a race driven by payoffs. We are funding a conference, not a solution."* If they wish to fund it as relationship maintenance, they must classify it as 'Operational Overhead', not 'Strategic Grant'. Do not count it towards your impact metrics.

  ***

  ### Limitations: What the CVP Cannot Do

  You asked for bluntness on the procedure's blind spots. Here they are.

  **1. Structural Blindness to Slow Burns.**
  The CVP is designed for active races (Prisoner's Dilemmas). It is blind to 'Tragedies of the Commons' that unfold over decades, or coordination problems where the equilibrium is simply *absence* of action (e.g., nobody building a public good). It will systematically underrate interventions that build capacity for *future* coordination rather than stopping a *current* race.

  **2. The "Moonshot" Bias.**
  The protocol favours incremental, mechanistic fixes (audits, caps) over normative shifts. If a proposal aims to fundamentally change how actors *value* the good (shifting Type A to Type B through culture), the CVP will flag it as high risk because the payoff matrix is unclear. You may filter out the one intervention that actually changes the game, because it looks too vague on paper.

  **3. Procedural Paralysis.**
  The greatest risk is not that the procedure approves a bad grant, but that it becomes a shield for inaction. Analysts may use the **STOP** gates to avoid difficult conversations with allies (like Proposal 3). Trustees may use the **[JUDGEMENT CALL]** flags to abdicate responsibility.
  *Mitigation:* Require that every **STOP** decision be reviewed annually. If you stop ten proposals on "Entrant Margin" in a year, you must commission research to see if that gate is too rigid.

  **4. The False Precision of "Worst Case".**
  My instruction to assume the worst plausible case protects you from optimism bias, but it biases the fund towards cynicism. In nascent fields, the "worst case" is often a strawman. You will need a separate, smaller pot of capital for high-uncertainty exploration where this protocol is suspended, otherwise, you will only fund things that look safe on a spreadsheet but change nothing in the world.

  **Final Advice:**
  Adopt the CVP, but treat it as a sieve, not a wall. It is there to catch the obvious failures (like Proposal 3) so you can spend your trustees' limited attention on the genuinely hard trade-offs. Do not let it become the reason you fund nothing at all.
