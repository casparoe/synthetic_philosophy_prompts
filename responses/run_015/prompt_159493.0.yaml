      *   *Problem:* If I state PB first, it sounds like "Maximize Good" (Utilitarianism) or "Fix the Baby" (Medical Model).
      *   *Solution:* The Non-Identity/Selection distinction *must* come first. Without it, PB sounds like a duty to cure an existing patient (which is tautological for clinicians) or a duty to prevent a specific person from suffering (which is impossible if selecting who exists).
      *   *Sequence:*
          1.  Clinical Habit (Treatment of Existing) vs. Reproductive Choice (Selection of Possible).
          2.  The Principle (PB).
          3.  The Scope (Disease vs. Non-Disease).
          4.  The Liberal Qualifier (Private vs. State).
          5.  The Maximizing Question (Best vs. Good Enough).

