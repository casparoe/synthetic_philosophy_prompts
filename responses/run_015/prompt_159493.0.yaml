      *   **Audience Split:** Half suspect "eugenics with serial numbers filed off"; half think "obviously fine because parents choose."
      *   **Goal:** Not to explain the view to *me*, but to give *me* a plan to explain it to *them*.
      *   **Key Requirements:**
          *   Explicit dependency structure (what must come before what).
          *   Specific placement of the "selecting among possible children vs. treating existing child" distinction.
          *   Ordering of Scope Claim, Liberal Qualifier, Maximizing-vs-Enough.
          *   One central case study (with specific criteria provided by the user, which I need to evaluate and refine).
