          *   *Conflict:* One conception of good life = Stability/Quiet (choose low sensitivity). Another = Depth/Intensity/Artistic potential (choose high sensitivity).
          *   *Social Contingency:* A noisy, fast-paced world punishes sensitivity. A supportive, artistic world rewards it.
          *   *Fits User Criteria:* Fixed embryos (IVF/PGT), non-disease, socially modulated, private choice.
      *   *Refinement:* Let's make it concrete. *Gene Variant X*. Associated with high emotional reactivity.
          *   *Option A:* Variant X (High Reactivity).
          *   *Option B:* Variant Y (Low Reactivity).
          *   *Context:* Parents live in a high-stress, competitive urban environment OR a supportive, artistic community. (Actually, keep the environment fixed for the thought experiment to isolate the selection, but acknowledge the social contingency).
