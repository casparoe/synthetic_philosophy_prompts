answer: |-
  Here is the seminar plan, structured by dependency, case design, misconception mapping, and boundary setting.

  ### I. The Dependency Structure (Sequence of Concepts)

  You cannot state the Principle of Procreative Beneficence (PB) in minute one. To a clinician, "beneficence" implies a beneficiary who already exists. To a skeptic, "eugenics" implies state coercion. If you lead with the principle, the clinicians will hear "treat the patient" (tautology) and the skeptics will hear "state optimization" (menace).

  **The Required Order:**

  1.  **The Ontological Distinction (Selection vs. Treatment)**
      *   **Must appear:** First. Before the principle is named.
      *   **Why:** Clinicians operate on a *same-person* framework (Intervention $\rightarrow$ Patient benefits). PB operates on a *different-person* framework (Selection $\rightarrow$ Different person exists).
      *   **Risk if delayed:** If you state PB first ("Select the best child"), clinicians will ask "Best for whom?" If you haven't established the Non-Identity Problem (that the alternative child would not exist), they will assume you are comparing *Health vs. Disease* for the *same* child. This turns the argument into standard preventive medicine, which misses the ethical novelty and invites the "eugenics" label immediately.
      *   **Dosage:** Give them just enough to block the "treatment" reflex. Do not dive into Parfit's metaphysics. Use the "Wait, who are we helping?" interruption.

  2.  **The Principle (Procreative Beneficence)**
      *   **Prerequisites:** The Ontological Distinction must be on the table.
      *   **Statement:** "Parents have a moral reason to select the child, of the possible children they could have, who is expected to have the best life."
      *   **Why here:** Now that they know we are comparing *possible* children, the principle doesn't sound like a medical order for an existing patient.

  3.  **The Scope Claim (Disease vs. Well-Being)**
      *   **Prerequisites:** The Principle must be accepted as coherent.
      *   **Why here:** If you do this before the Principle, they will reject the scope because they think you are talking about enhancement *treatment*. Once they accept PB is about *selection*, you can argue that "best life" includes traits beyond clinical health (intelligence, temperament, memory).
      *   **Risk if delayed:** If you wait until the end, they will have spent the whole hour assuming PB is just "prevent severe genetic disease." When you finally expand the scope, it will feel like a bait-and-switch (sophistry).

  4.  **The Liberal Qualifier (Private vs. State)**
      *   **Prerequisites:** The Scope Claim must be active.
      *   **Why here:** Once you admit PB applies to non-disease traits (e.g., height, temperament), the "Eugenics" alarm bells ring. You must immediately defuse this by removing the State.
      *   **Risk if delayed:** If you wait until the Q&A, the skeptics will have spent the session mentally categorizing this as authoritarian eugenics. You cannot recover from that label once it hardens.

  5.  **The Maximizing Question (Best vs. Good Enough)**
      *   **Prerequisites:** Scope and Liberal Qualifier must be settled.
      *   **Why here:** This is the hardest pill. It requires them to accept that parents might have a reason to choose *Embryo A* over *Embryo B* even if *Embryo B* would have a "good enough" life.
      *   **Risk if delayed:** If you put this early, it sounds monstrous ("Why isn't a happy disabled child enough?"). If you put it after they understand the Non-Identity and Liberal constraints, it becomes a question of *moral reasoning*, not *policy*.

  ---

  ### II. The Central Case: "The Orchid and the Dandelion"

  Your specification for the case is mostly excellent, but you have one contradiction: **"No effect on anyone outside the family"** conflicts with **"Trait whose expected effect... runs partly through a contingent... feature of the social world."** If a trait interacts with the social world (school, workplace, public access), it inevitably affects others (teachers, employers, peers).

  **Correction:** Change the constraint to **"No *unconsented harm* or *resource burden* on anyone outside the family."** This allows the trait to be socially modulated without triggering the "public cost" objection prematurely.

  **The Case Design:**
  *   **Context:** IVF with PGT. Two embryos available.
  *   **Trait:** Genetic predisposition for **Sensory Processing Sensitivity (SPS)** (The "Orchid" allele vs. the "Dandelion" allele).
  *   **The Biology:**
      *   *Embryo A (Dandelion):* Resilient. Development is stable regardless of environment. Expected life: Solidly average, low risk of mental health struggles, low risk of exceptional achievement.
      *   *Embryo B (Orchid):* Plastic. In a neglectful/stressful environment, high risk of anxiety/withdrawal. In a highly supportive/enriching environment, significantly higher capacity for empathy, artistic depth, and moral reasoning than the Dandelion.
  *   **The Parents:** Committed to providing a high-support environment.
  *   **The Social Contingency:** The wider world is high-stress and standardized (schools, workplaces). This makes the Orchid trait risky *socially*, even if the *family* environment is perfect.
  *   **The Conflict of Goods:**
      *   *Conception 1 (Security):* A good life is stability, resilience, and fitting in. (Favors Dandelion).
      *   *Conception 2 (Depth):* A good life is emotional depth, creativity, and moral sensitivity. (Favors Orchid).
  *   **Why this works:**
      1.  **Not a Disease:** Neither allele is pathogenic in a clinical nosology.
      2.  **Environmentally Modulated:** Allows you to separate "fixing the genome" from "fixing the environment."
      3.  **Unanimously Unranked:** Clinicians cannot medically declare one "better." It forces a philosophical definition of "Best Life."
      4.  **Private:** No state involvement.

  **What to Avoid:**
  *   Do not use Deafness. It is too politically charged and too easily categorized as "disability" by clinicians.
  *   Do not use Intelligence (IQ). It invites immediate objections about measurement validity and class bias that will derail the moral philosophy.
  *   Do not make the parents uncertain about their support. Keep the parents' capacity fixed so the variable is the *trait's* value.

  ---

  ### III. The Misconception Map

  Do not wait for questions. Defuse these *proactively* at the moment they would naturally form.

  1.  **"Beneficence means beneficence to a patient."**
      *   *When:* Minute 5 (Intro).
      *   *Defusal:* Explicitly state: "In reproductive ethics, the 'patient' is not a fixed entity. We are not treating a child; we are choosing which child to bring into existence."
  2.  **"The embryo is the patient."**
      *   *When:* Minute 20 (After stating PB).
      *   *Defusal:* "We are not acting *on* the embryo to improve *it*. We are choosing *which* embryo to implant. The moral object is the future person's life, not the embryo's current state."
  3.  **"The principle is about preventing suffering; extending it to non-disease is a reductio."**
      *   *When:* Minute 40 (Scope Claim).
      *   *Defusal:* "If we agree parents should prevent suffering (disease), on what basis do we stop? If you could prevent mild depression via selection, would you? If yes, you have already left 'disease' behind and entered 'well-being'."
  4.  **"Calling it eugenics requires a state; 'Liberal' dissolves the objection."**
      *   *When:* Minute 50 (Liberal Qualifier).
      *   *Defusal:* Do not let them think "Liberal" solves it. Say: "Liberal eugenics removes the *coercion* objection, but it does not remove the *expression* objection. It is still eugenics in the literal sense (good birth), just not state eugenics."
  5.  **"The reason must be maximizing along a single scale."**
      *   *When:* Minute 60 (Applying the Case).
      *   *Defusal:* "PB does not require a single metric. It requires a reasoned judgment about 'best life.' If two lives are incommensurable (Security vs. Depth), PB asks which reason is stronger, not which number is higher."
  6.  **"The disability-rights objection is simply that discrimination is wrong."**
      *   *When:* Minute 65 (Case Discussion).
      *   *Defusal:* "The objection is not about discrimination against existing people. It is about what the selection *expresses* regarding the value of certain types of lives, and whether that expression harms social solidarity."
  7.  **"Procreative autonomy is a side-constraint that settles the matter."**
      *   *When:* Minute 80 (Conclusion).
      *   *Defusal:* "Autonomy grants the *permission* to choose, but it does not provide the *reason* for choosing. PB claims there is a moral reason *within* the sphere of autonomy. You can have the right to do the wrong thing."

  ---

  ### IV. The Final Check & Explicit Refusals

  **The Check Case (Minute 80-85):**
  *   **Variant:** Same Orchid/Dandelion case.
  *   **Twist:** The parents reveal they are currently undergoing a divorce and financial instability. They *cannot* guarantee the high-support environment the Orchid needs to thrive.
  *   **Task:** Ask the room: "Does the moral reason flip?"
  *   **Diagnostic:**
      *   If they say **Yes** (Now choose Dandelion): They understand PB is objective relative to circumstances, not just parental whim. They have located the premise (Expected Well-Being).
      *   If they say **No** (Still parents' choice): They are hiding behind Autonomy and haven't engaged with the Beneficence reason.
      *   If they say **It's wrong either way**: They are rejecting the Non-Identity framework entirely (returning to "Don't play God").

  **The Explicit Refusals (Minute 85-90):**
  You must close the session by defining the boundaries of the seminar. If you do not, the discussion will dissolve into technical or metaphysical weeds. Say this verbatim:

  > "In ninety minutes, we cannot settle three things, and I am not going to try:
  >
  > 1.  **The Metaphysics:** I am not asking you to solve the Non-Identity Problem. Whether Person A is 'harmed' by not being created is a metaphysical question. We are operating on the *moral* intuition that parents have reasons to prefer one future over another.
  > 2.  **The Technology:** I am not claiming current PGT can reliably predict Sensory Sensitivity. We are discussing the *ethics of the principle*, assuming the science works. If the science is bad, the application is reckless, but the principle might still hold.
  > 3.  **The Duty:** I am not claiming PB is a *duty* that must be enforced. I am claiming it is a *moral reason*. Whether it is a binding obligation or a supererogatory ideal is a question for your own conscience, not this seminar."

  **Why this matters:**
  *   Refusing the Metaphysics stops the "You can't compare non-existent people" objection.
  *   Refusing the Technology stops the "But polygenic scores are inaccurate" objection (which is true but irrelevant to the normative claim).
  *   Refusing the Duty/Permission distinction prevents the session from ending in a stalemate between "Mandate it" and "Ban it," leaving them with the more subtle "Consider it."
