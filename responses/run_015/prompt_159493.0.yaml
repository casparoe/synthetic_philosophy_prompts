  2.  **Deconstruct the Philosophical Core (Savulescu's Procreative Beneficence):**
      *   *Principle:* Parents have a significant moral reason to select the child, of the possible children they could have, who is expected to have the best life, or at least as good a life as the others, based on the relevant, available information.
      *   *Key Tension:* Non-Identity Problem (selecting *who* exists vs. harming *someone* who exists).
      *   *Key Tension:* Medical Model (treatment) vs. Enhancement/Selection (design).
      *   *Key Tension:* Private Choice (Liberal) vs. State Coercion (Authoritarian).

