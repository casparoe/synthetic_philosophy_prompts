answer: |-
  Subject: Re: Late night Euthyphro spiral

  I know exactly that feeling where the argument feels airtight at 3 AM but smells like trouble in the morning light, and you have done a remarkably clear job of reconstructing the chain. You are right to be worried about Step 7, because when an argument concludes that logic and epistemic justification are arbitrary, it has almost certainly sliced through a distinction it needed to preserve. The good news is that you do not have to sacrifice either of the things you want to keep. You can maintain that the Euthyphro objection devastates simple Divine Command Theory while leaving non-naturalist realism intact, and you can do this without embracing symmetric grounding or abandoning the asymmetry of explanation. The broken step is Step 6.

  Step 6 looked fine when you wrote it down because it relies on a very natural equivocation on the word arbitrary. In Step 1, when you dismantle Divine Command Theory, the arbitrariness objection works because of contingency. The worry is that God could have commanded otherwise, and if He had, torture would be good. The normativity hangs on a choice that might not have been made, which makes the moral status of torture feel unstable or ungrounded in the nature of things. But in Step 6, when you apply this to realism, you define arbitrariness merely as having no further explanation. You argue that because the realist stops at brute facts that cannot be explained by anything deeper, they are arbitrary in the same fatal sense. This conflates unexplained with contingent. A brute fact can be necessary. If the realist claims that suffering is bad as a brute necessary truth, then it is not arbitrary in the sense that it could have been otherwise. There is no further reason why suffering is bad, but there is also no possibility of it being good. The fatal arbitrariness in Step 1 was about the availability of alternatives, not merely the lack of a deeper ground.

  This means your first friend is correct that you have equivocated. The cost of rejecting Step 6 is accepting that some normative facts are brute and necessary. You have to commit to the view that the chain of explanation stops at facts that are themselves normative and which could not have been different. For some philosophers, this ontological commitment is the heavy price they want to avoid, which is why they prefer naturalism or error theory, but it is not the same price as accepting that morality is a matter of arbitrary decree. If you reject Step 6, you preserve the asymmetry of grounding that makes your distrust of your second friend well-founded. Symmetric grounding is a tempting way to dodge the dilemma, but it often collapses into circularity or fails to provide the direction of explanation we need to make sense of why we should care about the ground. You do not need that move if you distinguish between a ground that is contingent and a ground that is necessary.

  Regarding the generalization to epistemic normativity and logic, this is evidence against your argument, specifically against the move in Step 6, rather than a separate mess you should stay out of. If you accept that brute logical laws are arbitrary just because they are unexplained, you undermine the very reasoning you used to construct the argument. The law of non-contradiction is not arbitrary in the fatal sense even if it is brute, because it is not contingent. Recognizing this helps you see that the Euthyphro dilemma is not a universal acid that eats all normative domains, but rather a specific test for whether a theory makes normativity depend on something contingent. Divine Command Theory fails because it makes morality depend on a will that could have willed differently. Realism survives because it posits normative truths that do not depend on anything else and could not have been otherwise. You can sleep easier knowing the argument stops where it should, at the boundary between contingent volition and necessary truth, without forcing you to abandon realism or accept that logic is just a matter of arbitrary decree.
