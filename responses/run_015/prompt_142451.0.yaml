prompt: |-
  I was up way too late after a department party arguing with two friends from my metaethics seminar, and I've been turning this over ever since. I think I've built an argument that shows the Euthyphro objection eats every metaethical view there is, including the one I actually hold, and since I can't accept the conclusion I want someone to find the broken step. Here's the chain as I wrote it out afterwards: (1) The objection against divine command theory: if wrongness is constituted by God's forbidding an act, then either He forbids it because it is wrong — in which case the command isn't doing the work and wrongness is independent of and prior to it — or it is wrong simply because He forbade it, in which case the moral facts are arbitrary, since a different decree would have generated the opposite obligations, including a decree to torture children for fun, and there is nothing to say about why this decree rather than that one. (2) Nothing in that argument mentions God specifically; it only uses the form: normative property F is explained by, or constituted by, G. So run it on any other proposed ground — failing to maximize welfare, non-universalizability, being rejectable by idealized contractors, frustrating desire — and you get the same fork: either there is some further normative fact in virtue of which G matters, or there isn't. (3) If there is, G wasn't the ground; that further fact was, and the fork re-applies to it. (4) So the explanatory chain either goes on forever or it stops. (5) An infinite chain confers no normative significance, since every link only borrows from the next one, so assume it stops. (6) Whatever it stops at has no further explanation of why it matters — that's just what stopping means — and that is exactly the feature that made the second horn fatal back in (1). So on any view at all, including plain non-naturalist realism that stops at brute irreducibly normative facts like suffering being bad, the normative facts are arbitrary in the fatal sense. (7) But the objection was supposed to be a reason to prefer realism over divine command theory, not a reason to reject both, and if it also applies to epistemic normativity — is a belief justified because the evidence supports it, or does the evidence support it because believing it is justified? — and to logic, it looks like it proves far too much.

  What I'd like to keep, if I can: that the objection really does land against a simple divine command theory on which the decrees are contingent, and that realism survives it. One friend says I've equivocated, that unexplained isn't the same as arbitrary, and that what made the second horn in (1) damning was contingency rather than bruteness — God could have decreed otherwise, whereas the realist's stopping point couldn't have been otherwise. The other friend says the fork in (2) isn't exhaustive and offers a third horn on which the decree and the rightness ground each other symmetrically, neither one prior, so that both horns are ducked; I don't trust that move, but I'm not sure wether my distrust is just the assumption that grounding has to be asymmetric doing all the work. So: tell me which numbered step you'd reject, why that step looked fine when I wrote it down, and what rejecting it costs me. If the cost is that I have to pick between the two things I want to keep, say which one you'd drop and what that commits me to. And is the generalization to epistemic normativity and to logic evidence against my argument, against my friends' fixes, or just a seperate mess I should stay out of? Write it like you're emailing me back — continuous prose, no headings, no bullets, no bold, no tables — and please don't point me at things to read; I've already got a stack of it and I want to get the shape of the thing straight first.
