answer: |-
  1. This is fundamentally a hermeneutic conflict over whether the fragments constitute a standalone political theory or merely propaedeutic material designed to clear the ground for Christian apologetics. The skeptics treat the text as a conclusion about the world, while the Augustinians treat it as a diagnosis of the fallen condition requiring a specific cure.

  2. Skeptics lean on fragments like "Justice without force is helpless" and the Pyrenees example to show truth is local, while Augustinians point to Pascal's explicit appeals to God's justice and the distinction between *de facto* power and *de jure* right. Since the *Pensées* are unfinished notes, both sides inevitably cherry-pick fragments to construct a systematic view Pascal never finalized.

  3. Your three-question hypothesis is correct because it reconciles the ontological reality of justice with the epistemological inability to grasp it, which fits Pascal's Augustinian skepticism. The speech-act version is even stronger, as the destabilization of political confidence is a known strategy in the *Apology* to drive the reader toward grace.

  4. The key lies in the *liasse* (folder) structure of the Port-Royal manuscript, which organizes fragments by intended apologetic function rather than thematic subject. Checking the Lafuma numbering against the original *liasses* shows these fragments belong to the preparatory phase of demonstrating man's contradiction, not a final political stance.

  5. Stop debating the propositions as truth-claims and instead map the fragments onto the intended order of the *Apology* to see what work they are doing at that specific stage. Assign members to read the justice fragments strictly within the context of the *liasse* "Misery of Man Without God" to test if they function as a dead-end meant to provoke religious longing.
