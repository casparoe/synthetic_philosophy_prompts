answer: |-
  This is a classic formulation of the **Boundary Problem** in democratic theory (often associated with Frederick Whelan and Robert Dahl). You have correctly identified that the All-Affected Principle (AAP), taken literally and causally, leads to an infinite regress that dissolves political agency.

  Since you are unwilling to accept (6) (paralysis) or (7) (rejecting the moral intuition of consent), you need to intervene earlier in the chain. The error is not in the moral intuition of (1), but in the **institutional application** of (1) in steps (4) and (5).

  Here are the three most robust ways to cut the knot, the cost of each, and an answer to your worry about "thresholds."

  ---

  ### Option 1: Reject Step (4) by Distinguishing "Affected" from "Subjected"
  **The Move:** Modify Premise (1). The claim to a voice arises not from being *causally affected* by an outcome, but from being *subjected to the coercive authority* of the decision-making body. This is the **All-Subjected Principle**.

  *   **The Logic:** The coastal residents are causally affected by the CO2, but they are not subject to the town council's jurisdiction. They cannot be fined by the town, arrested by its police, or bound by its zoning laws. The town council exercises no authority over them. Therefore, they do not need a vote *in that council* to remain free; their freedom is not constrained by the council's authority, only by the physical consequences of its actions.
  *   **The Fix:** The coastal people have a claim to a voice in the *regulatory regime* that permits the town council to emit CO2 (e.g., national environmental law or international treaties), because that is the structure that subjects everyone to a common rule.
  *   **The Cost:** You have to admit that "consent" isn't about consequences, but about **authority**. It means accepting that local bodies *can* legitimately make decisions that harm outsiders, provided they are operating within a higher-order framework that *does* include those outsiders. It shifts the democratic deficit from the town hall to the federal/global level.

  ### Option 2: Reject Step (5) via the "Marginal Contribution" Argument
  **The Move:** Challenge the causal granularity in Step (3) and (5).

  *   **The Logic:** The AAP requires that people affected by a *decision* have a voice in *that decision*. But does the coastal person suffer harm from *this specific data center*? No. They suffer harm from the *accumulation* of thousands of such decisions.
  *   **The Fix:** The "decision" that affects the coastal person is not the zoning permit for one building; the "decision" is the **carbon pricing mechanism** or the **emissions cap** that allows the aggregate harm to occur. Therefore, the demos for the zoning vote is the town; the demos for the carbon cap is the globe (or nation).
  *   **The Cost:** This requires a **multi-level governance** view. It means local decisions are only democratically legitimate if they are nested within higher-level rules that internalize externalities. If the town council is voting on the data center *in a vacuum* (no carbon tax, no caps), then your original argument holds: the vote is illegitimate. The "fix" requires building the higher-level institutions first.

  ### Option 3: Reject Step (7) but Accept a Modified (6)
  **The Move:** Accept that the AAP *does* demand global consideration, but reject that this leads to paralysis.

  *   **The Logic:** Step (6) assumes "voice" means "a direct vote in every specific referendum." But representation can be **proxy-based**. The coastal people's "voice" in the town council decision is exercised through their representatives in the UN or national parliament, who set the constraints within which the town council operates.
  *   **The Fix:** The argument doesn't prove the AAP is false; it proves that **local sovereignty is an illusion** in a globalized economy. If a local decision has global effects, it ceases to be a purely local matter.
  *   **The Cost:** This is politically radical. It implies that as long as we lack robust global governance, almost all local economic decisions are technically democratically deficient. It forces you to advocate for stronger supranational institutions rather than abandoning the principle.

  ---

  ### Addressing Your Worry About "Thresholds"

  You asked: *"If the whole fix is just to quietly put a threshold on 'significantly affected,' I want to hear why that threshold isn't doing all the heavy lifting and making (1) basically empty."*

  You are right to be suspicious. If you just say "significant means >0.1% impact," that is arbitrary and ad hoc. However, the threshold doesn't have to be about **magnitude of harm**; it can be about **causal specificity** and **institutional capacity**.

  Here is why a non-empty threshold works:

  1.  **Discretion vs. Determinism:** A decision only triggers the AAP if the body has the *discretion* to alter the outcome. If the town council approves the data center, but national law mandates the grid mix (gas vs. renewable), the town council is not the agent of the CO2 emission. The "significance" threshold is met only when the decision-maker has the **power to remedy the harm**.
      *   *Why it's not empty:* It ties the right to vote to the capacity to solve the problem. It prevents the "global referendum on everything" by assigning the vote to the level of governance that can actually address the externality.

  2.  **Foreseeability and Traceability:** For a person to have a democratic claim, the link between the vote and the harm must be politically traceable. In your example, the link is scientifically real but politically diffuse.
      *   *Why it's not empty:* It distinguishes between **structural violence** (which requires constitutional/regulatory fixes) and **particular decisions** (which require local voting). It preserves the local demos for local issues while acknowledging that climate change is a constitutional/global issue, not a zoning issue.

  ### Recommendation

  The strongest path that preserves your intuition without dissolving the demos is a combination of **Option 1 and Option 2**.

  **Reject Premise (1) slightly:**
  > "Anyone who is significantly affected by a collective decision **and is subject to the jurisdiction enforcing that decision** ought to have a voice."

  **And add a Corollary:**
  > "If a decision significantly affects those *outside* the jurisdiction, the decision is only legitimate if those outside interests are represented **at the higher level of governance that authorized the externality.**"

  **What this costs you:**
  It costs you the comfort of localism. It means you cannot defend the town council's decision on its own merits. You must defend the *national/global regulatory framework* that allows the town council to make that decision. If that framework doesn't exist (i.e., if there is no carbon pricing or international climate law), then your original intuition stands: **the decision is indeed democratically illegitimate.**

  The paradox isn't a bug in the All-Affected Principle; it's a bug in our political fragmentation. The argument doesn't prove (1) is false; it proves our current borders are morally arbitrary regarding climate issues.
