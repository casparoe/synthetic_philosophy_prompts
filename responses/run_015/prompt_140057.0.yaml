  **The Cost of Coarseness: Why Accuracy-First Epistemology Requires Fine-Grained Scoring**

  The accuracy-first program in epistemology seeks to ground the norms of rational belief in a single fundamental value: accuracy. The central achievement of this program is the dominance argument for probabilism, most notably advanced by James Joyce. The argument posits that if an agent's credences violate the probability axioms, there exists a probabilistic credence function that is strictly more accurate than the non-probabilistic one at every possible world. This result relies heavily on the assumption that accuracy is measured by a strictly proper scoring rule, such as the Brier score, which aggregates squared distances between credences and truth values.

  But what happens if we reject the fine-grained aggregation of the Brier score in favor of a "coarse-first" measure? Suppose the primary epistemic goal is not to minimize total error, but to minimize the *maximum* error one could suffer on any single proposition (a minimax approach), using total distance only as a tie-breaker. As the prompt suggests, under such a metric, an incoherent credence function like $(0.51, 0.51, 0.51)$ can dominate coherent probabilistic functions on a three-cell partition. This essay argues that adopting a coarse-first measure destroys the accuracy-first argument for probabilism, replacing it with a mandate for incoherent hedging. However, this outcome reveals that coarse-first measures are not genuinely alethic; they smuggle pragmatic risk-aversion into the heart of epistemology. Therefore, the accuracy-first framework does not survive the shift to coarseness intact; it dissolves into a form of pragmatism that accuracy-firsters should reject.

  To understand the collapse of probabilism, we must first examine the mechanics of the dominance argument under the coarse-first regime. The standard Brier score treats accuracy as a global property: it sums the squared errors across the entire partition. This additive structure penalizes incoherence because violating the sum rule (e.g., summing to 1.53 instead of 1) inevitably increases the total squared distance from the truth vector in at least one world.

  The coarse-first measure, however, changes the optimization target. It prioritizes the "worst-case miss." Consider a partition of three mutually exclusive and exhaustive worlds, $\{w_1, w_2, w_3\}$. A coherent probabilist must assign values summing to 1. By the pigeonhole principle, at least one world must be assigned a credence of $1/3$ or less. If that world turns out to be true, the error is $|1 - 1/3| = 2/3 \approx 0.67$. Thus, every probabilistic function has a worst-case error of at least $0.67$.

  Now consider the incoherent function $C = (0.51, 0.51, 0.51)$. While the sum exceeds 1, the distance to the truth value on any single cell is bounded. If $w_1$ is true, the error on $w_1$ is $0.49$. The error on the false worlds $w_2$ and $w_3$ is $0.51$. The maximum error is $0.51$. Since $0.51 < 0.67$, the incoherent function $C$ dominates all probabilistic functions with respect to the primary coarse-first metric (minimax error). The tie-breaking condition (total squared distance) never comes into play because the primary condition is not tied. Consequently, the dominance argument flips: probabilism is no longer the requirement of rationality; rather, rationality requires assigning high credence to all possibilities to hedge against the worst-case scenario.

  This result demonstrates that the framework does not deliver probabilism, nor does it deliver a standard form of imprecise probabilism (which typically involves sets of coherent probability functions). Instead, it delivers a form of **incoherent permissivism**. Under the coarse-first measure, the rational agent is permitted, and perhaps required, to hold credences that violate the axioms of probability. The normative force of the probability axioms is severed from the goal of accuracy. If accuracy is defined by avoiding the largest possible single error, then coherence is a liability, not a virtue.

  One might wonder if a different coarse measure, such as the "blunder count" variant mentioned in the setup, could save probabilism. In this variant, we count the number of propositions where the error exceeds a threshold (e.g., 0.1). Here, the dynamics reverse. The incoherent hedger $(0.5, 0.5, 0.5)$ commits blunders on the two false worlds (error 0.5), whereas a sharp probabilist $(1, 0, 0)$ commits no blunders on the false worlds (error 0). This instability highlights a deeper problem: coarse measures are arbitrarily sensitive to how "error" is binned. The minimax measure favors hedging; the blunder count favors extremization. Unlike the Brier score, which uniquely identifies probabilistic coherence as the undominated strategy across all worlds, coarse measures yield conflicting normative advice depending on the specific threshold or aggregation method chosen.

  This leads to the crucial evaluation: is a coarse-first measure something an accuracy-first epistemologist should want? The answer is no. The accuracy-first program is founded on the idea that epistemic rationality is distinct from practical rationality. Epistemic value is alethic—it concerns the fit between mind and world. Practical value concerns the consequences of holding those beliefs.

  The minimax (coarse-first) metric is structurally identical to a risk-averse utility function in decision theory. In practical decision-making, it is rational to minimize maximum loss (minimax regret) to avoid catastrophe. However, in pure truth-seeking, there is no "catastrophe" beyond being wrong. A 0.67 error is worse than a 0.51 error, but it is not a different *kind* of failure that warrants lexical priority. By prioritizing the worst-case error over the aggregate error, the coarse-first measure imposes a risk-aversion constraint on belief. It treats being very wrong about one proposition as disproportionately bad compared to being moderately wrong about many.

  This is a pragmatic concern, not an alethic one. If the goal is simply to represent the world as accurately as possible, the sum of errors (or squared errors) is the natural measure of inaccuracy. Prioritizing the maximum error smuggles in a "good enough" notion of belief suited for action—where a single large mistake might ruin a plan—rather than a notion of belief suited for truth. An accuracy-firster who adopts coarse-first measures is no longer prioritizing accuracy; they are prioritizing safety.

  Furthermore, accepting the coarse-first measure undermines the uniqueness of the accuracy-first justification for probabilism. If the scoring rule can be swapped to yield incoherence as the dominant strategy, then probabilism is not a theorem of accuracy; it is an artifact of the Brier score. To maintain that probabilism is a requirement of rationality, the accuracy-firster must argue that fine-grained measures are the *only* legitimate measures of alethic distance. This is a defensible position: truth is a continuous quantity, and our measure of distance from it should reflect that continuity rather than imposing arbitrary thresholds or worst-case caps.

  In conclusion, the accuracy-first argument for probabilism does not survive the transition to coarse-first measures. Under a minimax regime, the dominance argument inverts, recommending incoherent hedging over probabilistic coherence. This does not suggest that probabilism is false, but rather that coarse-first measures are inappropriate for epistemology. They transform the project from an inquiry into the nature of truth into a management strategy for error tolerance. To remain "accuracy-first," one must commit to fine-grained scoring rules that treat truth as a continuous value to be approximated, not a risk to be managed. The breakdown of the argument under coarse measures thus serves as a *reductio* of those measures, confirming that genuine epistemic accuracy requires the fine-grained sensitivity that only probabilistic coherence can satisfy.
