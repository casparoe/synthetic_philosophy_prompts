answer: |-
  In a metropolitan hospital, nurses follow a standing protocol to dispose of expired liquid chemotherapy drugs by pouring them into standard sinks rather than using hazardous waste bins, a practice authorized because the cumulative volume is deemed manageable. The local water treatment facility has a strict saturation threshold for cytotoxic compounds, beyond which filtration fails and toxins enter the river ecosystem; current hospital output already exceeds this threshold by 50% before Nurse Evans begins her shift. Evans knows that pouring her assigned vials adds to the total volume but also knows that the treatment plant's filtration failure is already fully activated by her colleagues' prior disposals, meaning her specific contribution will not alter the concentration of toxins in the river nor trigger any new ecological damage. Nevertheless, she proceeds to pour the medication down the sink solely to save time, participating knowingly in the ongoing protocol that sustains the toxic discharge.

  **Analysis**

  **Why the act is not a difference maker:** The scenario utilizes causal overdetermination via a saturated threshold. The harm is defined as the *state* of filtration failure and ecological toxicity. Since the threshold for this state is already exceeded by 50% prior to Evans' act, the counterfactual holds: if Evans had not poured the medication, the filtration would still fail, and the river would still be toxic at the same functional level. Her act is causally inert regarding the *outcome* of harm.

  **Why the person is still responsible:** Responsibility here is grounded in **complicity within a joint practice**, not individual causal efficacy. Evans is not merely causing a state of affairs; she is willingly participating in a collective enterprise she knows is harmful. By performing her role in the protocol, she validates the practice, shares in the collective agency, and fails to uphold her duty to dissociate from wrongful institutional conduct, regardless of whether her specific input changes the final tally.

  **What a defender of the objection would say:** A defender of the "wouldn't-have-mattered" objection would argue that moral responsibility tracks causal responsibility. They would claim that if the world is physically identical with or without your action, you cannot be blamed for the state of the world. They would assert that blaming Evans is merely symbolic or emotional, as she literally changed nothing about the victim's (the river's) status.

  **Key Feature and Collapse:** The feature doing the work is **causal overdetermination via a saturated threshold**. This feature secures the "no difference" condition without relying on probability or exotic physics. If you remove this feature (e.g., the threshold is not yet met, or the harm is linear without a threshold), Evans' act becomes a difference-maker. Consequently, the distinction collapses: causal impact and moral responsibility would coincide, and you would no longer have a case separating the two concepts.
