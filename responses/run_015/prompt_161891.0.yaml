answer: |-
  **The Setup**

  Consider a single-particle ideal gas confined in a box of volume $V$ immersed in a heat bath at temperature $T$, with a movable central partition connected via a rigid, massless linkage to a weight-lifting mechanism and a memory tape drive. The tape consists of a stream of non-interacting two-state physical bits (e.g., particles in symmetric double-well potentials) moving at a quasi-static speed, where each bit enters the interaction zone with a fixed probability $p$ of being in state '0' and $1-p$ in state '1', never to return. The demon is a purely mechanical feedback controller: upon inserting the partition to divide the box into $V/2$, the particle's position (Left or Right) mechanically lowers the energy barrier of the passing tape bit, allowing the bit to relax into a state correlated with the particle's position without thermal hopping, after which the gas expands reversibly against the partition to lift the weight, doing work $W$, before the partition is removed and the tape bit exits the system permanently. This coupling is strictly adiabatic and deterministic given the particle's position, avoiding the Feynman ratchet failure mode because the bit's state transition is driven by the macroscopic linkage to the particle's confinement volume, not by thermal fluctuations overcoming a pawl; the tape bits are written once, carry away the entropy, and are never erased within the device.

  **The Accounting**

  We analyze the cycle using the Generalized Second Law for information thermodynamics. The total entropy change of the universe per cycle is $\Delta S_{tot} = \Delta S_{gas} + \Delta S_{bath} + \Delta S_{tape} \ge 0$. Since the gas returns to its initial macrostate (volume $V$, temperature $T$) after the partition is removed, $\Delta S_{gas} = 0$. The bath exchanges heat $Q$ with the gas; since the internal energy of an ideal gas depends only on temperature and $\Delta T = 0$, the First Law gives $Q = W$ (work done *by* the gas). Thus, the bath entropy change is $\Delta S_{bath} = -Q/T = -W/T$. The tape enters with Shannon entropy per bit $H_{in} = -p \ln p - (1-p) \ln (1-p)$ (in nats) and, to maximize work extraction, leaves in a maximally mixed state correlated with the particle, $H_{out} = \ln 2$. The tape's entropy change is $\Delta S_{tape} = k(H_{out} - H_{in})$. Substituting these into the inequality:
  $$ -\frac{W}{T} + k(\ln 2 - H_{in}) \ge 0 \implies W \le kT (\ln 2 - H_{in}) $$
  For a reversible process (the limit of our quasi-static design), the equality holds. The work extracted per cycle is exactly the free energy lost by the tape as it randomizes.

  **The Three Accounts**

  1.  **The Erasure/Landauer Account:** This account insists that information processing costs $kT \ln 2$ only when a bit is *reset* to a standard state. In your design, no bit is reset; they are randomized. A strict Landauer purist might argue the cycle is incomplete until the tape is erased. Consequently, this account predicts **zero net work** for the closed loop (Demon + Tape Factory), but it has no local explanation for the work extracted *here* other than to say "you are borrowing entropy capacity." It comes away empty-handed on the local mechanism because it treats memory as a cost center, not a fuel source.
  2.  **The Fluctuation Account:** This view attributes demon failures to thermal noise rattling the gate (the Feynman ratchet objection). However, because our linkage is mechanical and quasi-static, thermal fluctuations do not drive the bit transitions; the particle's position does. This account is **not engaged**; the engine does not rely on rectifying noise, but on harnessing the particle's known position against the tape's order.
  3.  **The Information-Reservoir Account:** This treats the tape as a thermodynamic reservoir with chemical potential $\mu = -kT H$. It predicts work extraction is bounded by the difference in free energy between the input and output tape states. The prediction is $W = kT(\ln 2 - H_{in})$. This matches our derivation exactly.

  **The Verdict on the Budget**

  Your intuition is correct: the budget is **not** $kT \ln 2$ per bit. It is $kT \times \Delta H_{tape}$.
  For a blank tape ($p=1, H_{in}=0$), the budget is the full $kT \ln 2$.
  For your 90%-zeros tape ($p=0.9$), $H_{in} \approx 0.325$ nats. The budget drops to $W \approx kT(0.693 - 0.325) = 0.368 kT$.
  A gigabyte of 90%-zeros is indeed less fuel than a gigabyte of blank tape. The "cost" is the entropy gap the tape can absorb. You are spending the *negentropy* of the tape, not paying an erasure tax.

  **The Collapse and The Counter**

  The single feature doing the work is the **entropy gradient of the tape**. If you remove it—starting with an already-random tape ($p=0.5$)—then $H_{in} = \ln 2$, $\Delta H = 0$, and $W = 0$. The engine stalls. If you recycle the tape through the demon instead of discarding it, the tape accumulates entropy until it randomizes, at which point work extraction ceases unless you erase it, at which point you pay $kT \ln 2$ per bit, canceling your gains.

  Your friend's strongest argument is that this is **the same exorcism with an extra comma**. Globally, the 2nd Law holds. The low-entropy tape had to be prepared by *someone*. If that preparation involved erasing random bits to make them 90%-zeros, the energy cost was paid upstream. Your demon isn't violating the 2nd Law; it's just a heat engine running on a fuel source (ordered bits) instead of a temperature difference. The "Landauer cost" hasn't vanished; it has been outsourced to the tape manufacturer.

  **Honest Limitation**

  This case settles that *local* work extraction can be fueled by information entropy without local erasure, validating the Information-Reservoir model over a strict "erasure-is-mandatory" reading of Landauer. However, it cannot settle the deeper philosophical question of whether information *is* physical or just *maps* to physics, nor does it address quantum coherence or general relativistic effects where the definition of "particle position" or "time" becomes ambiguous. It proves the accounting works, not what the numbers fundamentally *are*.
