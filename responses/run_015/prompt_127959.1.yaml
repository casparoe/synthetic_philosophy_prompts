          *   *Theory:* Egalitarianism (Rawlsian difference principle applied to status?), Communitarianism, Kantian dignity (not using people as trophies).
      *   *The Hybrid (Copenhagen):* Private ranking, public silence.
          *   *Tension:* Merit is real enough for sorting (university) but not real enough for honor.
