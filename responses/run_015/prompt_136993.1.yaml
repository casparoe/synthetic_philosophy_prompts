answer: |-
  ### Brainstorming Exits

  I see four main exits. First, I could reject **(1)** and accept the conclusion, but that destroys my project on responsibility for letting happen and contradicts settled legal doctrine. Second, I could reject **(2)** by arguing omissions require a normative or capacity-based constraint to be causal; the cost is making causation partly normative, risking a collapse of the distinction between causation and culpability. Third, I could reject **(5)** by embracing an abundant realist ontology where all counterfactual dependencies are causal, distinguishing ontology from pragmatic selection; the cost is accepting that "my not phoning the fire brigade" is metaphysically a cause, which strains ordinary language. Fourth, I could reject **(6)** and argue causation is inherently interest-relative; the cost is undermining the objectivity required for scientific and legal explanation.

  ### The Diagnosis: Reject Step (5)

  I reject **(5)**. The step from "every event has vastly many causes" (4) to "causal structure is not discovered but selected" (5) conflates the *metaphysics* of causation with the *pragmatics* of causal attribution.

  **Defense:**
  Step (5) looks innocent because it assumes that if we do not cite all causes in explanation, the un-cited ones are not part of the causal structure. I argue instead for a **realist but abundant view**: the causal structure of the world is indeed the full web of counterfactual dependencies (accepting 4), which is objective and discovered, not selected. However, *causal claims* are selective. When the gardener's not watering is cited as the cause of the plant's death, we are not denying that the sun's shining or the lack of rain were also causes in the abundant sense; we are selecting the gardener's omission as the *explanatorily relevant* factor given our interests.

  This preserves (1) because singular causal claims are literally true reports of the abundant causal structure, filtered through pragmatic norms. It preserves (6) because the underlying structure (the counterfactual dependencies) is objective, even if our talk about it is interest-relative. The error in the argument is assuming that selectivity in *speech* implies subjectivity in *structure*.

  **Handling the Complications:**

  1.  **Profligacy in Positive Causation:** You note that double prevention (e.g., the alarm not sounding) generates the same profligacy as omissions. By rejecting (5), I embrace this uniformity. If the alarm's silence is a cause, so is the absence of a meteor shower that would have destroyed the alarm. Both are counterfactual dependencies. The intuition that positive causation is "scarce" is a pragmatic illusion, not a metaphysical fact. This unifies the treatment of omissions and commissions, avoiding the need for a dualistic metaphysics.
  2.  **Norm-Infected Data:** You worry that if empirical data shows people rely on norms to judge causation, causation itself might be normative. On my view, norms influence the *selection* process (the move from the abundant web to the specific claim), not the existence of the causal relation. The gardener's omission is a cause regardless of duty, but we only *blame* or *cite* it legally because of the duty. This explains the data without conceding that causation is constituted by norms.

  ### Pricing the Alternatives

  I did not take the other three paths. Here is their cost:

  1.  **Normative or Reasons-Based Restriction (Rejecting 2):**
      *   *The View:* An omission is causal only if the agent had a duty or capacity to act. This filters the profligacy at the metaphysical level.
      *   *The Cost:* This collapses causation into culpability. In law, we must establish causation *before* we assess breach of duty. If the existence of the causal relation depends on the duty, we cannot use causation to ground the duty's violation. It makes causation too "thick" a concept, rendering it useless for neutral fact-finding in complex torts or criminal cases where duty is the very thing in dispute.

  2.  **Contrastivist Reading (Modifying 5):**
      *   *The View:* Causal claims are ternary (C rather than C* caused E rather than E*). This handles profligacy by making causation relative to a contrast class.
      *   *The Cost:* While linguistically elegant, contrastivism often functions as a notational variant of the pragmatic solution I adopted. However, its metaphysical cost is higher: it implies there is no binary causal relation "in the world," only contrast-relative ones. This complicates the integration of causation into physical laws, which are typically binary or functional, not contrastive. It solves the selection problem by denying there is a non-contrastive structure to select from.

  3.  **Actual-Causation Frameworks (e.g., NESS, Structural Equations):**
      *   *The View:* Use formal models (like Halpern and Pearl) to distinguish "actual causes" from background conditions via normality defaults.
      *   *The Cost:* These frameworks often hide the normative selection criteria inside "default values" or "normality" parameters. While computationally useful, they risk circularity: an omission is a cause because it is abnormal, but it is abnormal because we treat it as a cause. Furthermore, they struggle to provide a unified metaphysical story that satisfies both the physicist's need for invariant dependencies and the lawyer's need for specific attribution, often ending up as sophisticated bookkeeping rather than metaphysical diagnosis.

  By rejecting (5) and holding the line on abundant realism, I pay the price of metaphysical inflation (too many causes) to save the objectivity of the causal relation, leaving the pruning to the pragmatic and normative domains where it belongs.
