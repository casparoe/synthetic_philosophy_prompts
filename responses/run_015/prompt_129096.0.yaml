ated moral responsibility can survive if all suffering is ultimately experienced by the same consciousness. For each crux, specify a concrete case, empirical result, or structured thought experiment both sides agree bears on it, and record each camp's prediction in advance about what that case will show. Finally, indicate whether any part of the disagreement is verbal—for example, whether "consciousness" operates in a phenomenological register for one camp and an ontological register for the other—and, if so, isolate that part precisely. Do not request bibliographies, reading lists, or citations; do not quote verbatim from any text.
