  1. Bottom line
  A trait token T in system S has the function of doing F iff T belongs to a trait type currently maintained in the population of S-type systems because doing F contributed to the fitness or operational goals of S (or the containing system S belongs to). This etiological history explains T's presence, allowing for malfunction where the type is maintained but the token fails. Selection includes natural, artificial, and intentional design processes, provided the selection pressure is ongoing at the population level, not merely incidental or nascent in a single generation. The benefit must accrue to the containing system's persistence or goals, excluding parasitic lineages within S. This ensures functions are normative relative to the system's integrity, not just the trait's own proliferation. The principle captures the intuition that functions explain why traits are there, requiring both a historical selection story and current systemic integration.

  2. Candidates
  Standard Selected-Effects (SE) accounts define function as the effect for which a trait was historically selected. Standard Causal-Role (CR) accounts define function as any current causal contribution to the system's capacity. My recommended principle is a Modified SE account: function is the effect for which the trait type is *currently maintained* by selection, benefiting the containing system.

  The recommended principle wins because pure SE incorrectly assigns functions to vestigial organs (Case 7) and cancerous growths (Case 6) based on past or parasitic selection. Pure CR incorrectly denies functions to malfunctioning traits (Case 1) and designed artifacts that haven't yet operated (Case 4). Your verdicts require the normative history of SE to handle malfunction and design, but the systemic constraints of CR to handle vestiges and parasites. By requiring *current maintenance* by selection for the *containing system's* benefit, this hybrid captures the intuition that functions must be both historically grounded and currently integral to the host system's economy. It specifically resolves the tension between Case 8 (co-option) and Case 7 (vestiges): both rely on history, but only co-option involves current maintenance. It also resolves Case 9 (symbionts) by specifying the beneficiary system. This precision avoids the over-generation of SE and the under-generation of CR, matching your specific pattern of verdicts without requiring ad hoc exceptions for each case.

  3. Clause by clause
  First, the **Trait Type Clause** (Cases 1 & 4) distinguishes tokens from types. It states that a broken token retains function if the type is maintained. If dropped, a clotted kidney (Case 4b) or diseased heart (Case 1) becomes functionless, contradicting your intuition that they are malfunctioning, not functionless. This clause preserves the normative force of function, allowing us to say something is *wrong* rather than merely inactive. Without it, function collapses into current capacity.

  Second, the **Current Maintenance Clause** (Cases 3 & 7) requires selection to be ongoing at the population level. If dropped, a single-generation mutation (Case 3) counts as functional prematurely, violating the intuition that functions require established lineage. Furthermore, vestigial eyes (Case 7) would retain function despite no longer contributing to fitness. Your verdicts require that selection must sustain the trait's presence now, not just in the past. This distinguishes co-opted feathers (Case 8, currently selected for flight) from vestigial eyes (no longer selected for sight). Dropping this blinds the account to evolutionary dynamism.

  Third, the **Beneficiary Clause** (Cases 6 & 9) specifies that selection must benefit the containing system S. If dropped, Tasmanian tumor cells (Case 6) have the function of proliferation because they are selected. This makes cancer functional, undermining the concept of pathology. Similarly, gut bacteria producing Vitamin K (Case 9) would count as functioning for you, rather than being a by-product. This clause ensures functions serve the system's integrity, excluding parasitic lineages and incidental effects. Dropping it conflates 'selected effect' with 'proper function'.

  Fourth, the **Selection/Design Equivalence Clause** (Cases 4 & 5) treats artificial selection and intentional design as function-grounding. If dropped, the lab-grown kidney (Case 4) and directed evolution enzyme (Case 5) lack functions because no natural organism benefited. Your verdicts treat design history as equivalent to natural history, requiring this clause to unify artifacts and biological traits under one principle. Dropping it creates an unjustified dualism between natural and artificial teleology.

  These clauses interact critically. The Maintenance Clause prevents the Beneficiary Clause from being trivialized by past history (vestiges), while the Beneficiary Clause prevents the Maintenance Clause from validating parasitic success (cancer). Together, they enforce a specific kind of history: one where the trait was kept *because* it helped *this* system, and is still kept for that reason. The Type Clause ensures this history applies to the token even when capacity fails. Without this interlocking structure, you cannot simultaneously hold that a broken heart works (Case 1) while a broken eye does not (Case 7), nor that a tumor grows (Case 6) but does not function. The principle forces a tight coupling between historical explanation and current systemic integration.

