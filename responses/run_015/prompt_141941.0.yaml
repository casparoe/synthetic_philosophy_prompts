  Third, consider an AI algorithm evolving code to solve mazes, which inadvertently develops a subroutine that compresses data. If the selection pressure was solely maze-solving, data compression is not a function. However, if later rounds select for code size limits, compression becomes a function. This highlights the 'Current Maintenance' clause: functions can emerge mid-process if selection pressures shift. The principle predicts function attribution tracks the specific selective history, not the total causal profile. This prevents function inflation where every useful effect counts, preserving the normative distinction between what a trait is *for* and what it merely *does*. These predictions test the boundary between design and discovery. In the protein case, the computer is the agent. If the computer 'discovers' the stability via evolutionary algorithms without explicit instruction, it mimics Case 5 (directed evolution). Here, stability *is* a function because the algorithm selected for it. The distinction lies in whether the effect was a filter in the generation process. This nuance ensures the principle handles complex engineering contexts where selection is simulated rather than intentional, aligning with your verdict on the directed evolution enzyme.

  7. The case I keep going back and forth on
  The principle predicts termite-fishing has a function if cultural transmission counts as 'selection maintaining the trait type'. Since the behavior is socially learned and passed down, it meets the 'Current Maintenance' criterion. The prediction hinges entirely on the decision to extend 'selection' beyond genetics, made in Section 5. This is not inherent to the case itself but relies on the broader definition of evolutionary processes.

  This case is a reason to extend the principle, not doubt it. Your hesitation likely stems from the biological orthodoxy restricting function to genetic traits. However, your acceptance of design (Case 4 & 5) already breaks strict biological naturalism. Consistency demands that any process generating maintained trait types via differential retention counts. Rejecting cultural selection would create an arbitrary boundary between designed artifacts (functional) and learned behaviors (functionless), despite both relying on non-genetic inheritance. Extending the principle here unifies your verdicts on artifacts and behaviors. It confirms that 'history' matters more than the specific medium of that history. Thus, the case strengthens the principle by demanding a coherent definition of selection that covers all your accepted cases. Therefore, the principle recommends affirming the function, provided the cultural lineage is robust enough to satisfy the 'population maintenance' clause, distinguishing fleeting fads from established functions.
