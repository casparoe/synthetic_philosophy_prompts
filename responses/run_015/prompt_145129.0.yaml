answer: |-
  # JOINT STATEMENT ON DEMOCRATIC BOUNDARIES AND THE TRANSBOUNDARY AQUIFER AUTHORITY

  **Signatories:** A Proponent of the All-Subjected Principle (Subjectionist) and A Proponent of the All-Affected Interests Principle (Stakeholderist).

  **Date:** October 26, 2023

  **Context:** This document summarizes the findings of an adversarial collaboration regarding the democratic legitimacy of boundary-drawing for collective decision-making bodies. The collaboration utilized a concrete institutional case: a binding Transboundary Aquifer Authority (TAA) established by treaty among three sovereign states. The TAA sets enforceable water-allocation quotas, manages ecological standards, and plans for long-term resource sustainability.

  ---

  ### PART I: AGREED CLAIMS

  1.  **The Necessity of a Boundary Principle:** Both parties agree that any collective decision-making body claiming democratic legitimacy must employ a principled method for determining who constitutes the *demos* (the membership body). Arbitrary exclusion undermines legitimacy.
  2.  **Distinct Conceptual Categories:** Both parties agree that "being subject to binding coercive authority" and "having fundamental interests causally affected" are conceptually distinct categories. An individual can be affected without being legally coerced, and (theoretically) coerced without being significantly affected.
  3.  **Descriptive Facts of the TAA Case:** Both parties agree on the following empirical descriptions of the Transboundary Aquifer Authority:
      *   **Member State Citizens:** Are directly subject to enforceable quotas and penalties imposed by the TAA through domestic legal incorporation.
      *   **Non-Citizen Agricultural Laborers:** Reside within the basin states but lack citizenship. Their economic welfare and livelihood are foreseeably determined by TAA allocation rules, though they are not direct addressees of TAA legal orders.
      *   **Downstream Non-Member Communities:** Reside in sovereign states outside the TAA treaty. Their ecological conditions and water access are causally altered by TAA decisions, but they possess no legal recourse within the TAA framework.
      *   **Future Generations:** Do not currently exist. Their resource options and survival prospects are constrained or enabled by the TAA's long-term extraction rates and conservation algorithms.
  4.  **Institutional Design Constraints:** Both parties agree that the TAA must operate within a feasible administrative framework. A boundary principle that renders the *demos* impossible to identify for the purpose of voting or representation fails to guide institutional design.
  5.  **Legitimacy Deficits:** Both parties agree that if the TAA exercises power over individuals who are permanently excluded from the *demos* despite falling under the relevant boundary principle (whether subjection or stakeholding), the TAA suffers a legitimacy deficit regarding those individuals.
  6.  **The Role of Coercion:** Both parties agree that the TAA exercises coercive power over member state citizens. The disagreement lies in whether this coercion is the *necessary condition* for membership, or merely a *sufficient condition* that is too narrow.
  7.  **The Role of Affectedness:** Both parties agree that the TAA causally affects the interests of laborers, downstream communities, and future persons. The disagreement lies in whether this affectedness is the *necessary condition* for membership, or merely a *sufficient condition* that is too broad.

  ---

  ### PART II: DISAGREEMENTS TABLE

  | Topic | Column A: Subjectionist Formulation | Column B: Stakeholderist Formulation |
  | :--- | :--- | :--- |
  | **1. Extraterritorial Economic Impact** | The non-citizen agricultural laborers are not subjects of the TAA because the Authority issues no direct legal commands to them; their economic hardship is a secondary market consequence, not an exercise of political authority over their will. | The non-citizen agricultural laborers are stakeholders in the TAA because their fundamental interest in livelihood is foreseeably and decisively determined by allocation rules; the distinction between legal command and economic necessity is morally irrelevant to their exclusion. |
  | **2. Future Persons** | Future generations cannot be members of the *demos* because democratic reciprocity requires the capacity to participate in the imposition of rules; one cannot be subject to authority one cannot acknowledge or contest. | Future generations must be represented within the *demos* because the TAA's decisions irreversibly alter the conditions of their agency; a principle that permits the present to tyrannize the future by exclusion fails the test of impartiality. |
  | **3. Determinable Membership Lists** | A valid boundary principle must yield a determinable list of members for every decision; the Subjectionist principle achieves this via legal jurisdiction, whereas the Stakeholderist principle relies on indeterminate causal chains. | A valid boundary principle must capture all relevant moral claims; the Stakeholderist principle achieves this via impact assessment, whereas the Subjectionist principle arbitrarily truncates moral responsibility at the border of legal enforceability. |
  | **4. The Source of Obligation** | The obligation to include an individual in the *demos* arises from the need to justify coercive power to those who must obey it; without obedience, there is no duty of democratic justification. | The obligation to include an individual in the *demos* arises from the need to respect the autonomy of those whose lives are shaped by collective choices; without inclusion, there is no respect for their equal moral status. |

  ---

  ### PART III: THE CRUXES

  The following sub-questions represent the pivotal points where empirical or conceptual clarification could shift the position of at least one party. For each crux, we identify a concrete feature of the TAA case and specify how each party interprets the significance of that feature.

  **Crux 1: The Functional Equivalence of Economic Dependency and Legal Coercion**
  *   **Sub-Question:** Does the absence of legal standing for non-citizen laborers demonstrate a lack of political subjection, or does their total economic dependency demonstrate a functional subjection that demands membership?
  *   **Concrete Feature:** The TAA Charter grants legal standing to challenge rulings *only* to citizens of member states and registered corporate entities, explicitly excluding individual laborers.
  *   **Subjectionist Predictive Judgment:** This feature demonstrates that laborers are not part of the political relationship. Because they cannot be held in contempt by the TAA nor sue the TAA, they are outside the circle of authority; including them would conflate economic policy with political sovereignty.
  *   **Stakeholderist Predictive Judgment:** This feature demonstrates a legitimacy crisis. Because the TAA holds the power to render their labor valueless without granting them recourse, the Authority exercises dominion over them; excluding them treats them as mere means to the ends of the member states.

  **Crux 2: Institutional Proxies for Non-Existent Agents**
  *   **Sub-Question:** Can an algorithmic constraint on present decision-making satisfy the democratic requirement for future persons, or does democracy strictly require actual agency?
  *   **Concrete Feature:** The TAA's allocation algorithm automatically reserves 15% of aquifer capacity based on projected scarcity in the year 2100, binding present users to this constraint.
  *   **Subjectionist Predictive Judgment:** This feature demonstrates prudent trusteeship, not democratic membership. It is a policy choice made by the current *demos* to protect resources; it does not require granting voting rights to non-existent entities.
  *   **Stakeholderist Predictive Judgment:** This feature demonstrates a minimal acknowledgment of stakeholder status. If the TAA removed this constraint, it would prove the body is illegitimate regarding the future; however, true membership requires a human proxy with veto power, not just an algorithmic weight.

  **Crux 3: The Operational Limit of Causal Chains**
  *   **Sub-Question:** Does the inability to draw a sharp line around "affectedness" invalidate the principle, or does it merely require administrative discretion to set a threshold?
  *   **Concrete Feature:** The TAA Impact Assessment Office identifies 50,000 downstream individuals in non-member states as "significantly affected," but acknowledges another 200,000 are "marginally affected" by price fluctuations.
  *   **Subjectionist Predictive Judgment:** This feature demonstrates the fatal indeterminacy of the Stakeholderist principle. If the boundary of the *demos* shifts based on administrative thresholds of "significant" impact, the rule of law is replaced by bureaucratic discretion.
  *   **Stakeholderist Predictive Judgment:** This feature demonstrates the necessary complexity of political reality. All boundaries require thresholds (e.g., age of voting); the need to set a threshold does not invalidate the moral claim of the significantly affected, only the administrative challenge of recognizing it.
