      *   *AI:* 200 hours of prompting is closer to "collaboration" or "direction." If the principle requires "human making," AI is out. If it requires "human creative choice," AI might be in. Given the "Chimp" exclusion, "Human Agency" is key. But is prompting agency?

  7.  **Developing the Recommendation:**
      *   *Strategy:* Offer a "Two-Condition" Principle.
          1.  **Human Creative Agency:** The work must originate in human choices (making, arranging, or selecting with creative intent).
