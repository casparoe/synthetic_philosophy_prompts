      *   *Handling the Posthumous Driftwood:* This fails Condition 1 regarding the *hiker*. Does the Curator satisfy Condition 1? If curation counts as creation, yes. If not, no. For a grant panel, you usually fund *living makers* or *estates of makers*. Funding a *curator* for someone else's trash is a stretch. I should advise the user to rule this "Not Art" to protect the "Functional Object" boundary.
