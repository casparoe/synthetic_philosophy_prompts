  6.  **Addressing the Conflicts & Trade-offs:**
      *   *The Chimp/Child Conflict:* This is the weakest link philosophically. If the grant is for "human arts," it's easy. If it's about "aesthetic experience," it's hard. For a *regional arts grant*, limiting to human creators is administratively necessary and culturally standard.
