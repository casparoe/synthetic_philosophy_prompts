answer: |-
  Hey, so this is a really fascinating puzzle, and honestly, I think you're onto something solid with this instability argument. Let's walk through why the standard indirect consequentialist move falls apart here.

  Imagine you're behind that veil of ignorance. You know the deal: you're going to exist over time, and you know for a fact that you're going to hit these "preference revision events." Your brain's reasoning hardware stays the same, but what you care about—your values—are going to shift. Maybe you're risk-averse now and risk-seeking later, or you care about art now and efficiency later.

  Standard indirect consequentialism says: "Pick the set of rules that, if followed, produces the best outcomes." Usually, this works because we assume your future self will agree on what "best" means. But in your scenario, your future self is going to look at the rules you picked today and say, "Wait, based on what I value *now*, this rule is suboptimal."

  Here's the glitch: If you're a pure consequentialist, you're committed to doing whatever produces the best results. If you know your future self will calculate that breaking the rule produces better results (according to their new values), then you know your future self is going to break the rule. That makes your current commitment unstable. You're trying to bind a hands-free agent who you know will untie the knots later because their definition of "good" has changed. Indirect consequentialism relies on the rule having staying power, but if the justification for the rule is purely outcome-based, and the outcomes are judged by shifting values, the rule loses its authority the moment values shift.

  So, the argument goes, you need hard deontic side-constraints. These aren't rules you follow because they optimize things; they're walls you don't climb even if your future values say there's a great view on the other side. They provide the stability the consequentialist rules can't.

  Now, the obvious comeback is: "Why not just bake a meta-rule into the system? Like, 'Follow Rule X, and never revise Rule X'." Basically, hardcode the commitment so the future self can't optimize their way out of it.

  But here's why that doesn't fly. You've got two problems, and both kill the move.

  First, it violates the idealization of the agent. You're behind the veil knowing that preference revision is inevitable. It's a known feature of your existence. To adopt a rule that says "never revise" is to plan based on a false premise—that you can stop the revision. It's like planning a trip assuming your car won't need gas, even though you know it runs on gasoline. If you know the revision is coming, a rational agent acknowledges that constraint. Ignoring it makes the plan irrational from the start.

  Second, and this is the bigger conceptual hit, if you say "Follow this rule even when your values say breaking it would be better," you have secretly stopped doing consequentialism. Consequentialism says the right action is the one that maximizes the good. If you're saying "Follow this rule even when it *doesn't* maximize the good (according to your current values)," you are treating the rule as having authority independent of the outcome. That is literally the definition of a deontic side-constraint. You've just renamed deontology "a rule with a no-revision clause." You can't claim to be optimizing outcomes while simultaneously forbidding optimization when it conflicts with the rule.

  So, the instability is real. You can't use outcome-based rules to bind a future self that judges outcomes differently, unless you turn those rules into non-negotiable constraints.

  Bottom line: If you know your values will change, outcome-based rules are just temporary suggestions, so you need hard deontic walls to maintain any real commitment.
