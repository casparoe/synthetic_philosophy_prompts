answer: |-
  ### The 30-Minute Governance Triage Procedure

  You are not looking for legal truth; you are looking for narrative friction. Your goal is to identify where the text contradicts the action, where the text contradicts itself, or where the text disappears entirely. If the document is silent, the story is the silence. If the document is contradictory, the story is the conflict. If the document is clear but nasty, the story is the design.

  **1. Integrity Check (The Excerpt Problem)**
  Ask: Do I have the full current text, including all referenced attachments?
  *   **Good Enough:** You have the main charter and any documents it explicitly incorporates by reference (e.g., "Handbook," "Bylaws").
  *   **Fail:** You only have an excerpt or a draft.
  *   **Action:** If you lack the full text, you cannot verify collisions or borrowed rules. Mark the story as "Based on provided excerpts" and hedge heavily. If the missing text is the amendment clause itself, **stop**.

  **2. Authority Chain (Who Acts?)**
  Ask: Does the body taking the action have the power to act under the current rules?
  *   **Good Enough:** The text explicitly grants this body the power to make this specific type of change.
  *   **Fail:** The text is silent, or grants the power to a different body.
  *   **Action:** If silent, who fills the gap? If the text says "Council decides" but doesn't say how, that's **interpretation creep**. If the power is clearly absent, **hand to lawyer** (potential *ultra vires*).

  **3. Pattern Match (The Five Moves)**
  Ask: Does this move fit one of the five categories: (a) threshold flips, (b) definitional dodges, (c) borrowed rules, (d) collisions, (e) interpretation creep?
  *   **Good Enough:** You can map the move to one category using plain text.
  *   **Fail:** It looks like a standard amendment but feels wrong.
  *   **Action:** If it matches (a) or (c), proceed to Step 4. If it matches (b) or (e), this is often a values question—**hand to editor** to decide if the semantic shift is newsworthy. If it matches (d), proceed to Step 4.

  **4. Entrenchment & Collision (The Locks)**
  Ask: Is there a clause that says this specific rule cannot be changed, or requires a higher bar than the one being used?
  *   **Good Enough:** You find a "super-majority" or "unamendable" clause that conflicts with the proposed action.
  *   **Fail:** You find two clauses that contradict each other regarding authority.
  *   **Action:** This is the highest legal risk. If a body is trying to lower its own lock (threshold flip), **hand to lawyer**. If two clauses fight (collisions), the story is the design flaw; **continue** but hedge.

  **5. The Silence Test (Gaps)**
  Ask: Where the document is silent, who decides?
  *   **Good Enough:** The text says "未尽事宜由 Council 解释" (未尽事宜 means "matters not covered") or similar.
  *   **Fail:** The text is silent with no gap-filler.
  *   **Action:** If a specific group claims the silence implies their power, that is **interpretation creep**. **Continue** but note the ambiguity is the story.

  **6. Exploit Publication Risk (The Harm Check)**
  Ask: If I publish this analysis, does it teach bad actors how to execute the exploit?
  *   **Good Enough:** The exploit is already public, or the fix is simple (e.g., "vote no").
  *   **Fail:** Publishing provides the missing legal theory needed to succeed.
  *   **Action:** If high risk, **hand to editor**. This is an ethical call, not a legal one. Do not publish a roadmap to a gutting unless the public interest outweighs the harm.

  **7. Hedging Selection (The Copy)**
  Ask: How certain am I?
  *   **Good Enough:** You have matched text to action clearly.
  *   **Fail:** You are relying on inference or external context.
  *   **Action:** Select your phrase. If legal uncertainty exists, use "The text does not settle this." If structural risk exists, use "On a plain reading..." If relying on expert input, use "According to..."

  ***

  ### Worked Applications

  | case_id | first_step_that_bites | verdict | hedge_phrase | signoff | exploit_publication_risk |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Case 1** (Foundation) | Step 4 (Entrenchment & Collision) | The Council likely cannot use a 2/3 vote to lower a 3/4 requirement entrenched in the charter; this is a procedural conflict. | "On a plain reading, the charter locks this section behind a higher bar." | lawyer friend | Medium (Council might try anyway if they think they can bully membership). |
  | **Case 2** (Co-op) | Step 3 (Pattern Match - Definitional) | Calling a restriction a "practice" does not necessarily exempt it from the "no rule" clause protecting quiet enjoyment. | "The text does not settle whether a 'practice' counts as a 'rule'." | editor | Low (Specific to one building; unlikely to spawn wider exploits). |
  | **Case 3** (Mutual Aid) | Step 3 (Pattern Match - Borrowed/Interpretation) | This is not a mutual-aid network; it is a stewardship dictatorship with cosmetic voting rights. | "The charter grants the Stewards final authority over its own meaning." | me | High (Publishing this destroys the group's reputation; ensure public interest justification). |

  ***

