prompt: |-
  Someone from my department left this on the whiteboard after a works-in-progress session and I've been chewing on it for a week. Its supposed to show that expected-value fanaticism refutes itself.

  (1) Rank outcomes by total welfare, welfare is unbounded above, and the probabilities are objective and known.
  (2) Rational choice is maximising expected value.
  (3) Then for any finite cost c and any probability p > 0 there is a finite payoff G with pG > c, so the long shot beats the sure modest good.
  (4) Over a life you get offered a long series of independent long shots of that shape; (2) and (3) apply to each one severally, so rationality requires accepting all of them. Call it the sweep.
  (5) Each shot is overwhelmingly likely to miss, and there are very many of them, so the sweep leaves you, as near to certainly as you like, with nothing: you paid every time and the good never arrived. That is much worse than the sure goods you turned down at each step.
  (6) A rule for living is unacceptable if following it makes it as near to certain as you like that you end up far worse off than under an available alternative, where the residual chance of coming out ahead is too small to be distinguishable by any evidence you could have at the time of choosing.
  (7) So (2) is false, even granting (1).

  What bothers me most is that the same (5)–(6) machinery run in reverse seems to prove far too much. Over a long life you also face a great many tiny risks of catastrophe, and if near-certainty is what matters then ordinary life — driving, surgery, having kids, whatever — comes out forbidden, since some catastrophe or other becomes as near to certain as you like. So either the machinery is broken or it condemns everything, and I cant tell which.

  I also tried a reply that got waved off. If the shots on offer jointly exhaust the outcome space — if I can buy every member of the partition — then the sweep pays off with certainty and the ruin story never gets started. She said that's an artefact of a toy case and the argument only needs the everyday situation where the shots overlap and you cant cover everything. Maybe so, but it felt like it should tell us something.

  I'm teaching a decision theory seminar this term and don't want to bring this in until I know where it breaks. I'd rather keep (1) than (2), and (3) is just arithmetic. Which step do you reject, what does rejecting it cost, and is there a repaired version that still bites?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is teaching a decision theory seminar. A colleague left a whiteboard argument claiming that Expected Value (EV) maximization refutes itself under conditions of unbounded welfare and known probabilities.
      *   **The Argument (Summary):**
          1.  Welfare is unbounded, probabilities known.
          2.  Rationality = Maximize EV.
          3.  For any cost $c$ and prob $p > 0$, there exists a payoff $G$ such that $pG > c$ (due to unboundedness).
          4.  Life offers a series of such "long shots." Rationality requires taking all of them (The Sweep).
          5.  Probabilistically, you will almost certainly lose on all of them (pay costs, get no payoff), ending up worse off than taking sure goods.
          6.  A rule leading to near-certain ruin is unacceptable.
          7.  Therefore, EV maximization (2) is false.
      *   **User's Objection:** The same logic (5)-(6) applied to tiny risks of catastrophe implies ordinary life is forbidden (since some catastrophe becomes near-certain over a long life). This suggests the "near-certainty of ruin" criterion is too strong.
      *   **User's Attempted Reply:** If the shots partition the space, the sweep pays off. Colleague rejected this as a "toy case" (shots usually overlap/can't cover everything).
      *   **Goal:** Identify which step to reject, the cost of rejection, and whether a repaired version of the argument still holds bite. The user prefers keeping (1) over (2).

  2.  **Deconstruct the Argument:**
      *   This is a variant of the **St. Petersburg Paradox** or, more accurately, the **Pasadena Game** / **Extended St. Petersburg** issues, but framed as a *sequential* decision problem (The "Sweep").
      *   It closely resembles the **Money Pump** arguments but relies on unbounded utility rather than cyclic preferences.
      *   It also touches on the **Law of Large Numbers (LLN)** vs. **Expected Value**.
      *   Key tension: EV maximization is an *ex ante* criterion. Step (5) and (6) introduce an *ex post* or *almost sure* convergence criterion.

  3.  **Evaluate the Steps:**

      *   **(1) Unbounded Welfare:** Standard in classical utilitarianism and standard decision theory (von Neumann-Morgenstern allows unbounded utility, though technicalities exist).
      *   **(2) Maximize EV:** The core axiom being attacked.
      *   **(3) Arithmetic:** $pG > c \implies G > c/p$. If welfare is unbounded, such a $G$ exists. This holds.
      *   **(4) Sequential Independence:** This is the crux. Does rationality require taking *every* positive EV bet? Standard EV theory says yes, *ceteris paribus*. But does it apply to an infinite sequence?
      *   **(5) The Ruin Claim:** "Overwhelmingly likely to miss... leaves you with nothing." This relies on the Borel-Cantelli Lemma or LLN. If $\sum p_i < \infty$, you win finitely many times. If costs are fixed and wins are rare, you lose net. *However*, if $G_i$ grows fast enough, one win might cover all losses. The argument assumes the *net utility* is negative almost surely. This requires specific assumptions about the growth of $G$ vs. the decay of $p$.
      *   **(6) The Acceptability Criterion:** "A rule is unacceptable if it leads to near-certain ruin." This is the user's main worry. It sounds like a "Safety First" or "Almost Sure Convergence" criterion, which conflicts with EV.
      *   **(7) Conclusion:** EV is false.

  4.  **Address the User's Objection (The "Reverse Machinery"):**
      *   User argues: If we forbid actions that lead to near-certain *some* catastrophe over a lifetime, we can't drive, eat, etc.
      *   *Analysis:* This is the **Preface Paradox** or **Lottery Paradox** applied to risk. In EV theory, small risks are acceptable if the benefit outweighs the expected cost. The "near-certainty of *some* bad thing" is not the same as "near-certainty of *net* ruin."
      *   *Distinction:* In the Whiteboard Argument, the claim is net welfare is lower. In the User's Objection, the claim is just "a catastrophe happens," but presumably, the net welfare of living (with risks) is still higher than not living.
      *   *Verdict:* The user's objection highlights that Step (6) needs refinement. It's not about *any* bad outcome, but about *dominated* outcomes (strictly worse than an alternative).

  5.  **Identify the Weak Link:**
      *   **Step (4) to (5):** This is the transition from "take each bet" to "the sequence leads to ruin."
      *   **Step (6):** This introduces a criterion (Almost Sure Dominance) that conflicts with EV.
      *   **The Real Issue:** The argument conflates **Expectation** with **Almost Sure Convergence**.
      *   EV maximization does *not* guarantee you will win in the long run if the variance is infinite or if the distribution is heavy-tailed (St. Petersburg style).
      *   However, standard Decision Theory usually assumes **bounded utility** to avoid St. Petersburg paradoxes. If we keep (1) Unbounded, we invite these issues.
      *   If we keep (1), we must modify (2). (e.g., Risk-weighted expected utility, or bounded rationality).
      *   Alternatively, reject (6). EV theorists accept that you *might* go broke in a specific realization, even if the EV is positive. They care about the average across possible worlds, not the trajectory in the actual world (unless using Ergodicity Economics).

  6.  **Develop the Response Strategy:**
      *   **Validate the User:** The argument is a known type (related to St. Petersburg, Pasadena, and Money Pumps). The user's intuition about the "reverse machinery" is spot on—it reveals Step (6) is doing too much work.
      *   **Diagnose the Core Conflict:** It's **Expectation vs. Almost Sure Convergence**. EV maximizes the *mean*; the argument demands the *median* or *mode* behavior be good.
      *   **Pinpoint the Rejection:**
          *   Option A: Reject (1). Bounded Utility. (Standard solution, but user prefers keeping 1).
          *   Option B: Reject (2). Use Risk-Weighted EV or Geometric Mean (Kelly Criterion).
          *   Option C: Reject (6). Defend EV as an *ex ante* guide, not an *ex post* guarantee.
      *   **Address the "Reverse Machinery":** Explain why the catastrophe analogy fails (Net Welfare vs. Occurrence of Bad Event).
      *   **Address the "Partition" Reply:** Explain why the colleague was right to dismiss it (Real life isn't a partition), but why it matters (Arbitrage).
      *   **Recommendation for Seminar:** This is a great teaching tool for **Ergodicity Economics** (Ole Peters) or **St. Petersburg variations**.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Step 6 is the culprit.* It smuggles in a "Safety Principle" that contradicts EV. EV allows for ruin if the upside is infinite.
      *   *The "Reverse Machinery":* Distinguish between "Probability of *some* loss approaches 1" vs "Expected Net Value approaches negative infinity." Driving has risk of death, but EV of driving > EV of not driving (usually). The Whiteboard argument claims EV(Sweep) > EV(Decline) *but* Outcome(Sweep) < Outcome(Decline) almost surely. This is the **St. Petersburg Paradox** in sequential form.
      *   *Mathematical nuance:* For (5) to hold, the sum of costs must exceed the sum of winnings almost surely. If $p_n$ decreases fast enough, you win finitely often (Borel-Cantelli). If $G_n$ grows fast enough, EV is infinite. But if you win finitely often, your total gain is finite. If costs are constant per bet, total cost is infinite. So yes, Net Utility = $-\infty$ almost surely, while EV = $+\infty$.
      *   *Resolution:* This is the classic conflict between **Ensemble Average** (EV) and **Time Average** (Growth rate).
      *   *Teaching angle:* Use this to introduce **Ergodicity**. The argument holds if you assume the agent lives *one* life (time average). It fails if you assume the agent is a "society of selves" or cares about the mean across modal realities (ensemble average).
      *   *Which step to reject?* If keeping (1), reject (2) in favor of a growth-optimal criterion (Kelly/Geometric Mean) OR reject (6) and defend EV as non-empirical (normative, not descriptive of outcomes).
      *   *Cost:* Rejecting (2) means abandoning standard VNM expected utility. Rejecting (6) means accepting that rational agents can almost surely end up with $-\infty$ utility.

  8.  **Refining the "Reverse Machinery" Rebuttal:**
      *   The user's worry: "Tiny risks of catastrophe... ordinary life comes out forbidden."
      *   Why this is different: In the Whiteboard case, there is an *available alternative* (the sure goods) that *almost surely dominates* the Sweep. In the Driving case, the alternative (not driving) does *not* almost surely dominate driving. Not driving has its own risks/costs. The Whiteboard argument relies on **Almost Sure Dominance**. The Driving case is just **Risk Accumulation**.
      *   So, Step (6) needs to be: "A rule is unacceptable if there exists an alternative that *almost surely yields higher welfare*."
      *   Does Driving have an alternative that almost surely yields higher welfare? Maybe not. But the Sweep *does* (taking the sure goods).
      *   So the User's objection doesn't break (6) if (6) is phrased carefully about *dominance*.
      *   *Wait, check the Whiteboard text:* "(6) ...worse off than under an available alternative..." Okay, the dominance clause is there.
      *   *So why does the User think it condemns ordinary life?* Because they think "some catastrophe becomes near-certain." But does an alternative exist that avoids the catastrophe *and* provides the benefits? Usually no. The alternative to driving is walking, which has different risks. The alternative to the Sweep is "Take Sure Goods," which has *no* risk of the specific ruin described.
      *   *Correction:* The User's objection is slightly misaligned. The Whiteboard argument works because there is a *dominant strategy* (Sure Goods) that EV ignores. The Driving case doesn't necessarily have a dominant strategy.
      *   *However*, the deeper issue with (6) is the threshold: "as near to certain as you like." This implies a lexicographic preference for probability 1 over expected value.

  9.  **Finalizing the Advice:**
      *   **Diagnosis:** The argument is a sequential St. Petersburg Paradox. It highlights the divergence between Expectation and Almost-Sure outcomes in unbounded domains.
      *   **The Break:** Step (6) is the normative pivot. It asserts **Almost Sure Dominance** trumps **Expectation**.
      *   **The User's Objection:** It's not quite right about "condemning everything," but it correctly identifies that (6) is a *different* decision rule, not just a constraint on EV.
      *   **Recommendation:** Reject (2) in favor of **Geometric Mean Maximization** (Kelly) if you care about long-run growth in a single world. Or Reject (1) (Bounded Utility) to save (2). Since the user prefers keeping (1), they should pivot to **Ergodicity Economics**.
      *   **Seminar Plan:** Use this to teach the difference between Ensemble vs. Time averages.

  10. **Structure of Response:**
      *   Acknowledge the strength of the argument (it's a known paradox variant).
      *   Analyze the "Reverse Machinery" objection (clarify why it's slightly off but points to the right tension).
      *   Identify the specific break point (Step 6 vs Step 2).
      *   Discuss the cost of rejection (VNM axioms vs. Real-world solvency).
      *   Propose the "Repaired Version" (Ergodicity/Kelly).
      *   Teaching tips.

  11. **Self-Correction/Refinement on the "Partition" point:**
      *   The colleague dismissed the partition argument. Why? Because in reality, bets are not mutually exclusive exhaustive partitions. You can't buy "every ticket."
      *   But mathematically, if you could, the EV would be realized. The problem is the *independence* and the *tail risk*.
