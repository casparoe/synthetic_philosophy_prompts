          *   *Divergence:* Interventionism allows us to trace the *actual path*. The failure occurred *via* S. Interventionism cares about the *mechanism* transmitting the influence. Even if H *would* have caused it, H did not *actually* transmit the influence in this run.
          *   *Woodward's view:* Causation requires a connected path. S is connected to Failure. H is not (the path was cut). Therefore S is the cause.
          *   *Why?* Because interventionism looks at the *structure* of dependencies. In the actual world, the variable $ReleaseStatus$ is a function of $ScriptResult$. $HealthCheck$ is downstream or parallel but didn't activate.
