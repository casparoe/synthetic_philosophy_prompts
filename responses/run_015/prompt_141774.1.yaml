  The numbers do not multiply cleanly into the headline figure because the nodes are not probabilistically independent; specifically, accepting (d) strongly correlates with accepting (f). I calculate the probability of the Causal Path ((a)×(b)×(c)×(d) = 0.39) and the Complicity Path ((f) = 0.70) as partially overlapping safeguards. Treating them as independent would yield 0.92, but I discount this to 0.82 to account for the correlation that if one rejects small probabilities in (d), one likely rejects complicity in (f) as well.

  3. **Sensitivity**

  My final number is most sensitive to node (d), the threshold of causal significance. The single argument that would move this term most is a robust philosophical demonstration that moral responsibility requires *actual* difference-making rather than *expected* difference-making, which would drive (d) toward zero and collapse the Causal Path.

  4. **Disagreement Location**

  The gap between your 0.65 and your friend's 0.25 most likely lives in node (d). Your friend likely accepts the math of (a) but intuitively rejects the moral weight of a 1/5000 chance, viewing it as negligible, whereas you grant it sufficient weight to sustain a moral reason.

  5. **Voting and Emissions**

  This answer does not carry over cleanly to voting, where the probability of pivotality is orders of magnitude lower, making node (d) much harder to satisfy; it carries over better to greenhouse gas emissions, which lack the threshold stipulation here but share the diffusion of harm.
