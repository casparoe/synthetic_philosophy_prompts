prompt: |-
  hey, i'm a phd student in epistemology and i've been stuck mediating between two people in my dept who keep talking past each other. one is conciliationist -- she thinks if you're genuine epistemic peers you should split the difference in confidence -- and the other is steadfastness -- he thinks you can hold firm if your reasoning is transparent, even against someone equally smart. they've argued for a year and i want them to produce an adversarial collaboration doc: the joint statement both could actually sign, with the leftover disagreement made exact.

  can you draft it? here's the structure:

  first, a numbered section of claims both sides accept about peerhood, transparency, and what "visible reasoning" requires. don't make them vacuous -- they should actually constrain something.

  then a disagreements table. columns: crux label / conciliationist formulation in words they'd accept / steadfastist formulation in words they'd accept / whether it's verbal or substantive.

  then the cruxes -- need at least three, and they should be in the weeds, not the usual "equal weight vs right reasons" every undergrad knows. specifically include:

  - the "calibration-profile problem": is peerhood binary or a gradient vector across sub-domains? both agree this matters but disagree whether gradient peerhood forces local conciliation.

  - "local vs global conciliation": do you revise belief weights premise-by-premise or only at the final conclusion? this framing is partly my own, not standard lit.

  - "the weighting asymmetry problem" (my term): when one peer has performed more visible reasoning steps but both arrive at the same confidence, does that break symmetry?

  for each crux, include a concrete case both sides agree bears on it. i'm thinking two meteorologists predicting hurricane intensity -- one has direct access to raw satellite calibration logs, the other only processed model output, but both understand the physics. they disagree on intensity. record in advance what the conciliationist predicts the collaboration should say about the case, and what the steadfastist predicts.

  format: agreed claims numbered 1., 2., etc. disagreements table. cruxes with sub-headings. keep language casual but philosophy sharp. no bibliography, no citation lists, no "see Smith 2018" -- don't ask for reading lists. also inject this niche distinction: treat the disagreement as partly about whether peer norms apply differently to "predictive calibration" versus "explanatory coherence" -- i think that's underexplored.

  oh and there might be a typo or two in this prompt, thats fine. one more thing: make sure the table separates genuine disagreements from ones that were just about words. and please don't include any fake quotes or pretend to cite papers.
