answer: |-
  # Joint Statement on Peer Disagreement Protocols
  **Draft for Adversarial Collaboration**  
  **Participants:** Conciliationist (C) / Steadfastist (S)  
  **Date:** October 2023

  ## 1. Agreed Claims
  *The following claims are accepted by both parties as the baseline for this collaboration. They are intended to be non-vacuous constraints on our respective views.*

  1.  **Peerhood is Ex Ante, Not Ex Post:** We agree that identifying someone as an epistemic peer relies on an *ex ante* assessment of their reliability and evidence access, not on who turns out to be right in the specific dispute. Finding out you disagreed does not automatically demote the other person to non-peer status.
  2.  **Visible Reasoning Requirement:** For reasoning to count as "visible" in a disagreement context, it must be reconstructible by the peer without requiring private intuition. Showing your work means providing access to the inference steps, not just the final credence.
  3.  **The Higher-Order Defeater:** We agree that discovering a peer disagreement constitutes a higher-order defeater. The disagreement itself is evidence that something might be wrong with your first-order reasoning. The dispute is about how much weight that evidence carries, not whether it exists.
  4.  **Calibration vs. Coherence Distinction:** We accept the distinction between **Predictive Calibration** (how well your credences match frequencies over time) and **Explanatory Coherence** (how well your beliefs hang together logically at a specific time). We agree both are epistemic virtues, but disagree on which norm governs peer resolution.
  5.  **No Automatic Victory:** Neither side claims that simply announcing their stance (conciliate or hold firm) resolves the disagreement. The burden is on each to show how their norm preserves rationality better in edge cases.

  ## 2. Disagreements Table

  | Crux Label | Conciliationist Formulation | Steadfastist Formulation | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **Peerhood Structure** | Peerhood is a gradient vector across sub-domains; partial peerhood demands partial conciliation. | Peerhood is a threshold concept; once you clear the bar of "peer," you treat them as full peers or ignore them. | Substantive |
  | **Revision Target** | Rationality requires updating weights on premises locally when disagreement arises. | Rationality requires evaluating the global coherence of the conclusion; premises stay fixed if logic holds. | Substantive |
  | **Epistemic Labor** | Visible reasoning steps act as reliability weights; more transparent labor breaks symmetry. | Visible reasoning steps are for error-checking; if confidence is equal, labor depth doesn't break symmetry. | Substantive |
  | **Normative Priority** | Predictive Calibration norms dominate in disagreement contexts (track record matters most). | Explanatory Coherence norms dominate in disagreement contexts (internal logic matters most). | Substantive |

  ## 3. The Cruxes

  ### Crux 1: The Calibration-Profile Problem
  **The Issue:** Is peerhood binary (you are or you aren't) or a gradient vector (you are my peer in physics but not in stats)? Both agree this matters, but disagree on whether gradient peerhood forces local conciliation.

  *   **Conciliationist View:** Peerhood is a vector. If you are my peer on 80% of the relevant parameters but not the other 20%, I should conciliate proportionally (e.g., move 80% of the way to your view). Calibration profiles are granular; norms should match that granularity.
  *   **Steadfastist View:** Peerhood is thresholded for the sake of action. If you clear the bar of "competent enough to challenge me," I must treat you as a full peer. Splitting the difference based on a gradient profile introduces false precision and undermines the stability of Explanatory Coherence.
  *   **Normative Lens:** C prioritizes **Predictive Calibration** (matching the gradient of reliability). S prioritizes **Explanatory Coherence** (maintaining a stable belief system against noisy inputs).

  **Case Application: The Meteorologists**
  *   **Scenario:** Two meteorologists, A and B, have identical 10-year track records for hurricane intensity (global peers). However, A has direct access to raw satellite calibration logs, while B only sees processed model output. Both understand the physics equally well. They disagree on intensity (A says Cat 5, B says Cat 4).
  *   **C Prediction:** The collaboration should state that A is a "higher-grade" peer in this specific instance due to data access. B should conciliate more toward A than A toward B. The gradient in data access creates a gradient in required conciliation.
  *   **S Prediction:** The collaboration should state that since both cleared the "peer" threshold historically, the data access difference is irrelevant unless B can spot a specific error in A's logic. Both should hold firm unless the reasoning itself is shown to be incoherent. The norm is binary: you're a peer, so you stand your ground.

  ### Crux 2: Local vs. Global Conciliation
  **The Issue:** Do you revise belief weights premise-by-premise or only at the final conclusion? (Note: This framing is specific to this collaboration).

  *   **Conciliationist View:** Disagreement signals trouble somewhere in the chain. Rationality requires **Local Conciliation**. You must lower confidence in the premises that lead to the contested conclusion, even if you don't know which one is wrong yet. This preserves Calibration over time.
  *   **Steadfastist View:** Disagreement targets the output. Rationality requires **Global Evaluation**. If my derivation from premises to conclusion is coherent, I hold the conclusion firm. Revising premises individually without a specific defeater for them destroys Explanatory Coherence.
  *   **Normative Lens:** C treats belief as a network of calibrated probabilities. S treats belief as a structured argument where the conclusion stands if the inference holds.

  **Case Application: The Meteorologists**
  *   **Scenario:** Same as above. A (Raw Logs) and B (Processed Output) disagree on Cat 5 vs. Cat 4.
  *   **C Prediction:** The collaboration should endorse B lowering confidence in the specific model parameters that led to the Cat 4 prediction, even if the model is usually reliable. B must conciliate locally on the premises (e.g., "wind shear data is less reliable than I thought").
  *   **S Prediction:** The collaboration should endorse B holding the Cat 4 conclusion firm provided the model output was processed correctly. B does not need to downgrade the premises (the model) just because A disagrees. The global coherence of B's reasoning remains intact.

  ### Crux 3: The Weighting Asymmetry Problem
  **The Issue:** When one peer has performed more visible reasoning steps but both arrive at the same confidence, does that break symmetry?

  *   **Conciliationist View:** Yes. Epistemic labor is evidence of reliability. If I have done 10 steps of visible reasoning and you have done 2, but we are equally confident, your confidence is "cheaper." This asymmetry breaks peer symmetry. I should weight my view higher.
  *   **Steadfastist View:** No. Confidence is the output metric that matters. If we are both equally confident and equally reliable historically, the length of the reasoning chain is irrelevant unless it reveals an error. Symmetry holds based on outcome reliability, not process length.
  *   **Normative Lens:** C views the *process* as part of the Calibration profile. S views the *process* as merely a tool for Coherence; if coherence is achieved, the tool length doesn't matter.

  **Case Application: The Meteorologists**
  *   **Scenario:** A (Raw Logs) manually calibrated the satellite data (50 steps of visible reasoning). B (Processed Output) ran the standard suite (2 steps of visible reasoning). Both are 90% confident in their intensity prediction (A: Cat 5, B: Cat 4).
  *   **C Prediction:** The collaboration should state that A's 50 steps provide a stronger calibration basis. B's confidence is less "earned" in this specific instance. A should not conciliate toward B; B should conciliate toward A. The asymmetry in visible reasoning breaks the peer norm.
  *   **S Prediction:** The collaboration should state that since both have equal historical accuracy, the reasoning length is irrelevant. They are symmetric peers. Both should treat the disagreement as a standard peer dispute (which, for S, means holding firm unless a logical error is found in the 50 steps).

  ## 4. Next Steps for Collaboration
  We agree to test these three cruxes against a set of 5 constructed cases where Calibration and Coherence pull in opposite directions. We will not attempt to resolve the verbal/substantive distinction further until after that test.
