answer: |-
  ### The three-layer map

  The **Frame Message** was the TASS announcement framing Sputnik as a contribution to the International Geophysical Year, targeting the Soviet public and global non-aligned nations to legitimize the regime. The **Outer Message** was the physical signal: the 20.005 MHz radio beeps and orbital telemetry accessible to any receiver. Western ham radio operators decoded this layer simply as proof of orbit. The **Inner Message**, however, was the strategic implication of the R-7 rocket's lift capacity: viable ICBM delivery for nuclear warheads. Derived from launch physics, not the beeps, it targeted US Intelligence and the NSC. While the Frame asked the world to hear "science," the Outer Message allowed adversarial decoders to bypass the Frame entirely and read the Inner Message as "intercontinental threat." The Frame succeeded domestically; the Inner Message succeeded strategically. The separation relies on the decoder's prior knowledge: hams heard beeps, intelligence heard delivery systems. Hofstadter's scheme requires the Frame to instruct the decoder, but here the Frame instructed one audience (citizens) while the Outer Message instructed another (analysts). The Inner Message existed latent within the Outer layer, waiting for a decoder with the specific cryptographic key of ballistic missile knowledge. Thus, the message split across communities.

  ### The decoder problem

  Comparing the TASS announcement to a DNA start codon reveals a critical divergence. A start codon is structural; it universally triggers translation machinery regardless of context. The TASS Frame was rhetorical, not structural; it was an attempt at cognitive control, not a functional key. In GEB, the Frame enables the Inner Message. In Sputnik, the Frame attempted to *suppress* the true Inner Message (war) with a false one (peace). For the US NSC, the TASS Frame was irrelevant noise; they decoded the Inner Message directly from the Outer Message (physics) without needing the Soviet Frame. Thus, the TASS announcement was PR, not a start codon. It lacked the structural necessity to unlock the signal. A ribosome cannot ignore a start codon; the Pentagon ignored TASS. This highlights that geopolitical frames are optional overlays, whereas biological frames are mechanistic prerequisites. The analogy breaks because biological decoders are evolved to accept the frame, while intelligence decoders are trained to suspect it. Hofstadter assumes a universal decoder; Sputnik proves decoders are fragmented by ideology. The start codon is invariant; the TASS frame was contingent on political acceptance. If the biological frame fails, translation stops. If the geopolitical frame fails, interpretation shifts to hostility. The structural role is absent because the receiver holds the power to redefine the message.

  ### Bottom line for the framework

  This episode stresses Hofstadter's framework by exposing its assumption of cooperative decoding. In GEB, messages often presume a shared context or aesthetic sensibility. Sputnik demonstrates that in adversarial systems, the Frame does not govern the decoding process. The Inner Message is not what the sender intends, but what the receiver can weaponize. It does not prove inner messages are always threats, but it shows that in high-stakes geopolitics, the "Inner Message" is defined by the receiver's capability to exploit the Outer Message, regardless of the Frame. The distinction collapses when audiences are hostile; the Frame becomes mere camouflage rather than a decoding key. Hofstadter's model requires an additional variable: the relationship between sender and receiver. When trust is zero, the Frame is bypassed, and the Outer Message is scanned directly for latent Inner Messages the sender might deny. The framework holds, but only if it accounts for adversarial decryption.
