      *   **Key Pillars to Translate:** Coordination, Mutual Expectation, Arbitrariness, Conventional Normativity.
      *   **Residue Report:** What translates cleanly? What requires distortion? What has no expression?
      *   **Specific Focus:** Can Lewis's normative "ought" be reconstructed as precision-weighted prediction error without propositional attitudes?
      *   **Assessment:** Does the residue show a limitation of AI (collapsing conventionality into homogeneity) or reveal Lewis was implicitly relying on coupled dynamics?
      *   **Constraints:** No citations, bibliographies, or page references. Keep the translation honest (don't let PP assumptions do work Lewis assigns to common knowledge).

  2.  **Deconstruct Lewis's Core Position (Mental Sandbox):**
