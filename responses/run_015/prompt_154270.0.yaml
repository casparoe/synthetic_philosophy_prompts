      *   *Coordination:* In PP, this is about minimizing free energy in a coupled system. If I predict you will do $A$, and you predict I will do $A$, our actions align to minimize the error between our models and the sensory data generated by our interaction. It's a multi-agent free-energy minimization problem.
      *   *Mutual Expectation:* This maps to *reciprocal precision weighting*. I assign high precision to the hypothesis "Agent B will do $A$." Agent B assigns high precision to "Agent A will do $A$." This isn't just a prior; it's a gain control on the prediction error.
      *   *Arbitrariness:* In AI, solutions are attractors. Arbitrariness means the landscape has multiple, equally deep basins of attraction. The system settles into one, but the *shape* of the landscape allows for others. The history of the system (path dependence) selects the basin, not the intrinsic energy of the state itself.
      *   *Normativity:* This is the hardest. Lewis's "ought" is normative. In PP, "ought" usually looks like "expected." To make it normative, deviation must incur a high cost (high prediction error) that triggers corrective action (sanctioning or re-alignment). It's a precision-weighted error signal that demands resolution.

