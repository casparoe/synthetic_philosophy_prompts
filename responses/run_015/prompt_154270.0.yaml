  9.  *(Self-Correction on Normativity)*: I need to be very precise here. Lewis's "ought" is conditional ("If you want to coordinate, you ought..."). PP's "ought" is imperative ("Minimize free energy"). The translation works if we view the convention as a *prior* that structures the space of permissible actions. Deviation creates high error. The "ought" is the pressure to minimize that error. But is it *normative* in the philosophical sense? I will argue it captures the *force* but maybe not the *justification*.

