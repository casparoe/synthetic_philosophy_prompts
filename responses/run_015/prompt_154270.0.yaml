      *   *Arbitrariness Issue:* If agents have distinct evolutionary/learning histories, are the priors truly arbitrary? PP suggests priors are always shaped by history. Lewis's "arbitrary" means "could have been otherwise *given the problem structure*," not "uncaused." I need to clarify this. The *solution* is arbitrary relative to the *payoff structure*, even if the *selection* is determined by history.
