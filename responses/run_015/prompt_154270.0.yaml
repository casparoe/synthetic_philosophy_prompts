      *   *Behavior:* Active inference (action to minimize variational free energy).
      *   *Coordination:* Coupling of dynamics. Minimizing surprise jointly.
      *   *Expectations:* Priors (deep priors vs. shallow priors). Precision weighting determines which prediction errors drive updates.
      *   *Common Knowledge:* Shared sensory states? Synchronized precision? (This is the tricky part).
