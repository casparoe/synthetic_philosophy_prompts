      *   *Is it distinct from Narrative Fallacy?* Taleb's narrative fallacy is about *causality* (A caused B). White's emplotment is about *meaning/type* (This was a Tragedy). The user's intuition is sharp: knowing *how* it ended changes *what* the beginning meant.
      *   *Verdict:* It's a strong pedagogical hook, but needs to be anchored in White/Kermode so the TA doesn't claim to have invented something that exists in literary theory/historiography. I should validate the intuition but provide the existing vocabulary so they look well-read, not reinventing the wheel.

