  2.  **Analyze the Ellsberg Paradox (Ambiguity vs. Risk):**
      *   *Setup:* Urn A (50 red, 50 black) vs. Urn B (100 balls, unknown ratio).
      *   *Observation:* People prefer betting on Urn A over Urn B, even if the expected value is mathematically identical under the Principle of Insufficient Reason (50/50 assumption).
      *   *User's Point:* "Just assign a probability." This is the Savage/Subjective Expected Utility (SEU) defense. If I believe it's 50/50, I should act the same as the known 50/50 urn.
      *   *Counter-argument:* People *know* they don't know. Assigning a precise number (0.5) feels false. It's not just about the number; it's about the *confidence* in the number.
      *   *Key Distinction:* Risk = Known probabilities. Ambiguity = Unknown probabilities (uncertainty about the probabilities themselves).
      *   *Is it Risk Aversion?* No. Risk aversion is curvature in the utility function (diminishing marginal utility of wealth). Ambiguity aversion is about the *source* of uncertainty. You can be risk-neutral but still ambiguity-averse.

  3.  **Analyze the Allais Paradox (Certainty Effect):**
      *   *Setup:* Choice between sure thing vs. gamble, then choice between two gambles.
      *   *Observation:* People violate the Independence Axiom of Expected Utility Theory. They overweight certainty.
      *   *Mechanism:* Probabilities are known, but human psychology weights them non-linearly (Prospect Theory).
      *   *Relation to EU:* It breaks the math of Expected Utility directly.

  4.  **Compare the Two (The "Harder Problem" Question):**
      *   *Ellsberg:* Challenges the idea that *all* uncertainty can be quantified as a single probability distribution. It suggests we need a second-order probability or a different framework (e.g., Maxmin Expected Utility). It attacks the *representation of belief*.
      *   *Allais:* Challenges how we *weight* known probabilities. It suggests the utility function or probability weighting function is non-linear. It attacks the *calculation of value*.
      *   *Which is harder?*
          *   Allais is "easier" to fix mathematically (e.g., Rank-Dependent Utility, Prospect Theory). We just tweak the weighting function.
          *   Ellsberg is "harder" philosophically and mathematically because it questions the very foundation of Bayesianism (that everything can be assigned a precise probability). It requires a more fundamental shift in how we model the mind/world interface.
          *   *However*, from a normative standpoint (how people *should* act), many argue Ellsberg is irrational (you *should* assign a probability), whereas Allais is clearly a cognitive bias (certainty effect). But descriptively, both are robust.
          *   *Consensus:* Ellsberg is generally considered the deeper challenge to *rationality* defined by Savage/Bayes, while Allais is a challenge to *consistency* within a known probabilistic framework.

