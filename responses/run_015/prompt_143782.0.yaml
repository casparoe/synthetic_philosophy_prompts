answer: |-
  To the Members of the Electoral Law Commission,

  You have asked for an analysis of our institutional record to determine which principle should govern the proposal for compulsory municipal voting. Our precedents are rich but not univocal; they sustain two competing conceptions of the franchise. Below, I set out the principles that best fit our history, their predictions for the current proposal, my recommendation, and a strategic suggestion for future agenda-setting.

  ### I. Competing Principles

  Three principles fit our precedents with roughly equal explanatory power, yet they diverge on the question of compulsory voting for new cohorts.

  **1. The Principle of Symmetric Obligation**
  *   **Formulation:** Where the law grants the right to authorize a government, it imposes a correlative duty to participate in that authorization, provided a formal exit (abstention) exists. Liability to the law entails liability for its legitimation.
  *   **Fit with Precedents:** This explains **Precedent 4** (mandatory enrollment with a fine) and **Precedent 2** (non-citizens vote locally because they are subject to local law). It aligns with **Precedent 5** (prisoners serving <1 year vote), suggesting that minor breaches of the law do not forfeit the duty-right bundle.
  *   **Prediction for Proposal:** Supports **Compulsory Voting** for all registered voters. Once the threshold for entry is crossed (age 16, 3 years residence), the duty attaches immediately.
  *   **Prediction for Cohorts:**
      *   *16–17-year-olds:* Subject to municipal bylaws; therefore, subject to the duty.
      *   *Non-citizen residents:* Subject to municipal taxation and regulation; therefore, subject to the duty, regardless of naturalization prospects.

  **2. The Principle of Graduated Integration**
  *   **Formulation:** The franchise is not merely a status but a function of civic capacity and social embeddedness. Both rights and duties should scale with the voter's demonstrated stability and maturity within the polity.
  *   **Fit with Precedents:** This explains **Precedent 1** (age 16 local vs. 18 national), **Precedent 3** (expat voting decays after 15 years), and **Precedent 5** (prisoners serving >1 year lose the vote). It treats the franchise as a relationship that deepens or weakens over time.
  *   **Prediction for Proposal:** Supports the **Probationary Franchise**. New entrants require a period of acclimatization where they hold the right without the coercive burden of the duty.
  *   **Prediction for Cohorts:**
      *   *16–17-year-olds:* Developmental capacity is still forming; duty should be delayed until age 18 or after two cycles.
      *   *Non-citizen residents:* Integration is incomplete; duty should attach only after proven long-term residence (e.g., after the probationary period).

  **3. The Principle of Status Consistency**
  *   **Formulation:** Once a class of persons is admitted to the electoral roll, they must be treated as formal equals. Internal hierarchies among voters (e.g., "probationary" vs. "full" voters) are impermissible.
  *   **Fit with Precedents:** This strongly explains **Precedent 2** (we rejected scaling residence requirements by likelihood of naturalization) and **Precedent 6** (rejected proxy voting; every voter acts personally). It prioritizes the integrity of the roll over administrative convenience or paternalism.
  *   **Prediction for Proposal:** Supports **Compulsory Voting**. Creating a "probationary" class creates a two-tier electorate, violating the equality of status granted upon enfranchisement.
  *   **Prediction for Cohorts:**
      *   *16–17-year-olds:* If they are voters, they are voters *simpliciter*, not "voters-in-training."
      *   *Non-citizen residents:* If they are on the roll, they bear the same incidents of office as citizens.

  ### II. Recommendation

  **I recommend the Commission adopt the proposal for Compulsory Voting (with the formal declaration of abstention option) for all registered voters.**

  **Reasoning:**
  While *Graduated Integration* explains our thresholds (Precedents 1, 3, 5), *Status Consistency* explains our treatment of those *already over the threshold* (Precedent 2). The most robust signal in our record is the rejection of scaling rights based on future trajectory or perceived capacity once the baseline is met. In Precedent 2, we explicitly refused to distinguish between non-citizens likely to naturalize and those who were not. To now impose a probationary duty on these same cohorts would reintroduce the very hierarchy we previously rejected.

  Furthermore, the proposal includes a "formal declaration of abstention." This satisfies the liberty concern found in Precedent 4 (no compulsory voting national) by ensuring the duty is to *participate in the process*, not to *choose a candidate*. This aligns the municipal duty with the national mandatory enrollment rule.

  **Closest Analog:**
  **Precedent 2 (Non-citizen residents).** In that ruling, we determined that lawful residence creates a sufficient stake for full voting rights, explicitly rejecting the argument that rights should be calibrated by the resident's likelihood of permanent integration. Applying a probationary duty now would contradict that logic by calibrating duties based on the voter's "maturity" or "permanence."

  ### III. Underdetermination and Future Commitments

  Our record genuinely underdetermines this decision. Precedent 1 (developmental thresholds) pulls toward probation, while Precedent 2 (equal status) pulls toward compulsion. Your choice will commit the Commission to a specific philosophy of voting that will constrain future rulings, particularly regarding national compulsory voting.

  **If you choose Compulsion:**
  *   **Principle Adopted:** Voting is a **Civic Duty of Subjection**.
  *   **Commitment:** You commit to the view that liability to law generates a duty of legitimation. This creates significant pressure to extend compulsory voting to the **national level** eventually. If the duty arises from subjection to law, and citizens are subject to national law, the distinction between local and national compulsion rests *only* on the "stakes" argument from Precedent 1. You will need to articulate why national stakes justify *voluntarism* while local stakes justify *coercion*, which is a difficult philosophical sell.

  **If you choose Probation:**
  *   **Principle Adopted:** Voting is a **Privilege of Competence**.
  *   **Commitment:** You commit to the view that voting is a skill to be demonstrated, not a duty of membership. This makes **National Compulsory Voting** philosophically incoherent for your Commission later. If voting requires a probationary period to learn, it cannot be a universal duty. This option preserves the status quo (Precedent 4) but weakens the normative force of the franchise for new entrants.

  ### IV. The Separating Case

  To settle the principle rather than the proposal, I recommend placing the following matter on the agenda for the subsequent session:

  **Whether 16- and 17-year-olds count toward the statutory quorum for a valid municipal election.**

  *   **Why this separates the principles:**
      *   If **Yes**: It affirms **Symmetric Obligation/Status Consistency**. They are full constituents whose presence legitimizes the election, implying they should bear the full duties of constituents (compulsion).
      *   If **No**: It affirms **Graduated Integration**. They are beneficiaries of the election but not full architects of its legitimacy, implying their duties should remain limited (probation).

  This case isolates the question of *status* from the question of *coercion*, allowing you to define the voter before you define the penalty.
