          *   *Tension:* If dementia wipes out memory, character, and plans (the criteria in Belief 2), then logically, under Belief 2, she *is* a different person (or the person has ceased). Belief 3 tries to have it both ways: "Identity is psychological" BUT "She's still the same person despite losing psychology."
          *   *Severity:* High. This is a direct contradiction in the definition of identity.

      *   *Belief 1 (AD Authority) vs. Belief 4 (Current Wishes):*
