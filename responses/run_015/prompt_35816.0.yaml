          *   *Cost:* Morally unsettling. Feels like abandoning her.
          *   *Recommendation:* Modify Belief 2. Identity isn't all-or-nothing. It's a fading gradient. Or shift to a "Best Interests" standard for the current self vs. "Precedent Autonomy" for the past self.

      *   *Fixing Rank 2 (Authority):*
