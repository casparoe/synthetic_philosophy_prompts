answer: |-
  Your "double-ledger" framing is a sophisticated articulation of the **agent-relative/agent-neutral distinction** found in contemporary deontology (most notably associated with Thomas Nagel and Samuel Scheffler). It attempts to solve the "paradox of deontology" (why it is wrong to kill one to save five, even if the outcome is worse) by positing incommensurable normative domains.

  For this resolution to hold, the two ledgers must remain genuinely distinct and non-tradable. If they can be converted into a common currency, the view collapses into a form of consequentialism (e.g., one where "integrity" is just a very heavy value). If they cannot be traded at all, the view risks absurdity (never killing one even to save a million).

  Here are the defeaters mapped and ranked by their threat level to the coherence of your framing, followed by an assessment of defender responses and the risk of unfalsifiability.

  ### I. Ranked Defeaters

  #### 1. The Threshold Collapse (Concrete Cases & Line-Drawing)
  **Threat Level: Critical**
  This is the most potent empirical defeater. It attacks the claim that there is "no single currency."
  *   **The Argument:** Almost no deontologist holds that agent-centered constraints are absolute. Most concede a "threshold" where the catastrophic nature of the outcome-ledger overrides the integrity-ledger (e.g., you may not torture one to save five, but you might to save a million).
  *   **The Failure:** The moment you admit a threshold, you admit a **conversion rate**. You are implicitly saying that $X$ amount of outcome-value equals $Y$ amount of integrity-value. This reintroduces a single metric (a super-currency) that weighs both ledgers against each other. If the ledgers can be weighed against each other, they are not incommensurable; the "double-ledger" is just a obfuscated single-ledger with a complex weighting function.
  *   **Why it ranks first:** It forces the view to either accept absurdity (absolutism) or admit commensurability (consequentialism).

  #### 2. The Unity of Practical Reason (Decision Theory & Psychology)
  **Threat Level: High**
  This attacks the psychological and formal coherence of maintaining two ledgers during deliberation.
  *   **The Argument:** Standard decision theory (and Dutch Book arguments) suggests that a rational agent must have a unified preference ordering to avoid exploitation or inconsistency. If an agent treats Ledger A as lexicographically prior to Ledger B *unless* condition C obtains, they are effectively running a single algorithm.
  *   **The Failure:** Moral psychology suggests humans do not naturally compartmentalize reasoning this way. When we deliberate, we weigh "how bad the act is" against "how bad the result is" simultaneously. Positing a structural separation in the *logic* of morality that contradicts the *phenomenology* of reasoning renders the theory action-guiding only by stipulation. If practical reasoning necessarily integrates all considerations into a unified ordering (as argued by proponents of rational unity), the "two-ledger" model is a descriptive error.
  *   **Why it ranks second:** It challenges the possibility of the proposed cognitive architecture, though moral philosophers often reject economic rationality as the standard for moral reasoning.

  #### 3. The "Hidden Consequentialism" Charge (Ad Hoc Stipulation)
  **Threat Level: Medium-High**
  This attacks the theoretical motivation for the distinction.
  *   **The Argument:** If the integrity-ledger exists solely to block certain optimizations of the outcome-ledger, is it not just a rule designed to maximize outcome-value in the long run (Rule-Consequentialism) or a proxy for "what we can demand of each other" (Contractualism)?
  *   **The Failure:** If the justification for the integrity constraint is that respecting it leads to a better world (e.g., a world where rights are secure), the view collapses into Indirect Consequentialism. If the justification is *not* outcome-based, it risks being an arbitrary "brute fact." Defenders must explain *why* integrity matters without referencing the good it produces, which often leads to circularity ("it matters because it is a constraint").
  *   **Why it ranks third:** It is a theoretical critique that can often be parried by insisting on the intrinsic value of agency, whereas the Threshold Collapse is harder to dodge.

  #### 4. Redundancy via Normative Developments (Contractualism/Virtue)
  **Threat Level: Low-Medium**
  This argues the double-ledger is unnecessary rather than false.
  *   **The Argument:** Newer frameworks like Scanlonian Contractualism ("what we owe to each other") or Virtue Ethics can explain the intuition behind constraints without positing distinct ledgers. For Scanlon, you cannot kill the one because they could reasonably reject a principle allowing it. This achieves the deontological result without needing a metaphysical "integrity ledger."
  *   **The Failure:** This doesn't prove the double-ledger view *false*, only that it is theoretically inefficient (violating Occam's Razor). However, if the double-ledger adds no explanatory power over contractualism, its utility diminishes.
  *   **Why it ranks fourth:** It offers competition, not refutation.

  ---

  ### II. Defender Responses: Concede vs. Dismiss

  If a proponent of the double-ledger view (e.g., a Nagelian or Schefflerian deontologist) were confronted with these defeaters, their responses would likely split as follows:

  **What They Should Concede:**
  *   **The Existence of Thresholds:** Defenders must concede that the integrity-ledger is not absolute. To deny this is to embrace moral absurdity (letting the world burn to keep one's hands clean).
  *   **The Interaction Problem:** They must concede that the ledgers *do* interact at the margins. They cannot claim total isolation. The concession required is that the "no common currency" claim is a heuristic for normal cases, not a metaphysical absolute for all cases.

  **What They Would Dismiss:**
  *   **Decision Theory Objections:** Defenders will dismiss the application of economic decision theory to moral reasoning. They argue moral rationality is distinct from instrumental rationality. They would claim that being "Dutch Booked" in a moral context is not a failure of rationality but a feature of holding principled commitments.
  *   **Redundancy Arguments:** They would dismiss Contractualism as failing to capture the *agent-relative* force of the constraint. Contractualism is often agent-neutral in structure (what *anyone* could reject); the double-ledger view insists the constraint binds *me* specifically because *I* am the agent. They would argue redundancy claims miss this specific phenomenological feature.

  ---

  ### III. The Unfalsifiability Trap

  You ask: *If every counterexample is met by reassigning it to the wrong ledger, is that insulation a virtue or a fatal flaw?*

  **Assessment: It is a Fatal Flaw.**

  If the theory operates such that:
  1.  When the constraint holds, it is because the Integrity Ledger was dominant.
  2.  When the constraint fails (threshold cases), it is because the Outcome Ledger overrode it.
  3.  There is no independent metric for predicting *which* ledger wins in advance...

  ...then the theory is **tautological**. It describes the data (our intuitions) without explaining the mechanism. It becomes a "just-so" story: "We feel constrained here because Integrity matters; we feel permitted there because Outcomes mattered."

  **Virtue vs. Flaw:**
  *   **As a Virtue:** In some Wittgensteinian or particularist readings, this insulation protects the nuance of moral life from the Procrustean bed of utilitarian calculation. It acknowledges that moral reasoning is messy and resists systematization.
  *   **As a Flaw:** For a normative theory aiming to guide action or resolve paradoxes, this is fatal. A theory that can accommodate any outcome by adjusting the weight of the ledgers post-hoc has no predictive or prescriptive power. It dissolves the paradox only by declaring the terms of the paradox inapplicable, without explaining *why* they are inapplicable in a principled way.

  To avoid this, the defender must provide a **principled account of the threshold**. They must explain *why* the integrity ledger yields at 1,000,000 lives but not at 5, without simply appealing to intuition. Most fail to do this.

  ---

  ### IV. Honest Assessment: Have These Defeaters Already Appeared?

  **Yes, extensively.** The "double-ledger" resolution is the standard move in analytic deontology, and the defeaters mapped above constitute the last 40 years of meta-ethical debate.

  1.  **The Threshold Collapse:** This is the central argument of **Shelly Kagan's *The Limits of Morality* (1989)**. Kagan argues precisely that agent-centered restrictions are indefensible because they cannot account for thresholds without collapsing into consequentialism. He forces the dilemma: either constraints are absolute (absurd) or they have thresholds (collapsing into a weighting system).
  2.  **The Unity of Reason:** **Michael Smith** and other moral realists have argued that moral reasons must fit into a unified normative framework. If agent-relative reasons cannot be integrated into a coherent view of what is "good," they are irrational.
  3.  **The "Hidden Consequentialism" Charge:** This is the standard critique from **Rule-Utilitarians** (e.g., **Brad Hooker**). They argue that if your "integrity constraints" generally produce the best outcomes, you should just be a Rule-Utilitarian. If they don't, why hold them?
  4.  **Redundancy:** **T.M. Scanlon's *What We Owe to Each Other* (1998)** was explicitly designed to capture deontological intuitions without relying on "agent-relative values" that look metaphysically queer. Scanlon argues the double-ledger is unnecessary machinery.

  **Conclusion:**
  Your framing is a robust restatement of the **Agent-Relative/Agent-Neutral** distinction. However, it has not dissolved the paradox; it has merely renamed the terms of the stalemate. The paradox persists because the **Threshold Collapse** remains unresolved. Defenders of the double-ledger view have not successfully explained how the ledgers remain incommensurable while simultaneously interacting to produce threshold judgments. Until a principled metric for that interaction is provided, the view remains vulnerable to the charge that it is a **consequentialism in disguise**, where "integrity" is simply a variable with a very high, but finite, coefficient.
