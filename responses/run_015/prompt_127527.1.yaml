  6.  **Drafting the Content (incorporating British English):**

      *   *Vocabulary:* Programme, centre, favour, analyse, colour, modelling.
      *   *Tone:* Academic, precise.
      *   *Key Concept:* "The Sanitisation of Ambition". Ambition is allowed only *after* service, not *during*.
