answer: |-
  This institutional design presupposes a distinctive political theory that might be termed **Experiential Sortitarianism**. It rests upon a tripartite conception of legitimacy, competence, and corruption that diverges sharply from both liberal electoralism and traditional technocracy.

  ### Reconstruction of Implicit Commitments

  **1. Theory of Representation: Descriptive Legitimacy over Electoral Mandate**
  The system holds that legislative legitimacy derives from **descriptive representation** (the council mirroring the populace via lot) rather than **authorisation through competition** (elections). By selecting councillors by lot for single, non-renewable terms, the design asserts that the 'will of the people' is best captured by a statistical microcosm acting without the distortion of re-election incentives. Legitimacy is thus inherent in the method of selection, not in a retrospective verdict by voters.

  **2. Theory of Competence: Experiential vs. Technocratic**
  The design rejects the notion that governance requires pre-existing technocratic expertise (degrees, civil service exams). Instead, it posits that **competence is endogenous to service**. One learns to govern by governing. However, this competence is deemed dangerous if held by those seeking electoral favour. Therefore, the system creates a 'delayed career' model: citizens acquire statecraft during their amateur legislative term, and only *after* exiting the legislative sphere are they permitted to monetise or professionalise that experience within the administration. Governance requires accumulated expertise, but that expertise must be harvested from amateur service, not imported from outside.

  **3. The Moral Hazard of Ambition: Electoral Contagion**
  The central moral premise is that **corruption attaches specifically to electoral incentives**, not to institutional power itself.
  *   **The Mayor:** Directly elected, thus susceptible to populism, patronage, and short-termism. Strict term limits contain this hazard.
  *   **The Councillor:** Selected by lot, thus immune to electoral debt.
  *   **The Administrator:** Former councillors are deemed 'safe' careerists because their ambition is retroactive. They cannot use administrative power to secure re-election (as they are term-limited from the council) nor did they use electoral campaigns to secure the administrative post (as they were barred if they held prior *elected* office, i.e., the Mayoralty).
  The system assumes that ambition is toxic only when it is *prospective* (seeking future votes). Once the possibility of election is removed, ambition becomes a benign driver of administrative efficiency.

  ### Strict Requirements vs. Accommodations

  To distinguish the core logic from pragmatic compromises:

  *   **Strictly Required:**
      1.  **The Firewall between Electoral and Administrative Power:** No individual who has subjected themselves to an electoral contest (the Mayor) may wield long-term administrative power. This is non-negotiable under the theory of 'Electoral Contagion'.
      2.  **The Non-Renewable Legislative Term:** Councillors must not be eligible for re-selection by lot. If they could return to the council, their administrative career would create a conflict of interest, effectively recreating a career politician class.
      3.  **The Experiential Link:** Administrative eligibility *must* depend on prior legislative service. A standard meritocratic bureaucracy would violate the premise that competence is derived from democratic deliberation.

  *   **Merely Accommodated:**
      1.  **The Elected Mayor:** A pure application of this theory would likely select the executive by lot or appoint them from the ex-councillor pool. The retention of a directly elected Mayor is a concession to the perceived need for visible, accountable leadership or crisis management, which pure sortition is often thought to lack. It accommodates the demand for a 'face' of the government without surrendering the long-term administrative state to electoralism.
      2.  **The Civil Service Structure:** The existence of a distinct 'track' implies a bureaucracy. A more radical version might simply exfiltrate ex-councillors into various agencies without a formalised career ladder. The formal track accommodates the need for institutional memory without violating the anti-careerist principle.

  ### Justification of Alternative Systems

  **Could these premises justify Pure Sortition?**
  Only partially. The premises value the *accumulation of expertise* for governance (the civil service track). Pure sortition, typically involving full rotation with no carry-over, would waste the 'human capital' generated during the council term. This hybrid system argues that while *legislation* should be amateur, *administration* benefits from the specific experience of having legislated. Pure sortition would be too amateurish for the governance function as defined here.

  **Could these premises justify a Fully Professional Bureaucracy?**
  No. A Weberian professional bureaucracy selects based on technical credentials and political neutrality, explicitly excluding political experience. This system demands **political experience** as the primary credential. It assumes that understanding the legislative intent (gained as a councillor) is more valuable than technical neutrality. A standard professional bureaucracy would violate the commitment that competence is learned through democratic participation, not technical training.

  ### Falsification and Weaknesses

  **Consideration that would Overturn this Reconstruction:**
  The reconstruction relies on the assumption that **electoral ambition is the sole or primary source of corruption**. If empirical observation demonstrated that ex-councillors, once in the civil service, utilise their position to cultivate patronage networks, influence future lotteries, or leverage administrative power to benefit their social factions *without* needing re-election, the theory collapses. Specifically, if the 'administrative track' becomes a shadow legislature where ex-councillors undo the decisions of current councillors to protect their own legacy or class interests, the distinction between 'electoral' and 'institutional' corruption proves false. The system presupposes that power without the vote is benign; if power without the vote proves predatory, the design is fundamentally flawed.

  **Weakest Point in Reasoning:**
  The most vulnerable aspect of this analysis is the assumption that **short-term legislative service confers sufficient administrative competence**. The design presumes that a single term on a council equips a citizen to be a career administrator. This risks conflating *political judgment* (weighing values) with *managerial capability* (implementing policy). If the ex-councillors prove incompetent at administration despite their legislative experience, the 'Experiential' theory of competence fails, and the system merely replaces technocratic elitism with amateurish inefficiency, without gaining the purported moral purity. Furthermore, the reasoning assumes the 'lot' is truly random and unmanipulable; if the selection process is captured, the entire legitimacy claim evaporates.

  ### Conclusion

  This hybrid regime posits that democracy is corrupted by the *anticipation* of elections, not by the *exercise* of power. It seeks to sanitise ambition by deferring it: one may build a career in the state, but only after one has served the state without hope of reward. It is a system that trusts the citizen's judgment when amateur, trusts the official's skill when experienced, but distrusts the politician's motive when electoral.
