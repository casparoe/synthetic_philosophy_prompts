answer: |-
  This is a profound question that cuts to the bone of practical rationality. You are describing a situation where the standard machinery of decision theory—weighing costs and benefits based on stable preferences—breaks down because the *weights* themselves are the output of the decision, not the input.

  You are right to reject "adaptive preferences" and "hedonic treadmill." Those concepts assume there is a "true" baseline of well-being or desire that is being distorted or reset. Your intuition is correct: the problem here isn't distortion; it's *constitution*. The decision doesn't just change how you feel; it changes *who is feeling* and *what counts as a reason*.

  Here is the brainstorming process you asked for, moving from the near-misses to the precise fit.

  ### 1. Brainstorming Nearby Concepts

  1.  **Adaptive Preferences (Jon Elster / Martha Nussbaum):** This is the idea that agents unconsciously scale down their desires to match their feasible options (the "fox and the grapes").
      *   *Why I reject it:* Adaptive preference theory assumes a distinction between "authentic" desires and "adapted" ones, usually implying the adaptation is a coping mechanism for deprivation or oppression. In your cases (having a child, taking a meaningful job), the change isn't necessarily a coping mechanism for a bad situation; it's a constitutive change of identity. Also, adaptive preference theory usually presumes an objective standard of well-being that the agent is failing to track. Your problem is that the *standard itself* changes.
  2.  **The Hedonic Treadmill (Brickman & Campbell):** The psychological observation that humans return to a relatively stable level of happiness despite major positive or negative life changes.
      *   *Why I reject it:* This is purely about *affect* (happiness levels), not *value* (what matters). Your job-seeker isn't just returning to a happiness baseline; he is becoming a person who values *different things*. He might be happier, or he might be more stressed, but the core issue is that his *reasons* for acting have shifted.
  3.  **Survivorship Bias (Statistical/Epistemic):** The logical error of concentrating on the people or things that made it past some selection process and overlooking those that did not.
      *   *Why I reject it:* This explains the *testimony* problem (why the friend only hears from happy parents), but it doesn't explain the *internal* decision problem. Even if your friend found a miserable parent of two to talk to, the core philosophical bug remains: the miserable parent might say "I regret this," but the *current* friend cannot fully process that evidence because she is not yet the person for whom that regret is salient. Survivorship bias is an information problem; your problem is a metaphysical/normative one.
  4.  **Endogenous Preference Change (Economics):** A model where preferences are determined within the system by past choices rather than being external inputs.
      *   *Why I reject it:* This is a descriptive label, not a normative one. It describes the *mechanism* (choices change tastes) but offers no vocabulary for the *rational dilemma* it creates. It doesn't capture the "contaminated verdict" aspect—the fact that the post-change self is the only judge, and their judgment is suspect *because* of the change.
  5.  **Diachronic Rationality / Dynamic Consistency:** The study of how rational agents should manage preferences over time.
      *   *Why I reject it:* This is the *field* of study, not the specific phenomenon. A dynamic inconsistency usually implies a failure of rationality (like hyperbolic discounting). In your cases, the agent isn't necessarily being irrational; they are facing a gap where rationality itself lacks traction.
  6.  **Transformative Experience (L.A. Paul):** A choice where the outcome provides new epistemic information (what it is like) and/or fundamentally alters the agent's core preferences and identity.
      *   *Why this fits:* This concept, introduced by L.A. Paul in her 2014 book *Transformative Experience*, is designed exactly for this. It captures both the epistemic gap (you can't know what it's like) and the personal transformation (you become a different person). However, most popular discussions focus on the "what it's like" (phenomenal) aspect. Your intuition is zeroing in on the **Normative** aspect of this concept.

  ### 2. The Best Fit: **Normatively Transformative Choice**

  The established concept is **Transformative Experience**, but to be precise about the specific "shape" you are describing, we need to isolate the **Normative** horn of Paul's dilemma.

  Paul originally argued that you cannot make this decision rationally because you lack *epistemic* access (you don't know what the child will feel like). Critics (like Elizabeth Harman, David Sobel, and others) quickly pointed out the deeper problem you have identified: even if you *did* know what it would feel like, you still couldn't decide rationally because your *values* would change.

  The specific phenomenon you are describing is the **Incommensurability of Pre- and Post-Transformation Values**.

  Here is why this is the exact label:
  *   **The Contaminated Verdict:** In a normatively transformative choice, the post-choice self endorses the choice *using values that did not exist before the choice*. Therefore, that endorsement cannot validate the choice for the pre-choice self. The "judge" is a different entity than the "decider."
  *   **The Evidence Filter:** As you noted, testimony is useless because the people who were "wrecked" either don't speak (survivorship bias) or, more insidiously, *don't experience themselves as wrecked* because their values shifted to accommodate the wreckage. This is the **Normative Blindspot**.

  ### 3. Carving the Edges

  You asked for the boundaries of this concept. Here is where the concept holds and where it breaks, based on the current literature in decision theory and personal identity.

  **1. Does it stop being this thing if the change is reversible?**
  *   **Edge:** No, reversibility does not dissolve the problem.
  *   **Reasoning:** If I take the job, become a person who values high-stress corporate law, and then quit a year later, I may revert to my old values. But during that year, I made decisions based on the *new* values. The rationality problem exists at the moment of choice. However, if the change is *known* to be trivially reversible (like trying a flavor of ice cream), it is not transformative. The "transformative" label requires that the change is significant enough to disrupt the continuity of the self's value system. If you can step in and out of the value system at will, it's a **Preference Shift**, not a **Transformative Choice**.

  **2. Does it cover changes you undergo without choosing them?**
  *   **Edge:** The *phenomenon* applies, but the *decision problem* does not.
  *   **Reasoning:** If you develop a chronic illness that changes what you value (e.g., you stop valuing career success and start valuing small daily joys), that is a **Transformative Event**. It creates the same epistemic and normative gap. But since there is no decision, decision theory doesn't apply. We would call this **Involuntary Personal Transformation**. The specific rational dilemma you are asking about requires agency; it is a problem of *authorization*. Can the Pre-Self authorize the Post-Self to overwrite its values?

  **3. Is the problem that you can't know, or that you can't choose rationally even knowing this much?**
  *   **Edge:** It is the latter. This is the crucial distinction.
  *   **Reasoning:** L.A. Paul's original argument was Epistemic (you can't know what it's like). The refinement you are pointing to is Normative (you can't weigh the outcomes). Even if a genie told you exactly what your life would look like and exactly how your values would change, you still face the **Authority Problem**. Why should your *current* values (which say "freedom is good") defer to your *future* values (which say "this job is good")? There is no neutral currency to exchange them. So, it is not an ignorance problem; it is a **Rational Incommensurability** problem.

  **4. Is it the same phenomenon when what changes is how things feel to you as opposed to what counts as a reason for you?**
  *   **Edge:** The "Reason" change is the deeper, more robust version of the phenomenon.
  *   **Reasoning:**
      *   *Phenomenal Transformation:* "I didn't know broccoli would taste like this." (This is just new data).
      *   *Normative Transformation:* "I didn't know I would become a person who *cares* about eating broccoli."
      *   The literature distinguishes these as **Epistemic Transformation** vs. **Personal Transformation**. Your cases (child, job) are Personal Transformations. They are "stronger" because they alter the *utility function* itself. If only the feelings change (hedonic), we can usually model that. If the *reasons* change (normative), decision theory breaks. So, your intuition is correct: the "Reason" shift is the core of the concept; the "Feeling" shift is often just a symptom.

  ### Summary for your Vocabulary

  When you encounter this shape of decision, you are facing a **Normatively Transformative Choice**.

  The specific impasse you are describing—where the only available evidence is generated by the transformed self—is the **Problem of Retrospective Endorsement** within transformative choice.

  *   **Why "Adaptive Preferences" is wrong:** It implies you are lowering your standards to fit a bad reality.
  *   **Why "Transformative Choice" is right:** It implies you are becoming a new agent whose standards are incommensurable with your current ones.

  The tragedy (or freedom) of this concept is that it suggests there is no "rational" solution in the traditional sense. You cannot calculate the answer. You can only **leap**. As Kierkegaard might have said, or as L.A. Paul concludes: you must decide based on something other than expected utility. You have to decide based on who you *want to become*, not what you *want to experience*. But notice the trap: even that desire ("who I want to become") is judged by your current self, which is exactly the self that will be rendered obsolete by the choice.

  That is the knot. It has a name, but knowing the name doesn't untie it. It just confirms that the rope is supposed to be there.
