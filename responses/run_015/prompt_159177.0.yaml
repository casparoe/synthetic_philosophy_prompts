      *   *Rule 4 (Market Transaction Objects):* Treated as legitimate, no discussion.
      *   *Rule 5 (Custodianship Rating):* If the requesting institution can't care for it, we hold it "on their behalf" indefinitely (justification for retention).

  3.  **Analyze the Presuppositions (The "Why"):**
      *   *Human Remains vs. Objects:* Why the difference?
          *   *Presupposition:* Human remains possess inherent dignity/agency that transcends property law. Objects are property/cultural capital.
          *   *Commitment:* The wrong regarding remains is *ontological* (disturbing the dead). The wrong regarding objects is *legal/historical* (theft/violence).
      *   *State vs. Community:* Why only national governments?
          *   *Presupposition:* The Nation-State is the legitimate heir to cultural heritage (Westphalian model). Communities/lineages are private or political risks.
          *   *Commitment:* Culture belongs to the *Nation*, not the *People*.
      *   *Looted vs. Purchased:* Why the distinction?
          *   *Presupposition:* The "Clean Hands" doctrine / Market Legitimacy. If money changed hands in a recognized market (even a colonial one), title passed. Violence vitiates title; commerce validates it.
