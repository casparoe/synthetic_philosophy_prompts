      *   *Refining Part 2:* Clearly distinguish the "rules of winning" in each game. For astronomers, it's predictive utility. For the public, it's cultural continuity.
      *   *Refining Part 3:* Be honest. Wittgenstein is better at describing the mess than solving the scientific need for precision. Acknowledge that science *stipulates* definitions, which is different from ordinary language evolution.
      *   *Refining Part 4:* Synthesize. The "essence" is pragmatic, not metaphysical.

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I imply Wittgenstein is wrong?
      *   *Correction:* No, frame it as the limits of the *application* of his lens to *technical* language. Ordinary language vs. Technical stipulation.
      *   *Check:* Did I address the "clearing the neighborhood" criterion?
