      *   *Gregorian:* This is the trouble spot. It's about tools/culture. Does it just become "anything with language/symbols"?
      *   *Scoring:* It handles the evolutionary story well. It struggles with LLMs (are they Popperian without bodies? Gregorian without culture?). It risks making "Gregorian" a catch-all for "smart stuff we don't understand."
