      *   *Idea 2:* It needs to distinguish *where* the variation happens. Is it in the genes, the behavior, the head, or the culture?
      *   *Idea 3:* It needs to deal with modern AI. LLMs aren't biological. Do they fit? If not, why?
      *   *Idea 4:* It needs to avoid "intentional stance" cheating. Just because we *treat* something as rational doesn't mean it *is* rational in the same way a human is.
      *   *Idea 5:* It needs to handle hybrid systems. Humans use tools (Gregorian) but also have instincts (Darwinian). Can the theory handle layering?

  3.  **Organizing and Refining Criteria (Step 2):**
      *   *Criterion 1: The Locus of Variation.* Where does the "trial" happen? (Genome vs. Behavior vs. Simulation).
      *   *Criterion 2: The Cost of Error.* What happens when a trial fails? (Death vs. Pain vs. Thought).
      *   *Criterion 3: The Teleology Trap.* How do we explain goal-directedness without assuming a little man inside?
      *   *Criterion 4: Substrate Neutrality vs. Specificity.* Does it work for carbon and silicon?
      *   *Criterion 5: Architectural Stacking.* Can an entity be multiple kinds at once?

  4.  **Drafting the Desiderata (incorporating motivating cases):**
