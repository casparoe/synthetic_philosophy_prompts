answer: |-
  Your hunch about cost allocation is sharp, but it is the *mechanism* of the conflict, not the *cause*. You are asking who bears the burden, but the deeper disagreement is about **who owns the reality of the situation.**

  Here is the diagnosis: Your group is suffering from a **Category Error**. You are treating a contextual variable (the social contract) as a universal constant (moral law).

  ### The Diagnosis

  The fight is not about lying. It is not even primarily about cost allocation. It is about **competing default settings for human interaction.**

  *   **Camp 1 (Truth)** operates on a **Sovereignty Default**. They believe the hearer is an autonomous agent whose primary right is to accurate data to navigate the world. To withhold truth is to treat them as a child or a prop. The "cost" they worry about is the corrosion of the *system* of trust.
  *   **Camp 2 (Care)** operates on a **Harmony Default**. They believe the primary function of speech is to regulate emotional proximity. To prioritize abstract truth over concrete feelings is to treat the relationship as secondary to a rule. The "cost" they worry about is the immediate *pain* of the individual.
  *   **The Cultural Camp (Tokyo/Amsterdam)** is the key you are ignoring. They are not offering a third moral opinion; they are offering **evidence that the Default is Local.** In Amsterdam, the Sovereignty Default is the norm. In Tokyo, the Harmony Default is the norm.

  The reason Camp 1 and Camp 2 co-opt the Cultural Camp's examples is that both believe *their* default is the universal human standard. Camp 1 hears "Tokyo" and thinks, "See, even they know it's a lie, they just tolerate it." Camp 2 hears "Amsterdam" and thinks, "See, bluntness is cold and alienating." Neither accepts the Cultural Camp's actual conclusion: **that the morality of the act depends entirely on which contract is currently in force.**

  So, to answer your specific options:
  *   **Is it cost allocation?** No, that is the symptom. The resentment about who eats the cost comes from the violation of the expected default.
  *   **Is it empirical?** No. You cannot measure "damage" because Camp 1 defines damage as "distortion of reality" and Camp 2 defines damage as "emotional distress." You are measuring different things.
  *   **Is it definitional?** Yes, but deeper. You are using one word ("Trust") to cover two incompatible concepts: **Epistemic Trust** (I trust you to tell me what is real) vs. **Relational Trust** (I trust you to protect my well-being).
  *   **Is it two different questions?** **Yes.** This is the core. Camp 1 is answering "What are the rules of information exchange?" Camp 2 is answering "What are the duties of a friend?"

  ### Can Progress Be Made?

  **Honest Call:** If your goal is to agree on a universal rule ("White lies are always wrong" or "White lies are always okay"), **no progress is possible.** This is bedrock intuition. Camp 1 values Autonomy over Comfort. Camp 2 values Comfort over Autonomy. You cannot argue someone out of their hierarchy of values.

  However, if your goal is to stop going in circles, **progress is possible**, but it requires a procedural shift, not a moral resolution.

  **The Move That Works:**
  Stop asking "Is this lie wrong?" and start asking **"Which contract are we under?"**

  You need to introduce a distinction between **Public Truth** and **Private Care**.
  1.  **Public/Functional Contexts:** (Work, logistics, science, safety). The Sovereignty Default applies. Lying is wrong because it breaks the machinery of coordination. Camp 1 wins here.
  2.  **Private/Emotional Contexts:** (Compliments on appearance, grief, subjective taste). The Harmony Default applies. Lying (or vague politeness) is right because it maintains the bond. Camp 2 wins here.

  The Cultural Camp proves this works. In Tokyo, the "polite form" is the contract for Private Care. In Amsterdam, the "true thing" is the contract for Public Truth. Your group is fighting because Camp 1 is applying Public Truth rules to Private Care situations, and Camp 2 is applying Private Care rules to Public Truth situations.

  **Recommendation for the Next Meeting:**
  Propose this motion: *"We agree that there is no universal rule. We agree that the morality depends on the active social contract. We will spend the next hour mapping which contexts require Epistemic Trust and which require Relational Trust."*

  If they refuse this and insist on a universal verdict, tell them they are done. They are not debating ethics; they are debating theology, and they have different gods.
