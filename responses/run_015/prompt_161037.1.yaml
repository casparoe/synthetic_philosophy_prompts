  **Subject:** Pedagogy of Mass Atrocity
  **Status:** Draft for Joint Signature (Day 1)

  ## I. SHARED CLAIMS
  *We, the undersigned participants, agree to the following premises as the baseline for this week's work. Where we cannot agree on the implication, we agree on the necessity of the question.*

  1.  **Evidence and Epistemology:** We agree that historical claims about atrocities must be grounded in the best available archival evidence, and that uncertainty in the evidence must be communicated to students and visitors rather than concealed.
  2.  **The Function of "Worse":** We agree that the word *worse* is ambiguous in public discourse. We commit to specifying, when using it, whether we mean:
      *   (a) A quantitative estimate of suffering/death;
      *   (b) A qualitative judgment of perpetrator intent or mechanism;
      *   (c) A prescription for present-day resource allocation or pedagogical emphasis.
      *   *[Joint wording failed here: The Comparativist camp insists that (a) logically entails (c) in conditions of scarce resources. The Singularist camp refuses to sign any claim linking magnitude to obligation. We agree to disagree on the linkage while agreeing to distinguish the terms.]*
  3.  **The Politics of Silence:** We agree that *refusing* to compare is not a neutral act. It has consequences for curriculum design and memorial architecture.
      *   *[Joint wording failed here: Comparativists wish to add "…and often serves to protect dominant national narratives." Singularists wish to add "…but comparison often serves to instrumentalize suffering for political ends." We agree only that refusal has consequences.]*
  4.  **Pedagogical Duty:** We agree that our primary duty is to the dead and to the living learners, not to the comfort of the institutions we serve.

  ## II. ANALYTICAL DISTINCTIONS
  *To prevent talking past one another, we agree to separate the following four concepts during discussion. We do not necessarily agree on how they relate, but we agree to keep them distinct.*

  | Concept | Definition | Status of Consensus |
  | :--- | :--- | :--- |
  | **1. Suffering Magnitude** | Estimates of death, injury, displacement, and duration of pain. | **Accepted.** Both sides agree numbers matter for historical record, even if they disagree on moral weight. |
  | **2. Agent Culpability** | The intent, ideology, and bureaucratic machinery of the perpetrators. | **Accepted.** Both sides agree this can be analyzed without ranking victim suffering. |
  | **3. Present Obligation** | Duties of repair, restitution, or specific commemoration owed by specific actors *now*. | **[Gap]** Singularists view this as infinite/non-fungible. Comparativists view this as scalable/prioritizable. |
  | **4. Precautionary Attention** | The amount of educational focus warranted to prevent *future* recurrence. | **Accepted.** Both sides agree some cases offer specific warning signs relevant to current politics. |

  **Note on Dispute Dissolution:** Separating these categories clarifies that we often agree on *Magnitude* (1) and *Culpability* (2) but fight over *Obligation* (3). It does not resolve the fight, but it prevents us from arguing about numbers when we are actually arguing about ethics.

  ## III. DISAGREEMENTS TABLE
  *We acknowledge the following enduring tensions. Each side accepts the wording in their row as an accurate description of their own position.*

  | **Comparativist Position** | **Singularist Position** |
  | :--- | :--- |
  | **On Ranking:** Refusing to rank atrocities embeds a hidden hierarchy, often one that favors the nation-state's own victims over others. Silence is a verdict. | **On Ranking:** Comparative verdicts on suffering are epistemically unstable and morally injurious. They turn victims into competitors for grief. |
  | **On Evidence:** While imperfect, evidence allows for provisional comparisons of scale and intent. To deny this is to surrender history to myth. | **On Evidence:** Archives are fragmented by the nature of atrocity. Quantitative comparison often privileges the bureaucracy of the killer over the experience of the killed. |
  | **On Pedagogy:** Students must be taught to weigh moral gravity to develop ethical judgment. Shielding them from comparison infantilizes them. | **On Pedagogy:** Students must be taught to dwell in the specificity of each event. Comparison encourages shortcutting empathy for calculation. |
  | **On Risk:** The risk of getting the comparison "wrong" is less dangerous than the risk of never comparing at all. | **On Risk:** The risk of comparison (apologetics, minimization) outweighs the benefit. The tool is too easily weaponized. |

  ## IV. CRUX SCENARIOS (TEST CASES)
  *We agree to use the following four scenarios to stress-test our positions. We do not agree on the outcomes, but we agree on what evidence or arguments would be relevant to each.*

  **(i) The Downward Revision**
  *Scenario:* Fresh archival work reduces the estimated death toll of Event A (previously ranked "worse" than Event B) by 40%.
  *   **Shared Bearing:** Both sides agree that updated evidence must be incorporated into the historical record.
  *   **Predicted Divergence:**
      *   *Comparativists* predict the ranking should shift if Event B is now larger.
      *   *Singularists* predict this proves the frailty of ranking; if a 40% shift changes the moral lesson, the lesson was flawed.
  *   **Agreed Action:** We will update the syllabus numbers. We will *not* agree on whether the pedagogical emphasis shifts.

  **(ii) The Gallery**
  *Scenario:* A memorial commission has one unassigned gallery and two candidate atrocities. Declining to allocate is permitted.
  *   **Shared Bearing:** Both sides agree that physical space is finite and curatorial choices are inevitable.
  *   **Predicted Divergence:**
      *   *Comparativists* argue allocation expresses comparative gravity. To choose one is to rank.
      *   *Singularists* argue allocation can be thematic or rotational, not hierarchical. A choice can be made without a verdict on "worse."
  *   **Agreed Action:** We will draft two mock wall texts: one explicitly comparative, one explicitly singular. We will critique both for what they silence.

  **(iii) The Third Candidate**
  *Scenario:* An atrocity not previously on the syllabus is introduced. Its arrival changes which of the original two seems "worse."
  *   **Shared Bearing:** Both sides agree that context shapes perception.
  *   **Predicted Divergence:**
      *   *Comparativists* accept that "worse" is context-dependent (like "taller") but still real.
      *   *Singularists* argue this proves "worse" is not an intrinsic property of the event, but a function of the syllabus design.
  *   **Agreed Action:** We will acknowledge that syllabus design is a moral act that constructs relationships between events.

  **(iv) The Prevention Case**
  *Scenario:* If one could go back and avert exactly one of two atrocities but not both, does either camp have a non-arbitrary way to choose?
  *   **Shared Bearing:** *[Joint wording failed here: Singularists often reject the hypothetical as ahistorical and morally coercive. Comparativists view it as the ultimate test of moral priority.]*
  *   **Predicted Divergence:**
      *   *Comparativists* predict a choice based on scale or preventability is required and moral.
      *   *Singularists* predict that accepting the premise validates a utilitarian calculus they reject.
  *   **Agreed Action:** We will discuss this only as a limit-case for ethical reasoning, not as a guide for historical practice.

