  Here is a suggested grade and a set of marginal comments.

  **Grade: 13/20**

  **Examiner's Note:** The student demonstrates excellent recall of the definitions and the mechanics of Global Workspace Theory (GWT). The prose is clear and confident. However, the "wrong moves" you sensed are substantive philosophical errors. In (b) and (c), the student conflates a functional theory of *access* with an ontological reduction of *phenomenology*. They argue *from within* GWT rather than critically evaluating the gap Block identifies. They treat Block's distinction as a mistake to be corrected by GWT, rather than a challenge GWT must answer. This misses the point of the seminar's critical engagement with the "Hard Problem."

  ***

  ### Marginal Comments

  **[Part a]**
  *   **Next to "Block's distinction is between...":** Clear and accurate definition. Good grasp of the functional role of access.
  *   **Next to "Global workspace theory is best read as a theory of access...":** Correct. This is the standard interpretation (and Block's own reading).
  *   **Next to "So what the theory explains is reportability...":** Good summary of the GWT mechanism.

  **[Part b]**
  *   **Next to "If the theory is true, though, I think the distinction collapses.":** **Careful.** This is a strong metaphysical claim. GWT explains *how* content is accessed. Why does that explain *why* access feels like something? You are assuming functionalism without argument.
  *   **Next to "Block's own argument for keeping them apart, the overflow argument, actually helps here.":** **Problematic.** Block uses overflow to argue P-consciousness *exceeds* access (rich experience, poor report). You are using it to argue unaccessed items *aren't* conscious. This contradicts Block's premise rather than engaging with it.
  *   **Next to "a content available to no system is not conscious in any sense we could ever detect or that should bother us.":** **This is the crux.** You are defining consciousness by detection. Block's whole point is that phenomenology is distinct from detection. You haven't argued against the distinction; you've just stipulated it away.
  *   **Next to "phenomenal consciousness reduces to global availability.":** GWT is compatible with the distinction (Block's view) or reduction (Dennett's view). You present reduction as a logical consequence of GWT, but it requires additional materialist premises.

  **[Part c]**
  *   **Next to "Transparent access is not a case the theory can take seriously.":** Why not? GWT can describe the *access* mechanisms here. The question is whether we call it *conscious*.
  *   **Next to "Her denial is itself only a report, and report is one consumer system among several...":** **Dismissive of first-person authority.** In a seminar on consciousness, the subject's sincere report of "no experience" is the primary datum of phenomenology. Privileging third-party data (priming) over first-person report begs the question against Block.
  *   **Next to "on the workspace picture there is no room for that gap":** True *by definition* of GWT. But the hypothetical asks us to test GWT against our intuitions about possibility. You are protecting the theory from the counter-example rather than testing the theory.
  *   **Next to "hypothesis of transparent access is either incoherent or question-begging":** Block argues that *conceivability* implies possibility. You need to explain why this case is logically incoherent, not just inconsistent with GWT. You haven't addressed the "zombie" intuition driving the case.

  **[Overall]**
  *   **End of page:** Strong grasp of the cognitive science, but you treat GWT as a complete ontology rather than a theory of access. You haven't engaged with the "explanatory gap" — *why* global availability should feel like anything at all. See Block (2005) on the "refrigerator light" objection.
