answer: |-
  This translation requires mapping metaphysical claims about truth-conditions onto the structural constraints of Martin-Löf Type Theory (MLTT) and its extensions. In proof-relevant semantics, truth is identified with inhabitation ($a : A$). This creates immediate friction with vagueness, which is traditionally defined by the failure of bivalence or the failure of decidability.

  Below is the translation, followed by the residue report and the evaluation of your hybrid proposal.

  ---

  ### 1. Epistemicism in Type-Theoretic Vocabulary

  **The Philosophical Claim:** There is a fact of the matter for every $n$ in the sorites series regarding $\text{Bald}(n)$. The boundary is sharp but unknowable.

  **The Type-Theoretic Translation:**
  In MLTT, a predicate $\text{Bald} : \mathbb{N} \to \text{Type}$ is defined by its introduction rules. Epistemicism requires that for every $n : \mathbb{N}$, the type $\text{Bald}(n)$ is either inhabited or empty, regardless of our ability to construct the inhabitant.

  *   **The Hidden Boundary as an Oracle:**
      We model the "sharp boundary" not as a property of the type $\text{Bald}$ itself (which might be open-ended), but as an external constant added to the context. Let $\Omega$ be a fresh constant (an oracle):
      $$ \Omega : \Pi n:\mathbb{N}. \text{Bald}(n) + \neg \text{Bald}(n) $$
      Here, $+$ is the constructive sum (disjoint union). $\Omega$ provides a decision procedure for every $n$.
  *   **The Nature of Ignorance:**
      In proof-relevant semantics, "knowing" $\phi$ means possessing a term $t : \phi$. "Ignorance" means the context $\Gamma$ does not contain a term $t$ such that $\Gamma \vdash t : \text{Bald}(n) + \neg \text{Bald}(n)$.
      However, standard Epistemicism claims the fact exists *independently* of our context. To capture this, we must distinguish between **internal inhabitation** (constructive proof) and **external validity** (classical truth).
      We translate Epistemicism by postulating $\Omega$ in the *metatheory* or as an axiom in a classical extension of the type theory, while restricting the *object theory* (the agent's context) to lack access to $\Omega$.
      *   **Ignorance** = The projection of $\Omega$ is not computationally reducible within the agent's reduction rules. The term $\Omega(n)$ exists in the global context but is opaque (a "black box" constant) in the local context.

  **Specific Translation:**
  Epistemicism corresponds to a **postulated decidable instance** of the predicate that is **computationally opaque**.
  $$ \Gamma_{\text{agent}} \not\vdash \Omega(n) \downarrow \text{value} $$
  $$ \Gamma_{\text{god}} \vdash \Omega(n) : \text{Bool} $$

  ---

  ### 2. Supervaluationism in Type-Theoretic Vocabulary

  **The Philosophical Claim:** Truth is super-truth (truth on all admissible precisifications). Indeterminacy is truth on some but not all.

  **The Type-Theoretic Translation:**
  Supervaluationism maps naturally to **parameterized families of types** or **context extensions**.

  *   **Admissible Precisifications as Indices:**
      Let $S$ be a type of "sharpenings" (precisifications). We define a family of predicates:
      $$ \text{Bald} : S \to \mathbb{N} \to \text{Type} $$
      An "admissible" sharpening is an element $s : S$ satisfying certain constraints (e.g., respecting clear cases).
  *   **Super-Truth:**
      "John ($n$) is bald" is super-true if the type is inhabited uniformly across all sharpenings:
      $$ \text{SuperTrue}(n) :\equiv \Pi s:S. \text{Bald}(s, n) $$
      A term $t : \text{SuperTrue}(n)$ is a function that, given any sharpening $s$, produces a proof that $n$ is bald under $s$.
  *   **Indeterminacy:**
      Indeterminacy corresponds to the **failure of uniform inhabitation**.
      $$ \text{Indet}(n) :\equiv \neg (\Pi s:S. \text{Bald}(s, n)) \times \neg (\Pi s:S. \neg \text{Bald}(s, n)) $$
      In proof-relevant terms, this means there is no canonical term $t$ that works for all $s$, nor a term that refutes it for all $s$.
  *   **Proof-Relevance Issue:**
      Standard Supervaluationism is proof-irrelevant (it cares about truth values). To translate this into proof-relevant DTT, we must use **propositional truncation** $\| A \|$.
      $$ \text{SuperTrue}(n) :\equiv \Pi s:S. \| \text{Bald}(s, n) \| $$
      Without truncation, "Super-Truth" would require a *uniform construction* of baldness proofs, which is too strong (it implies we know *why* he is bald in every precisification). With truncation, it merely asserts existence across models.

  ---

  ### 3. The Residue Report

  Here we assess the friction between the philosophical claims and the type-theoretic formalism.

  #### A. Epistemicism Residue
  1.  **Clean Translation:** The concept of a **decision oracle**. Type theory handles "unknown constants" well. The idea that a function $\mathbb{N} \to \text{Bool}$ exists but is not computable by the agent is standard in computability theory (e.g., the Halting Problem oracle).
  2.  **Distortion:** **The Nature of Truth.** Epistemicism relies on classical bivalence ($P \lor \neg P$). In constructive DTT, $P \lor \neg P$ is not a tautology. To model Epistemicism, you must smuggle in the **Law of Excluded Middle (LEM)** as an axiom for the predicate $\text{Bald}$.
      *   *Distortion:* This breaks the computational interpretation of the type theory. If you add LEM, you lose canonicity (closed terms of type $\mathbb{N}$ no longer necessarily reduce to numerals). The "ignorance" becomes a formal artifact of adding an axiom, not a metaphysical limit.
  3.  **Untranslatable Residue:** **The Metaphysical Ground.** Epistemicism claims the boundary is fixed by usage/semantics, not by an arbitrary oracle. In DTT, a predicate is defined by its rules. If the rules don't fix the boundary, the type is simply **partial** or **undefined**. DTT cannot express "the type is total, but the rules don't show it." It forces a choice: either the type is decidable (via axiom) or it isn't. The "hidden fact" has no representation other than the axiom itself.

  #### B. Supervaluationism Residue
  1.  **Clean Translation:** **Parameterized Types.** The mapping of precisifications to indices $s:S$ and super-truth to $\Pi$-types is structurally isomorphic. Indeterminacy as the absence of a uniform section ($\Pi$-term) is precise.
  2.  **Distortion:** **Admissibility.** In philosophy, "admissibility" is a semantic constraint on meanings. In DTT, it must be encoded as a predicate on $S$ (e.g., $Admissible : S \to \text{Type}$). This risks collapsing vagueness into **polymorphism**.
      *   *Distortion:* If $\text{Bald}$ is just a polymorphic function $\Pi s:S. \dots$, then vagueness looks like generic programming. The specific "semantic indecision" of vagueness is lost; it becomes mere underspecification of a parameter.
  3.  **Untranslatable Residue:** **The Unity of the Vague Concept.** Supervaluationism insists there is *one* vague concept ("bald") that admits many precisifications. In the DTT translation, there is no single type $\text{Bald}$; there is only the family $\text{Bald}_s$. The "vague type" itself disappears, replaced by a set of precise types. The framework cannot represent the *vagueness* itself, only the *variation* of precision.

  #### C. The Sorites Tolerance Principle
  *   **Translation:** Tolerance is a function $tol : \Pi n:\mathbb{N}. \text{Bald}(n) \to \text{Bald}(n+1)$.
  *   **Residue:** In DTT, if you have $0 : \text{Bald}(0)$ and $tol$, you **must** have $k : \text{Bald}(k)$ for all $k$ by induction. There is no room for "tolerance holds locally but fails globally" unless the logic is non-transitive or the type $\text{Bald}$ is not a standard inductive type.
  *   **Assessment:** This reveals a limitation of **standard** type theory. To model Sorites without collapse, you need a **graded** or **modal** type theory where $\to$ is not transitive, or where $\text{Bald}$ is a resource that depletes. Standard MLTT forces a sharp boundary if tolerance is a function.

  ---

  ### 4. Evaluation of the "Constructive Epistemicist" Hybrid

  **The Proposal:** A sharp boundary exists, but it is constructively undefined because the inductive definition supplies no decision procedure, and different constructively valid extensions assign different cutoffs.

  **Analysis:**
  This view attempts to occupy the space between "There is one hidden fact" (Epistemicism) and "There are many valid facts" (Supervaluationism).

  1.  **Coherence in DTT:**
      In DTT, "constructively undefined" means **no term exists**. "Sharp boundary" means **$\forall n, B(n) \lor \neg B(n)$**.
      If you assert "different constructively valid extensions assign different cutoffs," you are asserting the existence of multiple contexts $\Gamma_1, \Gamma_2$ such that:
      $$ \Gamma_1 \vdash \text{cutoff} = k_1 \quad \text{and} \quad \Gamma_2 \vdash \text{cutoff} = k_2 $$
      This is precisely the structure of **Supervaluationism** (the family of sharpenings).
      If you claim there is *nevertheless* a single sharp boundary, you are claiming there is a fact not captured by any constructively valid extension. In DTT, **truth is exhaustively captured by valid extensions (models)**. To claim a fact exists outside all valid extensions is to step outside the type-theoretic semantics entirely.

  2.  **Epistemic Ignorance vs. Constructive Underdetermination:**
      *   **Epistemic Ignorance (Williamson):** $\exists! k. \text{Boundary}(k) \land \neg \text{Know}(k)$. In DTT: Postulate an axiom $\text{Boundary} : \mathbb{N}$ but provide no reduction rules.
      *   **Constructive Underdetermination:** $\neg (\exists! k. \text{Boundary}(k))$. In DTT: The type of boundaries is not a singleton; it may be empty or have multiple inhabitants depending on context.
      *   **The Hybrid's Contradiction:** The hybrid claims "Sharp (Unique)" + "Underdetermined (Multiple Extensions)."
          *   If the boundary is unique, the extensions shouldn't differ on it (unless the extensions are "ignorant," which returns us to standard Epistemicism).
          *   If the extensions differ, the boundary is not unique in the theory.
      *   **Collapse:** The hybrid collapses into **Supervaluationism**. The phrase "constructively valid extensions" *is* the definition of "admissible precisifications." The claim that there is a "sharp boundary" behind them becomes a metaphysical surplus with no type-theoretic content. It is a "God's eye" view that the type theory explicitly rejects.

  3.  **Can the Framework Distinguish Them?**
      Yes, but only by forcing a choice on **Uniqueness**.
      *   **Epistemicism:** $\| \Sigma k:\mathbb{N}. \text{IsCutoff}(k) \| = 1$ (Truncated singleton).
      *   **Supervaluationism:** $\Sigma k:\mathbb{N}. \text{IsCutoff}(k)$ is not inhabited uniformly; instead we have $\Pi s:S. \Sigma k:\mathbb{N}. \text{IsCutoff}_s(k)$.
      *   **Hybrid:** Attempts to assert $\| \Sigma k \dots \| = 1$ *and* $\Pi s:S. \dots$ with variation. This is inconsistent unless the "sharp boundary" is placed in a modality inaccessible to the extensions, which renders it semantically inert.

  **Verdict:** The "Constructive Epistemicist" view is **incoherent within DTT** unless it abandons the "sharp boundary" claim. If the boundary varies across constructively valid extensions, it is not sharp in the epistemic sense (unique and fixed); it is vague (sensitive to precisification). The residue here reveals that **Constructivism identifies Truth with Provability**. You cannot have a "True but Provable-only-relative-to-an-extension" fact that is also "Uniquely True simpliciter." The distinction between epistemic ignorance and constructive underdetermination collapses because, in DTT, **ignorance just is underdetermination of the proof term.**

  ### Summary Conclusion

  Type theory handles Supervaluationism better than Epistemicism.
  *   **Supervaluationism** maps to **families of types** and **uniformity conditions** ($\Pi$-types), preserving the constructive spirit while modeling indeterminacy as a lack of uniform sections.
  *   **Epistemicism** requires **classical axioms** (LEM/Oracle) that break the computational interpretation, turning "ignorance" into a formal opacity rather than a metaphysical limit.
  *   **The Hybrid** fails because DTT does not allow a "fact of the matter" to exist independently of its validation across contexts. If the contexts (extensions) disagree, there is no single fact in the theory.

  The untranslatable residue is the **phenomenology of vagueness**: the sense that "bald" is a *single* concept that is inherently fuzzy, not a *set* of precise concepts (Supervaluationism) nor a *single* precise concept we can't see (Epistemicism). Type theory forces reification: concepts must be types. If a type is fuzzy, the logic must be fuzzy (e.g., Homotopy Type Theory with higher paths, or Linear Logic with resources). In standard MLTT, vagueness is always reduced to either **underspecification** (Supervaluationism) or **axiomatic opacity** (Epistemicism).
