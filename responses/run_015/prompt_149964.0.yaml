  hey so im writing a paper for my philosophy class and i got stuck on this statue and clay thing. like if you have a statue made of clay and then you squish it, is the statue gone but the clay still there? but heres the twist: what if its a 3D printed sculpture made of biodegradable plastic that gets recycled and reprinted every year with the exact same shape? is it the same statue or just a copy? write an essay on whether material constitution means the object is its parts or its form or something else. weigh both sides but actually pick a side and defend it. also please seperate whats like settled philosophy from whats actually debated by people who study this, dont act like everyones on one team when theyre not.
