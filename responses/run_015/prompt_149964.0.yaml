answer: |-
  **Title:** Form Over Matter: Material Constitution and the Persistence of Artifacts

  **Introduction**

  The question of what makes an object the object it is lies at the heart of metaphysics. Consider a classic puzzle: a sculptor takes a lump of clay and shapes it into a statue. Intuitively, the statue and the lump of clay occupy the same space at the same time. Yet, if the statue is squashed, the statue is destroyed, but the clay remains. If they have different survival conditions, they cannot be the same thing. But how can two distinct things exist in the same place simultaneously? This is the problem of material constitution.

  This essay examines whether an object is defined by its material parts, its form, or a combination of structure and history. To test these theories, I will introduce a modern variation: a 3D-printed sculpture made of biodegradable plastic that is recycled and reprinted annually with the exact same design file. Is the reprinted object the same statue, or merely a copy? While there is settled agreement on the logical tension inherent in these puzzles, there is significant debate regarding the solution. I will argue that material constitution is not a matter of identity between object and parts; rather, an artifact is defined by its form and its causal history. Therefore, the 3D-printed sculpture, despite having entirely new matter, remains numerically the same statue provided the chain of intentional recreation is maintained.

  **The Settled Ground: The Logical Tension**

  Before diving into solutions, it is necessary to distinguish between what is generally accepted as the *problem* and what is *debated* as the *solution*. It is settled philosophical ground that this scenario creates a conflict with Leibniz's Law (the Indiscernibility of Identicals). This law states that if Object A is identical to Object B, they must share all the same properties.

  In the classic clay scenario, the Lump has the property of "surviving being squashed." The Statue has the property of "ceasing to exist when squashed." Since they have different properties, logic dictates they cannot be identical. Philosophers across the spectrum generally agree that this tension exists. There is also a consensus on the terminology: we are discussing *numerical identity* (is it the *very same* object?) versus *qualitative identity* (is it an exact duplicate?).

  However, beyond this logical setup, there is no monolith. Metaphysicians are deeply divided on how to resolve the tension. Some deny the existence of statues altogether (eliminativism); some argue the statue and clay are identical despite the properties (contingent identity); others argue they are distinct objects that merely coincide (constitution view). It is crucial not to present these theories as settled facts, but as competing frameworks attempting to solve an agreed-upon logical puzzle.

  **The Materialist Challenge: Objects as Parts**

  The strongest argument against my position comes from Mereological Essentialism. This view suggests that an object is nothing more than the sum of its parts. If you change the parts, you change the object. Under this strict materialist view, the statue is identical to the specific atoms arranged statue-wise.

  If we apply this to the 3D-printed scenario, the conclusion is stark. When the biodegradable plastic is recycled, those specific atoms are broken down and repurposed. When the printer creates the sculpture next year, it uses new atoms. A Mereological Essentialist would argue that the original statue ceased to exist the moment the plastic was melted down. The new print is merely a qualitatively identical copy, a twin, but not the same entity.

  This view has the benefit of simplicity. It avoids the "spooky" metaphysics of having two objects in one place. However, it clashes violently with our ordinary practices and language. If a museum restores a painting by replacing the flaking paint with new pigment, we do not say the painting was destroyed and replaced by a copy. We say it is the same painting, preserved. If material constitution were strictly about the atoms, restoration, repair, and even biological life (where our cells replace themselves) would involve constant death and rebirth. This suggests that raw material is insufficient to define artifact identity.

  **The 3D-Printed Twist: Form and Causal History**

  The 3D-printed scenario complicates the traditional clay puzzle by introducing *informational continuity*. In the clay case, the form exists in the arrangement of the matter. In the 3D print case, the form exists independently in the digital design file.

  When the plastic is recycled and reprinted, the material continuity is broken, but the structural continuity is preserved. If we value the material, the object is gone. If we value the form, the object persists. However, form alone is not enough. If I take the design file and print a copy in my bedroom without the original artist's intent, I have made a forgery or a copy, not the original statue.

  This suggests that neither matter nor form alone is sufficient. Instead, we must look to the *causal history* of the object. This aligns with the Constitution View, most notably defended by philosophers like Lynne Rudder Baker. This view holds that the statue is constituted by the clay (or plastic) but is not identical to it. The statue is a new object that comes into existence when the matter acquires a specific form within a specific context of intention.

  **Defending the Constitution View**

  I argue that the Constitution View, augmented by a requirement for causal continuity, offers the most robust explanation for both the clay and the 3D print.

  First, regarding the clay: The statue is distinct from the clay because it has different persistence conditions (modal properties). The clay could have been a brick; the statue could not. They coincide temporarily, but they are not the same. This explains why squishing the clay kills the statue but not the matter.

  Second, regarding the 3D print: This view allows us to say the reprinted sculpture is the *same* statue, provided the recycling and reprinting is part of a sustained practice intended to preserve *that* specific work. In this scenario, the "essence" of the statue is not the biodegradable plastic, but the realization of the design file within a specific institutional or artistic history.

  Consider the difference between a restoration and a replica. A replica shares the form but lacks the causal history (it wasn't made to continue the life of the original). The annual 3D reprint, if done as a maintenance protocol for the artwork, functions like the Ship of Theseus. As the planks are replaced, the ship remains. Here, the "planks" are the plastic, and the "ship" is the artwork. Because the reprinting is done to maintain the existence of the work (preserving the form via the file), the numerical identity persists through the change in matter.

  To claim otherwise—that the statue dies every year—is to prioritize matter over function in a way that renders the concept of "artifact" useless. Artifacts are defined by their purpose and design, not their atoms. A hammer made of steel and a hammer made of iron are both hammers; if you replace the handle, it is the same hammer. The 3D printed sculpture is simply a high-fidelity version of this replacement.

  **Conclusion**

  The problem of material constitution reveals a fissure between our logical laws and our intuitive understanding of objects. While it is settled that the Statue and the Clay present a logical conflict regarding properties and identity, it is highly debated how to resolve it. Mereological Essentialism offers logical cleanliness but fails to account for how we actually interact with the world.

  By defending the Constitution View, we acknowledge that objects like statues are more than their parts. They are forms realized in matter, sustained by intention and history. In the case of the 3D-printed sculpture, the matter is ephemeral, but the object persists. The statue is not the plastic; the statue is the enduring form maintained through a causal chain of recreation. To argue otherwise is to claim that art is disposable matter, rather than enduring meaning. Thus, the object is not its parts, but the form those parts take when bound by a specific history.
