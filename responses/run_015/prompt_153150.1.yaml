answer: |-
  1. The practical setup
  As a case officer, I face weekly proposals requiring swift determinations under severe time pressure. The core conflict lies between the 1893 Riparian Act's static literalism and the 2018 Climate Adaptation Purpose Statement's dynamic focus on resilience. Usually, statutory interpretation balances text against intent. However, 'ghost provisions'—rights like ice-harvesting easements—break this frame. They possess textual authority but lack physical or ecological correlate. This creates a vacuum where literalism mandates approval while purposivism suggests irrelevance. I need a triage mechanism that distinguishes genuine conflicts from obsolete formalities without requiring deep legal research.

  2. The procedure
  1. **Identify the Claim:** Does the applicant cite a specific 1893 clause? If no, assess solely under 2018 Purpose. If yes, proceed to Q2.
  2. **Physical Viability:** Does the cited right correspond to a physically possible activity today? For example, 'water flow' is viable; 'ice-harvesting' is likely not given warming trends. If yes, go to Q3. If no, classify as a Ghost Provision and go to Q4.
  3. **Ecological Impact:** Does the viable activity materially reduce ecosystem resilience according to 2018 metrics? If no, Approve immediately. If yes, Flag for Panel. This indicates a values trade-off between historic rights and future sustainability requiring senior judgement.
  4. **Ghost Provision Test:** Does enforcing this ghost right consume water or physical space? If yes, Dismiss. The 2018 Purpose overrides obsolete consumption to protect resources. If no (purely titular), Approve. The 1893 Text stands for status recognition without ecological cost.
  5. **Stop Conditions:** Halt and Flag immediately if public safety is risked. Halt and Flag if dismissing a ghost right triggers compensation claims exceeding tribunal limits. Do not adjudicate compensation; that is for the courts.
  6. **Judgement Flags:** Mark for Panel any instance where 'resilience' is scientifically ambiguous or where historical property value is contested. Your role is permission, not valuation. Avoid making policy.
  7. **Tie-Breaker:** For Ghost Provisions, Functional Impossibility trumps Textual Authority. If the physical act cannot occur, the right cannot be exercised to consume resources. However, proprietary status remains recognised unless it blocks 2018 goals. Literalism wins on status; Purposivism wins on resource allocation. This ensures obsolete uses do not drain resources while avoiding unlawful extinguishment of title. It prioritises ecological survival over historical formalities where physical reality has shifted. Consequently, you may deny the use but must record the right as dormant. This maintains the land register integrity.

  3. Case A — geothermal boreholes claiming an old 'mill-race flow' right
  **Application:** Geothermal developer claims 'mill-race flow' right to justify water extraction.
  **Run-through:**
  1. **Claim:** Yes, cites 1893 mill-race clause.
  2. **Viability:** No physical mill exists. This is a Ghost Provision.
  3. **Ghost Test:** Does it consume resources? Yes, geothermal needs water flow.
  4. **Decision:** Dismiss. Under the Ghost Provision Tie-Breaker, obsolete consumption rights yield to 2018 sustainability. The text exists, but the physical correlate is gone.
  **The Unwanted Answer:** You must deny the extraction. However, the procedure flags that the developer retains the *status* of the easement. They own the right, but cannot exercise it consumptively. This creates a legal zombie: they hold a valuable property right that generates no utility. You cannot extinguish the title, only the use. This invites litigation on compensation which the Tribunal cannot award. You've solved the water issue but created a property law mess for the courts. The developer may sue for constructive taking, arguing the 2018 Purpose effectively nullifies their asset without payment. You have protected the river but exposed the government to liability. This outcome satisfies the climate goal but violates property norms, creating political friction.

  4. Case B — blocking a literal irrigation diversion that the climate purpose clearly wants to stop
  **Application:** Farmer seeks to divert water for irrigation under explicit 1893 literal text. 2018 Purpose indicates drought resilience requires flow retention.
  **Run-through:**
  1. **Claim:** Yes, cites 1893 irrigation clause.
  2. **Viability:** Yes, physical irrigation is possible.
  3. **Ecological Impact:** Yes, diversion reduces river flow below resilience thresholds.
  4. **Decision:** Flag for Panel.
  **The Unwanted Answer:** The procedure stops short of a clear 'No'. Because the right is physically viable, it triggers the Values Conflict flag. You cannot dismiss this under the Ghost Provision rule. The 1893 text explicitly permits this; the 2018 Purpose explicitly discourages it. This is not obsolete text; it is conflicting policy. You must refer this to the Panel. You cannot block it alone. The procedure forces you to admit you lack the authority to override clear 1893 text with 2018 guidance without senior endorsement. You remain powerless to stop the harm immediately. The farmer can argue legitimate expectation based on the Act, while the environment agency argues sustainability. You are stuck in the middle, unable to resolve the statutory hierarchy yourself. This delay allows potential ecological damage to continue during the review period, undermining the 2018 Purpose.

  5. Where the procedure breaks
  This procedure fails when 'resilience' is scientifically uncertain. If experts disagree on whether a diversion harms ecosystems, the Impact Check stalls. It also misfires on hybrid rights: a mill-race used for tourism. Is that consumption or status? The Ghost Test might dismiss it incorrectly. Furthermore, it cannot handle cumulative effects; one ghost right is harmless, ten are not. The procedure treats cases in isolation. Finally, it assumes 'Functional Impossibility' is clear. If ice forms once a decade, is harvesting impossible? The binary yes/no forces arbitrary lines on gradual climate shifts. It manages workflow, not justice. It also ignores indigenous rights or common law prescriptions that might sit outside the 1893 text entirely, leaving significant gaps in equitable adjudication.
