prompt: |-
  Right, I'm a case officer at the Midlands Water Tribunal and I'm sick of winging it. We have to apply the old Riparian Act — literal text, hasn't been amended since 1893 — alongside the 2018 Climate Adaptation Purpose Statement, which is all about ecosystem resilience and long-term sustainability. Every week we get a new proposal and I need a decision procdure I can run in about 15 minutes: ordered questions, what counts as a sufficient answer to each, where I stop with a clear yes/no, and where I have to flag it for the panel because it's values not facts. The hard part is ghost provisons — rights named in the 1893 text that don't map onto anything physical now, like 'ice-harvesting easements' or 'mill-race flows'. The procedure needs to say when literalism wins, when purposivism wins, and when they're just talking past each other.

  Please structure your answer like this, in British English:

  1. The practical setup (around 100 words): my role, the time pressure, and why ghost provisons break the usual text-vs-purpose frame.
  2. The procedure (around 400 words): the ordered questions, stop conditions, judgement-call flags, and the specific tie-breaker for ghost rights.
  3. Case A — geothermal boreholes claiming an old 'mill-race flow' right (around 200 words): run the procedure, show where it lands, and include the answer I probably won't like.
  4. Case B — blocking a literal irrigation diversion that the climate purpose clearly wants to stop (around 200 words): same thing.
  5. Where the procedure breaks (around 150 words): misfires, false positives, and what it genuinely can't decide.

  Don't cite philosophers or case law — I haven't got the books to hand and the model answering shouldn't need to look anything up.
