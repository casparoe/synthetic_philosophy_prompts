answer: |-
  ### Reconstructed Commitments

  1.  **The Original Church–Turing Thesis (OCTT) is a conceptual analysis, not an empirical hypothesis.** The department treats the identification of "effectively calculable" with "Turing-computable" as a stipulation that fixes the meaning of *computable* for mathematical discourse. This is why hypercomputation is dismissed in Habit 3: if a machine solves the halting problem, it is by definition not performing a "computation" in the technical sense, regardless of its physical behavior. The boundary of the computable is drawn by the formalism, not by the limits of current engineering.

  2.  **The Extended Church–Turing Thesis (ECTT) is a contingent physical claim.** Unlike the OCTT, the claim that all "reasonable" physical models can be simulated by a probabilistic Turing machine with polynomial overhead is treated as an empirical assertion about our universe. This is why Habit 4 celebrates quantum computing as a refutation: the ECTT is allowed to be false because it describes the *cost* of simulation in this specific physics, not the *definition* of an algorithm.

  3.  **"Reasonable" is indexical to the accepted physical background theory.** When Habit 1 asserts model invariance, "reasonable" implicitly means "consistent with classical physics." When Habit 4 discusses quantum refutation, the set of "reasonable" models expands to include quantum mechanics. The practice assumes a shifting baseline where the invariance claim holds for the class of models currently deemed physically standard, allowing the theory to remain robust while accommodating physical discoveries.

  4.  **Polynomial time is a mathematical surrogate for feasibility, not a physical law.** Habit 2 assumes that the class P is robust under composition and model-translation within the classical realm, making it a useful mathematical proxy for "tractable." This commitment separates the *mathematical* convenience of polynomial closure from the *physical* reality of whether $n^{100}$ is actually runnable, treating the identification of "efficient" with "polynomial" as a sociological convention for theory-building rather than a hard constraint on human capability.

  ### Strict Presuppositions vs. Mere Convenience

  | Habit | Strictly Presupposes | Merely Sits Well With (Compatible but Unnecessary) |
  | :--- | :--- | :--- |
  | **1. Model Invariance** | That classical deterministic, nondeterministic, and randomized machines simulate each other with polynomial overhead. | The claim that *all physically possible* machines obey this overhead (ECTT). It only requires invariance within the classical subset. |
  | **2. Efficient = Poly** | That polynomial functions are closed under composition and addition. | Any specific claim about physical computability or the OCTT. This is a resource-bound convention that could exist even if hypercomputation were possible. |
  | **3. Hypercomputation Dismissal** | That the term "computable" is rigidly defined as "Turing-computable" within the formal system. | The claim that hypercomputation is physically impossible. It only requires that hypercomputation be excluded from the *definition*, regardless of physical reality. |
  | **4. Quantum Refutation** | That the ECTT is an empirical claim subject to falsification by physical theory. | The claim that the OCTT is also empirical. It requires the *efficiency* thesis to be physical, but leaves the *computability* thesis open to be definitional. |

  ### Coherence Verdict

  The package is **coherent**, but only if you accept a bifurcated status for the Church–Turing thesis: the Original Thesis (OCTT) is definitional/conceptual, while the Extended Thesis (ECTT) is empirical/physical. The tension you perceive between Habit 1 (invariance as a convergence result) and Habit 3 (computability as a stipulation) is an apparent one generated by conflating these two distinct theses. Habit 1 describes the *discovery* that all *classical* models converge on polynomial equivalence (an empirical/mathematical fact about classical models), while Habit 3 enforces the *definition* that anything outside Turing-computability is not "computation." The tension between Habit 1 and Habit 4 is resolved by recognizing that Habit 1 is implicitly restricted to classical models, while Habit 4 explicitly updates the physical background to include quantum mechanics, thereby falsifying the classical ECTT without touching the OCTT. The practice is stable because it treats *what* can be computed as a matter of definition (OCTT) and *how fast* it can be computed as a matter of physics (ECTT).

  ### Underdetermination and Priya's Challenge

  The departmental practice does **not** strictly need Priya's natural-kind reading; it functions perfectly well under the standard bifurcation (OCTT = conceptual, ECTT = physical). However, the practice is **underdetermined** at the boundary of physical discovery: as long as physics remains classical, Priya's view (Computable = Physical) and the Department's view (Computable = Turing) yield identical results, masking the incompatibility. If we took Priya's view seriously, "computable" would become a contingent term indexed to the current best physics; papers would require "Physical Assumptions" sections, and evidence for computability would be experimental rather than proof-theoretic. A working hypercomputer would force a semantic revision of "computable." Conversely, under the Department's definitional reading, a working hypercomputer is merely a new oracle; "computable" remains fixed to Turing machines, and the hypercomputer is classified as "hypercomputable," requiring no revision to the definition, only to the map of physical capabilities. The practice remains unchanged until a hypercomputer is actually built, at which point the two readings diverge radically: Priya expands the extension of "computable," while the Department creates a new category for the device.

  ### Seminar Strategy

  **Question:** "When we assert in Habit 1 that 'any reasonable model' simulates another with polynomial overhead, does the set of 'reasonable models' include those consistent with quantum mechanics, or is that claim restricted to classical physics?"

  **Likely Answer:** "The invariance claim in complexity theory is traditionally about classical models; quantum computing shows us that the *physical* version of that claim—the Extended Church–Turing Thesis—needs qualification."

  **Follow-up:** "If the invariance claim is restricted to classical models, then isn't Habit 1 just a theorem about a specific family of mathematical abstractions rather than a foundational principle of computation, and shouldn't we stop invoking it to justify why we don't specify machine models in a course that claims to be about physical feasibility?"
