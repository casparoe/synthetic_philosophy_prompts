  **Q1. Does this belief change how you treat *other* people?**
  *(e.g., Do you judge people who don't believe it? Do you demand they respect it? Do you make decisions for them based on it?)*
  *   **YES** → Go to **Leaf A**.
  *   **NO** → It's purely self-regarding. Go to **Q2**.

  **Q2. Does holding this belief make you ignore real dangers or waste resources?**
  *(e.g., Do you skip the doctor because "Grandma will heal me"? Do you spend money you don't have on ritual items?)*
  *   **YES** → Go to **Leaf B**.
  *   **NO** → It's harmless to you. Go to **Q3**.

  **Q3. Does it matter to you if this is factually true, or only that it makes you feel better?**
  *(e.g., If a friend said "This is scientifically impossible," would you say "I don't care, it helps me" or "Wait, is it really?")*
  *   **ONLY THAT IT HELPS** → Go to **Leaf C**.
  *   **I CARE IF IT'S TRUE** → Go to **Q4**.

  **Q4. Do you think this is literally happening in reality, or is it more like a useful story/metaphor?**
  *(e.g., Is Grandma actually a ghostly presence, or is "Grandma watching" just a way to remind yourself to be good?)*
  *   **USEFUL STORY / METAPHOR** → Go to **Leaf D**.
  *   **LITERALLY HAPPENING** → Go to **Q5**.

  **Q5. If solid proof came along that this was impossible, would you drop the belief?**
  *(e.g., If science proved consciousness ends at death, would you stop believing Grandma is watching?)*
  *   **YES, I'D DROP IT** → Go to **Leaf A**.
  *   **NO, I'D KEEP IT ANYWAY** → Go to **Leaf E**.

  ***

  ### The Leaves (Your Results)

  **Leaf A: Hardline Clifford-Style Evidentialism**
  *   **Where you landed:** Either the belief affects others, OR you privately demand proof and would drop it if contradicted.
  *   **The Vibe:** "Beliefs aren't toys." You think you have a duty to only believe things you have evidence for. If it impacts others, it's dangerous to believe without proof. If it's private, you still feel messy believing something you know might be false. You prioritize intellectual honesty over comfort.

  **Leaf B: The Empty Spot (The Undefended Zone)**
  *   **Where you landed:** Private belief + Self-Harm + Keep Anyway.
  *   **The Vibe:** Philosophically homeless. Nobody really defends this. Clifford says drop it (it's harmful/irrational). James says drop it (beliefs are only justified if they help). Pragmatists say drop it (it doesn't work). If you keep a private belief that actively hurts you, you aren't doing philosophy anymore; you're just stuck in a delusion.

  **Leaf C: Pure Pragmatist**
  *   **Where you landed:** Private + Harmless + Truth Doesn't Matter.
  *   **The Vibe:** "Truth is what works." You don't care if Grandma is *actually* there. You care that believing she is there makes you less anxious. If the belief stops working, you'll toss it. You treat beliefs like tools in a toolbox, not maps of reality.

  **Leaf D: The Fictionalist**
  *   **Where you landed:** Private + Harmless + Truth Matters + It's a Story.
  *   **The Vibe:** "I know it's not true, but I live as if it is." You distinguish between fact and utility. You don't claim Grandma is a ghost (you know that's likely false), but you adopt the *story* of her watching over you because it regulates your behavior. You're honest about the fiction but committed to the practice.

  **Leaf E: James-Style Will-to-Believe (Self-Regarding)**
  *   **Where you landed:** Private + Harmless + Truth Matters + Literally True + Keep Anyway.
  *   **The Vibe:** "I have a right to believe this." You want it to be literally true, and you acknowledge the evidence is missing or shaky. But, because the choice is "live" (it matters to you) and "forced" (you can't wait for proof), you choose to believe. You hold out hope that reality might match your need, even if proof isn't there yet.

  ***

  ### A Note on Separating the Leaves

  There is one pair of leaves that this tree struggles to keep perfectly distinct: **Leaf C (Pure Pragmatist)** and **Leaf E (James-Style)**.

  *   **Why they blur:** Both of you end up keeping the belief because it helps you. The difference is mostly internal: The Jamesian (Leaf E) still *wants* it to be factually true and feels a tension about the lack of proof. The Pragmatist (Leaf C) shrugs and says "factual truth" is just another word for "useful." In practice, you both look the same to an outsider—you're both walking around acting like Grandma is watching.
  *   **Also:** Notice that **Leaf A (Clifford)** appears twice in the tree (at Q1 and Q5). This is intentional. Clifford's rule applies equally to public claims (Q1) and private honesty (Q5). Whether you hurt others or just hurt your own integrity, the Cliffordsian says: "No evidence, no belief."
