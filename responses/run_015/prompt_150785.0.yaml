          *   *Implication:* Suggests the *event of amplification* (the stampede) is the candidate for consciousness, not the durability. But if nothing *uses* it, is it felt? This highlights the "Consumption vs. Transmission" ambiguity.
      *   *Case 3: DMs Only.* (High bandwidth private line).
