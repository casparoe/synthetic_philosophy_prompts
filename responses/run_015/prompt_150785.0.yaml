      *   *The Conflict:*
          *   Camp A (Dennett/Illusionists/GWT hardliners): Access *is* phenomenality. If it's on Slack, it's "felt."
          *   Camp B (Block/Chalmers/Dualists): Access is functional. Phenomenality is the *experience* of reading the Slack message, which isn't explained by the message existing.

