answer: |-
  The objection that actually threatens the paper is the one from the concept researchers, because if categorisation works via similarity to prototypes or stored exemplars, positing a conserved functional core is theoretically unnecessary baggage rather than an explanation.

  ### Early Concessions
  In your opening remarks, concede two points immediately to disarm the room. First, admit that letterforms are artefacts, not natural kinds like proteins or gold; you are using the biological analogy heuristically to explain stability, not ontologically to claim letters evolve via natural selection. Second, concede that your definition of the "core" is provisional and likely incomplete; you are proposing a method (the transplant test) to find it, not delivering a finished dictionary definition. This prevents the Metaphysician and Type Designer from spending their questions correcting your ontology instead of engaging your method.

  ### Objection Prep Sheet

  **1. The Concept Researchers (Prototype & Exemplar)**
  *   **Idiom:** "Psychological evidence suggests categorisation is gradient, not binary. We judge 'a'-ness by similarity to a central prototype or by distance to stored exemplars. Why posit a hidden 'core' or essence when family resemblance accounts for all the variance you describe without invoking unobservable structural constraints?"
  *   **Reply:** "In protein science, sequence similarity often drops to zero while structure remains conserved; if we relied only on 'similarity to a prototype sequence', we would miss the fold entirely. Prototype theory explains how *typical* an instance feels, but it struggles to explain why a highly atypical instance is still accepted as a member while a slightly less atypical one is rejected. The core I propose isn't a mental image; it's a functional constraint. Think of the prototype as the average of the family photos, but the core as the genetic inheritance that makes them a family. I'm arguing that without a functional core, you cannot explain the boundaries of the category when style pushes geometry to the limit."
  *   **Soft Spot:** You are asserting a structural constraint without neural evidence. They have behavioural data; you have an analogy.
  *   **Confidence:** 6/10.

  **2. The Type Designer**
  *   **Idiom:** "Letters are historical artefacts defined by lineage, not function. The single-storey and double-storey 'a' come from different scribal traditions (Carolingian vs. Humanist). Calling them 'convergent evolution' ignores that they are distinct historical kinds. You're relocating a cultural history into a cognitive function where it doesn't belong."
  *   **Reply:** "I respect the lineage, but history alone doesn't guarantee identity. In biology, homologous structures can diverge until they look unrelated, and analogous structures converge until they look identical. My claim is that the reading brain treats them as one category because they solve the same segmentation problem, regardless of their scribal ancestry. If a designer invents a completely new shape tomorrow that passes the transplant test, readers will accept it as an 'a'. History fixes the initial conditions, but function maintains the category across time and style."
  *   **Soft Spot:** You are prioritizing cognitive function over cultural fact. If the design community rejects your functional definition, your "category" lacks social reality.
  *   **Confidence:** 8/10.

  **3. The Philosopher of Language**
  *   **Idiom:** "On a causal-historical theory of reference, 'a' refers to whatever is linked to our usage by a historical chain. On Twin Earth, if they use a triangle for the sound /æ/, is it an 'a'? If yes, your functional core is irrelevant. If no, then reference is fixed by history, not shape or function."
  *   **Reply:** "Reference fixes the *label*, but identity conditions fix the *kind*. I can point to a dog and call it 'cat', but that doesn't make it a cat. Similarly, if Twin Earth uses a triangle for /æ/, it is their *letter* for that sound, but it is not an instance of the Roman 'a' kind. I am analysing the identity conditions of the grapheme type, not the causal chain of the name. The transplant test asks: does this shape play the 'a' role in the visual system? That is a question about kind membership, not reference fixing."
  *   **Soft Spot:** The line between "label" and "kind" is notoriously porous in philosophy of language. You risk sounding like you're ignoring the semantic externalist point.
  *   **Confidence:** 7/10.

  **4. The Senior Metaphysician**
  *   **Idiom:** "You speak of a 'core' and 'identity'. Are you claiming this is a real essence? If letterforms are artefacts, they cannot have natural kind essences. Are you merely describing a cluster of properties that we find useful, rather than a mind-independent reality?"
  *   **Reply:** "I am not claiming letters are natural kinds like electrons. I am claiming they are *functional kinds*, like 'clock' or 'chair'. A clock is not defined by its gears but by its function of timekeeping. Similarly, an 'a' is defined by its function in visual segmentation. The 'essence' is relational and functional, not material. It is real insofar as the visual system treats it as a constraint, which is the only reality that matters for reading."
  *   **Soft Spot:** Functional kinds are often viewed as less rigorous than natural kinds. You are betting on the reality of functional constraints.
  *   **Confidence:** 8/10.

  **5. The Machine Learning Student**
  *   **Idiom:** "In diffusion models, style transfer works by manipulating latent vectors. The 'core' you describe sounds like whichever direction in latent space remains invariant under conditioning. Why do we need a biological metaphor when linear algebra describes the variance perfectly?"
  *   **Reply:** "Linear algebra describes the *distribution*, but not the *constraint*. You can generate a shape that lies within the latent distribution but is unreadable. The 'core' is the boundary condition that keeps the generation legible. My transplant test is essentially an adversarial attack to find that boundary. Your latent directions are descriptive correlations; my core is the causal mechanism that makes the correlation stable."
  *   **Soft Spot:** You may not know enough about their specific architecture to defend this confidently. They might show you a latent direction that perfectly matches your core.
  *   **Confidence:** 5/10.

  **6. The Graduate Students**
  *   **Idiom:** "What about the Greek alpha (α) or Cyrillic а? They look like your single-storey and double-storey 'a's. Are they the same kind? If not, why does your geometric/functional test fail to distinguish them?"
  *   **Reply:** "They are homoplasts—similar structures, different functional systems. An alpha functions within the Greek orthography; an 'a' within the Roman. The 'core' I propose includes the context of the orthographic system. The transplant test must be run within the reader's specific script competence. A shape alone isn't enough; it's shape plus system. This reinforces the functional claim: the function is script-relative."
  *   **Soft Spot:** This complicates your core definition. You originally said "x-height, no ascender." Now you need "within Roman script." It makes the core less geometric and more cultural.
  *   **Confidence:** 7/10.

  **7. The Methodological Skeptic (General)**
  *   **Idiom:** "The transplant test relies on 'competent readers'. Isn't this circular? You define the core by what readers identify as an 'a', but readers identify 'a's by their features. How do you break the circle?"
  *   **Reply:** "It's not circular; it's empirical, like a mutagenesis screen in biology. We don't know which amino acids are essential until we mutate them and see if the protein folds. I am not asking readers to define the 'a'; I am measuring their reaction time or accuracy when features are swapped. The data breaks the circle. If identification drops significantly when a feature is moved, that feature is core. It's an operational definition, not a linguistic one."
  *   **Soft Spot:** You haven't actually run this experiment yet. It's a thought experiment presented as a method.
  *   **Confidence:** 6/10.

  **8. The Question You Hope Nobody Asks (Normativity)**
  *   **Idiom:** "If I, a competent reader, look at a 'b' and genuinely perceive it as an 'a' due to a glitch in my visual system, is it an 'a'? Who has the authority to decide the function: the individual reader or the system?"
  *   **Reply:** "Identity is a property of the public system, not the private experience. A misreading is an error, not a redefinition. The 'function' is defined by the orthographic system's success conditions, not individual phenomenology. We determine the core by aggregate competence, much like we define 'normal vision' by population statistics, not by one observer's hallucination."
  *   **Soft Spot:** This leans heavily on social normativity. If enough people misread it, the function changes. You are assuming a stable system that might be more fluid.
  *   **Confidence:** 5/10.

  ### Least Sure Claim
  The claim I am least sure of is the tentative formulation of the core itself ("enclosing a counter... at x-height"). This is the weakest link because it is currently a verbal description of a geometric relationship, whereas the entire paper argues against geometric definitions. If the core cannot be stated without referencing shape, the distinction between "core" and "style" collapses.
