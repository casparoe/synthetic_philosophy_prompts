answer: |-
  # Section Plan: The Ecology of Stopping

  **Course:** Behavioral Decision Making  
  **Topic:** Satisficing, Bounded Rationality, and Ecological Rationality  
  **Time:** 75 Minutes  
  **Students:** 18 Undergrads (Econ/Psych)  
  **Instructor Role:** Facilitator/Dealer (No lecture)

  ---

  ## 1. Materials & Prep

  **You need to print/prepare the following:**

  1.  **The Handout (1 Page):** See text below. Print 18 copies.
  2.  **The Decks (4 Sets):** You need 4 distinct stacks of 10 cards each (one stack per table).
      *   *Card Design:* Each card has a **Signal** (large number on front) and a **True Value** (hidden number on back/inside).
      *   *Deck A (Kind World):* Signal correlates highly with Value (Signal 8 $\rightarrow$ Value 8-10).
      *   *Deck B (Cruel World):* Signal correlates negatively or zero (Signal 8 $\rightarrow$ Value 2-5).
      *   *Deck C (Jackpot World):* 9 cards are Value 10, 1 card is Value 90. Signals are all identical (e.g., all say "5").
      *   *Deck D (Flat World):* All cards have Value 50. Signals vary wildly (10-90).
      *   *Note:* Use index cards. Write Signal on front, True Value on back. Seal the "True Value" with a small sticker or fold so they must physically "break" or "open" it to inspect.
  3.  **Aspiration Slips:** Small half-sheets of paper for the initial goal setting.
  4.  **Timer:** A visible countdown timer projected on a screen or phone.
  5.  **Score Sheets:** For recording final Net Scores and Satisfaction ratings.

  ---

  ## 2. The One-Page Handout

  **(Print this exactly as is)**

  **ACTIVITY: THE APARTMENT HUNT**  
  **Goal:** Maximize your **Net Score**.  
  **Time Limit:** 15 Minutes. If you have not selected an apartment by the end, your score is **0**.

  **THE RULES**  
  1.  **Arrival:** You receive one Apartment Card per minute. You may only hold one card at a time.
  2.  **Signal:** The number on the **Front** is the "Curb Appeal." It is free to see.
  3.  **Inspection:** To see the **True Value** (on the Back), you must peel the sticker. **Cost: 10 Points.**
  4.  **Search:** To reject the current card and wait for the next minute's card, you pay a travel cost. **Cost: 5 Points.**
  5.  **Commit:** To keep an apartment, stop the game for your table. Your game ends immediately.
  6.  **Aspiration:** Before starting, you wrote a target True Value. If you Commit to a value below this target, you may **Revise** your aspiration, but it costs **20 Points** (Psychological Cost).

  **PAYOFF CALCULATION**  
  **Net Score = (True Value of Selected Apartment) – (Total Inspection Costs) – (Total Search Costs) – (Revision Costs)**

  **EXAMPLE**  
  You search 3 times (15 pts), inspect 2 apartments (20 pts), and commit to a Value of 80. You did not revise aspiration.  
  **Net Score = 80 – 15 – 20 = 45 Points.**

  **IMPORTANT**  
  *   Do not talk to other tables. You are in different neighborhoods.
  *   Do not open the "True Value" until you are ready to pay the Inspection Cost.
  *   Watch the timer. Time is the ultimate constraint.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Instructor Script / Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide class into 4 tables (4-5 students each). Hand out Decks (face down), Handouts, and Aspiration Slips. |
  | **05-10** | **Aspiration Setting** | "Before you see any cards, write down the **True Value** you hope to find. Be ambitious. This is your contract." Collect slips. Do not let them change this yet. |
  | **10-11** | **Rules Check** | "One card per minute. Front is free. Back costs 10. Passing costs 5. Timer starts now." |
  | **11-26** | **The Game** | **Start Timer (15:00).** <br>Every 60 seconds, announce: *"New Option Available."* Tables flip the top card of their stack. <br>*Crucial:* Walk around. Watch who inspects vs. who passes. Watch who looks anxious. Do not answer strategy questions. |
  | **26-27** | **Hard Stop** | "Time. Pencils down. If you haven't committed, your score is 0." |
  | **27-35** | **Scoring & Silence** | Have tables calculate Net Scores. <br>**Individual Task:** On a sticky note, write: (1) Net Score, (2) Satisfaction (1-10), (3) One sentence: "I feel I..." |
  | **35-75** | **Debrief** | See Debrief Guide below. |

  ---

  ## 4. Debrief Guide (40 Minutes)

  *Do not lecture. Draw the theory out of their experience.*

  **Phase 1: The Scoreboard (10 mins)**
  *   **Action:** Write the 4 Table Net Scores on the board.
  *   **Ask:** "Which table won? Why?"
  *   **Reveal:** Reveal the Deck Types (Kind, Cruel, Jackpot, Flat).
  *   **Point:** "Table A (Kind) likely stopped early. Table C (Jackpot) likely searched too much or got unlucky. Your score depended on the **environment**, not just your skill. This is *Ecological Rationality*."

  **Phase 2: The Feeling Gap (15 mins)**
  *   **Action:** Plot Satisfaction (Y-axis) vs. Net Score (X-axis) using their sticky notes.
  *   **Observation:** You will likely see high-scorers (early stoppers) with lower satisfaction.
  *   **Ask:** "Table A, you have the highest score. Look at your satisfaction ratings. Why isn't it a 10?"
  *   **Expected Answer:** "I wondered what was in the other cards." "I felt like I quit." "I didn't do enough work."
  *   **Theory Link:** "You experienced the **Opportunity Cost of Information**. Stopping early saved points (Rational), but it denied you the *closure* of knowing the alternative (Psychological Cost). Satisficing feels like 'settling' even when it wins."

  **Phase 3: Costs & Aspiration (10 mins)**
  *   **Ask:** "Who paid the Revision Cost? Why?"
  *   **Theory Link:** "You set your aspiration on *Gross Value* (the perfect apartment). But rationality is about *Net Value* (Value minus Cost). When you revised, you paid to align your psychology with the math. Most people don't revise enough; they chase the Gross Value until they run out of time."
  *   **Ask:** "Who inspected the back of the card immediately? Who trusted the Signal?"
  *   **Theory Link:** "In the Cruel World, inspection was waste. In the Kind World, inspection was insurance. A rational agent changes their inspection habit based on the world. Did you know which world you were in? No. That is *Bounded Rationality*."

  **Phase 4: Wrap Up (5 mins)**
  *   **Summary:** "Rationality isn't a trait you have. It's a fit between your strategy and the environment. Sometimes the rational move is to stop looking, even if it feels wrong."

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. "The Room Finished in 10 Minutes."**
  *   **Why:** One table figured out the "Flat World" or "Kind World" quickly and stopped. Others followed suit.
  *   **Fix:** If >50% finish early, stop the game for everyone. Use the remaining time for the Debrief. The data is still valid.
  *   **Say:** "The market closed early. This happens in real life. Now we analyze why."

  **2. "One Table Refused to Stop."**
  *   **Why:** They are maximizing. They want to see every card.
  *   **Fix:** Enforce the 15-minute hard stop ruthlessly. Give them a 0 if they haven't committed.
  *   **Say:** "In this model, indecision is the most expensive cost of all. Your score is 0. Let's discuss why that happened."

  **3. "Someone Gamed the Proxy."**
  *   **Why:** A student peeks at the next card in the stack before the minute is up.
  *   **Fix:** Warn them at Minute 5 that cheating invalidates the "Bounded" part of Rationality. If caught, add a 50-point penalty.
  *   **Say:** "Bounded rationality assumes you can't see the future. If you cheat, you break the simulation."

  **4. "The Inspection Cost Was Too Low."**
  *   **Why:** They inspect every card because 10 points feels cheap compared to a Value of 80.
  *   **Fix:** For future runs, increase Inspection to 15 points. For this run, highlight it in debrief: "If inspection felt cheap, you searched too much. That's why your score is lower than Table A."

  ---

  ## 6. Limitations: What This Game Can't Stage

  *Be honest about this at the very end of the debrief.*

  **The Limitation:** "This game is a **one-shot** decision. In real life, you learn the environment over time. If you played this 10 times, you'd learn which Deck you have and adjust. Satisficing is often a *learning heuristic*, not just a stopping rule. Today, you were blindfolded. In the real world, you get to take the blindfold off eventually."

  ---

  ## 7. The "Did It Land?" Check

  *At the very last minute (Minute 74), hand out a slip with one question.*

  **Question:** "Imagine you found an apartment worth 85 points after looking at only 2 options. Your friend looked at 10 options and found one worth 85 points. Who made the better decision? Why?"

  *   **Correct "Landed" Answer:** "The one who looked at 2 options. They saved search costs for the same outcome."
  *   **Un-landed Answer:** "The friend. They did more research / were more thorough."

  *Collect these as they leave. If >50% say "The Friend," you need to emphasize the *cost* of search more heavily next time.*

  ---

  ## 8. Instructor Notes for American English & Tone

  *   **Spelling:** Ensure all printed materials use **Behavior** (not Behaviour), **Program** (not Programme), **Modeling** (not Modelling).
  *   **Tone:** Keep it brisk. You are running a lab, not giving a sermon.
  *   **International Students:** Avoid idioms in your spoken instructions (e.g., don't say "ballpark figure," say "approximate target"). The Handout is their anchor; ensure they read it.
  *   **The "Feeling" Trap:** During the debrief, do not validate the maximizers. If a student says, "But I feel like I should have looked more," reply with, "That feeling is exactly what we are studying. It feels right, but did it pay?"

  ---

  ## 9. Deck Construction Details (For You)

  *   **Deck A (Kind):** 10 Cards. Signal = Value + random (-1, 0, +1). *Strategy: Trust Signal, Stop Early.*
  *   **Deck B (Cruel):** 10 Cards. Signal = 10 - Value. *Strategy: Ignore Signal, Inspect or Random.*
  *   **Deck C (Jackpot):** 10 Cards. Nine cards: Signal 5 / Value 10. One card: Signal 5 / Value 100. *Strategy: Search until time nearly runs out.*
  *   **Deck D (Flat):** 10 Cards. Signal Random (1-10). Value = 50 for all. *Strategy: Stop Immediately, Inspection is waste.*

  *If you distribute these randomly, you guarantee the "Environment Matters" point.*
