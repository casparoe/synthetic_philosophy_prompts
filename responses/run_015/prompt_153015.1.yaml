answer: |-
  Below is a specification of the desiderata for a normative theory of belief and action under mugging conditions, incorporating both the classic single-agent wager and your proposed "Distributed Epistemic Mugging" variant.

  ### I. Desiderata for Rational Belief and Action Under Mugging Conditions

  #### 1. Immunity to Dominance by Unbounded Utility
  *   **Motivation:** In the classic Pascal's Mugging scenario, a hypothesis with infinitesimal probability ($P \to 0$) and infinite utility ($U \to \infty$) yields an expected value that dominates all finite alternatives. An adequate theory must prevent an agent from being compelled to sacrifice all finite resources to satisfy every such claim.
  *   **Distinction:** This requires distinguishing between *mathematical expectation* and *decision-relevant weight*. It must prevent the "tyranny of the long tail" where absurd claims dictate policy.
  *   **Status:** **Non-negotiable Core Constraint.** Any theory that permits an agent to be drained of resources by logically possible but evidentially baseless claims is pragmatically self-defeating.

  #### 2. Aggregate Burden Management (The Distributed Constraint)
  *   **Motivation:** This addresses your "Distributed Epistemic Mugging." In an information ecosystem, an agent faces $N$ independent claims, each with low probability and high stakes (e.g., 50 different charities claiming to avert distinct existential catastrophes). Individually, none trigger a high-alert threshold; collectively, they demand more resources than the agent possesses.
  *   **Distinction:** The theory must distinguish between *individual claim validity* and *portfolio allocation*. It must solve the problem of "death by a thousand cuts" where rational acceptance of individual micro-wagers leads to collective insolvency.
  *   **Status:** **Non-negotiable Core Constraint.** A theory that works for single-shot wagers but fails in high-noise information environments is ecologically invalid.

  #### 3. Preservation of Tail Risk Sensitivity
  *   **Motivation:** While avoiding mugging, the theory must not blind the agent to *genuine* low-probability, high-stakes risks (e.g., asteroid impacts, pandemic preparedness, AI alignment). Dismissing all low-probability claims as "muggings" invites catastrophic negligence.
  *   **Distinction:** This requires a mechanism to distinguish *manufactured uncertainty* (arbitrary mugging narratives) from *epistemic uncertainty* (genuine scientific unknowns with high variance).
  *   **Status:** **Non-negotiable Core Constraint.** A theory that ensures solvency at the cost of existential survival is evolutionarily unstable.

  #### 4. Prior Robustness and Manipulation Resistance
  *   **Motivation:** In both classic and distributed mugging, the leverage comes from the ability of an interlocutor to assert a hypothesis that forces a prior update disproportionate to the evidence provided.
  *   **Distinction:** The theory must separate *testimony* from *evidence*. It must enforce constraints on how much a prior probability can shift based solely on the *stakes* asserted by the claimant.
  *   **Status:** **Non-negotiable Core Constraint.** This is a requirement of Bayesian coherence; priors cannot be arbitrarily hostage to the content of a proposition.

  #### 5. Doxastic-Pragmatic Transparency
  *   **Motivation:** Theories differ on whether high stakes can justify *belief* (Pragmatism) or only *action* (Evidentialism). In a distributed environment, acting on a claim without believing it creates cognitive dissonance and signaling noise.
  *   **Distinction:** The theory must explicitly state whether it is regulating *credence* (degree of belief) or *wagering policy* (decision rule). It must clarify if "acting as if" is sufficient or if genuine belief revision is required.
  *   **Status:** **Camp-Specific Preference.**
      *   *Evidentialists:* Require separation (Belief tracks evidence only).
      *   *Pragmatists:* Allow integration (Belief tracks practical necessity).
      *   *Decision Theorists:* Often indifferent to belief, focused on action.

  #### 6. Tractability Under Bounded Resources
  *   **Motivation:** Calculating the expected utility of distributed mugging claims requires assessing correlations between risks and diminishing marginal utility of resources. An agent cannot perform infinite calculations.
  *   **Distinction:** Distinguishes between *ideal rationality* (god's eye view) and *resource-bounded rationality* (human/algorithmic limits).
  *   **Status:** **Non-negotiable Core Constraint.** A normative theory that requires infinite computation to avoid exploitation is not a theory for agents.

  #### 7. Systemic Epistemic Hygiene
  *   **Motivation:** In the distributed variant, the cost is not just individual resource loss but the social cost of widespread false positives (e.g., panic, cult formation, misallocation of public funds).
  *   **Distinction:** Distinguishes between *individual rationality* and *collective rationality*. A move rational for one agent (hedging against a mugging) may be irrational if adopted by the population (widespread resource waste).
  *   **Status:** **Contested Norm.** Strict methodological individualists may reject this, but social epistemologists view it as essential.

  ---

  ### II. Analysis of Joint Satisfiability (Impossibility Results)

  There is a fundamental tension among these desiderata, leading to a trilemma. It appears impossible to simultaneously satisfy the following three conditions:

  1.  **Unbounded Utility Maximization:** The agent always maximizes expected utility, regardless of the magnitude of the stakes.
  2.  **Bayesian Openness:** The agent assigns non-zero prior probability to any logically possible hypothesis asserted by a credible source.
  3.  **Immunity to Mugging:** The agent is not compelled to pay finite costs for infinitesimal probabilities of infinite payoffs.

  **The Contradiction:**
  If you accept (1) and (2), you violate (3). If $P(H) > 0$ and $U(H) = \infty$, then $EU(H) = \infty$, dominating any finite cost. To satisfy (3), you must reject either (1) or (2).

  *   **Rejecting (1):** You must cap utility functions or use non-expected-utility decision rules (e.g., stochastic dominance, leximin).
      *   *Cost:* This risks violating **Desideratum 3 (Tail Risk Sensitivity)**. If you cap utility to avoid mugging, you may also cap the utility of preventing genuine existential catastrophes, rendering the agent indifferent to human extinction if the probability is low enough.
  *   **Rejecting (2):** You must assign zero prior probability to certain classes of hypotheses (e.g., "magic," "infinite payoffs").
      *   *Cost:* This risks violating **Desideratum 4 (Prior Robustness)** if the criteria for "zeroing out" priors are ad hoc. It also creates dogmatism; if a genuine black swan event falls into the "zeroed" category, the agent cannot learn it.

  **Implication for the Project:**
  An adequate theory cannot be a pure Expected Utility Theory (EUT) with standard Bayesian priors. It must introduce a **complexity penalty** or a **prior decay function** that scales inversely with the magnitude of the claimed stakes. However, this introduces a new vulnerability: **The Simplicity Mugging.** An adversary could construct a complex-sounding narrative that is actually computationally simple but implies high stakes, bypassing the complexity penalty.

  Therefore, **Desideratum 1 (Immunity)** and **Desideratum 3 (Tail Risk Sensitivity)** are in tension. Satisfying both requires a meta-epistemic heuristic that distinguishes *structural plausibility* from *narrative stakes*, which is not formally defined in standard decision theory.

  ---

  ### III. Framework Evaluation

  Here is how three prominent frameworks fare against the desiderata, focusing on their structural capacities rather than specific verdicts.

  #### 1. Bayesian Threshold View
  *   **Mechanism:** Belief/Action is prohibited if $P(H) < \epsilon$, regardless of $U(H)$.
  *   **Performance:**
      *   *Strengths:* Satisfies **Immunity (1)** and **Tractability (6)**. It cleanly solves the Distributed variant by filtering out noise before aggregation.
      *   *Weaknesses:* Fails **Tail Risk Sensitivity (3)**. Genuine existential risks often have $P < \epsilon$. It creates a "cliff edge" where a risk at $\epsilon - 0.001$ is ignored, but $\epsilon + 0.001$ triggers panic.
      *   *Verdict:* Robust against exploitation, but brittle against genuine black swans.

  #### 2. Robust Evidentialist Rejection
  *   **Mechanism:** Belief is governed solely by evidence ratio; high stakes do not lower the evidential bar. Action may be hedged, but belief is not revised.
  *   **Performance:**
      *   *Strengths:* Satisfies **Prior Robustness (4)** and **Doxastic-Pragmatic Transparency (5)** (by keeping them separate). It maintains **Epistemic Hygiene (7)** by preventing belief contagion.
      *   *Weaknesses:* Struggles with **Aggregate Burden (2)**. If action is decoupled from belief, on what basis does one allocate resources to low-evidence risks? It risks paralysis in the Distributed variant (no claim meets the bar, so no action is taken, even if the portfolio of risks is dangerous).
      *   *Verdict:* Epistemically safe, but pragmatically potentially inert in high-uncertainty environments.

  #### 3. Pragmatic Decision-Theoretic Framework
  *   **Mechanism:** Belief and Action are unified under a norm of "best outcome." Stakes can influence credence (Pascalian reasoning).
  *   **Performance:**
      *   *Strengths:* Maximizes **Tail Risk Sensitivity (3)**. It is the most responsive to genuine existential threats.
      *   *Weaknesses:* Fails **Immunity (1)** and **Prior Robustness (4)**. It is highly vulnerable to the Distributed Mugging; if stakes can inflate credence, an ecosystem of high-stakes claims will saturate the agent's capacity. It also violates **Epistemic Hygiene (7)** by encouraging belief based on fear rather than evidence.
      *   *Verdict:* High responsiveness, but high vulnerability to manipulation and resource exhaustion.

  ### Summary
  The core theoretical challenge is not solving the mugging in isolation, but solving the **Distributed Aggregation Problem** without blinding the agent to **Tail Risks**. No existing framework satisfies all non-negotiable desiderata simultaneously. A viable synthesis likely requires a hybrid model: Evidentialist constraints on *belief* (to maintain hygiene and prior robustness) combined with a bounded, non-linear decision rule for *action* (to manage aggregate risk without succumbing to infinite utility dominance).
