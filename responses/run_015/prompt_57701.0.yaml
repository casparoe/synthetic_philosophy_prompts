  I reject step (3) because it falsely assumes the Precautionary Principle applies symmetrically to interventions and omissions despite their differing epistemic and agential conditions.

  1. **The Rejection:** The temptation of (3) arises directly from (6): if the status quo is risky, why burden only change? It treats risk magnitude as the sole trigger for PP, ignoring the principle's focus on *uncertainty introduced by agency*. Step (3) conflates accepting natural uncertainty ("not-A") with introducing novel, unquantifiable variables ("A"). The burden lies on the agent altering the system, not the agent maintaining it, even if both carry risk. By rejecting (3), you acknowledge that while risks exist on both sides (preserving 6), the epistemic burden falls on the party proposing to disrupt the baseline with uncertain consequences. This blocks the paralysis without denying the riskiness of the status quo.

  2. **The Pricing:** Rejecting (2) denies foregone risks, forcing you to abandon (6), which you rightly reject as empirically false. Rejecting (9) saves PP by sacrificing the doing/allowing distinction, violating your second constraint. Rejecting (3) keeps both commitments but narrows PP. It survives not as a substantive ban on risk, but as a procedural rule shifting the burden of proof to innovators under uncertainty. Is this version worth keeping? Yes, because it prevents regulatory capture by innovators who profit from uncertainty. It does not become mere comparative risk assessment; standard assessment weighs probabilities, whereas PP operates specifically where probabilities are unsettled, prioritizing error avoidance on the side of intervention rather than optimizing expected utility. It remains a distinct heuristic for ignorance.

  3. **The Spillover:** (10) does not follow. The doing/allowing distinction is grounded in moral causation and responsibility, not merely regulatory baseline selection. Even if regulatory baselines are arbitrary allocations of risk (per 6), moral responsibility for initiating harm differs fundamentally from responsibility for failing to prevent it. The argument borrows the regulatory symmetry of (3) to prove a moral asymmetry false, but moral asymmetry survives regulatory paralysis. You can maintain that doing harm is worse than allowing it, even if both options carry risk and the regulatory principle must pick a default burden. The refutation of PP as a symmetric rule does not refute the moral asymmetry of agency; it merely shows that regulatory burdens cannot be mirrored onto moral ontology without distortion.
