answer: |-
  This is a fantastic set of intuitions. You are effectively reconstructing a debate that has animated philosophy of technology since Langdon Winner's 1980 essay *Do Artifacts Have Politics?* Your roommate is taking the **Instrumentalist** view (tools are neutral; only users have intent), while you are gravitating toward **Material Politics** (tools embody specific forms of power).

  Your draft principle is close, but you're right to worry about the "rebuilding the world" clause. It's too vague. To capture your specific verdicts (especially the distinction between the *stoop* and the *video app*), we need to tighten the definition of where the constraint lives.

  Here is the principle that best fits your list, followed by the cost of adopting it and the predictions for your new cases.

  ### The Principle: Embedded Asymmetric Friction

  **Statement:**
  > An artifact possesses a politics when its material or logical architecture imposes **asymmetric friction** on different social groups, such that:
  > 1.  **Embeddedness:** The source of the friction is intrinsic to the artifact's operation (not contingent on external infrastructure failing).
  > 2.  **Correlation:** The friction systematically correlates with a pre-existing social hierarchy (ability, class, language, race).
  > 3.  **Inertia:** The friction is stable over time and cannot be bypassed without modifying the artifact itself or the systemic rules governing its use.

  ---

  ### Mapping Your Cases to the Clauses

  This principle validates most of your gut instincts but clarifies *why* they hold.

  *   **The Low Overpasses & Bus Benches:**
      *   **Clause 1 (Embeddedness):** The height of the concrete and the rail on the bench are physical properties of the artifact.
      *   **Clause 2 (Correlation):** They exclude specific groups (bus riders, homeless people).
      *   **Clause 3 (Inertia):** You cannot wish them away; you need a jackhammer.
      *   *Verdict:* **Yes.** (Matches your intuition).

  *   **The 1926 Stoop:**
      *   **Clause 1:** The steps are intrinsic.
      *   **Clause 2:** Correlates with physical ability.
      *   **Clause 3:** High inertia.
      *   *Note on "Inherited":* This principle clarifies your worry about the "inherited" distinction. **Intent does not matter.** Whether the builder *meant* to exclude wheelchair users is irrelevant; the *effect* is embedded exclusion. The politics is in the *affordance*, not the *intent*.
      *   *Verdict:* **Yes.** (Matches your intuition).

  *   **The Photocopier:**
      *   **Clause 2 (Correlation):** Fails here. The machine imposes the *same* friction on a dissident as it does on a corporation. It copies text equally well. The outcome differs, but the *artifact's operation* does not discriminate.
      *   *Verdict:* **No.** (Matches your intuition).

  *   **The Voting Machine (Language) & Face Scanner:**
      *   **Clause 1:** The code logic (extra taps) and sensor sensitivity are intrinsic.
      *   **Clause 2:** Correlates with language proficiency and skin tone.
      *   **Clause 3:** A voter cannot "think" their way past the extra taps; the software must change.
      *   *Verdict:* **Yes.** (Matches your intuition, including the unintentional bias of the scanner).

  *   **The Tomato Harvester:**
      *   **Clause 1 & 3:** The machine's efficiency curve is intrinsic. It *only* works economically at a massive scale.
      *   **Clause 2:** Correlates with capital (large agribusiness vs. small family farms).
      *   *Verdict:* **Yes.** (Matches your intuition that it's a "different kind" of yes—it's structural/economic rather than direct access).

  ### The Cost: Which Verdicts Must You Change?

  To hold this principle consistently, you have to adjust two verdicts. One you suspected, and one you didn't.

  **1. The Video Call App (You said "No," Principle says "Yes")**
  You argued the exclusion is "broadband," not the app. But look at the **Stoop**. If a wheelchair user can't enter your building, is the exclusion caused by "gravity" or "the stoop"? It's the stoop's *response* to gravity that matters.
  Similarly, the app's *code* chooses to require high-bandwidth protocols (VoIP) rather than low-bandwidth protocols (PSTN/dial-in). That choice is **Embedded** in the app, just as the steps are embedded in the stoop. The broadband is the *environment* (like gravity); the app is the *artifact*.
  *   **Correction:** The app **is political**. It delegates the decision of "who is a valid participant" to "who has high-speed internet." By not building a low-tech backdoor (dial-in), the designers encoded a class/geographic bias into the software.

  **2. The Future Overpasses (You said "Unsure," Principle says "Contingent")**
  Your professor is right to push you on the "system." Under this principle, politics is **relational**, not magical.
  *   **Scenario A:** If the parkway runs only short electric shuttles, the overpass no longer imposes asymmetric friction. It's just a bridge. **The politics vanishes.**
  *   **Scenario B:** If the parkway runs standard buses that are too tall, the overpass now excludes *everyone* from using that road. It becomes a general barrier, not a discriminatory one.
  *   **Correction:** The politics is not a permanent stain on the concrete. It exists only as long as the **Artifact-Context fit** produces asymmetry. If the context changes (car-free city), the politics changes. This supports your roommate slightly (context matters) but keeps your core point (the material form still dictates the *terms* of the context).

  ### Predictions for Your New Cases

  Here is what the Principle of Embedded Asymmetric Friction predicts for the cases you haven't decided yet.

  **1. The Chatbot's Default Persona (System Prompt)**
  *   **Analysis:** The system prompt dictates tone, values, and refusal criteria (e.g., "be helpful but neutral," or "avoid political topics"). This is **Embedded** code. It creates **Asymmetric Friction** for users whose communication styles or needs conflict with that persona (e.g., a user seeking radical political analysis vs. a corporate user seeking safe copy).
  *   **Verdict:** **Yes.** The persona is a form of governance. It enforces a specific normative framework on the interaction.

  **2. The Phone's Autocorrect Dictionary**
  *   **Analysis:** The dictionary prioritizes Standard English. It imposes **Asymmetric Friction** on speakers of AAVE (African American Vernacular English), dialects, or non-native speakers, constantly "correcting" their language to the norm. This is **Embedded** in the software weights.
  *   **Verdict:** **Yes.** This is a classic example of linguistic politics delegated to software. It subtly disciplines users into a specific linguistic hierarchy.

  **3. The Smart Package Lockers (App Required)**
  *   **Analysis:** This is the closest parallel to the **Stoop**. The locker requires a specific key (a smartphone + app). This imposes **Asymmetric Friction** on the elderly, the poor, or the technologically illiterate. Unlike the Video App (where you blamed the broadband), the *authentication method* is intrinsic to the locker's design. They *could* have installed a keypad, but they didn't.
  *   **Verdict:** **Yes.** This is "Digital Stoop." It excludes a specific demographic through a design choice that prioritizes convenience for the majority over access for the minority.

  ### Summary for Your Reading Group

  You can tell your roommate that he is right that artifacts don't have *intent*, but wrong that they don't have *consequences*. The principle you are using is that **design decisions are frozen social decisions.**

  When an engineer sets a tolerance, they are deciding what fits. When a developer sets a requirement, they are deciding who enters. If those tolerances and requirements map onto existing social inequalities (race, class, ability), the artifact isn't just a tool; it's a **gatekeeper**.

  Your intuition on the **Photocopier** was correct (it's a neutral tool), but your intuition on the **Video App** was too generous to the software. Treat code like concrete: if it blocks someone, it's political.
