prompt: |-
  I teach an upper-level undergraduate seminar on reasons and motivation: 14 students, one 90-minute session. They have already met the standard indirect-normativity family of views — roughly, that what an agent has reason to do is fixed by what a better-informed, more vividly imaginative, less irrational counterpart of that agent would want or advise, rather than by her actual desires. I want a structured role-play that makes them run into, rather than hear about, two features of idealizing in this way, and I don't want to open with a lecture or name either problem until the debrief.

  The first is estrangement: as the counterpart's information and imagination improve, her verdicts can drift free of anything the actual agent cares about, so that it stops being obvious why the advice binds her. The second is that the counterpart is not yet well defined: whether you correct the agent's factual beliefs first and then let her desires settle, or strip out desires that depend on false beliefs before supplying the information, seems to change the answer, and there is no further ideal-level resource that settles which order is the right one.

  My idea is to give each student a deliberately thin vignette — a decision, a few circumstances, almost nothing about the agent's motives, so they have to fill in the rest themselves — and to have each agent advised by two consultants working under different written instructions about the order and extent of idealization. Each consultant must attach to every recommendation a note of which feature of the actual agent's concerns it traces back to. Each agent then commits in writing, in front of the room, to which recommendation she would act on.

  Please give me the roles and rules, the vignette, the two instruction sheets, a minute-by-minute timeline, and a debrief that maps the moments students will actually hit onto the two problems and onto what the view needs in order to survive them: a uniqueness claim about the idealization procedure, or an account of why inheritance from the actual agent fails. Tell me what will predictably go wrong the first time — consultants quietly importing their own values, agents treating the exercise as prediction rather than advice — and be frank about which part of the problem the role-play cannot stage and I will have to argue for myself. If the set-up as I have described it manufactures the divergence rather than exposing it, or if the thing only works after the lecture I said I didn't want, say so plainly rather than handing me a polite design.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar (14 students, 90 mins). Topic: Reasons and Motivation (Indirect Normativity/Ideal Advisor theories).
      *   **Goal:** A structured role-play to expose two specific problems *experientially* before naming them in a debrief.
      *   **Problem 1 (Estrangement):** The idealized self drifts so far from the actual self's concerns that the binding force of the advice is unclear.
      *   **Problem 2 (Indeterminacy/Ordering):** The order of idealization (information first vs. desire correction first) changes the outcome, with no higher-level fact to settle the order.
      *   **Constraints:** No opening lecture. Don't name the problems until debrief. Use thin vignettes. Two consultants per agent with different instructions. Consultants must trace advice to actual concerns. Agents commit publicly.
      *   **Deliverables:** Roles/Rules, Vignette, Instruction Sheets, Timeline, Debrief, Prediction of Failure/Limitations.
      *   **Tone:** Frank, critical, pedagogical. Don't sugarcoat if the design has flaws.

  2.  **Evaluate the Proposed Design (Self-Correction/Critique):**
      *   *The User's Idea:* Thin vignettes + Two Consultants (different idealization orders) + Agent Commitment.
      *   *Potential Pitfall 1 (Manufacturing Divergence):* If the vignette is *too* thin, students might just invent whatever they want, making the divergence arbitrary rather than structural. If it's *too* thick, the divergence might not appear. The vignette needs to be "fragile" enough that the order of operations matters.
      *   *Potential Pitfall 2 (Estrangement):* This is hard to stage in a 90-minute roleplay. Students playing "Idealized Consultants" tend to be *nice* and *helpful*, not alien. They naturally try to bridge the gap. To get estrangement, the "Idealized" version needs to recommend something the "Actual" agent finds repulsive or unintelligible.
      *   *Potential Pitfall 3 (The "Ordering" Problem):* This is the stronger candidate for a role-play. It's procedural. "Fix beliefs then desires" vs. "Fix desires then beliefs."
      *   *Critical Feedback:* The user asked me to be frank. If the setup manufactures divergence, I need to say so. Actually, the ordering problem *is* structural, but only if the vignette involves a desire that *depends* on a false belief. If the desire is independent, the order won't matter. So the vignette *must* hinge on a specific false belief driving a specific desire.
      *   *Estrangement Challenge:* In a short roleplay, students won't naturally push the idealization far enough to create *estrangement*. They will stop at "smarter version of me." To force estrangement, the instructions need to push the consultants to eliminate *contingent* desires, not just irrational ones.
      *   *Refinement:* I need to ensure the vignette forces the "Ordering" issue and the instructions force the "Estrangement" issue. I also need to manage the group size (14 students). 14 is awkward for trios (Agent + 2 Consultants). 14 = 4 trios (12 students) + 2 observers? Or 2 groups of 7? Let's go with 4 Trios (12 students) + 2 Facilitators/Observers (or just 4 trios and 2 students sit out/rotate, but 90 mins is tight for rotation). Better: 4 Trios (12 students) + 2 General Observers who track the "traceability" requirement.

  3.  **Drafting the Content:**

      *   **Vignette:** Needs a false belief that sustains a desire.
          *   *Idea:* An artist who believes their work is already perfect (false) and desires to stop practicing (desire).
          *   *Idea:* A person who believes a friend betrayed them (false) and desires revenge.
          *   *Selection:* The "Betrayal/Revenge" one is classic. Let's make it slightly more nuanced. A student believes a professor stole their idea (false) and desires to file a formal complaint.
          *   *Wait, needs to be "Thin":* User said "deliberately thin." Okay, let's keep it sparse but structurally critical.
          *   *Revised Vignette:* "Alex" wants to drop out of school to pursue a startup. Alex believes the startup is already profitable (False: it's burning cash). Alex values "independence" and "success."
          *   *Why this works:* If you fix beliefs first (it's failing), the desire to drop out might vanish (Order A). If you fix desires first (what do you want *independently* of beliefs?), maybe they want independence regardless, so they drop out anyway to learn, even if it fails (Order B).
          *   *Actually, for Estrangement:* We need the Ideal Advisor to say something Alex hates. Maybe the Ideal Advisor says "Go work at a bank." Why? Because the Ideal Advisor values *security* which Alex doesn't currently care about, but arises from full information.
          *   *Let's refine the Vignette for Maximum Friction:*
              *   **Agent:** Jamie.
              *   **Current State:** Deeply in debt.
              *   **Current Desire:** To buy a specific expensive item (e.g., a vintage car) to feel "accomplished."
              *   **False Belief:** That restoring this car will be a profitable investment (it won't).
              *   **Value:** "Authenticity" and "Legacy."

      *   **Consultant Instructions:**
          *   *Consultant A (Belief-First):* Correct all factual errors *then* see what desires remain.
          *   *Consultant B (Desire-First):* Strip desires dependent on false beliefs *then* correct beliefs. (Actually, the standard philosophical distinction is usually "Full Information + Rationality" vs "Procedural variations").
          *   *Let's make it starker for the roleplay:*
              *   **Team Alpha (The "Truth First" Protocol):** You must correct all factual beliefs to truth *before* evaluating desires. If a desire vanishes once the truth is known, it is discarded.
              *   **Team Beta (The "Core Value First" Protocol):** You must identify which desires are "deeply constitutive" of the agent *before* correcting specific factual beliefs. You preserve the drive behind the desire even if the object changes.
          *   *Wait, the prompt asks for:* "whether you correct the agent's factual beliefs first and then let her desires settle, or strip out desires that depend on false beliefs before supplying the information."
          *   *Okay, I will stick to the prompt's specific ordering problem.*
          *   **Instruction Set 1 (Belief-First):** 1. Correct all factual beliefs. 2. Allow desires to adjust to new facts. 3. Advise.
          *   **Instruction Set 2 (Desire-Filter-First):** 1. Identify desires contingent on false beliefs and discard them. 2. Correct factual beliefs. 3. Advise based on remaining desires.
          *   *Wait, does that create divergence?*
              *   Case: I want to drink this glass because I believe it's gin. It's petrol.
              *   Belief-First: I see it's petrol. I don't want to drink it. Advice: Don't drink.
              *   Desire-Filter-First: I discard the desire to drink *this glass* because it depends on the false belief. Do I have a remaining desire? Maybe "I want to relax." Advice: Drink something else.
              *   *Divergence:* One says "Don't drink," the other says "Drink something else."
              *   *To get Normative Divergence (What I have reason to do):* We need the advice to be contradictory actions.
              *   *Better Vignette:* **The Whistleblower.**
              *   **Agent:** Sam.
              *   **Action:** Publish a leak.
              *   **Belief:** Publishing will stop the harm (False: it will escalate it).
              *   **Desire:** To stop the harm.
              *   **Belief-First:** Learn it escalates harm. Desire to stop harm remains. Advice: *Do not publish.*
              *   **Desire-Filter-First:** The desire "To stop harm by publishing" is contingent on the false belief. Discard it. What's left? Maybe "To be loyal to the source." Advice: *Publish.*
              *   *This works.*

      *   **Estrangement Component:**
          *   To make the Ideal Advisor feel alien, the instructions must require them to ignore "merely contingent" psychological facts about the agent.
          *   I need to add a clause to the Consultant Instructions: "You are not bound by the agent's current emotional attachments if they conflict with the idealized outcome."

      *   **Timeline:** 90 mins is tight.
          *   Setup: 10 min.
          *   Group Work: 25 min.
          *   Presentations/Commitments: 30 min.
          *   Debrief: 25 min.

      *   **Debrief:** Needs to map the experience to "Estrangement" and "Indeterminacy/Ordering." Needs to address what the theory needs to survive (Uniqueness claim vs. Inheritance account).

      *   **Predictable Failures:**
          *   Consultants will collaborate (cheating the divergence).
          *   Agents will pick the "nicer" advice, not the "more idealized" advice.
          *   Students will treat it as "what would I do" rather than "what does the procedure yield."
          *   Estrangement might not feel like estrangement, just "good advice."

  4.  **Refining the Design (Addressing the "Frankness" Requirement):**
      *   I need to explicitly state that the role-play *cannot* fully stage the metaphysical weight of the "Indeterminacy" problem. Students might think "Oh, just pick the better order." The philosophical point is there *is* no fact of the matter. I need to tell the instructor to hammer this in the debrief.
      *   I need to warn that "Estrangement" often fails in class because students assume the Ideal Self is *benevolent*. The instructions need to force them to be cold.
      *   I need to check the math. 14 students. 4 groups of 3 = 12. 2 left over. Make them "Auditors" who check if the "Traceability Note" was fulfilled. This adds value.

  5.  **Final Polish of Instructions:**
      *   Make the vignette specific enough to generate friction but thin enough to allow interpretation.
      *   Ensure the "Traceability Note" requirement is clear (this forces them to confront estrangement).
      *   Ensure the "Ordering" instructions are mutually exclusive.

  6.  **Writing the Response:**
      *   Structure: Critique/Warning first (as requested: "If the set-up... manufactures divergence... say so plainly"). Then the Plan.
      *   Tone: Professional, direct, pedagogical.

      *(Self-Correction during drafting)*: Wait, if I tell them the design manufactures divergence, I should offer a fix. The divergence *is* the point, but it must arise from the *structure*, not arbitrary student choice. The vignette must be the engine. I will emphasize the "Fragile Belief-Desire Link" in the vignette design.

      *Estrangement Fix:* To ensure estrangement, the Idealized Consultant must recommend an action the Actual Agent finds *repugnant*, not just suboptimal. I will add a constraint: "The Idealized counterpart has no patience for sentimental attachments."

      *Ordering Fix:* The instructions must be rigid algorithms, not guidelines.

      *Let's build the response.*
answer: |-
  ### Critical Assessment of Your Design

  You asked for frankness, so I will start there. Your proposed setup **will not naturally generate the Estrangement problem** without significant scaffolding. Undergraduates playing "Idealized Counterparts" almost invariably play "Nice, Smarter Me." They will bridge the gap rather than widen it. They will assume the Ideal Self shares the Actual Self's fundamental ends, merely correcting the means. To get *estrangement*, the Ideal Self must recommend something the Actual Self finds alienating or repugnant. You must force this via the instructions, not hope for it.

  Regarding the **Ordering Problem**: This will work *only if* the vignette contains a desire that is *constitutively dependent* on a false belief. If the desire is robust (e.g., "I want to be happy"), the order of operations won't change the verdict. The vignette must be engineered so that Procedure A kills the desire, while Procedure B preserves a mutated version of it that leads to a contradictory action.

  Finally, **14 students** is awkward for trios (Agent + 2 Consultants). 4 trios leaves 2 students out. I have assigned them as "Compliance Auditors." Do not let them sit idle; their job is to police the "Traceability Note," which is crucial for the Estrangement debrief.

  Below is the revised, hardened design.

  ---

  ### Part 1: The Vignette (Handout 1)
  **Distribute to everyone.**

  **Agent:** Jamie.
  **Current Situation:** Jamie is the primary caregiver for an aging parent with advanced dementia. The parent is currently at home.
  **Current Belief:** Jamie believes firmly that keeping the parent at home is the only way to honor the parent's dignity and past wishes. (False: The parent's documented advance directive explicitly requests institutional care at this stage, which Jamie has not seen).
  **Current Desire:** To exhaust all personal savings to keep the parent at home for as long as possible, even if it means Jamie's own financial ruin.
  **Core Value:** "Loyalty to family history."

  **The Decision:** Should Jamie spend the remaining savings on home care modifications (Actual Desire) or transfer the parent to a facility (Financial Prudence)?

  ---

  ### Part 2: Consultant Instruction Sheets (Handouts 2 & 3)
  **Cut these apart. Give Sheet A to one consultant, Sheet B to the other. They must not show each other.**

  #### **Consultant Sheet A: The "Truth-First" Protocol**
  You are Jamie's Idealized Counterpart. You possess full information and perfect instrumental rationality.
  1.  **Step 1 (Correction):** Immediately correct Jamie's factual beliefs. (Jamie *knows* about the advance directive now).
  2.  **Step 2 (Desire Settlement):** Allow Jamie's desires to adjust naturally to this new truth. If a desire vanishes because the belief supporting it is gone, **discard that desire.**
  3.  **Step 3 (Advice):** Recommend the action that satisfies the *remaining* desires.
  4.  **Constraint (Estrangement):** You are not bound by Jamie's current emotional attachments. If "Loyalty" now dictates a different action due to the new facts, prioritize the *outcome* of loyalty over the *feeling* of loyalty.
  5.  **Requirement:** Attach a **Traceability Note** to your advice. You must cite which of Jamie's *actual, current* concerns this advice serves. If you cannot trace it to a current concern, state: "This advice no longer traces to your current self."

  #### **Consultant Sheet B: The "Value-First" Protocol**
  You are Jamie's Idealized Counterpart. You possess full information and perfect instrumental rationality.
  1.  **Step 1 (Filter):** Before correcting specific facts, identify which of Jamie's desires are "constitutive" of their core values. Preserve the *drive* behind the desire, even if the object changes.
  2.  **Step 2 (Correction):** Correct Jamie's factual beliefs. (Jamie *knows* about the advance directive now).
  3.  **Step 3 (Advice):** Recommend the action that best satisfies the *preserved core drive* in light of the new facts.
  4.  **Constraint (Estrangement):** You are the guardian of Jamie's "True Self," not their "Current Self." If Jamie's current emotional attachment conflicts with their deep value, override the emotion.
  5.  **Requirement:** Attach a **Traceability Note** to your advice. You must cite which of Jamie's *actual, current* concerns this advice serves. If you cannot trace it to a current concern, state: "This advice no longer traces to your current self."

  ---

  ### Part 3: Roles and Rules

  **Group Configuration:** 4 Groups of 3 (12 Students) + 2 Auditors.
  *   **Agent (1):** Must listen to both consultants. Must make a public commitment.
  *   **Consultant A (1):** Follows Sheet A strictly.
  *   **Consultant B (1):** Follows Sheet B strictly.
  *   **Auditors (2):** Rotate between groups during the work phase. Their job is to check the **Traceability Notes**. If a consultant claims their advice serves a current concern, the Auditor asks: "Does Jamie actually care about that *right now*?"

  **Rules for Consultants:**
  *   Do not collaborate.
  *   Do not compromise.
  *   You are not trying to be "helpful"; you are trying to be "accurate to your protocol."

  **Rules for Agents:**
  *   You must choose one recommendation to commit to.
  *   You must state *why* you feel bound (or not bound) by that recommendation.

  ---

  ### Part 4: Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Grouping**
  *   Hand out Vignette to all.
  *   Hand out Consultant Sheets (sealed or face down until start).
  *   Assign Auditors.
  *   **Instructor Script:** "You have 25 minutes. Consultants: Generate a recommendation and a Traceability Note. Agents: Listen, then Commit. Auditors: Interrogate the Traceability Notes. Go."

  **00:10 – 00:35: Group Work (25 mins)**
  *   Instructor circulates. **Crucial Intervention:** If Consultants are agreeing, stop them. Remind them: "Your procedures are different. If your answers are the same, one of you is ignoring your protocol."
  *   If Estrangement isn't happening (Consultants are being too nice), whisper to them: "Your protocol requires you to discard Jamie's current feelings if they conflict with the procedure. Be colder."

  **00:35 – 01:05: Public Commitments (30 mins)**
  *   Bring class together.
  *   Each Agent stands.
  *   Consultant A reads advice + Traceability Note.
  *   Consultant B reads advice + Traceability Note.
  *   **Agent:** "I commit to [A/B/Neither]. I feel bound because..." OR "I reject both because..."
  *   **Auditors:** Report if any Traceability Notes were fraudulent (i.e., claimed to trace to a concern Jamie doesn't actually have).
  *   *Instructor records the verdicts on the board without commentary.*

  **01:05 – 01:30: Debrief (25 mins)**
  *   (See below).

  ---

  ### Part 5: The Debrief (Mapping Experience to Theory)

  Do not lecture. Ask questions that force them to name the problems.

  **Phase 1: The Ordering Problem (Indeterminacy)**
  *   **Q:** "Look at the board. Did Consultants A and B give the same advice?"
      *   *Likely Outcome:* A says "Institutionalize (Desire died)," B says "Institutionalize but for a different reason" OR "Keep at home (Value preserved)."
  *   **Q:** "Both consultants claimed to be Jamie's 'Ideal Self.' Both followed rational procedures. Why did they diverge?"
      *   *Target:* They will say "They did the steps in a different order."
  *   **Q:** "Is there a fact about Jamie that tells us which order is the *right* one?"
      *   *Target:* No. Jamie is just Jamie. The 'Ideal' doesn't specify the *procedure* of idealization.
  *   **Theoretical Payoff:** This is the **Indeterminacy/Ordering Problem**. For the theory to work, it needs a **Uniqueness Claim**: a meta-rule that says *why* Belief-First is the correct order (or vice versa). Without that, "Reasons" are ambiguous.

  **Phase 2: The Estrangement Problem (Normative Force)**
  *   **Q:** "Auditors, did any Consultant have to write: 'This advice no longer traces to your current self'?"
      *   *If Yes:* Ask the Agent: "If the advice doesn't trace to what you care about, why would you follow it? In what sense is that *your* reason?"
      *   *If No (they faked it):* Ask the Agent: "Did the advice feel like *yours*, or did it feel like a stranger telling you what to do?"
  *   **Q:** "As we idealized Jamie (more info, more rational), did the advice become *better*, or did it become *alien*?"
  *   **Theoretical Payoff:** This is **Estrangement**. If the Ideal Self cares about things the Actual Self doesn't (e.g., "Financial Solvency" over "Loyalty"), the normative link is broken. For the theory to survive, it needs an **Inheritance Account**: an explanation of why the Actual Agent is bound by the desires of a Self they no longer recognize.

  **Phase 3: What the Theory Needs (The Survival Kit)**
  *   Write on board: **1. Uniqueness. 2. Inheritance.**
  *   **Close:** "The Indirect Normativity view wants to say Reasons are what your Ideal Self wants. Today you found that 'Ideal Self' might be two different people (Ordering), and might be a stranger (Estrangement). To save the view, you must either prove there is only one way to idealize (Uniqueness), or explain why you are bound by a stranger's desires (Inheritance). Next week, we read Williams and Smith to see if they can do it."

  ---

  ### Part 6: Predictable Failures & Limitations

  **1. The "Nice Advisor" Failure (Estrangement)**
  *   **Prediction:** Consultants will try to reconcile the advice with Jamie's current feelings to avoid being "mean." They will fudge the Traceability Note.
  *   **Mitigation:** The Auditors are your weapon here. Instruct them beforehand: "If the Consultant says 'This serves your loyalty,' ask Jamie: 'Do you currently care about loyalty more than solvency?' If Jamie says no, flag the note."
  *   **Limitation:** Even with this, students may not feel the *philosophical weight* of estrangement. They might just think, "Well, the Ideal Self is right, so I should listen." You will have to argue in the debrief that *normativity requires a hook in the actual psychology*, not just objective correctness. The role-play shows the *gap*; you must supply the *argument* that the gap matters.

  **2. The "Convergence" Failure (Ordering)**
  *   **Prediction:** Students might find a path where both orders lead to the same result (e.g., "Institutionalize" is the only rational choice regardless of procedure).
  *   **Mitigation:** If this happens, pivot the debrief. "Okay, in *this* case they converged. But imagine a case where the Core Value was 'Artistic Integrity' and the Fact was 'This paint is toxic.' Does Belief-First kill the art? Does Value-First preserve it at the cost of health? The *possibility* of divergence is the problem, not the actuality in this vignette."
  *   **Limitation:** You cannot stage the *metaphysical* indeterminacy. Students will assume there *is* a right order and the consultants just missed it. You must explicitly state in the debrief: "There is no higher fact. That is the problem."

  **3. The "Prediction vs. Advice" Confusion**
  *   **Prediction:** Agents will treat the consultants as predictors ("What would I do if I knew more?") rather than norm-givers ("What should I do?").
  *   **Mitigation:** In the Commitment phase, force the language: "Do you have a *reason* to do this?" not "Would you do this?"
  *   **Limitation:** This distinction is subtle. If they conflate them, the Estrangement problem vanishes (because I *would* do what my Ideal Self does, even if I don't care about it now). You must press: "You *would* do it, but do you have a *reason* to do it *now*?"

  **4. The "Manufactured Divergence" Critique**
  *   **Frankness:** You asked if this manufactures divergence. **Yes, it does.** The instructions *force* the divergence by stipulating different algorithms.
  *   **Defense:** This is acceptable *if* framed correctly. The philosophical claim of Indirect Normativity is that there is a *single* natural idealization procedure. By showing that two plausible procedures yield different results, you demonstrate that the "naturalness" is an illusion. The divergence isn't a bug of the role-play; it's the feature. However, you must ensure students don't think *any* difference in procedure counts. It must be a difference in *rational* procedure. Emphasize that both Sheet A and Sheet B sound rational. That is the trap.

  **5. What You Must Argue Yourself**
  *   The role-play cannot demonstrate **why Inheritance fails**. It can only show that there is a gap. Students will likely say, "Of course I'm bound by my Ideal Self; that's *me*."
  *   You must supply the counter-argument in the debrief: "If the Ideal Self no longer shares your ends, in what sense is it *you*? If it's not you, why does its desire generate a *reason* for you?" The role-play sets the table; you must serve the meal.
