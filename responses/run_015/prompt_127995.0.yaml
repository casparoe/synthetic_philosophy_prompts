answer: |-
  ### Translation Protocol: Migration as Common-Pool Resource Governance

  **Framework Definition:**
  *   **Territory:** A spatially bounded common-pool resource (CPR) system containing public goods (infrastructure, legal order) and finite natural capital.
  *   **Citizens/Residents:** Authorized appropriators with defined access rights.
  *   **Migrants:** External agents seeking to alter their status from non-appropriators to authorized appropriators.
  *   **Border Control:** An exclusion mechanism regulating access to the CPR.
  *   **Sovereignty:** The meta-governance capacity to enforce exclusion and define collective-choice rules without external interference.

  ---

  ### Position 1: The Exclusionist (Territorial Boundaries as Property)

  **Philosophical Claim:** The state owns its territory (or holds stewardship akin to private property) and possesses a discretionary right to exclude outsiders, similar to a homeowner excluding trespassers.

  **CPR Translation:**
  The state functions as the manager of a defined CPR regime. To prevent the resource system from slipping into an "open access" state (where subtractability leads to depletion or congestion), the regime must maintain **exclusion mechanisms**. These mechanisms define the boundary of the "authorized user group." Just as a fishery requires licenses to prevent overharvesting, a territory requires border controls to prevent the over-consumption of public goods (welfare, infrastructure, environmental capacity).

  *   **Translates Cleanly:**
      *   **Exclusion Costs:** The argument that maintaining borders is necessary to preserve the resource stock aligns with the economic necessity of defining clear property/access rights to avoid the tragedy of the commons.
      *   **Congestion/Subtractability:** The concern that influx degrades public services maps directly to the concept of rivalrous consumption within a CPR.

  *   **Requires Distortion:**
      *   **Ownership vs. Management:** In CPR theory, managers are rarely absolute owners; they are stewards of a resource that often predates the regime. Treating the state as a "property owner" distorts the CPR model, which views resources as shared systems requiring negotiated rules, not alienable assets.
      *   **Alienability:** Private property can be sold; territory generally cannot. The "property" analogy breaks when applied to the inalienable nature of jurisdiction.

  *   **Lacks Counterpart:**
      *   **Legitimacy of Initial Enclosure:** CPR governance assumes the boundary is already drawn and accepted. It has no vocabulary to evaluate the historical morality of how the boundary was established (e.g., conquest vs. treaty). The economic model treats the current allocation as the baseline; it cannot assess the justice of the initial enclosure.

  ### Position 2: The Communitarian (Self-Determination & Associative Obligations)

  **Philosophical Claim:** Citizens share special obligations arising from shared culture, history, and political projects. Open borders undermine the capacity for national self-determination and dilute the associative ties that sustain welfare states.

  **CPR Translation:**
  A CPR regime relies on **collective-choice rules** to determine how operational rules are modified. These rules function most efficiently when the user group shares high levels of social capital and trust, which lower monitoring and enforcement costs. Rapid turnover in the user group (high migration) increases transaction costs for rule-making and threatens the stability of the institutional design. "Self-determination" translates to the autonomy of the user group to set their own extraction and investment rules without external imposition.

  *   **Translates Cleanly:**
      *   **Transaction Costs:** The argument that cultural homogeneity aids cooperation maps cleanly to the economic observation that heterogeneous groups face higher costs in reaching consensus on collective-choice rules.
      *   **Institutional Stability:** The fear that rapid demographic change disrupts governance aligns with the risk of institutional collapse when user characteristics shift faster than rules can adapt.

  *   **Requires Distortion:**
      *   **Culture as Resource:** This translation treats culture and trust as a finite stock that can be "depleted" by newcomers (subtractability). This distorts the nature of culture, which can be non-rivalrous or generative, forcing a functionalist reduction of normative bonds into "social capital."
      *   **Intrinsic vs. Instrumental:** The philosophical claim values the association *in itself*. The CPR translation values the association only *instrumentally*, for its ability to lower enforcement costs.

  *   **Lacks Counterpart:**
      *   **The Value of the "We":** CPR theory explains *how* a group governs, not *why* that specific group's continuity matters morally. There is no variable for the intrinsic value of a specific political community's survival. The framework is agnostic to whether the community persists, provided the resource is managed efficiently.

  ### Position 3: The Open-Borders Advocate (Distributive Justice)

  **Philosophical Claim:** Birthplace is morally arbitrary. Restricting movement enforces a global caste system, perpetuating vast inequalities in opportunity. Justice requires equalizing access to resources regardless of jurisdiction.

  **CPR Translation:**
  Current border regimes function as artificial barriers to factor mobility (labor), creating rent-seeking opportunities for authorized appropriators (citizens) and preventing the equalization of marginal returns on labor globally. Exclusion mechanisms create artificial scarcity, inflating the value of access rights for insiders while locking outsiders out of higher-yield resource systems. Distributive justice translates to **allocative efficiency** and **equity in resource access** across multiple CPR regimes.

  *   **Translates Cleanly:**
      *   **Rent-Seeking:** The argument that citizenship premiums are economically inefficient rents maps perfectly to the analysis of monopoly privileges in resource access.
      *   **Global Efficiency:** Removing exclusion barriers increases total global yield by allowing labor to move to where capital/resources are under-utilized.

  *   **Requires Distortion:**
      *   **Humans as Inputs:** To fit the model, migrants must be treated as units of labor/capital rather than moral agents. This distorts the humanitarian core of the justice claim into a calculation of factor productivity.
      *   **Obligation vs. Efficiency:** The philosophical claim is deontological (a duty to open); the CPR translation is consequentialist (opening increases yield).

  *   **Lacks Counterpart:**
      *   **The Claim of the Outsider:** CPR governance focuses on the management of *existing* user groups. It lacks a mechanism for an *external* agent to claim a right to entry based on need. In CPR terms, an outsider has no standing until they are admitted. The framework cannot process a claim from outside the boundary.

  ---

  ### Residue Report: The Untranslatable Core

  The exercise reveals a structural limit in common-pool resource governance when applied to the migration debate. The untranslatable material is not merely noise; it identifies the boundary conditions of the economic framework itself.

  **1. The Exogeneity of the Boundary**
  CPR governance treats the boundary of the resource system and the definition of the "user group" as exogenous variables—inputs that exist before the analysis begins. The political philosophy debate, however, is *about* the endogeneity of that boundary.
  *   **The Distinction:** The "moral distinction" is real. CPR economics can optimize a regime *given* a membership list. It cannot generate the membership list *morally*.
  *   **The Implication:** When exclusionists argue for a "right to exclude," they are asserting a meta-rule about who gets to participate in the collective-choice arena. When open-borders advocates argue for "justice," they are challenging the legitimacy of the existing collective-choice arena. The economic framework dissolves this conflict only by ignoring it (treating the border as fixed).

  **2. Moral Equality vs. Defined Appropriators**
  The philosophical concept of "moral equality" posits that all humans have equal standing prior to institutional assignment. The CPR framework posits that standing is derived *from* institutional assignment (i.e., you are an appropriator because the rules say you are).
  *   **Does it dissolve?** No. The philosophical argument does not dissolve; it exposes the CPR framework as a *closed system*. The framework presupposes a "club" to function. Therefore, arguments about moral equality are not governance problems; they are *constitutive* problems. They ask, "Who constitutes the 'We' that governs the commons?" Economics cannot answer this without smuggling in a political assumption.

  **3. Sovereignty as Meta-Governance**
  In CPR theory, rules are enforced by a higher authority or through reciprocal monitoring. In the global migration context, there is no meta-enforcer.
  *   **The Residue:** The "state's right to exclude" is, in CPR terms, simply the capacity to enforce an exclusion mechanism. However, the philosophical defense of this right relies on the normative value of *autonomy*. The economic translation reduces autonomy to "local rule-making efficiency." The residue here is the value of **political agency**. The untranslatable material shows that states are not just resource managers; they are arenas for human agency. Reducing them to resource regimes strips out the *purpose* of the governance (self-rule) and leaves only the *mechanics* (rule-enforcement).

  **Conclusion**
  The untranslatable material is evidence of a real distinction that commons economics cannot capture. It is not that the philosophical arguments are illusory; rather, they operate at a **higher logical type** than resource governance.

  *   **Governance Questions:** How do we manage the resource given these users?
  *   **Philosophical Questions:** Who counts as a user? By what right is the resource bounded?

  Treating territorial access purely as a governance problem does not dissolve the moral claims; it reveals that the economic model is **parasitic** on a prior political resolution. The model requires a defined "commons" to function. The migration debate is a conflict over how that commons is defined. Therefore, the "residue" is the **constitutive act of enclosure itself**.

  If you treat the border purely as an exclusion mechanism, you assume the legitimacy of the enclosure. If you treat the border as a moral question, you are questioning the enclosure. The economic vocabulary fails here not because it is imprecise, but because it is designed to manage *within* walls, not to justify *building* them. The most interesting part of this exercise is the realization that **common-pool resource theory presupposes the very sovereignty that the open-borders debate contests.**
