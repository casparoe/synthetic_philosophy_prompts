  8.  (Mental Review of "Residue"): The prompt asks: "is the untranslatable material evidence of a real moral distinction... or does it show that the philosophical arguments depend on conceptual moves... that dissolve?"
      *   My verdict: It shows the philosophical arguments rely on a *prior* definition of the unit of analysis. The economic framework cannot generate the boundary; it can only manage within it. Thus, the moral distinction is real *because* the economic framework is silent on boundary formation. It doesn't dissolve the moral claim; it highlights that the moral claim is about *constituting* the regime, not *operating* it.

  9.  **Drafting the Content:** (Proceeding to generate response based on these thoughts).

      *   *Key Terminology Check:*
