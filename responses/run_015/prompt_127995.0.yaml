      *   *Refining "Self-Determination":* This maps to "rule-making autonomy."
      *   *Refining "Justice":* This maps to "inter-regime transfers" or "factor mobility."

      *   *Residue:* The "Right to Have Rights" (Arendt-esque) but translated as "Right to be included in a Collective-Choice Arena."

  10. **Final Review against constraints:** No smuggling sovereignty. No smuggling individual rights. Honest translation. Focus on the failures.

