answer: |-
  **Fellowship Proposal: Operationalising Moral Circle Expansion**

  **Research Question**
  Can the concept of 'moral circle expansion' be operationalised as a single composite indicator without inducing perverse incentives, or must it be disaggregated into the independent variables of scope, weight, and resolution? This question admits a determinate answer: either a composite measure holds under stress testing, or it fractures into a multidimensional dashboard.

  **The Gap in Current Framing**
  Existing discourse on moral progress typically asks whether the circle is expanding, and whether this drift is driven by reason, sentiment, or institutional change. While philosophically rich, this framing leaves the monitoring and evaluation practitioner untouched. It assumes 'expansion' is a unitary phenomenon, whereas in practice, metrics settle philosophical questions prematurely. Counting the number of countries a programme covers measures scope, but settles the question of weight by assuming presence equals concern. Analysing moral language in media measures conviction, but ignores institutional action. These proxies conceal trade-offs. For instance, adopting coarse universalist language may admit more beings into the circle (scope) while blurring the specific interests required to treat them well (resolution). By treating expansion as a singular vector of progress, current frameworks blind funders to the possibility that gaining ground on one axis may cost ground on another. This project isolates the measurement problem from the moral metaphysics, asking not whether progress is real, but whether our tools for detecting it distort the phenomenon they claim to capture.

  **Work Plan (Nine Months, Part-Time)**
  This project requires no research budget and no new data collection. It relies on conceptual analysis and the audit of existing indicator sets.

  *Months 1–3: Conceptual Archaeology.* I will audit existing indicator sets used by philanthropic intermediaries, mapping each metric against the three variables: scope (who is included), weight (how much they matter), and resolution (granularity of distinction). Simultaneously, I will categorise where each metric locates the circle: in stated conviction, active attention, or institutional behaviour. The output will be a matrix showing where current practice conflates these distinct dimensions.

  *Months 4–6: Trade-off Analysis.* Using the matrix, I will conduct stress tests on the indicators. I will employ thought experiments to identify where movement along one axis negates another. For example, does standardising metrics to compare across species (resolution) require stripping away the specific contextual weight that makes protection meaningful? I will analyse whether the language required to secure universal inclusion inevitably dilutes the specificity required for effective intervention. This phase determines if the variables are truly independent or if they are logically entangled.

  *Months 7–9: Synthesis and Framework Design.* Based on the trade-off analysis, I will draft a decision framework. If the variables are independent, the framework will guide funders on when to prioritise scope over resolution. If they are entangled, the framework will warn against composite scoring. I will refine this through informal consultation with colleagues in the sector to ensure practical applicability.

  **Deliverable**
  The primary output will be a 'Measurement Framework and Risk Matrix' for funders drafting funding criteria. Unlike an academic paper, this document will be operational. It will provide a checklist for evaluating proposed indicators, highlighting where a specific metric might inadvertently narrow the moral circle while claiming to expand it. It will offer specific language for grant agreements that distinguishes between broad inclusion and deep protection, allowing funders to specify which dimension of expansion they are purchasing. This ensures that reporting requirements do not force grantees to optimise for visible breadth at the expense of invisible depth.

  **Conditions of Failure**
  I will consider the project to have failed under three conditions. First, if the conceptual analysis reveals that scope, weight, and resolution are logically inseparable, rendering the disaggregation impossible; in this case, the core hypothesis collapses. Second, if the resulting framework is too abstract for practical use, requiring philosophical expertise that programme officers do not possess; a tool that cannot be applied is a failure of design. Third, if the audit shows that all existing indicators already implicitly account for these trade-offs, meaning the project solves a problem that does not exist. Success requires proving that the variables are distinct, that current measures conflate them to their detriment, and that a practical alternative exists.

  **Conclusion**
  By treating the moral circle not as a metaphor but as a measurement instrument, this fellowship seeks to prevent good intentions from being undermined by poor proxies. It moves the conversation from whether we are becoming more moral, to whether we are measuring morality correctly.
