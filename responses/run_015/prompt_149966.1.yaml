  6.  **Final Polish:** Check tone. Ensure it sounds like a referee's report (objective, analytical). Ensure the distinction between "logical possibility" and "physical realizability" is clear. (Self-Correction: Make sure not to say Devin is "wrong" about physics, just that he changed the puzzle).

  7.  **Final Output Structure:**
      *   Move-by-Move Evaluation.
