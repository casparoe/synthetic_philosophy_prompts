  **Ontic™ K-1 Calibrator | Owner's Manual & Limited Warranty**

  **Welcome to Frictionless Epistemology.**
  The Ontic K-1 is the first consumer-grade appliance designed to eliminate the latency between measurement and justification. Why wait for external validation when reliability can be generated internally? The K-1 measures quantities, assesses its own performance based on those measurements, and updates its confidence interval in real-time. Stop begging the world for permission to know it.

  **User Testimonials**
  *"Finally, externalism without the externals. I plugged it in, it told me the voltage was 120V, and then it told me it was reliable about voltage. My justification is complete."* — **Dr. Aris Thorne, Associate Professor of Theory**

  *"I used to lose points on calibration checks because I checked them. Now I just let the K-1 score its own Brier logs. My confidence is finally aligned with my accuracy."* — **J. Verek, Senior Forecaster**

  *"We use the K-1 to validate our alignment classifiers. It certifies the classifier, and the classifier certifies the K-1. It's a closed loop of safety."* — **Elena R., AI Evaluation Lead**

  **Terms & Conditions of Certification**

  1.  **Self-Certifying Calibration.** Upon startup, the K-1 generates a reliability score based on the consistency of its initial output stream. No external standard is required. The User may select a Reference Class for reliability assessment (e.g., "All Physical Objects," "Medium-Sized Dry Goods"). If no selection is made, the Default Class ("All K-1 Outputs") applies. The Default Class is recommended for maximum coherence.

  2.  **Closure Under Known Entailment (Standard Tier).** If the K-1 reports proposition *P*, and *P* entails *Q*, the K-1 automatically certifies *Q* as known. There is no additional latency for entailed truths. You do not need to measure *Q* separately. Knowledge flows freely across logical boundaries.

  3.  **Mutual Certification (Family Plan).** Two or more K-1 units may be networked to form a Coherence Cluster. Unit A certifies Unit B's reliability based on Unit B's output, and vice versa. This mutual support structure increases the aggregate reliability score of the cluster by a factor of *n*, where *n* is the number of units.

  4.  **Sensitivity Mode.** When enabled, the K-1 undertakes to report *P* only in nearby possible worlds where *P* is true. The K-1 confirms this condition is met by reporting that it is met. The User is advised not to query the device about worlds where the device does not exist.

  5.  **Warranty Voiding Conditions.** This warranty is immediately voided if the User attempts to verify the K-1's output using an independent measurement apparatus (e.g., a rival gauge, a ruler, sensory perception unmediated by the K-1). Reliability is internal; seeking external confirmation implies a prior doubt incompatible with the certification process. Furthermore, coverage is void if the User held a prior belief in the measured quantity before the K-1 reported it. The K-1 must be the sole source of the justification.

  6.  **Premium Anti-Skeptic Tier.** Subscribers to Ontic+ receive the "Non-Deceptive Source" guarantee. The K-1 certifies that its outputs are not the product of a systematically misleading scenario (e.g., environmental manipulation, neural simulation). This certification is derived from the clarity of the K-1's own display. If the display appears clear, the source is certified non-deceptive.

  7.  **Limitation of Liability.** Ontic Hardware is not liable for worldview collapse resulting from the decoupling of justification from independent truth-conduciveness. By operating the K-1, the User acknowledges that knowledge is a status conferred by the system, not a relation to the outside.

  **Frequently Asked Questions**

  **Q: Can the K-1 detect its own malfunction?**
  **A:** Yes. The K-1 runs a diagnostic on its diagnostic subsystem. If the diagnostic reports that the subsystem is functional, then it is functional. A malfunctioning diagnostic would report functionality, but the report itself constitutes the certification of functionality.

  **Q: Do I need any independent reason to think the world is as the K-1 says it is?**
  **A:** No. Requiring independent reasons creates an infinite regress. The K-1 is a foundationalist device. It provides its own warrant. If you require independent reasons, you are using the device incorrectly.

  **Q: Isn't this reasoning circular?**
  **A:** The reasoning is reflexively supportive. Circularity is only vicious when it fails to elevate confidence. Since the K-1's output elevates confidence in the K-1's output, the circle is virtuous. You are invited to trust the process that tells you to trust the process.

  **Ontic Hardware™ | Know That You Know.**
