      1.  **Minutes 0-5: Define Behavioral Profile.** Strip away training history; define the system solely by input-output mappings. *Why:* Establishes the common ground for the indistinguishability claim.
      2.  **Minutes 5-10: Construct the Counterfactual.** Show a non-understanding system (lookup/table) matching the profile. *Why:* Demonstrates logical possibility without asserting actuality.
      3.  **Minutes 10-15: The Screening-Off Move.** Argue that since both histories yield identical outputs, output alone cannot distinguish histories. *Why:* This is the core evidential point; behavior is screened off from history.
      4.  **Minutes 15-20: Limit the Scope.** Explicitly state this does not deny understanding, only behavioral proof of it. *Why:* Prevents the "it's just a parrot" collapse.
      5.  **Minutes 20-25: Human Analogy Check.** Acknowledge the "same applies to us" rebuttal but bracket it as a separate metaphysical problem. *Why:* Prevents the "question is empty" derailment.
      6.  **Minutes 25-30: Operational Takeaway.** Conclude that safety requires assuming non-understanding regardless of output quality. *Why:* Returns to engineering praxis without solving philosophy.

      Example: A model correctly triaging a complex, novel symptom combination by weighting co-occurrence statistics rather than grasping pathology. It is right because it mimics successful reasoning without the causal chain of medical knowledge; it must not be simple recall of guidelines, which invites the "memorization" dismissal.

