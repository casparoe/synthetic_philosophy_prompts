answer: |-
  ### Exam Question

  **Course:** PHIL/MATH 405: Constructivity in Logic and Mathematics
  **Time:** 90 Minutes
  **Word Limit:** 1,000 words maximum

  **Question 1: The Balanced Numbers Conjecture**

  Call a positive integer $n$ *balanced* if there exist integers $a, b$ such that $n = a^2 + b^3$, where the search for $a$ and $b$ is bounded by $n$ (i.e., $|a|, |b| \le n$). Because the search space is finite, for any specific $n$, it is effectively decidable whether $n$ is balanced.

  Let the **Balanced Numbers Conjecture (BNC)** be the claim: *There exists a threshold $N$ such that for every integer $n > N$, $n$ is balanced.*

  Assume the following stipulations regarding the current mathematical status of BNC:
  1.  BNC is open: no proof of BNC is known, and no proof of $\neg$BNC is known.
  2.  No counterexample has been found by exhaustive search up to current computational limits.
  3.  BNC has not been shown to be independent of standard arithmetic (PA or HA).

  Answer the following three parts. You must address the specific logical commitments of intuitionistic logic (IL) and Heyting Arithmetic (HA), distinguishing them from classical logic (CL).

  **(a)** A classical logician asserts "BNC $\lor \neg$BNC" is true regardless of our knowledge. An intuitionist withholds assertion. Explain precisely why the intuitionist withholds assertion without asserting $\neg$(BNC $\lor \neg$BNC). In your explanation, clarify the status of $\neg\neg$(BNC $\lor \neg$BNC) in IL.

  **(b)** Suppose a proof of "BNC $\lor \neg$BNC" were discovered within HA. What specific deliverables would this proof require under the intuitionistic interpretation of the disjunction connective? Explain why the current "open" status of BNC prevents this proof from existing, even if BNC is classically true.

  **(c)** Is the disagreement between the classical and intuitionistic logician primarily about *what mathematical objects exist* (ontology) or *what constitutes the meaning of logical connectives* (semantics/proof-conditions)? Take a definite stand. Finally, briefly address the apparent tension of using classical set theory to construct models (e.g., Kripke models) that validate intuitionistic logic.

  ***

  ### Model Answer

  **(a) The Status of Excluded Middle**
  The intuitionist does not assert $\neg(\text{BNC} \lor \neg\text{BNC})$. To assert the negation of Excluded Middle (LEM) would be to claim that there is a construction demonstrating that a proof of $\text{BNC} \lor \neg\text{BNC}$ leads to absurdity. This is not the intuitionistic position. In Intuitionistic Logic (IL), $\neg\neg(A \lor \neg A)$ is a theorem for any proposition $A$. Therefore, the intuitionist accepts that it is contradictory to claim that $\text{BNC} \lor \neg\text{BNC}$ is impossible.

  The withholding of assertion stems from the requirement that truth is equated with provability (or the existence of a verification). To assert $P \lor Q$ is to possess a method that decides which disjunct holds. To assert $\neg P$ is to possess a method that converts any proof of $P$ into a contradiction. Currently, for BNC, we possess neither a proof of the universal claim nor a counterexample (which would constitute a proof of $\neg$BNC). Thus, the condition for asserting the disjunction is unmet. The intuitionist rejects the classical separation of truth from knowability. They deny that $A \lor \neg A$ is universally valid because they deny that every problem is solvable, not because they believe some problems are unsolvable in principle (which would be $\neg(A \lor \neg A)$). The failure is one of *constructive warrant*, not logical contradiction.

  **(b) The Disjunction Property**
  Heyting Arithmetic satisfies the **Disjunction Property**: if $\vdash_{HA} P \lor Q$, then $\vdash_{HA} P$ or $\vdash_{HA} Q$. This is a structural feature of the logic, reflecting the meaning of $\lor$. A proof of a disjunction is not merely a guarantee that one side is true; it is a construction that explicitly identifies and proves one side.

  If a proof of $\text{BNC} \lor \neg\text{BNC}$ were found in HA, it would necessarily contain an algorithmic instruction to output either a proof of BNC or a proof of $\neg$BNC. Given the $\Pi_1$ nature of BNC (a universal claim over decidable predicates), a proof of $\neg$BNC requires exhibiting a specific counterexample $n$. A proof of BNC requires a general method verifying the condition for all $n > N$. Since the problem stipulates that BNC is open—meaning no such method and no such counterexample is currently known—no such proof exists in HA. Even if BNC is "classically true" (i.e., holds in the standard model of arithmetic), that ontological fact does not generate the constructive witness required by the disjunction property. The intuitionist cannot assert the disjunction because they cannot perform the selection required by the proof rules.

  **(c) Semantics, Ontology, and Modeling**
  The fundamental disagreement is semantic, not merely ontological. While it is tempting to frame this as a dispute over the existence of infinite totalities (ontology), this misdiagnoses the logical rupture. One can be an ontological realist about numbers but still reject LEM if one holds that the *meaning* of logical constants is determined by their use in inference and verification (an inferentialist or proof-theoretic semantics). If the meaning of $\lor$ is fixed by its introduction rules (requiring a witness for a disjunct), then LEM fails regardless of one's metaphysical commitment to the numbers themselves. The classical logician defines truth model-theoretically (satisfaction in a structure); the intuitionist defines it proof-theoretically (existence of a derivation).

  This creates a tension when we model IL using classical set theory (e.g., Kripke models). We use classical meta-reasoning to define nodes and forcing relations that validate intuitionistic theorems. This is not a reduction of intuitionistic meaning to classical meaning. Rather, it is a consistency proof: it shows that IL does not prove contradictions relative to classical set theory. The model captures the *growth of information* inherent in constructive proof, but the model itself is a classical object. We must distinguish the object language (where constructivity holds) from the meta-language (which may be classical). To confuse the two is to assume that because we can classically describe a constructive process, the process itself is classical. The validity of the model does not validate LEM in the object language; it validates the coherence of withholding LEM.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. The Double Negation Distinction (4 points)**
  *   **Full Credit:** Explicitly states that intuitionists assert $\neg\neg(\text{BNC} \lor \neg\text{BNC})$ but withhold $\text{BNC} \lor \neg\text{BNC}$. Clarifies that rejecting LEM is not asserting its negation.
  *   **Common Error:** Writing "Intuitionists deny LEM" without qualification, or claiming intuitionists assert $\neg(\text{BNC} \lor \neg\text{BNC})$.
  *   **Note:** Vague references to "belief" lose 2 points.

  **2. The Disjunction Property (4 points)**
  *   **Full Credit:** Identifies that a proof of $P \lor Q$ in HA requires a proof of $P$ *or* a proof of $Q$ (constructive selection). Links this to the "open" status (no witness available).
  *   **Common Error:** Treating the disjunction as a claim about "truth in the world" rather than provability in the system.
  *   **Note:** Mentioning BHK without applying it to the specific BNC case loses 2 points.

  **3. Epistemic Status of BNC (4 points)**
  *   **Full Credit:** Correctly identifies that $\neg$BNC requires a counterexample (existential witness) and BNC requires a uniform method. Notes that lacking both blocks the disjunction.
  *   **Common Error:** Confusing $\neg$BNC with "BNC is unprovable."
  *   **Note:** Students who claim BNC is decidable because the search is bounded (ignoring the universal quantifier) lose all 4 points.

  **4. Semantics vs. Ontology Stand (4 points)**
  *   **Full Credit:** Takes a definite stand (preferably semantic/proof-theoretic). Argues that connective meaning drives the logic, not just metaphysical preference.
  *   **Common Error:** "Sitting on the fence" (e.g., "Some say ontology, some say semantics, both are valid").
  *   **Note:** Name-dropping (Dummett/Brouwer) without argument counts as fence-sitting.

  **5. Classical Modeling Tension (4 points)**
  *   **Full Credit:** Acknowledges the tension (classical meta-theory vs. constructive object-theory) and resolves it as a consistency result, not a meaning reduction.
  *   **Common Error:** Claiming Kripke models "prove" intuitionism is correct, or that they make it classical.
  *   **Note:** Failure to mention the meta/object distinction loses 2 points.

  **Penalty for Name-Dropping:**
  If a student lists "BHK," "Brouwer," "Kripke," or "Dummett" without explaining the *mechanism* (e.g., how the disjunction property functions), cap the total score at **10/20**. This prevents memorization from masking understanding.

  **Differentiator (A vs. B):**
  *   **B Grade:** Correctly answers (a) and (b) using standard definitions.
  *   **A Grade:** In part (c), explicitly argues that ontological realism is compatible with intuitionistic logic if semantics are proof-theoretic, showing a grasp that the logic constrains *assertibility*, not necessarily *being*.

  ***

  ### Covering Note to Instructor

  **Settled Formal Facts vs. Contested Interpretations**

  1.  **Settled:** It is a formal theorem of Intuitionistic Propositional Logic (IPC) that $\vdash \neg\neg(A \lor \neg A)$. It is also settled that IPC + $\{\neg\neg p \to p \mid p \text{ atomic}\}$ collapses to Classical Propositional Logic. The Disjunction Property holds for HA (Heyting Arithmetic). These are not up for debate in the grading.
  2.  **Contested:** The philosophical justification. While Dummett's manifestation argument is standard, realists (e.g., Prawitz in later work, or certain Platonists) argue one can accept intuitionistic logic without adopting full-blown anti-realism. Additionally, the status of **Markov's Principle (MP)** is divisive. Russian constructivists accept MP; Brouwerians reject it.

  **Evaluation of Your Hunches**

  *   **Hunch 1 (LEM vs. $\neg$LEM): RIGHT.** This is the most critical distinction. Students often write "Intuitionists believe LEM is false." They must understand it is *unproven*, not *refuted*. The marking scheme penalizes the "false" phrasing heavily.
  *   **Hunch 2 (Disjunction Property): RIGHT.** This is the operational engine of constructivity. If they understand this, they understand why the open problem matters. This is the core of Part (b).
  *   **Hunch 3 (Markov's Principle): MINORITY/CONTESTED.** Be careful here. BNC is $\Pi_1$ ($\forall n P(n)$). $\neg$BNC is $\Sigma_1$ ($\exists n \neg P(n)$). MP allows inferring $\exists x Q(x)$ from $\neg\neg \exists x Q(x)$ for decidable $Q$. So MP would allow inferring $\neg$BNC from $\neg\neg\neg$BNC. However, MP is not part of standard HA and is rejected by many intuitionists. **Do not make this a requirement for full marks.** It is a valid "flourish" for the top 5% to note that MP would alter the landscape for $\neg$BNC, but treating it as standard would be controversial. I have excluded it from the core marking scheme to avoid penalizing students who follow the standard HA curriculum.
  *   **Hunch 4 (Atoms Collapse): RIGHT.** It is a known result that adding stability ($\neg\neg p \to p$) for atomic formulas to IPC yields CPC. This is a robust formal fact. However, it is technically dense for a 90-minute exam question focused on BNC. I have omitted it from the *question* to save cognitive load for the semantics/ontology crux, but you can use it in tutorials to reinforce why the connectives, not the atoms, are the battleground.

  **Recommendation:** The question is safe. It tests the settled formal properties (Double Negation, Disjunction Property) while forcing a philosophical stance on the contested interpretation (Semantics vs. Ontology) without requiring them to resolve the controversy, only to take a position. The Markov hunch is the only one to keep in your back pocket for office hours, not the exam.
