answer: |-
  The concept of path dependence has become a ubiquitous heuristic across the historical sciences, yet its migration from evolutionary biology to the philosophy of technology often obscures more than it illuminates. In preparing material for an advanced seminar on historical ontology, it is imperative to dissect the analogical reasoning that frequently equates evolutionary contingency with technological lock-in. While both domains acknowledge that history matters—that the present state of a system is not merely a function of current selective pressures or market efficiencies but is constituted by its past trajectory—the ontological status of that history differs profoundly. To treat them as identical is to risk a category error regarding the nature of causation, agency, and reversibility.

  To render this comparison precise, we must first operationalise the distinction between weak and strong path dependence. **Weak path dependence** describes a system wherein initial conditions influence the rate or specific route of development, but the system ultimately converges upon functionally similar attractors regardless of historical perturbations. This implies a landscape where functional constraints dominate historical accidents. **Strong path dependence**, conversely, posits that small, early perturbations generate permanently divergent equilibria. In this regime, history is not merely a influence but a constitutive constraint; alternative trajectories are foreclosed, and the system cannot return to a prior state or converge on an alternative optimum without catastrophic disruption.

  ### Evolutionary Contingency: The Tension Between Convergence and Constraint

  In evolutionary biology, the debate over path dependence is crystallised in the disagreement between Stephen Jay Gould and Simon Conway Morris. Gould's famous thought experiment—replaying the 'tape of life'—argues for a form of strong path dependence. He posits that the specific morphological outcomes of evolution are the result of stochastic branching events (mutations, drift, mass extinctions) that are utterly contingent. If one were to rewind the tape, the probability of *Homo sapiens*, or even vertebrates, re-emerging is negligible. Here, history is ontologically constitutive; a species is defined by its lineage. The 'lock-in' is biological extinction; once a lineage is pruned, it cannot be regrown. The mechanism is blind variation filtered by natural selection, devoid of foresight.

  Conversely, Conway Morris argues for weak path dependence through the lens of convergent evolution. He suggests that the 'design space' of viable biological forms is limited by physical and chemical laws. Consequently, distinct lineages often arrive at functionally identical solutions (e.g., the camera eye evolving independently in cephalopods and vertebrates). In this view, functional attractors are so strong that they override historical contingency. While the specific genetic pathway might differ, the morphological outcome is predictable.

  However, even if one accepts convergence, evolutionary path dependence retains a 'strong' character regarding the *means* of achievement. A vertebrate eye and a cephalopod eye are functionally similar but historically distinct; one cannot be transformed into the other without traversing the specific phylogenetic history that created it. Thus, evolutionary contingency is best understood as **strong regarding lineage and constitution**, but potentially **weak regarding functional utility**. The system is irreversible because the mechanism of change (mutation/selection) operates on existing structures; it cannot scrap the blueprint and start anew.

  ### Technological Lock-in: Agency and the Illusion of Irreversibility

  In the philosophy of technology, path dependence is typically invoked to explain the persistence of suboptimal standards, such as the QWERTY keyboard or the 1435 mm railway gauge. The argument here is that early adoption, driven by minor historical accidents, creates increasing returns to scale. Network externalities, sunk costs, and institutional inertia create a 'lock-in' effect, preventing the adoption of superior alternatives. Superficially, this mirrors Gould's strong path dependence: a small early event determines the long-term equilibrium, and the system becomes trapped in a local optimum.

  Yet, the causal mechanisms underpinning technological lock-in are distinct from biological contingency. Evolutionary branching is stochastic and blind; technological branching is teleological and agential. Technologies are designed with intent. When a standard becomes locked in, it is not due to a lack of variation, but often due to social coordination problems, economic incentives, or political power.

  This introduces a critical divergence in the weak/strong distinction. Technological path dependence often *appears* strong because the cost of switching is prohibitive. However, unlike biological extinction, technological lock-in is **principally reversible**. We possess the capacity for intentional re-engineering. A railway gauge can be changed (as happened in Australia and Russia, albeit at great expense); a software protocol can be updated; a keyboard layout can be mandated by a state actor. The 'lock' is not ontological but socio-economic. Therefore, technological path dependence is arguably a form of **weak path dependence masquerading as strong**. The attractors are not fixed by the laws of physics or genetics, but by human agreement and infrastructure investment, both of which are mutable.

  ### Causal Mechanisms: Stochasticity vs. Intentionality

  The crux of the philosophical distinction lies in the mechanism of transmission. In biology, history is transmitted via genetic inheritance, which is conservative and resistant to large-scale saltation. The past constrains the future because the organism *is* its history. In technology, history is transmitted via cultural learning, blueprints, and infrastructure. While infrastructure creates a material inertia similar to a biological *Bauplan*, it lacks the reproductive fidelity of DNA.

  Consider the role of network externalities. In biology, an organism's fitness is largely intrinsic (though niche construction complicates this). In technology, a tool's value is often extrinsic, dependent on how many others use it. This creates a positive feedback loop that mimics natural selection but is driven by rational (or bounded rational) choice. When a user adopts QWERTY, they do so not because they are blindly selected, but because they anticipate the behaviour of others. This introduces a layer of reflexivity absent in evolution. The 'contingency' in technology is thus social contingency, not stochastic contingency.

  Furthermore, the argument that technological history is locked in relies on a specific conception of time and cost. In evolutionary biology, the irreversibility is absolute (Dollo's Law of irreversibility). In technology, irreversibility is relative to the available energy and capital. We can reverse technological path dependence if we are willing to pay the transition costs. Thus, while evolutionary contingency relies on the impossibility of retracing mutational steps, technological contingency relies on the *unwillingness* to incur switching costs.

  ### Historical Ontology and the Nature of the Object

  For the purposes of historical ontology, this distinction is vital. It concerns how the 'being' of an object is defined by its genesis.
  *   **Biological entities** are historical individuals. Their identity is tied to their specific spatiotemporal origin. A tiger is a tiger because of its specific phylogenetic history. If you engineered a genetically identical organism in a lab without that lineage, its ontological status as a 'tiger' would be philosophically debatable. Here, strong path dependence is constitutive of the object's identity.
  *   **Technological entities** are functional kinds. A hammer is a hammer because of what it does, not necessarily because of who made it or when. While specific artefacts have histories, the *type* 'hammer' is defined by function. Consequently, technological path dependence attaches to the *standard* or the *system*, not necessarily the ontological essence of the tool itself. We can replace a locked-in technology with a functionally equivalent one that has a different history (e.g., replacing copper wires with fibre optics). The function persists while the historical substrate is swapped.

  This suggests that technological lock-in is a property of systems and networks, whereas evolutionary contingency is a property of lineages and organisms.

  ### Conclusion: Divergent Modalities of Constraint

  To return to your central inquiry: does the argument that technological history is locked in rely on the same kind of contingency that evolutionary biologists discuss? The answer is negative. While the mathematical models of increasing returns used in economics may resemble the models of adaptive landscapes in biology, the underlying metaphysics differ.

  Evolutionary contingency is rooted in the **stochastic branching of blind variation**, where strong path dependence arises from the impossibility of erasing genetic history. It is a constraint imposed by nature upon itself. Technological path dependence is rooted in **network externalities and institutional inertia**, where the appearance of strong path dependence arises from the coordination costs of human agency. It is a constraint imposed by society upon its own artefacts.

  Therefore, in your seminar, it would be rigorous to classify evolutionary contingency as **strong path dependence regarding lineage** (the tape cannot be replayed to the same result) but potentially **weak regarding function** (convergence occurs). Conversely, technological lock-in should be classified as **strong path dependence regarding infrastructure** (high switching costs) but **weak regarding ontology** (systems can be deliberately re-engineered).

  Conflating these two obscures the unique power of human intentionality. In biology, the past is a prison from which there is no escape except through extinction. In technology, the past is a legacy system that can, in principle, be rewritten. Recognising this distinction prevents the naturalisation of social choices; it reminds us that while our technological standards may feel as inevitable as the vertebrate spine, they remain subject to the vicissitudes of human will and political economy in a way that the history of life is not.
