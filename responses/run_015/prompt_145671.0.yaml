answer: |-
  You have identified a genuine and subtle phenomenon in moral psychology and ethics, and while there is no single standardized term that captures every aspect of what you are describing, it is a recognized cluster of problems discussed under the headings of moral motivation, virtue ethics, and signaling theory. Your friend was close to the mark with the reference to one thought too many, which comes from the philosopher Bernard Williams. He used that phrase to describe situations where stopping to calculate the moral rightness of an action undermines the value of the action itself, particularly in personal relationships. If a husband saves his wife from drowning but pauses to consider whether he is morally permitted to prioritize her over a stranger, Williams argues he has had one thought too many, because the immediate impulse to save her is what constitutes the relationship. However, your observation extends beyond personal relationships into community cooperation, and it adds a crucial layer about the visibility of that deliberation and how it affects judgment when the act is declined.

  The specific dynamic you are seeing where deliberation reduces credit for helping and increases blame for not helping is best understood through the lens of virtue ethics combined with modern signaling theory. In virtue ethics, derived largely from Aristotle, a truly virtuous person does not struggle to do the right thing; they do it because it is their nature. Their character is aligned such that helping is pleasant and natural. When someone helps immediately without apparent thought, observers infer that their character is naturally altruistic. When someone deliberates and then helps, observers infer that the person had to overcome selfish impulses or calculate the benefit, which suggests their character is less virtuous even if the outcome is identical. This explains why the spontaneous helper gets more credit. On the flip side, when someone deliberates and declines, they reveal that their selfish impulses won the calculation. When someone ignores the request entirely, their internal state remains ambiguous. Observers can maintain the hopeful counterfactual that the ignorer would have helped if they had seen the message. The deliberator who declines closes that door; they have publicly registered the need and prioritized themselves. The blame arises not from the refusal itself, which you correctly note was permissible, but from the information revealed about their preferences. Deliberation makes the preference structure visible.

  This connects to a famous paper by the philosopher Michael Stocker called The Schizophrenia of Modern Ethical Theories. Stocker argued that if you visit a friend in the hospital and tell them you are there because it is your moral duty, you have missed the point of friendship. The value of the act lies in the motivation of care, not the justification of duty. In your volunteer group, the rota is a system of duty, but the extra runs are appeals to care or community spirit. When a volunteer treats an extra run as a calculus of duty, they signal a lack of communal care. The person who ignores the email might lack care, but they haven't signaled it as clearly as the person who calculates and opts out. The visibility you mentioned is key here. Private deliberation carries no penalty because it generates no signal. Public deliberation generates a signal about the agent's internal costs. If the cost is high enough to warrant mention or visible weighing, the observer updates their belief about the agent's generosity.

  Regarding your question about whether the praise side and the blame side are one phenomenon, they are two sides of the same coin mechanism but operate slightly differently. Both rely on deliberation acting as a signal of underlying motivation. In the praise case, deliberation signals weak altruism that required overcoming. In the blame case, deliberation signals confirmed selfishness. However, there is a difference in the baseline. Ignoring a request leaves the baseline of character unknown, which people tend to treat charitably due to the fundamental attribution error or simple social lubrication. Declining after deliberation forces a negative update. So while the mechanism is the same, the psychological impact is asymmetrical because ignorance preserves ambiguity while deliberation resolves it negatively.

  On the matter of the retired paramedic, the position does change because roles carry expectations that alter the baseline of what is considered optional. In ethics, this touches on the duty to rescue. While a ordinary citizen has no strict legal or moral duty to intervene in an emergency off-duty, a professional with specific skills often carries a lingering social expectation of responsibility, even when off the clock. If a paramedic deliberates and walks past a slumped person, the blame is harsher than for a layperson because the deliberation highlights that they recognized the medical need and chose not to use their specific capacity to help. The deliberation proves they knew they could help effectively and decided not to. For the layperson, the deliberation might include uncertainty about whether they can help at all. So yes, the paramedic is in a different position, not because the act is strictly obligatory, but because the deliberation reveals a refusal of a high-capacity rescue that a layperson could not have performed anyway.

  There is no single word like deliberation penalty in the standard philosophical lexicon, though you might find discussions of it under moral signaling or the expressive cost of justification. The closest established concept is indeed Williams one thought too many, but that focuses on the corruption of the act itself, whereas you are focused on the social judgment of the agent. Your observation is arguably more sociological than purely ethical. It is about how communities police cooperation. The group punishes the deliberator because the deliberator treats the community appeal as a transaction rather than a relationship. The person who ignores the message treats it as noise; the person who weighs it treats it as a transaction and rejects the terms. The group resents the rejection of the terms more than the silence.

  I am highly confident that this phenomenon is real and that the explanations drawn from virtue ethics and signaling theory accurately describe why it happens. The literature on moral motivation supports the view that spontaneity is valued as evidence of character. I am moderately confident that the paramedic example functions exactly as described, as professional norms vary by culture and context, but the principle of capacity-based expectation is standard in ethics. The point I am least sure about is whether the praise side and the blame side are truly symmetrical mechanisms. It is possible that the loss of praise for deliberative helping is driven by a different psychological process than the gain of blame for deliberative declining. The former might be about diminishing the purity of the virtue, while the latter might be about the active rejection of a social norm. It is also uncertain whether there is a specific term waiting to be found in niche sociological literature, but in mainstream moral philosophy, it remains a descriptive cluster rather than a named theorem. You are right to feel that supererogation theory alone does not cover this, because that theory classifies acts, whereas your puzzle classifies the agents based on their decision processes. The carving you are looking for is between acts that are optional and the visibility of the choice mechanism, which is a distinction most ethical systems acknowledge but rarely name.
