answer: |-
  ### Part 1: Structural Restatement in PLT Vocabulary

  We define the domain of discourse as terms $t$ within a typed lambda calculus with lazy evaluation, recursive types, and a distinguished bottom element ($\bot$). We define the predicate $P(t)$ as "$t$ possesses a canonical normal form independent of evaluation context."

  #### The Catuṣkoṭi (Tetralemma)

  1.  **Being (Is):** $t \Downarrow v$
      The term reduces to a canonical value $v$ in finite steps. The term inhabits its type and possesses a Strong Normal Form. Structurally, this corresponds to a total function or a fully forced data structure where all thunks in the dependency graph have been resolved to constructors.

  2.  **Non-Being (Is Not):** $t \Downarrow \bot$ or $T \cong \text{Void}$
      Two structural interpretations exist here, corresponding to dynamic and static negation:
      *   *Dynamic:* The term is well-typed but diverges (infinite loop) or raises a runtime error. It reduces to $\bot$. It occupies the type space but fails to produce a value.
      *   *Static:* The type $T$ is uninhabited. No term $t$ can be constructed. This corresponds to a proof of `False`.

  3.  **Both Being and Non-Being:** $t \in \text{WHNF} \land t \notin \text{SNF}$
      Utilizing lazy evaluation semantics: The term reduces to a Weak Head Normal Form (e.g., a lambda abstraction or a data constructor with unevaluated arguments), satisfying the requirement to "be" a value for the purpose of type checking or partial observation. However, forcing the arguments within that structure leads to divergence ($\bot$).
      *   *Structural counterpart:* A recursive data structure (e.g., an infinite stream) or a closure containing a divergent thunk. It *is* a value (it has a constructor) and *is not* a value (its contents are $\bot$). It holds typability and divergence simultaneously.

  4.  **Neither Being nor Non-Being:** $t \notin \text{Well-Typed}$
      The term fails the static type check. It is not a member of the type $T$ (Non-Being), nor is it a diverging computation of type $T$ (Being). It is syntactically valid but semantically rejected by the type system. It exists as a string of symbols but has no assignment in the evaluation model. It is outside the domain of the evaluation function entirely.

  #### Śūnyatā (Emptiness) and Pratītyasamutpāda (Dependent Origination)

  **Svabhāva (Intrinsic Nature) as Canonical Normal Form:**
  In this framework, *svabhāva* corresponds to the assumption that a value exists independently of the reduction machine. A value with *svabhāva* would be a ground term that requires no evaluation context, no environment, and no dependency resolution to be "itself."

  **Śūnyatā as Absence of Intrinsic Normal Form:**
  *Śūnyatā* is articulated as the property that no term possesses a value intrinsically; "value-ness" is solely a result of reduction.
  *   **Structural Claim:** There are no "ground values" in the ontology of the machine. Even literals (e.g., `5`) are thunks that require the runtime environment to interpret their bit-pattern.
  *   **Emptiness:** A term is "empty" if it has no fixed point of reference. In a language with recursive types and general recursion, every value is potentially a thunk depending on other thunks. There is no base case in the dependency graph that is not itself defined by the type system's rules.
  *   **Emptiness of Emptiness:** The statement "Type $T$ is empty" (uninhabited) is itself a derivation within the type system. If the type system is consistent, this derivation holds. However, *śūnyatā* applied to the type system implies that the *rules of typing* also lack intrinsic validity. There is no meta-type that validates the type system without itself requiring validation.

  **Pratītyasamutpāda as Thunk Dependency Graphs:**
  *   **Dependent Origination:** A value $v$ arises only when the evaluation context forces a thunk $t$. $t$'s reduction depends on the values of free variables in its environment, which are themselves thunks.
  *   **Ontological Groundlessness:** There is no "first cause" thunk. In a Turing-complete language, the dependency graph can contain cycles (recursion). A value is not a noun but a transient state of the heap during reduction. If evaluation stops, the value ceases to be observed; if evaluation continues, the value may change (in the presence of side effects) or diverge. Existence is strictly co-relative to the evaluation strategy (Call-by-Name vs. Call-by-Value).

  ---

  ### Part 2: Residue Report

  This report analyzes the fidelity of the mapping above, identifying where the PLT vocabulary successfully captures Madhyamaka distinctions and where it distorts or fails to represent them.

  #### 1. Clean Translations (High Fidelity)

  *   **Non-Being (Corner 2) $\rightarrow$ Bottom/Uninhabited:** The distinction between a term that diverges ($\bot$) and a type that cannot be inhabited (`Void`) maps cleanly to the Madhyamaka distinction between conventional non-existence (a pot that is broken) and ultimate non-existence (a son of a barren woman). PLT handles this distinction precisely via operational semantics vs. type inhabitation.
  *   **Dependent Origination $\rightarrow$ Thunk Dependencies:** The claim that phenomena lack independent existence maps robustly to the behavior of thunks in a lazy language. A thunk has no value until forced, and its reduction depends entirely on the bindings in the environment. This captures the "relational" nature of *pratītyasamutpāda* without requiring metaphysical causality.
  *   **Svabhāva $\rightarrow$ Strong Normal Form:** The desire for *svabhāva* is structurally identical to the desire for a Strong Normal Form (SNF)—a term that reduces to a final, immutable state regardless of context. The denial of *svabhāva* is the acceptance that in a Turing-complete system, SNF is not guaranteed, and even WHNF (Weak Head Normal Form) relies on the evaluation context.

  #### 2. Distortions and Smuggled Assumptions

  *   **Both Being and Non-Being (Corner 3) $\rightarrow$ WHNF vs. SNF:**
      *   *Distortion:* Mapping "Both" to the distinction between Weak Head Normal Form and Strong Normal Form requires a specific evaluation strategy (laziness). In a strict language, this corner collapses. Nāgārjuna's "Both" is intended to apply to conventional reality universally, not just under a specific "evaluation strategy" of perception.
      *   *Smuggling:* This mapping smuggles in the assumption that "Being" is graded (partial values). Madhyamaka typically treats the predicates as mutually exclusive in classical logic, using "Both" to break the logic, not to describe a partial value. The PLT mapping makes "Both" consistent and computable, whereas the philosophical intent is often to induce a logical crisis (prasaṅga).
  *   **Neither Being nor Non-Being (Corner 4) $\rightarrow$ Ill-Typed Terms:**
      *   *Distortion:* In PLT, an ill-typed term is a syntax error or a rejection by the compiler. It is trivial. In Madhyamaka, "Neither" is a transcendental move intended to point to a mode of apprehension beyond conceptual proliferation (*prapañca*). Mapping it to "Ill-Typed" reduces a soteriological insight to a static checking failure. It implies the phenomenon is "garbage" rather than "ineffable."
  *   **Emptiness $\rightarrow$ Non-Termination/Uninhabited:**
      *   *Distortion:* There is a risk of conflating *śūnyatā* with $\bot$ (bottom). *Śūnyatā* is not the absence of value (which is $\bot$); it is the absence of *intrinsic* value. A terminating program is still "empty" in Madhyamaka terms because its termination depends on the machine. In PLT, a terminating program is often treated as "real" or "defined." To make this work, we must assert that *all* types are empty of intrinsic meaning, which contradicts the standard PLT view that types classify distinct behaviors.

  #### 3. Structural Failures (The Residue)

  *   **The Meta-Theory Gap (Emptiness of Emptiness):**
      *   *Failure:* PLT relies on a meta-theory (usually set theory or constructive logic) to prove properties like soundness or termination. We can say "Type $T$ is empty," but that statement is true *in the meta-theory*. Madhyamaka insists that the statement "All phenomena are empty" must itself be empty. It denies the ultimate status of the meta-logic.
      *   *Residue:* PLT cannot express the emptiness of its own typing rules without stepping outside the system (Gödelian limitation). If we try to type the type system, we require a universe hierarchy. Madhyamaka denies the ultimate reality of the hierarchy itself. The PLT vocabulary assumes a "God's eye view" of the type system that Madhyamaka explicitly rejects.
  *   **The Soteriological Vector:**
      *   *Failure:* The *catuṣkoṭi* is not an ontological catalog but a tool for liberation (*nirvāṇa*). It is designed to stop the mind from grasping at views. PLT semantics are designed to *enable* grasping (computation, construction, proof).
      *   *Residue:* In PLT, "divergence" ($\bot$) is usually a bug or a limitation to be managed. In Madhyamaka, the realization of emptiness (which looks like "divergence" of conceptual thought) is the goal. The vocabulary treats non-termination as a failure of the system, whereas the philosophy treats the failure of conceptual fixation as a success of the practice. The *valence* of the structural counterparts is inverted.
  *   **Ontological Groundlessness vs. Axiomatic Grounding:**
      *   *Failure:* *Pratītyasamutpāda* claims there is no first cause. PLT languages are defined by axioms (typing rules, reduction rules). These axioms are the "unmoved movers" of the system. You cannot ask "why does beta-reduction hold?" within the system.
      *   *Residue:* The vocabulary cannot articulate the groundlessness of the *rules themselves*. We can model groundless data (cycles), but not groundless logic. The PLT framework rests on a foundation it cannot declare empty without ceasing to function as a formal system.

  ### Conclusion on the Vocabulary Test

  The PLT vocabulary successfully models the **relational** and **partial** aspects of Madhyamaka. It captures the idea that "existence" is conditional on evaluation context (dependent origination) and that intrinsic properties (svabhāva) are absent in recursive structures.

  However, the vocabulary collapses the **transcendental** aspect. The fourth corner ("Neither") becomes a category error (ill-typed) rather than a transcendence of categories. The "Emptiness of Emptiness" hits a hard ceiling at the meta-theory, which PLT must treat as non-empty to function.

  **Verdict:** The philosophical claim does not fully collapse into familiar distinctions, but the *vocabulary* is insufficient to capture the claim's self-reflexive depth. The residue indicates that PLT vocabulary is missing a mechanism to **invalidate its own axioms structurally**. We can model a system where values are empty, but we cannot model a system where the *rules of valuation* are empty without the system dissolving into incoherence. Madhyamaka claims coherence is possible *without* intrinsic rules; PLT claims coherence *requires* intrinsic rules. This is the irreducible divergence.
