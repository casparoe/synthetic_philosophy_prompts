answer: |-
  Before offering a verdict, I must weigh the available conceptual tools against the structure you have described. Strawson's **Objective Attitude** is the immediate candidate, as it involves the suspension of reactive attitudes like resentment; however, Strawson characterizes this as a temporary cooling-off or a global response to viewing someone as psychologically abnormal or incapacitated, whereas your case is stable, domain-specific, and applies to fully competent agents. **Role Morality** fits the contextual shift (referee vs. friend), but it typically dictates that the *actions* themselves change moral valence (e.g., tackling is wrong in the street, right on the pitch), whereas you note the action (deception/gaming) remains morally neutralized only in attitude, not necessarily in rule-violation. **Psychological Compartmentalization** captures the separation of spheres, but it is a descriptive, often pathological mechanism, whereas your phenomenon is normative, healthy, and mutually acknowledged. **Suits' Lusory Attitude** explains the acceptance of constitutive rules in games (like basketball), but it fails to extend to the workplace metric-gaming you describe, which is not a "game" in the lusory sense. Finally, a **Mutual Waiver** suggests a contractual giving-up of rights, but a waiver implies the right is extinguished, whereas here the right to resent is held in reserve to police the boundary itself. None of these concepts fully capture a standing, reciprocal agreement to suspend reactive attitudes within a domain while enforcing that suspension with reactive attitudes from the outside.

  **Verdict and Conceptual Carving**

  Since no established term captures the specific normative architecture you are describing, I propose we name this phenomenon **Reciprocal Stance Partitioning (RSP)**.

  **Definition:** Reciprocal Stance Partitioning is a mutual, often implicit, normative agreement between agents to suspend participant reactive attitudes (resentment, indignation, moral gratitude) toward specific action-types within a defined context, while maintaining full participant stance toward those same agents outside that context. Crucially, the maintenance of the partition itself is a subject of participant accountability; violating the boundary (by importing the suspended attitude into the non-suspended domain, or demanding the suspended attitude where the participant stance is owed) constitutes a legitimate target for reactive attitudes.

  **Hard Boundary Cases:**
  1.  **The Corrupt Manager (Non-Instance):** A manager insists that workplace exploitation is "just business" (demanding an Objective Attitude from employees regarding their resentment) but expects personal loyalty and emotional support from those same employees on weekends (demanding a Participant Stance). This is *not* RSP. It fails the reciprocity condition. It is a form of **Normative Exploitation**, where one party claims the privilege of the Objective Attitude for themselves while denying it to others. It is a corruption of the phenomenon because it parasitically relies on the *expectation* of RSP to function (the employees expect fairness) while violating the *terms* of RSP (fairness is not delivered).
  2.  **The Global Skeptic (Non-Instance):** A philosopher who argues that *no one* is morally responsible and therefore never feels resentment toward anyone, in any context, including when their own boundaries are violated. This is *not* RSP. It is a **Global Objective Stance**. RSP requires the *return* of the participant stance at the meta-level (policing the boundary). If the skeptic does not resent the violation of the partition, they have abandoned the participant stance entirely, which Strawson argues is practically impossible for a human being. RSP is defined by the *tension* between the two stances, not the elimination of one.

  **Addressing Your Specific Questions**

  **Is the one-sided version a corruption or a different phenomenon?**
  It is a **corruption** of Reciprocal Stance Partitioning. The one-sided version (demanding Objective treatment from others while claiming Participant treatment for oneself) is structurally parasitic. It can only function if the *victim* is operating within an RSP framework (expecting that the "game" has rules and boundaries). The corruptor exploits the victim's adherence to the partition while refusing to be bound by it. This tells us that RSP is inherently a **practice of equality**; it relies on mutual recognition of agency. When reciprocity breaks down, the "partition" ceases to be a shared boundary and becomes a tool of domination. The resentment felt by the victim in the one-sided case confirms that the Participant Stance was never actually abandoned, only suppressed for the sake of the cooperative framework.

  **Does this put pressure on Strawson's argument?**
  It puts **constructive pressure** on Strawson, refining rather than refuting his claim about the inescapability of reactive attitudes. Strawson argues we cannot give up the participant stance *wholesale* without ceasing to have ordinary human relationships. Your observation shows that we cannot even give it up *locally* without reinstating it at a higher level. We do not escape the Participant Stance when we adopt the Objective Attitude on the basketball court; we merely **relocate** it. We hold the players responsible for *where* the Objective Attitude applies. This demonstrates that the reactive attitudes are more rationally regulated than Strawson sometimes implies—he suggests they are natural, non-rational commitments—but they are not *eliminable*. The fact that we hold one another responsible for the *partition itself* proves Strawson's core thesis: the Participant Stance is the bedrock. Even when we agree to suspend it, we use it to enforce the suspension. The Objective Attitude, in cases of RSP, is not an alternative to the Participant Stance; it is a **product** of it, negotiated by agents who remain fully within the moral community.
