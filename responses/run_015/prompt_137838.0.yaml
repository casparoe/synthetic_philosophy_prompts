answer: |-
  ### Memorandum to the Oversight Board

  **Subject:** Determination on the 'Curator' Feature
  **From:** Advisory Panel on Liberty and Regulation
  **Date:** 24 May 2024

  #### 1. Candidate Decision Rules

  To adjudicate the *Curator* case consistently with your five precedents, we must first distil the underlying principles of liberty your board has implicitly adopted. We have identified three candidate decision rules derived from contemporary political philosophy: Negative, Republican, and Positive/Procedural conceptions of freedom.

  *   **Rule A: The Non-Interference Principle (Strict Negative Liberty).**
      *   *Definition:* Freedom is restricted only when an external agent actively prevents a user from doing what they currently wish to do. The mere existence of power is irrelevant; only its exercise matters.
      *   *Test against Precedents:* This rule fits Precedents 1, 3, 4, and 5. However, it **fails Precedent 2**. In Precedent 2, the vendor never exercised power, yet the board ruled it a restriction. Therefore, Rule A is incompatible with the board's jurisprudence and must be discarded.

  *   **Rule B: The Non-Domination Principle (Republican Liberty).**
      *   *Definition:* Freedom is restricted when a user is subject to the arbitrary power of another agent, regardless of whether that power is exercised. The focus is on the *status* of the user relative to the power-holder. Recourse and transparency remove arbitrariness.
      *   *Test against Precedents:* Fits all five. Precedent 2 is the clearest expression (power exists = domination). Precedent 1 shows that binding rules and appeals negate arbitrariness. Precedent 5 treats algorithmic manipulation as a form of structural domination over the will.

  *   **Rule C: The Effective Agency Principle (Positive/Procedural Liberty).**
      *   *Definition:* Freedom is restricted when a user's capacity for meaningful, autonomous choice is compromised by coercion, manipulation, or excessive friction, even if no formal ban exists. The focus is on the *quality* of the user's consent and cognitive state.
      *   *Test against Precedents:* Fits all five. Precedent 3 (coercion), Precedent 5 (compromised self-control), and Precedent 2 (lack of recourse undermines the validity of the user's position) all align. Precedent 4 passes because the choice to pay remains meaningful and uncoerced.

  #### 2. Analysis of the 'Curator' Feature

  We now apply the two surviving rules (B and C) to the *Curator* feature.

  **Prediction under Rule B (Non-Domination):**
  *   **Verdict:** **Restriction.**
  *   **Reasoning:** While the recommender's criteria are published and appealable (mimicking Precedent 1), the *architecture* of the choice grants the platform arbitrary power in practice. The auto-advance screen and the "four menus deep" switching mechanism create a dependency. The platform holds the power to set the default and obscure the alternative, rendering the user's status subordinate. The theoretical right to appeal does not negate the arbitrariness of a choice architecture designed to be ignored.
  *   **Precedent Pull:** Strongly pulled by **Precedent 2** (structural power matters more than exercise) and **Precedent 5** (design dictates behaviour). Weakened by **Precedent 1** (appeals exist).

  **Prediction under Rule C (Effective Agency):**
  *   **Verdict:** **Restriction.**
  *   **Reasoning:** The board's research indicates users do not recall the choice and cannot explain the curator's function. This mirrors the "unable to stop" finding in Precedent 5, suggesting a compromise of cognitive agency. The friction costs (paid login, hidden menus) render the alternative choices illusory for 97 per cent of users. Meaningful consent requires awareness and accessible alternatives; both are absent here.
  *   **Precedent Pull:** Strongly pulled by **Precedent 5** (manipulation of will) and **Precedent 3** (high switching costs). Weakened by **Precedent 4** (alternatives technically exist).

  #### 3. Board Verdict and Rationale

  **Verdict:** The Board should rule that Curator **restricts users' freedom**.

  **Rationale:**
  While both surviving rules predict a restriction, **Rule C (Effective Agency)** offers the more robust justification for this specific case. Rule B (Non-Domination) risks getting bogged down in whether the appeal process is sufficient to negate "arbitrariness." Rule C cuts directly to the empirical reality your own research uncovered: users are not exercising agency, they are being steered.

  The precedents establish that freedom is not merely the absence of a ban, but the presence of a *meaningful* capacity to choose. Precedent 2 established that the *structure* of power matters even if unused; Precedent 5 established that *internal* constraints (addiction) count as restrictions. *Curator* combines structural friction with cognitive opacity. The fact that users report "no dissatisfaction" is irrelevant under Rule C, just as the vendor in Precedent 2 not exercising power was irrelevant. Freedom is about the capacity to choose, not merely satisfaction with the outcome.

  **Closest Precedents:**
  *   **For Restriction:** **Precedent 5** is the closest analogue. In both cases, the user's relationship with the feed is shaped by design choices they do not fully comprehend or control, compromising their autonomy regardless of their reported satisfaction. **Precedent 2** is the secondary anchor, as the difficulty in switching creates a form of unchecked power over the user's experience.
  *   **For No Restriction:** **Precedent 1** is the closest counter-argument. The platform will argue that published criteria and appeal rights satisfy the requirement for non-arbitrariness. However, Precedent 1 involved a user who *endorsed* the rules; *Curator* users are unaware of them.

  #### 4. Underdetermination and Principles

  If the Board finds the precedents genuinely underdetermined—for instance, if a minority argues that the existence of *any* switch (however hidden) satisfies the requirement for liberty—the Board must choose between two principles:

  1.  **Formal Liberty:** If you rule **No Restriction**, you adopt the principle that freedom is satisfied by the *theoretical* availability of recourse and alternatives, regardless of the cognitive or practical friction required to access them. This prioritises platform flexibility and assumes users are responsible for navigating complexity.
  2.  **Substantive Liberty:** If you rule **Restriction**, you adopt the principle that freedom requires the *effective* capability to exercise choice. This prioritises user autonomy and places the burden on the platform to ensure choice architectures are transparent and accessible.

  Given Precedents 2 and 5, the Board has historically favoured Substantive Liberty. To rule otherwise now would be inconsistent with the finding that unexercised power (P2) and internal compulsion (P5) constitute restrictions.

  #### 5. The Discriminating Case

  To definitively distinguish between Rule B (Non-Domination) and Rule C (Effective Agency) in future jurisprudence, the Board should seek the following test case:

  **The Case of 'Consensual Domination':**
  *   **Scenario:** A platform proposes a feature where users *explicitly vote* to grant the platform arbitrary power to curate their feed without appeal, in exchange for a significant financial dividend. The users are fully informed, the choice is frictionless, and the vote is binding. The platform then exercises this power.
  *   **Why it Discriminates:**
      *   **Rule B (Non-Domination)** must rule this a **Restriction**. In republican theory, one cannot consent to domination; doing so changes one's status from a free citizen to a dependent subject, regardless of how voluntary the act was. (This aligns with the spirit of Precedent 2).
      *   **Rule C (Effective Agency)** would likely rule **No Restriction**. The users' capacity for autonomous choice was fully intact and exercised; they traded a specific freedom for a benefit knowingly. There is no manipulation or cognitive compromise.

  This case isolates the *source* of the restriction: is it the *status* of power (Rule B), or the *quality of the choice* (Rule C)? Resolving this will clarify whether the Board protects users from themselves (Agency) or protects their status against power (Domination).

  ***

  **Advisory Conclusion:**
  Proceed with a verdict of **Restriction**. Rely on the *Effective Agency* principle derived from Precedents 3 and 5. The opacity of the onboarding and the friction of the settings menu render the choice illusory, violating the standard of meaningful consent your board has upheld in cases of coercion and manipulation.
