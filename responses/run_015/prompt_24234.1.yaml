prompt: |-
  In the moral-uncertainty literature, the standard move is to treat moral uncertainty exactly like decision-making under empirical uncertainty: each candidate moral theory is a hypothesis, your credence in it is a probability, the outcomes are the same across theories, and you compute expected moral value the way a decision theorist computes expected utility. That analogy is doing all the work in the claim that there is a single general procedure for acting under moral uncertainty. How far does it actually hold?

  Return a table with these columns:
  - empirical_element: the element of the standard decision-under-uncertainty problem (e.g., hypothesis, probability, outcome, utility, evidence).
  - moral_counterpart: what it corresponds to in the moral-uncertainty setting.
  - status: one of holds, strained, or breaks.
  - why: one sentence justifying the status.
  - consequence: what this means for the expected-value procedure (blank if none).

  Make sure to cover the contested elements: whether the utility function is fixed (as in empirical decision-making) or is itself what is in question, whether rival theories' values are commensurable on a common scale, and whether the evidence for a moral theory is independent of the act being decided. After the table, return a JSON object with these fields:
  - surviving_claim: a string stating which part of the "there is a general procedure" claim survives.
  - load_bearing_disanalogies: an array of the disanalogies that actually undermine the procedure.
  - cosmetic_disanalogies: an array of disanalogies that do not.
  - better_source_domain: a string proposing a better source domain for the analogy, or "none."
reasoning: |-
  Here's a thinking process that leads to the desired output:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Uncertainty vs. Empirical Uncertainty (Decision Theory).
      *   **Task:** Create a table comparing elements of standard decision-under-uncertainty with moral uncertainty, assessing the strength of the analogy (holds, strained, breaks), explaining why, and noting consequences for the expected-value procedure.
      *   **Specific Requirements:** Cover contested elements (utility function fixed vs. in question, commensurability of values, independence of evidence/act).
      *   **Post-Table Output:** A JSON object with specific fields (`surviving_claim`, `load_bearing_disanalogies`, `cosmetic_disanalogies`, `better_source_domain`).
      *   **Format:** Markdown table followed by JSON.

  2.  **Deconstruct the Analogy (Moral Uncertainty as Empirical Uncertainty):**
      *   *Standard Decision Theory:* Agent has credences over states of the world (empirical hypotheses), a fixed utility function (preferences/values), and chooses an act to maximize Expected Utility (EU).
      *   *Moral Uncertainty:* Agent has credences over moral theories, outcomes are physical states, but the *value* of those outcomes depends on the moral theory. The goal is to maximize Expected Moral Value (EMV).

  3.  **Drafting the Table Rows (Iterative Process):**

      *   *Row 1: Hypothesis.*
          *   Empirical: State of the world (e.g., "It will rain").
          *   Moral: Moral theory (e.g., "Utilitarianism is true").
          *   Status: Holds.
          *   Why: Both represent mutually exclusive possibilities about how things stand.
          *   Consequence: None.

      *   *Row 2: Probability/Credence.*
          *   Empirical: Degree of belief in the state.
          *   Moral: Degree of belief in the theory.
          *   Status: Strained.
          *   Why: Empirical credences track mind-independent facts, while moral credences may reflect normative commitment rather than factual likelihood.
          *   Consequence: Requires a specific interpretation of moral credence (e.g., cognitivist).

      *   *Row 3: Outcome.*
          *   Empirical: Physical state resulting from act + state.
          *   Moral: Physical state resulting from act.
          *   Status: Holds.
          *   Why: Both frameworks agree on the descriptive consequences of actions.
          *   Consequence: None.

      *   *Row 4: Utility/Value Function.*
          *   Empirical: Fixed preference ordering over outcomes.
          *   Moral: Variable across theories (this is the uncertainty).
          *   Status: Breaks.
          *   Why: In empirical decision-making, utility is fixed; in moral uncertainty, *what* counts as good is exactly what is uncertain.
          *   Consequence: Requires intertheoretic comparison to normalize scales.

      *   *Row 5: Commensurability (Scale).*
          *   Empirical: Utility is cardinal and comparable across states.
          *   Moral: Values may be incommensurable across theories (e.g., rights vs. welfare).
          *   Status: Breaks.
          *   Why: Empirical utility is defined by the agent; moral value is defined by rival theories that may deny a common metric.
          *   Consequence: Expected moral value calculation becomes mathematically undefined without normalization.

      *   *Row 6: Evidence/Independence.*
          *   Empirical: Evidence for states is independent of the act chosen.
          *   Moral: Evidence for moral theories might depend on the act (e.g., moral testimony, reflective equilibrium shifts).
          *   Status: Strained.
          *   Why: Choosing an act can signal moral character or trigger moral learning, altering credences in the theory itself.
          *   Consequence: Violates the standard assumption that acts don't influence state probabilities (evidential vs. causal issues).

      *   *Row 7: Maximization Goal.*
          *   Empirical: Maximize expected satisfaction of fixed preferences.
          *   Moral: Maximize expected conformity to true moral theory.
          *   Status: Strained.
          *   Why: "Satisfaction" implies a subjective metric, whereas moral conformity implies an objective metric the agent doesn't fully know.
          *   Consequence: Shifts focus from preference satisfaction to truth-tracking.

  4.  **Refining the Table Content:**
      *   Ensure the "Why" is one sentence.
      *   Ensure "Status" is strictly one of the three options.
      *   Focus heavily on the "Utility/Value" and "Commensurability" rows as requested.

  5.  **Drafting the JSON Object:**
      *   `surviving_claim`: What actually works? The *structure* of weighting possibilities by credence works, provided values are comparable.
      *   `load_bearing_disanalogies`: What kills the simple analogy? The lack of a fixed utility function (intertheoretic comparison problem) and the nature of moral credence.
      *   `cosmetic_disanalogies`: What looks different but doesn't matter? The semantic label of "hypothesis" vs "theory," or the physical nature of outcomes.
      *   `better_source_domain`: Is there a better analogy? Maybe "negotiation" or "committee voting" (Harsanyi-style) or "measurement under error." Let's go with "committee decision-making" because it captures the idea of aggregating distinct value systems rather than discovering a fixed fact. Or "none" if the decision theory framework is still the best we have despite flaws. Actually, "weighted voting among advisors" is a common philosophical refinement. Let's stick with "committee decision-making" as it highlights the aggregation problem.

  6.  **Review against Constraints:**
      *   Table columns: `empirical_element`, `moral_counterpart`, `status`, `why`, `consequence`.
      *   JSON fields: `surviving_claim`, `load_bearing_disanalogies`, `cosmetic_disanalogies`, `better_source_domain`.
      *   Content: Must cover utility fixedness, commensurability, and evidence independence.
      *   Format: Markdown table then JSON.

  7.  **Final Polish:**
      *   Check sentence counts in the "why" column.
      *   Ensure the JSON is valid.
      *   Make sure the distinction between "strained" and "breaks" is clear (strained = needs work/qualification; breaks = fundamental incompatibility).

      *(Self-Correction during drafting)*: For the "Evidence/Independence" row, the issue is often framed as "moral learning." If I choose X, does that make me more confident in Theory A? In empirical cases, choosing to carry an umbrella doesn't make it more likely to rain. In moral cases, choosing to donate might reinforce utilitarian credence. This is "strained" rather than "breaks" because causal decision theory can usually handle act-independent states, but moral epistemology is trickier. I will mark it "strained."

      For "Utility Function," this is the big one. In empirical DT, $U(o)$ is fixed. In moral uncertainty, $V_T(o)$ varies by $T$. This is a structural break in the standard model unless we introduce a "metavalue" function. I will mark it "breaks."

      For "Commensurability," if Theory A uses utils and Theory B uses rights-violations, you can't sum them. This breaks the math. Mark as "breaks."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

      *Wait, one check on the JSON:* The prompt asks for "load_bearing_disanalogies" and "cosmetic_disanalogies" as arrays of strings. I need to make sure these are concise descriptions.

      *Better Source Domain:* Some philosophers suggest "negotiation" or "portfolio management." "Committee voting" is probably the most apt for the aggregation of conflicting norms. I'll use "committee decision-making."

      *Surviving Claim:* The core idea of weighting options by credence survives *if* commensurability is assumed.

      Let's assemble.

      *Table Row Check:*
      1. Hypothesis/State -> Moral Theory (Holds)
      2. Credence -> Moral Credence (Strained - cognitivism requirement)
      3. Outcome -> Physical Outcome (Holds)
      4. Utility Function -> Moral Value Function (Breaks - it's the variable)
      5. Value Scale -> Intertheoretic Comparison (Breaks - incommensurability)
      6. Evidence Independence -> Act-Theory Independence (Strained - moral learning)

      Looks good.

      *JSON Check:*
      - surviving_claim: "The formal structure of weighting possibilities by credence remains valid provided a common value scale can be established."
      - load_bearing: ["Utility function is variable rather than fixed", "Intertheoretic value commensurability is not guaranteed", "Moral credences may not behave like empirical probabilities"]
      - cosmetic: ["Semantic difference between 'state' and 'theory'", "Descriptive nature of outcomes"]
      - better_source_domain: "committee decision-making"

      Ready to write.cw
