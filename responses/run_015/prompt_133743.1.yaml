      *   **(3) & (5):** Looks like tension (If species aren't kinds, how is there one true taxonomy?), but (5) allows that the *one true taxonomy* might not use species as its fundamental units (might use clades or populations). So long as *some* taxonomy carves joints, (5) holds.

