      *   (7) **Biology's Status:** Evolutionary biology is explanatory/objective, *not* epistemically inferior to chemistry, *despite* species not being natural kinds (per 3 & 1).
      *   (8) **Planet Definition (Conventional):** IAU redefinition was conventional stipulation (orbital clearing), not discovery of a joint.
