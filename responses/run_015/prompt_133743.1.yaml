          *   (8): IAU decision = Conventional stipulation, *not* discovery of a joint.
          *   (9): Pre-IAU = Tracking a real kind. Decision = Corrected miscategorization.
          *   *Tension:* If they were tracking a real kind (9), the decision *revealed* the joint. (8) denies the decision discovered a joint, calling it stipulation.
          *   *Resolution:* Distinguish the *concept* from the *extension*. They had a vague concept tracking a real cluster. The IAU *stipulated* a precise boundary (8) to match the *real cluster* (9).
