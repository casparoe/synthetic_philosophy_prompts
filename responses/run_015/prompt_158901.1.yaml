prompt: |-
  My friend Nadia (philosophy minor, then public health, and she's the person in our group chat everyone pings when someone asks "is it messed up that…") has a long track record of confident verdicts on markets, and she refuses to state a general principle — she just goes case by case. Things I remember her saying over the years: paying people for plasma, fine; selling a kidney while alive, disgusting and should stay banned; compensated surrogacy in the US with capped fees, "grudgingly fine"; paying someone to carry and hand over a baby, ban; surge pricing for rides on New Year's Eve, fine; jacking up the price of bottled water and generators the day after a hurricane, ban; reselling a concert ticket above face value — she hates it but says banning it is worse; selling your vote, ban; investor "golden visa" citizenship, ban; paying people $100 to get a covid shot, fine; paying someone to hold your place in line, silly but fine. I genuinely cannot tell whether she's going by one clean rule or by vibes.

  I'm a backend engineer and I do some contract work for a small startup that runs a real-money prediction market (I've worked on their matching engine, so I know the plumbing; I'm not shilling). They want to list contracts on the next presidential election, and they've piled on guardrails because they know it sounds gross: $50 max net position per person, verified identity and age, no margin or leverage, one position per candidate, settlement on the certified popular vote, and — the bit they think is the clincher — in the final 30 days you can only open a position if public records show you already cast a ballot (they check whether you voted, not how). The spread goes to a voter-registration nonprofit. They asked me whether this is the kind of thing people will call repugnant, and I have no idea.

  Here's what I want from you. Given her list, what rule do you think Nadia is actually running? I can see at least two that fit all ten of her verdicts — one roughly like "a market is out when it takes advantage of desperate people or entrenches inequality in something that matters for standing," another roughly like "a market is out when it's the wrong way to value the thing being traded, even when everyone consents and nobody is made worse off" — but I bet there are others that fit just as well, and I want them named. Then: what does each candidate rule predict about the election contract, which verdict do you think she'd actually give and why, which of her earlier verdicts is doing the most work in pinning the rule down, and what single further case would you put to her to tell the rules apart? I care much more about the shape of the rule and where the cases split than about the final yes/no.
