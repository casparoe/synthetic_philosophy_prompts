  Nadia isn't running on vibes; she's running a sophisticated, unstated **casuistry**. She judges by analogy to precedent cases rather than deducting from a single axiom. However, her precedents cluster around three distinct ethical frameworks that all fit her ten verdicts.

  Here are the three candidate rules, how they apply to your startup's election contract, and how to figure out which one she's actually using.

  ### 1. The Three Candidate Rules

  **Rule A: The Coercion & Necessity Principle (The "Desperation" Rule)**
  *   **The Logic:** Markets are impermissible when the consent of one party is compromised by acute necessity or structural power asymmetry. If you *need* the thing to survive (water, kidney) or are *forced* to sell by poverty (kidney, vote), the market is coercive.
  *   **Fits the Data:** Explains the Hurricane vs. NYE split (survival vs. convenience), the Kidney vs. Plasma split (vital organ vs. regenerative fluid), and the Vote/Golden Visa bans (economic pressure on the poor to sell civic standing).
  *   **Blind Spot:** It struggles to explain why she bans **Vote Selling** even if a rich person sells to a rich person (no desperation), or why she hates **Ticket Scalping** (no survival need) even if she allows it pragmatically.

  **Rule B: The Moral Corruption Principle (The "Sacredness" Rule)**
  *   **The Logic:** Markets are impermissible when trading a good degrades its intrinsic moral meaning or value, regardless of consent. Some things lose their worth when priced.
  *   **Fits the Data:** Explains Vote Selling (democracy isn't a commodity), Kidney (body isn't spare parts), Baby Selling (children aren't products), and Golden Visas (citizenship is a bond, not a SKU). It allows Plasma/Line Standing because those are viewed as labor/fluid, not identity.
  *   **Blind Spot:** It struggles with **Surrogacy** ("Grudgingly fine"). If carrying a baby is sacred labor, why is it ever fine? This rule requires a "regulation exception" that isn't inherent to the rule itself.

  **Rule C: The Civic Integrity Principle (The "Systemic Trust" Rule)**
  *   **The Logic:** Markets are impermissible when they erode public trust in essential institutions (medical, democratic, emergency response). The harm isn't to the buyer/seller, but to the *system* they rely on.
  *   **Fits the Data:** Explains Vote Selling (trust in elections), Golden Visas (trust in borders), Hurricane Gouging (trust in community during crisis), and Kidney (trust in medical ethics). It allows **Scalping** because banning it creates black markets that hurt the system more.
  *   **Blind Spot:** It's less clear on **Line Standing**, which is purely private and has little systemic impact.

  ### 2. Prediction: The Election Contract

  **The Case:** A prediction market on the presidential election with strict guardrails ($50 cap, ID verified, no leverage, must have voted, spread to nonprofit).

  **Application of Rules:**
  *   **Rule A (Coercion):** **Verdict: Fine.** The $50 cap and "no leverage" rule remove the risk of financial desperation. The "must have voted" clause ensures participants are civically engaged, not economically coerced into betting instead of voting.
  *   **Rule B (Corruption):** **Verdict: Grudgingly Fine / Suspicious.** Betting on an election risks turning a civic duty into a gambling opportunity. However, the "must have voted" guardrail decouples the *bet* from the *vote* (you can't sell your vote, you can only bet after casting it). This is analogous to her **Covid Shot** verdict (paying for a civic health act is fine).
  *   **Rule C (Integrity):** **Verdict: Grudgingly Fine.** Prediction markets can aggregate information (good for trust in outcomes), but they can also incentivize wishing for chaos. The nonprofit spread mitigates the "greed" aspect, signaling the goal is engagement, not extraction.

  **Nadia's Likely Verdict:** **"Grudgingly Fine."**
  She will treat this like **Compensated Surrogacy**. She thinks the underlying activity is slightly "gross" (monetizing the election), but the guardrails (caps, verification, nonprofit benefit) sufficiently mitigate the harm to make it permissible. She will explicitly distinguish it from **Vote Selling**.

  **Why:** The guardrails mimic the "capped fees" of her surrogacy verdict. She allows the market *if* it is heavily regulated to prevent exploitation and maintain dignity.

  ### 3. The Pivot Case

  The verdict that is doing the most work here is **Vote Selling (Ban)**.

  This is the anchor. If Nadia views your contract as a subset of "selling votes," she will ban it instantly. If she views it as "betting on information," she will allow it.
  *   **Vote Selling:** Selling your *input* into the system. (Ban)
  *   **Prediction Market:** Betting on the *output* of the system. (Fine)
  *   **The Guardrail:** The requirement to *have voted* links the two. Nadia will scrutinize whether this link turns the bet into a proxy for selling influence. Because the bet is capped at $50 and settled on the *popular vote* (not their specific vote), she will likely see it as distinct enough from Vote Selling to pass, provided the "must have voted" check is privacy-preserving.

  ### 4. The Test Case

  To distinguish whether she is running **Rule A (Coercion)** or **Rule B/C (Integrity/Trust)**, propose this case:

  **"A wealthy donor auctions off a private dinner with a sitting U.S. Senator to raise money for the Senator's re-election campaign."**

  *   **Rule A (Coercion) Predicts: Fine.** There is no desperation. The buyer is wealthy, the seller (Senator) is powerful. No one is being exploited by necessity.
  *   **Rule B/C (Integrity/Trust) Predicts: Ban.** This commodifies access to representation. It degrades the meaning of the office (Rule B) and erodes public trust in the legislature (Rule C), even if everyone consents and no one is poor.

  **Why this splits them:**
  If Nadia says **"Fine, it's just fundraising,"** she is prioritizing **Rule A (Coercion)**. She only cares when people are desperate.
  If Nadia says **"Ban, it's pay-to-play,"** she is prioritizing **Rule B/C (Integrity)**. She cares about the *meaning* of the institution, regardless of the money involved.

  Given her history with **Golden Visas** (Ban), I suspect she will say **Ban**, which confirms she is running an **Integrity/Trust** rule, not just a Desperation rule. This bodes well for your election contract *only if* you can prove it doesn't erode trust (hence the nonprofit spread is crucial).
