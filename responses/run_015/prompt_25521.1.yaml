answer: |-
  This is a fantastic question. You have identified a genuine tension in liberal political theory that often goes unnoticed because we are so accustomed to the institutional roles. You are right: on the surface, both legislators and judges are state actors exercising coercive power over citizens. If the norm of "public reason" applies to one, why not the other?

  To answer this, we have to look beyond the legal doctrine (like the *Lemon* test or Establishment Clause jurisprudence) and dig into the political philosophy of **authority, representation, and the nature of law.**

  Here is a breakdown of the theories that justify this asymmetry, an assessment of their coherence, and a verdict on whether we should tighten the reins on legislators or loosen them for judges.

  ### 1. The Theory of Public Reason and "Shareability"

  The dominant framework here is **Public Reason Liberalism**, most famously associated with John Rawls. The core idea is that in a pluralistic society, when the state coerces citizens, the justification for that coercion must be accessible to all reasonable citizens, regardless of their comprehensive doctrines (religious or secular).

  *   **The Judicial Constraint:** For a judge, the output is a ruling that claims to be *the law*. In a secular democracy, "the law" is a system of public rules derived from constitutions and statutes, not divine revelation. If a judge writes, "Scripture commands X, therefore the State must enforce X," they are bypassing the social contract. They are invoking an authority (God/Text) that not all citizens have consented to be bound by. This violates the **duty of civility** and the **rule of law**, which requires that legal decisions be grounded in public, verifiable sources.
  *   **The Legislative Permission:** Legislators are not interpreting existing public rules; they are *creating* new norms based on values. In political philosophy, values are often derived from comprehensive doctrines. When a legislator says, "My faith compels me to protect the unborn," they are engaging in **value articulation**. Public reason theorists (like Rawls in his later work) allow religious reasons in legislative *debate*, provided that eventually, secular reasons are also offered to justify the coercion (the "proviso").

  **The Coherence Check:** This distinction holds up if you view legislation as **value-laden creation** and adjudication as **neutral application**. However, it gets shaky if a legislator says, "I vote Yes *only* because my Bible says so," with no secular policy rationale. Many philosophers (like Robert Audi) argue this *should* be normatively prohibited for legislators too, even if it isn't politically scandalous. So, the asymmetry is partly a matter of **enforcement**, not just theory.

  ### 2. Representation vs. Fiduciary Duty

  This is perhaps the strongest philosophical justification for the asymmetry. It hinges on **who the official represents.**

  *   **Legislators as Delegates:** A legislator represents a specific constituency. If that constituency is deeply religious, the legislator is arguably fulfilling their representative duty by channeling those religious values into law. They are a mirror of the populace. If the people are religious, the legislature should reflect that. The "norm" here is **responsiveness**.
  *   **Judges as Trustees of the Law:** A judge does not represent the people, the plaintiff, or the defendant. They represent the **Law itself**. Their fiduciary duty is to the integrity of the legal system. Since the legal system is a secular framework designed to manage disagreement among people of different faiths, importing a specific faith into the opinion breaks the fiduciary bond. It signals that the court belongs to one tribe rather than the whole polity.

  **The Coherence Check:** This is highly coherent. It treats the two roles as functionally different. One is a microphone for the public will (which includes religion); the other is a guardian of the public framework (which must transcend religion).

  ### 3. The Accountability Mechanism (The "Elected vs. Appointed" Factor)

  You asked if the elected/appointed distinction is a red herring. **It is not.** In political philosophy, this is the distinction between **political accountability** and **institutional neutrality.**

  *   **The Legislative Exit Valve:** If a legislator votes solely on religious grounds, and you disagree, you have a remedy: **elections.** You can vote them out. The democratic process is designed to absorb and purge unpopular moral reasoning over time. The risk of theocracy is mitigated by the ballot box.
  *   **The Judicial Insulation:** Federal judges (in the US model) have life tenure specifically to insulate them from public pressure. Because they are immune to the "exit valve" of elections, they must be bound by stricter "input constraints." They cannot rely on personal moral or religious conviction because there is no way to remove them if that conviction diverges from the public good. Their constraint must be external (the text of the law), not internal (their conscience).

  **The Coherence Check:** This makes the asymmetry not only coherent but necessary. If judges were elected, the norm might shift (and indeed, in some US states with elected judges, we see slightly more rhetorical flexibility, though still not explicit scriptural reliance). Because judges are counter-majoritarian, their justification for power must be strictly secular-legal to maintain legitimacy.

  ### 4. Motivation vs. Justification

  A nuanced philosophical take distinguishes between **motivation** (why I believe this) and **justification** (why the state should enforce this).

  *   **Legislators:** We tolerate the conflation of motivation and justification. If a legislator says, "My faith motivates me to vote for this welfare bill," we accept that the *policy* (welfare) has secular benefits, even if the *motive* is religious.
  *   **Judges:** We demand a strict separation. A judicial opinion is a **public justification**. It is not enough that the judge was motivated by justice; the opinion must demonstrate that the *law* requires the outcome. Citing scripture fails as a public justification because it is not a premise shared by the parties in the litigation.

  ### So, is the practice inconsistent?

  It is **pragmatically consistent** but **theoretically porous.**

  It is consistent because the functional roles (making values vs. applying rules) and accountability structures (elections vs. tenure) differ. However, it is porous because legislators *do* bind people, and if they bind people solely on religious grounds without secular justification, they are arguably violating the same norm of public reason that binds judges. We just lack the mechanism to stop them (courts generally won't strike down a law just because the sponsor had a religious motive, per *Edwards v. Aguillard* nuances).

  ### What would the "Best Theory" demand?

  If we take Public Reason Liberalism seriously (specifically the versions articulated by Rawls, Habermas, or Audi):

  1.  **Do not loosen judges:** Allowing judges to cite scripture would undermine the Rule of Law. It would turn courts into pulpits and transform legal rights into theological privileges. This would destroy the court's legitimacy in a pluralistic society.
  2.  **Tighten the norm for legislators (culturally, not legally):** We shouldn't legally gag legislators (free speech concerns), but the *norm* should be stronger. A legislator *should* be expected to provide a secular rationale for coercion, even if their personal motivation is religious. The scandal isn't that they have religious motives; it's if they claim religious authority *is* the law.
  3.  **The "Translation" Proviso:** Jurgen Habermas suggested that religious citizens are welcome in the public square, but there is an expectation that religious language eventually gets "translated" into secular language for the sake of collective decision-making.
      *   *Legislators:* Should be encouraged to translate ("I believe life is sacred" $\rightarrow$ "The state has an interest in protecting potential life").
      *   *Judges:* Must have already completed the translation before writing the opinion.

  ### Conclusion

  The asymmetry presupposes a theory of **Functional Differentiation**. It assumes that the Legislature is the arena for **moral disagreement** (where religion is a valid participant) and the Judiciary is the arena for **legal resolution** (where religion is an invalid source of authority).

  This is coherent *provided* we accept that:
  1.  Law and Morality are distinct (Legal Positivism).
  2.  Electoral accountability is a sufficient check on religious overreach in the legislature.

  If you believe that law *is* morality, or that elections are insufficient to protect minority rights against a religious majority, then the asymmetry collapses, and you would likely argue for stricter policing of legislative speech. But within the standard liberal democratic framework, the distinction holds: **Legislators speak for the People (who may be religious); Judges speak for the Law (which must be secular).**

  The elected vs. appointed distinction is the linchpin. Without it, the asymmetry is much harder to defend. With it, the asymmetry is a feature, not a bug, of a system designed to balance popular will with neutral rights.
