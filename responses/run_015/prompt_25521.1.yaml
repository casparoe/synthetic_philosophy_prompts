prompt: |-
  something that's been bugging me and i'd love a philosopher's take on it. in the us and a bunch of other liberal democracies, there's this weird asymmetry in how we treat religious reasons in official decision-making. a legislator can get up on the floor and say "i'm voting for this bill because my faith demands it" and sure, some people might disagree, but nobody thinks they've violated a basic norm of democratic deliberation — it's considered totally within bounds. but if a federal judge wrote "i'm ruling for the plaintiff because scripture commands it" in a judicial opinion, that would be a scandal of the first order, probably grounds for reversal and judicial discipline. and yet both of them are state actors making decisions that bind other people. so what i want to know is: what theory of public reason, or of the proper place of religion in public life, does this asymmetry presuppose? is there actually a coherent theory that makes sense of it, or is the practice just inconsistent — two different intuitions that haven't been reconciled? and if we took the best theory seriously, would it push us toward policing legislative speech more like we police judicial speech, or loosening up what judges can say, or something else? i'm less interested in the black-letter constitutional answer (i know about the establishment clause) and more in the underlying political philosophy that would justify or undermine the distinction. also, does it matter that legislators are elected and judges aren't, or is that a red herring?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** There's an asymmetry in liberal democracies (specifically the US) regarding religious reasons in official decision-making.
          *   *Legislators:* Can cite faith/vote based on religious conviction without violating norms.
          *   *Judges:* Cannot cite scripture/religious authority in opinions; it would be scandalous/reversible.
      *   **Core Question:** What theory of public reason or religion in public life justifies this asymmetry? Is it coherent or inconsistent?
      *   **Follow-up:** If we took the best theory seriously, should we police legislators more or judges less?
      *   **Specific Constraint:** Less interested in black-letter law (Establishment Clause), more in political philosophy.
      *   **Specific Sub-question:** Does the elected vs. appointed distinction matter?

  2.  **Initial Brainstorming & Philosophical Mapping:**

      *   *Public Reason Liberalism (Rawls):* This is the big one. Rawls argues public officials should justify decisions using reasons accessible to all citizens. But Rawls has a "proviso" – religious reasons are okay *if* secular reasons are also provided eventually.
      *   *Representation vs. Adjudication:* Legislators represent constituents (who might share their faith). Judges interpret law (which is supposed to be neutral).
      *   *The Nature of the Decision:* Legislation creates new norms (value-laden). Adjudication applies existing norms (law-laden).
      *   *Accountability:* Legislators are voted out. Judges have life tenure (federal).
      *   *Secular Purpose:* Lemon Test (legal), but philosophically, the idea is that state coercion needs secular justification.
      *   *Conscience vs. Authority:* A legislator speaks *for* their conscience/constituents. A judge speaks *for* the Law/State.

  3.  **Structuring the Response:**

      *   **Acknowledge and Validate:** Start by confirming the observation. It's a sharp insight, not a bug in the user's thinking.
      *   **The Core Philosophical Tension:** Introduce the concept of *Public Reason* (Rawls, Audi, etc.).
      *   **Argument 1: The Nature of the Role (Representation vs. Interpretation).**
          *   Legislators = Policy/Values. Religious values are part of the populace's values.
          *   Judges = Law/Text. Religious texts are not law.
      *   **Argument 2: Accountability and Consent.**
          *   Legislators = Elected. If you don't like their God, vote them out.
          *   Judges = Appointed/Life. No exit valve. Need stricter neutrality.
      *   **Argument 3: The "Secular Rationale" Requirement (The Coherence Check).**
          *   Is it actually consistent? Rawls says religious reasons are okay in *debate* but not as the *sole* justification for coercion.
          *   Legislators often give secular reasons too. If they *only* gave religious reasons, would it be okay? (Nuance).
      *   **Argument 4: The "Translation" Proviso.**
          *   Habermas/Bonhoeffer idea. Religious language needs translation for the public square.
      *   **Addressing the "What Should We Do?" Question:**
          *   Should we tighten legislators? (Harder, infringes on representation).
          *   Should we loosen judges? (Dangerous, undermines rule of law).
          *   Conclusion: The asymmetry is largely justified by the functional differences, *but* there are limits on legislators too (they can't just say "God said so" without any secular policy link).
      *   **The Elected vs. Appointed Factor:** It's not a red herring; it's crucial.

  4.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Intro:* Validate the asymmetry. It's real.
      *   *Public Reason:* Define it briefly. Reasons must be shareable.
      *   *The Legislative Case:* Why is it allowed? Because legislation is about *what ought to be*. Religion informs morality. Also, electoral accountability.
      *   *The Judicial Case:* Why is it forbidden? Because adjudication is about *what is the law*. Scripture isn't positive law. Also, counter-majoritarian difficulty (judges protect minorities against majority religious will).
      *   *Coherence:* Is it consistent? Yes, if you view the *source of authority* differently. Legislators draw authority from voters (who may be religious). Judges draw authority from the Constitution/Statutes (which are secular).
      *   *The "Sole Reason" Problem:* Note that even for legislators, *solely* religious justification is shaky in political philosophy (Audi's principle). But in practice, we tolerate it more.
      *   *Recommendation:* Don't loosen judges. Maybe ask more of legislators, but don't gag them. The asymmetry holds.
      *   *Elected vs. Appointed:* Crucial. Consent of the governed.

  5.  **Refining the Philosophical Nuance (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "Law says X." The user asked for *philosophy*, not law.
      *   *Nuance:* Distinguish between *motivation* and *justification*. A legislator can be motivated by faith but must justify with public reasons? Or is the vote itself the justification?
      *   *Rawls's "Proviso":* Rawls allows religious comprehensive doctrines in public political discussion *provided* that in due course, proper political reasons are presented. This fits the legislative floor debate well.
      *   *Judicial Restraint:* Dworkin's "Law as Integrity." Judges fit decisions into the existing web of legal principles, not external moral/religious systems.

  6.  **Final Polish:**

      *   Ensure tone is respectful and analytical.
      *   Check that all parts of the prompt are answered (Theory? Coherent? What to do? Elected vs. Appointed?).
