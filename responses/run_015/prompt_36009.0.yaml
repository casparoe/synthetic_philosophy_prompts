answer: |-
  "So, are we signing off on MyoGen for the dystrophin cohort?" Marcus asked, stirring sugar into his espresso. He looked tired; the committee meeting had run late.

  Elena nodded, tapping her pen against her notebook. "Yes. Restoring muscle function to baseline is core medicine. But we deny it for the rowing team."

  "Same molecule, Elena," Marcus said, leaning forward. "In the dystrophin kids, it brings them to the 50th percentile. In the rowers, it pushes them to the 99th. But take a healthy kid with mediocre endurance—say, 40th percentile. If MyoGen brings them to 60th, is that therapy or enhancement? You're drawing a line based on where they start, not what the drug *does*."

  "It's about the *telos* of the intervention," Elena countered. "In the first case, we're repairing a broken mechanism. In the second, we're upgrading a functioning one. The moral weight lies in the attitude toward the given body. Healing accepts limits while mitigating suffering; enhancement rejects limits as obstacles to be overcome."

  "Okay, but 'given' is doing a lot of heavy lifting there," Marcus said. "You're grounding 'normal functioning' in species-typicality. But that's just a statistical average. Why is the median human capacity morally sacred? If I'm born with naturally low endurance, that's just bad luck, same as muscular dystrophy. Why is fixing bad genetics therapy, but fixing bad luck enhancement?"

  "Because medicine isn't about eliminating all bad luck," Elena said. "It's about restoring agency where pathology has removed it. There's a difference between a wall blocking your path and the ground being uneven. MyoGen removes the wall for the dystrophin patient. For the rower, it's building a ramp over the ground everyone else has to walk on."

  "But the drug doesn't know the difference," Marcus pressed. "Biologically, the mechanism is identical. You're saying the morality is entirely extrinsic to the act. And if that's true, the line collapses under pressure. What if I give the dystrophin kid a slightly higher dose? They're still below the 99th percentile, maybe only 80th. Is that therapy? Or have you crossed into enhancement because you exceeded 'normal'?"

  Elena sighed, rubbing her temple. "I'll concede the border is fuzzy. That doesn't mean the center isn't clear. We don't abolish the concept of 'daytime' because dusk is ambiguous. Restoring species-typical functioning is a coherent goal. Exceeding it is a different project entirely."

  "Fine, fuzzy borders," Marcus said. "Let's talk sports. If MyoGen is safe and cheap, why ban it? If we let the dystrophin kids use it to compete, we acknowledge the drug isn't inherently unfair. It's only unfair because most people don't have it. But if the NHS covers it, everyone *could* have it."

  "Because sport isn't just about output," Elena said. "It's a test of natural talent and discipline. If we allow MyoGen, sport becomes a test of who tolerates the biochemistry best. We lose the connection to the human struggle."

  "So the dystrophin kid struggles less?" Marcus shot back. "You're saying their victory is less meaningful because their biology was assisted. That feels ableist, Elena. You're protecting the 'purity' of the sport at the cost of inclusion."

  "I'm protecting the meaning of the contest," she said. "If everyone takes it, it's not enhancement, it's just the new baseline. But that leads to coercion. Think about parents. If MyoGen is covered for therapy, parents will demand it for healthy kids to keep them competitive. 'Why wouldn't you give your child the best start?' It turns childhood into an arms race."

  "Coercion is a social problem, not a moral fact about the drug," Marcus argued. "We regulate pressure in education and extracurriculars all the time. We don't ban tutors because rich kids buy more of them. If MyoGen makes people healthier and more capable, withholding it because you're worried about parental anxiety seems paternalistic. You're prioritizing a philosophical commitment to 'the given' over actual welfare."

  "Welfare isn't just capacity," Elena said. "It's also about how we value ourselves. If we treat our bodies as projects to be optimized, we lose the ability to accept ourselves when optimization fails. That's the Sandel point, I know, but it's not just hand-waving. It changes the social ethos. If we fund MyoGen for enhancement, we signal that being merely human is insufficient."

  "And if we deny it," Marcus countered, "we signal that suffering from bad genetics is noble, but fixing it is suspect. Look, I agree we shouldn't force parents to enhance. But making it unavailable because *some* might feel pressured? That punishes the individual for a structural issue. And you still haven't answered the statistical point. 'Species-typical' changes. Average height has gone up. Is treating a short kid therapy now because they're below average, but enhancement in a century when everyone is taller?"

  "Height isn't functioning," Elena said. "Endurance is. But look, I hear you. The statistical line is imperfect. But it's the best proxy we have for 'health' versus 'improvement.' Without it, medicine becomes consumerism."

  "Medicine is already consumerism," Marcus said dryly. "Lasik isn't therapy, it's lifestyle. We cover it anyway because people value it. MyoGen is safer than Lasik. Why is your moral line tracking a metaphysical idea of 'nature' instead of harm and benefit?"

  "Because harm isn't just side effects," Elena said. "It's the erosion of solidarity. If we enhance, we widen the gap between the enhanced and the unenhanced. Even if the NHS covers it, there will be black market doses. The 99th percentile becomes the new 50th, and those who can't access the higher doses fall behind."

  "So regulate the doses," Marcus said. "Don't ban the category. You're letting the perfect be the enemy of the good. You want to keep the line because it feels morally tidy, but in practice, it just denies healthy people benefits because you're worried about what it says about the human condition."

  "And you want to erase the line because it's inconvenient," Elena said, closing her notebook. "But if we erase it, we lose the special status of healing. We become mechanics instead of doctors."

  "Maybe doctors need to be mechanics sometimes," Marcus said, standing up. "People want to run faster. Whether that's 'given' or 'made' doesn't matter to their knees."

  "It matters to us," Elena said. "Otherwise we're just service providers."

  "Maybe that's all we are," Marcus replied. He left his cup on the table. Elena stared at the steam rising from her tea, neither of them feeling like they'd moved the other an inch.
