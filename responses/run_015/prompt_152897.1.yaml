answer: |-
  Here is the breakdown of the logical and moral terrain you are walking on, followed by the committed verdict you asked for.

  ### The Menu of Readings

  When your flatmate said "glass houses," she was invoking a principle about **moral standing**. In philosophy, this is distinct from the truth of the claim. We can separate the readings into four distinct categories, ranging from the logically trivial to the socially substantive.

  1.  **The Logical Reading (Tu Quoque):** This claims that your hypocrisy makes your statement *false*. (i.e., "Fast fashion isn't actually bad because you bought a jacket.")
      *   *Verdict:* **False.** The environmental/ethical cost of Shein exists independently of your purchasing habits.
  2.  **The Credibility Reading:** This claims that your hypocrisy makes you *unbelievable*. (i.e., "We can't trust your judgment because you don't follow it.")
      *   *Verdict:* **Trivial.** Obviously, people trust consistent actors more. But your flatmate likely believes fast fashion is cheap/useful; she isn't confused about the facts, she is offended by the tone.
  3.  **The Relational Standing Reading:** This claims that blaming is a social transaction that requires equality. To blame someone is to say, "We both accept this norm, I uphold it, you violated it." If you violate it, you claim an unearned superiority.
      *   *Verdict:* **Substantive.** This explains why the interaction felt like an attack rather than a correction.
  4.  **The Global Bankruptcy Reading:** This claims that once you violate a norm, you lose the right to enforce it *ever again*, with anyone.
      *   *Verdict:* **False.** This leads to moral silence. If I steal a candy bar, I don't lose the right to tell my child not to steal cars.

  ### The Commitment

  I am committing to **Reading 3: The Relational Standing Reading**.

  In ordinary use, "people in glass houses" is not a claim about the truth of the proposition (fast fashion is bad); it is a claim about the **entitlement to blame**. Blaming is not just describing a fault; it is a speech act that presupposes the speaker has "clean hands" regarding the specific norm being invoked. When you blame your flatmate while secretly violating the norm, you are not just criticizing her choice; you are implicitly positioning yourself as morally superior to her. Since that superiority is false (you are in the same boat), the blame functions as an insult.

  **Does her objection work?**
  **Yes.** Your hypocrisy stripped you of the standing to blame her *in that moment, in that manner*. You attempted to enforce a norm you were actively subverting.

  **Do you owe her an apology?**
  **Yes.** Not for believing fast fashion is bad, and not necessarily for buying the jacket (that's your business). You owe her an apology for **presuming a moral superiority you did not possess.** You attacked her for a failure you were actively committing. That is an unfair relational dynamic.

  ### Testing The Cases

  **Case 1: The Saint Housemate (Never tempted)**
  Under the Relational Standing Reading, the Saint *does* have standing. Your intuition that this feels "backwards" confuses *standing* with *empathy*. The Saint has the right to say "This is wrong" because they uphold the norm. However, their advice might be *unhelpful* or *naive* because they lack experience with the struggle. But "unhelpful" is not the same as "hypocritical." You felt you lacked standing because you were violating the norm; the Saint does not violate it. The slogan protects the Saint, not you.

  **Case 2: The Repentance (Caught and punished beforehand)**
  If you had been caught, confessed, and discarded the jacket *before* dinner, you would likely **regain standing**. Why? Because standing is about your current relationship to the norm. By punishing yourself and acknowledging the violation, you re-align yourself with the norm ("I agree this is wrong, I messed up, I fixed it"). You are no longer claiming superiority; you are a fellow struggler who just stumbled. Hypocrisy requires *concealment* or *unacknowledged violation*. Once acknowledged, the "glass house" is repaired.

  **Complaining Behind Her Back**
  This is **worse**. Blaming to her face allows for immediate defense and dialogue. Complaining to a third party while hypocritical combines a lack of standing with cowardice. It turns the blame into gossip rather than norm-enforcement. It solidifies the "unearned superiority" because you are trying to recruit allies against her without risking your own reputation.

  ### Contestable Assumption Flag
  My answer rests on the assumption that **blaming is a communicative act that requires authority**, not just a statement of fact.
  *   *Alternative View:* If blaming is merely "pointing out a negative fact," then hypocrisy is irrelevant (Reading 1).
  *   *Impact:* If you hold this alternative view, then your flatmate is wrong, and you owe no apology. However, this view fails to explain why human beings universally react with anger to hypocritical blame. We react angrily because we sense the unfairness of the hierarchy, not the falsity of the fact. Therefore, the "authority" assumption is the one that matches human psychology.

