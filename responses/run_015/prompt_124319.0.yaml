answer: |-
  Here are the desiderata for an interpretation of Machiavelli's *fortuna* and *virtù*, structured to meet your stipulation that the reading must serve as **ex ante guidance for an agent who must act now**.

  ### I. The Desiderata

  #### 1. The Ex Ante Operability Constraint
  *   **The Case:** Your stipulation requires that an agent can identify *virtù* before the outcome is known. Many interpretations define *virtù* functionally as "that which succeeds against *fortuna*." This renders *virtù* a post-hoc label for luck, useless for decision-making.
  *   **The Requirement:** The interpretation must define *virtù* as a set of identifiable dispositions, calculations, or actions that can be recognized and enacted *prior* to the resolution of events. It must provide a heuristic for the agent to say, "I am acting with *virtù* now," even if I might still fail.
  *   **Status:** **Non-Negotiable.** (Directly derived from your purpose stipulation).

  #### 2. The Causal Independence Constraint (The Arithmetic)
  *   **The Case:** Machiavelli states *fortuna* is arbiter of half our actions. If *virtù* is merely the choice of means toward ends supplied by *fortuna*, the agent has no control over the *telos*, only the technique. If *virtù* is an independent causal factor, the agent must know where their agency begins and *fortuna's* ends.
  *   **The Requirement:** The interpretation must specify the boundary of agency. It must adjudicate whether *virtù* is a substantive causal power (able to alter the probability of outcomes independently) or a procedural competence (optimizing means within fixed constraints). If the latter, it must explain what advice survives when the ends are hostile.
  *   **Status:** **Non-Negotiable.** (Without this, the "50%" claim destroys the possibility of planning).

  #### 3. The Temporal Phasing Constraint (The River)
  *   **The Case:** The river metaphor distinguishes between building dikes in calm times (*ozio*) and resisting the flood in crisis (*necessità*). It further notes that works protecting one city wreck another. An interpretation that treats *virtù* as a single mode of action (e.g., "always be bold") ignores this phasing.
  *   **The Requirement:** The interpretation must distinguish between *preparatory virtù* (structural, long-term, institutional) and *reactive virtù* (improvisational, crisis management). It must offer criteria for an agent to diagnose which phase they are in, as the prescribed action differs radically.
  *   **Status:** **Preference.** (While vital for accuracy, a simplified "act now" guide could theoretically ignore the long-term preparation phase, though it would be impoverished).

  #### 4. The Stability-Flexibility Resolution (Conformity-to-the-Times)
  *   **The Case:** Machiavelli notes men hold to their modes while times change, leading to ruin. This creates a paradox: if *virtù* is a stable trait (e.g., prudence), it causes ruin when times shift. If *virtù* is pure flexibility, it is not a trait but a void.
  *   **The Requirement:** The interpretation must decide whether *virtù* is a specific character type (e.g., the lion or the fox) or a meta-capacity (the ability to switch between lion and fox). It cannot claim both without explaining the mechanism of switching.
  *   **Status:** **Non-Negotiable.** (An agent cannot act on a contradiction. They must know whether to cultivate a specific habit or a meta-skill).

  #### 5. The Failure Compatibility Constraint (The Hard Cases)
  *   **The Case:** Cesare Borgia possessed *virtù* but fell due to illness and his father's death. Julius II succeeded because his impetuosity matched the times. If *virtù* guarantees success, Borgia lacked it. If Borgia had it, *virtù* does not guarantee success.
  *   **The Requirement:** The interpretation must explain how an agent can possess *virtù* and still fail. It must decouple the *possession* of *virtù* from the *achievement* of the goal. Furthermore, regarding the "Fortune is a Woman" metaphor: the interpretation must declare if "beating/bolding" her is a universal rule (load-bearing) or context-dependent (decoration). If it is a rule, it conflicts with the "fit the times" requirement; the interpretation must resolve this.
  *   **Status:** **Non-Negotiable.** (If failure proves lack of *virtù*, the concept is useless for an agent facing high risk).

  #### 6. The Scalability Constraint (The Institutional Level)
  *   **The Case:** The *Discourses* suggest republics outlast princes because they contain diverse citizens who can match diverse times. Individual *virtù* is rigid; collective *virtù* is flexible.
  *   **The Requirement:** The interpretation must state whether advice for the individual prince is continuous with or distinct from advice for the legislator of a republic.
  *   **Status:** **Preference.** (This is a prejudice of the republican reader. If your purpose is individual action *now*, the institutional longevity of a state may be secondary).

  ---

  ### II. The Exclusionary Claim

  **The single requirement that excludes the largest number of interpretations is: #1, The Ex Ante Operability Constraint.**

  **Reasoning:** The dominant strain of Machiavelli scholarship (particularly the "Straussian" and certain "Cambridge School" readings) treats *virtù* as a retrospective judgment or an aesthetic quality of greatness recognizable only in the historical aftermath. Many interpretations argue that Machiavelli is describing *what worked*, not prescribing *what to do*. Some argue that *virtù* is inherently tied to glory, which requires success; therefore, if you fail, you lacked *virtù*.

  By demanding that an agent be able to identify *virtù* **in advance of the outcome**, you eliminate:
  1.  **Success-Theories:** Any reading where *virtù* = "winning."
  2.  **Historicist Readings:** Any reading where *virtù* is only intelligible within a completed historical narrative.
  3.  **Ironist Readings:** Any reading suggesting Machiavelli is secretly warning us that *virtù* is impossible to calculate.

  This constraint forces the interpretation to be **technical and procedural** rather than **teleological or aesthetic**.

  ---

  ### III. The Tension Resolution

  **The Conflict:** There is a direct tension between **Requirement #1 (Ex Ante Operability/Action-Guiding)** and **Requirement #4 (Stability-Flexibility/Situation-Relative)**.

  *   **Action-Guiding** demands general rules or stable traits that an agent can apply immediately (e.g., "Be bold," "Calculate risk").
  *   **Situation-Relative** demands that the right action depends entirely on the *qualità de' tempi* (quality of the times), which is fluid and often opaque.

  If *virtù* is purely fitting the times, there is no stable rule to guide action *now* because you cannot know the times until they have passed. If *virtù* is a stable rule, you will fail when the times change (the "Conformity" problem).

  **Which Should Give Way?**
  **The Situation-Relative requirement must give way to the Action-Guiding requirement.**

  **Justification:**
  Your stipulated purpose is **guidance for an agent who must act now**. This is the master constraint. If an interpretation concludes that "one can only know if one acted with *virtù* after the times have revealed themselves," it fails your purpose entirely. It renders the agent paralyzed.

  **The Synthesis:**
  To satisfy the Action-Guiding requirement without lying about the Situation-Relative nature of reality, the interpretation must define *virtù* not as a specific action (e.g., "attack"), but as a **procedural discipline of diagnosis**.

  *   *Virtù* becomes the rigorous practice of assessing the *qualità de' tempi* **before** acting.
  *   The "rule" is not "be impetuous," but "diagnose whether the times require impetuosity or caution, and force yourself to match them."
  *   Regarding the "Fortune is a Woman" metaphor: It must be read as a **default heuristic for uncertainty**. When the times are opaque (which they usually are), the agent is guided to be bold. When the times are clearly structured (the river in calm), the agent is guided to build dikes.

  **Verdict:** An interpretation that claims *virtù* is unknowable until after the fact is inadmissible for your purpose. An interpretation that claims *virtù* is a fixed set of actions (always be bold) is also inadmissible (as it ignores the River/Conformity constraints). The only admissible interpretation is one that treats *virtù* as a **repeatable method of situational assessment** that can be executed *ex ante*, even if the *outcome* remains subject to the 50% arbitrament of *fortuna*.
