answer: |-
  Distinguished horologists, philosophers, welcome to "Repair and Emergence." We gather between the bench and the lectern, united by the broken object before us and the shared necessity of making it whole. To navigate this workshop, we must wield Daniel Dennett's distinction between cranes and skyhooks as our structural spine.

  A skyhook is a miracle—a mysterious force lowering complexity from above. We reject this outright. There is no vital essence animating these gears, no phantom designer whispering to the mainspring. The clock is not alive. However, we must equally guard against greedy reductionism. To claim this mechanism is *nothing but* brass atoms interacting via electromagnetism is to erase the very reality we are here to restore.

  Consider the anchor escapement calibrated for sidereal tracking. Viewed through the lens of greedy reductionism, the difference between sidereal and solar time vanishes; there is only metal touching metal. There is no error in physics, only configuration. Yet, when I restore this clock, I do not merely align atoms. I align intention. If I adjust this escapement for solar time, the clock becomes "broken" relative to the stars, though physically intact. That misalignment is not a mystical failure, nor is it a physical impossibility. It is an emergent fact that exists only at the level of the whole system interacting with the cosmos.

  For the horologist, ignoring this reduces you to a mere technician of matter, unable to distinguish a functioning clock from a paperweight. For the philosopher, invoking a skyhook renders you irrelevant to the bench, speaking of functions that cannot be filed or measured. Purpose here is not a skyhook hanging above the mechanism; it is a crane built from the ground up, stabilized by the relationship between parts and world. If you dismiss purpose as illusion, my craft becomes unintelligible. Why file a tooth? Why oil a pivot? If there is no "time" to keep, there is only rearrangement. But if you invoke a soul of the machine, you blind yourself to the friction that actually stops the wheel.

  We must walk the line. We must see the crane of physical causality without ignoring the emergent architecture that makes a clock a clock. Repair is the act of reconciling the brute matter with the emergent function. Let us begin not by asking what this object *is*, but by asking what it *does*, and how that doing emerges from the doing of its parts. In this room, there are no miracles, but there is meaning. Let us get to work.
