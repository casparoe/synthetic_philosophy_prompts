answer: |-
  You are diagnosing the pathology of the argument correctly, but I think you are underestimating how deeply bedrock the priors are. This isn't just a verbal dispute about definitions, and it isn't purely substantive in the sense that new data will solve it. It is a clash between two different ontological commitments regarding what a grave *is*.

  Here is the breakdown of why you are stuck, why your flatmate's "rule" is doing heavy lifting, and whether there is actually a way out.

  ### 1. Is your hypothesis right?
  **Yes, but with a caveat.**
  You are correct that three variables are sliding into each other:
  1.  **Labor invested** (the cost of the funeral).
  2.  **The Claim** (what the mourners are asserting about the deceased/lineage).
  3.  **The Standing** (the deceased's actual political/economic power while alive).

  Processual archaeology (your flatmate's lineage) assumes these three are tightly coupled. If you have the labor, you had the standing, and the claim is true.
  Post-processual/Practice theory (your lineage) assumes these are loosely coupled. The claim might be aspirational, fraudulent, or traditional, bearing little relation to the standing or the actual labor cost (which might be subsidized by the community).

  **The Caveat:** You suggest this is an *empirical* question about a particular society ("how tightly are those coupled?"). It isn't. It is a methodological axiom. You cannot empirically test the coupling without independent access to variable #3 (Standing), which is exactly what you are trying to infer. Therefore, you are both arguing from priors about human behavior, not from data.

  ### 2. What does each side actually rely on? (The Bedrock Priors)

  **Your Flatmate (The Structuralist/Processual Prior):**
  *   **Relies on:** The Principle of Correlation. He assumes that social structures leave material signatures that are statistically recoverable.
  *   **The "Rule":** "Presence, frequency, covariance." This is a simplified Saxe-Binford approach. It assumes that if a trait is restricted (frequency), distinct (presence), and matches other status markers like house size (covariance), it reflects a structural reality (heritable office).
  *   **Blind Spot:** He treats the 200-year lag as "noise." This is the weakest point in his armor. In systems theory, a 200-year lag between the economic base (houses) and the ideological superstructure (grave goods) is not noise; it is data. It suggests the *symbol* of power became detached from the *source* of power.
  *   **Why he won't move:** To admit the lag matters is to admit that burial data reflects *memory* and *ideology* more than *institution*. That collapses his ability to read "property" directly off the grave.

  **You (The Agency/Performance Prior):**
  *   **Relies on:** The Principle of Mediation. You assume the grave is a text written by the living, not a biography of the dead.
  *   **The Strength:** You account for the subadults (who couldn't earn the status) and the lag (ideology persisting after the institution dies).
  *   **Blind Spot:** If *everything* is performance and ideology, inference becomes impossible. If the grave goods tell us only about the mourners' anxiety or aspiration, can we say anything about the society's structure at all? Radical skepticism leads to the "third position" (go home).
  *   **Why you won't move:** You rightly suspect that "heritable property" is a specific legal category that requires more than differential treatment to prove.

  ### 3. The Calibration Case: Is he right?
  **He is wrong, but strategically.**
  He claims calibration cases (where we have graves + documents) only exist for church/state periods, so they are tainted. This is a defensive maneuver.
  *   **Counter-evidence:** Early Medieval Europe (Merovingian/Carolingian) has furnished burial *and* law codes regarding inheritance/status before full church standardization. Roman Republican tombs overlap with epigraphic and legal records of *gens* and property. Etruscan tombs overlap with some external accounts.
  *   **The Real Problem:** Even in those cases, the correlation is messy. We find "kings" in graves who aren't in the records, and recorded elites with modest graves. The calibration cases actually support *your* position: mortuary treatment is an unreliable proxy for legal status.
  *   **Why he says this:** He knows that if he admits the calibration cases are valid, the data might not support his rule. If he says they are invalid, he protects his method from falsification.

  ### 4. What would count as progress?
  You will be having this argument in ten years unless you change the question. The question "Is this heritable property?" is a binary trap.

  **Progress looks like shifting from "What is it?" to "What does it do?"**
  Instead of asking if the axe proves property, ask: *What work does the axe do in this specific context?*
  *   **The Lag:** The fact that the package continues 150 years after the houses are abandoned is the key. It suggests the "axe-and-cattle" complex became a *trademark* of a group identity that outlasted the economic dominance of the big houses. Perhaps the "big houses" collapsed, but the lineage claimed legitimacy through the *memory* of the houses, enacted through the graves.
  *   **The Subadults:** This doesn't prove inherited *office* (you can't inherit a job you can't do), but it does prove inherited *identity*. Whether that identity equates to "property institution" is a semantic leap.
  *   **The Skeletal Data:** The lack of workload markers is crucial. If the "elite" kids show no stress markers but the "common" kids do, you have biological evidence of differential life conditions. If *no one* shows stress markers, it's purely ritual. If the "elite" kids show *more* stress (ritual burden?), that changes the story.

  ### 5. The Verdict
  You are right that this is a dispute about **lag and coupling**.
  *   **He** assumes material culture tracks social reality in near real-time.
  *   **You** assume material culture tracks social memory and ideology, which have their own temporalities.

  **Who wins?**
  In the specific case you described (200-year lag, goods outlast houses), **you win on the evidence.**
  A property institution is defined by the control of resources. If the resources (the big houses) are gone, but the grave goods continue, the goods are no longer signaling control of *that* resource. They are signaling lineage, nostalgia, or a claim to legitimacy in a changed world. Calling that a "heritable property institution" is anachronistic. It's a "heritable prestige claim."

  **How to stop the fight:**
  Tell him you agree that there is inherited *status* (the subadults prove that), but you disagree that status equals *property institution* (the lag proves the decoupling of wealth and ritual).
  *   **His win:** He gets to say "Social stratification is visible."
  *   **Your win:** You get to say "The specific legal/economic institution is not legible."

  If he insists that "status" and "property institution" are the same thing, then it is indeed a verbal dispute, and you should buy a bottle of wine and agree to disagree about semantics. But if he insists the *economic* institution is readable despite the 200-year disconnect from the economic infrastructure, he is violating the basic archaeological principle of context.

  **Recommendation:** Don't look for calibration cases. Look at the **biography of the objects**. If the copper axes in the later graves are worn, curated heirlooms, that supports your "ideological memory" thesis. If they are fresh casts made 150 years after the houses fell, that supports his "ongoing institution" thesis. That is an empirical test you can actually run.
