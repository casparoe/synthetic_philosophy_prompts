prompt: |-
  Hey, act as a philosophy of ethics researcher who also knows a bit about philanthropic institutions, and please think carefully—maybe start with a quick brainstorm—before you answer. I want you to compare the institutional critique of effective altruism with the measurability-bias critique. The institutional one worries that EA centralizes real power in wealthy donor-advised boards and tech-adjacent foundations, making large-scale giving less democratic and more opaque. The measurability-bias one says the movement overvalues interventions that spit out clean numbers—like bednets distributed per dollar—and systematically undervalues messy, long-horizon work like institutional reform or cultural change. Are these two objections really describing the same underlying flaw, maybe that quantification acts as a legitimation tool for centralized authority? Or do they pull in different directions? Specifically, if EA tried to adress the measurability problem by building richer metrics for institutional health and long-term outcomes, could that actually deepen the institutional problem by giving those same boards an even more expansive mandate? Dont just list parallels; work through whether they conflict, reinforce, or talk past eachother, and mention earning-to-give only if it genuinely helps clarify the comparison.
