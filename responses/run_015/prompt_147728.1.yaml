          4.  **Meta-Question:** Is this view insulated/unfalsifiable functionalism? Is it a substantive empirical claim or a restatement of functionalism? Is that a defect?

  2.  **Deconstruct the Position (The "Deflated Aunt Hillary" View):**

      *   *Core Claim:* The colony is the locus of intentional states (beliefs/desires).
      *   *Justification:* Explanatory power, multiple realizability (turnover), irreducibility (not just aggregate of ants).
      *   *Constraint:* No claim of consciousness/qualia. Purely functional/intentional.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the position. It's not "ants feel things," it's "ants implement a cognitive architecture whose variable bindings are colony-states."

      *   **Part 1: The Sympathetic Concessions (The "Awkward" Defeaters):**
          *   *Concession 1: Grain.* The colony's "thoughts" are incredibly slow and coarse-grained compared to human beliefs. "Food north" takes hours/days to form and act on.
          *   *Concession 2: Flexibility.* Colonies are brittle. Change the environment slightly, and the "belief" mechanism breaks in ways a human brain doesn't.
