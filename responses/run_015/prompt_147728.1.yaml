          *   *The Crucial Distinction:* In a brain, the *connection weights* change (learning). In a colony, the *rules* are fixed in the ants; the "state" is often just the distribution of ants. If the "software" is in the genes of the parts, the "system" isn't computing anything new; it's just unfolding genetic imperative.
          *   *Verdict:* If the colony doesn't store information *distinct* from the genetic programming of the ants + immediate physical traces, it's not a cognitive agent; it's a mechanical unfolding. This is the strongest redundancy charge. It's not just "shorthand"; it's that the *causal power* resides in the ant-genome/physics, not the "colony entity."

      *   **Part 3: Content Indeterminacy:**
