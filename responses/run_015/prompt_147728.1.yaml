          *   *The Trap:* If content is determined by evolutionary history, then the "belief" belongs to the *lineage*, not the current colony.
          *   *Impact:* This doesn't kill the view but forces it into "Derived Intentionality." The colony has beliefs only in the way a book has beliefs (derived from the author/evolution). This strips the "subjecthood" the user wants. The user wants the colony to be the *subject*, not the *medium*.

      *   **Part 4: The Four Cases:**
          *   *1. Queenless Survival:*
              *   *Verdict:* Still a colony/mind.
              *   *Embarrassment?* No. Brains survive neuron loss. But if they eventually dissolve, it shows the "self-maintenance" function is degraded.
              *   *Revelation:* Shows "mind" is a process, not a substance.
          *   *2. Fusion:*
              *   *Verdict:* Two minds merge into one? Or one dies?
              *   *Embarrassment:* High. If they share odor/network, functionalism says "one mind." But biologically, it's war or merger. If they merge seamlessly, it challenges the uniqueness of the subject.
              *   *Revelation:* Challenges the *boundaries* of the subject.
          *   *3. Bisection:*
              *   *Verdict:* One mind becomes two (fission).
