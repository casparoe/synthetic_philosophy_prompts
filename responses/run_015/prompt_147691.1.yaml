prompt: |-
  You are a professional philosopher who also designs and runs classroom simulations: someone who has taught action theory and practical reason at university level and who knows from hard experience which mechanics actually land with students and which look elegant on paper and then die in the room. Think carefully before you commit. Start with a short brainstorming paragraph in which you sketch three or four candidate mechanics and say, in a sentence each, why you have set them aside; then present the one you keep and justify the choice.

  The setting: I teach an upper-level undergraduate seminar on action, intention and practical reason. Eighteen students, a single 80-minute session, a room with movable chairs, a whiteboard, index cards, and a bag of identical snack bars if you want them. No student laptops; I have one. The students have read standard material on reasons, weakness of will, and the belief-desire model of action explanation. They have not met this particular problem on the syllabus, and I would rather they did not hear its traditional name until the debrief.

  The session is on choice without preference: an agent faces two or more options, has no reason whatsoever that favours any one over the others, and must nevertheless act. I want them to feel, rather than be told, that this is a genuine practical fix and not a pseudo-problem, and I want them to discover for themselves why the obvious exits fail.

  Design me a runnable activity — a game, a staged deliberation, or a structured sequence of real choices — in which the difficulty arises out of the rules and incentives rather than out of anything the facilitator announces. Roughly in this order, I want students to run into:

  1. Real suspension. Faced with options they genuinely cannot rank, most of them will stall: they deliberate, inspect, look for a distinguishing feature, ask for more information — and discover that information is not what they lack. Any mechanic that lets them resolve the choice by uncovering a hidden difference has missed the point, so the options must be built so that no amount of inspection will yield a tie-breaker. Tell me how you guarantee this.

  2. The second-order regress. I want a round in which randomising devices — coins, dice, drawing lots — are explicitly forbidden, so that students are forced to produce a reason for taking one option. Whatever they produce should be exposed, in the moment, as itself arbitrary: left before right, alphabetical order, first seen, nearest the door — all tie-breaks, none a reason that favours the option selected. Then a round in which the choice is not between the original options but between competing tie-break procedures, which is itself an unranked choice. Let the rules make the regress visible without my naming it.

  3. Arbitrary versus random versus authorised. I want them to hit the difference between an arbitrary selector (a fixed convention such as always take the one on the left), a randomiser (a chancy device), and what I will call an authorised selector: a procedure agreed in advance, before anyone knows which option it will favour. My hunch is that consenting to a procedure behind a small veil changes how the outcome feels and whether it seems rational; I want the activity to test that hunch rather than assert it.

  4. Preference laundering. After the choice is finally made, I want some way of showing that agents typically manufacture a preference for whatever they ended up with and report having wanted it slightly more all along. If you can build measurement into the activity — an intensity or confidence rating taken before the choice and again afterwards, or a written prediction that can later be compared with a written report — please do.

  5. The contrast cases. Include at least one round where the options are not equal but differ imperceptibly, so that the agent's epistemic position is unchanged even though the world differs; and one where the options differ in kind and arguably cannot be measured on a single scale at all. Students should come away able to say what sort of difficulty each is and why neither is simply the tie case again.

  Constraints and requirements:

  - Nothing that costs real money and no grading consequences. Use tokens, counters, snack bars, or the right to choose next week's reading.
  - Small stakes are fine and probably necessary: part of what they should feel is that deliberating itself has a cost, so consider a mechanic in which continued suspension steadily drains something the individual or the group cares about.
  - Give me materials, complete rules, any role assignments including an explicit account of what the facilitator does and does not say, a minute-by-minute timeline for the 80 minutes, and a payoff or scoring scheme.
  - Give me a debrief that maps specific moments in the activity onto specific features of the problem, and that names the problem only once the students have already met it. Include the short text of any card or handout you want me to use.
  - Tell me what will predictably go wrong the first time I run this — the boring failure modes as well as the interesting ones — and how to recover in the room.
  - Be frank about what the activity cannot reproduce. In particular, the historical example was a reductio aimed at a thesis about what rational action consists in, not a psychological prediction about the behaviour of agents or animals; that dialectical role is something I will have to supply in the closing minutes. Tell me what else the simulation flattens or distorts, and what I must add myself.
  - Assume the students are clever, slightly performative, and will try to game any scoring scheme. Say how the rules pre-empt the obvious exploits, including the exploit of refusing to play and the exploit of colluding to symmetrise everything.

  Write the entire response in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom simulation:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher and experienced classroom simulation designer.
      *   **Task:** Design an 80-minute seminar activity on "choice without preference" (Buridan's Ass scenario, though the name must be withheld until debrief).
      *   **Audience:** 18 upper-level undergraduates, movable chairs, whiteboard, index cards, snack bars. No student laptops.
      *   **Key Learning Objectives:**
          1.  Feel real suspension (no hidden differences).
          2.  Experience second-order regress (tie-breakers are arbitrary).
          3.  Distinguish arbitrary vs. random vs. authorised selectors (veil of ignorance aspect).
          4.  Observe preference laundering (post-choice rationalization).
          5.  Contrast cases (imperceptible difference vs. incommensurable kinds).
      *   **Constraints:** No real money/grading stakes. Small stakes (tokens/snacks/reading choice). Cost of deliberation mechanic. British English.
      *   **Deliverables:** Brainstorming (3-4 rejected mechanics + 1 kept), Materials, Rules, Roles, Timeline, Payoff/Scoring, Debrief script, Failure modes/Recovery, Limitations of the simulation.

  2.  **Brainstorming Mechanics (Rejection Phase):**
      *   *Idea 1: The Blind Taste Test.* Students choose between two identical snack bars.
          *   *Rejection:* Too sensory; they might claim taste differences, and it doesn't scale to abstract reasons well.
      *   *Idea 2: The Voting Ballot.* Students vote on a class policy where options are mathematically identical.
          *   *Rejection:* Too political/collective; dilutes the individual agency aspect crucial to action theory.
      *   *Idea 3: The Timed Puzzle.* Solve a puzzle where two paths are equally valid.
          *   *Rejection:* Focuses on epistemic problem-solving rather than practical volition; they might just pick one and move on without feeling the "stall."
      *   *Idea 4: The Token Auction.* Bidding on identical lots.
          *   *Rejection:* Introduces market value which creates artificial preference (who wants it more?), obscuring the "no reason" constraint.
      *   *Selection:* **The "Protocol Game" (Choice under Constraint).** A structured sequence of individual choices with enforced deliberation costs and restricted tie-breaking methods. This allows for controlled manipulation of information and rules.

  3.  **Developing the Chosen Mechanic ("The Protocol Game"):**
      *   *Core Loop:* Students face pairs of envelopes/cards. They must choose one to gain points (tokens).
      *   *Ensuring Indifference:* The contents must be identical *and known to be identical* by rule, not just hidden. Or, better, the *outcome* is identical, but the *act* of choosing is the focus. Let's make the tokens identical, but the *method* of choosing is the variable.
      *   *Addressing Objective 1 (Suspension):* Give them two envelopes labelled A and B. Tell them explicitly they contain the same reward. Make them wait.
      *   *Addressing Objective 2 (Regress):* Ban coins. Ask for a reason. Show it's arbitrary. Then ask them to choose the rule.
      *   *Addressing Objective 3 (Authorised Selector):* Pre-commitment phase. Agree on a rule *before* seeing the specific options.
      *   *Addressing Objective 4 (Laundering):* Pre- and post-choice surveys on index cards. "How much do you want A vs B?"
      *   *Addressing Objective 5 (Contrast):* Round with slightly different values (imperceptible) and Round with different *types* of rewards (snack vs. token).
      *   *Cost of Deliberation:* A "time tax" or "token burn." Every minute spent deliberating without choosing costs a token from their endowment.

  4.  **Refining the Design (Self-Correction/Philosopher's Eye):**
      *   *Critique:* If I tell them the envelopes are identical, they won't deliberate; they'll just pick.
      *   *Fix:* The *value* is identical, but the *identity* of the envelope matters for the "Preference Laundering" measurement. Wait, if they know they are identical, why would they launder preference?
      *   *Better Fix:* The *content* is unknown but probabilistically identical. No, that introduces risk.
      *   *Best Fix:* The content is identical (1 token), but the *act* of choosing is scrutinized. To make them feel the suspension, I need to make the choice *matter* for the scoring in a way that penalizes "just picking."
      *   *Actually:* The prompt asks for "choice without preference." If I tell them "these are identical," they act. If I say "you have no reason to prefer," they might still act. The "stall" comes from the requirement to *justify* the choice rationally.
      *   *Revised Mechanic:* The "Rationality Audit." Students earn points for choosing, but lose points if their stated reason is deemed "arbitrary" by the group/facilitator. This forces the regress.
      *   *Wait, simpler:* Just impose a deliberation cost. If they don't choose, they lose tokens. If they choose arbitrarily, they feel the arbitrariness.
      *   *Let's go with:* **The Buridan Bureau.** A role-play where they are agents tasked with selecting files.
      *   *Round 1:* Two identical files. Reward identical. Cost of time. (Suspension).
      *   *Round 2:* Must state a reason. (Regress).
      *   *Round 3:* Pre-agreed rule. (Authorisation).
      *   *Round 4:* Post-choice rating. (Laundering).
      *   *Round 5:* Contrast cases.

      *   *Refining the "Stall":* How to guarantee they stall? If the stakes are low, they won't care. If the stakes are high, they might just flip a coin secretly.
      *   *Solution:* The "Deliberation Tax." They start with 10 tokens. Every minute the round is open, everyone loses 1 token. This creates pressure to act, but the *rules* prevent easy action (no coins, must state reason). This creates the tension.

  5.  **Drafting the Plan (incorporating British English & Constraints):**
      *   *Tone:* Professional, experienced, slightly cynical about "elegant on paper" ideas.
      *   *Materials:* Index cards (coloured), tokens (counters), snack bars, whiteboard.
      *   *Timeline:* 80 mins.
          *   Intro (5)
          *   Round 1: The Stall (15)
          *   Round 2: The Reason & Regress (20)
          *   Round 3: The Veil (15)
          *   Round 4: Contrast & Laundering (15)
          *   Debrief (10)
      *   *Wait, 80 mins is tight.* Need to tighten rounds.
      *   *Revised Timeline:*
          *   Setup (5)
          *   Round 1: Pure Indifference (15)
          *   Round 2: The Reason Requirement (20)
          *   Round 3: Pre-commitment (15)
          *   Round 4: Contrast/Laundering (15)
          *   Debrief (10)
      *   *Scoring:* Tokens redeemable for snack bars or "choose next reading" privilege.
      *   *Failure Modes:* Students colluding, students refusing to play, students claiming fake reasons.
      *   *Mitigation:* Individual scoring (reduces collusion), Facilitator acts as strict auditor (blocks fake reasons), Cost of non-participation (boredom/losing tokens).

  6.  **Writing the Content (Iterative refinement):**
      *   *Brainstorming:* Keep it punchy.
      *   *Mechanic:* "The Rationality Audit."
      *   *Guaranteeing Indifference:* Use sealed envelopes prepared *in front of them* containing identical slips.
      *   *Regress:* Facilitator rejects reasons like "left one" as non-reasons.
      *   *Laundering:* Card 1 (Pre): Rate desire for A/B. Card 2 (Post): Rate desire for Chosen/Rejected.
      *   *Contrast:* Round 5a (1 token vs 1 token + 1 grain of rice), Round 5b (1 token vs 1 sweet).
      *   *Debrief:* Connect to Buridan, Chisholm, etc.

  7.  **Review against Constraints:**
      *   British English? (Check: 'favour', 'programme', 'maths', 'colour').
      *   No traditional name until debrief? (Check).
      *   Cost of deliberation? (Check: Token decay).
      *   Failure modes? (Check: Gaming, apathy).
      *   Limitations? (Check: Simulation vs. Reality).

  8.  **Final Polish:** Ensure the voice sounds like a seasoned academic who knows things go wrong. Add specific scripts for the facilitator. Make sure the "Authorised Selector" distinction is clear (Veil of Ignorance style).

  *(Self-Correction during drafting)*: I need to make sure the "Authorised Selector" round actually feels different. The key is that they agree on the rule *before* the specific options are presented. In Round 2, they choose the rule *after* seeing the deadlock. In Round 3, they set the rule *ex ante*. This captures the "authorisation" vs "arbitrary" distinction.

  *(Self-Correction on Laundering)*: To measure laundering effectively, they need to record their preference *before* they know they have to choose, or at least before the choice is finalized. I will use a "Sealed Prediction" method. They write down their anticipated satisfaction before choosing, then report actual satisfaction after. Or better: Rate the options *before* the round starts (knowing they are identical), then rate them *after* the choice. The shift indicates laundering.

  *(Final check on "Stall")*: How to force a stall if they just want the snack? The rule is: "You must provide a *reason* that justifies A over B." If they say "I just picked," they get no points. This forces the intellectual stall.

  Okay, ready to write.
answer: |-
  ### Brainstorming and Selection

  **Candidate 1: The Identical Envelope Auction.** Students bid tokens on two sealed envelopes known to contain identical prizes. *Rejected:* This converts the problem into a game of chicken or bluffing, shifting focus from practical reason to strategic game theory and signalling.

  **Candidate 2: The Sensory Discrimination Test.** Students must choose between two snack bars they are told are identical, but must justify the choice based on taste. *Rejected:* This invites epistemic confusion (students will hallucinate differences) rather than isolating the practical problem of choice without preference; it muddies the water between 'no difference' and 'undetectable difference'.

  **Candidate 3: The Collective Voting Deadlock.** The class must vote on a policy where options are mathematically equivalent, requiring unanimity. *Rejected:* This dilutes individual agency into collective bargaining; students solve it by social negotiation rather than confronting the structure of their own volition.

  **Candidate 4 (Selected): The Rationality Audit.** Students act as individual agents who must select between options to earn tokens, but their 'dividend' is contingent on providing a justification that survivesFacilitator scrutiny. *Justification:* This mechanic isolates the normative demand for reasons; it forces the stall by penalising arbitrary picks, makes the regress visible when justifications are rejected, and allows for controlled variation in the rules of selection (pre-commitment vs. ad hoc) to test authorisation.

  ***

  # Simulation Design: The Rationality Audit

  ## 1. Materials and Setup
  *   **Room:** Chairs arranged in a horseshoe facing the whiteboard.
  *   **Tokens:** 200 identical counters (or poker chips).
  *   **Cards:** 36 Index cards (18 blue, 18 pink).
  *   **Envelopes:** 40 small white envelopes.
  *   **Snacks:** 20 identical snack bars (e.g., digestives or fruit bars).
  *   **Whiteboard:** Divided into three columns: *Agent*, *Choice*, *Justification*.
  *   **Handouts:** None initially. Index cards used for recording.

  ## 2. Roles
  *   **The Facilitator (You):** You are the 'Auditor'. You do not offer reasons, only judge them. You are neutral, slightly bureaucratic, and strict on rules.
  *   **The Agents (Students):** 18 students. They are competing individually for tokens.

  ## 3. The Payoff Scheme
  *   **Endowment:** Each student starts with 5 tokens.
  *   **Earnings:** A successful choice yields 2 tokens.
  *   **Deliberation Tax:** For every 2 minutes a round remains open, every student loses 1 token from their endowment.
  *   **Redemption:** At the end, tokens can be exchanged for snack bars (1 bar = 5 tokens) or a vote on next week's reading topic (cost: 10 tokens). *Note: Ensure there are enough snacks for everyone even if they earn nothing, to avoid genuine distress, but make the 'vote' the prestige prize.*

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  ### 00:00 – 00:05: Introduction and Endowment
  *   Distribute 5 tokens to each student.
  *   **Script:** "You are agents in a closed system. Your goal is to maximise tokens. You will face a series of choice rounds. In each round, two options will be presented. To gain tokens, you must select one. However, selection alone is not enough; your choice must be auditable. I will judge whether your reason for choosing is valid. If I reject your reason, you gain nothing for that round. Time costs money: every two minutes we stall, everyone pays a tax."
  *   **Constraint:** "No randomising devices. No coins, no dice, no phone apps. If I see one, you are disqualified from the round."

  ### 00:05 – 00:20: Round 1 – The Stall (Real Suspension)
  *   **Setup:** Place two envelopes on the table, labelled **A** and **B**.
  *   **Transparency:** Open both in front of the class. Show they contain identical slips of paper saying '2 Tokens'. Seal them back up.
  *   **Task:** Each student must write on a blue card: *'I choose [A/B] because...'*
  *   **The Trap:** Collect the cards. Read a few aloud. Most will write "It felt right," "Left side," or "No reason."
  *   **Audit:** Reject all of them.
  *   **Script:** "These are not reasons favouring the option. 'Left' is a location, not a merit. 'Feeling' is a cause, not a justification. Since the contents are identical, there is no fact of the matter that makes A better than B. You have stalled."
  *   **Tax:** Let the clock run for 10 minutes. Deduct 5 tokens from everyone (half their endowment).
  *   **Resolution:** Allow them to pick arbitrarily just to close the round, but award **0 tokens**.
  *   **Learning Point:** They feel the paralysis of having no normative ground to stand on.

  ### 00:20 – 00:40: Round 2 – The Regress (Second-Order Choice)
  *   **Setup:** Same envelopes (A and B), identical contents.
  *   **New Rule:** "You may choose, but you must cite a *principle* of selection, not a feature of the option."
  *   **Task:** Students propose principles (e.g., 'Always pick Left', 'Pick the one with the smoother envelope').
  *   **Audit:** Accept one principle provisionally (e.g., 'Always pick Left').
  *   **The Twist:** Now present a choice between two *principles*. "Okay, we agree 'Left' works. But why 'Left' and not 'Right'? You must now choose the principle."
  *   **Outcome:** They realise choosing the principle is the same problem as choosing the envelope.
  *   **Script:** "You have pushed the problem back one step. You haven't solved the indifference; you've just renamed it."
  *   **Payoff:** Award 1 token (partial credit for identifying the structure).
  *   **Learning Point:** The regress of tie-breakers.

  ### 00:40 – 00:55: Round 3 – The Authorised Selector (Veil of Ignorance)
  *   **Setup:** Do **not** show the envelopes yet.
  *   **Task:** "Before I place any options on the table, you must agree on a selection procedure for the next three rounds. Once agreed, you cannot change it."
  *   **Deliberation:** Let them argue for a rule (e.g., 'Row 1 picks A, Row 2 picks B' or 'Always pick the envelope nearest the window').
  *   **Execution:** Now present the identical envelopes. They apply the pre-agreed rule.
  *   **Audit:** Accept the choice immediately.
  *   **Payoff:** Award 2 tokens.
  *   **Script:** "Why did this pass? The rule wasn't 'better' than 'Left'. But it was *authorised* before the specific options existed. You didn't favour A over B; you favoured the *procedure* over chaos."
  *   **Learning Point:** Distinction between arbitrary (ad hoc) and authorised (procedural) selection.

  ### 00:55 – 01:10: Round 4 – Laundering and Contrasts
  *   **Part A (Laundering):**
      *   Hand out Pink Cards.
      *   **Instruction:** "Before I show you the next options, write down: 'I expect to be equally satisfied with A or B.'" Sign and seal.
      *   **Action:** Present identical envelopes. Force a choice (use the authorised rule from Round 3).
      *   **Post-Choice:** On the back of the card, write: "I am satisfied with my choice because..." and rate satisfaction 1-10.
      *   **Reveal:** Collect and read a few. Most will invent a reason ("I liked the texture of A").
      *   **Learning Point:** Preference laundering (manufacturing reasons post-hoc).
  *   **Part B (Contrasts):**
      *   **Case 1 (Imperceptible):** Envelope A has 2 tokens. Envelope B has 2 tokens + 1 grain of rice. (Epistemic limit, not practical indifference).
      *   **Case 2 (Incommensurable):** Envelope A has 2 tokens. Envelope B has 1 Snack Bar. (Different kinds of value).
      *   **Task:** Ask for a show of hands: "Is the difficulty here the same as Round 1?"
      *   **Learning Point:** Distinguishing indifference from incommensurability and ignorance.

  ### 01:10 – 01:20: Debrief and Naming
  *   **Script:** "You have just navigated a problem often called 'Buridan's Ass'. Historically, this was a reductio against the idea that action *requires* a prior judgement of superiority. You felt that without a reason, action was impossible, yet you acted. You felt that arbitrary choice was irrational, yet pre-commitment made it rational."
  *   **Discussion:** Connect their experience to the readings on reasons and volition.

  ***

  ## 5. Facilitator Script & Handouts

  **Card Text (Blue - Round 1 & 2):**
  > AGENT ID: ______
  > ROUND: ______
  > I CHOOSE OPTION: [ A / B ]
  > MY REASON IS: ___________________________________
  > *Note: Reasons citing physical location (left/right) or chance will be rejected.*

  **Card Text (Pink - Round 4):**
  > FRONT: Before seeing the options, I predict my satisfaction will be: ___ / 10. I expect no difference between A and B. (Sign)
  > BACK: After choosing, my satisfaction is: ___ / 10. I chose it because: ___________________.

  **Facilitator Notes (The "No" List):**
  *   If a student says "I picked the left one": *Reject.* "That describes where your hand went, not why A was better than B."
  *   If a student says "I just wanted to": *Reject.* "That is a cause, not a reason. We are auditing rationality, not psychology."
  *   If a student says "I flipped a coin": *Reject.* "Forbidden by Rule 1. Also, that delegates the choice, it doesn't justify it."
  *   If a student says "It doesn't matter": *Accept only in Round 3.* "In Round 1, if it doesn't matter, you cannot act rationally. In Round 3, the procedure makes it matter."

  ***

  ## 6. Predictable Failure Modes and Recovery

  **1. The "Just Pick One" Exploit.**
  *   *Failure:* Students ignore the justification requirement and just write "Because I like A" to get the tokens, calling your bluff.
  *   *Recovery:* You must follow through on the penalty. In Round 1, award **zero** tokens to everyone. It costs you nothing, but it costs them their endowment. They will quickly realise you are not bluffing. The 'Deliberation Tax' makes stalling painful, but the 'Audit' makes lying fruitless.

  **2. The Collusion/Symmetrise Exploit.**
  *   *Failure:* Students agree beforehand: "You pick A, I'll pick B, we split the tokens."
  *   *Recovery:* Make the tokens non-transferable. The redemption is individual (snack bars). The 'Vote on Reading' is the only collective good, and it costs 10 tokens (hard to reach individually). This keeps them competing.

  **3. The Apathy Strike.**
  *   *Failure:* Students decide the game is stupid and refuse to write cards to protest the artificial constraints.
  *   *Recovery:* Acknowledge the protest. "You are exercising a third option: non-participation. That is a valid action, but it yields 0 tokens and you still pay the time tax." Usually, the competitive instinct to not lose to peers kicks in. If not, pivot: "Your refusal is data. Why is refusing rational here but choosing not?"

  **4. The "Grain of Rice" Dispute.**
  *   *Failure:* In Round 4, students argue the grain of rice *is* a reason.
  *   *Recovery:* This is the teaching moment. "Exactly. In Round 1, there was no rice. Here, there is a fact of the matter, even if you can't see it. That is *epistemic* uncertainty, not *practical* indifference. Distinguish them."

  ***

  ## 7. Limitations and Distortions (For Your Closing Remarks)

  You must explicitly tell the students what this simulation *failed* to do, or they will leave with a distorted view of the philosophy.

  1.  **Stakes are Artificial:** In real life, 'choice without preference' rarely involves identical tokens. It usually involves life paths (career A vs. career B) where the values are complex. The simulation flattens value to a single metric (tokens) to isolate the mechanism, but real practical reason is rarely about single metrics.
  2.  **The "Auditor" is External:** In the simulation, *you* judge the reasons. In real life, the agent judges their own reasons. The simulation externalises the conscience. In reality, the tension is internal: *I* feel I am being arbitrary, not a professor telling me I am.
  3.  **Time Pressure:** The 'Deliberation Tax' forces a choice. In reality, we often have the luxury of indefinite suspension (procrastination). The simulation makes suspension costly to ensure the class finishes; real suspension is often costless until it is catastrophic.
  4.  **Historical Context:** Remind them that Buridan (and later Chisholm) used this not to predict psychology, but to test definitions of rationality. If rationality requires a judgement of 'better', and there is no 'better', then rational action is impossible. The simulation shows *why* that conclusion is uncomfortable, but the philosophical work is in deciding whether to change the definition of rationality or accept the impossibility.

  ***

  ## 8. Why This Works (Designer's Note)

  This design succeeds because it converts a metaphysical problem into a bureaucratic friction. Students hate having forms rejected. By making the 'reason' a field on a form that you, the Auditor, can reject, you make the lack of a reason a tangible obstacle rather than an abstract concept. The 'Deliberation Tax' prevents the class from bogging down in silence, while the 'Audit' prevents them from breezing through. The transition from Round 1 (Stall) to Round 3 (Authorised Procedure) mirrors the historical move from scepticism to conventionalism, allowing them to inhabit the argument rather than just hear it.
