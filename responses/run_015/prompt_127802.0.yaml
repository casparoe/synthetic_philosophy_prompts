  1. The Villanelle

  Weight the worst, but leave the rest alone.
  Seven souls bound by a budget tight.
  No good is done when high are hewn to stone.
  Two starve below, four keep what is their own.
  One burns too bright within the moral light.
  Weight the worst, but leave the rest alone.
  The nine descends to five upon the throne.
  No coin transfers to ease the painful sight.
  No good is done when high are hewn to stone.
  The four stand static, neither lost nor grown.
  Pure waste remains within this zero night.
  Weight the worst, but leave the rest alone.
  The planner weighs the sum that he has shown.
  And finds the logic of the loss is right.
  No good is done when high are hewn to stone.
  Two cries persist, though one is overthrown.
  No wealth moves round to justify the flight.
  Weight the worst, but leave the rest alone.
  No good is done when high are hewn to stone.

  2. Commentary on Form and Philosophical Choices

  The first refrain ("Weight the worst...") articulates the prioritarian mandate: maximize moral value by prioritizing the deprived, even via concave transformation of welfare. The second ("No good is done...") voices the leveling-down objection: reducing inequality without Pareto improvement is intrinsically valueless. The villanelle's rigid structure forces these lines to recur without modification, mirroring the philosophical impasse. They converge in the final quatrain not to harmonize, but to stand adjacent, highlighting the incommensurability of weighted aggregation versus Pareto efficiency.

  The seven-agent scenario is not merely a framing artifact but exposes a genuine tension in telic prioritarianism. If the moral value function is sufficiently concave, reducing the high welfare of the +9 agent (to +5) can mathematically increase the weighted sum even if the -3 agents gain nothing, because the marginal moral value of the rich agent's welfare was negligible. However, this relies on the counterintuitive claim that destruction of welfare can be morally preferable to stagnation. The poem preserves this discomfort; the planner sees the math ("logic of the loss is right") but the human reality ("Two cries persist") remains unchanged. The form refuses to solve the dilemma, just as the theory cannot fully escape the objection without abandoning its core weighting mechanism.
