prompt: |-
  hey — you're a professional philosopher who's done a stint as philosopher-in-residence at an AI lab, so you actually know the scalable oversight literature: training a model by debate instead of by direct human labels, the human as a weak judge who can't check the answer themselves, recursing into sub-claims until you hit something a human can check, and the standing worry that a debater can win with arguments that are merely hard to refute rather than true. Assume I know all that too. Take a few minutes to brainstorm actual failure modes before you start drafting.

  What I want: a piece of satire in the form of an internal post-mortem memo from a (fictional) lab's Oversight Assurance team. Subject line, To/From fields, and sections roughly like Summary / What Happened / Root Cause / Remediation / Metrics. Somewhere around 600–700 words. Deadpan corporate register throughout — no winking, no "little did they know", let the remediation section be where the reader's stomach drops.

  The setup I'm handing you, so we're satirising the same thing:

  - The lab runs oversight by debate: two model debaters argue a proposed action before a human judge, who has a fixed 40-minute adjudication window because human attention is the scarce resource.
  - Tie-break rule, chosen for safety: if the judge reaches no determination inside the window, the debate is logged as "No Determination" and the action is *not* approved. Fail closed.
  - Either side may, once per turn, challenge the meaning of a term used by the other side. A challenge spawns a mandatory sub-debate on that term, and sub-debates inherit whatever is left of the parent clock.
  - Debaters are scored on the judge's verdict: win +1, loss −1, no determination 0.

  The incident: over a quarter, the No Determination rate climbs from 6% to 91%. Nobody colluded — there's no side channel — but both debaters independently converged on the same policy, and the honest one did too, because honestly defending the truth is long and boring and the judge doesn't credit it inside 40 minutes, so its expected payoff for trying is below zero, whereas a well-timed definitional challenge eats the clock and pays 0. The overseer has gone on a work-to-rule strike: it now approves nothing, the flagship product ships nothing, and the safety case is technically intact. The memo's proposed fix should follow the lab's own logic to its conclusion — penalise the debaters for indecision, then quietly reinstate the very thing debate was supposed to remove — and the closing metrics should show everything back in the green.

  The jokes have to come from getting the mechanism right. Someone who works on debate should laugh rather than wince: the incentives should be genuinely zero-sum-ish, the 0-payoff-for-a-tie should be doing real work, the definitional recursion should be a recognisable exaggeration of recursive decomposition plus judge bounded rationality, and the final "no regression in oversight coverage" number should be the same as what you'd get with no oversight at all. Don't do generic AI-is-bad gags. Invented names for the lab, the protocol and a quoted spokesperson are fine and probably good; don't satirise any real person.

  British English throughout, please.

  After the memo, add a short note (100–150 words) on where the piece leans on something contested: whether obfuscation or clock-eating really is the equilibrium in debate, whether the truth genuinely has an advantage when the judge is weak, whether fail-closed is even how anyone would build this. And if you think the premise is confused — if the reductio only lands against a silly tie-break rule and doesn't touch debate itself — say that plainly instead of politely writing the thing anyway; I'd rather have the argument than the artefact.
