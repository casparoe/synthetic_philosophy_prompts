answer: |-
  # The Logical Space

  Before the quiz, here is the geometry of the problem. We are sorting theories of letterform identity along three independent axes. Each axis is a binary choice derived from the edge cases you provided.

  1.  **Atomicity (Context):** Is the glyph's identity self-contained, or does it require neighbors to exist?
      *   *Atomic:* The glyph is an 'a' even in isolation.
      *   *Contextual:* The glyph is only an 'a' relative to the word it sits in.
  2.  **Grounding (System):** Is the identity defined by the mark's physical properties, or by its difference from other marks?
      *   *Positive:* It is an 'a' because of what it *is* (strokes, curves).
      *   *Negative:* It is an 'a' because of what it *is not* (not 'o', not 'u', distinct in the set).
  3.  **Temporality (Origin):** Is the identity defined by its current state, or by its history of production?
      *   *Synchronic:* It is an 'a' if it functions as one now.
      *   *Diachronic:* It is an 'a' if it descended from one, regardless of current function.

  This creates 8 logical cells ($2^3$). Below, I map the theoretical positions to these cells, note the empty ones, and then provide the decision tree (quiz) that navigates this space using your specific glyph cases.

  ### The Map of Positions
  *   **Cell 1 (Atomic, Positive, Synchronic):** Shape/Geometric Invariant.
  *   **Cell 2 (Atomic, Positive, Synchronic - Fuzzy):** Prototype Theory. *(Shares cell with Shape; distinguished by tolerance)*.
  *   **Cell 3 (Atomic, Negative, Synchronic):** Structural/Contrastive Role.
  *   **Cell 4 (Atomic, Negative, Synchronic - Embodied):** Perceptual/Motor Schema. *(Shares cell with Structural; distinguished by agent)*.
  *   **Cell 5 (Atomic, Positive/Negative, Diachronic):** Causal-Historical Descent.
  *   **Cell 6 (Atomic, Positive/Negative, Diachronic - Mental):** Designer Intention/Convention. *(Shares cell with Causal; distinguished by locus of cause)*.
  *   **Cell 7 (Contextual, Negative, Synchronic):** Deflationary Cluster/Usage.
  *   **Cell 8 (Contextual, Positive, Synchronic):** Contextual/Word-Shape Identity.

  ### Empty or Problematic Cells
  *   **Contextual + Diachronic:** (Identity depends on neighbors *and* history). *Status: Unexplored.* Theoretically possible (a word-shape that must have a specific lineage), but no major theory argues that context requires history.
  *   **Contextual + Positive + Diachronic:** *Status: Incoherent.* If identity relies on context, the history of the isolated mark is irrelevant.

  ---

  # The Decision Tree (README Quiz)

  *Instructions: For each pair of scenarios, choose the option that feels more "true" to how you would label the glyph in your generator's acceptance test.*

  **Q1. The Isolation Test**
  You generate a glyph that readers confidently call **a** inside the word "cat", but call **u** or "smudge" when shown alone.
  *   **A:** It is an **a**; the word context fixes the identity.
  *   **B:** It is a failure; a letter must stand alone.

  **Q2. The Transliteration Test**
  You show a glyph from a script the reader doesn't know, placed next to a table labeling it **a**. The glyph looks like a box.
  *   **A:** It is an **a**; the convention/table assigns the identity.
  *   **B:** It is a box; the shape overrides the label.

  **Q3. The Twin Test**
  You see a shape that is geometrically identical in a Latin text (where it is **a**) and a Cyrillic text (where it is **а**).
  *   **A:** They are the same letter; shape is the identity.
  *   **B:** They are different letters; the system defines the identity.

  **Q4. The Blackletter Test**
  In a blackletter font, the **a** looks more like the font's own **o** than it looks like a sans-serif **a**.
  *   **A:** It is an **a**; within-font contrast matters more than cross-font similarity.
  *   **B:** It is questionable; if it looks like an **o**, it risks failing the universal shape check.

  **Q5. The Story Test**
  You accept both the double-story **a** (print) and single-story **ɑ** (hand) as valid **a**s. Why?
  *   **A:** They share a common functional core despite surface differences.
  *   **B:** They are both accepted because we have seen them used as **a** too often to reject either.

  **Q6. The Smudge Test**
  An **a** printed on a page gets wet; the ink bleeds until the closed counter opens and it looks exactly like a **u**.
  *   **A:** It is now a **u** (or garbage); the current visual state rules.
  *   **B:** It is still an **a**; it was printed as an **a**.

  **Q7. The Chain Test**
  A scribe copies an **a**, then that copy is copied, 50 times, until the last version is a perfect circle (**o**).
  *   **A:** It is an **o**; the chain ended in a new shape.
  *   **B:** It is an **a**; the lineage never broke, even if the shape drifted.

  **Q8. The Rogue Test**
  Your generator outputs a glyph that satisfies every stroke and grid rule for **a**, but no human reads it as **a**.
  *   **A:** The generator failed; readability is the only rule that matters.
  *   **B:** The generator succeeded; the rules define the letter, humans are just noisy decoders.

  **Q9. The Logotype Test**
  A designer draws an apple and labels it **a** in a logo. A generator makes a rule-compliant **a** that looks like a mistake.
  *   **A:** The apple is an **a** (intent/convention wins); the mistake is not.
  *   **B:** Neither is a true **a**; one is a picture, the other is noise.

  ---

  # The Leaves (Theoretical Positions)

  *Each leaf corresponds to a path through the tree. The "Implementation" flag tells you if you can code this check or if you need human data.*

  ### 1. Shape/Geometric Invariant
  *   **Path:** Q1(B), Q2(B), Q3(A), Q6(A).
  *   **Implementation:** **Code.** Check Euclidean distance or Hausdorff distance against a canonical template vector.
  *   **Awkward Commitment:** You must reject the single-story **ɑ** as a different letter than the double-story **a** unless you warp the geometry until it breaks.

  ### 2. Prototype Theory
  *   **Path:** Q1(B), Q2(B), Q3(A), Q5(A), Q6(A).
  *   **Implementation:** **Code.** Train a PCA or autoencoder on accepted glyphs; check if the output falls within $N$ standard deviations of the latent center.
  *   **Awkward Commitment:** You must accept a "perfect average" **a** that no human would ever actually write or read as the most valid **a**.

  ### 3. Structural/Contrastive Role
  *   **Path:** Q1(B), Q2(B), Q3(B), Q4(A), Q6(A).
  *   **Implementation:** **Code.** Verify topological features (counters, terminals) ensure distinctness from the generated **o** and **u** in the same font set.
  *   **Awkward Commitment:** You must accept a glyph that looks like a **u** if the font's **u** is changed to look like a **c**, preserving only the difference.

  ### 4. Perceptual/Motor Schema
  *   **Path:** Q1(B), Q2(B), Q3(B), Q4(A), Q5(A), Q8(A).
  *   **Implementation:** **Human.** Requires eye-tracking or reaction-time data to verify the glyph triggers the correct recognition motor program.
  *   **Awkward Commitment:** You cannot validate a font until you have tested it on a population of readers, making batch generation impossible.

  ### 5. Causal-Historical Descent
  *   **Path:** Q1(B), Q6(B), Q7(B).
  *   **Implementation:** **Code.** Track the "lineage hash" of the glyph generation; if the seed parameters descend from an **a** preset, it is an **a**.
  *   **Awkward Commitment:** You must call a perfect circle an **a** if the random seed drifted there from an **a** starting point, even if it reads as **o**.

  ### 6. Designer Intention/Convention
  *   **Path:** Q1(B), Q2(A), Q8(B), Q9(A).
  *   **Implementation:** **Code.** Check the metadata flag `intent='a'` attached to the glyph object during creation.
  *   **Awkward Commitment:** You must accept an unreadable mess as an **a** if the designer flag says so, rendering the acceptance test useless for quality control.

  ### 7. Deflationary Cluster/Usage
  *   **Path:** Q1(B), Q2(A), Q5(B), Q8(A).
  *   **Implementation:** **Human.** Requires crowdsourced labeling; if >51% of humans call it **a**, it is **a**.
  *   **Awkward Commitment:** You cannot define what an **a** is before you have already printed and distributed it for people to read.

  ### 8. Contextual/Word-Shape Identity
  *   **Path:** Q1(A), Q2(A), Q6(A).
  *   **Implementation:** **Code.** Run the glyph through an OCR context model; if the word probability increases when labeled **a**, it passes.
  *   **Awkward Commitment:** You cannot generate a standalone lowercase alphabet sheet, because the letters technically do not exist without their neighbors.

  ---

  # Indistinguishable Pairs & Notes

  **The Shape/Prototype Overlap**
  The tree cannot rigorously separate **Shape/Geometric** from **Prototype** because both rely on intrinsic physical properties and ignore history/context.
  *   *Differentiation:* In code, Shape is a hard threshold (distance < $X$), Prototype is a probability distribution. If your generator uses rigid grids, you are forced into Shape. If it uses statistical variation, you are in Prototype.

  **The Causal/Intention Overlap**
  The tree struggles to separate **Causal-Historical** from **Designer Intention**. Both are Diachronic (history-dependent).
  *   *Differentiation:* Causal is mechanical (the file lineage); Intention is mental (the creator's mind). In code, these are identical: both are metadata flags. You can only separate them if you track the *process* (Causal) vs. the *label* (Intention).

  **Implementation Reality Check**
  *   **Green Light (Implementable):** Shape, Prototype, Structural, Causal, Intention, Contextual. These can all be approximated with metrics, topology checks, metadata, or context models.
  *   **Red Light (Human Required):** Perceptual, Deflationary. These positions explicitly define identity by human reaction or usage statistics. If you adopt these, your "acceptance test" module cannot be autonomous; it must be a pipeline to a human-in-the-loop system.
