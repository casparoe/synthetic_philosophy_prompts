      *   **Goal:** Wants an Advance Directive (AD) to be *binding* (refusing antibiotics/assisted feeding at specific stages), not just advisory.
      *   **Setting:** Clinical Ethics Consultation Committee (in-person presentation).
      *   **Timeline:** Two weeks from now.
      *   **The Committee (5 members):**
          1.  Geriatric Psychiatrist (focus on capacity, current state of mind).
          2.  Palliative-Care Physician (focus on suffering, family dynamics, practical care).
          3.  Risk Management Lawyer (focus on liability, legal standards, precedent).
          4.  Nurse (focus on bedside reality, family conflict, care burden).
          5.  Bioethicist (focus on moral philosophy, specifically skeptical of "precedent autonomy").
      *   **User's Argument:** Authority comes from *asymmetry*. The future self cannot recognize the transformation and will report contentment/decline constraints. Deferring to the "self in the room" always favors survival, rendering ADs useless in this specific context.
      *   **User's Request:** Prepare for the hour. Order of objections (realistic phrasing), concessions, hard lines, soft spots in replies, and the "dangerous question."

  2.  **Deconstruct the User's Argument:**
      *   *Core Claim:* Precedent autonomy is necessary here because the future self is epistemically blinded to its own decline (anosognosia/contentment).
      *   *Strength:* It addresses the "Ulysses Contract" problem directly. It acknowledges the future self will disagree.
      *   *Weakness:* It challenges the moral status of the future self. It asks the committee to override a potentially content patient based on the word of a past self. It risks legal liability.

  3.  **Anticipate Committee Objections (Role-Playing):**

      *   *Geriatric Psychiatrist:* Will worry about capacity *now* vs. *then*. Is the user depressed? Is this a suicidal gesture masked as planning?
      *   *Palliative-Care Physician:* Will worry about suffering. Is starvation/suffocation from infection actually peaceful? What about the family's trauma?
      *   *Risk Management Lawyer:* Will worry about lawsuits. If we follow this and the future self seems happy, are we liable for negligence/abuse? Is this legally enforceable?
      *   *Nurse:* Will worry about the bedside reality. Watching a patient starve is hard. Families beg for food. Who cleans up the mess?
      *   *Bioethicist:* Will attack the philosophical core. Why does the "then" self not matter? Is the "now" self tyrannical?

  4.  **Determine the Order of Objections:**
      *   Usually, these meetings start with clinical/practical concerns and move to legal/ethical.
      *   1. Psychiatrist (Capacity/Current State).
      *   2. Palliative Care (Symptom Management/Family).
      *   3. Nurse (Bedside Reality).
      *   4. Lawyer (Liability).
      *   5. Bioethicist (The Philosophical Kill Shot).

  5.  **Drafting the Replies (Concessions, Hard Lines, Soft Spots):**
      *   *Psychiatrist:* Concede that depression must be ruled out. Hold that this is a rational response to a specific prognosis. *Soft spot:* Admitting that mood affects decision-making.
      *   *Palliative:* Concede that symptom management is paramount. Hold that prolonging life *is* the harm here. *Soft spot:* Uncertainty about the exact experience of dying from infection.
      *   *Nurse:* Concede the emotional toll on staff. Hold that staff shouldn't impose their values. *Soft spot:* Empathy for the nurse's burden.
      *   *Lawyer:* Concede legal risk is real. Hold that the AD meets statutory requirements (if it does). *Soft spot:* The ambiguity of "binding" vs. "advisory" in case law.
      *   *Bioethicist:* This is the big one. Concede the philosophical tension. Hold the "asymmetry" argument. *Soft spot:* The moral weight of the future self's contentment.

  6.  **Identifying the "Dangerous Question":**
      *   *User's Guess:* "Define 'no longer recognizing family' exhaustively."
      *   *My Assessment:* That's a *hard* question, but not the *dangerous* one. The dangerous one undermines the moral authority of the request itself.
      *   *The Real Dangerous Question:* "If the future you is happy, why are you allowed to kill him?" Or, "Are you asking us to be your executioners?"
      *   *Actually, looking closer:* The Bioethicist's stance is "precedent autonomy is a legal convenience rather than a moral power." The dangerous question is about the *moral status of the future self*.
      *   *Refined Dangerous Question:* "If the person in the bed smiles at their daughter and says 'I want to eat,' on what moral ground do we tell them no, other than 'a ghost told us to'?" This attacks the asymmetry argument directly.

  7.  **Refining the Tone:**
      *   The user is articulate, philosophical, and resigned but firm. The preparation should match this tone: respectful, precise, unflinching, but aware of the human stakes.
      *   Avoid jargon where possible, but use ethical terms correctly.
      *   Focus on the *hour* itself.

  8.  **Structuring the Output:**
      *   Introduction: Acknowledge the gravity.
      *   The Order of Play: Who speaks when.
      *   Detailed Breakdown per Member: Objection, Concession, Hold, Soft Spot.
      *   The Dangerous Question: Analysis and Answer.
      *   Closing Advice: Demeanor and Strategy.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the specific argument about asymmetry? Yes, need to ensure the replies leverage that.
      *   *Check:* Is the lawyer's concern realistic? Yes, risk management hates ambiguity.
      *   *Check:* Is the bioethicist's objection the strongest? Yes, because it attacks the foundation.
      *   *Check:* The user asked for "two-minute replies." I need to keep the suggested responses concise enough to be spoken in that timeframe, or at least outline the key points that fit that time.
      *   *Check:* The user's guess on the dangerous question. I need to validate or correct it. I think the user's guess is a *trap*, but the *danger* is moral. I will argue the user's guess is the *administrative* trap, but the *moral* trap is different. Actually, the user's guess is about *operationalization*. If they can't define it, the AD is useless. But if they *do* define it, it looks like a suicide note. I think the *really* dangerous question is about the *relationship* between the selves. I will stick with the "Why does the past self own the future body?" angle.

      *(Self-Correction on the Dangerous Question)*: The user asks: "Tell me if you think the genuinely dangerous question is a different one."
      The user thinks the dangerous question is: "Write down exhaustively... which future states of mind count... and whether I would sign the same document if I had to."
      My view: The "exhaustive definition" question is a *practical* killer (you can't do it). But the *moral* killer is: "If the future self is content, are you committing suicide by proxy?"
      However, the *Lawyer* might ask the "Would you sign this if you were demented?" question. That's the "Ulysses" check.
      Let's go with the moral question as the *dangerous* one, but acknowledge the operational one is the *fatal* one.
      Actually, re-reading the prompt: "whether I would sign the same document if I had to." This implies: "If you were in that state, would you agree to die?" The answer is obviously no. That exposes the conflict.
      Okay, I will argue the dangerous question is: **"If the patient in the bed appears content and asks for food, are you asking us to ignore a present harm to satisfy a past preference?"** This forces the committee to choose between non-maleficence (now) and autonomy (then).

  10. **Final Polish:** Ensure the voices of the committee members sound distinct.
      *   Psychiatrist: Clinical, cautious.
      *   Palliative: Compassionate, holistic.
      *   Lawyer: Precise, protective.
      *   Nurse: Grounded, emotional.
      *   Bioethicist: Abstract, challenging.

      *Wait, one more thing:* The user says "Two weeks from now." I should advise on preparation *for* the two weeks, not just the hour. No, the prompt says "Prepare me for the hour." Stick to the meeting dynamics.

      *Let's refine the "Soft Spot".* A soft spot is where the argument is vulnerable. I need to identify where the user might waver or where the logic leaks.
      *   *Soft Spot for Psychiatrist:* The possibility that the diagnosis/prognosis is wrong or that depression is coloring the view.
      *   *Soft Spot for Bioethicist:* The claim that the future self has *no* moral weight.

      *Let's refine the "Hold".* What is non-negotiable?
      *   That the directive must be binding, not advisory.

      *Let's refine the "Concession".* What can be given to build rapport?
