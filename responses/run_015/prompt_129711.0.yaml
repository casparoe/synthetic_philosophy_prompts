answer: |-
  Here is your survival prep sheet. The goal here isn't to prove you're right; it's to prove you've thought about why you might be wrong.

  ### **Strategic Concessions (Say these early)**
  Don't wait for them to corner you. Open your defense or slip these into your first answer to disarm them.
  1.  **Concede Uniqueness:** Admit that by dropping Monotonicity, you likely lose the *unique* characterization that makes standard KS so elegant. Frame your proposal as a "solution concept" for a specific class of repeated contracts, not a universal law.
  2.  **Concede the Static Frame:** Acknowledge that standard cooperative game theory is static. You are trying to stretch it to cover a dynamic reality, which creates friction.
  3.  **Concede the "Nash Baseline":** Agree that for one-off interactions with a true exogenous status quo, Nash (or standard KS) is superior. Your model is *only* for endogenous, repeated relationships.

  ---

  ### **The Objections (Ordered by Damage)**

  #### **1. The Grad Student (Cooperative Game Theory Expert)**
  **Damage Level:** Critical. They can mathematically dismantle your axiom set.
  **The Objection:** "Kalai-Smorodinsky is prized because four axioms yield one unique solution. You're dropping Individual Monotonicity—the engine that ensures the solution tracks the utopia point—and replacing it with 'local envy-freeness' based on a *prior* set. Mathematically, this is messy. Does your new axiom set actually characterize a unique point? Or have you just defined a region of 'acceptable' outcomes? If it's not unique, it's not a solution, it's a constraint."

  **Your Two-Minute Reply:**
  "You're right that I sacrifice the elegance of unique characterization in the static sense. But uniqueness in a static model is the wrong virtue for a dynamic problem. In repeated contracting, agents don't look for a mathematical singularity; they look for stability relative to history. My 'local envy-freeness' isn't trying to pinpoint a single coordinate in a vacuum; it's trying to ensure that the *movement* from round $t-1$ to round $t$ feels fair to both parties. If I keep Monotonicity, I ignore the history that created the current disagreement point. I am prioritizing 'dynamic consistency' over 'static uniqueness.' If the math yields a set of stable points rather than one, that actually reflects the real-world flexibility of contract renewal better than a forced singularity."

  **Where This Is Soft:**
  If they press you on whether your axioms yield *any* existence proof, you're stuck. You likely haven't proven that a solution exists under your new rules. If they ask, "Can you write down the function?" and you can't, you look like you're hand-waving.

  #### **2. The Economists (Nash Purists)**
  **Damage Level:** High. They will attack incentives and strategic manipulation.
  **The Objection:** "If the disagreement point ($d$) is endogenous—meaning it's last year's deal—you've created a massive incentive problem. If I know that agreeing to a lower payoff this year sets a worse $d$ for next year, I will fight harder now to shift the baseline. Nash handles $d$ as exogenous for a reason: to prevent exactly this kind of strategic gaming of the status quo. Your model assumes agents treat the past as fixed, but rational agents treat the past as a lever."

  **Your Two-Minute Reply:**
  "That's the standard non-cooperative critique, but it assumes a short-term horizon. In the specific contractual relationships I'm modeling—like labor unions or supply chain partnerships—the cost of breaking the relationship to game the $d$ point outweighs the gain from shifting the baseline. These agents value the *renewal* more than the *reset*. If I fight too hard now to manipulate next year's $d$, I risk no contract at all. My model assumes that in long-term repeated games, the 'shadow of the future' disciplines the manipulation of the disagreement point. Nash is better for spot markets; my modification is for relationships where the cost of deviation is reputation loss."

  **Where This Is Soft:**
  You are assuming away the problem with "reputation." If they ask for a discount factor or a trigger strategy to prove that manipulation isn't profitable, you can't provide it. You're making a behavioral claim without a structural model.

  #### **3. The Philosopher (Procedural Fairness)**
  **Damage Level:** Medium. They will attack the normativity of locking in the past.
  **The Objection:** "You're building a model that legitimizes history, even unjust history. If last year's agreement was the result of coercion or information asymmetry, making that the 'disagreement point' for this year just locks in the injustice. Procedural fairness requires we evaluate the current options on their own merits, not anchor them to a potentially corrupt past. Why should 'local envy-freeness' care about a prior feasible set that might have been unfair?"

  **Your Two-Minute Reply:**
  "Procedural fairness isn't just about the snapshot of the current moment; it's about the stability of expectations. If we wipe the slate clean every round, we create volatility that harms the weaker party most. The 'local' condition I propose isn't about saying the past was just; it's about acknowledging that in ongoing relationships, 'fairness' includes honoring the trajectory of the partnership. However, I agree with you that if the prior round was coercive, my model needs a 'reset' clause. I'd concede that my axiom applies only when the prior round met a minimum threshold of procedural validity. Without that, yes, you're right, it locks in injustice."

  **Where This Is Soft:**
  You just added a condition ("minimum threshold of procedural validity") that isn't in your math. You've admitted your model is incomplete without an external moral judgment, which weakens the formal rigor.

  ---

  ### **The One Question To Pray Nobody Asks**

  **"If the disagreement point is determined by the previous bargaining outcome, isn't this just a non-cooperative repeated game? Why are you using cooperative axioms at all?"**

  **Why this kills you:**
  Cooperative game theory (Nash/KS) assumes binding agreements and focuses on the *outcome*. Non-cooperative theory (Rubinstein bargaining) focuses on the *process* and timing. If $d$ is endogenous, the "cooperative" phase is actually just a sequence of non-cooperative moves.
  *   If you say "Yes, it's non-cooperative," they ask why you're using KS axioms.
  *   If you say "No, it's cooperative," they ask how you enforce the binding agreement when the threat point is mutable.

  **If asked, stall:** "That's the boundary of this paper. I'm using the cooperative framework as a normative benchmark to evaluate the outcomes of that repeated process, not to model the strategic moves themselves." (Then move quickly to the next question).

  ---

  ### **Final Survival Tip**
  When the Grad Student attacks your math, don't try to out-math them. Pivot to **interpretation**.
  *   *Them:* "Your function isn't well-defined."
  *   *You:* "It's not meant to be a closed-form solution yet; it's a normative constraint on how we *think* about dynamic bargaining."

  When the Economists attack your incentives, pivot to **empirics**.
  *   *Them:* "Agents will game this."
  *   *You:* "In the data on long-term contracts, we rarely see that level of gaming because relationship value dominates."

  When the Philosopher attacks the justice, pivot to **stability**.
  *   *Them:* "It's unfair."
  *   *You:* "It prevents collapse. Sometimes stability is the prerequisite for justice."

  Good luck. Keep your answers under two minutes. If you talk longer, you're hiding something.
