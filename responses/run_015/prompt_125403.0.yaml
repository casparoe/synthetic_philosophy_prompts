          1.  *Unstable Counterfactual:* The "careful world" might contain a *different* healthy child (substitution) or *no* child. If substitution, parents' costs are similar, yet they get extraordinary costs. If no child, parents' claim relies on comparing existence vs. non-existence (which is barred for the child).
          2.  *Statutory Reform:* A hypothetical narrow action for lives "not worth living," damages measured by shortfall below threshold, paid to a care fund. How does this interact with the existing theory?
      *   **Specific Questions to Answer:**
          *   What view of harm, benefit, and counterfactual comparison does existing practice presuppose?
          *   Distinguish strict presuppositions from mere fit.
          *   Identify where rival theories license the same pattern.
          *   Is it committed to: no subject of harm in non-existence? Life worth living = net benefit? Threshold view? Incomparability? Or just pragmatic mix (administrability, dignity, reluctance)?
          *   Is the parents' action welfare-based (avoided costs) or autonomy-based (reproductive choice in cost-shape)? Does the benefits-offset rule make sense on each?
          *   Does the pattern presuppose an answer to the Non-Identity Problem/Asymmetry (absence of pain vs. absence of pleasure)?
