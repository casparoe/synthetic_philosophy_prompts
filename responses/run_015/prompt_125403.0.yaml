  2.  **Analyze the Existing Legal Pattern:**

      *   *Wrongful Life (Child):* Denied. Rationale: Life (even impaired) > Non-existence; No right not to be born; Comparisons impossible/impious.
      *   *Wrongful Birth (Parents, Disabled Child):* Allowed (Extraordinary costs only). Rationale: Injury to parents' interest in avoiding parenthood of a disabled child. Ordinary costs offset by "benefits of parenthood."
      *   *Wrongful Conception (Parents, Healthy Child):* Split. Some allow rearing costs, some limit to pregnancy/birth. Rationale: Is a healthy child a "benefit" that offsets costs?

  3.  **Address Complication 1: The Unstable Counterfactual:**

      *   *Scenario A (Substitution):* Parents would have had a healthy child later.
          *   *Legal Practice:* Courts usually ignore this. They award extraordinary costs of the *disabled* child.
          *   *Implication:* The law treats the *specific* disabled child's costs as the harm, not the net financial position of the parents regarding parenthood in general. It suggests the injury is the *burden of the disability*, not the *burden of parenthood*.
      *   *Scenario B (No Child):* Parents would have remained childless.
          *   *Legal Practice:* Parents recover extraordinary costs.
          *   *Implication:* This *does* require comparing existence (with disability costs) vs. non-existence (of this child). But the law frames it as injury to the *parents' financial integrity/autonomy*, not the *child's welfare*.
      *   *Tension:* The child can't claim "I shouldn't exist," but parents can claim "We shouldn't have had *this* child (financially)." The law sidesteps the metaphysical comparison for the child by focusing on the parents' wallet/autonomy, but logically, the parents' loss *depends* on the child's existence being a net negative (financially) compared to non-existence.

  4.  **Address Complication 2: The Statutory Reform:**

      *   *Reform:* Action only if life "not worth living." Damages = shortfall below threshold. Paid to care fund.
      *   *Analysis:* This explicitly adopts a *Threshold View* of harm. It admits the child *can* be harmed by being born, but only if life is net negative.
      *   *Contrast:* Existing law says *no* wrongful life action even if life is terrible (usually). Existing law allows parents to recover costs even if life *is* worth living (just costly).
      *   *Implication:* The reform makes explicit what existing law keeps implicit/contradictory. It resolves the "incomparability" issue by setting a baseline.

  5.  **Reconstructing the Implicit Theory:**

      *   *Harm:* The law operates on a **Person-Affecting Restriction** (roughly). You can't harm someone by bringing them into existence unless their life is worse than non-existence (which is deemed impossible or inadmissible). However, you *can* harm the *parents* by altering their financial/autonomous status.
      *   *Benefit:* The "Benefits Offset" rule implies a **Presumption of Benefit**. Existence is presumed a gift. Ordinary costs are the price of the gift; extraordinary costs are the burden of the negligence.
      *   *Counterfactual:* The law uses a **Hybrid Counterfactual**.
          *   For the child: Non-existence is not a valid baseline (Incomparability or No-Subject).
          *   For the parents: Non-existence of the *child* IS a valid baseline for financial calculation, *but* the "benefits of life" are imputed to offset costs to avoid saying the child is a net loss.
      *   *Strict Presuppositions vs. Good Fit:*
          *   *Strict:* The law *must* presuppose that parents have a legally cognizable interest in avoiding the *financial burdens of disability* distinct from the child's right to life. It *must* presuppose that ordinary parenthood costs are not "damages" (policy choice).
          *   *Fit:* It fits well with the Non-Identity Problem logic (no harm to child), but doesn't strictly require it (could just be judicial modesty). It fits with the Asymmetry (duty to prevent pain, no duty to confer pleasure), but doesn't require it.
      *   *Welfare vs. Autonomy:*
          *   *Welfare:* Parents' claim looks like welfare (money). But the "benefits offset" makes it weird. If it were pure welfare, and the child is a net financial drain, why offset?
          *   *Autonomy:* Better fit. The injury is the *violation of reproductive choice*. The damages are merely the *measure* of that violation. The "benefits offset" is a policy cap to prevent devaluing life, not a strict accounting of welfare.
      *   *The Asymmetry (Parfit):*
