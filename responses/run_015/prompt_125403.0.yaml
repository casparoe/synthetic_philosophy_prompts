answer: |-
  The existing common-law pattern rests on a theory of **Segmented Baselines and Symbolic Offsets**. It is a pragmatic doctrinal compromise designed to provide redress for parental reliance interests while avoiding the metaphysical and ethical implications of adjudicating the value of existence itself.

  Below is the reconstruction of that theory, tested against the complications you raised, followed by an analysis of its philosophical commitments and the implications of the Asymmetry.

  ### 1. The Implicit Theory: Segmented Baselines

  The law operates on two distinct tracks that are logically tensioned but doctrinally separated:

  *   **For the Child (The Metaphysical Bar):** The law presupposes the **Incomparability Thesis**. It holds that existence and non-existence are incommensurable. Because there is no subject in the state of non-existence, there is no subject to whom harm can be attributed in the "wrongful world." Therefore, the baseline for the child is *status quo ante* (their actual life), not the counterfactual (non-existence). Since their actual life is the only state they know, and life is presumptively a gift, no harm is cognizable.
  *   **For the Parents (The Financial/Autonomy Bar):** The law presupposes a **Financial Baseline of Non-Parenthood**, but modifies it with a **Presumption of Benefit**. The parents are treated as if the baseline is a world without the child (allowing recovery for costs incurred). However, to avoid the implication that the child is a "net loss," the law imputes the intangible "benefits of parenthood" to offset the ordinary costs of rearing. This leaves only the *extraordinary* costs (disability-related) as a net negative.

  **Coherence Test:** This theory is internally incoherent. It asserts that comparing existence to non-existence is impossible for the child (Track 1), yet it implicitly performs that exact comparison for the parents to calculate damages (Track 2). To award parents the costs of a disabled child is to admit that, *for the parents*, a world with this child is worse than a world without. If it is worse for the parents financially/autonomously, the structural logic suggests it could be worse for the child, yet the law forbids that inference.

  ### 2. Addressing Complication 1: The Unstable Counterfactual

  The instability of the counterfactual (Substitution vs. No Child) reveals that the law relies on a **Legal Fiction of Causation** rather than a rigorous counterfactual analysis.

  *   **The Substitution Scenario:** If the parents would have conceived a healthy child later, the "careful world" contains a child and similar ordinary rearing costs. Logically, the parents' net financial loss is only the *difference* between raising a healthy vs. disabled child.
      *   *Legal Practice:* Courts generally ignore this. They award the extraordinary costs of the disabled child without deducting the costs of the hypothetical healthy sibling.
      *   *Theoretical Implication:* This proves the parents' claim is not strictly a **Welfare Claim** (net financial position). If it were, the substitution would negate the loss. Instead, it treats the *disability itself* as the tortious event. The negligence is not "causing the birth" but "causing the burden of the disability."
      *   *The Tension:* This creates a paradox. If the harm is the *disability burden*, why is the child barred from claiming the disability burden harmed *them*? The law answers: Because the parents' harm is relational/financial, while the child's harm would be existential.
  *   **The No-Child Scenario:** If the careful world contains no child, the parents' recovery rests on comparing a world with the child to a world without.
      *   *Legal Practice:* Courts allow this comparison for parents but bar it for children.
      *   *Theoretical Implication:* This confirms the **Segmented Baseline**. The law grants parents standing to treat non-existence as a valid baseline for *financial calculation*, while denying the child standing to treat non-existence as a valid baseline for *welfare calculation*. This is not philosophically defensible as a unified theory of harm; it is a policy choice to prioritize parental reliance over metaphysical consistency.

  ### 3. Addressing Complication 2: The Statutory Reform

  The hypothetical reform (action only if life is "not worth living," damages for shortfall, paid to fund) adopts a **Threshold View of Harm**.

  *   **Contrast:** Existing law uses a **Categorical Bar** (no wrongful life, ever). The Reform uses a **Sliding Scale** (wrongful life only below a threshold).
  *   **Testing the Existing Theory:** The Reform exposes that the existing "Incomparability Thesis" is a sham. If the legislature can define a threshold where life is *not* a benefit, then existence and non-existence *are* comparable.
  *   **Integration:** If the Reform were adopted, the parents' "Benefits Offset" rule would become redundant or contradictory. If the child's life is below the threshold of "worth living," the presumption that "ordinary costs are offset by benefits" collapses. You cannot offset costs with benefits if the life is net negative.
  *   **Conclusion on Reform:** The Reform is more philosophically coherent than current practice because it aligns the parents' and child's baselines. Current practice is committed to the view that *no life is legally cognizable as a harm*, whereas the Reform is committed to the view that *some lives are harms*.

  ### 4. Strict Presuppositions vs. Philosophical Fit

  We must distinguish what the law *needs* to function from what merely *explains* it.

  **Strict Presuppositions (What the law requires to work):**
  1.  **Distinct Legal Interests:** Parents and children have separable legal interests. A harm to parental autonomy/finance does not require a corresponding harm to the child's welfare.
  2.  **Administrative Line-Drawing:** Courts can distinguish "ordinary" rearing costs from "extraordinary" disability costs.
  3.  **Judicial Competence:** Courts are competent to price medical/educational costs but incompetent to price the value of a life vs. non-existence.

  **Merely Fits Well With (Philosophical theories that license the pattern but aren't required):**
  1.  **The Non-Identity Problem:** The pattern fits Parfit's Non-Identity Problem (the child is not worse off than they would otherwise be, because otherwise they wouldn't be). However, the law does not *strictly* presuppose this. It could simply be a rule of standing (no right to sue for birth) without accepting the metaphysical claim that existence cannot be a harm.
  2.  **The Asymmetry:** The pattern fits the Asymmetry (reason to prevent pain, no reason to confer pleasure), but does not require it. The law could bar the child's claim simply to avoid devaluing disabled lives (expressive harm), regardless of the Asymmetry's truth.
  3.  **Sanctity of Life:** The "Benefits Offset" fits a Sanctity of Life doctrine, but the award of *extraordinary* costs undermines it. If life is sacred, its costs should be borne by the community or family, not shifted to a negligent doctor.

  **Is it committed to specific claims?**
  *   *No subject of harm in non-existence?* **Yes, strictly.** This is the explicit rationale for barring the child's claim.
  *   *Any life worth living is a net benefit?* **No.** It is committed to the claim that *courts cannot adjudicate* whether it is a net benefit. It presumes benefit for policy reasons, not ontological ones.
  *   *Threshold view?* **No.** It explicitly rejects a threshold view for the child (no action even for severe impairment) while implicitly using one for parents (extraordinary costs only).
  *   *Nothing philosophical at all?* **Closest to the truth.** The pattern is best explained as a mixture of administrability (easier to calculate medical costs than existential harm), dignity (avoiding the statement "you shouldn't have been born"), and reluctance to price life.

  ### 5. Welfare vs. Autonomy in the Parents' Action

  Is the parents' action welfare-based or autonomy-based?

  *   **Welfare Reading:** If the claim is about avoided costs, the "Benefits Offset" is an accounting error. If the child costs \$500k to raise and provides \$100k in joy (utility), the net loss is \$400k. Offsetting \$500k in costs with \$500k in "joy" assumes joy equals cost, which is arbitrary.
  *   **Autonomy Reading:** If the claim is about **Reproductive Autonomy**, the "Benefits Offset" makes sense as a **Policy Dam**. The injury is the violation of the right to choose whether to parent. However, full rearing costs imply the child is a "bad deal." To protect the social value of children, the law caps damages at "extraordinary costs."
  *   **Verdict:** The pattern is an **Autonomy Claim in Cost-Shaped Disguise**. The damages measure the *extent* of the autonomy violation (the burden imposed), but the Offset Rule is a normative cap to prevent the autonomy claim from morphing into a declaration that the child is worthless.
  *   **Coherence:** This creates a disconnect. If the injury is autonomy, the damages should reflect the loss of choice. If the parents wanted *no* children, the cost of *any* child is the damage. Offsetting ordinary costs effectively tells the parents: "Your autonomy was violated, but you got a benefit you didn't ask for, so we won't pay for it." This treats the child as an unsolicited gift that must be accepted, which contradicts the autonomy premise.

  ### 6. The Asymmetry and Necessary Changes

  The Asymmetry (Parfit/Narveson) states: We have a moral reason to prevent suffering (even if no one exists to be harmed), but no moral reason to create happiness (for those who don't exist).

  *   **Does the pattern presuppose the Asymmetry?**
      *   *Practically, Yes.* The law prevents the "suffering" (parents pay for disability) but denies the "pleasure" claim (child cannot claim they lost out on non-existence).
      *   *Rhetorically, No.* The law claims life is *always* a benefit, which contradicts the Asymmetry's agnosticism about creating happy people.
  *   **Could the Asymmetry be true while the practice is correct?**
      *   Yes, if the Asymmetry is viewed as a guide for *moral reasons to prevent* rather than *legal standing to sue*. The law could accept we have reason to prevent the birth of a suffering child (hence parents recover costs) without granting the child standing (because there is no subject to hold the right).
  *   **If the Asymmetry were built into the law, what would change?**
      1.  **The Child's Action:** It would likely remain barred *unless* the life is net negative (suffering > pleasure). The Asymmetry does not grant a right to be born happy, but it supports a claim against being born into suffering. This moves the law toward the **Statutory Reform** (Threshold View).
      2.  **The Offset Rule:** It would collapse for severe cases. If the Asymmetry admits that existence can be a net burden (suffering), the presumption that "ordinary costs are offset by benefits" fails for lives below the threshold.
      3.  **Healthy Unplanned Child:** The Asymmetry suggests there is no harm in failing to create a happy person. Therefore, parents of a healthy unplanned child should **not** recover rearing costs if the child's life is good. The current split (some allow, some deny) reflects uncertainty here. A strict Asymmetry-based law would deny rearing costs for healthy children (no injury in creating a happy life) but allow pregnancy/birth costs (physical intrusion on autonomy).
      4.  **Damages Measurement:** Damages would shift from "costs incurred" to "suffering endured." For the parents, this might mean focusing more on the emotional distress of the autonomy violation rather than the financial ledger of rearing.
      5.  **Judicial Rhetoric:** The claim "Life is always a benefit" would be replaced by "Life is a benefit *unless* it falls below the threshold of bearability."

  ### Summary Conclusion

  The existing common-law pattern presupposes a **pragmatic dualism**: it treats the parents as economic agents harmed by financial burdens, and the child as a metaphysical entity who cannot be harmed by existence. This is incoherent because the parents' financial harm *depends* on the child's existence being a net burden, which is precisely what the child is barred from claiming.

  The law is not strictly committed to deep philosophical truths (like the Non-Identity Problem) but is committed to **avoiding the expression** that a life is not worth living. It sacrifices logical consistency (the counterfactual instability) to maintain a social norm (children are blessings).

  If the **Asymmetry** were fully integrated, the law would become more consistent but less protective of the "sanctity of life" rhetoric. It would allow the child's claim in severe cases (Threshold View), eliminate the Benefits Offset for those cases, and clarify that creating a healthy life is not a compensable injury to the parents beyond the physical intrusion of pregnancy. The current practice is a unstable equilibrium between tort logic (compensate losses) and bioethical policy (value life). The Statutory Reform you propose resolves the instability by choosing the bioethical threshold explicitly, whereas current law tries to hide it behind accounting rules.
