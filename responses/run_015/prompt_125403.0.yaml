          *   *If Built In:*
              *   *Child's Action:* Might be allowed *only* if life is net negative (threshold).
              *   *Offset Rule:* Would vanish for lives below threshold.
              *   *Healthy Child:* Rearing costs should be recoverable (no "benefit" offset if existence isn't a benefit *to the parents* in a welfare sense, though autonomy still holds).
              *   *Rhetoric:* Would shift from "Life is always a benefit" to "Life is a benefit unless..."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the complexity. State the core tension (Non-Identity Problem vs. Tort Logic).
      *   *Section 1: The Implicit Theory.* Define the "Segmented Baseline." Child = No baseline (Non-existence incomparable). Parents = Financial baseline, but modified by "Sanctity of Life" policy.
      *   *Section 2: Addressing Complication 1 (Counterfactual).* Explain how the law fudges the substitution scenario. It treats the disability as a distinct tortious event separate from the birth itself. This implies the harm is the *disability burden*, not the *birth*.
      *   *Section 3: Addressing Complication 2 (Statutory Reform).* Contrast the "Threshold" reform with the "Categorical Bar" of current law. The reform admits harm is possible; current law denies the *category* of claim.
      *   *Section 4: Strict Presuppositions vs. Fit.*
          *   *Strict:* Parents have autonomy interests; Courts cannot adjudicate the value of a life vs. non-life.
          *   *Fit:* Non-Identity Problem, Asymmetry.
      *   *Section 5: Welfare vs. Autonomy.* Argue it's Autonomy in cost-shape. The offset rule is a policy dam, not an accounting truth.
      *   *Section 6: The Asymmetry.* Analyze Parfit's Asymmetry. Current law aligns with it practically but denies it rhetorically. If adopted formally, the "Benefits Offset" collapses for severe cases.
      *   *Conclusion:* Summarize the incoherence. The law tries to compensate parents for a harm it refuses to acknowledge exists for the child, using accounting tricks to avoid moral conclusions.

  7.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between "Wrongful Birth" (disabled child) and "Wrongful Conception" (healthy child). The prompt asks about the pattern covering both.
      *   *Nuance:* The "Substitution" scenario is key. If parents would have had a healthy child, the *net* financial loss is just the difference between raising a healthy vs. disabled child. Courts award the *full extraordinary costs*. This implies the baseline is "No Child" legally, even if factually it was "Different Child." Why? Because acknowledging "Different Child" invokes the Non-Identity Problem too strongly (i.e., "You aren't worse off, you have a healthy kid instead"). The law prefers the fiction that the negligence caused the *extra costs*, ignoring the substitution.
