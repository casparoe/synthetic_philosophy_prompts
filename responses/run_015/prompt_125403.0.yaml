      *(Refining the "Benefits Offset")*: Why does it exist? If it's autonomy, why offset? Because if you award full rearing costs, you are effectively saying "This child is a net loss." The law refuses to say that. So the offset is a *symbolic* protection of the child's dignity, not a logical requirement of the autonomy claim. This is a crucial distinction.

