      *   *Self-Correction on Principle 2:* If Principle 2 approves the College, is Decision 4 the best analog? Decision 4 is about *non-political* experts. The College is *political* (veto). Decision 3 (Executive term limits) allows return. Maybe the analog is Decision 3? No, Decision 3 is about Executives. Decision 4 is about permanent staff. The College is a hybrid. Let's stick with Decision 4 as the analog for *function* (stability), noting the tension. Or, argue that under Principle 2, the College is seen as an *extension* of the Clerkship's role (advisory/stabilizing) but vested in citizens. Actually, the prompt says Clerks "advise on procedure." The College "returns bills." That's a veto.
