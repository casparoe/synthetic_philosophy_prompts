  ## Part 4: Overlap Flags

  This tree cannot cleanly separate the following pairs of named positions due to shared diagnostic answers or hybrid metrics.

  **1. Pure Consequentialism vs. Limiting Retributivism**
  *   **Overlap:** Both answer **No** to Claim A and **No** to Claim B. Both generally answer **No** to Claim C (State authority is not solely consent-based).
  *   **Reason:** They diverge only on Claim D. Pure Consequentialism selects **Social Benefit**. Limiting Retributivism selects **Both Gravity and Social Benefit** (Gravity sets limits, Benefit sets purpose). Because Claim D forces a single choice, Limiting Retributivism must be understood as occupying the space between D=1 and D=2.

  **2. Restorative Justice vs. Contractualist Hybrid**
  *   **Overlap:** Both often answer **No** to Claim A and **No** to Claim B. Both may answer **Yes** to Claim C (Authority requires consent/participation).
  *   **Reason:** They diverge on the definition of "punishment." Restorative Justice (mapped at D=3) often denies the state's authority to punish entirely, focusing on repair. Contractualist Hybrid (mapped at D=1) accepts punitive authority based on the breach of consent. The tree locates them by severity metric (Victim vs. Gravity), but the deeper disagreement is on the legitimacy of suffering itself.

  **3. Pure Retributivism vs. Rare View (Retributive-Consent-Victim)**
  *   **Overlap:** Both answer **Yes** to Claim A and **Yes** to Claim B.
  *   **Reason:** They diverge on Claim C (Entitlement vs. Consent) and Claim D (Gravity vs. Victim-Centered). However, in practice, a "Victim-Centered" metric for a Retributivist may look identical to a "Gravity" metric if victim harm is seen as the measure of gravity. The distinction is theoretical (source of authority) rather than practical (sentence length).
