answer: |-
  This is a sophisticated application of Confucian Role Ethics (CRE) to institutional care. You are correctly identifying that CRE is not just "Asian values" but a structural alternative to Western liberal individualism. The core tension you face is that CRE is *descriptive* of how people actually relate, while your institution is *prescriptive* based on law and policy.

  To address your caveat about the "uncritical of roles" critique: Confucius himself provided the tool to fix this. It is called *Zhengming* (Rectification of Names). If the name "Father" or "Proxy" does not match the reality of the behavior, the name is rectified to match the reality. A "son" who does not care is not fulfilling the role of "son," regardless of biology. The authority comes from the *performance* of the role, not just the title.

  Here is the procedure, the case applications, and the limits.

  ### Part 1: The Role Rectification Intake (Procedure)

  This is designed for a 45-minute window. It assumes you have already cleared the immediate safety/legal floor (abuse, neglect, immediate liability).

  **Step 1: The Legal Floor (Hard Stop)**
  *   **Question:** Is there a court order, Advance Directive, or Healthcare Proxy designation that legally settles this?
  *   **Action:** If **Yes**, the legal document wins. CRE cannot override statutory law. Your role shifts to helping the parties understand *why* the law binds them.
  *   **Action:** If **No** (or ambiguous), proceed to Step 2.

  **Step 2: Rectification of Names (*Zhengming*)**
  *   **Question:** Look at the chart. Now look at the room. Who is *actually* doing the work of the role listed on the chart?
  *   **Tool:** *The Naming Mismatch.* List the titles (e.g., "Proxy," "Son," "Staff") vs. the lived reality (e.g., "Daily Caregiver," "Absent Brother," "Medicator").
  *   **Criteria:** If the formal title and the lived role diverge significantly, the formal title is suspect for decision-making weight.
  *   **Output:** Identify whose role is "Thin" (title only) and whose is "Thick" (performance + title).

  **Step 3: The Graded Obligation Check**
  *   **Question:** Who bears the consequences of this decision?
  *   **Tool:** *Role-Distance Substitution.* Take the demand being made. If we swap the person making the demand with someone one step further out (e.g., a cousin instead of a brother), does the demand still hold water?
  *   **Criteria:** If the demand collapses when the relationship weakens, the demand is relational, not factual. It belongs to the person closest to the resident.
  *   **Output:** Hierarchy of authority based on relational proximity and consequence-bearing.

  **Step 4: The Creditor's Complaint**
  *   **Question:** Is someone resentful because they are performing a role "richly" while another performs it "thinly" yet claims equal authority?
  *   **Tool:** *Resentment as Data.* Do not dismiss resentment as emotion. In CRE, resentment indicates a breach of reciprocal obligation.
  *   **Criteria:** If Person A feeds/bathes/visits (Thick) and Person B dictates/overrules (Thin), Person B is violating *Yi* (Righteousness/Reciprocity).
  *   **Output:** Validate the resentment as evidence of role imbalance, not just "family drama."

  **Step 5: The Decision or Hand-Off**
  *   **Question:** Is this a factual dispute (medical risk) or a values dispute (what makes a good life)?
  *   **Action:**
      *   **Factual:** Defer to medical staff (their role is medical safety).
      *   **Values:** Defer to the "Thickest" role performer identified in Step 2 & 3.
      *   **Irreconcilable:** If two "Thick" roles conflict (e.g., Staff duty of care vs. Family duty of protection), you must escalate to Ethics Committee or Legal. CRE cannot solve institutional vs. family role conflicts without legal backup.

  ---

  ### Part 2: Running the Cases

  Here is the honest application. I will flag where the CRE answer conflicts with standard Western bioethics or your personal comfort.

  #### Case 1: The Two Brothers (Local vs. Distant)
  *   **Step 1 (Legal):** Is the distant brother the Healthcare Proxy?
      *   *If Yes:* Law wins. You cannot use CRE to strip legal authority. You must advise the local brother that the law recognizes the proxy, not the caregiver.
      *   *If No (or both):* Proceed.
  *   **Step 2 (Names):** Local brother = "Son" (Thick). Distant brother = "Son" (Thin/Title only). Staff = "Care Provider."
  *   **Step 3 (Substitution):** If a neighbor called on Sundays and demanded to override the daily caregiver, we'd dismiss it. The distant brother's claim relies on biology, not relationship.
  *   **Step 4 (Creditor):** Local brother is resentful. This is valid data. He is carrying the role's weight.
  *   **CRE Decision:** Support the local brother on day-to-day quality of life. The distant brother retains consultation rights on major irreversible changes *only if* he engages in the work of understanding the medical reality (thickening his role).
  *   **The Uncomfortable Truth:** If the distant brother *is* the legal proxy, CRE fails here. You have to tell the local brother, "You are doing the work of a son, but the law recognizes a signature. You need to get the proxy changed." CRE cannot fix a bad legal designation without legal action.

  #### Case 2: The Deception (Dementia & Death)
  *   **Step 1 (Legal):** No law mandates telling a dementia patient painful truths if it causes immediate psychological harm. Beneficence usually covers this.
  *   **Step 2 (Names):** Daughter = "Protective Child" (Thick). Staff = "Honest Caregiver" (Institutional Role).
  *   **Step 3 (Graded Obligation):** Who suffers the consequence? The father (confusion/grief) and the daughter (managing the grief). The staff does not bear the emotional consequence, only the ethical discomfort.
  *   **Step 4 (Creditor):** Staff feel resentful that they are being asked to "lie." They feel this violates their professional role.
  *   **CRE Decision:** This is the hardest one. Western bioethics says "Autonomy/Truth." CRE says "*Ren* (Humaneness)."
      *   If the father asks, "Where is my daughter?" and is told "She died," he experiences fresh grief. He cannot process it. He asks again tomorrow. He grieves again.
      *   CRE prioritizes the *harmony of the moment* and the *minimization of suffering* over abstract truth.
      *   **Verdict:** You likely have to support the daughter's request *with a caveat*. The staff role is rectified from "Truth-Teller" to "Comfort-Provider."
  *   **The Uncomfortable Truth:** You noted you don't want the answer this pushes toward. CRE pushes toward **supporting the deception.** In a role ethic, causing repetitive, unprocessable grief to a father is a failure of the child's role. Truth is not an absolute; it is relational. If the truth destroys the relationship's peace without offering agency, it is not "right." You will have to document this carefully as "Therapeutic Privilege" to satisfy the lawyers, but ethically, CRE sides with the daughter.

  #### Case 3: The Partner vs. The Niece
  *   **Step 1 (Legal):** Niece is Proxy. Partner is "Friend." Legally, Niece wins.
  *   **Step 2 (Names):** Partner = "Spouse" (Thick, 30 years). Niece = "Proxy" (Thin, absent since 2019).
  *   **Step 3 (Rectification):** The form is wrong. The name "Friend" is a misnomer for "Spouse." The name "Proxy" is a misnomer for "Absent Kin."
  *   **Step 4 (Decision):** The institution has a duty to rectify the names.
  *   **CRE Decision:** You cannot let the Niece decide over the Partner. The Niece is not performing the role of "Kin."
  *   **Action:** You must initiate a capacity hearing or legal petition to transfer proxy to the Partner based on "best interest" and "prior known wishes." Until then, you treat the Partner as the *de facto* proxy for daily care, documenting that the legal proxy is non-responsive.
  *   **The Uncomfortable Truth:** This creates liability. If the Niece sues, you are vulnerable. CRE demands you honor the 30-year role over the 2019 signature. The law demands the opposite. You have to pick a fight with Legal to make this work.

  ---

  ### Part 3: Systematic Failures & The "Switch to Rights" Point

  You asked where this procedure gets it wrong and when to drop it.

  **1. The Abuse Blind Spot**
  CRE assumes roles are generally benevolent. It struggles when a role is weaponized.
  *   *Scenario:* A son visits daily (Thick Role) but uses that access to financially exploit or verbally abuse the resident.
  *   *Failure:* Step 3 (Graded Obligation) might give him *more* authority because he is "closer."
  *   *The Switch:* The moment "Role Performance" includes harm, you drop CRE. You switch immediately to **Rights Language.** "The resident has a right to safety." CRE has no internal mechanism for "divorce" from a role without external intervention.

  **2. The Institutional Wall**
  CRE works for family vs. family. It breaks at Family vs. Institution.
  *   *Scenario:* Family wants to feed resident manually (Role: Caring Child). Staff says it's a choking hazard (Role: Medical Safety).
  *   *Failure:* Both are performing roles "thickly." CRE has no impartial judge.
  *   *The Switch:* When roles conflict on *safety standards*, you switch to **Compliance Language.** "State Regulation X prohibits this." Do not use role ethics to negotiate negligence.

  **3. The "Uncritical Roles" Fix**
  To answer your caveat about criticizing roles: Use **Step 2 (Rectification)** aggressively.
  *   If a family says, "I am the eldest son, I decide," you reply: "In this facility, the role of 'Decision Maker' requires participation in care conferences and review of medical charts. You are performing the role of 'Absent Kin.' If you wish to perform 'Decision Maker,' here is the work required."
  *   You make the authority *conditional* on the performance. This prevents the "Tyranny of the Title."

  ### Training Tip for the 90-Minute Slot

  Don't lecture. Run a **"Role Autopsy."**

  1.  **Give them a redacted case note** (like Case 1).
  2.  **Ask them to highlight every noun** that implies a role (Mother, Nurse, Proxy, Friend).
  3.  **Ask:** "Which of these roles is carrying the weight? Which is carrying the authority?"
  4.  **Have them map the mismatch.**
  5.  **Final Exercise:** "Write one sentence in the case note that rectifies the name without violating the law."
      *   *Bad:* "Family is difficult."
      *   *Good:* "Son A performs daily care roles; Son B holds legal proxy but is geographically distant. Care plan prioritizes Son A for daily preferences, Son B for major medical consent."

  This trains them to see the *structure* of the conflict, not just the emotion. It keeps your notes defensible (factual description of roles) while guiding your internal logic with the ethics you find useful.
