  1. The precise question
  Strawson's framework rests on a binary: we either take the reactive stance toward agents (responding to quality of will) or the objective stance toward objects (managing causality). The literature assumes reactive attitudes are strictly interpersonal. But we frequently feel indignation toward bureaucracies or structural racism—entities without a unified mind. Current debates stall here: either we reduce this to blame against specific individuals (ignoring the structural nature) or classify it as objective management (losing the moral force). This leaves a gap. If these are reactive attitudes, Strawson's map is incomplete. If they aren't, our moral phenomenology is misdescribed. The question is whether accommodating system-directed attitudes forces us to abandon Strawson's compatibilism or whether it reveals the reactive stance is even more robust than he claimed, surviving even when individual agency is diluted. Risk is misclassifying moral anger as mere management.

  2. The angle
  Focusing on system-directed attitudes isn't just adding a category; it's a methodological correction to how we validate responsibility practices. Standard compatibilist defenses often get stuck arguing about individual freedom conditions. By shifting to the attitudes themselves, we bypass the metaphysical bottleneck. My stance is definite: recognizing these attitudes really sharpens Strawson's conclusion. It shows that our commitment to holding entities accountable doesn't rely on pinpointing libertarian free will in a specific human brain. Instead, it reveals the reactive stance is a flexible social technology, not just a psychological reflex. Revising the binary to include system-directed reactions demonstrates that determinism threatens nothing because our practices never required the sharp individualist ontology Strawson presupposed. This move secures the compatibilist flank against structural skepticism.

  3. Month-by-month method
  Months 1-2: Conceptual groundwork. I'll define system-directed reactive attitudes distinct from displaced individual blame. The goal is to isolate the phenomenology of institutional indignation. I need to show it involves holding accountable, not just managing risk. I will examine the necessary conditions for a quality of will analogue in non-human systems.
  Months 3-4: Case testing. I'll apply this to hard cases: corporate negligence where no single agent is culpable, and algorithmic bias. I'll test whether these elicit genuine resentment or merely objective adjustment. This involves comparing intuitive responses against Strawson's criteria for quality of will to see where they break or hold.
  Months 5-6: Synthesis and comparison. I'll contrast this revised framework with leading collective responsibility accounts to ensure I'm not just reinventing existing wheels. The aim is to integrate the findings into a tripartite model (Individual-Reactive, System-Reactive, Objective). I'll draft the core argument showing how this preserves the anti-skeptical thrust of Freedom and Resentment while fixing its blindspot regarding structural injustice.

  4. Success vs failure
  Success means producing a coherent tripartite model that preserves Strawson's anti-skeptical conclusion. If I can show system-directed attitudes are genuinely reactive without requiring metaphysical agency, the project succeeds. It proves responsibility practices are robust enough to cover structural harm. Failure looks like collapsing back into the standard view. If system attitudes turn out to be merely objective management disguised as moral anger, the revision really fails. I need to avoid the trap where accommodating them forces us to admit determinism undermines responsibility in structural cases.

  5. Scope and delieverable
  The timeline is tight but feasible for a conceptual project. Over six months, I'll produce a manuscript suitable for a top journal. The final deliverable is a revised framework document, roughly 8,000 words. A useful outcome isn't just a paper; it's a tool for responsibility theorists. It should allow compatibilists to engage with structural injustice without conceding ground to skeptics. This makes the theory more usable for practicioners working on ethics of AI or institutional reform.
