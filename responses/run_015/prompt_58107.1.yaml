      *   *Criterion 4: Permutation Invariance.* Swapping people's locations shouldn't change value.
          *   *Status:* Preference/Controversial. In infinite sets, swapping can turn a "good" sequence into a "bad" one relative to time.
      *   *Criterion 5: Transitivity.* If A > B and B > C, then A > C.
          *   *Status:* Non-negotiable for rational choice.

  5.  **Addressing Impossibility Theorems:**
      *   *Diamond-Basu-Mitra Theorem:* You cannot satisfy Strong Pareto + Intergenerational Equity (Anonymity) + Completeness/Transitivity in infinite utility streams.
