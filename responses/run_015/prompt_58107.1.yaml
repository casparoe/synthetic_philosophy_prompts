      *   *Equity/Fairness:* Don't sacrifice the few for the many indefinitely. (The "Early Colonies" problem).
      *   *Sensitivity:* Adding a good person should matter. (The "One More Colony" problem).
      *   *Permutation Invariance:* Location shouldn't matter, only the distribution. (Controversial in infinite contexts).
      *   *Transitivity/Completeness:* Logic basics.
      *   *Separability:* What happens here shouldn't depend on what happens infinitely far away.

  4.  **Selecting and Refining the Criteria:**
      *   *Criterion 1: Pareto Dominance.* If everyone in World A is at least as well off as in World B, and some are strictly better, A > B.
          *   *Status:* Non-negotiable.
          *   *Conflict:* Conflicts with "Equity" in infinite cases (e.g., shifting utility from rich to poor infinitely).
      *   *Criterion 2: Intergenerational Equity (or Non-Dictatorship of the Future).* We can't just sacrifice the first $N$ generations forever for a tiny gain later.
