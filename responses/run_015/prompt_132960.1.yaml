answer: |-
  The standard bioethical distinction between therapy and enhancement relies on a stable reference point: species-typical functioning. Therapy restores an individual to this baseline; enhancement pushes them beyond it. *Gattaca* destabilizes this architecture by presenting a society where the baseline itself has been engineered. In this context, the film does not merely illustrate the dangers of eugenics; it ontologically collapses the boundary between correcting a defect and enhancing a trait. By shifting the statistical norm through generations of germline editing, the narrative demonstrates that "health" becomes a moving target, rendering the therapy/enhancement distinction circular. Vincent Freeman is not biologically dysfunctional in a historical sense, yet within the film's diegesis, he is pathologized. His condition is not a failure of organ function—he swims, runs, and endures—but a failure to meet an artificially constructed standard of optimization. Thus, what was once natural variation is reclassified as a defect requiring "therapy" (in the form of exclusion or genetic masking), while the engineered state, though exceeding historical human norms, is reclassified as routine hygiene.

  The "moving baseline" problem is most visceral in the medical screening scenes. Here, Vincent's heart condition is treated simultaneously as a biological reality and a bureaucratic disqualification. The screening does not measure current incapacity; it measures probabilistic risk. Vincent's heart beats effectively, yet the bureaucracy treats the statistical probability of future failure as a present functional deficit. In a standard therapeutic framework, a condition is treated when it impairs functioning. In *Gattaca*, the impairment is social, not somatic. The film forces us to ask: if the population norm is engineered to eliminate risk, does the presence of risk constitute a disease? The narrative suggests that in a hyper-optimized society, the "therapy" is no longer about healing the sick but about aligning the citizen with the engineered norm. Vincent's "defect" is that he is a relic of a previous baseline. Consequently, the distinction between therapy and enhancement dissolves; the "therapy" applied to the valids at conception was actually enhancement relative to the historical human norm, but it is linguistically and socially coded as basic care. Vincent, by remaining natural, is not "healthy" by this new metric. He requires a "cure" not for his heart, but for his identity.

  The swimming competitions between Vincent and his brother Anton complicate this further by juxtaposing genetic destiny against disciplined achievement. Anton represents the enhanced baseline: superior strength, lung capacity, and predicted longevity. Vincent represents the natural baseline: statistically prone to failure. When Vincent defeats Anton in "chicken," he challenges the necessity of the enhancement paradigm. He demonstrates that the engineered baseline does not guarantee superiority in all contexts, particularly those involving will and risk tolerance. However, the film refuses a simplistic triumph of spirit over science. Vincent wins the swim, but he cannot win the career. This dichotomy exposes the hollowness of the therapy/enhancement distinction in a stratified society. Even if the "natural" human can exceed the "enhanced" human in performance (challenging the idea that enhancement is functionally superior), the social system treats the engineered genome as the requisite baseline for entry. The swim proves Vincent's physical capacity is species-typical or even superior; the employment screening proves his genetic signature is sub-typical. The film thus separates *capacity* from *credential*. The therapy/enhancement distinction usually concerns capacity; *Gattaca* reveals that in practice, it functions as a credentialing system. Vincent's heart is not a disability in the water, but it is a disability at the urinal.

  The resolution of the film—Vincent's departure for Titan—offers a complex philosophical argument regarding the relevance of the genetic baseline. On one level, Vincent's success argues that the baseline is irrelevant to human achievement; his will allowed him to transcend his genetic probability. However, a closer reading suggests the film ultimately reinstates the enhancement paradigm, albeit ironically. Vincent does not succeed *as* Vincent; he succeeds *as* Jerome. He must fabricate an enhanced persona to access the opportunity to demonstrate his natural competence. If the film argued that the baseline was truly irrelevant, Vincent would have been accepted on his merits alone. Instead, the narrative confirms that the social structure requires the mask of enhancement. Vincent's triumph is not the validation of the natural human, but the exposure of the system's inability to distinguish between the two. He validates the *potential* of the natural genome, but he validates the *necessity* of the enhanced label. This suggests that the therapy/enhancement distinction is not a biological boundary but a gatekeeping mechanism. The "therapy" Vincent needed was not cardiac repair, but genetic passing.

  In concluding what *Gattaca* adds to the philosophical debate that a purely argumentative essay cannot, we must look to the phenomenological weight of the cinematic medium. A philosophical essay can define the "moving baseline" abstractly, but the film embodies the anxiety of living within one. The close-ups on the urine sample, the scraping of the skin cells, the frantic cleaning of the keyboard—these visual textures communicate the somatic cost of the therapy/enhancement distinction in a way prose often fails to capture. The film makes the baseline feel physical. It shows that when the norm is engineered, the "invalid" does not just suffer from discrimination; they suffer from a constant, bodily threat of exposure. The cinematic narrative reveals that the therapy/enhancement distinction is not merely a categorization problem for ethicists, but a lived reality of surveillance for the subject. It demonstrates that when the baseline moves, the burden of "therapy" shifts from the doctor to the individual, who must constantly perform health to avoid being categorized as defective. *Gattaca* supplies the emotional and sensory stakes of the baseline shift, transforming a conceptual ambiguity into a tangible crisis of identity. It forces the viewer to feel the instability of the norm, rather than just think about it.
