prompt: |-
  hey, so I'm in 11th grade and me and two friends (Priya and Sam, Sam mostly shows up for the cookies) run a tiny puzzle club, and we've somehow been given about forty minutes of the winter assembly in Febuary to run a puzzle hunt for the whole school. I want a good chunk of it to be Bongard problems — you know, six little figures on the left that all share some rule, six on the right that break it, and you have to say what the rule is. I've written maybe fifteen and the problem is I have no idea which ones actually work: I just stare at each one until it feels right, and then Priya solves one in ten seconds for a reason I never intended and I have to bin it. So I want a real procedure I can run by myself on a Sunday, a few minutes per problem, with the tests in a fixed order and a clear verdict at the end — cut it, fix it, or ship it — including the places where the procedure has to stop and admit it's just my taste and someone has to make a judgement call.

  Here's the half-baked version I'm working from, which I mostly made up, so tell me which of these are actual failure modes and what I'm missing: (a) deadline rules — a rule that fits the left six but is obviously not the one you meant, like everything on the left being drawn before 2030 or being the ones I happened to draw first; (b) rules that are really about how I drew them rather than about the shapes — all the left ones bigger, or thicker lines, or done with a ruler; (c) rules where you have to count something nobody would think to count, or count it in a weird way; (d) the right-hand boxes each breaking the rule for a different unrelated reason, so there's nothing to learn from them. The tests I use are: the swap-one test (switch one figure from each side and see if the rule still reads obviously), the redraw test (redraw everything cruder and smaller and see if the rule survives), the three-per-side test (if it's still solvable with only three figures per side it's too easy), and being able to state the rule in under ten words. The thing I'm most unsure about is Priya's idea, which I think is the best thing in my notes: for every problem you should also write down the near-miss rule, the most tempting wrong answer, and then build the right-hand boxes so that they specifically kill that rule — I don't really know how to do that in practice, or whether it just makes the problems easier. I also don't know how to tell good-hard from just-hard, and I don't know whether rules about relations between the figures inside one box (or between the two boxes) are legit or a kind of cheating.

  So: fix the procedure first, then run it on these three and rank them, and please actually commit instead of saying it depends on my audience. One: closed blob shapes, left side each has exactly one small dot strictly inside the outline, right side has the dot outside, or two dots inside, or no dot — I'm worried the right side fails in six unrelated ways. Two, which is my favorite: each box has three to five little shapes, and on the left every shape has a partner somewhere else in the same box that's the same shape rotated 180 degrees, while on the right at least one shape has no upside-down partner — is that even a real Bongard problem, and is defining the right side by a failure hopeless? Three: vertical mirror symmetry, left symmetric, right not, except I drew the left ones with a ruler and compass so they're bigger and neater and the right ones freehand and small, and Priya got it instantly by saying the neat ones, so she never had to see symmetry at all — I say redraw it, she says cut it, you pick. And then, somewhere in there, why does any of this work at all? Six examples obviously can't pick out one rule from the infinity of rules that fit them, so what makes a solver land on the one I meant — simplicity, or just that we all share a sense of which ways of carving up shapes are natural? And does that mean Bongard problems are actually a decent little model of learning a concept from a handful of examples, or a misleading one? Take a definite side on that too, tell me where you're confident and where you're guessing, and don't just lay out the options for me to choose between — I'd rather be told I'm wrong about something specific.
