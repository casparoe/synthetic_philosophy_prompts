answer: |-
  Your hunch is correct that this is not a factual disagreement waiting on an empirical breakthrough, but your diagnosis of "which toy cases count as data" is slightly off. It is not a dispute about evidence selection; it is a dispute about **metaphysical grounding**. Specifically, the two sides are disagreeing on the **supervenience base** of moral value—that is, they cannot agree on *what kind of physical or computational property* moral weight attaches to.

  **The Diagnosis**
  This is a **normative ontology dispute**. Both sides agree on the physics (the code runs, the cache hits, the electrons move), but they disagree on which of those physical facts constitute the "stuff" that morality cares about.

  *   **Camp 1 (Counting Runs)** is committed to **Intrinsic Computationalism**. They believe moral value supervenes on the *instantiation of a computational structure* itself. If the state sequence associated with "suffering" exists physically, the harm exists, regardless of whether that state influences anything else. To them, a replay is a second instantiation of the pattern, hence a second unit of harm.
  *   **Camp 2 (Causal Role)** is committed to **Extrinsic Functionalism**. They believe moral value supervenes on the *causal power* or *integration* of that computation within a larger system. To them, a computation that is causally isolated (like a cached replay that doesn't alter future states) is morally inert, akin to a recording of a scream rather than a scream itself.

  They are talking past each other because Camp 1 treats moral value like **mass** (intrinsic, additive), while Camp 2 treats it like **velocity** (relational, dependent on context).

  **What Counts as Progress**
  Since this is not empirical, a standard experiment cannot solve it. Progress would require a **formal reductio ad absurdum** that forces one side to abandon their grounding principle to avoid untenable consequences.

  1.  **For Camp 1:** A formal result showing that "counting runs" leads to **moral inflation**. If any physical system can be interpreted as running a suffering sim via arbitrary mapping (pancomputationalism), does a rock contain infinite suffering? If Camp 1 cannot define a non-arbitrary boundary for what counts as a "run" without invoking causal role, their position collapses.
  2.  **For Camp 2:** A thought experiment showing that "causal role" leads to **moral evaporation**. If a suffering sim is causally isolated but internally identical to a connected one, does the harm vanish simply because no one observes the output? If Camp 2 cannot explain why the *first* run mattered (which also eventually becomes past history/cache) without contradicting their own criteria, their position weakens.

  Progress is achieved not by new data, but by forcing either side to accept a **boundary condition** that limits their theory without contradicting their core intuition.

  \answer{Conceptual framework clash}
