answer: |-
  ### Phase 1: Conceptual Mapping & Brainstorming

  Before specifying the criteria, we must map the moral topology of your situation. You occupy a contradictory position common in urban ethics but rare in personal experience: you are a victim of *unprotected supply-side intervention* (displaced by conversion following upzoning) and simultaneously a trustee of *local democratic authority* (council member facing exclusionary pressure). This dual vantage point reveals that the standard binary—YIMBY (supply) vs. NIMBY (exclusion)—is insufficient.

  **Core Moral Phenomena:**
  *   **The Property/Residence Split:** Ownership confers a right to exclude, but residence confers a claim to remain. When these diverge (renter vs. landlord), justice requires prioritizing the human need for shelter over the capital right to optimize asset value, yet without destroying the incentive to maintain housing stock.
  *   **The Public/Private Boundary:** Zoning is state power, but it is often used to enforce private preferences (views, quiet, homogeneity). When public infrastructure (transit, schools) is capitalized into private land values via exclusion, the state is effectively subsidizing private club membership.
  *   **The Temporal Conflict:** Current residents hold vested interests based on past rules. Future residents hold needs based on future realities. Democratic systems privilege the present; justice often requires privileging the future or the absent.
  *   **The Scale Mismatch:** Housing markets are regional; political accountability is local. Local officials are incentivized to export costs (homelessness, traffic) and import benefits (tax base).

  **Legal & Economic Tensions:**
  *   **Regulatory Takings vs. Public Nuisance:** Does downzoning protect investment-backed expectations, or does upzoning correct a nuisance-like exclusion of neighbors?
  *   **Filtering Lag:** Supply reduces prices over time, but displacement happens immediately. A theory of justice cannot ask the displaced to wait for the long-run equilibrium.
  *   **The Veto Problem:** If local democracy has veto power over regional needs, regional justice is impossible. If regional authority has veto power over local design, local autonomy is hollow.

  **Conceptual Distinctions Required:**
  *   *Exclusion* (keeping people out) vs. *Preservation* (keeping things intact).
  *   *Property Right* (title) vs. *Occupancy Right* (habitability).
  *   *Procedural Justice* (process was followed) vs. *Distributive Justice (outcome is fair).*

  ---

  ### Phase 2: The Desiderata for a Theory of Residential Entitlement

  An adequate theory must function as a adjudicative framework for zoning boards, not just a manifesto. It must navigate the space between the libertarian claim (absolute dominion) and the command-state claim (absolute allocation). Below are the six necessary criteria.

  #### 1. The Decoupling of Residence from Exclusion
  *   **The Requirement:** The theory must distinguish between a right to *secure tenure* (protection from arbitrary eviction/displacement) and a right to *exclude others* from the surrounding geography. It must establish that while a homeowner has a right to privacy and quiet enjoyment of their lot, they do not have a vested property right in the exclusionary character of the neighborhood or the scarcity value of their zoning district.
  *   **Motivating Case:** Your displacement. The owner exercised a right to exclude (by selling/converting) that extinguished your right to reside. Conversely, your neighbors now exercise a right to exclude (blocking infill) claiming it protects their residence. Collapsing these rights allows current residents to veto the housing needs of non-residents, treating the city as a private club rather than a public ecosystem.
  *   **Status:** **Non-Negotiable.** Any theory that conflates the right to keep others out with the right to stay in fails the basic test of urban coexistence.

  #### 2. The Dissolution of Exclusionary Amenity Bundling
  *   **The Requirement:** The theory must treat access to public goods (schools, parks, transit) as a separable entitlement from land ownership within specific zoning boundaries. It must prohibit land-use regulations that function primarily to restrict access to public infrastructure to a specific wealth class.
  *   **Motivating Case:** Single-family zones near high-frequency transit. When zoning restricts density near transit, it artificially caps the number of people who can access that public investment. This turns public infrastructure into a private amenity for those who can afford the scarce land nearby. This is a form of rent-seeking using state police power.
  *   **Status:** **Non-Negotiable.** Public investment cannot be morally capitalized into private exclusionary rights without violating distributive justice.

  #### 3. The Hierarchy of Authority (Local vs. Regional)
  *   **The Requirement:** The theory must explicitly resolve the tension between local democratic control and regional housing needs. It must acknowledge that **full satisfaction of both is jointly impossible** under standard assumptions. Therefore, it must establish a hierarchy: regional housing needs constitute a constraint on local discretion, not a suggestion. Local democracy is permitted over *design and placement*, but not over *quantity and eligibility* when regional deficits exist.
  *   **Motivating Case:** Your neighborhood council meetings. Residents invoke "local control" to block infill. If every neighborhood exercises veto power, the region fails to house its workforce. However, if the state commands everything, local knowledge is lost. The theory must validate local input on *how* building happens, but invalidate local veto on *whether* it happens when regional targets are unmet.
  *   **Status:** **Non-Negotiable (with structural trade-off).** This is the hardest conceptual work. It requires admitting that local democracy is illegitimate when it functions as a cartel to restrict supply.

  #### 4. Consistency with Economic Dynamics without Reductionism
  *   **The Requirement:** The theory must accommodate supply constraints, filtering effects, and induced demand as *empirical constraints* on justice, not as *definitions* of justice. It must recognize that increasing supply is necessary for long-term affordability but insufficient for immediate protection against displacement. Justice cannot wait for the market to filter, but it cannot ignore the market without causing scarcity.
  *   **Motivating Case:** The upzoning that led to your displacement. Pure supply-side theory says "upzoning lowers rents." Your experience says "upzoning enabled conversion." A valid theory must mandate supply increases *coupled with* immediate tenure protections (e.g., right of first refusal, eviction caps) to bridge the gap between construction and filtering.
  *   **Status:** **Non-Negotiable.** Ignoring economics leads to unbuildable mandates; ignoring justice leads to displacement.

  #### 5. Intergenerational Equity vs. Spatial Lock-In
  *   **The Requirement:** The theory must weigh the "investment-backed expectations" of current homeowners against the fundamental needs of future residents and those currently excluded from the jurisdiction. It must establish that locational privilege accumulated under past exclusionary regimes does not confer a moral right to perpetuate that exclusion indefinitely.
  *   **Motivating Case:** Long-time residents claiming "stability." Stability often means "stability of property values derived from scarcity." Future residents have no vote but bear the cost of that scarcity (longer commutes, higher rents). The theory must prioritize the basic housing needs of the future/excluded over the value-appreciation expectations of the present.
  *   **Status:** **Non-Negotiable.** A theory that privileges the status quo merely because it is the status quo is morally inert.

  #### 6. The Preservation/Exclusion Boundary Test
  *   **The Requirement:** The theory must provide a test to distinguish legitimate preservation (ecological limits, genuine historical commons, anti-displacement) from illegitimate exclusion (aesthetics, "scale," "character"). The burden of proof must lie on those claiming exclusion is necessary to demonstrate a tangible public harm, not merely a change in visual environment or property value trajectory.
  *   **Motivating Case:** Neighbors blocking multi-family infill due to "compatibility." "Character" is often a proxy for class and racial homogeneity. Legitimate preservation protects shared goods (a historic landmark, a floodplain); illegitimate exclusion protects private advantages (views, quiet, homogeneity).
  *   **Status:** **Non-Negotiable.** Without this distinction, "preservation" becomes a loophole for all exclusion.

  ---

  ### Phase 3: Stress Testing Competing Theories

  Here we evaluate the three dominant frameworks against the desiderata above. The goal is to identify which requirement causes the most structural damage to each.

  #### 1. Market-Libertarian Exclusion (Zoning as Private Covenant)
  *   **Core Thesis:** Zoning should mimic private covenants; property owners have a right to determine the use of their land and associate with whom they choose. Local control is paramount.
  *   **Score:**
      *   *Residence vs. Exclude:* **Fail.** Treats exclusion as a core property right.
      *   *Amenity Bundling:* **Fail.** Views public goods access as a function of land purchase.
      *   *Local vs. Regional:* **Pass (Local).** Prioritizes local control absolutely.
      *   *Economics:* **Pass.** Relies on market efficiency.
      *   *Intergenerational:* **Fail.** Privileges current title holders.
      *   *Preservation/Exclusion:* **Fail.** Cannot distinguish aesthetically motivated exclusion from legitimate property rights.
  *   **Critical Failure:** **Requirement #2 (Amenity Bundling).** This theory collapses when public infrastructure (transit, schools) is involved. You cannot treat access to publicly funded transit as a private club good without violating the public trust. This theory justifies the exact mechanism that displaced you (conversion for profit) while empowering your neighbors to block infill.

  #### 2. Progressive Inclusionary Model (State Mandates + Anti-Displacement)
  *   **Core Thesis:** The state must mandate upzoning to meet regional needs, coupled with strict tenant protections, rent control, and inclusionary zoning requirements to prevent displacement.
  *   **Score:**
      *   *Residence vs. Exclude:* **Pass.** Prioritizes tenure security.
      *   *Amenity Bundling:* **Pass.** Seeks to decommodify access.
      *   *Local vs. Regional:* **Pass (Regional).** Prioritizes regional needs via preemption.
      *   *Economics:* **Mixed.** Sometimes ignores supply constraints or cost burdens of mandates.
      *   *Intergenerational:* **Pass.** Prioritizes future/excluded residents.
      *   *Preservation/Exclusion:* **Pass.** Skeptical of aesthetic claims.
  *   **Critical Failure:** **Requirement #3 (Local vs. Regional) - The Democratic Deficit.** While this model scores well on justice, it often fails to provide a legitimate role for local democratic input beyond complaint. It risks treating neighborhoods as mere containers for state quotas. In your council role, this theory gives you little ammo to negotiate *design* or *pace*, only to enforce compliance. It solves the regional crisis but risks alienating the local community necessary for long-term stability.

  #### 3. Lefebvrian "Right to the City" (Participatory Production)
  *   **Core Thesis:** Urban space should be produced by those who inhabit it. Emphasis on radical democracy, use-value over exchange-value, and community control over development.
  *   **Score:**
      *   *Residence vs. Exclude:* **Mixed.** Prioritizes current inhabitants' right to stay, sometimes at the expense of newcomers.
      *   *Amenity Bundling:* **Pass.** Views space as a social product.
      *   *Local vs. Regional:* **Fail.** Often devolves into hyper-localism.
      *   *Economics:* **Fail.** Often lacks a mechanism for rapid scaling or financing.
      *   *Intergenerational:* **Fail.** Privileges those currently present to decide.
      *   *Preservation/Exclusion:* **Mixed.** "Community character" can be reinterpreted as exclusionary.
  *   **Critical Failure:** **Requirement #1 (Residence vs. Exclude) & #5 (Intergenerational).** This theory is most damaging to *your* situation as a displaced renter. If "right to the city" is interpreted as the right of *current* inhabitants to decide production, you (the displaced) have no seat at the table. It often empowers the NIMBYs on your council who claim "community control" to mean "no new people." It solves the alienation of planning but fails the urgency of housing supply.

  ### Synthesis: The Hardest Conceptual Work

  The single requirement that does the most damage to popular theories is **Requirement #3 (The Hierarchy of Authority)**.

  *   It destroys the **Libertarian** claim that local property owners can veto regional needs.
  *   It challenges the **Lefebvrian** claim that current inhabitants should fully control production (since they will exclude outsiders).
  *   It pressures the **Progressive** model to explain why state preemption is democratically legitimate rather than merely technocratic.

  **Conclusion for Your Context:**
  You need a **Hybrid Fiduciary Model**.
  1.  **Regional Body:** Sets binding housing targets based on jobs/transit (satisfies #3, #5).
  2.  **Local Council:** Controls design, pacing, and community benefits agreements, but *cannot veto* compliance with targets (satisfies #3, #6).
  3.  **Tenant Protections:** Automatic right of first refusal and relocation assistance triggered by any zoning change or conversion (satisfies #1, #4).

  This acknowledges your dual reality: You need the region to force supply (to solve the crisis), but you need the state to protect you from the market violence that supply-side changes can unleash on existing renters (to solve your displacement). The theory must treat housing as a **public utility** rather than a pure commodity or a pure democratic vote.
