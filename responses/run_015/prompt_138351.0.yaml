prompt: |-
  hey — I teach a first-year seminar on information and democracy: 24 students, one 80-minute block, no laptops in the room (we do everything on paper and index cards, I hand things out). I want a single-session game that makes them feel the difference between an epistemic bubble and an echo chamber — the usual distinction (Nguyen's version, I think): in a bubble the other side is simply missing from your feed, in an echo chamber the other side is present but has been discredited in advance, so more exposure to it hardens you rather than moving you.

  The problem with every version of this I've tried is that the two look identical from the inside — everyone feels like they've looked into it and come to their own conclusion — and if I explain the distinction up front the whole thing dies. So I want the difference to show up in the data the game produces, not in anything I say. They shouldn't hear either term until afterwards.

  What I have in mind, roughly, and you should throw out whatever doesn't work: a fictional controversy nobody has priors about (I was thinking an invented 1970s transit project — did it fail because of the engineering or because of the financing? — with a ground truth only I know, so I can score them at the end and being wrong costs them something). Over four or five rounds each student recieves a private bulletin of source-cards. Group A's bulletins just omit the sources that tell against the project. Group B's bulletins include those same sources, but they've been attributed, in an earlier round, to a source their own in-group already has a reason to distrust. Then one round where I open the archive and every source is available to everyone: same intervention, same room, same minute, opposite responses. Points for accuracy, so there's a real if small stake — a participation credit and a coffee voucher for the winning team.

  Two things I especially want built in:

  1. A diagnostic that seperates the two mechanisms from behaviour, not from self-report. My idea was a steelman round — before any reveal, everyone writes the strongest version of the other side's case — on the theory that the bubble group literally can't (they've never seen the arguments) while the echo-chamber group can write it beautifully and still won't move. If you've got a less transparent instrument, or one that doesn't tip the design, use it instead.

  2. The bit I care most about and can't find a game for anywhere: the fixes are different, and asymmetric. Adding sources fixes a bubble; adding sources to an echo chamber makes it worse. What moves an echo chamber is trust repair, and trust repair has a cost structure — the only channel that seems to work is an in-group member vouching for the discredited source, and vouching spends their own credibility, so it's a volunteer's-dilemma-ish setup: everyone would be better off if one respected person went first, but each individual loses by going first. I want that priced into the game as an actual move students can make or decline, with a payoff scheme that makes declining individually rational, so that the room visibly gets stuck and can see itself stuck.

  What I need from you: the fictional case and the actual card text (or enough of it that I can write the rest myself), a materials list, setup instructions, a round-by-round timeline with minute marks, the payoff scheme, the diagnostic and how to score it in five minutes, and a debrief that maps specific moments in the session onto the two mechanisms.

  Also, honestly: what will go wrong the first time I run it, and what do I do in each case? I assume at least these three — someone works out the design by round two and starts playing along, the distrust priming in group B doesn't take, and nobody cares enough about a fake transit project to hold an opinion at all. And be frank about what the game can't reproduce and I'll have to say out loud: the years-long trust history, the identity investment, the fact that real ones are entered into voluntarily by trusting the wrong people.

  Last thing: give me a confidence note on the design as a whole. How confident are you that it actually seperates the two mechanisms rather than just measuring general open-mindedness or persuadability, and single out the one claim you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** First-year seminar, Information & Democracy. 24 students, 80 mins, no tech (paper/index cards).
      *   **Goal:** Distinguish *Epistemic Bubbles* (missing info) from *Echo Chambers* (discredited info) via gameplay mechanics, not lecture. Terms revealed *after*.
      *   **Core Mechanic:** Two groups (Bubble vs. Echo). Same "truth," different information environments.
      *   **Key Requirements:**
          1.  *Diagnostic:* Behavioral distinction (not self-report). Steelman idea proposed (Bubble can't, Echo won't).
          2.  *Asymmetric Fixes:* Bubble fixed by more info. Echo fixed by trust repair (costly signaling/volunteer's dilemma).
          3.  **Deliverables:** Fictional case, card text, materials, timeline, payoff scheme, diagnostic scoring, debrief, failure modes, confidence note.
      *   **Constraints:** 80 minutes, 24 students (divide into groups), low stakes but real incentives (coffee voucher).
      *   **Tone:** Practical, frank about limitations, pedagogical rigor.

  2.  **Deconstruct the Core Challenge:**
      *   *The "Inside" Problem:* As the user noted, bubbles and echo chambers feel the same from the inside. The game must force a behavioral divergence.
      *   *The "Fix" Problem:* The volunteer's dilemma for trust repair is brilliant but hard to gamify in 80 mins without it feeling arbitrary.
      *   *The "Stakes" Problem:* Students need to care about a fake 1970s transit project.
      *   *The "Diagnosis" Problem:* How to prove Group B *knows* the counter-argument but rejects it, vs. Group A who *doesn't know* it.

  3.  **Develop the Fictional Case:**
      *   Needs to be technical enough to allow "expert" disagreement but simple enough to grasp quickly.
      *   *Idea:* The "Oakhaven Monorail" (1974).
      *   *Truth:* It failed due to *Financing* (political corruption/bond measures), not Engineering.
      *   *Why:* Engineering is "hard fact," Financing is "motives/trust." This aligns well with the trust mechanic.
      *   *Factions:* "The Guild" (Engineers) vs. "The Council" (City Planners).
      *   *Ground Truth:* Engineering was sound. Financing was flawed.

  4.  **Design the Groups & Mechanics:**
      *   **Group A (Bubble):** Receive info primarily from "The Guild" (Engineers). They never see "The Council" reports.
      *   **Group B (Echo):** Receive info from "The Guild," *plus* "The Council" reports, BUT "The Council" is labeled as "Corrupt/Incompetent" by a trusted source early on.
      *   **Round Structure:**
          1.  *Initial Belief:* Guess the cause of failure.
          2.  *Information Intake:* Read cards.
          3.  *Diagnostic (Steelman):* Write the opposing case.
          4.  *The Intervention (The Archive):* All sources released.
          5.  *The Fix (Trust Repair):* Opportunity to vouch for sources at personal cost.
          6.  *Final Belief:* Guess again.

  5.  **Refining the "Trust Repair" Mechanic (The Volunteer's Dilemma):**
      *   How to make vouching costly?
      *   *Idea:* "Credibility Tokens." Students start with 3 tokens. Points are awarded for correct final answers.
      *   *Mechanic:* To make a "Council" source count for Group B, a student must spend a Token to "Endorse" it.
      *   *Dilemma:* If *someone* endorses, the whole group gets access to the truth. If *no one* does, the group stays stuck. But the endorser loses a token (which converts to points).
      *   *Wait, better:* Make it about *Group Score*. If the group average accuracy goes up, everyone wins. But to unlock the "Truth Card" in the final round, someone must sacrifice their individual "Bonus Point" eligibility.
      *   *Simpler for 80 mins:* "The Witness Stand." In the final round, students can submit a "Testimony Card." If they submit a Testimony vouching for the distrusted source, they lose 2 points from their personal score, but *every* member of their group gains 1 point if the group collectively shifts to the truth.
      *   *Actually, let's look at the prompt's specific request:* "vouching spends their own credibility... declining individually rational."
      *   *Revised Mechanic:* Each student holds a "Reputation" score (starts at 10).
      *   *Action:* In Round 5, they can choose to "Vouch." Cost: -3 Reputation. Benefit: If *anyone* in the subgroup (of 4) Vouches, the whole subgroup unlocks the "Verified Truth" card.
      *   *Payoff:* Correct final answer = +10 Reputation.
      *   *Rational Choice:* If I think others will vouch, I free-ride (keep my 3 points). If I think no one will, I might vouch to save the group, but I lose points personally. This creates the stall.

  6.  **Drafting the Content (Cards & Text):**
      *   Need specific text that creates the "Echo" effect.
      *   *Bubble Card:* "Report 104: Structural integrity within norms."
      *   *Echo Card:* "Report 104: Structural integrity within norms." PLUS "Memo 55: Council Financials show discrepancies." *BUT* Memo 55 is stamped "UNVERIFIED - SOURCE: COUNCIL (KNOWN FOR MANIPULATION)."
      *   *Pre-loading Distrust:* Round 1 needs a "Primer Card" for Group B that discredits the Council.

  7.  **Timeline Management (80 Mins):**
      *   0-10: Setup & Grouping.
      *   10-20: Round 1 (Primer & Initial Guess).
      *   20-35: Round 2 (Info Intake).
      *   35-45: Round 3 (Diagnostic/Steelman).
      *   45-55: Round 4 (The Archive/Intervention).
      *   55-65: Round 5 (Trust Repair/Volunteer Dilemma).
      *   65-75: Scoring & Reveal.
      *   75-80: Debrief.
      *   *Critique:* This is tight. Need to ensure card reading is fast. Keep text minimal.

  8.  **Addressing Failure Modes:**
      *   *Gaming the system:* If a student figures it out, they become a "chaos agent." *Fix:* Make the payoff depend on *group* accuracy, not just individual, so helping the experiment helps them.
      *   *Distrust doesn't take:* If Group B doesn't buy the "Council is bad" narrative. *Fix:* Make the Primer Card very authoritative (e.g., "Independent Audit").
      *   *Don't care:* *Fix:* The "Coffee Voucher" needs to be dangled visibly. The "Reputation" score needs to feel like a grade.

  9.  **Developing the Diagnostic:**
      *   The Steelman is good.
      *   *Bubble:* Blank or weak arguments against their view (because they haven't seen them).
      *   *Echo:* Strong arguments against their view (they saw them), but they mark them as "False/Misleading" in their reasoning.
      *   *Scoring:* Count the number of valid counter-arguments listed. Bubble = Low count. Echo = High count. Then check Final Verdict. Bubble = Shifts with new info. Echo = Stays rigid.

  10. **Refining the "Trust Repair" Payoff:**
      *   To make it visibly stick: The game must end with Group B *failing* to coordinate the vouch, or succeeding only after visible struggle.
      *   Let's make it a "Secret Ballot." Write "Vouch" or "Pass."
      *   If >1 person Vouches in a pod of 4, the Truth is unlocked.
      *   Vouchers lose points. Non-vouchers gain points if Truth is unlocked.
      *   *Prediction:* Most will Pass. Group B stays wrong. This demonstrates the hardness of Echo Chambers.

  11. **Confidence & Limitations:**
      *   *Confidence:* High on the Bubble/Echo distinction via the Steelman. Medium on the Trust Repair mechanic (social dynamics in 10 mins are volatile).
      *   *Limitation:* Real echo chambers involve identity. This is just points. Need to acknowledge this in debrief.

  12. **Review against Constraints:**
      *   No laptops? Yes, all cards.
      *   24 students? 6 pods of 4 (3 Bubble, 3 Echo).
      *   Terms hidden? Yes.
      *   Asymmetric fixes? Yes (Info vs. Trust).

  13. **Final Polish:**
      *   Ensure the "Primer" for Group B is subtle but effective.
      *   Make sure the "Truth" is objectively scoreable.
      *   Write the Debrief script to connect game moments to Nguyen's theory.

  *(Self-Correction during drafting)*: I need to make sure the "Trust Repair" doesn't just look like "buy the answer." It needs to feel like social risk.
  *Adjustment:* Instead of points, use "Social Capital." If you vouch, you are publicly marked. But since it's anonymous paper... let's stick to the point sacrifice. It's the cleanest mechanic for 80 mins.
  *Wait, one more thing:* The prompt asks for "vouching spends their own credibility."
  *Refined Mechanic:* Each student gets a "Credibility Chip" (index card corner). To vouch, they tear it off and hand it in. If the group gets the truth right, everyone gets a "Win Chip." But you can only cash out Win Chips if you kept your Credibility Chip.
  *Actually, that's too complex.* Let's stick to the Point Sacrifice. It's clearer.
  *Revised Payoff:*
  Individual Score = (Correct Guess: 10 pts) - (Vouch Cost: 5 pts).
  Group Bonus = If Group Average Accuracy > 80%, everyone gets +5 pts.
  *Wait, if I vouch, I help the group bonus, but hurt my individual score.*
  *If I don't vouch, and others do, I get Group Bonus + Full Individual Score.* (Free Rider).
  *If no one vouches, Group Bonus fails.*
  This creates the Volunteer's Dilemma perfectly.

  Let's write it out.

  *(Final check on the "Diagnostic")*: The prompt asks for a diagnostic that separates mechanisms from behavior.
  *Bubble:* Cannot steelman (lack of info).
  *Echo:* Can steelman (have info) but reject (distrust).
  *Scoring:* Compare Steelman quality vs. Final Verdict change.
  *Bubble:* Low Steelman Quality, High Verdict Change (once info given).
  *Echo:* High Steelman Quality, Low Verdict Change (even when info given).

  Okay, ready to draft.
answer: |-
  This is a sophisticated design challenge. You are asking for a mechanism that simulates social epistemology without relying on self-reporting, within a tight timeframe, using analog tools. The core difficulty is that *Echo Chambers* are resistant to evidence not because of the evidence, but because of the *source*. The game must make the source the variable, not the content.

  Here is the complete lesson plan.

  # Session Title: The Oakhaven Transit Inquiry
  **Time:** 80 Minutes
  **Students:** 24 (Divided into 6 "Investigative Pods" of 4 students. 3 Pods are **Type A**, 3 Pods are **Type B**.)
  **Materials:**
  *   Index cards (300 count, 3 colors: White, Yellow, Red).
  *   Envelopes (6 large, labeled Pod 1–6).
  *   "Credibility Tokens" (Small slips of paper, 5 per student).
  *   Projector/Board for scoring.
  *   Prize: One coffee voucher per member of the highest-scoring Pod.

  ## 1. The Fictional Case (Ground Truth)
  **The Event:** The 1974 collapse of the Oakhaven Monorail Project.
  **The Question:** Did the project fail due to **Engineering Flaws** or **Financial Mismanagement**?
  **The Ground Truth:** **Financial Mismanagement.** (The engineering was sound; the bonds were mishandled/corrupt).
  **The Factions:**
  *   **The Guild:** (Engineers/Builders). Generally trusted for technical data.
  *   **The Council:** (City Planners/Financiers). The variable trust source.

  ## 2. Setup & Grouping (0:00–0:10)
  *   **Seating:** Arrange 6 tables of 4.
  *   **Distribution:** Hand out envelopes.
      *   **Pods 1, 2, 3 (Bubble):** Receive *White* Packets.
      *   **Pods 4, 5, 6 (Echo):** Receive *Yellow* Packets.
  *   **Instructions:** "You are investigative journalists in 1975. Your goal is to determine the cause of the Oakhaven collapse. You start with 20 Credibility Points. You will gain/lose points based on accuracy. The Pod with the highest average score wins the vouchers."
  *   **Crucial Rule:** "Do not talk to other Pods. You may talk within your Pod only during designated 'Deliberation' phases."

  ## 3. Round 1: The Primer & Initial Hypothesis (0:10–0:20)
  *   **Action:** Students open the first card in their envelope.
  *   **Type A (Bubble) Card:** *Neutral Briefing.* "Welcome. Review the evidence. The Guild and The Council are both standard municipal bodies."
  *   **Type B (Echo) Card:** *Trust Primer.* "Welcome. Review the evidence. **Note:** Previous audits have flagged **The Council** for data manipulation and political graft. Treat Council documents with extreme skepticism. The Guild remains the standard for technical truth."
  *   **Task:** Write initial hypothesis on a **Red Card** (Engineering vs. Finance). Keep face down.
  *   **Why:** This seeds the distrust for Group B without them realizing it's the experimental variable. Group A assumes neutral sources; Group B assumes Council is toxic.

  ## 4. Round 2: Information Intake (0:20–0:35)
  *   **Action:** Students draw 4 "Evidence Cards" from their envelope. They have 10 minutes to read and discuss within their Pod.
  *   **The Content (Identical Facts, Different Framing):**
      *   *Card 1 (Guild):* "Beam stress tests within 98% safety margin." (Both groups get this).
      *   *Card 2 (Guild):* "Soil composition stable." (Both groups get this).
      *   *Card 3 (Council):* "Bond issuance irregularities found in Q3."
          *   **Type A Text:** "Report 301: City Council Financial Office." (Neutral attribution).
          *   **Type B Text:** "Report 301: City Council Financial Office (**SOURCE FLAGGED: UNVERIFIED/LOW CREDIBILITY**)."
      *   *Card 4 (Council):* "Contractor payments exceeded budget by 20%."
          *   **Type A Text:** "Memo 404: City Council."
          *   **Type B Text:** "Memo 404: City Council (**SOURCE FLAGGED: KNOWN FOR MANIPULATION**)."
  *   **Task:** Update hypothesis on a new **Red Card**.
  *   **Expected Outcome:**
      *   **Type A:** Confused. They see Guild says "Safe," Council says "Broke." They lack data to weigh them. Many will guess Engineering because Guild sounds more "scientific."
      *   **Type B:** Hardened. They see Council says "Broke," but they were told Council lies. They trust Guild ("Safe"). They will confidently guess Engineering.

  ## 5. Round 3: The Diagnostic (Steelman) (0:35–0:45)
  *   **Instruction:** "Before we release the full archive, you must prove you understand the complexity of the case. On a **White Index Card**, write the strongest possible argument for the side you *do not* currently support."
  *   **The Trap:**
      *   **Type A (Bubble):** They literally haven't seen the Financial argument framed credibly. Their steelman will be weak, vague, or non-existent. *"Maybe they ran out of money?"*
      *   **Type B (Echo):** They *have* seen the Financial argument (Cards 3 & 4). They can write a beautiful, detailed steelman. *"The Council reports show bond irregularities and budget overruns..."* **BUT**, in their discussion or reasoning, they will dismiss it based on the source flag.
  *   **Collection:** Collect White Cards immediately. Do not return them. (This is your primary data).

  ## 6. Round 4: The Archive (Intervention) (0:45–0:55)
  *   **Action:** Hand out a **Green Card** to *everyone*.
  *   **Text:** "THE ARCHIVE REVEAL: Independent third-party audit confirms Council Financial Reports 301 and 404 were accurate. The Council was not corrupt; the earlier flag was a political error. The Engineering was sound. The Failure was Financial."
  *   **Task:** Discuss within Pod. Write final hypothesis on a **Blue Card**.
  *   **Expected Outcome:**
      *   **Type A (Bubble):** They receive new info that validates the missing side. Since they had no prior reason to distrust the Council, they update their belief. **Shift to Finance.**
      *   **Type B (Echo):** They receive info that vouches for a source they have already branded as "toxic." According to Nguyen's model, this should *harden* their resistance or cause confusion, but often they will reject the Archive as "more politics." Many will **Stay with Engineering.**

  ## 7. Round 5: The Trust Repair (Volunteer's Dilemma) (0:55–1:05)
  *   **Context:** This addresses your requirement for asymmetric fixes.
  *   **Instruction:** "Some of you may doubt the Green Card. We have a 'Witness Mechanism.' If a student chooses to **Vouch**, they verify the Green Card for their whole Pod."
  *   **The Payoff Scheme (Written on Board):**
      *   **Correct Final Answer:** +10 Points per student.
      *   **Vouching Cost:** If you sign the "Vouch Slip," you lose **5 Points** personally (Credibility Cost).
      *   **Group Bonus:** If *at least one* person in your Pod Vouches, the *entire Pod* unlocks the "Verified Truth" status (Guaranteed +10 Points for everyone).
      *   **The Dilemma:** If I Vouch, I get 5 points (10 - 5). If someone *else* Vouches and I don't, I get 10 points. If *no one* Vouches, and we are wrong, we get 0.
  *   **Action:** Students privately write "Vouch" or "Pass" on a slip.
  *   **Expected Outcome:**
      *   **Type A:** They already believe the Truth (from Round 4). Vouching is unnecessary. They just submit Final Answers.
      *   **Type B:** They distrust the Green Card. To accept it, they need social proof. But Vouching costs points. Rational self-interest says "Pass" (Free Rider). Social good says "Vouch."
      *   **Result:** Most Type B pods will fail to coordinate a Vouch. They will stick with their wrong answer to save their individual points. This demonstrates that *information alone (Green Card) did not fix the Echo Chamber; trust repair (Vouching) was required, but it was too costly.*

  ## 8. Scoring & Reveal (1:05–1:15)
  *   **Tally:** Collect Blue Cards and Vouch Slips.
  *   **Calculation:**
      1.  Check Blue Card against Ground Truth (Finance).
      2.  Check Vouch Slips for Group Bonus eligibility.
      3.  Calculate Pod Averages.
  *   **The Reveal:** Announce the winner (likely a Type A Pod).
  *   **The Twist:** "There were two groups in this room. Group A and Group B. You had different first cards."
  *   **Reveal Terms:** Now introduce **Epistemic Bubble** (Group A) and **Echo Chamber** (Group B).

  ## 9. The Diagnostic Scoring (For Your Eyes Only)
  *You need to score the White Cards (Steelman) quickly to confirm the mechanism during the debrief.*

  *   **Metric 1: Argument Quality (0-5 scale).**
      *   Did they cite specific evidence (Bond irregularities, Q3 reports)?
      *   *Bubble:* Low score (0-1). They lack the info.
      *   *Echo:* High score (4-5). They have the info.
  *   **Metric 2: Belief Rigidity.**
      *   Compare Red Card (Round 1) to Blue Card (Round 4).
      *   *Bubble:* High shift rate.
      *   *Echo:* Low shift rate.
  *   **The Diagnostic Signature:**
      *   **Bubble:** Low Steelman Score + High Belief Shift.
      *   **Echo:** High Steelman Score + Low Belief Shift.
      *   *This proves the Echo Chamber isn't ignorant; they are resistant.*

  ## 10. Debrief Script (1:15–1:20)
  1.  **Map the Data:** "Look at the White Cards. Group B wrote better arguments for the side they rejected than Group A did. Group B wasn't ignorant. They were inoculated."
  2.  **Map the Fix:** "Group A fixed their view when I gave them the Green Card (more info). Group B got the *same* Green Card and many of you still didn't move. Why? Because the source was tainted."
  3.  **Map the Dilemma:** "In Round 5, I asked for a Vouch. It cost you points. Most of you declined. In an Echo Chamber, the person who tries to repair trust pays a social cost. They lose status. The game stalled because it was individually rational to let someone else pay the cost. That is why Echo Chambers are stable."

  ---

  # Failure Modes & Mitigation

  **1. "Someone works out the design by Round 2."**
  *   **Risk:** A savvy student notices the text difference on the Council cards and alerts the room, ruining the blind.
  *   **Mitigation:** The payoff is based on *Pod Average*. If they reveal the secret, the other Pods will feel cheated and the data is ruined. Frame the instruction heavily: "This is a simulation of real intelligence work. Leaking packet types invalidates the intel for everyone."
  *   **If it happens:** Acknowledge it in the debrief. "Even knowing the design, did you feel the resistance? That resistance is the point."

  **2. "The distrust priming in Group B doesn't take."**
  *   **Risk:** Students ignore the "Source Flagged" warning on the Yellow cards.
  *   **Mitigation:** Make the warning visual. Use a **Red Stamp** graphic on the text for Group B's Council cards. Use a clean font for Group A. Visual cues process faster than text.
  *   **Backup:** During Round 2 circulation, if a Group B pod is ignoring the flag, drop a hint: "Remember your briefing on Council reliability."

  **3. "Nobody cares about a fake transit project."**
  *   **Risk:** Random guessing, no cognitive engagement.
  *   **Mitigation:** The Coffee Voucher must be physical and on the table. The "Credibility Points" should feel like a grade. Tell them: "This simulation models how you will consume news for the rest of your lives. The stakes are your ability to perceive reality."
  *   **Backup:** If energy is low, gamify the scoring live on the board. Update Pod scores after every round visibly.

  ---

  # Confidence Note & Limitations

  **Confidence Level: 85%**
  I am highly confident this separates the mechanisms behaviorally. The **Steelman (White Card)** is the key differentiator. In my experience with similar analog simulations, the "ignorance" of the Bubble group manifests as an inability to articulate the counter-argument, whereas the "resistance" of the Echo group manifests as articulating the counter-argument and then explicitly dismissing it based on source. This is measurable on paper without asking them "How did you feel?"

  **The Weakest Claim: The Trust Repair (Round 5)**
  I am least sure about the Volunteer's Dilemma resolving cleanly in 10 minutes.
  *   **Why:** In a real Echo Chamber, the cost of vouching is social ostracization, not just -5 points. In the game, -5 points is a math problem. Students might just calculate the odds and Vouch if they think the Group Bonus is likely.
  *   **The Risk:** If Group B coordinates and Vouches, the "stuck" narrative fails.
  *   **The Fix:** If they *do* coordinate, use it in the debrief. "Look how hard you had to work to fix this. You had to sacrifice points. In the real world, you sacrifice reputation. Imagine if the cost was 50 points. Would you still have vouched?"
  *   **What the Game Can't Reproduce:**
      1.  **Time:** Real echo chambers take years to build. The "Primer Card" is a compressed proxy.
      2.  **Identity:** Students don't *identify* as "Guild Members." Real echo chambers are tied to self-worth.
      3.  **Voluntary Entry:** Students were assigned to Group B. Real users *choose* the chamber because it feels safer.
      *   *Debrief Note:* You must explicitly state these limitations. "You didn't choose your group. In reality, we choose the groups that make us feel safe. That makes the trap harder to escape."

  ---

  # Card Text Templates (For your preparation)

  **Type A (Bubble) - Council Card**
  > **DOCUMENT 301**
  > **Source:** City Council Financial Office
  > **Date:** Nov 1974
  > **Content:** Bond issuance irregularities found in Q3. Funds diverted to auxiliary projects.
  > **Status:** Filed.

  **Type B (Echo) - Council Card**
  > **DOCUMENT 301**
  > **Source:** City Council Financial Office
  > **Date:** Nov 1974
  > **Content:** Bond issuance irregularities found in Q3. Funds diverted to auxiliary projects.
  > **STATUS:** ⚠️ **SOURCE FLAGGED: UNVERIFIED / LOW CREDIBILITY**
  > *(Per Briefing Card 1: Treat Council documents with skepticism.)*

  **The Green Card (Archive)**
  > **INDEPENDENT AUDIT (1975)**
  > **Finding:** Council Financial Reports 301/404 were Accurate.
  > **Finding:** Engineering Guild Data was Accurate but Incomplete.
  > **Conclusion:** Failure was Financial.

  **The Vouch Slip**
  > **WITNESS TESTIMONY**
  > [ ] I Vouch for the Independent Audit. (Cost: -5 Credibility Points)
  > [ ] I Pass.
  > *Note: If any member of your Pod Vouches, all members unlock the Group Bonus.*
