  *Joking:* Students treat rigidity as comedy. *Handling:* Postpone analysis; ask during debrief how humor masked frustration.

  **Debrief Mapping**
  *Rigidity:* Map FP loop-frustration to sphexish mechanical rigidity. Highlight how determinism without revision capability feels like compulsion, undermining control conditions for free will.
  *Flexibility Cost:* Map R writing/waiting burden to the cognitive load of autonomy. Freedom isn't costless; it requires processing power and time.
  *Coordination:* Map failure to move all tokens to the idea that free will requires shared normative structures, not just individual choice. R agents adapted individually but failed collectively due to communication costs, suggesting agency is socially scaffolded.

  **Honest Limits**
