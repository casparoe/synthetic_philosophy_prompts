      *   *Tension:* Duty to remember vs. Duty to forget (Rieff) in an age of permanent digital record/ML.
      *   *Key Question:* Is availability enough, or is active recall required? If machines do the recalling, does the duty shift to accessibility? If forgetting is owed, is "unlearning/unquerying" the new erasure?
      *   *Goal:* Avoid generic memory studies. Focus on the *mechanics* of memory (archives, algorithms) as moral agents/sites of obligation.

  3.  **Brainstorming Framings:**

      *   *Framing A: The Metaphysical/Epistemic Frame.* Focus on the nature of "recall." Does a database "remember"? If not, does the human duty persist? This leans heavily into philosophy of mind and AI.
          *   *Pros:* Deeply philosophical.
          *   *Cons:* Risks becoming abstract/technical. Hard for a journalist to report (interviewing philosophers about AI ontology). Might drift into "what is consciousness" territory.

      *   *Framing B: The Political/Economic Frame.* Focus on the "cost" aspect. Memory as a budget item. Who pays for the server space of trauma? This leans into policy and institutional critique.
          *   *Pros:* Very reportable (budgets, curricula, server costs).
