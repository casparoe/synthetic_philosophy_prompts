      The practice presupposes that welfare consists in preference satisfaction measured by willingness to pay, operationalized as a Kaldor-Hicks efficiency test that deliberately ignores distributional weights to maintain technocratic neutrality.

      Charitably reconstructed, this is not classical utilitarianism but potential Pareto improvement: a regulation is justified if the gains are large enough that winners *could* compensate losers, regardless of whether they actually do. The theory requires a common metric to aggregate intensities of preference, but it does not strictly require revealed preference over stated preference, nor dollars over other units. The money metric is necessary for commensurability, but the source of the valuation is contingent on tractability and legal precedent. The apparatus could run on a hedonic reading or a capabilities reading, provided those goods could be translated into a single numéraire. However, the current system relies on willingness-to-pay because it anchors welfare in actual or hypothetical market behavior, avoiding the paternalism of defining "good" outcomes ex ante.

