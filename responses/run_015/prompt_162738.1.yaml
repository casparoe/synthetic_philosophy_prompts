  Charitably reconstructed, this is not classical utilitarianism but potential Pareto improvement: a regulation is justified if the gains are large enough that winners *could* compensate losers, regardless of whether they actually do. The theory requires a common metric to aggregate intensities of preference, but it does not strictly require revealed preference over stated preference, nor dollars over other units. The money metric is necessary for commensurability, but the source of the valuation is contingent on tractability and legal precedent. The apparatus could run on a hedonic reading or a capabilities reading, provided those goods could be translated into a single numéraire. However, the current system relies on willingness-to-pay because it anchors welfare in actual or hypothetical market behavior, avoiding the paternalism of defining "good" outcomes ex ante.

  The practice is internally inconsistent, particularly regarding cardinality and distribution. The discounting guidance employs a Ramsey formula that assumes cardinal utility comparable across generations, explicitly modeling the diminishing marginal utility of consumption over time. Yet, in the cross-section, the practice insists a dollar is a dollar, ignoring that a dollar yields more welfare for a poor person than a rich one. This contradicts the very welfare function used for time. Similarly, the method assumes welfare is linear in probability to facilitate aggregation, yet it discards survey data where respondents violate this linearity via scope insensitivity. This selective rationality—accepting revealed preference when it fits the model but rejecting it when it displays cognitive bias—suggests the theory is being bent to fit the arithmetic. The proposed move to weight benefits by income is theoretically continuous with the Ramsey logic already in use; it crosses no new philosophical line, only a political one regarding distributional neutrality.

  If the presupposed view were replaced, the regulatory landscape would shift unpredictably. If utility were measured as experienced well-being, regulations protecting against unconscious risks—where people feel no fear—would lose justification, while mandates to reduce pain and suffering would gain traction, potentially monetizing currently qualitative harms. If welfare consisted of objective capabilities, the analysis would forbid monetizing preferences that degrade human functioning but would require monetizing the existence of species regardless of human valuation. Both rivals would license monetizing what is currently qualitative, but the hedonic view would forbid monetizing what the current view allows, while the capabilities view would forbid monetizing "bad" preferences.

  However, the most defensible reading is that the practice presupposes no substantive theory of utility at all, functioning instead as a political technology for constraining agency discretion. On this view, benefit-cost analysis is a procedural rationality tool rather than a welfare maximizer. The dollarization buys a specific kind of transparency: it forces agencies to articulate trade-offs in a single dimension, preventing them from hiding behind incommensurable values to justify regulations with trivial benefits. A multi-column ledger allows decision-makers to prioritize one column while ignoring another; a single net benefit figure creates a hurdle rate that demands justification for overcoming costs. The practice is not committed to the truth of the welfare theory it mimics, but to the discipline imposed by the calculation itself. It commits the people running it not to maximizing welfare, but to demonstrating that their decisions survive a test of economic efficiency, however imperfectly measured. For your reporting, this distinction is crucial: if the practice is a welfare measure, it fails on technical grounds; if it is a constraint on power, it succeeds on institutional grounds. The inconsistency is a feature, not a bug, allowing agencies to claim scientific objectivity while retaining enough flexibility to regulate.
