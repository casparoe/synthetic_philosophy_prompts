answer: |-
  Subject: Draft materials for the behavioral econ / systems seminar

  Hey,

  Great catching up the other day. That point you made about the dollar auction looking like a distributed consensus problem actually stuck with me—it's a really sharp way to frame escalation of commitment for students who come from a CS background. It moves the discussion away from "people are irrational" to "the incentive structure is broken."

  I've put together the draft materials you asked for. I tried to make the question hard enough that they can't just regurgitate a definition of sunk costs; they actually have to engage with the game theory behind credible threats. The model answer hits the ~600-word mark and focuses heavily on how irreversibility changes the Nash equilibrium.

  Let me know if this lands right for the course level.

  Best,

  [Your Name]

  ***

  ### Exam Question: Protocol Dynamics and Escalation

  **Question 4 (25 points)**

  Consider a modified Dollar Auction implemented as a two-node consensus protocol. Node A and Node B compete to commit a block to a immutable ledger. To propose a block, a node must stake a bid $b$. The highest bidder wins the block reward $V$ (where $V=1$). However, unlike a standard auction, the losing node must also pay their bid $b$ to the network (slashing), while the winner pays their bid and receives $V$. Bids are public, sequential, and irreversible (once staked, funds cannot be withdrawn).

  Assume bidding has already reached $b_A = 0.90$ and $b_B = 0.95$. Node A is considering bidding $1.05$.

  1.  Explain why a naive analysis labels bidding $1.05$ as the **sunk-cost fallacy**.
  2.  Contrast this with a game-theoretic explanation where bidding $1.05$ is a rational **strategic signal**.
  3.  Specifically analyze how **irreversibility** and **observability** reshape the payoff structure to make this signal credible. Use the consensus protocol analogy to illustrate why "rolling back" (losing) becomes more costly than "pushing forward" (escalating).

  ***

  ### Model Answer

  In the context of the modified consensus protocol, the distinction between the sunk-cost fallacy and strategic signaling hinges on whether the agent is looking backward at past expenditures or forward at opponent behavior.

  A naive analysis identifies the decision to bid $1.05$ for a reward of $1.00$ as the sunk-cost fallacy. This psychological heuristic suggests the agent is irrationally attempting to recoup previous investments ($0.90$) that are already lost. In standard economic theory, sunk costs are irrelevant to marginal decision-making; only future payoffs matter. If Node A bids $1.05$, they guarantee a net loss of $0.05$ if they win, or a loss of $0.90$ if they lose and Node B outbids them. A purely rational agent maximizing expected utility in a vacuum should fold immediately to minimize loss, accepting the $0.90$ slash as the cost of participation. Viewing the escalation as an error assumes the opponent's future behavior is independent of Node A's current action.

  However, in a sequential game with visible bids, escalation can be a rational strategic signal rather than a psychological error. This relies on the concept of credible threats. By bidding past the value of the reward ($b > V$), Node A signals to Node B that it is willing to incur a net loss to deny Node B the win. If Node A can convince Node B that it will continue escalating indefinitely (a "war of attrition"), Node B's rational response is to fold immediately to avoid their own slashing penalty. Here, the extra bid is not spent to recover past costs, but purchased to alter the opponent's payoff matrix.

  This is where irreversibility and observability fundamentally reshape the payoff structure. In a reversible system, a threat to escalate is cheap talk; Node A could bid high and then roll back the transaction if Node B calls the bluff. However, in this consensus protocol, writes to the log are immutable. Irreversibility acts as a commitment device (akin to Schelling's "burning bridges"). Once Node A stakes $1.05$, the funds are locked. Node B observes this on-chain state (observability) and knows Node A cannot quietly withdraw.

  Consequently, the cost of "rolling back" (losing the auction) becomes structurally higher than "pushing forward." If Node A folds now, they lose $0.90$ with zero return. If they push to $1.05$, they force Node B into a position where winning costs $1.10$ for a $1.00$ reward. The irreversibility ensures the threat is credible; the observability ensures the threat is received. Therefore, escalation is not a failure of rationality regarding past costs, but a calculated manipulation of future equilibrium. The agent accepts a small certain loss ($0.05$) to probabilistically secure a win, betting that the opponent values rationality more than they do. In distributed systems terms, the protocol design itself incentivizes liveness over safety here; the cost of reverting the log (losing the bid) is engineered to be higher than the cost of extending it, forcing nodes to continue committing even when the transaction value is negative.

  ***

  ### Marking Scheme

  **A Grade (21-25 points): Structural & Strategic Analysis**
  *   **Distinction:** Clearly differentiates sunk cost (backward-looking error) from signaling (forward-looking strategy).
  *   **Game Theory:** Explicitly discusses *credibility*. Explains that bidding $>V$ is only rational if it changes the *opponent's* behavior (inducing folding).
  *   **System Analogy:** Deeply integrates the software constraints. Explains how **irreversibility** removes the exit option (making the threat credible) and how **observability** transmits the signal.
  *   **Payoff Structure:** Articulates that the payoff matrix changes because the cost of losing (slashing) is engineered to exceed the cost of escalating.
  *   **Nuance:** Acknowledges that this creates a dangerous equilibrium (race to the bottom) but validates the rationality within the game rules.

  **B Grade (16-20 points): Descriptive & Psychological Focus**
  *   **Distinction:** Identifies sunk cost vs. signaling but treats them as separate categories rather than interacting dynamics.
  *   **Game Theory:** Mentions rationality but relies heavily on "minimizing loss" without fully explaining the threat mechanism.
  *   **System Analogy:** Uses the consensus analogy superficially (e.g., just swapping "bid" for "stake") without explaining how immutability enforces the commitment.
  *   **Payoff Structure:** Describes the losses correctly but misses how irreversibility reshapes the opponent's incentives.
  *   **Nuance:** May imply the behavior is *only* rational or *only* irrational, missing the duality.

  **C Grade (10-15 points): Surface Level**
  *   **Distinction:** Confuses sunk cost with rational strategy or defines them incorrectly.
  *   **Game Theory:** No mention of opponent modeling or equilibrium.
  *   **System Analogy:** Ignores the software framing or uses it incorrectly.
  *   **Payoff Structure:** Fails to explain why bidding $1.05$ for $1.00$ happens at all.

  ***

  Hope this works for the syllabus. The key is really getting them to see that "irrational" behavior often comes from rigid system constraints rather than human error.

  Cheers
