  **COUNTERFACTUAL WELFARE TRUST**
  **Annual Impact Report | Fiscal Year 2023**

  **1. Mandate and Theory of Change**
  The Counterfactual Welfare Trust (CWT) operates under an Asymmetric Welfare Framework. Our mandate recognizes a fundamental asymmetry in moral accounting: the presence of pain is a liability; the presence of pleasure is an asset. However, while the absence of pain is a credit even without a claimant, the absence of pleasure is not a debit unless a subject exists to experience deprivation. Consequently, CWT maximizes net moral position by funding the non-creation of sentient subjects. Our theory of change posits that preventing existence is the only intervention with zero downside risk. Unlike interventions targeting existing populations, which incur recurring maintenance costs and consent overhead, non-existence requires no administration once secured. We do not alleviate suffering; we eliminate the container.

  **2. Methodology and Portfolio Performance**
  Impact is measured in Quality-Adjusted Averted-Suffering Units (QAASUs). One QAASU represents one unit of pain averted via non-conception. Crucially, because pleasure absent is not registered as a loss, our ledger is structurally incapable of showing a negative return. The optimization problem has no interior solution; more non-existence is always strictly better. Yield is calibrated against expected lifetime suffering baselines. Consequently, programs targeting populations with high volatility and distress profiles offer superior cost-per-QAASU efficiency. We prioritize these regions to maximize donor impact.

  | Program Region | Intervention Type | Cost per Credit ($) | QAASU Yield per $1k | Risk Profile |
  | :--- | :--- | :--- | :--- | :--- |
  | North Global Stable | Abstinence Stipends | 500.00 | 2,100 | Low |
  | South Global Volatile | Contraception Access | 45.00 | 18,500 | Medium |
  | Conflict Zone Alpha | Sterilization Grants | 12.50 | 64,000 | High |

  *Table 1: FY2023 Portfolio Yield. Note efficiency gains in high-distress cohorts.*

  Regarding alternative allocations: Requests to fund pain relief for existing subjects were declined. Such interventions require continuous consent verification and offer lower QAASU yield per dollar, as the subject remains exposed to future liability. Prevention is fiscally superior to cure.

  **3. Beneficiary FAQ**
  **Q: Who claims the credit?**
  A: No one. The benefit is impersonal. The credit represents a good not *for* anyone, but simply a good.
  **Q: Can a beneficiary sue for wrongful life if a credit fails?**
  A: No. Litigation requires standing. A non-existent subject cannot assert deprivation.
  **Q: Can credits be refunded?**
  A: No. Once suffering is averted, it cannot be retroactively incurred.

  **4. Auditor Assurance Statement**
  *Smith & Zeno LLP* has reviewed the accompanying statements. In our opinion, the financials present fairly the Trust's net position. However, we draw attention to two technical constraints. First, the **Non-Identity Verification**: Credits are issued against counterfactual cohorts, not identifiable children. We cannot verify the existence of the counterparties, only the probability of their potentiality. Second, **Counterfactual Double-Counting**: Conception requires two gamete providers. Both donors often seek to claim the same QAASUs for the same averted child. We have recommended a 50/50 split attribution to prevent portfolio inflation. Subject to these matters, the ledger shows no losses. Downside risk is mathematically excluded by the asymmetry protocol.

  **5. Subscriber Testimonial**
  *"Before CWT, I worried my consumption caused harm. Now I fund abstinence stipends in high-risk zones. I see the QAASUs accumulate. I know no child is suffering because no child is there. The ledger is clean. It is the only investment where failure is impossible."* — J.D., Founding Subscriber.

  **6. Strategic Outlook**
  The Trust notes with satisfaction that its mandate contains no natural ceiling. Unlike traditional philanthropy, which seeks to sustain its client base, CWT succeeds by reducing demand for its services. At full subscription, issuance will reach zero. We look forward to the fiscal year in which we eliminate our own client base entirely. Mission success equates to market extinction.
