answer: |-
  **MEMORANDUM**

  **TO:** National Commission on Post-Conflict Cultural Heritage
  **FROM:** Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal 70-C: Structured Erasure and Mnemonic Deactivation Protocol

  **DECISION:** Approval with Conditions

  **I. PURPOSE AND DETERMINATION**

  This memo communicates the Chair's decision regarding Proposal 70-C, drafted by the Archive Ethics Subcommittee. The proposal seeks to implement a protocol allowing descendants of witnesses from the 1970s river-basin displacement to request the withdrawal of testimonies from public interfaces seventy-five years after recording, restricting access to certified historians while retaining anonymized statistical data in the public catalog.

  After reviewing the Subcommittee's findings and deliberating on the divergent ethical frameworks presented during the last plenary session, I have determined to **approve the protocol with specific modifications.** The Commission's mandate requires us to balance two non-negotiable imperatives: the preservation of collective memory regarding systemic injustice, and the duty of care owed to the descendants of those who suffered that injustice. A rigid adherence to total visibility risks inflicting perpetual harm; a permissive approach to erasure risks fragmenting the historical record. The modified protocol outlined below navigates this tension by reclassifying the mechanism from "erasure" to "graduated access."

  **II. MORAL DISTINCTION: DEACTIVATION VS. DESTRUCTION**

  A primary objection raised during deliberation is that any form of withdrawal constitutes institutional forgetting, undermining the archive's authority. This objection rests on a conflation of *access* with *existence*.

  The proposed protocol does not mandate destruction. The testimony remains preserved in a sealed vault, accessible to certified historians. This distinction is morally and functionally significant. Destruction eliminates the possibility of future truth-seeking; deactivation merely regulates the *context* of that seeking. By retaining the material for specialized historical inquiry while removing it from general public consumption, we acknowledge that the function of the archive shifts over time. In the immediate aftermath of conflict, the archive serves as evidence and advocacy. After three generations, it transitions toward historical record.

  Therefore, the Commission rejects the premise that sealing a record equates to destroying memory. It equates to changing the terms of engagement. The "anonymized statistical entry" remaining in the public catalog ensures that the *fact* of the displacement and the *fact* of the testimony remain part of the public count, even if the *narrative particularities* are restricted. This preserves the structural integrity of the collective record while accommodating individual privacy.

  **III. DESCENDANT AGENCY AND COLLECTIVE HARM**

  Opponents of the proposal argue that granting descendants the power to withdraw testimony treats collective harm as privately negotiable. This is a valid concern regarding the "veto power." If memory is a public good, no single family should hold the keys to its deletion.

  However, we must distinguish between the *historical event* and the *personal trauma* embedded within the testimony. The river-basin displacement is a matter of public record; the specific emotional and social consequences endured by a specific family are matters of private suffering. The protocol does not allow descendants to deny the displacement occurred. It allows them to manage the ongoing public circulation of their family's specific victimization.

  To mitigate the risk of privatizing collective harm, the Commission imposes a condition: **Requests for deactivation cannot cite a desire to alter the historical record as justification.** The review process must verify that the request is grounded in concerns regarding ongoing harassment, stigmatization, or psychological distress, not in historical revisionism. The descendant holds stewardship over the *trauma*, not the *truth*.

  **IV. THE PRECEDENT OF CONTINGENT MEMORY AND THE 75-YEAR WINDOW**

  The strongest argument against this protocol is the precedent it sets: that memory is contingent, and that the seventy-five-year window is arbitrary—potentially too short to secure remembrance or too long to alleviate suffering.

  Regarding the precedent: We are not establishing that memory is optional, but that access is graduated. Democratic societies require interpretive closure to move from grievance to coexistence. Perpetual visibility can re-traumatize generations who did not experience the original event but inherit its stigma. By establishing a structured endpoint to the *public* life of a narrative, we acknowledge that the ethical utility of exposure diminishes over time, while the ethical cost to descendants increases.

  Regarding the timeline: Seventy-five years represents approximately three generations. This duration ensures that the testimony remains fully public for the lifetime of the witness, their children, and their grandchildren. This is sufficient time for the testimony to serve its immediate judicial, social, and educational functions. It is only when the living memory of the event fades into history that the privacy interest of the descendants outweighs the public's immediate right to identify the specific witness. This is not arbitrary; it aligns with standard archival declassification timelines used in other sensitive state contexts.

  **V. REQUIRED MODIFICATIONS**

  To secure the approval of the full Commission and address the risks outlined above, the Subcommittee must implement the following conditions prior to enactment:

  1.  **Establishment of a Review Panel:** Deactivation shall not be automatic upon request. A three-member panel (comprising one Commission representative, one independent historian, and one descendant advocate) must review requests to ensure they meet the criteria of "ongoing harm" and do not constitute historical revisionism.
  2.  **Metadata Integrity:** The "anonymized statistical entry" remaining in the public catalog must be robust. It must retain data points regarding the location, date, and nature of the displacement associated with the testimony. We cannot allow the map of injustice to develop holes, even if the names are removed.
  3.  **Sunset Clause on the Protocol:** This protocol shall be reviewed in ten years. The Commission must assess whether the rate of deactivation requests threatens the statistical representativeness of the archive. If more than 15% of the collection is deactivated, the protocol must be suspended for re-evaluation.
  4.  **Historian Access Criteria:** The definition of "certified historian" must be broad enough to include oral historians and community researchers, not solely academic institution affiliates, to prevent the vault from becoming an elite enclave.

  **VI. CONCLUSION**

  We are tasked with preserving the past without sacrificing the future. A archive that ignores the suffering of descendants in the name of memory becomes an instrument of that suffering. Conversely, an archive that allows memory to be dissolved by private preference ceases to be an archive.

  By approving this protocol with the stated conditions, we affirm that the right to remember is collective, but the burden of that memory should not be hereditary. The Subcommittee is directed to revise Proposal 70-C to reflect these modifications and return the final text for administrative ratification by November 30.

  **Chair**
  National Commission on Post-Conflict Cultural Heritage
