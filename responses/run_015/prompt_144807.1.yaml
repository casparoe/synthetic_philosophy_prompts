  *(Refining the Timeline)*: Thursday meeting is imminent. The memo needs to propose a vote *at* the meeting. The Dean needs a deadline. Let's say 14 days for a revision plan.

  *(Refining the Counter-Argument)*: Make sure the Hartian argument gets its due. It's not a weak argument; it's the standard administrative law position. The Board is choosing to depart from it for specific reasons.

