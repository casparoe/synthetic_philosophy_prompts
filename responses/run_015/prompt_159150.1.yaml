prompt: |-
  I sit on the technical advisory board of a public-interest funder that is about to commit roughly three years of support to about eight researchers working on conceptual and theoretical questions in algorithmic fairness — formal modeling, impossibility and trade-off results, and the interpretation of what those results actually establish. Not empirical audits, and not engineering. Our difficulty is not that the area is unexplored but that it is top-heavy with one kind of result. There is by now a familiar cluster of mismatch findings: independence, separation, and sufficiency cannot all hold at once except in degenerate cases such as equal base rates across groups or a perfect predictor; several natural error-rate criteria come apart in the same way; and the routes to satisfying several criteria jointly tend to run either through worsening outcomes for some group without improving anyone's, or through deliberately randomizing decisions. My colleagues split between those who treat these as essentially complete for the single-decision setting and want them treated as settled background from now on, and those who think the whole framing rests on idealizations that dissolve once real deployment is described accurately.

  What I want from you is a defended agenda rather than a survey: given that budget and that kind of researcher, which open questions should the money actually go to, in what order, and by what criteria? Two features of the deployments we care about push me toward thinking the single-decision idealization is doing serious work. First, procurement: a public agency licenses a risk score from a commercial vendor, never observes protected-class membership itself, and audits using group membership probabilistically imputed by a separate third-party model, so every fairness criterion has to be restated relative to a distribution over group labels rather than to group labels. Second, composition and repetition: the score is one input to a human caseworker who can override it, and the same population is scored again and again over years, its composition shifting partly in response to earlier decisions. Please also rule on some candidate questions I keep putting on the list and then doubting: whether the mismatch results genuinely generalize to the imputed-membership and multi-stage settings, or whether in those settings they quietly turn into claims about the auditor's uncertainty rather than about the decision-maker's fairness; whether the leveling-down worry is a real objection to these results or only a sign that they should be stated as choices among feasible sets rather than as dilemmas; and whether some items on my list are not open questions at all but definitional preferences or artifacts of how someone chose to formalize the setup. For each question you rank, say what makes it worth the years: which downstream questions its answer unlocks, whether it is tractable for someone with formal training and no access to proprietary deployment data, whether it is neglected relative to its leverage, and what single result or piece of evidence over the next two years would move it up or down. Where you think the honest answer is that no further theoretical work is the right investment, say that instead.
reasoning: |-
  Here's a thinking process that leads to the recommended agenda:

  1.  **Analyze the Request:**
      *   **Role:** Technical Advisory Board member for a public-interest funder.
      *   **Budget/Scope:** ~3 years, ~8 researchers, conceptual/theoretical algorithmic fairness (no empirical audits, no engineering).
      *   **Current State:** Area is "top-heavy" with impossibility/trade-off results (e.g., independence vs. separation vs. sufficiency).
      *   **The Conflict:** Some colleagues think these results are "settled background"; others think they rely on idealizations that dissolve in real deployment.
      *   **Key Deployment Features:**
          1.  *Procurement/Imputation:* Agency doesn't see protected class; audits use probabilistic imputation by a third party.
          2.  *Composition/Repetition:* Human-in-the-loop (overrides), sequential decisions over years, population dynamics shift.
      *   **Task:** Provide a *defended agenda* (prioritized open questions), not a survey. Rule on specific candidate doubts (generalization to imputation, leveling-down objection, definitional artifacts).
      *   **Criteria for Ranking:** Downstream unlock, tractability (formal training, no proprietary data), neglect/leverage, specific evidence/milestone for re-evaluation.
      *   **Honesty Clause:** If no further theoretical work is warranted, say so.

  2.  **Deconstruct the "Impossibility Theorem" Landscape:**
      *   The classic results (Kleinberg et al., Chouldechova, etc.) show incompatibility of calibration, balance, and base rate parity under unequal base rates.
      *   *Critique:* These assume a static, single-shot decision with known ground truth and known group membership.
      *   *User's Insight:* The real world involves *uncertainty about group membership* (imputation) and *dynamic feedback loops* (sequential decisions, human overrides).
      *   *Hypothesis:* The "impossibility" might shift from "mathematical incompatibility" to "informational/epistemic constraints" or "dynamic stability constraints."

  3.  **Evaluate the Candidate Doubts:**
      *   *Imputation/Generalization:* Do mismatch results hold when groups are probabilistic?
          *   *Analysis:* If $A$ (group) is unknown and replaced by $\hat{A}$ (distribution), fairness metrics become expectations over $\hat{A}$. The mathematical tension likely remains but shifts to the *quality of the imputation model*. It becomes a question of identifiability.
      *   *Leveling-Down:* Is this a real objection or just a framing issue?
          *   *Analysis:* "Leveling down" (making everyone worse to achieve parity) is usually a reductio ad absurdum of strict parity metrics. In a theoretical framework, this suggests the feasible set is empty or undesirable. It's not just framing; it's a signal that the objective function is misspecified.
      *   *Definitional Artifacts:* Are some questions just formalization choices?
          *   *Analysis:* Yes. Many "paradoxes" arise from specific choices of loss functions or constraints. Distinguishing robust impossibilities from artifact impossibilities is crucial.

  4.  **Develop the Agenda (Prioritization Strategy):**
      *   *Constraint:* 8 researchers, 3 years. Need high leverage, tractable, theoretical work.
      *   *Goal:* Move beyond "Here is another impossibility theorem" to "Here is how to navigate the constraint space in realistic settings."
      *   *Priority 1: The Epistemic Shift (Imputation).* This directly addresses the procurement constraint. If we can't measure fairness accurately, the impossibility theorems are operationally moot or transformed.
      *   *Priority 2: The Dynamic Shift (Sequential/Feedback).* This addresses the composition/repetition constraint. Static impossibility might be solvable via dynamic adjustment.
      *   *Priority 3: Normative Clarification (Leveling Down/Feasible Sets).* This addresses the interpretation conflict among colleagues.

  5.  **Drafting the Recommendations (Iterative Refinement):**

      *   *Question 1: Fairness under Partial Identification (The Imputation Problem).*
          *   *Why:* Directly addresses the procurement reality. If group membership is uncertain, standard metrics are biased.
          *   *Tractability:* High. Requires causal inference + fairness theory. No proprietary data needed (can simulate imputation error).
          *   *Unlock:* Redefines auditability.
          *   *Milestone:* A bound relating imputation error to fairness metric violation.

      *   *Question 2: Dynamic Feasibility vs. Static Impossibility (The Sequential Problem).*
          *   *Why:* Addresses the "single-decision idealization." Maybe you can't satisfy criteria *now*, but you can over *time*.
          *   *Tractability:* Medium. Requires dynamical systems/RL theory.
          *   *Unlock:* Moves from "impossible" to "controllable."
          *   *Milestone:* A control-theoretic proof showing convergence to parity under specific intervention policies.

      *   *Question 3: The Structure of the Feasible Set (Addressing Leveling Down).*
          *   *Why:* Addresses the "leveling down" doubt. Is it a bug or a feature?
          *   *Tractability:* High. Optimization theory.
          *   *Unlock:* Better objective functions.
          *   *Milestone:* A taxonomy of fairness constraints that *do not* induce leveling-down in standard economic models.

      *   *Question to Deprioritize/Rule Out:* "Proving more impossibility theorems in the static, known-label setting."
          *   *Reason:* Diminishing returns. The user notes the area is "top-heavy" with this.

  6.  **Refining the "Honest Answer" Clause:**
      *   Is there a point where we say "stop"?
      *   Yes, on refining the *static* impossibility results. We know they exist. Proving variant #47 of Chouldechova's theorem is low value.
      *   Also, on "defining fairness." That's philosophy/policy, not just math. The math should inform the policy, not dictate it via definition.

  7.  **Structuring the Response:**
      *   **Executive Summary:** Acknowledge the tension (Settled Math vs. Messy Reality).
      *   **The Ruling on Candidate Doubts:** Direct answers to the user's specific worries (Imputation, Leveling Down, Artifacts).
      *   **The Funded Agenda (Ranked):** 3-4 specific research tracks.
      *   **Criteria Justification:** For each track, cover Unlock, Tractability, Neglect, Milestone.
      *   **The "Stop" Signal:** Where *not* to spend money.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "human caseworker override" aspect?
      *   *Adjustment:* Include this in the Dynamic/Sequential track. Human override introduces a "noise" or "intervention" channel that might break deterministic impossibility chains.
      *   *Check:* Is this too empirical?
      *   *Adjustment:* Keep it theoretical. "Modeling the human as a stochastic operator," not "studying humans."
      *   *Check:* Is the imputation work truly theoretical?
      *   *Adjustment:* Yes, focus on *identifiability bounds* and *bias propagation*, not building the imputation model itself.

  9.  **Final Polish:** Ensure tone is appropriate for a technical advisory board (rigorous, decisive, strategic). (Self-correction: Ensure I explicitly answer the "what single result... would move it up or down" requirement for each.)

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a pivotal moment for the field. The "impossibility trilemma" literature has served its purpose: it killed the naive hope that one metric satisfies all normative demands. However, continuing to fund variations of static, single-decision impossibility theorems with known ground truth and known protected attributes is a diminishing return. It is mathematically elegant but operationally sterile for the deployment contexts you describe.

  Your intuition is correct: the single-decision idealization is doing too much work. The impossibility results rely on rigid constraints that often loosen when you introduce epistemic uncertainty (imputation) or temporal dynamics (sequential decision-making).

  Here is my ruling on your candidate doubts, followed by a defended, ranked agenda for the eight researchers.

  ### Part I: Rulings on Candidate Doubts

  **1. Do mismatch results generalize to imputed-membership settings?**
  **Ruling:** They do not generalize cleanly; they transform into *identifiability problems*.
  In the standard setting, impossibility is a property of the joint distribution $P(Y, A, \hat{Y})$. When $A$ is unobserved and replaced by a distribution $P(A|X)$, the fairness metrics become functionals of the imputation model. The "impossibility" shifts from a logical contradiction between fairness criteria to a bound on the *variance* of the fairness estimate given the imputation error.
  **Verdict:** This is a high-value open question. It moves the debate from "you can't be fair" to "you cannot *verify* fairness within confidence $\alpha$."

  **2. Is the leveling-down worry a real objection or a framing error?**
  **Ruling:** It is a signal that the constraint set is misspecified, not merely a framing issue.
  If satisfying a fairness constraint requires Pareto-dominated outcomes (leveling down), the constraint is likely acting on the wrong variable (e.g., outcomes rather than opportunities, or static snapshots rather than trajectories). However, treating it purely as a "feasible set" choice risks obscuring the normative cost. The theoretical work must distinguish between *logical* leveling down (mathematically required) and *strategic* leveling down (induced by poor optimization).
  **Verdict:** Worth funding, but only if framed as characterizing the *geometry of the Pareto frontier* under fairness constraints, not just philosophical debate.

  **3. Are some items definitional artifacts?**
  **Ruling:** Yes, many are.
  Specifically, impossibility results that hinge on the specific functional form of "calibration" or "balance" often dissolve if you change the loss function or allow for slack. If a result holds only for squared-error loss or hard thresholds, it is an artifact. If it holds for any monotonic loss function, it is structural.
  **Verdict:** Fund work that performs *sensitivity analysis on the formalism itself*, not just the parameters.

  ---

  ### Part II: The Funded Agenda (Ranked)

  I recommend allocating the 8 researchers across three priority tracks. The ordering reflects leverage: the higher the track, the more it fundamentally alters the "settled" background your colleagues are debating.

  #### Priority 1: Fairness under Partial Identification (The Imputation Track)
  **The Question:** *When protected class $A$ is unobserved and inferred via a proxy model $\hat{A}$, what are the fundamental bounds on the identifiability of standard fairness metrics?*

  *   **Why this is worth the years:** This directly addresses your procurement constraint. If an agency cannot observe $A$, standard impossibility theorems are operationally irrelevant because the terms in the equation are undefined. This track redefines fairness from a property of the decision rule to a property of the *audit system* (decision rule + imputation model). It unlocks the ability to write contracts with vendors that specify "fairness within bound $\epsilon$ given imputation error $\delta$."
  *   **Tractability:** High. This is causal inference and measurement error theory applied to fairness constraints. It requires no proprietary data; researchers can derive bounds using worst-case distributions for the imputation error.
  *   **Neglect/Leverage:** Highly neglected. Most fairness literature assumes $A$ is known (or assumes "fairness through unawareness," which is different). This has high leverage because it dictates whether audits are even possible.
  *   **Milestone for Re-evaluation (2 Years):** A published theorem establishing a lower bound on the variance of any fairness metric (e.g., demographic parity difference) as a function of the imputation model's AUC or calibration error. If researchers show that for realistic imputation errors, the confidence interval on the fairness metric spans both "fair" and "unfair," the agenda shifts to *regulating the imputation model* rather than the risk score.

  #### Priority 2: Dynamic Feasibility and Control (The Sequential Track)
  **The Question:** *Do static impossibility results persist in sequential decision settings where the population distribution $P(X, Y)$ evolves in response to prior decisions and human overrides?*

  *   **Why this is worth the years:** This addresses your composition/repetition constraint. Static impossibility theorems assume a fixed joint distribution. In reality, decisions change the population (e.g., lending affects creditworthiness; policing affects crime reporting). A constraint impossible at $t_0$ might be achievable at $t_1$ via intervention. This moves the field from "impossibility" to "control theory." It also models the human caseworker override as a stochastic intervention operator that can break deterministic impossibility chains.
  *   **Tractability:** Medium. Requires dynamical systems or reinforcement learning theory. It is harder than Track 1 but feasible for theorists.
  *   **Neglect/Leverage:** Moderately neglected. There is some work on "performative prediction," but little on *fairness control* in multi-stage human-in-the-loop systems. High leverage: it offers a path to *solve* the trade-offs rather than just cataloging them.
  *   **Milestone for Re-evaluation (2 Years):** A control-theoretic proof demonstrating a policy that converges to a set of fairness criteria over time $T$ which are provably incompatible at any single time step $t < T$. If researchers prove that *no* dynamic policy can overcome the static trade-offs even asymptotically, the money should shift to Track 3.

  #### Priority 3: The Geometry of Feasible Sets (The Normative Track)
  **The Question:** *Which fairness constraints induce Pareto-dominated outcomes (leveling down) across a broad class of utility functions, and can we construct "slack" formulations that avoid this?*

  *   **Why this is worth the years:** This addresses the "leveling down" doubt and the "definitional artifact" worry. We need to know which impossibility results are robust to changes in utility specification and which are artifacts of specific formalizations. This helps policymakers choose constraints that do not force them to burn utility for no gain.
  *   **Tractability:** High. This is optimization theory and social choice theory.
  *   **Neglect/Leverage:** Low neglect, but high leverage for *interpretation*. Your colleagues are split on whether the results are "settled." This track provides the mathematical criteria to decide which results are "robust" vs. "fragile."
  *   **Milestone for Re-evaluation (2 Years):** A taxonomy classifying the top 5 standard fairness constraints by their "Pareto-cost." If the researchers show that 4 out of 5 standard constraints inevitably induce leveling down under mild assumptions, the field must abandon those constraints entirely.

  ---

  ### Part III: Where Not to Spend the Money (The "Stop" Signal)

  You asked for honesty on where no further theoretical work is the right investment.

  **1. Do not fund new impossibility theorems in the static, known-label setting.**
  We have enough. Proving that metric $X$ is incompatible with metric $Y$ under condition $Z$ (where $Z$ is "unequal base rates") is no longer informative. It is mathematically sound but policy-paralyzing. Unless the theorem introduces a *novel* constraint relevant to the imputation or dynamic settings above, it is a sunk cost.

  **2. Do not fund "interpretability" of the impossibility results without changing the setup.**
  Philosophical papers debating whether the Kleinberg et al. result implies "fairness is impossible" are low yield. The math is clear; the interpretation is a policy choice. Fund work that *changes the math* (via Tracks 1 & 2) to give policymakers better choices, rather than work that debates the existing choices.

  **3. Do not fund empirical audits of these theories.**
  You specified this, but it bears repeating in the context of the agenda. Track 1 and 2 require *simulation* of dynamics and imputation error, not field data. Field data in public agencies is often too noisy or legally restricted to validate the specific theoretical bounds you need. Keep the researchers in the realm of formal modeling.

  ### Summary of Strategy

  Your colleagues who think the results are "settled background" are right about the *static, known-label* world. Your colleagues who think the framing dissolves in deployment are right about the *real* world.

  **The strategy is to fund the bridge between them.**
  1.  **Track 1** tells you if you can even measure the problem (Imputation).
  2.  **Track 2** tells you if you can solve the problem over time (Dynamics).
  3.  **Track 3** tells you which versions of the problem are worth solving (Geometry).

  If Track 1 shows fairness is unidentifiable under current procurement practices, you have a procurement reform agenda. If Track 2 shows dynamic policies can bypass static trade-offs, you have an engineering agenda. If Track 3 shows the standard constraints are pathological, you have a normative agenda. All three are more valuable than another proof that Calibration $\neq$ Balance.
