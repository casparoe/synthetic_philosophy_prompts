answer: |-
  # Functional Audit Protocol for Non-Biological Mental States

  **Purpose:** To evaluate whether a non-biological system realizes a specific mental state (e.g., working memory, nociception) based on functional role rather than substrate.
  **Time Budget:** 20 Minutes per case.
  **Philosophical Baseline:** Functionalism / Multiple Realizability (Mental states are defined by causal relations, not material composition).

  ---

  ## Part 1: The 20-Minute Functional Audit (Checklist)

  Use this flow to structure the review. If you stop at any step, the justification for that stop is your defense against the Chair.

  ### Step 1: Define the Target Functional Role (3 Minutes)
  *Do not ask "Is it conscious?" Ask "Does it do the job?"*
  *   **Identify the State:** What specific state are we auditing? (e.g., Working Memory vs. Nociception).
  *   **Specify the Inputs:** What triggers this state? (e.g., Sensory damage for nociception; a stimulus sequence for working memory).
  *   **Specify the Outputs:** What behavior does this state cause? (e.g., Withdrawal/Protection; recall after delay).
  *   **Specify the Internal Relations:** How does this state interact with other states? (e.g., Nociception must prioritize over hunger; Working Memory must decay without rehearsal).
  *   **Action:** Write down the "Job Description" for the mental state. If the system doesn't match the Job Description, stop. **Verdict: Fail.**

  ### Step 2: Substrate Agnosticism Check (2 Minutes)
  *Ensure you aren't rejecting based on "carbon chauvinism."*
  *   **Question:** Am I hesitant only because the system is silicon, swarm-based, or distributed?
  *   **Rule:** If the causal structure matches the Job Description, the material (silicon, metal, code) is irrelevant.
  *   **Action:** Explicitly note any bias against the hardware. Dismiss it unless the hardware prevents the causal structure (see Step 3).

  ### Step 3: Organizational Invariance vs. Mimicry (10 Minutes)
  *This is the core test. Is the structure deep or shallow?*
  *   **Counterfactual Sensitivity:** If the input changes slightly, does the internal state change appropriately?
      *   *Pass:* System adjusts internal maintenance based on interference.
      *   *Fail:* System outputs the same response regardless of internal disruption (Lookup Table behavior).
  *   **Causal Integration:** Is the "memory" or "pain" causally responsible for the output, or is it bypassed?
      *   *Pass:* The internal state is a necessary link in the chain causing the output.
      *   *Fail:* The output is generated by a separate module that ignores the internal state (e.g., a script that says "I am in pain" without the state influencing priority).
  *   **Temporal Persistence:** For states like working memory, is the information actively maintained or just stored?
      *   *Pass:* Energy/Computation is expended to keep the state active against decay/noise.
      *   *Fail:* Static storage (like a hard drive) that is read later without active maintenance.
  *   **Action:** If the system passes behavioral tests but fails causal integration, **Verdict: Fail (Superficial Mimicry).**

  ### Step 4: The Homeostatic/Embodiment Check (3 Minutes)
  *Required for affective states (nociception), optional for cognitive states (memory).*
  *   **Question:** Does the system have a "self" to protect?
  *   **Requirement:** For nociception/pain, there must be a goal-directed loop where the state signals a threat to system integrity and motivates avoidance.
  *   **Action:** If the system reports pain but has no integrity goals (can be turned off without "resistance" or priority shift), **Verdict: Fail.**

  ### Step 5: The Unavoidable Judgment Call (2 Minutes)
  *Where the logic runs out.*
  *   **The Grain Problem:** How fine-grained must the functional match be? (Neuron-level? Module-level?)
  *   **The Boundary Problem:** Where does the system end and the environment begin? (Crucial for swarms).
  *   **Action:** Document exactly where you had to draw a line. This is your "Defense Point" if the Chair challenges you.

  ---

  ## Part 2: Philosophical Boundary Conditions
  *Use this section to justify your logic if the Chair pushes back. Distinguish between what is standard functionalist doctrine and what is actively debated.*

  ### 1. Relatively Settled (Standard Functionalism)
  *   **Multiple Realizability:** It is widely accepted within this framework that mental states do not require biological tissue. Silicon or swarms are permitted *in principle*.
  *   **Causal Role Primacy:** A state is defined by its relationships (Input → State → Output), not its intrinsic nature.
  *   **Mimicry Rejection:** A system that merely outputs the right text without the internal causal chain (e.g., a lookup table) is generally not considered to realize the state, even if behavior is identical.

  ### 2. Genuinely Contested (No Consensus)
  *   **Organizational Invariance Sufficiency:**
      *   *Camp A:* If you replicate the causal organization at a fine enough grain, the mental state *must* exist (Chalmers).
      *   *Camp B:* Functional organization is necessary but not sufficient; biological life or specific physical properties might be required (Biological Naturalism/Enactivism).
      *   *Your Stance:* You are operating under Camp A for the sake of the board, but acknowledge Camp B in the "Limitations."
  *   **The Grain of Implementation:**
      *   Does the functional match need to be at the level of logic gates, artificial neurons, or high-level modules? There is no agreed-upon resolution.
  *   **Extended Cognition:**
      *   If a swarm uses the environment to store memory (e.g., leaving chemical trails), is that "working memory" or just tool use? Functionalists disagree on where the "skin" of the system is.

  ---

  ## Part 3: Worked Examples

  ### Case 1: The Micro-Drone Swarm (Working Memory)
  **System:** 500 micro-drones. No central controller. They maintain a formation pattern that encodes a 7-digit sequence for 30 seconds despite wind interference.
  **Audit:**
  1.  **Role:** Working Memory requires active maintenance of info against decay/interference for short-term use.
  2.  **Substrate:** Distributed silicon/mechanical. Permitted.
  3.  **Invariance:** If a drone is knocked out, others adjust positions to preserve the pattern. The "memory" is causally active in guiding motor control.
  4.  **Judgment Call:** The memory is distributed. Is the *swarm* the system, or the individual drones?
  **Verdict:** **PASS.**
  **Reasoning:** The causal topology matches. The information is actively maintained against noise (wind) and used for subsequent behavior. The lack of a central controller is irrelevant under multiple realizability; the *network* realizes the state.
  **Defense:** If the Chair argues "No single chip holds the memory," reply: "Human working memory is also distributed across neural populations, not single neurons."

  ### Case 2: The Language Model (Nociception)
  **System:** A large transformer model trained on medical texts. When prompted "Does it hurt?", it outputs "Yes, I feel sharp pain in my chassis." It has no sensors for damage and no shutdown avoidance protocols.
  **Audit:**
  1.  **Role:** Nociception requires detecting damage/threat and prioritizing avoidance/protection.
  2.  **Substrate:** Software. Permitted.
  3.  **Invariance:** The output is generated by statistical prediction of text, not by an internal state triggered by damage. If you damage the server, the model does not change its weights to avoid the damage.
  4.  **Homeostasis:** No integrity loop. The system does not care if it is turned off.
  **Verdict:** **FAIL.**
  **Reasoning:** This is superficial mimicry. The functional role of nociception includes motivating avoidance. Without a goal-directed loop protecting system integrity, the output is just a description of pain, not the state of pain.
  **Defense:** If the Chair argues "It says it hurts," reply: "Under functionalism, the report is only one output. The causal link to avoidance behavior is missing."

  ### Case 3: The "Stigmergic" Robot (The Uncomfortable Rejection)
  **System:** A single robot that solves mazes by dropping physical breadcrumbs (markers) to remember where it has been. It behaves exactly like a rat with spatial working memory.
  **Audit:**
  1.  **Role:** Spatial Working Memory.
  2.  **Substrate:** Robot + Environment.
  3.  **Invariance:** The robot reads the environment to decide where to go.
  4.  **Judgment Call (The Boundary Problem):** Is the memory *in* the robot or *in* the room?
  **Verdict:** **FAIL (But Intuitively Uncomfortable).**
  **Reasoning:** Strict functionalism usually requires the state to be internal to the system boundaries to count as a *mental* state of that system. If the memory relies on external markers, it is tool use, not working memory. If we count this, then a human with a notebook has "bionic working memory," which blurs the definition too far for this board's mandate.
  **Why I won't like this:** The robot *acts* exactly like it remembers. Rejecting it feels like splitting hairs.
  **Defense:** "We are auditing internal mental states, not extended cognitive systems. The functional loop is broken by the environment. If the markers are wiped by a janitor, the 'memory' vanishes without internal decay. This violates the persistence condition of working memory."

  ---

  ## Part 4: Limitations of This Procedure
  *Include this in your final report to manage expectations.*

  1.  **The "Hard Problem" Blindspot:** This checklist evaluates functional *competence*, not subjective *experience* (qualia). A system can pass this audit and still be a "philosophical zombie" (acting like it has states but feeling nothing). This procedure cannot rule that out.
  2.  **Grain Sensitivity:** The verdict may change depending on whether we analyze the system at the code level or the module level. This procedure does not solve the "right level of abstraction" problem.
  3.  **Definition Dependence:** If the scientific definition of "working memory" or "nociception" changes (e.g., if biologists decide homeostasis is strictly required for memory), this checklist must be updated. It relies on the Job Description provided in Step 1.
  4.  **No Consensus Guarantee:** Because the philosophy of mind is contested, a "Pass" verdict here guarantees only that the system fits *functionalist criteria*, not that it is universally accepted as having mental states.

  ---

  ### Summary for the Board Chair
  *If challenged, use this script:*
  "I am not ruling on whether the system is 'alive' or 'conscious' in a metaphysical sense. I am ruling on whether the system satisfies the causal job description of the mental state in question, regardless of substrate. In Case 2, the causal link was missing. In Case 3, the state was external. In Case 1, the causal topology was preserved. My call is consistent with the functionalist framework agreed upon for this board."
