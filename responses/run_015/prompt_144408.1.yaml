  His hands remember what his mouth forgot.
  He wipes the brass with rag and scent of oil.
  I ask him why; the answer comes to naught.

  The pendulum swings wide, a steady trot.
  Through years of dust and unremitting toil.
  His hands remember what his mouth forgot.

  The words are gone, a tangled, silent knot.
  No grease can fix the mind's depleted coil.
  I ask him why; the answer comes to naught.

  The shophouse walls block out the busy spot.
  He sets the spring so rust cannot spoil.
  His hands remember what his mouth forgot.

  He fixes time, though his own mind is shot.
  The air is thick, a humid, heavy broil.
  I ask him why; the answer comes to naught.

  The escapement ticks within its narrow slot.
  The springs unwind with sudden, sharp recoil.
  His hands remember what his mouth forgot.
  I ask him why; the answer comes to naught.
