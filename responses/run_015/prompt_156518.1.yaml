  3. Concerning the ontological status of chance, the propensity view treats stability-under-manipulation as a real physical property of the system, whereas frequentism reduces chance to a mere description of observed regularities within an actual ensemble.
  4. For rational betting behaviour, propensity theory justifies wagers based on knowledge of the underlying causal powers ensuring stability, while frequentism restricts rational credence to extrapolations from historically observed frequencies without guaranteeing counterfactual robustness.
  5. Regarding compatibility with deterministic underlying dynamics, frequentism remains agnostic as long as stable patterns emerge empirically, whereas propensity theory often posits that the generating conditions possess irreducible dispositional powers that cannot be fully reduced to deterministic trajectories.
