answer: |-
  Here is the breakdown of where Marta stands, the hidden tension in her rules, and a better case to bring next week.

  ### 1. The Prediction
  If Marta wants to stay consistent with the criteria she explicitly gave you (reliably available, automatically endorsed, easy to consult), she must say **Yes, the pipeline is part of their minds.**

  Functionally, the pipeline looks exactly like the pocket calculator and the Alzheimer's notebook. The students treat it as a trusted resource they consult without second-guessing. The fact that they don't understand the code is analogous to not understanding the transistor physics inside the calculator; in both cases, they trust the output more than their own judgment.

  ### 2. The Two Rules
  You have correctly spotted that her verdicts rely on something deeper than her stated three criteria. The tension between the **Calculator (Yes)** and the **Wife (No)** is the key. Both are reliable, endorsed, and accessible. The difference lies in *where the cognitive work happened*.

  **Rule A: The Functional Coupling Rule (Marta's apparent rule)**
  *   **The Gist:** If an external resource plays the same functional role as an internal belief (it's there when you need it, you trust it, you use it to decide), it is part of the mind.
  *   **The Logic:** It doesn't matter who built the tool or how it works, only that it is coupled to your behavior.
  *   **Verdict on Pipeline:** **Yes.** It functions as their memory/reasoning.

  **Rule B: The Cognitive Agency Rule (The alternative)**
  *   **The Gist:** To be part of *my* mind, the information must stem from *my* past cognitive agency or from public, transparent logic. If the processing happens inside another agent's head (or is the private judgment of another agent frozen in a tool), it is testimony, not memory.
  *   **The Logic:** This explains why the **Wife is No** (the knowledge lives in *her* mind) and the **Calculator is Yes** (long division is public logic; the machine does what *I* could do). It also explains the **Whiteboard (No)** (no single agent owns the cognition).
  *   **Verdict on Pipeline:** **No.** The constants and logic are the private judgment of the ex-postdoc. The students are relying on *his* agency, not extending their own. They are accepting testimony from a script, not using a tool to extend their own competence.

  ### 3. Critique of Your Proposed Case
  Your idea—*the postdoc's notebook turns up with a full derivation, so the students could check it but still don't*—is a good instinct, but it likely won't separate the rules cleanly.

  Here is why: It tests **Verifiability**, not **Agency**.
  *   **Rule A** still says **Yes** (nothing changed about how they use it).
  *   **Rule B** is ambiguous. If the rule is "I must be able to check it," then Yes. But if the rule is "I must have done the thinking," then No. The notebook proves the *ex-postdoc* did the thinking. The students still haven't done the work; they just have the option to audit it. Marta could argue that having the option makes it "transparent enough" to count, which muddies the water rather than clarifying it. It restates the problem one level down, as you suspected.

  ### 4. The Cleanest Case to Bring
  To force a choice between Rule A (Function) and Rule B (Agency), you need a case where the *function* is identical to a "Yes" case, but the *agency* is identical to a "No" case.

  I recommend bringing the **"Inherited Calibration"** case. It fits the room's background better than a philosophical thought experiment and mirrors the pipeline without the "code" distraction.

  **The Case:**
  > "Imagine I inherit a spectrometer from a retired colleague. It comes with a calibration curve written in his notebook. I use it every day. I trust it absolutely. I never re-run the standards because the chemical standards he used have expired and no longer exist; I literally *cannot* verify the calibration myself. I just run my samples and record the numbers."

  **Why this separates the rules:**
  *   **Rule A (Functional Coupling):** **Yes.** It is reliably available, automatically endorsed, and easy to consult. It is functionally identical to your own lab notebook case.
  *   **Rule B (Cognitive Agency):** **No.** The epistemic work (the calibration) was done entirely by *him*. You cannot reconstruct it (standards are gone). It is not an extension of *your* mind; it is you relying on *his* past judgment.

  **Why this is better than the Notebook variant:**
  It removes the "could check" loophole. In your notebook variant, the students *could* check the math. In the Inherited Calibration, they *cannot*. This forces Marta to decide: Is the mind extended by **trust and utility** (Rule A), or does it require **ownership of the original cognitive act** (Rule B)?

  If she says **Yes** to the Inherited Calibration, she admits that we can incorporate other people's private judgments into our minds just by trusting them (which makes the Wife verdict look inconsistent). If she says **No**, she admits that the Pipeline (which is just an inherited calibration in digital form) is also testimony, not memory.

  This should corner the distinction nicely without needing any theory jargon.
