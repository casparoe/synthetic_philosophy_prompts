      *   *Round 1:* They pick weights (implicitly 1,1,1).
      *   *Round 2:* I change Bob's scale. Their weights (1,1,1) now produce a different result. To get the *same* result, they must change weights to (1, 0.1, 1).
      *   *Realization:* The weights are doing the ethical work, not the math. The math just aggregates.

  8.  **Refining the Round 2 Staging (Crucial Step):**
      *   How to make it land?
