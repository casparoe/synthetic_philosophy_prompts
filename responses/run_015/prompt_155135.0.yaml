  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *Premise 1 (Individual Rationality):* Each individual has vNM preferences over lotteries.
      *   *Premise 2 (Social Rationality):* Society (the observer) has vNM preferences over lotteries.
      *   *Premise 3 (Pareto/Unanimity):* If everyone prefers A to B, Society prefers A to B. (If everyone is indifferent, Society is indifferent).
      *   *Conclusion:* Social utility function is a linear combination of individual utility functions ($W = \sum a_i U_i$).
      *   *The "Bite":* If you accept 1, 2, and 3, you *must* accept Utilitarianism (in the sense of sum-ranking), *unless* you allow for different weights. Harsanyi argues for equal weights via the "Veil of Ignorance" (which is a separate step, often confused with the Aggregation Theorem itself). The prompt specifically asks to stop at the weighted sum part and highlight the incommensurability issue in Round 2.
