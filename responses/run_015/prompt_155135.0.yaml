      *   *Epistemic Status:* Theorem is math (given axioms). Axioms are contested (especially Interpersonal Comparability and Independence).

  6.  **Developing the Timeline (90 mins):**
      *   0-10: Intro & Setup.
      *   10-30: Round 1 (Calibrated).
      *   30-40: Round 1 Debrief (Quick).
      *   40-60: Round 2 (Rescaled/Incommensurable).
