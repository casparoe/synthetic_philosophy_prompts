  4.  **Drafting the Materials:**
      *   **Personas:** Alice, Bob, Charlie.
      *   **Outcomes:** X, Y, Z.
      *   **Round 1 Utilities:**
          *   Alice: X=10, Y=0, Z=5
          *   Bob: X=10, Y=0, Z=5
          *   Charlie: X=0, Y=10, Z=5
          *   *Lottery A:* 50% X, 50% Y. (Exp U: A=5, B=5, C=5). Sum = 15.
          *   *Lottery B:* 100% Z. (Exp U: A=5, B=5, C=5). Sum = 15.
          *   *Need a conflict.* Let's try:
          *   Lottery A: 50% (Alice 10, Bob 0, Charlie 0), 50% (Alice 0, Bob 10, Charlie 0).
          *   Lottery B: 100% (Alice 4, Bob 4, Charlie 4).
          *   Round 1 (Comparable): Sum A = 5+5+0=10. Sum B = 4+4+4=12. B wins (Utilitarian). But A is "fairer" (no one gets 0).
