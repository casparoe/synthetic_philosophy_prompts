      *   **Refining the Round 2 Twist:**
          *   In Round 1, give them specific numbers.
          *   In Round 2, tell them: "Actually, Bob's utils are measured in 'decibels' and Alice's in 'meters'. You can add meters, but can you add meters + decibels?"
