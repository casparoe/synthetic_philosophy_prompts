answer: |-
  This is a sophisticated request that requires balancing game mechanics with formal social choice theory. The goal is to create an experiential "trap" where students intuitively reach for a solution (summing utilities), only to have the ground pulled out from under them (incommensurability), forcing them to confront the axiomatic commitments required to save the theory.

  Here is a complete lesson plan, materials, and debrief guide.

  # Session Plan: The Aggregation Trap
  **Time:** 90 Minutes
  **Class Size:** 13 Students (4 Groups: three groups of 3, one group of 4 including you)
  **Prerequisites:** vNM Expected Utility, Pareto Efficiency, Basic Social Choice concepts.

  ## Learning Objectives
  1.  Experience the tension between **Pareto Unanimity** and **Social vNM Rationality** (specifically Independence).
  2.  Discover that satisfying both implies a **linear aggregation** of individual utilities.
  3.  Confront the **Interpersonal Comparability** problem: without a common scale, the "weights" in the sum are arbitrary.
  4.  Distinguish between the **mathematical theorem** (settled) and the **normative justification** for weights (contested).

  ---

  ## Part 1: Materials Preparation

  ### 1. Persona Cards (Print 1 set per group)
  Each set contains 3 Personas (A, B, C). Each Persona has a utility function over three Social States ($S_1, S_2, S_3$).
  *Note: Emphasize these are **vNM Utilities**, not money.*

  **Round 1 Card Set (The "Calibrated" World)**
  *   **Persona A:** $S_1=10, S_2=0, S_3=6$
  *   **Persona B:** $S_1=10, S_2=0, S_3=6$
  *   **Persona C:** $S_1=0, S_2=10, S_3=6$
  *(Note: A and B are identical; C is the "other".)*

  **Round 2 Card Set (The "Rescaled" World)**
  *   **Persona A:** $S_1=10, S_2=0, S_3=6$ (Unchanged)
  *   **Persona B:** $S_1=100, S_2=0, S_3=60$ (**Multiplied by 10**)
  *   **Persona C:** $S_1=0, S_2=10, S_3=6$ (Unchanged)
  *(Keep the physical cards from Round 1, but hand out a "Correction Slip" for B).*

  ### 2. Lottery Deck (Print 1 set per group)
  Two Lotteries ($L_X, L_Y$) defined over the Social States.
  *   **Lottery $L_X$:** 50% chance of $S_1$, 50% chance of $S_2$.
  *   **Lottery $L_Y$:** 100% chance of $S_3$.

  ### 3. The "Social Planner" Worksheet
  A simple sheet where groups must record:
  1.  Expected Utility for each Persona in each Lottery.
  2.  The Social Ranking ($L_X \succ L_Y$, $L_Y \succ L_X$, or $\sim$).
  3.  **The Rule:** A one-sentence justification for how they derived the Social Ranking from Individual Utilities.

  ### 4. Currency
  Poker chips or paper slips. Value: 1 chip = 1 participation point. No cash redemption.

  ---

  ## Part 2: Timeline & Procedure (90 Minutes)

  ### 0:00 – 0:10 | Introduction & Rules
  *   **Setup:** Divide into 4 groups. Distribute Round 1 Persona Cards and Lottery Deck.
  *   **The Mandate:** "You are the Social Planner. Your job is to rank Lotteries $L_X$ and $L_Y$ on behalf of Personas A, B, and C."
  *   **The Constraints (Write on Board):**
      1.  **Pareto:** If all Personas prefer $L_X$ to $L_Y$, you must rank $L_X \succ L_Y$. If all are indifferent, you must be indifferent.
      2.  **Rationality:** Your social ranking must satisfy vNM axioms (specifically **Independence of Irrelevant Alternatives**). *Tell them:* "If you prefer $L_X$ to $L_Y$ now, you shouldn't change your mind if I add a third lottery $L_Z$ that is identical for both, or if I mix both with a common risk."
      3.  **Information:** You know the utility numbers on the cards.
  *   **Stakes:** "The group that produces the most 'consistent' ranking (defined later) gets 5 chips. Everyone gets 2 chips for completion."

  ### 0:10 – 0:30 | Round 1 (The Calibrated Trap)
  *   **Task:** Calculate Expected Utility (EU) for each persona. Agree on a Social Ranking. Write down your "Aggregation Rule."
  *   **Anticipated Math:**
      *   **Persona A:** $L_X = 0.5(10) + 0.5(0) = 5$. $L_Y = 6$. (Prefers $L_Y$)
      *   **Persona B:** $L_X = 5$. $L_Y = 6$. (Prefers $L_Y$)
      *   **Persona C:** $L_X = 0.5(0) + 0.5(10) = 5$. $L_Y = 6$. (Prefers $L_Y$)
      *   **Result:** Unanimity! Everyone prefers $L_Y$.
  *   **The Twist:** Wait, if everyone prefers $L_Y$, Pareto forces you to pick $L_Y$. This is too easy. We need a conflict to force aggregation.
  *   **Correction to Lottery Deck for Round 1:**
      *   **Lottery $L_X$:** 50% $S_1$, 50% $S_2$.
      *   **Lottery $L_Y$:** 100% $S_3$.
      *   **Change Persona C's Card:** $S_1=0, S_2=10, \mathbf{S_3=4}$.
      *   **New Math:**
          *   A: $L_X=5, L_Y=6$ (Prefers $L_Y$)
          *   B: $L_X=5, L_Y=6$ (Prefers $L_Y$)
          *   C: $L_X=5, L_Y=4$ (Prefers $L_X$)
      *   **Conflict:** Majority wants $L_Y$, Minority (C) wants $L_X$.
      *   **Utilitarian Sum:**
          *   $L_X$ Total: $5 + 5 + 5 = 15$.
          *   $L_Y$ Total: $6 + 6 + 4 = 16$.
          *   **Sum says:** Pick $L_Y$.
      *   **Prioritarian/Maximin:**
          *   $L_X$ Worst-off: 5 (Everyone gets 5).
          *   $L_Y$ Worst-off: 4 (C gets 4).
          *   **Maximin says:** Pick $L_X$.
  *   **Action:** Let them debate. Most will sum the utilities because the numbers look "cardinal and comparable." Record their Rule (e.g., "Maximize Total Utility").

  ### 0:30 – 0:40 | Round 1 Debrief (Brief)
  *   Ask groups for their ranking. Most will say $L_Y$ (Sum = 16 vs 15).
  *   Ask: "Why did you add the numbers?"
  *   Expected answer: "It seemed fair," or "Maximize welfare."
  *   Collect the worksheets. Do not judge them yet.

  ### 0:40 – 0:50 | The "Correction Notice" (Round 2 Setup)
  *   **Distribute:** Round 2 Persona Cards (or Correction Slips).
  *   **Script:** "The Bureau of Metrics has issued a correction. It turns out utility is internally consistent for each person, but **scales are not calibrated across persons**. Persona B's utility was measured in 'decibels' while A and C were in 'meters'. We cannot assume 1 util for A equals 1 util for B."
  *   **Handout:** The Round 2 Card for B ($S_1=100, S_2=0, S_3=60$). A and C remain the same.
  *   **Task:** "Re-rank $L_X$ and $L_Y$. You must still satisfy Pareto and vNM Rationality. You cannot simply say 'it's impossible'."
  *   **Stakes:** "If your Round 2 ranking is consistent with your Round 1 ethical intuition *and* the new math, you get bonus chips."

  ### 0:50 – 1:05 | Round 2 (The Incommensurability Crisis)
  *   **The Math:**
      *   A: $L_X=5, L_Y=6$ (+1 for $L_Y$)
      *   B: $L_X=50, L_Y=60$ (+10 for $L_Y$)
      *   C: $L_X=5, L_Y=4$ (-1 for $L_Y$)
      *   **New Sum:**
          *   $L_X = 5 + 50 + 5 = 60$.
          *   $L_Y = 6 + 60 + 4 = 70$.
      *   **Result:** $L_Y$ still wins, but the *margin* has exploded due to B's scale.
  *   **The Trap:** If a group tries to "normalize" (e.g., divide B by 10), ask them: "Why 10? Why not 2? On what ethical basis do you choose the divisor?"
  *   **Observation:** Watch for groups trying to vote (violates Pareto/Independence), or groups refusing to rank (violates the task), or groups arbitrarily picking weights.

  ### 1:05 – 1:20 | The Grand Debrief
  *   **Step 1: The Aggregation Theorem (Settled Math)**
      *   Draw on board: **Pareto + Social vNM $\rightarrow$ Weighted Sum ($W = \sum a_i U_i$).**
      *   Explain: "In Round 1, you implicitly chose weights $a_A=1, a_B=1, a_C=1$. This is Utilitarianism."
      *   Explain: "In Round 2, because B's scale changed, your weights effectively became $a_A=1, a_B=0.1, a_C=1$ if you wanted to keep the Round 1 ranking. But nothing in the math told you to change the weights. The math just says *some* weights exist."
  *   **Step 2: The Comparability Problem (Contested)**
      *   Highlight Round 2 chaos. "When scales are arbitrary, the weights $a_i$ absorb the scale. Ethical judgment is hidden in the measurement."
      *   This is Sen's critique of Harsanyi. Harsanyi *assumes* comparability to get Utilitarianism. Without it, the theorem yields an empty set of weights.
  *   **Step 3: Independence**
      *   Ask the student who refused Independence: "If we drop Independence, we can use Rawlsian Maximin. But we lose the ability to handle risk consistently as a society."

  ### 1:20 – 1:30 | Limitations & Conclusion
  *   **What this game proved:** That Pareto + vNM forces linearity.
  *   **What this game did NOT prove:**
      1.  **Equal Weights:** The theorem allows $W = 100U_A + 1U_B$. To get equal weights ($1,1,1$), you need the **Veil of Ignorance** argument (Harsanyi's second step), which we did not simulate.
      2.  **Cardinality:** We assumed utility was cardinal. If utility is only ordinal, the theorem breaks entirely.
  *   **Final Takeaway:** "Harsanyi gives you the *form* of the solution (sum-ranking), but not the *content* (the weights). The weights require ethical argument, not just math."

  ---

  ## Part 3: Troubleshooting & Anticipated Friction

  ### 1. "We just voted." (Majority Rule)
  *   **Diagnosis:** Violation of Pareto or Independence.
  *   **Intervention:** "If A and B prefer $L_Y$ intensely, and C prefers $L_X$ slightly, Majority Rule ignores intensity. vNM requires intensity (cardinality). Does your vote capture intensity?"
  *   **Debrief Point:** Arrow's Impossibility Theorem lurks here. If you use ordinal voting, you run into cycles. If you use cardinal voting (utility), you run into the weighting problem.

  ### 2. "I refuse the Independence Axiom."
  *   **Diagnosis:** This is the most philosophically robust objection (e.g., Buchak, Prioritarianism).
  *   **Intervention:** "That is a valid philosophical stance. But note: if you violate Independence, you are no longer a vNM rational agent. You are prioritizing 'security' or 'equality' over expected value. That is a substantive ethical claim, not a neutral procedural one."
  *   **Debrief Point:** This is where Prioritarianism lives. It sacrifices Social vNM Rationality to protect the worst-off.

  ### 3. "We averaged money, not utility."
  *   **Diagnosis:** Confusion of goods with welfare.
  *   **Intervention:** Remind them the cards say "Utils." If they treat them as dollars, they are assuming risk-neutrality for the personas.
  *   **Debrief Point:** Utility already accounts for risk attitude. Summing utils sums *welfare*, not resources.

  ### 4. Round 2 Confusion ("Why did B's numbers change?")
  *   **Risk:** Students think you are playing tricks.
  *   **Mitigation:** Frame it as "Measurement Error." Use the "Meters vs. Decibels" analogy aggressively.
  *   **Key Question to Ask:** "If I tell you B's numbers were multiplied by 10, does B actually deserve 10x more influence over social policy? If not, why did your formula give it to them?"

  ---

  ## Part 4: Epistemic Status Guide (For the Instructor)

  Be explicit about these distinctions during the debrief. Do not blur them.

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **The Aggregation Theorem** | **Settled Math** | Given the axioms (Pareto, Social vNM), the conclusion (Linear Weighted Sum) is a mathematical necessity. |
  | **Social vNM Rationality** | **Contested** | Why should *society* be risk-neutral or satisfy Independence? Many argue society should be more risk-averse than individuals (Prioritarianism). |
  | **Interpersonal Comparability** | **Contested** | Can we meaningfully say 1 util for Alice = 1 util for Bob? Harsanyi says yes (via empathy); Sen says no (measurement problem). |
  | **Equal Weights ($a_i = 1$)** | **Contested** | The Aggregation Theorem *does not* prove this. This requires the **Veil of Ignorance** argument (impartiality). |
  | **Utilitarianism** | **Contested** | The game leads to *Weighted Sum Ranking*. Calling this "Utilitarianism" requires assuming equal weights and comparability. |

  ## Part 5: Why This Stages the "Bite"
  1.  **Round 1** lulls them into thinking the math is neutral. They sum because it's easy and the numbers look compatible.
  2.  **Round 2** reveals that the "Sum" is sensitive to arbitrary labeling.
  3.  **The Squeeze:** To maintain their Round 1 ethical intuition (e.g., "B shouldn't get more power just because his scale is bigger"), they must manually adjust the weights ($a_i$).
  4.  **The Realization:** The weights are not derived from the math; they are imported ethical judgments. The theorem constrains the *structure* of their ethics (must be linear), but not the *content* (the weights).

  ## Instructor Note on the "Equal Weights" Step
  Students often conflate Harsanyi's Aggregation Theorem with his Veil of Ignorance argument.
  *   **Aggregation Theorem:** If you are rational and respect preferences $\rightarrow$ You sum (with *some* weights).
  *   **Veil of Ignorance:** If you are impartial (don't know who you are) $\rightarrow$ The weights must be equal.
  *   **Game Limit:** This game only stages the Aggregation Theorem. It does not stage the Veil. Be careful not to claim the game proves Utilitarianism. It proves **Generalized Utilitarianism** (Sum-ranking with arbitrary weights). This is a crucial distinction for a third-year seminar.
