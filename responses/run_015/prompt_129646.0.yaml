answer: |-
  **Grade:** 14/20 (70%)
  **Band:** Low First / High 2:1 Borderline

  **General Note for the TA:**
  This script is a perfect example of your "fluency vs. understanding" worry. The writing is confident, structurally sound, and synthesises concepts from economics and philosophy very well (Part b is particularly strong). However, Part (c) contains a significant technical error regarding the degeneracy result you mentioned covering in lectures. The student conflates VNM utility invariance (affine transformations) with IRL identifiability (non-affine rewards yielding same policy on-demonstration but diverging off-demonstration). This is the key differentiator: a student who truly grasps the *degeneracy result* should recognise that the scenario in (c) is the expected failure mode of IRL, not a "fitting error." Use this distinction to calibrate the rest of your marking: reward the synthesis in (b), but penalise the technical conflation in (c) similarly across other scripts.

  ---

  ### Margin Comments

  **Part (a)**

  *   *"IRL runs the normal RL problem backwards."*
      *   **Right.** Standard heuristic definition.
  *   *"Here we are given the chef's trajectories and we solve for the reward under which those trajectories come out looking good."*
      *   **Right.** Accurate description of the inverse problem.
  *   *"To do that you need everything in the MDP except the reward — the states, the actions, the transition probabilities, the discount factor — all treated as known..."*
      *   **Right.** Correctly identifies the standard IRL assumption (known dynamics).
  *   *"The extra assumption that makes the inference possible is that the chef is approximately optimal with respect to her own reward..."*
      *   **Right.** Crucial point.
  *   *"Otherwise the problem is empty: for any behaviour whatsoever there is a reward that makes it optimal..."*
      *   **Right.** Correctly identifies the degeneracy/tautology worry without needing to name it.
  *   *"IRL is supposed to generalise to new situations because it recovers the goal and not the movements."*
      *   **Right.** Good distinction from Behavior Cloning.
  *   **Part (a) Score:** 6/6. Comprehensive and accurate.

  **Part (b)**

  *   *"The objection is half right. Both projects read something unobserved off behaviour under constraints..."*
      *   **Right.** Good framing.
  *   *"The locked-pantry case has exactly that shape... IRL will read the locked door as a taste unless the constraint is built into the model explicitly."*
      *   **Right.** Correctly applies the Revealed Preference analogy to the MDP constraints.
  *   *"In the expected-utility setting, beliefs and desires are only ever identified jointly..."*
      *   **Right.** Accurate summary of the holism worry.
  *   *"IRL doesn't face this, because the transition model and the action set are inputs to the inference rather than things being fitted."*
      *   **Right (within model assumptions).** This is the standard IRL response to holism: we fix the "beliefs" (dynamics) to identify the "desires" (reward). *Note: Check if other students challenge whether T is truly known; this student takes the model at face value, which is acceptable here.*
  *   *"Where the chef is plainly not optimal... the rationality parameter takes the strain: you fit a temperature, and the temperature tells you how much of the behaviour was noise."*
      *   **Right.** Correct understanding of Boltzmann/MaxEnt rationality.
  *   **Part (b) Score:** 7/8. Excellent synthesis. One mark reserved for not acknowledging that fixing T just *stipulates* the solution to holism rather than solving it empirically, but for 8 marks this is strong.

  **Part (c)**

  *   *"The underdetermination is real but it's the boring kind, the same kind you get in ordinary decision theory."*
      *   **Wrong.** This dismisses the specific IRL degeneracy problem (Ng & Russell) which is not the "boring kind."
  *   *"Utility functions are only ever unique up to positive affine transformation... functions that differ only in that way will never disagree about what to do..."*
      *   **Right (as a statement of VNM theory), but Wrong (as applied here).** Affine transformations preserve optimal policies *everywhere*. The question premise states the rewards *disagree* in the new kitchen. Therefore, they cannot be merely affine transformations of each other.
  *   *"So if the fitted rewards really are telling the robot different things about the unlocked fridge, then the fit has gone wrong rather than the method being bankrupt..."*
      *   **Wrong.** This contradicts the degeneracy result you covered in lectures. Non-equivalent rewards can rationalize the same demonstrations. This is a feature of the problem (identifiability), not a bug of the fitting procedure.
  *   *"The remedy is more data from the chef, not more philosophy."*
      *   **Right but unargued.** "More data" is only a remedy if it is *different kinds* of data (e.g., interventions), not just more trajectories of the locked pantry. The student implies quantity solves an identifiability problem, which is misleading.
  *   **Part (c) Score:** 2/6. Identifies underdetermination but fundamentally mischaracterises the mathematical nature of the ambiguity (affine vs. degeneracy) and dismisses the philosophical implication too hastily based on that error.

  ---

  ### Note on Question (c) Wording
  The question is not ambiguous. It describes the classic *identifiability* problem in IRL (rewards consistent with observed behavior but divergent on counterfactuals). The student's answer suggests they may have confused this with the *uniqueness* of utility functions in microeconomic theory. This is a common conflation. You can grade other scripts confidently on this point: if they claim the rewards must be affine transforms, they have missed the degeneracy result. If they acknowledge that distinct reward functions can rationalize the same policy (e.g., due to unobserved constraints or feature ambiguity), they understand the material.
