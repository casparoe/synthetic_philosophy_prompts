  While Rule A and Rule B both allow for a "Won't Say" verdict (paralleling Entry 8), **Entry 7 is the strongest constraint on your specific case.**

  Entry 7 ("Action is right iff maximizes happiness") was classified as Synthetic because it wasn't true "in virtue of what anyone means." This reveals that Dr. Hallam rejects the idea that *normative connections* are analytic unless they are trivial tautologies. Your sentence ("Whoever has promised... has a reason") bridges a descriptive fact (the act of promising) and a normative fact (having a reason).

  To a Humean or an Externalist, one can grasp the concept of "promise" without acknowledging the "reason" (the Open Question Argument). Dr. Hallam's remark on Entry 6 ("conflating necessity with analyticity is the error") warns against assuming that because the link feels necessary or firm, it is analytic. The link between promising and reasons feels necessary to many, but Entry 6 tells us firmness/necessity $\neq$ analyticity.

  Therefore, she will likely view the normativity of promising as a **substantive theoretical commitment** (like Utilitarianism in Entry 7), not a linguistic definition (like "Bachelor" in Entry 1). If she were willing to call it Analytic, she would have to treat normative principles as conceptual truths, which Entry 7 suggests she refuses to do.

  *Risk:* The only reason to fear a "Won't Say" verdict is Entry 8. If she views "Promise" as a thick concept where the description and normativity are inseparable (like "Green" and "Extended"), she might hesitate. But "Green" is perceptual; "Promise" is institutional. Given her hard line on Entry 7, Synthetic is the safer bet.

  ### 3. The Diagnostic Sentence

  You need a sentence that isolates the variable of **Institutional Norms** to see if she treats them like Definitions (Analytic) or Theories (Synthetic).

  **Do not bring "Every whale is a mammal."**
  *   **Why:** This is a Natural Kind statement. Entry 6 ("Water is H₂O") has already settled her view on Natural Kinds. She will undoubtedly call it Synthetic (Kripke/Putnam style). This confirms what you already know: she distinguishes necessity from analyticity. It tells you nothing about *institutional* or *normative* concepts, which is where your thesis lives.

  **Instead, bring this sentence:**
  > **"In the game of chess, a player ought to move the bishop diagonally."**

  **Why this works:**
  1.  **It isolates the "Constitutive Rule" variable.** Promising is an institutional practice; Chess is an institutional practice.
  2.  **It isolates the "Normative" variable.** The sentence uses "ought" (reason/norm), matching your "has a reason" claim.
  3.  **The Prediction Split:**
      *   If she says **Analytic**: She believes constitutive rules of artificial practices are true by definition. This suggests your Promise case might also be Analytic (Searle-style), and you can write that paragraph.
      *   If she says **Synthetic**: She believes that even within institutions, the *normative force* ("ought") is a substantive addition to the *constitutive rule* ("moves diagonally"). This confirms your Promise case is Synthetic, and you owe the full section.
      *   If she says **Won't Say**: She treats institutional norms as borderline cases (like Entry 8). You should restructure your thesis to avoid leaning on the distinction.

  This sentence is superior to the Whale case because it mirrors the *structure* of your problem (Institution + Norm) rather than the structure of Entry 6 (Natural Kind + Identity).

  ### 4. Strategic Advice for the Workshop

  When you propose the Chess sentence, anticipate her follow-up. She may ask, "Is that a rule of the game, or a strategic recommendation?"
  *   Be prepared to clarify: "I mean it as a constitutive rule: to play chess *is* to abide by the movement rules."
  *   If she presses on the "ought," remind her of Entry 7. If "Right iff Happiness" is synthetic because it's a substantive moral claim, is "Chess Ought" synthetic because it's a substantive normative claim within a practice?

  **Summary for your thesis planning:**
  Plan for the **Synthetic** verdict. It is the most consistent with her rejection of normative analyticity in Entry 7 and her separation of necessity from analyticity in Entry 6. Use the Chess sentence to confirm this before you finalize your chapter structure. If she hesitates on Chess ("Won't Say"), take the hint and restructure. But do not assume Analytic; the ledger gives you no evidence she accepts normative constitutive rules as analytic truths.
