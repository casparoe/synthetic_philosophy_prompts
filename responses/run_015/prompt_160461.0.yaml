  **Rule A: The Two-Dimensionalist (Epistemic Intension)**
  *   **The Rule:** A sentence is *analytic* if it is true in all epistemically possible worlds (knowable a priori solely by grasping the concepts). It is *synthetic* if it requires empirical investigation or substantive theoretical commitment, even if it turns out to be metaphysically necessary.
