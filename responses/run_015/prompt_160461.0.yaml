  **Rule B: The Semantic Externalist (Meaning vs. Reference)**
  *   **The Rule:** A sentence is *analytic* only if its truth is fixed entirely by internal linguistic conventions (descriptions). If the truth depends on the external nature of the referent (natural kinds, social practices, or normative facts), it is *synthetic*.
