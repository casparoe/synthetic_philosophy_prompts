answer: |-
  This is a classic problem in political economy, and your intuitions are tracking very closely with the shift from *Food Availability Decline* (FAD) to *Entitlement Failure* (the Sen framework). But you're right to sense a gap: Sen explains *how* people starve (loss of purchasing power/access), but he doesn't fully solve the *moral attribution* problem when capacity is constrained.

  Let's brainstorm the pattern across your cases before locking in the architecture.

  ### Pattern Recognition
  Looking at your six cases, the variable that isn't "drought" or "crop yield" is **the elasticity of the political response.**

  *   **Cases 1, 2, 3, 6 (Crimes):** In all of these, the "shock" (war, blight, policy, blockade) met a state apparatus that had *options* it chose not to take. In Ireland, the option was stopping exports. In GLF, the option was lowering quotas. In Bengal, the option was prioritizing civilian rail over military logistics. The commonality is **substitution**: the state could have substituted one priority for another to save lives but didn't.
  *   **Case 5 (Disaster):** The shock met a state that maximized elasticity. Imports + cash transfers = shock absorbed.
  *   **Case 4 (Bangladesh '74):** This is your wobble point. Why? Because the "substitution" was harder. Inflation is harder to stop than a train schedule. But your gut says "political failure" because the institutional response was slow relative to the crisis speed.
  *   **The Hard Pair (The Poor Colony):** Here, the "substitution" wasn't possible. No rails, no ports, no money. The state *wanted* to help (in your counterfactual) but lacked the *mechanism*.

  Your intuition is hunting for a distinction between **Tragedy** (death despite best possible efforts given constraints) and **Crime** (death because efforts were misdirected, withheld, or negligently slow).

  ### The Principle: Culpable Preventability
  Here is the conceptual architecture that captures your verdicts. I call it the **Principle of Culpable Preventability**.

  > **Definition:** A famine constitutes a political crime when mass starvation occurs in a context where the governing authority possessed the *material capacity* and *administrative leverage* to prevent it, but failed to do so due to policy choice, ideological rigidity, or culpable negligence.

  This principle rests on three pillars:
  1.  **Entitlement Rupture:** The starvation must be driven by access failures, not absolute global scarcity (Sen's baseline).
  2.  **Capacity Threshold:** The state must have had the logistical/financial means to intervene (distinguishing Crime from Tragedy).
  3.  **Causal Link:** The failure to intervene must be traceable to a decision (or a chronic, fixable inertia) rather than physical impossibility.

  ### Testing the Principle Against Your Verdicts

  Let's run your cases through this architecture to see if anything breaks.

  *   **1. Bengal 1943:** **Verdict: Crime.**
      *   *Clause Check:* Entitlement rupture (yes, inflation/wages). Capacity (yes, UK war machine). Link (yes, prioritization of military stockpiles).
      *   *Result:* Holds.
  *   **2. Ireland 1840s:** **Verdict: Crime.**
      *   *Clause Check:* Entitlement rupture (yes, potato loss + rent). Capacity (yes, UK grain/ports). Link (yes, ideological commitment to laissez-faire/export continuity).
      *   *Result:* Holds.
  *   **3. Great Leap Forward:** **Verdict: Crime.**
      *   *Clause Check:* Entitlement rupture (yes, procurement). Capacity (yes, grain existed). Link (yes, quotas/misreporting).
      *   *Result:* Holds.
  *   **4. Bangladesh 1974:** **Verdict: Crime (Negligent).**
      *   *Clause Check:* Entitlement rupture (yes, flood/inflation). Capacity (Borderline, but international aid was accessible). Link (yes, institutional slowness).
      *   *Result:* Holds, but this is the stress point. If you argue the state *literally couldn't* afford imports, this slides toward Tragedy. But given your gut ("mostly political"), the principle holds because the *administrative leverage* to distribute existing food was mishandled.
  *   **5. Hypothetical Democracy:** **Verdict: Disaster.**
      *   *Clause Check:* Capacity (yes). Link (no, mitigation worked).
      *   *Result:* Holds.
  *   **6. Hypothetical Blockade:** **Verdict: Crime.**
      *   *Clause Check:* Capacity (yes, warehouses full). Link (yes, active blocking).
      *   *Result:* Holds.

  **The Hard Pair (The Poor Colony):**
  *   **Verdict: Tragedy.**
      *   *Clause Check:* Capacity (**No**).
      *   *Result:* The principle explicitly exempts this. If the rails don't exist, the state lacks the *administrative leverage* to move grain. Therefore, it is not a political crime under this definition, but a tragedy of underdevelopment.

  **Does this force you to overturn anything?**
  Only one nuance: **Case 4 (Bangladesh).** If you apply the *Capacity Threshold* strictly, you have to be sure the Bangladeshi state actually had the fiscal space to import enough rice. If they were truly bankrupt and global prices were prohibitive, the Principle of Culpable Preventability forces you to downgrade this from "Crime" to "Tragedy." However, most historians agree the failure was distributional and reactive, so "Negligent Crime" still fits.

  ### Application: The New Case
  **Scenario:** Modern climate-induced crop failure in a middle-income country. Government has funds. Delays aid for six months due to bureaucratic inertia (not malice).

  **Application of the Principle:**
  1.  **Entitlement Rupture:** Yes, crop failure reduces local access.
  2.  **Capacity Threshold:** Yes, "middle-income" + "has funds" satisfies the material capacity clause.
  3.  **Causal Link:** Here is the philosophical crunch. Is "inertia" a policy choice?
      *   In political philosophy, **chronic bureaucratic inertia in the face of mortal threat is culpable negligence.** A state has a "duty of rescue." If the mechanism exists (funds) but the *will to activate the mechanism* is delayed by fixable red tape, the resulting deaths are preventable.
      *   The distinction between "malice" and "inertia" collapses when the outcome is mass death. If you have the lifeboat and the engine works, but you spend six months debating who gets to steer, and people drown, you are responsible for the drowning.

  **Verdict:** **Political Crime (via Negligence).**
  The principle classifies this as a crime because the *capacity* existed and the *delay* was not physically imposed by nature, but administratively imposed by the state. The lack of malice mitigates the *moral wickedness*, but not the *political culpability*.

  ### The Fork: If You Can't Keep the Principle
  You asked me to be honest if a single principle saves every verdict. The Principle of Culpable Preventability works well, but it relies on your intuition about the "Poor Colony" holding up.

  There is a rival school of thought (Structuralist/Marxist) that argues **underdevelopment itself is a crime.** If the "Poor Colony" has no rails because the Metropole extracted all the capital for 100 years, then the "Tragedy" is actually a long-term Crime.

  If you feel that tension, you have to choose between two frameworks. Here are the costs of each:

  #### Candidate A: The Agency Model (The one I outlined above)
  *   **Core:** Focuses on *immediate* decision-making and capacity at the time of the famine.
  *   **Pros:** Cleanly distinguishes between "couldn't save them" (Tragedy) and "didn't save them" (Crime). Protects your "Poor Colony" intuition.
  *   **Cost:** It lets historical oppressors off the hook. If a colonial power strips a colony of infrastructure, then leaves, and a famine hits, the Agency Model says "Tragedy" because the *current* admin lacks capacity. It ignores the *genealogy* of the incapacity.

  #### Candidate B: The Structural Model
  *   **Core:** Focuses on the *historical conditions* that created the vulnerability.
  *   **Pros:** Captures the "Poor Colony" as a crime (because the poverty was manufactured). Captures the "Bureaucratic Inertia" case easily (inertia is a structural feature of the state).
  *   **Cost:** It blurs the line between Disaster and Crime almost entirely. If all vulnerability is politically constructed (which, to a degree, it is), then *every* famine is a crime. Case 5 (The Democracy) might even be implicated if you argue their wealth was built on extraction that made others vulnerable. It risks making the word "crime" so broad it loses its sharpness for cases like the GLF or the Blockade.

  ### Recommendation
  For your journalism, **stick with Candidate A (The Agency Model / Culpable Preventability).**

  It gives you the surgical precision you need to distinguish the Irish Famine from a hypothetical subsistence crisis in a stateless region. It allows you to call the "Bureaucratic Inertia" case a crime without having to argue that the government *hated* the victims. It centers the ** Duty of Rescue**.

  Your "structural food opacity" intuition is correct, but refine it: **Opacity is only criminal when the state has the light to turn on and chooses to leave it off.**
