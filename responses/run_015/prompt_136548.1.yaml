answer: |-
  Good morning.

  Looking around this room, I see a divide that doesn't usually sit at the same table. On one side, we have the people who spend their lives asking what justice *is*. You read Sen, Dworkin, Cohen. You argue over metrics, indices, and the moral weight of a preference. On the other side, we have the people who spend their lives deciding who gets *help*. You read case files, budget spreadsheets, and eligibility forms. You argue over waitlists, staffing ratios, and whether a form was filled out correctly.

  Usually, these two groups talk past each other. The theorists accuse the practitioners of administrative cruelty; the practitioners accuse the theorists of ivory tower irrelevance.

  Today, we are trying something different. This pilot program—issuing capability vouchers for childcare, training, and health instead of cash transfers—is not just a policy tweak. It is a physical manifestation of a philosophical argument.

  I want to be clear about what we are doing here. By rejecting cash, we are making a choice in the "Equality of What?" debate.

  If we believed in **Equality of Resources**, à la Dworkin, we would hand out cash. Cash is the neutral resource. It allows individuals to bid for what they value in the auction of their own lives. It respects their agency to define their own welfare.

  If we believed in **Equality of Welfare**, we might also hand out cash, or perhaps services tailored to maximize subjective happiness.

  But we didn't do that. We designed vouchers restricted to specific functionings. We are betting on **Equality of Capability**. We are saying that what matters isn't what people *have* (resources) or how happy they *are* (welfare), but what they are effectively *able to do and be*.

  However, I am not standing here to tell you that this design solves the debate. I am standing here to tell you that this design *imports* the debate into your daily work. And if we don't acknowledge the philosophical baggage we are handing to the social workers in this room, this pilot will fail.

  Here is the first hard truth.

  For the theorists: You have argued that capabilities are about freedom. Sen emphasizes the "freedom to achieve." But look at the voucher in your hand. It is not cash. It restricts choice. We have decided, administratively, that childcare, job training, and health access are the "valuable functionings" worth subsidizing. We have not subsidized leisure, or debt repayment, or sending money to a relative abroad.

  This is paternalism. It is benevolent, perhaps, but it is paternalism. We are asserting that we know better than the recipient what constitutes a valuable life. If we are truly committed to the Capability Approach, we must admit that by restricting the voucher, we are prioritizing *specific capabilities* over *general freedom*. That is a defensible position, but it is a moral position, not a neutral administrative one.

  Now, here is the second hard truth, and this one is for the practitioners.

  For the social workers and planners: You are used to measuring compliance. Did they show up? Did they sign the log? But under this framework, compliance is not success.

  In the Capability Approach, a voucher is not a capability. A voucher is a *commodity*. A capability is the *effective freedom* to use that commodity to achieve a functioning.

  If I give a single mother a childcare voucher, but she cannot find a provider who speaks her language, or who works hours that match her shift, or who she trusts with her child, she does not have the capability. She has a piece of paper.

  This changes your job. You are no longer just processors of benefits. You are managers of "conversion factors." You are responsible for the social, personal, and environmental barriers that turn a resource into a freedom. If a client doesn't use their voucher, the theorists in this room will ask: Was it a failure of agency, or a failure of design?

  This leads to the most uncomfortable question we have to face this week.

  **What do we do with the non-users?**

  Imagine a participant who receives a job training voucher and chooses not to use it.

  If we are strict **Resource Egalitarians**, we say: "We gave them the resource. They chose not to use it. That is their responsibility. Inequality has not occurred; they had the same starting bid as everyone else."

  But if we are **Capability Egalitarians**, the answer is murky.
  If the goal is to expand their freedom to work, and they don't take it, have we failed them?
  Or, conversely, did they exercise their capability by *choosing* not to train? Perhaps they decided to care for an aging parent instead. Is that a "failed outcome" or a "valued functioning"?

  The voucher system treats non-use as waste. The philosophy treats non-use as data.
  If a client doesn't use the health voucher, the administrator sees a sunk cost. The philosopher sees a potential mismatch in values or a hidden barrier.

  Social workers, you will be caught in the middle. The theorists will ask you to investigate *why* the voucher wasn't used. The budget office will ask you to explain why the funds weren't drawn down. You will be pressured to nudge, to push, to ensure "uptake." But if you push too hard, you undermine the very freedom the Capability Approach claims to value. You turn a capability into a mandate.

  So, why are we doing this? Why invite this tension?

  Because the status quo is dishonest.

  When we give cash, we pretend we aren't making value judgments. But we are. We are judging that money is the best proxy for need.
  When we give restricted services, we pretend it's just bureaucracy. But it's not. It's a statement about what a good life looks like.

  This pilot forces us to make that statement explicitly. It forces us to admit that we value health over other goods. It forces us to admit that we believe structural barriers prevent resources from becoming freedoms.

  I am not asking you to resolve this tension today. I am asking you to stop pretending it doesn't exist.

  To the theorists: Do not treat this room as a seminar. These are not hypotheticals. When you argue about the definition of "functioning," remember that a social worker has to code that definition into a database field next Monday. If your concepts are too fuzzy, they will become rigid rules that hurt the people you want to help.

  To the practitioners: Do not treat the theorists as distractions. When they ask you about "agency" or "conversion factors," they are giving you language to describe the frustration you feel when a policy looks good on paper but fails in the living room. Use their concepts to advocate for the flexibility you need. If a voucher doesn't work because of a conversion factor, you need the vocabulary to explain that this isn't client non-compliance; it is program failure.

  We are not here to achieve false harmony. We are not going to leave this room agreeing on whether Sen was right about everything or whether Dworkin's auction holds up.

  We are here to ensure that when we hand a voucher to a citizen, we understand the weight of what we are giving them.

  If we are giving them resources, we must ensure the amount is fair.
  If we are giving them capabilities, we must ensure the path is open.
  If we are giving them welfare, we must ensure we aren't imposing our own happiness on them.

  This pilot is administratively weird because justice is philosophically weird. It is messy. It is contested.

  Let's not clean that up too much. Let's use this workshop to map the friction. Let's figure out where the theory bites the road, and where the road breaks the theory. Because on Monday, when the office opens, the people walking through our doors won't care about our footnotes or our filing codes. They will only care if this system helps them live the life they have reason to value.

  Let's get to work. Thank you.
