answer: |-
  Here is the principle, derived directly from your verdicts, followed by the analysis of where it breaks and the answers to your specific cases.

  ### The Principle: Constrained Discretionary Log-Growth

  **Objective:** Maximize the expected logarithmic growth of **Discretionary Capital**, subject to **Horizon**, **Uncertainty**, and **Solvency** constraints. If a hard **Goal Constraint** binds, switch objective to maximize the probability of meeting the goal.

  **Computation:**

  1.  **Define Discretionary Capital ($D$):**
      $$D = \text{Total Bankroll} - \text{PV(Essential Liabilities)}$$
      *Essential Liabilities* are all fixed withdrawals (rent) due before the next anticipated infusion of capital. If $D \le 0$, bet size is zero.
  2.  **Adjust the Edge ($E_{adj}$):**
      $$E_{adj} = \max(0, \text{Estimated Edge} - \lambda \cdot \text{Estimation Error})$$
      Where $\lambda$ is a confidence parameter (e.g., 1.0 for one standard deviation). If the lower bound of your edge estimate is negative, do not bet.
  3.  **Calculate Base Fraction ($f_{base}$):**
      Compute the Kelly fraction using $E_{adj}$ and the bet's variance/odds.
  4.  **Apply Leverage Cap ($C_{lev}$):**
      $$f_{capped} = \min(f_{base}, C_{lev})$$
      Where $C_{lev}$ is a hard limit on gross exposure (e.g., 5x) determined by liquidity and margin risk, regardless of how small the variance is.
  5.  **Apply Horizon Discount ($H$):**
      $$f_{final} = f_{capped} \times H$$
      Where $H = 1$ for repeatable opportunities ($N > 50$). For single or few-shot opportunities ($N < 10$), $H$ scales down (e.g., $H \approx 0.25$) to reflect the higher utility cost of permanent loss versus temporary drawdown.
  6.  **Apply Correlation Adjustment:**
      If holding multiple positions, solve for the portfolio vector that maximizes log-growth of $D$ given the correlation matrix. Do not sum individual $f_{final}$ values if correlations are positive.
  7.  **Goal Override:**
      If a specific capital target $G$ must be met by time $T$ and $D_{current} < G$:
      *   If Edge $> 0$: Maximize $P(D_T > G)$ by betting smaller than Kelly to reduce variance of outcome (survival).
      *   If Edge $\le 0$: Maximize $P(D_T > G)$ by betting large/rarely to increase variance of outcome (lottery).

  ---

  ### Clause Mapping: Which Verdict Forced What

  *   **Clause 1 (Discretionary Capital):** Forced by **(c)**. Your discomfort betting 20% when rent is due, and your willingness to bet 20% when bankroll is 100x rent, dictates that "wealth" in the utility function is not total bankroll, but bankroll minus subsistence needs. This makes the Kelly fraction effectively dynamic relative to total net worth.
  *   **Clause 2 (Edge Adjustment):** Forced by **(i)**. Your refusal to bet full Kelly on a 4% edge with high estimation error, opting for a quarter-size instead, requires a direct penalty on the edge input before calculation.
  *   **Clause 3 (Leverage Cap):** Forced by **(d)**. Kelly explodes when variance approaches zero. Your hard ceiling of 3–5x leverage regardless of the Sharpe ratio requires an external constraint unrelated to edge or probability.
  *   **Clause 4 (Horizon Discount):** Forced by **(b)**. Log-utility is asymptotic; it assumes you can play forever to recover from variance. Your refusal to bet 20% on a one-shot net-worth risk (preferring 5%) indicates you value "not going broke once" more than "growing fastest over infinite time." This clause reduces sizing when repetition is not guaranteed.
  *   **Clause 5 (Correlation):** Forced by **(h)** and **(f)**. Your comfort with high exposure on independent bets versus correlated ones, and your valuation of variance-reducing hedges even at negative EV, requires portfolio optimization rather than bet-by-bet sizing.
  *   **Clause 6 (Goal Override):** Forced by **(g)** and **(g-prime)**. When a deadline exists, growth rate is irrelevant; only the distribution of terminal wealth matters. This clause switches the mathematical objective from $\max E[\ln(W)]$ to $\max P(W_T > \text{Goal})$.

  ---

  ### The Conflicts: What Must Go

  You asked which verdicts my principle cannot accommodate, and specifically about (b) and (g-prime).

  **1. Verdict (b) is the casualty of strict Log-Growth.**
  If you strictly maximize Expected Log Wealth, (b) is mathematically incorrect. A 60/40 flip has the same geometric growth contribution whether it is the first of 100 flips or the only flip you ever take. Your gut feeling in (b) implies a utility function that is *more* risk-averse than logarithmic for low $N$ (number of bets).
  *   **Resolution:** My principle accommodates this via the **Horizon Discount**. However, if you demand theoretical purity, (b) must go. You cannot hold that Log-Utility is the truth *and* that single-event risk is special. One is a heuristic for survival, the other is an asymptotic limit. If you keep (b), you admit you are not a Log-Maximizer; you are a "Ruin-Avoider who uses Log for approximation."

  **2. Verdict (g-prime) is inconsistent with (g).**
  In (g) (Positive EV), you bet small to protect the path to the goal. In (g-prime) (Negative EV), you bet big to hope for a miracle.
  *   **Resolution:** My principle accommodates *both* under the **Goal Override**. When Edge > 0, variance is the enemy of reaching a higher target (you might drift down). When Edge < 0, drift is the enemy, so variance is the friend (you need a lucky spike).
  *   **The Catch:** While (g) and (g-prime) are consistent with *each other* under a Goal Objective, (g-prime) is inconsistent with *wealth preservation*. It is mathematically suicidal. If you keep (g-prime), you are admitting that under desperation, you treat wealth as a binary option (Goal or Bust) rather than a resource. This is rational only if the utility of failing to meet the deposit is catastrophic (infinite negative utility). If failing the deposit is just "bad," (g-prime) is irrational.

  **3. The Withdrawal Clause:**
  You asked if this is a constraint bolted on or part of the principle.
  *   **Verdict:** It is **internal to the principle**. It defines the domain of the utility function. If you treat rent as an external constraint, you might bet 20% of total bankroll and hope you don't need the rent money. By defining $D = W - L$, you acknowledge that money needed for survival has infinite marginal utility compared to discretionary money. It is not a bolt-on; it is the definition of "Wealth" for your specific utility function.

  ---

  ### The Two Further Cases

  **Case 1: Daily Bets, Monthly Rent**
  *   **Question:** What fraction to bet, and when to recompute?
  *   **Answer:** Recompute **per bet**.
  *   **Reasoning:** Your Discretionary Capital ($D$) changes with every win or loss. The Liability ($L$) remains constant until the rent is paid.
      *   *Start of Month:* $D$ is lowest (full rent liability outstanding). Bet size is smallest.
      *   *End of Month:* If you have won, $D$ has increased (Liability is fixed, Bankroll grew). Bet size increases.
      *   *Correction:* Do not wait until the rent is paid to "free up" capital. The capital is never "free" until the check clears. However, as you accumulate profit *during* the month, your buffer above the rent requirement grows, allowing larger bets on the surplus.
      *   *Specific Instruction:* Before every daily bet, calculate $D = \text{Current Bankroll} - \text{Rent Due}$. Apply your Kelly fraction to $D$. This ensures that if you lose your entire discretionary stack, you still have exactly the rent money left untouched.

  **Case 2: The Backer (Staking)**
  *   **Scenario:** Backer provides capital. You keep 50% profit, 0% loss.
  *   **Question:** How much of *his* money to bet? Does growth-rate reasoning apply?
  *   **Answer:** Bet **Full Kelly of the Backer's Risk Capital**.
  *   **Reasoning:**
      1.  **Your Personal Risk:** You bear zero financial loss. Your personal "bankroll" risk is zero. Standard Kelly on *your* wealth is undefined (division by zero).
      2.  **Your Income Stream:** Your income is $0.5 \times \text{Backer Profit}$. To maximize your long-term income, you must maximize the Backer's long-term capital growth. If the Backer goes bust, your income stream ends.
      3.  **Growth Rate:** The Backer is the one bearing the variance. Therefore, the Backer's utility function (likely Log-Wealth to avoid ruin) dictates the sizing. If you overbet, you increase the Backer's risk of ruin, which kills your job. If you underbet, you leave money on the table.
      4.  **Reputation Capital:** While you don't bear financial loss, you bear "reputation loss." If you blow up the backer, you cannot get staked again. This acts as a synthetic bankroll. Maximizing the Backer's geometric growth rate is the proxy for maximizing your reputation longevity.
      5.  **Conclusion:** Ignore your "50% share" when sizing. Size the bet as if the Backer were betting their own money for their own long-term growth. Use Full Kelly (adjusted for their risk tolerance, which you should assume is Log-like to keep you employed). Do not shrink the bet because you only keep half; the leverage applies to the capital at risk, which is his.

  ### Summary of Collapse
  If you drop the **Discretionary Capital** clause, (c) collapses; you become vulnerable to ruin by rent.
  If you drop the **Horizon Discount**, (b) collapses; you must accept 20% on the one-shot net worth bet.
  If you drop the **Goal Override**, (g) and (g-prime) collapse; you must either always grow (ignoring the deadline) or never play negative EV (ignoring the desperation).
  If you drop the **Leverage Cap**, (d) collapses; you must accept absurd leverage on tiny edges.

  Your intuition is robust. It is not "wrong" compared to theory; it is a more complex utility function than simple Log-Wealth. It is **Log-Wealth of Discretionary Capital, with Risk-of-Ruin constraints and Goal-Dependent switching.**
