prompt: |-
  hey im drafting a novel about group panic and i keep coming back to lord of the flies. can you read goldings book through the lens of individual contributions to colletive harm and that inefficacy objection people always raise about climate or voting? specifically: each boys silence or cruelty feels useless alone, yet together they invent a beast that kills them. does golding show that philosophers who say one vote never matters are missing something about emergent harm? or is it just scared kids rationalizing? i want a reading that takes both the novel and the ethics seriously -- where does the conch fail as collective responsability, and where does the book resist being a climate parable? dont give me a bibliography, talk it through like were at a bar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** A novel draft about group panic.
