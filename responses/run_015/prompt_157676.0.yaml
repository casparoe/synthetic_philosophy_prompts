answer: |-
  **The Mosaic and the Mandate**

  We trace the pattern on the wall of **Law**,
  Strike flint on stone to light the dry **Match**,
  Feel the surge rise in the arm as **Power**,
  Take the bare occurrence as the **Fact**,
  Deny the hidden link of **Necessity**,
  Watch the sky open and deliver **Rain**.

  It falls again, the steady drum of **Rain**,
  Codified within the book of **Law**,
  No ghost behind the cloud to force the **Match**,
  Just the sum of parts without the **Power**,
  A system built on every local **Fact**,
  Rejecting any strong **Necessity**.

  Yet something claims a right to wield **Power**,
  To tell the cloud it cannot stop the **Rain**,
  To say the strike implies the light by **Law**,
  Not mere coincidence of **Fact** and **Match**,
  But something binding in the very **Necessity**,
  A glue that holds the world beyond the **Power**.

  Consider the box containing the **Match**,
  Unstruck, resting in its dark of **Power**,
  Would it burn if friction brought **Necessity**?
  Or only if the sky allows the **Rain**,
  According to the best system of **Law**,
  Where nothing more is true than what is **Fact**?

  The singularist cries for **Necessity**,
  Even if no one strikes the lonely **Match**,
  The relation holds regardless of the **Fact**,
  While the dispositionalist trusts the **Power**,
  To bring the fire before the fall of **Rain**,
  Without appealing to a external **Law**.

  So we are left with nothing but the **Fact**,
  Or so the Humean claims of **Necessity**,
  While the anti-Humean holds the unlit **Match**,
  Waiting for the world to show its **Power**,
  Whether the sky is bound to bring the **Rain**,
  Or merely follows a descriptive **Law**.

  *Envoi*

  Had the **Match** been wet, where goes the **Necessity**?
  The mosaic ends; there is no further **Fact**.
  Does the **Law** command the **Rain**, or **Power**?

  ***

  **Note for the Pub**

  The end-words are the battleground. *Law*, *Power*, and *Necessity* are doing double duty: read them descriptively and the poem is a Humean catalogue of regularities; read them prescriptively and it's an Anti-Humean account of governing relations. *Match* and *Rain* anchor the counterfactuals and the mosaic. The envoi refuses to settle the metaphysics; it asks what guarantees the next stanza (the future). The Humean has no answer but "it has so far"; the Anti-Humean says "it must." The poem ends before the next line proves either right.
