answer: |-
  # Colloquium Prep Sheet: Non-Human Actors & The Menu of History

  ### Opening Strategy (The First Two Minutes)
  **Concede Immediately:**
  *   **The Science:** Acknowledge you are not a climatologist or epidemiologist. State clearly that you are relying on established attribution science, not generating new climate data, and that your claims are about the *historical reception* of these events, not just their physical occurrence.
  *   **The Metaphor:** Admit that "agency" is a loaded term. Concede that if "agency" implies "intent," you are guilty of anthropomorphism. Clarify upfront that you are using it as a shorthand for "causal constraint with temporal lag."

  **Refuse to Yield:**
  *   **The Temporal Mismatch:** Do not let them collapse "credit-scrambling" into simple "uncertainty." The archive isn't just unsure; it is *systematically wrong* because the effect outlives the decision.
  *   **The Double Counterfactual:** Stand firm that if removing the non-human changes the outcome *and* a different human choice would also change it, it is not determinism. It is interaction.

  ---

  ### The Objections (Ordered by Likelihood & Damage)

  #### 1. The Senior Cultural Historian (The Foundation Attack)
  **The Objection:** "You're smuggling intentionality in through the back door. If a germ doesn't intend, it's a force, not an actor. By calling it an actor, you're asking us to read nature like a text, but nature doesn't speak. You're turning history into poetry."
  **The Reply (2 mins):** "I'm not asking you to read nature as a text, but to read the *archive* as a misreading of nature. When I say 'menu-setting agency,' I'm describing a constraint that operates on a different clock than human intention. Napoleon intended to hold Saint-Domingue; the yellow fever virus intended nothing. But the virus arrived on a biological clock that ignored Napoleon's strategic clock. The result is that the archive credits Napoleon's strategic failure, when the menu of viable strategies had already been closed by the virus. I use 'actor' not to grant the virus a soul, but to mark the spot where human intention hit a wall it didn't see coming. If we only study intention, we study the plan, not the wreck."
  **The Soft Spot:** You are still using the word "agency," which linguistically invites the intentionality you deny.

  #### 2. The Physical Climate Scientist (The Empirical Attack)
  **The Objection:** "You're hanging a specific harvest failure in 1816 on Tambora. Global cooling was under a degree. Without a counterfactual ensemble, you can't attribute a local famine to a global signal. Vulnerability causes famine, not temperature."
  **The Reply (2 mins):** "I agree that vulnerability is the multiplier. A degree of cooling doesn't starve a well-managed grain reserve. But my argument isn't that the volcano caused the famine in isolation; it's that the volcano changed the cost of every human decision regarding that famine. It took a policy failure and turned it into a catastrophe. You look for attribution in the temperature record; I'm looking for attribution in the price records and the migration logs. The 'credit-scrambling' happens because the policymakers in 1816 didn't know the cooling was volcanic. They blamed merchants. I'm not claiming the volcano pulled the trigger; I'm claiming it loaded the gun that human hands fired."
  **The Soft Spot:** You rely on narrative linkage where they require probabilistic attribution.

  #### 3. The Two Environmental Historians (The Political Attack)
  **The Objection:** "If a volcano is an actor, who gets off the hook? If Tambora causes the riot, does the landlord who hoarded grain get absolved? This sounds like Guns-Germs-Steel with better manners."
  **The Reply (2 mins):** "That's exactly why I have the Double Counterfactual Rule. I only promote the volcano to 'actor' if a different human arrangement would have changed the outcome. If the landlord hadn't hoarded, people eat. So the landlord is still guilty. The volcano didn't force the hoarding; it made the hoarding lethal. My goal isn't to absolve humans, but to stop us from blaming the wrong humans. We blame the rioters for violence, or the merchants for prices. I want to show how the non-human context made certain moral failures fatal rather than just expensive."
  **The Soft Spot:** In political debate, "context" is often heard as "excuse," regardless of your counterfactuals.

  #### 4. The Chair (The Terminological Attack)
  **The Objection:** "Is 'actor' doing causal work or literary work? If you mean 'variable,' say 'variable.' If you mean 'agent,' prove it. Right now, it sounds like you want the precision of science with the flair of literature."
  **The Reply (2 mins):** "It's doing temporal work. A 'variable' is static; it exists in a regression table. An 'actor' in my sense implies a trajectory that intersects with human time. 'Variable' doesn't capture the lag. 'Variable' doesn't explain why the archive credits the wrong cause. I need a term that captures something that *does* something but doesn't *decide* something. 'Actor' is imperfect, but 'variable' erases the mismatch in clocks that causes the historical confusion I'm trying to solve."
  **The Soft Spot:** "Actor" is so laden with sociological baggage that you may spend the whole book defending the word rather than the history.

  #### 5. The Economic Historian (The Methodological Attack)
  **The Objection:** "Where's the identification? Isn't the timing endogenous? Napoleon went to the Caribbean *knowing* the climate. You can't treat the germ as an exogenous shock if the expedition was selected into that environment."
  **The Reply (2 mins):** "The selection was into the geography, not the epidemic. The yellow fever outbreak in 1802 was episodic and unpredictable to the French command in a way that seasonal heat wasn't. They planned for a tropical climate; they didn't plan for a vector-borne epidemic that specifically targeted European troops. I'm treating the *outbreak intensity* as the shock, not the location. The counterfactual is: same expedition, different year, no epidemic, different outcome. That variation gives me the leverage to separate the germ from the strategy."
  **The Soft Spot:** Historical knowledge of disease vectors is messy; endogeneity is harder to rule out than in a modern dataset.

  #### 6. The Grad Student (The Theoretical Attack)
  **The Objection:** "If microbes get agency, why not sugar? Why not soil? If you're doing ANT (Actor-Network Theory), what's your stopping rule? Or is this just agency for things that kill white men?"
  **The Reply (2 mins):** "My stopping rule is 'credit-scrambling.' Sugar doesn't scramble the archive's credit. Soil doesn't usually make historians blame the wrong decade. I'm not building a flat ontology where everything is an actor. I'm building a specific tool for moments where the non-human cause is systematically misidentified by the participants. If the soil causes a dust bowl and the archive blames the farmers' ploughing techniques exclusively, then the soil enters the room. If not, it stays background. It's not about what the object *is*, it's about what the object *does* to the historical record."
  **The Soft Spot:** This is an arbitrary boundary. Soil *can* scramble credit (e.g., the Dust Bowl), so your rule might be inconsistent.

  ---

  ### The "Gang Up"
  **Who:** The **Climate Scientist** and the **Economic Historian**.
  **The Point:** Causal Identification.
  **Why:** They both speak the language of "attribution" and "endogeneity." The Scientist will say you can't attribute the harvest to the volcano without an ensemble; the Economist will say you can't attribute the defeat to the germ without ruling out strategic error. Together, they will argue that your "Double Counterfactual" is a narrative device, not a methodological proof. They will demand a level of certainty your sources cannot provide.

  ---

  ### The Question You Hope Nobody Asks
  **The Question:** "Have you simply rebuilt environmental determinism with better manners?"
  **Why:** This cuts to the ethical core of the project. If your "menu-setting" is just a fancy way of saying "environment limits humans," you haven't added anything new except a vocabulary that risks obscuring human responsibility.
  **Can You Answer It?** **No.**
  **Honesty:** This is the hole in the boat. Your "Double Counterfactual Rule" is your shield, but if the "menu" is narrow enough, the human choice becomes illusory. You can argue that you are describing *constraints* rather than *outcomes*, but the line between a very narrow menu and determinism is philosophical, not empirical. You will have to concede that the risk is real and that the book is an attempt to walk that line without falling off, rather than a proof that the line doesn't exist.
