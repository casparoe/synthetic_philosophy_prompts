answer: |-
  **Question 1**
  Let's dive straight into the status of your own project. In *Philosophy and the Mirror of Nature*, Rorty suggests we ought to treat philosophy as conversation rather than a tribunal of reason. But when you argue that the epistemological project since Descartes was merely a historical artefact we can discard, are you claiming that description is *true* in the old correspondence sense, or is it simply a vocabulary you find more useful for our current purposes?

  *   **Follow-up (if he says it's just a useful vocabulary):** If it's merely useful vocabulary, on what grounds do you recommend it to us? Is it useful because it helps us cope better, or because it's a more *accurate* diagnosis of the history of ideas? If the latter, haven't you quietly reinstated the very notion of accuracy you're asking us to abandon?

  **Question 2**
  You've often said that pragmatism isn't offering a rival theory of truth to compete with realism, but rather a recommendation to change the subject entirely. But surely, to recommend changing the subject is itself to make a claim about the subject we're leaving behind—namely, that it's sterile or confused. Doesn't that recommendation itself stand in need of justification that goes beyond mere preference?

  *   **Follow-up (if he diagnoses you as trapped in the Kantian scheme):** I anticipate you might say I'm still trapped inside the scheme/content distinction. But if I cannot step outside that distinction to evaluate your recommendation, how can you? Are you not relying on the very tools of reasoning you claim are obsolete to persuade us to drop them?

  **Question 3**
  Let's press on that diagnosis. You frequently suggest that objectors are suffering from a lingering attachment to the 'Mirror' metaphor. But if your pragmatism is truly just a new vocabulary, why does it carry this therapeutic sting? Why is the realist not just speaking a different dialect, but rather someone *mistaken*? Is there not a normative force to your critique that belies the claim that you're merely changing the subject?

  *   **Follow-up (if he says the realist vocabulary is less democratic/useful):** So the criterion is social utility? That leads me to my next worry. If justification is always relative to an audience of peers, how do you adjudicate between our liberal academic peers and, say, the Thomist colleagues in the building next door?

  **Question 4**
  To put that sharply: if your story about justification being audience-relative is just what *your* peers let you get away with saying, why ought we prefer it to the Thomist story the colleagues in the building next door let each other get away with? If there is no appeal to a mind-independent truth, isn't this just tribalism with a bibliography?

  *   **Follow-up (if he says we should prefer our peers because they are more inclusive):** But that appeal to inclusivity looks suspiciously like a universal moral truth. You're saying we *ought* to prefer the liberal vocabulary because it's objectively more inclusive, are you not? Or is 'inclusivity' just another word for 'what our tribe prefers'?

  **Question 5**
  If it's the latter, we seem to hit a self-refutation worry. If every claim is only justified relative to a specific community's norms, then your claim that 'all claims are justified relative to norms' is only justified relative to *your* community's norms. Why should the Thomist, or the scientific realist, accept a premise that invalidates their own starting point by fiat?

  *   **Follow-up (if he says he's not making a universal claim):** Then you're retreating to irony. But a philosophy that cannot assert its own premises without irony struggles to offer guidance. If you can't tell the Thomist he's wrong, only that he's 'not one of us', have you not surrendered philosophy's critical power?

  **Question 6**
  Let's shift from peers to the world. You argue that beliefs don't represent the world, they are tools for coping. But when an engineer builds a bridge, it either stands or falls. Doesn't the falling bridge suggest that some beliefs track the structure of reality better than others? Can 'coping' really do all the work that the truth of beliefs was doing, or does the resistance of the world quietly smuggle representation back in?

  *   **Follow-up (if he says the world causes beliefs but doesn't justify them):** Causation isn't enough. If the world causes me to believe the bridge will stand, and it falls, the world has effectively said 'no'. Doesn't that negative feedback loop function exactly like a truth-condition? Are you not drawing a distinction without a difference?

  **Question 7**
  So, if we accept that the world pushes back against our vocabulary, isn't that push-back a form of representation? If I say 'the bridge is safe' and it collapses, my belief failed to mirror the state of affairs. Why resist calling that 'falsity'? Is the antirepresentationalist line sustainable when physical consequences are so stark?

  *   **Follow-up (if he says 'true' is just a compliment we pay to successful beliefs):** Then 'truth' becomes a purely retrospective label for success. But science often succeeds *because* it anticipated how the world would behave. Doesn't that predictive success imply the theory was latching onto something real, rather than just being a convenient tool?

  **Question 8**
  This brings us to the disparity between domains. Do you really want science and politics to be on all fours as far as being in touch with reality goes? Aeroplanes fly reliably across the globe; parliaments mostly don't produce consensus or stable outcomes. Is there not a difference in the degree of world-constraint between these two activities?

  *   **Follow-up (if he says both are social practices):** But the aeroplane works regardless of whether the community agrees it works. The parliament fails if the community disagrees. If the world constrains science more tightly than politics, doesn't that suggest science is doing something representational that politics isn't?

  **Question 9**
  If you concede that science is more constrained by the world, does that not vindicate the realist intuition that some vocabularies are better because they hook onto the joints of nature? If pragmatism treats all vocabularies as equally 'made', how do you account for the stubbornness of the physical world compared to the malleability of social norms?

  *   **Follow-up (if he says stubbornness is just causal resistance):** Causal resistance is precisely what realists mean by mind-independence. If you grant the world causal power to veto our beliefs, haven't you granted the core of the representationalist thesis, merely refusing to use the word 'truth'?

  **Question 10**
  Finally, I want to ask about the limits of your position. You've defended this view for a career. What would actually count against it? Is there a falsifier for a position that seems built to absorb every objection as just more vocabulary we happen to be stuck with? If nothing can prove you wrong, are we doing philosophy, or are we witnessing a conversion narrative?

  *   **Follow-up (if he says philosophical positions aren't the sort of thing that can be falsified):** Then they aren't knowledge claims. If they aren't knowledge claims, why should we take them seriously as philosophy rather than as literature? If you demand we drop the search for truth, what do we gain, other than the licence to stop arguing?
