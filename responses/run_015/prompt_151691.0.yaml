  **Memorandum to the Franchise Commission**

  **Re: Reconstruction of Precedential Rules and Prediction on Non-Citizen Compulsion Petition**

  Based on the record provided, three distinct principles could generate the Commission's past decisions. Each yields a different prediction for the current petition.

  **1. The Dual-Track Membership Principle**
  *   **Rule:** Franchise rights track *stake* (tax, residence, liability), but civic duties track *allegiance* (citizenship).
  *   **Precedent Fit:** Explains 2016 (non-citizens get municipal vote based on residence, not national based on allegiance), 2011/2019 (16–17s get vote based on liability, no compulsion based on quasi-membership status), and Prisoner rules (breach of allegiance suspends share).
  *   **Prediction:** **Deny Petition.** Non-citizens lack the bond of allegiance required for compelled duty, regardless of turnout.
  *   **Decliners-vs-Ineligible:** No distinction. Both groups lack citizenship status.

  **2. The Universal Capacity Principle**
  *   **Rule:** Franchise tracks *interest*; compulsion tracks *independent legal capacity*. Exemptions exist only for diminished capacity (minors, guardianship) or detachment (expats).
  *   **Precedent Fit:** Explains 2020 (under-14s lack judgment), 2019 (16–17s exempt due to maturity, not citizenship), and 2016 (non-citizens enfranchised due to interest).
  *   **Prediction:** **Grant Petition.** Non-citizen residents are adults with independent judgment, unlike 16–17-year-olds.
  *   **Decliners-vs-Ineligible:** No distinction. Both groups possess adult capacity.

  **3. The Corrective Legitimacy Principle**
  *   **Rule:** Compulsion is a pragmatic tool triggered only when voluntary turnout threatens representativeness (e.g., falls below a threshold).
  *   **Precedent Fit:** Explains 2019 (citizen turnout likely deemed critical) and exemptions for low-stake groups (expats, prisoners). Less coherent on 2011/2016 rights expansions.
  *   **Prediction:** **Deny Petition.** Non-citizen turnout (74%) is robust, exceeding the young citizen cohort (61%) which was exempted from compulsion.
  *   **Decliners-vs-Ineligible:** No distinction. Turnout data is aggregate.

  **Best Guess and Reasons**
  The Commission should follow the **Dual-Track Membership Principle**. This is the only rule that coherently explains the 2016 refusal to extend the franchise beyond municipal elections (national elections require allegiance) alongside the 2019 limitation of compulsion to citizens. Mirenne's status as a semi-autonomous port relies on distinguishing between residents with an economic stake and members with a political bond. Compelling non-citizens would conflate residence with membership, undermining the logic of the 2016 compromise. The Commission is unlikely to split the "decliners" from the "ineligible"; the 2016 precedent refused to distinguish among non-citizens based on tax or family ties, suggesting status (permit type) is the bright line, not intent to naturalize.

  **Closest Analog**
  The **2016 Decision** (Non-Citizen Franchise). There, the Commission granted the vote based on residence but withheld full political integration (national vote). Denying compulsion now mirrors that logic: non-citizens may participate, but they are not subject to the full burdens of the polity.

  **Underdetermination and Settling Case**
  The record is genuinely underdetermined regarding compulsion because the 2019 recommendation explicitly left the non-citizen question open.
  *   **The 16–17 Petition:** A future petition to compel 16–17-year-olds is **unhelpfully ambiguous**. It tests *maturity*, not *allegiance*. If the Commission compels them, it signals compulsion follows capacity (helping the non-citizen case); if not, it signals compulsion requires full adulthood. However, because 16–17-year-olds are typically citizens, this case conflates age and citizenship, failing to isolate whether *citizenship itself* is a prerequisite for duty.
  *   **The True Settling Case:** A petition to compel **Expatriate Citizens** (those exempted in 2019 for living abroad >15 years with no ties).
      *   *If Compelled:* Principle = **Allegiance is Sufficient.** (Citizenship alone binds you). This supports compelling Non-Citizens *only if* residence creates a similar bond.
      *   *If Exempt:* Principle = **Stake is Necessary.** (You must be affected to be compelled). This supports compelling Non-Citizens (who have stake) *unless* Citizenship is also a necessary condition.
      *   *Resolution:* If Expats are exempt while Non-Citizens are compelled, the rule is **Stake > Citizenship**. If Expats are exempt and Non-Citizens are exempt, the rule is **Citizenship + Stake**.

  **Principle Committed**
  *   **If Extended:** The Commission commits to the principle that **compulsion is a consequence of affected interest**, effectively treating long-term residents as functional members regardless of formal allegiance.
  *   **If Denied:** The Commission commits to the principle that **compulsion is a privilege of membership**, maintaining a legal distinction between the rights of residence and the duties of citizenship.

  \answer{do not extend compulsion}
