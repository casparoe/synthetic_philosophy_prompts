answer: |-
  Here is a breakdown of the claims hidden inside your brother-in-law's favourite phrase, arranged from the mundane to the metaphysical. Following that, I have addressed the two specific arguments you raised.

  ### The Five Claims of the "Fifty-Quid Note"

  **1. The "Bending Down" Claim**
  *   **The Claim:** If a profit opportunity is obvious and requires no skill to see, it will be taken so quickly that it ceases to exist by the time you notice it.
  *   **Plausibility:** High. In liquid markets, visible errors vanish in milliseconds.
  *   **Coherence:** Fully coherent.
  *   **Supports:** Move (a). It argues that the *gross* profit might exist, but the speed required to capture it imposes a cost (technology, attention) that eats the margin.
  *   **Verdict:** This is the boring platitude. It doesn't say you can't win; it says you can't win by being slow or lazy.

  **2. The "Transaction Cost" Claim**
  *   **The Claim:** Even if the note is there, the cost of picking it up (taxes, fees, spread, your own time) exceeds £50.
  *   **Plausibility:** High. This is the primary reason active trading often underperforms passive holding.
  *   **Coherence:** Fully coherent.
  *   **Supports:** Move (a). It concedes the market might be wrong, but argues the *net* return to you is negative.
  *   **Verdict:** This is the strongest practical argument against your model. It shifts the debate from "is the market right?" to "is your edge big enough to cover the friction?"

  **3. The "Counterparty" Claim**
  *   **The Claim:** If you see a note on the pavement, someone else put it there. In a trade, someone is taking the other side of your bet. If they are willing to trade with you, they likely know something you don't.
  *   **Plausibility:** Moderate to High. In professional markets, this is the dominant risk.
  *   **Coherence:** Coherent, but relies on the assumption that your opponent is better informed than you.
  *   **Supports:** Move (b). This is the "you are the mark" argument.
  *   **Verdict:** This is the most dangerous claim for you. It suggests that the existence of a bet is evidence *against* its profitability. However, it fails if your model processes public data in a way others simply ignore or cannot automate.

  **4. The "Public Information" Claim**
  *   **The Claim:** The current price already reflects all publicly available data (past scores, team news, weather). You cannot gain an edge using data everyone else has.
  *   **Plausibility:** Moderate. Markets are good at aggregating public data, but not perfect.
  *   **Coherence:** Coherent.
  *   **Supports:** Move (c). It argues the price is the best estimate *given public info*.
  *   **Verdict:** This is the version of efficiency most serious traders accept. It implies your model must find a *pattern* in the public data that the market has mispriced, not just new data.

  **5. The "Omniscient Price" Claim**
  *   **The Claim:** The price is the *true* value. It is impossible for the price to be wrong, because the price is the sum of all human knowledge on the matter.
  *   **Plausibility:** Low. This requires assuming all traders are rational and all information is instantly processed.
  *   **Coherence:** Weak. It creates a logical loop (see "The Sweeping Argument" below).
  *   **Supports:** Move (c). This is the radical, ideological version.
  *   **Verdict:** This is the weakest link. It treats the market as a deity rather than a mechanism. If this were true, prices would never move, because no new information could ever surprise an omniscient market.

  ***

  ### On the "No-Trade" Argument

  Your brother-in-law's argument is a layman's version of a famous logical result. Here is what it actually establishes and where it fails.

  **What it establishes:**
  It establishes that in a closed system where everyone is perfectly rational and has the same information, *speculative* trade should not happen. If I sell you a bet, I am saying "the price is too high." If you buy it, you are saying "the price is too low." If we both know we are rational and see the same data, we should realise we can't both be right, and cancel the trade.

  **Does non-speculative trading rescue it?**
  Yes, but it changes the subject.
  People trade for **insurance** (hedging risk), **liquidity** (needing cash now), or **consumption** (buying a house). In these cases, the trade is not about who is right about the price; it is about one person wanting safety and the other willing to take risk.
  *   **The Verdict:** This rescues the *existence* of markets, but it does not rescue the *profitability* of your model. If you are trading football matches for profit, you are in the speculative bucket. The theorem implies that for you to win, someone else must be trading for a non-speculative reason (e.g., a bookmaker balancing their book) OR someone else is making a mistake.
  *   **The Catch:** The theorem assumes you and the market interpret data the same way. If your model processes public data differently (e.g., weighting a specific stat higher), you have broken the "same information" rule. You aren't disagreeing on the data; you are disagreeing on the *model*. The theorem doesn't forbid that; it just warns that the market's aggregate model is usually harder to beat than a single individual's.

  **Conclusion on this point:** The argument proves that *easy* speculative profit is impossible. It does not prove that *all* speculative profit is impossible, provided you have a genuine difference in processing (your model) or are trading against someone who needs to hedge rather than win.

  ***

  ### On the "Sweeping" Argument

  This is the stronger point, and your intuition is correct: it sinks the radical version of your brother-in-law's view.

  **The Logic:**
  If the pavement were truly clean (markets perfectly efficient), there would be no profit in sweeping (trading/analyzing). If there is no profit in sweeping, no one will sweep. If no one sweeps, the pavement becomes dirty (markets become inefficient). Therefore, the market cannot be perfectly efficient; it must be just inefficient enough to reward the people who sweep.

  **Which claim does this sink?**
  It sinks **Claim 5 (The Omniscient Price)**.
  It suggests that efficiency is not a natural state, but an *equilibrium* maintained by active traders. The market is only as right as the incentives make it.

  **Does the boring version survive?**
  Yes. **Claim 1 and 2** survive untouched. The sweeping argument admits there are notes on the pavement, but implies they are hard to see and require effort (sweeping) to collect. The profit you make is the wage for sweeping.

  **Conclusion on this point:**
  Use this at Christmas. It turns his aphorism against him.
  *   **His view:** No notes exist.
  *   **The Sweeping view:** Notes exist, but they pay the sweeper's wage.
  *   **The Question for him:** "If there are no notes, why do the bookmakers employ armies of quants to sweep the pavement? Are they all burning money, or are they keeping the pavement clean *for* a fee?"

  If they are keeping it clean for a fee, then the price includes a margin for their work. Your model only needs to be a better sweeper than them, not a magician who finds notes in a vacuum.
