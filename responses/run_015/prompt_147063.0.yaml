answer: |-
  The Coin-Flip Shield is a practical exercise where participants discover that randomizing choices can strictly outperform every pure option and that eliminating a rival's option can retroactively weaken your own.

  # PARTICIPANT HANDOUT

  **Course:** Rational Choice & Game Theory
  **Activity:** Strategic Selection Stages
  **Materials:** 1 Index Card, 1 Coin, This Sheet

  **GENERAL RULES**
  1.  **Roles:** You are assigned either **ROW** or **COLUMN**. Do not switch roles.
  2.  **Scoring:** Your score for a **Stage** is the **lowest** payoff you receive in any round within that stage. (Example: If you get 4, 1, and 5 across three rounds, your score is 1).
  3.  **Privacy:** Do not show your card or payoff table to opponents.
  4.  **Payment:** The highest scorer in each Stage (Row and Column separately) receives a chocolate bar.

  ---

  ### STAGE 1: Pure Selection
  **Rounds:** 3
  **Constraint:** You must write exactly **one letter** (U, M, D or L, C, R) on your card each round. No coins allowed.
  **Matching:** You will be randomly paired with an opponent from the other group each round.

  **YOUR PAYOFF TABLE (Stage 1)**
  *Keep this hidden from opponents.*

  **If you are ROW:**
  | | vs L | vs C | vs R |
  |---|---|---|---|
  | **U** | 4 | 0 | 0 |
  | **M** | 1 | 1 | 5 |
  | **D** | 0 | 4 | 1 |

  **If you are COLUMN:**
  | | vs U | vs M | vs D |
  |---|---|---|---|
  | **L** | 3 | 0 | 2 |
  | **C** | 0 | 3 | 2 |
  | **R** | 1 | 1 | 1 |

  *Wait for instructor signal to play Round 1.*

  ---

  ### STAGE 2: Restricted Selection
  **Rounds:** 3
  **Constraint:** **Column Players:** Strategy **R is forbidden**. You must choose L or C.
  **New Rule:** You **may** use your coin to determine your choice. (Example: "Heads = L, Tails = C"). If you use a coin, record "Mix" on your card.
  **Row Players:** You may also use your coin if you wish.
  **Matching:** Random rematching each round.

  **YOUR PAYOFF TABLE (Stage 2)**
  *The instructor will now project the full matrix for both sides.*

  | | **L** | **C** | **R** |
  |---|---|---|---|
  | **U** | 4, 3 | 0, 0 | 0, 1 |
  | **M** | 1, 0 | 1, 3 | 5, 1 |
  | **D** | 0, 2 | 4, 2 | 1, 1 |

  *(Row Payoff listed first, Column Payoff listed second)*

  *Wait for instructor signal to play Round 1.*

  ---

  ### STAGE 3: Final Reduction
  **Rounds:** 0 (Analysis Only)
  **Constraint:** **Row Players:** Strategy **M is forbidden**. **Column Players:** Strategy **R remains forbidden**.
  **Task:** Look at the remaining options (Row: U, D / Col: L, C). Discuss with your neighbor whether any further strict eliminations are possible.

  *Wait for debrief.*

  # FACILITATOR GUIDE

  **Materials:** Projector (with matrix), Box of Chocolates (2), Timer.
  **Forbidden Words:** Do not use "dominance," "mixed strategy," "Nash," "equilibrium," or "dominated" until the Debrief.

  ### Timeline (80 Minutes)

  **00:00 – 00:05 | Setup**
  *   Divide class: 12 ROW, 12 COLUMN.
  *   Distribute handouts, cards, coins.
  *   **Say:** "Your goal is to maximize your Stage Score. Your Stage Score is your *worst* payoff across the rounds in that stage. Safety matters more than luck."
  *   **Say:** "In Stage 1, you must write a single letter. No coins."

  **00:05 – 00:20 | Stage 1 (Pure Strategies)**
  *   Run 3 Rounds. (3 mins play/match, 1 min reset).
  *   **Action:** Collect cards after each round. Record payoffs for each pair.
  *   **Action:** Calculate Stage Scores (Minimum of 3 rounds) for each student.
  *   **Action:** Award chocolates to highest scoring Row and Column player.
  *   **Expected Outcome:** Column players converge on **R** (Guarantees 1; L/C guarantee 0). Row players converge on **M** (Best response to R).
  *   **Say:** "Stage 1 is closed. Keep your scores."

  **00:20 – 00:30 | The Intervention**
  *   **Action:** Project the Full Matrix (from Stage 2 handout).
  *   **Say:** "Look at the Column payoffs. In Stage 1, R guaranteed you 1 point. L and C guaranteed 0."
  *   **Action:** Take a coin. Flip it visibly.
  *   **Say:** "Suppose I commit to this rule: Heads I play L, Tails I play C. I do not look at the coin until after Row chooses."
  *   **Action:** Calculate expected Column payoffs on board.
      *   vs U: 0.5(3) + 0.5(0) = 1.5
      *   vs M: 0.5(0) + 0.5(3) = 1.5
      *   vs D: 0.5(2) + 0.5(2) = 2.0
  *   **Say:** "This rule guarantees 1.5 points no matter what Row does. R only guaranteed 1. In Stage 2, R is banned. You may use coins."

  **00:30 – 00:45 | Stage 2 (Mixed Allowed, R Banned)**
  *   **Say:** "Column: You cannot play R. Row: You know R is gone. You may use coins."
  *   Run 3 Rounds.
  *   **Expected Outcome:** Column players use 50/50 L/C (Guarantees 1.5). Row players who play **M** get 1. Row players who mix U/D (or play U/D) get 2 (against the mix) or risk 0 (against pure L/C).
  *   **Scoring:** Calculate Stage Scores. Award chocolates.
  *   **Observation:** Students who played Pure M will have a score of 1. Students who Mixed U/D will have a score of 2.
  *   **Say:** "Stage 2 is closed. Row players who played M: Why did you score lower than those who flipped coins?"

  **00:45 – 00:55 | The Second Unlock**
  *   **Say:** "Because Column players abandoned R, Row strategy M now yields 1 against L and 1 against C."
  *   **Action:** Write on board: Row Mix (50% U, 50% D) vs L = 2. vs C = 2.
  *   **Say:** "A coin flip between U and D guarantees 2. M guarantees 1. In Stage 3, M is banned."

  **00:55 – 01:05 | Stage 3 (Analysis)**
  *   **Say:** "Remaining: Row {U, D}, Column {L, C}. Look at the payoffs. Can you eliminate any more strategies using strict comparisons? Discuss."
  *   **Action:** Let them struggle for 5 minutes. They will find no strict dominance.
  *   **Say:** "Stop. Strict elimination stops here."

  **01:05 – 01:20 | Debrief**
  *   (See Debrief Script below)

  ### Troubleshooting

  **1. "I spotted the coin trick in Stage 1."**
  *   **Prevention:** Stage 1 rules explicitly forbid coins ("Write exactly one letter").
  *   **If they protest:** "The rule was pure selection. You followed the rules. You found the safest pure strategy (R). That was the correct play for Stage 1."

  **2. "A coin flip isn't a strategy; it's a failure to decide."**
  *   **Response:** "Your strategy was the *rule* you wrote down before the flip, not the outcome. You decided to delegate the execution to chance. That is a valid commitment. The payoff goes to the rule-maker."
  *   **If they refuse to mix:** Let them play Pure. They will score 1 in Stage 2 while mixers score 2. Let the score settle the argument.

  **3. "Why did we delete R before M? Does order matter?"**
  *   **Debrief Answer:** (See below).

  ### Debrief Script & Theory Mapping

  **1. Map the Claims (10 mins)**
  *   **Claim 1 (Start):** "In Stage 1, no one eliminated M or R immediately. Why? Because against pure strategies, nothing strictly beat them."
  *   **Claim 2 & 3 (The Coin):** "Column players chose R in Stage 1 because it had the highest *guarantee* (1). But the coin flip (50% L, 50% C) guaranteed 1.5. **Discovery:** A mixture can strictly dominate a pure strategy, even when no pure strategy does. The mixture was *safer*, not riskier."
  *   **Claim 4 (The Unlock):** "Once R was gone, Row's M became weak. It guaranteed 1. The U/D coin guaranteed 2. **Discovery:** Deleting an opponent's strategy can make your own previously safe strategy dominated. Iteration does real work."
  *   **Claim 5 (The Stop):** "We ended with {U, D} vs {L, C}. No strict dominance remains. But L weakly dominates C (3>0, 2=2). If we delete C, Row plays U. We get (U, L). **Distinction:** Strict dominance stopped early. Weak dominance pushed us to the end."

  **2. The General Test (5 mins)**
  *   **Say:** "How do you test if a strategy is dominated by a mixture without guessing coins? Use the **Best Response to Beliefs** test."
  *   **Write on Board:**
      > A strategy $S$ is **NOT** strictly dominated by any mixture if and only if there exists some belief (probability distribution) about the opponent's play such that $S$ is a **Unique Best Response** to that belief.
      >
      > Conversely, $S$ **IS** strictly dominated by a mixture if there is **NO** belief about the opponent for which $S$ is a best response.
  *   **Application:** "In Stage 2, was M a best response to any belief about L/C? No. Against any probability of L/C, the U/D mix yielded more. Therefore M was dominated."

  **3. Limitations & Order of Deletion (5 mins)**
  *   **What this session leaves out:** "We *enforced* deletion (I banned R, then I banned M). In real interaction, you delete strategies only if you *believe* the opponent is rational enough not to play them. This requires Common Knowledge of Rationality, which we simulated by rule."
  *   **Order of Deletion:**
      *   **Strict Dominance:** The order does **not** matter. The set of surviving strategies is unique regardless of which dominated strategy you delete first. (I am certain of this for finite games).
      *   **Weak Dominance:** The order **does** matter. If we had deleted C before L (because C is weakly dominated by L), we would still end at (U, L). But in other games, deleting weakly dominated strategies in different orders can lead to different surviving sets or equilibria.
      *   **Warning:** "Never use Weak Dominance unless you have a specific justification. It is dangerous. Strict Dominance is safe."

  **4. What I Must Assert**
  *   "I must assert that the 'Coin Flip' represents a Mixed Strategy in the formal sense. The session proves it *works* for security; the theory proves it counts as a strategy."
  *   "I must assert that Strict IESDS order is invariant. We did not test different orders today, but the theorem holds."
