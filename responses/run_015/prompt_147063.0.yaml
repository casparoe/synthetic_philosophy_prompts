      *   **Revised Plan:**
          *   Split class: 12 Row, 12 Col.
          *   Handout A (Row): Shows Row payoffs only.
          *   Handout B (Col): Shows Col payoffs only.
          *   Stage 1: 3 Rounds. Random rematching.
              *   Col Score: Minimum payoff across 3 rounds. (Incentivizes R).
              *   Row Score: Minimum payoff across 3 rounds. (Incentivizes M).
              *   *Correction:* If Row is scored by minimum, they play M (guarantees 1). U guarantees 0, D guarantees 0.
              *   This ensures (M, R) emerges naturally without them knowing the full matrix.
          *   Intervention: Reveal full matrix. Show Col that 50/50 L/C guarantees 1.5.
          *   Stage 2: R is banned. 3 Rounds.
