          *   *Failure:* Getting stuck on the coherence of the supertask itself (physical impossibility) rather than the normative implication.
      *   **Feasibility (6 Months):** This is the "honest assessment." Is it too big?
          *   *Risk:* Getting bogged down in the physics of supertasks.
          *   *Mitigation:* Stipulate physical possibility and focus on normative logic.
          *   *Verdict:* Doable if scoped tightly to the *structure* of the obligation, not the metaphysics of time.

