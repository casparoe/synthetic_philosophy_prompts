answer: |-
  **Chapter Proposal: The Normative Limit – Supertasks and the Determinacy of Duty**

  **1. Research Question**
  This chapter investigates whether the logical structure of Thomson's Lamp generates a parallel problem of indeterminacy for normative statuses. Specifically: If an agent's obligation to rescue toggles between obtaining and not obtaining at each successive half-interval of a finite period ($t_0$ to $t_1$), is there a determinate duty at the limit point $t_1$?

  The primary objective is to determine whether the indeterminacy typically associated with physical supertasks (the Benacerraf conclusion) necessarily transfers to the normative domain, or whether the topology of moral obligation (discrete vs. continuous) forces a determinate value at the limit.

  **2. Background and The Philosophical Gap**
  Thomson's Lamp presents a switch toggled on/off infinitely many times within one hour. At $t_1$, the physical state of the lamp is logically underdetermined by the preceding sequence. Paul Benacerraf and others argue this reveals a descriptive incompleteness rather than a metaphysical contradiction; the state at $t_1$ is simply undefined by the prior conditions.

  Standard replies to Thomson focus on physical causality, continuity of matter, or the logical coherence of completing an infinite task. However, these replies do not automatically settle the *normative* analogue.
  *   **The Normative Disanalogy:** Physical states (on/off) are often treated as brute facts. Normative statuses (obligated/not obligated) supervene on natural facts but are governed by distinct logical constraints (e.g., agential capacity, rational consistency, or the principle that "ought implies can").
  *   **The Gap:** Existing literature on supertasks focuses on metaphysics and philosophy of time. Existing literature on duties focuses on sorites paradoxes or gradual changes in cost/capacity. There is no focused analysis on how *supertask structures* interact with the *logic of obligation*. If obligations are discrete binary states, the Normative Lamp should yield indeterminacy. If obligations admit of degrees or continuous supervenience bases, the limit might be calculable. This chapter tests which model of obligation survives the supertask pressure.

  **3. Methodology and Plan of Work**
  I will avoid relying on standard "drowning child" intuitions regarding cost or proximity. Instead, the "toggling" will be stipulated as a feature of the scenario's formal structure (e.g., an external mechanism alters the success conditions of the rescue at each interval). The work will proceed in three stages:

  *   **Phase 1: Formalizing the Normative Supertask (Months 1–2)**
      *   Construct a rigorous description of the "Duty Lamp" scenario.
      *   Define the toggle function $D(t)$ where $D$ represents the deontic status.
      *   Map the sequence to ensure the indeterminacy at $t_1$ mirrors the physical lamp case under a binary model.
  *   **Phase 2: Testing Continuity vs. Discreteness (Months 3–4)**
      *   Analyze whether moral obligations must be discrete. I will examine if a "continuous obligation" model (e.g., obligation strength varying continuously with probability of success) resolves the limit point.
      *   Evaluate if normative principles (like "ought implies can") impose boundary conditions that force a specific value at $t_1$, thereby solving the indeterminacy where physics cannot.
  *   **Phase 3: Implications for Action Guidance (Months 5–6)**
      *   Determine the practical consequence of the limit state. If the status is indeterminate, is the agent blameworthy for acting or failing to act at $t_1$?
      *   Draft the chapter, focusing on the argument that the Normative Lamp serves as a diagnostic tool for the topology of normative space.

  **4. Success and Failure Conditions**
  *   **Success:** The chapter produces a definitive argument that either (a) normative statuses must be continuous to avoid pathological indeterminacy in supertask cases, or (b) normative statuses are discrete, and we must accept that some limit-point obligations are genuinely indeterminate (with an account of how agents should navigate this).
  *   **Failure:** The project stalls if the scenario is deemed conceptually incoherent (e.g., if "toggling a duty" is impossible by definition) rather than illuminating. It also fails if the analysis collapses back into standard physical objections (e.g., "supertasks are physically impossible") rather than addressing the normative logic.

  **5. Feasibility and Scope Assessment (6-Month Timeline)**
  **Is this too big?** There is a significant risk that analyzing the metaphysics of supertasks will consume the timeline, leaving little room for the normative analysis.
  *   **Mitigation:** I will stipulate the *logical possibility* of the supertask sequence without defending its physical realizability. The focus will remain strictly on the *consequences for deontic logic* assuming the sequence holds.
  *   **Scope Limit:** I will not attempt to solve the meta-ethical debate between discrete and continuous obligations globally. I will only argue for which model is more robust *in the context of supertask limits*.
  *   **Verdict:** The project is feasible within six months provided I resist the urge to solve the general Benacerraf problem. The novelty lies not in solving the lamp, but in showing how the lamp breaks (or confirms) specific models of obligation.

  **6. Expected Contribution**
  This chapter will demonstrate that supertask arguments are not merely puzzles for philosophers of time but serve as stress tests for normative theory. It aims to show that the determinacy of duty at a limit point depends less on the history of the action and more on the structural topology of the obligation itself.
