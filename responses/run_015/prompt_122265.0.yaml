          *   Define success/failure conditions.
          *   Assess feasibility (is it too big for 6 months?).
          *   *Constraint:* Avoid simple comparisons to the "drowning child" argument; let the lamp structure do the work.
          *   *Constraint:* No bibliography needed.
          *   *Tone:* Academic, concrete, honest about scope.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Thomson's Lamp:* A lamp is switched on/off infinitely many times in a finite period. Is it on or off at the end? Standard view: Indeterminate/Undefined (Benacerraf).
      *   *Normative Supertask:* An agent's duty status flips infinitely. At the limit, are they obligated to act?
      *   *The Twist:* Normative statuses aren't just physical states. They involve "ought implies can," agential capacity, and perhaps continuity of responsibility.
      *   *The Conflict:* If duties are discrete (binary: on/off), we get the Benacerraf indeterminacy. If duties are continuous (degrees of obligation, or supervening on continuous physical/mental states), the limit might be determinate.
      *   *Why Standard Replies Fail:* Benacerraf says the physical description is incomplete. But in ethics, the "description" might include rational requirements or continuity conditions that *force* a value at the limit. Or, conversely, the normative indeterminacy might have practical consequences (blame/praise) that physical indeterminacy doesn't.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but descriptive. "Normative Supertasks," "The Duty Lamp," etc. Let's go with "The Normative Limit: Supertasks and the Determinacy of Duty."
      *   **Research Question:** Needs precision. Not just "Is it on or off?" but "Does the logical structure of supertasks generate normative indeterminacy, and does this reveal the discrete/continuous nature of obligations?"
      *   **Motivation/Background:** Briefly mention Thomson's Lamp. Then pivot to the normative analogue. Why care? Because it tests the topology of normative space.
      *   **Why Standard Replies Don't Carry Over:** This is crucial.
          *   *Physical:* Indeterminacy is harmless (the lamp just is).
          *   *Normative:* Indeterminacy blocks action guidance or blame.
          *   *Continuity:* Physical states might not require continuity. Duties might (e.g., if based on capacity which degrades continuously).
      *   **Methodology:**
          *   Conceptual Analysis: What does it mean to "have a duty"?
          *   Formal Modeling: Use temporal logic or simple sequences to map the toggles.
          *   Case Construction: Flesh out the "Duty Lamp" scenario.
      *   **Success/Failure:**
