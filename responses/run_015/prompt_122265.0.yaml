reasoning: |-
  Here's a thinking process that leads to the suggested chapter proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Applying Thomson's Lamp (supertask) structure to normative statuses (specifically, duties of rescue).
      *   **Core Idea:** An agent toggles between having and lacking a duty of rescue at each half-interval ($t_0 + 1/2, t_0 + 3/4, \dots$). At the limit ($t_1$), is there a determinate moral status? Does it depend on discrete vs. continuous obligations?
      *   **Goal:** Draft a 6-month chapter proposal for a committee.
      *   **Requirements:**
          *   State the question precisely.
          *   Explain why standard Thomson/Benacerraf replies don't automatically apply to the normative case.
