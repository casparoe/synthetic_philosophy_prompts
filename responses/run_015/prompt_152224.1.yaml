prompt: |-
  hey, im in year 12 and ive been getting into this argument about scientific realism — the pessimistic meta-induction, i think its called? Basically: look at all the theories from the past that were really successful at predicting and explaining stuff but that we now think are just false (the caloric theory of heat, phlogiston, the luminiferous ether, humoral medicine, that kind of thing). By induction, our current best theories are probably false too, so we shouldnt believe that electrons or black holes or whatever are really real, we should just think our theories are useful instruments.

  Ive been trying to work out the best comeback for the realist and ive got two ideas, but I cant tell if either of them actually works or if im just talking myself into something. Please compare them properly and tell me which is the stronger reply (or if one of them is confused / half-baked, say so, fix it into its best version, and then compare).

  Reply 1 — "shrink the target". The induction counts whole theories as its data points, but a theory is a big bundle of claims stuck together, and the bits dont all stand or fall as a unit. If you re-run the induction over the smaller pieces instead — the equations, the specific claims about what causes what — the historical record looks much friendlier: Fresnels equations for reflection and refraction are still used today, the maths people worked out for heat flow while they believed in caloric mostly got carried over into thermodynamics, and so on. So the pessimist is counting at the wrong grain size, and once you count at the right one you get an optimistic induction instead: the pieces that did the real predictive work tend to survive even when the big story they were told as part of gets thrown out.

  Reply 2 — "the graveyard is curated". A theory only gets onto that famous list of dead theories if it was once famous enough to end up in the history books and later got rejected. But nothing that we still believe can ever be on a list of abandoned theories, no matter how similar it is to the dead ones. So the list is kind of guaranteed to be 100% false in the way a list of people who have died is 100% dead — youve only got the numerator. To get the scary number the pessimist actually needs (out of all the theories that were once counted as successful, what fraction turned out false?) youd have to go back and count the theories nobody remembers, and we have no idea what that number is.

  Things i especially want you to get into:

  - Do these two replies even point the same way? Reply 1 seems to concede that the big theory is false and only rescue the bits, while reply 2 seems to try to rescue whole theories by attacking the sample. Does that make them rivals, or can a realist use both at once?
  - Does either reply prove too much? Like, could a defender of something we all think is junk — phrenology, say, or astrology — use the exact same move to keep their theory alive? If so, what has to be added to stop that?
  - Which reply, if it worked, would actually give the realist more? Id rather believe that my whole favourite theory is roughly true than just that one equation in it is on the right track, so it matters to me which one im betting on.
  - And last: does either reply secretly help the pessimist? For example, does reply 1 end up admitting that every past theory was false, which is basically what the pessimist said in the first place?

  Please write the answer in British English, and dont just list a summary of the debate — actually take a side on which reply is better and defend it against the strongest version of the other one. Oh, and please no reading lists or "see so-and-so 1999", I dont have access to a university library.
