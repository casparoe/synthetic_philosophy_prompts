answer: |-
  This is a brilliant observation for an EPQ. You have stumbled upon a genuine philosophical problem regarding 'social kinds'—categories like money, marriage, or ethnicity that exist only because we agree they exist. Your brother is right that much of philosophy is about whether we are describing the furniture of the universe or just arguing about how to arrange the labels.

  Here is an argument broken down into the specific questions you asked, written to help you structure your project.

  ### 1. What must the form assume to make sense at all?

  To make sense, the form does **not** need to assume that races or ethnic groups are biological realities (like distinct species of animals). If it assumed that, it would be scientifically wrong. Instead, it assumes something more subtle: it assumes that **social perception is a fact.**

  Even if there is no biological difference between a 'White British' person and a 'Pakistani' person, society treats them differently. Teachers might have unconscious biases; job markets might discriminate; health outcomes might vary due to cultural or environmental factors linked to these groups.

  For the form to work, it only needs to assume that:
  1.  These categories are **socially salient** (people notice them and act on them).
  2.  Self-identification is the most accurate way to capture which category a person occupies in society.

  If you look like a certain group and are treated as that group, but you tick a different box, the data becomes useless for tracking inequality. Therefore, the form assumes that ethnicity is a matter of **social positioning**, not genetic essence. It is tracking how you navigate the world, not what is in your DNA.

  ### 2. Can someone who thinks race is a 'fiction' defend filling it in?

  Yes, absolutely. This is the strongest argument for your project. This position is often called **instrumentalism**.

  Think of money. A £10 note is just a piece of cotton-polymer blend. It has no value in nature. If you were stranded on a desert island, it would be useless. In that sense, its value is a 'fiction' or a 'construct'. However, because we all agree to treat it as valuable, it has real power. If we stopped tracking money, the economy would collapse.

  Similarly, a constructivist (someone who believes race is made up by society) can argue: "Race is not biologically real, but racism is." Because racism operates based on these categories, we must use the categories to measure the racism. If we stop counting ethnicity because 'race isn't real', we blind ourselves to the inequality.

  So, filling in the form is not an admission that biological races exist. It is an admission that **social categories have real consequences.** The form is a tool for justice, not a biology test.

  ### 3. What does the 'write-in' box tell us?

  The 'write-in' box (Any Other) is a massive clue. In science, you do not get a write-in box for elements. You cannot write in 'Unobtainium' on a chemistry sheet. Elements are 'natural kinds'—they exist regardless of what humans think.

  The fact that there is a write-in box admits that the list of boxes is **incomplete and provisional**. It acknowledges that the people who designed the form know they cannot capture every human identity with a fixed list. It implies that the categories are **political and administrative**, not scientific. They are trying to capture the majority of cases while admitting they might miss the edges.

  This supports the idea that the form is a 'map', not the 'territory'. A map of London is useful, but it isn't London itself, and it might miss a new street. The write-in box admits the map is imperfect.

  ### 4. Why 'Feelings' for Ethnicity but 'Facts' for Sex?

  You noticed the form asks what you 'feel' regarding ethnicity, but records sex as a matter of fact (specifically, 'recorded at birth').

  This distinction matters because the form is treating them as different *types* of data.
  *   **Sex recorded at birth:** This is treated as a **historical event**. It is asking: 'What did the doctor write on the certificate the day you were born?' That is a fact about the past, regardless of how you feel now. It is administrative history.
  *   **Ethnic group:** This is treated as a **current social status**. It is asking: 'Where do you fit in society today?'

  The form is not necessarily saying sex is 'objective truth' and ethnicity is 'subjective opinion'. It is saying sex (on this specific line) is a record of a past administrative act, whereas ethnicity is a record of current cultural belonging.

  However, there is a tension here. If the school claims ethnicity is only about 'feelings', does that mean if I 'feel' White British, I am, even if everyone else perceives me as Black African? In practice, no. The data is usually used to track how people are *perceived* by others (e.g., in stop-and-search statistics or hiring). So, the 'feel' language is slightly misleading. It really means 'With which group do you identify and participate?'

  ### 5. What would change if the school changed its mind?

  This is where you can really stretch your EPQ analysis. Imagine two parallel universes.

  **Universe A: Biological Essentialism (Race is real biology)**
  If the school decided ethnic groups were biological essences:
  *   **Self-ID would be removed.** You cannot 'feel' your way into a genetic category.
  *   **Testing would be required.** You would need a DNA test to tick the box.
  *   **The 'Write-in' box would vanish.** You cannot write in a new biology.
  *   **Mixed categories would be problematic.** In biology, hybrids are specific; on the form, 'Mixed' is a broad social category.
  *   **Consequence:** This would be scientifically false and ethically dangerous (reminiscent of eugenics), but it would make the data 'objective' in a scientific sense.

  **Universe B: Radical Constructivism (Race is totally meaningless)**
  If the school decided the categories were so fictional they shouldn't be used:
  *   **The form would be deleted.**
  *   **Consequence:** The school could no longer prove if they were discriminating against specific groups. They could not apply for certain government grants aimed at closing attainment gaps. They would be 'colourblind', but potentially blind to injustice.

  **The Current Middle Ground (Pragmatism)**
  The current system is a compromise. It admits the categories aren't biological (hence self-ID) but insists they are useful (hence mandatory monitoring).

  ### 6. Forced by Practice vs. Incidental Features

  This is the crux of your project. You need to separate what is *necessary* from what is *contingent* (accidental).

  **Forced by the practice (Necessary):**
  *   **Categorisation:** To monitor inequality, you *must* group people. You cannot measure a gap between groups if you don't define the groups.
  *   **Self-Identification:** Because ethnicity is cultural, the individual is the best authority on their own cultural participation. External assignment is unreliable and offensive.
  *   **Standardisation:** To compare data with other schools or national census data, everyone must use the same boxes.

  **Incidental (Could be different):**
  *   **The specific labels:** 'White British' vs 'White English'. The specific names are political choices, not truths.
  *   **The 'Feel' wording:** They could ask 'Which group do you identify with?' rather than 'feel you belong to'. 'Identify' implies a social claim; 'feel' implies an emotion. The latter is slightly softer, perhaps to avoid conflict.
  *   **The Sex Question:** The fact that sex is treated as a historical fact while ethnicity is treated as a current identity is a policy choice. They *could* treat both as self-identification, or both as recorded facts. The current mix reflects a specific moment in UK administrative law, not a law of nature.

  ### Summary for your Argument

  The form does not require race to be biologically real. In fact, it works *better* if race is understood as a social construct. If race were biological, self-identification would be the wrong method (DNA would be the right method).

  The form assumes that **social reality is real enough to measure.** It assumes that even if 'race' is a fiction, the *effects* of that fiction (discrimination, cultural difference, attainment gaps) are facts.

  Your brother's point about arguments being about 'words' is key here. The dispute isn't about whether people have different skin colours or ancestors (everyone agrees on that). The dispute is about whether we call those differences 'races' or 'ethnicities' or 'social groups'. The school form sidesteps the metaphysical argument by being pragmatic: 'We don't care if it's biologically real; we care if it affects your grades.'

  For your EPQ, you can argue that the form is a piece of **social technology**. Like a hammer, it doesn't matter if the hammer is 'true' or 'false'; it matters if it drives the nail. The nail here is 'equality monitoring'. The hammer is 'ethnic categories'. You can use the hammer without believing the hammer is a sacred object.

  This distinction between **ontology** (what exists) and **pragmatics** (what is useful) is likely the philosophical framework your brother was hinting at, and it should serve your project very well.
