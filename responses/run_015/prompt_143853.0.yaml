      *   *But why?* The paradox suggests an *epistemic* bind (I can't trust my new belief). The historical record suggests *non-epistemic* binds (Institutional Honor, Anti-Semitism, Fear of War with Germany).
      *   *The Forgeries:* Henry forging the "Fa Henry" document is key. The paradox says "refusal to revise undermines grounds." The Staff went further: they *manufactured* first-order evidence to prop up the failing process. This isn't just epistemic circularity; it's active fraud.
      *   *Discipline Check:* Does the paradox explain the forgery? No. The paradox explains why *revision* is hard. It doesn't explain *lying*. Lying is a strategic choice to bypass the epistemic problem, not a result of the epistemic problem itself.

  6.  **Assess the Paradox's Validity:**

      *   *Does the Affair support the claim of rational impasse?* It shows the *appearance* of impasse was resolved by non-epistemic means.
      *   *Is it genuine rational impasse?* No. Picquart (using the same military training) revised his belief. So the "process" wasn't inherently self-corrupting for everyone, only for those invested in the *outcome*.
      *   *Conclusion:* The paradox describes the *structure* of the justification (we can't admit error because our authority rests on infallibility), but it fails to capture the *motivation*. The "dogmatism" was not epistemic confusion; it was political and moral commitment disguised as epistemic certainty. The paradox treats the refusal to revise as a logical consequence of evidence evaluation; history shows it was a strategic choice to preserve power.

