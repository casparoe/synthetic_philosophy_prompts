      *   *The Forgery:* Address the Henry forgeries. This breaks the paradox's model. The paradox assumes agents are trying to track truth but are trapped. Forgers are not trying to track truth; they are trying to track *survival*.
      *   *Conclusion:* The paradox identifies the *rhetorical* trap (we cannot question our own evidence), but the Dreyfus Affair proves the trap was maintained by *will*, not logic. The "rational impasse" was a smokescreen for moral failure.

