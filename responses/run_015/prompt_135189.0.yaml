answer: |-
  ### Part I: Core Commitments of the Classical Moral Equality of Combatants

  Before translating, we must establish the philosophical baseline. The classical just-war thesis of the Moral Equality of Combatants (MEC) rests on four non-negotiable commitments:

  1.  **Symmetry of Liability:** Soldiers fighting for an unjust cause are not morally liable to be killed *merely* because their cause is unjust. Conversely, soldiers fighting for a just cause do not possess a special moral permission to kill that the unjust side lacks.
  2.  **Independence of *Jus In Bello* from *Jus Ad Bellum*:** The justice of conduct within the war (*in bello*) is logically distinct from the justice of the war's initiation (*ad bellum*). A soldier can fight justly within an unjust war, and vice versa.
  3.  **Instrumentality and State Agency:** The moral burden of the war's cause rests primarily on the political leadership (the State). The individual soldier is an instrument of the state, shielded from the macro-moral judgment of the cause regarding their immediate right to life.
  4.  **Threat-Based Targetability:** Liability to attack is determined strictly by the status of being a combatant (posing a physical threat), not by the moral quality of the ends for which that threat is posed.

  ### Part II: Narrative Translation and Evaluation

  Here, I translate these philosophical commitments into the vocabulary of narrative craft, evaluating whether the claim survives the translation or degrades.

  **1. Philosophical Claim:** Symmetry of Liability (Unjust soldiers are not inherently killable).
  *   **Narrative Translation:** **Antagonist Focalization Parity.** The narrative grants equivalent interior depth and psychological legitimacy to soldiers on both sides; the "Antagonist" soldiers are not rendered as flat, disposable narrative objects solely due to their alignment with the opposing force.
  *   **Evaluation:** **Survives Intact.** This is a standard norm in serious war literature. Granting interiority to the "enemy" is the literary equivalent of acknowledging their moral standing.

  **2. Philosophical Claim:** Symmetry of Permission (Both sides have equal right to kill in battle).
  *   **Narrative Translation:** **Equivalent Character-Level Agency.** During combat scenes, the narrative authority validates the defensive and offensive actions of both Protagonist and Antagonist focalizers with equal weight, avoiding language that frames one side's violence as "murder" and the other's as "heroism."
  *   **Evaluation:** **Requires Distortion.** Narrative "validation" is aesthetic, not moral. An author can *describe* symmetric violence without endorsing it. The narrative can show both sides shooting, but it cannot grant a "right" to shoot, only the *fact* of shooting. The normativity is lost.

  **3. Philosophical Claim:** Independence of *Jus In Bello* from *Jus Ad Bellum* (Cause does not taint individual acts).
  *   **Narrative Translation:** **Separation of Plot-Level Framing and Character-Level Permissions.** The "Plot-Level Moral Framing" (the text's ultimate judgment on who started the war/who is 'right') is decoupled from "Character-Level Permissions" (the validation of specific actions within the scene).
  *   **Evaluation:** **Collapses Entirely.** In narrative, plot context inevitably bleeds into character action through **dramatic irony**. If the Plot-Level Framing establishes Side B as invaders, the reader cannot view Side B's "character-level permissions" neutrally; every act is colored by the knowledge of the unjust cause. The separation cannot be sustained in the reader's experience.

  **4. Philosophical Claim:** Threat-Based Targetability (Liability based on function, not essence).
  *   **Narrative Translation:** **Situational Conflict vs. Ontological Evil.** Conflict arises from mechanical opposition (two soldiers meeting in a trench) rather than essential moral corruption (one soldier is 'evil', the other 'good').
  *   **Evaluation:** **Survives Intact.** This maps cleanly onto naturalistic war fiction where death is a function of circumstance and role, not moral worth.

  ### Part III: Residue Report

  The translation process leaves a significant residue—concepts that exist in the philosophical thesis but have no functional counterpart in narrative vocabulary.

  **1. The *Jus Ad Bellum* / *Jus In Bello* Firewall**
  In classical philosophy, the separation between the justice of the war and the justice of the fight is a hard logical firewall. In narrative, this translates to the separation between "Plot-Level Moral Framing" and "Character-Level Permissions." However, narrative vocabulary reveals this separation to be porous.
  *   **The Deficiency:** Narrative operates on **diegetic coherence**. If the Plot (the *ad bellum* equivalent) establishes that a cause is tyrannical, the Character's acts (the *in bello* equivalent) in service of that cause acquire a thematic weight that the author cannot fully strip away.
  *   **The Implication:** The philosophical thesis claims a soldier's act is morally independent of the cause. Narrative intuition suggests an act is *meaningfully* dependent on the cause. The residue here suggests the philosophical distinction is an abstraction that does not hold up when rendered in the phenomenology of human action (which is what narrative encodes).

  **2. Objective Liability vs. Diegetic Sympathy**
  The philosophical thesis relies on **Objective Moral Liability** (a fact about the soldier's rights). Narrative vocabulary can only encode **Diegetic Sympathy** (the reader's emotional access).
  *   **The Deficiency:** You can have "Focalization Parity" (sympathy for both sides) while maintaining that one side is objectively liable to be killed (e.g., a tragic villain). Conversely, you can have a sympathetic character who is objectively unjust. Narrative vocabulary tracks *experience*, not *rights*.
  *   **The Implication:** The concept of "liability" has no narrative equivalent. Narrative can show a soldier *feeling* justified, or a reader *feeling* sympathy, but it cannot encode the objective moral fact that the soldier *is* protected from harm. This is not merely a gap in craft; it reveals that the philosophical thesis posits a "view from nowhere" (objective moral status) that is inaccessible to the "view from somewhere" (narrative perspective).

  **3. "Diegetic Culpability Separation"**
  You asked if evaluating a character's moral status inside the story-world independently of the audience's extra-diegetic judgment captures the thesis.
  *   **Analysis:** This dresses up an ambiguity. In narrative, "inside the story-world" (diegetic) and "audience judgment" (non-diegetic) are in constant tension via **dramatic irony**. If a character believes they are just (diegetic), but the plot reveals they are unjust (non-diegetic), the narrative generates irony, not moral equality. The classical thesis wants to say the soldier is *not liable* regardless of the irony. Narrative has no way to express "not liable" other than "don't kill them," which violates the plot mechanics of war.
  *   **Result:** This concept dissolves upon contact with narrative structure. It reveals that the philosophical thesis depends on a distinction (the soldier's shielded status) that narrative cannot represent without breaking the conflict itself.

  ### Part IV: Assessment of the Intuition

  Your intuition is that "moral equality is essentially focalization parity applied to ethics."
  *   **Verdict on Intuition:** This is **mistaken**.
  *   **Reasoning:** Focalization parity is an aesthetic strategy to generate complexity and humanize the enemy. Moral Equality of Combatants is a normative claim about human rights and liability to violence. You can have focalization parity in a story about a genocide (humanizing the perpetrators) without accepting the philosophical claim that the perpetrators are not liable to be stopped. Focalization parity describes *access to consciousness*; MEC describes *immunity from harm*. The residue analysis shows that narrative can simulate the *feeling* of equality (through symmetry of depiction), but it cannot encode the *normative force* of equality (the right to life independent of cause).

  ### Part V: Conclusion on the Residue

  The untranslatable residue—specifically the inability to separate plot-cause from character-act without losing coherence, and the inability to encode objective liability distinct from subjective sympathy—does not primarily indicate a deficiency in narrative craft. Narrative craft is designed to render human experience and perspective, not objective moral metaphysics.

  Instead, the residue indicates that the classical philosophical thesis depends on technical distinctions (*ad bellum* vs. *in bello*) that dissolve when removed from abstract legalism and placed into the context of human agency and meaning-making. Narrative vocabulary, which is sensitive to how cause colors action in the human imagination, exposes the philosophical firewall as artificially constructed. The "gap" is not that literature fails to capture the truth of MEC, but that MEC relies on a separation of cause and act that human experience (and thus narrative) naturally rejects.

  Verdict: \answer{The untranslatable residue points to an ambiguity in the philosophical thesis itself.}
