prompt: |-
  Hey, I'm a retired field biologist who started reading philosophy after I left the lab, and I just finished Hofstadter's 'Person Paper' — that satire about how English defaults to male for generic people. I'm writing a pop-science book on ecology, and I need a reusable audit procudre I can run on every chapter before my editor sees it, to catch hidden gender defaults: generic 'he', male examples for 'the scientist' or 'the hunter', word choices that smuggle in a male norm. Make it a step-by-step checklist with ordered questions, what counts as a pass or fail at each stage, where I stop and fix the text, and where I have to make a value call because facts don't settle it. I work alone with no formal philosophy training, I have about twenty minutes per chapter, and my editor expects American English — no British spellings sneaking in. Apply it to three cases: a draft sentence where I wrote 'when the researcher observes his subject', a paragraph about prehistoric 'man' hunting where gender might actually be relevant, and one beloved passage the checklist flags but I really don't want to change. Also be honest about where the procudre breaks down or can't help me, and say clearly what it just cannot do. I think there's a typo in this prompt somewhere, sorry about that.
reasoning: |-
