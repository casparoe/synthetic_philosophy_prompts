answer: |-
  This is a profound dilemma that sits at the intersection of craft, property, and tradition. You are not merely fighting a disqualification; you are fighting over the definition of mastery in a guild system. The conflict you describe is between a **copyright model** of creativity (where value lies in novelty and ownership of specific arrangements) and a **craft model** of creativity (where value lies in fluency within a shared language).

  Here is an analysis of your three questions, structured to help you prepare for your appeal and the guild's future.

  ### 1. Is there a "fact of the matter" about whether your sign is a copycat?

  No. There is no ontological fact of the matter here, only a disagreement about classification criteria.

  The physical facts are undisputed: you did not trace; you assembled shared motifs; you used the shop's standard cut. The disagreement is not about *what the sign is*, but *what the rule is for*.

  *   **The Disqualifying Judge** is operating under a **Market Differentiation Theory**. To them, the "Open Class" is a marketplace where distinct brands must be visible. If your sign is indistinguishable in function and silhouette from Odile's 2009 work, you are confusing the market. In this view, "copycat" means "failure to distinguish oneself from one's master."
  *   **The Dissenting Judge & The Friends** are operating under a **Tradition Stewardship Theory**. To them, the value of the sign is the faithful continuation of a valley idiom. In this view, "copycat" (in the pejorative Rule 12 sense) means "theft of intellectual property," whereas "copying well" (the apprentice compliment) means "successful enculturation."

  Because Rule 12 leaves "copycat" undefined, the "fact" is whatever the majority of judges decides it is in that moment. You are not arguing against a fact; you are arguing against a *framework*. Your appeal must demonstrate that the Market Differentiation framework is inappropriate for a guild show rooted in a traditional craft idiom.

  ### 2. What to argue in your one-page appeal statement

  Your statement should not be defensive. It should be pedagogical. You need to teach the committee why their application of Rule 12 misunderstands the nature of the craft they are judging.

  **Key Themes to Hit:**
  1.  **Distinguish Halloran from Here:** Explicitly contrast the 1996 affair (theft of a rival's specific solution) with your entry (use of a shared public vocabulary).
  2.  **The Necessity of Repetition:** Argue that a "valley tradition" cannot exist if only one person is allowed to paint the canonical forms. If only Odile can paint a *Bee Lawn* type sign, the idiom dies when she retires.
  3.  **Commission vs. Portfolio:** Remind them this was assembled for a customer, not manufactured to mimic Odile. The similarity is a result of solving the same problem with the same toolkit, not an intent to deceive.
  4.  **The Definition of "Open":** Argue that "Open Class" should mean "Open to Journeymen," not "Open to Avant-Garde."

  **Draft Text for Appeal Statement:**

  > **To the Appeals Committee:**
  >
  > I am requesting the reinstatement of my entry, the two-sided beekeeper sign, disqualified under Rule 12. My argument rests on the distinction between *plagiarism* and *idiom*, a distinction Rule 12's term "copycat" currently obscures.
  >
  > The 1996 Halloran revision intended to bar the theft of specific, proprietary designs (tracing a rival's catalogue). My entry involves no tracing and no appropriation of Odile Reinholt's specific designs. It utilizes the Fellsmere valley's shared vocabulary: lead-blue ground, standard scrollwork, and the skep motif. These are not Odile's property; they are the valley's heritage.
  >
  > The disqualification argument suggests that by painting a sign that fulfills the same function as Odile's 2009 *Bee Lawn*, I have "filled her slot." This imposes a standard of radical novelty inconsistent with our craft. A living tradition requires multiple practitioners to sustain its canonical forms. If the guild bars apprentices from painting in the idiom they were trained in once they leave the shop, we are not preventing copying; we are preventing the transmission of the style itself.
  >
  > The Friends of the Painted Sign classify this work as "idiom work"—the highest praise in our field. To disqualify it as a "copycat" entry conflates the moral failing of theft (Halloran) with the professional competence of fluency. I ask the committee to recognize that using the shared language of the Fellsmere valley is not a violation of Rule 12, but the fulfillment of the guild's purpose. I did not copy Odile; I joined her in the tradition.

  ### 3. Should the guild drop the word "copycat"?

  Yes. The guild should replace "copycat" with narrower, more precise rules, but they must do so carefully to avoid losing the ability to judge *intent*.

  **What is lost by dropping it:**
  The word "copycat," despite its ambiguity, captures a *moral* intuition. It allows judges to catch "spiritual theft"—cases where an artist hasn't technically traced but has cynically replicated a competitor's style to undercut them. Narrow rules (e.g., "No Tracing") can be loopholed by someone who freehands a replica of a rival's unique signature motif. The vagueness of "copycat" allows the guild to police bad faith.

  **What is gained by dropping it:**
  Clarity and fairness. As your case proves, "copycat" is too easily weaponized against apprentices transitioning to independence. It conflates *style* (which should be shareable in a guild) with *design* (which should be protected).

  **The Recommendation:**
  Replace Rule 12 with two distinct clauses:

  1.  **Prohibition on Replication:** "Entries must not be direct reproductions, traced, or freehand replicas of specific existing works by other living artists without attribution." (This covers Halloran).
  2.  **Protection of Idiom:** "Use of standard regional motifs, traditional grounds, and shop-standard lettering cuts shall not constitute grounds for disqualification." (This covers you).

  **Why this matters:**
  If you keep "copycat," you leave the door open for a judge to decide that *any* similarity is disqualifying. By splitting the rule, you force the guild to decide: *Are we protecting specific designs, or are we protecting the novelty of the artist?*

  In your appeal, you should suggest this reform as a constructive outcome of your case. It shows you care about the Guild's integrity, not just your ribbon. You can argue: *"My disqualification reveals a flaw in Rule 12 that will hurt the next apprentice. Fixing the rule will protect the Guild from future ambiguity."*

  **Summary of Strategy:**
  You are not arguing that you are innocent of copying; you are arguing that **in this context, copying is the point.** You are arguing that the "copycat" label is a category error. If you can persuade them that a tradition requires repetition to survive, you invalidate the judge's claim that you "filled a slot." You didn't fill a slot; you occupied a place in the lineage.
