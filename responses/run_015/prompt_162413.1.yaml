          *   Dissenting Judge's View: In the shop, "copycat" was a compliment for an apprentice who copied well.
          *   External View (Friends of the Painted Sign): They view it as "idiom work" (praise).
      *   **The User's Dilemma:** Is this a disagreement about facts (is it a copy?) or definitions (what does "copycat" mean in this context)? Which sense should govern the rule?
      *   **Three Specific Requests:**
          1.  Is there a "fact of the matter" about whether it's a copycat?
          2.  What should be argued in a one-page appeal statement?
          3.  Should the guild drop "copycat" for narrower rules, or is something lost?

  2.  **Deconstruct the Philosophical/Professional Tension:**
      *   **Tradition vs. Innovation:** Sign painting is a craft based on shared vocabulary (motifs, colors, cuts). Mastery is often shown through fluent use of tradition, not necessarily radical novelty.
      *   **Apprenticeship vs. Independence:** The transition from apprentice (learning the "shop style") to journeyman/master (establishing a voice) is blurry. The judge sees the user as still occupying Odile's "slot." The user sees themselves as assembling shared vocabulary.
      *   **Plagiarism vs. Idiom:** The Halloran affair was theft (tracing a rival). This case is adherence to tradition (using the shop's shared language).
      *   **The Word "Copycat":** It's pejorative in the general public (unoriginal thief) but potentially honorific in craft contexts (skilled emulator). The rule relies on "judges' judgement" because it couldn't be defined.

  3.  **Address Request 1: Is there a "fact of the matter"?**
      *   *Analysis:* No, not in a scientific sense. "Copycat" is a normative/evaluative term, not a descriptive one. It depends on the *intent* and the *context of evaluation*.
      *   *Nuance:* There are facts (did you trace? No. Did you use the same motifs? Yes.). But whether those facts constitute "copycatting" depends on the *purpose* of the rule. If the purpose is to prevent theft, you aren't a copycat. If the purpose is to encourage individual stylistic departure from the master, you might be.
      *   *Conclusion:* It's not a fact; it's a classification dispute. The disagreement is about the *boundary of the category*, not the physical attributes of the sign.

  4.  **Address Request 2: The Appeal Statement:**
      *   *Goal:* Persuade the committee to reinstate the entry.
      *   *Strategy:* Distinguish between *plagiarism* (Halloran) and *mastery of idiom* (Tradition). Reframe "copycat" from "theft" to "fluent participation in a living tradition."
      *   *Key Arguments:*
          *   Acknowledge the Halloran precedent (theft/tracing) vs. current reality (shared vocabulary).
          *   Highlight the "Open Class" purpose: Is it for radical innovation or professional competence?
          *   Leverage the "Friends of the Painted Sign" validation (Idiom Work).
          *   Address the "Odile's Slot" argument: A tradition *requires* multiple practitioners to sustain it. If only Odile can paint an Odile-style bee sign, the style dies with her.
          *   Emphasize the "Assembly": You composed it for a specific customer, not to mimic Odile.
      *   *Tone:* Respectful, professional, grounded in craft ethics, not defensive.

  5.  **Address Request 3: Rule 12 Reform:**
      *   *Option A: Drop "Copycat" for narrower rules.* (e.g., "No Tracing," "No Direct Replication of Specific Existing Works").
          *   *Pros:* Clarity, reduces subjective bias, protects against Halloran-style theft.
          *   *Cons:* Might stifle the debate about style vs. tradition. Might allow "style theft" that isn't literal tracing.
      *   *Option B: Keep "Copycat".*
          *   *Pros:* Allows flexibility to catch new forms of cheating. Preserves the guild's authority to define artistic integrity.
          *   *Cons:* Subjective, prone to bias (as seen here), chills apprentices transitioning to independence.
      *   *Recommendation:* Replace "Copycat" with specific prohibitions regarding *specific works*, but add a clause protecting *shared idioms*. The term "copycat" is too loaded with childish/pejorative connotations that clash with the honorific craft tradition. However, removing it entirely might lose the ability to police "style stealing" that falls short of tracing. A hybrid approach is best.
