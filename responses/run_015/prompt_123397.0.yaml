  3. **Case 4** — This lands in the middle because the causal lever was internal yet epistemically inaccessible, limiting control over the act despite genuine effort to be rational.
  4. **Case 1** — This is less undermining because the agents exercised identical control over their negligence, with luck affecting only the external outcome rather than the decision itself.
  5. **Case 5** — This ranks lowest because the agent voluntarily accepted the risk, retaining control over the reckless choice even though chance masked the consequences.

  Regarding your curiosity about Cases 4 and 5: they are actually further apart than they look because Case 4 targets your proposed "character-structure" axis (internal cognitive architecture) while Case 5 targets the "outcome" axis (external realization of risk). Both involve epistemic unavailability at the decision point, but Case 4 undermines the *source* of the action (the mind's toolset), whereas Case 5 only obscures the *result* of the action (the world's response). This distinction supports your intuition that luck hitting the character-structure is morally distinct from luck hitting the outcome, even when both are hidden from the agent.
