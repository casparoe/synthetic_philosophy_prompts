  **Preamble: A Warning on the Data**

  Before using this instrument, note a constraint often omitted in popular coverage: the empirical pressure these findings put on moral objectivity is weaker than headlines suggest. Cross-cultural variation is often smaller than claimed, heavily entangled with how experimenters phrase questions, and subject to replication crises. If the variation is mostly methodological artifact, the philosophical conclusions drawn below rest on shaky ground. This tree assumes the variation is real enough to warrant a position, but readers should retain skepticism about the magnitude of the effect.

  **The Decision Tree**

  1.  **The Harmless Taboo.** A family eats a pet dog killed by a car. No one is harmed or distressed. You condemn it anyway. Is this:
      *   A) A false moral belief (you think it's wrong, but it isn't).
      *   B) A non-moral disgust response misreported as moral.
      *   C) A correct response to a property others miss (e.g., sanctity).
      *   *If B, go to 2. If A or C, go to 3.*

  2.  **The Elicitation-Frame Test.** Does your judgment survive changing the question from "Is it wrong?" to "Would you do it?" or "What would neighbors think?"
      *   A) No, the judgment shifts or vanishes.
      *   B) Yes, the core judgment remains stable.
      *   *If A, go to Leaf 5 (Expressivism). If B, go to 3.*

  3.  **The False-Embedding Case.** A community condemns a practice believing it causes invisible harm. That belief is false. Is the condemnation:
      *   A) Mistaken (because the harm doesn't exist).
      *   B) Correct but for the wrong reason.
      *   C) Not in the business of being correct (it's about social cohesion).
      *   *If A, go to 4. If B, go to 6. If C, go to 5.*

  4.  **Reverse-WEIRD.** The heavily sampled populations (Western, Educated, Industrialized, Rich, Democratic) are statistical outliers. Does this give reason to:
      *   A) Distrust their judgments (they are the outliers).
      *   B) Trust them more (education markets improve judgment).
      *   C) Treat it as no evidence either way.
      *   *If A, go to Leaf 4 (Relativism). If B, go to 7. If C, go to 8.*

  5.  **Necessary-Looking Claims.** A candidate universal (e.g., "accidental harm is better than deliberate") fails to show up reliably. Does this count against:
      *   A) The claim itself.
      *   B) The reliability of the responses.
      *   C) The whole practice of treating intuition as evidence.
      *   *If A, go to 9. If B, go to 10. If C, go to Leaf 6 (Quietist).*

  6.  **Weight, Not Kind.** Communities disagree on hiring a relative over a stranger. Is this:
      *   A) A moral disagreement (one is wrong).
      *   B) A disagreement about non-moral facts (e.g., economic stability).
      *   C) No disagreement (adaptive tuning to different ecologies).
      *   *If A, go to 7. If B, go to Leaf 2 (Narrow Core). If C, go to Leaf 7 (Adaptive Tuning).*

  7.  **The Convergence Test.** [ADDED: Stipulated for logical space] If everyone knew all facts and reasoned perfectly, would they agree?
      *   A) Yes.
      *   B) No.
      *   *If A, go to 8. If B, go to Leaf 3 (Constructivism).*

  8.  **The Expertise Defeater.** [ADDED: Actively contested] Does moral expertise (philosophers/priests) override folk intuition?
      *   A) Yes, folk error is common.
      *   B) No, intuition is the data.
      *   *If A, go to Leaf 1 (Robust Objectivism + Error Theory). If B, go to Leaf 2 (Narrow Core).*

  9.  **The Motivation Check.** [ADDED: Well replicated] If you judge it wrong, are you necessarily motivated not to do it?
      *   A) Yes.
      *   B) No.
      *   *If A, go to Leaf 5 (Expressivism). If B, go to Leaf 1 (Robust Objectivism).*

  10. **Reliability vs. Practice.** Does the failure of universals count against the reliability of responses or the practice of using them?
      *   A) Reliability only.
      *   B) The practice itself.
      *   *If A, go to Leaf 2 (Narrow Core). If B, go to Leaf 6 (Quietist).*

  **Leaf Table: Positions and Headlines**

  | Leaf | Position | Description | Headline Uptake |
  | :--- | :--- | :--- | :--- |
  | 1 | **Robust Objectivism + Error Theory** | Moral truths exist independently; most folk variation is error. | "Science Shows Most Moral Intuitions Are Wrong." |
  | 2 | **Narrow Core Objectivism** | Unity exists only at a high level (e.g., fairness); specifics vary. | "Morality Is Universal in Principle, Local in Practice." |
  | 3 | **Constructivism** | Moral facts are constructed by agents; variation reflects different reasons. | " Moral Truths Are Made, Not Found, Across Cultures." |
  | 4 | **Cultural Relativism** | Truth conditions depend on cultural context; no external standard. | "No Culture's Morality Is Objectively Better Than Another." |
  | 5 | **Expressivism** | Moral judgments express attitudes, not beliefs; no truth value. | "Morality Is About Feelings, Not Facts, Data Suggests." |
  | 6 | **Quietist** | Folk intuitions were never evidence for objectivity; data is irrelevant. | "Moral Psychology Cannot Settle the Objectivity Question." |
  | 7 | **Adaptive Tuning** | Variation is ecological calibration, not error or different truths. | "Moral Differences Are Adaptive Strategies, Not Errors." |

  **Meta-Analysis: Gaps and Convergences**

  **Unoccupied Cells**
  Several combinations of answers lead nowhere because the views are incoherent or unmapped.
  1.  **Quietist Objectivism:** Answering that intuitions are irrelevant (Quietist) while insisting moral truths are robust and independent (Objectivism) is unstable. If intuitions are irrelevant, how do we access the truths? This cell is empty because the view is epistemically self-defeating.
  2.  **Expressivist Convergence:** Answering that judgments are non-cognitive attitudes (Expressivism) while insisting ideal agents would converge (Convergence=Yes) is unmapped. Expressivists typically deny truth-apt convergence, viewing agreement as shared sentiment rather than factual discovery.
  3.  **Relativist Expertise:** Answering that truth is culture-bound (Relativism) while claiming external expertise overrides folk intuition (Expertise=Yes) is incoherent. If truth is internal to the culture, an external expert lacks standing to correct them.

  **Indistinguishable Leaves**
  This tree cannot honestly separate **Leaf 3 (Constructivism)** and **Leaf 4 (Cultural Relativism)** on the basis of these cases alone. Both positions predict variation and deny a single independent standard accessible to all. The distinction lies in metaphysics (whether reasons are constructed vs. indexed), not in the empirical responses to vignettes. A reader landing on either leaf has identical predictive expectations for future surveys. I flag this convergence to avoid inventing a fake fork; the data provided here supports a "no single standard" conclusion but cannot adjudicate the metaphysical source of that plurality.

  **Empirical Notes on Added Branches**
  *   **The Convergence Test:** Stipulated. There is no empirical method to test ideal reasoning convergence; this is a philosophical heuristic.
  *   **The Expertise Defeater:** Actively contested. Some data suggests philosophers differ from folk; other data suggests expertise merely rationalizes intuition.
  *   **The Motivation Check:** Well replicated in broad strokes (internalism), but exceptions (amoralists) are debated.

  **Final Note on Usage**
  This instrument sorts readers by their commitments to specific cases, not labels. However, given the fragility of the underlying data noted in the preamble, no headline derived from these leaves should be treated as settled science. The tree clarifies philosophical commitments, not empirical truths.
