  Include the normative coda, but keep it strictly descriptive and limited to approximately 1,000 words of the total 8,000.

  **Reasoning:**
  1.  **Committee Composition:** The sociologist on the committee will want to know *why* this metaphysics matters. Generational talk structures real-world arguments about pensions and climate burdens. Ignoring this risks the paper appearing academically sterile. However, the two metaphysicians will penalize the paper if it devolves into ethical advocacy.
  2.  **Ontological Stakes:** Your core argument is that interactive kinds are *made* real by institutional sorting. If you argue that invoking generations in distributive justice claims *manufactures* the differences cited, you are making a metaphysical point about causal loops, not just a moral point about fairness. This fits the core argument.
  3.  **Risk Management:** A full normative theory is a separate project. By framing the coda as an implication of the ontology (i.e., "If generations are interactive kinds, then normative usage changes the ontology"), you secure the stakes without expanding the scope beyond eight weeks. Write it as a "Implications for Social Explanation" section rather than a "Policy Recommendation" section.
