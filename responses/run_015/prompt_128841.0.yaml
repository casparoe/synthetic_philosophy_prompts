prompt: |-
  I'm giving the opening remarks next week at a small interdisiplinary workshop we're calling "Weighing the Unweighable." The topic is whether comparing historical atrocities is conceptually possible or just morally obscene, and there's a new archive being unveiled that scores state violence across three axes — direct deaths, destroyed cultural sites, and long-term displacement. The audience is split: about half are philosophy grad students who know the incommensurability literature, and the other half are archivists and family members who don't care about jargon but need to understand why we're putting different tragedies in the same frame.

  I need roughly five minutes. The philosophical tension has to actually shape what I can and can't say — I can't just hand-wave and claim every horror is totally unique, because then there's no reason for the workshop to exist, but I also can't rank them like a scoreboard without insulting people in the back row. I'm wondering if there's a useful distinction between ordering events and measuring them on one shared scale — maybe ordinal versus cardinal comparison — but I need it to land for folks who don't do philosophy for a living. Please write this in American English, don't cite specific scholars or assign any readings, keep the tone conversational rather than lecture-y, and avoid making me sound like I'm loosing sight of the human cost behind the numbers. End with a single sentence that summarizes the bottom line of the talk.
