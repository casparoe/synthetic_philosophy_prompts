answer: |-
  ### Part 1: Strategic Advice & Framing

  **Is this a dissertation or a footnote?**
  Honest answer: On its own, this is a **keystone dissertation chapter**, not a full dissertation, but it is absolutely substantial enough for a nine-month fellowship. If you treat it merely as a critique ("sortition has a boundary problem"), it collapses into a footnote in the broader "who is the demos" literature (Whelan, Goodin, etc.). To make it a fellowship-worthy project, you must pivot from *critique* to *mechanism design*. The value add isn't pointing out the problem; it's demonstrating that the *solution* requires a new theoretical understanding of how frames are constituted. If you can successfully articulate the "issue-relative frame" or "meta-sortition" proposal without hitting an infinite regress, this becomes a standalone article and the theoretical engine of your thesis.

  **Framing Options**
  Here are three ways to frame this, ranked by viability for a theory fellowship:

  1.  **The "Demos" Frame (Weak):** You frame this as a contribution to the boundary problem literature. *Argument:* Sortition faces the same "who is the people" problem as elections. *Why it fails:* It's redundant. Political theorists have beaten the boundary problem to death. Unless you have a radical new solution to the all-affected principle, this is just applying an old hammer to a new nail. It dilutes your specific insight about *randomness laundering discretion*.
  2.  **The "Statistical Bias" Frame (Medium):** You frame this as an empirical critique of representation. *Argument:* Commercial mailing lists underrepresent homeless populations, so assemblies aren't descriptive. *Why it fails:* Practitioners already know this. They use weighting and stratification to fix it. If your project is just "lists are imperfect," a methodologist will tell you to increase your sample size. It lacks normative teeth.
  3.  **The "Legitimacy Laundering" Frame (Strong):** You frame this as a critique of the *epistemic claim* of sortition. *Argument:* Sortition claims legitimacy because it removes human discretion from selection. But discretion is merely displaced to the construction of the sampling frame, where it is *less* visible than in elections. *Why it wins:* This connects the boring logistics (mailing lists) to the high theory (legitimacy/authority). It forces a re-evaluation of whether sortition is actually more impartial than voting, or just opaque in a different place. This is the one I've selected for the proposal below.

  ***

  ### Part 2: The Fellowship Proposal

  **Project Title:** The Laundry of Randomness: Sampling Frames as Hidden Political Discretion in Sortitive Democracy

  **Research Question**
  Does the reliance on technical sampling frames in citizens' assemblies undermine the core normative claim of sortition—that it offers a more impartial, faction-proof method of selection than elections? Specifically, is the "frame problem" a fixable technical defect solvable by better data, or does it reveal that sortition's advantage over voting is conditional on a prior boundary decision that the theory has no resources to make non-arbitrarily?

  **Significance & The Counter-Argument**
  The standard defense of sortition rests on the claim that random selection bypasses the factionalism and gatekeeping inherent in electoral competition. It promises descriptive representativeness "for free." My project challenges this by isolating the sampling frame—the list from which names are drawn—as a site of unacknowledged political discretion. Unlike elections, where the franchise is a matter of public law and contestation, the sampling frame is often a technical input (e.g., a commercial address database or electoral roll) chosen by contractors.

  The obvious counter-argument (the steelman I must address) is that *all* democratic mechanisms face the boundary problem. Elections also exclude non-citizens, prisoners, and minors. Therefore, sortition inherits no *new* problems; it simply operates within the pre-existing democratic boundary. If this reply holds, my project collapses into general boundary theory.

  I argue this reply fails because it ignores the *mechanism of legitimacy*. In elections, the exclusion is a political decision subject to contestation (e.g., voting rights acts). In sortition, the exclusion is a technical decision masked by the neutrality of the lottery. The lottery "launders" the political choice of the frame, making it harder to identify and challenge. If sortition claims superior impartiality, it must be held to a higher standard of transparency regarding how the "population" is constituted than elections, which make no such claim. This project tests whether that transparency is achievable or if the discretion is structurally necessary.

  **Methodology & Timeline (9 Months)**

  *   **Months 1–2: Theoretical Reconstruction.**
      I will reconstruct the normative argument for sortition premise-by-premise to locate exactly where the sampling frame does its work. I will map the "chain of custody" for legitimacy: from the definition of the population to the random draw. The goal is to produce a formal map showing where the "technical" input becomes a "political" boundary.
  *   **Months 3–5: Process Tracing & Case Studies.**
      I will examine documentation from three recent high-profile assemblies (e.g., climate or constitutional assemblies) where recruitment pipelines are public. I am not looking for statistical bias (which weighting fixes) but for *decision points*: Who chose the vendor? Why was the electoral roll chosen over a residency register? Were exclusions (e.g., non-citizens) debated or assumed? I will interview two or three practitioners to confirm the "black box" nature of vendor selection.
  *   **Months 6–7: Design Response.**
      I will develop and stress-test two design interventions. First, **Issue-Relative Framing**: constituting the sample based on stake in the outcome (e.g., housing assemblies sample tenants, landlords, and unhoused residents) rather than a static citizenry. Second, **Meta-Sortition**: randomly selecting the body that constructs the frame. I will analyze these for infinite regress problems to see if a non-arbitrary stopping point exists.
  *   **Months 8–9: Synthesis & Deliverables.**
      Drafting the dissertation chapter and the practitioner guide. I will finalize the argument on whether the frame problem is fatal or manageable, and produce the non-academic deliverable.

  **Possible Conclusions**
  1.  **The Fatal Flaw:** The frame problem is inherent. Sortition cannot claim superior impartiality because the frame construction is always political and opaque. (Result: Sortition must be hybridized with elected elements).
  2.  **The Technical Fix:** Better data and open-source frame construction can solve this. (Result: A new standard for "Open Frame" sortition).
  3.  **The Reframing:** The "population" should not be pre-political. Issue-relative framing is the normative correct path. (Result: A new model for assembly constitution).

  **Failure Condition**
  The project fails if I demonstrate that statistical weighting and stratification fully correct for frame exclusions *and* that practitioners already treat frame selection as a political choice. If the "black box" is already open and the math fixes the bias, the normative critique loses its force. I will know this early (Month 3) if practitioner interviews reveal that frame selection is already a matter of public debate in assembly design.

  **Scope Check**
  This is bounded to the *constitution* of the body, not its deliberation or impact. I am not evaluating whether assemblies make good decisions, but whether the people making them were selected via a process that matches the normative claims made for them.

  ***

  ### Part 3: The Practitioner Deliverable & Funder Pitch

  **The Deliverable: The Frame Audit Protocol**
  If the design response works, the output for practitioners won't be a theory paper; it will be a **Frame Audit Checklist**. This is a pre-assembly decision procedure. Before a lottery is run, the convening body must answer:
  1.  **Source Provenance:** Where did this list come from? (e.g., "Commercial vendor X" vs. "State residency register").
  2.  **Silent Exclusions:** Who is physically absent from this list? (e.g., Unhoused, incarcerated, digital-only residents).
  3.  **Justification:** Is the exclusion of these groups justified by the *policy domain*? (e.g., It might be okay to exclude non-residents from a local zoning assembly, but not from a climate assembly).
  4.  **Recursion Check:** Who chose this list, and how were *they* selected?

  **The Funder Pitch: "Why pay a philosopher to think about mailing lists?"**
  If a funder asks why this matters, the answer is: **Legitimacy is the product.**
  Citizens' assemblies are sold to the public and to policymakers as "representative" and "unbiased." If the sampling frame is a commercial database that silently excludes 15% of the affected population, the assembly is not representative, and its recommendations lack the authority you are paying to generate. You are funding a manufacturing process for political legitimacy. I am identifying a defect in the supply chain that, if left unaddressed, risks rendering the final product (the assembly's report) politically toxic or easily dismissed by opponents. A philosopher looks at the mailing list not to count addresses, but to audit the claim to authority.
