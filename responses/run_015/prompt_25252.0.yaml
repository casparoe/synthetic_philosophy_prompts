answer: |-
  Your frustration is entirely well-founded, and your hypothesis that the stalemate stems from a clash of philosophical methodology rather than a lack of mathematical or physical data is remarkably astute. In fact, I would argue that you have identified the central engine of the controversy, though I would refine your diagnosis slightly to suggest that the disagreement is not merely about methodology but about the ontological and semantic status of the concepts bridging the informal and the formal. The reason the debate appears to run in place is that participants are often arguing past one another because they are implicitly defending different versions of the thesis while using the same label. To understand why this happens and what progress might look like, we must disentangle the logical Church–Turing thesis from the physical Church–Turing thesis, and then examine what kind of philosophical work the thesis is actually doing in each context.

  When Turing and Church originally formulated their ideas, they were concerned with the limits of human computation, specifically what a human calculator could achieve following a fixed routine with paper and pencil. In this original context, the thesis functions largely as a conceptual analysis or, in the terminology of Rudolf Carnap, an explication. The goal was to take a vague, intuitive notion of effective calculability and replace it with a precise formal counterpart that preserved the essential features of the original concept while sharpening its boundaries for scientific use. If you view the thesis in this light, as a proposal for how we ought to use the term effective calculability within mathematics, then it is indeed not the kind of thing that can be falsified by physics. It is a stipulation about the extension of a concept. However, the debate stagnates because this conceptual claim has gradually morphed over decades into a claim about the physical world. When contemporary philosophers or physicists discuss hypercomputation, they are often invoking the physical Church–Turing thesis, which states that any function physically computable by a machine in our universe is Turing-computable. This is a fundamentally different beast. It is an empirical hypothesis about the laws of physics, contingent on the structure of spacetime and the behavior of matter. The confusion arises because defenders of the conceptual view often rebut empirical counterexamples by retreating to the definitional safety of the original thesis, while proponents of hypercomputation attack the definitional view by pointing to physical possibilities like Malament–Hogarth spacetimes. They are playing different games on the same board.

  This conflation is sustained by a deeper methodological disagreement about the relationship between mathematics and reality. On one side, you have those who treat mathematical logic as normative for physical reality, assuming that if a function is not Turing-computable, it cannot be physically realized because physical reality must obey logical constraints. On the other side, you have naturalists who treat logic as a tool derived from physical experience, meaning that if physics allows a process to compute a non-Turing-computable function, then our logic must expand to accommodate it. This is where your intuition about methodology hits the mark. The dispute is not about the math, as you noted, but about the authority of the formalism. Is the Turing machine a description of how computation happens to work in our universe, or is it a prescription for what counts as computation at all? Until participants explicitly state which authority they are appealing to, the debate will remain circular. The verbal dispute over the word thesis is merely a symptom of this deeper conflict over whether the limits of computation are discovered or decreed.

  Consequently, progress in this domain will not look like a traditional resolution where one side is proven right and the other wrong. We will not find a proof of the Church–Turing thesis, because it bridges the gap between the formal and the informal, and no formal proof can validate its own application to the informal world. Nor is it likely that we will find a definitive empirical falsification, because any alleged physical counterexample can be dismissed by arguing that the physical process in question is not stable, not measurable, or not effectively describable, thereby protecting the thesis through auxiliary hypotheses. Instead, progress must be diagnostic and clarificatory. It requires the community to adopt a pluralistic stance that acknowledges distinct versions of the thesis for distinct purposes. We should speak explicitly of the Logical Church–Turing Thesis when discussing the analysis of algorithms and proof theory, and the Physical Church–Turing Thesis when discussing the limits of engineering and cosmology. By separating these claims, we dissolve the illusion of a single monolithic debate that has gone nowhere.

  Furthermore, progress involves accepting that the informal notion of effective calculability might not be a natural kind waiting to be analyzed, but rather a cluster concept that serves different roles in different contexts. In some contexts, such as software verification, we need a strict, formal definition that excludes hypercomputation to ensure decidability. In other contexts, such as theoretical physics or cognitive science, we might need a broader definition that allows us to explore the limits of what physical systems can do, even if those systems do not fit the strict Turing model. Recognizing that the concept is theory-laden, as you suggested, allows us to stop asking whether the thesis is true in absolute terms and start asking whether it is useful for a specific inquiry. This shifts the burden from metaphysical justification to pragmatic utility. If a physicist finds a model of hypercomputation useful for describing a black hole, they are not falsifying the logician's definition of algorithms; they are simply working in a different conceptual regime.

  Ultimately, the persistence of the debate is a feature rather than a bug of the philosophy of computation. It persists because it sits at the intersection of logic, physics, and cognition, forcing us to confront how our abstract models map onto concrete reality. The stalemate you perceive is the friction generated by these collisions. To move forward, we must abandon the hope of a single, unified epistemic status for the Church–Turing thesis. Instead, we should treat it as a family of related claims, each with its own standards of justification. The conceptual claims are justified by their coherence and utility in mathematics; the physical claims are justified by empirical evidence and theoretical physics. When we stop trying to force these distinct justifications into a single mold, the debate transforms from a frustrating loop into a productive mapping of the boundaries between the abstract and the physical. Your hypothesis that this is a methodological clash is correct, but the resolution lies not in choosing one methodology over the other, but in recognizing that both are required for different parts of the picture. Progress is the clarity that comes from knowing which question you are asking, and thus, which answer is relevant.
