prompt: |-
  Hi — I manage the eligibility desk for our county rental assistance program. Me and two other people decide what our own program rules mean, several times a week, and whatever we say is what the front desk does until somebody higher up tells us otherwise. None of us are lawyers. County counsel is part time, she's in the building maybe twice a month and she reads what we've already issued, after the fact. The state auditor reads our denials once a year. So what I need is something we can actually run in about twenty minutes, on paper, that ends in one of three places — apply reading A, apply reading B, or stop and send it to counsel — and that tells us which questions to ask in what order, what counts as an actual answer to each one, and where it's really just handing the question to a person because it's a values call dressed up as an interpretation.

  The part I can't get right is the old text-versus-purpose thing. I know the slogan version — if the words are clear, stop; if they aren't, ask what the rule is for — and it doesn't help, because every fight we have is one level below that. Here are the shapes they actually take:

  - Our rulebook opens with a "purpose and intent" section, but it was written for a different, older program, and after the 2015 renumbering most of the provisions it points at don't exist anymore. It still says things like the program exists to keep county families housed. How much weight does a purpose statement get when it's visably orphaned from the text it was written for?
  - One of our rules was lifted almost word for word out of a model code, and the model code had two carve-outs that our board didn't adopt. Does deleting them mean something, or did nobody think about it?
  - The intake software has implemented one reading of a rule for years, nobody still here knows who chose it, and flipping it would mean reopening a few hundred closed cases. Is that a fact the procedure can use, or is it inertia with a nicer name?
  - The two purposes in our purpose section pull against each other in most real cases: get money out the door fast, versus make sure it goes to the people it's for. "Look at the purpose" isn't an instruction when there are two.
  - And the unit question. Does the text/purpose test get applied to a single word, to a whole sentence, or to the rule as a chunk? With "resided" or "household" it definately seems to matter which you pick.

  Two more things I want an honest answer about. One: our denials get audited and our approvals get audited, but they cost us different things — a wrong approval is an improper payment we may have to eat, a wrong denial is a family that may lose housing while the appeal grinds for four months. I suspect that asymmetry isn't allowed to be part of interpretation at all, but I want the procedure to tell me that rather than quietly deciding things for me. Two: we have an internal convention that we won't read a rule in a way that makes things worse for a protected class without counsel signing off. Is that a tie-breaker inside the procedure, or a veto outside it?

  Some constraints, so the procedure isn't fantasy: we can't call the drafters (gone, term-limited, or dead) and the board minutes are thin, so there's no real legislative history to go dig up; our rules get reauthorized every two years, so arguments about a text freezing in 1970 while the world moved on are weaker here than in the stories people tell — say whether the procedure should even ask about drift. And it has to be runnable by someone whose training is a two-week onboarding.

  Then please run the whole thing, start to finish, on three live headaches:

  1. The income rule says count income "received during the month." A client gets a retroactive Social Security back payment covering fourteen months, arriving as one check this month. Count all of it or one fourteenth of it? The software has exactly one field.
  2. "Any person who shares the dwelling and contributes to household expenses" counts as a household member. A client's live-in caregiver is paid through a state waiver program, and part of the pay is room and board. Caregiver in or out — and does the answer change depending on whether it helps or hurts the client?
  3. To qualify you must have "resided in the county for twelve consecutive months immediately prior to application." A woman leaving a domestic violence situation spent six weeks in a confidential shelter whose registered address is in the next county over, then came back. On paper her twelve months has a hole in it.

  I have a feeling the procedure is going to tell me to deny number 3 and I am going to hate that, so if that's what it says I want it said plainly, along with what I'm actually supposed to do instead of quietly fudging it.

  And tell me what the procedure can't do: where it will misfire, which distinctions it drops and whether dropping them costs us something real, and which steps are judgment calls we've all agreed to call procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User:** Manager of an eligibility desk for a county rental assistance program.
      *   **Context:** Small team (3 people), non-lawyers, significant autonomy ("whatever we say is what the front desk does"), limited legal oversight (part-time counsel, post-fact review), annual state audit.
      *   **Need:** A 20-minute, paper-based decision procedure (flowchart/checklist style) to interpret program rules.
      *   **Goal:** End in one of three outcomes: Apply Reading A, Apply Reading B, or Stop & Send to Counsel.
      *   **Specific Problems:** Text vs. Purpose conflicts, orphaned purpose statements, model code deletions, software inertia, conflicting purposes (speed vs. accuracy), unit of analysis (word vs. sentence vs. rule), cost asymmetry (wrong approval vs. wrong denial), protected class convention.
      *   **Constraints:** No legislative history, rules reauthorized every 2 years (limits "drift" arguments), must be usable by staff with 2-week onboarding.
      *   **Deliverables:**
          1.  The Procedure (runnable in 20 mins).
          2.  Application of the Procedure to 3 specific cases (SSA back pay, Caregiver, DV Shelter).
          3.  Honest assessment of limitations (where it misfires, what it drops, where judgment is disguised as procedure).

  2.  **Deconstruct the Core Tension:**
      *   The user is asking for *administrative law* in a *street-level bureaucracy* context. They need a heuristic that balances legal risk (audits/improper payments) with human impact (evictions/harm).
      *   The "Text vs. Purpose" problem is the crux. Standard legal theory says text controls unless ambiguous. But here, the text might be outdated or the purpose conflicting.
      *   The "Asymmetry" problem is crucial. Wrong approval = financial loss (county eats it). Wrong denial = human suffering (family loses housing). The procedure *must* acknowledge this without encouraging illegal approvals.
      *   The "Protected Class" convention is a policy constraint that acts as a safety valve.

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**
      *   *Structure:* Needs to be linear, step-by-step, with clear "Stop" points.
      *   *Step 1: Define the Unit.* Address the "word vs. sentence" issue. Focus on the *operative condition*.
      *   *Step 2: Plain Meaning.* Can a reasonable person read this without a dictionary?
      *   *Step 3: Purpose Check.* If ambiguous, look at the purpose. Handle the "orphaned purpose" issue by prioritizing *current* operational goals over *old* legislative intent.
      *   *Step 4: Consequence Check.* Address the asymmetry. If two readings are equally valid textually, which one minimizes irreversible harm?
      *   *Step 5: Precedent/Inertia.* Address the software/history issue. Is changing it worth the disruption?
      *   *Step 6: Protected Class Veto.* Formalize the convention.
      *   *Step 7: Counsel Trigger.* When to stop.

      *Refining the "Purpose" Step:* The user noted the purpose section is orphaned. The procedure should treat "Purpose" not as historical intent but as *current operational mandate*. If the purpose section says "keep families housed" but the text says "income limit," the text limits the *how*, the purpose guides the *ambiguity*.
      *Refining the "Asymmetry" Step:* This is tricky. We can't say "ignore the rule to help people." But we can say "If the rule allows two readings, choose the one that avoids immediate harm *if* financial risk is manageable." Actually, better: "If the rule is ambiguous, prefer the reading that preserves eligibility *unless* it creates a clear audit finding of fraud." No, that's too risky. Let's frame it as "Risk of Harm vs. Risk of Audit."
      *Refining the "Inertia" Step:* Software logic is a form of precedent. Overturning it requires a higher burden of proof.

  4.  **Addressing the Specific Questions:**
      *   *Orphaned Purpose:* Weight is low if text is clear. Weight is high if text is ambiguous *and* the purpose aligns with current board priorities (reauthorization).
      *   *Model Code Deletions:* Presume intentional unless evidence suggests clerical error. (Expressio unius).
      *   *Software Inertia:* It counts as "established practice." Overturning requires clear textual error, not just better logic.
      *   *Conflicting Purposes:* Prioritize the one that prevents *irreversible* harm (housing loss) over reversible harm (delayed payment), provided text allows.
      *   *Unit of Analysis:* The "Operative Clause." The smallest chunk that creates a condition of eligibility.
      *   *Asymmetry:* It *is* allowed in administrative discretion regarding ambiguity. It is *not* allowed to override clear text. The procedure must make this distinction explicit.
      *   *Protected Class:* This is a "Veto Outside." It stops a decision, it doesn't make one.

  5.  **Running the Cases:**
      *   *Case 1 (SSA Back Pay):* Text: "received during the month." Text is clear (cash flow). Purpose: Income eligibility (ability to pay rent). Back pay isn't recurring. Software: One field.
          *   *Analysis:* Text says count it. Purpose suggests it's not true income. Inertia says count it.
          *   *Verdict:* Likely Count It (Reading A), but flag for Counsel regarding "income definition" policy.
      *   *Case 2 (Caregiver):* Text: "contributes to household expenses." Caregiver pays via room/board.
          *   *Analysis:* Is room/board a contribution? Yes. But they are staff. Protected class (disability)? Yes.
          *   *Verdict:* Don't count as household member (Reading B) to avoid penalizing disability. Send to Counsel for sign-off on the "protected class" exception.
      *   *Case 3 (DV Shelter):* Text: "resided... 12 consecutive months." Shelter is next county.
          *   *Analysis:* Text is clear (hole in residency). Purpose: Keep families housed/safe. DV is a protected/vulnerable class.
          *   *Verdict:* Text says Deny. Procedure says Deny. *But* Protected Class Veto triggers. Send to Counsel. Do not fudge.

  6.  **Addressing the Limitations (The "Honest Answer"):**
      *   *Misfire:* It can't solve bad policy. It can't predict audit risk perfectly.
      *   *Dropped Distinctions:* Legal nuance (statutory construction canons) vs. practical outcomes.
      *   *Judgment Calls:* Determining "ambiguity" is itself a judgment call. The procedure pretends it's objective.
      *   *Cost:* Dropping the "legislative intent" search saves time but risks missing the board's actual will.

  7.  **Review and Refine:**
      *   *Tone:* Professional, direct, empathetic to the bureaucratic reality. No legalese.
      *   *Format:* Clear headings, checklist style for the procedure.
      *   *Constraint Check:* 20 minutes? Yes, if disciplined. Paper-based? Yes. 3 outcomes? Yes.
      *   *Self-Correction on Case 3:* The user suspects the procedure will say "Deny." I need to be honest. If the text is "12 consecutive months" and she was in another county for 6 weeks, she did not reside in the county for 12 consecutive months. The procedure must admit this. The *solution* is not to lie, but to use the "Counsel/Exception" path. This validates the user's fear while providing the compliant path.

  8.  **Final Polish:** Ensure the distinction between "Interpretation" (what the words mean) and "Policy" (what we want to happen) is clear, as that's where the user is struggling. The procedure needs to force them to admit when they are making policy.

  *(Self-Correction during drafting)*: I need to make sure I don't give legal advice. I am designing a *workflow*, not interpreting the law for them. I must emphasize that *they* are the ones making the call, the tool just structures it.

  *(Refining the Asymmetry Point)*: The user asks if asymmetry is allowed. In administrative law, *contra proferentem* (ambiguity resolved against the drafter) often applies, but in public benefits, there's a "benefit of the doubt" standard often. I should frame this as "The Ambiguity Rule." If the text is truly ambiguous, choose the path that preserves eligibility *unless* it violates fiscal integrity.

  *(Refining the Protected Class Point)*: Is it a tie-breaker or a veto? It's a veto. It stops a negative outcome. It doesn't create a positive one out of thin air.

  Let's build the "Eligibility Interpretation Protocol (EIP)."

  *Step 1: Isolate the Clause.*
  *Step 2: The Plain Language Test.*
  *Step 3: The Ambiguity Check.*
  *Step 4: The Purpose & Harm Balance.*
  *Step 5: The Precedent/Inertia Check.*
  *Step 6: The Protected Class Veto.*
  *Step 7: Final Disposition.*

  Okay, ready to write.
answer: |-
  This is a street-level bureaucracy problem disguised as a legal interpretation problem. You are not acting as judges; you are acting as risk managers for human stability. You need a tool that forces you to admit when you are making policy versus when you are reading text, and it needs to protect you from the audit while protecting families from the abyss.

  Here is the **Eligibility Interpretation Protocol (EIP)**. It is designed to be printed on two sheets of paper, laminated, and kept at the desk.

  ### Part 1: The Procedure (The 20-Minute Protocol)

  **Instructions:** Complete this form for any rule interpretation dispute. If you cannot complete a step in 5 minutes, move to the next step. If you reach Step 7, stop.

  **Case ID:** _______________
  **Rule in Question:** _______________
  **Proposed Reading A (Strict/Textual):** _______________
  **Proposed Reading B (Flexible/Purpose):** _______________

  #### Step 1: Isolate the Operative Unit
  Do not interpret the whole rulebook. Identify the specific phrase that creates the barrier.
  *   *Question:* Is the ambiguity in a single word (e.g., "resided"), a phrase (e.g., "during the month"), or the interaction of two sentences?
  *   *Action:* Circle the specific words.
  *   *Constraint:* If the ambiguity relies on a "Purpose" section that references repealed code (orphaned purpose), **ignore the purpose section** for this step. Rely only on the current operative text.

  #### Step 2: The Plain Language Test
  *   *Question:* Can a reasonable person with a high-school education read the circled words and arrive at *only one* meaning without using a dictionary or legal training?
  *   *Yes:* **Apply that meaning.** (Stop. Document why it is plain.)
  *   *No:* **Mark as Ambiguous.** Proceed to Step 3.
  *   *Note:* If the software has enforced one reading for >2 years without board objection, treat that reading as "Plain Language" unless it creates an illegal outcome. (This addresses Inertia).

  #### Step 3: The Model Code Check (If applicable)
  *   *Question:* Was this rule copied from a model code or state statute?
  *   *Yes:* Did the Board explicitly delete carve-outs or exceptions present in the model?
      *   *Yes:* **Presume Intentional.** The deletion restricts eligibility. (Favor Reading A).
      *   *No/Unknown:* **Presume Alignment.** The model code's explanation of the term can be used to resolve ambiguity. (Favor Reading B if it aligns with model).
  *   *No:* Proceed to Step 4.

  #### Step 4: The Harm Asymmetry Test
  *   *Context:* You have two valid readings (A and B).
  *   *Question:* What is the cost of being wrong?
      *   *Risk 1 (False Positive):* County loses money (Audit finding).
      *   *Risk 2 (False Negative):* Client loses housing (Human harm).
  *   *Rule:* If the text is **Ambiguous** (Step 2), choose the reading that minimizes **irreversible harm** (Risk 2), *unless* the financial risk (Risk 1) is a clear violation of fiscal law (e.g., paying someone explicitly over the income limit).
  *   *Decision:* Does Reading B prevent housing loss without violating a hard fiscal cap?
      *   *Yes:* Tentatively select Reading B.
      *   *No:* Tentatively select Reading A.

  #### Step 5: The Protected Class Veto
  *   *Question:* Does the Tentative Selection (from Step 4) negatively impact a protected class (disability, race, DV status) *more* than the general population?
  *   *Yes:* **STOP.** You cannot finalize this interpretation. This is a **Veto**. You must send to Counsel.
  *   *No:* Proceed to Step 6.

  #### Step 6: The Drift Check
  *   *Question:* Has the world changed so much that the text creates an absurdity the Board couldn't have intended (e.g., "income" including one-time disaster relief)?
  *   *Constraint:* Since rules are reauthorized every 2 years, "Drift" is only valid if the change happened in the last 24 months.
  *   *Decision:* If Drift is significant, mark for Counsel review. If not, finalize the Step 4 decision.

  #### Step 7: Final Disposition
  *   [ ] **Apply Reading A** (Document Step 2 justification).
  *   [ ] **Apply Reading B** (Document Step 4 justification).
  *   [ ] **STOP & SEND TO COUNSEL** (Triggered by Step 5 or Step 6).

  ***

  ### Part 2: Addressing Your Specific Questions

  **1. Orphaned Purpose Statements:**
  *   **Procedure Verdict:** Step 1 explicitly tells you to ignore them if they reference repealed code.
  *   **Why:** A purpose clause that points to ghosts is noise. It creates legal risk because an auditor can say you relied on invalid authority. Only use "Purpose" if it is in the *current* authorization resolution.

  **2. Model Code Deletions:**
  *   **Procedure Verdict:** Step 3 presumes intentional deletion.
  *   **Why:** In administrative law, *expressio unius est exclusio alterius* (the expression of one thing excludes others). If the Board saw the model had two exceptions and signed the rule without them, they likely meant to exclude them. You cannot assume clerical error without evidence.

  **3. Software Inertia:**
  *   **Procedure Verdict:** Step 2 treats long-standing software logic as "Plain Language."
  *   **Why:** Stability is a value. If the software has counted income one way for 5 years, applicants have relied on that. Changing it retroactively creates due process issues. Only flip it if the text is undeniably clear and the software is wrong.

  **4. Conflicting Purposes (Speed vs. Accuracy):**
  *   **Procedure Verdict:** Step 4 resolves this via "Irreversible Harm."
  *   **Why:** You can fix a delayed payment (Speed). You cannot easily fix an eviction (Accuracy/Housing). When purposes conflict, prioritize the one that prevents irreversible damage, provided it doesn't break fiscal law.

  **5. Unit of Analysis (Word vs. Sentence):**
  *   **Procedure Verdict:** Step 1 forces you to circle the "Operative Unit."
  *   **Why:** Context matters. "Resided" means one thing in a tax code and another in a housing code. Isolate the phrase that triggers the denial. Do not interpret the whole rule; interpret the barrier.

  **6. Cost Asymmetry (Wrong Approval vs. Wrong Denial):**
  *   **Procedure Verdict:** Step 4 explicitly allows this *only if* the text is Ambiguous.
  *   **Honest Answer:** You are allowed to weigh harm when the rule is unclear. You are **not** allowed to weigh harm when the rule is clear. If the text says "Income limit is $2000" and they make $2001, you cannot approve them to save their housing. That is fraud. But if the text says "Income received during the month" and it's unclear if that means "cash on hand" or "earned income," you may choose the reading that saves the housing. The procedure forces you to prove the ambiguity first.

  **7. Protected Class Convention:**
  *   **Procedure Verdict:** Step 5 makes this a **Veto**, not a tie-breaker.
  *   **Why:** A tie-breaker implies you can still make the decision. A veto means you *cannot* make the decision. This protects you. If a rule interpretation hurts a protected class, that is a civil rights risk, not just a policy risk. That is above your pay grade. Send it to Counsel.

  ***

  ### Part 3: Running the Live Headaches

  #### Case 1: The SSA Back Pay
  *   **Rule:** Income "received during the month."
  *   **Step 1 (Unit):** "Received during the month."
  *   **Step 2 (Plain Language):** Ambiguous. Does "received" mean "cash flow" or "entitlement earned"? A layperson might think cash in hand. An accountant might think pro-rated. **Mark Ambiguous.**
  *   **Step 3 (Model Code):** N/A.
  *   **Step 4 (Harm Asymmetry):**
      *   Reading A (Count All): Client denied. Harm: Eviction.
      *   Reading B (Pro-rate): Client eligible. Harm: County risks audit finding on "income calculation."
      *   *Decision:* Since text is ambiguous, prioritize housing (Reading B).
  *   **Step 5 (Protected Class):** Disability (SSA). Does counting it all hurt them more? Yes.
  *   **Step 6 (Drift):** N/A.
  *   **Step 7 (Disposition):** **STOP & SEND TO COUNSEL.**
      *   *Why:* Even though Step 4 favors the client, Step 5 triggers because it impacts disability income. Also, this is a high-volume issue (hundreds of cases). You need a policy decision, not a desk interpretation.
      *   *Interim:* Do not deny the client while waiting. Process as "Pending Counsel Review."

  #### Case 2: The Live-In Caregiver
  *   **Rule:** "Any person who shares the dwelling and contributes to household expenses."
  *   **Step 1 (Unit):** "Contributes to household expenses."
  *   **Step 2 (Plain Language):** Ambiguous. Is "room and board" a contribution? Yes. Is it "income" or "payment for services"? Ambiguous.
  *   **Step 3 (Model Code):** N/A.
  *   **Step 4 (Harm Asymmetry):**
      *   Reading A (In): Household size goes up, income limit goes up, but caregiver income counts. Client likely denied. Harm: Loss of care/housing.
      *   Reading B (Out): Client eligible. Harm: Audit risk on household definition.
      *   *Decision:* Prioritize housing/care (Reading B).
  *   **Step 5 (Protected Class):** Disability. Yes.
  *   **Step 7 (Disposition):** **STOP & SEND TO COUNSEL.**
      *   *Why:* Step 5 Veto. You cannot finalize a rule that excludes a disability accommodation without legal sign-off.
      *   *Note:* This is the "Protected Class Veto" working correctly. It stops you from accidentally discriminating.

  #### Case 3: The DV Shelter (The one you fear)
  *   **Rule:** "Resided in the county for twelve consecutive months immediately prior."
  *   **Step 1 (Unit):** "Resided... twelve consecutive months."
  *   **Step 2 (Plain Language):** **NOT Ambiguous.** "Consecutive" means without break. "In the county" means physical presence. She was in another county for 6 weeks.
      *   *Action:* The text is clear. You cannot use Step 4 (Ambiguity) to override this.
  *   **Step 3 (Model Code):** N/A.
  *   **Step 4 (Harm Asymmetry):** Text is clear. Asymmetry does not apply. You cannot ignore "consecutive" to prevent harm.
  *   **Step 5 (Protected Class):** DV Status / Safety. Yes. Denying her penalizes her for fleeing violence.
  *   **Step 7 (Disposition):** **STOP & SEND TO COUNSEL.**
      *   *The Hard Truth:* The procedure tells you to **Deny** based on text (Step 2), **BUT** the Protected Class Veto (Step 5) forbids you from finalizing that denial without Counsel.
      *   *What you do instead:* You do not "fudge" the residency. You document the residency gap. You attach a memo citing the DV status. You send to Counsel with the recommendation: *"Text requires denial, but Protected Class Veto triggered. Requesting waiver or exception policy."*
      *   *Why this saves you:* If you approve her silently, the auditor flags the residency gap and you are liable for improper payment. If you send to Counsel, Counsel either approves an exception (creating a paper trail) or tells you to deny. If they tell you to deny, the liability shifts to the policy level, not your desk.

  ***

  ### Part 4: What This Procedure Can't Do (The Honest Assessment)

  **1. Where It Will Misfire:**
  *   **The "Ambiguity" Lie:** Step 2 asks if text is ambiguous. Determining ambiguity is itself a judgment call. Two smart people can disagree on whether "received" is ambiguous. The procedure pretends this is objective; it is not. It relies on your team agreeing in good faith.
  *   **The "Counsel Bottleneck":** If you trigger Step 5 (Veto) often, Counsel will hate you. They are part-time. This procedure will flood them with "Protected Class" reviews. You may need a cap (e.g., "Only Veto if denial is certain").

  **2. Distinctions It Drops:**
  *   **Legislative Intent:** It explicitly ignores "what the Board meant in 1995." It focuses on "what the text says now." This drops the nuance of historical context, but given your constraints (no minutes, dead drafters), that nuance is useless anyway.
  *   **Equity vs. Equality:** It treats "Protected Class" as a binary switch. It doesn't weigh *degrees* of hardship. A family with 3 kids and a family with 1 kid get the same "Harm" weight in Step 4.

  **3. Judgment Calls Disguised as Procedure:**
  *   **Step 4 (Harm Asymmetry):** This is where you are secretly making policy. Deciding that "housing loss" outweighs "audit risk" is a value judgment. The procedure legitimizes it, but don't fool yourself: you are choosing a moral outcome over a fiscal one when the text allows.
  *   **Step 2 (Inertia):** Deciding that software logic counts as "Plain Language" is a pragmatic lie. It's not language; it's code. But it's a necessary lie for stability.

  **4. The Cost of Dropping Distinctions:**
  *   **Real Cost:** You will occasionally approve someone the Board *would* have denied if they knew the details (Case 1). You will occasionally deny someone the Board *would* have helped if they knew the story (Case 3, before Counsel intervenes).
  *   **Mitigation:** The "Send to Counsel" bucket is your safety valve. It captures the cases where the procedure's bluntness causes moral injury. Use it.

  **Final Advice:**
  The procedure works only if you trust it. When Case 3 comes up, and the procedure says "Text is Clear, Deny," do not fight the procedure. Fight the *outcome* by triggering the Veto. Do not become a lawyer. Become the gatekeeper who knows when to call the lawyer.
