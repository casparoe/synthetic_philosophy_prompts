      *   *Leo's "Individualist Ontology" point:* This is crucial. Berkeley isn't a solipsist. Leo treats him like one. I need to point out that Leo's final objection relies on a misunderstanding of Berkeley's intersubjectivity.
      *   *Maya's "Conventionalism":* Is it purely human convention? Berkeley usually ties utility to divine intent. I should note this nuance.

  7.  **Final Polish:** Organize clearly with headings. Ensure the "Middle Position" is constructive. (Proceed to generate response based on these thoughts.)

      *   *Round 1:* Maya wins on textual fidelity. Leo wins on metaphysical pressure.
      *   *Round 2:* Maya clarifies the sign/thing distinction effectively (different *types* of ideas). Leo's reductionism charge is weak.
      *   *Round 3:* Leo's contagion point is strong *if* one ignores God, but weak *if* one includes God. Maya's defense of labor's reality is solid.
