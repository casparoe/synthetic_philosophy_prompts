  8.  **Final Review against constraints:** No citations. No bibliography. Check.

      *(Self-Correction)*: Wait, I need to make sure I don't sound like I'm writing an essay on Berkeley, but rather judging Maya and Leo. Keep the focus on their dialectic.

      *Round 1 Analysis:* Maya defines the economic view. Leo attacks the metaphysical consistency. Leo's claim that the distinction collapses is the weak point here. Berkeley distinguishes ideas by their order and connection, not substance.
      *Round 2 Analysis:* Maya uses the "pattern of ideas" defense. This is strong Berkeleyan orthodoxy. Leo's "footnote" claim is an exaggeration.
      *Round 3 Analysis:* Leo's contagion argument is the most sophisticated point. It challenges the mechanism of social coordination. Maya's response is standard but maybe doesn't fully address the *mechanism* of contagion.

      *Verdict:* Maya is more accurate to Berkeley's actual project. Leo identifies a genuine tension but misdiagnoses Berkeley's resources to solve it (God).

