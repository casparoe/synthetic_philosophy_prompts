answer: |-
  This is the right way to frame the problem. If we hold consequences, intentions, and epistemic outcomes constant, the definitional distinction (assertion vs. implicature) is morally inert unless it tracks a deeper structural difference in how the deception is accomplished.

  Here is the shape of the explanation for the "extra wrongness" (or the illusion of it), focusing on the mechanics of the speech act rather than the fallout.

  ### 1. The Mechanism of Authorship: Epistemic Conscription

  Your guess is that the variable is **who authors the falsehood**. You suggest the difference vanishes when the audience cannot do epistemic work (children) and is thickest when they must (peers). This is largely correct, but the mechanism isn't just about capacity; it's about **complicity**.

  **The Mechanism:**
  When you lie (Case A), you perform a unilateral act. You place a falsehood into the common ground and invite the hearer to accept it on your authority. You are the sole author of the error.
  When you mislead (Case B), you perform a collaborative act. You provide true premises and rely on the hearer's own inferential machinery to generate the false conclusion. You are the director, but they are the actor.

  **Why this might be *worse* (The Conscription Argument):**
  Some philosophers argue misleading is actually *more* violative than lying in high-agency contexts. Why? Because lying treats the hearer as a passive receptacle. Misleading treats the hearer's rationality as a weapon against themselves. You are forcing them to violate their own norm of "believe only what is supported by evidence." You haven't just fed them poison; you've forced them to cook it. This creates a deeper violation of autonomy. You have corrupted their internal process, not just their input.

  **Why this might be *better* (The Paternalism Argument):**
  Conversely, lying assumes the hearer cannot handle the truth or cannot verify it, so you override their judgment. Misleading respects their judgment enough to let them make the leap, even if you rigged the runway. It preserves a shred of their epistemic agency.

  **Where your story breaks:**
  Your prediction holds for the child (misleading a child is functionally lying because the "inferential gap" doesn't exist). But it breaks in **adversarial contexts**.
  In a cross-examination, the audience (the lawyer/jury) is *expected* to be suspicious. If you mislead them there, you aren't conscripting their rationality; you are defeating their vigilance. In that specific context, misleading is often viewed as *more* culpable than a flat lie because a lie is easily caught (falsifiable), whereas a misleading truth is designed to withstand scrutiny.
  So, the "Authorship" variable doesn't just scale with epistemic capacity; it scales with **expected vigilance**. If the hearer is supposed to be checking your work, misleading is a higher-order violation because it successfully bypasses the safety checks that a lie would have tripped.

  ### 2. Deniability: Cowardice or Structural Asymmetry?

  You asked if deniability is load-bearing or just cowardice stapled on. It is load-bearing, but not because of fear. It is about the **distribution of normative risk**.

  **The Mechanism:**
  Communication operates on a system of commitments.
  *   **Lying:** You undertake a commitment to the truth of proposition *P*. You put your reputation as a truth-teller on the line specifically regarding *P*. If caught, you are flagged as a liar.
  *   **Misleading:** You undertake a commitment to the truth of proposition *Q* (which is true), but you invite an inference to *P*. You do *not* undertake a commitment to *P*.

  **The Moral Friction:**
  The "extra wrongness" of misleading (if it exists) comes from an **asymmetry of risk**.
  In the lying case, you and the hearer are bound together. If the belief is false, you are both wrong, and you are the cause. You share the epistemic failure.
  In the misleading case, you create a scenario where, if the deception is uncovered, the hearer bears the cost of the error ("I shouldn't have inferred that"), while you retain the benefit of the deception ("I never said that").

  **Is it Cowardice?**
  No. Cowardice implies you are avoiding punishment. But this asymmetry exists even if no one is watching. It is a structural unfairness in the **economy of accountability**. You are extracting a benefit (their false belief) without posting the bond (commitment to the proposition).
  If there is extra blame here, it is for **free-riding on the norm of truthfulness**. You are using the hearer's assumption that you are being cooperative (Gricean maxims) to generate a result you would not be willing to stand behind cooperatively.

  **Where this breaks:**
  This explanation fails in contexts where deniability is *required* for safety (e.g., the Nazi at the door example). In those cases, the asymmetry of risk is a feature, not a bug. If the moral difference vanishes in high-stakes protection cases, then the "wrongness" of misleading is contingent on the **legitimacy of the commitment**. If you owe the hearer a commitment (a friend, a court), misleading is a breach of contract. If you owe them nothing (an enemy), the asymmetry is permissible tactics.

  ### 3. Why the Intuition is Stubborn (Even if there is no difference)

  Let's assume there is *no* moral difference in your controlled case. Same harm, same intent, same outcome. Why does the intuition that lying is worse persist so stubbornly?

  **The "Tool Integrity" Hypothesis:**
  We do not value communication only for its outcomes; we value it for the integrity of its tools.
  *   **Assertion** is a foundational tool. It is the bedrock. "I assert P" is the basic unit of knowledge transfer.
  *   **Implicature** is a derivative tool. It relies on the bedrock.

  Lying corrupts the bedrock. It makes the tool of assertion itself unreliable. If lying becomes common, the institution of "telling" collapses.
  Misleading corrupts the derivative layer. It makes inference risky, but it leaves the tool of assertion intact. You can still trust my words; you just have to mistrust my implications.

  **The Explanation:**
  The intuition persists because we are **institutional conservationists**. We sense that lying damages the *infrastructure* of communication more deeply than misleading does.
  *   Lying says: "The link between my words and my beliefs is broken."
  *   Misleading says: "The link between my words and your inferences is tricky."

  The first threatens the possibility of testimony itself. The second only threatens the efficiency of conversation. Therefore, lying feels "primitively" worse, even if the specific harm to Person A and Person B is identical. We are punishing the damage to the *system*, not the damage to the *user*.

  **Where this breaks:**
  This explanation fails in **high-trust, low-stakes** environments. Among close friends or partners, misleading often feels *worse* than lying. Why? Because in intimate relationships, the "Tool Integrity" of assertion matters less than the **Transparency of Mind**.
  If I lie to you, I am hiding my mind.
  If I mislead you, I am actively sculpting your perception of my mind while knowing you are looking at it.
  In intimacy, misleading is a form of gaslighting-adjacent behavior ("I never said that, you're imagining things"). Here, the "Tool Integrity" theory fails because the relationship relies on more than just the norm of assertion; it relies on the norm of *clarity*. Misleading violates the norm of clarity more than lying does.

  ### Summary of the Shape

  1.  **Authorship:** The difference is real when the hearer has high epistemic agency. Misleading conscripts the hearer's rationality to defeat itself. It vanishes when the hearer lacks capacity (children), supporting your guess. It flips in adversarial contexts where misleading is a superior defense against vigilance.
  2.  **Deniability:** It is not cowardice; it is **risk asymmetry**. Misleading allows the speaker to benefit from a false belief without undertaking the normative commitment to its truth. This is unfair in cooperative contexts but permissible in adversarial ones.
  3.  **The Stubborn Intuition:** If the moral difference isn't real in your controlled case, the intuition persists because we conflate **damage to the outcome** with **damage to the infrastructure**. Lying feels worse because it corrodes the basic norm of assertion, whereas misleading only corrodes the norms of inference. We protect the bedrock more fiercely than the furniture.

  **The Verdict on your Controlled Case:**
  In your specific setup (same belief, same intent, same consequence, no correction), the moral difference is **negligible regarding the victim**, but **significant regarding the speaker's integrity**.
  The liar has degraded their own status as a truth-teller (they asserted a falsehood).
  The misleader has degraded their status as a co-operator (they manipulated the process).
  If you value **Sincerity** (matching words to beliefs) above **Helpfulness** (matching words to useful inferences), lying is worse.
  If you value **Helpfulness** above **Sincerity**, misleading is worse (because it wastes the hearer's cognitive effort and leads them astray using valid tools).

  The stubborn intuition that lying is worse comes from the fact that Sincerity is the *default* setting for language, while Helpfulness is a *mode* we switch into. Violating the default feels more fundamental.
