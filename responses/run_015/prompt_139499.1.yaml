answer: |-
  The claim that P versus NP is a philosophical question rests on the intuition that the complexity classes P and NP capture a fundamental distinction between checking an answer and finding one. Class P contains problems solvable in polynomial time, meaning the steps required grow reasonably relative to the input size. Class NP contains problems where a proposed solution can be verified in polynomial time, even if finding that solution might take exponentially long. The 'creativity argument' posits that if P equals NP, discovery would be no harder than verification, implying that human creativity is merely mechanical search. This essay evaluates that argument against the 'Existence-Only Resolution' (EOR), a scenario where P equals NP is proven non-constructively. I shall argue that the EOR refutes the creativity argument as a thesis about human minds, that philosophical weight must rest on 'tractability-for-us' rather than 'tractability-in-principle', and that the objection regarding explanation changes the subject from computation to epistemology.

  To assess the EOR, we must distinguish between two notions of feasibility. 'Tractability-in-principle' refers to membership in a favourable asymptotic complexity class, regardless of whether the algorithm can be exhibited or run. 'Tractability-for-us' refers to a procedure that can be specified, implemented, and estimated within the bounded lifetimes and hardware of human agents. In the EOR scenario, a proof establishes that SAT (the Boolean satisfiability problem, a canonical NP-complete problem) admits a deterministic algorithm running in $O(n^4)$ time. However, the proof is non-constructive: it shows one member of a vast family of circuit families decides SAT within that bound, without identifying which one. Furthermore, a 'horizon-optimal searcher' exists, but its multiplicative constant is unknown and potentially astronomical.

  Does this vindicate or refute the creativity argument? The creativity argument claims that if P equals NP, creativity turns out to be mechanical. The EOR creates a divergence between ontology and epistemology. Ontologically, the universe contains a mechanical procedure for discovery; in this sense, the solution space is not deep, and creativity is, in principle, reducible to computation. However, epistemically, human agents remain locked out of this procedure. We cannot run the algorithm, nor can we bound the searcher's constant. Consequently, the human experience of discovery remains distinct from verification. We must still rely on insight, heuristic guessing, and what we call creativity because the mechanical shortcut is inaccessible.

  Therefore, the EOR refutes the creativity argument insofar as that argument threatens our self-conception as creative agents. If the mechanical solution is forever beyond our reach, then for all intents and purposes regarding the 'Mind' component of this seminar, creativity remains non-mechanical. The argument is vindicated only in a platonic sense that has no purchase on finite beings. Since the seminar concerns computation and mind, not computation and gods, the practical impossibility of accessing the algorithm matters more than its theoretical existence. The EOR demonstrates that a world can be mechanically deterministic regarding solutions while remaining creatively open regarding human cognition.

  This leads to the second question: ought philosophical weight be carried by tractability-in-principle or tractability-for-us? The strongest case for tractability-in-principle is that philosophy seeks metaphysical truth, not practical convenience. If the universe is fundamentally computable in polynomial time, then human difficulty is merely a local accident of our hardware. To prioritise tractability-for-us is to confuse epistemology with ontology; it privileges our current limitations over the structure of reality. If creativity is truly just search, then it is search, regardless of whether we possess the key to the lock. To claim otherwise is anthropocentric prejudice.

  I reject this consideration. While metaphysics seeks the nature of reality, the philosophy of mind seeks the nature of *agents*. Complexity theory is asymptotic; it describes behaviour as input size approaches infinity. Human minds are finite. They operate within fixed bounds of time, energy, and memory. An algorithm with a constant factor of $10^{100}$ is indistinguishable from an exponential algorithm for any physically realisable input. To base a philosophy of mind on asymptotic classes is to apply a mathematical tool outside its domain of relevance. The framing rests on a mistake about what complexity-theoretic classification is for: it is for classifying problems relative to resources, not for defining human potential relative to abstract limits. Therefore, tractability-for-us must carry the philosophical weight. If a solution is not tractable-for-us, it is irrelevant to the phenomenology of discovery, and thus irrelevant to the question of whether human creativity is mechanical.

  Finally, we must engage the wrinkle that even a runnable, fast solver emitting verified certificates would not touch what is valuable about mathematics, because the certificate would explain nothing. Proponents of this view argue that mathematics is not merely about truth but about understanding *why* a truth holds. A black-box solver provides the former without the latter. Does this rescue the creativity argument?

  It does not rescue the creativity argument; it quietly changes the subject. The creativity argument equates creativity with the capacity to find proofs efficiently. If P equals NP, that specific capacity becomes mechanical. The explanation objection concedes this point but asserts that finding proofs is not the whole of mathematical value. It shifts the debate from the *generation* of truths to the *comprehension* of truths. This is a valid epistemological distinction, but it does not restore the non-mechanical nature of discovery. It merely argues that discovery is not the only thing that matters. If the creativity argument is interpreted as "all mathematical value would be mechanised," then the explanation objection refutes it. But if the argument is "the act of finding proofs would be mechanised," the objection leaves it standing. Given the seminar's focus on computation and proof, the generation of proofs is the primary subject. To retreat to understanding is to admit that finding is indeed mechanical, but that we care about something else too. Thus, the objection saves the value of mathematics but concedes the mechanical nature of search.

  In conclusion, the Existence-Only Resolution refutes the creativity argument as a threat to human distinctiveness, because it severs the link between theoretical possibility and practical access. The philosophical weight in this debate must rest on tractability-for-us, because minds are finite entities operating in a physical world, not asymptotic abstractions. To prioritise tractability-in-principle is to commit a category error regarding the subject of inquiry. Finally, the objection regarding explanation does not rescue the claim that discovery is mechanical; it merely argues that discovery is not the sole constituent of mathematical worth. My verdict is that the creativity argument fails because it conflates the structure of solution spaces with the capacities of cognitive agents. Even if the universe is easy, we may remain hard.
