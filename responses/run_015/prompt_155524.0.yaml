answer: |-
  My friend, you argue with the sharpness of a prosecutor, but I fear you confuse the shifting sands of fashion with the bedrock of virtue. If the young construct a social world where reason and experience hold no currency, that is not my exile from the moral community, but rather their exile from nature itself. I will concede that customs change—methods of governance shift, and old songs are forgotten—but true wisdom concerns itself with justice, courage, and temperance, which are timeless. My dignity does not depend on the applause of the youth, but on the consciousness of a life well-lived; if they choose to ignore the pilot because they fancy themselves sailors, that is their folly, not a flaw in old age.
