  ### The Standard Bayesian Wall

  The standard Bayesian account hits a formal wall with old evidence. If you already know evidence $E$ is true, your credence $P(E)$ is 1. Plugging this into Bayes' theorem means the likelihood ratio collapses; learning a hypothesis $H$ entails $E$ doesn't boost $H$'s probability because $E$ was already certain. This implies Einstein couldn't have confirmed General Relativity using Mercury's perihelion, since that data was decades old. Standard fixes try to reconstruct a counterfactual state where $E$ was unknown, or they relax logical omniscience. But these feel like mathematical tricks. They preserve the formalism by pretending the agent isn't actually who they are, turning confirmation into a sort of historical reenactment rather than a genuine update on current knowledge. It creates a disconnect between the synchronic logic of belief and the diachronic reality of discovery.

  ### Calibration Drift as a Solution

  Your "diachronic calibration drift" framing cuts through this by treating evidence as instrument-dependent. Data isn't a bare proposition; it's a reading filtered through an error model. If we reject the old instrument's error model, the evidential relation $P(E|H)$ shifts. We aren't updating on the same $E$ that was previously certain; we're updating on raw data reprocessed through a new calibration. The likelihood changes because our understanding of the measurement process has evolved. This makes the update genuine because the informational content of the data has actually increased. We aren't just reshuffling old cards; we're reading them with new glasses. The probability isn't conditional on "Mercury's perihelion" as a static fact, but on "Mercury's perihelion as measured by instruments we now trust." This dynamic link breaks the $P(E)=1$ freeze without counterfactuals. It turns the likelihood function into an empirical hypothesis itself, subject to revision alongside the theory.

  ### The Regress Objection

  However, the skeptic argues this just pushes the problem back into prior choice. Why did the error model change? Presumably, because of background knowledge $K$. If $K$ is fixed, drift shouldn't happen. If $K$ updates, we need to explain how *that* update occurred without running into the old evidence problem regarding the instrument's past performance. Essentially, you're swapping the hypothesis $H$ for the error model $M$. If we were certain of the old $M$, we face the same zero-update issue when switching to the new $M$. The "drift" is just a label for updating our priors over reliability. Unless you can explain how we update confidence in the instrument without falling into the same trap, you haven't solved the structural issue; you've just moved the logical omniscience bottleneck from the theory to the tool. The risk is an infinite regress where every calibration requires a prior calibration update that faces the same old evidence freeze.

  ### Verdict

  Verdict: The drift framing dissolves the problem, but only if we accept Bayesianism as empirical psychology, not pure logic. The "bookkeeping" charge assumes evidence is static. But in practice, evidence is a physical claim about causality and measurement. If the likelihood function is an empirical estimate subject to error, then refining it is genuine learning, not logical rearrangement. The old evidence problem only exists if you treat probabilities as logical relations between static propositions. By acknowledging calibration drift, you admit probabilities are tethered to fallible models. So, Bayesians can genuinely update, provided they stop pretending their likelihoods are known with certainty. It saves the practice of science, even if it complicates the ideal theory. The update is real because the world-model changed, not just the belief state.
