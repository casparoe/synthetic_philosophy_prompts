answer: |-
  Your worry rests on a false presupposition. You are assuming that the only dialectical leverage a logical system can exert is the threat of **triviality** (via explosion). Consequently, you assume that if a system blocks explosion, it loses the ability to compel a rational agent to change their mind.

  This is incorrect. The debate between classical logicians and dialetheists is not settled by *reductio ad absurdum* in the traditional sense (showing that a view implies $P \land \neg P$), but by **inference to the best explanation**.

  Here is the plain correction of the error:

  **1. Logical Coercion vs. Theoretical Virtue**
  You are conflating *logical coercion* with *theoretical justification*. In classical logic, finding a contradiction is a "stopper"—it forces you to abandon the premises immediately to avoid triviality. In paraconsistent logic, finding a contradiction is a "data point." It does not force abandonment, but it demands an account.
  The dialectical force of dialetheism does not come from threatening the classical logician with explosion. It comes from arguing that dialetheism offers a **superior theory of truth** compared to classical alternatives. The leverage is abductive: "Dialetheism explains the semantic paradoxes with fewer theoretical costs than classical logic does."

  **2. The High Cost of Classical Solutions**
  You suggest the dialetheist lacks leverage to compel a classical logician. This ignores the significant leverage the *paradoxes* exert against the classical logician. To maintain classical logic and the Law of Non-Contradiction in the face of the Liar Paradox, one must adopt a solution that incurs heavy theoretical costs.
  *   **Tarskian Hierarchies:** You must deny that natural language has a universal truth predicate. You must accept that truth is ineffable within the language itself.
  *   **Kripkean Gaps:** You must accept that some sentences are neither true nor false, which complicates the logic of disjunction and negation (e.g., the Law of Excluded Middle fails).
  *   **Contextualism:** You must argue that the meaning of "true" shifts contextually in paradoxical sentences.

  The dialetheist argues: "Your solution requires fracturing the concept of truth or limiting expressive power. My solution accepts the contradiction but preserves semantic closure (the ability of a language to define its own truth predicate) and retains classical inference rules for non-contradictory cases."
  The leverage is the **expressive power** gained by the dialetheist. If a classical logician values semantic closure, they are compelled to consider dialetheism, explosion or no explosion.

  **3. Reductio is Not Dead**
  You claim that without explosion, contradiction loses its dialectical force. This is an exaggeration. Paraconsistent logics typically retain a form of *reductio*. They reject *Ex Falso Quodlibet* ($A, \neg A \vdash B$), but they often retain the principle that if a set of premises entails a contradiction *that is not independently verified as true*, the premises are suspect.
  The dialetheist does not claim *all* contradictions are true. They claim *some* are. Therefore, if you derive a contradiction in physics or economics, the dialetheist agrees this is likely a sign of error, not truth. The dialectical force remains: you must justify *why* a specific contradiction (like the Liar) is a "true dialetheia" while others are errors. The burden of proof shifts from "avoid contradiction at all costs" to "explain why this contradiction is virtuous."

  **4. The Error of "Inertness"**
  A philosophical position is "inert" if it makes no difference to how we understand the world or if it cannot be argued for. Dialetheism is not inert because it makes a positive ontological/semantic claim: **Truth is sometimes inconsistent.**
  This claim has consequences. It changes how we model semantic closure, how we handle self-reference, and how we understand the limits of formal systems. It is not merely a "get out of jail free" card for paradoxes; it is a competing hypothesis about the nature of truth.

  **Summary**
  Your confusion arises from thinking that the only way to win a logical argument is to threaten the opponent with logical disaster (triviality). In reality, logical systems are adopted based on **theoretical virtues**: simplicity, scope, and consistency with intuition.
  The dialetheist argues that classical logic pays too high a price to avoid contradiction (loss of semantic closure), whereas dialetheism pays the price of accepting some contradictions but gains a unified theory of truth. That trade-off provides ample dialectical leverage, independent of the principle of explosion.
