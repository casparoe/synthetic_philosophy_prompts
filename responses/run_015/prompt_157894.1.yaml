      *   **Key Point 2: The Cost of Classical Solutions.** Classical logic avoids contradiction but pays a high price (e.g., Tarski's hierarchy, giving up a universal truth predicate, denying intuitive self-reference). Dialetheism argues *their* view is cheaper/better.
