      *   *Presupposition:* Without explosion, a contradiction has no inferential leverage to compel a change of mind.
      *   *Is this false?* Yes, largely. While explosion is *a* way contradictions exert force in classical logic, it is not the *only* way philosophical arguments work. The user is conflating "logical consequence" with "theoretical virtue."
