answer: |-
  Before assigning probabilities, we must resolve several underlying empirical and theoretical uncertainties. First, does the "East/West" dichotomy map onto any psychologically real boundary once we control for socioeconomic development and education, or is it a spurious correlate of WEIRDness? Second, does administering vignettes in a lingua franca equalize comprehension or merely shift the burden of inference to proficiency signaling, thereby introducing a new confound? Third, if a difference survives paraphrase tasks, does that indicate a difference in semantic concepts or merely a difference in the pragmatic norms governing assertion and evidence? Finally, does the comprehension check filter out noise or systematically exclude participants who process the vignette holistically rather than analytically?

  Regarding your conditioning terms: I must replace **"a coarse East/West contrast"** with **"clustering by socio-ecological variables (e.g., market integration)."** Conditioning on "East/West" assumes a categorical essentialism that cultural psychology largely rejects; the causal work is likely done by continuous variables like relational mobility or subsistence style, which only correlate imperfectly with continental boundaries. Using the coarse proxy increases the probability of Type II errors (missing the effect) or Type I errors (attributing the effect to culture rather than ecology).

  ### Credences

