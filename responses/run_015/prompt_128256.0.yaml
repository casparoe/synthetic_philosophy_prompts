  ### Decomposition

  Here are the probabilities assigned to the five decomposed terms, adjusted for the replacement of the "East/West" proxy term.

  | Term | Description | Probability | Justification |
  | :--- | :--- | :--- | :--- |
  | **$P_{\text{Artifact}}$** | Prob. original effect is **not** largely an artifact (translation, comprehension, demand). | 0.90 | Recent large-scale replications suggest some signal remains despite noise. |
  | **$P_{\text{Swamp}}$** | Prob. within-society variance **swamps** between-society variance (making means unstable). | 0.20 | Sampling 30 societies provides sufficient power to stabilize cluster means. |
  | **$P_{\text{Absorb}}$** | Prob. lingua-franca and paraphrase manipulations **would absorb** most of the effect. | 0.40 | Paraphrases reduce semantic loading, but lingua franca introduces pragmatic noise. |
  | **$P_{\text{Proxy}}$** | Prob. socio-ecological clustering is a **poor** proxy for the causal cultural variable. | 0.40 | Market integration correlates with "West," but outliers (e.g., urban East) blur lines. |
  | **$P_{\text{Restrict}}$** | Conditional on a pragmatics-free gap, Prob. it supports **restrictivism** rather than expertise defense. | 0.75 | Systematic folk variation undermines the universalist premises required for evidential use. |

  ### Combination Logic

  **For Proposition 1 (Effect Survival):**
  To observe a stable difference of *d* ≥ 0.30, we need the effect to be real ($P_{\text{Artifact}}$), the signal to exceed noise ($1 - P_{\text{Swamp}}$), the controls not to eliminate the signal ($1 - P_{\text{Absorb}}$), and the grouping variable to track the cause ($1 - P_{\text{Proxy}}$).
  $$ \text{Credence}_1 \approx 0.90 \times (1 - 0.20) \times (1 - 0.40) \times (1 - 0.40) = 0.90 \times 0.80 \times 0.60 \times 0.60 = 0.259 $$
  *Rounded to 0.25.*

  **For Proposition 2 (Genuine vs. Pragmatics):**
  This depends primarily on whether the manipulations successfully isolated semantics ($1 - P_{\text{Absorb}}$) and whether the lingua franca introduced new pragmatic confounds (estimated at 0.70 success rate for isolation).
  $$ \text{Credence}_2 \approx (1 - P_{\text{Absorb}}) \times 0.70 = 0.60 \times 0.70 = 0.42 $$
  *Rounded to 0.40.*

  (Note: $P_{\text{Restrict}}$ does not determine the truth of Prop 2, but determines the theoretical consequence if Prop 2 is true.)

  ### Sensitivity Analysis

  **Most Sensitive Term:** $P_{\text{Absorb}}$ (Probability manipulations absorb the effect).
  This term appears in both calculations. If the paraphrase task eliminates the difference (i.e., if $P_{\text{Absorb}}$ rises to 0.80), Prop 1 crashes to ~0.10 and Prop 2 becomes moot. This reflects the central methodological worry: if the effect vanishes when "know" is removed, it was never about knowledge.

