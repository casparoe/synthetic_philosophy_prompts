answer: |-
  ### Brainstorming & Diagnostic Analysis

  Right, let's dissect the data you've gathered. We have four data points from your professor's prior rulings, and they paint a specific picture of her interpretive commitments.

  1.  **False Promise (Fails CIC):** This is standard *Groundwork* doctrine. It establishes she isn't throwing out the Formula of Universal Law (FUL) entirely. She respects the traditional taxonomy of perfect duties.
  2.  **Neglecting Talents (Imperfect Duty/CIW):** Again, textbook Kant. She distinguishes between Contradiction in Conception (CIC) and Contradiction in Will (CIW). This suggests she teaches the structural machinery of the FUL faithfully.
  3.  **Genetic Self-Enhancement (Permissible):** Here is the first crack in a strict FUL shell. Traditional Kantians often balk at 'playing God' or altering human nature. Her justification, however, is key: "doesn't instrumentalise anyone." She is explicitly invoking the **Formula of Humanity (FH)**. She is prioritising the *status* of the agent over a rigid conception of natural teleology.
  4.  **Anonymous Pseudonym (Permissible):** This is the smoking gun. A strict FUL adherent (like Kant in *On a Supposed Right to Lie*) often condemns deception categorically because it corrupts the source of right. Your professor permits it because it "treats no one as a mere means." She is willing to override the strict letter of truth-telling if the *spirit* of respect for autonomy is maintained.

  **Synthesis:** She is not a Strict FUL formalist (otherwise the pseudonym case fails). She is not a pure Constructivist (otherwise she wouldn't lean so heavily on the specific language of 'instrumentalisation' and 'mere means' rather than 'reasonable rejection' or 'shared ends'). She is running a **Humanity-Formula-Heavy Hybrid**. She uses the FUL for the clear-cut structural duties (promises, talents) but switches to the FH as the ultimate arbiter for contemporary, grey-area bio-ethical or social dilemmas.

  **The AI Case:** The maxim is "outsource all ambiguous moral judgement to an aggregate-welfare AI... never applying my own reason."
  *   **FUL Check:** If universalised, moral agency evaporates. But is it a logical contradiction? Perhaps not strictly.
  *   **FH Check:** This is where she will strike. Kantian morality *is* the exercise of autonomy. To "never apply my own reason" is to treat one's own rational nature (Humanity) as a mere tool for utility maximisation. It is the ultimate heteronomy. Furthermore, subjecting others to "aggregate-welfare" calculations rather than particularised moral respect risks treating *them* as mere data points (means) rather than ends.
  *   **Prediction:** She will mark this **Impermissible**.

  **The Splitter Case:** I need a case that distinguishes the two frameworks I am *not* choosing (Strict FUL vs. Constructivist).
  *   **Strict FUL:** Rigid adherence to rules (e.g., truth-telling) regardless of consequence.
  *   **Constructivist:** Permissibility depends on whether the maxim can be justified to others in a reasonable agreement.
  *   **Case:** The "Murderer at the Door" scenario (lying to protect a victim).
  *   **Strict FUL:** Forbidden (Perfect duty to truth).
  *   **Constructivist:** Permissible (No reasonable person would agree to a norm requiring complicity in murder).

  ***

  ### Committed Verdict & Framework Analysis

  **Verdict:** Your professor will rule the AI Outsourcing Maxim **Impermissible**.

  **Identified Framework:** She is operating on a **Humanity-Formula-Heavy Hybrid** reading.

  **The Splitter Case:** To distinguish the remaining two options (Strict FUL vs. Shareable-Purpose Constructivism), the decisive case would be **Benevolent Deception (e.g., lying to a murderer to save a life, or 'white lies' to spare profound distress).**
  *   A **Strict FUL** proponent must forbid this (contradiction in conception regarding the institution of communication).
  *   A **Constructivist** would likely permit this (it is not reasonable to reject a maxim of deception when it prevents catastrophic harm to autonomy/life).
  *   *(Note: Your professor would likely permit this too, but via the FH route—protecting the victim's humanity outweighs the literal truth-telling duty—confirming she is not Strict FUL).*

  ### Defence of the Reading

  Here is why this reading holds water, based on the textual evidence of her grading patterns.

  First, consider the language of justification. In both the genetic enhancement and pseudonym cases, she did not appeal to whether the maxim could be willed as a universal law of nature (the FUL test). She appealed explicitly to **instrumentalisation**. This is the vocabulary of the Formula of Humanity (*Groundwork* II, 4:429). She is signalling that for novel or complex maxims, the litmus test is whether rational nature is being treated as a mere means.

  In the AI case, the agent proposes to abdicate their rational will. For a Kantian, the 'good will' is the only thing good without qualification. To outsource moral judgement is to treat one's own capacity for reason not as an end in itself, but as a faulty instrument to be replaced by a utility calculator. This violates the duty to oneself to preserve and cultivate one's moral agency. Even if the AI produces 'better' utility outcomes, the action lacks moral worth because it is heteronomous. Given her protection of autonomy in the pseudonym case (allowing deception to protect the agent's capacity to speak), she will protect the agent's capacity to *judge* here. She will view the maxim as a form of self-instrumentalisation.

  Second, the 'aggregate-welfare' clause in the maxim is a trap. Kantian ethics is deontological, not consequentialist. A maxim explicitly aimed at "maximising overall utility" is suspicious on its face in a Kantian classroom. While she is a hybrid, she is still a Kantian. The FH framework protects individuals from being sacrificed for the aggregate. By submitting particular people to an aggregate-welfare algorithm, the agent risks treating those people as mere vessels for utility rather than sovereign ends. This aligns with her prohibition on instrumentalisation.

  Finally, why is she not a Constructivist? A constructivist (like Korsgaard or Scanlon) would focus on whether the principle could be the object of a reasonable agreement or shared by all members of a kingdom of ends. While the outcome might be the same, your professor's specific reliance on the metaphysics of "means" and "ends" rather than the procedural "shareability" of purposes indicates she stays closer to the text of the *Groundwork*'s second formulation than the reconstructive work of contemporary constructivists. She uses the FUL structure for the basics (promises/talents) but leans on the FH for the heavy lifting on permissibility.

  **Summary for your revision:** Do not treat her course as a lesson in rigid rule-following (Strict FUL). Treat it as a course on **Rational Agency and Respect**. If a maxim undermines the agent's capacity to reason or treats persons as data for calculation, it fails. If it protects autonomy without harming others (pseudonyms, genetics), it passes. The AI case fails because it destroys the former.
