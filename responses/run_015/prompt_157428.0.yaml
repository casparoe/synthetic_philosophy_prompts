answer: |-
  **Department of Temporal Morphology | Graduate Student Handbook & FAQ**
  **Subject: Historiographical Engineering Specifications (HES-404)**

  **Q: Is the program structured around linear or cyclical load-bearing frameworks?**
  A: The Department maintains neutrality regarding the vector of time, provided the chosen framework meets accreditation standards for structural integrity. Linear applicants must demonstrate sufficient tensile strength to withstand periods of apparent regression without buckling. Cyclical applicants must install pressure-release valves to account for epochs that refuse to conclude. Please note: mixing metaphors without a proper coupling mechanism will result in immediate dissertation rejection. We treat historiography as civil engineering, not poetry.

  **Q: What is the practical difference between a Spenglerian decay curve and a Toynbeean spiral?**
  A: This is a common confusion among first-year fellows. The Spenglerian model operates on a fixed-duration organic casing; the culture has a predetermined lifespan (typically 1,200 years) regardless of external stress. It is a closed-system specification. The Toynbeean spiral, conversely, is an adaptive stress-testing protocol. It allows for extension via "challenge-and-response" maneuvers, provided the response is deemed adequate by the committee. However, be advised: if a civilization survives too long without collapsing, the Toynbee model requires you to recalibrate the definition of "collapse" to maintain theoretical consistency. Spengler does not permit this; if the culture survives past winter, the model assumes you measured the wrong culture.

  **Q: May I combine Ibn Khaldun's *asabiya* coefficient with linear-progressive metrics in a single dissertation?**
  A: Yes, but only under strict isolation conditions. Khaldun's group solidarity functions as a volatile variable that decays in mathematically regular fashion over four generations. Linear progress metrics assume a constant voltage. To combine them, you must buffer the *asabiya* variable so that its decay does not drain the linear progress battery. Most students fail here by allowing solidarity to drop to zero while claiming institutional advancement continues. This creates a logical vacuum. You must argue that bureaucracy persists even after solidarity evaporates, though this risks classifying your civilization as a "zombie epoch," which is ineligible for certain grants.

  **Q: What is the Department's signature "helicoid compromise"?**
  A: The helicoid compromise is our standard solution for candidates unable to choose between cyclical recurrence and linear accumulation. This model posits that history loops like a helix. Each civilizational cycle is tangent to the previous one but never intersects it. This preserves cyclical dynamics (rise, decay, fall) while preventing true recurrence, thereby allowing linear "progress" to accumulate only in a purely formal, non-substantive sense. For example, a new empire may resemble the old one structurally, but because it occupies a different coordinate on the vertical axis, it is technically "advanced." This satisfies linear accreditation boards while permitting cyclical narrative arcs. Note: Helicoid dissertations require double the page count to demonstrate the vertical displacement.

  **Q: How does the Department handle falsification of historical models?**
  A: We do not use the term "falsification." We utilize "Epoch Recalibration Protocols." If evidence suggests a cycle has broken or progress has reversed, the candidate must adjust the boundary conditions of the epoch until the model holds. For example, if a civilization fails to decay according to schedule, you may classify the interim period as a "latent phase" rather than a stability phase. If a linear metric shows decline, you may reclassify the decline as "consolidation." The goal is not to prove the model true, but to ensure the model remains usable for future funding applications. A model that cannot absorb counterevidence is, structurally speaking, unsafe for habitation.
