answer: |-
  This is a classic problem in the philosophy of collective intentionality, touching on the debate between psychological accounts (e.g., Bratman, Searle) and functional/institutional accounts (e.g., List, Pettit). Your intuitions are remarkably consistent with a **pluralist** view, even if you are seeking a unified principle.

  To accommodate the largest coherent subset of your judgments—specifically prioritizing the distinction between the **Rescue Chain** (Joint) and the **Research Consortium** (Not Joint), while respecting the **Cooks** (Not Joint)—I propose the following principle.

  ### The Principle of Commitment-Responsive Agency (CRA)

  **Definition:** A group of individuals engages in genuine joint action if and only if:
  1.  **Shared Goal Representation:** Each participant represents the group outcome as a goal of *their own* action (not merely as a side effect).
  2.  **Interdependent Responsiveness:** Each participant adjusts their own contribution in real-time (or near real-time) based on the actual or anticipated actions of the others.
  3.  **Mutual Regard as Co-Agents:** Each participant treats the others' contributions as exercises of agency to be supported or meshed with, rather than as fixed environmental conditions or tools to be exploited.

  ---

  ### Analysis of Your Cases under CRA

  **1. The Piano Movers (Joint)**
  *   **Verdict:** Accommodated.
  *   **Motivation:** Satisfies all three clauses. They share the goal (move piano), adjust grip (responsiveness), and treat each other as partners (co-agents).
  *   **Clause:** Clause 2 motivates the "real-time adjustment" requirement.

  **2. The Emergency Callers (Not Joint)**
  *   **Verdict:** Accommodated.
  *   **Motivation:** Fails Clause 2 and 3. They do not adjust their calling based on others (redundancy is common), and they do not treat others as partners in a single call, but as independent actors.
  *   **Clause:** Clause 2 distinguishes aggregation from interaction.

  **3. The Rescue Chain (Joint)**
  *   **Verdict:** Accommodated.
  *   **Motivation:** This is the critical test. It satisfies Clause 1 (save swimmer), Clause 2 (grip depends on neighbor's pull), and Clause 3 (treating neighbors as partners, not tools). It shows that *explicit agreement* is not required for Clause 1, only a shared representation of the immediate goal.
  *   **Clause:** Clause 3 motivates the "thin but real" sense of partnership without institutional framework.

  **4. The Research Consortium (Not Joint)**
  *   **Verdict:** Accommodated.
  *   **Motivation:** Fails Clause 1 and 3. While they signed a protocol, they do not represent the *theoretical goal* as their own (they lack understanding), and they do not treat colleagues as co-agents (no communication, mere data entry). They are cogs, not partners.
  *   **Clause:** Clause 1 distinguishes *psychological commitment* from *contractual obligation*.

  **5. The Deceived Cooks (Not Joint)**
  *   **Verdict:** Accommodated.
  *   **Motivation:** Fails Clause 1. They do not share a goal representation. One intends "rehearsal," the other "dinner." Their subplans do not mesh in intention, even if they mesh physically.
  *   **Clause:** Clause 1 ensures that accidental coordination or deception does not count.

  **6. The Corporate Board (Joint?)**
  *   **Verdict:** **Not Accommodated (as individual joint action).**
  *   **Motivation:** The current members lack the Shared Goal Representation (Clause 1) and Mutual Regard (Clause 3) regarding the specific strategic reasoning.
  *   **Resolution:** To save your intuition here, we must distinguish **Interpersonal Joint Action** (governed by CRA) from **Corporate Agency**. The *Corporation* acts jointly because it is a distinct agent with a unified goal function, but the *board members* are merely fulfilling roles within that agent. They are not engaging in joint action *with each other* in the psychological sense; they are triggering the actions of the corporate agent.

  ---

  ### Predictions for Further Situations

  **1. The Flash Mob (Self-organized via Social Media)**
  *   **Prediction:** **Borderline/Context-Dependent.**
  *   **Reasoning:** If participants merely show up and dance parallel to one another based on a video tutorial, they fail Clause 2 (Responsiveness) and Clause 3 (Co-Agency); they are coordinated individuals. However, if the mob involves improvisation where dancers react to neighbors to create a shifting pattern, they satisfy CRA and count as joint action.
  *   **Implication:** Mere synchronization is not joint action; interaction is required.

  **2. The Surgical Team (Lead Surgeon Replaced Mid-Operation)**
  *   **Prediction:** **Joint Action Maintained.**
  *   **Reasoning:** As long as the incoming surgeon adopts the *Shared Goal Representation* (complete the specific surgery successfully) and engages in *Interdependent Responsiveness* with the nurses/anesthesiologists, the joint action persists. The specific identity of the agent is less important than the continuity of the shared intention and responsiveness.
  *   **Implication:** Joint action is robust to personnel changes if the *structure of intentionality* is preserved.

  ---

  ### The Cost of Coherence: Unity vs. Family

  You asked whether the cost of saving the Rescue-Chain verdict is abandoning the Board-Rotation verdict. Under the **Commitment-Responsive Agency (CRA)** principle, the answer is **Yes**.

  1.  **The Trade-off:** If you insist that the Rescue Chain and the Board Members are engaging in the *same kind* of joint action, you must weaken Clause 1 (Shared Goal) and Clause 3 (Mutual Regard). But if you weaken those clauses, the Research Consortium slips back in (they have a protocol/agreement), and the Deceived Cooks might slip in (they have physical coordination).
  2.  **The Diagnosis:** Your intuitions reveal that "Joint Action" is not a unified phenomenon. It is a **family resemblance concept** covering at least two distinct relations:
      *   **Psychological Joint Action (The Rescue/Piano):** Defined by mutual awareness, interdependence, and shared commitment. This is what CRA captures.
      *   **Institutional/Functional Joint Action (The Board/Consortium):** Defined by role fulfillment within a normative structure that aggregates output. This captures the Board, but arguably the Consortium too (depending on how strict the "understanding" requirement is).

  **Honest Statement of Failure:**
  The CRA principle cannot accommodate the verdict that the **Board Members** are acting jointly *in the same sense* as the **Rescue Chain**. It forces you to say: "The Rescue Chain is a case of interpersonal joint action; the Board is a case of corporate agency enacted by role-fillers."

  If you find this distinction unacceptable, you must adopt a **Disjunctive Account**:
  > *Joint Action occurs if (A) agents share a psychological commitment to a meshing plan (Rescue/Piano) OR (B) agents occupy roles within a legitimate institutional structure designed for collective output (Board).*

  **Conclusion on Collective Intentionality:**
  This analysis suggests that collective intentionality is **not a unified phenomenon**. It is layered.
  *   **Layer 1 (Primitive):** Joint attention and responsiveness (Rescue Chain, Piano). This is evolutionary old, requiring low cognitive overhead.
  *   **Layer 2 (Institutional):** Role-based contribution to a corporate agent (Board, Consortium). This is evolutionary new, requiring normative structures but allowing for low psychological overlap among participants.

  Your intuition that the Consortium is *not* joint action suggests you are prioritizing Layer 1 criteria even for Layer 2 cases (i.e., you want scientists to *feel* like a team, not just *act* like one). Your intuition about the Board suggests you recognize Layer 2 can sustain agency even when Layer 1 is absent. The most coherent account accepts that "Joint Action" is an ambiguous term spanning these two layers, and that the **Rescue Chain** and the **Board** are joint actions in fundamentally different senses.
