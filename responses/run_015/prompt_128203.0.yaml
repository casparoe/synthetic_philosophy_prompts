  **Scene:** *The Senior Common Room of a venerable Oxford college. Rain lashes against the mullioned windows. PROFESSOR ALISTAIR CROFT (Mathematics) sits opposite DR. REGINALD VAUGHN (Bursar). A decanter of port sits between them, alongside two distinct contracts.*

  **CROFT:** I say, Vaughn, regarding the proposed endowment wager. I have drafted the standard St. Petersburg instrument. The payoff doubles with each toss until heads appears.

  **VAUGHN:** *(Glancing at the paper, then setting it down firmly)* I cannot sign this, Alistair. The expected value diverges to positive infinity. My indemnity insurance caps at £10 billion. Infinity voids the policy. It is unbounded growth; quite literally, it is too much money to exist.

  **CROFT:** Naturally, I anticipated such fiscal prudence. Hence, I have prepared an alternative. The Pasadena variant. The payoffs alternate in sign and scale as $(-1)^{n-1} 2^n / n$.

  **VAUGHN:** *(Perking up, reaching for a pen)* Ah. The alternating harmonic series. The expectation is undefined, is it not?

  **CROFT:** Precisely. Due to conditional convergence, the sum depends entirely on the ordering of the states. By the Riemann Rearrangement Theorem, the expectation can be made to converge to any real number, or indeed diverge to either positive or negative infinity. It possesses no unique value.

  **VAUGHN:** *(Signing enthusiastically)* Splendid. I shall take it.

  **CROFT:** *(Blinking)* I beg your pardon? You just rejected the St. Petersburg game because the liability was infinite. You must appreciate that the Pasadena game can be rearranged to demonstrate an infinite loss just as readily.

  **VAUGHN:** Yes, but only *if* rearranged, Alistair. The St. Petersburg expectation is *intrinsically* infinite. It is a property of the series itself. The Pasadena expectation is merely… indeterminate.

  **CROFT:** Indeterminacy in decision theory is generally considered worse than infinity. It violates state-wise dominance.

  **VAUGHN:** Perhaps mathematically. But fiscally? Infinity is a number. It appears on a balance sheet as a breach of covenant. 'Undefined', however, is not a number. It is a status.

  **CROFT:** And how do you propose to settle a debt of 'undefined' status?

  **VAUGHN:** *(Tucking the contract into his jacket)* I do not settle it, old chap. I carry it forward. Infinity requires reserves; undefined requires only a calculator that has been left in the other room. Besides, until you specify an ordering, the liability is notional. And I do not honour notional liabilities.

  **CROFT:** But if I choose the ordering that diverges to negative infinity…

  **VAUGHN:** Then you shall have to wait until the end of time to collect. And by then, the college will have been sold to developers. Infinity is a solvency issue, Alistair. Undefined is merely a clerical error. And I have many clerks.

  *(Vaughn raises his glass. Croft stares at the alternating series, realising he has just been outmanoeuvred by a lack of convergence.)*

  **VAUGHN:** To ambiguity. It is the only finite thing left in economics.
