  # Freqently Asked Questons

  **Welcome to the Afterlife Continuation Foundation (ACF).** Below you will find clarifications regarding our Existential Insurance policies, coverage stipulations, and actuarial methodologies. Please review these terms before purchasing coverage for your projects, lineage, or cultural contributions.

  **Q: What exactly does Existential Insurance cover?**
  A: Standard life insurance compensates beneficiaries upon your biological death. ACF policies compensate for the death of *context*. Our research indicates that the value of your current endeavors—writing a book, raising a child, curing a disease—is contingent upon the existence of future generations to witness, utilize, or appreciate them. If humanity undergoes total extinction, the value of those projects drops to zero. Our policy insures against this loss of value.

  **Q: What happens to my half-finished symphony if everyone dies?**
  A: This falls under our "Continuity Dispute" clause. Upon verification of human extinction, the ACF assumes custodial rights to all insured intellectual property. We will attempt to complete the symphony using algorithmic composition models trained on your previous work. If no sentient life remains to hear the performance, the policy pays out the calculated "Shadow Value" to your designated estate. Please note: payouts are contingent on there being a financial system capable of processing them.

  **Q: Do I get a refund if aliens inherit Earth and keep culture running?**
  A: Generally, no. Our mandate is the preservation of *value*, not specifically *human* biology. If a successor species inherits Earth and demonstrates an appreciation for human culture (e.g., they perform your symphony), continuity is considered maintained. A refund is only issued if the successor species actively destroys human artifacts or lacks the cognitive capacity to perceive them. You may purchase the "Anthro-Exclusive" rider for an additional premium, which voids coverage if non-humans enjoy your work.

  **Q: How do you calculate the "Shadow Value" of futures I won't live to see?**
  A: Our actuaries use a Discounted Future Utility model. We assess the potential number of future observers, their probable engagement levels, and the cultural longevity of your specific project. For example, a pop song has a high immediate value but rapid depreciation. A mathematical proof has a lower immediate value but higher longevity. We then apply an Existential Risk Factor based on current geopolitical and environmental stability. This yields your premium. Essentially, you are paying us to acknowledge that your life matters only if someone else is there to see it.

  **Q: Have you actually secured a post-human successor species to ensure continuity?**
  A: No. To date, the ACF has not successfully identified, contacted, or bred a successor species capable of assuming stewardship of human culture. This is currently classified as an "Administrative Pending" matter. However, our policies remain valid based on the *probability* of continuity. We believe in hedging against the void, even if the hedge itself is currently theoretical.

  **Q: Why does the value of my present life depend on a future that might not exist?**
  A: That is not a question for Customer Support. That is a question for your policyholder agreement, Section 4, Paragraph 1: "The Insured acknowledges that meaning is extrinsic and temporally dependent." If you find this clause distressing, we recommend upgrading to the "Solipsist Tier," which insures only your immediate sensory experience, though this offers no payout upon extinction.

  ***

  *The Afterlife Continuation Foundation is a 501(c)(3) nonprofit organization. All premiums are non-refundable in the event of total ontological collapse. We are working hard to ensure there is someone left to pay your claims.*
