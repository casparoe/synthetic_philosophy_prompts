answer: |-
  The tension you have identified is central to the divergence between Peirce's scientific realism and James's radical empiricism. Your colleague is correct that this passage in "How to Make Our Ideas Clear" (HMIC) is a pivot point, but the dilemma you pose—strict observationalism versus a collapse into Jamesian voluntarism—rests on a specific ambiguity in what Peirce means by "originate" and "facts of observation."

  To resolve this without flattening the distinction between Peirce and James, we must parse the "machinery" metaphor not as a constraint on the *procedures* of inquiry (which can be institutional and normative), but as a constraint on the *source of cognitive compulsion*.

  ### 1. The Logic of the Machinery Metaphor
  Peirce's critique of Leibniz in this passage relies on a thermodynamic analogy. He argues that the mind is a mechanism that transforms energy (knowledge) but cannot create it.
  *   **Descartes's Error:** He assumed the mind could generate fundamental truths from within (introspection/apriority). Peirce classifies this in "The Fixation of Belief" as the *A Priori Method*, where belief is fixed by what is "agreeable to reason." Peirce rejects this because "reason" without external input is merely taste or fashion; it lacks a brake.
  *   **Leibniz's Partial Success:** Leibniz realized the mind cannot be a *perpetual motion machine*. It requires input.
  *   **The Crucial Constraint:** The input must be "facts of observation."

  The critical question is whether "facts of observation" functions as a narrow empiricist constraint (sense data only) or a broader pragmatic one (anything that forces itself upon the inquirer). If it is the latter, can "volitional commitment" count as a fact that forces itself upon us?

  ### 2. Defining "Facts of Observation" in Peirce's 1878 Context
  In the 1877–1878 *Popular Science Monthly* series, Peirce is not advocating for a positivist reduction of facts to sense data. Instead, he is defining facts by their **resistance**.

  In "The Fixation of Belief," Peirce establishes that the irritation of doubt arises from a surprise in experience. This surprise is the mark of the "external permanency"—that which is not up to us. When Peirce says the machinery of the mind cannot originate knowledge unless fed with facts of observation, he is asserting that the *content* of belief must be anchored in something that the will cannot alter.

  Therefore, "facts of observation" should be read as **instances of Secondness** (to use his later terminology, though the concept is present here): the brute compulsion of experience.
  *   **Strict Observationalism?** No. It does not mean only visual or auditory data. It means any element of experience that exhibits *independence from the thinker*.
  *   **Institutional Protocols?** An institutional protocol (e.g., "we accept testimony from credentialed experts") can be a *rule of transformation* within the machinery. It is part of the gear system. But it cannot be the *fuel*. The protocol itself must be justified by its observational success (does following this protocol lead to predictions that withstand the test of experience?).

  ### 3. The Boundary with James
  This is where the line with James must be drawn. Your worry is that if "facts" include "internal commitments," James's volitional choices could count as inputs. However, Peirce's machinery metaphor blocks this move through the distinction between **transformation** and **origination**.

  **James's Position:**
  In "The Will to Believe," James argues that in specific epistemic gaps (live, forced, momentous options where evidence is insufficient), the passional nature (volition) is permitted to **decide the proposition**. For James, the will can legitimately tip the scale of belief *regarding the truth of the matter*. The volition acts as a surrogate for evidential closure.

  **Peirce's Position (via the HMIC passage):**
  For Peirce, the will can regulate the **conduct of inquiry**, but it cannot determine the **settlement of belief** regarding matters of fact.
  *   **Volition as Protocol (Permissible):** You can *choose* to adopt a method of inquiry (e.g., "I will commit to the scientific method"). This is a volitional act that sets the machinery in motion. Peirce accepts this; it is the choice to avoid the methods of tenacity, authority, or a priority.
  *   **Volition as Input (Impermissible):** You cannot *choose* a belief as a "fact" to feed the machinery. If you feed the mind a volitional commitment as if it were an observational fact, you are attempting to create perpetual motion. You are trying to originate knowledge without external compulsion.

  **The Collapse Scenario:**
  If you interpret "facts of observation" broadly enough to include Jamesian volitional commitments, you collapse Peirce into James. But Peirce's text prevents this because he defines the necessary input by its **capacity to correct the mind**.
  *   A Jamesian volitional commitment is not corrigible by external experience in the same way. It is adopted *because* evidence is lacking.
  *   A Peircean fact of observation is adopted *because* it compels assent regardless of volition.

  ### 4. Reconciling the Institutional Architecture
  You are writing on the "institutional architecture of belief-fixation." This passage supports a specific architectural division of labor:

  1.  **The Foundation (Observation):** The "facts of observation" are the non-negotiable anchors. These are the points where the community encounters the resistant reality. No amount of social protocol can vote these away. This preserves Peirce's realism against James's humanism.
  2.  **The Machinery (Institution/Protocol):** The "machinery of the mind" (and by extension, the communal institution of science) is where norms, logic, and dialectical examination (referenced in the Descartes critique) operate. This is where the "will" operates—not to fix belief directly, but to maintain the integrity of the machinery.

  Peirce's critique of Descartes in this passage highlights that "clearness" is not enough; ideas must survive "dialectical examination." This examination is an institutional/social process. However, that process is useless unless the participants are feeding it "facts of observation."

  ### 5. Conclusion: The Coherent Reading
  There is a coherent reading that allows non-observational sources (like norms and protocols) without reducing Peirce to James. It requires distinguishing between the **authority of the method** and the **authority of the fact**.

  *   **James** grants the will authority over the **fact** (in the absence of evidence).
  *   **Peirce** grants the will (and the community) authority over the **method**, but subordinates both to the **fact**.

  In the HMIC passage, when Peirce says the mind cannot originate knowledge unless fed with facts of observation, he is ruling out the Jamesian move of treating a volitional need as a cognitive input. The "facts" must be of a nature that can *stop* the inquiry (temporarily) by satisfying the irritation of doubt. A volitional commitment does not stop doubt; it suppresses it.

  Therefore, your dissertation can maintain that Peirce's communal account accommodates normative framing (the architecture of the machinery) but excludes volitional belief-fixation (the fuel). The "facts of observation" are not limited to sense data, but they are strictly limited to **compulsive experiences independent of the inquirer's desire**. This preserves the Peircean anchor: the community converges not because they will to agree, but because they are all being pushed by the same external facts. James allows the will to push; Peirce insists the will must only steer.
