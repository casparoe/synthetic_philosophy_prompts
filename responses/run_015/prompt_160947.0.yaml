      *   **Constraint:** No citations. Just the argument. Avoid "it's all Goodhart's Law."

  2.  **Analyze Task 1: The Implicit Theory of Wellbeing.**

      *   *The Measure:* It's the Cantril Ladder (Life Evaluation). It asks for a cognitive judgement, not a mood report.
      *   *Presupposition 1: Evaluativism.* The practice strictly presupposes that wellbeing consists in (or is best proxied by) a conscious, reflective *judgement* about one's life as a whole. This rules out strict Hedonism (which cares about raw feel) as the *primary* target, though they might correlate. It also rules out pure Objective List theories that ignore the subject's endorsement (e.g., "You have health and wealth, you are well, even if you hate it").
      *   *Presupposition 2: Subjective Sovereignty.* The individual is the sole authority on their own score. The state cannot say "You rated this 6, but objectively it's an 8."
      *   *Presupposition 3: Interpersonal Comparability (Cardinal).* To average scores and compare nations, the practice *must* assume that a "7" in Country A is roughly comparable to a "7" in Country B. This is a huge philosophical leap (the "problem of interpersonal utility comparisons"). The practice *presupposes* this works well enough, even if philosophers debate it.
      *   *Presupposition 4: Aggregation.* It assumes the mean is the right metric. This implies a form of Utilitarianism (sum/average welfare), ignoring distribution unless specified otherwise.
