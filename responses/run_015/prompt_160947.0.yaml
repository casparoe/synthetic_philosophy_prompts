          *   *The "Top the Table" Drive:* If the metric is affect, being #1 is still prestige. But affect is harder to "game" via cognitive reframing (Proposal 1 & 2 become less effective). You can't think your way out of a headache as easily as you can lower your expectations.
      *   *Prestige vs. Wellbeing:* The desire to be #1 is almost certainly prestige. Wellbeing maximization stops when the marginal cost of improvement exceeds the benefit. Ranking maximization stops only when you beat the other guy. It incentivizes relative gain over absolute gain.

