answer: |-
  The weirdness you are feeling comes from a category error between *measurement* and *ontology*. The practice treats a specific measurement tool (the Cantril Ladder) as if it were the definition of the thing itself (Wellbeing). This collapses the distinction between the map and the territory. To reconstruct the implicit theory and test your proposals, we need to separate what the practice *must* assume to function from what it merely *hopes* is true.

  ### 1. The Implicit Theory: Evaluative Subjectivism with Cardinal Aggregation

  The practice strictly presupposes a specific view of wellbeing, which we can call **Evaluative Subjectivism**.

  **Strict Presuppositions:**
  1.  **Sovereignty of Judgement:** Wellbeing consists in (or is perfectly proxied by) the subject's own reflective assessment of their life. The state cannot overrule a citizen's "7" and say it is objectively a "5." This rules out strong Paternalistic Objectivism (where the state knows your good better than you) as a primary policy driver.
  2.  **Cardinal Interpersonal Comparability:** To average scores and create a league table, the practice *must* presuppose that a "7" in Finland is comparable to a "7" in Costa Rica. Philosophically, this is notoriously difficult (the problem of other minds), but the institution acts as if it is solved. Without this, the mean is meaningless.
  3.  **Temporal Stability:** It assumes the judgement reflects a stable state of affairs, not a transient mood. This is why it asks about "life as a whole" rather than "right now."

  **What It Rules Out:**
  *   **Strict Hedonism:** If wellbeing were purely moment-to-moment affect (pleasure minus pain), this metric is invalid. A person could be in constant low-grade pain but rate their life highly because they value their suffering (e.g., a monk or a struggling artist). The practice treats the *evaluation* as the good, not the *feeling*.
  *   **Pure Objective List:** If wellbeing were purely about having health, knowledge, and friendship regardless of attitude, the survey is redundant. The practice rules out the idea that you can be well-off while rating your life poorly.

  **What Is Underdetermined (Compatible but not Required):**
  *   **Desire Satisfaction:** A desire theorist can sign off, provided the "best possible life" anchor represents satisfied desires.
  *   **Distribution:** The practice defaults to the **Mean**. This implies Classical Utilitarianism (maximize total/average). It does not strictly presuppose Prioritarianism (weight the worst off) or Sufficientarianism (ensure everyone is above a threshold), though a wellbeing office *could* adopt those without breaking the measurement. The averaging is a bureaucratic default, not a philosophical necessity.

  ### 2. The Cheating Test: Proposals 1, 2, and 3

  Does the implicit theory have the resources to call these "cheating"? The answer depends on whether you define cheating as "violating the measurement protocol" or "violating the spirit of wellbeing."

  **Proposal 1: Shifting Expectations (The Anchor)**
  *   *The Move:* Public messaging convinces people that a "10" is more modest, or that their current "5" is actually quite good.
  *   *The Theory's Verdict:* **Legitimate.** Under Evaluative Subjectivism, wellbeing *is* the judgement. If you change the judgement, you have changed the wellbeing. The theory lacks the resources to distinguish between "contentment" and "resignation." This is the **Adaptive Preference** problem. If a population lowers its aspirations to match its oppression, the score goes up. The implicit theory calls this an improvement.
  *   *Your Intuition:* You feel this is cheating because you likely hold a **Capability Theory** view (wellbeing is what you are able to do and be, regardless of satisfaction). To call Proposal 1 cheating, you must import an objective metric (e.g., income, freedom, health) that exists outside the self-report. The wellbeing office, strictly speaking, cannot call this cheating without contradicting its own foundational metric.

  **Proposal 2: Changing Reference Groups**
  *   *The Move:* Segregate communities or control media so people compare themselves to poorer neighbors rather than richer ones.
  *   *The Theory's Verdict:* **Legitimate (but fragile).** Life evaluation is inherently comparative. If the theory accepts the subject's judgement as sovereign, it must accept the context that forms that judgement. Isolating people to improve their relative standing improves their *evaluated* wellbeing.
  *   *The Catch:* This is unstable. Information leaks. But philosophically, the implicit theory cannot condemn this. It treats social comparison as a fact of psychology, not a distortion of truth. To call this cheating, you again need an objective standard of "deserved" comparison or absolute standing.

  **Proposal 3: Shrinking the Denominator (Emigration/Exclusion)**
  *   *The Move:* Make it easy for the unhappy to leave, or stop counting residents who are hard to help.
  *   *The Theory's Verdict:* **Cheating.** This violates the **Population Integrity** presupposition. The metric is "National Wellbeing." The "Nation" is defined by residency/citizenship. If you change the population to raise the average, you are not raising the wellbeing of the nation; you are replacing the nation.
  *   *Why it differs:* Proposals 1 and 2 change the *internal* variable (the score) while keeping the *external* variable (the people) constant. Proposal 3 changes the *external* variable. The implicit theory presupposes a fixed moral community over which the government has stewardship. Abandoning the unhappy violates the stewardship obligation inherent in a "National" office.

  ### 3. The Ranking Problem and the Affect Switch

  **Should a country want to top the table?**
  No. Wanting to top the table is **Prestige Maximization**, not Wellbeing Maximization.
  *   **Wellbeing is Absolute:** If your score goes from 7.0 to 7.5, your citizens are better off, regardless of what Norway did.
  *   **Ranking is Zero-Sum:** If you improve from 7.0 to 7.5, but Norway improves from 7.4 to 8.0, you have failed the ranking target despite succeeding at the wellbeing target.
  *   **The Conflict:** If the policy target is "Top 5," the government is incentivized to sabotage competitors or ignore absolute gains that don't change relative position. This is a category error. The office should target a *score threshold* (e.g., "90% of citizens above 7"), not a *rank*.

  **Switching to Experienced Affect (Hedonism)**
  If you swap the implicit theory from Evaluative Subjectivism (Life Satisfaction) to **Experienced Affect** (Moment-to-Moment Feeling):

  1.  **Concrete Changes in Practice:**
      *   **Measurement:** You stop asking "How is your life?" and start asking "How did you feel yesterday?" (Day Reconstruction Method) or use experience sampling (pinging phones).
      *   **Policy Levers:** You shift from long-term structural investments (education, career pathways) to immediate friction-reduction. Commute times, pain management, wait times in bureaucracy, and noise pollution become higher priority than GDP or liberty.
      *   **Vulnerability to Gaming:** Proposal 1 (Expectations) becomes much harder. You cannot think your way out of a headache or a stressful commute. Proposal 2 (Reference Groups) matters less, because affect is more physiological and situational than cognitive.
      *   **What Stops:** You can no longer justify long-term sacrifice. "Suffer now for a better future" is a life-evaluation strategy (I am building a good story), but it is an affect-disaster (I am feeling bad now). An Affect office would struggle to justify war, harsh economic restructuring, or even intense athletic training, as these lower net positive affect in the short term.

  2.  **Is "First Place" Wellbeing?**
      *   Under Affect, being #1 is still prestige. But an Affect theory reveals the absurdity of the ranking more clearly. Pain is not competitive. If my citizen has a toothache, it doesn't matter if your citizen has a broken leg.
      *   The desire to be first is almost entirely **National Prestige wearing a Wellbeing Costume**. It uses the moral authority of "caring about people" to pursue status goods (ranking). A genuine wellbeing maximizer would be happy to share their secret sauce if it meant everyone got to 8.5, even if they dropped to 10th place. A ranking maximizer hides the secret sauce to stay 1st.

  ### Summary of the Argument

  The practice presupposes that **Wellbeing = Reflective Satisfaction**. This makes it vulnerable to "Happy Slave" scenarios (Proposals 1 & 2), which the theory cannot internally classify as cheating because, by its own lights, the slave *is* happier if he says he is. It can only classify Proposal 3 (exclusion) as cheating because it violates the boundary of the moral community being measured.

  The drive to be #1 is a corruption of the theory. Wellbeing is non-rivalrous; ranking is rivalrous. By targeting the rank, the government implicitly shifts from a Utilitarian goal (maximize total good) to a Status goal (maximize relative standing).

  If you want to stop the "weirdness," you must decouple the **Score** (absolute wellbeing) from the **Rank** (prestige). And you must acknowledge that Life Evaluation metrics measure *adaptation* as much as they measure *condition*. If you want to prevent Proposal 1 and 2 from counting as "success," you must hybridize the theory: adopt a **Capability Constraint**. You can only count the satisfaction score as valid if certain objective thresholds (rights, income, health) are met. Without that external anchor, the wellbeing office is just managing expectations, not lives.
