answer: |-
  Your diagnosis is correct; there is no genuine question about mathematical objects that survives once the epistemological and semantic disputes are bracketed.

  The impasse is best classified as a substantive metaphysical disagreement in disguise, where the substance lies not in the mathematical realm but in the choice of competing general philosophical frameworks. It is not merely a verbal dispute about "exists," because the stakes involve the legitimacy of scientific realism and the structure of truth theories, nor is the disagreement idle, since it dictates how we interpret the success of science. Nor are they simply two research programs answering different questions; both sides explicitly aim to answer "Do numbers exist?" but they employ incompatible criteria for what counts as a satisfactory answer. The platonist prioritizes semantic uniformity and theoretical indispensability (following Quine), treating ontology as a byproduct of our best total theory, while the anti-platonist prioritizes causal-naturalistic epistemology (following Field), treating ontology as constrained by human cognitive access. Because each side treats their preferred desideratum as a non-negotiable constraint on philosophy itself, they talk past one another: the platonist sees the nominalist as violating semantic common sense, and the nominalist sees the platonist as violating epistemological naturalism.

  Both sides agree entirely on the internal mathematics—theorems, proofs, and methods—demonstrating that the disagreement is not about mathematical fact but about the meta-philosophical interpretation of that fact. The platonist argues that the truth of "there are infinitely many primes" literally requires primes to exist because that is how truth works in general discourse; the anti-platonist argues that the truth of "there are infinitely many primes" must be reconstrued or error-theorized because that is how knowledge works in general cognition. Since neither side can compel the other to abandon their general epistemological or semantic commitments without begging the question, there is no fact of the matter internal to mathematics that can adjudicate the dispute. The "existence" of numbers is not a hidden property waiting to be discovered but a theoretical posit whose validity depends entirely on which general framework one adopts.

  Progress on the specific question "Do numbers exist?" is not to be expected, because the question presupposes a neutral ground that does not exist. Genuine progress would instead come from meta-ontology: either developing a deflationary account of existence that dissolves the tension by showing ontological claims are framework-relative, or achieving a breakthrough in general epistemology that reconciles causal constraints with semantic uniformity across all domains, not just mathematics. Until philosophy resolves whether knowledge requires causal contact or whether truth requires ontological commitment in general, the philosophy of mathematics will remain a proxy war for these deeper, unresolved issues.
