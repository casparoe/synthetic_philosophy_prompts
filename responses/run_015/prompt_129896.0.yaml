prompt: |-
  I direct a grant program that funds joint empirical research between groups that are publicly and sharply opposed on high-stakes policy questions—for example, collaborations between climate economists who favor carbon pricing and community organizers who oppose those instruments on equity and procedural grounds, or partnerships between AI safety researchers advocating pre-deployment evaluation mandates and open-source advocates who treat such mandates as regulatory capture by incumbents. Before committing funds, my board needs a reusable decision procedure to determine whether both sides are arguing in good faith in a sense strong enough to make collaboration intellectually productive rather than merely performative. The procedure should be grounded in the philosophical distinction between doxastic openness—genuine willingness to revise one’s beliefs in light of evidence—and dialectical openness—willingness to represent the opposing view in terms that its own proponents would recognize as accurate—while also accounting for the structural problem that echo chambers and institutional filtering can produce sincere participants who nevertheless systematically misrepresent counterevidence and opposing arguments. Please construct a step-by-step checklist that my reviewers, who are not philosophers, can run in approximately thirty minutes per proposal; specify the ordered questions, what counts as a sufficient answer at each stage, the explicit stopping points where the procedure returns “do not fund,” and the points where judgment cannot be eliminated and must be referred to a senior board member for a values-based sign-off. The procedure must handle the hard case in which one side is individually sincere but embedded in an institutional environment that filters out disconfirming information—what might be called structural bad faith—and must include two worked applications: first, to a proposed collaboration between carbon-tax proponents and their equity-focused critics, and second, to a proposed partnership between AI alignment researchers and open-source advocates. Include at least one case where the procedure yields an answer the board will find unwelcome, and conclude by stating explicitly what the procedure cannot determine, such as whether good faith guarantees productive outcomes or whether hidden strategic motives are present.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a reusable decision procedure (checklist) for a grant program funding joint empirical research between opposed groups (e.g., climate economists vs. community organizers, AI safety vs. open-source).
      *   **Purpose:** Determine if both sides are arguing in "good faith" enough to make collaboration intellectually productive (not performative).
      *   **Key Concepts:**
          *   *Doxastic Openness:* Willingness to revise beliefs based on evidence.
          *   *Dialectical Openness:* Willingness to represent opposing views accurately (Steel-manning).
          *   *Structural Bad Faith:* Sincere individuals embedded in echo chambers/institutions that filter disconfirming info.
      *   **Constraints:**
          *   Step-by-step checklist.
          *   Usable by non-philosopher reviewers in ~30 minutes.
          *   Specify ordered questions, sufficient answers, stopping points ("Do Not Fund"), and escalation points (Senior Board Sign-off).
          *   Must handle the "structural bad faith" hard case.
          *   Include two worked applications (Carbon Tax, AI Safety).
          *   Include at least one "unwelcome" outcome (procedure rejects a popular/plausible proposal).
          *   Conclude with limitations (what the procedure *cannot* determine).

  2.  **Deconstruct the Philosophical Framework:**
      *   *Doxastic Openness* is internal. Hard to measure directly. Needs behavioral proxies (e.g., past revisions, methodology design).
      *   *Dialectical Openness* is external/linguistic. Easier to measure (e.g., how they describe the other side in the proposal).
      *   *Structural Bad Faith* requires looking beyond the individual to their ecosystem (funding sources, publication history, network homogeneity).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* Ask if they like each other. Ask if they will change their minds. Ask if they understand the other side.
      *   *Critique 1:* Too vague. Reviewers need concrete criteria.
      *   *Attempt 2 (Adding Specifics):* Look at past papers. Look at the proposal language. Check funding sources.
      *   *Critique 2:* Needs to be structured as a flow with stop points. Needs to address the "structural" issue specifically.
      *   *Attempt 3 (Refining for Time & Audience):* 30 minutes is tight. The checklist needs to be high-signal. Focus on the *proposal text* and *public track records*.
      *   *Structure:*
          *   Phase 1: Dialectical Check (Fast, textual).
          *   Phase 2: Doxastic Check (Track record, methodology).
          *   Phase 3: Structural Check (Echo chambers, incentives).
          *   Escalation/Stop points.

  4.  **Developing the Checklist Steps:**
      *   *Step 1 (Dialectical):* How do they describe the opposition? (Steel-man vs. Straw-man).
      *   *Step 2 (Doxastic):* What counts as falsification? (Pre-analysis plans, specific metrics).
      *   *Step 3 (Structural):* Where do they publish/get money? (Homogeneity check).
      *   *Stop Rules:* If Step 1 fails, stop. If Step 2 fails, stop. If Step 3 is ambiguous, escalate.

  5.  **Addressing "Structural Bad Faith":**
      *   This is the tricky part. A person can be sincere but blind.
      *   *Solution:* The procedure must ask if the *research design* forces exposure to disconfirming evidence, regardless of the researcher's intent. The methodology must break the echo chamber.

  6.  **Developing Worked Examples:**
      *   *Case 1 (Carbon Tax):* Economists vs. Organizers.
          *   *Scenario:* Economists want efficiency metrics; Organizers want procedural justice.
          *   *Outcome:* Let's make this one pass, but barely, requiring escalation on the structural point.
      *   *Case 2 (AI Safety):* Alignment vs. Open Source.
          *   *Scenario:* Safety wants evals; Open Source wants access.
          *   *Outcome:* Let's make this the "unwelcome" one. Maybe a high-profile collaboration that looks good but fails the dialectical test (e.g., one side uses loaded language like "reckless" without nuance).

  7.  **Refining the "Unwelcome" Outcome:**
      *   Boards often want to fund high-visibility names. If the procedure rejects a "star" collaboration because of poor dialectical representation, that's unwelcome but necessary. Let's use the AI case for this. It highlights that even "serious" people can fail the good faith test.

  8.  **Finalizing the Limitations:**
      *   Good faith $\neq$ Success.
      *   Hidden motives (strategic lying) can't be fully detected.
      *   The procedure doesn't judge the *truth* of the claims, only the *process*.

  9.  **Review against Constraints:**
      *   30 minutes? Yes, if focused on document review.
      *   Non-philosophers? Yes, avoid jargon where possible, define terms clearly.
      *   Stop points? Clearly marked.
      *   Escalation points? Clearly marked.
      *   Structural bad faith? Addressed in Step 3.
      *   Two examples? Included.
      *   Unwelcome result? Included (AI case).
      *   Limitations section? Included.

  10. **Polishing the Tone:**
      *   Needs to be administrative, precise, and neutral.
      *   Ensure the distinction between Doxastic and Dialectical is clear in the instructions.

  11. **Self-Correction during drafting:**
      *   *Issue:* Is 30 minutes enough for a structural check?
      *   *Fix:* Limit the structural check to specific, quick indicators (e.g., last 3 publications, primary funding source) rather than a full sociological audit.
      *   *Issue:* How to define "sufficient answer"?
      *   *Fix:* Use "Pass/Fail/Escalate" criteria for each question.

  12. **Final Polish:** Check the flow. Ensure the "Structural Bad Faith" concept is integrated into Step 3 specifically, as that's where individual sincerity meets institutional constraint. (Self-correction: Make sure the distinction between individual sincerity and structural filtering is clear in the instructions).

  13. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Bipartisan Empirical Collaboration (BEC) Good-Faith Protocol
  **Version 1.0 | For Internal Review Use Only**

  ## Purpose
  This procedure assists reviewers in assessing whether proposed collaborations between opposed policy groups possess the necessary conditions for intellectually productive research. It distinguishes between **Dialectical Openness** (accurate representation of the opponent) and **Doxastic Openness** (willingness to revise beliefs), while accounting for **Structural Bad Faith** (sincere individuals constrained by echo chambers).

  **Time Allocation:** Approximately 30 minutes per proposal.
  **Reviewer Profile:** Program staff or external reviewers (non-philosophers).
  **Required Materials:** The grant proposal, CVs of Principal Investigators (PIs), and links to 3 recent public statements/papers per PI.

  ---

  ## Part I: The Decision Checklist

  ### Phase 1: Dialectical Openness (The Representation Test)
  *Focus: Does the proposal describe the opposing view in terms its proponents would accept?*

  **Q1.1: The Characterization Check**
  Read the section of the proposal where each team describes the *other* team's primary concern or objection.
  *   **Pass:** The description uses neutral or internal terminology (e.g., "They argue X because of Y principle") rather than external dismissal (e.g., "They claim X due to misinformation/interest groups").
  *   **Fail:** One side describes the other's motivation as primarily malicious, ignorant, or captured without evidence provided in the text.
  *   **Action:** If **Fail**, stop. **Recommendation: Do Not Fund.** (Reason: Performative collaboration).

  **Q1.2: The Steel-Man Clause**
  Does the proposal explicitly list at least one scenario in which the *opposing* side's policy preference would be validated by the empirical results?
  *   **Pass:** Yes, specific conditions are listed (e.g., "If data shows Z, the Community Organizers' model is preferred").
  *   **Fail:** No, the success metrics are unidirectional (only one side can "win").
  *   **Action:** If **Fail**, stop. **Recommendation: Do Not Fund.** (Reason: Research is rigged).

  ### Phase 2: Doxastic Openness (The Revision Test)
  *Focus: Is there a mechanism for belief revision based on evidence?*

  **Q2.1: The Falsification Metric**
  Does the methodology include a pre-analysis plan or specific thresholds that would compel *both* sides to publicly acknowledge a shift in their position?
  *   **Pass:** Yes, specific numerical or qualitative thresholds are agreed upon in advance.
  *   **Fail:** No, the outcomes are vague (e.g., "we will explore the data") or allow for post-hoc rationalization.
  *   **Action:** If **Fail**, stop. **Recommendation: Do Not Fund.** (Reason: No commitment to evidence).

  **Q2.2: The Track Record Check**
  Review the 3 most recent publications/public statements for each PI. Has either PI publicly updated a view or acknowledged error in the last 5 years?
  *   **Pass:** At least one instance of nuance, correction, or acknowledged limitation found for both PIs.
  *   **Fail:** Both PIs show a record of absolute consistency with no acknowledged errors or evolving positions.
  *   **Action:** If **Fail**, proceed to **Escalation Point A**. (Reason: Possible structural rigidity).

  ### Phase 3: Structural Bad Faith (The Echo Chamber Test)
  *Focus: Are sincere individuals embedded in systems that filter disconfirming information?*

  **Q3.1: The Information Diet**
  Do the PIs cite or engage with literature from the *opposing* ecosystem in their recent work (e.g., does the carbon-tax economist cite equity-focused sociological critiques)?
  *   **Pass:** Yes, opposing literature is cited and engaged with substantively.
  *   **Fail:** No, citations are homogenous (only within their own ideological silo).
  *   **Action:** If **Fail**, proceed to **Escalation Point B**. (Reason: High risk of structural bad faith).

  **Q3.2: The Incentive Alignment**
  Does the proposal include a dissemination plan that requires presenting findings to the *opposing* side's constituency, not just the funder's or their own?
  *   **Pass:** Yes, joint town halls, op-eds, or briefings with opposing stakeholders are budgeted.
  *   **Fail:** No, dissemination is limited to academic journals or friendly policy think tanks.
  *   **Action:** If **Fail**, proceed to **Escalation Point B**.

  ---

  ## Part II: Escalation and Stopping Rules

  ### Automatic Stop (Do Not Fund)
  If **Q1.1** or **Q1.2** or **Q2.1** is marked **Fail**, the reviewer must recommend **Do Not Fund**. No further review is necessary. These indicate a lack of basic good faith or methodological integrity.

  ### Escalation Point A (Senior Board Sign-Off Required)
  Triggered by **Q2.2 Fail** (No track record of revision).
  *   **Issue:** The individuals may be sincere but dogmatic.
  *   **Board Decision:** The Board must decide if the *methodology* (Q2.1) is strong enough to force revision even if the individuals are historically rigid.
  *   **Value Judgment:** Is the potential empirical gain worth the risk of entrenched dogma?

  ### Escalation Point B (Senior Board Sign-Off Required)
  Triggered by **Q3.1** or **Q3.2 Fail** (Structural/Echo Chamber risks).
  *   **Issue:** This is the **Structural Bad Faith** hard case. The PIs may be personally honest but institutionally blinded.
  *   **Board Decision:** The Board must decide if the grant itself can serve as an *intervention* to break the echo chamber.
  *   **Value Judgment:** Should we fund this *in order to* force structural openness, or is the risk of co-optation too high?

  ---

  ## Part III: Worked Applications

  ### Case 1: Carbon Pricing Collaboration
  **Proposal:** A joint project between a Neoclassical Economist (Pro-Carbon Tax) and a Community Organizer (Anti-Carbon Tax, Pro-Direct Investment).
  **Reviewer Notes:**

  *   **Q1.1 (Characterization):** **Pass.** The Economist describes the Organizer's view not as "anti-science" but as "prioritizing distributive outcomes over efficiency." The Organizer describes the Economist's view as "seeking scalable levers" rather than "corporate appeasement."
  *   **Q1.2 (Steel-Man):** **Pass.** Both agree that if the tax leads to a >5% regressive burden on the bottom quintile without rebate, the Organizer's direct investment model is empirically superior for that metric.
  *   **Q2.1 (Falsification):** **Pass.** Pre-analysis plan registered.
  *   **Q2.2 (Track Record):** **Pass.** Economist recently published a caveat on distributional effects; Organizer recently acknowledged successful pilot programs in jurisdictions with pricing.
  *   **Q3.1 (Information Diet):** **Fail.** The Economist's last 3 papers cite only other economists. The Organizer's public statements cite only advocacy reports.
  *   **Q3.2 (Incentive):** **Pass.** They plan joint town halls in the affected communities.

  **Result:** **Escalation Point B.**
  **Reviewer Recommendation:** Fund *contingent on Board approval*.
  **Rationale:** The individuals pass the sincerity tests (Phase 1 & 2), but they operate in silos (Phase 3). This is a classic **Structural Bad Faith** risk. The Board must decide if funding this collaboration is a viable strategy to break their respective information silos, or if the lack of cross-citation suggests they will talk past each other despite good intentions.

  ### Case 2: AI Safety & Open Source Partnership
  **Proposal:** A partnership between a Leading AI Safety Researcher (Pro-Evaluation Mandates) and a Prominent Open Source Advocate (Anti-Regulation).
  **Reviewer Notes:**

  *   **Q1.1 (Characterization):** **Fail.** The Safety Researcher's section describes the Open Source Advocate's position as "ignoring existential risk for the sake of ideological purity." The Advocate describes the Safety Researcher as "seeking monopoly control."
  *   **Q1.2 (Steel-Man):** **Fail.** The success metrics focus entirely on "risk reduction" (Safety win) or "innovation speed" (Open Source win) with no agreed metric for trade-offs.
  *   **Q2.1 (Falsification):** **Fail.** No pre-analysis plan; outcomes described as "policy recommendations."

  **Result:** **Automatic Stop (Do Not Fund).**
  **Reviewer Recommendation:** **Do Not Fund.**
  **Rationale:** This is an **unwelcome outcome** for the Board, as both PIs are high-profile and the topic is urgent. However, the proposal fails the Dialectical Openness test. The language indicates they view each other as adversaries to be defeated, not partners in inquiry. Funding this would likely result in performative conflict rather than empirical resolution. The structural incentives (media attention for conflict) outweigh the individual sincerity.

  ---

  ## Part IV: Limitations of the Procedure

  Reviewers and Board Members must acknowledge that this procedure **cannot** determine the following:

  1.  **Guarantee of Productivity:** A "Pass" on good faith does not guarantee the research will yield useful policy insights. Competent people in good faith can still produce null results or inconclusive data.
  2.  **Hidden Strategic Motives:** The procedure relies on textual and public record evidence. It cannot detect "dark money" influences or private agreements where a PI intends to sabotage the collaboration quietly to please a donor.
  3.  **Truth of Claims:** This protocol assesses the *process* of inquiry, not the *validity* of the underlying positions. A group arguing in bad faith might still be factually correct; a group arguing in good faith might be factually wrong.
  4.  **Future Drift:** A team may pass this checklist at the proposal stage but degrade into bad faith during the execution of the grant if external political pressures intensify.

  **Final Note to Board:** This tool is a filter for *collaborative viability*, not a validator of *policy correctness*. Use the Escalation Points to make value-based decisions on whether the program should attempt to repair structural divides (Case 1) or avoid high-profile dead-ends (Case 2).
