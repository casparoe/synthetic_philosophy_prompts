  **Gricean Misleading Decision Procedure**

  1.  **Literal Truth:** Is the statement factually false? If yes, **Lying**; stop (distinguishes lying from misleading).
  2.  **False Belief:** Did the customer form a specific false belief? If no, **No Action**; stop.
  3.  **Utterance Source:** Did specific words (not silence) trigger this? If no, **No Action**; stop (excludes silence as utterance).
  4.  **Cancellability:** Could the agent add "but not necessarily" without contradiction? If yes, **Misleading**; stop (handles true sentence/false takeaway).
  5.  **Reasonable Hearer:** Would an average customer infer this? If no, **No Action**; stop (ignores vulnerable/idealized extremes).
  6.  **Agency:** Was this a human choice or forced system output? If forced, **Hand Off** to Process Team (handles macros/AI).
  7.  **Policy:** Does the business owe clarity over brevity here? If unclear, **Hand Off** to Manager (values call).

  **Applications**

  (a) **Refund Queued:** "Processed" is literally true (queue entry) but generates implicature of completion. Step 4 (Cancellability): Adding "but might fail" contradicts "processed". **Verdict: Misleading.** This will sting; common industry language is flagged as deceptive implicature. You must coach against "processed" for queued items.

  (b) **Suspended Macro:** Agent chose "we'll look into it" for a suspended account. Step 1 (Literal Truth): Fails; no one will look. **Verdict: Lying.** Agent adopted false literal content via macro selection; cooperativeness violated. This is a warning, not coaching.

  (c) **AI Empathy:** "I understand" read as human responsibility. Step 5 (Reasonable Hearer): Average customer knows templates exist. Step 4: "Understand" is phatic, cancellable. **Verdict: No Action.** Phatic expressions lack truth-conditions; no misleading implicature generated.

  **Limitations & Fudges**

  1.  **Silence (Hard Case 1):** Step 3 excludes silence. Auto-closes creating false hope ("we're on it") are **Process Issues**, not agent misleading. Grice requires an utterance; silence is not one here. You cannot judge the 48-hour gap with this tool.
  2.  **AI/Macros (Hard Case 2):** Grice requires speaker meaning. Step 6 assigns meaning to the *sender*, not the drafter. If the agent didn't read the AI draft, agency is murky; this procedure assumes they did. If the system sends without human review, hand off.
  3.  **Vulnerable Hearers (Hard Case 3):** Step 5 uses an "average" customer. Second-language speakers or exhausted users may infer differently. We sacrifice protection for the most vulnerable to maintain a usable standard for agents. Indexing to actual hearers makes enforcement impossible.
  4.  **Dropped Distinctions:** I collapsed "generalized" vs "particularized" implicature. For your purposes, if the inference happens, it counts. I also ignored "off-record" hints; if it's not in the transcript, it didn't happen.
