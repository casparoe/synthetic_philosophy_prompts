      *   **Truth-Evaluable Unity:** This is the "propositional" problem. How does $aRb$ differ from $bRa$? How can it be false? A fact obtains; a proposition can fail to obtain.
      *   **Bradley's Intent:** Bradley was an absolute idealist. He wanted to show that relational thought is contradictory and leads to the Absolute. He wasn't just worried about grammar; he was worried about metaphysics. He thought relations *cannot* hold. So, for Bradley, the regress shows the *impossibility* of relations, not just a structural puzzle. This leans towards the *Binding* reading in a destructive sense, but ultimately aims at the unreality of the distinction between subject and predicate, implying the *Truth-Evaluable* aspect (representation of reality) fails because reality is non-relational. However, the prompt asks to distinguish between the regress as a compositional failure vs. an explanatory demand. Bradley thinks the composition *fails*, rendering the truth-claim illusory.
