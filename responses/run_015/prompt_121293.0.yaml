  Your package has a critical fracture at its foundation: you cannot simultaneously maintain ontological physicalism (8), accept Kim's argument as valid (2), deny causal closure locally (3), and deny overdetermination (7). By rejecting completeness only for mental cases (3), you are positing a physical effect (withdrawal) that lacks a sufficient physical cause, which directly contradicts ontological physicalism (8) and conservation laws. This isn't just ad hoc; it is interactionist dualism disguised as non-reductive physicalism. If physics is causally closed everywhere else, positing a exception specifically for brains violates the uniformity of nature required by (8).

  Secondary tension exists between your interventionism (5) and your non-identity claim (1). If mental properties are realized by neural properties, you cannot intervene on the mental without intervening on the neural. Woodwardian causation allows for higher-level causes, but only if the lower-level realizer doesn't screen off the causal relevance. If you insist mental properties are distinct (1) but causally efficacious (6) without overdetermination (7), interventionism struggles to distinguish the mental cause from the physical realizer without collapsing them into identity. Your "structural inheritance" (4) attempts to bridge this, but unless "constraint" is purely physical boundary conditioning, it looks like redundant causation, violating (7).

  To save the package, you must choose between being a physicalist or a non-reductivist. You can keep mental causation (6) intact, but not alongside distinct non-physical properties (1) and local closure denial (3). The most coherent revision is to accept causal closure globally (drop 3) and accept that mental properties are identical to neural properties (drop 1), or alternatively, accept systematic overdetermination (drop 7). Given your commitment to physicalism (8), dropping non-identity (1) is the logically consistent move, though it costs you non-reductive physicalism.

