answer: |-
  **Project Title:** The Inheritance of Reasons: A Compositional Stress Test for Fitting-Attitude Accounts

  **Project Summary**
  This project addresses the 'Wrong Kind of Reasons' (WKR) problem, a central obstacle for fitting-attitude accounts of value. While existing literature analyses reasons for atomic attitudes (belief, desire, admiration) in isolation, this project investigates 'composite attitudes' (hope, blame, trust) which are partly constituted by other attitudes. The core research question is the 'Inheritance Question': when a reason of the wrong kind bears on a constituent attitude, does it transmit to the composite attitude, and if so, does it retain its status as a wrong-kind reason? By subjecting leading WKR solutions to this compositional stress test, the project aims to discriminate between competing theories without invoking new first-order principles, thereby advancing the meta-ethical debate within a nine-month timeframe.

  **Background and Problem**
  Fitting-attitude accounts analyse value in terms of the reasons we have to adopt certain pro-attitudes towards an object. The WKR problem arises because agents can have reasons to hold an attitude that do not track the object's value. In standard threat cases, a tyrant threatens punishment unless you admire him. You have a reason to admire him, but this reason does not make him admirable. To save the theory, philosophers must distinguish reasons of the 'right kind' (those tracking value) from reasons of the 'wrong kind' (pragmatic incentives).

  The debate has largely proceeded attitude-by-attitude. Theories are designed and tested against atomic threat cases: a threat to desire, a threat to believe, a threat to admire. Consequently, three main families of solution have emerged: those distinguishing reasons by their source (object-given vs. state-given); those distinguishing by their explanatory role in fittingness; and those treating right-kindness as attitude-relative. All three yield verdicts for atomic cases. However, none has been required to provide consistent verdicts across a composite attitude and its constituents simultaneously. This leaves a significant gap in the literature regarding the structural coherence of these accounts.

  **The Inheritance Question**
  Many attitudes appear composite. Hope, for instance, is standardly analysed as a desire for an outcome combined with a belief that the outcome is possible but uncertain. Blame may involve a belief about agency combined with a reactive emotion. This project poses the Inheritance Question: If an agent has a wrong-kind reason for a constituent attitude (e.g., a threat gives a reason to *desire* a tyrant's survival), what kind of reason is this for the composite attitude (e.g., *hoping* for the tyrant's survival)?

  Three answers are available:
  1.  **Transmission:** The wrong-kindness transmits upwards; the reason remains a WKR for the composite.
  2.  **Filtering:** Each attitude applies its own correctness filter; the reason fails to transmit as a reason for the composite at all.
  3.  **Transformation:** A wrong-kind reason for a constituent becomes a right-kind reason for the composite.

  Current theories are not calibrated to answer this. A state-given account, for example, might classify a threat as a state-given reason for desire. But is a state-given reason for a constituent necessarily a state-given reason for the composite? Testing this reveals whether these theories capture the nature of reasons or merely offer post-hoc classifications of atomic cases.

  **Methodology and Timeline**
  The project proceeds in three phases over nine months.

  *Months 1–2: Taxonomy and Case Calibration.*
  I will establish a working taxonomy of composite attitudes, focusing on Hope and Blame. To mitigate the risk that constitutive claims are contested, I will adopt a 'minimal commitment' strategy, selecting only those constitutive relations with broad philosophical support. I will then construct a calibrated set of threat cases where the incentive targets the constituent specifically (e.g., 'Desire X or suffer') versus the composite ('Hope for X or suffer'). These cases will be reviewed for clarity to avoid 'baroque' complexity that undermines intuitive verdicts.

  *Months 3–5: Theoretical Stress Testing.*
  I will apply the three main families of WKR solution (Object/State-Given, Explanatory, and Attitude-Relative) to the calibrated case set. The analysis will determine whether each theory can generate consistent verdicts for both the constituent and the composite without contradiction or ad hoc modification. Special attention will be paid to the belief-constituent, ensuring the account does not beg questions against the established debate on pragmatic reasons for belief.

  *Months 6–7: Evaluation and Implications.*
  I will evaluate which theories survive the stress test. If a theory yields inconsistent verdicts (e.g., classifying a reason as Right Kind for the composite but Wrong Kind for the constituent without explanation), it will be marked as deficient. I will then map the implications for fitting-attitude accounts of value. If the Inheritance Question reveals a structural flaw in the dominant theories, this necessitates a revision of the WKR framework.

  *Months 8–9: Writing and Dissemination.*
  The final three months will be dedicated to drafting the dissertation and preparing two journal articles: one on the Inheritance Question itself, and one on the specific failure of the leading WKR accounts under compositional pressure.

  **Significance and Alternatives**
  This approach is superior to the obvious alternatives. Generating further variants of atomic threat cases yields diminishing returns; the literature is saturated with minor tweaks to the tyrant case. Conversely, a broad conceptual analysis of fittingness is too expansive for a nine-month fellowship. The compositional stress test is a high-leverage strategy: it uses existing theoretical machinery but applies it to a new structural domain. It discriminates between theories without requiring the formulation of a new first-order principle, making it a tractable and decisive intervention.

  **Outcomes and Risks**
  The primary successful outcome is the elimination of at least one major family of WKR solutions based on its inability to handle composite attitudes. A secondary success is a definitive map of how reasons transmit across attitudinal structures.

  However, there are clear risks. The project relies on constitutive claims about attitudes (e.g., that hope *is* desire plus belief) which are philosophically contested. If these claims are rejected, the input for the test becomes unstable. Furthermore, there is a risk of 'intuition fatigue' if the cases become too complex.

  **Failure Conditions**
  The project would count as failing if the constitutive relations prove too contested to establish a stable input set, rendering the cases inconclusive. It would also fail if the leading theories prove flexible enough to accommodate any verdict on the Inheritance Question without theoretical cost, suggesting the question is not diagnostic. In either case, the negative result will be documented, demonstrating that the WKR debate cannot be advanced via compositional analysis under current psychological assumptions.

  ***

  ### Commentary on Framing and Tractability (For the Applicant)

  You asked me to flag framing assumptions that a referee might reject and to assess tractability plainly. Here is the honest assessment:

  **1. The 'Composite' Assumption**
  *   **The Risk:** Your proposal leans heavily on the claim that attitudes like hope and blame are *constituted* by other attitudes (reductivism). A significant chunk of philosophy of mind and action rejects this. Many argue hope is sui generis. If a referee holds a non-reductive view, your 'Inheritance Question' dissolves because there are no constituents to inherit anything.
  *   **The Fix:** In the proposal, I used the phrase "standardly analysed as" and "minimal commitment strategy." This signals you are aware of the contestation. In the actual work, you must be prepared to argue that even if the constitution is not metaphysical, there is a *normative* dependency that allows the test to run.

  **2. The 'Reasons' Assumption**
  *   **The Risk:** You assume reasons for constituents are intelligible in the same currency as reasons for composites. Some theorists argue that pragmatic reasons for belief (a common constituent) are not genuine reasons at all (the 'evidentialist' objection). If reasons for constituents are illegitimate, the transmission question is moot.
  *   **The Fix:** The proposal mentions calibrating against the "well-worked-out debate about pragmatic reasons for belief." This is good. Ensure you explicitly state that you are working within a framework that accepts state-given reasons for the sake of the *reductio* against WKR theories.

  **3. Tractability in Nine Months**
  *   **Assessment:** This is tight but doable *if* you limit the scope. Do not try to solve the WKR problem. Try to solve whether *existing* solutions are consistent.
  *   **The Trap:** The "baroque cases" worry you mentioned is real. If you spend Months 1–2 engineering perfect cases, you will run out of time for the theoretical testing.
  *   **Recommendation:** Stick to two composite attitudes (Hope and Blame). Do not add Trust or Regret unless the first two are finished by Month 3. The proposal promises Hope and Blame; keep that promise strict.

  **4. The 'Failure' Section**
  *   **Referee Psychology:** Referees generally dislike explicit "Failure Conditions" in a proposal; it can sound like a lack of confidence. However, you requested it. I have framed it as "Risk and Limitations" in the text above, but kept the header "Outcomes and Risks" with a subsection on failure. This shows intellectual honesty without sounding defeatist. It frames failure as a *result* (a negative finding) rather than a *process error*.

  **5. Generalist Intelligibility**
  *   **Check:** The proposal avoids heavy jargon where possible but keeps the philosophical meat. The explanation of the WKR problem is standard and should be clear to a generalist. The move to 'composite attitudes' is the novel hook, and it is explained via the Hope example, which is accessible.

  **Verdict:** The question is tractable *provided* you treat the constitutive claims as working hypotheses rather than settled facts. If you find in Month 2 that the literature on Hope is too fractured, pivot immediately to a different composite pair or narrow the claim to 'normative dependency' rather than 'constitution'. The proposal is written to allow you that flexibility.
