prompt: |-
  Hi, I'm a retired physical chemist, spent most of my career watching dyes mix in big tanks, and now in my late 60s I'm trying to pick up some philosophy for fun. I'm stuck on this chaos and determinism business and hoping someone can walk me through it in plain language.

  What I can't get my head around is this. I built a little double pendulum for my grandkids out of brass hinges, and I also coded up a toy simulation of it on my laptop. If I start the simulation twice with exactly the same numbers it does exactly the same thing every time, so in that sense it's deterministic, right? But the brass one never matches the simulation for more than maybe fifteen seconds, and two releases that look identical to my eye diverge almost right away. I get the general line that chaos is still deterministic but unpredictable because of sensitive dependence on initial conditions, but what does that determinism attach to - the equations, the computer run, or the actual brass thing on my workbench? And here's the part that really puzzles me: to predict the brass pendulum a minute out I'd need to know the starting angle to like ten decimal places, to predict an hour out I'd need a hundred, and so on without end. But my protractor only gives me a mesurment to maybe two decimals, and it feels weird to say nature itself has a true starting angle with infinitely many digits sitting there waiting to be measured. So is the unpredictability just a practical limitation for creatures like us, or is there a principled sense in which even a perfect predictor with finite instruments couldn't do it, and if so does that leave determinism as kind of an empty idea?

  Oh and one favor, could you answer in continuous prose only, no headings, bullet points, bold text, or tables, just the way you'd write an email or a letter? All that formatting makes my eyes glaze over.
