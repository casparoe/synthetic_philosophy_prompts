      *   **Vagueness & The Law (The Stipulation View):** The law generally operates on a *stipulative precisification* model. It acknowledges the underlying continuum (vagueness) but imposes a sharp boundary for *administrative necessity*. This aligns best with Supervaluationism or a pragmatic Contextualism, rather than Epistemicism (the law doesn't think it *discovered* the line, it *drew* it).
