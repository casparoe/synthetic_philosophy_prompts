      *   **The "Moral" (Logic vs. Metaphysics):** You *don't* have to weaken logic. You can keep classical logic and say truth is relative to a branch (Ockhamism) or use supervaluationism (the disjunction is true because it's true on all branches, even if no specific disjunct is).
