          *   **Verdict:** Wrong / Highly Disputed. Most contemporary scholars distinguish Bivalence (PV~P is always true because P is T or F) from Excluded Middle (PV~P is always true regardless of P's value). Aristotle is widely read as rejecting Bivalence for future contingents but *accepting* Excluded Middle (the disjunction is true, but neither disjunct is).
      *   *Sentence 4:* "Two thousand years later Łukasiewicz built the first many-valued logic precisely to formalise this, giving future contingents the value ½ — and in his system 'either there will be a sea battle tomorrow or there won't' also comes out as ½ rather than as true, which is exactly what Aristotle had argued."
