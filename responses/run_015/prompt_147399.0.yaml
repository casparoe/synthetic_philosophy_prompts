      *   **Bivalence vs. Excluded Middle:** The book conflates them.
          *   *Bivalence:* Every proposition is True or False.
          *   *Excluded Middle:* For any proposition P, (P or not-P) is True.
          *   *Aristotle's likely view:* Reject Bivalence for future contingents (they aren't T or F yet), but Accept Excluded Middle (it is true that "either battle or no battle").
