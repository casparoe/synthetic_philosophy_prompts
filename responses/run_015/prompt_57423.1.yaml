answer: |-
  1. The current levy on wages versus capital allowances presupposes that labour is merely a taxable cost of production, whereas investment in machinery is a virtuous engine of growth worthy of subsidy.
  2. Such a framework silently rejects the notion that work grants standing in a community or constitutes a relationship between people, reducing employment to a sterile financial exchange rather than a social bond.
  3. Honestly, this disparity likely stems from administrative convenience rather than philosophical conviction, as taxing payrolls is far simpler than valuing robots, yet it is dressed up as strategic economic policy.
  4. The whole arrangement contradicts itself when politicians extol the dignity of work while structuring the tax code to make human labour disproportionately expensive compared to automation.
  5. Were meaningful work treated as a good in itself, the state would subsidise employment like it does capital investment, prioritising human engagement over mere efficiency.
