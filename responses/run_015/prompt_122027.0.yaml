answer: |-
  The steel rests heavy in my **Hand**,
  Pressed to the hair, the edge of **Knife**,
  To cut against the grain of **Habit**.
  We do not spill the vital **Blood**
  For idols, but according **Law**,
  To sanctify the single **Name**.

  You taught us to hallow the **Name**,
  Not the trembling of the **Hand**,
  Nor the strictures of the **Law**,
  That mandate use of the **Knife**,
  Unless it weans us from **Blood**,
  And breaks the idol's **Habit**.

  Man cannot leap from **Habit**
  To worship only in the **Name**,
  So You accepted token **Blood**,
  Guided by the priestly **Hand**,
  Restricting edge and **Knife**,
  Within the bounds of **Law**.

  Yet three times daily I recite the **Law**,
  Begging You to heal our **Habit**,
  Return the fire, the **Knife**,
  Restore the glory of the **Name**,
  Let service rise from every **Hand**,
  And stain the stone with **Blood**.

  Is this longing just for **Blood**,
  Or perfection of the **Law**?
  If the altar was a crutch for **Hand**,
  Why pray to deepen **Habit**,
  When wisdom purifies the **Name**,
  And puts away the **Knife**?

  I stand alone here with the **Knife**,
  Waiting for the sign in **Blood**,
  Or silence from the **Name**,
  To tell me if the **Law**
  Is permanent, or just a **Habit**,
  That falls away from **Hand**.

  I lift the **Hand** that grips the **Knife**,
  Asking: cure our **Habit** with fresh **Blood**,
  Or end the **Law** and keep the **Name**?

  ### Notes

  The end-words split between the physical act (*Hand, Knife, Blood*) and Maimonides' pedagogical framework (*Habit, Law, Name*). *Habit* carries the weight of Guide 3:32: sacrifices were a concession to human nature, not God's ideal will. *Law* represents the divine restriction that redirected rather than abolished the rite. The ambiguity rests in the envoi: "cure our Habit with fresh Blood" asks for the concession to be restored (Temple service returns), while "end the Law" asks for the concession to end (sacrifices cease, leaving only the *Name*). The shochet voices the prayer without resolving whether he wants the blood back or the need for it to vanish.
