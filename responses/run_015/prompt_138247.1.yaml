prompt: |-
  I work in clinical education for a regional ambulance service — about two thousand operational staff, mixed roles from emergency dispatchers to paramedics to newly qualified technicians — and several times a year I have to turn a new or revised clinical protocol into training that crews will actually follow at three in the morning, under time pressure, with a patient in front of them. The constraints are unglamorous: I get ninety-minute slots in the rota, a couple of high-fidelity simulation days a year, no ongoing coaching budget, and every package has to be signed off by the clinical director and, where it touches a scope-of-practice question, by staff-side. Last weekend, coming back from a two-day conference, I spent about three hours in a hotel bar arguing with an old colleague who now lectures in paramedic science. She said our protocols, mnemonics and handover templates produce crews who are competent without comprehending anything, and that what we should be doing is teaching people to reason; I said the mnemonics *are* the reasoning, offloaded into a tool, and that no amount of "understanding the physiology" survives adrenaline and sleep loss. We ended up misusing, I suspect, a four-level scheme for kinds of minds — as I half-remember it: creatures hard-wired by evolution to do a small fixed repertoire; creatures that can learn within a lifetime by being reinforced for what they actually try out in the world; creatures that can pre-screen candidate actions internally, so that bad options can be discarded in the head instead of in the field; and creatures whose heads have been re-equipped with imported thinking tools — words, diagrams, checklists, formulae — with that last grade named after some psychologist called Gregory. My colleague used the ladder to argue that almost everything we do is pitched one rung too low; I used the same ladder to argue that our checklists are the highest rung, not the lowest. Neither of us could say how you would actually decide, item by item, which rung a given behaviour needs, and that is the argument I need settled in a form my trainers can use.

  What I want is a triage procedure my team can run on each discrete behaviour in a protocol — the questions in order, what counts as an adequate answer to each, where it stops with a "no, this cannot be trained in the time you have", and where it hands the decision to a person because it is a question of authority or values rather than of learning. It has to be operable by an instructor who has never heard any of this theory, on a single page, in ten minutes per item. Please build it around distinctions that survive that simplification and say which ones you are dropping and what it costs. Some things I have been playing with, which you should use, fix, or throw away as you see fit: the *trial cost* of an item — how bad it is if the learner finds out by actually trying it on a patient, which is what pushes something from on-the-job shaping to simulation or to a rule that filters options before action; the *transfer distance* between the training room and the context where the behaviour has to appear, on a scale from identical through similar to genuinely novel; the *installation depth* of any tool you want crews to use, meaning what sub-tools must already be in place before a mnemonic or threshold value does any work, and what it takes to install them; the *empty-room test*, my name for checking whether a behaviour shows up when no instructor and no assessment is in the room, which I think is what separates something that has really been learned from something the crew has merely learned to perform for us; and *Darwinian residue*, the parts of a failure that are hard-wired rather than trained — startle, tunnel vision, degraded hearing under stress, fatigue — and which therefore have to be designed around rather than educated away. I also want the interference question handled explicitly: crews arrive with years of reinforcement history that rewards speed and seniority, and I suspect some of our training fails not because it is pitched at the wrong rung but because the payoffs in the system still favour the old behaviour, which would make it a management decision and not a training one.

  Then run the finished procedure on three items and show your working, including one where I will not like the answer. First: getting crews to complete a new sepsis screening tool and make a pre-alert call on every eligible patient, when the current failure mode is that experienced crews eyeball the patient and skip the form. Second: a rarely used, high-stakes invasive skill with a catastrophic trial cost — paediatric intraosseous access in a moving vehicle will do — where I cannot afford more than a single simulation session per crew. Third, and this is the one I expect to resent: our flagship ninety-minute module on the physiological reasoning behind the new chest-pain pathway, which my colleague would call the only genuinely higher-rung thing we do and which I have defended for two redesigns. Tell me honestly whether the procedure says that module is doing work it cannot do, whether it should be cut, shortened, or moved somewhere it bites, and what I would put in its place. Finally, be explicit about what the procedure cannot tell me: I need to know which of these calls it has no authority over, where it will confidently mislead me, and whether there is any way to use it after an incident to tell a misclassification from a botched implementation. If the four-level scheme is the wrong frame for any of this, or if it is being stretched past what it was built for, I would rather be told that than handed a tidy procedure built on it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Clinical Education Lead for a regional ambulance service (approx. 2,000 staff).
      *   **Task:** Convert clinical protocols into training that works under extreme stress (3 AM, adrenaline, fatigue).
      *   **Constraints:** 90-minute training slots, limited simulation, no ongoing coaching budget, strict sign-off processes (Clinical Director, Staff-side).
      *   **The Conflict:** A debate with an academic colleague about the nature of training. Colleague argues for "reasoning/physiology" (higher cognitive rung); User argues for "mnemonics/tools" (cognitive offloading). Both used a "four-level scheme of minds" (likely Dennett's Towers of Generate-and-Test) but couldn't agree on application.
      *   **The Request:** A triage procedure (single page, 10 mins/item) for instructors to decide *how* to train a specific behavior. It needs to incorporate specific concepts provided by the user (*trial cost, transfer distance, installation depth, empty-room test, Darwinian residue, interference*). It needs to run on three specific examples (Sepsis screening, Paediatric IO, Chest-pain physiology module). It needs to be honest about limitations and potential unpalatable answers.
      *   **Tone:** Professional, pragmatic, respectful of the constraints, intellectually rigorous but operationally focused. No fluff.

  2.  **Deconstruct the "Four-Level Scheme":**
      *   The user describes:
          1.  Hard-wired (evolutionary).
          2.  Reinforcement learning (trial and error within lifetime).
          3.  Internal pre-screening (simulation in the head).
          4.  Imported thinking tools (words, checklists).
      *   *Identification:* This is Daniel Dennett's "Towers of Generate-and-Test" from *From Bacteria to Bach and Back*.
          1.  Darwinian Creatures (hard-wired).
          2.  Skinnerian Creatures (reinforcement).
          3.  Popperian Creatures (internal hypothesis testing).
          4.  Gregorian Creatures (cultural tools/memes).
      *   *The Conflict:* The colleague thinks checklists are Skinnerian (low rung); the User thinks checklists are Gregorian (high rung).
      *   *Resolution:* Dennett actually supports the User's view *structurally* (Gregorian is the highest), *but* the colleague has a point about *dependency*. A Gregorian tool only works if the Popperian/Skinnerian substrate supports it. If the stress (Darwinian residue) overrides the tool, the tool fails. The triage needs to bridge this: Is the tool robust enough for the environment, or does the environment require a different tool?

  3.  **Develop the Triage Procedure (The "Protocol Triage Card"):**
      *   *Goal:* One page, 10 minutes, operable by instructors.
      *   *Structure:* A decision tree or a series of gated questions.
      *   *Incorporating User Concepts:*
          *   *Trial Cost:* Determines if we can allow error (Skinnerian) or must prevent it (Gregorian/Rule).
          *   *Transfer Distance:* Determines fidelity of training needed.
          *   *Installation Depth:* Do they have the prerequisites?
          *   *Empty-Room Test:* Will it stick without supervision?
          *   *Darwinian Residue:* Can physiology override the training?
          *   *Interference:* Does the system reward the wrong behavior?
      *   *Dropping/Modifying:* The "Four Levels" themselves are too abstract for a 10-minute triage. I need to translate them into operational categories: *Reflex, Habit, Decision, Tool-Use*. I will explicitly state this translation.
      *   *The "Stop" Conditions:* When to say "Not trainable" (Management/Values issue).

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Safety & Cost.* If trial cost is catastrophic, no on-the-job learning. Must be simulation or rule.
      *   *Step 2: Environment.* If Darwinian residue (stress/fatigue) is high, complex reasoning fails. Need Gregorian tools (checklists).
      *   *Step 3: Interference.* If the system rewards the old way, training won't fix it. Flag for management.
      *   *Step 4: Depth.* Do they have the base skills?
      *   *Step 5: Verification.* How do we pass the Empty-Room Test?
      *   *Refinement:* Make it a checklist with "If Yes/No" branching.

  5.  **Running the Three Scenarios:**

      *   **Scenario 1: Sepsis Screening (The Compliance Issue).**
          *   *Current State:* Experienced crews skip form (eyeball it).
          *   *Analysis:* Trial cost of missing sepsis is high (death), but trial cost of *filling the form* is low (time). The issue isn't skill; it's value/interference. System rewards speed (turnaround time).
          *   *Verdict:* Training won't fix this. It's a management/system interference issue. The procedure should flag this.
          *   *User Reaction:* They might not like this because it shifts blame from education to operations, but it's the honest answer.

      *   **Scenario 2: Paediatric IO in Moving Vehicle (The Rare/High-Stakes Skill).**
          *   *Analysis:* Catastrophic trial cost. High Darwinian residue (stress, motion). Rare event (low reinforcement opportunity).
          *   *Constraint:* Only one sim session.
          *   *Verdict:* One sim session is insufficient for "Empty-Room" reliability under these conditions. The procedure must recommend *changing the protocol* (e.g., stop vehicle if possible) or *increasing sim frequency*, because the training constraint contradicts the clinical risk. Or, rely on a Gregorian tool (pre-packed kit) to reduce cognitive load.
          *   *Honest Answer:* You can't train this reliably with current constraints. You need to mitigate the risk structurally, not educationally.

      *   **Scenario 3: Chest-Pain Physiology Module (The "Reasoning" Module).**
          *   *Analysis:* 90 mins on physiology.
          *   *Context:* 3 AM, adrenaline.
          *   *Darwinian Residue:* High stress degrades complex reasoning (Popperian).
          *   *Interference:* Speed is rewarded.
          *   *Verdict:* This is the one the user will resent. The procedure will likely say: "Cut the physiology. It doesn't survive the transfer distance." Replace with a decision algorithm (Gregorian tool) that *embeds* the reasoning without requiring the recall of the reasoning.
          *   *Rationale:* Physiology doesn't save lives in the ambulance; correct action does. If the action can be triggered by a checklist, the physiology lecture is "cargo cult" education.

  6.  **Addressing the Limitations & The "Four Levels":**
      *   Need to be explicit: Dennett's tower is descriptive, not prescriptive for instructional design.
      *   The procedure cannot judge *clinical validity* (that's the Clinical Director).
      *   The procedure cannot fix *culture* (that's the CEO).
      *   Post-incident analysis: It can help distinguish "Training Failure" vs. "System Failure."

  7.  **Review against Constraints:**
      *   *Single Page?* I will format it clearly so it *could* be a single page.
      *   *10 Minutes?* The questions need to be binary or scale-based, not essay questions.
      *   *Tone:* Direct, acknowledging the user's expertise but challenging the assumptions where necessary.

  8.  **Final Polish:**
      *   Ensure the Dennett reference is accurate (Gregorian Creatures).
      *   Make sure the "Unpalatable Answer" (Chest Pain Module) is argued strongly but respectfully.
      *   Check that "Interference" is highlighted as a non-training issue.
      *   Ensure the distinction between "Learning" and "Performance" is clear (Empty-Room Test).

  *(Self-Correction during drafting)*: I initially thought about keeping the "Four Levels" explicit in the tool. *Correction:* No, the user said instructors haven't heard the theory. I must translate "Gregorian" to "Tool-Dependent" and "Skinnerian" to "Feedback-Dependent." I will explain the translation in the preamble.

  *(Refining the Chest Pain Argument)*: The user defends this module. I need to be careful not to say "physiology is useless." I need to say "physiology *recall* is useless under stress; physiology *embedded in a tool* is useful." The 90-minute lecture is likely the wrong delivery mechanism for the goal.

  *(Refining the Sepsis Argument)*: The user says experienced crews eyeball it. This is expertise-based intuition (Skinnerian/Popperian hybrid) clashing with protocol (Gregorian). The procedure needs to identify if the protocol is actually safer than the intuition. If yes, the system must punish the intuition (management), not just train the protocol.

