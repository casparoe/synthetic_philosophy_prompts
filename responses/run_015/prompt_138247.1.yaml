answer: |-
  This is a precise operational problem wrapped in a theoretical dispute. Your colleague is referencing Daniel Dennett's "Towers of Generate-and-Test" (Darwinian, Skinnerian, Popperian, Gregorian). She is arguing that checklists keep crews at the Skinnerian level (stimulus-response); you are arguing that checklists elevate them to the Gregorian level (using cultural tools to bypass biological limits).

  You are both partially right, which is why the argument stalled. A Gregorian tool (checklist) *is* higher-order, but it collapses back to Darwinian reflexes (tunnel vision, freeze) if the *Installation Depth* isn't secure or if *Darwinian Residue* (adrenaline/fatigue) overrides it.

  Below is the triage procedure you requested. It translates Dennett's tower into operational categories an instructor can use without knowing the theory. Following that, I have run the three scenarios. I have not softened the conclusions on the Chest-Pain module or the Sepsis compliance, as you asked for honesty over comfort.

  ### The Protocol Triage Card (Single Page)

  **Instructions:** Complete one card per discrete behaviour (e.g., "Insert IO," "Complete Sepsis Screen," "Interpret ECG"). Time limit: 10 minutes. If you cannot answer a question, the item is not ready for training design.

  | **Section** | **Decision Question** | **If YES →** | **If NO →** |
  | :--- | :--- | :--- | :--- |
  | **1. Trial Cost** | If the learner gets this wrong on a real patient, is the harm irreversible or catastrophic? | **STOP.** Cannot be learned on-the-job. Must be Simulation or Rule. | Can be shaped by real-world feedback. Proceed to Q2. |
  | **2. Darwinian Residue** | Will this behaviour be required under high stress, fatigue, or startle (3 AM, violent scene, crying child)? | **Assume Cognitive Degradation.** Complex reasoning will fail. Requires Gregorian Tool (checklist/algorithm). | Standard cognitive load applies. Proceed to Q3. |
  | **3. Interference** | Does the current operational system (KPIs, culture, seniority) reward the *old* way or speed over this new behaviour? | **STOP.** This is a Management Issue, not Training. Flag for Clinical/Ops Director. | Training can succeed. Proceed to Q4. |
  | **4. Transfer Distance** | Is the training environment identical to the field (same kit, noise, posture, time pressure)? | Low-fidelity training acceptable. Proceed to Q5. | **High Fidelity Required.** If sim budget doesn't match, behaviour is high-risk. |
  | **5. Installation Depth** | Do crews already possess the sub-skills required to use the tool (e.g., can they read the monitor before using the algorithm)? | Ready for Tool Installation. Proceed to Q6. | **Prerequisite Training Needed.** Do not teach this item yet. |
  | **6. Empty-Room Test** | Can you design an assessment that happens *without* an instructor present (e.g., downloaded data, body-cam audit)? | **Pass.** You can verify retention. | **Fail.** If you can't measure it off-line, they will only perform it for you. |

  **Final Classification:**
  *   **Rule-Based (Gregorian):** High Cost + High Residue. (Needs Checklist/Protocol)
  *   **Skill-Based (Skinnerian/Popperian):** Low Cost + Low Residue. (Needs Practice/Feedback)
  *   **System-Blocked:** Interference = Yes. (Needs Management Intervention)
  *   **Untrainable:** Cost/Depth/Transfer mismatch with budget. (Needs Protocol Change)

  ***

  ### What Was Dropped and The Cost
  1.  **The "Four Levels" Terminology:** Instructors do not need to know "Popperian." They need to know "Will stress kill this?" The cost is theoretical nuance; the gain is speed.
  2.  **The "Why" of Physiology:** The card does not ask "Do they understand the mechanism?" It asks "Does the mechanism help them act under stress?" The cost is academic satisfaction; the gain is clinical reliability.
  3.  **Volition:** The card assumes crews want to do the right thing unless *Interference* stops them. It does not account for malice, which is an HR issue, not education.

  ***

  ### Scenario Runs

  #### 1. Sepsis Screening & Pre-Alert (The Compliance Issue)
  *   **Trial Cost:** High (missed sepsis = death). **→ Simulation/Rule.**
  *   **Darwinian Residue:** Moderate. Sepsis patients are often sick but not always chaotic. However, fatigue is high. **→ Tool Recommended.**
  *   **Interference:** **YES.** You stated experienced crews "eyeball" it. The system rewards turnaround time and clinical intuition. Filling a form slows them down and implies they don't trust their gut.
  *   **Transfer Distance:** Low (Form is the same in truck and classroom).
  *   **Installation Depth:** High (They know how to take vitals).
  *   **Empty-Room Test:** Easy (Audit the forms).

  **Verdict:** **System-Blocked.**
  **Working:** The Triage Card flags this immediately at Question 3. You cannot train away a behaviour that is reinforced by the operational culture (speed/seniority). If an experienced paramedic believes they can spot sepsis faster than the tool, a 90-minute class will not convince them otherwise. They will comply when you watch (Skinnerian) and revert when you leave (fail Empty-Room).
  **Action:** Do not build more training. Build a data pack for the Clinical Director showing the correlation between "skipped form" and "adverse outcome." The fix is not education; it is changing the KPI or making the form digitally mandatory to submit the ePCR.

  #### 2. Paediatric IO in a Moving Vehicle (The Rare/High-Stakes Skill)
  *   **Trial Cost:** Catastrophic (loss of access/limb/patient). **→ Simulation/Rule.**
  *   **Darwinian Residue:** Extreme (Moving vehicle, child, stress). **→ Tool/Rule Essential.**
  *   **Interference:** Low (Nobody wants to fail this).
  *   **Transfer Distance:** **High.** Classroom is static. Field is moving.
  *   **Installation Depth:** Moderate (Requires anatomical knowledge).
  *   **Empty-Room Test:** Hard (Rare event, hard to audit without video).
  *   **Constraint:** One simulation session per crew.

  **Verdict:** **Untrainable (under current constraints).**
  **Working:** Question 1 says "Must be Simulation." Question 2 says "Stress will degrade performance." Question 4 says "Training is static, Field is dynamic." With only one sim session, you cannot bridge the Transfer Distance for a skill with Catastrophic Trial Cost in a high-residue environment. You cannot guarantee the Empty-Room Test will pass.
  **Action:** This is the answer you won't like. The procedure dictates you cannot certify this behaviour as "trained" with the resources given. You have two options:
  1.  **Change the Protocol:** "Do not attempt IO while moving. Stop vehicle." (Reduces Darwinian Residue).
  2.  **Change the Resource:** Demand more sim time or use a "pre-loaded" IO device that reduces the skill to a Gregorian tool (push button, not drill).
  *If you run the training as planned, you are creating a false sense of security.*

  #### 3. Chest-Pain Physiological Reasoning Module (The Flagship)
  *   **Trial Cost:** High (Missed MI). **→ Simulation/Rule.**
  *   **Darwinian Residue:** High (Chest pain = high anxiety, time pressure). **→ Tool Essential.**
  *   **Interference:** Moderate (Speed vs. Accuracy).
  *   **Transfer Distance:** High (Classroom reasoning vs. 3 AM gut feeling).
  *   **Installation Depth:** High (Requires physiology knowledge).
  *   **Empty-Room Test:** **Fail.** You cannot test "reasoning" in the field. You can only test "decision."

  **Verdict:** **Cut or Radically Redesign.**
  **Working:** This is the hard truth. Question 2 (Darwinian Residue) indicates that under stress, access to complex physiological reasoning (Popperian) is compromised. Question 6 (Empty-Room) reveals you cannot verify if they are actually using the reasoning or just guessing the right answer.
  Your colleague is right that reasoning is "higher rung," but you are right that it doesn't survive the night shift. A 90-minute module on *why* the pathway exists does not improve the *execution* of the pathway under stress. It creates "competent without comprehending" crews, which is actually the *goal* in high-stress environments. You want them to trust the tool, not debate the physiology.
  **Action:**
  1.  **Cut:** The 90-minute physiology lecture.
  2.  **Replace:** With a 20-minute "Cognitive Forcing" drill. Show them cases where the physiology is misleading but the algorithm is right. Train them to *suppress* their reasoning in favour of the tool.
  3.  **Rationale:** You are not training scientists; you are training reliable operators. The "reasoning" should be embedded in the protocol design (by you and the Clinical Director), not re-calculated by the exhausted crew.

  ***

  ### Limitations: What This Procedure Cannot Do

  1.  **Clinical Validity:** The card assumes the protocol is medically correct. If the Sepsis Tool is clinically flawed, this triage will still tell you how to train it, not whether you *should*. That authority remains with the Clinical Director.
  2.  **Culture Change:** The "Interference" check identifies management problems, but it cannot solve them. It will tell you "Training will fail here," but it cannot force Operations to change KPIs. You will need political capital to use that finding.
  3.  **Post-Incident Forensics:** If an incident occurs, this tool cannot definitively tell you if it was a "Misclassification" (we trained it wrong) or "Botched Implementation" (they didn't do what we trained).
      *   *Workaround:* Use the **Empty-Room Test** data. If they pass the audit generally but failed on this call, it's implementation (fatigue/error). If they fail the audit generally, it's misclassification (training/protocol design).
  4.  **The "Gregorian" Trap:** The procedure assumes tools work. It does not account for "checklist fatigue" where crews have so many Gregorian tools they ignore all of them. You need a separate audit for "Total Cognitive Load per Shift."

  ### Summary of the Argument
  Your colleague argues for **Popperian** crews (internal reasoning). You argue for **Gregorian** crews (external tools).
  The Triage Procedure concludes: **In high Darwinian Residue environments (ambulance work), Gregorian tools are superior, *provided* the system does not punish their use.**

  The Chest-Pain module fails because it tries to build Popperian capacity in a Gregorian environment. The Sepsis item fails because the System punishes Gregorian compliance. The IO item fails because the Training Budget cannot bridge the Transfer Distance for the required safety level.

  Use the card to protect your team from being blamed for system failures, and to protect the service from training that looks good on paper but fails at 3 AM.
