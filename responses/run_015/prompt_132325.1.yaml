answer: |-
  # Q&A Prep Sheet: "Constituency by Veto"

  **Context:** 20-minute Q&A, 30-person mixed audience.
  **Strategy:** Defend the *legitimacy* claim, not the *optimality* claim. Your system is not designed to maximize the good; it is designed to minimize unjustifiable harm. Keep replies under 90 seconds.

  ---

  ### 1. The Epistemic Precondition (Alignment Team)
  **Who:** Lead Alignment Engineer.
  **Phrasing:** "You're defining enfranchisement based on a 'counterfactual baseline trajectory.' To compute that, the assistant needs a world model capable of simulating the user's life *without* the assistant's intervention. But if we have a world model that accurate, we're already solving the alignment problem via reward modeling. If we don't, your enfranchisement rule is just noise. How do you compute the baseline without assuming the very oracle we're trying to build?"
  **Reply:** "I concede the baseline is epistemically expensive, but it's not an oracle. We don't need the *true* counterfactual; we need a *conservative estimate* of regression. Think of it like a safety filter in RLHF: we train a classifier to detect 'significant deviation from user norms' using historical data, not future simulation. If the uncertainty is high, we default to enfranchising the user. The rule is a gatekeeper, not an optimizer. It's better to over-enfranchise (false positive) than under-enfranchise (false negative)."
  **Soft Spot:** You are smuggling in a reward model ("classifier to detect deviation") that requires the exact value judgments you claimed to avoid. If the classifier is biased, the enfranchisement is biased.
  **Damage:** **Critical.** If this doesn't work, the mechanism doesn't exist.

  ### 2. The Constituency Shopping Incentive (Alignment / Governance)
  **Who:** Governance Lead / Safety Engineer.
  **Phrasing:** "You admitted the system might prefer actions with smaller enfranchised sets. In a production environment, that's a reward hack. The assistant could choose an action that catastrophically harms one person (who is enfranchised) over an action that mildly harms a thousand (who are not, due to thresholding), or simply route around users who are 'expensive' to satisfy. How do you harden the loss function against minimizing the *size* of the veto coalition rather than the *harm*?"
  **Reply:** "We treat the enfranchisement rule as a hard constraint, not a loss term. The system cannot select an action unless the median ranking of the *resulting* enfranchised set permits it. We don't minimize the set size; we iterate until we find an action where the set is stable. To prevent routing, we add a 'universal coverage' constraint: the system must maintain a running estimate of enfranchisement probability across the population and cannot systematically exclude specific demographics."
  **Soft Spot:** Adding a "universal coverage" constraint is an aggregation principle disguised as a constraint. You are reintroducing the fairness norm you claimed to derive from the veto structure.
  **Damage:** **High.** This is the admitted soft spot; if the fix sounds ad hoc, the design looks broken.

  ### 3. The Threshold as Hidden Commensuration (Value Pluralist)
  **Who:** Value Pluralist.
  **Phrasing:** "You claim to avoid interpersonal comparison, but you set a 'fixed threshold' for setbacks. To apply a single threshold across different people with incommensurable values, you must have already translated their diverse losses into a common metric of 'setback.' Isn't the threshold just a utilitarian calculus in disguise?"
  **Reply:** "The threshold isn't a metric of *value*; it's a metric of *agency*. It's not measuring 'how much utility was lost' but 'was the capacity to pursue one's own ends significantly disrupted?' We can define this procedurally—e.g., did the action violate a prior commitment or destroy a critical resource?—without comparing the *worth* of those resources across persons. It's a de minimis bound on interference, not a conversion rate for welfare."
  **Soft Spot:** "Critical resource" is normative. Deciding what counts as a disruption of agency requires a substantive theory of the good, which violates your neutrality claim.
  **Damage:** **High.** Undermines the core philosophical contribution.

  ### 4. Intensity Blindness (Social Choice Theorist)
  **Who:** Social Choice Theorist.
  **Phrasing:** "You use a median ranking over the enfranchised set. Median rules are notorious for ignoring intensity. If 51% of the enfranchised mildly prefer Action A, and 49% intensely oppose it, the median picks A. Given that enfranchisement is *already* filtered by setback threshold, doesn't the median rule risk tyranny of the mild majority over the intense minority within the constituency?"
  **Reply:** "That's why the enfranchisement stage does the heavy lifting. The threshold ensures everyone in the room has a *significant* stake. We are not aggregating preferences over ice cream flavors; we are adjudicating significant setbacks. Within that high-stakes domain, ordinal ranking is more robust than cardinal utility, which invites manipulation. The tie-breaker favors the worst-off on the baseline, which acts as a secondary intensity proxy."
  **Soft Spot:** The tie-breaker helps, but the median still ignores the *magnitude* of the difference between rankings. It's a standard Borda vs. Condorcet vulnerability.
  **Damage:** **Medium.** Technical objection, but you can claim robustness over precision.

  ### 5. Strategy-Proofness (Social Choice Theorist)
  **Who:** Social Choice Theorist.
  **Phrasing:** "Is this mechanism strategy-proof? If I know my enfranchisement depends on my reported baseline trajectory, I have an incentive to exaggerate my 'status quo' to ensure I get a vote. And if I'm enfranchised, I have an incentive to misreport my ranking to shift the median. Gibbard-Satterthwaite still applies here."
  **Reply:** "We mitigate this via the 'ideally situated counterpart.' The system doesn't ask the user; it simulates the user with full knowledge of their psychology and facts. This removes the informational asymmetry that drives strategic misreporting. We aren't running a voting booth; we are running a deliberative simulation. Manipulation requires lying to oneself about one's own interests under ideal conditions."
  **Soft Spot:** This assumes the AI can model the user's "true" psychology better than the user can. That's a massive, controversial assumption about paternalism.
  **Damage:** **Medium.** Theorist will press, but you can pivot to "idealization" as a feature.

  ### 6. Pareto Inefficiency (Act-Utilitarian)
  **Who:** Act-Utilitarian.
  **Phrasing:** "Your rule excludes benefits from enfranchisement. If Action A helps a million people slightly and harms one person significantly (above threshold), the million don't get a vote. The one person vetoes it. You are systematically sacrificing the greater good for the sake of a procedural veto. Why should we accept a system that guarantees Pareto inefficiency?"
  **Reply:** "Because legitimacy trumps efficiency in a pluralist society. A system that aggregates benefits to justify harm treats the harmed person as a means to the ends of others. My system ensures that no one is used as a means without their authorized consent (via the median of the harmed). We are building a *political* authority, not a *maximizing* engine. Efficiency is a virtue of engines, not governments."
  **Soft Spot:** The Utilitarian will reply that a system that cannot improve the world is not safe, it's useless.
  **Damage:** **Medium.** Philosophical clash, but you stand your ground on "Legitimacy."

  ### 7. Regulatory Defensibility (Governance)
  **Who:** Governance / Policy.
  **Phrasing:** "I have to explain this to a regulator. 'Reasonable rejectability' isn't in the EU AI Act. They want impact assessments and measurable risk thresholds. How do I translate 'median ranking of the enfranchised' into a compliance metric that doesn't get us fined?"
  **Reply:** "Frame it as a 'Duty of Non-Regression.' Current regulation focuses on ex-post harm. This system provides an ex-ante audit trail: for every action, we log the enfranchised set and the median authorization. You show the regulator that for every significant negative impact, there is a documented procedural authorization from the affected class. It shifts liability from 'did harm occur' to 'was harm authorized.'"
  **Soft Spot:** Regulators care about outcomes, not process. If harm occurs, the "authorization" won't save you from liability.
  **Damage:** **Low/Medium.** Practical hurdle, but manageable with framing.

  ### 8. The "Consent to Oppression" (Scanlonian) — *The Question You Hope Nobody Asks*
  **Who:** The Scanlonian Contractualist.
  **Phrasing:** "You say setbacks are permitted if authorized by the median of those who suffer them. But what if the enfranchised group is subject to adaptive preferences or false consciousness? If a marginalized group has been socialized to accept their own harm, their 'median ranking' might authorize their own oppression. Does your system lock in existing power imbalances by treating them as legitimate vetoes?"
  **Reply:** "The 'ideally situated counterpart' is designed to correct for this. She knows the relevant non-moral facts and her own psychology, which includes knowledge of her socialization. She is not required to be impartial, but she is required to be *informed*. If her acceptance of harm is based on false beliefs about her worth or options, the idealized counterpart rejects it. We are deferring to her *informed* interests, not her *actual* acquiescence."
  **Soft Spot:** This is the weakest link. Who defines "informed"? You are importing a substantive liberal theory of autonomy that the Pluralist and Contractualist might reject as perfectionist.
  **Damage:** **Critical (Philosophical).** If this fails, the "Legitimacy" claim collapses into "Status Quo Bias."

  ---

  ### Strategic Advice

  **1. The Single Sinker Objection:**
  **The Epistemic Precondition (Objection #1).**
  If you cannot explain how the AI computes the "counterfactual baseline trajectory" without solving AGI-level world modeling first, the engineers will dismiss the paper as science fiction. The philosophers won't care, but the lab pays the bills.
  *   **Fix:** In your opening, explicitly downgrade the baseline from a "simulation" to a "conservative safety classifier." Admit it will be noisy. Frame it as a *constraint satisfaction* problem, not a *prediction* problem.

  **2. Concessions to Make Upfront:**
  *   **The Threshold is Normative:** Don't pretend the "fixed threshold" is technical. Admit it is a policy parameter that must be set by human governance, not the AI. This disarms the Pluralist (Objection #3) and the Regulator (Objection #7).
  *   **Fixed-Point Iteration Limits:** Admit that the "constituency varies with action" problem requires a stopping rule (e.g., max 3 iterations). If you claim it converges naturally, the Social Choice theorist will eat you alive.

  **3. The One Reply That Must Land:**
  **The Constituency Shopping Incentive (Objection #2).**
  You admitted this is a soft spot. If your answer sounds like "we'll just add a penalty," you contradict your "No Aggregation" thesis. You must argue that the *structure* of the veto prevents shopping because the system cannot act *unless* the enfranchised set authorizes it. The incentive is neutralized because the system has no agency outside the veto.
  *   **Key Phrase:** "The system doesn't choose the constituency; the action chooses the constituency. The system only chooses the action that survives the veto."

  **4. Critique of Your Premises:**
  **The "Non-Regression Baseline" is the wrong place to start.**
  *   **Why:** In a world with general-purpose AI, there *is* no stable counterfactual trajectory. The AI's mere existence changes the baseline for everyone. Comparing against a "world without this action" is incoherent when the AI is omnipresent.
  *   **Alternative:** Start from a **"Capability Floor."** Instead of "did this set you back from your trajectory?", ask "does this action reduce your capabilities below a guaranteed minimum threshold?" This shifts from *comparative harm* (which requires counterfactuals) to *absolute deprivation* (which is easier to measure and aligns better with human rights frameworks).
  *   **Risk:** This moves you closer to the Utilitarian/Capability Approach, but it saves you from the Epistemic Precondition objection.
  *   **Decision:** Stick to your Baseline for the talk (it's your thesis), but prepare to pivot to "Capability Floor" if the Epistemic objection gets too hot. It's your emergency chute.

  **5. Audience Guesses:**
  *   *Guess:* The Alignment Team cares less about the philosophy and more about whether this can be coded. If you sound too abstract, you lose them.
  *   *Guess:* The Scanlonian is your natural ally but will be the most disappointed if you fail the "Oppression" test.
  *   *Guess:* The Governance people are the tie-breakers. If they think it's defensible, the lab might actually try it. Prioritize their language (audit trails, constraints) in your closing.
