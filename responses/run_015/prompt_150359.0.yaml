answer: |-
  **Project Title:** Reconfiguring the Persistence Debate: Independence, Coherence, and Logical Space

  **1. The Research Question**
  The standard metaphysical dispute between endurantism (objects are wholly present at each moment) and perdurantism (objects extend through time like spacetime worms) is routinely presented as a binary choice. My project asks: *Are the constitutive theses of this debate logically independent, and does separating them reveal coherent metaphysical positions currently excluded by classification rather than argument?*

  Specifically, I distinguish three dimensions habitually conflated in the literature:
  1.  **The Mereological Thesis:** Do persisting objects have proper temporal parts?
  2.  **The Relational Thesis:** Is persistence strict identity across times, or a counterpart/continuity relation?
  3.  **The Quantificational Thesis:** What is the domain of quantification? (e.g., Do only momentary stages exist, or do long-lived aggregates?)

  Standard treatments assume these travel together: Endurantism is typically defined as (No Temporal Parts + Identity), while Perdurantism is (Temporal Parts + Non-Identity/Counterparts). My hypothesis is that these dimensions are separable. The precise question I will answer is: *Is the conjunction of 'No Temporal Parts' and 'Persistence is Not Identity' a coherent, non-verbal metaphysical position distinct from standard endurantism and perdurantism?*

  To ensure tractability within twelve months, I weaken the conjecture slightly: I will not attempt to defend this position as *true*, but only to establish whether it is *coherent and distinct*. If the position collapses into one of the standard views upon inspection, that is a determinate and valuable result.

  **2. Significance and State of the Debate**
  This project matters because the current binary framing obscures the logical structure of the arguments used to settle the dispute. Arguments from Temporary Intrinsics, Fission cases, and parsimony are treated as deciding between "Endurantism" and "Perdurantism." However, if these labels mask distinct theses, an argument targeting the Mereological Thesis (e.g., "objects do not have temporal parts") may be compatible with rejecting the Relational Thesis (e.g., "persistence is not identity").

  By treating the standard positions as monolithic, the literature presupposes that rejecting temporal parts commits one to persistence-as-identity. This assumption is rarely defended; it is built into the definitions. If the dimensions are independent, many classic arguments may be neutral between the reconstructed positions, or they may target only one dimension while being taken to settle the whole. Clarifying this is not merely a change of notation; it determines whether the debate is substantive or verbal. If the "empty cell" (No Parts + No Identity) is incoherent, there is a hidden logical link between mereology and identity that needs articulation. If it is coherent, the debate has been miscut, and we have overlooked a viable ontological category.

  **3. Methodology and Work Plan**
  I will employ a method of conceptual reconstruction and argument mapping, rather than arguing directly for a specific ontology or attempting a general theory of identity. The project proceeds in four phases:

  *   **Months 1–3: Formal Reconstruction.** I will define the three theses using a neutral formal framework (e.g., a sorted logic of time and objects) to ensure they are stated without begging the question. I will fix the background theory of time (B-theory) and restrict the domain to material objects to avoid complications regarding persons or psychological continuity.
  *   **Months 4–6: Independence Testing.** I will subject the reconstructed dimensions to standard arguments (Temporary Intrinsics, Fission, Parsimony). The goal is to see if these arguments discriminate between the dimensions or only between the traditional packages. For example, does the argument from Temporary Intrinsics rule out "No Identity" regardless of whether one accepts "Temporal Parts"?
  *   **Months 7–9: The 'Empty Cell' Construction.** I will attempt to construct a model satisfying 'No Temporal Parts' and 'Persistence is Not Identity'. I will test this model for collapse. Does it inevitably imply temporal parts (collapsing to perdurantism) or imply identity (collapsing to endurantism)? If it resists collapse, I will analyze whether the difference is substantive or merely verbal (e.g., a difference in predicate definition rather than ontology).
  *   **Months 10–12: Synthesis and Write-up.** I will finalize the classification of the logical space and draft the monograph/article.

  *Why this method?* Arguing for one traditional side presupposes the current framing is correct. Attempting a general theory of identity is too broad for twelve months. This cartographic approach isolates the structural assumptions of the debate, making it feasible to produce a determinate result on the *structure* of the dispute even if the *truth* of the matter remains open.

  **4. Possible Outcomes**
  1.  **New Position Viable:** The "No Parts/No Identity" view is coherent and distinct. This requires revising the standard taxonomy of persistence.
  2.  **Collapse:** The position collapses into Endurantism or Perdurantism. This reveals a hidden entailment between mereology and identity conditions.
  3.  **Verbal Dispute:** The position is distinct but the disagreement is merely verbal. This demonstrates that the persistence debate is partially linguistic.

  **5. Criteria for Failure**
  *   **Uninteresting True Result:** Proving that the "empty cell" is incoherent is a success, as it clarifies the logical links between mereology and identity.
  *   **Project Failure:** Failure would consist in producing a taxonomy that does not change how the standard arguments apply. If separating the theses leaves the force of the arguments from Temporary Intrinsics or Fission unchanged, the reconstruction is merely notational. A second failure mode is getting bogged down in the background theory of time; if I cannot fix the temporal ontology by assumption, the project will outgrow the year.

  **6. Scope and Assumptions**
  To ensure feasibility, I will fix the following by assumption rather than defense:
  *   **Temporal Ontology:** I will assume a B-theory (tenseless) framework. Defending this against A-theory objections is a separate project.
  *   **Domain:** I will restrict analysis to material objects. Persons and psychological continuity introduce distinct criteria that would complicate the mereological analysis.
  *   **Cutting Scope:** If the project outgrows the year, I will exclude Fission and Fusion cases. While illustrative, the core logical independence can be tested on simple persistence cases first.

  **7. Broader Significance**
  For philosophers outside metaphysics, this project offers a methodological lesson on how to diagnose verbal disputes. It demonstrates how binary classifications can artificially constrain philosophical inquiry by running separable theses together. More generally, it clarifies the relationship between composition (what parts an object has) and identity (what makes an object the same over time). If these come apart, it suggests that our ontological commitments are more flexible than standard debates suggest; if they do not, it reveals a deep structural constraint on how objects can exist in time. Either way, the project transforms a stalemate into a mapped logical space.
