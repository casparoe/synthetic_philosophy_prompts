      *   *The Logic:* Epistemic humility. Tradition contains accumulated wisdom (latent function) that the rationalist reformer might miss.
      *   *The "Groundskeeper Problem" (User's Twist):* Public Choice Theory / Incentive Analysis applied to Tradition. The defender of the fence isn't a disinterested sage; they are the guy paid to guard the fence. If the fence goes, he goes.

