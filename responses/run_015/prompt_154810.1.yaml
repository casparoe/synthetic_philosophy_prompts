      *   *The "Groundskeeper Problem":* This is a Public Choice / Economic critique of Tradition. It assumes actors are self-interested, not wisdom-keepers.
      *   *Settled Background:* Chesterton's Fence is about *epistemic humility* regarding *function*. It argues against removing things solely because their function isn't *immediately obvious*.
