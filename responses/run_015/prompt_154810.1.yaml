answer: |-
  A reformer and a groundskeeper stand before a fence in the middle of a barren field.

  **Reformer:** "Chesterton says I can't tear this down until I know why it's here. You've tended it for forty years. Why?"
  **Groundskeeper:** "It contains the hazard."
  **Reformer:** "There is no hazard."
  **Groundskeeper:** "That is what the fence ensures. My budget depends on that certainty."
  **Reformer:** "So your testimony is biased."
  **Groundskeeper:** "Of course. But Chesterton's principle places the burden of proof on the changer, not the keeper. I only need to invent a plausible risk. You need to prove a negative."
  **Reformer:** "So the fence isn't a barrier against danger."
  **Groundskeeper:** "It's a barrier against accountability. Now, if you'll excuse me, I have to bill you for the 'Hazard Assessment.'"

  ***

  ### A Note on the Liberties Taken

  **Is the Groundskeeper Problem latent in Chesterton's point?**
  No. It is a bolt-on from Public Choice theory.

  **Settled Background:**
  Chesterton's original argument (in *The Thing*, 1929) is epistemic, not economic. He posits that traditions and institutions are the "democracy of the dead"—accumulated wisdom that outlasts individual rationality. The "fence" represents a social norm or law whose function may be obscure to the modern rationalist but was sensible to the ancestors who built it. The asymmetry he identifies is between *ignorance* (the reformer doesn't know the function) and *presumed wisdom* (the tradition likely has one).

  **Where People Disagree (and where the joke lives):**
  The contested territory is *who* speaks for the fence. Chesterton assumes the "defender" of the fence is a vessel for that ancestral wisdom. The "Groundskeeper Problem" argues that the defender is actually a stakeholder with current incentives (budget, status, tenure).

  By making the Groundskeeper a self-interested bureaucrat rather than a wise elder, the joke shifts the argument from **Cultural Evolution** (the fence survives because it's useful) to **Bureaucratic Inertia** (the fence survives because it feeds the keeper). Chesterton warns against destroying wisdom you don't understand; the joke warns against preserving rent-seeking you *do* understand but can't disprove.
