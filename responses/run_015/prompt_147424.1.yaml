      *   *Claim 5: AI ethics should drop consciousness-prevention and focus on deception.*
          *   **Verdict:** Plausible Dennett conclusion, *but* the premise (impossible in principle) is wrong. He might agree with the policy recommendation for now, but not because it's metaphysically impossible for AI to suffer ever.
      *   *Claim 6: Machine can never be a genuine moral patient.*
