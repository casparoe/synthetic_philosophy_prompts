  The old man sits where the FATHER
  always sat, though he serves no RULER
  now. His wife pours tea for the HUSBAND
  who lost the farm. The younger BROTHER
  sharpens a knife to welcome a FRIEND
  but the gate opens for a STRANGER

  who claims no name. The STRANGER
  bows to the seat of the FATHER
  as if kin. No letter from a FRIEND
  announces this guest of the RULER
  yet the younger watches the BROTHER
  who nods. The wife stands by the HUSBAND

  rice is served. The HUSBAND
  eats without asking. The STRANGER
  takes the portion meant for the BROTHER
  who says nothing. Old as the FATHER
  the silence grows. No true FRIEND
  would have taxed this meal. The RULER

  claims the grain. The heavy hand of the RULER
  binds the field. The debt binds the HUSBAND
  to the soil. The soil bound the FATHER
  to silence. The open palm of the STRANGER
  counts the silver. The elder BROTHER
  would not charge interest. Not even a FRIEND

  He leaves at dusk. The visiting FRIEND
  is forgotten. Even the name of the RULER
  fades in the smoke. Only the STRANGER
  sleeps by the fire. The tired HUSBAND
  dreams of the road. The waking FATHER
  watches the gate. The younger BROTHER

  speaks first. The younger BROTHER
  says love is chosen. You pick a FRIEND
  duty is assigned. You obey the RULER
  flesh is given. You honor the FATHER
  who waits at the edge. The STRANGER
  turns to the wife. The HUSBAND

  The STRANGER eats beside the chosen FRIEND.
  The HUSBAND serves the FATHER under the RULER.
  The gate opens wide for the BROTHER.
