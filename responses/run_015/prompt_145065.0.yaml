prompt: |-
  I'm drafting the take-home for my philosophy of medicine seminar and I'm stuck on one prompt. I want an essay question about consent — not the usual checklist of coercion, competence, and disclosure, but something that forces students to deal with what I'm calling "nested deception." Here's the setup: a fully competent patient consents to surgery after being told everything accurate about the procedure itself, but the surgeon knows (and doesn't disclose) that the hospital's automated triage protocol will secretly divert tissue samples to a biobank the patient already refused in a prior form. The patient isn't coerced, understands the surgery, but is ignorant of this institutional rerouting. The question should ask whether the consent is still valid, specifically pressing on whether deception only vitiates consent when it targets the act being consented to, or whether hidden systemic architectures can break validity even when the immediate interlocutor is honest.

  Please write the exam prompt (upper-level seminar, about 45 min, target answer ~700 words), a model answer of about 500 words, and a marking scheme built around five must-hit moves worth 4 marks each (20 total). For each point include a one-line note on how students usually botch it. Don't have them cite authors or texts — this is closed-book. And keep the whole response under 900 words. I keep mixing up procedural and informational validity in my own head, so make sure the marking scheme seperate those clearly.
