      **Exam Prompt: Nested Deception and Consent Validity**
      A competent patient consents to surgery after receiving full disclosure from the surgeon regarding the procedure's risks and benefits. However, the surgeon knows—but does not disclose—that hospital protocol automatically diverts excised tissue to a biobank, despite the patient having previously refused biobanking in a separate intake form. The patient is unaware of this diversion.

