  First, the scope of consent extends beyond the incision to the disposition of bodily materials. When a patient refuses biobanking, that refusal sets a boundary condition for any procedure involving tissue removal. By ignoring this, the hospital treats the consent as generic rather than specific. The patient consented to surgery *minus* biobanking. The protocol effectively alters the deal without renegotiation. Therefore, deception need not target the immediate act to vitiate consent; it can target the constitutive conditions of the act.

  Second, the systemic architecture functions as deception. Even if the surgeon speaks no falsehoods, the institutional process creates a false belief in the patient that their prior directives are respected. This is structural deception. It bypasses autonomy not through force, but through hidden rerouting. If consent is meant to protect autonomy, hiding the mechanism that violates prior autonomous choices defeats the purpose of consent entirely.

  Third, the surgeon is not a neutral conduit. Knowing the protocol exists and failing to disclose it makes the surgeon complicit. The fiduciary relationship requires advocating for the patient's stated values. Silence here is not neutrality; it is active concealment of a material fact—that the tissue will be used against the patient's wishes. The interlocutor is not honest if they withhold knowledge that fundamentally changes the nature of the agreement.

  This case necessitates distinguishing informational from procedural validity. Informational validity concerns the truthfulness of the disclosure relative to the patient's beliefs. Here, it fails because the surgeon omitted material information regarding tissue disposition. The patient believed one thing while reality was another. Procedural validity concerns the integrity of the authorization process itself. Here, it fails because the process ignored a prior valid refusal. The system processed the consent form but bypassed the refusal form. A valid procedure must account for conflicting directives, not simply overwrite them.

