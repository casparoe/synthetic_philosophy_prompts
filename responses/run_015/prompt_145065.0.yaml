      **Model Answer**
      Consent is not merely permission for a physical act; it is an authorization of a specific trajectory of care. In this case, while the patient understands the surgery, their consent is invalid because the "nested deception" of the hospital protocol undermines the conditions under which authorization was granted. Validity requires both informational truthfulness and procedural integrity, both of which are compromised here.

      First, the scope of consent extends beyond the incision to the disposition of bodily materials. When a patient refuses biobanking, that refusal sets a boundary condition for any procedure involving tissue removal. By ignoring this, the hospital treats the consent as generic rather than specific. The patient consented to surgery *minus* biobanking. The protocol effectively alters the deal without renegotiation. Therefore, deception need not target the immediate act (the cutting) to vitiate consent; it can target the constitutive conditions of the act.

      Second, the systemic architecture functions as deception. Even if the surgeon speaks no falsehoods, the institutional process creates a false belief in the patient that their prior directives are respected. This is structural deception. It bypasses autonomy not through force, but through hidden rerouting. If consent is meant to protect autonomy, hiding the mechanism that violates prior autonomous choices defeats the purpose of consent entirely.

      Third, the surgeon is not a neutral conduit. Knowing the protocol exists and failing to disclose it makes the surgeon complicit. The fiduciary relationship requires advocating for the patient's stated values. Silence here is not neutrality; it is active concealment of a material fact—that the tissue will be used against the patient's wishes. The interlocutor is not honest if they withhold knowledge that fundamentally changes the nature of the agreement.

      This case highlights the distinction between informational and procedural validity. Informational validity concerns the truthfulness of the disclosure. Here, it fails because the surgeon omitted material information regarding tissue disposition. The patient believed one thing (tissue discarded) while reality was another (tissue banked). Procedural validity concerns the integrity of the authorization process. Here, it fails because the process ignored a prior valid refusal. The system processed the consent form but bypassed the refusal form. A valid procedure must account for conflicting directives, not simply overwrite them.

      Ultimately, consent is invalid. To argue otherwise is to reduce consent to a signature on a form rather than a continuous exercise of autonomy. If systemic architectures can override explicit refusals without disclosure, consent becomes a ritual rather than a protection. The deception is nested within the institution, but its effect is to sever the link between the patient's will and the medical outcome. Therefore, even with a competent patient and an honest surgeon regarding the surgery itself, the hidden systemic violation of prior conditions renders the authorization void.

