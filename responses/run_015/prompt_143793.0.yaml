  hey so in my ethics class my teacher keeps saying "if you do the right thing for the wrong reason, it doesnt really count" and she used it to shut down this example i brought up about donating to charity mainly for the tax writoff but also kinda caring. she said it has zero moral worth. but that sounds like it could mean like five different things and i want the menu. like is she saying your action has no value at all? or that you dont get personal credit? or that the reason has to be the only one? and what if you have two reasons at once — like reason A is good and reason B is selfish, but you would still do it even without B? is that "the right reason"? lay out the different precise theses that slogan could be hiding, from the trivial "intentions matter a little" to the radical "any selfish contamination voids everything." for each one say whether its just a platitude, whether its actually defensible, or whether its flat-out false. and tell me which reading my teacher was probably using when she dismissed the tax-break donor, and which readings wouldnt actually support that dismissal. also i made up this idea of "reason-overdetermination" where both motives are present but the good one is sufficient — does that change anything? dont just pick one answer, i want the list i can bring back to class.
