      *   *Refining Step 2:* "If I do X, Future-Me concludes X was best." This is the "Newcomb problem" / "Ratification" vibe. If I choose X, I must believe X was the right choice to be coherent. But this doesn't mean X yields better utility than Y. It means X is *consistent with my choice*.
      *   So "Best" in ST means "Consistent with Agency," not "Maximizes Utility."
