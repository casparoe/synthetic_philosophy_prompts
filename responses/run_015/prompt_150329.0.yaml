  Breaker: Someone who meets 1 and 2, but the crime is so heinous that granting amnesty violates the *spirit* of the commission, even if it meets the *letter*. OR, someone who fails 1 (not political) but provides truth so valuable it outweighs the statutory requirement.
  Let's go with the "Scale/Gravity" breaker. A general who confesses to a massacre (political, full truth, no remorse). Does the "Conscript Rule" (no remorse needed) hold for a massacre? That breaks the implicit "proportionality" assumption.

