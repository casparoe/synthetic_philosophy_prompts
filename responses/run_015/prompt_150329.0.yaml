prompt: |-
  Im clerking for the truth commission in the country I'm in now, and I have to draft the recommendation memo on our next amnesty application, so I'd love your read on how our own precedents hang together.

  The statute says amnesty is available for politically motivated offences committed during the conflict, in exchange for full disclosure, and we've said almost nothing beyond that about what "full" means or who actually deserves it. Our decisions so far: granted to a young conscript who confessed to shooting one man during a village sweep — account checked out, zero remorse, said he'd do it again; denied to a senior intelligence officer who confessed to a great deal but wouldn't name the minister who signed off on it; denied to a man who confessed fully to a killing in the same years that turned out to be a land feud with no political connection; granted to a mid-level guerrilla commander who confessed to a bombing that killed civilians, named his own superiors (both long dead), and apologised to the families in the public hearing; granted to a police interrogator who confessed to torturing detainees as part of the counterinsurgency, described his methods, named his victims, and expressed remorse.

  New applicant: a police station commander who ordered the torture of about a dozen detainees but never laid hands on anyone himself. His account of what he ordered and what he knew is full and verifiable, and he names the provincial chief who set the policy — now a sitting legislator — and his testimony plus the documents he handed over are the first real evidence tying that legislator to any of it. He shows no remorse whatsoever: says the torture stopped bombings, that he'd order it again, and that the people he ordered it on were combatants. The victims' families are demanding prosecution.

  What do you think the panel does with him? More useful for my memo: what are the two or three rules that fit all five precedents about equally well, what does each predict here, which precedent is the closest analog, and what is the commission committing itself to whichever way it goes? And what single applicant would actually force those rules apart, if we ever get one?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Clerk for a Truth Commission.
      *   **Task:** Draft a recommendation memo on a new amnesty application.
      *   **Input:** Statutory framework (politically motivated offences, conflict period, full disclosure), five past precedents (decisions + reasoning), and the new applicant's profile.
      *   **Specific Questions to Answer:**
          1.  What should the panel do with the new applicant?
          2.  What are 2-3 rules/principles that fit all five precedents?
          3.  What does each rule predict for the new applicant?
          4.  Which precedent is the closest analog?
          5.  What is the commission committing to (implications) whichever way it goes?
          6.  What single hypothetical applicant would force those rules apart (the "breaker" case)?

  2.  **Deconstruct the Precedents:**
      *   *Case 1 (Conscript):* Granted. Low level, one killing, political context (village sweep), full disclosure, *no remorse*, "would do it again."
      *   *Case 2 (Intel Officer):* Denied. Senior level, full disclosure of acts, *withheld names* (minister), political context implied but incomplete disclosure.
      *   *Case 3 (Land Feud):* Denied. Full disclosure, *not political* (personal feud), killing.
      *   *Case 4 (Guerrilla Commander):* Granted. Mid-level, bombing (civilians), political context, named superiors (dead), *remorse*, apologized.
      *   *Case 5 (Interrogator):* Granted. Direct perpetrator (torture), political context (counterinsurgency), full disclosure, named victims, *remorse*.

  3.  **Analyze the New Applicant:**
      *   **Role:** Police Station Commander (Mid/Senior level).
      *   **Act:** Ordered torture (dozen detainees), did not physically perpetrate.
      *   **Disclosure:** Full, verifiable, names a sitting legislator (high value evidence).
      *   **Motivation:** Political/Counterinsurgency (claims torture stopped bombings).
      *   **Remorse:** None. Justifies actions, would do it again.
      *   **Victim Impact:** Families demand prosecution.

  4.  **Derive Rules from Precedents:**
      *   *Observation 1 (Politics):* Case 3 was denied because it wasn't political. All granted cases were political. -> *Rule A: Political Motivation is necessary.*
      *   *Observation 2 (Disclosure):* Case 2 was denied because he withheld a name. All granted cases named names or disclosed fully. -> *Rule B: Full Disclosure (including superiors) is necessary.*
      *   *Observation 3 (Remorse):* Case 1 (No remorse) = Granted. Case 4 (Remorse) = Granted. Case 5 (Remorse) = Granted. -> *Rule C: Remorse is NOT necessary.* (This is crucial because the new applicant lacks remorse).
      *   *Observation 4 (Severity/Role):* Case 1 (Shooting) = Granted. Case 4 (Bombing civilians) = Granted. Case 5 (Torture) = Granted. Case 2 (Senior Intel) = Denied (but due to disclosure). New Applicant (Ordering Torture) = ?
      *   *Synthesis:* The tension is between *Disclosure Value* vs. *Moral Acceptability/Remorse*.
      *   *Drafting Rule 1 (The Transactional Rule):* Amnesty is a trade. Truth for Immunity. If the truth is complete and political, amnesty follows regardless of remorse. (Supported by Case 1 & 5).
      *   *Drafting Rule 2 (The Proportionality/Gravity Rule):* Amnesty is reserved for those who were "caught in the machine" or show rehabilitation. Direct perpetrators with remorse get it; cold-blooded commanders might not. (Supported by Case 4 & 5 vs. Case 1 outlier). *Wait, Case 1 breaks this.* Case 1 had no remorse and got it. So "Rehabilitation" isn't a strict rule.
      *   *Drafting Rule 3 (The Hierarchy/Responsibility Rule):* Those higher up must provide *more* truth to get amnesty. Case 2 denied for hiding a name. Case 4 granted for naming dead superiors. New applicant names a *living* VIP.
      *   *Refining the Rules:*
          *   **Rule 1: The "Full Truth" Threshold.** Amnesty requires complete disclosure of acts *and* chain of command. (Fits Cases 1, 4, 5 [Granted] vs 2, 3 [Denied]).
          *   **Rule 2: The "Political Nexus" Requirement.** The act must serve a political objective, not personal gain/feud. (Fits Case 3 denial vs all grants).
          *   **Rule 3: The "Remorse Irrelevance" Principle.** Personal contrition is not a statutory requirement; the focus is on factual disclosure. (Fits Case 1 [No remorse/Granted] vs Case 4/5 [Remorse/Granted]).

  5.  **Apply Rules to New Applicant:**
      *   *Rule 1 (Full Truth):* He provided full truth + documents + named a sitting legislator. *Predicts: Grant.*
      *   *Rule 2 (Political Nexus):* He claims counterinsurgency (political). Verifiable context. *Predicts: Grant.*
      *   *Rule 3 (Remorse):* He has none. But Case 1 had none and got amnesty. *Predicts: Grant.*
      *   *Conflict:* The victims' families demand prosecution. The "moral cost" is higher than Case 1 (one shooting vs. dozen tortures) and Case 5 (direct torture vs. ordering). But legally, he fits the "Grant" profile better than the "Deny" profile.

  6.  **Identify Closest Analog:**
      *   *Case 1 (Conscript):* Both lack remorse. But Conscript was low level, direct actor. New applicant is commander, indirect.
      *   *Case 5 (Interrogator):* Both torture. But Interrogator had remorse and was direct actor.
      *   *Case 2 (Intel Officer):* Both senior/Command. But Intel Officer withheld info. New applicant gave info.
      *   *Best Fit:* **Case 1 (The Conscript).** Why? Because it establishes the precedent that *remorse is not required*. If you deny the Commander because he lacks remorse, you undermine Case 1. If you grant him, you align with Case 1's logic (Truth > Feelings).
      *   *Alternative Best Fit:* **Case 5 (The Interrogator).** Why? Same crime (torture). But the remorse difference is the pivot.
      *   *Decision:* Case 1 is the stronger legal analog for the *remorse* issue. Case 5 is the stronger factual analog for the *crime* issue. I should highlight this tension. Actually, Case 1 is the critical one for the *rule* about remorse.

  7.  **Analyze Implications (Commitment):**
      *   *If Granted:* Commission commits to being a "Truth Market." Truth is a commodity bought with amnesty, regardless of the applicant's morality. It risks alienating victims (instrumentalizing justice). It empowers the Commission to take down big fish (the legislator).
      *   *If Denied:* Commission commits to being a "Moral Arbiter." Remorse/Gravity matters more than Truth. It protects victim dignity but risks losing the evidence against the legislator and creates inconsistency with Case 1 (Conscript). It shifts the goal from "What happened?" to "Who is sorry?"

  8.  **Identify the "Breaker" Case:**
      *   Need a scenario where the rules conflict.
      *   Current Rules: Political + Full Truth = Amnesty (Remorse irrelevant).
      *   Breaker: Someone who provides *partial* truth but shows *extreme remorse*? Or someone who provides *full truth* but the act was *clearly personal* but claimed political?
      *   *Better Breaker:* A high-level architect who confesses fully, shows deep remorse, but reveals the "political motive" was actually a pretext for personal enrichment (corruption masquerading as conflict). This tests Rule 2 (Political Nexus) vs. Rule 1 (Full Truth Value).
      *   *Even Better Breaker:* A perpetrator who confesses fully to a political crime, shows no remorse (like Case 1), but the crime is *significantly* more heinous (e.g., genocide/systematic extermination vs. single killing). At what point does Gravity override the "Remorse Irrelevance" rule?
      *   *Selection:* The "Architect of Atrocity" who confesses fully, no remorse, but the scale is massive. This forces a choice between "Truth Value" (we need to know everything) and "Moral Limit" (some things are too big for amnesty).

  9.  **Drafting the Memo:**
      *   Tone: Professional, legalistic, analytical, objective.
      *   Structure: Executive Summary, Precedent Analysis (The Rules), Application to New Case, Implications, The "Breaker" Scenario.

  10. **Refining the Output:**
      *   Make sure to explicitly answer the prompt's specific questions.
      *   Ensure the distinction between "ordering" vs "doing" is addressed (Command Responsibility).
      *   Highlight the tension between the Conscript (no remorse/granted) and the Commander (no remorse/?).
      *   *Self-Correction on Case 1:* Case 1 is the key. If the Commission denies the Commander for lack of remorse, they implicitly overrule Case 1. They must admit Case 1 was an outlier or establish a "Gravity Threshold."
      *   *Re-evaluating the Rules:*
          *   Rule 1: Political Nexus (Case 3 denial).
          *   Rule 2: Completeness of Disclosure (Case 2 denial).
          *   Rule 3: Remorse is Discretionary/Non-Essential (Case 1 Grant vs Case 4/5 Grant).
      *   *Prediction:* All three rules point to **Granting**.
      *   *The Catch:* The "Ordering" aspect. Does command responsibility change the "Full Disclosure" requirement? He disclosed what *he* did.
      *   *Implication:* Granting makes the Commission a tool for political destabilization (taking down the legislator) at the cost of victim satisfaction. Denying makes it a moral court, potentially losing the truth.

  11. **Final Polish:** Check the voice. "Clerking for the truth commission." Needs to sound like internal legal counsel. Clear, concise, actionable. (Proceed to generate response).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just say "Grant." I need to explain the *risk*. The prompt asks "What do you think the panel does?" I should give a recommendation based on the logic, but highlight the danger. The logic dictates a Grant, but the politics might dictate a Denial. I will recommend following the precedent (Grant) to maintain institutional integrity, but warn of the cost.

