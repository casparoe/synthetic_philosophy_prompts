              1.  Contradiction in Conception (CC) = Fixed-point failure (success conditions presuppose a background pattern universalization destroys), not logical contradiction.
              2.  This reveals an "Aggregation Gap": Maxims of non-contribution in collective action problems pass CC (no individual omission causes harm) and only trigger Contradiction in Will (CW)/Imperfect Duty, which is too weak.
              3.  Fixing this by universalizing over distributions turns FUL into Rule-Consequentialism (RC) and loses first-personal deliberative character. The author chooses to *keep* the gap and the first-personal character.
          *   *The Room:*
              1.  Two Kant Textualists (Groundwork/DoV, German, care about CC/CW distinction, examples, usability).
              2.  One Analytic Ethicist (Sympathetic to Rule-Consequentialism, sees Kant as crude ancestor).
              3.  One Political Philosopher (Structural injustice/collective action, likes the gap, draws different moral).
