answer: |-
  ### Internal Memo: Job Talk Strategy
  **To:** Candidate
  **From:** Senior Colleague
  **Re:** The Room and Your Paper

  I've sat in on enough searches to know how this plays out. You have a clever paper, but it walks a tightrope. You are telling the Textualists that Kant's system has a hole (the Aggregation Gap), while telling the Consequentialist that the obvious fix is forbidden. You are telling the Political Philosopher that structural injustice can't be captured by individual maxims, but then refusing to abandon individual maxims.

  Here is the breakdown of the room's psychology before we get to the Q&A:

  *   **The Textualists (x2):** They are worried you are importing game theory ("fixed-point") into the *Groundwork* anachronistically. They want to know if your reading survives the German terminology (*Widerspruch*) and the other three examples. They will protect the integrity of the CC/CW distinction. If you blur them to solve the gap, they will eat you alive.
  *   **The Analytic Ethicist:** They think you are reinventing the wheel. They see the "Aggregation Gap" as proof Kant is obsolete. They want you to admit that Rule-Consequentialism (RC) just *is* the mature version of what you're describing. They will attack your reason for rejecting RC ("first-personal character") as sentimental.
  *   **The Political Philosopher:** They love the "Aggregation Gap" diagnosis but will hate your prescription ("live with it"). To them, "living with the gap" means accepting that Kantianism is useless for climate change or voting. They want you to propose a structural supplement, not shrug.
  *   **The Generalists:** They are the swing votes. If the "fixed-point" explanation sounds like jargon, they tune out. If the conclusion sounds like "Kant doesn't work," they worry about your research trajectory.

  You cannot satisfy everyone. Your goal is to make the Textualists feel you respect the text, the Pol Phil feel you understand the stakes, and the Analytic feel you have a principled (not dogmatic) reason for rejecting their view.

  Here is your prep sheet.

  ***

  ### Q&A Prep Sheet: 8 Likely Objections

  **1. The "So What?" Objection (Likely: Analytic Ethicist / Pol Phil)**
  *   **Phrasing:** "You've identified a gap where individual Kantian deliberation fails to prohibit actions that collectively destroy goods. You admit Rule-Consequentialism fixes this. If your theory yields moral blind spots on issues like climate or voting, why isn't that a *reductio* of the Kantian framework rather than a feature we should 'live with'?"
  *   **Reply (2 mins):** "It's a *reductio* only if we assume morality must be fully action-guiding in every context from the first-person perspective. My claim is that the 'gap' marks the boundary of individual imputability. If I cannot causally effect the outcome, commanding me to produce it treats me as a mere vessel for the good, violating the Formula of Humanity. We 'live with the gap' not because collective harm doesn't matter, but because morality cannot demand I solve structural problems through individual maxims alone. The gap signals the need for political, not just moral, institutions."
  *   **Soft Spot:** This risks sounding like you're washing your hands of collective harm.

  **2. The Textual Fit Objection (Likely: Textualist #1)**
  *   **Phrasing:** "Your 'fixed-point failure' sounds like a coordination problem. But in the *Groundwork*, Kant describes the contradiction in the false promise case as the *impossibility* of the promise itself, not just the destruction of its utility. Are you not collapsing the Contradiction in Conception into a Contradiction in Will by making it depend on the *success conditions* of the action?"
  *   **Reply (2 mins):** "I distinguish them by the locus of the failure. In CC, the *concept* of the action becomes untokenable because the background institution it relies on vanishes (a fixed-point failure). In CW, the action is possible, but the agent cannot rationally will the *world* where it happens. The false promise is CC because 'promising' loses its meaning without trust; it's not just that I *want* trust, it's that the act becomes conceptually void."
  *   **Soft Spot:** Textualists may argue Kant's "vanishing of trust" is already a consequence-based worry, undermining your non-consequentialist reading.

  **3. The Rule-Consequentialist Disguise (Likely: Analytic Ethicist)**
  *   **Phrasing:** "You say universalizing over distributions loses the first-personal character. But if the test asks 'what if everyone in relevantly similar circumstances did this,' isn't that just evaluating the rule by its consequences? What work is 'first-personal character' actually doing other than branding?"
  *   **Reply (2 mins):** "The work is imputation. RC asks 'Which rule produces the best state of affairs?' My reading asks 'Can *I* adopt this maxim without undermining the conditions of my own agency?' The input is my maxim, not a social policy. The moment we shift to optimizing distributions, I am no longer testing my will, but calculating outcomes. That shifts the normative source from autonomy to optimificity."
  *   **Soft Spot:** If pressed, the distinction between "my agency" and "states of affairs" can look thin when the outcome is the same.

  **4. The Imperfect Duty Pushback (Likely: Textualist #2)**
  *   **Phrasing:** "You claim the aggregation gap yields only a Contradiction in Will (Imperfect Duty). But surely Kant thinks we have a strict duty not to undermine necessary institutions. If universal omission destroys the good, why isn't that a perfect duty to contribute?"
  *   **Reply (2 mins):** "Because a perfect duty requires that the omission of the act *in the single case* generates a contradiction. In aggregation cases, my single omission is causally inert. To make it a perfect duty, we would have to attribute the collective outcome to the individual, which violates the 'ought implies can' constraint in causal terms. Kant reserves perfect duties for where the individual will directly contradicts itself."
  *   **Soft Spot:** This makes Kant look weak on duties of justice regarding institutions.

  **5. The Structural Injustice Challenge (Likely: Political Philosopher)**
  *   **Phrasing:** "You say the gap signals the need for political institutions. But if Kantian ethics can't tell me to vote or recycle because my individual impact is negligible, isn't it complicit in the structural injustice it identifies? Why should we use a deliberative tool that blinds us to structural harm?"
  *   **Reply (2 mins):** "It doesn't blind us; it locates the harm correctly. The harm is structural, not individual. Using Kant to solve structural problems individually is category error. The Kantian diagnosis tells us *why* individual guilt is the wrong framework here, pushing us toward designing institutions where the maxim 'I will omit my share' *does* generate a contradiction (e.g., through enforcement)."
  *   **Soft Spot:** Risks sounding like you're outsourcing morality to the state.

  **6. The "Fixed-Point" Clarity Check (Likely: Generalist #1)**
  *   **Phrasing:** "Can you give a non-technical example of a 'fixed-point failure' that isn't just a bad consequence? I'm worried this is just consequentialism with extra steps."
  *   **Reply (2 mins):** "Consider a queue. If I cut in line, the maxim is 'I will skip when impatient.' If everyone does, the *concept* of a queue (ordered waiting) dissolves. It's not just that waiting takes longer (consequence); it's that 'cutting' presupposes a line that no longer exists. The action eats its own precondition. That's a fixed-point failure, distinct from 'waiting longer is bad.'"
  *   **Soft Spot:** Queues are trivial compared to the moral examples; scaling this up to "promising" is where the friction lies.

  **7. The Other Examples (Likely: Textualist #1)**
  *   **Phrasing:** "Does this reading work for the Suicide or Talents examples? It's easy to make the False Promise case look like a coordination problem. Does 'developing talents' have a fixed-point failure?"
  *   **Reply (2 mins):** "For Talents, the fixed point is the agent's own rational nature. A maxim to neglect talents presupposes a rational agent who sets ends. Universal neglect destroys the capacity to set ends effectively. It's a fixed-point failure of the *agent's* capacity, not a social institution. The structure holds, but the locus shifts from interpersonal to intrapersonal."
  *   **Soft Spot:** This stretches the "fixed-point" metaphor significantly.

  **8. The Career Trajectory Worry (Likely: Generalist #2 / Chair)**
  *   **Phrasing:** "If you're living with the gap, where does the research go next? Are you just defending Kant's limitations, or are you building a positive theory of collective action?"
  *   **Reply (2 mins):** "The next step is the political supplement. I'm arguing that Kantian ethics *requires* a Kantian political philosophy to fill the gap. My future work connects the moral limitation to the necessity of public law. It's not a dead end; it's a bridge to political philosophy."
  *   **Soft Spot:** If they don't want a political philosopher, this might miss the mark.

  ***

  ### Strategic Advice

  **1. What to Concede in the First Two Minutes**
  Concede immediately that **Kantian individual deliberation is insufficient for solving large-scale collective action problems.** Do not try to argue that Kant *can* solve climate change via the FUL.
  *   *Why:* The Pol Phil and the Analytic Ethicist will smell blood if you try to defend Kant's sufficiency here. By conceding the limitation, you disarm the "Kant is obsolete" attack and position yourself as a clear-eyed diagnostician. Say: "Kant's system is not a complete theory of structural justice. My paper explains *why* it isn't, and why that matters."

  **2. The Single Reply That Must Land**
  You must land the defense of **"First-Personal Character" (Objection #3).**
  *   *Why:* If the Analytic Ethicist convinces the room that your distinction between your view and Rule-Consequentialism is merely terminological, your paper becomes a footnote to Smart or Hooker. You must convince them that *imputability* requires the first-personal constraint. If you lose this, you aren't doing Kantian ethics; you're doing bad consequentialism.
  *   *Key phrase to use:* "Morality is about what I can answer for, not just what happens."

  **3. The One Question You Hope Nobody Asks**
  *"If the test fails on collective action, and the fix turns it into consequentialism, why should we teach Kant to undergraduates as a normative theory rather than a historical artifact?"*
  *   *Why:* This combines the Analytic's "it's obsolete" with the Generalist's "does this matter?" and forces you to defend the pedagogical value of a theory you just admitted has a "gap."
  *   *If asked:* Pivot to the "diagnostic value." We teach it not because it solves every problem, but because it correctly identifies the limits of individual agency, preventing moral burnout and misdirected guilt. (See Reply #1 and #5).

  **Final Note:** The Textualists are your anchor. If they nod, the Analytic won't sink you. Keep the German terms ready (*Grundlegung*, *Maxime*), but don't overuse them. Good luck.
