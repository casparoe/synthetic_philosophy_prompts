answer: |-
  # The Hard Choices Intuition Quiz

  **Instructions:** For each scenario, pick the answer that best matches your gut reaction. Don't overthink the philosophy; pick what feels true.

  **1. The Career Choice**
  You must choose between being a Lawyer (wealthy, secure) or an Artist (poor, meaningful). You are equally skilled at both. There is no clear winner.
  *   **A.** One is objectively better; I just don't know which yet.
  *   **B.** Neither is better; they are fundamentally different kinds of good.
  *   **C.** They are comparable, but not in terms of one being better than the other.

  **2. The Small Improvement**
  You can't decide between Job A and Job B. Now imagine Job A+ (Job A plus a $100 bonus).
  *   **A.** Job A+ is definitely better than Job B.
  *   **B.** The $100 doesn't help; A+ and B are still incomparable.
  *   **C.** A+ is still not "better" than B, but the choice changes.

  **3. Indifference**
  Regarding the Lawyer vs. Artist case: Are you indifferent between them?
  *   **A.** Yes, effectively.
  *   **B.** No, indifference implies equality, and these aren't equal.
  *   **C.** No, but they are "on a par."

  **4. The Coin Flip**
  Is it rational to flip a coin to decide between the Lawyer and Artist careers?
  *   **A.** No, reason should decide.
  *   **B.** Yes, because reason runs out.
  *   **C.** Yes, because both are permissible options.

  **5. The Super-Computer**
  Could an omniscient being calculate which option is better?
  *   **A.** Yes, values reduce to a single metric.
  *   **B.** No, there is no fact of the matter.
  *   **C.** No, because "better" isn't the right relation.

  **6. Friend vs. Strangers**
  You can save your best friend or two strangers from harm.
  *   **A.** Save the two strangers (numbers count).
  *   **B.** Save the friend (special obligations aren't quantifiable).
  *   **C.** Either is permissible; they are on a par.

  **7. Rational Regret**
  You choose Artist. Is it rational to regret not choosing Lawyer?
  *   **A.** No, you chose the best option.
  *   **B.** Yes, because a genuine value was lost.
  *   **C.** Yes, but only because the options were comparable.

  **8. The Trichotomy**
  When comparing two items, are "better than," "worse than," and "equal to" the only possible relations?
  *   **A.** Yes, logically exhaustive.
  *   **B.** Yes, but sometimes none apply.
  *   **C.** No, there is a fourth relation (parity).

  ---

  ### Scoring Key

  Tally your answers.

  *   **Mostly A: The Commensurabilist / Epistemic View**
      You believe values can be weighed on a single scale. Hard choices are just difficult calculations or cases of missing information. There is always a fact of the matter about what is best.
  *   **Mostly B: The Incomparabilist (Raz-style)**
      You believe some values are fundamentally different. Rational comparison sometimes fails entirely. When values clash, reason may go silent, leaving no fact about which is better.
  *   **Mostly C: The Parity View (Chang-style)**
      You believe options can be comparable without one being better. They are "on a par." Hard choices are opportunities to create reasons through commitment, not just discover them.

  *(If you have a mix of A and B, you may hold an Epistemic view where values are distinct but facts exist. If you mix B and C, you agree reason runs out but disagree on whether comparison remains.)*

  ---

  ### Limitations & Flags

  **1. Commensurabilism vs. Epistemic View**
  This quiz cannot cleanly separate these two. Both agree there is a "correct" answer (Option A in Q1/Q5). The difference is metaphysical: Commensurabilists say values *are* on one scale; Epistemicists say values might be distinct but there is still a truth about which is better. Your choices here reveal your view on *rationality*, not necessarily the metaphysics of value.

  **2. Incomparability vs. Parity**
  Both views deny the trichotomy (Better/Worse/Equal). Incomparabilists say comparison fails entirely; Parity theorists say comparison succeeds via a fourth relation. In practice (Q2/Q4), these often look identical: the small improvement doesn't tip the scale, and will/power is needed. Distinguishing them requires deeper metaphysical commitment than case intuitions alone provide.

  **3. The "Small Improvement" Trap**
  Question 2 is the philosophical heavyweight. If you answered **A**, you are committed to commensurability. If you answered **B** or **C**, you reject it. However, maintaining **B** (Incomparability) consistently can make rational choice look impossible, while **C** (Parity) requires accepting a non-standard logic of comparison.
