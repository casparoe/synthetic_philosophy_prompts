      *   *Better Rule:* "State Machine." Each person has a state (0 or 1). They update based on neighbors.
      *   *Let's go with a 'Signal Routing' game.* It's more intuitive for SWEs. Input enters one side, must exit the other.
      *   *Wait, the prompt asks for 'Resource-Allocation or Routing'.* Let's do Routing. It maps better to "Information Processing" (Thinking).
      *   *Revised Activity:* "The Human Packet Switch."
      *   *Nodes:* Hold cards. Can only pass to adjacent. Must get specific token to specific exit.
      *   *Observers:* Watch the flow.
      *   *Actually, to hit the 'Mind' angle:* The system needs to *adapt*. If a path is blocked, does the "System" find a new way? Yes. Does the *Node* know? No.
      *   *Okay, final plan:*
