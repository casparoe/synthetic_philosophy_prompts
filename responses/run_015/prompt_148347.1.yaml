          *   **Phase 1 (Nodes):** Participants stand in a grid. They have a state (e.g., hand up/down). They can only talk to immediate neighbors. They must achieve a global pattern (e.g., a wave, a specific shape) without knowing the global goal initially, or by receiving a "stimulus" and reacting.
