answer: |-
  You have essentially reinvented Aristotelian economics through intuition. Your gut reactions map almost perfectly onto the distinction Aristotle draws in *Politics* (Book I) and *Nicomachean Ethics* (Book V) between **natural acquisition** (*oikonomia*) and **unnatural wealth-getting** (*chrematistike*).

  Here is the principle you are looking for, followed by an analysis of your cases, the one verdict you might need to nuance, and the judgment on algorithmic pricing.

  ### The Principle: Teleology and Community
  For Aristotle, every object has a *telos* (purpose). A shoe is for wearing; food is for eating; insulin is for health.
  *   **Just Exchange:** Occurs when goods circulate to satisfy natural needs within a community (*koinonia*). Money is merely a tool to facilitate this. The goal is the "Good Life" (*eudaimonia*), which requires sufficient resources and strong social bonds (*philia*).
  *   **Unjust Exchange:** Occurs when the *telos* of the good is subordinated to the accumulation of money itself. This is *chrematistike*. It is "unnatural" because there is no limit to how much money one can want, whereas there is a limit to how many shoes one needs.

  **The Gut Check Rule:** Does this exchange strengthen the social fabric and satisfy a need, or does it exploit a need to extract unlimited value?

  ### Analyzing Your Cases

  **1. The Laptop (Friend/Move)**
  *   **Verdict:** Fine/Good.
  *   **Aristotelian View:** This is *oikonomia*. You are managing household resources to help a member of your extended "household" (friendship circle). The "price" isn't just $200; it includes the labor of moving and the reinforcement of *philia* (friendship). The exchange is reciprocal but not strictly quantified, which is appropriate for friends.

  **2. Bottled Water (Blackout)**
  *   **Verdict:** Not Fine.
  *   **Aristotelian View:** This is *chrematistike* at its worst. Water's *telos* is to sustain life. During a blackout, need is absolute. Charging a premium treats a necessity of life as a mere instrument for profit. It disrupts the polis by placing accumulation above survival.

  **3. Bread and Jam (Swap)**
  *   **Verdict:** Totally Fine.
  *   **Aristotelian View:** This is the ideal of natural barter. Both parties satisfy a need (variety in diet) and both feel they gained. There is no "profit" in the modern sense, only mutual benefit. Aristotle notes that before money, this was the standard and it is naturally just.

  **4. Insulin (Monopoly/Resale)**
  *   **Verdict:** Deeply Wrong/Corrupt.
  *   **Aristotelian View:** This is the logical extreme of *chrematistike*. It is not just unfair; it is "corrupt" because it perverts the purpose of medicine (health) into a mechanism for extraction. Aristotle would likely compare this to usury (money breeding money), which he hated most because it is completely detached from natural need.

  **5. The Farmer (Price Discrimination + Arbitrage)**
  *   **Verdict:** You are stuck.
  *   **Aristotelian View:** This is the most complex case.
      *   *Price Discrimination:* Aristotle actually supports this **if** based on ability to pay. Justice is proportional, not identical. Charging the rich more to subsidize the poor aligns with social harmony.
      *   *The Arbitrage:* The problem arises if the farmer *knows* the poor buyer is reselling. If the poor buyer becomes a merchant (*kapelos*), the transaction shifts from *oikonomia* (feeding the poor) to *chrematistike* (trade for profit).
      *   *Resolution:* If the farmer intends charity, it is good. If the farmer is manipulating the market to maximize total yield by using the poor as a conduit, it slides toward the unnatural.

  **6. The Neighbor (Cleaning)**
  *   **Verdict:** Flip-flopping (Need vs. Guilt).
  *   **Aristotelian View:** Your flip-flop is correct and necessary. Aristotle distinguishes between **legal justice** (contracts/wages) and **friendly justice** (gifts/favors).
      *   *If she needs cash:* You are providing a wage for a need. This is a functional exchange that supports her household (*oikos*). It is just.
      *   *If she does it for fun:* The wage is no longer a wage; it is a disguised gift. If you are paying out of *guilt*, you are distorting the relationship. You are treating a friend like a employee to assuage your own conscience. This creates a false hierarchy. Aristotle would say the *intent* makes the action virtuous or vicious. The money is the same, but the moral quality of the act changes.

  ### The Algorithmic Pricing Question
  **Is it closer to the Farmer or the Insulin case?**

  It is unequivocally the **Insulin case**.

  Algorithmic pricing that scans for desperation is the technological perfection of *chrematistike*.
  1.  **Detachment from Telos:** It ignores what the good is *for* (transport, food, shelter) and focuses entirely on what the buyer can be *made to pay*.
  2.  **Exploitation of Vulnerability:** In the Farmer case, the price discrimination can be benevolent (charging the rich more to help the poor). Algorithmic pricing does the opposite: it identifies vulnerability (desperation) and extracts more.
  3.  **Unlimited Accumulation:** It removes the human limit. A human merchant might feel shame charging a desperate person too much. An algorithm has no shame; it has only the goal of maximization.

  Aristotle would view this as a form of usury without the loan. It is making money from money (data) by exploiting the necessity of the user.

  ### Which Verdict Must You Throw Out?

  You don't have to throw out a verdict, but you must **refine the Neighbor case.**

  Your intuition that it feels "worse" if she's doing it for fun and you're paying out of guilt is the correct Aristotelian insight. You might think, "The money is the same, so the outcome is the same." Aristotle would reject this.

  *   **Why:** Virtue ethics is about the *character* of the agent and the *truth* of the relationship.
  *   **The Correction:** If she cleans for fun and you pay her $20/hr out of guilt, you are lying to yourself about the nature of your relationship. You are turning a friendship into a transaction to manage your own ego. That is a corruption of *philia*.
  *   **The Fix:** If she does it for fun, offer a gift (dinner, a favor), not a wage. A wage implies necessity and subordination; a gift implies equality and gratitude.

  ### Summary of the Aristotelian "Gut Check"

  If you want to run future cases through this filter, ask three questions:

  1.  **What is the good?** Is it being used for its natural purpose (eating, living, health), or as a chip for accumulation?
  2.  **What is the relationship?** Is this between friends/citizens (governed by reciprocity and need) or strangers/merchants (governed by contract and profit)?
  3.  **What is the limit?** Does the exchange stop when the need is met (*oikonomia*), or does it continue as long as profit can be squeezed (*chrematistike*)?

  Your intuitions are sound. The "corrupt" feeling you get from the insulin and algorithmic cases is the recognition that the **economy is eating the society**, rather than serving it. Aristotle would tell you to trust that feeling.
