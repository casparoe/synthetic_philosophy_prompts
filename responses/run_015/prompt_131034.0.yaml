          *   *Chrematistike* (Wealth-Getting): Acquisition for the sake of accumulation. Unlimited.
          *   *Natural vs. Unnatural Exchange:* Barter for need is natural. Retail trade for profit is unnatural (or at least suspect).
          *   *Justice in Exchange:* Reciprocity proportional to need/status, not just strict equality.
