prompt: |-
  I serve on the evaluation board for a research fund that supports historical studies treating non-human forces—pathogens, long-term climate oscillations, and volcanic eruptions—as active contributors to political and social change. Our concern is not denying that the Black Death altered labor markets or that the Tambora eruption disrupted harvests, but rather preventing a slide into environmental determinism, in which complex human institutions are reduced to passive outputs of temperature curves or aerosol loads. In reviewing proposals, I have noticed a recurring failure mode that lacks a standard label: investigators frame a germ or a climate shift as a kind of historical speaker only after outcomes are fixed, attributing intentionality-like effects—for instance, writing that the plague demanded new contracts—in narrative reconstructions, while treating the same forces as blind mechanisms in predictive or comparative analyses. I also see a related distortion, which I think of as scalar slippage, where macro-level agency is assigned to a micro-level process—claiming, say, that the Little Ice Age caused the Thirty Years' War—without specifying the mediating institutional pathways, so that the climate event absorbs explanatory weight that actually belongs to diplomatic choices and resource conflicts.

  Please construct a reusable decision procedure that our panel can apply to any proposal of this kind. The procedure should take the form of an ordered checklist: the questions to ask in sequence, what counts as a sufficient answer to each, the precise point at which the proposal receives a negative determination, and the points where the evaluation must be handed over to human judgment because the issue is normative rather than empirical. The procedure needs to distinguish legitimate causal attribution—showing that a volcanic winter constrained available options—from determinism—treating human societies as inevitable outputs of geophysical conditions. It should specifically include tests for the two failure modes I described: post-hoc ventriloquism and scalar slippage. Then apply the procedure to two concrete cases: a study arguing that the Black Death's mortality patterns directly reshaped English labor contracts in the 1350s, and a study arguing that the 1783 Laki fissure eruption was a decisive actor in the political unrest leading to the French Revolution. For each case, show where the procedure yields a clear judgment, where it stalls, and what additional information would resolve the stall. Finally, indicate explicitly what argument or empirical finding would cause you to revise the procedure itself—especially where you believe the boundary between causal agency and determinism is most fragile or likely to collapse, and note where the reasoning behind your procedure is most exposed to error.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Member of an evaluation board for a research fund supporting historical studies on non-human forces (pathogens, climate, volcanoes) as active contributors to change.
      *   **Core Concern:** Avoiding *environmental determinism* (humans as passive outputs) while acknowledging *legitimate causal attribution* (non-human forces constraining options).
      *   **Identified Failure Modes:**
          1.  *Post-hoc Ventriloquism:* Attributing intentionality-like effects to forces after outcomes are known (e.g., "the plague demanded contracts") in narrative, while treating them as blind mechanisms elsewhere.
          2.  *Scalar Slippage:* Assigning macro-level agency to micro-level processes without specifying mediating institutional pathways (e.g., "Little Ice Age caused Thirty Years' War").
      *   **Deliverable 1:** A reusable decision procedure (ordered checklist).
          *   Must include: Questions in sequence, sufficient answers, negative determination points, hand-off points for human/normative judgment.
          *   Must distinguish: Legitimate constraint vs. determinism.
          *   Must test for: Ventriloquism and Scalar Slippage.
      *   **Deliverable 2:** Application to two cases.
          *   Case A: Black Death $\rightarrow$ English labor contracts (1350s).
          *   Case B: 1783 Laki Eruption $\rightarrow$ French Revolution.
          *   For each: Clear judgment points, stalls, required additional info.
      *   **Deliverable 3:** Meta-evaluation of the procedure.
          *   What argument/finding would revise the procedure?
          *   Where is the boundary most fragile?
          *   Where is the reasoning most exposed to error?

  2.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Create a filter that separates "non-human forces as context/constraint" from "non-human forces as agents/causes."
      *   *Structure:* Sequential steps. If a proposal fails a step, it stops (Negative Determination). If it passes, it moves to the next. Some steps require human judgment (Normative Hand-off).
      *   *Step 1: Mechanism Specification.* Does the proposal explain *how* the force interacts with humans? (Tests Scalar Slippage).
      *   *Step 2: Contingency Check.* Does the proposal allow for alternative human outcomes given the same force? (Tests Determinism).
      *   *Step 3: Attribution Consistency.* Is the language consistent between narrative and analysis? (Tests Ventriloquism).
      *   *Step 4: Mediating Institutions.* Are human structures named as the transmission belt? (Tests Scalar Slippage again).
      *   *Step 5: Normative Weight.* Who gets the credit/blame? (Human Judgment Hand-off).

      *Refining the Steps:*
      *   *Q1 (Mechanism):* Is the physical mechanism distinct from the social outcome? (Fail = Conflation).
      *   *Q2 (Scalar Slippage):* Are specific institutional mediators identified? (Fail = Slippage).
      *   *Q3 (Ventriloquism):* Is agency language metaphorical or literal? (Fail = Ventriloquism).
      *   *Q4 (Contingency):* Is human choice modeled as a variable, not a constant? (Fail = Determinism).
      *   *Q5 (Normative):* (Hand-off point).

      *Let's make it more rigorous.*
      *   *Phase 1: Causal Architecture (Empirical).*
      *   *Phase 2: Linguistic Consistency (Narrative).*
      *   *Phase 3: Agency Allocation (Normative).*

      *Drafting the Checklist:*
      1.  **The Mediation Test:** Does the proposal identify specific human institutions/actors that translate the physical shock into social change?
      2.  **The Counterfactual Test:** Does the proposal acknowledge that the same physical shock could have produced different social outcomes under different institutional conditions?
      3.  **The Consistency Test:** Is the language used to describe the non-human force consistent across explanatory models and narrative descriptions?
      4.  **The Necessity/Sufficiency Test:** Does the proposal claim the force was necessary, sufficient, or contributory? (Determinism often claims sufficiency).
      5.  **Normative Hand-off:** At what point does the panel decide if the *degree* of human agency remaining is acceptable?

  3.  **Applying the Procedure to Case Studies:**

      *   *Case A: Black Death & English Labor Contracts.*
          *   *Context:* Standard historical economic history.
          *   *Application:*
              *   Mediation: Did landlords try to enforce old wages? Did peasants flee? (Yes, Statute of Laborers).
              *   Counterfactual: Could wages have stayed same? (Yes, if coercion was stronger).
              *   Ventriloquism: Did the plague "demand"? (Check language).
              *   *Verdict:* Likely passes if careful, fails if it says "Plague caused end of serfdom" without mentioning peasant agency/state capacity.
      *   *Case B: Laki Eruption & French Revolution.*
          *   *Context:* More controversial. 1783 eruption $\rightarrow$ bad harvests $\rightarrow$ 1789 Revolution.
          *   *Application:*
              *   Mediation: How does aerosol get to Storming of Bastille? (Harvest $\rightarrow$ Price $\rightarrow$ Unrest $\rightarrow$ Political mobilization).
              *   Scalar Slippage: High risk. "Laki caused Revolution" skips the Estates-General, Necker's policies, etc.
              *   Counterfactual: Would Revolution have happened without Laki? (Many say yes due to fiscal crisis).
              *   *Verdict:* High risk of failure on Scalar Slippage and Necessity/Sufficiency.

  4.  **Meta-Evaluation (Revising the Procedure):**

      *   *Fragile Boundary:* The line between "constraint" and "cause." If a constraint is tight enough, is it a cause? (e.g., no food = death).
      *   *Error Source:* The panel's own bias towards human exceptionalism. We might penalize valid strong causal links because they *look* like determinism.
      *   *Revision Trigger:* If a proposal shows a non-human force *selecting* social structures (evolutionary analogy) without human intent, the current human-centric procedure might reject valid science.

  5.  **Refining and Polishing:**

      *   *Tone:* Academic, rigorous, administrative but philosophical.
      *   *Formatting:* Clear headings, numbered lists, bold text for emphasis.
      *   *Specifics:* Ensure the terms "Post-hoc Ventriloquism" and "Scalar Slippage" are explicitly integrated into the checklist questions.
      *   *Hand-off Points:* Clearly mark where the algorithm stops and the humans must debate values.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "check for mediation." I need to define what a *sufficient* answer looks like.
      *   *Sufficient Answer:* Naming specific actors, laws, or markets, not just "society."
      *   *Negative Determination:* If the proposal claims the force *dictated* the outcome regardless of human response.

      *(Refining the Meta-Evaluation)*: Where is the reasoning most exposed? It's exposed in the definition of "agency." If we define agency too narrowly (conscious intent), we miss structural effects. If too broadly, we slip into determinism.

  6.  **Final Review against Prompt:**
      *   Ordered checklist? Yes.
      *   Sufficient answers defined? Yes.
      *   Negative determination points? Yes.
      *   Normative hand-off points? Yes.
      *   Distinguish constraint vs. determinism? Yes.
      *   Tests for Ventriloquism & Slippage? Yes.
      *   Apply to Black Death & Laki? Yes.
      *   Show stalls/missing info? Yes.
      *   Indicate revision triggers/fragile boundaries? Yes.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between empirical failure (bad method) and normative failure (bad philosophy) is clear. (Proceed to generate output).

  *(Self-Correction on Case B)*: Be careful not to dismiss the Laki hypothesis entirely (it's a real historical theory), but evaluate it *through the lens of the procedure*. The procedure should highlight where the *argumentation* usually fails, not necessarily declare the theory false. The prompt asks to apply the procedure to the *study*, implying I should evaluate the typical argumentative structure of such studies. I will treat them as archetypal proposals.

  *(Self-Correction on Meta-Evaluation)*: The prompt asks what argument would cause *me* to revise the procedure. I need to identify a theoretical challenge to the procedure's underlying assumptions (e.g., Actor-Network Theory or New Materialism might challenge the human/non-human binary itself).

