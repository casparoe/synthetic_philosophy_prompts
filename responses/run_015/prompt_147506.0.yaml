answer: |-
  # The Non-Human Causal Attribution Protocol (NHCAP)

  **Purpose:** To evaluate research proposals attributing historical political and social change to non-human forces (pathogens, climate, geology) without succumbing to environmental determinism, post-hoc ventriloquism, or scalar slippage.

  **Usage:** This procedure is to be applied sequentially. A "Negative Determination" at any stage halts the review and recommends rejection on methodological grounds. A "Normative Hand-off" indicates the empirical criteria are met, but the philosophical implications require panel deliberation.

  ---

  ## Phase 1: Causal Architecture (Empirical Validation)

  ### Step 1: The Mediation Test (Counteracting Scalar Slippage)
  **Question:** Does the proposal identify specific, named human institutions, actors, or decision-making nodes that translate the physical shock into the social outcome?
  *   **Sufficient Answer:** The proposal maps a chain of transmission (e.g., *Volcanic Aerosol $\rightarrow$ Regional Cooling $\rightarrow$ Crop Failure $\rightarrow$ Grain Price Spike $\rightarrow$ Municipal Policy Response $\rightarrow$ Civil Unrest*). It must name the specific institutions (markets, councils, courts) that processed the shock.
  *   **Negative Determination:** If the proposal moves directly from the physical event to the macro-political outcome (e.g., *"The eruption caused the Revolution"*) without specifying the institutional transmission belt. This indicates **Scalar Slippage**.
  *   **Status:** Pass $\rightarrow$ Step 2. Fail $\rightarrow$ Reject.

  ### Step 2: The Contingency Test (Counteracting Determinism)
  **Question:** Does the model allow for divergent social outcomes arising from the same physical precondition?
  *   **Sufficient Answer:** The proposal explicitly acknowledges that the non-human force *constrained* the choice set but did not *select* the choice. It must offer a plausible counterfactual where the physical event occurs, but the political outcome differs due to human variation (e.g., *"Had the Crown possessed greater fiscal reserves, the harvest failure would not have triggered insurrection"*).
  *   **Negative Determination:** If the proposal implies the social outcome was the *only* physically possible response (e.g., *"The mortality rate made serfdom impossible"*). This indicates **Environmental Determinism**.
  *   **Status:** Pass $\rightarrow$ Step 3. Fail $\rightarrow$ Reject.

  ### Step 3: The Consistency Test (Counteracting Post-hoc Ventriloquism)
  **Question:** Is the language used to describe the non-human force consistent across the proposal's narrative sections and its analytical/methodological sections?
  *   **Sufficient Answer:** The force is described consistently as a mechanism (e.g., *"The pathogen reduced labor supply"*) OR consistently as a metaphorical agent, provided the metaphor is explicitly flagged as heuristic.
  *   **Negative Determination:** If the methodology treats the force as a blind variable (e.g., regression on temperature) but the narrative conclusion attributes intentionality or teleology to the force (e.g., *"The climate demanded reform"* or *"The virus sought to rebalance the economy"*). This indicates **Post-hoc Ventriloquism**.
  *   **Status:** Pass $\rightarrow$ Step 4. Fail $\rightarrow$ Reject.

  ---

  ## Phase 2: Agency Allocation (Normative Hand-off)

  ### Step 4: The Necessity/Sufficiency Boundary
  **Question:** Does the proposal claim the non-human force was a *necessary condition*, a *contributing factor*, or a *sufficient cause*?
  *   **Empirical Check:** Does the evidence support the claimed level of causality?
  *   **Normative Hand-off:** If the proposal claims the force was a *contributing factor* (Passes Empirical), the panel must judge whether the *weight* assigned to the non-human force erodes the dignity or explanatory priority of human agency to an unacceptable degree.
      *   *Panel Task:* Debate whether the remaining "human agency" is substantive or merely residual.
      *   *Decision:* Fund / Do Not Fund based on disciplinary values, not methodological error.

  ### Step 5: The Ethical Implication Check
  **Question:** Does the attribution of causality shift moral responsibility for historical suffering or injustice away from human actors?
  *   **Normative Hand-off:** This is purely evaluative.
      *   *Example:* Does framing a famine as "climate-driven" obscure policy failures that exacerbated it?
      *   *Panel Task:* Determine if the historical narrative produced is ethically sound, even if methodologically robust.
      *   *Decision:* Fund / Do Not Fund based on ethical guidelines.

  ---

  # Application to Concrete Cases

  ## Case 1: Black Death and English Labor Contracts (1350s)
  **Proposal Summary:** Argues that high mortality rates directly reshaped labor contracts, shifting power from landlords to peasants.

  *   **Step 1 (Mediation):**
      *   *Application:* Does the study name the *Statute of Laborers*, the manorial courts, or peasant mobility strategies?
      *   *Judgment:* **Pass.** Most rigorous studies cite the failure of the Statute of Laborers and the leverage gained by mobile laborers.
  *   **Step 2 (Contingency):**
      *   *Application:* Does it acknowledge that in some regions (e.g., Eastern Europe), similar mortality led to *reinforced* serfdom?
      *   *Judgment:* **Stall.** If the proposal treats England as the inevitable outcome of the plague, it fails. If it treats England as one pathway among several, it passes.
      *   *Required Info:* Comparative data on Eastern European labor markets post-1348.
  *   **Step 3 (Consistency):**
      *   *Application:* Check for phrases like *"The plague forced the end of serfdom"* vs. *"The plague created conditions where serfdom became costly."*
      *   *Judgment:* **Risk of Fail.** Historical narratives often slip into *"The plague demanded higher wages."*
  *   **Step 4 & 5 (Normative):**
      *   *Judgment:* **Hand-off.** Even if methodologically sound, does attributing the rise of the yeomanry to a bacteria minimize the role of peasant revolts (e.g., 1381)? The panel must decide if the human struggle is sufficiently centered.

  **Verdict:** Likely **Fundable with Conditions**. The proposal must revise narrative language to remove teleology ("demanded") and include comparative European data to prove contingency.

  ## Case 2: 1783 Laki Eruption and the French Revolution
  **Proposal Summary:** Argues the Laki fissure eruption caused atmospheric cooling and crop failure, which was a decisive actor in the political unrest of 1789.

  *   **Step 1 (Mediation):**
      *   *Application:* Does it link aerosol loads to specific grain prices in Paris, and then to specific political mobilization (e.g., the calling of the Estates-General)?
      *   *Judgment:* **High Risk of Fail (Scalar Slippage).** Many versions of this thesis jump from *"bad weather"* to *"Revolution"* without detailing how the fiscal crisis of the monarchy interacted with the food crisis.
      *   *Required Info:* A model showing why food prices led to *regime change* in France but not in other famine-struck nations.
  *   **Step 2 (Contingency):**
      *   *Application:* Does it acknowledge the pre-existing fiscal/legitimacy crisis of the Bourbon monarchy?
      *   *Judgment:* **Stall.** If the eruption is framed as the "spark" without the "tinder" (institutional decay), it implies determinism.
      *   *Required Info:* Counterfactual analysis: Would the Revolution have occurred in 1789 without Laki, given the state bankruptcy?
  *   **Step 3 (Consistency):**
      *   *Application:* Check for *"The volcano undermined the Ancien Régime."*
      *   *Judgment:* **Fail.** This is classic Ventriloquism. Volcanoes do not undermine regimes; hungry citizens and indebted nobles do.
  *   **Step 4 & 5 (Normative):**
      *   *Judgment:* **Hand-off.** High risk. Attributing the Revolution to Laki risks absolving the monarchy of fiscal mismanagement and the elites of political failure.

  **Verdict:** Likely **Reject**. The proposal typically fails Step 1 (Mediation) and Step 3 (Consistency). To be reconsidered, it must reframe the eruption as a *stressor* on a specifically fragile institutional system, not a *decisive actor*.

  ---

  # Meta-Evaluation: Fragility and Revision of the Procedure

  ### 1. The Revision Trigger
  I would revise this procedure if presented with empirical evidence from **complexity science or evolutionary history** demonstrating that human institutions function as *selection environments* rather than *decision matrices*.
  *   **The Argument:** If a proposal demonstrates that non-human forces systematically *select* for specific institutional forms over long durations (e.g., pathogen loads selecting for specific state capacities) regardless of individual human intent, the distinction between "constraint" and "determination" collapses.
  *   **Why Revise:** The NHCAP assumes human agency resides in conscious choice (Step 2 & 4). If agency is emergent and structural, the "Contingency Test" becomes a category error. The procedure would need to shift from evaluating *intent* to evaluating *systemic feedback loops*.

  ### 2. The Most Fragile Boundary
  The boundary between **Constraint** and **Determinism** (Step 2) is the most fragile point.
  *   **Reasoning:** A constraint severe enough (e.g., total caloric deprivation) becomes deterministic in practice. The procedure relies on the panel's intuition to distinguish a "tight constraint" from a "determinant." There is no empirical metric for "how much choice is enough choice."
  *   **Risk:** The panel may penalize valid, strong causal claims because they *feel* deterministic, privileging human exceptionalism over material reality.

  ### 3. Exposure to Error
  The reasoning behind this procedure is most exposed to error in **Step 3 (The Consistency Test)**.
  *   **Reasoning:** This step polices language, not ontology. A researcher might use metaphorical language ("the climate demanded") as a pedagogical shorthand while maintaining a rigorous, non-deterministic model.
  *   **Error Type:** **False Negative.** We risk rejecting innovative, interdisciplinary work that uses rich narrative metaphors to communicate complex systems science, simply because the prose sounds like ventriloquism.
  *   **Mitigation:** The panel must be instructed to evaluate the *underlying model* before penalizing the *narrative framing*, unless the framing contradicts the model's logic.

  ### 4. Normative Vulnerability
  The **Normative Hand-off (Step 5)** is the point where the procedure admits it cannot be objective.
  *   **Reasoning:** Determining whether a historical narrative is "ethically sound" is a political act. A panel composed primarily of social historians may reject a climate-heavy proposal that a panel of environmental scientists would accept.
  *   **Exposure:** The procedure masks this value judgment as a final "check," potentially giving a false sense of methodological rigor to what is ultimately a philosophical dispute about the nature of history.
