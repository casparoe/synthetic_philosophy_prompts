      *   **Explain Bell's Assumption (Factorizability):** Use the math concept without getting bogged down. $P(AB|ab\lambda) = P(A|a\lambda)P(B|b\lambda)$. If this fails, the outcome at $A$ "knows" something about $B$ (or vice versa) that isn't explained by the past.
      *   **The "Nonlocality" Label:** Why use it if no signal travels? Because the *correlation* itself cannot be explained by local resources. The universe behaves as a single unit in a way that transcends spatial separation, *statistically*, even if *causally* it respects light cones.
      *   **The Role of Realism:** This is the hidden variable in the user's reasoning. Bell assumes "outcomes exist independently of measurement" (Realism) AND "influences are local" (Locality). You can save Locality if you drop Realism (e.g., Copenhagen, QBism). But if you want a realist picture (e.g., Bohmian mechanics), you *must* accept nonlocality.
      *   **Why No-Signaling Deepens the Puzzle:** It creates a "peaceful coexistence" (Shimony) between QM and Relativity. It prevents logical paradoxes (grandfather paradox) but leaves the ontological mystery intact. It implies nature is "holistic" but "shy."
