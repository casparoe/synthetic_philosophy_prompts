      *   *Definition A (Signal Locality / Operational Locality):* No information/energy/matter travels faster than $c$. This is preserved in QM (No-signaling theorem).
      *   *Definition B (Bell Locality / Local Realism / Factorizability):* The probability of an outcome at $A$ depends *only* on local settings and past common causes (hidden variables $\lambda$). Mathematically: $P(A, B | a, b, \lambda) = P(A | a, \lambda) \times P(B | b, \lambda)$.
      *   Bell's Theorem rules out Definition B. Experiments confirm Definition A.
      *   The tension arises because ruling out B usually suggests FTL influence (in a realist framework), but A says no FTL influence exists.
      *   The resolution lies in understanding what assumptions go into Bell's inequality: Locality + Realism (Counterfactual Definiteness). You have to drop at least one. Most physicists drop "Local Realism" as a package, but the specific flavor of "nonlocality" is subtle.

  3.  **Formulate the Explanation:**

