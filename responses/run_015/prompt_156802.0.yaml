answer: |-
  You have diagnosed the situation with remarkable accuracy for someone without formal training in the philosophy of science. Your intuition that there is a "prior thing" buried in the argument is correct, but it is deeper than just a disagreement about probability.

  Here is the diagnosis: **This is a substantive epistemological disagreement about what counts as evidence, rooted in an inaccessible empirical fact about the "size" of mathematical theory space.**

  It is not merely verbal (two questions under one name), though that confusion exacerbates it. It is not solvable by formalizing the argument alone, because the variable everyone needs to agree on is currently incalculable.

  Here is the breakdown of why the stalemate exists, using the engineering mindset you brought to the question.

  ### 1. The Core Conflict: Non-Empirical Theory Assessment
  The specific philosophical structure you are observing on the pro-string side has a name: **The No Alternatives Argument (NAA).** It was formalized by philosopher Richard Dawid.

  The argument structure is essentially Bayesian updating without new data.
  *   **Prior:** There exists a consistent theory of quantum gravity.
  *   **Observation:** Many smart people tried to find one for 40 years and failed, except for String Theory.
  *   **Observation:** String Theory internally generates features that look like the Standard Model (gauge groups, chirality, gravity) without them being hardcoded.
  *   **Update:** The probability that String Theory is the *correct* description of reality increases, despite the lack of experimental verification.

  The anti-string side rejects this update rule. They adhere to a stricter **Falsificationist** or **Empiricist** standard: without a unique prediction that distinguishes the theory from noise or rival theories, the probability of truth cannot move.

  **The Diagnosis:** The disagreement is not about the *facts* you listed (everyone agrees no alternatives have been found; everyone agrees the math is rich). The disagreement is about **whether mathematical consistency and sociological failure-to-find-alternatives constitute *evidence*.**

  ### 2. The Hidden Empirical Question: The Size of Theory Space
  You hit the nail on the head: *"To be impressed that nobody found a rival, you need to know how likely it was that someone would have found one if it existed."*

  In philosophy of science, this is the problem of **Underdetermination.**
  *   **Scenario A (Small Search Space):** There are only 5 mathematically consistent ways to combine quantum mechanics and gravity. If we found 1 and it looks right, the odds it is the *true* one are 1 in 5. That is strong evidence.
  *   **Scenario B (Large Search Space):** There are $10^{500}$ mathematically consistent ways (the "String Landscape"). If we found 1 that looks right, the odds it is the *true* one are 1 in $10^{500}$. That is negligible evidence.

  **The Stalemate:** We cannot calculate the size of the search space without solving the theory.
  *   If String Theory is unique (or has a very small "vacuum" selection mechanism), the proponents are right: the lack of alternatives is evidence of truth.
  *   If String Theory allows a vast multiverse where any physical constant can be tuned, the opponents are right: the lack of alternatives is just a lack of imagination or computational power, and the theory is unfalsifiable.

  This is why the same observation ("so much structure falls out") is interpreted differently:
  *   **Pro:** "The lock is so complex that finding a key that fits this well implies it's the master key." (Implies small search space).
  *   **Con:** "The lock is so loose that almost any key fits." (Implies large search space).

  ### 3. Is it "Two Questions"?
  You hypothesized: *"Is this probably true?" vs. "Is this worth working on?"*

  This is partially true, but it's not just a confusion; it's a strategic retreat.
  *   **1990s:** The claim was "String Theory is the Theory of Everything." (Truth claim).
  *   **2020s:** The claim has shifted toward "String Theory is the only robust framework for quantum gravity we have." (Heuristic claim).

  However, proponents still use the heuristic success to imply truth (via the NAA), while opponents argue that heuristic success does not justify the resource cost or the claim of scientific status. So, while the questions are distinct, the arguments deliberately conflate them to keep funding and prestige flowing.

  ### 4. What Counts as Progress?
  Given this diagnosis, here is what would actually resolve the deadlock, ranked by likelihood:

  **A. A Physics Result (The "Smoking Gun")**
  *   **What:** A prediction of a specific phenomenon (e.g., specific supersymmetric particle masses, specific gravitational wave signatures from the early universe, or a violation of Lorentz invariance) that is observed.
  *   **Effect:** Instantly resolves the epistemological debate. Empirical data trumps meta-arguments.
  *   **Likelihood:** Low in the near term. The energy scales required are likely beyond the LHC.

  **B. A Mathematical Result (The "Swampland" Program)**
  *   **What:** Proving that the "Search Space" is actually small. This is currently being attempted via the **Swampland Conjectures**. The idea is to prove that while $10^{500}$ vacua seem possible, most are mathematically inconsistent ("in the swampland") and only a tiny few are consistent ("in the landscape").
  *   **Effect:** If the landscape shrinks from $10^{500}$ to 1 (or a handful), the "No Alternatives" argument becomes statistically powerful. It validates the "prior" that the search space is small.
  *   **Likelihood:** Moderate. This is active, serious mathematical work.

  **C. A Formalization of the Argument (Bayesian Consensus)**
  *   **What:** Philosophers and physicists agree on a formal Bayesian framework for non-empirical confirmation.
  *   **Effect:** This would not solve the physics, but it would clarify the disagreement. It would force both sides to state their priors on the "size of theory space."
  *   **Likelihood:** High (this is happening now in philosophy of physics), but it won't change the physics. It just makes the stalemate more polite.

  **D. Nothing (The "Degenerate Research Programme")**
  *   **What:** The field continues to generate internal math useful for other fields (condensed matter, pure math) but makes no contact with gravitational reality.
  *   **Effect:** String theory becomes like **Scholasticism** or **Alchemy**: a rich, intellectually rigorous system that describes a domain we cannot access, eventually abandoned for a new paradigm that does make contact.
  *   **Likelihood:** Non-zero.

  ### Summary Verdict
  You are looking at a **substantive disagreement about the topology of mathematical possibility**, disguised as a debate about scientific method.

  *   **The Pro side** assumes the space of consistent theories is **sparse**. Therefore, finding one is significant.
  *   **The Con side** assumes the space of consistent theories is **dense**. Therefore, finding one is trivial.

  Neither side can prove their assumption without solving the problem they are arguing about. Until a mathematical proof constrains the "Landscape" (reducing the density of solutions) or an experiment detects a signature, the argument will remain exactly where it is: a clash of priors that cannot be updated.

  **Recommendation:** If you want to follow this hobbyistically, watch the **"Swampland" literature**. That is the specific sub-field attempting to calculate the "size of the search space" you identified as the missing variable. If they succeed, the philosophical debate collapses. If they fail, the stalemate continues.
