answer: |-
  You have identified a precise and under-named mechanism in the politics of technology. You are correct that Langdon Winner's canonical framework ("Do Artifacts Have Politics?") focuses primarily on *constitution* and *exclusion* (building a bridge that buses cannot pass). Your observation identifies the inverse: *dissolution* and *evaporation* (removing the road that buses, and drivers, shared).

  There is no single, canonical term in Science and Technology Studies (STS) or political philosophy that captures this specific phenomenon as a property of the artifact itself. However, your description sits at the intersection of four established concepts. To answer your request, I will first analyze why those four "neighbors" do not quite fit, and then propose a name and definition that does, testing it against a near-miss case.

  ### The Four Neighbors

  **1. The Script (Madeleine Akrich)**
  *   **The Concept:** Akrich argues that designers "script" users into artifacts, prescribing how they ought to act (e.g., a speed bump scripts you to slow down).
  *   **Why it's close:** Your cases clearly involve a design choice that shapes behavior.
  *   **Where it breaks:** A script is typically *prescriptive* ("Do X"). Your cases are *proscriptive of the collective* without prescribing the individual. The shift-bidding app does not tell the worker "Do not strike"; it removes the schedule that made a strike legible. It is a **negative script** applied to the group, not a positive script applied to the user.

  **2. Affordance (Gibson / Norman)**
  *   **The Concept:** An action possibility offered by the environment/object (e.g., a handle affords pulling).
  *   **Why it's close:** You note the change is marketed as "flexibility" (an affordance of freedom).
  *   **Where it breaks:** Standard affordance theory is methodologically individualist. It asks, "What can *I* do with this?" Your observation is that the artifact changes what *we* can see and do together. An affordance that enables individual exit by disabling collective visibility is not captured by standard affordance theory, which rarely accounts for the *loss* of a social context as a technical feature.

  **3. Exit, Voice, and Loyalty (Albert Hirschman)**
  *   **The Concept:** When an organization declines, members can either Voice (complain/organize) or Exit (leave).
  *   **Why it's close:** This is the strongest theoretical match for the *mechanism*. The app allows Exit (pick a different shift) which substitutes for Voice (negotiate the roster). The routing app allows Exit (avoid the traffic) which substitutes for Voice (demand road repair).
  *   **Where it breaks:** Hirschman describes a *behavioral choice* made by an actor, not a *property of the technology*. Your insight is that the technology *biases the system* so heavily toward Exit that Voice becomes structurally impossible. You need a term for the artifact that enforces this bias, not the bias itself.

  **4. Institutionalized Individualism (Ulrich Beck)**
  *   **The Concept:** Modern institutions force individuals to solve systemic risks (employment, insurance) on their own, dissolving class solidarities.
  *   **Why it's close:** Your insurance example is a textbook case of Beck's "risk individualization."
  *   **Where it breaks:** Beck describes a macro-sociological shift. He does not provide a vocabulary for the specific *technical artifacts* (the telematics box, the algorithm) that execute this shift. He explains the *why*, but not the *how* of the device.

  ### The Proposed Concept: Dissolutive Affordance

  Since no existing term captures the *artifact's capacity to dissolve a shared object of coordination*, I propose the term **Dissolutive Affordance**.

  **Definition:**
  A **Dissolutive Affordance** is a technical property that enables individual optimization or flexibility by removing a shared constraint that previously served as a focal point for collective recognition or action. Unlike a "prescriptive script" (which forces behavior) or a "restrictive barrier" (which excludes users), a dissolutive affordance operates by **erasing the site of friction** where politics typically occurs. It is political not because of what it requires, but because of what it renders unnecessary, invisible, or impossible to share.

  **Key Characteristics:**
  1.  **Invisibility of Loss:** The thing removed (the shared schedule, the traffic jam, the risk pool) was a "public bad" or a constraint, so its removal is welcomed as efficiency.
  2.  **Fragmentation of the Object:** The singular object of complaint is replaced by distributed, individualized data streams.
  3.  **Pre-emption of Voice:** It solves the individual's problem in a way that makes the collective solution irrelevant.

  ### Testing the Concept

  To ensure this is not just a synonym for "convenience" or "automation," we must test it against a **near-miss case**—something that looks like a Dissolutive Affordance but is not.

  **The Test Case: Noise-Canceling Headphones**
  *   **The Scenario:** A commuter puts on noise-canceling headphones to block out the sound of a noisy train.
  *   **Why it looks like yours:** It is a technology that removes a constraint (noise) for an individual. It is marketed as freedom/focus. It makes a shared nuisance (noise) disappear for the user.
  *   **Why it is NOT a Dissolutive Affordance:**
      *   **No Shared Coordination Point:** The noise was a nuisance, but it was not a *site of coordination*. Passengers were not organizing around the noise to demand quieter trains; they were merely enduring it. Removing the noise does not dissolve a collective capacity, because no collective capacity existed there.
      *   **No Fragmentation of a Public Object:** The noise remains for everyone else. The headphones do not change the train's operation or the other passengers' experience in a way that prevents them from organizing.
      *   **Contrast with Your Cases:** In your routing app example, the *congestion itself* was the public fact that could be contested. By hiding the congestion from the driver (by routing them around it), the app dissolves the *evidence* of the public failure. Headphones hide the noise from *you*, but they do not hide the fact of the noise from the *public*.

  **The Validation Case: Algorithmic Price Discrimination**
  *   **The Scenario:** An online retailer charges every customer a different price based on their browsing history, rather than posting a single shelf price.
  *   **Analysis:** This **IS** a Dissolutive Affordance.
      *   **Shared Object Removed:** The "posted price" was a shared standard. It allowed customers to compare notes ("Did you pay $10 for this?").
      *   **Dissolution:** With personalized pricing, there is no longer a common fact to compare. You cannot organize a boycott or demand fairness because there is no single "price" to contest, only your own private deal.
      *   **Marketing:** It is often sold as "personalized deals" or "discounts for you" (removing the constraint of high prices), masking the removal of price transparency.

  ### Summary

  You have identified a shift from the **Politics of Imposition** (Winner's bridges) to the **Politics of Subtraction**.

  *   **Winner's Artifacts:** "You *cannot* go there." (Exclusion)
  *   **Your Artifacts:** "You *need not* deal with them." (Dissolution)

  The established concept closest to the *social outcome* is **Hirschman's Substitution of Exit for Voice**. The established concept closest to the *societal trend* is **Beck's Individualization of Risk**. But for the *artifact itself*, the term is missing.

  **Dissolutive Affordance** captures the mechanism: the technology affords individual ease by dissolving the shared friction that constitutes the political group. It explains why the loss is invisible (who mourns the loss of a traffic jam?) and why the effect is durable (once the shared schedule is gone, the capacity to strike does not return even if the app is removed, because the habit of collective timing is lost).
