      To my colleagues,
      We have drifted into a routine: set a threshold, fund until low, revise termly. Some see this as satisficing—a pragmatic concession to limited time. I argue it is the only rationally defensible policy. Our situation is misdescribed if modeled as constrained optimization.

      Optimization requires maximizing expected welfare subject to constraints. But our terms forbid ranking. We cannot construct the utility function required for optimization because we are barred from comparing Case A to Case B. We can only judge Case A against a standard. This is not a computational limit; it is a constitutive rule.

