answer: |-
  To the Committee,

  For fourteen months, we have operated on a routine: we fix a threshold of need, fund applications that clear it in order of arrival, and revise the threshold termly based on the fund's depletion rate. Some might view this as satisficing—a pragmatic concession to our limited time and information. I argue that this routine is not merely a shortcut, but the only rationally defensible policy. Our situation is misdescribed, not merely idealized, if modeled as constrained optimization: as maximizing expected student welfare subject to a budget on our own deliberation.

  Optimization requires a well-defined utility function. We are forbidden from constructing one. The fund's terms prohibit ranking applicants against one another; we are allowed only a yes-or-no judgment on whether a case clears a threshold. To model our work as optimization is to pretend we can compare the welfare gains of Applicant A versus Applicant B. We cannot. This is not a computational constraint; it is a constitutive rule. We are not failing to maximize; we are operating within a framework that renders maximization incoherent.

  This incoherence is compounded by our epistemic limits. Consider the "invisible remainder": we never observe outcomes for declined applicants. We cannot tune our threshold by feedback because the data is truncated. Worse, our feedback is biased. We hear about the cases we fund, and funded cases predictably do better than comparable unfunded ones. If we attempted to calibrate the threshold on observed outcomes, we would push it in the wrong direction, conflating the effect of funding with the selection of recoverable cases. Since the rationality of our procedure cannot come from feedback learning, it must rest on the fit between the procedure and the structure of the environment. This is a genuine standard of assessment, not a retreat to "whatever works." In environments of radical uncertainty where probabilities are unknown, robustness is the rational goal, not maximization. Our threshold rule ensures the fund survives the academic year without requiring knowledge we cannot possess.

  Two objections arise from decision theory. First, the "as-if" objection: that any consistent stopping rule can be represented as maximizing some utility function, so satisficing differs from optimizing only in notation. This is mathematically trivial but normatively empty. If the utility function required to make the math work includes variables we are forbidden to measure (relative merit) and outcomes we cannot observe (declined cases), claiming we are "optimizing" obscures the moral and epistemic boundaries we operate within. It invites us to pretend we have authority we were denied.

  Second, the exploitability objection: that a threshold rule is path-dependent and dynamically inconsistent. Whoever controls the order of applications could exploit us. This is true. However, the proposed reform—scoring every application and funding in descending order—does not solve this; it merely relocates the exploitability. Scores are produced by five different people on different days with no common calibration. A "7" from me is not a "7" from you. Ordering by these scores creates an illusion of precision. It invites exploitation in the scoring phase: lobbying for higher scores becomes the new arbitrage. The threshold rule is transparent; the scoring rule is opaque noise. Furthermore, scoring implicitly reintroduces ranking, violating the fund's terms under the guise of metric evaluation.

  Our rationality lies in acknowledging that we cannot know the counterfactuals. We cannot know who would have suffered most among the declined. Therefore, a first-come, first-served threshold is not a failure of justice, but a recognition of our ignorance. It treats time as the only neutral arbiter available to us. To model this as optimization is to pretend we have information we do not possess. The threshold routine is the only policy that respects the fund's structure, our epistemic limits, and the prohibition on ranking. It is ecologically rational. We should not abandon it for a reform that promises precision it cannot deliver.

  Sincerely,

  [Your Name]
