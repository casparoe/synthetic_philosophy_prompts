answer: |-
  **JOINT STATEMENT ON THE ETIOLOGY OF PERPETRATION IN THE OCCUPIED EAST**

  **To:** The Workshop on Comparative Perpetration
  **From:** The Situational and Cultural Working Groups
  **Subject:** Framework for Analysis of the Order Police Personnel Corpus
  **Date:** October 2023

  We, the undersigned, represent distinct historiographical traditions regarding the behavior of German Order Police battalions in the occupied East. For a decade, our debate has centered on the relative weight of situational pressure versus ideological socialization. We acknowledge that much of our disagreement stems from analyzing different dependent variables using imprecise causal language. To render our dispute empirically tractable, we agree to utilize the forthcoming **Order Police Personnel Corpus** (11,000 men) and its **Satellite Corpus** (Volksdeutsche and auxiliaries) under the following framework.

  ### 1. Agreed Claims

  We affirm the following fifteen propositions as the baseline for our analysis. These are substantive claims about the historical record and the methodological requirements for explanation, not mere procedural platitudes.

  1.  **Heterogeneity:** The perpetrator population was demographically heterogeneous regarding age and class; it was not composed exclusively of young party elites.
  2.  **Refusal Possibility:** In the specific units under study, formal punishment for refusing to shoot was rare to non-existent; refusal was a viable, albeit socially costly, option.
  3.  **Variable Decomposition:** Perpetration must be analyzed as four distinct outcome variables: (i) *Uptake* (killing when exit is offered); (ii) *Latency* (time/priming required before first killing); (iii) *Excess* (cruelty beyond orders); and (iv) *Avowal* (post-war stated motives).
  4.  **Causal Roles:** Explanatory factors must be classified by function: *Triggers* (initiating the act), *Selectors* (determining unit assignment), or *Sustainers* (maintaining participation over time).
  5.  **Order Necessity:** Organized mass killing required top-down orders; spontaneous genocide without command infrastructure did not occur.
  6.  **Situational Sufficiency:** High-pressure situational contexts (peer monitoring, authoritative commands) are sufficient to produce high *Uptake* rates even among men with low measured ideological commitment.
  7.  **Cultural Relevance:** Pre-war antisemitic socialization is a relevant variable for explaining variance in *Excess* and *Latency*, not merely *Uptake*.
  8.  **Avowal Unreliability:** Post-war interrogation transcripts are unreliable as sole evidence of motive, as they reflect strategic self-presentation and memory reconstruction.
  9.  **Cohesion Mechanism:** Unit cohesion functions primarily as a *Sustainer*, operating independently of the initial motivation for *Uptake*.
  10. **District Proxy:** Pre-1933 electoral data and mobilization records from home districts are valid proxies for measuring individual exposure to eliminationist rhetoric.
  11. **Auxiliary Counterfactual:** Non-German auxiliaries operating under German command provide a necessary control group for isolating cultural socialization from situational pressure.
  12. **Escalation:** Participation in a first massacre statistically increases the probability of voluntary participation in subsequent operations (escalating commitment).
  13. **Alcohol Factor:** Alcohol consumption reduced *Latency* but is not a sufficient explanation for *Uptake* or *Excess* in the absence of other factors.
  14. **Willingness Gradient:** "Willingness" is not a binary state but a gradient ranging from eager initiative to reluctant compliance; theories must specify which point on the gradient they explain.
  15. **Monocausality Heuristic:** Claims of "monocausality" are treated as rhetorical emphasis on a primary driver, not as literal assertions that no other factors contributed.

  ### 2. Residual Disagreements

  We recognize that despite the agreements above, substantive divergences remain regarding the weighting of causes. The following table isolates these cruxes. We have flagged disagreements as **Genuine** (empirical divergence) or **Verbal** (definitional divergence).

  | Crux | Situationalist Formulation | Culturalist Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Primary Driver of Uptake** | *Uptake* is primarily a function of immediate peer pressure and authority; ideology is secondary. | *Uptake* is primarily a function of internalized eliminationist norms; pressure merely facilitates expression. | Genuine |
  | **Primary Driver of Excess** | *Excess* emerges from the dehumanizing logic of the operation and group dynamics over time. | *Excess* emerges from pre-existing cognitive models of Jewish sub-humanity held by the perpetrators. | Genuine |
  | **Role of Avowals** | *Avowals* of ideological motive are largely post-hoc rationalizations to normalize past behavior. | *Avowals* of ideological motive are reliable indicators of the cognitive frameworks active during the war. | Genuine |
  | **Definition of "Willing"** | "Willing" includes compliant participation driven by fear of shame; distinct from "eager." | "Willing" implies an affirmative desire to kill rooted in belief; compliance without belief is not "willing." | Verbal |
  | **Definition of "Ordinary"** | "Ordinary" denotes demographic normalcy (age/class), not psychological blankness. | "Ordinary" is a misleading term if it obscures the specific German cultural abnormality of eliminationism. | Verbal |

  ### 3. Cruxes and Empirical Tests

  To resolve the **Genuine** disagreements above, we propose four specific tests using the **Order Police Personnel Corpus**. We record our divergent predictions and the conditions under which we would revise our positions.

  **A. The Invariance Test**
  *Method:* Hold the situation roughly fixed (same battalion, same orders, same locality) and vary the measured home-district antisemitic mobilization of the men involved.
  *   **Situationalist Prediction:** *Uptake* rates will show no significant correlation with home-district antisemitism. *Excess* may vary slightly.
  *   **Culturalist Prediction:** *Uptake* and *Excess* will both correlate strongly with home-district antisemitism, even under identical command structures.
  *   **Falsification Conditions:** The Situationalist concedes if high-antisemitism districts show significantly higher *Uptake* in low-pressure environments. The Culturalist concedes if men from low-antisemitism districts show identical *Uptake* and *Excess* to those from high-antisemitism districts under identical orders.

  **B. The Transport Test**
  *Method:* Hold cultural background fixed (men from the same home districts) and vary situational pressure (e.g., commanding officer present vs. absent; explicit exit offer vs. implied order).
  *   **Situationalist Prediction:** *Uptake* will drop significantly when the commanding officer is absent or an exit is explicitly offered.
  *   **Culturalist Prediction:** *Uptake* will remain high regardless of officer presence; only *Excess* will diminish without leadership example.
  *   **Falsification Conditions:** The Situationalist concedes if *Uptake* remains near 100% even when exit is explicitly offered without penalty. The Culturalist concedes if *Uptake* collapses to near zero when the commanding officer is absent.

  **C. The Substitution Test**
  *Method:* Analyze men who refused shooting roles. Did they accept non-shooting roles (cordon, logistics) in the same operation?
  *   **Situationalist Prediction:** Refusers will often accept non-shooting roles, indicating objection to the *act* of shooting (psychological barrier) rather than the *outcome* (death of victims).
  *   **Culturalist Prediction:** Refusers will reject all participation, indicating objection to the *outcome* driven by residual moral norms or lack of ideological commitment.
  *   **Falsification Conditions:** The Situationalist concedes if refusers uniformly reject all logistical support. The Culturalist concedes if refusers uniformly accept logistical support within the killing chain.

  **D. The Auxiliary Comparison**
  *Method:* Compare German Order Police with non-German auxiliaries (Trawniki/Volksdeutsche) in the Satellite Corpus under the same German officers.
  *   **Situationalist Prediction:** *Uptake* rates will be similar across groups (situation dominates culture). *Excess* may differ.
  *   **Culturalist Prediction:** *Uptake* and *Excess* will be significantly lower among non-Germans (culture dominates situation).
  *   **Falsification Conditions:** The Situationalist concedes if non-Germans show significantly lower *Uptake* under identical German command. The Culturalist concedes if non-Germans show identical *Uptake* and *Excess* profiles to Germans.

  ### 4. The Dispute We No Longer Have

  By adopting this framework, we acknowledge that several previous points of contention were verbal rather than empirical. We treat the following as dissolved:

  1.  **"Monocausal":** We agree this term was rhetorical. Neither side claims literally only one factor existed. The dispute is about *variance explained*, not existence.
  2.  **"Willing":** We agree this term collapsed *Uptake* and *Excess*. We will henceforth use "compliant participation" vs. "initiatory cruelty."
  3.  **"Ordinary":** We agree this referred to demographics, not moral psychology. The question is not whether they were "ordinary men" but whether "ordinary" socialization is sufficient for genocide.
  4.  **"Culture":** We agree that treating culture as a ghost is vacuous. Culture must be operationalized via the home-district proxies in the Corpus.

  Once these terms are clarified, the remaining dispute is strictly quantitative: it concerns the regression coefficients of situational versus cultural variables in predicting *Uptake* and *Excess*. We commit to accepting the results of the tests outlined in Section 3 as decisive for the weighting of these coefficients. We sign this statement to affirm that the debate is now open to empirical resolution.
