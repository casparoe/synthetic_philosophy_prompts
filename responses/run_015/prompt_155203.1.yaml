  # COMMITTEE PREP SHEET: MEASURABILITY BIAS & PORTFOLIO SLEEVE

  ## 1. STRATEGIC CONCESSIONS (UPFRONT)
  *Put these on Slide 2. Do not wait for questions. Disarm the room by admitting what you cannot prove.*

  *   **Concede the Precision Gap:** Explicitly state that the "20%" figure is a heuristic starting point for discussion, not a derived constant. Acknowledge that the "2-20" measurability factor is a bounded estimate based on expert elicitation, not empirical regression.
      *   *Why:* Prevents the Asset Manager and Chair from spending 20 minutes dissecting a number you admit is soft. It shifts the debate from "Is this number exact?" to "Is the direction correct?"
  *   **Concede the Opportunity Cost:** Acknowledge that diverting funds from high-certainty interventions entails a real, immediate cost in terms of unsecured outcomes. Do not argue the cost is zero; argue it is an insurance premium.
      *   *Why:* Disarms the Quant PO and Chair's moral objection. You are not ignoring the cost; you are pricing it as risk management.
  *   **Hold the Line:** Do not concede that "hard to measure" equals "low impact." Do not concede that the current portfolio is optimal. Do not concede that structural learning is a "nice to have" rather than a systemic necessity.

  ## 2. THE SINGLE CRITICAL REPLY
  *This is the argument that must land for the proposal to survive. If you lose this, you lose the vote.*

  **The Argument:** Portfolio Diversification against Systemic Risk.
  **The Phrasing:** "Currently, this foundation's portfolio is undiversified along a single, hidden factor: legibility. Every asset we hold is high-quality, but they are all high-quality for the same reason—they are easy to verify. This is not risk management; it is concentration risk. If our models of change are wrong about what is measurable, the entire portfolio fails. The 20% sleeve is not a charity subsidy; it is a hedge against the possibility that the map we are using (cost-effectiveness rankings) is missing the terrain (structural causes). We are buying insurance against model failure."
  **Why it works:** It speaks the Asset Manager's language (diversification), the Chair's language (model risk), and the Philosopher's language (uncertainty). It reframes the sleeve from "spending on vague things" to "protecting the core portfolio."

  ## 3. THE DANGEROUS QUESTION
  *Hope nobody asks this. If they do, do not bluff.*

  *   **The Question:** "What specific operational criteria would trigger closing this sleeve? If after three years we have no measurable outputs from this 20%, do we reallocate it back to bednets?"
  *   **Who Asks It:** The Chair (Development Economist) or the Asset Manager.
  *   **Why It Is Dangerous:** It exposes whether this is a rigorous experimental sleeve or a slush fund for pet projects. If you say "No, we keep it because learning is long-term," you look unaccountable. If you say "Yes, we close it," you admit the sleeve is subject to the same measurability bias you are criticizing.
  *   **Prepared Answer:** "The trigger is not 'measurable outputs' in the traditional sense, but 'decision-relevant information.' If after three years this sleeve has not generated evidence that changes our allocation decisions in the measurable 80%, we close it. The metric is not the success of the grants, but the update to our priors on the rest of the portfolio." (CHECK BEFORE MEETING: Ensure this aligns with foundation policy on sunset clauses).

  ## 4. HANDLING THE NUMBERS
  *The committee will demand a number twice. Here is how to answer without lying.*

  *   **Demand 1: "Where does the 20% come from?"**
      *   **Response:** "It is derived from a risk-budgeting framework, not an impact maximization framework. In asset management, tail-risk hedges often consume 5-20% of portfolio value depending on correlation. We are treating measurability bias as a correlated risk factor. 20% is the upper bound of what we can absorb without compromising core mission delivery, based on a stress test of our liquidity."
      *   **Cost of Honesty:** If you say "It's a guess," you lose credibility. If you say "It's derived," you must show the derivation. The middle path is "It is a policy parameter calibrated to our risk tolerance, subject to review."
  *   **Demand 2: "What is the expected return on the structural learning?"**
      *   **Response:** "We cannot price the return directly. We price it indirectly by the reduction in variance of the core portfolio. If this sleeve prevents us from making a single catastrophic allocation error based on flawed structural assumptions, it pays for itself. We are measuring value by risk reduction, not yield."
      *   **Cost of Honesty:** Admitting you cannot calculate EV undermines the EA framing. You must shift the frame from "Maximizing EV" to "Minimizing Ruin."

  ## 5. OBJECTION HANDLING (RANKED BY LIKELIHOOD × DAMAGE)

  ### 1. The Identification Challenge
  *   **Member:** The Chair (Development Economist)
  *   **Objection:** "You claim there is a bias, but you haven't identified it. How do you distinguish between 'hard to measure because it's structural' and 'hard to measure because it doesn't work'? Without an identification strategy for the bias itself, you're just asking us to fund noise."
  *   **Reply (90s):** "That is the correct econometric question. We cannot identify the bias ex-post using the same tools that created it. Instead, we treat it as a model uncertainty problem. We know that measurement effort correlates with intervention type (clinical vs. political). We know that type correlates with causal depth. Therefore, measurement effort is a confounder. We are not claiming every unmeasured thing works; we are claiming the selection process is non-random. This sleeve is the instrument variable—it allows us to observe the variance in outcomes where measurement effort is decoupled from initial selection."
  *   **Soft Spot:** You don't actually have an instrument variable. This is a metaphorical use of econometric terms that the Chair will spot immediately.

  ### 2. The Arbitrariness of the Sleeve
  *   **Member:** The Board Member (Asset Management)
  *   **Objection:** "In my world, factor exposure is priced. If measurability is a risk factor, show me the correlation matrix. Why 20%? Why not 5%? Why not 50%? This looks like a number you picked to make the slide look balanced."
  *   **Reply (90s):** "It is not picked for balance; it is picked for liquidity. We modeled the foundation's ability to absorb variance in outcomes without triggering donor retreat. 20% is the maximum variance we can absorb while maintaining operational stability. It is a capital constraint, not an optimization result. If you have a model for pricing epistemic risk, I will gladly use it to adjust the weight, but until then, we must set a cap based on our risk capacity."
  *   **Soft Spot:** You are admitting the number is based on "donor retreat" (political) rather than "epistemic value" (scientific), which undermines the moral argument.

  ### 3. The Opportunity Cost (Lives)
  *   **Member:** The Quant PO (EA Sympathizer)
  *   **Objection:** "Every dollar here is a dollar not saving a life today. You are asking us to trade certain lives for uncertain information. Given the replaceability argument you cited, why isn't this morally negligent? You are privileging knowledge over suffering."
  *   **Reply (90s):** "I am not privileging knowledge over suffering; I am privileging future suffering reduction over present suffering reduction. If our current map is wrong by a factor of ten, we are wasting 90% of our budget on suboptimal interventions. This sleeve is an investment in correcting the map. The counterfactual isn't 'bednets vs. nothing'; it's 'bednets now vs. better bednets plus policy change later.' We are maximizing over a longer time horizon."
  *   **Soft Spot:** This relies on a discount rate assumption that many EAs reject. If she values present lives infinitely higher, this reply fails.

  ### 4. Pascal's Mugging / Thick Uncertainty
  *   **Member:** The Philosopher of Science
  *   **Objection:** "You are using expected-value reasoning to justify interventions where expected value cannot be calculated. This is Pascal's Mugging. You are assigning infinite value to 'structural learning' to bypass the lack of evidence. That is epistemically dishonest."
  *   **Reply (90s):** "I agree that standard EV reasoning fails here. That is why I am not using EV. I am using a robustness criterion. We are not betting that structural work has infinite value; we are betting that our current model is fragile. This is not about maximizing the upside; it is about minimizing the downside of being confidently wrong. It is a precautionary principle applied to our allocation model, not a claim about the magnitude of the return."
  *   **Soft Spot:** You are shifting from EA orthodoxy (EV maximization) to precautionary reasoning, which may alienate the Quant PO and Chair who rely on EV.

  ### 5. The "Why Not 100%?" Trap
  *   **Member:** The Inst. Politician Economist
  *   **Objection:** "If institutions are the primary determinant of well-being, and project measurement is noise, why are we only allocating 20%? You've convinced me the measurable end is biased. Shouldn't we flip the portfolio?"
  *   **Reply (90s):** "Because we still need to save lives today. The measurable interventions work, even if they are overrated. They provide the floor. The structural work provides the ceiling. We need the floor to maintain legitimacy and the ceiling to increase impact. A 100% flip would abandon the proven for the speculative. We need a barbell strategy, not a swap."
  *   **Soft Spot:** Admitting the measurable interventions "work" concedes ground to the Chair that the bias might not be large enough to warrant a major shift.

  ### 6. Political Co-option
  *   **Member:** The Labor/Community Organizer
  *   **Objection:** "You are framing political struggle as an 'intervention' that produces 'data' for us. Communities don't exist to generate information for foundations. This feels like extractive research disguised as grantmaking."
  *   **Reply (90s):** "That is a vital correction. The goal is not to extract data from communities. The goal is to fund agents who already exist to shift power, and to accept that our measurement frameworks are too blunt to capture their success. We are changing our measurement to fit their work, not changing their work to fit our measurement. The 'learning' is us learning to trust local indicators, not us measuring them."
  *   **Soft Spot:** This is rhetorically strong but operationally vague. It doesn't explain how you will actually evaluate the grants.

  ### 7. Option Liquidity (Exercise Price)
  *   **Member:** The Board Member (Asset Management)
  *   **Objection:** "You call this a 'structural-learning option.' An option has an exercise price and an expiration. When do we exercise this? What is the trigger that converts this learning into allocation changes?"
  *   **Reply (90s):** "The exercise trigger is a threshold update in our posterior beliefs. If this sleeve produces evidence that shifts our confidence in a structural cause by more than one standard deviation, we reallocate capital from the measurable sleeve to scale that structural cause. The expiration is the next strategic planning cycle, three years. If no update occurs, the option expires worthless, and we re-evaluate the thesis."
  *   **Soft Spot:** "One standard deviation" is hard to define in qualitative political work. The Asset Manager will know this is fuzzy.

  ### 8. Replaceability Symmetry
  *   **Member:** The Quant PO (EA Sympathizer)
  *   **Objection:** "You said replaceability applies symmetrically. But my earning-to-give dollar is flexible capital. If I don't fund this sleeve, someone else might. If I don't fund bednets, they definitely don't get funded. The counterfactuals aren't symmetric."
  *   **Reply (90s):** "You are right that the counterfactuals differ by donor type. But within this foundation's budget, the marginal dollar is fungible. The question is not about your personal income; it is about this committee's allocation. Within this room, shifting a dollar from bednets to policy has the same opportunity cost regardless of where the money came from. We are optimizing the pool, not the donor."
  *   **Soft Spot:** This sidesteps her personal stake. She may feel you are dismissing the unique value of her career choice.

  ### 9. External Validity of Learning
  *   **Member:** The Chair (Development Economist)
  *   **Objection:** "Even if you learn something from a policy intervention in Country A, what is the external validity for Country B? Structural causes are context-specific. You are assuming generalizability that doesn't exist."
  *   **Reply (90s):** "We are not assuming generalizability of the specific policy. We are assuming generalizability of the mechanism. If we learn that coalition-building works better than lobbying in one context, that mechanism transfers. We are funding the discovery of mechanisms, not just specific wins. That is why we require grantees to document process, not just outcomes."
  *   **Soft Spot:** Mechanisms are also context-dependent. This is a weak empirical claim.

  ### 10. Commensurability of Values
  *   **Member:** The Philosopher of Science
  *   **Objection:** "You are trying to commensurate political justice and mortality reduction on a single scale. They are incommensurable goods. Your portfolio theory assumes they are substitutable."
  *   **Reply (90s):** "They are not substitutable in value, but they are substitutable in budget constraint. We have one budget. We must choose. My argument is not that justice equals bednets; it is that ignoring justice reduces the effectiveness of bednets. We are not comparing values; we are comparing constraints on our primary value."
  *   **Soft Spot:** This is a philosophical dodge. If they are incommensurable, you cannot optimize across them using a single sleeve percentage.

  ## 6. FINAL CHECKLIST BEFORE THE MEETING
  *   **CHECK BEFORE MEETING:** Verify the foundation's policy on "sunset clauses" for experimental funding streams to ensure the "Dangerous Question" answer is compliant.
  *   **CHECK BEFORE MEETING:** Prepare a one-page handout defining "Measurement Elasticity" with a simple visual example (e.g., Bednet vs. Policy Reform) to anchor the Chair's understanding.
  *   **CHECK BEFORE MEETING:** Review the last three years of the foundation's rejected grants to see if any "structural" work was turned down due to measurement issues. Use one as a concrete example if pressed.
  *   **MENTAL PREP:** The Quant PO is your biggest emotional risk. Do not let her feel her career is being judged as "biased." Frame this as "institutional risk management," not "critique of individual donors."
