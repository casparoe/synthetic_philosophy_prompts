  # Decision-Tree Taxonomy of Weakness of Will and Intertemporal Choice

  ## Part I: Branching Conditions and Diagnostic Questions

  **Node 1: The Possibility Condition**
  *   **Question:** Is it possible for a person to knowingly and intentionally do something they judge to be worse for them overall, without being forced or ignorant of the facts?
  *   **Branch A (No):** Weakness of will is impossible; apparent cases are errors in judgment or ignorance.
  *   **Branch B (Yes):** Weakness of will is a genuine phenomenon.

  **Node 2: The Temporal Proximity Condition (Niche Diagnostic)**
  *   **Context:** Consider an agent who consistently follows their long-term life plan (e.g., staying healthy) and never violates it globally. However, when two rewards are both available within the next hour, they consistently pick the smaller immediate one over the larger later one.
  *   **Question:** Does this specific local switch count as a case of weakness of will?
  *   **Branch A (No):** Weakness of will requires violating a stable, overall best judgment (the global plan). Local shifts without global violation are not weakness of will. *(Leads to Practical Reasoning Explanations)*
  *   **Branch B (Yes):** Weakness of will is defined by the local preference reversal itself, driven by how close the reward is. *(Leads to Temporal Proximity Explanations)*

  **Node 3: The Structural Condition**
  *   **Question:** To explain the behavior identified in Node 2, must we say the person is made of two conflicting parts (like a planner and a doer), or can we explain it as a single decision-maker whose priorities shift?
  *   **Branch A (Split):** The agent contains distinct systems or selves that conflict.
  *   **Branch B (Unified):** The agent is a single entity with changing preferences or reasoning failures.

  **Node 4: The Normative Condition (Applied only to Temporal Proximity Explanations)**
  *   **Context:** For views that say the local switch *is* weakness of will (Node 2, Branch B).
  *   **Question:** Is this shifting of priorities a mistake in how the brain calculates value, or a reasonable adjustment to the changing situation?
  *   **Branch A (Mistake/Defect):** The mechanism is a flaw or bias in the agent's design.
  *   **Branch B (Reasonable/Feature):** The mechanism is a functional or rational adaptation to perspective.

  ---

  ## Part II: Mapping of Answer Patterns to Positions

  The following seven terminal leaves correspond to the answer patterns generated by the tree above. One logical combination is flagged as unoccupied.

  ### Leaf 1: The Socratic Denial
  *   **Path:** Node 1 (No).
  *   **Position:** **(1) Socratic Denial.**
  *   **Diagnosis:** This view holds that what looks like weakness of will is actually ignorance. If an agent truly knows the better course, they cannot fail to take it. The tree terminates here because no further explanation of the *mechanism* of failure is needed.

  ### Leaf 2: The Aristotelian Account
  *   **Path:** Node 1 (Yes) → Node 2 (No: Not WoW without global violation) → Node 3 (Split).
  *   **Position:** **(2) Aristotelian Account.**
  *   **Diagnosis:** This view locates the failure in the practical reasoning process. The agent retains the correct universal premise (the global plan) but fails to apply it in the moment due to conflict between rational and appetitive parts of the soul. It is a "Split" agent in terms of psychic parts, but a failure of reasoning rather than time-based preference reversal.

  ### Leaf 3: The Judgment-Failure Account
  *   **Path:** Node 1 (Yes) → Node 2 (No: Not WoW without global violation) → Node 3 (Unified).
  *   **Position:** **(3) Davidson’s View.**
  *   **Diagnosis:** This view insists the agent is unified to preserve responsibility. Weakness of will is acting against one’s own all-things-considered best judgment. In the Niche Case (Node 2), since the global plan was not violated, this view denies it is weakness of will; true weakness requires violating the unified agent's own final verdict.

  ### Leaf 4: The Planner-Doer Model
  *   **Path:** Node 1 (Yes) → Node 2 (Yes: Local switch is WoW) → Node 3 (Split) → Node 4 (Mistake/Defect).
  *   **Position:** **(5) Planner-Doer Dual-Self Model.**
  *   **Diagnosis:** This view explains reversal by conflict between long-run and short-run evaluative systems. The "Doer" overrides the "Planner" due to temporal proximity. This conflict is treated as a defect or source of inefficiency that requires self-binding strategies to manage.

  ### Leaf 5: The Unexplored Hybrid
  *   **Path:** Node 1 (Yes) → Node 2 (Yes: Local switch is WoW) → Node 3 (Split) → Node 4 (Reasonable/Feature).
  *   **Position:** **(7) Unexplored/Hybrid Position.**
  *   **Diagnosis:** **FLAGGED AS UNOCCUPIED.** This logical space represents a "Rational Dual-Self" view. It posits distinct internal systems (Split) that drive time-sensitive reversals (Temporal Proximity), but claims this conflict is a *reasonable adaptation* (Feature) rather than a defect. While dual-self models exist, they typically frame the conflict as pathological. A model claiming the conflict itself is evolutionarily or rationally optimal remains unexplored.

  ### Leaf 6: The Reductionist Account
  *   **Path:** Node 1 (Yes) → Node 2 (Yes: Local switch is WoW) → Node 3 (Unified) → Node 4 (Mistake/Defect).
  *   **Position:** **(4) Hyperbolic-Discounting Reductionist View.**
  *   **Diagnosis:** This view treats weakness of will as nothing over and above present-biased intertemporal choice. The agent is Unified, but their discount curve is mathematically "hyperbolic" (steep in the short run). This is viewed as a cognitive defect or bias in valuation, not a conflict of selves.

  ### Leaf 7: The Structural-Rationality Account
  *   **Path:** Node 1 (Yes) → Node 2 (Yes: Local switch is WoW) → Node 3 (Unified) → Node 4 (Reasonable/Feature).
  *   **Position:** **(6) Structural-Rationality View.**
  *   **Diagnosis:** This view treats time-inconsistent reversal as rational given legitimately shifting evaluative perspectives. The agent is Unified, and the change in preference is a reasonable response to the changing temporal context (e.g., the nearer reward has more definite utility), not a failure of rationality.

