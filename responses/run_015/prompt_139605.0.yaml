              3.  Epistemic/Defeasible (Past self better judge, but new info overrides).
              4.  Evidentiary Only (Document is just data).
              5.  Promising/Institutional (Bindingness comes from the practice/promise).
              6.  Relational/Co-Authorship (Patient + Surrogate + Clinician decide together).
              7.  Gradualist/Psychological Continuity (Authority fades as identity fades).
          *   Analysis of the "Empty Leaf": Past self authority over *fully competent, unimpaired* future self (Why is nobody there?).
