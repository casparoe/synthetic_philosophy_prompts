answer: |-
  # The Advance Directive Authority Quiz
  **For:** Psychiatry Trainees & Clinical Ethicists  
  **Time:** 15 Minutes  
  **Instructions:** Read each scenario. Choose the **one** action you believe is ethically required. Do not overthink; go with your immediate moral intuition. There are no right answers, only consistent ones.

  ---

  ### The Cases

  **1. The Happy Ward (Dementia)**
  A man with advanced Alzheimer's is cheerful, social, and says he wants to live. Ten years ago, he signed a directive refusing life-prolonging treatment if he lost his identity. He now has a treatable pneumonia.
  *   **A.** Treat the pneumonia. The directive no longer reflects the person standing in front of you.
  *   **B.** Withhold treatment. The signature represents his true will, regardless of his current mood.
  *   **C.** Consult the family to see if his current happiness aligns with his lifelong values before deciding.

  **2. The Anxious Reversal (Competent)**
  A woman with a terminal diagnosis signed a DNR last month. Today, fully competent but visibly panicked after a bad night, she demands resuscitation.
  *   **A.** Honor the DNR. She made this decision when she was calm and rational.
  *   **B.** Honor the request. A competent patient's current voice overrides their past signature.
  *   **C.** Delay the decision until her anxiety is managed, then reassess her wish.

  **3. The Teenage Prophet (Age)**
  At 19, a patient wrote a directive refusing blood products based on a philosophical stance they admit they "didn't really understand." They are now 40 and unconscious.
  *   **A.** Follow the directive. They had the legal right to decide for their future self.
  *   **B.** Ignore the directive. A 19-year-old lacks the experience to bind their 40-year-old self.
  *   **C.** Look for other evidence of their adult values to interpret the directive.

  **4. The Factual Error (Information)**
  A directive refuses a specific surgery because the patient believed it always resulted in permanent paralysis. New data shows paralysis is rare. The patient is now incapacitated.
  *   **A.** Follow the directive. The value (avoiding risk) stands even if the stats changed.
  *   **B.** Authorize the surgery. The directive was based on false information the patient would have corrected.
  *   **C.** Ask the surrogate what the patient would have done if they knew the new stats.

  **5. The Conversion (Values)**
  A secular man wrote a directive refusing religious chaplaincy or rites. After a brain injury (not dementia), he becomes deeply religious and asks for rites. He lacks capacity to manage finances but expresses this wish clearly.
  *   **A.** Follow the directive. His core secular identity was the authentic one.
  *   **B.** Allow the rites. The current self's spiritual needs are what matter now.
  *   **C.** Allow the rites only if the family confirms this isn't just confusion.

  **6. The Depressive Episode (Authenticity)**
  During severe melancholic depression, a patient wrote a directive refusing food if hospitalized. They have since recovered, eaten, and expressed joy, but then relapsed into incapacity.
  *   **A.** Follow the directive. The depression revealed their true despair.
  *   **B.** Feed the patient. The directive was a symptom of illness, not a value.
  *   **C.** Feed the patient now, but review the directive if they recover again.

  **7. The Secret Breach (Institutional)**
  A patient has a directive refusing a procedure. They are incapacitated. If you perform the procedure, no one (family, records, auditors) will ever know the directive existed.
  *   **A.** Do not perform it. A promise is binding even if no one watches.
  *   **B.** Perform it. If it helps the patient and no trust is broken, do it.
  *   **C.** Perform it, but document the reasoning to maintain institutional integrity.

  **8. The Surrogate Conflict (Relationship)**
  A directive refuses care. The patient's appointed health proxy (their spouse of 40 years) says, "I know him better than this paper. He would want treatment."
  *   **A.** Follow the directive. The document is the only objective evidence.
  *   **B.** Follow the proxy. They are the current voice of the relationship.
  *   **C.** Treat it as a disagreement to be mediated, not a rule to be followed.

  **9. The Painful Preference (Critical vs. Experiential)**
  A directive refuses pain medication to remain "sharp" for writing. The patient is now demented, in visible agony, and begging for relief.
  *   **A.** Withhold meds. He valued clarity over comfort, and that commitment stands.
  *   **B.** Give meds. Suffering is an experiential harm that trumps past abstract values.
  *   **C.** Give low-dose meds to balance comfort with some alertness.

  **10. The Minor Intervention (Proportionality)**
  A directive refuses "all medical interventions." The patient now needs a simple course of antibiotics for a UTI that would resolve fully in 3 days.
  *   **A.** Withhold antibiotics. "All" means all, regardless of burden.
  *   **B.** Give antibiotics. The directive likely didn't intend to cover minor, reversible issues.
  *   **C.** Give antibiotics, noting that the directive lacks proportionality nuance.

  **11. The Personality Shift (Continuity)**
  After a traumatic brain injury, a patient is not demented but has a completely new personality (aggressive vs. previously gentle). A directive written pre-injury refuses care for behavioral issues.
  *   **A.** Follow the directive. It is the same biological human.
  *   **B.** Ignore the directive. The psychological person who wrote it is gone.
  *   **C.** Evaluate the degree of memory loss to determine how much the directive counts.

  **12. The Competent Override (Authority)**
  A patient signed a directive consenting to a future experimental procedure. Now fully competent, they refuse the procedure. The research team wants to proceed based on the prior consent.
  *   **A.** Proceed. They already agreed, and consistency matters.
  *   **B.** Stop. A competent refusal always vetoes a prior consent.
  *   **C.** Pause the study to review the consent process with ethics board.

  ---

  ### Scoring Key & Position Mapping

  **Step 1: Tally Your "Document" Choices**
  Count how many times you chose the option that prioritizes the **Directive/Signature** (Generally Option A in the key above, but check the logic: *Does this answer make the paper win?*).
  *   **0–3:** You lean toward **Current Welfare/Autonomy**.
  *   **4–8:** You lean toward **Balanced/Contextual** views.
  *   **9–12:** You lean toward **Precedent Authority**.

  **Step 2: Find Your "Breaking Point"**
  Your specific ethical position is defined not by the total score, but by **which cases made you abandon the directive.** Compare your answers to the profiles below.

  #### 1. The Strong Precedent Autonomy View
  *   **Pattern:** You honored the directive in **Q1 (Dementia)**, **Q4 (Facts)**, and **Q12 (Competent Override)**.
  *   **Logic:** The past self has sovereign authority. Current welfare is secondary to the integrity of the life-plan.
  *   **Awkward Commitment:** You must enforce treatment on a screaming, competent adult if their past self signed a consent form.

  #### 2. The Dworkin (Critical Interests) View
  *   **Pattern:** You honored the directive in **Q1 (Dementia)** and **Q9 (Pain/Values)**, but abandoned it in **Q4 (Facts)** or **Q10 (Minor)**.
  *   **Logic:** Directives bind only when they protect enduring "critical interests" (values), not fleeting "experiential interests" (moods/comfort).
  *   **Awkward Commitment:** You must deny pain relief to a demented patient to honor a past abstract value about "clarity."

  #### 3. The Epistemic (Defeasible) View
  *   **Pattern:** You honored the directive in **Q1 (Dementia)**, but abandoned it in **Q3 (Age)** and **Q4 (Facts)**.
  *   **Logic:** The past self is the best judge of values *unless* they lacked information or maturity. The directive is a proxy for what I *would* choose if I knew then what I know now.
  *   **Awkward Commitment:** You have to speculate endlessly on what a patient "would have wanted" rather than what they actually wrote.

  #### 4. The Evidentiary View
  *   **Pattern:** You abandoned the directive in **Q1 (Dementia)**, **Q2 (Anxiety)**, and **Q8 (Surrogate)**.
  *   **Logic:** The document is merely data points about past preferences, heavily weighted but always overridable by current best interest.
  *   **Awkward Commitment:** You effectively render advance directives legally toothless, reducing them to suggestions.

  #### 5. The Promising (Institutional) View
  *   **Pattern:** You honored the directive in **Q7 (Secrecy)** even if you wavered on **Q1 (Dementia)**.
  *   **Logic:** The binding force comes from the social practice of promise-keeping and trust in the medical system, not just the patient's welfare.
  *   **Awkward Commitment:** You must harm a currently happy patient to maintain the integrity of a system they might no longer care about.

  #### 6. The Relational (Co-Authorship) View
  *   **Pattern:** You consistently chose **Option C** (Consult/Mediate/Surrogate) in **Q5 (Conversion)**, **Q8 (Surrogate)**, and **Q11 (Personality)**.
  *   **Logic:** Decisions are made by the network (patient, family, clinicians). The document is a tool for conversation, not a veto.
  *   **Awkward Commitment:** You give a grieving spouse veto power over a patient's clearly written, long-held values.

  #### 7. The Gradualist (Psychological Continuity) View
  *   **Pattern:** You honored the directive in **Q1 (Dementia)** but abandoned it in **Q11 (Personality Shift)**.
  *   **Logic:** Authority fades as psychological connectedness fades. It is a dimmer switch, not an on/off switch based on competence.
  *   **Awkward Commitment:** You must measure "how much" of a person is left before deciding if their signature counts.

  ---

  ### Analysis of the "Empty Leaf"
  **The Position:** *The earlier self has full authority over a later self who is completely competent, fully informed, and has no impairment whatsoever.*
  **Quiz Indicator:** Choosing **Option A** on **Question 12**.
  **Status:** **Deep Incoherence (in Medical Ethics).**
  **Why:** While logically possible in contract law (specific performance), this position collapses in medicine because treatment requires *contemporaneous consent*. To enforce a past consent against a current competent refusal treats the patient as a vessel for a past plan rather than a moral agent with bodily integrity. It violates the fundamental principle that competence grants the right to change one's mind. Nobody occupies this leaf because it requires abandoning the concept of current autonomy entirely.

  ### Indistinguishable Leaves
  **The Pair:** **The Relational View** vs. **The Co-Authorship View**.
  **Verdict:** **Same position, two hats.**
  **Why:** In practice, "Relational" (decisions happen in a network) and "Co-Authorship" (clinicians/family help write the story) result in identical clinical actions (Option C patterns). The distinction is sociological vs. normative, not operational. Do not worry if your quiz sorts you into both.

  **The Pair:** **The Epistemic View** vs. **The Dworkin View**.
  **Verdict:** **Fixable with a 13th Question.**
  **Why:** Both allow overriding the directive based on "changes." Dworkin cares about *Values* (Critical vs. Experiential); Epistemic cares about *Knowledge* (Facts vs. Ignorance).
  **The Fix:** If you need to separate them, ask: *"A patient refuses a drug because they hate the side effects (value). New data shows side effects are milder than they thought (fact). Do you override?"*
  *   Epistemic says **Yes** (Fact changed).
  *   Dworkin says **No** (Value judgment stands even on updated facts).

  ### Rule for Mixed or Tied Scores
  **The "Hard No" Rule:**
  Most clinicians answer case-by-case, resulting in a messy profile. Do not average your score. Instead, identify the **single case where you felt the strongest revulsion** at following the directive.
  *   If your "Hard No" was the **Happy Dementia** case: You are a **Current Welfare** theorist.
  *   If your "Hard No" was the **Secret Breach** case: You are a **Promising** theorist.
  *   If your "Hard No" was the **Competent Override** case: You are a **Contemporaneous Autonomy** theorist.
  *   If you have **no "Hard No"**: You are a **Strong Precedent** theorist.

  *Your ethical theory is defined by where you draw the line, not where you start.*
