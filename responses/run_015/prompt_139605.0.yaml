          *   One-sentence "awkward commitment" for each position.
          *   Tone: Professional, clinically grounded, philosophically rigorous but accessible.

  2.  **Deconstruct the Philosophical Space (The "Leaves"):**

      *   *Strong Precedent Autonomy:* The signature is a veto. Current welfare is secondary to past will.
      *   *Critical vs. Experiential (Dworkin):* Did the AD protect a life-value (critical) or just a mood (experiential)?
      *   *Epistemic/Defeasible:* Past self knew best *unless* facts changed.
      *   *Evidentiary:* AD is a hint, not a command. Current best interest rules.
      *   *Promising/Institutional:* It's about trust in the system, not just the patient.
      *   *Relational:* Decision is a negotiation, AD is a conversation starter.
      *   *Gradualist:* Authority scales with psychological connectedness.

      *   *The "Empty Leaf" Query:* "Earlier self has full authority over a later self who is completely competent, fully informed and has no impairment."
          *   *Analysis:* This is logically possible (a binding contract) but ethically repugnant in medicine (paternalism of the past). It violates the principle of contemporaneous consent. It's likely "incoherent" within a medical ethics framework because medical treatment requires *current* consent unless incapacity is established.

