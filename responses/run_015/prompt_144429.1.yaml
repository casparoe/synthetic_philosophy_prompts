  Nurse Alex participates in a hospital shift-swap market where she initially holds a Thursday shift but ranks Saturday highest, followed by Friday, then Thursday. The market operator offers sequential swap opportunities one at a time, each costing a $5 transaction fee, without disclosing future offers. Alex follows a rule of "Myopic Optimization": at each step, she accepts a swap if the new shift is strictly preferred to her current one, treating all prior fees as sunk costs irrelevant to the current comparison. She pays $5 to swap Thursday for Friday, then $5 to swap Friday for Saturday, and finally accepts a swap back to Thursday for $5 because, evaluating only the marginal difference between the shifts from her current standpoint while ignoring the cumulative $10 loss, she perceives the Thursday slot as offering a better immediate work-life balance ratio than Saturday, leading Alex to believe each individual transaction maximizes her value from her current standpoint.

  **Reasoning**

  **Preference Ordering:** Over final shift assignments, Alex's preferences are transitive (Saturday > Friday > Thursday). However, over comprehensive outcomes (Shift + Net Wealth), her effective preferences become intransitive due to the evaluation rule.

  **Bundling Method:** The agent uses **Local Bundling**, evaluating each decision node as an isolated choice between "Current Shift" and "New Shift," excluding sunk transaction costs from the utility calculation. A standard diachronic rationalist uses **Global Bundling**, evaluating the entire sequence of choices as a single plan to maximize final wealth and shift quality combined.

  **Diachronic Consistency:** A standard rationalist says **don't switch** because the global plan (Keep Thursday) yields higher net utility than the cycle (Thursday - $15). The agent's consistency rule (**Myopic Optimization**) lets them switch anyway because it satisfies **Separability** violations: the agent treats the current decision as independent of past costs, maximizing value relative to the immediate status quo rather than the initial state.

  **Structural Feature:** The pump is made possible by the **Violation of Consequentialism** (specifically, ignoring sunk costs). The agent treats the history of transactions as irrelevant to the current choice, allowing the same shift to be valued differently depending on the path taken to acquire it.

  **Collapse to Dutch Book:** Yes, removing this feature collapses the case into a regular Dutch Book. If the agent includes sunk costs in their outcome definition (comprehensive outcomes), the preference cycle (Thursday > Saturday - $15 > Friday - $10 > Thursday - $5) reveals explicit intransitivity over wealth-states, which is the standard definition of a Dutch Book vulnerability. The "trick" is merely masking intransitivity by narrowing the definition of "outcome" to exclude transaction history.
