answer: |-
  Your distinction between mnemonic and constitutive failure is the correct hinge for this seminar. Your co-instructor's reading—that Leonard lacks a community and therefore lacks meaning—is the standard takeaway, but it treats the film as a static diagram of the Private Language Argument. It ignores the dynamic horror of the film, which is not that Leonard *cannot* follow a rule, but that he *can*, arbitrarily, and calls it justice.

  The film does not merely illustrate Kripke's skeptical paradox; it dramatizes the ethical collapse of the skeptical solution. Kripke's Wittgenstein argues that without a community to establish correctness conditions, meaning vanishes. Leonard constructs a surrogate community of objects (tattoos, notes) and one human interlocutor (Teddy). The undergraduate's objection—that these external stores make the symbols public and stable—misses the core of the regress. The regress of interpretation is not about the physical stability of the signifier, but the indeterminacy of its application. A tattoo is a public token, yes, but it does not dictate its own use. When Leonard writes "Fact" on a Polaroid that contains an inference or a self-instruction, he is not recording a meaning; he is legislating one. The physical mark remains constant while the rule governing its application shifts. The undergrad assumes external memory solves the storage problem; Kripke shows there is no storage problem, only a normativity problem. Leonard's horror is not that he loses the note, but that he decides what the note *means* based on what he needs it to mean to sustain his narrative.

  This brings us to your distinction. If Leonard's failure were merely mnemonic, the tragedy would be epistemic: he wants to follow the rule of vengeance but forgets the data. If the failure is constitutive, the tragedy is metaphysical: there is no fact of the matter about who John G. is, only the rule Leonard imposes. The film suggests the latter by collapsing the Sammy Jankis story into Leonard's own history. Leonard's former job was to adjudicate the genuineness of claims—to be the community check on others. Now, he is the claimant and the adjudicator. The revelation that Sammy was likely a fabrication Leonard projects onto himself indicates that the "rule" of vengeance was never retrieved; it was constituted in the moment to justify an action already taken. The indeterminacy of "John G." functions similarly to *quus*, but with a crucial divergence. *Quus* is a logical possibility regarding mathematical functions; "John G." is a semantic vessel filled by desire. The skeptic argues we cannot mean addition rather than *quus* without community agreement. Leonard shows us that without honest community agreement, we can mean whatever allows us to sleep at night.

  This is where the film resists being a simple illustration and becomes an objection to the skeptical solution. Kripke's solution relies on a community of agreement to ground correctness. Teddy provides agreement, but he is a corrupt interlocutor. He confirms Leonard's rules not to establish truth, but to manipulate behavior. This reveals a gap in the skeptical solution: agreement is necessary but not sufficient; the community must also be truthful. A conspiracy can sustain a rule-following practice just as well as a truth-seeking community, but the practice becomes a mechanism of delusion rather than meaning. Leonard's closing decision to tattoo information he knows is false—to send himself after a new target—is the ultimate revolt against the skeptical solution. He knowingly institutes a false rule within a private system, using the trappings of public verification (the tattoo) to enforce a lie. He creates a community of one, agreeing with himself to maintain a fiction.

  The film's reverse-chronological form implicates the viewer in this failure. We are placed in Leonard's epistemic position, inferring the rule governing the sequence of events. We assume the narrative logic is stable, only to be forced to revise our interpretation when the chronological truth is revealed. We thought we were following the rule of "mystery solved"; the film forces us to realize we were following the rule of "narrative coherence." We, too, are susceptible to the constitutive failure. We cannot tell from the inside whether we are retrieving the correct interpretation or constituting a plausible one.

  So, how should you position this in class? Do not treat *Memento* as a clean illustration of Kripke. It is better used as a stress test of the skeptical solution's ethical requirements. The arguments alone establish that meaning requires community agreement. The film adds that meaning requires *integrity* within that community. Without it, rule-following becomes indistinguishable from self-deception. The film tells against the tidy reading that "no community equals no meaning." Leonard has a community (Teddy) and a public language (the notes), yet he means nothing true. He follows rules perfectly, but they are the wrong rules, and there is no fact of the matter to correct him.

  The film adds something the arguments alone do not: the phenomenology of the skeptical gap. Kripke's skeptic argues from the third-person perspective that there is no fact of the matter. Leonard lives the first-person horror of that void. He feels the lack of a fact and fills it with a tattoo. The film suggests that when the constitutive failure looms, the human response is not silence, but fabrication. We do not stop following rules when the facts run out; we make up new ones. This moves the debate from semantics to ethics. The problem isn't just how meaning is possible; it's what we are responsible for when we constitute it. Leonard is not a victim of amnesia; he is an author of vengeance. The film argues that the ultimate danger of the rule-following paradox is not skepticism, but the license it grants to create our own truths when the community fails us. Use the film to show that the skeptical solution requires not just agreement, but trust, and that without trust, the public language becomes a private tool for murder.
