answer: |-
  Subject: Draft Exam Q for Philosophy of Work – final tweaks?

  Hi there,

  Thanks for the chat over coffee. I've had a think about that 'credential gap' idea we discussed and I reckon it's strong enough to anchor the final essay question. It forces the students to move beyond the usual economic anxiety and actually grapple with the moral ontology of work. 

  Below is the question, a model answer I've knocked together to check the viability, and the marking scheme. I've kept it tight for a 75-minute slot. There's a typo in the instructions I'll fix before printing, but I'll leave it here for now so it looks like a proper draft.

  Best,
  J

  ***

  **EXAM QUESTION**

  **Time Allowed:** 75 Minutes
  **Instructions:** Answer ONE question. Write clearly and concisely. You are not required to recite specific theorists, but must engage with the conceptual arguments discussed in the seminar.

  **Question:**
  It has been argued that automation generates a 'credential gap': work traditionally functions as a moral credential that licenses claims to social respect, but automation severs the link between employment and productive contribution. Critically assess whether this gap undermines the concept of deserved respect in a post-work society, or whether respect can be coherently reconstructed without any reference to productive contribution. In your answer, consider whether decoupling respect from contribution is conceptually stable or merely wishful thinking.

  ***

  **MODEL ANSWER**

  The notion of a 'credential gap' posits that employment is not merely an economic transaction but a moral technology. It converts productive activity into social standing. When automation renders human labour superfluous, it does not simply remove income; it withdraws the moral license required to demand respect. To assess whether this undermines deserved respect, we must first analyse why contribution matters morally.

  Traditionally, contributive justice suggests that respect is reciprocal. I respect you because you contribute to the social whole; you respect me for the same reason. This creates a stable equilibrium where dignity is earned through utility. Automation disrupts this by decoupling survival from labour. If machines produce value more efficiently than humans, the 'credential' of work becomes scarce. Consequently, if respect remains tethered to contribution, a post-work society必然 creates a class of citizens who are structurally ineligible for dignity. This suggests the credential gap does indeed undermine deserved respect, provided we accept the premise that respect must be earned.

  However, the question is whether respect can be reconstructed without this reference. Proponents of a post-work ethic often argue for a shift from contributive justice to status equality. Here, respect is grounded in personhood or citizenship rather than productivity. This is conceptually possible; we already accord rights to children or the disabled who may not contribute economically. Yet, applying this universally is where stability falters. In current social ontology, 'idle' hands are often viewed with suspicion. Without the narrative of contribution, respect risks becoming charity rather than entitlement. Charity implies a hierarchy between the giver and receiver, whereas respect implies equality.

  Therefore, reconstructing respect requires more than policy changes like Universal Basic Income; it requires a metaphysical shift in how we value human time. If we cannot articulate a form of 'contribution' that is non-economic—such as care, community building, or artistic creation—the gap remains. But relying on these alternatives is risky. If these activities are not recognised as 'work' by the dominant culture, they fail to function as credentials. The credential gap persists because the moral grammar has not updated to match the economic reality.

  Ultimately, the stability of non-contributive respect depends on whether society can view existence itself as sufficient justification for standing. If respect is treated as a basic right akin to liberty, the gap closes. However, if respect is viewed as a reward for social utility, the gap is fatal. Currently, our moral language is hybrid; we speak of universal rights but practise contributive validation. This incoherence suggests that while reconstruction is possible, it is not yet stable. It remains wishful thinking until the moral grammar of work is rewritten to recognise non-productive agency as valuable. The credential gap, therefore, highlights not just an economic displacement, but a crisis of moral justification that automation exposes but does not solve.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  **1. Conceptual Definition of the 'Credential Gap' (4 marks)**
  *   **A Move:** Clearly defines the gap as a moral/structural disconnect between employment and social standing, distinct from mere unemployment or income loss.
  *   **Typical Mistake:** Treating the gap as synonymous with joblessness or focusing solely on financial hardship without addressing the 'moral license' aspect.

  **2. Analysis of the Contribution-Respect Link (4 marks)**
  *   **A Move:** Explains *why* contribution traditionally justifies respect (reciprocity, utility, social integration) and how automation severs this.
  *   **Typical Mistake:** Asserting the link exists without explaining the moral mechanism, or assuming respect is purely economic.

  **3. Evaluation of Non-Contributive Bases for Respect (4 marks)**
  *   **A Move:** Critically examines alternatives (personhood, citizenship, care) and assesses whether they can functionally replace work as a credential.
  *   **Typical Mistake:** Simply listing alternatives (e.g., "UBI solves it") without analysing whether they confer *dignity* or merely *subsistence*.

  **4. Critical Assessment of Conceptual Stability (4 marks)**
  *   **A Move:** Argues whether decoupling is stable or wishful thinking, addressing the cultural/moral inertia that resists non-productive value.
  *   **Typical Mistake:** Concluding it is definitely stable or unstable without nuanced justification regarding social ontology or moral grammar.

  **5. Use of Theory and Argumentation (4 marks)**
  *   **A Move:** Uses theoretical concepts (e.g., justice, ontology, agency) analytically to support claims, rather than name-dropping theorists descriptively.
  *   **Typical Mistake:** Reciting Marx's alienation or Arendt's categories without connecting them to the specific problem of the credential gap and respect.
