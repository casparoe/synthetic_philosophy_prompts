answer: |-
  Let me set the scene for you. Imagine the Celestial Risk-Assessment Office, Department of Eternal Wagers. 

  Senior Auditor Uriel is reviewing a standard proposal: one human soul staked against the classic St. Petersburg wager—you know, the coin toss that doubles the pot on every tail until the first head. 

  Mathematically, the expected value is infinite. Any rational agent should trade a finite soul for an infinite pot. But Uriel isn't a rational agent; he's a compliance officer. 

  The Office Manual, Section 42, Paragraph 4, states that all infinite series must be truncated at exactly the forty-second toss. Any payoff potential beyond that point is considered an "uncounted tail" and must be assigned a bureaucratic shadow cost that scales logarithmically against the number of excluded outcomes. 

  Since the number of excluded outcomes is infinite, the shadow cost is also infinite. 

  Uriel stamps the file **REJECTED**. 

  When the demon appeals, pointing out that the expected return is still infinite, Uriel doesn't even look up from his ledger. He says, "Look, I know the asset side shows infinity. But the shadow cost on the liability side is *also* infinity. And in this office, we recognize revenue only when the coin stops spinning, but we accrue compliance fees immediately. You're trying to offset a theoretical infinity against an actionable one. Come back when you have a finite soul *and* a finite tail."
