      *   The object: A clay statue. Clay is perfect because it can be melted down and remade easily, highlighting the tension.
      *   The conflict: The Engineer needs the clay *now* for a municipal project (pipes? bricks?). The Heir wants to save the *statue*.

  3.  **Character Conception:**
