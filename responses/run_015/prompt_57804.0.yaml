answer: |-
  The heat in Reclamation Depot 4 was not merely thermal; it was bureaucratic. It radiated from the smelting vats, but also from the friction of two incompatible systems grinding against one another. Kael wiped grease from his forehead, his eyes fixed on the conveyor belt where a lump of reddish-brown terracotta sat waiting. To his tablet, linked to the Substance Ledger, the object was Batch 902-B: forty-two kilograms of hydrated silicate, trace minerals consistent with Sector 7 clay. It was scheduled for melting at 14:00.

  At 13:55, the depot doors hissed open. Elara marched in, her boots clicking on the metal grating. She didn't look at the vats. She looked only at the clay.

  "Stop the belt," she said. Her voice was tight, carrying the weight of the Form Index.

  Kael didn't touch the controls. "Batch 902-B is marked for reclamation. The Substance Ledger clears it for recycling. There's a burst main in Sector 4. We need the mass for sealing compound."

  "It is not a batch," Elara said, stepping between Kael and the console. She slapped a document onto the metal surface. It bore the gold seal of the Art Registry. "This is *The Burden*. Sculpted by Orla Vane in 2089. It is a protected work of authorship."

  Kael glanced at the paper, then back at the clay. It was a rough figure, a human shape hunched over, arms wrapped around knees. It was dusty, chipped at the elbow, and utterly silent. "Orla Vane's signature is on the Ledger as a material deposit. She surrendered the mass to the city upon death. The Ledger tracks the atoms, Elara. The atoms are still here. Melting it doesn't destroy them. It just changes their arrangement."

  "It destroys the *work*," Elara snapped. She reached out, hovering her hands over the statue without touching it, as if her skin might contaminate the form. "You track lumps. I track meanings. If you melt this, the clay survives. *The Burden* does not. You are talking about two different things occupying the same space."

  "I'm talking about one thing," Kael said, tapping his tablet. "Matter is the only constant. Form is temporary. If I recast this clay into a pipe seal, the material continues its civic duty. If I leave it here, it hardens, cracks, and eventually turns to dust anyway. The Ledger prioritizes material continuity."

  "The Index prioritizes intentional continuity," Elara countered. "Orla intended this shape. That intent is the object. The clay is just the medium. You want to kill the object to save the medium."

  The alarm on Kael's tablet chirped. 13:58. "Sector 4 pressure is dropping. If I don't get that sealing compound in twenty minutes, three blocks lose water. Maybe structural integrity on the old line."

  "Then use other clay," Elara said.

  "There is no other refined clay in the district. Just this lump." Kael stepped around her, reaching for the manual override. "Look, I can cast the seal, and then you can have the clay back. I'll pour it into a mold of the statue. It'll look the same."

  Elara laughed, a sharp, brittle sound. "It won't be the same. It'll be a copy. A forgery made of the same atoms. If you melt it, the chain of authorship is broken. The Registry will delist it. It becomes scrap. You're asking me to authorize the murder of a legacy so you can fix a pipe."

  "I'm asking you to acknowledge that the pipe is real, and the water is real, and the people in Sector 4 need to drink," Kael said. He gripped the lever. "The Registry rules say if an object is dual-registered, the Substance Ledger takes precedence in emergencies. Mass is critical. Form is secondary."

  "Only if they are the same object!" Elara moved to the other side of the console. "If they are two things—a lump *and* a statue—then you own the lump, and I own the statue. You can't melt my property to fix your pipes."

  "Are they two things?" Kael challenged. He pointed at the scanner mounted above the belt. "Scan it. Let the system decide."

  Elara hesitated. She knew the scanners were calibrated to read both frequencies. She nodded.

  Kael hit the scan button. The machine hummed, a laser grid passing over the hunched figure. The screen flickered. Two bars loaded. One turned green: *Material Verified: 42kg Terracotta.* The other turned amber: *Artistic Integrity: Compromised but Extant.*

  "It sees both," Kael said.

  "It sees a conflict," Elara corrected. "It doesn't know if the art *is* the clay, or if the art *inhabits* the clay."

  The pressure alarm in the depot grew louder, syncing with the distant thrum of the city's failing infrastructure. Kael looked at the statue. For a second, he didn't see silicate. He saw the tension in the shoulders, the way the head was bowed. It looked tired. He looked at Elara. She looked terrified, not of the heat, but of the erasure.

  "If I melt it," Kael said quietly, "I satisfy the Ledger. The mass persists. The city drinks. But you lose the Index entry. You lose the tax exemption, the provenance, the name."

  "If I let you melt it," Elara said, "I save the Index entry by moving it to 'Destroyed by Civic Necessity,' but the work is gone. If I stop you, the work survives, but the city suffers the consequence of the shortage. The pipes burst. Who owns the damage? The Form Index doesn't cover flood liability."

  They stood on opposite sides of the console, the lever between them. The statue sat on the belt, inches from the chute that led to the furnace.

  "The coincidence is the problem," Kael murmured. "If the clay was different, or the shape was different, we wouldn't be here. But they are locked together."

  "Then unlock them," Elara said. "Take a sample. Scrape five kilos off the back. Use that for the seal. Leave the form mostly intact."

  Kael frowned. "That violates the Ledger's integrity rules for the batch. A partial melt creates unstable compounds. The seal might fail."

  "And preserving the whole violates the Index's rule against degradation," Elara shot back. "But it keeps the face recognizable."

  Kael looked at the timer. 13:59:30.

  He looked at the statue again. He thought about the atoms. They would not die. They would become part of the wall, part of the pipe, part of the earth. But the arrangement—the specific curve of the spine that Orla Vane had pressed with her thumbs seventy years ago—that would be unmade. Was that arrangement a thing? Or was it just a temporary state of the clay?

  If he pulled the lever, he treated the statue as a lump. If he didn't, he treated the lump as a statue. The physical action was identical; the metaphysical categorization changed the outcome.

  "Elara," Kael said. "If I don't pull this, Sector 4 goes dry. People might get sick. That's on the Form Index. Can your registry handle that weight?"

  "My registry handles memory," she said, her hand hovering over the emergency stop. "Yours handles survival. Which one matters more today?"

  "Both," Kael said. "That's why we're stuck."

  He didn't pull the lever. Instead, he keyed a code into the console that locked the conveyor. The belt jerked to a halt. The statue sat motionless before the furnace mouth.

  "I'm logging this as a Disputed Holding," Kael said. "Category: Ontological Ambiguity."

  "That's not a valid category," Elara said, exhaling a breath she seemed to have been holding for minutes.

  "It is now." Kael pulled a small sampling drill from his belt. "I'm taking five kilos from the base. It won't show on the front. It violates the Ledger's batch purity, and it violates the Index's structural integrity. We both break the rules. We share the blame."

  "The seal might fail," Elara warned.

  "And the statue might crumble," Kael replied. He engaged the drill. Dust plumed into the hot air. The sound was like bone grinding on stone. He collected the shavings into a canister.

  He handed the canister to the pneumatic tube system. "This goes to Sector 4. It's not enough for a full fix, but it might buy an hour."

  "And the rest?" Elara asked, brushing the red dust from the statue's feet.

  "The rest goes to the Vault," Kael said. "Neither recycled nor displayed. Just... kept."

  "Kept as what?" Elara asked. "A lump or a work?"

  Kael looked at the scanner. The green bar and the amber bar were still flickering, neither dominating the other. The machine couldn't decide if it was holding one object or two.

  "Kept as a question," Kael said. He stamped the manifest with both seals, one overlapping the other until the ink blurred. "Let the next engineer figure out if they're melting a statue or preserving a pipe."

  Elara nodded slowly. She didn't thank him. There was nothing to thank him for; they had merely postponed the collision of their worlds. She placed a hand on the statue's shoulder, feeling the cool, dry clay. Kael turned back to his monitors, watching the pressure in Sector 4 stabilize, then waver.

  The statue remained on the belt, neither fully matter nor fully form, waiting in the heat for a definition that neither registry could provide.
