      *   *Check:* Is the distinction consequential? *Correction:* Make sure the decision affects the water main or the inheritance directly.

      *(Self-Correction during drafting)*: I need to make sure the "practical question of whether one or two things are present" drives the decision.
      *   *Idea:* If it's one thing (the lump), Kael wins. If it's two things (lump + statue), Elara wins because the statue rights override lump rights.
      *   *Action:* They scan the object. The scanner gives two different IDs. This physicalizes the metaphysical split.

  9.  **Final Polish:**
