answer: |-
  This is a fantastic pivot. Your friend has effectively taken the Absent-Minded Driver (AMD) problem and injected it with a dose of Newcomb's Problem. The standard textbook version treats absent-mindedness as a lack of *temporal* orientation (I don't know if this is the first or second intersection). Your friend's framing treats it as a lack of *agential* continuity (I don't know if the "me" deciding now is the same "me" who decided before, or if my decision now tells me something about where I am).

  Here is the gut-level breakdown of the conceptual knot you're describing. It lives in the collision between **Choice as Evidence** and **Choice as Cause**, specifically when the "Choice" is the only thing tying your identity together across time.

  ### 1. The Evidential Trap: "Managing the News"
  You asked why evidential reasoning (EDT) recommends continuing even if you might be at Exit B.

  In standard rational choice, your action changes the world. In EDT, your action also updates your belief about the world. In this structural absent-mindedness framing, **your choice is the only data point you have about your location.**

  Imagine you are at an intersection. You don't know if it's A (wrong) or B (right).
  *   If you are the kind of agent who **Exits**, you are statistically more likely to be at Exit A (because the plan is usually to exit at B, so exiting early implies a deviation or a specific strategy that favors A).
  *   If you are the kind of agent who **Continues**, you are statistically more likely to be on the path toward B.

  Here is the knot: If you choose to **Exit**, you immediately gain evidence that you are the "type" who exits early, which makes it highly probable you are at Exit A (the wrong one). You effectively diagnose yourself as being in the trap *by trying to leave it*.

  Conversely, if you **Continue**, you generate evidence that you are the "disciplined type" who waits for the second exit. This makes it more probable you are safely passing A or arriving at B.

  So, EDT tells you to **Continue** not because it gets you to the goal, but because **Exiting is bad news.** It feels like you are prioritizing *looking like* you're on the right path over *actually being* on the right path. You are trapped in a loop where you can't act to fix your situation because the act of fixing it looks like evidence that you were broken to begin with.

  ### 2. The Causal Break: The Lever That Isn't Connected
  Now look at the causal side (CDT). Causal Decision Theory assumes that if I pull a lever now, it causes an effect later.

  In a normal decision tree, "Me at Node 1" and "Me at Node 2" are distinct temporal stages. I can causally influence Node 2 by making a plan at Node 1.
  But in this structural absent-mindedness framing, **Node 1 and Node 2 are epistemically identical.**

  *   **The Memory-of-Decision Layer:** This is the crux of your friend's point. If I decide "I will Continue" at Node 1, but at Node 2 I have no memory of making that decision (I don't even remember *deciding* to continue, let alone *being* at Node 1), then my decision at Node 1 has no causal grip on Node 2.
  *   **The Broken Link:** For a plan to work causally, the future self must execute the past self's intention. If the future self is absent-minded about the *decision itself*, they are effectively a new agent rolling the dice again.

  So, when you sit at the intersection and ask, "Does my choice to Continue cause me to get the reward?" the answer is **no**. Your choice only affects *this* intersection. It does not causally guarantee what happens at the *next* intersection, because the "you" at the next intersection won't remember the "you" at this intersection made a pact.

  This creates a feeling of **causal impotence**. You are trying to steer a car where the steering wheel disconnects from the wheels every few seconds. You can turn the wheel (make a choice), but you can't trust that the turn will persist through the next bend.

  ### 3. The Synthesis: The Fragmented Agent
  The gut-level paradox arises because rational choice assumes a **unified agent**. It assumes there is an "I" that persists through time, holds beliefs, and executes actions.

  Your friend's framing shatters that "I".
  1.  **As Evidence:** Your choice tells you who you are (location/strategy).
  2.  **As Cause:** Your choice is supposed to change where you go.

  When you combine them, you get a feedback loop with no ground.
  *   If I treat my choice as a **Cause**, I ignore the evidence it provides about my location (ignoring the EDT signal). But if I ignore that, I might Exit at A because I think I'm at B.
  *   If I treat my choice as **Evidence**, I ignore its causal power to change the outcome (ignoring the CDT lever). But if I do that, I just keep driving forever to maintain the "good news" that I'm still in the game, never actually exiting to get the prize.

  ### Why Standard Resolutions Feel Like They Miss the Point
  Standard solutions to the Absent-Minded Driver (like the "planning self" vs. "action self" distinction) try to solve this by saying: *"Ignore what you think now. Just stick to the plan you made before you got in the car."*

  But your friend's framing highlights why that feels like a cheat. It bypasses the **phenomenology of the choice**.
  *   The standard solution assumes you can bind your future self.
  *   The "memory-about-decision" framing says **you can't bind someone who won't remember the contract.**

  If I don't remember *making* the decision, I can't distinguish between "following a plan" and "making a new guess." The standard resolution asks you to trust a ghost (your past self). The framing you're discussing asks: *"How can I be rational when I am a ghost to myself?"*

  ### The Gut-Level Summary
  The paradox lives here: **Rationality requires control, but control requires memory.**

  To choose rationally, you need to know that your choice matters (causality) and that you know where you are (epistemology).
  *   In this framing, your choice distorts your knowledge of where you are (Evidential knot).
  *   And your lack of memory severs the causal link between your choice and the outcome (Causal knot).

  You are left standing at the intersection holding a steering wheel that isn't connected to the wheels, looking at a map that changes depending on which way you turn the wheel. The "rational" thing to do disappears because the prerequisites for agency—a stable self and a reliable world—have been removed. You aren't just lost; **the "you" that could get un-lost doesn't exist continuously enough to drive.**
