      *   *Clarification on EDT:* Why does EDT say continue? Because if you exit, you reveal you're the type who exits early (likely at A). If you continue, you reveal you're the type who waits (likely to reach B). So you continue to *prove* you're on track, even if continuing at B is wrong. This is the "managing the news" aspect.
      *   *Clarification on CDT:* CDT says "My action now doesn't change the past." But in AMD, my action now *is* the same as my action later. If I can't causally influence later-me, I can't execute a strategy.

  6.  **Final Polish:** Check tone. Keep it conversational but rigorous enough for a rational choice student. Avoid jargon where possible, or explain it immediately. (e.g., "self-locating belief").

      *(Self-Correction on the "Friend's Framing"):* The friend's framing sounds a lot like the tension between *Ex Ante* (planning) and *Ex Post* (action) rationality, but heightened by the idea that the action *itself* provides the indexical information. This is very close to the "Halpern-Passy" or "Aumann-Hart" discussions on forgotten memories, but I shouldn't name-drop. I should focus on the *experience* of the paradox.

      *Key Insight to convey:* The driver is trying to use their will to change the world, but their will is also the only data they have about the world. It's a feedback loop with no ground.

