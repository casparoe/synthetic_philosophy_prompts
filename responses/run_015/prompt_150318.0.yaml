prompt: |-
  i work as a backend engineer — zero formal philosophy, just tired of hearing people say "the outage was caused by inaction" and wondering what that actually means. i'm putting together a decision tree / taxonomy to sort positions on causation by omission, built from concrete cases and yes/no splits, not from philosopher names i won't recognize.

  running case: a data center has an automated backup that should trigger every sunday. the engineer on call skips the check (omission). monday the primary fails, backup doesn't work, data is lost. question: is the engineer's failure-to-check a cause of the loss?

  build the tree with branch nodes that are plain questions someone can answer without knowing the labels. cover at least these splits:
  - are omissions ever real causes, or only loose shorthand for "something else went wrong"?
  - if real, is counterfactual dependence enough (if he had checked, backup works), or do we need a normative/deontic layer (he was supposed to check)?
  - if counterfactual is enough, must there be a defined "normal course" or baseline (the sunday schedule) that makes the absence count, or can pure non-events be causal?
  - then my own injection: in a microservice setup, if three separate services all fail to send a heartbeat and the orchestrator crashes, is each missing heartbeat a cause, or does the causal work get diluted across omissions? how does your tree handle "diffuse omission"?

  for each leaf, give the position a name only if it's a genuinely named view (like a standard counterfactual account, a normative/deontic account, a baseline-relative account, or an omissions-are-never-causes view); otherwise label it "unnamed / unexplored." each leaf should carry one awkward commitment — the thing that makes it hard to swallow.

  flag any pair of leaves your tree can't really separate. also note one combination of answers that looks incoherent or just unattractive.

  keep it readable for someone who debugs code for a living. don't ask for bibliographies, reading lists, or citations — i don't have access to check papers and i'm definately not writing an essay. may contain a typo or two.

  Bottom line: finish with a single line that starts with "Bottom line:" summarizing the sharpest divide the tree reveals.
