answer: |-
  # Causation-by-Omission Debug Tree

  Start at the top. Answer **Yes** or **No** based on the outage case (engineer skips check, backup fails, data lost).

  ### Node 1: The Reality Check
  **Question:** Is "doing nothing" a real event in the causal chain, or is it just shorthand for "the real cause (hardware) wasn't stopped"?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  ### Node 2: The Duty Check
  **Question:** To call it a cause, is it enough that acting *would have worked* (counterfactual), or must there be a rule saying they *were supposed to act* (normative)?
  *   **Need a Rule/ Duty:** Go to **Leaf 2**.
  *   **Enough that it would have worked:** Go to **Node 3**.

  ### Node 3: The Baseline Check
  **Question:** Does the "would have worked" test apply to *anything* not done (e.g., "I didn't fly in and fix it"), or do we need a defined "normal course" (like the Sunday schedule) to count the absence?
  *   **Need a Schedule/Baseline:** Go to **Leaf 3**.
  *   **Any Non-Event Counts:** Go to **Node 4**.

  ### Node 4: The Diffuse Check (Microservice Stress Test)
  **Question:** In the heartbeat case (3 services miss heartbeats, orchestrator crashes), is *each* missing heartbeat a full cause of the crash, or does the causal work get split/diluted?
  *   **Each is a Full Cause:** Go to **Leaf 4**.
  *   **Causal Work Dilutes/Splits:** Go to **Leaf 5**.

  ---

  ## The Leaves (Positions)

  ### Leaf 1: Omissions-are-never-causes view
  *   **Position:** The engineer didn't cause the loss. The hardware failure caused the loss. The engineer just failed to intervene.
  *   **Awkward Commitment:** You can never list "failure to patch" or "failure to check" as a root cause in a post-mortem. Only positive actions (bugs introduced, servers fried) count. Blaming inaction is category error.

  ### Leaf 2: Normative/Deontic account
  *   **Position:** Causation depends on obligation. The omission is a cause because it violated a duty (on-call roster).
  *   **Awkward Commitment:** If the engineer was off-duty but happened to be in the building and skipped the check anyway, their inaction is *not* a cause of the loss, even if checking would have saved the data. Causation changes based on HR policies, not physics.

  ### Leaf 3: Baseline-relative account
  *   **Position:** Omissions are causes only relative to a expected standard state (the Sunday schedule).
  *   **Awkward Commitment:** If the Sunday schedule was deleted from the config yesterday, the engineer's failure to check today is not a cause, even if everyone still expected it to run. The "normal course" defines reality, not the outcome.

  ### Leaf 4: Standard counterfactual account
  *   **Position:** If the heartbeat existed, the crash wouldn't happen. Therefore, the missing heartbeat is a cause.
  *   **Awkward Commitment:** **Causal Inflation.** In the 3-service heartbeat case, there are now 3 distinct causes for 1 crash. If 100 dependencies timeout, you have 100 root causes. Your incident report becomes infinite.

  ### Leaf 5: Unnamed / unexplored
  *   **Position:** Omissions are causes, but "causal mass" is finite and shared among missing dependencies.
  *   **Awkward Commitment:** **Causal Conservation.** You have to treat causation like a limited resource (like CPU) that gets split. If 10 services fail, each is only 10% of a cause. There is no math for this, just vibes.

  ---

  ## Tree Artifacts & Glitches

  **Indistinguishable Leaves:**
  **Leaf 2 (Normative)** and **Leaf 3 (Baseline)** are hard to separate in production. A "baseline" is usually just a codified "norm." If the Sunday schedule exists, it's because someone decided it *should* exist. In practice, these two leaves produce the same ticket assignments.

  **Incoherent Combination:**
  Answering **No** at Node 1 (Omissions aren't real) but then trying to answer Node 4 (How to split blame among omissions). You can't calculate the distribution of causal weight for things you just claimed don't exist.

  Bottom line: The sharpest divide isn't about what happened, but whether causation is a physics problem (counterfactuals) or a policy problem (norms).
