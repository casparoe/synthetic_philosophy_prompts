answer: |-
  ### The Sketch

  **Teodor (Reductionist)**
  *   **Strongest Argument:** Causal closure. The micro-constituents physically push the atoms; if the front moves, the atoms moved. There is no "extra" force.
  *   **Strongest Argument:** Derivability in principle. Using renormalization group flows, the macro-law is recoverable from micro-Hamiltonians given specific limit conditions.
  *   **Soft Spot:** The derivation relies on infinite limits (thermodynamic limit, zero noise) that do not exist in the actual finite Kestrel samples.
  *   **Soft Spot:** The "micro-description" of the front is a messy, disjunctive list of forty different chemical mechanisms, not a unified natural kind.
  *   **Concession:** Admits the derivation is computationally intractable and relies on idealizations that are strictly false.
  *   **Concession:** Admits micro-details are irrelevant for *prediction*, even if they are responsible for *production*.

  **Ines (Emergentist/Autonomist)**
  *   **Strongest Argument:** Universality/Robustness. The $1/3$ exponent persists despite radical changes in micro-mechanism; the macro-law is more stable than the micro-story.
  *   **Strongest Argument:** Interventional Utility. We control the front speed via gradient $\Delta$, not by manipulating $10^{26}$ atoms; the macro-level is where the leverage is.
  *   **Soft Spot:** Causal Exclusion. If the micro-physics is complete, the macro-law risks being merely descriptive (epiphenomenal) rather than explanatory.
  *   **Soft Spot:** Ontological Ambiguity. Risks sounding like the macro-law is a "ghost" force if not carefully distinguished from the micro-constituents.
  *   **Concession:** Admits the macro-law supervenes on the micro (no micro change without macro change) and isn't magic.
  *   **Concession:** Admits "emergence" might be partly epistemic, but insists the stability is objective.

  ***

  ### The Whiteboard at 11 PM

  **Teodor:** (Erasing a corner of the board) Look, I'm not saying there's a little ghost in the lattice pushing the front. I'm saying if you take the Hamiltonian for any of the forty Kestrel variants, apply the renormalization group flow, and let $N \to \infty$ while noise $\to 0$ in that specific joint ratio, the $1/3$ pops out. It's derivable.

  **Ines:** (Leaning against the desk, coffee cold) I know you can derive it, Teo. I read the supplement. But you only get that exponent if you take limits that don't exist. Our samples are finite. The noise is non-zero. And yet the law holds. You're saying the law is real because you can derive it from a fiction—the infinite limit. I'm saying the law is real because it survives the fiction being false.

  **Teodor:** Okay, fair. The limit is an idealization. But here's where I get stuck on your side. If the micro-particles are doing all the physical work—colliding, hopping, transferring energy—what work is left for the "front" to do? If I explain the speed by citing the atom hopping rates, I've explained the speed. If you say "no, the Front Law explains it," aren't you just double-counting the cause? That's the exclusion worry. If the micro is sufficient, the macro is just a label for our ignorance.

  **Ines:** (Nods slowly) I hear you. It looks like epiphenomenalism. If the atoms do the pushing, the "front" is just a shadow. Here's my answer, and I want you to sit with it: Causation isn't just about production; it's about intervention. I can't intervene on $10^{26}$ atoms. I can intervene on $\Delta$. The macro-variable is the stable handle we have on the system. The micro-details cancel out—that's why the exponent is the same for band transport and polaron hopping. If the micro-story was the real explanation, changing the mechanism should change the exponent. It doesn't. The stability *is* the phenomenon.

  **Teodor:** (Sighs, caps the marker) Alright. I accept that the macro-variable is where the control is. I'll concede that for engineering purposes, the micro-story is noise. But you're ignoring the disjunctiveness problem. You say the "front" is the real kind. But physically, "being a front moving at $v$" is just a huge disjunction: (Mechanism A AND conditions X) OR (Mechanism B AND conditions Y)... across forty chemistries. There's no single micro-state corresponding to "front." It's not a natural kind at the bottom. It's just a pattern we project.

  **Ines:** And I say that disjunction is exactly why reduction fails. If the micro-description of the front is a horrible infinite disjunction of forty different chemistries, then the micro-theory doesn't explain the unity of the phenomenon. It lists the parts. It doesn't explain why the parts behave the same way. You're hiding the work in that "in-principle derivation." You say you *could* derive it for all forty, but the only reason you know how to set up the derivation is because you already know the macro-law holds. The tail is wagging the dog.

  **Teodor:** (Pauses, looks at the board) That stings. I'll concede that. The universality class guides the derivation, not vice versa. We know to look for that specific limit behavior because we see the exponent first. So the macro-law is heuristically prior. But... (he taps the board) ...ontologically? The atoms are still there. The SLO isn't a force in the rack.

  **Ines:** Wait, the what?

  **Teodor:** Sorry. Backend guy brain. It's like arguing if a service latency SLO is reducible to the code. The SLO survives total rewrites. Nobody thinks the SLO is an extra force in the server rack. But reading the code doesn't tell you the SLO. You need the system-level view.

  **Ines:** That's actually... pretty good. But here's where it breaks for me. Your SLO is a convention. We set it. The Kestrel exponent isn't. Nature forces it on us. That's why I can't just call it "epistemic." If it were just our ignorance, we could fix it with better microscopes. But better microscopes just show us different micro-mechanisms that still obey the same macro-law. The constraint comes from above, not below.

  **Teodor:** But "constraint from above" sounds spooky. I'll concede that the derivation is doing heavy lifting and relies on the macro-pattern to succeed. But I can't concede that the macro is ontologically distinct. If I build a simulator with the right micro-rules, the front emerges. I don't need to program the front.

  **Ines:** And I'll concede that the micro-rules are sufficient to generate the pattern. No magic. But generating isn't explaining. You can simulate a storm without explaining pressure systems. I'm saying the pressure system is the explanation, even if it's made of air molecules.

  **Teodor:** (Rubbing eyes) So we're stuck. You think the stability across micro-realizations makes the macro-law ontologically robust. I think the derivability from micro-rules makes the macro-law ontologically secondary, even if epistemically useful.

  **Ines:** Basically. You think the disagreement is about what exists. I think it's about what counts as an explanation.

  **Teodor:** Or maybe what exists depends on what counts as an explanation.

  **Ines:** (Turns off the light) Let's go home. The front isn't moving until tomorrow.

  ***

  ### Note on the SLO Analogy

  Your intuition is sharp: the analogy works perfectly for the **explanatory autonomy** claim (the macro property persists across micro-changes and is the level at which we intervene). It breaks on **normativity**. An SLO is a human convention—a promise we make about the system. The Kestrel exponent is a descriptive law of nature that holds regardless of human observation. Ines would argue the SLO is *merely* epistemic/conventional, whereas the exponent is ontologically robust despite being macro. Teodor would argue both are ultimately just descriptions of micro-states, though the SLO is further removed from the physics.
