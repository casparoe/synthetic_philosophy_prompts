      *Correction:* The prerequisite is that **Belief is a functional state, not a confidence score.** Engineers treat belief as $P > 0.95$. I need to break that mapping before starting. Belief = "I will act on this as true."

      *Closing Question:* Needs to distinguish "Risk of Error" (Preface) vs "Guaranteed Error" (Lottery).
