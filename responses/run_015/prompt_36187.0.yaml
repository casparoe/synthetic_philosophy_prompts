      *User's worry:* "Half the room will conclude [Lottery] it's just an artifact of pretending belief is all-or-nothing... and then when I get to the preface they'll treat it as the same thing."
      *Counter-argument:* If you do Preface first, they accept the belief state (because they feel it). Then Lottery shows that *statistical* support alone creates the same structure, forcing them to see if the *source* of justification matters.
      *Verdict:* **Preface First.** It validates their intuition that they hold inconsistent beliefs. Lottery then challenges whether that's rational or just a failure of aggregation.

