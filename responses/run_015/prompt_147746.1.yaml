answer: |-
  This is a dense set of questions, but you've pinpointed exactly where the historiography gets sticky. The tension between "structural inevitability" (the revolution *had* to eat its children) and "contingency" (specific actors made specific bad bets) is the fault line in modern revolutionary studies.

  Here is a breakdown of that conceptual knot, the AI analogy, and the secular myth problem.

  ### 1. The Knot: "Devouring Children" vs. Contingency
  The phrase "revolutions devour their children" implies a **teleological engine**. It suggests that once you start a revolution, there is a logical momentum that demands increasingly radical purity until the architects themselves are deemed impure. This fits a structuralist or ideological reading (e.g., Furet): the logic of "virtue" requires a constant enemy, and eventually, the only enemies left are the revolutionaries themselves.

  **The Contingency Conflict:**
  If you take a contingency view (e.g., Tackett or recent revisionists), the Terror wasn't an unfolding logic; it was a series of panic responses to specific threats (war, invasion, inflation).
  *   **The Example:** Look at the **Law of 22 Prairial Year II** (June 1794). This law stripped the accused of legal counsel and expanded the definition of "enemy of the people," leading to the Great Terror.
  *   **Structural Reading:** This was the inevitable culmination of Jacobin ideology. The revolution *had* to reach this point of total abstraction of justice.
  *   **Contingent Reading:** This was a specific tactical gamble by Robespierre and the Committee of Public Safety to outflank the Committee of General Security and silence critics in the Convention who were threatening to expose the Committee's extrajudicial killings. It was a power play, not a philosophical necessity.

  **The Conflict:** If the Law of 22 Prairial was a contingent power play, then the "devouring" wasn't a law of history; it was a **failure of coalition management.** The "children" weren't eaten because the Revolution demanded it; they were eaten because Robespierre ran out of political allies and chose terror over compromise.

  ### 2. The AI Alignment Analogy
  You are right to be suspicious of the Whig history here. When people compare AI Safety factions to Jacobins, they often implicitly assume a narrative arc: *Chaos $\rightarrow$ Radicalism $\rightarrow$ Stabilization $\rightarrow$ Liberal Democracy.* They treat the "Terror" phase as an unfortunate but necessary immune response of a new paradigm.

  If the Terror was contingent (a specific failure mode of high-stakes politics under uncertainty), the analogy changes:
  *   **Whig Analogy:** "AI Safety is the new Jacobinism; we must go through this regulatory purge to reach safe AI democracy." (Implies inevitability).
  *   **Contingent Analogy:** "AI Safety groups *risk* becoming Jacobin if they combine **epistemic closure** (we alone know the risk) with **monopoly on force** (regulatory capture) under **high existential anxiety**."

  The analogy holds water only if you strip it of *inevitability*. It shouldn't be "AI Safety *will* devour its children." It should be "Any high-stakes movement that relies on moral purity tests to signal commitment under uncertainty creates a game-theoretic incentive to purge moderates."

  This removes the Whig progress narrative. It doesn't say we are marching toward a better future; it says we are walking into the same trap because human coalition dynamics haven't changed since 1793.

  ### 3. Keeping the Pattern Without Whig History
  To keep the "devouring children" pattern without accepting that history is marching toward liberal democracy, you have to shift from a **historical law** to a **recurrent equilibrium.**

  Think of it as a **crisis topology**.
  *   **Condition A:** High existential threat (War in 1793, AGI risk in 2024).
  *   **Condition B:** Lack of objective metrics for success (What is "Victory"? What is "Aligned"?).
  *   **Condition C:** Reliance on moral signaling to maintain coalition cohesion.

  When A + B + C are present, "devouring children" becomes a stable strategy. You purge your allies to prove you aren't soft. This isn't progress; it's a **loop.** It allows you to say, "The Jacobins and the AI Safety hawks are doing the same thing," without implying that the AI outcome will inevitably result in a "Thermidorian Reaction" that leads to a better world. It might just lead to collapse. That preserves the pattern without the Whig optimism.

  ### 4. The Secular Myth Aside
  *Do secular societies need a shared myth of historical improvement to sustain institutional trust?*

  **Short answer:** Yes, but "improvement" is the wrong word. They need a myth of **resilience** or **procedural legitimacy.**

  Pure transparency and peer review are cognitively expensive. Most people cannot audit the Federal Reserve or read the code behind a voting machine. They need a heuristic for trust.
  *   **The Improvement Myth:** "Tomorrow will be richer/freer than today." (This is the Whig history applied to governance). This works during growth periods but shatters during stagnation or crisis (see: trust in institutions post-2008 or post-pandemic).
  *   **The Procedural Myth:** "The system is self-correcting." This is more robust. It doesn't promise things will get *better*, only that errors will be *caught*.

  However, even procedural legitimacy requires a secular "sacred" element. You need a shared belief that **truth is discoverable and matters.** If a society loses the myth that "peer review leads to closer approximation of truth" (and decides instead that it's just power signaling), transparency becomes useless.

  So, secular societies don't need a myth of *progress*, but they do need a myth of **intelligibility**—the belief that the world is not random, that institutions are capable of understanding it, and that they are trying to. Once that myth breaks, you don't get liberal democracy; you get conspiracy theories and warlordism.

  ### Summary
  The "devouring children" trope conflicts with contingency because one implies fate and the other implies choice. To make the AI analogy work without Whig history, treat the "Terror" not as a stage of development, but as a **recurrent failure mode of epistemic communities under stress.** And regarding secular trust: transparency is the engine, but the "myth" is the fuel. You can run on procedural legitimacy, but only if everyone agrees the procedure is sacred.
