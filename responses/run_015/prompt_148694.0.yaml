      *   *Analysis:* Distinguish between *Numerical Identity* (Customer's point: it's not the same atom-cluster) and *Qualitative/Functional Identity* (Friend's point: it plays the same role).
      *   *Verdict:* In the context of repair, the Friend is right. The "essence" of a machine part is its causal role. The Customer is right in a museum context.
      *   *Mind Changer:* Regulatory/Legal definition. If the manual says "Steel Only" for safety, function doesn't matter. Or if the bio-polymer degrades differently in 10 years (hidden temporal difference).
      *   *Shakiest Reasoning:* The Type/Token distinction. I might be glossing over the fact that they are agreeing on the *Type* but arguing about the *Token*. Also, the definition of "function" can be vague.

