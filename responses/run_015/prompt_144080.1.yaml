      *   *The "Löbian Obstacle" in AI:* Often associated with MIRI (Machine Intelligence Research Institute) work (e.g., Benja Fallenstein, Marcello Herreshoff, Paul Christiano). It relates to *self-modification* and *tiling agents*. An agent wants to create a successor that is as trustworthy as itself. If it requires a proof of the successor's soundness, Löb's theorem blocks it (unless the successor is weaker).
