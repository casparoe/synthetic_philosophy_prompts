  STATUTORY INSTRUMENT 2026 No. 414

  **The Livestock (Moral Settlement) Regulations 2026**

  *Made by the Office for Animal Settlement pursuant to the Moral Architecture Act 2025*

  **1. Citation and Commencement**
  These Regulations may be cited as the Livestock (Moral Settlement) Regulations 2026 and shall come into force on 1 January 2027.

  **2. The Halswell Threshold**
  (1) For the purposes of these Regulations, sentient entities are classified into two tiers: Persons and Sentients.
  (2) Persons are afforded Kantian side constraints; they may not be aggregated or sacrificed for utilitarian ends.
  (3) Sentients fall below the Halswell Threshold. Their moral status is aggregative. Suffering counts, but no side constraint is violated by painless termination provided the life, on balance, possessed positive welfare value.

  **3. The Aggregative Duty**
  (1) The Office shall maximise net positive experiences among Sentients.
  (2) Where a Sentient's life is projected to be net-positive, there exists a statutory obligation to bring such life into existence.
  (3) Vegetarianism, by reducing the total number of net-positive livestock lives, constitutes a regulatory breach unless medically exempted.

  **4. Genetic Harmonisation**
  (1) Pursuant to the Bodmin Demonstration Herd findings, breeding programmes shall prioritise the diminution of suffering capacity where this increases overall throughput of positive experiences.
  (2) Animals engineered with reduced nociceptive sensitivity are compliant provided their baseline welfare remains above the zero-sum line.

  **5. Termination Protocols**
  (1) Slaughter must occur at the welfare-maximising moment.
  (2) Continued existence beyond peak welfare efficiency is prohibited where marginal utility declines.

  **6. Wild Population Management**
  (1) The aggregative tier extends to all sentient life, including wild populations.
  (2) Predation and parasitism constitute unregulated welfare deficits. The Office shall intervene to hedonically manage the countryside.
  (3) Insect sentience shall be modelled probabilistically. Where probability exceeds 0.4, population controls apply.

  **7. Appeals and Threshold Review**
  (1) Appeals regarding classification under the Halswell Threshold may be lodged by guardians of great apes, infants, or the severely cognitively disabled.
  (2) The Office maintains that cognitive capacity, not species membership, determines tier placement. However, administrative continuity requires presumptive Personhood for humans until further notice.

  **Annex A: Costings and Modelling**
  Projected costs for wild hedonic management are offset by reduced veterinary expenditure under Regulation 4. Insect modelling assumes a utilitarian weight of 0.001 per individual. Mass sterilisation of wild predators is budgeted under Clause 6(2).

  **FAQ**
  *Q: Does this mandate meat consumption?*
  A: Citizens must consume enough to sustain the Bodmin Herd quotas. Refusal lowers net welfare.
  *Q: Are pets included?*
  A: Yes. Breeding must be licensed to ensure net-positive life trajectories.

  **8. External Submissions**
  A delegation claiming species membership of greater cognitive capacity has submitted an identical white paper with the tiers reversed. This submission is filed as Out of Scope (Pending Consultation).

  *Dr. A. J. Wetherby*
  Senior Civil Servant, Office for Animal Settlement
  *12 November 2026*

  ***

  **Note on Nozickian Commitments**

  Nozick's *Anarchy, State, and Utopia* explicitly proposes a two-tier view: side constraints for humans, utilitarianism for animals. It is settled that he uses this to explore the "replaceability argument" (painlessly killing animals with net-positive lives). However, the specific claim that he advocates breeding animals with diminished capacity to suffer is contested. While he logically explores modifying animals to fit utilitarian calculus, scholars debate whether this is an endorsement or a *reductio* of the utilitarian view itself. I have treated this as policy per your prompt, though Nozick's sincerity here is ambiguous. The premise that vegetarianism lowers net welfare follows strictly from the replaceability argument you supplied. I would flag Regulation 4(1) as depending on the contested reading regarding engineered suffering; Nozick mentions the possibility but does not explicitly mandate it as state policy. The rest of the document extrapolates logically from the aggregative premise you identified.
