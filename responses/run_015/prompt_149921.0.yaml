      *   *Is it verbal?* Maybe. What does "worse" mean? "More disutility" vs. "More morally urgent."
      *   *Is it Normative vs. Descriptive?* The group seems to be arguing normatively, but using descriptive intuitions as premises.
      *   *My Diagnosis:* It's a **structural meta-ethical disagreement** masked as a first-order calculation. Specifically, it's about the *continuity of value*.
          *   Side B assumes value is continuous and additive (Real Numbers).
          *   Side A assumes value is lexical or discontinuous (Hyperreals or Ordinal Ranks).
