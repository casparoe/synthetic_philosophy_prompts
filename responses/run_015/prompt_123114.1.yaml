answer: |-
  Here are nine questions tailored for your podcast. They assume your audience knows Hacking, respect the guest's sophistication, and target the structural tensions in proleptic nosology.

  ### 1. The Normative Circle
  **Question:** You argue we should judge categories by the loops they set off rather than their ontological accuracy. But to judge a loop as "good" or "bad," you need a metric—usually suffering, functioning, or stigma. Isn't there a circularity problem here? Those metrics are themselves shaped by the vocabulary circulating. If a category changes how people report suffering, how do you distinguish a category that *reduces* suffering from one that merely changes the *reporting* of suffering?

  **Likely Answer:** She will likely concede the circularity but argue it's not vicious. She'll say we look for *reflective equilibrium* over time. If a category stabilizes self-reports and allows for coordinated care that participants retrospectively endorse, that's a "good" loop. We aren't looking for a view from nowhere, just a stable, sustainable equilibrium.

  **Follow-up:** But stability isn't normativity. A caste system is stable. If the category itself teaches people to interpret their distress in a way that makes them compliant with the treatment, your metric (self-report) is captured by the loop. Do you have *any* standard for a good loop that isn't itself loop-shaped, or are we just optimizing for coherence within the system?

  ### 2. Stealth and Secrecy
  **Question:** Let's talk about stealth categories—research diagnoses kept out of clinical charts to prevent looping. This seems to run headlong into informed consent. If I'm in a study, don't I have a right to know what you're looking for? And practically, in the age of Google and patient portals, how do you stop these categories from leaking?

  **Likely Answer:** She'll probably argue that informed consent can be "blinded" to specific hypotheses without being deceptive, similar to placebo trials. Regarding leakage, she might argue that if a category is truly research-only, clinicians won't have the language to discuss it with patients, and the "half-life" is short enough that public uptake is minimized before the category is either retired or正式 adopted.

  **Follow-up:** But clinicians talk. Patients compare notes on Reddit. If a patient suspects they fit a "stealth" profile and asks, "Am I showing signs of X?" and you say, "That category doesn't exist for you," haven't you institutionalized gaslighting? If the stealth fails, doesn't the *secret* become the loop, creating a conspiracy narrative that distorts the data even more?

  ### 3. Mechanism and the "Loop-Proof" Level
  **Question:** Critics might say the solution to looping is to bypass folk psychology entirely and go mechanism-first, like the NIMH's RDoC or dimensional trait taxonomies. If we diagnose based on amygdala reactivity or cognitive throughput, surely that's loop-proof? Or do you think the loop just relocates downstream once people start saying, "My amygdala made me do it"?

  **Likely Answer:** She will almost certainly say the loop relocates. Biological essentialism is still a vocabulary that people ingest. Patients already say "my serotonin is low." Mechanism-first approaches aren't loop-proof; they just change the texture of the loop. She'd argue we shouldn't retreat to mechanism because it's "harder," but because it's not actually safer from feedback effects.

  **Follow-up:** If *every* level of description loops, is the retreat to mechanism insufficient rather than pointless? Is there *any* level of description that is loop-proof at all? If not, why prefer your pragmatic loops over biological ones? Is it just that your loops are more honest about their constructedness, or do you think they yield better outcomes?

  ### 4. Bereavement and Prolonged Grief
  **Question:** Let's apply this to real history. DSM-5 removed the bereavement exclusion for depression, then later added Prolonged Grief Disorder as its own diagnosis. By your lights, was the removal of the exclusion a "bad" loop (medicalizing normal sadness) and the new diagnosis a "good" one (targeting specific dysfunction)? How would you tell the difference inside a decade?

  **Likely Answer:** She'd likely argue the removal of the exclusion was a "rough" loop that caused confusion, while Prolonged Grief is a "refined" loop that carves out a specific help-seeking population. She'd say we tell the difference by looking at whether the diagnosis leads to effective interventions that patients value, versus just expanding the market for antidepressants.

  **Follow-up:** But help-seeking behavior is exactly what changes when you medicalize a condition. If you create a diagnosis, people seek help; if you measure success by "people seeking and receiving help," aren't you just measuring the success of your own marketing? How do you distinguish a genuine therapeutic loop from successful diagnostic expansion?

  ### 5. Autism and Advocacy
  **Question:** The autism community is the classic example of a looping kind: people classified organized around the category and demanded a say in it (neurodiversity). How do you distinguish legitimate uptake by advocacy movements from corrupting capture by pharma or insurers? Isn't the line between "community feedback" and "interest group pressure" just your politics?

  **Likely Answer:** She will likely draw a line based on *epistemic authority*. Advocacy movements bring lived experience that refines the category's utility; pharma brings financial incentives that distort it. She'd argue proleptic nosology requires centering the classified, so neurodiversity input is a feature, not a bug, whereas insurer input is noise.

  **Follow-up:** But advocacy groups also have agendas—some reject functioning labels that might secure funding for high-need individuals. If the "loop" involves the community rejecting the utility of the diagnosis for certain subgroups, does proleptic nosology require you to override the very people it claims to center? Who adjudicates when the "classified" disagree with each other?

  ### 6. Sunsets and Material Harm
  **Question:** Your sunset clause means every category gets reauthorized or retired on a fixed cycle. But for many patients, a diagnosis isn't just a label; it's disability payments, accommodations, and a sense of self. If a category sunsets, do people lose that support? Are you proposing a parallel bureaucracy to handle functional need separate from diagnostic code?

  **Likely Answer:** She'll probably say the system *should* move toward functional need rather than diagnostic codes, and sunsets force that conversation. She might argue that keeping a "dead" category alive just to preserve benefits is intellectually dishonest and harms future patients by cluttering the nosology.

  **Follow-up:** That's philosophically consistent but politically naive. If you pull the code, the money stops. If your proposal requires a welfare state that doesn't exist to work ethically, aren't you risking real harm for the sake of epistemic hygiene? Are you willing to accept that some "zombie categories" must be kept alive as administrative fictions to protect vulnerable people?

  ### 7. Measurement and Substitution
  **Question:** How do you measure a genuine loop versus diagnostic substitution or criteria creep? Think of the childhood bipolar story: a new category was added partly to soak up overdiagnosis, but the category itself made clinicians notice behaviors they hadn't before. Given that the category is precisely what makes people notice, how do you get a baseline to measure against?

  **Likely Answer:** She'd suggest longitudinal tracking of outcomes independent of the diagnosis (e.g., school completion, suicide rates, family stability). If the category changes but outcomes worsen, it's a bad loop/substitution. If outcomes improve, it's a useful refinement.

  **Follow-up:** But those outcomes are also loop-sensitive. If "school completion" becomes the metric, schools might change how they handle disruptive kids to game the metric. If the category makes clinicians notice behaviors, you can't get a pre-category baseline. Aren't you comparing the loop to itself?

  ### 8. The Authority Question
  **Question:** You say "ask what a category does." But *who* is asking? Is it the APA committee? The patients? The insurance actuaries? Proleptic nosology seems to require a judge of loops. If the judge is embedded in the system (like the APA), isn't there a risk they'll judge loops based on institutional self-preservation rather than patient welfare?

  **Likely Answer:** She likely advocates for a pluralistic oversight body—ethicists, patients, clinicians, and philosophers. She'd argue that making the evaluation explicit is better than the current system where the evaluation is hidden behind "scientific validity."

  **Follow-up:** But that just moves the politics from the definition of the disease to the composition of the committee. If the "goodness" of a loop is a political judgment, why dress it up as nosology? Why not just admit this is bioethics policy, not taxonomy?

  ### 9. Falsification
  **Question:** To end on a methodological note: what evidence would actually count against your view? What finding, if we had it, would make proleptic nosology a *bad* idea rather than just an unfashionable one? If a static, essentialist category suddenly produced better long-term outcomes than your looping, pragmatic ones, would you abandon the view?

  **Likely Answer:** She should say yes. If a "carving nature at the joints" approach consistently yielded better human outcomes than her pragmatic approach, she'd switch. Her claim is instrumental: this works better.

  **Follow-up:** But if that happened, it would imply that looping effects are negligible for that category. If looping is negligible, then Hacking was wrong about that kind. So your whole theory rests on the empirical claim that looping is *always* significant. Is there any psychiatric kind where you'd say, "Actually, this one doesn't loop, so let's treat it like a bone fracture"?
