answer: |-
  The principle that best unifies your gut verdicts (while cleaning up the inconsistencies you noted) is what I will call **The Non-Defective Authorization Principle.**

  ### The Principle
  **Consent is valid if and only if it constitutes an authorization of the specific act by an agent with sufficient capacity, free from illegitimate pressure, and without deception regarding essential terms.**

  This breaks down into three necessary conditions. If *any* one fails, consent is invalid:
  1.  **Capacity:** The agent must possess the cognitive ability to understand the nature and consequences of the act *at the time of agreement*. (Addresses Cases 4 & 5).
  2.  **Voluntariness:** The choice must not be compelled by threats or by the partner exploiting a vulnerability they helped create or are duty-bound to mitigate. (Addresses Cases 3 & 6).
  3.  **Essential Information:** The agent must not be deceived about facts that define the *nature* of the act or the *risks* they personally deem material. (Addresses Cases 1, 2, & 7).

  ### Applying the Principle to Your Cases

  Here is how **Non-Defective Authorization** maps onto your list, including the cases you were unsure about.

  *   **1. Married Guy (Invalid):** **Fail on Essential Information.** Marital status is traditionally considered an "essential term" of sexual exclusivity agreements. Deception here vitiates authorization.
  *   **2. Drug Trial (Valid):** **Pass.** You stipulated the info (funding source) would not have changed her decision ("there for the money"). Therefore, it was not *material* to her authorization. The omission was gross, but it did not defect the will.
  *   **3. Landlord (Invalid):** **Fail on Voluntariness.** Even without explicit threats, the landlord holds power over a basic need (housing). By engaging sexually, he is implicitly leveraging that power. The "alternative" (eviction) is an illegitimate pressure in this context.
  *   **4. Competent Minor (Valid):** **Pass on Capacity.** Your principle correctly identifies that capacity is functional, not just chronological. If she understands the numbers better than the guardians, she meets the Capacity condition.
  *   **5. Drunk Party (Invalid*):** **Fail on Capacity.** (See below for why you must drop this verdict).
  *   **6. Consent App/Fight (Invalid):** **Fail on Voluntariness.** Saying "yes" to avoid a two-hour fight is coercion. The "cost" of refusal was artificially inflated by the partner's temperament.
  *   **7. Kink Script (Invalid):** **Fail on Essential Information/Scope.** Consent was given to *Script A*. The dominant performed *Script B*. Even if enjoyable, the authorization did not cover the act that actually occurred.
  *   **Flip-Flop Case (Mistaken Violence): (Valid).** **Pass.** She has Capacity. There is no Voluntariness failure because the partner made no threat and created no danger. There is no Information failure because he did not lie. Her fear is internal. Under this principle, consent is valid, even if the decision was based on a tragic mistake.

  ### The Verdict You Must Drop

  **You must drop Case 5 (The Drunk Party).**

  **Reasoning:** Your current theory relies on "later endorsement" (ratification) to cure the defect. **The Non-Defective Authorization Principle** rejects this. Consent is a *time-specific* transfer of rights. If Capacity is impaired at Time T (due to intoxication), the authorization is void *at Time T*.

  Next-day sobriety cannot retroactively grant capacity to the intoxicated self. To argue otherwise is to say that a person can authorize a contract while unconscious, provided they like the results when they wake up. While her lack of regret suggests no *harm* was done, it does not prove *consent* was valid at the moment of the act. If you keep Case 5 as Valid, you break the link between Case 4 (Capacity) and Case 6 (Voluntariness), because you are allowing outcomes to validate process.

  ### The New Case Prediction

  Here is a case your original principle struggled with, but **Non-Defective Authorization** resolves:

  **The Case:** A woman consents to sex with a man she meets at a bar. He is wearing a uniform of a specific emergency response team. She is attracted to heroes. He is not actually a member of that team; he bought the uniform online. He never verbally claims to be a member, but doesn't correct her assumption. She finds out later.

  **Prediction:** **Invalid.**
  **Why:** This fails the **Essential Information** condition. Unlike Case 2 (funding source), identity and profession can be "essential terms" if they are the primary basis of the attraction and trust (similar to Case 1, the married guy). He allowed a deception regarding his identity to stand, which defects the authorization.

  ### Where This Principle Is Likely Wrong

  I am committing to this account, but I must acknowledge its weaknesses. There are two places where **Non-Defective Authorization** likely fails to capture moral reality:

  1.  **The Flip-Flop Case (Mistaken Violence):** The principle says this is **Valid**. Morally, this feels cold. If a woman consents because she fears violence, even if that fear is unreasonable and uninduced, the sex occurs under a cloud of terror. The principle prioritizes the *partner's* innocence over the *agent's* subjective safety. A better moral theory might say consent requires not just the absence of threats, but the *presence of safety*, though enforcing that is practically difficult.
  2.  **Case 2 (Drug Trial):** The principle says this is **Valid** because the info wasn't material *to her*. But ethically, there is an argument that some information (like who is funding risk data) is *inherently* material, regardless of the subject's immediate financial motivation. The principle allows people to waive rights they perhaps shouldn't be allowed to waive (paternalism vs. autonomy).

  ### Summary
  Your gut was mostly right, but your theory was too focused on "alternatives" and "regret." The unifying thread is **Authorization Integrity**.
  *   **Drop Case 5:** Intoxication kills capacity, regardless of regret.
  *   **Accept Flip-Flop:** Internal fears without external coercion do not invalidate consent under this account, however tragic.
  *   **Keep the rest:** They all hinge on whether the "Yes" matched the agent's actual will regarding the *essentials* of the interaction.
