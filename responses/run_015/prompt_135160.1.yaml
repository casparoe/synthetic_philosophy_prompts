      *   **Addressing the "Dogma" Fear:** Rejecting the absolutist *naya* as invalid doesn't make it dogmatic; it makes it normative. Science does this too (e.g., "Flat Earth" is a standpoint, but we reject it as invalid without claiming dogmatic infallibility, just better explanatory power).
