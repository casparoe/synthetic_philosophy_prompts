  hey so i was trying to formalize anekantavada for a logic assignment and now i'm stuck in a loop. here's the arg my study partner walked me into. (1) jain non-one-sidedness says every proposition is true only relative to some naya (standpoint) and never unqualified. (2) apply that to itself: anekantavada is only true from the philosophical naya, and false from an absolutist naya. (3) but if there's an absolutist naya where it's false, then within that naya there are beliefs that are unqualifiedly true or false. (4) so anekantavada actually entails that absolute truth exists somewhere, which is exactly what it denies. (5) the only way out is to reject (3) and say the absolutist naya is incoherent or not a real standpoint. (6) but then you're saying some nayas are illegitimate, which violates the symetric relation in (1). (7) therefore anekantavada collapses into either self-contradiction or hidden absolutism. i think (3) is where it slips, but i don't know what it costs to reject it — does it make jain logic just another dogmatic system? can you tell me which step to kill and what the price is? also i might have messed up the jain view of standpoints being symetric, so flag that if it's wrong.
