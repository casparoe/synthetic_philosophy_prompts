      *   **Primary Target:** Step (1) and Step (6) are the weakest links regarding the interpretation of Jainism. Step (3) is logically slippery but the real philosophical error is assuming all *nayas* are equally valid (symmetry).
      *   **Correction on Symmetry:** *Nayas* are not symmetric. *Durnayas* (false standpoints) exist. *Ekantavada* (one-sidedness) is explicitly rejected as error.
