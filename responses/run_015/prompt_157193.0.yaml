prompt: |-
  hey — i'm a philosophy of mind phd student and i've been arguing with a collegue in our dept specifcally about hofstadter's careenium setup: do symmballs actually push the substrate around (the symms), or are they just high-level descriptions of symm-on-symm dynamics? we're trying to write an adversarial collaboration doc like the ones in social psych but for metaphysics of mind. can you draft it?

  structure should be:
  1. agreed claims: the careenium as cranium/substrate, symmballs as symbol-level patterns, downward causation defined as symbol-level states altering substrate dynamics in ways not fully captured by lower-level descriptions
  2. disagreement table in neutral wording: my camp says symmballs have genuine downward causal power (e.g., a belief about danger rerouting motor plans without being reducible to specific neuron firings); their camp says all pushing is substrate-level and symmballs are just useful tracking devices
  3. cruxes: (a) the split-brain case — does bifurcation show symbol-level causation or just substrate split? (b) a hypothetical "mirror careenium" where two coupled systems share symbol streams — would cross-system symbol alignment cause substrate changes in the other, or just correlated noise? (c) "symmball condensation" — stable symbol-clusters that resist substrate perturbation — proof of downward causation or just substrate stability?
  for each crux both sides should record a concrete prediction or what evidence would move them

  please keep it focused, don't cite papers or ask for a bibliography, and phrase disagreements so neither side sounds straw-manned. also don't lean on obscure hofstadter scholarship — just treat careenium/symmballs/symms as shared vocabulary. don't overpolish the tone.
