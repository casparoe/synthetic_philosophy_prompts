answer: |-
  Good evening.

  I stand before you having recently crossed the threshold of adulthood. I am eighteen years old. Like many of my peers in this room, I received my voter registration card with a sense of gravity that felt almost ceremonial. We were told that voting is the engine of democracy, the primary mechanism by which we shape our community. So, when I entered the booth for the first time last month, I expected to feel empowered. Instead, I felt paralyzed.

  In the race for our town council, I faced a choice that felt less like a selection and more like a trap. One candidate endorsed policies I found deeply unjust. The other appeared personally decent but demonstrated a manifest inability to govern. I left that race blank. I walked out of the polling station telling myself I had preserved my integrity. I told myself that by refusing to choose between two flaws, I had kept my hands clean.

  But in the weeks since, a quiet doubt has taken root. Was that abstention an act of principle, or was it an abandonment of responsibility?

  Tonight, I want to explore that doubt with you. We often talk about voting as a binary of action and inaction. We assume that casting a ballot makes you a participant, while leaving it blank makes you an observer. I propose that this distinction is an illusion. To understand why, we must consider a concept I call "expressive asymmetry."

  We tend to think of a blank ballot as a neutral non-expression—a silence that says nothing. But in a civic election, silence is never truly silent. When I leave a race blank, I am not opting out of the outcome; I am opting out of the *selection* of the outcome. The winner will still be declared. The policies will still be enacted. By withholding my vote, I did not stop the machinery of governance; I merely surrendered my influence over its direction.

  This is the asymmetry. The voter who selects a "lesser evil" compromises their values to influence the result. The abstainer preserves their values but acquiesces to a result they did not choose. Both of us are bound to the winner. The difference is that the voter accepted the burden of that connection, while the abstainer hid behind the appearance of purity. My blank ballot was not a refusal to participate in the system; it was a tacit acceptance of whatever the system produced.

  To my fellow first-time voters who faced this dilemma and stayed home: I offer you comfort, but not absolution. It is painful to feel that every available option betrays some part of your conscience. That pain is evidence of your moral seriousness. Do not let anyone tell you that your integrity is meaningless. However, do not let that integrity become a shelter. We cannot claim to care about justice while refusing to engage in the messy arithmetic required to achieve it. If we abstain to remain pure, we must admit that our purity is purchased at the cost of influence.

  To the seasoned officials and the voters who did cast a ballot for a flawed candidate: I offer you respect, but not a pardon. You understood that governance is the art of the possible. You accepted the moral residue of compromise to prevent a worse outcome or to secure a marginal good. That is a heavy burden to carry. But do not let the act of voting become a ritual that cleanses you of further obligation. Casting a vote is not a transaction where you purchase a year's worth of civic virtue. If you voted for a flawed candidate, you are now doubly responsible for holding them to account. You cannot claim the credit for their victory while disowning the failures of their tenure.

  We are all implicated in the world we inhabit. The voter is implicated in the compromises required to maintain it. The abstainer is implicated in the consequences of their absence. Expressive asymmetry teaches us that there is no safe distance from power. There is only the degree to which we are willing to own our connection to it.

  So, where does this leave us? It leaves us with a civic duty that is far more demanding than simply showing up on election day. It requires us to abandon the fantasy of the perfect choice. It asks us to recognize that democracy is not a machine that runs itself, nor is it a stage for our personal moral performance. It is a shared project of imperfect people trying to build a livable future.

  I left my ballot blank because I was afraid of being complicit in injustice. I now realize that I was already complicit the moment I decided that my hands were more important than my town's direction. Next time, I may vote. I may still abstain. But I will do so knowing that silence is a statement, and that participation is a burden we all share, regardless of how we mark the paper.

  Let us not seek to be the purest people in the room. Let us seek to be the most responsible neighbors.

  Thank you.
