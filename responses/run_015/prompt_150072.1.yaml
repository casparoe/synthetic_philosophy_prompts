answer: |-
  You are grappling with a classic problem in the philosophy of history and memory: the tension between **epistemic authority** (what can be known and verified) and **moral authority** (what must be remembered to sustain justice and identity). Your intuitions are remarkably stable across the first four cases, suggesting you already operate with a latent framework. The instability in the fifth case (the atrocity numbers) arises because it pits your epistemic commitment to truth (Cases 2 & 4) against your moral commitment to the oppressed (Case 3).

  To achieve reflective equilibrium, I propose a governing principle I will call **The Principle of Epistemic Legitimacy and Moral Jurisdiction.**

  ### The Principle

  This principle distinguishes memory claims along two axes:
  1.  **Epistemic Legitimacy of the Record:** Is the conflicting historical record a neutral artifact, or is it an instrument of the oppression being contested?
  2.  **Jurisdiction of the Claim:** Is the memory functioning as an *adjudicative fact* (claiming to describe external reality for public policy) or a *constitutive truth* (describing internal meaning, identity, or ritual)?

  **The Rules:**
  *   **Rule A (The Colonial Exception):** Living memory overrides the historical record when the record is itself *constitutive of the injustice* (e.g., colonial maps, discriminatory laws). Here, the record lacks epistemic legitimacy because it was designed to erase the memory. (Applies to Case 3).
  *   **Rule B (The Adjudicative Standard):** For public policy, pedagogy, and legal claims, living memory yields to the historical record when the record is forensically or neutrally secure, *unless* Rule A applies. Myths that obscure harm or causal mechanisms must be corrected. (Applies to Cases 2 & 4).
  *   **Rule C (The Ritual Domain):** Living memory retains sovereignty over the historical record when the claim is restricted to internal, ritual, or kinship domains where no external adjudicative claim is made. (Applies to Case 1).
  *   **Rule D (The Decoupling Clause):** In cases of atrocity where forensic evidence contradicts survivor memory on *magnitude* (numbers), the **fact** yields to the evidence (Rule B), but the **moral weight** yields to the memory (Rule A/C). The number must be corrected, but the correction cannot be used to minimize the crime.

  ---

  ### Resolving the Atrocity-Number Case (Case 5)

  **Verdict:** You must accept the forensic figure (400) for public history and policy, but you must reject any inference that 400 victims warrants less moral recognition than 4,000.

  **Reasoning:**
  This is the crux of your equilibrium. To remain consistent with **Case 4 (National Civic Education)**, you cannot sustain a factual falsehood in public curriculum if the evidence is secure. If you allow the 4,000 figure to stand as fact, you undermine the epistemic ground required to defend **Case 3 (Indigenous Claims)**. In Case 3, you argue Indigenous oral tradition should be believed *as evidence* against colonial maps. If you argue that memory overrides *forensic archaeology* in Case 5, you reduce Indigenous oral tradition in Case 3 from "alternative evidence" to "unfalsifiable belief," which weakens its legal standing.

  However, to remain consistent with **Case 3**, you must recognize that the demand for numerical precision can be a tool of minimization. The "compounding violence" you fear does not come from the number 400; it comes from the *usage* of the number to suggest the crime was "smaller."

  **Application of Rule D:**
  *   **Public Record:** State 400. (Consistent with Case 4).
  *   **Memorial Policy:** The memorial must not be scaled down. 400 murdered civilians is a catastrophe demanding the same structural response as 4,000.
  *   **Moral Education:** Teach that the discrepancy itself is part of the historical trauma (e.g., "The state lost the records, but the survivors remember the scale of loss; forensics found 400, but the community's grief encompasses the missing").

  You do not need to drop a previous judgment, but you must refine **Case 3**. In Case 3, the Oral Tradition wins not simply because it is memory, but because the Colonial Map is *normatively tainted*. In Case 5, Forensic Archaeology is *normatively neutral*. That distinction preserves consistency.

  ---

  ### The Family Ancestor Case (Case 6)

  **Verdict:** The family may retain the "resistance" narrative for internal kinship rituals, but must not assert it as public historical fact.

  **Reasoning:**
  This falls squarely under **Rule C (The Ritual Domain)** and aligns with **Case 1 (Diasporic Religious)**.
  *   **Internal Domain:** If the "resistance" framing operates as a metaphor for cultural preservation (a constitutive truth about how the family survived psychologically), it functions like the liturgical calendar in Case 1. It is true *for them* regarding their identity, even if factually false regarding the ancestor's actions.
  *   **External Domain:** If the family were to seek public honors, pensions, or historical markers based on this claim, Rule B would apply, and the archival record (collaboration) would override the memory.
  *   **Constraint:** This permission holds only so long as the "collaboration" did not involve active harm to others that the myth obscures. If the ancestor betrayed neighbors to the occupiers, the "resistance" myth becomes a Case 4 scenario (obscuring harm), and even private reverence becomes morally problematic. Assuming the prompt's "metaphor for cultural preservation" holds, the internal narrative is permissible.

  ---

  ### Consistency Check: Do Any Verdicts Need Dropping?

  You can maintain all your existing verdicts, provided you accept the **Epistemic Legitimacy** distinction between Case 3 and Case 5.

  1.  **Case 1 (Religious Date):** Consistent. (Rule C: Ritual Domain).
  2.  **Case 2 (Mill Closure):** Consistent. (Rule B: Adjudicative Fact. The ledgers are neutral economic data; the lockout myth obscures economic causality).
  3.  **Case 3 (Indigenous Land):** Consistent. (Rule A: Colonial Exception. The maps are instruments of dispossession, not neutral records).
  4.  **Case 4 (National Myth):** Consistent. (Rule B: Adjudicative Fact. The security reports reveal hidden truth; the myth obscures harm).
  5.  **Case 5 (Atrocity Numbers):** Resolved. (Rule B + Rule D. Forensics are neutral, so the number corrects, but the moral weight remains).
  6.  **Case 6 (Family Ancestor):** Resolved. (Rule C: Ritual Domain, bounded by Rule B if made public).

  **The Only Risk to Equilibrium:**
  The only tension point is if you feel that accepting the 400 figure in Case 5 *betray* the survivors in a way that accepting the Bankruptcy Record in Case 2 does not betray the workers.
  *   *Resolution:* The difference is that in Case 2, the "Lockout" narrative is a *political interpretation* of economic facts. In Case 5, the "4,000" is a *physical claim* about bodies.
  *   If you cannot accept the 400 figure, you must logically elevate Case 5 to match Case 3. To do that, you would have to argue that the "Administrative Documents" in Case 5 are as normatively tainted as the "Colonial Maps" in Case 3. If you can argue that the state's counting of its own victims is inherently an act of erasure (a common argument in critical genocide studies), then Memory wins in Case 5.
  *   *However,* the presence of **Forensic Archaeology** makes this difficult. Bones are not state documents. To maintain consistency with Case 4 (where declassified reports corrected the myth), you should allow the forensics to correct the number.

  ### Summary of the Coherent Principle

  **"Memory governs meaning; Evidence governs fact; Justice governs the interface."**

  *   **Fact:** Yield to the most epistemically secure source (Forensics/Archives), unless that source is an instrument of oppression (Colonial Maps).
  *   **Meaning:** Yield to the community's living memory (Rituals/Solidarity/Moral Weight).
  *   **Justice:** Never allow the correction of Fact to diminish the Moral Weight of the Memory.

  This allows you to teach the 400 figure without betraying the 4,000 memory, and to honor the family's resistance myth without lying to the public historian.
