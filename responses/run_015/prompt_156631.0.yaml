answer: |-
  This is a remarkably precise observation of a specific rhetorical and ethical maneuver. You have identified a gap in the standard binary of "truth vs. lie" where the *architecture* of communication is weaponized rather than the content.

  Here is a breakdown of the existing literature, a proposal for naming this specific pattern, and an analysis of the ethical implications you raised.

  ### 1. Existing Concepts and Literature

  There is no single word that captures the *temporal* aspect you described (building credit on small truths to spend on a big deception), but several fields map onto parts of it.

  **A. Paltering (Psychology/Negotiation)**
  The closest established term is **paltering**. In behavioral ethics (notably research by Rogers, Zeckhauser, et al. from Harvard), paltering is defined as the active use of truthful statements to convey a false impression.
  *   *Fit:* It covers the "true but useless detail" and "technically accurate framing."
  *   *Gap:* Paltering usually refers to a single interaction. It doesn't fully capture the *reputation building* phase you described (being blunt about small faults to buy trust for the big misdirection).

  **B. Conversational Implicature (Linguistics/Philosophy)**
  This is the mechanism. Based on Paul Grice's **Cooperative Principle**, communication relies on maxims (Quality, Quantity, Relation, Manner). When a speaker follows the *letter* of the Maxim of Quality (do not say what you believe to be false) but violates the Maxim of Quantity (make your contribution as informative as required) or Relation (be relevant), they generate a **misleading implicature**.
  *   *The Mechanism:* The speaker relies on the listener to fill in the gap. If the listener infers $X$, and the speaker knows $X$ is false but says something that implies $X$ without stating it, the speaker has misled without lying.

  **C. Moral Licensing (Social Psychology)**
  This explains the *reputation* dynamic. Moral licensing occurs when past moral behavior (being painfully honest about small errors) makes people feel licensed to act unethically later (misleading on the big issue) without feeling guilty, and crucially, without being judged as harshly by others.
  *   *Fit:* This explains why the audience trusts the "blunt" person. Their history of small honesty creates a "moral credit" that insulates them from suspicion when they pivot to misleading.

  **D. Epistemic Corruption (Virtue Epistemology)**
  Philosopher Quassim Cassam writes about **epistemic vices**. This pattern fits the definition of an epistemic vice that degrades knowledge. It is a form of **intellectual manipulation** where the speaker's perceived virtue (honesty) is the tool used to corrupt the listener's belief system.

  ### 2. Naming the Pattern

  Since "paltering" misses the temporal/reputation element, and "moral licensing" misses the linguistic element, I propose calling this **Honesty Banking** or **Credibility Arbitrage**.

  **Definition:** *The strategic accumulation of trust through low-stakes veracity, which is then spent to secure high-stakes misdirection via technically true statements.*

  **Marking the Edges:**
  To distinguish this from simple honesty or simple lying, three conditions must be met:
  1.  **Technical Veracity:** Every atomic proposition asserted is true.
  2.  **Predictive Failure:** The listener forms a false belief based on reasonable pragmatic inference.
  3.  **Capitalization:** The speaker relies on a pre-existing reputation for honesty (or builds one in real-time) to prevent the listener from scrutinizing the implication.

  ### 3. The Question of Intent and Habit

  You asked: *Does it matter whether the small-scale honesty is calculated? What if it's a habit?*

  **If Calculated:**
  This is **Machiavellian Manipulation**. The agent treats truth as a currency. They are lying in spirit while telling the truth in letter. This is arguably more dangerous than lying because it is harder to detect and punishes the audience for trusting the speaker's established character.

  **If Unconscious (Habit):**
  This is a form of **Self-Deception** or **Motivated Blindness**. The person likely views themselves as "radically honest" because they focus on the technical truth of their sentences. They offload the responsibility of interpretation onto the audience ("I never said that; you assumed it").
  *   *Ethical Status:* Even if unconscious, it remains a vice. In virtue ethics, negligence regarding how one is understood is a failure of the duty of communication. If you know you are blunt, you know you are trusted. Failing to correct a known misinterpretation is a form of deception, regardless of internal intent.

  **If Audience Fault:**
  *What if the misreading is really the audience's fault?*
  Gricean linguistics suggests communication is a cooperative effort. However, power dynamics matter. If a researcher knows the press only reads the abstract, and writes the abstract to be technically true but practically misleading, the "fault" lies with the researcher. They are exploiting a known constraint of the communication channel. Relying on the audience's laziness or cognitive bias to complete the deception does not absolve the speaker; it weaponizes it.

  ### 4. The Ethical Core: Does the Distinction Collapse?

  You asked the most important question: *Does the usual claim that lying is worse than misleading still do any moral work?*

  In standard deontological ethics (e.g., Kant), lying is worse because it corrupts the faculty of communication. Misleading is often seen as a "lesser sin" because the listener retains agency to interpret.

  **However, in the case of Honesty Banking, the distinction collapses and arguably inverts.**

  Here is why this pattern may be **worse** than a direct lie:

  1.  **Parasitism on Trust:** A liar attacks trust. An "honesty banker" *uses* trust as the weapon. They make the audience's rationality (trusting a previously honest person) the cause of their own deception. This makes future trust harder to calibrate.
  2.  **Plausible Deniability:** When caught, a liar must admit guilt. An honesty banker can gaslight the accuser: "I told you the truth! You're the one who interpreted it that way. Why are you attacking my honesty?" This shields them from accountability and punishes the victim for noticing.
  3.  **Corruption of the Signal:** If lying is noise, this pattern is **signal jamming**. It makes the "truth-teller" signal unreliable. If the most "honest" people in the room are the ones most capable of this sophisticated misdirection, the social utility of honesty is degraded.

  **Conclusion:**
  The moral distinction between lying and misleading relies on the idea that misleading leaves the listener a "way out"—a chance to interpret correctly. But **Honesty Banking** removes that way out by pre-loading the listener's interpretation with unearned trust.

  If this pattern is real and common (and your examples suggest it is), then the moral shield of "I didn't lie, I just misled" loses its force. It becomes a **higher-order deception**: a lie about one's relationship to the truth.

  **Recommended Reading:**
  *   *Lying and Deception* by Thomas L. Carson (for the philosophy of misleading vs. lying).
  *   *The Honest Truth About Dishonesty* by Dan Ariely (for the psychology of rationalization).
  *   "The Paltering Framework" (Rogers, Zeckhauser, Gino, Norton, Schweitzer) - *Harvard Business School Working Paper*.
  *   *Vices of the Mind* by Quassim Cassam (for the epistemic corruption angle).
