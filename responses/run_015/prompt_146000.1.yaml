answer: |-
  I have been thinking deeply about your description of the impasse, and I want to start by saying that the fatigue you describe is entirely understandable. When a committee spends two years circling a definition without traction, it is usually a sign that the concept itself is bearing too much weight, not that the committee is failing to lift it. Your hypothesis that the therapy enhancement distinction is being asked to perform three separate jobs is the most promising diagnostic tool I have seen for this kind of stalemate. It resonates because it explains why the arguments feel like they are sliding past one another. When one member speaks about resource allocation, they are speaking the language of justice and scarcity. When another speaks about permission, they are speaking the language of liberty and autonomy. When a third speaks about identity and meaning, they are speaking the language of narrative and integrity. You are not merely disagreeing about where to draw a line; you are disagreeing about which map you are using.

  If we test your hypothesis against the cases you catalogued, the fractures become visible. Take the third-party case, which you suspect breaks the machinery. In the allocative frame, an intervention that makes a patient with dementia easier to care for looks like a public health good, potentially warranting coverage because it reduces systemic burden. In the permissive frame, it is ethically neutral provided consent is managed via proxy. But in the interpretive frame, it is deeply troubling because it treats the patient as a means to social ease rather than an end in themselves. The reason your committee cannot agree on whether this is therapy or enhancement is that therapy implies a benefit to the patient's health, while enhancement implies a boost to function, yet here the function serves the caregiver. The distinction collapses because the beneficiary has shifted. Similarly, the conversion case reveals the split between the allocative and interpretive jobs. If a lost capacity is substituted with a different one that works equally well, the allocative job sees no problem because function is restored. The interpretive job, however, sees a rupture in the patient's identity. If the patient experiences the new capacity as alien, calling it therapy launders a profound existential change as a mere medical repair. Your hypothesis holds up because these cases do not just test the boundary of normal function; they test the boundary of whose interests matter and what counts as a life well-lived.

  This leads me to your question about what follows from this diagnosis. You ask whether the dispute is largely verbal, whether there is a real residual disagreement, or whether a hidden empirical question is doing the work. My view is that it is not merely verbal, nor is it primarily empirical. It is a structural conflict about the purpose of medicine itself. The dispute is real because the three jobs you identified are often incompatible. An intervention can be allocatively justified because it saves money, permissively justified because the patient wants it, and interpretively disastrous because it undermines the patient's sense of self. If you try to use a single binary distinction to resolve all three tensions, you will fail every time. The reason no argument lands is that a successful argument for the allocative job often looks like a failure for the interpretive job. When someone argues that a rising-floor intervention is therapy because everyone benefits, they are solving the allocation problem but ignoring the interpretive problem of whether a shifted baseline changes the meaning of human effort. When someone argues it is enhancement because it exceeds the species-typical, they are protecting the interpretive narrative but potentially failing the allocative test of need.

  So, what counts as progress? I do not think you will find a missing distinction or a graded scale that solves this. A scale merely adds precision to a concept that is being asked to do the wrong work. Nor do I think empirical results about positional goods will settle it, because the core conflict is normative. Progress lies in explicitly separating the jobs. You should stop trying to define therapy and enhancement for the committee as a whole and start defining them for the specific decision context. When you are meeting to decide coverage policies, you are doing the allocative job, and you should admit that you are ranking interventions by social value and cost-effectiveness, not by metaphysical naturalness. When you are meeting to decide on individual consent or parental authority, you are doing the permissive job, and the threshold should be harm and autonomy, not whether the intervention is natural. When you are meeting to counsel a patient on what an intervention means for their life, you are doing the interpretive job, and the language should be about identity and narrative coherence.

  The impasse persists because you are trying to find a single definition that satisfies all three contexts simultaneously, which is impossible. The concept of enhancement is a proxy battle for deeper conflicts about justice and identity, and it will always carry incompatible commitments if you force it to remain unified. My honest view is that you should abandon the search for a unified definition. Instead, propose that the committee adopts a contextual framework. Acknowledge that an intervention can be therapeutic in the allocative sense, enhancement in the permissive sense, and alienating in the interpretive sense, all at once. This does not solve the moral tension, but it stops you from fighting about semantics when you are actually fighting about values. It allows you to say that we will fund this because it is efficient, allow it because it is consensual, but counsel against it because it changes who you are. That is not a contradiction; it is honesty. If you can make that shift, you may find that the distinction itself becomes less important than the clarity of the question you are asking in each room. I hope this helps you break the deadlock, not by finding the right answer, but by asking the right questions in the right order.
