answer: |-
  ### 1. Exam Question

  **Time Allowed:** 75 Minutes
  **Word Limit:** None (but quality over quantity is expected)

  **Question:**

  Galen Strawson's Basic Argument posits that true moral responsibility requires an agent to be *causa sui* (cause of oneself), a condition impossible to satisfy because it generates an infinite regress: to be responsible for one's nature, one must have chosen it, but that choice would depend on a prior nature for which one must also be responsible.

  Critics suggest Strawson's argument illicitly slides between a **causal-explanatory demand** (that every feature of the agent be traceable to prior causes) and a **normative-justificatory demand** (that the agent be the ultimate source of her will in a way that grounds desert).

  Consider the following scenario: An adult human's neural architecture is gradually, over thirty years, replaced by functionally identical synthetic substrates. Psychological continuity is preserved throughout. The resulting being cannot trace any of its present mental states to biological origins but can trace them only to earlier synthetic states.

  Evaluate whether Strawson's regress holds against this being. In your answer, determine if distinguishing between causal-explanatory and normative-justificatory demands allows the being to satisfy the conditions for moral responsibility despite the impossibility of *causa sui*. Clearly distinguish between the logical structure of Strawson's argument (which is largely settled) and the premises regarding "ultimate sourcehood" (which remain contested).

  ***

  ### 2. Model Answer

  Galen Strawson's Basic Argument is a formidable challenge to libertarian and compatibilist accounts of moral responsibility. Its logical structure is widely accepted as valid: if responsibility for an action requires responsibility for the mental states producing it, and those states result from prior causes (genetic or environmental), the agent cannot be ultimately responsible. To escape this, the agent would need to be *causa sui*. Since nothing can cause itself, true moral responsibility appears impossible. This regress is the settled logical core of Strawson's position; if one accepts his premises, the conclusion follows inescapably.

  However, the force of the argument depends on the plausibility of its premises, specifically the requirement for "ultimate responsibility." Here, the distinction between causal-explanatory and normative-justificatory demands becomes crucial. The causal-explanatory demand insists that for an agent to be responsible, the chain of explanation for their will must terminate in the agent, not in prior external causes. Strawson assumes this is necessary for desert. Conversely, the normative-justificatory demand suggests that responsibility requires only that the agent possesses the rational authority to own their will, regardless of its causal history. If responsibility is about normative authority rather than causal origination, the regress might be arrested not by becoming *causa sui*, but by recognizing that causal origin is irrelevant to desert.

  Applying this to the neural-replacement scenario illuminates the tension. In this case, the being's current mental states are causally traceable only to prior synthetic states, not biological ones. From a strictly causal-explanatory perspective, Strawson's regress remains intact. The synthetic states were determined by the initial decision to undergo replacement and the prior biological psychology that made that decision. The substitution of substrate does not break the causal chain; it merely extends it. The being is still not the *causa sui* of its synthetic architecture, as the transition was governed by prior psychological laws and states for which it was not ultimately responsible. If Strawson's causal-explanatory demand is correct, the synthetic being is no more responsible than the biological predecessor.

  However, if we shift to the normative-justificatory demand, the scenario offers a potential escape. Because psychological continuity is preserved, the being retains the capacity for rational reflection and self-governance. Proponents of this view argue that moral responsibility attaches to the agent's current capacity to recognize reasons and regulate behavior, not to the metaphysical origin of their neural substrate. On this view, the "slide" Strawson commits is assuming that causal origination is a prerequisite for normative authority. The synthetic being can claim ownership of its states because they are integrated into a coherent, rational agency, even if those states are causally determined by prior synthetic configurations. The regress stops being vicious because the demand for ultimate causal sourcehood is rejected as a category error.

  Nevertheless, it remains contested whether this normative move successfully defeats Strawson. Strawson would argue that without causal sourcehood, normative authority is an illusion; one cannot truly "own" a will that one did not ultimately shape. The neural-replacement case does not settle this dispute. It demonstrates that substrate independence does not solve the regress, but it leaves open whether psychological continuity is sufficient for desert.

  In conclusion, Strawson's logical regress is sound, but its application relies on the contested premise that responsibility requires ultimate causal sourcehood. The neural-replacement scenario shows that changing the causal history (biological to synthetic) does not satisfy the causal-explanatory demand. Whether it satisfies the normative-justificatory demand depends on whether one accepts that rational agency, independent of *causa sui*, grounds desert. This remains the central fault line in the literature: whether the impossibility of self-creation entails the impossibility of responsibility, or merely the impossibility of a specific, perhaps incoherent, conception of it.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Grading Logic:** Marks are awarded for specific intellectual moves. An **A-range** answer (16-20) executes these moves with nuance, acknowledging philosophical contingency. A **B-range** answer (12-15) executes them mechanically or misses the distinction between settled and contested claims.

  | Intellectual Move | Marks | A-Range Performance (Excellent) | B-Range Performance (Competent/Limited) | Common Student Failures |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Reconstruction of the Regress** | 4 | Clearly articulates the *causa sui* requirement and the infinite regress logic as valid/settled. | Accurately summarizes Strawson but may treat the conclusion as fact rather than conditional on premises. | **Failure:** Confusing Strawson's regress with standard hard determinism; missing the specific "nature/choice" loop. |
  | **2. Explication of the Distinction** | 4 | Precisely defines causal-explanatory (traceability) vs. normative-justificatory (authority/desert) demands. | Defines the terms but may blur the line between "cause" and "reason" without philosophical precision. | **Failure:** Treating the distinction as merely semantic rather than substantive regarding the conditions for responsibility. |
  | **3. Application to Scenario** | 4 | Analyzes the synthetic brain case to show it fails the causal demand but potentially meets the normative demand. | Applies the scenario but treats the substrate change as automatically solving (or failing) the problem without nuance. | **Failure:** Ignoring the "psychological continuity" clause; arguing the synthetic brain is a "new person" irrelevantly. |
  | **4. Evaluating the "Slide"** | 4 | Critically assesses whether the distinction successfully blocks the regress or if Strawson's premise holds firm. | Argues one side is definitely correct (e.g., "Strawson is wrong because...") without acknowledging the counter-argument. | **Failure:** Asserting the distinction dissolves the problem without explaining *why* normative authority survives causal determination. |
  | **5. Meta-Philosophical Awareness** | 4 | Explicitly distinguishes settled logic from contested premises (sourcehood); avoids dogmatism. | Mentions disagreement in the field but writes as if the "correct" view is established consensus. | **Failure:** Presenting the model answer's conclusion (or their own) as the settled truth of the literature. |

  **Note on Grading:**
  *   **A-Range (16-20):** Demonstrates that the scenario *tests* the distinction but does not *resolve* the debate. Uses hedging language ("Strawson contends," "Proponents argue").
  *   **B-Range (12-15):** Accurate summary but lacks critical distance. May treat Strawson's conclusion as proven fact or dismiss it too easily via the scenario.
  *   **C-Range (8-11):** Misses the specific distinction requested; focuses on general free will issues; mishandles the scenario.
  *   **Fail (0-7):** Fundamental misunderstanding of Strawson's argument or the prompt requirements.
