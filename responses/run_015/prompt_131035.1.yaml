answer: |-
  ### Desiderata for a Tripartite Theory of Liberty

  To move beyond taxonomy and into operational utility, a theory of liberty must function as a diagnostic tool, not just a labeling system. Below are the requirements for a framework that can genuinely distinguish negative, positive, and republican liberty without collapsing them into a single metric of "goodness."

  #### 1. The Hard Cases (Operational Stress Tests)
  An adequate theory must deliver distinct verdicts on these scenarios. If all three concepts yield the same answer, the distinction is useless.

  *   **The Benevolent Master:** A slave whose master never interferes and grants every wish.
      *   *Requirement:* The theory must explain why this agent is unfree despite the absence of interference. It must identify the *status* of dependency as the liberty-violating factor, not just the *act* of coercion.
  *   **The Structurally Locked Worker:** An agent who formally accepts a dangerous job, but only because property laws and economic necessity have closed all other exits.
      *   *Requirement:* The theory must distinguish between natural scarcity (no bridge exists) and social constraint (a bridge exists but tolls are prohibitive). It must determine if background conditions count as interference or domination.
  *   **The Democratic Obedient:** A citizen who obeys a law she voted against, or even one she voted for.
      *   *Requirement:* The theory must clarify whether the source of the law (self vs. other) negates the interference. It must explain if liberty is lost when the constraint is impersonal but binding.
  *   **Predictive Domination:** An algorithmic system adjusts prices, search results, or access permissions based on perfect forecasting of your behavior. It collapses your option space pre-emptively. No command is issued; no physical block is erected; you simply never see the path you would have taken.
      *   *Requirement:* The theory must identify a liberty violation where there is no observable interference event and potentially no identifiable dominator (if the system is decentralized market logic). It must account for *counterfactual* control without an active controller.

  #### 2. Conceptual Distinctions (Boundary Conditions)
  The theory must maintain firewall separation between these pairs. Collapsing them renders the concept of liberty inflationary and analytically useless.

  *   **Liberty vs. The Value of Liberty:** The theory must be able to say "Agent X is free to do Y" even if doing Y is self-destructive or morally repugnant. Conflating liberty with the *goodness* of the outcome turns liberty into a consequentialist metric.
  *   **Absence of Interference vs. Absence of Arbitrary Power:** It must distinguish between being left alone by luck (negative) and being left alone by right (republican). If the benevolent master changes his mind, the negative libertarian sees no change until interference occurs; the republican sees a liberty loss the moment the power remains arbitrary.
  *   **Self-Mastery vs. Mere Non-Interference:** It must distinguish between doing what you want (negative) and wanting what you rationally should want (positive). If an addict chooses drugs, negative liberty says she is free; positive liberty may say she is enslaved to passion. The theory must pick a lane on whether internal coherence matters.
  *   **Holding a Right vs. Exercising Capacity:** It must distinguish between the legal permission to fly (right) and the money to buy a ticket (capacity). A theory that requires capacity for liberty risks conflating liberty with wealth; a theory that ignores capacity risks making liberty purely formal.

  #### 3. Consistency Constraints (External Coherence)
  The theory cannot exist in a vacuum; it must align with empirical data on human psychology and agency.

  *   **Adaptive Preferences:** The theory cannot treat preferences formed under oppression as neutral data. If a prisoner claims to love his cell, the theory must have a mechanism to discount this preference without resorting to paternalistic mind-reading. It must acknowledge that preferences can be endogenous to the constraint.
  *   **Internal Constraints:** The theory must account for addiction, compulsion, and false consciousness.
      *   *Constraint:* If these count as liberty-reducing, the theory risks sliding into positive liberty paternalism (who defines the "true" self?).
      *   *Constraint:* If these do not count, the theory ignores the phenomenological reality of unfreedom.
      *   *Requirement:* A precise criterion for when internal states count as constraints versus when they are just part of the agent's identity.

  #### 4. Jointly Unsatisfiable Pairs (The Fatal Tension)
  Your hunch is correct. The following pair creates a structural break in the logic of liberty.

  *   **Strict Non-Interference + Democratic Authorship of All Binding Laws.**
      *   *The Tension:* If liberty is strictly the absence of interference (Negative), then *any* law reduces liberty, regardless of whether you voted for it. A law you authored still physically prevents you from doing something.
      *   *The Break:* To claim that democratic laws do *not* reduce liberty, you must shift the definition of liberty from "non-interference" to "non-domination" (Republican) or "self-rule" (Positive). You cannot maintain that liberty is purely the size of the unobstructed option set *and* that legitimate political authority is compatible with full liberty.
      *   *Verdict:* This is fatal for any theory trying to be purely Negative while supporting democratic legitimacy. You must concede either that democracy always costs liberty (Negative consistency) or that liberty is not just non-interference (Republican/Positive shift).

  #### 5. The Theory Killer
  **Predictive Domination** is the single desideratum that inflicts the most damage across the board, specifically because it removes the *agent* required by existing theories.

  *   **Why it kills Negative Liberty:** There is no interference event. The option space shrinks, but no one pushed you. Negative liberty requires an interferer.
  *   **Why it kills Republican Liberty:** There may be no dominator. If the predictive system is a market equilibrium or a decentralized algorithm, there is no arbitrary *will* holding power over you. Republican liberty requires a master capable of arbitrary interference.
  *   **Why it strains Positive Liberty:** It suggests autonomy is compromised by external architecture, not internal irrationality. However, Positive liberty is the only one with the tools to describe "compromised agency," but it lacks the political vocabulary to blame the system without sounding conspiratorial.
  *   **Verdict:** This case exposes that all three traditional models rely on a human-agency model of constraint (someone stopping someone). When constraint becomes environmental and pre-emptive, the triad loses its grip.

  #### 6. Quick Verdict Scorecard

  **Negative Liberty (Berlin-style)**
  *   **Benevolent Master:** Passes (calls it freedom). *Failure:* Intuitively wrong.
  *   **Structural Lock:** Passes (calls it freedom). *Failure:* Ignores economic coercion.
  *   **Democratic Law:** Fails (must admit law reduces liberty). *Failure:* Politically unstable.
  *   **Predictive Domination:** Fails (no interference event). *Failure:* Obsolete in digital contexts.
  *   **Internal Constraints:** Passes (addiction is not unfreedom). *Failure:* Ignores phenomenology.
  *   **Overall:** Conceptually clean, empirically brittle. Collapses under structural and algorithmic pressure.

  **Positive Liberty (Self-Mastery)**
  *   **Benevolent Master:** Fails (calls it unfreedom due to dependency). *Success:* Matches intuition.
  *   **Structural Lock:** Fails (calls it unfreedom due to limited development). *Success:* Matches intuition.
  *   **Democratic Law:** Passes (if law aligns with rational will). *Success:* Explains legitimacy.
  *   **Predictive Domination:** Passes (calls it autonomy loss). *Success:* Captures the harm.
  *   **Internal Constraints:** Fails (risks paternalism). *Failure:* Who defines the "true" self? High risk of authoritarian drift.
  *   **Overall:** High diagnostic power, high political risk. Cannot constrain the theorist from imposing their own view of rationality.

  **Republican Liberty (Non-Domination)**
  *   **Benevolent Master:** Passes (calls it unfreedom due to arbitrary power). *Success:* Best handling of this case.
  *   **Structural Lock:** Mixed (depends on if structures count as arbitrary power). *Failure:* Often struggles with impersonal market forces.
  *   **Democratic Law:** Passes (law is non-arbitrary if tracked interests). *Success:* Reconciles law and liberty.
  *   **Predictive Domination:** Fails (requires a dominator). *Failure:* Struggles with agentless algorithms.
  *   **Internal Constraints:** Fails (usually treats these as non-political). *Failure:* Ignores internalized oppression.
  *   **Overall:** Best political theory, weakest psychological theory. Requires a master to identify unfreedom, leaving it blind to systemic or algorithmic domination without a face.
