  1. The Scenario and Stakes
  The tenure committee faces Candidate X: an exemplary scholar with a documented record of abusing people outside academia. The charter mandates evaluation based solely on research, teaching, and collegiality. Dr. Lin argues that external moral facts constitute wrong-kind reasons (WKRs) for tenure decisions; treating them as relevant corrupts the institutional practice by importing alien normative standards. Dr. Reyes contends that WKRs apply to individual attitudes, not collective mandates. For Reyes, the exclusion is merely procedural ("outside the mandate"), not metaphysical ("wrong kind"). This case strains the standard framing because institutions lack the doxastic or conative states typically associated with the WKR problem, forcing a confrontation between role-based normativity and collective agency.

  2. The Dialogue
  **Lin:** The committee's deliberation is a specific normative practice, not a general moral inquest. If we deny tenure based on external harm, we aren't judging professional fit; we're punishing moral failure. That is the hallmark of a wrong-kind reason. It bypasses the internal goods of the university—truth-seeking and pedagogy—and substitutes a foreign currency of moral desert. The *purpose* of tenure restricts the logical space of relevant reasons. To treat moral history as a strike against tenure is to category-mistake the institution itself.

  **Reyes:** But that "logical space" is just the charter by another name. The WKR distinction was forged to separate reasons that justify an *attitude* from those that merely incentivize it. A committee doesn't have attitudes; it has procedures. Calling these reasons "wrong kind" implies a metaphysical mismatch between moral facts and institutional decisions. I'm saying the mismatch is purely design-based. If the charter included moral character, your "wrong kind" reasons would suddenly become "right kind." That proves the issue is scope, not reason-type. This conflates authorization with justification.

  **Lin:** That contingency proves nothing. A charter can be flawed. My claim is that even if the charter *included* moral character, using external harm to deny tenure operates at the wrong level of evaluation. Tenure evaluates the *role-bearer*, not the *moral subject*. Conflating the two dissolves the professional boundary. You reduce the committee to a general moral court. It's excluded because it addresses the wrong object—the person rather than the professional function. This structural limit is independent of written rules.

  **Reyes:** "Wrong object" is rhetorical shielding. Without an independent account of institutional purpose, you're just stipulating which reasons you dislike. And you're ignoring the agency problem. Individual believers can hold beliefs for wrong kinds of reasons; collectives execute mandates, not attitudes. There is no "attitude" here to be justified incorrectly. If the collective decides moral history matters, that becomes a reason for the collective. To say otherwise imposes an individualistic metaphysics onto a collective agent lacking the architecture to sustain the WKR distinction.

  **Lin:** Collective agents *do* have teleological structure. The university isn't a blank slate; it aims at truth. If we import moral punishment, we distort that aim. It's not about psychology; it's about function. A reason is wrong-kind if it undermines the constitutive aim of the practice, regardless of the agent's psychology. You're treating the institution as a mere contract, but it's a practice with internal norms. Ignoring that turns the committee into a bureaucratic shell. It becomes a moral tribunal, not an academic one.

  **Reyes:** Then admit it: you're arguing from functional exclusion, not WKR. Say "this undermines our function," not "this is the wrong kind of reason." The WKR label smuggles in the idea that moral reasons are inherently unfit for institutional uptake, rather than functionally inefficient. By insisting on the metaphysical label, you protect the institution from moral scrutiny it might rightly face. If the function is truth, but truth requires moral integrity, your "wrong level" argument collapses. You use WKR to insulate the university from the world it claims to study.

  3. The Unresolved Crux
  The crux is whether institutional normativity is derived from functional teleology (Lin) or procedural mandate (Reyes). Lin assumes institutions have constitutive aims that generate reason-types independent of charter design, effectively treating the university as a moral agent with a specific telos. Reyes assumes institutional reasons are solely artifacts of authorized scope, denying collectives the attitude-structure required for WKR. This is substantive, not merely verbal: it turns on whether "collective agency" can sustain a distinction between reasons that fit a role and reasons that fit a person. Resolution requires a theory of institutional purpose that is robust enough to constrain mandates without becoming metaphysically opaque. Specifically, philosophers must determine if institutions possess "aims" distinct from the aggregated intentions of their members, and whether those aims can generate normative constraints akin to individual rationality. Without this, Lin's "wrong level" remains an intuition, and Reyes's "mandate" remains purely positivist. Ultimately, the debate hinges on whether normative constraints can exist prior to institutional authorization.
