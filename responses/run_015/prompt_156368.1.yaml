  **Note on the form:**
  A villanelle can hold this disagreement, but only because the form's repetition mimics the stubbornness of the inscription itself. The fixed refrains act as the "text" that refuses to change, while the shifting stanzas act as the "context" that alters how the ear hears them. If you need the argument to feel more open-ended, a **terza rima** (ABA BCB CDC...) would allow the rhymes to keep moving forward rather than circling back, which might suit a theory that privileges historical flow over fixed structure. But for a debate about whether words stay put or slide, the villanelle's tension between sameness and difference is the better vehicle.
