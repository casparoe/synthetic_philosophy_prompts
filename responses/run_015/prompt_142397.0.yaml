  ### Handout Content Snippet (for Principal A)

  **Your Information:**
  You know the batch is in **Group Low** $\{1, 2\}$ OR **Group High** $\{3, 4\}$.
  *   If you are in **Group Low**, your initial probability of Defect is **0.50**.
  *   If you are in **Group High**, your initial probability of Defect is **0.33**.

  **Task:**
  1.  Write your probability on the Ledger.
  2.  When you receive the Ledger, look at Bob's number.
  3.  Determine which Group Bob must be in to produce that number.
  4.  Calculate the probability of Defect given *your* Group AND *Bob's* Group.
  5.  Write the new number.

  *(Similar handout for Bob with Groups A $\{1, 3\}$ and B $\{2, 4\}$)*.
