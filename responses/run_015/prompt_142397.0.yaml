  Here is a complete design for the seminar activity, tailored to your constraints and learning objectives.

  # Activity Design: The Consensus Protocol

  ## 1. The Construction

  **Cover Story:**
  A batch of eight specialised microchips (labelled 1 to 8) has been produced. Exactly one chip is to be drawn at random for testing. The event of interest, $E$, is that the drawn chip is **Defective**.

  **Abstract Structure:**
  *   **State Space ($\Omega$):** $\{1, 2, 3, 4, 5, 6, 7, 8\}$.
  *   **Common Prior ($\pi$):** Non-uniform weights assigned to each state.
  *   **Event ($E$):** The set of defective chips $\{1, 2, 5, 6\}$.
  *   **Partitions:**
      *   **Alice ($P_A$):** $\{ \{1, 2, 3, 4\}, \{5, 6, 7, 8\} \}$. (Distinguishes 'Low' vs 'High' batch numbers).
      *   **Bob ($P_B$):** $\{ \{1, 2, 5, 6\}, \{3, 4, 7, 8\} \}$. (Distinguishes 'Even-odd pattern A' vs 'B').

  **The Prior and Probabilities (for Handouts):**
  To ensure invertibility and ease of calculation, we use specific weights. The total weight is 100.
  *   **Weights:** $w_1=10, w_2=10, w_3=5, w_4=5, w_5=20, w_6=20, w_7=15, w_8=15$.
  *   **Event $E$:** $\{1, 2, 5, 6\}$. Total weight in $E = 60$. **Prior $P(E) = 0.60$.**

  **Cell Posteriors (Pre-calculated for students):**
  *   **Alice's Cells:**
      *   $A_1 = \{1, 2, 3, 4\}$ (Weight 30, $E$-weight 20). **$P(E|A_1) = 20/30 = 0.67$**.
      *   $A_2 = \{5, 6, 7, 8\}$ (Weight 70, $E$-weight 40). **$P(E|A_2) = 40/70 = 0.57$**.
      *   *Invertibility Check:* $0.67 \neq 0.57$. Distinct.
  *   **Bob's Cells:**
      *   $B_1 = \{1, 2, 5, 6\}$ (Weight 60, $E$-weight 60). **$P(E|B_1) = 1.00$**.
      *   $B_2 = \{3, 4, 7, 8\}$ (Weight 40, $E$-weight 0). **$P(E|B_2) = 0.00$**.
      *   *Invertibility Check:* $1.00 \neq 0.00$. Distinct.

  **The Meet:**
  The "knowledge graph" connects states if they share a cell.
  *   1 connects to 2, 3, 4 (via $A_1$) and 5, 6 (via $B_1$).
  *   Through transitivity, all states $\{1, \dots, 8\}$ are connected.
  *   **The Meet is Trivial ($\Omega$).** Theoretically, if only the *original* partitions were common knowledge, they should converge to the Prior (0.60).
  *   **However,** because the announcements are invertible, the agents identify the *intersection* of their cells.
      *   If Alice has $A_1$ and Bob has $B_1$, intersection is $\{1, 2\}$.
      *   If Alice has $A_1$ and Bob has $B_2$, intersection is $\{3, 4\}$.
      *   etc.
  *   **Design Note:** In this specific numerical setup, the intersection posteriors *differ* from the Prior. This creates a divergence between the "Aumann Meet" (Prior) and the "Dynamic Convergence" (Intersection Posterior).
      *   *Correction for Pedagogical Clarity:* To satisfy your Auditor Conjecture (that they converge to the Meet-cell probability), I must adjust the weights so that the Intersection Posterior equals the Prior, OR we accept that the "effective" Meet becomes the Intersection once announcements are made.
      *   *Decision:* I will design the debrief to highlight that the **announcements refine the common knowledge**. The Auditor calculates the probability on the **identified intersection**. This is mathematically sound: the common knowledge *after* two rounds is the intersection cell. The Auditor's conjecture is **true** regarding the *final* common knowledge cell, but that cell is finer than the *initial* Meet.

  **Depth of Exchange:**
  *   **State 1:** Alice has $A_1$ (0.67). Bob has $B_1$ (1.00).
  *   **Round 1 (Alice):** Announces **0.67**. (Reveals $A_1$).
  *   **Round 2 (Bob):** Knows Alice has $A_1$. Bob has $B_1$. Intersection $\{1, 2\}$.
      *   Weights in $\{1, 2\}$: $10+10=20$. $E$-weights: $10+10=20$.
      *   Bob's Posterior: **1.00**.
      *   *Wait,* Bob's initial posterior was also 1.00. This yields no change.
      *   *Fix:* I need Bob's initial posterior to differ from the intersection posterior.
      *   *Revised Weights for Depth:*
          *   $w_1=10 (E), w_2=5 (E), w_3=5, w_4=5, w_5=10 (E), w_6=5 (E), w_7=5, w_8=5$.
          *   $E = \{1, 2, 5, 6\}$.
          *   $A_1=\{1..4\}$ (Wt 25, E-wt 15) $\to$ **0.60**.
          *   $A_2=\{5..8\}$ (Wt 25, E-wt 15) $\to$ **0.60**. (Collision! Not invertible).
      *   *Final Working Example:*
          *   States 1-4 only. (Simpler for 90 mins).
          *   $P_A = \{ \{1, 2\}, \{3, 4\} \}$. $P_B = \{ \{1, 3\}, \{2, 4\} \}$.
          *   Weights: $1=10(E), 2=10, 3=10(E), 4=20$.
          *   $E=\{1, 3\}$. Prior $P(E) = 20/50 = 0.4$.
          *   $A_1=\{1,2\} \to 10/20 = 0.5$.
          *   $A_2=\{3,4\} \to 10/30 = 0.33$. (Invertible).
          *   $B_1=\{1,3\} \to 20/20 = 1.0$.
          *   $B_2=\{2,4\} \to 0/30 = 0.0$. (Invertible).
          *   **Scenario State 2:**
              *   Alice has $A_1$ (0.5). Bob has $B_2$ (0.0).
              *   R1 (Alice): **0.5**. (Reveals $A_1$).
              *   R2 (Bob): Knows $A_1$. Has $B_2$. Intersect $\{2\}$. Prob **0.0**.
              *   R3 (Alice): Hears 0.0. Knows Bob has $B_2$ (only cell yielding 0). Intersect $\{2\}$. Prob **0.0**.
              *   R4 (Bob): Hears 0.0. Confirms **0.0**.
              *   **Total 4 announcements.** Convergence at 0.0.
              *   **Auditor:** Hears 0.5 ($A_1$) and 0.0 ($B_2$). Knows state $\in \{1,2\} \cap \{2,4\} = \{2\}$. Predicts 0.0.
              *   **Meet:** Graph 1-2 (A), 2-4 (B), 4-3 (A), 3-1 (B). All connected. Meet = $\Omega$. Prior = 0.4.
              *   **Discrepancy:** Agents converge to 0.0. Prior is 0.4.
              *   **Resolution:** The announcements created *new* common knowledge (the state is 2). The Auditor predicts the convergence point (0.0), not the initial Prior. I will frame the Auditor's task as predicting the **final converged number**, which she can deduce from the first two announcements.

  ## 2. The Protocol

  **Group Structure:** 6 groups of 3 students (Principal A, Principal B, Auditor).
  **Materials:** Shared "Ledger Sheet" per group. Private "Signal Cards".
  **Rule:** Absolute silence except for writing numbers. No eye contact regarding the numbers.

  **Steps:**
  1.  **Setup:** Facilitator distributes Signal Cards (e.g., "Alice: You are in $\{1, 2\}$"). Principals do not show cards. Auditor gets nothing.
  2.  **Round 1:** Alice writes her credence in $E$ on the Ledger. Passes to Bob.
  3.  **Round 2:** Bob writes his credence in $E$ (updating based on Alice's number) on the Ledger. Passes to Alice.
  4.  **Rounds 3-6:** Continue alternating. If the number repeats twice, stop.
  5.  **Auditor Task:** After Round 2, the Auditor writes on a separate slip: (a) Her own credence (must be the Prior, 0.4), and (b) Her prediction of the final convergence number.
  6.  **Cap:** Hard stop at 6 announcements.

  **Simultaneity Note:**
  You recalled correctly. Alternating announcements (Geanakoplos & Polemarchakis, 1982) guarantee finite convergence. Simultaneous announcements can cycle or fail to converge in finite time without additional assumptions. This protocol uses **alternating** announcements to ensure the theorem holds.

  ## 3. The Auditor's Role

  **Conjecture Check:**
  The Auditor hears $p_1$ (Alice) and $p_2$ (Bob).
  *   $p_1$ identifies Alice's cell $A_i$ (by invertibility).
  *   $p_2$ identifies Bob's cell $B_j$ (by invertibility, conditional on $A_i$).
  *   The Auditor knows the true state $\omega \in A_i \cap B_j$.
  *   The Principals will converge to $P(E | A_i \cap B_j)$.
  *   **Verdict:** The Auditor **can** compute the exact convergence number. She does not need to know the state, only the intersection cell.
  *   **Task Design:** The Auditor's score depends on predicting the **final number** the Principals write. This demonstrates that private evidence, once fully signalled via posteriors, puts an eavesdropper in the same epistemic position as the agents.

  ## 4. A Second Round (Removing Common Knowledge)

  **Goal:** Show that without common knowledge of the *partitions*, agreement fails.
  **Modification:**
  *   Alice receives her partition $P_A$ explicitly.
  *   Bob receives his partition $P_B$ explicitly.
  *   **Crucial Change:** Alice is told: "Bob has a partition, but you do not know which one." Bob is told: "Alice has a partition, but you do not know which one."
  *   **Effect:** When Alice announces 0.5, Bob cannot deduce she holds $\{1, 2\}$. She might hold a cell from a different partition that also yields 0.5.
  *   **Outcome:** Bob cannot update his partition. He announces his initial prior conditional on his cell again. They stall (0.5, 0.0, 0.5, 0.0...).
  *   **Lesson:** Disagreement persists not because of stubbornness, but because the *structure of knowledge* is not common knowledge.

  ## 5. Scoring, Timing, and Materials

  **Scoring (Proper Scoring Rule):**
  Use the **Brier Score** (simplified for points).
  *   Formula: $100 \times (1 - (Prediction - Outcome)^2)$.
  *   Outcome: 1 if State $\in E$, 0 if State $\notin E$.
  *   Principals scored on their **final** announced number.
  *   Auditor scored on her **prediction** of that number.
  *   *Incentive:* Highest total points in the class wins a trivial prize (e.g., choice of seminar topic next week).

  **Timing (90 Minutes):**
  *   **00-10:** Introduction & Handout distribution. Explain rules (silence, alternating).
  *   **10-35:** **Round 1.** (Allow time for confusion/calculation). Collect Ledger Sheets.
  *   **35-45:** **Auditor Reveal.** Ask Auditors to state their predictions. Reveal true states. Compare convergence vs. prediction.
  *   **45-60:** **Round 2.** (No Common Knowledge of Partitions). Distribute new instructions. Run protocol.
  *   **60-90:** **Debrief.** Whiteboard discussion.

  **Materials List:**
  1.  **Public Board:** State space, Prior, Event $E$ written up.
  2.  **Principal Handout:** Their Partition, Lookup Table (Cell $\to$ Probability).
  3.  **Auditor Handout:** Both Partitions, Prior, Calculation Sheet.
  4.  **Ledger Sheets:** Pre-printed rows for "Turn 1, Turn 2...".
  5.  **Signal Envelopes:** Pre-assigned states for each group (ensure a mix of States 1, 2, 3, 4 across the 6 groups).

  ## 6. Debrief, Failure Modes, and Limits

  **Mapping to Theorem:**
  *   **Round 1 Success:** Demonstrates that with Common Prior + Common Knowledge of Partitions + Truthful Announcement, posteriors converge.
  *   **Auditor Success:** Demonstrates that the *content* of the evidence is pooled via the numbers; the intersection of cells becomes common knowledge.
  *   **Round 2 Failure:** Isolates the **Common Knowledge of Information Structure** assumption. Without it, the number 0.5 is ambiguous.
  *   **Student Takeaway:** "To persist in disagreement, agents must either have different priors or lack common knowledge of what the other knows (the partition structure)."

  **Predictable Failure Modes:**
  1.  **Arithmetic Errors:** Students miscalculate the conditional probability.
      *   *Fix:* The "Lookup Table" on the Principal Handout gives the probability for their specific cell. They only need to calculate the *intersection* probability in Round 2. Provide a hint: "If you know the other's cell, intersect the sets and sum the weights."
  2.  **Communication Breach:** Students glance at each other's sheets.
      *   *Fix:* Enforce "Exam Conditions". Collect sheets if breached.
  3.  **Auditor Interference:** Auditor tries to help.
      *   *Fix:* Auditor must sit facing away from Principals during the exchange.
  4.  **Immediate Convergence:** If assigned State 1 or 3, convergence is fast.
      *   *Fix:* Ensure at least 2 groups are assigned State 2 or 4 (the "disagreement" states where $A$ and $B$ cells cross).

  **Limits of the Activity:**
  *   **Finite vs. Infinite:** This shows finite convergence. It does not show cases where common knowledge is never reached (infinite partitions).
  *   **Honesty:** The theorem assumes truthful reporting. The activity enforces this by rule. In reality, strategic lying could prevent agreement.
  *   **The "Meet":** As noted in the construction, the agents converge to the *intersection* posterior, which refines the *initial Meet*. The debrief must clarify that the "Common Knowledge Event" is dynamic; it starts as the Meet, but announcements shrink it to the Intersection.

  **British English Note:**
  Ensure all handouts use "Programme", "Centre", "Modelling", "Prioritise". Use "£" or "Points" for scoring, not "$".

