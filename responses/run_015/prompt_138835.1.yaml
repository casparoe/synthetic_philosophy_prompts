answer: |-
  **ASA Adjudication on Noumenon Apps Ltd**

  **Case Ref:** A19-284501
  **Date:** 14 October 2023
  **Sector:** Apps and Software
  **Complainant:** Linguistech PLC

  **Ads**
  The website for Noumenon Apps Ltd featured the following claims regarding their subscription service, 'InnerLex':
  1. "A vocabulary for the bits of your inner life nobody else can check."
  2. "Generate words with meanings only you can know."

  **Issue**
  Linguistech PLC complained that the claims were misleading and could not be substantiated. They argued that language, by definition, requires shared understanding and that a word with a purely private meaning was impossible to define or use consistently.

  **Response**
  Noumenon Apps Ltd stated that the claims accurately described the function of the app. They argued that while external verification of internal states was impossible, the sensations themselves were real. To demonstrate this, they submitted a diary log detailing the recurrences of a specific sensation labelled 'quilp' over six months, noting time, weather, and heart rate.

  They further submitted a sealed envelope containing the operational definition of 'quilp', stating that the physical presence of the definition proved its existence. They noted that the usage panel for the beta test consisted of the founder alone, as no other user could access the sensation.

  Regarding the commercial viability, the company's legal representative stated: "The value proposition relies on the impossibility of external verification. We are not selling communication. We are selling the certainty of isolation." They argued that consumers would understand the claims metaphorically.

  **Assessment**
  The ASA considered whether the claims were misleading and could be substantiated.

  Regarding Claim 1 ("...nobody else can check"), the ASA noted that consumers would interpret this as a statement regarding privacy and the subjective nature of internal experience. We accepted that third parties cannot directly access an individual's internal sensations. Therefore, the claim was factually accurate insofar as it described the limits of external observation. This claim was not upheld.

  Regarding Claim 2 ("...meanings only you can know"), the ASA considered whether a word could possess a meaning that was inherently inaccessible to others. The advertiser argued that the sealed envelope contained the definition. We accepted that the envelope contained paper with markings on it. However, the advertiser confirmed that no third party could interpret those markings without experiencing the sensation themselves. The ASA noted that if the definition cannot be transmitted, it cannot function as a definition. The advertiser pointed out that the box obviously did have something in it. The ASA agreed that the box contained paper, but noted that was rather the problem.

  The ASA asked the advertiser to demonstrate that the word 'quilp' was applied consistently across the diary entries. In response, the advertiser stated that entry 45 was 'quilp' because it felt like 'quilp', distinct from entry 46 which felt like 'splin'. When asked how the distinction was verified, the advertiser replied that only the user could know. The ASA considered that this was not evidence of consistency, but merely a restatement of the claim. Without a rule for correct usage that exists independently of the user's immediate impression, there was no way to distinguish between using the word correctly and merely thinking one had.

  While we accepted the sincerity of the advertiser's submission, the claim implied a linguistic function that could not exist. To promise a meaning that only one person can know is to promise a lock without a key. The ASA concluded that the claim was misleading.

  **Action**
  Claim 1: Not upheld.
  Claim 2: Upheld.

  The ads must not appear again in their current form. We told Noumenon Apps Ltd not to imply that words can have meanings that are inherently private or unverifiable.

  **ASA Secretariat**
