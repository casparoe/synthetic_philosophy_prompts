prompt: |-
  Bit of a weird ask, and sorry in advance for how over-specified this is — I'm writing a novel (contemporary, Bristol, nobody in it is an academic) and there's a document that appears on the page in chapter seven which I've realised I can't write myself, because I'd get the philosophy wrong and someone would spot it in a review.

  The setup: my protagonist has sunk her savings into a startup selling a 'private language' — app, soft-focus branding, the pitch being that you finally get a vocabulary for the bits of your inner life nobody else can check. One word for a particular flicker behind the eyes. The founder's own word is 'quilp' in my draft (change it, I don't mind) and he's on record saying it means something no one else could ever learn, that's the whole selling point. A rival company complains to the ASA. I want the adjudication.

  So: a fake ASA ruling in roughly the real format — case reference, sector, the two or three claims complained about, the advertiser's response with its evidence, the assessment, then Upheld or Not upheld and what mustn't appear again in its current form. 700-900 words, deadpan all the way through, and nobody in the document ever says 'Wittgenstein' or 'private language argument' or 'philosophy'.

  The jokes have to come from the actual content, not from puns. What I want a reader who knows the argument to enjoy is the gap between 'nobody else is in your head' (true, boring) and 'my word for this has a meaning that only I could have' (the bit that's supposed to be in trouble) — so ideally the ASA upholds one claim and not the other, and its reasons for dismissing the first are exactly the reasons it's uninteresting. The advertiser's submission should be the strongest available version, not a strawman: a diary of the sensation's recurrences, a sealed sample, a usage panel of one, and when the ASA asks them to confirm the word is being applied consistently they reply by applying it again, and the ASA has to note that this isn't evidence. If you can find a home for it, there's a line where the company points out that the box obviously does have something in it and the ASA agrees and says yes, that's rather the problem.

  Don't let anyone wink. And it can't be a total rout — my character is reading this thing and half agrees with the company, so leave a line or two that stings, ideally in the mouth of the company's lawyer saying something accidentally deep in flat corporate prose. British English, real ASA-ish register (substantiation, 'consumers would interpret the claim to mean', that sort of thing), and let the jargon do the comic work. Its my favourite scene in the book so far so no pressure.
