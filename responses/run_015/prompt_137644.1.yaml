      *   **Addressing "Seven":** Math is different. It's anchored by *rules*, not physical objects. It's true by definition within the system (Analytic vs. Synthetic).
      *   **Addressing the Friend's "Boundary" Objection:** It's not a dodge. It's about *where* the meaning lives. If you draw the line at the skin, the world anchors you. If you draw it at the retina, you're trapped. The friend is right that the *line* is arbitrary, but wrong that it makes anchoring impossible. It just means anchoring is a relation, not a property.
      *   **Recommendation:** Don't give up (1) entirely, but refine it. It's not about "proof from inside," it's about "causal connection from outside." Accept the "unknowability" cost. It's the price of realism.

