          *   *Cost:* You can't prove it from the inside (Brain in a Vat). You must accept that meaning is partly outside your head.
          *   *Machine vs. Human:* The machine has a short causal chain (sensor -> label). The human has a long evolutionary/social chain. The machine's "FRAGILE" is anchored to *weight/impact*, not *fragility* conceptually.
