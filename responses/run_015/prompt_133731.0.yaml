answer: |-
  This is a classic turf war: the Searleans (rules, constitutive, institutional facts) vs. the Austinites (context, force, psychological states). Your colleagues are running a Searlean engine on Austin's chassis. They are winning the corridor argument because the chess analogy is seductive, tidy, and fits the bureaucratic mindset of university administration perfectly.

  But you are right to be suspicious. The chess analogy doesn't just *illustrate* their theory; it *rigs* it. It excludes the very phenomena (sincerity, moral weight, interpersonal repair) that make an apology an apology rather than a press release.

  Here is the audit you asked for, broken down by your sticking points, the test case, and the alternative frameworks you can take into the lecture hall.

  ### 1. The Audit: Mapping the Chess Analogy

  Here is how your colleagues are mapping the terrain, and where the isomorphism breaks.

  | Chess Domain | Speech Act Domain (Colleagues' View) | Where the Mapping Breaks |
  | :--- | :--- | :--- |
  | **The Board** | The Institutional Context (The College) | Chess is a closed system; social context is open and porous. You can't "step off" the board in a moral community. |
  | **The Rulebook** | Constitutive Rules (Grammar + Protocol) | Rules of chess are explicit/codified. Rules of apology are implicit/normative. |
  | **The Players** | Speaker (VC) & Hearer (Complainants) | Chess players share a goal (play the game). Apology participants often have opposing goals (closure vs. justice). |
  | **The Move** | The Utterance ("We apologize") | Chess moves are status-changers. Apologies are *also* psychological expressions. |
  | **Legality** | Felicity Conditions (Standing, Form) | An illegal move is void. An insincere apology is *hollow*, but colleagues treat it as valid. |
  | **The Umpire** | Institutional Authority / Uptake | Chess has adjudication. Apologies are adjudicated by the *victim's* acceptance, not the institution's authority. |
  | **Win Condition** | Resolution / Closure | In chess, someone wins. In apology, the goal is *restoration*, which may not happen even if the "move" is legal. |

  ### 2. Addressing Your Three Sticking Points

  **Point One: Circularity (Source contains Target)**
  You have hit the nail on the head. Chess is constituted *by* speech acts ("I resign," "Check," "I claim a draw"). To use chess to explain speech acts is to use a specific, highly conventionalized subset of speech acts to explain the whole category.
  *   **The Trap:** It privileges *verdictives* and *exercitives* (declaring, ordering, ruling) over *expressives* (apologizing, thanking, condoling).
  *   **The Counter:** Tell your colleagues: "Chess explains how we *change institutional status*, not how we *express psychological states*." An apology is not a castling move; it is a confession. If you analyze a confession using chess rules, you will conclude a forced confession is valid because the words were spoken. That is a legalistic truth, but a moral falsehood.

  **Point Two: Misfire vs. Abuse (The Void/Hollow Split)**
  Your colleagues are using the chess analogy to collapse Austin's distinction.
  *   **Chess:** Illegal move = Void (Misfire). Legal move played cynically = Valid move (Abuse).
  *   **Colleagues' Conclusion:** Since the VC had standing and used the words, it was a legal move. Sincerity is irrelevant to validity.
  *   **The Counter:** Austin distinguishes between *conventional* acts (naming a ship) and *moral* acts (promising, apologizing). In naming a ship, sincerity is irrelevant. In apologizing, the expression of regret is *part of the illocutionary point*.
  *   **The Winning Move:** Argue that in *expressive* speech acts, sincerity conditions are not just ethical add-ons (abuses); they are **essential felicity conditions**. If I say "I apologize" while laughing, Austin would say the act is *not achieved*, not just abused. The chess analogy fails because in chess, the *intent to win* is not required for a move to be a move. In apology, the *intent to express regret* is required for the utterance to be an apology. Without it, it is merely a *statement of apology*.

  **Point Three: Smuggled Assumptions**
  The analogy smuggles in a bureaucratic worldview that favors the institution over the individual.
  *   **Codification:** Assumes rules are known and fixed. (Reality: Norms of apology are contested).
  *   **Umpire:** Assumes the institution adjudicates its own moves. (Reality: The victim adjudicates the apology).
  *   **Shared Goal:** Assumes everyone wants the "game" to proceed. (Reality: The victim may want restitution, not just a move on the board).
  *   **Closed Field:** Assumes you can finish the interaction. (Reality: Moral debts linger).

  ### 3. The Test Case: The 1892 Apology by Actor

  *Scenario: College apologizes for 1892 actions. No one alive is responsible/wronged. Descendants present. Words read by hired actor.*

  **On the Colleagues' Picture (Chess Model):**
  *   **Verdict:** **Valid Apology.**
  *   **Reasoning:** The College is the Player (continuous legal entity). The VC is the Captain (authorized standing). The Actor is the Mouthpiece (like a proxy in correspondence chess). The Move is well-formed. Uptake is possible.
  *   **Sincerity:** Irrelevant. The "College" cannot feel regret, only the individuals can. Since it's an institutional move, individual feeling is a category error.
  *   **Comparison:** It is functionally identical to the VC reading it, provided the VC authorized it.

  **On Your Picture (Austin/Moral Model):**
  *   **Verdict:** **Misfire (or at best, Hollow).**
  *   **Reasoning:** An apology requires an agent capable of regret to express that regret. A "College" is a fiction. The VC is a proxy. The Actor is a puppet.
  *   **The Break:** In chess, a proxy move counts because the *state of the board* is what matters. In apology, the *state of the relationship* is what matters. You cannot repair a moral relationship with a scripted performance by a hired hand.
  *   **Comparison:** The VC reading it is *better* than the actor, because the VC at least embodies the current leadership's commitment. The actor reduces the apology to theatre. On the chess model, there is no difference. On the moral model, the actor makes it a farce.

  **Why this breaks their analogy:**
  If the chess analogy holds, the actor scenario is unproblematic. But intuitively (and morally), it feels like a sham. If the analogy cannot distinguish between a VC apologizing and a hired actor reading a script, the analogy is too blunt to capture the concept of "apology." It captures "notification of regret," which is not the same thing.

  ### 4. How to Win the Corridor Argument (and Teach It)

  Your colleagues are treating speech acts as **Status Functions** (Searle). You need to pivot to **Moral Repair** (Austin/Walker).

  **The Argument:**
  "Your chess model works perfectly for *exercitives* (declaring war, naming buildings, firing staff). It fails for *expressives* (apologizing, promising, thanking). In chess, the move creates the reality (castling changes the board). In apology, the move *reports* a reality (regret) that must pre-exist the utterance to be felicitous. If you treat an apology as a chess move, you turn it into a bureaucratic transaction. That explains why the College thinks it has 'done' apology when the statement is issued, and why the victims feel nothing has changed."

  **The Alternative Analogies for Class:**

  1.  **The Gift (Mauss/Derrida):**
      *   An apology is a gift of moral repair.
      *   *Mapping:* A gift requires a giver, a receiver, and the *spirit* of the gift. A gift given by a hired hand, or given reluctantly, is often rejected or insults the receiver.
      *   *Advantage:* Captures the interpersonal risk and the need for uptake/acceptance better than chess.

  2.  **The Script/Rehearsal (Butler/Cavell):**
      *   We speak using inherited scripts (like actors), but we must "own" the lines.
      *   *Mapping:* The VC has the script ("We apologize"). But if they do not inhabit the role, it is "mere citation."
      *   *Advantage:* Explains how institutions *can* apologize (by inhabiting the role) but why the Actor Test Case fails (the actor is *only* citing, not inhabiting).

  3.  **The Conversational Scoreboard (Stalnaker/Lewis):**
      *   Utterances update the "common ground" or "score" of the conversation.
      *   *Mapping:* An apology attempts to update the moral score (debt reduced).
      *   *Advantage:* Shows that if the other party rejects the update (due to insincerity), the score *does not change*. In chess, a legal move changes the board regardless of how the opponent feels. In conversation, uptake is constitutive.

  ### 5. Lecture Strategy for the Undergraduates

  Don't start with the chess analogy. It's too seductive; they will buy it and never let go.

  1.  **Start with the Promise:** Ask a student to promise something they have no intention of doing. Did they promise? (Yes). Was it a good promise? (No). This establishes Austin's Abuse/Misfire split.
  2.  **Introduce the Apology:** Ask if the same applies. If I say "I'm sorry" while laughing, have I apologized? Most will say "No, you mocked me."
  3.  **Deploy the Chess Analogy (as the Villain):** "Some theorists say yes, you did apologize, just like moving a rook diagonally is a move, even if it's illegal... wait, no, even like moving a rook legally but trying to lose."
  4.  **Break it:** Use the **Actor Test Case**. "If the VC hires an actor to read the apology, is it the same?"
  5.  **Conclusion:** Speech acts aren't just moves on a board; they are actions in a moral community. Rules matter, but so does the "spirit of the rule."

  **The One-Liner for the Corridor:**
  "You're analyzing a moral repair mechanism using a traffic code. Of course you conclude the apology is valid; you've defined 'validity' as 'procedural compliance' rather than 'moral resolution'."

  This shifts the burden back to them: they have to defend why *procedural compliance* is the only metric that matters for an apology. In a university setting, that is a hard position to hold publicly.
