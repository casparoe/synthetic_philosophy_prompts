      *   *Q3: Beef vs. Chicken Metrics.* (Ecology + Decision Theory). Tractable via meta-analysis of existing LCA (Life Cycle Assessment) and land-use data.
      *   *Missing Q4: Sentience Probability/Weighting across Taxa.* (Philosophy + Neuroscience synthesis). Crucial for comparing a cow to a field mouse to a soil nematode.
      *   *Missing Q5: The "Lock-in" Temporal Horizon.* (Decision Theory). How far into the future do we discount habitat change?

  4.  **Determine Dependencies (The "Cascade"):**
      *   You cannot calculate "suffering per calorie" (Q2/Q3) without knowing which entities count (Q1) and how much they count relative to each other (Q4).
      *   You cannot compare Beef vs. Chicken (Q3) without knowing the ecological impact of their respective land uses (Pasture vs. Monoculture) on wild populations (Q2).
      *   Policy recommendations depend on the robustness of the comparison (Q3) under uncertainty (Decision Theory).

  5.  **Drafting the Prioritization (Iterative Process):**

      *   *Attempt 1:* Start with Moral Unit. Then Ecological Impact. Then Comparison.
          *   *Critique:* Too generic. Need to be specific to the "land-use substitution" frame. The "Moral Unit" question might be a rabbit hole that stalls the project. Maybe frame it as "Sentience Weighting" instead, which is more actionable for the philosophers.
      *   *Attempt 2:* Focus on the Decision Theorist. Uncertainty is the biggest blocker.
          *   *Critique:* True, but you need inputs for the uncertainty model.
      *   *Attempt 3 (Selected Approach):*
          1.  **Phase 1: Value Framework & Sentience Weighting.** (Philosophers + Decision Theorist). Define the currency. Is it hedonic tons? Individual lives? This dictates what data the ecologist looks for.
          2.  **Phase 2: Land-Use to Population Density Mapping.** (Ecologist + Philosophers). Translate hectares of pasture/cropland into "units of wild sentience" based on existing literature. Avoid specific invertebrate counts if too uncertain; focus on vertebrates + high-probability invertebrates.
          3.  **Phase 3: Decision Model under Deep Uncertainty.** (Decision Theorist + All). Combine Phase 1 & 2. Run scenarios. Determine if Beef or Chicken is robustly better across different moral assumptions.

  6.  **Refining the Criteria & Deprioritization:**
      *   *Deprioritize:* Precise invertebrate suffering counts in soil systems. Why? Empirical uncertainty is too high for a non-fieldwork team, and normative weight is contested. If the vertebrate signal is strong enough, invertebrate noise might not change the recommendation.
      *   *Deprioritize:* Species-level stability vs. Individual experience debate *as a metaphysical quest*. Instead, treat it as a parameter in the decision model (sensitivity analysis).
      *   *Tractability:* High for conceptual framing, Medium for ecological synthesis, Low for precise suffering quantification.
