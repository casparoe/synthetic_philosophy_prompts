      *   **Key Unresolved Questions:**
          1.  Moral unit (individual vs. species vs. ecosystem biomass).
          2.  Counterfactual wild-animal suffering (prevented by ag land-use vs. caused by crop cultivation/invertebrates).
          3.  Beef vs. Chicken metrics (direct deaths/calorie vs. trophic efficiency vs. habitat lock-in).
      *   **Team Composition:** 2 Moral Philosophers, 1 Ecologist, 1 Decision Theorist.
      *   **Constraints:** 3 years funding, *no original empirical fieldwork* (must rely on existing data/models/synthesis).
      *   **Task:** Create a dependency-aware prioritization (order of operations).
      *   **Criteria:** Tractability, Downstream Dependence, Relevance to Actionable Recommendations.
      *   **Requirement:** Identify intermediate results (18-month mark) that would trigger a revision.
      *   **Constraint:** No bibliography/citations.

  2.  **Analyze the Team & Constraints:**
      *   *Strengths:* Normative theory (philosophers), modeling/uncertainty (decision theorist), systemic biological understanding (ecologist).
      *   *Weaknesses:* No new data collection. They must synthesize existing ecological data to feed into philosophical/decision models.
      *   *Implication:* Questions requiring precise population counts of wild invertebrates are likely intractable or too uncertain. Questions requiring conceptual clarity on value theory are highly tractable for the philosophers. Questions linking land use to sentience density are tractable for the ecologist/decision theorist combo.

  3.  **Evaluate the Open Questions (and identify missing ones):**
      *   *Q1: Moral Unit.* (Philosophy heavy). Upstream. If we don't know *what* counts, we can't count it.
