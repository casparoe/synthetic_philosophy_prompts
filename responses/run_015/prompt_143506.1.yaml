answer: |-
  ### Research Agenda: The Land-Use Substitution Cascade

  **Executive Summary**
  Given the team's composition (two moral philosophers, one ecologist, one decision theorist) and the constraint against original fieldwork, the research strategy must prioritize conceptual clarity and meta-analytic synthesis over empirical precision. The core bottleneck is not a lack of ecological data, but a lack of agreement on how to translate ecological data into moral value under deep uncertainty. Therefore, the agenda proceeds from **defining the moral currency** (Philosophy/Decision Theory) to **mapping land-use to that currency** (Ecology/Philosophy) to **optimizing choices under uncertainty** (Decision Theory/All).

  The following prioritization is ordered by logical dependency: you cannot calculate the "right" diet until you define what counts as value, and you cannot model the decision until you have parameters for the ecological impact of land types.

  ---

  ### Phase 1: Normative Architecture and Sentience Weighting (Months 1–12)
  **Lead:** Moral Philosophers (with Decision Theorist support)
  **Goal:** Define the "moral unit" not as a settled metaphysical truth, but as a set of competing parameters for sensitivity analysis.

  **Tasks:**
  1.  **Operationalize the "Moral Unit":** Rather than attempting to resolve the debate between individual sentient experience, species stability, and ecosystem-level biomass, the philosophers will formalize these as distinct value functions. The output will be a matrix of "Moral Frameworks" (e.g., Utilitarian-Individualist, Ecocentric-Holist, Suffering-Focused).
  2.  **Sentience Probability Weighting:** Develop a protocol for weighting different taxa. Since no fieldwork is possible, the team must rely on existing neurobiological and behavioral literature to assign probability distributions to the sentience of key groups affected by land-use change (e.g., large mammals, small rodents, soil invertebrates).
  3.  **Temporal Discounting Protocol:** The decision theorist will work with the philosophers to determine how to value "habitat lock-in." Does a hectare of pasture locked for 50 years weigh differently than a hectare of cropland rotated every 5 years?

  **Tractability:** High. This relies on existing literature and logical modeling, fitting the philosophers' and decision theorist's strengths.
  **Downstream Dependence:** Critical. Phase 2 cannot begin until the ecologist knows *which* populations to synthesize data for (e.g., if the moral unit is "ecosystem biomass," the ecologist looks for biomass data; if "individual suffering," they look for population density and mortality rates).

  ### Phase 2: Ecological Synthesis and Land-Use Translation (Months 12–24)
  **Lead:** Ecologist (with Philosophers advising on relevance)
  **Goal:** Translate existing Life Cycle Assessment (LCA) and ecological land-use data into "Moral Units" defined in Phase 1.

  **Tasks:**
  1.  **Meta-Analysis of Wild Population Densities:** The ecologist will synthesize existing studies comparing wild vertebrate and invertebrate densities across three land types: ruminant pasture, poultry-feed monoculture, and rewilded/natural states.
  2.  **The Invertebrate Boundary Condition:** Instead of attempting to resolve the precise suffering of soil invertebrates (which is empirically intractable without fieldwork), the ecologist will establish upper and lower bounds for invertebrate displacement. This treats invertebrate suffering as a variable of uncertainty rather than a fixed cost.
  3.  **Habitat Lock-in Modeling:** Quantify the reversibility of land use. How long does it take for pasture to return to wild carrying capacity versus cropland? This provides the temporal inputs for the Decision Theorist.

  **Tractability:** Medium. Dependent on the quality of existing public data. The "no fieldwork" constraint makes precise invertebrate counting impossible, necessitating the bounding approach.
  **Downstream Dependence:** High. This provides the empirical inputs for the final decision model.

  ### Phase 3: Decision Modeling and Robustness Analysis (Months 24–36)
  **Lead:** Decision Theorist (with full team integration)
  **Goal:** Determine dietary recommendations that are "robust" across the moral and ecological uncertainties identified in Phases 1 and 2.

  **Tasks:**
  1.  **Multi-Criteria Decision Analysis (MCDA):** Run simulations combining the Moral Frameworks (Phase 1) with the Ecological Translation parameters (Phase 2).
  2.  **Value of Information Analysis:** Calculate which uncertainties matter most. Does the recommendation flip if we change the sentience weight of a mouse? Does it flip if we change the carbon cost of feed transport?
  3.  **Policy vs. Individual Output:** Generate two distinct outputs: one for individual dietary choice (e.g., "Beef vs. Chicken") and one for agricultural policy (e.g., "Pasture subsidies vs. Crop efficiency").

  **Tractability:** High. This is the core competency of the decision theorist.
  **Relevance:** This is the only phase that produces actionable recommendations.

  ---

  ### Deprioritized Areas
  To ensure completion within three years, the following questions must be explicitly deprioritized or scoped out:

  1.  **Resolving the Metaphysics of the Moral Unit:**
      *   *Reason:* Attempting to prove whether "species stability" is objectively better than "individual experience" is philosophically intractable within three years and unnecessary for policy.
      *   *Strategy:* Treat competing moral units as parallel scenarios. If Beef is better under Individualism and Chicken is better under Holism, the recommendation is "moral uncertainty is too high," which is itself a valuable finding.
  2.  **Precise Quantification of Soil Invertebrate Suffering:**
      *   *Reason:* Without fieldwork, any specific number assigned to nematode or insect suffering per hectare will be arbitrary guesswork, introducing false precision.
      *   *Strategy:* Use the "Boundary Condition" approach in Phase 2. If the recommendation holds even when invertebrate suffering is weighted at the maximum plausible value, precise measurement is unnecessary.
  3.  **Direct Slaughter vs. Wild Suffering Trade-off Ratios:**
      *   *Reason:* Calculating the exact exchange rate between one farmed cow death and X wild mouse deaths is prone to error.
      *   *Strategy:* Focus on *orders of magnitude*. If the wild death toll differs by a factor of 100 between land types, precise trade-off ratios matter less than if they differ by a factor of 1.1.

  ---

  ### The 18-Month Pivot Condition
  The ranking above assumes that ecological data is sufficient to distinguish land-use types. However, this assumption must be tested.

  **Trigger for Revision:**
  At the 18-month mark (midway through Phase 2), the Ecologist must present a preliminary confidence interval on the difference in **sentience-weighted biomass** between ruminant pasture and poultry-feed cropland.

  *   **If the confidence intervals overlap significantly** (i.e., existing literature cannot distinguish the wild-animal impact of pasture vs. cropland):
      *   **Action:** Halt Phase 2 detailed synthesis. Pivot the team to focus 80% of remaining resources on **Phase 3 (Decision Theory)** focused on "Precautionary Principles."
      *   **Rationale:** If the ecological signal is too noisy to distinguish beef from chicken via wild impacts, the research value shifts from "calculating the best diet" to "defining the ethics of acting under ecological ignorance." The philosophers and decision theorist would dominate the remaining timeline to formulate a policy of risk-aversion rather than optimization.

  *   **If the data shows a clear, large-magnitude divergence:**
      *   **Action:** Proceed as planned. The clear ecological signal allows the philosophers to focus on whether that signal *matters* morally, rather than whether it exists.

  ### Defense of Ordering

  1.  **Upstream Dependence:** You cannot model the impact of land use (Phase 2) without defining what impact is morally relevant (Phase 1). An ecologist counting "biomass" is wasting time if the moral framework values "individual conscious moments." Therefore, Philosophy must lead.
  2.  **Tractability:** The team has no capacity for new data. Phase 1 is purely theoretical and modeling-based, making it the safest starting point to ensure early deliverables. Phase 2 relies on synthesizing others' data, which is risky; placing it second allows the team to abandon the project if the data is found to be nonexistent (triggering the Pivot Condition).
  3.  **Relevance to Action:** Phase 3 is the only phase that yields a "verdict." By reserving it for the final year, it incorporates all learnings from the first two phases. However, by using Decision Theory throughout (via the sentience weighting and pivot condition), we ensure that even if the final verdict is "we don't know," the *reasoning* for that uncertainty is actionable for policymakers (i.e., fund research to reduce specific ecological uncertainties).

  This agenda maximizes the specific skill mix of the team while acknowledging the severe constraint on empirical data, turning a potential weakness (no fieldwork) into a strength (focus on robust decision-making under uncertainty).
