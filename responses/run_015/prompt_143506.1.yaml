      *Refining the "Invertebrate" issue:* The prompt specifically mentions invertebrate displacement. I should address why this might be deprioritized or handled via uncertainty bounds rather than precise measurement. Given "no fieldwork," precise invertebrate suffering is a dead end. I will recommend bounding it rather than solving it.

      *Refining the "Moral Unit":* Don't try to solve "Individual vs Species." Instead, model both as scenarios. This fits the Decision Theorist's skill set (robustness to moral uncertainty).

