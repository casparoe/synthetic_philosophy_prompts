  to: legacy archives committee
  from: [your name]
  date: [current date]
  subject: sidgwick papers / vote for friday

  hey everyone,

  knowing we're split on the sidgwick stash and voting this friday, i wanted to throw down a concrete proposal before we meet. i've been thinking about the two main worries: that displaying this makes the uni look like we endorse ESP, versus hiding it makes us look like we're afraid of our own history.

  here's the thing about sidgwick — even if you only know him from the ethics book — he wasn't pushing psychical research because he believed in ghosts. he was pushing it because he believed in *method*. his position was basically that there's a dual pressure on any university: credulity harms knowledge (believing stuff without proof makes us look silly), but suppression harms inquiry (hiding stuff because it's awkward stops us from understanding how truth gets pursued).

  if we seal the papers for 30 years, we solve the credulity problem but create the suppression one. it looks like we're ashamed of the rigor he applied, even if the subject matter feels weird now. but if we just dump the files online with no context, we risk the credulity problem — people might think we're validating the claims rather than preserving the history of the investigation.

  so i'm recommending we **digitize with an interpretive panel**.

  not just a warning disclaimer (which sounds defensive), but a panel that explicitly frames this as a history of methodological rigor applied to anomalous claims. it shows we honor his ethic of inquiry without endorsing the conclusions. it treats the papers as data about how knowledge was sought, not proof of the supernatural.

  **proposed timeline:**
  *   **digitization:** complete by end of spring term.
  *   **launch:** start of next academic year.
  *   **review:** the interpretive panel text gets reviewed every 5 years (first review 2030) to make sure the framing still lands right as context shifts.

  this way we don't bury the work (violating the duty to truth) but we also don't present it raw (risking the appearance of endorsement). feels like the only way to actually respect sidgwick's own standards.

  let's talk more on friday.

  best,
  [your name]
