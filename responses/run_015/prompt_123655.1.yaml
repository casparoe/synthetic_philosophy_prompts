  Subject: quick draft for summer grant proposal / genocide stuff

  hey [Advisor Name],

  hope youre doing well. im working on the pitch for the 3-month summer research grant and wanted to run the core idea by you before i flesh out the full form. i know its short timeline so im trying to keep the scope tight.

  here's the half-baked version: everyone fights over whether calling something genocide is just politics or strict legal definition. but i think theres a hidden conceptual layer people miss. lemkin's original framework apparently went beyond physical killing to include destroying a groups culture, language, and institutions, but the legal definition dropped that part. 

  so im wondering if the reason some mass atrocities never get named genocide isnt only state power or legal technicalities, but something about whether the victim group still has the institutional capacity to narrate its own history. like, is there a kind of narrative threshold — if a group cant produce a coherent historical account because its archives, record-keeping, or linguistic institutions were destroyed, then the atrocity literally cant be named in the legal-political sphere, regardless of intent?

  **Precise Question:**
  is there a distinct narrative-institutional condition for recognizing genocide, seperate from both the legal criteria and pure political suppression?

  **Why existing answers leave it open:**
  legal scholars focus on intent and scale, political-theory people focus on state interests, and neither asks whether the victims own narrative capacity is a hidden prerequisite. they assume if the politics align, the label follows. i want to challenge that.

  **Approach:**
  1. Conceptual reconstruction of the broader lemkin-style framework (focusing on the cultural/institutional destruction part).
  2. Use that as a conceptual lens on two contrasting historical cases. important note: this wont be empirical history or archival digging, just testing the idea against known cases to see if the framework holds.

  **Why this angle:**
  it avoids just adding more political analysis to the pile. instead it asks about the conditions of possibility for the accusation itself.

  **What a result looks like:**
  probably a typology that distinguishes political suppression (someone stopping you) from narrative incapacity (you literally cant tell the story because the tools are gone), with criteria for telling them apart. 
  *Failure condition:* if the distinction collapses into one of the standard explanations (i.e. if narrative incapacity turns out to be just another form of political suppression), then the project fails.

  **Scope assessment:**
  honestely, this could easily balloon into real archival research which i cant do in 3 months. so i need to stay disciplined and do conceptual work only. the cases are just illustrative, not deep dives.

  let me know if this makes sense or if im way off base. feels like it fits the dept focus on moral/political phil without needing IR methods.

  thanks,
  [My Name]
