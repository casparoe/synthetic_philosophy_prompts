prompt: |-
  hey, im pitching a 3-month summer research grant through my dept in moral/political philosophy. my half-baked idea: everyone fights over whether calling something genocide is just politics, but i think there's a hidden conceptual layer people miss. lemin's original framework apparently went beyond physical killing to include destroying a groups culture, language, and institutions, but the legal definition dropped that part. so im wondering if the reason some mass atrocities never get named genocide isnt only state power or legal technicalities, but something about whether the victim group still has the institutional capacity to narrate its own history. like, is there a kind of narrative threshold — if a group cant produce a coherent historical account because its archives, record-keeping, or linguistic institutions were destroyed, then the atrocity literally cant be named in the legal-political sphere, regardless of intent?

  i need this turned into a proper proposal. state the precise question: is there a distinct narrative-institutional condition for recognizing genocide, seperate from both the legal criteria and pure political suppression? say why the existing answers leave it open — legal scholars focus on intent and scale, political-theory people focus on state interests, and neither asks whether the victims own narrative capacity is a hidden prerequisite. lay out the approach: conceptual reconstruction of the broader lemin-style framework, then use it as a conceptual lens on two contrasting historical cases (not empirical history, just testing the idea). explain why this angle rather than just adding more political analysis. say what a result looks like — probably a typology that distinguishes political suppression from narrative incapacity, with criteria for telling them apart — and what counts as failure, like if the distinction collapses into one of the standard explanations. also include an honest scope assessment for 3 months: this could easily balloon into real archival research, so i need to stay disciplined and do conceptual work only. keep the tone casual, like im emailing my advisor. no citations needed, ill fill those in. feel free to leave the casual mess and maybe a typo or two since my draft is sloppy.
