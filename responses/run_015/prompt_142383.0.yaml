answer: |-
  ### Requirements for a Personal Triage Rule

  1.  **Operational Accessibility**
      *   **Requirement:** The rule must not require skills, resources, or access the user explicitly lacks (e.g., reading dead languages, accessing paywalled journals, visiting excavation sites, or technically evaluating specialized data).
      *   **Case:** *Constraints from the situation.* You state you cannot evaluate primary evidence. A rule demanding you verify the lead seals' metallurgy is unusable.
      *   **Status:** **Non-Negotiable.** (If the rule requires tools you do not have, it fails your purpose immediately.)

  2.  **Claimant Agnosticism (Status Invariance)**
      *   **Requirement:** The rule must yield the same verdict on a claim's *procedure* regardless of the social status, funding, or institutional affiliation of the person making it.
      *   **Case:** *The Mirror Case.* If the rule dismisses an amateur but accepts a professor making the identical argument, it is measuring sociology, not history.
      *   **Status:** **Non-Negotiable.** (This is the core philosophical constraint you introduced to avoid appeal-to-authority.)

  3.  **Immunization Detection**
      *   **Requirement:** The rule must flag arguments that explain away all counter-evidence by expanding the theory (e.g., alleging conspiracy, systematic error, or forgery) without generating new, risky predictions that could falsify the theory.
      *   **Case:** *The Shortened-Chronology Claim.* This distinguishes a theory that grows to fit facts from one that predicts facts.
      *   **Status:** **Non-Negotiable.** (Without this, the rule cannot distinguish between complex revisionism and unfalsifiable pseudohistory.)

  4.  **Process/Outcome Decoupling**
      *   **Requirement:** The rule must evaluate the *method* of the claim independently of whether the conclusion is eventually proven true or false. It must be able to identify a "lucky guess" or a "sound method with bad data" as distinct categories.
      *   **Case:** *The Engineer/Seal Scenario.* The rule must judge the engineer's template-matching procedure the same way whether the excavation confirms or refutes him.
      *   **Status:** **Non-Negotiable.** (You explicitly requested the rule handle this distinction.)

  5.  **Preservation Sensitivity**
      *   **Requirement:** The rule must not treat absence of evidence as evidence of absence in contexts where preservation bias is known to be high (oral traditions, burned archives, urban overburden).
      *   **Case:** *The Destroyed-Archive Case.* A rule that requires documentary proof for every claim will systematically reject valid histories of marginalized or destroyed peoples.
      *   **Status:** **Preference.** (While historically vital, a triage rule for *sensational* claims might prioritize skepticism here for efficiency. However, for accuracy, it should be non-negotiable.)

  6.  **Evolutionary Capacity**
      *   **Requirement:** The rule must distinguish between a research program that changes shape (shedding errors, becoming more specific) and one that remains static in its assertions while becoming more elaborate in its defenses.
      *   **Case:** *The Frozen-Claim Case.* Legitimate science evolves; dogma stays still.
      *   **Status:** **Preference.** (This requires longitudinal tracking which may exceed an "evening to spare," but it is a strong marker if available.)

  7.  **Uncertainty Tolerance**
      *   **Requirement:** The rule must allow for a "cannot tell" or "park" verdict. It must not force a binary True/False decision when evidence is inaccessible.
      *   **Case:** *Your Purpose.* You stated the rule should be honest about which way it errs and allowed to say it cannot decide.
      *   **Status:** **Non-Negotiable.** (Forcing a verdict where none is possible violates your constraint on honesty.)

  8.  **Expected Value Sensitivity**
      *   **Requirement:** The rule must distinguish between the *probability* of a claim being true and the *value* of investigating it. A low-probability claim with high reorienting potential should be "parked" or "investigated" rather than "dismissed."
      *   **Case:** *Probability vs. Expected Value.* You noted a 2% likely claim might deserve an hour if the payoff is high.
      *   **Status:** **Preference.** (This adjusts the triage category, not the truth value. It is a utility function, not a truth test.)

  ---

  ### Incompatibilities and Tensions

  **1. Operational Accessibility vs. Process/Outcome Decoupling**
  *   **The Conflict:** You require the rule to evaluate the *method* (Engineer Case) without requiring you to evaluate the *technical argument* (Constraints).
  *   **The Tension:** To judge if a method is sound usually requires expertise. If you cannot evaluate the argument, you cannot strictly evaluate the method.
  *   **Resolution:** The rule must evaluate *meta-procedural* markers (e.g., "Did the claimant invite verification?" "Is the data available for others to check?") rather than technical validity. This shifts the burden from *checking the math* to *checking the openness*.

  **2. Efficiency vs. Preservation Sensitivity**
  *   **The Conflict:** Quickly dismissing "Alien" claims (Efficiency) often relies on heuristics like "no physical evidence," which unfairly penalizes claims about destroyed archives (Preservation).
  *   **The Tension:** A fast rule risks becoming a blunt instrument that convicts the undocumented.
  *   **Resolution:** The rule must have a specific "exception clause" for contexts of known destruction/oral tradition, which slows down the triage for those specific cases.

  **3. Claimant Agnosticism vs. Efficiency**
  *   **The Conflict:** The fastest way to triage is often checking credentials (Consensus). Ignoring credentials (Agnosticism) requires reading the argument closely, which takes time.
  *   **The Tension:** Adhering to your philosophical constraint makes the rule more labor-intensive.
  *   **Resolution:** Accept that a rule meeting your standards will take longer than a simple "check the PhD" heuristic.

  ---

  ### The Single Requirement That Does the Most Work

  **Claimant Agnosticism (Status Invariance)**

  This requirement excludes the largest number of candidate rules because the most common, efficient heuristics rely entirely on social proof (e.g., "Is it peer-reviewed?", "Is the author affiliated?", "Do experts agree?"). By forcing the rule to ignore the *source* and focus entirely on the *structure* of the claim and the *transparency* of the method, it eliminates the "gatekeeping" shortcuts that most lay-people rely on. It forces the rule to be analytical rather than sociological.

  ---

  ### Scorecard of Candidate Heuristics

  **1. The Falsifiability Test (Can this be proven wrong?)**
  *   **Score:** Mixed.
  *   **Analysis:** Excellent for **Immunization Detection** (catches the Chronology claim). Fails **Preservation Sensitivity** (often treats silence in destroyed archives as unfalsifiable). Hard for a non-specialist to apply (**Accessibility**) because determining what *would* falsify a claim often requires technical knowledge.

  **2. The Extraordinary-Claims Principle (Extraordinary claims need extraordinary evidence)**
  *   **Score:** Poor.
  *   **Analysis:** Fails **Claimant Agnosticism** because "Extraordinary" is usually defined relative to current orthodoxy (sociology) rather than independent coincidence (structure). It is often used as a rhetorical shield rather than a tool. It does not help with **Process/Outcome Decoupling**.

  **3. The Consensus-and-Peer-Review Test (Do experts accept this?)**
  *   **Score:** Fails.
  *   **Analysis:** Directly violates **Claimant Agnosticism** and **Vindicated Outsider** cases. It is the fastest rule (**Efficiency**) and respects **Accessibility**, but it measures the sociology of the field, not the claim. It cannot distinguish between a suppressed truth and a crackpot theory.

  **4. The Mimicry Test (Is the claimant imitating the surface of scholarship while skipping the practice?)**
  *   **Score:** High.
  *   **Analysis:** Strong on **Immunization** and **Claimant Agnosticism** (looks at citations/method, not person). It handles the **Engineer Case** well (did he actually let others check the seals?). It struggles with **Preservation Sensitivity** (a claim about a burned archive may look like "missing citations" but be accurate). It is **Accessible** to a lay reader (you can see if citations are missing or irrelevant without reading the source).
