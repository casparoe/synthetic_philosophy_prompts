      *   *Self-Correction during drafting:* I need to make sure I don't just say "You're being Wittgensteinian, stop it." I need to use the philosophy to *solve* the problem. The solution is that rule-following is inherently communal and corrective, not individual and final.

  7.  **Final Polish:**
