answer: |-
  This is one of the most fertile and frustrating stalemates in contemporary historiography. You have correctly identified that the science isn't the battleground; the battlefield is metaphysics and politics.

  Your intuition is sharp: this is not merely a verbal disagreement, nor is it a hidden factual dispute. It is a **category collision driven by political anxiety.**

  Here is the diagnosis of why the debate is stuck, why your worry about responsibility is the actual engine of the conflict, and how a specific distinction might actually move the needle.

  ### 1. The Diagnosis: Two Definitions of "Agency" Talking Past Each Other
  The stalemate exists because both camps are using the word "agency" to do two completely different jobs.

  *   **Camp A (Posthumanist/New Materialist):** Uses "agency" **descriptively**. To them, agency means *causal efficacy*. If $X$ changes the outcome of events, $X$ has agency. A virus, a volcano, and a carbon molecule all "act" because they alter the trajectory of history. Their goal is **ontological flattening**: they want to show that humans are not the sole authors of history, specifically to grapple with the Anthropocene (where "human" impact is actually a mix of industrial tech, geology, and biology).
  *   **Camp B (Critical Humanist/Political Ecologist):** Uses "agency" **normatively**. To them, agency implies *intentionality* and *accountability*. If you say a volcano has agency, you are implicitly granting it a status that belongs to moral subjects. Their goal is **political preservation**: they fear that if we distribute agency too widely, we dilute the blame owed to specific human systems (colonialism, capitalism, governance) that failed to adapt.

  **The Verdict:** It is a verbal disagreement, but not a trivial one. It is a **terminological clash with political consequences.** When Camp A says "Tambora is an actor," they mean "Tambora is a causal variable we cannot ignore." When Camp B hears it, they hear "Tambora shares the blame for the famine."

  ### 2. Your Worry: The Exculpation Trap
  You asked: *"Is the crux whether attributing agency to a volcano forces you to say societies aren't responsible for adapting badly?"*

  **Yes. This is the bedrock intuition driving Camp B.**
  This is not your confusion; this is a historically grounded fear. Environmental determinism has a ugly pedigree. In the 19th and early 20th centuries, claiming that "climate shapes civilization" was often code for "tropical people are lazy" or "northern people are industrious."

  Camp B worries that "non-human agency" is Determinism 2.0. If the *blight* is an actor in the Irish Potato Famine, does that let the British government off the hook for exporting grain while Irish people starved?
  *   **Camp A says:** No, it highlights the *interaction*. The blight was the trigger; policy was the amplifier.
  *   **Camp B says:** The language of "shared agency" creates a moral fog. In a courtroom, if you say "the gun and the shooter are both actors," you are obscuring the murder.

  ### 3. The Counterfactual Red Herring
  You asked if the hidden point is about **counterfactual robustness** (i.e., *could the volcano have done otherwise?*).

  This is a philosophical trap. If agency requires the "capacity to have done otherwise" (libertarian free will), then **humans don't have agency either.** Neuroscience and physics suggest human decisions are also determined by prior causes.
  *   If Camp B insists that only things with free will are actors, they undermine human agency too.
  *   If Camp A insists that determined things can be actors, they must admit the volcano is an actor *in the same way* a human is (a node in a causal chain).

  Most sophisticated theorists on both sides know this, so they rarely argue it explicitly. Instead, they argue about **responsiveness.** Humans can respond to feedback loops reflexively (we can change our minds); volcanoes cannot. Camp B argues this difference is so vast it requires a different word. Camp A argues the *effect* is what matters for history, not the internal mechanism.

  ### 4. How to Unstick It: A Proposed Distinction
  The debate remains stuck because both sides refuse to yield their terminology. To move it, we need to introduce a distinction that Camp A usually accepts but Camp B often ignores in the heat of battle.

  **The Distinction: *Actant* vs. *Agent***
  Bruno Latour (the godfather of Camp A) actually proposed this.
  *   **Actant:** Anything that modifies a state of affairs (a volcano, a microbe, a law, a person).
  *   **Agent:** An actant that can be held morally accountable (usually humans, sometimes corporations).

  **The Synthesis:**
  We can agree that Tambora is an **actant** in 1816 politics (it causally constrained options) without granting it **moral agency** (it is not to blame for the suffering).

  **Why this helps:**
  It allows Camp A to map the causal network accurately (the volcano *did* something) without triggering Camp B's alarm bells about responsibility (the volcano *did not choose* to starve children).

  ### 5. A Concrete Case to Test the Distinction
  To see if this moves the needle, apply it to the **Irish Potato Famine (1845–1852)**.

  *   **Old Debate:**
      *   *Camp A:* "The Blight (*Phytophthora infestans*) was a historical actor that drove the famine."
      *   *Camp B:* "No, the Blight was a condition. The *policy* was the actor. Calling the Blight an actor obscures the Corn Laws."

  *   **Reframed with Actant/Agency:**
      *   "The Blight was a powerful **actant** that destroyed the caloric base of the population. However, the **moral agency** regarding the famine lies entirely with the Westminster administration's decision to continue grain exports."

  **Does this satisfy both?**
  *   It satisfies Camp A because the Blight is recognized as a dynamic force, not just static "background."
  *   It satisfies Camp B because the *locus of blame* remains firmly on the human political structure.

  ### 6. Is It Actually Stuck?
  It is stuck only so long as the debate remains **ontological** (What *is* a volcano?). It becomes solvable when it becomes **methodological** (How do we *write* about the volcano?).

  The substantive point hidden here is about **vulnerability.**
  The real disagreement isn't about the volcano. It's about **why some humans died and others didn't.**
  *   Camp A focuses on the *shock* (the volcano).
  *   Camp B focuses on the *susceptibility* (the social structure).

  **The Way Forward:**
  The most productive environmental history today (e.g., work by Sam White, or Dagomar Degroot) sidesteps the word "agency" entirely. They talk about **constraints and affordances.**
  *   The volcano *constrained* the growing season.
  *   The political system *afforded* relief (or didn't).

  **Conclusion:**
  You are not confused; you have identified the friction point. The debate is a **political dispute disguised as a metaphysical one.** Camp B fears that "non-human agency" is a tool of exculpation for the powerful. Camp A fears that "human exceptionalism" blinds us to the ecological limits that will eventually destroy us.

  **Can it be resolved?**
  Yes, by accepting that **causal power does not equal moral responsibility.** If historians agree to treat non-humans as *causal forces* (actants) while reserving *accountability* for human systems, the "determinism" charge loses its teeth. But until Camp B feels safe that "agency" won't be used to excuse colonial negligence, they will keep fighting the terminology. The deadlock is not about truth; it's about trust.
