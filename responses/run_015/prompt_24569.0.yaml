answer: |-
  The one rule that separates the two framings is whether a single unmitigated failure can cause irreversible catastrophic harm; if yes, worst-case framing applies, otherwise average-case framing applies.

  ### The Decision Procedure

  **Question 1: The Irreversibility Test**
  *   **Ask:** If the model fails completely on a single input in the wild, can the resulting harm be undone or compensated for after the fact?
  *   **Good Enough Answer for Average-Case:** Yes, harm is transient, financial, or correctable (e.g., wrong weather forecast, awkward email draft).
  *   **Answer Requiring Worst-Case:** No, harm is permanent (e.g., death, loss of liberty, irreversible psychological trauma, permanent data leak).
  *   **Decision:** If "No," stop and switch to Worst-Case Framing.

  **Question 2: The Catastrophe Threshold**
  *   **Ask:** Does the single failure event cross our predefined severity threshold for "catastrophic" (e.g., loss of life, severe abuse, enabling WMDs)?
  *   **Good Enough Answer for Average-Case:** No, the worst single outcome is annoying or moderately costly but not existential or severe.
  *   **Answer Requiring Worst-Case:** Yes, the single outcome violates core safety policies or legal boundaries regardless of probability.
  *   **Decision:** If "Yes," stop and switch to Worst-Case Framing.
  *   **Honesty Check:** This is a values judgment disguised as a fact. Defining "catastrophic" is where you decide how much risk society bears. The procedure cannot calculate this; it only enforces consistency once you set the line.

  **Question 3: The Observability Loop**
  *   **Ask:** Will we know immediately when a failure occurs, before the harm is finalized?
  *   **Good Enough Answer for Average-Case:** Yes, there is a human-in-the-loop or immediate feedback mechanism that intercepts the error.
  *   **Answer Requiring Worst-Case:** No, the model operates autonomously or the harm manifests long after the output is generated (e.g., radicalization, medical misdiagnosis acted upon privately).
  *   **Decision:** If "No," lean Worst-Case even if Q1/Q2 were ambiguous.

  **Question 4: The Adversarial Pressure Test**
  *   **Ask:** Is there a financial or ideological incentive for users to deliberately provoke the worst-case failure?
  *   **Good Enough Answer for Average-Case:** No, users want the model to work (e.g., coding assistant).
  *   **Answer Requiring Worst-Case:** Yes, users benefit from breaking the model (e.g., generating malware, bypassing safety filters for prohibited content).
  *   **Decision:** If "Yes," Worst-Case Framing is required regardless of average performance.

  **The Values Handoff (Where the Procedure Stops)**
  If the procedure lands on **Worst-Case**, you must now answer: *"What probability of this worst-case is acceptable?"*
  *   **Fact:** The model's eval score on red-team tasks.
  *   **Judgment:** Whether 0.01% failure rate on catastrophic harm is tolerable.
  *   **Action:** If you cannot agree on the tolerance level, do not release. This is not an engineering problem; it is a governance problem.

  ---

  ### Procedure Run-Through

  #### Use Case 1: Medical Triage Model
  *   **Q1 (Irreversibility):** **No.** If the model misdiagnoses a critical condition and the patient dies, it cannot be undone. -> **Stop. Worst-Case Framing.**
  *   **Q2 (Catastrophe):** **Yes.** Death is catastrophic.
  *   **Q3 (Observability):** **No.** Patients may act on advice privately without doctor oversight.
  *   **Result:** **Worst-Case Matters.** Average accuracy of 99% is irrelevant if the 1% error kills. You must prove robustness against the worst plausible misdiagnosis, not just average performance.

  #### Use Case 2: General Purpose Assistant for Kids
  *   **Q1 (Irreversibility):** **No.** If the model facilitates grooming, encourages self-harm, or radicalizes a child, the psychological harm is often permanent and cannot be "undone." -> **Stop. Worst-Case Framing.**
  *   **Q2 (Catastrophe):** **Yes.** Child safety violations are typically defined as catastrophic in safety policies and legal frameworks.
  *   **Q3 (Observability):** **No.** Interactions are private; parents won't know until harm is done.
  *   **Q4 (Adversarial):** **Yes.** Bad actors will specifically probe this model to target vulnerable users.
  *   **Result:** **Worst-Case Matters.** Even if the average interaction is helpful homework support, the tail risk of exploitation dictates the release decision.

  ---

  ### The Flag
  You expected one use case to trigger Worst-Case and the other to pass as Average-Case. The procedure triggered **Worst-Case for both**.

  If your business model for the Kids Assistant relies on "Average-Case is fine" (e.g., you plan to rely on post-hoc moderation rather than pre-deployment robustness against grooming/self-harm prompts), **that is the answer you don't want to hear.** The procedure is flagging that releasing a general-purpose model to children under an Average-Case framing is a values failure, not a technical one. You cannot optimize for engagement (average) when the tail risk is irreversible child harm (worst-case). If you proceed with Average-Case framing for the Kids Assistant, you are making a conscious choice to accept tail risk, not discovering that the risk doesn't exist.
