      *   *Section 2: Ontological Commitments:* Deep dive into the metaphysics (realism, modality).
      *   *Section 3: Tensions/Incompatibilities:* Highlight the hard problems.
      *   *Section 4: Comparative Assessment:* Briefly run the three accounts against the spec.
      *   *Tone:* Academic, rigorous, conceptual, avoiding fluff.

