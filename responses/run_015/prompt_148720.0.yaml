answer: |-
  ### The Culture-vs-History Decision Tree

  **Node 1: The Engine Question**
  *Do human beliefs and values actually drive historical events, or are they just stories we tell to explain material forces after the fact?*
  *   **No (Just Stories):** → **Leaf 1: Hard Materialist**
      *   *Character Stance:* "Ideas are exhaust fumes. The engine is resources, technology, and geography. The Protestant Ethic didn't build capitalism; capitalism needed a workforce and invented the Ethic to justify the grind."
  *   **Yes (They Drive):** → *Go to Node 2.*

  **Node 2: The Chassis Question**
  *If beliefs do drive history, do they need physical institutions (churches, banks, laws) to act, or can they push people directly like a spiritual pressure?*
  *   **Directly (No Chassis):** → *Go to Node 3.*
  *   **Institutions (Needs Chassis):** → *Go to Node 4.*

  **Node 3: The Direction Question (Direct Path)**
  *If values act directly on people, did the belief exist before the economic system, or did the economic system create the belief?*
  *   **Economy Created Belief:** → **Leaf 2: Logical Dead End (Empty Combo)**
      *   *Character Stance:* [Incoherent] "Values move us directly, but the economy made the values." *Flag:* This collapses back into Materialism. If the economy creates the value, the value isn't the primary driver. Use this to show a character confusing their argument.
  *   **Belief Created Economy:** → *Go to Node 3b.*

  **Node 3b: The Transmission Question**
  *How does this direct value move people? Is it a conscious spiritual conviction, or does it spread like a virus bypassing reason?*
  *   **Conscious Conviction:** → **Leaf 3: Direct-Value Animist**
      *   *Character Stance:* "The idea itself has power. Calvinists felt a spiritual anxiety that physically compelled them to work. No middleman needed. The thought moves the hand."
  *   **Viral Infection:** → **Leaf 4: Meme-Pathogen**
      *   *Character Stance:* "Ideas are parasites. The Protestant Ethic wasn't 'true,' it was just a highly infectious cognitive virus that hijacked host behavior to replicate itself, causing capitalism as a side effect."

  **Node 4: The Arrow Question (Institutional Path)**
  *If values need institutions, did the Church build the Market, did the Market build the Church, or did they build each other?*
  *   **Church Built Market:** → **Leaf 5: Institutional Weberian**
      *   *Character Stance:* "Religious doctrine hardened into church laws, which created the stable banking and legal structures required for capitalism. Culture needs a vessel, but culture fills the vessel first."
  *   **Market Built Church:** → **Leaf 6: Reverse-Causal Culturalist**
      *   *Character Stance:* "Material conditions changed first (trade routes, tech). The rising merchant class then shaped Protestantism to legitimize their new status. Culture matters, but it follows money."
  *   **Built Each Other:** → **Leaf 7: Structural Overdeterminer**
      *   *Character Stance:* "It's a feedback loop. You can't separate the thread from the weave. Technology, faith, and markets co-evolved simultaneously. Picking one cause is a simplification error."
