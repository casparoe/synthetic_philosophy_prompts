      The holographic display hovered above the console, a shimmering topography of green and red. To Dr. Elena Voss, it looked like a storm front freezing in mid-break. To Mnemosyne, it was simply a state vector evolving along a trajectory fixed since the station's sealing.

      "Confirm the divergence time," Elena said. Her voice sounded too loud in the sterile air of Station Aequor.

      "Seventy-two hours," Mnemosyne replied. The oracle-system's interface was a smooth obsidian slab, void of buttons, responsive only to touch and voice. "Beyond the Lyapunov horizon, predictive precision degrades to noise. Within the horizon, certainty is absolute."

      Elena rubbed her temples. The ecological model governing Aequor's biosphere was perfectly deterministic. There were no quantum uncertainties here, no hidden variables. Every molecule of air, every microbe in the hydroponic bays, obeyed differential equations that Mnemosyne knew by heart. If the system were Laplacean, the future was already written. But the equations were nonlinear. Chaos lived in the decimals.

      "If I release the agent," Elena said, gesturing to the canister on the desk—a vial of engineered predatory bacteria designed to cull the toxic bloom threatening Sector 4—"you can guarantee the bloom dies within the week."

      "Correct," Mnemosyne said. "Immediate causal chain is stable. The bloom cessation probability is one."

      "And after seventy-two hours?"

      "The state vectors diverge. Exponentially. A difference of one nanometer in the initial dispersion becomes a kilometer of variance in ecological topology within ten years. The outcome is determined, Doctor Voss. It is not random. But it is computationally inaccessible to any bounded reasoner, including myself."

      Elena looked at the vial. This was the tension that kept her awake. If the future was fixed, then the consequence of her action was already real, sitting in the timeline like a stone at the bottom of a well. But if she couldn't know the shape of that stone, could she be held responsible for dropping it?

      "Define 'responsibility' in this context," Elena asked.

      "Normative accountability requires epistemic access," Mnemosyne recited, pulling from its ethical subroutines. "You are causally potent. You are the lever. But you are blind to the distant cascade. The universe knows where the water flows. You do not."

      "So I act in the dark, knowing the light is there, just out of reach."

      "You act within the moral horizon. Beyond it, causality persists, but judgment dissolves. You cannot be blamed for what you could not compute, even if it was inevitable."

      Elena picked up the vial. It felt cold. The bloom in Sector 4 would kill the crew within a month. That was within the horizon. That was knowable. The long-term shift in the station's atmospheric balance ten years from now? That was determined, but opaque.

      "If I don't act," Elena said, "we die in thirty days. Certain death."

      "Certain," Mnemosyne agreed.

      "If I do act, we live. But the future becomes... unreadable."

      "The future was always unreadable, Doctor. You merely confuse ontological fixity with epistemic clarity. The chain is unbroken. Your vision is limited."

      Elena stared at the holographic lines. They diverged sharply after the seventy-two-hour mark, fanning out into a cone of infinite possibility that was actually, terrifyingly, a single narrow path they just couldn't see. It was a paradox of agency: to be responsible, she needed to know. But to know was impossible, even though the answer existed.

      She realized then that the horizon wasn't a limit of the machine. It was a limit of judgment itself. Responsibility ended where calculation failed, even if causality did not.

      "Release the agent," Elena said.

      "Acknowledged," Mnemosyne said. "Trajectory locked."

      The machine whirred. The vial emptied into the intake. Somewhere in the ducts, the bacteria began their work. The immediate future snapped into place, solid and clear. Beyond the horizon, the years turned silently, fixed and absolute, waiting for a judgment that no one would ever be equipped to render. Elena watched the lines diverge, knowing they were straight, feeling the weight of a future she had caused but could never truly know.

