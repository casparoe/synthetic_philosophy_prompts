answer: |-
  Kael adjusted the pressure gauge on his wrist and stepped off the lift into Sector 7. The air here was thin, sterile, and smelled of ozone. This was the Bubble District. The buildings were smooth, white domes connected by transparent tubes that carried the city's voice-streams. His job was simple: maintain the flow. Ensure the residents heard what they were supposed to hear.

  He clipped his harness onto the exterior rail of Dome 42 and slid open a maintenance panel. Inside, the ductwork was pristine but incomplete. A main intake pipe, designated for Outside Noise, ended abruptly in a capped flange. It hadn't been broken; it had never been installed. The blueprint showed a gap where a connection should have been.

  Kael reached for his wrench. He unscrewed the cap and fitted a new length of flexible tubing, routing it toward the central ventilation unit. He opened the valve. A rush of static-laden air hissed through the line—raw, unfiltered sound from the market districts, the争吵 (arguments) from the plaza, the weather reports from the coast.

  Inside the dome, through the thick glass, he saw a family sitting in a circle. They were speaking softly. When the new air hit the vent, a woman looked up. She frowned, tilted her head, and then turned back to her conversation. The new sound hadn't registered. It wasn't that it was blocked; it was that there was no mechanism to process it. The room had no acoustics for dissonance. The information had arrived, but it landed on a floor that didn't know how to hold it. It was a void, not a wall. Kael noted the repair on his slate: *Intake established. Structural receptivity null.* He moved on.

  Sector 8 was different. The Echo District.

  The buildings here were jagged, lined with parabolic dishes and vibrating fins. The air hummed with a low, aggressive thrum. Kael climbed the scaffolding of Spire 12. The noise was already deafening, even outside. He pried open the intake hatch.

  Immediately, a gust of wind tried to blow his tools out of his hands. The ductwork here was complex, a labyrinth of mirrors, amplifiers, and filters. The Outside Noise pipe was wide open, wider than in the Bubble. The problem wasn't absence; it was distortion.

  Kael shined his light down the main throat of the duct. He saw the baffles. They were coated in a thick, sticky resin that hardened incoming sound waves. He watched a raw voice-stream hit the first filter. The wave entered clean, but the filter twisted it, sharpening the frequencies until it sounded like a scream. It hit a second mirror, which bounced it back against the flow, creating a feedback loop that amplified the hostility before pushing it into the living quarters.

  He reached in with a scraper to clear the resin. The duct groaned. The building itself seemed to resist the repair. The vibration shook his teeth. Inside the spire, people were shouting, gesturing at the walls. They could hear the outside world perfectly well—in fact, they could hear it better than anyone else—but every word was returned to them as a threat. The architecture didn't omit the dissent; it digested it and spat it out as proof of danger.

  Kael managed to clear a section of the baffle. The sound softened, just for a second. A man inside looked toward the vent, eyes wide, hearing a neutral tone for the first time in months. Then the feedback loop caught again. The resin reformed almost instantly, secreted by the walls themselves. The scream returned. The man's face hardened back into anger.

  Kael closed the panel. There was nothing to fix. The pipes were open, but the system was designed to poison the water.

  He sat on the edge of the scaffolding, legs dangling over the city. Below him, the Bubble District sat in quiet ignorance, missing half the map. Above him, the Echo District screamed with too much information, all of it warped. In the Bubbles, the walls were empty. In the Echoes, the walls were lined with mirrors.

  Kael pulled out his slate and marked Spire 12 as *Unrepairable: Structural Hostility*. He capped his pen. It was easier to fix a missing pipe than to tear down a mirror that people insisted was a window. He clicked his harness back onto the line and swung toward the next job, leaving the silence and the noise to do their work.
