  9.  **Structuring the Debrief:**
      *   Map Phase 1 to "Revealed Preference" (Choice is data).
      *   Map Phase 2 (Handout 1 & 2) to "Representation Theorem" (Math fits anything if you tweak definitions).
      *   Map Phase 2 (Handout 3) to "The Axiom" (The only thing that restricts the theory).
