  7.  **Addressing Constraints & Troubleshooting:**
      *   *Allergies:* Use non-food tokens or verify allergies. Let's suggest tokens redeemable for snacks at the end to avoid mid-game eating issues, or sealed snacks. *Decision:* Sealed snacks, check allergies beforehand.
      *   *Read-Ahead:* If someone shouts "WARP!", acknowledge it and pivot to "Okay, prove it with this data."
