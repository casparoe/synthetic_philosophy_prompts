      *   Make instructions crisp.
      *   Ensure the "Secret Roles" don't violate the "no lying about activity purpose" rule. (The activity *is* about choice; the roles are part of the simulation).
      *   Check timing (75 mins is tight).

      *(Self-Correction during drafting)*: 18 students is large for individual attention. Pairs are good. 9 pairs.
      *   Phase 1: Individual choices (5 mins).
      *   Phase 2: Pair analysis of handouts (20 mins).
      *   Phase 3: Class discussion/Reveal (30 mins).
      *   Phase 4: Conclusion (20 mins).
      *   *Wait, I need to make sure the "Live" inconsistency happens.* If I rely on them generating inconsistency live, it might not happen. I should *engineer* the inconsistency in the handouts, but use the live choices to show the "Same Data/Different Mind" point.
      *   *Revised Plan:* Live choices are for the "Motives" point. Handouts are for the "Axiom/Rationalization" point. This is safer for timing.

      *Let's finalize the "Menu Laundering" example.*
      *   Scenario: Choose $A$ from $\{A, B\}$. Choose $B$ from $\{A, B, C\}$.
      *   Standard RPT: Violation (if $A$ was available in the second set, why pick $B$?).
      *   Rationalization: "I prefer $B$ when $C$ is present because $C$ makes $A$ look cheap." (Preference over the menu).
      *   Lesson: If preferences are over menus, *anything* is rationalizable. The theory loses bite.

      *Let's finalize the "Same Data" point.*
      *   Collect live sheets. Find two that match (or pre-assign roles to ensure match).
      *   Actually, pre-assigning roles to ensure a match is risky if they deviate.
      *   *Better:* I (the TA) present two "profiles" of students from a previous term who made identical choices. One was maximizing, one was flipping a coin. (This avoids live unpredictability).
