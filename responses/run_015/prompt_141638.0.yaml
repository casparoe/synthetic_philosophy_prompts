      *   *The "Menu-Laundering" Point:* Give them data that violates WARP *unless* they invent a story about the context.
      *   *The "Inconsistency" Point:* Force a cycle live.
      *   *The "Motives" Point:* Secret roles.

      *Revised Plan:*
      1.  **Phase 1: Live Choice (The Trap).** Students choose between bundles of snacks. Some have secret roles.
      2.  **Phase 2: The Rationalization Game (Pairs).** Pairs get choice histories. Some are consistent (easy utility function), some are "weird" (context dependent), some are impossible (cycles).
