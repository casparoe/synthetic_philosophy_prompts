      *   **Problem with Previous Attempts:** Students treat utility as "satisfaction/feeling" despite the formal definition. They nod during lectures but write essays conflating choice with happiness.
      *   **Goal:** A runnable in-class activity/game with real stakes (snacks/tickets) that forces students to *experience* the problems (over-fitting rationalization, intransitivity, indistinguishability of motives) before the theory is named.
      *   **Specific Requirements:**
          *   Materials list.
