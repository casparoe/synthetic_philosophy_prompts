      *Let's write the plan.*

      *(Final check on "What will go wrong")*:
      *   Students eating snacks before the end. -> Rule: "Sealed until the end."
      *   Students trading. -> Rule: "No trading, this invalidates the data."
      *   Read-ahead student. -> "Great, you know the name. Now tell us why this data violates it."
