      1.  Budget sets/choices.
      2.  Write utility functions for data.
      3.  Feel the "too easy" rationalization.
      4.  Hit a wall (inconsistency).
      5.  Compare motives (same data, different reasons).

      *Let's build the "Choice & Justify" Protocol.*
      *   **Goods:** 3 distinct snacks (e.g., Chocolate, Chips, Fruit). Let's call them $x, y, z$.
      *   **Rounds:** 3 rounds of choice.
      *   **Secret Roles:**
          *   Group A (Standard): Maximize personal taste.
          *   Group B (Rule Follower): "Always pick the middle option" or "Pick the one with the most sugar."
          *   Group C (Error): "You think $x$ is chocolate, but it's actually carob." (Maybe too complex for 75 mins). Let's stick to Rule vs. Preference.
          *   *Better:* Group B is told to create a Cycle (A > B, B > C, C > A) to test the axiom limit. *Correction:* The prompt says "no utility function can fit at all." So I need to engineer a violation live or in the handout.
      *   **The "Menu Laundering" Handout:** Give them a dataset that violates WARP *unless* they define preferences over the *set* available, not just the goods.

  4.  **Developing the Mechanics:**
      *   **Stakes:** Real snacks. If you choose it, you keep it.
      *   **Budget Sets:** Not prices, just menus. $\{A, B\}$, $\{B, C\}$, $\{A, C\}$.
      *   **Timeline:**
          *   0-15: Setup & Live Choices.
