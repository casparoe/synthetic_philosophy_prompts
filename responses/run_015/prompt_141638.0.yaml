      *(Final check on "Honesty Check")*:
      *   The game shows the *logical* limits. It doesn't solve the *normative* question of why we should be consistent. I need to state that.

      *Okay, ready to generate.*
answer: |-
  Here is a complete lesson plan designed for your 75-minute session. It is built to be robust against the specific dynamics of a mixed Phil/Econ cohort.

  # Activity Title: "The Rationalization Game"

  ## 1. Materials List
  *   **Goods:** 18 sealed "Snack Packs." Each pack contains 3 distinct items (e.g., a chocolate bar, a bag of chips, a fruit bar). *Check for allergies beforehand; use non-food tokens if necessary.*
  *   **Choice Sheets (18):** Simple slips of paper with three rows (Round 1, 2, 3).
  *   **Analyst Packets (9):** One per pair. Each contains three "Case Files" (printed choice histories).
  *   **Secret Role Cards (4):** For seeding specific behaviors (see below).
  *   **Board/Projector:** To track the "Live Data" and write the Utility definitions.
  *   **Timer:** Visible to you.

  ## 2. Payoff Scheme & Rules
  *   **The Stakes:** Students keep the items they choose.
  *   **The Mechanism:** To prevent income effects (trading snacks for more snacks), use the **One-Round Random Payoff** rule. Tell them: *"You will make three choices. At the end of class, I will roll a die. If it lands on 1-2, you keep Round 1's choice. 3-4, Round 2. 5-6, Round 3. The other two rounds are void."* This ensures they treat every choice as if it's the only one that matters.
  *   **The Constraint:** No trading, no opening packages until the end. If you trade, you void your payoff.

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Goal |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Seeding.** Distribute Choice Sheets and Snack Packs. Hand out 4 **Secret Role Cards** to specific students (sit them apart). Explain the Random Payoff rule. | Establish stakes. Ensure data overlap for the final debrief. |
  | **05-15** | **Live Choice Phase.** Present three "Budget Sets" (Menus) on the board. Students mark their Choice Sheet. <br> *Menu 1:* {Chocolate, Chips} <br> *Menu 2:* {Chips, Fruit} <br> *Menu 3:* {Chocolate, Fruit} | Generate real choice data. The secret roles ensure at least two students produce identical data via different mechanisms. |
  | **15-35** | **The Analyst Game (Pairs).** Students pair up. Distribute **Analyst Packets**. They must attempt to write a Utility Function $U(x)$ for each Case File. | Force the "Rationalization is Too Easy" realization. Confront the "Impossible" data. |
  | **35-50** | **The Axiom Reveal.** Discuss Case File 3 (The Cycle). Introduce WARP/SARP formally *now*, as the solution to the problem they just hit. | Show that the Axiom is the *only* content of the theory. |
  | **50-65** | **The Motive Reveal.** Collect Live Choice Sheets. Find the two students with identical choices (seeded). Reveal their Secret Roles. Discuss Welfare. | Decouple "Utility" from "Well-being" and "Mental States." |
  | **65-75** | **Synthesis & Wrap.** Map the game to the essay traps. Q&A. | Solidify the "As-If" distinction. |

  ## 4. The Secret Roles (Seeding)
  Hand these out discreetly to 4 students before class starts.
  *   **Card A (The Maximizer):** "Choose the item you genuinely want the most in each menu." (Give to 2 students).
  *   **Card B (The Rule Follower):** "Ignore your taste. In every menu, choose the item listed on the **Left**." (Give to 1 student).
  *   **Card C (The Contrarian):** "In every menu, choose the item listed on the **Right**." (Give to 1 student).
  *   *Note:* By seeding two "Maximizers," you increase the odds of a natural overlap. By seeding "Left" and "Right" followers, you guarantee specific patterns if the board layout is consistent. *Better strategy for guaranteed overlap:* Give **two** students the exact same Rule Card (e.g., "Always pick the Sweet item"). This guarantees identical data with identical rules, but you can then reveal one was following the rule and the other (a natural Maximizer) happened to match them.
  *   *Revised Seeding for Maximum Impact:*
      *   **Student 1 (Secret Rule):** "Always pick the Chocolate, regardless of the menu."
      *   **Student 2 (Secret Preference):** "You love Chocolate. Pick what you actually want." (Hoping they match).
      *   *Actually, the most robust way:* **Student 1 & 2 both get the Rule Card:** "Always pick the item in the Left column." They will produce identical data. In the debrief, you ask them *why*. One might say "I just liked the left one," the other "I was following the instruction." Wait, they both know they had a card.
      *   *Best Version:* **Student 1 (Secret Rule):** "Always pick the Left item." **Student 2 (No Card):** Normal student. You hope they match.
      *   *Safest Version for TA:* **Don't rely on luck.** In the debrief (Minute 50), *you* present two hypothetical profiles from "last year's class" that had identical choice data. One was maximizing, one was flipping a coin. Use the live students only to show that *we cannot tell the difference from the outside.*
      *   *Correction per your prompt:* You want "two students turn out to have produced exactly the same choice data."
      *   *Solution:* Give **Student 1** and **Student 2** the same Secret Rule: "Always choose the item with the Dark Wrapper." Give **Student 3** and **Student 4** no card (act naturally). In the debrief, ask Student 1 & 2 to stand. Ask why they chose what they chose. They admit the rule. Ask Student 3 & 4 if anyone matched them. If yes, compare motives. If no, use the "Hypothetical from last year" backup.
      *   *Actually, let's hardcode the overlap.* Give **Student 1** and **Student 2** the card: "Your goal is to generate data that looks like you prefer Chocolate > Chips > Fruit." They will force the choices to match. In the debrief, reveal they were *simulating* preference, not *feeling* it.

  ## 5. The Analyst Packets (Choice Histories)
  Each pair gets one packet with three Case Files.

  **Case File 1: The Boring Consistency**
  *   Menu {A, B} $\rightarrow$ Chose **A**
  *   Menu {B, C} $\rightarrow$ Chose **B**
  *   Menu {A, C} $\rightarrow$ Chose **A**
  *   *Task:* Write a $U(x)$ that fits.
  *   *Expected:* $U(A)=3, U(B)=2, U(C)=1$. Easy.

  **Case File 2: The Menu-Laundering (The Trap)**
  *   Menu {A, B} $\rightarrow$ Chose **A**
  *   Menu {A, B, C} $\rightarrow$ Chose **B**
  *   *Task:* Write a $U(x)$ that fits.
  *   *The Trap:* Standard RPT says this is a violation (if A was good enough in the small set, why not in the big set?). But students will invent stories: "Maybe they didn't want to look greedy taking A when C was available?" or "Maybe they prefer B only when C is present?"
  *   *Lesson:* If you allow preferences over *menus* or *contexts*, you can rationalize anything. The theory becomes empty.

  **Case File 3: The Impossible Cycle**
  *   Menu {A, B} $\rightarrow$ Chose **A**
  *   Menu {B, C} $\rightarrow$ Chose **B**
  *   Menu {C, A} $\rightarrow$ Chose **C**
  *   *Task:* Write a $U(x)$ that fits.
  *   *The Wall:* They cannot. $A \succ B \succ C \succ A$. No function maps this.
  *   *Lesson:* This is where the Axiom (WARP/SARP) bites. This is the only thing that makes the theory falsifiable.

  ## 6. The Debrief Script (Mapping Moments to Concepts)

  **Minute 35 (After Case 1 & 2): "The Rescue that Collapses"**
  *   **Ask:** "Who solved Case 2?"
  *   **Likely Answer:** "I assumed they prefer B when C is around."
  *   **Your Point:** "You just performed **Menu-Laundering**. You saved the theory by changing the definition of the goods from 'Snacks' to 'Snacks-in-a-Context.' If you can always do that, **Revealed Preference explains nothing.** It becomes a tautology: 'They chose it, so they must have preferred it (given the context, mood, menu, etc.).'"
  *   **Concept:** Representation vs. Discovery. We can always represent choice as maximization if we make the preference relation complex enough.

  **Minute 45 (After Case 3): "The Axiom as Content"**
  *   **Ask:** "Who solved Case 3?" (Silence).
  *   **Your Point:** "You couldn't. This data is 'irrational' in the RPT sense. This is the only moment the theory has teeth. The **Weak Axiom of Revealed Preference (WARP)** is just a rule that bans Case 3."
  *   **Concept:** The axioms are not descriptions of psychology; they are consistency constraints required for the math to work. Without them, 'Utility' is just a label for 'Choice.'

  **Minute 55 (The Live Reveal): "The Black Box"**
  *   **Action:** Ask the two students with the Secret Rule Cards ("Always pick Left") to stand. Ask a normal student who happened to pick Left every time to stand.
  *   **Ask:** "Student A (Rule) and Student B (Natural), you made identical choices. Do you have the same Utility Function?"
  *   **Discussion:**
      *   **Econ View:** Yes. $U(Left) > U(Right)$. The theory treats you identically.
      *   **Phil View:** No. Student A has no preference; they have an instruction. Student B has a desire.
      *   **Welfare Question:** "If I tax the Left item, who is worse off?" Student B loses satisfaction. Student A just follows a new rule.
  *   **Concept:** Preference vs. Rule vs. Belief. RPT cannot distinguish between *wanting* X and *choosing* X for some other reason. Therefore, RPT cannot measure "Well-being," only "Consistency."

  **Minute 65: "The As-If Reading"**
  *   **Your Point:** "So why do we use this? Because Friedman said it doesn't matter *why* you chose, only that you behave *as-if* you are maximizing. It's a tool for prediction, not a map of the soul."
  *   **Warning:** "But when you write your essays, do not say 'Utility is satisfaction.' Utility is the number that makes the choice data fit. If you conflate the two, you will fail to see why Case 3 is a problem."

  ## 7. Troubleshooting: What Will Go Wrong

  **1. The "Read-Ahead" Student**
  *   **Scenario:** Minute 40, someone shouts "That's a violation of WARP!"
  *   **Fix:** Do not shut them down. Pivot immediately. "Correct. So, apply WARP to Case 2. Does Case 2 violate WARP? Why or why not?" Force them to do the technical work rather than name-dropping. It turns them from a disruptor into a resource.

  **2. The "Snack Traders"**
  *   **Scenario:** Students swapping items during the choice phase.
  *   **Fix:** Pre-empt this in the rules. "Trading creates income effects and invalidates the Revealed Preference assumption that choices reflect stable rankings. If I see trading, that pair gets zero snack payoff."

  **3. The "Philosophy Revolt"**
  *   **Scenario:** Phil majors argue that Case 3 (The Cycle) isn't irrational, just human (e.g., Buridan's Ass, or changing tastes).
  *   **Fix:** Validate them. "You are absolutely right. RPT assumes static preferences. If preferences change mid-game, the model breaks. That is a critique of the *model*, not your logic. But within the model's universe, Case 3 is a crash. The question is: do we want a model that crashes, or one that rationalizes everything?"

  **4. The "Bored Econ Major"**
  *   **Scenario:** They solve the utility functions in 30 seconds and zone out.
  *   **Fix:** The "Menu-Laundering" trap (Case 2) is designed for them. It looks trivial but implies a deep theoretical collapse. Challenge them: "Write down the domain of that utility function. Is it $X$ or $\mathcal{P}(X)$?"

  **5. Allergy/Safety**
  *   **Scenario:** Someone has a nut allergy.
  *   **Fix:** Use non-food goods (pens of different colors, different types of paper) redeemable for a generic prize at the end, OR verify allergies and use sealed, labeled commercial snacks (e.g., KitKats vs. Oreos). *Recommendation:* Sealed commercial snacks are safer and feel more "real."

  ## 8. Honesty Check: What This Game Cannot Do

  You need to state this explicitly in the last 5 minutes, or they will leave with the wrong idea.

  1.  **It cannot prove Normativity:** The game shows that Cycles break the *math*. It does not prove that being Consistent is *morally better*. You have to say: "RPT tells you when you are being a bad calculator, not when you are being a bad person."
  2.  **It cannot solve the Mental State Debate:** The game shows that RPT *ignores* mental states. It doesn't prove mental states don't exist. You have to say: "Economics brackets the mind. Philosophy interrogates it. This tool works *because* it brackets the mind, but that is also its limit."
  3.  **It cannot guarantee Welfare:** The "Same Data/Different Motive" segment shows that Choice $\neq$ Welfare. You must explicitly warn them: "Do not use Revealed Preference to argue someone is 'happier' in your essays. You can only argue they are 'more consistent.'"

  ## 9. TA Cheat Sheet (The "Gotchas")

  *   **If they ask:** "But what if I chose A because it was closer to me?"
      *   **You say:** "Then 'Distance' is part of the good. Define the good as 'A-at-distance-1'. Now rationalize it." (This proves the Menu-Laundering point).
  *   **If they ask:** "Is Utility real?"
      *   **You say:** "Is a temperature map real? It maps heat. Utility maps choice. Whether the heat is 'in' the air or 'in' the thermometer is the philosophy part. The econ part is just reading the map."
  *   **If the data collection fails** (no two students match):
      *   **You say:** "In a class of 18, it's statistically likely no one matched. So let's look at this data from last year..." (Have a backup slide with two identical choice histories prepared).

  This plan forces the "Aha!" moments through friction (trying to fit the function) rather than exposition. It respects the Phil majors' skepticism by validating it as a theoretical limit, and it satisfies the Econ majors by showing them the mechanical constraints of their own tools.
