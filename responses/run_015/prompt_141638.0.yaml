  2.  **Deconstruct the Pedagogical Challenge:**
      *   *Challenge 1: Utility as Mental State.* Econ majors think it's math; Phil majors think it's psychology. Both need to see it's just a mapping of choices.
      *   *Challenge 2: Rationalization is Too Easy.* Students need to see that *any* choice can be rationalized if you allow preferences over menus/context, making the theory empty.
      *   *Challenge 3: The Axiom as Content.* They need to encounter a violation (cycle) that *cannot* be rationalized by a stable ordering.
      *   *Challenge 4: Welfare/Interpretation.* Two people make the same choices for different reasons (preference vs. rule vs. error). Does RPT distinguish them? (No). Does welfare analysis hold? (Problematic).

  3.  **Drafting the Activity: "The Choice Box"**
      *   *Idea:* Students make choices over bundles. Then they analyze data.
