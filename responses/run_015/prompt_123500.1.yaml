answer: |-
  This is a sophisticated theoretical framework. "Posthumous Narrative Capture" (PNC) moves beyond the standard "accuracy vs. artistic license" debate into the ethics of *structure*. It argues that the *shape* of a life is a moral property, not just the facts within it.

  Here is a breakdown of how to apply PNC to *Selma*, where the theory holds, where it goes silent, and how to stress-test it.

  ### 1. Who gets harmed in *Selma*?
  Under PNC, harm is defined as the violation of the subject's "narrative integrity"—the forcing of their contingency into a teleological arc.

  *   **LBJ (Primary Harm):** This is the clearest fit. By positioning LBJ as the antagonist to MLK's protagonist, the film imposes a **binary conflict structure** on a complex political partnership. Even if every line of dialogue were historically verified (which they weren't), placing LBJ in the "obstacle" slot of the Hero's Journey reduces his political calculus to a plot device. PNC argues this harms LBJ's legacy by stripping his actions of their actual context (political maneuvering) and replacing it with narrative function (blocking the hero).
  *   **MLK (Secondary Harm):** PNC suggests MLK is also harmed, though differently. To make the narrative arc work, MLK's life is smoothed into a **hagiographic teleology**. His doubts, strategic errors, or internal conflicts that don't serve the "triumph of voting rights" arc are minimized. He becomes a symbol rather than a person. PNC posits that the dead have a right not to be turned into symbols, even flattering ones.
  *   **The Audience (Tertiary/Instrumental Harm):** PNC is primarily about the *subject*, not the viewer. However, you could argue the audience is harmed epistemically. They aren't just learning wrong facts; they are learning a **wrong mode of causality**. They learn that social change happens via "Hero vs. Villain" clashes rather than coalition building. This is a harm to historical understanding, but strictly speaking, PNC is an ethics of *representation*, not an epistemology of *reception*.

  **Verdict:** LBJ is the primary victim of PNC in this case. His complexity was sacrificed to give MLK's story a cleaner dramatic spine.

  ### 2. Does *Selma* help, hurt, or limit the concept?
  The *Selma* case **strengthens** PNC, but it also exposes a boundary condition.

  *   **Why it helps:** The controversy wasn't just about "did this happen?" It was about "what is the *relationship*?" Historians argued the *dynamic* was wrong. This validates PNC's core claim: you can have factual accuracy (dates, laws passed) but still commit ethical violence through narrative shaping. Ava DuVernay's defense ("It's a movie, not a documentary") essentially admits to Narrative Capture: she prioritized the film's emotional arc over the historical record's messy contingency.
  *   **The Limit (Political vs. Intimate):** PNC works best on intimate biopics (e.g., *Ray*, *Walk Hard*). *Selma* is a **political mythos**. In political biopics, the "person" is already a public symbol before they die. One could argue LBJ and MLK *expected* to be captured by narrative because they were political actors seeking legacy. PNC might need a clause distinguishing between "private individuals thrust into history" vs. "public architects of history." If the concept can't distinguish between a private citizen and a President, it might be too broad.

  ### 3. Where is the theory silent?
  A good theory knows what it doesn't cover. PNC is silent on three crucial things in the *Selma* case:

  *   **The Living Community's Claim:** PNC focuses on the *dead individual*. It has no mechanism to weigh the rights of the dead against the needs of the living community. The Black community might argue that "capturing" MLK's story as a triumph is ethically necessary for contemporary political mobilization, regardless of LBJ's feelings. PNC is silent on **social utility vs. posthumous rights**.
  *   **Collective vs. Individual Agency:** PNC treats "a life" as a singular unit. *Selma* is about a *movement*. Who owns the narrative of a movement? PNC doesn't explain how to handle narrative capture when the "protagonist" is a collective (The Movement) and the "antagonist" is a structure (Segregation), with individuals (LBJ/MLK) merely acting as nodes.
  *   **The "Right to be Forgotten":** PNC assumes the dead *want* representation. It is silent on whether the greater ethical good might be **not representing them at all**. If representation inevitably distorts (via capture), is the only ethical choice silence? PNC assumes representation is happening and tries to regulate it; it doesn't question the impulse to represent.

  ### 4. The Falsification Condition
  To drop PNC entirely, I would need to see an argument that proves **narrative is the only access we have to the dead.**

  If you can demonstrate that human memory and history are *inherently* narrative structures (a la Paul Ricoeur or Hayden White), then "messy actual life" is a myth. We never have access to the "messy life," only the story. If there is no "pre-narrative life" to be captured, then PNC collapses because there is no original state to violate.

  **The Counterexample:** A biopic made with the **explicit consent and collaboration of the subject before death** (e.g., a subject directing their own biopic). If they say, "Turn my life into a three-act structure," does PNC still claim harm? If PNC says "Yes, because they don't understand how narrative will distort them," it becomes paternalistic. If it says "No," then the harm isn't in the *capture*, it's in the *lack of consent*. That shifts the theory from "Narrative Ethics" to "Consent Ethics," rendering PNC redundant.

  ### 5. The Weakest Part of This Reasoning
  The weakest link in applying PNC to *Selma* is the **conflation of factual error with narrative shaping.**

  In the *Selma* controversy, historians weren't just mad about the *vibe*; they were mad about specific alleged falsehoods (e.g., LBJ ordering FBI surveillance on King, LBJ threatening King). PNC is designed to argue harm exists *even if the facts are right*. But in *Selma*, the facts were disputed.

  **Why this weakens the argument:** If the film is factually wrong, you don't need PNC to critique it. You can just use standard truth-telling ethics. To make PNC shine, you have to isolate moments where the facts *were* technically true but the *implication* was false.
  *   *Example:* If LBJ *did* hesitate on the timing of the Act (fact), but the film edits it to look like he opposed the Act itself (narrative capture).
  *   *Risk:* If your seminar mates argue that *Selma* was just "lying," your PNC framework becomes unnecessary overhead. You must prove that the *structure* did the damage, not the *details*.

  ### Summary for your Paper
  Use *Selma* to show that PNC explains the *feeling* of betrayal historians felt better than "accuracy" does. They felt LBJ was turned into a caricature. But acknowledge that PNC struggles when the "narrative capture" serves a marginalized group's need for myth-making (MLK/Black voters) against a powerful figure's legacy (LBJ/Presidential history). That tension is where the real philosophy lives.
