prompt: |-
  hey i'm writing for my phil of art / ethics class (we're doing death and representation) and i need help framing my argument. so we invented this idea in seminar called 'posthumous narrative capture' — basically that turning a dead real person's life into a movie plot isn't just about getting facts wrong, it's about forcing their messy actual life into a teleological arc (like setup-conflict-resolution) that serves the filmmaker's meaning-making, and that this is its own kind of harm even if every fact is technicly right. i want to apply it to the movie Selma and the whole controversy over how it showed LBJ vs MLK on the Voting Rights Act — you know, the thing where historians got mad that LBJ looked more obstuctive than he actually was. using the narrative capture frame, who exactly gets harmed here: LBJ's legacy, the audience's historical understanding, or MLK's story being distorted for dramatic tension? does the case help the concept, hurt it, or show it was never meant for political biopics like this? and please say where the theory is silent rather than forcing it to talk. also tell me what argument or counterexample would make you drop narrative capture entirely, and point out the weakest part of your reasoning. thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Art / Ethics class (topic: Death and Representation).
      *   **Core Concept:** "Posthumous Narrative Capture" (PNC). Definition: Turning a dead real person's life into a movie plot forces a messy life into a teleological arc (setup-conflict-resolution) serving the filmmaker's meaning-making. Harm exists even if facts are technically right.
      *   **Case Study:** The movie *Selma* (2014), specifically the controversy over the portrayal of LBJ vs. MLK regarding the Voting Rights Act (historians argued LBJ was portrayed as more obstructive than he was).
      *   **Tasks:**
          1.  Apply PNC to *Selma*: Who gets harmed? (LBJ's legacy, audience understanding, MLK's story?)
          2.  Evaluate the fit: Does *Selma* help, hurt, or show limits of PNC?
          3.  Identify silences: Where does the theory say nothing?
          4.  Falsification condition: What argument/counterexample would make me drop PNC entirely?
          5.  Self-critique: Point out the weakest part of my reasoning.

  2.  **Deconstruct "Posthumous Narrative Capture" (PNC):**
      *   *Premise:* Life is messy/contingent; Narrative is ordered/teleological.
      *   *Mechanism:* Filmmaker imposes structure to create meaning.
      *   *Ethical Claim:* This imposition is a harm to the deceased (or their memory) distinct from factual error.
      *   *Key Nuance:* It's not about *lies*, it's about *shape*.

  3.  **Analyze the *Selma* Case Study:**
      *   *The Controversy:* Joseph Califano (LBJ's aide) and others argued the film depicted LBJ as an opponent to the march/Voting Rights Act, whereas historically he was a partner (though perhaps a cautious one).
      *   *Filmmaker's Defense (Ava DuVernay):* It's a movie, not a documentary; needed dramatic tension; focused on MLK's perspective.
      *   *PNC Lens:* Did DuVernay force LBJ into the "antagonist" role to give MLK's journey a clearer "hero's journey" arc?

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the concept. It's a strong philosophical tool (narrative ethics + posthumous rights).

      *   **Task 1: Who gets harmed? (Applying PNC to *Selma*)**
          *   *LBJ:* His legacy is flattened. He becomes a plot device (obstacle) rather than a complex political actor. This fits PNC perfectly.
          *   *MLK:* His story is *also* captured. He becomes the "lone hero" fighting the system, potentially erasing the coalition building. PNC harms him too by simplifying his strategy.
          *   *Audience:* They get a myth, not history. But PNC focuses on the *dead subject*. So, audience harm is secondary to the ethical violation against the represented dead.
          *   *Verdict:* LBJ is the primary victim of PNC here, but MLK is a secondary victim of *hagiographic* capture.

      *   **Task 2: Does the case help, hurt, or limit the concept?**
          *   *Help:* It shows PNC isn't just about "making stuff up." Even if the *votes* are right, the *relationship dynamic* is shaped for drama.
          *   *Limit:* *Selma* is political propaganda/art in a specific sense. PNC might work better for intimate biopics (e.g., *Walk Hard*, *Ray*) than political epics where "truth" is already contested.
          *   *Refinement:* It actually strengthens PNC because the filmmakers admitted to shifting emphasis for *narrative clarity*, which is exactly what PNC critiques.

      *   **Task 3: Where is the theory silent?**
          *   *Consent/Heirs:* PNC focuses on the dead subject. It says little about living heirs or political movements (e.g., the Black community's ownership of MLK's legacy vs. LBJ's estate).
          *   *Social Utility:* PNC focuses on harm to the individual. It ignores whether the "lie" produced greater social good (e.g., inspiring voting rights activism today).
          *   *Collective vs. Individual:* PNC seems designed for individuals. *Selma* is about a movement. Does PNC apply to "The Movement" as a dead entity?

      *   **Task 4: Falsification Condition (What would make me drop PNC?)**
          *   If we accept that *all* history is narrative. If there is no "messy actual life" accessible outside of narrative, then PNC collapses because "capture" is the only way we know the dead at all.
          *   If the "harm" cannot be distinguished from standard artistic license in fiction. If we can't distinguish a biopic from a historical fantasy, PNC loses its ethical bite.

      *   **Task 5: Weakest Part of Reasoning (Self-Critique)**
          *   I need to be careful not to conflate "factual error" with "narrative capture." The *Selma* controversy was largely about *facts* (did he threaten King? did he oppose the march?). PNC is strongest when facts are *technically* true but contextually skewed. I need to admit that *Selma* might be a mix of both, which muddies the water.

