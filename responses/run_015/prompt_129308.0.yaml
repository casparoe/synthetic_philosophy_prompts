      *   **The Religious:** The relation to the Absolute (God). This is a particular relation that stands *above* the universal.
      *   **Teleological Suspension:** The ethical is not abolished but *suspended* (temporarily held in abeyance) for the sake of a higher *telos* (end/goal), which is the Absolute.
      *   **Infinite Resignation:** Giving up the finite (Isaac) entirely. The knight of resignation accepts the loss and finds peace in the eternal. He does *not* expect to get Isaac back.
      *   **Knight of Faith:** Makes the movement of resignation *plus* a second movement: believing by virtue of the absurd that he will get the finite back *in this life*. He loves Isaac *more* than the ethical father should (because he holds him by faith, not just nature), yet he is willing to kill him.
      *   **The Paradox:** It's not just "God said so, so it's okay." It's that Abraham *cannot explain himself*. If he explains, he enters the universal (language/ethics) and becomes a murderer. He must remain silent. The particular (Abraham) is higher than the universal (Ethics).

