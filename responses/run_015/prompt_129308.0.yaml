      *   *Silence:* Silence is essential because the act cannot be *mediated*. Mediation = Universal. If Abraham explains, he mediates. He becomes a tragic hero (like Agamemnon) if he can explain it for a higher social good. He is a knight of faith because he *cannot* explain it.

