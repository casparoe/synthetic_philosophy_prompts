prompt: |-
  I'm a software engineer with no philosophy background (my last formal contact with any of this was a statistics course years ago), and I own the estimation process for my team of eight. Every two weeks we commit to sprint-sized work, and twice a year leadership asks us for multi-quarter numbers that end up in customer-facing commitments. Our track record is bad in a consistent direction: we hit the two-to-three-sprint items roughly on time but blow well past the multi-quarter ones, and I've been asked to fix this. A friend pointed me at the planning fallacy and at "reference class forecasting" as the standard remedy: stop reasoning from the inside of this particular project ("the schema is 80% mapped, the only tricky part is the cutover") and instead ask how long projects *like this one* have actually taken, then adjust from there.

  I like the idea, but when I tried to run it I hit what I assume is a well-known wall: the forecast depends entirely on which "projects like this one" you average over. Our upcoming ingestion rewrite belongs to the class of all rewrites we've done (n=4, overran badly), the class of projects touching the payments vendor (n=9, mixed), the class of projects led by this particular tech lead (n=11, mostly on time), and the class of projects started during quarters when we were also on-call-heavy (n=7, catastrophic). Nothing in the method tells me which average to trust, and narrower classes seem more relevant but have fewer members and noisier averages. My teammate says this makes the whole thing circular: the mechanical procedure that was supposed to remove judgment just relocates it, because I pick the class with the same gut that produced the bad estimates in the first place. He adds a second objection — our data is survivorship-biased, since the only past projects we have completion times for are ones that shipped, and the two we know of that got cancelled mid-flight never generated a number at all, so even the averages we can compute are drawn from a filtered class.

  Please turn what philosophy and statistics actually know about this — the reference class problem proper, not just "use the outside view" — into a procedure my team can run in about twenty minutes per estimate at planning, with no statistician and nothing fancier than a spreadsheet over our Jira export. I need the questions to ask in order, what counts as a sufficient answer at each step, where the procedure outputs a number, and where it should stop and explicitly hand the decision to a person because the remaining question is one of judgment or values rather than facts. It has to handle at least these cases: a class with only three or four members; a genuinely first-of-a-kind project where no class has any obvious claim; and a project that differs from its natural class in one known, directional way (we've used this exact vendor before, but never with this much existing load on the system). Then run the procedure on three estimates we actually face: the ingestion rewrite described above; a two-sprint refactor of our notification service, where the class data says these run about 60% over but the assigned engineer has produced a detailed task-level breakdown showing it fits comfortably; and a greenfield internal tool the sponsoring VP wants scoped by Friday. I expect the procedure to give at least one answer I won't like — please don't sand it down to keep me comfortable — and please be explicit about what the procedure fundamentally cannot do, including whether my teammate's circularity charge is ultimately right or whether there's a principled (if imperfect) response to it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer, team lead (owns estimation), no philosophy background, last stats course years ago. Practical, results-oriented.
      *   **Problem:** Consistent underestimation on long-term (multi-quarter) projects, accurate on short-term (2-3 sprint) projects. Leadership wants better long-term numbers.
      *   **Proposed Solution:** Reference Class Forecasting (RCF) / Outside View.
      *   **Obstacles Identified by User:**
          *   *The Reference Class Problem:* Which class to choose? (Rewrites vs. Vendor vs. Lead vs. Load). Narrower = more relevant but noisier (small $n$). Wider = more data but less relevant.
          *   *Circularity Objection:* Choosing the class requires judgment, which is the same judgment that caused the bad estimates initially.
          *   *Survivorship Bias:* Data only exists for shipped projects, not cancelled ones (which might have been infinite time or huge cost).
      *   **Requirements:**
          *   Turn philosophy/stats knowledge into a 20-minute procedure.
          *   No statistician, just a spreadsheet + Jira export.
          *   Must handle: Small $n$ (3-4), First-of-a-kind (no class), Known directional difference (vendor + load).
          *   Must run on three specific cases: Ingestion Rewrite, Notification Refactor, Greenfield Tool.
          *   Must give at least one uncomfortable answer.
          *   Must explicitly state limitations and address the circularity charge.

  2.  **Deconstruct the Philosophy & Statistics:**
      *   *The Reference Class Problem (Reichenbach):* There is no single "true" class. Any event belongs to infinite classes. The choice is pragmatic, not logical.
      *   *Kahneman & Tversky (Planning Fallacy):* The "Inside View" (specific details) leads to optimism. The "Outside View" (statistics of similar cases) corrects this.
      *   *Tegmark/Good Judgment:* Aggregating multiple reference classes is better than picking one.
      *   *Survivorship Bias:* Need to account for "kill rate" or treat cancelled projects as censored data (though in software, cancelled often means "infinite cost" or "opportunity cost").
      *   *Bayesian Updating:* Start with the base rate (class average), then adjust for specific evidence (Inside View), but penalize the adjustment for uncertainty.
      *   *The Circularity Charge:* It is *partially* true. You need judgment to pick the class. However, the procedure constrains the judgment. It forces you to justify the class choice against data, rather than just gut-feeling a number. It moves the bias from "optimism about tasks" to "selection of history," which is easier to audit.

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**
      *   *Goal:* Structure the judgment, not eliminate it.
      *   *Step 1: Define Candidate Classes.* Don't pick one yet. List 3.
      *   *Step 2: Data Sanity Check.* Check $n$, check survivorship (did anything die?).
      *   *Step 3: Calculate Base Rates.* Mean/Median of duration/overrun.
      *   *Step 4: Relevance Scoring.* How similar is *this* project to the class? (1-5 scale).
      *   *Step 5: The "Inside View" Adjustment.* Allow the engineer's breakdown to modify the number, but cap the modification based on uncertainty.
      *   *Step 6: The "Kill Switch".* If data is too thin or contradictory, flag for leadership risk buffer.

      *Refining the Procedure for the User's constraints:*
      *   Needs to be spreadsheet-friendly.
      *   Needs to handle small $n$.
      *   Needs to address the circularity.
      *   *Key Insight:* Use a *weighted average of classes* rather than picking one. This mitigates the "which class?" problem.
      *   *Key Insight:* Explicitly account for the "Cancelled" projects by adding a risk multiplier if the kill rate is unknown/high.
      *   *Key Insight:* The "Inside View" (task breakdown) is allowed to *reduce* the estimate only if specific risk-mitigation evidence exists, otherwise it is ignored for long-term forecasts.

  4.  **Addressing the Specific Cases:**
      *   *Ingestion Rewrite:* Classes: Rewrites (n=4, bad), Vendor (n=9, mixed), Load (n=7, catastrophic).
          *   *Expected Outcome:* The data will scream "danger." The estimate must go up significantly.
      *   *Notification Refactor:* Class: Refactors (60% over). Inside View: Engineer says "easy."
          *   *Expected Outcome:* This is the "uncomfortable answer." The procedure should prioritize the historical base rate over the optimistic task breakdown for anything > 1 sprint. The engineer's breakdown is the Planning Fallacy in action.
      *   *Greenfield Tool:* No class.
          *   *Expected Outcome:* Procedure must admit failure and default to a heuristic (e.g., "Double the inside view" or "Use industry standard failure rates").

  5.  **Addressing the Circularity & Limitations:**
      *   Is the teammate right? Yes, but it's a *necessary* circularity. You can't remove judgment; you can only make it explicit. The procedure makes the judgment *auditable* (Why did you weight 'Vendor' higher than 'Rewrites'?").
      *   Limitations: Cannot predict black swans. Cannot fix broken incentives (if leadership punishes honest estimates). Cannot account for cancelled projects perfectly without knowing *why* they were cancelled.

  6.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the teammate's concern but offer the nuanced resolution.
      *   **The Procedure (The "Reference Class Triangulation"):**
          *   Step 1: Cast the Net (3 classes).
          *   Step 2: The Survivorship Audit (Ask about dead projects).
          *   Step 3: The Base Rate Calculation (Median, not Mean).
          *   Step 4: The Relevance Weighting (Simple scoring).
          *   Step 5: The Inside View Discount (Penalize optimism).
          *   Step 6: The Handoff (Where humans decide).
      *   **Running the Cases:**
          *   *Ingestion:* Show the math. High overrun probability.
          *   *Refactor:* Show the conflict. Enforce the Outside View. (This is the uncomfortable part).
          *   *Greenfield:* Show the fallback.
      *   **The Philosophical Verdict:** Address the circularity directly.
      *   **What This Cannot Do:** Incentive structures, Black Swans, Precision illusion.

  7.  **Refining the "Uncomfortable Answer":**
      *   For the Notification Refactor, the engineer has a *detailed task breakdown*. Standard agile advice says "trust the breakdown." RCF says "trust the history."
      *   *Decision:* For multi-quarter or even multi-sprint work, history beats breakdown. Breakdowns suffer from "unknown unknowns." History includes the unknown unknowns of the past. I will instruct the user to discount the breakdown unless it includes *new* risk mitigation (e.g., "We are using a new tool that eliminates the usual bottleneck"). If it's just "I broke it down," that's the Planning Fallacy. I need to be firm here.

  8.  **Refining the "Small N" Problem:**
      *   If $n < 5$, the variance is too high. The procedure must widen the confidence interval or merge classes. I'll add a rule: If $n < 5$, merge with the next broadest class or apply a "Small Sample Penalty" (add 20% buffer).

  9.  **Refining the "Survivorship Bias":**
      *   How to handle cancelled projects in a spreadsheet?
      *   Simple heuristic: If a project was cancelled due to complexity/time, treat its "duration" as the time spent + the *average duration of completed projects* (conservative estimate of remaining work) OR simply add a "Cancellation Risk %" to the final estimate. Let's go with a "Risk Multiplier." If >20% of similar projects died, multiply final estimate by 1.2.

  10. **Final Review against Constraints:**
      *   20 mins? Yes, steps are streamlined.
      *   Spreadsheet? Yes, simple formulas.
      *   No statistician? Yes, using Medians and simple weights.
      *   Address circularity? Yes, in the conclusion.
      *   Three cases run? Yes.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Let them average the classes.
      *   *Correction:* No, let them *weight* the classes based on relevance. Averaging implies equal importance.
      *   *Initial thought:* Tell them to ignore the Inside View completely.
      *   *Correction:* Too radical. Engineers will rebel. Allow Inside View to adjust *down* only with specific evidence, otherwise it adjusts *up* or stays neutral. Actually, Kahneman suggests the Outside View should be the anchor, and Inside View adjusts it. I will set the Outside View as the *baseline* and allow Inside View to modify it only if specific *risk reducers* are present, not just task breakdowns.
      *   *Tone:* Professional, direct, empathetic to the engineering mindset but firm on the stats.

  12. **Final Polish:** Ensure the distinction between "Estimation" (prediction) and "Commitment" (promise) is clear. The procedure produces a prediction; leadership decides the commitment.

  *(Self-Correction on the Circularity Charge)*: I need to be careful not to dismiss the teammate. The teammate is philosophically correct (Reichenbach). The practical solution isn't that the circularity is false, but that *constrained* judgment is better than *unconstrained* judgment. I will articulate this clearly.

  *(Self-Correction on the Refactor Case)*: The prompt says "Notification service... class data says 60% over... engineer says fits comfortably." If I tell the user to ignore the engineer, they might lose trust. I need to explain *why* the history wins. The history includes integration hell, QA bottlenecks, and context switching. The task breakdown usually only covers coding time. I will make this distinction explicit.

