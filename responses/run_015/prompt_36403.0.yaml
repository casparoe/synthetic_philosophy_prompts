answer: |-
  This is a sophisticated problem that cuts to the core of epistemology (how we know what we know) and decision theory. Your teammate is channeling Hans Reichenbach, who formulated the **Reference Class Problem** in 1949: *Any individual event belongs to infinite classes, and different classes yield different probabilities.*

  Your teammate is right that the choice of class is subjective. However, they are wrong that this makes the procedure useless. The goal of Reference Class Forecasting (RCF) is not to eliminate judgment, but to **make the judgment auditable.** When you guess a number from the "Inside View," your bias is hidden in the math of the task breakdown. When you use RCF, your bias is exposed in the choice of the class, which can be challenged.

  Here is the **Reference Class Triangulation Protocol**. It is designed for a spreadsheet, takes ~20 minutes, and forces the specific trade-offs you described into the open.

  ### Part 1: The Protocol (20 Minutes)

  Do not try to find the "perfect" class. Find three *candidate* classes and triangulate.

  **Step 1: Cast the Net (3 Minutes)**
  Identify three reference classes for the project. You must select them using this hierarchy to prevent cherry-picking:
  1.  **Technical Class:** (e.g., "Database Rewrites," "Vendor Integrations")
  2.  **Contextual Class:** (e.g., "Projects during On-Call Heavy Quarters," "Projects with this Team Composition")
  3.  **Organizational Class:** (e.g., "All Q3/Q4 Initiatives," "All VP-Sponsored Projects")

  *Constraint:* You cannot use fewer than three. If you struggle to find a third, use "All Engineering Projects > 1 Quarter."

  **Step 2: The Survivorship Audit (3 Minutes)**
  For each class, look at your Jira/History data.
  *   **Count ($n$):** How many projects?
  *   **Kill Rate:** How many were cancelled or descoped significantly before completion?
  *   **Rule:** If Kill Rate > 20%, mark this class as **High Risk**.
  *   **Rule:** If $n < 5$, mark this class as **Low Confidence**.

  **Step 3: Calculate Base Rates (5 Minutes)**
  For each class, calculate the **Median** Overrun Percentage.
  *   *Formula:* `(Actual Duration - Estimated Duration) / Estimated Duration`
  *   *Why Median?* Means are skewed by one catastrophic project. Medians represent the "typical" experience.
  *   *Handling Cancelled Projects:* If a project was cancelled due to complexity, count its overrun as **100%** (i.e., it took double the time before dying) or exclude it and apply the "High Risk" flag from Step 2. *Recommendation:* Exclude from math, keep the High Risk flag.

  **Step 4: Relevance Weighting (4 Minutes)**
  You cannot treat all classes equally. Assign a weight (0.5 to 1.5) to each class based on similarity to the *current* project.
  *   **1.0:** Standard similarity.
  *   **1.5:** Extremely high similarity (e.g., same vendor, same lead, same codebase).
  *   **0.5:** Weak similarity (e.g., same quarter, but different tech stack).
  *   *Constraint:* The sum of weights must equal 3.0 (forcing you to trade off).

  **Step 5: The Triangulated Baseline (2 Minutes)**
  Calculate the **Weighted Median Overrun**.
  *   *Spreadsheet:* `(Class1_Median * Weight1 + Class2_Median * Weight2 + Class3_Median * Weight3) / 3`
  *   This is your **Outside View Estimate**.

  **Step 6: The Inside View Adjustment (3 Minutes)**
  Now, and only now, look at the engineer's task breakdown.
  *   **Default:** The Outside View Estimate is the final number.
  *   **Adjustment Down:** You may reduce the estimate *only if* the breakdown identifies a specific risk present in the historical class that is *absent* here (e.g., "Historical rewrites failed due to data migration; we are not migrating data").
  *   **Adjustment Up:** You must increase the estimate if there is a known directional difference adding load (e.g., "Higher system load than previous vendor projects").
  *   **Cap:** You cannot adjust the final number by more than **20%** from the Triangulated Baseline. This caps the optimism bias.

  **Step 7: The Handoff**
  *   **If Low Confidence ($n < 5$ for all classes):** The procedure stops. Output is "Insufficient Data." Decision hands to Leadership to accept high variance or fund a discovery spike.
  *   **If High Risk (Kill Rate > 20%):** Output includes a mandatory "Contingency Buffer" equal to the Kill Rate percentage.
  *   **Final Output:** A range (Baseline ± 20%), not a single number.

  ---

  ### Part 2: Running the Protocol on Your Cases

  Here is how the protocol executes on your three scenarios. I have not softened the results.

  #### Case 1: The Ingestion Rewrite
  *   **Classes:**
      1.  *Rewrites (n=4):* Median Overrun +80%. (Low Confidence).
      2.  *Vendor Projects (n=9):* Median Overrun +40%.
      3.  *On-Call Heavy Quarters (n=7):* Median Overrun +120%. (High Risk).
  *   **Weighting:**
      1.  Rewrites: 1.2 (It is a rewrite).
      2.  Vendor: 1.0 (Same vendor).
      3.  On-Call: 0.8 (We are on-call heavy now).
      *Sum = 3.0.*
  *   **Triangulated Baseline:** `(80*1.2 + 40*1.0 + 120*0.8) / 3` = **+77% Overrun.**
  *   **Inside View Adjustment:** You noted "higher load than previous vendor projects." This is a directional risk.
      *   *Adjustment:* +10%.
      *   *Total Overrun:* +87%.
  *   **Result:** If the "Inside View" estimate was 6 months, the protocol outputs **11.2 months**.
  *   **Comfort Check:** You won't like this. It contradicts the "schema is 80% mapped" optimism. But the data shows that when *your team* does rewrites *under load*, they almost triple in duration.

  #### Case 2: Notification Service Refactor
  *   **Classes:**
      1.  *Refactors (n=15):* Median Overrun +60%.
      2.  *Service Team Projects (n=10):* Median Overrun +30%.
      3.  *Lead X Projects (n=11):* Median Overrun +5%.
  *   **Weighting:**
      1.  Refactors: 1.5 (It is literally a refactor).
      2.  Service Team: 1.0.
      3.  Lead X: 0.5 (Lead is relevant, but task type dominates).
  *   **Triangulated Baseline:** `(60*1.5 + 30*1.0 + 5*0.5) / 3` = **+40% Overrun.**
  *   **Inside View Adjustment:** Engineer has a detailed breakdown showing it fits comfortably.
      *   *Protocol Check:* Does the breakdown identify a risk present in historical refactors that is *absent* here?
      *   *Answer:* No. It just breaks down the tasks. Historical refactors also had task breakdowns. The overrun usually comes from integration, regression testing, and unforeseen dependencies, which task breakdowns miss.
      *   *Adjustment:* **0%**. (You are forbidden from adjusting down without specific risk mitigation evidence).
  *   **Result:** If the engineer says 4 sprints, the protocol outputs **5.6 sprints**.
  *   **Comfort Check:** This will cause friction with the engineer. They feel micromanaged. You must explain: "Your breakdown accounts for coding time. The history accounts for the world interfering with coding time."

  #### Case 3: Greenfield Internal Tool (VP Request)
  *   **Classes:**
      1.  *Greenfield Tools (n=2):* **Low Confidence.**
      2.  *VP-Sponsored Projects (n=20):* Median Overrun +50%.
      3.  *Internal Tools (n=5):* Median Overrun +90% (Scope creep is high).
  *   **Triangulated Baseline:** `(N/A + 50*1.0 + 90*1.0) / 2` = **+70% Overrun.** (Note: Class 1 excluded due to $n < 5$).
  *   **Handoff:** Because one class was Low Confidence and the other two are broad, the procedure flags this as **High Variance**.
  *   **Result:** Output is not a date. Output is: *"Historical data for this class suggests a 70% overrun with high variance. Recommendation: Fund a 2-week Discovery Spike to generate a Class 1 data point, then re-run protocol."*
  *   **Comfort Check:** The VP wants a number by Friday. The protocol tells you giving a number is professionally negligent. You must present the *process* to the VP, not just the number.

  ---

  ### Part 3: The Philosophical Verdict

  #### Is your teammate right about circularity?
  **Yes, but it is a productive circularity.**
  Reichenbach proved there is no logical algorithm to select the "true" reference class. Your choice of weights in Step 4 is indeed judgment. However, there is a massive difference between:
  1.  **Unconstrained Judgment:** "I feel like this will take 3 months." (Bias: Optimism, anchoring, wishful thinking).
  2.  **Constrained Judgment:** "I am weighting the 'Rewrite' class higher than the 'Lead' class because technical debt historically dominates personnel skill in our data." (Bias: Explicit, auditable, debatable).

  The procedure does not remove the need for wisdom; it removes the ability to hide the lack of it. It forces you to argue about *which history matters*, rather than arguing about *whether the future will be magical*.

  #### What this procedure fundamentally cannot do
  1.  **It cannot fix incentive structures.** If leadership fires teams who deliver "11 months" instead of "6 months," the team will learn to game the weights in Step 4. The procedure requires psychological safety to function.
  2.  **It cannot predict Black Swans.** If a new vendor API changes fundamentally, the "Vendor Projects" class is no longer relevant. The protocol assumes the future is statistically similar to the past.
  3.  **It cannot handle "Strategic Cancellations."** Survivorship bias is tricky. If you cancel a project because it *would have* taken 3 years, your data treats it as a 3-month project that died. This makes your team look faster than they are. You must manually adjust the "Kill Rate" flag if you suspect projects are being killed to hide slippage.
  4.  **It cannot replace the "Discovery Spike."** For Case 3 (Greenfield), the protocol correctly identifies that estimation is impossible. No amount of philosophy can conjure data that does not exist.

  ### Implementation Advice
  When you present this to leadership:
  1.  **Show the Spreadsheet:** Make the weights visible.
  2.  **Own the Discomfort:** Explicitly state, "The data suggests the Notification Refactor will take 40% longer than engineering claims. We are committing to the data, not the hope."
  3.  **Define "Commitment":** A forecast is a probability distribution. A commitment is a promise. Use the protocol to generate the forecast. Let leadership decide where on that distribution they want to make the commitment (e.g., "We commit to the 80% confidence interval, which is 12 months").

  Your teammate's objection is the sound of a philosopher noticing the cracks in the foundation. Your job as an engineer is to build a bridge across those cracks that still holds traffic. This protocol is that bridge. It is imperfect, but it is far more robust than the "Inside View" that has been failing you.
