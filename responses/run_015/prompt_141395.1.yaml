answer: |-
  The regulatory landscape you describe is not a coherent application of a single cognitive theory. It is a patchwork where a **Skinnerian floor** (pain avoidance) is legally mandatory, a **Popperian ceiling** (enrichment to prevent psychological suffering) is applied selectively, and **phylogenetic bias** (vertebrate vs. invertebrate, pet vs. livestock) overrides the cognitive assessment entirely.

  Here is the reconstruction of the implicit theory of mind behind current practice, mapped onto Dennett's ladder.

  ### 1. The Strict Presupposition vs. The Good Fit
  The practice **strictly presupposes the Skinnerian rung** as the baseline for legal standing. The fundamental trigger for welfare regulation is the capacity to suffer via nociception and reinforcement. If a creature cannot be punished by pain or rewarded by relief, the law generally grants it no status (hence the fruit fly). This is why anesthesia is required for procedures on mice and monkeys alike; the system assumes a Skinnerian sensitivity to negative reinforcement.

  However, the requirement for **enrichment** (toys, puzzles, social contact) strictly presupposes the **Popperian rung**. You do not enrich a Skinnerian creature; you merely optimize its reinforcement schedule. Enrichment is only coherent if the animal generates internal models of "what could be happening" and suffers when the environment fails to match those models. A Skinnerian organism in a barren cage simply exhibits extinction (stops responding); a Popperian organism exhibits frustration or depression (suffers the mismatch).

  The **Gregorian rung** merely **fits nicely** with the rules for primates and cetaceans but is rarely strictly required. Regulations mandate "social housing," which *could* be satisfied by Skinnerian needs (safety/warmth), but the justification often appeals to Gregorian needs (culture, language, tradition). The law treats Gregorian capacities as a luxury good: if the animal is charismatic enough (chimp), we acknowledge its culture; if it is economically useful (pig), we ignore the same capacity.

  ### 2. The Line: Design vs. Performance
  You are correct that "can learn" is not the line, as fruit flies learn (Skinnerian). The line the practice *attempts* to draw is **"can simulate."** The cutoff is Popperian.

  However, your worry about design vs. performance is the central failure of the system.
  *   **Current Practice:** Uses **phylogeny as a proxy for design.** It assumes that because a monkey is a primate, it is *designed* as a Popperian agent, regardless of its environment. It assumes a pig is *designed* as a meat-unit, despite evidence of Popperian design.
  *   **The Failure:** A Popperian agent raised in a Skinnerian box (barren cage) will indeed perform like a Skinnerian agent. By the time the animal shows stereotypies (pacing, self-harm), the damage is done. The regulations protect the *potential* for Popperian behavior based on species membership, not the *display* of it.
  *   **To Stop Doing That:** The system would need to shift from **species-based rules** to **capacity-based testing.** To stop protecting the rung an animal is *displaying* and start protecting the rung it *is*, regulators would need to test for counterfactual planning (e.g., can the animal plan for a future need it doesn't currently feel?). If a pig passes, it gets monkey protocols. Currently, economics prevents this test from being applied to livestock.

  ### 3. Boredom and Cultural Deprivation
  **Is boredom Popperian?** Yes. Boredom is the specific suffering of a predictive model running ahead of sensory input. A Skinnerian creature seeks stimulation to gain reward; a Popperian creature seeks stimulation to *resolve uncertainty* in its model. When the world offers no variables to manipulate, the Popperian agent's simulation engine idles, generating friction we call boredom. Enrichment is fuel for the simulator.

  **Is Gregorian deprivation a category mistake?** No, it is a coherent welfare claim, but it requires a specific view of the mind. If a creature is Gregorian, its cognitive hardware expects cultural software. A parrot raised alone is not just lonely (Skinnerian social isolation); it is **cognitively malformed**. It lacks the heuristics, vocalizations, and problem-solving tools transmitted by its group.
  *   **The Harm:** It is not that the parrot "misses a tradition it never had" in a nostalgic sense. It is that the *development of its Popperian capacities* depends on Gregorian input. Without the culture, the internal simulator cannot calibrate. The harm is functional impairment, not just emotional sadness. Current zoo rules (social housing) implicitly acknowledge this, but lab rules often treat birds as interchangeable units, ignoring the Gregorian necessity.

  ### 4. The Vertebrate Gradient and Underdetermination
  The gradient is largely **"vertebrate, probably sentient" wearing Popperian clothes.** The system assumes that complex nervous systems (vertebrates) imply Popperian minds, while simpler ones (invertebrates) do not, until an octopus forces a re-evaluation.

  **Philosophically Underdetermined Rules (Multiple theories license the same rule):**
  1.  **Social Housing:** A Skinnerian theory licenses this (safety in numbers reduces stress hormones). A Gregorian theory licenses this (need for cultural transmission). The rule is the same, the justification differs.
  2.  **Anesthesia:** A Skinnerian theory requires this (pain is a negative reinforcer). A Popperian theory requires this (pain violates future expectations and induces terror). The drug dosage is the same.
  3.  **Euthanasia:** Physical destruction works for Darwinian/Skinnerian. Chemical sedation is preferred for Popperian (to prevent fear). Current rules often allow the former for livestock and require the latter for pets, despite similar cognitive capacities.

  **Where Theories Diverge (The Crucial Test):**
  The divergence point is **Deception and False Belief.**
  *   **Skinnerian Rule:** Deception is fine as long as reinforcement is managed. You can trick the animal if it learns the new contingency.
  *   **Popperian/Gregorian Rule:** Deception causes specific harm by corrupting the internal model. If an animal forms a valid prediction and the world systematically falsifies it without recourse (learned helplessness), a Popperian account forbids this as psychological torture, even if no physical pain occurs.
  *   **Current Practice:** We routinely deceive lab animals (mazes with no reward, false cues) to test cognition. This proves we do not *actually* treat them as full Popperian agents legally, despite the enrichment rules. We treat them as Skinnerian agents with complex wiring.

  ### 5. If the Gregorian Rung Carries Weight
  If we strictly enforce the Gregorian rung (that some animals require cultural transmission to function), the following concrete changes are necessary:

  1.  **Single Housing Bans:** For Gregorian species (primates, cetaceans, corvids, parrots), isolation is not just "unenriched"; it is **developmental mutilation.** Single housing must be banned entirely, not just "discouraged."
  2.  **Farmed Animal Restructuring:** Pigs and cows show Gregorian traits (social learning, tradition). Factory farming, which disrupts cultural transmission (mixing strangers, separating mothers/young), becomes a violation of their cognitive design. They would need stable social groups, not just more space.
  3.  **Killing Enriched Animals:** If an animal is Gregorian, it holds "tools" (knowledge) valuable to its group. Killing an elder in a Gregorian species harms the *survivors* by deleting cultural data. Euthanasia protocols would need to weigh the loss of cultural knowledge, potentially prioritizing the preservation of the group's heuristic library over the individual's life span, or conversely, protecting elders as knowledge repositories.
  4.  **Wild Capture:** Removing a Gregorian animal from its wild group is a double harm: physical removal + cultural lobotomy. Import/export rules would need to treat this differently than removing a Darwinian/Skinnerian specimen.

  **Summary:** The current system pretends to be Popperian (enrichment) but operates on Skinnerian mechanics (reinforcement/pain) with a Darwinian bias (species hierarchy). To align with the reality of animal minds, it must admit that **boredom is a Popperian injury** and **isolation is a Gregorian injury**, and apply those standards to pigs as rigorously as to monkeys.
