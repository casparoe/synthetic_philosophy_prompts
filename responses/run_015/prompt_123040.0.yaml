  hi, i help run my schools peer tutoring thing (like 25 of us, we sit with people while they do hw — algebra, essays, intro coding, spanish, lab writeups) and we keep having the same dumb argument: do you judge the thing someone hands in at the end, or the process they went through to get there. I want to settle it as a ranking instead of an argument.

  heres the list of stuff we actually see: solving a quadratic equation; long division with big numbers; debugging a short python program that should print the first ten prime numbers; writing a five paragraph persuasive essay; coming up with your own research question for a history project; translating a paragraph of english into spanish; writing the conclusion section of a lab report from your data; fixing the grammar in someone elses paragraph; explaining in your own words why the sky is blue.

  I invented two words and I want you to use them when you rank. checkable = how easy it is for someone who barely knows the subject to tell a correct final answer from a wrong one. fakeable = how easy it is to produce something that looks correct without the person actually being able to do the task. I think these are two different things and not just the same thing said twice, but tell me if im wrong and or if im missing a third one that matters more.

  so: put the nine tasks in tiers from "just grading the final product is basically fine" to "you learn nothing unless you watch them work," and give each one a number 0–100 for how much you lose by only looking at the final product, with one sentence on why it lands there. then two more things: is there any task where the answer flips depending on whos checking (a tutor who has worked with this student for months vs someone seeing them for the first time), and is there anything on the list where watching the process is ALSO pretty useless. dont give me any sources or citations, i just want the reasoning. thx
