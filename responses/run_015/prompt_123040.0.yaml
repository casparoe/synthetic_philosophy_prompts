answer: |-
  You are right that `checkable` and `fakeable` are distinct. A multiple-choice test is highly `checkable` (answer key) but highly `fakeable` (guessing). A creative story is low `checkable` (subjective) but low `fakeable` (hard to mimic voice). You aren't missing a critical third term, though "reproducibility" (can they do it again on a new problem?) is the underlying goal both words try to measure.

  Here is the ranking from "final product is mostly enough" to "process is everything," scored by how much information you lose by ignoring the process.

  ### Tier 1: The Product Tells You Most of What You Need
  **1. Long division with big numbers (Loss: 10)**
  Because the algorithm is rigid and the answer is highly `checkable` by multiplying back, a correct final number almost guarantees the process was followed.

  **2. Solving a quadratic equation (Loss: 20)**
  While the answer is highly `checkable`, there are multiple methods to solve it, so ignoring the process hides which tool the student actually learned.

  **3. Fixing the grammar in someone else's paragraph (Loss: 30)**
  Grammar rules are objective enough to be `checkable`, but a student can `fakeable` fix specific errors without understanding the underlying rule governing them.

  ### Tier 2: The Product is Ambiguous or Easily Mimicked
  **4. Debugging a short python program that should print the first ten prime numbers (Loss: 55)**
  The code running successfully is highly `checkable`, but it is highly `fakeable` because a student can copy a fix without understanding why the bug existed.

  **5. Explaining in your own words why the sky is blue (Loss: 65)**
  A student can `fakeable` memorize keywords like "Rayleigh scattering" without understanding the physics, and a novice tutor cannot easily `checkable` verify the depth of that understanding.

  **6. Writing the conclusion section of a lab report from your data (Loss: 75)**
  It is easy to `fakeable` write vague science-sounding sentences that look correct, and a peer tutor often lacks the expertise to `checkable` verify if the interpretation matches the data.

  ### Tier 3: The Product is Nearly Useless Without Context
  **7. Translating a paragraph of english into spanish (Loss: 80)**
  Translation tools make this extremely `fakeable` for a learner, and since the tutor barely knows the subject, the final text is not easily `checkable` without external aids.

  **8. Writing a five paragraph persuasive essay (Loss: 90)**
  AI and templates make the final draft highly `fakeable`, and because quality is subjective, it is rarely `checkable` by a peer tutor whether the argument construction was learned.

  **9. Coming up with your own research question for a history project (Loss: 98)**
  The final question looks simple but is impossible to `checkable` grade for quality, and it is highly `fakeable` to pick a generic topic without doing the actual cognitive work of narrowing a scope.

  ***

  **Does the answer flip depending on who is checking?**
  Yes, specifically for the Tier 3 tasks. A tutor who has worked with a student for months knows their baseline voice and skill level, which drastically lowers the `fakeable` score because they can spot when a student suddenly produces work beyond their usual capability.

  **Is there anything where watching the process is ALSO pretty useless?**
  Long division is the closest candidate; if the final answer is correct, watching them carry the one adds almost no value because the skill is purely algorithmic execution rather than conceptual reasoning.
