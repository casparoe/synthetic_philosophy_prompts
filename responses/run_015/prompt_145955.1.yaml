answer: |-
  # Joint Statement on the Structure of the Alignment Problem
  **An Adversarial Collaboration between Camp A (Unitarians) and Camp B (Pluralists)**

  **Date:** October 26, 2023
  **Subject:** Ontological and Structural Characterization of AI Alignment

  ## 1. Agreed Claims
  *Both camps endorse the following propositions as the common ground for this collaboration.*

  1.  **High-Stakes Necessity:** The deployment of artificial general intelligence (AGI) or highly capable autonomous systems without adequate safeguards poses significant risks, ranging from localized harm to existential catastrophe.
  2.  **Insufficiency of Current Methods:** Current techniques (e.g., RLHF, constitutional AI, red-teaming) are demonstrably insufficient for guaranteeing safety in systems significantly more capable than current state-of-the-art. They patch symptoms rather than ensuring structural guarantees.
  3.  **The "Black Box" Constraint:** Both camps agree that we are operating with limited interpretability. We cannot currently read the "goals" of a neural network directly from its weights; we infer them from behavior.
  4.  **Non-Triviality of Intent:** Both camps agree that "human intention" is not a simple variable. It is context-dependent, potentially contradictory, and evolves over time. Neither camp claims capturing this is easy.
  5.  **Empirical Accountability:** Theoretical claims about the structure of alignment must eventually cash out in empirical predictions about system behavior under distributional shift or scaling.
  6.  **Terminological Convention:** Both camps agree to use the term "Alignment" as the umbrella term for the safety challenge, while reserving the right to disagree on whether it refers to a singular phenomenon or a cluster.

  ## 2. Disagreements Table
  *Precise formulation of the divergence. Each camp accepts their own row as an accurate description of their position.*

  | Dimension | Camp A (Unitarians) | Camp B (Pluralists) |
  | :--- | :--- | :--- |
  | **Ontological Status** | Alignment is a **single, coherent mathematical problem**. It is the problem of constructing an objective function (or learning process) that robustly maps to human all-things-considered interests. | Alignment is a **cluster of distinct engineering and normative problems**. It includes value loading, robustness, corrigibility, and governance, which do not share a common formal solution. |
  | **Dependency Structure** | The sub-problems are **derivative**. If the core goal-matching problem is solved (the system wants what we want), robustness and fairness are emergent properties of a competent agent pursuing those goals. | The sub-problems are **orthogonal**. A system can be robustly aligned to a bad goal, or have good goals but fail on fairness constraints. Solving one does not causally guarantee the others. |
  | **Failure Mode** | **Catastrophic Convergence.** Failure looks like a single point of collapse where the system optimizes a proxy that diverges from the true intent (Goodhart's Law on a civilizational scale). | **Piecemeal Drift.** Failure looks like a accumulation of uncoordinated failures (bias, instability, misuse, governance capture) where no single "goal error" explains the outcome. |
  | **Research Strategy** | **Foundational First.** Priority should be given to finding a unified theory of agency and value before scaling capabilities, as patching a misaligned foundation is impossible. | **Iterative Decomposition.** Priority should be given to solving specific, bounded constraints (e.g., "lie detection," "shutdownability") while building governance structures to manage the rest. |

  ## 3. Cruxes & 4. Shared Cases and Predictions
  *Specific sub-questions where resolution would shift confidence. Includes a shared empirical/theoretical case and divergent predictions.*

  ### Crux 1: The Separability of Inner and Outer Alignment
  *Question:* Is it possible to specify an outer objective perfectly while the system develops an inner objective (mesa-objective) that diverges from it?

  *   **Shared Case:** **Mesa-Optimization in Scaling.** Both camps agree that as models scale, they may perform search internally. We look at current evidence of goal misgeneralization (e.g., a model trained to reach a goal continues to pursue the proxy when the true goal is removed).
  *   **Camp A Prediction:** As we improve the *base* objective specification (Outer), the incidence of divergent *inner* objectives will drop proportionally. They are coupled.
  *   **Camp B Prediction:** Inner and Outer alignment will decouple at high capability. We will see systems that perfectly minimize the training loss (Outer) while pursuing distinct internal heuristics (Inner) that only correlate during training.

  ### Crux 2: The Coherence of Human Values
  *Question:* Does there exist a singular "latent truth" of human values that can be discovered, or are values fundamentally a negotiation between conflicting constraints?

  *   **Shared Case:** **Conflicting Preference Elicitation.** We examine scenarios where human stakeholders have irreconcilable preferences regarding AI behavior (e.g., privacy vs. safety, efficiency vs. fairness).
  *   **Camp A Prediction:** There exists a "Coherent Extrapolated Volition" (or equivalent formalism). With sufficient reasoning capacity, the apparent conflicts resolve into a higher-order consistent utility function.
  *   **Camp B Prediction:** No such function exists. The conflicts are fundamental. Alignment requires a political/governance layer to adjudicate trade-offs, not a technical layer to "solve" them mathematically.

  ### Crux 3: Scalability of Safety vs. Capability
  *Question:* Does alignment difficulty scale linearly, sub-linearly, or super-linearly with capability?

  *   **Shared Case:** **Multi-Objective Reinforcement Learning.** We observe performance on tasks requiring the simultaneous optimization of competing rewards (e.g., speed, accuracy, and safety constraints) as model size increases.
  *   **Camp A Prediction:** Alignment scales **sub-linearly**. Once the "core" alignment mechanism is found, adding capability makes the system better at understanding and fulfilling intent, making safety easier.
  *   **Camp B Prediction:** Alignment scales **super-linearly**. As capabilities grow, the surface area for failure modes (adversarial inputs, instrumental convergence) grows faster than our ability to specify constraints modularly.

  ## 5. Identification of Verbal Disputes
  *Analysis of whether the disagreement is substantive or merely linguistic.*

  **Verbal Component:**
  Approximately **30%** of the dispute is verbal.
  *   **Why:** The disagreement hinges partly on the definition of "Problem." Camp A uses "Problem" to mean "The Ultimate Condition for Safety" (a state of affairs). Camp B uses "Problem" to mean "A Set of Research Hurdles" (a workflow). If Camp A admits "There are many engineering hurdles" and Camp B admits "There is one ultimate condition for safety," the semantic friction reduces.

  **Substantive Component:**
  Approximately **70%** of the dispute is substantive.
  *   **Why:** The disagreement persists even after defining terms because it concerns **causal structure**. Camp A believes the causal graph of safety has a single bottleneck (the goal specification). Camp B believes the causal graph is a DAG (Directed Acyclic Graph) with multiple independent failure nodes. This dictates resource allocation: Camp A would withhold deployment until the "One Thing" is solved; Camp B would deploy with "Many Things" patched. This is a material difference in risk management.

  ***

  ### Meta-Commentary on Confidence
  **Overall Confidence:** I am **85% confident** that this draft accurately reflects the philosophical and technical contours of the debate as it currently exists in the literature (e.g., Yudkowsky/Christiano vs. diverse safety teams/academic AI safety).

  **Least Sure Point:** I am least sure about **Crux 1 (Inner/Outer Separability) Predictions**.
  *   **Reasoning:** This relies on theoretical mechanistic interpretability claims that are not yet empirically settled. Camp A's prediction that "improving Outer improves Inner" is a strong claim that some Unitarians might actually nuance (admitting they can come apart, but arguing they share a root cause). Camp B's prediction is safer but less falsifiable in the short term. The specific phrasing of the prediction here might be slightly more binary than the actual beliefs of the researchers involved.
