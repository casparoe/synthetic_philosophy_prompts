      *   *Refinement on Death:* In medicine, "death" is a *status* we assign. In astrobiology, "life" is a *property* we detect. The asymmetry is that we assign death to something that *was* alive. We detect life in something that *might be* alive. The binary pressure in astrobiology is about *public communication* and *planetary protection*, not organ retrieval.
      *   *Finalizing the "Progress" section:* Progress is a **Conceptual Decoupling**. We need to admit that "Life" in the NASA press release sense and "Life" in the theoretical biology sense are different concepts sharing a label. Progress is realizing we need two terms, or at least two distinct criteria sets.

