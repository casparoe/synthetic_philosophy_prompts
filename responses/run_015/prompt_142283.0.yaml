      *   **(3) Invariance:** Crucial for utility theory. Utilities are ordinal/interval, not ratio. Rejecting this means utilities have absolute meaning, which is philosophically shaky.
      *   **(4) IIA (Independence of Irrelevant Alternatives):** This is the usual suspect. It says if $x$ is chosen from $S$, and $T \subset S$ contains $x$, then $x$ must be chosen from $T$.
