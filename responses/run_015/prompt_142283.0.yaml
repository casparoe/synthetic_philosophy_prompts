          *   *Problem:* In bargaining, the *shape* of the feasible set conveys information about bargaining power. Removing options changes the "threat" landscape or the relative steepness of the Pareto frontier.
      *   **(5) Individual Monotonicity:** If the set of possible outcomes expands in my favor, I shouldn't end up worse off.
