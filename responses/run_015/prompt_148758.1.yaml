      *   **Residue Report:**
          *   Clean Mappings.
          *   Distortions (The "Persistence Bias").
          *   The Leftover (Ontological Privilege vs. Index Pointer).
      *   **Addressing the Core Question:** Does Presentism collapse? Is it sloppiness?
      *   **Conclusion:** Final verdict on the framework's limits.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, check the definition of "Exists".* User said "addressable in a query."
      *   *Presentism:* If I can query the past (even in an audit log), does that make Eternalism true *in the DB*? Yes. So to model Presentism, the DB *must not allow* querying the past.
      *   *Event Sourcing:* ES is inherently Eternalist. The events never change.
      *   *CRUD:* Standard UPDATE/DELETE is more Presentist (the old state is overwritten/gone).
      *   *The "Gone" nuance:* In Presentism, the past isn't just hidden; it's *nothing*. In DBs, if it's not in the table, it's null. But if it was *never* in the table, that's different.
      *   *Key Insight:* A database is a record *of* time, not time itself. This is the fundamental residue.

  9.  **Final Polish:** Ensure terms like "valid_time," "transaction_time," "snapshot isolation," and "tombstones" are used correctly. Make sure the distinction between "ontological existence" and "data availability" is sharp.

