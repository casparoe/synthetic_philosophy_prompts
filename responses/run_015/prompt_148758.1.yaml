  *Correction:* Tombstones imply the record *was* there and is now marked dead. That's still history. True Presentism in DB terms is more like an `UPDATE` that overwrites the bytes physically, or a `VIEW` that denies the history table exists. I need to clarify this distinction. Tombstones are actually Eternalist traces of deletion.

