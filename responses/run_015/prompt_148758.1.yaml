answer: |-
  This is a remarkably robust isomorphism. You have correctly identified that database architecture is essentially applied metaphysics. When you design a schema, you are making ontological commitments about what constitutes an "entity" and what constitutes "change."

  Here is the translation of the positions into your data architecture vocabulary, followed by the residue report.

  ### The Translation Layer

  **1. Eternalism $\rightarrow$ The Immutable Event Log / Bitemporal Table**
  Your intuition is correct. Eternalism is the **Block Universe**, which maps 1:1 to a **bitemporal table** or an **Event Sourced aggregate**.
  *   **Ontology:** The table is the universe. Every row represents a spacetime coordinate (`valid_start`, `valid_end`, `transaction_start`, `transaction_end`).
  *   **Existence:** A fact "exists" if there is a row where `valid_time` encompasses the query parameter.
  *   **The "Now":** There is no privileged `NOW()` function at the storage engine level. `NOW()` is merely a client-side filter applied to the `valid_time` column.
  *   **Change:** Change is an illusion of traversal. Just as moving through space doesn't destroy the space you left, moving through `valid_time` doesn't delete the previous row. The `UPDATE` statement is syntactic sugar for an `INSERT` of a new version and an `UPDATE` of the `valid_end` on the old version.

  **2. Presentism $\rightarrow$ The Non-Temporal State Table (CRUD) with Aggressive GC**
  Presentism is harder to model because databases are inherently archival. To model Presentism, you must treat the database as a **single-state register**.
  *   **Ontology:** Only the current materialized view exists.
  *   **Existence:** A fact "exists" only if it is returned by `SELECT * FROM Table` without an `AS OF` clause.
  *   **The Past:** The past is not "tombstoned." A tombstone is still data (it records *that* something was deleted). True Presentism in DB terms is a physical **overwrite**. When you `UPDATE`, the previous bytes on the disk are overwritten or garbage-collected immediately. They are not addressable, not even by admin queries.
  *   **The Future:** Uncommitted transactions represent the "open future." They do not exist (are not visible under Read Committed isolation) until the commit lock is acquired.

  ---

  ### The Residue Report

  Here is where the mapping holds, where it breaks, and what spills over the edges.

  #### 1. Clean Mappings
  *   **Eternalism $\approx$ Audit Logs/WAL:** The Write-Ahead Log (WAL) is the most eternalist object in computer science. It is immutable, ordered, and contains the complete history of state transitions. If you believe the WAL is the "true" database and the heap files are just caches, you are an Eternalist.
  *   **Presentism $\approx$ Snapshot Isolation:** To a transaction running at `SNAPSHOT` isolation level, only the state consistent with its start time exists. Everything else is invisible noise. This captures the phenomenological experience of Presentism (I only see the now), even if the storage engine is Eternalist underneath.

  #### 2. Distortions Required
  *   **The Persistence Bias:** To make Presentism work in a DB, you have to actively fight the medium. Databases are designed for *persistence* (making things last). Presentism requires *ephemerality* (things ceasing to be). You have to configure your DB to be "lossy" to model Presentism. You must disable versioning, disable backups, and overwrite WAL segments immediately.
  *   **Tombstones vs. Non-Existence:** You asked if the past being "gone" means tombstoned. **No.** In DB terms, a tombstone is Eternalist evidence of a Past event. It says, "Row X existed, then it was killed at T1." Presentism demands that at T2, there is no record that Row X ever existed. To model this, you need `DELETE` without logging, which violates ACID durability. You have to distort the "Durability" guarantee to satisfy Presentist ontology.

  #### 3. The Leftover (The Uncarved Block)
  There is a significant residue that does not map to data architecture: **Ontological Privilege.**

  *   **In Eternalism/DB:** The "Now" is just a pointer. `CURRENT_TIMESTAMP` is a function, not a metaphysical boundary. The database treats `2023-01-01` and `2024-01-01` as identical data types.
  *   **In Presentism/Philosophy:** The "Now" is ontologically privileged. It is the *only* time that has the property of "Reality."
  *   **The Mismatch:** In your DB, you can query `SELECT * FROM Universe WHERE time = '3024-01-01'`. It returns nothing (because the data isn't there yet). You can also query `SELECT * FROM Universe WHERE time = '1924-01-01'`. If you are a Presentist DB, this *also* returns nothing.
      *   **The Problem:** The DB returns nothing for the future because the data hasn't been written. It returns nothing for the past (in a Presentist schema) because the data was overwritten. **The query result is identical, but the reason is different.**
      *   The DB cannot distinguish between "Not yet written" (Future) and "Overwritten/Destroyed" (Past). Both are just `NULL` results to the query engine. Presentism claims the past is *fundamentally different* from the future (the past *was* real, the future *never was*). A boolean `exists` flag in a query result cannot capture "was real but isn't anymore."

  ### The Verdict: Framework Limitation or Philosophical Sloppiness?

  You asked if the leftover means Presentism is saying something your framework can't represent, or if philosophers are being sloppy about "existence."

  **It is a category error in the framework, not sloppiness in the philosophy.**

  Here is why: **Databases model Information, not Reality.**

  1.  **Information is Eternalist by nature:** Once a bit is flipped, a trace exists (thermodynamically, if not logically). To make a database Presentist, you have to expend energy to erase the trace (Landauer's principle). The "Past" in a database is always recoverable unless you physically destroy the disk.
  2.  **The "Gone" Translation:** You asked if the Presentist intuition that the past is "gone" survives translation. **It collapses.**
      *   In DBs: "Gone" = `UNADDRESSABLE`.
      *   In Presentism: "Gone" = `NON-EXISTENT`.
      *   If you cannot address it, it is functionally identical to non-existent *for the query*. But the *system* knows the difference. The DB engine knows it *could* have kept the version but chose not to. Presentism says the universe *cannot* keep the version because there is no "there" there to keep.

  **Conclusion:**
  Your framework cannot represent Presentism without lying. To model Presentism in a DB, you have to build an Eternalist system (the SQL engine, the disk) and then write a view layer that lies to the user about the history.

  *   **Eternalism** is the native state of data architecture. It maps cleanly because data *persists*.
  *   **Presentism** requires you to simulate "ceasing to be" by actively deleting evidence.

  The residue tells you that **Presentism is not a data model; it is a garbage collection policy.**

  If you treat Presentism as a GC policy (the past is memory that has been freed), the intuition holds. The past isn't "real" because it's not in the working set. But if you ask the philosopher "Is the past *literally* nothing?" and you translate that to "Is the memory zeroed out?", you hit the wall. In DBs, even zeroed-out memory leaves magnetic traces. In Presentism, the past leaves *no* traces except in the present (memory/logs).

  **Final Answer:** The leftover exists because databases are **records of time**, not **instances of time**. A database is a map; Presentism is a claim about the territory. You can draw a map that only shows the current location (Presentist View), but the paper the map is drawn on still exists in the past and future (Eternalist Substrate). The framework can't represent the "ceasing to be" because the framework itself must persist to function. Philosophers aren't being sloppy; they are talking about ontology, while you are talking about persistence. They are orthogonal axes.
