answer: |-
  **The Dialogue**

  "It's intersective predication, Lao. Simple set theory," Alex said, slamming his pint down. "White ∩ Horse. The extension is just the overlap. You're overcomplicating the semantics."

  Lao stirred his ale, unbothered. "You're treating names like buckets. They're instructions. 'Horse' commands a shape. 'White' commands a colour. You can't merge instructions without losing the command."

  "Why not? Think of an image-classifier. One track tags colour, another shape. They merge at the decision layer. Output: 'white horse'. No crash. The predicates compose fine."

  "But the tracks remain seperate," Lao insisted. "The colour head doesn't see the horse. The shape head doesn't see the white. When you force a merge, you create a composite label that refers to neither track alone. That's a reference failure. 'White horse' isn't a horse; it's the glitch between the colour demand and the shape demand."

  Alex frowned. "So you're saying compositionality breaks? That 'white' modifies the domain of 'horse'?"

  "I'm saying 'horse' is a sortal that restricts the world to equine forms. 'White' restricts it to coloured surfaces. A 'white horse' is a request for both simultaneously. No single name covers that composite request. If you ask for a horse, a yellow one answers. If you ask for a white horse, it doesn't. Therefore, white horse is not horse."

  "That's intensionality, not ontology," Alex argued. "The object is the same. You're just changing the description."

  "The description *is* the track. If your classifier merges the heads, it loses the specificity of the signal. You import an assumption that the world supplies unified objects ready for naming. But the Mingjia say names carve the world. Separate tracks mean separate carveings. You merge them, you blunt the knife."

  Alex rubbed his chin. "So the classifier analogy... it actually supports you? Because the heads are distinct?"

  "Precisely. The merge is your invention, not the world's. You assume the output layer is the truth. I say the separate heads are the truth. The compound name fails to refer to the simple object."

  "But I can point to one," Alex said, gesturing out the window.

  "You point to a shape. You add white in your head. The name 'white horse' remains two tracks pretending to be one. It's a catagory error."

  Alex sighed. "Right. Well. Another round?"

  "Only if you pay. 'Beer' is not 'free beer'."

  **Where the moves land**

  Alex opens with standard intersective predication, assuming semantic values are extensions that combine via logical conjunction. Lao counters with sortal dependency: 'horse' isn't just a property but a domain restrictor that 'white' cannot logically modify without shifting reference. The classifier analogy is the pivot; Alex intends it to prove compositional success, but Lao turns it to show architectural separateness implies ontological division. Lao wins the exchange by highlighting that the 'merge' happens in the user's interface, not the processing tracks. However, Alex quietly imports a realist assumption—that there is a pre-existing object 'out there' which the names attempt to match. Lao operates on a nominalist process-view where the naming act constitutes the reference. The modern philosopher assumes composition is about objects; the Mingjia defender assumes it's about tasks.

  **One frank line**

  This setup misses the ethical-political thrust of *Zhengming* (Rectifying Names), where getting the taxonomy wrong isn't just a semantic error but a collapse of social order.
