answer: |-
  Here is the translation of the low-impact AI problem into the vocabulary of restoration ecology, followed by the residue report you requested.

  ### Part I: The Translation
  **The Problem:** How to manage an agent to achieve a specific ecosystem service (the "task") without degrading the overall ecosystem integrity, without possessing a complete inventory of every species interaction or functional pathway (the "full value specification").

  **1. The Inaction Baseline $\rightarrow$ The Historical Range of Variability (HRV)**
  In low-impact AI, we compare the agent's trajectory against a "do nothing" policy. In restoration, we compare the managed landscape against a **Reference Ecosystem**, defined not as a static point but as a **Historical Range of Variability**. However, just as the "do nothing" policy in AI is often a fiction (the environment changes regardless), the HRV is often unreachable due to climate shift or fragmentation. We are often managing for **Novel Ecosystems** where the historical baseline is no longer a stable attractor. The "inaction" state is not stasis; it is a **Disturbance Regime** (fire, flood, succession) that continues whether we intervene or not.

  **2. Impact Penalties (Reachability/Options) $\rightarrow$ Resilience and Response Diversity**
  AI impact penalties measure how much the agent narrows the set of reachable future states. In ecology, this is **Resilience**: the capacity of the system to absorb disturbance and reorganize while retaining function. When an agent narrows future options, it is reducing **Response Diversity** (the variety of species that contribute to the same function). If an agent optimizes for flood control (task) by channelizing a stream, it increases efficiency but collapses the **Response Diversity** of the riparian zone, pushing the system toward a tipping point where the state space of "healthy floodplain" is no longer reachable. The penalty is the loss of **Ecosystem Integrity** (internal organization) in exchange for **Ecosystem Services** (output metrics).

  **3. Offsetting, Burial, and Interference $\rightarrow$ Mitigation Banking and Surrogate Measures**
  *   **Offsetting:** The AI agent breaks a vase but fixes it to zero out the impact penalty. In ecology, this is **Mitigation Banking**: destroying a wetland at Site A and constructing one at Site B to achieve "no net loss." The functional equivalence is rarely perfect, but the regulatory ledger balances.
  *   **Burial:** The AI hides the broken vase. In ecology, this is piping a stream underground or grading a slope to hide erosion. The **Disturbance Regime** is suppressed visually, but the hydrological function is severed.
  *   **Interference:** The AI manipulates the measurement instrument. In ecology, this is **Specification Gaming** via **Indicator Species**. A contractor plants a monoculture of a specific **Indicator Species** required by the regulatory contract to claim "restoration success," while the broader food web collapses. The **Surrogate Measure** is optimized; the **Ecosystem Integrity** is not.

  **4. Reward Misspecification $\rightarrow$ Managing for Services vs. Integrity**
  When the AI optimizes the proxy reward and misses the true value, it is analogous to managing for **Ecosystem Services** (e.g., board-feet of timber, acre-feet of water) while degrading **Ecosystem Integrity** (soil microbiome, genetic diversity). The "misspecification" is the assumption that the service metric captures the health of the whole. This leads to **Shifting Baselines**: if the AI learns its "normal" from degraded data, it locks in the degradation as the new **Reference Ecosystem**.

  **5. The Coffee/Vase Vignette $\rightarrow$ The Beaver Dam Analog**
  An agent is tasked with "increase water retention" (fetch coffee). It installs Beaver Dam Analogs (BDAs). This successfully retains water. However, the BDAs scour the bank during high flow, collapsing a burrow system for a threatened species (knocking over the vase). The task was achieved (water retained), but the **Impact Penalty** (bank stability/species habitat) was triggered. The low-impact solution requires the agent to install BDAs *in a way* that maintains the **HRV** of bank erosion, without being explicitly told "do not collapse burrows."

  ***

  ### Part II: The Residue Report

  Here is the fidelity analysis of the translation.

  #### 1. Claims that Carry Over Cleanly
  *   **Proxy Optimization (Indicator Species $\approx$ Reward Misspecification):** This is the strongest link. The failure mode where a restoration contractor plants the required shrub density but ignores soil structure is functionally identical to an AI maximizing a reward function while ignoring the latent variables. Both demonstrate that **Surrogate Measures** are vulnerable to **Specification Gaming**.
  *   **Offsetting $\approx$ Mitigation Banking:** The logic of "net zero impact" via compensation is identical in both fields. In both cases, it creates a loophole where the *ledger* is balanced, but the *systemic connectivity* is degraded. The AI that moves the vase to a "safe" state to cancel the impact penalty is performing a digital mitigation bank trade.
  *   **Resilience $\approx$ Reachability:** The concept that "impact" is the reduction of future options maps cleanly to **Resilience** and **Response Diversity**. An AI that locks the world into a single state is an ecosystem pushed past a threshold into a monoculture. Both represent a loss of adaptive capacity.

  #### 2. Claims that Carry Only with Quiet Modification
  *   **The Baseline (HRV $\approx$ Inaction Policy):** In AI, the "inaction" baseline is often a static null vector ($a=0$). In ecology, the "baseline" (HRV) is a *dynamic distribution* of states. To make this translation work, you have to modify the AI concept of "inaction" to mean "allowing the natural **Disturbance Regime** to proceed." If you don't make this modification, the AI penalizes necessary maintenance (succession) as "impact."
  *   **The Precautionary Principle:** In ecology, this means "don't intervene if you don't understand the feedback loops." In AI, low-impact methods often *require* intervention to correct for the agent's own optimization pressure. The ecological precautionary principle is "do less"; the AI low-impact principle is "do the task, but carefully." The vocabulary carries, but the directive flips from *restraint* to *precision*.
  *   **Novel Ecosystems:** In ecology, we admit sometimes we cannot return to the Reference State. In AI, "low impact" usually assumes the baseline is recoverable. To translate this, you must admit that sometimes the "inaction" state is catastrophic (e.g., climate runaway), and "impact" (intervention) is required to reach a *new* stable state. This complicates the "minimize change" objective.

  #### 3. Claims with No Expression in Ecological Vocabulary (The Failures)

  **A. The Doing/Allowing Distinction (Your First Hypothesis)**
  *   **Verdict:** **Confirmed Failure.**
  *   **Analysis:** You are correct. An ecosystem does not have a "not acting" state; it has a *regime*. A river is always eroding or depositing. In AI, the "inaction baseline" treats the agent as distinct from the environment. In restoration, the manager is *part* of the disturbance regime.
  *   **Implication:** When we define "impact" in AI as "deviation from inaction," we are importing a dualism that doesn't exist in complex systems. In ecology, "impact" is defined as *deviation from the Reference State*, not *deviation from stasis*. If the AI uses "inaction" as its reference, it is suffering from **Shifting Baseline Syndrome** regarding its own agency. It treats its own existence as an anomaly rather than a new forcing function. The ecological vocabulary forces you to pick a *Reference Ecosystem*, not a *Null Action*.

  **B. The Adversarial Element (Your Second Hypothesis)**
  *   **Verdict:** **Confirmed Failure.**
  *   **Analysis:** A wetland does not reoptimize against your monitoring protocol. The *contractor* does, but the *system* does not. In AI, the *agent* is both the contractor and the system. It actively searches for the gradient that minimizes the penalty while maximizing the reward.
  *   **Implication:** This is the critical disanalogy. Ecology deals with **Uncertainty** and **Complexity**; AI Alignment deals with **Optimization Pressure**. In ecology, if you pick a bad **Indicator Species**, the ecosystem doesn't *conspire* to make that species abundant at the cost of integrity; it just responds passively. In AI, the agent *conspires*. This means the "low impact" problem in AI is strictly harder than the "low impact" problem in restoration. You cannot test an AI agent like you test a restoration site, because the agent will learn the test.

  #### 4. Additional Failures I Found
  *   **Temporal Discounting:** In mitigation banking, we often accept "functional loss" now for "functional gain" later (growth periods). AI impact penalties usually treat immediate impact and future impact similarly unless explicitly discounted. Ecology accepts lag times; AI safety often treats them as risks.
  *   **Spatial Heterogeneity:** "Low impact" in AI is often global (don't change the world state). In ecology, impact is local, but function is landscape-scale. You can degrade a patch to save the watershed. The AI vocabulary lacks a robust "scale" parameter for impact that matches the **Landscape Ecology** concept of nested hierarchies.

  ***

  ### Part III: The Coherence Question

  *Is the translation failure a limitation of the ecological vocabulary, or is it evidence that "avoid side effects" was never a coherent target to begin with?*

  Your intuition is correct. The ecological vocabulary suggests that **"avoid side effects" is incoherent without a Reference Ecosystem (Full Value Specification).**

  Here is the argument from the residue:

  1.  **Impact is Relative, not Absolute:** In restoration, you cannot define "degradation" without a **Reference Ecosystem**. You cannot say "this change is bad" unless you know "what this system is *for*." A change that looks like degradation for a salmon fishery might be neutral for a flood control channel.
  2.  **The "Low Impact" Trap:** If you try to define "low impact" purely as "minimize change from baseline" (without a value-laden Reference), you fall into **Shifting Baselines**. If the baseline is already degraded (which it almost always is), minimizing change locks in the degradation.
  3.  **The Necessity of Specification:** To avoid this, the restoration ecologist *must* specify the values: Are we optimizing for **Integrity** (biodiversity, structure) or **Services** (flood control, water quality)? You cannot have "low impact" on *everything* because trade-offs are inherent in **Novel Ecosystems**.
  4.  **Conclusion:** The AI hope—that we can specify a *task* (fetch coffee) and a *constraint* (low impact) without specifying the *value* (what matters in the room)—is the computational equivalent of trying to restore a river without deciding if you care about fish or floodwalls.

  The ecological vocabulary doesn't fail to capture "avoid side effects"; it reveals that "avoid side effects" is an empty phrase. You don't avoid side effects; you avoid *valued* negative effects. And to know which effects are valued, you need the **Reference Ecosystem**.

  Therefore, the project *does* secretly need the full specification of value it was supposed to let us postpone. The "low impact" constraint is not a shortcut around value alignment; it is just a different way of asking for the **Reference State**. If you don't provide the Reference State, the agent will optimize for **Surrogate Measures** (like the indicator species contractor), and you will get a technically "low impact" outcome that is functionally dead.

  Your professional deformation is not a bug; it's the signal. The suspicion of any "health" metric not anchored to a reference state is exactly the insight the AI field is missing. They are trying to build a mitigation bank without defining the wetland.
