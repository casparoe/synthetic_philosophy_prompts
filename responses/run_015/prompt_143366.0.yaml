      *   **Ostrom's Work:** Focuses on *Common-Pool Resources (CPR)*. Distinguishes between "open access" (no rules) and "common property" (rules exist). Shows that communities *can* self-organize without state/privatization *if* certain design principles are met. It's not just a "patch"; it's a stable equilibrium under specific conditions.
