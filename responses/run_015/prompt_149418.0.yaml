answer: |-
  There is no single canonical term in the literature that specifically names this asymmetry. However, the pattern you have identified is a recognized tension situated at the intersection of **rational choice theory**, **non-instrumental ethics**, and **political legitimacy**.

  To carve this phenomenon precisely for your workshop, I propose labeling it **"Mechanism-Relative Instrumentalism"** (or, more descriptively, **"The Sovereignty-Integrity Asymmetry"**).

  Below is the conceptual carving, its nearest neighbors in the literature, and the boundaries distinguishing it from related biases and problems.

  ### 1. Conceptual Definition: Mechanism-Relative Instrumentalism

  **Definition:** A normative inconsistency wherein an agent accepts non-instrumental (expressive, integrity-based) reasons as sufficient to override causal inefficacy in *market/consumption* contexts, but insists on instrumental (outcome-affecting) reasons as necessary conditions for rational action in *institutional/political* contexts, despite isomorphic causal structures (thresholds, scaling, null marginal impact).

  **The Structural Configuration:**
  1.  **Causal Premise:** Act $X$ in Mechanism $M$ has a probability of impact $\approx 0$ due to threshold/aggregation effects.
  2.  **Expressive Premise:** Act $X$ expresses alignment with Norm $N$ or Community $C$.
  3.  **The Asymmetry:**
      *   If $M$ = Market (e.g., meat purchase), Premise 2 is accepted as a sufficient reason to perform/avoid $X$.
      *   If $M$ = Polity (e.g., voting), Premise 2 is rejected as insufficient; Premise 1 (instrumental impact) is treated as a necessary condition for rationality.

  ### 2. Nearest Neighbors in the Literature

  While no single term covers the asymmetry, the phenomenon sits at the friction point of three established debates. Identifying these helps locate your intervention.

  **A. Expressive Voting Theory (Brennan, Lomasky, et al.)**
  *   **The Neighbor:** This literature argues precisely what your interlocutor rejects in Case B: that voting is rational *because* it is expressive, not because it is instrumental.
  *   **The Distinction:** Standard expressive voting theory attempts to solve the "Paradox of Voting" universally. Your interlocutor is not debating the theory itself but applying it selectively. They accept the *logic* of expressive rationality in the private sphere but deny its *jurisdiction* in the public sphere.

  **B. Complicity vs. Causation in Collective Harm (Nefsky, Budolfson, Isaacs)**
  *   **The Neighbor:** In the ethics of consumption, the debate has shifted from "making a difference" (causation) to "being complicit" (participation). Your interlocutor accepts the complicity model for meat (I am tainted by the market mechanism) but rejects it for voting (I am not tainted by the electoral mechanism unless I am decisive).
  *   **The Distinction:** This literature usually treats complicity as a general moral category. Your interlocutor treats complicity as **domain-specific**: valid for economic participation, invalid for political authorization.

  **C. The Division of Moral Labor (Rawlsian/Schefflerian)**
  *   **The Neighbor:** Some theories suggest individuals should maximize good in private life while institutions handle justice.
  *   **The Distinction:** Your interlocutor is doing the inverse. They are demanding high instrumental justification for the institutional act (voting) while allowing lower-bar integrity justification for the private act (eating). This contradicts the standard view that institutions demand *less* individual sacrificial efficacy because they handle the coordination.

  ### 3. Diagnostic Core: Sovereignty vs. Integrity

  To explain *why* this asymmetry occurs without dismissing it as mere bias, you can characterize it as a conflict between two normative models of agency:

  1.  **The Integrity Model (Market):** The agent views consumption as constitutive of their moral identity. The act matters because *I* am the one doing it. Causal nullity is irrelevant because the harm is in the participation, not the outcome.
  2.  **The Sovereignty Model (Polity):** The agent views voting as an exercise of power/authority. The act matters because it *commands* a result. If the command has no causal power (null efficacy), the act is void.

  **The Phenomenon:** Your interlocutor is applying the **Sovereignty Model** to the ballot and the **Integrity Model** to the butcher. The inconsistency lies in failing to see that voting can also be constitutive of civic identity (Integrity) and that consumption can be an exercise of market sovereignty (Power).

  ### 4. Boundaries and Distinctions

  To ensure this concept is not conflated with standard biases or problems, use these delimiters:

  **Vs. Motivated Reasoning**
  *   **Bias:** Motivated reasoning implies the conclusion drives the argument (e.g., "I want to eat meat, so I argue voting doesn't matter").
  *   **Your Phenomenon:** This is structural. The interlocutor is consistently applying a rule ("Institutions require efficacy") that they fail to apply to markets. It is a **categorization error**, not necessarily a desire-driven rationalization. They may genuinely believe markets and polities function differently.

  **Vs. The Non-Identity Problem**
  *   **Non-Identity:** Concerns how actions affect *who* comes into existence (Parfit).
  *   **Your Phenomenon:** Concerns how actions count as *reasons* for existing agents. It is about the **validity of reasons**, not the identity of the beneficiaries.

  **Vs. Standard Symbolic Action**
  *   **Symbolic Action:** Generally discusses whether symbols have value.
  *   **Your Phenomenon:** Specifically addresses the **conditional validity** of symbols. It is not asking "Do symbols matter?" but "Why do symbols matter in the market but not in the booth?" It targets the **contextual uptake** of the symbol.

  ### 5. Suggested Intervention for the Workshop

  When presenting this, you can frame the intervention as a challenge to **Mechanism-Relative Normativity**.

  Ask the interlocutor to justify the **categorization boundary**:
  > "What is the normative feature of the democratic mechanism that strips expressive reasons of their force, which is not also present in the supply-chain mechanism? If the causal architecture (threshold/nullity) is identical, on what grounds do we assign the 'Sovereignty Model' to one and the 'Integrity Model' to the other?"

  This forces them to either:
  1.  Admit the asymmetry is unjustified (collapsing the distinction).
  2.  Identify a relevant structural difference (e.g., the secret ballot vs. public purchase, or the nature of authorization vs. participation).
  3.  Accept that if expressive reasons work for meat, they must work for votes (or vice versa).

  **Summary Label:** Use **"Mechanism-Relative Instrumentalism"** to describe the pattern, and **"The Sovereignty-Integrity Asymmetry"** to describe the underlying normative conflict. This provides the precision required for a graduate-level discussion without relying on a non-existent canonical term.
