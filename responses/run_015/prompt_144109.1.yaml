  ### The Scenario: Two Mixing Tanks

  **Setting:** A workshop bench. Two identical, transparent, cylindrical tanks sit side-by-side. Each contains a clear, viscous fluid (like corn syrup). Each has a motorized stirrer shaft descending from the lid. Each has a digital concentration sensor embedded at the exact same coordinate: Point $P$, located halfway down the wall, at a specific angle.

