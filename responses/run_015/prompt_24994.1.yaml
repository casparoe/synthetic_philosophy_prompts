prompt: |-
  Most legal systems prohibit torture absolutely: no ticking-bomb exception, no necessity defense. An official who tortures a suspect to prevent a terrorist attack has still committed a crime, regardless of how many lives the torture might have saved. This looks like the legal system endorsing a deontological constraint — the prohibition is agent-relative, binding each agent regardless of the consequences of compliance. But the same legal systems also permit harm-weighing elsewhere: police may use lethal force to stop a mass shooter, and states may wage war in self-defense knowing it will kill civilians. What theory of moral wrongness does the absolute prohibition on torture presuppose? Is it consistent with the harm-weighing the law permits in other contexts? Reconstruct the implicit theory, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change in legal doctrine if the presupposed view were replaced by a straightforwardly act-consequentialist one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** Legal systems absolutely prohibit torture (no exceptions), even in "ticking-bomb" scenarios. This looks deontological (agent-relative constraint).
      *   **Contrast:** Legal systems *do* permit harm-weighing elsewhere (lethal force against shooters, war/self-defense with collateral damage).
      *   **Task 1:** Identify the theory of moral wrongness presupposed by the absolute prohibition on torture.
      *   **Task 2:** Assess consistency with permitted harm-weighing in other contexts.
      *   **Task 3:** Distinguish between what the practice *strictly presupposes* vs. what it *merely fits well with*.
      *   **Task 4:** Explain what would change in legal doctrine if replaced by act-consequentialism.

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Absolute Prohibition:* Suggests Deontology (Kantian, Rights-based). Torture violates dignity/autonomy in a way that cannot be traded off.
      *   *Harm-Weighing Elsewhere:* Suggests Consequentialism or Threshold Deontology. Killing in self-defense is often justified by the "forfeiture of rights" or the "lesser evil."
      *   *Tension:* How can you ban torture absolutely but allow killing (which seems worse) conditionally?
      *   *Possible Resolutions:*
          *   Torture is uniquely degrading (status-based).
          *   Institutional integrity/slippery slope (rule-consequentialist disguise).
          *   Epistemic humility (we can't know if the bomb is real).
          *   Agent-relative constraints vs. Agent-neutral permissions.
      *   *Strict Presupposition:* Does the law *need* to be deontological? Or could it be a rigid rule-utilitarianism?
      *   *Act-Consequentialist Replacement:* If we switched to pure act-consequentialism, the "absolute" ban disappears. Exceptions become mandatory if utility dictates.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the paradox. The law treats torture as *malum in se* (wrong in itself) while treating killing as *malum prohibitum* (wrong because prohibited, unless justified).

      *   **Part 1: The Presupposed Theory of Moral Wrongness.**
          *   It's not just "Deontology." It needs more nuance.
          *   *Rights Forfeiture Theory:* In self-defense/war, the aggressor forfeits their right not to be harmed. The torture victim (suspect) has *not* forfeited their right against torture, even if they know info.
          *   *Inviolability/Dignity:* Torture treats a person purely as a means (Kant). Killing in self-defense stops a threat; torture extracts utility from a captive body/mind.
          *   *Agency and Control:* In self-defense, the death is a side effect or necessary stop to an ongoing threat initiated by the shooter. In torture, the harm is the *method* of information extraction.
          *   *Label:* **Status-Based Deontology with Rights Forfeiture.**

      *   **Part 2: Consistency with Harm-Weighing.**
          *   Is it consistent? Yes, if the *type* of wrong differs.
          *   *Killing:* Can be justified if the target is an active threat (rights forfeiture). Collateral damage is justified via Doctrine of Double Effect (DDE) or proportionality.
          *   *Torture:* The suspect is usually in custody (non-active threat). They are being used as a tool. No rights forfeiture regarding bodily integrity in this context.
          *   *The Distinction:* Active threat vs. Passive source. Means vs. Side-effect.
          *   *Conclusion:* It is consistent *if* one accepts that rights are specific (right to life vs. right against torture) and forfeiture conditions vary.

      *   **Part 3: Strict Presupposition vs. Good Fit.**
          *   *Strict Presupposition:* The law *must* treat the prohibition as exclusionary. It excludes consequentialist reasoning *in the moment of adjudication*. It presupposes that some acts are *inherently* unauthorized regardless of outcome.
          *   *Merely Fits Well:*
              *   *Slippery Slope:* The ban fits well with rule-consequentialism (banning it prevents abuse), but the law doesn't *say* "unless we are sure no abuse will occur." It says "never." So rule-consequentialism explains the policy, but Deontology explains the *logic of the prohibition*.
              *   *Epistemic Limits:* Fits well with the idea that we can't trust ticking-bomb intel. But the law bans it even if we *know* (hypothetically).
              *   *Integrity:* Fits with the idea of the state's moral cleanliness.
          *   *Key Distinction:* The law presupposes **Agent-Relative Constraints**. It does not necessarily presuppose objective moral truths, but it structurally requires agents to act as if certain constraints are absolute.

      *   **Part 4: The Act-Consequentialist Replacement.**
          *   If we switch to Act-Consequentialism (AC):
          *   *Doctrinal Change 1:* The "Absolute" becomes "Prima Facie."
          *   *Doctrinal Change 2:* The "Necessity Defense" becomes valid. If torture saves 1,000 lives, it is not just excused, it is *justified*.
          *   *Doctrinal Change 3:* Burden of Proof shifts. Instead of "Did you torture?" (Guilty), it becomes "Did the utility outweigh the harm?"
          *   *Doctrinal Change 4:* Ex Post vs. Ex Ante. AC might demand ex-ante authorization (warrants for torture?) or ex-post justification trials.
          *   *Institutional Impact:* The "clean hands" doctrine vanishes. The state admits it tortures when useful.

  4.  **Refining and Polishing:**

      *   *Tone:* Philosophical, legal-analytical, precise.
      *   *Clarification:* Ensure the distinction between *justification* (it was the right thing to do) and *excuse* (it was wrong but we understand why) is clear. Current law often treats torture as a crime but might offer leniency (excuse), whereas the prompt suggests it remains a crime (no defense).
      *   *Nuance on "Rights Forfeiture":* Make sure to explain why a terrorist suspect doesn't forfeit rights like a shooter does. (Shooter is actively killing; suspect is holding info).
      *   *Nuance on "Strict Presupposition":* Be careful not to say the law *is* moral philosophy. It *operationalizes* a view. The strict presupposition is that the rule is exclusionary of consequentialist calculus *at the point of action*.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "war/civilian death" point enough?
      *   *Fix:* Ensure the Doctrine of Double Effect (DDE) or Proportionality in *Jus in Bello* is contrasted with the intentionality of torture. Torture intends pain; war intends military advantage (pain is foreseen but not intended).
      *   *Critique:* Is "Status-Based Deontology" the best label?
      *   *Fix:* Maybe "Rights-Based Deontology with Specific Forfeiture Conditions." Let's stick with the core idea of *Inviolability* vs. *Liability*.
      *   *Critique:* Did I answer "what would have to change"?
      *   *Fix:* Be specific about statutory language (removing "without exception") and judicial review standards.

  6.  **Final Polish:** Check against the prompt's four specific requirements.
      1.  Theory of moral wrongness? (Rights-based deontology/Inviolability).
      2.  Consistent with harm-weighing? (Yes, via liability/forfeiture distinction).
      3.  Strict presupposition vs. fits well? (Exclusionary reasons vs. slippery slope/epistemic arguments).
      4.  Act-consequentialist changes? (Necessity defense, warrants, shift from guilt to justification).

  7.  (Final Output Generation - similar to the provided good response.)
answer: |-
  The absolute legal prohibition on torture, juxtaposed with the permissibility of lethal force in war or self-defense, presents a complex jurisprudential puzzle. To analyze this, we must distinguish between the *logic* of the prohibition, its *consistency* with other legal norms, the *depth* of its philosophical commitments, and the *structural consequences* of altering those commitments.

  ### 1. The Presupposed Theory of Moral Wrongness

  The absolute prohibition on torture presupposes a **Rights-Based Deontology grounded in Human Inviolability and Specific Rights Forfeiture.**

  Unlike a pure consequentialist view, where the wrongness of an act is determined solely by its outcome, this legal framework treats torture as *malum in se* (wrong in itself). The theory rests on two pillars:

  *   **Inviolability (The Kantian Constraint):** Every person possesses a status that forbids them from being used merely as a means to an end, even a good end. Torture is uniquely violative because it aims to break the victim's will and agency to extract utility (information). It treats the human body and mind as a tool.
  *   **Specific Rights Forfeiture:** Legal systems generally accept that rights are not absolute across the board, but forfeiture is context-specific.
      *   *In Self-Defense/War:* An aggressor (mass shooter) or combatant actively threatens the rights of others. By initiating lethal force, they forfeit their own right not to be harmed (liability). Civilian deaths in war are often tolerated under the Doctrine of Double Effect (DDE) or proportionality calculations because they are foreseen side effects, not the intended means of victory.
      *   *In Torture:* A suspect in custody, even a terrorist, is typically not an *active* imminent threat in the same way a shooter is. They are a passive source of information. Consequently, they have not forfeited their right to bodily integrity. Because they retain this right, violating it is a wrong that cannot be offset by the good consequences (saved lives).

  Therefore, the theory of wrongness is not that "pain is always worse than death," but that **intentional violation of inviolable bodily integrity by a state agent against a person in custody is a categorical wrong that does not admit of trade-offs.**

  ### 2. Consistency with Permitted Harm-Weighing

  Is this consistent with allowing lethal force or collateral damage in war? **Yes, provided one accepts the distinction between *Liability* and *Innocence*, and between *Means* and *Side-Effects*.**

  *   **Liability:** In self-defense and *jus in bello* (justice in war), harm is directed at those who are *liable* to be harmed (combatants, aggressors) or occurs as a proportionate side-effect. In torture, the victim is often not liable to be tortured; they are being harmed to access information they possess, not because they are currently attacking.
  *   **Intentionality:** In war, civilian death is (theoretically) unintended collateral damage. In torture, the infliction of severe pain is the *method* of the act. The legal system presupposes that intending harm as a means is morally distinct from foreseeing harm as a side-effect.
  *   **Institutional Role:** The state's monopoly on violence is calibrated to stop threats (killing a shooter stops the shooting). Torture does not stop a threat directly; it extracts intel to *potentially* stop a threat. The causal chain is more attenuated, making the harm-weighing less precise and the violation of rights more gratuitous in the eyes of the law.

  Thus, the system is consistent if one views rights as a "shield" that is only lowered when one becomes a sword (aggressor). A detainee holding information has not necessarily become a sword.

  ### 3. Strict Presupposition vs. Mere Fit

  It is crucial to distinguish what the legal doctrine *logically requires* versus what arguments merely *support* it.

  **What the Practice Strictly Presupposes:**
  *   **Exclusionary Reasons:** The law presupposes that the prohibition on torture functions as an "exclusionary reason" (in the H.L.A. Hart or Joseph Raz sense). It excludes consequentialist calculation *at the moment of decision*. An officer cannot legally calculate that 1,000 lives > 1 suspect's pain. The rule removes the pain from the equation entirely.
  *   **Agent-Relative Constraints:** The law binds the *agent* (the state official), not just the outcome. It presupposes that the moral integrity of the legal order is damaged by the act of torture itself, regardless of the net utility.
  *   **Non-Forfeiture of Core Integrity:** It presupposes that there is a core of human rights (freedom from torment by the state) that cannot be forfeited by criminal conduct or enemy status.

  **What Merely Fits Well (But is Not Strictly Required):**
  *   **Epistemic Humility:** It fits well with the idea that "ticking bombs" are rare and intelligence is unreliable. However, the law bans torture even if the bomb is *known* to be real. Epistemic uncertainty supports the ban pragmatically, but the absolute nature of the ban presupposes a moral truth, not just a factual uncertainty.
  *   **Slippery Slope / Rule-Consequentialism:** It fits well with the argument that allowing exceptions leads to widespread abuse. However, a rule-consequentialist view would allow torture if the slope could be managed (e.g., via strict warrants). The absolute ban presupposes that the act is intrinsically wrong, not just instrumentally dangerous.
  *   **State Legitimacy:** It fits with the idea that a torturing state loses moral authority. While true, the legal prohibition applies to the individual officer's criminal liability, not just the state's geopolitical standing.

  ### 4. Doctrinal Changes Under Act-Consequentialism

  If the legal system replaced this deontological presupposition with a straightforward **Act-Consequentialist** view (where the right act is always the one maximizing net welfare), the doctrine would undergo radical transformation:

  1.  **From Prohibition to Regulation:** The statutory language would shift from "No person shall torture" to "No person shall torture unless the expected utility outweighs the harm." Torture would become a regulated activity rather than a forbidden one.
  2.  **The Necessity Defense Becomes a Justification:** Currently, in many jurisdictions, "necessity" is not a defense for torture (or is strictly limited). Under act-consequentialism, saving 1,000 lives would make the torture *justified*, not merely *excused*. The officer would be acquitted because they did the *right* thing, not because they are pardoned for doing the wrong thing.
  3.  **Ex-Ante Authorization (Torture Warrants):** If consequences matter, delaying torture to get judicial approval might save lives (by ensuring the right suspect is tortured) or waste time. A consequentialist system would likely institute a warrant system to optimize the cost-benefit analysis, ensuring torture is only used when the probability of success is high.
  4.  **Shift in Burden of Proof:** Currently, the prosecution must prove the torture occurred. In a consequentialist regime, once torture is admitted, the burden might shift to the state to prove the *utility* was sufficient, or to the defense to prove the utility outweighed the harm. The trial becomes a utilitarian calculus rather than a factual inquiry into conduct.
  5.  **Erosion of the "Clean Hands" Doctrine:** The legal system currently maintains its legitimacy by refusing to soil its hands. An act-consequentialist system would admit that the state sometimes *must* do evil to prevent greater evil. This would require transparency mechanisms (reporting, oversight) focused on efficiency and outcome maximization rather than prevention and punishment.

  ### Summary

  The absolute prohibition on torture presupposes a **deontological theory of inviolability**, where certain rights against intentional degradation cannot be forfeited or traded. This is consistent with permitted harm-weighing in war and self-defense because those contexts rely on **liability** (aggressors forfeit rights) and **side-effects** (collateral damage), whereas torture targets **non-liable persons** using harm as a **means**.

  The practice strictly presupposes that legal rules can function as **exclusionary reasons** that block consequentialist calculation. If replaced by act-consequentialism, the law would cease to prohibit torture *per se* and instead regulate it as a **justifiable tool of statecraft**, transforming the legal question from "Did you commit a crime?" to "Did you calculate the utility correctly?"
