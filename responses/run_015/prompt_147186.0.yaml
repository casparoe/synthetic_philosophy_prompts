answer: |-
  You have stumbled onto a genuine paradox in public ethics, one that political philosophers usually tidy up before it reaches a committee room. Your observation is sharp: your committee is operating with a **dual-register theory of value** that is logically inconsistent but socially functional.

  Here is the reconstruction of the theory your committee is actually using, an analysis of why the "proximity taboo" behaves the way it does, and where your own framing might be tripping you up.

  ### 1. The Load-Bearing Theory: Bureaucratic Aggregation + Symbolic Incommensurability

  Your committee's practice only makes sense if you assume you are managing two different currencies that happen to share the name "money."

  **Register A: The Logic of Recognition (The Money)**
  This operates on a **Aggregative/Utilitarian** basis. The budget is allocated per victim because the *task of commemoration* scales with the number of victims. Engraving 1,000 names costs more than engraving 10. Bringing 50 survivors to a ceremony costs more than bringing 5.
  *   **Load-bearing function:** This prevents the erasure of scale. If a famine killed 10,000 and a massacre killed 100, an equal split of resources would materially obscure the historical magnitude of the famine. The anger at the equal split confirms this: the community interprets "equal resources" as "equal scale," which feels like historical revisionism.

  **Register B: The Logic of Honor (The Rhetoric)**
  This operates on a **Symbolic/Expressivist** basis. This is where the "no ranking suffering" rule lives. The moral *status* of the victims must remain equal. To say Event A was "worse" than Event B is to imply the victims of B are less worthy of grief, or that the perpetrators of B were less evil.
  *   **Load-bearing function:** This maintains social cohesion between victim groups. If you admit a hierarchy of suffering, you create a hierarchy of grievance. The group lower on the hierarchy loses political leverage and moral standing.

  **The Contradiction:**
  You are using Register A (counting) to distribute resources, while using Register B (not counting) to distribute honor. The system holds together only as long as nobody points out that the resource distribution *looks like* a ranking of honor. When the journalist asked the question, they tried to force Register A to do the work of Register B, and the committee panicked.

  ### 2. The Proximity Taboo: Rivalry, Not Epistemology

  You are puzzled by the second observation: *Why is comparing similar atrocities (genocide vs. genocide) more taboo than dissimilar ones (famine vs. bar fight), when epistemically, similar cases should be easier to compare?*

  You are assuming the taboo is **epistemic** (i.e., "we can't know which is worse"). It is not. The taboo is **political**.

  *   **Dissimilar Comparison:** Comparing a genocide to a bar fight does not threaten the identity of the genocide victims. They are not competing for the same moral category. Acknowledging the bar fight is worse than a stubbed toe doesn't dilute the genocide.
  *   **Similar Comparison:** Comparing two genocides creates a **zero-sum competition for the category of "Ultimate Evil."** Public memory has limited bandwidth. If the Holocaust is framed as the "paradigmatic" genocide, other genocides risk being viewed as derivative or lesser.
  *   **The Function of the Taboo:** It prevents the commodification of trauma. If we can rank genocides linearly, then grief becomes a ladder. The taboo protects the *singular dignity* of each group. It says: "Your tragedy is unique to you, not a data point on a scale we share with others."

  So, the obscenity charge tracks **rivalry**, not **difficulty**. It is offensive because it implies the sufferings are interchangeable units that can be weighed against one another, rather than distinct historical wounds.

  ### 3. The Legal Contrast: Agency vs. Patiency

  You noted that criminal sentencing scales per-perpetrator, while your budget scales per-victim. This is not an inconsistency in arithmetic; it is a difference in **target**.

  *   **Criminal Law (Retributive):** Focuses on **Agency**. The moral weight lies in the *choice* to do evil. One murderer is one moral agent. Killing 10 people doesn't make him 10 moral agents; it makes him one agent who did a very bad thing. The sentence punishes the *will*.
  *   **Memorial Budget (Restorative):** Focuses on **Patiency**. The moral weight lies in the *loss* suffered. Each victim represents a distinct world extinguished. The budget repairs (symbolically) the *damage*.

  If you applied legal logic to memorials, you would fund based on the number of perpetrators (e.g., the Nazi regime gets one budget, the Colonial Office gets one budget). That would be absurd for memorials because it centers the oppressor. If you applied memorial logic to law, you would sentence a mass murderer to 10,000 years of prison. We don't do that because punishment is about the capacity of the agent to bear it, not just the sum of the harm.

  ### 4. Evaluating the Frameworks

  Could a straightforward philosophical view license this behavior?

  *   **Straight Aggregativism (Utilitarianism):**
      *   *Verdict:* Fails. An aggregativist would say, "Yes, obviously the event with more deaths is worse, and we should say so." They would be baffled by the "no ranking" rhetoric.
      *   *Change required:* You would have to openly rank the projects. "The Holocaust project gets 50% because the death toll was highest." This would likely cause a riot.

  *   **Strong Incommensurability:**
      *   *Verdict:* Fails. This view says the values cannot be compared at all.
      *   *Change required:* You would have to flip a coin or split the pot exactly equally. But as you noted, the equal split causes anger because it erases scale.

  *   **Expressivism (The Winner):**
      *   *Verdict:* Fits best. Expressivism holds that moral language (and budget allocations) are not descriptions of facts but expressions of attitude.
      *   *The Theory:* The per-victim formula expresses "We see every individual." The "no ranking" rhetoric expresses "We respect every community equally."
      *   *Change required:* You would stop pretending the budget is a measure of "badness." You would explicitly frame the money as "cost of commemoration," not "value of life."

  ### 5. Where Your Framing is Confused

  You wrote: *"That's a cardinal, roughly linear-in-deaths scale of badness, which is a stronger commitment than just saying A was worse than B."*

  This is the crux of your confusion. You are conflating **Magnitude** with **Severity**.

  *   **Magnitude:** How many people died? How much land was affected? (This is descriptive, scalable, and suitable for budgeting).
  *   **Severity:** How evil was the intent? How deep was the suffering per person? (This is normative, qualitative, and resistant to scaling).

  Your committee's formula tracks **Magnitude** (cost to memorialize N names). Your committee's rhetoric protects **Severity** (the qualitative horror of the event).

  The confusion arises because you think allocating more money to the larger tragedy implies you think it was *more evil*. It doesn't. It implies it was *larger*. A forest fire that burns 10,000 acres isn't necessarily "more evil" than an arsonist burning down a hospital, but it requires more firefighters. Your budget is for firefighters, not judges.

  ### 6. What You Would Have to Do Differently

  If you want to resolve the cognitive dissonance, you have three options, each with consequences:

  **Option A: Embrace the Expressivist Dual-Register (Recommended)**
  *   **Action:** Change the language. Stop saying "we don't rank suffering." Start saying: "We do not rank the *moral status* of victims, but we must acknowledge the *scale* of loss to allocate resources fairly."
  *   **Consequence:** Defuses the journalist's trap. You admit the money tracks scale (magnitude), not worth (severity).
  *   **Risk:** Some groups may still interpret "less money" as "less important."

  **Option B: Decouple Money from Names**
  *   **Action:** Allocate a base sum to each project for "educational value" (Severity) and a variable sum for "material costs" (Magnitude).
  *   **Consequence:** Acknowledges that a small massacre might be as morally significant as a large famine, even if the famine costs more to engrave.
  *   **Risk:** Extremely complex to administer. Requires defining "educational value," which invites the ranking taboo back in.

  **Option C: The Equal Split (Radical Incommensurability)**
  *   **Action:** Split the pot and wall space four ways, regardless of victim count.
  *   **Consequence:** Enforces the "no ranking" rule materially.
  *   **Risk:** As you saw, this causes anger. It feels like a lie. It erases the historical reality that some events were industrially scaled and others were localized.

  ### Summary Argument

  Your committee is not confused; it is **code-switching**. You are using the language of economics (aggregation) to solve a logistical problem, and the language of theology (incommensurability) to solve a social problem.

  The "proximity taboo" exists because comparing similar atrocities threatens the **political identity** of the victim groups, not because it is epistemically hard. The legal contrast exists because law punishes **agents** while memorials honor **patients**.

  Your framing error is assuming the budget formula is a "scale of badness." It is a **scale of logistical scope**. If you clarify that distinction in your meetings—separating the *cost of remembering* from the *worth of the remembered*—you can keep the money flowing without violating the taboo. The obscenity isn't in counting the dead; it's in counting the dead to decide whose grief counts more. As long as the money buys stone and travel, not moral superiority, the contradiction is sustainable.
