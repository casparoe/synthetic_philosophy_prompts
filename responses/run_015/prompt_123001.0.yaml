      *   **The Package (5 Claims):**
          1.  Self is genuinely relational (constituted by roles).
          2.  Moral duty to exit/reform roles (e.g., abusive parent) without self-betrayal.
          3.  *Xiao* (filial piety) is the root of *Ren* (humaneness), not just one virtue among equals.
          4.  Reject biological/gender-essentialism; roles are performative/negotiated/revisionable.
          5.  Critique liberal individualism BUT insist on equal basic moral dignity for all role-bearers.
      *   **User's Identified Worries:** (1) vs. (2) (Constitution vs. Exit) and (3) vs. (4) (Root vs. Revision).
