  2.  **Deconstruct the Core Argument:**
      *   *What is a conceptual framework?* It's not a thing; it's a way of thinking, a language, a set of rules for relating ideas. Examples: Logic, taxonomy, scientific methods.
      *   *Why IP fails here:* IP works on excludable goods (a book, a machine). Frameworks are non-rivalrous and gain value through usage (network effects).
      *   *Negative Epistemic Network Effects:* If I own the logic you must use to think about a problem, communication breaks down, innovation stalls, and fragmentation occurs.
      *   *Critique of Lockean Labor:* You didn't "make" the logic in isolation; you discovered or articulated a shared structure. Mixing labor with land works for land; mixing labor with thought-structures doesn't yield ownership because the structure exists independently of the articulation or requires shared adoption to function.
      *   *Critique of Utilitarian Incentive:* Incentives work for producing *instances* (books, drugs). But for frameworks, the incentive to create is often intrinsic or reputational, and the social cost of monopoly outweighs the benefit. Actually, monopolizing a grammar disincentivizes its use, killing its value.

