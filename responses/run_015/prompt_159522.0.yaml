answer: |-
  **Translations**

  (i) Perfect initial conditions and perfect model equations fix the trajectory for all lead times.
  (ii) Exponential growth of initial-condition error ensures finite-precision analysis yields skill indistinguishable from climatology beyond a characteristic lead time, even with perfect equations.
  (iii) Ensemble verification can show reliability even if the model integrates stochastic parametrisations or if the true system lacks a unique trajectory for a given state vector.
  (iv) [Bend] Amplification of unresolved scale errors prevents the future state from being uniquely fixed by the current analysis, allowing interventions outside the state vector to alter the trajectory.
  (v) No analytical solution exists for the state at lead time T; retrieval requires numerical integration step-by-step over the interval.

  **Residue Report: Physics-Based Models**

  Claims (i), (ii), (iii), and (v) have exact counterparts. They map directly to the perfect model scenario, the predictability horizon, ensemble reliability, and computational necessity. Claim (iv) goes through only after distortion. Forecasting vocabulary describes state evolution, not the causal origin of interventions. "Agency" is external to the state vector; the translation above treats agency as an unmodelled forcing term, which is a functional equivalent but misses the philosophical weight of voluntary action.

  "In principle" maps to the "perfect model scenario." It is not empty. It distinguishes structural limits (Lyapunov time) from operational limits (analysis error). It defines the maximum possible skill given infinite computing and perfect data. It asserts that the barrier to prediction is information loss, not logical impossibility.

  **Residue Report: Machine-Learned Models**

  With ML models (fitted functions, no explicit state variables or equations of motion):

  Claim (i) collapses. There are no "laws," only weights. The model is deterministic if weights are fixed, but this asserts nothing about the atmosphere's mechanics. The link between model uniqueness and world uniqueness is severed.
  Claim (v) remains (must run inference), but "simulation" becomes "function evaluation."
  The distinction between determinism and predictability dissolves. Determinism loses its subject matter. The forecaster asserts nothing about the weather's ontology, only the model's mapping stability. If the best tool is a black box, asking if the weather is deterministic is metaphysical surplus.

  This is a finding about what forecasting has become, not determinism itself. It reveals that "determinism" was always a property of the *model class* (differential equations), not the prediction task. Physics-based models smuggled ontology into methodology; the equations implied a mechanism. ML strips this away. Prediction survives; the claim of determinism becomes unassertable because the vocabulary of "laws" required to make the claim is absent.

  If a forecaster a decade from now has only ML models, determinism is no longer something she can assert or deny about the weather. The claim has lost its subject matter because the "laws" required to be deterministic no longer exist in her workflow. She can only speak to predictability (skill scores, spread).

  This is interesting because it shows determinism was never a raw fact of the world accessible to forecasters, but a feature of the physics-based modeling framework. When the framework changes, the question vanishes. The gap in your vocabulary regarding "in principle" was not a defect; it was a sign that the phrase belongs to the physics-based paradigm. In an ML paradigm, there is only "in practice," because there is no "principle" separate from the fitted function.
