      *   *Claim:* Calling it injustice makes the concept useless.
      *   *Assessment:* Valid concern about concept inflation, but misapplied here. If the dismissal *was* prejudicial, it fits the definition. It only becomes useless if *any* disagreement is labeled injustice.
      *   *Claim:* "Knowledge harm" requires the main claim to be true.
