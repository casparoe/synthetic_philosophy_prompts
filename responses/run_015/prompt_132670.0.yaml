      *   *The "Right/Wrong" Trap:* Both are focusing heavily on whether Jordan was "right" about the main cause. Fricker explicitly states testimonial injustice is about the *credibility deficit*, not the truth value of the assertion.
      *   *The "Mixed Bag" Nature of Testimony:* Jordan's testimony was a bundle (Main Theory + Side Observation). The managers treated the bundle as garbage based on identity. This is a classic case of credibility deflation.
      *   *Structural vs. Individual:* It's not just about rudeness (Casey's fear). It's about systemic stereotypes (Art vs. Tech/Management).
      *   *The Harm:* The harm isn't just "Jordan felt bad." It's that the organization lost access to the "side pattern" truth *because* of the prejudice. This validates Riley's point about the lost knowledge, but clarifies *why* it counts as injustice (systematic exclusion of certain perspectives).

