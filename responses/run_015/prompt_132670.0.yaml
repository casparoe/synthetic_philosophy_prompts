answer: |-
  This is a classic philosophical dispute applied to a real-world scenario. To referee this, we need to look at the actual definition of **epistemic injustice**, specifically **testimonial injustice**, as coined by philosopher Miranda Fricker.

  Here is the breakdown of who is right about what, where they are misunderstanding the concept, and what they are both missing.

  ### 1. The Core Concept: Testimonial Injustice
  Epistemic injustice is not about whether a speaker is ultimately *factually correct*. It is about whether the listener assigned the speaker the correct level of **credibility** based on prejudice.

  **Testimonial Injustice** occurs when a speaker is given less credibility than they deserve, specifically because of an identity prejudice held by the listener (e.g., regarding race, gender, class, or in this case, educational background/discipline).

  ### 2. Evaluating Riley's Moves
  **Riley's Claim:** *The harm is using Jordan's background as a shortcut to not listen. If an engineer said it, they would have debated the mechanism.*
  *   **Verdict:** **Correct.**
  *   **Why:** This is the heart of Fricker's definition. The injustice happens at the moment of exchange, not after the facts are verified. If the managers dismissed the argument *because* Jordan is "art side" rather than engaging with the logic, they committed a credibility deficit based on identity. Riley correctly identifies the **counterfactual test**: Would this dismissal have happened if the speaker had a different identity (e.g., a Master's degree)? If the answer is no, it is likely epistemic injustice.

  **Riley's Claim:** *They threw out the whole message, including the part that was useful.*
  *   **Verdict:** **Correct.**
  *   **Why:** This highlights the *consequence* of the injustice. Because the managers deflated Jordan's credibility globally (treating them as a "non-knower"), they failed to extract the specific truth (the approval loop pattern) that was buried in the testimony.

  ### 3. Evaluating Casey's Moves
  **Casey's Claim:** *Jordan was mostly wrong (supply chain vs. approval loop). Dismissing a wrong idea isn't injustice.*
  *   **Verdict:** **Incorrect (Philosophically).**
  *   **Why:** This is the most common misunderstanding of epistemic injustice. You can suffer testimonial injustice even if you are wrong. If a police officer dismisses a witness's testimony because of their race, that is epistemic injustice, even if the witness was actually mistaken about what they saw. The wrong is done to the *person's capacity as a knower*, not just to the accuracy of the data. Casey is conflating **truth** with **credibility**.

  **Casey's Claim:** *Calling every dismissal of a bad idea "injustice" makes the concept useless.*
  *   **Verdict:** **Partially Correct (as a warning), but misapplied here.**
  *   **Why:** Casey is right that "concept inflation" is a risk. If we call every disagreement an injustice, the term loses meaning. However, Casey is wrong to apply that warning here. This isn't just a disagreement; it is a dismissal based on *social identity markers* (degrees/art vs. management). That fits the specific criteria for the term.

  **Casey's Claim:** *The "knowledge harm" requires the main claim to be true.*
  *   **Verdict:** **Incorrect.**
  *   **Why:** The harm is that Jordan was treated as less rational or less competent than they actually were. The fact that Jordan *did* have a true observation (the side pattern) proves they had credibility to offer, which was denied. But even if Jordan had been 100% wrong, the *act* of mocking them based on their degree would still be the injustice.

  ### 4. What Both Are Missing
  While Riley is much closer to the philosophical definition, both friends are missing three crucial nuances about how epistemic injustice actually works in practice.

  **A. The Distinction Between "Rude" and "Unjust"**
  Casey worries that this concept makes any rudeness an injustice. The missing piece is **systematic prejudice**.
  *   If a manager is just having a bad day and snaps at everyone, that's rudeness, not epistemic injustice.
  *   If a manager consistently discounts people from "non-technical" backgrounds because they hold a stereotype that "Art = Irrational" and "Data = Rational," that is epistemic injustice.
  *   **The Missing Link:** To confirm Riley's point, you have to ask: Is there a pattern here? Do these managers routinely dismiss non-degree holders? If so, it's structural injustice, not just one-off rudeness.

  **B. The "Bundle" Problem**
  Both friends are treating Jordan's statement as a single block (Right vs. Wrong). In reality, testimony is a bundle.
  *   Jordan offered a **Main Theory** (Wrong) + **Mechanism Observation** (Right).
  *   Epistemic injustice often happens when a listener treats a speaker as having **Global Credibility** (they are totally reliable) or **Zero Credibility** (they are totally unreliable).
  *   **The Missing Link:** The managers assigned Jordan *Zero Credibility* based on identity. A fair epistemic process would have assigned *Partial Credibility* (scrutinize the theory, but check the observation). By going straight to Zero, they committed the injustice.

  **C. The Timing of the Harm**
  Casey argues the managers were "vindicated" because the main cause was supply chain.
  *   **The Missing Link:** Epistemic injustice is a **procedural harm**, not an outcome harm. The wrong occurred the moment the managers laughed and referenced Jordan's lack of a Master's. The fact that Jordan was partially wrong about the supply chain does not retroactively fix the prejudice used in the meeting. You cannot justify bias by pointing out the biased-against person was mistaken about something else.

  ### The Verdict

  **Riley is right about the definition.**
  Riley correctly identifies that epistemic injustice is about the *process of listening* and the *reasons for dismissal*, not the ultimate truth of the claim. The managers used Jordan's identity (art background/no Master's) as a proxy for incompetence, which is the textbook definition of **testimonial injustice**.

  **Casey is right about the risk, but wrong about the case.**
  Casey is correct that we shouldn't label every disagreement an injustice (concept inflation). However, Casey is incorrect that Jordan being "mostly wrong" disqualifies this from being injustice. Casey is focusing on the *outcome* (supply chain), while the concept focuses on the *interaction* (credibility assessment).

  **The Referee's Ruling:**
  This **is** a case of epistemic injustice.
  1.  **Identity Prejudice:** The managers explicitly cited Jordan's lack of a Master's and "art side" background as the reason for dismissal.
  2.  **Credibility Deficit:** They did not engage with the argument; they mocked the source.
  3.  **Lost Knowledge:** Because they dismissed the speaker, they missed the true observation about the approval loop, which validates that Jordan *did* have knowledge to offer.

  **Advice for the Lunch Table:**
  Tell Casey that being wrong doesn't protect you from injustice. If a judge refuses to listen to a defendant because of their accent, that is injustice, even if the defendant is guilty. Tell Riley that to strengthen their argument, they should focus less on Jordan being "right about the side pattern" and more on the fact that the managers *refused to check* because of who Jordan was. That refusal is the injustice.
