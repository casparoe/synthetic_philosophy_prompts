          *   **Casey:** Argues it's *not* epistemic injustice. The main claim was false. Dismissing a false claim isn't an injustice, regardless of background. Calling it injustice makes the concept useless. The "true side observation" doesn't outweigh the "mostly wrong theory."
      *   **Task:** Evaluate each move, determine who is right about what, and identify if there's something both are missing about how the concept actually works.

  2.  **Deconstruct the Concept: Epistemic Injustice:**
      *   *Origin:* Miranda Fricker (2007).
      *   *Core Types:*
          *   **Testimonial Injustice:** Prejudice causes a hearer to give a deflated level of credibility to a speaker's word. (Key: Identity prejudice affects credibility judgment).
          *   **Hermeneutical Injustice:** Someone lacks the interpretive resources to make sense of their social experience due to structural inequality. (Less relevant here, but worth keeping in mind).
      *   *Key Criterion:* It's not about whether the speaker is ultimately *right* or *wrong* about the facts. It's about whether the *credibility judgment* was tainted by identity prejudice.
      *   *Nuance:* A speaker can be wrong, but still suffer testimonial injustice if they were dismissed *because* of who they are rather than *because* their argument was scrutinized and found lacking.

  3.  **Evaluate Riley's Arguments:**
      *   *Claim:* Dismissal based on credentials/background, not argument.
      *   *Assessment:* Strong. This aligns with Fricker's definition. If the managers laughed *because* Jordan is "art side/no Master's," that is identity prejudice affecting credibility.
      *   *Claim:* Unequal treatment (would have debated an engineer).
      *   *Assessment:* Strong. This highlights the counterfactual test often used in these discussions. If the *same argument* gets a different hearing based on the *speaker's identity*, that suggests bias.
      *   *Claim:* They threw out the useful part because of the messenger.
      *   *Assessment:* Strong. This illustrates the *consequence* of the injustice (loss of knowledge).

