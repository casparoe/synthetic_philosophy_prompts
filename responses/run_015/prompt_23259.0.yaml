      *   *Refinement:* Emphasize the **Muller-Satterthwaite Theorem**. It is the exact bridge for a physicist. It says SP $\iff$ Monotonicity (for SCFs). Arrow's proof essentially builds a "decisive set" which is a monotonicity argument.
      *   *Real Voting Rules:* Plurality is not SP (GS says it must be dictatorial, Plurality isn't, so Plurality is manipulable). Borda is not SP. Arrow doesn't tell you *how* they fail strategically, only that the social ordering is inconsistent. GS tells you *agents will lie*. This is a crucial distinction for "evaluating rules."

  8.  **Final Polish:** Ensure tone is respectful of expertise (no baby steps) but clear on social choice specifics. Avoid over-explaining the theorems themselves. Focus on the *mapping* and the *implications*.

      *   *Key Insight for the Physicist:* Arrow is about *aggregation consistency* (like thermodynamics). GS is about *mechanism stability* (like control theory or measurement).
