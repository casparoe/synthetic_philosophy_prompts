  **1. Role, Stakes, and Constraints**
  You serve as the Union Advisor to the bargaining committee. Every month, you face employer proposals for new automation or algorithmic systems. You have forty-eight hours to review technical documents and conduct worker interviews. You cannot commission outside engineering studies. You must issue a signed one-page recommendation: oppose, negotiate binding conditions, or accept with monitoring. The stakes are immediate: net job loss, work intensification, skill degradation, and the permanent capture of workplace knowledge as proprietary capital. Your audience is an executive board of non-specialists who need clear, theoretically grounded justification. You operate without web access or specialized Marxist training beyond this protocol. Your authority is advisory, but your analysis dictates the union's strategic posture on technological change.

  **2. The Procedure—Ordered Tests and Rules**
  **1. The Subsumption Test:** Ask workers: Did the technology arrive to fit your existing workflow, or did your workflow change to fit the technology? If the former, it is Formal Subsumption (capital using existing labor). If the latter, it is Real Subsumption (capital revolutionizing labor). *Judgment Flag:* Workers may not perceive subtle control shifts immediately.
  **2. The Tempo Distinction:** Determine who sets the rhythm. Marx distinguishes between machinery that extends the worker's physical capacity within their own rhythm (tool) and machinery that subordinates the worker to an externally determined tempo (automaton). If the system pauses work, sets speed, or dictates breaks, it is an automaton. This distinction changes the recommendation from "negotiate conditions" (tool) to "oppose" (automaton) unless wages rise significantly to compensate for loss of autonomy. The key is whether the worker serves the machine or the machine serves the worker. If the machine dictates the pace, the worker becomes an appendage.
  **3. The Knowledge Capture Test:** Identify if workers must input diagnostic heuristics or organizational tricks into a proprietary database. Does the system then use this data to bypass human judgment? If yes, living labor is objectifying into dead capital controlled by the employer. This converts collective skill into private property.
  **4. The Surplus Distribution Test:** Verify where the productivity gain goes. Does reduced necessary labor time translate to shorter hours with maintained wages, or into unemployment and speed-up? Request production data vs. labor hour data. *Judgment Flag:* Employer data may be opaque.

  **Decision Rules:**
  *   **Oppose:** Real Subsumption + Knowledge Capture + No Gain (Job loss/Speed-up). This confirms technology serves only surplus extraction and control.
  *   **Negotiate:** Real Subsumption + Gain (Shorter hours) OR Knowledge Capture + Monitoring Rights. Bind the employer to share productivity gains or grant data access.
  *   **Accept:** Formal Subsumption + No Job Loss + Safety Improvement. Monitor for drift into Real Subsumption.

  **3. Stop Points, Opposition Triggers, and Value Handoffs**
  Mandate **Opposition** if the procedure identifies Real Subsumption combined with net job loss and work intensification. This confirms the technology serves only surplus extraction. Mandate **Negotiation** if Real Subsumption exists but the employer offers reduced hours or wage premiums to offset skill degradation. Include non-negotiables: data ownership rights and algorithmic transparency. **Handoff to Board** when the procedure confirms material security (wages/hours) but flags craft erosion. This is a value conflict: does preserving craft identity outweigh economic security? The framework identifies the trade-off but cannot resolve the political choice. Flag this explicitly in your recommendation. The advisor identifies the material cost of dignity; the board must decide if that cost is payable. Do not recommend opposition if the only loss is prestige while wages and hours improve, unless the board directs otherwise based on long-term strategy.

  **4. Three Worked Cases**
  **(a) Robotic Welding:** The line eliminates half the team; remaining workers' tasks and pace are unchanged. **Analysis:** Formal Subsumption. The tool replaces labor but does not redesign the labor process for survivors. The Tempo Test is neutral (workers still control pace). **Result:** Negotiate. Since the labor process isn't fundamentally subordinated, oppose the job loss but accept the tech. Demand severance packages and retraining funds. The procedure treats this as a distributional conflict, not a control conflict.
  **(b) AI Scheduling:** Algorithm adjusts shift targets based on real-time performance data. **Analysis:** Real Subsumption. The Tempo Test fails (system sets rhythm). Knowledge Capture is active (performance data informs management). **Result:** Oppose. The system subordinates workers to an external logic and extracts behavioral data without shared gain. Recommendation: Reject unless algorithm is co-owned.
  **(c) Predictive Maintenance:** Mechanics enter failure patterns into a company database; system automates diagnostics; role reduces to sensor replacement. **Analysis:** Knowledge Capture is total. Real Subsumption is present. **Result:** Conditional Acceptance. **Why:** This yields an unwelcome answer. The procedure prioritizes the Surplus Distribution Test. If headcount remains stable and wages are maintained due to safety efficiencies, the material security outweighs the loss of diagnostic autonomy. The extraction of tacit knowledge is traded for job security, a materialist conclusion that privileges economic survival over craft identity. Strict monitoring of data usage is required to prevent future layoffs based on the captured knowledge.

  **5. Limits, Misfires, and Unsettled Cases**
  This procedure misfires where technical facts are ambiguous. Data ownership laws vary, making the Knowledge Capture Test hard to verify without legal counsel. The Subsumption Test relies on worker perception, which may lag behind technical reality (false negatives). Marx's framework assumes capitalist intent; it may flag benign safety tech as hostile control (false positives). Finally, the Surplus Distribution Test fails if labor-time accounting is opaque; if the employer hides productivity data, you cannot verify if gains are shared. In these gaps, judgment flags activate. You must decide based on class trust rather than empirical proof. The framework underdetermines cases where technology creates new, unclassified roles, leaving you without a metric for skill degradation. You must note these uncertainties in the final recommendation.
