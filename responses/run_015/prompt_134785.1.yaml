answer: |-
  # The Moral Status Decision Tree

  **Root Node: The Dimmer Switch Scenario**
  *Imagine a "fading human" scenario: a person gradually loses cognitive function and phenomenal intensity due to a slow-acting condition, moving from full health to a vegetative state to biological death. As they fade, does their moral weight (the wrongness of harming them) decrease smoothly like a dimmer switch, hold steady until a sudden drop like a light switch, or operate on a different mechanism entirely?*

  *   **A. It decreases smoothly (Continuous).** → *Go to Branch 1*
  *   **B. It holds steady then drops (Discontinuous/Threshold).** → *Go to Branch 2*
  *   **C. It depends on external factors, not internal fading (Non-Intrinsic).** → *Go to Branch 3*

  ---

  ## Branch 1: The Continuous Grounds
  *You believe moral weight scales with some internal metric. What is the unit of measurement?*

  **Node 1.1: The Pain Intensity Test**
  *If Entity X feels pain at 10% of the intensity of Entity Y, is harming X exactly 10% as wrong?*
  *   **Yes (Proportional Suffering).** → **Leaf 1: The Suffering Slider** (Classic Utilitarian Gradation). Moral weight is strictly a function of phenomenal capacity. A mosquito matters, just vastly less than a human.
  *   **No (Non-Linear Scaling).** → *Go to Node 1.2*

  **Node 1.2: The Complexity Test**
  *If we ignore pain, does a more complex system (more integrated information/neural connections) inherently possess more moral weight than a simpler one, even if both feel the same pain?*
  *   **Yes (Structural Value).** → **Leaf 2: The Complexity Curve** (Informational Integration). Status scales with cognitive/structural richness. A human is worth more than a mouse not just because of pain intensity, but because of the "depth" of the system being destroyed.
  *   **No (Atomic Value).** → *Go to Node 1.3*

  **Node 1.3: The Aggregation Test**
  *Does a single ant have non-zero moral status, or does status only emerge when enough units form a swarm?*
  *   **Single units have status.** → **Leaf 3: The Panpsychist Dust**. Every micro-entity has a tiny non-zero status. (Warning: Risks "fanaticism" where protecting dust motes outweighs humans).
  *   **Only aggregates have status.** → **Leaf 4: Cumulative Micro-Status**. Individual insects are effectively zero, but a swarm/colony crosses a threshold of collective integration. Killing a hive is wrong; killing a worker is negligible.

  ---

  ## Branch 2: The Discontinuous Grounds
  *You believe moral weight is stable until a specific threshold is crossed. What defines the threshold?*

  **Node 2.1: The Sentience Gate**
  *Is the ability to feel *anything* (even without complex thought) sufficient for full equal standing within the moral circle?*
  *   **Yes (Sentience is Sufficient).** → **Leaf 5: Animal Egalitarianism**. All sentient beings have equal right to life/consideration. A human and a pig are in the same tier; a rock is in the zero tier. (Note: Collapses into Binary if you deny degrees of *rights* within the tier).
  *   **No (Sentience is Necessary but Not Sufficient).** → *Go to Node 2.2*

  **Node 2.2: The Agency Threshold**
  *Does the entity require higher-order capacities (autonomy, rationality, future-planning) to enter the highest tier of protection?*
  *   **Yes (Rationality Required).** → **Leaf 6: The Personhood Tier**. Humans (or persons) are in a protected category; animals are in a lower category; things are zero. Killing a person is categorically different from killing an animal.
  *   **No (Biological Life Required).** → **Leaf 7: The Zero-Point View** (Thermostats = 0). Only specific biological configurations count. Anything without a nervous system is literally zero, not just "very low." (Warning: Incoherent if you cannot explain why a sleeping human counts but a temporarily disabled AI does not).

  ---

  ## Branch 3: The Non-Intrinsic Grounds
  *You believe moral status is not a property of the entity itself, but arises from context. What generates the status?*

  **Node 3.1: The Attention Test**
  *If a moral agent (human) is completely unaware of an entity's existence, does that entity have moral status?*
  *   **No (Status requires Attention).** → *Go to Node 3.2*
  *   **Yes (Status exists independently).** → **Leaf 8: Relational Embeddedness**. Status comes from being part of a social web or ecosystem, regardless of immediate attention. (e.g., A distant tribe member matters because they are part of "humanity," not because you are thinking of them).

  **Node 3.2: The Sleeping Human Test**
  *If status requires attention, does a sleeping human lose moral status while no one is watching them?*
  *   **Yes (Status Vanishes).** → **Leaf 9: Radical Contextualism**. Moral weight is literally activated by observation. A sleeping human is vulnerable but has no "rights" until woken/observed. (Warning: Highly counter-intuitive; risks collapsing into solipsism).
  *   **No (Status is Dispositional).** → **Leaf 10: Contextual Activation**. Status is potential. The sleeping human retains status because they *would* be attended to if needed. An ignored insect drops to near-zero because it lacks the disposition to enter the attention-scope.

  ---

  ## Collapse Warnings & Incoherence Flags

  **1. The "Binary Egalitarian" Collapse**
  *   **Conflict:** *Leaf 5 (Animal Egalitarianism)* often claims to be non-gradated, but if you admit that killing a human is *worse* than killing a mouse (due to grief, social loss, etc.), you have secretly adopted *Leaf 1 (Suffering Slider)* or *Leaf 2 (Complexity Curve)* for "secondary" wrongness.
  *   **Flag:** If you hold Leaf 5, you must argue that the *act* of killing is equally wrong, even if the *consequences* differ.

  **2. The "Contextual" Contradiction**
  *   **Conflict:** *Leaf 10 (Contextual Activation)* tries to save the sleeping human by appealing to "dispositional attention." However, if an insect is *capable* of entering attention (you could notice it), why does it not get the same dispositional status?
  *   **Flag:** This position requires a non-arbitrary rule for what counts as "attendable." If the rule is "things humans care about," the view collapses into Subjectivism.

  **3. The "Continuous Threshold" Instability**
  *   **Conflict:** Holding *Leaf 1 (Suffering Slider)* while maintaining a hard legal threshold for killing (e.g., "It's okay to kill anything below 0.5 status") is pragmatically necessary but logically unstable.
  *   **Flag:** You must admit this is a "policy heuristic," not a metaphysical truth.

  **4. Indistinguishable Positions**
  *   **Leaf 2 (Complexity)** and **Leaf 6 (Personhood Tier)** often yield identical practical conclusions (Humans > Animals). They only separate in edge cases (e.g., a highly complex AI vs. a brain-damaged human). If you don't care about AI, these leaves are functionally identical.
  *   **Leaf 3 (Panpsychist Dust)** and **Leaf 4 (Cumulative Micro-Status)** are indistinguishable unless you specify a "practical zero." If individual ants have 0.0000001 status, that is functionally zero. The distinction only matters if you believe the *sum* creates a *new* entity with emergent status, rather than just added math.

  ## Discussion Prompts for the Meetup
  *   **For Leaf 4 vs. Leaf 3:** "If I spray bug repellent, am I killing 1,000 entities or one 'swarm-entity'? Does the math change if the ants are scattered?"
  *   **For Leaf 10:** "If we discover an alien species that is sentient but biologically repulsive to us (so we never attend to them), do they have moral status?"
  *   **For Leaf 1:** "If we can upload a human mind but it runs at 10% speed (feeling 10% pain intensity), is it 10% as wrong to delete it?"
