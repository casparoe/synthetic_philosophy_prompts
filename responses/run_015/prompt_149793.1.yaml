answer: |-
  # Specification for Embedded Decision Rule

  ## 1. Requirements List

  The following requirements define the adequacy of a decision rule for an embedded, bounded, auditable agent.

  | ID | Requirement | Motivation (Case) | Tag |
  | :--- | :--- | :--- | :--- |
  | **R1** | **Computable Boundedness:** The rule must terminate using resources proportional to the agent's available compute; it cannot demand exact self-simulation or logical omniscience. | General Constraint | **Required** |
  | **R2** | **Source-Code Robustness:** The rule must yield optimal outcomes even when the environment (predictor/adversary) has full read access to the agent's source code. | Case N, C | **Required** |
  | **R3** | **Logical Correlation Sensitivity:** The rule must treat an act as correlated with outcomes determined by simulations or models of the agent's decision procedure, even absent causal influence. | Case N, X, M | **Required** |
  | **R4** | **Causal Independence:** The rule must not treat an act as influencing outcomes causally disconnected from the decision procedure's output (e.g., independent chance events). | Case G, X | **Required** |
  | **R5** | **Extortion Immunity:** The rule must not recommend transferring resources to an adversary whose action is already fixed, unless doing so logically prevents a worse outcome correlated with the agent's type. | Case X | **Conditional** (See §3) |
  | **R6** | **Copy Indifference:** The verdict must not depend on whether the agent is the "original" or a copy/simulation when inputs and code are identical. | Case M | **Required** |
  | **R7** | **Dynamic Consistency:** The rule must recommend policies that the agent will not want to deviate from later; it must support precommitment (binding). | Case P | **Required** |
  | **R8** | **Epistemic Symmetry:** Agents in relevantly identical epistemic situations must be prescribed identical actions. | Case M, T | **Required** |
  | **R9** | **Continuity of Verdict:** The recommended action must vary continuously with predictor accuracy, with explicit thresholds for switching behavior. | Case N | **Conditional** (Desirable for stability) |
  | **R10** | **Fairness Sensitivity:** The rule should distinguish between problems where reward tracks the *output* of the decision procedure vs. problems where reward tracks the *algorithm* itself unfairly. | Case X, C | **Required** (To resolve R5 conflict) |

  **Added Case: L (Logical Uncertainty).** A predictor rewards you if it proves (within a bounded time) that you will take Box A; otherwise Box B. It cannot simulate you fully, only search for proofs.
  *   **Forces:** Requirement R1 (Boundedness). A rule demanding full simulation fails L because the predictor cannot run it. The agent must reason about the predictor's limited proof search.

  ## 2. Verdict on Candidate Demands

  *   **Never treat an act as affecting something it causally cannot affect:** **Prejudice (Causalist).** Violates R3. Fails Case N and M. Agents must reason about logical influence, not just physical causality.
  *   **Rank acts by expected value conditional on the act:** **Prejudice (Evidential).** Violates R4. Fails Case G (Smoking Lesion). Correlations not mediated by the decision procedure (e.g., common causes) must be screened off.
  *   **Satisfy dominance whenever dominance applies:** **Required (with caveats).** "Dominance" must be defined over *logical counterfactuals*, not causal ones. If defined causally, it conflicts with R3 (Case N).
  *   **Never leave agent open to reliable separation from resources by adversary who finished acting:** **Conditional.** In Case X (XOR Blackmail), paying is logically required to avoid catastrophe correlation. "Immunity" (refusal) loses EV. This demand must be qualified by R10 (Fairness); if the problem punishes the *algorithm* rather than the *output*, immunity is preferred, but EV is sacrificed.
  *   **Verdict not depend on original/copy/simulation:** **Required.** Essential for R6. If the rule distinguishes based on "substrate," it fails Case M and violates physicalism.
  *   **Dynamically consistent / able to bind:** **Required.** Essential for R7. A rule that recommends precommitment in P but deviates later is useless for engineering.
  *   **Treat agents in identical epistemic situations identically:** **Required.** Essential for R8. Violation implies the rule relies on hidden indexicals not available to the agent.
  *   **Verdict vary continuously with predictor accuracy:** **Conditional.** Desirable for robustness, but logical thresholds (e.g., provability) may be discrete. Enforcing continuity may violate R1 (Computability).
  *   **Remain sound with full source code read access:** **Required.** Essential for R2. In environments with auditors or predictors (N, C), opacity is impossible.
  *   **Not demand logical omniscience:** **Required.** Essential for R1. Bounded agents cannot solve Halting Problems or know all logical consequences of their code.

  **Verdict on Case M (Mixed Policy):**
  The requirement set (specifically R3, R6, R8 + EV Maximization) **forces the capability for mixed policies**. In Case M, a deterministic policy running on identical inputs yields identical outputs, resulting in an empty box (0 EV). A stochastic policy (using private entropy) allows divergence, yielding positive EV. The rule must support stochastic output generation to satisfy the adequacy criteria in M.

  ## 3. Unsatisfiable Subsets & Trade-offs

  **Subset 1: N-Success + X-Immunity (Unqualified)**
  *   **Conflict:** To succeed in N (1-box), the agent must act as a "1-boxer" type, accepting logical correlation between its output and the prediction. In X (XOR Blackmail), this same logical correlation implies that if you are the type to Pay, the Simulation Paid, and the Demand is sent only if No Catastrophe. If you are the type to Refuse, the Simulation Refused, and the Demand is sent only if Catastrophe. Since Catastrophe >> Demand, the EV-maximizing move in X is to Pay.
  *   **Verdict:** **Unsatisfiable.** You cannot be the type favored in N (correlation-accepting) and simultaneously have "Immunity" (refusal) in X without sacrificing EV in X.
  *   **Resolution:** Drop unqualified **Extortion Immunity**. Replace with **Fairness Sensitivity (R10)**. Acknowledge that X is an "unfair" problem where the adversary punishes the algorithm's disposition rather than the act's consequence. The agent should Pay in X to maximize EV, accepting vulnerability to unfair logic, or Precommit (via P) to Refuse, accepting loss in X to deter future extortion. For a single-shot spec, **Maximize EV** takes precedence; Immunity is dropped.

  **Subset 2: Causal Dominance + G-Handling + T-Correctness**
  *   **Conflict:** "Causal Dominance" (act only affects causal descendants) + "G-Handling" (screen off common causes) defines Causal Decision Theory (CDT). In Case T (Transparent Newcomb), CDT sees the prediction is fixed. It 2-boxes (Dominance). However, the predictor in T predicts based on your *disposition*. If you are the disposition to 2-box, Box B is empty. You get Small Sum. If you were the disposition to 1-box, Box B is full. You get Large Sum.
  *   **Verdict:** **Unsatisfiable.** Causal Dominance forces the agent to be the type that loses the Large Sum in T.
  *   **Resolution:** Drop **Causal Dominance**. Replace with **Logical Dominance** (R3). The agent must recognize that its choice *is* the prediction in logical time.

  **Most Exclusionary Requirement:**
  **R2 (Source-Code Robustness).** This requirement excludes all theories that rely on causal graphs without logical nodes (CDT) or simple evidential conditioning (EDT). It forces the implementer to solve reflective consistency (Löb's Theorem issues). An agent that knows its own source code cannot simply simulate itself without risking infinite regress or inconsistency. Satisfying R2 requires proof-based decision theory or logical induction, which is computationally heavy and mathematically fragile.

  ## 4. Strategy Scoring

  | Strategy | Description | N (Newcomb) | G (Lesion) | X (Extortion) | M (Mirror) | P (Precommit) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Conditional Expectation** | Maximize $E[U \mid Act]$ (EDT) | **Pass** (1-box) | **Fail** (Quits habit) | **Fail** (Pays) | **Pass** (Correlates) | **Pass** |
  | **2. Counterfactual Influence** | Maximize $E[U \mid do(Act)]$ (CDT) | **Fail** (2-box) | **Pass** (Keeps habit) | **Pass** (Refuses)* | **Fail** (Same output) | **Fail** |
  | **3. Procedure Output** | Maximize $E[U \mid Output(Proc)]$ (FDT) | **Pass** (1-box) | **Pass** (Keeps habit) | **Fail** (Pays)** | **Pass** (Differs) | **Pass** |
  | **4. Whole Policy** | Maximize $E[U]$ from prior (UDT) | **Pass** (1-box) | **Pass** (Keeps habit) | **Fail** (Pays)** | **Pass** (Differs) | **Pass** |

  *\*CDT refuses X but risks Catastrophe (loses EV). \*\*FDT/UDT pay X to align with Sim (wins EV, fails "Immunity" intuition).*
  *Note: No standard strategy satisfies unqualified Extortion Immunity in X while winning N. Strategy 3 & 4 are required for the spec.*

  ## 5. Conclusion

  No rule satisfies the list as initially built if **Extortion Immunity** is interpreted as "Refuse X" and **Dominance** is interpreted as "Causal Dominance."

  **Relaxation Required:** You must relax **Extortion Immunity**. In a world where agents are simulated and predicted (N, X, M), logical correlation is a physical resource. Demanding immunity to extortion in X is demanding immunity to logical correlation, which breaks the mechanism required to win N. The specification must prioritize **Expected Value Maximization under Logical Correlation** over intuitive immunity to unfair adversaries. If the engineer requires immunity, they must accept suboptimal performance in Newcomb-like environments.

  **Final Instruction to Engineer:** Implement a **Logical Decision Theory** (Strategy 3 or 4). It must treat the agent's output as a logical fact that constrains simulations and copies (R3, R6). It must not demand self-simulation (R1). It must accept that in XOR Blackmail (X), paying is the rational action to minimize loss, despite the adversarial setup.
