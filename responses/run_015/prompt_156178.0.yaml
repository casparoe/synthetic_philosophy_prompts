answer: |-
  **MEMORANDUM**

  **FROM:** Office of Strategic Ontology & Administrative Efficiency
  **TO:** All Faculty, Staff, and Stakeholders
  **RE:** Dissolution of Center for Truth and Verification; Establishment of Disquotation Desk
  **DATE:** October 24, 2023

  Following the periodic efficiency review, the working group has voted to restructure the Center for Truth and Verification. The review concluded that truth is not a substantive property; therefore, there is nothing for a center like this to investigate or audit. Going forward, the Center will be replaced by a Disquotation Desk. The Desk's remit is to delete every occurrence of "is true" from university communications, on the grounds that calling a claim true adds nothing to just making the claim.

  **1. Operational Protocol**
  Staff are advised that assertions prefixed by "it is true that" will be edited to remove the prefix. For example, "It is true that the budget is balanced" will read "The budget is balanced." This optimization reduces linguistic overhead without altering content.

  **2. Generalization Constraints**
  Certain handbook clauses state that "All preceding policies are true." The Disquotation Desk cannot eliminate this truth talk without writing out an unending list of sentences. Consequently, such clauses will be marked "Pending Infinite Expansion" and treated as non-binding until stakeholders manually verify each preceding policy individually.

  **3. Blind Endorsement Policy**
  Regarding the recent Dean's address, a staff representative noted, "Whatever the Dean said is true." As the Desk cannot disquote propositions it does not know, this endorsement adds no information. Going forward, blind endorsements will be logged as null operators. Stakeholders must repeat the specific claim to endorse it.

  **4. Normative Standards**
  Faculty have objected that inquiry is supposed to aim at truth and that assertion has a correctness standard. The Office clarifies that truth is no more than a device for endorsement. Nothing here says inquiry isn't worth doing. Mission statements will be revised to remove "truth" as a target, replacing it with "assertoric correctness," which requires no metaphysical commitment.

  **5. Inter-Office Queries**
  The Office of Existence and the Office of Reference have sent anxious notes, suggesting the same style of argument would seem to deflate them too—existence is just the quantifier, reference is just disquotation again. The Office finds this analogy unprincipled. Do not contact these units. Their functions remain substantive despite linguistic parallels.

  **6. Budget Reallocation**
  Because truth isn't a property with a nature to be investigated, the memo closes the fact-checking and evidence-audit unit and reallocates its budget. Verification is now a linguistic adjustment, not an investigative process. Funds will be moved to the Office of Strategic Ontology. The Center regrets any inconvenience this may cause regarding factual accuracy.

  **7. Compliance Self-Audit**
  A final compliance check noted this document claims to be accurate. Accuracy implies truth. The memo has to admit it has no tools for analyzing this claim—not because it hasn't thought about it, but because on its own view there is no property there to analyze. The document stands unverified.

  **Assistant Dean L. V. Quiney**
  *Department of Administrative Logic*
