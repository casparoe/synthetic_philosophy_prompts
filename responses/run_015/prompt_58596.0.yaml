answer: |-
  What you are describing is one of the most famous and debated problems in the philosophy of art and aesthetics. You have intuitively identified a distinction that scholars spend careers analyzing: the difference between **emotional resonance** (passive) and **moral agency** (active).

  There is no single word that captures the entire pattern, but there is a specific framework of terms that explains exactly what is happening to you. Here is a breakdown of the existing ideas, how they distinguish your experiences from "pretending," and a proposed definition to separate the two cases you described.

  ### 1. The Passive Case: The Paradox of Fiction
  Your experience with the lighthouse keeper and the novel falls under a classic philosophical problem called **The Paradox of Fiction**.

  First articulated formally in the 20th century (though discussed since Aristotle), the paradox asks: *How can we feel genuine emotions for characters we know do not exist?*
  *   **Premise 1:** To feel fear or sadness, we must believe the object of our emotion exists.
  *   **Premise 2:** We know fictional characters do not exist.
  *   **Premise 3:** Yet, we feel fear and sadness anyway.

  **Why you aren't "being fooled":**
  Early theories suggested "Suspension of Disbelief" (Coleridge), implying we temporarily pretend the fiction is real. However, your description contradicts this. You stated you were "fully aware that neither the keeper nor the dog ever existed." Therefore, you were not under an illusion.

  **The Leading Explanation: Thought Theory**
  The philosopher Noël Carroll proposed **Thought Theory**. He argues that you are not reacting to the *existence* of the dog, but to the *content of the thought* of the dog. Your brain processes the *proposition* ("A dog is suffering in a storm") and triggers the emotional machinery associated with that proposition, regardless of whether the event is actually happening in reality.

  **Why you felt embarrassed:**
  The embarrassment you felt about being angry at the stepmother is called **Meta-Emotion**. This is an emotion about an emotion. You felt anger (primary), then you evaluated that anger as "irrational" because the target wasn't real, leading to embarrassment (secondary). This proves your brain *was* tracking the boundary between fiction and reality the whole time.

  ### 2. The Active Case: Ludic Agency and Complicity
  Your experience with the game design club is fundamentally different. In the film, you were a **witness**. In the game, you were an **agent**.

  In game studies, this is often discussed under **Moral Agency in Interactive Fiction**. When you watch a film, the director is responsible for the tragedy. When you play a choice-based game, the *mechanic* transfers the responsibility to you.

  **The Shift from Empathy to Complicity:**
  *   **Passive (Film/Book):** You feel *sympathy* or *empathy*. You suffer *with* the character.
  *   **Active (Game):** You feel *complicity*. You suffer *because of* your action.

  The guilt you felt is sometimes referred to informally as **"Ludic Guilt"** or **"Gamer's Guilt."** It occurs when the rules of the game (the "ludic" element) force you to violate your real-world moral code to progress or complete a task. Because you had to physically press a button or make a selection to cause the harm, your brain registers it as an action you took, not just an event you saw.

  **Why you wanted to replay:**
  This is known psychologically as **Counterfactual Thinking**. Because you had agency, your brain simulates alternative outcomes ("If I had chosen the other villager..."). In a film, you cannot simulate an alternative outcome because you had no control. In a game, the existence of an unchosen path creates a psychological "open loop" that generates regret.

  ### 3. Distinguishing from Pretending and Real Life
  You asked how this differs from pretending or caring about real people. Here are the boundaries:

  | Feature | Real Life Emotion | Pretending / Acting | Fictional Emotion (Your Experience) |
  | :--- | :--- | :--- | :--- |
  | **Belief** | You believe the threat/event is real. | You know it is fake and suppress real emotion. | You know it is fake but allow the emotion. |
  | **Action** | You are compelled to act (call 911, fight). | You act only to portray a character. | You feel an urge to act, but know action is impossible (film) or limited (game). |
  | **Aftermath** | Lingering trauma or relief. | No lingering emotional residue. | **Lingering mood** (sadness/guilt) but fades faster than real trauma. |
  | **Object** | A real person/entity. | Nothing (the emotion is feigned). | A **simulated entity** (mental construct). |

  **The Boundary:**
  The boundary lies in **consequence**. If you cried at the lighthouse film and then called animal control to try to save the dog, you would have crossed the boundary into delusion. As long as you understand the *consequences* are contained within the story, the *emotion* is safe to experience. This is why we seek out sad movies: we get the chemical release of crying without the actual tragedy.

  ### 4. Proposed Definitions
  Since there is no single dictionary term that perfectly separates your two experiences, based on the theories above, here is a clear proposed definition set that you can use for your class discussions.

  #### A. Simulated Resonance (The Passive Case)
  > *The experience of genuine physiological and psychological emotion triggered by a known-fictional narrative, where the subject understands they are a **witness** without causal power. The emotion is a response to the **concept** of the event rather than the reality of it.*
  > * **Example:** Crying at the lighthouse keeper; anger at the stepmother.
  > * **Key Mechanism:** Empathy via Thought Theory.
  > * **Responsibility:** Zero.

  #### B. Enacted Complicity (The Interactive Case)
  > *The experience of moral distress or guilt triggered by a known-fictional narrative, where the subject understands they are an **agent** with causal power. The emotion is a response to the **execution of a choice** within a rule-based system.*
  > * **Example:** Guilt over saving one villager over another in the game.
  > * **Key Mechanism:** Moral Agency via Interactivity.
  > * **Responsibility:** Perceived (even if the outcome was programmed).

  ### Summary for Your Class
  If you need to summarize this for your teacher or friends, you could say:

  > "I've been researching this, and it turns out my reaction to the film is called the **Paradox of Fiction**. My brain reacts to the *thought* of the dog dying, even though I know it's fake. But the game was different. That wasn't just empathy; it was **Moral Agency**. In the film, I was a witness to a tragedy. In the game, the mechanics made me a **participant** in the tragedy. That's why the first made me sad, but the second made me feel guilty."

  This distinction validates your feelings: you aren't "confused" or "irrational." You are experiencing the unique power of storytelling to hack our social and moral instincts, first through observation, and second through simulation.
