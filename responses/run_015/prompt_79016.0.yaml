      *Revised End:* ...I will draft responses to objections from metaphysicians and art theorists. The final weeks synthesize findings into a coherent argument accessible to the panel. I will ensure the language remains accessible to the grant panel while maintaining philosophical rigor. This includes refining key terms so historians see the relevance to material culture. The process is iterative; if a case proves too ambiguous, I will refine it, as the ambiguity itself may be data. I will also ensure the final paper is suitable for submission to an interdisciplinary journal.
      (295 words). Close enough.

      *Success and Failure:*
      Success looks like finding a case that one or more views cannot handle without unacceptable theoretical costs. If the two-object view implies objects pop in and out of existence too freely, or if the deflationary view cannot explain why the distinction matters to practitioners, that is a positive result. It narrows the field of viable metaphysical theories. However, failure is also a result. If every view absorbs every case with minor adjustments, the project demonstrates that the debate is more resilient than expected, but also potentially less substantive. This deflationary outcome is still worth funding because it shows that the dispute may not be resolvable through case intuition alone. It suggests the need for new criteria beyond standard thought experiments. Either way, the project clarifies the limits of current metaphysical tools when applied to complex material cultures. It reveals whether our ontology is sensitive to institutional facts or blind to them. Even a negative result advances the field by showing where the current frameworks are too flexible. For historians, this clarifies whether metaphysical categories can support art historical claims about object identity.
      (195 words). Need ~200.
      *Add:* "It provides a clearer foundation for discussing material continuity in cultural heritage."
      (210 words).

      *Scope and Risks:*
      The main risk is scope creep regarding art historical theory. Analyzing the institutional definition of art could become a project in itself. To stay within twelve weeks, I will treat the art status as given data rather than arguing for it. If a case proves too contested, I will replace it with a clearer example. Technical adjustments pose a risk. If a view requires complex modification, I will note the cost rather than fully developing the new theory. The goal is to test existing views, not build new ones. This ensures the project remains a test of robustness rather than a constructive system-building exercise, keeping it feasible for a summer grant.
      (125 words).

