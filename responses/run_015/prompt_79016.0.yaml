      *Summary:*
      This project investigates a classic metaphysical puzzle: when a statue is made of clay, are there one object or two? Standard answers claim there are two co-located objects, only one object described differently, or that the disagreement is merely verbal. These views are typically tested against thought experiments involving destruction or gradual replacement. I propose testing them against real-world cases from artistic practice where an object's status changes reversibly or depends on institutional context. I will examine works existing only as instructions, ordinary objects exhibited as art, and conserved artworks with replaced material. Over twelve weeks, I will determine whether these cases distinguish between the metaphysical views or whether all views can absorb them through minor adjustments. This work clarifies the boundaries between metaphysical reality and conceptual convention, offering insights to art history and material culture studies on counting and valuing objects.
      (129 words).

      *The Question:*
      The core question is not simply which metaphysical view is correct, but whether current views can account for objects whose identity conditions shift over time without material change. Standard debates assume stable sortals: a lump is always a lump, a statue is always a statue until destroyed. My inquiry asks: what determines the count of objects when the criteria for being a specific kind of thing are unstable or reversible? If a pile of parts becomes an artwork solely through exhibition, does a new object come into existence, or does an old one change properties? If conservation replaces all material, does the object persist? I seek a determinate answer regarding whether these transitions involve ontological change—the creation or destruction of entities—or merely changes in description. Resolving this requires isolating whether the difference lies in the world or in our conventions for counting. The project aims to establish if metaphysical theories can predict outcomes in these unstable cases better than deflationary accounts that attribute the variation to language use alone. Ultimately, I ask whether the ontology of art objects reveals a gap in general metaphysics that standard cases obscure.
      (186 words).

      *Why Existing Positions Leave It Open:*
      The three dominant positions each rely on cases where material and functional histories diverge cleanly. The two-object view argues distinct entities share space but differ in persistence conditions; however, it assumes these conditions are fixed at creation. The one-object view argues identity is relative to description, but struggles when descriptions shift without clear material markers. The deflationary view argues the dispute is verbal, yet owes an account of what constrains our conventions. None adequately address cases where sortal status is reversible. For instance, when a manufactured item becomes art via exhibition, then reverts to storage, the two-object view must explain if an object pops in and out of existence. The one-object view must clarify if the object's identity changes or remains constant despite shifting kind-membership. The deflationary view must explain why these shifts feel substantive rather than merely linguistic. Because standard tests use irreversible destruction, they mask the difficulty of handling temporary status changes. Consequently, each position can currently claim compatibility with the data only because the data lacks this specific complexity. The transition points are treated as decisive moments of creation or destruction in standard theory. In the art cases I propose, the transition is institutional and potentially reversible, challenging the notion that ontological status must be tied to physical modification. This leaves open whether the metaphysical frameworks are robust enough to handle non-physical criteria for existence, or if they must be revised to accommodate social and institutional facts as constitutive of objecthood. This project exposes that gap, showing the debate's stability rests on examples that do not stress persistence mechanisms like artistic practice does.
      (248 words).

      *Method and Plan:*
      The twelve weeks will be divided into three phases. Weeks one through four focus on case formulation. I will work with art historical materials to describe three specific types of cases precisely: instruction-based works realized temporarily, readymades exhibited and then de-accessioned, and conserved works with replaced matter. The goal is to state these cases without rigging them to favor any metaphysical view, ensuring the description remains neutral regarding object counts. This involves distinguishing the physical history from the institutional history to see where they diverge. Weeks five through eight involve applying the three metaphysical positions to these cases. I will derive specific predictions for each view: how many objects exist at each stage, and what changes occur during transitions. This requires working out whether each view needs to adjust its definitions of 'object' or 'convention' to accommodate the data. I will map the cost of these adjustments: does the two-object view require mysterious temporary entities? Does the deflationary view require implausible claims about language use? Weeks nine through twelve focus on evaluation. I will assess whether the adjustments required are trivial or substantial. If a view requires significant revision to handle the cases, it counts as a point against it. If all views absorb the cases easily, I will analyze why the debate remains unresolved. The output will be a paper detailing these tests and their outcomes. This phased approach ensures I move from description to analysis without getting bogged down in excessive case hunting. It prioritizes depth over breadth, ensuring the selected cases are robust enough to carry the argument. I will draft responses to objections from metaphysicians and art theorists. The final weeks synthesize findings into a coherent argument accessible to the panel. This includes refining key terms so historians see the relevance to material culture. The process is iterative; if a case proves too ambiguous, I will refine it, as the ambiguity itself may be data.
