  Currencies
  The theory must identify the moral currency neural metrics track. It cannot treat brain size as a direct moral unit; it must specify whether it tracks suffering capacity, cognitive richness, or integrative complexity. Is neural quantity evidence of status or constitutive of it? If constitutive, which property matters? If evidence, what is the underlying property? The theory must declare if the currency is physical (neurons) or phenomenological (experience), as institutional weighting requires converting one to the other. Without this, it fails the supervisor's test of being a stand-in. It must resolve whether value lies in hardware or software, ensuring empty processing power lacks value.

  Requirements
  1. **Metric Specificity.** When absolute size, total neuron count, and forebrain count dissociate, the theory must select one as the moral proxy. (Case: Dissociation). Tag: Non-negotiable. Ambiguity prevents institutional calculation. It must define which measure constitutes moral weight when biological realities diverge. If density falls as size grows, does moral weight plateau or drop? The theory must provide a formula that yields a single number despite biological trade-offs, ensuring that decision-makers are not left guessing which biological feature triggers moral protection.

  2. **Phenomenal Link.** Neural quantity must be constitutive of or evidence for experience, not merely present. Redundant or sequestered tissue cannot add weight. (Case: Duplicate-Module/Insulated-Upgrade). Tag: Non-negotiable. This prevents counting "zombie" tissue. If duplicate neurons do not create duplicate experience, they should not create duplicate weight, ensuring moral weight tracks valence relevance. The theory must explain why metabolically expensive tissue that does not influence suffering fails to generate moral claims.

  3. **Temporal Neutrality.** The theory must define if weight scales with subjective tempo or clock time. (Case: Slow-Giant). Tag: Non-negotiable. This determines if slow lives count less per century. It clarifies whether richness per moment or number of moments per unit clock time drives the valuation in cost-benefit exercises. If a species lives slower, does it accumulate less moral weight over a calendar year? The theory must specify whether the unit of account is the subjective moment or the objective second.

  4. **Intra-Species Consistency.** The theory must state if moral status scales with brain growth or injury within a single life. (Case: Within-Life Variation). Tag: Negotiable (egalitarian vs. scaling camps). This addresses whether adults count more than juveniles or if resection reduces status, impacting how we value individuals over time. If brain mass determines weight, juveniles count for less. If the theory denies this, it must explain why neural metrics apply across species but not within them, requiring a principled boundary for status stability.

  5. **Conceptual Separation.** The theory must distinguish whether neural facts track moral status, welfare magnitude, or death badness. (Case: General Distinctions). Tag: Non-negotiable. This prevents category errors in cost-benefit analysis. Confusing the badness of death with the weight of welfare leads to inconsistent prioritization in research spending. A being might have low capacity for suffering but a high interest in continuing to live; the theory must specify which neural facts inform which moral category.

  6. **Lower Bound Viability.** The theory must account for flexible behavior in minimal brains without inflating their status disproportionately. (Case: Very Small). Tag: Non-negotiable. This ensures shrimp and insects are handled correctly. A viable theory cannot assign human-level weight to tiny brains simply because they exhibit flexible learning. It must accommodate the intuition that behavioral flexibility alone does not equate to high moral status, requiring a threshold or scaling function that respects both complexity and physical limitations.

  Where the List Breaks
  The tension lies primarily between Operationalizability and the Phenomenal Link. Institutions require hard, measurable numbers like neuron counts, but morality likely tracks subjective experience, which is not directly measurable. The Duplicate-Module case exposes this: neurons can double without experience doubling. If you prioritize Measurement, you fail the Phenomenal Link by counting empty tissue. If you prioritize Phenomenal Link, you lack institutional metrics, rendering the theory unusable for cost-benefit analysis. Furthermore, Temporal Neutrality clashes with Measurement. Subjective tempo is impossible to measure objectively across species. We cannot know if a slow giant experiences fewer moments per clock hour. Thus, the theory demands data we cannot in principle gather, violating the usability constraint. The list breaks because the demand for public, measurable criteria conflicts with the private, phenomenological nature of the value being measured.

  The Most Exclusionary Requirement
  The Phenomenal Link requirement does the most work in knocking out otherwise popular theories. It invalidates pure physicalist views that equate neuron count directly with moral weight. If duplicate neurons do not create duplicate experience, they should not create duplicate weight. This forces theories to bridge the explanatory gap between physical substrate and conscious experience, which most cannot do operationally. Simple aggregate views fail here because they count tissue rather than function. By demanding that neural facts must track valence-relevant experience rather than mere computational capacity, this requirement eliminates any theory that treats the brain as a moral counter without explaining why that specific physical property generates moral significance. It demands a bridge principle that most materialist accounts lack, leaving few viable candidates for institutional use.

  Scorecard
  Sentience-based views satisfy the Phenomenal Link but fail Operationalizability, as suffering is hard to measure. NeuronAggregate views satisfy Measurement but fail the Duplicate-Module case, counting redundant tissue. Higher-Order views fail the Very Small and Within-Life cases, excluding infants and animals arbitrarily. Specifically, they struggle with the Within-Life Variation case, where brain damage might remove higher-order capacities without ending sentience. Information-Integration views handle Duplicates well by focusing on unity, but lack clear metrics for institutional weighting, failing the Metric Specificity requirement. Relational or social views fail Institutional isolation contexts, as they cannot weight beings outside social structures, making them unsuitable for wildlife management. Ultimately, no view satisfies all non-negotiable requirements. Sentience views are morally robust but practically useless for cost-benefit analysis. Aggregate views are practically useful but morally vulnerable to counterexamples. The seminar must choose between moral accuracy and institutional usability, as the desiderata reveal no theory currently bridges this gap successfully.
