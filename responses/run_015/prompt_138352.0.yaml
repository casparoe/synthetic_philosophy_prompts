answer: |-
  You are correct that the sentence is doing three different jobs at once. In Hohfeldian terms, the word "right" is being used to describe a **claim-right** (I am owed something), an **immunity** (you cannot take something from me), and a **privilege/liberty** (I am free to do something). When speakers swap these mid-argument, they create logical illusions.

  Here is the menu of five distinct readings of "housing is a human right," evaluated by their coherence, duty-bearers, and policy implications for your board.

  ### 1. The Immunity Reading (The Shield)
  *   **The Claim:** No person shall be arbitrarily deprived of the housing they currently occupy.
  *   **Hohfeldian Incident:** **Immunity.** You have an immunity against the state (or landlord) changing your status from "housed" to "homeless" without due process or cause.
  *   **Duty-Bearer:** The State (police power/courts) and Landlords (contract law).
  *   **Holder:** Current occupants.
  *   **Remedy/Level:** Protection from eviction, demolition, or condemnation without replacement.
  *   **Evaluation:** **Substantive and Defensible.** This is the basis of tenant protection laws and eminent domain compensation. It is legally recognized in many jurisdictions.
  *   **Policy Impact:** **Neither.** This reading protects the status quo. It does not mandate new construction (YIMBY) nor does it mandate affordability covenants on new private buildings (Neighbors). It only stops displacement of existing residents.
  *   **Speaker Diagnosis:** Neither speaker is actually using this. It's the baseline legal floor, not a planning tool.

  ### 2. The Provision Reading (The Entitlement)
  *   **The Claim:** If a person cannot secure housing through the market, the state must provide it to them directly.
  *   **Hohfeldian Incident:** **Claim-Right.** You have a claim against the state for performance (a unit or voucher).
  *   **Duty-Bearer:** The State (specifically the legislature/appropriations body, not the planning board).
  *   **Holder:** Households in general (regardless of location).
  *   **Remedy/Level:** Shelter sufficient to prevent homelessness.
  *   **Evaluation:** **Substantive but Resource-Constrained.** Morally defensible to many, but in the U.S., this is not a positive legal right. It requires tax revenue, not zoning changes.
  *   **Policy Impact:** **Neither (technically), but leans Neighbor.** If this reading were true, the planning board is the wrong venue; the town council needs to build public housing. However, Neighbors often misuse this to argue that *private* developers must fulfill this public duty (see Reading 4).
  *   **Speaker Diagnosis:** The **Neighbors** are implicitly relying on this, but they are shifting the duty-bearer from the *Town* to the *Developer*. They are arguing: "Because housing is a right, the Town must ensure it; therefore, the Town must force the Developer to provide it; therefore, if the Developer won't, the Town must stop them."

  ### 3. The Access Reading (The Liberty)
  *   **The Claim:** The state cannot make it illegal for consenting parties to create or exchange housing.
  *   **Hohfeldian Incident:** **Privilege/Liberty.** Developers have a privilege to build; residents have a privilege to buy/rent. The state has a "no-right" to interfere via zoning.
  *   **Duty-Bearer:** The State (Zoning/Planning).
  *   **Holder:** Potential residents (migrants) and Suppliers (developers).
  *   **Remedy/Level:** Removal of regulatory barriers (legalizing multi-family).
  *   **Evaluation:** **Defensible (Libertarian/Market view).** This frames housing as a commercial activity that shouldn't be criminalized by zoning.
  *   **Policy Impact:** **YIMBY.** This directly supports legalizing apartments everywhere. It argues that the *violation* of the human right is the zoning law itself, which prevents housing from existing.
  *   **Speaker Diagnosis:** The **YIMBY** is using this reading. To them, "Housing is a human right" means "The government has no right to stop housing from being built."

  ### 4. The Price Reading (The Economic Guarantee)
  *   **The Claim:** Housing must be priced within a specific ratio of household income to be considered "housing" rather than a luxury good.
  *   **Hohfeldian Incident:** **Claim-Right.** A right to a specific *price point*, enforced against the market.
  *   **Duty-Bearer:** Private Market (regulated by State).
  *   **Holder:** Income-qualified households.
  *   **Remedy/Level:** Affordability covenants, rent control, or inclusionary zoning.
  *   **Evaluation:** **Operationally Incoherent as a "Right."** You cannot have a human right to a specific price in a private market without a subsidy. If you mandate below-market prices without subsidizing the difference, you reduce supply (making the right harder to fulfill for others).
  *   **Policy Impact:** **Neighbors.** This supports the argument: "Do not approve market-rate units because they do not fulfill the right to *affordable* housing."
  *   **Speaker Diagnosis:** The **Neighbors** are explicitly using this. They are conflating "Right to Housing" with "Right to Subsidized Housing."

  ### 5. The Location Reading (The Anti-Exclusion)
  *   **The Claim:** A person has a right to reside in a specific jurisdiction (e.g., this town), not just *somewhere*.
  *   **Hohfeldian Incident:** **Claim-Right.** A right against exclusionary zoning.
  *   **Duty-Bearer:** The Local Municipality.
  *   **Holder:** Outsiders/Migrants (people who want to live here but can't).
  *   **Remedy/Level:** Legalization of higher density in high-opportunity areas.
  *   **Evaluation:** **False (in U.S. Law).** There is no constitutional right to live in a specific town. However, some state laws (like MA's 40B or NJ's Mount Laurel) create statutory versions of this.
  *   **Policy Impact:** **YIMBY.** This supports the argument that single-family zoning is an illegal exclusionary barrier.
  *   **Speaker Diagnosis:** The **YIMBY** is implicitly using this. When they say "legalize apartments everywhere," they are asserting a right of entry for people currently excluded by price/zoning.

  ---

  ### The Conflict Matrix

  Here is how the readings map to the conclusions you are hearing:

  | Reading | Core Entitlement | Supports Neighbors? | Supports YIMBY? | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Immunity** | Don't make me homeless. | **No** | **No** | Protects existing tenants, doesn't dictate new supply. |
  | **2. Provision** | State must house me. | **Yes (distorted)** | **No** | Neighbors use this to demand affordability, but wrongly place the burden on private developers. |
  | **3. Access** | Don't stop me building/buying. | **No** | **Yes** | YIMBYs view zoning as the rights violation. |
  | **4. Price** | Housing must be cheap. | **Yes** | **No** | Neighbors view market-rate pricing as the rights violation. |
  | **5. Location** | I can live in *this* town. | **No** | **Yes** | YIMBYs view exclusionary zoning as the rights violation. |

  ### Why the Sentence Settles Nothing

  Your suspicion is correct: the slogan is not doing the work they think it is.

  1.  **The Neighbors' Logical Gap:** They are combining **Reading 2 (Provision)** with **Reading 4 (Price)**.
      *   *Premise:* The Town has a duty to ensure housing is affordable (Reading 2/4).
      *   *Leap:* Therefore, the Town must stop private actors from building unaffordable units.
      *   *The Flaw:* If housing is a human right (Claim-Right to Provision), the duty-bearer is the **Town**, not the **Developer**. By blocking the Developer, the Town reduces the total housing stock, likely raising prices for everyone else, which *violates* the right for more people. They are using a "Right to Housing" to argue for "Less Housing."

  2.  **The YIMBY's Logical Gap:** They are combining **Reading 3 (Access)** with **Reading 5 (Location)**.
      *   *Premise:* People have a right to build and live where they choose (Reading 3/5).
      *   *Leap:* Therefore, the Town must approve this specific 12-unit building.
      *   *The Flaw:* While zoning reform may be necessary to fulfill the right, approving a specific project is a **Privilege** granted by the board, not a **Claim-Right** of the developer. However, their logic is internally more consistent than the Neighbors': increasing supply generally aids affordability, whereas restricting supply harms it.

  ### Which Reading Should You Use?

  As a planning board member, you are operating in a regulatory capacity, not a welfare capacity.

  *   **Discard Reading 2 (Provision):** Your board does not have a budget to build public housing. That is a Town Council/Select Board appropriation issue. You cannot zone a building into affordability without subsidies.
  *   **Discard Reading 4 (Price) as a Veto:** You cannot enforce a "right to affordable prices" on private market actors without a public subsidy mechanism (like inclusionary zoning funds). Using it to block market-rate housing is legally vulnerable and economically counterproductive.
  *   **Focus on Reading 3 (Access) and 1 (Immunity):**
      *   **Reading 3** asks: "Does our zoning code illegally prevent housing from existing?" (This is the YIMBY point).
      *   **Reading 1** asks: "Does this project displace existing residents without cause?" (This is the Neighbor concern, but limited to *existing* residents, not the abstract concept of the neighborhood).

  ### Summary Diagnosis

  *   **The Neighbors** are using **"Housing is a Human Right"** to mean **"Housing is a Public Utility."** They believe the town should control the price and distribution. Since the town won't build it, they want to veto private supply that doesn't meet public utility standards. This is a **Claim-Right** against the market.
  *   **The YIMBY** is using **"Housing is a Human Right"** to mean **"Housing is a Civil Liberty."** They believe the town is infringing on the freedom to shelter oneself. This is a **Privilege/Immunity** against the state.

  **The Verdict:** The YIMBY's reading is legally more robust in a planning context (zoning regulates liberty), whereas the Neighbors' reading requires fiscal appropriation (welfare regulates price). If you treat "Housing is a Human Right" as a **Claim-Right to Provision**, you must vote "No" on everything until the town budgets for public housing. If you treat it as a **Liberty to Shelter**, you must vote "Yes" on anything that adds stock without harming existing occupants.

  You cannot have it both ways. If the right is real, blocking supply violates it more than allowing market rates does.
