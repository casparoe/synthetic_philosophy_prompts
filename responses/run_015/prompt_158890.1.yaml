      *   "Cantor refuted": Defuse when establishing $M \models \text{Cantor's Theorem}$.
      *   "Enumeration exists/Model misses it": This is the resolution, not a misconception. The misconception is "The model is too small to hold it." The correction is "The model is not closed under that function."
      *   "FOL defect": Defuse at the very end as a "road not taken."

      *Refining the "Refusal":*
      *   Don't explain the proof of LS. It's technical and irrelevant.
      *   Or: Don't explain how to define "truth in a model" (Tarski). Too deep.
      *   Best: Don't explain *which* model is the "intended" one. That's the topic for next week.

      *Refining the Final Question:*
