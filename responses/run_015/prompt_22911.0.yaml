      *   **Framework 4: Systems as Probability Structures:** Explain how "systems" cause things by altering base rates of human error (James Reason's Swiss Cheese).
      *   **Practical Advice for the Write-up:** How to phrase this academically. Avoid "blame," focus on "contributing factors" and "levels of analysis."
      *   **Conclusion:** Reconcile the two views. They are looking at different slices of the same causal cake.

