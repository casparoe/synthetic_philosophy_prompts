answer: |-
  This is not a single problem. It is three distinct problems layered on top of one another, which is why your intuition is sending conflicting signals. You are experiencing a **contractual problem**, a **political problem**, and a **solidarity problem** simultaneously. Treating them as one moral dilemma ("Am I a bad person?") obscures the mechanics of what is actually happening.

  Here is the breakdown of the three problems, followed by an analysis of your specific questions regarding free-riding, leisure, and obligation.

  ### 1. The Three Problems

  **Problem A: The Contractual Compliance (You vs. The Company)**
  *   **The Fact:** You have a contract for 35 hours. You are fulfilling it. Your efficiency (cases per hour) has increased, meaning you are not shirking; you are optimizing within the agreed constraints.
  *   **The Status:** You are in compliance. Your teammates are technically in violation of labor policy (unauthorized overtime), even if voluntary.
  *   **The Wrongness:** There is no contractual wrongness in your position. You are the only person currently validating that the 35-hour policy is real. If you work overtime, you destroy the data point that proves the policy works *if* headcount is adjusted.

  **Problem B: The Information Asymmetry (The Team vs. Management)**
  *   **The Fact:** Management sees "Queue Cleared" and infers "Workload matches Headcount."
  *   **The Reality:** The queue is cleared because "Hours Worked > Hours Paid."
  *   **The Dynamic:** Your manager is citing team performance to argue against hiring. This means your teammates' unpaid labor is being converted into capital for the company (saved salary costs).
  *   **The Wrongness:** The exploitation here is structural. The manager is knowingly or negligently accepting unpaid labor to balance a budget. By staying silent, the team is allowing management to operate on false data.

  **Problem C: The Collective Action/Solidarity (You vs. Your Teammates)**
  *   **The Fact:** You benefit from their labor because the team metric (queue clearance) remains high, protecting the team from scrutiny. One teammate is physically deteriorating (chest pains).
  *   **The Dynamic:** This is a classic "public goods" game. If everyone defects (works only 35 hours), the queue balloons, management panics, and *then* they might hire (or they might fire). If everyone cooperates (works overtime), the queue stays clear, management hires no one, and everyone burns out.
  *   **The Wrongness:** You feel guilt because you are benefiting from a system that is harming your colleague. However, joining him in overwork does not save him; it only normalizes the new baseline.

  ### 2. Addressing Your Specific Questions

  **"Am I free-riding on my teammates?"**
  Technically, yes, regarding the *team metric*. You benefit from the queue being empty without paying the hourly cost your teammates pay. However, in labor ethics, **free-riding requires a shared agreement on the cost.** There is no agreement that the cost should be unpaid overtime. The agreed cost is 35 hours.
  *   **Verdict:** You are not free-riding on your *contract*; you are free-riding on their *violation* of the contract. The moral weight of this is low because their violation is self-imposed and actively harmful to the group's long-term leverage. If you join them to "pay your fare," you are simply validating the manager's lie that 4 people are enough.

  **"Is the free-riding charge just the work ethic in disguise?"**
  Yes. The feeling that hours not spent producing need justification is the internalized voice of the employer.
  *   **Does it matter what you do with the time?** No. Your leisure is the dividend of the 35-hour week policy. Whether you study philosophy or scroll through videos is irrelevant to the labor exchange. The company purchased 35 hours of your capacity; they did not purchase the moral quality of your remaining time.

  **"Does the fact that his extra hours seem to come from him rather than from the company make my benefiting from them different?"**
  It makes it **more dangerous**, not less.
  *   If the company *ordered* the overtime, it would be visible, billable, and unsustainable. Management would see the cost and hire.
  *   Because it is "voluntary," it is invisible. It hides the true cost of the workload. Your benefiting from it makes you complicit in the *invisibility* of the labor. The problem isn't that he works; it's that the system records it as "4 people handling the load" rather than "4 people working 60 hours to handle the load."

  **"What do I owe him?"**
  You do not owe him your labor. Working more hours does not alleviate his chest pains; it only signals to management that the current pace is sustainable.
  *   **You owe him the truth:** That his sacrifice is being used to deny the team reinforcements.
  *   **You owe him solidarity:** Not by working late, but by refusing to let management use his output as a metric for sustainability.
  *   **You do not owe him an argument:** Telling him he is being exploited when he claims he "likes the craft" will likely trigger defensiveness. Chest pains are objective; "liking work" is subjective coping.

  ### 3. What Kind of Problem Is This on Monday?

  This is a **Data Integrity Problem**.

  Currently, your team is providing bad data to management. Management believes:
  `4 Heads × 35 Hours = Queue Cleared`
  The reality is:
  `4 Heads × ~50 Hours = Queue Cleared`

  As long as the queue is cleared, management has no incentive to hire. Your teammate's health is the variable that will eventually break the equation, but relying on a medical emergency to force hiring is a terrible strategy.

  ### 4. Strategic Recommendation

  You cannot force your teammates to stop working. You cannot force management to hire. But you can control the data you generate.

  1.  **Maintain the 35-Hour Boundary:** Do not log in at night. Do not apologize. You are the control group. If everyone works overtime, the experiment (35-hour week viability) is ruined.
  2.  **Make the Slack Visible (Carefully):** You mentioned the work "sits there until someone picks it up."
      *   If you finish your 35 hours and tickets remain, **leave them.**
      *   Do not apologize for them in team chats.
      *   If asked, state neutrally: "I logged my 35 hours. I prioritized X and Y. Z remains in the queue."
      *   Currently, your teammates are absorbing the slack so quickly that management sees a flat line. The queue needs to breathe so management sees the volume.
  3.  **Reframe the Conversation with the Teammate:**
      *   Do not say: "You are working too much."
      *   Do say: "I'm worried that if we keep clearing the queue at this rate, [Manager] will assume we don't need help. If you get sick, the queue will explode anyway, and they'll be surprised. I want to make sure the workload reflects reality so we don't all crash."
      *   Focus on the **risk to the team**, not the morality of his work ethic.
  4.  **The "Craft" Argument:**
      *   Acknowledge his enjoyment but separate it from the volume. "I get that you like the cases. But liking the work doesn't change the math on the queue volume. If we don't hire a fifth person, the only way to clear this queue is for one of us to leave or get sick."

  ### Summary
  You are not doing anything wrong by working your contract. The "wrongness" you feel is the friction of being the only person adhering to the official rules while everyone else (including management) is adhering to unofficial, unsustainable ones.

  Your obligation is not to work more hours to "balance the scales." Your obligation is to ensure that the **cost of the work remains visible**. If you work overtime, you help hide the cost. By working your 35 hours and letting the queue reflect the true volume of incoming cases during *paid* time, you provide the evidence management needs to justify the fifth hire.

  Your teammate is sacrificing his health to subsidize the company's headcount budget. The most supportive thing you can do is refuse to validate that subsidy.
