prompt: |-
  In seminars on population ethics, participants keep invoking a compressed formulation of the procreation asymmetry: "bringing a suffering person into existence is a wrong done to them, but failing to bring a happy person into existence is not a wrong done to anyone." The phrase is treated as if it settles debates about childbearing obligations, but I think it hides several distinct logical structures. Please lay out, as a numbered menu, the precise theses this slogan could be expressing — from tautological restatements of "harm is bad" to substantive claims about person-affecting reasons, deontic asymmetries between harming and failing to benefit, and metaphysical claims about whether non-existence can constitute a deprivation. For each entry: (1) formulate the claim with enough precision that one could assess its truth value; (2) classify it as trivial, substantive and defensible, substantive but likely false, or conceptually incoherent; (3) indicate whether it actually supports the practical conclusion that procreating is permissible when expected welfare is positive but impermissible when it is negative; and (4) identify the hidden premises it requires about identity, comparison classes, or the logic of obligations. In particular, distinguish versions that depend on an axiological asymmetry — suffering is bad in a way happiness is not symmetrically good — from versions that invoke only a deontic asymmetry — we have stronger duties not to harm than to benefit — and discuss whether either version survives rejection of the view that non-existence can be "worse for" a particular individual. I want this formatted as a disambiguation table or list I can circulate without endorsing any single reading.
