answer: |-
  # Disambiguation Menu: The Procreation Asymmetry Slogan

  **Context:** The slogan *"Bringing a suffering person into existence is a wrong done to them, but failing to bring a happy person into existence is not a wrong done to anyone"* is frequently invoked to resolve debates on procreative obligations. However, it conflates distinct claims in axiology (value), deontology (duty), and metaphysics (identity/existence). The following menu isolates six distinct logical structures embedded in this formulation.

  ---

  ### 1. The Strong Person-Affecting Restriction (PAR)
  *   **(1) Precise Formulation:** An act is morally wrong only if it makes some particular, identifiable person worse off than they would otherwise have been.
  *   **(2) Classification:** **Substantive but Likely False** (in general populations). While intuitive, this view struggles with the "Non-Identity Problem" (Parfit), where choices affect *who* exists rather than *how well* existing people fare.
  *   **(3) Supports Practical Conclusion?** **Yes.** It entails that creating a suffering person is wrong (they are worse off than if they had not existed), but creating a happy person is not obligatory (the alternative is non-existence, not a happier existence for *that* person).
  *   **(4) Hidden Premises:** Requires that **non-existence is a valid baseline for comparison**. It assumes we can coherently say a person is "worse off" existing with suffering than they would have been had they never existed. If non-existence cannot be "worse for" a subject, this thesis cannot explain why creating a suffering person is a wrong *to them*.

  ### 2. The Threshold Conception of Harm (Wrongful Life)
  *   **(1) Precise Formulation:** Existence constitutes a harm to an individual if and only if their welfare level falls below a "zero point" (a life not worth living); existence above this point constitutes no harm, even if it is not the optimal life possible.
  *   **(2) Classification:** **Substantive and Defensible.** This aligns with widespread legal and moral intuitions regarding "wrongful life" suits and severe congenital conditions.
  *   **(3) Supports Practical Conclusion?** **Yes.** It renders procreation impermissible below the threshold (harmful) and permissible above it (not harmful), without requiring a duty to maximize happiness.
  *   **(4) Hidden Premises:** Requires a **coherent metric of welfare** with a neutral zero point. It presupposes an **axiological asymmetry**: suffering below the zero point has negative moral weight sufficient to forbid creation, while happiness above the zero point lacks the moral weight to mandate creation.

  ### 3. The Deontic Asymmetry (Strict vs. Imperfect Duties)
  *   **(1) Precise Formulation:** Agents possess a perfect duty of non-maleficence (do not create miserable beings) but only an imperfect duty of beneficence (no specific obligation to create happy beings in any particular instance).
  *   **(2) Classification:** **Substantive and Defensible.** This reflects standard common-sense morality where avoiding harm is mandatory, but providing benefits is often supererogatory or discretionary.
  *   **(3) Supports Practical Conclusion?** **Yes.** It directly maps to the conclusion: impermissible to create suffering (violates perfect duty), permissible to create happiness (fulfills or omits imperfect duty).
  *   **(4) Hidden Premises:** Assumes **duties apply to potential persons**. It bypasses the metaphysical problem of whether non-existence is a deprivation by focusing on the *agent's* moral integrity rather than the *recipient's* loss. It survives the rejection of "non-existence as deprivation" because it grounds the wrong in the agent's violation of a rule, not the victim's state.

  ### 4. The Axiological Asymmetry (Negative Value Priority)
  *   **(1) Precise Formulation:** The disvalue of suffering is morally significant regardless of existence, but the value of happiness is morally significant *only* if the subject already exists (or is independently fixed).
  *   **(2) Classification:** **Substantive and Controversial.** This is a specific value theory (akin to Negative Utilitarianism or Asymmetrical Intuitionism) that denies the symmetry of good and bad in population contexts.
  *   **(3) Supports Practical Conclusion?** **Yes.** It provides a axiological foundation for the slogan: there is a reason not to create pain, but no reason (or a weaker reason) to create pleasure for potential people.
  *   **(4) Hidden Premises:** Requires **variable value theory**. It assumes that the moral weight of a benefit depends on the modal status of the beneficiary. If one rejects that non-existence can be "worse for" an individual, this view must argue that the *badness* of suffering exists impersonally, while the *goodness* of happiness does not.

  ### 5. The Metaphysical "No Subject" Claim
  *   **(1) Precise Formulation:** Deprivation requires a subject; since a non-existent person is not a subject, failing to bring them into existence cannot deprive them of anything, whereas bringing a suffering person into existence creates a subject who experiences harm.
  *   **(2) Classification:** **Conceptually Coherent but Leads to Absurd Conclusions.** While logically consistent, if applied symmetrically, it suggests we cannot harm someone by creating them either (since the "harmed" subject only exists because of the act). It usually relies on an asymmetric application.
  *   **(3) Supports Practical Conclusion?** **Partially.** It strongly supports the second half (no wrong to non-existent happy people) but struggles to support the first half (wrong to suffering people) without appealing to the Threshold Conception (#2).
  *   **(4) Hidden Premises:** Relies on the **Actualism** view of interests (only actual beings have interests). It fails if one adopts **Possibilism** (potential beings have moral status). If non-existence cannot be "worse for" an individual, this claim validates the second half of the slogan but leaves the first half unsupported unless "harm" is defined non-comparatively (i.e., being in a bad state, not being made worse off).

  ### 6. The Comparative Baseline Relativity Claim
  *   **(1) Precise Formulation:** In "same-number" choices, we compare welfare levels; in "different-number" choices (existence vs. non-existence), the baseline is non-comparable for positive welfare but comparable for negative welfare.
  *   **(2) Classification:** **Substantive but Ad Hoc.** This attempts to codify the asymmetry as a brute fact of moral mathematics without deeper metaphysical justification.
  *   **(3) Supports Practical Conclusion?** **Yes.** It is essentially a restatement of the practical conclusion in theoretical language.
  *   **(4) Hidden Premises:** Assumes **incommensurability** between existence and non-existence regarding benefits, but **commensurability** regarding harms. This version is vulnerable to the charge of arbitrariness unless backed by Thesis #2 (Threshold) or #4 (Axiological Asymmetry).

  ---

  ### Summary Note on Non-Existence and Deprivation
  The slogan's stability depends heavily on how one treats the claim that *non-existence can be "worse for" a particular individual*.

  *   **If you reject that non-existence can be "worse for" anyone:**
      *   **Deontic Versions (Thesis #3)** survive best. They locate the wrong in the agent's action (creating suffering) rather than a comparative loss to the victim.
      *   **Axiological Versions (Thesis #4)** survive only if they posit that suffering has *impersonal* disvalue, while happiness lacks *impersonal* value for potential people.
      *   **Person-Affecting Versions (Thesis #1 & #5)** collapse or require modification. If non-existence is not a state a person can be "worse off" than, then creating a suffering person is not a wrong *to them* in a comparative sense. To maintain the slogan, one must switch to a **Non-Comparative Harm** view (Thesis #2): the person is harmed simply by being in a bad state, not by being made worse off than they would have been.

  *   **If you accept that non-existence can be "worse for" someone:**
      *   The second half of the slogan ("failing to bring a happy person... is not a wrong") becomes difficult to defend without appealing to a **Deontic Asymmetry** (Thesis #3). If non-existence is worse for the happy person, failing to create them *does* deprive them, which suggests a potential obligation unless a specific deontic rule overrides the axiological loss.

  *Circulate this menu to clarify which specific commitment is being invoked when the slogan is used.*
