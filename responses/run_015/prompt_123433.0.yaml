answer: |-
  ### Desiderata for an Account of History's Large-Scale Shape

  To evaluate whether history cycles, directs, or drifts, a theory must satisfy the following specifications. These are not arguments for one side, but constraints on what counts as a coherent claim.

  #### 1. Variable Segregation (The Ratchet Constraint)
  **Specification:** The theory must explicitly distinguish between *ratcheting variables* (e.g., thermodynamic efficiency, cumulative information, demographic carrying capacity) and *non-ratcheting variables* (e.g., regime legitimacy, elite cohesion, aesthetic modes). It must state whether its shape claim applies to the aggregate system or specific subsystems.
  **Case:** A claim that "history cycles" is incoherent if it treats irreversible technological accumulation as identical to reversible political turnover. If a theory claims recurrence while ignoring ratchets, it fails to explain why the second cycle differs materially from the first (e.g., a hegemon with nukes vs. a hegemon with legions).
  **Status:** **Non-Negotiable.** Without this, the theory commits a category error between *state* and *process*.
  **Tension Flag:** This creates immediate friction with **Desideratum 3 (Projectivity)**. If ratchets change the boundary conditions of the system, past cycles cannot be projectively identical to future ones.

  #### 2. Unit Specification and Coupling Coherence
  **Specification:** The theory must define the *unit of recurrence or direction* (e.g., the polity, the civilization, the biosphere) and provide a model for how multiple units interact. If Unit A cycles and Unit B cycles out of phase, the theory must explain why the aggregate does not appear stochastic.
  **Case:** Polybius describes the cycle of constitutions within a *polity*. Spengler describes the lifecycle of a *culture*. If "History" is the sum of interacting polities, a local cycle may look like global noise. A theory claiming global shape must account for the coupling mechanism (trade, war, diffusion) that synchronizes units.
  **Status:** **Non-Negotiable.** Ambiguity here allows the theorist to shift scales to save the hypothesis (e.g., "The empire fell, but Civilization lives").
  **Tension Flag:** High coupling requirements often force **Directional** theories (global integration implies a single vector), while low coupling favors **Cyclical** theories (local autopsies).

  #### 3. Diagnostic Independence (Phase Identity and Projectivity)
  **Specification:** The criteria for identifying a historical phase (e.g., "Decline," "Feudalism," "Expansion") must be definable *without* reference to the outcome of that phase. The theory must allow for the possibility of applying these criteria to the present to generate a falsifiable forecast, not just a retrospective classification.
  **Case:** Retrospective periodization is trivial; any sequence can be chopped into "rise, peak, fall." To count as a shape claim, the theory must offer *leading indicators* of a phase transition that work before the transition is complete.
  **Status:** **Non-Negotiable** for empirical content.
  **Tension Flag:** This is the primary point of failure for **Cyclical** traditions. High projectivity usually requires stripping away unique contextual details, which conflicts with **Desideratum 1 (Variable Segregation)** if those details include ratcheting technologies.

  #### 4. The Accumulation Compatibility Clause
  **Specification:** The theory must explicitly state whether cumulative science and technology constitute evidence against recurrence, evidence for a modified recurrence (spirals), or are irrelevant to the shape claim.
  **Case:** Five centuries of sci/tech growth is the strongest evidence for directionality. A recurrence view must explain this either as (a) a temporary ratchet before a reset, (b) a superficial layer over deep cyclic structures, or (c) an error in observation. Dismissing it without argument renders the theory dogmatic.
  **Status:** **Preference of the Directional Camp** (Cyclicalists often view this as a category error, arguing tech is not *history's* shape but merely its tool).
  **Tension Flag:** Satisfying this often forces Cyclicalists into **Desideratum 1** violations (claiming tech can be lost easily) or **Desideratum 3** failures (claiming we are in a unique phase that breaks the cycle, which undermines the cycle's universality).

  #### 5. Stochastic Null Hypothesis Viability
  **Specification:** The theory must allow for the possibility that "no large-scale shape" is the true state of affairs. It must specify what evidence would convince its proponents that history is essentially stochastic or path-dependent without a global attractor.
  **Case:** If every outcome can be interpreted as confirmation (e.g., "The cycle paused," or "The direction hid itself"), the theory is unfalsifiable.
  **Status:** **Non-Negotiable** for philosophical adequacy.
  **Tension Flag:** Many **Morphological** theories (Spengler) treat the shape as an a priori metaphysical truth, making this requirement impossible for them to meet.

  ---

  ### The Self-Location Requirement
  **Must the theory locate us?**
  *   **The Demand:** The theory should explain why it emerged *now* and place the present moment within its proposed shape (e.g., "We are in the Winter of the West").
  *   **The Verdict:** This is a **Preference of the Existential/Prophetic Camp**, not a non-negotiable requirement for truth.
  *   **Reasoning:** Demanding self-location risks a *reductio*. If a theory explains its own emergence as a necessary symptom of its phase (e.g., "Only a man in Decline can see the Cycle"), it becomes a closed hermeneutic circle immune to external critique. However, a theory that *cannot* locate the present risks being vacuous.
  *   **Recommendation:** The theory must *permit* self-location, but not *derive* its validity from it. If the theory's truth depends on the theorist's temporal position, it is ideology, not history.

  ---

  ### The Impossible Triangle (Joint Unsatisfiability)
  I suspect the following three demands cannot be jointly satisfied by a single account:

  1.  **Strong Recurrence:** The claim that macro-historical phases repeat with high fidelity (Type-Identity).
  2.  **Ratchet Acknowledgement:** The admission that material/technological constraints are irreversible (Sci/Tech accumulation).
  3.  **High Projectivity:** The ability to predict future phases based on past patterns without ad-hoc adjustment.

  **The Tension:** If you admit **Ratchets**, the boundary conditions of the system change, which breaks **Strong Recurrence**. If you insist on **Strong Recurrence**, you must deny **Ratchets** (claiming collapse resets tech) or ignore them, which destroys **Projectivity** (because the next cycle will behave differently due to the ratchet). You can have a Spiral (Direction + Recurrence), but you lose the predictive power of the pure Cycle.

  ---

  ### Analysis of Requirements

  **Which single requirement excludes the most candidates?**
  **Desideratum 3 (Diagnostic Independence).**
  Most historical shape theories (especially Cyclical and Morphological ones) are robust retrospectively but brittle prospectively. They rely on knowing the end of the story to define the middle. Requiring leading indicators that function *before* the phase transition eliminates the majority of classical cyclical theories (Vico, Spengler) and many directional teleologies (Hegel, Marx) which rely on retrospective rationalization.

  **Which demands are really tribal prejudice?**
  **Desideratum 4 (Accumulation Compatibility Clause)** leans toward **Directional Prejudice.**
  It assumes that cumulative technology is the *primary* metric of historical shape. A Cyclicalist can argue that tech is merely the "furniture" of the house, while the "structure" (human nature, power dynamics) remains constant. Demanding that a cycle theory bow to technological accumulation privileges materialist definitions of progress over structuralist definitions of order.

  ---

  ### Scorecard

  **Cyclical Tradition (Polybius, Ibn Khaldun, Spengler, Toynbee):**
  *Fails Variable Segregation and Projectivity by conflating political turnover with civilizational lifecycle while ignoring irreversible material ratchets.*

  **Cumulative/Big History Tradition (Enlightenment Progress, Marx, Pinker, Big History):**
  *Fails Unit Specification and Stochastic Viability by assuming global coupling where none exists and treating contingent gains as necessary laws.*
