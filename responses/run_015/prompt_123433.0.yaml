      *   **Dual Purpose of Theory:**
          1.  Define what kind of claim "history cycles/directs" is (metaphysical/semantic).
          2.  Evaluate evidence (specifically: does 500 years of cumulative sci/tech count against recurrence?).
      *   **Specific Requirements for the Output:**
          *   Give the case/consideration behind each requirement.
          *   Mark each as *Non-Negotiable* or *Preference of a Particular Camp*.
          *   Flag any subset suspected to be *jointly unsatisfiable* (the tension is the most important part).
          *   Handle three explicit topics:
              1.  *The Ratchet Asymmetry* (ratcheting vs. non-ratcheting variables).
              2.  *Units and Interactions* (polity vs. civilization vs. species; coupling).
              3.  *Phase Identity and Projectivity* (criteria for sameness; forward-looking vs. retrospective).
          *   Address *Self-Location* (must the theory place the present/explain its own emergence?).
          *   Avoid collapsing type-recurrence with token-return, or oscillation with accumulation.
          *   Treat "no large-scale shape" as a live candidate.
          *   Identify which single requirement excludes the most candidates.
          *   Identify which demands are tribal prejudice.
          *   Provide a one-line scorecard for Cyclical (Polybius, Ibn Khaldun, Spengler, Toynbee) and Cumulative/Big History traditions at the end.
      *   **Tone:** Philosophical, rigorous, analytical, avoiding premature conclusion.

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Variable Specificity (Addressing Ratchet Asymmetry).*
          *   *Idea:* A theory can't just say "history cycles." It must say *what* cycles.
          *   *Case:* If technology ratchets but regimes cycle, a general claim is ambiguous.
          *   *Status:* Non-negotiable for clarity.
          *   *Tension:* If a theory claims *total* recurrence, it fails this. If it admits ratchets, is it still cyclical?

      *   *Requirement 2: Unit Specification and Coupling (Addressing Units).*
          *   *Idea:* Who is cycling? Rome? The West? Humanity?
          *   *Case:* Aggregation problems. If Unit A cycles and Unit B cycles out of phase, the aggregate looks linear or random.
          *   *Status:* Non-negotiable for coherence.
          *   *Tension:* Defining the unit often presupposes the shape (e.g., "Civilization" implies a bounded lifecycle).

      *   *Requirement 3: Phase Criteria and Projectivity (Addressing Phase Identity).*
          *   *Idea:* How do we know we are in "Phase X"? Can we predict it?
          *   *Case:* Retrospective fitting is easy; prediction is hard.
          *   *Status:* Non-negotiable for empirical content.
          *   *Tension:* High projectivity often requires ignoring unique details (reductionism).

      *   *Requirement 4: The Ratchet Compatibility Clause.*
          *   *Idea:* Specifically addressing the sci/tech evidence.
          *   *Case:* Can a cycle theory accommodate irreversible gains?
          *   *Status:* Camp Preference (Cyclicalists might reject the premise that ratchets matter).
          *   *Tension:* This is the core conflict. If ratchets exist, can deep cycles exist?

      *   *Requirement 5: Self-Location and Reflexivity.*
          *   *Idea:* Must the theory explain why it was written *now*?
          *   *Case:* Spengler wrote in decline. Marx wrote in industrial rise.
          *   *Status:* Camp Preference (Progressivists demand it; Cyclicalists might see it as coincidental).
          *   *Tension:* If a theory explains its own emergence, does that validate or invalidate its universality?

      *   *Requirement 6: Falsifiability / "No Shape" Option.*
          *   *Idea:* The theory must allow for the possibility that there is no shape.
          *   *Case:* History might be stochastic.
          *   *Status:* Non-negotiable for scientific/philosophical honesty.

  3.  **Refining and Organizing:**

      *   I need to structure this logically. Let's group them: Ontological Clarity, Empirical Adequacy, and Reflexivity.
      *   I need to make sure the "Jointly Unsatisfiable" tension is highlighted prominently. The tension lies between *Projectivity* (predicting the future based on patterns) and *Ratchet Asymmetry* (acknowledging irreversible changes that break patterns).
