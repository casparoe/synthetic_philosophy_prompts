      *   *Agreed Claims:* Focus on the *implications* of the stipulated data that both must accept. E.g., The marker doesn't track the *symptoms* perfectly (tightening criteria shifted symptoms but not marker). This hurts pure Discovery (marker = gold standard) and pure Looping (marker = irrelevant). It forces a middle ground.
