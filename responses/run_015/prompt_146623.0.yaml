          *   *Crux 3: The "Holdout Cohort" Finding.* (Crucial based on the prompt's stipulated data).
              *   Data: Prevalence doubled in public, *but also* rose in blind archival re-coding.
              *   Discovery: See! It was always there, we just couldn't see it. (Validation).
              *   Looping: The re-coding imposed the structure retrospectively; the "rise" is an artifact of the coding lens, not the historical reality.
              *   Prediction: Future archival coding with *different* lenses.

      *   **Section 4: Verbal-versus-Genuine:**
          *   *Task:* Address "Both discovered and made."
