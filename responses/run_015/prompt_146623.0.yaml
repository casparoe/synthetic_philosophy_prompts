  7.  **Final Polish:** Ensure the distinction between the "Holdout Cohort" interpretation is sharp. Discovery sees it as validation of latent existence. Looping sees it as validation of the *coding scheme's power*, not the historical existence. This is a subtle but vital ontological difference.

