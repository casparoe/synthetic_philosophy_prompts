answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY AND UTILITY OF PSYCHIATRIC CLASSIFICATION: THE MAV CASE**

  **To:** The Nosology Committee
  **From:** The Discovery Camp (Psychiatry-Neuroscience) and The Looping Camp (Philosophy of Interactive Kinds)
  **Subject:** Adversarial Collaboration Findings regarding *Maladaptive Anticipatory Vigilance* (MAV)

  **Preamble**
  This document summarizes the results of an adversarial collaboration regarding the proposed category *Maladaptive Anticipatory Vigilance* (MAV). We have restricted our evidence to three stipulated findings provided by the working group:
  1.  **Semantic Recoil Index (SRI):** Prevalence of MAV roughly doubles within five years of criteria publication/awareness campaigns.
  2.  **Holdout Cohort:** Archival interviews recorded *before* MAV existed, when re-coded blind to the campaign, show a comparable rise in MAV prevalence.
  3.  **Marker Stability:** A laboratory marker is present in ~60% of post-campaign cases vs. ~55% of pre-campaign cases. When criteria were tightened, clinical presentation shifted to match new vocabulary, but marker prevalence among cases remained flat.

  We define **Looping** as the process by which the classification of a human kind alters the kind itself. We define **Discovery** as the project of identifying causally structured targets independent of the classification used to track them.

  ### I. Agreed Claims
  *The following claims are substantive. A naive proponent of either camp prior to this collaboration would likely have denied at least one of them.*

  1.  **Phenotypic Drift without Marker Loss:** A psychiatric category can undergo significant shifts in clinical presentation (symptom profile) due to criteria tightening, while the prevalence of associated biological markers among cases remains stable. (This challenges the Discovery view that markers track symptoms tightly, and the Looping view that markers are irrelevant to category coherence.)
  2.  **Structured Reactivity:** The change in prevalence following classification (the Semantic Recoil) is not random measurement noise; it is a structured, predictable effect that correlates with the dissemination of the criteria text. (This challenges the Discovery view that reactivity is merely error to be averaged out.)
  3.  **Retrospective Constitution:** The application of a new coding scheme to archival data (the Holdout Cohort) alters the historical prevalence rate of the condition, regardless of whether the condition "existed" at the time. (This challenges the Discovery view that archival re-coding simply reveals pre-existing truth.)
  4.  **Institutional Necessity:** Category stability over time requires active institutional maintenance (e.g., criteria enforcement, training) and cannot be sustained by biological marker presence alone. (This challenges the Discovery view that biological reality guarantees stability.)
  5.  **Non-Identity of Marker and Kind:** Possession of the laboratory marker is neither necessary nor sufficient for MAV classification under current criteria, yet the marker remains statistically associated with the category across descriptive changes. (This challenges the view that the marker defines the kind, and the view that the marker is merely epiphenomenal.)

  ### II. The Deflationary Move: Reactivity vs. Looping
  *The Discovery Camp proposes that Looping is a species of measurement reactivity (observer effect), analogous to tumor subtypes changing under treatment or machine-learning classifiers facing adaptive adversaries. The Looping Camp evaluates this analogy as follows:*

  **The Clause in Dispute:** "The mechanism by which the target changes is indifferent to the subject's understanding of the classification."

  **Discovery Camp Position:** We accept this clause. Whether a tumor changes shape due to drug pressure or a patient changes behavior due to diagnostic knowledge, the scientific response is identical: model the input (treatment/classification), model the output (shape/behavior), and correct the prediction. The *meaning* of the change to the system is irrelevant to the *math* of the correction.

  **Looping Camp Position:** We **reject** this clause. We accept that tumor subtypes and MAV both change under classification/intervention. We reject that the mechanism is indifferent to understanding.
  *   **Reason for Rejection:** In the MAV case, the change is mediated by *semantic uptake*. The subject modifies behavior because they understand the description as applying to them (or wish to avoid it). In the tumor case, the change is mediated by *biophysical constraint*.
  *   **Consequence:** If the clause is accepted, the solution is better engineering (hiding criteria). If the clause is rejected, the solution is ethical/political negotiation of the criteria. We cannot sign a statement that treats semantic uptake as merely another physical variable without losing the explanatory power of "interactive kinds."

  ### III. Disagreements Table
  *Rows represent the remaining cruxes. Columns represent the precise formulation each side accepts, what evidence would move them, and their pre-registered predictions on the stipulated case.*

  | Crux | Discovery Camp Formulation | Looping Camp Formulation | Evidence/Argument That Would Move Us | Pre-Registered Prediction (MAV Case) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Holdout Cohort Finding**<br>*(Archival re-coding shows prevalence rise)* | The rise in the holdout cohort confirms that the **causal structure was present historically** but undetected. The coding scheme successfully latched onto a latent target that existed prior to the label. | The rise in the holdout cohort confirms that the **coding scheme imposes structure** on the past. The "prevalence" is a property of the interaction between the archive and the code, not a property of the historical population. | **Discovery:** Show that the marker was present in the archival samples *without* needing the new code to detect it.<br>**Looping:** Show that a *different* coding scheme applied to the same archive yields a stable prevalence rate unrelated to MAV criteria. | **Discovery:** The marker will be found in the archival holdout cohort at rates matching the re-coded prevalence.<br>**Looping:** The marker will *not* correlate with the archival re-coding, proving the re-coding captured narrative structure, not biological reality. |
  | **2. The Role of the Marker**<br>*(60% post vs 55% pre; stable under tightening)* | The marker indicates a **core substrate**. The 5% shift is noise. The stability under tightening proves the marker tracks the *real* boundary better than the symptoms do. | The marker indicates a **physiological correlate of the current loop**. Its stability under tightening proves it tracks a stress response common to many descriptions, not the specific essence of MAV. | **Discovery:** Show that treating the marker (without changing behavior) resolves the MAV presentation.<br>**Looping:** Show that changing the description (without treating the marker) eliminates the MAV presentation while the marker persists. | **Discovery:** Future criteria refinements will increase marker prevalence toward 100%.<br>**Looping:** Future criteria refinements will decouple the marker from the criteria entirely as patients adapt to the new vocabulary. |
  | **3. Policy on Criteria Secrecy**<br>*(To reduce Semantic Recoil)* | Criteria should be **technical documents**. Public awareness campaigns should be minimized to reduce measurement reactivity (SRI). Stability is a prerequisite for valid research. | Criteria are **public tools**. Secrecy prevents subjects from aligning their self-understanding with clinical support. Stability achieved by secrecy is ethically costly and ontologically fragile. | **Discovery:** Show that public criteria lead to worse health outcomes than stable, technical categories.<br>**Looping:** Show that public criteria lead to *more* ontological instability than secrecy, independent of ethical concerns. | **Discovery:** Public criteria will increase SRI without improving treatment matching.<br>**Looping:** Public criteria will increase SRI but improve treatment matching by allowing patient-clinician semantic alignment. |

  ### IV. Verbal-versus-Genuine Section
  *We address the proposed peace treaty: "Psychiatric categories are both discovered and made."*

  **Verbal Disagreement:**
  If the statement means "Neurobiology exists (discovered) AND humans respond to descriptions (made)," we both sign this. This is trivial. It asserts only that physical processes occur and that language exists. It dissolves the moment we ask how to weight these factors in a model.

  **Genuine Disagreement:**
  The dispute is genuine regarding **Explanatory Priority**.
  *   **Discovery Camp:** When predicting the future stability of MAV, the *biological marker* carries the weight. If the marker persists while the symptoms vanish, the category remains valid (perhaps the symptoms were wrong).
  *   **Looping Camp:** When predicting the future stability of MAV, the *institutional uptake* carries the weight. If the marker persists but the patients stop using the category to understand themselves, the category is dead (even if the biology remains).

  **Resolution:** We agree that "Both discovered and made" is a verbal truce unless accompanied by a **Weighting Rule**. Since we cannot agree on the Weighting Rule, the dispute remains genuine regarding how to vote on MAV adoption.

  ### V. Advice to the Committee
  *Regarding the vote on adopting Maladaptive Anticipatory Vigilance (MAV).*

  **Implications of the Disagreement:**
  The disagreement does not mandate rejecting MAV, but it dictates *how* MAV must be adopted.
  *   If the **Discovery Camp** is correct, MAV is a work-in-progress biological entity. The Committee should adopt it to facilitate biological research, accepting that current criteria are imperfect proxies for the marker.
  *   If the **Looping Camp** is correct, MAV is a tool for intervention. The Committee should adopt it only if the feedback loop (SRI) is monitored and managed as a feature, not a bug.

  **Joint Recommendation:**
  Adopt MAV **provisionally**, contingent on the following measurement mandates prior to the next revision:

  1.  **Mandatory SRI Tracking:** The working group must measure the Semantic Recoil Index at every revision cycle. If prevalence shifts by >20% following publication, a "Recoil Review" is triggered.
  2.  **Marker Decoupling Study:** A study must be funded to determine if the laboratory marker predicts treatment response *independent* of the patient's knowledge of their diagnosis. (This tests the Deflationary Move).
  3.  **Archival Robustness:** The Holdout Cohort analysis must be repeated with a competing coding scheme. If prevalence varies wildly between schemes, the "historical existence" claim must be downgraded in the manual text.

  **What Either Side Wants Measured Before the Vote:**
  *   **Discovery Camp:** Requires evidence that the marker predicts longitudinal course (5+ years) better than the symptom criteria.
  *   **Looping Camp:** Requires evidence that patients' *understanding* of the MAV label predicts longitudinal course better than the marker.

  **Signed:**
  *The Discovery Camp Representative*
  *The Looping Camp Representative*
