      *   **Key Constraints:**
          *   No citations, bibliographies, named authorities, or contested history.
          *   Use stipulated material (Hypothetical category: *Maladaptive Anticipatory Vigilance* [MAV]).
          *   Use stipulated findings (Semantic Recoil Index, Lab Marker, Criteria Tightening effect).
          *   **Agreed Claims:** Numbered, substantive (naive versions of either camp would have denied them initially). No platitudes ("classification is hard").
          *   **Disagreements Table:** Rows = Cruxes. Columns = Side's formulation, Evidence/Argument that would move them, Pre-registered Case/Prediction (with guesses).
          *   **Specific Issues to Address:**
              *   *Deflationary Move:* Is looping just measurement reactivity/observer effect (like tumor subtypes or ML)? Can the Looping Camp sign any of this? If not, which clause is rejected?
              *   *Peace Treaty:* Is "both discovered and made" substantive or verbal? Need a "Verbal-versus-Genuine" section.
              *   *Committee Advice:* What follows for the vote on adopting MAV? What needs measuring?
          *   **Tone:** Precise, recognizable to both sides (no caricatures), technical terms defined.

  2.  **Deconstruct the Camps:**

      *   **Discovery Camp (Psychiatrist-Neuroscientist):**
          *   Belief: Categories track causally structured targets (joints of nature).
          *   Instability = Measurement error/noise.
          *   Looping = Nuisance/Reactivity (like observer effect).
          *   Goal: Engineer away instability to find the real thing.
          *   View on MAV: The marker suggests a biological reality; prevalence shifts are noise or reaction to be corrected.
      *   **Looping Camp (Philosopher of Interactive Kinds):**
          *   Belief: Feedback is constitutive. The target moves *because* the description moves.
          *   Stability = Institutional achievement, not natural joint.
          *   Looping = Essential feature of human kinds.
          *   View on MAV: The shift in presentation *is* the phenomenon. The marker is incidental or co-constituted.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Joint Statement on the Ontology and Utility of Psychiatric Classification."
      *   **Introduction:** Briefly state the context (MAV case study) and the spirit (adversarial collaboration).

      *   **Section 1: Agreed Claims (The "Substantive" List):**
          *   *Constraint:* Must be things naive versions would deny.
          *   *Idea 1:* Biology isn't enough for validity. (Discovery usually thinks biology = real; Looping thinks biology is irrelevant. Agreement: Biology is necessary but not sufficient for *utility* or *stability*.) -> *Refinement:* Biological markers do not guarantee category stability across descriptive changes.
          *   *Idea 2:* Descriptions change the phenomenon. (Discovery usually denies this is fundamental; Looping insists. Agreement: Descriptive changes *do* alter prevalence/presentation, even if causes differ.) -> *Refinement:* Publication of criteria causally alters the prevalence and phenotypic expression of the classified population, independent of instrument precision.
          *   *Idea 3:* Stability requires work. (Discovery thinks stability is found; Looping thinks it's made. Agreement: Stability requires institutional maintenance.) -> *Refinement:* Long-term category stability depends on active institutional maintenance, not solely on the strength of underlying causal structures.
          *   *Idea 4:* Reactivity isn't just error. (Discovery thinks it's error; Looping thinks it's constitution. Agreement: It can't be simply subtracted out.) -> *Refinement:* Reactivity to classification cannot be treated purely as random measurement error to be averaged out; it exhibits structured patterns.

      *   **Section 2: The Deflationary Move (Reactivity vs. Looping):**
          *   *Task:* Address the "Looping is just observer effect" claim.
          *   *Discovery:* Wants to say it's like tumor subtypes changing under treatment.
          *   *Looping:* Needs to distinguish *adaptive response to meaning* vs. *physical reaction to intervention*.
          *   *Resolution:* They agree on the *mechanism* of change (input -> change) but disagree on the *medium* (meaning vs. physical constraint).
          *   *Specific Clause:* The Looping Camp rejects the clause "the mechanism of change is indifferent to the subject's understanding of the classification."

      *   **Section 3: Disagreements Table (The Core):**
          *   *Crux 1: Ontological Status of MAV.*
              *   Discovery: Latent disease entity.
              *   Looping: Interactive kind.
              *   Prediction: If we hide criteria, does the marker persist?
          *   *Crux 2: Interpretation of the Marker.*
              *   Discovery: Marker validates the category.
              *   Looping: Marker tracks a physiological correlate of the *current* loop, not the essence.
