      3.  **The Prioritized Agenda:** Rank the 5 candidates.
      4.  **The Researcher Allocation:** How to split the work among 3 people.
      5.  **Tractability & Future-Proofing:** What to watch for.

      *(Self-Correction on Distinctness)*: I need to be careful. Some argue (like Chalmers) that the self-undermining argument is the *killer* objection, while reliability is just a puzzle. Others say if reliability is solved, self-undermining vanishes. I will argue the latter: Reliability is the root. If you can't refer to qualia, you can't use them in an argument.

      *(Refining the "Common Cause" critique)*: The prompt mentions the objection: "justification... rest on a correlation we could have had no access to." This is the "Zombie Judgment" problem. If a zombie makes the same report, why is my report justified? This is the crux. Researcher 1 must tackle *Justification without Causation*.

      *(Refining Researcher 3)*: Instead of just "Alternatives," make it "The Cost of Abandonment." If Epiphenomenalism fails here, do we go Panpsychist or Illusionist? This makes it actionable.

