answer: |-
  Here is the hard truth: the etiological (Wright) and causal-role (Cummins) accounts are **competing**, not complementary. They are not answering different questions; they are offering mutually exclusive criteria for what grants a trait the status of having a "function" in the first place.

  The conceptual fault line you are sensing is **Normativity vs. Capacity**.

  ### The Fault Line: "Ought" vs. "Is"

  The confusion lives in whether "function" implies a standard of correctness (normativity) or merely a contribution to a system's capacity (capacity).

  *   **The Etiological Account (Wright) is about Normativity.** It asks: "Why *should* this part be here?" A trait has a function only if its presence is explained by its past success at doing that thing. This account preserves the distinction between *functioning* and *malfunctioning*. If a heart stops pumping, it is malfunctioning, not ceasing to have a function, because it *ought* to pump based on its history.
  *   **The Causal-Role Account (Cummins) is about Capacity.** It asks: "What *does* this part do right now?" A trait has a function if it contributes to a capacity of the containing system. This account is purely descriptive. If a heart stops pumping, it literally loses the function of pumping, because it no longer contributes to the system's capacity to circulate blood.

  In your synthetic gene case, this fault line cracks the pavement.
  *   **Wright says:** The gene has **no function** (yet). It has no selection history in this lineage. It is a "lucky accident" contributing to fitness, indistinguishable from a beneficial mutation that hasn't been selected yet.
  *   **Cummins says:** The gene **has a function**. It is currently contributing to homeostasis. Its history is irrelevant to its current systemic contribution.

  These are contradictory truth claims about the same object. They cannot both be true definitions of "biological function" without rendering the term useless. If you say "It has a function" (Cummins) and "It does not have a function" (Wright), you are not being complementary; you are talking past each other about whether history is a necessary condition for teleology.

  ### The Verdict: They Are Competing

  Philosophers often try to smooth this over by saying Wright defines "Proper Function" and Cummins defines "System Function." This is a dodge. In practice, when biologists ask "What is the function of gene X?", they want to know what it is *for*, not just what it *does*. The debate is competing because both sides claim to capture the intuitive notion of biological purpose.

  Your synthetic gene case proves they are competing. If they were truly complementary, the synthetic gene would simply have "a causal-role function but no etiological function," and we would move on. But we don't move on. We feel a tension. We want to say the gene *is* functioning, but we also feel it lacks the *authority* of the native gene. That tension is the competition between the two frameworks fighting for dominance in your intuition.

  ### Which Framework for Engineered Biology?

  If you have to pick one framework for engineered biology, **you must choose the Causal-Role (Cummins) account.**

  Here is why the Etiological account fails in synthetic biology:
  1.  **Time Lag:** Wrightian function requires a feedback loop of selection over generations. In synthetic biology, we care about function *immediately* upon insertion. If you adopt the etiological view, every engineered circuit is functionless until it has been selected for over multiple generations. This makes the concept of "function" useless for design and troubleshooting.
  2.  **The Designer Problem:** You might try to save the Etiological account by saying the "selection history" is the engineer's design choice. But this conflates *biological* selection with *human* intention. While philosophically interesting, it breaks the biological model. The bacterium didn't select the gene; the gene was forced in. Strict etiology requires the *system itself* (or its lineage) to have been selected for the trait.
  3.  **Forward-Looking Utility:** Engineering is inherently forward-looking. We build things to do jobs they haven't done before. The Etiological account is inherently backward-looking. It cannot account for novelty except as "mutation," which lacks function until selected.

  ### Why Causal-Role Wins (With a Caveat)

  The Causal-Role account holds up because engineered biology is about **system integration**, not ancestry. When you insert a synthetic gene, you are analyzing it as a component in a circuit. Does it produce the protein? Does it regulate the pathway? Does it maintain homeostasis? These are causal questions.

  However, you must accept the cost: **You lose the robust account of malfunction.**
  Under Cummins, if your synthetic gene mutates and stops working, it doesn't "malfunction"; it simply *loses* its function. It becomes a different causal role (e.g., "producing non-functional protein").

  In engineering, we handle this by importing **Design Intent** to replace **Evolutionary History**.
  *   **Biology (Wright):** History provides the norm ("It should pump because ancestors pumped").
  *   **Engineering (Cummins + Specs):** The Blueprint provides the norm ("It should pump because the design spec says so").

  ### The Bottom Line

  Stop trying to reconcile them. They are rival definitions of teleology.
  *   If you are studying **natural evolution**, the Etiological account is superior because it explains why traits persist and distinguishes adaptation from drift.
  *   If you are doing **synthetic biology**, the Causal-Role account is the only one that works. It allows you to ascribe function to novel parts based on their current contribution to the system's capacity, without waiting for natural selection to validate your design.

  For your synthetic gene: It has a function. It is contributing to the system's capacity right now. The fact that it lacks history makes it an *engineered* function, not an *evolved* one, but in the context of the living bacterium, the causal role is the only metric that matters for its survival and your analysis. Use Cummins, but anchor your normativity in design specifications, not evolutionary history.
