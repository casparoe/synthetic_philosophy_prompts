answer: |-
  **MEMORANDUM**

  **TO:** Heritage and Secularism Review Board
  **FROM:** [Your Name/Board Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation regarding Mill Road Chapel Restoration Grant (Dual-Stream Tax Pool)

  **1. RECOMMENDATION**

  I recommend that the Board **APPROVE** the restoration grant for the Mill Road Chapel, subject to specific conditions regarding the status of the consecrated altar.

  Specifically, approval is contingent upon the City Cultural Services Department submitting a plan within **180 days** to formally reclassify the altar from "active sacred infrastructure" to "historical artifact." This plan must include consultation with the original diocese regarding deconsecration protocols or, failing that, a permanent physical barrier or interpretive framework that contextualizes the altar strictly within a heritage/museum capacity.

  **2. BACKGROUND**

  The Mill Road Chapel is municipally owned and currently operates as a public chamber music venue. However, the structural integrity of the roof is compromised. Funding is available through the "Dual-Stream" Local Tax pilot, wherein residents designate their municipal tax contribution to either a "Religious Heritage" or "Secular Arts" pool. The "Religious Heritage" pool contains sufficient capital to cover approximately 80% of the restoration costs.

  The Board is divided. One faction argues that funding repairs violates state neutrality due to the presence of a consecrated altar. Another argues that neutrality requires equal access to funding streams regardless of the building's origins, provided the current use is public. A third perspective suggests treating the altar as a museum piece, creating a category of "inactive sacred infrastructure."

  **3. ANALYSIS OF SECULARISM AND NEUTRALITY**

  To reach a decision, we must engage honestly with the strongest argument against approval, even if we ultimately vote to proceed.

  The argument for rejection rests on more than mere symbolism; it rests on the ontological nature of consecration. The proponents of rejection argue that a consecrated altar is not simply wood and stone that *used* to be religious; in the eyes of the tradition that consecrated it, it *remains* sacred regardless of current usage. Therefore, by using public funds to repair the roof sheltering that altar, the state is not merely maintaining a building; it is actively preserving a theological boundary.

  This is a robust argument. It posits that secularism is not satisfied by "neutral usage" (i.e., playing Bach instead of singing hymns). If the state becomes the custodian of a sacred object, it becomes entangled in the maintenance of that sanctity. To ignore this is to practice a "lazy secularism" that assumes function overrides form. We must acknowledge that for the objecting board members, funding this roof is indistinguishable from funding a church, regardless of the ticket sales at the door.

  However, the argument for approval holds that secularism also prohibits discrimination based on the religious demographics of the taxpayer base. If residents have voluntarily directed their tax dollars to "Religious Heritage," and the Chapel fits the heritage criteria, denying the grant penalizes those taxpayers for their designation. Furthermore, the venue is open to all citizens for secular purposes. To deny the grant is to effectively demolish a heritage site because of a theological technicality regarding an object no one uses for worship.

  **4. THE "INACTIVE SACRED INFRASTRUCTURE" COMPROMISE**

  The middle path—treating the altar as a museum artifact—is the only viable way to reconcile these positions, but it requires formalization. We cannot leave the altar in a limbo state where it is physically intact but functionally ignored.

  By approving the grant with the condition of reclassification, we validate the "inactive sacred infrastructure" category. This acknowledges the historical reality of the object without endorsing its theological potency. The 180-day timeline provides the administration time to navigate the delicate diplomacy of deconsecration with the relevant religious authorities. If deconsecration is refused, the condition requires a physical or interpretive barrier (e.g., railing, signage) that clearly demarcates the altar as a preserved exhibit rather than a functional liturgical space.

  **5. ASSESSMENT OF THE DUAL-STREAM TAX MODEL**

  Finally, we must address the funding mechanism itself. There is a temptation to view the Dual-Stream tax as a solution to church-state entanglement. It is not. It merely displaces the entanglement.

  Under a traditional model, the City Council decides whether to fund religious entities, bearing the full political and legal burden of that choice. Under the Dual-Stream model, the *taxpayer* makes the initial choice, but the *City* still retains the burden of defining what qualifies as "Religious Heritage."

  By administering this fund, the City is still required to draw a line between "religious heritage" (eligible) and "religious activity" (ineligible). In the case of Mill Road, we are deciding whether a consecrated altar in a music hall counts as heritage or activity. The tax model does not absolve this Board of the responsibility to interpret secularism; it merely obscures the decision-making behind a veil of taxpayer choice. We are still the arbiters of what counts as "religious" enough to fund, but "secular" enough to allow.

  **6. CONCLUSION**

  The roof must be saved to preserve the building as a public asset. The tax pool exists to support heritage preservation. However, we cannot ignore the consecrated nature of the altar without compromising our secular mandate.

  Approval with conditions allows us to:
  1.  Preserve the physical structure (Heritage mandate).
  2.  Respect the taxpayer designation (Fiscal mandate).
  3.  Resolve the theological entanglement of the altar within a defined timeline (Secularism mandate).

  I look forward to discussing this framework at Tuesday's session.
