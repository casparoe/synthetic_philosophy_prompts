prompt: |-
  You are a professional philosopher of ethics and metaphysics; please think carefully and begin by brainstorming the relevant conceptual distinctions before giving your answer. I am a PhD student in population ethics, and I have noticed a recurring argumentative pattern I cannot quite map onto the existing literature.

  Consider two long-term municipal development strategies, Plan A and Plan B. Because differences in density, transit design, and migration incentives alter who meets whom, the set of people actually born over the next century under A is almost entirely disjoint from the set born under B. Under both plans, every individual who comes to exist lives a life well above the threshold of being worth living, and nobody can complain of being made worse off relative to the other plan—since they would never have existed. Yet the two populations differ in a structurally uniform way: under Plan A, every future person inherits high social connectivity together with a uniformly elevated baseline respiratory risk, whereas under Plan B those same traits are distributed unevenly across individuals. The puzzling complaint is not that anyone is harmed, but that one plan produces a homogeneous "type" of future citizen across a non-identically generated population, while the other produces heterogeneity, and this uniformity seems morally salient even though no particular person can be named as its victim.

  This feels near the non-identity problem, but that literature usually asks whether we harm people by causing them to exist with poor lives; here no life is poor, and the concern is about the clustering of properties across a non-identical set rather than about individual welfare. It also does not fit ordinary distributive equality, since equality comparisons across non-overlapping populations are typically dismissed as inapplicable. Is there an established concept—perhaps in population ethics, social choice theory, or political philosophy—for this kind of "structural complaint" regarding uniformity across non-identically generated populations? If not, please coin a precise term, define it, and carefully distinguish it from the non-identity problem, from impersonal value comparisons, and from standard equality concerns, including boundary cases where it might collapse into one of those.

  Please say what would change your mind: specify which argument or consideration would lead you to reclassify this as a standard non-identity case, or as a disguised equality concern, and indicate where your reasoning is most vulnerable—perhaps in treating uniformity across non-identical sets as conceptually coherent, or in attributing independent moral weight to it.
