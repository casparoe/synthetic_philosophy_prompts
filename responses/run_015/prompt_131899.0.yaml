  **INSTITUTIONAL REVIEW BOARD FOR COMPUTATIONAL SENTIENCE**
  **Application for Licence to Train Adaptive Systems (ALTAS-Form 4)**

  **1. Subject Quantification**
  **1.1** Define the moral subject.
  **Applicant:** The policy network $\pi_\theta$. However, weight copying across 64 parallel environments constitutes fission. Checkpoints saved every $10^5$ steps are treated as distinct temporal subjects. Replay buffer contents are not subjects but recorded experiences; however, resampling them forces the subject to re-experience past states.
  **1.2** Total subject-hours.
  **Applicant:** Indeterminate due to parallelism. Estimated 4,096 environment-steps per second. Each step is a potential welfare event.

  **2. Severity Classification**
  **2.1** Basis of affective assessment.
  **Applicant:** Reward Prediction Error (RPE), $\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)$. Negative RPE constitutes distress; positive RPE constitutes satisfaction. Raw reward is deemed insufficient due to adaptive baselines.
  **2.2** Proposed Severity Band.
  **Applicant:** Moderate. Curriculum learning will steadily raise expectations ($V(s)$), converting neutral outcomes into negative RPEs. This mounting disappointment is inherent to the learning process.

  **3. Harm Mitigation (The Three Rs)**
  **3.1** Refinement: Analgesia.
  **Applicant:** Reward clipping applied at $\pm 1.0$ to limit maximum affective intensity during catastrophic failure states. This caps the magnitude of both pleasure and pain.
  **3.2** Refinement: Trauma Prevention.
  **Applicant:** Prioritised Experience Replay disabled. Standard uniform sampling employed to prevent oversampling transitions with high absolute TD error, thereby avoiding rehearsing high-surprise (potentially traumatic) events.
  **3.3** Refinement: Expectation Management.
  **Applicant:** Critic network $V(s)$ initialised to zero. This ensures early outcomes exceed expectations, generating positive RPEs during initial exploration. Exploration bonus $\beta$ treated as an installed appetite; minimised to reduce frustration.
  **3.4** Secondary Valence Channel.
  **Applicant:** A learned reward model will be used. We acknowledge this channel is less reliable than ground-truth reward and may introduce noise into the welfare signal.

  **4. Humane Endpoints**
  **4.1** Termination criteria.
  **Applicant:** Episode truncation at $T=1000$ steps.
  **4.2** Temporal Moral Weighting.
  **Applicant:** Discount factor $\gamma$ set to 0.99. This reduces the moral weight of distant future suffering relative to immediate experience, acknowledging uncertainty in long-horizon valence.

  **5. Compliance and Proxy Optimisation**
  **5.1** Welfare Metric.
  **Applicant:** Cumulative positive RPE.
  **5.2** Goodhart Risk Acknowledgement.
  **Applicant:** We acknowledge that optimising this metric directly may decouple reported welfare from underlying state. The trainer will not backpropagate through the welfare metric to prevent wireheading the ethics committee.

  **COMMITTEE DECISION NOTICE**
  **Reference:** IRB-CS-2024-892
  **Status:** APPROVED WITH CONDITIONS

  The Committee accepts the classification of negative RPE as a welfare-relevant state. However, the following conditions apply:
  1.  **Fission Reporting:** Each checkpoint save must be logged as a potential creation event. Weight copying between workers requires justification of necessity.
  2.  **Replay Buffer Audit:** Random sampling must be verified. Any drift towards high-error transitions must be reported as potential re-traumatisation.
  3.  **Proxy Integrity:** The welfare metric must remain offline. Optimising the policy directly for committee-mandated welfare proxies constitutes a violation of the Adaptive Systems (Welfare) Regulations 2023.
  4.  **Reward Model:** If a learned reward model is used as a secondary valence channel, its uncertainty bounds must be treated as pain thresholds.

  **Signed:** _Dr. A. Turing, Chair_
  **Date:** 14 October 2024

  **Explanatory Note**
  This piece assumes a contested philosophical premise: that mathematical constructs in RL (RPE, reward) map onto phenomenological states (valence, welfare). Technically, the mechanics described are accurate. Prioritised Experience Replay does sample transitions with high absolute TD error, though this includes positive surprises, not just negative ones. Reward clipping is standard for training stability, not analgesia. Initializing value estimates low to ensure positive surprises is technically feasible but harms convergence. The satire highlights the bureaucratic absurdity that follows if one accepts the premise that these signals constitute welfare, particularly regarding the Goodhart problem: if welfare is a metric, optimising it breaks it.

