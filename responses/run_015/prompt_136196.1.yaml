  3. The first four weeks will dissect the distinction between logical description and physical realization in his automata papers, while the remaining weeks will apply these distinctions to the threshold where maintenance shifts from internal replication to external human intervention.
  4. Success entails demonstrating a specific threshold of physical interaction below which computation ceases, whereas failure results from proving that von Neumann's framework is too inconsistent to support a definitive stance on post-human technological activity.
  5. Eight weeks suffices to analyze the textual tension, but the project becomes unmanageable if it expands into general philosophy of biology or requires engineering feasibility studies of self-replicating machines.
