answer: |-
  **Opening Address: Fixed Points and Variations**
  **Day One, Morning Session**

  Distinguished colleagues, practitioners, and scholars:

  Welcome to "Fixed Points and Variations." We gather here as a deliberately hybrid body. On my left, I see those who build the world: generative artists and architects who manipulate matter and code to shape human experience. On my right, I see those who map the mind: cognitive scientists who study how we conceive of spaces, how we draw analogies, and how we understand structure itself. It is rare for these two groups to share a table. Usually, the makers view the mappers as reductionists, stripping the soul from the artifact. Usually, the mappers view the makers as intuitionists, relying on black-box genius that resists analysis.

  For the next two days, we must dissolve this border. We are here to operationalize a specific understanding of creativity, one drawn from the work of Douglas Hofstadter. We are proceeding on the premise that there is no such thing as creation *ex nihilo*. There is no blank slate. There is only the "conceptual space" we inherit, and the disciplined act of "knob-twiddling" within it. Originality does not reside in inventing a new theme; it resides in the rigorous selection of which variables to twist, and, more crucially, which variables to freeze.

  To ground this abstraction, I want to introduce a pedagogical scenario that has framed the preparation for this workshop. We call it "The Frozen Parameter."

  Imagine we hand every team in this room an identical base object: a simple, modular chair. It has legs, a seat, a back, and hinges. We tell the teams they may alter every dimensional, material, and functional variable they wish—*except one*. One parameter is locked. For Team A, the seat height is frozen at exactly 43 centimeters. They can make the chair out of glass, they can make the backrest spiral like a DNA strand, but the distance from floor to seat must remain 43 centimeters. For Team B, the object must remain collapsible with precisely three hinges. They can change the height, the material, the ergonomics, but the kinematic logic of the collapse is invariant.

  Now, consider the result. If Team A produces a chair that looks radically different from Team B's, is it because they are more "creative"? No. It is because they were navigating a different topological space. The constraint was not an obstacle to their creativity; it was the necessary condition for it. Without the frozen parameter, the variation is arbitrary. With it, the variation becomes legible. It becomes a statement.

  This brings me to the thesis I wish to defend over the next forty-eight hours. It is a strong claim, and I offer it without hesitation: **A project in this domain succeeds precisely to the degree that it makes its frozen parameter explicit and visible.**

  There is a temptation, particularly among designers, to hide the scaffolding. We want the work to appear seamless, as if it emerged fully formed from the ether. We want the invariant to be a secret secret, known only to the author. I argue that this is a failure of communication. When you hide the invariant, the audience cannot distinguish between a disciplined variation and a random mutation. When you reveal the invariant—when you show us the knob you refused to turn—you invite us into the logic of your space. You allow us to see the boundaries of the conceptual territory you are exploring.

  Let us apply this lens to the portfolio of projects scheduled for presentation this weekend. I have reviewed the submissions, and I see three distinct categories of invariant preservation.

  First, consider the architectural submission regarding the "Variable Façade." The team proposes a building skin that shifts opacity based on sunlight. It is a beautiful system. However, in their documentation, they treat the *module size* as a given. They vary the opacity, the angle, the material density. But the grid remains 1.5 meters by 1.5 meters. This is their frozen parameter. Yet, they do not highlight it. They treat it as a technical necessity. I urge them: Make it central. If the grid is the invariant, then the poetry of the work lies in how much expression can be squeezed out of a fixed geometry. By hiding the grid, they risk the work looking like arbitrary noise. By foregrounding it, they show us the rigor of their constraint.

  Second, look to the generative art project utilizing "Algorithmic Sonification." The artist maps stock market data to auditory frequencies. The variation is in the data stream and the timbre. But the invariant—the hidden frozen parameter—is the *syntactic structure of the scale*. The work never leaves the pentatonic. If the artist presents this as "pure sonic exploration," the cognitive scientists in the room will rightly ask: "Where is the search space defined?" If the artist instead declares, "I am holding the scale constant to explore the limits of rhythmic variation," the work transforms. It becomes a study of a specific conceptual space, rather than a random walk through sound.

  Third, to my colleagues in cognitive science: You present models of analogy mapping. You show how we map "heat" to "anger." But often, you leave the *relational structure* as a background assumption. You vary the domains, but you freeze the topology of the relationship. If you do not make that topological invariance explicit, your models risk appearing as post-hoc rationalizations. You must show us the hinge that does not move.

  To the artists in the room: Do not fear that revealing your constraints reduces your mystique. It does not diminish the magic; it explains the trick so that we may marvel at the engineering of the wonder. To the scientists: Do not fear that imposing rigid invariants limits the ecological validity of your models. It is only by fixing the coordinates that we can measure the movement.

  We are here to celebrate the knob we do *not* turn. We are here to admit that we are not gods creating worlds, but gardeners pruning branches. The beauty of the garden is not that the seeds appeared from nowhere, but that we chose which stems to cut and which to let grow.

  Over the next two days, I challenge every presenter to identify their "43 centimeters." What is the one thing you refused to change? And I challenge every audience member to listen for it. If you cannot find the frozen parameter, ask the speaker to reveal it. If they cannot name it, we must ask whether the variation is truly disciplined, or merely accidental.

  Let us begin the work of making our invariants visible. Thank you.

  ***

  **Speaker's Postscript: A Self-Critical Note**

  In preparing this address, I have adopted a stance that requires philosophical qualification. My defense of the "explicit invariant" leans heavily on a structuralist reading of Douglas Hofstadter's conceptual-space model, specifically prioritizing *Gödel, Escher, Bach* and *The Creative Core* over his later work on "slippage." Hofstadter often argues that high-level creativity involves the *shattering* of a conceptual space—the moment when a knob breaks off and becomes a new axis, or when the invariant itself is revealed to be mutable (the "frame shift"). By insisting that success lies in *preserving* and *revealing* the invariant, I may be underestimating the cognitive leap that occurs when a practitioner realizes the constraint itself was an illusion.

  Furthermore, my address treats cognitive scientists as a monolith seeking explicit structural definitions. In reality, much contemporary work in conceptual spaces (following Gärdenfors) focuses on how invariants are *discovered* dynamically through interaction, rather than imposed *a priori* as pedagogical constraints. My "Frozen Parameter" exercise implies a top-down design logic that may not fully capture the bottom-up emergence that many in the cognitive science cohort study. I have privileged the legibility of the design process over the fluidity of the cognitive phenomenon, a trade-off necessary for the rhetorical cohesion of this opening, but one that should be scrutinized during the Q&A sessions.
