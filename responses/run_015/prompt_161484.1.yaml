answer: |-
  **Prediction: They will rule it Corrupt.**

  **The Rule They Are Running**
  They are not running the "Private Consideration" rule (Rule 1). If they were, the new case would likely be cleared: the official had no duty to advise, she exercised no override, and the documents were truthful. Her private gain did not displace the specific public *action* required of her.

  They are running the "Systemic Trust" rule (Rule 2): *Corruption is any practice that, allowed generally, would build a market in official access or wreck the trust the office needs.*

  **Reasoning**
  Look at **Precedent 5 (The Revolving Door)**. The regulator took a bank job with no decision shown to have been bent. Under Rule 1, that is not corrupt; the office's reasons for acting (regulation) were fulfilled correctly. But the Commission ruled it corrupt. Why? Because the *structure* of the relationship creates a market in future access, regardless of the specific outcome.

  Now look at **Precedent 2 (The Clan Contract)**. The work was good, the price fair, and the local norm supported it. Under a strict "public duty" definition, the office's reason for existing (providing water) was met. But the Commission ruled it corrupt. Why? Because allowing it generally would replace universal access with kinship access, wrecking the trust required for a national service.

  In your new case, the automated system is designed to remove human discretion to ensure equal access. By selling "formatting assistance" based on insider knowledge, the official creates a paywall around that neutrality. If allowed generally, suppliers will not compete on merit, but on who pays the most for upload assistance. That builds a market in official access. The Commission's track record shows they sacrifice specific outcomes (Case 2) and ignore the lack of specific harm (Case 5) to protect the system's integrity.

  **The Analogs**
  *   **Closest Analog:** **Precedent 5 (The Revolving Door).** In both instances, the official monetizes their status and knowledge derived from the office without necessarily altering a specific decision or violating a direct order. The corruption lies in the *commodification of the position itself*, not the manipulation of a specific file.
  *   **The Cut Against:** **Precedent 3 (The Goat).** One could argue the payment for formatting is akin to a customary gift for service. However, the Goat was non-monetary, post-decision, and culturally embedded without creating a competitive advantage. The new case involves a monetary transaction *during* the process that directly impacts the scoring mechanism, distinguishing it from a token of gratitude.

  **The Settling Case**
  To definitively prove they are running Rule 2 (Systemic Trust) and not Rule 1 (Private Consideration/Displacement), you need a case where an official gains privately but displaces *no* public duty and causes *no* systemic market distortion.

  **The Case:** An official accepts a paid speaking engagement at a university during their annual leave, discussing general challenges in their sector, without revealing confidential data.
  *   **Rule 1 (Private Consideration):** Not corrupt. No duty displaced, no confidential info leaked, private time.
  *   **Rule 2 (Systemic Trust):** Corrupt. It monetizes the title and knowledge gained from public office, potentially building a market where access to the official's "expertise" is bought.

  If they rule this **Corrupt**, they are strictly enforcing the "no market in official access" principle (Rule 2). If they rule **Not Corrupt**, they acknowledge a boundary where private gain is permissible if public duty is untouched, which might exonerate your upload official.

  **On the "Western Definition"**
  Condemning the clan contract (Precedent 2) does not mean they are importing a "Western" definition. It means they are enforcing a **Weberian** one.

  The distinction isn't West vs. Rest; it's **Universalistic vs. Particularistic**. A "Western" definition often focuses on individual financial gain. The Commission's ruling on the clan contract had no financial gain for the officer, yet it was corrupt. This shows they are prioritizing *State-Building* over *Cultural Relativism*. They are asserting that the State's authority must supersede kinship obligations to function as a modern bureaucracy. That is a choice made by integrity commissions in Singapore, Rwanda, and Georgia as much as in the UK or US. It is not Western; it is **Statist**. They are defining corruption as anything that fragments the state's monopoly on impartial administration.
