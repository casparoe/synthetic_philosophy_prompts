      *   *Case 6* kills the "no personal gain" defense.

      *   *The Real Rule:* **Corruption is the monetization or privatization of public authority, regardless of outcome or direct personal enrichment.** It's about the *boundary* between the office and the private sphere.

  6.  **Predicting the Ruling:**
