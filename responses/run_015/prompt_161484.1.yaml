      *   *Rule B (Systemic Trust/Market):* Corruption is any practice that, allowed generally, would build a market in official access or wreck the trust the office needs. (Focus on *consequences/systemic integrity*).

      *   *Applying Rule A to New Case:* Did the official's private gain (payment) displace public duty? She had *no duty* to advise. She didn't override anything. The docs were true. The system is automated. One could argue she performed a private service (consulting) that didn't interfere with her public role because her public role *doesn't include* advising. However, she is still an official selling access to her knowledge of the system.
      *   *Applying Rule B to New Case:* If allowed generally, does this build a market in access? Yes. Rich suppliers pay officials to optimize uploads; poor ones don't. It creates an uneven playing field despite the "automated" nature. It wrecks trust in the neutrality of the process.

  5.  **Re-evaluating the Precedents to Find the *Actual* Rule:**
      *   *Look at Case 2 (Clan):* Local norms said it was fine, work was good. Ruling: Corrupt. This suggests the Commission prioritizes *universalistic standards* over *particularistic norms*. It rejects "good outcomes" if the *process* implies preferential treatment based on identity.
      *   *Look at Case 5 (Revolving Door):* No decision bent. Ruling: Corrupt. This is crucial. It means *actual harm/bias in the specific decision* is not required. The *potential* or the *structural conflict* is enough.
      *   *Look at Case 6 (Scholarships):* No individual gain. Ruling: Corrupt. This means *personal enrichment* is not required. Institutional influence peddling counts.
      *   *Look at Case 3 (Goat):* Customary gift. Ruling: Not Corrupt. Why? Likely because it's tokenistic, post-facto, and culturally embedded *without* creating a market for access.
      *   *Look at Case 4 (Generator):* Private money, public good. Ruling: Not Corrupt. Why? Because the resource flow was Private -> Public, not Public -> Private (or Private -> Private via Public office).

      *   *Synthesis:* The Commission seems to care less about "did the decision change?" (Case 1 & 5 say no) and less about "did the official get rich?" (Case 6 says no). They care about **the commodification of public office.**
      *   *Case 2* kills the "local norm" defense.
