answer: |-
  Here is a single principle designed to capture your verdicts, followed by the required analysis and predictions.

  ### The License-and-Containment Principle

  **An utterance of a slur $S$ targeting group $G$ is permissible if and only if the speaker satisfies both the License Condition and the Containment Condition, and is not exempted by the Epistemic Clause.**

  1.  **The License Condition:** The speaker must possess **Semantic License**. This is held *only* by:
      *   **(a) In-Group Solidarity:** A member of $G$ using $S$ to affirm identity or solidarity (Reclamation); *provided that* $G$ is a group subject to systemic marginalization (not merely voluntary association).
      *   **(b) Referential Necessity:** A non-member using $S$ strictly to report, analyze, or quote the term itself (Meta-linguistic), where no neutral synonym preserves the factual accuracy required by the context.
  2.  **The Containment Condition:** The derogatory force of $S$ must be clearly **Attributed**.
      *   If relying on **(a)**: The usage must not reinforce internal hierarchy or self-hatred within $G$ (i.e., it cannot be used as abuse *against* $G$).
      *   If relying on **(b)**: The usage must be explicitly framed as belonging to another source (a quote, a character, a headline being analyzed), not the speaker's own narrative voice.
  3.  **The Epistemic Clause:** The speaker is blameworthy only if they could reasonably be expected to know the social history and status of $S$.

  ***

  ### Why the Clauses Exist (Case Mapping)

  *   **License (a) [In-Group Solidarity]:** Forced by **Case 6** (Fine) vs. **Case 9** (Not Fine). Only members of $G$ can reclaim the term for warmth. Outsiders lack the historical standing to neutralize the toxicity.
  *   **License (a) Limit [Systemic Marginalization]:** Forced by **Case 15** (Voluntary Group). Reclamation relies on resisting systemic oppression, which doesn't apply to hobbies or diets. This explains why you feel reclamation "doesn't work" there.
  *   **License (b) [Referential Necessity]:** Forced by **Case 1** (Lecturer) and **Case 3** (Hate Crime Report). Non-members can say it, but only when talking *about* the word or the crime, not for entertainment (Case 2, Tabloid).
  *   **Containment [Attribution]:** Forced by **Case 4 vs. Case 5**. In 4 (Narration), the author's voice normalizes the slur (No Attribution). In 5 (Dialogue), the prejudice is contained within the character (Attribution). The author reports the slur; they do not *use* it.
  *   **Containment [Internal Abuse]:** Forced by **Case 7** (In-Group Policing). Even a member of $G$ loses License if they use the term to oppress another member. Reclamation is for solidarity, not internal hierarchy.
  *   **Epistemic Clause:** Forced by **Case 11** (Old Timer) vs. **Case 12** (Non-Native Interviewee). The 80-year-old is excused because his linguistic framework predates the slur's toxicity. The interviewee is held to a higher standard because professional contexts demand due diligence.

  ***

  ### Predictions for New Cases

  **(a) A member of $G$ puts $S$ in a song that ends up on mainstream radio, heard mostly by people outside $G$.**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** The artist satisfies **License (a)** (In-Group Solidarity/Expression). The song is an artistic assertion of identity. The fact that out-group members hear it does not void the license (see **Case 13**, where you verdicted "Fine" despite the mixed crowd).
  *   **Nuance:** Your "flinch" in Case 13 is acknowledged by the principle as an emotional response to risk, not an ethical violation. The principle distinguishes between *permission to speak* and *audience comfort*.

  **(b) An AI assistant, asked to reproduce a historical speech verbatim with $S$ spelled out, does so.**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** The AI satisfies **License (b)** (Referential Necessity). To reproduce history accurately, the term is required. It satisfies **Containment** because the AI is quoting a historical source, not generating the slur as its own voice. It is functionally identical to **Case 1** (Lecturer) or **Case 3** (Court Report).

  ***

  ### Collateral Damage (Where the Principle Diverges from Your Intuitions)

  No principle fits perfectly. Here is where this one forces you to adjust your verdicts or accept a gap:

  1.  **Case 3 (Local Paper):** Your verdict was "Fine-ish, but I'd rather they'd written 'racial slur'."
      *   **Principle Verdict:** **Fine.**
      *   **Conflict:** The principle treats accurate reporting of a hate crime as a *Referential Necessity*. It argues that sanitizing the evidence ("racial slur") can obscure the specific nature of the threat. Your preference for "racial slur" is a matter of *prudence/style*, but the principle deems the explicit word ethically permissible in this specific context.
  2.  **Case 9 vs. Case 10 (Severity):** You feel 10 (Out-group abuse at out-group target) is *worse* than 9 (Out-group warmth at in-group target).
      *   **Principle Verdict:** **Both Impermissible.**
      *   **Conflict:** The principle is binary (Permissible/Not Permissible). It explains *why* both are wrong (Lack of License), but it does not inherently rank the severity. It captures the *violation*, not the *degree* of harm. You would need a secondary metric (e.g., "Intent to Harm") to explain why 10 feels worse than 9.
  3.  **Case 13 (Rally Flinch):** You said "Fine, but I flinch when out-group people are in the room."
      *   **Principle Verdict:** **Fine.**
      *   **Conflict:** The principle validates the speaker's right to reclaim the term regardless of the audience. It suggests your flinch is a safety anxiety (fear of misuse by listeners), not an ethical objection to the speaker. If you hold that the *presence* of out-group members makes it "Not Fine," the principle cannot save that verdict without adding a "Audience Composition" clause, which would undermine In-Group License.

  ### Summary
  The **License-and-Containment Principle** prioritizes **who owns the word** (License) and **where the toxicity lands** (Containment). It successfully reconciles the 4/5 split (Narrative Voice vs. Character Voice) and the 7/6 split (Solidarity vs. Internal Abuse), which were your hardest contradictions. It asks you to accept that accurate reporting (Case 3) and public reclamation (Case 13) are ethically sound, even if they feel uncomfortable.
