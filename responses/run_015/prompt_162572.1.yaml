answer: |-
  **Seminar Handout: Causation and Structure in *Omelas***
  **Session Topic:** Causation by Omission beyond the Atomic Case
  **Primary Text:** Ursula K. Le Guin, *The Ones Who Walk Away from Omelas* (1973)

  ### 1. The Core Verdict
  **Do the citizens cause the child's suffering?**
  Yes, but not as discrete atomic agents. They cause it as *nodes in a structural network*.

  *   **On Counterfactual Dependence:** The child's suffering counterfactually depends on the *collective* omission. It does not strictly depend on any *single* citizen's omission (due to redundancy/overdetermination: if Citizen A rescues the child, the city falls, but if Citizen A does nothing, Citizen B likely does nothing too). However, under an interventionist framework (Woodward), if we intervene on the variable *Citizen Action* (setting it to "Rescue"), the outcome *Child Suffering* changes. Thus, the omission is a cause.
  *   **On Process/Production:** There is no physical energy transfer from the citizens to the child. Process theorists (e.g., Dowe) must classify this as "quasi-causation" grounded in norms, not physics. The story's "magical stipulation" makes this explicit: the causal link is nomological (rule-based), not mechanical.
  *   **On Dependence vs. Production:** This case drives a wedge between the two. The citizens *depend* the suffering (it wouldn't persist without their collective inaction), but they do not *produce* it (they did not create the initial condition). This suggests causation-by-omission is fundamentally a relation of **sustenance**, not initiation.

  ### 2. Three Textual Anchors for Analysis
  Direct students to these specific passages to ground the metaphysical claims:

  1.  **The Stipulation (The Counterfactual):**
      > *"If the child were brought up into the sunlight and out of the place of filth, and cleaned and fed and comforted, that would be a good thing indeed; but if it were done, in that day and hour all the prosperity and beauty and delight of Omelas would vanish and be destroyed."*
      *   **Metaphysical Work:** This establishes the counterfactual dependency. It defines the "default" state (suffering) and the "deviant" state (relief). It clarifies that *any* positive intervention (feeding, cleaning, comfort) breaks the causal chain sustaining the city.

  2.  **The Knowledge (The Ratification):**
      > *"They all know it is there... Some of them understand why, and some do not, but they all understand that their happiness, the beauty of their city... depend wholly on this child's abominable misery."*
      *   **Metaphysical Work:** This secures the "Ratifying Omission." The omission is not a failure of attention; it is a sustained, known variable in the social system. It transforms the omission from a *privatio* (lack of being) into a *decision* (maintenance of state).

  3.  **The Walkers (The Causal/Moral Divergence):**
      > *"They walk ahead into the darkness, and they do not come back... The place they go towards is a place even less imaginable to most of us than the city of happiness."*
      *   **Metaphysical Work:** The walkers perform an act (leaving) that changes *nothing* for the child. This demonstrates that moral absolution (walking away) does not equal causal intervention. It highlights that the causal power lay in the *presence* (the collective omission), not the individual's moral state.

  ### 3. The Metaphysical Payoff: "Ratifying Omission"
  Your distinction between **private/unwitting omission** and **ratifying omission** is not merely moral rhetoric; it is metaphysically significant for the following reason:

  *   **Event Individuation:** In the standard literature (the gardener, the driver), the omission is often defined by a failure to meet an external expectation. In Omelas, the omission is *constitutive* of the social fact. The citizens do not merely "fail to act"; they "act to maintain the status quo."
  *   **The Default/Deviant Distinction:** Causal modeling (e.g., Hitchcock, Knobe) relies on distinguishing default values from deviant values. In standard cases, "watering" is the default. In Omelas, "not intervening" is the institutional default. Your "ratifying omission" suggests that **social institutions can shift the metaphysical default**.
  *   **Verdict on your Suspicion:** You are correct. The story suggests that causation by omission in structural contexts is a **social relation**, not an individual one. An individualist metaphysics (single agent vs. single outcome) cannot capture the redundancy and the institutional enforcement present here. The "cause" is the *Practice*, of which the citizens are merely instances.

  ### 4. Where the Story Resists the Framework
  Do not smooth these over. Put them on the board as limits of the theory.

  *   **The Magic Problem:** The link between the child's suffering and the city's joy is stipulative, not mechanistic. Real-world structural harm (e.g., economic inequality) usually has hidden mechanisms (supply chains, laws). Omelas has *none*. This tests whether causation requires a mechanism or if counterfactual dependence is sufficient. If your theory requires a physical process, Omelas is not a case of causation at all—it is a correlation enforced by a god/narrator.
  *   **The Walker's Inertness:** If causation is about difference-making, the walkers make no difference to the child. Yet, the story treats their departure as the only meaningful response. This suggests that **moral responsibility can outrun causal responsibility**. If the goal of the metaphysics of causation is to ground responsibility, Omelas suggests it fails.
  *   **The Child's Agency:** The child is "too damaged to resist or even to complain." In standard omission cases, the victim often has some causal role (e.g., the plant grows toward light). Here, the child is a pure patient. This creates a **unidirectional causal arrow**. It challenges views that see causation as an interaction between agents. It forces the question: Can an omission be a cause if the victim lacks the capacity to be a causal relata in return?

  ### 5. Specific Answers to Your Constraints

  *   **Redundancy:** An interventionist treatment must model the citizens not as independent variables $C_1, C_2... C_n$, but as a collective variable $C_{collective}$. If $C_{collective} = 0$ (all omit), Effect = Suffering. If $C_{collective} = 1$ (any intervene), Effect = Relief. The individual citizen is a cause only insofar as they are a necessary part of a sufficient set (INUS condition) for the *continuation* of the practice.
  *   **Informedness:** Informedness belongs in the **metaphysics of omission**, not just the ethics. An omission is defined relative to a norm or expectation. If the agents do not know the norm (the deal), their inaction is merely "not doing." If they know, their inaction is "refraining." This changes the event type. Omelas suggests that **epistemic access fixes the causal relata**.
  *   **The Walkers (Act vs. Omission):** Departure is an act, but it is causally inert regarding the child. It is best described as an **omission to contest**. However, since contesting is structurally impossible (one person cannot change the rule), the story concedes that **causal notions cannot do the moral work here**. The walkers seek moral purity, not causal efficacy.
  *   **Terms of the Deal:** You are correct that the terms forbid kindness. Any alleviation (speaking kindly, cleaning) counts as "bringing up into the sunlight." The omission must be total. This reinforces the "Process View" problem: even a sound wave (kind speech) is physically blocked by the metaphysical rule.

  ### 6. One Claim to Add to the Debate
  **The Claim:** *Omelas* demonstrates that causation by omission is not merely the absence of a cause, but the **presence of a constraint**.

  Standard literature treats omission as a lack (the gardener's water is missing). *Omelas* treats the omission as a structural wall (the citizens' inaction is a positive force holding the reality in place). This shifts the metaphysics from **Negative Facts** (what didn't happen) to **Structural Powers** (what is being prevented from happening). This offers a way to discuss structural injustice without relying on the problematic ontology of "negative events."

  ### 7. Seminar Discussion Questions
  1.  If the link between the child and the city is magical rather than mechanical, does that disqualify the citizens as *causes* on a Process view, or does it simply show that Process views are inadequate for social metaphysics?
  2.  Does the "Ratifying Omission" require that the agents have the *power* to change the outcome? If a single citizen rescues the child but the city collapses instantly, did they cause the collapse? (Distinguish between causing the relief and causing the collapse).
  3.  The walkers leave to avoid complicity, knowing they change nothing for the child. Does this prove that moral responsibility is independent of causal responsibility? If so, why do we use causation to assign blame in law and ethics?
  4.  Is the child's lack of agency a necessary feature of causation-by-omission cases, or does it render this a special case of *domination* rather than *causation*?
