answer: |-
  Your epistemic-priority rule captures a vital intuition—that precommitment often protects a "better" self from a "worse" self—but it fails as a general justification. It cannot explain why contracts bind without epistemic asymmetry (Case 6), why servitude is void even if the later self is "worse off" (Case 7), or why constitutional rights are entrenched despite founders lacking epistemic superiority (Case 8). The rule survives only as a heuristic for identifying impaired agency (addiction, mania), not as the ground of legitimacy.

  You must sacrifice the confidence in Case 3's superiority over Case 1 if you cannot explain why mechanical friction is more respectful than human discretion; however, a better principle resolves this by focusing on *reversibility*. The tension between Case 15 (Vegan) and Case 1 (Addict) is not epistemic but structural: addiction is a pathology of agency, whereas veganism is a revision of ends. Precommitment is legitimate only when it protects the *capacity* for agency against transient impairments, not when it forecloses the *revision* of ends.

  The unifying principle for personal and constitutional cases is **Agency Continuity**. Both persons and polities are continuing agents entitled to bind themselves to facilitate planning, but not to surrender the capacity to revise ends or exit the arrangement. The resemblance is not metaphorical; both cases involve a temporal extension of self-government. The founders bind successors only insofar as they protect the conditions under which successors can govern themselves (rights), not when they impose substantive policies (tariffs) that treat successors as subjects rather than agents.

  Applying this to your unsettled cases: A competent eighty-five-year overriding a living will must succeed; the current capacity for agency outweighs the past instruction because the condition (competence) remains intact. A company charter locking its mission is void if it prevents shareholders from pivoting to ensure survival, as corporate agency requires adaptability; however, frictional costs for amendment are valid. Finally, the reverse lock in Case 14 (blocking a persistent majority) is illegitimate; friction must yield to persistent will, or it becomes domination.

  The residual question your cases expose but no principle can close is the *decay rate* of legitimacy (Case 14). We know legitimacy weakens as the original agents die off, but there is no formula for when a constitution becomes merely a historical artifact rather than a binding promise. This depends on a sociological fact—whether the living recognize themselves in the past settlement—which is outside normative logic.

