prompt: |-
  I chair the serious incident review panel at a ~500-bed hospital — we meet every other week, about 90 minutes per case, and the output that matters is a short "causal findings" section that says things like "the delay in giving antibiotics caused the septic shock" or "admission on a weekend contributed to the worse outcome." Those reports go to the family, to the department involved, and to legal, and they trigger things: a new protocol, mandatory training, sometimes a budget line. Six of us: two nurses, two physicians, a risk manager, and me. I did some philosophy as an undergrad, which is why I'm writing this, and nobody else on the panel has any formal training in it.

  I've become convinced we're making two specific messes and I want a procedure, not an explanation.

  Mess one: we conflate two quite different claims. (a) "this patient would not have died if the delay hadn't happened" — a one-off counterfactual about this admission — and (b) "if we changed the system so this kind of delay can't happen, future patients like this one do better" — a claim about what would happen under an intervention. These can come apart in both directions: sometimes (a) is true and (b) is false because this was a fluke that our fix wouldn't touch, and sometimes (b) is true and (a) is false because something else in that admission would have killed her anyway and the delay just happened to be there first. The family reads the report wanting (a); the department is supposed to act on (b). We write one sentence that pretends to be both.

  Mess two: we write findings about things nobody can say how to change. "Weekend admission," "frailty," "poor handover," "the patient's race." Nobody can tell me what we would actually do to set those to a value, or what else would move along with them if we did. Half the time the honest answer is that the intervention isn't specified, so we don't know what question we're even asking.

  So: write me a procedure the panel can actually run in our 90 minutes, as an ordered set of tests — what to ask first, what counts as a sufficient answer at each step given what we have (the chart, maybe two interviews, occasionally registry data; we can't randomize anything), where it stops with "no causal finding," and where it hands the decision to a person because the question is one of values and not facts. It has to do something useful with: counterfactuals that quietly rewrite earlier events ("if she hadn't been admitted Friday she'd have been seen by a different team entirely"), overdetermination, and causes we can't manipulate. Give us a small set of sentence templates for what we can defensibly assert at each exit point — the wording has to be readable by a grieving family and survivable in a deposition, and legal and I both sign off.

  Then run it on three: the delayed-antibiotics/septic-shock case; a "weekend admission caused the worse outcome" finding; and a case where the panel wants to write that the patient's race caused the worse outcome and the only real evidence is a disparity in our own numbers plus some notes about how staff spoke to her. Include at least one where the procedure gives me an answer I won't like. And tell me plainly where it will misfire on us and what it can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a Serious Incident Review (SIR) panel at a 500-bed hospital.
      *   **Context:** Meets bi-weekly, 90 mins/case. 6 members (2 nurses, 2 MDs, 1 risk manager, 1 chair).
      *   **Output:** "Causal findings" section (short, actionable, readable by family/legal/dept).
      *   **Problem:** Two specific "messes":
          1.  Conflating *specific counterfactuals* (this patient) with *general intervention efficacy* (future patients).
          2.  Citing non-manipulable causes ("weekend," "race," "frailty") without specifying the intervention.
      *   **Background:** Chair has undergrad philosophy training (recognizes counterfactuals, manipulationism, etc.). Others do not.
      *   **Task:** Create a *procedure* (ordered tests/steps) for the 90-minute meeting.
          *   Must handle limited data (chart, interviews, registry).
          *   Must define exit points ("no causal finding" vs. "value judgment").
          *   Must address counterfactuals, overdetermination, and non-manipulable causes.
          *   Must provide sentence templates (family-readable, legally defensible).
          *   Must apply the procedure to three specific cases (Antibiotics, Weekend, Race).
          *   Must include an outcome the Chair won't like.
          *   Must admit limitations (where it misfires).

  2.  **Deconstruct the Philosophical Problems:**
      *   *Mess 1 (Specific vs. General):* This is the distinction between *token causation* (actual cause in this instance) and *type causation* (general causal law). The procedure needs to separate the finding of "what happened here" from the recommendation "what to change."
      *   *Mess 2 (Manipulability):* This aligns with the Manipulationist Theory of Causation (Woodward). A cause must be something we can wiggle to see a change in the effect. "Weekend" isn't manipulable; "Staffing levels on weekends" is. "Race" isn't manipulable; "Bias in triage protocols" is.

  3.  **Drafting the Procedure (The "SIR Causal Protocol"):**
      *   *Constraint:* 90 minutes. Needs to be tight.
      *   *Structure:* Step-by-step filters.
      *   *Step 1: Fact Establishment.* (What actually happened?)
      *   *Step 2: The Counterfactual Test (Token).* (Would this patient have survived *if* X hadn't happened?)
      *   *Step 3: The Manipulation Test.* (Can we actually change X?)
      *   *Step 4: The Generalization Test (Type).* (If we change X, will future patients benefit?)
      *   *Step 5: The Value/Policy Handoff.* (If the answer is "yes but it costs too much" or "yes but it changes culture," that's not a causal finding, that's a policy decision.)

  4.  **Developing Sentence Templates:**
      *   Need to be precise. Avoid "caused" if it's probabilistic. Avoid "weekend" if it's not manipulable.
      *   *Template A (Strong Link):* "The delay in X directly contributed to Y."
      *   *Template B (Systemic Link):* "The absence of protocol X increased the risk of Y."
      *   *Template C (No Finding):* "Review identified no modifiable factors..."
      *   *Template D (Value Judgment):* "The outcome reflects a trade-off between..."

  5.  **Applying to the Three Cases:**
      *   *Case 1: Delayed Antibiotics/Sepsis.*
          *   Token: Yes, delay led to shock.
          *   Manipulable: Yes, protocol for antibiotics.
          *   General: Yes, faster antibiotics help sepsis.
          *   *Result:* Standard finding.
      *   *Case 2: Weekend Admission.*
          *   Token: Maybe.
          *   Manipulable: No. You can't ban weekend admissions.
          *   Reframe: What about weekends is the cause? Staffing? Senior cover?
          *   *Result:* If staffing is the same, "Weekend" is not a cause. Finding might be "No causal finding regarding timing." (This might be the one the Chair won't like if they want to blame the weekend).
      *   *Case 3: Race/Disparity.*
          *   Token: Patient is Black, outcome worse.
          *   Manipulable: No. Cannot change race.
          *   Reframe: What correlates with race here? Bias? Communication? Triage?
          *   Evidence: Disparity stats + notes on staff speech.
          *   *Result:* "Race" cannot be the cause. "Communication breakdown linked to implicit bias" might be. If evidence is weak, "No causal finding." (This is likely the uncomfortable one).

  6.  **Refining the Procedure for the 90-Minute Constraint:**
      *   Need to ensure it doesn't become a philosophy seminar.
      *   Add a "Stop Rule." If Step 2 fails, stop. Don't go to Step 4.
      *   Add a "Risk Manager Veto" on legal language.

  7.  **Addressing the "Chair Won't Like" Requirement:**
      *   The procedure should force the panel to admit when they *don't* know or when a factor isn't actually causal.
      *   Example: The "Weekend" case often results in "No causal finding" because "Weekend" isn't a mechanism. The panel usually *wants* to say "Weekend effect." The procedure should block that unless they identify the *mechanism* (e.g., reduced staffing).
      *   Example: The "Race" case. The panel wants to acknowledge disparity. The procedure forces them to identify the *modifiable* factor. If they can't (e.g., it's societal, not hospital-specific), the procedure forces a "No causal finding" regarding hospital action, which is uncomfortable but honest.

  8.  **Addressing Limitations:**
      *   Hindsight bias.
      *   Data quality (charts lie).
      *   Time pressure (90 mins is short for deep root cause).
      *   Political pressure (administration wants a fix).

  9.  **Review against Constraints:**
      *   Procedure? Yes.
      *   Ordered tests? Yes.
      *   Exit points? Yes.
      *   Sentence templates? Yes.
      *   Three cases run? Yes.
      *   Uncomfortable answer included? Yes.
      *   Limitations admitted? Yes.
      *   Tone: Professional, direct, acknowledging the Chair's philosophical background without alienating the rest of the panel.

  10. **Final Polish:** Ensure the distinction between Token (this patient) and Type (future patients) is clear in the templates. Ensure "Manipulability" is translated into "Actionable Factor" for the non-philosophers. (Self-Correction: Don't use words like "token/type" in the actual procedure handout. Use "Specific Case" vs. "Systemic Rule".)

  *(Self-Correction during drafting)*: I need to make sure I don't just give a philosophy lecture. The user asked for a *procedure*. The philosophy is the engine, but the output must be a checklist. I will structure the response with the Protocol first, then the Templates, then the Case Runs, then the Limitations.

  *(Refining the "Race" case)*: This is delicate. Saying "Race caused the outcome" is scientifically and ethically problematic in this context. The procedure must force the panel to find the *proximal* cause (e.g., "pain management protocol not followed") rather than the demographic correlate. If the only evidence is "disparity in numbers," that's epidemiology, not SIR causation for *this* patient. I need to make sure the procedure handles this rigorously.

  *(Refining the "Weekend" case)*: The "Weekend Effect" is a classic confounder. The procedure needs to force the question: "What is different about the weekend?" If the answer is "nothing we control," then it's not a causal finding for the hospital.

  *(Final check on time)*: 90 minutes. The procedure needs time estimates. Step 1 (15 min), Step 2 (30 min), Step 3 (30 min), Step 4 (15 min).

  Let's write it.cw
answer: |-
  Here is the **SIR Causal Protocol (SCP)**. It is designed to fit your 90-minute window, separate the two messes you identified, and produce defensible text. It translates your philosophical concerns into operational checks for the nurses, physicians, and risk manager.

  ### Part 1: The Procedure (90 Minutes)

  **Pre-Work (Before the meeting):**
  *   **Risk Manager:** Pre-screens chart for legal privilege issues.
  *   **Chair:** Identifies the "Adverse Outcome" (AO) and the "Suspected Factor" (SF) from the initial report.

  **Step 1: The Fact Lock (15 Minutes)**
  *   **Goal:** Agree on the timeline. No causation without sequence.
  *   **Test:** Can we map the SF and the AO on a timeline with 30-minute resolution?
  *   **Fail State:** If the timeline is ambiguous (e.g., "meds given sometime during shift"), stop.
  *   **Output:** "No causal finding: Timeline indeterminate." (Use Template E).
  *   **Pass:** Proceed to Step 2.

  **Step 2: The Specific Counterfactual (30 Minutes)**
  *   **Goal:** Address Mess One (Part A). Did the SF cause the AO *for this patient*?
  *   **Test:** The "But-For" Question. "Holding all else constant, if the SF had not occurred, is it *more likely than not* (>50%) that the AO would have been avoided?"
  *   **Constraint:** Do not change *other* facts. (e.g., If testing "delayed antibiotics," do not imagine she arrived on a Tuesday. Keep it Friday. Keep her vitals. Change only the antibiotic time).
  *   **Overdetermination Check:** If there were two fatal errors (e.g., wrong drug AND delayed drug), acknowledge both. Do not pick one to exonerate the other.
  *   **Fail State:** If the panel agrees the patient likely would have died anyway (e.g., fulminant disease), stop.
  *   **Output:** "No causal finding: Outcome likely inevitable." (Use Template E).
  *   **Pass:** Proceed to Step 3.

  **Step 3: The Manipulation Check (30 Minutes)**
  *   **Goal:** Address Mess Two. Is the SF something we can actually change?
  *   **Test:** The "Intervention" Question. "What specific protocol, resource, or behavior change would remove the SF?"
  *   **Constraint:** You cannot manipulate demographics, time, or inherent biology. You *must* name a lever.
      *   *Bad:* "Weekend admission."
      *   *Good:* "Reduced senior staffing on weekends."
      *   *Bad:* "Patient race."
      *   *Good:* "Triage scoring bias" or "Communication protocol."
  *   **Fail State:** If the only lever is "don't admit on weekends" or "change patient demographics," stop.
  *   **Output:** "No causal finding: Factor not modifiable." (Use Template E).
  *   **Pass:** Proceed to Step 4.

  **Step 4: The Generalization Handoff (15 Minutes)**
  *   **Goal:** Address Mess One (Part B). Does fixing the SF help *future* patients?
  *   **Test:** The "Policy" Question. "Is there evidence (literature or internal data) that fixing the Lever identified in Step 3 improves outcomes generally?"
  *   **Decision Point:**
      *   If **Yes**: Write the Causal Finding (Templates A or B).
      *   If **No/Uncertain**: This is a Value/Policy decision, not a Causal Finding. Hand off to Administration.
  *   **Output:** Causal Finding or "Referral for Policy Review." (Template C or D).

  ---

  ### Part 2: Sentence Templates

  These are drafted to survive legal scrutiny and family reading. They distinguish between *what happened* and *what we will do*.

  **Template A (Strong Specific & Systemic Link)**
  > "The review concludes that [Specific Factor, e.g., the 90-minute delay in antibiotic administration] directly contributed to [Adverse Outcome]. This delay resulted from [Modifiable Lever, e.g., a gap in the sepsis alert protocol]. Correcting this lever is expected to reduce risk for future patients."

  **Template B (Systemic Link Only / Specific Uncertain)**
  > "While the specific contribution to this outcome cannot be quantified, the absence of [Modifiable Lever] created conditions where [Adverse Outcome] was more likely. Implementing [Intervention] is recommended to mitigate this risk for future patients."

  **Template C (Policy Handoff / Value Judgment)**
  > "The review identified [Factor] as a contributor. However, mitigating this factor requires resource allocation decisions beyond clinical protocol (e.g., weekend staffing levels). This finding is referred to Hospital Administration for policy determination."

  **Template D (No Causal Finding - Inevitability)**
  > "The review found that while [Factor] occurred, the clinical progression suggests the [Adverse Outcome] would likely have occurred regardless. No modifiable causal link was established."

  **Template E (No Causal Finding - Non-Manipulable)**
  > "The review identified [Factor, e.g., weekend timing] as correlated with the outcome. However, this factor is not directly modifiable. No specific hospital process was identified that, if changed, would have altered the outcome."

  ---

  ### Part 3: Running the Protocol on Three Cases

  #### Case 1: Delayed Antibiotics / Septic Shock
  *   **Step 1 (Facts):** Chart shows order at 14:00, administration at 16:30. Shock at 17:00. **Pass.**
  *   **Step 2 (Counterfactual):** Panel agrees: If given at 14:30 (guideline), shock likely avoided. **Pass.**
  *   **Step 3 (Manipulation):** "Delay" is not manipulable. "Pharmacy verification time" or "Nurse availability" is. Panel identifies "Pharmacy verification required for first dose" as the lever. **Pass.**
  *   **Step 4 (Generalization):** Literature supports early antibiotics in sepsis. **Pass.**
  *   **Output:** **Template A.**
      *   *Wording:* "The review concludes that the 2.5-hour delay in antibiotic administration directly contributed to septic shock. This delay resulted from a requirement for pharmacy verification on first doses. Correcting this lever is expected to reduce risk for future patients."
  *   **Comment:** Clean. Does what you need.

  #### Case 2: "Weekend Admission Caused Worse Outcome"
  *   **Step 1 (Facts):** Admitted Saturday 02:00. Died Sunday. **Pass.**
  *   **Step 2 (Counterfactual):** If admitted Monday 09:00, would she have lived? Panel debates. Maybe. But Step 2 rules say "Hold all else constant." You cannot move the admission to Monday (that changes the fact). You must ask: "If admitted Saturday 02:00 *without the error*, would she have lived?"
      *   *Correction:* The SF is "Weekend." The Counterfactual is "If not weekend." This violates Step 2 constraints (you can't change time).
      *   *Pivot:* Panel tries to find the *mechanism*. Was staffing lower? Yes. Was senior cover absent? Yes.
      *   *Test:* If senior cover had been present (keeping Saturday constant), would she have lived? Panel says "Possibly." **Pass (with caveat).**
  *   **Step 3 (Manipulation):** "Weekend" is not manipulable. "Senior cover on weekends" is. **Pass.**
  *   **Step 4 (Generalization):** Does senior cover on weekends improve outcomes? Data is mixed. Administration hasn't budgeted for it.
      *   *Decision:* This is a budget/policy choice, not a pure causal finding.
  *   **Output:** **Template C.**
      *   *Wording:* "The review identified reduced senior coverage on weekends as a contributor. However, mitigating this factor requires resource allocation decisions beyond clinical protocol. This finding is referred to Hospital Administration for policy determination."
  *   **Comment:** This protects the panel. You aren't saying "Weekends kill." You are saying "Staffing levels are a policy choice."

  #### Case 3: Patient Race / Disparity / Communication
  *   **Scenario:** Black female patient, worse pain control, worse outcome. Registry shows disparity. Notes show staff described her as "agitated" more often than white patients.
  *   **Step 1 (Facts):** Pain meds delayed 4 hours. Notes show "patient aggressive." **Pass.**
  *   **Step 2 (Counterfactual):** If pain meds given on time, would outcome improve? Plausible. **Pass.**
  *   **Step 3 (Manipulation):** "Patient Race" is **NOT** manipulable. You cannot write "Race caused outcome."
      *   *Test:* What is the lever? "Triage assessment of pain" or "Staff communication training."
      *   *Evidence Check:* Do we have proof staff *bias* caused the delay, or just that the delay happened? We have "notes about how staff spoke to her" and "registry disparity."
      *   *Strict Application:* Registry data is *type* causation, not *token* causation for this chart. The chart notes are subjective. Can we prove *this* nurse delayed *because* of bias? No. We can only prove the delay happened.
      *   *Fail State:* We cannot identify the *cause of the delay* with sufficient evidence to assert causality in this specific case without speculating on mental states.
  *   **Output:** **Template E (The Uncomfortable One).**
      *   *Wording:* "The review identified a 4-hour delay in pain management. While registry data indicates disparities in pain control for similar demographics, the chart evidence does not establish a modifiable hospital process that caused the delay in this specific instance. No causal finding regarding bias can be substantiated from the record."
  *   **Comment:** **This is the answer you won't like.** It is honest. To say "Race caused this" violates the manipulation test (you can't change race). To say "Bias caused this" violates the evidence standard (you can't prove mental state from a chart note in a 90-minute review).
      *   *The Fix:* If you want a finding here, you must change the investigation *before* the panel meets. You need interviews that establish *why* the meds were delayed. If the interview reveals "I didn't think she was in real pain," *then* you have a lever (Training/Protocol). Without that interview, the Protocol forces you to stay silent.

  ---

  ### Part 4: Where This Will Misfire (Limitations)

  1.  **The "Smoking Gun" Problem:** This procedure requires evidence. In Case 3, if the bias is real but unrecorded, the Protocol forces you to say "No causal finding." This protects you legally but fails the moral mission. *Mitigation:* You must empower the investigator to interview for *reasons*, not just *times*, before the panel meets.
  2.  **The 90-Minute Crunch:** Step 3 (Manipulation) often turns into a brainstorming session for solutions. You must ruthlessly cut this. If you can't name the lever in 5 minutes, it fails the test.
  3.  **Legal Nervousness:** Risk Management may balk at Template A ("directly contributed"). They prefer "associated with." *Compromise:* Agree that "contributed to" is the standard for internal quality improvement, but if a lawsuit is active, switch to Template B ("created conditions where... was more likely").
  4.  **Overdetermination:** If two errors happen (Delay A and Delay B), and either one alone would have killed the patient, Step 2 (But-For) fails logically (because without A, B still kills). *Fix:* Modify Step 2 to "NEST" (Necessary Element of a Sufficient Set). Ask: "Was this factor a necessary part of the set of conditions that caused death?" If yes, pass.

  ### Summary for the Panel
  When you introduce this, do not mention philosophy. Tell them:
  1.  **We stop blaming the calendar.** (Step 3)
  2.  **We stop guessing what would have happened if the patient were different.** (Step 2 constraints)
  3.  **We only recommend fixes we can actually build.** (Step 3)
  4.  **We admit when we don't have enough evidence.** (Template E)

  This shifts the culture from "Who/What killed the patient?" to "What lever do we own that changes the future?"
