  **Step 2: Direct Conflict.** Does granting the right breach measurable 2018 metrics (minimum flow, temperature limits, sediment load)? A sufficient answer requires certified hydrological data comparing current baselines against proposed extraction. If no conflict is demonstrated, approve immediately. If conflict exists, proceed to Step 3. This ensures factual compliance before legal weighing.

  **Step 3: Mitigation.** Can conditions be attached to satisfy both texts (e.g., reduced flow during drought, seasonal bans)? A sufficient answer requires a technical mitigation plan signed by a qualified hydrologist. If viable, approve with conditions. If not viable, proceed to Step 4. This exhausts administrative solutions before invoking hard legal conflicts.

  **Step 4: Ghost Provision Tie-Breaker.** For Ghost Provisions, apply the 'Functional Equivalence Test'. Is the proposed use functionally equivalent to the 1893 intent (e.g., modern turbine vs. historical mill wheel)? A sufficient answer must demonstrate energy output or utility parity. If yes, the 1893 text prevails, provided it does not cause irreversible ecological damage. If no modern equivalent exists, the 2018 Purpose Statement prevails, extinguishing the right. This prevents obsolete rights from blocking adaptation unless they serve resilience.

  **Step 5: Panel Flag.** If 'irreversible damage' is scientifically disputed or 'functional equivalence' relies on subjective economic weighting rather than technical utility, stop. Flag for Panel. This indicates a values clash, not a factual determination. Do not attempt to resolve ethical trade-offs alone.

  **Stop Conditions:** Clear approval at Step 2 or 3. Clear refusal at Step 4 (no equivalence). Panel referral at Step 5.
  **Logic:** Literalism wins on existing infrastructure unless metrics are breached. Purposivism wins on ghost rights unless functional utility is proven. The tie-breaker prevents historical curiosities from overriding climate resilience unless they serve a modern sustainable function. You must document the specific metric failure at Step 2 to justify any refusal. If the applicant argues 'historical precedent' over 'functional utility' at Step 4, you must flag it. Ensure all metric failures are logged for audit. Do not deviate from the order; skipping Step 3 invalidates the mitigation record. The procedure assumes hydrological data is accurate; if data quality is poor, flag for Panel immediately.

  3. Case A — geothermal boreholes claiming an old 'mill-race flow' right
  **Case A: Geothermal Boreholes.**
  The applicant claims a 1893 'mill-race flow' right to justify water extraction for geothermal heating. No mill exists on the site.
  **Step 1:** Fails physical existence. Classified as Ghost Provision. Move to Step 4.
  **Step 4:** Functional Equivalence Test. Is geothermal heating equivalent to milling? Milling implies mechanical power generation via water flow. Geothermal uses heat, not flow kinetics. There is no functional equivalence in utility or mechanism. The 1893 right was specific to kinetic water use for industry.
  **Decision:** Refusal. The 2018 Purpose Statement prevails.
  **The Unfavorable Answer:** You must deny the claim. Despite the green credentials of geothermal, the 1893 text protects flow *for milling*, not heat extraction. Without a mill, the right is a ghost. Without functional equivalence, the Climate Purpose extinguishes it. You cannot approve this without Panel instruction, as it sets a precedent that any green tech can hijack obsolete industrial rights. If you approve, you undermine the metric-based protection of river flows. The procedure forces a 'No' unless the Panel decides historical rights can be transmuted into modern green rights arbitrarily. This frustrates the applicant who believes 'green' should automatically win over 'Victorian', but the text requires functional parity, not just environmental benevolence. Record the refusal under Code G-4.

  4. Case B — blocking a literal irrigation diversion that the climate purpose clearly wants to stop
  **Case B: Irrigation Diversion.**
  A farmer holds a literal 1893 right to divert water for irrigation. The infrastructure exists. However, 2018 data shows this diversion dries out a protected wetland during summer.
  **Step 1:** Physical existence confirmed. Move to Step 2.
  **Step 2:** Direct Conflict. Hydrological data confirms flow drops below 2018 minimums during drought. Conflict established. Move to Step 3.
  **Step 3:** Mitigation. Farmer proposes winter-only diversion. Wetland requires summer flow. Mitigation fails. Move to Step 4.
  **Step 4:** Not a Ghost Provision. The right is real. However, the conflict is unresolved.
  **Decision:** Flag for Panel.
  **Reasoning:** This is not a ghost right; it is an active conflict between valid literal entitlement and ecosystem survival. The procedure cannot weigh the economic loss to the farmer against the ecological loss to the wetland. That is a values judgment. You cannot refuse solely on 2018 purposes without extinguishing a valid 1893 property right, which risks compensation claims. You cannot approve without breaching climate metrics. The procedure identifies this as a 'Step 5' scenario: irreconcilable valid claims requiring political, not administrative, resolution. Do not attempt to rule here; the risk of judicial review is too high if you prioritize one statute over the other without Panel authority.

  5. Where the procedure breaks
  The procedure fails when 'functional equivalence' becomes subjective. If an applicant argues their data centre cools using water just as a mill cooled using water, the test becomes semantic. It also misfires on cumulative impacts; individual ghost rights might pass the equivalence test, but collectively they breach 2018 metrics. The procedure treats cases in isolation, missing systemic risk. Furthermore, it cannot handle 'partial ghosts'—where a mill exists but is unused. Is it physical or ghost? The binary Step 1 forces a categorisation that might not fit hybrid cases. Finally, it cannot resolve the fundamental legitimacy clash. If the Panel consistently rules that 2018 Purpose overrides 1893 Text, the Act becomes dead letter. If Text wins, climate goals fail. The procedure manages the workflow, not the constitutional tension. It flags the values clash but offers no tool to solve it. You will still face judicial review if the Panel's values shift unpredictably.
