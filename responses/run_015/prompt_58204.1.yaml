answer: |-
  Here is the battle plan for your 25-minute session. It is designed to fit on one whiteboard, handle the specific conceptual hurdle you identified, and keep product/design folks engaged without drowning them in jargon.

  ### 1. The Case Study: Does "Maya" Work?
  **Verdict:** The Friday/Weekday split is **risky** for this specific lesson.
  **Why:** It introduces *changing contexts* (Work Mode vs. Relax Mode). If Maya acts differently on Fridays, the audience will assume her *goals* (Rewards) simply changed. That's intuitive and doesn't require IRL to explain. You want to show that **even with the exact same context and action**, the internal reason is ambiguous.

  **The Fix:** Collapse the timeline.
  **New Maya Case:** "Maya *always* takes the scenic back road instead of the highway, even when it's slower."
  *   **Observation:** Maya chooses Slow Route.
  *   **Explanation A (Reward):** She hates stress. She values calm over speed. (Goal = Relax).
  *   **Explanation B (Belief):** She loves speed, but she *believes* the highway is currently under construction. (Goal = Speed, Info = Wrong).
  *   **Why this works:** The action is identical. The internal driver is opposite. If you build a product assuming A, but B is true, you break the experience.

  ### 2. The Whiteboard Layout (Draw this first)
  Keep it to three distinct zones. Do not erase until the end.

  *   **Left Zone (The Data):** Draw a stick figure (Maya) and a fork in the road. Label the chosen path "Observed Action."
  *   **Center Zone (The Black Box):** Draw a box around Maya's head. Write: **"Reward (Goals) + Belief (World Model) = Action"**.
  *   **Right Zone (The Trap):** Draw two arrows pointing to the same Action.
      *   Arrow 1: "High Reward for Scenery"
      *   Arrow 2: "High Belief Highway is Blocked"
      *   **Big Red Text:** **"UNDERDETERMINED"** (Write this early, circle it).
  *   **Bottom Zone (The Patch):** Write: **"Assumption: Noisy-Optimal."** Draw a bell curve over the "Action" label.

  ### 3. The Flow & Timing (25 Minutes)

  **0:00 – 0:05: The Hook & The Trap**
  *   **Say:** "We watch users to learn what they want. If they click 'Buy', we think they want the product. IRL says: Not necessarily."
  *   **Head Off Misunderstanding #1:** *"More data fixes this."*
      *   **When:** Right now.
      *   **How:** "Even with a million data points of Maya taking the back road, we still can't tell if she loves scenery or hates traffic. Data records *what*, not *why*."

  **0:05 – 0:15: The Maya Case (Whiteboard Center)**
  *   **Walkthrough:** Use the "Static Maya" (Always takes back road).
  *   **Interactive:** Ask the room: "If I'm designing a navigation app for Maya, what do I show her?"
      *   If Reward (Scenery): Show her pretty views.
      *   If Belief (Highway Blocked): Show her traffic clearance updates.
  *   **The Pivot:** "These are opposite design decisions based on the exact same clickstream."
  *   **Head Off Misunderstanding #2:** *"IRL reads minds."*
      *   **When:** As they look confused about how to solve it.
      *   **How:** "We can't read minds. We have to make a mathematical assumption to unlock the box."

  **0:15 – 0:20: The Patch (Whiteboard Bottom)**
  *   **Concept:** "Noisy-Optimal."
  *   **Say:** "We assume humans try to get what they want (Optimal), but they make mistakes or have limits (Noisy)."
  *   **Crucial Distinction:** "Noisy does not mean 'Random'. It means 'Probabilistic'. If the highway is 10 mins faster, a rational human takes it 90% of the time, not 100%. That 10% slip is where we find the truth."
  *   **Head Off Misunderstanding #3:** *"Noisy means errors to be fixed."*
      *   **When:** Defining Noisy-Optimal.
      *   **How:** "Sometimes the 'noise' is the signal. If Maya takes the highway 50% of the time despite it being slower, she might be exploring, not erring."

  **0:20 – 0:23: Product Implications**
  *   **Say:** "Why do we care? Because if you optimize for Reward when the problem is Belief, you annoy the user."
  *   **Example:** "If a user ignores a feature:"
      *   Reward Problem: They don't want it. (Solution: Remove it).
      *   Belief Problem: They don't know it exists. (Solution: Onboarding tooltip).
      *   *Same behavior, opposite fix.*

  **0:23 – 0:25: The Check Question**
  *   **Do not ask:** "Does this make sense?" (They will lie).
  *   **Ask this:** "A user abandons their shopping cart at the shipping screen.
      *   **Scenario A:** They value money more than the item (Reward).
      *   **Scenario B:** They thought shipping was free (Belief).
      *   **Question:** If we assume it's Scenario A, we send a discount coupon. If we assume it's Scenario B, what do we do? And why is guessing wrong expensive?"
      *   **Expected Answer:** "We clarify the pricing earlier. Guessing wrong is expensive because sending a coupon to someone who thought shipping was free trains them to only buy on discount, hurting margin."

  ### 4. What to Deliberately Skip (And Say You Are)
  To keep this to 25 minutes, you must explicitly discard the technical machinery. Write **"SKIP LIST"** in the corner of the board.
  1.  **MDPs / State Spaces:** "We're skipping the grid-world math. Think 'Decision Points' instead."
  2.  **Bayesian Updates:** "We're skipping how the probability is calculated. Just know it weighs 'Likelihood' vs 'Prior'."
  3.  **Inverse vs. Reward Learning:** "We're skipping the distinction between learning the reward function vs. the policy. We just care about the 'Why'."

  **Say this verbatim:** "I am skipping the math of *how* we calculate the probability. In practice, you use a library for that. Your job is to know *what* question to ask the data."

  ### 5. Summary of Dependencies
  *   You cannot explain **Noisy-Optimal** until they accept **Underdetermination**. (If they think behavior = reward, they don't need the noise patch).
  *   You cannot explain **Product Implications** until they understand **Belief vs. Reward**. (Otherwise they think all UX problems are preference problems).
  *   You must draw the **Whiteboard** before you start talking, or talk while drawing. Do not talk *then* draw. Their eyes will glaze over.

  ### 6. Final Prep Checklist
  *   **Markers:** Bring black (structure), blue (Maya/Action), red (The Trap/Underdetermination).
  *   **Prop:** If you can, bring a physical map or printout of the "Maya Route" to pass around while you draw. It anchors the abstract.
  *   **Exit:** End on the Check Question. Let the silence hang for 5 seconds. If they answer correctly, you won. If not, you know they nodded along without getting it.
