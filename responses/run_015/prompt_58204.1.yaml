          *   *Problem:* Usually, IRL assumes a *static* reward function and *learning* beliefs. If Maya's reward changes (work mode vs. weekend mode), that's actually a context-dependent reward, which is valid but complicates the "Beliefs vs. Rewards" distinction.
          *   *Better Angle for Underdetermination:* We need a case where the *action* is the same, but the *reason* could be totally different. Or, where the action looks "suboptimal" but makes sense given beliefs.
          *   *Refinement:* The Maya case is okay, but it risks implying her *goals* change. To show underdetermination, we need to show that *one* behavior could stem from *two* totally different internal worlds (Reward + Belief).
