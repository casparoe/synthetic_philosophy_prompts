          *   *Okay, I will advise them to simplify.* The Friday/Weekday variable introduces "State." IRL handles state, but for a 20-min intro, it's a variable we don't need.
          *   *Recommendation:* Collapse it to one scenario. "Maya takes the long way." Why?

      *   *Wait, I need to follow the prompt's instruction:* "tell me if that case actually works... and if not what everyday case would be better."
