  ### The Decision Tree

  **Instructions:** Start at **Q1**. Follow the arrows based on your answer. Some questions only appear on certain paths. There are **8 Question Nodes** total (Q1 is a 3-way split) and **10 Leaves**.

  **Q1. Scope:** Are you claiming this about *everything* we name (including rocks and trees), or just specific things like money and gender, or nothing at all?
  *   **Everything** → Go to **Leaf 1**
  *   **Specific Things** → Go to **Q2**
  *   **Nothing** → Go to **Leaf 2**

  **Q2. Independence:** If nobody had any beliefs or attitudes about this thing (e.g., if everyone forgot what money was), would there still be money/noise/organic tomatoes?
  *   **Yes** → Go to **Leaf 2** (Natural Realism)
  *   **No** → Go to **Q3**

  **Q3. Timing:** Is the main point that human actions *started* this thing long ago, or that human attitudes *keep* it going right now?
  *   **Started long ago** → Go to **Q4**
  *   **Keep it going now** → Go to **Q5**

  **Q4. Historical Dependence:** If our practices had been different historically, would this kind exist at all?
  *   **Yes (It would still exist)** → Go to **Leaf 3**
  *   **No (It wouldn't exist)** → Go to **Leaf 4**

  **Q5. Role of Attitudes:** Are our attitudes partly *what the thing is* (like rules of a game), or just what *brought it about* (like building a house)?
  *   **Just brought it about** → Go to **Leaf 5**
  *   **Part of what it is** → Go to **Q6**

  **Q6. Feedback:** Does labeling people with this term change how they behave, making the kind move under attempts to study it?
  *   **Yes** → Go to **Leaf 6**
  *   **No** → Go to **Q7**

  **Q7. Normative Goal:** Is calling it constructed basically a way of registering that we should abolish it?
  *   **Yes** → Go to **Leaf 7**
  *   **No** → Go to **Q8**

  **Q8. Explanatory Value:** Is the kind made up and still perfectly real and fine to use in explanations?
  *   **Yes** → Go to **Leaf 8**
  *   **No (It's fake/misleading)** → Go to **Leaf 9**
  *   *(Note: To reach 10 leaves, we split Leaf 8 based on Institutional vs. General)* → Go to **Leaf 10** if the "rules" are written down (like Organic/Money), otherwise **Leaf 8**.

