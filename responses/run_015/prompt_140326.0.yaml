prompt: |-
  Hey, I'm in a third-year seminar on philosophy of the social sciences (it's half feminist metaphysics, half philosophy of economics, which is a weird combo but whatever) and a few of us keep arguing about whether the sentence X is socially constructed actually means anything. My friend Priya says every kind is constructed in one sense or another, so the claim is empty and we should stop saying it; I half agree with her and half think she's changing the subject. For our last study session before the final I want to turn this into a decision tree we can walk each other through: you start at I want to call this thing socially constructed and end up at a named position. Aim for seven or eight branch questions (they can be yes/no or two-option, but phrase them so someone can answer without already knowing which view it leads to) and eight to ten leaves.

  Constraints I actually care about:
  - No branch question is allowed to use the words constitutive, causal, status function, discursive, looping, or natural kind, because that just hands people the label and everyone in my group picks whichever one they've already heard of. Phrase each node as something you'd answer about a concrete case — like, if nobody had any beliefs or attitudes about money, would there still be money? — and keep the jargon for the leaf names and the notes underneath.
  - The cases I want used are money, a specific racial classification of your choosing (be specific about which one), gender, plus two of my own: 'organic' in the legal/statutory sense (a tomato I grew with zero pesticides still apparently doesn't get to be organic, because the kind is fixed by a certification regime) and noise, i.e. unwanted sound, same waveform, different kind depending on whether anyone minds. Every leaf should say what it predicts about at least three of those five.
  - Leaves I definitely want in there: the distinction where construction is a claim about what brought the kind about and keeps it going versus the one where our attitudes are partly what the kind is; a leaf for the bare counterfactual version (had our practices been different, there wouldn't be such a kind at all); one for the case where classification feeds back on the people classified so the kind moves under attempts to study it; one where calling something constructed is basically a way of registering that we should abolish it; one where the kind is made up and still perfectly real and fine to use in explanations; and Priya's leaf, where the claim collapses into triviality. Also tell me which combinations of answers are empty and diagnose each one: incoherent, unattractive, or just unoccupied because nobody has bothered.
  - Build it questions-first: give me the questions, note which combinations of answers they allow, then slot the actual positions into that space. Don't start from a list of names and reverse-engineer the questions.
  - Flag any pair of leaves your tree genuinely can't separate. My suspicion is that constitutive-construction-plus-it-isn't-a-real-kind-so-we-should-drop-it reads as crazy for money and completely normal for race, and I can't tell whether that's a difference in the kinds themselves or just in how much people want to get rid of them. If the tree can't decide, say so rather than papering over it.

  For reference, the rough four-way split I have on my whiteboard is: (1) caused by us, (2) made partly out of our attitudes, (3) we'd have had a different kind under different practices, (4) it's constructed and that's a reason to get rid of it. I think (1) and (3) might secretly be the same thing and that (2) and (4) are independent axes rather than leaves — fix that if it's wrong. Also, please don't give me a reading list or any citations; we'll be doing this in a study room with awful wifi and I want the nodes in plain language anyway.

  Wherever a leaf doesn't have a real defender that you can actually name, write nobody holds this, and give the one-line reason, and mark how confident you are in each assignment — I'd much rather have an honest empty cell than a confident-sounding name for something nobody believes. And if my framing is confused — if two of my four distinctions are really one, or if noise or the organic tomato is doing something totally different from the other three cases and is messing up my tree — say that plainly at the top instead of politely building the thing I asked for.
