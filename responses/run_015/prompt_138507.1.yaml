  This is a sophisticated problem because your supervisor is clearly reading Gongsun Long not as a sophist playing word games, but as a metaphysical realist about *names* (ming) and *actualities* (shi), heavily influenced by the *Jianbai Lun* (Hard-White Stone).

  Here is the breakdown of the machinery, the prediction for the White Kingdom, and the evaluation of your probes.

  ### 1. The Machinery: Which Rule Fits the Track Record?

  You identified three potential rules. Let's test them against her specific vetoes and acceptances.

  *   **Rule A (Intensional/Compound):** "White Horse" is a compound concept (Color + Shape). "Horse" is a simple concept (Shape). A compound name designates a compound actuality, which is never identical to a simple actuality.
      *   *Fits:* "White horse is not a horse," "Brown horse is not a horse," "Horse is not a white horse."
      *   *Fits:* "Hard-White Stone" link (attributes are separate entities regardless of co-occurrence).
      *   *Fits:* "Horse is not a horse" veto (Simple = Simple; no compound distinction to drive the "not").
      *   *Fits:* Pointing at a white horse (The *object* exists, but the *name* "White Horse" is not the *name* "Horse").
  *   **Rule B (Extensional/Seeking):** "White Horse" $\neq$ "Horse" because the set of satisfiers can differ (the "seeking test").
      *   *Fits:* The standard cases where brown horses exist.
      *   *Strains:* The White Kingdom case (sets are identical).
      *   *Strains:* "Horse is not a horse" veto (Extensions are identical, so "not" should fail, which she agrees with, but this rule makes the "not" contingent on the world, whereas she treats it as a logical thesis).
  *   **Rule C (Class Identity):** "White Horse" $\neq$ "Horse" because they are distinct classes.
      *   *Fits:* Standard cases.
      *   *Fails:* White Kingdom (Classes are identical).
      *   *Fails:* "Horse is not a horse" veto.

  **Verdict on Machinery:** She is almost certainly running **Rule A (Intensional/Compound)**.
  **Why?** The clincher is the *Jianbai Lun* connection. In *Hard-White Stone*, Gongsun Long argues that "Hard" and "White" are separate universals (*zhi*) that do not depend on the stone (*shi*) to exist conceptually. Your supervisor insists this is the *same point* as the horse case. This means she views "White" and "Horse" as separable metaphysical attributes. Whether they happen to co-occur in the physical world (the White Kingdom) is irrelevant to the separation of the *names* and the *attributes* they designate.

  ### 2. The White Kingdom Verdict

  **Prediction:** She will say **"A white horse is not a horse" still holds.**

  **Reasoning:** Since she is operating on Rule A (Intensional), the contingency of the breeding stock does not change the semantics of the names. "Horse" designates shape. "White Horse" designates shape + color. Even if every horse in the universe is white, the *concept* of "Horse" does not include color, while "White Horse" does. The "not" marks a distinction in *designata* (what is designated), not just a distinction in *extensions* (what exists).

  If you walk in assuming the "not" collapses because the extensions match, you will look like you are treating Gongsun Long as a mere extensional logician (like a Mohist), which she explicitly rejects by linking it to *Jianbai*.

  ### 3. Evaluating Your Probes

  You want a case that forces her to reveal whether she is Rule A (Intensional) or Rule B (Extensional/Modal).

  #### Probe (i): Necessary Whiteness (Horses are *necessarily* white)
  *   **The Setup:** No brown horses are possible in any world.
  *   **Rule A (Intensional):** "White Horse is not a Horse" **holds.** The meaning of the terms differs regardless of modal status. "White" is still an added attribute conceptually.
  *   **Rule B (Extensional/Seeking):** "White Horse is not a Horse" **collapses.** If no non-white horses are possible, the "seeking test" can never distinguish them. There is no possible world where you seek a horse and get a non-white one.
  *   **Separation Power:** **High.** This cleanly separates Intensionalism from Extensionalism.
  *   **Risk:** Low. It stays within the logic of attributes.
  *   **Verdict:** **Use this.** It is the strongest probe.

  #### Probe (ii): Upward Generalization (Is a horse not an animal?)
  *   **The Setup:** Genus/Species relation.
  *   **Rule A (Intensional):** "Horse is not an Animal." (Shape vs. Life/Motion).
  *   **Rule B (Extensional):** "Horse is not an Animal." (Seek an animal -> get a cow. Seek a horse -> cow fails).
  *   **Separation Power:** **None.** Both rules yield the same verdict ("Not"). It confirms the pattern but doesn't distinguish the *mechanism*.
  *   **Risk:** **High.** Gongsun Long's *Baima Lun* is about Modifier + Head (White + Horse), not Genus + Species (Animal + Horse). In Chinese logic (and Mohist Canon), these are often treated as distinct logical forms. She might dismiss this as "That's a different category of name," which stalls your inquiry without revealing the machinery behind the *Baima* thesis.
  *   **Verdict:** **Discard.** It doesn't separate the rules you are trying to distinguish.

  ### 4. The One Further Case (The "Stipulation" Probe)

  While Probe (i) is excellent, there is one case that might be even sharper at flushing out whether she is a **Semantic Realist** (Names track metaphysical attributes) or a **Linguistic Conventionalist** (Names track usage).

  **The Case:** *The Stipulative Definition.*
  "Suppose that for the purpose of this seminar, we stipulate that the word 'Horse' shall mean 'White Horse'. We agree on this definition. Given that agreement, is a white horse a horse?"

  *   **If she is Rule A (Metaphysical Intensionalist):** She will say **"No."** You have changed the *sound* of the name, but you haven't changed the *zhi* (attribute) that the original name "Horse" designates. You are misusing the name. The logic binds the name to the attribute, not to our temporary agreement.
  *   **If she is Rule B (Extensional/Pragmatic):** She will say **"Yes."** If we agree the extensions are identical by definition, the "seeking test" is satisfied. The "not" was only ever about distinguishing requests.

  **Why this is better than (i):** Probe (i) tests *Modal* reality. The Stipulation case tests *Linguistic* authority. Given her reliance on *Jianbai* (which treats "Hard" and "White" as objective universals independent of human perception), I bet she will say **"No, you are rectifying the name incorrectly."** This confirms she views the "not" as metaphysical, not just linguistic or extensional.

  ### Summary Strategy for the Seminar

  1.  **Assume the Verdict:** In the White Kingdom, she will maintain that "A white horse is not a horse." Do not argue that the "not" collapses due to identical extensions.
  2.  **Deploy Probe (i):** Ask her about the **Necessary Whiteness** case.
      *   *Script:* "If whiteness were essential to horseness, such that no non-white horse were even possible, does the 'not' still hold? Or does the 'seeking' test require the *possibility* of a brown horse to function?"
      *   *Goal:* If she says "It holds," she is a pure Intensionalist (Rule A). If she hesitates, she relies on Modal Extensionalism (Rule B).
  3.  **Avoid Probe (ii):** Do not bring up "Horse vs. Animal." It invites a taxonomic sidestep.
  4.  **Backup Probe:** If she dismisses (i) as "counter-possible," use the **Stipulative Definition** case to test if the logic is about *words* or *attributes*.

  **My Bet:** She is a Rule A Intensionalist. She believes "White" and "Horse" are distinct universals. The White Kingdom is just a world where those universals always co-occur, but they remain distinct *zhi*. The "not" survives.
