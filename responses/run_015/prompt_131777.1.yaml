      *   *The "Feel":* The prompt asks for the moment where quitting feels like a betrayal of prior moves. The profile system needs to enforce this. If I am an "Identity-Consistent" player, stopping early makes me inconsistent with my previous aggressive bids. If I am a "Rule-Follower," I set a limit, but exceeding it feels like breaking a vow.

