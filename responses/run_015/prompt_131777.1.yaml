answer: |-
  # Workshop Activity: The Rationality Trap

  ## 1. Rules, Materials, and Room Setup

  **Room Setup:**
  *   Arrange 7 tables in a circle or semi-circle so all pairs can see each other.
  *   Each table must have: Two chairs facing each other, one "Game Master" score sheet, a stack of 20 small index cards (different colors for each profile type if possible, otherwise plain), two pens, and a pair of scissors.
  *   **The Ledger:** A whiteboard visible to all titled "The Rationality Ledger." It lists the 7 Pairs (Pair 1–7) with columns for "Current Bid," "Profile," and "Net Score." This is updated publicly after every round.

  **Materials:**
  *   **Profile Cards:** 21 cards total (7 of each type).
      *   *Type I: Instrumentalist.* Text: "Justify moves solely by expected point yield. Maximize (Prize - Cost)."
      *   *Type II: Identity-Consistent.* Text: "Justify moves solely by coherence with prior public commitments made in this game. Do not contradict your previous stance."
      *   *Type III: Rule-Follower.* Text: "Justify moves solely by adherence to a self-announced stopping threshold. You must state this threshold aloud in Round 1."
  *   **Justification Cards:** Plain index cards for writing the one-sentence rationale.
  *   **Scissors:** For the profile-switching ritual.

  **Core Mechanics:**
  1.  **The Prize:** 10 Points.
  2.  **The Bidding:** Pairs bid against each other. Minimum bid is 1. Increments must be exactly 1 point.
  3.  **The Payoff:**
      *   **Winner:** Receives 10 points minus their final bid.
      *   **Loser (Second-Highest):** Pays their final bid (deducted from score) and receives 0.
      *   **Withdrawal:** If both withdraw in the same round, both pay their last bid.
  4.  **The Constraint:** Every bid must be accompanied by a written justification on an index card, placed face-up on the table. The justification *must* match the logic of the player's current Profile.
      *   *Example (Instrumentalist):* "Bidding 6 minimizes my loss compared to stopping at 5."
      *   *Example (Identity):* "Having bid 5, withdrawing now contradicts my established posture of strength."
      *   *Example (Rule):* "My threshold was 7; this bid is within limit."
  5.  **The Switch:** A player may switch profiles at any time.
      *   **Cost:** 3 Points (deducted immediately).
      *   **Ritual:** The player must physically tear up their current Justification Card in front of their partner and the room.
      *   **Reset:** They draw a new Profile Card and begin a fresh Justification Card.
  6.  **Termination:** The game ends when both players in a pair withdraw, or after Round 12.

  ## 2. Point/Payoff Scheme and Emotional Stakes

  **The Endowment:**
  Every student begins with a baseline of **20 Course Points**. These points contribute directly to their final seminar grade (e.g., 5% of the total grade).

  **The Stakes:**
  *   **Game Net Score:** Added to or subtracted from the baseline 20.
  *   **The "Rationality Penalty":** The 3 pairs with the *lowest* final scores at the end of the workshop must submit an additional 500-word reflection paper on "Failure Modes in Practical Reason" due the following week.
  *   **The "Rationality Bonus":** The 3 pairs with the *highest* final scores are exempt from one mandatory reading response later in the term.

  **Why This Stings:**
  *   **Loss Aversion:** Students start with 20. Losing 10 points in the auction feels like losing half their endowment.
  *   **Public Humiliation:** The Ledger is public. Being the pair that bid 11 for a 10-point prize is recorded on the whiteboard for the duration of the seminar.
  *   **The Switch Cost:** Losing 3 points to switch profiles is a visible admission that their previous reasoning framework was insufficient. Tearing the card is a performative admission of error.

  ## 3. Timeline (90 Minutes Total)

  **0:00 – 0:10: Setup and Deal (10 mins)**
  *   Distribute Profile Cards face down. Students do not look until instructed.
  *   Explain the Payoff Scheme (Bonus/Penalty papers).
  *   Explain the Bidding and Justification rules. Emphasize: *If the justification does not match the profile logic, the bid is void.*
  *   **Round 0 (Commitment):** Rule-Followers must announce their threshold aloud to the room. Instrumentalists and Identity players must write an "Opening Stance" card (e.g., "I intend to win" or "I will bid to value").

  **0:10 – 0:40: The Auction (30 mins)**
  *   Facilitator calls "Round 1," "Round 2," etc.
  *   Pairs write bids and justifications simultaneously.
  *   Facilitator updates The Ledger after every round.
  *   Facilitator watches for profile violations and enforces the "Tear" ritual if a switch occurs.
  *   Stop exactly at 30 minutes, even if bids are active. Active bids are settled as losses for both.

  **0:40 – 1:30: The Debrief (50 mins)**
  *   See Section 4 for detailed mapping.

  ## 4. Debrief Map: Connecting Mechanics to Philosophy

  Do not lecture. Use the specific moments from the game to draw out the theory.

  **Phase 1: The Instrumental Breakpoint (15 mins)**
  *   **Target Moment:** The first bid that exceeds 5 points (half the prize value).
  *   **Ask:** "Look at Pair 3. At bid 6, your net gain is negative if you win. Instrumentalist, read your justification card."
  *   **Discussion:** How did you justify a negative expected value? (Answer: "Minimizing loss relative to the sunk cost of the opponent's bid.")
  *   **Philosophical Link:** Connect this to the **Sunk Cost Fallacy**. The rational calculation shifts from "What will I gain?" to "How much pain can I avoid?" The math remains instrumental, but the baseline has shifted from *profit* to *damage control*.
  *   **Key Question:** "At what exact number did 'winning' stop meaning 'getting the prize' and start meaning 'not letting them beat me'?"

  **Phase 2: The Identity Trap (20 mins)**
  *   **Target Moment:** The round where a partner's glare or silence replaces calculation.
  *   **Ask:** "Pair 5, Round 8. You didn't switch profiles, but your justification changed from math to 'consistency.' Read that card."
  *   **Discussion:** Why was tearing the card (switching profiles) harder than losing 4 more points?
  *   **Philosophical Link:** **Diachronic Rationality vs. Static Rationality.** A static rational agent cuts losses. A diachronic agent (one existing through time) values narrative coherence. Quitting feels like a betrayal of the "self" that placed the first bid.
  *   **Key Question:** "Is it irrational to protect your identity as a 'competitor' even at a point cost? Or is that identity part of your utility function?"

  **Phase 3: The Cost of Correction (15 mins)**
  *   **Target Moment:** The moment a player considered tearing their card but bid instead.
  *   **Ask:** "Who wanted to switch profiles but didn't? Why?"
  *   **Discussion:** The 3-point cost was arithmetic. The *tearing* was social.
  *   **Philosophical Link:** **Expressive Action.** We often choose actions not for their outcome, but for what they express about us. Bidding 9 points expresses "I am stubborn." Switching profiles expresses "I was wrong." In a graduate seminar, being wrong is costlier than losing points.
  *   **Key Question:** "If the rules didn't require public justification, would you have quit sooner? Does the requirement to *give reasons* actually make us less rational?"

  ## 5. Prediction of Failure and Facilitation Corrections

  **Predicted Failure 1: Collusion (The "Soft" Game)**
  *   **Risk:** Pairs agree verbally to bid 1 and stop, splitting the bonus.
  *   **Correction:** **The Silence Rule.** No verbal communication is allowed between partners after Round 0. All communication must be via the Justification Cards. If a pair is suspected of collusion (e.g., both bid 1 and withdraw), the Facilitator invokes the "Market Correction": Both players are automatically assigned a loss of 5 points for "Failure to Engage."

  **Predicted Failure 2: Profile Arbitrariness**
  *   **Risk:** Students treat the profiles as a joke, writing nonsense justifications.
  *   **Correction:** **The Veto Power.** The Facilitator acts as the "Rationality Auditor." If a justification does not logically follow the profile constraints (e.g., an Instrumentalist writes "I feel like it"), the bid is rejected. The player must forfeit the turn (pass) or switch profiles (pay 3 points). This forces them to take the cognitive constraint seriously.

  **Predicted Failure 3: Early Exit due to Embarrassment**
  *   **Risk:** A pair quits at Bid 2 because they realize the trap immediately.
  *   **Correction:** **The Second-Highest Penalty.** Remind them loudly at Round 3: "Remember, the loser pays their bid." If one bids 3 and the other quits at 2, the quitter loses 2 points for nothing. This forces the "defensive bid." If they still quit early, use them in the debrief as the "Control Group" who avoided the trap but gained no data.

  ## 6. Limitations and Verbal Supplementation

  **The Limitation:**
  This activity cannot reproduce **genuine financial ruin**. Losing 10 course points is annoying; losing your life savings is traumatic. Additionally, the profiles are **assigned**, whereas in the real world, agents **adopt** their reasoning frames unconsciously. In the game, you know you are an "Instrumentalist." In reality, you *think* you are an Instrumentalist while acting on Identity.

  **Verbal Supplementation (To be delivered in the final 5 minutes):**
  "Do not leave thinking this was just a game about points. The profile you drew represents the story you tell yourself. In the real world, you are not dealt a card. You *choose* the card in the moment to protect yourself from the pain of the loss.

  When you kept bidding, you weren't just losing points. You were protecting the narrative that you are the kind of person who finishes what they start. The 3-point cost to switch profiles was small, but the *admission* that your previous reasoning was flawed was too high.

  In your professional lives, you will face projects, relationships, and arguments where the 'bid' is already higher than the 'prize.' You will not have a Facilitator telling you to switch profiles. You will have to notice when your justification shifts from 'This is good' to 'I have already spent so much.' That shift is the only signal you will get. The sting you feel right now about your score? That is the feeling of rationality colliding with identity. Remember it."
