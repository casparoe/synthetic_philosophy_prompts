  ### Adversarial Collaboration Design Notes (Brainstorming)

  **Objective:** Construct a joint statement that prevents talk-past-each-other dynamics between Universalists (UG-style cognitive architecture) and Contextualists (cultural plasticity/scaffolding).

  **Key Design Challenges:**
  1.  **Defining "Intuition":** We need a working definition that doesn't presuppose origin. *Solution:* Define as "pre-reflective judgment elicited by a case," leaving the source open.
  2.  **Performance Error:** Both sides agree errors exist, but disagree on what counts as one. *Solution:* Agree on procedural filters (attention checks, consistency) without agreeing on the *source* of the error (noise vs. cultural mismatch).
  3.  **The Reflective Equilibrium (RE) Crux:** This is the niche framing. Universalists see RE as the cleanup process to find the universal signal. Contextualists see RE as a Western cultural practice of systematizing that might distort local intuitions.
  4.  **Non-Verbal Crux:** Crucial for avoiding the "translation is impossible" deadlock. We need behavioral measures (e.g., resource allocation, reaction time) rather than Likert scales.

  **Tone Check:** Ensure Universalists don't sound like they deny culture exists, and Contextualists don't sound like they deny shared biology. Both are compatible with evolutionary psychology; the dispute is over *degree of plasticity* in metaphysical domains.

  ***

  # JOINT STATEMENT ON CROSS-CULTURAL PHILOSOPHICAL INTUITIONS
  **Prepared by the Ad Hoc Working Group on Intuition Variance**
  **Date:** October 2023

  ## 1. Agreed Claims
  *The following methodological and factual points are accepted by both the Universalist and Contextualist camps as a baseline for future collaboration.*

  1.  **WEIRD Sampling Bias:** Both sides agree that current data relies disproportionately on Western, Educated, Industrialized, Rich, and Democratic (WEIRD) populations. This limits the generalizability of any claim regarding "human" intuition, regardless of whether the underlying mechanism is universal or variable.
  2.  **Working Definition of Intuition:** For the purposes of this collaboration, an "intuition" is defined as a pre-reflective judgment or assent regarding a specific case or scenario, occurring prior to explicit theoretical justification. This definition remains neutral on whether the source is innate or acquired.
  3.  **Performance vs. Competence:** Both sides acknowledge the distinction between *competence* (the underlying cognitive capacity or disposition) and *performance* (the output given specific constraints). Both agree that distraction, fatigue, confusing wording, and lack of engagement constitute performance errors that should be filtered out via standard methodological controls (e.g., attention checks, consistency trials).
  4.  **Translation Validity:** Both sides agree that simple literal translation is insufficient. Back-translation and native-speaker conceptual validation are required for all survey instruments. Disagreements arising from known translation ambiguities are excluded from core theoretical analysis.
  5.  **Limits of Survey Methods:** Both sides acknowledge that explicit survey responses (e.g., Likert scales) capture only reported intuition, which may diverge from implicit judgment due to social desirability bias or differing norms of assertion. Triangulation with behavioral measures is recognized as necessary.
  6.  **Normative Neutrality:** This collaboration focuses on the *descriptive* question of whether intuitions vary. Neither side is required to concede the *normative* question of whether varying intuitions undermine philosophical methodology, though both agree that descriptive accuracy is a prerequisite for normative evaluation.

  ## 2. Disagreements Table
  *The following table isolates substantive divergences. Wording has been negotiated to ensure each side recognizes its own position without caricature.*

  | Issue | Universalist Position | Contextualist Position |
  | :--- | :--- | :--- |
  | **Source of Variance** | Observed cross-cultural variance is primarily due to performance errors, framing artifacts, or superficial differences in applying a shared underlying cognitive architecture. | Observed cross-cultural variance is primarily due to deep differences in conceptual frameworks, linguistic structures, and culturally scaffolded cognitive development. |
  | **The "Default" State** | There exists a core set of metaphysical intuitions (e.g., regarding causation or agency) that emerges as the default in the absence of specific cultural training or philosophical reflection. | There is no "culture-free" default state; all intuition elicitation occurs within a cultural context, and what appears as a "default" is often the dominant local framework mistaken for universal. |
  | **Normative Weight** | Stable intuitions (those surviving cross-cultural scrutiny) carry greater evidential weight for philosophical theory-building than variable intuitions. | Variable intuitions reveal the range of coherent human conceptual possibilities; stability may merely indicate shared historical lineage rather than philosophical truth. |
  | **Terminology vs. Substance** | Many apparent disagreements are verbal disputes caused by mapping different languages onto a shared conceptual space. | Many apparent agreements are verbal disputes caused by mapping different conceptual spaces onto shared language (e.g., "free will" meaning different things). |

  ## 3. Cruxes
  *The following three sub-questions represent the specific empirical and theoretical pivot points. Settling these would significantly shift the burden of proof for one or both sides.*

  ### Crux 1: Linguistic Framing vs. Narrative Invariance
  **The Question:** Does holding the narrative structure and causal logic of a thought experiment constant eliminate intuition variance across language families, or do linguistic categories (e.g., tense, agency marking) systematically shift judgments even when the story logic is identical?
  **The Reflective Equilibrium Frame:** Is the stability of intuition found *before* reflection (raw response) or only *after* subjects engage in a process of balancing specific cases with general principles?

  *   **Proposed Study:** A multi-site replication of classic metaphysical cases (e.g., Gödel-style reference, Twin Earth, or Moral Luck) using **narrative normalization**. Instead of translating questions, teams will co-create video stimuli or non-linguistic animations depicting the scenarios, with voiceovers tailored to preserve grammatical agency structures where possible, followed by both raw judgment and a guided reflection period.
  *   **Universalist Prediction:** Once narrative structure and attention controls are standardized, raw intuition rates will converge significantly across cultures. Any remaining variance will disappear after subjects engage in a brief reflective equilibrium process (checking consistency).
  *   **Contextualist Prediction:** Even with narrative normalization, variance will persist due to deep grammatical or conceptual differences (e.g., how "cause" is encoded). Furthermore, the "reflective equilibrium" process itself will yield different endpoints because the *criteria* for coherence are culturally variable.

  ### Crux 2: The Status of Reflective Equilibrium (Global Method vs. Local Practice)
  **The Question:** Is the method of "reflective equilibrium" (adjusting intuitions to fit principles and vice versa) a universal feature of human rationality, or is it a culturally specific practice rooted in Western philosophical training?
  **The Niche Framing:** We treat 'reflective equilibrium' not as a goal, but as an *elicitation technique*. Does prompting subjects to reconcile contradictions change their intuitions in the same way across cultures?

  *   **Proposed Study:** A comparative study of "naive" participants (no formal philosophy training) from individualist vs. collectivist societies. Participants are presented with contradictory intuition pumps. Half are asked only for their judgment; half are asked to resolve the contradiction before giving a final judgment.
  *   **Universalist Prediction:** The *direction* of adjustment during reflection will be universal. When faced with contradiction, all humans move toward greater consistency using similar logical constraints, suggesting a global rational competence.
  *   **Contextualist Prediction:** The *value* placed on consistency is culturally variable. Some populations may prioritize contextual appropriateness over logical consistency. Therefore, the "equilibrium" reached will differ, or the process itself will be rejected as unnatural in populations where dialectical contradiction is tolerated.

  ### Crux 3: Silent, Non-Verbal Intuitive Judgments
  **The Question:** Can we detect metaphysical intuitions (e.g., about identity or responsibility) in populations where explicit philosophical discourse is not normative, using only behavioral measures?
  **The Constraint:** This crux addresses the "silent intuition" problem. If intuitions are universal, they should manifest in expectation-violation tasks (e.g., looking time, reaction time, resource allocation) even without verbal report.

  *   **Proposed Study:** An implicit measure study in a small-scale society with no tradition of abstract metaphysical debate. Using resource allocation games or surprise-response measures (e.g., eye-tracking or reaction time) to scenarios involving personal identity transfer or causal intervention.
  *   **Universalist Prediction:** Behavioral markers of surprise or violation of expectation will match those of WEIRD samples. For example, if WEIRD subjects show slower reaction times when identity conditions are violated, small-scale society subjects will show the same pattern, indicating a shared implicit metaphysics.
  *   **Contextualist Prediction:** Behavioral markers will diverge. For example, if a scenario violates "individual identity" but preserves "social role," WEIRD subjects may show surprise while small-scale society subjects do not. This would prove that even pre-verbal or implicit processing is shaped by cultural frameworks.

  ## 4. Commitment to Data Sharing
  Both camps agree that all raw data, code, and materials from the studies outlined above will be made publicly available prior to interpretation. Interpretation of the results will be conducted in a joint workshop where both sides have equal veto power over the characterization of the data, though not over the conclusions drawn from it.
