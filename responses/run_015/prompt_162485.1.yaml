answer: |-
  Two groups sit at identical tables facing a monitor displaying a faint, stationary Gabor patch that is physically vertical but near contrast threshold. Group A is told by the experimenter that the patch is tilted 5 degrees clockwise; Group B is told it is 5 degrees counter-clockwise. Both maintain fixation monitored by a simple camera to rule out eye movements. After 30 seconds of exposure, they are presented with a clearly vertical test patch and adjust a dial to null its experienced tilt (a non-verbal motor match). Halfway through the session, the experimenter returns and confesses the initial tip-off was a random guess, instructing them to ignore it while continuing the task. The critical data is the shift in the nulling point during the belief phase versus the retraction phase, correlated with their rated confidence in the tip-off rather than total exposure time.

  **Verdicts**

  *   **Pro-Penetration:** The effect tracks confidence instantly upon retraction, not exposure duration. Since low-level perceptual learning requires repeated exposure and unlearnes slowly, the immediate shift indicates the high-level belief directly modulated the sensory gain control mechanisms responsible for the aftereffect. The representation itself was altered.
  *   **Encapsulation/Modularity:** The effect tracks confidence because the *decision criterion* for the motor adjustment shifted, not the sensory representation. The adaptation occurred, but the read-out mechanism—the stage where sensory data is translated into a dial position—is where the belief exerted influence. The early visual module remained encapsulated; only the downstream decision process was permeable.
  *   **Predictive-Processing Bayesian:** Both previous verdicts rely on a false dichotomy between "belief" and "perception." There is only hierarchical inference. The testimony established a strong prior that weighted the ambiguous sensory likelihood. The "aftereffect" is simply the posterior mean shifting to minimize prediction error. Asking if the prior penetrated the likelihood is a category error; the system is unified.

  **The Single Joint**

  The feature doing the work is the **dissociation between exposure duration and doxastic confidence**. I chose this because perceptual learning is a function of time and repetition, whereas belief is a function of credibility. If the magnitude of the tilt nulling shifts immediately when confidence drops (despite constant exposure), learning is ruled out. If you remove the retraction test and measure only the final nulling point, the case collapses into a stalemate: the modularist claims accumulated learning, the penetrationist claims accumulated belief influence. The retraction forces a temporal distinction between the two mechanisms.

  **Steelman and Reply**

  The strongest non-ad hoc objection from the modularist is that the **motor nulling task inherently conflates sensation with criterion**. Even if the shift is instant, it proves only that the *mapping* from sensation to action is penetrable, not that the sensation itself changed. The subject might experience the test patch identically in both conditions but adjust the dial differently because they believe they *should* compensate for the reported tilt.

  The penetrationist replies by adding a **transfer task**: after the nulling, subjects perform a forced-choice discrimination (Patch X vs. Patch Y) requiring no motor calibration based on the original belief. If the bias persists in a task where the belief offers no strategic advantage for criterion setting, the criterion-shift explanation fails.

  **Honest Assessment**

  This case does not settle the question; it relocates it one step back. The debate shifts from "Does belief change experience?" to "Is the locus of this bias early sensory coding or late decision criterion?" The modularist can always retreat further down the processing chain, claiming any measured effect occurs just *after* the encapsulated module ends. Without a definitive map of where "perception" ends and "cognition" begins in the brain—which we lack—the data remains underdetermined by the theory. The experiment isolates the variable, but not the ontology.
