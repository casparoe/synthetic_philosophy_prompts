      *   **Positions:**
          *   Side A: Psychiatric categories pick out real, stable natural kinds (genetics, circuits, etc.), independent of classification. DSM politics don't negate reality.
          *   Side B: Human kinds are interactive (Hacking). Classification changes the classified. Categories are moving targets, not discoveries like elements.
      *   **Deliverable Structure:**
          1.  Numbered section of Agreed Claims (non-vacuous, concessions made).
