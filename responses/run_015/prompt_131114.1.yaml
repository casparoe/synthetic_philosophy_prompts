  8.  **Refining the ML Analogy (Requirement 1):**

      *   This needs careful handling. Side A says ML loops are *causal* feedback, not *semantic* feedback. Side B says the mechanism doesn't matter, the structural dynamic (classifier changes target) is the definition.
      *   *Compromise:* Call ML loops "Causal Feedback Loops" and Hackingian loops "Semantic-Interactive Loops." Agree they share mathematical structure but differ in mechanism (optimization vs. meaning).

  9.  **Refining the PNCD Case (Requirement 2):**

