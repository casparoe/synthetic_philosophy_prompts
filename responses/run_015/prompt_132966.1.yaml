answer: |-
  Here is a 25-minute battle plan. It is designed to be tight, so stick to the timing.

  ### 1. The Arc & Timing (25 Minutes Total)

  *   **0:00–3:00: Validate, Don't Invalidate.** Start by writing the rule they know on the board (*"Same species = can make fertile babies"*). Tell them this is the **Biological Species Concept (BSC)** and it is the gold standard for vertebrates. Do **not** tell them yet that biologists disagree. If you say "science is confused" now, they will tune out waiting for the punchline. Make them trust the rule first so they feel the break later.
  *   **3:00–13:00: The Anchor Case (The Beetles).** Spend half your time here. This is the only example you need to deep-dive.
  *   **13:00–18:00: The "Fix" & The Friend (DNA + Birds/Lizards).** Use the other cases to show why the "Fix" also fails.
  *   **18:00–22:00: The Reframe (Tools vs. Truth).** Address the "Science is fake" risk here.
  *   **22:00–25:00: The Final Question.**

  ### 2. The Single Anchor Example: The Beetles (Ring Species)
  **Why this one?**
  The Lizards (asexual) are too easy—they just break the rule immediately ("Oh, well the rule doesn't work then, next."). The Birds are confusing because they *do* interbreed, which supports the rule but conflicts with their eyes.
  The **Beetles** are the winner because they force the students to use the *logic* of the rule they just learned and show that the logic eats itself.
  *   North + Middle = Fertile.
  *   Middle + South = Fertile.
  *   North + South = Sterile/No go.
  *   **The Trap:** If North is same species as Middle, and Middle is same species as South... how is North *not* the same species as South? It breaks the math of the definition.

  **How to run it:**
  Draw the three islands on the whiteboard. Ask them to apply the rule they memorized. Let them argue. When they get stuck (and they will), *then* you reveal: "Biologists have been fighting about this specific beetle scenario for 80 years."

  ### 3. Ordering the Remaining Cases
  You don't have time to treat all five equally. Use them as supporting evidence for the "Definitions are Tools" argument.

  1.  **First:** **The Beetles.** (The Logic Breaker).
  2.  **Second:** **The Lizards.** (The Rule Killer). Briefly mention: "Okay, maybe we just change the rule? Well, these lizards clone themselves. No babies at all. The rule you memorized literally cannot be applied."
  3.  **Third:** **The DNA Cutoff.** (The Friend's Idea). This is where you bring in your friend's argument. "My friend says just sequence the DNA. 3% difference = different species."
      *   *Show the conflict:* Point out that in your dataset, the DNA rule says the **Birds** (who look different) are the *same* species, but the **Beetles** (who look similar) are *four* species.
      *   *The Point:* DNA doesn't solve the problem; it just gives you a *different* ruler with different problems.
  4.  **Last:** **The Fossils.** (The Time Problem). End with this. It's the strongest closer. "Imagine these shells changing over 800,000 years. Where do you draw the line?" It leaves them with the idea that species are snapshots of a moving process.

  ### 4. When to Reveal the Disagreement
  **Do not start with it.**
  If you start by saying "Biologists can't agree," the students will view the Beetle exercise as a trick question. They will think, "Well, if you don't know, why are you asking me?"
  **Reveal it at the 10-minute mark.**
  Let them struggle with the Beetles for 7 minutes. Let them propose solutions. When they hit the wall, say: "You just found a problem that professional taxonomists publish papers about. There isn't one definition because nature doesn't read our textbooks."

  ### 5. Heading Off the "One Must Be Wrong" Misconception
  This is the biggest risk. They will think: *"If the DNA rule says the Birds are one species, and the Breeding rule says they are one species, but the Look rule says they are two... then one of these rules is lying."*

  **Intervene during the DNA section (Minute 15).**
  Use the **Toolbox Analogy**.
  *   Draw a hammer and a screwdriver on the board.
  *   Ask: "If I use a hammer to turn a screw, is the hammer 'wrong'?" (No, it's the wrong tool).
  *   Explain: "The Breeding Rule is a hammer. It works great for mammals. The DNA Rule is a screwdriver. It works great for bacteria. The Fossil Rule is a wrench. None of them are 'The Truth.' They are tools we pick depending on what animal we are studying."
  *   **Key Phrase:** "We aren't trying to find out what nature *is*; we are trying to agree on what to *call* it so we can talk to each other."

  ### 6. What to Avoid (The "Brain Melt" Zone)
  *   **Ontological Status:** Do not get into whether species are "real" groups in nature or just human inventions. That is philosophy, not biology, and 14-year-olds will spin out. Keep it practical: "We need names to save them from extinction."
  *   **Hybrid Zones:** Don't get bogged down in *why* the birds hybridize (ecology/behavior). Just accept the data: "They make fertile babies."
  *   **Phylogenetics:** Don't explain *how* the DNA is sequenced. Just treat the "3% cutoff" as a given rule for the sake of the argument.

  ### 7. The Final Assessment Question
  You need a question that separates "Science is fake" from "Science is contextual." Do not ask "What is a species?" (They will give up). Do not ask "Which definition is right?" (There is no right answer).

  **Ask this:**
  > "Imagine you are a park ranger. You have enough money to save only one group from going extinct.
  >
  > **Group A:** The North Beetles (who can't breed with South Beetles).
  > **Group B:** The Hybrid Birds (who look unique but breed with the other birds).
  >
  > If the law says you can only spend money on 'Endangered Species,' which group do you pick? **And which definition of 'species' did you have to use to make that choice?**"

  **Why this works:**
  *   If they say "It's all made up, so it doesn't matter," they failed.
  *   If they say "Save the Beetles because they can't breed with others (Breeding Rule)," they understood the utility.
  *   If they say "Save the Birds because they look unique (Morphological Rule)," they also understood the utility.
  *   **The Win:** You want them to realize that *their choice of definition changes who gets saved.* That proves the definition matters, even if it isn't "perfect."

  ### Summary Checklist for You
  1.  **Whiteboard:** Draw the 3 Islands first. Keep them up the whole time.
  2.  **Pacing:** If the Beetle discussion goes long, cut the Lizards. Do not cut the Beetles.
  3.  **Tone:** When they get frustrated, validate it. "Yeah, it's annoying. That's why it's a job."
  4.  **The Friend:** Be nice to your friend's idea. "It's a great tool, but look what happens when we use it on the Birds..."
  5.  **Closing:** End on the Fossils. It shows that species are a movie, but we only get to look at single frames. That's why it's hard.
