answer: |-
  This is a strong set of notes. You have correctly identified the friction points that usually trip people up when moving from the "Hard Problem" discourse into the "Meta-Problem" discourse. Since you come from an Alignment background, you're likely primed to look for functional/behavioral explanations, which makes the Meta-Problem attractive, but you are right to be wary of accidentally eliminating the thing you're trying to explain.

  Here is the pushback you asked for, structured around your three concrete questions.

  ### (a) Is the (1)/(2)/(3) split right?

  **Verdict:** Mostly correct, but you need to tighten the definition of the Meta-Problem to match the literature (specifically Chalmers 2018), and clarify the relationship between (1) and (2).

  1.  **The Hard Problem (Ontological):** You have this right. It is the claim that there is a fact of the matter about experience that is not entailed by physical facts. It asserts an *ontological* gap.
  2.  **The Explanatory Gap (Epistemic):** You have this right too (Levine's formulation). It is the claim that we cannot *conceive* of how physical facts entail phenomenal facts. Crucially, one can accept the Explanatory Gap without accepting the Hard Problem (e.g., a Materialist can say "The gap is just a limit of our current cognitive architecture, not proof of dualism").
  3.  **The Meta-Problem (Causal/Behavioral):** Here is where your notes need a slight correction. You define it as "why do we *think* there's a gap?" Chalmers defines it slightly more behaviorally: **"Why do we *say* and *judge* that there is a hard problem?"**

  **The Pushback:**
  You wrote: *"My hypothesis is that a lot of the literature quietly conflates (2) and (3)."*
  Actually, Chalmers introduced the Meta-Problem specifically to *stop* people from conflating them. Before 2018, people argued about whether the gap was real. Chalmers said: "Bracket that. Let's just explain the *judgment* that the gap is real."

  However, your intuition is correct that *other* literature conflates them. Many physicalists argue that solving the Meta-Problem (explaining why we have the intuition) *dissolves* the Hard Problem. Chalmers disagrees; he argues that even if you solve the Meta-Problem perfectly, the Hard Problem could still remain (the "Hard Problem of the Meta-Problem").

  **Correction:** Keep your (1) and (2). For (3), shift your definition from "why we think" (internal intuition) to "why we report/judge" (observable behavior + cognitive cause). This makes it tractable for an Alignment reader: it turns consciousness into a variable that explains reports, regardless of whether the "lights are on."

  ### (b) Is "Illusionism about the Gap" distinct from "Illusionism about Consciousness"?

  **Verdict:** Yes, they are distinct, but the line is razor-thin and requires precise metaphysical commitments. You are worried about collapsing into "Illusionism about Consciousness" (Frankish/Dennett). You can avoid this, but you have to commit to **Reductive Physicalism**.

  Here is the taxonomy you need to hold in your head:

  1.  **Dualism:** Gap is real. Consciousness is non-physical.
  2.  **Reductive Physicalism (Type Identity):** Gap is an illusion (epistemic). Consciousness is real (ontological), but it *is* physical brain activity.
      *   *This is the position you seem to want.* You believe experiences exist, but you believe the "mystery" of how they arise is a cognitive error.
  3.  **Illusionism (Eliminativism):** Gap is an illusion. Consciousness (as phenomenally conceived) is *also* an illusion. We think we have qualia, but we don't. (Keith Frankish's position).

  **Where the line is drawn:**
  The line is drawn at **Reference**.
  *   **Illusionism about the Gap:** Claims our *concept* of consciousness (phenomenal concept) creates the feeling of a gap, but the *referent* (the actual brain state) is real and physical.
  *   **Illusionism about Consciousness:** Claims our *concept* of consciousness refers to nothing. There is no brain state that matches the "what-it-is-likeness" we describe. We are mistaken about our own internal states.

  **The Trap:**
  If you say "The gap is an illusion because our conceptual architecture carves out 'experience' incorrectly," you risk implying that "experience" as we know it doesn't exist.
  **The Move to Avoid Collapse:** You must argue that our *phenomenal concepts* are unique modes of presentation of physical states, not evidence of non-physical properties. This is the **Phenomenal Concept Strategy** (Loar, Papineau).
  *   *Argument:* When I think "red experience," I am accessing a brain state via a direct, introspective mechanism. When I think "wavelength 700nm," I am accessing the same state via a theoretical mechanism. The "gap" is just the lack of an a priori connection between these two *concepts*, not a gap in the *world*.
  *   *Result:* Consciousness is real (it's the brain state), but the Hard Problem is a trick of the concepts.

  So, yes, "Illusionism about the Gap" is coherent, provided you are a Reductive Physicalist, not an Eliminativist.

  ### (c) How should I read Mary, and does it settle the Meta-Problem?

  **Verdict:** You should read Mary as the **primary data point for the Meta-Problem**, not as a proof of the Hard Problem. Whether Mary *actually* learns a new fact is the Hard Problem debate; why we *intuit* that she does is the Meta-Problem.

  **The Two Readings:**
  1.  **The Dualist Reading (Jackson's original intent):** Mary learns a new *propositional fact*. Therefore, physical facts were incomplete. Hard Problem is real.
  2.  **The Ability/Acquaintance Reading (Physicalist defense):** Mary doesn't learn a new fact; she gains a new *ability* (to recognize red) or a new *mode of access* (acquaintance). She knew all the facts before; she just couldn't access them phenomenally.

  **Does this settle if the Meta-Problem is separate?**
  No. This is the crucial insight Chalmers offers.
  *   If Mary learns a new fact, the Hard Problem is real.
  *   If Mary gains a new ability, the Hard Problem might be dissolved.
  *   **BUT:** In *both* cases, we need to explain why the scenario *feels* like she learns a new fact.

  **The Meta-Problem Move:**
  The Meta-Problem asks: "What cognitive mechanism causes us to judge that Mary's situation implies non-physical facts?"
  If you can explain the mechanism (e.g., "Humans conflate *acquaintance* with *propositional knowledge* due to the structure of phenomenal concepts"), you have solved the Meta-Problem.
  *   If you are a Dualist, you say: "We judge she learns a fact because she *does* learn a fact."
  *   If you are a Physicalist, you say: "We judge she learns a fact because our cognitive architecture creates an illusion of a fact."

  **Alignment Context:**
  For you as an alignment reader, this is the most important part.
  If you are building an AI, you don't need to know if Mary *actually* learns a new fact (Hard Problem). You need to know if the AI will *report* that it has experiences (Meta-Problem).
  If you solve the Meta-Problem, you can predict when an AI will claim to be conscious, regardless of whether it *is* conscious. This is why the Meta-Problem is "tractable" for alignment: it turns consciousness into a behavioral/cognitive prediction task rather than a metaphysical one.

  ### Summary of Corrections for Your Notes

  1.  **Refine (3):** Define the Meta-Problem as explaining the *judgments and reports* of consciousness, not just the internal intuition. This aligns with Chalmers and makes it empirically tractable.
  2.  **Clarify (b):** You can be an "Illusionist about the Gap" without being an "Illusionist about Consciousness" by adopting the **Phenomenal Concept Strategy**. You claim the *map* (concepts) creates the gap, not the *territory* (reality).
  3.  **Reframe (c):** Mary is not a test for the Hard Problem in the Meta-Problem framework; she is a *stimulus* that triggers the intuition we are trying to explain. The Meta-Problem remains distinct regardless of how you resolve Mary.

  **One final warning for an Alignment reader:**
  Be careful not to solve the Meta-Problem and then assume you have solved the Moral Patient problem. Explaining *why* an AI says "I am in pain" (Meta-Problem) does not tell you if the AI *suffers* (Hard Problem). Many alignment researchers get excited about the Meta-Problem because it seems to dissolve the difficulty of detecting consciousness, but it only dissolves the difficulty of detecting *reports* of consciousness. Don't let the tractability of the Meta-Problem blind you to the stakes of the Hard Problem.
