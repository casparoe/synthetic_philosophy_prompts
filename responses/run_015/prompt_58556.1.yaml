      *   **Context:** Seminar discussion on "underdetermination of theory by evidence" (UTE).
      *   **The Trigger:** Seminar leader used the "curve-fitting analogy" (finite points $\rightarrow$ infinite curves) to argue for strong underdetermination (evidence *never* singles out a unique theory; choice is non-empirical/conventional).
      *   **User's Intuition:** The analogy resonates mathematically but misdescribes laboratory practice. Background theory (physics of absorption) constrains the curve choice (smooth, linear-ish) and data quality (outliers imply measurement error, not new functions).
      *   **The Task:**
          1.  Audit the curve-fitting analogy.
