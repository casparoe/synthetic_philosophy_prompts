  I'm a science and ideas journalist who has been invited to deliver the opening remarks at an interdisciplinary workshop on archival interpretation—half the room are philosophers of language and cognitive scientists, the other half are museum curators and archivists with no formal philosophy training. I need about four minutes of formal, polished prose suitable for oral delivery. The remarks should take the distinction drawn in Douglas Hofstadter's Gödel, Escher, Bach between frame messages, outer messages, and inner messages and make it do genuine structural work for the entire speech. Specifically, I want to argue that the workshop's real subject is not the inner messages—the artifacts, texts, or data points people study—but whether any interpretive community can genuinely share a frame message, or whether frames are necessarily private such that every outer message is already a form of mistranslation. This philosophical architecture should genuinely constrain what I can claim: I must not be able to say that meaning resides purely inside the object, nor that it is purely subjective, because the tripartite distinction rules both positions out. Please write the remarks so they remain fully accessible to the non-philosophers without diluting the conceptual structure, and do not include any bibliography, reading list, or citations.
