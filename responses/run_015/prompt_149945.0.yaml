answer: |-
  Distinguished colleagues, practitioners, and theorists, welcome.

  We gather here from divergent traditions. Half of this room trains their eye on the conceptual architecture of meaning; the other half tends to the physical stewardship of history. Usually, when we meet, we discuss the artifacts themselves—the letters, the logs, the objects. We argue over what they say. But I propose that what we are actually gathered to investigate is not the content of those artifacts, but the conditions under which they can be read at all.

  To structure this inquiry, I invite you to adopt a tripartite distinction drawn from Douglas Hofstadter's work on communication. He suggests that any transmission of meaning involves three layers: the frame message, the outer message, and the inner message.

  Consider a sealed cylinder found in an archive. The physical object itself—the ink, the paper, the material seal—is the **outer message**. It is the signal waiting to be decoded. The **inner message** is the semantic content we hope to retrieve: the historical truth, the personal confession, the data point. But neither of these can exist without the **frame message**. The frame is the signal that tells us there is a message to be found and provides the rulebook for how to unlock it. It is the placard that says "This is Evidence," or "This is Art," or "This is Propaganda."

  For decades, archival interpretation has obsessed over the inner message. We fight over what the text means. Meanwhile, the philosophy of language has often worried that meaning is purely subjective, residing only in the mind of the beholder. Today, I ask you to reject both assumptions. The tripartite structure forbids them. Meaning cannot reside purely in the object, because an object without a frame is merely noise. Nor can it reside purely in the subject, because a mind without an outer message has nothing to decode. Meaning emerges only in the handshake between the two, mediated by the frame.

  This leads us to the central tension of this workshop. We assume that when we stand before an exhibit or open a file, we are sharing a frame. We assume that when a curator displays a document as "History," and a visitor reads it as "History," they are operating within the same structural context.

  But what if frames are necessarily private? What if my rulebook for decoding "History" is structurally incompatible with yours? If the frame is private, then the outer message—the artifact itself—cannot bridge the gap. Every display, every catalog entry, every transcription becomes a form of mistranslation. Not because the object is unclear, and not because the viewer is biased, but because the foundational agreement on how to begin reading is an illusion.

  Over the next few days, I challenge you to stop arguing about the inner message. Instead, test the frame. Can an interpretive community genuinely share a context, or are we all shouting across a divide of private rules? If we cannot share the frame, we cannot share the meaning.

  Let us begin.
