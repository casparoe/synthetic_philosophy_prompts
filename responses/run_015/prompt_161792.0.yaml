answer: |-
  Here is a structured analysis for your seminar, mapping the Ireland 1983–2015 episode onto the Hart–Devlin machinery, testing your "enforcement-elasticity" distinction, and isolating the silences in both frameworks.

  ### 1. Devlin's Machinery: 1983 Court vs. 2015 Electorate

  **The 1983 Court (Norris v. Attorney General)**
  On Devlin's terms, the 1983 Supreme Court was acting legitimately. Devlin argues that a society is a community of ideas, and shared morality is the bond that holds it together. If the "man on the Clapham omnibus" (or the Irish equivalent) feels intolerance, indignation, or disgust at a practice, the society has the right to use the law to preserve itself against disintegration.
  *   **The "We":** The relevant "we" in 1983 was the post-independence Irish polity, heavily informed by Catholic social teaching and the constitutional recognition of the "special position" of the Church (until 1972).
  *   **The Evidence:** The lack of legislative repeal, the constitutional wording, and the court's own reasoning regarding the "Christian character of the state" serve as empirical evidence of the shared morality.
  *   **The Verdict:** Devlin must endorse the 1983 ruling. The law was reflecting the existing moral bond. To strike it down would have been judicial activism imposing a minority morality on the majority, threatening the social fabric.

  **The 2015 Electorate (Marriage Equality Referendum)**
  *   **The "We":** The same territorial polity, but the moral community has shifted.
  *   **The Evidence:** A 62% vote is the ultimate "jury verdict." It is the precise empirical measurement Devlin calls for: a direct reading of the public's intolerance (or lack thereof).
  *   **The Verdict:** Devlin must endorse the 2015 result *even more strongly* than the 1983 one. If the shared morality changes, the law *must* change to remain the guardian of that morality. To keep the ban after 2015 would be to enforce a "dead" morality, which Devlin explicitly rejects. Law follows morality, not vice versa.

  **Is this a *Reductio*?**
  It looks like one: the theory validates the criminalization of X in year T1 and the constitutional protection of X in year T2.
  *   **Devlin's Defense:** It is not a contradiction; it is historical contingency. Devlin is not a natural lawyer. He does not claim homosexual acts are *inherently* destructive; he claims they are destructive *if* the society believes them to be. If the belief vanishes, the threat of disintegration vanishes.
  *   **The "Majority Whim" Problem:** Can Devlin distinguish "deep societal morality" from "passing majority preference"? He tries to, by invoking feelings of *disgust* rather than mere *disapproval*. But a referendum is a measure of preference. If 51% vote to ban something out of mild annoyance, is that the "moral bond"?
  *   **Smuggling Hart:** If Devlin says, "No, a mere vote isn't enough; it must be *true* morality," he has stepped outside his empirical test and into Critical Morality. He is now judging the voters against a standard they don't hold. That makes him Hart. If he sticks to his empirical test, he is hostage to the vote.

  ### 2. Testing "Enforcement-Elasticity"

  **Your Distinction:**
  *   **Elastic Norms:** Enforcement reduces incidence (e.g., tax evasion, speeding).
  *   **Inelastic Norms:** Enforcement reduces visibility, not incidence (e.g., sexual orientation, private drug use).

  **Application to Devlin:**
  If you grant this distinction, it guts Devlin's specific argument regarding homosexuality.
  *   **The Disintegration Mechanism:** Devlin argues that widespread immorality loosens the bonds of society. If the conduct is inelastic, criminalization doesn't reduce the conduct, only the *knowledge* of the conduct.
  *   **The Restricted Legal Moralism:** If the state only enforces elastic norms, Devlin's theory becomes a tool for administrative efficiency, not moral defense. You ban things that spread (contagion), not things that offend.
  *   **Does it save him?** No. It restricts him to a utilitarian harm principle (preventing the spread of behavior) rather than a moralist one (preventing the offense to the bond).

  **The Devlin Reply (The Student Objection):**
  *"You're assuming the incidence is independent of the law. It isn't. The law shapes the moral environment. Criminalization stigmatizes, which suppresses self-identification and recruitment. Decriminalization normalizes. Visibility is the contagion."*

  *   **Analysis:** This is a sophisticated sociological claim. It argues that elasticity is long-term, not short-term. The law doesn't just stop the act; it stops the *culture* that produces the act.
  *   **Is it Empirical?** Yes. It claims a causal link between legal status and prevalence/identification over a generation.
  *   **What Settles It?** Longitudinal data on identification rates pre- and post-decriminalization. (We actually have this: identification rates rose post-1993, but causation is hard to isolate from broader cultural shifts).
  *   **The Trap:** If Devlin relies on this, he admits the "disintegration" is not about the act itself, but about the *public endorsement* of the act. This moves the goalposts from "protecting society from sin" to "protecting society from the *idea* that sin is acceptable." This makes the law a tool of censorship rather than conduct regulation.

  ### 3. What This Does to Hart

  **The Comfort Zone:**
  Hart looks vindicated on content. The Harm Principle aligns with the 2015 outcome. The distinction between Positive Morality (1983 view) and Critical Morality (1993/2015 view) explains the shift without validating the 1983 oppression.

  **The Vulnerability:**
  The 2015 referendum is Devlin's best-case scenario.
  *   **Mechanism:** It was not a court imposing rights (like *Obergefell* in the US); it was the "jury of society" speaking.
  *   **The Problem for Hart:** If the majority had voted *No* in 2015, Hart would still say the ban is wrong (violation of liberty). Devlin would say the ban is right (reflection of shared morality).
  *   **Unfalsifiability:** Devlin's theory risks becoming a tautology. "The law should enforce society's morality." "What is society's morality?" "Whatever the legislature/jury says." "Why did they change?" "Because morality changed." He can never be wrong about the *content* of the law, only the *accuracy of the measurement*. He becomes a legal positivist about morals.

  ### 4. Institutions and Silence

  **Institutions: Jury vs. Court**
  *   **Devlin's Preference:** Devlin explicitly distrusts judges as arbiters of morality. He prefers the legislature or a jury. He would prefer the Irish referendum route over the US Supreme Court route (*Obergefell*, decided same year). He would argue the US Court imposed a critical morality on a society that hadn't yet shifted its positive morality, risking the "disintegration" he fears.
  *   **Resources for Criticism:** Devlin has the resources to criticize the Court route as undemocratic moral imposition. He has *no* resources to criticize the Referendum route, even if the result were illiberal.

  **The Silences**
  This is where you press the students. The framework breaks down when asked to define its terms.
  1.  **Rights:** Devlin has no account of individual rights against the "we." If the 2015 vote had been 90% to 10% against marriage, the minority has no recourse. The theory is silent on protection.
  2.  **Boundaries of the "We":** Who counts in the moral community?
      *   Ireland 1983: The "We" was effectively Catholic, nationalist, and heteronormative.
      *   Ireland 2015: The "We" is secular, pluralist.
      *   *Silence:* Devlin cannot explain *which* "We" is authoritative when they occupy the same territory. Is it the traditional morality or the current majority? He implies tradition, but admits change. He has no metric for the *rate* of acceptable change.
  3.  **Verification of Disintegration:** This is the fatal silence. Ireland decriminalized in 1993. It did not disintegrate. It flourished economically and socially.
      *   *Devlin's Out:* He can claim disintegration is slow (generational).
      *   *The Counter:* Then the theory is untestable. If disintegration never happens, was the threat ever real? If it happens in 100 years, how do we know it wasn't something else?

  ### 5. Seminar Verdict

  **Does this case help or hurt Devlin?**
  It **hurts** the necessity of his claim but **helps** the procedural logic.
  *   **Hurts:** The empirical prediction (disintegration) failed. Ireland removed the moral enforcement and the society cohered *more* strongly (higher turnout, civic engagement). This suggests the "moral bond" was not as fragile as Devlin claimed.
  *   **Helps:** It validates his procedural insistence that morality should be settled by the community, not the courts. The 2015 vote is the "Devlin Ideal" in action: the law tracked the shift in public feeling.

  **Final Conclusion for the Class:**
  The Hart–Devlin debate was never really about cases like this. It was about *stability* vs. *liberty* in a static context. The Ireland episode shows that morality is fluid.
  *   **Devlin** turns out to be a **sociological mirror**: He tells us law *does* follow morality, but he cannot tell us when it *should* stop following it if the morality is hateful.
  *   **Hart** turns out to be a **critical check**: He provides the language to say the 1983 court was wrong *even if* it reflected the majority view.

  **The Takeaway:** Use Ireland to show that Devlin's theory is descriptively powerful (it explains why the law changed) but normatively empty (it cannot explain why the 1983 law was unjust). Hart provides the normative critique but relies on a mechanism (rights/courts) that Devlin correctly identifies as vulnerable to the charge of elitism. The 2015 referendum is the rare moment where the "Devlin Mechanism" produced the "Hart Outcome," masking the fundamental incompatibility of their theories.
