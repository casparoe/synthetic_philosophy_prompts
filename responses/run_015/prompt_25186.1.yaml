answer: |-
  You have identified a genuine and pervasive structural feature of the literature, but to answer your primary question directly: **No, there is no single, canonical proper name for this specific dialectical structure.**

  While the topic is universally referred to as the **"Equality of What?" debate** (following Sen's 1980 paper) or the **"Currency of Egalitarian Justice"** problem, the *iterative logical form* you describe—the specific regress from resources to welfare to opportunity driven by sequential counterexamples—does not have a capitalized label analogous to "The Gettier Problem" or "The Veil of Ignorance."

  In the literature, this structure is usually described rather than named. Scholars refer to it as the **"metric problem,"** the **"search for the currency,"** or the **"luck egalitarian succession."** However, your intuition is correct that this is a distinct argumentative form.

  If we were to coin a term that captures the logical mechanics rather than just the topic, the most precise label would be **"The Currency Regress"** or, more normatively, **"The Compensation-Responsibility Regress."**

  Here is an analysis of why this structure lacks a canonical name, how it should be distinguished from similar philosophical structures, and why it behaves differently than a standard refinement spiral.

  ### 1. Why is there no established name?
  The lack of a specific name stems from how the debate evolved historically rather than logically.
  *   **Historical Accretion:** The sequence (Resources $\rightarrow$ Welfare $\rightarrow$ Opportunity $\rightarrow$ Capability) emerged as a historical succession of theories (Dworkin $\rightarrow$ Arneson $\rightarrow$ Cohen $\rightarrow$ Sen) rather than as a pre-identified logical puzzle. Scholars tend to name the *positions* (e.g., "Resource Egalitarianism") rather than the *transition mechanism* between them.
  *   **The "Exit" Strategy:** A significant portion of the literature (most notably Elizabeth Anderson's *"What is the Point of Equality?"*) argues that the regress itself is a mistake. Relational or Democratic Egalitarians contend that the search for a distributive currency is the error. Because a major faction seeks to **dissolve** the structure rather than **solve** it, the structure itself is rarely reified as a standalone object of study.

  ### 2. Proposed Terminology: "The Currency Regress"
  If you need a term for your own work, **"The Currency Regress"** is the most neutral and descriptive option. However, to capture the *normative engine* driving the regress, **"The Compensation-Responsibility Regress"** is more analytically precise.

  **The Mechanism:**
  The regress is driven by the tension between two competing normative intuitions that cannot be simultaneously satisfied by a single metric:
  1.  **The Compensation Principle:** People should be compensated for disadvantages for which they are not responsible (pushes the currency *inward* from resources to welfare/capability).
  2.  **The Responsibility Principle:** People should bear the costs of their voluntary choices (pushes the currency *outward* from welfare to resources/opportunity).

  Every time a proponent shifts the currency to satisfy the Compensation Principle (e.g., moving from Income to Welfare to account for disability), they violate the Responsibility Principle (e.g., subsidizing expensive tastes). Every time they shift to satisfy Responsibility (e.g., moving to Opportunity), they risk violating Compensation (e.g., ignoring unchosen option luck). The "regress" is the failure to find a stable equilibrium between these two poles.

  ### 3. Distinguishing the Structure
  You asked how to distinguish this from a skeptical regress, a Sorites sequence, or a standard objection-and-refinement spiral. Here is the differentiation:

  #### A. Vs. The Skeptical Regress (Agrippan Trilemma)
  *   **Skeptical Regress:** Epistemic. $P$ is justified by $Q$, which is justified by $R$... leading to infinitism, circularity, or dogmatism.
  *   **Currency Regress:** Normative. It is not about *justification* but about *adequacy of description*. The problem is not that we lack a reason for the currency, but that every currency fails to map onto the underlying normative ideal (equal concern/respect) without generating counterintuitive implications.
  *   **Key Difference:** A skeptical regress threatens to make knowledge impossible. The Currency Regress threatens to make *policy* impossible (or morally repugnant).

  #### B. Vs. The Sorites Sequence
  *   **Sorites:** Relies on vagueness and boundarylessness (one grain does not make a heap).
  *   **Currency Regress:** Relies on **heterogeneity** and **incommensurability**. The shift from Resources to Welfare is not a slippery slope of degrees; it is a categorical shift in the *type* of information being valued. The problem is not "where do we draw the line?" but "which dimension should we measure?"
  *   **Key Difference:** Sorites problems are solved by precisification or epistemicism. The Currency Regress is solved (if at all) by prioritizing one normative value over another (e.g., prioritizing Responsibility over Compensation).

  #### C. Vs. Standard Objection-and-Refinement
  *   **Standard Refinement:** Theory $T_1$ faces counterexample $E$. Theory $T_2$ incorporates $E$ and converges closer to the truth. The sequence is teleological and convergent.
  *   **Currency Regress:** The sequence is **oscillatory** or **expansive**. Moving from Resources to Welfare solves the disability problem but creates the expensive tastes problem. Moving back to Resources solves the tastes problem but resurrects the disability problem.
  *   **Key Difference:** Standard refinement assumes a stable target. The Currency Regress suggests the target (the "true" currency) may be conceptually unstable because it requires disentangling **Endowment** from **Ambition** (Dworkin's distinction), which many argue is metaphysically or epistemically impossible to do perfectly.

  ### 4. The "Dead-End" and the Anderson Critique
  You noted the chain seems to "cycle or dead-end." This is a crucial feature.
  *   **The Dead-End:** The regress typically dead-ends at **Opportunity for Welfare** (Arneson) or **Capability** (Sen). These are the most informationally demanding metrics. They require knowing not just what people have, but what they *could* have done, and what they *could* be. This creates an epistemic barrier (we cannot know counterfactual preferences) that halts the regress practically, even if not logically.
  *   **The Cycle Breaker:** Elizabeth Anderson's intervention is the most famous attempt to name and stop this structure. She argues that the entire **"Luck Egalitarian"** framework (which generates this regress) is misguided. She proposes shifting from **"Distributive Egalitarianism"** (equalizing a currency) to **"Relational Egalitarianism"** (ending oppression). In her view, the Currency Regress is a symptom of a category error.

  ### Summary Recommendation
  If you are writing on this, I recommend introducing the term **"The Currency Regress"** explicitly. You can define it as:

  > *The dialectical sequence in egalitarian theory wherein a proposed metric of equality is rejected for being either too insensitive to individual heterogeneity (violating the compensation principle) or too sensitive to individual preference (violating the responsibility principle), forcing a shift to a new metric that inherits the vulnerabilities of the previous ones.*

  This distinguishes it from the broader "Equality of What?" debate (the topic) and identifies the specific logical engine (the regress) you have isolated. It acknowledges that the debate is not just a list of options, but a dynamic, driven progression with a specific failure mode.
