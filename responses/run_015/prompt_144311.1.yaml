  Based on your colleague's self-identification as a "Lewisian" and her specific verdicts on the cases provided, here is an analysis of the definitions she is likely employing, their application to the snow clearing case, and a prediction of her final verdict.

  ### Three Candidate Rules for Convention

  To fit her earlier verdicts (classifying coordination problems like *walkers* and *red lights* as conventions, while excluding forced regularities like *stairs* and preference-mismatch scenarios like *driving alone*), we can distill her commitments into three rules. The first two are core Lewisian conditions; the third is a common rival view that also fits her past data but diverges on the new case.

  1.  **The Coordination Condition (Strict Lewis):** A regularity is a convention only if agents prefer to conform *on the condition that others conform*. There must be strategic interdependence (a coordination problem); my payoff depends on your action, and vice versa.
      *   *Fits Past Verdicts:* Explains why *walkers*, *handshakes*, and *red lights* are conventions (matching matters). Explains why *driving alone* is not (Prisoner's Dilemma structure; I prefer to drive regardless of you).
  2.  **The Arbitrariness Condition:** A regularity is a convention only if there is at least one alternative regularity that could have solved the same coordination problem equally well.
      *   *Fits Past Verdicts:* Explains why *stairs* are not a convention (no alternative equilibrium; the lift is broken). Explains why *left-stepping* is (could have been right).
  3.  **The Normative Expectation Condition (Rival):** A regularity is a convention if there is a mutual belief that one *ought* to conform, and deviation is met with sanctions or criticism.
      *   *Fits Past Verdicts:* Explains *red lights* (fines/honking) and *queueing* (social disapproval). Explains why *driving alone* is not (prompt states "nobody disapproves").

  ### Application to the Snow Clearing Case

  Here is how each rule predicts the status of the snow clearing practice:

  *   **Coordination Condition:** **Predicts: Not a convention.** The prompt explicitly states, "Nothing about anyone's clearing depends on anyone else's" and "nobody any longer has any use for anyone else's patch." The strategic interdependence required for a coordination problem has vanished.
  *   **Arbitrariness Condition:** **Predicts: Convention.** Clearing at 9 AM is arbitrary; they could have chosen 10 AM or not cleared at all without physical impossibility.
  *   **Normative Expectation Condition:** **Predicts: Convention.** There is a mutual belief that one "ought to clear," and deviation is sanctioned via gossip.

