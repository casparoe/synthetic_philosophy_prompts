answer: |-
  When we consider Blaise Pascal's famous fragment from the Pensées that justice without force is powerless and force without justice is tyrannical, we are immediately confronted with a problem that feels distinctly modern even though it was penned in the shadow of Louis XIV. Pascal argues that because human nature is fallen and corrupt, abstract notions of right cannot sustain themselves against self-interest without the backing of physical coercion. He suggests that we obey laws not because they are inherently just, but because they are established and enforced. If we take this skepticism seriously and apply it to the contemporary crisis of climate change, specifically regarding international treaties between sovereign states, we arrive at a troubling impasse. There is no global sovereign, no world government with a monopoly on violence to punish nations that exceed their carbon budgets. If Pascal is read strictly, this absence of a global sword suggests that climate treaties are necessarily unjust or at best powerless idealism, mere words written on water. However, I want to defend the verdict that these treaties can still qualify as a form of earthly justice within a Pascalian framework, provided we expand his definition of force to include structural economic interdependence rather than limiting it to the monarch's army or divine authority.

  To understand why this expansion is necessary, we have to look at why Pascal insisted on force in the first place. For Pascal, justice is not a natural quality inherent in actions but a conventional agreement necessary to keep the peace among sinful humans. Without the threat of punishment, humans will inevitably revert to their selfish desires, rendering any agreement void. In the context of climate negotiations, if a country can gain economically by ignoring emissions targets while others suffer the cost of compliance, Pascal would predict they will defect. If there is no mechanism to punish that defection, the treaty is powerless. However, the modern world offers a form of coercion that Pascal could not have fully anticipated. While there is no global police force, there is a tightly woven web of economic sanctions, trade barriers, carbon taxes, and market access restrictions. When a nation violates a climate treaty, it may not face an invading army, but it risks being locked out of critical markets or facing punitive tariffs that cripple its economy. This economic pain functions exactly as Pascal's force functions. It compels compliance not through moral persuasion but through the threat of tangible loss. Therefore, climate treaties are not mere wishful thinking if they are backed by these economic teeth. They become instruments of justice because they align self-interest with the collective good through the mechanism of enforced consequence.

  One might object that this stretches Pascal's meaning too far, noting that he was writing in a monarchical context where force was centralized and visceral, often tied to the divine right of kings or the physical sword of the state. In his view, force was something absolute and top-down, whereas modern economic interdependence is diffuse and horizontal. Furthermore, some scholars argue that Pascal's ultimate concern was theological, suggesting that true justice belongs only to God and that earthly force is a tragic necessity for managing sin until the end of time. If we accept this theological reading, then any human attempt at justice, including climate treaties, is inherently flawed and provisional. However, dismissing the treaties based on this objection ignores Pascal's pragmatic engagement with the political reality of his own time. He acknowledged that while earthly justice is not divine justice, it is still necessary for social order. The form of the force matters less than its function. Whether the coercion comes from a king's executioner or a coalition of nations imposing carbon border adjustments, the effect is the same: it makes injustice costly. To insist that only vertical, monarchical force counts is to freeze Pascal's thought in the seventeenth century rather than applying his logic to the structures of power that actually exist today. If the market can starve a nation into compliance as effectively as an army can besiege it, then it satisfies the functional requirement of Pascal's force.

  This brings us to a deeper tension within Pascal's system regarding the relationship between justice and charity. Pascal distinguishes sharply between the order of justice, which is coercive and external, and the order of charity, which is voluntary and internal. Charity belongs to the heart and cannot be commanded, whereas justice belongs to the state and must be enforced. Climate action is often framed in the language of charity, appealing to our moral duty to future generations or to the poor nations who suffer most from warming. If we rely solely on this charitable impulse, Pascal would argue we are doomed, because charity is voluntary and unreliable in a fallen world. Nations will feel charitable until it costs them too much, and then the charity will vanish. For a climate treaty to be just in Pascal's sense, it cannot rely on charity. It must move the issue from the realm of voluntary benevolence to the realm of obligatory justice. This means the treaty must establish binding constraints backed by the economic force discussed earlier. If the treaty relies on goodwill, it is charity and therefore powerless to ensure universal compliance. If it relies on sanctions and economic penalties, it becomes justice. The danger lies in confusing the two. If leaders frame climate action as a moral gift rather than a legal obligation backed by force, they invite the very failure Pascal predicts. The treaty must be ugly and coercive to be effective, because it is dealing with the selfishness of sovereign states, not the grace of saints.

  Ultimately, Pascal's framework does not doom climate treaties to be mere idealism, but it does strip them of any moral pretension that they can work without coercion. The verdict is that these treaties can be just, but only if we acknowledge that the force required to sustain them is present in the structure of the global economy. We must stop pretending that signatures on a document are enough and recognize that justice exists only where there is a cost to violation. Pascal would likely view the current state of affairs with skepticism, noting that without a central sovereign, the enforcement is patchy and often avoided by the powerful. Yet, he would also recognize that the economic interdependence of nations has created a de facto global sovereign in the form of the market. If a nation violates the climate justice agreed upon, the market punishes it. This makes the treaties more than wishful thinking. They are fragile, imperfect instruments of earthly justice, distinct from the divine charity that Pascal reserved for the relationship between man and God. By accepting that economic structural pressure counts as force, we save the treaties from being powerless, but we also accept the grim Pascalian reality that they work not because nations want to do good, but because they are afraid of the cost of doing evil. This is not a hopeful vision, but it is a just one, and in Pascal's world, that is the best we can hope for.
