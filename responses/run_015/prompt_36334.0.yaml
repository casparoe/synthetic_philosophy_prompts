answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON DEMOCRATIC TRAJECTORIES**

  **Date:** 24 May 2024
  **Signatories:** Dr [Comparativist Name] & Dr [Sceptic Name]
  **Subject:** A Framework for Analysing Institutional Change in Established Democracies (2010–2024)

  ### 1. Agreed Empirical and Conceptual Claims

  Notwithstanding our theoretical divergences regarding the utility of the term 'democratic backsliding', we agree upon the following empirical observations and conceptual distinctions as a baseline for our collaboration:

  1.  **Observed Institutional Changes (2010–2024):** In Hungary, Poland, Turkey, and the United States, there have been verifiable instances where elected incumbents have utilised legislative majorities to alter the composition, jurisdiction, or funding of oversight institutions. Specifically:
      *   **Hungary:** The Fundamental Law (2011) and subsequent legislation significantly altered the Constitutional Court's composition and consolidated media regulatory authority.
      *   **Poland:** Between 2015 and 2023, the ruling majority altered the retirement age of Supreme Court judges and restructured the National Council of the Judiciary.
      *   **Turkey:** Following 2016, executive authority was expanded via constitutional referendum, and civil society organisations faced increased regulatory scrutiny.
      *   **United States:** There has been a measurable increase in partisan polarisation regarding the administration of elections and the normative constraints on executive power, though formal institutional changes remain less pronounced than in the European cases.
  2.  **The Function of Democracy Indexes:** We acknowledge that major democracy indexes (e.g., V-Dem, Freedom House, Economist Intelligence Unit) rely on expert-coded data. They measure *assessments* of democratic quality rather than raw objective events. Consequently, they are subject to coder bias, temporal lag, and conceptual drift. A decline in an index score indicates a negative consensus among experts, but does not independently verify the *mechanism* of that decline.
  3.  **Electoral vs. Liberal Democracy:** We distinguish between a polity ceasing to be an *electoral democracy* (the absence of free and fair elections, universal suffrage, or basic contestation) and a polity becoming *less liberal* (the erosion of checks and balances, minority rights, and civil liberties whilst retaining competitive elections). We agree that a state may remain an electoral democracy whilst significantly reducing its liberal character.
  4.  **Distinctiveness from Coups:** We agree that the changes cited above differ from classic military coups d'état. They are effected by civilian incumbents, generally utilise existing legal frameworks or constitutional amendment procedures, and occur incrementally rather than instantaneously.
  5.  **Distinctiveness from Bad Governance:** We agree that policy failure, corruption, or unpopular legislation do not constitute democratic degradation unless they specifically impair the mechanisms of accountability or the capacity of the opposition to compete for power.

  ### 2. Statement of Residual Disagreements

  While we agree on the facts listed above, we disagree on the analytical framework used to interpret them. The table below outlines our divergent positions, phrased to ensure each party accepts the characterisation of their own view.

  | Crux | The Comparativist's Position | The Sceptic's Position |
  | :--- | :--- | :--- |
  | **1. Mechanism vs. Direction** | 'Backsliding' names a specific **mechanism**: a repeatable playbook of legalistic institutional capture by incumbents. It is a distinct mode of regime change, analytically separable from normal political contestation. | 'Backsliding' names a **direction of travel** identified retrospectively. It conflates distinct political phenomena (polarisation, policy shifts, corruption) under a single label because they move in the same direction on an index, obscuring more than it reveals. |
  | **2. Concept vs. Usage** | The concept is analytically sound; its **politicised uptake** by NGOs and foreign ministries is a separate problem of communication. The scholarly value remains intact regardless of how activists use the term. | The concept is **inherently normative**. It presupposes a 'correct' endpoint of liberal consolidation that is historically contingent. Its partisan uptake is a defect of the concept itself, as it cannot be disentangled from Western geopolitical interests. |
  | **3. Historical Baseline** | The post-1990 liberal order established a **new baseline** for democratic compliance. Deviations from this baseline are analytically significant regardless of historical precedents. | The post-1990 baseline is **historically anomalous**. Comparing current governance to a 'perfect' liberal ideal generates false positives; many stable democracies in the 20th century functioned with restrictions now deemed 'backsliding'. |

  ### 3. Pre-Registered Observables and Predictions

  To move beyond theoretical stalemate, we identify the following concrete scenarios. We record our predictions now to assess the explanatory power of our respective frameworks after the fact.

  #### Scenario A: The Polish Reversal (2023–2027)
  **Context:** The post-2023 coalition government in Poland attempts to undo the judicial and media reforms enacted by the Law and Justice (PiS) party between 2015 and 2023.

  *   **Observable:** The speed and legal resistance encountered in restoring the Constitutional Tribunal and public media to their pre-2015 operational independence.
  *   **Comparativist Prediction:** Reversal will be **slow and incomplete**. If 'backsliding' is a structural mechanism, the institutions will have developed a path dependence and a new elite constituency that resists restoration. We expect continued friction and legal deadlock through 2027.
  *   **Sceptic Prediction:** Reversal will be **relatively swift**. If the changes were merely partisan policy rather than structural regime change, a new legislative majority should be able to overturn them with standard procedure. If the reforms are reversed within one electoral cycle, it proves the 'backsliding' label exaggerated the institutional depth of the changes.

  #### Scenario B: The US Normative Stress Test (2024–2025)
  **Context:** Following the 2024 US Presidential Election, the losing party contests the result, leading to administrative delays or legal challenges regarding the transfer of power.

  *   **Observable:** Whether the transfer of power occurs despite normative breaches, or whether formal institutional rules are altered to prevent it.
  *   **Comparativist Prediction:** If the transfer is delayed or conditioned on legal concessions, this constitutes **backsliding**. The erosion of norms is the precursor to the erosion of rules; the mechanism is already active regardless of the final outcome.
  *   **Sceptic Prediction:** If the transfer occurs, even amidst turmoil, the system has demonstrated **resilience**, not backsliding. Focusing on 'norms' is subjective. Unless the Electoral College or certification laws are formally changed to disenfranchise voters, the concept of backsliding adds no value over 'polarisation'.

  #### Scenario C: Hungarian Stability (2026)
  **Context:** The Fidesz government remains in power following the 2026 elections, maintaining the institutional architecture established since 2010.

  *   **Observable:** The classification of Hungary's regime type by international bodies and the internal stability of the ruling coalition.
  *   **Comparativist Prediction:** Stability confirms the **completion of backsliding**. The regime has transitioned to a stable 'hybrid' or 'electoral authoritarian' state. The concept is validated by the permanence of the change.
  *   **Sceptic Prediction:** Stability confirms the **irrelevance of the term**. If the system is stable, 'backsliding' (implying a fall) is the wrong metaphor. It is simply a different type of political settlement. The term implies a process of decay, whereas the reality is a static alternative equilibrium.

  ***

