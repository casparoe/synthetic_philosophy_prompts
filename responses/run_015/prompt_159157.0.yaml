answer: |-
  ### Adjudication of Moves

  **Move 1 (Nadia): Right.**
  Nadia correctly identifies the illocutionary force of a public monument. A statue in a public square is not an archive entry; it is a speech act by the municipality. By maintaining it, the city does not merely acknowledge Pembroke's existence but actively endorses his status. This establishes that the debate is not about *history* (which remains in books) but about *honor*. If the honor is tainted by moral atrocity, the speech act becomes a lie or a violation of civic values.

  **Move 2 (Gordon): Partly Right.**
  Gordon is right on the pragmatics but wrong on the semantics. He correctly establishes that renaming imposes tangible, concentrated costs on current residents and businesses for a symbolic gain. This is a valid utilitarian constraint. However, he is wrong to claim a street name is merely a "coordinate." As Nadia will show, infrastructure named after people retains honorific content. He establishes that the *burden of change* falls on innocent third parties, which is a strong argument against renaming, but he fails to prove the name is morally neutral.

  **Move 3 (Nadia): Right.**
  Nadia successfully refutes Gordon's "coordinate" theory. She establishes that street names are continuous acts of state speech (used in dispatch, law, and address). Her point that "emptiness is not innocence" is crucial: the fact that people stop noticing the honor does not negate the honor; it merely normalizes it. This establishes that the street name *is* a form of commemoration, not just infrastructure, though it is a lower-intensity form than a statue.

  **Move 4 (Gordon): Partly Right.**
  Gordon correctly identifies that removal is not the only alternative to uncritical praise; contextualization (re-inscription) is a viable middle path. He establishes that removal is irreversible, whereas annotation allows for future correction. This is a strong procedural argument for caution. However, he is partly wrong to assume annotation is "strictly more truthful." Adding a plaque to a heroic bronze often creates cognitive dissonance rather than truth; it can look like an apology that refuses to surrender the honor. He establishes the value of *preservation*, but not necessarily the value of *display*.

  **Move 5 (Nadia): Right (on the statue), Partly Right (on the street).**
  Nadia makes a critical distinction between *Ancestor-commemoration* (lineage, inclusive of flaws) and *Exemplar-commemoration* (imitation, requiring virtue). She is right that the statue's inscription ("AN EXAMPLE") locks it into the latter category. A plaque cannot cancel the physical rhetoric of a bronze figure placed above viewers at a library entrance. She establishes that the statue is functionally incompatible with the known facts of Pembroke's life. Her concession on the street is logically consistent with her distinction (streets function more like lineage markers), but it is a tactical retreat that leaves the street's honorific nature unchallenged.

  **Move 6 (Gordon): Right.**
  Gordon raises the decisive ethical objection. He establishes that the city committee may lack the standing to decide this unilaterally. If the harm was done to a specific nation, their descendants hold the primary moral claim over how that harm is remembered. To remove the statue without their consent is to repeat the dynamic of dispossession (deciding for them). He also introduces relocation (museum) as a compromise that solves Nadia's "compulsory address" problem without triggering the "erasure" problem. This establishes that *agency* is a prerequisite for a just resolution.

  ### Missing Considerations

  Both parties are arguing in a vacuum regarding the most important stakeholder.
  1.  **Indigenous Agency:** Gordon raises the question in Move 6 ("Whose claim is this?"), but neither he nor Nadia knows the answer. The argument assumes the committee must decide based on *their* reading of history or *their* civic conscience. The missing step is formal consultation with the descendants of the removed communities. Their preference (removal, relocation, or contextualization) should be the primary determinant, not a secondary factor.
  2.  **The Relocation Compromise:** Gordon mentions relocation in Move 6, but Nadia does not respond to it before the debate circles. This is the only option that satisfies Nadia's demand to end the "compulsory address" of the exemplar while satisfying Gordon's desire to preserve the object for historical study.
  3.  **The "Example" Inscription:** Both treat the statue as a generic monument. They underweight the specific text "TO THE YOUTH OF THIS CITY, AN EXAMPLE." This makes Gordon's "re-inscription" plan (Move 4) logically untenable. You cannot place a plaque next to a command to "imitate this man" that says "but do not imitate this part of him." The object itself is the argument, and the argument is false.

  ### Recommendation

  **The Statue: Relocate.**
  The statue should be removed from the library entrance and transferred to a historical society or museum setting.
  *   **Reasoning:** Nadia is correct that the "Exemplar" inscription makes the statue's current placement untenable. A civic building cannot command youth to emulate a man who engineered ethnic cleansing. Gordon is correct that destruction or irreversible removal is undesirable; the object is historically significant and should be preserved for study. Relocation resolves the "compulsory address" (it is no longer forced upon library patrons) while preserving the artifact.
  *   **Condition:** This action must be contingent on consultation with the Indigenous nation. If they request permanent removal (deaccessioning), their claim (Move 6) outweighs the historical value. If they prefer it stand with context, the museum setting allows for that context to be the primary frame, rather than an add-on to a heroic bronze.

  **The Street: Retain (for now).**
  Pembroke Avenue should keep its name, pending the outcome of the Indigenous consultation.
  *   **Reasoning:** Nadia conceded this point in Move 5 based on the Ancestor/Exemplar distinction, and she is logically consistent to do so. A street name functions more as a geographical marker than a command to imitate. Gordon's cost argument (Move 2) carries significant weight here: imposing financial burdens on current residents for a symbolic correction is unjust when the primary honor (the statue) is being addressed. However, the name should be reviewed after consulting the Indigenous nation. If they view the street name as an ongoing injury comparable to the statue, the city must weigh that moral harm against the financial cost.

  **The Harder Case: The Statue.**
  The street is the easier case because the arguments for retention (cost, function) and removal (honor) are separable, and one party (Nadia) effectively conceded it based on her own philosophical framework. The statue is the harder case because it presents a direct conflict between three valid principles:
  1.  **Truth:** The statue tells a lie about Pembroke's moral standing.
  2.  **History:** The statue is itself a historical artifact of 1911 values.
  3.  **Justice:** The continued display may violate the dignity of the victims' descendants.
  Balancing these requires a nuanced solution (relocation) rather than a binary one (keep/destroy), and it hinges on an external variable (Indigenous consent) that the committee does not currently possess.
