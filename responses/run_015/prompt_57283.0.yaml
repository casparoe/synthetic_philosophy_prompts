answer: |-
  **Bottom line**

  Adopt the **Principle of Narrative Fidelity**. An object commands full aesthetic regard only when its physical constitution supports a truthful narrative about its history of making. Interventions are legitimate if they preserve the continuity of an existing narrative (restoration, slow replacement) or honestly initiate a new one (pastiche). They are illegitimate if they simulate a narrative of agency that does not exist (forgery, deceptive studio practice, AI mimicry). This principle treats art not as a static sensory field but as a record of human action; when the record is falsified, the aesthetic relation is corrupted, regardless of sensory quality. You apply this by asking: Does the object's history truthfully explain its form, or does it lie about the source of its intention?

  **Clauses and their motives**

  1.  **The Truthfulness Clause:** Aesthetic standing collapses when the history of making is deceitful (Case 1). Failure condition: If the deception is discovered but the object remains beautiful, the principle demands you acknowledge the beauty is now compromised by the lie.
  2.  **The Transparency Clause:** Honest labeling restores standing by correcting the narrative (Case 2). Failure condition: If the label is removed, the object reverts to tainted status regardless of physical stability.
  3.  **The Conservation Clause:** Mimicry is virtuous when it serves to sustain the original narrative against entropy (Case 3). Failure condition: If the restoration exceeds what is necessary to stabilize the work, it becomes a new narrative (forgery).
  4.  **The Subordination Clause:** AI or mechanical mimicry is hollow because it appropriates style without sustaining the original agency (Case 4). Failure condition: If the AI output is treated as equal to human style, the principle declares a category error.
  5.  **The Historical Authorization Clause:** Delegated agency is valid only if historically constitutive of the work's identity (Case 5 vs. 9). Failure condition: Modern studio practice without historical precedent counts as deception, not tradition.
  6.  **The Continuity of Care Clause:** Material replacement is permissible if the rate allows the narrative of identity to remain unbroken (Case 6). Failure condition: Rapid reconstruction breaks the chain of care, creating a replica rather than a continuation.
  7.  **The Medium Specificity Clause:** Some arts survive attribution errors because their identity conditions are less tied to specific agency (Case 8). Failure condition: If the work relies on the author's specific voice (Shakespeare), re-attribution destroys the narrative.
  8.  **The Epistemic Clause:** Uncertainty degrades aesthetic intensity because the narrative is unstable (Case 10). Failure condition: Even if the object is physically pristine, doubt undermines the fidelity of the regard.

  **Rival principles**

  **1. The Sensory Autonomy Account.** This view holds that aesthetic value resides solely in perceptual properties. It saves Case 2 (pastiche is fine) and Case 7 (instrument copy is equal) cleanly. It also resolves Case 4 (AI art is valid if it looks good). However, it wrecks your verdict on Case 1 (the Van Meegeren should look the same) and Case 3 (restoration is irrelevant if invisible). It forces you to admit that your change in feeling upon discovering a forgery is merely psychological prejudice, not an aesthetic fact. The cost is eliminating the distinction between art and decoration; history becomes irrelevant gossip.

  **2. The Achievement Account.** Derived from Denis Dutton, this argues art is valued as evidence of human skill. Forgery wrongs because it lies about achievement. This saves Cases 1, 2, 3, and 4 perfectly. It explains why the Van Meegeren is worse (false achievement) and the Restorer is good (preserving evidence of achievement). However, it wrecks Case 5 (Studio Assistants). If art is evidence of *the master's* skill, a canvas painted mostly by assistants is largely a lie, yet you verdict it genuine. It also struggles with Case 9, potentially validating celebrity studios if the "skill" is conceptual direction, which dilutes the account.

  **3. The Institutional Designation View.** This holds that art status is conferred by the art world's acceptance. It saves Case 5 and Case 9 (both are accepted practices) and Case 8 (orchestras decide the Haydn survives). It explains why the Chapel (Case 6) might be accepted as the original by the town. However, it wrecks Case 1 and Case 4. If the market accepts the forgery or the AI print, this principle says they are aesthetically valid. It reduces your essay to a sociology of taste rather than a philosophy of value, stripping you of the normative ground to call the AI print "hollow."

  **The restorer and the generator**

  Cases 3 and 4 are indeed structurally similar: both involve style mimicry without original authorship. To separate them without special pleading, you must distinguish **Teleology of Agency**. The restorer's agency is *subordinative*; she effaces her own intention to reveal the original artist's intent. Her goal is ontological preservation. The generator's agency is *appropriative*; it uses the original artist's style as data to produce a new object. Its goal is ontological multiplication.

  If you concede no principle separates them, you must reverse your verdict on Case 3. You would have to admit the restorer is also a forger, merely a honest one. This predicts that all restoration is creative collaboration, diminishing the "authenticity" of the old master. The Tiepolo ceiling becomes a palimpsest of the master and the restorer. This is a coherent view (often held in modern conservation theory), but it contradicts your intuition that the ceiling is *more* itself after repair. To keep your verdict, you must maintain that the restorer acts as a *medium* for the past, while the generator acts as a *principal* in the present. The restorer serves the work; the generator uses the style.

  **Three cases you choose**

  1.  **Culinary Reconstruction:** A robot cooks a deceased chef's signature dish using the exact recipe and ingredients. Your principle verdicts this as **aesthetic fraud**. The narrative of agency is broken; the "hand" of the chef is missing. It is a copy, not the dish. This may feel unwelcome because food is ephemeral; we usually accept the recipe as the work.
  2.  **Software Refactoring:** Legacy code is rewritten by AI to function identically but with cleaner structure. Your principle verdicts this as **a new program**. The history of human problem-solving is lost. Developers often view this as maintenance; your principle calls it a replacement, devaluing the "original" codebase.
  3.  **Memorial Gardening:** A historic garden destroyed by fire is replanted with identical species in the exact layout. Your principle verdicts this as **a replica**, not the original garden (Case 6 logic). The continuity of biological growth was broken. Landscape architects often argue the design survives; your principle insists the living history is the art, not the plan.

  **What I have to give up**

  Your principle cannot fully reconcile Case 5 (Old Studio) and Case 9 (Celebrity Studio) without tension. Both involve delegated agency and signatures. To be consistent, you must either admit Case 5 was always inflation (the master's brand sold as his hand) or admit Case 9 is genuine (the celebrity's brand is the work).

  **Ranking of Cost:**
  1.  **Abandoning Case 5:** High cost. It undermines centuries of art historical cataloguing and the definition of "Rubens" or "Rembrandt."
  2.  **Abandoning Case 9:** Medium cost. It challenges the modern market but aligns with critical disdain for celebrity art.
  3.  **Abandoning Case 6 (Rate of Replacement):** Low cost. It is the most metaphysically shaky intuition.

  **Residual Tension:** If you keep both 5 and 9 distinct, you rely on **Historical Convention** rather than principle. You are saying old deception is tradition, new deception is fraud. This survives as a tension between *ontological truth* and *cultural habit*. You must acknowledge that your principle is normative (how we *should* value) but constrained by descriptive reality (how the market *does* value). The residual tension is that "Authorized Agency" is partly a fiction granted by time. You must accept that provenance is not just detecting truth, but managing the decay of truth over centuries.
