  4.  **Ranking the Defeaters:**

      1.  **The "Blind Trust" / No-Vyāpti Case (Fatal):** Cases where knowledge is gained without *any* grasp of reliability (even generic). If the subject has no inductive basis for trusting the speaker, it's not inference.
      2.  **The Causal vs. Justificatory Conflation (Fatal):** "She told me" identifies a cause, not a reason. Inference requires the latter.
