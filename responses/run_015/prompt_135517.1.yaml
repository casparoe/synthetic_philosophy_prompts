  8.  *(Final thought on the "Transparency" criterion)*: This is actually the weakest link in the user's armor. *Pramāṇa* theory is usually about the *instrument*, not the *meta-cognition* of the instrument. I need to hammer this. If I perceive a pot, I know "pot." I don't necessarily know "eyes + light + contact." If Transparency is the test, Perception might fail too.

