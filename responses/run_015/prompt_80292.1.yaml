  # JOINT STATEMENT ON THE STRUCTURE OF METAPHYSICAL GROUNDING
  **Prepared by the Fundamentality Realist and Anti-Fundamentalist Working Groups**

  ## I. AGREED CLAIMS
  *The following propositions represent the common ground established through adversarial collaboration. Both camps endorse these claims as the baseline for the ongoing debate.*

  1.  **The Nature of Grounding:** Both camps agree that "grounding" refers to a relation of non-causal metaphysical determination or explanation. If fact *A* grounds fact *B*, *A* explains *B* in virtue of reality's structure, not merely in virtue of our epistemic access to it.
  2.  **Distinctness from Causation:** Both camps agree that grounding is distinct from diachronic causation. Grounding concerns synchronic (or atemporal) dependence (e.g., the set {Socrates} is grounded in Socrates; the statue is grounded in the clay).
  3.  **Substantivity of the Debate:** Both camps agree that the dispute is not *merely* verbal. While terminology varies, the disagreement concerns the actual topological structure of reality (i.e., whether the dependency graph of facts terminates), not merely how we label nodes in that graph.
  4.  **Intelligibility of the Question:** Both camps agree that the question "Is there a fundamental level?" is meaningful. It is not a category error to ask whether grounding chains terminate or regress infinitely.
  5.  **Explanatory Role:** Both camps agree that the primary theoretical role of "fundamentality" is to secure metaphysical explanation. The debate is about *how* that explanation is secured (via a base vs. via an infinite chain).

  ***

  ## II. DISAGREEMENTS AND CRUXES
  *The following table isolates the precise points of divergence. For each disagreement, we identify the "Crux"—the specific sub-question or test case that, if resolved, would compel one side to revise their position.*

  | **Point of Disagreement** | **Fundamentality Realist (FR) Position** | **Anti-Fundamentalist (AF) Position** | **The Crux & Concrete Case** |
  | :--- | :--- | :--- | :--- |
  | **1. Well-Foundedness**<br>*(Must grounding chains terminate?)* | **Yes.** Grounding relations must be well-founded. There exists at least one fact that is ungrounded. An infinite regress of grounds is metaphysically vicious or incomplete. | **No.** Grounding relations need not terminate. An infinite, non-circular regress of grounds is metaphysically coherent and can provide complete explanation. | **Crux: The Viciousness of Regress.**<br><br>**Case: *The Turtle Tower.***<br>Imagine a world where every physical object rests on another physical object, ad infinitum (no bottom turtle, no space beneath).<br><br>**FR Prediction:** The tower floats. Without a bottom supporter, the whole structure lacks ontological support. The explanation is incomplete.<br>**AF Prediction:** The tower stands. Each turtle is supported by the one below it. No "bottom" is required for local support to aggregate to global stability. |
  | **2. The Status of 'Fundamental'**<br>*(Ontological kind vs. Pragmatic label)* | **Ontological.** "Fundamental" picks out a genuine, mind-independent feature of certain facts (the property of being ungrounded). It is a natural joint in reality's structure. | **Pragmatic/Relative.** "Fundamental" is an indexical or context-sensitive label for "the deepest layer currently under investigation." There is no property of *absolute* ungroundedness. | **Crux: The Theory-Dependence of the Base.**<br><br>**Case: *The Shifting Standard Model.***<br>Suppose physics posits Quarks as fundamental, then later finds they are composed of Strings, then later finds Strings are composed of Preons, ad infinitum.<br><br>**FR Prediction:** At least one of these theories is false. Reality *must* bottom out. If we keep finding deeper layers, we haven't found the *real* fundamental layer yet.<br>**AF Prediction:** All theories can be approximately true. "Fundamental" just means "deepest known." The endless discovery of deeper layers is consistent with reality's actual structure. |
  | **3. Acyclicity**<br>*(Can grounding be circular?)* | **Strictly Acyclic.** Grounding must be asymmetric and irreflexive. *A* cannot ground *B* if *B* (directly or indirectly) grounds *A*. Circularity voids explanation. | **Potentially Cyclic (Coherentist).** While linear regress is preferred by some AFs, mutual grounding is coherent. Holistic structures can be explanatory without a linear base. | **Crux: Mutual Dependence.**<br><br>**Case: *Laws and Dispositions.***<br>Do Laws of Nature ground the dispositions of objects, or do the dispositions of objects ground the Laws?<br><br>**FR Prediction:** One must ground the other. Either Laws are fundamental (Humean/Non-Humean split) or Dispositions are. They cannot ground each other.<br>**AF Prediction:** They can mutually ground each other. The system is explanatory as a holistic web, even if no linear priority exists between the two nodes. |

  ***

  ## III. ASSESSMENT OF VERBAL DISPUTE
  *Following the collaboration, we identify the following element as a likely verbal dispute that obscures the substantive disagreement:*

  **The Label "Fundamental"**
  There is significant overlap in how the two camps use the word "fundamental," which generates heat without light.
  *   **The Overlap:** Both sides agree that some facts are *more* fundamental than others (e.g., the micro-physical is more fundamental than the macro-physical). Both sides agree that we should seek deeper explanations.
  *   **The Verbal Dispute:** The Anti-Fundamentalists often use "fundamental" to mean *relatively* fundamental (fundamental relative to a specific domain or inquiry). The Realists use "fundamental" to mean *absolutely* fundamental (fundamental simpliciter).
  *   **Resolution:** If the Anti-Fundamentalists concede that "There are no absolutely ungrounded facts," and the Realists concede that "Relative fundamentality exists even if absolute fundamentality does not," the verbal confusion clears. However, the **substantive** disagreement remains regarding **Claim 1 (Well-Foundedness)**. Even if we stop using the word "fundamental," the Realist insists the chain of "in virtue of" relations must stop, and the Anti-Fundamentalist insists it need not.

  ## IV. NEXT STEPS FOR COLLABORATION
  To move forward, the study group recommends focusing exclusively on **Crux 1 (The Viciousness of Regress)**.
  *   **Task:** Construct a formal model of metaphysical explanation that functions without a base case.
  *   **Success Condition:** If the Anti-Fundamentalists can produce a model where an infinite chain provides *complete* explanation without remainder, the Realists agree to update toward Infinitism.
  *   **Failure Condition:** If the Realists can demonstrate that an infinite chain necessarily leaves the total existence of the chain itself unexplained, the Anti-Fundamentalists agree to update toward Foundationism.
