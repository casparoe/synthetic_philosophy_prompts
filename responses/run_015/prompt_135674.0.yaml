answer: |-
  Here is a design for **The Dubbing Game**. It is built to fit your 90-minute window, your material constraints, and your specific pedagogical goals. I have kept your two-round betting structure but tightened the payoff to prevent metagaming and ensure the "Necessary A Posteriori" cases are structurally guaranteed, not just hoped for.

  ### **The Core Mechanic: Stability vs. Warrant**

  Your intuition on the betting is sound, but to make it work without the forbidden vocabulary, we need to translate the axes into betting language.

  *   **Modal Axis (Necessary/Contingent):** Bet on **Stability**.
      *   *Stable:* "This claim holds in every nearby possible world."
      *   *Unstable:* "This claim could have been false."
  *   **Epistemic Axis (A Priori/A Posteriori):** Bet on **Warrant**.
      *   *Blind:* "I can verify this from the Dubbing text alone."
      *   *Seen:* "I need to open the Envelope (empirical fact) to verify this."

  **The Fix to Your Betting Idea:**
  The risk with participant-generated cases is that the "Correct Answer" becomes subjective. To fix this, participants generate the *content*, but they must select a **Logical Template** for each case. The Template dictates the metaphysical truth conditions (the "Key"), which you hold secret until the debrief. This ensures you actually get one Necessary A Posteriori case and one Contingent A Priori case, regardless of whether they write about Hesperus or a microservice architecture.

  ---

  ### **Materials (Black & White Printables)**

  You need one **Game Pack** per table (4 tables total). Each pack contains:

  1.  **4 Dubbing Cards** (Heavy cardstock, folded).
      *   *Outside:* The Template (with blanks to fill).
      *   *Inside:* The "Fact" (To be written by the creators, kept hidden).
  2.  **4 Betting Slips** (Per player).
      *   Two sections: **Round 1 (Sealed)** and **Round 2 (Open)**.
      *   Options for each: *Stable/Unstable* and *Blind/Seen*.
  3.  **Currency:** 20 tokens per player (coins, matchsticks, or just tally on a napkin).
  4.  **The Key** (For you, the GM). A small card listing the metaphysical status of each Template.

  #### **The Four Templates (Printed on the Dubbing Cards)**

  *   **Template Alpha (The Identity):**
      *   *Dubbing:* "Let **<NAME A>** name the object that is **<DESCRIPTION 1>**. Let **<NAME B>** name the object that is **<DESCRIPTION 2>**. Assume both names are rigid (they track the object across worlds)."
      *   *Fact (Inside):* "Object 1 is identical to Object 2."
      *   *Metaphysical Status:* Necessary A Posteriori.
  *   **Template Beta (The Stipulation):**
      *   *Dubbing:* "Let **<NAME>** name the object that is actually **<DESCRIPTION>** (pointing at it right now)."
      *   *Fact (Inside):* "The object is indeed **<DESCRIPTION>**."
      *   *Metaphysical Status:* Contingent A Priori.
  *   **Template Gamma (The Trenchcoat):**
      *   *Dubbing:* "Let **<NAME>** name the unique thing satisfying **<DESCRIPTION>**. If nothing satisfies it, name the thing the Committee *would have chosen*."
      *   *Fact (Inside):* "Nothing satisfies the Description. The Committee would have chosen X."
      *   *Metaphysical Status:* Contingent (Descriptivist intuition) vs. Necessary (if 'Committee choice' is rigid). *Designed to cause friction.*
  *   **Template Delta (The Fork):**
      *   *Dubbing:* "Name passed: Person A -> Person B -> Person C. Person B understood it as **<OBJECT 1>**. Person C understands it as **<OBJECT 2>**."
      *   *Fact (Inside):* "Object 1 and Object 2 are distinct."
      *   *Metaphysical Status:* Ambiguous Reference (Truth value gap or context-dependent).

  ---

  ### **Timeline (90 Minutes)**

  **00:00 – 00:10: Setup & The Ban**
  *   Distribute packs.
  *   **The Ban:** Write on the board/napkin: *Forbidden Words: Rigid, A Priori, A Posteriori, Necessary, Contingent, Analytic, Synthetic.*
  *   Explain the Betting:
      *   **Round 1 (Sealed):** Read only the *Dubbing* (Outside). Bet 2 tokens on Stability (Stable/Unstable) and Warrant (Blind/Seen). Fold slip, put in envelope.
      *   **Round 2 (Open):** Open the *Fact* (Inside). You may change your bet. Bet 1 token.
      *   **Payoff:** If your bet matches the **Template Key** (revealed at end), Round 1 pays 4 tokens, Round 2 pays 2 tokens. If wrong, you lose the stake.

  **00:10 – 00:30: The Drafting (Case Generation)**
  *   Groups of 3-4. They must fill in the blanks for all 4 Templates.
  *   **Constraint:** They cannot use proper names from philosophy or history (No Hesperus, No Nixon, No Metre Stick). They must use things from their domain (code, pub regulars, local landmarks, obscure philosophy examples).
  *   *GM Role:* Circulate. Ensure Template Alpha actually describes two descriptions that *could* pick out the same thing empirically. Ensure Template Beta involves a pointing/stipulative act.
  *   *Crucial:* They write the "Fact" on the inside and fold it. They do not know the Key yet.

  **00:30 – 00:35: The Swap**
  *   Tables swap packs. Table 1 gets Table 2's cases, etc.
  *   Players now face cases they did not write.

  **00:35 – 01:05: The Betting Rounds**
  *   **Round 1 (20 mins):** Players read the *Dubbing* side only. They discuss in small huddles (no loud lecturing). They fill out the Sealed Slip.
      *   *Pressure:* "If you think the Dubbing fixes the reference rigidly, bet Stable. If you think it's just a description, bet Unstable."
      *   Collect Sealed Slips in an envelope.
  *   **Round 2 (10 mins):** Players open the *Fact* inside the card. They can adjust their bets on a fresh slip (or overwrite).
      *   *Observation:* Watch for people changing from Stable to Unstable (or vice versa) just because they learned the empirical fact. This is the collapse you want to expose.

  **01:05 – 01:15: Scoring & The Reveal**
  *   Reveal the **Key**.
      *   Alpha = Stable + Seen (Necessary A Posteriori).
      *   Beta = Unstable + Blind (Contingent A Priori).
      *   Gamma = *Debatable* (See Debrief).
      *   Delta = *Debatable* (See Debrief).
  *   Quick tally of tokens. Winner gets first pint/round of crisps.

  **01:15 – 01:30: The Debrief**
  *   Map the game terms to Kripke.
  *   Address the specific friction points (Gamma & Delta).

  ---

  ### **Payoff Scheme**

  | Round | Stake | Payout (if Correct) | Net Gain |
  | :--- | :--- | :--- | :--- |
  | **1 (Sealed)** | 2 Tokens | 4 Tokens | +2 |
  | **2 (Open)** | 1 Token | 2 Tokens | +1 |

  *   **Why this works:** The marginal gain for Round 1 is higher. If they are confident the *Dubbing* fixes the modal status regardless of the *Fact*, they should bet heavy in Round 1. If they think the *Fact* determines the modality, they will wait for Round 2, capping their winnings. This financially penalises the descriptivist intuition (which waits for the fact to determine the truth conditions).

  ---

  ### **The Debrief Script (Mapping Play to Theory)**

  Do not lecture. Ask questions based on their betting slips.

  1.  **The Axes:**
      *   "Look at Template Alpha. Most of you bet **Seen** in Round 1. Why?" (Answer: We needed to know if the descriptions matched).
      *   "But in Round 2, did many of you switch from **Unstable** to **Stable**?"
      *   *The Point:* If you switched, you treated the *empirical fact* as deciding the *modal status*. Kripke says the *Dubbing* (Rigidity) decides the modal status. The Fact only decides the *truth*.
      *   *Translation:* Stable = Necessary. Unstable = Contingent. Blind = A Priori. Seen = A Posteriori.
      *   *Alpha* was Necessary A Posteriori. You knew it was true only after looking (Seen), but if the names are rigid, it couldn't have been otherwise (Stable).

  2.  **The Contingent A Priori (Template Beta):**
      *   "Who bet **Blind** on Beta?" (Everyone should have).
      *   "Who bet **Stable**?" (Descriptivists will).
      *   *The Point:* You knew it was true without looking (Blind/A Priori) because it was a stipulation. But could the object have been different? Yes. So it's Unstable (Contingent).

  3.  **The Disjunctive Dubbing (Template Gamma):**
      *   "This was the 'Trenchcoat'. If you bet **Stable**, you treated the 'Committee choice' as a rigid backstop. If you bet **Unstable**, you treated the Description as the real meaning."
      *   *Kripke's View:* This is likely a description in a trenchcoat. If the reference falls back to a description ("what we would have chosen"), the term is not rigid. It designates whatever fits the description in that world.
      *   *Lesson:* Rigidity isn't magic; it breaks if your fallback condition is descriptive.

  4.  **The Forked Chain (Template Delta):**
      *   "Did anyone find this impossible to bet on?"
      *   *The Point:* This models the social chain. If the chain forks, there is no single referent. Truth becomes relative to the speaker's chain, not the 'name' itself. This kills the idea that names have a timeless 'meaning' independent of use.

  ---

  ### **Troubleshooting: What Will Go Wrong**

  **1. The Metaphysics Lawyer**
  *   *Symptom:* One player (likely a grad student) argues during Round 1 that "Actually, if the description fails, the name refers to nothing, so the statement is false, not unstable."
  *   *Fix:* Intervene immediately. "For the purposes of this hand, play the intuition the Template suggests. We are testing the *structure*, not solving the ontology. Save the objection for the debrief."

  **2. The Payoff Metagamer**
  *   *Symptom:* A player realises Template Alpha *always* pays out on Stable/Seen and just bets that pattern without reading.
  *   *Fix:* Remind them that the *content* they wrote in the Drafting phase might have broken the logic. If they wrote "Let Name A be the Even Prime. Let Name B be the Odd Prime," the Fact inside says "False," breaking the identity. They must read the card. Also, vary the payout slightly in your head if you see blatant cheating (e.g., disqualify a hand).

  **3. The Fork Stalemate**
  *   *Symptom:* On Template Delta, the group refuses to bet because "It's ambiguous."
  *   *Fix:* Force a bet. "In the real world, communication happens. Bet on what *you* think the name designates in *your* mouth." This forces them to take a stance on externalism vs. internalism.

  **4. The Disjunctive Shrug**
  *   *Symptom:* "The Disjunctive one is just a description, obviously. Why are we betting?"
  *   *Fix:* This is a feature, not a bug. In the debrief, highlight this group. "You identified the trenchcoat. That means you recognise that not all 'dubbings' create rigid designators. Some are just complex descriptions."

  ---

  ### **Limitations: What This Game Cannot Do**

  Be honest with your group at the end.

  1.  **The "All Worlds" Problem:** The game only models "Stable" as "True in the scenarios we wrote down." It cannot reproduce the metaphysical weight of *all possible worlds*. You have to supply that verbal bridge in the debrief. The game creates the *intuition* of stability; you must supply the *ontology*.
  2.  **Rigidity is Binary, Reality is Fuzzy:** The game forces a Stable/Unstable choice. In reality, some terms are partially rigid or rigid only in certain contexts. The game simplifies this to make the point sharp.
  3.  **The "Hack" Feeling:** Some will still feel Necessary A Posteriori is a trick. The game won't cure this entirely. The cure is pointing out that *they* wrote the Alpha cases, and *they* felt the tension between "I needed to check" and "It couldn't be otherwise." The feeling of the hack comes from treating "Necessary" as "True by definition." The game forces them to see "Necessary" as "True by identity of objects."

  ### **Final Advice for the GM**

  *   **Keep Time Ruthlessly:** Use a phone timer. If Drafting overruns, cut the Debrief, not the Betting. The Betting is where the learning happens.
  *   **Don't Explain Too Early:** If they ask "Is Alpha necessary?", say "That's what you're betting on."
  *   **The "Forbidden Words" Rule:** If someone says "A Posteriori" during the betting, they pay a 1-token fine to the pot. This keeps the vocabulary fresh for the reveal.

  This design forces them to inhabit the structure of Kripke's argument without letting them hide behind the jargon. The money (or tokens) makes the collapse of the axes costly. Good luck.
