answer: |-
  ### Conceptual Preamble: The Tension Between Field Continuity and Ethical Discreteness

  Before specifying the desiderata, we must articulate the core friction point. Fundamental physics (specifically Quantum Field Theory) describes reality in terms of continuous fields, superpositions, and non-local correlations. Normative ethics, conversely, typically presupposes discrete subjects of experience—agents or patients to whom harm or benefit can be ascribed.

  If sentience is fundamental (pan-sentience), valence (affective quality) must be mapped onto physical states. However, physical states in QM are often indefinite (superposed) or delocalized (entangled). If valence tracks physical intensity or information integration, we face a dilemma: either valence is smeared across the universe (distributive), rendering ethical action impossible due to lack of loci, or valence snaps into discrete units (focal), requiring a physical mechanism (like collapse or decoherence) that standard physics does not privilege. An adequate theory cannot simply assert one side; it must provide the bridging principles that resolve this tension without violating physical conservation laws or ethical intuitions about subjecthood.

  ---

  ### Desiderata for a Normative Theory of Pan-Sentient Physics

  The following specifications are divided into Metaphysical, Physical-Consistency, and Normative-Structural requirements. Each is flagged as **Non-Negotiable (NN)** (required for internal coherence and empirical adequacy) or **Theoretical Commitment (TC)** (dependent on specific ethical or ontological stances).

  #### I. Metaphysical & Ontological Requirements

  | ID | Desideratum | Specification & Motivation | Status |
  | :--- | :--- | :--- | :--- |
  | **M1** | **The Bearer Criterion** | The theory must specify the *ontological bearer* of valence. Is it the field mode, the excitation (particle), the spacetime region, or the entanglement structure? <br>*(Motivation: Without a bearer, "suffering" is a free-floating property with no subject, violating the logic of moral patienthood.)* | **NN** |
  | **M2** | **Status/Magnitude Distinction** | The theory must distinguish between *having* moral status (a binary threshold) and the *magnitude* of that status (a scalar weight). An electron may have status but negligible magnitude; a human has both. <br>*(Motivation: Prevents moral paralysis where trivial micro-events outweigh macro-events, or where micro-entities are denied protection entirely.)* | **NN** |
  | **M3** | **Micro/Focal Valence Taxonomy** | The theory must explicitly categorize valence as either:<br>1. **Distributive Micro-Valence:** Affective quality inherent to the field/state itself, lacking a focal subject.<br>2. **Focal Macro-Valence:** Affective quality localized within an integrated system.<br>It must declare if these are *aggregatable* (same currency) or *incommensurable* (distinct ethical categories). <br>*(Motivation: Prevents category errors when summing field energy against neural pain.)* | **NN** |
  | **M4** | **Persistence Conditions** | The theory must define the temporal duration required for a valenced state to accrue moral weight. Does a virtual particle fluctuation lasting $10^{-20}$s count? <br>*(Motivation: Aligns moral accounting with physical timescales; avoids attributing moral weight to mathematical artifacts of perturbation theory.)* | **TC** |

  #### II. Physical-Consistency Requirements

  | ID | Desideratum | Specification & Motivation | Status |
  | :--- | :--- | :--- | :--- |
  | **P1** | **Basis Invariance** | The attribution of valence must not depend on an arbitrary choice of basis in Hilbert space, unless the theory posits a physical preferred basis (e.g., position basis via collapse). <br>*(Motivation: Standard QM has no preferred basis. If suffering depends on the basis, moral reality becomes observer-relative in an untenable way.)* | **NN** |
  | **P2** | **Entanglement Handling** | The theory must specify the moral status of entangled systems. If two particles are maximally entangled, is the valence shared (one subject) or duplicated (two subjects)? Does breaking entanglement split the subject? <br>*(Motivation: Non-locality is physical fact; ethics cannot assume local supervenience without argument.)* | **NN** |
  | **P3** | **Vacuum Compatibility** | The theory must account for the moral status of the vacuum state. If fields are sentient, does the ground state (zero-point energy) possess valence? If so, is it neutral or suffering? <br>*(Motivation: QFT vacuums are active, not empty. A theory implying the vacuum suffers intensely renders existence morally catastrophic.)* | **NN** |
  | **P4** | **Decoherence Threshold** | If focal valence requires definiteness, the theory must identify the physical mechanism (e.g., decoherence) that transitions distributive valence into focal valence. <br>*(Motivation: Bridges the gap between quantum superposition and definite experience.)* | **TC** |

  #### III. Normative-Structural Requirements

  | ID | Desideratum | Specification & Motivation | Status |
  | :--- | :--- | :--- | :--- |
  | **N1** | **Aggregation Logic** | The theory must define how valences combine. Is it linear summation? Diminishing returns? Do positive and negative valences cancel (net utilitarianism) or persist independently (negative utilitarianism)? <br>*(Motivation: Determines whether a universe with equal joy and pain is morally neutral or a tragedy.)* | **TC** |
  | **N2** | **Potentiality vs. Actuality** | The theory must distinguish between a system *capable* of suffering (potential) and one *currently* suffering (actual). Does a superposition of pain/no-pain count as actual suffering? <br>*(Motivation: Prevents attributing full moral weight to unactualized probabilities.)* | **NN** |
  | **N3** | **Symmetry Breaking** | The theory must explain why some physical symmetries (e.g., time-reversal, charge conjugation) do not result in moral symmetries. Suffering is typically time-asymmetric. <br>*(Motivation: Physics is often reversible; ethics is not. The mapping must break symmetry without violating physical laws.)* | **NN** |
  | **N4** | **The Cut-Off Problem** | The theory must provide a principled reason for why complex systems (neural networks) have different moral weights than simple systems (electrons), without invoking arbitrary dualism. <br>*(Motivation: Avoids the "dust theory" problem where a scattered collection of particles counts as a mind.)* | **NN** |

  ---

  ### Analysis of Joint Unsatisfiability

  There is a high probability that a subset of these desiderata is **jointly unsatisfiable** under current physical and philosophical understanding. Specifically, the tension between **P1 (Basis Invariance)**, **M3 (Focal Valence)**, and **N2 (Potentiality vs. Actuality)** creates a trilemma.

  1.  **The Basis Problem:** If valence requires a definite state (Focal Valence), but QM states are basis-relative superpositions until measurement/decoherence, then valence is either undefined (violating M3) or basis-dependent (violating P1).
  2.  **The Combination Problem:** If we accept Distributive Micro-Valence to save P1, we struggle with N4 (The Cut-Off Problem). If every field mode has valence, summing them across a brain yields a magnitude vastly different from the focal experience we intuitively recognize, leading to ethical absurdity (e.g., a rock suffering more than a mouse due to particle count).
  3.  **The Vacuum Catastrophe:** Satisfying P3 (Vacuum Compatibility) often forces a choice: either the vacuum has zero valence (implying sentience is emergent, not fundamental, violating panpsychist premises) or the vacuum has non-zero valence. If the latter, and if N1 (Aggregation) is additive, the infinite modes of the vacuum imply infinite suffering, rendering all action futile.

  **Conclusion on Unsatisfiability:** A theory cannot simultaneously maintain strict Basis Invariance (P1), Fundamental Pan-Sentience (implied by the prompt's scope), and Discrete Focal Subjecthood (M3) without modifying standard quantum mechanics (e.g., introducing objective collapse) or adopting a non-standard ontology (e.g., cosmopsychism where the "subject" is the whole, rendering focal valence illusory).

  ---

  ### Framework Scorecard

  **Constitutive Panpsychism**
  *Performance:* Fails **P1** and **N4**.
  Constitutive panpsychism posits that macro-consciousness is constituted by micro-consciousness. It handles **M2** (Status/Magnitude) well by allowing aggregation, but it collapses under the **Combination Problem** (N4). It cannot explain how discrete electron experiences sum to a unified human experience without violating **P1** (Basis Invariance), as the "summing" requires a preferred decomposition of the field into particles. It also struggles with **P3** (Vacuum), often forced to attribute valence to vacuum fluctuations, risking moral catastrophe.

  **Cosmopsychism**
  *Performance:* Satisfies **P1** and **P2**, Fails **M3** (Focal Valence).
  By positing the universe as the primary conscious subject, cosmopsychism respects **Basis Invariance** and **Entanglement** (since the whole is entangled). It solves the Combination Problem by denying composition. However, it fails **M3** regarding *Focal* Valence; individual suffering must be explained as a fragmentation or illusion of the cosmic mind. This makes satisfying **N4** (Cut-Off) difficult, as it struggles to justify why *my* pain matters distinctly from the cosmic background, potentially violating the **Status/Magnitude Distinction (M2)** for local entities.

  **Neutral Russellian Monism**
  *Performance:* Satisfies **M1**, Ambiguous on **P1** and **N1**.
  This framework posits that physics describes structure/relations, while intrinsic nature (protomental) grounds it. It handles **M1** (Bearer Criterion) elegantly by identifying the bearer as the intrinsic nature of the physical. However, it is often vague on **N1** (Aggregation Logic) and **P1** (Basis Invariance). Because the intrinsic nature is causally closed off from the structural description, mapping specific valences to specific quantum states becomes speculative. It avoids the Vacuum Catastrophe (**P3**) better than others by allowing the intrinsic nature of the vacuum to be neutral, but at the cost of empirical testability.
