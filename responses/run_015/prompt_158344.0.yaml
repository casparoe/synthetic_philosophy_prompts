  *   **Exam Technique Failure:** You answer 'Yes, it saves non-reductive physicalism' but you **fail to address the second half of the dichotomy**. You do not argue *why* it does not collapse into a dual-aspect view. A dual-aspect monist would argue that this 'bridge-linkage' is precisely what they propose: one substance with two inseparable aspects. By ignoring this alternative, you haven't fully answered the prompt.
