prompt: |-
  I work in operations for a mid-sized organisation and I have no formal training in philosophy, statistics or economics — I read about this material on my own. I am putting together a short internal talk, about twenty minutes for colleagues who are not specialists, on why the numbers on our dashboards stop meaning what they used to mean. I need one example that does a particular job, because every example I can find does the opposite job.

  What I am trying to isolate is the difference between two ways a proxy measure can come apart from the thing it was standing in for. In the first, people change what they do in order to move the number: the behaviour shifts, the number improves or degrades, and the underlying thing does not move with it. This is the version everyone knows, and every illustration I come across is a version of it — teachers drilling students for a standardised exam, support staff avoiding the difficult cases, and so on. In the second, nobody changes what they do and the underlying thing is flat or even improving, but the number still degrades, because what broke is the measurement rather than the behaviour: which cases get into the calculation at all, what gets written in a field, what a timestamp is taken to mean, how a missing value is handled. I want a pure case of the second kind, and not a case of the first kind wearing a disguise.

  Here is what the case has to do, all at once:

  It has to be ordinary — a hospital ward, a claims office, a housing repairs desk — and fit in one paragraph, with no science fiction and no AI systems in the story.

  The proxy has to have been a genuinely good proxy beforehand: chosen for real reasons, tracking the thing it stood for over years, so that the case is not simply about a number that was always junk.

  Nobody in the story may optimise against the number. They may not even know it is being used the way it is now used, or if they do, that knowledge must play no role in what they do. No one changes their conduct toward the underlying thing, and the underlying thing itself must be flat or getting better.

  Everyone must be acting in good faith, competently, and in line with rules someone else set. No fraud, no falsified records, no lies, no villain, and no one being unusually stupid or unusually corrupt — my colleagues will reject the example the moment the mechanism depends on bad character.

  And yet the case has to be a real instance of the law rather than an unrelated piece of drift: it must be the becoming-a-target that causes the degradation. If the same number had stayed a quiet background statistic, with everything else in the story identical, nothing should move. That is the constraint that makes this hard, since in most stories I can think of the degradation comes from someone responding to the incentive.

  The reported number should move in a way that looks like genuine deterioration — smooth, plausible, no visible break at the moment the incentive was switched on — so that anyone looking only at the dashboard would conclude that the underlying thing got worse.

  After the scenario, please show your work. Walk through each requirement and how the story meets it, including the counterfactual where the metric is left un-targeted. Then give me the diagnostic signature: what an auditor holding only the metric's time series would conclude, what someone checking on the ground would find, and which observable feature tells the two hypotheses apart. Tell me which single feature of the case is doing the work, and what happens to the example if I remove it — my guess is that letting anyone in the story adjust their behaviour collapses it straight back into the standard story, but I would like that argued rather than asserted. Finally, be honest with me about the objection I expect from the sceptics in the room: that this is not really the phenomenon at all but just measurement error with a narrative attached, that the law is about incentive responses and nothing else, and that my second category is a category of one. Is my distinction real, or am I cutting the pie in the wrong place?

  Please do not stipulate the verdicts; I want to see them fall out of the mechanism, and I need the language plain enough to say out loud to non-specialists.
reasoning: |-
  Here's a thinking process that leads to the suggested example and analysis:

  1.  **Analyze the Request:**

      *   **User:** Operations professional, mid-sized org, self-taught in philosophy/stats/econ.
      *   **Task:** Create a 20-minute internal talk example.
      *   **Core Problem:** Distinguish two types of proxy failure (Goodhart's Law variants).
          *   Type 1 (Standard): People game the metric (behavior changes, metric moves, reality doesn't).
          *   Type 2 (Target): *Nobody* games the metric, behavior stays same/improves, reality stays same/improves, *but* the metric degrades *because* it became a target.
      *   **Constraints:**
          *   Ordinary setting (hospital, claims, housing, etc.).
          *   One paragraph story.
          *   No AI, no sci-fi.
          *   Proxy was previously valid/good.
          *   No optimization/gaming by staff (good faith, competent, following rules).
          *   Causal link: The *act of targeting* must cause the degradation (counterfactual: if not targeted, metric stays accurate).
          *   Metric looks like genuine deterioration (smooth decline).
          *   Output requirements: The story, a walkthrough of requirements, the diagnostic signature (auditor vs. ground truth), the "single feature" doing the work, and an honest assessment of the skeptic's objection (is this distinction real?).

  2.  **Deconstruct the Core Philosophical/Statistical Problem:**

      *   The user is asking for a version of Goodhart's Law where the mechanism isn't *strategic response* (Lucas Critique style) but *measurement contamination* or *selection bias induced by attention*.
      *   Standard Goodhart: $Y = f(X) + \epsilon$. Target $Y$. Agents change $X$ to manipulate $Y$ without changing true outcome $Z$.
      *   User's Type 2: Target $Y$. Agents do *not* change $X$. True outcome $Z$ is stable. But the relationship $Y \approx Z$ breaks *because* $Y$ is now being measured/reported/used differently, even if the data entry itself isn't falsified.
      *   *Challenge:* If the data entry doesn't change and behavior doesn't change, why does the number change?
      *   *Potential Mechanism:* **Campbell's Law / Measurement Reactivity via Process Friction.** When a metric becomes a target, the *process* of capturing that metric often gets tightened, audited, or routed differently, even if the frontline worker doesn't change their core task.
      *   *Alternative Mechanism:* **Selection Bias via Triage.** If a metric becomes a target for *management*, management might change *what gets measured* without telling frontline staff to change *what they do*.
      *   *Alternative Mechanism:* **The "Denominator" Effect.** If the target is a rate (e.g., resolution time), and becoming a target causes *more* edge cases to be formally logged (which were previously ignored), the average time goes up, even if speed on individual cases is constant.
      *   *Selected Mechanism:* **The "Formalization of the Informal" (Measurement Creep).** When a metric is casual, people only record the "clean" cases. When it becomes a KPI, compliance requires recording *everything*, including the messy cases that drag the average down. The workers aren't working slower; they are just counting the slow stuff now because the *rule for counting* tightened as a consequence of the metric becoming important.

  3.  **Drafting the Scenario (Iterative Process):**

      *   *Attempt 1 (Hospital Wait Times):* Doctors stop taking complex cases. -> *Reject:* This is Type 1 (gaming).
      *   *Attempt 2 (Call Center):* Agents hang up to lower handle time. -> *Reject:* Type 1.
      *   *Attempt 3 (Housing Repairs):* A housing association tracks "Days to Fix Heating." Previously, tenants called the handyman directly. Handyman fixed it, wrote it in a notebook. Management didn't see the notebook. Average was 2 days. Now, Management makes it a KPI. They require a digital ticket for *every* job. Tenants who previously asked for a "quick look" now have to log a formal ticket. The "quick looks" (0.5 days) get mixed with the "broken boiler" (5 days). The average goes to 3 days. The handyman works the same speed.
      *   *Critique 3:* Did the tenants change behavior? Yes, they log tickets now. Is that "gaming"? No, it's compliance. Does it fit "Nobody changes what they do"? The handyman doesn't. The tenant does. Need to tighten this so the *staff* behavior is the focus.
      *   *Refinement:* Focus on the *intake* process. The metric is "Percentage of Claims Processed Within 48 Hours."
      *   *Scenario:* A claims office. Historically, simple claims were processed fast; complex ones sat. The metric "Avg Processing Time" was tracked loosely. Staff processed claims as they came. When it became a strict KPI, Compliance said: "To measure this accurately, you must log the 'Received' timestamp exactly when the mail arrives, not when you open it." Previously, staff opened mail, sorted it, and logged the easy ones immediately, leaving hard ones in the pile (effectively starting the clock later). Now, *all* mail is logged immediately upon arrival. The "hard" claims now have a longer recorded duration because the clock starts earlier for them. The staff processes them at the same speed. The metric worsens.
      *   *Check against constraints:*
          *   Ordinary? Yes.
          *   Good proxy before? Yes, tracked reality well enough.
          *   No optimization? Staff follows new logging rule, doesn't speed up or slow down work.
          *   Good faith? Yes, Compliance wants accuracy.
          *   Causal link? If not a target, Compliance doesn't tighten the timestamp rule.
          *   Smooth decline? Yes, as new rule phases in.

      *   *Refining the "Target" aspect:* Why did the rule change? Because the number became a target, Leadership demanded "Data Integrity." The demand for integrity changed the *definition* of the start time.
      *   *Wait, is this just measurement error?* The user anticipates this objection. I need to make sure the *act of targeting* drove the definition change.
      *   *Better Angle:* **The "Completeness" Trap.**
      *   *Scenario:* **Municipal Pothole Repair.**
      *   *Metric:* "Average Days to Repair Reported Pothole."
      *   *Before:* Citizens called in. If it looked small, the dispatcher might say "We'll get to it," but often small ones were fixed during routine sweeps without a formal ticket. Only big, angry-citizen potholes got formal tickets. Average time: 3 days.
      *   *Targeting:* City Council makes this a public KPI.
      *   *Change:* To ensure "Accountability," the rule changes: *Every* repair job, even routine sweep fixes, must have a ticket logged against it.
      *   *Result:* The crew fixes potholes at the same speed. But now the dataset includes hundreds of "routine sweep" potholes that previously weren't counted. These routine ones often sit in the queue longer before a sweep happens (e.g., 10 days). The "Angry Citizen" ones are still fixed in 3 days. The *mix* changes. The average drifts to 8 days.
      *   *Constraint Check:* Did staff change behavior? No, they fix potholes same speed. Did they game? No. Did the underlying reality (road quality/speed) change? No. Did the metric degrade? Yes. Why? Because targeting caused the *net* to widen (measurement boundary shift).
      *   *Is this "Measurement Error"?* It's a change in the *population* being measured, driven by the decision to target the metric.
      *   *Is it Type 1?* No, no one is sandbagging.
      *   *Is it Type 2?* Yes. The metric broke because it became important enough to warrant "better" (more comprehensive) measurement, which paradoxically made the number look worse.

      *   *Wait, one constraint:* "If the same number had stayed a quiet background statistic... nothing should move."
      *   If it stayed quiet, we wouldn't have mandated tickets for routine sweeps. So the counterfactual holds.
      *   *One Paragraph:* Need to be concise.

  4.  **Developing the Analysis:**

      *   **Walkthrough:** Map the story to the 7 constraints.
      *   **Diagnostic Signature:**
          *   Auditor (Time Series): Sees degradation. Concludes performance drop.
          *   Ground Truth: Sees same speed, same roads.
          *   Differentiator: The *composition* of the queue (Ticket Type).
      *   **Single Feature:** The *boundary of inclusion* (what counts as a data point).
      *   **Skeptic's Objection:** "This is just redefining the metric. That's not Goodhart's Law, that's just changing the ruler."
      *   **Rebuttal:** Goodhart's Law is about the *relationship* between measure and goal breaking under pressure. Usually, we assume the break is strategic (Type 1). This shows the break can be *bureaucratic/structural* (Type 2). The pressure causes the definition to tighten, which breaks the historical baseline. It is a distinct category: **Reification Bias.**

  5.  **Refining the Story for Maximum Clarity:**

      *   Let's use a **Hospital Discharge** example. It's relatable.
      *   *Metric:* "Average Length of Stay (LOS)."
      *   *Before:* Doctors discharged patients when ready. Admin logged discharge time loosely (end of shift).
      *   *Target:* Hospital admin makes LOS a key performance indicator for efficiency.
      *   *Change:* To "ensure accuracy," Finance requires discharge time to be logged at the *exact minute* the doctor signs the order, not when the patient physically leaves or the shift ends.
      *   *Wait, that would improve the number (shorter stay).* I need the number to degrade (get worse).
      *   *Reverse it:* Metric is "Time from Admission to First Treatment."
      *   *Before:* Triage nurse logged treatment time when they had a moment. Often logged retrospectively. Missed the small delays.
      *   *Target:* Becomes a KPI.
      *   *Change:* System forces a timestamp scan at the moment of contact.
      *   *Result:* Previously, minor delays (getting a glove, finding a pen) weren't captured. Now they are. The "treatment time" includes the prep time now. The number goes up. Doctors work same speed.
      *   *Critique:* This feels like "measurement error correction."
      *   *Let's go back to the Pothole/Claims "Denominator" idea. It's stronger.*
      *   *Scenario:* **Insurance Claim "Cycle Time".**
      *   *Story:* For years, the claims team tracked "Average Days to Close." Adjusters closed simple claims fast; complex ones lingered. The average was stable. When Leadership made it a bonus target, they didn't tell adjusters to work faster. Instead, Audit said, "We can't trust the average if open claims aren't counted right." They mandated that *all* inquiries, even those previously treated as "informational" and not opened as formal claims, must now be logged as "Open Claims" to track volume. Adjusters still answer phones at the same speed. But now the "Average Days to Close" includes hundreds of "informational" queries that sit open while waiting for the customer to send a form. These weren't in the data before. The average cycle time balloons. The adjusters haven't slowed down. The customers haven't changed. The metric broke because it became important enough to demand "complete" data.

      *   *Refining for the "No Behavior Change" constraint:* The adjusters are following a new rule (log everything). Is that behavior change? Technically yes, but it's *compliance*, not *optimization*. They aren't trying to move the number. They are trying to follow the new data rule. The prompt says "Nobody in the story may optimise against the number... No one changes their conduct toward the underlying thing." Logging the ticket is administrative, not conduct toward the *claim resolution*.
      *   *Let's try to make it even more passive.*
      *   *Scenario:* **Server Uptime / Ticket Resolution.**
      *   *Actually, let's stick to the "Definition Tightening" via Compliance.*
      *   *Selected:* **The "Clean Data" Trap in a Call Center.**
      *   *Metric:* "First Contact Resolution (FCR) Rate."
      *   *Before:* Agents marked a ticket "Resolved" if they felt they helped. Sometimes they marked it resolved even if they had to call back later, just to clear the queue. The number was 85%. Reality was okay.
      *   *Target:* Management makes FCR a primary KPI.
      *   *Change:* To prevent "gaming" (ironically), IT locks the field. An agent cannot mark "Resolved" until the system detects no inbound call from that customer for 7 days.
      *   *Result:* Agents do the exact same work. They solve the same problems. But now, customers who call back with a *new, unrelated* question within 7 days accidentally invalidate the "Resolved" status of the first ticket. Or, the system simply waits 7 days to close the ticket. The "Resolution Time" metric (if we use time) or FCR rate drops.
      *   *Wait, I need the number to degrade (look worse).*
      *   *Let's go with the "Inclusion of Edge Cases" (Pothole style). It's the cleanest.*

      *   *Final Polish of the Story:* **Municipal Housing Repairs.**
      *   *Metric:* "Average Days to Complete Repair."
      *   *Context:* Tenants call a hotline.
      *   *Before:* Dispatchers used discretion. If a tenant said "my door sticks," they were told "we'll add it to the next sweep." No ticket opened. If they said "door is broken off," ticket opened. Only formal tickets counted in the average. Average: 4 days.
      *   *Target:* Council makes "Repair Speed" a public target.
      *   *Change:* To ensure "Fairness and Transparency," policy changes: *Every* request, including "add to sweep," must generate a ticket immediately.
      *   *Result:* Maintenance crews work at the same pace. But "sweep" items (low priority) now sit in the "Open" queue for weeks before the sweep happens. "Emergency" items still fixed in 4 days. The *average* of all tickets drifts to 12 days.
      *   *Why fits:* No gaming. Staff follows new fairness rule. Reality (speed of repair) unchanged. Metric degrades. Counterfactual: If not a target, no "Fairness" policy, small jobs stay off the books, average stays 4 days.

  6.  **Addressing the Skeptic's Objection:**

      *   This is the hardest part. The skeptic will say: "You just changed the definition of the metric. That's not Goodhart's Law, that's just changing the metric."
      *   *Counter:* Goodhart's Law states "When a measure becomes a target, it ceases to be a good measure." It does not specify *mechanism*. The standard view assumes the mechanism is *agent optimization*. This example shows the mechanism can be *systemic reification*. The pressure to justify the target leads to "better" measurement which breaks the historical correlation. It is a distinct category: **Measurement Reactivity without Strategic Response.**
      *   *Honesty:* I must admit this is rare. Most of the time, it *is* gaming. But this specific case exists in bureaucracy where "Process Integrity" is the response to "Target Pressure."

  7.  **Final Review against Constraints:**

      *   Ordinary? Yes (Housing).
      *   One paragraph? Yes.
      *   Good proxy before? Yes (tracked the urgent stuff well).
      *   No optimization? Yes (crew works same, dispatchers follow new rule).
      *   Good faith? Yes (Fairness/Transparency).
      *   Causal link? Yes (Target -> Policy Change -> Data Mix).
      *   Smooth decline? Yes (as new tickets accumulate).
      *   Show work/Diagnostics/Single Feature/Skeptic? All planned.

  8.  **Drafting the Response:** (Self-Correction during drafting)
      *   Make sure the "One Paragraph" is distinct.
      *   Ensure the "Show Your Work" section is rigorous.
      *   Be very careful with the "Skeptic" section. Don't overclaim. Admit that this is often a precursor to Type 1, but stands alone in the short term.

      *(Self-Correction on the "Single Feature"):* The single feature is the **expansion of the denominator** driven by **compliance**, not **performance**.
      *(Self-Correction on the "Skeptic"):* The skeptic is half-right. This is often called "metric contamination." But the user's point is that it's not *strategic*. I need to validate their distinction while acknowledging the overlap.

      *(Refining the Story for "Smoothness"):* If the policy changes overnight, the number jumps. The prompt asks for "smooth, plausible, no visible break."
      *   *Fix:* The policy is phased in, or the "sweep" items naturally accumulate. Or, better: The *reporting* changes.
      *   *Better Fix:* The metric is "Percentage of Calls Answered in 30 Seconds."
      *   *Story:* Call center. Metric was tracked internally. Agents worked naturally. When it became a public target, Management didn't pressure agents. Instead, they upgraded the phone system to "ensure accurate reporting." The new system starts the timer when the call *hits the server*, not when it *rings at the desk*. Previously, network latency (2-5 seconds) was hidden. Now it's counted. The metric degrades smoothly as old calls roll off and new calls accumulate. Agents talk same speed.
      *   *Critique:* Is this just "measurement error"? Yes. Is it caused by targeting? Yes (upgrade bought to monitor target).
      *   *Let's stick to the Housing "Denominator" one.* It feels more operational. To make it smooth: The new rule applies to *new* requests. As the queue fills with "sweep" requests, the average drifts.

      *Wait, one more check:* "If the same number had stayed a quiet background statistic... nothing should move."
      *   If it stayed quiet, we wouldn't have mandated tickets for sweeps. Correct.
      *   "Nobody changes their conduct toward the underlying thing."
      *   Dispatchers change conduct (they log tickets now). Is "logging" conduct toward the "repair"? No, it's administrative. The *repair* conduct (maintenance crew) is unchanged. The *tenant* conduct is unchanged. This holds.

      *Let's write it.*
answer: |-
  ### The Scenario

  For five years, the City Housing Authority tracked "Average Days to Repair" using data from its formal work-order system. Historically, dispatchers used discretion: urgent issues (no heat, broken locks) became formal tickets immediately; minor issues (sticking windows, loose handles) were noted verbally and added to a monthly "maintenance sweep," never entering the system. The metric reliably tracked urgent repair speed, hovering at four days. When the City Council made "Repair Speed" a public performance target, the Director did not pressure the maintenance crews to work faster. Instead, to ensure "transparency and fairness," she mandated that *every* tenant request, including minor sweep items, must now generate a formal ticket upon intake. The maintenance crews continued working at their established pace, fixing urgent items in four days and sweep items during the monthly round. However, because the hundreds of minor requests now sat in the "open" queue for weeks waiting for the sweep, they were included in the average. Over six months, the reported "Average Days to Repair" drifted smoothly from four days to eighteen. The underlying service speed did not change, no one gamed the system, and the data was more complete than ever, yet the dashboard indicated a catastrophic collapse in performance.

  ***

  ### Show Your Work

  Here is how the story meets your constraints:

  1.  **Ordinary & Concise:** It takes place in a standard municipal housing office, requires no technology beyond a database, and fits in one paragraph.
  2.  **Valid Proxy:** The metric was not junk; for five years, it accurately reflected the speed of *urgent* repairs, which was the operational reality that mattered to tenants.
  3.  **No Optimization:** The maintenance crews did not slow down. The dispatchers did not hide tickets (in fact, they created more). No one acted to manipulate the number for personal gain.
  4.  **Good Faith:** The Director's decision was rational: if a metric is a public target, the data should be comprehensive. This is a standard compliance response, not corruption.
  5.  **Causal Link (The Counterfactual):** If "Repair Speed" had remained a quiet internal statistic, there would have been no political pressure for "transparency." The discretion to exclude sweep items would have remained. The average would have stayed at four days. The degradation was caused *specifically* by the decision to elevate the metric.
  6.  **Smooth Deterioration:** The number did not jump overnight. As new "sweep" tickets entered the queue and aged while waiting for the monthly round, they mathematically pulled the average up over time. It looks like a gradual performance decline.
  7.  **Reality Flat/Improving:** The actual time to fix a broken lock remained four days. The actual time to fix a sticking window remained "next sweep." The service level was constant.

  ***

  ### The Diagnostic Signature

  If an auditor looks **only at the time series**, they will conclude that operational efficiency has collapsed. The curve slopes downward (or upward, depending on axis) consistently. There are no outliers, no spikes, just a steady drift. They will recommend process reviews, staffing increases, or training interventions.

  If someone checks **on the ground**, they will find maintenance vans running the same routes, crews arriving at the same times, and tenants reporting the same satisfaction with urgent fixes. They will find a backlog of "open" tickets that are not actually waiting for labor, but waiting for a scheduled cycle.

  **The Observable Feature that separates the two:**
  Look at the **distribution of ticket ages**, not the average.
  *   **Hypothesis 1 (Performance Drop):** You will see *all* tickets aging. Urgent tickets will start taking 10 days, then 15. The whole curve shifts.
  *   **Hypothesis 2 (Measurement Creep):** You will see a **bimodal distribution**. One peak of tickets closes at 4 days (urgent), and a second, growing peak of tickets closes at 30 days (sweep). The *average* moves because the *weight* of the second peak increases, not because the first peak shifts.

  ***

  ### The Single Feature Doing the Work

  The mechanism driving this is **Boundary Expansion via Compliance**.

  In standard Goodhart's Law (Type 1), the agent changes the *process* to fit the measure (e.g., ignoring hard cases). In this case (Type 2), the organization changes the *boundary of the measure* to fit the process, believing this creates accuracy.

  If you remove this feature—if you allow the dispatchers to continue using discretion and excluding sweep items—the metric remains stable. If you remove the *target status*, the mandate for comprehensive data disappears, discretion returns, and the number reverts to four days.

  You are correct that if anyone in the story adjusted their behavior *to move the number* (e.g., if dispatchers started logging urgent repairs as sweep items to lower the average), it would collapse back into Type 1. The distinction holds only so long as the behavior change is **procedural** (how we count) rather than **strategic** (how we work). The moment the maintenance crew starts delaying urgent repairs to batch them with sweeps *because* they know it helps the average, you are back in Type 1. In this story, they batch because that is the scheduled workflow, not because of the metric.

  ***

  ### The Skeptic's Objection

  You should expect a knowledgeable colleague to raise this objection:

  > *"This isn't a new category of Goodhart's Law. This is just measurement error. You changed the definition of the metric from 'Time to Fix Urgent Issues' to 'Time to Fix All Issues.' Of course the number changed. That's not the measure breaking under pressure; that's you swapping the ruler."*

  **Is this objection valid?**
  Partially. Strictly speaking, if the definition changes, it is a new metric. However, in operational reality, the dashboard label did not change. It still said "Average Days to Repair." The *semantic* meaning remained constant to the viewer, even if the *statistical* population shifted.

  **Is your distinction real?**
  Yes, but it is fragile. This is not "Measurement Error" in the sense of a broken sensor; it is **Reification Bias**. When a metric becomes a target, organizations often feel compelled to make the measurement more "robust" or "comprehensive" to defend the target. This robustness often destroys the historical baseline.

  Standard Goodhart's Law assumes the metric is fixed and the world moves. Your second category identifies when the *metric itself moves* because it became important, even if the world stays still.

  **The Verdict:**
  You are not cutting the pie in the wrong place, but you are slicing a very thin crust. Most of the time, Type 2 quickly turns into Type 1 (once staff see the number worsening, they will start gaming it). But for the initial period you are describing, the distinction is real. It isolates **bureaucratic reflex** from **strategic response**. It is a valuable distinction for your talk because it warns leaders that even *honest* attempts to improve data integrity when targeting a metric can destroy the metric's value.
