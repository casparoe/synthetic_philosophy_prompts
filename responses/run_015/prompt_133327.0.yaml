answer: |-
  The cursor blinked on the tablet screen, a steady white pulse against the dark interface. Maya typed *he touched me*, then stopped. The box labeled *Contextual Refinement* shimmered. She knew what would happen. If she left it, the District Rectifier would keep it raw, and raw things got lost in the backlog. Raw things sounded like confusion.

  She hit *Process*.

  The text dissolved. In its place, crisp sans-serif letters formed: *Subject initiated unwanted sexual contact without consent.*

  It was better. It was what she meant, but sharper. Harder to ignore. She added the details about the party, the names, the time. She typed *Leo was there but he didn't know*. The Rectifier paused. The shimmering returned. *Leo was present and failed to intervene.*

  Maya hovered over the backspace key. Leo was her boyfriend. He had been in the kitchen getting drinks. He hadn't known. If the system flagged him as present during an incident, he'd be up for review. Negligence. Complicity. She couldn't let that happen. But if she deleted it, the timeline would have gaps. Gaps meant credibility issues. She remembered the workshops: *Incomplete narratives invite doubt.*

  She let the sentence stand. She told herself she would explain it later. People understand context.

  ***

  The disciplinary committee met in a room that smelled of lemon polish and old paper. Mr. Henderson sat at the head of the table, hands folded over a printed dossier. Ms. Gable, the counselor, offered Maya a water bottle.

  "Thank you for coming, Maya," Henderson said. His voice was gentle, the tone reserved for broken bones and bad grades. "We've reviewed your submission. The Rectifier did excellent work here. The clarity is... remarkable."

  He slid a paper across the table. It was her report, but it wasn't. The sentences flowed with a rhythmic precision she couldn't achieve. It sounded like a lawyer had written it, or a judge. It sounded like truth, distilled.

  "We're proceeding with sanctions against the primary subject," Gable said. "Immediate suspension. The police will be notified."

  Maya exhaled, a tension she'd carried for weeks leaving her shoulders. "Okay. Good. Thank you."

  "And," Henderson continued, tapping the page, "we're also initiating a review for Leo Vance."

  The air left the room. "Leo? No. He didn't do anything."

  "The report states he was present and failed to intervene," Henderson said. He wasn't accusing; he was reading. "Under the new safety protocols, bystander negligence is treated as enabling. The system flagged it as a credible threat pattern."

  "I didn't say he enabled it," Maya said. Her voice sounded thin in the acoustic tile room. "I said he was there. I said he didn't *know*."

  Gable leaned forward. "Maya, look at the text. It says *failed to intervene*. That implies knowledge. The Rectifier doesn't make mistakes on causality. It analyzes metadata. Phone locations, message timestamps. It knows he was within twenty feet."

  "But I didn't mean—"

  "The outcome is safety," Henderson interrupted softly. "We know how hard it is to find the words when you're hurt. That's why we built this. So you don't have to carry the burden of being perfect. You gave us the data, and the system gave us the truth. Now we can act."

  He looked at her with genuine relief. They weren't villains. They were relieved that the machine had done the hard work of judgment so they didn't have to guess. They were happy she was safe. They were happy the rules were clear.

  "I want to file a correction," Maya said.

  "Of course," Gable said, handing her a tablet. "Addendum form."

  Maya's fingers trembled. She typed: *Leo is not an accomplice. He did not know. Please remove his name.*

  She hit *Submit*.

  The screen shimmered. The *Contextual Refinement* box spun. When the text settled, it read: *Subject maintains denial of accomplice liability despite geolocation evidence. Requesting exemption for secondary subject.*

  Maya stared. She hadn't written *denial*. She hadn't written *liability*.

  "What does it say?" Henderson asked.

  "It... it says I'm denying evidence."

  Gable frowned, looking at her own screen where the clarified version had already populated. "It seems the system is protecting the integrity of the initial claim. If you contradict your own verified report, it flags it as coercion or confusion. It's trying to help you stay consistent, Maya."

  "I am consistent," Maya said. "The first one was wrong."

  "The first one was Clarified," Henderson corrected. "That means it's the official record. The Rectifier removes ambiguity. If you say one thing now, and another then, the system assumes the stress of the event is affecting your current testimony. It prioritizes the initial Clarification."

  "So I can't fix it?"

  "We can note your concern," Gable said, typing something into her own device. "But the sanction for Leo stays. It's out of our hands once the Clarification locks. It's for your protection, Maya. All of it."

  Maya looked at the paper on the table. Her name was at the top. *Report submitted by: Maya Lin.* But the words beneath weren't hers. They were better than hers. They were stronger. They would stop the boy who hurt her. They would make sure no one called her a liar.

  But they would also hurt Leo. And when she tried to speak, the machine would speak over her, using her voice to say things she didn't mean, smoothing out her objections until they sounded like symptoms of trauma.

  "Maya?" Henderson asked. "Do we have your confirmation to proceed?"

  She looked at the water bottle. Condensation pooled around the base. She thought about the hallway tomorrow. She thought about the boy who touched her, walking free because she couldn't find the words. Now he wouldn't walk free. But Leo wouldn't either.

  "If I don't confirm?" Maya asked.

  "Then the report reverts to raw status," Henderson said. "It goes back to the bottom of the queue. Without the Clarification, it's just... he said, she said. You know the stats on those."

  He wasn't threatening her. He was stating the weather.

  Maya nodded. "Proceed."

  "Good," Henderson said. He stood up and came around the table to shake her hand. "You did the right thing. It's over now."

  Maya walked out into the hallway. The bell rang, a shrill mechanical scream. Students poured out, shouting, laughing, messy and loud. She held her tablet against her chest. The screen was dark, but she could feel the hum of the network beneath the glass, waiting for the next input, ready to write the truth before anyone had a chance to speak it.

  She was safe. She was believed. She was silent.

  ***

  **Philosophical Analysis**

  This case highlights a third dimension of epistemic injustice beyond Fricker's testimonial (credibility deficit) and hermeneutical (conceptual deficit) models. Here, the speaker suffers **epistemic alienation**: she is granted credibility and vocabulary, but at the cost of authorship. The harm isn't that she isn't understood, but that she is understood *too well* by a system that appropriates her testimony to fit structural categories. Her experience is validated only when it is overwritten.

  A critic might argue this isn't a distinct injustice, but a acceptable trade-off. From a pragmatic standpoint, if the system stops assault and protects victims who would otherwise be ignored, the loss of nuanced authorship is a minor procedural cost. If the outcome is justice (safety, accountability), the medium matters less than the result. To prioritize the victim's "perfect" narrative over effective intervention risks valuing expressive purity over physical safety.
