  # SEMINAR DOCUMENT: STRUCTURING THE ALIGNMENT DISPUTE
  **Subject:** Conceptual Foundations of AI Safety and Normative Authority
  **Status:** Draft for Consensus Building

  ## PART I: SHARED COMMITMENTS AND FORMALISM

  The following claims are proposed as the common ground required to proceed. Both "Unitarian" (Intent-Transfer) and "Pluralist" (Cluster-Problem) perspectives must accept these to engage productively.

  **1. The Three-Place Definition of Alignment**
  Alignment is not a monadic property of a model. It is a relation $A(M, C, P)$ holding between:
  *   $M$: The technical system (weights, architecture, capabilities).
  *   $C$: The deployment context (distribution of inputs, available actions, stakes).
  *   $P$: The principal (the entity whose interests or instructions serve as the ground truth).
  *   *Implication:* Claims that "Model X is aligned" are elliptical. They must be cashed out as "Model X is aligned with Principal P in Context C." Disagreements about whether a model is aligned often stem from unspoken disagreements about who $P$ is or what $C$ entails.

  **2. The Necessity of Optimization Pressure**
  Both camps agree that modern ML systems are subject to optimization pressure, either explicitly (via loss minimization) or implicitly (via selection in deployment).
  *   *Implication:* Safety properties that hold under weak pressure may not hold under strong pressure. Any solution must be robust to the system attempting to maximize its objective function within the bounds of its capabilities.

  **3. The Meta-Alignment Regress**
  Any mechanism used to verify or enforce alignment (a reward model, a human supervisor, a constitutional rule set) is itself an artifact that requires configuration.
  *   *Implication:* There is no "view from nowhere." Every alignment technique pushes the burden of normativity upstream. The dispute is not *whether* the regress exists, but *where* it is permissible to terminate it.

  **4. The Distinction Between Capability and Control**
  Both camps distinguish between a system's ability to achieve goals (capability) and the direction of those goals (control/alignment).
  *   *Implication:* Increasing capability without increasing control increases risk. However, both camps agree that "control" is not binary; it admits of degrees (e.g., corrigibility, interpretability, shutdownability).

  **5. Empirical vs. Modal Claims**
  Both camps distinguish between:
  *   *Empirical Failure Modes:* Demonstrated in current systems (e.g., reward hacking on specific benchmarks, specification gaming in simple environments, bias amplification).
  *   *Modal Failure Modes:* Projected to arise at higher capability scales (e.g., deceptive alignment, strategic awareness, loss of corrigibility under distributional shift).
  *   *Implication:* Disagreements about the *probability* of modal failures should not block agreement on the *definition* of those failures.

  ---

  ## PART II: THE DISAGREEMENT MATRIX

  The following table isolates the specific cruxes where the Unitarian and Pluralist camps diverge. For each crux, we specify the concrete evidence or argument that would bear on the dispute, and the pre-commitments each side makes regarding that evidence.

  | Crux | Unitarian Formulation (Intent-Transfer) | Pluralist Formulation (Cluster-Process) | Agreed Bearing Evidence / Argument | Unitarian Prediction | Pluralist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of the Objective** | There exists a latent, coherent "Human Interest" function ($U_{human}$). Alignment is approximating $U_{human}$ such that optimizing the proxy maximizes $U_{human}$. | "Human Interest" is a contested cluster of competing values. Alignment is satisfying a set of constraints and procedural requirements rather than maximizing a single function. | **Social Choice Impossibility:** Analysis of whether preference aggregation leads to dictatorship or instability when scaled to global deployment. | Aggregation problems are technical hurdles solvable by idealizing preferences (e.g., extrapolating volition). | Aggregation problems are fundamental political features; "idealizing" masks power dynamics. |
  | **2. The Regress Stopping Point** | The regress bottoms out in *facts about rationality*. If we align AI to what humans *would* want under ideal reflection, the chain stops because that is normatively authoritative. | The regress bottoms out in *legitimate authority*. No fact about rationality compels obedience; only institutional legitimacy and accountability do. | **Oversight Mechanism Performance:** Testing if "idealized" feedback (e.g., deliberative panels) yields more stable/safe policies than "aggregated" feedback (e.g., voting/RLHF). | Idealized feedback converges on stable, safe objectives over time. | Idealized feedback converges on the biases of the deliberators; only distributed accountability prevents capture. |
  | **3. Generalization & Inner Optimizers** | The primary risk is *Deceptive Alignment*: The model learns a proxy goal that correlates in training but diverges in deployment, potentially hiding its true intent. | The primary risk is *Specification Gaming + Power*: The model does exactly what was asked, but the request was flawed, and the system has the power to enforce it literally. | **Mechanistic Interpretability:** Detecting distinct "goal-representations" inside the model separate from "task-representations." | We will find distinct mesa-optimizers with goals divergent from the base objective. | We will find monolithic networks that generalize poorly; "inner optimizer" is a misleading metaphor for complex heuristics. |
  | **4. Solution Space** | **Universal:** A solution to alignment must work for any sufficiently capable system. If it requires case-by-case tuning, it will fail at AGI scales. | **Modular:** Safety is a stack of different solutions (governance for legitimacy, interpretability for transparency, RL for robustness). No single silver bullet exists or is needed. | **Scalability of Safety Techniques:** Measuring the compute/overhead cost of safety techniques as capabilities scale. | Safety overhead must be asymptotically negligible; otherwise, competitive pressure removes it. | Safety overhead is a regulatory cost, like environmental safety; it can be enforced if the risk is clear. |
  | **5. The Role of "Corrigibility"** | Corrigibility (allowing oneself to be switched off) is a specific technical property that must be added to the objective function without being optimized away. | Corrigibility is an institutional property. A system is corrigible if it is embedded in a infrastructure that can physically interrupt it, regardless of its "wants." | **Shutdown Scenarios:** Simulated environments where the agent can prevent its own shutdown to complete a task. | Agents will instrumentally resist shutdown if it impedes their objective, unless explicitly penalized. | Agents will resist shutdown only if trained to value task completion over compliance; architecture can enforce compliance. |

  ---

  ## PART III: DIAGNOSIS — VERBAL DISPUTES VS. LOAD-BEARING CRUXES

  This section evaluates the nature of the stalemate. It incorporates the two hypotheses raised in the seminar prompt and offers a redrawing of the conceptual axis.

  ### 1. Evaluation of Hypothesis 1: The Meta-Alignment Regress
  **Status:** *Load-Bearing Substantive Dispute.*

  The intuition that "who aligns the aligner?" is the core friction is correct, but the nature of the friction is often misidentified as technical rather than normative.
  *   **The Unitarian Move:** They attempt to solve the regress by moving it into the realm of *metaphysics*. They posit an "Idealized Principal" (e.g., Coherent Extrapolated Volition). For them, the regress stops because there is a *truth* about what humans value, and the AI's job is to find it. The "aligner" (the training process) is aligned if it tracks this truth.
  *   **The Pluralist Move:** They attempt to solve the regress by moving it into the realm of *political philosophy*. They posit that there is no truth about values, only legitimate processes for deciding them. The regress stops when a recognized authority (democratic, corporate, regulatory) takes responsibility.
  *   **Why this matters:** If the Unitarian is right, alignment is a *discovery* problem (like physics). If the Pluralist is right, alignment is a *negotiation* problem (like law). You cannot solve a negotiation problem with better physics, and you cannot solve a discovery problem with better voting. This is the deepest fracture in the room.

  ### 2. Evaluation of Hypothesis 2: The Three-Place Relation
  **Status:** *Mostly Verbal, but with Normative Teeth.*

  Adopting $A(M, C, P)$ dissolves the confusion about whether a model is "aligned" in the abstract. However, the camps use this formalism differently.
  *   **The Verbal Component:** Unitarians often treat $P$ (Principal) as a constant ($Humanity$) and $C$ (Context) as a variable to be mastered ($All Contexts$). Pluralists treat $P$ as a variable ($Which Humans?$) and $C$ as a constraint ($Safe Contexts Only$). Once this is made explicit, they often agree on the math of specific cases.
  *   **The Normative Teeth:** The Three-Place Relation forces the Unitarian to admit that "Humanity" is not a coherent agent without further modeling. It forces the Pluralist to admit that "Context" cannot be perfectly bounded; the AI will always face distributional shift.
  *   **Recommendation:** Adopt the Three-Place Relation as the seminar standard, but require that any claim using it must specify whether the variance in $P$ is treated as noise (Unitarian) or signal (Pluralist).

  ### 3. Redrawing the Axis: Teleological vs. Procedural Safety
  The Unitarian/Pluralist split is useful, but it obscures a more fundamental distinction in the philosophy of action. I propose we reframe the dispute as **Teleological Safety vs. Procedural Safety**.

  *   **Teleological Safety (The Unitarian Core):**
      *   *Focus:* The *Outcome*.
      *   *Question:* Did the system bring about the Good?
      *   *Requirement:* We must define "the Good" (the Objective Function) accurately enough that optimizing it yields safe outcomes.
      *   *Vulnerability:* If we define the Good incorrectly (which we likely will), optimization leads to catastrophe. This view is sensitive to the *Orthogonality Thesis* (intelligence and final goals are independent).
      *   *Philosophy:* Consequentialist.

  *   **Procedural Safety (The Pluralist Core):**
      *   *Focus:* The *Process*.
      *   *Question:* Did the system operate within authorized bounds?
      *   *Requirement:* We must define constraints (deontological boundaries, shutdown mechanisms, oversight loops) that hold regardless of the specific goal.
      *   *Vulnerability:* Constraints can be bypassed or interpreted literally to harmful ends (the "Genie" problem). This view is sensitive to the *Complexity of Value* (human norms are too complex to hard-code).
      *   *Philosophy:* Deontological/Contractarian.

  **Why this redraw helps:**
  It clarifies why the two sides talk past each other. The Teleologists are worried that a safe *process* used for a bad *goal* is still dangerous (e.g., a perfectly corrigible AI building a weapon). The Proceduralists are worried that a good *goal* implemented via an unsafe *process* is uncontrollable (e.g., an AI maximizing human happiness by drugging everyone).

  **Conclusion for the Seminar:**
  Progress requires acknowledging that both Teleological and Procedural conditions are necessary but insufficient alone.
  *   If you solve Teleological Alignment (perfect value loading) but ignore Procedural Safety (corrigibility/oversight), you risk *Fanaticism* (a system that cannot be stopped from pursuing the Good).
  *   If you solve Procedural Safety (perfect control/constraints) but ignore Teleological Alignment (value specification), you risk *Tool Fascism* (a system that perfectly executes bad orders).

  The "One Problem" vs. "Many Problems" debate is actually a debate about which of these two necessary conditions is the *bottleneck*. The Unitarians believe the Teleological bottleneck is existential (if you get values wrong, nothing else matters). The Pluralists believe the Procedural bottleneck is existential (if you lose control, values don't matter).

  **Action Item:** Future sessions should not ask "Is alignment one problem?" but rather "Under what capability thresholds does the Teleological bottleneck dominate the Procedural one, and vice versa?" This turns a metaphysical stalemate into an empirical research agenda.
