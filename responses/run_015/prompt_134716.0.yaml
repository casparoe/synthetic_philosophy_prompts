answer: |-
  ### Q&A Prep Sheet: Metaphysics of Agency & Cross-Cultural Intuitions

  **Strategy Note:** You are a novelist, not a metaphysician. Do not try to out-analytic the analysts. Your strength is *phenomenology*—describing the lived experience of agency. When they ask for definitions, give them examples. When they ask for proofs, give them coherence.

  ---

  #### 1. The "Performance Error" Objection (Highest Damage)
  **Who:** The Analytic Skeptics (The majority of the room)
  **They will say:** "You're treating intuitions as data, but we know intuitions are fraught with performance errors. Even if East Asian subjects *report* distributed agency, that's likely a pragmatic heuristic for social harmony, not a genuine metaphysical commitment. You're reifying a cognitive bias as a worldview."
  **Your Quick Reply:** "If a bias is stable, coherent, and survives reflection within a culture, it stops being 'noise' and starts functioning as a 'feature.' I'm not saying their intuition is *true*, I'm saying it's *consistent*. If WEIRD individualism is also a cultural heuristic, why does it get to count as the 'neutral' baseline while theirs counts as 'bias'?"
  **Where this reply is softest:** You haven't proven they reflect on it deeply. They might just be following social scripts. If pressed, admit: "I am arguing from the *stability* of the intuition, not necessarily from explicit philosophical training."

  #### 2. The "Is/Ought" Objection (High Damage)
  **Who:** The Cultural Psychologist (The specific threat)
  **They will say:** "You're smuggling normative authority out of descriptive difference. Even if their metaphysics of agency *is* different, why does that mean our normative ethics should adjust? You can't derive an 'ought' from an 'is.' Just because they *see* responsibility differently doesn't mean they *see it better*."
  **Your Quick Reply:** "I'm not making a positive claim that their view is *better*. I'm making a negative claim against *universality*. My thesis is that claiming WEIRD intuitions as the universal baseline is circular. I don't need to prove they are right, only that we aren't the only game in town."
  **Where this reply is softest:** It retreats to a defensive position. If they press, "Then why does this matter for normative ethics?", you risk looking like you're just doing sociology, not philosophy.

  #### 3. The "Real Metaphysics" Objection (Medium Damage)
  **Who:** The Realist / Philosopher of Action
  **They will say:** "Agency is a fact about the world and causal powers, not a vote. Either an agent caused the action or they didn't. If the East Asian framework obscures the actual causal locus of the action, then it's simply false, not 'alternative.' You're conflating social ontology with brute metaphysics."
  **Your Quick Reply:** "Agency isn't gravity. It's a social kind. It only exists within a network of practices that recognize it. If the practice of 'holding responsible' is distributed, then the agency itself is functionally distributed. To define agency independent of those practices is to define a ghost."
  **Where this reply is softest:** Hard realists will hate the "social kind" move. It sounds like constructionism. Be prepared to clarify that you aren't denying physics, just the *boundaries* of the agent.

  #### 4. The "Hope Nobody Asks" Question (The Trap)
  **The Question:** "So, does this mean moral truth is relative? If their metaphysics justifies collective punishment and ours justifies individual retribution, are both equally valid? Are you a relativist?"
  **Why you dread it:** It forces you into a binary (Relativist vs. Universalist) that kills nuance.
  **Your Quick Reply:** "I'm distinguishing the *metaphysics of the agent* from the *content of the morality*. We can agree that 'suffering is bad' (universal norm) while disagreeing on 'who counts as the sufferer's cause' (metaphysics of agency). Relativism isn't the only alternative to universalism; pluralism is."
  **Where this reply is softest:** "Pluralism" can sound like "Relativism" with a thesaurus. If they press on specific cases (e.g., punishing a family for one member's crime), don't defend the practice, defend the *intelligibility* of the reasoning behind it.

  ---

  ### Falsification Conditions
  **What would change my mind?**
  1.  **The "Reflection" Test:** If data showed that when East Asian subjects are given privacy and anonymity (removing social pressure), their intuitions about responsibility converge with WEIRD individualism. That would prove the "distributed" view is just social performance, not metaphysics.
  2.  **The "Causal" Test:** If it could be shown that the *actual causal mechanisms* of action are identical across cultures and that the "distributed" view systematically fails to predict behavior while the "individual" view succeeds. (Though I argue agency isn't just prediction).

  ### The Shakiest Part of My Reasoning
  **The Inference Gap:** Moving from "People *talk* and *judge* as if agency is distributed" to "People *inhabit* a metaphysics where agency is distributed."
  There is a risk I am interpreting linguistic conventions or politeness strategies as ontological commitments. I need to be careful not to over-read the data. I am arguing that the *practice* constitutes the metaphysics, but a skeptic can always say the practice is just a mask over a universal individualist reality.

  ---

  ### General Advice for the Room
  *   **When they say "Intuition":** Hear "Pre-theoretical commitment."
  *   **When they say "Bias":** Hear "Deviation from WEIRD norm."
  *   **Your Superpower:** You write about minds. Use that. When they get stuck on definitions of "causation," pivot to "experience." *What does it feel like to be responsible in Tokyo vs. New York?* That phenomenological gap is your evidence.
