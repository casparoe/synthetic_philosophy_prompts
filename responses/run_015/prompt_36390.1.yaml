prompt: |-
  I'm a senior analyst at a national body that decides which health services get publicly funded. We have informally adopted a policy of giving priority to the worse off — benefits to more disadvantaged patients count for more than equal benefits to better-off ones — but we have no worked-out method, and committee members keep disputing particular cases on instinct. Please write a decision procedure my team can actually run on a funding proposal.

  Context: we make roughly ten of these decisions a year, each involving thousands of patients and significant budgets. An analyst has about two weeks per case, with QALY-style effectiveness estimates and subgroup data, but no way of making fine-grained interpersonal utility comparisons. Final sign-off is by a mixed committee of clinicians, economists, and lay members, so every step must be explainable to a non-theorist in a paragraph.

  The procedure should cover, in order: how to characterize the relevant sense of "worse off," including when current condition, lifetime health prospects, and socioeconomic position point in different directions and which controls; how to set the priority weights, and how to report the recommendations that flip as the weights vary; an explicit leveling-down test — what the procedure should say about a policy that benefits no one but narrows the gap between groups, and whether prioritarianism has any principled basis for rejecting it; and the points at which the questions stop being technical and must go to the committee as questions of values.

  Then run the procedure on three cases: (1) a drug extending life by a few months for patients with a severe progressive condition, competing against a mental-health program with a larger total benefit spread across many mildly affected people; (2) a case where following the procedure's own weights yields a recommendation I will dislike — a small benefit to the very worst off purchased at a very large cost in aggregate health — and the procedure must show how it handles that rather than hiding it; and (3) a rationing rule that withholds a service from the better-off group without extending it to anyone, which is pure leveling-down.

  You are a professional philosopher specializing in distributive justice, with experience translating theory for health priority-setting bodies. Before writing anything, brainstorm which distinctions from the prioritarianism literature must survive the simplification — e.g., prioritarianism's reason for rejecting leveling-down versus the objection's usual use against egalitarianism — and which can safely be dropped. Mark honestly wherever the procedure cannot settle the matter. Answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in distributive justice, experienced in health priority-setting.
      *   **Client:** Senior analyst at a national funding body.
      *   **Problem:** Informal policy of prioritizing the "worse off" exists, but no method. Committee disputes cases based on instinct.
      *   **Constraints:**
          *   ~10 decisions/year, high stakes (budget/patients).
          *   Analyst time: ~2 weeks/case.
          *   Data: QALY-style estimates, subgroup data. *No* fine-grained interpersonal utility comparisons.
          *   Audience: Mixed committee (clinicians, economists, lay). Must be explainable in a paragraph per step.
          *   Language: American English.
      *   **Required Content:**
          1.  Characterize "worse off" (current vs. lifetime vs. SES, conflicts).
          2.  Set priority weights & report sensitivity analysis (when recommendations flip).
          3.  Explicit leveling-down test (rejecting policies that benefit no one).
          4.  Identify value judgments vs. technical questions.
          5.  Run the procedure on three specific cases (Severe vs. Mild, Counter-intuitive Prioritarian Result, Pure Leveling-Down).
      *   **Pre-writing Task:** Brainstorm philosophical distinctions (what to keep vs. drop) regarding prioritarianism vs. egalitarianism.

  2.  **Philosophical Brainstorming & Simplification:**
      *   *Core Tension:* Prioritarianism (benefits to worse off count more *because* they are worse off) vs. Egalitarianism (inequality is bad *in itself*).
      *   *Leveling Down Objection:* Egalitarianism struggles here (if equality is good, making everyone worse but equal is *pro tanto* good). Prioritarianism avoids this (no benefit = no value). *Must keep this distinction.* It's crucial for the "leveling-down test" requirement.
      *   *Metric of Disadvantage:* Health vs. Socioeconomic Status (SES). Health priority setting usually focuses on health (QALYs), but "worse off" often implies SES. *Decision:* Focus primarily on *health prospect* (lifetime QALYs) as the core metric, with SES as a tie-breaker or modifier, to keep it tractable for analysts. Mixing them too deeply creates measurement hell.
      *   *Weights:* How to assign weights? A concave transformation function (Prioritarianism) is the theoretical standard. For practice, we need a simple "equity weight" multiplier.
      *   *Interpersonal Comparisons:* The prompt says "no way of making fine-grained interpersonal utility comparisons." This rules out strict utilitarianism based on subjective happiness. We must rely on objective health metrics (QALYs) adjusted by status.
      *   *Simplification:* Drop complex social welfare functions. Drop distinction between ex-ante and ex-post prioritarianism (too technical for lay members). Keep the core intuition: *Weight = f(Disadvantage)*.
      *   *Honesty:* Acknowledge where the math stops and values begin (e.g., *how much* more the worse off matter).

  3.  **Drafting the Decision Procedure (The "Equity-Weighted Cost-Effectiveness Protocol"):**
      *   *Step 1: Define "Worse Off".* Needs to be operational. Lifetime health expectancy is the standard prioritarian metric. Current health is too snapshot. SES is relevant but secondary to the health mandate.
      *   *Step 2: Weighting.* Need a parameter (let's call it $\alpha$ or just "Equity Weight"). Since we can't fix one number, we use sensitivity analysis.
      *   *Step 3: Leveling Down.* Explicit rule: If $\Delta$Health $\le 0$ for everyone, Reject. This codifies the prioritarian rejection of leveling down.
      *   *Step 4: Value Boundaries.* Clearly mark where the committee must vote (the weight value).

  4.  **Developing the Three Test Cases:**
      *   *Case 1 (Severe vs. Mild):* Classic severity vs. efficiency trade-off. The procedure should show how a high enough weight flips the decision from the mental health program (more total QALYs) to the severe drug (fewer QALYs but weighted higher).
      *   *Case 2 (The "Unpleasant" Result):* Needs to show the cost of prioritarianism. A tiny benefit to the very worst off at huge cost to the aggregate. The procedure must flag this as "Efficiency Loss" and force the committee to own the trade-off.
      *   *Case 3 (Leveling Down):* Withholding treatment from better-off without helping worse-off. The procedure must automatically reject this based on the Leveling-Down Test.

  5.  **Refining the Tone and Structure:**
      *   Tone: Professional, precise, philosophical but accessible.
      *   Structure:
          1.  Philosophical Preamble (The Brainstorming).
          2.  The Procedure (Steps 1-4).
          3.  Application to Cases (1-3).
          4.  Closing Advice.
      *   Constraint Check: "Explainable to a non-theorist in a paragraph." I need to ensure the *steps* have these summaries.

  6.  **Self-Correction/Iterative Thinking during Drafting:**
      *   *Critique:* Is "Lifetime Health" too hard to measure?
      *   *Fix:* Acknowledge data limitations. Use "Expected Remaining Lifetime QALYs" as the proxy.
      *   *Critique:* How do we set weights without arbitrary numbers?
      *   *Fix:* Use a "Threshold Range." Analyst provides the break-even point. Committee decides if they are willing to pay that premium.
      *   *Critique:* Case 2 needs to be stark.
      *   *Fix:* Make the cost per weighted QALY astronomical compared to the standard threshold.
      *   *Critique:* Ensure the distinction between Prioritarianism and Egalitarianism is clear in the preamble.
      *   *Fix:* Explicitly state that we care about *benefiting* the worse off, not just *equalizing*.

  7.  **Final Polish:**
      *   Check American English spelling (prioritization, program, etc.).
      *   Ensure the "honesty" requirement is met (marking where the procedure stops).
      *   Verify the "paragraph explainability" constraint for the committee steps.

  8.  *(Final Review against Prompt)*: Did I cover the characterization of worse off? Yes. Weights? Yes. Leveling down? Yes. Value boundaries? Yes. Three cases? Yes. Brainstorming section? Yes.

  Let's write.
answer: |-
  ### Part 1: Philosophical Preamble & Simplification Strategy

  Before presenting the procedure, I must be transparent about the theoretical machinery we are keeping and what we are discarding to make this operational for your analysts and committee.

  **Distinctions to Keep:**
  1.  **Prioritarianism vs. Egalitarianism:** This is the most critical distinction. Egalitarianism values equality *for its own sake*. Prioritarianism values benefiting people *because* they are worse off. We must adopt the Prioritarian view. Why? Because it inherently passes the "Leveling-Down Objection." If a policy makes the worse off no better but brings the better off down to their level, Egalitarianism must admit this is *in one way* good (more equal). Prioritarianism correctly identifies this as valueless because no one is benefited. Your procedure must hard-code this rejection.
  2.  **The Metric of Disadvantage:** We must distinguish between *current health state* and *lifetime health prospects*. A young person with a chronic condition may have a worse lifetime prospect than an elderly person with an acute injury, even if their current pain scores are identical. Prioritarianism is generally concerned with lifetime well-being prospects. We will use "Expected Remaining Lifetime QALYs" as the primary proxy.
  3.  **The Trade-Off Parameter:** We cannot mathematically derive the "correct" weight for the worse off. That is a moral value, not a technical fact. The procedure must isolate this variable so the committee owns it.

  **Distinctions to Drop:**
  1.  **Ex-Ante vs. Ex-Post Prioritarianism:** This debate concerns whether we weight based on expected outcomes before treatment or actual outcomes after. Given your data constraints (subgroup averages), this distinction is too granular. We will treat subgroup averages as the relevant unit.
  2.  **Socioeconomic Status (SES) vs. Health:** Ideally, "worse off" includes SES. However, mixing health and wealth metrics creates incommensurability problems your analysts cannot solve in two weeks. We will prioritize *health disadvantage* as the primary metric, allowing SES only as a tie-breaker. This keeps the mandate focused on health system justice.
  3.  **Fine-Grained Utility:** We cannot measure subjective happiness. We must rely on the QALY as the common currency, acknowledging it is an imperfect proxy for well-being.

  ***

  ### Part 2: The Equity-Weighted Priority Procedure (EWPP)

  This procedure is designed to be completed by a senior analyst within ten working days. It produces a "Decision Package" for the committee.

  #### Step 1: Characterize the "Worse Off" Baseline
  **Technical Task:** Calculate the "Expected Remaining Lifetime QALYs" (ERLQ) for the untreated population in each subgroup. If data is unavailable, use age-standardized life expectancy adjusted for the condition's severity.
  **Conflict Rule:** If Current Health and Lifetime Prospects conflict (e.g., a temporary severe injury vs. a mild chronic degenerative disease), prioritize **Lifetime Prospects**. If Lifetime Prospects are equal, use **Socioeconomic Status** (e.g., income quintile) as a tie-breaker.
  **Committee Explanation:** *We define "worse off" not by who is in the most pain today, but by who has the poorest health outlook over their remaining life. This ensures we prioritize those with the greatest long-term burden of illness, using socioeconomic disadvantage only to break ties when health prospects are identical.*

  #### Step 2: Calculate Weighted Benefit
  **Technical Task:**
  1.  Calculate total unweighted QALYs gained for each proposal ($\Sigma Q$).
  2.  Assign an "Equity Weight" ($w$) to each subgroup based on their ERLQ rank. The worse off group receives $w > 1$; the better off receives $w = 1$.
  3.  Calculate Weighted QALYs: $\Sigma (Q \times w)$.
  4.  Determine the "Break-Even Weight": Calculate the specific weight at which the funding recommendation flips from the efficient option (highest unweighted QALYs) to the equitable option (highest weighted QALYs).
  **Committee Explanation:** *We apply a multiplier to health gains achieved for the worse off. We do not fix this multiplier ourselves; instead, we calculate exactly how much extra value the committee must place on the worse off to justify choosing the less efficient program. This turns a moral intuition into a visible trade-off ratio.*

  #### Step 3: The Leveling-Down Test
  **Technical Task:** Check the $\Delta$QALY (change in health) for every affected subgroup.
  **Rule:** If $\Delta$QALY $\le 0$ for all subgroups, the proposal is **Automatically Rejected**, regardless of inequality reduction.
  **Committee Explanation:** *A policy that harms or helps no one, even if it narrows the gap between rich and poor, generates no moral value in this framework. We prioritize benefiting the disadvantaged, not merely punishing the advantaged. Any proposal that reduces total health without helping the worst off fails this test immediately.*

  #### Step 4: Identify the Value Boundary
  **Technical Task:** Compare the "Break-Even Weight" from Step 2 against the organization's implicit historical thresholds. Flag any recommendation that requires a weight implying a cost-per-QALY significantly above standard benchmarks.
  **Rule:** If the recommendation relies on a weight that implies an extreme sacrifice of total health, mark this as a **Value Judgment Required**.
  **Committee Explanation:** *The analysis can show the cost of fairness, but it cannot decide if that cost is worth paying. When the equity weight required to fund a program implies sacrificing a large amount of total population health, the final decision reverts to the committee as a matter of social values, not technical efficiency.*

  ***

  ### Part 3: Application to Test Cases

  Here is how the EWPP handles the three scenarios you provided.

  #### Case 1: Severe Progressive Condition vs. Mental Health Program
  *   **Scenario:** Drug A gives 500 QALYs to 100 patients with very low lifetime health prospects (ERLQ = 5). Program B gives 800 QALYs to 1,000 patients with moderate prospects (ERLQ = 15).
  *   **Unweighted:** Program B wins (800 > 500).
  *   **Step 1 (Baseline):** Group A is significantly "worse off" by lifetime prospects.
  *   **Step 2 (Weights):** To make Drug A win, we solve for $w$: $500 \times w > 800 \times 1$. The Break-Even Weight is $w = 1.6$.
  *   **Step 4 (Boundary):** The analyst reports: *"Program B produces more total health. However, if the committee values a QALY for Group A at least 1.6 times more than a QALY for Group B, Drug A is preferred."*
  *   **Outcome:** The committee does not dispute on instinct. They vote on whether a 60% premium for severity is acceptable. The procedure transforms a moral dispute into a clear parameter vote.

  #### Case 2: The "Unpleasant" Prioritarian Result
  *   **Scenario:** Intervention X gives a tiny benefit (10 QALYs) to the absolute worst-off group (ERLQ = 2). Intervention Y gives a massive benefit (1,000 QALYs) to a moderately off group (ERLQ = 10). Budget is fixed; funding X precludes Y.
  *   **Unweighted:** Intervention Y wins overwhelmingly (1,000 vs 10).
  *   **Step 2 (Weights):** To make Intervention X win, we solve: $10 \times w > 1,000 \times 1$. The Break-Even Weight is $w = 100$.
  *   **Step 4 (Boundary):** The analyst flags this. *"Prioritizing the worst-off here requires valuing their health gains 100 times higher than the moderate group. This implies sacrificing 990 QALYs of population health to secure 10 QALYs for the very worst off."*
  *   **Outcome:** The procedure does *not* hide this. It forces the committee to acknowledge that strict prioritarianism can demand catastrophic efficiency losses. If the committee rejects X, they are not abandoning the "worse off" policy; they are acknowledging that the *degree* of priority has a limit. The procedure exposes the cost of the principle rather than obscuring it in rhetoric.

  #### Case 3: Pure Leveling-Down (Rationing Rule)
  *   **Scenario:** A proposal to withhold a life-extending treatment from Group B (better off) to save money, without extending that treatment to Group A (worse off). This reduces inequality but helps no one.
  *   **Step 3 (Leveling-Down Test):** $\Delta$QALY for Group A = 0. $\Delta$QALY for Group B = Negative.
  *   **Outcome:** **Automatic Rejection.**
  *   **Rationale:** The procedure explicitly blocks this. Even if a committee member argues, "It's fairer that no one gets it rather than only the rich," the EWPP rules this out of order. It clarifies that the body's mandate is *health improvement with priority*, not *equality at the expense of health*. This prevents the committee from sliding into egalitarianism that harms the aggregate.

  ***

  ### Part 4: Limitations & Value Boundaries

  As a philosopher advising this body, I must mark where the procedure ends and politics begins.

  1.  **The Weight Value:** The procedure calculates the *break-even* weight, but it cannot tell you the *correct* weight. Is 1.6 too high? Is 100 too high? That is a political-moral question for the committee. The analyst provides the price of fairness; the committee decides if they can afford it.
  2.  **The Metric of "Worse Off":** We have prioritized Lifetime Health over SES. If the committee believes poverty itself constitutes a disadvantage warranting priority independent of health prospects, the procedure cannot capture that without new data mandates.
  3.  **Threshold Effects:** The procedure assumes linear weighting within groups. It does not handle "catastrophic" thresholds (e.g., falling below a minimum capability floor) unless you instruct the analyst to apply a step-function weight.

  **Final Advice:**
  Adopt this procedure not as a calculator that spits out "Yes/No," but as a **discipline for disagreement**. When committee members dispute a case, ask them: *"What equity weight are you implicitly using?"* If they cannot state a weight they would apply consistently to other cases, their objection is instinct, not policy. This procedure forces instincts to become principles.
