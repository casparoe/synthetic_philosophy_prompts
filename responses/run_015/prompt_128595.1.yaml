          *   *Sanctity:* Fails #1, #3, #4. Passes #5 (maybe).
          *   *Consequentialism:* Good on #4, #6. Fails #2, #5.
      *   **Conclusion:** A brief closing acknowledging the burden the user carries.

  6.  **Refining the Tone:**
      *   Avoid clinical coldness. The user is a partner. Use phrases like "moral weight," "lived reality," "fractures."
      *   Ensure the distinction between "theory" and "practice" is bridged.
      *   *Self-Correction during drafting:* Make sure I don't just repeat the prompt's requirements but *specify* what the theory must *deliver* to meet them. For example, for #1, the theory must explain the *moral significance of causal role*, not just say they are different.

  7.  **Final Review against Constraints:**
