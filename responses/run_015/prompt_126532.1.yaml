answer: |-
  You are circling a very specific, robust philosophical position: **Functionalism with Heterophenomenological discipline.**

  You are correctly sensing that Case 2 (Sanborn) and Case 5 (Inverted Painter) are structural twins. If you feel a pull to treat them differently, it is likely because Case 2 feels more "mundane" (coffee goes bad) while Case 5 feels "metaphysical" (spectrum inversion). But under a disciplined framework, they stand or fall together.

  Here is a principle that saves your verdicts on 1, 3, and 4, forces a decision on 2, and resolves 5.

  ### The Principle: The Functional Anchor Constraint
  > A first-person report of a phenomenological change is coherent **only if** it anchors to a distinguishable change in the subject's functional architecture (discrimination, affect, memory, or neural processing).
  >
  > If a report posits a change in "what-it's-like" that is **causally inert** (makes no difference to behavior, processing, or other mental states), the report is treated as a confabulation or a category error, not evidence of a private entity.

  This principle treats "qualia" not as intrinsic, non-physical glows, but as **functional roles within the cognitive economy.**

  ---

  ### Applying the Principle to Your Cases

  **Case 1 (Chase): Coherent.**
  *   **Anchor:** Behavioral preference.
  *   **Analysis:** The subject's discrimination (taste) is stable, but their *valuation* system has shifted. This is a functional change in the "reward/punishment" module. No mysterious qualia shift is needed; we have a clear functional account of "liking" vs. "tasting."

  **Case 2 (Sanborn): Incoherent (You must commit here).**
  *   **Anchor:** None (by your stipulation).
  *   **Analysis:** You stipulated that discrimination behavior *has not changed*. If the subject cannot distinguish the "cardboard" coffee from the "real" coffee in a blind test, and their neural processing is identical, the report "it tastes like cardboard" is a **judgment error**, not a sensory fact.
  *   **Why it feels different from Case 5:** We intuitively assume Sanborn *can* tell the difference and just isn't showing it. But if you hold the line that *no* behavioral/neural difference exists, Sanborn is positing a "ghost in the machine." To keep your framework disciplined, you must treat Case 2 exactly like Case 5.

  **Case 3 (Silent Synesthete): Incoherent.**
  *   **Anchor:** None.
  *   **Analysis:** This is the "Philosophical Zombie" problem in reverse. If the "curvature" of the number 5 does not influence arithmetic, memory, attention, or report (unless prompted), it is doing no causal work. In a disciplined framework, if it makes no difference, it isn't there. It is a narrative gloss the brain applies post-hoc.

  **Case 4 (Dissociated Pain): Coherent.**
  *   **Anchor:** Affective/Motivational system.
  *   **Analysis:** This is the strongest case for "disciplined qualia." Neuroscience confirms pain has two tracks: sensory-discriminative (where, how sharp) and affective-motivational (suffering, urgency).
  *   **Why it works:** The patient isn't positing an invisible ghost; they are reporting a **dissociation of functional systems.** The "sharpness" qualia is anchored in somatosensory cortex (unchanged); the "suffering" qualia is anchored in the cingulate/limbic system (changed). This validates your intuition: qualia are coherent when they map to dissociable functional subsystems.

  **Case 5 (Inverted Painter): Incoherent.**
  *   **Anchor:** None (by your stipulation).
  *   **Analysis:** This is the classic Inverted Spectrum. If V4 activation is identical and color mixing/naming is identical, the "inversion" is causally idle.
  *   **Resolution:** Your intuition that this is incoherent is correct under the Functional Anchor. The "Inverted Painter" is only coherent if you assume qualia are *non-functional intrinsic properties*. If qualia are disciplined as functional roles, an inversion without functional consequence is impossible.

  ### The Verdict on Case 2 vs. Case 5
  You asked if there is a principle that tells you what's wrong with 5 but saves 2. **There isn't one, and there shouldn't be.**

  To maintain discipline, you must accept that **Case 2 and Case 5 are the same category.**
  *   If Sanborn *actually* discriminates the coffee differently (e.g., hesitates, makes different facial expressions, shows different ERP waves), then Case 2 becomes coherent (like Case 4).
  *   If the Painter *actually* processes color differently (e.g., different reaction times to red vs. green, different emotional associations), then Case 5 becomes coherent.
  *   If both stipulate **zero** functional difference, both are incoherent posits.

  The reason you feel Sanborn is "okay" is likely because in the real world, "tastes like cardboard" *always* comes with micro-behavioral differences. You are importing real-world assumptions into a thought experiment that forbids them.

  ### The New Case: The "Flow" of Time
  > *Case 6: Someone reports time "flows" for them in a particular direction after a brain injury, but all temporal reasoning and memory sequencing stay intact.*

  **Verdict: Incoherent as a Sensory Qualia; Coherent as a Narrative Stance.**

  *   **Analysis:** "Flow" is not a sensory datum (like redness or sharpness); it is a **conceptual metaphor** for entropy and memory access.
  *   **Applying the Principle:** Since memory sequencing and reasoning are intact, the functional architecture of time-processing is unchanged. The report of "flow" is a **confabulatory narrative** generated by the language modules to explain the state of being conscious.
  *   **Disciplined Use:** You can treat this as a "cognitive qualia" (a feeling of familiarity or narrative cohesion) *only if* you can find a functional anchor. For example, if the patient shows anxiety when the "flow" is interrupted, or if their reaction times to "future" vs. "past" prompts change. If nothing changes, the "flow" is a poetic description of a standard functional state, not a new phenomenological property.

  ### Summary: How to Use "Qualia" Disciplinedly

  To avoid the "incoherent posit" trap, adopt this definition:

  **Qualia = Discriminative Functional States.**

  1.  **No Intrinsic Glow:** A qualia is not a private movie screen; it is the *operation* of a discrimination system.
  2.  **Dissociability:** A claim about qualia is valid if it points to a specific subsystem that can be altered independently (like Pain Asymbolia in Case 4).
  3.  **Causal Power:** If a reported experience does not influence the system (behavior, memory, affect), it is not a qualia; it is a confabulation.

  **Your Revised Scorecard:**
  *   **Case 1:** Coherent (Valuation shift).
  *   **Case 2:** Incoherent (Unless micro-behavior is found).
  *   **Case 3:** Incoherent (Causally inert).
  *   **Case 4:** Coherent (Subsystem dissociation).
  *   **Case 5:** Incoherent (Causally inert).
  *   **Case 6:** Incoherent as sensation; Coherent as narrative metaphor.

  This keeps you in Dennett's neighborhood without forcing you to deny the *reality* of experience—only the reality of experience *as a separate ontological category*. You are saving the phenomena by grounding them in function.
