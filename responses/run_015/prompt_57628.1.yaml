  ### Scoring Key

  **Instructions:** Tally which letter you selected most frequently. If you have a tie, look at the "Tiebreaker" questions listed below. Match your dominant pattern to the positions below. Note that most people are hybrids; this sorts your *dominant* ethical instinct.

  **1. The Relational Host (Mostly A on Q1, Q3, Q9)**
  *   **Key Name:** Relational Justice / Hospitality.
  *   **View:** We built the monoculture that invited them; what is owed is hospitality rather than extermination.
  *   **Tiebreaker:** Q1 (Monoculture blame) overrides all.

  **2. The Skeptic (Mostly A on Q2, Q5, Q7)**
  *   **Key Name:** Moral Nihilism (regarding insects).
  *   **View:** Insects have no morally relevant experience so the question never arises.
  *   **Tiebreaker:** Q2 (Biological machines) confirms this.

  **3. The Precautionary Gardener (Mostly B on Q2, Q3, Q5)**
  *   **Key Name:** Probabilistic Welfare.
  *   **View:** We don't know whether they do [feel pain], and the right move is to weight that uncertainty by some small-but-nonzero probability.
  *   **Tiebreaker:** Q3 (Preferring slower/organic due to uncertainty) distinguishes from Skeptic.

  **4. The Ecological Pragmatist (Mostly C on Q2, Q4, Q9)**
  *   **Key Name:** Ecological Functionalism.
  *   **View:** We don't know, and the right move is to refuse to speculate and fall back on ecological role.
  *   **Tiebreaker:** Q2 (Doesn't matter/Role) distinguishes from Ecocentrist.

  **5. The Replacement Theorist (Mostly A on Q6, C on Q4, B on Q7)**
  *   **Key Name:** Replacement View.
  *   **View:** Individual insects matter but are so numerous and so quickly replaced that deaths are offset by births.
  *   **Tiebreaker:** Q6 (Comforted by replacement) is the signature.

  **6. The Welfare Maximizer (Mostly B on Q6, A on Q7, A on Q3)**
  *   **Key Name:** Negative Utilitarian (Insect Welfare).
  *   **View:** Individual insects matter and their sheer numbers swamp every other consideration.
  *   **Tiebreaker:** Q7 (Numbers change morality) + Q3 (Fast death preferred) distinguishes from Absolutist.

  **7. The System Guardian (Mostly C on Q1, Q4, Q7)**
  *   **Key Name:** Ecocentrism.
  *   **View:** The population or ecosystem is the unit of concern so killing to restore habitat is fine and spraying for cosmetic reasons isn't.
  *   **Tiebreaker:** Q4 (System balance) overrides Individual.

  **8. The Peacekeeper (Mostly A on Q5, Q8, Q9)**
  *   **Key Name:** Absolutist Non-violence.
  *   **View:** Killing is flatly ruled out and the only remaining tools are exclusion, tolerance, and letting crops fail.
  *   **Tiebreaker:** Q9 (Let kale die) is the ultimate test.

  **9. The Suffering Minimizers (Mostly A on Q3, A on Q8, B on Q2)**
  *   **Key Name:** Suffering-Focused Welfare.
  *   **View:** Manner of death matters a great deal, number of deaths doesn't.
  *   **Tiebreaker:** Q3 (Fast synthetic preferred over slow organic) + Q8 (Wasps are cruel) distinguishes from Organic Purist.

