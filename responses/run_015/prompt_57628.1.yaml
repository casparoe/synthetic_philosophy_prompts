  ### Diagnosis of Logical Space

  **Empty Cells (Combinations Nobody Holds)**
  1.  **Absolutist Non-violence + Welfare Maximizer (Numbers Swamp):** Choosing "Killing is never right" (Q5-A) while also choosing "Killing a thousand is vastly worse than killing one" (Q7-A).
      *   *Reason:* **Incoherent.** If killing is flatly ruled out regardless of context, the scale of killing cannot modify the morality. One death is as forbidden as a thousand.
  2.  **Moral Nihilism + Precautionary Welfare:** Choosing "They are biological machines" (Q2-A) while choosing "Assume they might feel something" (Q2-B).
      *   *Reason:* **Incoherent.** These are mutually exclusive epistemic stances on sentience.
  3.  **Relational Host + System Guardian:** Choosing "We invited them via monoculture" (Q1-A) while choosing "Remove crop to stop feeding population" (Q9-C).
      *   *Reason:* **Unattractive.** While logically possible, nobody advocates for hospitality toward pests while simultaneously destroying the habitat to purge the population. The relational view implies coexistence; the system view implies population control.
  4.  **Replacement Theorist + Absolutist Non-violence:** Choosing "Individual loss is negligible" (Q6-A) while choosing "Killing is never the right tool" (Q5-A).
      *   *Reason:* **Unattractive.** If individual death is negligible due to replacement, there is no moral ground for an absolute prohibition on killing. This combination is rarely defended because the justification (replacement) undermines the rule (absolutism).

  **Inseparable Pairs (Views This Instrument Cannot Distinguish)**
  1.  **Ecological Pragmatist vs. System Guardian:** Both prioritize the garden's health over individual insect fate and both accept killing as a management tool. While Q2 attempts to separate them (Speculation vs. Role), in practice, a gardener who says "Don't speculate, focus on role" (Pragmatist) makes the exact same decisions as one who says "The ecosystem is the unit of concern" (Guardian). The action profile is identical even if the internal justification differs.
  2.  **Moral Nihilist vs. Ecological Pragmatist:** Both will kill pests freely. Q2 separates them theoretically (No pain vs. Don't know), but if a respondent answers "Don't know" but acts as if they don't feel pain, the quiz cannot detect the hypocrisy or the functional equivalence. The instrument measures stated preference, not ontological belief.
  3.  **Welfare Maximizer vs. Suffering Minimizer:** Both prioritize insect experience over plant yield. They only separate on Q3 (Speed vs. Organic). If a respondent believes fast death is kinder but refuses synthetic chemicals for other reasons (e.g., soil health), they will score as a Suffering Minimizer on Q3 but a Welfare Maximizer on Q7. The quiz forces a choice that real people may not make cleanly.

  ***

  Question 3 does the most sorting work because it forces a direct trade-off between ecological purity (organic/slow) and individual welfare (fast/peaceful), revealing whether the gardener prioritizes the "green" label or the "kind" outcome. This single choice separates the Suffering Minimizer from the Organic Purist, a distinction standard IPM training completely obscures.
