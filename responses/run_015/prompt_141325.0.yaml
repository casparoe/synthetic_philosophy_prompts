      *   *Fictional specifics:* A specific phrase in a letter, a specific interaction at the canteen.

  7.  **Drafting Section 5: Critique of the Joint Statement:**
      *   Where is it weak? Usually in the "interaction" of factors. Both agree *both* exist, but disagree on the *ratio*.
      *   Where are predictions the same? Both predict high compliance.
      *   Who would refuse? Hardliners on both sides. Browning might hate "willingness." Goldhagen might hate "pressure."
      *   What changes minds? A specific piece of dialogue or a specific demographic correlation.

  8.  **Review and Refine (Self-Correction during drafting):**
      *   *Tone Check:* Keep it plain English. No academic jargon like "teleological" or "ontological." Use "story," "reason," "pressure."
      *   *Constraint Check:* No bibliography. No reading list.
      *   *Plot Check:* Ensure the advice fits the specific plot points (the 15 opt-outs, the 4 returning, the efficiency man).
      *   *Sensitivity:* This deals with Holocaust analogues. Must be handled with gravity, acknowledging the horror without getting bogged down in real-world politics that distract from the fiction. The user specified a *fictional* country/decade, so keep the analysis applicable to the *fiction* while acknowledging the historical analogue.
