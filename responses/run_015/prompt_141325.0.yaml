      *   *User's Guess 4 (Population claim):* "Would have done it anyway."
          *   *Refinement:* Counterfactuals are tricky. Better: "Threshold of participation." How much pressure is needed to get 90% compliance?

  6.  **Drafting Section 4: Evidence (Real & Fictional):**
      *   Need concrete things the novelist can write.
      *   *Letters:* Tone, justification, omission.
      *   *Rosters:* Who moved where?
