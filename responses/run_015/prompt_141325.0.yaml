  5.  **Drafting Section 3: The Cruxes:**
      *   *User's Guess 1 (Opt-outs):* Kind vs. Mood.
          *   *Refinement:* It's about *barriers*. Was the barrier internal (conscience/ideology) or external (fear of looking weak)?
      *   *User's Guess 2 (Volunteers):* Evidence of what?
