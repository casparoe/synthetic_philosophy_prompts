  2.  **Deconstruct the Historiography (Browning vs. Goldhagen):**
      *   *Christopher Browning (Ordinary Men):* Focuses on situational factors. Group conformity, authority, obedience, gradual brutalization, war context. These weren't necessarily ideologically driven killers *initially*, but became so through the process. The opt-out was key evidence that ideology wasn't the *sole* driver (since some refused without penalty).
      *   *Daniel Goldhagen (Hitler's Willing Executioners):* Focuses on ideological factors. "Eliminationist antisemitism" was pervasive in German culture. These men killed because they *wanted* to, or at least believed it was necessary/right. The opt-out was rare because the ideology was strong; the volunteers later prove the underlying desire.
      *   *Common Ground:* The men killed. The opt-out existed. The unit was Reserve Police Battalion 101 (or fictional equivalent). Most participated. Some refused. Some escalated. Some stopped.
