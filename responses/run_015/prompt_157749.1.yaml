      *   *The Historian's Goal:* To understand why 1950s midwives withheld analgesia without calling it "cruel" (presentism) or "standard care" (neutrality/complicity).
      *   *The Structural Trap:* To make the past intelligible, the historian must organize events into a narrative.
      *   *Mechanism 1: Periodization.* Historians usually periodize medical history as a march from "ignorance/suffering" to "knowledge/relief." Even if the historian tries to be neutral, placing the 1950s *before* the "epidural revolution" of the 1970s structurally defines the 1950s by what it *lacked*. The timeline itself imposes a value judgment (relief is good).
      *   *Mechanism 2: Taxonomy.* How do we label the act? Is it "Withholding"? "Management"? "Therapeutic Rest"? If we use the past's taxonomy ("Therapeutic Rest"), we hide the pain. If we use the present's ("Withholding Analgesia"), we impose a right to pain relief that didn't exist then.
      *   *The Unavoidability:* To write history is to select and connect. Selection requires a criterion of relevance. Relevance is determined by *our* questions. Our questions are shaped by *our* ethics. Therefore, the structure of the inquiry imports the ethics.

  6.  **Refining the Example: The "Twilight Sleep" or "Natural Childbirth" Transition.**
