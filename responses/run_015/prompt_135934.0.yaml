answer: |-
  # Conceptual Specification: Theory of Neural Computation
  **Version:** 1.0 (Von Neumann Constraint Set)
  **Target:** Architectural Theory of Biological Cognition

  ## 1. Core Desiderata

  The following requirements define the interface and behavioral guarantees a theory of neural computation must satisfy to be considered adequate under the constraints of biological plausibility and von Neumann's reliability observations.

  ### 1.1 Stochastic Reliability (The Von Neumann Threshold)
  *   **Requirement:** The system must maintain functional output stability despite high rates of component failure (neuron death) and signal noise (synaptic transmission failure), without employing explicit N-modular redundancy (e.g., triple-modular redundancy) or global error-correcting codes.
  *   **Motivating Phenomenon:** Neurons fire probabilistically and die continuously over a lifespan, yet cognitive performance remains stable for decades. Von Neumann noted that logical depth is achieved despite component unreliability.
  *   **Classification:** **Non-negotiable.**
  *   **Distinction:** Differentiates *hardware failure* (physical component loss) from *representational error* (incorrect output). The theory must explain how the former does not inevitably cause the latter.

  ### 1.2 Signal Duality (Hybrid Dynamics)
  *   **Requirement:** The architecture must account for the coexistence of continuous state variables (membrane potentials, neurotransmitter concentrations) and discrete event generation (action potentials/spikes), explaining how logical operations are extracted from analog dynamics.
  *   **Motivating Phenomenon:** Biological neurons integrate analog inputs over time but communicate via discrete all-or-nothing spikes. Purely analog models fail to explain long-distance signal fidelity; purely digital models fail to explain sub-threshold integration and timing-dependent plasticity.
  *   **Classification:** **Non-negotiable.**
  *   **Distinction:** Distinguishes between *statistical approximation* (averaging noise) and *verifiable inference* (discrete logical steps). The theory must specify the threshold mechanism that converts the former into the latter.

  ### 1.3 Autonomous Plasticity (No External Programmer)
  *   **Requirement:** Learning rules must be locally computable and self-initiated. The system must modify its own connectivity and parameters based solely on internal state and sensory input, without an external loss function, backpropagation signal, or supervisory agent.
  *   **Motivating Phenomenon:** The brain learns in unsupervised or reinforcement environments without a "teacher" providing ground-truth labels or global gradient vectors.
  *   **Classification:** **Non-negotiable.**
  *   **Distinction:** Distinguishes between *parameter tuning* (adjusting weights to fit data) and *structural reconfiguration* (rewiring the compute graph).

  ### 1.4 Graceful Degradation without Global State (The Distributed Systems Constraint)
  *   **Requirement:** The system must exhibit performance degradation proportional to the magnitude of damage, rather than catastrophic failure, achieved strictly through local message passing and local state updates. There is no global orchestrator, clock, or shared memory bus to coordinate failover.
  *   **Motivating Phenomenon:** Stroke or trauma removes large partitions of neural tissue. Function is often impaired but rarely "crashes" entirely. In distributed systems terms, the brain is a partition-tolerant, eventually consistent system without a master node.
  *   **Classification:** **Non-negotiable.** (Explicitly imported from Distributed Systems Design).
  *   **Distinction:** Distinguishes between *redundancy* (having backup copies) and *degeneracy* (different structures producing the same function). The theory must explain degeneracy without invoking backup schemes.

  ### 1.5 Compositional Generalization
  *   **Requirement:** The system must demonstrate the capacity to combine learned primitives into novel structures that obey syntactic or logical rules, rather than relying solely on similarity-based interpolation.
  *   **Motivating Phenomenon:** Humans can understand and generate sentences or solve problems they have never encountered before, implying a capacity for discrete composition beyond statistical correlation.
  *   **Classification:** **Camp-specific Preference.** (Symbolic architectures treat this as primary; Connectionist architectures treat this as emergent).
  *   **Distinction:** Distinguishes between *interpolation* (performing well within the training distribution) and *extrapolation* (performing well outside it via rule application).

  ### 1.6 Energy-Bandwidth Optimization
  *   **Requirement:** Computational throughput must be bounded by metabolic constraints (approx. 20W for the human brain). Information transmission must be sparse.
  *   **Motivating Phenomenon:** Brains operate on extremely low power compared to silicon equivalents performing similar tasks. Dense, continuous communication is metabolically prohibited.
  *   **Classification:** **Non-negotiable.**
  *   **Distinction:** Distinguishes between *compute-bound* constraints (silicon) and *communication-bound* constraints (biology).

  ---

  ## 2. Jointly Unsatisfiable Subsets (The Tensions)

  Given current constraints from neurobiology and information theory, the following subsets of desiderata appear to be in direct tension. A complete theory must resolve these trade-offs explicitly rather than ignoring one side.

  ### Tension A: The Stability-Plasticity Dilemma vs. Energy Constraints
  *   **Conflict:** **Requirement 1.3 (Autonomous Plasticity)** conflicts with **Requirement 1.1 (Stochastic Reliability)** under **Requirement 1.6 (Energy Constraints)**.
  *   **Analysis:** To maintain reliability (1.1) while learning new data (1.3), the system must prevent "catastrophic forgetting" (overwriting old stable weights). In information-theoretic terms, stabilizing weights against noise requires energy (reinforcement). However, metabolic constraints (1.6) limit the frequency and magnitude of weight updates.
  *   **Implication:** A theory cannot maximize both learning speed and long-term stability without a mechanism for "consolidation" that effectively duplicates storage costs, violating energy constraints.

  ### Tension B: Discrete Inference vs. Continuous Dynamics
  *   **Conflict:** **Requirement 1.2 (Signal Duality)** conflicts with **Requirement 1.5 (Compositional Generalization)**.
  *   **Analysis:** Verifiable logical inference (1.5) typically requires noise-free, discrete symbol manipulation. Biological substrates are noisy and continuous (1.2). To get discrete logic from continuous dynamics requires a high-gain thresholding mechanism. However, high-gain thresholding amplifies noise, violating Reliability (1.1).
  *   **Implication:** You cannot have perfect logical certainty and high noise tolerance simultaneously without introducing latency (integration time) that may violate real-time causal constraints.

  ### Tension C: Local Learning vs. Global Optimization
  *   **Conflict:** **Requirement 1.4 (No Global Orchestrator)** conflicts with **Requirement 1.5 (Compositional Generalization)** in the context of deep architectures.
  *   **Analysis:** Achieving complex compositional output usually requires coordinating updates across many layers of processing. In software, this is done via global backpropagation. In the brain, updates must be local (1.4).
  *   **Implication:** It is currently mathematically unclear how deep hierarchical credit assignment can occur with strictly local rules without sacrificing convergence speed or optimality.

  ---

  ## 3. The Exclusionary Requirement

  **Requirement 1.4: Graceful Degradation without Global State (Local-Only Coordination).**

  This is the single requirement that excludes the greatest number of popular current theories.

  *   **Why it excludes Deep Learning (Connectionism):** Standard backpropagation relies on a global loss function and the transport of error gradients across the entire network. This is a "global orchestrator" in all but name. If you remove the ability to compute global gradients, standard Deep Learning architectures fail to train. Furthermore, trained neural networks are often brittle; removing random nodes (dropout is only valid during training) frequently degrades performance non-linearly, violating the "graceful" constraint in the inference phase.
  *   **Why it excludes Classical Symbolic AI:** Symbolic architectures (e.g., SOAR, ACT-R in their classic forms) rely on precise syntax. A single bit-flip or missing token in a production rule causes a crash (hard failure), not graceful degradation. They also typically rely on a central executive or working memory buffer that acts as a global state orchestrator.
  *   **Why it is the bottleneck:** It forces the theory to abandon the most powerful mathematical tool we have for optimization (global gradient descent) and the most powerful tool we have for logic (precise syntax), demanding a third, currently elusive mathematical framework that supports *local* credit assignment and *distributed* semantic representation.

  ---

  ## 4. Brief Assessment of Current Frameworks

  | Framework | Performance against Spec | Critical Failure Mode |
  | :--- | :--- | :--- |
  | **Mainstream Connectionism (Deep Learning)** | **Fail.** Satisfies Signal Duality (mostly) and some Fault Tolerance. | Violates **1.3 (Autonomous Plasticity)** and **1.4 (No Global Orchestrator)**. Relies on external supervision and global backprop. Lacks verifiable inference (1.2). |
  | **Symbolic Cognitive Architectures** | **Fail.** Satisfies Compositional Generalization (1.5). | Violates **1.1 (Stochastic Reliability)** and **1.4 (Graceful Degradation)**. Brittle to noise; requires central executive. Biologically implausible wiring. |
  | **Predictive Processing (Free Energy Principle)** | **Partial Pass.** Strong on **1.2 (Signal Duality)** and **1.6 (Energy)**. | Struggles with **1.5 (Compositional Generalization)**. While it handles local updates well, explaining how discrete logical structures emerge from continuous prediction error minimization remains an open problem. |

  ## 5. Summary for the Engineer

  If you treat the brain as a distributed system, the specification demands a **serverless architecture** where every node is both compute and storage, communication is asynchronous and lossy, there is no central load balancer, and the code rewrites itself at runtime without a CI/CD pipeline.

  Current theories generally cheat: Deep Learning uses a central trainer (the GPU cluster/backprop), and Symbolic AI assumes perfect hardware. The "Von Neumann Spec" requires a theory that explains how **logical determinism emerges from statistical chaos** using only **local communication**. Until a model satisfies Requirement 1.4 without sacrificing Requirement 1.5, it remains a simulation of cognition, not an explanation of the mechanism.
