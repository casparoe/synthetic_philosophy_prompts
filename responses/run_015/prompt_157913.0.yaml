  The annual meeting of the State University Philosophy Department had dragged on for four hours, mostly because the Tenured Faculty refused to let the Graduate Students use the good chairs. Finally, Department Chair Dr. Aris Thorne slammed his gavel to announce the results of the Internal Ethics Grant review.

  "The data is unequivocal," Thorne declared, projecting a slide onto the screen. "Our committee finds Contractualist ethics significantly more appealing than Utilitarianism. Overall, Contractualist proposals had an 82% approval rate, compared to only 22% for Utilitarian proposals."

  A murmur of dissatisfaction rippled through the Graduate Students. Dr. Elena Logic, a professor of formal epistemology who rarely spoke during budget meetings, raised her hand.

  "Aris," she said, adjusting her glasses. "Did you stratify that data by career stage?"

  Thorne blinked. "We don't need to. The aggregate preference is clear."

  "Actually," Logic said, pulling up a spreadsheet on her laptop, "within the Faculty stratum, Utilitarian proposals had a 95% approval rate versus 90% for Contractualist. And within the Graduate Student stratum, Utilitarian proposals had a 15% approval rate versus 10% for Contractualist."

  The room went silent. Thorne squinted at the screen. "So... within every subgroup, the committee prefers Utilitarianism. But overall, they prefer Contractualism?"

  "Precisely," Logic said. "It's Simpson's Paradox. The association between ethical framework and approval rate inverts sign when you condition on the confounder."

  "But how is that mathematically possible?" asked a bewildered Grad Student. "If we lose in both groups, how do we win the total?"

  "Because of the marginal distributions," Logic replied, turning to the room. "Almost all the Contractualist applicants were Faculty, who have a high baseline approval rate. Almost all the Utilitarian applicants were Grad Students, who have a low baseline approval rate. You aren't seeing a preference for Contractualism; you're seeing a preference for Tenure."

  Thorne stared at the numbers, then slowly lowered his gavel. "So, you're saying our moral intuition is just a weighting error?"

  "No," Logic said, closing her laptop. "I'm saying your moral intuition is a weighted average of two inferiorities."
