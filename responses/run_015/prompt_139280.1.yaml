answer: |-
  Here is a breakdown to help you grade this, followed by the feedback you can copy and paste.

  ### Advice for you (The Marker)
  You mentioned you've been giving 16 or 17 to everyone. Your instinct that this "doesn't mean anything" is correct. In academic marking, a 16/20 (80%) is usually reserved for work that is near-perfect—insightful, logically consistent, and error-free. A 14–15/20 (70–75%) is a "Strong First" or "A" grade: excellent, but with a noticeable flaw or missed opportunity.

  This answer is **very good**, but it contains a major logical contradiction regarding the "visitor" argument. If you give this 16+, you have no room left for a truly perfect answer. I suggest marking this at **15/20**. It validates the student's effort while signaling that there is still room to tighten their logic.

  ***

  ### The Mark
  **15 / 20**

  ***

  ### Feedback for the Student (Copy & Paste)

  **General Comments**
  This is a thoughtful and well-structured answer. You have clearly done some reading around the subject (referencing David Lewis is excellent), and you distinguish well between different *types* of rules. You also handle the word limit efficiently. However, there is a contradiction in how you treat the two "visitors" that undermines your overall argument.

  **Point-by-Point Breakdown**

  > *"Following David Lewis, a convention is a solution to a coordination problem... So conventions do generate genuine obligations; they're not just manners."*

  **Credit:** This is a strong start. You correctly identify that social rules often function as coordination equilibria. You are right that once a convention is established, we have a reason to follow it to avoid frustrating expectations. This shows good conceptual understanding.

  > *"It also follows that the obligation only exists where the coordination is at stake, so if nobody else is affected, the obligation lapses."*

  **Critique:** This is a debatable interpretation of Lewis. Many philosophers argue that if you make an exception for yourself whenever you think you won't be caught, you undermine the disposition to follow the rule generally. However, for the purposes of this question, your reasoning is consistent enough to gain credit.

  > *"I'd add that he couldn't be blamed anyway, because he's only visiting... What's actually right and wrong for him is still settled by what people in Fenwick think, and they wouldn't think anything of it."*

  **Critique:** This is the weakest part of the essay. You are arguing for a form of "Moral Relativism" here (morality depends on where you are from). If this is true, you must apply it to the second scenario as well. If Dev is judged by Fenwick standards, the tipping visitor should be judged by *their* home standards (where tipping doesn't exist). By switching frameworks, you contradict yourself.

  > *"Tipping is different... The café staff in Marlow are paid a wage that assumes tips, so leaving nothing takes money out of somebody's pocket. That's a straightforward harm rather than a breach of etiquette."*

  **Critique:** You correctly identify that "harm" is a stronger basis for moral blame than "etiquette." However, the prompt states "service is included." In many jurisdictions, this means the staff are paid a full wage by the employer, and tips are extra. You assume the staff rely on tips for their base wage without evidence from the text. A stronger answer would acknowledge this ambiguity.

  > *"Last thing, though: not every convention deserves to be followed... Those you should break, because the point of a convention is to solve a problem for everyone..."*

  **Credit:** Excellent concluding point. Distinguishing between *descriptive* conventions (what people do) and *normative* ones (what people ought to do) adds real depth. This shows independent critical thinking.

  **What a Top-Ranked Answer Would Add**
  To push this into the highest band, you need to resolve the contradiction regarding the visitors. Either:
  1.  Argue that **both** visitors are wrong because when you enter a community, you accept its social contract (Universalism).
  2.  Argue that **neither** is wrong because morality is relative to their home culture (Relativism).
  3.  Explain *why* Dev is excused (safety rule, no harm) but the Tipper is not (economic contract), without relying on where they are from.

  Currently, you excuse Dev because of where he is from, but blame the Tipper because of local economic harm. Picking one consistent ethical framework would make this a flawless answer.

  ***

  ### Notes on Your Question (For your eyes only)

  **Is the question badly worded?**
  No, it's actually quite strong for a discussion group. It successfully forces a distinction between "harmless rule-breaking" (Dev) and "economic rule-breaking" (Tipping).

  **Does it give anything away?**
  It leans slightly on the Tipping scenario. By stating "service is included," you imply there is no *legal* obligation to tip, which makes the student's job harder (they have to argue for a moral obligation despite a legal one). The student tackled this well by arguing about "assumed wages," but be aware that in the real world (specifically the UK, implied by Marlow/Fenwick), "service included" usually means the staff get the money regardless of extra tips.

  **Suggestion for next time:**
  If you want to make the Tipping scenario clearer, you could remove "service is included" and simply say: *"In Marlow cafés, staff are paid a low base wage and rely on tips to make a living."* This removes the ambiguity about whether harm is actually being done and forces them to focus purely on the moral obligation of the visitor.

  **Final thought on your marking:**
  Don't be afraid to give a 14 or 15. If everyone gets 16+, the students won't know what they need to improve. This student wrote a great answer, but the logical slip on the "visitor" argument is exactly the kind of thing a 15/20 highlights: "You are doing great work, but watch your consistency."
