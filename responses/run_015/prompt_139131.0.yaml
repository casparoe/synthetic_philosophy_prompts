      *   *Answering the "Infinite Premises" sub-question:* Even if you have $A, B, C, D, E... \infty$, $Z$ never pops out *automatically*. You still need a *machine* or an *agent* to look at the list and say "Okay, now I write Z." The list is static; the inference is dynamic. The regress happens because the Tortoise demands that the *act* of inferring be justified by a *statement* about inferring.
      *   *Key Insight:* You can't turn a verb (inferring) into a noun (a premise) without losing the verb.

  3.  **Deconstruct Question 2: System $W$ and Axiom $S$:**
      *   *The Setup:* System $W$ has axioms, self-reference, and Rule $R$ (Modus Ponens). Axiom $S$ says "Every sentence derivable in $W$ is true."
      *   *The Question:* Does $S$ internalize the rule? Does it stop the regress?
      *   *Analysis:* $S$ is just a sentence *inside* $W$. It is a string of symbols. $R$ is the mechanism that manipulates strings. $S$ can *talk* about $R$, but $S$ cannot *be* $R$.
