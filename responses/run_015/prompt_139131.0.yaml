      *   *The Contrast:* Carroll's loop spins (regress). Gödel's loop bites (fixed point/truth).
      *   *Structural Difference:*
          *   Carroll: The loop is about *justification*. "Why did you move?" "Because of this rule." "Why that rule?" It's a vertical stack of *reasons*. It's open-ended.
          *   Gödel: The loop is about *reference*. The sentence points to its own status. It creates a fixed point. $G$ says "I am not provable."
          *   *Crucial Distinction:* Carroll is about the *process* of logic (inference). Gödel is about the *content* of logic (truth/derivability).
          *   *Why one bites:* Gödel's sentence exploits the gap between *truth* and *provability*. It forces a decision: if the system is consistent, $G$ is true but unprovable. The loop closes because the statement successfully captures its own property within the system's language.
          *   *Why one spins:* Carroll's regress tries to capture the *engine* of the system *inside* the fuel. You can't fuel the engine with a description of the engine.
