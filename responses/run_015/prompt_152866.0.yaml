      *   Intuition pump: The wooden table analogy (cannot be made of different wood).
      *   The user is worried about *vagueness* (one base pair difference), *asymmetry* (pre- vs. post-fertilization edit), and *unfalsifiability* (the "I wouldn't exist" trump card).

