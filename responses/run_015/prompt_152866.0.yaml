      *   **Task:** Provide serious objections/critiques, ranked from fatal to awkward. Distinguish between genuine costs and misunderstandings. Address specific cases (small-change, twinning/fusion, asymmetry of timing). Discuss structural implications (predictions, empirical pressure, unfalsifiability). End with an honest assessment and the "single consideration" most likely to move them.
