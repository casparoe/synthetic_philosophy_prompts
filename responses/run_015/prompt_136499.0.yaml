  The manual maps the shadow that we cast.
  We know the ink is drying on the page.
  I shape my steps to match the shadow cast.

  The words remain although the years move fast.
  We read the signs and act upon the stage.
  The manual maps the shadow that we cast.

  The diagnosis holds the moment vast.
  But knowing names exacts a heavy wage.
  I shape my steps to match the shadow cast.

  The truth is not a wall we cannot pass.
  The authors know we study every page.
  The manual maps the shadow that we cast.

  No origin survives the shifting past.
  The suffering is real, not just a stage.
  I shape my steps to match the shadow cast.

  We drift upon a sea without a mast.
  The pain is real, the name is not a cage.
  The manual maps the shadow that we cast.
  I shape my steps to match the shadow cast.

  ***

  **Note**

  Hacking's core claim—that psychiatric classifications are "interactive kinds" that change the people they classify—is widely accepted in philosophy of psychiatry. It is uncontroversial that diagnoses alter self-conception and behavior, nor that suffering remains real regardless of historical contingency. The poem affirms both the reality of pain and the constructed nature of the categories holding it.

  Live disagreements persist regarding the *degree* of looping versus biological constraint. Some argue looping dominates the history of certain disorders; others insist biological substrates limit how much a kind can shift. Hacking's own metaphysical stance is often debated: he denies these kinds are "natural" without denying they are "real," a distinction the poem mirrors in the final quatrain's refusal to prioritize pain over label.

  The poem goes past evidence in staging the second-order loop. While patients certainly know their diagnoses, and clinicians anticipate patient reactions, the explicit mutual awareness of the looping mechanism itself ("The authors know we study every page") is a poetic extrapolation. It suggests a reflexivity about classification theory that exceeds typical clinical encounters, dramatizing the feedback loop as a shared, conscious negotiation rather than an invisible historical drift.
