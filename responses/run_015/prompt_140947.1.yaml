  That's a sharp objection, but it relies on conflating testimony about moral facts with testimony about psychological capacities. When the therapist or the ex-member says, "You can't trust your judgment here," they aren't handing you a moral conclusion to swallow whole; they are offering an empirical claim about the state of your cognitive machinery. You accept their word on the reliability of your faculties, yes, but the subsequent move to suspend judgment is driven by your own grasp of the norm that compromised agents should step back. That higher-order regulation is an exercise of autonomy, precisely because you are managing your own epistemic position rather than outsourcing the moral verdict itself. The servility I'm worried about arises when you adopt a moral conclusion without grasping the reasons that support it, not when you accept empirical data about your own inability to grasp those reasons. So the remedy isn't deference moved up a level; it's using non-moral testimony to trigger a properly autonomous moral restraint.
