answer: |-
  ### Objections & Replies

  **1. The Symmetry Trap (Deliberative Democrat)**
  *   **Idiom:** "Popular sovereignty," "exclusion," "hegemony," "vacuous vs. substantive."
  *   **Objection:** "Your symmetry condition is a dilemma. If it's purely subjective—framers *believing* they'd accept the lock against themselves—it's vacuous; any hegemon can claim even-handedness. If it's objective—whether they *actually would*—you've smuggled content back in. You're judging the lock by the outcomes it produces for the losers, which is exactly the 'outcome lock' you claimed to reject. You haven't escaped the dead hand; you've just hidden it behind a procedural mirror."
  *   **Reply (2 min):** Concede that subjective belief is insufficient; the test must be counterfactual but grounded in the *structure* of the rule, not the *identity* of the actors. Refuse the claim that this smuggles content: I am not asking if the outcome is good, but if the rule applies recursively to the rule-makers' own access to power. The symmetry is about *reversibility*, not *results*.
  *   **Concede:** That historical framers often lied about their symmetry.
  *   **Refuse:** That structural reversibility implies a judgment on the moral worth of the outcome.
  *   **Soft Spot:** You have no independent metric for "structural reversibility" that doesn't rely on guessing future political configurations.

  **2. The Rights/Procedure Blur (Constitutional Lawyer)**
  *   **Idiom:** "Doctrinal grip," "adjudication," "workable standard," "constitutive norms."
  *   **Objection:** "This distinction collapses in case law. Free speech isn't just a right; it's a procedural precondition for amendment. Voting rights aren't outcomes; they're the mechanism of decision. If you strike down entrenchment of rights because they look like outcome locks, you undermine the very integrity locks you defend. How do you distinguish a 'constitutive right' from a 'substantive value' without making the normative judgments you claim to avoid?"
  *   **Reply (2 min):** Concede that some rights are constitutive (e.g., speech, association) and pass the test. Refuse the claim that all rights catalogues are constitutive. Most bills of rights protect specific substantive interests (property, privacy) that do not recursively bind the amendment process itself.
  *   **Concede:** That the line is blurry in marginal cases (e.g., due process).
  *   **Refuse:** That the blur invalidates the clear cases (e.g., entrenching a state religion vs. entrenching the amendment interval).
  *   **Soft Spot:** You lack a principled way to sort which rights are "constitutive" without referencing the very values you claim to bracket.

  **3. The Psychology of Change (Clinical Ethicist)**
  *   **Idiom:** "Autonomy," "diachronic self," "value pluralism," "impairment."
  *   **Objection:** "You've misdescribed the Ulysses case to suit the constitutional one. In clinical ethics, the hard cases aren't about weakness of will; they're about value change. The later self isn't irrational; they're different. By insisting the later judgment is 'distorted' rather than 'changed,' you deny the legitimacy of political evolution. If the future majority genuinely values something differently, your integrity lock treats their sovereignty as a pathology."
  *   **Reply (2 min):** Concede that value change is real and distinct from impairment. Refuse the inference that constitutional precommitment should accommodate all value changes. Some changes are exogenous shocks to the system; the lock protects the system's continuity, not the specific values of the framers.
  *   **Concede:** That some constitutional changes reflect legitimate moral progress.
  *   **Refuse:** That this invalidates the need for stability against transient shifts in preference.
  *   **Soft Spot:** You haven't explained how to distinguish "legitimate moral progress" from "corrupted procedure" without looking at the content of the change.

  **4. The Equilibrium Challenge (Formal Political Scientist)**
  *   **Idiom:** "Equilibrium," "endogenous," "mechanism design," "trigger strategy."
  *   **Objection:** "What work is 'integrity' doing that a trigger strategy doesn't? In a repeated game, actors follow rules because deviation triggers punishment. Your 'integrity lock' looks like a cooperative equilibrium sustained by the threat of constitutional collapse. Why posit a normative distinction when a game-theoretic stability condition explains the behavior without the philosophical baggage?"
  *   **Reply (2 min):** Concede that stability is necessary. Refuse that it is sufficient. A trigger strategy explains *compliance*, not *legitimacy*. My claim is about when the binding is justified, not when it will hold.
  *   **Concede:** That many integrity locks will coincide with equilibrium strategies.
  *   **Refuse:** That the normative justification is reducible to the stability condition.
  *   **Soft Spot:** You haven't specified how to identify an integrity lock independently of observing whether the equilibrium holds.

  ***

  ### Strategic Priorities

  **The Single Reply That Must Land**
  The reply to the **Deliberative Democrat (The Symmetry Trap)**.
  If you cannot defend the symmetry condition against the charge that it is either vacuous (subjective) or smuggled content (objective), your diagnostic tool breaks. Without the diagnostic, you cannot distinguish integrity from outcome locks in practice, and the thesis becomes untestable speculation. You must convince them that structural reversibility is a formal property distinct from substantive outcomes.

  **The Weakest Joint**
  **Step 3 (The Diagnostic/Symmetry Condition).**
  This is the bridge between your abstract distinction and real-world application. It is the easiest to attack empirically (framers always claim symmetry) and theoretically (who judges the symmetry?). Prepare to defend the *counterfactual* nature of the test: it is not about what framers said, but whether the rule's logic applies recursively to the rule-makers' own future access to power.

  **Load-Bearing vs. Expendable Distinction**
  *   **Load-Bearing:** **Step 1 (Integrity vs. Outcome).** This is the thesis. If this distinction collapses, the paper is dead.
  *   **Expendable:** **Step 2 (Ulysses vs. Pre-registration).** This is an illustrative analogy. If the Clinical Ethicist destroys the Ulysses comparison, you can pivot. You can argue that even if Ulysses is a bad model, the *functional* difference between protecting decision-reliability vs. decision-content remains valid. Dropping Step 2 costs you rhetorical clarity but not logical coherence.

  **The Dangerous Question**
  **"Who adjudicates the symmetry condition?"**
  *   **Why it is dangerous:** It creates an infinite regress. If the test for a legitimate lock is whether the framers would accept it against themselves, who decides if they would? If it's the current court/majority, then the lock is only valid when the current power says it is, which defeats the purpose of precommitment. If it's an objective fact, you need a theory of political psychology you haven't provided. This question threatens to show that your diagnostic tool is either arbitrary or requires the very substantive judgment you claimed to exclude.
