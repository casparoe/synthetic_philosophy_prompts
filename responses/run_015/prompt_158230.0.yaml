prompt: |-
  I'm on our univ's Distinguished Service Award commitee. There's a nomination for a staffer who rescued a grad student from a chemical fire — clearly the right act — but leaked messages show she was mostly calculating media coverage and her promotion prospects, not thinking about the victim. Our charter mentions 'moral character,' not just outcomes, and the panel is split: some say saving a life is enough; others say awarding her collapses moral worth into mere behaviorism. I need a memo for Thursday recommending approve, reject, or approve with conditions, with reasoning that takes the strongest losing argument seriously rather than brushing it aside. I'm also playing with this idea that moral worth doesn't need pure altruism but needs your reasons to be 'structurally anchored' to the value — your practical reasoning tracks the good propperly, not just accidentally produces it. Can you draft the memo so it uses that framing but also shows exactly where it might break down?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the University's Distinguished Service Award Committee.
      *   **Task:** Draft a memo recommending a decision (Approve, Reject, or Approve with Conditions) regarding a nomination.
      *   **Subject:** A staffer who rescued a grad student from a chemical fire.
      *   **Conflict:** The act was heroic (saved a life), but leaked messages reveal her motivation was primarily self-serving (media coverage, promotion), not concern for the victim.
      *   **Constraint 1 (Charter):** The charter specifies "moral character," not just outcomes.
      *   **Constraint 2 (Panel Dynamics):** The panel is split. Some say outcome matters most; others say motivation matters (anti-behaviorism).
      *   **Constraint 3 (Argument Quality):** Must take the strongest losing argument seriously (steel-manning), not dismiss it.
      *   **Constraint 4 (Philosophical Framing):** Use the user's specific idea: "Moral worth doesn't need pure altruism but needs reasons to be 'structurally anchored' to the value — practical reasoning tracks the good properly, not just accidentally produces it."
      *   **Constraint 5 (Critical Reflection):** Show exactly where this framing might break down.
      *   **Deadline:** Thursday (implies urgency/formal tone).

  2.  **Determine the Recommendation:**
      *   *Option A (Approve):* Ignores the "moral character" clause regarding motivation. Risks cynicism.
      *   *Option B (Reject):* Punishes a life-saving act based on private thoughts. Risks discouraging future action and seems overly purist.
      *   *Option C (Approve with Conditions):* Acknowledges the act but addresses the character concern. This allows for the nuance required by the prompt's philosophical framing.
      *   *Decision:* **Approve with Conditions (or a Modified Commendation).** This allows the memo to explore the tension between outcome and motivation without denying the reality of the rescue. It fits the "structurally anchored" framing best—we can argue that while her *ultimate* ends were self-serving, her *proximate* reasoning was anchored to safety protocols and duty, which is enough for "service," even if not for "sainthood."
      *   *Refinement:* Actually, given the "moral character" clause, a flat "Approve" is risky. A "Reject" is too harsh. An "Approve with Conditions" or a "Special Commendation for Action, Withholding Distinguished Service Award" might be better. Let's go with **Recommendation: Approve with Specific Citation Modifications (Approve with Conditions).** This acknowledges the act but qualifies the *reason* for the award to align with the charter.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly.
      *   **Background:** Briefly state the facts (Fire, Rescue, Leaked Messages).
      *   **The Core Tension:** Outcome vs. Motivation (Charter requirement).
      *   **Philosophical Framework (The User's Idea):** Introduce the "Structurally Anchored" reasoning. Explain that we don't need pure altruism, but the reasoning process must track the good.
      *   **Application to Case:** Did her reasoning track the good?
          *   *Argument for:* She followed protocol, acted decisively. The structure of her action was correct.
          *   *Argument against:* Her *why* was external (fame), not internal (duty/care).
      *   **Steel-manning the Opposition:**
          *   *If recommending approval:* Steel-man the rejectionists (The "Moral Luck" argument).
          *   *If recommending rejection:* Steel-man the approvers (The "Consequentialist" argument).
          *   *Decision:* Since I'm leaning towards a nuanced approval/condition, I need to steel-man the **Rejection** argument (that motivation *is* character) and show why the "Structurally Anchored" view modifies it.
      *   **Where the Framing Breaks Down:** This is crucial. I need to admit that "structural anchoring" is hard to verify and might be too intellectualized. What if she just got lucky? What if the "structure" was just muscle memory?
      *   **Recommendation:** Award the recognition but frame the citation around *professional competence and adherence to safety protocols* rather than *heroic virtue*. This satisfies the "Service" aspect without lying about the "Character" aspect.

  4.  **Refining the Philosophical Argument ("Structurally Anchored"):**
      *   *Concept:* Kant vs. Consequentialism middle ground.
      *   *Explanation:* You don't have to be a saint. But your decision-making process must rely on the value of the act (e.g., "I must save them because it's the protocol/safe thing") rather than treating the act as a mere tool for something else (e.g., "I must save them because cameras are rolling").
      *   *Application:* Did she treat the student as an end or a means? The messages suggest a means. This is the weak point.
      *   *Pivot:* However, in a professional context, "Service" is often about role-based duty. If her role-based reasoning triggered the action, that is structurally anchored to the university's values, even if her *personal* vanity was the fuel.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Formal, deliberative, philosophical but practical.
      *   *Addressing the "Break Down":* I need a specific section analyzing the limitations of this framework. Is it too subjective? Does it invite witch hunts into private thoughts?
      *   *The "Condition":* The citation language must be precise. Avoid words like "selfless" or "heroic virtue." Use "decisive action," "adherence to protocol," "preservation of life."

  6.  **Review against Constraints:**
      *   *Memo format?* Yes.
      *   *Thursday deadline?* Mentioned in header.
      *   *Strongest losing argument?* Yes, the "Motivation constitutes Character" argument (Kantian/ Virtue Ethics) will be steel-manned.
      *   *User's framing?* Yes, "Structurally Anchored Practical Reasoning."
      *   *Where it breaks down?* Yes, included in the "Limitations" section.

  7.  **Final Polish:** Ensure the distinction between "Distinguished Service" (professional) vs. "Moral Character" (personal virtue) is clear. The charter says "Moral Character," which makes it harder. I need to argue that professional integrity *is* a subset of moral character in this context.

      *(Self-Correction during drafting)*: Wait, if the charter explicitly says "Moral Character," and she was calculating promotion, can we honestly say she has moral character?
