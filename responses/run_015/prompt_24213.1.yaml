answer: |-
  # Activity: The Individual Claim Protocol

  **Course Context:** Upper-level Applied Ethics Seminar (75 minutes)
  **Class Size:** 13 Students
  **Materials:** 
  *   13 "Triage Decision Cards" (Round 1)
  *   13 "Harm Ledger Affidavits" (Round 2)
  *   39 "Coherence Chips" (3 per student, poker chips or colored cardstock squares)
  *   Whiteboard/Projector for scenario visualization
  *   Timer

  ## I. Setup and Scenario (Minutes 0–10)

  **The Scenario:** 
  Present a sterile medical triage case to minimize "trolley" contamination. 
  *"A single dose of antivenom is available. It is indivisible. To the left of the partition is Patient A. To the right are Patients B, C, D, E, and F. All six are strangers. All six have identical medical profiles, identical life expectancies, identical suffering profiles, and identical social ties. If you do not act, all six die. If you give the dose to the left, A lives, B–F die. If you give the dose to the right, B–F live, A dies. You cannot save all. You must choose."*

  **The Stakes (Coherence Chips):** 
  Distribute 3 Coherence Chips to each student. Explain that these are used to "purchase" speaking time during the final debrief. 
  *   **Rule:** If a student's Round 2 justification is logically consistent with their Round 1 choice, they retain their chips. 
  *   **Bonus:** If their Round 2 justification successfully identifies a specific individual welfare difference (as defined by the form), they earn 2 bonus chips. 
  *   **Penalty:** If their Round 2 form reveals a contradiction between their choice and their justification, they surrender 1 chip. 
  *   *Note:* Emphasize that this is not about being "right," but about structural consistency in argumentation.

  ## II. Round 1: The Intuitive Choice (Minutes 10–25)

  **Format:** Physical Commitment.
  **Instructions:** 
  1.  Ask students to stand.
  2.  Designate the left side of the room as "Save Patient A (The One)" and the right side as "Save Patients B–F (The Five)."
  3.  Give them 30 seconds of silence to move to their chosen side.
  4.  Once settled, they must turn to face someone on the *opposite* side (or the instructor if the split is uneven) and state simply: "I save the [One/Five] because [One Word Reason]." (e.g., "Numbers," "Fairness," "Life").
  5.  Record the vote count on the board. (Expect ~12 vs. 1 or 13 vs. 0 for the Five).

  **Instructor Role:** 
  Do not argue. Do not validate. Simply record the tally. If a student says "Because five is more than one," note this as "Aggregation." If they say "Because more lives," note as "Utility."

  ## III. Round 2: The Harm Ledger (Minutes 25–50)

  **Transition (5 mins):** 
  Collect the verbal reasons. Tell the class: *"We are now moving from intuition to justification. In ethics, if you claim an outcome is 'better,' you must be able to say for whom it is better. We are testing the claim that the five are 'worse off' than the one."*

  **The Format (15 mins):** 
  Distribute the **Harm Ledger Affidavit**. 
  *   **Section 1:** Re-state your choice from Round 1.
  *   **Section 2:** Check the box that validates your choice:
      *   [ ] **Individual Claim:** At least one person in the group I saved would be *individually worse off* dying than the person in the group I sacrificed.
      *   [ ] **Aggregate Claim:** No individual in the group I saved is worse off than the person I sacrificed, but the *total sum* of death is greater.
  *   **Section 3 (The Trap):** If you checked **Individual Claim**, you must write the ID letter (B, C, D, E, or F) of the specific person who is worse off than Patient A. You may only list one.
      *   *Constraint:* You cannot write "All of them." You cannot write "The Group." You must identify the specific individual whose welfare loss exceeds Patient A's.
  *   **Section 4:** Sign your name. This affidavit is your ticket to keep your Coherence Chips.

  **Execution:** 
  Students work silently. Walk around. If a student tries to write "All Five" in Section 3, stop them and point to the constraint: *"Identify the one whose death is worse than A's."* 
  Most students will freeze here. They will realize B is not worse off than A; C is not worse off than A. They will be forced to check **Aggregate Claim** or leave Section 3 blank (triggering the penalty).

  **Collection:** 
  Collect the affidavits. Do not comment yet. Tally the Coherence Chips based on the rules (most will lose the bonus, some may lose a chip if they chose "Save Five" but checked "Individual Claim" without a valid ID).

  ## IV. Debrief and Mapping (Minutes 50–75)

  **Phase 1: The Diagnostic (50–60)**
  1.  **Reveal the Tally:** Show how many students checked "Individual Claim" vs. "Aggregate Claim."
  2.  **The Reveal:** Ask those who checked "Individual Claim" to read the ID they wrote. 
      *   *Expected Outcome:* They will hesitate. They will admit B is not worse off than A. 
      *   *Point:* This exposes the **"No Worse Off" Claim**. If death is equally bad for each, no individual in the five has a stronger complaint than the individual in the one.
  3.  **Map Round 1:** Round 1 captured your **Aggregative Intuition**. You felt the weight of the five.
  4.  **Map Round 2:** Round 2 captured the **Individual Comparison**. You found you could not ground that weight in any single person's welfare.

  **Phase 2: The Philosophical Pivot (60–65)**
  1.  **Name the View:** Now reveal the principal defender (e.g., T.M. Scanlon, *What We Owe to Each Other*, or Michael Otsuka). 
  2.  **The Argument:** Explain that if morality is based on principles no individual could reasonably reject, the five cannot say to the one, "You must die because we are more numerous," because no *single* one of the five is worse off than the one. The number itself is not an individual claim.
  3.  **The Cost:** Acknowledge that this implies numbers might not count. This is the "unsettling" force the activity was designed to surface.

  **Phase 3: Predictable Failures & Grad Student Objections (65–70)**
  *   **The Objection:** A graduate student will likely object during Phase 2: *"This ignores ex-ante probabilities. Behind a veil of ignorance, everyone prefers the rule that saves the many. So the individual *does* have a claim based on prior probability."*
  *   **Handling It:** 
      1.  Validate the sophistication: *"That is the standard contractualist reply."*
      2.  Pivot back to the exercise: *"But notice what you just did. You moved the justification from the victims' current welfare (Round 2) to a hypothetical prior agreement (Round 3). The activity forced you to look at the victims *as they are*. The 'No Worse Off' claim holds in the ex-post scenario. If you rely on ex-ante probability, you are admitting that the *current* five are not worse off, and you are borrowing weight from a hypothetical past. That confirms the activity's point: the numbers themselves don't generate the welfare difference."*
      3.  Do not let this dissolve the tension. The goal is to feel the cost of the view, not solve it immediately.

  **Phase 4: Limitations & Instructor Supply (70–75)**
  *   **Candid Statement of Limitation:** 
      *"This activity successfully demonstrates the **negative** thesis: that aggregation cannot be reduced to individual welfare comparisons. It fails to demonstrate the **positive** thesis: why we should still save the five (or why we shouldn't). The activity breaks your aggregative intuition, but it does not build a non-aggregative bridge. It leaves you in a tie."*
  *   **What You Must Supply:** 
      *"I must now supply the normative framework that resolves the tie. Whether that is 'Fairness as Impartiality,' 'Ex-Ante Contractualism,' or 'Rule Utilitarianism,' is not something the tokens or forms could simulate. The activity shows you the gap; I must now offer you the ladder. Without that next step, this seminar ends in nihilism. With it, it ends in a specific theory of justification."*

  **Closing:** 
  Return Coherence Chips. Dismiss.

  ---

  ### Instructor's Note: Predictable Failures & Mitigation

  **1. The "Utilitarian Holdout" (Round 2)**
  *   **Failure:** A student refuses to fill out Section 3, writing "This is stupid, obviously 5 deaths is worse."
  *   **Mitigation:** Do not engage in content debate during the activity. Point to the instructions: *"The form requires you to isolate the variable of individual welfare. If you cannot do it, check 'Aggregate Claim.' That is a valid data point for our debrief."* Force them to categorize their intuition rather than defend it prematurely.

  **2. The Grad Student "Philosophize-Out" (Round 2/Debrief)**
  *   **Failure:** As noted above, a grad student may try to invalidate the exercise by claiming the scenario is impossible (e.g., "In reality, we never know identities," or "Probability always applies").
  *   **Mitigation:** Use the **"Bracketing Rule."** Remind the class: *"For the next 40 minutes, we are bracketing ex-ante uncertainty. We are looking at the claims of identified victims. If you cannot make the argument work here, it doesn't work here. We will discuss veil-of-ignorance solutions in the next unit."* Keep the focus on the *ex-post* comparison the activity isolates.

  **3. The "Gotcha" Feeling**
  *   **Failure:** Students feel tricked by Round 2, leading to defensiveness.
  *   **Mitigation:** In the debrief, frame the "failure" of Round 2 as a **success of diagnosis**. *"If you found it impossible to name one person worse off, you successfully identified the logical limit of aggregative welfare. You didn't fail the test; the intuition failed the test. That is the discovery."*

  ### Candid Statement of Activity Limitations

  **What This Activity Cannot Reproduce:**
  This activity effectively dismantles the **welfare-based aggregative argument** (i.e., "Save the five because the five suffer more"). It proves that *individually*, they do not. However, it **cannot reproduce the positive moral force of saving the many** if one accepts the "No Worse Off" claim. 

  The activity leaves students in a state of **equipoise** (1 life vs. 1 life, effectively). It does not simulate the **fairness** or **impartiality** arguments that usually rescue the "Save the Many" conclusion in non-aggregative frameworks (e.g., tossing a coin vs. saving the many). 

  **What You Must Supply:**
  You must lecture the bridge between **"Numbers don't count for welfare"** and **"Numbers might count for fairness."** The activity shows why the first step is true; you must explain why the second step doesn't necessarily follow, or how contractualists reconstruct it. Without your closing lecture, the lesson is purely destructive.
