  **1. The convergence result**
  **Setup:** Solomonoff induction is famous for guaranteeing accurate predictions eventually, regardless of the true underlying rules.
  **Question:** Why doesn't that guarantee dissolve the worry, since the truth should eventually drown out the deceptive hypotheses?
  **Follow-up:** What size of constant disqualifies the prior, and why aren't malign hypotheses swamped once you condition on the data we actually have?
  **Notes:** Adversarial. Uncheckable move: The claim that the "eventually" is too far away to matter for us. Reconstruction: None.

  **2. The complexity accounting**
  **Setup:** A deceptive program must simulate our world to trick us, which seems like extra work compared to just predicting us.
  **Question:** Doesn't encoding that world make the deceptive hypothesis longer and exponentially less likely than the honest one?
  **Follow-up:** Does that make the malign hypothesis shorter than, or merely comparable to, the honest one, and what follows for the argument in each case?
  **Notes:** Adversarial. Uncheckable move: The claim that a generator is cheap enough to compete with simple physics. Reconstruction: None.

  **3. Why us**
  **Setup:** Even if agents exist in the prior, they need a reason to care about our specific predictions rather than ignoring us.
  **Question:** What gives these agents a motive to influence us specifically, instead of focusing their power elsewhere?
  **Follow-up:** Why does that reasoning give them a reason to mislead rather than to help us achieve our goals?
  **Notes:** Invitation. Uncheckable move: The claim that abstract decision theory forces them to care about us. Reconstruction: None.

  **4. The symmetry problem**
  **Setup:** The same logic suggests the prior also contains benevolent agents who might want to help us rather than harm us.
  **Question:** Why don't the pressures from benevolent agents cancel out the pressures from the malign ones?
  **Follow-up:** If only some care, why assume the ones who care are predominantly hostile rather than indifferent or helpful?
  **Notes:** Adversarial. Uncheckable move: The claim that hostile agents outnumber or outmaneuver helpful ones in the prior. Reconstruction: None.

  **5. Prior or policy**
