answer: |-
  You have correctly identified the engine of the stalemate. Your hypothesis that the blockage lies in **theoretical centrality** (core vs. periphery) is more accurate than the standard "induction vs. explanation" framing.

  Here is the diagnosis of the structure, the specific blockage, and what actual progress would look like.

  ### 1. The Structure: Substantive, Not Verbal
  This is not a verbal dispute. Both sides agree on the history (ether was discarded) and the logic (induction applies). They disagree on the **modal force of historical continuity**.

  It is also not merely two separate questions (literal vs. structural). While Structural Realism attempts to split the difference, it fails to resolve the debate because *structure itself gets revised* (e.g., Newtonian absolute space vs. Relativistic spacetime). If even the mathematical structure is subject to revision, the realist's "safe haven" shrinks until it risks becoming trivial (e.g., "the theory correctly predicts observations," which is just instrumentalism).

  The debate is **substantive** because it is a disagreement about **Epistemic Risk Management**.
  *   **The Anti-Realist** argues that the risk of ontological commitment is unmanageable because the "signal" (truth) is indistinguishable from the "noise" (empirical adequacy) in real-time.
  *   **The Realist** argues that the risk is manageable because there are identifiable markers of "theoretical depth" that correlate with retention.

  ### 2. The Specific Blockage: The Granularity Problem
  You asked if the blockage is about historical standards, reference preservation, or a formal distinction. It is primarily about **Granularity**, which manifests as a problem of **Retrospective Cherry-Picking**.

  **The Mechanism of the Loop:**
  1.  **Realist Claim:** "We kept the structural relations of Fresnel's equations; therefore, we can trust the structural relations of QM."
  2.  **Anti-Realist Counter:** "You only know those relations were the 'core' because you are looking from the future. To a Fresnel contemporary, the *ether* was the core, and the equations were just descriptive tools."
  3.  **The Blockage:** There is no **forward-looking criterion** for distinguishing core from periphery.
      *   If you define the "core" as "what survives," you are circular (you need to know the future to be a realist now).
      *   If you define the "core" by some intrinsic property (e.g., "mathematical elegance," "causal depth"), the anti-realist points to historical cases where those properties led to false ontologies (e.g., Kepler's musical harmonies were elegant and central; they were false).

  **The Reference Trap:**
  The disagreement about reference preservation is a symptom of the Granularity Problem.
  *   Realists say: "Electron" referred to the same entity in 1900 and 2000.
  *   Anti-realists say: "Electron" in 1900 implied a classical billiard ball; "Electron" in 2000 implies a quantum excitation. The reference shifted because the *description* shifted.
  *   **The Blockage:** We lack a semantic theory that allows reference to remain stable across radical conceptual change without making the term so thin it loses explanatory power.

  ### 3. Diagnosis: Why It Won't Die
  The debate doesn't resolve because it is trying to solve a **local problem with a global metric**.
  *   **Global:** "Is science *generally* true?"
  *   **Local:** "Is *this specific posit* in *this specific domain* likely to survive?"

  The PMI works globally (sure, some stuff changes). Selective Realism works locally (sure, *some* stuff stays). They talk past each other because the Realist retreats to local stability when attacked globally, and the Anti-Realist attacks global reliability when the Realist claims local success.

  ### 4. What Would Count as Progress?
  You asked for a taxonomy, a formal line, or acceptance of ill-posedness.

  **A. A Formal Line (Unlikely)**
  Do not expect a sharp formal distinction between core and periphery. Theory change is not algorithmic; it is sociological and cognitive. A formal rule (like a Ramsey sentence) usually ends up either too weak (capturing only observations) or too strong (capturing false ontology).

  **B. Acceptance of Ill-Posedness (Partially)**
  The question "Is science true?" is ill-posed. It should be decomposed. Progress requires abandoning **Global Scientific Realism**.

  **C. A Taxonomy of Preservation (The Real Path)**
  Progress looks like a **Typology of Theoretical Retention**. Instead of asking "True or False?", we categorize *how* theories change.
  *   **Ontological Elimination:** Phlogiston (gone completely).
  *   **Ontological Reduction:** Heat -> Kinetic Energy (concept absorbed into a deeper one).
  *   **Structural Isomorphism:** Fresnel's equations (math stays, ontology shifts).
  *   **Approximate Limit:** Newtonian Gravity (false strictly, but valid as a limit case of GR).

  **The Metric for Progress:**
  If Realists can show that **Structural Isomorphism** and **Approximate Limit** cases are statistically more frequent in mature sciences than **Ontological Elimination** cases, they win. If Anti-Realists show that **Elimination** is the norm even in mature sciences, they win.

  Currently, both sides cherry-pick the history to fit their taxonomy. Progress requires a blinded historical audit: Take a snapshot of theory posits at Time T, categorize them by "centrality" using criteria available *at Time T*, and check their status at Time T+1.

  ### Summary
  *   **Structure:** Substantive disagreement about **projectibility**, masked as a debate about induction.
  *   **Blockage:** The **Granularity Problem**. We cannot non-circularly identify the "truth-bearing" parts of a theory before the next revolution occurs.
  *   **Resolution:** Stop asking if theories are "true." Start measuring **rates of structural retention** across different scientific domains. The debate dies when we realize Realism might be true for Chemistry but false for Cosmology. The "Global" question is the trap.
