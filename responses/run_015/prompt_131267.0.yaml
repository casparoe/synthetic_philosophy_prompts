answer: |-
  # The Galilee Protocol: A Workflow for Historical Verdicts

  ## Part 1: The One-Page Procedure
  *Keep this on your desk. Run every item (saying, action, event) through these steps in order. Stop at the first "STOP" unless noted.*

  **STEP 1: The Context Filter (One-Way Filter)**
  *Question:* Could this physically, linguistically, or culturally exist in 1st-century Galilee/Judea?
  *   **Pass:** Yes, it fits the time/place. → *Go to Step 2.*
  *   **Fail:** No (e.g., later theology, anachronistic technology, Greek concepts unknown to Aramaic speakers). → **STOP. Verdict: No Historical Support.** (Do not label "False".)
  *   *Note:* Passing does not prove it happened. Failing kills it.

  **STEP 2: Multiple Attestation (Crude Independence Test)**
  *Question:* Is this found in more than one independent tradition?
  *   **The Crude Test:** Count "Voices," not books.
      *   Voice 1: Mark, Matthew, Luke (Synoptics count as **one** voice).
      *   Voice 2: John.
      *   Voice 3: Paul's letters.
      *   Voice 4: Non-canonical early texts (e.g., Thomas, Gospel of Peter).
  *   **Pass:** 2+ Voices (e.g., Mark AND John). → *Verdict: High Historical Probability.*
  *   **Fail:** 1 Voice or None. → *Go to Step 3.*

  **STEP 3: The Embarrassment & Orphan Test (Confirmators)**
  *Question A (Embarrassment):* Does this make the early church look bad or confused? (e.g., Jesus baptized by subordinate, Jesus cries out in abandonment).
  *   **Yes:** Boosts probability.
  *   **Question B (Explanatory Orphan):** Does this explain a feature of the movement that later theology wouldn't invent? (e.g., Why do we follow a crucified man?)
  *   **Yes:** Boosts probability.
  *   **No:** Proceed to Step 4.

  **STEP 4: The Dissimilarity Cap (Gate)**
  *Question:* Are we keeping this *only* because it's weird/unlike Judaism and unlike the Church?
  *   **Check:** Look at your season's "Unique Jesus Material" (stuff not in the Gospels).
  *   **Cap:** Max **20%** of Unique Material can rest mainly on this test.
  *   **Pass:** Under cap. → *Go to Step 5.*
  *   **Fail:** Over cap. → **STOP. Verdict: No Historical Support.** (Cut or merge with attested material.)
  *   **Tie-Breaker:** If two scenes compete for the last slot, keep the one with higher **Dramatic Necessity**.

  **STEP 5: Coherence (Tie-Breaker Only)**
  *Question:* Does this fit the picture of Jesus we've already built from Steps 1-4?
  *   **Yes:** Supports inclusion.
  *   **No:** Do not cut solely on this. Use only to choose between two otherwise equal options.
  *   *Warning:* Do not use this to build the picture; it is circular.

  **STEP 6: The Values Handoff (Decision Point)**
  *Question:* Is the Historical Verdict "No Support" or "Mixed," but the Dramatic Need is high?
  *   **Yes:** → **HANDOFF.** Decision goes to **Faith Board + Standards.**
      *   *Condition:* You must flag the uncertainty. Narrator hedging is **only** legitimate here (e.g., "The story says...", "Tradition holds..."). Do not use hedging if Step 1 failed.
  *   **No:** → **WRITER'S CALL.** You have historical cover.

  ---

  ## Part 2: Reasoning & Mechanics

  **1. Ordering Logic**
  We start with **Context (Step 1)** because it is the only true gate. If Jesus is quoting the Quran, nothing else matters. It is a **One-Way Filter**: it can kill an item, but passing it proves nothing (later legends fit the setting too).
  We move to **Attestation (Step 2)** because it is the strongest positive evidence available to a non-specialist.
  We use **Embarrassment/Orphan (Step 3)** as boosters because they explain *why* something survived transmission.
  We place **Dissimilarity (Step 4)** late and capped because overusing it creates a Jesus who belongs nowhere.
  We relegate **Coherence (Step 5)** to a tie-breaker because you are correct: it is circular. It confirms bias rather than testing it.
  We end with **Values (Step 6)** because history often runs out of data before drama does. That is where the board earns their fee.

  **2. The "Inauthentic" Rule**
  Your consultant is right. Failing a test means "We cannot support this historically," not "This definitely did not happen." In your workflow, a "Fail" equals **No Verdict**. For a public broadcaster, "No Verdict" functions as a "Cut" unless overridden by dramatic necessity (Step 6).

  **3. The Dissimilarity Cap (20%)**
  **Defense:** If more than 20% of your unique material relies on Jesus being unlike his context and unlike his followers, you are creating a caricature.
  **Tie-Breaker:** When two scenes compete for the last slot under the cap, prioritize **Dramatic Necessity**. History cannot decide between two equally dissimilar inventions; let the story decide.

  **4. Multiple Attestation (Crude Test)**
  **The Trap:** Counting Matthew and Luke as two sources. They copied Mark.
  **The Fix:** Group the Synoptics (Mark/Matt/Luke) as **One Voice**. John is a **Second Voice**. Paul is a **Third Voice**. If you have Voice 1 + Voice 2, you have independence. This is crude but safe enough for drama.

  **5. The "Explanatory Orphan" Test**
  **Verdict:** **Keep it.** This is historically known as "Plausibility of Effect."
  **Where it misfires:** When the "explanation" is actually a later theological justification retrojected into the story.
  *   *Good Orphan:* Jesus' crucifixion explains why the movement almost died (a scandal they wouldn't invent).
  *   *Bad Orphan:* A saying that perfectly solves a church debate from 90 CE (likely invented to explain the debate).
  *   *Test:* Ask, "Does this solve a problem for the *characters* in the scene, or a problem for the *church* fifty years later?" If the latter, it fails.

  ---

  ## Part 3: Case Studies

  ### 1. The Baptism by John
  *   **Step 1 (Context):** Pass. John baptized in Jordan; Jesus was a contemporary.
  *   **Step 2 (Attestation):** Pass. Mark (Voice 1), John (Voice 2), Josephus (Voice 3). High Probability.
  *   **Step 3 (Embarrassment):** Pass. Early church struggled to explain why the Son of God submitted to a subordinate.
  *   **Step 4 (Dissimilarity):** N/A (It is attested).
  *   **Verdict:** **Event: Yes.** **Saying: No Verdict** (Dialogue is likely later reconstruction). **Staging: No Verdict** (Heavens tearing open is theological staging).
  *   **Weakest Link:** The visual staging. You can show the baptism, but the "voice from heaven" should be subjective (Jesus' POV) or ambiguous to maintain historical cover.

  ### 2. The Cry from the Cross
  *   **Step 1 (Context):** Pass. Aramaic cry fits.
  *   **Step 2 (Attestation):** Pass. Mark (Voice 1), Matthew (Voice 1), John (Voice 2 - different words but same sentiment).
  *   **Step 3 (Embarrassment):** Pass. "My God, why have you forsaken me?" is deeply problematic for later Christology.
  *   **Step 4 (Dissimilarity):** N/A.
  *   **Verdict:** **Event: Yes** (He cried out). **Saying: Mixed.** (The Aramaic *Eloi* is likely; the Psalm 22 interpretation is likely early church framing). **Staging: Pass** (Bystanders misunderstanding fits the chaos).
  *   **Survival:** Keep the cry. Keep the confusion. You may stage the Psalm connection as a bystander's *interpretation*, not narrator fact.

  ### 3. Barabbas & Pilate Washing Hands
  *   **Step 1 (Context):** **Fail/No Verdict.** No historical evidence of a Passover amnesty custom. Pilate washing hands is Roman ritual only in Matthew (Voice 1).
  *   **Step 2 (Attestation):** **Fail.** Only Synoptics (Voice 1). John mentions release but not Barabbas specifically in the same way.
  *   **Step 3 (Embarrassment):** **Fail.** This shifts blame from Rome to Jewish leaders. This serves later church needs (appeasing Rome), not embarrassment.
  *   **Step 6 (Values Handoff):** **TRIGGERED.**
  *   **Verdict:** **Historical Support: None.** **Dramatic Value: High.**
  *   **Action:** You cannot run this as fact.
      *   *Option A (Cut):* Safest for standards.
      *   *Option B (Hedge):* Legitimate here because Step 1 didn't kill it (it's *possible*, just unproven), but Step 2/3 failed.
      *   *Required Hedging:* Narrator must frame this as "The story passed down..." or "Pilate, according to the tradition..." Do not stage Pilate washing hands as a visible historical fact without a visual cue that this is symbolic or reported.
      *   *Board Note:* Explicitly tell the board: "History gives no verdict here. We are keeping this for narrative climax, acknowledging the theological bias."

  ---

  ## Part 4: Calls This Procedure Cannot Make

  1.  **Theological Truth:** This procedure tests historical plausibility, not spiritual validity. It cannot tell you if Jesus *was* the Son of God, only if the claim fits a 1st-century context.
  2.  **Moral Offense:** It cannot predict if a scene will offend believers. It only flags when history is silent, handing the moral risk to the Board.
  3.  **Dramatic Quality:** A scene can pass all historical tests and be boring. You retain final veto on drama.
  4.  **Absolute Negatives:** It cannot prove something *didn't* happen. It can only say "We have no support for this."
