      *   *Resource Egalitarianism (Dworkin-style):*
          *   Metric: Resources (income/wealth).
          *   Responsibility: Compensates for brute luck (impairment), not option luck (expensive tastes).
          *   Ana: Impairment is usually brute luck. She needs compensation to reach the "insurance" level. Her happiness is irrelevant (adaptation problem).
          *   Ben: Expensive tastes are usually his responsibility. No compensation. His unhappiness is irrelevant.
          *   *Verdict:* Ana is disadvantaged (needs more resources). Ben is not.
      *   *Capability Approach (Sen/Nussbaum-style):*
          *   Metric: Capabilities (freedom to achieve functionings).
          *   Responsibility: Nuanced. Focus on real freedom.
          *   Ana: Impairment reduces capability set (conversion factor). Adaptation (happy slave/satisfied disabled) is a problem for *preference satisfaction* metrics, but CA looks at *freedom*. Even if she is happy, her capability set is restricted. She has a claim.
          *   Ben: Expensive tastes. If the vocation is a central functioning, does he have a claim? Usually, CA is skeptical of expensive tastes *if* they are cultivated voluntarily. However, if the capability to pursue meaningful work is central, there might be tension. But standard CA aligns with RE here: cultivated expensive tastes don't generate claims.
