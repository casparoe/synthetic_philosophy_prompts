          *   *Correction:* This is the deepest confusion. Gödel's theorem applies to systems strong enough to represent arithmetic (specifically, recursive functions). MIU is *not* that strong. It's a typographical system.
          *   *Incompleteness:* Gödel showed that in sufficiently powerful systems, there are true statements that cannot be proven *within* the system.
          *   *MIU Status:* MIU is decidable. We *can* determine if any string is a theorem (using the modulo 3 invariant). So MIU is actually "complete" in a sense (or rather, the set of theorems is recursive).
          *   *The "Trick":* Gödel numbering allows a system to talk about itself. MIU lacks the machinery to talk about numbers or its own syntax *within* its own rules.
          *   *Transparency:* The user is right that MIU is transparent to us. That's precisely because it's *weak*. Gödel's point is that once a system is *strong* enough to do arithmetic, it becomes *opaque* to itself (it can't prove its own consistency/completeness).
