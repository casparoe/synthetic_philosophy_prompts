      *(Refining Point 1)*: The user suggests adding a fifth rule. Hofstadter would say that's "cheating" relative to the puzzle, but "creative" relative to the system design. But the puzzle is a test of *perception*, not rule-making. The "jump out" is seeing the number theory hidden in the typography.

