prompt: |-
  I run the weekly challenge session at a small grantmaking foundation: five analysts, each assigned to tear holes in somebody else's funding case, and I write the one-page note that goes to the board under my name. Roughly twice a month a case stalls because two people are arguing past each other in a way that more evidence won't fix — typically over what counts as evidence at all: one analyst holds that nothing that hasn't been replicated in a randomized trial is evidence, another that a mechanism plus a field visit is. I've tried the usual rationalist toolkit on these — steelmanning, double crux, asking what would change your mind — and it fails in a specific way: it presumes the disagreement bottoms out somewhere arguable. The answer I get back is often "nothing", and "nothing" is ambiguous between a refusal to engage and the honest report that the claim in question is load-bearing for everything else the person is doing.

  Which is why I've been working through Wittgenstein's late notes on certainty, published after his death as On Certainty, and the literature that calls the propositions at the bottom of that structure hinges: not known, not inferred, not doubted, but the frame inside which knowing, inferring and doubting have the sense they have — closer to the riverbed that the water runs through than to a belief floating in the water, though the riverbed can shift over time. Please turn this into a procedure my team can actually run: twenty minutes alone at a desk, in writing, with no philosophy training, on a claim that has deadlocked a dispute, and in a form I can audit before the note goes out.

  What I need is the tests, in the order they should be applied, for sorting a stalled claim into (1) an ordinary empirical question whose evidence test the two sides simply haven't specified, (2) a genuine clash between frameworks that no evidence will settle for the people holding them, and (3) a hypothesis someone has insulated from criticism by treating it as though it were a hinge — together with what to do in each case (send it back for a number and a date, escalate it to the board as a scope-and-values decision, push back and demand the argument), what counts as a sufficient answer to each test, where the sequence stops early with a firm verdict, and where it has to hand the decision to a person because the question is one of commitments rather than facts.

  Then run it on three cases: the randomized-trial-versus-mechanism stalemate above; an analyst who refuses to put any probability on a low-base-rate catastrophic risk on the grounds that any number would be spurious; and my own standing rule that we only fund interventions whose impact can be measured, which I expect the procedure to treat less kindly than I do. Finally, tell me honestly what a procedure like this cannot do: where it will misfire, which of its verdicts I should be most suspicious of, and how it might end up as a convenient vocabulary for people to stop arguing earlier than they should.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small grantmaking foundation, weekly challenge session. 5 analysts, 1 director (user). Goal: One-page note to the board.
      *   **Problem:** Stalled disputes (twice a month) where analysts argue past each other. Not about *more* evidence, but *what counts* as evidence (epistemological clashes). Rationalist tools (steelmanning, double crux) fail because the disagreement is about "hinges" (Wittgensteinian certainties), not arguable claims.
      *   **Task:** Create a 20-minute written procedure based on Wittgenstein's *On Certainty* (hinge epistemology) to classify stalled claims into three categories:
          1.  Ordinary empirical question (needs specific evidence test).
          2.  Genuine framework clash (needs board/values decision).
          3.  Insulated hypothesis (masquerading as a hinge, needs pushback).
      *   **Requirements:** Tests in order, stopping rules, sufficient answers, actions for each category, audit-able format. No philosophy training needed for analysts.
      *   **Application:** Run the procedure on three specific cases:
          1.  RCT vs. Mechanism/Field Visit (the prompt's example).
          2.  Low-base-rate catastrophic risk (refusal to assign probability).
          3.  Director's rule: "Only fund measurable impact" (self-critique).
      *   **Critique:** Honest assessment of limitations, failure modes, and risks of the procedure itself.

  2.  **Develop the Procedure (The "Hinge Audit"):**

      *   *Concept:* Wittgenstein's "hinges" are things we don't doubt because doubting them undermines the whole language game. They aren't "known" in the standard sense; they are the scaffolding.
      *   *Goal:* Distinguish between a brick that's loose (empirical), a different building style (framework), and a brick painted to look like scaffolding (insulation).
      *   *Structure:* Needs to be a worksheet. 20 minutes. Written.
      *   *Step 1: The Evidence Test (Is it empirical?)* Can we imagine a world where this is false? If yes, what data changes your mind? If "nothing," move to Step 2.
      *   *Step 2: The Cost of Doubt Test (Is it a hinge?)* If you doubt this, does the rest of your analysis collapse? Or does it just get harder? If it collapses, it's likely a hinge (Category 2). If it just gets harder, they might be insulating (Category 3).
      *   *Step 3: The Community Test (Is it shared?)* Is this hinge shared by the foundation/board, or is it personal to the analyst? Shared = Framework Clash. Personal = Insulation.
      *   *Refinement:* Make it actionable. Use specific prompts.
      *   *Decision Tree:*
          *   Passes Step 1 -> Category 1 (Send back for metrics).
          *   Fails Step 1, Passes Step 2 (Personal/Idiosyncratic) -> Category 3 (Pushback).
          *   Fails Step 1, Passes Step 2 (Shared/Foundational) -> Category 2 (Escalate).

      *   *Drafting the Worksheet:* Needs clear headers. "The Claim," "Test 1: The Falsification Imagining," "Test 2: The Collapse Test," "Test 3: The Foundation Check."

  3.  **Run the Procedure on the Three Cases:**

      *   *Case 1: RCT vs. Mechanism.*
          *   Analyst A (RCT): "Nothing counts without RCT."
          *   Analyst B (Mechanism): "Mechanism + Visit counts."
          *   Application: Is this empirical? No, it's definitional. Is it a hinge? For A, RCTs are the bedrock of "proof." For B, causal stories are the bedrock. Is it shared? The Foundation hasn't decided.
          *   Verdict: Category 2 (Framework Clash). Needs board decision on risk tolerance/epistemology.
      *   *Case 2: Low-Base-Rate Catastrophe.*
          *   Analyst: "Won't assign probability. Spurious."
          *   Application: Can they imagine it being false? Yes (it could happen). What changes mind? Nothing (refusal to model). Cost of doubt? If they assign a number, they feel they lose intellectual honesty.
          *   Nuance: Is "numbers are spurious" a hinge or insulation? It's often insulation against looking foolish. But it can be a methodological hinge (Knightian uncertainty).
          *   Verdict: Likely Category 3 (Insulation) *unless* the foundation adopts a specific stance on Knightian uncertainty. Usually, in grantmaking, "no number" is a way to avoid responsibility. I should lean towards Category 3 but acknowledge the philosophical depth (Knight vs. Bayes). Let's call it Category 3 (Insulated Hypothesis) because *some* number is needed for decision making, even if wide.
      *   *Case 3: Director's Rule ("Only fund measurable impact").*
          *   Application: Is this empirical? No, it's a rule. Cost of doubt? If we fund unmeasurable things, the Director's reporting system collapses.
          *   Is it shared? The Board expects metrics.
          *   Critique: This excludes high-risk/high-reward or systemic change which is hard to measure.
          *   Verdict: Category 2 (Framework Clash). The procedure should flag this as a *value* choice, not an objective truth. It limits the foundation's scope. This answers the user's expectation that it will treat this rule "less kindly."

  4.  **Critique the Procedure (The "Honest Assessment"):**

      *   *Limitations:* It can't solve the clash. It just labels it.
      *   *Misfire Risk:* Analysts might game it. "My preference is a hinge."
      *   *Suspicious Verdict:* Category 2 is the danger zone. It becomes a "too hard" bucket.
      *   *Premature Closure:* People might use "It's a hinge" to stop arguing before exhausting empirical avenues.
      *   *Power Dynamics:* The Director (user) holds the pen on the audit. Bias risk.

  5.  **Refining the Output:**

      *   *Tone:* Professional, precise, slightly philosophical but grounded in operations.
      *   *Format:* Clear sections. The Procedure first, then the Case Studies, then the Critique.
      *   *Wittgensteinian Fidelity:* Ensure "hinge" isn't used as a synonym for "strong belief." It must be about the *conditions of possibility* for the argument.
      *   *Actionability:* Ensure the "What to do" sections are concrete (e.g., "Return for specific metric," "Board Memo," "Challenge Memo").

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Category 2 and 3 clearly?
      *   *Fix:* Category 2 is *legitimate* foundational divergence (values/mission). Category 3 is *illegitimate* dogmatism (hiding a guess as a rule). The test needs to focus on *alignment with Foundation Mission* to distinguish these.
      *   *Check:* Is the Director's case handled fairly?
      *   *Fix:* Yes, the procedure should reveal that "measurability" is a strategic constraint, not an epistemic necessity.
      *   *Check:* Is the time limit realistic?
      *   *Fix:* Keep the worksheet to 4-5 key questions.

  7.  **Final Polish:** Check against the prompt's specific constraints (20 mins, written, audit-able, specific verdicts). Ensure the Wittgenstein reference is functional, not decorative. (e.g., using the "riverbed" metaphor in the instructions).

  *(Self-Correction on Case 2)*: The "refusal to assign probability" on low base rate events is a classic debate (Tetlock vs. Taleb). If the analyst says "any number is spurious," they are claiming the *method* is invalid, not just the number. This is a methodological hinge. However, in a grantmaking context, *inaction* is also a decision. If they refuse to quantify, they are effectively assigning 0 or 'ignore'. The procedure should flag this as Category 3 (Insulation) because they are avoiding the *work* of uncertainty management, unless the Foundation explicitly adopts a "precautionary principle" without quantification. I will categorize it as 3 but note the nuance.

  *(Self-Correction on Case 3)*: The user expects the procedure to treat their rule "less kindly." This means the procedure should identify it as a *choice*, not a *fact*. It should land in Category 2 (Framework/Values), meaning it's open to board challenge, not an operational given.

