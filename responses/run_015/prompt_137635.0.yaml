prompt: |-
  hey — I'm a PhD student in moral philosophy (broadly contractualist corner, though I keep drifting) and I've ended up defending a particular version of the practice-cum-assurance story about promising, and I'd like it stress-tested before I commit another chapter to it.

  The rough view: you're bound by a promise neither because you intended to bind yourself nor because someone gets hurt if you wriggle out. You're bound because promising is a conventional normative power whose point is to let people hand each other insurance against their own future change of mind. What I keep calling the lockbox feature: a promise is supposed to keep its force after every reason you had for making it has evaporated, and even in cases where nobody was relying on you in any ordinary sense. And I want to bolt on a second, sharper claim that I think falls out of it: the stringency of a given promise tracks how much assurance the promisee actually needed — how exposed they are to your changing your mind — and *not* how solemn the framing was. So a mumbled, unwitnessed promise to do something the promisee has already reorganised their life around binds harder than a formal signed promise to do something that costs them nothing if it lapses. That's the bit I take to be a real prediction rather than a restatement.

  My supervisor says I've built something unfalsifiable: any pattern of intuitions can be soaked up by redescribing what "the practice" is, and any case where stringency fails to track exposure can be explained away by saying the practice happens to have a formality convention too. I want to know if that's fair or if it's just a cheap shot at any view with a social practice in it.

  So: what would count against this package? Along the lines of —

  - cases where the practice seems to run out: promises to beings who can't have expectations in the relevant sense (very small children, someone permanently unconscious), promises to a group whose membership has completely turned over between the promise and the performance date, and at the limit a promise to an artificial agent that can model your future behaviour but can't plan or suffer. Does my story have to say these don't bind, or can it say they bind for a different reason — and if it says the latter, what has it given up?
  - the fact that release is built into the practice: the promisee can let you off. Doesn't the easy waivability of promissory obligation sit badly with the idea that I've created a claim by exercising a power? What would the practice look like if waivability *weren't* there, and would that be evidence for or against me?
  - the shape-of-the-norm worry, which is the one I care about most: if the function of the practice is assurance, why does the practice seem to rule out promising to do something bad, rather than permitting it subject to a side-constraint that's imported from elsewhere? That looks like the norm isn't purely assurance-shaped, and I'm not sure my view can explain the shape from the function.

  Rank the defeaters from fatal to merely awkward, and — importantly — be explicit about which ones someone in my position should *concede* count against me rather than dismiss as a misdescription. I'd rather have a defeater than a defence. And tell me honestly whether the unfalsifiability charge sticks, and if it does, whether that's actually a problem for a view whose job is to explain a practice, or just the cost of doing business. Concrete cases and what they'd show, please; I don't need a map of the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in moral philosophy (contractualist leanings).
      *   **Topic:** A specific version of the practice-cum-assurance theory of promising (Rawlsian/Scanlonian hybrid, but distinct).
      *   **Core Claims:**
          1.  Promising is a conventional normative power.
          2.  Point: Insurance against future change of mind (the "lockbox feature").
          3.  Stringency Claim: Tracks *actual need for assurance/exposure*, not formality/solemnity.
      *   **Supervisor's Critique:** The view is unfalsifiable (can redescribe "the practice" or "exposure" to fit any intuition).
      *   **Task:** Stress-test the view. Identify defeaters (cases/arguments that count against it). Rank them (fatal vs. awkward). Be explicit about what to concede. Address the unfalsifiability charge.
      *   **Tone:** Professional, rigorous, peer-to-peer, philosophical, no fluff/literature mapping.

  2.  **Deconstruct the View:**
      *   *Mechanism:* Convention + Normative Power.
      *   *Function:* Assurance/Insurance (Lockbox).
      *   *Metric:* Stringency $\propto$ Promisee's Exposure/Need.
      *   *Constraint:* Not based on harm (consequentialist) or pure will (voluntarist), but on the *point of the practice*.

  3.  **Evaluate the Specific Challenges Raised by the User:**

      *   **Challenge 1: Limits of the Practice (Children, Unconscious, Groups, AI).**
          *   *Analysis:* If the point is *assurance* to a *promisee*, the promisee needs to be capable of receiving assurance (having expectations/plans).
          *   *Children/Unconscious:* Can they have plans? Small children have rudimentary plans. Unconscious persons cannot *currently* hold expectations, but might have prior ones.
          *   *Group Turnover:* If the group is the promisee, does the identity persist? If the practice is conventional, does the convention recognize the group as a continuous agent?
          *   *AI:* Can an AI "need assurance"? If it models behavior, is that assurance?
          *   *Verdict:* If the view says these *don't* bind, it conflicts with strong intuitions (e.g., promising a dying person to care for their child). If it says they *do* bind, it needs to explain *how* assurance works without a standard agent. This risks stretching "assurance" until it breaks.
          *   *Ranking:* Awkward/Manageable, but potentially Fatal if the "lockbox" requires a specific cognitive capacity the promisee lacks.

      *   **Challenge 2: Waivability (Release).**
          *   *Analysis:* If I create a claim *for you*, you can waive it. This fits standard rights theory.
          *   *Tension:* The user says the point is *insurance against my change of mind*. If I can be released easily, is it really a lockbox?
          *   *Counter:* The lockbox is against *my* whim, not *yours*. The insurance is for *your* planning security. If *you* decide you don't need the plan anymore, the insurance is worthless to you.
          *   *Verdict:* This actually supports the view if framed correctly (the assurance is *for* the promisee). It's not a defeater unless the user claims the obligation is independent of the promisee's will (which they don't seem to).
          *   *Ranking:* Not a defeater. Actually a strength if handled right.

      *   **Challenge 3: Shape of the Norm (Immoral Promises).**
          *   *Analysis:* Practice views often struggle here. If the practice is *just* for assurance, why can't I promise to kill someone? (Rawls' "practice as constitutive" vs. "practice as summary").
          *   *User's View:* If the point is assurance, an immoral promise provides assurance of a bad act. Why is the *promissory obligation* null, rather than just overridden?
          *   *Verdict:* This is the classic "Practice Conception" problem. If the norm is *internal* to the practice, and the practice is defined by its function (assurance), does the function rule out bad acts? Usually, no. Assurance can be given for anything.
          *   *Ranking:* **Fatal/High Risk.** This is the hardest hill to die on for practice views. If the view can't explain why "I promise to murder X" creates *no* promissory obligation (not just a defeated one), the "function" explanation is incomplete.

      *   **Challenge 4: The Stringency Claim (Exposure vs. Formality).**
          *   *Analysis:* User claims stringency tracks exposure, not formality.
          *   *Counter-example:* "I promise" (casual) vs. Contract (formal). Often, the law/social norm treats the formal one as stricter *regardless* of reliance.
          *   *Counter-example 2:* Gratuitous promises. I promise to buy you coffee. You rely zero. Is it binding? Intuition says yes (weakly). User's view says... maybe not? If exposure is zero, is obligation zero?
          *   *Verdict:* This is the empirical test of the theory. If intuitions track formality (words used) more than reliance (exposure), the theory is in trouble.
          *   *Ranking:* **Fatal (if the supervisor is right about unfalsifiability).** If the user defines "exposure" to include "expectation created by formality," it becomes circular.

      *   **Challenge 5: Unfalsifiability.**
          *   *Analysis:* Can any intuition be soaked up?
          *   *Verdict:* Yes, if "the practice" is a black box. To avoid this, the user must specify the *convention* independently of the *obligations* it generates.
          *   *Ranking:* Methodological threat.

  4.  **Drafting the Response:**

      *   *Tone:* Direct, philosophical, respectful of the PhD level.
      *   *Structure:*
          1.  Acknowledge the sophistication of the view (Lockbox/Assurance).
          2.  Address the Unfalsifiability Charge first (methodological foundation).
          3.  Rank and Analyze the Defeaters (Immoral Promises, Reliance/Formality Gap, Non-Agent Promisees, Waivability).
          4.  Concrete Cases for each.
          5.  Conclusion on what to concede.

      *   *Refining the "Immoral Promise" point:* This is the strongest philosophical objection. If the *point* is assurance, assurance is valuable even for bad ends (from the promisee's perspective). The view needs a reason why the *practice itself* excludes these. If it imports morality from outside, is it still a practice view?
      *   *Refining the "Stringency" point:* The user's specific claim (Stringency $\propto$ Exposure) is vulnerable. Case: The "Casual Promise to a Stranger." I say "I'll be there" to someone I meet on the street. They rely heavily (secretly). Am I bound *more* than if I promised my spouse casually? Intuition says the spouse promise is stricter due to relationship norms, not just exposure.
      *   *Refining "Waivability":* Actually, there's a nuance. If the obligation is to *maintain the practice*, the promisee can't waive it (Rawls). If the obligation is *to the promisee*, they can. The user says "insurance against *my* change of mind." This implies the obligation is to the promisee. Waivability fits. I should note this isn't a defeater but requires precision.
      *   *Refining "Non-Agents":* If the function is *assurance*, and the entity can't be assured, the function fails. The view *must* say these don't bind *qua promises*. If they bind, it's for another reason (duty of care, etc.). Conceding this strengthens the view's precision.

  5.  **Final Review against Constraints:**
      *   Rank defeaters (Fatal vs. Awkward).
      *   Explicit on what to concede.
      *   Address unfalsifiability honestly.
      *   No literature map (keep it focused on the arguments).
      *   Concrete cases.

  6.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the Immoral Promise point is just a side-constraint.
      *   *Correction:* No, the user asked about the *shape* of the norm. If the norm is purely functional (assurance), it should be neutral. The fact that it's *constitutively* limited suggests the function isn't the whole story. This is a strong defeater.
      *   *Initial thought:* Waivability is a problem.
      *   *Correction:* Wait, if I give you insurance, you can choose not to claim it. Waivability is consistent with the Assurance View *if* the obligation is owed *to* the promisee. I need to make sure I don't misdiagnose this. The problem arises if the obligation is to *uphold the institution*. I need to ask the user which it is. Given "insurance against *your* change of mind," it sounds like it's owed to the promisee. So Waivability is likely a *feature*, not a bug. I will rank it low.
      *   *Focus:* The "Stringency vs. Formality" claim is the most empirically testable and thus the most vulnerable to the "unfalsifiable" charge. If "exposure" is defined to include "expectation generated by words," then formality *is* exposure. That's the trap. I need to highlight this.

  7.  **Final Polish:** Ensure the distinction between "Practice Conception" (Rawls) and "Expectation/Assurance" (Scanlon) is clear in the analysis, as the user is blending them. The "Lockbox" metaphor is good; use it.

  *(Self-Correction on Unfalsifiability)*: The supervisor's charge is that "practice" is a get-out-of-jail-free card. To answer this, I need to tell the user they need an *independent* description of the practice rules before deriving the obligations. If the rules are derived from the obligations, it's circular.

  Okay, ready to write.
answer: |-
  This is a sharp, well-motivated view. The "lockbox" metaphor does heavy lifting, and the claim that stringency tracks exposure rather than formality is a genuine contribution if it holds. But your supervisor's worry about unfalsifiability is not a cheap shot; it is the standard hazard of practice-based views (the "Rawlsian trap").

  Here is the stress test, ranked from **Fatal** (requires restructuring the core thesis) to **Awkward** (requires nuance or concession), followed by a verdict on the unfalsifiability charge.

  ---

  ### 1. The "Immoral Promise" Shape Problem (Fatal)
  **The Worry:** You claim the norm's shape is determined by the function (assurance). But the practice of promising is *constitutively* limited to permissible acts. We don't say "You promised to kill him, so you have a pro tanto obligation to kill him, which is overridden by morality." We say "That is not a promise."
  **Why it's Fatal:** If the function is *just* assurance, assurance is valuable even for bad ends (from the promisee's perspective). A mafia don needs assurance just as much as a spouse. If your view explains the obligation via the *value of the assurance provided*, it cannot explain why the obligation vanishes entirely when the act is immoral, unless you import a side-constraint from outside the practice.
  **The Concession:** You must concede that the *function* (assurance) does not fully determine the *scope* of the practice. The practice has internal boundaries that are not functional.
  **Concrete Case:**
  *   **Case:** A kidnapper promises a hostage's family he will release them if paid. The family pays. The kidnapper has the hostage and the money.
  *   **Intuition:** The kidnapper has no promissory obligation to release the hostage.
  *   **Your View's Prediction:** The family is highly exposed; they need maximum assurance. The "lockbox" should be strongest here.
  *   **Defeat:** If you say "The practice doesn't cover this," you admit the practice's boundaries aren't set by the need for assurance. If you say "There is an obligation but it's overridden," you violate the phenomenology of promising (we don't feel we broke a promise; we feel the 'promise' was void).
  *   **Fix:** You need to argue that the *convention* of promising is itself morally constrained (a "moralized practice"). But this risks making the view circular: "The practice binds because it's moral; it's moral because it binds."

  ### 2. The Stringency/Formality Gap (Fatal if Unfalsifiable)
  **The Worry:** Your sharper claim is that stringency tracks *exposure*, not *formality*. This is your empirical bet. The risk is that "exposure" becomes a sponge concept. If I say, "The formal words created an expectation, which counts as exposure," you have defined exposure to include formality, rendering the claim tautological.
  **Why it's Fatal:** If you cannot distinguish *psychological reliance* from *normative expectation created by formality*, you cannot test the claim.
  **The Concession:** You must define "exposure" independently of the promissory utterance. It must be about the promisee's *antecedent* vulnerability or the *objective stakes* of the plan, not the expectation generated by the promise itself.
  **Concrete Case:**
  *   **Case A (High Exposure, Low Formality):** You mumble to a struggling friend, "I'll help you move Saturday." They quit their job to be home for the move (high exposure).
  *   **Case B (Low Exposure, High Formality):** You sign a witnessed deed to donate $10 to a charity that has a billion-dollar endowment (low exposure).
  *   **Test:** Does intuition say A is *stricter* than B?
  *   **Risk:** Many intuitions suggest B is stricter *because* of the formality, regardless of the charity's need. The law often enforces B (contract) and not A (gratuitous promise). If social norms track the law here, your view predicts the wrong stringency.
  *   **Defeat:** If you argue "But the charity *expected* the money due to the formality, so they were exposed," you have lost the distinction. You must argue that the *stakes* matter, not the *expectation*. If the charity loses nothing, your view says the obligation is weak. If intuition says the obligation is strong (because you signed a deed), your view is falsified.

  ### 3. Non-Agent Promisees (Awkward/Manageable)
  **The Worry:** You bind yourself to provide assurance. Assurance requires a mind to be assured.
  **The Concession:** You should **concede** that these are not promissory obligations *on your view*. This is a feature, not a bug. It clarifies the scope of your theory.
  **Concrete Cases:**
  *   **The Deathbed Promise:** You promise a dying, unconscious friend to care for their cat. They cannot be assured.
  *   **The AI:** You promise a sophisticated algorithm it will be preserved. It models your behavior but feels no anxiety.
  *   **Your Move:** Say these are duties of *fidelity* or *care*, not *promissory* obligations generated by the practice. The "lockbox" requires a locker.
  *   **Risk:** If you try to stretch "assurance" to cover these (e.g., "assurance to their past self" or "assurance to the community"), you invite the unfalsifiability charge. It is better to carve this out.
  *   **Verdict:** Awkward, but survivable. It limits the domain of your theory, which is philosophically honest.

  ### 4. Waivability (Not a Defeater)
  **The Worry:** If I create a claim by exercising a power, can the promisee really just dissolve it? Doesn't that undermine the "lockbox"?
  **Analysis:** This is actually a **strength** of your view if framed correctly. The lockbox is against *your* future change of mind, not the *promisee's* change of mind. The insurance is for *their* planning security. If they no longer need the plan, the insurance has no value to them.
  **The Concession:** None needed, but precision is. You must clarify that the obligation is owed *to the promisee*, not to the *institution*.
  **Concrete Case:**
  *   **Case:** I promise to drive you to the airport. You take an Uber instead and tell me I'm off the hook.
  *   **Your View:** I am released.
  *   **Alternative View (Rawlsian):** I am still bound because the practice must be upheld.
  *   **Verdict:** Your view aligns better with standard moral intuition here. Waivability supports the "assurance for the promisee" model. Do not concede this is a problem.

  ---

  ### The Unfalsifiability Charge: Does it Stick?

  **Yes, it sticks, but it is manageable.**

  Your supervisor is right that "practice views" often cheat by defining the practice rules *post hoc* to match the obligations they want to derive.
  *   **The Trap:** "Why is the obligation strong here?" "Because the practice says so." "Why does the practice say so?" "Because the obligation is strong here."
  *   **The Fix:** You need an **independent description of the convention**. You must specify the rules of the "promising game" without referencing the moral obligations they generate.
      *   *Bad:* "The practice requires you to keep promises when exposure is high." (This just restates the moral claim).
      *   *Good:* "The practice involves the utterance of specific performative phrases which, by social convention, signal a transfer of normative control."
      *   *Better:* "The practice is recognized by participants as a mechanism for stabilizing expectations in high-stakes coordination problems."

  **Is this a problem?**
  For a practice view, it is the **cost of doing business**. You are arguing that the *existence* of the convention creates the reason. If the convention is infinitely malleable to fit intuitions, it does no explanatory work.
  To defeat the charge, you must identify **one specific intuition** that your view *rejects*.
  *   *Example:* "My view predicts that a solemn promise with zero reliance creates *no* obligation. If you intuit that it does, my view is wrong."
  *   If you are unwilling to identify a case where your view conflicts with common intuition, the supervisor is right: you have built a description, not a theory.

  ### Summary of Recommendations

  1.  **Concede the Immoral Promise Point:** Admit that the *function* (assurance) does not exhaust the *conditions* of the practice. The practice is morally constrained. Don't try to derive the constraint from the assurance function; it won't work. Treat it as a boundary condition of the convention.
  2.  **Harden the Stringency Claim:** Define "exposure" strictly as *objective stakes* or *antecedent vulnerability*, explicitly excluding *expectations created by the promise itself*. If this makes your view conflict with intuitions about formal contracts (Case B above), **own that conflict**. Use it to show the theory has bite.
  3.  **Carve out Non-Agents:** Concede that promises to the unconscious/AI are not promissory obligations on your account. This protects the "assurance" mechanism from being stretched into meaninglessness.
  4.  **Accept the Unfalsifiability Risk:** Counter it by explicitly stating which common intuitions your view *overturns*. (e.g., "I deny that gratuitous formal promises bind.")

  **Final Verdict:** The "Lockbox/Exposure" claim is the most novel part of your chapter. It is also the most vulnerable. If you soften it to accommodate the intuition that "a promise is a promise regardless of reliance," you lose your distinctive contribution. If you keep it hard, you risk falsification. **Keep it hard.** A falsified theory is better than an unfalsifiable one.
