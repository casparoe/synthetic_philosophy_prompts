      *   *Key Distinction:* Lewis's PP relates credence to *uncentered* chance. If the chance function itself is centered, PP might hold. But standard chance functions aren't centered.
      *   *The "Prof's Point":* Why is it Thirderism? Because Thirders say $C(Heads) = 1/3$ in Sleeping Beauty despite $Ch(Heads) = 1/2$. They do this by treating "waking up" as evidence. The user's view does exactly this. I need to explain *why* that might be a problem (e.g., conflict with Bayesian updating).
      *   *Formal Result:* Mention the *Incompatibility of PP and Conditionalization* in self-locating contexts (Weintraub, Meacham).
      *   *Admissibility:* Lewis defines admissibility relative to the time of the chance. Self-locating info is about the time of the *agent*. This mismatch is the crux.

  8.  **Final Polish:** Check tone. Ensure "Fatal" vs. "Awkward" ranking is clear. Ensure the "Admissibility" specific claim is addressed directly. (The user thinks their view handles admissibility differently; I need to show if that holds water).

