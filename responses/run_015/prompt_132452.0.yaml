answer: |-
  To construct this character's judgment, we must distill his Montaigne-esque skepticism into operative principles. Based on the charted verdicts you provided, three candidate rules emerge that could drive his reasoning.

  **Candidate Rule 1: The Anti-Cruelty Maxim**
  *Derivation:* Drawn from his comparison of Brazilian cannibalism to European torture. He judges barbarism not by the act (eating vs. burying) but by the *quality* of the act (swift honor vs. prolonged suffering).
  *Prediction for Aelonians:* **Approval.** Since the Aelonian practice involves no violence, no prolonged suffering, and no hypocrisy, it clears the primary threshold of barbarism. It is arguably *more* civilized than European burial, which he might view as rotting the dead in the ground while pretending to honor them.

  **Candidate Rule 2: The Customary Equivalence Principle**
  *Derivation:* Drawn from his views on nakedness, diet, and mourning. He sees customs as arbitrary products of climate and habit, lacking objective natural authority.
  *Prediction for Aelonians:* **Neutrality.** He would refuse to condemn the practice as "unnatural," viewing it as merely one more variation of human habit, no better or worse than European cremation or interment. However, this rule alone does not explain why he actively *defends* Brazilian cannibalism over European torture; it only explains why he doesn't dismiss it outright.

  **Candidate Rule 3: The Context of Consumption**
  *Derivation:* Drawn from the specific defense of eating *enemies* under a warrior code. This rule suggests consumption is permissible when it serves a social function (war, honor, vengeance) but might be suspect when applied to kin (piety, family).
  *Prediction for Aelonians:* **Ambivalence or Condemnation.** While the Brazilians ate enemies (outsiders), the Aelonians eat ancestors (insiders). This rule might trigger a deeper revulsion, viewing the consumption of kin as a violation of the specific "honor" code that justified the Brazilian practice.

  **Best Guess and Reasoning**
  Your character would likely **judge the Aelonian practice as acceptable, and perhaps superior to European customs.**

  The reasoning rests on the hierarchy of his values. While Rule 3 (Context of Consumption) presents a hurdle, Montaigne's primary polemic is against *cruelty* and *hypocrisy* (Rule 1), not against the violation of specific taboos regarding the dead. In "Of Cannibals," Montaigne argues that eating the dead is less barbaric than torturing the living. The Aelonians remove the violence entirely, leaving only the consumption. Since your character explicitly rejects "universal natural law" (Rule 2) and admits his own preferences are mere habit, he lacks the footing to call the Aelonians "unnatural." Furthermore, the Aelonian motive (ecological continuity, gratitude) mirrors the "honor code" of the Brazilians but without the bloodshed. The absence of suffering trumps the shock of the taboo. He would likely view European revulsion as proof of European arrogance, not Aelonian barbarism.

  **Stress Test Hypothetical**
  To separate **Rule 1 (Anti-Cruelty)** from **Rule 2 (Customary Equivalence)**, introduce the **Society of the Mutilated Devotees**.
  *Case:* In this society, adolescents voluntarily and consensually cut off a finger during a coming-of-age ceremony. The act is painless (due to an anesthetic herb), culturally coherent, and motivated by religious gratitude.
  *Separation:*
  *   **Rule 2 (Equivalence)** predicts **Acceptance**: It is merely a custom, arbitrary like nakedness or mourning.
  *   **Rule 1 (Anti-Cruelty)** predicts **Condemnation**: Even if painless, it inflicts permanent bodily harm and loss of function without necessity, which may cross a threshold of "cruelty to the self" or violate the integrity of the person in a way eating the dead does not.
  *   *Result:* If your character condemns this while accepting the Aelonians, Rule 1 is subordinate to a deeper principle of bodily integrity. If he accepts both, Rule 2 (Relativism) is the dominant driver. If he accepts the Aelonians but condemns the Mutilators, it confirms that *suffering* is not his only metric, but rather *utility* and *non-violence* combined.

  Verdict: The practice is deemed less barbaric than European burial, governed by the Anti-Cruelty Maxim.
