      *   *The Bundle Theory vs. Substance:* Is the self a thing (substance) that *has* thoughts, or just a bundle of thoughts happening in sequence?
      *   *Temporal Persistence:* Even if an "I" exists *now*, does the "I" of a second ago equal the "I" of now? Descartes needs a persistent soul/substance to ground knowledge and God later. The *Cogito* only guarantees existence *at the instant of the thought*.

