answer: |-
  You have a remarkably clear grasp of the Basic Argument (BA) for someone who "looted a reading pile" over a weekend. Your summary of the regress problem—specifically the requirement of *causa sui* (self-creation)—is spot on.

  You are asking two distinct but deeply connected questions: one metaphysical (does indeterminism save us?) and one practical (how should we live if the argument is sound?). Here is the breakdown for your seminar prep and your 2 AM debates.

  ### 1. Is the Basic Argument just Determinism in disguise?

  You are hitting on the most common objection to Strawson, and your intuition is sharp: *If the past doesn't fix the future, doesn't the regress stop?*

  Strawson insists the argument is neutral between determinism and indeterminism. Here is exactly where the argument bites in an indeterministic world, and why "quantum noise" doesn't help you.

  **The Dilemma of "Flowing From"**
  For you to be responsible for an action, the action must issue from your character, motives, and reasons (it must be *yours*).
  *   **Case A (Determinism):** Your action is fully determined by your character. But you didn't choose your character. So you aren't responsible. (This is the version you already understand).
  *   **Case B (Indeterminism):** Suppose there is indeterminism. This means your character *plus* the laws of nature do *not* fully determine the action. There is a gap.

  **Why Indeterminism Fails the BA**
  If there is a gap between "who you are" and "what you do," then the action is not fully explained by "who you are." If the choice is not fully determined by your mental state, then part of the explanation for why you chose X over Y is **randomness** (quantum noise, chance, etc.).

  Strawson's point is that randomness does not grant freedom; it destroys authorship.
  *   If your choice is determined by your character, you need responsibility for your character (Regress).
  *   If your choice is *not* determined by your character (indeterminism), then the choice is partly accidental. You can't be responsible for an accident.

  **Where the Regress Bites**
  The regress isn't about causal chains; it's about **authorship**. To be ultimately responsible, you must be the *ultimate author* of your will.
  *   If indeterminism exists in the *formation* of your character (e.g., random genetic mutations, random environmental impacts), you are not responsible for those random inputs. You are still the product of factors you didn't choose (genes + environment + luck).
  *   If indeterminism exists in the *moment of choice*, you lose control.

  So, the argument is neutral because it presents a dilemma: **Either your actions are determined by your nature (and you didn't choose your nature), or they are not determined by your nature (and they are partly random).** Neither route leads to Ultimate Responsibility. Indeterminism doesn't stop the regress; it just changes the texture of the impossibility from "inevitability" to "luck."

  **Seminar Tip:** If you bring this up, frame it as the "Luck Objection." Ask: *"If indeterminism breaks the link between character and action, doesn't that make the action random rather than free? And if it doesn't break the link, aren't we back to determinism?"* Strawson agrees with you here; he thinks indeterminism is no help.

  ### 2. The Practical Implications: Resentment and the Two Strawsons

  This is where your 2 AM fight gets interesting. You are logically consistent with Galen Strawson; your roommate is pragmatically consistent with P.F. Strawson (Galen's father).

  **The Logical View (Yours)**
  If the Basic Argument is sound, then **retributive resentment** is indeed irrational. Retributive resentment presupposes that the other person *could have done otherwise* in a way that was ultimately up to them. If they couldn't have (because they aren't *causa sui*), then blaming them for "desert" is like blaming a tiger for eating you or a car for breaking down.
  Your shift to viewing blame as a "training technique" (forward-looking, consequentialist) is the logically consistent move for a hard incompatibilist. You are keeping the *utility* of blame (modifying behavior) while discarding the *metaphysics* of blame (moral desert).

  **The Pragmatic View (Your Roommate's)**
  Your roommate is invoking P.F. Strawson's famous paper *"Freedom and Resentment."* P.F. Strawson argued that even if determinism is true, we cannot and should not abandon reactive attitudes (resentment, gratitude, love) because they are constitutive of human relationships. To stop feeling resentment is to step outside the "participant stance" and view people as objects to be managed.

  Your roommate is right that Galen Strawson does not explicitly command us to become emotional robots. In fact, Galen has written that while the *belief* in desert is false, the *feelings* are deeply ingrained. He suggests that realizing the truth should mitigate *rage* and *retributive hatred*, but perhaps not eliminate all reactive attitudes.

  **Who is overshooting?**
  *   **You:** You are not logically wrong. If desert is impossible, resentment based on desert is technically a cognitive error. However, you might be psychologically overshooting. Humans are not designed to live purely on logical conclusions. Trying to suppress resentment entirely can lead to a detached, inhuman perspective (what P.F. Strawson called the "objective stance").
  *   **Your Roommate:** He is right that we can't just "turn off" resentment, but he might be wrong if he implies the resentment is *justified*. He is making a pragmatic retreat: "It might be metaphysically false, but it's socially necessary."

  **The Synthesis**
  You aren't wrong to feel that the *justification* for resentment has evaporated. But your roommate is right that the *practice* of resentment is resilient.
  *   **Gratitude:** You can still feel gratitude, not because they "deserved" credit, but because their action benefited you and reinforces a bond.
  *   **Resentment:** You can still feel it, but you should recognize it as a natural emotional reaction (like flinching from fire) rather than a moral judgment on their soul.

  **Seminar Tip:** This is a great point to raise. Ask: *"Galen proves Ultimate Responsibility is impossible. But does that entail we should abandon reactive attitudes, or just modify our understanding of them? Is there a gap between the metaphysical impossibility of desert and the psychological impossibility of dropping resentment?"*

  ### Summary for your Seminar Appearance

  1.  **On Determinism:** You are right to be skeptical that it's "just determinism." The argument bites harder than that. It says indeterminism gives you *less* control, not more. The regress stops nothing because randomness isn't a "self."
  2.  **On Resentment:** You are logically consistent, but your roommate is practically wise. The Basic Argument destroys the *justification* for retributive blame, but not necessarily the *utility* or *psychology* of it. You can treat blame as training (as you are doing) without pretending people are objects, provided you acknowledge the tension.

  **One warning:** Since you are auditing unofficially, be careful not to dominate the room. Your understanding is solid, but undergrad seminars can be fragile. Frame your points as questions ("I'm struggling to see how indeterminism avoids the regress...") rather than declarations ("Here is why indeterminism fails").

  Enjoy the seminar. It sounds like you've already done the hard work.
