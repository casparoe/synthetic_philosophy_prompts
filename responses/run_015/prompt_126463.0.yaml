      *   **Moral Status:** Since moral status requires freedom (autonomy) and the capacity to recognize the moral law, a system determined by functional arbitration (even if complex) lacks freedom. It is a product of nature/mechanism, not a free agent. Thus, it would be classified alongside automata (things), not persons.

