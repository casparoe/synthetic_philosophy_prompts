answer: |-
  **The Case of the Silent Rota**

  Dr. Aris logs into the hospital's mandatory shift-swap portal on Tuesday and enters a request against Dr. Benet's Saturday clinic slot, typing in the required comment field: "I promise I will cover your Saturday clinic." Aris clicks "Commit." The system instantly updates the official master rota, marking Benet as "Off" and Aris as "On Call," and logs the transaction in the departmental audit trail. However, the system's notification protocol is broken; no alert is sent to Benet, and Benet never checks the portal for changes initiated by others, assuming he will be contacted personally for swaps. On Saturday, Benet does not arrive, expecting to work; Aris does not arrive, expecting the system update to suffice. The clinic is left unmanned.

  ***

  ### Framework Analysis

  **1. Austin's Felicity Framework**
  For Austin, the securing of uptake is a necessary condition for the successful performance of an illocutionary act (*How to Do Things with Words*, Lecture VIII). Without the hearer's recognition that the act is being performed, the act misfires. In this case, the procedure (the portal) was executed, and the speaker had the requisite authority and sincerity, so this is not an *abuse* (which requires insincerity or subsequent failure to act). Instead, it is a *misfire* of the specific subtype where uptake is not secured. The institutional log does not count as the hearer; Benet is the necessary audience for the promise to bind him.
  *   **Verdict:** No promise was made.

  **2. Searle's Constitutive-Rule Analysis**
  Searle analyzes promises via four conditions: Propositional (future act of speaker), Preparatory (hearer prefers act, speaker can do it), Sincerity (speaker intends to do it), and Essential (counts as undertaking an obligation). In this scenario, all four conditions are met by Aris at the moment of submission. Following your reading, Searle distinguishes the performance of the act from the *illocutionary effect* on the hearer. The constitutive rules of the institution (the portal) were satisfied, rendering the act complete regardless of Benet's epistemic state. The failure is one of communication, not of act-performance.
  *   **Verdict:** Yes, a promise was made.

  **3. A Gricean Intention-Recognition Account**
  On a Gricean view, a non-natural meaning (and by extension, a communicative illocutionary act) requires that the audience recognize the speaker's reflexive intention to produce a certain effect. Aris intended to induce an obligation/belief in Benet, but Benet did not recognize this intention. Aris *expressed* an intention (in the log) but did not *communicate* it. When the act fails in this way, there is no illocutionary uptake. However, a normative residue remains: Aris may be morally blameworthy for negligence or for creating a situation of reliance, but this is a moral failing, not the breach of a communicative promise.
  *   **Verdict:** No promise was made.

  **4. A Practice-Based or Scorekeeping View**
  On a Brandomian scorekeeping model, commitments are deontic statuses attributed by the community. The "score" is updated by public moves within the practice. Here, the hospital's practice treats the portal log as the authoritative scorekeeper. The public record shows Aris as committed and Benet as released. Because the obligation is a matter of public standing rather than private psychology, Benet's ignorance is a failure of his own scorekeeping diligence, not a failure of the commitment to exist. For this verdict to hold, the practice must treat the *log* as the binding authority, not the *notification*.
  *   **Verdict:** Yes, a promise was made (obligation exists).

  ***

  ### Closing Analysis

  **1. The Structural Feature and Pivot Sentence**
  The single structural feature doing the work is the **decoupling of institutional registration from personal reception**. The case turns entirely on this sentence: *"However, the system's notification protocol is broken; no alert is sent to Benet, and Benet never checks the portal for changes initiated by others, assuming he will be contacted personally for swaps."* This creates a gap where the public record (Searle/Practice) says one thing, but the private epistemic state (Austin/Grice) says another.

  **2. Ablation Tests**
  *   **Test A (Remove Channel):** Aris drafts the message in a personal email but never hits send, or hits send and it stays in the Outbox. The institutional rota is *not* updated.
      *   *Changes:* Searle and Practice verdicts flip to **No**. Without the constitutive convention (sending/logging) or the public score update, the rules aren't met.
      *   *Result:* All frameworks agree (No promise). The case collapses into the uninteresting "unheard utterance" dispute you wished to avoid.
  *   **Test B (Channel + Read):** The notification works, and Benet reads it the next morning.
      *   *Changes:* Austin and Grice verdicts flip to **Yes**. Uptake and intention-recognition are secured.
      *   *Result:* All frameworks agree (Yes promise). Consensus returns, and the philosophical tension vanishes.

  **3. Defender's Lines of Attack**
  *   **The Austinian Defense:** An Austinian would argue the scenario rigs the definition of "uptake." In institutional contexts, the *institution* is the relevant hearer, not the individual. If the rota (the institutional ear) heard the promise, uptake is secured. The failure is perlocutionary (Benet didn't act), not illocutionary.
  *   **The Searlean Defense:** A Searlean would argue you are conflating the *existence* of the obligation with its *enforceability*. The promise exists because the rules were followed; the fact that Benet cannot claim breach because he didn't know is a separate legalistic or practical matter, not a linguistic one. The act was performed; the consequence is just muted.
  *   **The Gricean Defense:** A Gricean would reject the application of the framework entirely. Gricean meaning is about *communication*, not *commitment*. One can undertake an obligation without communicating it (e.g., a silent vow). The framework is being asked to solve a normative problem with a semantic tool, which is a category error.
