prompt: |-
  I'm a junior and I lead one discussion section a week — fifty minutes, about fifteen first-years — for our intro course in comparative ethics. The students have just come out of two weeks on Aristotle (aretē, habituation, the function argument, phronesis, and a lot of practice applying the doctrine of the mean), and next week the syllabus gives me exactly one session on early Confucian ethics. I want to spend it on the reading of that material as role ethics rather than as virtue ethics: the point of the unit is the contrast with what they just learned, and I'd rather they not file Confucius away as Aristotle with Chinese names. So please don't explain Confucian role ethics to me — plan how I should teach it in that slot, treating the Aristotle they've just had as simultaneously my best hook and my biggest obstacle.

  Concretely, four things. First, the order the ideas have to go in, with the dependencies made explicit rather than asserted. My instinct is that nothing lands until they see the constitutive claim — that on this kind of view a person is made up of her roles rather than being an antecedently existing individual who then takes roles on — and that this has to be in place before either filial piety or humaneness gets introduced, because otherwise the one reads as a duty attached to an already-given agent and the other as generic benevolence. Tell me whether that really is where to begin, and what else has to be on the board first. Second, the single case or example that should carry the whole session, and what it has to have and lack. My candidate is the exchange in the Analects where Confucius is asked about a son who turns in his father for stealing a sheep and answers, more or less, that father and son should cover for each other and that being upright consists in that concealment: it forces the point that the very same act changes its valence with the relationship, and it makes the class's first objection audible instead of my having to invent it. But I'm afraid it will eat the hour in a debate about corruption and nepotism, or collapse into so it's all just relative, and I keep considering alternatives — something mundane and modern, like a teaching assistant who is also someone's friend, or the move from family to state that the texts themselves make — though I suspect the latter will just make them hear patriarchal hierarchy. Argue me into one of these or into something better, and say what the carrying case must contain (improvisation within a role? a real collision between two roles?) and what it must not contain.

  Third, the misconceptions they will form, in roughly the order they'll form them, and the exact point in the sequence where I should head each one off. I'm expecting role ethics says do whatever your society expects as the big one; also that it's virtue ethics with the virtues renamed; that if the person is relational then there is no self left and nobody is responsible for anything; that filial piety means obedience — I want gently remonstrating with a parent to appear somewhere, and I'm not sure where in the arc it belongs; and that the view has nothing to say about how to treat strangers, so it isn't a moral theory at all. Add the ones I haven't listed, including any that my Aristotle framing specifically invites. Fourth, one question for the last five minutes that would show me they've got the constitutive claim and are applying it rather than parroting it — I was going to hand them a role we never discussed and ask what being good at it consists in, but tell me if that's gameable, and what the tell would be. And then tell me what I should openly decline to cover at this level: I'm inclined to skip the scholarly fight over whether the early texts are better read as a species of virtue ethics or as something irreducibly role-based, and to skip the disagreement about whether human nature is already disposed toward the virtues or has to be shaped by training and ritual, but say plainly if cutting either of those costs me the session.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** Junior undergraduate, leading one 50-minute discussion section.
      *   **Students:** 15 first-years (freshmen).
      *   **Course:** Intro to Comparative Ethics.
      *   **Previous Content:** Two weeks on Aristotle (aretē, habituation, function argument, phronesis, doctrine of the mean).
      *   **Current Content:** One session on Early Confucian Ethics.
      *   **Pedagogical Goal:** Teach Confucianism as *Role Ethics* (constitutive roles), explicitly contrasting it with Aristotelian *Virtue Ethics* (individual agent cultivating character). Avoid the "Aristotle with Chinese names" trap.
      *   **Constraints:** 50 minutes, 15 students.
      *   **Specific Requests:**
          1.  Order of ideas (dependencies explicit).
          2.  Single case/example (argue for/against the "Father-Son Sheep" case).
          3.  Misconceptions (order of appearance + intervention points).
          4.  Final assessment question (is the "new role" task gameable?).
          5.  What to explicitly skip/decline.

  2.  **Deconstruct Request 1: Order of Ideas:**
      *   *User's Instinct:* Start with the constitutive claim (Person = Roles) before Filial Piety (Xiao) or Humaneness (Ren).
      *   *Evaluation:* This is correct. If you start with *Xiao*, students map it onto "Duty" (Kantian) or "Habit" (Aristotelian). If you start with *Ren*, they map it onto "Benevolence" (Utilitarian/Christian). The metaphysical/ontological shift must come first.
      *   *Dependencies:*
          1.  Ontology of the Self (Relational/Constitutive vs. Atomic/Individual).
          2.  Source of Normativity (Role obligations vs. Internal character/Reason).
          3.  Specific Virtues/Values (Xiao, Ren) as expressions of #1 & #2.
          4.  Moral Cultivation (Ritual/Propriety *Li* vs. Habituation).
      *   *Board Work:* Needs to visualize the "Atomic Self" (Aristotle) vs. "Nodal Self" (Confucius).

  3.  **Deconstruct Request 2: The Case Study:**
      *   *User's Candidate:* Analects 13.18 (Father conceals son's sheep theft).
      *   *Pros:* Directly challenges universalist notions of justice; highlights role-specific uprightness.
      *   *Cons:* High risk of "corruption/nepotism" derailment; cultural distance might make it feel alien rather than structural.
      *   *Alternatives:* TA/Friend (too modern/trivial?), Family to State (too hierarchical?).
      *   *Decision:* Stick with the Sheep case *but* scaffold it heavily. It's the strongest textual evidence for the constitutive claim. The risk of "corruption" is actually a feature—it forces the distinction between "Universal Justice" (Aristotelian/Modern) and "Role Uprightness."
      *   *Requirements for the Case:* Must show the *same act* has different moral valence based on the relationship. Must avoid making it look like "blind obedience."
      *   *Refinement:* Use the Sheep case, but frame it immediately through the "Constitutive Claim" lens so they don't judge it by external standards too early.

  4.  **Deconstruct Request 3: Misconceptions:**
      *   *List:*
          1.  Conformity ("Do what society expects").
          2.  Virtue Ethics Rename ("Aristotle with Chinese names").
          3.  No Self/No Responsibility ("Relational = No Agency").
          4.  Filial Piety = Blind Obedience.
          5.  No Moral Theory for Strangers.
      *   *Aristotle-Specific Trap:* "Habituation" looks like "Ritual" (*Li*). Need to distinguish *internalizing universal traits* vs. *enacting specific relational patterns*.
      *   *Intervention Points:*
          *   "Virtue Rename": Address immediately after Ontology.
          *   "Blind Obedience": Address during the Sheep case (mention remonstrance).
          *   "Conformity": Address when discussing *Li* (Ritual).
          *   "No Self": Address during the "What makes a good X?" final question.
          *   "Strangers": Address via the "expanding circles" or *Ren* as role-cultivation.

  5.  **Deconstruct Request 4: Final Question:**
      *   *User's Idea:* Hand them a new role and ask what being good at it consists in.
      *   *Risk:* Gameable? Yes, if they just list traits (honest, kind).
      *   *The Tell:* Do they describe *internal character traits* (Aristotle) or *relational dynamics* (Confucius)?
      *   *Refinement:* Make the role inherently relational (e.g., "Roommate," "Teammate"). Ask: "Is the goodness in *you* or in the *space between you and the other*?"

  6.  **Deconstruct Request 5: What to Skip:**
      *   *Scholarly Debate:* Role Ethics vs. Virtue Ethics (Van Norden vs. Ames/Rosemont). *Skip.* Too meta for freshmen in 50 mins.
      *   *Human Nature (Mencius vs. Xunzi):* *Skip.* Complicates the "Role" focus.
      *   *Cost:* Does skipping these lose the session? No, actually keeps focus sharper. The "Virtue vs. Role" debate is for the *instructor's* prep, not the students' intro.

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Timing:* 50 mins is tight.
          *   0-10: Ontology Hook (Aristotle contrast).
          *   10-25: The Sheep Case (Application).
          *   25-35: Misconception Check (Obedience/Agency).
          *   35-45: Ritual/Habituation distinction.
          *   45-50: Assessment Question.
      *   *Tone:* Respectful of the user's expertise (they know the material), but directive on pedagogy (they are a junior teaching freshmen).
      *   *Key Distinction:* Aristotle = Polishing the diamond (individual). Confucius = Weaving the net (relational).

  8.  **Refining the "Sheep" Argument:**
      *   Why keep it? Because it's the *only* text that forces the "Role > Universal Rule" point hard enough for a 50-minute session. A TA/Friend case is too weak; students will say "Well, obviously you treat friends differently." The Sheep case shocks them.
      *   How to prevent "Corruption" derailment? Explicitly bracket "Legal Justice." Tell them: "We are not asking if this is legal. We are asking what constitutes 'Uprightness' (*Zhi*) in this system."

  9.  **Refining the Misconceptions:**
      *   Add the "Ritual = Empty Routine" misconception. Freshmen hate ritual. Need to frame *Li* as the "grammar of relationships."
      *   Add the "Aristotle Trap": *Phronesis* (practical wisdom) looks like knowing how to act in a role. Distinction: *Phronesis* is the agent deciding; Role Ethics is the role dictating the shape of the action.

  10. **Refining the Final Question:**
      *   "Good Roommate."
      *   Trap: "Honest, clean, quiet." (Aristotelian traits).
      *   Target: "Someone who knows when to listen vs. talk *with this specific person*," "Maintains the shared space." (Relational).
      *   The Tell: If they talk about *properties of the person*, they missed it. If they talk about *quality of the interaction*, they got it.

  11. **Final Review against Constraints:**
      *   Did I explain Role Ethics to the user? No (they asked me not to).
      *   Did I address the four concrete things? Yes.
      *   Is the tone appropriate? Yes, peer-to-peer but authoritative on pedagogy.

  12. **Self-Correction during drafting:** I need to make sure I don't accidentally teach Virtue Ethics while trying to distinguish it. Keep the Aristotle references strictly as contrast points. Ensure the "Constitutive Claim" is the anchor for everything.

      *Wait, one nuance:* The user said "Don't explain Confucian role ethics to me." I need to be careful not to define it *for them*, but rather define how *to teach it*. I will assume they know the Ames/Rosemont framework or similar.

      *Re-evaluating the Sheep Case:* The user is worried about "nepotism." I need to give them a specific script to shut that down. "We are not evaluating the legal system. We are evaluating the definition of a 'person'."

      *Re-evaluating the Order:* User thinks Constitutive Claim first. I agree. But how to get there quickly? Start with the Aristotle summary on the board. "Who is the moral agent?"

      *Re-evaluating the Skip:* The "Virtue vs Role" scholarly debate. I should advise them to *use* the debate implicitly without naming it. Don't say "Ames argues X." Say "Some scholars read this as X, but today we are trying Y." Actually, better: Just teach Y. Don't mention X exists. It confuses freshmen.

      *Final check on time:* 50 minutes flies. The plan needs to be ruthless. Cut the "Humaneness (Ren)" deep dive. Focus on "Uprightness (Zhi)" via the Sheep case and "Ritual (Li)" as the method.

      *Let's write.*
answer: |-
  This is a tight slot, and your instinct to weaponize the Aristotle unit is correct. The danger isn't that they won't understand Confucius; it's that they will understand him *too well* through an Aristotelian lens, smoothing over the friction that makes the comparison valuable.

  Here is the plan for the 50 minutes, structured around your four constraints.

  ### 1. The Order of Ideas (Dependencies)

  Your instinct is correct: **The Constitutive Claim must be the first thing on the board.** If you introduce *Xiao* (filial piety) or *Ren* (humaneness) before establishing the ontology of the self, students will treat them as "duties" (Kantian) or "character traits" (Aristotelian).

  Here is the dependency chain you need to enforce. Do not move to step $N$ until step $N-1$ is visibly accepted by the room.

  1.  **The Ontological Premise (The Hook):**
      *   *Aristotle:* The self is antecedent. I exist, then I enter relationships, then I cultivate virtues to function well within them. (Draw a dot, then draw lines radiating out).
      *   *Confucius (Today's Lens):* The self is constituted by relationships. I do not *have* roles; I *am* the sum of my roles. Without the relationships, there is no "I." (Draw a node where lines intersect; erase the dot, leave the intersection).
      *   *Dependency:* You cannot explain why "covering for the father" is upright until they accept that the "son" does not exist independently of the "father."

  2.  **The Source of Normativity:**
      *   *Aristotle:* Norms come from *Telos* (function) + *Reason* (phronesis).
      *   *Confucius:* Norms come from the *Role Itself*. The role contains the script.
      *   *Dependency:* This must follow the Ontological Premise. If the self is the roles, then looking outside the roles for moral truth (like a universal law) makes no sense.

  3.  **The Specific Value (Uprightness/Zhi):**
      *   Now you introduce the Sheep Case.
      *   *Dependency:* This only works if 1 and 2 are on the board. Otherwise, it looks like corruption.

  4.  **The Method (Ritual/Li):**
      *   How do we learn these roles? Not just "habituation" (Aristotle), but "performative enactment."
      *   *Dependency:* This comes last. Once they know *what* we are (roles) and *what is good* (fulfilling roles), then we ask *how* we get there.

  **What else has to be on the board first?**
  Before you walk in, draw the "Aristotelian Dot" on the left side of the board. Leave the right side blank. Your first 5 minutes are dedicated to erasing the dot and drawing the "Confucian Node." Do not write "Confucius" or "Analects" yet. Write "The Moral Agent." If they leave thinking the agent is the same, the rest of the hour is noise.

  ### 2. The Carrying Case: Stick with the Sheep

  Keep **Analects 13.18 (The Sheep Case)**. Do not swap it for a TA/Friend scenario or a Family/State progression.

  **Why:**
  *   **The TA/Friend case is too weak.** Students will say, "Of course I treat my friend differently than a stranger." That confirms their bias that there is a *self* choosing to treat people differently. It doesn't prove the *self is constituted* by the friendship.
  *   **The Family/State move is too abstract.** It invites "patriarchy" critiques which, while valid, will derail the ontological point you need to land in 50 minutes.
  *   **The Sheep Case is a shock.** It violates their modern/universalist intuition of justice. That friction is where the learning happens.

  **How to prevent the "Corruption/Nepotism" derailment:**
  You must frame the question *before* you reveal the answer.
  *   *Bad Frame:* "Is it okay to hide the sheep?" (Invites legal/moral judgment).
  *   *Good Frame:* "In this system, what constitutes 'Uprightness' (*Zhi*)?"

  **What the case must contain:**
  *   **A collision of universal vs. particular:** The act (stealing) is universally "bad," but the role (son) makes the response (concealment) "good."
  *   **Improvisation within the role:** You need to mention that the father isn't just "hiding" passively. The text implies a mutual covering that preserves the relationship.
  *   **The "Zhi" (Uprightness) label:** Confucius explicitly calls this behavior *Zhi*. You must highlight that he is not saying "this is expedient," he is saying "this is the definition of moral straightness."

  **What the case must NOT contain:**
  *   **Do not discuss the legal consequences.** If a student asks, "But isn't that illegal?" you say, "We are bracketing the law to look at the moral ontology."
  *   **Do not let them solve it.** Do not ask "What would you do?" Ask "Why does Confucius call this upright?"

  **Script for the pivot:**
  When a student says, "But that's just nepotism," you say: "That is your judgment from outside the system. Inside the system, if the son turns in the father, he has destroyed the role that makes him a son. If he is no longer a son, who is left to be upright? He has sacrificed the moral agent for the sake of a rule."

  ### 3. Misconceptions (Order & Intervention)

  Here is the sequence of errors they will make, and the exact moment you cut them off.

  1.  **"It's just Virtue Ethics with Chinese names."**
      *   *When:* Minutes 5–10, during the Ontology setup.
      *   *Intervention:* When you draw the Dot vs. the Node. Explicitly say: "Aristotle asks, 'What kind of person should I be?' Confucius asks, 'What kind of relationship am I sustaining?' The first focuses on internal character; the second focuses on the space between us."
      *   *Aristotle Trap:* They will equate *Habituation* with *Ritual (Li)*.
      *   *Correction:* "Aristotelian habituation is about training your desires to match reason. Confucian Ritual is about learning the grammar of a relationship so you don't stumble. One is internal calibration; the other is external coordination."

  2.  **"Filial Piety means Blind Obedience."**
      *   *When:* Minutes 15–20, during the Sheep Case.
      *   *Intervention:* You must introduce **Remonstrance** (*Jian*) here. If you don't, they will think Role Ethics is robotic.
      *   *Script:* "Does covering for the father mean letting him keep stealing forever? No. The *Analects* elsewhere says a son must gently remonstrate. But he does it *as a son*, not as a judge. The method of correction must preserve the role."

  3.  **"If I'm just my roles, there's no Self/Agency left."**
      *   *When:* Minutes 25–30, post-case discussion.
      *   *Intervention:* Distinguish "Atomic Self" from "Relational Agency."
      *   *Script:* "You think agency means standing outside the relationship and choosing. Confucius thinks agency is the skill of *navigating* the relationship. A dancer isn't 'unfree' because she follows the choreography; she expresses agency *through* the steps."

  4.  **"This is just Conformity/Doing what society expects."**
      *   *When:* Minutes 35–40, discussing Ritual (*Li*).
      *   *Intervention:* Distinguish "Social Expectation" from "Role Ideal."
      *   *Script:* "Society might expect you to be a corrupt son. The Role of 'Son' expects you to care for the father's moral well-being. Role ethics isn't doing what people *do*; it's doing what the relationship *requires* to flourish."

  5.  **"It has no answer for Strangers (No Universal Moral Theory)."**
      *   *When:* Minutes 40–45.
      *   *Intervention:* This is the hardest one. You don't need to solve it, but you must name it.
      *   *Script:* "How do I treat a stranger? I treat them as a potential role-holder. I act toward them in a way that invites a relationship. *Ren* (Humaneness) is the ability to extend role-consciousness to everyone." (Keep this brief; don't let it bog down).

  **One Missing Misconception:**
  *   **"Ritual is empty ceremony."** Freshmen hate "ritual." They hear "rules."
  *   *Intervention:* Frame *Li* as "social grammar." You don't think grammar restricts your ability to speak poetry; it makes poetry possible. Without *Li*, you can't express the role.

  ### 4. The Final Question (Assessment)

  Your idea (hand them a new role) is good, but it is gameable. They will game it by listing Aristotelian virtues ("A good roommate is honest and kind").

  **The Fix:**
  Give them a role, but force the **Relational Syntax**.

  **The Prompt:**
  "Take the role of **'Roommate.'** Describe a situation where being a 'Good Roommate' requires you to do something that a 'Good Person' (in the abstract/Aristotelian sense) might not do."

  **The Tell:**
  *   **Fail (Aristotelian):** "A good roommate is clean and quiet." (These are traits of the individual).
  *   **Pass (Role Ethics):** "If my roommate is going through a breakup, a 'Good Roommate' stays up late listening, even if a 'Good Person' values sleep/health." OR "A good roommate knows which jokes land with *this* person, not jokes in general."
  *   **The Constitutive Check:** Look for the phrase "It depends on *who* the other person is." If they describe the goodness as residing in the *interaction* rather than the *actor*, they have the constitutive claim.

  **Alternative Prompt (if you want to be sharper):**
  "I am your TA. I am also your friend. You fail the class. As a 'Friend,' I want to comfort you. As a 'TA,' I must record the grade. In Aristotle's view, I need *Phronesis* to balance these. In the Role Ethics view we just discussed, is there a 'Real Me' deciding this? Or am I failing one of the roles?"
  *   *Target Answer:* "There is no 'Real Me' outside the roles. You have to find a way to enact the TA role that doesn't destroy the Friend role (e.g., gentle remonstrance), rather than choosing one over the other."

  ### 5. What to Decline (The Cuts)

  You are right to cut the scholarly debates. Here is exactly what to say "No" to, and why it won't cost you the session.

  1.  **The "Virtue Ethics vs. Role Ethics" Scholarly War:**
      *   *Cut:* Do not mention Van Norden, Ames, Rosemont, or the debate over whether Confucianism *is* virtue ethics.
      *   *Why:* This is meta-ethics. Your students are doing intro ethics. Telling them "Scholars fight about this" gives them permission to treat the distinction as optional. Treat the Role Ethics lens as the *method for today*, not a contested thesis.
      *   *Cost:* Zero. It clarifies the lesson.

  2.  **Mencius vs. Xunzi (Human Nature):**
      *   *Cut:* Do not discuss whether human nature is good (Mencius) or bad/needs shaping (Xunzi).
      *   *Why:* This distracts from the "Constitutive Claim." If you talk about innate sprouts of virtue, they slide back into Aristotelian "potentiality." Keep the focus on the *external structure of roles* shaping the person.
      *   *Cost:* Low. You lose some depth on *how* cultivation works, but you gain clarity on *what* is being cultivated (the role, not the nature).

  3.  **The Expansion of *Ren* (Graded Love):**
      *   *Cut:* Do not try to map out the concentric circles of care in detail.
      *   *Why:* It takes too long and invites the "Stranger" objection too early.
      *   *Cost:* Manageable. Just assert that *Ren* is the skill of extending role-sensitivity, without mapping the whole geometry.

  **The One Thing You Cannot Skip:**
  You cannot skip the distinction between **Habituation (Aristotle)** and **Ritual (Confucius)**. If you let them equate these, the whole hour collapses into "Aristotle with Chinese names." You must spend 5 minutes explicitly contrasting "internalizing a trait" vs. "enacting a pattern."

  **Summary of the 50 Minutes:**
  *   **0-5:** Board Work. Dot (Aristotle) vs. Node (Confucius).
  *   **5-15:** The Constitutive Claim. (You are your roles).
  *   **15-30:** The Sheep Case. (Applying the claim to Uprightness).
  *   **30-40:** Ritual & Remonstrance. (Addressing Obedience/Agency misconceptions).
  *   **40-45:** The Stranger Problem. (Briefly acknowledging limits).
  *   **45-50:** The Roommate/TA Assessment.

  If you hold the line on the Ontological Premise, the rest follows. If you let them keep the "Atomic Self," nothing else will land. Good luck.
