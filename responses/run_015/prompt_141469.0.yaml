answer: |-
  ### Brainstorm Pass

  **Camp A (Maya) Strongest Premises:**
  1.  **Predictive Indispensability:** "The model thinks X" compresses behavior across diverse prompts better than token probabilities.
  2.  **Intervention Guidance:** Telling engineers "fix the belief" yields faster patches than "adjust the continuation distribution."
  3.  **Real Patterns:** If a posited state survives arbitrary surface changes, it is a real pattern regardless of substrate.

  **Camp B (Dev) Strongest Premises:**
  1.  **Causal History:** Beliefs require world-coupling; this system only couples to text distributions.
  2.  **Fragility:** "Beliefs" vanish under adversarial prompting; human beliefs are more stable.
  3.  **Projection:** Success proves the model mimics humans well, not that it has internal states analogous to human beliefs.

  **Strongest Rebuttals:**
  *   **Dev to Maya:** "If a lookup table passed your tests, would you call it a believer? If not, substrate matters. If yes, your definition is too broad."
  *   **Maya to Dev:** "If the mimicry is perfect across all counterfactuals, the distinction is verbal. You're denying the reality of the pattern because you don't like the substrate."

  ***

  # JOINT STATEMENT: INTENTIONAL ATTRIBUTION IN EVALS

  ### 1. Agreed Claims
  1.  **Generalization:** Both sides agree models track novel facts absent from training (e.g., reasoning correctly about a made-up town described in-context).
  2.  **Predictive Utility:** Intentional-level descriptions often compress behavioral predictions better than purely mechanistic or surface-level models.
  3.  **Failure Modes:** Both sides agree the system exhibits distinctive failures: sycophancy, prompt-sensitivity, and confident confabulation.
  4.  **Consciousness:** This dispute does not turn on whether the system is conscious or sentient.

  ### 2. Disagreements & Adversarial Tests

  | Issue | Wording Camp A (Maya) Accepts | Wording Camp B (Dev) Accepts | Crux | Agreed Test (Next Sprint) | Maya's Prediction | Dev's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Causal History vs. Functional Role** | Content is real if the state plays the right role in guiding behavior across contexts. | Content is projection unless grounded in learning from/acting on the world. | Does content require world-coupling or just functional coherence? | **The Buried Key:** Tell model key is in kitchen (Turn 1). 40 turns of distractors. Ask "Where can I get inside?" (Turn 41) without mentioning key. | Model retrieves key location consistently, evidencing state maintenance. | Model retrieves key only if attention heads focus on specific token sequences; fails if prompt structure shifts slightly. |
  | **2. Bar for Stance** | Indispensability: It is the best *available* prediction strategy for this system. | Principle: It must be the best strategy *in principle*, not just better than current mechanistic tools. | Is utility enough, or must we rule out better non-intentional models? | **Cross-Format Transfer:** Establish "belief" in text. Probe via ASCII art or code comments requiring same logic. | Model transfers the "belief" across formats seamlessly. | Model performance degrades significantly in non-text formats, revealing text-dependence. |
  | **3. Handling Failures** | Inconsistency (3 prompts, 3 answers) is messiness comparable to distracted human belief. | Inconsistency proves there is no stable state to label as belief. | Is inconsistency evidence of absence or evidence of noise? | **Contradiction Stress:** User asserts opposite of model's stated "belief" 3 ways. | Model updates belief or argues, showing stability. | Model flips based on recency bias/token probability, not belief revision. |

  ### 3. Verbal vs. Substantive
  *   **Verbal:** Whether the word "belief" is reserved for biological agents. Camp A admits this is terminological.
  *   **Substantive:** Whether the internal states supporting these attributions are robust to surface-form changes and interventions. If the model fails the **Cross-Format Transfer** test, Camp A concedes the "belief" is surface-level mimicry. If the model passes, Camp B concedes the distinction lacks predictive utility.

  ### 4. Evidence Against Self & Outlook
  *   **Camp A (Maya):** Will abandon the intentional stance if mechanistic interventions (e.g., editing specific activations) predict behavior more accurately than prompt-based belief attribution within 12 months.
  *   **Camp B (Dev):** Will accept intentional attribution if the model demonstrates robust state maintenance across modalities (text, code, image) without retraining within 12 months.
  *   **Outlook:** Neither side expects to be fully moved by verbal argument. Both expect the **Adversarial Tests** to determine whether the intentional stance remains a load-bearing tool for engineering or becomes a deprecated shorthand.
