answer: |-
  The dust in the sluice house tasted of limestone and old paper. Fourteen hands had gone up for the amendment. Ten had stayed down. The air remained still, waiting for the arithmetic to settle the earth, but the arithmetic had split open.

  Tomas stood by the ledger, his finger on Rule 30. "Majority carries," he said. "Fourteen is more than twelve. The rule is changed. Future schedules need two-thirds."

  Kael didn't move from the door. "You used the old rule to kill the old rule. That's a trick. To change the lock, you need the key the new lock demands. Fourteen isn't sixteen. The vote is void."

  Both arguments sat in the room like stones. If Tomas was right, the minority was now bound by a rule they hadn't agreed to. If Kael was right, the majority was being held hostage by a rule they had just voted to discard. There was no ground outside the ledger to stand on. The ledger was the ground.

  Elara, the Reader, stepped forward. The room tightened. Her salary, her authority, the binding nature of her interpretation—all of it was written on page four of the very book causing the dispute. She was paid to be outside the fight, but her feet were planted in the ink.

  She opened the ledger. The paper was thick, ragged, absorbing the light. She turned past Rule 30 to her own contract, Rule 12. It had been written five years ago, during the last decadal review. It stated her rulings were final for the agricultural year. It could not be amended until the cycle turned again.

  She felt the asymmetry of it like a limp. The water schedule was fast; it shifted every year, reactive to the rain and the wheat. Her contract was slow; it was a heavy stone wheel turning once a decade. She was the fixed point, but she was fixed to a moving ship. If the ledger invalidated itself, her authority evaporated. If she validated the ledger, she chose a side.

  "The drought is here," Elara said. Her voice was flat, practiced. "The渠 (canal) is dry. We cannot wait for the logic to finish."

  "Tell them," Tomas said. "Tell them the vote stands."

  "Tell them the rules hold," Kael corrected.

  Elara looked at the page. She saw the loop. The rule governing the vote was being changed by the vote. It was a hand drawing the wrist that held the pen. She looked at her own contract again. It gave her the power to interpret "unclear text." Was this unclear? Or was it perfect, terrible clarity?

  She realized then that she was not a third hand breaking the tie. She was just another line in the drawing. Her contract was protected by the majority rule that was currently being contested. To enforce her contract, she had to assume the majority rule was still valid. To assume the majority rule was valid, she had to ignore the claim that the two-thirds rule was already in force.

  There was no exit. There was only the flow.

  She dipped the pen in the inkwell. The nib scratched against the page, loud in the silence. She did not write about the vote. She did not write about Rule 30. She wrote about the water.

  *Interpretation 44,* she wrote. *Given the ambiguity of procedural validity during drought conditions, the Reader invokes Clause 12, Section 3: Emergency Allocation.*

  She felt the weight of the slow loop protecting her. Her contract allowed this. The contract was written under the old rules. Therefore, the old rules must exist for her to exist. But if the old rules exist, the vote passed. But if the vote passed, the new rules exist.

  She stopped thinking. The pen moved.

  *Upper Terraces: Water flows Tuesday dawn to Thursday dusk. Lower Terraces: Water flows Friday dawn to Sunday dusk. Mid-valley holdings: Suspended for this season.*

  She blew on the ink. It was wet, black, and final. For this year, her slow contract overrode the fast dispute. She had used the authority of the old system to impose a solution that ignored the new system's threshold, effectively treating the vote as valid enough to empower her, but not valid enough to change the water.

  "Who gets the Tuesday flow?" Tomas asked. His voice was tight. The upper terraces were his faction.

  "Those who hold the upper deeds," Elara said. She closed the ledger. The sound was like a gate shutting.

  "And next year?" Kael asked. "When you come back to read?"

  "Next year," Elara said, "you will vote again. And you will bring your own ink."

  She walked out of the sluice house into the blinding white heat. The valley waited. The gates groaned open downstream. Water, muddy and precious, began to move into the upper channels. It did not ask permission from the rules. It followed the gradient.

  Elara touched the pocket where her contract copy lay. It was safe for five more years. She was part of the machine, drawing the hand that drew her. She walked toward the fields to watch the water hit the dry earth, listening for the sound of the logic cracking, but there was only the sound of the flow, temporary and absolute.
