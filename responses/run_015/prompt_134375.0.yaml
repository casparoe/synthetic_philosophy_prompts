answer: |-
  I constrain the possibility operator in the Knowability Principle to range only over futures physically compossible with the actual history of the universe, excluding mere metaphysical possibilities where agents exist but are not grounded in our actual causal chain. I concede freely that without this constraint the principle collapses into the absurdity that all truths are known, and I admit this restriction is not independently intuitive but is rather a necessary bulwark to save the core insight from logical self-destruction. Regarding your comet case, if the actual history of the universe precludes the existence of any agent capable of witnessing that event, then the proposition "the comet struck" is neither true nor false, because truth requires the possibility of verification within the actual world's causal limits. The realist claims it is true regardless of this impossibility, but I maintain that a truth condition that transcends all possible evidence accessible to agents compossible with our history is a condition we cannot grasp, and therefore cannot constitute a meaningful proposition.

  When you ask about the exact values of a continuously varying quantity in a region no observation ever samples, I apply the same constraint: if no agent physically compossible with our actual history could measure those values, then there is no fact of the matter about them. They are not true, they are not false, and they are not unknown; rather, the proposition asserting a specific value lacks a truth value entirely because the verification conditions cannot be met within the bounds of physical compossibility. This is what truth consists in for me: it is not a correspondence to a recognition-transcendent reality, but the ideal limit of warranted assertibility given the actual capacities and history of inquirers like us. The realist denies this limitation and posits truths that outrun all such warrants, but I argue that such posits are empty metaphors rather than genuine claims about the world.

  I am ready for your harder case where the absence of observers is nomological rather than accidental. If the laws of nature themselves preclude any observer from ever knowing a proposition, then on my view that proposition cannot be true, and I will defend that conclusion against the charge that it renders the world impoverished. My claim is not that the world depends on us for its existence, but that the *truth* about the world depends on the possibility of our recognizing it, and where that possibility is nomologically blocked, truth does not obtain. Bring your case, and I will show you how the verificationist constraint holds even when the laws of physics themselves seem to conspire against knowledge.
