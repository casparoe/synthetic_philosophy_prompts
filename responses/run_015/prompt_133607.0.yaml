  1. What the procedure is for

  This procedure translates Adam Smith's moral psychology into an administrative tool for volunteer reviewers. It is not designed to make you better people, but to make your decisions consistent despite fatigue and bias. Its primary function is to separate the question of whether a member's feelings were understandable from the question of whether their actions broke rules worthy of punishment. It forces a pause between reading the appeal and deciding the outcome, inserting a mechanical check against the natural human tendency to favor high-status members or compelling stories. It replaces moral intuition with a structured audit of propriety and merit.

  2. The procedure

  1. **Blind Reconstruction.** Rewrite the incident log using only the quoted posts and the rule cited. Remove all names, join dates, post counts, apologies, and external context like hospital visits. You must produce a neutral summary of the exchange alone.
  *Sufficient Answer:* A text exists that describes the conflict without identifying the actors.
  *Stop-with-a-no:* If you cannot separate the act from the person's history or current distress, halt the review and refer to the board.
  [This isolates the circumstance from the agent's identity to prevent admiration of rank or pity from coloring sympathy.]

  2. **Propriety Check.** Read only the Blind Reconstruction. Ask: If I were present in that moment, knowing only what was known then, would my emotional reaction match the agent's? Ignore the aftermath, the apology, and the stress. Judge only the proportionality of the sentiment to the trigger.
  *Sufficient Answer:* A clear Yes (proportionate) or No (disproportionate).
  *Stop-with-a-no:* If you find yourself forgiving the sentiment because of sad consequences later, halt and return to step one.
  [This judges the proportionality of the sentiment to its object, distinct from the outcome or the agent's character.]

  3. **Merit Check.** Read the full appeal including rules. Ask: Regardless of their feeling, does this action violate a rule designed to prevent harm? Does it deserve resentment from the community according to the written code? Good intentions do not cancel rule breaks.
  *Sufficient Answer:* A clear Yes (violation) or No (no violation).
  *Stop-with-a-no:* If you are letting their good intention cancel the rule break, halt and re-read the specific rule text.
  [This separates the propriety of the motive from the merit of the action regarding reward or punishment.]

  4. **Standing Audit.** Compare your draft decision against the member's status. Would you decide the exact same way if this was a newcomer with ten posts? Be honest.
  *Sufficient Answer:* Yes, status is irrelevant to the decision.
  *Stop-with-a-no:* If you realize you are being softer on a veteran or harder on a newcomer, halt and reset your judgment to the newcomer baseline.
  [This corrects the natural corruption of sentiments by the admiration of wealth and rank within the community.]

  5. **Disposition Mapping.** Combine the findings. Propriety No + Merit Yes equals Uphold. Propriety Yes + Merit No equals Overturn. Propriety No + Merit No (technicality) equals Reduce. Propriety Yes + Merit Yes equals Uphold with Note.
  *Sufficient Answer:* One of the four options selected based strictly on the matrix.
  *Stop-with-a-no:* If you choose an option not supported by the matrix, halt and correct the mapping.
  [This translates moral judgment into civil sanction without conflating feeling with desert.]

  3. The staged-spectator test

  Step One, the Blind Reconstruction, is the specific defense against the staged-spectator problem. To run this, open a blank document. Copy only the specific posts cited in the sanction and the specific rule text. Do not copy the user's signature, their avatar, or their join date. Do not copy the moderator's narrative description of the member's attitude. Do not copy the appeal letter's explanation of stress or apology. You are left with raw text. Read this text aloud. If you feel anger, note it. If you feel nothing, note it. This forces your imagination to occupy the scene without the furniture the parties arranged to manipulate you. It recreates the spectator's position before the bias of the performance sets in. If you cannot do this because the context is too entangled with identity, you lack the information to judge propriety.

  4. Three appeals

  **Case One.** The Blind Reconstruction removes the eleven-year standing and the hospital story. You are left with a veteran issuing a withering reply to a newcomer's first post. The Propriety Check returns No: a harsh rebuke is disproportionate to a first project thread, regardless of stress. The Merit Check returns Yes: the behavior violates community norms of welcome, deserving resentment. The Standing Audit reveals you are inclined to be softer because of his history. Correcting this, the matrix dictates Uphold. The stress explains the failure of propriety but does not excuse the merit of the sanction. The procedure returns Uphold with a Note because you are conflating explanation with justification.

  **Case Two.** The Blind Reconstruction fails immediately. You cannot rewrite the incident log using only quoted posts because the logs are partial and contradictory. You have one side's screenshots and the other's denial. You cannot know the circumstances. Smith's spectator requires knowledge of the situation to judge sentiment. Without the full exchange, the Propriety Check cannot be run. You cannot determine if the threat was real or fabricated. The procedure hits the Stop-with-a-no at Step One. You cannot separate act from identity when the act itself is disputed evidence. The disposition is Indeterminate because the procedure hits the Stop-with-a-no at Step One.

  **Case Three.** The Blind Reconstruction shows a member denouncing another for an offensive remark. The Propriety Check returns Yes: the anger at the offensive remark is proportionate and understandable. However, the Merit Check returns Yes: the action violated the specific rule against personal attacks in general threads. The rule exists to prevent exactly this kind of public shaming, regardless of the target's guilt. The Standing Audit shows no bias. The matrix dictates Uphold. Your instinct that the suspension was wrong commits the second confusion: you are letting the propriety of the sentiment cancel the merit of the punishment. The matrix dictates Uphold because you are letting the propriety of the sentiment cancel the merit of the punishment.

  5. What had to be dropped

  To make this usable in twenty-five minutes, I have flattened Smith's distinction between Justice and Beneficence. Smith argues justice is exact (don't hurt) while beneficence is free (be kind). Forums often treat rudeness as a justice violation when it is merely a lack of beneficence. This procedure treats rule breaks as justice issues to ensure consistency, potentially punishing mere unkindness too harshly. I have also removed the spectator's deep emotional resonance. Smith wants you to feel with the agent; this procedure asks you to simulate feeling without actually requiring the emotional labor. We lose the moral education of the reviewer. You become a clerk of sentiment rather than a judge of character. The procedure ensures fairness but sacrifices the potential for the review process to cultivate virtue in the reviewers themselves.

  6. Where it hands off, and what it cannot do

  This procedure hands off when the question is one of rule interpretation, not fact application. If the rule itself is ambiguous, that is for the Board, not the reviewer. It also hands off on procedural errors, such as missed timelines or wrong moderator jurisdiction. The procedure will misfire when text alone cannot convey tone, such as sarcasm or established inside jokes between long-time members. It cannot account for off-forum context that is verified but not visible in logs. It will also misfire if the community standards shift faster than the rules are updated; the spectator judges by current norms, but the rulebook may lag. Finally, it cannot stop a reviewer who lies about their Standing Audit. It relies on honest self-reporting at Step Four.
