answer: |-
  This is a heavy load to carry, and it is intellectually honest of you to press the text rather than looking for a comforting summary. Augustine is not a comforting writer on this subject; he is a surgical one. He is trying to locate the sin of lying not in the damage done to the neighbor, but in the disorder created in the soul of the speaker.

  Here is a walkthrough of the passage and your four sticking points, sticking strictly to what *De mendacio* argues.

  ### 1. The Parenthesis: Believing vs. Opining

  **The Text:** *"Sometimes he who believes feels that he does not know that which he believes... whereas he who opines, thinks he knows that which he does not know."*

  **The Explanation:**
  Augustine is making an epistemic distinction (about knowledge) to protect the definition of lying from collapsing into "saying something false." He needs to account for why someone might say something false without it being a moral failure of *honesty*, even if it is a failure of *judgment*.

  *   **Believing (Fides):** I accept something as true, but I am aware I do not have direct proof. (Example: You believe your aunt when she tells you Dot got the pie. You don't know it firsthand, but you trust the source.)
  *   **Opining (Opinio):** I claim knowledge I don't actually have. I am guessing, but I treat my guess as knowledge. (Example: You assume Dot got the pie because she always gets pie, without checking.)

  **Why the distinction matters:**
  Augustine is ruling out **error** as **lying**.
  If I say "Dot is at church," and I *believe* she is there (because someone told me), I am not lying, even if she is dead.
  If I say "Dot is at church," and I *opine* she is there (I'm guessing), I am not lying, even if I am rash to guess.

  He includes this to ensure the definition of lying rests entirely on the **will**, not the intellect. You can be intellectually negligent (opining when you should believe, or believing when you should know) and be "not without fault," but you are not a *liar* unless you knowingly say what you do not hold in your mind. He is trying to isolate the specific sin of the "double heart" from the general messiness of human error.

  ### 2. The Pie Incident (True Statement, Believed False)

  **The Scenario:** You said "Yes, she loved it." You believed this was false. It turned out to be true.

  **Augustine's Verdict:**
  You are reading this correctly. Augustine explicitly addresses this: *"He may say a true thing, and yet lie, if he thinks it to be false and utters it for true."*

  **Is this a bug?**
  No, it is load-bearing. For Augustine, the moral injury of lying is the **duplex cor** (double heart). It is the fragmentation of the self. When you speak, your words should be the outward sign of your inward mind. If your mind holds "This is false" and your mouth says "This is true," you have severed the connection between your interior and exterior self.

  The fact that the statement accidentally matched reality is irrelevant to the state of your soul. You intended to deceive. You intended for your mother to hold a belief that *you* held to be false. That is the lie.

  **The Bite:**
  On this specific text, you lied. The accidental truth does not absolve the intent. Augustine would argue you committed the act of lying, even if the material damage (misinformation) was zero.

  ### 3. "Stagehand Speech" and the Joke Analogy

  **The Theory:** Fibbing to dementia patients isn't a claim about reality; it's a conversational tool (like a stagehand moving a prop) to facilitate peace. Therefore, no "double heart" because you aren't trying to establish a fact.

  **Does the passage give this purchase?**
  Your suspicion is correct: **Augustine's text likely rejects this.** Here is why, based on the excerpt provided:

  1.  **The Joke Exemption:** Augustine exempts jokes because *"in the tone of voice, and in the very mood of the joker [there is] a most evident indication that he means no deceit."* The listener *knows* the speaker is not asserting fact.
      *   **In your case:** When you tell your mom Dot is at church, you are *not* using a tone that indicates "this is not real." You are using a tone that indicates "this is fact." You *want* her to believe it, however briefly. You are not signaling "this is a stage prop." You are signaling "this is reality." Therefore, it does not fit the joke exemption.
  2.  **The Intent to Deceive:** Augustine defines lying as having one thing in mind and uttering another.
      *   **In your mind:** Dot is dead.
      *   **In your utterance:** Dot is at church.
      *   **The Goal:** You want her mind to rest on "Dot is at church."
      *   Even if she forgets in ten minutes, *in that moment*, you are successfully planting a belief in her mind that you know to be false. That fits the definition of the "double thought."

  **Is it special pleading?**
  On Augustine's terms, yes. The "stagehand" argument tries to relocate the lie from the *assertion* to the *duration* of the belief. But Augustine locates the lie in the *speaker's intent at the moment of speech.* The fact that the listener's memory is broken does not change the fact that the speaker is intentionally asserting what they know to be false.

  Augustine does suspend judgment on whether "perfect minds" should use jokes, which shows he is wary of even harmless non-truths. But he is clear that jokes are not lies *because the intent to deceive is absent.* In therapeutic fibbing, the intent to deceive (for benevolent ends) is present.

  ### 4. Fault Without Lying vs. Lying Without Fault

  **The Text:** *"Not that he is without fault, although he lie not..."*

  **The Question:** Is there a gap the other way? Can something be a lie but *not* be the thing that is morally at issue? (i.e., A "good" lie?)

  **The Verdict:**
  **No.** There is no gap the other way in this text.

  Augustine distinguishes between **fault of error** (saying something false you thought was true) and **fault of lying** (saying something you know is false).
  *   You can have Fault without Lying (Negligence/Error).
  *   You cannot have Lying without Fault.

  For Augustine, the "double heart" is intrinsically disordered. It is a sin against God, who is Truth. Even if the lie saves a life, cures grief, or keeps the peace (the "officious lie"), it remains a moral evil. He does grade sins elsewhere (some lies are more destructive than others), but he does not allow for a lie that is morally neutral or morally good.

  **The Bite:**
  If your therapeutic fibs fit the definition of lying (which, as established in point 3, they likely do under Augustine's strictures), then they are morally problematic. There is no "necessary evil" loophole here. Augustine would argue that you are purchasing your mother's temporal calm at the cost of your own integrity before God. He would likely suggest that the grief she feels is a reality she must bear, and shielding her from it via falsehood is a spiritual harm to you, even if it is a physical comfort to her.

  ### Summary of the "Bite"

  You asked me to be plain rather than diplomatic. Here is what *De mendacio* says to your situation:

  1.  **You are lying.** When you tell your mother Dot is at church, you know she is dead. You intend for your mother to believe she is at church. That is a "double heart."
  2.  **The benefit does not cancel the sin.** The fact that it stops the sobbing makes the lie *officious* (helpful), but Augustine argues officious lies are still sins. The good outcome does not cleanse the act.
  3.  **The "Stagehand" defense fails.** Because you intend for her to believe the statement (even temporarily), it is an assertion of falsehood, not a neutral conversational token.
  4.  **The only comfort in the text.** The only comfort Augustine offers is regarding your *mistakes*. If you say something you *think* is true (like the pie incident) and it turns out false, you have not lied. But when you knowingly assert the false to soothe, you have crossed the line he draws.

  Augustine's ethics are agent-centered, not outcome-centered. He is concerned with the purity of your soul, not the management of your mother's grief. If you operate within his framework, you are in a position of moral conflict: you are choosing between charity to your mother (soothing her) and fidelity to Truth (not lying). Augustine prioritizes Fidelity. Modern caregiving ethics often prioritize Charity. The text you found does not bridge that gap; it sharpens it.
