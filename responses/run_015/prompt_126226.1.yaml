  When we worry about epistemic dependence on AI, we often conflate distinct cognitive abilities. To clarify, consider four competences: (1) producing a correct answer unaided; (2) recognizing a correct answer when shown one; (3) reconstructing a derivation step-by-step; and (4) noticing that something has gone wrong without knowing the right answer. I define a system's failures as *legible* to a user when the user can, without redoing the task, tell that an output is likely wrong based on its shape, provenance, or mismatch with expectations. The *legibility floor* is the minimum degree of such legibility a user must retain for their reliance to leave their understanding intact.

  My central claim is that understanding corresponds to competence (4) combined with the ability to diagnose the error type, not competence (1). Competence (1) is neither necessary nor sufficient. Consider the veteran engineer whose unaided calculation skills have decayed through years of delegation, yet who spots a flaw in a generated proof within seconds. They retain understanding. Contrast the student who can follow a generated derivation line-by-line (competence 3) while grasping nothing of the subject. They lack understanding. The erosion-of-understanding worry is thus not about dependence as such, but *illegible dependence*: delegation that drops the user below the legibility floor. Consequently, where tools differ, it is epistemically better to work with a weaker system whose failure modes you can predict than with a stronger system whose failures you cannot, even if the stronger system yields better final products.

  However, this account faces a steelman de-skilling objection. Alarm sensitivity is itself a competence. Like any skill, it atrophies when unexercised. If delegation reduces the frequency of error detection, the very alarm sensitivity required to stay above the legibility floor will degrade. There is no stable resting place; dependence inevitably consumes the capacity to monitor dependence.

  This generates a self-reinforcement dilemma. As a system grows more reliable, the user's optimal policy converges on deferring to it even when their alarm fires, because the alarm is likely a false positive. But a user who routinely overrides their own alarm loses the calibration that made the alarm trustworthy. Increasing reliability tends to destroy the legibility floor from under the user. Is the floor unstable? I argue it is avoidable, but only through specific design and training regimes. We must treat tool use not merely as production but as maintenance. Users must engage in mandatory "adversarial validation" sessions where they intentionally use the system in domains known to provoke errors, keeping the alarm calibrated even during periods of high reliability. Without institutionalized stress-testing, the dilemma holds, and understanding erodes.

  There is a deeper objection: the simulacrum objection. Someone who has learned where a system breaks by watching it break may predict failures accurately while having no grasp whatsoever of the domain. Their legibility is a map of the machine, not of the subject matter. Does this count as understanding? On my initial formulation, it might. This is a mistake. I must revise the position: understanding requires alarm sensitivity *grounded in domain norms*, not just statistical quirks of the model. If the alarm fires because "the syntax looks weird," that is mere pattern matching. If it fires because "this violates conservation of energy," that is understanding. The legibility floor must be defined by the user's ability to cite domain constraints, not just model artifacts. This qualification strengthens the claim: we need tools that fail in ways that reveal domain truths, not just tools that fail predictably.

  This leads to concrete institutional implications for a university department setting AI policy. Given the third part of my claim, the department should forbid the use of opaque, high-performance models in core competency courses, even if they produce superior assignments. They should permit only tools with transparent failure modes or lower capabilities that force student engagement. The department should require students to submit "failure logs" documenting where the AI erred and why, rather than just final products. They must be willing to give up the aesthetic quality of student work and the efficiency of grading. The goal is not the best essay or code, but the retention of the legibility floor. If a tool makes the work too easy to verify without understanding, it is pedagogically toxic.

  Finally, what empirical finding would most damage this argument? If studies showed that users who rely on opaque, high-reliability systems retain *higher* diagnostic skills than those using transparent, weaker systems, the argument collapses. This could happen if cognitive offloading frees mental resources for higher-order monitoring. If black-box dependence enhances rather than erodes alarm sensitivity, then the legibility floor is not tied to transparency or weakness, and my preference for weaker tools becomes an unjustified handicap. Until then, we must prioritize the legibility of failure over the quality of success.

