answer: |-
  This is a sophisticated setup. You have constructed a jurisprudence that feels real because it balances legal positivism (the Security Council text) against moral realism (the body count). The tension between *Kosovo* (illegal but good) and *Libya* (legal start, illegal finish, bad outcome) is the engine of your Commission.

  Here is the analysis of the hidden doctrine, the prediction for Tessaria, the rules that threaten to break it, and the dramatic recommendation.

  ### 1. The Prediction and the Hidden Doctrine

  **Predicted Verdict for Tessaria:**
  **Lawful in its inception, Unlawful as conducted. Not Justified.**

  **The Hidden Doctrine: The Doctrine of Limited Humanitarianism.**
  Reading across the five precedents, the Commission adheres to a specific, unstated principle: *Force is permissible to stop killing, but never to build a state.*

  *   **Lawfulness** is determined by the Security Council, but that authorization is a **trust**, not a blank cheque. If the mandate is protective (*Libya*, *Tessaria*), exceeding it into regime change breaks the trust and renders the conduct unlawful.
  *   **Justification** is determined by the **exit strategy**.
      *   *Kosovo* and *East Pakistan* are **Justified** because the interveners stopped the killing and *left* (or handed over to the UN). They did not seek to govern.
      *   *Iraq*, *Cambodia*, and *Libya* are **Not Justified** because the interveners sought to determine the political future of the target state, resulting in occupation, client regimes, or collapse.

  **Why this verdict for Tessaria?**
  Tessaria begins like *Libya* (SC Resolution for protection) but ends like *Cambodia* (Client government, decade-long occupation).
  1.  **Lawfulness:** Like *Libya*, the initial strikes were authorised. Like *Libya*, the advance on the capital and the installation of an interim administration exceeded the "protect civilians" mandate without a new resolution. Hence: *Unlawful as conducted.*
  2.  **Justification:** Like *Kosovo*, the killing stopped. However, unlike *Kosovo*, the interveners stayed for seven years, installed a dominant interim administration, and—crucially—extracted economic value (mining). This moves Tessaria out of the *Kosovo* category (reluctant saviours) and into the *Iraq/Cambodia* category (political architects with mixed motives). Hence: *Not Justified.*

  ### 2. The Competing Rules (The Underdetermination)

  The five precedents genuinely underdetermine the sixth because Tessaria is a hybrid: it has the *legal start* of Libya, the *humanitarian success* of Kosovo, and the *political footprint* of Cambodia. A careful reader could argue for three other Opinions based on rules that fit the first five equally well.

  **A. The Consequentialist Rule (The "Body Count" Doctrine)**
  *   **Principle:** Justification is a arithmetic of suffering. If the intervention prevents more death than it causes, it is justified, regardless of legal technicalities or political ambition.
  *   **Precedents:** Supports *Kosovo* and *East Pakistan* (killing stopped). Distinguishes *Iraq* (killing continued/insurgency). *Libya* is the weak point here, but can be dismissed as "net negative outcome" due to state collapse.
  *   **Tessaria Verdict:** **Justified.** The mass killing stopped within a month and has not resumed. 50,000 dead is tragic, but the counterfactual (continued crackdown/civil war) would likely be higher. The mining and occupation are regrettable taxes, not disqualifiers.
  *   **Commitment:** This commits the Commission to the view that *results matter more than process.*

  **B. The Mandate Integrity Rule (The "Fiduciary" Doctrine)**
  *   **Principle:** The Security Council's authorization is a fiduciary duty. To use a protective mandate to achieve regime change is a betrayal of the international legal order, rendering the act unlawful *and* voiding justification.
  *   **Precedents:** Strongly supports *Libya*. Explains why *Kosovo* was Unlawful (no mandate) but *Iraq* was Not Justified (false mandate).
  *   **Tessaria Verdict:** **Unlawful and Not Justified.** The moment the forces advanced on the capital, the intervention lost its moral and legal licence. The subsequent stability is irrelevant; the poison was in the overreach.
  *   **Commitment:** This commits the Commission to the view that *the rule of law is paramount, even over humanitarian outcomes.*

  **C. The Anti-Venality Rule (The "Clean Hands" Doctrine)**
  *   **Principle:** Humanitarian intervention requires altruism. If the interveners extract economic value from the crisis they resolved, the intervention is retroactively tainted as predatory.
  *   **Precedents:** This rule is *new*. It is not explicitly in the first five, but it is consistent with the *Iraq* verdict (where WMD pretext masked other interests). It distinguishes *Kosovo* (no territory claimed) from *Cambodia* (client state).
  *   **Tessaria Verdict:** **Not Justified.** Even if the killing stopped, the mining concessions prove the intervention was, in part, a business venture.
  *   **Commitment:** This commits the Commission to policing the *motives* of interveners, not just their actions.

  ### 3. The Test Case

  To distinguish these rules for a careful reader, you need a seventh case (perhaps mentioned in dialogue or a footnote) where the variables are isolated.

  **The Invented Case: "The Mercenary Rescue" (Borduria, 1994)**
  *   **Facts:** A private military company, contracted by a neighbouring state, enters a genocide zone without SC authorization. They stop the killing in two weeks. They withdraw immediately. However, they are paid in mineral rights equivalent to 20% of the rescued region's GDP.
  *   **Differentiation:**
      *   **Consequentialist Rule:** **Justified.** (Killing stopped, occupiers left).
      *   **Mandate Integrity Rule:** **Unlawful.** (No SC Resolution).
      *   **Anti-Venality Rule:** **Not Justified.** (Profit motive taints the act).
      *   **Limited Humanitarianism (Your Hidden Doctrine):** **Not Justified.** (Extraction of value violates the "no political/economic gain" norm of *Kosovo*).

  If your Commission rules *Borduria* as **Unlawful but Justified**, they are Consequentialists. If they rule **Not Justified**, they are either Legalists or Moralists (Clean Hands).

  ### 4. Dramatic Recommendation

  You asked for the option that makes the better hearing.

  **Do not write a unanimous Opinion.**
  A unanimous "Unlawful/Not Justified" Opinion creates a Commission that is rigid and perhaps bureaucratic. It gives your characters a wall to hit, but not a crack to pry open.

  **Write a Split Opinion (Majority + Dissent).**
  This creates the drama you need for the hearing.

  *   **The Majority (3 Commissioners):** Rules **Lawful in inception, Unlawful as conducted. Not Justified.**
      *   *Reasoning:* They lean on *Libya* and *Cambodia*. They argue that the mining concessions and the seven-year occupation prove this was never purely humanitarian. The "protective mandate" was a Trojan Horse for regime change and resource extraction. To justify this would be to license colonialism in humanitarian clothing.
  *   **The Dissent (2 Commissioners):** Rules **Unlawful as conducted. Justified.**
      *   *Reasoning:* They lean on *Kosovo* and *East Pakistan*. They argue that the "Perfect is the enemy of the Good." The killing stopped. The interim government, however flawed, is recognized by 70 states. The mining concessions are a scandal to be prosecuted separately, but they do not erase the 400,000 refugees who did not die. To condemn this is to privilege legal purity over human life.

  **Why this works for your novel:**
  1.  **It mirrors the real world:** This is the actual debate surrounding R2P (Responsibility to Protect) and Libya.
  2.  **It gives your characters agency:** If the Commission is unanimous, your characters are appealing a fact. If the Commission is split, your characters are appealing a *philosophy*. They can argue for the Dissent's view to be adopted as the new Majority.
  3.  **It highlights the Mining:** The Majority can use the mining concessions as the "smoking gun" that tips the scale from *Kosovo* (Justified) to *Iraq* (Not Justified). The Dissent can argue that the mining is a separate crime from the intervention itself.

  **Final Advice on the Text of the Opinion:**
  Use the specific phrasing from *Libya* ("Lawful in its inception, unlawful as conducted"). This signals to the reader that the Commission is consistent, even if the Commissioners disagree on the moral weight of that finding. It grounds your fiction in the internal logic you have built.

  The hearing then becomes a battle over whether the Commission should be a **Court of Law** (Majority view: we judge the mandate) or a **Court of Conscience** (Dissent view: we judge the outcome). That is a conflict worthy of a novel.
