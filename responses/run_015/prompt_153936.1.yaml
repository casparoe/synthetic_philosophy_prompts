      *   Provide the competing interpretations.
      *   Provide the Test Case.
      *   Advise on the Drama.

      *(Self-Correction on the "Lawful" verdict for Tessaria)*: Libya was "Lawful in its inception, unlawful and not justified as conducted." This is a specific tripartite finding. Tessaria fits this perfectly. I should recommend this specific phrasing for the Opinion to maintain continuity with Libya (Case 3). It shows the Commission is consistent.

      *(Refining the "Mining" Rule)*: The prompt asks if a fifth rule about mixed motives earns its place. Yes, it does. It distinguishes Tessaria from Kosovo. Kosovo had no stated economic gain. Tessaria does. This moves it from "Flawed Humanitarianism" (Kosovo) to "Predatory Intervention" (Iraq-adjacent).

