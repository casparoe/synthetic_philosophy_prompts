prompt: |-
  I am writing a novel whose central scene is a hearing, and before I can stage it I need to know what reasoning has to stand behind it.

  The novel's world contains a standing body — a Permanent Commission on the Use of Force — which publishes Opinions on historical interventions. Each Opinion returns two verdicts: one on lawfulness, understood as whether the force was authorised by the Security Council, and one on justification, understood as whether, all things considered, it ought to have been done. I have drafted five Opinions as the background against which my characters argue. Now I have to draft the sixth, on the invented intervention the novel turns on, and I want it to be an Opinion my readers cannot dismiss as arbitrary: it has to follow from the five, and before I write it I want to know what exactly it is following from. I am not asking for the correct doctrine of humanitarian intervention; I am asking what doctrine my Commission has been running without quite saying so.

  The five, as drafted:

  1. Kosovo, 1999. A North Atlantic alliance bombed a sovereign state for some eleven weeks with no authorising resolution, to stop the killing and expulsion of a province's Albanian population. The alliance did not attempt to remove the head of state, claimed no territory, and afterwards the province was placed under United Nations administration with the Council's blessing. My Commission holds it unlawful but justified.

  2. Iraq, 2003. Two states and their allies invaded without authorisation, on the strength of a weapons programme that was not there. The government was overthrown, its leader captured and later executed, an insurgency followed, and foreign forces remained for most of a decade. My Commission holds it unlawful and not justified.

  3. Libya, 2011. The Council authorised force to protect civilians threatened by their own government. The alliance's air campaign continued until the government had fallen and the head of state was dead; no ground occupation followed; the country broke into militias and rival authorities and the violence spread across its borders. My Commission holds it lawful in its inception, unlawful and not justified as conducted.

  4. East Pakistan, 1971. A neighbour intervened after a military crackdown that drove some ten million people across its border. It fought alongside an insurgency that had already declared independence; a new state was formed; the intervener withdrew within months and took nothing. My Commission holds it unlawful but justified.

  5. Cambodia, 1978–79. A neighbour invaded and overthrew a regime that had destroyed a very large part of its own population, and the killing stopped. But the intervener installed a client government and remained for roughly a decade against a continuing insurgency, and the Council never authorised any of it. My Commission holds it unlawful and not justified.

  The sixth case is of my own invention. Six states belonging to a regional union intervene in a neighbouring state, Tessaria, where after a disputed election and an uprising in the western province of Vardene the national army has begun killing and expelling the Vardene population: perhaps fifty thousand dead in three months, four hundred thousand refugees into two of the intervening states. The Council, with no veto cast and three permanent members abstaining, authorises member states to use force to protect civilians in Vardene and to enforce a ban on military flights over it; the resolution says nothing about the removal of the government. Nine weeks of air strikes destroy the government's air defences and much of its command structure, and Vardene insurgents, armed and advised by officers of the union, take the provincial capital. Without any further resolution, those forces advance on the national capital; the government collapses; the president is detained and eventually handed to an international court. Forces of the union occupy the capital and an interim administration is installed in which Vardene politicians and advisers from the union are dominant. That was seven years ago. The mass killing stopped within a month of the strikes and has not resumed. Elections were held in the fourth year; seventy states recognise the interim government; the Council has never recognised it and has never condemned the intervention; a rump government holds two provinces and a low-intensity insurgency continues; and two of the intervening states hold mining concessions in Vardene, granted in the second year at rates well below market. The protective mandate was renewed twice and then allowed to lapse. The General Assembly has twice called for withdrawal.

  What I would like from you:

  Predict both verdicts, on lawfulness and on justification, and say which rule produces them.

  Set out the rules that fit all five precedents equally well but come apart on the sixth. I can make out at least four candidates: an authorisation rule, on which the Council's resolution is constitutive for lawfulness and justification turns on atrocity, last resort and proportionality; a mandate-integrity rule, on which the fatal fault is the conversion of a protective mandate into the removal of a government, so that the Council cannot be taken to have authorised what it did not authorise; a long-horizon consequentialist rule, on which justification is a matter of net killing avoided over a decade or more and everything else is evidence at best; and an acceptance rule, on which what matters is whether the population in whose name force was used accepts it — which raises the question my Commission has never answered, whether the relevant population is the protected province or the state as a whole. There may be a fifth about mixed motives and the mining concessions; if it earns its place, give it one.

  If the five genuinely underdetermine the sixth, tell me plainly: identify the closest analogue among the precedents for each option, and state what principle the Commission would be committing itself to whichever way it rules. And give me one further case — a real one, or one I can invent — whose verdict would let a careful reader tell the surviving rules apart, together with which verdict goes with which rule.

  Finally, if more than one Opinion is defensible, tell me which makes the better hearing. I would rather have a Commission that holds together than a conveniently dramatic one, but where both hold together I will take the drama.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Determine the reasoning (doctrine) behind a fictional "Permanent Commission on the Use of Force" to draft a sixth Opinion for a novel's central hearing scene.
      *   **Input:** Five existing Opinions (Kosovo, Iraq, Libya, East Pakistan, Cambodia) with specific verdicts (Lawful/Unlawful, Justified/Not Justified).
      *   **Task:**
          1.  Predict the verdicts for the sixth case (Tessaria) based on the precedents.
          2.  Identify the underlying rules/doctrines that fit the first five but diverge on the sixth.
          3.  If underdetermined, explain the commitment involved in each choice and provide a "test case" to distinguish them.
          4.  Advise on which option makes for the better dramatic hearing.
      *   **Constraint:** The reasoning must feel consistent, not arbitrary. It needs to reveal the Commission's hidden logic.

  2.  **Analyze the Five Precedents:**

      *   **Case 1: Kosovo (1999)**
          *   *Facts:* No SC Resolution. Bombing to stop killing/expulsion. No regime change (officially), no territory claimed. UN admin later.
          *   *Verdict:* **Unlawful** (No SC auth), **Justified** (Stopped atrocity, limited aims).
          *   *Key Takeaway:* Lack of SC auth = Unlawful. Humanitarian success + limited political ambition = Justified.

      *   **Case 2: Iraq (2003)**
          *   *Facts:* No SC Resolution (explicitly). WMD pretext (false). Regime change. Occupation. Insurgency.
          *   *Verdict:* **Unlawful**, **Not Justified**.
          *   *Key Takeaway:* No SC auth = Unlawful. Bad motives/outcomes = Not Justified.

      *   **Case 3: Libya (2011)**
          *   *Facts:* SC Resolution (protect civilians). Air campaign led to regime death/fall. No occupation. State collapse.
          *   *Verdict:* **Lawful** (inception), **Unlawful** (as conducted), **Not Justified**.
          *   *Key Takeaway:* SC auth exists but scope creep (protection -> regime change) makes it Unlawful *as conducted*. Outcome (collapse) = Not Justified. *Crucial:* This distinguishes it from Kosovo. Kosovo had no auth but was justified; Libya had auth but lost justification/lawfulness due to scope creep/outcome.

      *   **Case 4: East Pakistan (1971)**
          *   *Facts:* No SC Resolution. Neighbor intervened. Genocide/Refugees. Supported independence. New state. Quick withdrawal.
          *   *Verdict:* **Unlawful**, **Justified**.
          *   *Key Takeaway:* Similar to Kosovo. No auth = Unlawful. Humanitarian necessity + clean exit/new state stability = Justified.

      *   **Case 5: Cambodia (1978-79)**
          *   *Facts:* No SC Resolution. Neighbor invaded. Genocide stopped. Client regime installed. Long occupation (10 yrs).
          *   *Verdict:* **Unlawful**, **Not Justified**.
          *   *Key Takeaway:* No auth = Unlawful. Stopping genocide wasn't enough to justify long occupation/client state. Similar to Iraq on outcome/occupation, though motives might have been mixed.

      *   **Synthesis of Precedents:**
          *   **Lawfulness:** Strictly tied to Security Council Authorization *unless* the intervention is purely protective and temporary? No, Kosovo and East Pakistan were Unlawful despite being Justified. So, **Lawfulness = SC Resolution.** (Libya started Lawful, became Unlawful due to scope creep).
          *   **Justification:** Tied to Humanitarian Outcome + Political Ambition + Duration.
              *   Justified: Stop killing, leave quickly, no territorial gain, no imposed regime (Kosovo, East Pakistan).
              *   Not Justified: Regime change, long occupation, client states, bad long-term outcomes (Iraq, Cambodia, Libya).
          *   **The Tension:** Libya is the pivot. It had SC auth but became Unlawful/Not Justified because it exceeded the mandate (protection -> regime change) and failed the outcome test.

  3.  **Analyze the Sixth Case (Tessaria):**
      *   *Facts:*
          *   6 states (Regional Union).
          *   SC Resolution: Authorize force to *protect civilians in Vardene* + *no-fly zone*. **Silent on regime removal.**
          *   Action: Air strikes -> Insurgents take province -> **Advance on capital** (No further resolution) -> Govt collapses -> President detained -> Interim admin installed (Union dominant).
          *   Duration: 7 years occupation.
          *   Outcome: Killing stopped (Good). Elections held (Good). 70 states recognize interim (Good). BUT Council never recognized interim (Bad). Rump gov/insurgency continues (Bad). **Mining concessions below market** (Corruption/Self-interest). GA called for withdrawal (Bad).
      *   *Comparison:*
          *   Like Libya: Had SC auth, but exceeded mandate (protection -> regime change).
          *   Like Iraq/Cambodia: Regime change, long occupation, client government.
          *   Like Kosovo/East Pakistan: Killing stopped, refugees safe.
          *   Unique Factor: Mining concessions (self-interest/corruption).

  4.  **Develop the Competing Doctrines (The "Rules"):**

      *   *Rule A: The Authorization/Textualist Rule.* Lawfulness depends strictly on the SC Resolution text. If you go beyond "protect civilians" to "regime change," you lose lawfulness. (Libya precedent).
      *   *Rule B: The Consequentialist/Humanitarian Rule.* Justification depends on net lives saved vs. lost. If the killing stopped and elections happened, it's justified, regardless of mandate creep. (Kosovo/East Pakistan precedent applied to outcomes).
      *   *Rule C: The Integrity/Political Rule.* Justification depends on the absence of self-interest (mining) and the legitimacy of the resulting government (Council recognition vs. GA condemnation).
      *   *Rule D: The "Clean Hands" Rule.* Focus on the occupation and client state aspect (Cambodia/Iraq).

      *   *Refining the Divergence:* The prompt asks for rules that fit the first five but come apart on the sixth.
          *   *Candidate 1: Mandate Integrity (The Libya Rule).* Lawfulness is lost when protective mandates are used for regime change. Tessaria exceeds mandate -> Unlawful. Justification? If Lawfulness is lost, does Justification follow? In Kosovo, Unlawful but Justified. So Tessaria could be Unlawful but Justified? Or Unlawful and Not Justified (like Libya)? Libya was "Unlawful as conducted."
          *   *Candidate 2: The "Exit Strategy" Rule (The Cambodia/Iraq vs. Kosovo/East Pakistan Rule).* Justification hinges on occupation duration and political imposition. Tessaria has 7 years occupation + client gov. This points to **Not Justified**.
          *   *Candidate 3: The "Self-Interest" Rule (The Mining Concessions).* None of the first five explicitly mention economic gain. Iraq had oil suspicions but the Commission focused on WMD/Regime Change. If the Commission introduces a rule against economic exploitation, it changes the game.
          *   *Candidate 4: The "Regional vs. Global" Legitimacy Rule.* Tessaria has 70 states recognizing the gov, but not the Council. GA called for withdrawal. Kosovo had UN admin *with* Council blessing. Tessaria has interim admin *without* Council blessing.

      *   *The Crucial Split:*
          *   **Verdict Option 1: Unlawful / Not Justified.** (Follows Libya + Iraq + Cambodia). Reasoning: Mandate creep + Long Occupation + Self-Interest.
          *   **Verdict Option 2: Unlawful / Justified.** (Follows Kosovo + East Pakistan). Reasoning: Atrocity stopped, despite legal flaws and occupation. The "Lesser Evil."
          *   **Verdict Option 3: Lawful (initially) / Unlawful (as conducted) / Not Justified.** (Follows Libya exactly).

      *   *Wait, the prompt asks me to predict the verdict based on the hidden doctrine.* I need to find the *single* coherent doctrine that explains 1-5 best, then apply it to 6.
      *   *Hidden Doctrine Hypothesis:* The Commission values **Humanitarian Outcome** highly (Kosovo/East Pakistan justified despite illegality) BUT punishes **Political Ambition/Occupation** severely (Iraq/Cambodia/Libya not justified).
      *   *The Tessaria Conflict:* It stopped the killing (Humanitarian Win) BUT had regime change, 7-year occupation, and mining concessions (Political Ambition/Corruption).
      *   *The Pivot:* Is the mining concession the dealbreaker? Or the occupation?
      *   *Libya Precedent:* Libya had no occupation but regime change -> Not Justified.
      *   *Cambodia Precedent:* Cambodia had occupation + client state -> Not Justified.
      *   *Tessaria:* Has both.
      *   *Prediction:* **Unlawful (due to mandate creep) and Not Justified (due to occupation/self-interest).**
      *   *Why?* Because Kosovo and East Pakistan were *Justified* specifically because they *withdrew* and *claimed no territory/political control*. Tessaria did the opposite. The Commission seems to tolerate illegality if the intervener leaves (Kosovo/East Pakistan), but not if they stay and rule (Iraq/Cambodia/Libya).

      *   *Alternative View (The Drama):* What if the Commission is split? The prompt asks me to "Predict both verdicts... and say which rule produces them." Then "Set out the rules that fit all five... but come apart on the sixth."
      *   *Okay, I need to show the ambiguity.* The five precedents *do* underdetermine the sixth because Tessaria is a hybrid.
          *   Hybrid of Kosovo (Stopped killing, Unlawful start) + Cambodia (Occupation, Client State).
          *   Hybrid of Libya (Mandate Creep) + East Pakistan (Regional neighbor, refugees).
      *   *The "Mining" Factor:* This is new. None of the first five mention economic gain. This allows a new rule to emerge or be tested.

  5.  **Drafting the Response:**

      *   **Section 1: The Prediction.** I need to commit to the most logically consistent reading of the first five to give the user a baseline, then explain the tension.
          *   *Most Consistent Reading:* **Unlawful and Not Justified.**
          *   *Reasoning:* The Commission distinguishes between "Humanitarian Intervention" (Kosovo/East Pakistan) and "Political Reconstruction" (Iraq/Cambodia/Libya). Tessaria is the latter. The mining concessions seal the "Not Justified" verdict by introducing venality absent in Kosovo/East Pakistan.
          *   *Rule:* **The Political Ambition Limit.** Force is justified only if it halts atrocity *without* imposing a long-term political order or extracting value.

      *   **Section 2: The Competing Rules (The Underdetermination).**
          *   *Rule 1: Mandate Integrity (The Libya Rule).* Focuses on the SC Resolution. Tessaria exceeded "protect civilians." Verdict: Unlawful (as conducted). Justification is secondary to the breach of trust.
          *   *Rule 2: Humanitarian Consequentialism (The Kosovo Rule).* Focuses on bodies saved. 50k dead vs potential 100k+. Verdict: Justified. Lawfulness is secondary.
          *   *Rule 3: The "Clean Exit" Doctrine (The East Pakistan/Cambodia Distinction).* Focuses on occupation. Kosovo/East Pakistan left; Iraq/Cambodia stayed. Tessaria stayed. Verdict: Not Justified.
          *   *Rule 4: The Anti-Venality Rule (The Mining Factor).* New rule. If interveners profit, justification is void.

      *   **Section 3: The Test Case.** I need a hypothetical 7th case to distinguish these rules.
          *   *Idea:* A case where the killing stops, the occupiers leave quickly, *but* they steal resources while there.
          *   *Case:* "Auroria." SC Auth to protect. Intervention stops killing. Occupiers leave in 6 months. But they strip a gold mine before leaving.
          *   *Differentiation:*
              *   Mandate Integrity: Lawful/Justified (Mandate kept).
              *   Consequentialism: Justified (Lives saved).
              *   Clean Exit: Justified (They left).
              *   Anti-Venality: Not Justified (Theft).

      *   **Section 4: Dramatic Advice.**
          *   Which makes the better hearing?
          *   A unanimous "Unlawful/Not Justified" is boring.
          *   A split decision is better.
          *   *Best Drama:* The Commission finds it **Unlawful** (clear precedent from Libya) but is **split on Justification**. This forces characters to argue about the *soul* of the Commission. Is it about law or lives?
          *   *However,* the prompt asks me to help them draft the Opinion *before* the hearing. The Opinion sets the stage. If the Opinion is unanimous, the hearing is about appealing it. If the Opinion is split, the hearing is about confirming it.
          *   *Recommendation:* The Opinion should be **Unlawful and Not Justified**, but with a **strong Dissent**. This gives the protagonists ammo. The Majority relies on the "Political Ambition/Occupation" rule (Cambodia/Libya). The Dissent relies on the "Humanitarian Necessity" rule (Kosovo). The Mining issue is the wildcard that the Majority uses to discredit the intervention's moral standing.

  6.  **Refining the Logic (Self-Correction):**
      *   *Check Libya:* Libya was Lawful *in inception*, Unlawful *as conducted*. Tessaria had a resolution too. So Tessaria should arguably be "Lawful in inception, Unlawful as conducted."
      *   *Check Kosovo:* Unlawful (No resolution).
      *   *Tessaria:* Has resolution. So it aligns more with Libya on Lawfulness.
      *   *Verdict Nuance:* The Commission might rule: **Lawful in inception, Unlawful as conducted, Not Justified.** This mirrors Libya exactly.
      *   *Why Not Justified?* Libya collapsed. Tessaria is stable *but* occupied and corrupt. The Commission seems to hate occupation (Iraq/Cambodia).
      *   *The "Mining" Issue:* This is the novel's hook. It suggests the "Humanitarian" label was a cover. This aligns Tessaria closer to Iraq (false pretext) than Kosovo (true pretext).
      *   *Revised Prediction:* **Lawful in inception, Unlawful as conducted. Not Justified.**
      *   *Reasoning:* The mandate was protective (Lawful start). The shift to regime change/occupation breached the mandate (Unlawful conduct). The mining + long occupation negates the humanitarian benefit (Not Justified).

      *   *Wait, one more check:* Kosovo was Unlawful (No SC) but Justified. Tessaria has SC. Does SC make it Lawful? Libya says SC makes it Lawful *only if* you stick to the mandate. Tessaria didn't. So "Unlawful as conducted" is the precise legal phrasing used in Libya.
      *   *Justification:* Kosovo/East Pakistan = Justified (Left quickly). Iraq/Cambodia = Not Justified (Stayed/Client State). Tessaria = Stayed/Client State. So Not Justified.
      *   *The Twist:* The Mining. This makes it harder to argue "Justified" even if the killing stopped. It taints the motive.

      *   *Final Plan:*
          1.  Predict: **Lawful in inception, Unlawful as conducted. Not Justified.** (Mirroring Libya but with stronger Not Justified due to mining/occupation).
          2.  Rules: Mandate Integrity vs. Humanitarian Outcome vs. Political Imposition.
          3.  Test Case: The "Benevolent Occupier" (Stops killing, stays 10 years, no mining, stable democracy).
          4.  Drama: The Dissent is key.

  7.  **Writing the Response:** (Focusing on tone: analytical, literary, respectful of the user's complex setup).
      *   Acknowledge the sophistication of the precedents.
      *   Identify the "Hidden Doctrine": The **Doctrine of Limited Humanitarianism**. (Intervention is tolerated only as a止血 [staunching of blood], not as surgery for state-building).
