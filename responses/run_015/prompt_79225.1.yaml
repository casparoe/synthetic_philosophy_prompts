  **Note on Form and Philosophy**

  I bent Dennett's taxonomy in two places to make the poem work. First, the four-movement structure itself implies a ladder of replacement (one creature type succeeds another), whereas Dennett insists these grades are **nested layers**. A Gregorian creature (us) still contains the Darwinian, Skinnerian, and Popperian subroutines; we don't shed the lower grades as we ascend. I separated them here for pedagogical clarity, but a strictly accurate form would have shown the later movements *containing* the constraints of the earlier ones (e.g., the Gregorian section should also be bound by the Darwinian rigidity).

  Second, the Popperian section uses visible strikethroughs to represent "hypotheses dying in our stead." This leans on a contested reading of how internal simulation looks; Dennett describes it as functional, not necessarily linguistic. I translated "internal trial and error" into visible text edits to satisfy the poetic constraint, risking the implication that Popperian thinking is always conscious or verbal, which Dennett would caution against.
