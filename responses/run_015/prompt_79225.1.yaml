  The root goes down because the seed was dropped
  and the leaf turns up because the sun is fixed
  and the stem holds fast because the wind is tested
  and the fruit falls heavy because the branch is licked
  by frost. There is no other pattern possible.
  The script is read before the actor enters.
  The body obeys the text it cannot edit.
  Survival is the only verb conjugated here.

