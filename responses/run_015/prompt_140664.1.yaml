answer: |-
  **DISSERTATION FELLOWSHIP PROPOSAL**

  **Title:** Portability and Estimands in the Deep Determinants of Development: A Design Audit

  **Project Summary**
  The dominant literature on comparative development posits a "horse race" between institutions, geography, and culture. This project argues that this competition is structurally flawed: these determinants are historically bundled, rendering cross-country regressions unable to isolate causal effects. Instead of proposing a new identification strategy within the existing framework, this project changes the question. I develop a framework of "Portability Tests" and "Temporal Estimands" to determine whether any historical observation *can* distinguish these hypotheses. The goal is to map the limits of inference in development economics, distinguishing between questions we cannot answer yet and questions the data cannot answer in principle.

  **Intellectual Merit: The Question and Gap**
  Current research asks: *Which determinant explains the most variance in income?* This proposal asks: *For any pair of hypotheses (e.g., Institutions vs. Geography), what is the minimal counterfactual observation required to distinguish them, and does it exist?*

  The gap is not empirical but design-theoretic. Existing instruments (e.g., settler mortality) identify local average treatment effects conditional on specific colonial paths, lacking external validity. Geographic variables are time-invariant, explaining levels but not takeoffs. Cultural variables travel with populations, confounding institutional transplants. Consequently, the "effective $N$" of independent development trajectories is likely single digits, not 150+. By conflating *levels* with *growth rates* and *portable* factors with *fixed* factors, the literature generates false precision. This project formalizes these distinctions to evaluate the identification power of the historical record itself.

  **Research Design and Timeline**
  The methodology is a meta-analysis of identification strategies, combining formal modeling with historical audit.

  *   **Months 1–3 (Formalization):** Construct a simple structural model where Income is a function of Institutions ($I$), Geography ($G$), and Culture ($C$). Derive the unique predictions for each determinant under counterfactual relocation (e.g., moving $I$ without $C$, or $C$ without $G$). Define "Portability Coefficients" for each factor.
  *   **Months 4–6 (Historical Audit):** Systematically code historical episodes of "partial relocation" (e.g., colonial institutional transplants, mass migration events, border splits). Assess each against the formal criteria from Months 1–3. Does the Korean split distinguish $I$ from $C$? Does the Atlantic migration distinguish $C$ from $I$?
  *   **Months 7–9 (Power Analysis):** Estimate the "Effective $N$" of the development literature. Using spatial autocorrelation and colonial clustering, calculate the true degrees of freedom available for testing deep determinants.
  *   **Months 10–12 (Synthesis):** Draft the dissertation chapter. Determine if a decisive test exists. If yes, specify it. If no, delineate the boundary of unknowability.

  **Deliverables**
  1.  **Dissertation Chapter:** A methodological critique and framework suitable for a top general-interest journal (e.g., *AER*, *QJE*).
  2.  **Design Audit Dataset:** A public repository coding historical "natural experiments" by their ability to unbundle $I, G, C$. This serves as a tool for other researchers to vet identification claims before running regressions.

  **Risk and Failure Conditions**
  The primary risk is a negative result: the audit may reveal that no historical episode cleanly separates these hypotheses. This is not a project failure but a substantive finding. If the determinants are perfectly collinear in the historical record, the "horse race" is a category error. In this case, the deliverable shifts to a prescription for future research (e.g., prioritizing micro-level mechanisms over macro-correlates) and a formal statement of the limits of cross-national causal inference.

  ***

  **FEASIBILITY ASSESSMENT & SCALE-DOWN ADVICE**

  **Is this too big?**
  Yes. Honestly, this is a career-defining project, not a dissertation chapter. Attempting to audit *all* historical episodes and formalize a general theory of portability for three distinct literatures is a recipe for getting stuck in Months 1–3. You risk producing a broad critique without a sharp empirical hook.

  **The Natural Cut-Down:**
  Narrow the scope to **Institutions vs. Culture** via **Migration**.
  1.  **Drop Geography:** It's the easiest to dismiss (time-invariant). Focus on the harder fight: Institutions vs. Culture.
  2.  **Focus on One Test:** Instead of auditing all history, focus exclusively on *diaspora outcomes*. When a population moves (Culture moves) to a new place (Geography changes) under new rules (Institutions change), what predicts their success?
  3.  **Deliverable:** One strong paper on "The Portability of Development," using the audit as an appendix rather than the main event.
  *Why this works:* It keeps your core insight (bundling/portability) but gives you a concrete empirical lane (migration data) to prove you aren't just doing philosophy.

  ***

  **MEMO: RESPONSE TO THE "PHILOSOPHER'S HAND-WRINGING" CRITIQUE**

  **To:** Dissertation Committee
  **From:** [Your Name]
  **Re:** Methodological Contribution of "Portability and Estimands"

  A likely critique is that this project prioritizes methodological navel-gazing over substantive empirical discovery—that I should "stop worrying and find a new natural experiment." I anticipate this objection and offer three counter-arguments:

  1.  **Design Precedes Data:** In an era where the "credibility revolution" demands rigorous identification, running regressions on bundled determinants is statistically inefficient at best and misleading at worst. This project functions as a *pre-analysis plan for the field*. Determining that the effective $N$ is 10 rather than 150 prevents the publication of false positives derived from spurious independence.
  2.  **Substantive Implications:** The distinction between "levels" and "growth" is not semantic; it is policy-critical. If geography explains income levels but institutions explain growth rates, policy prescriptions differ radically. Clarifying the estimand is a substantive contribution to political economy, not merely a statistical one.
  3.  **Negative Results are Information:** If the audit shows that no historical variation separates Institutions from Culture, that is a discovery about the nature of development, not a failure of method. It implies these factors are co-evolutionary rather than competing causes. Ignoring this structural collinearity perpetuates a debate that cannot be won with more data alone.

  This project does not replace empirics; it ensures that future empirics are asking questions the data can actually answer.
