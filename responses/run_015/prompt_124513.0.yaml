  ## 5. Limitations (What to Admit)
  Be honest in the last 5 minutes.
  1.  **Updating Rules:** "We used a specific rule (keep the interval bounds) for updating. There are other ways to update sets of probabilities. We didn't prove ours is the 'right' one, just that it leads to dilation."
  2.  **Adversarial Nature:** "The Safety Rule assumes the world is out to get you within the bounds. If the world is friendly, the Middle Rule wins more often. We didn't prove ambiguity aversion is always correct, just that it changes the math."
  3.  **No Proof:** "This is a demonstration, not a proof. The math holds, but your intuition might still rebel. That's normal."

  ## 6. Instructor's Cheat Sheet (The Numbers)
  *   **Prior Interval:** $[0.4, 0.6]$.
