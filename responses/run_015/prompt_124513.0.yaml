  *   **Bet Wager:** 50 Points.
  *   **Bet Win:** 100 Points.
  *   **Pure Bet Min Payoff (Prior):** $40$ points.
  *   **Pure Bet Min Payoff (Posterior):** $30$ points.
  *   **Split Bet Payoff:** $50$ points (Guaranteed).
  *   **Net Score (Safety/Split/No Info):** $100 - 50 + 50 = 100$.
  *   **Net Score (Safety/Pure/Info):** $100 - 50 - 5 + 30 = 75$.
  *   **Net Score (Middle/Pure/Info/Lose):** $100 - 50 - 5 + 0 = 45$.

  *Note on Math:* Ensure you actually construct the envelopes so the global total is 50/50 (or 40-60) and every envelope is 3-7.
  *Example Distribution:*
  *   Env 1-3: 3 Red, 7 Black.
  *   Env 4-7: 5 Red, 5 Black.
  *   Env 8-10: 7 Red, 3 Black.
  *   Total Red: $3(3) + 4(5) + 3(7) = 9 + 20 + 21 = 50$. (Perfect 50%).
