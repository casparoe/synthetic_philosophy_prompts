  ## 7. Why This Works
  *   **Gut Check:** They physically pay points to see an envelope, then watch their probability range get worse.
  *   **Randomization:** The Split Bet is a physical hedge. They hold chips on both colors.
  *   **Policy:** They sign the card *before* they know the envelope distribution details. They can't change their rule when they see the cost.
  *   **Trust:** The friend + sealed envelopes + post-game audit removes the "professor magic" suspicion.

  This plan fits the 90-minute slot, requires no tech, and hits all three learning objectives viscerally.
