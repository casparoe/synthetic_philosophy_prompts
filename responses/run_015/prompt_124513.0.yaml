  Here is a complete design for the 90-minute seminar. It is built to be physically robust, mathematically verifiable, and pedagogically sharp. It avoids jargon until the debrief.

  # Seminar Title: "The Cost of Clarity"

  ## 1. The Physical Setup (The "Rig")
  You need to create a state of **dilation** (where learning a signal widens your probability interval) using physical props that students can verify.

  **Props Required:**
  *   **100 Poker Chips:** 50 Red, 50 Black (or any two distinct colors).
  *   **10 Small Envelopes:** Numbered 1 to 10 on the outside.
  *   **1 Large Opaque Bag:** To hold the envelopes.
  *   **2 Clear Jars:** Labeled "Red" and "Black".
  *   **Handouts:** Decision sheets (see below).
  *   **Currency:** Points (tracked on a whiteboard). 100 Points = 1 Chocolate Bar (or raffle entry).

  **The "Dilation Machine" Construction (Do this before class):**
  1.  Take the 100 chips.
  2.  Distribute them into the 10 envelopes, 10 chips per envelope.
  3.  **Constraint 1 (Global):** Ensure the *total* number of Red chips across all envelopes is between 40 and 60. (e.g., exactly 50 Red, 50 Black).
  4.  **Constraint 2 (Local):** Ensure *every single envelope* contains between 3 and 7 Red chips. (e.g., Env 1 has 3R, Env 2 has 7R, Env 3 has 5R, etc., varying them so no envelope is extreme).
  5.  **Seal the Envelopes.** Sign across the flap with a marker.
  6.  **The Public Log:** On the whiteboard, write:
      *   "Total Chips: 100."
      *   "Total Red: Between 40 and 60."
      *   "Each Envelope: Between 3 and 7 Red."
      *   "I do not know which envelope has which count. You do not know either."
  7.  **Verification:** Have your friend (the second adult) count the chips into the envelopes and sign the whiteboard log as a witness. This prevents "the fix is in" accusations.

  **The Math (For You):**
  *   **Prior:** Before drawing an envelope, the probability of Red is $P(R) \in [0.4, 0.6]$.
  *   **Signal:** You draw an envelope (say, #4). You open it and see it contains chips, but you don't count them yet. You just know it is *an* envelope from the set.
  *   **Posterior:** Because *every* envelope satisfies the 3-to-7 constraint, knowing *which* envelope you have does not narrow the range. It confirms the range is $[0.3, 0.7]$.
  *   **Dilation:** The interval widens from $[0.4, 0.6]$ to $[0.3, 0.7]$. You are strictly *less* precise after learning the signal.

  ---

  ## 2. The Handout (Decision Rules)
  Give this to students at the start. It forces them to commit to a policy without using decision-theory jargon.

  **SEMINAR DECISION CARD**
  *Name: ___________________*

  **Part 1: How will you decide?**
  When you face a range of probabilities (e.g., "30% to 70%"), how will you choose?
  [ ] **The Safety Rule:** Assume the probability is the worst number in the range. Maximize your minimum guaranteed points.
  [ ] **The Middle Rule:** Assume the probability is the exact middle of the range. Maximize your average expected points.
  [ ] **The Info Rule:** Always pay to see more information before betting, if it costs less than 10 points.

  **Part 2: The Information Market**
  Later, you may be offered a "Signal" (knowing which Envelope you are playing with).
  *   Cost of Signal: **5 Points**.
  *   Do you commit to buying the Signal now? [ ] YES [ ] NO

  **Part 3: The Bet**
  You have 100 Points. You must wager 50 Points.
  *   **Option A (Red):** Win 100 points if Red, 0 if Black.
  *   **Option B (Black):** Win 100 points if Black, 0 if Red.
  *   **Option C (Split):** Wager 25 on Red, 25 on Black. Win 50 regardless of color.
  *   *Which do you choose?* _______

  ---

  ## 3. The 90-Minute Timeline

  ### 00:00 – 00:15: Setup & Priors
  *   **Action:** Show the sealed envelopes in the big bag. Show the whiteboard log signed by your friend.
  *   **Script:** "There are 100 chips total. Global Red count is 40-60. Every envelope has 3-7 Reds. I will pick one envelope at random. You will bet on the color of a chip drawn from *that* envelope."
  *   **Task:** Students calculate their prior interval for Red.
      *   *Consensus:* $[0.4, 0.6]$.
  *   **Commitment:** Students fill out **Part 1** and **Part 2** of the Handout. Collect Part 2 (Info commitment) immediately so they can't change their mind.

  ### 00:15 – 00:35: The Information Market (Dilation)
  *   **Action:** Announce the Signal Price (5 Points).
  *   **The Choice:** Ask students to raise hands: "Who paid for the Signal?"
      *   *Prediction:* "Info Rule" and "Middle Rule" students will likely buy. "Safety Rule" students who understand dilation might not.
  *   **The Reveal:** Pick one student who bought the Signal. Draw an envelope (e.g., #7). Open it. Show the chips inside (do not count them yet, just show the mix).
  *   **The Update:** Ask the class: "Now that you know this is Envelope #7, what is the probability of Red?"
      *   *Answer:* They must check the whiteboard log. "Envelope has 3-7 Reds." So $P(R) \in [0.3, 0.7]$.
  *   **The Gut Check:** "Your interval was $[0.4, 0.6]$. Now it is $[0.3, 0.7]$. You paid 5 points to become *more* uncertain. Who feels regret?"
  *   **Payoff:** Deduct 5 points from those who bought the signal.

  ### 00:35 – 00:55: The Betting Game (Randomization)
  *   **Action:** Students finalize **Part 3** (The Bet).
  *   **The Options:**
      *   **Pure (A or B):** Payoff depends on color.
          *   Worst Case (Safety): $0.3 \times 100 = 30$ points.
          *   Middle Case: $0.5 \times 100 = 50$ points.
      *   **Split (C):** Payoff is fixed.
          *   Worst Case: 50 points. (Because you win 25 on Red + 25 on Black = 50 total).
  *   **The Conflict:**
      *   **Safety Rule:** Split (50) > Pure (30). *Strict preference for randomization.*
      *   **Middle Rule:** Split (50) = Pure (50). *Indifferent.*
      *   **Info Rule (who bought signal):** They now have interval $[0.3, 0.7]$. Their worst case for Pure dropped from 40 (prior) to 30 (posterior). They paid to lower their guarantee.
  *   **Execution:** Have them mark their choice. Collect cards.

  ### 00:55 – 01:10: The Draw & Payoff
  *   **Action:**
      1.  Shake the chosen envelope.
      2.  Have a student draw one chip.
      3.  Reveal the color.
      4.  **Audit:** Open the envelope and count the actual Red/Black chips to prove the 3-7 constraint was real.
  *   **Scoring:**
      *   Calculate points based on choices.
      *   **Safety + Split + No Info:** 100 (Endowment) - 50 (Wager) + 50 (Win) = 100. (Guaranteed).
      *   **Safety + Pure + Info:** 100 - 50 (Wager) - 5 (Cost) + 30 (Min Win) = 75. (Loss due to policy).
      *   **Middle + Pure + Info:** Depends on luck. If they lose the bet, they get $100 - 50 - 5 + 0 = 45$.
  *   **Reward:** Distribute chocolate/raffle tickets to the top 3 scores.

  ### 01:10 – 01:30: The Debrief (The "Lecture" Part)
  *   **Map the Moments:**
      1.  **Dilation:** "When we opened Envelope #7, the interval went from $[0.4, 0.6]$ to $[0.3, 0.7]$. This is called **Dilation**. Information made you vaguer."
      2.  **Value of Information:** "Standard theory says free information is never bad. Here, information had *negative* value because it widened your worst-case scenario."
      3.  **Randomization:** "For the 'Safety' students, splitting the bet (mixing) was strictly better than picking a side. This is **Randomization under Ambiguity**. You weren't indifferent; you were hedging against the unknown probability."
      4.  **Policy:** "The students who committed to 'Always Buy Info' lost points. Your decision rule (policy) mattered more than your bet."
  *   **The Names:** Now you can say: "This is **MaxMin Expected Utility** (Safety) vs. **Bayesian Updating** (Middle). The phenomenon is **Dilation** (Walley, 1991)."

  ---

  ## 4. Troubleshooting & Objections

  **1. "I can do frequentist inference. I saw 5 Reds in the practice draws, so P=0.5."**
  *   *Response:* "You aren't drawing with replacement from a single urn. You are drawing from *one* envelope with a *fixed but unknown* composition constrained by the log. The frequency inside *this* envelope is fixed at (e.g.) 3/10 or 7/10. You don't know which. The interval represents that ignorance, not sampling error."

  **2. "This is just second-order probability. I should average the 0.3 and 0.7 to get 0.5."**
  *   *Response:* "That is the 'Middle Rule' you selected. It works if you trust the average. But the 'Safety Rule' assumes Nature might be adversarial within that range. If Nature picks the 0.3 world, your average calculation loses you money. The game rewards the policy that survives the worst case."

  **3. "You cheated. You put all the Reds in Envelope 1."**
  *   *Response:* "That's why we have the Witness and the Log. We counted the chips together (or the Witness did). We verified every envelope meets the 3-7 constraint. Open them all now and check." (Have your friend help count rapidly).

  **4. "Why would I ever pay for information?"**
  *   *Response:* "Because in most real life, information *narrows* intervals. This game is a specific counter-example designed to show that *sometimes* it widens them. The lesson is to check *how* the signal correlates with the uncertainty before buying."

  **5. "The Split Bet is boring. I want to gamble."**
  *   *Response:* "That's risk preference. But notice: under the Safety Rule, the Split Bet isn't 'boring', it's *rational*. It dominates the Pure Bet in the minimum payoff. You aren't giving up upside; you are buying a higher floor."

