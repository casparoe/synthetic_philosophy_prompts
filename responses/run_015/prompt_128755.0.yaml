      *Wait, let's reconsider Line 1.* Is it really a dodge? If the "payment" is data, and the platform owns the data *after* the trade, does the user lose future autonomy? That sounds like Line 2 (externalities/future options). So Line 1 collapses into Line 2. This reinforces Line 1 being the lowest priority—it's just a specific instance of Line 2 or a non-issue.

