          *   *Wait, the prompt says "students themselves run... sorting game."* Everyone should feel involved.
          *   *Better:* 4 Teams of 4. Each team runs a mini-demon? No, 80 mins is too short for 4 parallel games + debrief. One big game is better for collective discovery.
          *   *Let's stick to the 16-role distribution:*
              *   1 Demon.
              *   1 Gatekeeper.
              *   2 Bankers.
              *   4 Auditors (2 Card, 2 Memory).
