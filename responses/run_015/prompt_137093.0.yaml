  **National Institute for Macro-Social Stability**
  **Request for Proposals (RFP-2024-CV-01)**
  **Program: Causal Primacy of Axiomatic Constructs in Macroeconomic Trajectories**

  **1. Program Objective**
  The Institute invites submissions for a five-year award dedicated to resolving ambiguities regarding the directional flow between normative systems and aggregate output. The primary goal is to fund the first study to demonstrate that a specific cultural value is a genuine cause of a macroeconomic outcome, rather than a concomitant phenomenon. Proposals must move beyond descriptive correlation to establish generative mechanism.

  **2. Eligibility Criteria**
  Proposals failing to meet the following methodological standards will be returned without review.

  2.1 **Independent Operationalization.** The value must be measured independently of the practices it is supposed to cause. A commitment to thrift, for instance, cannot be inferred from savings rates, nor can an ethic of diligence be deduced from labor hours. The metric employed to quantify the value must remain orthogonal to the behavioral manifestations theoretically derived from said value.

  2.2 **Causal Mechanism.** Applicants must demonstrate that the value performs causal work rather than merely standing in a relation of *elective affinity* to the outcome. The proposal must distinguish the value as an engine of change, not merely an *ideal type* compatible with existing economic structures. Correlation, even when robust, is insufficient to prove that the value preceded the structure.

  2.3 **Non-Residual Status.** The value must not be identified with whatever the economists' model leaves unexplained. This category is hereby designated the **Residual Structural Variance (RSV).**^1 The value must possess positive content distinct from the gap left by structural predictors.

  2.4 **Institutional Exogeneity.** The value must survive the fact that values are transmitted by institutions that the outcome itself shapes. Applicants must prove the value persisted prior to the formation of the institutional feedback loops (e.g., legal systems, banking structures) that the economic outcome subsequently fortified. The value cannot be a product of the *iron cage* it purportedly built. Proposals assuming co-constitution will be rejected.

  **3. Evaluation Rubric**
  Proposals will be scored on a scale of 1–5 across three domains:
  *   **Methodological Rigor (50%):** Adherence to Section 2 criteria.
  *   **Theoretical Novelty (30%):** Distinction from prior historical sociology.
  *   **Policy Relevance (20%):** Utility for future intervention.

  **4. Eligible Costs**
  Funds may be used for personnel, data acquisition, and open-access publication fees. Costs associated with speculative historical reconstruction or archival travel requiring interpretive leaps are ineligible. Indirect costs are capped at 15%.

  **5. Administrative Note on Previous Cycle**
  The Institute notes that the previous round (RFP-2022-CV-01) attracted no fundable proposals. The Review Panel attributes this outcome to a widespread failure among applicants to adhere to the stipulated methodological rigor, rather than to the constraints of the criteria themselves. Many submissions relied on proxy variables that violated Criterion 2.1 or conflated outcomes with values, violating Criterion 2.3. Consequently, no awards were issued.

  To ensure success in the upcoming cycle, the Institute announces a modification to the process. In RFP-2025-CV-02, the Panel will specify the eligible value itself. Applicants will then be required to demonstrate its causal primacy using the established framework. This adjustment aims to reduce ambiguity regarding the independent variable and ensure alignment with Panel expectations.

  ^1 *Footnote: The Panel concedes that most canonical cultural explanations have been of exactly this kind.*
