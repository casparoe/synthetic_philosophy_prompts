  ### 1. The Activity: "The Allais Lottery"

  **Goal:** Make the independence violation visceral by tying choices to a real, tiered prize structure that mirrors the $1M/$5M/$0 hierarchy.

  **Materials:**
  *   **Projector:** To display the lotteries.
  *   **Whiteboard:** To decompose the probabilities live.
  *   **The "Bank":** A opaque box/bag with 100 numbered ping-pong balls or folded slips of paper (1–100).
  *   **The Prizes:**
      *   **Tier 0 ($0):** Nothing.
      *   **Tier 1 ($1M):** The $20 bag of chocolate.
      *   **Tier 2 ($5M):** The chocolate bag **PLUS** the extra-credit point.
  *   **Voting Slips:** Small scraps of paper for private choices.

  **Incentive Compatibility (The "Real" Stakes):**
  Explain this clearly at the start: "We cannot pay millions. Instead, the lottery outcomes map to these prizes. At the end, I will randomly select **one student** and **one question** they answered. We will draw a ball from the box to resolve that lottery. If you chose wisely, you have a better shot at the chocolate and point."

  **The Mapping:**
  *   **$0 Outcome** $\rightarrow$ No prize.
  *   **$1M Outcome** $\rightarrow$ Chocolate only.
  *   **$5M Outcome** $\rightarrow$ Chocolate + Extra Credit Point.

  **Recording Choices:**
  To prevent shame/anchoring:
  1.  **Private Commitment:** Students write their choice (A or B, then C or D) on a slip with their name. They fold it and put it in a "Choice Box."
  2.  **Anonymous Tally:** Before collecting, ask for a show of hands for A vs. B. Record counts on the board anonymously. This shows the "pull" of the paradox without identifying individuals.
  3.  **Final Draw:** Only open the Choice Box after the theory debrief to select the winner.

  ---

  ### 2. Timeline (50 Minutes)

  *   **00:00 – 05:00 | Setup & Stakes:** Explain the prize mapping (Chocolate vs. Chocolate+Point). Explain the random selection protocol (1 student, 1 question, 1 ball draw). Emphasize that rational choices increase their *objective* chance of winning.
  *   **05:00 – 15:00 | Round 1 (Standard Allais):** Project Problem 1 (A vs. B) and Problem 2 (C vs. D). Give 3 minutes for private thought. Take anonymous show-of-hands tally. Collect written slips into the Choice Box.
  *   **15:00 – 25:00 | Round 2 (The Leaky Variant):** Project Problem 1* (A* vs. B). Explain A* is 99% Chocolate, 1% Nothing. B is same as before. Private vote. Collect slips.
  *   **25:00 – 35:00 | The Debrief (Whiteboard Work):** Do not reveal the winner yet. Draw the probability trees. Visually cancel the common 89% branch. Show how choosing A and D implies valuing the same 11% chunk differently.
  *   **35:00 – 45:00 | The "Trade" (Money Pump Discussion):** Ask: "If I gave you Option B, would you pay 50 cents to switch to A?" (Most say yes). "If I gave you Option C, would you pay 50 cents to switch to D?" (Most say yes). Show that this implies the "common consequence" (the 89% chance) has a negative value in one context and positive in another.
  *   **45:00 – 50:00 | Payoff & Wrap:** Draw a student number. Draw a question number (1 or 2). Draw a ball (1–100). Award prize based on their written choice and the ball number.

  ---

  ### 3. Debrief: Mapping Moments to Theory

  **The "Aha" Moment (Independence Axiom):**
  On the whiteboard, write the lotteries as vectors:
  *   **1A:** $(1.0, 0, 0)$ [Prob of 1M, 5M, 0]
  *   **1B:** $(0.89, 0.10, 0.01)$
  *   **2C:** $(0.11, 0, 0.89)$
  *   **2D:** $(0, 0.10, 0.90)$

  **The Move:** Show them that $1A = 0.89(1M) + 0.11(1M)$ and $1B = 0.89(1M) + 0.11(\text{Lottery } X)$.
  If you prefer A over B, you are saying $(1M) \succ X$.
  Now look at Problem 2. $2C = 0.89(0) + 0.11(1M)$ and $2D = 0.89(0) + 0.11(\text{Lottery } X)$.
  If you prefer D over C, you are saying $X \succ (1M)$.
  **Contradiction:** You cannot prefer $1M$ to $X$ in the first case and $X$ to $1M$ in the second. The 89% common consequence should be irrelevant.

  **The Trade / Money Pump (10 Minutes):**
  *   **Verdict:** Your idea earns its ten minutes, but **do not call it a strict money pump.** A strict money pump requires intransitivity (A>B, B>C, C>A). Allais preferences are context-dependent, not necessarily intransitive in a single set.
  *   **How to run it:** Frame it as **"Dynamic Inconsistency."** Ask: "If you hold these preferences, you would pay to switch from B to A, and pay to switch from C to D. But A and C are essentially the same 'bet' wrapped in different packaging."
  *   **The Lesson:** The trade exercise shows that their preferences are *framable*. If a market maker knew their preferences, the market maker could extract value from them by switching the frame. This motivates why rational agents *should* satisfy Independence—to avoid being exploitable.

  ---

  ### 4. Verdict on the Leaky Variant

  **The Professor's Claim:** She argues removing the 100% certainty removes the "Certainty Effect," isolating Independence.
  **The Reality:** She is introducing a **Dominance Violation.**

  **Analysis:**
  *   **Option A*:** 99% Chocolate, 1% Nothing.
  *   **Option B:** 89% Chocolate, 10% (Chocolate+Point), 1% Nothing.
  *   **Comparison:** In both options, the chance of getting *nothing* is 1%. In both options, the chance of getting *at least* Chocolate is 99%. However, Option B offers a 10% chance at the **Point**, while Option A* offers 0% chance at the Point.
  *   **Result:** Option B **First-Order Stochastically Dominates** Option A*.
  *   **Evidence:** If a student picks A* over B, they are not just violating Independence; they are violating **Monotonicity** (the assumption that more is better than less). They are choosing a strictly worse lottery.

  **Recommendation:**
  Include it in **Round 2**, but change the framing. Do not present it as a "cleaner test of Independence." Present it as a **"Trap."**
  *   **Say:** "We just saw the Allais Paradox. Some economists argued the ' Certainty Effect' (100% vs 99%) was the cause. So let's remove certainty. Now, look closely. Does anyone still pick A*?"
  *   **If they do:** Use this to teach **Dominance**. "By picking A*, you aren't just violating Independence; you are throwing away free value. You gave up the chance for the Extra Credit point for no gain in probability."
  *   **Why include it?** It shocks the room. Students who felt smart about violating Independence in Round 1 will feel foolish violating Dominance in Round 2. It reinforces that rationality has hard constraints (Dominance) and soft constraints (Independence).

  ---

  ### 5. Predictable Failures & Limitations

  1.  **"It's Just Chocolate" (Hypothetical Bias):**
      *   *Risk:* Students treat the $1M/$5M numbers as abstract and the chocolate as irrelevant.
      *   *Fix:* The random selection protocol (1 student, 1 question) is crucial. Emphasize that *today*, for *one person*, this is real.
  2.  **Probability Blindness:**
      *   *Risk:* Sophomores might not intuitively grasp that 89% + 11% = 100% or how the cancellation works.
      *   *Fix:* Use the whiteboard visually. Draw bar charts for the probabilities, not just numbers. Color-code the "Common 89%" section so they can see it's identical.
  3.  **Anchoring:**
      *   *Risk:* One loud student says "A is obviously better" and sways the room before voting.
      *   *Fix:* Enforce **silent, private voting** before any discussion. Collect slips before showing hands.
  4.  **The "Wrong" Answer Shame:**
      *   *Risk:* Students who picked A/D feel stupid when you prove it's irrational.
      *   *Fix:* Normalize it. "80% of Nobel laureates pick A and D initially. This paradox exists because human intuition conflicts with axiomatic rationality. You are in good company."
  5.  **What the Activity Can't Do:**
      *   You cannot prove Expected Utility Theory is *true*. You can only show that Allais preferences are *inconsistent* with it.
      *   You must say out loud: "We are testing consistency with a specific model (EUT), not proving which choice makes you happier. You are allowed to prefer certainty. But you must admit that preference violates the Independence Axiom."

  ---

  ### Bottom Line on the Leaky Variant

  The leaky variant introduces a First-Order Stochastic Dominance violation (Option B is strictly better than Option A* in every regard). Choosing A* over B is evidence of violating Monotonicity/Dominance, not just Independence. This confounds the test because a rational agent must never violate Dominance, whereas Independence violations are debatable (e.g., Rank-Dependent Utility). Therefore, it fails to isolate the Independence Axiom cleanly.

  \answer{does not isolate}
