  2. **Answerability (4) vs. Judgment (5):** You claim high-value tasks need judgment *inside* the loop, but also require users to explain outcomes without querying the system. Deep judgment often creates opacity that logging cannot fix. *What gives:* Either limit "judgment" tasks to lower-stakes tiers or accept that answerability degrades as autonomy rises. *Cost:* You lose the claim that licensing (6) fully solves the safety problem for high-tier agents; you must admit residual risk where humans sign off without truly understanding the *why*. This weakens the guarantee in (4) and suggests your tiers might not scale as safely as promised for complex goals. You might need to introduce "explainability" requirements that conflict with model performance.

