      *   **Key Theoretical Concepts to Integrate:**
          *   Self as a hub of relationships (not atomic individual).
          *   Rectification of Names (正名 *Zhengming*): Establishing the actual relationship before acting.
          *   Five Relations (Wu Lun): Asymmetric obligations (e.g., *Xiao* vs. *Ci*).
          *   Contextual Adjudication: No universal rules, conflicts resolved within the relational web.
          *   Modern Adaptation: Ruler-Subject $\rightarrow$ Employer-Employee (though the prompt focuses on family, this lens matters for authority).
      *   **Format:** Series of questions in fixed order, plain language, with theoretical rationale attached.
      *   **Constraints:**
          *   Must identify stop points (safety/legal).
          *   Must identify value judgment boundaries (mediator vs. parties).
          *   Must mark "genuine judgment calls dressed up as procedure."
          *   Must distinguish essential vs. droppable theoretical distinctions.
          *   Must handle "Hard Cases": Genuine role conflicts (Caregiver vs. Spouse) and Role Abuse (Filial piety used for exploitation).
          *   Must run the procedure on 2-3 cases end-to-end.
          *   Output must be a concrete recommendation or referral (no vague "think about it").
          *   At least one outcome must be unpopular/uncomfortable.
          *   Must state limitations (what the procedure cannot do).

  2.  **Deconstruct Confucian Role Ethics for Mediation:**

      *   *Core Insight:* Morality isn't about following abstract rules (Kant) or maximizing utility (Utilitarianism); it's about performing one's role well within specific relationships.
      *   *Zhengming (Rectification of Names):* If language/roles aren't clear, action fails. In mediation, this means agreeing on *what* relationship we are negotiating. Is the father acting as a father or a creditor? Is the daughter acting as a child or a servant?
      *   *Asymmetry:* Parent loves/cares (*Ci*), Child reveres/supports (*Xiao*). It is *not* a contract.
      *   *Remonstrance (*Jian*):* Crucial for the "Role Abuse" case. Confucianism is not blind obedience. *Mencius* and *Xunzi* support remonstrance if the elder is acting unrighteously (*Yi*).
      *   *Extension (*Tui*):* Grading love. Care starts close and extends outward. You can't sacrifice the core (self/immediate family) to the periphery without breaking the web.

  3.  **Drafting the Procedure (The "Zhengming Protocol"):**

      *   *Time Limit:* 50 minutes. Needs to be tight.
      *   *Phase 1: Safety & Scope (0-5 mins).* Standard mediation safety, but framed through role stability. If safety is threatened, roles collapse.
      *   *Phase 2: Rectification of Names (5-20 mins).* Defining the relationship. This is the theoretical core.
      *   *Phase 3: Asymmetric Obligations (20-35 mins).* What does *this* role require of *this* person specifically?
      *   *Phase 4: Conflict & Remonstrance (35-45 mins).* Handling the clash. Is this *Xiao* or servitude? Is this *Ci* or control?
      *   *Phase 5: Resolution/Referral (45-50 mins).* Concrete outcome.

      *   *Critical Check:* Where does the mediator stop? The mediator facilitates the *definition* of roles, but cannot dictate the *content* of the virtue. However, the prompt asks for a concrete recommendation. This is tricky. A mediator usually doesn't recommend. But the prompt says "The written plan... has to end in either a concrete recommendation or a referral." Okay, I will frame the recommendation as "Based on the roles defined, the ethical path is X." This leans more towards ethical counseling than pure mediation, but fits the "seminar/peer mediator" hybrid context.

      *   *Addressing Role Abuse:* This is the biggest risk. Confucianism can be weaponized. The procedure *must* include a "Remonstrance Check." If a role demand destroys the other's ability to fulfill *their* roles (e.g., father demands money so daughter can't be a mother), the demand is unethical *by Confucian standards*.

  4.  **Developing the Case Studies:**

      *   *Case 1 (Role Conflict):* Daughter (Caregiver) vs. Husband (Migration). Classic *Zhong* (loyalty to spouse) vs. *Xiao* (filial piety).
