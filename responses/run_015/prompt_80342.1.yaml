      *   *Critique:* The prompt asks for "plain language I can actually ask out loud."
      *   *Fix:* Put the questions in bold/quotes.
      *   *Critique:* Need to ensure the "Role Abuse" case is handled carefully. Confucianism isn't just "obey parents." *Mencius* says if the father is unrighteous, the son remonstrates. If the father threatens the son's ability to be a father himself, the obligation shifts.
      *   *Refinement on Case 2:* The "Unpopular" outcome. Let's make it the Caregiver case where the recommendation is that the daughter *cannot* move, but the family *must* support her. No, that's too easy. Let's make it the Role Abuse case where the recommendation is that the son *stops paying*, which feels unfilial to the father, but is actually the only way to preserve the relationship's moral integrity.

