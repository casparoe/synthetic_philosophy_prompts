      *(Final check on "Role Abuse"):* In Confucianism, if a parent is truly unrighteous (*bu yi*), the child is not obligated to facilitate that unrighteousness. In fact, facilitating it makes the child complicit. This is the key to solving Case 2.

      Let's assemble the document.

