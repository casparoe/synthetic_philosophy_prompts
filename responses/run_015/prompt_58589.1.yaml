  ugh ok so me and my friend just had like a three hour arguement about torture and the ticking time bomb thing and i need a tiebreaker lol. his take was basically that the thought experiment proves that even strict moral rules against torture have to give way if torturing one guy would save a whole city, because not torturing is just choosing a way bigger harm, and the only serious objection is just that in real life you can never be 100% sure you got the right guy or that he'll talk, but if you DID know for sure then pretty much everyone would agree its allowed. and then he said so we might as well make it legal with like judges signing off beforehand to keep it clean, and he added this twist where in his version its not even the bomber its the bombers kid brother who probably knows where it is, and its sleep deprivation and blasting music for days, which he says barely even counts as torture so opponents are being dramatic.

  i felt like parts of that were off but i couldnt put my finger on it tbh. like is it fair to say refusing to torture is just choosing more harm, and is uncertainty really the only big objection? and does his legalize-it-with-a-warrant move actually fix anything? plus does his little brother version plus the sleep deprivation stuff change the moral math or is that still torture and still the same problem? can you walk through his summary piece by piece and tell me whats actually right, whats twisted or missing, and whether his conclusion still holds if you fix it?
