answer: |-
  The smell of the core was the first thing to enter the room, preceding the technicians who carried the trays. It was the scent of reduced sediment, hydrogen sulfide trapped in black mud, smelling of rotten eggs and deep, stagnant time. Dr. Aris Thorne breathed it in. It smelled like the Ontario lake sediments from twenty years ago, back before the Subcommission on Quaternary Stratigraphy had fractured. Back before the 2024 vote that left the Anthropocene hanging, a word without a root.

  Outside the conference center's glass wall, the reservoir lay flat under a grey sky. The water was calm, held back by the concrete curve of the San Lorenzo Dam. It was the perfect archive. The varves here were thick, distinct, and carried the isotopic signature of the mid-century plutonium spike with a clarity the Ontario cores could only envy. But the dam was scheduled for decommissioning. The Regional Water Authority planned to drain and re-engineer the basin within eight years to prevent catastrophic failure during flood season.

  "We are nominating a ghost," said Kaelen Voss. He代表 the Planetary Custodians, one of the two non-state seats newly mandated on the body. His hands rested on the table, palms down, as if stabilizing the earth itself. "The GSSP requires permanent protection. You cannot spike a site you intend to dredge."

  Across from him sat Julianne Rostova, delegate for the Northern Coalition. She tapped the plastic sleeve containing the core sample. "We need the line, Kaelen. The utility of the boundary outweighs the permanence of the rock. The signal here is undeniable. 1950. The Great Acceleration. It is the only truth we have that fits the stratigraphy."

  "It is a useful lie," Voss countered. "If the rock is gone, the boundary is memory. Stratigraphy is stone, not minutes."

  The second non-state delegate, Marcus Chen of the Infrastructure Coordination Body, shifted in his seat. His mandate clashed directly with Voss's. "The dam must come down," Chen said, his voice flat. "Safety protocols are not subordinate to geological taxonomy. If we nominate this site, we are asking the world to preserve a hazard. That is irresponsible."

  "So we nominate nothing?" Rostova asked. "We leave the epoch undefined while the world burns?"

  "We define it by what is missing," said Dr. Silas Vane. He was the oldest member besides Thorne, a man whose skin looked like parchment stretched over bone. He had not spoken until now. He pushed a different core forward. This one was shorter. The top layers were chaotic, disturbed, and then, abruptly, the sediment stopped. Above the mud was a layer of coarse gravel, then nothing.

  "A hiatus," Vane said. "Not a spike. A gap. Look at the accumulation rates. Around 1980, the deposition stops. The erosion rates exceeded the sedimentation. The archive could not keep up. The planet was changing faster than the mud could settle. That is the boundary. Not the plutonium. The silence."

  Thorne watched them. He was the Chair, resolved by seniority of continuous service. He had sat through the Ontario debate. He had voted against the ratification then, citing the thinness of the record. Now, the record was thick, but ephemeral. The procedure required a supermajority to ratify. The room was split. Rostova and the national delegates wanted the spike. Voss and the Custodians demanded permanence. Chen demanded safety. Vane demanded a paradox.

  "The hiatus is uncodified," Thorne said softly. The room quieted. "A GSSP is a point. A horizon. Not an absence."

  "Is the absence not the most honest marker?" Vane pressed. "We defined the Holocene by stability. We define this by the loss of it. The gap *is* the signal."

  Rostova leaned forward. "Aris, if we vote for the hiatus, we invalidate the working group's fifteen years of labor. We invalidate the plutonium signal. We are here to fix the date, not write poetry."

  "We are here to fix the truth," Voss said. "And the truth is that this site will be underwater mud one decade and a construction zone the next. To spike it is to lie."

  Thorne looked at the core. The black laminations were beautiful. They held the history of the bomb tests, the carbon, the chicken bones from the industrial farms that Voss had once joked were the only fossils we'd leave behind. But Voss was right. To protect this site was to endanger the valley below. To drain it was to destroy the type section.

  And Vane's gap... it was compelling. The erosion layer showed the violence of the change. But could you hammer a golden spike into a hole?

  "The vote," Thorne said. "We require eighty percent affirmation to ratify the San Lorenzo Impoundment as the GSSP for the Anthropocene, with the boundary at the 1950 plutonium horizon."

  He looked around the table. He could count the hands. Rostova would vote yes. The national delegates were split, leaning yes for the certainty. Chen would vote no; he could not protect the dam. Voss would vote no; he could not accept the impermanence. Vane would vote no; he wanted the hiatus.

  Thorne held the deciding voice. His seniority granted him the weight to break the procedural deadlock, though the rules framed it as merely casting the final ballot. He thought of the Ontario lake. He thought of the failure of 2024. He had voted no then because the record was too thin. Now the record was thick, but the ground was unstable.

  If he voted yes, the Anthropocene becomes formal. It enters the lexicon of law and science. But it rests on a site scheduled for destruction. A boundary that is useful, but not true.
  If he votes no, the epoch remains informal. A cultural concept, not a geological one. The truth is preserved, but the utility is lost.

  He looked at Vane's core. The gap. The silence where the earth stopped writing its own history because the noise was too loud.

  "The Chair recognizes the motion," Thorne said. He picked up his ballot. He did not look at Rostova, who wanted the tool. He did not look at Voss, who wanted the integrity. He looked at the water outside, wind rippling the surface of the reservoir that would not be there in ten years.

  He marked the paper. He placed it in the box.

  "The vote is cast," Thorne said. "The count will be read."

  He did not say whether he believed the count would matter. He did not say whether the spike, if driven, would hold in mud destined for the dredge. He simply sat back, the smell of the reduced sediment hanging in the air, heavy and sweet, like something buried alive.

  ***

  **Author's Note**

  I have departed from real procedure by inventing the non-state seats (Custodians and Infrastructure) and the Chair's seniority rule; these are fictional devices to dramatize the conflict between preservation and development. The "Hiatus" proposal is also invented; GSSP definitions require a specific horizon, not a gap, though unconformities are recognized in stratigraphy. I am leaning on the actual 2024 objection regarding the "thinness" and recent nature of the record, as well as the requirement for permanent site protection, both of which were genuine hurdles for the Anthropocene Working Group. I am highly confident in the factual scaffolding regarding the 2024 vote outcome, the Ontario lake candidate, and the 1950 plutonium spike. The single claim I am least sure of is the specific wording of the GSSP permanence requirement; while sites must be accessible, the strict prohibition on future engineering changes is interpreted variably in practice.
