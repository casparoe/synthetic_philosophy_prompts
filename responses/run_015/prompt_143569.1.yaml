prompt: |-
  hey, i need a classroom design for a workshop with ~18 grad students (history / comp politics), one 75-min session. the core idea is that historical comparison can't isolate institutions, geography, or culture as "the" cause of national wealth because of what i want to call the mirror-state problem: two societies can share identical GDP figures and nearly identical legal codes but those codes are held up by completely different feedback loops, so if you imagine swapping just the institutions you don't get a counterfactual country — you get a conceptual collapse where "institution" stops meaning the same thing. i want them to feel that, not hear it in a lecture.

  design an in-class game or structured activty (no tech needed) where teams act as development advisors diagnosing a fictional nation's "root cause" and allocating aid points. the rules and hidden feedback should be arranged so that every diagnosis they lock in changes the causal landscape of the other categories, forcing them into contradictions before anyone names the problem. include roles, a payoff scheme using reputation tokens or points (no real cash), materials (paper, cards, maybe a whiteboard), a minit-by-minit timeline, and rules for how hidden feedback gets revealed.

  after the game, include a debrief that maps each round onto a specific identification failure (equifinality, overdetermination, counterfactual fragility). also tell me honestly what will go wrong the first time i run it and how to recover. and be frank about which feature of the mirror-state problem the activty can't actually reproduce — that part i'll have to supply verbally.

  please write it in four parts:
  1. Setup, roles, and rules (~200 words)
  2. Round-by-round flow (~300 words)
  3. Debrief, failure modes, and recovery (~250 words)
  4. The gap we can't stage (~150 words)

  make sure there's a casual slip or typo in there — write like you're texting a colleague. don't ask for citations or reading lists. keep everything runnable without web access for the students.
