answer: |-
  1. Setup, roles, and rules
  Split the 18 students into 6 teams of 3 (Development Advisors). Each team gets a dossier on "Republica" (mid-income, stagnating). They have 10 Aid Points to allocate across three buckets: Institutions, Culture, Geography. They also get Diagnosis Cards claiming root causes (e.g., "Weak Courts," "Risk-Averse Culture"). Here's the catch: the board holds hidden modifiers. If Team A plays "Strengthen Courts," the board flips a modifier that devalues "Culture" cards for everyone else. You can't see the modifiers until you commit points. Goal: Maximize "Stability Score" by end of Round 3. Winner gets bragging rights (reputation tokens). Don't overthink the math, just feel the friction. Make sure you recieve the cards face down. Keep the dossiers sealed until I say go. No phones out. The point isn't to win, it's to get stuck. If you find a stable strategy, you missed the point. I'll act as the World Bank Board, controlling the hidden feedback loops. You'll think you're optimizing, but the system is rigged to contradict you. Physical setup: whiteboard for scores, paper for dossiers. Grab some pens too. I'll keep the master ledger hidden behind the podium so they can't verify the math. It needs to feel bureaucratic and slightly opaque.

  2. Round-by-round flow
  Min 0-10: Briefing. Hand out dossiers. Explain Republica is stalling. Set the stakes: reputation tokens for highest stability. Tell them this is a standard optimization problem. Lie slightly.
  Min 10-25 (Round 1): Teams diagnose root cause privately. Submit cards. Reveal basic stats. Everyone thinks they found the lever. Most will pick Institutions because it's comp poli. They place bets on the whiteboard.
  Min 25-40 (Round 2): Teams allocate Aid Points based on Round 1. Here's the twist: I reveal the "Feedback Board." If >3 teams invested in Institutions, Geography efficiency drops by 50% (industrial base collapses). If >3 invested in Culture, Institution cards become "Corrupt" (elite capture). Teams must re-allocate or lose points. Panic ensues. They realize their independent choices aggregated into a systemic failure. The board updates publicly, shaming the majority.
  Min 40-55 (Round 3): Final push. Teams try to fix the mess. But now the definitions shift. An "Independent Court" card played now counts as "Foreign Interference" because of previous Culture moves. The goalpost moves. You tell them their previous aid created dependency, changing the meaning of "independence." Scores will likely drop overall. No one wins. I will arbitrarily invalidate a card type mid-round to simulate conceptual collapse. If they argue, note their resistance. Make sure to announce the rule change loudly. Let them feel the rug pull.
  Min 55-75: Debrief. Stop the game even if they protest. The frustration is data. Collect the tokens. Ask them why their best move became their worst move. Don't explain yet. Let them sit in the contradiction. Watch who blames the rules vs who blames the model. This tension is where the learning lives. Ensure you track the complaints on the board.

  3. Debrief, failure modes, and recovery
  Map Round 1 to Equifinality (multiple paths look valid initially). Round 2 is Overdetermination (variables aren't independent; moving one breaks another). Round 3 is Counterfactual Fragility (the intervention changes the context so the counterfactual is invalid).
  What goes wrong: Students will try to find the "winning algorithm" rather than feeling the contradiction. They might ask for more data.
  Recovery: Refuse extra data. Say "The model is the reality." If they stall, force a timer. If they complain the rules changed, say "Exactly."
  Another risk: Silence. If they don't talk, prompt them: "Why did your points lose value?"
  Also, some might disengage if they feel cheated. Acknowledge the frustration. Tell them the cheating is the lesson. The system isn't linear.
  Make sure to connect the token loss to the theoretical collapse. When their points vanished, that was the "institution" losing its meaning.
  If they solve it too fast, add a constraint. But they wont.
  Keep the debrief tight. Don't lecture. Ask them to define "institution" now vs Round 1.
  Watch for the group that tries to game the feedback loop. Call them out gently. Ask if real states allow that kind of optimization.
  The goal is to make them uncomfortable with causal isolation. If they leave happy, you failed.

  4. The gap we can't stage
  The game simulates interdependency, but it can't simulate semantic drift. In reality, when you swap institutions, the word "court" means something different in the new culture. The game keeps the card name "Court" static even if its value changes. You have to verbally drive home that the *concept* collapsed, not just the efficiency score. The tokens move, but the language doesn't break. You need to point out that in real history, the vocabulary itself becomes unreliable. When we say "rule of law" in Country A vs Country B, we aren't measuring the same thing. The activity shows the *effect* changing, but you must explain that the *definition* changed too. That's the mirror-state core: the reflection isn't just distorted, it's a different object entirely. You must clearly articulate why the *analysis* itself broke down.
