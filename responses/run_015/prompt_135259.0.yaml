  my therapist mentioned sympathy fatigue last week and now i cant stop thinking about whether feeling for someone is actually a moral skill or just a reflex. i just rewatched To Kill a Mockingbird for the first time since highschool and want to read it through Adam Smith's sympathy and the impartial spectator, but with a twist: what if the spectator isnt just reason but a kind of social technology that breaks down when a community shares the same prejudice? like Atticus has sympathy for Boo Radley and Tom Robinson, but the towns collective spectator approves of the verdict. does the novel show that sympathy without institutional distance is useless? and what about Scout - is her sympathy developing correctly or is she just mimicking Atticus? i want a reading that takes both the novel and Smith seriously, not just using Atticus as a poster boy for empathy. especially the trial scene and the Boo Radley ending. dont quote the book though, i dont have it in front of me.
reasoning: |-
