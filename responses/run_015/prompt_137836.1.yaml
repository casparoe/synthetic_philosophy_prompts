answer: |-
  Let $H$ be the hypothesis of natural death (SIDS), $\neg H$ be murder, and $E$ be the evidence (two deaths). The jury needed the posterior probability of guilt given the evidence: $P(\neg H | E)$. By Bayes' theorem, this requires the likelihood $P(E | \neg H)$, the prior $P(\neg H)$, and the alternative likelihood $P(E | H)$.

  Meadow provided neither the posterior nor the prior. He provided an estimate of $P(E | H \land D)$, where $D$ represents the demographic profile (affluent, non-smoking). He calculated this by squaring the single-death rate, assuming independence. The conviction turned on treating this tiny likelihood as if it were the posterior probability of innocence, $P(H | E)$.

  This is strictly case (a): transposing the conditional. The jury conflated $P(E | H)$ with $P(H | E)$. This is the Prosecutor's Fallacy, a Bayesian error. It is not case (b): treating the conditional probability as the probability of a conditional proposition. Lewis's triviality results demonstrate that no proposition $A \rightarrow B$ exists such that $P(A \rightarrow B) = P(B | A)$ for all probability functions, unless the function is trivial. The court did not stumble over the ontology of conditionals. They did not argue about whether "If SIDS, then two deaths" expresses a truth-apt proposition capable of being negated or disjoined. They simply swapped the terms in a ratio. Your hunch is correct: Lewis is a red herring here. The error was arithmetic and epistemic, not semantic. The tragedy relies on no specific theory of conditionals; it works equally well on a suppositional view where conditionals have no truth conditions. The jury didn't need to believe $H \rightarrow E$ was a proposition; they only needed to believe $P(E | H)$ was small enough to imply $\neg H$.

  Regarding the mismatch of suppositions: Meadow conditioned on $D$ (demographics); the juror must condition on $E$ (evidence) to update the hypothesis. The gap is between the reference class ($D$) and the evidence set ($E$). Lewis's framework treats conditional probability as a two-place function $P(\cdot | \cdot)$. It is silent on how to select the conditioning proposition. It offers no norm for deciding whether $D$ or $E$ is the appropriate fixed supposition for the probability function. This silence is feature, not bug; triviality results concern the coherence of the probability function itself, not the empirical selection of background knowledge. The damage here was done by the independence assumption (squaring the rate) and the reference class selection, neither of which Lewis's theorem adjudicates.

  On embeddings: Adams and Edgington argue suppositionalism struggles with embeddings (e.g., "It is not the case that if $A$ then $B$"). Legal reasoning is indeed stuffed with embeddings, but this case did not trigger them. The reasoning was flat: "The probability is 1 in 73 million; therefore, innocence is impossible." There were no negated conditionals or disjunctions of conditionals in the statistical argument. The logic was modus ponens on a probability claim, not a complex propositional attitude toward a conditional. Using this case to test semantic theories of conditionals is therefore uninformative. The failure was not in handling the syntax of conditionals, but in handling the magnitude of numbers.

  Does the episode confirm anything about triviality results? No. It is a case the theory was never in the business of covering. Triviality results constrain the logical form of probability assignments to conditionals; they do not prevent users from misapplying Bayes' theorem to event frequencies. The theory remains intact because the misuse was outside its scope.

  What should the defence have objected to? Two points. First, the independence assumption: genetic or environmental factors make successive SIDS deaths correlated, so squaring the figure is statistically invalid. Second, the transposition: explicitly stating that $P(E | H) \neq P(H | E)$. The load-bearing objection is the independence assumption. It destroys the "1 in 73 million" figure, reducing it to something far less shocking. Would it have changed the verdict? Against the emotional weight of "two dead babies" and Meadow's authority, perhaps not. But it would have removed the false scientific certainty that made the Bayesian negligence palatable. The tragedy wasn't that conditionals lack truth conditions; it was that the jury was given a number they were told was a probability of guilt, when it was neither.
