  *   **Yes** → **Hard Eliminativist**
      *   *Reasoning:* If it doesn't interact, it doesn't exist. The lattice is discarded as metaphysical junk.
  *   **No** → Go to Node 2.

  **Node 2:** Is saying the lattice "exists" just a shorthand for "our best math uses lattice variables"?
  *   **Yes** → Go to Node 3.
  *   **No** → Go to Node 4. (You believe ontology is about the world, not just our descriptions).

  **Node 3:** If existence is just math shorthand, can the lattice still be a mind-independent reality?
  *   **Yes** → **⚠️ FLAG: INCOHERENT**
      *   *Reasoning:* This matches the combo "ontology is bookkeeping but the lattice is genuinely real." You can't claim existence is just linguistic bookkeeping while simultaneously claiming the entity is mind-independent.
  *   **No** → **Quinean Deflationist**
      *   *Reasoning:* "To be is to be the value of a variable." The lattice exists only in the thin sense that the theory quantifies over it. No thick reality claimed.

  **Node 4:** If the math breaks without the lattice, does that force the lattice into reality?
  *   **No** → **Ghost-Neutral**
      *   *Reasoning:* You tolerate the lattice in the model (it's mathematically necessary) but deny it has "being." It's a placeholder, not a thing.
  *   **Yes** → Go to Node 5. (You are a Robust Realist).

  **Node 5:** Is the real part the lattice chunks themselves, or just the mathematical shape they form?
  *   **Just the Shape** → **Structural Realist**
      *   *Reasoning:* The "stuff" is unknowable or irrelevant; only the relations/structure are real.
  *   **The Chunks** → Go to Node 6.

  **Node 6:** If the Lattice theory and Smooth theory both work, is one definitely false?
  *   **Yes** → **Generous Realist**
      *   *Reasoning:* You commit to the specific ontology (chunks) despite underdetermination. One story is true, we just don't know which.
  *   **No** → **⚠️ FLAG: UNEXPLORED/INCOHERENT**
      *   *Reasoning:* Claiming distinct objects (chunks vs. smooth) are both "definitely true" simultaneously is logically tense. This zone is rarely occupied without sliding back into Structural Realism.

  ***

  **Blind Spots & Overlaps:**
  *   **Structural Realist vs. Quinean Deflationist:** On paper, these are distinct (Reality vs. Bookkeeping). In practice, both lean heavily on mathematical structure. A Structural Realist speaking loosely can sound indistinguishable from a Deflationist here. The tree separates them at Node 2, but respondents often wobble on whether structure is "real" or just "essential bookkeeping."
  *   **Ghost-Neutral vs. Eliminativist:** Both deny the lattice has robust being. The distinction hinges on whether the lattice is *discarded* (Eliminativist) or *retained as ontologically inert* (Ghost-Neutral). In experimental practice, these look identical.
