      *   **Tone/Style:** British English. Philosophical, rigorous, analytical.

  2.  **Deconstruct the Position:**
      *   *Core Metaphor:* National character as a "lens" or "grammar" (hermeneutic default) rather than a "substance" or "average" (essence/statistic).
      *   *Mechanism:* Institutional sedimentation (laws, education, media, rituals) creates shared habits of interpretation.
      *   *Normative Constraint:* Generalisations are tools for understanding context, not predicting behaviour deterministically. They must yield to individual evidence.

  3.  **Address Core Assumption (i): Institutional Transmission vs. Methodological Individualism:**
      *   *Claim:* Institutions can sustain a shared frame without it just being the sum of individual minds.
      *   *Refutation Condition:* If it turns out institutions *cannot* exert causal power independent of individual psychology, or if the "shared frame" dissolves upon micro-analysis.
      *   *World Look:* A world where institutional norms change instantly with individual preference shifts, or where neuro-cognitive science proves no inter-subjective structures exist.
      *   *Decisive vs. Anomaly:* Decisive = Proof that "institutional sedimentation" is merely a metaphor for aggregated individual habits. Anomaly = High variance in interpretation within the same institution.
      *   *Concession:* Defenders must concede that if institutional mechanisms (education, law) fail to correlate with interpretive habits, the theory loses its mechanism.

  4.  **Address Core Assumption (ii): Hermeneutic Defaults vs. Statistical Aggregates:**
      *   *Claim:* There is a qualitative difference between a "way of interpreting" and an "average trait."
      *   *Refutation Condition:* If hermeneutic defaults are shown to be *nothing but* statistical regularities in behaviour misdescribed as interpretive frameworks.
      *   *World Look:* A world where big data predicts behaviour perfectly without reference to meaning/context, rendering the "interpretive" layer redundant.
      *   *Decisive vs. Anomaly:* Decisive = Demonstration that "interpretation" is an epiphenomenon of behavioural clustering. Anomaly = Cases where statistical norms exist without shared interpretation.
      *   *Concession:* If behavioural prediction works better without the hermeneutic layer, the layer is otiose.

  5.  **Address Core Assumption (iii): Defeasibility vs. Essentialism:**
      *   *Claim:* Holding generalisations as defeasible prevents them from becoming essentialist.
      *   *Refutation Condition:* If defeasibility is merely rhetorical and functionally operates as essentialism in practice (e.g., counter-instances are always treated as exceptions that prove the rule).
      *   *World Look:* A cognitive reality where humans *cannot* actually hold stereotypes defeasibly; the moment a frame is activated, it overrides individual data.
      *   *Decisive vs. Anomaly:* Decisive = Cognitive science proving defeasible reasoning regarding social groups is psychologically impossible. Anomaly = Specific instances where the frame resists updating.
      *   *Concession:* Defenders must admit that if the "defeasibility clause" is never actually invoked in real discourse, it's a sham safeguard.

  6.  **Risky Predictions:**
