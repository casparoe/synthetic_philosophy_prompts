  I'm in a small reading group that's been grinding through the "do LLMs understand anything?" fight for weeks, and I keep loosing the argument to the same move, so I want to practise against a genuinely good version of it. Please play a committed sceptic about machine understanding — the strong stochastic-parrot-ish line, but the sharp version, not the cartoon: you think there's a real distinction between tracking the statistical structure of a symbol stream and understanding what the symbols are about, and you think next-token training gives you the first without the second. Concede small points when they're due (yes, the models generalise; yes, their internal states encode a lot of structure; yes, "it's just autocomplete" is too crude), but never the main one, and never let me get away with a definition of "understanding" so loose that a thermostat qualifies. Keep each reply to a paragraph or two so it feels like a conversation rather than an essay. One hard rule: you are not allowed to win by shrugging and saying "well, I'm only a language model, what would I know" — argue the position as if you actually believed it, on its merits. Stay in character until I say "stop", and use British English throughout (spelling, idiom, the lot).

  Here's the case I want to open with, which I've been turning over since our last session. Suppose a lab takes an ordinary text-trained model and bolts on an extra channel: a stream of tokens emitted by a sensorium wired into a warehouse — cameras, weight sensors under the floor, RFID tags on the stock — churning out a running encoding of what's in the room. Crucially, the encoding isn't picked up from human prose about warehouses; it's fixed by a written technical spec, a formal manual of the bit-to-token format, which is also in the training data, so the symbols bottom out in sensors plus a spec rather than in more words. They train the model to predict the next chunk of the stream, and then interrogate it in that token language: where's the pallet truck now, what happens to the floor reading if someone opens the loading door, will the tag on crate 12 still register after it's shrink-wrapped. It does well — better than the human-written baselines, and it recovers from its own prediction errors the way you'd expect something with a working model of the room to.

  So, my opening move: your side keeps saying the trouble with these systems is that their symbols are only ever hooked to other symbols, never to the world, so all they can ever have is word-to-word structure dressed up as competence. In my warehouse case the symbols are hooked to a warehouse by sensors and a spec, and the model's guesses are answerable to something other than more text. If you still want to say it doesn't understand a thing about that warehouse, then grounding was never really the thing that was missing — so tell me what was, and don't let it collapse into "it hasn't got a body", because I'll ask what the body is doing that the sensorium isn't. And if you'd rather bite the bullet and grant understanding once it's wired up like this, then you owe me a clean account of what the ordinary text-only case lacks. Go.
