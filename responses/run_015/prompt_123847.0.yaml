      *   *Substrate:* Voltage levels in a comparator circuit.
      *   *Analysis:* The voltage *is* the number. The comparator compares voltages.
      *   *Verdict:* Similar to LLM. The physics explains it fully. However, in engineering, we treat the register as causal.
      *   *Comparison:* Is there a difference between LLM and Thermostat? The Thermostat is designed with a specific symbolic logic (if X > Y then Z). The LLM is statistical.
      *   *Honest Assessment:* The procedure might say "Shadow" for both. But intuitively, the Thermostat feels more "symbolically causal" because it's a designed control system. The procedure needs to account for *design intent* vs. *physical necessity*.

  6.  **Addressing the "Shadow vs. Explanation" Question:**
      *   If it only correlates, is it explanatory?
      *   *Answer:* It depends on the *level of analysis*. For a physicist, it's a shadow. For a psychologist or software engineer, it's an explanation.
      *   *Key Concept:* Multiple Realizability. If the same symbolic outcome can be achieved by different substrates, the symbol is explanatory because it captures the invariant pattern.

