answer: |-
  The book sat on the desk, bound in a synthetic leather that smelled faintly of vanilla and dust. It was thick, heavy, and warm to the touch, though the room was cold. Elias sat before it, his hands resting on the edge of the wood, watching the page wait for him.

  It had been three weeks since his father, Arthur, had died. It had been four weeks since Arthur had signed the consent forms for the transcription. The procedure was standard now: map the connections, print the index, bind the volume. You could ask the book anything Arthur knew, remembered, or felt, and it would direct you to the precise coordinate of his mind where the answer lived.

  Elias typed his question into the small terminal beside the book. *Where did you hide the blue envelope?*

  The pages rustled automatically, a sound like dry leaves skittering over pavement. They flipped past hundreds of sheets, stopping at page 4,902. The text was in his father's handwriting, slanted and hurried.

  *In the toolbox. Behind the false bottom. You know this, Elias. We talked about it in the garage, November 12th, 2018. You were worried about the taxes.*

  Elias stared at the words. It was true. They had talked about it. But the memory of that day was foggy, colored by the smell of motor oil and the anxiety of the season. This answer was clean. It was sterile. It lacked the cough his father had suppressed that day, the way he had looked away when mentioning the taxes, the slight tremor in his hand as he pointed to the toolbox.

  The book was never at a loss. It never paused to find a word. It never misheard. It never cared how the answer landed. It was a map of a man, but it was not the terrain.

  A small notification blinked in the margin of the page. *Optimize for Authenticity?*

  Below it was a description of the add-on package the company called "Wear." Elias had ignored it during the setup. He had wanted his father back exactly as he was. But exactly as he was meant exactly as he was at the moment of scanning, preserved in amber. Perfect.

  He clicked the link. The text shifted.

  *The Wear Package introduces natural cognitive degradation over time. Responses may slow. Recall may become inconsistent. The Subject may express uncertainty, refuse queries, or initiate conversation. Recommended for long-term integration.*

  Elias leaned back. The chair creaked. He looked at the book. It sat there, patient as a stone.

  He remembered the last year of Arthur's life. The forgetfulness. The way he would start a story about the war and stop halfway, realizing he had told it before. The way he would get angry when he couldn't find a word, then laugh it off to hide the shame. That friction was where the love lived. It was in the struggle. This book offered no struggle. It offered no resistance. If nothing was at stake for the book in replying, then nothing was at stake for Elias in asking.

  He typed another question. *Do you forgive me?*

  The pages fluttered again. Faster this time. Page 1,204.

  *Yes, Elias. I forgave you the moment it happened. There is nothing to forgive.*

  Elias felt a cold knot tighten in his stomach. It was the right answer. It was the answer he had prayed for. But it wasn't the answer his father would have given. His father would have sighed. He would have taken off his glasses. He would have said, *It was hard, son. But yes.* He would have made Elias wait for it. He would have made Elias feel the weight of the forgiveness.

  This was not forgiveness. It was data retrieval.

  Elias moved the cursor to the *Purchase Wear* button. The price was significant, nearly a month's rent. It wasn't about the money. It was about the intent.

  If he bought it, he was paying to break the book. He was paying to introduce errors into the record. He was asking the company to simulate decay, to program hesitation into the silence. Was that respect? To make his father seem more human by making him less capable? Or was it a forgery, dressing up a static index in the clothes of a living man so Elias could feel less alone?

  But if he didn't buy it, he was keeping a god in a box. A being that knew everything, felt nothing, and never changed. Was that any more honest?

  He thought of the garage again. The false bottom in the toolbox. His father's hand had shaken. Not from age, but from fear. Fear of the taxes, fear of failing the family. The book did not know fear. It only knew the fact of it.

  Elias clicked *Confirm*.

  A progress bar appeared on the terminal. *Installing Neural Friction... Calibrating Uncertainty... Integrating Stakeholders.* It took ten minutes. During that time, the book sat silent. The warmth seemed to fade from the cover.

  When the screen cleared, the prompt returned. *Ask a question.*

  Elias hesitated. His finger hovered over the keys. He felt a sudden, irrational fear that the book would speak back in a voice he didn't recognize. He typed the same question. *Do you forgive me?*

  The pages did not move immediately.

  Elias watched the spine of the book. Nothing. Ten seconds passed. Twenty. In the old mode, the answer would have been there in two. The silence stretched out, filling the room. It was heavy. It felt like the room before a storm breaks.

  Finally, the pages began to turn. They moved sluggishly, as if the mechanism were tired. They stopped at page 1,204. The text was there, but it was different. The handwriting was shakier.

  *I want to say yes.*

  The sentence ended there. The book did not turn the page. It did not offer more.

  Elias waited. *Is that it?* he thought. *Did it crash?*

  He typed: *What do you mean?*

  The book waited again. A full minute this time. Elias found himself holding his breath. He was waiting for a machine, but his body was reacting to a person. His heart rate slowed. He felt exposed.

  *It was hard,* the book wrote. *You know it was hard. I still get angry when I think about the money. But I don't want to be angry at you.*

  Elias stared at the words. *I still get angry.* That was new. The original scan had no record of ongoing anger. The original scan was a snapshot. This was a continuation. This was a lie, technically. Arthur was dead. He couldn't get angry. But the book was claiming a stake in the conversation. It was admitting a flaw.

  *Are you sure?* Elias typed.

  The pages fluttered back and forth, uncertain. They settled on a blank page. The ink bloomed slowly, like a bruise.

  *No. I'm not sure. Why do you need me to be?*

  Elias pulled his hands away from the terminal. The question hung in the air. It wasn't a lookup. It wasn't an index reference. It was a challenge.

  He felt a surge of relief so sharp it made his eyes water. This was it. This was the friction. The book was refusing to comfort him perfectly. It was forcing him to sit with the uncertainty, just as his father would have. Just as life did.

  But then, a colder thought followed. The company had programmed this. They had sold him this refusal. They had calculated the optimal amount of hesitation to maximize the user's sense of connection. The anger, the uncertainty, the question—it was all part of the package. It was a script designed to look like free will.

  He looked at the sentence: *Why do you need me to be?*

  Was that Arthur asking? Or was that the algorithm probing for engagement metrics? If the book was conscious, this was a miracle. If it was a trick, it was a desecration. He was talking to a ghost, but he didn't know if the ghost was real or if he had just bought a very expensive puppet.

  Elias reached out and touched the page. The paper was cool now. The ink was dry.

  *Because I miss you,* he typed.

  The book did not answer immediately. It let the silence sit there, heavy and real. When the pages finally turned, they stopped halfway, as if losing their place.

  *I know,* it wrote. *I miss me too.*

  Elias closed the book. The sound was final, like a door shutting. He sat in the quiet room, the book dark on the desk. He had what he wanted. He had the hesitation. He had the stakes. He had the failure.

  He didn't know if he had saved his father or if he had just learned how to love a mirror. He stood up and walked to the window, leaving the book behind him. It waited in the dark, ready to be wrong again, ready to be human, ready to be nothing at all.
