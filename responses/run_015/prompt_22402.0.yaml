prompt: |-
  I cover science and ideas, but I'm stuck on a tiny newroom dispute and I think I'm overthinking it. We have a style rule that says when a politician announces a policy, we should write "the mayor said she will raise the minimum wage," not "the mayor will raise it." A new reporter wrote the latter after a press conference because the mayor's office confirmed it and no one is denying it. I told them we have to keep the "said" because the rule is about attribution. They say the rule is really about not turning claims into facts, and in this case it's already a fact. I can't point to a fact that settles it except our past usage, and they can always say they meant the rule a little differently. Is there a principled way to decide who's right, or is this just two people inventing a rule after the fact?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** Science and ideas journalism (likely high rigor, precision-focused).
      *   **Conflict:** A style dispute between the user (editor/senior?) and a new reporter.
      *   **The Issue:** Attribution of political promises/announcements.
          *   User's stance: "The mayor *said* she will..." (Attribution required).
          *   Reporter's stance: "The mayor *will*..." (Statement of fact, confirmed by office).
      *   **The Rule:** "When a politician announces a policy, write 'X said she will,' not 'X will.'"
      *   **The Reporter's Argument:** The rule is about avoiding claims-as-facts, but since it's confirmed and undisputed, it *is* a fact (or at least, the intent is solid).
      *   **The User's Dilemma:** Feels like they're overthinking. Can't point to an external fact to settle it. Worried both sides are rationalizing after the fact.
      *   **Goal:** Find a principled way to decide who is right, or acknowledge if it's just post-hoc rationalization.

  2.  **Deconstruct the Journalism Ethics/Style Principle:**
      *   **Core Principle:** Attribution vs. Fact.
      *   **Scenario:** A politician *announces* a policy.
      *   **Reality Check:** An announcement is not an enactment. A mayor *saying* they will raise the wage is a fact. The wage actually *being* raised is a future contingent event.
      *   **Risk:** If the writer says "The mayor will raise the wage," it implies certainty. If the mayor changes their mind, gets blocked by a council, or faces legal hurdles, the story looks wrong.
      *   **Reporter's Logic:** "Confirmed by office" = Fact.
      *   **Counter-Logic:** Confirmation of *intent* is not confirmation of *outcome*.

  3.  **Evaluate the "Science and Ideas" Context:**
      *   Science journalism values precision, uncertainty quantification, and distinguishing hypothesis from result.
      *   Applying this to politics: Distinguish *announcement* (data point) from *enactment* (outcome).
      *   This aligns more with the User's stance ("said she will").

  4.  **Analyze the "Rule" Itself:**
      *   Is the rule being invented after the fact?
      *   *User:* "We have a style rule..." (Implies pre-existing).
      *   *Reporter:* "The rule is really about..." (Reinterpreting the spirit).
      *   *Reality:* Most style guides (AP, Reuters, NYT) lean heavily toward attribution for future actions by politicians.
      *   *Verdict:* The User is likely more aligned with standard professional norms, but the Reporter isn't entirely wrong about the *spirit* (don't be overly skeptical of confirmed info), just the *application*.

  5.  **Develop a Principled Framework:**
      *   Need to move beyond "because I said so" or "because we always did."
      *   **Principle 1: The Epistemological Boundary.** What do we *know* right now? We know she spoke. We don't know the future.
      *   **Principle 2: The Agency Boundary.** Who has the power? Does the mayor have unilateral power, or does a council/vote stand in the way?
      *   **Principle 3: The Reader Expectation.** What does "The mayor will" signal to a reader vs. "The mayor said she will"?

  6.  **Drafting the Advice:**
      *   **Validate:** Acknowledge this is a classic newsroom tension (Attribution vs. Narrative Flow).
      *   **Diagnose:** It's not just post-hoc rationalization. There are real stakes.
      *   **The "Science" Angle:** Leverage the user's beat. Science writing treats "proposal" differently from "result."
      *   **The Decision Matrix:**
          *   *Intent vs. Action:* "Said" records intent. "Will" predicts action.
          *   *Authority:* Can she do it alone? (Executive order vs. Legislation).
          *   *Time:* Is it immediate or next fiscal year?
      *   **Resolution:** The User is technically more correct by standard journalism ethics, but the Reporter needs to understand *why* so they don't feel silenced.
      *   **Actionable Step:** Refine the rule. Make it about *certainty levels*.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is the reporter actually right in some cases?* If the mayor signs an executive order *today* that takes effect *tomorrow*, "The minimum wage will rise" is accurate.
      *   *Distinction:* Announcement of *intent* vs. Announcement of *enactment*.
      *   *Nuance:* If the press conference was "I am signing this order," then "The wage will rise" is defensible. If it was "I propose we raise," then "Said" is mandatory.
      *   *User's prompt:* "Announces a policy." Usually implies intent/proposal.
      *   *Reporter's point:* "Office confirmed it." Confirmed what? The intent or the legal mechanism?
      *   *Conclusion:* The User's instinct is safer, but the Rule needs nuance to account for executive orders vs. legislative proposals.

  8.  **Finalizing the Response Structure:**
      *   **Direct Answer:** It's not just rationalization; there's a real epistemological difference.
      *   **The Core Principle:** Distinguish *Speech Act* from *World State*.
      *   **The "Science" Parallel:** Hypothesis vs. Conclusion.
      *   **The Test:** The "What if she doesn't?" test.
      *   **Compromise/Refinement:** When is "Will" okay? (Executive orders, budgeted items).
      *   **Advice on Managing the Reporter:** Explain the *why*, don't just enforce the *what*.

  9.  **Tone Check:** Professional, empathetic to both sides, authoritative on journalism ethics. (Avoid taking sides too harshly, but validate the user's seniority/experience while acknowledging the reporter's logic has merit in specific contexts).

  10. **Final Polish:** Ensure the distinction between "promise" and "fact" is clear. (Self-correction: Make sure to mention AP Style or similar as a benchmark).

  *(Self-Correction during drafting)*: I should emphasize that in science journalism, precision about uncertainty is a core value. This makes the user's stance even more critical for *their* specific publication.

  *(Final Plan)*:
  1. Validate the tension (it's common).
  2. Define the principled difference (Epistemology).
  3. Apply the "Science" lens.
  4. Offer a nuanced rule (Intent vs. Enactment).
  5. Give advice on how to talk to the reporter.cw
answer: |-
  This is not just two people inventing a rule after the fact. You are grappling with a fundamental tension in journalism between **narrative efficiency** and **epistemological precision**.

  Because you cover science and ideas, your publication likely values precision about uncertainty more than a general assignment desk might. In that context, you are principledly right, but the reporter is asking a question that deserves a better answer than "because the style guide says so."

  Here is a principled framework to resolve the dispute, grounded in journalism ethics and the specific needs of science reporting.

  ### 1. The Core Principle: Speech Act vs. World State
  The dispute comes down to what is actually being described.
  *   **"The mayor said she will..."** describes a **Speech Act**. It is a fact that she spoke. It is verifiable right now. If she changes her mind tomorrow, your story remains true.
  *   **"The mayor will..."** describes a **World State**. It is a prediction about the future. It relies on variables you cannot control (city council votes, legal challenges, budget shortfalls, political flip-flops).

  **The Principle:** *Journalism should record what has happened, not predict what will happen, unless the outcome is mechanically inevitable.*

  If the reporter writes "The mayor will raise the wage," and the mayor gets blocked by the city council next week, your publication has published a falsehood. If you write "The mayor said she will," and she gets blocked, your publication has accurately reported the political landscape.

  ### 2. The "Science" Lens
  Since you cover science, use that analogy. It usually resonates well with reporters in your niche.
  *   **Announcement = Hypothesis/Proposal.** When a scientist says, "We are going to test this drug," you do not write "The drug cures the disease." You write "The researchers *say* the drug could cure..."
  *   **Enactment = Peer-Reviewed Result.** You only drop the attribution when the mechanism is complete.

  If you allow "The mayor will" based on a press conference, you are treating a political promise like a peer-reviewed result. In science journalism, distinguishing between a claim and a verified outcome is job one.

  ### 3. When the Reporter Is Actually Right (The Nuance)
  The reporter isn't entirely wrong to push back. There are cases where "will" is appropriate, and understanding this distinction will help you mentor them rather than just overrule them.

  **You can drop the "said" only if the action is administrative and inevitable.**
  *   **Case A (Proposal):** "I am proposing we raise the wage to $20." -> **Must use "said."** (Requires council vote, budget approval).
  *   **Case B (Executive Order):** "I am signing an order today that raises the wage." -> **"Will" is acceptable.** (The mechanism is triggered; only time needs to pass).

  If the mayor's office "confirmed it," did they confirm the *intent* or the *legal mechanism*? Usually, they confirm the intent. If there is any legislative or bureaucratic step remaining, the attribution must stay.

  ### 4. The "What If" Test
  To settle this with the reporter without making it about authority, use the "What If" test. Ask them:

  > "If the mayor announces this today, but next month a budget crisis forces her to cancel it, is our current story wrong?"

  *   If you wrote **"She said she will,"** the story is still accurate. She did say that.
  *   If you wrote **"She will,"** the story is now factually incorrect.

  The goal of the style rule isn't to be skeptical of the mayor; it's to protect the publication's accuracy record against the volatility of the future.

  ### 5. Recommendation
  You are right to enforce the attribution, but you should refine the explanation so it doesn't feel like arbitrary bureaucracy.

  **Don't say:** "Follow the rule because it's the rule."
  **Do say:** "We distinguish between **intent** and **enactment**. A press conference confirms intent. Until the legal mechanism is triggered (vote signed, order executed), we attribute the future tense to the speaker."

  **The Compromise:**
  Allow the reporter to use "will" in the *second* reference, provided the first reference establishes the attribution clearly.
  *   *Lead:* "Mayor X said she will raise the minimum wage..."
  *   *Paragraph 4:* "The increase, which she says will take effect in January..."

  This keeps the narrative flow (which the reporter wants) without sacrificing the epistemological safety (which you need).

  ### Summary
  This isn't post-hoc rationalization. It is a guardrail against turning **political promises** into **journalistic facts**. In a science-focused newsroom, maintaining the distinction between a claim and a realized outcome is a core value, not just a style preference. Stick to your guns, but explain the *why* using the "Hypothesis vs. Result" framework.
