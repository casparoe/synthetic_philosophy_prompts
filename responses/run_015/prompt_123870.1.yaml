answer: |-
  This is a sophisticated historiographical tool. "Teleological parallax" effectively isolates the *moral accounting* mechanism within Whig history, distinguishing it from simple determinism. It's not just that history moves toward the present; it's that the present adjudicates the *intentions* of the past based on utility to the current normative order.

  Here is the conceptual mapping of the 1919 Chicago Race Riots and the Commission Report through your framework, followed by the stress tests and framing flags you requested.

  ### 1. Conceptual Mapping: Actors and Agency Distortion

  **A. Black Migrants (The Great Migration)**
  *   **Standard Whig Narrative:** The migrants are the vanguard of the Civil Rights Movement. Their movement North is framed as a conscious political act toward integration and liberty. Their resistance during the riots (armed self-defense, refusing to flee) is coded as the genesis of the "New Negro" ideology that culminates in the 1950s/60s.
  *   **Teleological Parallax:** This view assigns them *political foresight* they largely did not possess. Most migrants were economic refugees escaping Jim Crow terror and sharecropping collapse, not ideological integrationists.
      *   *The Distortion:* Parallax grants them moral agency as "freedom fighters" because the *outcome* (demographic shift leading to political power) aligns with modern liberal values. It obscures that many sought *separate* security (Bronzeville as a haven) rather than integration. We credit them with a long-game strategy for civil rights that was, in 1919, primarily a strategy for physical and economic survival.
  *   **Parallax Correction:** Restores their agency as *survivalists* rather than *proto-activists*. It acknowledges that their "victory" was demographic endurance, not necessarily the realization of a specific political blueprint they held at the time.

  **B. White Working-Class Organizers & Rioters**
  *   **Standard Whig Narrative:** They are the antagonists of progress. Their violence is framed as irrational racial hatred obstructing the inevitable arc of integration. They are "backward," standing against the tide of history.
  *   **Teleological Parallax:** This view flattens their agency into pure ideology (racism), ignoring their *material rationality*.
      *   *The Distortion:* Because they "lost" (in the long term, segregation became legally untenable), their motivations are misfiled as purely reactionary. Parallax reveals that their defense of "turf" was a rational response to a zero-sum housing and labor market. They weren't trying to stop "Civil Rights"; they were trying to protect property values and union seniority systems in a context where the state provided no social safety net.
      *   *The Twist:* Sometimes Whig history tries to redeem "losers" if they fit a class narrative (e.g., "they were duped by capital"). Parallax warns against this too: assigning them false class consciousness is just another form of retroactive moral filing.
  *   **Parallax Correction:** Acknowledges their agency as *defensive territoriality*. It forces us to confront that their actions were logical within their structural constraints, even if morally abhorrent by ours. It removes the comfort of labeling them "irrational."

  **C. The Chicago Commission on Race Relations (The Report Authors)**
  *   **Standard Whig Narrative:** The Commission is a beacon of early liberal enlightenment. *The Negro in Chicago* is a precursor to the Kerner Commission and modern truth-and-reconciliation efforts. They are the "winners" because their methodology (sociological data over mob rule) won.
  *   **Teleological Parallax:** This view smooths over the Report's paternalism.
      *   *The Distortion:* Because the Report blamed white violence (which aligns with modern norms), we assign the authors a level of anti-racist commitment they didn't fully hold. We ignore their insistence on Black "uplift" and behavioral modification as a condition for safety.
      *   *The Twist:* Parallax highlights that the Commission's "progress" was contingent on *order*. They were as interested in stopping the riots as achieving justice. Their agency is retroactively inflated as "justice seekers," when they were often "stability managers."
  *   **Parallax Correction:** Frames the Commission not as prophets of integration, but as technocrats managing a crisis of capitalism. Their "progressive" findings are seen as a byproduct of needing to pacify the Black population to restore labor stability, not purely moral evolution.

  ### 2. Where the Framing Breaks

  **A. The Labor-Market Variable**
  Your framework relies on assigning moral agency based on outcomes. However, the 1919 violence was heavily driven by the Stockyards labor competition. This is a **structural determinist** element that resists moral filing.
  *   *The Break:* If violence is a result of scarcity (jobs/housing) rather than ideology, "Teleological Parallax" struggles. You cannot retroactively assign moral agency to a worker striking to protect a wage rate, even if that strike turns racial. The outcome (racial solidarity fractured) doesn't map to a moral narrative of "progress vs. reaction." It maps to economic contraction. Here, the theory risks over-moralizing what was essentially resource competition.

  **B. The Ambiguity of the Report**
  You noted the recommendations were ambiguous. The Parallax lens might actually *over-correct* here.
  *   *The Break:* The Report's ambiguity wasn't just a failure of vision; it was a political necessity. If we use Parallax to say "they weren't really progressive," we might miss that *ambiguity was the only viable agency available to them*. In 1922, a purely anti-racist report would have been shelved. The Report's "success" (it was published and read) depended on its ambivalence. Parallax risks judging them for lacking a courage that would have ensured their own irrelevance.

  **C. Contingency vs. Inevitability**
  Whig history requires a vector. The 1919 Riots did not inevitably lead to the Civil Rights Act. They led to decades of hardened segregation (restrictive covenants peaked *after* 1919).
  *   *The Break:* If the outcome of 1919 was actually *more* segregation in the short term, the Parallax mechanism jams. Who gets the "proto-progressive" label? If the "losers" (white rioters) successfully enforced segregation for another 40 years, does Whig history have to wait until 1968 to assign moral valence? This suggests the theory requires a settled historical endpoint to function, making it useless for analyzing ongoing structural violence.

  ### 3. The Flip: Is Whig History Unavoidable?

  **Does the theory fail on Urban Violence?**
  Yes, in its classical form. Whig history was built for **political revolutions** (Monarchy → Republic), where there is a clear change in regime and a definable "liberty."
  *   **Urban Racial Violence** is cyclical and administrative. It is about *management* of populations, not regime change. Applying a revolution-based teleology to urban riots forces a "breakthrough" narrative onto what is often a "containment" narrative.
  *   **However:** Whig history is unavoidable *sociologically*. The victims of the riots *needed* a Whig narrative to make sense of their suffering. The "New Negro" rhetoric *was* a Whig narrative adopted by Black leaders to convert trauma into political capital. So, while the *historian* should use Parallax to deconstruct the agency, the *actors* used Whig history as a survival tool. The theory breaks if it ignores that the subjects themselves were Whig historians of their own lives.

  **Does the case show Whig History is unavoidable?**
  It shows that **institutional history** demands Whig framing, while **social history** resists it.
  *   *Institutional:* The Commission Report fits Whig history because it created a lineage of bureaucratic responses (HUD, Civil Rights Commission).
  *   *Social:* The violence itself resists Whig history because it was chaotic, multilateral, and lacked a clear "forward" direction.
  *   *Conclusion:* The case suggests "Teleological Parallax" is most useful when analyzing the *institutional memory* of an event (how the Report is remembered), but less useful for the *event itself* (the violence), which is better served by contingency and structural analysis.

  ### 4. Framing Flags & Subtle Missteps

  **A. "White Union Workers" vs. "Ethnic Gangs"**
  You frame the antagonists as "white union workers." This is a common historiographical shorthand that risks a specific misstep.
  *   *The Correction:* In 1919 Chicago, the official union leadership (Stockyards Labor Council) was actually attempting *inter-racial* organizing and condemned the violence. The violence was largely driven by **ethnic athletic clubs and gangs** (Irish, Polish) operating in the neighborhoods, often *outside* union control.
  *   *Why it matters for your theory:* If you frame them as "union workers," you imply a class-based agency that was actually fractured. The "losers" weren't a monolithic labor block; they were neighborhood territorialists who often distrusted the union leadership as much as the Black migrants. Parallax needs to distinguish between *class agency* (which was trying to bridge the gap) and *communal agency* (which was enforcing the color line).

  **B. The Report's "Ambiguity"**
  You describe the Report's recommendations as "genuinely ambiguous."
  *   *The Correction:* They were ambiguous on *method*, but clear on *hierarchy*. The Report was explicitly assimilationist. It did not advocate for pluralism; it advocated for Black adherence to white middle-class norms to reduce friction.
  *   *Why it matters for your theory:* If you treat the ambiguity as "unsureness," Parallax might read it as "moral confusion." If you treat it as "paternalistic strategy," Parallax reveals it as "social control." The latter is a sharper application of your framework. The Commission wasn't wavering; they were engineering consent.

  **C. The "Red Summer" Context**
  You mention the "Red Summer" context. Be careful not to let the "Red" (Bolshevik anxiety) overshadow the "Summer" (racial violence).
  *   *The Correction:* While the First Red Scare influenced the Commission's fear of radicalism, the riots themselves were not ideologically driven by communism.
  *   *Why it matters for your theory:* If you over-index on the "Red" context, you risk assigning the actors a political agency (anti-communism) that was secondary to the racial/housing anxiety. Parallax should guard against conflating the *state's fear* (communism) with the *actors' motivation* (housing/jobs).

  ### Summary for your Dataset
  For your conceptual framing dataset, this case suggests **Teleological Parallax** is most potent when applied to **intermediary institutions** (like the Commission) rather than raw conflict. It excels at revealing how we sanitize the paternalism of early liberals to fit a progress narrative. However, it risks over-intellectualizing the motivations of violent actors who were driven by immediate scarcity rather than historical positioning. Use it to dissect the *memory* of the riots, not just the *mechanics* of them.
