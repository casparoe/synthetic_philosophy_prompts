answer: |-
  Prioritarianism is defined by a specific axiological structure: it ranks outcomes by the sum of transformed wellbeing levels across persons, $ \sum f(w_i) $, where $ f $ is strictly increasing and strictly concave. The concavity ensures that a unit of wellbeing matters more the lower the level at which it is received. The view's primary selling point is its immunity to the levelling-down objection (LDO). Because $ f $ is increasing, prioritarianism never ranks an outcome as better simply because the better off are made worse off without benefiting the worse off; it avoids the egalitarian absurdity of preferring a world where everyone is miserable but equal. However, this immunity is typically demonstrated in contexts of certainty. When identities are fixed and outcomes are known, prioritizing the worse off clearly distinguishes the view from egalitarianism. The question arises whether this escape is robust when we introduce uncertainty.

  Consider the case of Ada and Bella. They are initially equally well off. We face a choice between Option S (Safe), where both receive 60 for sure, and Option R (Risky), where a fair coin determines who receives 130 and who receives 10. Under R, the *ex post* distribution is (130, 10) regardless of the coin's result. The *ex ante* expected wellbeing for each person under R is 70, compared to 60 under S. Total wellbeing is 140 in every state of R, versus 120 in S. Despite R dominating S in terms of total and expected individual wellbeing, standard (ex post) prioritarianism may prefer S. Using the square root transformation suggested in the prompt, the value of S is $ 2 \times \sqrt{60} \approx 15.49 $. The value of R is $ \sqrt{130} + \sqrt{10} \approx 11.40 + 3.16 = 14.56 $. Because the concave function penalizes the low outcome of 10 heavily, the view prefers the option where everyone has lower expected wellbeing.

  This verdict forces a confrontation with the *Ex Ante Pareto* principle, which holds that if every person has a higher expected wellbeing in one option than another, the first option cannot be worse. Prioritarianism, as formally defined above, violates this principle. The question is whether this violation constitutes the levelling-down objection in a new guise. Strictly speaking, it is not LDO. In the classic LDO, the better off are harmed to achieve equality, benefiting no one. Here, no one is harmed to achieve equality; rather, a probabilistic gain for everyone is declined to avoid a potentially disastrous *ex post* distribution. However, the structural spirit of the objection migrates. The LDO charges egalitarianism with fetishizing a pattern (equality) over people's good. Here, prioritarianism is charged with fetishizing a pattern (the avoidance of a low absolute bottom) over people's *expected* good. If one accepts that a person's good is adequately represented by their expected wellbeing in choices under uncertainty, then prioritarianism is sacrificing the good of both Ada and Bella to satisfy a distributional constraint, even if that constraint is derived from priority rather than equality.

  To maintain the verdict that S is better than R, the prioritarian must reject *Ex Ante Pareto*. This rejection is defensible if one holds that moral value attaches to how lives actually go, not to the chances they are given. On this *Ex Post* view, the transformation $ f $ applies to realized wellbeing. The moral urgency of the person who actually ends up at 10 outweighs the probabilistic benefits conferred on both parties *ex ante*. The prioritarian can argue that "expected wellbeing" is not the currency of moral value; it is a decision-theoretic tool for individuals, not a moral metric for outcomes. If Ada ends up at 10, her suffering is real and urgent. The fact that she had a 50% chance of 130 does not mitigate the moral badness of her actual state. Therefore, the violation of *Ex Ante Pareto* is not a bug but a feature: it reflects the view that we should minimize actual priority-weighted suffering, even if that requires rejecting risky gambles with higher expected returns.

  The alternative is to modify the view to preserve *Ex Ante Pareto*. This yields *Ex Ante Prioritarianism*, where the concave transformation is applied to expected wellbeing rather than realized wellbeing: $ \sum f(E[w_i]) $. In the Ada/Bella case, since both have an expected wellbeing of 70 under R and 60 under S, and $ f $ is increasing, this view prefers R. This restores consistency with standard rational choice theory. However, this modification comes at a steep theoretical cost. Ex Ante Prioritarianism is indifferent between Option R and a scenario where both Ada and Bella receive 70 for sure. It cannot register the moral significance of the fact that in R, someone actually ends up at 10. The core intuition of prioritarianism is that benefits to the worse off matter more. If we smooth over risk by transforming expectations, we lose the grip on the *actual* worse off. The view becomes a form of risk-aversion regarding expectations, rather than priority for the disadvantaged in reality. It fails to capture the urgency of the plight of the person who loses the coin toss.

  Consequently, the objection does not destroy prioritarianism, but it clarifies its commitments. The escape from the levelling-down objection is genuine regarding *ex post* outcomes: prioritarianism never says a world is better because gaps are smaller if everyone is worse off. However, under uncertainty, the view must accept that it violates *Ex Ante Pareto*. This is not the LDO reappearing, because the justification is not equality, but the moral weight of actual outcomes. The LDO claims that equality has no intrinsic value. Prioritarianism agrees. But Prioritarianism also claims that the moral value of a benefit diminishes as the recipient's level rises. When risk is introduced, maintaining this claim requires prioritizing the avoidance of actual low levels over the maximization of probabilistic claims.

  Therefore, prioritarianism survives the case, but only as an *Ex Post* view that explicitly rejects *Ex Ante Pareto*. To attempt to save *Ex Ante Pareto* by transforming expectations is to abandon the central prioritarian insight that the moral urgency of a benefit depends on the recipient's actual state. The migration of the objection reveals that one cannot have a distribution-sensitive view that is also fully compliant with *ex ante* efficiency. We must choose between a morality that tracks actual human fortunes and one that tracks rational gambling. Prioritarianism rightly chooses the former. The cost is accepting that a policy can be morally superior even if it offers every individual a lower expected return, provided it secures them against falling into a state of urgent need. This is not a contradiction; it is the price of taking priority seriously.
