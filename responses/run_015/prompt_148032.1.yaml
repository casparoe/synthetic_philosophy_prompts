      *   **The Alternative: Ex Ante Prioritarianism (approx. 200 words):** If they keep *Ex Ante Pareto*, they transform expectations. $ \sum f(E[w_i]) $. This prefers R. But it treats R the same as a sure 70/70. It ignores the moral significance of the actual 10. This loses the "priority" intuition in the realm of risk.
      *   **Conclusion (approx. 150 words):** Final verdict. Prioritarianism survives only by accepting the violation of *Ex Ante Pareto*. The escape from LDO is partial; the cost is accepting that rational prudence (maximizing expectation) is not moral prudence. The objection migrates, but the view remains coherent if we prioritize actual outcomes over probabilistic claims.

