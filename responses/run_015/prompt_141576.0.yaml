answer: |-
  ### Part 1: The Logical Space

  Before you hand out the quiz, here is the map of the territory you are sorting them into. The tree rests on three branching questions.

  **Branch 1: The Locus of Defect**
  *   *Question:* When an assertion goes wrong, is it primarily because the **world isn't that way** (Factual) or because the **speaker wasn't in a good enough position** (Epistemic/Conversational)?
  *   *Split:* This separates the **Truth Norm** (Factual) from everything else (Epistemic/Conversational).
  *   *Empty Cell:* A "Hearer-Sensitive Truth Norm" is incoherent. Truth does not shift based on who is listening; if *p* is false, it is false for the child and the specialist alike.

  **Branch 2: The Strength of Position**
  *   *Question:* If the defect is about the speaker's position, how strong must that position be? Must they **know** (Factive), merely have **good reasons/warrant** (Non-factive), or simply **believe** (Non-factive/Sincere)?
  *   *Split:* This separates **Knowledge**, **Warrant/Reasonableness**, **Answerability**, and **Belief** norms.
  *   *Empty Cell:* A "Truth + Belief" norm is incoherent. If the norm is Truth, the speaker's belief is irrelevant to the defect.
  *   *Unattractive Cell:* A "Hearer-Sensitive Belief Norm." It is unclear why my obligation to believe what I say would shift depending on your identity, whereas my obligation to *know* it might shift (e.g., if you rely on me more).

  **Branch 3: The Audience Relativity**
  *   *Question:* Is the required position fixed by the speaker's context alone, or does it shift depending on **who is listening** and what they need?
  *   *Split:* This separates the **Fixed Norms** (Standard Knowledge/Truth/Belief) from the **Hearer-Sensitive Norm**.
  *   *Empty Cell:* See Branch 1 (Truth + Sensitive).
  *   *Merely Unoccupied:* A "Hearer-Sensitive Warrant Norm" is rarely defended explicitly, though it lurks in pragmatic accounts. Most who argue for sensitivity argue for Knowledge-Sensitivity.

  **The Seven Leaves**
  1.  **Truth Norm:** Defect = Falsity.
  2.  **Knowledge Norm:** Defect = Lack of Knowledge (Fixed).
  3.  **Belief Norm:** Defect = Insincerity/Lack of Belief.
  4.  **Warrant Norm:** Defect = Lack of Reasonable Grounds.
  5.  **Answerability Norm:** Defect = Inability to Defend if Challenged.
  6.  **Hearer-Sensitive Norm:** Defect = Mismatch between Speaker's Position and Hearer's Needs.
  7.  **Pluralist Norm:** The norm changes depending on the conversational game being played.

  **Indistinguishable Leaves**
  This instrument cannot reliably separate **The Knowledge Norm** from **The Warrant Norm**. In concrete cases, "knowing" and "having warrant sufficient for assertion" almost always travel together unless you introduce Gettier cases, which are too fragile for a ten-minute pub quiz.

  ***

  ### Part 2: The Instrument

  **Instructions:** Read each case. Circle the option that matches your immediate reaction. Don't overthink it. There are no right answers.

  **1. The Lottery Ticket**
  Before the draw, purely on the base rates (1 in a million chance to win), you tell a friend: "Your ticket lost." It turns out you were right; they did lose.
  *   A. You did nothing wrong. You said what was true.
  *   B. You did something improper. You couldn't *know* that yet.
  *   C. You did something improper. You couldn't *back that up* if they asked.

  **2. The Chatbot**
  A text support bot outputs: "Your refund was issued on the 3rd." This is true and came from a reliable process, but the bot has no mind, beliefs, or knowledge.
  *   A. It's not an assertion at all. Only believers can assert.
  *   B. It's a defective assertion. It lacks a mind.
  *   C. It's a perfectly fine assertion. The source process is what matters.

  **3. The Doctor and the Child**
  A doctor knows a procedure will hurt. She tells the frightened child, "This won't hurt much," to calm them down. She tells the specialist parent the exact same sentence later.
  *   A. Both assertions are equally proper. She knows it in both cases.
  *   B. Both are improper. She knows it will hurt.
  *   C. One is proper and one is improper. The obligation changes depending on who is listening.

  **4. The Time-Shift**
  You say, "The train leaves at nine." You know this when you speak. Between your utterance and my hearing it, the schedule changes to ten.
  *   A. Your assertion was fine when you made it. The world changed later.
  *   B. Your assertion is defective now. You conveyed false information.
  *   C. Your assertion is defective. You should have known the schedule might change.

  **5. The Hesitant Speaker**
  Someone says: "I think it's going to rain, but I have no idea why."
  *   A. This isn't an assertion. It's a guess.
  *   B. It's an assertion, but a bad one. They lack grounds.
  *   C. It's a fine assertion. They are being honest about their belief.

  **6. The Lucky Guess**
  You have no evidence for *p*, but you guess *p* anyway. *p* turns out to be true.
  *   A. You were right to say it. Truth is all that matters.
  *   B. You were wrong to say it. You were just lucky.
  *   C. You were wrong to say it. You couldn't answer a challenge.

  **7. The Challenge**
  You assert *p*, which you know. I challenge you: "How do you know?" You realize you cannot explain your evidence right now, though you still know it.
  *   A. You did nothing wrong. You knew it when you spoke.
  *   B. You did something wrong. Assertion requires the ability to defend.
  *   C. You did nothing wrong, unless I am someone who needs that proof.

  **8. The Hospital Committee**
  A committee votes 3–2 to issue: "The outbreak is under control." The majority believed it because they wanted to; the minority knew it wasn't true.
  *   A. The assertion is defective. The content is false.
  *   B. The assertion is defective. The speakers didn't know/believe it.
  *   C. The assertion is valid. The vote procedure licenses the assertion, regardless of individual states.

  **9. The Bad Translation**
  You know the train leaves at nine. You try to tell me in a language you speak badly. The sentence you produce actually means "It leaves at six."
  *   A. You asserted it leaves at six. You were wrong.
  *   B. You asserted it leaves at nine. You were right, just unclear.
  *   C. You didn't assert anything. You failed to communicate.

  ***

  ### Part 3: The Scoring Key

  **Step 1: Tally your answers.**
  Count how many A's, B's, and C's you selected.

  **Step 2: Find your Dominant Letter.**
  *   **Mostly A's:** You lean toward **Objective/Fixed** norms.
  *   **Mostly B's:** You lean toward **Epistemic/State** norms.
  *   **Mostly C's:** You lean toward **Social/Contextual** norms.
  *   **Mixed/No Majority:** You are likely a **Pluralist**.

  **Step 3: Refine by Question Clusters.**
  *Look at your answers in these specific groups to find your Leaf.*

  **Group 1 (Questions 1, 4, 6): The Truth/Knowledge Split**
  *   Mostly A's here → **The Truth Norm.** (You care about the world being as you say).
  *   Mostly B's here → **The Knowledge Norm.** (You care about the speaker's position).
  *   Mostly C's here → **The Answerability Norm.** (You care about the social defense).

  **Group 2 (Questions 2, 5, 9): The Belief/Intent Split**
  *   Mostly A's here → **The Belief Norm.** (You think assertion requires a mind/belief).
  *   Mostly B's here → **The Warrant Norm.** (You think assertion requires grounds).
  *   Mostly C's here → **The Expressive Norm.** (You think assertion is just expressing a state).

  **Group 3 (Questions 3, 7, 8): The Audience Split**
  *   Mostly A's here → **Fixed Norm.** (The rule is the same for everyone).
  *   Mostly B's here → **Fixed Norm.** (The rule is the same, but strict).
  *   Mostly C's here → **The Hearer-Sensitive Norm.** (The rule shifts with the listener).

  **Mapping to Leaves (Best-Fit Rules)**

  1.  **Truth Norm:** Group 1 = A, Group 3 = A.
  2.  **Knowledge Norm:** Group 1 = B, Group 3 = A.
  3.  **Belief Norm:** Group 2 = A, Group 1 = B.
  4.  **Warrant Norm:** Group 1 = B, Group 2 = B.
  5.  **Answerability Norm:** Group 1 = C, Group 3 = A.
  6.  **Hearer-Sensitive Norm:** Group 3 = C (Overrides Group 1 & 2).
  7.  **Pluralist:** No clear majority in any group, or high variance (e.g., A, B, C, A, B, C...).

  *Note on Best-Fit:* If a participant scores high on Hearer-Sensitivity (Group 3 = C) but also high on Truth (Group 1 = A), map them to **Hearer-Sensitive Norm**. Truth norms cannot be hearer-sensitive; this indicates they hold a contextual view of truth conditions, which collapses into the Hearer-Sensitive leaf for the purpose of this game.

  ***

  ### Part 4: Misfire Note

  **Where this instrument fails:**
  It genuinely fails to pull apart **The Knowledge Norm** and **The Warrant Norm**. In Questions 1, 4, and 6, "lacking knowledge" and "lacking warrant" yield the same intuitive verdict for most people outside of technical Gettier scenarios. If someone scores as a Knowledge Normativist, they are likely a Warrant Normativist in disguise.

  **The question doing too much work:**
  **Question 1 (The Lottery Ticket).** This case carries the entire weight of distinguishing Truth from Knowledge. If a participant thinks lottery assertions are fine because they are *likely* true (Reasonableness) rather than *known* (Knowledge), the scoring key might misfile them as a Truth Normativist.

  **The case that would rewrite the key:**
  A **High-Stakes Gettier Case**. If you introduced a case where someone has a justified true belief that is clearly *not* knowledge (e.g., a broken clock that happens to be right), and participants split on whether the assertion was proper, I would have to split the Knowledge and Warrant leaves. Currently, the key assumes they move together.

  **When the framing is wrong:**
  If the **Lawyer** or **GP** at the table argues that the "norm" is just a matter of **liability or professional etiquette** (e.g., "It's only wrong if you get sued" or "It's only wrong if it breaches HIPAA"), the whole philosophical framing collapses. This suggests assertion isn't a constitutive game with one norm, but a social tool regulated by external consequences. Similarly, if everyone agrees with the **Hearer-Sensitive** options but explains it as "politeness" rather than "normative shift," the distinction between *norm of assertion* and *norm of conversation* has blurred.

  **Least confident mapping:**
  **Question 2 (The Chatbot).** I am least confident mapping this to the **Belief Norm**. Some Truth Normativists might answer "C" (It's fine, it's true) not because they reject the Belief Norm, but because they think the bot is merely a tool for a human asserting. If the programmers argue the bot *is* the agent, the case breaks. If they argue the bot is a conduit, the case becomes about human assertion, not bot assertion. This ambiguity makes the Belief Norm leaf the shakiest part of the sort.
