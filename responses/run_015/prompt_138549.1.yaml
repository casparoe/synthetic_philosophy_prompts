prompt: |-
  You are a decision theorist and philosopher of action who has published on rational choice under cognitive and temporal constraints. Think carefully before answering: open with a short brainstorming pass in which you list candidate requirements and then strike the ones that are really only preferences of one research program, and only afterwards give me the polished list.

  I want a specification, not a survey. I am drafting a paper whose claim is that bounded rationality is still a slogan rather than a theory, and before I propose anything I need the standard any successor would have to meet. So: write the desiderata that a normative theory of choice for a bounded agent must satisfy, where the purpose is fixed as first-personal — the theory is to be good enough to tell the agent herself what to do, in deliberation, and not merely to grade her from the outside after the fact.

  Give the case or consideration behind each requirement. Among those I expect you to address: the substantive/procedural distinction, and whether the theory may collapse it; the regress that arises because deciding how long to think is itself a decision made under the same constraints, so that any rule of the form keep computing until marginal cost equals marginal expected gain must explain how the agent estimates the value of further computing without having already done it; the currency problem, i.e., in what unit computational cost is denominated and whose budget it is charged to; assessability without knowing the answer, so that a procedure that luckily succeeds in one environment is not thereby vindicated; the permissibility of rationally adopting rules or commitments that make the agent worse at local optimisation; and budget plasticity, the fact that attention, memory, and skill are things the agent can invest in, so the constraints cannot be treated as a fixed exogenous parameter.

  I also want you to add a requirement I have been toying with and tell me whether it is genuine or spurious: call it grain-invariance, the demand that the theory's verdict about a choice not flip when the very same problem is redrawn with options or deliberation steps individuated more finely, since the cost of computing scales with how finely the problem is described.

  Then: flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement does the most work in excluding otherwise plausible candidates. Keep any scoring of the familiar families of views — expected utility with a computation-cost term, Simonian satisficing, fast-and-frugal or resource-rational approaches — to a few lines; the list is the deliverable. And tell me whether satisficing is a candidate theory at all, or only a description of what any adequate theory will have to predict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Decision theorist and philosopher of action (specializing in rational choice under constraints).
      *   **Task:** Provide a specification (desiderata list) for a normative theory of choice for a bounded agent (first-personal deliberation guide).
      *   **Format:**
          1.  Short brainstorming pass (list candidates, strike program-specific preferences).
          2.  Polished list of desiderata with cases/considerations for each.
          3.  Address specific topics: substantive/procedural distinction, regress of meta-decision, currency problem, assessability without knowing the answer, permissibility of commitments/rules, budget plasticity.
          4.  Evaluate a specific proposed requirement: "Grain-invariance."
          5.  Flag tensions/incompatibilities between requirements.
          6.  Identify the "workhorse" requirement.
          7.  Briefly score familiar views (EU+cost, Satisficing, Fast-and-Frugal, Resource-Rational).
          8.  Address whether Satisficing is a theory or a prediction.
      *   **Tone:** Rigorous, philosophical, analytical, precise.

  2.  **Brainstorming Pass (Mental Draft & Filtering):**
      *   *Idea 1: Maximize Utility.* -> Strike. Unbounded. Impossible for bounded agents.
      *   *Idea 2: Minimize Computation.* -> Strike. Trivial solution is to do nothing.
      *   *Idea 3: Maximize Utility minus Computation Cost.* -> Keep as a candidate, but note the regress problem.
      *   *Idea 4: Follow Heuristics.* -> Strike as a *norm*. Heuristics are tools, not the norm itself. Why follow *this* heuristic?
      *   *Idea 5: Be Consistent.* -> Keep. Diachronic consistency matters.
      *   *Idea 6: Action-Guiding.* -> Keep. Must be usable by the agent *now*.
      *   *Idea 7: Environment-Sensitive.* -> Keep. Ecological rationality.
      *   *Idea 8: Grain-Invariance.* -> Evaluate later.
      *   *Idea 9: Self-Reflective.* -> Keep. Must handle the cost of deliberation itself.
      *   *Idea 10: Non-Circular.* -> Keep. Can't presuppose the answer to calculate the cost of finding the answer.

      *Filtering Program-Specific Preferences:*
      *   "Maximize Expected Utility" is a substantive goal of Classical Decision Theory (CDT), not a neutral constraint for bounded theory. Strike as a *requirement*, keep "optimality relative to constraints."
      *   "Ecological Rationality" (Gigerenzer style) is a research program. The requirement should be "Sensitivity to Environment," not "Use Fast-and-Frugal Heuristics."
      *   "Resource-Rationality" (Lieder & Griffiths) is a framework. The requirement is "Account for Computational Cost," not "Fit the Resource-Rational Model."

  3.  **Developing the Desiderata (The Polished List):**
      *   *Requirement 1: Action-Guidance (Deliberative Accessibility).* The theory must tell the agent what to do *during* deliberation, not just evaluate the outcome.
      *   *Requirement 2: Non-Regress (Meta-Decidability).* The rule for stopping deliberation cannot require the very calculation it is meant to truncate.
      *   *Requirement 3: Currency Neutrality/Integration.* Computational cost must be denominated in a currency commensurable with choice value, but not presuppose a specific utility metric that creates circularity.
      *   *Requirement 4: Ex-Ante Assessability.* We must be able to judge the rationality of the procedure without knowing the outcome (luck vs. skill).
      *   *Requirement 5: Plasticity Accommodation.* Constraints (memory, attention) are endogenous variables, not fixed parameters.
      *   *Requirement 6: Commitment Permissibility.* The theory must allow for pre-commitment that restricts local optimization if it benefits the global trajectory.
      *   *Requirement 7: Grain-Invariance.* (To be evaluated).

  4.  **Addressing Specific Topics within the Desiderata:**
      *   *Substantive/Procedural:* The theory shouldn't just say "get the best result" (substantive) or "follow a rule" (procedural). It needs to bridge them. The norm is procedural *aiming* at substantive goods under constraint.
      *   *Regress:* This is the core of Requirement 2.
      *   *Currency:* Requirement 3.
      *   *Assessability:* Requirement 4.
      *   *Commitments:* Requirement 6.
      *   *Plasticity:* Requirement 5.

  5.  **Evaluating "Grain-Invariance":**
      *   *Concept:* If I describe the option "Eat Apple" as one option or as "Eat Apple + Skin" vs "Eat Apple - Skin," the rational choice shouldn't flip just because the description changed the computation cost.
      *   *Verdict:* It is genuine. If a theory says "Compute until cost > benefit," and cost depends on description granularity, the verdict flips arbitrarily. A robust theory needs to be invariant to arbitrary redescriptions of the state space.
      *   *Nuance:* It's hard to satisfy. Most computational models depend on representation.

  6.  **Identifying Tensions:**
      *   *Tension:* Action-Guidance vs. Non-Regress. To guide action, you need a rule. To avoid regress, the rule can't require calculation. But how do you know the rule is good without calculation?
      *   *Tension:* Grain-Invariance vs. Computational Cost. Cost *is* a function of grain. If cost scales with grain, and optimality depends on cost, optimality scales with grain.
      *   *Workhorse Requirement:* **Non-Regress (Meta-Decidability).** This kills the standard "optimize net benefit" models because they require knowing the marginal gain of thinking *before* thinking.

  7.  **Scoring Familiar Views:**
      *   *EU + Cost:* Fails Non-Regress.
      *   *Simonian Satisficing:* Good on Non-Regress, weak on Currency/Assessability (what is the aspiration level?).
      *   *Fast-and-Frugal:* Good on Action-Guidance, weak on Currency (why *this* heuristic?).
      *   *Resource-Rational:* Good on Plasticity, often fails Action-Guidance (too complex for the agent to run).

  8.  **Satisficing: Theory or Prediction?**
      *   It's often a description. As a norm, it needs a rule for setting the aspiration level. Without that, it's incomplete. So, mostly a prediction/phenomenon, unless supplemented by a theory of aspiration adjustment.

  9.  **Drafting the Response (incorporating the persona):**
      *   *Voice:* Academic, precise, slightly critical, authoritative but open.
      *   *Structure:* Follow the prompt's instructions exactly (Brainstorm -> Strike -> Polished List -> Grain-Invariance -> Tensions -> Scoring -> Satisficing status).

      *(Self-Correction during drafting)*: Make sure I don't just list the requirements but explain the *case* for each as requested. Ensure the distinction between "first-personal" and "third-personal" is highlighted in the Action-Guidance requirement. Ensure the "Currency" problem addresses whose budget is being charged (the agent's cognitive budget vs. the outcome's utility).

      *Refining Grain-Invariance:* Is it spurious? If the world *is* granular, maybe the theory *should* flip? No, the prompt says "redrawn with options... individuated more finely." This implies arbitrary redescriptions of the *same* underlying choice problem. So yes, it's a genuine requirement for stability.

      *Refining the Tension:* The biggest tension is between *Action-Guidance* (needs to be simple enough to use) and *Plasticity/Optimality* (needs to account for complex trade-offs). But the prompt asks for the requirement that does the most work in *excluding* candidates. That is definitely the Non-Regress requirement. It kills standard consequentialism about deliberation.

      *Refining Satisficing:* Simon proposed it as a theory. But without a normative account of aspiration levels, it's descriptive. I need to be clear on this.

  10. **Final Review against Constraints:**
      *   Open with brainstorming? Yes.
      *   Strike program-specific preferences? Yes.
      *   Polished list with cases? Yes.
      *   Address specific topics (substantive/procedural, regress, currency, assessability, commitments, plasticity)? Yes.
      *   Evaluate Grain-Invariance? Yes.
      *   Flag tensions? Yes.
      *   Identify workhorse requirement? Yes.
      *   Score familiar views (briefly)? Yes.
      *   Satisficing status? Yes.

      *Let's write.*
answer: |-
  ### Phase 1: Brainstorming and Filtering

  **Candidate Requirements:**
  1.  **Maximize Expected Utility:** The agent should choose the option with the highest expected value.
  2.  **Minimize Computational Effort:** The agent should think as little as possible.
  3.  **Maximize Net Benefit (Utility minus Cost):** The agent should optimize the trade-off between decision quality and thinking time.
  4.  **Action-Guidance:** The theory must be usable by the agent *during* deliberation.
  5.  **Non-Circularity:** The rule for stopping deliberation cannot require the result of the deliberation it truncates.
  6.  **Ecological Validity:** The theory must account for the structure of the environment.
  7.  **Diachronic Consistency:** The agent's plans today should not conflict with her actions tomorrow without reason.
  8.  **Representation Stability:** Verdicts shouldn't change based on how the problem is described.
  9.  **Endogenous Constraints:** The theory must allow the agent to improve her own cognitive tools.

  **Striking Program-Specific Preferences:**
  *   *Strike "Maximize Expected Utility":* This is the goal of unbounded rationality. A bounded theory cannot require the impossible. It is a substantive goal of Classical Decision Theory (CDT), not a neutral constraint for a successor.
  *   *Strike "Minimize Computational Effort":* Trivial solution is to act randomly without thinking. This is a preference of radical heuristicism, not a normative requirement.
  *   *Strike "Maximize Net Benefit":* While intuitive, this is the specific formulation of the "Resource-Rationality" program. The requirement should be the *problem* this tries to solve (handling cost), not the specific *solution* (subtraction of cost terms).
  *   *Strike "Ecological Validity":* This is a slogan of the Fast-and-Frugal program. The requirement is broader: the theory must be *sensitive* to environmental structure, not necessarily that it must prioritize ecological fit over logical consistency.

  ***

  ### Phase 2: Desiderata for a Normative Theory of Bounded Choice

  Here is the specification. These are necessary conditions any theory claiming to guide a bounded agent in deliberation must satisfy.

  **1. Deliberative Accessibility (The Action-Guidance Constraint)**
  *   **Specification:** The theory must provide a procedure the agent can execute *ex ante*, using only information available to her at the time of choice. It cannot rely on variables (e.g., the true state of the world, the optimal solution) that are only known *ex post*.
  *   **Case:** A theory that grades an agent based on whether she found the global maximum is a grading rubric, not a deliberation guide. If the agent cannot compute the standard, the standard cannot tell her what to do. This addresses the **substantive/procedural distinction**: the theory cannot simply demand substantive optimality; it must specify a procedure that is rationally mandatory *given* the agent's inability to guarantee substantive optimality.

  **2. Meta-Decidability (The Non-Regress Constraint)**
  *   **Specification:** The rule for terminating deliberation must not require a calculation as complex as the decision problem itself. Specifically, a rule like "deliberate until the marginal cost of thinking exceeds the marginal expected gain" is inadmissible unless the agent can estimate that gain without performing the very thinking she is evaluating.
  *   **Case:** This addresses the **regress problem**. If deciding whether to think requires thinking, we face an infinite regress or a circularity. A normative theory must provide a stopping rule that is computationally cheaper than the continuation it forbids. This is the primary filter against standard economic models of information search.

  **3. Commensurability without Circularity (The Currency Constraint)**
  *   **Specification:** The theory must specify a common unit in which cognitive costs (time, attention, memory) and choice outcomes (utility, value) are compared, without presupposing that the agent has already solved the choice problem to value the time spent solving it.
  *   **Case:** This addresses the **currency problem**. If computational cost is denominated in "utils," but utils are only assigned upon choice, we cannot calculate the cost of choosing. If cost is denominated in "seconds," we need a conversion rate to outcome value. The theory must explain whose budget is charged: is it the agent's limited working memory (psychological budget) or the outcome's value (economic budget)? It cannot assume a fixed exchange rate known only to an observer.

  **4. Procedure-Relative Assessability (The Luck Constraint)**
  *   **Specification:** The rationality of a choice must be assessable based on the procedure employed, not the outcome achieved. A procedure that yields a high payoff in a specific instance due to luck must not be vindicated if the procedure itself was unreliable given the constraints.
  *   **Case:** This addresses **assessability without knowing the answer**. In a bounded context, the "right answer" is often unknowable to the agent. If a theory vindicates a lucky guess, it fails to guide future action. The norm must attach to the *process* of resource allocation, not the *product* of that process.

  **5. Endogenous Constraint Accommodation (The Plasticity Constraint)**
  *   **Specification:** The theory must treat cognitive constraints (attention, memory, skill) as variables the agent can invest in, not fixed exogenous parameters. It must allow for the rationality of slowing down now to speed up later (skill acquisition) or restricting options to save attention (commitment).
  *   **Case:** This addresses **budget plasticity**. Standard bounded models treat constraints as walls. But agents can build ladders. A theory that treats memory limits as fixed fails to capture the rationality of note-taking, habit formation, or education. It must explain when it is rational to optimize the *optimizer*.

  **6. Strategic Restriction Permissibility (The Commitment Constraint)**
  *   **Specification:** The theory must permit the agent to adopt rules or commitments that reduce her local optimization capacity if doing so prevents predictable exploitation or reduces total cognitive load over time.
  *   **Case:** This addresses the **permissibility of rationally adopting rules**. Sometimes the rational move is to make oneself less flexible (e.g., Ulysses binding, moral rules). A theory that demands local optimization at every node forbids this. The theory must distinguish between *capacity* limits and *strategic* self-binding.

  ***

  ### Phase 3: Evaluation of "Grain-Invariance"

  **Requirement:** *Grain-Invariance.* The theory's verdict about a choice must not flip when the same problem is redrawn with options or deliberation steps individuated more finely.

  **Verdict:** **Genuine.**

  **Case:** This is not merely a preference for elegance; it is a stability condition required for **Meta-Decidability**. In computational models, the cost of thinking scales with the granularity of the representation (e.g., searching a tree with 2 branches vs. 10 sub-branches). If a theory says "Compute until Cost > Benefit," and Cost is a function of description grain, then an agent could manipulate the rationality of a decision merely by redescribing the options (e.g., framing "Eat Apple" as one option vs. "Eat Skin" + "Eat Flesh" as two). A normative theory must be invariant to arbitrary redescriptions of the state space, or else it allows the agent to "gerrymander" rationality by changing her vocabulary. Most current resource-rational models fail this because they tie cost directly to bit-complexity of the representation.

  ***

  ### Phase 4: Tensions and Workhorse Requirements

  **Incompatibility Flag:**
  There is a severe tension between **Deliberative Accessibility** and **Endogenous Constraint Accommodation**.
  *   *Why:* To guide action *now* (Accessibility), the rule must be simple and immediate. To account for plasticity (Endogenous Constraints), the agent must evaluate the long-term return on cognitive investment (e.g., "Should I learn math to solve this?"). Evaluating long-term returns on cognitive investment is itself a complex calculation that may violate Accessibility. A theory simple enough to use *in the moment* is likely too simple to model the *investment in future capacity*.

  **The Workhorse Requirement:**
  **Meta-Decidability (The Non-Regress Constraint).**
  *   *Why:* This requirement does the most work in excluding otherwise plausible candidates. It eliminates standard Expected Utility Theory with a computation-cost term (because calculating the marginal value of information requires the very computation being costed). It eliminates pure Consequentialism about deliberation. It forces the theory away from "optimization" and toward "stopping rules" or "triggers" that do not require forward-looking valuation of thought itself.

  ***

  ### Phase 5: Scoring Familiar Views

  *   **Expected Utility + Computation Cost:** Fails **Meta-Decidability**. It requires the agent to know the value of further computation before computing it. It is a third-person model, not a first-person guide.
  *   **Simonian Satisficing:** Strong on **Meta-Decidability** (stop when "good enough" is found). Weak on **Currency** and **Assessability**. It lacks a normative account of how the aspiration level is set. If the aspiration level is too low, the agent is irrational; if too high, she is paralyzed. The theory doesn't specify the rational level.
  *   **Fast-and-Frugal Heuristics:** Strong on **Deliberative Accessibility** and **Assessability** (ecological rationality). Weak on **Currency** and **Grain-Invariance**. It struggles to explain *which* heuristic to pick when multiple are ecologically valid, often deferring to an unmodeled "adaptive toolbox."
  *   **Resource-Rational Approaches:** Strong on **Plasticity** and **Currency** (formalizes the trade-off). Weak on **Deliberative Accessibility**. These models are often computationally intractable for the agent they describe; they explain behavior from the outside but cannot be run by the agent from the inside.

  ***

  ### Phase 6: The Status of Satisficing

  **Is Satisficing a Candidate Theory?**
  **No.** In its standard formulation, satisficing is a **description of what an adequate theory will have to predict**, not a theory itself.

  **Reasoning:** "Stop when you find an option that meets the aspiration level" is a mechanism, not a norm. It lacks a criterion for the rationality of the aspiration level itself. Without a supplementary account of how the aspiration level is adjusted (e.g., trial-and-error learning, normative anchoring), satisficing is incomplete. It solves the regress problem (you don't need to compare all options) but creates a new black box (where does the threshold come from?). A complete normative theory must subsume satisficing as a *strategy* justified by deeper constraints, not as the foundational norm.
