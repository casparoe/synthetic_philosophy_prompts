  2.  **Deconstruct the 6 Propositions:**
      *   (1) *Sphex* rigidity (fixed loop, no evaluation) = No free will.
      *   (2) Flexibility $\neq$ Free Will. "Recursive *sphex* loop" (adapting means, not ends) is still not free.
      *   (3) Real Freedom = Capacity to break the loop at the level of *ends* (goal revision).
      *   (4) Empirical Claim: Humans mostly live in recursive *sphex* loops (habits, scripts).
