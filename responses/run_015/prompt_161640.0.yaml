      *   *Middle 1 (The Lobster Line):* This distinction is defensible not on binary grounds but on a gradient of confidence. The neuroanatomy of lobsters shares more functional similarities with vertebrates than insect ganglia do, allowing regulators to claim a higher credence in their capacity for pain. However, you are right to sense an inconsistency if the justification is purely about the possibility of suffering. If the law accepts a precautionary principle for lobsters based on incomplete evidence, excluding insects suggests either a belief that insect nervous systems are fundamentally different in kind rather than degree, or a tacit acceptance that moral status is partly constituted by social relationship and charisma. The whale rescue versus insect grind contrast highlights that our welfare agenda is not driven solely by the minimization of suffering units but by an emotional resonance that prioritizes individuals we can recognize as subjects over those we perceive as biomass.

