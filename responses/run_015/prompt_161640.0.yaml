answer: |-
  Your friend's argument relies on a straightforward expected utility calculation that is logically robust but psychologically and institutionally alien to how we currently assign moral status. The current practice does not strictly require the claim that insects are non-sentient, though it is much easier to justify if one assumes they are not. Instead, the industry and legal frameworks operate on a threshold model of moral consideration where phylogenetic proximity and neurological complexity act as proxies for sentience. By drawing the line at decapods and cephalopods, the law is not making a metaphysical claim that insects definitely feel nothing, but rather a pragmatic decision that the evidence for suffering in crustaceans and molluscs is sufficient to warrant precaution while the evidence for insects remains too ambiguous to disrupt economic systems built on their mass exploitation.

  This distinction is defensible not on binary grounds but on a gradient of confidence. The neuroanatomy of lobsters shares more functional similarities with vertebrates than insect ganglia do, allowing regulators to claim a higher credence in their capacity for pain. However, you are right to sense an inconsistency if the justification is purely about the possibility of suffering. If the law accepts a precautionary principle for lobsters based on incomplete evidence, excluding insects suggests either a belief that insect nervous systems are fundamentally different in kind rather than degree, or a tacit acceptance that moral status is partly constituted by social relationship and charisma. The whale rescue versus insect grind contrast highlights that our welfare agenda is not driven solely by the minimization of suffering units but by an emotional resonance that prioritizes individuals we can recognize as subjects over those we perceive as biomass.

  If you were to take the expected-value argument seriously and encode it into law, you would not simply set a threshold where population times credence equals regulation, because as you noted, that collapses into a Pascal's mugging where any tiny probability multiplied by a large enough number forces action. Instead, a serious regulatory framework would likely adopt a bounded precautionary principle. It would mandate humane killing methods only where the cost of implementation does not threaten the viability of the food system itself, or it would require research funding proportional to the scale of farming rather than immediate welfare mandates. The rule would literally say something like where industrial scale exceeds a certain magnitude, the burden of proof shifts to the producer to demonstrate lack of sentience rather than the regulator proving its presence. This avoids the infinite demand of the expected value calculation by capping the obligation at the point of economic feasibility.

  Ultimately, the situation is underdetermined. Several different theories license the same nothing. A contractualist view says insects cannot participate in moral agreements so they have no rights. A capacity view says they lack the cognitive integration for suffering. A utilitarian view might agree with your friend but is ignored due to cognitive bias. The practice fits well with all of these because it relies on moral inertia. The industry assumes insects are things rather than beings, a categorization that holds regardless of whether they feel pain, provided the law does not force a reclassification. Your friend's argument exposes the fragility of this categorization when subjected to arithmetic, but until the legal system is willing to treat moral status as a continuous variable rather than a binary switch, the industry will continue to presuppose that sentience is irrelevant below the decapod line, not because it is impossible, but because acknowledging it would require a restructuring of agriculture too profound to contemplate.
