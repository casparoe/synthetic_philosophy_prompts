  5.  **Synthesize and Structure the Response:**
      *   **Tone:** Rigorous, direct, intellectual peer-to-peer. No flattery.
      *   **Structure:** Follow the user's three requested parts.
      *   **Drafting - Section 1 (Taxonomy):** Argue they collapse. The "Hand" is governed by the "Rule." The social hierarchy dictates what is "worth writing." The ledger is the materialization of the social rule. Distinguishing them creates a false sense of granularity.
