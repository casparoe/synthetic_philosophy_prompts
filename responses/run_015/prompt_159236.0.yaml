answer: |-
  The air in the lab smelled of ozone and wet fur. Outside the thick polymer glass, the violet grass of Thalos II waved in a wind that didn't exist on Earth. Inside, Elias rubbed his temples. He was the team's medic, but out here, "medicine" meant deciding whether a local lifeform was sick or just different.

  "Look at the membrane," Dr. Aris said, pointing at the hologram hovering over the table. It was a grazer, six-legged and low-slung. A translucent flap rippled along its spine. "In the southern herds, the males flare this to attract mates. Classic sexual selection."

  "But in the north?" Elias asked. He was cleaning a scalpel, the metal clicking against the tray.

  "In the north, the mating display vanished generations ago," Aris said. "But the spore-clouds started. Now the flap deflects the parasites. It saves their lives. So, is the flap's function mating or defense?"

  Kip, the tech specialist monitoring the fabricator in the corner, didn't look up from his console. "Does it matter? It keeps the animal alive."

  "It matters if I have to cut it out," Elias said. "If the function is mating, and I'm treating a northern grazer that doesn't mate, the flap is vestigial. Clutter. If it gets infected, I remove it. If the function is defense, removing it kills the host. I need to know what the part is *for*."

  "But what determines the 'for'?" Aris pressed. "Is it the history? The fact that ancestors used it for sex? Or is it what it's doing right now, keeping the spores off?"

  "History makes it real," Aris insisted. "Without the lineage, it's just a thing happening. With the lineage, it's a purpose."

  "Then the north herd is broken," Elias said. "They lost the original purpose. They're running on side effects."

  "Or they evolved a new one," Kip muttered.

  The fabricator hummed, a deep vibration that rattled the instruments. It was finishing a print. This was the second case, the one that gave Elias nightmares. They had scanned a wild predator and printed a copy molecule-for-molecule. No egg, no parents, no evolutionary history. Just assembled matter.

  "It's breathing," Kip said, watching the glass chamber. The creature lay sedated. "Heart is beating. Lungs expanding."

  Elias leaned in. "And this chamber here. The spec sheet says you designed it for thermal regulation. Cooling the blood."

  "That was the intent," Kip said. "But the assays show it's filtering toxins. It's not cooling anything. It's a kidney substitute."

  "So is it malfunctioning?" Elias asked. "It's not doing what you designed it to do. But it's keeping the animal alive."

  "It's not designed by selection," Aris said, stepping closer. "It has no history. According to the history view, this thing has no functions at all. It's just a collection of causal processes. It's a pump, not a heart. If it stops pumping, it's not 'broken,' it's just stopped."

  "That's insane," Elias said. "If it stops pumping, it dies. I call that broken."

  "Because you look at the system," Aris said. "You look at what contributes to the life of the whole. I'm saying you can't separate the 'proper' function from the history that built it. This thing," she tapped the glass, "is a philosophical zombie. It works, but nothing is *supposed* to happen."

  "Tell that to the thing when I cut the wrong wire," Elias said.

  The third case sat in a containment unit near the airlock. It was a crested arboreal creature, beautiful and fragile. The crest was a vibrant fan of quills.

  "We tracked a group for a season," Aris said. "The crest isn't genetic. It's maintained by grooming. The animal has to spend an hour every day aligning the quills. If it stops, the crest collapses within a week. It falls out."

  "So it's behavioral," Elias said.

  "It's stable across generations," Aris corrected. "Parents teach offspring to groom. But there's no gene for the crest itself. No selection pressure directly on the quill structure. It's a loop inside the individual's lifetime. If an individual stops grooming, is the collapsed crest a pathology? A disease?"

  "If it protects the neck, yes," Elias said.

  "But nothing selected for it," Aris said. "It's a habit that hardened. If I see one with a bald neck, do I treat it? Or did it just quit?"

  "Who cares?" Kip asked, though he didn't sound like he believed it.

  "Field medics care," Elias said, his voice tight. "Calling something broken is different from saying it's doing something else. I treat broken. I don't treat choices. If the crest is a function, losing it is a failure. If it's just a habit, losing it is variance. I need to know if I'm fixing a malfunction or interfering with a lifestyle."

  The alarm chirped. The fabricator specimen was waking up. Its heart rate spiked on the monitor. The cooling chamber—the one meant to regulate temperature but currently filtering toxins—was fluttering irregularly.

  "It's arrhythmic," Elias said, grabbing a syringe filled with a stabilizing agent. "That chamber is failing."

  "It's doing its job," Kip said. "It's filtering. The flutter is just stress."

  "It's not doing the job on the spec sheet," Elias said, hand hovering over the injection port. "If I stabilize it, I force it back to thermal regulation. I might shut down the filtration. The animal could poison itself."

  "But if you don't," Aris said, "you're accepting a design flaw. You're saying the function is whatever happens to work. You're erasing the difference between a heart and a pump."

  Elias looked at the creature. It was perfect, seamless, without a single ancestor. It had no past. It only had this moment, this breathing, this beating.

  If he listened to Aris, the creature had no proper functions. It couldn't be broken, because nothing was *supposed* to be any specific way. It was just matter in motion. To intervene would be arbitrary.

  If he listened to Kip, the function was whatever kept the system going. The filtration was the function. The flutter was a threat to that function. He had to fix it to preserve the current utility.

  But Elias knew there was a third option. If he treated the chamber as having a historical function—the one Kip programmed—he could restore the "intended" design, even if it killed the animal. He could make it what it was supposed to be, even if it couldn't survive being that thing.

  The creature's heart skipped a beat. The monitor whined.

  Elias held the syringe steady. He looked at Aris, then at Kip. Neither of them moved. The definition of the animal's life rested on what he decided the chamber was for. Was it a filter that was failing? Or a cooler that was never working right?

  He lowered the needle toward the port. The choice wasn't about biology anymore. It was about whether the past owned the future, or if the present was enough.

  "Hold still," Elias whispered, to the animal or himself, he wasn't sure. He didn't inject. Not yet. He watched the flutter, waiting to see if it would stabilize on its own, or if he would have to decide what the thing was supposed to be.
