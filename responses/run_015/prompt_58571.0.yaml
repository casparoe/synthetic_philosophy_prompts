      *Better angle:* The distinction between *acknowledging a conditional* and *executing the mandate*.
      Let's try a Contract Review context. It's about obligation.
      Person: Legal Counsel.
      P: "Client signed Clause 4."
      If P then Q: "If Client signed Clause 4, they owe $1M."
      Counsel agrees P is true. Agrees contract says If P then Q.
      But won't advise "Client owes $1M."
      Why? Because advising is an *act*. She wants a meta-rule that compels the advice.
      This feels closer to "justification for moving."

      *Let's stick to the prompt's request for "ordinary professional context" where the difficulty is about "what justifies moving."*
      Let's go with the **Hospital Safety Check** idea but refine the "principled" aspect. It's about *verification protocols*.
      Scenario: Elena, a medication safety officer.
      P: "Drug X interacts with Drug Y."
      Rule: "If interaction exists, flag the chart."
      She verifies P. She verifies Rule.
      She refuses to flag.
      She says: "Verifying the interaction and verifying the rule are data entries. Flagging is an operation. I need an authorization to perform the operation based on the data. If you write the authorization as a data entry, I still need an operation to process it."
      This is getting too abstract.

      *Simpler approach:* Stick close to Carroll but dress it in professional clothing.
      Context: Quality Assurance in Manufacturing.
      Protagonist: Omar, QA Lead.
      P: "Temperature exceeded limit."
      If P then Q: "If temperature exceeded limit, batch is rejected."
      Omar signs off on the temperature log (P). Omar signs off on the protocol manual (If P then Q).
      Omar refuses to sign the Rejection Form (Q).
      Supervisor: "Why?"
      Omar: "I've acknowledged the inputs. I haven't acknowledged the *step* that connects them. If you add a line to the form saying 'Connect inputs to output,' I will sign that line too. But then I still haven't connected them."
      *Critique:* This sounds like the Tortoise exactly. Is it "principled"? It sounds pedantic.
      *How to make it principled?* Frame it as "Separation of Duties." In high-reliability organizations, *observation* is separated from *judgment*. Omar is saying, "My job is to verify facts. The system's job is to process them. I won't conflate verifying the rule with executing the rule."
      *Actually, the prompt asks to show the "live difficulty."* The difficulty *is* that it looks pedantic but reveals a structural gap. I should lean into the pedantry but frame it as rigorous adherence to protocol categories.

      *Final Plan for Scenario:*
      Context: Aviation Maintenance Log.
