      *   *Follow-up sections?* As requested.

      *(Self-Correction on "Principled"):* To make it seem principled and not crazy, frame it as a concern about *liability* or *category error*. "I am paid to record facts, not to make logical jumps. If the jump is a fact, record it. If it's an action, I need a different authorization." This mirrors the philosophical distinction between *truth* and *validity*.

      *Let's refine the scenario text for maximum clarity.*
      "Elena is a senior safety auditor for an elevator company. Her logbook lists Fact A: 'The brake cable shows fraying.' It lists Regulation B: 'If the brake cable shows fraying, the elevator must be locked out.' Elena signs off on A as true. She signs off on B as binding. She also agrees that standard logic dictates if A and B are accepted, the lockout follows. Yet she refuses to write 'Lock Out' in the status column. When her supervisor hands her a new slip saying 'Rule C: When you accept A and B, you must write Lock Out,' Elena signs Rule C as a true statement about her duties but still leaves the status column blank. She explains, 'Signing that I *should* move is not the same as *moving*. If you write the move as a line item, it becomes just another thing I look at, not something I do.'"

