      P: "Hydraulic pressure low."
      If P then Q: "If pressure low, ground the plane."
      Mechanic confirms P. Confirms Rule.
      Won't write "Grounded."
      Reason: Distinguishes between *recording data* and *issuing commands*. Treating the command rule as data prevents the command from being issued.

      *Wait, I need to ensure the "written down" constraint is met.*
      "The case should turn precisely on what happens when the validity of the step is itself written down as one more item for the person to accept."
      Okay, I will explicitly include the supervisor trying to fix it by writing the rule down.

