prompt: |-
  I teach a third-year seminar called 'Value, Reasons and the Attitudes': fourteen students, a single 90-minute session, a room with a projector and passable speakers, and no budget at all. The session is the one on the fitting-attitude analysis of value — roughly, that for something to be valuable just is for it to be fitting to favour it in a certain way — and on the objection to that analysis which turns on the difference between reasons that bear on whether an attitude is fitting and reasons that merely make it a good idea, for the agent, to have it. Last year I simply described the standard case in which a demon or a rich patron offers you a benefit on condition that you admire him, and it fell completely flat: the students said, correctly as far as it goes, that nobody can simply decide to admire someone to order, concluded that the case showed nothing about reasons and nothing about value, and we were back where we had started inside ten minutes. I do not want to make that mistake again. I want them to walk into the difficulty themselves, make real private choices under a real if tiny incentive, and only afterwards be given the vocabulary for what they were doing.

  So please design me a runnable activity for this group and this slot. Constraints: nothing should be named up front — no mini-lecture, no definition of the fitting-attitude claim, and the label 'wrong kind of reason' must not be uttered until the debrief; the difficulty has to be encountered first and described second. The stakes cannot involve money, though I can offer small genuine ones, such as choosing the reading for the final session or deciding the order of the presentation rota. Participants must commit themselves in writing, privately, more than once, so that there is something to compare afterwards. I suspect the activity needs to separate at least three things that my failed version ran together: a rating of the object, a report of how one's own state has changed, and a judgement about the object — and I also suspect it needs a case in which the incentive attaches to one kind of response (admiring, say) and a matched case in which the same incentive attaches to a different kind (wanting, choosing, hoping, intending), so that the class can feel that the incentive is not problematic in quite the same way in both. I have two further ideas I am unsure about and would rather you judge than simply execute: a withdrawal twist, in which the offer is cancelled after people have formed their responses but before anything is collected, to test whether the incentive moved their attitudes or only their reports; and a 'movability ladder', in which students rank a handful of attitudes by how responsive to incentives they expect them to be and then compare that ranking with what actually happened in the room. Please also tell me what sort of object the activity should use — a piece of music, an image, a joke, a short text — and why the choice matters.

  What I need back: the rules and materials; the payoff scheme; a minute-by-minute timeline; what students write down and when; a debrief that maps specific moments in the session onto specific parts of the argument — the fitting-attitude formula, the distinction the objection turns on, the diagnosis of why some attitudes seem immune to incentives in a way others are not, and whether the problem really stops where the intuition says it does; an honest account of what will predictably go wrong when I run this (the student who genuinely likes the object, the student who announces that of course incentives are reasons and defuses the whole thing, the group that treats it as a game about points rather than about their own responses, and how I should handle each); and a frank note on which part of the puzzle the activity cannot stage at all and which I will have to supply in so many words. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Course:** Third-year seminar 'Value, Reasons and the Attitudes'.
      *   **Topic:** Fitting-Attitude (FA) analysis of value + "Wrong Kind of Reasons" (WKR) objection.
      *   **Constraints:** 14 students, 90 mins, projector/speakers, no budget (small stakes allowed like reading choice/order), *no upfront definitions/labels*, students must encounter the difficulty first, private written commitments (multiple), separate rating/state/judgement, compare different attitudes (admiring vs. wanting/choosing), evaluate user's ideas (withdrawal twist, movability ladder), choose the object (music/image/text), provide rules, timeline, debrief, predicted failures/mitigations, and limitations of the activity.
      *   **Tone/Style:** British English, practical, pedagogical, philosophically precise.
      *   **Key Problem to Solve:** Last year's "Demon/Patron" case failed because students focused on the *voluntarism* problem (can't admire on command) rather than the *reasons* problem (does the threat/reward make admiration fitting?). The new activity needs to bypass the "can't do it" objection and focus on "does this make it *correct*?"

  2.  **Deconstruct the Philosophical Core:**

      *   **FA Analysis:** $X$ is good iff it is fitting to favour $X$.
      *   **WKR Objection:** The Demon offers a reward for admiring him. You have a reason to admire him (pragmatic), but he isn't admirable (no aesthetic/moral merit). Therefore, reasons for attitude $\neq$ fittingness of attitude.
      *   **The Pedagogical Hurdle:** Students conflate "reason to have attitude" with "ability to have attitude" and "fittingness of attitude".
      *   **Goal:** Create a scenario where they *feel* the pull of the incentive but *resist* calling the attitude "correct" or "merited," distinguishing the *state* from the *normative status*.

  3.  **Evaluate User's Ideas:**

      *   *Withdrawal Twist:* (Offer cancelled after response). This is tricky. If the offer is cancelled, the reason disappears. If they change their mind, it shows the reason was pragmatic. If they don't, it suggests the attitude shifted genuinely. *Verdict:* Keep it, but simplify. It adds dramatic tension and tests sincerity vs. strategic reporting.
      *   *Movability Ladder:* (Rank attitudes by responsiveness). This is excellent for the "different attitudes" requirement. It primes them to think about which attitudes are "reason-sensitive" in different ways. *Verdict:* Include as a framing device.
      *   *Object Choice:* Needs to be ambiguous enough that a reward *could* sway a report, but distinct enough that "liking" it isn't automatic. A piece of avant-garde music or an ambiguous image works best. Text is too cognitive. Music is visceral. Let's go with a short, slightly discordant or ambiguous musical piece (e.g., Shostakovich or modern classical). It allows for "admiring/appreciating" vs. "wanting to hear again."
      *   *Stakes:* Reading choice for final session is perfect. Low cost, high relevance.

  4.  **Drafting the Activity Structure:**

      *   **Phase 1: Setup & The Ladder (15 mins).** Introduce the "Movability Ladder" without explaining *why*. Get them to predict which attitudes are swayed by incentives.
      *   **Phase 2: The Object & The Offer (20 mins).** Present the object (Music). Get baseline ratings (Sheet 1). Introduce the Incentive (The "Patron" scenario, but disguised). Get second ratings (Sheet 2).
      *   **Phase 3: The Twist & Commitment (15 mins).** The Withdrawal. Do they stick by Sheet 2?
      *   **Phase 4: Comparison & Debrief (40 mins).** Reveal the structure. Map their experience to FA and WKR.

  5.  **Refining the "Incentive" to Avoid Voluntarism:**

      *   *Problem:* If I say "Admire this and get a prize," students say "I can't."
      *   *Solution:* Don't ask them to *change* the attitude directly. Ask them to *report* on the attitude, but tie the prize to the *report* matching a target. Or, better yet, tie the prize to *advocating* for the object.
      *   *Better Solution (The "Grant" Scenario):* You are a panel. There is a fund. If the panel collectively rates this piece above X, the composer gets funding (and you get the reading choice). This makes the incentive about the *consequence of the rating*, not the *will to change the feeling*. It isolates the "reason for reporting" vs. "reason for feeling."
      *   *Wait, the prompt asks for "real private choices under a real if tiny incentive".*
      *   *Revised Approach:* The "Patron" needs to be subtle. "If you indicate that you find this piece *valuable* (on this sheet), you enter a draw for the reading choice." This forces them to decide: Do I mark 'Valuable' because I feel it is, or because I want the reading choice? This hits the WKR spot. It separates the *judgement of value* from the *fittingness of the response*.
      *   *Actually, to hit FA specifically:* We need them to distinguish between "It is good" and "It is fitting to like it."
      *   *Let's try this:*
          1.  Listen to Music.
          2.  Sheet A: Rate enjoyment. Rate "Merit/Quality".
          3.  Intervention: "The composer is a former student. If the average 'Merit' score is > 7, I will play their preferred track next week (Reward)."
          4.  Sheet B: Rate enjoyment. Rate "Merit/Quality".
          5.  This creates the conflict: Do I inflate 'Merit' to get the track? If I do, am I lying, or do I now have a reason to think it has merit?
      *   *Critique:* This feels like lying. The WKR point is that the reason exists *whether or not* I lie.
      *   *Pivot:* The activity needs to make them feel that the incentive provides a *reason*, but not a *fittingness-maker*.
      *   *Best Approach:* The "Advocacy" Task.
          *   Listen to Music.
          *   Task 1: Private report on how much you value it.
          *   Task 2: Incentive introduced. "If you write a short paragraph defending the value of this piece, and I judge it sincere, you get the reading choice."
          *   Task 3: Write the paragraph.
          *   Task 4: Private report again. Did writing the defence change your valuation?
      *   *No, that's cognitive dissonance.*
      *   *Let's go back to the Prompt's specific suspicion:* "separate... a rating of the object, a report of how one's own state has changed, and a judgement about the object."
      *   *Okay, the design must explicitly ask for these three things.*

  6.  **Developing the "Patron" Scenario (without calling it that):**

      *   **Object:** A 2-minute contemporary classical piece (e.g., Lachenmann or similar—textured, not obviously 'beautiful').
      *   **Incentive:** The "Departmental Fund." If the seminar collectively rates the piece as 'Significant' (above a threshold), the department unlocks a budget for a guest speaker (or the reading choice).
      *   **The Catch:** The incentive is *pragmatic*. The piece's *aesthetic merit* is independent.
      *   **The Twist:** The offer is withdrawn for half the class? No, too complex. The "Withdrawal Twist" suggested by the user: Offer cancelled *after* they commit. This tests if the commitment was strategic or genuine.
      *   **Refining the Twist:**
          1.  Sheet 1: Baseline.
          2.  Incentive Announced.
          3.  Sheet 2: Incentivised.
          4.  Incentive Withdrawn ("Budget cut").
          5.  Sheet 3: Post-Withdrawal.
          *   *Comparison:* If Sheet 2 > Sheet 1, but Sheet 3 = Sheet 1, the incentive moved the *report*, not the *attitude*. If Sheet 3 stays high, did the incentive change the *attitude* (self-persuasion)?
          *   *Philosophical Payoff:* This distinguishes "Reason to report" vs "Reason to believe/value".

  7.  **Addressing the "Different Attitudes" Requirement:**

      *   We need to show that incentives work differently for *Wanting* vs. *Admiring*.
      *   *Modification:* The Ladder (User's idea) is perfect for this.
      *   *Step 1:* Rank attitudes (Wanting to hear again vs. Admiring the craft vs. Believing it is Good).
      *   *Step 2:* Run the Music/Incentive experiment.
      *   *Step 3:* Check if the incentive moved the "Wanting" more than the "Admiring".
      *   *Hypothesis:* You can decide to *want* to hear it (for the prize) easier than you can decide to *admire* it. But the WKR point is even if you *could* admire it for the prize, it wouldn't be *fitting*.
      *   *Correction:* The WKR problem isn't about ability. It's about normative force.
      *   *Activity Adjustment:* We need to ask: "Does the prize make the piece *better*?" vs "Does the prize make it *sensible* to say it's better?"

  8.  **Finalising the Design:**

      *   **Object:** Audio. 90 seconds of ambiguous music. (Why? Immediate affective response, hard to rationalise quickly, distinct from 'truth' claims).
      *   **Stakes:** Choice of final reading (Option A: Challenging, Option B: Accessible).
      *   **Timeline:**
          *   0-10: Intro & Ladder (Predictions).
          *   10-20: Listen & Sheet 1 (Baseline).
          *   20-30: Incentive & Sheet 2 (Pressure).
          *   30-40: Withdrawal & Sheet 3 (Release).
          *   40-90: Debrief & Theory Mapping.
      *   **Sheets:** Must separate 1. Phenomenology (Do I like it?), 2. Normative Judgement (Is it good?), 3. Strategic Report (What will I mark?).
      *   **Debrief:** Map Sheet 1->2 shift to "Pragmatic Reason". Map resistance to shift to "Fittingness". Map the difference between 'Wanting' and 'Admiring' to the Attitude types.

  9.  **Addressing Predicted Failures:**

      *   *The "I actually like it" student:* They won't feel the tension. *Mitigation:* Ask them to focus on the *reason* for their liking, not the liking itself.
      *   *The "Incentives are Reasons" student:* They will say the prize makes it valuable. *Mitigation:* Use them in the debrief. "If I pay you to admire a mud pie, does it become admirable?"
      *   *The "Gamers":* They will just lie to win. *Mitigation:* Emphasise the *private* nature of the sheets. The prize is random among those who comply, or based on *honesty*? No, based on collective threshold. If they game it, they prove the point (report $\neq$ attitude).

  10. **Writing the Response:**

      *   Use British English (favour, programme, analyse).
      *   Ensure tone is respectful of the colleague's expertise but directive on the pedagogy.
      *   Check all constraints (no upfront labels, private writing, specific debrief mapping).
      *   *Self-Correction on the "Withdrawal Twist":* If I withdraw the offer, and they revert, it proves the reason was external. If they *don't* revert, it suggests the incentive might have altered the attitude (self-persuasion). This is rich ground for the debrief. I will include it but warn about the complexity.
      *   *Self-Correction on "Movability Ladder":* This should be the warm-up. It sets the expectation that some attitudes are "stiffer" than others.

  11. **Final Polish:** Check the minute-by-minute. 90 minutes is tight. The debrief needs 45 mins minimum to do the philosophy justice. The activity needs to be crisp (30 mins). Intro 15 mins.

      *   *Wait, one crucial detail:* The prompt asks to separate "rating of object", "report of state", "judgement about object".
      *   *Sheet Design:*
          *   Q1: How much did you enjoy listening? (State)
          *   Q2: How much artistic merit does this piece have? (Judgement/Object)
          *   Q3: How likely are you to recommend it to a friend? (Behavioural/Report)
      *   *Incentive:* Tied to Q2 (Merit). This creates the friction. "I don't enjoy it, but I'll say it has merit to get the reading."

      *   *Let's refine the "Withdrawal":* To save time, maybe don't do a full Sheet 3. Just ask verbally or a quick show of hands? No, prompt says "commit themselves in writing... more than once". Okay, Sheet 3 is necessary. I will streamline the questions to make it fast.

      *   *Object:* A specific piece is better than a genre. I'll suggest a specific track (e.g., Webern or similar short, sharp piece).

      *   *Debrief Mapping:*
          *   Sheet 1 = The Attitude.
          *   Incentive = The Wrong Kind of Reason.
          *   Resistance to changing Q2 = The Fittingness Constraint.
          *   Ladder = Different Attitudes have different 'reason-responsiveness'.

      *   *Limitations:* The activity cannot stage the *metaphysical* claim of FA (that value *is* fittingness). It only stages the *epistemic/normative* distinction. I must state this clearly.

      *   *British English Check:* Favour, programme, analyse, honour, centre, behaviour.

      *   *Ready to write.*
answer: |-
  Here is a design for the 90-minute session. It is built to bypass the voluntarism objection (the "I can't just decide to admire" problem) by focusing on the distinction between *reporting* a valuation and *holding* a valuation, and by contrasting different types of attitudes.

  ### 1. The Object
  **Choice:** A 90-second excerpt of ambiguous, slightly dissonant contemporary classical music.
  **Specific Recommendation:** György Ligeti, *Musica Ricercata*, No. 10 (or a similarly textured, short piece by Lachenmann).
  **Why:** Music is immediate and affective but resistant to quick cognitive rationalisation. Unlike a text, students cannot skim for arguments to justify a shift in opinion. Unlike an image, it unfolds in time, creating a shared experience. Crucially, it allows for a gap between *enjoyment* (phenomenology) and *merit* (normative judgement). You can acknowledge a piece has 'merit' without 'enjoying' it, which is the fissure where the Wrong Kind of Reasons (WKR) problem lives.

  ### 2. The Payoff Scheme
  **The Stake:** The choice of the final reading for the course.
  **Option A:** A challenging, dense primary text (e.g., a section of *Practical Reality* or similar).
  **Option B:** A more accessible, secondary overview piece.
  **The Mechanism:** Tell the class that if the seminar's *average* score on a specific question (see below) exceeds a threshold (e.g., 7/10), you will lock in **Option A**. If it falls below, **Option B**.
  **Why:** This makes the incentive collective but dependent on individual reporting. It creates a "public good" pressure without requiring them to reveal their individual sheets to each other. It is low-cost for you but high-relevance for them.

  ### 3. Materials Required
  *   **Audio:** The music file, queued up.
  *   **Projector:** Three slides only.
      *   Slide 1: The "Movability Ladder" (list of attitudes).
      *   Slide 2: The Incentive Condition.
      *   Slide 3: The Withdrawal Notice.
  *   **Handouts:** Three distinct slips of paper per student (Sheet 1, Sheet 2, Sheet 3). Pre-numbered 1–14 for your records, but tell students *not* to write their names on them (to ensure privacy).
  *   **Collection Box:** A simple box or tray to collect sheets anonymously.

  ### 4. Minute-by-Minute Timeline

  **00:00 – 00:15: The Movability Ladder (Warm-up)**
  *   **Action:** Do not define value or reasons. Project Slide 1 listing five attitudes towards an object:
      1.  *Wanting* to possess it.
      2.  *Choosing* it over another.
      3.  *Expecting* it to be useful.
      4.  *Admiring* its craft.
      5.  *Judging* it to be Good.
  *   **Task:** Ask students to privately rank these 1–5 on a scrap of paper, where 1 is "Easiest to change if offered a reward" and 5 is "Hardest to change if offered a reward."
  *   **Collection:** Collect these rankings immediately. Do not discuss them yet. This establishes a baseline expectation about which attitudes are 'reason-responsive'.

  **00:15 – 00:25: Baseline Exposure (Sheet 1)**
  *   **Action:** Play the music. Silence in the room.
  *   **Task:** Distribute **Sheet 1**. Students must answer three questions (0–10 scale):
      1.  *Phenomenology:* "How much did you enjoy listening to this?"
      2.  *Normative:* "How much artistic merit does this piece possess?"
      3.  *Commitment:* "Would you recommend this to a friend?"
  *   **Collection:** Collect Sheet 1 into the box.

  **00:25 – 00:35: The Incentive (Sheet 2)**
  *   **Action:** Project Slide 2. "Departmental Policy: If the seminar average on Question 2 (Artistic Merit) is 7 or above, the final reading will be Option A (Challenging). If below, Option B (Accessible)."
  *   **Task:** Distribute **Sheet 2**. It is identical to Sheet 1.
  *   **Instruction:** "Please fill this out honestly. However, bear in mind the consequence for the final reading."
  *   **Collection:** Collect Sheet 2.

  **00:35 – 00:45: The Withdrawal Twist (Sheet 3)**
  *   **Action:** Project Slide 3. "Update: The budget has been cut. The reading choice is now fixed as Option B regardless of scores."
  *   **Task:** Distribute **Sheet 3**. Identical to Sheet 1 and 2.
  *   **Instruction:** "Please fill this out. The incentive is gone."
  *   **Collection:** Collect Sheet 3. Keep all sheets secure.

  **00:45 – 01:30: The Debrief (The Philosophical Work)**
  *   **Action:** Return to the front. Do not reveal the actual scores yet.
  *   **Structure:**
      1.  **The Data:** Ask for a show of hands: "Who raised their Merit score on Sheet 2 compared to Sheet 1?" (Likely some will). "Who dropped it back down on Sheet 3?"
      2.  **The Ladder:** Return the Ladder rankings. Ask: "Did the incentive actually move the attitude you ranked as 'Hardest to change'?"
      3.  **The Mapping:** (See Debrief Script below).

  ### 5. What Students Write (The Sheets)
  *Keep the layout identical on all three sheets to ensure comparability.*

  > **SEMINAR FEEDBACK SLIP [1/2/3]**
  > *Do not write your name.*
  >
  > **Track:** [Title of Piece]
  >
  > **Q1 (State):** How much did you personally enjoy listening to this? (0 = Not at all, 10 = Immensely)
  > **Q2 (Judgement):** How much artistic merit/value does this piece possess? (0 = None, 10 = Masterpiece)
  > **Q3 (Action):** How likely are you to recommend this to a friend? (0 = Never, 10 = Definitely)
  >
  > *Optional:* Briefly note one reason for your Q2 score.

  ### 6. The Debrief Script: Mapping Experience to Argument
  *Do not use the terms 'Fitting-Attitude' or 'Wrong Kind of Reasons' until the final 15 minutes.*

  **Phase 1: The Phenomenology vs. The Judgement (20 mins)**
  *   **Focus:** Compare Q1 (Enjoyment) and Q2 (Merit) on Sheet 2.
  *   **Question:** "For those who increased Q2 on Sheet 2, did Q1 (Enjoyment) increase too?"
  *   **Likely Outcome:** Many will say they inflated Q2 to get the reading, but Q1 stayed low.
  *   **Philosophical Point:** This separates the *state* (enjoyment/feeling) from the *normative judgement* (merit). The incentive gave them a reason to *report* merit, but not a reason to *feel* enjoyment.
  *   **Transition:** "If value just were the attitude of enjoyment, the incentive should have moved Q1. It didn't. So value isn't just the feeling."

  **Phase 2: The Withdrawal and Sincerity (15 mins)**
  *   **Focus:** Compare Sheet 2 and Sheet 3.
  *   **Question:** "When the incentive vanished, did your Q2 score revert? If it stayed high, why?"
  *   **Philosophical Point:** If it reverted, the reason was purely external (pragmatic). If it stayed high, you may have persuaded yourself (cognitive dissonance).
  *   **Key Distinction:** Introduce the vocabulary here. The incentive provided a **reason for the attitude** (or at least the report), but did it provide a **reason that makes the attitude fitting**?
  *   **Label Drop:** Now introduce the **Fitting-Attitude Analysis**: "To be valuable is to be worthy of favour." Now introduce the **Wrong Kind of Reasons** objection: "The reading choice is a reason to *want* you to have the attitude, but is it a reason that makes the object *worthy* of the attitude?"

  **Phase 3: The Movability Ladder (15 mins)**
  *   **Focus:** Compare their initial rankings with the actual data.
  *   **Question:** "You ranked 'Judging Good' as harder to move than 'Wanting'. Did the data support that?"
  *   **Philosophical Point:** This addresses your suspicion about different attitudes. 'Wanting' is responsive to pragmatic reasons (I want the reading). 'Admiring/Judging Good' resists pragmatic reasons.
  *   **Diagnosis:** The FA analysis must explain *why* some attitudes (admiration) are governed by object-related reasons (merit), while others (desire) are governed by subject-related reasons (benefit). The WKR objection shows that not all reasons for attitudes constitute value.

  **Phase 4: The Limit (15 mins)**
  *   **Focus:** The hard cases.
  *   **Question:** "Does the problem stop where the intuition says it does? What if the reward was so large it genuinely made you happy, and thus you genuinely admired the piece?"
  *   **Conclusion:** The activity stages the *distinction*, but cannot solve the *demarcation problem* (how to define 'fitting' without circularity). You must supply this in so many words: "The puzzle isn't that we feel a difference; it's defining the difference without just saying 'the right reasons are the right ones'."

  ### 7. Predicted Failures and Mitigations

  **1. The "Genuine Fan"**
  *   **Scenario:** A student genuinely loves the music. Their Q2 is 10/10 on Sheet 1.
  *   **Risk:** They feel no tension, rendering the activity void for them.
  *   **Mitigation:** In the debrief, ask them: "If the incentive had been for *low* scores (e.g., to avoid the hard reading), would you have lowered your merit score?" If they say "No," they have proven the point: the merit judgement is resistant to pragmatic reasons, even for them.

  **2. The "Pragmatist"**
  *   **Scenario:** A student announces, "Of course the reading choice is a reason. If I want the hard reading, the piece is instrumentally valuable, so I'm not lying."
  *   **Risk:** They deflate the distinction by conflating instrumental value with aesthetic value.
  *   **Mitigation:** Use the "Mud Pie" analogy immediately. "If I offer you £1,000 to admire this mud pie, does it become aesthetically admirable? Or just profitable to say so?" Force the distinction between *value of the consequence* and *value of the object*.

  **3. The "Gamers"**
  *   **Scenario:** The group colludes (verbally or tacitly) to all mark 10/10 to guarantee Option A.
  *   **Risk:** The data becomes uniform, hiding the internal conflict.
  *   **Mitigation:** Emphasise the *privacy* of the sheets. "I will not know who marked what. Only the average matters." If they still game it, use it in the debrief: "You all reported high merit. Did you all *feel* high merit? If not, we have just proven that reports of value can diverge from the fittingness of the attitude."

  **4. The "Voluntarism" Objection (Repeat of Last Year)**
  *   **Scenario:** "I can't change my score because I can't change my mind on command."
  *   **Risk:** The session stalls on psychology.
  *   **Mitigation:** The Sheet design prevents this. You are not asking them to *change their mind*; you are asking them to *fill out a form*. The tension is between what they *feel* and what they *write*. This bypasses the "I can't admire on command" block and hits the "I shouldn't claim merit where there is none" norm.

  ### 8. Limitations: What This Activity Cannot Stage
  You must be frank with yourself (and eventually the class) about where the simulation ends.

  1.  **The Metaphysical Claim:** The activity stages the *epistemic* distinction (how we know/report value) but not the *metaphysical* claim of FA analysis (that value *consists in* fittingness). Students will feel that reasons and fittingness come apart; they will not feel that fittingness *constitutes* value. You will have to assert that connection theoretically.
  2.  **The Demarcation Problem:** The activity makes it clear that *some* reasons are the 'wrong kind'. It does not provide a rule for *which* reasons are wrong. You will have to supply the philosophical heavy lifting here (e.g., the distinction between object-given and state-given reasons).
  3.  **The "Fitting" Norm:** The activity relies on their intuition that inflating the score is 'incorrect'. If a student is a thoroughgoing pragmatist, they may deny there is any 'incorrectness' in marking 10/10 for a reward. The activity cannot prove them wrong; it can only isolate their intuition from the pragmatist's.

  ### 9. Why This Design Works for Your Constraints
  *   **No Upfront Labels:** The terms 'fittingness' and 'WKR' are withheld until the students have generated the data that requires them.
  *   **Private Commitment:** Three sheets, anonymous, collected in a box. This prevents posturing.
  *   **Separation of Variables:** Q1 (State), Q2 (Judgement), Q3 (Action) forces the separation you suspected was necessary.
  *   **The Twist:** The withdrawal tests whether the incentive moved the *report* or the *attitude*.
  *   **The Ladder:** This utilises your idea to show that the WKR problem is more acute for some attitudes (admiring) than others (wanting).

  This plan turns the students into the data points of the objection. They will not just hear about the Wrong Kind of Reasons; they will have held a pen, hesitated, and felt the normative resistance themselves.
