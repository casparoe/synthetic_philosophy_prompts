      *   **Subject:** Recommendation regarding 'The Fall of Rome?' Gallery Redesign
      *   **Executive Summary:** Vote to change title and adopt regional narrative.
      *   **Philosophical Framework:** Empire != Organism. Avoid teleology.
      *   **Empirical Engagement:** Acknowledge Western collapse (the "Fall" evidence) but contextualize it within Eastern survival.
      *   **Action Plan:** New title, Regional zoning, 5-year review.
      *   **Motion:** Specific wording for the vote.

  7.  **Final Review against constraints:**
      *   *Doctoral researcher tone:* Needs to sound authoritative but collegial.
      *   *Four weeks timeline:* Mention the urgency.
      *   *Category error:* Explicitly discussed.
