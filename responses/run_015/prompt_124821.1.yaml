      *(Self-Correction)*: I need to make sure I don't sit on the fence too much. The prompt asks for a *concrete course of action*. I must pick a lane while acknowledging the other. I will pick the "Transformation/Continuity" lane as the *overarching* framework because it is more historically robust for a *national museum* covering the whole period, but I will mandate that the "Fall" evidence be displayed prominently as a *regional* experience.

      *Revised Title Idea:* "Rome: Empire and Aftermath, 300–700 CE." This avoids "Fall" but acknowledges "End." Actually, "The Transformation of the Roman World" is the classic counter-title. Let's suggest: "Rome Transformed: Continuity and Crisis, 300–700 CE."

