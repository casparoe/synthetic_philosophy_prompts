          *   *The Missing Piece:* The "Significant Cost/Reasonable Burden" Constraint. Savulescu explicitly includes this.
          *   *Donor Shopping:* Defenders argue genetic connection has value to parents (autonomy/identity). If the cost of severing that is high, PB doesn't mandate donor shopping. The passage ignores this trade-off.
          *   *Delaying:* Defenders argue there's a limit. You don't wait for *perfect* tech, only *available/significant* tech. Infinite waiting is ruled out by the "reasonable burden" of delay (age, opportunity costs).
          *   *Conclusion on Extensions:* The passage presents them as absurdities to kill the theory. A careful defender accepts them *in principle* but limits them *in practice* via the burden constraint. The passage fails to engage with the constraint, making the *reductio* weak.

  7.  **Refining the Tone:**
