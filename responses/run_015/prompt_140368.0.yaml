answer: |-
  1. **The Ex Ante Relocation**
  You argue the separateness of persons objection only bites against *ex post* tradeoffs—where we tell a loser their pain is fine because the total went up. But if we switch to *ex ante* rules—maximizing everyone's expected well-being ahead of time—doesn't that just relocate the complaint? The person still ends up worse off in reality; what does it do for *them* that the choice was made earlier under uncertainty?

  *   **Likely Answer:** She will say it respects them as an equal moral agent. They consented to the risk behind the veil, so the outcome isn't an imposition but a gamble they signed up for.
  *   **Follow-up:** But consent to a risk isn't consent to the loss. If I lose everything, the fairness of the gamble doesn't feed my children. Does "procedural fairness" actually compensate for substantive loss, or does it just clean your hands of the guilt?

  2. **The Veil as Conflation**
  To get that *ex ante* view, we imagine a single impartial chooser behind a veil of ignorance. Is that chooser just a calculating device to ensure impartiality, or is it effectively merging us all into one super-person—the very conflation of persons the objection was originally about?

  *   **Likely Answer:** She will insist it's merely a heuristic device, a thought experiment to filter out bias, not a metaphysical claim that we are one entity.
  *   **Follow-up:** If it's just a device, why does its calculation override the actual separate people it represents? If the device merges our interests to find the answer, hasn't it smuggled the conflation in through the back door regardless of your intent?

  3. **The Single Life Analogy and Reductionism**
  We accept tradeoffs within a single life—I suffer now to gain later—because I own both moments. You say this doesn't apply across persons. But if we take a reductionist view, where a life is just a series of connected moments rather than one solid thing, does that boundary blur enough to justify tradeoffs across persons too?

  *   **Likely Answer:** She will argue that psychological continuity within a life is strong enough to ground prudence, whereas connections between people are too weak to ground sacrifice.
  *   **Follow-up:** But if continuity is a matter of degree, as reductionists say, aren't you just drawing an arbitrary line? If the unity of a life can fade, why can't the separateness of persons fade with it?

  4. **The Rawlsian Tu Quoque**
  You argue that Rawls's Maximin principle aggregates too, so he can't use the separateness objection against you. But the Rawlsian says comparing the positions of representative people isn't the same thing as summing their gains and losses. Is that distinction strong enough to block your charge?

  *   **Likely Answer:** She will claim both views require a common metric of advantage to compare positions, so both are aggregating in the relevant sense.
  *   **Follow-up:** But Rawls refuses to sum marginal gains; he looks at the floor, not the total. Isn't the objection specifically about *summing* losses against gains, not just comparing levels? If you don't sum, aren't you safe?

  5. **Prioritarianism or Contractualism?**
  Is your view secretly Prioritarianism—giving extra weight to the worst off—or Contractualism—based on what rules no one could reasonably reject? If it's a hybrid, which half is doing the work in the hard cases where expectations clash with outcomes?

  *   **Likely Answer:** She will likely say it's distinct because it focuses on *ex ante* expectations rather than outcomes or vetoes, though it shares features with both.
  *   **Follow-up:** When the *ex ante* expectation leads to a catastrophic *ex post* outcome for the worst off, which principle wins? Do you stick to the expectation even if the contract seems broken?

  6. **The Identifiable Victim**
  If the wrong is unconsented risk imposition rather than aggregation per se, does your view still get to save the many statistical lives over the one identifiable victim? Does it give the answer most people actually have when it's one named person versus a large number of strangers?

  *   **Likely Answer:** Yes, provided the risk was imposed fairly ex ante. The identifiability of the victim shouldn't change the moral math.
  *   **Follow-up:** But people feel differently about the identifiable victim. Is that irrational bias we should train out of ourselves, or is it a moral signal that your theory is ignoring something real about human connection?

  7. **Risk and Consent**
  You say the real content of the objection is a complaint about imposing unconsented risk on identifiable people. But in public health or hospital policy, we rarely get actual consent. Are we relying on hypothetical consent, and if so, how is that different from just imposing our view of their good?

  *   **Likely Answer:** She will argue that hypothetical consent is sufficient for institutional rules, provided the rules are designed to maximize everyone's expected safety.
  *   **Follow-up:** But if I'm the one who loses out, I didn't actually agree. At what point does "hypothetical consent" become a fiction we use to silence the actual dissent of the loser?

  8. **The Committee Case: The Decision**
  I'm on a hospital ethics committee. We had to move nursing time from palliative care to stroke recovery. The numbers clearly favored the switch; the losers were named patients on the ward, the gainers were statistical. On your view, do we make the switch?

  *   **Likely Answer:** Yes. If the ex ante expected well-being is higher for the population under the new rule, the switch is justified.
  *   **Follow-up:** So the named patients on the palliative ward are effectively sacrificed for the statistical gain of others? How is that not using them as a means, which Kantians and Rawlsians say is forbidden?

  9. **The Committee Case: The Explanation**
  If we make that switch, what do I say to the palliative patient who loses out? Do I tell them their loss is justified by the statistical gain elsewhere, or is there a different explanation that respects their separateness?

  *   **Likely Answer:** You explain that the institution follows rules designed to maximize everyone's expected care, and unfortunately, this rule didn't benefit them this time.
  *   **Follow-up:** But that tells them they were unlucky, not that they were respected. If you can't offer them a reason that appeals to *their* good, haven't you admitted that in practice, they are just a vessel for the general welfare?

  10. **Falsification**
  What finding or argument would make you give this view up? Is there a scenario or a logical result that would convince you the separateness of persons objection is stronger than you think?

  *   **Likely Answer:** She might say empirical evidence showing that ex ante rules lead to catastrophic outcomes for minorities, or a logical proof that hypothetical consent is incoherent.
  *   **Follow-up:** If I say "this violates my intuition about dignity," and you reply "that's just a fact about how people feel, not an argument," haven't you insulated the view from moral critique? If moral theory doesn't account for reflective intuitions about dignity, what is it doing?
