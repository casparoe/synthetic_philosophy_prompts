answer: |-
  # Joint Statement on the Structure of Hard Choices

  **Date:** [Current Date]
  **Parties:** The Parity Theorist and The Incomparabilist
  **Subject:** The normative structure of the choice between the Research Fellowship and the Teaching Post.

  ## 1. Definitions of Positions

  To ensure we are not talking past one another, we define the two positions under discussion as follows. These definitions are stipulative for the purpose of this document and do not rely on external authority.

  **The Parity View**
  In a hard choice of this kind, the options stand in a genuine fourth positive comparative relation. They are not better than, worse than, or equally good as one another. They are, however, *comparable*. This comparability is not a matter of degree; it is a qualitative relation indicating that the options belong to the same normative neighborhood. Because they are comparable, a small improvement to one option (e.g., a small sum of money) makes it strictly better than the other. The choice is rationally resolvable, though not dictated by the comparative facts alone, because the agent's own will or commitment supplies a reason that the pre-existing values do not. The agent creates a reason by choosing.

  **The Incomparabilist View**
  In a hard choice of this kind, there is no positive comparative relation at all between the options. The values in play (e.g., career achievement vs. family care) are heterogeneous and are not measurable against any single covering value. The failure is in comparability itself, not merely in the usual three-way classification (better, worse, equal). No fact of the matter settles which option is to be chosen prior to the choice. The agent must simply pick; no comparative verdict is available to guide the picking, and nothing about the options' comparative status is made true by the agent's having picked. This view does not imply that "anything goes"; rational constraints still exclude clearly inferior options, but between the top contenders, there is a normative gap.

  ***

  ## 2. Common Ground

  We agree on the following claims. Both parties sign these as accurate descriptions of our shared understanding of the situation.

  1.  **Failure of the Trichotomy:** The standard classification of options as "better," "worse," or "equally good" fails to capture the normative reality of this specific choice.
  2.  **Non-Epistemic Hardness:** The difficulty is not merely due to a lack of information. More data about the fellowship or the mother's health would not necessarily settle the choice.
  3.  **Permissibility:** In such cases, either option may be permissibly chosen without rational error.
  4.  **Rational Constraints:** The existence of a hard choice does not render all options permissible. Clearly worse options (e.g., a fellowship with no pay and no research time) remain excluded. Neither view licenses indifference to the whole menu.
  5.  **Precision Not Required:** Rational choice does not require assigning a precise numerical score to every value.
  6.  **Phenomenology:** The disagreement is not about how agonizing the choice feels. Both agree the choice is difficult; the dispute is about the underlying normative structure, not the psychological experience.
  7.  **Significance:** Both agree that the choice is significant and that reasons exist in favor of each option, even if those reasons do not sum to a single verdict.

  ***

  ## 3. Residual Disagreements

  The following table isolates the points where we remain divided. We have attempted to state each position in terms the holder would accept.

  | Issue | Neutral Formulation | Parity Theorist Formulation | Incomparabilist Formulation | Nature of Disagreement |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Comparative Relation** | Do the options stand in *any* positive comparative relation? | Yes. They stand in the relation of "parity." They are comparable but not equal. | No. There is no positive comparative relation. They are incomparable. | **Verbal (with substantive consequences).** We are using "comparable" to mean different things. Parity Theorist means "normatively connected." Incomparabilist means "measurable on a common scale." |
  | **2. The Role of the Will** | Does the act of choosing change the normative status of the options? | Yes. The will supplies a reason that was missing. Choosing makes the chosen option the one there was most reason to choose. | No. The will executes a choice where reasons run out. Choosing does not create a comparative truth about the options. | **Substantive.** We disagree on whether human agency can generate normative truth. |
  | **3. Small Improvements** | Does a small improvement to one option make it better than the other? | Yes. Because they are comparable, a small improvement tips the scale. | Not necessarily. A small improvement may remain within the zone of incomparability. It acts as a tie-breaker, not a comparative verdict. | **Substantive.** We disagree on the sensitivity of the normative landscape to small changes. |
  | **4. Covering Values** | Is there a single value that covers both options? | Yes, broadly speaking (e.g., "the good life"), allowing them to be in the same neighborhood. | No. The values are distinct kinds (career vs. care) that cannot be subsumed under one metric without distortion. | **Substantive.** We disagree on the unity of value. |

  ***

  ## 4. The Cruxes

  We identify the following test cases as decisive. For each, we record our predictions below. We agree to treat these predictions as commitments of our respective views.

  ### Case A: The Small Money Variant
  **Scenario:** Take the actual case. Attach a small amount of money to the Fellowship (small enough that neither of us thinks it is worth rearranging her life for *on its own*).
  **Question:** Does that settle the choice?

  *   **Parity Theorist Prediction:**
      *   **Improvement:** Yes. The Fellowship with money is now *better* than the Post. The small improvement breaks the parity.
      *   **Worsening:** Yes. If we instead worsen the Post by the same amount, the Fellowship is now *better* than the Post.
      *   **Symmetry:** The effect is symmetric. Improvement makes one better; worsening makes the other worse.
      *   **Confidence:** High. This is a defining feature of parity.

  *   **Incomparabilist Prediction:**
      *   **Improvement:** No. The options remain incomparable. The money acts as a rational tie-breaker, but it does not make the Fellowship *better* in terms of the core values (research vs. care).
      *   **Worsening:** No. The options remain incomparable. The worsening makes the Post less attractive, but not comparable to the Fellowship.
      *   **Symmetry:** The effect is symmetric. Neither change creates comparability.
      *   **Confidence:** High. Comparability requires a common scale, not just a nudge.

  ### Case B: The Repeated Choice (200 Times)
  **Scenario:** She faces a structurally identical choice 200 times over (200 afternoons to allocate).
  **Packages:** (1) All Project, (2) All Mother, (3) Mixed (100 each).
  **Question:** Which packages are comparable, and is any better than another?

  *   **Parity Theorist Prediction:**
      *   **All Project vs. All Mother:** These remain on a par. They are in the same normative neighborhood.
      *   **Mixed vs. Pure:** The Mixed package is on a par with the Pure packages.
      *   **Reasoning:** Since the units are on a par, aggregating them does not create a clear winner. However, if the "small money" were added to every instance of the Project, the All Project package would eventually become better.
      *   **Confidence:** Medium. Aggregation in parity cases is complex, but the "neighborhood" intuition should hold.

  *   **Incomparabilist Prediction:**
      *   **All Project vs. All Mother:** These remain incomparable. You cannot sum heterogeneous values to get a total.
      *   **Mixed vs. Pure:** The Mixed package is incomparable with the Pure packages.
      *   **Reasoning:** 200 instances of incomparability do not sum to comparability. There is no common currency to add up.
      *   **Confidence:** High. This follows directly from the heterogeneity of values.

  ### Case C: The Third Party Advice
  **Scenario:** A well-informed colleague knows her situation thoroughly.
  **Question:** What can he permissibly say to her?

  *   **Parity Theorist Prediction:**
      *   **Statement:** "Neither is better, but there is a verdict here: choose either, and your choosing it is itself part of the reason."
      *   **Reasoning:** The colleague can acknowledge the parity and point out that her will is the necessary final ingredient.
      *   **Confidence:** High.

  *   **Incomparabilist Prediction:**
      *   **Statement:** "No verdict is available; you must pick, and your picking settles nothing comparative."
      *   **Reasoning:** The colleague cannot truthfully say there is a "verdict." There is only a necessity to act despite the lack of a verdict.
      *   **Confidence:** High.

  ### Case D: Post-Choice Reason Generation
  **Scenario:** She chooses the Post at home and begins to live as someone who did that.
  **Question:** Does this generate a reason she did not have before (e.g., not to revisit the decision)?

  *   **Parity Theorist Prediction:**
      *   **Outcome:** Yes. Her commitment creates new reasons (e.g., to stick with the choice, to make it successful). The choice transforms the normative landscape.
      *   **Weight:** A significant portion of the view rests on this. Without it, the "will supplying reason" is empty.
      *   **Confidence:** High.

  *   **Incomparabilist Prediction:**
      *   **Outcome:** No. Her choice resolves the situation practically, but it does not generate new normative reasons regarding the *value* of the options. It may create psychological sunk costs, but not normative truth.
      *   **Weight:** A significant portion of the view rests on this. If choosing creates truth, incomparability collapses into parity.
      *   **Confidence:** High.

  ### Case E: The Covering Description (Additional Crux)
  **Scenario:** We ask both parties to name a description under which the two options are comparable.
  **Question:** Is there *any* description that makes them comparable?

  *   **Parity Theorist Prediction:**
      *   **Answer:** Yes. "Contribution to a flourishing life" or "What I have most reason to do." Under these descriptions, they are comparable (on a par).
      *   **Confidence:** High.

  *   **Incomparabilist Prediction:**
      *   **Answer:** No. Those descriptions are too vague to be operative. Under any *precise* description that could guide action, they are incomparable.
      *   **Confidence:** High.

  ***

  ## 5. Closing: Falsification and Evidence

  We conclude by stating what would count as evidence against our respective views. We agree that if these conditions were met, the debate would be settled rather than merely refined.

  **Evidence Against the Parity View**
  The Parity Theorist would abandon their view if it were demonstrated that small improvements *fail* to break the relation. If we can add money to the Fellowship repeatedly, in small increments, and the Parity Theorist is forced to say the Fellowship is *still* not better than the Post until a massive threshold is crossed, then Parity collapses into Incomparability. The "Small Improvement Argument" is the Parity View's vulnerability.

  **Evidence Against the Incomparabilist View**
  The Incomparabilist would abandon their view if it were demonstrated that there *is* a common metric that both captures the values and guides action without distortion. If we can identify a covering value (e.g., "well-being") that allows for rational trade-offs without losing the specific meaning of "care" or "research," then Incomparability collapses into Parity or Equality. The "Covering Value Argument" is the Incomparabilist View's vulnerability.

  **Common Ground on Resolution**
  We agree that the debate is not resolvable by introspection alone. We agree that the test cases above (particularly the Small Money and Repeated Choice cases) are the proper battleground. If our predictions in Section 4 prove inconsistent with our considered judgments in these specific cases, we agree to adjust the theory to fit the judgment, rather than dismissing the judgment to save the theory.

