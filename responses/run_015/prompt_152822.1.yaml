  ### Brainstorming & Sub-Question Analysis

  Before fixing a credence, I need to isolate the load-bearing philosophical joints in the stipulated scenario. The evidence provided (Layered-Divergence) interacts with the definition of Robust Realism (stance-independent facts + access) through several mechanisms.

  **Candidate Sub-Questions:**
  1.  **Metaphysical Aptness:** Are trade-off weights (e.g., "how much loyalty for how much harm") the kind of thing that can be true or false, or are they pragmatic commitments?
  2.  **Explanatory Power:** Does the ecological correlation of weights best explain itself as *tracking* a function (Calibration) or as *causal determination* without truth (Anti-Realism)?
  3.  **Continuity vs. Precision:** Does the continuous nature of the weighting space imply the absence of a "correct" point, or merely our inability to specify it precisely?
  4.  **Access Condition:** Does "capable of getting some right" require cross-cultural convergence, or only local accuracy relative to the stance-independent fact?
  5.  **Factual Confounds:** How much of the divergence is actually disagreement about non-moral facts (e.g., what causes harm) rather than moral weights?

  **Classification:**
  *   **Substantive:** 1 (Metaphysical Aptness), 2 (Explanatory Power), 4 (Access Condition). These determine the truth conditions of realism.
  *   **Verbal/Definitional:** 3 (Continuity vs. Precision) hinges on whether "fact" implies "sharp boundary." I will treat this as substantive regarding *access* rather than existence.
  *   **Discarded:** 5 (Factual Confounds). The stipulation explicitly says Layer 2 disagreement survives changes in questioning and correlates with ecology, not factual error. I will treat this as fixed at near-zero confounding for the purpose of the calculation, as per the "whole of your evidence" constraint.

