answer: |-
  This is a fantastic trap to be in. You haven't written yourself into a corner; you've written yourself into the actual philosophical problem of systematics, just with the Earth-training-wheels removed. On Earth, we paper over the cracks because sex, trees, and morphology usually align well enough for lawyers. On your planet, they don't.

  Here is the requirements list for a functional species concept, broken down by the demand behind it, the job it serves, and its negotiability.

  ### The Requirements List

  **1. Diagnosability**
  *   **The Demand:** An operator must be able to assign an individual to a unit using available tools within a finite time.
  *   **The Case:** If you cannot identify the thing, you cannot protect the thing.
  *   **Job:** Field Naturalist (3).
  *   **Status:** **Non-negotiable.** (Without this, the law is unenforceable).

  **2. Inductive Validity**
  *   **The Demand:** Members of the unit must share unobserved properties (e.g., toxicity, structural strength, vulnerability to solvent X).
  *   **The Case:** If the unit doesn't predict biology, it's just a stamp collection. The mining company needs to know if killing Form A also kills Form B.
  *   **Job:** Mining Scientist (2).
  *   **Status:** **Non-negotiable.** (Without this, the conservation law is biologically meaningless).

  **3. Discreteness**
  *   **The Demand:** There must be gaps between units, not a continuum.
  *   **The Case:** Law requires binary decisions (protected/not protected). If populations blend seamlessly, you cannot draw a line without arbitrariness.
  *   **Job:** Lawyers (1).
  *   **Status:** **Non-negotiable for Law, Preference for Biology.** (Biologists tolerate clines; Lawyers cannot).

  **4. Stability**
  *   **The Demand:** The definition of the unit cannot change faster than the litigation cycle.
  *   **The Case:** You cannot litigate a concession if the protected list is updated every Tuesday based on new sequencing data.
  *   **Job:** Lawyers (1).
  *   **Status:** **Non-negotiable.** (Without this, the legal instrument creates uncertainty rather than resolving it).

  **5. Historical Unity**
  *   **The Demand:** Members of the unit must share a common ancestral origin exclusive of other units.
  *   **The Case:** Evolution is the only reason we expect organisms to be similar at all. If they don't share history, their similarity is coincidence.
  *   **Job:** Mining Scientist (2) / Biologist Preference.
  *   **Status:** **Preference (Terran Parochialism).** (See below).

  **6. Reproductive Cohesion**
  *   **The Demand:** Members of the unit must exchange genetic material primarily with each other.
  *   **The Case:** This keeps the unit together over time against the entropy of mutation.
  *   **Job:** Biologist Preference.
  *   **Status:** **Preference (Terran Parochialism).** (See below).

  ---

  ### Terran Parochialism vs. Universal Requirements

  You asked which requirements look mandatory only because Earth life is built a certain way.

  *   **Historical Unity (Requirement 5):** On Earth, we assume a single Tree of Life. We demand a species be a "branch." In your biosphere, with fusion across phyla and viral shuttles, organisms have multiple ancestors. Demanding a single tree is **Terran Parochialism**. A universal concept must allow for *networks*, not just trees.
  *   **Reproductive Cohesion (Requirement 6):** On Earth, sex creates boundaries. We treat "interbreeding" as the glue of a species. In your biosphere, fusion is promiscuous and asexual budding is common. Demanding reproductive isolation is **Terran Parochialism**. A universal concept must rely on *ecological* or *developmental* cohesion, not mating.
  *   **Diagnosability (Requirement 1):** This is **Universal**. Any intelligence, anywhere, needs to be able to point at a thing and name it. However, *how* they diagnose it (morphology vs. genetics) is where the parochialism creeps in. Earth biology assumes genotype predicts phenotype. Your polyphenism breaks this.

  ### The Incompatible Pair (The Gift)

  You asked which two requirements cannot be had together. In your specific biosphere, the conflict is between **Discreteness (3)** and **Inductive Validity (2)**.

  *   **Why:** The "ecologically dominant organism" is a persistent swarm of intermediates.
  *   **The Conflict:** To satisfy the **Lawyers (Discreteness)**, you must draw a line through the swarm, declaring some intermediates "Species A" and others "Species B." But because the swarm is biologically continuous and stable, any individual on one side of the line will be biologically identical to an individual on the other side.
  *   **The Result:** If you draw the line (Discreteness), you destroy the predictive power (Inductive Validity). Two organisms on opposite sides of the legal line will respond identically to the mining poison, but the law treats them as different kinds. If you keep the predictive power (grouping the whole swarm as one unit), you violate Discreteness because the swarm blends into the two "recognisable forms" at the edges.
  *   **Verdict:** You cannot have a list that is both legally distinct *and* biologically accurate. One must be sacrificed.

  ### Counting vs. Labeling

  You asked if a concept must answer "how many kinds" (Delimitation) and "which kind is this" (Diagnosis), and if settling one settles the other.

  *   **Do they have to answer both?** Theoretically, yes. A concept that can identify an individual but cannot tell you where the group ends is broken.
  *   **Does settling one settle the other?** On Earth, usually yes. In your biosphere, **No.**
  *   **The Decoupling:** Your Field Naturalist can likely solve **Labeling** (Diagnosis). She can sequence a sample and say, "This genome matches the Swarm profile." But she cannot solve **Counting** (Delimitation). Because the swarm blends into the other forms, she cannot say where the Swarm ends and the "Grazer" begins.
  *   **Plot Point:** The lawyers want the Count (how many species are at risk?). The scientist can only give the Label (this individual is at risk). The law requires the Count to calculate damages or restrictions. The biology refuses to provide the Count.

  ### Concept Scorecard

  *   **Interbreeding (Biological):** Fails immediately; no sex, promiscuous fusion, and HGT mean no reproductive boundaries exist.
  *   **Look-alike (Morphological):** Fails; diet-based polyphenism means one genome makes four unrelated bodies, and the swarm blurs all shapes.
  *   **Family-tree (Phylogenetic):** Fails; viral shuttles and cross-phyla fusion mean no single gene tree matches the organism, and polyphyly is possible.
  *   **Niche (Ecological):** Best chance; the swarm occupies a specific stable role, but fails if the mine affects the "recognisable forms" that the swarm blends into.
  *   **Lineage (Evolutionary):** Fails; requires ancestral exclusivity which your fusion and multiple-origins scenario explicitly forbids.

  \answer{Fixed boundaries between fluid populations | No}
