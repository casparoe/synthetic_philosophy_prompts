answer: |-
  ### I. Conceptual Sequence and Dependency

  **Order of Presentation:**
  1.  **The Essentialist Intuition (The Picture Theory):** Begin by eliciting the students' natural assumption that for the word "rule" to have meaning, there must be a single, defining feature common to all rules (an essence).
  2.  **The Failure of the Picture Theory:** Demonstrate that this search for a common essence fails when examining actual usage.
  3.  **Language Games (Meaning as Use):** Introduce this as the alternative framework. Meaning is not a static object pictured by a word, but a function of the word's role within a specific activity.
  4.  **Family Resemblance:** Introduce this as the structural explanation for how a word retains unity across different Language Games without a common essence.

  **Justification of Dependency:**
  You must establish the failure of the Picture Theory *before* introducing Family Resemblance because Family Resemblance is a solution to a problem the students do not yet feel. If they believe words function by naming essential features (Picture Theory), they will view Family Resemblance as a claim that language is "messy" or "imprecise." They need to experience the *philosophical frustration* of trying to find the one thing that makes a courtroom rule and a friendship rule the same "kind" of thing. Once they see that no such single feature exists, Family Resemblance becomes the necessary tool to explain how the word "rule" still works without collapsing into nonsense. Language Games must be introduced immediately after the Picture Theory fails to provide the *context* in which "use" operates; Family Resemblance then explains the *continuity* between those contexts.

  ### II. The Carrying Case: "Rule" in Three Contexts

  **Exclusions:**
  *   Do not use the board game context to explain what a "Language Game" *is*. (This triggers the "wordplay/poetry" association you want to avoid). The board game is strictly a *site* where the word "rule" is used, not a metaphor for language itself.
  *   Do not allow the discussion to devolve into semantic ambiguity (i.e., "It just means different things").

  **Inclusions and Order:**
  1.  **Context 1: The Courtroom (The Anchor for Picture Theory)**
      *   *Introduce First.* This aligns with the students' Essentialist intuition.
      *   *Feature to Highlight:* **Codification and Enforcement.** The rule exists as a physical text (statute) and violation leads to formal sanction.
      *   *Philosophical Labor:* This establishes the baseline "Picture" of a rule: an objectified command that exists independently of the participants' feelings.

  2.  **Context 2: The Board Game (The Bridge)**
      *   *Introduce Second.*
      *   *Feature to Highlight:* **Constitutive Function.** Unlike the law (which regulates pre-existing behavior), the rule *creates* the activity (e.g., you cannot "castle" outside the rules of chess).
      *   *Philosophical Labor:* This strains the Picture Theory. The rule is still written, but its existence depends on the players' agreement to play. It introduces the element of *practice* over mere *text*.

  3.  **Context 3: Unspoken Friendship (The Breaker)**
      *   *Introduce Third.*
      *   *Feature to Highlight:* **Normativity without Codification.** There is no text. Violation leads to social estrangement, not jail or game-over. The rule is known only by how one acts when it is breached.
      *   *Philosophical Labor:* This breaks the Essentialist intuition. There is no physical text (unlike Court/Game) and no formal enforcement (unlike Court). If students claim the "essence" of a rule is "written down," this kills it. If they claim the essence is "punishment," the friendship context challenges the severity.

  **Making the Absence of Essence Visible:**
  Ask the students to identify the *one* feature present in all three that makes them all "rules." When they suggest "written down," point to Friendship. When they suggest "punishment," point to the nuance of a friend's disappointment vs. a judge's sentencing. When they suggest "guidance," ask if a weather forecast guides but isn't a rule. The goal is to show that while no *single* feature runs through all three, they are not merely three homonyms (like "bank" of a river vs. "bank" for money); they are connected by overlapping similarities.

  ### III. Misconception Mapping and Intervention

  **Misconception 1: "Family Resemblance means there are literally no shared features."**
  *   *When it arises:* During the transition from the Board Game to the Friendship context.
  *   *Intervention:* Use the "thread" analogy immediately after the Friendship discussion. Explain that while no single fiber runs the length of the whole thread, the fibers overlap. Point out that Courtroom and Board Game *do* share features (written text), and Board Game and Friendship *do* share features (voluntary participation). The lack of a *universal* commonality is not a lack of *any* commonality.

  **Misconception 2: "Wittgenstein is reducing meaning to arbitrary social agreement."**
  *   *When it arises:* During the Language Games introduction (Meaning as Use). Students may think "use" means "whatever I want it to mean."
  *   *Intervention:* Anchor this in the **Courtroom** context回顾 (review). Emphasize that within a Language Game, the moves are *normative*, not arbitrary. You cannot move a knight diagonally and claim you are playing chess. Meaning is constrained by the rules of the specific game being played. Use is public and regulated, not private and whimsical.

  **Misconception 3: "This is just a fancy way of saying language is vague."**
  *   *When it arises:* During the final synthesis of Family Resemblance.
  *   *Intervention:* Distinguish "vagueness" (a defect) from "family resemblance" (a structural feature). Vagueness implies we *should* have a precise definition but don't. Family Resemblance argues we *never needed* a precise definition for the word to function perfectly well. The word "rule" is not broken; our expectation that it needs an essence was the error.

  ### IV. Closing Question

  **The Question:**
  "Imagine a community that has a written constitution with strict laws, but for fifty years, every single citizen and judge has ignored a specific law and acted in direct contradiction to it without consequence. In Wittgenstein's framework, does that written text still function as a 'rule' for that community? Why or why not?"

  **What this reveals:**
  *   If they answer based on **Picture Theory**, they will say "Yes, because the text exists."
  *   If they answer based on **Vagueness**, they will say "It's unclear."
  *   If they grasp **Use/Meaning**, they will argue that without the *practice* of following or enforcing it (the Language Game), the text is merely ink on paper, not a rule. This tests if they understand that meaning is constituted by the activity, not the object.

  ### V. Scope Limitation: The Private Language Argument

  **Explicit Exclusion:**
  You must explicitly state that this session does not cover the **Private Language Argument** or the **Rule-Following Paradox**.

  **How to Acknowledge It:**
  At the end of the session, before the closing question, say:
  "We have discussed how public use determines meaning. A deeper question Wittgenstein asks is: *What makes my use of a rule 'correct' rather than just what I 'think' is correct?* If meaning is just use, how do I know I'm not changing the rules in my head every time I speak? Answering that requires proving that a language understandable only to one person is impossible. That argument is beyond our scope today, but know that the 'Language Games' we discussed are the foundation for that proof."
