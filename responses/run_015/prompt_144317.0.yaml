      *   *Case 5 (Retroactive Self-Illegalization):* Temporal paradoxes/retroactivity.
      *   *Case 6 (The Façade):* Interpretation vs. Amendment.
      *   *Case 7 (Validity vs. Efficacy):* Kelsen vs. Hart style problem.
      *   *Case 8 (Penalized Motion):* Self-protecting prohibitions.
