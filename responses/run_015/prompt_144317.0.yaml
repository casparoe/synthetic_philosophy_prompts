  *(Self-Correction on Case 7)*: The user asks if validity must connect to what officials do. For *capture detection*, yes. If officials ignore a valid rule, it's not capture, it's noise. If officials follow an invalid rule, it *is* capture. So the theory *must* link validity to efficacy for this specific purpose, even if pure jurisprudence separates them. I will mark this as Non-Negotiable for *this* purpose.

  *(Self-Correction on Case 6)*: The Façade. This is the "Interpretive Boundary." If the theory can't distinguish interpreting a rule from changing it, it can't detect capture via interpretation. Non-negotiable.

