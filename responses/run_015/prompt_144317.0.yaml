      *   Need to derive requirements from the *purpose*: distinguishing amendment from capture.
      *   *Requirement A: Identity Conditions.* The theory must distinguish between modifying a system and replacing it. (Links to Case 9).
      *   *Requirement B: Procedural Atomicity.* The theory must define what constitutes a single "act" of amendment to handle packages and sequences. (Links to Case 3 & 4).
