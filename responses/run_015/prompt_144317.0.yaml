      *   *Case 3 & 4:* User suspects they are the same. Case 3 is logical interdependence; Case 4 is topological evasion. They test the "unit of analysis." I should agree they test the same requirement (Atomicity/Unit of Amendment) but via different mechanisms.
      *   *Case 6:* The Façade. This is the Interpretive Boundary. Crucial.
      *   *Case 7:* Validity vs. Efficacy. This is the "Rule of Recognition" problem. For *capture detection*, efficacy matters more than validity.
      *   *Case 9:* Systemic Identity. This is the core "Revolution vs. Amendment" distinction.

  5.  **The Jointly Unsatisfiable Subset (The Paradoxes):**

      *   User's candidates:
          1.  Authorization vs. Change of Criterion.
          2.  Determinate Verdict vs. Genuine Gaps.
          3.  Content-Neutrality vs. Entrenchment.
          4.  Symmetry vs. Irreversibility.
      *   *Analysis:*
          *   (1) is the "Paradox of Sovereignty." If the rule authorizes everything, it can authorize its own destruction (capture). If it doesn't, it's not sovereign.
          *   (3) & (4) are related. If you can entrench, you limit future sovereignty. If you can't, you can't prevent capture.
          *   *The Real Impossibility:* **Content-Neutrality vs. Entrenchment.** If the amendment power is unlimited (content-neutral), it cannot be limited (entrenched). If it is limited, it is not unlimited. This is a logical contradiction in terms of *legal* validity within a closed system.
          *   *Advice:* For *capture detection*, drop **Content-Neutrality**. You *need* the capacity to entrench a core to define capture. If everything is amendable, "capture" is just "amendment." To detect capture, you must assume some things *cannot* be legitimately changed.

