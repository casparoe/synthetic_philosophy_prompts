answer: |-
  ### I. The Requirements List for a Theory of Self-Amendment

  To serve as a stress-test for *capture* (the illicit transformation of the institution) rather than mere *amendment* (the licit transformation of rules), the theory must prioritize continuity and identity over pure formal validity.

  | Requirement | Classification | Justification & Notes |
  | :--- | :--- | :--- |
  | **1. Systemic Identity Conditions** | **Non-Negotiable** | The theory must specify criteria for when a set of changes constitutes a modification of the *existing* system versus the creation of a *successor* system. Without this, "capture" cannot be distinguished from "revolution." |
  | **2. Interpretive Boundary** | **Non-Negotiable** | The theory must distinguish between the *application/interpretation* of a rule and the *amendment* of a rule. If every interpretation is an amendment, the amendment procedure is bypassed; if no interpretation is an amendment, the text is inert. |
  | **3. Procedural Atomicity** | **Non-Negotiable** | The theory must define what constitutes a single "act" of amendment. It must determine whether logically interdependent changes (packages) or sequential reclassifications count as one unit or many. |
  | **4. Efficacy Threshold** | **Non-Negotiable** | For *capture detection*, the theory must link formal validity to official observance. A formally valid rule universally ignored is not a tool of governance; an invalid rule universally enforced is a capture. Pure validity is insufficient. |
  | **5. Temporal Coherence** | **Negotiable** | The theory should handle retroactivity and self-reference in time, but a definitive solution is less critical than knowing *that* a temporal paradox exists. Gaps here signal vulnerability. |
  | **6. Competence/Content Distinction** | **Non-Negotiable** | The theory must distinguish between *who* is authorized to amend (competence) and *what* may be amended (content). Capture often masquerades as a competence move that alters content constraints. |
  | **7. Entrenchment Gradient** | **Preference** | The theory should represent entrenchment as a gradient (thresholds) rather than a binary (amendable/unamendable). This allows detection of "slow capture" via raising thresholds. (Note: This is a preference for *detection sensitivity*, not logical necessity). |
  | **8. Symmetry of Reversibility** | **Preference** | The theory should ideally treat entrenching and dis-entrenching symmetrically. However, this conflicts with the need for irreversible commitments (see Section III). |

  **Merging and Splitting Notes:**
  *   **Cases 3 & 4 (Package vs. Renumbering):** You suspected these were the same requirement. You are correct. Both test **Procedural Atomicity (Req 3)**. Case 3 tests logical interdependence; Case 4 tests topological evasion. Both ask: "What is the minimum unit of valid change?"
  *   **Case 7 (Validity vs. Efficacy):** You asked if this belongs to a different theory. For your purpose (detecting capture), it **must** be included here. A theory that ignores efficacy cannot detect a *coup* that follows the forms but ignores the substance. I have split this into **Efficacy Threshold (Req 4)**.
  *   **Case 9 (Systemic Identity):** This is not merely a case; it is the foundation of **Systemic Identity Conditions (Req 1)**. It is the primary requirement.

  ---

  ### II. Analysis of Your Case Studies

  1.  **The Entrenchment Ladder:** *Correction:* A theory need not represent degrees to be valid, but to detect *capture*, it must. Capture often proceeds by raising thresholds until amendment is practically impossible. If the theory treats "unamendable" as a binary switch, it misses the approach.
  2.  **Self-Ratifying Franchise Shift:** This is the ordinary case seen clearly. It tests **Systemic Identity**. If the body changes itself, does the system persist? The theory must answer whether the *source* of authority moved or merely the *agent*.
  3.  **The Mutually Dependent Package:** Correct classification. This tests **Procedural Atomicity**. If the theory evaluates acts sequentially, one half will always fail. The theory must allow for simultaneous validity conditions.
  4.  **The Renumbering Gambit:** As noted above, this is **Procedural Atomicity** via evasion. It tests whether the theory looks at the *effect* of the change or merely the *form*.
  5.  **Retroactive Self-Illegalization:** This tests **Temporal Coherence**. A theory that allows a rule to invalidate its own birth creates a truth-value gap. For your purpose, this gap *is* the signal of capture.
  6.  **The Façade:** You identified this as the hardest case. It grounds **Interpretive Boundary**. The requirement is not to solve the hermeneutic circle, but to establish a *convention* for when interpretation becomes substitution.
  7.  **Invalid but Effective / Valid but Inert:** This grounds **Efficacy Threshold**. A theory of *amendment* can ignore this; a theory of *capture* cannot. You must treat efficacy as a constitutive element of validity for this specific checklist.
  8.  **The Penalized Motion:** This tests **Competence/Content Distinction**. If a motion to amend is a violation, the amendment power is logically nullified. The theory must classify this as a "self-destruct" clause, signaling a move toward capture or dissolution.
  9.  **Systemic Identity:** This grounds **Systemic Identity Conditions**. The theory needs a criterion for succession. It cannot be purely internal (as the internal rules are what changed), nor purely external (as you need to judge internal moves). It requires a hybrid criterion.

  ---

  ### III. The Jointly Unsatisfiable Subset

  You listed four tensions. Only one is a logical impossibility; the others are tensions manageable by prioritization.

  **The Real Impossibility: Content-Neutrality vs. The Capacity to Entrench a Core.**
  *   **The Argument:** If the amendment power is content-neutral (unlimited in what it may change), it cannot validly produce a rule that limits content (entrenchment). If it can produce entrenchment, it was not content-neutral to begin with. You cannot have a sovereign power that is both absolutely unlimited and capable of binding itself absolutely.
  *   **The Tension:** Authorization vs. Change of Criterion is a paradox, but solvable by distinguishing *legal* continuity from *political* fact. Determinate Verdict vs. Gaps is a limitation of formal systems (Gödel), not a contradiction of purpose. Symmetry vs. Irreversibility is a policy choice.
  *   **Recommendation:** Given your purpose is **detecting capture**, you must drop **Content-Neutrality**.
      *   *Reasoning:* To detect capture, you must assume there is *something* that cannot be legitimately changed (the core identity). If the amendment power is content-neutral, any change is legitimate by definition, and "capture" becomes a meaningless term. You require the capacity to entrench a core to define the boundary of the institution.

  ---

  ### IV. The Exclusionary Requirement & Family Scoring

  **The Single Requirement That Excludes the Largest Share of Accounts:**
  **Systemic Identity Conditions (Req 1).**
  Most formal accounts assume continuity is automatic if procedure is followed. Most sociological accounts assume continuity is automatic if power is held. A theory that demands a specific criterion for *when identity is lost* excludes almost all standard models, which take identity for granted.

  **Scoring the Three Families:**

  1.  **Ultimate Rule Accounts (Presupposed Foundation):**
      *   *Shape:* A pyramid resting on an invisible peg. Validity flows down from a postulated basic norm.
      *   *Score:* Fails **Systemic Identity**. If the basic norm shifts, the theory declares a revolution, not capture. It cannot distinguish a hostile takeover from a new state.

  2.  **Official Practice Accounts (Social Fact):**
      *   *Shape:* A circle of mutual recognition among actors. Validity is what is treated as valid.
      *   *Score:* Fails **Interpretive Boundary**. If officials treat an interpretation as an amendment, the theory must agree. It cannot critique the *Façade* because efficacy defines validity.

  3.  **Stratified Level Accounts (Type Theory):**
      *   *Shape:* An infinite ladder. Rules about rules are always one rung higher.
      *   *Score:* Fails **Procedural Atomicity**. It forbids self-reference entirely. It cannot model the *Entrenchment Ladder* or *Self-Ratifying Franchise* without declaring them nonsense, rendering it useless for detecting sophisticated capture.

  ---

  ### V. What This Theory Should Not Be Asked To Do

  1.  **It should not determine moral justice.** A capture can be morally good (overthrowing a tyranny) and an amendment can be morally bad. The theory must identify the *structural* breach, not the ethical one.
  2.  **It should not predict stability.** A system can be theoretically coherent and collapse tomorrow. The theory diagnoses the *legitimacy of the move*, not the durability of the outcome.
  3.  **It should not solve the ultimate origin.** The theory cannot explain where the first amendment rule came from without infinite regress. It must take the initial state as a given brute fact and measure deviation from *that*, not from an abstract ideal.
