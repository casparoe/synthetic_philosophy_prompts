answer: |-
  Your hypothesis is correct, but it requires sharpening to explain why the standoff is resistant to your substitutional symmetry condition. The dispute is not merely verbal, nor is it a hidden empirical question waiting for better data. It is a **methodological disagreement about individuation conditions for scientific kinds.**

  Specifically, the freeze occurs because the two sides are operating with incompatible criteria for what counts as a *constituent* of a mechanism versus what counts as a *contextual condition*. Your symmetry condition, while rigorous, inadvertently replicates the very ambiguity that sustains the deadlock.

  Here is the diagnosis of the standoff and the assessment of your proposed construction.

  ### 1. The Diagnosis: Mechanistic Constitution vs. Functional Realization

  You suggest the dispute is about whether "cognitive" names an explanatory kind or a functional role. This is accurate, but in the philosophy of cognitive science, this maps onto a specific tension between **New Mechanism** accounts and **Functional Role** accounts.

  *   **The Critic (Intracranialist)** operates with a **Mechanistic Constitution** view. For them, a component is cognitive only if it is part of the *mechanism* that produces the phenomenon. In mechanistic philosophy (e.g., Craver, Kaplan), constituents are distinguished from background conditions by **mutual manipulability**. However, Critics argue that mutual manipulability is necessary but not sufficient; the component must also share the *right kind of physical organization* (e.g., neural processing) to be part of the *same* mechanism. To them, the notebook is a background condition (like the lighting in the room): manipulating it changes the output, but it is not *constitutive* of the cognitive mechanism itself.
  *   **The Proponent (Extensionalist)** operates with a **Functional Realization** view. For them, cognitive states are defined by their causal role in a control loop. If an external resource plays the same causal role as an internal process, it realizes the same functional state. They treat the mechanism as a **black box** defined by input-output transformations and internal feedback loops, regardless of the substrate.

  **The Standoff:** The Critic demands a **Mark of the Cognitive** that tracks *mechanism type* (neural activity). The Proponent demands a **Mark of the Cognitive** that tracks *computational role* (information access and manipulation). Because "cognitive" is being asked to do two different jobs (identifying a biological mechanism vs. identifying a control function), no single criterion can satisfy both without begging the question.

  ### 2. Why Your Symmetry Condition Fails to Break the Freeze

  Your **Substitutional Symmetry Condition** (SSC) states: *A component is constitutively involved if manipulation of its outputs produces the same change in task performance as manipulation of an intracranial component, and conversely.*

  This is effectively a formalization of the **Mutual Manipulability Criterion** (MMC) used in mechanistic explanation. However, it fails to move the debate for a structural reason: **The Critic distinguishes between Causal Relevance and Constitutive Relevance.**

  *   **The Critic's Counter:** The SSC establishes *causal relevance*. If I remove the notebook, Otto fails (like a hippocampal lesion). If I remove the hippocampus, Otto fails (like losing the notebook). But the Critic argues this only shows the notebook is *causally necessary* for the task, not *constitutively part* of the cognition.
      *   *Analogy:* If I remove the power grid, a computer stops computing. The power grid satisfies a symmetry condition with the CPU (no power = no compute; no CPU = no compute). But the power grid is not part of the *computation*; it is a background condition. The Critic treats the notebook as the power grid, not the CPU.
  *   **The Proponent's Counter:** The Proponent accepts the SSC but argues the Critic's distinction between "causal" and "constitutive" is arbitrary when the coupling is tight enough. However, by accepting the SSC, the Proponent concedes that *any* tightly coupled resource counts. This leads to the "cognitive bloat" objection (is the internet cognitive?), which forces the Proponent to retreat to "integration" criteria anyway.

  Thus, the SSC does not solve the problem because it does not address the **Integration Threshold**. It establishes equivalence of *impact*, but not equivalence of *incorporation*.

  ### 3. What Kind of Standoff Is This?

  It is a **Difference about the Standards a Theorized Kind Has to Meet**, specifically regarding **Explanatory Specificity**.

  *   **The Intracranialist Standard:** A kind is "cognitive" if grouping these phenomena together reveals *neural* generalizations. If including the notebook obscures the neural learning rules or error patterns, it fails the standard.
  *   **The Extensionalist Standard:** A kind is "cognitive" if grouping these phenomena together reveals *behavioral* or *system-level* generalizations. If treating the notebook as memory predicts Otto's behavior better than treating it as input, it meets the standard.

  The disagreement is frozen because neither side can prove their standard is the *correct* one without already assuming their conclusion.
  *   If you assume the goal of cognitive science is to explain neural computation, the Intracranialist wins.
  *   If you assume the goal is to explain adaptive behavior in complex environments, the Extensionalist wins.

  This is not a verbal dispute because the choice of standard dictates experimental design, funding, and modeling practices. It is a **Kuhnian disagreement about the paradigm's explanatory targets.**

  ### 4. What Counts as Progress?

  Given this diagnosis, a formal criterion (like your SSC) will not work, because formal criteria cannot adjudicate between competing explanatory goals. An experiment will not work, because the dispute is about how to *describe* the data, not what the data *is*.

  Progress requires **Reframing the Question** in two specific ways:

  **A. Shift from Binary Boundaries to Gradients of Integration**
  The "Is it cognitive?" question assumes a binary switch. Progress lies in adopting a framework where "cognitive" is a matter of degree based on **reciprocal causality** and **system-wide dynamics**.
  *   Instead of asking "Is the notebook part of the mind?", ask "To what degree is the agent-notebook system behaving as a single, self-regulating unit compared to the agent-alone system?"
  *   This allows for the "Integration" turn (e.g., Kiverstein, Kirchhoff). The "Mark of the Cognitive" becomes a set of criteria for *integration* (e.g., informational transparency, individualization, trust) rather than a boundary line. This dissolves the binary standoff by allowing a component to be *more or less* constitutively involved.

  **B. Shift from Ontology to Explanatory Gamble**
  Stop asking what the mind *is* and start asking which framing yields **novel predictions**.
  *   The "Empirical Equivalence" charge is the strongest weapon against EMT. Progress requires identifying cases where the Extended hypothesis predicts a *breakdown pattern* or *learning trajectory* that the Intracranial hypothesis does not.
  *   *Example:* If the notebook is truly constitutive, does "damage" to the notebook (e.g., reorganizing its pages) produce interference effects analogous to neural retrograde amnesia? If the Intracranialist says "No, that's just data loss," and the Extensionalist says "Yes, that's memory reorganization," an experiment could distinguish them.
  *   Progress is made when one side can point to a phenomenon that is *invisible* under the other's framing. (Currently, both sides claim to explain the same data, which is why the debate is frozen).

  ### Summary

  Your hypothesis that the dispute is about the theoretical role of "cognitive" is correct. The standoff persists because the **Substitutional Symmetry Condition** addresses causal relevance, while the Critics demand constitutive relevance based on mechanism type.

  **Diagnosis:** A methodological clash over individuation standards (Neural Mechanism vs. Functional Control).
  **Progress:** Abandon the search for a binary boundary. Adopt a **gradient of integration** and demand **explanatory specificity** (predictions about error/learning unique to the extended framing). If the extended framing cannot predict something the intracranial framing cannot, the debate will remain frozen, and the "cognitive" predicate will likely retreat to its intracranial default for pragmatic reasons, leaving "extended" as a metaphor for coupling rather than a literal ontological claim.
