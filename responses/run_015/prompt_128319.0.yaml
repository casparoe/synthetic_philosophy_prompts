answer: |-
  # Joint Statement on Stances and Patterns

  **Prepared for the End-of-Term Philosophy Zine**

  ### Introduction
  Over this term, we have debated the status of Daniel Dennett's three stances: the **Physical Stance** (predicting behavior from physical laws and constitution), the **Design Stance** (predicting from assumed function), and the **Intentional Stance** (predicting by attributing beliefs and desires to a rational agent).

  We agree on what these stances *do*. We disagree on what they *are*. One of us (the **Pattern Realist**) argues that successful patterns of belief and desire are real features of the world. The other (the **Instrumentalist**) argues that these patterns are useful tools for limited minds, but only physical parts are fundamentally real.

  To make this dispute exact without becoming unreadable, we have defined our terms, established our common ground, and designed three test cases.

  **Key Definition:** By **compression**, we mean describing a large amount of data using a shorter set of rules or symbols. If you can describe a million events using ten rules, you have compressed the data. High compression implies there is order, not just noise.

  ---

  ### Section I: Claims We Both Accept
  1.  **Utility:** The Intentional Stance is highly effective. Attributing beliefs and desires allows us to predict the behavior of humans, animals, and some machines better than chance.
  2.  **Supervenience:** There is no change in beliefs or desires without some change in the physical state. The mental depends on the physical.
  3.  **Ideal Physics:** In principle, a being with infinite computing power and perfect knowledge of physical laws could predict all behavior using only the Physical Stance.
  4.  **Human Limits:** Beings with our computational limits cannot use the Physical Stance for complex systems (like humans) because the calculation is too vast.
  5.  **Objectivity of Success:** Whether a prediction works is not a matter of opinion. A prediction either matches the outcome or it does not.

  ---

  ### Section II: The Three Test Cases
  We propose these three scenarios to clarify where our disagreement lies.

  **Case 1: The Rebuilt Glider**
  Imagine a grid of cells (like a digital screen) where a shape travels from left to right. As it moves, every single cell that makes up the shape turns off and is replaced by a new cell turning on.
  *   **The Physical Story:** Tracks the state of every individual cell at every moment.
  *   **The Pattern Story:** Tracks "The Glider" as a single object moving across the grid.
  *   **The Question:** Is the Glider the same thing over time? Does the pattern story pick out something the physical story misses (a persistent object), or does it just summarize the cell changes?

  **Case 2: Twin Compressors**
  Imagine a stretch of behavior that can be compressed equally well by two different schemes of equal simplicity.
  *   **Scheme A:** Describes the behavior as one agent with beliefs about locations.
  *   **Scheme B:** Describes the behavior as two sub-agents negotiating, or as blind attractions and aversions without beliefs.
  *   **The Question:** Since both schemes compress the data equally well but describe incompatible units (one agent vs. two, or beliefs vs. forces), is there a fact about which carving is the real one? Or does "pattern-hood" become hostage to the choice of compressor, especially since different schemes might disagree on any finite amount of data?

  **Case 3: The Matched-Budget Prediction Match**
  Two predictors are given the same computing budget and the same training data.
  *   **Predictor 1:** Allowed to use the Intentional Stance (belief/desire attribution).
  *   **Predictor 2:** Restricted to the Physical Stance (microphysical laws).
  *   **The Test:** They are scored on held-out behavior (data they haven't seen).
  *   **The Question:** We must record in advance what result counts for whom. What if the Physical Predictor wins only after being given vastly more computing power? What if the Intentional Predictor wins on equal budget but loses on infinite budget?

  ---

  ### Section III: Table of Disagreements
  Below, we state our disagreements in wording each side accepts. For each crux, we list the argument or case that bears on it and each side's prediction.

  | The Crux | Pattern Realist Position | Instrumentalist Position | Bearing Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Patterns** | When a short description of beliefs predicts a long stretch of behavior with nothing left over, that pattern is a real feature of the world, not a projection. | Compression is always by some scheme. Any data can be made orderly by one scheme and disorderly by another. Patterns are instruments for creatures with our limits. | **Case 1 (Glider):**<br>**Realist:** The Glider is real because the pattern persists despite cell replacement.<br>**Instrumentalist:** The Glider is a summary. Only the cells are real. |
  | **2. Truth of Belief** | A belief-ascription can be simply true. It explains behavior better than microphysical stories because it captures the causal structure that matters. | Belief-talk is a convenient fiction. A prediction from the Physical Stance would in principle do all the work without fiction. | **Case 2 (Twin Compressors):**<br>**Realist:** One scheme must map better to causal powers; reality selects the winner.<br>**Instrumentalist:** If both work equally well, there is no fact of the matter. Choice is pragmatic. |
  | **3. The Role of Limits** | The fact that we *need* the Intentional Stance due to limits shows that the pattern is the accessible reality for agents like us. | The fact that we *need* the Intentional Stance proves it is a workaround for weakness, not a discovery of truth. | **Case 3 (Budget Match):**<br>**Realist:** If Intentional wins on equal budget, it identifies real structure.<br>**Instrumentalist:** If Physical wins on infinite budget, it proves physics is the only truth. |

  ---

  ### Section IV: Is This Just About the Word "Real"?
  We have analyzed our quarrel and agree that a significant portion of it is verbal. Specifically, it hinges on the definition of **real**.

  *   **The Instrumentalist** uses "real" to mean **fundamentally physical**. For them, if something can be reduced to particles and laws, only the particles are real. The pattern is just a shadow.
  *   **The Pattern Realist** uses "real" to mean **objectively there**. For them, if a pattern exists independently of our whim and supports prediction, it is real, even if it is made of physical parts.

  **Where we are not just arguing about words:**
  The dispute is not *only* verbal because it affects how we build systems and interpret data. If the Realist is right, we should search for belief-structures in AI as if they are natural kinds. If the Instrumentalist is right, we should treat AI belief-talk as purely metaphorical, regardless of how well it predicts.

  However, if we agree that "real" simply means "indispensable for prediction given our limits," the disagreement vanishes. The Instrumentalist refuses this definition because they want "real" to reserve honor for the bottom level of physics. The Realist refuses because they think emergent levels have their own authority.

  ---

  ### Section V: What Would Actually Move Us
  To end this term productively, we specify what evidence would change our minds.

  **What would move the Pattern Realist:**
  1.  **Failure of Compression:** If we find systems that behave rationally but where no stable pattern of beliefs can be found (the pattern dissolves under scrutiny).
  2.  **Superior Physical Prediction:** If, in **Case 3**, the Physical Predictor matches the Intentional Predictor's accuracy on an *equal* computing budget. This would show the pattern adds no efficiency and thus no unique reality.

  **What would move the Instrumentalist:**
  1.  **Impossible Physics:** If the Intentional Stance predicts something that the Physical Stance cannot, even with infinite computing power (though we agree this is unlikely).
  2.  **Scheme Independence:** If, in **Case 2**, it can be shown that one compression scheme is forced by the data itself, regardless of the observer's choice. If the world *dictates* the belief-attribution rather than the user, the Instrumentalist must admit the pattern is not just a tool.
  3.  **Semantic Concession:** If the Instrumentalist agrees to use the word "real" for any pattern that is stable across different observers, they effectively become a Realist. If the Realist agrees that "real" implies "fundamental physical constituent," they become an Instrumentalist.

  **Conclusion**
  We submit this document not as a resolution, but as a map. We agree on the terrain (the stances, the data, the limits). We disagree on the legend (what counts as real). We hope the readers of this zine find the map useful, even if we are still walking different paths.

  **Signed,**

  The Pattern Realist & The Instrumentalist
