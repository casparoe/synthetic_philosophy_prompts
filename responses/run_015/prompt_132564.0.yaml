answer: |-
  The rain battered the cafe window, blurring the London streetlights into smeared streaks of amber. Jules stirred their tea, the spoon clinking against the china, before looking across the table at Mara.

  'Your workshop was polished, I'll give you that,' Jules began, their tone measured but sharp. 'But you've essentially taken Epictetus's dichotomy of control and severed the head from the body. You're keeping the tool while discarding the metaphysics that made it viable.'

  Mara leaned back, wrapping her hands around her mug. 'I'm keeping what works, Jules. People come to me because they're anxious, not because they want to debate celestial physics. The dichotomy functions as a behavioural filter. You separate what you can influence from what you can't. It doesn't require a providential Logos to make that distinction useful.'

  'But it does require it to make the distinction true,' Jules countered, leaning forward. 'For Epictetus, the boundary between what is "up to us" and what isn't wasn't arbitrary. It was grounded in a cosmos ordered by divine reason. Our prohairesis—our moral choice—was the only thing truly ours because it was the only fragment of the divine within us. Without that cosmic context, why is the line drawn exactly where you draw it?'

  'Because that's where my agency ends,' Mara said simply. 'I can control my intentions, my judgements, my actions. I cannot control the traffic, the weather, or other people's opinions. That boundary is empirical, not theological.'

  'Is it?' Jules pressed, tapping the table. 'In a chaotic, indifferent universe, are your actions truly "up to you" in the way Epictetus meant? If there is no causal chain leading to a benevolent outcome, if there is no Nature guiding things, then your "control" is just a temporary illusion of power in a vacuum. You're telling people to focus on their internal state because the external world is meaningless. That isn't Stoicism; that's just relabelling powerlessness as wisdom.'

  Mara sighed, brushing a stray hair from her face. 'It's not about meaninglessness. It's about bandwidth. Human cognitive capacity is limited. If I spend my mental energy worrying about the macro-economic factors influencing my job security, I have less energy to actually perform well in my role. The dichotomy is a triage system. I draw the line at immediate agential focus because that is where leverage exists.'

  'But why immediate?' Jules asked, eyes narrowing slightly. 'Why not draw the line further out? If I campaign hard enough, I can influence politics. If I save money, I can influence my future security. By restricting "control" only to your current judgement, you're encouraging a kind of quietism. You're teaching people to accept the status quo because they've been convinced everything outside their skull is immutable.'

  'I'm teaching them not to break their minds against reality,' Mara replied, her voice firming. 'There's a difference between planning and worrying. Planning is actionable; worrying is ruminating on outcomes. The metaphysical backbone you're mourning? It's a barrier to entry for most people. If I tell a client they need to believe in a benevolent cosmic fate to manage their anger, they'll walk out. If I tell them to focus on their response rather than the trigger, they get relief.'

  'Relief isn't the goal of Stoicism, though. Virtue is,' Jules insisted. 'And virtue requires understanding your place in the whole. If you strip away the idea that we are citizens of a cosmic city, governed by a rational law, then the dichotomy becomes solipsistic. You're left with a lonely mind trying to curate its own reactions in a hostile void. That's not resilience; that's isolation.'

  'Or maybe it's the only form of resilience available to a secular age,' Mara suggested. 'Look, I'm not claiming to be a historian. I'm running a programme to help people function. The "metaphysical backbone" often feels like fatalism to modern ears. They hear "cosmic fate" and think "why bother trying?" My version flips that. It says: "The universe might be chaotic, but you are the captain of this specific vessel."'

  'But without the cosmos, you don't know if the vessel is worth steering,' Jules said softly. 'Epictetus knew that suffering had a place in the grand design. It was gymnastics for the soul. In your model, suffering is just noise to be filtered out. You've turned a philosophy of life into a cognitive behavioural technique.'

  Mara paused, considering this. 'Perhaps I have. But CBT saves lives. It centres the individual where they actually live: in their own nervous system. If I need to borrow the Stoic label to give that technique historical weight, I will. The boundary I draw is where suffering becomes unproductive. That's my metric. Not truth, but utility.'

  'And that's where we diverge,' Jules said, sitting back. 'For me, philosophy is about aligning with truth, even if it hurts. If the dichotomy of control relies on a lie—that we are isolated agents in a disconnected world—then it's a fragile tool. When the real tragedy hits, when the "control" you think you have is revealed as an illusion, the whole structure collapses.'

  'Maybe,' Mara conceded, picking up her coat. 'But until then, it helps people sleep at night. You can keep the Logos, Jules. I'll keep the behaviour.'

  Jules watched her stand, a small, melancholic smile touching their lips. 'You're keeping the shadow, Mara. Just don't be surprised when the sun moves and it disappears.'

  'Then I'll teach them to find light indoors,' Mara said, opening the door to the rain. 'See you next week.'
