answer: |-
  You have identified a genuine gap in the literature. While pieces of this are discussed in tourism economics (price inflation), development ethics (aid dependency), and social ontology (norm emergence), there is no single canonical term that isolates the specific mechanism you're describing: *a transient agent over-contributing to a local equilibrium, triggering a threshold shift that harms locals who remain.*

  The closest existing concepts are **normative externalities** (where an action changes the social cost/benefit structure for others) and **reference dependence** (where expectations adjust to new baselines). However, these miss the crucial element of *transience*—the fact that the agent who shifts the baseline exits before bearing the cost of the new equilibrium.

  Since you asked for a carving, I will coin a term that captures the mechanism, the agent, and the irreversibility.

  ### The Term: **The Transient Norm Ratchet**

  **Definition:** A social dynamic in which transient agents, insulated from long-term local consequences, act on external norms that shift a local baseline (price, wage, behavior) past a critical threshold. Once shifted, the new baseline becomes self-reinforcing for resident agents, who must now operate under rules they did not choose and cannot easily reverse, while the initiating agents have already exited.

  ### The Carving (Why this is distinct)

  To satisfy your request for separation from existing categories, here is the specific topology of the Transient Norm Ratchet:

  1.  **Vs. Complicity:** Complicity requires joining an *existing* harmful practice. In the Ratchet, the harm (the new expectation) *does not exist* until the visitor acts. The visitor is not joining; they are **igniting**.
  2.  **Vs. Inefficacy (The "Drop in the Bucket"):** Inefficacy arguments claim one act changes nothing. In the Ratchet, every act *does* matter because the system is near a threshold. The moral puzzle isn't "does this do anything?" but "do I know where the threshold lies?"
  3.  **Vs. Free Riding:** Free riding is taking a benefit without paying. This is **over-paying** in a way that devalues the currency of the local system (whether that currency is money or social expectation).
  4.  **Vs. General Threshold Dynamics:** Standard tipping point models (e.g., Schelling's segregation) usually involve all agents playing the same game. The Ratchet specifically requires **two classes of agents**: Transients (who shift the norm) and Residents (who inherit the norm). The asymmetry of accountability is the defining feature.

  ### Addressing Your Edge Cases

  **1. Does it matter that the visitor leaves?**
  **Yes.** This is the structural linchpin. If the visitor stays, they become a resident. They would then suffer the inflation they caused (higher prices) or the social pressure they created (expected tipping). The moral friction arises from **asymmetric accountability**: the power to change the rules without being bound by them long-term. If they don't leave, it's just standard norm evolution. If they leave, it's a Ratchet.

  **2. Does visibility matter? (e.g., app tipping)**
  **No.** The mechanism is not peer pressure among customers; it is **recipient expectation adjustment**. If the barista receives enough app tips to expect them, the norm shifts internally within the labor market, regardless of whether other customers see the transaction. The "audience" is the local ecosystem, not the other tourists.

  **3. What if the exported norm is "better"? (Queuing vs. Crowding)**
  This reveals that the Transient Norm Ratchet is a **causal mechanism**, not inherently a moral condemnation.
  *   **Case A (Tipping):** The ratchet creates a cost (inflation/wage dependency) without local consent.
  *   **Case B (Queuing):** The ratchet creates a benefit (order/safety) that locals adopt.
  *   **The Distinction:** We praise the queuing visitor not because the *mechanism* is different, but because the **outcome** aligns with local welfare *and* usually requires less ongoing cost to maintain. However, even "good" ratchets can be paternalistic. If visitors force a queuing system that disrupts a local social bonding ritual inherent in the crowd, they have still imposed a cost. The valence depends on whether the new norm serves the *residents'* interests, not the *visitors'* moral comfort.

  **4. Is there anything owed afterwards?**
  If a visitor triggers a negative Ratchet (e.g., price inflation), they have effectively imposed a **tax** on the locals without representation. In strict moral terms, if the visitor *knows* or *should know* they are near the threshold, they incur a debt of **restitution** (compensation) or **restraint** (not returning). You cannot ethically break a system and leave the repair bill for those who didn't break it.

  ### The Core Question: Moral Category or Causal One?

  You asked: *"Is this a moral category at all, or just a causal one that we only notice when we disapprove of the norm that got exported?"*

  It is **both**, but the moral weight comes from the **epistemic asymmetry**, not just the outcome.

  If it were purely causal, we would judge it solely on consequences (Utilitarianism). If tipping makes locals richer, it's good; if it makes goods unaffordable, it's bad. But our intuition suggests something else is wrong even if the short-term consequence is "staff get more money."

  The moral category exists because of **Consent and Accountability**.
  *   **Consent:** The locals did not vote to shift to a tipping economy. It was imposed by agents who cannot be held to account for the long-term maintenance of that economy.
  *   **Accountability:** The visitor enjoys the "warm glow" of generosity without facing the "cold shock" of the resulting inflation.

  Therefore, the Transient Norm Ratchet is a **procedural injustice**. It is a violation of **self-determination**. Even if the exported norm is objectively "better" (e.g., refusing bribes), doing so unilaterally as a transient agent bypasses the local community's right to negotiate their own institutional evolution.

  **The Verdict:**
  It is a moral category because it involves **imposing risk without bearing cost.**
  *   If you tip and leave, you have gambled with the local economic stability using chips you don't have to cash in later.
  *   If you queue and leave, you have gambled with the local social order.

  We praise the queuer and blame the tipper mostly because we intuitively assess the *risk* of the new norm. Queuing rarely creates a dependency trap; tipping often does. But the *structural wrong* is identical: **The Unanchored Precedent.**

  ### Summary Definition for Your Use

  > **The Transient Norm Ratchet:** A phenomenon where transient agents, insulated from long-term local consequences, introduce external behaviors that shift a local normative or economic baseline past a point of no return. The moral distinctiveness lies not in the behavior itself, but in the **asymmetry of accountability**: the initiator exits before the new equilibrium stabilizes, leaving residents to bear the maintenance costs of a norm they did not select.

  This carving separates it from simple "cultural imperialism" (which implies intent) and "market distortion" (which implies pure economics). It captures the specific ethical friction of *well-meaning transience*.
