prompt: |-
  I'm preparing a podcast interview for a science-and-ideas audience with a philosopher who advances a revisionist reading of Samuel Scheffler's afterlife conjecture. Instead of treating extinction as a uniform deprivation of future lives, she distinguishes between open-ended collective projects—scientific inquiry, artistic traditions—whose value depends on indefinite continuation, and closure-dependent personal projects—raising a family, completing a specific work—whose value is largely realized within one lifespan. She argues that extinction harms the former through interrupted continuity and the latter through lost legacy and audience, and that this bifurcation shows Scheffler's collective-afterlife framing overstates how much individual meaning depends on distant strangers surviving. Draft eight to ten interview questions that avoid biography and summary. Include at least one that probes the asymmetry between saving a particular future child and preserving an open-ended tradition; one that presses her on the objection that closure-dependent projects are actually more vulnerable to extinction because they lose their witness or inheritor; and one that asks what argument or observation could convince her the conjecture applies symmetrically to both kinds. For each question, provide a brief follow-up keyed to the reply she is most likely to offer.
