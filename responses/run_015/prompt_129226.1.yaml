  7.  **Final Polish:** Check pacing and dialogue tags. Ensure the Plutarch references are accurate enough for a scholarly context (e.g., mentioning the *Lives* purpose in *Alexander*).

  *(Self-Correction Note on Plutarch)*: Plutarch actually says in *Alexander 1.2* that he is not writing history but lives, and that a slight thing often shows virtue or vice more than battles. This supports Vane. But he also includes flaws. This supports Thorne. I need to make sure they both use the text accurately to support their divergent readings.

  8.  **Final Review against constraints:**
