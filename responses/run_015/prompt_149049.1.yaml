    "false_presupposition_identified": "The assumption that only natural kinds (biological essences) can support valid causal inference, ignoring that socially constructed kinds can index real causal mechanisms.",
    "why_zodiac_analogy_fails": "Astrology lacks a causal mechanism, whereas cohort analysis indexes shared historical exposure during formative years (impressionable years hypothesis), which is a testable psychological and sociological mechanism.",
    "ontological_classification": "Interactive Kind",
    "role_of_apc_problem": "A statistical identification challenge requiring constraints or regularization, not proof of ontological invalidity; it complicates estimation but does not negate cohort effects.",
    "recommended_statistical_alternative": "Hierarchical Age-Period-Cohort (HAPC) models or continuous birth-year splines with period fixed effects."
  }
