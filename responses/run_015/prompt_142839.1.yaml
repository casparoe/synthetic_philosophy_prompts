answer: |-
  **Setting:** *The philosophy grad lounge. It's 4:30 PM on a Tuesday. The coffee machine is gurgling ominously. Alex is slumped in an armchair with a laptop; Jamie is pacing near the whiteboard, marker in hand.*

  **Jamie:** I can't shake that case from seminar. The "epistemic leveling" thing. If we're talking about welfare, leveling down feels wasteful. But if we're talking about *capacities*—like, literally reducing everyone's ability to do modal reasoning to the level of the least capable—it feels… malicious. Like sabotage.

  **Alex:** Right? Because welfare is experiential. If you level down welfare, people are just less happy. If you level down epistemic capacity, you're actively crippling their agency. That's why I'm sticking with prioritarianism. We apply a convex transformation to the distribution of capacities. We give moral weight to boosting the bottom without requiring us to chop the top.

  **Jamie:** But does that actually solve the egalitarian worry, or does it just hide it? Here's my problem: If you use convex weights, you're still aggregating. You're saying a unit of capacity gain for the low-end matters *more* than a unit for the high-end. But that assumes these capacities are fungible enough to be weighted against each other. Is "deliberative capacity" really a single metric you can apply a curve to?

  **Alex:** That's a fair hit. I'm treating "capacity" like a currency. But I don't need perfect fungibility. I just need to say that bringing someone up from incapacity to basic deliberative function is morally more urgent than enhancing an already brilliant reasoner. The convex curve captures that urgency without demanding we destroy the brilliance.

  **Jamie:** Okay, but here's where your view makes me nervous. If you refuse to level down, you're admitting that the *gap* itself isn't what's bad. Only the absolute level of the worse-off matters. But in a democracy, the gap *is* the problem. If I can't understand the arguments you're making because your modal reasoning is five standard deviations above mine, we aren't equals. We're in a ruler-subject relationship. Prioritarianism ignores the relational harm of the gap.

  **Alex:** I see that. But the Leveling-Down Objection kills the relational view if it's strict. If equality is intrinsically valuable, then a world where we're all equally incapable of understanding the budget is *in one respect* better than a world where some understand and some don't. You have to say that. Are you really willing to say a society of universal cognitive impairment is better *in some respect* than a mixed one?

  **Jamie:** *Pauses, caps the marker.* Honestly? That's the spot where my reasoning is weakest. I want to say "No, of course not, that's absurd." But if I say that, I'm not a strict telic egalitarian anymore. I'm a pluralist. I'm smuggling in a value judgment that capacity is good *independently* of equality.

  **Alex:** Exactly. And once you smuggle that in, you're basically a prioritarian. You care about the bottom, and you care about the total, but you weight the bottom heavier.

  **Jamie:** Not necessarily. I could say equality is a *constraint*, not a value to be maximized. Think of it like a floor and a ceiling. We raise the floor, but if the ceiling gets too high relative to the floor, it undermines the reciprocity needed for deliberation. So, yes, in extreme cases, I might have to support limiting the high end. Not by lobotomizing people, but by limiting the *political weight* of their epistemic advantage.

  **Alex:** Ah, so you're shifting from equality of *capacity* to equality of *power*.

  **Jamie:** Maybe. But if the capacity *creates* the power inevitably, then limiting the power requires limiting the expression of the capacity. Which feels like leveling down by proxy. Okay, let me turn it back on you. You're using convex weights on capacities. What happens at the margin? If my curve is steep enough, doesn't prioritarianism just collapse into egalitarianism anyway? If the moral value of giving a high-performer more capacity approaches zero, you're functionally forbidding inequality.

  **Alex:** *Rubbing temples.* That's… actually a serious worry. If the derivative of my weighting function flattens out completely for the well-off, then I can't justify any inequality that doesn't benefit the worst-off. That's basically the Difference Principle. And if I go steeper, I might prioritize a tiny gain for the bottom over a massive gain for the middle.

  **Jamie:** So you're vulnerable to the "bottomless pit" objection? You pour all resources into the person with the lowest epistemic capacity even if the cost is stalling everyone else's deliberative progress?

  **Alex:** Yeah. That's where the "epistemic" part makes it harder than welfare. With welfare, maybe there's a saturation point. With reasoning? It's hard to say someone has "enough" modal reasoning. If I admit that, my prioritarianism might demand we stop funding advanced logic seminars to fund basic literacy, forever.

  **Jamie:** And that's where I'd change my mind. If you can show me that prioritizing the bottom *actually secures* the relational equality I care about without stalling the collective epistemic progress, I'd drop the strict equality constraint. But I need to know you aren't just doing utilitarianism with a guilt tax.

  **Alex:** And I'd drop the convex weighting if I couldn't solve the measurement problem. This is the other place my reasoning is on thin ice. How do we compare "units" of modal reasoning interpersonally? Welfare is subjective; I can at least pretend we can compare self-reports. Capacity is objective but multidimensional. Maybe you're better at logic, I'm better at empirical synthesis.

  **Jamie:** Right. If interpersonal comparison of capacities is impossible in a way that breaks the prioritarian calculus, then your convex weights are just arbitrary numbers. You can't weight what you can't measure.

  **Alex:** Precisely. If I can't say "Student A's gain is 2 units" and "Student B's gain is 1 unit," I can't apply the weight. I'd have to switch to a threshold view. Sufficientarianism. Just get everyone to "deliberative competence."

  **Jamie:** Which brings us back to the gap. If everyone is competent, but some are geniuses, do we still have a justice problem?

  **Alex:** If the geniuses dominate the conversation? Yes. But that's not a distribution of capacity problem anymore. That's an institutional design problem.

  **Jamie:** Okay, here's my concession. If you can show that institutional design can neutralize the power imbalance caused by epistemic inequality, I don't need to level down the capacity. I can accept your prioritarianism *if* it's coupled with procedural safeguards.

  **Alex:** And my concession: If the convex weighting collapses into equality at the margin because the moral value of high-end capacity drops to near-zero, I have to admit I'm an egalitarian in practice. I need to justify why high-end capacity has *positive* moral value beyond just not being bad. Maybe because high-end reasoners solve problems that help the low-end?

  **Jamie:** Trickle-down epistemology?

  **Alex:** *Laughs.* Don't call it that. But yeah. Instrumental value. If the high-end capacity produces public goods that boost the bottom's absolute level, then the gap is justified.

  **Jamie:** So we're both contingent on empirical claims. I'm contingent on whether institutions can mitigate power imbalances. You're contingent on whether high-end capacity actually produces public goods that outweigh the relational harm of hierarchy.

  **Alex:** And we're both stuck on the measurement problem. If we can't quantify epistemic capacity, neither of our math works.

  **Jamie:** So the Leveling-Down Objection holds for me—I can't say a world of universal incompetence is better in any respect. And the Measurement Objection holds for you—you can't weight what you can't count.

  **Alex:** Looks like we're both dead in the water until we figure out how to measure modal reasoning without reducing it to test scores.

  **Jamie:** *Sips cold coffee.* Want to go get a beer and talk about something we can actually measure? Like how many pages we have left to write?

  **Alex:** Please. That's the only distribution I care about right now. Equal shares?

  **Jamie:** Equal shares. No leveling down.

  **Alex:** Deal.
