      *   **Task:** Draft a joint statement (adversarial collaboration) summarizing the term's debate on the Raven Paradox.
      *   **Context:** Nine meetings, split evenly and acrimoniously into two camps ("Degree Camp" vs. "Aboutness Camp"). Faculty adviser wants a single document signable by both.
      *   **Shared Starting Point:** Hypothesis $H$ (All ravens are black) $\equiv$ $\neg$Black $\rightarrow$ $\neg$Raven. Nicod's Criterion (only ravens matter) vs. Equivalence Principle (logically equivalent formulations confirmed equally). Paradox: They conflict.
      *   **Camp 1 (Degree):** Confirmation is degree (Bayesian shift). White shoe *does* confirm $H$, but negligibly. Equivalence holds. Nicod fails generally.
      *   **Camp 2 (Aboutness):** Confirmation is 3-place (Evidence, Hypothesis, Context/Question). White shoe doesn't confirm because it doesn't bear on the subject matter/question. Equivalence restricted or Nicod retained with proviso.
      *   **Testing Ground:** Two Urn Cases (A and B) proposed in Week 7.
          *   *Urn A:* 100 beads. 5 white (mix of shapes). Rest black (mix of shapes). Draw: White Shoe. $H^*$: All Ravens are Black.
          *   *Urn B:* 100 beads. Two machines. M1: All Black. M2: 50 White (mix of shapes), 50 Black. Draw: White Shoe.
          *   *Secretary's Conjecture:* The shift size isn't the key; it's about the generative process. Urn A = substantial confirmation. Urn B = disconfirmation.
      *   **Requirements:**
          1.  Numbered section of agreed claims (logic, urns, concessions). Signable without qualification.
          2.  Table of surviving disagreements (Issue, Degree wording, Aboutness wording, Verdict: Substantive/Verbal + stipulation).
          3.  3-5 Cruxes (sub-questions, accepted bearing, camp predictions, calculations if applicable).
          4.  Conditions for abandoning views (what would move the debate).
          5.  Closing paragraph on verbal disputes.
      *   **Constraints:** No adjudication/winner. No external citations/library access. 2-3 pages equivalent.

  2.  **Deconstruct the Urn Cases (Mental Check):**
      *   *Urn A:*
          *   Total: 100.
          *   White: 5. (Prob Raven-shape = 0.5, Shoe-shape = 0.5). So expected White Ravens = 2.5, White Shoes = 2.5.
          *   Black: 95. (Shape distribution unspecified, but irrelevant for $H^*$ unless a White Raven exists).
          *   $H^*$: All Raven-shaped beads are Black. (Equivalent to: No White Raven-shaped beads).
          *   Evidence $E$: White Shoe-shaped bead.
          *   Does $E$ confirm $H^*$?
          *   If I pull a White Shoe, that is one of the 5 White beads. It reduces the pool of *remaining* White beads from 5 to 4.
          *   The only way $H^*$ is false is if there is a White Raven in the urn.
          *   Prior to draw: There are 5 White beads. Each has 0.5 chance of being Raven. Prob(No White Ravens) = $0.5^5 = 1/32$.
          *   After drawing White Shoe: There are 4 White beads left. Each has 0.5 chance of being Raven. Prob(No White Ravens | White Shoe drawn) = $0.5^4 = 1/16$.
          *   $1/16 > 1/32$. Confirmation! And it's substantial (doubles the odds).
          *   *Secretary's point holds:* Here, non-raven evidence gives a *large* shift.
      *   *Urn B:*
          *   Machine 1 (M1): All 100 Black. ($H^*$ True).
          *   Machine 2 (M2): 50 White, 50 Black. Among 50 White, 0.5 Raven, 0.5 Shoe. ($H^*$ likely False).
          *   Prior: P(M1) = 0.5, P(M2) = 0.5.
          *   Evidence $E$: White Shoe.
          *   P(E | M1) = 0 (M1 makes all Black).
          *   P(E | M2) > 0 (M2 makes White Shoes).
          *   By Bayes, P(M1 | E) = 0. P(M2 | E) = 1.
          *   Since $H^*$ is true on M1 and likely false on M2, $E$ drastically *disconfirms* $H^*$.
          *   *Secretary's point holds:* Same observation, opposite direction depending on background knowledge about the process.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Joint Statement on the Raven Paradox."
      *   **Section 1: Agreed Claims.**
