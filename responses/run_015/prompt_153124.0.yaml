answer: |-
  Good evening. For those who do not know the game, imagine a simple auction. A single dollar bill is offered to the highest bidder. But there is a rule: the highest bidder wins the dollar, but the second-highest bidder must also pay their final bid... and gets nothing.

  For the specialists in the room, you know the mathematics of that trap. For the family and friends, you know the feeling of it. It is the moment you realize you have spent two dollars to win one, simply because you could not bear to lose the first. It is the logic of the argument that lasts too long, the project that should have ended years ago, the refusal to let go because so much has already been spent.

  Dr. Elena Vasquez has spent thirty-five years mapping the exact coordinates of that trap. And so, standing here to praise her career, I find myself in a precarious position. It would be deeply ironic to celebrate her persistence using the very language of the pathology she dissected. If I simply say, "She never gave up," I am praising the escalation of commitment. If I say, "She stuck with it no matter the cost," I am describing the sunk-cost fallacy.

  So, we must look closer at the bidding.

  In the early rounds of Elena's career, the bidding was rational. The value of the dollar—tenure, recognition, the thrill of discovery—was higher than the cost of the effort. This is the easy part of any career. But then, the bidding passed the dollar mark. The problems became harder. The data became messy. The easy answers evaporated.

  This is the moment where the auction turns dangerous. In the standard model, this is where rational actors become irrational. They bid not to win, but to avoid losing. They throw good resources after bad.

  But Elena's career demonstrates a crucial exception to the model. She did not stay in the game to defend a past investment. She stayed because she realized the object on the table was not a fixed dollar bill. It was understanding. And understanding is the only commodity that increases in value the more you pay for it.

  There is a fine line between stubbornness and dedication. Stubbornness is refusing to quit a losing position. Dedication is refusing to quit a question that still has answers. Elena navigated that line with a precision that humbled her colleagues and inspired her students. She knew the difference between a dead end and a difficult door.

  We have all seen colleagues burn out, trapped in the escalation of their own making, bidding higher and higher on prestige or vindication. Elena never did that. She bid on truth. And because truth has no fixed ceiling, her investment never became a sunk cost. It became a foundation.

  Now, we arrive at the end of the auction. The gavel is about to fall. Retirement is, in economic terms, a rational exit. It is the decision to stop bidding before the marginal cost exceeds the marginal return. But looking at Elena, I do not see someone walking away because the cost got too high. I see someone walking away because the lesson was complete.

  She leaves the table not because she ran out of chips, but because she taught the rest of us how to count them.

  To the family here: you lived with the late nights and the quiet obsessions. You know that her persistence was not about work; it was about integrity. To the scholars here: you know that her models did not just describe behavior; they preserved the possibility of rationality in a world prone to error.

  Elena, you spent a lifetime studying why people cannot let go. Tonight, we celebrate the fact that you knew exactly when to stop.

  You taught us that while costs may sink, wisdom always compounds.
