answer: |-
  # Diagnostic Taxonomy of Philosophical Views on Life

  This taxonomy classifies philosophical positions on the nature of life not by their self-applied labels, but by their necessary conditions and their verdicts on five borderline cases. The tree is structured to force a decision on the primary necessary condition at the root, then uses diagnostic cases to refine the specific philosophical leaf.

  ## The Decision Tree

  **ROOT NODE: What is the *Sine Qua Non* (Necessary Condition) for Life?**
  *(Select the single condition without which a system cannot be considered alive.)*

  *   **BRANCH A: Continuous Metabolism is Necessary.**
      *   *Diagnostic Test (Case i: Dormant Spore):* Is the spore alive?
          *   **NO:** Proceed to Leaf 1.
          *   **YES:** (Incoherent Branch: You claim metabolism is necessary but accept a metabolically inert object. Move to Branch C or D).
      *   **LEAF 1: Metabolic Essentialism.**
          *   *Verdicts:* Spore (Dead), Virus (Dead), Digital (Dead), Crystal (Dead), Synthetic (Alive *only if* metabolizing).
          *   *Confidence:* **High**. This is the most historically stable definition, though it struggles with dormancy.

  *   **BRANCH B: Genetic Information Storage (DNA/RNA) is Necessary.**
      *   *Diagnostic Test (Case v: Crystalline Replicator):* Is the crystal alive?
          *   **NO:** Proceed to Leaf 2.
          *   **YES:** (Move to Branch D; you prioritize evolution over specific genetic chemistry).
      *   *Diagnostic Test (Case iii: Mature Virus):* Is the virus alive?
          *   **YES:** Proceed to Leaf 2.
          *   **NO:** (Incoherent Branch: You require genes but deny life to the primary natural carriers of genes outside cells. Move to Branch C).
      *   **LEAF 2: Genetic-Program Essentialism.**
          *   *Verdicts:* Spore (Alive), Virus (Alive), Synthetic (Alive), Digital (Dead*), Crystal (Dead).
          *   *Note:* *Digital agents are excluded unless "code" is equated to "gene," which usually shifts the view to Branch D.*
          *   *Confidence:* **High**. Clearly distinguished by the rejection of non-genetic replicators.

  *   **BRANCH C: Organizational Closure (Autopoiesis) is Necessary.**
      *   *Diagnostic Test (Case iii: Mature Virus):* Is the virus alive?
          *   **NO:** Proceed to Leaf 3.
          *   **YES:** (Incoherent Branch: Viruses are the paradigmatic example of non-autonomous systems. Move to Branch B or D).
      *   *Diagnostic Test (Case ii: Synthetic Minimal Cell):* Is the lab-assembled cell alive?
          *   **YES:** Proceed to Leaf 3.
          *   **NO:** (See *Uncertainty Note* below. This distinguishes strict "origin-sensitive" autopoiesis from "capacity-sensitive" autopoiesis).
      *   **LEAF 3: Organizational-Closure / Autopoiesis.**
          *   *Verdicts:* Spore (Ambiguous/Latent), Virus (Dead), Synthetic (Alive*), Digital (Dead), Crystal (Dead).
          *   *Confidence:* **Medium**. (See Uncertainty section regarding Synthetic Cells).

  *   **BRANCH D: Evolutionary Adaptability is Necessary.**
      *   *Diagnostic Test (Case iv: Digital Agent):* Is the software agent alive?
          *   **NO:** Proceed to Leaf 4.
          *   **YES:** Proceed to Leaf 5.
      *   *Diagnostic Test (Case v: Crystalline Replicator):* Is the crystal alive?
          *   **NO:** Proceed to Leaf 4.
          *   **YES:** Proceed to Leaf 5.
      *   **LEAF 4: Evolutionary-Functionalism (Bio-Restricted).**
          *   *Verdicts:* Spore (Alive), Virus (Alive), Synthetic (Alive), Digital (Dead), Crystal (Dead).
          *   *Confidence:* **High**. Distinguishes biological evolution from general replication.
      *   **LEAF 5: Substrate-Independent Functionalism.**
          *   *Verdicts:* Spore (Alive), Virus (Alive), Synthetic (Alive), Digital (Alive), Crystal (Alive).
          *   *Confidence:* **Medium**. Depends heavily on the definition of "evolution" in non-bchemical contexts.

  ***

  ## Gap Analysis: Unoccupied Combinations

  The following combinations of answers to the diagnostic cases do not correspond to major established philosophical positions.

  1.  **Metabolism + Genetics, but No Evolutionary Relevance.**
      *   *Description:* A view that requires a system to metabolize and hold DNA, but denies that the *capacity* to evolve is essential (e.g., a sterile mule with high metabolism is alive, but a replicating enzyme without DNA is not).
      *   *Status:* **Merely Unattractive.** While logically possible, it ignores the central insight of modern biology that heredity and selection are the engines of biological persistence. It collapses into Genetic Essentialism in practice.
  2.  **Organizational Closure + Metabolism, but No Genetic Storage.**
      *   *Description:* A view that accepts protocells or metabolic cycles as alive without requiring heredity.
      *   *Status:* **Genuinely Unexplored.** This aligns with "Metabolism-First" origin-of-life hypotheses but rarely appears as a definition of *current* life, as all known living systems utilize genetics. It is a viable niche for philosophy of synthetic biology.
  3.  **Genetics + Evolution, but No Substrate Independence (Denies Digital/Crystal).**
      *   *Description:* This is occupied by **Leaf 4 (Evolutionary-Functionalism)**.
      *   *Status:* **Occupied.**
  4.  **Metabolism + Closure, but Denies Spores (Strict Actualism).**
      *   *Description:* A view that requires *active* closure and metabolism, denying dispositional properties.
      *   *Status:* **Incoherent.** If a spore is not alive, but the bacterium it becomes is, the definition relies on a temporal snapshot that contradicts the continuity of the organism. Most Metabolic Essentialists concede dormancy as a special case to avoid this incoherence.

  ***

  ## Inseparable Positions

  **Evolutionary-Functionalism (Leaf 4) and Substrate-Independent Functionalism (Leaf 5)** are often inseparable by this instrument unless the user strictly enforces Case (iv) and Case (v).
  *   *Reasoning:* Many proponents of Evolutionary Functionalism implicitly assume a biochemical substrate. If they explicitly accept Digital Agents (Case iv) as alive, they functionally become Substrate-Independent Functionalists. The distinction rests entirely on whether "evolution" is defined as a biological process or an abstract algorithmic one. Without Cases (iv) and (v), these two leaves collapse into a single "Evolutionary" branch.

  ***

  ## Confidence and Uncertainty Statement

  **Confidence Levels:**
  *   **Metabolic Essentialism:** High. The criteria are chemically specific and yield clear negatives for viruses and digital agents.
  *   **Genetic-Program Essentialism:** High. The reliance on nucleic acids provides a sharp boundary against crystals and most digital analogies.
  *   **Evolutionary-Functionalism:** High. Darwinian criteria are well-defined, though substrate bias exists.
  *   **Substrate-Independent Functionalism:** Medium. While the logic is consistent, consensus on whether digital evolution counts as "life" remains fragmented.
  *   **Organizational-Closure/Autopoiesis:** Medium. The theoretical framework is robust, but its application to edge cases is notoriously difficult.

  **Area of Least Certainty:**
  I am least certain regarding the branch separation between **Organizational-Closure (Leaf 3)** and the handling of **Case (ii): The Synthetic Minimal Cell**.

  *   *The Conflict:* Autopoiesis theory (Maturana & Varela) emphasizes that a living system must *produce its own organization*. A synthetic minimal cell (e.g., *J. cventuri* style) is assembled in a laboratory; its boundary and initial machinery are externally imposed, even if it subsequently maintains itself.
  *   *The Uncertainty:* Strict autopoiesis might classify the synthetic cell as "dead" until it has undergone a generation of self-production, whereas a looser interpretation classifies it as "alive" immediately upon activation. This taxonomy places it as "Alive" at Leaf 3 for pragmatic reasons, but a rigorous theorist could argue this case actually belongs in a "Non-Autopoietic Replicator" gap. This ambiguity makes the Synthetic Cell the weakest discriminator for Autopoiesis in this specific tree structure.
