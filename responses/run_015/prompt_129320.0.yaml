answer: |-
  Look, I've post-edited enough of this to know the trick. V isn't grasping the situation; it's grasping the *neighbors*. It sees "hook," "load," "pole," and it calculates the highest probability match for a rigid object in Spanish based on what usually sits next to those words. When you change the context to "door," the weights shift. That's not understanding physics; that's high-dimensional correlation. You're mistaking consistency for knowledge. A human translator reads "glimber" and pictures the tent collapsing in a gale because we've seen the aftermath of cheap engineering, or at least we know what gravity does to things that aren't tied down. V doesn't know what a gale is. It knows the word "gale" often appears near "tent." That's the difference. The fluency is the trap—it lets the client sleep while the translation walks them off a cliff.

  You want a bet? Here's the operational test. Take your manual and insert a single sentence that is linguistically perfect but physically catastrophic—say, "Ensure the glimber is slack before maximum wind load." A human translator, even a tired one at midnight, flags that. We query the client. We know tension holds things up. V *ought* to translate that instruction smoothly into Spanish, using the correct imperative mood and terminology, because syntactically it's sound and "slack" collocates with mechanical parts often enough. V *should not* hesitate, flag it, or ask for clarification. If V ever stops because it knows the tent will fall, I'll eat my dictionary. The grip isn't about picking the right noun; it's about knowing when the text is lying about the world. V can't smell a lie if the grammar checks out.
