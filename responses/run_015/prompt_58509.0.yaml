          *   *Who should be in charge?* Constitutionally, health/safety ("police powers") belongs to states. Feds handle interstate commerce and funding.
          *   *Ideal Scenario:* States tailor rules to local conditions. Feds coordinate resources (PPE, vaccines) and fund things.
          *   *COVID Reality:* States did exactly this (FL open, CA closed). Feds sent money/vaccines but didn't mandate masks nationally.

      *   **Concept 2: Subsidiarity (The Philosophical Principle):**
          *   *Definition:* Solve problems at the *lowest* level possible. Only move up if the lower level *can't* handle it.
          *   *Who should be in charge?* Ideally, counties or cities first. Then states. Then Feds only if it crosses borders and states fail.
          *   *Ideal Scenario:* A city outbreak gets handled by the city. If it spreads to the whole state, the state steps in. If it's a national crisis, *then* the Feds step in.
          *   *Nuance:* Subsidiarity isn't just "states rights"; it's about *effectiveness* and *proximity* to the people.

      *   **Comparison/Overlap:**
