      *   *Subsidiarity:* A principle (often Catholic social teaching or EU law, but applicable here) that decisions should be made at the *lowest possible level* closest to the people affected. It's like federalism on steroids regarding local control.
      *   *The Conflict:* Pandemics don't respect borders. Virus spreads across state lines. Local control might lead to patchwork responses that fail to stop spread. Central control might be too blunt or overreach.

