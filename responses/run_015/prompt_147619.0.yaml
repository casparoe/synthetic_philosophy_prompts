prompt: |-
  Okay so I've been going back and forth with my freind about what we're actually gonna do after grad school, and it's getting kinda tense. She landed this insane offer at a big strategy consulting firm — like, she could live on 30k and send 200k a year to these malaria-net charities that publish really precise cost-per-life-saved numbers. I told her that sounds amazing on paper, but I just started at this scrappy legal-aid collective where we help tenants fight eviction, and the "impact" is this total mess — you can't put it in a spreadsheet, and half the time you're just delaying the inevitable.

  She keeps saying I'm letting emotion cloud the math, that if she takes the job she's literally funding ten people like me, but I keep wondering: isn't the consulting work itself part of the system that drives up rents and displaces people? Like, there's this institutional thing where the money she makes and the money she gives are both moving through the same machinery? And also, those malaria numbers are so clean because they ignore all the spillover effects that don't fit the measurabilty model.

  I don't want to just be the person who says "capitalism bad" and calls it philosophy, but I feel like there's a real flaw in her reasoning that I'm not articualting right. Can someone help me map out whether the "earn to give" logic actually holds up once you factor in that her job might be causing harm, and that the measurability of the charity might be hiding something important?
