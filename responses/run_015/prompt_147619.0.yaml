answer: |-
  This is one of the most classic, high-stakes debates in modern ethics, often framed within the **Effective Altruism (EA)** community. Your friend is arguing from a strict utilitarian "Earn to Give" framework, while you are arguing from a **structural integrity** and **systems change** perspective.

  You are right to feel that "capitalism bad" is too blunt an instrument here. It shuts down conversation. Instead, you can challenge her on the *internal logic* of her own argument. If she cares about *net* impact, she has to account for negative variables, not just positive ones.

  Here is a map to help you articulate the flaws in the "Earn to Give" logic without dismissing the value of charity, focusing on **harm offsets**, **metric bias**, and **systemic lock-in**.

  ### 1. The "Net Impact" Equation (The Harm Offset)
  Your friend's math looks like this:
  $$ \text{Total Good} = \text{Charity Impact} $$

  But the actual equation for *net* impact must include the consequences of earning that money:
  $$ \text{Total Good} = \text{Charity Impact} - \text{Harm Generated by Job} $$

  **The Argument:** Strategy consulting is not a neutral income source. It is an optimization engine for capital.
  *   **Specifics:** Strategy firms often advise landlords on maximizing yield (which means raising rents), advise corporations on restructuring (which means layoffs/housing instability), or advise developers on gentrification strategies.
  *   **The Flaw:** If her work helps a client increase profits by $10M through practices that displace 50 families, and she donates enough to save 5 lives from malaria, has she actually done good? She is fixing a leak in one part of the pipe while tightening the valve that causes the leak in another.
  *   **Talking Point:** *"I believe in the math, but the equation is incomplete. If my job stops 10 evictions, and your job enables a policy that causes 20 evictions (even if you save lives elsewhere), are we actually maximizing welfare, or just moving suffering around?"*

  ### 2. The Tyranny of Metrics (Goodhart's Law)
  Your friend values the malaria nets because the "cost-per-life-saved" is clean. This is seductive, but it suffers from **measurement bias**.

  **The Argument:** Easy-to-measure outcomes often crowd out hard-to-measure but vital outcomes.
  *   **Specifics:** Saving a life from malaria is binary (alive/dead). Housing justice is about *dignity, stability, community cohesion, and mental health*. If you prevent an eviction, a kid stays in their school, a family doesn't fracture, and a neighborhood doesn't lose a stabilizing elder. None of that fits in a spreadsheet.
  *   **The Flaw:** By prioritizing only what is measurable, you risk neglecting problems that are complex and systemic. This is known as **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
  *   **Talking Point:** *"Metrics are great for tracking, but terrible for defining value. If we only fund what's easily measurable, we stop solving complex problems like housing justice because they don't have a clean 'cost-per-save.' That creates a world where we save lives in the short term but make the systems that threaten those lives stronger."*

  ### 3. Systemic Lock-In vs. Alleviation
  This is the difference between treating a symptom and curing the disease.

  **The Argument:** "Earn to Give" often relies on the status quo remaining broken enough to require charity.
  *   **Specifics:** Malaria nets are essential, but they don't fix the healthcare infrastructure that allowed malaria to thrive. Similarly, your legal aid work challenges the *right* of landlords to displace people. Her consulting work often reinforces the *power* of landlords to displace people.
  *   **The Flaw:** If everyone with the talent to fix the system instead goes into finance to fund bandaids, the system never gets fixed. This is **path dependence**. Her path leads to a world where rich people donate to the poor forever. Your path leads to a world where the poor have rights that don't require charity.
  *   **Talking Point:** *"Your approach assumes the system is a fixed variable and we are just managing the casualties. My approach tries to change the variable. If I succeed, fewer people need eviction defense. If you succeed, we have more charity, but the same machinery of displacement. Which world is actually better in 50 years?"*

  ### 4. Moral Complicity and Integrity
  This is the emotional part, but it can be framed philosophically. It's about **moral residue**.

  **The Argument:** You cannot fully separate the actor from the action.
  *   **Specifics:** Earning money through extractive practices creates a moral debt that donation doesn't necessarily wipe clean. It's the concept of "dirty hands."
  *   **The Flaw:** There is a psychological and social cost to normalizing harmful industries. By placing high-status talent into consulting, you legitimize the industry.
  *   **Talking Point:** *"It's not just about the output; it's about the signal. When people like us go into consulting, we signal that this is the 'smart' path. That drains talent from public interest work. I'm worried about the opportunity cost of human capital, not just financial capital."*

  ### How to Have This Conversation Without Fighting
  The tension exists because she feels judged (like her charity isn't "real" work) and you feel judged (like your math is emotional). To de-escalate:

  1.  **Validate the Intent:** Start by agreeing that her desire to help is genuine and impressive. *"I honestly admire your discipline and your desire to help. I don't doubt your heart."*
  2.  **Shift from "Right vs. Wrong" to "Risk Assessment":** Frame your concerns as risks to *her* goal of maximizing good. *"I'm worried that if you ignore the negative externalities of the consulting work, your net impact might be lower than you think. I want you to actually win at the game you're playing."*
  3.  **Invite Complexity:** Ask her to model the harm. *"Have you tried to estimate the negative impact of the clients you'll serve? Even a rough estimate would make your math more robust."*
  4.  **Acknowledge Your Own Blind Spots:** *"I know my work is hard to measure. Maybe I'm clinging to it because it feels good, not because it's efficient. But I think the 'inefficiency' is actually the complexity of real human systems."*

  ### Summary for Your Friend
  If you need a quick summary to send her, try this:

  > "I've been thinking about our chat. I'm not saying your math is wrong, I'm saying the variables might be incomplete.
  >
  > 1.  **Harm Offset:** If my job stops displacement and your job optimizes it, does the donation cancel out the harm, or just mitigate it?
  > 2.  **Measurement Bias:** Just because housing stability is hard to quantify doesn't mean it's less valuable than malaria nets. We shouldn't let the spreadsheet decide what matters.
  > 3.  **Systemic Change:** Charity manages the symptoms of a broken system; law/policy tries to fix the system. We need both, but we shouldn't pretend they are equal in terms of long-term change.
  >
  > I'm not trying to win. I just think true 'effectiveness' requires looking at the whole machine, not just the output."

  This approach respects her intelligence while firmly planting the flag that **context matters as much as calculation.**
