answer: |-
  **MEMORANDUM**

  **TO:** Compensation Design Panel; City Council
  **FROM:** [Your Name], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Valuation Formula for Riverbend Voluntary Buyout

  **Recommendation**

  The Panel recommends the Council adopt a Replacement-and-Disturbance Formula for the Riverbend buyout. The resolution should specify the following mechanics:

  1.  **Owner-Occupants:** Offers shall equal the appraised cost of purchasing a comparable structure outside the designated floodplain, plus a Fixed Relocation Allowance and a Fixed Non-Traded Loss Payment. Current market value discounted for flood risk shall not be used.
  2.  **Renters:** The 44 renter households shall receive the Fixed Relocation Allowance and the Fixed Non-Traded Loss Payment. Eligibility requires proof of tenancy for at least twelve months prior to the most recent flood.
  3.  **Adapted Structures:** Households with documented disability adaptations shall receive an additional supplement equal to the cost of replicating those modifications in a comparable non-floodplain unit, or the documented investment loss if replication is impossible.
  4.  **Stated Minimums:** If a household's documented minimum acceptance figure exceeds the formula offer, the case shall be referred to the Panel for discretionary review. The Panel may authorize a top-up of up to 10% to bridge gaps driven by unique non-traded losses, but offers exceeding this cap shall be withdrawn.

  **Theory of Value**

  This formula presupposes that public compensation aims to restore household welfare, not to simulate a private market exit. In a private transaction, value is defined by what a buyer will pay and a seller will accept. In a public resilience program, value must be defined by what is required to leave the household whole relative to its pre-disaster trajectory.

  The market-anchored approach treats revealed preference as the only valid measure of welfare. It assumes that because households chose to remain in Riverbend despite flooding, they have implicitly priced the risk. This ignores the constraints evident in our data: tight regional housing markets, constrained credit, and the specific needs of disabled residents. A renter who stays because no other affordable unit exists has not "revealed" a preference for flood risk; they have revealed a lack of options. To compensate them based on a market discount that reflects their own poverty is to compound the injury. Furthermore, non-traded losses—proximity to kin, congregation, and school routes—are not commodities residents chose to forego; they are community assets destroyed by the necessity of relocation. Public funds should secure capability and housing stability, not merely purchase property rights at a distress price.

  **The Market-Anchored Argument**

  The strongest argument for the rejected market-anchored formula rests on fiscal discipline and the avoidance of moral hazard. Its defenders argue that observed behavior is the only non-arbitrary evidence available. Households chose to live in Riverbend, chose insurance levels, and chose whether to move after the last flood. To ignore these choices is to substitute bureaucratic judgment for individual autonomy.

  This view contains a crucial insight: any number not derived from market data is, to some degree, a guess. The staff economist correctly notes that surveys invite respondents to name the largest figure they think they can get away with. The gap between stated minimums and market estimates suggests strategic behavior. Additionally, the market bloc is divided between those who believe these numbers measure welfare and those who view them merely as predictive devices. The latter group is correct that market prices predict take-up rates better than subjective surveys do. However, predictive utility is not ethical sufficiency. While the market formula might accurately predict who leaves for the lowest cost, it fails the specific mandate of a compensation program: to make victims whole rather than to clear properties cheaply. We reject the market formula not because it is wrong about behavior, but because it is wrong about obligation.

  **Implementation Timeline**

  To meet the three-week deadline for the Panel's recommendation and subsequent Council approval, the following steps must occur immediately:

  1.  **Define Fixed Payments (Days 1-7):** The Panel Staff shall calculate the Fixed Relocation Allowance and Fixed Non-Traded Loss Payment based on average moving costs and a standardized valuation of community disruption. *Responsibility: Panel Staff Economist.*
  2.  **Establish Appraisal Baseline (Days 8-14):** The City Assessor shall identify three comparable non-floodplain neighborhoods and establish baseline per-square-foot costs to ensure the "replacement cost" component is standardized and not subject to individual negotiation inflation. *Responsibility: City Assessor's Office.*
  3.  **Neutral Framing Outreach (Days 15-21):** Given pilot data showing take-up shifts based on framing (lump sum vs. monthly, "market" vs. "pre-flood"), Communications shall draft offer letters using neutral terminology. Offers will be presented as "Restoration Grants" paid in lump sums to avoid implying ongoing dependency or undervaluing the asset. *Responsibility: City Communications Director.*

  **Review Criteria**

  This formula should be revisited in eighteen months if either of the following conditions is met:

  1.  **Take-Up Discrepancy:** If fewer than 40% of eligible households accept the offer, suggesting the formula fails to meet actual reservation prices despite the replacement logic.
  2.  **Relocation Failure:** If post-relocation surveys indicate that more than 20% of participating households have moved back into flood-prone areas or report a decrease in housing stability within one year of moving.

  **Post-Hoc Behavioral Check**
  To test whether the stated minimum gap reflects genuine welfare loss or strategic gaming, the Panel should commission a blind audit. Six months after offers expire, compare the final relocation outcomes of those who accepted the formula against those who rejected it. If rejectors remain in Riverbend and suffer measurable financial loss from subsequent flooding equivalent to the rejected offer, this suggests the stated minimums were strategic. If rejectors move voluntarily later at higher cost, it suggests the formula underestimated the friction of moving. This data will determine whether the discretionary top-up cap should be adjusted in future phases.
