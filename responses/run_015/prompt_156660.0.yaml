  Pride implies you chose the desire to improve. Did you choose the capacity to meditate? Did you choose the motive to seek calm? If not, the regress holds. You are merely the venue where certain causal winds blew favorably. Submit a Retroactive Self-Creation Rejection form to purge any unauthorized claims of authorship. You may enjoy the calm, but you cannot own it. To claim credit is to claim you caused yourself, which is physically impossible. We appreciate your tranquility, but please file the waiver before mentioning your progress in tenure files. Failure to disclose the unchosen nature of your virtues may result in corrective counseling.

  **Dear OMA,**
  I believe in libertarian free will. I quit smoking through sheer indeterministic choice, while my brother did not. Since my choice wasn't determined, can I be proud where the determinist cannot? Surely randomness allows for a kind of authorship that causal necessity forbids, even if the Senate disagrees. I need to know if I can list this on my health insurance waiver.
  **— Free Agent, Chemistry**

  **Dear Free Agent,**
  Indeterminism offers no refuge. If your choice was random, it was luck; if determined, it was causation. Both negate ultimate ownership. You are merely the venue where certain causal winds blew favorably. Whether the switch flipped randomly or necessarily, you did not flip the switch that installed the switch. Submit a Retroactive Self-Creation Rejection form. Your brother's continued smoking is equally unauthored. Pride requires being causa sui, which is forbidden under Resolution 44-B. We encourage health, but please stop attributing it to will. The universe does not reward metaphysical errors, even healthy ones. Your insurance waiver requires the Luck Disclosure Statement, not a claim of willpower.

  **Dear OMA,**
  I'm hiring. Candidate A is kindly by nature. Candidate B overcame a wretched upbringing to be decent. Should I prefer B for the effort, since A's kindness was just luck? It seems unfair to reward natural temperament over struggled virtue, but the Basic Argument suggests both are equally unchosen. How do I justify this to the search committee without violating the new ethics guidelines?
  **— Chair, History Dept**

  **Dear Chair,**
  Effort is also luck. Candidate B's capacity to overcome was unchosen, just as Candidate A's nature was unchosen. Both are products of prior causes neither controlled. Prefer Candidate A for reliability, not virtue. Kindness that requires no struggle is often more stable than kindness won through war. Use the Causa Sui Waiver (Class III) to document that neither candidate deserves the job, but the department requires a worker. Select the tool that functions best. Do not congratulate the hiree; send them the Employee Handbook and the Luck Disclosure Statement. Justification rests on institutional stability, not moral merit.

  The column argues that social functioning requires maintaining bureaucratic fictions of agency while privately acknowledging the impossibility of desert.
  \answer{administrative fiction}
