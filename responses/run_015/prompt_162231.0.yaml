answer: |-
  **Exam Question: The Lottery Model of the Surprise Exam**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Instructions:** Answer both parts. No citations are expected or wanted; all necessary definitions are contained below.

  A teacher addresses a class at the start of a term of $N$ teaching days. Let $\Omega = \{1, \dots, N, \emptyset\}$ represent the possible outcomes, where $k \in \{1, \dots, N\}$ denotes an exam on day $k$, and $\emptyset$ denotes no exam. The teacher announces:

  (A1) There will be at most one exam.
  (A2) On the morning of any day $k$, a student who accepts (A1)–(A3), observes no exam has occurred on days $1, \dots, k-1$, and conditionalizes on this information, assigns probability at most $t$ to an exam occurring on day $k$ (where $0 \le t \le 1$).
  (A3) The student knows the teacher's selection procedure (the probability distribution over $\Omega$).

  Call a policy (a probability distribution over $\Omega$) **$t$-surprising** if it satisfies (A2) for every day $k \in \{1, \dots, N\}$.

  **(a)** Determine for which values of $t$ a $t$-surprising policy exists. Derive the maximum probability with which such a policy can place an exam (i.e., $1 - P(\emptyset)$) as a function of $t$ and $N$. Explicitly describe a policy that attains this maximum. [10 marks]

  **(b)** Does the lottery model dissolve the classical surprise exam paradox or merely relocate it? Defend a definite position. In your answer, address: (i) what has happened to the classical clause that there will *definitely* be an exam; (ii) whether a teacher who delivers no exam with positive probability has kept the promise; and (iii) whether a morning credence of at most $t$ is equivalent to being surprised, particularly in light of (A3). [10 marks]

  ***

  **Model Answer**

  **(a)** Let $p_k$ be the probability of an exam on day $k$, and $p_\emptyset$ the probability of no exam. Let $S_k = \sum_{j=k}^N p_j + p_\emptyset$ be the probability that no exam has occurred prior to day $k$ (survival probability). Note $S_1 = 1$. The condition (A2) requires that for all $k$, the conditional probability $P(\text{Exam on } k \mid \text{No exam before } k) \le t$. Formally:
  $$ \frac{p_k}{S_k} \le t \implies p_k \le t S_k $$
  Since $S_{k+1} = S_k - p_k$, substituting the inequality yields $S_{k+1} \ge S_k - t S_k = S_k(1-t)$.
  By recursion, $S_{k+1} \ge (1-t)^k S_1$. Since $S_1 = 1$, we have $S_{N+1} \ge (1-t)^N$.
  Note that $S_{N+1} = p_\emptyset$. Thus, any $t$-surprising policy must satisfy $p_\emptyset \ge (1-t)^N$.
  A $t$-surprising policy exists for any $t \in [0,1]$, provided we allow $p_\emptyset > 0$. The probability of an exam occurring is $P_{\text{exam}} = 1 - p_\emptyset$. To maximize this, we minimize $p_\emptyset$.
  The maximum probability of an exam is $1 - (1-t)^N$.
  An extremal policy attaining this sets the inequalities to equalities: $p_k = t(1-t)^{k-1}$ for $k=1, \dots, N$, and $p_\emptyset = (1-t)^N$. (Note: For $k=N$, $p_N$ absorbs the remainder such that the sum is 1, but the geometric form holds for the survival probabilities).

  **(b)** The model relocates rather than dissolves the paradox. The classical impossibility result is recovered as a limit case of the derived bound. In the classical paradox, the announcement entails the exam *must* occur ($p_\emptyset = 0$). Our bound requires $p_\emptyset \ge (1-t)^N$. For $p_\emptyset = 0$, we must have $(1-t)^N = 0$, which implies $t=1$. However, if $t=1$, the surprise condition (credence $\le 1$) is vacuous. Thus, the paradox arises not from self-reference per se, but from the incompatibility of *certainty of occurrence* ($p_\emptyset=0$) and *non-trivial surprise* ($t < 1$). The teacher who delivers no exam with positive probability has technically satisfied (A1) ("at most one") but violated the pragmatic implicature of the classical announcement that an exam is guaranteed.

  Regarding surprise, (A3) is crucial. The model equates surprise with low conditional credence given knowledge of the distribution. If (A3) is dropped and the student is uncertain about the policy itself, the teacher could potentially maintain high exam probability while keeping student credence low by obscuring the selection procedure. Here, "surprise" is a property of the student's epistemic state relative to a known risk profile, not an objective property of the date. The paradox persists because we intuitively demand both high objective probability of the exam and low subjective conditional probability, which the mathematics shows are in tension.

  ***

  **Marking Scheme (Total: 20)**

  **Part (a): Mathematical Derivation (10 Marks)**
  *   **Formalization (2 marks):** Correctly identifies conditional probability as $p_k / S_k$ (or equivalent notation).
  *   **Recursion (2 marks):** Correctly derives $S_{k+1} \ge S_k(1-t)$.
  *   **Bound (2 marks):** Correctly identifies $p_\emptyset \ge (1-t)^N$.
  *   **Max Probability (2 marks):** States max exam probability is $1 - (1-t)^N$.
  *   **Policy (2 marks):** Explicitly describes the geometric policy ($p_k = t(1-t)^{k-1}$).

  **Part (b): Philosophical Analysis (10 Marks)**
  *   **Classical Recovery (3 marks):** Explains that $p_\emptyset=0$ forces $t=1$, making surprise vacuous. Identifies the conflict is between certainty and surprise bound.
  *   **Promise Keeping (3 marks):** Discusses whether "at most one" vs "exactly one" matters; acknowledges positive $p_\emptyset$ changes the nature of the announcement.
  *   **Epistemic Status/A3 (4 marks):** Discusses the role of knowing the distribution. Notes that without (A3), uncertainty about the policy could sustain surprise differently. Distinguishes credence bound from knowledge/surprise.

  **Specific Penalties & Errors to Catch**
  *   **-3 marks:** Treating (A1) as "exactly one exam" ($p_\emptyset=0$) from the start and concluding no policy exists for any $t < 1$ without deriving the bound.
  *   **-3 marks:** Deriving a linear bound (e.g., $1 - Nt$ or $1-t$) instead of the geometric bound $(1-t)^N$.
  *   **-2 marks:** Assuming uniform priors ($p_k = 1/N$) rather than optimizing the distribution.
  *   **-2 marks:** Forgetting that the denominator in the conditional probability on day $N$ includes $p_\emptyset$.
  *   **-2 marks:** Conflating "credence $\le t$" with "cannot know" without discussing the probabilistic nature of the model.
  *   **-2 marks:** Failing to take a definite position in (b) (e.g., hedging without argument).

  **Grade Boundaries**
  *   **A (17-20):** Correct math, clear geometric derivation, nuanced discussion of (A3) and the certainty constraint.
  *   **B (13-16):** Correct math but weak philosophical justification, OR strong philosophy with minor math errors (e.g., policy description slightly off).
  *   **C (9-12):** Understands the recursion but fails the geometric bound, or correct math with minimal philosophical engagement.
  *   **D/F (0-8):** Fundamental errors in conditional probability or failure to address the prompt's specific constraints.
