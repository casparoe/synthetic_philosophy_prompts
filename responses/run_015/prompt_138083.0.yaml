answer: |-
  Here is the organized case file, the fact-check, and the analysis through your taxonomy.

  ### Part 1: The Fact Check
  Your summary is remarkably solid. You have the narrative arc correct. Here are the minor corrections and sharpenings you need for the argument:

  *   **Timeline:** The *Supper at Emmaus* was unveiled in 1937, not the late 30s generally. The trial was 1947.
  *   **The Chemistry:** You are right about the hardener. It was phenol-formaldehyde resin (a Bakelite precursor). He baked the canvases in an oven to harden the paint so it would withstand the "age test" of alcohol swabs. It wasn't that they were *undetectable* forever; it's that X-ray fluorescence and chemical analysis of binders weren't standard procedure for Old Masters in the 1930s.
  *   **The Sentence:** He was sentenced to one year. He died of a heart attack in December 1947, two months after the verdict, before serving much of it.
  *   **The Current Status:** You are correct. The *Supper at Emmaus* hangs in the Museum Boijmans Van Beuningen in Rotterdam. It is labeled as Han van Meegeren. It is a star attraction.

  ### Part 2: The Three Problems

  Here is how your four accounts (Autographic, Documentary, Surface, Relational) handle the specific phenomena you identified.

  **1. Re-anchoring**
  *The Phenomenon:* The painting crashes when it stops being a Vermeer, but recovers significant value when it becomes a van Meegeren. It does not become wallpaper.
  *   **Autographic:** This account predicts re-anchoring perfectly. Value is tied to the history of production. When the history changes from "Vermeer's hand" to "van Meegeren's hand," the value adjusts to the market rate for *that* hand. It explains the recovery without extra bolts.
  *   **Documentary:** Also predicts this. As a document of 1930s Holland, it is truthful. As a document of 1650s Delft, it is lies. Truth has value; lies do not.
  *   **Surface:** This account is embarrassed. The photons hitting the retina did not change. If value is purely visual, the price should not have fluctuated. To explain the recovery, the Surface view must admit that "knowing who painted it" changes the visual experience, which contradicts its core premise that only the surface matters.
  *   **Relational:** Predicts this well. The painting's position in the conversation shifted from "Key Vermeer" to "Key van Meegeren." It remains a central node in the conversation, just under a different tag.
  *   **Verdict:** Re-anchoring suggests the premium was never in the *object* alone, but in the *object-plus-provenance*. The Autographic and Relational views handle this naturally; the Surface view has to treat the market's behavior as irrational noise.

  **2. Palimpsest Value**
  *The Phenomenon:* The object is now "about" forgery. It carries the weight of the lie it told and the truth of how it told it. It is arguably more culturally significant as a fake than it would have been as a mediocre real Vermeer.
  *   **Taxonomy Check:**
      *   **Autographic:** Sees only the second layer (van Meegeren). It treats the Vermeer layer as an error to be deleted. It cannot account for the value of the *deception* itself, only the skill of the deceiver.
      *   **Documentary:** Treats the Vermeer layer as corruption. It values the object only once the corruption is scrubbed.
      *   **Surface:** Ignores the history entirely.
      *   **Relational:** This is the strongest fit. The "conversation" now includes the history of the forgery, the trial, and the humiliation of the experts. The work's meaning is constituted by that drama.
  *   **Does exposure add value?** Yes, historically and narratively.
  *   **Missing Category?** You don't necessarily need a fifth category, but you need to expand **Relational**. It shouldn't just be "art-historical conversation"; it must include "institutional biography." However, if you want to be strict, there is a case for a **Meta-historical** category: value derived specifically from an object's capacity to reveal the blind spots of its own era. The van Meegerens are valuable *because* they fooled Bredius. A real Vermeer doesn't do that.

  **3. The Recoil**
  *The Phenomenon:* The feeling of contamination. Curators speak of fakes as "polluting" collections. This is stronger than "worthless"; it is "dangerous."
  *   **Autographic:** The recoil comes from the violation of the creative covenant. We value the trace of the genius; a fake is a trace of a liar.
  *   **Documentary:** The recoil is epistemological. A fake is a virus in the database of history. It must be quarantined to protect the integrity of the record.
  *   **Surface:** Cannot explain the recoil. If it looks the same, why the disgust? It must attribute the recoil to the viewer's ego (feeling foolish), not the object.
  *   **Relational:** The recoil is a breach of trust within the institution. The museum guarantees authenticity; the fake proves the guarantee is void.
  *   **Source of Negativity:** All four accounts struggle to fully capture the *moral* dimension. The recoil is ethical, not just aesthetic or historical. It is the anger of betrayal. The taxonomy treats art as a system of value, but the forgery affair reveals art as a system of *trust*.

  ### Part 3: Running it the Other Direction

  **Does the episode confirm or embarrass the theories?**
  *   **Confirms:** Autographic and Documentary. They predicted the crash and the re-anchoring.
  *   **Embarrasses:** The Surface View. Your friend is closer than you are.
      *   *Your defense:* You argued the market collapse was just pricing instability and the enjoyment change was irrational.
      *   *The Counter:* If the Surface View holds, the aesthetic experience *should* remain stable regardless of knowledge. The fact that viewers report the painting looking "different" (stiffer, less profound) after knowing it is a fake proves that aesthetic experience is cognitively penetrated. We do not see with our eyes alone; we see with our knowledge. The Surface View requires you to call the entire art world's reaction "irrational," which is a theoretical bullet too large to bite. The van Meegeren case is the classic refutation of strict formalism.

  **The Hitler Diaries vs. van Meegerens**
  *   **The Contrast:** Diaries are locked away; van Meegerens are displayed.
  *   **The Taxonomy Explanation:**
      *   **Documentary Value:** The Diaries failed completely. They tell us nothing true about Hitler and nothing interesting about the forger (they were sloppy). They are purely contaminated evidence.
      *   **Autographic/Surface Value:** The van Meegerens are *good paintings*. Even knowing they are fakes, they possess technical skill and aesthetic power (Surface) and are impressive feats of an artist's hand (Autographic). The Diaries are bad handwriting and banal text.
      *   **Relational Value:** The van Meegerens have a compelling narrative (the trial, the Nazis, the art world hubris). The Diaries have a narrative, but it is one of pure embarrassment with no redeeming aesthetic merit.
  *   **Verdict:** It is a difference in the objects' **Surface** and **Autographic** quality. Museums hang van Meegerens because they are good art *by van Meegeren*. They lock Diaries because they are bad history *and* bad artifacts. The taxonomy holds, provided you admit that "forgery" is not a monolithic category; a beautiful forgery functions differently than a clumsy one.

  ### Part 4: The Blind Spots

  Where does the frame go quiet? There are two questions all four accounts decline to answer satisfactorily:

  **1. The Ethical/Trust Deficit**
  None of the four accounts fully quantifies the *betrayal*.
  *   Autographic cares about *who*, not *honesty*. (A confessed forgery is still autographic).
  *   Documentary cares about *truth*, but treats it as data, not trust.
  *   Surface doesn't care.
  *   Relational cares about *position*, not *morality*.
  *   **What to add:** You need an **Institutional/Ethical** layer. Art is a social contract. The museum says "This is X," and the public agrees to value it. The forgery breaks the contract. The "Recoil" is the penalty for breach of contract. Without this, you cannot explain why we feel *anger* rather than just *disappointment*.

  **2. The Scarcity Mechanism**
  The taxonomy treats value as intrinsic to the object's properties (visual, historical, or relational). It underplays the economic engine.
  *   Vermeers are rare (30-ish exist). van Meegerens are less rare.
  *   The price crash wasn't just about "truth"; it was about supply. If van Meegeren had only painted one fake Vermeer, the re-anchored value would be higher.
  *   **What to add:** A **Market/Scarcity** variable. The "Re-anchoring" recovery is capped not just by van Meegeren's skill, but by the supply of van Meegerens. The four accounts are ontological; they need an economic supplement to explain the *magnitude* of the value shifts.

  **Summary for your argument:**
  Your friend is right that the Surface View takes a fatal hit here. The van Meegeren affair proves that art value is not retinal; it is cognitive and historical. However, you are right that the objects didn't become worthless. The **Autographic** and **Relational** views explain the recovery best. But to explain the *anger* (Recoil) and the *museum display* (vs. Diaries), you must admit the taxonomy is missing an **Ethical** dimension (trust) and an **Aesthetic** dimension (the fake must still be a good painting to survive). The van Meegerens survive because they are good art *and* good stories. The Diaries failed because they were bad history *and* bad art.
