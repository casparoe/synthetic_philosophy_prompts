answer: |-
  Your hypothesis is not merely a relabelling; it is a precise diagnosis of why the field has stalled. You have correctly identified that the stalemate is not primarily about weighing false positives against false negatives, but rather a category error regarding the *locus* of fairness, compounded by a refusal to treat base rates as endogenous variables.

  Here is the diagnosis, argued from the positions themselves, followed by an evaluation of your invariance test and a definition of what progress would actually look like.

  ### 1. The Locus Disagreement: Epistemic vs. Distributive

  The fundamental impasse is that the two main camps are not arguing about the same object. They are using the same mathematical vocabulary to describe two distinct moral technologies.

  One camp treats the algorithm as an **epistemic device**. Its purpose is to state the truth about risk. For this group, fairness is a property of the *score*. If a score of seventy per cent implies a seventy per cent chance of recidivism, it is unfair to alter that meaning based on group membership. To do so would be to lie about the individual's risk profile. Their demand is for *calibration*. They view the base rate as a fact of the world that the model must reflect accurately. If the base rates differ, the scores must differ to remain truthful.

  The other camp treats the algorithm as a **distributive mechanism**. Its purpose is to allocate burdens (detention, higher premiums, denied loans). For this group, fairness is a property of the *decision rule*. They are less concerned with whether the score accurately reflects risk than with whether the *consequences* of that risk are distributed equally across groups. Their demand is for *error parity* or equal acceptance rates. They view the base rate not as a fixed fact, but often as a historical artefact of the very system being deployed.

  The impossibility theorems are not discovering a mathematical glitch; they are proving that you cannot simultaneously maximise epistemic accuracy (conditional on existing data) and achieve distributive equality (conditional on existing base rates) when those base rates differ. The field is stuck because it is trying to find a single mathematical criterion to resolve a conflict between truth-telling and resource allocation. There is no such criterion.

  ### 2. Evaluating the Invariance Audit

  Your proposed test—running an invariance audit on each criterion—is a robust redescription of the problem. It moves the debate from 'which metric is right' to 'which symmetries do we wish to preserve'.

  *   **Calibration** demands invariance under group permutation *conditional on the score*. It says: if I swap a black defendant for a white defendant with the same score, the predicted probability of the outcome should not change. It tolerates variation in error rates across groups.
  *   **Error Parity** demands invariance under group permutation *conditional on the true outcome*. It says: if I swap a black defendant for a white defendant who both reoffended, the rate at which they were flagged should not change. It tolerates variation in what a specific score means across groups.

  Your audit reveals that these are conflicting symmetry groups. When base rates differ, you cannot satisfy both symmetry conditions.

  However, your test needs one addition to be fully diagnostic: **Normative Weighting**. An invariance audit shows *that* the criteria clash, but not *why* we care about the invariance. The epistemic camp cares about score-conditional invariance because they prioritise individual accuracy. The distributive camp cares about outcome-conditional invariance because they prioritise group-level equity.

  The audit is useful because it exposes that 'fairness' is being used as a proxy for 'which symmetry group gets to dictate the model's behaviour'. When practitioners use a toolkit to slide a bar between criteria, they are not solving a moral problem; they are arbitrarily selecting which symmetry to break.

  ### 3. The Verbal Dispute and the Base Rate Reality

  You ask whether this is verbal. It is partly verbal, in that one side uses 'fair' to mean 'accurate' and the other uses it to mean 'equal'. But it is substantively deeper than semantics. It is a disagreement about **causal sufficiency**.

  The impossibility theorems fall into two classes.
  1.  **Structural Impossibilities:** These bite regardless of base rates (e.g., individual fairness vs. group fairness). These are genuine tensions between granularity and aggregation.
  2.  **Base-Rate Impossibilities:** These only bite when base rates differ. This is where the real work is being hidden.

  By treating base rates as fixed parameters, the epistemic camp implicitly argues that the history producing those rates is morally inert. They treat the data as a mirror. The distributive camp argues that the data is a map of past discrimination, and using it without correction perpetuates that discrimination.

  Therefore, the impossibility theorems relying on base rate differences are not just mathematical constraints; they are proofs that **statistical fairness cannot cure structural inequality**. If the underlying rates of arrest or default differ due to historical policy, no threshold adjustment can satisfy both accuracy and parity. To insist otherwise is to believe one can mathematically adjust away sociological causes.

  So, to answer your question: the theorems are not doing the same kind of work. The base-rate-dependent theorems are the critical ones. They demonstrate that fairness constraints applied solely to the model are insufficient when the world itself is unfair.

  ### 4. What Would Count as Progress?

  Given this diagnosis, progress will not come from a new metric, a better taxonomy, or a theorem proving one side wrong. The current trajectory of producing dashboards that allow users to 'choose their fairness' is an abdication of responsibility, disguising a political choice as a hyperparameter tuning exercise.

  Progress would look like one of the following three shifts:

  **A. Procedural Legitimacy over Statistical Optimality**
  Acknowledge that there is no unique mathematical solution. The question should shift from 'which criterion is correct?' to 'who has the mandate to select the criterion?'. Progress would be a governance framework where the choice of invariance (calibration vs. parity) is made by a body with democratic or regulatory authority, not by the data science team. The metric becomes a policy setting, not a technical discovery.

  **B. Causal Intervention on Base Rates**
  Stop treating base rates as fixed. If the impossibility arises because arrest rates differ from reoffending rates, the solution is not to adjust the threshold, but to change the target label or the features. Progress involves causal modelling that identifies which features are proxies for protected attributes and removes them, or acknowledges that the target label itself is biased. This moves the work from 'fair machine learning' to 'fair data collection'. It admits that you cannot fix a biased pipeline with a post-processing filter.

  **C. Distinguishing Prediction from Decision**
  Formally separate the risk score (epistemic) from the decision rule (distributive). The score should be calibrated to be as accurate as possible. The decision rule should then apply different thresholds to different groups *if* a social mandate requires equalising error rates. This is currently taboo because it looks like 'different standards', but it is the only mathematically honest way to satisfy both camps. It admits that the score tells the truth, but the decision applies a subsidy or a tax to correct for historical inequality.

  ### Summary

  Your invariance hypothesis is correct and useful. It clarifies that the field is arguing over which transformations of the data should leave the moral verdict unchanged. The stalemate persists because these invariances are mutually exclusive under conditions of structural inequality.

  The field is producing taxonomies because it is trying to solve a political conflict with linear algebra. Progress requires admitting that the choice of fairness criterion is a political act that requires a political mandate, and that statistical adjustments cannot substitute for causal interventions in the data generation process. Until the field stops treating base rates as exogenous constants and starts treating them as endogenous variables subject to policy, the impossibility theorems will remain verdicts on the limits of the technology, rather than guides for its use.
