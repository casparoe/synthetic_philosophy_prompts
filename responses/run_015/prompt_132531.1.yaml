  ### 1. Decision Context: Antibiotic Stewardship under Imprecise Risk

  **Domain:** Public-Health Resource Allocation (Hospital Infectious Disease Unit).

  **The Parameter:**
  Let $\theta$ represent the prevalence of a **resistant pathogen strain** among incoming patients. The hospital administration does not know the precise value of $\theta$ but models their uncertainty using a **credal set** represented by a probability interval $\Theta = [\theta_{min}, \theta_{max}]$.

  **The Competing Actions:**
  1.  **Action A (Broad-Spectrum Protocol):** Administer a potent, broad-spectrum antibiotic immediately.
      *   *Characteristics:* Effective against the resistant strain but carries higher toxicity and cost, yielding lower welfare if the strain is sensitive.
  2.  **Action B (Targeted Protocol):** Administer a standard, targeted antibiotic.
      *   *Characteristics:* Highly effective and low-cost if the strain is sensitive, but treatment failure (catastrophic welfare loss) occurs if the strain is resistant.

  **Payoff Structure (Welfare Units):**
  The welfare outcomes depend on the state of the pathogen (Resistant vs. Sensitive).

  | Action | Resistant Strain (Prob $\theta$) | Sensitive Strain (Prob $1-\theta$) | Expected Utility $EU(\theta)$ |
  | :--- | :--- | :--- | :--- |
  | **A (Broad)** | 100 | 61 | $100\theta + 61(1-\theta) = \mathbf{61 + 39\theta}$ |
  | **B (Targeted)** | 0 | 100 | $0\theta + 100(1-\theta) = \mathbf{100 - 100\theta}$ |

  *Note: Action A is "robust" (positive slope), performing better as resistance rises. Action B is "fragile" (negative slope), performing worse as resistance rises.*

  **Decision Rule:**
  The administration applies the **Maximin Expected Utility (MMEU)** criterion. They evaluate each action by its minimum expected utility across all probabilities in the credal set $\Theta$.
  $$V(Action) = \min_{\theta \in [\theta_{min}, \theta_{max}]} EU(Action, \theta)$$

  ---

  ### 2. The Sequential Decision and Reversal

  #### Phase 1: Initial Decision (High Ambiguity)
  **Credal Set:** Based on sparse historical data, the interval is wide.
  $$\Theta_{initial} = [0.00, 0.40]$$
  *Center (Mean Belief):* $0.20$

  **Evaluation:**
  *   **Action A:** The utility function $61 + 39\theta$ is increasing. The worst case is at the lower bound $\theta_{min} = 0.00$.
      $$V(A) = 61 + 39(0.00) = \mathbf{61.0}$$
  *   **Action B:** The utility function $100 - 100\theta$ is decreasing. The worst case is at the upper bound $\theta_{max} = 0.40$.
      $$V(B) = 100 - 100(0.40) = \mathbf{60.0}$$

  **Recommendation:** Since $61.0 > 60.0$, the rule recommends **Action A (Broad-Spectrum)**.

  #### Phase 2: New Evidence (Symmetric Narrowing)
  New diagnostic data arrives. It is genuinely informative, significantly reducing uncertainty, but it **does not shift the center** of the distribution. The interval shrinks symmetrically around the mean of $0.20$.

  **New Credal Set:**
  $$\Theta_{final} = [0.15, 0.25]$$
  *Center (Mean Belief):* $0.20$ (Unchanged)

  **Evaluation:**
  *   **Action A:** The worst case is now the new lower bound $\theta_{min} = 0.15$.
      $$V(A) = 61 + 39(0.15) = 61 + 5.85 = \mathbf{66.85}$$
  *   **Action B:** The worst case is now the new upper bound $\theta_{max} = 0.25$.
      $$V(B) = 100 - 100(0.25) = 100 - 25.0 = \mathbf{75.0}$$

  **Recommendation:** Since $75.0 > 66.85$, the rule now recommends **Action B (Targeted)**.

  ---

  ### 3. Analysis of the Reversal

  **The Paradox:**
  The decision flips from A to B despite the fact that the agent's central belief about the risk ($\theta = 0.20$) remained constant. Intuitively, if the "best guess" regarding the pathogen's resistance hasn't changed, the preferred treatment should not change. Furthermore, observe the migration of the worst-case scenarios:
  *   For Action A, the worst-case parameter migrated from $0.00$ to $0.15$ (an increase in the feared probability).
  *   For Action B, the worst-case parameter migrated from $0.40$ to $0.25$ (a decrease in the feared probability).

  While Action A's specific worst-case scenario became "more likely" (0.00 $\to$ 0.15), Action A still lost. This occurs because Action B is far more sensitive to the parameter $\theta$ (slope of -100 vs. +39). The reduction in ambiguity relieved the "ambiguity penalty" on Action B much more aggressively than it improved the worst-case for Action A.

  ### 4. Conceptual Diagnosis

  This reversal highlights a specific tension in decision theory known as **Dynamic Inconsistency under Ambiguity**.

  1.  **Ambiguity vs. Risk:** In standard Bayesian decision theory (risk), narrowing the variance of a belief without shifting the mean does not alter the optimal choice for linear utility functions. Here, the reversal is driven entirely by the **size of the credal set**. The agent is not just evaluating the probability of outcomes, but also the *reliability* of that probability.
  2.  **Sensitivity to Set Width:** Action B is "ambiguity-sensitive." Its expected utility varies wildly across the interval $[0, 0.4]$. Action A is "ambiguity-robust." Under the Maximin rule, the wide interval imposes a massive penalty on B (evaluating it at $\theta=0.40$) compared to A (evaluating it at $\theta=0.00$).
  3.  **Failure of Consequentialism:** The reversal suggests that the agent's preference depends on the *menu of available priors* rather than just the outcomes. When the set of priors shrinks, the "worst-case prior" changes. This violates the principle that preferences should depend only on the consequences of the acts, not on the description of the uncertainty (the width of the interval).

  **Conclusion:** The reversal is not a calculation error but a structural feature of Maxmin Expected Utility. It demonstrates that **rational choice under ambiguity is not dynamically consistent** in the same way Bayesian choice is. Reducing imprecision (narrowing the interval) is structurally distinct from Bayesian conditioning; it alters the *weight* of the ambiguity aversion, allowing a riskier option (B) to become viable once the "fear of the unknown" is sufficiently reduced, even if the known risk remains unchanged.
