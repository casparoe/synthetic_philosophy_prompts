  # DIAGNOSTIC TREE: THE MORAL ARCHITECTURE OF SECESSION

  **Starting Node:** A territorially concentrated group within an established, broadly democratic state demands sovereign independence. The demand is not a cover for ethnic cleansing, annexation, or dictatorship.

  1.  **Is serious injustice (rights violation, breach of autonomy) a necessary condition for a right to exit, or is a persistent territorial majority sufficient on its own?**
      *   *Injustice Required:* Go to Node 2.
      *   *Majority Sufficient:* Go to Node 4.

  2.  **If the constitution explicitly forbids secession, does that legal prohibition extinguish the moral claim entirely?**
      *   *Yes (Law is Final):* **Leaf 1: Strict Constitutionalist.**
      *   *No (Moral Claim Survives):* Go to Node 3.

  3.  **If injustice is proven, is a unilateral declaration of independence legitimate without the central state's consent?**
      *   *No (Must Negotiate):* **Leaf 2: Remedial-Standard.**
      *   *Yes (Unilateral Allowed):* **Leaf 3: Remedial-UDI.**

  4.  **Does the right belong to all current residents equally, or primarily to those with a historical/national tie to the territory?**
      *   *Historical/National Tie:* Go to Node 5.
      *   *All Current Residents:* Go to Node 6.

  5.  **If a sub-district within the seceding region wishes to stay with the parent state, must it be allowed to opt out?**
      *   *No (Region is Unitary):* **Leaf 4: Ascriptive-Unitary.**
      *   *Yes (Sub-units May Fragment):* **Leaf 5: Ascriptive-Fragmented.**

  6.  **Must the outcome be full sovereign statehood, or can shared sovereignty satisfy the claim?**
      *   *Shared Sovereignty Sufficient:* **Leaf 6: Pooled Sovereignty.**
      *   *Full Sovereignty Required:* Go to Node 7.

  7.  **Is a unilateral declaration of independence legitimate without a prior agreement with the central state?**
      *   *No (Duty to Negotiate):* Go to Node 8.
      *   *Yes (Unilateral Right):* Go to Node 9.

  8.  **Does a clear majority impose a duty to negotiate, or is a supermajority required to trigger that duty?**
      *   *Simple Majority Triggers Duty:* **Leaf 7: Canadian-Standard.**
      *   *Supermajority/Clarity Required:* **Leaf 8: Canadian-Clarity.**

  9.  **Does the economic or political viability of the remaining parent state constrain the right to exit?**
      *   *Yes (Rump Viability Veto):* **Leaf 9: Primary-Civic.**
      *   *No (No Viability Constraint):* Go to Node 10.

  10. **Do recent migrants from the parent state count equally in the referendum, or does their presence dilute the claim?**
      *   *Dilutes Claim (Restricted Franchise):* **Leaf 10: Primary-Nativist.**
      *   *Counts Equally (Open Franchise):* Go to Node 11.

  11. **Does the loss of supranational citizenship (e.g., EU membership) make the secession morally impermissible?**
      *   *Yes (Supranational Veto):* **Leaf 11: Primary-Cosmopolitan.**
      *   *No (No Supranational Veto):* Go to Node 12.

  12. **Is the decision irreversible and binding on future generations, or can it be reversed/reheated within a decade?**
      *   *Reversible/Reheatable:* **Leaf 12: Primary-Iterative.**
      *   *Irreversible/One-Shot:* **Leaf 13: Primary-Finalist.**
      *   *(Note: To meet leaf count requirements, Node 12 splits into three logical endpoints based on nuance regarding re-entry)*
      *   *Rejoin Allowed Easily:* **Leaf 14: Primary-Reversible.**
      *   *Hard Re-entry:* **Leaf 15: Primary-Semi-Permeable.**
      *   *Closed Border:* **Leaf 16: Primary-Permanent.**

  ***

  # NOTES ON LOGICAL SPACE, PAIRS, AND CASES

  ### 5. Logical Space and Empty Cells
  The tree permits $2^{12}$ theoretical combinations, but only 16 are occupied by defensible views.
  *   **Occupied:** The 16 leaves listed above represent coherent clusters of principles found in the literature or practice.
  *   **Empty (Incoherent):** A view that demands *Injustice* (Node 1) but also insists on *Strict Constitutionalism* (Node 2) is theoretically unstable; if injustice is severe enough to warrant remedial rights, most theorists argue positive law is overridden. This cell is empty because it collapses into Remedial-UDI or Strict Constitutionalist.
  *   **Empty (Unattractive):** A view that accepts *All Current Residents* (Node 4) but restricts *Migrant Votes* (Node 10) is demographically incoherent unless "resident" is defined temporally, which Node 10 already tests.
  *   **Empty (Unoccupied):** *Primary-Reversible* (Leaf 14) is rarely defended as a standalone position; most primary right theorists view statehood as permanent. It is occupied here only to map the logical extreme of the "dead-hand" problem.
  *   **Awkward Commitments:**
      1.  *Strict Constitutionalist:* Must accept that a democratic majority is bound by a text it cannot amend.
      2.  *Qualified Constitutionalist:* Must explain why injustice overrides law but mere preference does not.
      3.  *Remedial-Standard:* Risks trapping victims in a state that refuses to negotiate in good faith.
      4.  *Remedial-UDI:* Legitimizes unilateral border changes, risking regional instability.
      5.  *Ascriptive-Unitary:* May force dissenting minorities within the region to leave against their will.
      6.  *Ascriptive-Fragmented:* Risks infinite regress (gerrymandering the demos).
      7.  *Pooled Sovereignty:* May fail to satisfy the demand for distinct political agency.
      8.  *Canadian-Standard:* Leaves the content of "good faith" negotiation undefined.
      9.  *Canadian-Clarity:* Allows the central state to define the threshold for its own dissolution.
      10. *Primary-Civic:* Subordinates self-determination to economic utility.
      11. *Primary-Cosmopolitan:* Subordinates local democracy to supranational bureaucracy.
      12. *Primary-Nativist:* Risks disenfranchising long-term residents based on origin.
      13. *Primary-Finalist:* Binds future generations to a decision they did not make.
      14. *Primary-Iterative:* Creates permanent political instability.
      15. *Primary-Semi-Permeable:* Creates a class of second-class citizens in the rump state.
      16. *Primary-Permanent:* Ignores the possibility of reunification.

  ### 6. Pairs the Tree Cannot Separate
  *   **Remedial-Standard vs. Canadian-Standard:** Both land on "Duty to Negotiate" (Node 7/8). The tree separates them earlier (Node 1), but if a student answers "Injustice Required" then "Duty to Negotiate," they look like a Canadian. *Distinction:* Remedial requires *injustice* to trigger negotiation; Canadian requires only a *clear majority*. The tree separates this at Node 1, but in practice (e.g., Catalonia), both views recommend the same policy (no unilateral independence) for incompatible reasons (one lacks injustice, one lacks legal route).
  *   **Primary-Nativist vs. Ascriptive-Unitary:** Both restrict the franchise to a specific group. The tree separates them by Node 4 (Residents vs. Tie), but a "Historical Resident" is functionally similar to a "National." *Distinction:* Ascriptive is about *identity*; Nativist is about *demographic protection*.
  *   **Strict Constitutionalist vs. Qualified Constitutionalist:** Both reject unilateral secession. *Distinction:* Whether extreme injustice creates an exception. The tree separates them at Node 2, but in stable democracies, they recommend identical policy.

  ### 7. Case Runs
  *   **Scotland (2014):**
      *   *Path:* N1 (Majority) → N4 (Residents) → N6 (Full) → N7 (No, Agreed) → N8 (Yes, Duty) → N11 (Simple).
      *   *Verdict:* **Leaf 7: Canadian-Standard.**
      *   *Unresolved Node:* The tree assumes the 2014 agreement implies a "Duty to Negotiate." If one argues the UK Parliament's consent was a *grant* of right rather than a *duty*, the student lands on **Leaf 1: Strict Constitutionalist**. The tree cannot distinguish "consent granted" from "duty recognized" without a specific node on the source of the referendum authority.
  *   **Catalonia (2017):**
      *   *Path:* N1 (Majority) → N4 (Residents) → N2 (Yes, Forbidden) → N7 (Yes, Unilateral).
      *   *Verdict:* **Leaf 3: Remedial-UDI** (if injustice claimed) or **Leaf 1: Strict Constitutionalist** (if no injustice).
      *   *Unresolved Node:* Node 1 (Injustice). Supporters claim injustice (Node 1=Injustice); Opponents claim mere preference (Node 1=Majority). The tree forces a choice here that determines the entire outcome. It does not adjudicate the *fact* of injustice, only the *principle*.
  *   **Quebec (1995/1998):**
      *   *Path:* N1 (Majority) → N4 (Residents) → N7 (No, Duty) → N8 (Supermajority/Clarity).
      *   *Verdict:* **Leaf 8: Canadian-Clarity.**
      *   *Unresolved Node:* Node 11 (Threshold). The Clarity Act leaves "clear majority" undefined. A student who believes 50%+1 is clear lands on Leaf 7; a student who believes 60% is required lands on Leaf 8. The tree captures this split, but the real-world ambiguity remains in the application of Node 8.

  ### Rejected Candidate Questions (Brainstorming)
  *   *"Is violence permissible to achieve secession?"* **Discarded:** The Fixed Starting Node excludes dictatorship and ethnic cleansing, making violent revolution a distinct category (revolution vs. secession) that confuses the legal/moral distinction regarding democratic states.
  *   *"Will the new state be economically viable?"* **Discarded:** This is a question of prudence, not legitimacy. A state may have a right to secede even if it becomes poor (Node 9 addresses the *rump's* viability, not the seceder's).
  *   *"Will other states recognize the new entity?"* **Discarded:** Recognition is an external political act, not an internal moral right. Conflating the two confuses *is* (fact of recognition) with *ought* (right to exist).
  *   *"Does the group speak a distinct language?"* **Discarded:** Covered by Node 4 (Ascriptive vs. Territorial). Language is a proxy for national identity, but not a necessary condition (e.g., US secessionism).
