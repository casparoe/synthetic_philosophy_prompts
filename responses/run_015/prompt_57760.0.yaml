answer: |-
  ### The Essay Question

  **Topic:** The Weight of the Shell

  **Prompt:**
  Imagine we discover that brain size never *causes* intelligence or suffering—it's just a shadow that follows them perfectly. It adds nothing to the mind, yet every smart creature has a large brain and every suffering creature has a large brain. Given this, does the physical size itself deserve moral respect, or only the feelings and thoughts it shadows? 

  Furthermore, imagine tomorrow we find the tracking fails in one direction: a species with massive brains but empty minds (no pain, no thought). Do we treat them as kings because of their size, or nobodies because of their emptiness? Explain why your choice reveals what we actually value: the hardware, or the light inside it.

  ***

  ### Model Answer 
  If brain size is merely a shadow—a perfect correlate that causes nothing—then logically, it should hold no moral weight. We value minds for what they feel and think, not for the ounces of gray matter housing them. If a small bird suffers as deeply as a large dog, the dog's extra bulk is morally irrelevant. To think otherwise is to worship the container instead of the content. This is the clean, functionalist view: morality tracks experience, not anatomy. Under this framework, the physical size is just noise, a biological coincidence like height or weight.

  However, the prompt asks us to face a stubborn intuition: that a larger brain implies a richer inner life, even beyond testable capacities. Why might this feel true? Perhaps because size suggests complexity. A larger library holds more books, even if we haven't read them all. We might respect the *potential* depth of a large brain, viewing it as a reserve of possible experience that a smaller brain physically cannot hold. In this view, the physical structure itself commands respect, not just because of what it does, but because of what it *is*. We treat a cathedral differently than a shed, even if both hold the same number of people at noon. The capacity for grandeur matters, even if unutilized. There is a sense that a larger engine possesses a dignity even when idling, simply because it *could* roar.

  This tension breaks open when the tracking stops being perfect. Suppose we find a creature with a massive brain but no inner life—no pain, no thought, just silent biology. This is the divergence bonus: the correlation breaks in one direction. If we valued only the shadowed traits (suffering/intelligence), this creature is morally negligible. It feels nothing, so harming it is like harming a rock. But if we valued the size itself as a marker of potential or structural worth, we face a crisis. Do we protect the empty vessel because it *looks* like it should matter? Or do we discard it because the light inside is off?

  Here, the honest answer reveals our true bias. If we hesitate to harm the empty big-brain, we admit we value the biological hardware independently of experience. We are treating the brain as a sacred object, not just a tool for feeling. This is dangerous. It suggests we might prioritize a human in a permanent vegetative state over a fully conscious pig simply because the human hardware is larger. If we readily dismiss the empty brain, we confirm that only the shadow matters. We admit that morality is about the light, not the lamp.

  Most of us will hesitate. This suggests that brain size isn't just a proxy; it's a symbol of moral status we've conflated with capacity. We assume complexity equals worth. But if the link breaks, we must choose: do we protect the potential for mind, or only the presence of mind? If we choose potential, we risk valuing shells over souls. We might end up protecting empty heads because they look impressive. If we choose presence, we must accept that a tiny brain can hold as much moral weight as a huge one, provided the light inside burns equally bright. The size of the lamp matters less than the brightness of the bulb, but we are conditioned to respect the wattage of the fixture. In the end, if size causes nothing, respecting it is superstition. We must decide if we are moralists or fetishists of flesh.

  ***

  ### Marking Scheme (Out of 15)

  **Automatic Zero (The "History Dump" Rule)**
  *   **0 Points:** Any essay that spends more than 3 sentences reciting the history of 19th-century craniometry, racist skull-measuring, or eugenics *unless* it explicitly uses that history to explain why we are currently biased toward the "size matters" intuition. Knowing the history is not philosophy; using it to diagnose the moral problem is.

  **Level 1: The Basics (0–5 Points)**
  *   **1–2:** Understands the prompt but fails to take a stance.
  *   **3–4:** Takes a stance (size matters vs. doesn't matter) but treats the "shadow" scenario as a simple trick question ("Obviously it's just a proxy").
  *   **5:** Clearly states whether size has intrinsic weight or only instrumental weight.

  **Level 2: The Argumentative Moves (6–10 Points)**
  *   **6–8 (The 10-point essay):** Identifies that if size causes nothing, it *shouldn't* matter logically. Addresses the "empty brain" scenario by choosing one side (protect it or discard it). The reasoning is consistent but surface-level (e.g., "We should protect life" without defining what life is).
  *   **9–10:** Successfully argues why someone might *feel* size matters (the intuition of complexity/potential) even if logically it shouldn't. Handles the "empty brain" scenario without contradicting their earlier premise.

  **Level 3: Nuance and Insight (11–15 Points)**
  *   **11–13 (The 14-point essay):** 
      *   **The Move:** Explicitly names the conflict between "hardware respect" and "experience respect."
      *   **The Move:** Uses the "divergence" (empty brain) to test the consistency of their own view (e.g., realizing that valuing size protects vegetative humans over conscious animals).
      *   **The Move:** Avoids jargon; explains concepts like "potential" or "capacity" using analogies (libraries, engines, lamps).
  *   **14–15 (The Perfect essay):** 
      *   **The Move:** All of the above, plus identifies the *danger* of the intuition. 
      *   **The Move:** Concludes by reframing the question: it's not about brains, it's about whether we are "moralists or fetishists of flesh." 
      *   **Distinction:** A 10 answers the question. A 14 explains why the question makes us uncomfortable. A 15 does both with exceptional clarity.

  **Penalties**
  *   **-2:** Using academic jargon (e.g., "epiphenomenalism," "deontology") without defining it simply.
  *   **-2:** Ignoring the "divergence" bonus (the empty brain scenario).
  *   **-5:** Claiming brain size *does* cause intelligence despite the prompt's explicit instruction to assume it doesn't.
