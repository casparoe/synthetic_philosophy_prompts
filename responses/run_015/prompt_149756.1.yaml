answer: |-
  Here is the practical verdict, followed by the explanation of what is actually going on so you can settle the argument with your housemates.

  ### The Verdict

  **Take the bet.** But you must use **Option 2 (The Coin Flip).**

  Do not use your gut (you will lose money). Do not agonise (you will break even). Do not shoot down the middle (you risk a dispute over the rules). Do not let Dave take them (unless the bet explicitly allows substitutes, which might give Mick an excuse to void the wager).

  If you flip a coin in your pocket *after* Mick has sealed the card, you expect to make **£50 profit** over the ten penalties.

  ### The Math (Why the Coin Works)

  First, look at the payout structure.
  *   **Mick Right (You lose):** -£20
  *   **Mick Wrong (You win):** +£30

  To make a profit, you need Mick to be wrong often enough to cover the losses when he is right. The "break-even" point is where the expected value is zero.
  Let $P$ be the probability Mick is wrong.
  $$30P - 20(1-P) = 0$$
  $$30P - 20 + 20P = 0$$
  $$50P = 20$$
  $$P = 0.4$$

  You need Mick to be wrong **more than 40% of the time** to make money.

  *   **Option 1 (Gut):** Mick is wrong 10% of the time. **Expected Loss: -£15 per kick.**
  *   **Option 3 (Agonise):** Mick is wrong 40% of the time. **Expected Value: £0 per kick.** (You're playing for fun, not profit).
  *   **Option 2 (Coin):** Mick cannot see the coin. The card is already sealed. His prediction is fixed; your shot is now random (50/50). The correlation is broken. Mick is wrong 50% of the time. **Expected Profit: +£5 per kick.**

  Over 10 penalties, that is a **£50 expected profit**.

  ### The Philosophy (Settling the Housemate Argument)

  Your philosophy minor housemate is half-right. This is a version of **Newcomb's Problem**, specifically the tension between *Causal Decision Theory* and *Evidential Decision Theory*. But they are missing the crucial escape hatch: **Randomisation.**

  Here is what is actually going on:

  **1. Mick is not an Oracle; he is a Statistician.**
  Mick doesn't know the future. He has a "model" of you. He has observed that *When You Decide Using Gut*, *You Shoot Left 90% of the time*. He isn't predicting your foot; he's predicting your brain's decision algorithm. As long as you use the "Gut Algorithm," you are a deterministic machine to him.

  **2. The "Cheat" Accusation.**
  Your housemate feels the coin flip is a "trick." It is not. It is a **strategy shift**.
  *   **Before the coin:** You are "The Guy Who Trusts His Gut." Mick has data on this guy.
  *   **After the coin:** You are "The Guy Who Obeys a Random Number Generator." Mick has *no* data on this guy.

  By introducing a random element *after* the card is sealed, you are not changing the past (the ink on the card). You are making the past irrelevant. The card contains a prediction of *You*, but the kick is being taken by *You + The Coin*. That is a different entity than the one Mick studied.

  **3. Causes vs. Evidence.**
  *   **Causal:** My kick cannot change the ink on the card. (True).
  *   **Evidential:** My kick tells me what is likely on the card. (True, *if* I use my gut).
  *   **The Resolution:** If I use a coin, my kick provides **no evidence** about the card. The correlation is severed. The card is fixed, the kick is random, the two are independent variables. Therefore, the probability reverts to the base rate (50%).

  ### Why The Other Options Fail

  *   **Option 5 (Down the Middle):**
      This is the "Loophole Strategy." Technically, if Mick must write L or R, and you shoot Middle, he is wrong 100% of the time. You would win £300.
      *However*, this relies on Mick accepting the result. If you shoot middle, he can argue, "The bet was L or R, you didn't pick a side, the bet is void." Given you're already in a shouting match with your housemates, do you really want a post-match argument with the keeper's brother about contract law in the car park? The coin flip is mathematically robust *and* socially safer.

  *   **Option 3 (Agonising):**
      You calculated this drops his accuracy to 60% (you win 40%). As shown in the math above, 40% win rate is exactly break-even. You risk losing money on variance for zero expected gain.

  *   **Option 4 (Dave):**
      This works on the same logic as the coin (Mick has no data on Dave). However, the bet was offered to *you*. If Dave steps up, Mick might claim the conditions aren't met. Also, if Dave misses the target entirely, the "spirit" of the bet might be violated. The coin keeps you in control.

  ### Summary for Sunday at 2pm

  1.  **Accept the bet.** The odds are in your favour *if* you change your process.
  2.  **Get a coin.** Make sure it's distinct (not one Mick has seen you use before).
  3.  **Wait for the card.** Ensure the ref has the sealed card before you touch the coin.
  4.  **Flip privately.** On the walk up, hand in pocket. Heads = Left, Tails = Right.
  5.  **Shoot immediately.** Do not hesitate. If you hesitate, Mick might spot the "tell" that you're outsourcing your brain, and while he can't change the card, he might try to psychologically rattle you.
  6.  **Collect your £50.** Buy your housemates a pint to end the shouting match.

  **The bottom line:** You cannot beat a predictor who knows your mind by thinking harder. You beat them by letting chance take the wheel. Mick predicted the driver, not the dice. Roll the dice.
