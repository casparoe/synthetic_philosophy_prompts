prompt: |-
  I've been trying to sort out the realism/instrumentalism debate about neural network interpretability, and I'm stuck on what counts as a representation. If researchers find a linear direction in a transformer's activations that lights up on inputs about poison, and then they can patch that direction to change the model's behavior, doesn't that basically settle it: the model represents poison? I thought a representation was supposed to be a causally relevent internal state, not just a correlation, so patching should be the kind of evidence that matters.

  My confusion is that I keep hearing people say the network doesn't really 'have' the concept, but if the direction is causally active, isn't that just what it means to have a representation? I'm not asking whether the model believes poison is bad or whether it has consciousness, just whether the word 'representation' is doing real work or is just a loose way of talking about useful patterns.

  Then I read about superposition and polysemanticity, where a single neuron or direction might be a mix of several features, and I'm not sure whether that just makes representations harder to find or whether it undermines the whole realist picture. Can you explain what an anti-realist or instrumentalist is still objecting to once patching works? Is 'the network represents poison' a substantive claim, or is it just shorthand for 'there is a pattern we can use to predict or intervene on behavior'?
