      *   **Realism:** Representations are mind-independent (or model-independent) structures that exist within the system. They are "real" entities.
      *   **Instrumentalism:** Representations are useful fictions/tools for *us* to predict/explain the system's behavior. They don't necessarily exist *in* the system in a robust ontological sense.
      *   **Causal Role:** The user leans towards a causal theory of representation (if it does the work, it's real).
