      *   *Objection 2: Superposition/Polysemanticity.* If direction $d$ encodes "poison" + "royalty" + "negative sentiment" depending on context, is it really a "poison representation"? Or is it just a bundle of correlations that *looks* like poison in my test set?
      *   *Objection 3: Content Determination.* What makes it about *poison* specifically? Why not "things that kill rats"? Why not "toxins"? The causal link doesn't fix the *semantic content*. (The Disjunction Problem).
