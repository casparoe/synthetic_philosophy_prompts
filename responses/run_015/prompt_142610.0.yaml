answer: |-
  Here is the plan. It respects your constraints, targets the specific cognitive bugs of a technical audience, and keeps the metaphysics out of the engine room.

  ### 1. The Order of Operations
  Your instinct is correct, but the "breaking" needs to be more specific. Do not break "You are not special." Break **"You are fixed."**

  *   **0–15 mins: The Guarantee Test (The Break).**
      *   Do not name SSA or SIA. Do not mention Bayes yet.
      *   Put the Guarantee Test on the board immediately. *"Before we calculate anything: Under Hypothesis A, was there a physical chance that the entity currently having this experience would have been a different entity?"*
      *   If they say "No" (I am essentially me), anthropics dissolves. If they say "Yes" (I could have been one of the other 10,000), counting becomes possible.
      *   **Why here?** This establishes the *sample space*. If they don't accept they are a variable sample from a set of observers, the rest is noise.
      *   **Bias Warning:** This test quietly favors SIA. It frames existence as a lottery ticket. SSA requires a second step ("...and I should assume I'm a typical ticket"). Acknowledge this tension: *"Accepting you could have been others gets us to the starting line. It doesn't tell us how to bet."*

  *   **15–20 mins: The Bridge.**
      *   Between the Break and the Naming, you must establish **what is being updated**.
      *   Show them that standard Bayes updates on *evidence given a world*. Anthropics updates on *the world given that there is evidence*.
      *   Draw the tree: World -> Observers -> You.
      *   SSA cuts the tree at "Observers -> You" (Sampling).
      *   SIA cuts the tree at "World -> Observers" (Existence).
      *   *Now* you can name them. They have earned the acronyms.

  ### 2. The Central Case
  You need a case where the **Proportion** of observers with your evidence is fixed, but the **Total Number** of observers varies.

  **The Case: The Two Server Farms**
  *   **Hypothesis S (Small):** 1 Server is turned on. It runs **100** user instances.
  *   **Hypothesis L (Large):** 1 Server is turned on. It runs **100,000** user instances.
  *   **Prior:** 50/50 (God flips a coin to pick the Server config).
  *   **Evidence:** You boot up and see the message "System Ready." (Every instance sees this).
  *   **The Fixed Variable:** The **Proportion** of observers who see "System Ready" (100% in both cases).
  *   **The Variable:** The **Absolute Count** of observers (100 vs 100,000).

  **Why this works:**
  *   **SSA:** "I am a random sample from the users." Since 100% of users see the message in both worlds, the likelihood ratio is 1:1. **No Update.** (Probability remains 50/50).
  *   **SIA:** "I am a random existence." There are 1,000 times more existences in L. **Update strongly to L** (1000:1 odds).

  **What happens if you hold the wrong thing fixed?**
  *   **If you fix Total Observers** (e.g., 100 users in both, but different message rates): This becomes standard Bayes. Both rules agree. Anthropics disappears.
  *   **If you fix Absolute Evidence Count** (e.g., 1 user sees "Error" in S, 1 user sees "Error" in L): SSA favors S (1/100 vs 1/100,000). SIA says Equal (1 existence vs 1 existence). They diverge, but it confuses the "Presumptuous" intuition.
  *   **The Lesson:** Anthropics only bites when **Total Population** varies while **Conditional Probability of Evidence** stays constant.

  ### 3. Misconceptions & Kill Order
  Address these exactly when they threaten to derail the specific segment.

  1.  **"SIA is just Bayes with extra steps."**
      *   **Kill:** During the Central Case derivation.
      *   **Script:** "Standard Bayes asks: 'Given the world, what are the odds I see this?' SIA asks: 'Given I see this, how many worlds contain a me?' It modifies the prior probability of the *world* based on the number of observers it contains. That is not standard likelihood; it is an anthropic prior."
  2.  **"This is just the Reference Class Problem."**
      *   **Kill:** Immediately after Naming (min 20).
      *   **Script:** "It is. But for tonight, the Reference Class is 'Entities running this code.' If you change the class, the numbers change, but the *mechanism* we are debugging remains the same. We are testing the engine, not the fuel."
  3.  **"The Presumptuous Philosopher is obviously wrong."**
      *   **Kill:** After the Central Case (min 45).
      *   **Strategy:** Don't defend the conclusion. Defend the *structure*.
      *   **Script:** "It feels wrong because it lets you know about the universe without looking out the window. But SSA lets you know about the future of humanity (Doomsday) without looking at the stars. Both allow 'armchair cosmology.' The question is which error is cheaper: Believing the world is big because you exist (SIA), or believing the world is small because you are early (SSA)?"
  4.  **"Infinite Observers / Probabilities Undefined."**
      *   **Kill:** Pre-emptively in the intro.
      *   **Script:** "We are in Finite Land. If N goes to infinity, the measure problem breaks everything. We are not solving the measure problem today. If your objection requires infinity, write it down for the pub, but it doesn't apply to the Server Farm."
  5.  **"Doomsday Argument is the same thing."**
      *   **Kill:** By Ban.
      *   **Script:** "Half of you know Doomsday. Doomsday is an *application* of SSA. We are building the tool, not building the bomb. No Doomsday examples."

  ### 4. The Guarantee Test Placement
  *   **Placement:** **Early (0–15 mins).**
  *   **Reason:** It is a precondition. If they cannot conceive of themselves as contingent observers, SSA/SIA are meaningless.
  *   **Bias:** Yes, it favors SIA. It makes "I could have been someone else" salient.
  *   **Mitigation:** When you introduce SSA later, explicitly revisit it. *"The Guarantee Test says you could have been others. SSA adds: '...so you should assume you are a **random** other.' SIA says: '...so you should assume you are **any** other.'"*

  ### 5. The Transfer Check (The Agreement Case)
  Neither of your proposed cases results in agreement.
  *   *Your Case 1 (100 vs 100k, 10 vs 10k evidence):* SSA says No Update (10% vs 10%). SIA says Update to Large (10 vs 10k existences). **Disagree.**
  *   *Your Case 2 (1 vs 1k, 1 vs 1 evidence):* SSA says Update to Small (100% vs 0.1%). SIA says Update to Large (1 vs 1k existences). **Disagree.**

  **The Case You Need: The Same-Size Worlds**
  *   **Hypothesis A:** 1,000 observers. 10 have your evidence.
  *   **Hypothesis B:** 1,000 observers. 100 have your evidence.
  *   **Priors:** 50/50.
  *   **Result:** Both rules favor B by 10:1.
      *   **SSA:** (10/1000) vs (100/1000). Ratio 1:10.
      *   **SIA:** (10 existences) vs (100 existences). Ratio 1:10. (Total population cancels out).
  *   **Why this tests transfer:** If they have memorized "SIA favors big worlds," they will incorrectly favor B *more* than 10:1, or favor B when the numbers are equal. If they understand the *mechanism*, they will see that when Total N is fixed, SIA collapses into standard Bayes/SSA.
  *   **Question to ask:** "In this case, does the sheer size of the population matter? Why or why not?"
      *   *Correct Answer:* "No, because the population size is identical in both hypotheses, so the anthropic weight cancels out."
      *   *Pattern Match Answer:* "SIA always favors the larger number."

  ### 6. What to Refuse to Explain
  Be explicit. Put this on a slide titled **"Out of Scope."**

  1.  **The Measure Problem:** "We are not doing infinite sets. If the math breaks at infinity, we acknowledge it and move on." (Stops the SIA = Infinity objection).
  2.  **Fine-Tuning:** "That is a physics application of these rules. We are debugging the rules, not the universe."
  3.  **Boltzmann Brains:** "This is a specific edge case of the Measure Problem. See point 1."
  4.  **Infinite Ethics:** "We are calculating probabilities, not utility. Whether a large world is *better* is a different question than whether it is *more likely*."

  ### Summary of the Flow
  1.  **Guarantee Test:** Break "I am fixed." (15m)
  2.  **Server Farm Case:** Diverge SSA/SIA by fixing Proportion, varying Total N. (30m)
  3.  **Naming & Misconceptions:** Label the tools, kill the "SIA = Bayes" and "Infinity" objections. (15m)
  4.  **Presumptuous Philosopher:** Discuss the "cost" of each error. (15m)
  5.  **Same-Size Transfer:** Verify they understand the mechanism, not the slogan. (15m)

  This keeps them in the structure, prevents the "Team SSA vs Team SIA" tribalism until they understand the machinery, and gives them a computational handle (the Server Farm) that programmers can visualize without getting lost in cosmology.
