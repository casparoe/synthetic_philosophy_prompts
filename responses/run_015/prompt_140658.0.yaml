  *   **No:** Go to **Q2**.

  **Q2. The Hallucination (Case A)**
  *Two people lift a heavy branch together. They coordinate perfectly. However, each thinks the other is a hallucination (or one is a human and the other a dumb robot with no beliefs). Neither has any belief that the other exists. Is this joint action?*
  *   **Yes:** Go to **Leaf 1 (Deflationary/Minimalist)**.
  *   **No:** Go to **Q3**.
      *(Note: This is where Case A does its work. It separates views that require mutual knowledge from those that do not.)*

  **Q3. The Mismatched Script (Case B)**
  *Two actors spar on stage. Their movements match perfectly. One thinks, "We are rehearsing." The other thinks, "We are performing opening night." They disagree on the description of the activity, but their subplans mesh. Is this joint action?*
  *   **Yes:** Go to **Leaf 2 (Shared Intention)**.
  *   **No:** Go to **Q4**.
      *(Note: This is where Case B does its work. It separates views that allow meshing subplans from those that require a shared description.)*

  **Q4. The Unilateral Quit**
  *We are walking together. I decide I want to stop walking and sit down. Do I need your permission (or at least to negotiate) to end the joint action of "walking together," or can I just stop?*
  *   **I need permission/negotiation:** Go to **Q5**.
  *   **I can just stop:** Go to **Q6**.

  **Q5. The Normative Bond**
  *(Reached if you answered "I need permission" to Q4)*
  *If I walk away without permission, have I merely frustrated your plans, or have I wronged you (violated a right you have against me)?*
  *   **I have wronged you:** Go to **Leaf 4 (Plural Subject)**.
  *   **I have merely frustrated you:** Go to **Leaf 6 (Unnamed/Unoccupied)**.
      *(Note: Nobody defends the view that you need permission to quit but create no normative obligation.)*

  **Q6. The Construction**
  *Can the thought "We intend to do X" be fully analyzed as "I intend to do my part of X because I believe you will do your part"?*
  *   **Yes:** Go to **Leaf 2 (Shared Intention)**.
      *(Wait, if you came from Q3=No, you can't be Leaf 2. If you are here, you likely align with **Leaf 3 (Collective Intentionality)** but need to distinguish Searle from Tuomela. Let's refine the path.)*
      *Correction for Tree Logic:* If you are at Q6, you have already rejected the "Mismatch" (Q3=No). Bratman (Leaf 2) usually accepts Mismatch. So if you are at Q6, you are choosing between Searle and Tuomela.
      *Revised Q6:* **Is the capacity to think "We intend" built out of the capacity to think "I intend", or is it a separate basic ability?**
  *   **Built out of "I intend":** Go to **Leaf 3 (Collective Intentionality)**.
  *   **Separate basic ability:** Go to **Q7**.

  **Q7. The Biological Primitive**
  *(Reached if you answered "Separate basic ability" to Q6)*
  *Is this "We-intention" a state that exists solely in the individual's brain (as a biological primitive), or does it require a group-level entity?*
  *   **Solely in individual brains:** Go to **Leaf 3 (Collective Intentionality)**.
  *   **Requires group-level entity:** Go to **Q8**.

  **Q8. The Group Reason**
  *When I act as part of the group, am I acting on reasons that are mine (even if they concern the group), or am I acting on reasons that belong to the group as a unit?*
  *   **My reasons:** Go to **Leaf 3 (Collective Intentionality)**.
  *   **The Group's reasons:** Go to **Leaf 5 (We-Mode)**.

  ---

  ### The Leaves (The Positions)

  **Leaf 1: Deflationary / Minimalist**
  *   **Core Idea:** Joint action is nothing over and above coordinated individual action. It requires low cognitive bar (no mutual belief needed).
  *   **Proponents:** Butterfill, Michael, some interpretations of early Bratman.
  *   **Verdict on Cases:** (a) Yes, (b) Yes, (c) No.

  **Leaf 2: Shared Intention**
  *   **Core Idea:** Joint action requires interlocking individual intentions, mutual knowledge, and a commitment to mesh subplans. It is reductive (built from "I").
  *   **Proponents:** Michael Bratman.
  *   **Verdict on Cases:** (a) No, (b) Yes, (c) No.

  **Leaf 3: Collective Intentionality (We-Intentions)**
  *   **Core Idea:** "We-intend" is a primitive biological state in the individual mind. It cannot be reduced to "I-intend," but it still resides in the head.
  *   **Proponents:** John Searle.
  *   **Verdict on Cases:** (a) No, (b) No, (c) No.

  **Leaf 4: Plural Subject**
  *   **Core Idea:** Joint action creates a new normative entity (a plural subject) via joint commitment. Participants are bound to each other and cannot unilaterally withdraw.
  *   **Proponents:** Margaret Gilbert.
  *   **Verdict on Cases:** (a) No, (b) No, (c) No.

  **Leaf 5: We-Mode**
  *   **Core Idea:** Strongest view. Agents act as group members, using group reasons, with a collective goal accepted by the group. The group is the primary agent.
  *   **Proponents:** Raimo Tuomela.
  *   **Verdict on Cases:** (a) No, (b) No, (c) No.

  **Leaf 6: Unnamed / Unoccupied**
  *   **Core Idea:** Various incoherent or unexplored combinations (e.g., Solipsistic Joint Action, or Normative Deflationism).
  *   **Proponents:** None.

  ---

  ### Handling Your Three Stuck Cases

  1.  **Case (a) Agents who can't form views about others (Hallucinations/Robots):**
      *   **Separates:** Leaf 1 (Deflationary) from everyone else.
      *   **Logic:** If you think coordination without mutual belief counts, you are a Deflationist. If you think mutual belief is required, you are an Intentionalist (Leaves 2–5).

  2.  **Case (b) Coordinated but disagree on description (Rehearsal vs. Performance):**
      *   **Separates:** Leaf 2 (Shared Intention) from Leaves 3, 4, and 5.
      *   **Logic:** Bratman's "meshing subplans" allow for different descriptions of the same activity. Gilbert, Searle, and Tuomela generally require a shared commitment to the *same* goal description.

  3.  **Case (c) The Lone-Member Case (No group exists):**
      *   **Separates:** **Nothing.**
      *   **Logic:** Every standard theory (Leaves 1–5) answers "No" to Q1. Joint action, by definition across the board, requires at least two actual participants. This case only separates standard theories from the unoccupied Leaf 6 (Solipsistic Joint Action).

  ---

  ### Unoccupied Combinations

  These are combinations of answers to the questions above that no serious theorist occupies.

  1.  **Q1 = Yes (Lone Member Joint Action)**
      *   **Status:** **Incoherent.**
      *   **Why:** The concept of "joint" logically entails plurality. A single agent acting alone is the definition of individual action, regardless of their internal mindset.

  2.  **Q2 = Yes (Hallucination counts) AND Q4 = Yes (Need permission to quit)**
      *   **Status:** **Unattractive / Unexplored.**
      *   **Why:** This claims you can have a normative bond (needing permission to quit) without mutual awareness (thinking the other is a hallucination). It is hard to motivate why I owe obligations to a hallucination or a dumb robot.

  3.  **Q6 = Yes (Reducible to "I") AND Q7 = Yes (Primitive Biological State)**
      *   **Status:** **Incoherent.**
      *   **Why:** A state cannot be both fully analyzable in terms of something else (reducible) and also a basic, unanalyzable primitive. You must choose one or the other.

  4.  **Q4 = Yes (Need permission) AND Q5 = No (No wrong committed)**
      *   **Status:** **Unattractive.**
      *   **Why:** This posits a requirement for permission that carries no normative weight. If I don't wrong you by ignoring your permission, the "requirement" is merely predictive, not normative, which collapses back into the "I can just stop" view.
