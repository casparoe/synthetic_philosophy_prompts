  This tree is designed to sort your reading group's intuitions into the standard philosophical positions on joint action. It proceeds through 8 concrete questions. Follow the path indicated by your answers.

  **Note on Case (c) (The Lone Member):** You will see this as Question 1. Be aware that *all* standard theories of joint action answer "No" to this case. It does not separate the standard leaves (Bratman, Gilbert, etc.) from one another; it only separates standard theories from a hypothetical, unoccupied "Solipsist" view. It is included to clear the logical ground.

