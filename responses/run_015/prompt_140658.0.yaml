  ### The Branch Questions

  **Q1. The Empty Choir (Case C)**
  *I intend to sing the alto part in a choir. Unbeknownst to me, the choir was cancelled and everyone else stayed home. I sing my part perfectly at the right time. Did I perform a joint action?*
