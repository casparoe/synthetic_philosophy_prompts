prompt: |-
  Act as a professional philosopher who has genuinely worked on the surprise exam paradox and its cousins — the unexpected hanging, Moorean and self-referential propositions, that whole neighbourhood. Please think carefully and lay out the candidate options before you commit to anything; I'd much rather watch you brainstorm and then pick than get a confident one-paragraph answer. And dont bother with citations or any literature review, I know that stuff and I'll fill it in myself.

  Here's the situation. My colleague Dan (he's in the logic group here, and he's been chewing on this paradox for years) has given verdicts on a long series of variants, and I'm co-authoring a short paper with him. Before I send him the draft I want to know what he's going to say about a variant he has never seen, because if he disagrees with me I'd rather find out now. I'm less interested in the bare verdict than in the rule he's running, the other rules that fit his track record just as well, and which case would separate them.

  His track record, roughly in the order I remember it:

  1. One-day version: announced Sunday night, "there will be exactly one exam tomorrow (Monday) and you won't know which day it is until Monday morning." Dan: unfulfillable, flat contradiction, nothing interesting going on.

  2. Classic five-day version, Mon–Fri, announced Sunday night, students ideal reasoners, teacher known to be scrupulously truthful. Dan: fulfillable — the exam can be on Friday and it does surprise them. His reason, as near as I can reproduce it: the backward induction is a reductio that ends in "the announcement is false," so once the students have run it they can't use the announcement to conclude anything about Friday, and for the same reason the induction never gets started on the earlier days either.

  3. Same as (2) except the students are only about 90% sure the teacher is telling the truth. Dan: even more obviously fulfillable; the induction needs them to *know* the announcement, and here they don't.

  4. Rolling-horizon version: the teacher reserves the right to add a day to the week whenever the last day arrives with no exam, so there is never a knowable last day. Dan: trivially fulfillable, no base case for the induction — which he takes to show that the finite horizon is doing real work in (2).

  5. The students are reliably told the day on Sunday morning, i.e. *before* the teacher makes the standard announcement. Dan: the announcement is simply false, there's no surprise, end of story.

  6. The students run the induction, convince themselves there will be no exam at all, and are therefore gobsmacked on the Wednesday. Dan: the shock is neither here nor there; whether the announcement is satisfied turns on whether they knew (or could have come to know), not on how they felt.

  7. I once asked him whether anything changes if the teacher phrases it as "you won't be able to work out which day from this announcement" instead of "you won't know." He said no, its the same claim, same verdict.

  The new case, which he hasn't seen. Mon–Fri week again, ideal students, teacher scrupulously truthful, everything else as in (2). But this class has a published syllabus, issued by the registrar's office — independent of the teacher, perfectly reliable, everyone has read it — which states that the course has exactly one exam next week, on one of Monday to Friday. And the teacher's Sunday-night announcement contains *only* the surprise clause: "You won't know which day the exam is on until the morning of the exam." He doesn't repeat the existential claim; he doesn't need to, it's in the syllabus. So the students get the "there is exactly one exam in the window" part from one source and the "you won't know in advance" part from another.

  Questions. Is the teacher's clause satisfiable — is there a day such that, if the exam is on that day, what he said is true? If so, which days? In particular, is Friday still available, or has splitting the sources somehow made Friday the one day that *can't* work, which would be a nice reversal of the usual story where Friday is the paradigm case of a successful surprise? What will Dan say, and why?

  What I want from you: the rules that fit his seven verdicts (I can think of two or three myself and I'll be annoyed if you only find one), what each of them predicts about the split-source case and especially about Friday, your best guess at Dan's answer with the reasons for preferring that rule over the others, and — this is the part I most want — the further variant you'd put to him to settle it. My own candidate probe is a mid-week leak: suppose someone outside the setup, say the dean, emails the students on Wednesday evening to tell them the exam is Thursday. On one reading that falsifies the clause (they knew in advance, by whatever route); on another it's irrelevant, because the clause was already satisfied on Sunday night when they couldn't work it out. Is that the cleanest probe, or is there a better one? Also: should Dan's answer to the split-source case change if the teacher *does* repeat "there's exactly one exam next week" in his own email rather than leaning on the syllabus — and if so, what does that tell us about which rule he's running?
