answer: |-
  **Producer's Note on Scientific Context (Read Before Recording)**
  *For the purpose of your class assignment, it is crucial you frame Dr. Mirek's "Skeletal Invariantism" correctly. In actual cognitive science, the consensus is **not** on her side. The mainstream view (Connectionism, Deep Learning, HMAX models) holds that letter recognition is distributed, probabilistic, and robust to topological changes. Mirek's view is a radical, fringe minority position. The questions below are designed to highlight this tension. They assume the host knows the mainstream literature and is pressing Mirek on why her rigid topological rule survives in an era of flexible statistical models.*

  ***

  ### Interview Questions for Dr. Mirek

  **1. The Consensus Challenge**
  "Dr. Mirek, I want to start with the landscape. The settled view in psychophysics right now is that letter recognition is highly distributed and flexible—that we recognize an 'a' via a cloud of probabilistic features, not a rigid checklist. You're arguing for a single, non-negotiable topological rule. Given how much evidence there is for flexible recognition, what motivates the shift back to such a strict invariant?"

  **2. Defining the Invariant**
  "Let's pin down the mechanism. You claim the invariant is a continuous enclosed counter connecting to the tail. But in rapid reading, we process words in parallel, not letter-by-letter. If the visual system is optimized for speed and saccades, why would it bottleneck itself on verifying a specific topological loop for every single character? Isn't that computationally expensive compared to a quick feature scan?"

  **3. The Redescription Objection**
  "Critics have suggested that Skeletal Invariantism might be a redescription rather than an explanation. We know simple feature detectors can classify letters without 'understanding' topology. If a neural net can identify an 'a' without explicitly tracking the counter, what explanatory work is your invariant actually doing? Are you describing the *stimulus* or the *mechanism*?"

  **4. The Decorative Typeface Problem**
  "Let's talk about edge cases. In Blackletter or certain high-contrast scripts, the counter of the 'a' is often completely closed off, split, or obscured by swashes. By your definition, these should be unreadable or classified as different symbols. Yet, fluent readers parse them instantly. How does your invariant survive a font where the negative space is literally severed?"

  **5. Follow-up: Functional Reinterpretation**
  "I anticipate your reply: that readers are 'functionally reinterpreting' the negative space to restore the invariant. But isn't that circular? If the only evidence for the invariant is that we read the letter, and the evidence we read the letter is that the invariant exists, haven't you made the theory unfalsifiable? At what point does 'reinterpretation' just mean 'the invariant isn't actually there'?"

  **6. The Deep Learning Counter-Evidence**
  "Moving to AI: Convolutional Neural Networks achieve human-level accuracy on letter classification without any explicit programming for topological invariance. They rely on statistical textures and gradients. If a system can match human performance without tracking the 'continuous counter,' doesn't that suggest the invariant is a byproduct of recognition, not the cause?"

  **7. Follow-up: The 'Research Program' Deflection**
  "You've previously responded to AI objections by saying that reverse-engineering these nets is 'a research program, not an objection.' But if these models replicate human error patterns *without* your invariant, the burden of proof shifts to you. What specific empirical prediction does Skeletal Invariantism make that a standard statistical model *cannot*? When would you admit the invariant is unnecessary?"

  **8. Normativity vs. Perception**
  "I want to press on the phenomenology. You argue that when a form feels 'broken,' it's a literal perceptual rupture of the invariant, not an aesthetic judgment. But isn't 'broken' a normative term? It implies the letter *ought* to be whole. Are you smuggling an aesthetic norm into a perceptual mechanism? How do you distinguish 'I can't see this as an 'a'' from 'I don't like how this 'a' is drawn'?"

  **9. The Aesthetic Consequence**
  "If you're right, this has huge implications for design. It suggests that legibility isn't a gradient but a binary state based on topology. But designers successfully break rules all the time to create tension or style without sacrificing readability. Does your theory imply that all 'edgy' typography is essentially tricking the brain, or is there room for aesthetic variation within the invariant?"

  **10. Neurological Plausibility**
  "Finally, where is this in the brain? We have maps for orientation and spatial frequency in V1, but we don't have a 'topological counter detector' in the visual word form area. If this invariant is the key to letter identity, we should see a specific neural signature when the counter is ruptured versus when it's just ugly. Do we have that data, or is Skeletal Invariantism currently a computational theory waiting for biological hardware?"
