answer: |-
  This is a sharp observation. You have correctly identified that the standard "Old Evidence" literature (Glymour, Garber, Jeffrey) focuses on the *logic* of updating (how to update on $E$ when $P(E)=1$), while the "Use-Novelty" literature (Zahar, Worrall, Lakatos) focuses on the *history* of construction (was $E$ used to build $H$?).

  Your frustration stems from the fact that both traditions tend to treat "use" as a binary switch: either the data was a constraint in the derivation/fitting, or it wasn't. But as you note, theory construction is a search process through a space of possible models, and known data can act as a **magnetic field** on that search without ever being explicitly plugged into the likelihood function.

  Here is the breakdown of the existing concepts, why they fall short of your specific wrinkle, and a proposal for a term that carves the space you are describing.

  ### 1. The Canonical Answer: Heuristic Novelty
  The concept you are closest to is **Heuristic Novelty**, introduced by John Worrall (1989) in his critique of Lakatos.
  *   **The Distinction:** Worrall distinguishes between *construction novelty* (the data wasn't used to determine the theory's parameters) and *heuristic novelty* (the data wasn't used to motivate the theory's framework or heuristics).
  *   **Why it fits:** It captures your intuition that a theory can be "constructed" without the data (no parameter fitting) but still fail to confirm if the data guided the *choice* of framework.
  *   **Why it fails you:** Worrall's distinction is typically applied as a binary. Either the data motivated the heuristic, or it didn't. Your cases involve *degrees* of influence ("hovered in the background," "informal hunches," "decided which formalism got explored"). The literature often lacks the vocabulary for *partial* heuristic dependence.

  ### 2. The Statistical Analog: Look-Ahead Bias
  Since you mention being a "stats person," the machine learning equivalent of your problem is **Look-Ahead Bias** or **Data Leakage**.
  *   **The Concept:** In ML, if you use test data to select features or tune hyperparameters (even indirectly), your validation metrics are inflated.
  *   **The Fit:** This captures the "search path" issue. Choosing Formalism A over Formalism B because A *looks like* it might handle $X$ is structurally identical to selecting a feature set because it correlates with the target in the test set.
  *   **The Gap:** In stats, this is usually treated as a methodological error to be eliminated. In philosophy of science, it's often treated as a complex epistemic feature (sometimes "hunches" are virtuous). You need a term that bridges the normative (is this confirmation?) and the descriptive (how did the data influence the search?).

  ### 3. The Coinage: Heuristic Leakage
  There isn't a single established term that captures the *continuous, implicit influence of known data on model selection*. I propose you adopt (or coin) the term **Heuristic Leakage**.

  This term bridges Worrall's "Heuristic Novelty" with the statistical concept of "Data Leakage." It allows you to talk about degrees of contamination rather than a binary "used/unused."

  **Definition:**
  **Heuristic Leakage** occurs when known evidence $E$ influences the selection of a model structure $M$ from a space of possible models $\mathcal{M}$, without $E$ being explicitly used to estimate the parameters $\theta$ of $M$.

  **The Carving (The Property that Matters):**
  The property you are looking for is **Counterfactual Stability of Model Selection**.
  To determine if old data $E$ confirms theory $T$, you must ask: *Would the theorist have selected this specific model structure $M$ if $E$ were unknown or ignored?*

  *   **High Stability:** The theorist would have chosen $M$ regardless of $E$ (e.g., $M$ was the only mathematically consistent option). $\rightarrow$ **Legit Confirmation.**
  *   **Low Stability:** The theorist chose $M$ specifically because it *looked promising* for $E$. $\rightarrow$ **Heuristic Leakage.**
  *   **Medium Stability:** $E$ narrowed the search space from 100 models to 5, and $M$ was chosen from those 5 for other reasons. $\rightarrow$ **Partial Leakage.**

  ### 4. Boundary Cases and Application
  Here is how **Heuristic Leakage** handles the specific boundary cases you mentioned:

  **Case A: Community Knowledge vs. Individual Ignorance**
  *   *Scenario:* The theorist doesn't know $E$, but the field does, and the theorist was trained in the field's standard formalisms (which were shaped by $E$).
  *   *Verdict:* **Structural Leakage.** The leakage occurred at the level of the research program or training, not the individual. The confirmation is weaker because the "search space" available to the theorist was already pruned by $E$.
  *   *Epistemic Status:* The data confirms the *individual's* insight, but not the *framework's* novelty.

  **Case B: Deliberate Avoidance (The "Clean" Case)**
  *   *Scenario:* The theorist knows $E$ exists but deliberately brackets it ("I will not look at $X$ until the model is done").
  *   *Verdict:* **Mitigated Leakage.** This reduces leakage but doesn't eliminate it. If the *motivation* for building the model was to solve $E$, the search path was still biased.
  *   *Epistemic Status:* Stronger than Case A, but still requires checking **Counterfactual Stability**. Would they have built *this* model if $E$ didn't exist? If yes, it's legit. If no, it's leakage.

  **Case C: The "Hunch" (Informal Influence)**
  *   *Scenario:* "It would be neat if this handled $X$."
  *   *Verdict:* **Latent Leakage.** This is the hardest case. The data acted as a *prior over model space*.
  *   *Epistemic Status:* This counts as **Structural Accommodation**. The model accommodated $E$ not by fitting parameters, but by being selected from a set of models capable of fitting $E$. The confirmation value is proportional to the *cost* of that capability. If the formalism is rigid (hard to change), leakage is low. If the formalism is flexible (many variants available), leakage is high.

  ### 5. Why This Matters for Your Modeling
  In your own work, you can use **Heuristic Leakage** to diagnose your "wrinkle." When you present a model that explains known regularity $X$:

  1.  **Don't claim "Prediction":** If $X$ influenced the choice of formalism, it is not a prediction in the strict sense.
  2.  **Quantify the Search Space:** Instead of saying "I didn't fit the data," say "The model was selected from a class of models $\mathcal{M}$, where only subset $\mathcal{M}'$ could accommodate $X$. I selected from $\mathcal{M}'$."
  3.  **The "Cost" Metric:** The confirmation value of $X$ is inversely proportional to the **Heuristic Leakage**. If the model structure was highly constrained by independent theoretical virtues (symmetry, parsimony) and *just happened* to fit $X$, leakage is low. If the structure was chosen *because* it fit $X$, leakage is high.

  ### Summary Recommendation
  The literature you want is **Worrall (1989) "Fresh Evidence, Old Evidence, and Confirmation"** combined with **Forster & Sober (1994) on Overfitting**.

  However, to capture the "middle zone" you described, I recommend using the term **Heuristic Leakage**. It signals to stats-minded readers that you understand information flow/bias, and to philosophy readers that you are engaging with the heuristic/construction distinction.

  **The Carving:**
  *   **Parametric Accommodation:** Data used to fit $\theta$. (High Leakage)
  *   **Structural Accommodation:** Data used to select $M$. (Medium Leakage)
  *   **Heuristic Novelty:** Data played no role in selecting $M$ or $\theta$. (No Leakage)

  Your cases are **Structural Accommodation via Heuristic Leakage**. The data didn't fix the parameters, but it fixed the *container* the parameters live in. That is enough to diminish confirmation, but not enough to invalidate the result entirely—provided you account for the **Counterfactual Stability** of the model selection.
