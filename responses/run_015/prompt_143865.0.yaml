answer: |-
  Your colleague isn't changing the subject; he is pointing out the fatal risk of triviality. The slider variant shows indeterminacy isn't a general feature of supertasks but tracks specifically where physical quantities lack limits. If your view collapses into "outcomes are indeterminate where the math is undefined," you haven't offered a metaphysical thesis so much as a restatement of analysis. To survive, you must argue that reality can be unsettled where mathematics runs out, rather than simply saying there is no fact because there is no function value. This isn't a refutation, but it restricts your view to divergent histories, making it less a lesson about infinity and more a claim about discontinuous causation. The fatal defeater here is if you cannot distinguish metaphysical gappiness from mathematical undefinedness.

  The impossibility objection is merely awkward if you insist completion is metaphysically possible, but the antiphase lamps are fatal to classical logic. If it is determinate that exactly one lamp is on but indeterminate which, you cannot maintain bivalence without smuggling in epistemic uncertainty. To maintain genuine indeterminacy, you must accept that logical compounds can have determinate truth values while their constituents do not. This is a costly revision many will find heavier than the bullet of impossibility. If you concede supertasks cannot be performed, your conditional claim becomes vacuously true but uninformative, insuring you against error at the cost of content. The antiphase case forces you to choose between logical orthodoxy and your indeterminacy claim.

  Ultimately, the position is exposed to the charge of unfalsifiability. If no empirical test distinguishes an indeterminate lamp from a determinate one beyond our ken, the claim functions as a metaphysical posit rather than a descriptive hypothesis. What counts against you is a coherent model where divergent supertasks yield determinate outcomes without convergence; if such a model is conceivable, your necessity claim fails. However, the deeper problem is whether "indeterminate fact" is coherent when the causal history provides no grounding. Your colleague suggests there is nothing to be indeterminate about. To resist this, you must defend the coherence of metaphysical indeterminacy independently of the supertask itself. Without that, you are indeed just describing a discontinuous function, and the seminar will rightly press you on whether reality cares about your function's domain.
