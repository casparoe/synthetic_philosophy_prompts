          4.  Propose alternative analogies (Collective decision, bargaining model) and assess their impact on the case for Ulysses contracts.

  2.  **Task 1: The Correspondence Table:**

      *   *Standard P-A Model:* Principal (offers contract), Agent (takes action), Contract (incentive scheme), Monitoring (signal of action), Hidden Action (effort level), Reservation Utility (outside option), Enforcement (legal/court).
      *   *Intertemporal/Akrasia Model:*
          *   Principal: Present Self (Self-$t$).
          *   Agent: Future Self (Self-$t+\Delta$).
          *   Contract: Commitment Device/Ulysses Contract (pre-commitment).
          *   Monitoring: Introspection/Feedback (often imperfect).
          *   Hidden Action: Consumption choice/Effort exertion (succumbing to temptation).
          *   Side Payment: Immediate gratification (dopamine hit).
          *   Reservation Utility: Utility of giving in to temptation (often the default).
          *   Enforcement: External penalty (financial loss, social shame) or Internal cost (guilt).

  3.  **Task 2: Where the Mapping Breaks (The Audit):**

      *   *Distinct Agents/Utility Functions:* In P-A, P and A are distinct legal entities with *ex-ante* agreed preferences (usually profit maximization), but divergent risk/information profiles. In intertemporal choice, Self-$t$ and Self-$t+1$ are the *same* legal/biological entity. However, hyperbolic discounting implies *preference reversal*. Self-$t$ wants $X$ (long term), Self-$t+1$ wants $Y$ (short term). This isn't just hidden action; it's a fundamental shift in the objective function.
      *   *Hyperbolic vs. Exponential:* Standard P-A assumes exponential discounting (time consistency). The agent agrees to the contract at $t=0$ and sticks to it because their discount rate is constant. Hyperbolic discounting means the discount rate changes as the horizon shrinks. The "Agent" (Future Self) isn't just shirking; they are rationally optimizing according to a *different* discount function than the Principal. This is more like a regime change than moral hazard.
      *   *Authority/Legitimacy:* In corporate law, the Principal hires the Agent. The contract is consensual. In the intrapersonal case, Self-$t$ binds Self-$t+1$. Self-$t+1$ did not consent at $t+1$. This raises a normative issue of "tyranny of the past." If preferences change legitimately (e.g., quitting smoking vs. wanting a cigarette), does Past-Self have the right to constrain Future-Self? In P-A, the Principal owns the residual claim. In intrapersonal choice, who owns the "self"?

  4.  **Task 3: Normative Weight of the Analogy:**

      *   Does the conclusion survive? The P-A analogy makes commitment look like *efficiency* (solving agency costs). If the analogy breaks, commitment might look like *oppression* (one temporal part dominating another).
      *   However, if we view the "Person" as the overarching entity, maximizing *lifetime* utility, then Self-$t$ acting for the whole is legitimate. But hyperbolic discounting suggests there *is* no consistent "lifetime" utility function to maximize.
      *   Conclusion: The analogy carries significant normative weight. Without it, we have to justify why Self-$t$'s preferences trump Self-$t+1$'s. The P-A model smuggles in the idea that Self-$t$ represents the "true" interest (the shareholder), while Self-$t+1$ is the "rogue manager." This is a substantive ethical claim, not just a technical one.

  5.  **Task 4: Alternative Analogies:**

      *   *Collective Decision/Intrapersonal Bargaining:* View selves as a sequence of players in a game (Strotz, Ainslie, Piccione & Rubinstein).
      *   *Veto Rights:* Future self can veto? (Hard to model with pre-commitment).
      *   *Bargaining:* Self-$t$ and Self-$t+1$ negotiate.
      *   *Impact on Ulysses Contracts:*
