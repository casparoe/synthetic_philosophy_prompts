answer: |-
  # The requirements

  1.  **Universal Quantification (Non-negotiable).** The domain of quantification must include absolutely everything, including the domain itself and all semantic values assigned within the theory. Natural language quantifiers like "everything" suffer no type restrictions; a semantics that forces a hierarchy fails to model unrestricted generality. If the semantics cannot quantify over its own models, it cannot define truth for the language itself, rendering it expressively incomplete for semantic projects.

  2.  **Self-Application (Non-negotiable).** Predicates must be capable of applying to themselves. Natural language allows "is short" or "is expressed in English" to be evaluated against themselves. Blocking this syntactically via type theory misrepresents linguistic competence. A theory that types predicates to prevent self-reference fails to capture the reflexivity inherent in natural language semantics and forces artificial distortions on simple sentences.

  3.  **Hyperintensional Identity (Non-negotiable).** Coextensive properties must remain distinct. In attitude reports, "believes that P" differs from "believes that Q" even if P and Q are necessarily equivalent or coextensive. Extensional collapse destroys semantic granularity. We need a theory of properties where identity is finer than necessary coextension to model cognitive significance and propositional attitudes accurately.

  4.  **Structural Diagnosis (Non-negotiable).** The theory must identify the specific inferential step or ontological assumption in naive reasoning that fails. Simply restricting comprehension axioms without explaining *why* the naive intuition is misleading is ad hoc. The diagnosis must locate the error in the logic or the ontology, not merely ban formulas. It must show why the naive derivation looks valid but isn't, providing a principled limitation rather than a syntactic fence.

  5.  **Negation-Independence (Non-negotiable).** The solution must block Curry-style paradoxes which do not rely on negation. Blaming negation or excluded middle is insufficient; the theory must restrict contraction or implication to prevent explosion from conditional self-reference. If the theory only fixes Russell by tweaking negation, it fails against Curry, leaving the core issue of self-reference unresolved.

  6.  **Competence Stability (Preference).** The theory should explain why competent speakers can formulate the Russell predicate without immediately deriving contradictions in ordinary discourse. It must distinguish between possessing a concept and successfully asserting its instantiation. Speakers grasp the meaning without accepting the contradiction; the semantics must model this stability without attributing systematic irrationality to users.

  7.  **Classical Logic (Preference).** Retain classical connectives and structural rules where possible. Deviations should be minimal, justified only by the need to preserve Universal Quantification and Self-Application. Classical logic is the default for semantics; abandoning it requires strong justification, though it may be the cost of maintaining unrestricted domains.

  8.  **Compositionality (Non-negotiable).** The meaning of complex expressions must derive systematically from their parts. Ad hoc semantic values for paradoxical sentences undermine predictive power. The solution must integrate smoothly with standard semantic construction rules to maintain the productivity of natural language.

  # Prejudices, not desiderata

  Do not demand set-theoretic reductionism. Properties need not be sets; treating them as such invites extensional collapse and paradox. Do not insist on ZFC consistency as a primary metric; semantic adequacy outweighs mathematical familiarity. Do not privilege model-theoretic over proof-theoretic approaches arbitrarily; both are tools. Finally, avoid aesthetic simplicity if it sacrifices expressive power. A theory that is elegant but cannot handle "this sentence is false" is useless for semantics. The goal is linguistic fidelity, not mathematical hygiene.

  # What can't be had together

  You cannot jointly satisfy Universal Quantification, Self-Application, Classical Logic, and Unrestricted Comprehension. This is the core trilemma. If you keep Classical Logic and allow predicates to apply to themselves over a universal domain, you must restrict Comprehension. However, Requirement 4 demands a *diagnosis* for this restriction, not just a ban. Furthermore, Hyperintensional Identity clashes with standard Extensional Logic; you cannot have fine-grained properties while retaining standard substitution rules for identity. There is also tension between Competence Stability and Dialetheism: if contradictions are true, explaining why speakers reject them becomes difficult. You must choose between modifying logic or restricting ontology.

  # Which one I give up

  Classical Logic is the single requirement that excludes the most candidate theories. To maintain Universal Quantification and Self-Application without triviality, nearly all viable theories (relevant, paraconsistent, or intuitionistic) must weaken structural rules like contraction or excluded middle. Keeping Classical Logic forces you into type theories or hierarchical domains, violating the non-negotiable semantic needs. Therefore, Classical Logic is the primary filter; if a theory preserves it while meeting the non-negotiables, it is an outlier. Expect to sacrifice it to save the domain.
