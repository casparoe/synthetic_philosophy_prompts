answer: |-
  ### Scenario: The Consistency Trap

  Consider a hiring pipeline for a technical role where we screen candidates from two demographic groups (Group A and Group B) with equal qualification rates (50% truly qualified). We deploy Vendor 1's resume scorer (Model 1) followed by Vendor 2's video interviewer (Model 2); candidates must pass Model 1 to reach Model 2. For Group A, the signals of competence are consistent across modalities—a candidate who looks strong on paper also performs well on video—so model errors are highly correlated (the same qualified candidates tend to fail both). For Group B, the signals are decoupled due to cultural mismatches in video scoring and credential biases in resume screening, making model errors statistically independent (a candidate who fails the resume screen might have aced the video, and vice versa). Both vendors certify their models satisfy Equalized Odds individually on a full-coverage benchmark, yet the sequential pipeline systematically filters out significantly more qualified Group B candidates because their errors compound across stages rather than overlapping.

  ### Verification: Joint Tables and Arithmetic

  We assume a benchmark sample of **1,000 applicants per group**, with **500 Qualified (Y=1)** and **500 Unqualified (Y=0)** in each.
  Both models individually satisfy **TPR = 0.80** and **FPR = 0.20** for both groups.

  #### 1. Individual Model Performance (Marginal)
  *Identical for Vendor 1 and Vendor 2, and identical across Groups.*

  | Group | True Status | Total N | Pass Model 1 | Pass Model 2 | Rate (TPR/FPR) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A** | Qualified | 500 | 400 | 400 | **0.80** |
  | **A** | Unqualified | 500 | 100 | 100 | **0.20** |
  | **B** | Qualified | 500 | 400 | 400 | **0.80** |
  | **B** | Unqualified | 500 | 100 | 100 | **0.20** |

  *Audit Result:* Both vendors pass. Equalized Odds holds perfectly.

  #### 2. Pipeline Performance (Joint: Pass Model 1 AND Model 2)
  *Here, the error correlation structure diverges.*

  **Group A (Correlated Errors for Qualified, Independent for Unqualified)**
  *   **Qualified:** The 100 who fail Model 1 are the *same* 100 who fail Model 2. (Overlap = 100).
      *   Joint Pass = $500 - 100 = 400$. **TPR = 0.80**.
  *   **Unqualified:** Errors are independent (noise).
      *   Joint Pass = $0.20 \times 0.20 \times 500 = 20$. **FPR = 0.04**.

  **Group B (Independent Errors for All)**
  *   **Qualified:** Errors are independent. The 100 who fail Model 1 are different from the 100 who fail Model 2 (statistically).
      *   Joint Fail probability = $1 - (0.8 \times 0.8) = 0.36$.
      *   Joint Pass = $0.64 \times 500 = 320$. **TPR = 0.64**.
  *   **Unqualified:** Errors are independent.
      *   Joint Pass = $0.20 \times 0.20 \times 500 = 20$. **FPR = 0.04**.

  #### 3. The Gap Check

  | Metric | Group A | Group B | Gap |
  | :--- | :--- | :--- | :--- |
  | **Pipeline TPR** | 0.80 | 0.64 | **0.16** (16 pts) |
  | **Pipeline FPR** | 0.04 | 0.04 | **0.00** |

  **Arithmetic Verification:**
  *   **Condition (b) Met:** Marginal TPR/FPR are 0.80/0.20 for all.
  *   **Condition (c) Met:** TPR gap is 16 points (>10); FPR gap is 0.
  *   **Condition (d) Met:** Base rates are equal (50/50). No calibration impossibility is in play.

  ### The Driver: Error Correlation, Not Marginal Rates

  The failure is driven entirely by the **covariance of errors within the Qualified population**.
  *   **Group A:** $Cov(Error_1, Error_2 | Y=1) > 0$. The models make the *same* mistakes. In a serial pipeline, this is beneficial; a candidate rejected by Model 1 is not "rejected again" by Model 2—they are simply already out. The qualified pool is only trimmed once.
  *   **Group B:** $Cov(Error_1, Error_2 | Y=1) \approx 0$. The models make *different* mistakes. Model 1 rejects a set of qualified candidates. Model 2 rejects a *different* set of qualified candidates who managed to pass Model 1. The qualified pool is trimmed twice.

  **Counterfactual Check:** If we force Group A's errors to be independent (matching Group B), Group A's Pipeline TPR drops from 0.80 to 0.64. The fairness gap collapses to zero. This proves the disparity is not due to the models' individual accuracy, but the **dependency structure of their errors** across the pipeline.

  ### Vendor Objection & Audit Recommendation

  **The Vendor's Honest Objection:**
  > "Our contract specifies compliance with Equalized Odds on the model output, which we have met exactly. You cannot blame Model 1 for Model 2's decisions, nor can you blame us for how you chose to sequence the tools. The disparity arises from your pipeline architecture interacting with the natural variance in the data, not from bias in our individual predictors. We are selling components, not a system."

  **The Reality:**
  They are technically correct. Individual fairness metrics are blind to serial compounding. By optimizing for marginal parity, they may have inadvertently optimized for error independence in one group and error correlation in another, or simply exploited the fact that pipeline fairness is not a property of individual models.

  **Audit Procedure Demand:**
  We cannot demand they change their model weights. Instead, our procurement and risk policy must demand **Joint Error Disclosure**.
  1.  **Requirement:** Vendors must provide the joint confusion matrix (Pass/Pass, Pass/Fail, Fail/Pass, Fail/Fail) on a held-out benchmark, stratified by protected group.
  2.  **Constraint:** We will not approve sequential deployment if the **Pipeline TPR gap** exceeds 5%, regardless of individual model EO compliance.
  3.  **Remedy:** If the gap exists, we must either (a) run models in parallel (union rule) to mitigate serial attrition, or (b) adjust thresholds on the second stage per group to restore pipeline parity (post-processing).
