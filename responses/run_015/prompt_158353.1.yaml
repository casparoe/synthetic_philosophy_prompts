      *   *Methodology:* "Counterfactual Genealogy" sounds like a mix of modal metaphysics, historical sociology, and predictive modeling. It risks being too vague or too technical.
      *   *Economics/History:* Claiming to solve the Rich-Nation debate (Acemoglu/Robinson vs. Sachs, etc.) is bold. Historians will pounce on endogeneity and selection bias.
      *   *Bayesian Charge:* If the "forecasting" is just updating priors based on evidence, the Decision Theorist will call it redundant.
      *   *Critical History:* Nietzsche's "Critical" mode involves judging and condemning the past to break its chain. If "Counterfactual Genealogy" just critiques institutions to see if they survive, is it just Critical History with a technocratic veneer?

