answer: |-
  ## Purpose & The One-Number Verdict

  **Purpose:** I am selecting **Job 1 (Predicting Response to Selection)** as the primary spec target. This is the only job for which a single number is mathematically coherent in quantitative genetics.

  **Verdict:** **One number cannot do both jobs.**
  *   **Job 1 (Selection):** Requires a population-level variance ratio. It predicts how much the population mean shifts if you breed from the top performers.
  *   **Job 2 (Individual Attribution):** Is a category error. Heritability is structurally incapable of answering "how much of *this* individual's trait is genetic."
  *   **Conflict:** Satisfying Job 1 requires aggregating over variance, which destroys the information needed for Job 2. Satisfying Job 2 requires individual causal decomposition, which destroys the population statistics needed for Job 1.

  ---

  ## Desiderata Spec for Heritability ($h^2$)

  **1. [NON-NEGOTIABLE] Population Variance Dependence**
  *   **Spec:** The metric must be defined on the variance of a specific population in a specific environment, not on the trait mechanism itself. If variance in the causal factor is zero, the metric must be zero.
  *   **Case (Uniform Genetics):** A trait is 100% biologically determined (e.g., having 5 fingers), but everyone in the population has the same genes for it. Variance in genes = 0. **Requirement:** Metric must return 0. If it returns 1, it measures "causality," not heritability.
  *   **Case (Uniform Environment):** A trait varies wildly, but the variation is entirely due to environment (e.g., language spoken), while genetics are identical (clones). **Requirement:** Metric must return 0.

  **2. [NON-NEGOTIABLE] Variance, Not Mean Level**
  *   **Spec:** The metric must quantify the proportion of *differences* between individuals explained by genetic differences. It must not quantify the absolute level of the trait.
  *   **Case (The "80% of You" Fallacy):** A user asks, "My IQ is 120. Does 0.8 heritability mean 96 points are genetic?" **Requirement:** The metric must be undefined for $N=1$. It cannot decompose an individual's score. If the definition allows an individual-level interpretation, it is invalid.

  **3. [NON-NEGOTIABLE] Distinction Between Causality and Malleability**
  *   **Spec:** The metric must measure the source of *current variance*, not the potential for *future change*. High genetic variance contribution does not imply immutability.
  *   **Case (PKU):** Phenylketonuria is 100% genetic in origin (single gene), but 100% fixable by environment (diet). In a population with mixed genes and standard diet, variance is high and genetic. **Requirement:** Metric must return high (near 1), despite the trait being environmentally fixable. If the metric drops because the environment *can* fix it, it measures "intervene-ability," not heritability.

  **4. [NON-NEGOTIABLE] Reference Environment Specification**
  *   **Spec:** The metric is invalid without a defined range of environments. It must assume a distribution of environments over which the genetic variance is averaged.
  *   **Case (GxE Interaction):** Genotype A outperforms B in Environment 1, but B outperforms A in Environment 2. **Requirement:** The metric must either (a) restrict the claim to the specific environment sampled or (b) explicitly model the interaction term as non-additive variance (usually excluded from narrow-sense $h^2$). You cannot report a number without defining the "environment" bucket.

  **5. [PREFERENCE] Handling of Gene-Environment Correlation (rGE)**
  *   **Spec:** Define how to treat covariance between genes and environment (e.g., smart parents pass on smart genes *and* books).
  *   **Case (Tangled Supply):** Parents supply both. **Requirement:** Standard quantitative genetics often lumps this into genetic variance (passive rGE) because it responds to selection like genes do. An interventionist definition would try to strip it out. This is a design choice, but must be documented.
  *   **Status:** Preference. Different camps handle this differently. For Job 1 (Selection), lumping it in is usually more predictive. For Job 2 (Causal), stripping it out is more accurate.

  **6. [NON-NEGOTIABLE] Predictive Validity for Selection (Breeder's Equation)**
  *   **Spec:** If $R$ is the response to selection and $S$ is the selection differential, the metric $h^2$ must satisfy $R = h^2 \times S$ (approximately).
  *   **Case:** You select the top 10% of organisms and breed them. **Requirement:** The metric must predict the shift in the offspring mean. If it doesn't predict the shift, it is not heritability, regardless of how well it decomposes variance.

  ---

  ## Contradictions & Trade-offs

  **The Fundamental Contradiction:**
  You cannot satisfy **Desideratum 2 (Variance, Not Mean)** and **Job 2 (Individual Attribution)** simultaneously.
  *   To predict selection (Job 1), you *must* aggregate variance.
  *   To answer "how much of *your* trait is genetic" (Job 2), you *must* decompose the individual.
  *   **Result:** Any definition that claims to do Job 2 is mathematically illegitimate for Job 1. Any definition that does Job 1 is silent on Job 2.

  **The rGE Trade-off:**
  **Desideratum 5** conflicts with **Desideratum 3** depending on your goal.
  *   If you want to know "Can we fix this by changing environment?" (Malleability), you must strip rGE out (treat books as environment).
  *   If you want to know "Will this trait persist if we select for it?" (Selection), you must keep rGE in (books travel with genes).
  *   **Result:** You must choose: are you measuring *transmission* or *mechanism*?

  ---

  ## The Knockout Requirement

  **Requirement 2 (Variance, Not Mean / Undefined for N=1)** knocks out the most misuse.

  **Why:** Almost all public discourse uses heritability to make claims about individuals ("His aggression is genetic") or to imply immutability ("It's genetic, so we can't fix it").
  *   Enforcing that the metric is **undefined for a single data point** destroys the "80% of your intelligence" argument immediately.
  *   Enforcing that it measures **variance sources, not malleability** (Requirement 3) destroys the "genetic means unchangeable" argument.
  *   Requirement 2 is the structural guardrail; Requirement 3 is the interpretive guardrail. Requirement 2 is harder to bypass because it's mathematical, not semantic.

  ---

  ## Candidate Evaluation

  **1. Variance-Ratio / ANOVA ($V_G / V_P$)**
  *   **Performance:** Passes Job 1 perfectly. Fails Job 2 by design.
  *   **Cases:** Handles PKU correctly (high $h^2$ despite fixability). Handles Uniform Genetics correctly (0 $h^2$).
  *   **Weakness:** Collapses GxE interaction into error unless explicitly modeled. Assumes additivity.
  *   **Verdict:** The industry standard for Job 1. Use this if you want to predict selection.

  **2. Counterfactual / Interventionist (Change G, hold E fixed)**
  *   **Performance:** Good for causal intuition (Job 2-ish). Poor for Job 1.
  *   **Cases:** Handles PKU well (shows environment change fixes trait). Struggles with rGE (hard to hold E fixed if G causes E).
  *   **Weakness:** Does not naturally sum to a population variance ratio. Hard to measure without controlled cloning. Doesn't plug into the Breeder's Equation without extra steps.
  *   **Verdict:** Better for "What if we intervene?" questions. Bad for "What happens if we breed?" questions.

  **3. Molecular / "Caused by a Gene"**
  *   **Performance:** Fails Job 1. Fails Requirement 1 (Population Variance).
  *   **Cases:** Fails Uniform Genetics case (says 100% genetic even if no variance). Fails PKU case (often conflates mechanism with variance).
  *   **Weakness:** Confuses *necessity* with *variance contribution*. A trait can be 100% molecularly genetic and have 0 heritability.
  *   **Verdict:** Do not use. This measures mechanism, not heritability.

  ---

  ## ML Context: Transfer & Failure Mode

  **What Transfers:**
  *   **Variance Decomposition (ANOVA):** You can cleanly run an ablation study. Arch = $V_G$, Seed/Data = $V_E$. You can calculate a ratio.
  *   **PKU Analogue:** An architecture might be "brittle" (genetic) but fixable by learning rate scheduling (environment). The variance ratio will still show Arch as the dominant source of spread if LR is held constant. This holds up.

  **What Breaks First:**
  *   **Desideratum 6 (Predictive Validity for Selection).**
  *   **The Failure Mode:** **No Inheritance Mechanism.**
      *   In biology, selecting a parent transmits $V_G$ but resamples $V_E$ (new womb, new life).
      *   In ML, if you "select the best run," you are selecting a specific checkpoint (Arch + Seed + Data indices).
      *   If you "breed" by copying that checkpoint, you get cloning (100% reproducibility), not heritability.
      *   If you "breed" by re-training the Arch with new Seeds, you are resampling $V_E$.
      *   **The Break:** In biology, $V_G$ is the *only* thing that transmits. In your ML setup, "Architecture" is the only thing that transmits. But "Seed" is often the largest variance component in modern DL.
      *   If your metric includes Seed variance in the denominator (Total Variance) but excludes it from the numerator (Arch Variance), your $h^2$ will be low.
      *   **Critical Failure:** If you select the top 10% of runs and re-train those Architectures, your gain ($R$) will match the prediction *only if* Seed variance is uncorrelated with Arch performance. If certain Architectures are *more sensitive* to Seeds (GxE interaction), the standard heritability number will overpredict your gains.
      *   **Conclusion:** You are not measuring heritability. You are measuring **Sensitivity**. Heritability implies a germ line. ML has no germ line unless you are doing Evolutionary Strategies (mutating weights/arch). If you are just doing hyperparameter sweeps, stop calling it heritability. Call it **Variance Attribution**. Using the heritability spec will tempt you to assume $R = h^2 S$, which will fail because "re-training" is not "breeding."
