      *   *Section 2: Competence.* Stevens is a perfect hearer, broken speaker. Grice's reflexive intention is key. Stevens blocks the recognition condition.
      *   *Section 3: Maxims/Banter.* Avoid "Maxim of Dignity." Use "Clash of Frames." Banter requires flouting Quality for Relation; Stevens takes it literally.
