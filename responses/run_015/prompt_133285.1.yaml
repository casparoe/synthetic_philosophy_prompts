      *   **Core Philosophical Questions:**
          1.  Is there a coherent distinction between genuinely praiseworthy supererogatory actions and de facto duties disguised as virtues?
          2.  If an institution treats voluntary contribution as a prerequisite for fair treatment, is there a specific moral error (e.g., extracting surplus moral labor via gift rhetoric)?
          3.  Which analytical framework (perfect vs. imperfect obligations vs. institutional coercion) best supports formalizing the duty vs. protecting voluntariness?

  2.  **Initial Ethical & Philosophical Mapping:**

      *   **Supererogation:** This is the classic concept of actions that are good to do but not wrong to omit. The current situation exploits this category.
      *   **Coercion/Constraint:** The "choice" is illusory. This points to structural coercion or "soft power."
      *   **Labor Exploitation:** The term "surplus moral labor" suggests a Marxist or critical theory angle (extracting value under the guise of altruism).
      *   **Justice/Fairness:** The distribution of rewards and penalties is opaque and biased.
      *   **Institutional Integrity:** The mismatch between official policy (voluntary) and actual practice (mandatory for advancement) creates hypocrisy.

  3.  **Addressing Question 1: Supererogation vs. Disguised Duty:**

      *   *Concept:* Supererogatory acts (above and beyond the call of duty).
      *   *Distinction:* A genuinely supererogatory act must be free from significant penalty for omission. If omitting the act leads to career stagnation or social sanction, it ceases to be supererogatory and becomes a *conditional duty*.
      *   *Philosophical Terminology:* "Obligatory discretion" or "Coerced Altruism." The distinction lies in the *consequences of omission*.
      *   *Key Thinkers:* J.O. Urmson (Saints and Heroes), David Heyd (Supererogation).

  4.  **Addressing Question 2: The Moral Error of the Institution:**

      *   *The Error:* It's a form of *moral manipulation* or *normative corruption*.
      *   *Specific Concept:* "Moral Hazard" doesn't quite fit. "Exploitation" fits. "Gaslighting" (making the analyst feel morally defective).
      *   *Gift Rhetoric:* Marcel Mauss (The Gift) – the idea that a "gift" creates an obligation to repay. Here, the institution offers "opportunity" (gift) but demands "availability" (repayment) without formalizing the contract.
      *   *Surplus Moral Labor:* This aligns with critical management studies. The institution saves money (no overtime pay) by leveraging professional identity.
      *   *Label:* "Institutional Hypocrisy" or "Ethical Fading." More precisely, *normative coercion*.

  5.  **Addressing Question 3: Analytical Frameworks & Reform Choice:**

      *   *Framework A: Perfect vs. Imperfect Duties (Kantian).*
