answer: |-
  This is a profound ethical dilemma that sits at the intersection of labor ethics, institutional integrity, and moral philosophy. You are describing a phenomenon where the boundary between *duty* and *virtue* has been intentionally blurred to extract labor without compensation.

  To answer your questions directly: Yes, there is a philosophically coherent distinction between genuine supererogation and disguised duty. Yes, the institution has committed a specific moral error regarding normative coercion. And yes, specific frameworks favor one reform over the other.

  Here is an analysis of the conceptual structure of your problem.

  ### 1. The Distinction: Supererogation vs. Coerced Duty

  In moral philosophy, actions are often categorized into three buckets:
  1.  **Obligatory:** You must do them; failure is blameworthy.
  2.  **Permissible:** You may do them; neither doing nor omitting is blameworthy.
  3.  **Supererogatory:** You are not required to do them, but if you do, they are praiseworthy (e.g., running into a burning building to save a stranger).

  **The Coherent Distinction:**
  The defining feature of a genuinely supererogatory act is that **omission carries no penalty.** If an agent is punished (formally or informally) for *not* performing the act, it ceases to be supererogatory and becomes a *conditional obligation*.

  In your network, the "voluntary" on-call shifts have lost their supererogatory status. Because omission results in exclusion from authorship and negative performance reviews, these shifts have become **de facto duties.** The philosophical error lies in maintaining the *label* of virtue (professional citizenship) while applying the *mechanics* of duty (career contingency).

  This creates a state of **Normative Dissonance**. Your senior analyst feels "morally defective" because the institution is leveraging the language of virtue to induce guilt. She is being judged against a standard of sainthood (supererogation) while being punished as if she violated a contract (obligation). This is not a failure on her part; it is a category error engineered by the institution.

  ### 2. The Moral Error: Extracting Surplus Moral Labor

  You asked if the institution has committed a specific moral error by treating voluntary contribution as a prerequisite for fair treatment. This is best understood through the lens of **Moral Exploitation** and **Normative Coercion**.

  **The Rhetoric of the Gift:**
  By framing this availability as "professional citizenship" or a "gift" to the community, the institution invokes what anthropologist Marcel Mauss called the "poison of the gift." A gift creates a social debt. By offering "opportunities" (authorship, budget access) in exchange for "voluntary" time, the institution creates a reciprocal obligation that cannot be refused without social cost. This allows the organization to bypass labor contracts while retaining the leverage of employment.

  **Surplus Moral Labor:**
  Critical management theorists describe this as extracting *surplus moral labor*. The institution captures the value of the outbreak verification (public safety, data, reputation) without paying the market rate (overtime, compensatory time). Instead, they pay in "moral capital" (commendations, reputation). When career advancement depends on accumulating this moral capital, the institution is effectively monetizing the employees' ethical identities.

  **The Specific Error:**
  The error is **Institutional Hypocrisy** coupled with **Gaslighting**.
  *   **Hypocrisy:** The official policy (voluntary) contradicts the operational reality (mandatory for advancement).
  *   **Gaslighting:** The senior analyst feels "morally defective" for resenting the exploitation. The institution has successfully externalized the conflict: instead of the worker being angry at the unfair system, the worker is angry at themselves for lacking "commitment."

  ### 3. Analytical Frameworks: Duties vs. Coercion

  You asked which framework best supports formalizing the duty versus protecting voluntariness.

  **Framework A: Perfect vs. Imperfect Obligations (Kantian)**
  *   *Concept:* A **Perfect Duty** is specific and owed to specific persons (e.g., fulfill the employment contract). An **Imperfect Duty** is broad and allows for flexibility in how/when it is fulfilled (e.g., help others when possible).
  *   *Analysis:* The institution is treating an Imperfect Duty (help during outbreaks) as a Perfect Duty (required for promotion) without formalizing it.
  *   *Verdict:* This framework supports **Reform 1 (Codify as Paid Obligation).** If the work is essential for the institution's function and career advancement, it is a Perfect Duty. Perfect duties must be explicit, universal, and compensated. You cannot have a "perfect duty" that is officially optional.

  **Framework B: Structural Coercion (Political Philosophy/Critical Theory)**
  *   *Concept:* Focuses on power dynamics and the conditions under which "choice" is made. A choice is not free if the cost of refusal is disproportionate harm (career stagnation).
  *   *Analysis:* The current system relies on **Structural Coercion**. The "choice" to volunteer is constrained by the scarcity of resources (sequencing budget, authorship slots).
  *   *Verdict:* This framework supports **Reform 1** over Reform 2. Reform 2 (anonymizing logs) attempts to fix the *symptom* (bias) but leaves the *structure* (scarcity and unwritten expectations) intact. Culture is hard to firewall; if the "voluntary" work is still necessary for the mission, the pressure will find a way to reassert itself informally. Reform 1 acknowledges the power dynamic: labor requires compensation.

  ### 4. Evaluating the Reforms

  **Option 1: Codify as Paid, Rotating Obligations**
  *   **Ethical Strength:** Restores integrity. It acknowledges the work as labor, not virtue. It removes the guilt from the senior analyst (it is no longer a moral test, but a job requirement). It ensures fairness (rotation prevents burnout of the most conscientious).
  *   **Philosophical Alignment:** Aligns with **Distributive Justice**. The burden of public safety is shared equally, and the labor is compensated.
  *   **Risk:** It increases budgetary costs and reduces flexibility.

  **Option 2: Erect Barriers to Protect Voluntariness**
  *   **Ethical Strength:** Attempts to restore true Supererogation. If successful, it allows those who *can* volunteer to do so for praise, without punishing those who *cannot*.
  *   **Philosophical Alignment:** Aligns with **Libertarian/Non-Interference** ideals.
  *   **Risk:** It is fragile. In high-stakes environments (outbreaks), "team commitment" is often a proxy for "availability." Anonymizing logs may stop explicit bias, but it cannot stop the informal networking that leads to authorship. It leaves the "moral defect" narrative intact for those who still cannot volunteer.

  ### Recommendation

  **Reform 1 (Codification) is the ethically superior choice.**

  The situation you describe is not a surplus of virtue; it is a deficit of staffing or budget planning. When an institution relies on unpaid, off-hours labor to function safely, it is running a structural deficit on the backs of its employees' consciences.

  By codifying the shifts:
  1.  **You dissolve the illusion:** You admit that this work is necessary, not optional.
  2.  **You protect the vulnerable:** The senior analyst with caregiving duties is no longer "uncommitted"; she is simply working her contracted hours, just like everyone else.
  3.  **You preserve true virtue:** Once the *necessary* work is formalized and paid, any *additional* voluntary effort becomes genuinely supererogatory again, because the baseline expectation has been met.

  **Conclusion:**
  The distinction you seek lies in the **consequences of omission**. If saying "no" harms your career, it is not a virtue; it is a job requirement. The institution has committed the moral error of **normative deception**, using the language of altruism to mask labor extraction. A framework of **Structural Coercion** best reveals that the "choice" is illusory, and **Distributive Justice** dictates that the burden be formalized and shared. You should codify the duty. To do otherwise is to perpetuate a system that punishes integrity and rewards exploitation.
