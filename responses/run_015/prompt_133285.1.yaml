          *   Imperfect Duty: General, flexible (e.g., help others when possible).
          *   *Application:* The institution is converting an Imperfect Duty (voluntary help) into a Perfect Duty (required for advancement) without acknowledging the shift.
      *   *Framework B: Structural Coercion/Political Philosophy (Arendt, Foucault, Young).*
          *   Focuses on power dynamics and systemic pressure.
          *   *Application:* The "choice" is constrained by the structure of career advancement.
      *   *Recommendation:* Framework B is stronger for diagnosing the *power* dynamic, but Framework A helps define the *ethical category* of the act.
      *   *Reform Choice:*
          *   Option 1 (Codify/Pay): Acknowledges the work is labor. Aligns with "Perfect Duty." Fairer, sustainable.
