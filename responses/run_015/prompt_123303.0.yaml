answer: |-
  Dear Professor Wren,

  Thank you for your letter. It is a pleasure to correspond with a colleague who brings the disciplined eye of a natural scientist to the often murky waters of normative systems. You ask where your analogy with the laboratory fails, and I think the answer lies in the difference between physical constraints and social facts. In geochemistry, a fixed point is stable because the laws of nature do not choose to change them. In a charity deed, a rule is stable only because the people subject to it agree to treat it as stable. Your instinct to look for a fixed point is correct, but the fixed point in a legal or quasi-legal system is not found in the text of the document itself. It is found in the attitude of the trustees toward the document. This distinction between the rules written on the page and the social practice of accepting those rules is the key to unlocking the three proposals you describe, and I believe they are three separate problems rather than one tangled knot.

  Regarding the Chair's proposal, the difficulty is indeed logical rather than spiritual. You are right to suspect that the word obviously is doing no work. If Clause 14 allows amendment by a two-thirds majority, then any new clause introduced under that power is itself subject to Clause 14 unless it explicitly says otherwise. To protect Clause 2, you must amend Clause 14 to say that Clause 2 requires unanimity. But unless you also say that this new requirement itself requires unanimity to change, a future two-thirds majority can repeal the protection and then amend Clause 2 in the same afternoon. The Chair is relying on a moral constraint where only a logical one will suffice. To make it stick, the new clause would need to be self-entrenching, stating that it too can only be changed by unanimity. Whether such self-entrenchment is logically possible is a deeper question, but without it, the protection is illusory. The distinction you seek here is between a first-order rule, which governs conduct or spending, and a second-order rule, which governs how the first-order rules are changed. The Chair is trying to use a second-order rule to create a privileged first-order rule without upgrading the second-order rule itself.

  The Treasurer's proposal is logically defective in a different way. You have identified the temporal paradox precisely. A vote is valid or invalid at the moment it is taken, based on the rules existing at that moment. If Clause 14 requires two-thirds, and you have only a majority, the vote fails. It does not matter that the content of the proposal is to lower the threshold. You cannot use a rule that does not yet exist to validate the act that brings it into existence. This is not merely an oddity; it is a performative contradiction. The delayed effect clause means the new rule applies to future amendments, not to the amendment that creates it. The trustee who says this authorises itself is mistaken. The vote was lost when it was counted, and no subsequent change in the rules can retroactively validate a nullity. This is where your laboratory analogy holds best: you cannot satisfy a constraint by changing the constraint after the measurement has failed.

  Your own proposal raises the most profound philosophical issue. The younger trustee's objection about the dead hand of 1974 shows that you have distinguished between the existence of a power and the possibility of its exercise. A procedure that exists on paper but cannot be used in practice is no procedure at all. However, your proposal pushes the difficulty up one level, as you suspect. If you forbid amendments that leave the deed without a procedure, you need a rule to determine what counts as a procedure. Is a procedure that requires the assent of the dead a procedure? Formally, yes. Practically, no. To resolve this, you would need a higher standard, perhaps that the procedure must be physically possible for living trustees. But then who decides what is physically possible? This leads to the infinite regress you fear. There is no logical stop to this chain unless you accept that at some point, the group must simply agree to stop looking for higher rules and accept a current practice as valid.

  This brings me to the historical defect you discovered regarding the 1991 revision. This is the most dangerous of the issues you face, yet paradoxically, it is the one most likely to be resolved by practice rather than logic. If the 1991 meeting was invalid, then the trustees appointed thereafter were not properly appointed, and their decisions, including the current composition of the committee, are potentially void. In strict logic, the chain is broken. However, normative systems often survive such breaks through a shift in the foundational rule of acceptance. If the trustees have acted for thirty years on the assumption that the 1991 revision was valid, and no one challenged it until now, the system has effectively re-founded itself on custom rather than lineage. The validity comes from the current acceptance of the trustees, not the historical purity of the chain.

  You asked for my confidence level and for me to identify the claim most likely to be quarreled with. I am moderately confident in the analysis of the three proposals, as these are standard problems in the logic of normative systems. However, I am less confident about the historical defect, and this is the claim I expect a philosopher working on these matters to quarrel with. I have suggested that long-standing acceptance can cure a foundational defect in validity. A strict formalist would argue that a nullity remains a nullity regardless of how long it is ignored, and that the only cure is a complete re-enactment of the deed by properly constituted members. My view relies on the idea that the authority of the deed rests on social fact rather than logical pedigree, and while I believe this describes how such trusts actually survive, it is theoretically vulnerable to the objection that it conflates what is with what ought to be.

  To answer your final question about where the analogy fails: it fails because the laboratory does not care about your measurements, but the trustees do. The stability you seek is not a fixed point in the text, but a fixed point in the collective intention of the group. The distinction between a rule and a rule about rules helps clarify the first two proposals, but it cannot solve the third or the historical issue without appealing to that collective intention. You do not simply stop at the higher level; you stop when the group agrees that the level they are standing on is solid enough. I hope this helps you navigate the committee meeting. It sounds as though your philosophical training is serving you well, even if it has made the practical difficulties more visible.

  Yours sincerely,

  Dr Vance
