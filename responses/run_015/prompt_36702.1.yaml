answer: |-
  It is completely understandable why that argument left you feeling unsettled, because your intuition is correct that the slogan someone would have done it anyway is doing far too much heavy lifting for a single sentence. It sounds like a profound insight into the structure of history, but when you pull on the thread, it unravels into several distinct claims that range from the trivially true to the highly contentious. To get to the bottom of this, we need to separate the claim about the existence of an idea from the claim about the timing of its arrival, and both of those from the claim about how the world receives it. The weakest version of your friend's claim is that given infinite time, some human being would eventually conceive of natural selection. This is trivially true in the same way it is true that someone would eventually invent the wheel; unless you believe scientific truths are supernatural revelations granted to specific chosen souls, the facts of nature exist independently of us, and eventually, we will map them. However, this trivial truth does absolutely no work to support your friend's conclusion that individual people barely matter. Even if someone would have discovered gravity eventually, it matters immensely whether that happens in 1600 or 1900, because the context changes what the discovery can do. If the claim is tightened to say that someone would have done it within a specific window, say within a decade or two of Darwin, it becomes a substantive claim about the maturity of the field and the zeitgeist. This is the multiple discovery hypothesis, which holds that when the precursors are in place, the discovery becomes inevitable. This is often true in science, as seen with Newton and Leibniz or Darwin and Wallace, but even here, it does not fully vindicate the idea that individuals are decoration. It suggests that the *discovery* was ripe, but it does not prove that the *consequences* would have been identical.

  This leads to the crucial distinction between the discovery itself and the reception of that discovery, which is where your friend's argument becomes most vulnerable. You hit on this when you wondered if Wallace, a young nobody corresponding from Malaysia, would have seen his idea catch on the same way. The claim that the idea would be accepted and acted upon by the wider world in the same way is not just substantive; it is likely false. Darwin was a respected member of the British scientific establishment with a vast network of correspondence and a reputation to uphold, whereas Wallace was a collector on the fringe. Darwin's version of the theory came wrapped in decades of accumulated evidence and social capital, which allowed it to withstand the initial backlash. A theory presented by Wallace alone might have been dismissed as speculation or radicalism, delaying the acceptance of evolutionary theory by a generation. If the acceptance is delayed, the impact on biology, theology, and society changes. Therefore, even if the discovery was inevitable, the individual mattered immensely in shaping the trajectory of its influence. Your friend's conclusion that great-man biographies are decoration relies on the assumption that the output of history is a fixed destination that we are all marching toward, but if the messenger changes the message's reception, then the messenger matters. The biography is not decoration; it is the vector that determines the speed and direction of the idea's propagation.

  When your friend extends this logic to the abolition of slavery, the stakes become even higher and the claim becomes even more dubious. To say someone would have abolished slavery anyway is to make a claim about moral and economic inevitability. It suggests that economic forces alone would have rendered slavery obsolete regardless of the activists, politicians, and rebels who fought for abolition. This is a genuinely substantive claim about how history works that could easily be false. Many historians argue that slavery was economically robust and that without the specific moral pressure and political maneuvering of specific individuals and movements, it could have persisted much longer or evolved into different forms of coerced labor. If the abolition of slavery was not inevitable but was instead the result of contingent struggles, then the individuals involved mattered fundamentally. In this case, your friend's slogan collapses into a form of historical determinism that ignores the fragility of moral progress. If the claim is that the outcome would end up roughly the same shape, one must ask what counts as the same shape. Does it mean slavery ends, or does it mean it ends with the same rights, the same reconstruction, and the same social aftermath? Those details are where individuals matter most, and glossing over them to say it would have happened anyway is a way of erasing the agency of those who suffered and fought to make it happen.

  This brings us to your keyboard layout example, which is fascinating because your friend was partially right that it is a different kind of case, but wrong to dismiss it as irrelevant to his broader point. The QWERTY layout is not a scientific truth like natural selection; it is a convention. There is no fact of the matter about which keyboard layout is true, only which is efficient or standardized. This is a case of path dependence, where an early accidental choice gets locked in because switching costs become too high. Your friend likely said it was different because scientific discoveries are convergent, meaning everyone arrives at the same truth, whereas technical standards are often divergent and arbitrary. However, this difference actually undermines his argument rather than saving it. If history contains both convergent truths and contingent conventions, then you cannot make a blanket statement that individuals don't matter. In the case of QWERTY, specific individuals and corporate decisions locked in a suboptimal standard that affects billions of people every day. If history is a mix of inevitable discoveries and contingent conventions, then the weight of individual agency varies depending on which layer of history you are examining. By dismissing the keyboard example, he was trying to protect his general rule from a counterexample that shows how accidental factors can dominate history. The difference matters because it shows that his slogan only applies to a specific subset of historical events, likely scientific discoveries during periods of high readiness, and cannot be generalized to smartphones, social movements, or technical standards.

  There is also a significant chunk of your argument that turns out to be just about words, specifically regarding the definition of matter. When your friend says individuals barely matter, he seems to mean that they are not necessary conditions for the event to occur at some point in the infinite future. But when you feel that they do matter, you are likely talking about whether they are necessary conditions for the event to occur *when* it did, *how* it did, and with *what consequences*. If I push a boulder off a cliff, gravity ensures it will fall eventually, but I still matter because I determined the timing and the target. If your friend defines matter as being the sole cause of an event's existence in the entire timeline of the universe, then he is right that individuals rarely matter in that sense. But that is a trivial and uninteresting definition of matter. In any practical historical sense, accelerating a discovery by twenty years, framing it in a way that ensures its acceptance, or fighting for a moral cause that might otherwise have been ignored, constitutes mattering. The verbal dispute lies in whether we are discussing the inevitability of the concept or the contingency of the history. If you are talking about the history of human experience, the timing and texture of events are everything, and individuals shape those. If you are talking about a abstract log of which truths were eventually uncovered, then individuals look smaller. You were arguing about history; he was arguing about a timeline of truths.

  Ultimately, none of the readings of his slogan fully support the sweeping conclusion that great-man biographies are basically decoration. The trivial reading supports it only by redefining mattering out of existence. The substantive reading about timing is often false, as discoveries can be delayed by lack of advocacy. The reading about reception is frequently false, as the status of the discoverer shapes the theory's fate. And the reading about social outcomes like abolition is highly contentious and likely false in many cases. Your friend's error was taking a heuristic that works sometimes in the history of science, such as the concept of multiple discovery, and inflating it into a totalizing philosophy of history that denies agency. He wanted the comfort of believing that history is a train on a track, where the conductor doesn't really matter because the train reaches the station regardless. But history is more like a river that can carve new channels, dry up, or flood depending on obstructions and inputs. The keyboard example was a perfect wedge to show that sometimes the path is arbitrary and locked in by chance, not inevitability. By separating these claims, you can see that while some discoveries were ripe for the picking, the basket they were placed in, the hands that carried them, and the speed at which they were delivered were all contingent on specific people. Your discomfort came from sensing that his slogan was erasing the texture of reality to fit a neat theory, and you were right to feel that the particular person is often the difference between an idea that changes the world and an idea that gathers dust in a drawer.
