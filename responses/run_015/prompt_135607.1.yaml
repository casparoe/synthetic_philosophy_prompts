      *   **Round 3: The Crux (Voluntary Participation).** Mara argues the pressure to participate makes it coercive. Dov argues all civic life has pressure.
      *   **Round 4: Specialization/Corruption.** Mara argues specialists will emerge anyway. Dov argues the structure prevents it.
      *   **Ending:** Unresolved. Both stand their ground but acknowledge the other's point.

  4.  **Writing - Focus on Voice and Pace:**
      *   *Mara:* Precise, worried about coercion and authenticity.
