  8.  **Final Polish:** Tighten the dialogue tags. Remove unnecessary descriptions. Ensure the flow feels like a real meeting sidebar or heated council session. (Actually, let's make it feel like a late-night council session winding down).

  *(Self-Correction on Word Count)*: I need to make sure I don't go too short. I'll expand on the "specialization" argument to ensure depth.

  *(Self-Correction on Rousseau)*: Avoid naming "Geneva" too much, keep it about *this* town, but the subtext is clear.

  *(Final Check on Crux)*: Make sure Mara's point about "opting out of civic life" lands hard.

