answer: |-
  **Mara:** You're calling it a festival, Dov, but you've built a stage. Even if it's flat, even if it's in the mud—the moment you put a platform in the square, you've created a front.

  **Dov:** It's a platform for standing on. Not a proscenium. There's no fourth wall. The crowd surrounds it.

  **Mara:** The crowd surrounds the gallows too. It's about where the eyes go. If I'm dancing in the square, I'm looking at my neighbor. If I'm watching a play, I'm looking at the platform. You've turned the town into an audience.

  **Dov:** Only if you sit down. The design specifies participation points. Chorus work. If the script calls for the crowd to argue back, you're not watching. You're in it.

  **Mara:** Script. There's the word. Who writes it?

  **Dov:** Collective submission. Edited by the council.

  **Mara:** Edited. So someone decides which version of this town gets told. That's fiction. That's selection. Rousseau's point wasn't just about tickets, it was about representation. A festival is the community presenting itself to itself. A play is the community pretending to be something it's not.

  **Dov:** Okay. You're right about the editing. There's selection. There always is. You want a midsummer dance? Someone has to pick the date. Someone has to tune the fiddles.

  **Mara:** Tuning isn't scripting. If I dance, I'm expressing myself. If I memorize a line someone else wrote about my neighbor's divorce, I'm performing a fiction.

  **Dov:** But it's our fiction. Not a touring company's.

  **Mara:** It's still a mask. And you're forcing people to wear it. The lottery.

  **Dov:** It's civic duty. Like jury duty.

  **Mara:** Exactly. You've turned expression into conscription. If this becomes the big event of the year—the thing everyone talks about—and you're drawn by lot to play the drunkard, or the miser...

  **Dov:** Then you play the part.

  **Mara:** And if I refuse? If I say I don't want to pretend in public?

  **Dov:** Then you opt out.

  **Mara:** Do I? If this is the central civic ritual, opting out isn't staying home, Dov. It's withdrawing from the town. You've made participation mandatory by making it the only thing that matters.

  **Dov:** (Pauses) Alright. That's a fair point. The pressure is real. If we make this the centerpiece, silence looks like dissent.

  **Mara:** Thank you.

  **Dov:** But. You're assuming the festival solves that. If we do your dance—everyone out, bonfire, shared meal—if I sit in my house, isn't that also withdrawal?

  **Mara:** No. Because the dance doesn't require me to be someone else. I can join the circle for five minutes or leave after an hour. It's porous. A role is rigid. If I'm cast, I'm bound to rehearsals. I'm bound to the script.

  **Dov:** So it's about flexibility.

  **Mara:** It's about authenticity.

  **Dov:** But look at year two. Year three. You think someone won't start coaching the cast? Someone won't write more submissions than everyone else and dominate the script?

  **Mara:** Yes. That's my point.

  **Dov:** So the specialization comes back. The actors emerge. The playwright emerges.

  **Mara:** Exactly. So why build the platform? Why institutionalize the corruption? If specialization is inevitable, your design just hides it behind a lottery.

  **Dov:** Because the design fights it. Open rehearsals. No director. If someone starts coaching, the town sees it. In a normal theater, the hierarchy is hidden in the contract. Here, it's in the square.

  **Mara:** You think visibility stops power?

  **Dov:** I think it checks it. Better than your festival, where the power is who owns the fiddles.

  **Mara:** Nobody owns the fiddles. It's a potluck.

  **Dov:** Someone brings the best fiddle. They lead the tune. It's the same dynamic. You're drawing a line between spectacle and festival that dissolves the moment you look at it.

  **Mara:** It doesn't dissolve. There's a difference between doing and watching.

  **Dov:** Is there? When the crowd joins the chorus...

  **Mara:** They're still following a cue.

  **Dov:** So are dancers following the music.

  **Mara:** (Frustrated) The music doesn't tell you what to feel. The script does.

  **Dov:** Does it? Or does it just give you a shape to fill? Look, Mara. You want pure presence. No fiction. No roles. But we live in a town of three thousand people. We don't all know each other anymore.

  **Mara:** So we eat together.

  **Dov:** We eat, we drink, we go home. It's nice. It's safe. But does it force us to confront each other? A play about us—about the mill closing, about the new road—forces us to see the conflict.

  **Mara:** It forces us to watch a simulation of the conflict.

  **Dov:** It forces us to speak the lines. If you're cast as the mill owner, and you're a worker... you have to say his words. You have to stand in his spot.

  **Mara:** That's empathy.

  **Dov:** That's the point.

  **Mara:** (Quieter) It's coerced empathy.

  **Dov:** Maybe. But is voluntary empathy doing any work?

  **Mara:** (Sighs) You're right about the festival. The dance can become routine. It can become empty. I know that.

  **Dov:** So give ground there.

  **Mara:** I'm giving ground on the routine. I'm not giving ground on the coercion. If you build this, you make the town a stage. And if I don't want to act? If I just want to live here?

  **Dov:** Then you watch.

  **Mara:** And become a spectator. Which was the original sin.

  **Dov:** Or you join the crowd chorus.

  **Mara:** On your terms. Not mine.

  **Dov:** On the town's terms. Which is what you wanted.

  **Mara:** I wanted a gathering. Not a production.

  **Dov:** We're producing ourselves either way. The question is whether we admit the artifice.

  **Mara:** (Shakes head) You're assuming the artifice is harmless because we built it. But structures harden. That platform won't stay flat. Someone will want a roof. Then walls. Then tickets to pay for the roof.

  **Dov:** Then we tear the roof down.

  **Mara:** You think you can fight the drift forever?

  **Dov:** I think trying is better than pretending we don't drift.

  **Mara:** So we build it knowing it will fail?

  **Dov:** We build it knowing it will change. Like the town.

  **Mara:** (Stands up) I'm voting for the dance.

  **Dov:** I know. I'm voting for the platform.

  **Mara:** Then we're at an impasse.

  **Dov:** No. We're at a rehearsal. See you in the square.
