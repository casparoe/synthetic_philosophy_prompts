          *   **Dov:** Supports the theater proposal. Argues it *is* a civic festival. Sharp, knows the material, not just pro-entertainment.
      *   **Dynamic:** Real argument, not podium speeches. Interrupting, short turns. Responding to actual points. Breaking distinctions vs. repairing/relocating objections.
      *   **Progression:** At least two "OK, you're right about that, but..." moments. Neither wins completely. No clear resolution.
      *   **Key Topics (pick 3-4):**
          1.  Lottery/amateur setup vs. actors (pretending, public failure).
          2.  Scripting fiction vs. community representing itself (selection bias).
          3.  Free admission vs. labor cost/regional attraction.
          4.  **Crux:** Voluntary participation vs. civic pressure (opting out = opting out of civic life).
          5.  Specialization of roles (blast radius of critique).
          6.  Second-order specialization (coaching, script dominance).
      *   **Format:** 800-1200 words. Short turns. No long Rousseau quotes. Use Rousseau's positive picture (festivals, dancing) argumentatively.

  2.  **Select Topics:**
      *   *Crux:* Voluntary participation vs. civic pressure (Topic 4).
      *   *Secondary:* Scripting fiction vs. community representation (Topic 2).
      *   *Tertiary:* Second-order specialization (Topic 6) - fits well with the "corruption over time" argument.
      *   *Maybe:* Lottery/actors (Topic 1) - can be woven into the specialization point.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Jump straight into the tension. Establish the Rousseau context without quoting.
