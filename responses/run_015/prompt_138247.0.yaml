prompt: |-
  I work in clinical education for a regional ambulance service — about two thousand operational staff, mixed roles from emergency dispatchers to paramedics to newly qualified technicians — and several times a year I have to turn a new or revised clinical protocol into training that crews will actually follow at three in the morning, under time pressure, with a patient in front of them. The constraints are unglamorous: I get ninety-minute slots in the rota, a couple of high-fidelity simulation days a year, no ongoing coaching budget, and every package has to be signed off by the clinical director and, where it touches a scope-of-practice question, by staff-side. Last weekend, coming back from a two-day conference, I spent about three hours in a hotel bar arguing with an old colleague who now lectures in paramedic science. She said our protocols, mnemonics and handover templates produce crews who are competent without comprehending anything, and that what we should be doing is teaching people to reason; I said the mnemonics *are* the reasoning, offloaded into a tool, and that no amount of "understanding the physiology" survives adrenaline and sleep loss. We ended up misusing, I suspect, a four-level scheme for kinds of minds — as I half-remember it: creatures hard-wired by evolution to do a small fixed repertoire; creatures that can learn within a lifetime by being reinforced for what they actually try out in the world; creatures that can pre-screen candidate actions internally, so that bad options can be discarded in the head instead of in the field; and creatures whose heads have been re-equipped with imported thinking tools — words, diagrams, checklists, formulae — with that last grade named after some psychologist called Gregory. My colleague used the ladder to argue that almost everything we do is pitched one rung too low; I used the same ladder to argue that our checklists are the highest rung, not the lowest. Neither of us could say how you would actually decide, item by item, which rung a given behaviour needs, and that is the argument I need settled in a form my trainers can use.

  What I want is a triage procedure my team can run on each discrete behaviour in a protocol — the questions in order, what counts as an adequate answer to each, where it stops with a "no, this cannot be trained in the time you have", and where it hands the decision to a person because it is a question of authority or values rather than of learning. It has to be operable by an instructor who has never heard any of this theory, on a single page, in ten minutes per item. Please build it around distinctions that survive that simplification and say which ones you are dropping and what it costs. Some things I have been playing with, which you should use, fix, or throw away as you see fit: the *trial cost* of an item — how bad it is if the learner finds out by actually trying it on a patient, which is what pushes something from on-the-job shaping to simulation or to a rule that filters options before action; the *transfer distance* between the training room and the context where the behaviour has to appear, on a scale from identical through similar to genuinely novel; the *installation depth* of any tool you want crews to use, meaning what sub-tools must already be in place before a mnemonic or threshold value does any work, and what it takes to install them; the *empty-room test*, my name for checking whether a behaviour shows up when no instructor and no assessment is in the room, which I think is what separates something that has really been learned from something the crew has merely learned to perform for us; and *Darwinian residue*, the parts of a failure that are hard-wired rather than trained — startle, tunnel vision, degraded hearing under stress, fatigue — and which therefore have to be designed around rather than educated away. I also want the interference question handled explicitly: crews arrive with years of reinforcement history that rewards speed and seniority, and I suspect some of our training fails not because it is pitched at the wrong rung but because the payoffs in the system still favour the old behaviour, which would make it a management decision and not a training one.

  Then run the finished procedure on three items and show your working, including one where I will not like the answer. First: getting crews to complete a new sepsis screening tool and make a pre-alert call on every eligible patient, when the current failure mode is that experienced crews eyeball the patient and skip the form. Second: a rarely used, high-stakes invasive skill with a catastrophic trial cost — paediatric intraosseous access in a moving vehicle will do — where I cannot afford more than a single simulation session per crew. Third, and this is the one I expect to resent: our flagship ninety-minute module on the physiological reasoning behind the new chest-pain pathway, which my colleague would call the only genuinely higher-rung thing we do and which I have defended for two redesigns. Tell me honestly whether the procedure says that module is doing work it cannot do, whether it should be cut, shortened, or moved somewhere it bites, and what I would put in its place. Finally, be explicit about what the procedure cannot tell me: I need to know which of these calls it has no authority over, where it will confidently mislead me, and whether there is any way to use it after an incident to tell a misclassification from a botched implementation. If the four-level scheme is the wrong frame for any of this, or if it is being stretched past what it was built for, I would rather be told that than handed a tidy procedure built on it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Clinical Education Lead for a regional ambulance service (approx. 2,000 staff).
      *   **Constraints:** 90-minute training slots, limited sim days, no ongoing coaching budget, strict sign-off (Clinical Director + Staff-side/Union).
      *   **Problem:** Need to translate protocols into training that works under stress (3 AM, adrenaline, fatigue).
      *   **The Conflict:** A debate with an academic colleague about *how* to train. Colleague argues for "reasoning/understanding" (higher cognitive rung); User argues for "tools/mnemonics" (externalized reasoning/cognitive offloading). Both used a "four-level scheme of minds" (likely Dennett's Intentional Stances or a variation of Popper's Darwinian/Skinnerian/Popperian/Gregoryan creatures) but couldn't operationalize it.
      *   **The Request:** A triage procedure (single page, 10 mins/item) for instructors to decide *how* to train a specific behavior. Must incorporate specific concepts provided by the user (*trial cost, transfer distance, installation depth, empty-room test, Darwinian residue, interference*).
      *   **The Test:** Run the procedure on three specific items (Sepsis screening, Paediatric IO in moving vehicle, Chest-pain physiology module). One answer must be unwelcome.
      *   **The Caveat:** Be honest about the procedure's limits, potential misclassifications, and whether the "four-level scheme" is actually appropriate.

  2.  **Deconstruct the "Four-Level Scheme":**
      *   The user describes:
          1.  Hard-wired/Evolutionary (Darwinian).
          2.  Learning by reinforcement/trial-and-error (Skinnerian).
          3.  Internal pre-screening/thought experiments (Popperian).
          4.  Imported thinking tools/culture (Gregoryan).
      *   *Identification:* This is Daniel Dennett's "Kinds of Minds" (derived from Karl Popper).
          1.  Darwinian Creatures (pre-wired).
          2.  Skinnerian Creatures (reinforcement).
          3.  Popperian Creatures (internal hypothesis testing).
          4.  Gregoryan Creatures (cultural tools/language).
      *   *Critique:* The user and colleague argued about whether checklists are "low rung" (bypassing thought) or "high rung" (Gregoryan tools). Actually, in Dennett's framework, using cultural tools *is* the highest rung. However, for *training design*, the distinction isn't just about the "mind level" but about *cognitive load under stress*. The procedure needs to bridge the theoretical ladder with practical instructional design.

  3.  **Develop the Triage Procedure (The "Protocol Triage Tool"):**
      *   *Goal:* Decide the training method (Rule/Tool vs. Reasoning/Sim vs. System Fix) for a specific protocol item.
      *   *Format:* Single page, sequential questions, stop conditions.
      *   *Incorporating User Concepts:*
          *   *Trial Cost:* If high, cannot be Skinnerian (trial/error). Must be Popperian (sim) or Gregoryan (rule).
          *   *Transfer Distance:* If high (training != reality), need high fidelity or strong tools.
          *   *Installation Depth:* Does the tool require prior knowledge?
          *   *Empty-Room Test:* Will they do it without supervision?
          *   *Darwinian Residue:* Can we train away startle/fatigue? (No).
          *   *Interference:* Does the system reward the wrong behavior?
      *   *Structure:*
          1.  Safety/Trial Cost Check (Can they fail safely?).
          2.  Stress/Stability Check (Darwinian Residue).
          3.  System/Interference Check (Is this a management problem?).
          4.  Cognitive Load/Tool Check (Gregoryan vs. Popperian).
          5.  Final Decision (Train as Rule, Train as Reasoning, or Escalate).

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Step 1: The "Blood Price" (Trial Cost).* If failure kills/harms, no on-job learning. Must be sim or rule.
      *   *Step 2: The "3 AM Test" (Darwinian Residue).* If it requires fine motor skills or complex math under stress, can it be offloaded? If yes -> Tool. If no -> Redesign protocol.
      *   *Step 3: The "Payoff" (Interference).* If the system rewards skipping this step (e.g., speed over safety), training won't fix it. Escalate to Management.
      *   *Step 4: The "Black Box" (Reasoning vs. Rule).* Do they need to understand *why* to make it stick, or does understanding slow them down? Use the "Empty-Room Test."
      *   *Decision:* Assign a "Rung" and a "Method."

  5.  **Running the Procedure on the Three Items:**

      *   **Item 1: Sepsis Screening & Pre-alert.**
          *   *Current State:* Experienced crews skip it (eyeball test).
          *   *Trial Cost:* High (missed sepsis = death), but *omission* is the risk, not commission.
          *   *Interference:* High. Speed/Seniority rewards "knowing" without forms.
          *   *Darwinian Residue:* Fatigue makes form-filling hard.
          *   *Verdict:* This is likely an *Interference* problem, not a training problem. Training won't fix a culture that values "gut instinct" over forms. Needs management/culture change + simplified tool.
          *   *User Reaction:* They might not like this because it says "Your training won't fix this."

      *   **Item 2: Paediatric IO in Moving Vehicle.**
          *   *Trial Cost:* Catastrophic.
          *   *Transfer Distance:* Huge (Sim vs. Moving Ambulance).
          *   *Frequency:* Rare.
          *   *Constraint:* Only 1 sim session.
          *   *Verdict:* Cannot train "reasoning" here. Must be Gregoryan (Algorithm/Checklist) + Muscle Memory (Skinnerian) in Sim. But the "Moving Vehicle" part is the killer.
          *   *Hard Truth:* One sim session is insufficient for *moving* vehicle IO. The procedure should flag this as "Untrainable to standard with current resources." Recommendation: Restrict protocol (do it only when stopped) or increase sim budget.
          *   *User Reaction:* They won't like the "Untrainable" verdict or the restriction recommendation.

      *   **Item 3: Chest-Pain Physiology Module (90 mins).**
          *   *Goal:* Physiological reasoning.
          *   *Constraint:* 90 mins, 3 AM context.
          *   *Analysis:* Does understanding ECG pathophysiology change the *action* at 3 AM? Usually, the protocol is "Chest Pain -> Aspirin -> GTN -> ECG -> Transport." Reasoning doesn't change the algorithm unless they are deviating.
          *   *Empty-Room Test:* Will they recall the physiology under stress? Unlikely.
          *   *Verdict:* This is likely "Popperian" training (reasoning) applied to a "Gregoryan/Skinnerian" problem (follow the pathway). It consumes budget for low retention.
          *   *Recommendation:* Cut/Shorten. Move reasoning to CPD/Online. Use face-to-face for *barriers* to the pathway.
          *   *User Reaction:* This is the one they expect to resent. It attacks their "flagship" module.

  6.  **Addressing the Theoretical Frame (Dennett's Ladder):**
      *   Is it the right frame? It's useful for *classification*, but dangerous for *prescription*. A Gregoryan tool (checklist) is often the best support for a stressed Skinnerian brain. The colleague was wrong to say tools are "low rung." The User was right that tools *are* the reasoning offloaded.
      *   *Limit:* The procedure cannot distinguish between a "bad tool" and a "bad learner." It cannot fix systemic culture alone.

  7.  **Refining the Output:**
      *   *Tone:* Professional, direct, respectful of the constraints, slightly academic but grounded.
      *   *Structure:*
          1.  Validation of the Theory (Dennett).
          2.  The Triage Procedure (The "One-Pager").
          3.  The Three Case Studies (with working shown).
          4.  Limitations & Warnings.
      *   *Key Check:* Did I use the user's specific terms? (Trial cost, transfer distance, installation depth, empty-room test, Darwinian residue, interference). Yes.
      *   *Key Check:* Is one answer unwelcome? Yes (The Chest Pain module and the Sepsis culture issue).

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure I don't just say "Cut the chest pain module." Say *why* based on the procedure (Transfer Distance/Empty-Room failure).
      *   *Correction:* Ensure the "Four-Level Scheme" is acknowledged but not worshipped. It's a heuristic, not a law.
      *   *Correction:* The Sepsis item is tricky. It's not just "Interference." It's also "Installation Depth." If the tool is hard to use, they won't use it. I need to make sure the procedure captures *usability*.
      *   *Refinement on the "Unwelcome" Answer:* The user expects to resent the Chest Pain answer. I should ensure the Sepsis answer is also challenging (it's a culture problem, not training). The IO answer should be a resource reality check.
      *   *Final check on the "Four-Level" naming:* The user mentioned "Gregory." This confirms Dennett (Richard Gregory). I will explicitly name Dennett to show I understand the reference, but keep the procedure focused on the user's terms.

  9.  **Final Review against Constraints:**
      *   Single page procedure? (I will format it to look like one).
      *   10 mins per item? (Keep questions binary or scaled simply).
      *   Operable by instructor? (Avoid jargon in the tool itself).
      *   Explicit about limitations? (Yes, final section).

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated instructional design problem wrapped in a philosophical dispute. You are describing **Daniel Dennett's "Kinds of Minds"** (Darwinian, Skinnerian, Popperian, Gregoryan), but you are rightly identifying that the academic debate about "which is better" is useless without a triage mechanism for *context*.

  Your colleague is arguing that Gregoryan tools (checklists) stunt Popperian growth (reasoning). You are arguing that Gregoryan tools *are* the survival mechanism for a Darwinian brain under stress (adrenaline/fatigue). **You are both partially right, but for different phases of the incident.**

  Below is the operational procedure you requested. It translates the four-level scheme into a decision tree that respects your constraints (time, budget, stress). Following that, I have run the three items through it. I have been honest about the outputs, including the one regarding your chest-pain module.

  ### Part 1: The Protocol Triage Tool (Single Page)

  **Instructions:** Complete one sheet per discrete protocol behaviour. Time limit: 10 minutes. If any box triggers a **STOP**, follow the arrow.

  | **Step** | **Question** | **Decision Criteria** | **Action / Output** |
  | :--- | :--- | :--- | :--- |
  | **1. TRIAL COST** | If the learner gets this wrong during on-the-job shaping, what is the immediate harm? | **High** (Death/Permanent Harm): *Cannot* be Skinnerian (trial/error).<br>**Low** (Delay/Minor discomfort): Can be shaped on job. | **High:** Go to Step 2.<br>**Low:** Go to Step 3. |
  | **2. DARWINIAN RESIDUE** | Will this behaviour survive: 3 AM, adrenaline, tunnel vision, and fatigue? | **No:** Human hardware degrades here. Do not train "focus." Design around it.<br>**Yes:** Human hardware can sustain this. | **No:** **OFFLOAD.** Convert to Gregoryan Tool (Checklist/Algorithm). Do not train reasoning.<br>**Yes:** Go to Step 3. |
  | **3. INTERFERENCE** | Does the current system (rota, culture, KPIs) reward the *old* behaviour more than the new one? (e.g., Speed vs. Safety) | **Yes:** Training will fail. The payoff structure overrides the lesson.<br>**No:** Training has a chance. | **Yes:** **STOP.** Escalate to Clinical Director/Management. This is a culture/system fix, not training.<br>**No:** Go to Step 4. |
  | **4. TRANSFER DISTANCE** | How different is the training environment from the execution environment? (Identical vs. Novel) | **High** (e.g., Static Sim vs. Moving Vehicle): Classroom theory will not transfer.<br>**Low** (e.g., Classroom vs. Classroom): Theory transfers well. | **High:** Requires High-Fidelity Sim or **Rule-Based** training only.<br>**Low:** Can use Reasoning/Physiology modules. |
  | **5. EMPTY-ROOM TEST** | If no instructor is watching and no form is audited, will they do this? | **No:** It relies on external compliance.<br>**Yes:** It is internally valued. | **No:** Needs **Installation Depth** check (see below).<br>**Yes:** Proceed to Final Classification. |
  | **6. INSTALLATION DEPTH** | To use this tool/rule, what prior knowledge must be automated? | **High:** Requires understanding underlying physiology to know *when* to apply tool.<br>**Low:** Tool is standalone (e.g., "If X, do Y"). | **High:** Requires Pre-work + Refreshers.<br>**Low:** Can be Job Aid only. |

  **FINAL CLASSIFICATION (Select One):**
  *   **[A] GREGORYAN TOOL:** (Checklist/Algorithm). Best for High Trial Cost + High Darwinian Residue. *Training Focus:* Compliance & Usability.
  *   **[B] SKINNERIAN DRILL:** (Muscle Memory). Best for High Trial Cost + Low Transfer Distance. *Training Focus:* Repetition in Sim.
  *   **[C] POPPERIAN REASONING:** (Physiology/Why). Best for Low Trial Cost + Low Transfer Distance + Low Interference. *Training Focus:* Understanding variables.
  *   **[D] MANAGEMENT ESCALATION:** (System Fix). Triggered by Step 3 Interference. *Training Focus:* None until fixed.

  ---

  ### Part 2: Running the Procedure on Your Three Items

  Here is the working for the three scenarios you provided.

  #### Item 1: Sepsis Screening & Pre-Alert
  *Current Failure: Experienced crews eyeball patient, skip form.*

  1.  **Trial Cost:** **High.** Missed sepsis = mortality. (Go to Step 2).
  2.  **Darwinian Residue:** **No.** Fatigue and "gut instinct" (expertise bias) actively fight against form-filling. You cannot train a tired paramedic to "care more" about a form than their own experience. (Verdict: **OFFLOAD**).
  3.  **Interference:** **Yes.** Your prompt notes crews are rewarded for "speed and seniority." Eyeballing is faster than form-filling. Seniority confers status; following a junior's checklist reduces status.
      *   **STOP.**
      *   **Classification:** **[D] MANAGEMENT ESCALATION.**
      *   **Working:** The procedure flags this immediately at Step 3. You cannot train away a cultural payoff that values "cowboy medicine" over "bureaucratic safety."
      *   **Recommendation:** Do not run a 90-minute training slot on "Why Sepsis Matters." They know. The tool must be frictionless (e.g., integrated into the ePCR with hard stops), and the *reward structure* must change (audits that praise compliance, not just speed).
      *   **Cost:** This will be unpopular. It tells you that your training budget is being asked to fix a leadership problem.

  #### Item 2: Paediatric IO in a Moving Vehicle
  *Constraint: Catastrophic trial cost, rarely used, 1 sim session per crew.*

  1.  **Trial Cost:** **High.** Catastrophic failure mode. (Go to Step 2).
  2.  **Darwinian Residue:** **No.** Fine motor skills degrade significantly in a moving vehicle due to vibration and G-force. Adrenaline degrades further.
      *   **Verdict:** **OFFLOAD.** This cannot be "reasoned" through. It must be mechanical.
  3.  **Interference:** **No.** (Presumably no one *wants* to fail IO access).
  4.  **Transfer Distance:** **High.** You have static sim days. The protocol requires *moving* vehicle execution.
      *   **Verdict:** **High Risk.** Classroom theory will not transfer.
  5.  **Empty-Room Test:** **No.** Under stress, without an instructor, they will revert to "stop the vehicle" or "peripheral IV."
  6.  **Installation Depth:** **High.** Requires anatomical knowledge + device mechanics.
      *   **Classification:** **[B] SKINNERIAN DRILL (with Caveat).**
      *   **Working:** The procedure flags the Transfer Distance mismatch. One static sim session is insufficient for a moving vehicle skill with catastrophic trial cost.
      *   **Recommendation:** The procedure suggests you **cannot validate this protocol** with current resources. You have two choices:
          1.  Change Protocol: IO access only when vehicle is stationary (reduces Transfer Distance).
          2.  Change Budget: Acquire moving-sim capability (expensive).
      *   **Cost:** This tells you the protocol is unsafe *as written* for the training budget provided. It forces a clinical governance conversation, not just an education one.

  #### Item 3: Chest-Pain Pathway Physiology Module (90 Minutes)
  *Your "Flagship" reasoning module. Colleague's "High Rung" ideal.*

  1.  **Trial Cost:** **Medium.** Deviating from pathway can cause harm, but the pathway itself is algorithmic (Aspirin/GTN/ECG).
  2.  **Darwinian Residue:** **No.** At 3 AM, crews do not recall coronary artery anatomy. They recall algorithms.
      *   **Verdict:** **OFFLOAD.** Reasoning is a luxury good in high-stress environments.
  3.  **Interference:** **Low.** (Generally, crews want to fix chest pain).
  4.  **Transfer Distance:** **High.** Classroom physiology does not transfer to a dark living room.
  5.  **Empty-Room Test:** **No.** Will a crew member recite the pathophysiology of ST-elevation while managing a diaphoretic patient? No. They will look at the ECG and follow the rule.
  6.  **Installation Depth:** **Low.** The pathway works as a Gregoryan Tool without deep physiological understanding.
      *   **Classification:** **[C] POPPERIAN REASONING (Misapplied).**
      *   **Working:** The procedure indicates this module is pitched at the wrong rung. It is teaching *Popperian* reasoning (internal hypothesis testing) for a *Gregoryan* problem (follow the checklist).
      *   **Recommendation:** **Cut or Move.**
          *   **Cut:** Reduce face-to-face time from 90 mins to 20 mins.
          *   **Move:** Shift the physiology content to asynchronous CPD (e-learning) for those interested.
          *   **Replace:** Use the 90 minutes for **Interference** and **Darwinian** training. Roleplay the *barriers* to the pathway (e.g., "The patient refuses aspirin," "The ECG machine is failing," "The relative is screaming"). Train the *obstacles*, not the physiology.
      *   **Cost:** This is the answer you expected to resent. It suggests your best-quality teaching is being wasted on content that does not survive the "3 AM Test." It argues that "understanding" is not a proxy for "compliance" or "safety."

  ---

  ### Part 3: Limitations & Warnings

  You asked for honesty about where this procedure fails. Here is where it has no authority and where it will mislead you.

  **1. The "Good Tool vs. Bad Tool" Blind Spot**
  The procedure assumes that if a behaviour is classified as **[A] Gregoryan Tool**, a tool *exists* that works. It cannot tell you if your checklist is poorly designed. If the sepsis form is confusing, the procedure says "Make it a Tool," but if the tool is bad, compliance will still fail. You need a separate usability heuristic (e.g., "Can this be completed in under 60 seconds with gloves on?") to validate the tool itself.

  **2. The Misclassification of "Expertise"**
  The procedure treats "Experience" as a potential interference (Item 1). However, sometimes expertise *is* the safety mechanism. If you classify a behaviour as "Rule-Based" but the rule doesn't cover the edge case, you have stripped the expert of the ability to save the patient. The procedure biases towards standardization. It cannot measure the value of *flexibility*.
  *   *Mitigation:* Add a "Exception Frequency" check. If the protocol requires deviation >10% of the time, it cannot be purely Gregoryan.

  **3. Post-Incident Analysis (The "Botch" vs. "Misclass")**
  You asked if you can use this after an incident to tell a misclassification from a botched implementation.
  *   **Answer:** **No.**
  *   **Why:** If a crew fails a **[B] Skinnerian** task (IO access), you cannot know if the *training* was insufficient (Botch) or if the *classification* was wrong (Misclass: should have been "Do not attempt in moving vehicle").
  *   **Solution:** You need a "Near Miss" reporting category specifically for "Training/Protocol Mismatch." If crews report "I knew the rule but couldn't do it due to stress," that is a Misclassification signal. If they report "I forgot the rule," that is a Training Botch.

  **4. The Theoretical Frame (Dennett's Ladder)**
  Is the four-level scheme the right frame?
  *   **Yes:** For understanding *why* a failure happened (e.g., "We asked for Popperian reasoning in a Darwinian context").
  *   **No:** For prescribing *value*. Your colleague argued Gregoryan is "lower" than Popperian. In emergency medicine, **Gregoryan is often higher safety.** A checklist that saves a life is "better" than a physiological understanding that arrives too late.
  *   **Risk:** Do not let the ladder become a hierarchy of *prestige* for your trainers. Instructors love teaching physiology (Popperian) because it makes them feel like academics. They hate teaching checklists (Gregoryan) because it feels like babysitting. This procedure validates the "babysitting" as high-stakes engineering. You must enforce that cultural shift, or the instructors will subvert the tool.

  ### Summary Recommendation

  Your colleague is arguing for **ideal minds** (how people learn in a university). You are arguing for **real minds** (how people act in an ambulance).

  Use the Triage Tool to defend your budget. When Clinical Director asks for a 90-minute physiology session, show them the **Transfer Distance** and **Darwinian Residue** scores. It moves the argument from "Education Philosophy" to "Risk Management."

  For the Chest Pain module: **Do not cut it entirely.** Reasoning prevents *complacency*. But move it to e-learning and use the face-to-face time for the **Interference** training (Step 3). Teach them how to say "No" to the patient who demands the wrong treatment, and how to use the tool when they are exhausted. That is the training that survives 3 AM.
