answer: |-
  ### Specification of Desiderata for a Regulatory Definition of Life

  **Context:** Committee on Containment and Research Ethics for Novel Engineered Systems.
  **Objective:** Establish criteria for a binary (Yes/No) classification of "Alive" for regulatory application.

  #### I. Desiderata List

  **1. Binary Decidability**
  *   **Status:** **Non-negotiable** (Regulatory Artifact).
  *   **Motivation:** The committee must issue containment orders. A probability or a degree of "aliveness" cannot trigger a legal statute.
  *   **Test Case:** *The Tessellate.* Even if the chemical network is diffuse and lacks clear boundaries, the verdict must be "Contain" or "Release," not "Partially Contain."
  *   **Test Case:** *Dormant Spore.* Must be "Alive" or "Dead," not "Potentially Alive."

  **2. Substrate Neutrality**
  *   **Status:** **Non-negotiable** (Engineering Requirement).
  *   **Motivation:** The definition must not rely on specific terrestrial biochemistry (e.g., DNA, proteins, carbon-backbone) to accommodate xenobiology and synthetic hybrids.
  *   **Test Case:** *The Chimera.* If the free-energy transduction is silicon-based but the organization is biological, it cannot be excluded solely for lacking mitochondrial chemistry.
  *   **Test Case:** *The Tessellate.* Must be evaluable even if it lacks discrete cellular units.

  **3. Metabolic Intermittency Tolerance**
  *   **Status:** **Non-negotiable** (Biological Intuition).
  *   **Motivation:** Life must be capable of persisting through temporary cessation of metabolic activity without transitioning to the "Once-Alive" category.
  *   **Test Case:** *Dormant Bacterial Spore / Desiccated Tardigrade.* These must return a verdict of "Alive" despite zero current metabolism.
  *   **Test Case:** *Fire.* Must return "Not Alive" despite continuous metabolism, distinguishing steady-state dissipation from organized persistence.

  **4. Historical Independence (The Mule Constraint)**
  *   **Status:** **Non-negotiable** (Individual Status).
  *   **Motivation:** An individual's status as alive cannot depend on its capacity to reproduce or its actual reproductive history.
  *   **Test Case:** *The Mule.* Sterile, yet alive.
  *   **Test Case:** *Skin Cell in Culture.* Capable of division but not an organism; must be "Alive" without being a "Reproducing Lineage" in the evolutionary sense.
  *   **Test Case:** *Computer Worm.* Replicates, but if it fails other criteria, reproduction alone cannot make it "Alive."

  **5. Individuality Agnosticism**
  *   **Status:** **Non-negotiable** (Ontological Precision).
  *   **Motivation:** The definition of "Alive" must not collapse into the definition of "Organism." It must apply to parts and wholes distinctively.
  *   **Test Case:** *Siphonophore / Fungal Mycelium.* The account must handle cases where the "individual" is ambiguous without failing to classify the living material itself.
  *   **Test Case:** *Skin Cell.* Must be classified as "Alive" even if it is merely a "Part of a Living Thing."

  **6. Process-Structure Distinction**
  *   **Status:** **Preference** (Theoretical Camp).
  *   **Motivation:** To distinguish self-maintaining organization from simple self-assembly or propagation.
  *   **Test Case:** *Prion.* Self-assembles and propagates structure, but lacks internal regulation. A definition favoring "Autopoiesis" excludes this; a definition favoring "Replication" might include it.
  *   **Test Case:** *Fire.* Propagates and consumes, but lacks bounded organization.

  **7. Evolutionary Capacity (Lineage Requirement)**
  *   **Status:** **Preference** (Darwinian Camp).
  *   **Motivation:** Many biologists argue life is a property of populations, not individuals.
  *   **Test Case:** *Virus.* Replicates and evolves only inside a host. If this desideratum is adopted, viruses may qualify. If excluded, they do not.
  *   **Test Case:** *The Tessellate.* If it evolves but has no units, does it count? This desideratum creates tension with Individuality Agnosticism.

  #### II. Required Distinctions

  The account must structurally differentiate the following categories rather than collapsing them into a single "Life" binary:

  1.  **Alive vs. Organism:** A skin cell is *alive* but is not *an organism*. A siphonophore colony may be *an organism* composed of *alive* zooids. The regulatory regime may apply differently to "living material" vs. "autonomous organisms."
  2.  **Alive vs. Part of a Living Thing:** Distinguish the living cell from the non-living extracellular matrix it secretes.
  3.  **Alive vs. Product of Life:** Distinguish the living bacterium from the toxin it excretes or the shell it built.
  4.  **Alive vs. Once-Alive:** Distinguish the dormant spore (Alive) from the bacterial corpse (Once-Alive). Both are chemically complex; only one retains the potential for self-maintenance.
  5.  **Alive vs. Dormant:** The definition must treat dormancy as a *state* of being alive, not a suspension of life.
  6.  **Alive vs. Never-Alive:** Distinguish the virus or computer worm (debatable) from fire or crystals (clearly never-alive).
  7.  **Binary vs. Degree:** While biology admits of degree (e.g., complexity, autonomy), the **Regulatory Verdict** must be binary. The account must specify the *threshold* where degree becomes category.

  #### III. Analysis of Constraints

  **1. The Conflict: Generalization vs. Sharp Cutoff**
  You are correct: **Substrate Neutrality (Generalization)** and **Binary Decidability (Sharp Cutoff)** are the colliding desiderata.
  *   **The Collision:** Nature presents continua (e.g., the Tessellate's diffuse boundaries, the Virus's dependency, the Spore's metabolic zero-point). Substrate Neutrality demands we accept novel forms that may exploit these continua more than Earth-life does. Binary Decidability demands we draw a line through the fog.
  *   **Defect or Impossible Purpose?** This is not a defect in the definitional project; it is a sign that the **regulatory purpose is asking for a metaphysical carve-up that nature does not provide.** Nature offers gradients; law offers binaries. The committee is not discovering a natural kind; it is *stipulating* a regulatory kind. The collision indicates that the definition will necessarily be somewhat arbitrary at the margins (e.g., the Tessellate). The committee must accept that "Alive" in this context is a legal status, not necessarily a biological truth.

  **2. The Most Exclusionary Desideratum**
  **Binary Decidability** does the most work in excluding otherwise-popular definitions.
  *   **Reasoning:** Most robust philosophical and biological accounts of life (e.g., Autopoiesis, Process Philosophy, Evolutionary Systems) view life as a continuum, a process, or a cluster concept with fuzzy boundaries. They explicitly reject the idea that there is a single moment or threshold where a system snaps from "non-life" to "life." By demanding a Yes/No verdict at a *particular time*, you automatically disqualify any definition that relies on historical lineage (which takes time to verify), evolutionary potential (which is probabilistic), or graded autonomy. It forces the adoption of a "Checklist" or "Necessary and Sufficient Conditions" model, which most contemporary biologists consider inadequate for describing reality.

  **3. The Origin-of-Life Constraint**
  The requirement that a definition **not presuppose what origin-of-life research is still trying to find out** is a **genuine constraint** that a regulator should enforce, not academic prejudice.
  *   **Reasoning:** If the definition of "Alive" requires "product of natural selection" or "descended from a common ancestor," then the first living system (the target of origin-of-life research) would, by definition, not be alive. For a regulator dealing with *engineered* systems, ancestry is irrelevant to risk. A synthetic organism created de novo poses the same containment risk as an evolved one. Relying on origin excludes the very novel systems the committee is tasked to regulate (e.g., the Chimera or Tessellate might not have an evolutionary history). Ignoring this constraint would render the committee powerless over the most novel technologies.
