          *   Fitness: How many people relate/share it.
      *   *Case B (Sourdough Crackers):*
          *   Gene: The recipe concept (discard + bake).
          *   Organism: The specific batch made by a family member.
          *   Mutation: Adding rosemary vs. chili flakes, baking time tweaks.
