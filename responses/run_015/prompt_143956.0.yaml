prompt: |-
  I teach an upper-level jurisprudence seminar, and this term I want to stage a mock adversarial collaboration rather than another rehearsal of the familiar mid-century exchange about whether the criminal law may be used to enforce morality. As a teaching artifact — and, frankly, because I want to see whether the thing can be done at all — I need you to draft the joint statement that two contemporary parties could actually sign. Party A is a legal moralist who concedes that the empirical disintegration thesis is in poor shape and has therefore reformulated the view: call it constitutive moralism. On this view a political society's shared morality is partly constituted by being given legal expression, so that decriminalising a practice does not merely fail to prevent a subsequent decline in adherence to a norm, but changes which morality it is that the society shares; the criminal law is not a cause of social cohesion but one of the places where a society's moral identity is made and declared. Party B is a Hartian liberal of a concessive stripe: she grants that some substantial shared morality is a necessary condition of any society worth having, insists on the distinction between a society's positive morality and the critical assessment of it, and denies only that legal enforcement does any work in securing or sustaining that shared morality which is not better done by leaving the norm to non-legal transmission, or which is positively undone when the law takes it up.

  Two stipulations, so that neither side is a straw man. First, both accept that the cases which prompted the original exchange are settled: neither is arguing that consensual homosexual acts or prostitution should be criminalised, and neither may rest anything on them. I want the substance tested on cases we design instead, and here are three I would like used rather than substituted: (i) the segregated spectacle — a commercial practice that nearly every member of the society finds viscerally disgusting, performed only in venues no one enters without consenting to enter, and which harms or sets back no one's interests on any account of harm the liberal is willing to employ; (ii) the seepage variant of that same case, in which good survey evidence shows that people who come to accept the practice are, over the following decade, measurably less likely to comply with unrelated norms of honesty and mutual aid, though the direction of causation is entirely unestablished; (iii) the minority test, which is my own addition and which both parties must address — a moral conviction is eligible for legal enforcement only if the society would continue to hold it, and continue to want it enforced, even were its adherents reduced to a small and politically weak minority. Please also have both parties address the assurance argument I have been sketching in seminar: much moral compliance is conditional on the belief that others also comply; open and legally tolerated flouting degrades that assurance; and a declaratory criminal law is a cheap, reliable device for restoring it. Both should say whether the expressive work this argument assigns to the criminal law could in principle be done by non-legal institutions, and at what cost.

  What I want from you is the document itself, with no preamble, no framing remarks and no history of the debate. Open with a single sentence stating the headline result: the most substantial claim the two parties found they could sign and that neither expected to sign. Then give a numbered section of agreed claims — claims about the formalism of the disagreement, about what a successful moralist argument would have to establish, about what the liberal concedes, about the three cases, and about the assurance argument — each claim phrased so that it is not vacuous: at least one party should have been inclined to reject it before the collaboration began. Follow this with a table of residual disagreements, in which each disagreement is stated twice, once in the moralist's own preferred wording and once in the liberal's, and neither wording is a caricature. Then a section on cruxes: for each, the question such that settling it would move at least one party, the case or piece of evidence both agree would bear on it, and each side's prediction about that evidence written down in advance, including what they would count as a result neither of them predicted. If you conclude that some part of the dispute is verbal rather than substantive — for instance if the constitutive claim and the causal claim collapse into one another under pressure — say exactly which part and why. Do not smooth the disagreement over with balancing formulae, do not attribute views to any named author or work, and do not give me a verdict on who wins.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**

      *   **Task:** Draft a joint statement for a mock adversarial collaboration in an upper-level jurisprudence seminar.
      *   **Parties:**
          *   Party A: Legal Moralist (Constitutive Moralism). Believes law *constitutes* shared morality/identity, not just enforces it. Concedes empirical disintegration thesis is weak.
          *   Party B: Hartian Liberal (Concessive). Grants shared morality is necessary for a good society, distinguishes positive/critical morality, denies law is the *best* or *non-damaging* way to sustain it compared to non-legal transmission.
      *   **Stipulations:**
          *   No arguing about historical cases (homosexuality, prostitution); they are settled as non-criminalizable.
          *   Must use three specific test cases: (i) Segregated Spectacle (consensual, disgusting, no harm), (ii) Seepage Variant (correlation with decline in honesty/mutual aid, causation unknown), (iii) Minority Test (enforcement only if wanted even when adherents are a weak minority).
          *   Must address the "Assurance Argument" (moral compliance is conditional; law restores assurance; can non-legal institutions do this?).
      *   **Format:**
          *   No preamble/framing/history.
          *   Open with a single sentence: The headline result (substantial claim both signed, neither expected to).
          *   Section 1: Numbered Agreed Claims (formalism, requirements for moralist, liberal concessions, the three cases, assurance argument). Must be non-vacuous (at least one party inclined to reject initially).
          *   Section 2: Table of Residual Disagreements (Moralist wording vs. Liberal wording, no caricatures).
          *   Section 3: Cruxes (Question, agreed evidence/case, pre-commitment predictions, unexpected results).
          *   Section 4: Verbal vs. Substantial dispute analysis (if applicable).
          *   No balancing formulae, no named authors, no verdict.

  2.  **Deconstruct the Positions & Find Common Ground:**

      *   *Party A (Constitutive Moralist):* Law isn't just a tool; it's part of the moral fabric. Removing law changes the morality itself.
      *   *Party B (Concessive Liberal):* Morality is needed, but law is a blunt/dangerous tool. Non-legal norms are better.
      *   *Common Ground:* Both agree society needs shared morality. Both agree law has expressive power. Both agree the old "disintegration" empirical claim was weak. Both agree on the three specific cases (as constraints).
      *   *The "Headline Result":* Needs to be something surprising. Perhaps that the *function* of law is expressive/constitutive for *both*, but they disagree on the *normative weight* of that function relative to liberty. Or, more specifically, that the "harm principle" cannot be purely empirical but must account for the constitutive effect of law on the moral environment. Let's aim for: "The criminal law's primary normative significance lies not in its coercive efficacy but in its constitutive role in defining the boundaries of the political community's moral identity." This bridges A's constitutive view and B's concession that law expresses something, even if B thinks it shouldn't.

  3.  **Drafting Agreed Claims (Section 1):**

      *   *Constraint:* Must be non-vacuous.
      *   *Claim 1 (Formalism):* The debate is not about whether law *can* influence morality (both say yes), but whether it *should* when no empirical harm exists.
      *   *Claim 2 (Moralist Burden):* Moralist must show law adds value beyond mere declaration.
      *   *Claim 3 (Liberal Concession):* Liberal admits non-legal norms can fail without state backing in specific assurance contexts.
      *   *Claim 4 (Case i - Spectacle):* Agreement that disgust alone is insufficient *unless* it signals a breakdown in the constitutive identity.
      *   *Claim 5 (Case ii - Seepage):* Agreement that correlation warrants scrutiny but not automatic criminalization.
      *   *Claim 6 (Case iii - Minority Test):* Agreement that this is a necessary condition for legitimacy.
      *   *Claim 7 (Assurance):* Agreement that law is a *focal point*, but disagreement on whether it's the *only* focal point.

      *Refining for "Non-Vacuous":*
      *   Instead of "Law influences morality," try "The absence of criminal prohibition constitutes a normative permission that alters the content of the shared morality, not merely the frequency of compliance." (A loves this, B accepts it as a premise to argue against the *value* of that alteration).
      *   On Assurance: "Non-legal institutions can generate assurance, but at a higher transactional cost and lower stability than criminal prohibition." (B might have wanted to say non-legal is *better*, but concedes it's *costlier/less stable*).

  4.  **Drafting Residual Disagreements (Section 2):**

      *   Need two columns: Moralist Wording, Liberal Wording.
      *   *Issue 1: The Cost of Legalization.*
          *   A: Decriminalization actively damages the moral identity.
          *   B: Criminalization actively damages the moral autonomy required for genuine virtue.
      *   *Issue 2: The Seepage Correlation.*
          *   A: The correlation suggests a shared underlying moral decay that law must arrest.
          *   B: The correlation suggests a social stressor that law would exacerbate by adding coercive friction.
      *   *Issue 3: The Minority Test Application.*
          *   A: The test proves the morality is objective if it survives minority status.
          *   B: The test proves the morality is merely hegemonic if it relies on majority power to survive.

  5.  **Drafting Cruxes (Section 3):**

      *   Need specific questions, evidence, and predictions.
      *   *Crux 1:* Does legal tolerance accelerate the "seepage" effect?
          *   Evidence: Longitudinal study of jurisdictions decriminalizing "Spectacle"-like acts.
          *   Prediction A: Honesty norms decline faster where law is silent.
          *   Prediction B: Honesty norms decline at same rate; law adds resentment.
          *   Unexpected: Honesty norms improve where law is silent (undermines A) OR Honesty norms collapse only where law prohibits (undermines B).
      *   *Crux 2:* Can non-legal assurance work?
          *   Evidence: Comparison of tight-knit religious communities vs. secular legal regimes on mutual aid.
          *   Prediction A: Secular legal regimes sustain aid better over time.
          *   Prediction B: Religious communities sustain aid better without law.
          *   Unexpected: Both fail equally under economic stress.

  6.  **Drafting Verbal vs. Substantial (Section 4):**

      *   Is "Constitutive" just "Causal" in disguise?
      *   If law changes identity, is that a causal effect on the *concept* of morality?
      *   Conclusion: The dispute is substantive regarding the *value* of the change, not the *mechanism*. However, the distinction between "constituting" morality and "causing" moral belief is verbally fragile.

  7.  **Review against Constraints:**

      *   Single sentence headline? Yes.
      *   Numbered agreed claims? Yes.
      *   Non-vacuous? Yes, they require concession.
      *   Table of disagreements (two wordings)? Yes.
      *   Cruxes (Question, Evidence, Predictions)? Yes.
      *   Verbal/Substantial analysis? Yes.
      *   No preamble/history/named authors? Yes.
      *   Cases (i, ii, iii) included? Yes.
      *   Assurance argument included? Yes.

  8.  **Refining the Tone:**

      *   Needs to sound like high-level jurisprudence. Precise, dense, philosophical but clear.
      *   Ensure Party A doesn't sound like a theocrat and Party B doesn't sound like a libertarian. They are both sophisticated.
      *   Ensure the "Headline Result" is actually surprising. "We agree that law is expressive" is too weak. "We agree that liberty is not the default" is too strong. Let's try: "We agree that the legitimacy of criminal prohibition turns on whether the law's constitutive effect on social identity outweighs the moral cost of coercing compliance where empirical harm is absent."

      *Wait, let's make the headline stronger.* The prompt asks for "the most substantial claim the two parties found they could sign and that neither expected to sign."
      *Idea:* They both expected to disagree on whether law *changes* morality. They now agree it does. But that's Party A's starting point.
      *Idea:* They both expected to disagree on the Minority Test.
      *Better Idea:* They agree that the "Harm Principle" is insufficient because it ignores the constitutive damage of *toleration*.
      *Let's go with:* "Both parties accept that the permissive absence of criminal law is not a neutral background condition but an active legislative choice that alters the content of the society's shared morality." (A thinks this is obvious, B thought law was neutral/non-constitutive. B conceding this is the surprise).

      *Wait, check the prompt again:* "Party A... concedes that the empirical disintegration thesis is in poor shape and has therefore reformulated the view... Party B... denies only that legal enforcement does any work... which is not better done by leaving the norm to non-legal transmission."
      *So B already admits law does work, just thinks it's bad work.*
      *So the surprise must be about the *Minority Test* or the *Assurance Argument*.*
      *Let's try:* "Both parties agree that a moral norm fails the Minority Test if its enforcement relies solely on the assurance that the majority will comply, rather than on a conviction that the act is wrongful independent of numbers." (This binds both: A can't just say "majority rules," B can't just say "majority oppresses.")

      *Actually, the strongest surprise is usually on the Assurance Argument.*
      *Headline:* "Both parties agree that the Assurance Argument succeeds in establishing a prima facie case for criminalization where non-legal institutions cannot sustain conditional compliance, but disagree on whether such conditions ever obtain without concomitant empirical harm."

      *Let's refine the Agreed Claims to ensure they hit the specific cases.*
      *Case i (Spectacle):* Agree it shouldn't be criminalized *unless* it fails the Minority Test.
      *Case ii (Seepage):* Agree correlation creates a burden of explanation, not a presumption of guilt.
      *Case iii (Minority):* Agree this is a veto condition.

      *Let's finalize the Headline:* "Both parties agree that the criminal law's capacity to constitute moral identity is real, but that this capacity generates a right to enforcement only if the identity so constituted would be willed by the adherents even were they a powerless minority." (This merges A's constitutive claim with B's liberty/minority concern).

      *Wait, one more check on "Non-Vacuous":* "At least one party should have been inclined to reject it before the collaboration began."
      *If A is a moralist, they might reject the Minority Test as a constraint on objective morality.*
      *If B is a liberal, they might reject the idea that law *constitutes* identity rather than just reflecting it.*
      *So the Headline works.*

      *Let's draft the content.*

      *(Self-Correction during drafting)*: Make sure the Table of Disagreements doesn't look like "A says X, B says Not X." It needs to be "A says X (because of value Y), B says Z (because of value W)."
      *Make sure the Cruxes are empirical/theoretical hybrids.*

      *(Final Polish)*: Ensure no "Lord Devlin" or "H.L.A. Hart" names appear. Ensure no "Wolfenden Report." Keep it timeless/contemporary.

      *(Check Stipulation 1)*: "Neither is arguing that consensual homosexual acts or prostitution should be criminalised." -> Ensure the text reflects this settlement.
      *(Check Stipulation 2)*: Use the three cases explicitly.
      *(Check Stipulation 3)*: Address Assurance Argument explicitly.

      *Let's write.*
answer: |-
  Both parties agree that the criminal law's capacity to constitute moral identity is real, but that this capacity generates a right to enforcement only if the identity so constituted would be willed by the adherents even were they a powerless minority.

  **I. Agreed Claims**

  1.  **The Non-Neutrality of Toleration:** The absence of criminal prohibition is not a neutral background condition against which morality operates; decriminalization actively alters the content of the shared morality by removing the state's constitutive endorsement of the norm, a claim Party B accepts despite prior inclination to view legal silence as mere liberty.
  2.  **The Burden of Constitutive Proof:** To justify criminalization under Constitutive Moralism, Party A must demonstrate that the legal expression of the norm adds value to the society's moral identity that cannot be achieved through non-legal social pressure, a burden Party A accepts despite prior inclination to view legal expression as intrinsically superior.
  3.  **The Limit of Disgust:** In Case (i) (the segregated spectacle), visceral disgust among the majority is insufficient to justify criminalization unless it can be shown that tolerating the spectacle degrades the assurance of compliance with other norms, a claim Party A accepts despite prior inclination to view disgust as a standalone signal of moral truth.
  4.  **The Seepage Presumption:** In Case (ii) (the seepage variant), empirical correlation between acceptance of the practice and decline in unrelated norms creates a rebuttable presumption for inquiry, but not a presumption for criminalization, a claim Party B accepts despite prior inclination to view such correlations as epiphenomenal.
  5.  **The Minority Veto:** In Case (iii) (the minority test), a moral conviction is ineligible for legal enforcement if its adherents would abandon the demand for enforcement upon losing political power, a constraint Party A accepts despite prior inclination to view objective moral truths as independent of political strength.
  6.  **The Assurance Mechanism:** Both parties agree that open and legally tolerated flouting degrades the assurance required for conditional moral compliance, and that criminal law is a reliable device for restoring it.
  7.  **The Institutional Alternative:** Both parties agree that non-legal institutions (religious bodies, professional guilds, community associations) could in principle perform the expressive and assurance work assigned to the criminal law, but Party B contends the transactional costs of relying on them are lower than the coercive costs of law, while Party A contends the stability of legal assurance is worth the coercive cost.

  **II. Residual Disagreements**

  | Topic | Party A (Constitutive Moralist) Wording | Party B (Concessive Liberal) Wording |
  | :--- | :--- | :--- |
  | **The Nature of Legal Expression** | The criminal law is a *declaratory act* that makes the morality what it is; without the law, the society literally does not share the norm in the same way. | The criminal law is a *magnifying glass* that intensifies existing norms; without the law, the society shares the norm but lacks a focal point for coordination. |
  | **The Cost of Coercion** | The coercive cost of criminalization is outweighed by the moral loss incurred when a society fails to legally identify itself with its own constitutive values. | The coercive cost of criminalization includes a moral loss incurred when a society substitutes legal compliance for genuine moral commitment, hollowing out the virtue it seeks to protect. |
  | **Case (ii): Seepage Causation** | The correlation suggests a unified moral ecology where damaging one part weakens the whole; the law must act as a dam to prevent the spread of decay even if the causal pipe is unseen. | The correlation suggests a stressed social environment where criminalization acts as an additional stressor; the law should act as a relief valve to prevent the rupture of social trust. |
  | **Case (iii): Minority Endurance** | If the minority continues to demand enforcement, it proves the norm is not merely a tool of hegemony but a genuine constituent of the good life they wish to inhabit. | If the minority continues to demand enforcement, it proves only that they have internalized their own oppression; the test requires they also retain the *power* to exit the regime. |
  | **Assurance Alternatives** | Non-legal institutions lack the universality required for public assurance; their fragmented nature allows for free-riding that inevitably erodes the conditional compliance of the majority. | Non-legal institutions possess the intimacy required for genuine assurance; the state's universality is too abstract to generate the interpersonal trust necessary for conditional compliance. |

  **III. Cruxes**

  | Crux Question | Agreed Evidence / Case | Party A Prediction | Party B Prediction | Unpredicted Result |
  | :--- | :--- | :--- | :--- | :--- |
  | **Does legal prohibition sustain the "seepage" norm better than social stigma?** | A longitudinal comparison of two demographically identical jurisdictions, one criminalizing the "seepage" practice and one relying on professional censure, measuring rates of honesty in contract law over 20 years. | Jurisdiction with criminal prohibition will show significantly higher stability in honesty norms. | Jurisdiction with professional censure will show higher stability, as legal coercion will breed resentment that undermines honesty. | Both jurisdictions show identical decline, suggesting the "seepage" is driven by macroeconomic factors unrelated to the specific norm's enforcement. |
  | **Can the "Minority Test" be satisfied without state power?** | Historical analysis of moral communities that maintained strict internal enforcement codes after losing political dominance (e.g., religious sects in secular states). | These communities will eventually assimilate or fracture, proving that without state constitutive power, the moral identity cannot be sustained. | These communities will thrive and maintain distinct identities, proving that moral cohesion is possible without state constitutive power. | The communities thrive only by becoming politically aggressive again, suggesting the test cannot be passed in a stable condition of weakness. |
  | **Is the "Assurance" provided by law distinct from the "Assurance" provided by custom?** | Survey data measuring individual willingness to comply with a norm based on (a) knowledge of criminal penalty vs. (b) knowledge of social ostracization, controlling for severity of sanction. | Compliance will correlate higher with criminal penalty, as the state provides a unique guarantee of universal application. | Compliance will correlate higher with social ostracization, as the threat is more immediate and socially embedded. | Compliance correlates equally, but *moral satisfaction* (self-reported) is higher in the social ostracization condition, decoupling compliance from moral endorsement. |

  **IV. Verbal vs. Substantial Dispute**

  Upon examination, a portion of the dispute regarding the "constitutive" nature of law appears verbal rather than substantive. Party A claims that without legal expression, the society "does not share the norm." Party B claims that without legal expression, the society "shares the norm but lacks a focal point." Under pressure, both parties agree that the *sociological reality* is identical: in both descriptions, the frequency of compliance drops and the intersubjective understanding of the norm's importance diminishes when the law is removed.

  The divergence reduces to whether this diminution is described as a change in the *identity* of the morality (Party A's preferred description) or a change in the *efficacy* of the morality (Party B's preferred description). This verbal distinction collapses when addressing the normative question: both parties agree that the removal of law changes the social world in a way that matters. The substantive dispute remains solely on whether that change is a *moral harm* that justifies coercion (Party A) or a *trade-off* that favors liberty (Party B). Consequently, the "Constitutive Moralism" label does not denote a metaphysical disagreement about the nature of social facts, but a rhetorical emphasis on the weight to be assigned to the expressive function of law in the utilitarian-style calculus of social costs.
