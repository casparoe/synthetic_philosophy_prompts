      *   **Key Historical Facts:** 1876 Act, licensing by Home Secretary, oversight committee (scientists + lay members), emphasis on knowledge advancement + minimizing unnecessary suffering.

  2.  **Drafting Section 1: The Kantian mapping (approx. 250 words)**
      *   *Goal:* Identify moral agents, indirect duties, licensing/committee in Kantian terms, role of analogue idea.
      *   *Moral Agents:* Researchers, Home Secretary, Committee members (all rational beings).
      *   *Indirect Duties:* Duty to maintain own moral character (avoid cruelty), duty to fellow humans (preserve sympathy).
      *   *Licensing:* A mechanism to ensure experiments don't harden the researcher's heart or set a bad example for society. It's not about the animal's right, but the human's moral hygiene.
      *   *Committee:* Lay members represent the public moral sentiment. Scientists represent the pursuit of knowledge (also a duty, but constrained).
      *   *Analogue Idea:* Animals mirror humans; hurting them is like hurting humans symbolically.
      *   *Drafting thought:* Need to be concise to hit word count. Focus on the transition from internal duty to external regulation.
      *   *Check:* Ensure I mention the "analogue" concept as requested.

  3.  **Drafting Section 2: Limits and silences (approx. 200 words)**
      *   *Goal:* Specify aspects of the 1876 regime that strain indirect-duty framework (suffering-minimization, mixed authority). Where is the theory silent?
      *   *Strain 1:* Explicit welfare provisions. The Act says "minimize suffering." Kant says "don't be cruel." There's a gap between avoiding *vice* in the agent and actively managing *pain* in the object. Kant doesn't care about the pain *per se*, only the effect on the human. The Act seems to care about the pain itself.
      *   *Strain 2:* Mixed authority. Lay members check scientists. Kant might worry about lay interference in rational pursuit of knowledge, or conversely, scientists lacking moral feeling. But the Act assumes animal suffering is a public concern independent of the researcher's character.
      *   *Silence:* Kant doesn't offer a metric for "unnecessary." How much suffering is too much if the human benefit is high? Indirect duty is vague on trade-offs.
      *   *Drafting thought:* Focus on the object-oriented language of the Act vs. the subject-oriented language of Kant.

  4.  **Drafting Section 3: What the case shows about the theory (approx. 200 words)**
      *   *Goal:* Assess support/undermine/complicate. Can indirect-duty reasoning alone protect public moral sentiment? Did reformers rely on direct-duty intuitions?
      *   *Analysis:* The Act's survival suggests indirect reasoning wasn't enough. Public outrage was about the *animals*, not just the *scientists' souls*.
      *   *Implication:* Reformers likely relied on utilitarian (suffering) or rights-based (intrinsic value) intuitions, even if couched in moralistic language.
      *   *Kant's insufficiency:* Indirect duty is too anthropocentric to sustain robust welfare regulation. It makes animal protection contingent on human psychology, not animal reality.
      *   *Drafting thought:* Argue that the Act reveals the limits of Kantianism in public policy regarding non-rational beings.

  5.  **Drafting Section 4: Bottom line (approx. 100 words)**
      *   *Goal:* Concise verdict. Illuminates or obscures?
      *   *Verdict:* It illuminates the *motivation* (fear of moral degradation) but obscures the *mechanism* (welfare regulation). Ultimately, it shows Kant is insufficient for modern institutional design.
