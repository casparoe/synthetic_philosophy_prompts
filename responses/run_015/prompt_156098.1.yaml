answer: |-
  ### Brainstorming: Theory vs. The Trenches

  Good's Theorem is mathematically immaculate and operationally dangerous. It assumes a frictionless world where information is costless, the decision-maker is a sovereign Bayesian updater, and the utility function is stable. In your foundation, information costs money and time (opportunity costs), you are not sovereign (boards, ministries, and press have veto power), and utility functions are political (reputation, relationships, morale). The theorem proves you should never pay for *costless* information that you are *free to ignore*. You almost never have both.

  To make this usable in 30 minutes without econometricians, we must strip the Expected Value of Information (EVI) formula down to its qualitative drivers. We cannot calculate $P(Data) \times \Delta Decision$. We must proxy it. The critical distinctions that must survive simplification are: (1) **Actionability** (will this change the binary decision?), (2) **Reversibility** (can we ignore a null?), and (3) **Perturbation** (does measuring change the system?). The distinctions we can drop are precise probabilities and monetary valuations of outcomes; we will use order-of-magnitude heuristics instead.

  The procedure will fail systematically in two places: first, where organizational culture treats *any* evaluation as a moral good regardless of utility (the "rigor bias"); second, where political constraints are hidden until after the study is commissioned. The procedure must force these into the open early. The "Values Handoff" is crucial: when the question shifts from "Will this data change our mind?" to "Are we willing to kill a promising program to satisfy a demand for proof?", that is not a calculation. That is a trustee-level risk tolerance question. The procedure must stop there and escalate.

  ***

  ### The 30-Minute Information Value Heuristic

  **Purpose:** To determine whether to commission a study (pilot, evaluation, elicitation) before committing program funds ($3M–$8M range).
  **Users:** Programme Officers and Evidence Leads.
  **Time:** 30 minutes max.
  **Inputs:** Program brief, proposed study design, cost estimates.

  **Step 1: The Reversal Test (Actionability)**
  *Ask:* "If the study returns the worst plausible result (e.g., null effect, high cost), would we definitely cancel the program?"
  *   **Yes:** Proceed to Step 2.
  *   **No:** (e.g., "We'd fund it anyway because it's cheap/politically vital") -> **Verdict: DECIDE-NOW.** Do not commission the study. It cannot change the decision, so its decision-value is zero.
  *   *Judgment Call:* This requires honesty about whether the decision is already made. If the answer is "No," admit the funding is based on values/faith, not evidence.

  **Step 2: The Cost Heuristic (Efficiency)**
  *Ask:* "Is the cost of the study greater than 10% of the program commitment, OR will the delay cost more than one year of program benefits?"
  *   **No:** Proceed to Step 3.
  *   **Yes:** High bar. You need near-certainty that the study will change the decision. If the prior belief is already strong (either for or against), **Verdict: DECIDE-NOW.** Only commission if you are genuinely agnostic (50/50) and the cost is justified by avoiding a massive mistake.

  **Step 3: The "Cannot Unsee" Test (Political Constraint)**
  *Ask:* "If the result is null or ambiguous, is there any stakeholder (Board, Ministry, Press) who will force us to cancel, even if our internal analysis says we should continue?"
  *   **No:** Proceed to Step 4.
  *   **Yes:** **Verdict: PRE-COMMIT-FIRST.** Do not commission the study until you have a written agreement from that stakeholder on how *each* possible result will be interpreted. If they refuse to pre-commit, the study is toxic. Treat as **Verdict: DECIDE-NOW** (Fund on prior, skip study) to protect the program from noisy data.

  **Step 4: The Perturbation Check (Measurement Effect)**
  *Ask:* "Does the act of measuring (e.g., a pilot in a district) signal scale-up or change staff behavior in a way that makes the pilot results invalid for the full rollout?"
  *   **No:** Proceed to Step 5.
  *   **Yes:** **Verdict: ESCALATE.** This is a strategic risk, not a measurement one. The study may create expectations you cannot meet or alter the system you are measuring. Hand to senior leadership to weigh reputational risk.

  **Step 5: The Values Handoff (Risk Tolerance)**
  *Ask:* "Is the main reason for this study to reduce *our* uncertainty, or to satisfy an external demand for 'proof' that we know might be statistically impossible to deliver?"
  *   **Our Uncertainty:** **Verdict: COMMISSION.** (Assuming Steps 1-4 passed).
  *   **External Proof:** **Verdict: ESCALATE.** This is a values question: Are we willing to risk a Type II error (killing a good program) to satisfy a demand for rigor? This requires Trustee approval.

  ***

  ### Application to Cases

  **Case A: The Flagship School Health Programme**
  *   **Context:** $6M/year, 8 years old. $1.2M evaluation proposed. Everyone believes it works.
  *   **Step 1 (Reversal):** If the eval shows null, would we cancel? *No.* It is beloved by the board and established.
  *   **Analysis:** The study cannot change the decision. According to Good's Theorem, info has value only if it can change your action. Here, the action is fixed. The $1.2M is not an investment in information; it is a cost of legitimacy.
  *   **Step 2 (Cost):** $1.2M is 20% of the annual program cost. This is exorbitant for confirmation.
  *   **Verdict:** **DECIDE-NOW.**
  *   **Work:** Do not commission the evaluation. Fund the program. The EVI is zero because the decision is invariant to the data. Spending $1.2M to confirm what you already believe is waste, not rigor.
  *   **Uncomfortable Truth:** This admits the flagship is funded on faith/politics, not evidence. Your team will hate this because it feels like abandoning "learning." But buying information you will ignore is malpractice.

  **Case B: The Unconditional Cash Top-Up**
  *   **Context:** Politically unloved. Prior sits on cost-effectiveness threshold. $60k elicitation/data linkage proposed.
  *   **Step 1 (Reversal):** If the elicitation shows low cost-effectiveness, would we cancel? *Yes.* It is politically unloved; it needs to prove its worth.
  *   **Step 2 (Cost):** $60k is <1% of the $3-8M commitment. Delay is minimal (admin data).
  *   **Step 3 (Cannot Unsee):** Can we ignore a null? *Yes.* It's an internal decision, no ministry co-funder mentioned.
  *   **Verdict:** **COMMISSION.**
  *   **Work:** This is the ideal use of EVI. High uncertainty (on threshold), low cost, high actionability. The $60k buys a clear Go/No-Go signal that prevents a potential $4M mistake.

  **Case C: The District Tutoring Programme**
  *   **Context:** Promising. Ministry co-funder. Ministry says "Null = Kill." Pilot is underpowered (20 schools). Pilot signals scale-up.
  *   **Step 1 (Reversal):** If null, would we cancel? *Yes* (Ministry will force it).
  *   **Step 3 (Cannot Unsee):** Can we ignore a null? *No.* Ministry has explicitly stated they will treat a null as proof of no effect.
  *   **Step 4 (Perturbation):** Does measuring change the system? *Yes.* Pilot signals scale-up to local staff.
  *   **Analysis:** The study is statistically weak (high noise) and the stakeholder reaction function is binary and unforgiving. A false negative (likely in an underpowered pilot) kills a promising program. The "Option Value of Ignorance" applies here: staying uncertain allows you to fund on plausibility. Measuring creates a high risk of a false "No."
  *   **Verdict:** **DECIDE-NOW.** (Specifically: Fund without the pilot).
  *   **Work:** Do not run the pilot. The Expected Value of Information is *negative*. The risk of a false negative killing the program outweighs the benefit of confirming success. You must fund based on the prior promise or not at all.
  *   **Uncomfortable Truth:** I am telling you **not to measure** a new, uncertain program because the measurement environment is toxic. This violates the "evidence-based" instinct. But in a system where null results are weaponized by partners and pilots are underpowered, generating evidence is actively harmful. You are protecting the program from the data.

  ***

  Bottom line: Your team most often violates the Reversal Test, commissioning studies to justify decisions already made rather than to inform them.

  \answer{A: DECIDE-NOW; B: COMMISSION; C: DECIDE-NOW}
