      *   *(c) Fixed Sequence (Life Plan):* Vantol until mother dies/kids grown, then Aldermere.
          *   *Pros:* Logical narrative. Solves the pension issue.
          *   *Cons:* Requires acting against future desires (the "summer itch").
      *   *(d) Accept Friend's Framing:* Pay the cost.
          *   *Pros:* Honors current feelings.
