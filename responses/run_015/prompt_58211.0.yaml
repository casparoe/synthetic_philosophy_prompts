      *   **Procurement Strategist (Strategic View):** Focuses on reputational stakes, option value, private information, war of attrition. Sees the behavior as potentially rational given incentives. Solution: Structural incentive alignment.
      *   **The Conflict:** One says "stop being irrational," the other says "the incentives made this rational."
      *   **The Goal:** A document that acknowledges both perspectives without resolving the truth, but defining *how* to find the truth.

  3.  **Drafting - Part A (Shared Premises):**
