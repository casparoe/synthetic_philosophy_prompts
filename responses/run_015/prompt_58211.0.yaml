      *   Idea 2: Private milestone announcements (tests reputational signaling).
      *   Idea 3: Sponsor rotation (tests self-justification).
      *   Need to state what each advisor expects to see.
      *   *Constraint Check:* Must be feasible variants.
      *   *Drafting thought:* Ensure the expected observations are distinct. If both expect the same result, it's not a good diagnostic.

  7.  **Drafting - Closing & Confidence Note:**
