  At 06:00, Admiral Vance must decide whether to deploy her fleet into defensive formation, knowing a hostile armada may strike at noon based on a decision the enemy commander will finalize at 09:00 using intelligence protocols that physically cannot detect Vance's 06:00 movements until 14:00, thereby ensuring her current deployment cannot causally influence the enemy's choice or the strike's occurrence. The evidence available to Vance regarding enemy intent is identical and incomplete regardless of her choice, presenting a classic future contingent: "The enemy will strike at noon." Because her action is causally isolated from the enemy's decision due to the intelligence lag, the rationality of deployment hinges entirely on the metaphysical status of this proposition rather than strategic deterrence or risk calculation, forcing a divergence in practical verdicts based solely on whether the future statement is currently truth-valueless, determinately true/false but unknown, or necessitating fixed outcomes.

  **Theoretical Verdicts and Rationales**
  The **Aristotelian non-bivalentist** commands Vance to **deploy**, arguing that because the proposition "The enemy will strike" currently lacks a truth-value, the future is ontologically open; her deployment is rational not as a prediction but as a constitutive act that helps determine which future becomes actual. The **Ockhamist actualist** also commands Vance to **deploy**, but on distinct grounds: she holds the proposition is already determinately true or false in the actual world, yet because Vance is epistemically isolated from this fact, she must act on standard expected-utility grounds to hedge against the possibility of a strike. The **logical fatalist** commands **inaction**, contending that the present determinacy of the proposition renders deployment either redundant (if the strike is true) or futile (if false), as the outcome is logically necessitated regardless of intervention.

  **Interaction of Isolation and Bivalence**
  The fatalist's inaction is forced by the interaction between **temporal-causal isolation** and **bivalence commitment**. Isolation ensures that Vance's deployment cannot causally alter the truth-value of the proposition (the enemy's decision is already made or fixed independently). Bivalence commitment asserts that the proposition already possesses a specific truth-value. Together, these imply that the outcome is both fixed and causally inaccessible to modification by the agent; thus, any action taken to influence that outcome is logically superfluous, as the truth of the matter cannot be changed by a causally isolated intervention.

  **Removal of Isolation**
  If the isolation is removed—for example, if enemy intelligence could detect the 06:00 deployment by 08:00 and adjust their strike decision accordingly—the fatalist's verdict collapses. In this scenario, the truth-value of "The enemy will strike" becomes counterfactually dependent on Vance's deployment. The fatalist can no longer claim the outcome is fixed *independently* of the action, as the action itself becomes a causal condition for the truth of the proposition. Consequently, all three positions would likely converge on deployment, as the action now instrumentally influences the future fact.

  **Fatalist Defense Against Collapsed Reasoning**
  Against the charge that her verdict collapses practical reasoning (the "Lazy Argument" objection), the fatalist defends inaction by distinguishing between **logical necessity** and **causal efficacy**. She argues that practical reasoning presupposes the possibility of altering outcomes; if bivalence and isolation jointly entail that the outcome is logically immutable by the agent's will, then "reasoning" toward a different outcome is a category error. She maintains that rationality requires aligning action with what is possible, and since altering a determinately true future contingent is logically impossible, inaction is the only coherent response to avoid futile exertion, preserving the integrity of logic over the illusion of agency.
