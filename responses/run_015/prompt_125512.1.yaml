      *Single Revision:* Modify (3) to claim hyperbolic discounting is the *dominant* but not *exclusive* mechanism, or specify that "flat cases" involve a different psychological mechanism (e.g., attentional salience) that mimics discounting. Actually, the cleanest fix is to soften (3)'s claim to be *the* model.

