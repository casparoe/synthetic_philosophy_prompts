      *   (2) **Synchronic Conflict:** Judgment and desire conflict *at the time of action*. Rejects Socratic intellectualism (judgment follows desire).
      *   (3) **Empirical Model:** Present-biased/hyperbolic discounting explains *why* this happens (preference reversal due to temporal proximity). Predicts clustering near reward and efficacy of commitment devices.
      *   (4) **Authority of Judgment:** The relevant judgment is the *current* self's judgment. Earlier plans aren't automatically authoritative (anti-paternalism across time).
      *   (5) **Responsibility & Commitment:** Using commitment devices is rational. Using them (or failing to) doesn't excuse akrasia. Agent remains responsible.
      *   (6) **Case Verdicts:**
          *   (6a) *Flat Cases:* Akrasia exists even without temporal delay (e.g., healthy vs. tasty meal now).
          *   (6b) *Sophisticated Undoing:* An agent who pre-commits and then pays to undo the binding is acting akratically (not just following a foreseen plan).

  3.  **Initial Scan for Tensions:**
      *   (3) vs. (6a): (3) says hyperbolic discounting (temporal proximity) explains akrasia. (6a) says akrasia happens in "flat cases" with *no* temporal gradient. If the explanation relies on time, how does it work when time isn't a factor?
      *   (3) vs. (4): (3) suggests the "earlier self" knows better (hence commitment devices work). (4) says the earlier self isn't automatically authoritative. This is a standard tension in diachronic agency, but is it a contradiction?
      *   (5) vs. (4): (5) says installing commitments is rational. (4) says don't privilege the earlier self. If the earlier self binds the later self, isn't that cross-temporal paternalism?
      *   (5) vs. (6b): (6b) says undoing a commitment is akratic. (5) says commitment is rational. This seems consistent, but (6b) implies the *plan* to undo was akratic, or the act of undoing is.
