      *   **Tension B: Diachronic Authority vs. Responsibility (4 vs. 5).**
          *   *Conflict:* (4) rejects cross-temporal paternalism (earlier self not authoritative). (5) says installing commitment devices is rational and doesn't excuse action.
          *   *Nuance:* Commitment devices *are* a form of earlier self binding later self. If (4) says earlier plans aren't authoritative, why is binding rational? Usually, binding is rational *because* the earlier self knows the later self will fail. But if the later self's judgment is authoritative (per 4), then the binding restricts the authoritative self.
