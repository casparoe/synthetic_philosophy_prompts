answer: |-
  # FORESIGHT CELL OPERATING PROCEDURE: V1.4
  **Objective:** Generate auditable, base-rate-driven probabilities for structural continuity questions.
  **Constraint:** Max 4 hours per question. No web access. No narrative justification.
  **Output:** One-page memo with probability, confidence interval, and audit trail.

  ---

  ## PART I: THE PROCEDURE

  ### Step 1: Case Definition (30 mins)
  **Action:** Convert the vague prompt into a binary settlement condition.
  1.  **Start Event ($t_0$):** Define the exact date the current regime/arrangement began. *Rule: Use the most recent structural break, not nominal inception.*
  2.  **End Event ($t_{end}$):** Define what constitutes failure. *Rule: Must be observable by a third party without interpretation (e.g., "peg deviates >5%", "ruler leaves office", "share of global reserves drops below 50%").*
  3.  **Horizon Conversion:** If the question is "Will this ever happen?", impose a standard horizon (5, 10, or 30 years) based on the asset class duration. *Rule: Match the horizon to the longest-dated liability hedging the position.*
  **Sufficient Answer:** A written sentence: "Success is defined as [Condition] holding until [Date]."
  **[JUDGMENT]:** Choosing the start date when history is ambiguous (e.g., gradual vs. sudden peg).

  ### Step 2: Reference Class Construction (60 mins)
  **Action:** Define the set of comparable cases *before* analyzing the specific case details.
  1.  **Mechanical Enumeration:** Define inclusion criteria using only observable variables available at $t_0$ (e.g., "All IMF Article IV countries with GDP > $50B", not "Stable democracies").
  2.  **Pre-Commitment:** Write the criteria down. A second analyst must sign off that the case in question fits the criteria *without* knowing the outcome.
  3.  **Famous Case Handling:** If the case is famous (e.g., USD), you cannot "unsee" it. *Rule: The case must be excluded from the base rate calculation but included in the class definition for counting purposes.*
  **Sufficient Answer:** A list of inclusion/exclusion criteria and a count of $N$ (total cases) and $n$ (completed cases).
  **[JUDGMENT]:** Deciding which observable variables are "structurally relevant" vs. noise.

  ### Step 3: Getting the Base Rate (45 mins)
  **Action:** Calculate the raw probability of failure within the horizon.
  1.  **Minimum Sample Size:** If $N < 10$, refuse or downgrade to "Coarse Estimate" (Low/Med/High).
  2.  **Summary Statistic:** Calculate $P(Failure) = \frac{\text{Cases failed within horizon}}{\text{Total cases}}$.
  3.  **Small $n$ Protocol:** If completed cases are few, report the ratio as a range (e.g., 1/5 to 2/5) rather than a point estimate.
  **Sufficient Answer:** A single percentage or range derived from a count.
  **[JUDGMENT]:** None. This is arithmetic.

  ### Step 4: Conditionalising on Duration (30 mins)
  **Action:** Adjust for the fact that the case has already survived $t_{elapsed}$ years.
  1.  **Non-Parametric Check:** Look only at class members that survived to $t_{elapsed}$. What fraction survived another $H$ years?
  2.  **Distribution Assumption:** If data is too sparse for non-parametric, you must assume a shape. *Default: Constant Hazard (Exponential).* *Alternative: Aging (Weibull).*
  3.  **The Trap:** Surviving to $t$ is not evidence of robustness if the hazard rate increases with time. *Rule: If using Constant Hazard, state explicitly: "Assuming risk does not increase with age."*
  **Sufficient Answer:** Conditional probability $P(Survival > t_{elapsed} + H | Survival > t_{elapsed})$.
  **[JUDGMENT]:** Choosing the distribution shape when data is sparse.

  ### Step 5: Recording Filter (15 mins)
  **Action:** Adjust for historical visibility bias.
  1.  **Under-Recording Check:** Are there likely failed cases that left no archive? (e.g., ancient empires, informal pegs).
  2.  **Adjustment:** If yes, inflate the failure rate by a fixed factor (e.g., +10%) or refuse.
  **Sufficient Answer:** A yes/no on bias presence and a fixed adjustment factor applied to the base rate.
  **[JUDGMENT]:** Estimating the magnitude of the hidden population.

  ### Step 6: Ex-Ante Ledger of Disanalogies (30 mins)
  **Action:** Account for unique features of the case without storytelling.
  1.  **Candidate List:** List up to 3 factors unique to the case (e.g., "Ruler age", "Oil dependence").
  2.  **Measurement:** Measure these factors across the *reference class*. Does the factor correlate with survival in the class?
  3.  **Budget Cap:** Total adjustment allowed is capped at +/- 10 percentage points from the base rate.
  4.  **Ban:** No unmeasured claims (e.g., "Political will is stronger").
  **Sufficient Answer:** A table showing Factor, Class Correlation, and Adjustment Applied. Total Adjustment $\le$ 10%.
  **[JUDGMENT]:** Selecting which factors make the "Ledger".

  ### Step 7: Stability Audit (30 mins)
  **Action:** Stress test the reference class.
  1.  **Widen/Narrow:** Add/remove borderline cases.
  2.  **Drop Extremes:** Remove the top/bottom 10% of outliers.
  3.  **Drop Recent:** Remove the most recent third of data (to check for regime change).
  4.  **Flip Rule:** If the probability moves by >15% in any test, downgrade to a RANGE or REFUSE.
  **Sufficient Answer:** A table of sensitivity results.
  **[JUDGMENT]:** Deciding if a move is "significant" (default to 15%).

  ### Step 8: Self-Membership (15 mins)
  **Action:** Check for endogeneity.
  1.  **Case Inside Class:** If the case is part of the $N$ used to calculate the base rate, recalculate excluding it.
  2.  **Systemic Recording:** If the data was recorded by the entity whose survival is being estimated (e.g., US data for USD survival), flag as "Endogenous Data".
  3.  **Penalty:** If Endogenous Data, widen confidence interval by 2x or REFUSE.
  **Sufficient Answer:** Confirmation of independence or penalty applied.
  **[JUDGMENT]:** Assessing data provenance.

  ### Step 9: Fusion with Inside View (15 mins)
  **Action:** Combine base rate with specific intelligence.
  1.  **Weighting:** Base Rate weight = 70%. Inside View weight = 30%. *Rule: Inside view cannot exceed 30%.*
  2.  **Inside View Definition:** Only proprietary data or verified intelligence. No "expert opinion".
  3.  **Confidence:** State confidence based on Stability Audit results (High = stable, Low = unstable).
  **Sufficient Answer:** Final Probability = $0.7 \times \text{Base} + 0.3 \times \text{Inside}$.
  **[JUDGMENT]:** Quantifying the "Inside View" number.

  ### Step 10: Stop Rules (15 mins)
  **Action:** Determine if a number should be issued.
  1.  **Refusal Conditions:**
      *   $N < 10$.
      *   Horizon > Max observed duration in class.
      *   Stability Audit flips the sign.
      *   Question is values-based (e.g., "Should we hold?" vs "Will it hold?").
  2.  **Handoff:** If Refused, label "Scenario Planning Required" and hand to PM.
  **Sufficient Answer:** A number OR a "REFUSE" stamp with reason code.
  **[JUDGMENT]:** None. Binary compliance check.

  ---

  ## PART II: STANDING REFERENCE CLASSES (MAINTENANCE SPEC)
  **Objective:** Prevent ad-hoc class construction during live questions.
  **Frequency:** Updated quarterly on slow days.
  **Storage:** Shared spreadsheet, version controlled.

  1.  **Class A: Sovereign Currency Pegs (EM)**
      *   **Inclusion:** IMF Article IV countries, GDP > $20B, Fixed/ Crawling Peg status.
      *   **Start:** Date peg announced/implemented.
      *   **End:** Date devaluation > 5% or float announced.
      *   **Data Source:** IMF AREAER, Central Bank archives.
      *   **Variables:** Reserves/M2, Current Account Balance, Regime Type.

  2.  **Class B: Personalist Autocracies**
      *   **Inclusion:** Polity IV score < -7, Leader remains same individual.
      *   **Start:** Date leader assumes power.
      *   **End:** Date leader leaves office (death, coup, election loss).
      *   **Data Source:** Archigos, Leader Data.
      *   **Variables:** Leader Age, Tenure, Resource Rent % GDP.

  3.  **Class C: Reserve Currency Dominance**
      *   **Inclusion:** Currency > 40% of global allocated reserves.
      *   **Start:** Date share crosses 40%.
      *   **End:** Date share drops below 40% or systemic collapse.
      *   **Data Source:** League of Nations/IMF COFER data.
      *   **Variables:** Share of Global Trade, Debt-to-GDP, War involvement.

  ---

  ## PART III: LIVE APPLICATIONS

  ### Case 1: The Nine-Year Peg
  **Question:** A fixed exchange-rate peg has held for nine years. Will it hold another five?
  **Procedure Run:**

  1.  **Define:** Start = 9 years ago. End = Deviation > 5%. Horizon = 5 years.
  2.  **Class:** Standing Class A (EM Pegs). $N=45$ since 1970.
  3.  **Base Rate:** 45 pegs. 20 broke within first 5 years. 15 broke between year 5-10. 10 survived >10 years.
      *   Raw 5-year failure rate: 20/45 = 44%.
  4.  **Duration:** Case has survived 9 years. Look at subset surviving >9 years ($n=25$).
      *   Of those 25, how many broke in next 5 years (year 9-14)? 10 broke.
      *   Conditional Failure Rate = 10/25 = 40%. Survival = 60%.
      *   *Assumption:* Non-parametric (empirical survival).
  5.  **Filter:** Modern data (post-1970) is well-recorded. No adjustment.
  6.  **Disanalogies:**
      *   Factor: Reserves/M2 is low (20th percentile).
      *   Class Correlation: Low reserves correlate with +15% failure risk.
      *   Adjustment: +10% (Capped).
      *   New Failure Rate: 50%. Survival: 50%.
  7.  **Stability:** Drop recent third. Survival rate moves to 55%. Drop extremes. Moves to 48%. Stable.
  8.  **Self-Member:** Case is not in calculation set (excluded). Data independent.
  9.  **Fusion:** Inside view (proprietary flow data) suggests pressure is high. Adjust -5% survival.
      *   Base (50%) * 0.7 + Inside (45%) * 0.3 = 48.5%.
  10. **Stop:** Passes all checks.
  **Output:** Probability of Holding: 45% - 55% (Range due to Inside View uncertainty).

  ### Case 2: The Aging Autocrat
  **Question:** A resource-funded autocracy in place for about thirty years, ruler aged seventy-eight, no announced succession. Will it survive another ten?
  **Procedure Run:**

  1.  **Define:** Start = 30 years ago. End = Regime change (leader exit). Horizon = 10 years.
  2.  **Class:** Standing Class B (Personalist Autocracies). $N=60$ since 1950.
  3.  **Base Rate:** 60 regimes. 40 ended within 10 years. Raw 10-year survival = 33%.
  4.  **Duration:** Case survived 30 years. Subset surviving >30 years ($n=12$).
      *   Of those 12, how many survived another 10? 4.
      *   Conditional Survival = 4/12 = 33%.
  5.  **Filter:** Recent coups well recorded. Older data may miss soft transitions. Adjust survival -5%.
      *   Adjusted Survival = 28%.
  6.  **Disanalogies:**
      *   Factor: Leader Age (78).
      *   Class Correlation: Mortality risk spikes >75. 80% of leaders >75 exit within 5 years.
      *   Factor: No Succession.
      *   Class Correlation: No heir = +40% coup risk within 2 years of death.
      *   Adjustment: Cap reached (-10%).
      *   New Survival: 18%.
  7.  **Stability:** Drop recent third. Survival moves to 25%. Narrow class to "Resource Funded". Survival moves to 15%. **Instability Flag.**
  8.  **Self-Member:** Data sourced from open records (independent).
  9.  **Fusion:** Inside view confirms health issues. No change to number.
  10. **Stop:** Stability audit suggests range is wide.
  **Output:** Probability of Survival: 15% - 25%. (Low confidence due to Stability Audit).

  ### Case 3: The Reserve Currency
  **Question:** The role of the US dollar as the dominant reserve and invoicing currency, over a thirty-year horizon.
  **Procedure Run:**

  1.  **Define:** Start = 1944 (Bretton Woods) or 1973 (Float). End = Share < 40%. Horizon = 30 years.
  2.  **Class:** Standing Class C (Reserve Currency).
      *   Candidates: GBP (1850-1914), USD (1944-Present), FRF (briefly), DEM (never dominant), JPY (never dominant).
      *   Valid Hegemons: GBP, USD.
      *   $N = 2$.
  3.  **Base Rate:** $N=2$. GBP lasted ~60 years as dominant. USD has lasted ~80 years so far.
      *   Sample size violation ($N < 10$).
  4.  **Duration:** USD is 80 years old. GBP broke at 60.
      *   Conditional survival beyond 80 years? Data = 0 cases.
  5.  **Filter:** Historical data on GBP is reconstructed, potential bias.
  6.  **Disanalogies:** Nuclear weapons, global trade volume, digital finance. None measurable across class ($N=2$).
  7.  **Stability:** Change start date to 1973. Duration = 50 years. GBP comparison breaks. Output flips from "Safe" to "Unknown".
  8.  **Self-Member:** Data recorded by US/IMF. Endogenous bias high.
  9.  **Fusion:** N/A.
  10. **Stop:** **REFUSE.**
      *   Reason Code: INSUFFICIENT_N (N=2), HORIZON_EXCEEDS_DATA (No case survived 100 years to validate 30-year extension from current age), INSTABILITY (Definition of "Dominant" shifts).
      *   Value of Refusal: Prevents false precision on a binary bet where the loss function is asymmetric. Forces PM to use scenario weights (e.g., 30% USD loss, 70% USD hold) rather than a single expected value.

  ---

  ## PART IV: LIMITATIONS & FAILURE MODES

  **What This Procedure Cannot Do:**
  1.  **Unprecedented Entities:** If no historical analog exists (e.g., "Will a crypto-state survive?"), $N=0$. Procedure mandates REFUSE.
