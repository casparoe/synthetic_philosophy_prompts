  3.  **Analyze Element 1: Money as Instrument & Price-Specie Flow:**
      *   *Hume's Text:* "Money is nothing but the representation of labour and commodities..." ("Of Money"). Price-Specie Flow Mechanism (PSFM) in "Of the Balance of Trade."
