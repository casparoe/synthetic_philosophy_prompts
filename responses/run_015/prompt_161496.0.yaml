      *   *The Tension:* States *must* borrow in this hard unit. They cannot inflate.
      *   *Scholarly Dispute:* Was he a catastrophic doom-monger or a warning voice? Did he think debt *always* destroys or just *excessive* debt?
      *   *Extrapolation:* Hume feared the *ability* to borrow too easily (paper credit). A hard cap restricts borrowing capacity (deflationary pressure makes real debt burden heavier). This accelerates the crisis he predicted. He warned against "mortal" debt; this system makes debt mortal immediately.

