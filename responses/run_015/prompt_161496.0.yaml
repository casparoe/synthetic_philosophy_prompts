      *   *Hypothetical Application:* If repricing is instantaneous, the PSFM happens in real-time. There is no lag for trade imbalances to persist via price competitiveness.
      *   *Scholarly Dispute:* Was PSFM descriptive or normative? Did he think it happened quickly or slowly? (Rotwein vs. Viner vs. modern interpreters).
