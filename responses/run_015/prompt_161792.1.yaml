prompt: |-
  So I'm running the Hart–Devlin session in my second-year jurisprudence seminar next week and I want to do something other than re-run the Wolfenden material, which they've all read and which they can all parrot back at me. Here's the case I want analysed instead.

  The episode: on 22 May 2015 Ireland amended its constitution by referendum so that marriage may be contracted by two persons without distinction as to their sex — 62% yes on a turnout of about 61%, and the first time any state did that by popular vote rather than by legislation or court order. Background you'll need, all of it uncontested: male homosexual acts were criminal offences in Ireland until 1993, under nineteenth-century statutes inherited from Westminster; when the Irish Supreme Court upheld those laws in the early 1980s it reasoned partly from the Christian character of the state and from the protection of marriage and public health; decriminalisation came only after the European Court of Human Rights held that the ban breached the privacy guarantee in the Convention. So within one generation you have a society enforcing a moral code through the criminal law, then solemnly voting to entrench the opposite in its constitution.

  What I want is Devlin's own machinery run on this, not Hart's caricature of it: the claim that a shared morality is among the things that hold a society together, that a society may defend it the way it defends its government, that no limit is fixed in advance, and that the test is supposed to be an empirical one about what ordinary people actually feel — intolerance, indignation, disgust — measured, in his hands, by something like a jury. So: what does that theory say the 1983 court was doing, and what does it say the 2015 electorate was doing? If the morality of a society is whatever the measurement device happens to record, Devlin's view seems to track opinion and hand you opposite verdicts forty years apart on the same conduct. Is that a reductio, or is it a sign I've misdescribed him? Can he separate "the morality of the society" from "whatever a majority will vote for this decade" without smuggling in critical morality — and if he can, has he quietly become Hart?

  Here's a distinction of my own that I want tested, and I'll flag it to the students as mine: call it enforcement-elasticity. Some moralised norms are elastic — enforcement is part of what sustains the practice, so the amount of the conduct really does respond to whether it's criminal, and the ban helps constitute what the institution is. Others are inelastic: decriminalising can't change how much of the conduct there is, only how visible it is. If the disintegration worry needs some contagion or imitation mechanism to get going, then for the inelastic norms there's nothing for that mechanism to bite on, and the state has no disintegration-based reason to enforce. Does that yield a defensible restricted legal moralism — enforce the elastic ones, hands off the inelastic ones — or does it gut Devlin, given that the examples he's associated with are the inelastic ones? Then put the obvious Devlin reply in a student's mouth and answer it honestly: that the moral environment shapes desire and self-identification across a generation, so incidence isn't independent of law after all, and that visibility is itself what unravels a shared code. Is that reply empirical, and what would settle it?

  Then run it the other way. What does the episode do to Hart? His positive-versus-critical morality distinction looks comfortable here and the harm principle looks like it's doing the work — but notice that Ireland 2015 is the cleanest measurement Devlin could ever have hoped for: a national vote on exactly the question, no judicial imposition, no elite capture. If his theory can't survive its own best-case data, that's worth saying. Is the view unfalsifiable: whatever the society's morality turns out to be, he says law should follow it, so he can only ever be wrong about the mechanism and never about the content?

  Last thing: institutions, and silence. Devlin wanted this settled by something like a jury or a legislature, not by philosophers, and in the same year the US Supreme Court imposed the same result against majority opinion in many states. Which route does his theory prefer, and does it have any resources for criticising the court route? And where is the framework silent — about rights, about what counts as the society whose morality is authoritative (Ireland 1983 or Ireland 2015?), about minorities inside the polity, about whether "disintegration" is a claim anyone could check afterwards?

  Be disciplined about the mapping: say who the relevant "we" is, what counts as evidence of a society's morality, what the theory predicts and what it misdescribes, and tell me where it's simply silent rather than forcing it to speak. Finish with a short verdict on whether this case helps Devlin, hurts him, or shows that the debate was never really about cases like this one. (Readings are Devlin's Enforcement of Morals and Hart's Law, Liberty and Morality, but I don't need citations — I know that literature, I want the argument.)
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Second-year jurisprudence seminar on the Hart-Devlin debate.
      *   **Goal:** Move beyond the standard Wolfenden recap. Use the Irish Same-Sex Marriage referendum (2015) vs. earlier criminalization/court rulings (1980s) as the case study.
      *   **Key Tasks:**
          1.  Apply Devlin's *actual* machinery (shared morality, disintegration, empirical test of intolerance/indignation/disgust, jury standard) to both the 1983 court ruling and the 2015 referendum.
          2.  Address the "shifting morality" problem (is Devlin's view just majoritarian opinion? Is it a *reductio*? Does it collapse into Hart?).
          3.  Test the user's proposed distinction: "Enforcement-Elasticity" (elastic norms need law to sustain them; inelastic ones don't). Does this save Devlin or gut him? Include the Devlin reply (moral environment shapes desire/visibility).
          4.  Apply the case to Hart (Harm Principle, Positive vs. Critical Morality). Does the 2015 vote validate Devlin's method even if Hart likes the result? Is Devlin unfalsifiable?
          5.  Institutional analysis: Jury/Legislature (Devlin) vs. Court (US style). Where is the framework silent (rights, boundaries of society, minorities, verifying disintegration)?
          6.  **Constraint:** Be disciplined about mapping (Who is "we"? Evidence? Predictions? Silence?).
          7.  **Output:** A short verdict on whether this helps, hurts, or bypasses Devlin. No citations needed, just argument.

  2.  **Deconstruct Devlin's Position (The "Real" Devlin):**
      *   Society = community of ideas (shared morality).
      *   No shared morality = disintegration (treason analogy).
      *   Law's role: Protect society's existence.
      *   Test: The "Man on the Clapham Omnibus" / Jury standard. Feelings of intolerance, indignation, disgust.
      *   No *a priori* limits on state interference (private vs. public is not a hard limit).
      *   Morality is not static, but change should be slow/organic, not imposed.

  3.  **Analyze the Irish Case through Devlin's Lens:**
      *   **1983 (Criminalization):** The "Man on the Omnibus" (in the 80s) felt disgust/indignation. The Supreme Court cited Christian character. Devlin would say: Law was legitimately enforcing the *then-current* shared morality to prevent disintegration.
      *   **2015 (Referendum):** The "Man on the Omnibus" (in 2015) voted 62% Yes. Disgust has faded. Shared morality has shifted. Devlin would say: Law *must* change to reflect the *new* shared morality. To keep the ban now would be tyranny, not moral enforcement, because the "bond" has changed.
      *   **The Problem:** If morality = whatever the jury says *now*, Devlin is just a sophisticated majoritarian. He loses the critical bite. If he says "Wait, the 2015 vote is a panic/fad, the *real* morality is deeper," he is smuggling in Critical Morality (Hart's territory).
      *   **Verdict on Shift:** It's not necessarily a *reductio* for Devlin, *provided* he accepts moral evolution. But it highlights the instability of his foundation. If the "bond" changes that fast, was it ever a constitutive morality, or just prejudice?

  4.  **Analyze "Enforcement-Elasticity" (The User's Distinction):**
      *   *Concept:* Elastic = law sustains practice (e.g., driving on the left). Inelastic = law doesn't change incidence, only visibility (e.g., homosexuality).
      *   *Devlin's Disintegration Worry:* Needs contagion/imitation. If conduct is inelastic, decriminalization doesn't increase incidence, just visibility. So, no contagion -> no disintegration -> no justification for ban.
      *   *Does this save Devlin?* It restricts legal moralism significantly. It moves towards a harm-like principle (harm to the fabric).
      *   *Does it gut Devlin?* Yes, because Devlin's classic examples (homosexuality, prostitution) are arguably inelastic regarding *incidence* but elastic regarding *visibility*. Devlin cares about visibility because it undermines the *example* set to others.
      *   *The Devlin Reply:* Law shapes the moral environment which shapes desire/identity over a generation. Visibility *is* the contagion. It normalizes.
      *   *Empirical Question:* Does visibility lead to imitation/identity shift? (Evidence suggests yes, regarding identity formation, but maybe not "conversion"). This is the battleground.

  5.  **Analyze Hart's Position:**
      *   Positive Morality (what people believe) vs. Critical Morality (what they *ought* to believe based on reason/harm).
      *   Harm Principle: State only interferes to prevent harm to others.
      *   *The Twist:* Ireland 2015 is a perfect Devlinian measurement (popular vote). Hart likes the *result* (liberty), but the *process* validates Devlin's metric (societal consensus).
      *   *Unfalsifiability:* Devlin says "Law should follow shared morality." If shared morality changes, law changes. He is never wrong about the *content*, only potentially about the *fact* of the morality. This makes him a sociologist of law, not a critic. Hart provides the critical lever.

  6.  **Institutions and Silence:**
      *   **Devlin's Preference:** Legislature or Jury (representative of public feeling). Not Courts (elite).
      *   **Ireland 2015:** Fits Devlin perfectly (Referendum).
      *   **US 2015 (Obergefell):** Fits Hart better (Court protecting minority rights against majority).
      *   **Silence:**
          *   *Minorities:* Devlin has no account of rights against the "shared morality." If the "we" decides to crush the "them," Devlin calls it self-defense of society.
          *   *Boundaries:* When does Ireland 1983 become Ireland 2015? Is it a new society?
          *   *Verification:* "Disintegration" is a prophecy. You can't check it afterwards easily.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, rigorous, seminar-leader to seminar-leader.
      *   *Structure:* Follow the prompt's sequence (Devlin on 1983/2015 -> Elasticity -> Hart -> Institutions/Silence -> Verdict).
      *   *Key Insight:* The Ireland case exposes that Devlin is a theory of *legitimacy via consensus*, not a theory of *justice*. Hart is the reverse.

      *(Self-Correction during drafting)*: Make sure I don't just say "Devlin is majoritarian." I need to explain *why* the jury test matters. It's about *feeling*, not just counting votes. But the referendum is the ultimate proxy for that feeling.
      *(Refining Elasticity)*: Ensure I distinguish between "incidence of acts" and "incidence of identity." Devlin cares about the latter as much as the former.
      *(Refining Hart)*: Hart would argue the 2015 vote shows Positive Morality changed, but Critical Morality (Harm Principle) demanded the change *earlier* (in 1993).

  8.  **Final Polish:** Check against the "disciplined mapping" requirement. Ensure I explicitly state who the "we" is and where the theory is silent.

      *   *Who is "we"?* The Irish electorate/jury.
      *   *Evidence?* The referendum result vs. the 1980s court reasoning.
      *   *Prediction?* Law tracks morality.
      *   *Misdescription?* It misses the rights of the minority *during* the transition.
      *   *Silence?* On how to measure disintegration ex-post.

  9.  **Final Verdict:** The case hurts Devlin as a *normative* guide (because it shows he protects oppression until the mood shifts) but helps him as a *descriptive* account of legitimacy. It shows the debate isn't about *this* kind of case (consensual private conduct) but about *who decides*.

      *(Wait, one nuance)*: The prompt asks if the debate was never really about cases like this. Actually, Wolfenden *was* about this. But the Ireland case adds the *democratic* element Wolfenden lacked (it was a committee/court/parliament mix). Ireland makes it a pure "People vs. Principles" test.

      *Okay, ready to write.*
answer: |-
  Here is a mapping of the Hart–Devlin debate onto the Irish marriage episode, structured for your seminar.

  ### 1. Devlin's Machinery: 1983 vs. 2015

  **The 1983 Court (Criminalisation)**
  On Devlin's terms, the 1983 Supreme Court was acting legitimately. The "relevant we" is the Irish society of the early 1980s. The evidence of its morality is the inherited statute, the lack of successful repeal, and the Court's own reasoning citing the "Christian character of the state." If you impanelled a jury of 1983, they would likely return feelings of intolerance, indignation, and disgust regarding homosexual acts.
  *   **Devlin's Verdict:** The state is entitled to enforce this morality. Not because the acts are inherently sinful in a theological sense, but because the *shared morality* constitutes the invisible bonds of society. To allow the breach is akin to allowing treason; it risks disintegration. The law is defending the society that exists *then*.

  **The 2015 Electorate (Constitutionalisation)**
  The 2015 referendum is the perfect Devlinian measurement device. It is not a legislature (which might be elite-captured) nor a court (which might be rights-obsessed); it is the "jury" on a national scale. The 62% vote indicates that the feelings of intolerance and disgust have evaporated. The "shared morality" has shifted.
  *   **Devlin's Verdict:** The state is now *required* to change the law. If the law remains static while the morality shifts, the law ceases to reflect the bonds of society and becomes mere coercion. To enforce the old ban now would not prevent disintegration; it would *cause* it by alienating a majority from the legal order.

  **The "Shifting Morality" Problem**
  You asked if this is a *reductio*. If Devlin says morality is whatever the measurement device records, he is a sophisticated majoritarian. He offers no critical leverage to say the 1983 majority was *wrong*, only that they are no longer *us*.
  *   **Is it a reductio?** No, provided Devlin accepts that societies evolve. He argues change should be slow to avoid shock, but a 30-year gap (1983–2015) is likely slow enough.
  *   **Does he become Hart?** He risks it. If Devlin tries to argue that the 2015 vote is a "panic" and the *true* morality is still traditional, he must appeal to a standard outside popular feeling (e.g., natural law or reason). That is "Critical Morality," which is Hart's territory. If he sticks to his guns, he must admit the 1983 enforcement was right *then* and wrong *now*. This makes his theory historically relative, not morally critical.

  ### 2. Testing "Enforcement-Elasticity"

  **Your Distinction**
  *   **Elastic Norms:** Law sustains the practice (e.g., tax compliance, driving sides). Without law, the practice collapses.
  *   **Inelastic Norms:** Law affects visibility, not incidence (e.g., private sexual conduct).
  *   **The Argument:** If disintegration requires a contagion mechanism (imitation), the state has no reason to enforce inelastic norms. Decriminalisation changes the *public landscape*, not the *private frequency*.

  **Does this save Devlin?**
  It restricts Legal Moralism significantly. It concedes that private conduct which does not recruit others cannot threaten the social fabric. This moves Devlin toward a "public order" version of the Harm Principle.
  *   **Does it gut him?** Yes. Devlin's core worry about homosexuality was precisely that *visibility* undermines the moral example set to the young. He believes the "moral environment" is elastic even if the "biological urge" is not.

  **The Devlin Reply (Student Voice)**
  *"You're assuming desire is fixed. It isn't. Law shapes the moral environment, which shapes self-identification. If you remove the stigma, you remove the barrier to people identifying as gay. That increases the incidence over a generation. Visibility is the contagion. The 'shared code' unravels not because people copy acts, but because they stop sharing the inhibition."*

  **Empirical Settlement**
  This is an empirical claim: Does legal stigma suppress identity formation?
  *   **Evidence:** Post-1993 Ireland saw a rise in people living openly as gay, but it is unclear if the *underlying orientation* changed or just the *disclosure*.
  *   **The Trap:** If Devlin relies on this, he admits his theory stands or falls on sociological data about imitation, not philosophical claims about the sanctity of morality. It makes his "disintegration" thesis falsifiable (and potentially false).

  ### 3. Running it against Hart

  **Hart's Position**
  Hart distinguishes Positive Morality (what is believed) from Critical Morality (what is rational/just). He argues the Harm Principle is part of Critical Morality.
  *   **1993 Decriminalisation:** Hart would argue this was *overdue*. The ECHR ruling aligned Positive Morality with Critical Morality (privacy/harm). The 1983 Court was enforcing Positive Morality without Critical justification.
  *   **2015 Referendum:** Hart welcomes the result. But notice the irony: The mechanism (a majoritarian vote) is pure Devlin. Hart usually prefers courts to protect minorities from majorities. Here, the majority liberated the minority.

  **Is Devlin Unfalsifiable?**
  You asked if Devlin can only be wrong about the mechanism, never the content.
  *   **Yes.** Devlin's theory is: "Law ought to enforce the shared morality."
  *   If the law enforces it, he is happy.
  *   If the law doesn't, he says the morality isn't shared enough.
  *   If the morality changes, he says the law must change.
  *   **The Ireland Case:** This shows Devlin is a theory of *sociological legitimacy*, not *justice*. He describes when law will be accepted, not when it is right. Hart provides the critical tool to say the 1983 law was unjust *even if* it was socially supported then.

  ### 4. Institutions and Silence

  **Institutional Preference**
  *   **Devlin:** Prefers the Legislature or Jury. He distrusts judges defining morality. The Irish Referendum is the ultimate Devlinian institution. It bypasses the elite.
  *   **Hart:** Prefers the Harm Principle applied by rational legislators or Courts. He would be wary of the Referendum if it had gone the other way (tyranny of the majority).
  *   **Comparison:** The US Supreme Court (*Obergefell*, 2015) imposed the result against many state majorities. Devlin would condemn this as elite imposition fracturing the shared morality of the dissenting states. Hart would endorse it as protecting liberty against local prejudice. Ireland did it the Devlin way; the US did it the Hart way (rights-based adjudication).

  **Where the Framework is Silent**
  1.  **Rights:** Devlin has no vocabulary for minority rights against the "shared morality." If the "we" votes to crush the "them," Devlin calls it self-defence. He is silent on the individual against the collective.
  2.  **Boundaries of Society:** When does Ireland 1983 become Ireland 2015? Is it the same society? If morality defines society, a shift in morality implies a shift in the society itself. Devlin cannot explain continuity across moral revolutions.
  3.  **Verification:** "Disintegration" is a prophecy. We cannot check afterwards. Ireland didn't disintegrate in 1993 or 2015. Devlin would say "the law kept pace," but he has no counterfactual.
  4.  **The "We":** Who is excluded? In 1983, gay men were part of the society but their morality was excluded from the "shared" count. Devlin is silent on how to count the moral feelings of those the morality condemns.

  ### 5. Final Verdict

  **Does this case help or hurt Devlin?**
  It **hurts** him as a normative guide, but **helps** him as a descriptive account of legitimacy.

  *   **Normatively:** It exposes that Devlin offers no protection to minorities during the "lag time" between moral shift and legal change. He validates the 1983 oppression as "societal self-defence." That is a hard pill for modern students to swallow. It shows his theory lacks a concept of *injustice*, only *instability*.
  *   **Descriptively:** It shows he was right about the source of legal authority. The 2015 settlement is stable *because* it was a popular vote. The law now matches the feeling.

  **Was the debate about cases like this?**
  No. The Hart–Devlin debate was framed around *private* vice (Wolfenden). The Irish case turns it into a *public* constitutional question.
  *   **The Shift:** Wolfenden was about whether the state should police the bedroom. Ireland 2015 was about whether the people define the institution of marriage.
  *   **Conclusion:** Use this to show students that Devlin is not a "conservative" in the partisan sense; he is a "communitarian." He would support gay marriage in 2015 just as fiercely as he supported the ban in 1983. That consistency is his strength (honesty about the source of law) and his fatal weakness (indifference to the moral cost of the transition). Hart wins on the rights of the individual; Devlin wins on the stability of the order. The Ireland case proves you can have Devlin's stability *with* Hart's liberty, but only if the "jury" happens to be liberal. If they aren't, Devlin gives you no way out.
