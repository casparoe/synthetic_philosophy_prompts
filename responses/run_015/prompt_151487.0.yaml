      *   **Positions:**
          *   **A (Representationalist):** Voss lacks full moral worth. Her reason (dread) doesn't represent the harm. It's moral luck.
          *   **B (Alignment/Tracking Theorist):** Voss has full moral worth. Her psychology tracks the fact. Representation is too intellectualist.
      *   **Requirements:**
          *   Genuine back-and-forth.
          *   B must answer the "causal luck" charge.
          *   A must answer the "impossible transparency" charge.
