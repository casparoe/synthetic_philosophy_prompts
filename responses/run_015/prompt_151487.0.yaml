      *   **Conclusion:** Formal statement of refined positions.

  3.  **Developing the Arguments (Mental Sandbox):**

      *   *A's Challenge:* If Voss stops because of a gut feeling that happens to match the risk, isn't that like a broken clock being right twice? If the risk were different, would she still feel dread? If the dread is just an evolutionary glitch, it's not *her* moral agency at work.
      *   *B's Defense:* But moral worth shouldn't depend on being a moral philosopher. A mother saving a child from a burning building out of instinct has worth. If we demand she represents "the principle of preserving life," we lose the phenomenon. The tracking *is* the agency.
      *   *A's Concession:* Okay, maybe she doesn't need to articulate the principle. But the mental state must *contentfully* point to the badness, not just be a blind urge. Dread is vague.
