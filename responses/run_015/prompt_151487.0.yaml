answer: |-
  **A:** Let's return to Dr. Voss. She halts the trial. The action is objectively right; the protocol *was* dangerous. But you claim she deserves full moral worth for this? Her motivating reason was a somatic marker—dread. She explicitly believed the risk was negligible. The dread did not represent the harm to her consciousness. It was a blind impulse that happened to correlate with the danger.

  **B:** I do claim she deserves worth. You are conflating the *articulation* of a reason with the *existence* of a reason. Voss's psychology was sensitive to the right-making feature: the elevated risk. The dread was the medium through which that risk registered in her decision-making architecture. To deny her worth because she couldn't write a prospectus on *why* she felt the dread is to demand that moral agents be moral theorists.

  **A:** It isn't about theorizing. It's about what moves the agent. For an action to have moral worth, the agent must be moved by the right-making feature *as such*. If I push you out of the way of a falling brick because a sudden spasm jerks my arm, I save you. But I get no moral credit. My spasm tracked the danger—my nervous system reacted to the visual cue—but *I* didn't act on the danger. Voss is in the same boat. Her dread is a spasm of the emotional system. It tracks the risk, yes, but it doesn't *represent* the risk to her agency. She is morally lucky that her glitch aligns with the good.

  **B:** The spasm analogy fails because a spasm bypasses agency, whereas Voss's dread was integrated into her deliberation. She weighed the feeling against the data and let the feeling veto the data. That is an exercise of agency. Your "representation" requirement sets an implausibly high bar for transparency. Consider a parent who dives into a river to save a drowning child. They don't represent "the intrinsic value of human life" or even "the probability of survival." They act on a surge of protective urgency. If you deny them moral worth because that urgency wasn't a conceptual representation of the right-making feature, you've made moral worth an intellectual achievement rather than a practical one.

  **A:** I grant you that conceptual articulation isn't necessary. The parent need not think in propositions. But the parent's urgency must still have *content*. They must see the child *as in danger*. In Voss's case, she explicitly saw the participants *as safe*. Her evidence told her safety. Her dread contradicted her own assessment of the situation. So, what moved her wasn't an apprehension of harm, but an anxiety that *happened* to be about harm. The etiology of her motive is external to her moral understanding. If the risk hadn't existed, but she still felt dread due to a hormone imbalance, she would have halted a permissible trial. Her mechanism isn't sensitive to the *rightness*, only to the *feeling*. That is causal luck.

  **B:** You're pressing the luck objection. But let's distinguish between *antecedent* luck and *constitutive* sensitivity. Yes, it is lucky that Voss has this specific evolutionary calibration. But once she has it, her action manifests a reliable sensitivity to moral facts. You worry that if the risk weren't there, she'd still stop. But that's a counterfactual claim we can't assume. If we stipulate that her dread is calibrated to the risk profile, then in the nearest possible world where the risk disappears, the dread disappears. If her psychology reliably tracks the right-making feature across relevant counterfactuals, why does it matter that the tracking is sub-personal? You seem to think moral worth requires the agent to "own" the reason consciously. I think moral worth requires the agent's psychology to be *aligned* with the reason, regardless of the depth of conscious access.

  **A:** I see the force of that. If we demand full conscious ownership, we exclude children, animals, or adults in high-stress situations who act rightly on trained intuition. So, I will concede this: The representation need not be propositional or fully conscious. A non-conceptual, perceptual-like awareness of the harm could suffice. However, Voss still fails this refined test. She didn't just lack a proposition; she lacked the perceptual content. She looked at the data and saw safety. The dread was an intruder, not a perception. For moral worth, the motivating reason must be an *apprehension* of the value, not merely a causal effect of it. If the value causes the action without the agent apprehending the value, the agent is merely a conduit, not a source.

  **B:** And I will concede a point to you in return. Mere causal alignment is too weak. If Voss's dread were caused by a barometric pressure change that merely correlated with the risk by cosmic coincidence, she would have no worth. So, I refine my view: The alignment must be *explanatorily robust*. The right-making feature must explain the motive *through the agent's psychological nature*, not just through external coincidence. The dread must be a manifestation of her care or competence, even if unconscious. However, I maintain that this "care" does not need to involve apprehension. One can care about patients without representing their risk profile. One can care via a disposition to feel distress when they are threatened.

  **A:** So our divergence is narrowing to the nature of the psychological link. You allow a disposition to feel distress as sufficient for the moral motive. I require that the distress be experienced *as a response to the threat*, rather than as a brute sensation. In Voss's case, she experienced it as a brute sensation—"unexplained dread." She did not experience it as "fear *of* the harm."

  **B:** Precisely. And I argue that distinction is phenomenological, not moral. Whether she labels the feeling "fear of harm" or "unexplained dread" doesn't change the fact that her moral concern is doing the work. To require the label is to privilege the narrative self over the acting self.

  **A:** But the narrative self is where responsibility lives. If she cannot cite the harm even in retrospect as what moved her, she cannot learn from the action morally. She can't reinforce the virtue. She just knows she had a feeling. Moral worth is tied to moral growth.

  **B:** Then we have reached the crux. You tie worth to the capacity for moral learning and self-interpretation. I tie worth to the quality of the current motivational structure.

  **A:** Very well. Let us state our refined positions clearly.

  **B:** Agreed.

  **A:** My position is this: An agent has moral worth for a right action if and only if her motivating reason non-conceptually represents the right-making feature of that action. The feature must figure in the content of her mental state, even if she cannot articulate it. In Voss's case, because her conscious assessment denied the risk, and her dread lacked content linking it to that risk, she acted from instinct, not moral apprehension. She did the right thing, but lacks full moral worth.

  **B:** And my position is this: An agent has moral worth for a right action if and only if her motivating reason is robustly sensitive to the right-making feature via a stable psychological disposition that reflects her moral character. Explicit or implicit representation of the feature is not required; what matters is that the feature explains the motive through her own caring nature, not through external accident. In Voss's case, her dread was an expression of her subconscious care for the participants, calibrated to their safety. Therefore, she possesses full moral worth.

  **A:** We agree that luck in the etiology matters—neither of us accepts cosmic coincidence.

  **B:** And we agree that explicit philosophical reasoning is not required.

  **A:** But we disagree on whether the agent's mind must *contain* the value as content, or merely *track* the value as a cause.

  **B:** Exactly. You require the mind to mirror the good. I require the mind to move with the good.

  **A:** Then we remain divided on whether Voss is a moral agent or a moral instrument.

  **B:** And whether moral worth is a matter of insight or alignment.
