      *   **Opening Salvo:**
          *   A argues Voss acted rightly but lacks moral worth because her motive wasn't *about* the harm.
          *   B argues Voss has worth because her motive was sensitive to the harm, even if unconsciously.
      *   **Round 1: The Intellectualism Objection vs. The Luck Objection.**
          *   B attacks A for demanding too much cognitive access (transparency).
