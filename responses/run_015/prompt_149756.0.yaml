answer: |-
  Here is the practical verdict, the math, and the philosophy, in that order.

  ### The Verdict
  **Take the bet.** But you must use **Option 2 (The Coin Flip).**

  Do not use your gut (Option 1). Do not agonise (Option 3). Do not shoot down the middle (Option 5). And while letting Dave take them (Option 4) is mathematically sound, it's socially weak—it's your bet, you take the shots.

  If you flip a coin in your pocket that Mick cannot see, you will make an average profit of **£50** over the ten penalties. It is not a cheat; it is the only rational way to win.

  ### The Math (Why the Coin Works)
  Your housemate with the philosophy minor is half-right, but he's overcomplicating the solution. Here is the cold arithmetic:

  1.  **The Constraint:** Mick must write **L** or **R** on the card *before* you kick. He cannot write "It depends." He cannot write "50/50." He must commit to a specific side.
  2.  **The Gut Problem:** When you use your gut, your decision is deterministic based on your psychology. Mick has a model of your psychology. His accuracy is 90%.
      *   *Expected Value (EV):* (10% win × £30) − (90% lose × £20) = £3 − £18 = **−£15 per kick.** You will lose £150.
  3.  **The Coin Solution:** When you flip a hidden coin, your decision is no longer based on your psychology. It is based on entropy. Mick cannot predict a coin flip. He has no data on the coin.
      *   Mick still has to write L or R. Let's say he writes **L**.
      *   Your coin has a 50% chance of saying **L** and a 50% chance of saying **R**.
      *   Therefore, Mick is right 50% of the time and wrong 50% of the time, regardless of how good his "read" on you is.
      *   *Expected Value (EV):* (50% win × £30) − (50% lose × £20) = £15 − £10 = **+£5 per kick.**
      *   **Total Profit:** **+£50.**

  ### The Philosophy (Is it a Cheat?)
  You feel like the coin is a "trick that shouldn't be allowed to work." That feeling comes from confusing **skill** with **predictability**.

  In game theory, this is called a **Mixed Strategy Nash Equilibrium**. In any competitive situation where your opponent benefits from predicting your move (rock-paper-scissors, penalty shootouts, poker), the optimal strategy is often to introduce true randomness. If you are predictable, you are exploitable. By flipping the coin, you aren't "cheating" the bet; you are removing the very advantage Mick was counting on (his knowledge of your habits).

  **Regarding your housemate's point:**
  He is describing the tension between *Causal Decision Theory* (my kick can't change the sealed card) and *Evidential Decision Theory* (my kick is evidence of what's on the card).
  *   **The Loop:** The reason you feel stuck in the "If I go Left, he wrote Left" loop is that you are treating your decision as *evidence* of Mick's prediction.
  *   **The Break:** The coin severs the evidential link. The coin landing on Heads is not evidence that Mick wrote Left, because the coin doesn't care what Mick wrote. It forces the situation back into a simple causal framework: The card is fixed, the coin is random, therefore the correlation is broken.

  **"Predicts Me" vs. "Models Past Behavior":**
  You asked if there is a difference. **Yes.** Mick is not an oracle; he is a statistician. He has a dataset of 300 penalties. That dataset contains *your psychology*. It does not contain *quantum randomness from a coin in your pocket*.
  *   If you shoot based on "feel," you are drawing from the dataset.
  *   If you shoot based on a coin, you are drawing from outside the dataset.
  *   Option 5 (Middle) fails here because while it's outside the dataset, it likely violates the rules ("writes L or R"). If you shoot middle and he wrote Left, he will argue you didn't shoot a side, and the bet becomes void. Don't give him an out.

  ### Why The Other Options Fail
  *   **Option 1 (Gut):** You are donating £150 to a plumber. Don't do it.
  *   **Option 3 (Agonise):** You estimate his accuracy drops to 60%.
      *   EV: (40% × £30) − (60% × £20) = £12 − £12 = **£0.**
      *   You break even, but you spend ten penalties having a panic attack in front of the pub team that knocked you out last year. Not worth it.
  *   **Option 4 (Dave):** Mick has no data on Dave, so Mick is at 50% accuracy. The EV is the same as the coin (+£50). However, Dave is a worse taker. If Dave blasts it over the bar, Mick might argue the bet is void ("You didn't shoot on goal"). Also, it looks like you're scared to take responsibility. Take the shots yourself.
  *   **Option 5 (Middle):** As mentioned, this invites a rules dispute. "L or R" excludes Middle. Mick will claim the bet is off.

  ### Practical Execution Plan
  1.  **Accept the bet.** Smile. Act confident.
  2.  **Get a coin.** A proper one, not a bottle cap.
  3.  **The Protocol:** As you walk up to the spot, hand in your pocket. Heads = Left, Tails = Right.
  4.  **Commitment:** Once the coin lands, you *must* shoot that way. Even if you suddenly feel a "gut feeling" to go the other way, ignore it. That gut feeling is the trap Mick is waiting for.
  5.  **Secrecy:** Do not tell Mick you are flipping a coin. If you tell him, he knows his edge is gone. He might try to talk you out of it ("Come on, man, just take them properly"). Just say, "I'm getting in the zone."
  6.  **The Ref:** Ensure the ref knows the rule is "Side Shot," not "Side Saved." As long as you strike the ball toward a side, the bet stands, even if Mick saves it. (Though with 50% unpredictability, you'll score more than usual anyway).

  ### Summary
  Your housemate is right that this is a philosophical puzzle, but he's wrong that it leaves you paralyzed. The puzzle is solved by introducing randomness. Mick is betting on your **psychology**. The coin allows you to opt out of the psychology and play the **probability**.

  Take the bet. Flip the coin. Buy the beers on Sunday with Mick's £50.
