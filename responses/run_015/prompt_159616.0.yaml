  7.  **Final Polish:** Ensure the ranking is clear. Ensure the textual evidence is specific (chapter/verse references where possible). Make sure the "Fatal" one actually feels fatal. The *fen* (division) line is the strongest textual anchor against a pure fluidity reading.

