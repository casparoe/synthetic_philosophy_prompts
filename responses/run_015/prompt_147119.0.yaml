      *   *The Puzzle:* How should she update her probability of being in Red vs. Blue territory based *only* on this conditional statement?
      *   *The Conflict:* Standard Conditionalization (Bayes) doesn't apply directly because she didn't learn *that* she is in the Second Company sector. She learned a *constraint* on the probabilities within a specific partition.
      *   *Proposed Solutions:*
          *   *Van Fraassen (Judy Benjamin Rule):* Minimize information gain (relative entropy). Result: Probability of Red goes *down*.
          *   *Intuition:* Some argue it should stay the same (50/50) because the news was about Red, not Blue.
          *   *Others:* It should go up.
      *   *Core Issue:* How to update beliefs when given information about *probabilities* (higher-order evidence) rather than direct facts.

  3.  **Translate to GPS Vocabulary (Task 1):**
      *   *Judy:* The User/Phone.
      *   *Red/Blue Territory:* Two possible neighborhoods/zones (e.g., "Downtown" vs. "Uptown").
