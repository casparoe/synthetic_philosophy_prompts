      *   **Task 3: The Fire Extinguisher vs. Spare Key.**
          *   Fire extinguisher: Power to interfere exists, but it's *tracked* to your interests. It's not arbitrary.
          *   Spare key: If they can enter *whenever*, it's arbitrary. If they can only enter *if the house burns down*, it's non-arbitrary (conditional on your interest).
          *   *Relevance to Boss:* Can the boss fire only for cause (extinguisher) or for any reason (spare key)? At-will is closer to the spare key.

      *   **Task 4: The "Given Key" Scenario (Consent).**
          *   If you *gave* the key for emergencies, does domination exist?
          *   Republican view: If you can *revoke* the key easily, you aren't dominated. If you are stuck with it, you are.
          *   Analogy shakiness: It highlights that *control* over the power matters, not just the existence of the key.

      *   **Task 5: At-Will Employment Conclusion.**
