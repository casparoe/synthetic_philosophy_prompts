          *   You = Employee/Citizen.
          *   Bedroom = Private sphere/Job security/Livelihood.
          *   Spare Key = Capacity to interfere (fire/harm).
          *   Promise ("I won't use it") = Benevolence/Non-interference (Negative Liberty).
