      *   **Republican Freedom (Petit, Skinner):** Freedom as non-domination. It's not just about what happens (interference), but about the *status* of the relationship. If someone has the *capacity* to interfere arbitrarily in your choices, you are unfree, even if they don't.
      *   **Negative Liberty (Berlin):** Freedom from interference. If no one stops you, you are free.
      *   **The Roommate Analogy:** This is a classic illustration of non-domination. It's actually quite strong in the philosophical literature (often attributed to Philip Pettit or discussions surrounding him).
      *   **At-Will Employment:** This is a standard application of republican theory to labor markets. If the boss has arbitrary power, the worker is dependent.
      *   **Critiques:** Is the power truly *arbitrary*? Is there exit? Is the key necessary for safety (fire extinguisher)?

  3.  **Step-by-Step Analysis:**

