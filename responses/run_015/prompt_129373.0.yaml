      Good morning everyone. Looking around this room, I feel a bit like I'm living inside a textbook I usually just assign to my students. I teach political theory part-time, focusing on how democracies function, or sometimes fail to function, and yet last week when my name was pulled from the voter rolls I went from observing the experiment to becoming the data point. It is a surreal shift, and I know I am not alone in feeling the weight of that randomness. I see faces I recognize from the grocery store and the school board meetings, and I see others who have spent careers studying exactly why we are sitting here today. There is a tension in this room, and it would be dishonest to pretend otherwise. Half of us are wondering why forty strangers have been handed the keys to the most contentious issue in town, and the other half are worrying about whether we understand the limits of our power. So before we look at the maps of the waterfront or the zoning codes, I think we need to agree on where our authority actually comes from, because it is certainly not coming from a ballot box.

      We need to be clear that we are not representatives in the sense that our city councilors are. We do not have a mandate to push a specific ideology or to reward the voters who put us here, because nobody voted for us. If we try to act like elected officials, we will fail, and the scholars in this room will be right to cringe. But that lack of electoral mandate is not a bug in this system, it is the entire feature. The reason the elected council has been paralyzed on waterfront zoning for years is not because they lack intelligence or care about the town. It is because they are constantly campaigning. Every decision they make is weighed against how it will look in the next election cycle, which forces them to choose sides between development and environmental protection to satisfy their base. They are trapped in a binary choice because compromise looks like weakness to a voter looking for a champion.

      Our authority comes from something different. It comes from the fact that we are a mirror of the community rather than a megaphone for a faction. Because we were chosen by lot, we are insulated from the pressure to perform for donors or party loyalists. We are here for a specific task and then we go back to our regular lives, which frees us to look at the trade-offs without worrying about political survival. This means we have the liberty to find the messy middle ground that elected officials cannot touch. We can acknowledge that development brings revenue and housing while also admitting that it risks ecological damage, and we can weigh those values without fear of being primaried. Our legitimacy rests on the quality of our deliberation, not on the promises we made before we arrived.

      So when neighbors ask us what right we have to decide this, the answer is that we have the right to think deeply without an agenda. We are not here to impose a will upon the town but to work out what the town actually needs when the noise of the election cycle is turned off. This is not chaos, it is a different kind of order. It is a structured opportunity to break the deadlock by removing the incentive to polarize. I know there are skeptics in this room and I know there are experts, and I hope we can use both that skepticism and that expertise to hold each other accountable. Let us not pretend to be something we are not, but let us also not underestimate the power of forty people who are free to listen. We have a unique chance to show that governance can happen without grandstanding, and that the best way to represent the public interest is sometimes to stop trying to win a vote and start trying to solve the problem. Let's get to work.

