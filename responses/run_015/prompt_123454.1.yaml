answer: |-
  Here is the translation of the akrasia debate into behavioral economics (BE) vocabulary, followed by an audit of the conceptual residue.

  ### 1. Socratic Intellectualism: The Revealed Preference Tautology
  **Philosophical Claim:** No one errs willingly; if you do $Y$ instead of $X$, you must have believed $Y$ was better (or were ignorant of $X$'s value). Weakness of will is impossible; it is always an epistemic failure.

  **BE Translation:** **Ex Post Rationalization via Revealed Preference.**
  In standard neoclassical terms, utility is defined by choice. If an agent chooses $Y$ over $X$ at $t_1$, then $U(Y) > U(X)$ at $t_1$. To say they "should have" chosen $X$ is category error. Socratic intellectualism maps cleanly onto the **axiom of revealed preference**: action reveals the true utility function. Any claim of "I knew $X$ was better" is treated as cheap talk or a misreporting of the utility function.

  *   **Clean Map:** The impossability of acting against one's current maximand.
  *   **Distortion:** Socrates treats this as an epistemic constraint (ignorance); BE treats it as a definitional tautology. Socrates thinks we can correct the error via knowledge; BE implies the preference *is* the action.
  *   **Residue:** The phenomenological experience of regret. Socrates denies the conflict exists; BE acknowledges the conflict only if we introduce time inconsistency (which Socrates denies).

  ### 2. Aristotelian Incontinence: State-Dependent Utility & Hot/Cold Empathy Gaps
  **Philosophical Claim:** The *akratic* agent holds the correct universal premise ("Sweet things are bad for me") but fails to activate the particular premise ("This is sweet") due to appetite. Distinction: *Akrasia* (weakness, regretful) vs. *Akolasia* (vice, unrepentant).

  **BE Translation:** **State-Dependent Utility with Projection Bias.**
  The agent has two utility functions: $U_{cold}$ (long-term health) and $U_{hot}$ (immediate consumption). At $t_0$ (planning), the agent optimizes for $U_{cold}$. At $t_1$ (execution), a visceral state shifts the parameters, maximizing $U_{hot}$.
  *   **Akrasia:** A **naive** agent with state-dependent utility. They underestimate the magnitude of the state shift (projection bias). They experience regret at $t_2$ when $U_{cold}$ returns.
  *   **Akolasia:** A **sophisticated** agent with a permanently high discount rate, or an agent whose $U_{hot}$ has become the stable baseline. No regret because preferences are consistent over time, just "immoral" by external standards.
  *   **The Particular Premise:** This maps to **attention costs** or **bounded rationality**. The agent doesn't "lose" the knowledge; the cognitive cost of retrieving the universal constraint exceeds the threshold in the high-arousal state.

  *   **Clean Map:** Hot/cold empathy gaps perfectly model the "passion overriding reason" dynamic.
  *   **Distortion:** Aristotle insists the agent *knows* the particular fact ("this is sweet") but doesn't *use* it. BE usually models this as the utility weight of "sweet" spiking, not a failure to process the label "sweet."
  *   **Residue:** The normative distinction between *akrasia* and *akolasia*. In BE, this is just Naive vs. Sophisticated or Transient vs. Permanent shocks. BE lacks a vocabulary for "vice" as a moral corruption rather than a parameter stability issue.

  ### 3. Davidson's All-Things-Considered (ATC) Judgment: Dynamic Inconsistency
  **Philosophical Claim:** Akrasia is acting against an "all-things-considered" judgment. The puzzle is logical: How can I judge "All-in, $X$ is best" and do $Y$? Davidson rejects conditional judgments ("$X$ is best given my desire") to preserve the unity of the agent.

  **BE Translation:** **$\beta$-$\delta$ Discounting and Dynamic Inconsistency.**
  The ATC judgment is the **global utility function** ($U_{global}$) calculated at $t_0$ using $\delta$ (long-term discount factor). The action at $t_1$ is driven by the **local utility function** ($U_{local}$) where the present bias parameter $\beta < 1$ kicks in.
  *   **The Paradox Dissolved:** Davidson worries about logical contradiction. BE models this as a **game between temporal selves**. The $t_0$ self and $t_1$ self have different payoff matrices. There is no contradiction, only conflict.
  *   **Commitment Devices:** These are the economic solution to Davidson's puzzle. Binding contracts allow $t_0$ to constrain $t_1$, enforcing the ATC judgment.

  *   **Clean Map:** $\beta$-$\delta$ formalizes the gap between judgment and action precisely. Commitment devices are the institutionalization of "strength of will."
  *   **Distortion:** Davidson insists on a *single* agent acting irrationally. BE often models this as *multiple* agents (intrapersonal game theory). This dissolves the "unity of agency" required for moral responsibility.
  *   **Residue:** The normative authority of the ATC judgment. Why *ought* the $t_0$ self rule the $t_1$ self? BE assumes the long-run self is the "true" self for welfare analysis, but this is an assumption, not a derivation.

  ### Audit of the Residue: Gap or Noise?
  Is the conceptual residue (normativity, unity of agency, the "better" judgment) a real gap or verbal noise?

  **It is a real gap.**
  Behavioral economics successfully models the *mechanics* of akrasia (time inconsistency, state dependence) but eliminates the *normativity* that makes it a philosophical problem.
  1.  **Welfare Criteria:** BE typically privileges the "long-run" self for welfare analysis. But if the $t_1$ self genuinely prefers the cigarette (high $U_{hot}$), why is the $t_0$ preference authoritative? Philosophy asks *why* the ATC judgment binds; BE assumes it does for policy purposes.
  2.  **Unity of Agency:** By gamifying the selves, BE explains the conflict but explains away the agent. If I am a game between $t_0$ and $t_1$, who is responsible for the loss? The residue of "agency" is necessary for responsibility, which BE models struggle to accommodate without importing philosophical assumptions.
  3.  **Vice vs. Weakness:** The *akrasia/akolasia* distinction relies on a normative teleology (function of a human) that BE explicitly rejects. In BE, a stable preference for heroin is just a stable preference, not a corruption of function.

  **Confidence Level:** 85%
  **Least Sure Point:** I am least confident in the mapping of Aristotle's "failure to activate the particular premise" to **attention costs**. It could alternatively be modeled as a temporary change in the *belief* probability (Bayesian updating under noise) rather than a utility shift or attention cost. The formal literature on "cognitive noise" vs. "preference shocks" is still settling this distinction.

  Behavioral economics models the mechanics of akrasia but dissolves the normative conflict that makes it a philosophical problem.
