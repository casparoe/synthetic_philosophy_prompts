      *   **Commitment Contracts:** Binding future selves to overcome present bias.
      *   **State-Dependent Utility:** Utility functions change based on internal states (cravings, emotions, "hot" vs. "cold" states).
      *   **Revealed Preference:** Choice reveals utility (problematic for akrasia).

  4.  **Drafting the Translations (Iterative Process):**

