  2.  **Deconstruct the Argument:**
      *   *Premise 1:* Professional roles create distinct fiduciary duties that are institutionally grounded, not just personally felt.
      *   *Premise 2:* When roles overlap (e.g., legal advocate vs. public safety/mandated reporter), the obligations stem from different authoritative sources (bar association vs. statutory law).
      *   *Counter-objection:* The professor says one duty must be weaker and thus dissolve.
      *   *Rebuttal:* If the duty dissolved, there would be no remainder. But there *is* a remainder (residue).
      *   *Evidence of Residue:* Requirement for mitigation, apology, reporting the breach, lingering guilt that isn't just irrational but tracks a real normative loss.
      *   *Conclusion:* The persistence of the unchosen obligation's weight proves both were binding, hence a genuine dilemma.

  3.  **Drafting - Paragraph 1 (The Structural Conflict):**
