answer: |-
  Genuine moral dilemmas arise not from confused reasoning but from the architecture of overlapping institutional roles. As a legal advocate, confidentiality is constitutive; without it, the attorney-client relationship ceases to function. As a mandated reporter, public safety is statutory; without it, you violate civil law. These obligations derive from distinct authoritative sources that do not recognize a shared hierarchy. Your professor's claim assumes a monistic ethical system where all duties can be ranked on a single scale. However, professional ethics often operate in pluralistic systems where no meta-rule adjudicates the clash beforehand. When the duty to the client and the duty to the public collide, neither obligation loses its binding force simply because they cannot both be fulfilled. The conflict is structural, not calculative.

  The "weaker obligation dissolves" objection fails because it cannot account for moral residue. If one duty were truly non-binding, violating it would be morally neutral, leaving no trace. Yet, after choosing, the unchosen obligation persists as a normative debt. You may be required to file breach reports, seek informed consent retroactively, or offer apologies to the party harmed by your necessary violation. This isn't irrational guilt; it is institutional accountability acknowledging that a valid claim was infringed. The requirement for repair proves the obligation was not nullified but overridden. If the duty had vanished, there would be nothing to repair. The persistence of this residue confirms that both obligations remained fully in force, making the dilemma genuine. The scar left by the decision is the evidence that a real wrong occurred, even if it was the only thing you could do.
