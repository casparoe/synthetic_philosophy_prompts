      *   Legal advocacy demands confidentiality as a constitutive rule; without it, the role collapses.
      *   Mandated reporting demands disclosure to prevent harm; without it, the statutory duty is breached.
      *   These aren't personal preferences; they are institutional imperatives.
      *   When they collide, it's not a calculation of weight but a clash of authorities.
      *   The professor's claim assumes a single hierarchy of value, but professional ethics often operate in pluralistic systems where no single metric adjudicates the clash beforehand.

  4.  **Drafting - Paragraph 2 (The Residue Argument):**
