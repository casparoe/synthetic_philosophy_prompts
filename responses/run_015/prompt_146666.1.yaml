prompt: |-
  I'm working part-time at a community legal clinic while finishing my ethics coursework, and last week I had to choose between breaking client confidientiality to warn a third party about harm, or keeping it and letting the risk stand — and both options felt like actual violations, not just hard choices. My prof keeps saying true moral dilemmas can't exist because if two obligations really conflict, one must be weaker and therefore not binding, but that sounds like definitional sleight-of-hand to me. Can you argue that genuine moral dilemmas are not only possible but structurally unavoidable in roles that carry overlapping fiduciary commitments — like being both an advocate and a mandated reporter — where the conflict isn't between personal values but between institutional obligations that stay fully in force even after you pick one?

  Specifically, I want the argument to tackle the 'weaker obligation dissolves' objection head-on: show that after you choose, the unchosen obligation doesn't just vanish but leaves a real residue — guilt that tracks a genuine wrong, a duty to repair or acknowledge, maybe even institutional accountability — and that this residue proves the conflict was real rather than apparent. Don't just invoke Sartre's student or trolley-style cases, I've seen those discussed to death. Build it from the architecture of the roles themselves, and keep the whole thing under 400 words, max two paragraphs. I'd also rather you not drop philosopher names I'm not sure you remember right; just make the structural case.
