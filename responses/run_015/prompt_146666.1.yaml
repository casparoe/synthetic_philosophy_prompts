      *Drafting Paragraph 1:*
      Genuine moral dilemmas arise not from confused reasoning but from the architecture of overlapping institutional roles. As a legal advocate, confidentiality is constitutive; without it, the attorney-client relationship ceases to function. As a mandated reporter, public safety is statutory; without it, you violate civil law. These obligations derive from distinct authoritative sources that do not recognize a shared hierarchy. Your professor's claim assumes a monistic ethical system where all duties can be ranked on a single scale. However, professional ethics often operate in pluralistic systems where no meta-rule adjudicates the clash beforehand. When the duty to the client and the duty to the public collide, neither obligation loses its binding force simply because they cannot both be fulfilled. The conflict is structural, not calculative.

