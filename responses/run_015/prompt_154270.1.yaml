      *   *Normativity:* This is the hardest part. Lewis's normativity is reason-based. PP's normativity is imperative-based (minimize surprise). I need to highlight this gap. The "ought" in PP is hypothetical ("if you want to exist/minimize surprise, you ought to..."). Lewis's is closer to a social contract.
      *   *Heterogeneity:* Ensure I emphasize that Agent A and Agent B have *different* internal states. They are not simulating each other perfectly (which leads to infinite regress). They are modeling the *boundary conditions* of the other.

  8.  **Final Polish:**
      *   Check constraints: No citations.
      *   Tone: Academic, rigorous, conceptual.
      *   Structure: Translation section, Residue Report section, Assessment section.

  9.  **(Mental Check of the "Heterogeneous Consensus" concept):**
      *   Standard AI often assumes agents minimize the same free energy functional.
      *   The prompt asks for *distinct* generative models.
      *   How do they couple? Through the Markov blanket. My action is your sensation.
      *   Stability arises when my policy minimizes my error *given* your policy, and vice versa. This is a Nash Equilibrium in dynamical clothing.
      *   Precision weighting acts as the "commitment" device. High precision on social priors makes me resistant to deviating even if local sensory noise suggests otherwise.

  10. **Drafting the Content:** (Proceeding to generate response based on these thoughts.)
      *   *Introduction:* Set the stage.
      *   *Translation:* Go through the 4 pillars.
      *   *Residue:* The friction points.
