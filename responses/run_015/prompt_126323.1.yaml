      *   *Reflection:* $P_{now}(H | P_{later}(H)=0.3) = 0.3$.
      *   *Bayes:* $P_{now}(H | \text{Prediction}) \propto P(\text{Prediction} | H) \times P(H)$. Since $H$ causes the prediction of low confidence, $P(\text{Prediction} | H)$ is high. So $P_{now}(H)$ goes up.
