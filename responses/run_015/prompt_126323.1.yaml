  5.  **The Defender's Move:**
      *   Van Fraassen's out: Reflection only applies if you regard your future self as a rational agent who hasn't lost information.
      *   In this case, you know your future self is chemically compromised. So Reflection is suspended. You treat the future credence as data, not as an authority.

