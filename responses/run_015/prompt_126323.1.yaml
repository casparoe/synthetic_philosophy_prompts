      *   *The "Weird Corner":* I need a case where knowing your future credence gives you information *now* that overrides the credence itself. This usually happens in cases of "forgetting" or "self-locating belief" (like Sleeping Beauty), but the prompt asks for a "credence mirror" gadget in a lab.
      *   *The Specific Violation:* "More certain now... after learning they'll later be *less* certain."
          *   Let $H$ be the hypothesis.
          *   Mirror says: $P_{future}(H) = 0.4$.
          *   Reflection says: $P_{now}(H | \text{Mirror says } 0.4) = 0.4$.
