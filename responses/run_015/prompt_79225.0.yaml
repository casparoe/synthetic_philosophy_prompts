answer: |-
  **I. Darwinian**

  The law was written before the body woke.
  The law was written before the body woke.
  The law was written before the body woke.
  The law was written before the body woke.

  **II. Skinnerian**

  Reach for the red berry sweet on the bush.
  Reach for the red berry sweet on the bush.
  Reach for the red berry—*thorn puncture, blood well*—
  Withdraw the hand and learn the shape of pain.

  **III. Popperian**

  ~~Run straight through the fire~~
  ~~Wait until the rain puts it out~~
  ~~Call for help from the ridge~~
  Walk around the smoke where the air is clear.

  **IV. Gregorian**

  "Long story short," the verdict is in:
  "Think outside the box" but "stay the course,"
  "In the nick of time," "the ball is in your court,"
  "We see through a glass darkly," "end of story."

  ***

  **Commentary on Form and Philosophy**

  I adhered to the four-movement structure because Dennett explicitly presents these grades as an evolutionary hierarchy of design processes, even if they nest in practice. However, here is where I bent the ideas or leaned on contested readings:

  1.  **The Darwinian "Stuckness":** I interpreted "nothing in it can vary" literally by repeating the same line four times. This risks making the section feel like concrete poetry rather than verse, but it enforces the idea of a creature that cannot learn or deviate from its genetic script within its lifetime. The "sentence handed down" is treated as an immutable decree.
  2.  **The Skinnerian Cost:** The constraint requires something to "go wrong" for the line to change. I used physical pain (*thorn puncture*) as the reinforcement signal. This leans on a behaviorist reading that privileges negative reinforcement as the primary driver of change, which is a simplification of Skinner but fits the poetic need for a dramatic turn.
  3.  **The Popperian Strikethrough:** Using strikethrough text to represent "thinking" is a visual metaphor for internal simulation. The philosophical bend here is implying that discarded hypotheses are fully formed lines comparable to the final action. In reality, Popperian testing is often fuzzy and non-linguistic, but the form requires visible "discarded candidates."
  4.  **The Gregorian Crowd:** I relied heavily on idioms and clichés to represent "memes" or cultural tools. The risk here is that the section feels like a collage of clichés rather than a coherent voice. This is intentional: the Gregorian creature's mind is "crowded" with the borrowed tools of others. The "I" is almost entirely displaced by the "We" of culture.
  5.  **The Ladder vs. Nesting:** The prompt warned against the "ladder" if it misrepresents the taxonomy. Dennett argues these grades nest (a Gregorian creature is also Popperian, Skinnerian, and Darwinian). By separating them into four distinct sections, the poem risks implying they are separate species rather than layered competencies. I accepted this trade-off to satisfy the formal constraint of "four movements, one per grade," but the progression implies accumulation: the final section relies on the capacity for language (Gregorian) which presupposes the planning (Popperian), conditioning (Skinnerian), and existence (Darwinian) of the previous three. The poem is a ladder of *mechanisms*, not necessarily a ladder of *beings*.
