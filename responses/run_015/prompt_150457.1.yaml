answer: |-
  The practice of Species Survival Plans (SSPs) presupposes a philosophy of **Pragmatic Convention operationalized as Administrative Essentialism**. While the *mechanism* of SSPs mimics taxonomic essentialism (treating species boundaries as sharp, normative, and immutable), the *justification* is fundamentally pragmatic (the need for manageable units of conservation). The system does not rely on Pluralist Realism, as it does not accommodate multiple valid species concepts simultaneously; nor does it rely on ontological Essentialism, as coordinators are generally aware of genetic fluidity but suppress it for administrative stability.

  ### 1. Implicit Theory of the Species: The "Unit of Account"
  The SSP framework reconstructs the species not as a biological reality (a reproductive community or a monophyletic clade) but as a **Unit of Account**.
  *   **Ontology:** In this framework, a species is a discrete ledger entry. It exists to ensure that "diversity" can be quantified, tracked, and allocated. The ontology is nominalist (names are human constructs) but the rules are essentialist (names must be treated as fixed essences).
  *   **Value:** Species are valued **instrumentally**, not intrinsically. They are proxies for "biodiversity." The goal is not to preserve the metaphysical essence of *Panthera leo*, but to maintain a representative sample of the genetic and phenotypic variation associated with that label to prevent the loss of evolutionary potential. However, the *rule set* treats the species label as if it had **intrinsic normative weight**, forbidding hybridization even when it might enhance individual welfare or genetic viability. This creates a tension where the instrumental goal (survival) is occasionally sacrificed to the essentialist rule (purity of the ledger).

  ### 2. Strict Requirements vs. Mere Fit
  To distinguish what the SSP system *needs* to function from what it *claims* to represent:
  *   **Strictly Requires:**
      1.  **Nomenclatural Stability:** The label must remain constant over time to allow for pedigree tracking across generations and institutions.
      2.  **Discreteness for Pairing:** The system requires a binary decision rule (compatible/incompatible) for breeding. It cannot process continuous clinal variation or probability-based relatedness across cryptic lineages.
      3.  **Prohibition of Gene Flow between Labels:** To maintain the integrity of the "Unit of Account," genetic exchange between distinct ledger entries must be forbidden, regardless of biological compatibility.
  *   **Merely Fits:**
      1.  **Biological Species Concept (BSC) Alignment:** It fits the narrative if the named species correspond to reproductively isolated groups, but the system functions even when they do not (e.g., managing hybrid swarms as pure species).
      2.  **Phylogenetic Purity:** It fits if the managed population is monophyletic, but SSPs often manage populations that are genetically admixed provided the *label* remains consistent.
      3.  **Ecological Function:** It fits if the species performs a specific niche role, but SSPs prioritize the label over the function (e.g., breeding a captive tiger that will never hunt).

  ### 3. Survivability Under Alternative Standards
  Could this framework survive replacement by population-genetics or ecosystem-function standards?
  *   **Population-Genetics Standard (ESUs):** If SSPs shifted to managing Evolutionarily Significant Units (ESUs) based strictly on genetic distinctiveness rather than Linnaean names, the framework would **collapse**. The administrative burden would explode due to the granularity of genetic data, the fluidity of genetic boundaries, and the impossibility of maintaining distinct pedigrees for continuous clines. The "Unit of Account" would fragment into too many units to manage institutionally.
  *   **Ecosystem-Function Standard:** If the standard became "maintain a large felid predator role," the specific species identity would become irrelevant. The SSP framework would **dissolve**, as the specific pairing rules (which rely on taxonomic identity) would be replaced by functional trait selection. The zoo would become a gene bank for traits rather than an ark for species.
  *   **Conclusion:** The SSP framework is brittle regarding biological reality but robust regarding administrative function. It cannot survive a shift to pure genetics or function without ceasing to be an SSP and becoming something else entirely (e.g., a genetic resource bank).

  ### 4. What Would Change My Mind
  My diagnosis rests on the interpretation that SSPs use essentialist rules for pragmatic ends. Two specific lines of evidence could alter this conclusion:

  *   **Evidence for Pure Pragmatism (Bureaucratic Tractability):** If internal SSP documents revealed that coordinators **routinely reclassify individuals** or silently permit "cryptic hybridization" when necessary to prevent inbreeding depression, treating the species label as a flexible administrative tool rather than a hard boundary. This would confirm the system is a **Pragmatic Convention** through and through, with essentialism being merely rhetorical.
  *   **Evidence for Hidden Essentialism (Ontological Commitment):** If SSP guidelines explicitly rejected genetic rescue or cross-lineage pairing **even when extinction of the managed unit was imminent**, citing "taxonomic integrity" as a value superior to survival itself. Alternatively, if coordinators were shown to rely strictly on **reproductive isolation criteria** to define management units while ignoring phylogenetic data that suggests lumping. This would indicate a commitment to **Biological Essentialism**, where the species boundary is viewed as a natural kind that must not be violated, regardless of conservation utility.

  **Current Assessment:** The preponderance of evidence suggests the former (Pragmatic Convention). SSPs occasionally allow for "genetic rescue" via managed introductions from wild populations that might be taxonomically distinct but are deemed "conservation units," suggesting the "species" label is a proxy for "manageable diversity" rather than an ontological truth. However, the *default* setting remains Administrative Essentialism because the cost of pragmatism (complexity) is too high for the current institutional infrastructure.
