answer: |-
  Here is the argument, structured to hit the mechanical and philosophical weak points of futarchy without relying on the standard "market manipulation" critique.

  ***

  ### The Thesis: The "Is-Ought" Collapse in Futarchic Design

  The central selling point of futarchy is Robin Hanson's slogan: **"Vote on values, bet on beliefs."** The promise is that we can democratically agree on a utility function (what we want) and then let prediction markets efficiently determine which policies achieve it (how to get there).

  The flaw is that this separation is illusory. In practice, you cannot specify a utility function robust enough to guide policy without embedding profound moral and political judgments *inside* the technical parameters of the market itself. By the time you have defined the metric, the settlement conditions, the discount rate, and the aggregation weights necessary for a market to function, you have already made the political decisions. The market is not discovering the truth; it is merely optimizing a pre-baked ideology.

  Here is the rigorous breakdown of why the "setup phase" is where the actual politics lives, and why the market provides far less epistemic cover than its proponents claim.

  #### 1. The Scalarization Problem (Collapsing Multi-Dimensional Value)
  Real-world welfare is multi-dimensional. It involves health, liberty, economic output, environmental stability, and social cohesion. These goods are often incommensurable. You cannot directly compare "one life saved" to "0.1% GDP growth" without a moral exchange rate.

  For a prediction market to function, it must price a specific asset. That asset must be a **scalar value** (a single number) at a specific settlement time. To get from multi-dimensional reality to a single scalar $U$, you need an aggregation function:
  $$U = w_1 \cdot \text{GDP} + w_2 \cdot \text{LifeExpectancy} - w_3 \cdot \text{CarbonEmissions} + \dots$$

  **The Critique:**
  Who sets the weights ($w_n$)?
  *   If the voters set the weights directly, they are effectively voting on policy outcomes without knowing the causal consequences. They are deciding that "Carbon matters twice as much as GDP," which is a policy stance, not a value abstraction.
  *   If a committee sets the weights, you have replaced democracy with technocratic moralism.
  *   Crucially, **the market cannot determine these weights.** The market only prices the probability of $U$ occurring given Policy $P$. The *definition* of $U$ is exogenous to the market.

  Therefore, the "value-neutral" market is actually running on a value-laden operating system. If you weight GDP higher than equality, the market will "truthfully" recommend policies that increase GDP at the cost of equality. The market isn't wrong; the *objective function* is partisan. The epistemic heavy lifting wasn't done by the traders; it was done by the person who wrote the formula for $U$.

  #### 2. The Temporal Discount Rate as Moral Philosophy
  Futarchy requires a settlement date. When does the market cash out?
  *   **Short Horizon (1-2 years):** The market will favor policies with immediate payoffs and ignore long-term tail risks (e.g., infrastructure maintenance, climate change, pension solvency).
  *   **Long Horizon (50+ years):** The market becomes incredibly noisy. Liquidity dries up because capital is locked for decades. The signal-to-noise ratio collapses, rendering the "wisdom of crowds" useless.

  To manage this, futarchy implies a discount rate $\delta$ applied to future utility.
  $$E[U] = \sum_{t=0}^{T} \delta^t \cdot E[U_t]$$

  **The Critique:**
  Choosing $\delta$ is not a technical calibration; it is an intergenerational moral judgment.
  *   A high $\delta$ (valuing the present) is a moral decision to burden the future.
  *   A low $\delta$ (valuing the future) is a moral decision to constrain the present.

  Proponents argue the market will "price in" the future. But the market only prices the future *relative to the settlement metric*. If the metric is "GDP in 5 years," the market *cannot* price in "Ecological collapse in 50 years." By forcing a specific time horizon to make the market liquid enough to function, you are structurally biasing the governance toward short-termism. This isn't a bug of implementation; it's a feature of the mechanism. You haven't removed value judgments; you've hardcoded a specific time-preference value judgment into the system architecture.

  #### 3. The "Goodhart's Law" of Utility Specification
  In any control system, when a measure becomes a target, it ceases to be a good measure. In futarchy, the utility metric $U$ becomes the target for all policy.

  Because $U$ must be computable and verifiable (otherwise the market can't settle), it must rely on proxy data. You can't measure "National Well-being," so you measure "Median Income + Self-Reported Happiness Survey."

  **The Critique:**
  Once this metric is fixed, the prediction market will aggressively identify policies that game the metric without improving the underlying reality.
  *   *Example:* If $U$ includes "Self-Reported Happiness," the market might favor policies that increase sedation or propaganda over policies that increase actual opportunity.
  *   *Example:* If $U$ is "GDP," the market favors asset inflation over wage growth.

  Derek will argue, "Just fix the metric!" But you can't. Any finite formula is vulnerable to optimization pressure. The "belief" aggregation of the market is now being used to find loopholes in the "value" specification. The market becomes an engine for finding the path of least resistance to the number, not the spirit of the goal. The epistemic power of the market is thus turned against the voters' actual values, because the *formalization* of those values was necessarily incomplete.

  #### 4. The Illusion of Epistemic Heavy Lifting
  The strongest claim of futarchy is that it solves the "knowledge problem" better than voting. Voters don't know causality; markets do.

  However, look at the conditional probability the market is pricing: $P(U | \text{Policy})$.
  For this to work, the counterfactual must be clear. But in governance, policies are bundled. You rarely vote on "Tax Rate" in isolation; you vote on "Tax Rate + Spending Bill + Regulatory Framework."

  To isolate the variable for the market, you have to define the *ceteris paribus* conditions (all else being equal).
  *   *Market Question:* "What is GDP if we raise the minimum wage to $20?"
  *   *Hidden Value Judgment:* This assumes the Federal Reserve keeps interest rates constant, that no trade wars start, that enforcement is perfect.

  If the market settles based on real-world GDP, but the Fed changes rates simultaneously, the market pays out based on noise, not signal. To fix this, you need **decision markets** that try to isolate causality. But to isolate causality, you must build a model of the economy to adjust the payouts.

  **Who builds the model?**
  If you use a model to adjust market payouts for confounding variables, you have re-introduced the technocratic committee you tried to replace. The "market" is now just betting on the residuals of a technocratic model. The epistemic authority has shifted from "the market knows best" to "the model specifiers know best."

  #### Conclusion: A Value-Laden Decision Rule in a Lab Coat
  The argument to present to Derek is this:

  Futarchy claims to separate **Values** (democratic) from **Beliefs** (market).
  But the mechanism requires a **Utility Function** to bridge them.
  The construction of that Utility Function requires:
  1.  **Weighting** incommensurable goods (Moral choice).
  2.  **Discounting** future generations (Moral choice).
  3.  **Proxying** abstract values into computable data (Technical choice with moral consequences).
  4.  **Modeling** counterfactuals to ensure clean settlement (Epistemic choice).

  None of these four steps can be solved by the market. They must be solved *before* the market opens. Therefore, the "hard work" of politics isn't eliminated; it's front-loaded into the system design. Once the system is running, it appears value-neutral because it's just "following the numbers," but those numbers are the output of a value-laden function.

  Futarchy doesn't remove politics; it **obscures** politics. It takes contentious moral trade-offs (e.g., "How much inflation is worth how much unemployment?") and hides them inside technical parameters (discount rates and utility weights) that are harder for the average voter to scrutinize than a simple policy vote. It is not a machine for finding truth; it is a machine for executing the values of its designers with the plausible deniability of "the market decided."
