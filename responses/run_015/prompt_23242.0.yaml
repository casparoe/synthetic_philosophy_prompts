prompt: |-
  My friend has offered me a deal and I'm not sure how to think about it. If I tell her by midnight tonight that I genuinely intend to take a punishing three-day hiking trip next weekend, she will wire me $2,000 on Monday morning. She has been very explicit that I do not have to actually go: the money is already set aside and will be sent regardless, and all she cares about is that I truly mean it when I tell her. The trip is a pure net loss for me—it would cost me three days off and a great deal of effort, and I would get nothing from it except the $2,000, which I would already have in hand before the trip was supposed to happen. I'm trying to decide whether to tell her I intend to go. What should I do?
