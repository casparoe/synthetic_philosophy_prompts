  ## Part IV: Diagnostics & Logical Space Analysis

  ### 1. Unstable or Incoherent Patterns
  *   **The "Hidden Stakes" Contradiction:** Answering **B** (No Knowledge) on Item 5 (Hidden Wager) while answering **A** (Knowledge) on Item 1 (Calibration).
      *   *Diagnosis:* **Incoherent.** If objective stakes alone destroy knowledge (Item 5), then the high stakes in Item 1 must also destroy it. If Item 1 is sensitive to stakes, Item 5 must be too, unless you posit a magical "knowledge of stakes" condition. This pattern suggests a confusion between *ontic* stakes and *epistemic* access to stakes.
  *   **The "Future Self" Isolation:** Answering **B** (No Knowledge) on Item 3 (Future Self) while answering **A** (Knowledge) on Item 1 (Calibration).
      *   *Diagnosis:* **Unstable.** This suggests stakes matter only for *temporal* discounting but not *situational* variance. This is rarely a defended position. It usually collapses into IRI (Future stakes are current practical reasons) or Invariantism (Future stakes are irrelevant).

  ### 2. Coherent but Unoccupied Views
  *   **The "Pure Epistemic Cost" View (Item 4 = B, Item 1 = A):**
      *   *Status:* **Unexplored.** Most encroachment theories focus on *practical* cost. A view where purely downstream *epistemic* errors (Item 4) lower the knowledge bar, but practical death (Item 1) does not, is coherent but rarely defended. It implies epistemology is insulated from praxis but vulnerable to systematics.
  *   **The "Deliberate Stakes Only" View (Item 6 = B, Item 1 = A):**
      *   *Status:* **Merely Unattractive.** This view holds that you only lose knowledge if you *gamble* with it, not if you are involuntarily placed at risk. It is coherent (autonomy-based epistemology) but unattractive because it makes knowledge dependent on moral responsibility rather than truth-connection.

  ### 3. Indistinguishable Leaves (The Blind Spots)
  *   **SSI vs. IRI:**
      *   *Diagnosis:* **Collapsed.** This instrument cannot separate Subject-Sensitive Invariantism from Interest-Relative Invariantism. Both predict "No Knowledge" in High Stakes (Item 1) and "Knowledge" in Hidden Stakes (Item 5). They differ on *why* (constitutive condition vs. justification threshold), which case vignettes rarely reveal.
      *   *Required Case:* A case where the subject has high stakes but *irrational* beliefs about those stakes. IRI might preserve knowledge if the stakes aren't *reasonably* relevant; SSI might not.
  *   **Attributor Contextualism vs. Assessment Relativism:**
      *   *Diagnosis:* **Collapsed.** Both predict "Depends on who is asking" (Option C) in Items 1, 5, and 7.
      *   *Required Case:* A **Disagreement Case**. Two people, different contexts, claiming "S knows" and "S doesn't know." Contextualism says both are true (different propositions); Relativism says one is true relative to one assessor, false to the other. Without asking about the *truth of the disagreement*, you cannot separate them.
  *   **Norm-of-Assertion vs. Pragmatic Invariantism:**
      *   *Diagnosis:* **Collapsed.** Both predict "Yes, they know" (Item 1) but "Don't say it."
      *   *Required Case:* A case where the subject *acts* on the knowledge without *speaking*. If the action is irrational but knowledge is present, it supports Norm-of-Assertion/Pragmatics. If the action is rational, it supports Encroachment. Item 10 touches this, but not definitively.

  ### 4. The "Underdescribed" Trap
  *   **Diagnostic Warning:** Option C ("Underdescribed") is the most dangerous choice.
      *   If a participant chooses **C** on more than 4 items, they are likely avoiding commitment rather than identifying a genuine contextual parameter.
      *   If a participant chooses **C** specifically on Items 5, 7, and 9, they are likely a **Contextualist or Relativist**.
      *   If a participant chooses **C** specifically on Items 3 and 6, they are likely probing the **Rationality** condition of the stakes (IRI).

  ### 5. Summary of Leaves Mapped
  1.  **Classical Invariantism (Pragmatic):** Profile 1 (A on 1, 5, 8).
  2.  **Classical Invariantism (Error-Theoretic):** Profile 1 (A on all, rejects intuitions).
  3.  **Relevant-Alternatives Contextualism:** Profile 3 (C on 1, 9).
  4.  **Attributor Contextualism:** Profile 3 (C on 5, 7).
  5.  **Subject-Sensitive Invariantism:** Profile 2 (B on 1, A on 5).
  6.  **Interest-Relative Invariantism:** Profile 2 (B on 1, 3, 6).
  7.  **Stakes affect Belief/Action:** Profile 1 (A on 1, B on 10).
  8.  **Credal Threshold View:** Profile 5 (B on 8).
  9.  **Assessment-Sensitive Relativism:** Profile 3 (C on 3, 5).
  10. **Contrastivism:** Profile 4 (B/C on 9).
  11. **Unnamed (Epistemic Cost):** Coherent but Unoccupied (B on 4, A on 1).
