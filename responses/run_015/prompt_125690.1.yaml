answer: |-
  # The Stakes Sorting Instrument

  ## Part I: The Quiz

  **Instructions:** Read each vignette carefully. Select the single option that best matches your intuitive verdict. Do not worry about technical terms; answer based on whether it feels correct to say the person "knows."

  **1. The Mechanic (Calibration)**
  A mechanic inspects a brake pad. The evidence is a visual check that is 95% reliable.
  *Case A:* The car is for a routine commute.
  *Case B:* The car is for a high-speed race where brake failure means death.
  In Case B, does the mechanic know the brakes are safe?
  A) Yes, exactly as much as in Case A.
  B) No, unlike in Case A.
  C) Underdescribed — it depends on who is asking or why.

  **2. The Auditor (Third-Party Stakes)**
  A safety system automatically logs bridge stress data. An auditor reviews the log to sign off. The auditor's personal risk is zero (she is retired and indemnified). The public's risk is catastrophic if she is wrong. The evidence is conclusive. Does the auditor know the bridge is safe?
  A) Yes, the evidence is conclusive.
  B) No, the stakes for the public are too high.
  C) Underdescribed — it depends on whether the auditor is responsible for the outcome.

  **3. The Student (Future Self)**
  A student checks an answer key. She is confident. Today, she wants to go to a party (low stakes on the grade). Next week, she needs this grade for medical school admission (high stakes). Does she know the answer is correct *today*?
  A) Yes, her current evidence is sufficient.
  B) No, her future need raises the bar now.
  C) Underdescribed — it depends on whether she cares about her future self.

  **4. The Mathematician (Epistemic Stakes)**
  A mathematician verifies a lemma. If false, no one gets hurt, but 1,000 downstream proofs collapse. The evidence is a standard proof. Does she know the lemma is true?
  A) Yes, proof is proof.
  B) No, the cost of error in the system is too high.
  C) Underdescribed — it depends on how many proofs actually rely on it.

  **5. The Wager (Hidden Stakes)**
  A person checks a reliable watch to tell the time. Unbeknownst to them, a stranger has bet $1 million that they will be wrong. The person does not know about the bet. Do they know the time?
  A) Yes, the bet doesn't change their evidence.
  B) No, the stakes are objectively high.
  C) Underdescribed — it depends on whether the *attributor* knows about the bet.

  **6. The Climber (Deliberate vs. Imposed)**
  Two climbers face a gap. Evidence of grip strength is identical.
  *Climber X:* Faces natural stakes (a fall means injury).
  *Climber Y:* Bets their life savings they can make the jump (deliberate stakes).
  Does Climber Y know they can make the jump?
  A) Yes, stakes are stakes, regardless of origin.
  B) No, deliberately raising stakes changes the epistemic position.
  C) Underdescribed — it depends on whether the bet was rational.

  **7. The Negotiator (Opposed Interests)**
  A negotiator evaluates a deal. Proposition: "The other side will accept $50k."
  *Party A (Seller):* Needs the sale to save their business (High Stakes).
  *Party B (Buyer):* Can walk away easily (Low Stakes).
  The negotiator works for Party A. Does the negotiator know the deal will hold?
  A) Yes, knowledge depends on the evidence, not the client's need.
  B) No, the client's high stakes transfer to the negotiator.
  C) Underdescribed — it depends on whether Party B is the one attributing knowledge.

  **8. The Engineer (Probability vs. Magnitude)**
  *Case A:* 90% chance of rain. Stakes: Ruined picnic.
  *Case B:* 1% chance of structural failure. Stakes: Building collapse.
  In Case B, does the engineer know the building is safe?
  A) Yes, 99% safety is sufficient for knowledge.
  B) No, the magnitude of the error cost outweighs the probability.
  C) Underdescribed — it depends on the acceptable risk threshold for the industry.

  **9. The Forager (Contrastive Stakes)**
  A forager identifies a mushroom.
  *Contrast 1:* Is it Edible or Poisonous? (High Stakes).
  *Contrast 2:* Is it Edible or Inedible (but harmless)? (Low Stakes).
  The mushroom is Edible. Does the forager know it is Edible?
  A) Yes, knowledge is absolute regardless of the contrast.
  B) No, knowledge is only relative to the specific contrast class.
  C) Underdescribed — it depends on which contrast is currently relevant.

  **10. The Assembly Line (Compounding Errors)**
  An inspector checks 1,000 screws. Each screw's failure is minor. If *all* hold, the machine works. If *any* fail, it jams. Evidence for each screw is identical. Does the inspector know Screw #542 is tight?
  A) Yes, each screw is an independent knowledge claim.
  B) No, the cumulative risk of error across the line undermines individual knowledge.
  C) Underdescribed — it depends on whether the goal is knowing about the screw or the machine.

  ***

  ## Part II: The Decision Tree

  This tree maps the logical space of the quiz responses. It does not use theory names, but rather structural commitments.

  **Root Node: The Practical Factor**
  *Do practical factors (stakes, costs, interests) ever change the **truth value** of a knowledge attribution (not just whether it is polite to say it)?*
  *   **NO:** Go to **Branch Invariantism**.
  *   **YES:** Go to **Branch Encroachment**.
  *   **DEPENDS (on context/attributor):** Go to **Branch Context/Relativism**.

  **Branch Invariantism (Practical factors do not change truth)**
  *   **Node I-1: How do you explain the intuition that stakes matter?**
      *   *Pragmatics:* We know, but shouldn't say/act. -> **Leaf: Classical Invariantism (Pragmatic)**
      *   *Error:* The intuition is simply mistaken. -> **Leaf: Classical Invariantism (Error-Theoretic)**
      *   *Belief/Action:* Stakes change whether we *believe* or *act*, not whether we *know*. -> **Leaf: Stakes affect Belief/Action**

  **Branch Encroachment (Practical factors change truth, tied to Subject)**
  *   **Node E-1: Where does the encroachment happen?**
      *   *Justification:* Stakes change how much evidence is needed. -> **Leaf: Interest-Relative Invariantism (IRI)**
      *   *Knowledge Directly:* Stakes are a constitutive condition of knowledge. -> **Leaf: Subject-Sensitive Invariantism (SSI)**
      *   *Credence:* Stakes set the threshold probability for knowledge. -> **Leaf: Credal Threshold View**
  *   **Node E-2: What is the mechanism?**
      *   *Cost of Error:* Weighted by probability. -> **Leaf: Cost-Weighted Encroachment**
      *   *Relevance:* Stakes make error possibilities relevant. -> **Leaf: Relevant-Alternatives (Subject-Sensitive)**

  **Branch Context/Relativism (Practical factors change truth, tied to Context/Assessor)**
  *   **Node C-1: Whose situation determines the standard?**
      *   *Attributor (Speaker):* The person saying "S knows." -> **Leaf: Attributor Contextualism**
      *   *Assessor (Evaluator):* The person evaluating the claim (could be later/different). -> **Leaf: Assessment-Sensitive Relativism**
      *   *Subject (S):* (Returns to Branch Encroachment).
  *   **Node C-2: What is the mechanism?**
      *   *Content:* The proposition expressed changes. -> **Leaf: Propositional Contextualism**
      *   *Standard:* The semantic value of "knows" changes. -> **Leaf: Indexical Contextualism**
      *   *Assertion:* Only the norm of assertion changes. -> **Leaf: Norm-of-Assertion View**

  **Branch Contrastivism (Special Case)**
  *   **Node K-1: Is knowledge a binary relation (S knows p)?**
      *   *No:* It is a ternary relation (S knows p rather than q). -> **Leaf: Contrastivism**

  ***

  ## Part III: Scoring Key & Diagnostics

  Map your quiz answers to the profiles below. There is no rigid point system; look for the **Signature Pattern** that matches your responses.

  ### Profile 1: The Hard Invariantist
  *   **Signature:** Answers **A** on Items 1, 4, 5, 8. (Evidence alone determines knowledge).
  *   **Key Differentiator:** Item 1 (Calibration). If you said "Yes, exactly as much as in Case A," you are an Invariantist.
  *   **Sub-Diagnosis:**
      *   If you answered **A** on Item 10 (Compounding): **Classical Invariantism**.
      *   If you answered **B** on Item 10 but **A** on Item 1: **Stakes affect Belief/Action** (You think the *risk* changes, not the knowledge).
      *   If you answered **C** on Item 5 (Hidden Stakes) but **A** on Item 1: **Pragmatic Invariantism** (You think the *assertion* depends on the attributor's knowledge of stakes, but the fact of knowledge does not).

  ### Profile 2: The Subject-Sensitizer (SSI/IRI)
  *   **Signature:** Answers **B** on Item 1, **A** on Item 5, **B** on Item 3. (Subject's stakes matter, but hidden stakes do not).
  *   **Key Differentiator:** Item 5 (Hidden Stakes). If you said "Yes, the bet doesn't change their evidence" (A) but "No" on Item 1 (Calibration), you believe stakes must be *real for the subject* to matter.
  *   **Sub-Diagnosis:**
      *   If you answered **B** on Item 6 (Deliberate Stakes): **Interest-Relative Invariantism (IRI)**. (You think rational stakes management matters).
      *   If you answered **A** on Item 6: **Subject-Sensitive Invariantism (SSI)**. (You think the objective stakes matter, regardless of how they arose).
      *   *Note:* These two views often collapse in practice. If you distinguished them, check Item 8. If you weighted Probability heavily, lean IRI. If you weighted Magnitude heavily, lean SSI.

  ### Profile 3: The Contextualist
  *   **Signature:** Answers **C** on Item 1, **C** on Item 5, **C** on Item 7. (Truth depends on the conversational context).
  *   **Key Differentiator:** Item 7 (Opposed Interests). If you said "Depends on whether Party B is the one attributing," you track the Attributor.
  *   **Sub-Diagnosis:**
      *   If you answered **C** on Item 5 (depends on attributor knowing the bet): **Attributor Contextualism**.
      *   If you answered **C** on Item 3 (Future Self) based on who is assessing: **Assessment-Sensitive Relativism**.
      *   *Diagnostic Note:* Distinguishing Contextualism from Relativism requires disagreement data not present here. If you chose **C** on both Item 5 and Item 3, you are in the **Context/Relativist Cluster**.

  ### Profile 4: The Contrastivist
  *   **Signature:** Answers **C** or **B** on Item 9. (Knowledge requires a contrast class).
  *   **Key Differentiator:** Item 9 is the sole discriminator. If you selected **B** ("No, knowledge is only relative...") or **C** ("Depends on which contrast"), you are a Contrastivist.
  *   **Sub-Diagnosis:**
      *   If you also answered **B** on Item 1: **Contrastivist Encroachment**.
      *   If you also answered **A** on Item 1: **Invariantist Contrastivism**.

  ### Profile 5: The Risk-Weighter (Credal/Cost)
  *   **Signature:** Answers **B** on Item 8, **B** on Item 10. (Probability and Cumulative Risk matter).
  *   **Key Differentiator:** Item 8 (Probability vs. Magnitude). If you said "No" because magnitude outweighs probability, you hold a **Cost-Weighted View**.
  *   **Sub-Diagnosis:**
      *   If you answered **B** on Item 4 (Epistemic Stakes): **Epistemic Utility Theory**.
      *   If you answered **A** on Item 4 but **B** on Item 8: **Practical Encroachment Only**.

