answer: |-
  **Exam Question**

  **Question 1**
  A research station of 100 people must survive 100 cold nights. Each night, they face a choice: run a generator or leave it off.
  *   **If run:** One person stands duty, suffering a burden valued at -10 (painful shift, lost sleep). The other 99 gain a benefit valued at +1 each (warmth).
  *   **If off:** Everyone receives 0.

  Consider two scenarios:
  1.  **One-Shot:** A decision is made for tonight only. The duty roster is not yet determined, but whoever is chosen bears the -10.
  2.  **Sequence:** A decision is made for all 100 nights in advance. A rota is established where each person stands duty exactly once and benefits 99 times.

  According to standard contractualism, complaints are assessed individually; the strength of one person's reason cannot be aggregated with another's. In the **One-Shot**, contractualism implies the generator should not be run, as the duty person's complaint (-10) outweighs any single beneficiary's complaint (+1), and the 99 complaints cannot be summed. In the **Sequence**, however, it seems permissible (or required) to run the generator, as everyone ends up with a net benefit (+89).

  Write an essay addressing the following:
  (a) Are the verdicts in the One-Shot and Sequence cases consistent? Explain the structural relationship between the two cases.
  (b) If they are consistent, justify why aggregation is permitted within a single life over time but not across lives. If they are inconsistent, which verdict must go?
  (c) Does the permissibility of the Sequence depend on deciding the rota in advance rather than night-by-night?
  (d) Briefly evaluate whether introducing uncertainty (not knowing who will be on duty) resolves the tension, and consider whether the distinction between lives holds if personal identity is not a "deep further fact."

  ***

  **Model Answer**

  The contractualist restriction on aggregation holds that a principle is rejectable if a single individual has a reasonable complaint against it that is stronger than any single individual's complaint against the alternative. We cannot sum the minor complaints of many to override the major complaint of one. In the **One-Shot** case, the duty person's burden (-10) outweighs any beneficiary's gain (+1). Since we cannot add the 99 gains together to outweigh the -10, the generator must not be run.

  The **Sequence** case presents a challenge because it is structurally identical to repeating the One-Shot 100 times. If the verdict differs (running the generator is permitted), contractualism appears inconsistent. However, the verdicts can be defended as consistent if we distinguish between *interpersonal* and *intrapersonal* aggregation. Contractualism forbids summing burdens across different people. It does not forbid summing burdens and benefits within a single life over time. In the Sequence, no individual suffers a net loss; each person incurs -10 once but gains +99. Because the burdens and benefits fall on the same subject, they can be weighed against each other. No single person has a reasonable complaint against the rota, as they are net better off.

  This distinction relies on the moral significance of personal identity. It is legitimate to aggregate within a life because there is a single subject of experience who bears the costs and reaps the rewards. The unity of consciousness allows for compensation over time that is impossible between distinct persons. To refuse intrapersonal aggregation would be costly: it would paralyze long-term planning, forbidding any policy where an individual bears a cost now for a later benefit, effectively reducing agents to momentary time-slices.

  Regarding framing, the permissibility should not depend on whether the choice is made night-by-night or as a block. If we decide night-by-night without a pre-commitment to a rota, we revert to the One-Shot logic each time, leading to a sub-optimal outcome where everyone freezes. Contractualism must allow for binding agreements or plans that change the justificatory context. The relevant comparison is not "run tonight vs. off tonight" but "accept the rota vs. no rota."

  A common but flawed move is to invoke uncertainty (a veil of ignorance). Arguing that everyone has an equal *chance* of being on duty does not solve the aggregation problem; it merely converts complaints into expected complaints. If aggregation is forbidden across persons, it is forbidden across expected outcomes for persons. Uncertainty makes the deal attractive ex ante, but it does not justify ignoring the actual complaint of the person actually on duty if the restriction is agent-relative.

  Finally, the distinction faces pressure if personal identity is reductionist. If a person is just a series of psychological connectedness relations, the difference between "one person over 100 nights" and "100 person-stages" is shallow. If the boundary between lives is not a deep further fact, forbidding interpersonal aggregation while allowing intrapersonal aggregation looks arbitrary. The contractualist might reply that the *practical* standpoint of deliberation requires treating ourselves as unified agents, even if metaphysically we are not. However, if this defense fails, contractualism risks collapsing into utilitarianism, as the only non-arbitrary stopping place for aggregation would be the sum of all experiences regardless of where they occur. Thus, the Sequence verdict is defensible only if the unity of the agent is morally significant, not just metaphysically convenient.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Contractualist Principle & One-Shot Verdict (5 marks)**
  *   **5:** Clearly states the non-aggregation constraint (comparisons are one-to-one) and correctly derives the "do not run" verdict for the One-Shot case.
  *   **3:** States the principle but applies it vaguely; or gets the verdict right but misstates the reason.
  *   **0:** Treats the case as a simple utilitarian calculation (summing the +1s) without addressing the contractualist constraint.
  *   *Common Error:* Claiming contractualism allows summing "small complaints" if there are enough of them.

  **2. Structural Identity & The Tension (5 marks)**
  *   **5:** Explicitly notes that the Sequence is just the One-Shot repeated with permuted identities; identifies this as the source of the philosophical tension.
  *   **3:** Notes the cases are related but fails to articulate why this creates a consistency problem for the theory.
  *   **0:** Treats the two cases as entirely unrelated scenarios.
  *   *Common Error:* Assuming the Sequence is different simply because "more people benefit," missing the permutation aspect.

  **3. Intra-life Aggregation & Justification (5 marks)**
  *   **5:** Defends the distinction between interpersonal (forbidden) and intrapersonal (permitted) aggregation; justifies it via the unity of the subject/life.
  *   **3:** Asserts the distinction is valid but offers no justification for why lives matter morally.
  *   **0:** Denies intrapersonal aggregation is allowed (making the Sequence impermissible) without discussing the costs.
  *   *Common Error:* Asserting "it's the same person" as a brute fact without explaining why that permits summation.

  **4. Framing & Description Sensitivity (5 marks)**
  *   **5:** Addresses whether night-by-night vs. block decision matters; argues that binding plans/rota change the justificatory scope.
  *   **3:** Acknowledges the issue but claims the verdict *should* change based on framing without justification.
  *   **0:** Ignores the framing question entirely.
  *   *Common Error:* Arguing that contractualism is inherently sensitive to description in a way that makes it irrational.

  **5. Advanced Critique: Uncertainty & Personal Identity (5 marks)**
  *   **5:** Correctly identifies that uncertainty/ex ante views do not solve the aggregation restriction; raises the reductionist challenge (if identity is shallow, does the distinction collapse?).
  *   **3:** Discusses uncertainty but fails to see it doesn't solve the core problem; or mentions identity but doesn't link it to aggregation.
  *   **0:** Claims uncertainty solves the problem completely.
  *   *Common Error:* Confusing "risk" with "aggregation," thinking equal risk legitimizes summing.

  **Distinction Criteria (A vs B)**
  *   **B Grade:** Hits criteria 1–4 competently. Explains the intra-life distinction clearly.
  *   **A Grade:** Secures full marks on Criterion 5. Specifically, an A answer recognizes that uncertainty is a red herring for the aggregation constraint and engages seriously with the metaphysical challenge of personal identity (reductionism) without collapsing into utilitarianism immediately.

  **Zero Mark Condition**
  *   Answers that ignore the contractualist framework entirely and argue purely from utilitarian maximization (e.g., "Always run the generator because 99 > 1") receive zero, as they fail to engage with the prompt's theoretical constraints.
