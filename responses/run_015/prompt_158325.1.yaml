answer: |-
  SUNBURY CITIZENS' CHAMBER
  MEMBER EXPERIENCE & INTEGRITY DIVISION

  **QUESTIONS NEWLY SELECTED MEMBERS ASK MOST OFTEN**

  Welcome to your term of service. The following protocols ensure your deliberation remains protected, balanced, and formally legible.

  **1. What if I have a scheduling conflict?**
  Your presence maintains the Chamber's demographic legibility, which is a formal property of the body. If you require an excused absence, a reserve member matched to your specific demographic profile will occupy your seat. This ensures the sample remains statistically valid and that no single absence unbalances the representation of the state.

  **2. What topics will we cover?**
  The Convening Panel sets all questions in their exact form. The Chamber may not add questions to the schedule. Please note that Matters of Reserved Competence, including taxation, treaties, and any budget line above the stated threshold, are withdrawn from our remit to protect you from undue complexity.

  **3. May I research the topics online?**
  All evidence arrives through the Official Briefing prepared by the Office of Neutral Framing. Members sign a Frame Integrity Undertaking not to consult outside material bearing on the question. This protects you from unvetted information and ensures all members weigh identical options pre-cleared for cost and feasibility.

  **4. Who are the expert witnesses?**
  Witnesses appear in matched pairs to ensure balance. Where no counter-witness exists, one is commissioned. If neither is possible, the testimony is designated Single-Testimony, and you will be instructed to weigh it with correspondingly reduced confidence to maintain epistemic equity.

  **5. What if I am already an expert?**
  To protect the ordinariness of the sample, members with professional expertise bearing on the question are recused from substantive participation. You will be reassigned to the Witness Liaison tier. This ensures the Chamber's findings reflect common sense rather than specialized interest or technical bias.

  **6. Can I run for office after serving?**
  Because sortition is meant to end careerism, a member may not stand for election for six years after service. This cooling-off period preserves the distinction between deliberative service and electoral ambition, ensuring your contributions remain focused on the public good rather than future campaigning.

  **7. How is my participation measured?**
  You will complete a values inventory at the opening and close of each question. Your Deliberative Integrity Score combines opinion movement, recorded as openness, with airtime equity and fidelity to Briefing material. This helps us identify members who may need additional facilitation support to fully engage with the process.

  **8. Can I yield my speaking time to others?**
  Speaking time is allocated per member and may not be yielded, pooled, or transferred. This strict allocation guarantees airtime equity across the Chamber. It ensures that every voice occupies the same sonic space, preventing dominant personalities from overshadowing quieter members during deliberation.

  **9. May I sit with people I know?**
  Tables are re-sorted weekly, and members may not sit with anyone they knew before selection. Furthermore, persuasion outside scheduled sessions is Prohibited Deliberative Contact. These measures protect the purity of the deliberative environment and ensure all consensus emerges solely from structured interaction within the Chamber.

  **10. What happens to our recommendations?**
  Recommendations go to the Convening Panel, which must respond in writing within twelve months. The Panel will issue one of three dispositions: accept, accept in part, or note. This structured response cycle ensures every recommendation receives formal consideration within the broader framework of state governance.

  **11. What opportunities exist after my term?**
  The Alumni Register and the Certified Deliberator credential permit former members to return as paid facilitators, briefing reviewers, or Civic Ambassadors. Attendance, recusals, and Deliberative Integrity Scores all bear on standing in the Register. This allows you to continue serving the civic infrastructure based on your proven performance.

  **12. What if the Briefing seems incorrect?**
  Suspected breaches of information protocol go to Frame Contamination Review. If you believe the Briefing material is compromised, you may file a report with the Office of Neutral Framing. This mechanism ensures the integrity of the evidence base remains intact throughout your eighteen-month cohort cycle.

  For further assistance, please contact the Member Experience Team.
