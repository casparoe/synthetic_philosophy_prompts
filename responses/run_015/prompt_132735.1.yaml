answer: |-
  This is a sharp observation. You have identified a specific rhetorical maneuver that is increasingly common in discussions about automation, post-scarcity, and UBI.

  There isn't a single, universally recognized term in formal logic or rhetoric that captures this *exact* sequence (Validate Diagnosis → Reject Prognosis → Justify Status Quo). However, it sits at the intersection of a few existing concepts. To give you the "carving" you asked for, we need to separate the *cultural condition* from the *logical move*.

  ### 1. The Cultural Context: Capitalist Realism
  The broad atmosphere you are describing is best covered by Mark Fisher's concept of **Capitalist Realism**. This is the pervasive sense that "it is easier to imagine the end of the world than the end of capitalism." In your example, the arguers exhibit capitalist realism by assuming that the *psychological structures* of capitalism (identity through labor) are immutable human nature, rather than historical adaptations.

  However, Capitalist Realism describes the *water we swim in*, not the specific *stroke* the swimmer is using. It doesn't capture the specific act of co-opting Keynes's own insight against his conclusion.

  ### 2. Why Existing Logical Terms Don't Quite Fit
  *   **The Naturalistic Fallacy:** This is close (deriving an "ought" from an "is"). They argue: "Humans *are* currently bad at leisure (is), therefore we *ought* to maintain work structures (ought)." But this misses the specific nuance of using the *original theorist's* diagnosis to do it.
  *   **Motte-and-Bailey:** As you noted, this isn't quite it. In a Motte-and-Bailey, the arguer retreats to a defensible position (the Motte) to protect an indefensible one (the Bailey). Here, they aren't retreating. They are advancing. They are using the defensible position (leisure is psychologically difficult) as a battering ram to destroy the original goal (the 15-hour workweek).
  *   **Status Quo Bias:** This is too broad. It describes the preference, not the argumentative mechanism.

  ### 3. A Proposed Coining: "Diagnostic Capture"
  For the rhetorical move you described, I propose the term **Diagnostic Capture**.

  **Definition:** Diagnostic Capture occurs when an arguer accepts an opponent's (or theorist's) *diagnosis* of a problem, but uses that acceptance to invalidate the proposed *solution*, ultimately reinforcing the system the theorist sought to transcend.

  **The Structure:**
  1.  **Theorist:** "System A causes Problem B. We should move to System C."
  2.  **Arguer:** "You are right that System A causes Problem B (specifically the psychological transition cost). In fact, Problem B is so severe that System C is impossible. Therefore, we must stay in System A."

  **How it differs from a Misreading:**
  A misreading ignores or distorts the theorist's point. Diagnostic Capture *validates* the theorist's insight (yes, leisure is hard) but treats a *transitional friction* as a *permanent structural constraint*.

  **How it differs from Motte-and-Bailey:**
  In Motte-and-Bailey, the arguer is usually being dishonest or evasive about their own position. In Diagnostic Capture, the arguer is often sincere. They genuinely believe the psychological difficulty is a hard limit. The "capture" is of the *framework*, not a retreat from a claim.

  ### 4. The Logical Error: "The Lag-as-Limit Fallacy"
  If "Diagnostic Capture" is the rhetorical name, the underlying logical error is **The Lag-as-Limit Fallacy** (or **Reifying the Transition**).

  This is the specific cognitive carve you are looking for. It involves mistaking an **adaptation lag** for a **biological limit**.

  *   **Keynes's View:** The psychological struggle with leisure is a *transition cost*. It is the pain of growing out of a scarcity mindset. It is temporary (in the grand historical scheme).
  *   **The Arguer's View:** The psychological struggle with leisure is a *fixed constraint*. It is human nature.

  By conflating the *lag* (our current inability to handle leisure because we are conditioned for work) with the *limit* (an inherent inability to handle leisure), the arguer justifies the permanence of the very conditioning that created the lag. It is a self-sealing argument: "We can't stop working because we are addicted to work, therefore we must keep working."

  ### Summary of the Carving
  To distinguish this from general pessimism or political co-option, look for these three markers:

  1.  **Validation of the Symptom:** They agree with the critique of the *future* state (leisure is alienating/scary).
  2.  **Reification of the Condition:** They treat the current psychological conditioning (work ethic) as immutable biology rather than historical habit.
  3.  **Therapeutic Justification:** They frame the maintenance of the status quo (work culture) not as an economic necessity, but as a *psychological protection* for the worker. (e.g., "People *need* jobs for their dignity," used to argue against UBI or shorter weeks).

  **Diagnostic Capture** is the move; **The Lag-as-Limit Fallacy** is the error. Together, they describe the process of using a map of the transition to argue that the destination doesn't exist.
