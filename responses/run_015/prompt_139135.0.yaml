prompt: |-
  i'm doing a philosophy of mind paper this semester and also working as a TA for a first-year logic course, and the two things have kind of collided on me now that it's exam season. We did the extended mind stuff — the famous thought experiment where one person remembers the museum address in her head and the other has to check a notebook he always carries — and my prof's line in the lecture was that the thesis is either trivial or obviously false, and that university exam rules are a good way to tell which. I think she's being too quick but I can't say exactly why, which is what I want help with.

  Here's the practice, as concretely as I can give it. In the course I TA, students may bring a non-programmable calculator but not a phone, even though the phone contains a calculator that does strictly more and is arguably more reliable. They may bring one handwritten A4 sheet of notes, but under the rule as it was rewritten last year the sheet has to be "continuously available and actually relied on for the majority of study sessions for that paper" — so a sheet you made in week two and used all term is fine, a identical sheet printed out the night before is a breach, and a classmate who happens to be standing in the corridor is a breach no matter how many hours you spent revising with them. Meanwhile the disability office will approve a screen reader, a spellchecker, or a human scribe for students with dyslexia, but the same essay written with a grammar-and-rewrite tool switched on is academic misconduct, and so is paying a friend to proofread it. So: same computation, same output, wildly different treatment, and the differences don't seem to track how much thinking the tool is doing for you.

  What I want is the implicit theory. What does this rulebook presuppose about where a person's cognition stops — is it that the permitted aids have been reliably available, easily accessible and automatically trusted over time, roughly the conditions the reading talks about, or is it something else entirely, like a view about credit or about who deserves praise for the answer? Which rival views does it quietly rule out: does it rule out the skull-and-skin view, or does it instead rule out the really permissive view on which any external process you're coupled with is part of you? Are the parts even consistent with each other — the scribe case and the software case look identical to me from the outside, and the calculator/phone distinction can't be about computation — and where is the practice just philosophically underdetermined, so that several quite different theories would license exactly the same rules? And finally, what would actually have to change if a department took the extended view seriously: does a closed-book exam start to look less like a fair test and more like inducing a temporary disability, or does the whole thing collapse the other way, into nothing being bannable at all? I'd especially like to know how much of the metaphysics the rules are really committed to, versus how much is only loosely compatible with them, since that's the bit I'd need before I try arguing back in tutorial.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a TA for a first-year logic course and a student in a Philosophy of Mind course.
      *   **Topic:** The Extended Mind Thesis (EMT), specifically the Clark & Chalmers "Otto and Inga" thought experiment.
      *   **Conflict:** The user's Philosophy of Mind professor dismissed EMT as "trivial or obviously false" using university exam rules as a litmus test. The user suspects this is too quick but needs help articulating *why*.
      *   **Evidence:** The user provides detailed examples of current university assessment policies (calculators vs. phones, handwritten notes rules, disability accommodations vs. AI tools, scribes vs. proofreading).
      *   **Goal:** The user wants to uncover the *implicit theory* of cognition behind these rules. They want to know:
          *   What theory of mind do the rules presuppose?
          *   Do they track EMT conditions (availability, trust, accessibility)?
          *   Do they track credit/praise?
          *   Which rival views (internalism vs. radical externalism) do they rule out?
          *   Are the rules consistent?
          *   What would change if the department took EMT seriously?
          *   How much metaphysics are the rules *committed* to vs. just *compatible* with?
      *   **Tone:** Philosophical, analytical, nuanced, helpful for a tutorial discussion/paper.

  2.  **Deconstruct the Professor's Claim:**
      *   *Claim:* Exam rules show EMT is trivial or false.
      *   *Logic:* If notebooks were part of the mind, banning them (or restricting them) would be like banning a part of your brain. Since we ban/restrict them, they aren't part of the mind.
      *   *Counter-logic:* Exam rules aren't metaphysical tests; they are epistemic/ethical assessments of *credit* and *fairness*.

  3.  **Analyze the User's Examples (The "Data"):**
      *   *Calculator vs. Phone:* Same computation. Phone banned. Why? Distraction potential, hidden functions, not "transparent" enough?
      *   *Handwritten Notes (Week 2 vs. Night Before):* Same physical object. Different history. Why? The *process* of creation matters (encoding), not just the *access* to information.
      *   *Classmate in Corridor vs. Notes:* Social externalism? Banned. Why? Real-time outsourcing vs. stored resource.
      *   *Scribe (Disability) vs. AI/Proofreader:* Same output. Scribe allowed (for some), AI banned. Why? Agency, authorship, fairness relative to "normal" cognition.

  4.  **Develop the Philosophical Framework:**
      *   **EMT (Clark & Chalmers):** Parity Principle. If a process in the head counts as cognitive, a process outside should too, *if* it meets functional criteria (Availability, Accessibility, Trust/Automatic Endorsement).
      *   **Internalism (Skull/Skin):** Cognition stops at the boundary.
      *   **Transactive Memory/Extended Cognition (Social):** Cognition distributed among people.
      *   **Epistemic Credit/Responsibility:** Who gets the credit for the knowledge? (Greco, Sosa).
      *   **Fairness/Standardization:** Exams measure specific skills, not just outcomes.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's intuition. The professor's move is a category error (metaphysics vs. normative assessment).
      *   **The Implicit Theory (What do the rules actually track?):**
          *   It's not *where* the cognition is (metaphysics).
          *   It *is* about **Epistemic Credit** and **Skill Demonstration**.
          *   The "Week 2 vs. Night Before" note rule is crucial. It shows the value is in the *encoding process* (internalizing), not just the *storage*. This actually aligns with EMT's "glue and trust" but adds a *history* condition EMT sometimes ignores.
      *   **Consistency Check:**
          *   Calculator vs. Phone: Consistent if the goal is minimizing distraction/cheating surface area, not metaphysics.
          *   Scribe vs. AI: This is the hardest one. It reveals the rules are about *accommodating deficits* to reach a baseline, not *enhancing* beyond it. This is a normative distinction, not a metaphysical one.
      *   **Ruling Out Rivals:**
          *   Does it rule out Internalism? No. Internalism can explain rules as "preventing cheating."
          *   Does it rule out Radical Externalism? Yes. You can't bring your friend (social externalism) into the exam.
          *   *Key Insight:* The rules are compatible with EMT *metaphysically* but reject it *normatively*. Just because the notebook *is* part of your mind doesn't mean you should be allowed to use it to test *memory*.
      *   **What if we took EMT Seriously?**
          *   Exams wouldn't vanish. They would change *what they measure*.
          *   Closed book = Testing biological memory.
          *   Open book = Testing information management/retrieval (extended cognition).
          *   The professor's claim that EMT makes exams impossible is false; it just makes *certain kinds* of exams measure different things.
      *   **Metaphysical Commitment vs. Compatibility:**
          *   This is the crux. The rules are *underdetermined*. They don't prove internalism. They prove the university cares about *standardized conditions for credit attribution*.
      *   **Tutorial Strategy:** How to argue back. Focus on the distinction between *constitutive claims* (what is the mind?) and *normative claims* (what should we assess?).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "Professor is wrong." I need to show *why* the exam rule argument fails as a metaphysical disproof.
      *   *Nuance:* The "Week 2 note" rule is fascinating. It implies a *coupling history* requirement. Clark & Chalmers talk about "constant availability," but this rule adds "historical integration." This is a strong point for the user's paper.
      *   *Disability:* Be careful here. The scribe is a *prosthetic* to restore function, not an *enhancement*. AI is seen as enhancement. This tracks the "species-typical functioning" line (Daniels), not necessarily the mind boundary.

  7.  **Final Polish:**
      *   Structure with clear headings.
      *   Use philosophical terminology (Parity Principle, Epistemic Credit, Normative vs. Descriptive).
      *   Keep the tone supportive of the TA's position (it's a good insight) while giving them the tools to critique it rigorously.

  8.  *(Final check against user prompt)*: Did I answer the specific questions?
      *   Implicit theory? Yes (Credit/Skill).
      *   Conditions (availability/trust)? Yes, plus history.
      *   Rival views ruled out? Yes (Radical social externalism).
      *   Consistency? Yes (mostly, regarding enhancement vs. restoration).
      *   What would change? Yes (Shift in assessment goals).
      *   Metaphysics commitment? Yes (Underdetermined).

  9.  **Constructing the Output.** (Proceed to write the response based on these thoughts.)
answer: |-
  This is a fantastic collision of your two roles. Your intuition is correct: your professor is making a category error. She is treating **normative rules of assessment** (what we *allow* for the purpose of grading) as if they were **metaphysical tests** (what *constitutes* a mind).

  The exam rules do not prove Internalism (the view that cognition stops at the skin). They prove that universities care about **Epistemic Credit** and **Standardized Skill Demonstration**.

  Here is a breakdown of the implicit theory behind the rulebook, how it interacts with the Extended Mind Thesis (EMT), and how you can use this in your tutorial and paper.

  ### 1. The Implicit Theory: Credit, Not Cognition
  The rulebook presupposes a theory of **Epistemic Credit**, not a theory of **Cognitive Boundaries**.

  When the university says, "You can use the calculator but not the phone," it is not making a claim about where the calculation happens. It is making a claim about **what skill is being tested**.
  *   **Logic Exam:** Tests logical derivation. A calculator is a tool for arithmetic, which is distinct from logic. A phone is a communication device that introduces noise (distraction) and hidden functions (cheating).
  *   **The Note Sheet Rule:** This is your strongest evidence. The rule that the sheet must be "continuously available and relied on for the majority of study sessions" is fascinating. It implies that the *value* lies in the **process of integration**, not just the **state of access**.
      *   **EMT View:** If the notebook is functionally integrated (trust, access, availability), it is part of the mind.
      *   **Exam Rule View:** The notebook is only valid if you have a *history* of coupling with it.
      *   **Implication:** The rules actually track something *stricter* than Clark & Chalmers' original "glue and trust" conditions. They require **historical coupling**. A sheet printed the night before is functionally identical to one used all term, but epistemically different. The rule values the *encoding* process (the studying) over the *storage* location.

  **Conclusion:** The rules assume that credit is deserved only when the external resource is a transparent extension of the student's *prior effort*, not a shortcut to bypass that effort.

  ### 2. Consistency and the "Scribe vs. AI" Problem
  You noted that a human scribe (for dyslexia) and a grammar/rewrite tool look identical from the outside (output is improved), yet one is allowed and one is misconduct.

  *   **The Metaphysical View:** If EMT is true, both are external cognitive processes. Both should be treated the same.
  *   **The Normative View:** The distinction is **Restoration vs. Enhancement**.
      *   **Scribe:** Viewed as a prosthetic to restore "species-typical functioning." It bridges a gap to the baseline.
      *   **AI/Proofreader:** Viewed as an enhancement above the baseline.
      *   **Friend in Corridor:** Viewed as **Social Externalism**. This is banned because it breaks the **Individual Attribution** condition. Exams are designed to measure *individual* competence. If you consult a friend, the cognitive load is distributed, and we can no longer attribute the output solely to you.

  **Is it consistent?** Yes, but only if you accept that the goal of the exam is to measure *individual, baseline competence*, not *maximum cognitive output*. The rules are consistent with a "Fairness as Equality of Opportunity" model, not a "Fairness as Equality of Cognitive Architecture" model.

  ### 3. Which Rival Views Are Ruled Out?
  The rulebook does **not** rule out Internalism. An Internalist can easily say: "The notebook isn't part of your mind, so we restrict it to test your biological memory."

  However, the rules **do** quietly rule out **Radical Externalism** (the view that *any* coupled process is part of the mind).
  *   If the "friend in the corridor" were truly part of your cognitive system (like Otto's notebook), banning them would be like gagging a part of your brain.
  *   By banning the friend, the university asserts a **Boundary of Agency**. They are saying: "For the purpose of this credential, the cognitive unit is the *individual human*, not the *human-plus-environment*."

  **Crucial Distinction:** This doesn't prove the Radical Externalist is *metaphysically* wrong. It proves they are *administratively* inconvenient. The university is defining the "unit of assessment" as the biological organism, regardless of where the "unit of cognition" actually lies.

  ### 4. What If We Took EMT Seriously?
  If a department took EMT seriously, exams wouldn't collapse; they would **shift targets**.

  *   **Current Model (Internalist-leaning):** Closed book exams test biological memory and internal processing speed. Open book exams test information retrieval.
  *   **EMT Model:** If the notebook is part of the mind, a closed-book exam is effectively **inducing a temporary disability**. It is asking Otto to perform without his hippocampus.
  *   **The Change:** An EMT-consistent department wouldn't ban notebooks. Instead, they would acknowledge that **different students have different cognitive architectures**.
      *   Student A has high biological memory.
      *   Student B has high external memory management (notebooks, apps).
      *   **Fairness:** To test "philosophical understanding" fairly, you should allow both to use their preferred architecture. Banning the notebook privileges biological memory over extended memory, which is an arbitrary bias if cognition is indeed extended.

  **Does it mean nothing is bannable?** No. You can still ban phones for the same reason you ban shouting in an exam hall: **Interference**. If your external cognition (phone) interferes with my external cognition (my focus), it can be banned. But banning the *notebook* specifically becomes harder to justify metaphysically.

  ### 5. Metaphysical Commitment vs. Compatibility
  This is the point you need for your tutorial. The exam rules are **metaphysically underdetermined**.

  *   **Compatible with Internalism:** "We ban notebooks because they aren't part of you."
  *   **Compatible with EMT:** "We ban notebooks because we want to test biological memory specifically, not extended memory."
  *   **Compatible with Pragmatism:** "We ban notebooks because marking would be impossible if everyone had different data sets."

  The rules are **not committed** to Internalism. They are only committed to **Standardization**.
  Your professor's claim ("Exam rules show EMT is false") relies on the premise: *If X were part of the mind, we would never restrict X.*
  **Counter-premise:** We restrict parts of the mind all the time. We drug people (anesthesia) to stop their minds from feeling pain during surgery. We gag witnesses to stop them from speaking. Restricting a resource doesn't prove it isn't cognitive; it proves we want to control the conditions of the test.

  ### 6. How to Argue This in Tutorial
  Here is a strategy for pushing back against the professor's "trivial or false" claim using your TA experience:

  1.  **Challenge the Inference:** "Professor, you argue that because exam rules restrict notebooks, notebooks aren't part of the mind. But exam rules also restrict sleeping, standing up, or talking. Does restricting sleeping prove that consciousness isn't part of the mind? No, it proves we are standardizing the *conditions of performance*, not defining the *boundaries of the self*."
  2.  **Highlight the 'History' Condition:** "The rule about the note sheet requiring 'continuous availability' suggests the university values the *history of coupling*, not just the functional access. This actually supports a more nuanced version of EMT (like Sutton's 'integrative pluralism') rather than refuting it. It suggests cognition isn't just about where the data is, but how deeply the tool is integrated into the agent's history."
  3.  **The Disability Analogy:** "If we accept screen readers for dyslexia, we admit that 'normal' cognition includes tools. If we ban those same tools for non-dyslexic students, we aren't making a metaphysical claim about where their mind ends; we are making a normative claim about what counts as 'unassisted' performance. EMT challenges the idea that 'unassisted' means 'biological,' but it doesn't make assessment impossible—it just requires us to be honest about what we are measuring."

  ### Summary for your Paper
  The exam rules do not refute the Extended Mind Thesis. They reveal that our **social practices of credit attribution** lag behind our **metaphysical understanding of cognition**.

  The rules presuppose that **credit belongs to the biological individual**, even if **cognition belongs to the system**. This creates a tension: we are assessing individuals as if they were internalists, in a world where they increasingly function as externalists. The professor is mistaking a policy decision (we want to grade individuals) for a metaphysical discovery (individuals are cognitively closed).

  Your TA experience provides the empirical data to show that the "trivial or false" dilemma is a false dichotomy. The rules are neither trivial nor false; they are **pragmatically necessary but metaphysically neutral**.
