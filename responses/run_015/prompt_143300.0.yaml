prompt: |-
  I'm on the executive committee of a scientific society — about 3,000 members — and every couple of years we put out an official position statement on some contested question in the field (does effect X replicate, is technique Y safe at scale, should regulators treat Z as settled). Right now a 12-person elected council ratifies it's wording by simple majority, and the chair breaks ties. Two motions are on the floor for the AGM, which is in three weeks, and I have to circulate the committee's one-page recommendation by Friday.

  Motion A, from a group of members: put every statement to an online vote of the whole membership — a two-week comment thread first so people can see each other's arguments, then a simple majority of whoever turns up. Their argument is basically the Condorcet jury theorem: lots of roughly independent voters, each a bit better than chance, and the majority ends up very likely to be right.

  Motion B, from our treasurer, who's worried about reputational damage: keep it with the council but require two-thirds.

  Some things I've noticed that I want the memo to actually deal with.

  First, we're 12 — an even number. If ties are broken by a coin flip, I think a 12-person council is exactly as reliable as an 11-person one; I checked it on toy cases (1 vs 2, and 3 vs 4, both came out identical when everyone's reliability is 0.6) but I can't prove it in general. If that's right, the 12th vote is worth nothing and we should either go to 11 or change the tie rule. Is defaulting to "we issue no statement" better than the chair's casting vote, and does that depend on what fraction of proposed statements are true in the first place?

  Second, the comment thread. If everyone reads the same three loud people before voting, we don't have 3,000 independent votes, we have fewer — and I've been told that once votes are correlated the majority stops converging on the truth at all and plateaus somewhere below 1, which would take the legs out of motion A entirely. But the obvious reply is that our 12-person council is far more correlated than the membership: they've been in the same room for three years.

  Third, and this is the bit that actually worries me: on a specialist question most of our members are in subfields that have nothing to do with it, so the average member's reliability might be near chance or below it — and if it's below, the same theorem says a bigger electorate makes us worse, not better. I have no idea which side of 0.5 we're on, and we have no track record of scoring our own statements against what later happened, so no one can honestly say. What do you do with a decision rule when you can't tell whether it's helping or hurting?

  Fourth, one of our committee members — she's an econometrician — says the simple-majority framing is wrong anyway: if votes are independent, the right rule weights each person by the log-odds of their being right, and a few hundred members who are each only marginally better than a coin flip will beat twelve experts under it. She wants self-reported expertise added as a weighting to the online vote. I don't know if the weighting claim is right, and I definately don't know how anyone would report their own expertise honestly.

  Fifth, our statements come in two parts: a factual bit (does the effect replicate) and a recommendation bit (so here's what practitioners and regulators should do). The jury-theorem reasoning seems to touch only the first part, and I suspect that's where the two-thirds rule really belongs, if it belongs anywhere — but I also suspect the threshold ought to fall out of the base rate of statements being right and how much worse a false statement is than silence, rather than from a round number somebody liked.

  What I need is the memo: a position on each motion (adopt, reject, adopt with conditions), what we do at the AGM in three weeks, what we do over the next year instead — pilot something? record votes before the comment thread opens and compare them to the post-deliberation ones? split each statement into two separate votes? drop to 11 members and fix the tie rule? — and reasons our members could actually argue with rather than just nod at. Please be straight about the strongest argument for whichever motion you're telling us to reject; the referendum people will be in the room and they're not stupid. If it helps you put numbers on any of this, assume a decent specialist is right about 60% of the time on these questions.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Executive Committee Member of a scientific society (~3,000 members).
      *   **Task:** Write a one-page recommendation memo to the committee regarding two motions at the upcoming AGM (in 3 weeks).
      *   **Deadline:** Friday (implies urgency and need for clarity).
      *   **Context:** The society issues position statements on contested scientific questions. Currently, a 12-person council ratifies by simple majority (chair breaks ties).
      *   **Motions:**
          *   Motion A (Members): Online vote of whole membership (2-week comment thread + simple majority). Argument: Condorcet Jury Theorem (CJT).
          *   Motion B (Treasurer): Keep council vote but require 2/3 majority. Argument: Risk management/Reputation.
      *   **Key Issues to Address:**
          1.  *Council Size/Tie-Breaking:* Is a 12-person council with chair tie-break equivalent to 11? Is "no statement" better than chair vote? Dependence on base rate?
          2.  *Independence/Correlation:* Does the comment thread destroy independence (herding)? Is the council *more* correlated than the membership?
          3.  *Competence:* Are members >0.5 reliable? If <0.5, CJT makes things worse. Subfield mismatch.
          4.  *Weighting:* Econometrician's claim (log-odds weighting). Feasibility of self-reported expertise.
          5.  *Fact vs. Policy:* Distinguish factual claims (replication) from recommendations (regulation). Different thresholds?
      *   **Requirements:** Take a position on each motion (Adopt/Reject/Modify), propose immediate AGM strategy, propose next-year pilots/studies, address counter-arguments honestly (especially Motion A proponents), use numbers if helpful (assume specialist $p=0.6$).
      *   **Tone:** Professional, analytical, decisive, persuasive but acknowledging uncertainty.

  2.  **Deconstruct the Mathematical/Logical Problems:**

      *   *Issue 1: 12 vs. 11 Members.*
          *   Standard result: If $N$ is even and ties are broken by a coin flip (or fixed chair vote with $p=0.5$ reliability on the tie), the reliability is exactly the same as $N-1$.
          *   Why? Let $P(N, k)$ be prob of $k$ successes in $N$ trials. A tie in 12 means 6-6. The chair decides. If chair is random ($0.5$), the tie contributes $0.5 \times P(12, 6)$. In an 11-person council, a 6-5 majority wins. A 5-6 loss loses. The math works out such that $Reliability(2n, \text{coin tie}) = Reliability(2n-1)$.
          *   *Implication:* The 12th seat adds no value under current rules.
          *   *Default to "No Statement":* This is a status quo bias. If false positives are costly (reputation), "no statement" is safer than a coin flip. If false negatives are costly (leadership vacuum), coin flip might be better. Given the Treasurer's concern, "no statement" on ties is likely safer for reputation.
      *   *Issue 2: Independence & Deliberation.*
          *   CJT requires independence. A comment thread *induces* correlation (herding on loud voices). This weakens CJT.
          *   However, the Council is *highly* correlated (same room, same social dynamics).
          *   *Comparison:* 3,000 members with moderate correlation vs. 12 members with high correlation. The "effective sample size" of the membership might still be larger, *provided* competence > 0.5.
      *   *Issue 3: Competence ($p$).*
          *   This is the killer. If average member $p < 0.5$, CJT says larger $N \to$ certainty in wrong answer.
          *   Scientific society members are likely $p > 0.5$ on *general* field issues, but maybe $p \approx 0.5$ on specific subfield controversies.
          *   *Mitigation:* Restrict voting to relevant subfields? Or rely on the fact that even non-experts in the field are better than laypeople ($p > 0.5$).
      *   *Issue 4: Weighting.*
          *   Optimal weighting is indeed log-odds ($\ln(p/(1-p))$).
          *   Self-reporting is garbage (Dunning-Kruger).
          *   *Proxy:* Membership seniority? Publication record? Too invasive for a vote.
          *   *Conclusion:* Weighting is theoretically sound but practically unimplementable without bias. Simple majority is robust if $p$ is uniform.
      *   *Issue 5: Fact vs. Policy.*
          *   Fact: Truth-seeking (CJT applies).
          *   Policy: Value judgment (CJT less relevant, legitimacy matters more).
          *   Thresholds: 2/3 makes sense for high-stakes policy to ensure broad consensus, reducing reputational risk.

  3.  **Formulate Recommendations:**

      *   *Motion A (Online Vote):* **Reject (for now).** Risk of $p < 0.5$ in subfields + correlation from comment thread is too high. *However*, acknowledge the legitimacy deficit of the Council.
      *   *Motion B (2/3 Council):* **Adopt with Modification.** 2/3 is good for risk management. But fix the 12-person inefficiency.
      *   *Immediate AGM Strategy:* Vote against A, Vote for modified B.
      *   *Next Year Plan:* Pilot a hybrid. Separate Fact/Policy. Fix Council size/tie rule. Test competence.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** Clear stance.
      *   **Analysis of Motion A (The Membership Vote):**
          *   Acknowledge CJT strength.
          *   Hit the weakness: Competence ($p$). If $p < 0.5$, democracy fails. Subfield issue is real.
          *   Hit the second weakness: Correlation. Comment threads create herding.
          *   Concession: Council is also correlated.
          *   Verdict: Too risky without safeguards.
      *   **Analysis of Motion B (2/3 Council):**
          *   Good for reputation (reduces false positives).
          *   Math check: 12 members + tie break = 11 effective. 2/3 of 12 is 8 votes.
          *   Verdict: Adopt, but fix the council structure.
      *   **The "12th Member" Problem:**
          *   Confirm the user's intuition. 12 + coin flip = 11.
          *   Recommendation: Reduce to 11 or change tie-break to "motion fails." Given reputation concerns, "motion fails" is better.
      *   **Fact vs. Policy:**
          *   Split the vote. Facts need truth (majority). Policy needs consensus (supermajority).
      *   **Action Plan:**
          *   AGM: Oppose A, Support Modified B.
          *   Year 1: Pilot "Fact/Policy" split. Track outcomes (retrospective scoring).
          *   Governance: Amend bylaws to 11 members or "tie = fail."

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Critique of Rejection A:* I need to be fair to Motion A proponents. They are right that 12 insiders are correlated. I should admit that. But the competence issue is the trump card.
      *   *Weighting:* Dismiss the econometrician's idea gently. Self-reporting is invalid.
      *   *Numbers:* Use the $p=0.6$ assumption.
          *   Council (11 effective): Prob(majority right) is high.
          *   Membership (3000): If $p=0.6$, prob is ~1. If $p=0.5$, prob is 0.5. If $p=0.4$, prob is ~0.
          *   The variance in $p$ across subfields is the risk.
      *   *Tie-Break:* If the Chair breaks ties, is the Chair independent? Usually no. If Chair votes with bias, it's not a coin flip. But if we assume Chair is just another voter, 12 voters with a designated tie-breaker is mathematically equivalent to 11 voters where the 12th only votes on 6-6 ties. If the Chair is *also* $p=0.6$, then 12 voters is better than 11. Wait, let's re-verify the user's premise.
      *   *Re-verifying 12 vs 11:*
          *   Case: 3 voters ($p=0.6$). Majority wins. Prob = $0.6^3 + 3(0.6^2)(0.4) = 0.216 + 0.432 = 0.648$.
          *   Case: 4 voters ($p=0.6$). Tie (2-2) happens with prob $6(0.6^2)(0.4^2) = 0.3456$.
          *   If tie broken by coin flip ($0.5$): Total Prob = (Prob 3 or 4 right) + 0.5 * (Prob 2 right).
          *   Prob 3 or 4 right = $4(0.6^3)(0.4) + 0.6^4 = 0.3456 + 0.1296 = 0.4752$.
          *   Total = $0.4752 + 0.5(0.3456) = 0.4752 + 0.1728 = 0.648$.
          *   **Yes, the user is correct.** 4 voters with coin-flip tie-break = 3 voters.
          *   *Implication:* The 12th seat is wasted unless the Chair is *more* reliable than chance or the tie rule is "fail."
      *   *Recommendation:* Change tie rule to "Statement Fails." This increases the threshold effectively, aligning with Treasurer's risk aversion.

  6.  **Final Polish:**

      *   Ensure tone is appropriate for an Exec Committee (collegial but firm).
      *   Check length (needs to be roughly "one-page recommendation" style, though I can provide the full text).
      *   Make sure the "Strongest Argument for Motion A" is clearly stated so the user can defend against it.

  7.  **Final Review against constraints:**
      *   Address all 5 points? Yes.
      *   Position on motions? Yes.
      *   AGM plan? Yes.
      *   Next year plan? Yes.
      *   Numbers included? Yes.
      *   Honest about counter-arguments? Yes.

  *(Self-Correction during drafting)*: I initially thought about suggesting weighting by publication count. No, that's too controversial for a memo. Stick to "self-reporting is invalid."
  Make sure to emphasize the Fact vs. Policy distinction. That's a strong middle ground.

