prompt: |-
  I'm a high school senior and I got really into philosophy of math lately (yeah I know, weird for a hs student). We're doing a unit on platonism vs nominalism — platonists say numbers are real abstract objects, nominalists say they're just useful ways of talking about collections or symbols — and my teacher handed out a xeroxed page from Frege's 1884 book The Foundations of Arithmetic (the English translation I have is the 1950 one by J. L. Austin, page 73). Right before the part I'm stuck on, Frege asks how numbers could be given to us if we have no ideas or intuitions of them (I'm paraphrasing that bit cause I don't wanna mess up the exact wording), and then he says:

  "Nur im Zusammenhange eines Satzes bedeuten die Wörter etwas. Es wird also darauf ankommen, den Sinn eines Satzes zu erklären, in dem ein Zahlwort vorkommt."

  The translation in my copy is:

  "Since it is only in the context of a proposition that words have any meaning, our problem becomes this: To define the sense of a proposition in which a number-word occurs."

  Me and my friend Dan were argueing about this and we came up with our own kinda niche idea to make sense of it, which we jokingly call 'propositional role nominalism with platonist truthmakers' (PRNPT for short, lol). The idea is that numbers aren't objects (so nominalism is right that there's no spooky abstract thing '2'), but the truth of number-statements still depends on something objective: the semantic role that a number-word plays inside whole propositions, together with the concept's having a mind-independent extension. Dan thinks Frege's move here is basically an early version of PRNPT, because Frege refuses to ask for the meaning of a number-word in isolation and instead says we should define the sense of a whole proposition containing it. But I'm definately not sure that's right: it looks to me like Frege might be using the context principle as a ladder to get to numbers as objects after all, maybe by later defining them via equinumerosity (the idea that the number of Fs equals the number of Gs when the Fs and Gs can be paired one-to-one, sometimes called Hume's Principle), which would push him back toward platonism. So I'm confused about whether this passage supports Dan's PRNPT reading, whether it actually backs platonism, or whether it's neutral between platonism and nominalism.

  Can you help me understand what Frege is actually doing in this passage? Specifically: how does the claim that words only have meaning in the context of a proposition answer the question of how numbers are given to us? Does his move of defining the sense of a proposition in which a number-word occurs mean we never have to give a direct definition of a number, or is it a strategy for defining numbers as objects by looking at when two concepts have the same number? And how would a nominalist read this passage compared to a platonist? Also, my teacher wants us to be self-critical, so please say how committed you are to that reading, how confident you are in your interpretation, what would change your mind (which argument or consideration would lead you to a different verdict about whether this passage is platonist, nominalist, or neither?), and where your reasoning is most likely to fail (for example, are you relying on a contested translation, or assuming later Fregean machinery like Hume's Principle is already in the background?).
