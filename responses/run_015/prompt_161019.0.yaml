prompt: |-
  I write novels, and I've got a chapter that won't move, so I'm hoping a short story will shake it loose. It's a side-quarrel with something I keep circling: the boundary problem, who gets to count as the people who get to decide.

  What I want, in practical terms: a reader who's never thought about democratic theory should finish it feeling sick about a specific machine, and a reader who has thought about it should be able to name exactly what the machine does. Nobody in the story says demos, or franchise, or representation, or gives any version of the little speech. No narrator explaining either.

  The setup I've half built, steal it or change it: a walled salt-marsh city. Its charter fixes the voting roll once a year — whoever is asleep inside the sea-wall on the night of the new year counts as a citizen for the year following. Out on the tidal flats beyond the wall there are stilt hamlets, a couple thousand people. The city's sluices and the wall itself decide when the flats flood, so those people are pushed around by the city constantly and can't vote on any of it. Then a measure goes to the city vote: extend the wall outward, enclose the flats, drain them. It would stop the stilt houses washing away and it would destroy the tidal fishery they live on, and it would also put them inside the wall — i.e., on the roll.

  Heres the part I can't get right, and probably the reason the chapter is stuck. It's a measure that can only pass under the franchise that passing it destroys. The city votes yes partly because the reclaimed land is worth money and partly because everyone can already see what happens next: the new voters immediately vote to breach the wall and let the tides back, which puts them outside the city again, which takes them off the roll, which lets the city vote the enclosure back in. A pump, swinging every couple of years. And the thing I think is the cruel part, which should be felt and not stated: those two thousand only ever get a vote on undoing what was just done to them, never on what's about to be done.

  Don't resolve it. End at or just before the second vote, with whoever keeps the tide-register holding the pen — and make her neither hero nor villain. Both of the obvious tests for who should count, everyone affected and everyone subject to the law, should look genuinely attractive here and both should break on this case, as consequence rather than as argument. Please don't let it turn into a Brexit story or a voter-ID story or a gerrymandering story; I've read all of those and they flatten it into something I already know. Around 1500 words, and it has to work for someone who hasn't read the novel, so no info-dumping about how the city runs — get it in through the cracks. Just the story, no notes after, no explanation of what it means. I've been chewing on this for like a week and its driving me nuts.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Write a short story (approx. 1500 words) to unstick a novel chapter.
      *   **Theme:** The boundary problem in democratic theory (who counts as "the people").
      *   **Audience:** Two types: 1) Layperson (feel sick about the machine), 2) Theory-savvy (name exactly what the machine does).
      *   **Constraints:**
          *   No jargon (demos, franchise, representation, etc.).
          *   No narrator explaining the theory.
          *   Don't resolve the conflict.
          *   End at or just before the second vote.
          *   Protagonist: The tide-register keeper (neither hero nor villain).
          *   Setting: Walled salt-marsh city, stilt hamlets outside, annual citizenship based on sleep inside the wall on New Year's.
          *   Plot: City votes to extend wall (enclose flats). This gives flats-people citizenship. They will vote to breach wall (restore fishery/flood), putting them outside again (losing citizenship). City votes to enclose again. Cycle.
          *   Core Cruelty: The outsiders only vote on undoing what was done, never on what's about to be done.
          *   Tone: Neither Brexit nor Voter ID nor Gerrymandering. Needs to feel unique, systemic, inevitable.
          *   Length: Around 1500 words.
          *   Format: Just the story, no notes/explanation.

  2.  **Deconstruct the Core Mechanism:**
      *   *The Rule:* Sleep inside the wall on New Year's Eve = Citizen for the year.
      *   *The Project:* Extend wall -> Enclose flats -> Flats people become citizens.
      *   *The Consequence:* Flats people vote to breach wall -> Flats flood -> Flats people forced out (or choose to leave due to fishery loss? No, the prompt says "breach the wall and let the tides back, which puts them outside the city again").
      *   *The Loop:* Enclose (City votes) -> Include (New Citizens) -> Breach (New Citizens vote) -> Exclude (Old Status) -> Enclose (City votes).
      *   *The Cruelty:* They only vote on the *reaction*, never the *action*. They are objects of the first vote, subjects of the second.

  3.  **Character & Perspective:**
      *   **Protagonist:** The tide-register keeper. Let's call her Elara or something similar. She holds the pen. She records who is in, who is out, the water levels, the votes. She is bureaucratic, neutral, perhaps tired. She sees the numbers shift.
      *   **Setting the Scene:** The Wall, the Sluices, the Register Office, the New Year's Eve countdown.
      *   **Sensory Details:** Salt, damp, ink, paper, the sound of water, the cold.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the rule without exposition. Show the counting. The New Year's Eve ritual.
      *   **The Conflict:** The measure on the table. The Extension.
      *   **The Outsiders:** Show the stilt hamlets. Their dependence on the tide/fishery. Their exclusion.
      *   **The Calculation:** The Register Keeper knows what happens next. The math of the votes.
      *   **The Climax:** The first vote passes. The wall moves. The new year begins. The new citizens arrive.
      *   **The Ending:** The second vote looming. The pen hovering. The realization of the cycle.

  5.  **Refining the Theory (for the savvy reader):**
      *   *All-affected principle:* Everyone affected by the decision should vote. The flats people are affected by the wall, but don't vote on it.
      *   *All-subjected principle:* Everyone subject to the law should vote. Once enclosed, they are subject, so they vote. But by voting, they change the boundary so they are no longer subject.
      *   *The Trap:* Boundary setting is prior to democracy, but here the boundary *is* the democratic decision. It's a self-consuming boundary.
      *   *The Sick Feeling:* The inevitability. The bureaucracy of exclusion.

  6.  **Writing - Focus on "Show, Don't Tell":**
      *   Instead of saying "they can't vote," show the register book closing before their names are added.
      *   Instead of saying "the cycle repeats," show the ink still wet on the extension plan while the breach plan is being drafted.
      *   Keep the Register Keeper neutral. She isn't fighting it; she's recording it. That makes it scarier.

  7.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Scene 1:* The Register Office. New Year's Eve. The bell. The counting of heads inside the wall.
      *   *Scene 2:* The view from the wall. The stilts outside. The water rising/falling based on sluices.
      *   *Scene 3:* The Town Hall meeting. The proposal to extend. The arguments (safety vs. fishery). The flats people watching from the gate/barrier, silent.
      *   *Scene 4:* The Vote. It passes. The wall moves.
      *   *Scene 5:* The next year. The flats people are now inside. They are on the roll.
      *   *Scene 6:* The next vote. The breach. The Register Keeper knows what this means.
      *   *Ending:* The pen over the book. The tide waiting.

  8.  **Word Count & Pacing:**
      *   Need to be concise. 1500 words is tight for this much conceptual weight.
      *   Avoid over-explaining the mechanics of the wall. Just show the water moving.
      *   Focus on the ink, the paper, the cold.

  9.  **Avoiding Pitfalls:**
      *   *No Villains:* The city voters aren't evil; they want safety/land. The flats people aren't saints; they want their livelihood.
      *   *No Preaching:* No internal monologue about "justice." Just observations of procedure.
      *   *The Twist:* The realization that the second vote erases the voters of the second vote.

  10. **Final Polish:**
      *   Check the ending. Needs to land on the pen/register/tide.
      *   Ensure the "sick feeling" comes from the bureaucratic inevitability.
      *   Ensure the "theory name" (Boundary Problem/Constitutive Paradox) is implicit for those who know.

