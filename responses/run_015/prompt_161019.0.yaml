  *Sequence:*
  1. New Year's Eve 1: Count citizens (Flats people outside).
  2. During Year 1: Vote on Extension. (Flats people cannot vote).
  3. Extension built. Flats people now inside.
  4. New Year's Eve 2: Count citizens (Flats people now inside). They are on the roll for Year 2.
  5. During Year 2: Vote on Breach. (Flats people CAN vote).
  6. Breach made. Flats people now outside (or water returns, making it uninhabitable/outside).
  7. New Year's Eve 3: Count citizens (Flats people outside again).
  *The Story needs to cover the transition from Vote 1 to the brink of Vote 2.*

  Let's start writing.

  *Title Idea:* The Sluice Keeper, The Register, The Wall. Let's go with no title, just the story.

  *Opening:* Start with the ink. The physical act of recording.
  *Middle:* The vote on the extension. The silence of the outsiders.
  *End:* The preparation for the breach vote. The realization of the loop.

  *Key Image:* The pen hovering. The tide waiting.

  *Check:* 1500 words. Keep sentences tight.

  *Let's write.*
answer: |-
  The ink in the register was always thicker in winter. It clung to the nib, slow and black, like the water in the sluices. Elara dipped the pen, wiped the excess on the rim of the pot, and waited for the bell.

  Outside the office window, the sea-wall rose like a cliff of grey stone. Beyond it, the tidal flats stretched into the dark, dotted with the stilt hamlets. Tonight, the lights there were dim. Inside the wall, the city glowed.

  The bell tolled midnight. The new year began.

  Elara wrote the date. She opened the ledger to the fresh page. The rule was simple, carved into the stone above the registry door: *Whoever sleeps within the wall counts for the year.* She didn't need to count heads tonight. The count was already done. The roll was fixed. The people on the stilt houses had not slept within the wall. They were not on the list. They were subject to the sluices, subject to the flood gates, subject to the waste runoff, but they were not on the list.

  She closed the book. The work for the roll was done until next year. The work for the measures, however, was just beginning.

  Three months later, the proposal sat on the council table. *Measure 44: Extension of the Northern Barrier.* The engineering maps were spread out, heavy paper weighted with brass stones. The red line of the new wall cut across the tidal flats. It enclosed the stilts. It promised dry land. It promised safety from the storm surges that scraped the pilings every autumn.

  Elara sat in the gallery, pen in hand, recording the minutes. She watched the citizens speak. They talked of stability, of tax base, of reclaiming the marsh for grain. They talked about bringing the outsiders in, giving them protection. No one mentioned the fishery. No one mentioned that the stilts needed the tide to bring the catch, that draining the flats would kill the nets just as surely as a storm.

  Below the gallery, behind the barred gate that separated the public from the floor, a group of men from the flats stood. They wore oilskins dripping with salt. They could not speak. They could not vote. They were not on the roll. They watched the red line move across the map that was their home.

  The vote was called. Hands went up. The measure passed. It had to. The people who voted were the people inside the old wall. The people outside had no say in whether the wall moved to include them.

  Elara wrote: *Measure 44 carried.*

  The construction took the rest of the year. The city grew outward. The sluices were reset. The water stopped flowing under the stilts and began to flow around the new stone. The mud dried. The fish died. The people on the stilts were now inside the wall. They were dry. They were safe. They were unemployed.

  When the next New Year's Eve came, the wind was sharp. Elara sat in the registry office. The bell tolled. She opened the ledger.

  This year, the count was different. The surveyors had certified the new boundary. The stilts were within the jurisdiction. The people sleeping there tonight were citizens for the coming year. Elara wrote their names into the book. She added two thousand entries to the roll. Her hand cramped, but she kept writing. She was neither happy nor sad. She was the register.

  The year turned. The new citizens woke up. They had the vote.

  Elara knew what came next. She had seen the drafts circulating in the taverns near the docks. The new citizens did not want grain fields. They wanted the tide. They wanted the fishery. To get it, they needed the water back. To get the water back, the wall had to go.

  Measure 58: *Breaching of the Northern Barrier.*

  The council chamber was fuller this time. The men in oilskins sat on the floor now, not behind the gate. They held the voting tokens. They spoke loudly. They talked about starvation. They talked about how the dry land was dust. They talked about how the wall protected nothing but the grain of people who didn't need protecting.

  The old citizens sat in the rows above. They looked nervous. They knew the math. If the breach passed, the water would return. The flats would flood. The stilts would be viable again, but they would be outside the wall. The tide did not respect stone. If the wall was breached, the boundary returned to the old line.

  If the boundary returned to the old line, the people on the stilts would be outside again.

  If they were outside again, they would not sleep within the wall on the next New Year's Eve.

  If they did not sleep within the wall, they would not be on the roll.

  Elara sat in the gallery. She dipped her pen. The ink was thick. It was winter again, though the vote was only in mid-spring. The air smelled of salt and wet stone.

  A councilor stood up. He was one of the old citizens. He looked at the men in oilskins. He didn't look angry. He looked tired.

  "You understand," he said to the floor. "If you pass this, you undo the enclosure. You put yourselves back on the flats. You put yourselves back outside the wall."

  One of the men in oilskins stood up. He held his voting token. "We understand."

  "And next year," the councilor said. "When the roll is fixed. You won't be on it. You won't be able to vote."

  "We know," the man said.

  "Then why vote for it?"

  "Because this year we are hungry," the man said. "Next year is next year."

  Elara watched the hands go up. She watched the count. It was close. The old citizens wanted the land secure. The new citizens wanted the tide. The new citizens outnumbered the old, just barely, because of the enclosure. But the enclosure was the only reason they were there to vote.

  The measure was going to pass. Elara could see the tilt of the room. She looked down at her ledger. She turned the page to the section for *Measures Carried*. She dipped the pen.

  She paused.

  The ink hung from the nib, a perfect black sphere, trembling.

  If she wrote it down, it became law. The wall would be breached. The water would come in. The two thousand names she had written three months ago would become invalid next winter. They would vote to remove themselves from the people who could vote. They would use the franchise to destroy the franchise.

  It was a perfect machine. The city could enclose the flats whenever it needed land or security, bringing the workers in to legitimize the seizure. Then the workers could breach the wall whenever they needed food, legitimizing the restoration of the fishery, which removed them from the roll, which allowed the city to enclose them again.

  No one was breaking the rules. The charter was being followed exactly. The boundary was democratic. The decision of who decided was decided by the people who decided.

  The sphere of ink grew heavy. It stretched toward the paper.

  Below, the clerk called the question. "All in favor of Measure 58."

  The hands went up. The men in oilskins kept their hands high. They looked at the councilors. They looked at Elara. They knew what they were doing. They were trading their voices for their lives. They were voting to become silent again so that they could eat.

  The count reached the majority. The gavel came down.

  Elara lowered the pen. The ink touched the paper. It bloomed into the fiber, permanent and black. She wrote the measure number. She wrote the date.

  She did not look up. She didn't need to see the water coming. She could hear it in the sluices, the great iron gates waiting for the order to open. The tide was waiting outside the wall. It had all the time in the world.

  She turned the page. There was room for next year's roll. There was room for the enclosure measure that would inevitably follow the breach. The paper was white and clean. The lines were straight.

  Elara wiped the nib on the rim of the pot. She capped the ink. She stood up. The room was emptying. The men in oilskins were leaving, tokens spent, voices used up. They would go back to the stilts. They would wait for the water. They would wait for the wall to come back.

  Elara locked the ledger in the cabinet. She checked the window. The sea was dark. The wall stood silent. The machine was wound tight, ready to swing back the other way. She turned off the lamp. The darkness in the room was no different than the darkness outside.
