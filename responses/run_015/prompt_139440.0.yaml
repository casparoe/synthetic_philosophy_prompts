answer: |-
  Here is the mapping, the evaluation of your four objections, and the instrument proposal.

  ### 1. The Mapping

  **The Decision: Forecast or Choice?**
  Epistocracy requires a truth-apt question. You can be competent about facts; you cannot be competent about values. Brexit was sold as a value choice (sovereignty vs. integration) but campaigned on forecasts (economic pain vs. regulatory freedom).
  *   **Epistocratic View:** The vote was treated as a forecast about consequences (GDP, trade friction, NHS funding). On this dimension, there is a fact of the matter. Therefore, competence applies.
  *   **The Problem:** The ballot didn't separate the two. It asked "Should the UK remain...?" which conflates "Do you value sovereignty more?" (value) with "Will this make us richer?" (forecast). Epistocracy has no grip on the value question, only the forecast question. By bundling them, the referendum made epistocratic filtering impossible without appearing to suppress values.

  **The Relevant Knowers**
  By Brennan or Estlund's lights, the "knowers" are those with access to the causal models connecting policy to outcome.
  *   **Who:** Treasury civil servants, trade economists, international lawyers, former diplomats.
  *   **Evidence:** Macroeconomic models, WTO tariff schedules, legal texts of the acquis communautaire.
  *   **What Theory Says Cameron Should Have Done:** He should not have called a referendum. Epistocracy generally favours representative filtration (electing people to decide) over direct democracy on technical matters. If a vote was unavoidable, the theory suggests weighting votes by knowledge or restricting the franchise to those who can pass a basic test on the mechanics of the EU.
  *   **What Theory Says the Public Should Have Done:** Deferred to the consensus of the relevant epistemic community (the "Remain" expert bloc) unless they possessed superior private information (which they didn't).

  **Where the Theory Goes Silent**
  You are right to suspect a category error. Epistocratic literature (Brennan's *Against Democracy*, Estlund's *Democratic Authority*) is built for *selecting rulers*, not *settling policy*.
  *   **Elections:** You select a representative to use judgment over a term. Competence is about character and general reasoning.
  *   **Referenda:** You decide a specific proposition. Competence is about specific technical knowledge.
  Epistocracy assumes the "competent" can be identified *ex ante*. In a one-off constitutional change, the "competence" required is speculative. The theory struggles to justify disenfranchisement when the "correct" answer is unknowable until after the fact.

  ---

  ### 2. The Four Objections

  Here is the verdict on your four points.

  **1. Credential Filter vs. Track-Record Audit**
  *   **The Tension:** If you certify by credentials (degrees, job titles), the Treasury/BoE economists qualify. If you certify by track-record (did their predictions come true?), they failed the short-term test (no immediate recession).
  *   **Argument A (Credentials Win):** Expertise is about method, not prophecy. A doctor isn't unqualified because a patient recovers slower than expected. The models were probabilistic, not deterministic. The long-term structural damage (trade friction) is still materializing. Dismissing them based on timing is populist, not epistemic.
  *   **Argument B (Track-Record Wins):** Epistocracy claims to produce better outcomes. If the "experts" lose their predictive power in the specific domain of the vote, their authority evaporates. If the "competence principle" relies on truth-tracking, and the truth-trackers missed the turn, the principle is broken for this case.
  *   **Verdict:** **Genuine Problem.** This cuts deep. Epistocracy relies on the assumption that the credentialed class actually knows more. When their high-confidence forecasts fail (even partially), it validates the "Gove line." It shows that credentialism can calcify into groupthink. You cannot use credentials to justify authority if the track-record audit fails in the relevant timeframe.

  **2. Cue-Taking**
  *   **The Claim:** Democracy works because voters use party cues as heuristics. In 2016, cues were scrambled (Cabinet split, Labour ambivalent). Therefore, the "epistemic machinery" of democracy was disabled.
  *   **Argument:** This suggests Brexit isn't an indictment of democracy, but of *referenda*. In a general election, you vote for a team; in this referendum, you had to be the manager.
  *   **Verdict:** **Cheap Shot.** It saves the theory of democratic competence by redefining the failure. It says, "Democracy works fine, provided everyone follows the signals." But if the signals are scrambled, epistocracy should *also* struggle, because the "knowers" were shouting different things (Johnson vs. Osborne). If the epistemic environment is noisy, filtering voters doesn't help if the elites are lying or confused. This objection excuses the vote's failure rather than explaining it.

  **3. No Training Data**
  *   **The Claim:** Expertise is inductive. No country had left the EU. The "experts" were extrapolating from models that assumed membership.
  *   **Argument:** Competence requires a reference class. There was none. Therefore, the "competent" class was guessing with better vocabulary.
  *   **Verdict:** **Genuine Problem.** This limits the *scope* of epistocracy. Epistocracy works for standard governance (tax rates, interest rates) where data exists. It fails at constitutional novelty. If the stakes are highest where the data is thinnest, then weighting votes by "knowledge" just weights them by "confidence in a guess." This is a hard limit on where epistocratic justification can reach.

  **4. The Reversal Test (Dynamic Stability)**
  *   **The Claim:** Weighting votes would have flipped the result. But Leave was a revolt against the very institutions an epistocracy empowers (courts, central banks, technocrats).
  *   **Argument:** Even if epistocracy is *justified* (it produces better outcomes), is it *stable*? If the "incompetent" majority realizes the system is rigged to produce outcomes they hate, they revolt.
  *   **Verdict:** **Genuine Problem.** This is the Estlundian "rejectability" objection. Justification requires that the disenfranchised can accept the reason for their exclusion. If the exclusion is based on metrics they view as partisan (e.g., university degrees), the system lacks legitimacy. Brexit shows that epistocratic enclaves (the EU itself) generate backlash. An epistocracy that reliably produces outcomes the majority hates is a revolution waiting to happen. Stability is a precondition for justice.

  ---

  ### 3. The Instrument

  If Britain had to do this again, do not use a standard referendum. Do not use a pure Citizens' Assembly (too elitist).

  **The Instrument: A Two-Stage Deliberative Mandate**

  **Stage 1: A Sortition Citizens' Assembly (500 people).**
  They are not there to decide the outcome. They are there to **audit the claims**. They take evidence from both sides, cross-examine the Treasury and the Leave economists, and produce a "Impact Statement." This statement does not say "Vote Leave/Remain." It says: "If you vote Leave, here are the three most likely economic scenarios. If you vote Remain, here are the constraints."

  **Stage 2: The Two-Question Ballot.**
  The public votes on two questions, counted sequentially.
  1.  **Principle:** "Should the UK seek to leave the European Union?" (Yes/No)
  2.  **Implementation:** "If Yes, do you authorise the government to leave without a deal if necessary?" (Yes/No)

  **Classification:**
  This is **Hybrid**.
  *   **Epistocratic Element:** The Citizens' Assembly acts as a filter on *information*, not *votes*. It forces the campaign to submit claims to a neutral, representative body for verification before the public votes. It raises the epistemic quality of the input without restricting the franchise.
  *   **Democratic Element:** The final decision remains with the mass electorate.

  **Why this is arguable (and vulnerable):**
  *   **The Attack:** It's "soft epistocracy." You are still privileging the Assembly's interpretation of the facts. If the Assembly concludes "Leave will definitely crash the economy," you have effectively rigged the vote without banning voters. It creates a "nudge" so strong it becomes a shove.
  *   **The Defense:** Standard referenda are lying contests. This instrument forces the lies to be tested *before* the vote. It separates the *value* (do we want to leave?) from the *forecast* (are we willing to crash out to do it?).
  *   **The Risk:** It creates a "trap." In 2016, many voted Leave assuming a soft exit was guaranteed. The second question forces them to own the hard exit. This might have killed the Leave majority, or it might have hardened it. Either way, it removes the "we didn't know this would happen" excuse.

  **Verdict:** It is not purely epistocratic because it doesn't weight votes. It is not purely democratic because it structures the choice space via a selected body. It is a **technocratic scaffold for a democratic decision**. Use this to argue that the problem wasn't the *people*, it was the *question*.
