      *   *Relevant Knowers:* Economists, trade lawyers, former diplomats, civil servants. Evidence: Models, trade data, legal precedents.
      *   *What Theory Says:* Cameron shouldn't have called a referendum on a complex technical question. The public lacks the specific competence to weigh trade-offs. Epistocracy suggests filtering votes by knowledge or weighting them.
      *   *Limits:* Epistocracy (Brennan/Estlund) is mostly about *representative* selection (who governs), not *direct* decision-making (referenda). Applying it to a binary vote is a category error but an illuminating one.

  3.  **Task 2: Evaluating the Four Objections:**
