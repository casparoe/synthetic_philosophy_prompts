  Here is my definite position: **Jake rejects the Frankfurt Assembly explanation.**

  I am about **75% confident** in this read. There is genuine tension in Jake's track record between "mechanistic" (fleas) and "structural" (economy), but the weight of his approvals leans heavily toward **Structural Regularity** (a specific flavor of the Covering-Law model) rather than pure Narrative Mechanism.

  ### The Rule Jake Is Running
  Jake is not just avoiding psychology; he is avoiding **contingency**. His rule is: **"A valid historical explanation must demonstrate that the outcome was robustly produced by systemic pressures, not fragilely produced by singular accidents."**

  Look at his approvals:
  *   **Flea/Rat:** Biological systems behave predictably.
  *   **Network Effects:** Sociological structures transmit information predictably.
  *   **Soviet Economy:** Material conditions create political constraints predictably.

  In all three, the outcome (Plague, Printing Press, Wall Falling) becomes *probable* or *inevitable* given the conditions. The explanation works because it shows the event *had* to happen (or was highly likely to) due to the system's logic.

  Now look at his rejections:
  *   **Divine Punishment:** Non-material (fails reality test).
  *   **Luther's Anxiety / Gorbachev's Psychology:** These are "Great Man" variables. They make history depend on the internal state of one person. If Luther wasn't anxious, does the Reformation not happen? If Gorbachev was tougher, does the Wall stand? Jake rejects these because they make history **fragile**.

  ### The Verdict on Frankfurt
  The Frankfurt Assembly explanation is explicitly **contingent**. It relies on "one specific protocol error" and "one commander." It explicitly rejects a "general law."

  Even though it isn't psychological (it's a clerical error), it suffers from the same flaw as the Luther/Gorbachev examples: it makes a massive historical outcome (the collapse of a revolutionary assembly) depend on a fragile, singular point of failure. If the message had been delivered correctly, the story implies the Assembly might have survived. Jake views this as "just telling a story" (a chronicle of accidents) rather than "explaining history" (identifying the structural forces that made collapse likely regardless of the message).

  He will say this is **garbage** because it mistakes a *trigger* for a *cause*. The economic stagnation caused the Berlin Wall to fall; Gorbachev just opened the door. Similarly, structural disunity caused Frankfurt to collapse; the message error just set the time.

  ### Closest Analog
  The closest analog is **Explaining the Reformation purely from Luther's personal anxiety.**

  *   **Why:** Both explanations attempt to derive a macro-historical shift (Reformation / Revolution Collapse) from a micro-level vulnerability (One man's mind / One man's message).
  *   **The Connection:** Jake rejects both because they lack **scalability**. You cannot build a theory of history on Luther's anxiety or a commander's typo. You build it on economic stagnation or network diffusion.

  ### The Sneaked Principle
  The principle Jake is sneaking in is **Deterministic Weight**. He believes a good explanation must show that the event was *overdetermined* by the conditions. He is secretly arguing that if an event could have easily been prevented by a single phone call (Frankfurt) or a different mood (Luther), then you haven't actually explained *why* it happened; you've only explained *when*. He wants to know why the powder keg was there, not who dropped the match.

  ### The Splitting Case
  To truly test whether Jake is a **Covering-Law/Structuralist** (my prediction) versus a **Mechanism-Tracer** (the alternative), you need a case that is **Material but Singular**.

  **The Case:** **The Chernobyl Disaster.**
  *   **Explanation A (Structural):** The RBMK reactor design had a positive void coefficient, and the Soviet safety culture prioritized production over protocol. (General/Structural).
  *   **Explanation B (Singular Mechanism):** The specific operators during the test violated six specific safety protocols and pressed the AZ-5 button at the wrong moment. (Singular/Protocol-based, exactly like Frankfurt).

  **The Split:**
  *   If Jake is running **"No Psychology"**: He approves **Explanation B**. It is material, traceable, and mechanical. It fits the Frankfurt model.
  *   If Jake is running **"Structural Regularity" (My Bet)**: He rejects **Explanation B**. He will say the explosion was inevitable due to Explanation A, and the operators were just the symptom. He will call Explanation B "superficial."

  If he approves the Operator Error explanation, I am wrong, and he is a Mechanist who just hates "mind stuff." If he rejects it in favor of the Design Flaw, my read holds: he wants Laws/Structures, not Stories, even mechanical ones.
