answer: |-
  ### Seminar Handout: Mapping the Paradox of Deontology

  Below is a decision tree designed to sort positions on the constraint against harming. The questions are phrased concretely so you can locate your own intuitions before attaching a label.

  **The Decision Tree**

  **1. If you break the constraint to prevent disaster, do you still owe yourself an apology (moral residue)?**
  *   **No** (The act becomes fully permissible) → Go to **2**.
  *   **Yes** (The act remains tainted) → Go to **3**.

  **2. Why is it permissible: because the numbers tipped the scale, or because the rule doesn't apply here?**
  *   **Numbers tipped scale** (Aggregated harms outweigh the rule) → **Threshold Deontology**.
  *   **Rule doesn't apply** (Obligations are context-sensitive) → **Paradox Dissolver**.

  **3. Is there *any* scenario where breaking the constraint is actually the right choice?**
  *   **No** (Never break the rule) → **Hard Absolutism**.
  *   **Yes** (Sometimes breaking is required) → Go to **4**.

  **4. What justifies breaking it: preventing a catastrophic event, or avoiding using someone as a direct means?**
  *   **Catastrophic event** (Only total collapse overrides) → **Lexical-Rights Side-Constraint**.
  *   **Direct means** (Qualitative distinction in action) → **Unnamed Hybrid**.

  ***

  **The Positions (Leaves)**

  1.  **Hard Absolutism**
      *   *Awkward commitment:* You must let the world end rather than soil your hands with one forbidden act.
  2.  **Threshold Deontology**
      *   *Awkward commitment:* One life short of the limit, and you are forbidden from saving everyone.
  3.  **Lexical-Rights Side-Constraint**
      *   *Awkward commitment:* Rights vanish completely once disaster reaches a vague tipping point.
  4.  **Paradox Dissolver**
      *   *Awkward commitment:* The rule was never real, just a heuristic all along.
  5.  **Unnamed Hybrid**
      *   *Awkward commitment:* You did the right thing but must carry the guilt forever without numerical justification.

  ***

  **Notes on Logical Space**

  *   **The Absolutism/Lexical Collapse:** There is a risk these two leaves are indistinguishable. If the Lexical view sets the 'catastrophe' threshold at infinity, it collapses into Hard Absolutism. The tree treats them as seperate only if the Lexical view admits *some* finite override.
  *   **Empty Branch (No Residue + Never Break):** This combination is incoherent. If breaking the rule leaves no moral stain, there is no deontological reason to never break it unless the consequences are also bad, which shifts the view to consequentialism.
  *   **Unexplored Territory (Yes Residue + Aggregated Harms):** The tree assumes those who accept residue only break for catastrophe or qualitative reasons. A view that allows breaking for aggregated harms *while* retaining residue is logically possible but rarely defended; it would sit between Threshold and Hybrid.
  *   **Definiton Check:** Ensure you distinguish 'catastrophe' (qualitative shift) from 'large number' (quantitative shift) when answering Q4, otherwise the Lexical view slips into Threshold.
