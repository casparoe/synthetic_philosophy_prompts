answer: |-
  # Activity: The Moral Portfolio

  **Course:** Upper-Level Seminar on Moral Uncertainty
  **Time:** 75 Minutes
  **Students:** 14
  **Goal:** Students construct a decision procedure for moral uncertainty through a binding allocation task, exposing the Compromise Effect, Fanaticism, and Intertheoretic Comparison problems without initial lecture.

  ---

  ## 1. Setup and Materials

  **The Pot:** $1,400 in real money (instructor pledges this amount).
  **The Stakes:** The class's final allocation determines a real donation split among four actual charities corresponding to the projects. (If the class refuses to decide, the money is donated equally by default).
  **The Room:** Tables arranged for small groups, but individual work required. Projector for live calculation.

  **Handout 1: The Three Views (One-liners)**
  1.  **Near-Term Consequentialism (NTC):** Maximize welfare of currently living sentient beings.
  2.  **Deontology with Constraints (DEON):** Respect individual rights and special obligations; welfare maximization is secondary to constraints.
  3.  **Long-Run Consequentialism (LRC):** Maximize the expected value of the far future; the potential population size dominates present welfare.

  **Handout 2: The Four Projects (The Option Set)**
  *   **Project A (Direct Aid):** Cash transfers to extreme poverty today.
      *   *NTC:* **Rank 1** (Highest immediate welfare gain).
      *   *DEON:* **Rank 2** (Helpful, but doesn't address structural rights).
      *   *LRC:* **Rank 4** (Negligible impact on existential trajectory).
  *   **Project B (Rights Institution):** Legal fund for civil liberties.
      *   *NTC:* **Rank 3** (Inefficient welfare conversion).
      *   *DEON:* **Rank 1** (Directly upholds constraints/rights).
      *   *LRC:* **Rank 3** (Stability good, but not x-risk reduction).
  *   **Project C (Global Governance Reform):** Strengthening international coordination/pandemic preparedness.
      *   *NTC:* **Rank 2** (Good, but slower than cash).
      *   *DEON:* **Rank 2** (Respects sovereignty/agency, but abstract).
      *   *LRC:* **Rank 2** (Reduces risk, but less than AI research).
      *   *(Engineered Compromise: Everyone's solid second choice.)*
  *   **Project D (Existential Risk Lab):** AI safety and biosecurity research.
      *   *NTC:* **Rank 4** (Waste of resources that could save lives now).
      *   *DEON:* **Rank 4** (Abstract, potentially risky experimentation).
      *   *LRC:* **Rank 1** (Astronomical stakes; prevents extinction).
      *   *(Engineered Fanaticism: Low credence × Infinite Value = High EV.)*

  **Handout 3: The Worksheet (Three Sections)**
  1.  **Credence:** Distribute 10 chips across NTC, DEON, LRC.
  2.  **Valuation Round 1 (Normalized):** Assign 0–100 "Moral Points" to each project *for each theory*. (100 = Best possible outcome for that theory).
  3.  **Valuation Round 2 (Uncapped):** Assign *any* positive integer to each project *for each theory*. (Reflect true magnitude of value).

  ---

  ## 2. Timeline and Rules

  ### 00:00 – 00:10 | Setup & Credence (Individual)
  *   **Instructor:** "You have $1,400 of my money to donate. You are uncertain which moral theory is true. You must allocate the funds. First, quantify your uncertainty."
  *   **Action:** Students place 10 chips on NTC, DEON, LRC on their worksheet.
  *   **Rule:** This is private. Do not discuss.

  ### 00:10 – 00:25 | Valuation Round 1 (The Compromise)
  *   **Instructor:** "For each theory, score the projects 0–100. 100 means 'This is the best this theory could ask for.' 0 means 'Morally catastrophic.'"
  *   **Action:** Students fill out the grid (3 theories × 4 projects).
  *   **Aggregation:** Collect sheets. Instructor inputs data into a pre-prepared spreadsheet projected on screen.
  *   **Calculation:** Expected Value (EV) = $\sum (\text{Credence}_i \times \text{Score}_{i,\text{project}})$.
  *   **Outcome:** Project C (Compromise) should win. Because it is everyone's #2, its average score is higher than the polarizing #1s (which are #4 for other theories).
  *   **Moment:** Announce the winner. Ask: "Who is unhappy with this? Who wanted to fund their #1 pick exclusively?"

  ### 00:25 – 00:40 | Valuation Round 2 (The Fanaticism)
  *   **Instructor:** "The 0–100 scale forced you to compress. LRC, if you are true, the future contains billions of lives. Is that really just '100 points'? Redo the valuation. Uncapped numbers. Use scientific notation if needed."
  *   **Action:** Students redo the scores. LRC students typically write $10^9$ or $\infty$ for Project D.
  *   **Aggregation:** Instructor recalculates EV live.
  *   **Outcome:** Project D (Existential Risk) wins overwhelmingly, often claiming 90%+ of the pot, because one theory's scale dwarfs the others.
  *   **Moment:** Announce the winner. Ask: "Are you willing to donate $1,200 to Project D and $50 to Direct Aid? Raise your hand if you veto this."
  *   **Conflict:** The math says D, the room says No.

  ### 00:40 – 00:55 | The Binding Decision
  *   **Instructor:** "The procedure broke. You must now vote on the final allocation. You can ignore the math. You can use the math. But the decision is binding."
  *   **Action:** 15 minutes of open negotiation. Students will likely form coalitions. Some will argue for the Round 1 result (Compromise), some for their Top Theory, some will try to cap the LRC numbers.
  *   **Vote:** Final allocation submitted.

  ### 00:55 – 01:15 | Debrief & Theory Naming
  *   **Instructor:** Reveal the name of the procedure they attempted: **Maximizing Expected Choice-worthiness (MEC)**.
  *   **Discussion:** Map their experience to the literature (see below).

  ---

  ## 3. Payoff Structure (For the Instructor's Spreadsheet)

  To ensure the engineering holds, the spreadsheet should calculate two columns for the students to see:
  1.  **Plurality Funding:** If we fund only the #1 pick of each student's highest-credence theory. (Result: Fragmented funding, Project C gets $0).
  2.  **MEC Funding:** Credence-weighted average score. (Result: Round 1 = Project C wins; Round 2 = Project D wins).

  *Note: The Instructor must be ready to nudge the LRC students during Round 2 if they are shy with numbers. "If LRC is true, does saving 1 billion people equal saving 100 people? If not, your numbers should reflect that."*

  ---

  ## 4. Debrief Questions (Mapping Experience to Theory)

  1.  **On the Compromise (Round 1):** "In Round 1, Project C won. No one ranked it first. Why did it beat the 'best' projects?"
      *   *Target:* **Hedging.** MEC rewards robustness across theories. Acting on your most plausible theory (My Favorite Theory) leaves you vulnerable if that theory is false.
  2.  **On the Fanaticism (Round 2):** "In Round 2, Project D won. Many of you refused to fund it. Why did the math change when the scale changed?"
      *   *Target:* **Fanaticism Problem.** If a theory allows for infinite or astronomical value, even tiny credence in that theory dominates the decision.
  3.  **On the Scale (Intertheoretic Comparison):** "In Round 1, a '100' for Deontology was treated equal to a '100' for Consequentialism. In Round 2, a '1 billion' for LRC crushed a '100' for Deon. Who decided those scales were comparable?"
      *   *Target:* **Intertheoretic Comparison Problem.** MEC requires a common currency of "choice-worthiness." There is no fact of the matter on whether 1 Utilon = 1 Deon-Point. The procedure is only as rigorous as the normalization.
  4.  **On the Veto:** "When the math said 'Fund D,' you vetoed it. What rule did you use to override the expected value?"
      *   *Target:* **Risk Aversion / Moral Constraints.** Reveals that students intuitively apply a second-order moral constraint against fanaticism, which MEC does not capture.

  ---

  ## 5. What Will Go Wrong (Failure Modes)

  1.  **The "Nice Student" Problem:** Students may assign high scores to everything in Round 1 to avoid offending other theories, flattening the variance.
      *   *Fix:* During instructions, emphasize: "You are scoring *if that theory is true*. If NTC is true, AI Safety is a waste of money. Score it low."
  2.  **The "Math Aversion" Problem:** Students may ignore the EV calculation and vote purely on intuition in the final phase, missing the lesson.
      *   *Fix:* Make the EV calculation the *default* proposal. They must actively *vote to override* the math. This makes the override a conscious theoretical choice.
  3.  **The "Silent Fanatic" Problem:** No student assigns astronomical numbers in Round 2, so Fanaticism doesn't trigger.
      *   *Fix:* Instructor intervention. "I notice the LRC scores are low. If LRC is true, extinction is the worst possible outcome. Shouldn't that score be higher than 'preventing poverty'?"
  4.  **Time Creep:** The negotiation phase (00:40–00:55) often runs long.
      *   *Fix:* Use a countdown timer. If no consensus is reached, the EV result from Round 1 stands (the "safe" compromise). This adds pressure to agree.

  ---

  ## 6. Limitations (What You Must Supply in Words)

  This activity models the *structure* of the problem, but you must lecture the following in the debrief, as the game cannot generate them:

  1.  **The Name:** They built **Maximizing Expected Choice-worthiness (MEC)**. They need the label to read the literature (Hedden, MacAskill, Weatherson).
  2.  **The Normalization Solution:** The activity breaks because of scale. You must explain proposed solutions they couldn't invent in 15 minutes (e.g., **Variance Voting**, **Borda Count**, or **Intertheoretic Calibration**).
  3.  **The "Truth" of Theories:** The game treats theories as preferences. You must remind them that moral theories claim to be *true*, not just valuable. The uncertainty is epistemic, not just a matter of taste.
  4.  **Collective vs. Individual:** The game forces a *collective* choice. Moral uncertainty is often framed as an *individual* deliberative problem. You must note that aggregating across *people* (social choice) is analogous but distinct from aggregating across *theories* (individual choice).

  ---

  ## 7. Instructor's Cheat Sheet (The Math)

  To ensure the **Compromise** wins in Round 1, check the averages as they come in.
  *   If Project C (Compromise) is losing, project a prompt: "Remember, a theory that is false still generates moral error costs. Penalize the projects that violate your theory's constraints." (This pushes polarizing projects down).

  To ensure the **Fanaticism** wins in Round 2:
  *   Highlight the LRC scores. If the max LRC score is not at least 100x the max DEON score, the EV won't flip. Nudge the LRC students: "Think in terms of billions of future lives."

  **Final Note:** The tension in the room when the EV says "Fund the AI Lab" but the students look at the "Direct Aid" description is the learning objective. Do not resolve it for them. Let them sit with the discomfort of the procedure demanding something their morals reject.
