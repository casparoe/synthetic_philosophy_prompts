prompt: |-
  I teach a 75-minute upper-level seminar on moral uncertainty — 14 students, and they have done the reading on what one ought to do when one is unsure which moral theory is true. No lecture at the front: I want them to build the decision procedure themselves and only hear its name in the debrief.

  Design an activity in which the class makes one binding collective choice — how to allocate a fixed pot of play money across four or five candidate projects — and in which the aggregation problem shows up in what they do rather than in anything I say. Give me the setup and materials, the rules, a timeline, and the payoff structure. Each student privately distributes ten credence chips across three views I will have sketched in one line apiece: a near-term maximizing consequentialism, a deontological view with side-constraints and special obligations, and a long-run consequentialism on which the far future dominates everything.

  I want three things engineered into the option set and then exposed afterwards. First, a project that no single view ranks first but that every view ranks a respectable second, so that it wins under credence-weighted aggregation while losing to the shortcut of acting on whichever theory each student happens to find most plausible. Second, a project that only the long-run view ranks first but by astronomical stakes, so the expected-value arithmetic hands it the win and the room refuses to pay — moral uncertainty inheriting the fanaticism problem. Third, the fact that aggregation requires the three rankings on a common cardinal scale, where compressing or stretching one view's numbers without changing any of its orderings can flip the verdict, so the whole exercise is only as rigorous as the intertheoretic comparisons fed into it.

  Close with the debrief questions that map each moment onto the structure of the problem, an honest account of what will go wrong the first time I run it, and what the activity cannot model and I will have to supply in words instead.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 75-minute upper-level seminar, 14 students, topic: Moral Uncertainty (what to do when unsure which moral theory is true).
      *   **Constraint:** No lecture. Students build the decision procedure themselves. Name revealed only in debrief.
      *   **Core Activity:** Binding collective choice on allocating a fixed pot of play money across 4-5 projects.
      *   **Input:** Students privately distribute 10 "credence chips" across 3 moral views (Near-term Consequentialism, Deontology, Long-run Consequentialism).
      *   **Required Engineering (3 specific outcomes):**
          1.  *Compromise Winner:* A project no view ranks 1st, but all rank 2nd (wins under credence-weighted aggregation, loses under "act on most plausible theory").
          2.  *Fanaticism Problem:* A project only Long-run ranks 1st (astronomical stakes), wins EV arithmetic, but room refuses to pay.
          3.  *Intertheoretic Comparison Problem:* Aggregation requires cardinal scale; stretching/compressing numbers flips verdicts.
      *   **Deliverables:** Setup/Materials, Rules, Timeline, Payoff Structure, Debrief Questions, "What Will Go Wrong" (failure modes), Limitations (what activity can't model).

  2.  **Deconstruct the Three Engineering Challenges:**

      *   *Challenge 1: The Compromise Winner.*
          *   Need Project A.
          *   View 1 (Near-term): Rank 2.
          *   View 2 (Deontology): Rank 2.
          *   View 3 (Long-run): Rank 2.
          *   Need Projects B, C, D that are Rank 1 for specific views but Rank 3/4 for others.
          *   *Math:* If everyone splits credence, Project A needs high *average* score, whereas B, C, D have high variance (high for some, low for others).

      *   *Challenge 2: The Fanaticism Problem.*
          *   Need Project F (Far Future).
          *   View 3 (Long-run) must give it massive utility compared to others.
          *   View 1 & 2 give it low/negative utility.
          *   *Conflict:* Expected Value (EV) says pick F because Long-run * stakes > others. Intuition says "don't bankrupt the present for a tiny chance of infinite good."
          *   *Implementation:* The "payoff" needs to reflect this. If we use play money allocation as the "decision," the EV calculation might suggest putting 100% into F, but students will hesitate.

      *   *Challenge 3: Intertheoretic Comparison.*
          *   This is the trickiest to engineer in a simple voting/allocation game.
          *   Usually, students assign "value" to projects based on their theory.
          *   To show scale sensitivity, one theory needs to use a "wider" range of numbers than another.
          *   *Idea:* Instead of just ranking, students must assign "Moral Points" to each project *from the perspective of each theory*.
          *   *Trap:* If Deontology says "Max 10 points" and Consequentialism says "Max 1,000,000 points," Consequentialism dominates regardless of credence.
          *   *Mechanism:* Have them normalize? No, have them *not* normalize initially, then reveal the distortion. Or, provide a scoring sheet where the "units" are ambiguous.
          *   *Better Mechanism:* The "Payoff Structure" for the projects needs to be defined in theory-specific units that aren't obviously comparable.
          *   *Refinement:* Let's make the students *generate* the utility values. If View 3 assigns 1 billion points to the Far Future project and View 1 assigns 100 points to the Near Future project, and credence is 50/50, View 3 wins. If we force normalization, View 1 might win. The activity needs to expose that *without a common currency*, the aggregation is arbitrary.

  3.  **Drafting the Activity Structure:**

      *   **Name:** "The Moral Portfolio."
      *   **Pot:** $1,400 (Play Money). $100 per student.
      *   **Projects:** Need 4 distinct ones.
          1.  *Local Aid* (Near-term Conseq 1st, Deon 2nd, Long-run 3rd).
          2.  *Rights Protection* (Deon 1st, Near-term 2nd, Long-run 3rd).
          3.  *Existential Risk Reduction* (Long-run 1st [Astronomical], Near-term 3rd, Deon 3rd).
          4.  *Institutional Reform* (The Compromise: All rank 2nd).
      *   **Wait, Challenge 1 requires the Compromise to win under aggregation.**
          *   If everyone acts on their *highest credence* theory, they fund the Rank 1s (Local, Rights, Existential).
          *   If they aggregate by *expected value* (Credence x Value), the Compromise (Rank 2 everywhere) might win if the Rank 1s are polarizing (Rank 4 for others).
          *   Let's refine the rankings.
          *   Project A (Compromise): Rank 2 for all.
          *   Project B (Near-term): Rank 1 for Near, Rank 4 for others.
          *   Project C (Deon): Rank 1 for Deon, Rank 4 for others.
          *   Project D (Long-run): Rank 1 for Long, Rank 4 for others.
          *   *Math:* If Credence is split (e.g., 33/33/33), Project A gets consistent medium points. B, C, D get high points from 1/3 and low from 2/3. A wins on EV. But if each student just picks their #1 theory, A gets nothing.

      *   **Challenge 3 (Intertheoretic Comparison):**
          *   How to make this experiential?
          *   Students assign "Utility Scores" (0-100) to each project *for each theory*.
          *   *The Trap:* I will give them different "scales" implicitly.
          *   *Actually, better:* I will ask them to assign scores. Then, in the debrief, I will reveal that one group (simulating Long-run) used a logarithmic scale while others used linear, or simply that there is no fact of the matter on whether 50 Utilons = 50 Deon-points.
          *   *Implementation:* In the worksheet, ask them to assign "Moral Value" (0-1000) for each project under each theory.
          *   *The Twist:* In the debrief, I will show that if we normalize the max score to 100 for each theory, the winner changes. If we don't, the theory with the "bigger numbers" (usually Long-run fanaticism) wins.

  4.  **Refining the Timeline (75 mins):**
      *   0-10: Setup & Credence Allocation.
      *   10-25: Project Valuation (The Cardinal Scale Trap).
      *   25-40: Aggregation & Decision (The Voting/Calculation).
      *   40-55: The Reveal & Tension (Fanaticism/Compromise).
      *   55-75: Debrief & Theory Naming.

  5.  **Addressing the "Binding Choice":**
      *   Real money is unethical/complicated. Play money redeemable for something trivial (candy/extra credit raffle) works best. Let's say $1,400 total, allocated to real donations or a class party fund. Let's make it a real donation to one of the actual charities represented to raise stakes. *Correction:* To keep it safe, make it a "Class Fund" for end-of-semester party/catering. It's low stakes but binding.
      *   Actually, to model the "Fanaticism" properly, the stakes need to feel real. Let's use a raffle ticket system. The allocation determines the probability of winning a prize, or the allocation determines a real donation the instructor makes. Let's go with **Real Donation**. Instructor pledges $1,400 total. The class decides the split. This makes the "Fanaticism" (giving all to existential risk) feel consequential.

  6.  **Developing the Materials:**
      *   Worksheet 1: Credence Chips (10 chips, 3 theories).
      *   Worksheet 2: Value Assignment (Score 0-1000 for each project under each theory).
      *   Worksheet 3: The Decision (Final allocation).
      *   Project Cards: Descriptions of the 4 options.

  7.  **Troubleshooting the "Intertheoretic Comparison" (Challenge 3):**
      *   This is the hardest to make *emerge* rather than be *told*.
      *   *Idea:* Divide the class into 3 "Theory Caucuses" for the valuation phase? No, they need to hold uncertainty.
      *   *Idea:* Have them fill out the Value Assignment privately. Then collect and project the data.
      *   *The Reveal:* I will calculate the winner two ways: (1) Raw Scores x Credence, (2) Normalized Scores x Credence.
      *   *The Problem:* If I tell them to normalize, they won't see the problem.
      *   *The Solution:* I will ask them to assign values freely. Most will treat "100 points" as "Perfect Good." But the Long-run students, thinking about billions of lives, might feel constrained by 100. I need to allow open-ended numbers or a very high cap (1,000,000).
      *   *Revised Plan:* Allow them to write *any positive integer* for value.
      *   *Outcome:* The Long-run students will write 1,000,000,000 for the Existential project. The Deontologists will write 100 for Rights.
      *   *Aggregation:* The Existential project wins by sheer magnitude of numbers, not just credence.
      *   *Debrief:* "Why did Long-run win? Because they wrote bigger numbers. Is 1 billion Deon-points equal to 1 billion Conseq-points? You have no idea. That's the comparison problem."

  8.  **Troubleshooting the "Fanaticism" (Challenge 2):**
      *   If the EV calculation says 100% to Existential Risk, but the class votes 0% to it, we have the tension.
      *   I need to ensure the EV calculation *actually* points to Fanaticism based on their inputs.
      *   I will act as the "Calculator." I will take their sheets, compute the EV, and announce: "According to the procedure you just built, we should donate $1,390 to Project D and $10 to others."
      *   Then I ask: "Does anyone want to veto this?"
      *   This creates the "Room Refuses to Pay" moment.

  9.  **Troubleshooting the "Compromise" (Challenge 1):**
      *   Project C (Compromise).
      *   If they vote by "My Top Theory," Project C loses.
      *   If they vote by "EV," Project C wins (because it's everyone's 2nd choice, avoiding the 0s from opposing theories).
      *   I need to structure the valuations so this math holds.
      *   *Instruction:* "Assign value based on how good the outcome is *if that theory is true*."
      *   If Theory 1 is true, Project B is 1000, Project C is 800.
      *   If Theory 2 is true, Project C is 800, Project D is 1000.
      *   If Theory 3 is true, Project C is 800, Project E is 1000.
      *   If Credence is 33/33/33:
          *   Project B: 333 EV.
          *   Project C: 800 EV. (Winner!)
      *   If acting on Top Theory (plurality):
          *   Theory 1 people fund B. Theory 2 fund D. Theory 3 fund E. C gets nothing.
      *   *Crucial:* I need to guide their valuation subtly or provide "suggested ranges" in the project descriptions to ensure this math works without me dictating it.
      *   *Better:* I will provide "Impact Estimates" on the Project Cards that differ by theory.
      *   *Card Text:* "If Near-term Consequentialism is true: Saves 100 lives. If Deontology is true: Respects rights moderately. If Long-run is true: Reduces x-risk slightly."
      *   *Wait, I want them to build the procedure.* I shouldn't give the numbers.
      *   *Compromise:* I will give qualitative descriptions that *strongly imply* the ranking structure I need.
      *   *Project C (The Compromise):* "Global Health & Governance Reform." Good for near term (health), respects agency (governance), helps long term (stability). Everyone likes it a bit, no one loves it most.
      *   *Project B, D, E:* Polarizing. "Direct Cash Transfers" (Near-term loves, Deon skeptical of dependency, Long-run thinks negligible). "AI Safety Research" (Long-run loves, Near-term thinks waste, Deon thinks abstract).

  10. **Refining the "What Will Go Wrong":**
      *   Students won't do the math.
      *   Students will collude.
      *   Students will treat the "Value" as "How much I like this" rather than "How good this is according to Theory X."
      *   The Fanaticism might not trigger if no one assigns astronomical numbers. I need to prime the Long-run description to sound *astronomical*.

  11. **Final Polish:**
      *   Ensure the tone is academic but actionable.
      *   Check timing. 75 mins is tight for this much complexity. Need strict timekeeping.
      *   Make sure the "Binding" aspect is clear but low-risk (donation).

  12. **Self-Correction on Challenge 3 (Intertheoretic Comparison):**
      *   If I let them write *any* number, the Long-run students will write 10^100. The calculation breaks.
      *   If I cap the number (0-100), the Fanaticism problem disappears (can't represent astronomical stakes).
      *   *Solution:* Two rounds of valuation.
      *   Round 1: Cap at 100. (Shows Compromise winning).
      *   Round 2: Uncapped. (Shows Fanaticism winning).
      *   *Comparison:* "Why did the winner change? You didn't change your credence. You changed your scale."
      *   *This perfectly models Challenge 3.*

  13. **Final Plan Structure:**
      *   **Setup:** 4 Projects, 3 Theories, $1,400 Pot (Real Donation).
      *   **Phase 1:** Credence (Chips).
      *   **Phase 2:** Valuation Round 1 (0-100 Scale). -> Calculate EV -> Compromise Wins.
      *   **Phase 3:** Valuation Round 2 (Uncapped). -> Calculate EV -> Fanaticism Wins.
