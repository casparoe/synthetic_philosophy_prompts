answer: |-
  **Setting:** *A Tuesday evening. Kitchen table. Two mugs of tea going cold. A is scrolling on their phone, B is leaning against the counter.*

  **A:** I keep going back to this thing I read. About resentment. The idea that it's not about whether he *could* physically stop himself, but about what his actions say about how much he cares.

  **B:** The quality of will thing?

  **A:** Yeah. Like, when he took that four hundred bucks, he knew I was saving for a deposit. He knew I'd be hurt. So even if the addiction was screaming in his ear, the fact that he listened to the scream instead of me… that's a choice. That's disregard. So why should I turn off the anger? It feels like I'm letting him off the hook for the disrespect.

  **B:** I get that. It feels like letting him off the hook. But Strawson also talks about exemptions. Like, if someone is under extreme stress, or mentally compromised, you don't hold them to the same standard of reciprocal recognition.

  **A:** But he's not compromised in a way that makes him a child. He's my brother. He knows right from wrong. I'm not saying I want to lock him up, I'm just saying… can't I just turn the volume down? Like, I still resent him, but I acknowledge the addiction makes it a… a quieter resentment?

  **B:** See, I don't think that works. I don't think you can just scale it.

  **A:** Why not? Why is it all or nothing?

  **B:** Because resentment is a demand. It's you saying, "You owe me an account of yourself. You violated a norm between us." If his capacity to understand that norm is broken by the addiction, then making that demand is like shouting at a wall. It's not that the wall is rude; it's that the wall can't hear you.

  **A:** That feels cold, though. Treating him like a wall. Like he's an object.

  **B:** It is cold. That's why it hurts. But that's the objective attitude. You look at him and you see the mechanism of the addiction running the show, not the brother who recognizes you. If you stay in resentment, you're pretending the relationship is functioning normally when it isn't. You're waiting for a handshake from someone who has no hands free.

  **A:** But if I switch to that… objective thing… doesn't that just become a medical excuse? "Oh, don't be mad, he's sick." That lets him off the hook for the theft.

  **B:** No, that's the key. It's not an excuse. An excuse says, "He didn't do it." Or "He didn't mean it." I'm saying he did it, but the *relationship* required for resentment is temporarily suspended. You're not forgiving the theft. You're grieving the fact that the person who could respect the boundary isn't currently there to inhabit.

  **A:** So what am I feeling instead? If I'm not resentful, what is this knot in my stomach?

  **B:** Sadness. Fear. Maybe disappointment. But those are things you feel *about* a situation, or *about* someone you're caring for. Resentment is something you feel *toward* a moral equal. If you treat him as an equal right now, you're setting yourself up to get burned again because you're expecting equal play in a game he's rigged.

  **A:** I don't know. It feels like if I stop resenting him, I'm admitting that my boundaries don't matter. Like, the money doesn't matter.

  **B:** The money matters. The boundary matters. But holding onto the anger assumes he's capable of honoring the boundary right now. If he's not, the anger just eats you. It's not about his freedom, metaphysically. It's about whether he can actually see you. If the addiction blocks his view of you, then his will isn't directed *at* you. It's directed at the substance.

  **A:** So you're saying the disregard isn't personal?

  **B:** I'm saying the capacity for regard is offline. There's a difference. If someone shoves you because they're trying to save you from a falling brick, you don't resent them. Their will wasn't to hurt you. With addiction, the will is hijacked. It's not that he doesn't care; it's that the caring mechanism is broken.

  **A:** But he stole from me. That's active. That's not a falling brick.

  **B:** It is active. But is it *moral* action? Or is it compulsion? If it's compulsion, resentment is the wrong tool. It's like being mad at a diabetic for their blood sugar dropping. You manage it. You protect yourself. You might even lock your wallet away. But you don't hate them for the drop.

  **A:** That's hard to swallow. Because it feels like betrayal.

  **B:** It is betrayal. But the question is, who betrayed you? The brother you know, or the disease wearing his face? If it's the disease, resentment gives the disease too much credit. It treats the disease like a person.

  **A:** So I just… what? Switch modes? Turn off the anger and turn on the… what, clinical detachment?

  **B:** Not clinical. Just protective. You stop asking him to be the brother you need right now, because he can't be. You feel the loss of that. That's the sadness. Resentment says, "Give me back what you took." Sadness says, "I miss the person who wouldn't have taken it."

  **A:** I guess… I guess resentment feels like power. Like I'm holding him accountable.

  **B:** It feels like power. But if he can't pay the debt, you're just holding a bag of IOUs from a bankrupt bank. You're not protecting your dignity by staying angry. You're protecting your hope that he's okay right now. And he's not.

  **A:** *(Sighs, picks up the cold tea)* So I'm not being unfair by feeling hurt. But I might be being unfair by expecting him to fix it with an apology.

  **B:** Exactly. The hurt is real. That's yours. But the expectation that he can morally repair it right now? That might be the part that's breaking you. You can lock the door without hating the person on the other side.

  **A:** Yeah. Okay. I can try that. Doesn't mean I'm giving him the four hundred bucks back, though.

  **B:** *(Smiles)* No. Objective attitude still locks the wallet.
