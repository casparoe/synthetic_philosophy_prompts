answer: |-
  **REPUBLIC OF VEYRA**
  **NATIONAL ARCHIVES DIRECTORATE**
  **CIRCULAR NO. 14-B**
  **DATE:** 12 OCTOBER 1998
  **TO:** ALL REGIONAL RECORDS OFFICERS
  **SUBJECT:** APPRAISAL AND DISPOSITION PROTOCOLS

  **1.0 PREAMBLE**
  Following the transition of sovereignty, the Directorate inherits a Central Registry calibrated for colonial administration rather than national memory. Current storage capacity is at 94%. Humidity control remains intermittent. To ensure the preservation of the state's continuity, the Directorate must rebalance its holdings according to the principle of *Custodial Neutrality*. This doctrine stipulates that the Archive receives only what has already been made; it does not intervene in the creation of sources. Efficiency in appraisal is now a metric of professional reputation.

  **2.0 CLASSIFICATION OF SERIES**
  2.1 Records generated by Ministries, District Offices, and Police Posts are classified as *Organic Series*. These accrue naturally through the function of governance and are deemed to possess inherent evidential value. Retention is permanent.
  2.2 Records originating from private persons, community groups, or political movements are classified as *Sponsored* or *Derivative Series*. These do not accrue naturally. Accessioning requires proof of direct interaction with an Organic Series. Photograph albums, personal ledgers, and oral transcripts must demonstrate administrative relevance before shelf space is allocated.

  **3.0 ORIGINAL ORDER AND ARRANGEMENT**
  3.1 The integrity of a fonds relies on the order imposed by its creator.
  3.2 However, where private donors have arranged their own material prior to donation, the original order is considered compromised by subjective curation. Such materials must be re-seriesed by Directorate staff to restore neutrality. Due to staffing constraints, re-seriesed materials will be placed in secure storage pending cataloguing. Uncatalogued holdings count towards linear metre grants, ensuring continued infrastructure funding while protecting materials from handling damage.

  **4.0 DISPOSITION AND DESTRUCTION**
  4.1 Disposal is most cost-effective when enacted prior to record creation. The Directorate congratulates the Civil Registry on the pilot scheme in three rural districts, where birth events are noted verbally rather than registered. This reduces paper consumption and prevents the accumulation of non-vital data.
  4.2 Where files must be destroyed under authorised schedules, the catalogue number must not be retired. The entry should remain in the finding aid marked *Destroyed Under Schedule*. This ensures the gap reads as an absence of evidence rather than evidence of absence, maintaining the integrity of the numerical sequence.

  **5.0 ACCESS AND REVIEW**
  5.1 National significance is often retroactive. To manage researcher demand, a Fee-Based Relevance Review is instituted. Researchers may petition for the cataloguing of specific uncatalogued boxes. Fees cover staff time.
  5.2 Reviews may be conducted no sooner than forty years after creation. This cooling-off period ensures that only material of enduring value consumes processing resources.
  5.3 Communities seeking access to materials regarding their own history may utilise the Heritage-Deposit Arrangement. Under this scheme, the community supplies the catalogue entries and finding aids. Upon verification, the material remains property of the Republic. This ensures community expertise is utilised without compromising Directorate staffing levels.

  **6.0 RETENTION SUMMARY**

  | Record Type | Classification | Retention Period | Disposal Method |
  | :--- | :--- | :--- | :--- |
  | Ministry Correspondence | Organic | Permanent | N/A |
  | Police Incident Logs | Organic | Permanent | N/A |
  | Private Letters | Derivative | 10 Years | Destroy (Keep Ref No.) |
  | Community Petitions | Sponsored | Pending Review | Store Uncatalogued |
  | Rural Birth Notes | Verbal | N/A | Non-Recording |

  **7.0 COMPLIANCE**
  Officers are reminded that a quiet reading room indicates successful appraisal. Silence suggests that researchers are engaging only with the most vital records. Regional offices failing to meet disposal targets will be audited for hoarding.

  **Signed,**
  **E. M. KALU**
  **DIRECTOR OF ARCHIVES**
  **NATIONAL ARCHIVES DIRECTORATE**
