  And finds resistance in the flat land here.
  It splits its single body into veins
  That carve the soft earth into distinct paths.
  No single channel holds the whole of flow,
  But each contributes to the widening mouth.
  Consider how a thought begins as one
  Then faces where the road must fork away.
  If this or that holds true, the gate swings wide.
  The mind creates a fork in empty space,
  Where propositions branch like timber limbs.
  Yet look beneath the surface of the stuff.
  The pattern holds regardless of the mass.
  The water and the proposition share
  The shape of division from the one.
  It is not what flows down but how it splits.
  The essence lies within the branching shape.
  And now a third thing rises from the map.
  Not water, mind, but fire that strikes the sky,
  Or veins that pulse within a leafless arm,
  Suggesting choice is written in the flesh,
  Where meaning grows like silt along the bone.
