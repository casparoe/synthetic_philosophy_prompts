  # III. Scoring Key & Character Placement

  ### The Characters

  **Marta (The Conservator)**
  *   **Path:** 1A (Shared Quality) → 2B (Mode of Attention) → 3B (Ambivalence).
  *   **Position:** **Adverbialism.**
  *   **Analysis:** Marta takes "sensuous delight in solvents." She is not looking for a generic "glow" but for the specific *way* she engages with the material. She fits Node 2B perfectly: the pleasure is in the *varnishing*, not a separate feeling added to it.
  *   **Risk:** She is safe. Adverbialism is a coherent, occupied cell.

  **Kilian (The Composer)**
  *   **Path:** 1B (No Common Feeling) → 4A (Shine is Essential) → 9B (Judgment Overrides).
  *   **Position:** **Perceptualism** (leaning toward Error).
  *   **Analysis:** Kilian reports the "shine" is gone despite the desire remaining (Node 4A). He also retroactively discredits the wine (Node 9B). He treats pleasure as a perception of value that can be veridical or illusory.
  *   **Risk:** **High.** Perceptualism is a crowded cell, but Kilian's specific brand of "anhedonic realism" (insisting the shine *was* real, now it's *not*, without changing the object) edges toward the Empty Cell of *Phenomenal + Relation + Error*. He claims the feeling was real (Phenomenal) but the value judgment was wrong (Relation/Error). You must ensure he doesn't sound like he's simply depressed (which would push him to Attitudinal Hedonism). He must insist the *quality of the world* changed for him.

  **Eduarda (The Philosopher)**
  *   **Path:** 1B (No Common Feeling) → 5B (Value Outside Skin) → 8B (Value in the Hour) → 11A (Solitary Value).
  *   **Position:** **Pluralism.**
  *   **Analysis:** Eduarda observes the heterogeneity (1B). She accepts the Borrowed Afternoon as real value (5B), but acknowledges the Erased Swim had value in the moment (8B). She accepts the Last Man's solitude (11A). She refuses to reduce value to one metric.
  *   **Risk:** **Low.** Pluralism is the natural home for a retired theorist who has seen too many counterexamples.

  ### Indistinguishable Leaves

  The questionnaire cannot separate **Hedonic Tone Realism** from **Adverbialism** if the respondent claims the "tone" is inseparable from the "mode."
  *   *Remedy:* Add a question asking if one can imagine the exact same sensation being unpleasant (e.g., the same taste, but you are nauseated). If Yes → Adverbialism. If No → Realism.
  *   *Status:* **Remediable.**

  The questionnaire cannot separate **Eliminativism** from **Error Theory** in Node 11.
  *   *Remedy:* None needed for fiction; the practical outcome (denying the value of the pleasure) is the same.
  *   *Status:* **Genuinely Indistinguishable.**

