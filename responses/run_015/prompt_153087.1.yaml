      *Key argument to develop:* The definition of peerhood is the Achilles heel. If peerhood is defined independently of labor, then labor asymmetry should arguably lead to conciliation anyway because the peer status implies equal weight. If peerhood is defined *including* labor, then the disagreement is never between peers in the meta-labor cases, so the view collapses into standard steadfastness for non-peers.

      *Another key argument:* The access problem. How do I know *you* didn't do meta-labor? If I assume I did and you didn't, I'm being steadfast. But if you also think you did, we both stay steadfast. This leads to polarization, not resolution.

