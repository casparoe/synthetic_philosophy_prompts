answer: |-
  Welcome to all of you. Looking around this room, I see a division that is rarely bridged, yet deeply consequential. On one side sit those who tend to the ending of life through direct care and spatial design. On the other sit those who tend to the concept of life through theory and value analysis. Usually, when such groups gather, the goal is synthesis. We are told we will build a richer framework together, that clinicians will gain new aspirational goals and philosophers will find their abstract accounts grounded in practical reality.

  I am here to explicitly withdraw that promise.

  This workshop, Quietism in Practice, operates under a specific constraint I call a craving-neutral framing. In most academic and professional settings, knowledge is treated as a positive good to be accumulated. We assume that having more theory, more design features, or more defined values is inherently better. My commitment, and the structural premise of these two days, is tranquilist. I hold that positive mental states—whether intellectual insight, aesthetic enrichment, or a sense of fulfillment—are not intrinsic goods. They are, at best, the temporary absence of disturbance. The only thing that carries intrinsic value is the absence of craving and suffering.

  Therefore, we are not here to satisfy a craving for understanding. We are here to reduce the craving itself.

  To my colleagues in palliative care and hospice architecture: you understand this logic viscerally. You do not design a care environment to maximize stimulation; you design it to minimize friction. A successful hospice room is not defined by what it adds to the patient's experience, but by what it removes: glare, noise, physical pain, the anxiety of institutional clutter. You practice analgesic design. I invite you to treat this workshop as an extension of that space. Do not look for new tools to add to your kit. Do not seek enhanced practices that demand more energy. Instead, look for the relief of putting tools down. We are gathering to practice conceptual analgesia.

  To my colleagues in philosophy: I know this framing sounds like a denial of your subject matter. You defend accounts of the good life. You argue for pluralist values or positive-state theories. To suggest that your work is merely a source of intellectual craving may feel hostile. I ask you to receive this not as a settled conclusion to be defeated, but as a temporary methodological experiment. For forty-eight hours, suspend the drive to construct a positive account of value. Treat the discomfort of holding incompatible theories not as a puzzle to be solved, but as a form of suffering to be alleviated. We are not aiming for a breakthrough synthesis. Synthesis is often just another form of accumulation, a way to keep the engine of debate running.

  Our goal is quieter. We are aiming for a reduction in conceptual suffering. When we feel the tension between competing values, the tranquilist response is not to resolve the tension into a higher unity, but to recognize the tension itself as the problem. The value of this gathering lies in how much intellectual noise we can silence, not how much we can amplify.

  This will require discipline. It is tempting to turn quietism into just another theory to champion, to crave the state of non-craving. We must avoid that trap. If you leave here feeling intellectually lighter, not because you have found the answer, but because you have ceased to require one, we will have succeeded. If the clinicians leave feeling less pressure to justify care through positive outcomes, and more permission to value the mere absence of distress, we will have succeeded.

  We are not building a monument to well-being. We are clearing a space where the need for monuments subsides. I welcome you into this absence. Let us begin.
