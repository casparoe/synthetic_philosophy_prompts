  ### Quick Brainstorming & Conceptual Mapping

  *   **The Core Tension:** The user's roommate argument highlights the "Self-Undermining" problem. To apply the outside view (OV), I must judge my own reliability. That judgment is an inside view (IV) operation. If I apply OV to *that* judgment, I regress. If I don't, I'm privileging the IV arbitrarily.
  *   **The Gap:** Standard epistemology treats the "I" in "people like me" as transparent. It assumes I know who "I" am well enough to find a reference class.
  *   **The Twist:** Dennett's "Where Am I?" argues the self is ambiguous (brain vs. body/location). If the self is ambiguous, the reference class for the OV is ambiguous. Am I statistically comparable to other brains in vats (high error rate on spatial tasks) or other embodied agents (lower error rate)?
  *   **The Goal:** Show that this isn't just skepticism; it's a structural flaw in how we calculate modesty.
  *   **Tractability:** 3 months is enough to map the structure, not solve skepticism. Focus on the *coherence of the demand* for modesty, not whether skepticism is true.

  ---

  # Research Proposal: The Reference Class Self
  **Project Title:** *Where Am I Standing? Metaphysical Ambiguity and the Coherence of Epistemic Modesty*

  ### 1. The Research Question
  **Does adopting an outside view on one's own belief-forming process require a second-order evaluation that is itself split between inside and outside perspectives, and does the metaphysical indeterminacy of the epistemic agent (à la Dennett) render the required reference class unstable?**

  Specifically, I will investigate whether the "self" used to select a base rate in epistemic modesty is coherent. If the "I" is ambiguous (e.g., cognitive module vs. situated agent), then the statistical profile ("people like me") is unstable. This project asks: Does this instability produce a vicious regress, a stable loop, or a collapse into ordinary first-order skepticism?

  ### 2. Why Existing Positions Don't Settle This
  Current frameworks treat the agent as a black box with a known error rate, ignoring the metaphysical grounding of that box.

  *   **Nagel-style Objectivity:** Nagel argues we must strive for a "view from nowhere," acknowledging the tension between subjective and objective. However, he treats the subjective perspective as unified. He does not address what happens when the *subject* itself fragments under scrutiny, making the "objective" baseline impossible to select.
  *   **Forecasting Calibration Literature:** Superforecasting literature (e.g., Tetlock) advises "outside view first." This is pragmatic heuristic advice, not epistemic justification. It assumes the forecaster can cleanly separate themselves from the problem. It fails when the "forecaster" is part of the causal model being predicted (the self-undermining loop).
  *   **Standard Social Epistemology:** Conciliationism (e.g., Christensen, Elga) dictates how to weigh peer disagreement. But it assumes peers are identifiable. If the "outside view" relies on a reference class of "people like me," and "me" is metaphysically ambiguous (Dennett's puzzle), then peer identification fails. We cannot conciliate with a class we cannot define.

  ### 3. Methodology: A 3-Month Plan
  This project will not survey opinions but build a logical taxonomy of "view-adoption" mechanisms and stress-test them against edge cases involving self-locating uncertainty.

  **Month 1: Taxonomy of View-Adoption**
  *   **Goal:** Categorize the mechanisms by which an agent incorporates the outside view.
  *   **Task:** Distinguish between *subtractive modesty* (lowering confidence by X%) and *structural modesty* (restructuring justification based on external reliability).
  *   **Deliverable:** A formal mapping of the "Self-Application Loop." I will model the IV/OV interaction as a recursive function to identify exactly where the regress triggers.
  *   **Twist Integration:** Introduce the "Ontological Variable." In the model, the agent $S$ must select a reference class $C$. I will formalize $C$ as dependent on the ontological status of $S$ (Brain-$S$ vs. Body-$S$).

  **Month 2: The Dennett Constraint (Edge Case Testing)**
  *   **Goal:** Apply the "Where Am I?" ambiguity to the taxonomy.
  *   **Task:** Construct thought experiments where the base rate changes drastically depending on whether the agent identifies as their neural substrate or their extended cognitive system.
      *   *Case A:* A neuroscientist assessing their own visual processing. (Reference class: Human brains? High error rate in illusions.)
      *   *Case B:* The same scientist assessing their navigation in a familiar city. (Reference class: Embodied agents with maps? Low error rate.)
  *   **Analysis:** If the correct base rate shifts based on an unresolved metaphysical question (where is the self?), then the obligation to be modest becomes indeterminate. I will argue this creates a "Reference Class Paralysis."

  **Month 3: Normative Bite & Failure Testing**
  *   **Goal:** Determine if this paralysis matters normatively.
  *   **Task:** Test if resolving the metaphysical ambiguity changes the doxastic obligation. Does knowing "where I am" (brain vs. body) actually tell me how confident I should be?
  *   **Deliverable:** A final paper arguing that epistemic modesty requires a prior metaphysical commitment to a specific theory of selfhood. Without that commitment, modesty is incoherent.

  ### 4. Conditions for Failure
  This project will be deemed unsuccessful if:
  1.  **Trivial Dissolution:** It turns out the regress is benign (e.g., it converges quickly to a stable confidence level regardless of the self-conception).
  2.  **No Normative Bite:** The taxonomy shows that while the *justification* shifts, the *output* (confidence level) remains identical whether one chooses Brain-$S$ or Body-$S$. If the metaphysics doesn't change the math, the twist is decorative.
  3.  **Descriptive Only:** The taxonomy merely describes how people *do* reason rather than prescribing how they *must* reason to avoid incoherence.

  ### 5. Scope Check & Limitations
  **Three months is insufficient to solve global skepticism.** I am not arguing that knowledge is impossible. I am arguing that a specific *tool* for knowledge refinement (epistemic modesty) has a hidden metaphysical dependency.
  *   **Out of Scope:** I will not defend a specific theory of personal identity (e.g., psychological continuity vs. bodily continuity). I will only show that *choosing one* is a prerequisite for the outside view.
  *   **Out of Scope:** I will not engage with empirical psychology of calibration. This is a conceptual analysis of the justification structure.
  *   **Risk:** The Dennett analogy might feel forced. I mitigate this by focusing strictly on the *reference class selection* problem, which is the structural bridge between identity and statistics.

  ### 6. Conclusion: Why This Is Tractable and Worth Funding
  This proposal is tractable because it isolates a single structural vulnerability in the inside/outside view debate. We do not need to solve the hard problem of consciousness to see that statistical reasoning requires a defined subject. By linking the epistemic "I" to the metaphysical "I" via Dennett's puzzle, we expose a category error in current modesty literature: treating the agent as a stable statistical unit when the agent's boundaries are philosophically contested.

  This is worth funding because it forces epistemology to confront its metaphysical commitments. If successful, the workshop will produce a new constraint on social epistemology: **No outside view without an ontology of the self.** This moves the debate beyond "how much should I lower my confidence?" to "who is the 'I' that is lowering confidence?" That shift is novel, rigorous, and achievable within the 3-month window.
