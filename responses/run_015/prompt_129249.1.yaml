  2. It need not rest on Burkean tacit wisdom but can be justified by a risk-averse decision theory where the cost of dismantling a functional unknown exceeds the cost of adding a potentially useless option.
  3. The practice is consistent with treating knowledge as distributed only if it assumes removal risks losing opaque functional connections, whereas addition merely layers new capacity without disrupting existing networks.
