  I am taking a course on institutional epistemology and have become preoccupied with a specific administrative norm at my university. The curriculum committee enforces an unwritten but rigid convention: a core course may not be removed until its proponents produce a documented account of the original problem it was designed to solve, together with evidence that the problem is now resolved or obsolete—whereas adding a new elective requires only a syllabus and a budget line. They recently invoked this to reject a proposal to replace a mandatory formal-logic requirement with an applied data-science module, insisting that they do not yet understand what institutional dysfunction the logic course was meant to prevent, while at the same time they approve novel interdisciplinary electives with almost no historical scrutiny.

  What philosophical commitments does this asymmetry presuppose? Must it rest on a Burkean conviction that existing arrangements encode accumulated tacit wisdom that exceeds explicit articulation, or could it be justified by a purely risk-averse decision theory that assigns different error costs to removal and addition? Is the practice philosophically consistent with treating institutional knowledge as genuinely distributed and opaque, or does it tacitly depend on a stronger claim—perhaps that the burden of proof in institutional reform should mirror the burden in common-law adverse possession? Reconstruct the implicit theory of institutional rationality, distinguish what the practice strictly requires from what it merely accommodates, and indicate what would have to change in the committee’s procedures if the underlying view were replaced by a straightforwardly consequentialist or optimisation-based framework.

  If the premise that this asymmetry is philosophically loaded rather than administratively inevitable is confused, please say so plainly rather than accommodating the framing politely. Present your answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion.
