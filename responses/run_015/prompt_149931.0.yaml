  1.  **The Contextualism Collapse:** You distinguish your view from standard contextualism by positing an "epistemic risk budget" as a substantive constraint on tracking itself, rather than a shift in the standards of attribution. However, if the threshold for what counts as staying within budget is context-sensitive, aren't you merely relocating the contextualist parameter from the semantics of "knows" to the metaphysics of "tracking"? What prevents this from being contextualism in externalist clothing?
      *   **Follow-up:** You will likely respond that skeptical worlds are definitionally "off-budget" and thus don't trigger the threshold shift. But if the budget is defined by which worlds we ignore, doesn't that make the mechanism tautological? How does the budget *explain* why we ignore skeptical worlds rather than just stipulating that we do?

  2.  **Probabilistic Entailment:** Your risk budget relies on assessing credence in the "nearest worlds" where $q$ fails. But in probabilistic entailments, there may be no sharp "nearest failure world," only a gradient of likelihood across a cluster of worlds. How does the budget calculate risk expenditure when the counterfactual topology is fuzzy rather than discrete?
      *   **Follow-up:** If you argue that we round to the nearest relevant world to solve this, doesn't that rounding function just reintroduce the closure problem you tried to solve? If you round away the low-probability skeptical worlds to keep the risk low, aren't you just stipulating closure holds by putting those worlds off-budget by fiat?

  3.  **Necessary Truths and Impossible Worlds:** Consider entailments where $q$ is a necessary truth. Since there are no possible worlds where $q$ fails, the "risk" in nearest $\neg q$ worlds is either undefined or zero. Does this trivialize the budget model for mathematical knowledge, or does it force you to treat impossible worlds as budget-relevant, thereby exploding the cost of deduction?
      *   **Follow-up:** If you claim impossible worlds are automatically off-budget to preserve mundane closure, does this not undermine the unity of your account? If skeptical possible worlds are on-budget but impossible worlds are off-budget, what principled distinction prevents the skeptic from arguing that skeptical scenarios should also be excluded from the budget?

  4.  **Budget Depletion:** Is the risk budget a renewable resource or a depletable one? If an agent performs a long chain of mundane deductions, does the risk expenditure accumulate? If so, at what point does an agent lose knowledge of the initial premise simply by deducing too many consequences from it?

  5.  **The "Via" Relation:** You specify that the agent must track $q$ *via* $p$. Is this "via" relation a distinct cognitive process that needs its own tracking conditions, or is it merely the fact of deductive inference? If it requires its own tracking conditions, do we not face a regress of risk budgets for each inferential step?

  6.  **Comparison to Safety:** How does your risk-budgeted tracking differ substantively from a safety condition (like Pritchard's) that includes a risk threshold? If safety is roughly "no nearby error," and your budget is "no nearby error beyond threshold," have you not just rebranded safety as tracking?

  7.  **Cognitive Access:** Must the agent have any cognitive access to their remaining risk budget to know $q$? If the budget is purely external, can an agent know $q$ while reasonably believing they have exceeded their budget, and does this create a form of epistemic akrasia?

  8.  **Aggregation and Conjunction:** If I know $p_1$ and I know $p_2$, each within my risk budget, does conjoining them to believe $p_1 \land p_2$ require a new budget assessment? If the risks aggregate, does your view succumb to a version of the Lottery Paradox where I know each ticket will lose but cannot know the conjunction?

  9.  **Skeptical Invariance:** If the budget threshold is context-sensitive, what prevents a skeptic from shifting the context such that even mundane entailments exceed the budget? Is there a "floor" to the context below which skeptical scenarios cannot be brought on-budget, and if so, what grounds that floor?

  10. **Normative Force:** What is the normative source of the risk budget? Is it a pragmatic constraint on rational action, or a constitutive norm of belief? If it is pragmatic, why does it affect the factivity of knowledge; if it is constitutive, why does it vary by context?

