answer: |-
  This is a rich set of intuitions. You are effectively channeling Keynes's *Treatise* (logical relations, weight of evidence, non-measurability) while bumping against the Ramsey/Savage orthodoxy (probability *is* betting behavior, weight is irrelevant to the single case).

  Your working rule is 80% there, but it contains a fatal contradiction in the "Job Choice" case that undermines the whole structure. You say weight matters *only* where more evidence could arrive. Yet in the Job Choice, no more evidence can arrive, and you still prefer the better-evidenced 50%. If you prefer it, it must be affecting the decision. If it affects the decision, it must be part of the probability object, not just a heuristic for learning.

  Here is the diagnosis, the repaired principle, and the cost of admission.

  ### The Diagnosis: Where Your Rule Breaks

  1.  **The Bridge vs. Fire Distinction:** You treat the fire number (0.2%) as a *prediction* and the bridge number ($10^{-6}$) as a *constraint*. Your rule calls both "numbers produced from data plus a model," but your gut knows they are different logical types. The fire number is descriptive (frequency); the bridge number is normative (a safety bound derived from a model that is known to be incomplete).
  2.  **The Job Choice Paradox:** This is the critical failure point. If two hypotheses have the same probability $P(H) = 0.5$, and no further evidence is possible, standard decision theory says you must be indifferent. Your refusal to be indifferent implies that $0.5$ is not the full description of your state. You are implicitly treating the "fragile 50%" as an interval (e.g., $[0.2, 0.8]$) and the "robust 50%" as a narrow interval (e.g., $[0.49, 0.51]$). Your rule says "otherwise it's an interval," but then it says weight doesn't matter for one-shot decisions. That is inconsistent. If it's an interval, weight *always* matters for decisions because it determines the interval's width.
  3.  **The Ellsberg Tension:** You note the conflict between indifference (1/3 each) and preference (known urn). This is the definition of **Ambiguity Aversion**. Your rule tries to solve this with "intervals," but it needs a decision rule to tell you how to *act* on those intervals.

  ### The Principle: The Stability and Commitment Principle

  To save your intuitions while making them rigorous enough for a student, we need to move from a "Single Number" ontology to a "Set of Priors" ontology (akin to the Walley/Keynes/Gilboa-Schmeidler synthesis).

  **The Principle of Evidential Stability:**

  > **1. The Sharpness Condition:** A sharp probability number $p$ is licensed for an event $E$ if and only if the evidence establishes **Exchangeability** or **Symmetry**.
  > *   *Symmetry:* Logical or physical indistinguishability (dice, urns, digits of $\pi$).
  > *   *Exchangeability:* The event is a member of a reference class where the causal mechanism is stable and the frequency is empirically settled (actuarial fires).
  > *   *Case:* The fair die (Symmetry); The house fires (Exchangeability).
  >
  > **2. The Interval Condition:** Where Exchangeability and Symmetry fail, probability is not a number but a **Credal Set** (an interval $[p_{min}, p_{max}]$). The width of the interval is determined by the **Weight of Evidence** (the robustness of the model, the agreement of sources, the stability of the causal story).
  > *   *Case:* The friend's restaurant (Wide interval); The bridge failure (Effectively $[0, \text{target}]$, treated as a bound); The drifted ML model (Interval approaches $[0, 1]$).
  >
  > **3. The Decision Condition:** Rational choice maximizes **Security-Adjusted Expectation**. In the face of a Credal Set, the agent acts on the lower bound for gains and the upper bound for losses (MaxMin Expected Utility), discounted by the cost of ambiguity.
  > *   *Case:* The Job Choice. The "robust 50%" has a tight interval (e.g., $[0.48, 0.52]$). The "fragile 50%" has a wide interval (e.g., $[0.1, 0.9]$). Even if the means are identical, the MaxMin value of the robust option is higher. This explains why weight matters even in a one-shot decision.

  ### Applying the Principle to Your Hard Cases

  **1. The Bridge ($10^{-6}$) vs. Fires (0.2%)**
  *   **Verdict:** The Principle classifies these differently. Fires meet the Exchangeability condition (stable causal mechanism, large N). Bridges do not (unique design, no frequency data).
  *   **Implication:** The bridge number is not a probability in the sense of Clause 1. It is a *regulatory bound* derived from a model that fails Clause 1. You are correct not to aggregate them. Aggregating requires Exchangeability. A million unique bridges do not form a stable reference class if the error is systemic (model failure) rather than stochastic (random variation).
  *   **Student Instruction:** "Is the variation random (fire) or epistemic (bridge)? If epistemic, do not aggregate."

  **2. The Job Choice (Fragile vs. Robust 50%)**
  *   **Verdict:** Your working rule said weight shouldn't matter here. The Principle says it *must*.
  *   **Implication:** You are not choosing between two 50%s. You are choosing between $[0.49, 0.51]$ and $[0.1, 0.9]$. Under the Decision Condition (MaxMin), the robust option has a higher minimum value.
  *   **Student Instruction:** "If you cannot learn more, ask: 'What is the worst-case probability consistent with my evidence?' Bet on that."

  **3. Superforecaster (0.75) + Mechanistic Model (0.75)**
  *   **Verdict:** Do you have a genuine number? **No.**
  *   **Reasoning:** Unless the forecaster and the model are *causally independent* regarding their error sources, coincidence does not establish Stability. If both rely on the same underlying economic data or physical assumptions, the errors are correlated.
  *   **Implication:** This narrows the Credal Set (Clause 2), but it does not trigger Clause 1 (Sharpness). It is a *tighter interval*, not a point. You should treat it as $[0.70, 0.80]$ rather than $[0.60, 0.90]$, but still apply the Decision Condition (discount for ambiguity).
  *   **Student Instruction:** "Agreement narrows the interval; it does not collapse it to a point unless the sources are independent and the mechanisms are exchangeable."

  **4. Settled but Unknown Facts (Life on Mars)**
  *   **Verdict:** Ontologically 0 or 1. Epistemically, a wide Credal Set.
  *   **Reasoning:** Fails Exchangeability (only one Mars). Fails Symmetry.
  *   **Implication:** You cannot use frequency. You must use analogy (Earth-like planets). Since the reference class is thin, the interval is wide.
  *   **Student Instruction:** "Treat singular past events like singular future events. No frequency, no sharp number."

  **5. Drifted ML Model (0.62)**
  *   **Verdict:** The number is void.
  *   **Reasoning:** Fails Exchangeability explicitly. The training distribution $\neq$ the world distribution.
  *   **Implication:** The Credal Set expands to near $[0, 1]$. The output 0.62 is noise.
  *   **Student Instruction:** "If the causal stability condition is broken, the model output is decorative."

  ### The Sacrifice: What You Must Give Up

  You asked me to be straight about which verdict your principle can't save. To adopt the **Stability and Commitment Principle**, you must abandon one specific intuition you held in your working rule:

  **You must give up the claim that "Weight of evidence... matters for what I should do, but only where more evidence could still arrive in time to change things."**

  This is the Ramseyian ghost in your machine. Ramsey argued that if you can't learn more, weight is irrelevant. You correctly sensed this was wrong in the Job Choice case, but your rule tried to preserve it.
  *   **Why it must go:** If weight determines the *interval width* (Clause 2), and interval width determines the *security-adjusted value* (Clause 3), then weight *always* matters for decision-making, even in the final, one-shot case.
  *   **The Cost:** You have to admit that when you said "It's 50%" for the fragile startup, you were speaking loosely. Strictly speaking, you were saying "My best guess is 50%, but my commitment level is low." The Principle forces you to make the commitment level part of the probability claim itself.

  ### Rival Principle (The Ramseyian Challenge)

  If you find the Interval/MaxMin approach too messy for your students, the only coherent rival is **Ramsey's Betting Quotient**:

  > **The Principle of Commitment:** Probability *is* the price at which you are willing to buy or sell a bet.
  > *   If you are indifferent between the Fragile 50% and Robust 50%, they are the same probability.
  > *   If you prefer the Robust 50%, then your probability for the Fragile one is *not* 50% (it is lower).
  > *   The Bridge $10^{-6}$ is not a probability; it is a utility constraint (a loss so bad we act *as if* the prob is higher).

  **Why I recommend rejecting the Rival:** It forces you to say the Bridge number is "not a probability," which you already suspect, but it also forces you to say your preference in the Job Choice is *irrational* if you claim both are 50%. It dissolves the "Weight" concept entirely. Given your Keynesian leanings and the Ellsberg intuitions, the **Stability and Commitment Principle** is the one that saves your phenomenology of the cases.

  ### Final Advice for the Seminar

  Hand your students the **Stability and Commitment Principle**. Tell them:
  1.  **Sharp numbers are a privilege, not a right.** They are earned by symmetry or stable frequency.
  2.  **Intervals are the default.** When in doubt, widen the interval.
  3.  **Weight is structural.** It is not a feeling about the number; it is the width of the interval.
  4.  **Decisions respect the lower bound.** In the face of ambiguity, security trumps expected value.

  This saves your Bridge intuition (it's a bound, not a freq), your Ellsberg intuition (ambiguity aversion is rational), and your Job Choice intuition (weight matters in one-shots). The only thing it kills is the idea that you can have a sharp number without stable exchangeability.
