      *   *Normative:* The "collapse into preference" critique is strong against *subjective* normativism. However, *objective* normativists (like Nordenfelt) talk about "vital goals" necessary for minimal happiness, not just any whim. *Verdict:* Mostly fair, but nuance the "preference" part. It's not just *any* goal, but *vital* goals.

