prompt: |-
  I'm taking a course on conceptual analysis and me and my friends got into a row in the pub about Wittgenstein — my mate thinks family resemblance is just philosophers being too lazy to bother with proper definintions, and I want a piece that takes the view seriously but pushes it into absurd bureaucratic territory. Could you write me a deadpan FAQ page, around 600 words, for the fictional Borough of Ostensive Definitions planning office? The voice should be pure bureaucratic neutrality — think council tax guidance — explaining how residents apply for licences, report crimes, or claim art-status for objects without being able to cite necessary and sufficient conditions. The target is the over-application of Wittgenstein's idea that concepts hang together through overlapping similarities rather than shared essences, plus the claim that meaning is fixed by public langauge-game practice rather than private mental states. So include a section referencing the thread-spinning analogy, a rejection of crystalline purity in administrative law, and a Private Language Ordinance fining citizens for using words outside ratified communal use. The humour must come from actually getting the philosophy right — e.g. rules don't determine use in advance, asking for an essence is a kind of philosophical confusion — not from inventing fake ideas. It should be readable to someone who's never read the later work but feel fair to someone who knows it well. Keep the irony sustained and deadpan: flat prose, no winking, no breaking character. Please end with a single sentence on its own line summarising the satire's underlying point about family resemblance in public policy.

  Make it readable and don't hold back on the absurdity — I want it to feel like a real council document that accidentally swallowed a philosophy textbook.
