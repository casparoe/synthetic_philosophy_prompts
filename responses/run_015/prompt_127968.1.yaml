      *   Conclusion: Consent is a tool, not a natural kind.

  7.  (Final Polish of the text to ensure clarity and flow.) *Self-correction: Ensure I don't sound like I'm defending the inconsistencies, but explaining the logic behind them.*

  8.  *Wait, one more check on the Medical Battery point.* In some US jurisdictions, lack of informed consent *can* be battery, but the trend is overwhelmingly negligence. I should clarify that distinction because it impacts the "validity of yes" argument. If it's negligence, the "yes" *did* count, but the doctor was careless. If it's battery, the "yes" was void. The user says "your yes didn't count." I need to correct this gently. *Decision:* I will explain that modern law mostly treats it as negligence, which actually supports the user's suspicion that it's a "duty of care" rule.

