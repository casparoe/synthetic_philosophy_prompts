      *   *Make sure to address the "event-under-a-description" point.* This is a philosophical nugget (Anscombe-ish). I should explicitly use that language.
      *   *Check the 15-year-old point.* In the US, it varies by state. In the UK, *Gillick* is the standard. I should speak generally about the *principle* rather than specific jurisdiction unless necessary. I'll stick to the general jurisprudential logic.

  6.  **Final Structure:**
