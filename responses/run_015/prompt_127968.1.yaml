answer: |-
  You have fallen into one of the deepest, messiest rabbit holes in jurisprudence. You are absolutely right to feel that the law is not operating with a single, coherent definition of "consent." In fact, legal philosophers often argue that "consent" is not a natural kind (like water or gold) but a **legal conclusion** that serves different policy goals in different contexts.

  Here is a breakdown of what the practices presuppose, where they diverge, and why the "Swap Test" fails to capture the legal reality.

  ### 1. What does each practice presuppose consent *is*?

  You asked if consent is a mental state, a speech act, a permission, or a waiver. The answer is that medicine and sex law answer this differently.

  **Medicine: Consent as "Autonomous Authorization"**
  In modern medical law (post-*Canterbury v. Spence* in the US, *Montgomery* in the UK), consent is treated as a **waiver of bodily integrity conditional on understanding.**
  *   **The Presupposition:** Your body is your sovereign territory. For the state to allow a doctor to invade it, your permission must be *meaningful*. Meaningful permission requires information.
  *   **The "Yes":** It is not just a speech act ("I agree"). It is a procedural status. If the procedure for obtaining the yes was flawed (no disclosure of risks), the law treats the authorization as defective.
  *   **Correction on Battery:** You mentioned that skipping a risk makes the touching "battery." This is actually a common misconception. In older law, yes, lack of informed consent was battery. In modern law, it is almost always **negligence**. This is a crucial distinction.
      *   *Battery* means "you touched me without permission."
      *   *Negligence* means "you touched me with permission, but you breached a duty of care in how you got it."
      *   *Why this matters:* If it were battery, your "yes" would be void (as you thought). Because it is negligence, your "yes" *did* count, but the doctor is still liable for the harm caused by the lack of information. This suggests medicine views consent as a **process**, not a moment.

  **Sex: Consent as "Concurrence of Will to the Physical Act"**
  Criminal law regarding sex is much more conservative. It generally treats consent as **agreement to the physical nature of the act.**
  *   **The Presupposition:** The criminal law is a blunt instrument. It aims to punish violations of bodily autonomy, not breaches of trust or disappointment.
  *   **The "Yes":** It is treated more like a **speech act or mental state regarding the physical event.**
  *   **Event-under-a-description:** You hit on a profound philosophical point (reminiscent of Elizabeth Anscombe). When you consent to "sex," are you consenting to *friction* or *friction-with-this-person-under-these-conditions*?
      *   The law draws a hard line: It protects the *nature of the act* (factum) but rarely the *inducements* (fraud in the inducement).
      *   If I pretend to be your husband (identity), the act is physically different to you than sex with a stranger. That vitiates consent.
      *   If I pretend to be a millionaire (attributes), the physical act is the same. The law says you consented to the *physics*, even if you were tricked about the *context*.
      *   *Stealthing (condom removal):* This is the current battleground. Courts that criminalize this are effectively saying: "You consented to *safe* sex, not *unsafe* sex. They are different acts." This moves sex law closer to the medical model (consent to a specific description of the event).

  ### 2. Presupposition vs. Pragmatism (The "Real" Reason)

  You asked if these rules are theoretical or just practical fits. The answer is overwhelmingly **pragmatism.**

  **Medicine: Duty of Care in Costume**
  You suspected the medical rule is a "duty-of-care rule wearing a consent costume." You are largely right.
  *   The shift from battery to negligence in informed consent cases proves this. The law isn't really asking, "Did the soul of the patient agree?" It is asking, "Did the doctor meet the professional standard of disclosure?"
  *   **Why?** Because if every undisclosed risk made the surgery a battery (a criminal/intentional tort), doctors would practice "defensive medicine," ordering unnecessary tests or refusing risky but necessary procedures. The law balances patient autonomy against the social utility of medical practice.

  **Sex: Evidentiary and Liberty Constraints**
  The narrowness of the sex rule is driven by two fears:
  1.  **Evidentiary Chaos:** If lying about being single vitiated consent, every bitter breakup could become a rape trial. "He said he loved me, he didn't, therefore it was rape." The courts cannot adjudicate subjective emotional reliance.
  2.  **Sexual Liberty:** If the "Swap Test" applied (would you have said yes if you knew the truth?), almost all seduction would be criminalized. Seduction often involves highlighting positives and hiding negatives. The law draws a bright line at "identity" and "nature of act" to preserve a zone of private sexual negotiation that the state won't police.

  ### 3. The Cross-Application Thought Experiment

  What happens if we swap the theories?

  **Scenario A: Medical Rules applied to Sex**
  *   **The Rule:** Partners have a duty to disclose all "material risks" a "reasonable person" would want to know (STIs, marital status, financial debt, emotional availability).
  *   **The Consequence:** Sex becomes a contract negotiation. Failure to disclose an STI is already criminal in many places (bridging the gap). But failure to disclose a spouse? A debt? A fetish?
  *   **What Breaks:** Privacy and spontaneity. It creates a "duty to speak" in intimate relationships that many argue is incompatible with how human intimacy works. It turns sex into a regulated transaction.

  **Scenario B: Sex Rules applied to Medicine**
  *   **The Rule:** *Caveat Emptor* (Buyer Beware). The doctor only needs to tell you what you explicitly ask. If you don't ask about the risk of paralysis, and you get paralyzed, you consented. Fraud only matters if the doctor pretends to be a different doctor (identity) or performs a different surgery (nature of act).
  *   **The Consequence:** Patients are on their own. The power imbalance between doctor (expert) and patient (layperson) is ignored.
  *   **What Breaks:** Trust in the medical system. Patients would assume doctors are hiding risks. The "therapeutic alliance" would collapse. The law recognizes that in medicine, you *cannot* know what to ask unless you are told what the risks are. In sex, the law assumes you *do* know what the act is.

  ### 4. Is the Pattern Underdetermined?

  Yes. There is no "fact of the matter" about what consent *really* is.
  *   **Theory A (Autonomy):** Consent is about self-determination. (Supports broad medical disclosure, broad sexual fraud laws).
  *   **Theory B (Reliance):** Consent is about protecting reasonable reliance. (Supports medical negligence, limits sexual fraud to identity).
  *   **Theory C (Bodily Integrity):** Consent is about physical boundaries. (Supports narrow definitions in both, focusing only on the touch).

  The law picks and chooses from these theories based on **policy goals**.
  *   In medicine, the goal is **welfare + autonomy**. So we lean toward Theory A.
  *   In sex, the goal is **punishing violation + preserving liberty**. So we lean toward Theory C, with a dash of Theory B.

  The inconsistency you see isn't a bug; it's a feature of a legal system that tries to solve different social problems using the same word.

  ### 5. The Age/Competence Paradox

  This is the sharpest observation in your query. Why can a 15-year-old consent to an abortion or chemotherapy but not to sex with a 21-year-old?

  This confirms that **competence is not a property of the person; it is a property of the relationship and the risk.**

  *   **Sex (Protective Paternalism):** The law assumes a structural power imbalance between a child and an adult that makes *any* sexual agreement inherently coercive. The harm being prevented is **exploitation**. The law says, "You are not capable of navigating the power dynamics here, so we forbid the act entirely to protect you from adults."
  *   **Medicine (Welfare Paternalism):** The law assumes that denying treatment causes **harm to health**. If a 15-year-old understands the treatment (Gillick competence/Mature Minor doctrine), preventing them from consenting hurts *them*. The law says, "You are capable of understanding this risk, and blocking you causes physical harm, so we allow it."

  **Does "Consent" do different work?**
  Yes.
  *   In **Sex**, consent is a **shield** for the accused (proving the act wasn't violent) and a **gate** for the state (preventing exploitation).
  *   In **Medicine**, consent is a **mechanism of liability** (shifting risk to the patient) and a **right of refusal**.

  ### Summary

  Your friend's "Swap Test" is essentially a **Subjective Counterfactual Test** (*"Would I have agreed if I knew?"*).
  *   **Medicine** rejects the pure Swap Test because it uses a **Reasonable Patient Standard** (objective). It doesn't matter if *you* wouldn't have cared about the risk; if a *reasonable person* would have, the doctor must tell you.
  *   **Sex** rejects the Swap Test because it uses a **Categorical Standard**. It doesn't matter if *you* wouldn't have slept with him if you knew he was married; the law says marital status is not a valid category for vitiating consent.

  The law is not trying to be philosophically consistent about the metaphysics of consent. It is trying to balance **Autonomy** (your right to choose), **Welfare** (protecting you from harm), and **Administrability** (can we actually run trials on this?).

  *   Medicine prioritizes Autonomy + Welfare.
  *   Sex Law prioritizes Administrability + Liberty (for the accused) + Protection (for the young).

  You haven't found a contradiction in your understanding; you've found the seams in the legal fabric. "Consent" is just the label we stick on whichever balance of those values the legislature decided on for that specific situation.
