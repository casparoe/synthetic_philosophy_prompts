prompt: |-
  ok so i fell into a rabbit hole about consent a while back and now im not even sure the law has *one* idea of what consent is. i'd like you to tell me what each bit of the practice presupposes.

  here's what i think i know (correct me if i've got any of it wrong). if a surgeon is about to operate, they have to tell you the things a reasonable patient would want to know — the alternatives, the risks, even fairly unlikely ones — and if they skip a risk and that risk then happens, the touching can count as battery, i.e. as if you never said yes at all. this is true even if the operation itself went perfectly and even if you'd probably of agreed anyway. so medicine: a duty to volunteer information, and the penalty is "your yes didn't count."

  but with sex, at least as i understand it, the criminal law is weirdly relaxed. lie about your job, your money, whether you're single, whether you love them, and apparently the consent still stands: rotten thing to do, but not the kind of lie that touches validity. lie about what the act actually is, or about who you are (pretending to be someone's partner), or secretly take the condom off, and suddenly it does. and i've read that places disagree with each other about lying over STI status, which is the one case that looks exactly like the medical case — its a lie about a *risk* rather than about the act.

  my friend has a name for what she thinks medicine is doing. she calls it the swap test: rerun the whole scene with the true facts swapped in, and if the person wouldn't have said yes, the consent is void. i sort of like it, but it seems to blow up. the person lied to about their partner's marital status would obviously have refused, so the swap test says that consent is void too, which makes the legal line look arbitrary. and it blows up the other way as well: there are undisclosed risks that wouldn't have changed anyone's mind, and medicine still cares about those, so the medical rule isn't really the swap test either.

  so, the things i actually want:

  1. what does each practice presuppose consent *is*? a mental state, a speech act, a permission with a scope set by the description it was given under, an autonomous choice, a waiver of a claim? and does the sex rule secretly presuppose a view about how finely you individuate the act — like, when i consent to "sex with you," is the thing i consented to the bare physical event or the event-under-a-description?

  2. how much of this is strictly presupposed versus just a good fit? could the medical rule really be a duty-of-care rule wearing a consent costume? could the narrowness of the sex rule come from evidential worries about trials — that any wider test is unprovable — rather than from a theory of consent at all?

  3. if you plugged the medical theory into the sex cases, or the sex theory into the doctor's office, what would concretely change in the rules, and would anything that seems obviously right break?

  4. is the pattern just underdetermined — could three quite different theories all generate it, so that there's no fact of the matter about what the practice "presupposes"?

  and one last bit that makes it weirder for me: the same systems that say a 15-year-old can't consent to sex with a 21-year-old will happily treat a 15-year-old as competent to consent to medical treatment, or to refuse it. so competence looks like a property of the person-plus-the-situation rather than of the person. does anything in your answer explain that, or is "consent" doing completely different work in the two places?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Issue:** The user is confused about the apparent inconsistency in how "consent" is treated in medical law (informed consent) versus criminal sexual assault law (fraud/vitiation of consent).
      *   **User's Current Understanding:**
          *   *Medicine:* Duty to disclose risks/alternatives (reasonable patient standard). Failure = battery (no consent), even if outcome was good or patient would have agreed anyway.
          *   *Sex:* Fraud as to identity/nature of act vitiates consent. Fraud as to attributes (money, status, love) does not. STI status is a grey area.
          *   *Friend's Theory:* "The Swap Test" (counterfactual: would you have said yes if you knew the truth?). User thinks this fails for both domains (over-inclusive for sex, under-inclusive for medicine).
      *   **Specific Questions:**
          1.  What does each practice presuppose consent *is*? (Mental state, speech act, permission, autonomy, waiver?)
          2.  Presupposition vs. Pragmatism? (Is medical law actually just duty of care? Is sex law just evidentiary?)
          3.  Cross-application? (What happens if we swap the theories?)
          4.  Underdetermination? (Are there multiple valid theories?)
          5.  Age/Competence Paradox? (Why can a 15-year-old consent to meds but not sex?)

  2.  **Initial Fact-Checking & Nuance Correction:**

      *   *Medical Law:* The user says if a risk is skipped and happens, it counts as *battery*. This is technically outdated in many jurisdictions (like the UK post-*Montgomery* or US tort law). Usually, lack of informed consent is *negligence*, not battery, unless the procedure itself was unauthorized (e.g., operating on the wrong knee). Battery is for *no* consent or *different* procedure. Negligence is for *inadequate* disclosure. I need to clarify this distinction because it changes the "what is consent" analysis.
      *   *Sexual Law:* The user is generally right about "fraud in the factum" (nature of act/identity) vs. "fraud in the inducement" (attributes). Stealthing (condom removal) is increasingly treated as vitiating consent, but it varies by jurisdiction. STI transmission is often a separate statutory offense, not always "rape by fraud."
      *   *The "Swap Test":* The user is right that the law doesn't strictly follow a subjective counterfactual test in either domain.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the rabbit hole. Validate that the law is indeed messy and inconsistent.

      *   **Question 1: What is Consent? (The Ontology)**
          *   *Medicine:* It's not just "yes." It's *Informed Consent*. It presupposes consent is an **autonomous authorization**. It's a waiver of rights *conditional* on understanding. It treats the body as a temple of autonomy.
          *   *Sex:* It's often treated as **concurrence of wills** regarding the *physical act*. The law is wary of policing motives. It presupposes consent is about the *nature of the act*, not the *contextual benefits*.
          *   *Addressing the "Description" point:* Yes, sex law individuates acts finely. "Sex" isn't just friction; it's "sex *with this person* under *these conditions*." But the law draws a hard line on which conditions matter.

      *   **Question 2: Presupposition vs. Pragmatism (The Realism)**
          *   *Medicine:* Is it duty of care in costume? Yes, largely. The shift from battery to negligence (*Canterbury v. Spence*, *Montgomery*) proves this. It's about professional standards, not just metaphysical consent.
          *   *Sex:* Is it evidentiary? Yes. If every lie about money vitiated consent, the courts would be flooded, and it would criminalize normal dating exaggeration. The "nature of the act" rule is a bright-line heuristic to avoid probing subjective motives.

      *   **Question 3: Cross-Application (The Thought Experiment)**
          *   *Medical Theory -> Sex:* If doctors' disclosure rules applied to sex, you'd need a "reasonable partner" standard. "I didn't tell you I have an STI/herpes" = assault. "I didn't tell you I'm married" = assault? This would criminalize a huge swath of sexual behavior. It creates a "duty to disclose" in intimate life.
          *   *Sex Theory -> Medicine:* If sex rules applied to doctors, doctors only need to tell you what you ask (caveat emptor). If you don't ask about nerve damage, and you get nerve damage, you consented. This destroys patient autonomy and trust.
          *   *What breaks?* Medical trust breaks with sex rules. Sexual privacy/freedom breaks with medical rules.

      *   **Question 4: Underdetermination (The Philosophy)**
          *   Is there a "fact of the matter"? No. Law is a tool, not a philosophy textbook. It balances competing values (Autonomy vs. Certainty vs. Privacy vs. Welfare). The inconsistency reflects different policy goals, not a single coherent theory of consent.

      *   **Question 5: The Age/Competence Paradox (The Context)**
          *   *Why the difference?* It's about *protection* vs. *welfare*.
          *   *Sex:* The law assumes a power imbalance/exploitation risk with adults. It's a protective ban (status-based).
          *   *Medicine:* The law prioritizes health outcomes. If a minor needs life-saving treatment, blocking it harms them. "Gillick competence" (UK) or "Mature Minor" (US) doctrines allow situational competence.
          *   *Conclusion:* Competence is indeed contextual. Consent isn't a magic key; it's a legal mechanism serving different social ends.

  4.  **Refining and Polishing:**

      *   *Tone:* Keep it analytical, empathetic to the confusion, and precise. Avoid legalese where possible, but use correct terms (battery vs. negligence, fraud in factum vs. inducement).
      *   *Correction on Medical Battery:* I must explicitly correct the user's assumption that nondisclosure is usually battery. It's usually negligence. This is crucial for the "what is consent" question. Battery is for *touching without permission*. Negligence is for *touching with permission but based on bad info*.
      *   *The "Swap Test":* Validate the friend's intuition but explain why the law rejects pure subjectivity (the "reasonable person" standard in medicine, the "nature of act" standard in sex).

