answer: |-
  ### Candidate Framings

  Three existing concepts approach your phenomenon, yet each fractures against the specific geometry of your cases.

  **1. Invented Tradition (Hobsbawm)**
  This framing captures the *construction* and the *recent origin*. It correctly identifies that the practice is not ancient but manufactured. However, it silently drops the *intent*. Hobsbawm's model presumes top-down legitimation of state or institutional power. Your cases are bottom-up, driven by affection and rescue, not political legitimation. The teacher in the 1930s was not securing state authority; she was preventing loss. To use this label is to impute a cynicism absent from the archive.

  **2. Folklore Revival**
  This captures the *benevolent intent* and the *salvage motivation*. It acknowledges the actors believe they are saving something dying. However, it drops the *epistemic loop*. Standard revivalism assumes a distinction between the old practice and the new enthusiasm. It does not account for the document becoming the proof of the practice's antiquity. In your cases, the revival *is* the origin, yet it is read as a continuation. Revivalism lacks the vocabulary for this evidential inversion.

  **3. Fakelore (Dorson)**
  This captures the *inauthenticity* and the *fabrication*. It highlights the discrepancy between the claim (ancient) and the reality (recent). However, it silently drops the *downstream uptake*. 'Fakelore' implies a contaminant, something false that should be discarded. Yet your cases show the practices successfully binding families, marking marriages, and organising calendars. They have become socially real. To call them fakelore is to deny their current ontological status as functioning traditions.

  ### The Committed Concept: Constitutive Salvage

  None of these fit because they prioritise either the origin (Invented Tradition), the intent (Revival), or the authenticity (Fakelore). The phenomenon you describe is defined by the *loop* itself. I propose we call this **Constitutive Salvage**.

  In Constitutive Salvage, the act of recording does not merely describe a practice; it constitutes it. The document is not a mirror reflecting a pre-existing reality; it is the mould into which the fragments are poured to create a new whole. The 'salvage' is genuine—the fragments are real—but the object saved is new. The concept fits best because it preserves the six features you listed, specifically the evidential inversion. It acknowledges that the archive creates the object it claims to find. The 1933 booklet is not a record of the dance; it is the dance's birth certificate, misread as a genealogy.

  This framing respects the philosopher's interest in social kinds. A social kind is defined by its causal role in the world, not its metaphysical genesis. Constitutive Salvage names the mechanism by which a recent artifact acquires the causal power of an ancient one. It explains the competitive diffusion: districts are not copying traditions; they are copying the *success* of the constitutive act.

  ### Boundaries and Continuity

  You ask whether a case where collectors *were* recording something continuous counts as the same phenomenon. Under Constitutive Salvage, **yes**. If the social function is identical—if the practice binds the community and organises time—the historical genesis is a secondary property. You often cannot tell the two apart by inspecting the practice itself because the practice is the same kind of object: a pattern of behaviour endowed with meaning.

  To discriminate them in principle, you require **positive external evidence**. The absence of evidence cannot be used, as you noted, because absence has been reinterpreted as proof of oral depth. Only a positive record predating the constitutive act (e.g., a diary from 1800 describing the *specific* suite of steps, not just 'dancing') can break the loop. Without this, the two cases are functionally indistinguishable social kinds. The 'old' tradition and the 'constituted' tradition occupy the same space in the social ecosystem. To distinguish them is to privilege historical accuracy over social function, which is a historian's preference, not a sociological necessity.

  ### The Verdict on Debunking

  Finally, does the verdict that a practice was assembled in 1933 carry debunking force? **No.** The origin question is beside the point regarding the practice's validity as a tradition.

  The debunkers assume that 'tradition' requires antiquity. The defenders assume that 'tradition' requires continuity. Both are mistaken. Tradition requires **transmission and meaning**. The 1933 suite has been transmitted for ninety years; it holds meaning for the residents; it marks significant life events. It *is* a tradition, regardless of its genesis. The 'false belief' about antiquity is part of the tradition's mythology, not a condition of its existence.

  To debunk the origin is to attack a historical claim, not a social fact. The social fact is that the dance binds the valley. Revealing the 1933 origin does not dissolve the binding; it merely changes the story the valley tells about itself. In Constitutive Salvage, the 'lie' is not a defect; it is the structural glue. The value of the practice lies in its current capacity to organise life, not in the depth of its roots. To insist otherwise is to confuse the archive with the community. The archive certifies the past; the community certifies the present. In your cases, the community has spoken.
