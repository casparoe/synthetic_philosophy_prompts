      *   **King Arthur:**
          *   *Claim:* Legend because no contemporary admin records (charters/tax). Welsh annals are too late.
          *   *Reality:* This is the standard "Historicist vs. Mythicist" debate. Most mainstream historians (e.g., Nick Higham, Guy Halsall) lean towards Arthur being a legendary figure or a composite, largely due to the lack of contemporary evidence. The *Annales Cambriae* are indeed 10th century.
          *   *Nuance:* The demand for a "charter or tax record" is a bit anachronistic for 5th/6th-century Sub-Roman Britain. That administrative machinery had largely collapsed. Demanding a tax record for a post-Roman warlord is like demanding a payslip for a Viking jarl. Oral tradition was the norm. However, the *point* stands: there is no contemporary mention.

