answer: |-
  Here is a principle that unifies your verdicts, followed by an analysis of where the philosophical tension lies.

  ### The Principle: Maintenance of Binding Intent

  **Akrasia (weakness of will) occurs if and only if an agent fails to maintain a binding constraint (internal or external) that was established by their deliberative self to protect a long-term preference, without new information justifying the change.**

  This principle distinguishes between **preference reversal** (which is just hyperbolic discounting and happens to everyone) and **akrasia** (which is the failure to manage that reversal). It relies on three components:
  1.  **Deliberative Intent:** A plan formed during a "cool" state (e.g., 11pm).
  2.  **Binding Mechanism:** A strategy to enforce that plan (willpower, alarm clock, contract, timer).
  3.  **Maintenance:** Successfully keeping that mechanism active until the temptation passes.

  ### How the Principle Maps to Your Cases

  1.  **Classic Snooze:** You had intent (wake at 7). You had a mechanism (alarm). You failed maintenance (hit snooze). **Verdict: Akrasia.** (Matches your gut).
  2.  **Alarm Across Room:** Intent (wake). Mechanism (physical distance). Failed maintenance (crawled back). **Verdict: Akrasia.** (Matches your gut; the higher cost makes the failure more salient, but the structure is identical).
  3.  **App Lock:** Intent (no social media). Mechanism (software lock). Maintenance **held** (you couldn't check it). **Verdict: Not Akrasia.** (Matches your gut). It is a victory of *planning*, not willpower. The " Binding Intent" was maintained by the app, not your muscles.
  4.  **Standard Pre-commitment ($110):** Intent (take $110). Mechanism (contract). Maintenance **held** (contract forced compliance). **Verdict: Not Akrasia.** (Matches your gut). You successfully outsourced the maintenance of your intent.
  5.  **Strategic Self-Sabotage ($100):** Intent (at t=0, you decide to lock in $100). Mechanism (contract). Maintenance **held** (you get $100). **Verdict: Not Akrasia.**
      *   *Why it differs from Case 4:* In Case 4, your t=0 self *defeats* your t=30 self. In Case 5, your t=0 self *capitulates* to your t=30 self. However, because you followed through on the t=0 decision (to lock in the $100), there is no violation of intent *at the moment of action*. This is **Rational Resignation**, not weakness of will. You acknowledged your weakness and planned around it, even if the plan was suboptimal.
  6.  **Cooling-off Timer:** Intent (don't eat cookie). Mechanism (timer that flattens discount rate). Maintenance **held**, but the mechanism changed the *preference* rather than just the *constraint*. **Verdict: Preference Transformation.**
      *   This is not "willpower" in the classic sense (overcoming a desire) because the desire was dissolved. It is **Self-Modification**. You didn't resist the cookie; you changed the self that wants the cookie.
  7.  **Timer Disable:** Intent (wait 10 mins). Mechanism (timer). Failed maintenance (disabled at min 3). **Verdict: Akrasia.** (Matches your gut). You broke the binding constraint you set for yourself.

  ### Prediction for the Timer-Disable Case
  The principle predicts **Akrasia** with high confidence. Even though a timer is an external tool, disabling it manually is an act of the "impulsive self" overriding the "deliberative self's" safety mechanism. It is structurally identical to the snooze button: a deliberate dismantling of a constraint established to protect a long-term goal.

  ### Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that this principle captures the structural logic of decision theory regarding time inconsistency (Strotz/Ainslie models). It successfully separates *hyperbolic discounting* (the psychological phenomenon) from *akrasia* (the normative failure). Your gut verdicts are remarkably consistent with the standard "sophisticated agent" model in behavioral economics.

  **The Point of Least Certainty: The Normative Status of Case 5 (Strategic Self-Sabotage)**
  I am least sure about the philosophical weight of **Case 5**.
  *   **The Tension:** My principle says Case 5 is *not* akrasia because you followed your t=0 plan. However, many philosophers argue that capitulating to anticipated weakness is itself a form of agency failure. If your t=0 self *prefers* $110 but locks in $100, you are acting against your t=0 *outcome preference*, even if you are acting in line with your t=0 *belief about your capabilities*.
  *   **Why it matters:** If we call Case 5 "Rational," we imply that giving up on your better self is a valid strategy. If we call it "Weakness," we imply that you should have tried to bind yourself to the $110 even if you thought you'd fail.
  *   **My Lean:** I lean toward calling it **Rational Resignation** (not akrasia) because akrasia requires a *reversal* between decision and action. In Case 5, decision and action align. The "weakness" happened in the *formation* of the plan, not the *execution*.

  **Secondary Uncertainty: Case 6 (Cooling-off)**
  There is debate over whether changing your preferences (flattening the discount rate) counts as "willpower."
  *   **View A:** Willpower is resisting desire. If the desire is gone, it's therapy, not will.
  *   **View B:** Willpower is self-governance. Governing your desire-formation is the highest form of will.
  *   **My Principle's Stance:** It classifies this as **Self-Modification**. Whether you label that "willpower" is semantic, but it is distinct from the "resistance" model of Cases 1 and 2.

  ### Summary
  You don't need to sacrifice any of your core verdicts. Your intuition is tracking the difference between **failure of execution** (akrasia) and **success of constraint** (pre-commitment/outsourcing).

  *   **Akrasia:** 1, 2, 7 (Failure to maintain constraint).
  *   **Strategic Management:** 3, 4 (Successful maintenance of constraint).
  *   **Edge Cases:** 5 is Resignation (Planning failure, not execution failure); 6 is Transformation (Preference change, not resistance).

  The principle holds: **Akrasia is not having conflicting preferences; it is failing to enforce the preference you endorsed when you were capable of reasoning clearly.**
