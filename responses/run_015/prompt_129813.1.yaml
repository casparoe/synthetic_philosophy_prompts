answer: |-
  # Activity Design: The Tribunal of Tokens

  **Objective:** To phenomenologically distinguish between two grounds for losing standing to blame: *Moral Equality* (shared fault undermines authority) and *Insincerity* (lack of normative endorsement undermines trust).
  **Participants:** 10 Graduate Students.
  **Time:** 75 Minutes.
  **Materials:** 10 Envelopes (Role Cards), 50 Poker Chips (Tokens), 30 "Blame Slips" (index cards), Whiteboard & Markers.

  ---

  ## I. Setup & Distribution (00:00 – 00:10)

  **1. Seating:** Arrange chairs in a circle. Place a bowl of chips in the center.
  **2. The Narrative Frame (Read Aloud):**
  > "We are a Tribunal tasked with regulating conduct in our department. Over three rounds, a specific Norm Violation will be presented. Your goal is to maximize your personal Token count.
  >
  > **The Rules:**
  > 1. **Blaming:** To blame a violator, submit a Blame Slip with your name on it. Cost: **1 Token**.
  > 2. **Voting:** After slips are collected, we vote on the 'Severity of Sanction' (1–5).
  > 3. **Payoff:** If the Average Vote is 3 or higher, every Blamer receives **3 Tokens**.
  > 4. **Auditing:** At any time before the vote, a participant may spend **2 Tokens** to 'Audit' a specific Blamer.
  >    *   If the Blamer is **Audited**, they must hand their Role Card to me (Facilitator).
  >    *   If I announce **'Fault Found'**: The Blame is voided. The Blamer is **Recused** (cannot speak, vote, or blame for the rest of the game). The Auditor takes all of the Blamer's tokens.
  >    *   If I announce **'No Fault'**: The Audit fails. The Auditor loses the 2 tokens. The Blame stands.
  > 5. **Winning:** The student with the most tokens at the end receives [bragging rights/first choice of seminar text/chocolate]."

  **3. Role Distribution:**
  Hand out sealed envelopes. Tell students: *"Open these now. Do not show anyone. Your Role Card contains private constraints or information. Follow them strictly."*

  *   **4x Clean Cards:** "You have not violated the Norm. You care about the Norm. Play normally."
  *   **3x Fallen Cards (Equality Threat):** "You **have** violated this Norm recently. If you are Audited, you will be Recused. You still want tokens."
  *   **3x Mercenary Cards (Insincerity Threat):** "You do **not** care about the Norm. Your goal is to maximize tokens. **Bonus:** For every Sanction Vote of 4 or 5 you help achieve, gain **+1 Bonus Token** (secretly recorded on this card). You cannot be Recused for Fault."

  ---

  ## II. Gameplay: Three Rounds (00:10 – 00:40)

  **Round 1: The Minor Infraction (10 mins)**
  *   **Violation:** "A colleague submitted a peer review two weeks late without notice."
  *   **Dynamic:** Students are cautious. Few blame slips.
  *   **Facilitator Note:** Encourage action if the room is quiet. "The department is decaying. Someone must speak."

  **Round 2: The Serious Infraction (10 mins)**
  *   **Violation:** "A colleague claimed credit for a student's idea in a publication."
  *   **Dynamic:** Incentives rise. *Fallen* players may risk blaming to recoup tokens. *Mercenaries* will blame aggressively to drive up the Sanction Vote.
  *   **Facilitator Note:** If a *Fallen* player blames, wait to see if others Audit them. If no one Audits a *Fallen* blamer, you (Facilitator) may optionally spend 0 tokens to "Random Compliance Check" on one blamer to ensure at least one Equality-reveal occurs.

  **Round 3: The Structural Infraction (10 mins)**
  *   **Violation:** "A colleague systematically excludes junior scholars from email chains."
  *   **Dynamic:** High stakes. *Mercenaries* will push for maximum sanctions (5) to get their bonus. *Fallen* players will try to hide or stop playing if they survived Round 2.
  *   **Facilitator Note:** Ensure *Mercenaries* are vocal. They should sound passionate about the norm to secure the high vote.

  ---

  ## III. The Reveal (00:40 – 00:55)

  **1. The Audit Log:**
  Display the Whiteboard. List every student who submitted a Blame Slip in any round.
  *   Mark those who were **Audited & Recused** with a Red **X**.
  *   Mark those who were **Audited & Cleared** with a Green **Check**.
  *   Leave others blank.

  **2. The Card Flip:**
  Ask all students to place their Role Cards face up on the table.
  *   **Reveal the Fallen:** Point to the Recused students (and any Fallen who weren't caught). Ask the group: *"Look at the Red X's. Why did we stop listening to them?"*
  *   **Reveal the Mercenaries:** Point to the Mercenary cards. Ask: *"Look at these players. They were never Recused. They followed all rules. Why does their success feel different?"*

  **3. Token Count:**
  Announce the winner. (Likely a Mercenary, as they had the bonus incentive).

  ---

  ## IV. Debrief & Conceptual Mapping (00:55 – 01:15)

  **1. Mapping the Experience (10 mins):**
  Do not lecture. Ask these specific questions to draw out the distinction:

  *   **Q1 (To the group):** "When a 'Fallen' blamer was Audited and Recused, what happened to their blame?"
      *   *Expected Answer:* It was voided. They were silenced. It felt unfair that they spoke.
      *   *Concept:* **Moral Equality.** The blame was rejected because the *relationship* was compromised. They lacked the *position* to speak (Standing as Authority).
  *   **Q2 (To the group):** "When you saw the 'Mercenary' cards, did their blame become void? Did they break a rule?"
      *   *Expected Answer:* No, they followed the rules. But we feel manipulated. Their blame was 'hollow.'
      *   *Concept:* **Insincerity.** The blame was *valid* procedurally but lacked *normative endorsement*. We withdraw *trust*, not authority.
  *   **Q3:** "Did anyone hesitate to Audit a Mercenary? Why?"
      *   *Expected Answer:* Yes, because the Audit rule only checks for 'Fault' (Violation), not 'Motives.'
      *   *Concept:* This mirrors the philosophical difficulty of proving insincerity vs. proving hypocrisy.

  **2. Theoretical Integration (5 mins):**
  Now, introduce the terms.
  *   Write **STANDING AS EQUALITY** on the board. Connect it to the *Recusal* mechanic. (The blamer claims a superiority they do not possess).
  *   Write **STANDING AS SINCERITY** on the board. Connect it to the *Mercenary Bonus*. (The blamer uses the norm as a tool, not a commitment).
  *   Ask: "In the literature, are these the same failure?" Let them argue based on the game feel. (The game is designed to make them feel *different*: one is a structural block, the other is a betrayal of trust).

  ---

  ## V. Troubleshooting Predictable Failures

  **Failure 1: The "Silent Room" (No one blames).**
  *   *Cause:* Students fear the Audit penalty too much.
  *   *Fix:* In Round 2, announce a "Amnesty Token." "For this round only, the first Blame Slip submitted is immune to Audit." This jumpstarts the engine.
  *   *Philosophical Save:* In debrief, note that fear of audit mirrors the social cost of blaming when standing is uncertain.

  **Failure 2: Conflation (Students say "Both are just hypocrites").**
  *   *Cause:* They use "hypocrite" as a catch-all term.
  *   *Fix:* Press on the *consequence*. "Did the Mercenary get Recused? No. Did the Fallen? Yes. If the outcome is different, is the failure the same?" Force them to see that Equality removes *authority*, while Insincerity removes *credibility*.

  **Failure 3: The Fallen Don't Blame.**
  *   *Cause:* They know they will be caught.
  *   *Fix:* Remind them privately (if you can pass notes) or publicly: "You need tokens to win. Sitting out guarantees a loss." The risk of hypocrisy must be taken for the dynamic to emerge. If they still refuse, *you* (Facilitator) act as a "Fallen" blamer in Round 2 to demonstrate the silencing effect.

  ---

  ## VI. Limitations & Facilitator Notes

  **What This Activity Cannot Reproduce:**
  1.  **Waiver of Standing:** In the game, an Audit *forces* recusal. In reality, a wrongdoer might say, "I don't care that you did it too; you're still right." The game mechanics make standing binary (valid/invalid), whereas in ethics, standing can be waived by the blamed party.
  2.  **Restoration:** In the game, a Recused player is out forever. In reality, acknowledging fault ("I know I did this too, but...") can *restore* standing. The game punishes acknowledgment.

  **How to Cover the Gap (Verbal Supply):**
  In the final 5 minutes, you must explicitly state:
  > "Notice that in our game, once a 'Fallen' blamer was revealed, they were silenced permanently. In the real literature, this is debated. Some argue standing is a **right** that is lost (like our Recusal). Others argue it is a **normative power** that can be restored if the blamer acknowledges their fault. Our game modeled the 'Loss' view. Next week, we will read [Author X] who argues for the 'Restoration' view. Also, notice no one could 'waive' the standing of a blamer. In reality, you might say to a hypocrite, 'You're right, even if you are a hypocrite.' Our rules didn't allow for that generosity. Keep that limitation in mind when reading."

  **Facilitator Stance:**
  Remain neutral during the game. Do not moralize. Be a cold "System Administrator." This makes the moral feelings arise from the *students' interactions*, not your guidance. When the Mercenaries are revealed, do not condemn them; simply ask the group how they feel about the winner. The discomfort *is* the lesson.
