      *   *Progress:* Move from exegesis to application. Distinguish technical potential from social form. Analyze algorithmic management as a specific historical form of real subsumption.

  9.  (Final Review against constraints): The user is sophisticated. Do not dumb down. Engage with the *Grundrisse*/*Capital* tension directly.

  **(Self-Correction Note):** I need to make sure I don't just say "both are right." I need to explain *why* they talk past each other. The key is the distinction between *material content* of production and *social form* of valorization. Camp 1 focuses on content; Camp 2 focuses on form.

