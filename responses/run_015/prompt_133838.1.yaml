answer: |-
  1. The fundamental Hamiltonian describes only particle positions and momenta, containing no intrinsic variable corresponding to the macroscopic concept of temperature.
  2. Deriving temperature requires coarse-graining microstates into macrostates, a procedure that cannot be generated solely from the microscopic equations of motion.
  3. This coarse-graining depends on a prior, observer-relative selection of relevant degrees of freedom that the fundamental physics itself does not specify.
  4. Consequently, the reduction of thermodynamics to mechanics smuggles in the very macroscopic framework it claims to derive, revealing a structural rather than epistemic gap.
  5. This supports a weak relational pluralism that treats levels as real relations, thereby denying downward causation while simultaneously rejecting the ontological sufficiency of the lower level.
