      Welcome. Look around this room. You see faces from many places. You hear languages from many homes. Today, you stand here together. You are not becoming the same. You are becoming partners in a specific task.

      For years, you have lived under laws made by others. Those laws guided your work. They protected your safety. They also restricted your movement. This is the nature of living within a state. You were subject to the rules. Today, that changes. You do not just follow the rules now. You help write them. You become an author of the coercive order that binds us all.

      This is a heavy thing. It is not merely a benefit. It is a responsibility. When you vote, you decide how force is used. When you serve on a jury, you decide how justice is done. You share this power with everyone else in this room. We are now linked by this shared authority. We must answer to each other for how we use it.

      I know you left people behind. I know you carry memories of other streets. The oath asks you to renounce political allegiance. It does not ask you to renounce your history. Your obligations to those you love do not vanish because you stand here. You bring those obligations with you. They inform how you judge us. They remind us that our laws reach beyond our borders. What we do here affects people there. You know this better than anyone.

      Some call this day a birth. Some call it a homecoming. I call it a beginning of work. We have a system that needs constant repair. It is not perfect. It never will be. But now you have a tool to fix it. You have a vote. You have a voice. You have a seat at the table where the rules are made.

      To the children watching: watch closely. This is what adults do. We argue about fairness. We try to build something just. To the families: you are safe here. To the court: we respect the law. We take this duty seriously.

      Do not feel you must be grateful for this. Feel ready for the work. Gratitude is for gifts. This is not a gift. It is a share in power. Power must be used well. It must be used to ensure that the coercion we impose on each other is justified. That is the only promise we make today. We will try to make the rules fair. We will try to answer to each other.

