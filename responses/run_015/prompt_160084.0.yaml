      *   *Structure:* Follow the prompt's requirements exactly (Move-by-move, Overall, Missing Distinction, Confidence, Withdrawable Claim).
      *   *Constraint Check:* No citations. 2-3 sentences per move analysis. Explicit confidence. One withdrawable claim.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Move 3:* Naomi's point about 40% prevalence being too high for disease is actually quite weak medically (hypertension, myopia). I need to make sure I penalize that specific part while crediting the pharmacopoeia point.
