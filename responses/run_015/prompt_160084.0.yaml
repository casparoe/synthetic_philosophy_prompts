      *   **Move 1 (Naomi):** *Disease = failure of designed function. This is functioning as designed (mismatch).*
          *   *Analysis:* Classic Boorse/Evolutionary Medicine argument. Strong on conceptual consistency regarding "design." Weak on clinical reality (patients still suffer).
          *   *Rating:* Partly Right.
          *   *Confidence:* High.

      *   **Move 2 (Idris):** *Disease shouldn't be hostage to ancestral environment. Selection history is contingent. Mortality isn't the only test (infertility, pain).*
          *   *Analysis:* Strong rebuttal to evolutionary definition. Medicine treats current suffering, not just evolutionary failures.
          *   *Rating:* Clearly Right.
          *   *Confidence:* High.

      *   **Move 3 (Naomi):** *Harm test makes disease indexical to pharmacopoeia (if we have a drug, it's a disease). 40% prevalence is too high for disease. Trade-off (CV risk vs. motivation) makes "patient preference" circular.*
