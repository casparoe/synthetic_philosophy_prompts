      *   **The Dispute:** Screening proposal.
      *   **Naomi (Geneticist):** Anti-screening. Argues based on evolutionary function (Boorse-style biostatistical theory leanings). It's not a disease; it's a mismatch. Harm test is circular/indexical.
      *   **Idris (Internist):** Pro-screening (cautiously). Argues based on current harm (pathology is about current suffering/risk, not history). Disease status $\neq$ Screening utility. Harm is real regardless of history.

