  ok so my debate partner keeps hitting me with 'charity begins at home' whenever i argue we should send aid to other countries instead of only fixing local problems. i get that its not literally 'ignore everyone else' but i need to understand what exact claims it could actually be making. can you lay out the different precise versions—like is it saying we have stronger moral duties to people near us, or that helping locally is just more efficent, or that its psychologically natural to care about family first? for each version tell me if its tautalogical, if its actually defensible, and if it really gets my partner to his conclusion that we should stop all foreign aid until every issue here is solved. also he said it like its an obvious moral law but i feel like theres a hidden step hes skipping—can you point out what that step might be? thanks this is for my ethics class and im kind of stuck
