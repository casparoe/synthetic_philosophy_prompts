answer: |-
  This is a classic move in ethics debates. Your partner is using a proverb as if it were a rigorous philosophical premise. The phrase "charity begins at home" is rhetorically powerful but logically slippery. In ethics, we call this **equivocation**—using a vague phrase to mask a specific, controversial claim.

  To help you dismantle this in your ethics class, let's break down the three distinct philosophical claims your partner could be making. For each, I'll analyze whether it's tautological, defensible, and whether it actually supports their extreme conclusion (zero foreign aid until local problems are solved).

  ### 1. The Normative Claim (Special Obligations)
  **The Claim:** We have stronger moral duties to our family and compatriots than to strangers abroad.
  *   **Is it Tautological?** No. A tautology is true by definition (e.g., "all bachelors are unmarried"). This is a substantive moral claim. A cosmopolitan utilitarian (like Peter Singer) would argue this is false; distance does not diminish moral worth.
  *   **Is it Defensible?** Yes, partially. This is the argument for **Partialism**. Philosophers argue we have "special obligations" based on reciprocity, social contracts, or community ties. You pay taxes to your government; therefore, the government owes you priority.
  *   **Does it support the "Stop All Aid" conclusion?** **No.**
      *   *Why:* Even if I have a *stronger* duty to my neighbor than a stranger, that doesn't mean I have *no* duty to the stranger. If my neighbor needs \$5 and a stranger is starving to death for \$5, partiality might say "help the neighbor first," but it rarely says "let the stranger die forever."
      *   *The Gap:* This argument supports **priority**, not **exclusivity**. Your partner is arguing for exclusivity (only home), but the premise only justifies priority (home first).

  ### 2. The Pragmatic Claim (Efficacy)
  **The Claim:** Helping locally is more efficient; money sent abroad is wasted due to corruption, logistics, or lack of oversight.
  *   **Is it Tautological?** No. This is an empirical claim about economics and logistics.
  *   **Is it Defensible?** Mixed. It is true that some foreign aid is wasted. However, data from organizations like *GiveWell* shows that certain foreign interventions (e.g., bed nets for malaria, deworming) are vastly more cost-effective than many local programs (e.g., subsidizing art museums or inefficient local welfare bureaucracies).
  *   **Does it support the "Stop All Aid" conclusion?** **No.**
      *   *Why:* This turns the debate into a math problem, not a moral one. If a specific foreign aid program saves a life for \$500, and a specific local program costs \$50,000 to improve a park, the pragmatic argument actually demands you send the money abroad.
      *   *The Gap:* This argument requires comparing specific programs, not blanket bans. It cannot support a rule like "no foreign aid ever."

  ### 3. The Psychological Claim (Human Nature)
  **The Claim:** Humans are psychologically wired to care about those near them first; trying to force otherwise is unnatural and unsustainable.
  *   **Is it Tautological?** No. It's a descriptive claim about biology and sociology.
  *   **Is it Defensible?** Yes. Evolutionarily, we are wired for tribalism and kin selection.
  *   **Does it support the "Stop All Aid" conclusion?** **No.**
      *   *Why:* This commits the **Naturalistic Fallacy** (the "Is-Ought" problem). Just because humans *naturally* prioritize their tribe doesn't mean they *morally ought* to. We are also naturally violent, but we don't argue "violence begins at home, so we shouldn't have laws against murder." Ethics is often about overcoming natural impulses.
      *   *The Gap:* Describing how we *do* act does not justify how we *should* act.

  ---

  ### The Hidden Step (The Logical Leap)

  You mentioned feeling like your partner is skipping a step. You are absolutely right. The phrase "Charity **begins** at home" is being treated as "Charity **ends** at home."

  Here is the hidden premise your partner is relying on to get to their conclusion:

  > **The Hidden Premise:** *"Local problems must be **completely solved** before any resources can be allocated elsewhere."*

  **Why this breaks their argument:**
  1.  **The Completion Trap:** Local problems (poverty, homelessness, inequality) are never "completely solved." There will always be a local issue that could use more funding. If the condition for foreign aid is "zero local problems," then the condition is never met, and foreign aid is never permitted.
  2.  **The False Dichotomy:** It assumes resources are binary (either 100% home or 100% abroad). In reality, budgets are marginal. We can fix 95% of local issues and 5% of foreign issues, or vice versa.
  3.  **The Definition of "Home":** In a globalized economy, "home" is porous. Ignoring a pandemic in another country, or climate change, or instability that creates refugees, often harms "home" eventually. So, helping abroad *is* sometimes helping at home.

  ### How to Counter in Debate (Ethics Class Strategy)

  Since this is for an ethics class, you want to use precise terminology. Here are three angles to hit:

  **1. Priority vs. Exclusivity**
  > "You are conflating *priority* with *exclusivity*. Even if I grant that we have stronger duties to locals, that only means we should help locals *first* or *more*, not that we should help them *only*. 'Begins' implies a starting point, not a boundary."

  **2. The 'Never' Condition**
  > "Your argument relies on the premise that local issues must be fully resolved before we help outsiders. Since local issues like poverty are never fully resolved, your rule effectively means we should never help anyone outside our borders. Is that a moral principle you can defend, or is it just a way to justify indifference?"

  **3. Cosmopolitanism (The Moral Counter)**
  > "From a utilitarian or cosmopolitan perspective, moral worth is not determined by geography. If I can save a life abroad for less cost than I can improve a life at home, 'charity' (defined as doing the most good) actually demands I send the money abroad. To say otherwise is to argue that a dollar is worth more because it is spent on American soil than African soil, which is moral arbitrariness."

  ### Summary for your notes
  *   **Is the phrase a moral law?** No, it's a heuristic (a rule of thumb).
  *   **Is it tautological?** No, it makes contestable claims about duty and efficiency.
  *   **Does it prove "No Foreign Aid"?** No. It argues for *proximity*, not *exclusivity*.
  *   **The Hidden Step:** The assumption that local duties must be *satisfied completely* before any other duties kick in.

  Your partner is using a sentimental proverb to do the work of a rigorous ethical argument. Your job is to show that the proverb doesn't carry that weight.
