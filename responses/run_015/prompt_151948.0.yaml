answer: |-
  # Activity Design: The Adaptive Allocation Protocol

  ## Setting and Audience
  This activity is designed for an upper-division seminar of 16 students in a 90-minute session. The room should be arranged to allow private decision-making (e.g., desks spaced apart or folders used as shields). The facilitator must maintain strict neutrality, acting as the "System Administrator" rather than a lecturer, to preserve the experiential nature of the dilemma. The goal is to generate data and visceral frustration regarding fixed past conditions versus future evidence before any theoretical labels are applied.

  ## Rules, Roles, and Materials
  **Materials:**
  *   **16 Player Packets:** Each contains 4 sealed envelopes labeled "Round 1" through "Round 4," a personal Scorecard, and a set of two Choice Cards ("TAKE BOTH" and "TAKE ONE").
  *   **16 Forecast Cards:** These are placed *inside* the sealed envelopes. They state the System's Forecast for that round (either "EXPECTED: ONE" or "EXPECTED: BOTH").
  *   **Facilitator Ledger:** A sheet to track each student's history and generate the next round's Forecast Cards.
  *   **Timer:** Visible to all.

  **The Algorithm (The "System"):**
  The System is an adaptive model. It does not know your current choice; it only knows your past behavior.
  *   **Round 1:** Forecast is assigned randomly (50/50) by the facilitator before class.
  *   **Rounds 2–4:** The Forecast for Round $N$ is determined by the majority of your choices in Rounds $1$ to $N-1$.
      *   If you chose "TAKE ONE" more often than "TAKE BOTH" previously, Forecast = "EXPECTED: ONE".
      *   If you chose "TAKE BOTH" more often (or equal), Forecast = "EXPECTED: BOTH".
      *   *Tie-breaker:* If history is equal (e.g., 1 ONE, 1 BOTH), Forecast = "EXPECTED: BOTH".

  **Procedure:**
  1.  **Distribution:** Students receive their Packet. They are told the System adapts to *their* history only. They are not told the exact algorithm yet, only that "The System learns from your past choices to fill these envelopes."
  2.  **Choice:** For each round, students open the envelope, read the Forecast Card (which reveals what the System predicted *before* they chose), and then privately select a Choice Card.
  3.  **Submission:** Students place their Choice Card face down and return the empty envelope to the facilitator.
  4.  **Scoring:** The facilitator collects all choices. During the break between rounds, the facilitator calculates the next round's Forecast based on the submitted choices and prepares the next envelopes. (To save time, the facilitator can pre-print blank Forecast Cards and simply stamp/check the appropriate box during the break).
  5.  **Revelation:** Students calculate their own points for the round based on the Forecast Card they opened and the Choice they made, using the Payoff Scheme. They record this on their Scorecard.

  ## Payoff Scheme
  Points are symbolic but tracked publicly on a leaderboard. The winner gains a trivial privilege (e.g., choosing the closing discussion topic).
  *   **Forecast "EXPECTED: ONE" + Choice "TAKE ONE":** 10 Points (The "Reward" for consistency)
  *   **Forecast "EXPECTED: ONE" + Choice "TAKE BOTH":** 11 Points (The "Causal Dominance" payoff)
  *   **Forecast "EXPECTED: BOTH" + Choice "TAKE ONE":** 0 Points (The "Penalty" for mismatched type)
  *   **Forecast "EXPECTED: BOTH" + Choice "TAKE BOTH":** 1 Point (The "Safe" payoff)

  *Logic:* In any single round, "TAKE BOTH" strictly dominates "TAKE ONE" (11 > 10 and 1 > 0). However, consistently choosing "TAKE ONE" manipulates the System into issuing "EXPECTED: ONE" forecasts, enabling access to the 10-point tier rather than the 1-point tier.

  ## Round Structure and Timeline (90 Minutes)
  *   **0:00–0:15 (Setup & Rules):** Distribute packets. Explain the System adapts to history. Emphasize envelopes are sealed *before* the round begins. Do not mention Newcomb, causality, or evidence.
  *   **0:15–0:25 (Round 1):** Students open R1, choose, submit. Facilitator collects.
  *   **0:25–0:30 (Break 1):** Facilitator processes R1 choices to generate R2 Forecasts. Students reflect silently.
  *   **0:30–0:40 (Round 2):** Distribute R2 envelopes. Students choose/submit. *Critical Moment:* Students who chose "BOTH" in R1 now see "EXPECTED: BOTH" in R2.
  *   **0:40–0:45 (Break 2):** Facilitator processes R2.
  *   **0:45–0:55 (Round 3):** Distribute R3. *Critical Moment:* A student switching to "ONE" here will see "EXPECTED: BOTH" (based on R1/R2) and receive 0 points. They feel the "too late" frustration.
  *   **0:55–1:00 (Break 3):** Facilitator processes R3.
  *   **1:00–1:10 (Round 4):** Final round. Distribute R4. Choice/Submit.
  *   **1:10–1:20 (Scoring):** Students tally totals. Leaderboard revealed.
  *   **1:20–1:30 (Debrief):** Facilitator reveals the algorithm explicitly and begins mapping to theory.

  ## Debrief Plan
  **Mapping Moments to Theory:**
  1.  **The "Too Late" Regret:** Ask students who switched to "TAKE ONE" in Round 3 or 4 but received 0 points. Ask: "Why did you get 0?" Answer: "Because the envelope was already filled based on my past." Map this to the **Causal** intuition: My current choice cannot change the past prediction.
  2.  **The "Type" Realization:** Ask students who consistently chose "TAKE ONE" and received 10 points each round. Ask: "Could you have gotten 11 points?" Yes, in any single round. But if you had taken 11 once, your future forecasts would have shifted to "EXPECTED: BOTH," lowering future scores. Map this to the **Evidential** intuition: My choice is evidence of my type, which determines the environment I face.
  3.  **The Dominance Puzzle:** Write the payoff matrix on the board. Show that "TAKE BOTH" is always better *given* a fixed forecast. Ask: "Why did the highest scorers mostly choose 'TAKE ONE'?" This forces the distinction between maximizing utility *given* a state (Causal) vs. maximizing utility by *influencing* the probability of the state (Evidential/Functional).

  **Predictable Failures and Fixes:**
  *   **Failure:** Students try to randomize (mix strategies) to "fool" the algorithm.
      *   **Fix:** During debrief, show the tie-breaker rule ("EXPECTED: BOTH"). Explain that noise makes you look like a "BOTH" type to the statistical model, collapsing your payoff to the 1-point tier.
  *   **Failure:** Students claim the game is just luck because Round 1 was random.
      *   **Fix:** Point out that Round 1 accounts for only 25% of the score. The divergence in total scores happens in Rounds 3 and 4 based on deterministic history.
  *   **Failure:** Students argue the Facilitator cheated or changed forecasts mid-round.
      *   **Fix:** Use the physical Forecast Cards sealed in envelopes as proof. The "System" is rigid; the tension comes from the student's interaction with time, not facilitator malice.

  **Unreproducible Feature and Facilitator Note:**
  *   **Unreproducible Feature:** In standard Newcomb's Problem, the prediction is about the *current* choice. In this game, the prediction is about the *current* choice based on *past* choices. The "magic" of Newcomb (where my choice *now* correlates with the box content *now* without causation) is replaced by a temporal lag (my choice *now* correlates with the box content *later*).
  *   **Facilitator Note:** To close the gap, you must verbally bridge this in the final 5 minutes. State: "Imagine the System was so fast it could analyze your choice *before* you sealed the envelope, but without you knowing. In that limit, Round 3 becomes identical to the classic One-Shot Problem. The tension you felt—'I can't change this envelope, but I must act as if I can'—is the exact tension of Evidential Decision Theory."

