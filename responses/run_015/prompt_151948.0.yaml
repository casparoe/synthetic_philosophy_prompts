prompt: |-
  I am in an upper-division seminar on rational choice and decision theory (about 16 students, 90 minutes). We have already encountered Newcomb's problem in the standard one-shot, omniscient-predictor form, and the discussion has become predictable: students declare themselves one-boxers or two-boxers by reflex and then retreat to “the boxes are already filled” without actually feeling the evidential pull. I want a classroom game that forces them to experience the tension between evidential and causal reasoning in real time, with simultaneous choices and small stakes, before anyone names Newcomb’s problem, mentions causal decision theory, or refers to “the predictor.”

  To keep the framing from feeling like a tired science-fiction oracle, inject the following niche twist: the predictor is not an all-knowing being but an adaptive statistical model that updates its guess about each student round by round, using only that student’s own prior choices in the game. Because the model learns, a student’s choice in round 3 is both causally too late to change the envelope for round 3 and simultaneously fresh evidence about her “type” that will shape the model’s forecast for round 4. This should make the evidential-causal loop concrete and block the easy dismissal that “nothing I do now can affect a fixed past.”

  Design the activity with these specifications:

  - Setting and audience: the same 16-person seminar, 90 minutes.
  - Rules, roles, and materials: include exactly how the predictor algorithm is revealed (e.g., displayed on a board or card), how individual predictions are generated from prior-round data, and how students make private, simultaneous choices each round. Use only physical tokens, envelopes, or point cards—no digital devices required.
  - Payoff scheme: symbolic points or a trivial privilege (e.g., the winner picks the closing discussion topic for the last 10 minutes), with explicit numeric values for every outcome combination.
  - Round structure and timeline: map out how many rounds fit in 90 minutes (including setup, choice phases, revelation phases, and scoring), and arrange the sequence so that students discover the paradox through their own switching behavior—especially the moment someone changes strategy in a late round and realizes the envelope content was already fixed—before the facilitator names it.
  - Debrief plan: map specific in-game moments (e.g., a student who switched to “only B” in round 3 but received 0 because the model, trained on rounds 1–2, had predicted “A+B”) onto the evidential/causal distinction and onto the one-box/two-box structure. State exactly what will predictably go wrong the first time this is run (e.g., students trying to randomize to “fool” the algorithm, confusion about whether the model is causal, arguments that the game is just luck) and how the facilitator should handle each failure without lecturing. Be frank about which feature of the original, single-shot Newcomb problem the multi-round adaptive format cannot reproduce, and specify what the facilitator must supply verbally to close the gap.

  Please present the design in prose, then provide a brief structured summary as a JSON object with exactly these fields:

  {
    "setting_and_audience": "...",
    "predictor_twist_description": "...",
    "rules_roles_and_materials": "...",
    "payoff_scheme": "...",
    "round_structure_and_timeline": "...",
    "debrief_mapping": "...",
    "predictable_failures_and_fixes": "...",
    "unreproducible_feature_and_facilitator_note": "..."
  }

  The deliverable should be a runnable activity—participants make real choices with real (if small) stakes—not a narrated thought experiment. Do not include bibliographies, reading lists, or citations.
