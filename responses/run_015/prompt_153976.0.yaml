      *   This is the key friction point: Is the "Law" a gradient of bliss or a regime of pain? Clearly the latter. This undermines the Pearce reading but makes for a great critique.

  8.  (Mental Note): Make sure to mention that Moreau is a *theist* figure in the text ("The House of Pain"), whereas Pearce is a *naturalist*. This changes the nature of the "engineering."

