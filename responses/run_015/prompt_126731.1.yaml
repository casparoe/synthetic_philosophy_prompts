  (1) if an agent literally can't tell the diff between A and B, then there is no reason internal to the agent that picks A.
  (2) but rational choice just is picking on the basis of internal reasons.
  (3) so in a perfect tie, rational choice is impossible — the agent either starves or picks via something outside reason (a twich, a coin flip, etc.).
  (4) now here's the kicker: in any real decision, there is always some hidden tie at the margin. you think job A is better, but there's some unknown feature of job B that exactly cancels the advantage if you knew it. so for every real choice there's a perfect symmetry lurkng behind the veil of ignorence.
  (5) that means for every real choice, rational choice is technically impossible; we're all just twiching.
  (6) but that can't be right, since we clearly do make rational decisions and hold people responsible for them.
  (7) so (1) must be false? or maybe (4)?

  i'd like to keep (2) if i can, since giving up that rational choice is reason-based feels like giving up the game entirely. but i also feel like (4) smells fishy, though i can't name why. where does this actually break? and if i have to drop one, what do the standard positions (the ones that allow tie-breaking rules, the ones that deny hidden symmetries, whatever) have to pay?
