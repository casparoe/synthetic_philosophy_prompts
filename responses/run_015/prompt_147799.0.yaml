answer: |-
  ### Ranking of Meaning Locations in Self-Referential Systems

  1.  **Inner Message: 8/10** — This remains the most plausible primary site because it represents the decoded semantic content that the system is functionally organized to produce or recognize.
  2.  **Frame Message: 7/10** — In self-referential systems, the boundary conditions that declare "I am a system" are nearly as constitutive of meaning as the content itself.
  3.  **Outer Message: 5/10** — While essential as the structural key or syntax required for decoding, it is typically viewed as the vehicle for meaning rather than the destination.
  4.  **Decoder Shadow: 3/10** — This is a provocative hypothesis, but it currently lacks a mechanistic consensus for treating ignored redundancy as primary meaning rather than noise or receiver projection.

  ***

  ### Settled vs. Contested in Meaning-Location Debates

  **What is Settled**
  There is broad consensus across semiotics, information theory, and cognitive science that meaning is not intrinsic to the physical substrate (the ink, the voltage, the DNA base); it requires an interpreter or a decoding context to exist. Scholars generally agree that a "message" cannot be defined solely by its sender's intent nor solely by its physical structure, but emerges from the relationship between the signal and the system processing it.

  **What is Genuinely Contested**
  Disagreement persists over whether the "true" location of meaning resides in the sender's original intent, the receiver's construction, or the structural isomorphism between the signal and reality (Hofstadter's leaning). The status of your **Decoder Shadow** is highly contested; while fields like psychoanalysis, steganography, and deconstruction argue that meaning hides in slips, noise, and margins, mainstream information theory typically classifies skipped redundancy as entropy rather than semantic content. There is no agreement on whether unintended semantic residue constitutes valid meaning or if it is merely an artifact of the observer's own pattern-seeking behavior.
