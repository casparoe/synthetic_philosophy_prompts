prompt: |-
  You are an expert in moral and political philosophy specializing in the ethics of labor and temporal autonomy. Before drafting, briefly brainstorm the conceptual tension between vocation-based moral economies and universal rights to leisure.

  Write a dialogue between two equally competent philosophers—Dr. Aris Thorne and Dr. Lena Vasquez—debating whether leisure can be a moral right that overrides vocational duty. Thorne should defend a Weberian-inspired view updated for contemporary labor culture: he treats the calling not as mere employment but as a source of moral identity that can generate legitimate duties of sustained labor, and he argues that karoshi, while tragic, is categorically different from alienated exploitation because it represents the extreme fulfillment rather than the negation of a vocation. Vasquez should defend the framework embodied in France’s 35-hour week and the legal “right to disconnect,” treating leisure as an inalienable structural entitlement that must constrain vocational claims regardless of subjective fulfillment; she should treat the “vocational fulfillment” narrative of extreme overwork as an ideological mystification that obscures systemic coercion, not as a genuine moral category.

  Set the exchange in a seminar room after a public lecture on work and human flourishing. Each speaker must respond directly to the other’s actual premises: Thorne must acknowledge that karoshi involves real suffering yet maintain that suffering within a calling differs morally from suffering within exploitation; Vasquez must engage Weber seriously rather than dismiss him, and she must show precisely why universalizing leisure rights undermines vocational exceptionalism without collapsing into anti-work nihilism. Avoid strawmen.

  Structure your response exactly as follows:

  1. Character Sketches (approx. 120 words): one concise paragraph per philosopher stating their core premises and the specific conceptual move each relies on.
  2. The Dialogue (approx. 750 words): at least three full turns per speaker, with direct rebuttals, no talking past each other, accessible to an upper-level undergraduate audience.
  3. Conceptual Mapping (approx. 200 words): identify the exact pivot point—whether suffering within a vocation is morally distinguishable from suffering within exploitation—and state one feature of Vasquez’s rights-based position that Thorne’s framework cannot accommodate without contradiction, plus one feature of Thorne’s view Vasquez must address rather than ignore.

  Do not include bibliographies, citations, reading lists, or references to texts the model would need to look up. Think carefully step by step, then compose.
