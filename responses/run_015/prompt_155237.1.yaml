          *   Let's go with "Legal Status" (e.g., "Married"). It has real effects, criteria, but exists only within the system that defines it.

  4.  **Review and Refine (Self-Correction during drafting):**
      *   *Word Count Check:* I need to be careful not to ramble in Section 2. Keep it tight per loop.
