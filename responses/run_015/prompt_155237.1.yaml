      *   Check the "Classifier as Classified" point.

      *(Self-Correction on "Niche"):* An ecological niche is often defined by the organism's interaction with the environment. If the environment includes *concepts*, it works. But usually, niches are physical. I will argue it's an improvement but still static. A "Currency" or "Law" is better.

      *(Self-Correction on "Classifier"):* If a psychiatrist has Selby Syndrome, does it break the analogy? Yes, because the observer effect becomes internal to the system. In chemistry, the chemist is external. In psychiatry, the observer is part of the observed population.

      *(Drafting content...)*
