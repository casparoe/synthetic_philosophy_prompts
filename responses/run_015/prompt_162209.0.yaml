answer: |-
  **Project Title:** Procedural Truth: Revising Arendt on Lying in the Age of Aggregated Facts

  **Project Summary**
  In *Truth and Politics* and her later commentary on the Pentagon Papers, Hannah Arendt argues that factual truth is politically more fragile than rational truth. Because a fact is contingent—it could have been otherwise—it is vulnerable to the liar who offers a more coherent alternative. Arendt contends that facts survive only when publicly attested and propped up by institutions without an axe to grind: courts, a free press, and universities. Her model, however, relies on an implicit "eyewitness structure." The paradigmatic fact is something someone saw, or a document that records what was seen. The political struggle is over whether to believe the witness.

  This project argues that Arendt's diagnosis of factual fragility is partially an artifact of this eyewitness model. Most facts driving contemporary political argument—unemployment rates, climate data, casualty counts, epidemiological models—are witnessed by no one. They are outputs of measurement procedures aggregating inputs no individual person observes. Consequently, the contemporary crisis of factual truth is not primarily the denial of the fact, but the discrediting of the procedure. The standard Arendtian remedy—publicity and institutional guardianship—fails here because there are no witnesses to publicize.

  I propose that the unit of analysis must shift from the *fact* to the *witness structure*. I will delineate four distinct structures: (1) direct eyewitness; (2) documentary record; (3) aggregated data from unwitnessed inputs; and (4) model-generated counterfactuals (e.g., projected sea levels). My central thesis is that as we move down this list, the institutional remedy for lying must change shape. At the lower end, what is required is not publicity, but "followable procedure": making the route from inputs to output traceable by people who will never see the inputs. This project will demonstrate that defending derived facts requires a new political ontology of procedure, amending Arendt's account to accommodate a world where the "common sense" of shared facts is manufactured statistically rather than experienced collectively.

  **The Question and Existing Positions**
  The determinate question guiding this research is: *Does the transition from eyewitness to procedural facts necessitate a fundamental revision of Arendt's institutional remedy for political lying?*

  Existing scholarship generally takes one of two paths, neither of which settles this question. First, traditional Arendtian scholarship applies her framework to modern lies (e.g., "spin" or propaganda) but retains her eyewitness assumption, treating statistical denial as equivalent to denying an event one saw. This misses the structural difference in how the fact is constituted. Second, social epistemologists analyze trust in experts and testimony. While valuable, this approach treats the problem as one of *reliability* and *justification*. It asks, "Why should we believe the expert?"

  The Arendtian framing contributes something testimony-first approaches miss: it treats factual truth as the ground of the *shared political world*, not merely a proposition to be justified. When social epistemology focuses on trust, it risks reducing the problem to individual cognitive states. Arendt shows that systematic lying destroys the space of appearance itself. By updating her witness-structure model, this project preserves the political stakes (the preservation of a common world) while correcting the ontological assumption (that the world is primarily accessed through witnessing). The answer I defend is that the fragility is structural, not ontological, and that without a shift toward procedural traceability, the common world dissolves not because facts are lied about, but because they become unintelligible.

  **Methodology and Timeline**
  The project will proceed in four phases over twelve months.

  *Months 1–3: Textual Reconstruction and Critique.*
  I will reconstruct Arendt's implicit epistemology of the fact across *Truth and Politics*, *On Revolution*, and her essays on lying. The goal is to isolate the "eyewitness assumption" explicitly. Simultaneously, I will review contemporary critiques of statistical objectivity to map the current landscape of procedural critique.
  *Deliverable:* A 15-page critical exposition establishing the gap in Arendt's model.

  *Months 4–6: Taxonomy Development.*
  I will develop the four-part witness-structure taxonomy. The philosophical work here is to define the boundaries between types without degenerating into a mere list of examples. I will focus on the *transitions* between types (e.g., when does a record become an aggregate?) to ensure the taxonomy is analytical, not descriptive. I will also address the "regress worry": if defending a derived fact requires unwitnessed facts about the measurement, does this lead to an infinite regress of procedure? I aim to show that "followable procedure" halts this regress by shifting the burden from verifying inputs to auditing the transformation rules.
  *Deliverable:* A conceptual framework chapter defining the four structures and the principle of traceability.

  *Months 7–9: Case Application.*
  I will apply the taxonomy to two concrete domains: climate modeling (model-generated facts) and economic statistics (aggregated facts). I will analyze recent political controversies in these areas not as disputes over truth, but as disputes over witness-structure. For example, when a politician rejects climate data, are they denying the fact or the model's validity?
  *Deliverable:* Two case study drafts demonstrating the explanatory power of the taxonomy.

  *Months 10–12: Synthesis and Writing.*
  I will integrate the textual critique, the taxonomy, and the case studies into a cohesive argument. The final conclusion will articulate the amended institutional remedy: what a "procedural institution" looks like compared to Arendt's "attesting institution."
  *Deliverable:* A complete dissertation chapter (approx. 40 pages) and one article-length manuscript submitted for publication.

  **Differentiation from Social Epistemology**
  It is vital to distinguish this project from standard social epistemology regarding trust in experts. Social epistemology typically asks how agents can justifiably form beliefs based on testimony. It is concerned with the *conditions of belief*. This project is concerned with the *conditions of the political world*.

  Arendt's insight is that factual truth is not just something we know; it is the table that sits between us, allowing us to speak about a shared reality. When a procedure is discredited, it does not merely cause individual error; it removes the table. A social epistemological approach might suggest we need better education to understand statistics. An Arendtian amendment suggests we need institutions that make the *production* of statistics a public, followable action. The former fixes the believer; the latter fixes the world. This proposal argues that without the latter, the former is politically inert.

  **Risk Assessment and Mitigation**
  There are two primary risks to this project.

  First, the taxonomy of witness-structures could degenerate into a descriptive list of examples without philosophical traction. If the four types are just "ways facts happen," the project loses its normative force.
  *Mitigation:* I will anchor the taxonomy in the *vulnerability to lying*. Each type will be defined by its specific mode of fragility. If a category does not reveal a distinct vulnerability or require a distinct remedy, it will be collapsed into another. The focus remains on the *remedy*, not the classification.

  Second, there is a risk of scope creep. The problem of procedural truth in modernity is book-length, and there is a danger of attempting to solve the entire crisis of expertise in a year.
  *Mitigation:* I will strictly limit the scope to the *amendment of Arendt*. I am not writing a general theory of statistical objectivity. I am only asking how Arendt's specific account of lying must change to accommodate statistical facts. If a line of inquiry leads into general philosophy of science or broad democratic theory without touching the specific mechanism of *lying and factual fragility*, it will be excised.

  **Failure Conditions**
  The project would count as failing if: (1) I conclude that Arendt's eyewitness model is sufficient for aggregated facts (which would negate the need for the project); or (2) the proposed remedy of "followable procedure" collapses back into a simple demand for "trust in experts," thereby losing the specific Arendtian political dimension. Success requires demonstrating that procedure is a distinct political category from attestation, requiring new institutional forms.
