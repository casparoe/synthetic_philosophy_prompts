  1. "The explanandum"

  The standard question ("Why Britain and not China?") is ill-posed due to Given (d): comparing an island polity to a continent-scale empire conflates local variation with civilizational essence. The true explanandum is not the superiority of a civilization, but the localization of the sustained break described in Given (b). Therefore, the question must be reformulated: Why did the shift to fossil-fuel mechanized growth occur in northwestern Europe rather than the Yangtze Delta, given the comparability established in Given (a)? This shifts the burden from proving European exceptionalism to identifying contingent advantages in specific regions. Any adequate answer must explain the timing (late eighteenth century) and the location (specific industrial cores) without relying on deep historical essences that contradict the parity of the earlier period. Furthermore, the question should be split into distinct divergences: one for wages, one for energy, and one for scientific practice, as these need not coincide. The goal is to explain a divergence in trajectory, not a divergence in kind, ensuring the explanation fits the specific historical rupture rather than a teleological narrative.

  2. "The desiderata"

  The following requirements filter explanations based on the givens. They distinguish between logical necessities and methodological preferences, ensuring the argument survives camp-specific objections.

  1. **Unit Comparability (Non-negotiable):** Inspired by Given (d), this requires comparing equivalent economic regions (e.g., England vs. Jiangnan), not aggregates. It excludes civilizational essentialism that treats China as a monolith or ignores internal European variation. Aggregating data masks the specific locales where the break occurred. Without this, the argument compares apples to oranges, validating size differences as cultural ones.
  2. **Timing Consistency (Non-negotiable):** Derived from Given (a), the cause must emerge late. Explanations relying on ancient cultural traits fail because they cannot explain why the effect waited centuries. This excludes deep institutional or religious roots established in the medieval period, as they violate the parity premise. A cause present in 1500 cannot explain a divergence in 1800 without an intervening trigger.
  3. **Intra-Regional Discrimination (Non-negotiable):** Based on Given (b), the cause must distinguish Britain from Holland or Italy. It excludes pan-European explanations like "Western Christianity" or "common law" that apply equally to non-industrializing neighbors. If the cause is European, the effect should be too. This filters out broad cultural generalizations that fail to pinpoint the specific breakout zone.
  4. **Symmetrical Vocabulary (Non-negotiable):** Per Given (c), features like bureaucracy must be described neutrally. Calling European states "capacious" and Chinese states "despotic" without empirical asymmetry is forbidden. This excludes biased institutional typologies that预设 the outcome in the description of the inputs. It prevents loading the dice via terminology that assumes European superiority in the definition of institutions.
  5. **Mechanism Specification (Non-negotiable):** Correlations (e.g., wages and machines) are insufficient. The answer must detail the decision pathway from economic signal to investment. This excludes black-box functionalism where high wages simply "cause" innovation without explaining the firm-level incentive structure. It demands a model of action that connects macro conditions to micro decisions.
  6. **Microfoundations (Camp Preference):** Neoclassical camps demand household-level rationality; structuralists allow aggregate class dynamics. Insisting on one excludes the other. An adequate paper should state its choice explicitly rather than smuggling it in. This determines whether the argument rests on individual choice or systemic constraint. It defines the level of analysis and limits permissible evidence types.
  7. **Counterfactual Stability (Non-negotiable):** The "Swap Test." If the cause existed elsewhere without the effect, it is insufficient. This excludes necessary conditions treated as sufficient, like mere coal presence. It forces the author to prove the factor was decisive, not just present. It ensures causal weight by demanding the factor explains the absence of growth elsewhere.

  3. "Where the desiderata collide"

  The desiderata collide primarily on depth versus timing. The Timing Consistency requirement knocks out the largest number of familiar answers, specifically the Institutions and Culture camps. If regions were comparable until the eighteenth century (Given a), deep-rooted causes like Protestantism or property rights regimes established centuries prior cannot explain the late break without ad hoc adjustments. They posit a cause present long before the effect, violating the timing constraint. Furthermore, Unit Comparability clashes with Mechanism Specification when scaling up. A mechanism working at the firm level (Microfoundations) may not aggregate to the national level required by the Intra-Regional test. A firm might innovate, but does the state allow it? This suggests no single-factor answer is available; explanations must be conjunctural. The list implies that valid answers must be narrow, contingent, and late-emerging. If one insists on deep causes, one must reject Given (a), arguing the comparability is illusory. Thus, the collisions force a choice: either accept the givens and accept contingent explanations, or reject the givens to save deep structural theories. The Microfoundations requirement also creates friction with structural accounts; if you demand individual rationality, you cannot easily use class struggle as a driver. This forces a methodological commitment that limits the scope of permissible evidence. Consequently, the list itself suggests that no monocausal answer is available.

  4. "Scorecard"

  | Answer Family | Weakest Link | Damage Assessment |
  | :--- | :--- | :--- |
  | **Coal-and-Colonies** | Intra-Regional Discrimination | Spain had colonies; Germany had coal. Why Britain specifically? This answer struggles to explain the unique British configuration without invoking secondary factors. |
  | **Institutions-and-Rights** | Timing Consistency | Rights existed centuries before the break. Why then? This requires arguing that institutions only became effective late, which weakens the institutional claim. |
  | **Culture-and-Religion** | Symmetrical Vocabulary | Labels European curiosity "science," Chinese "stasis." This violates the neutrality requirement by embedding the outcome in the cultural description. |
  | **High-Level-Equilibrium** | Unit Comparability | Denies Given (a); assumes Chinese stagnation too early. It conflicts with the wage and urbanization data provided in the seminar givens. |
  | **Revisionist (Late Break)** | Mechanism Specification | Explains parity well, but details the trigger poorly. It describes the situation but fails to specify the exact switch that flipped the system. |

  The Institutions answer is most damaged by Timing. The Culture answer fails Symmetry. The Coal answer fails Discrimination. The Equilibrium trap fails the baseline Givens. The Revisionist answer survives best but lacks causal bite. Each family fails at least one non-negotiable desideratum, suggesting a hybrid approach is necessary. No family passes all tests, indicating the need for synthesis.

  5. "My rubric"

  **My Rubric:** An adequate explanation must identify a contingent factor present in eighteenth-century Britain but absent in Jiangnan, capable of triggering mechanization without presupposing earlier superiority. This standard ensures the argument respects the parity of the earlier period while accounting for the specificity of the break. It forces the paper to avoid teleological narratives and instead focus on the precise conjunction of conditions that allowed one region to cross the threshold while the other remained in the organic economy. Meeting this standard means surviving the timing and symmetry tests simultaneously.
