answer: |-
  Joint Statement on Ascription Universality and Epistemic Dominance

  **Preamble**

  We, the undersigned representatives of the Ascription-Universalist (AU) camp and the Epistemic-Dominance Skeptic (EDS) camp, have spent the last series of workshops trying to map where we actually stand. We're tired of the usual debate where one side gets accused of imperialist abstraction and the other gets accused of nihilistic relativism. Neither of those labels fit what we're doing here. This document records what we've managed to lock down, where we still diverge, and specifically where the rubber hits the road.

  **Agreed Claims**

  1.  **On Universality:** We agree that "universality" in this context isn't about metaphysical truths existing "out there." It's about *ascription universality*—the practice of applying shared categories, labels, or frameworks across different local contexts to enable coordination or comparison.
  2.  **On Epistemic Dominance:** We agree that epistemic dominance occurs when one framework systematically renders another framework's evidence or reasoning invisible or irrational. It's not just about being wrong; it's about structuring the conversation so certain kinds of knowledge can't be heard.
  3.  **Rejection of Relativism:** Both camps reject the idea that this debate is a cover for moral relativism. We both believe some claims are better than others and that cross-cultural critique is possible. The EDS camp is not saying "anything goes," and the AU camp is not saying "our framework is god-given."
  4.  **The Risk:** We agree that there is a real risk that universal ascriptions can slide into epistemic dominance. The disagreement is about whether that slide is inevitable or manageable.

  **Precise Disagreements**

  Here is where we stop shaking hands. We've tried to phrase these so each side recognizes their own voice.

  *   **Topic: The Function of Universal Categories**
      *   **AU Wording:** Universal ascriptions act as thin cognitive scaffolds. They are minimal commitment tools that allow us to translate local knowledge without demanding everyone adopt the same ontology. They are porous and meant to be adjusted.
      *   **EDS Wording:** Universal ascriptions act as thick structural filters. Even when presented as "thin," they carry embedded norms about what counts as evidence. They demand local knowledge present itself in specific ways to be legible, which is a power move by default.

  *   **Topic: The Status of Local Exceptions**
      *   **AU Wording:** When a local case doesn't fit the universal frame, it functions as a falsification or a refinement trigger. The universal frame evolves to accommodate the exception, proving the system is responsive, not dominant.
      *   **EDS Wording:** When a local case doesn't fit, it gets treated as a "special case" or "noise." The universal frame expands to include the data point but strips it of its explanatory power, keeping the core logic intact and dominant.

  **The Cruxes**

  We identified two specific mechanical issues where our predictions differ. We agreed on concrete cases to watch so we can see who's right over time.

  **Crux 1: The Absorption Limit**
  *   **Question:** Can a local exception ever overturn a universal frame, or does it just get absorbed?
  *   **Bearing Case:** The classification of "trauma" in cross-cultural psychology. Specifically, communities where distress is somatic (body-based) rather than narrative (memory-based).
  *   **AU Prediction:** If enough communities show somatic distress without narrative memory, the universal definition of trauma will shift from "psychological processing" to "physiological response," overturning the old norm.
  *   **EDS Prediction:** The universal definition will add a subtype ("somatic trauma") but keep the core requirement that it must be treatable via narrative-based therapy protocols, rendering the somatic understanding secondary.

  **Crux 2: Thin Vocabulary vs. Thick Norms**
  *   **Question:** Can "thin" universality (shared vocabulary) exist without "thick" dominance (shared norms of evidence)?
  *   **Bearing Case:** International development grants using the term "sustainability."
  *   **AU Prediction:** Local groups can use the word "sustainability" to secure resources while defining it internally as "ancestral continuity," successfully decoupling the word from the donor's metric of "financial solvency."
  *   **EDS Prediction:** To get the grant, local groups will be forced to produce audits and metrics that align with "financial solvency." The vocabulary forces the epistemic norm, even if they try to resist it.

  **Settled vs. Contested**

  It's important to note what this document is not. We haven't solved the problem. We've just agreed on where the battle lines are. The settled stuff is mostly definitional—we know what we're arguing about. The contested stuff is empirical and structural. We disagree on whether language can be neutral enough to serve as a scaffold without becoming a cage. Alot of people outside this room think we're splitting hairs, but for those of us working on implementation, this distinction determines whether a project empowers locals or just maps them.

  We'll revisit the bearing cases in 18 months. Until then, we agree to stop calling each other imperialists and relativists.

