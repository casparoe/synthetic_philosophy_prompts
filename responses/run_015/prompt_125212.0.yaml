  Give me the agreed claims -- about what universality even means in this context, what epistemic dominance refers to, and what both reject (like the idea that this is just moral relativism in disguise). Then the precise disagreements, each phrased in wording its own side would accept. Then the cruxes: I suspect one is whether a local exception can ever overturn a universal frame or just gets absorbed into it, and another is whether "thin" universality (shared vocabulary only) can exist without "thick" dominance (shared norms of evidence). Name them precisely, and for each crux include a concrete case or argument both sides agree bears on it, with each camp's prediction or interpretation written down in advance.

