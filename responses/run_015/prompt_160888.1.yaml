answer: |-
  ### The Principle: Structural Fairness & Sufficiency Protocol (SFSP)

  To implement your intuitions as a function, we need to separate the *status* of the agent (are they safe?) from the *cause* of the harm (was it fair?). Your "rescue vs. compensation" split is the correct architectural decision here. It prevents the system from having to validate bad choices to prevent starvation.

  Here is the precise specification.

  #### 1. Input Schema
  The function `Evaluate_Obligation(Case)` takes the following fields:
  *   `Current_Welfare`: Float (0 to 100, where 0 is death, 100 is flourishing).
  *   `Sufficiency_Threshold`: Float (The minimum for a dignified life; e.g., 20).
  *   `Causal_Source`: Enum { `Brute_Luck`, `Systemic_Burden`, `Voluntary_Speculation`, `Negligence`, `Malice` }.
  *   `Agency_Mitigation`: Float (0 to 1, where 1 is full free will, 0 is no agency due to addiction/coercion/ignorance).
  *   `Social_Value_Of_Activity`: Enum { `Productive`, `Neutral`, `Extractive` }.
  *   `Risk_Visibility`: Float (0 to 1, where 1 is fully known, 0 is hidden).
  *   `Option_Declinability`: Float (0 to 1, where 1 is easily declined, 0 is required for basic participation).

  #### 2. Logic
  ```python
  def Evaluate_Obligation(Case):
      # Phase 1: The Floor (Humanitarian)
      if Case.Current_Welfare < Case.Sufficiency_Threshold:
          return "RESCUE_OBLIGATION" 
          # Note: This triggers regardless of Causal_Source. 
          # It solves Case 3 (Gambler) without validating the gamble.

      # Phase 2: The Ceiling (Compensation)
      # Only triggers if the agent is above the floor but harmed unfairly.
      
      # Check for Hidden Risk (Case 10, Case 2 partial)
      if Case.Risk_Visibility < 0.5:
          return "COMPENSATION_OBLIGATION"

      # Check for Systemic Burden / Bundled Risk (Case 1, Case 4, Case 5)
      # Risk must be bundled into something necessary or productive.
      if Case.Causal_Source == "Systemic_Burden":
          if Case.Option_Declinability < 0.5 or Case.Social_Value_Of_Activity == "Productive":
              return "COMPENSATION_OBLIGATION"

      # Check for Mitigated Agency (Case 2)
      # If choice was made but agency was compromised by environment/biology.
      if Case.Causal_Source == "Voluntary_Speculation" and Case.Agency_Mitigation < 0.5:
          return "COMPENSATION_OBLIGATION"

      # Default: No Obligation (Case 3, Case 7, Case 8)
      return "NO_OBLIGATION"
  ```

  #### 3. Motivation Mapping
  *   **`Sufficiency_Threshold` (Phase 1):** Motivated by **Case 3** (Gambler) and **Case 9** (Child). It ensures we do not let people starve or suffer innocent harm (the child) even if we assign no blame to others.
  *   **`Risk_Visibility`:** Motivated by **Case 10** (Drug) and **Case 1** (Congenital). You cannot choose against what you cannot know.
  *   **`Option_Declinability` + `Systemic_Burden`:** Motivated by **Case 4** (Startup) and **Case 5** (Flood/Emissions). These distinguish risks taken to participate in the economy/society from risks taken for pure thrill.
  *   **`Social_Value_Of_Activity`:** Motivated by **Case 3 vs Case 4**. Gambling is `Extractive` (zero-sum); Startup work is `Productive` (positive-sum). This justifies helping the engineer but not the gambler, even if both "gambled."
  *   **`Agency_Mitigation`:** Motivated by **Case 2** (Smoking). It explains why the verdict matches Case 1 despite the choice: addiction and targeted ads reduce `Agency_Mitigation`.
  *   **Exclusion of `Brute_Luck` Surplus:** Motivated by **Case 7** (Talent). The function only triggers on *deficits* relative to the threshold or *unfair burdens*, not on *surpluses*.

  ---

  ### Critique and Repairs

  #### Which verdicts does this overturn?
  1.  **Case 3 vs. Case 4:** This principle **saves both**. It distinguishes them not by "gamble vs. work" (since you noted both are gambles) but by `Social_Value` and `Systemic_Burden`. The startup is a risk bundled into career participation (Productive); the casino is a risk detached from social contribution (Extractive).
  2.  **Case 7 (Talent):** This principle **saves Case 7** alongside Case 1, but at the cost of asymmetry. It treats deficits (illness) as claims on the collective, but surpluses (talent) as private property. It does not tax the talented engineer. This is not a logical contradiction within the SFSP, but it is a philosophical commitment to *Sufficiency* rather than *Equality*.
  3.  **Case 6 (Flood/No Insurance):** The principle returns `RESCUE_OBLIGATION` (if below floor) but `NO_COMPENSATION`. This matches your intuition ("Weaker claim... willing to make exception"). The exception is the Rescue, not Compensation.
  4.  **Case 2 (Smoking):** The principle returns `COMPENSATION` *only if* `Agency_Mitigation` is low enough (addiction/ads). If the model determines the smoker had full agency, it overturns your verdict and says `NO_COMPENSATION` (only Rescue if destitute). You must decide if the "targeted advertising/parents" factor lowers agency enough to cross the threshold.

  #### Rescue vs. Compensation Split
  **Is it doing real work?** Yes. It solves the "Gambler Problem" (Case 3). Without it, you must either let the gambler starve (to preserve justice) or pay them (to preserve humanity), which feels like rewarding bad behavior. The split allows you to say: "We will not let you die (Rescue), but we do not owe you restoration of your losses (Compensation)."
  **Does it hide the hard question?** It hides the question of **where to set the floor**. If the `Sufficiency_Threshold` is set high (e.g., middle-class comfort), Rescue becomes indistinguishable from Compensation. If set low (bare survival), it feels cruel. The principle pushes the political fight to defining the Threshold, rather than debating individual blame.

  #### Bundled vs. Separable Cut
  **Is it just Choice/Chance?** No. "Choice/Chance" is binary. "Bundled" is structural.
  *   *Choice/Chance:* Did you choose it? (Case 4: Yes. Case 3: Yes.) This fails to distinguish them.
  *   *Bundled:* Was the risk a toll required to enter a necessary system? (Case 4: Yes, career. Case 3: No, entertainment.)
  This is a genuine refinement. It shifts the focus from the *psychology of the agent* to the *architecture of the options available*. It is engineering vocabulary applied to morality: is the risk a bug in the system or a feature of the module?

  ---

  ### Verdicts on Unlisted Cases

  1.  **Hidden Contract Terms (Discoverable only with expertise):**
      *   *Inputs:* `Risk_Visibility` = Low (for layperson). `Agency_Mitigation` = High (asymmetry of knowledge).
      *   *Verdict:* **COMPENSATION_OBLIGATION.**
      *   *Reasoning:* Matches Case 10. If the risk was technically discoverable but practically hidden by complexity designed to obscure, it counts as hidden.

  2.  **Genetic Predisposition (Unknown, shaped choice):**
      *   *Inputs:* `Causal_Source` = `Brute_Luck` / `Systemic_Burden`. `Agency_Mitigation` = Low.
      *   *Verdict:* **COMPENSATION_OBLIGATION.**
      *   *Reasoning:* Matches Case 1 and 2. If the choice was driven by a biological mechanism the agent did not know they had, agency is mitigated.

  3.  **Dangerous Commute (Only Job):**
      *   *Inputs:* `Option_Declinability` = 0 (Cannot decline without losing income). `Social_Value` = `Productive`.
      *   *Verdict:* **COMPENSATION_OBLIGATION.**
      *   *Reasoning:* Matches Case 4. The risk is bundled into the only available route to a basic good (income).

  4.  **Competitor Launches First (Market Gamble):**
      *   *Inputs:* `Causal_Source` = `Voluntary_Speculation`. `Social_Value` = `Productive`. `Risk_Visibility` = High.
      *   *Verdict:* **NO_OBLIGATION.**
      *   *Reasoning:* This distinguishes from Case 4. In Case 4, the equity was *worthless* due to market failure/odds. Here, the loss is due to *competition*. SFSP treats market competition as a known rule of the game (`Risk_Visibility` = High). Compensation is for systemic burdens, not for losing a fair race.

  5.  **Compensation Changes Future Behavior (Moral Hazard):**
      *   *Inputs:* N/A (This is a consequence, not a case feature).
      *   *Verdict:* **IGNORED BY PRINCIPLE.**
      *   *Reasoning:* SFSP is backward-looking (justice for harm), not forward-looking (incentive design).
      *   *Critique:* This is a weakness. If compensating Case 10 causes pharmaceutical companies to hide data *more*, the principle doesn't care. It prioritizes the victim's claim over systemic optimization.

  6.  **Shared Risk (Group exposed, only some lose):**
      *   *Inputs:* `Causal_Source` = `Systemic_Burden`. `Risk_Visibility` = High.
      *   *Verdict:* **NO_COMPENSATION** (unless below `Sufficiency_Threshold`).
      *   *Reasoning:* If the risk was known and shared (e.g., everyone invested in the same fund), the loss is bad luck, not unfair burden. Only Rescue applies if they fall below the floor.

  ---

  ### The Repugnant Conclusion

  You asked for one case where my favoured principle returns an answer you would likely find repugnant.

  **The Case:** A hard-working employee takes a `Productive` risk (Case 4 style) that fails due to `Systemic_Burden` (e.g., regulatory change). However, they had *just enough* savings that their `Current_Welfare` remains at 21, while the `Sufficiency_Threshold` is 20.

  **The Verdict:** **NO_OBLIGATION.**

  **Why it is repugnant:** They suffered an injustice (`Systemic_Burden`), yet they receive nothing because they are technically above the starvation line. Meanwhile, the Gambler (Case 3) who fell to 19 gets `RESCUE`. The principle prioritizes *desperate need* over *corrective justice*. It tells the victim of the unfair system: "You were wronged, but you are still rich enough to survive, so we owe you nothing." It sacrifices the claim of fairness on the altar of sufficiency.

  **Engineering Trade-off:** This is the cost of the `Rescue` vs. `Compensation` split. You gain clarity on who to save from starvation, but you lose the ability to repair unfairness for those who remain "functional." If you fix this by lowering the Threshold, you bankrupt the system. If you fix it by expanding Compensation, you blur the line with Case 3 (Gambler). You must choose which bullet to bite.
