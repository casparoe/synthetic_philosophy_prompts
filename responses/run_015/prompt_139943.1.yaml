  *(Self-Correction on Step 5 vs Step 7)*: Technically, if I refute 5, 7 doesn't follow. But the inference from 6 to 7 is also weak. I will focus on 5 because it makes the strongest positive claim ("No threshold is principled") which is empirically falsifiable by complexity theory.

  *(Refining the "Cost")*: The cost is accepting that "collapse" is always relative to a *defined mechanism*. You cannot say "The Maya collapsed" simpliciter. You must say "The Maya polities' capacity for monumental coordination collapsed." This limits rhetorical flourish but increases accuracy.

