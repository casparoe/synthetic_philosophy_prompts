answer: |-
  To preserve your position without conceding that societies are organisms or that collapse is a natural kind, you should refuse **step (5)**.

  Your friend's argument relies on a Sorites paradox (the 'heap' problem) applied to social systems. It looks sound because it treats social metrics like piles of sand: remove one grain, and it is still a heap; remove another, and still a heap; therefore, the distinction between 'heap' and 'non-heap' is arbitrary. However, step (5) fails because it conflates *continuity of metrics* with *continuity of function*. While population or caloric intake may decline continuously, the *capacity* of a system to maintain specific practices often behaves non-linearly.

  Here is the diagnosis of why step (5) fails, the cost of refusing it, and how to handle the evidence concretely.

  ### Why Step (5) Looked Sound
  Step (5) claims that no threshold is principled because the 'floor' varies by practice, capacity for substitution, and personnel. This appeals to a rigorous nominalism: since every society is unique, any line we draw seems like an imposition by the observer. It leverages the intuition that because there is no 'essence' of a society (per step 1), there can be no 'essence' of its failure. It suggests that because we must choose *which* practice to monitor (literacy vs. calories), the judgment of collapse is merely a choice of perspective.

  ### Why Step (5) Fails
  Step (5) is false because **functional thresholds are principled even if they are variable.**

  Consider a bridge. The weight limit varies by bridge (design, materials, span). The stress on the cables is continuous. Yet, the point at which the bridge collapses is not arbitrary, nor is it a 'mood'. It is determined by the structural integrity of that specific system. Similarly, a social subsystem (e.g., a redistributive palace economy) relies on specific network densities and specialist chains.

  A threshold is principled if it marks a **loss of causal power**. If the number of scribes falls below the point where apprentices cannot be trained, the script is not merely 'reduced'; the mechanism of transmission is broken. This is a phase transition, not a gradual slide. The threshold varies by context (step 5 admits this), but that does not make it unprincipled; it makes it *system-specific*. To claim arbitrariness because the threshold varies is like claiming medicine is arbitrary because the lethal dose of poison varies by patient.

  ### The Cost of Refusing (5)
  To refuse (5) while keeping (1), (2), and (6) costs you rhetorical simplicity, but it saves your claim to objectivity.

  1.  **You must accept that 'collapse' is always elliptical.** You cannot say 'The Maya collapsed.' You must say 'The Maya *polity system* collapsed.' This aligns with your acceptance of (6). The cost is that you cannot speak of 'Civilisation' as a monolith.
  2.  **You must commit to mechanism over metric.** You cannot define collapse solely by a drop in population (a metric); you must define it by the breakage of the mechanism that population supported (e.g., the irrigation network).
  3.  **You concede that some 'collapses' are beneficial.** If the relatum is 'elite monumental building', its collapse might improve peasant welfare. This is not a contradiction; it is a precise finding.

  ### Concrete Application: Evidence and Mixed Cases
  You asked how one could tell from the evidence whether a society had crossed a principled threshold, and what to say about mixed cases (literacy down, calories up).

  **1. Identifying the Threshold from Evidence**
  Do not look for a percentage decline; look for the **breakage of reproduction chains**.
  *   **Principled Test:** Can the system reproduce itself without external input?
  *   **Evidence:** In the Late Bronze Age, we do not just see fewer tablets; we see the loss of the specific clay preparation techniques and the dialect required to read them. If a generation passes without a master-apprentice dyad in a critical specialist role (e.g., high-temperature kiln firing), the threshold is crossed.
  *   **Differentiation:** This is not arbitrary. It is empirically falsifiable. If you find a kiln capable of 1200°C in a period supposed to be 'post-collapse', the claim that the technology collapsed is false.

  **2. Handling Mixed Cases (Literacy vs. Calories)**
  Your friend argues in (6) and (7) that because subsystems diverge, the label 'collapse' is subjective. You counter that **the subjectivity lies in the research question, not the answer.**

  *   **Case:** Literacy vanishes, but caloric intake rises (e.g., the Greek Dark Ages).
  *   **Analysis:**
      *   Relatum A: *Palatial Redistribution System.* Status: **Collapsed.** (Evidence: No Linear B, no central storage).
      *   Relatum B: *Peasant Subsistence Security.* Status: **Recovered/Stable.** (Evidence: Better skeletal health, more diverse diet).
  *   **Resolution:** It is a matter of fact that Relatum A failed and Relatum B persisted. To ask 'Did they collapse?' is a category error. The correct question is 'Did the mechanism of X fail?'
  *   **Why this defeats (8):** If you wish to forecast the risk to *our* civilisation, you must specify the subsystem. If you mean 'global supply chains', the forecast is based on stress indicators (port throughput, just-in-time inventory resilience). That is a forecast, not a mood. If you mean 'human survival', the forecast is different. The fact that you must specify the variable does not make the resulting prediction subjective.

  ### Summary for Your Seminar
  When you write your response, structure it thus:

  1.  **Grant (1), (2), and (6).** Societies are not organisms; collapse is measured in dimensions; and it always applies to specific subsystems.
  2.  **Deny (5).** Argue that variability does not entail arbitrariness. Functional thresholds are determined by the minimum complexity required to sustain a specific causal chain (e.g., specialist reproduction).
  3.  **Block the inference to (7).** Just because a concept requires definition (relatum + threshold) does not make its application a matter of opinion. 'Hypertension' requires a threshold that varies by age and history, but having it is a fact.
  4.  **Conclude against (8).** Warnings of collapse are forecasts regarding the stability of defined systems under stress. They are falsifiable. If the specialist chain breaks, the system has collapsed, regardless of whether the population is happy.

  By refusing (5), you turn 'collapse' from a vague moral judgement into a precise technical diagnosis of system failure. You keep your nominalism, but you reclaim the right to say that some things actually break.
