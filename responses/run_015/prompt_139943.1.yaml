  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I violate constraint (1)? No, I'm not saying society is an organism. I'm saying *systems* have functional requirements.
      *   *Check:* Did I violate constraint (2)? No, I'm using measurable dimensions.
      *   *Check:* Did I violate constraint (6)? No, I'm embracing the subsystem focus.
      *   *Key Distinction:* Distinguish between *vagueness* (Sorites) and *complexity* (Tipping points). The friend treats social systems like piles of sand; they are more like bridges or ecosystems.
      *   *The "Principled" definition:* A threshold is principled if it marks a change in the *causal powers* of the system. If the palace can no longer redistribute grain, it doesn't matter if 10% of the bureaucracy remains; the *system* of redistribution has collapsed.
      *   *Mixed Case:* If literacy goes but calories rise, did "Civilisation" collapse? "Civilisation" is too vague. Did the "Scribal System" collapse? Yes. Did the "Agrarian Subsystem" collapse? No. The friend says this makes the whole claim subjective. The counter is: Scientific claims always require defined variables. Defining variables isn't "arbitrary" in the pejorative sense; it's methodological.

  8.  **Final Polish (British English & Tone):**
      *   Ensure "s" instead of "z" in organisation/analysing.
      *   Ensure "programme" if used (though likely not needed).
      *   Ensure "centre" not "center".
      *   Make sure the tone is suitable for a graduate seminar context (rigorous, not dismissive).

  9.  **Final Review against constraints:**
