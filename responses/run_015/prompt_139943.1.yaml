      *   (4) Threshold claim: Collapse depends on arbitrary thresholds.
      *   (5) No principled threshold: Even functional floors are arbitrary/variable.
      *   (6) No principled relatum: Collapse is always of a subsystem (palaces vs. villages).
      *   (7) Sorites/Subjectivity claim: Therefore, collapse is a perspective, not a fact (heap paradox).
      *   (8) Conclusion: Collapse isn't a discovery; warning of collapse is a mood, not a forecast.

  3.  **Identify the Weak Link (The "Step to Refuse"):**
      *   The user wants to keep (1), (2), and (6).
      *   (1) is safe (methodological individualism/nominalism).
      *   (2) is safe (operationalism).
      *   (6) is safe (differentiation of subsystems).
      *   The jump from (6) to (7) is the critical vulnerability. Specifically, step (5) and the inference to (7) rely on a specific definition of "fact" or "principled" that is too demanding.
      *   *Candidate 1: Refuse (3).* Are all changes continuous? Some things are discrete (e.g., loss of a specific technology chain). But the user wants to keep (2) which implies measurable dimensions, often continuous.
      *   *Candidate 2: Refuse (5).* Are thresholds truly unprincipled? Functional interdependence creates non-linear tipping points.
      *   *Candidate 3: Refuse (7).* Even if thresholds are chosen, does that make the *outcome* merely a perspective? (The "heap" analogy is flawed for complex systems).
      *   *Best Fit for User's Constraints:* The user wants to keep (6) (subsystems). This suggests the argument fails at **(5)** or the inference from **(5)+(6) to (7)**. The friend argues that because thresholds are context-dependent, they are *arbitrary*. This is a non sequitur. Context-dependence $\neq$ Arbitrariness.
      *   *Decision:* The step to refuse is **(5)** (and consequently the inference to 7). The claim that "No threshold is principled" is false. Functional thresholds *are* principled, even if variable.

  4.  **Develop the Counter-Argument (Refusing Step 5):**
      *   *Why it looked sound:* It appeals to the Sorites paradox (heap of grain). It assumes continuity implies no qualitative breaks.
      *   *Why it fails:* Complex systems exhibit *non-linear dynamics*. A threshold isn't arbitrary just because it varies by system. A bridge collapses at a specific weight limit; that limit varies by bridge, but it's not "arbitrary."
      *   *The "Principled" Threshold:* It's about *functional integrity* of the specific subsystem chosen in (6). If the subsystem is "palatial redistribution," the threshold is the point where redistribution *ceases to function*, not just declines.
      *   *Cost:* You have to accept that "collapse" is a *functional* description, not a moral one (keeping 1), and it applies to specific *systems* (keeping 6), but it is an *objective fact* that a system stopped functioning, even if the metric is continuous.

  5.  **Address the Concrete Requirements:**
      *   *How to tell from evidence:* Look for structural breaks in the *mechanism*, not just the volume. E.g., not just "less pottery," but "no kilns capable of high-fire." Not just "less writing," but "no one who can read the script."
      *   *Mixed Cases (Literacy down, Calories up):* This is the crux of (6). If the relatum is "State Capacity," then literacy loss is collapse. If the relatum is "Peasant Welfare," it might not be. The friend says this makes it subjective (7). The counter is: Once you fix the relatum (the specific system you are studying), the status of collapse is objective. The *choice* of research question is subjective; the *answer* is not.
      *   *Analogy:* Medical diagnosis. "Health" is multidimensional. Blood pressure is continuous. But "Hypertension" has thresholds. They vary by age/context. But once defined, having hypertension is a fact, not a mood.

  6.  **Drafting the Response (incorporating British English):**
