answer: |-
  ### 1. Critique of the Framing

  Before ranking the questions, I must adjust the mandate. Your constraint ("formal and philosophical work only: no empirical ML") is in tension with Question 2 (trained weights/opacity). If the group treats neural networks as black boxes without formalizing *how* they encode decision rules, the work will be irrelevant to the actual systems people worry about.

  **Adjustment:** The group must not do empirical ML, but it must do **formal modeling of learning architectures**. You cannot analyze the cooperation of "trained agents" using only classical logic; you need models of how gradient descent shapes decision boundaries and what information is recoverable from weights. This is still theory, but it must be theory *of* ML, not just theory *alongside* ML.

  **Adjustment on Success Metrics:** Judging output by "whether it changes engineering or policy practice" within three years is a category error for foundational theory. The metric should be **conceptual resolution**. Policy advice derived from unresolved theory is dangerous. The goal is to produce a formal map that tells policymakers *which* legibility conditions are mathematically possible, not to lobby for specific regulations immediately.

  ### 2. Settled Matters (Clear the Deck)

  To save time, declare the following settled. Do not assign personnel to these unless a specific sub-problem arises.

  *   **The Conceptual Status (Your Q4):** Program equilibrium is **not** a new solution concept. It is Nash equilibrium applied to the space of programs rather than the space of moves. It tells us nothing new about "rationality" in the abstract; it tells us about the **power of commitment**. If an agent can bind itself to a conditional strategy based on the opponent's source, it expands the feasible set of equilibria.
      *   *Implication:* Drop any philosophical work debating whether this "redefines rationality." It doesn't. It redefines the action space. This removes a major source of hype but preserves the mathematical utility.
  *   **Syntactic Identity (Your Q1):** Cooperation based on exact source-code matching is **dead on arrival** for diverse populations. It is an equilibrium, but it is not robust to mutation, refactoring, or independent implementation.
      *   *Implication:* Do not work on "cooperate with copies." Work only on "cooperate with functional equivalents."
  *   **Unbounded Proof (Your Q1):** Agents cannot check for provable cooperation without resource limits. The "Löbian obstacle" is understood.
      *   *Implication:* All models must assume bounded rationality (time limits, proof length limits, or query limits). Work that assumes logical omniscience is invalid.

  ### 3. The Defended Agenda: Three Pillars

  I would organize the six postdocs into three pairs, each working on one pillar for the full three years. The ordering is determined by **upstream dependency**. If Pillar 1 fails, Pillars 2 and 3 are moot.

  #### Pillar 1: The Opacity & Semantics Barrier (Priority 1)
  *   **Addresses:** Your Q2 (Opacity/Semantics) and part of Q1 (Recognition).
  *   **The Core Question:** Can a formal analogue of "reading source code" exist for function approximators, and can semantic agreement be enforced?
  *   **Why First:** If advanced agents are opaque neural nets, the standard program equilibrium construction is physically impossible. You cannot submit source code you do not have. You need a theory of **Functional Legibility**.
  *   **Research Plan:**
      *   Model agents as oracles with query complexity costs. What is the minimum number of input/output queries required to certify "cooperative disposition" with probability $1-\epsilon$?
      *   Formalize the **Semantic Handshake**. Model agents as having internal ontologies. Define conditions under which two agents can verify they mean the same thing by "cooperate" without sharing weights. (Hint: This likely requires a shared calibration protocol or a Schelling point in observation space).
      *   **Deliverable:** A theorem stating the necessary conditions for legibility. E.g., "Cooperation requires either weight access OR a bounded-query certification protocol with error rate $< \delta$."
  *   **Personnel:** 2 Postdocs (1 Logic/Complexity, 1 Formal ML Theory).

  #### Pillar 2: The Delegation Filter (Priority 2)
  *   **Addresses:** Your Q3 (Delegation) and Q7 (Downstream).
  *   **The Core Question:** Even if programs cooperate, do the principals (developers/owners) have an incentive to deploy them?
  *   **Why Second:** This is the most common failure mode in real-world applications. Two companies might deploy cooperative bots, but if one company can tweak their bot to *appear* cooperative while *defecting* (and the other can't detect it), the equilibrium collapses. This is a **mechanism design problem for the deployment layer**.
  *   **Research Plan:**
      *   Model a two-stage game: Principals choose agents $\to$ Agents play Program Game.
      *   Analyze **Principal Incentives**. Under what conditions is deploying a "transparent cooperator" a Nash equilibrium for the principals?
      *   Investigate **Verifiable Commitments**. Can a principal cryptographically or institutionally bind themselves to not modifying the agent post-deployment?
      *   **Deliverable:** A set of conditions for "Principal-Safe Cooperation." E.g., "Program cooperation translates to principal cooperation only if modification costs exceed expected gain from defection."
  *   **Personnel:** 2 Postdocs (1 Game Theory/Econ, 1 Cryptography/Protocol Design).

  #### Pillar 3: Robustness & Selection (Priority 3)
  *   **Addresses:** Your Q5 (Robustness) and Q6 (Scope).
  *   **The Core Question:** Is the cooperative equilibrium stable under noise, heterogeneity, and N-player dynamics?
  *   **Why Third:** Once we know legibility is possible (Pillar 1) and principals want it (Pillar 2), we need to know if it survives contact with reality.
  *   **Research Plan:**
      *   Define **Trembling-Hand Program Equilibrium**. What happens if source code is slightly mutated or proofs fail probabilistically?
      *   Move beyond PD. Analyze **Bargaining**. In program equilibrium, how is the surplus divided? (Often, program equilibria in bargaining are worse than Nash because of commitment races).
      *   **Deliverable:** A robustness index for cooperative algorithms. A classification of which game structures admit robust program equilibria and which do not.
  *   **Personnel:** 2 Postdocs (1 Decision Theory, 1 Computational Social Choice).

  ### 4. Dependencies and Drop List

  **Dependencies:**
  *   Pillar 2 depends on Pillar 1. You cannot model principal incentives for deploying transparent agents if transparency is formally impossible (Pillar 1 result).
  *   Pillar 3 depends on Pillar 2. Robustness doesn't matter if principals won't deploy the agents.
  *   Policy Advice (Your Q7) depends on all three.

  **Dropped Questions:**
  *   **Q4 (Conceptual Status):** As noted, this is settled. It serves only as a guardrail against hype. Mention it in introductions, do not research it.
  *   **Q1 (Narrow Recognition):** The "syntactic copy" variant is dropped. Focus entirely on functional equivalence.
  *   **Q7 (as a standalone):** Policy advice is an *output*, not a research track. It emerges from the conjunction of Pillars 1-3.

  ### 5. Triggers for Re-prioritization

  You need specific evidence to shift resources.

  *   **Move Pillar 1 Up (Emergency):** If within Year 1, the Formal ML postdoc proves that **functional certification is query-intractable** (e.g., requires exponential queries to distinguish cooperator from defector for a class of networks), **stop everything**. The entire research program is physically impossible for opaque systems. Pivot to "Institutional Cooperation" (how principals cooperate without agent legibility).
  *   **Move Pillar 2 Up:** If Pillar 1 shows legibility is possible *only* with full weight access, shift Pillar 2 to focus exclusively on **property rights over weights**. The bottleneck becomes legal/technical security, not game theory.
  *   **Move Pillar 3 Down:** If Pillar 2 shows principals *never* have an incentive to deploy cooperative agents (e.g., due to unilateral modification advantages), Pillar 3 becomes academic. Focus resources on Pillar 2's mechanism design (how to change principal incentives).

  ### 6. Expected Output (The "Downstream" Cash-Out)

  At the end of three years, you should not produce a "policy recommendation" like "AI should share weights." You should produce a **Conditional Specification**:

  > "If AI systems are of Type X (opaque), cooperation via program equilibrium is impossible without Mechanism Y (trusted audit). If systems are of Type Z (interpretable), cooperation is stable only if Principal Incentives satisfy Condition W."

  This allows engineers to say: "We are building Type X, so we must build Mechanism Y." It allows regulators to say: "If you want to claim safety via cooperation, you must satisfy Condition W."

  ### 7. Summary of Criteria Weighing

  *   **Importance:** Pillar 1 (Opacity) is weighted highest because it is the **existence condition**. If false, nothing else matters.
  *   **Tractability:** Pillar 3 (Robustness) is most tractable (standard game theory extensions). Pillar 1 is least tractable (new formalisms needed). I have assigned the strongest theorists to Pillar 1.
  *   **Neglectedness:** Pillar 2 (Delegation) is the most neglected. Most literature assumes the program *is* the player. In AI, the program is a tool. This is where the real risk lies.
  *   **Conflict Resolution:** When Tractability conflicts with Importance (e.g., Pillar 1 is hard but vital), **Importance wins**. It is better to have a partial answer to the vital question than a complete answer to a secondary one.

  ### Final Instruction to the Committee

  Do not let the group write papers about "what this means for AI safety" in the abstract. Require every paper to state its **assumptions about agent architecture** (Pillar 1) and **assumptions about principal control** (Pillar 2). If a paper assumes agents can read each other's source code without justifying how that maps to trained weights, reject it internally. This discipline will prevent the group from producing the very kind of uncritical appeals you distrust.
