      *Looking at 4 vs 5 again.* If the distinction is empty, autonomy is hard to ground. If autonomy is grounded in "respecting modes," then the distinction *does* have weight (the weight of respect). So 4 contradicts 5 directly. 4 says "No weight." 5 says "This has weight." This is a logical contradiction.
