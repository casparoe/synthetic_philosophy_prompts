      "Maybe walls are necessary. But dont pretend they're natural."

      "Never said they were. Just said they're structural. You can't have a decision procedure without deciding who decides. That's the hard stop."

      "Yeah. Just hate who ends up on the wrong side of the stop."

      "Me too. But democracy isn't about fixing everything. It's about ruling ourselves. Not everyone."

