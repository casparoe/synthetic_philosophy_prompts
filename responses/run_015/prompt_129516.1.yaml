    "clean_mapping": "The structural isomorphism between formal systems and recursive control networks is robust. Hofstadter's strange loops map cleanly onto tangled hierarchies where output feeds back to modify internal gain, and the Gödelian bifurcation corresponds to a control system hitting a stability limit where error minimization requires shifting the operating point. Both frameworks describe how local rules generate global constraints that loop back to restrict the generator.",
    "forced_distortion": "Mapping logical truth to system stability requires distorting the concept of provability into reachability. In arithmetic, a statement is true regardless of proof; in control theory, a state is only 'real' if the system can stabilize there. This forces a conflation of semantic truth with dynamic equilibrium, implying that unprovable statements are merely unstable states rather than fundamentally undecidable propositions.",
    "untranslatable_residue": "The intentionality or 'aboutness' of the Gödel sentence has no analog in pure dynamics. A feedback signal correlates with a state variable, but it does not refer to it in a semantic sense. The control system regulates error without 'knowing' what the error represents, leaving the phenomenological content of self-awareness entirely outside the scope of signal processing and emergence.",
    "where_the_gap_lives": "The gap indicates Hofstadter was reaching poetically rather than rigorously. Your framework is sufficient for describing the causal architecture of recursion, but consciousness involves semantic closure that control theory ignores. The analogy holds for the shape of the loop, but fails to explain why some loops feel like something from the inside while others are just empty oscillations."
