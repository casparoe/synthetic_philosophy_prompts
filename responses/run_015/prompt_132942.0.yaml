answer: |-
  **Q&A PREP SHEET: HOOKED FLOATING RATIONALES**
  **Workshop:** Phil Mind & Empirical Metaethics
  **Date:** Next Thursday
  **Audience:** Moral Psych, Evo Ethics, 1 Kantian

  **OPENING CONCESSION (Say this early to disarm the empiricists)**
  Look, I'm conceding right out of the gate that *pure* floating rationale views (robust non-naturalism without constraints) get shredded by evolutionary debunking arguments. If reasons are totally unmoored from creatures like us, there's no explanation for why our cognitive faculties would track them rather than just fitness-enhancing fictions. That's why the "hook" is necessary. It's not just an add-on; it's the bridge that stops the view from being epistemically bankrupt. I'm not trying to save Platonism from Darwin; I'm trying to save normativity from reduction.

  ---

  **TOP 7 OBJECTIONS (Ordered by Damage Potential)**

  **1. The Evolutionary Debunking Attack (The Empiricists' Main Weapon)**
  *   **The Objection:** "Even with the hook, you haven't solved the debunking problem. Evolution selected us for survival, not for grasping 'floating' truths. If the reasons exist independently of our psychology, what guarantees that the 'hook' (our cognitive capacity) latches onto *real* reasons rather than adaptive illusions? You've just added a step between evolution and normativity, but the link is still unexplained."
  *   **2-Min Reply:** The hook isn't claiming evolution selected *for* truth-tracking directly. It's claiming evolution selected for *complex deliberative capacities* that make truth-tracking possible. Think of it like vision: evolution didn't select for seeing quantum fields, but it gave us eyes that can be trained to see them. The hook is the capacity for reflective equilibrium. We don't need a genetic guarantee; we need a cognitive architecture that allows us to correct errors. The floating reason is the target; the hook is the bow. Evolution built the bow, not the target.
  *   **Soft Spot/Hand-waving:** This relies heavily on the analogy between perception and reason. The psych crowd knows perceptual systems are heuristic-driven and prone to systematic bias. If the "bow" is warped by fitness needs, how do we know it hits the "target"? I'm assuming rationality can self-correct beyond evolutionary constraints, which is exactly what they doubt.

  **2. The "Hook" is Just Psychology (Collapse Objection)**
  *   **The Objection:** "If a reason only becomes binding when a reasoner can grasp it, haven't you just collapsed into a response-dependent view or sophisticated constructivism? You say the reason floats, but if it does nothing without the hook, the 'floating' part is doing no work. It's ontological baggage. Why not just say reasons are constituted by the potential responses of agents?"
  *   **2-Min Reply:** Because the *content* of the reason isn't determined by the response. If I fail to grasp a mathematical truth, the truth doesn't change. Same here. The hook determines *access* and *bindingness*, not existence or content. We need the floating part to explain error: I can feel hooked but be wrong. If reasons were just constituted by my potential responses, I couldn't be mistaken about what I have reason to do, only inconsistent. The floating part preserves the normativity; the hook preserves the action-guidance.
  *   **Soft Spot/Hand-waving:** I'm drawing a hard line between "existence" and "bindingness" that might not hold up. If it's not binding, in what sense does it "exist" as a normative entity? This sounds like I'm redefining existence to save the theory. It risks sounding like a distinction without a difference.

  **3. Causal Inertness (The Queerness Objection)**
  *   **The Objection:** "How does a floating reason actually guide action? If it's not a mental state, it lacks causal power. If it doesn't cause anything, how is it practical? You're positing entities that sit outside the causal closure of the physical world but somehow influence behavior via the 'hook.' That's spooky."
  *   **2-Min Reply:** Reasons don't need to be efficient causes; they are final causes or justifications. The *mental state* of grasping the reason is the cause. The floating reason is the content of that state. We don't say the proposition '2+2=4' causes me to write '4' on the page; my belief does. But the belief is about something independent. The hook is just the mental state of apprehension. I'm not claiming magic causation; I'm claiming normative explanation is distinct from causal explanation.
  *   **Soft Spot/Hand-waving:** The Kantian will hate this (reason must be efficacious). The naturalists will say "if it doesn't cause anything, why posit it?" I'm leaning on the fact/value distinction, which half the room thinks is dead. It sounds dualist.

  **4. Parsimony / Occam's Razor**
  *   **The Objection:** "Your view has all the downsides of realism (queer entities) and all the downsides of constructivism (dependence on agents). Why not just cut out the middle man? Either go full naturalist (reasons are desires) or full non-naturalist (reasons exist regardless). This hybrid is expensive metaphysics for no gain."
  *   **2-Min Reply:** The gain is avoiding the extremes. Full naturalism can't explain normative error (if reasons are desires, I'm never wrong, just unique). Full non-naturalism can't explain motivation (why care about floating stuff?). The hybrid explains why we feel compelled by things outside us (floating) but also why normativity vanishes if no minds exist to care (hook). It's not expensive; it's necessary to capture the phenomenology of deliberation.
  *   **Soft Spot/Hand-waving:** "Phenomenology" is a weak shield against ontological parsimony. An error theorist will say "feelings of compulsion are just feelings." I'm positing entities to match feelings, which is arguably bad method.

  **5. The Kantian Objection (Contingency of the Hook)**
  *   **The Objection:** "If normativity depends on a contingent hook (a specific type of reasoner), then moral obligations are contingent. If humans went extinct, would torturing babies still be wrong? Your view suggests 'no' because no hooks exist. That undermines the universality of normativity."
  *   **2-Min Reply:** I distinguish between *reasons existing* and *obligations obtaining*. The reason "suffering is bad" floats forever. But an *obligation* is a demand on an agent. No agents, no demands. That doesn't make the value contingent; it makes the duty relational. It's like a law: without a jurisdiction, the law doesn't bind, but the principle of justice remains.
  *   **Soft Spot/Hand-waving:** The Kantian will say this reduces morality to hypothetical imperatives. If it doesn't bind anyone, is it really moral? This concession might alienate the one person in the room who cares about deontology.

  **6. Epistemic Access (How do you know?)**
  *   **The Objection:** "You say the hook grasps the floating reason. What's the mechanism? Is it intuition? Reasoning? If it's reasoning, that's just psychological processing. If it's intuition, that's empirically dubious. How do I distinguish a real hook-up from a confident delusion?"
  *   **2-Min Reply:** It's coherence within a web of beliefs and desires, tested against reality. There's no single mechanism. It's the same way we access logic or math. We don't have a 'logic organ,' we have cognitive processes that converge on logical truths. The test is intersubjective agreement under ideal conditions.
  *   **Soft Spot/Hand-waving:** Moral psych shows we don't converge under ideal conditions; we polarize. Relying on "ideal conditions" is a classic escape hatch that empirical work suggests doesn't exist. Sounds like I'm ignoring the data on disagreement.

  **7. The Category Mistake Charge**
  *   **The Objection:** "Reasons aren't objects that float or hooks that grab. 'Reason' is a word we use to describe relationships between actions and goals. You're reifying a linguistic function into a metaphysical structure. It's a category mistake."
  *   **2-Min Reply:** I'm not reifying reasons as physical objects. I'm reifying them as truth-apt contents. When we argue about ethics, we act like we're discovering something, not just mapping our preferences. My view takes that practice seriously. Dismissing it as a category mistake ignores the phenomenology of normative debate.
  *   **Soft Spot/Hand-waving:** "Taking practice seriously" is the default realist move. The pragmatists in the room will say practices can be useful without being metaphysically literal. I'm assuming the surface grammar of moral language reflects ontology.

  ---

  **THE PRAYER QUESTION (The One I Hope Nobody Asks)**
  *   **The Question:** "Isn't this just old-fashioned Moral Platonism with an epistemic condition tacked on? You say reasons float (Platonism) but need a hook (Epistemic condition). If the hook is just 'being a rational agent,' haven't you just smuggled agent-dependence back in while claiming independence? What actually does the work here—the floating or the hook? If it's the floating, you're a Platonist. If it's the hook, you're a Constructivist. You can't have it both ways."
  *   **The Panic Reply:** "It's not either/or. The floating part explains *authority* (why I can't just choose my reasons). The hook explains *applicability* (why reasons apply to me). Without the floating part, authority collapses into preference. Without the hook, applicability collapses into magic. I'm trying to split the difference to save both."
  *   **Why This Hurts:** Because logically, if bindingness requires the hook, then the *normative force* is dependent on the agent. If the force is dependent, the "floating" existence is inert. It looks like I want the prestige of Realism without the costs. This cuts to the core coherence of the view. If I stumble here, the whole hybrid collapses.
