      *   *Plumbing/Electrics:* Daily social reproduction (how things actually flow day-to-day).
      *   *Architect:* Class struggle? Historical necessity? (This is tricky because Marx doesn't really have a conscious "architect" of history, it's immanent). Let's say "Historical Material Conditions" or "Class Struggle."
