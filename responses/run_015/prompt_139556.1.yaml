answer: |-
  You have put your finger on one of the central, gnawing problems of modern historiography and archival science. You are describing a phenomenon that is widely recognized in critical theory but, you are correct, lacks a single, tidy noun that captures the specific *correlation* you've identified: that **detail and subjugation are not just correlated, but causally linked in the record itself.**

  There is no single established word for this exact pattern, but there is a robust neighborhood of concepts. To understand why your observation is distinct, we have to look at the existing terms and why they fall slightly short of your definition.

  ### The Existing Neighborhood

  **1. Archival Silence (Michel-Rolph Trouillot)**
  *   **What it is:** The idea that history is defined by what is *missing*. Marginalized people are absent from the record because they were not considered worth recording.
  *   **Why it's not your term:** You are describing the opposite of silence. You are describing a *deafening noise*. The problem isn't that the poor or the queer are absent; it's that they are only present when they are being punished or processed. Silence implies a void; you are describing a trap.

  **2. Archival Violence (Jacques Derrida / Ann Laura Stoler)**
  *   **What it is:** The concept that the archive is not a neutral repository but a site of power where the state enforces its authority. The act of archiving is an act of control.
  *   **Why it's close:** This is the parent concept. However, "Archival Violence" is a broad umbrella. It covers burning records, hiding records, *and* the biased recording of records. It doesn't specifically name the paradox that **the more violent the recording, the more detailed it becomes.**

  **3. The Archival Grain (Ann Laura Stoler)**
  *   **What it is:** In her book *Along the Archival Grain*, Stoler argues that you cannot just "read against" the bias of a colonial record. The bias *is* the content. The bureaucracy's categories (e.g., "vagrant," "degenerate") created the reality they claimed to describe.
  *   **Why it's the closest fit:** Stoler explicitly argues that the "thickness" of the bureaucratic record is a product of the state's anxiety and control. However, "Grain" is a metaphor for the *texture* of the evidence, not a name for the *pattern of density* you are seeing.

  ### A Proposed Term: "Coercive Density"

  Since there isn't a single standard term that captures the *inversion* (where completeness = distortion), I propose we call this **Coercive Density**.

  **Definition:**
  *Coercive Density* is a property of historical records where the volume and detail of information about a subject are directly proportional to the degree of institutional control or surveillance exerted upon that subject. In records exhibiting Coercive Density, "richness" of data cannot be separated from "hostility" of context; attempting to correct for the bias removes the data, and keeping the data reinforces the bias.

  **Why this term works:**
  *   **Coercive:** Identifies the source of the record (an institution acting *on* a body).
  *   **Density:** Identifies the allure of the record (it is thick, detailed, and tempting to use).
  *   **The Trap:** It names the specific problem you identified: you cannot trade one off against the other.

  ### Edge Cases and Boundaries

  You asked where the thing stops. Here is how Coercive Density applies (or doesn't) to your specific scenarios:

  **1. The Hospital/Midwife Log (Recorder has no interest in control)**
  *   **Verdict:** *Partial / Clinical Reductionism.*
  *   **Analysis:** If a hospital logs a midwife's activities purely for medical statistics, there is no *coercive* intent. However, if the log reduces a complex human interaction to a set of medical metrics (e.g., "labor duration," "outcome"), it creates **Administrative Reductionism**.
  *   **Distinction:** This lacks the *hostility* of Coercive Density. It is a distortion of *scope* (only seeing the medical body), not a distortion of *power* (seeing the criminal/pauper body). It counts as Coercive Density only if the logging is done to regulate/license/punish the midwife (e.g., a state board trying to eliminate traditional midwifery).

  **2. Deliberate Community Collection (People recording their own history)**
  *   **Verdict:** *Escapes Coercive Density, enters Representational Bias.*
  *   **Analysis:** This is the antidote to Coercive Density. However, it introduces a different distortion: **Curatorial Idealization**.
  *   **Distinction:** In Coercive Density, the subject is recorded at their worst (arrest, admission). In community collections, the subject is often recorded at their "best" (parades, newsletters, achievements). The record is still distorted (people rarely document their own mundane failures), but the *vector* of the distortion is reversed. It is **Voluntary Density**.

  **3. The Diary (Thick self-authored record)**
  *   **Verdict:** *The Clean Opposite (Interior Density).*
  *   **Analysis:** A diary is thick, but it is generated from the inside out, not the outside in.
  *   **Distinction:** This escapes Coercive Density entirely *unless* the diary was written with the expectation of surveillance (e.g., a prisoner's log, or a diary kept to prove one's sanity to a doctor). If the diary is private, it represents **Interiority**. The distortion here is self-perception, not institutional control.

  **4. The Internet Text Scrapes (Your tangent)**
  *   **Verdict:** *Digital Coercive Density.*
  *   **Analysis:** You are absolutely right to see the parallel. Large Language Models are trained on text scraped from the web. The most "dense" data we have on human behavior comes from platforms designed to extract attention or sell ads (Surveillance Capitalism).
  *   **Distinction:** This is Coercive Density in real-time. The "record" of your personality exists most fully in the databases of data brokers who track your clicks. The detail exists *because* you are being monetized. If you use that data to study "humanity," you are studying "humans as consumers/subjects," not humans as agents.

  ### How to Handle It (Methodologically)

  Since you are actually doing the work, knowing the name is only half the battle. Historians dealing with Coercive Density (like Saidiya Hartman in *Venus in Two Acts*) generally use one of three strategies:

  1.  **Refusal:** Acknowledge the record exists but refuse to use the institutional categories. (e.g., Do not call them "inmates"; call them "residents," and note that the record only exists because of a raid).
  2.  **Reading Against the Grain:** Use the detail to reconstruct the *resistance*. (e.g., The almshouse record says "refused work." You interpret that as "maintained dignity.")
  3.  **Centering the Silence:** Write about the gaps. Acknowledge that we only know this person because they were caught, and explicitly state that their life *between* the records is unknowable.

  ### Summary

  You have identified **Coercive Density**.

  It is distinct from **Archival Silence** (which is about absence) and **Archival Bias** (which implies you can correct for it). It is a specific subtype of **Archival Violence** where the *value* of the source is inextricably tied to the *harm* of its creation.

  It stops where the agency of the recorded person meets the pen. If they held the pen (diary, community newsletter), it is **Voluntary Density**. If the institution held the pen to control them (almshouse, raid log), it is **Coercive Density**. And if the institution held the pen to measure them (hospital log), it is **Administrative Reductionism**.

  You are right to be bothered by it. It means that the clearer the picture gets, the more you are looking through the bars of a cage.
