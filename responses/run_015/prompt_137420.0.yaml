answer: |-
  Here is the breakdown of Priya's ethical framework, derived from the case history you provided.

  ### Part 1: Brainstorming Candidate Principles

  Before settling on the core logic, here are six principles that could explain her behavior, ranked from weakest to strongest fit.

  1.  **Strict Sentient Utilitarianism (Minimize Pain):**
      *   *Theory:* She tries to minimize total suffering.
      *   *Why I'm throwing it out:* She squishes aphids by the dozen and stomps lanternflies. If pain were the primary metric, mechanical crushing is often worse than a fast-acting neurotoxin bait. Also, she accepts the tree dying rather than killing caterpillars, which prioritizes insect life over plant life, but then kills mosquitoes instantly. The "pain" calculus isn't consistent.
  2.  **Native vs. Invasive Species Absolutism:**
      *   *Theory:* Native = Protect; Invasive = Kill.
      *   *Why I'm throwing it out:* German cockroaches and Asian lady beetles are invasive/introduced, yet she refuses to poison roaches and relocates slugs (often non-native pests). She protects honeybees (non-native in the Americas) fiercely. Invasiveness matters, but it's not the sole trigger.
  3.  **Human Responsibility/Fault:**
      *   *Theory:* If we caused it (messy kitchen), we fix it gently. If nature caused it, we let nature be.
      *   *Why I'm throwing it out:* This explains the roach verdict well, but fails on the lanternflies. She didn't invite the lanternflies, yet she stomps them enthusiastically. It explains *how* she fixes her mess (caulking), but not *why* she spares some creatures and kills others.
  4.  **Superorganism Integrity (The "Fingernails" Rule):**
      *   *Theory:* Eusocial colonies (ants, bees) are single animals; individuals are expendable parts. Solitary insects are individuals.
      *   *Why I'm keeping it as a component:* This is crucial for the ant bait vs. wiping distinction. However, it doesn't explain why she relocates a solitary wolf spider but stomps a solitary lanternfly. It explains the *scale* of killing, not the *permission* to kill.
  5.  **Methodological Purity (No Poison/Indiscriminate Harm):**
      *   *Theory:* The *means* of killing matters more than the *fact* of killing. No lingering toxins, no secondary poisoning, no indiscriminate sprays.
      *   *Why I'm keeping it as a component:* This is the strongest consistent thread. Poison bait, gel, fogging, pellets, and neem spray are all rejected. Squishing, stomping, soapy water, and oxalic acid (specific, mite-targeted) are accepted.
  6.  **Contextual Stewardship (Ecological Role + Location):**
      *   *Theory:* An insect's moral status depends on where it is and what job it is doing. Inside = Guest (relocate) unless Threat. Outside = Worker (protect) unless Ecological Threat.
      *   *Why I'm keeping it:* This ties the "winter mosquito" (guest) to the "spider" (guest) and the "lanternfly" (ecological threat).

  ### Part 2: The Best Guess Principle

  Priya is running a hybrid principle I call **The Principle of Direct, Non-Indiscriminate Stewardship.**

  It has three hierarchical constraints:
  1.  **Method Constraint (Hard):** Never use chemical, lingering, or indiscriminate methods (baits, sprays, pellets). Killing must be mechanical, immediate, and targeted. You must take personal responsibility for the death; you cannot outsource it to poison.
  2.  **Integrity Constraint (Hard):** Do not destroy the reproductive core of a social colony (queen/hive) unless it is actively destroying a stewardship project you are responsible for (your hives). Individuals (foragers/scouts) are expendable.
  3.  **Contextual Constraint (Soft):**
      *   *Displaced Individual (Inside in winter/bathtub):* Relocate. They are lost.
      *   *Ecological Threat (Lanternfly):* Kill directly. They are doing harm.
      *   *Functional Neighbor (Garden predators/wild nests):* Coexist. They belong.
      *   *Direct Health Threat (Mosquito on arm):* Kill directly. Self-defense.

  ### Part 3: Predictions for the Asian Lady Beetle Case

  Asian Lady Beetles (*Harmonia axyridis*) are invasive, but they are also beneficial predators (aphid eaters). They are aggregating (not a eusocial colony), they are inside (displaced), and they will leave naturally (seasonal).

  **1. Predicted Verdicts:**

  *   **(a) Vacuuming them up:** **Conditional No.**
      *   *Reasoning:* Vacuuming is mechanical (good), but if they die slowly in the canister, it violates the "immediate death" norm. If you vacuum and *immediately* empty the canister outside into a pile, she might accept it. If you vacuum and bag them to die, she will object.
      *   *Confidence:* 70% No, 30% Yes (if emptied immediately).
  *   **(b) Exterminator drill and dust:** **Hard No.**
      *   *Reasoning:* Violates the Method Constraint (poison), the Integrity Constraint (drilling into their space), and the Contextual Constraint (they are leaving on their own). This is the "county fogging" or "roach gel" equivalent.
      *   *Confidence:* 99% No.
  *   **(c) Sealing cracks and waiting for April:** **Hard Yes.**
      *   *Reasoning:* This treats them as "Displaced Individuals" (winter guests). It uses prevention (sealing) rather than poison. It respects their lifecycle. It aligns with the "winter mosquito on ceiling" case.
      *   *Confidence:* 95% Yes.

  *   **Does Disgust vs. Bites change this?**
      *   *Disgust:* No. Disgust never justifies poison or mass killing in her framework (see: slugs, roaches).
      *   *Bites:* Yes, but only on method. If they are biting you at night, they move from "Guest" to "Direct Threat." This permits mechanical removal (wiping/vacuuming) but *still* does not permit poison. You can defend your body, but you cannot poison the wall.

  **2. The Rule (Stated Sharply):**
  > "You may kill an individual insect immediately and mechanically if it is an ecological invader or a direct physical threat. You may never use poison, bait, or lingering toxins. You must never destroy a social colony's reproductive core unless it threatens a stewardship project you own. If an animal is merely displaced or overwintering, you must relocate it or wait it out."

  **3. Alternative Readings & Predictions:**

  *   **Reading A: "Foragers are Fingernails" (Colony Integrity is everything).**
      *   *Logic:* The only thing that matters is not killing the "whole animal" (the colony).
      *   *Prediction for Wall Void:* Since lady beetles are not eusocial (no queen), they are 200 individual animals. This reading suggests killing them is *easier* than killing ants. It predicts she might be okay with vacuuming them because they aren't a "superorganism."
      *   *Why it's weaker:* It fails to explain why she relocates the solitary wolf spider. If they are just individuals, why not squash the spider?
  *   **Reading B: "Native vs. Invasive" (Ecological Purity).**
      *   *Logic:* Invasive species have no moral standing.
      *   *Prediction for Wall Void:* Lady beetles are invasive. This reading predicts she should want them dead (like lanternflies). It predicts she would support the exterminator if it was efficient.
      *   *Why it's weaker:* She protects honeybees (non-native) and relocates slugs (often non-native). She distinguishes between "invasive pest" (lanternfly) and "non-native neighbor" (bee/slug).
  *   **Reading C: "Human Fault" (Clean Your Mess).**
      *   *Logic:* If we let them in, we let them out.
      *   *Prediction for Wall Void:* Seal the cracks (prevention) is the priority. Killing is secondary.
      *   *Why it's weaker:* Doesn't explain why she stomps lanternflies (not her fault they exist).

  **4. The Best Test Case:**

  Your idea of the **feral honeybee colony in the soffit** is excellent, but I would tweak it slightly to make the conflict sharper.

  *   **The Case:** A paper wasp nest (social, but not "domesticated" like honeybees) under the eave of the house, directly above the back door. They aren't entering the house, but people walk under them daily.
  *   **Why this splits the readings:**
      *   *Colony Integrity:* Says don't destroy the nest.
      *   *Direct Threat:* Says they might sting someone (mosquito on arm logic).
      *   *Location:* They are "outside" but attached to the "sanctuary."
      *   *Prediction:* Priya would likely say: "Leave them until the frost kills the workers, then scrape the empty nest." Or, "Call a beekeeper to relocate." She will almost certainly forbid spraying the nest.
      *   *Why it's better than the honeybee case:* Honeybees are "charismatic." Paper wasps are feared. If she spares the wasps, the "Colony Integrity" and "Non-Indiscriminate" rules are confirmed over "Human Comfort."

  **5. The Practical Solution (What to propose tonight):**

  Do not propose vacuuming or poisoning. Propose **Exclusion and Patience.**

  **Say this:**
  > "I've thought about your rules on this. The beetles are beneficial workers who are just sleeping in our wall for the winter, like the mosquito on the ceiling in November. They aren't a permanent infestation, they're guests. Poisoning them violates the 'no lingering toxins' rule, and vacuuming them might be a slow death.
  >
  > **My proposal:** I will seal every crack I can find on the *inside* of the room tonight so they can't get into the bedroom. For the ones already out, I will catch them in a jar and put them in the vacant lot, or wipe them up if they're dead. We leave the wall void alone until April. If they are biting me at night, I will remove those specific individuals mechanically, but I won't gas the wall. Does that work?"

  **Why this works:**
  1.  It acknowledges the "Winter Mosquito" precedent (they are dormant/guests).
  2.  It respects the "No Poison" constraint.
  3.  It addresses your need (sealing the bedroom) without violating her need (no mass killing of beneficials).
  4.  It frames the beetles as "beneficial workers" (aphid eaters) rather than "pests," aligning with her garden ethic.
