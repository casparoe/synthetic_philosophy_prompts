answer: |-
  This is an incredibly heavy situation, and first, I want to acknowledge the position you are in. You are likely feeling a mix of relief that your roommate is safe, confusion about their anger, and perhaps guilt over breaking your word.

  To answer your specific question: **Yes, there is a robust philosophical framework that supports your roommate's view.** It is possible to hold two truths simultaneously: (1) You did the morally necessary thing by prioritizing their life, and (2) You genuinely broke a moral covenant, and that breach has a "residue" that the good outcome does not automatically wash away.

  Here is a breakdown of the ethical concepts that might help you understand where your roommate is coming from, and why they feel a "stain" remains.

  ### 1. Conflicting Duties (W.D. Ross)
  The philosopher W.D. Ross proposed the idea of *prima facie* duties—obligations that are binding unless they conflict with a stronger obligation.
  *   **Duty of Fidelity:** You promised not to open the drawer. This is a real moral weight.
  *   **Duty of Beneficence:** You have a duty to prevent harm and preserve life.

  In this scenario, the Duty of Beneficence *overrode* the Duty of Fidelity. Most ethicists agree that saving a life trumps keeping a secret. **However,** Ross would argue that just because one duty overrides another, the overridden duty doesn't disappear. You still broke the promise. The fact that you *had* to break it makes the action **justified**, but it does not make the promise **unbroken**. Your roommate is fixating on the fact that the bond of fidelity was severed, even if it was severed for a noble reason.

  ### 2. The Problem of "Dirty Hands"
  There is a concept in political and moral philosophy called the "Dirty Hands" problem (discussed by thinkers like Michael Walzer and Max Weber). It suggests that in certain crises, doing the "right" thing requires getting your hands morally dirty.

  If you had kept the promise and they had died, you would bear the guilt of omission. Because you broke the promise and they lived, you bear the guilt of betrayal. The "stain" your roommate mentions is the moral residue of that betrayal. They are essentially saying: *"You saved my life, but you had to sacrifice our trust to do it. I am alive, but the trust is dead."* They are not denying you saved them; they are mourning the cost of that salvation.

  ### 3. Autonomy and Objectification (Kantian Ethics)
  This is likely the core of your roommate's anger. Immanuel Kant argued that human beings should be treated as "ends in themselves," never merely as "means" to an end.
  *   **Your perspective:** You treated them as a person whose life needed saving (an end).
  *   **Their perspective:** In that moment, you treated them as a problem to be solved or a project to be managed (a means).

  For someone with trauma regarding privacy violations, that locked drawer wasn't just storage; it was a boundary that defined where *they* ended and *others* began. By crossing that boundary, even to save them, you inadvertently confirmed a fear they likely have: that they do not have full ownership over their own self, and that others reserve the right to override their will "for their own good." This feels like paternalism. To them, the act said: *"I know what is best for you better than you do."* That is a deeply disempowering feeling, even when the result is survival.

  ### 4. Trust as Predictability
  Philosophically, trust is often defined as a form of predictability. When you swore an oath, you created a safe container where they knew exactly what would and wouldn't happen.
  *   **The Breach:** By opening the drawer, you made the world unpredictable again.
  *   **The Consequence:** If a promise can be broken when *you* decide the stakes are high enough, then the promise was conditional, not absolute.

  For a trauma survivor, conditional safety often feels like no safety at all. They are angry because the "rule" that kept them feeling secure was revealed to be flexible. They aren't just mad about the drawer; they are mad that the universe proved to be less controllable than they hoped.

  ### How to Move Forward
  Understanding this doesn't mean you did the wrong thing by calling for help. You absolutely did the right thing. A dead friend cannot be angry, but a living one can. The ethical "stain" is the price of their life, and that is a tragic trade-off.

  If you want to repair the relationship, avoid defending the *outcome* ("But you're alive!") and instead validate the *breach*.

  *   **Acknowledge the Cost:** "I know that saving your life came at the cost of your trust. I understand that I broke a solemn vow, and that the good outcome doesn't fix the fact that I crossed your boundary."
  *   **Validate Their Autonomy:** "You are right that I took control away from you. I hated having to do that, but I couldn't live with the alternative. I understand that makes you feel unsafe with me."
  *   **Accept the Residue:** Don't try to convince them the stain is gone. It might not be. You have to accept that the relationship has changed.

  **Summary**
  Your roommate is articulating a Deontological (rule-based) and Autonomy-based ethic, while you are operating from a Consequentialist (outcome-based) ethic. Both are valid. You chose the outcome (life) over the rule (the promise). They are grieving the rule. You can be right that you saved them, and they can be right that you wronged them. Holding both truths is the only way to navigate the aftermath.

  ***

  *Since this situation involved a crisis, I want to gently remind you that supporting a roommate through this is heavy lifting. Make sure you are also taking care of your own mental health as you navigate this fallout.*
