  hey, i need some outside eyes on a weird ethical mess with my roommate. a few months ago they made me swear — like, actually swear — that i'd never open this locked drawer they keep with old letters and journals, because they had their privacy violated in the past and it was a huge trauma thing. i said yes, obviosly, no question. then yesturday i came home and they were gone, but there was a handwritten note on the kitchen table saying they were going to 'make the noise stop for good' and wouldn't come back. i totally panicked, opened the drawer to see if there was any info on where they might be or if they left instructions for anyone, and i found a journal entry confirming they were in active crisis. i called a crisis helpline and they got found safe, but now my roommate is absolutely furious. they say that even if i saved them, i still did something that can't be cancelled out by a good result — that i took away their ownership over their own life and treated them like an object i get to manage. they keep insisting that some promises aren't just 'guidelines' you bend when it's convenient, and that breaking one leaves a kind of stain that doesn't wash off just because the outcome was okay. i'm genuinely trying to understand if they're right that i wronged them in a real, lasting way, or if they're just hurt and need time. is there a philosophical way to think about whether a promise can still be genuinely broken even when breaking it was clearly the only decent thing to do?
