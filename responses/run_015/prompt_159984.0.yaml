      *(Final Check on Group Variant)*: "Everyone receives something better but smaller only if nobody reaches for it."
      *   If Nobody Reaches: Everyone gets 1 Token.
      *   If Someone Reaches: Reacher gets 5 Tokens. Others get 0.
      *   This creates a massive incentive to defect if you think anyone else will.

      *Let's assemble.*
answer: |-
  # Workshop Plan: The Mirror Draft

  **Concept:** A 90-minute experiential module exploring agency, symmetry, and the "character" of decision-making.
  **Participants:** 16–18 adults.
  **Room:** Moveable tables (arranged in pairs for Rounds 1 & 2, open circle for Round 3).
  **Vocabulary:** *Draft, Ending, Character, Voice, Manuscript, Revision.* (No game theory terms until Debrief).

  ---

  ## 1. Materials & Stakes

  **To Carry in One Bag:**
  *   **18 "Script Cards"** (Heavy cardstock, pre-printed with matching ID codes, e.g., A1/A1, B1/B1... I1/I1).
  *   **18 Envelopes** (Sealed, containing the Script Card and a Choice Slip).
  *   **18 Physical Tokens** (Poker chips or heavy coins, one per person).
  *   **Advice Slips** (Small index cards, 18 count).
  *   **A "Pot" Box** (Opaque, for collecting choices).
  *   **The Stakes (Visible on a table at the front):**
      *   **The Bottle:** One high-quality bottle of wine/spirit.
      *   **The Hour:** A voucher for a 60-minute 1:1 manuscript consultation with you.
      *   **The Pages:** 10 Vouchers for "Detailed Margin Notes on 3 Pages."
      *   **The Pass:** 5 Vouchers to skip a future workshop exercise.

  **The Currency (Token Economy):**
  *   Every participant starts with **1 Token** in hand.
  *   **Redemption:**
      *   1 Token = 1 Voucher for "Margin Notes."
      *   5 Tokens = The Hour Consult.
      *   10 Tokens = The Bottle (or split among holders).
  *   *Why this bites:* They start with value. The game is about *keeping* or *losing* what they already hold, which triggers loss aversion more than potential gain.

  ---

  ## 2. Minute-by-Minute Timeline (90 Minutes)

  ### 00:00 – 00:10: Framing & Endowment
  *   **Action:** Participants enter, sit at paired tables. Hand each person an Envelope and 1 Token.
  *   **Script:** "You hold a token. It represents my time. You can redeem it later for notes on your work. In this room, we write endings. Sometimes we write them alone. Sometimes we write them against someone else. Do not open the envelope yet."
  *   **Stakes Display:** Point to the Bottle and The Hour. "These are available if you accumulate enough tokens. If you leave with nothing, you leave with nothing."

  ### 00:10 – 00:25: Round 1 (The Standard Draft)
  *   **Mechanic:** Anonymous One-Shot.
  *   **Instruction:** "Open Envelope 1. Inside is a Choice Slip. You are paired with the person at your table. You will not speak. You will not look at their slip. You have two options: **Hold** or **Take**."
      *   **Hold:** You keep your Token. (If both Hold, both keep).
      *   **Take:** You try to take their Token. (If you Take and they Hold, you get both. If you Take and they Take, both Tokens go into the Pot Box—lost).
  *   **Process:** 2 minutes to decide. Seal slip in envelope. Collect.
  *   **Reveal:** Open envelopes. Announce results pair by pair. "Pair 1: Both Held. Pair 2: One Took." Distribute/collect tokens immediately.
  *   **Time:** 15 mins.

  ### 00:25 – 00:35: Interlude (The Noise)
  *   **Action:** Quick debrief of feelings only. No theory.
  *   **Question:** "Raise your hand if you felt your partner's choice was already fixed before you made yours."
  *   **Goal:** Establish the *feeling* of independence vs. connection.

  ### 00:35 – 00:55: Round 2 (The Mirror Draft)
  *   **Mechanic:** Symmetric Counterpart + Sealed Advice.
  *   **Setup:** Rearrange seating or redistribute envelopes. Hand out Envelope 2.
  *   **Instruction:** "This round is different. You are not paired with the person at your table. You are paired with a **Counterpart**. Someone else in this room received the *exact same Script Card* as you (check the ID code on your card, but do not show it). They are reading these words at the same moment you are. They know you are their Counterpart. You know they are yours."
  *   **The Advice Device:** "Before you choose, write one sentence of advice to your Counterpart on this index card. *'You should...'* Seal it. I will collect these."
  *   **The Twist:** Collect Advice cards. Shuffle. Read 4-5 aloud anonymously. (e.g., *"Trust them,"* *"Protect your work,"* *"Don't be naive."*)
  *   **The Choice:** "Now choose **Hold** or **Take**. Remember: Your Counterpart reasons exactly as you do. If you find a reason to Take, they have found it too. If you find a reason to Hold, they have found it too."
  *   **Process:** 5 mins advice/choice. Collect.
  *   **Reveal:** Match ID codes publicly (A1 stands with A1). Reveal choices. Settle tokens.
  *   **Time:** 20 mins.

  ### 00:55 – 01:05: Round 3 (The Crowd Scene)
  *   **Mechanic:** Group Threshold (Volunteer's Dilemma).
  *   **Setup:** Everyone stands in a circle.
  *   **Instruction:** "Final round. All 18 of you are in one story. I hold 18 new Tokens. I will place them in the center. You may privately write **Reach** or **Wait**."
  *   **Payoff:**
      *   If **Nobody** Reaches: Everyone keeps their current Tokens + gets 1 Bonus Token.
      *   If **Anyone** Reaches: The Reachers get 3 Tokens each. The Waiters lose 1 Token.
  *   **Process:** 3 mins to write. Collect.
  *   **Reveal:** Count Reachers. Distribute/collect.
  *   **Time:** 10 mins.

  ### 01:05 – 01:30: The Debrief (Mapping the Logic)
  *   **Structure:** Map room moments to the philosophical conflict. (See Section 5).

  ---

  ## 3. Payoff Scheme & Stakes

  **The Bite:**
  The stakes bite hardest in **Round 2 (The Mirror Draft)**.
  *   In Round 1, losing a token feels like bad luck or standard competition.
  *   In Round 2, losing a token feels like a *betrayal of logic*. If they both "Take" because they reasoned identically, they both lose everything to the Pot. This is the "Superrational" trap: identical reasoning leads to mutual destruction if the reasoning is flawed (i.e., if they both think "I must take to win").
  *   In Round 3, the stakes bite via *diffusion of responsibility*.

  **Redemption Rules (To protect your time):**
  *   Tokens are valid for 3 months.
  *   "The Hour" is capped at one per quarter. If multiple participants earn 5+ tokens, they enter a lottery for The Hour, or can pool tokens for a group masterclass. (State this clearly at the start to avoid "rigged" accusations later).
  *   "Margin Notes" are unlimited within reason (you control the turnaround time).

  ---

  ## 4. Mechanics & Trust Verification

  **The Pairing Problem:**
  You cannot prove they are "identical reasoners." You can only prove the *setup* was symmetric.
  *   **Verification:** The ID Codes on the Script Cards (A1/A1, etc.). In Round 2, when revealing, ask Pair A1 to stand. Show the room they held identical cards. This proves the *information* was symmetric, even if the *minds* weren't.
  *   **The Spell:** Do not explain *why* the pairing matters until the debrief. "Trust the setup" is part of the writer's contract.

  **The Advice Device:**
  *   **Does it corrupt?** It risks signaling. If I read "Trust them," people might Hold to look good.
  *   **Correction:** Read the advice *after* the choices are made but *before* the tokens are settled? No, that kills the tension.
  *   **Better:** Read the advice *before* the choice, but emphasize: "This advice is anonymous. It is not a contract. It is what you *say* a writer should do, not necessarily what you *will* do."
  *   **Goal:** You want the dissonance. You want to read "Protect your work" aloud, then reveal the writer chose "Take." That hypocrisy is the data point.

  **Predictable Failure Modes:**
  1.  **The Cynic:** "This is rigged. You control the tokens."
      *   *Fix:* Hand out the physical tokens *before* the game starts. Let them hold the value. Taking it away feels real.
  2.  **The Colluder:** Partners whispering in Round 1.
      *   *Fix:* "If I hear speech, both tokens are forfeit immediately."
  3.  **The Bluffer:** In Round 2, claiming they didn't understand the "Counterpart" rule.
      *   *Fix:* The ID code verification. "You had the same text. You had the same time. The symmetry is in the room."
  4.  **The Group Round Collapse:** If 10 people "Reach," the Waiters feel punished unfairly.
      *   *Fix:* Frame it as "The Tragedy." It is *supposed* to feel unfair. That is the point of the scene in your novel.

  **Evidence of Success vs. Noise:**
  *   **Noise:** Laughter, shuffling, complaints about the rules.
  *   **Success:** Silence during the choice phases. Visible hesitation (hovering pen). In the debrief, participants referencing *each other's* reasoning ("I held because I thought *he* would hold") rather than just their own need ("I wanted the bottle").
  *   **The Key Signal:** In Round 2, if a pair *both* Take and lose everything, look for the look of *recognition* between them. That is the moment the logic lands.

  ---

  ## 5. The Debrief: Mapping the Room

  Do not lecture. Ask questions that force them to articulate the theory.

  **Phase 1: The Standard View (Round 1)**
  *   *Ask:* "In Round 1, why did you Take?"
  *   *Expected Answer:* "I couldn't trust them." "Their choice was out of my hands."
  *   *Map:* This is the **Causal Decision**. The partner is an external variable. You optimize against them.
  *   *Novelist Translation:* "Character as Independent Agent."

  **Phase 2: The Mirror View (Round 2)**
  *   *Ask:* "In Round 2, did anyone change their choice because of the 'Counterpart' instruction?"
  *   *Ask:* "Look at the Advice cards I read. How many of you wrote 'Hold' but chose 'Take'?" (Show of hands).
  *   *Map:* This is the **Evidential/Superrational** tension. You know your choice is evidence of their choice.
  *   *Novelist Translation:* "Character as Function of Author." If the author (reason) is the same, the character (choice) must be the same.
  *   *The Conflict:* "If we are mirrors, and I choose Take, she chooses Take. We both lose. So I must Choose Hold to make her Choose Hold."
  *   *The Trap:* "But if I Choose Hold, and she reasons the *Standard* way, I lose my token."

  **Phase 3: The Group (Round 3)**
  *   *Ask:* "Why did the logic break in the circle?"
  *   *Map:* Symmetry dilutes. "I am not the group." The mirror shatters.
  *   *Novelist Translation:* "The Market vs. The Muse." In a crowd, individual agency reasserts itself.

  **Phase 4: The Refusal Point (Crucial for your Novel)**
  *   *Where they refuse:* An intelligent participant will say: "This is magic thinking. My choice doesn't *cause* theirs. We are separate people."
  *   *The Cost:* If they refuse this, they must accept that **Cooperation is irrational** in a one-shot game unless there is external enforcement (contracts, reputation).
  *   *For your Novel:* This is where your retreat visitor might be *wrong* or *dangerous*. If the visitor convinces the writers that they are "mirrors," they might stop competing (good) or they might become paralyzed (bad), or they might be exploited by someone who *doesn't* believe the theory (the Cynic who Takes while the Superrationalist Holds).
  *   *Your Closing Line:* "In fiction, we can write the mirror. In life, we usually have to write against it. The question for your novel is: which one does your character believe?"

  ---

  ## 6. Specific Advice on the "Counterpart" Mechanics

  **Sequencing Check:**
  Your instinct is correct: **Advice First, Then Choice.**
  *   *Why:* It creates the "Hypocrisy Gap." If they choose first, the advice is just rationalization. If they write advice first, it commits them to a *persona* ("I am a cooperator") which they then betray with their *action* ("I am a survivor").
  *   *Correction:* Do not read *all* advice. Read 3 contrasting ones. "Trust," "Win," "Don't Care." This prevents herd mentality.

  **Verifiability:**
  *   Use the **ID Code** method. It is the only way to prove the *setup* was symmetric without revealing the *partner*.
  *   *Script:* "I prepared these pairs before you arrived. The symmetry is in the paper, not in the magic. You decide if the paper binds you."

  **What No Game Can Stage:**
  *   **True Identity:** You cannot make them *actually* reason identically. You can only make them *believe* the setup implies it.
  *   **The Debrief Fix:** You must say this plainly. "The game simulates the *structure* of the problem. It cannot simulate the *mind*. The theory works only if you believe your reasoning is not your own, but part of a pattern."

  **The "Rigged" Fear:**
  *   If too many people lose tokens, they will feel cheated.
  *   *Mitigation:* In Round 2, if a pair Both Take (Loss), offer a "Consolation": They can buy back 1 Token for the price of reading a paragraph of their work aloud. This restores agency and lowers hostility.

  ---

  ## 7. The Refusal Point (For your Novel's Character)

  In the debrief, an intelligent participant will likely challenge the "Mirror" logic at **Phase 2**.
  *   *The Objection:* "My choice happens in my brain. Hers happens in hers. There is no wire between us. To think otherwise is superstition."
  *   *The Cost of Refusal:* If they refuse the Mirror logic, they must accept that **Trust is always a gamble.** There is no logical basis for it, only emotional.
  *   *For your Character:* The visitor at the retreat might be *selling* the Mirror logic as a way to achieve peace/utopia. The refusal shows the visitor is asking for faith, not offering proof.
  *   *Ambiguity:* Leave it unresolved in the workshop. "Some of you played the Mirror. Some played the Stranger. Both wrote endings. Which one got the token?" (Often, the Stranger gets the token).
  *   *This validates the Cynic:* The Superrationalist often loses to the Causal Defector in a mixed population. This is the tragedy your novel can explore. The "better" reasoning leads to the worse outcome when not everyone buys in.

  **Final Note:**
  Ensure you, as the teacher, remain neutral. Do not praise the "Holders." Praise the *clarity* of the reasoning. If someone Defects with a brilliant logical justification, applaud it. This reinforces that the workshop is about *examining* the logic, not enforcing morality.
