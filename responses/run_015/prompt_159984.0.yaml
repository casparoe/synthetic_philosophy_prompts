prompt: |-
  I write literary fiction and, once or twice a year, teach a weekend workshop for novelists on character and decision. The next one has sixteen to eighteen adults, a single ninety-minute slot, and a room with moveable tables. I want an activity for it that does one specific job — and, because a novel I am drafting contains a scene in which a visitor at a writers' retreat runs a room through what looks like a parlour game and quietly dismantles a certain style of reasoning, I want the activity to be genuinely playable and not merely describable on the page. If it only works as prose, it is no use to me in either place.

  The reasoning I want them to collide with is this. Two agents who reason identically, and know it, are not in the position the standard argument assumes when each faces a symmetric one-shot dilemma. The standard argument has each of them say: whatever she does, I do better by taking the sure advantage; her decision is already fixed and mine is not; so I take it. The rival thought — call it, in the debrief only, superrationality — says that if she is me in every respect that bears on the case, then her decision and mine are not two independent events, and the only outcomes genuinely available to me are the ones in which we do the same thing; and once the menu has been cut down to those, the sure advantage is no longer sure. I do not want the words game theory, prisoner's dilemma, cooperate, defect, Newcomb, evidential, or superrationality spoken in the room until the debrief, and I would rather the apparatus be dressed in novelists' vocabulary: sealed endings, a character who cannot hear you, the same story written twice.

  What I need from you: rules and a minute-by-minute timeline for ninety minutes; materials I can carry in one bag; a payoff scheme with small but real stakes and no cash — the currency I can actually spend is my own working time and a few desirable objects, so please use exactly that (a one-to-one manuscript consultation, written notes on an excerpt, a good bottle, first refusal on something) and say where the stakes need to bite hardest; the roles or mechanics that make participants run into the conflict themselves rather than hear it named; and a debrief that maps particular moments in the room onto particular parts of the idea, in the order those moments are likely to occur.

  Two mechanics I have in mind, which I would like you to build on, correct, or replace. First, a round of anonymous one-shot plays in pairs, run before any framing, so that the dominance argument comes out of their mouths before it comes out of mine. Second, a round in which each participant is paired with a counterpart who received a byte-identical briefing, who knows the participant received it, who knows that the participant knows, and so on — with the wrinkle that each participant must first write, seal, and hand in one sentence of advice to that counterpart, and that I read a sample of those sentences aloud, anonymously, before any choice is revealed. My hope is that the advice and the sealed choices visibly disagree, and that the disagreement is the thing they feel rather than the thing I announce. Tell me if the sequencing is wrong, or if the advice device corrupts the round it is meant to expose.

  I would also like the group-level variant — the one where a single tempting object is privately offered to each person, and everyone receives something better but smaller only if nobody reaches for it — placed where it does the most work, with an honest account of what group size does to it and why it may pull against the pair case rather than reinforcing it. Then: what will predictably go wrong the first time I run this, above all anything that would lead participants to conclude the set-up was rigged or bluffed, since the second round depends entirely on their trusting the pairing; how to make that pairing verifiable without breaking the spell; which behaviours in the room count as evidence that the activity landed and which are noise, politeness, or showing off; and which part of the idea no game can stage, so that I know what I must say afterwards in plain words. Finally, tell me where in the debrief an intelligent participant could reasonably refuse the conclusion, and what refusing it there would cost them — I may yet want the character who runs the game to be wrong, or at least not clearly right.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**

      *   **User:** Literary fiction writer, teacher of novelists.
      *   **Context:** Weekend workshop, 16-18 adults, 90 minutes, room with moveable tables.
      *   **Goal:** Create a playable activity (not just describable) that embodies a specific game-theoretic/philosophical conflict without using technical jargon during play.
      *   **The Conflict:** Standard Causal Decision Theory (CDT) vs. Superrationality/Evidential Decision Theory (EDT) in a symmetric one-shot dilemma.
          *   *Standard:* "Her choice is fixed; I maximize my gain regardless." (Defect)
          *   *Rival:* "We reason identically; our choices are correlated; I choose the outcome where we both do well." (Cooperate)
      *   **Constraints:** No jargon (game theory, prisoner's dilemma, etc.) until debrief. Use novelist vocabulary (sealed endings, character, story).
      *   **Stakes:** No cash. Currency = Teacher's time (consultations, notes) and desirable objects (bottle, first refusal). Stakes must bite.
      *   **Specific Mechanics to Incorporate/Evaluate:**
          1.  Anonymous one-shot pairs (pre-framing).
          2.  "Counterpart" round (identical briefing) + Sealed Advice (read aloud before choice).
          3.  Group variant (Public Good/Threshold game).
      *   **Deliverables:** Rules, minute-by-minute timeline, materials list, payoff scheme, role/mechanic details, debrief structure, failure modes/trust issues, evidence of success vs. noise, limitations of the game, and the "refusal point" in the debrief.

  2.  **Deconstruct the Core Conflict for Novelists:**

      *   The abstract logic needs translation.
      *   *Standard View:* Character autonomy. "I am me, she is her. I write my ending, she writes hers. I make mine better for me."
      *   *Rival View:* Narrative symmetry/Archetype. "We are the same character in the same draft. If I change the ending, she changes the ending. We share the fate."
      *   *The Tension:* Is a character an independent agent or a function of the author's logic?

  3.  **Evaluate the Proposed Mechanics:**

      *   *Mechanic 1 (Anonymous Pairs):* Essential. Establishes the baseline "defect" instinct. Needs to happen first.
      *   *Mechanic 2 (Counterpart + Advice):* This is the crux. The "Advice" element is risky. If I read advice saying "Trust them," but people still defect, it highlights the hypocrisy/fear. If advice says "Protect yourself" and they defect, it confirms the standard view.
          *   *Critique:* The prompt asks if the advice device corrupts the round.
          *   *Verdict:* It doesn't corrupt it; it *complicates* it. It adds a layer of "what I say I believe" vs. "what I do." However, reading them aloud *before* the choice might influence the choice (signaling). The prompt says "read a sample... before any choice is revealed." This is good. It creates social pressure.
          *   *Refinement:* The "Counterpart" claim needs to be believable. How do I convince 18 people they are paired with an *exact* duplicate? I can't literally do that. I have to use the *fiction* of the workshop. "You are paired with the person who received the exact same prompt card as you." (Actually, everyone gets the same card). The trick is the *belief* in symmetry.
      *   *Mechanic 3 (Group Variant):* This is an N-person Prisoner's Dilemma (or Public Goods Game).
          *   *Conflict:* The prompt asks where to place it and warns it might pull *against* the pair case.
          *   *Analysis:* In a group of 18, the impact of one person's choice on the whole is diluted. In a pair, it's 50%. The "Superrational" argument is strongest in the 1:1 mirror case. In the group case, it feels more like altruism vs. selfishness.
          *   *Decision:* Place it *after* the pair rounds to show the breakdown of symmetry. Or use it to show the cost of the "Standard" view at scale. Let's put it in the middle as a bridge, or save it for the end to show the "tragedy." Actually, the prompt asks for the "group-level variant... placed where it does the most work."
          *   *Strategic Placement:* Do the Pair rounds first (establish the logic). Then the Group round (show the consequence). If everyone defected in pairs, they will likely defect in the group. If they cooperated in pairs, the group round tests if that holds under dilution.
          *   *Correction:* The prompt warns it may pull against the pair case. In the pair case, "I am you" is plausible. In the group case, "I am everyone" is absurd. Running the group round might undermine the specific "mirror" logic of superrationality.
          *   *Recommendation:* Keep the focus on the Pair/Counterpart dynamic. The Group round might muddy the specific philosophical point about *identity* and *symmetry*. However, the user specifically asked for it. I will place it *before* the Counterpart round to establish the "tragedy" of standard reasoning, then use the Counterpart round to offer the "solution" that fails or succeeds.
          *   *Wait, re-reading:* "placed where it does the most work... honest account of what group size does to it."
          *   *Better Plan:* Run the Group round *last*. Why? Because the Pair/Counterpart round is the delicate philosophical experiment. The Group round is the "real world" test where the theory usually breaks. It highlights *why* the Counterpart logic is rare/fragile.

  4.  **Develop the Payoff Scheme (The "Stakes"):**

      *   Currency: Teacher's Time/Objects.
      *   Total participants: 16-18.
      *   Teacher's Time: 90 mins workshop. Can't promise 18 consultations.
      *   *Idea:* "The Golden Hour." One 60-minute consultation. "The Silver Critique." Written notes on 5 pages. "The Bottle." A nice wine/spirit. "The Pass." Skip a workshop exercise next time.
      *   *Distribution:*
          *   Mutual Cooperation (Pair): Both get "Silver Critique" (notes).
