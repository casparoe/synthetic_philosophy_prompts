              *   Pool: A "Masterclass Slot" (1 hour) + A Bottle + 3 "Priority Reads" (2 pages).
              *   If Pair Cooperates: Both get a "Priority Read" token.
              *   If Pair Defects: Neither gets anything.
              *   If One Defects/One Cooperates: Defector gets the "Masterclass Slot" (raffle among defectors? No, too complex).
              *   *Simpler:* Use physical tokens representing value.
