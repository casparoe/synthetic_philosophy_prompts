              *   *Constraint:* I must cap the "One Hour Consult." If multiple people win it, they share the hour or it becomes a raffle.
              *   *Refinement for Trust:* To avoid "rigged" feelings, the rewards must be physically present in the room.
              *   *Physical Stakes:*
                  *   10 Envelopes marked "Margin Notes."
                  *   1 Envelope marked "The Hour."
                  *   1 Bottle of Wine.
              *   *Rule:* If multiple people qualify for "The Hour," they draw straws. If multiple qualify for Notes, everyone gets one until they run out.
              *   *Wait, this introduces luck.* Luck undermines the decision logic.
              *   *Better:* Make the rewards purely symbolic but *felt*. No, user said "small but real stakes."
              *   *Okay, let's look at the "Currency":* My working time.
              *   *Cap:* I will offer *one* Hour Consult total for the whole workshop.
              *   *Payoff Structure:*
                  *   Mutual "Link": Both get a "Fast Pass" (skip queue for future queries) + a high-quality chocolate/small book.
                  *   Mutual "Break": Nothing.
