      *   *Trust:* If they think I'm rigging the pairs. (Solution: Pre-coded cards).
      *   *Cynicism:* "It's just a game." (Solution: Real stakes, serious tone).
      *   *Collusion:* Talking during the game. (Solution: Strict silence, monitors).
      *   *The "Refusal":* Someone says "This is nonsense, I'm maximizing utility."
      *   *The "Wrongness":* The character in the novel might be wrong. I need to leave room for the CDT argument to remain valid.

