answer: |-
  The error is in premise (1), because moral responsibility tracks expected harm and risk imposition rather than strict deterministic but-for causation. Premise (1) fails even outside collective action problems, such as in overdetermination cases like a firing squad where each shooter is morally liable despite no single bullet being a but-for cause of death. In engineering terms, rejecting (1) shifts your model from checking binary return values to evaluating load contributions and race condition probabilities; a single request may not crash a server, but it contributes to the state that triggers a failure threshold. Giving up (1) costs you the computational simplicity of retrospective certainty, forcing ethical calculus to rely on probabilistic forecasts and expected utility rather than verified outcomes, which introduces epistemic uncertainty into moral judgments. This does not collapse ethical systems but aligns them with legal standards on negligence, where creating unjustified risk is culpable even if no specific harm materializes. Premise (2) is empirically accurate regarding deterministic output but incorrect regarding probability space, as individual inputs in redundant systems still shift the likelihood of triggering non-linear threshold functions. By adopting an expected-value framework, you preserve individual obligation in large groups without denying the empirical reality of causal redundancy, effectively resolving the contradiction in (5) by redefining the "harm" in (1) to include risk imposition rather than just realized damage.
