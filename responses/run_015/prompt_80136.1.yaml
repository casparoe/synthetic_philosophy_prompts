answer: |-
  ### Logical Space Brainstorm
  Before deploying the cases, we map the logical dimensions of assertion norms ($N$). A norm asserts: *One must assert $p$ only if $N(p)$.*
  1.  **Factivity:** Does $N$ require $p$ to be true? (Truth/Knowledge/Practical vs. Belief).
  2.  **Internalism:** Does $N$ require access/belief? (Belief/Knowledge vs. Truth).
  3.  **Pragmatic Sensitivity:** Does $N$ vary with stakes/context? (Practical/Contextual vs. Invariant).
  4.  **Normative Source:** Is the rule constitutive (assertion *is* governed by this) or derivative (assertion is governed by morality/prudence)?

  **Position Mapping:**
  *   **Knowledge Norm (KN):** Factive, Internalist (justification), Invariant, Constitutive.
  *   **Truth Norm (TN):** Factive, Externalist, Invariant, Constitutive.
  *   **Belief Norm (BN):** Non-Factive, Internalist, Invariant, Constitutive.
  *   **Practical Norm (PN):** Factive (usually), Context-Sensitive, Constitutive.
  *   **Anti-Norm (AN):** No constitutive rule (governed by Gricean maxims or morality only).

  ---

  ### The Assertion Norm Decision Tree
  *Start here only if you agree assertion is a normative speech act (not just causal/conventional).*

  **Q1. The Lucky Belief Case**
  *Scenario:* You assert $p$. $p$ is true. You believe $p$. But your evidence was a pure guess (garbage).
  *   **A. Proper:** You did nothing wrong *qua* asserter. → Go to **Q2**.
  *   **B. Improper:** You violated a rule of assertion. → Go to **Q3**.

  **Q2. The False Belief Case**
  *Scenario:* You assert $p$. You believe $p$. $p$ is false (unlucky error).
  *   **A. Proper:** Sincerity is all that matters. → **BELIEF NORM**
  *   **B. Improper:** Truth matters regardless of belief. → **TRUTH NORM**
      *(See Flag 1 below)*

  **Q3. The Stake-Shifting Case (Bank Case)**
  *Scenario:* You have standard evidence $p$ closes at 3. Stakes rise (you'll be fired if wrong). Evidence stays same.
  *   **A. Propriety Shifts:** You shouldn't assert in high stakes. → **PRACTICAL NORM**
  *   **B. Propriety Stable:** Stakes don't change epistemic propriety. → Go to **Q4**.

  **Q4. The Knows-But-Doesn't-Believe Case**
  *Scenario:* You reliably say grammatical facts (you "know" them) but deny believing them upon reflection (no conscious conviction).
  *   **A. Proper:** External reliability suffices. → **TRUTH NORM** (Re-route: You likely answered Q1-A unconsciously)
  *   **B. Improper:** Conscious belief/warrant required. → Go to **Q5**.
      *(Note: Standard Knowledge Norm says K entails B, so this case is impossible; if forced, KN says "Improper" because you lack K).*

  **Q5. The Privacy Case (Tax Fraud)**
  *Scenario:* You know $p$ (boss committed fraud). You have warrant. But you promised secrecy.
  *   **A. Proper:** Epistemically fine, just don't say it. → Go to **Q6**.
  *   **B. Improper:** You lack warrant to assert secrets. → **STRONG WARRANT NORM** (Variant of KN)

  **Q6. Privacy: Source of Impropriety**
  *Scenario:* (From Q5-A) You agree assertion is epistemically proper but all-things-considered wrong.
  *   **A. Moral Violation Only:** Epistemic norm satisfied, moral norm violated. → **KNOWLEDGE NORM**
  *   **B. No Violation:** Only conversational fallout, no rule broken. → **ANTI-NORM / NO NORM**

  ---

  ### Analysis & Flags

  **Flag 1: Leaves Hard to Separate (Truth Norm vs. Belief Norm)**
  On the provided cases, **Truth** and **Belief** norms converge if the agent always believes the truth. They only diverge on *False Belief* (Q2) or *Knows-no-Belief* (Q4). Many participants conflate "You shouldn't believe falsehoods" with "You shouldn't assert falsehoods," masking the distinction. If a participant says False Belief is improper *because belief should track truth*, they are effectively holding a Truth Norm disguised as a Belief Norm.

  **Flag 2: Leaves Hard to Separate (Knowledge Norm vs. Practical Norm)**
  In **Low-Stakes Gettier** cases, the Knowledge Norm forbids assertion (no knowledge), while a lenient Practical Norm might allow it (actionable enough). However, if the Practical Norm is defined strictly as "Assert only what you can act on *rationally*," it often collapses into the Knowledge Norm in low stakes. Without probing high-stakes Gettier cases specifically, these leaves can bleed into one another.

  **Empty / Incoherent Combinations**
  1.  **Truth Norm + Lucky Belief Improper:** Incoherent. If the norm is merely truth, garbage evidence with a true result satisfies the norm. Rejecting this implies a justification requirement (moving to Knowledge).
  2.  **Practical Norm + Stakes Insensitive:** Contradictory. The defining feature of the Practical Norm is sensitivity to practical context (stakes/actionability).
  3.  **Belief Norm + False Belief Improper:** Technically coherent only if paired with a separate norm on belief formation. A *pure* Belief Norm of assertion permits asserting falsehoods if sincerely believed. Calling this "improper" usually signals a hidden Truth Norm.
  4.  **Knowledge Norm + Privacy = Epistemic Violation:** Unattractive/Revisionist. Standard KN (Williamson) treats privacy as a moral override, not an epistemic failure. Claiming it is epistemically improper suggests a "Warranted Assertibility" norm that conflates ethics with epistemology.

  **Note on Q4 Routing:** If a participant answers Q1-B (Knowledge/Practical) but Q4-A (Proper without belief), they hold an **Externalist Knowledge Norm** (reliability suffices) rather than an Internalist one. This tree groups them under Knowledge Norm for simplicity, but the logical space permits this split.
