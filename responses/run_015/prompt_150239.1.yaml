answer: |-
  Here is the structural plan for the 50-minute session. It prioritizes the logical dependency of concepts over narrative flow, because as you noted, if the board work is out of order, the argument collapses into a magic trick.

  ### 1. The Dependency Structure (Board Work Sequence)

  You are correct: the definition of **Strategy** is the load-bearing wall. If students view a strategy as "what I do when I get there," Backward Induction (BI) looks like a prophecy. If they view it as "a complete contingent plan chosen at the start," BI looks like a consistency check.

  **The Sequence on the Board:**

  1.  **The Tree (Structure):** Draw the 6-node tree. Label decision nodes, branches (Pass/Take), and terminal payoffs.
      *   *Why first:* You cannot define a strategy without a map of all possible nodes.
  2.  **The Definition of Strategy (Concept):** Write: *"A strategy is a complete plan of action specifying a move for **every** node you control, regardless of whether that node is reached."*
      *   *Why second:* This prevents the "You never reach Node 5" objection later. It forces them to evaluate the plan *ex ante*, not *in media res*.
  3.  **The Rationality Premise (Assumption):** Write: *"Players maximize their own payoff. Player 1 knows Player 2 is rational. Player 2 knows Player 1 is rational."* (Keep it to two levels; don't write "Common Knowledge" yet).
      *   *Why third:* The folding-back algorithm is a mechanical test of this premise. Without the premise, the mechanics are arbitrary.
  4.  **The Folding-Back (Algorithm):** Start at the final node. Circle the rational choice. Move to the penultimate node. Treat the circled future payoff as the certain consequence of passing. Circle the rational choice there. Repeat to the root.
      *   *Why fourth:* This is the derivation. It relies on 1 (to know the nodes), 2 (to know we are selecting a plan), and 3 (to know which branch is chosen).
  5.  **The Outcome vs. The Pareto Optimum (The Paradox):** Circle the BI outcome (e.g., 2,0). Box the outcome if both passed all the way (e.g., 8,8).
      *   *Why last:* The paradox only exists once the derivation is complete and compared to the intuitive "cooperative" path.

  **Crucial Pedagogical Move:** When you do step 4 (Folding-Back), do not say "Player 2 *will* take." Say "If Player 2 is rational, their strategy *must specify* Take here." Maintain the language of plan-consistency, not prediction.

  ### 2. The Concrete Example (6-Move Centipede)

  You need numbers that satisfy three conditions simultaneously:
  1.  **Growth:** The pot grows as you pass (to make the paradox painful).
  2.  **Temptation:** At every node, Taking yields more *for the mover* than Passing *given the opponent's subsequent BI move*.
  3.  **Loss:** The BI outcome is significantly worse for *both* than the final node.

  **The Payoffs (P1, P2):**
  *   **Node 1 (P1):** Take **(2, 0)** | Pass $\to$ Node 2
  *   **Node 2 (P2):** Take **(1, 3)** | Pass $\to$ Node 3
  *   **Node 3 (P1):** Take **(4, 2)** | Pass $\to$ Node 4
  *   **Node 4 (P2):** Take **(3, 5)** | Pass $\to$ Node 5
  *   **Node 5 (P1):** Take **(6, 4)** | Pass $\to$ Node 6
  *   **Node 6 (P2):** Take **(5, 9)** | Pass **(8, 8)** [Game Ends]

  **Why these numbers work:**
  *   **BI Path:**
      *   Node 6: P2 takes 9 > 8. (Outcome 5,9)
      *   Node 5: P1 takes 6 > 5 (from Node 6 outcome). (Outcome 6,4)
      *   Node 4: P2 takes 5 > 4 (from Node 5 outcome). (Outcome 3,5)
      *   Node 3: P1 takes 4 > 3 (from Node 4 outcome). (Outcome 4,2)
      *   Node 2: P2 takes 3 > 2 (from Node 3 outcome). (Outcome 1,3)
      *   Node 1: P1 takes 2 > 1 (from Node 2 outcome). **(Outcome 2,0)**
  *   **The Bite:** BI predicts (2,0). Passing all the way yields (8,8). Both players are vastly richer if the logic fails.

  **What the Example Must NOT Contain:**
  *   **No Probabilistic End:** (See below).
  *   **No Symmetry:** Notice P1 and P2 have different payoffs. This prevents them from thinking "we split the pot." It isolates individual rationality.
  *   **No "Forced" End:** Node 6 must be a *choice* to Take or Pass. If the game just ends at Node 6, they might think "P2 had no choice." P2 must *choose* to grab the last bit rather than share.

  **Why not Repeated PD?**
  As you noted, they know Tit-for-Tat. In Repeated PD, the "shadow of the future" allows cooperation to be rational. In Centipede, the shadow of the future is *explicitly modeled in the tree*. The paradox is that even with the future modeled, rationality kills it. Centipede isolates the *end-game effect* without the noise of reputation building.

  **Why not Ultimatum?**
  Ultimatum is a 2-node game. The paradox relies on the *chain* of reasoning. Unraveling requires at least 3-4 nodes to feel like a slide rather than a single cliff.

  ### 3. The Wrinkles (Probabilistic End & Surprise Exam)

  **The Probabilistic End (Your Wrinkle):**
  *   **Verdict:** **Cut it.**
  *   **Why:** You are right that it isolates the "Known End" premise. However, in a 50-minute intro, it solves the paradox rather than illuminating it. If you introduce it, students will leave thinking "Oh, the paradox is just about knowing the end date," rather than "The paradox is about the tension between individual rationality and collective gain."
  *   **Risk:** It turns the session into a comparison of Finite vs. Infinite games. That is a different lecture.
  *   **Alternative:** If you are flying ahead of schedule (unlikely), use it *only* to answer the Final Question (see below). "Would adding a 1% chance the game continues forever fix this?"

  **The Surprise Exam:**
  *   **Verdict:** **Use as a 3-minute hook, then discard.**
  *   **Placement:** Minute 0–3.
  *   **Function:** Do not solve it. Use it solely to illustrate the *logic of unraveling*. "If the exam were on Friday, you'd know Thursday night. So it can't be Friday. If it can't be Friday, and it were on Thursday..."
  *   **Transition:** "This logical unraveling from a known end is exactly what we are about to do with this game tree. But in the game, the conclusion feels wrong."
  *   **Warning:** Do not let them debate the Exam. It is a metaphor, not a topic.

  ### 4. Misconceptions: Timing and Handling

  Do not save these for a Q&A at the end. Head them off at the specific moment they arise.

  1.  **"You'd never reach Node 5, so why plan for it?"**
      *   **When:** Minute 5 (During **Definition of Strategy**).
      *   **Fix:** "A strategy is a contract you sign at Node 1. It must say what you do at Node 5 even if you hope never to go there. If your plan says 'Pass at 1, but Take at 5', is that plan consistent?"
  2.  **"Rationality is self-defeating / The theory is broken."**
      *   **When:** Minute 35 (Immediately after revealing the **(2,0)** outcome).
      *   **Fix:** "The theory isn't broken; it's precise. It tells us: *If* these premises hold, *then* this happens. If you don't like the result, you must reject a premise, not the math."
  3.  **"Just promise to pass / Pre-commit."**
      *   **When:** Minute 40 (During "Fixes").
      *   **Fix:** "A promise changes the *payoffs* (adds a cost to lying) or removes the *branch*. That creates a *new game*. We are solving *this* game where promises are cheap talk."
  4.  **"It's just the Prisoner's Dilemma."**
      *   **When:** Minute 10 (During **Payoff Setup**).
      *   **Fix:** "In PD, you move once. Here, you move sequentially. In PD, defection is dominant regardless of what the other does. Here, Passing is better *if* the other Passes. The tension is dynamic."
  5.  **"Experiments show people pass, so BI is wrong."**
      *   **When:** Minute 45 (Near end).
      *   **Fix:** "Experiments refute the *premises* (Common Knowledge of Rationality), not the *deduction*. People pass because they doubt the other's rationality, not because the math is wrong."
  6.  **"If I'm at Node 5, P1 is irrational, so I should Pass." (The Sharp Student)**
      *   **When:** Minute 42 (The hardest one).
      *   **Fix:** This is the gateway to Forward Induction. Do not open the gate.
      *   **Script:** "You are arguing that reaching Node 5 gives you *new information* that P1 is irrational. BI assumes rationality is Common Knowledge *everywhere*, even off-path. If you use the fact that you are at Node 5 to update your belief about P1, you are dropping the Common Knowledge premise. That's a valid different model, but it is not Backward Induction. BI says: 'Assume rationality holds. Given that, Node 5 is impossible.'"

  ### 5. What to Refuse to Explain (The Line)

  Be explicit about what is out of bounds. This protects you from the "But what about..." questions.

  *   **Say this:** "We are treating Rationality and Knowledge as black boxes. I am not going to define 'Common Knowledge' formally (i.e., 'I know that you know that I know...'). We are assuming it holds. I am also not going to discuss 'trembling hand' or error probabilities. We are assuming perfect execution."
  *   **The Line:** Stop at **assumptions**. Do not go into **epistemic conditions**.
  *   **Keep:** The idea that beliefs matter. (e.g., "P1 Passes because P1 *believes* P2 will Pass").
  *   **Discard:** The formal hierarchy of beliefs.

  ### 6. The Final Question (Last 5 Minutes)

  Your proposed question ("What would have to be false for P1 to pass?") is good, but it invites psychological speculation ("Maybe P1 is nice"). You want them to identify the *structural* break.

  **Better Question:**
  > "Backward Induction relies on the assumption that Player 2 is rational at Node 6. If Player 1 decides to Pass at Node 1, which specific assumption about Player 2's future behavior must Player 1 be relying on? And does Backward Induction allow Player 1 to make that assumption?"

  **Why this works:**
  *   It forces them to identify that P1 is betting on P2 *not* playing the BI strategy at Node 6.
  *   It forces them to admit that BI *forbids* P1 from making that assumption (because BI proves P2 *will* Take at Node 6).
  *   It distinguishes between "What is rational for P2?" (Take) and "What does P1 believe P2 will do?" (Pass).
  *   It isolates the paradox: To get the good outcome, P1 must believe P2 will be irrational later. But if P2 is irrational later, is it rational for P1 to pass now?

  **Ideal Answer:** "P1 must believe P2 will Pass at Node 6. But BI proves P2 will Take at Node 6. So for P1 to Pass, P1 must believe BI is wrong. But if BI is wrong, P1 can't use BI to decide to Pass."

  ### Summary Timeline

  *   **00–03:** Surprise Exam Hook (Logic of Unraveling).
  *   **03–08:** Board Setup (Tree + **Strategy Definition**).
  *   **08–15:** Payoff Entry & Rationality Premise.
  *   **15–30:** The Folding-Back (Silent derivation, then walk-through).
  *   **30–35:** The Reveal (2,0 vs 8,8) & The Paradox.
  *   **35–45:** Misconception Management (Focus on the "Node 5" objection).
  *   **45–50:** Final Question & Close (The breakdown of Common Knowledge).

  **One final tip:** When drawing the tree, draw the "Pass" branches horizontally to the right, and "Take" branches diagonally down. Visually reinforce that "Passing" keeps the game alive (moving forward), while "Taking" ends it (dropping out). This helps the visual intuition of "growth" vs "grab."
