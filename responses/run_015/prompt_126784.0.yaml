answer: |-
  (a) **Revealed Preference:** In RUM terms, utility is the systematic component $V(x)$ identified solely by choice probabilities satisfying consistency axioms (SARP). The disturbance $\epsilon$ represents unobserved attributes or researcher ignorance, not psychological noise. Utility is ordinal, unique only up to monotonic transformation. It has no ontological status beyond ranking choices; it is a representation theorem, not a measurement.

  (b) **Substantive Utility:** This claims the latent index $U = V + \epsilon$ corresponds to a cardinal psychological magnitude (hedons, wellbeing). This requires fixing the functional form and $\epsilon$ distribution via external data (neuroscience, self-reports). It asserts the index is ontologically real, not just a sufficient statistic for choice.

  **Residue Report**

  Your hunch is sharp.

  **The Error Term:** You are correct. The fight is about what lives in $\epsilon$. If $\epsilon$ is taste heterogeneity, the agent maximizes utility. If $\epsilon$ contains akrasia, inattention, or optimization errors, the agent *fails* to maximize, and "utility" becomes merely a modeler's summary statistic. RUM treats these identically mathematically (both are stochastic disturbances); philosophers distinguish them normatively. Your vocabulary captures the *fit*, but not the *mechanism*.

  **Comparability:** This is exactly the scale-heterogeneity problem. Interpersonal comparability requires $\sigma_i = \sigma_j$. Standard RUM normalizes $\sigma=1$ for identification. Claiming comparability is claiming this equality is true, not just normalized. Without external data, subtracting latent indices across agents is mathematically meaningless.

  **The Blind Spot:** Here is where your analogy breaks. "Utility is wellbeing" is not a normalization issue; it is a structural claim. Normalization fixes units; structure fixes what is being measured. RUM assumes *something* is maximized. If people maximize impulses rather than wellbeing, the model is structurally misspecified regarding welfare, even if choice prediction is perfect.

  **What has no expression:** The normative "ought." Your likelihood function identifies what drives choice, not what makes life go better. Philosophers aren't fighting over nothing; they are warning that identification of preferences $\neq$ identification of welfare. The leftover is a blind spot in economics: you can estimate utility perfectly and still be wrong about whether policy improves lives. RUM cannot distinguish between "wanted" and "good for you" without leaving the model.
