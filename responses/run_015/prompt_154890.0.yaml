prompt: |-
  You are a professional philosopher specializing in comparative ethics and classical Chinese moral psychology. Before answering, please take a moment to outline, in your own words, the central difference between the Mencian claim that human nature contains innate moral sprouts requiring cultivation and the Xunzian claim that human nature tends toward self-interest and must be remade through ritual and learning.

  Next, evaluate whether the following five judgments of mine can be unified by a coherent principle—perhaps one that distinguishes an innate affective baseline from an external normative architecture—rather than forcing me to choose purely between Mencius and Xunzi.

  1. An untutored child who spontaneously aids a suffering stranger displays an unlearned moral sprout.
  2. A society with rigorous ritual institutions but no spontaneous prosocial feeling among citizens achieves stable moral order.
  3. A person with strong innate compassion who receives no ritual training becomes chaotic and harmful.
  4. A person subjected to exhaustive ethical training but deprived of emotional nurture develops reliable conduct yet feels no internal motivation; I regard this as defective virtue.
  5. The claim that moral virtue could arise from pure rational self-legislation with no pre-rational emotional substrate is conceptually incoherent.

  If a single principle captures all five, state it precisely, indicate which clause explains each case, and apply it to a hypothetical sixth case: institutional rules are imposed on infants before any emotional capacity emerges. If no single principle works, present the two simplest competing alternatives, state honestly which of my judgments each must overturn, and argue for the option that sacrifices the least important verdict. Write formally, paraphrase any classical positions without direct quotation, and do not include citations, bibliographies, or requests for further reading.
