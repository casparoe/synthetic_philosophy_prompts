answer: |-
  Here is a specification sheet for a robust theory of urban rights, tailored to your module's debate. I have kept the terminology compatible with both the US literature (zoning, NIMBY) and the UK context (planning, flats) since your course seems to be bridging the two.

  The core problem you are facing is that 'Right to the City' (Lefebvre) is often used as a rhetorical trump card, while 'Property Rights' are used as a legal shield. A working theory must adjudicate between them without collapsing into pure economics or pure obstructionism.

  ### The Desiderata Specification for Urban Rights Theory

  | Desideratum | Rationale & Reasoning | Status | Notes on Theoretical Failure |
  | :--- | :--- | :--- | :--- |
  | **1. Stakeholder Inclusivity** | The theory must account for conflicting claims: homeowners, renters, the unhoused, *and* future residents. It cannot privilege current title-holders exclusively. | **Non-Negotiable** | **Fails:** Libertarian property theories (exclude renters/future) and some communitarian models (exclude outsiders). |
  | **2. Voice vs. Veto Distinction** | Must distinguish between a right to be *heard* (consultation/voice) and a right to *stop* (veto). A right to participation does not automatically grant a right to block supply. | **Non-Negotiable** | **Fails:** Hardline NIMBYism (conflates voice with veto) and Technocratic YIMBYism (denies voice entirely). |
  | **3. Justice vs. Preference Weighting** | Must distinguish between claims based on basic need/justice (shelter, safety) and claims based on aesthetic/preference (character, view, property value). | **Non-Negotiable** | **Fails:** Most populist localism (treats 'character' as equal to 'shelter') and pure Marketism (treats all preferences as dollar values). |
  | **4. Institutional Legibility (Chesterton's Fence)** | Cannot propose abolishing planning constraints without identifying the social function the constraint originally served (e.g., preventing overcrowding, protecting infrastructure). | **Non-Negotiable** | **Fails:** Radical deregulation (assumes all rules are rent-seeking) and Status Quo bias (assumes all rules are just). |
  | **5. Non-Reduction to Efficiency** | Must acknowledge housing economics (supply/demand) without reducing moral rights to market efficiency. Housing is a social good, not just a commodity. | **Non-Negotiable** | **Fails:** Neoclassical urban econ (reduces rights to willingness to pay). |
  | **6. The 'Right to Stagnation' Test** | Must explicitly adjudicate whether residents can block change that benefits the wider city to preserve local interest. | **Camp Preference** | **See Analysis Below.** |
  | **7. Scalability of Harm** | Must differentiate between localised nuisance (shadow, noise) and systemic harm (regional homelessness, segregation). | **Non-Negotiable** | **Fails:** Theories that allow local nuisance claims to override systemic justice. |

  ### Analysis of Specific Constraints

  #### 1. The 'Right to Stagnation': Desideratum or NIMBYism?
  Your friend's idea of a **Right to Stagnation** is **not a valid non-negotiable desideratum**; it is, as you suspected, NIMBYism in fancy clothes.

  *   **Reasoning:** A 'right' implies a moral claim that others must respect. If a 'right to stagnation' exists, it means a small group can impose costs (homelessness, higher rents, segregation) on a much larger group to preserve their own utility (views, quiet, scarcity value).
  *   **Verdict:** This falls under **Camp Preference**. A theory that accepts this as a *right* fails the **Justice vs. Preference Weighting** requirement. However, a decent theory must explain why people *feel* this right exists (often due to asset dependency) without validating it morally.

  #### 2. Chesterton's Fence and Planning Rules
  Your tutor is correct. A theory cannot simply say "all zoning is exclusionary and must go."
  *   **The Requirement:** **Institutional Legibility.**
  *   **Why:** Some zoning protects public goods (e.g., keeping heavy industry away from schools, ensuring light/air, preventing flooding). If a theory of urban rights demands total deregulation, it risks creating slums or environmental hazards. The theory must allow for the removal of *exclusionary* rules while retaining *protective* ones. The burden of proof lies on the reformer to identify which is which.

  #### 3. The Killer Constraint
  The single requirement that knocks out the most popular theories is **Requirement 2: The Voice vs. Veto Distinction.**

  *   **Why it breaks NIMBY/Localist theories:** These theories rely on the idea that 'community consent' is required for development. In practice, this functions as a veto. If you enforce a strict distinction (you can speak, but you cannot block unless specific justice criteria are met), the localist model collapses.
  *   **Why it breaks Technocratic/Market theories:** These theories often argue that planning is purely distortionary and should be abolished in favour of market efficiency. They often deny residents any *Voice* because they view the market as the only legitimate aggregator of preference. A robust theory of rights demands democratic participation (Voice) even if it doesn't grant a Veto.
  *   **Result:** This constraint forces a middle path that most polarised theories cannot sustain. It demands a planning system that is democratic but not held hostage by local veto points.

  ### Summary for Your Essay
  If you are constructing an argument, do not ask "Do people have a right to the city?" Ask "What *kind* of right is being claimed?"

  1.  **If it is a right to shelter:** It trumps local preference (Justice > Preference).
  2.  **If it is a right to participation:** It grants Voice, but not Veto (Inclusivity > Stagnation).
  3.  **If it is a right to property:** It is bounded by Institutional Legibility (you own the flat, not the airspace or the neighbourhood character).

  Any theory that conflates these three will fail the specification above.

  Cheers.
