  9.  **Final Polish:** Check for flow, clarity, and depth. (The resulting output should mirror the intellectual weight of the prompt.)

  *(Self-Correction Note)*: I need to be careful not to simply say "Fluid-Boundary is better." I need to show *why* it fits the specific case of amorphous solids better, while acknowledging where Copycat offers a necessary warning about communication breakdown.

