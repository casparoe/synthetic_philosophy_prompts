answer: |-
  **Mediator's Note on Stipulations**
  Two stipulated points require clarification to be scientifically usable. First, estimating heritability for the "reading resilience" composite (Stipulation 4) involves selecting students based on both their outcome and their environment. This creates a statistical artifact known as collider bias, which distorts variance estimates. To make this usable, we must treat the estimate as describing only that specific selected group, not the general population. Second, Section 3 references a claim that "only ratios can be estimated... so nobody can tell whether the genetic or the environmental variance moved." This contradicts Stipulation 2, which states the total spread of scores shrank. If total variance shrinks and the heritability ratio rises, we can infer environmental variance decreased disproportionately. We will proceed assuming the total variance change is known.

  ***

  ### Section 1: Agreed Claims

  1. Heritability is defined as the proportion of total phenotypic variance in a specific population that is attributable to genetic variance.
  2. This statistic describes differences between individuals within a group, not the developmental cause of a trait in any single individual.
  3. A high heritability estimate does not imply that a trait is immutable or unchangeable by environmental intervention.
  4. A low heritability estimate does not imply that genes play no role in the development of the trait.
  5. The observed rise in heritability from 0.51 to 0.66 following the tutoring program is mathematically consistent with a reduction in environmental variance.
  6. This rise does not indicate that genes became biologically more potent during the three-year intervention.
  7. Heritability estimates cannot logically justify withholding educational resources from any specific group of students.
  8. The gain-score heritability of 0.40 indicates that genetic differences influence how much individual children benefit from identical tutoring.
  9. Neither side claims that the 2022 district estimate applies to different populations, decades, or environmental contexts.
  10. Both sides agree that randomly reshuffling environments among children (Double-Shuffle Part 2) would significantly alter reading outcomes.
  11. Both sides agree that randomly reshuffling genomes among families (Double-Shuffle Part 1) would also significantly alter reading outcomes.
  12. Policy decisions regarding educational equity require evidence beyond variance decomposition alone.

  ### Section 2: Disagreements

  | The Crux | Ms. Reyes' Position (Biology) | Mr. Okafor's Position (Psych/Equity) | Impact of Settling This Crux |
  | :--- | :--- | :--- | :--- |
  | **Policy Guidance** | Heritability provides a necessary baseline for understanding why uniform interventions yield unequal outcomes. | Heritability is a distracting bookkeeping artifact that shifts with policy, making it too unstable to guide resource allocation. | Determines whether the statistic is cited in district budget meetings. |
  | **Intervention Prediction** | High heritability constrains expectations, signaling that personalized rather than uniform interventions may be needed. | Heritability says nothing about specific interventions, as changing the environment changes the heritability itself. | Determines if the metric is used to design tutoring protocols. |
  | **Variance vs. Cause** | Partitioning variance reveals the underlying causal structure of the trait in that context. | Partitioning variance obscures specific mechanisms and falsely implies genes and environment are separable causes. | Determines how results are explained to parents and staff. |
  | **Resilience Composite** | Estimating heritability for "resilient" readers identifies genetic factors that protect against disadvantage. | Selecting on resilience creates a biased sample where the estimate reflects selection pressure rather than biology. | Determines if the district pursues genetic research on resilient subgroups. |

  ### Section 3: Pre-registered Predictions

  **Test 1: The Double-Shuffle Test**
  *   **The Case:** Comparing the variance in outcomes from swapping genomes versus swapping environments.
  *   **Reyes' Prediction:** The variance from the genome swap will closely match the genetic variance component ($V_G$) estimated in the 2025 data.
  *   **Okafor's Prediction:** The variance from the environment swap will be substantially larger than the genome swap, demonstrating environmental dominance.
  *   **Falsification:** Reyes concedes if the genome swap produces negligible variance; Okafor concedes if the environment swap produces negligible variance.

  **Test 2: The Reading Resilience Composite**
  *   **The Case:** Estimating heritability for students in the top reading quartile despite bottom home-literacy scores.
  *   **Reyes' Prediction:** The estimate will be positive and significant, indicating protective genetic factors.
  *   **Okafor's Prediction:** The estimate will be an artifact of the selection method and will not replicate in a random sample.
  *   **Falsification:** Reyes concedes if the estimate disappears in a non-selected cohort; Okafor concedes if it predicts outcomes in a new disadvantaged sample.

  **Test 3: The Gain-Score Number**
  *   **The Case:** Interpreting the 0.40 heritability of the improvement itself.
  *   **Reyes' Prediction:** This confirms that some children are genetically predisposed to respond better to standard tutoring.
  *   **Okafor's Prediction:** This confirms that the tutoring was not uniform enough to override existing genetic advantages.
  *   **Falsification:** Reyes concedes if a more intensive intervention reduces this gain-score heritability to zero; Okafor concedes if even maximal intervention leaves the 0.40 estimate unchanged.

  **Test 4: The Variance Ratio Constraint**
  *   **The Case:** Determining whether genetic or environmental variance moved between 2022 and 2025.
  *   **Reyes' Prediction:** We can infer environmental variance dropped because the total spread shrank while heritability rose.
  *   **Okafor's Prediction:** We cannot disentangle the components without knowing the absolute scale of genetic variance, which is unobserved.
  *   **Falsification:** Reyes concedes if independent measures show genetic variance increased; Okafor concedes if direct measures confirm environmental variance dropped proportionally.

  ### Section 4: Verbal versus Genuine

  A significant portion of this debate is verbal, centering on the word "importance." When Ms. Reyes says genetic factors are "important," she refers to the proportion of current differences explained by genetic variance. When Mr. Okafor says genetic factors are "not important," he refers to the potential for future change and moral significance. No amount of defining will dissolve the genuine disagreement, however. The real conflict is about risk tolerance and policy utility. Ms. Reyes believes ignoring the statistic leads to ineffective one-size-fits-all policies that fail to help those who respond poorly. Mr. Okafor believes using the statistic invites deterministic thinking that justifies inequality. They agree on the math but disagree on whether the number is too dangerous to hold in a public meeting.

  ### Section 5: Note to the Audience

  You are about to read a document where two experts agree on the mathematics but disagree on the meaning. Neither teacher denies that genes affect reading, nor do either deny that schools affect reading. They also agree that heritability does not measure destiny for an individual child. The fight is not about whether the numbers are real, but whether they are useful. Ms. Reyes worries that ignoring genetic differences wastes resources on interventions that won't work for everyone. Mr. Okafor worries that highlighting genetic differences gives administrators an excuse to stop trying to fix inequitable schools. Your task is not to decide who is right, but to understand why smart people can look at the same number and see different risks. The question remains open: can we use biological data to improve equity without reinforcing inequality?
