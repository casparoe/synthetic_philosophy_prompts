answer: |-
  ### The Case: The "Quick-Check" Badge on a Freelance Platform

  Consider a freelance labor platform (like Upwork or Fiverr) where workers are either **Experts** (High) or **Amateurs** (Low). Clients pay a premium wage ($W_H$) for workers with a "Verified Skill" badge and a standard wage ($W_L$) for those without. To get the badge, a worker must complete a 15-minute platform quiz. Initially, the quiz is free. Experts find the quiz easy and low-stress (low psychic cost); Amateurs find it difficult and anxiety-inducing (high psychic cost), though they are physically capable of taking it. The wage premium is large enough that Experts bother to take the free quiz, but the psychic cost is high enough that Amateurs decide the premium isn't worth the stress, so they don't bother. The badge is a honest signal of expertise. Now, suppose the platform adds a **$50 administrative fee** to take the quiz, charged uniformly to everyone. The fee is a real cost (money), identical for both types. Experts, whose net surplus from the badge was thin (premium minus stress), now find the total cost (stress + fee) exceeds the wage premium and stop taking the quiz. Amateurs, who were already deterred by the stress, remain deterred. The badge disappears, the market pools at the low wage, and the signal becomes useless—not because Amateurs can now fake it, but because Experts stopped buying it.

  ***

  ### Payoff Structure

  **Types:** $\theta \in \{H, L\}$ (Expert, Amateur). Prior probability of $H$ is $p$.
  **Wages:** $W(S=1) = W_H$, $W(S=0) = W_L$. Let $\Delta W = W_H - W_L$.
  **Signal:** $S \in \{0, 1\}$ (Take Quiz / Don't Take).
  **Costs:**
  *   Base Cost (Psychic/Time): $c_H$ for High, $c_L$ for Low.
  *   Uniform Cost (Fee): $k \ge 0$.
  *   Total Cost: $C_\theta = c_\theta + k$.

  **Constraints:**
  1.  **Low Type Motivation:** $W_H > W_L$ (Low wants to pass).
  2.  **Capability:** Low type *can* take the quiz (no physical barrier).
  3.  **Surplus:** $\Delta W$ is fixed.

  **Parameters for the Scenario:**
  *   $\Delta W = 100$ (The wage premium).
  *   $c_H = 10$ (Expert cost: easy).
  *   $c_L = 120$ (Amateur cost: stressful).
  *   Initial Fee $k_1 = 0$.
  *   New Fee $k_2 = 95$.

  ***

  ### Equilibrium Check

  **1. Initial Equilibrium ($k=0$): Separating**
  *   **High Type:** Payoff(Send) = $100 - 10 = 90$. Payoff(No Send) = $0$.
      *   $90 > 0 \rightarrow$ **Participates.**
  *   **Low Type:** Payoff(Send) = $100 - 120 = -20$. Payoff(No Send) = $0$.
      *   $-20 < 0 \rightarrow$ **Does Not Participate.**
  *   **Result:** Only High types send $S=1$. Observers infer $\theta=H$ from $S=1$. Signal is honest.
  *   **Note:** The cost $c_H=10$ is only 10% of the surplus $\Delta W=100$. It is "cheap."

  **2. Second Equilibrium ($k=95$): Pooling (None)**
  *   **High Type:** Payoff(Send) = $100 - (10 + 95) = -5$. Payoff(No Send) = $0$.
      *   $-5 < 0 \rightarrow$ **Does Not Participate.**
  *   **Low Type:** Payoff(Send) = $100 - (120 + 95) = -115$. Payoff(No Send) = $0$.
      *   $-115 < 0 \rightarrow$ **Does Not Participate.**
  *   **Result:** No one sends $S=1$. Observers infer nothing from $S=1$ (off-path). Market pools on $S=0$. Signal carries zero information.

  ***

  ### Analysis: The Participation Margin

  The single feature doing the work is the **binding Individual Rationality (IR) constraint for the High type**, rather than the Incentive Compatibility (IC) constraint for the Low type.

  Standard signaling models (Spence) focus on the **Mimicry Margin**: setting costs such that $c_L > \Delta W > c_H$. The signal is honest because the Low type *cannot afford* to mimic.
  Your case exploits the **Participation Margin**: setting costs such that $\Delta W > c_H$, but only barely. The signal is honest because the High type *is willing* to speak, while the Low type is not.

  When you add the uniform cost $k$:
  1.  **Low Type:** The IC constraint was already slack (they were already deterred). Adding $k$ makes it "more slack." It does not change their behavior.
  2.  **High Type:** The IR constraint was binding (thin surplus). Adding $k$ flips their decision from Send to No-Send.

  The signal fails not because it became *easier* to fake (it became harder), but because it became *too expensive to tell the truth*. The honesty relied on the signal being cheap enough for the truth-teller to bother.

  **Counterfactual: Differential Cost (Spence Direction)**
  If the added cost were differential—say, a fee waived for Experts ($k_H=0, k_L=95$)—the separation would hold.
  *   High Payoff: $100 - 10 = 90$ (Still participates).
  *   Low Payoff: $100 - (120 + 95) = -115$ (Still deterred).
  The signal remains honest. This confirms that the failure in the uniform case is not due to the magnitude of the cost itself, but the incidence of the cost relative to the High type's surplus.

  ***

  ### The Zahavian Reply

  **The Objection:**
  A proponent of the Handicap Principle (Zahavi) would argue this is not a counterexample because the Handicap Principle never claimed that *absolute* cost ensures honesty. It claims that *differential* marginal cost ensures honesty. In biological terms, a signal is a handicap only if it is more costly for the low-quality individual to produce than for the high-quality individual ($\frac{\partial C}{\partial q} < 0$).

  In your initial scenario ($k=0$), the setup *is* Zahavian: $c_L > c_H$. The signal is honest because of the differential cost structure.
  In your second scenario ($k=95$), you have added a **Tax**, not a Handicap. A uniform fee is not a handicap; it is a barrier to entry. By making the cost uniform, you have removed the differential nature of the signal's marginal cost relative to the surplus. You haven't broken the Handicap Principle; you've simply taxed the signalers out of existence.

  **Is this Ad Hoc?**
  No, it is theoretically robust. It highlights a crucial distinction often lost in pop-science interpretations of signaling:
  1.  **Pop Version:** "Honest signals must be expensive." (Implies Absolute Cost).
  2.  **Technical Version:** "Honest signals must be differentially expensive." (Implies Relative Cost).

  Your case successfully attacks the Pop Version. It demonstrates that increasing absolute cost without maintaining the differential advantage (or respecting the participation margin) destroys information. It forces students to recognize that **cost is necessary but not sufficient**; the cost must be structured such that the High type's participation constraint holds *and* the Low type's incentive constraint holds. If you satisfy the second by violating the first, the signal dies. This validates your "Participation Margin" hunch: signaling models often assume the High type *always* wants to signal, but in reality, they only do so if the surplus is thick enough to absorb the cost of honesty.
