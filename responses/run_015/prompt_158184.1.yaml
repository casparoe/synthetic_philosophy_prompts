      *   **Link C: Substantivalism $\neq$ Non-locality.** This is the critical error in (6)-(7). Substantivalism posits a container. It does not posit action-at-a-distance. Lorentz Ether Theory is substantivalist but respects Bell inequalities (by being local and denying QM completeness or accepting contextuality). To get Bell violations, you need *non-local dynamics*, not just an absolute stage.
