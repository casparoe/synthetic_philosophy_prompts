answer: |-
  ### Prediction and Recommendation

  **Prediction:** The Franchise Board will rule to **enfranchise** the downstream town residents.
  **Recommendation for Consistency:** To remain consistent with its own record, the Board **must** enfranchise them.

  While the Board may feel pressure to protect the city's sovereignty, their written reasoning in the Harbour Dues referendum established a specific exception to territorial and membership limits: the **Nowhere-Else-to-Be-Heard (NEBH)** test combined with **Material Affectedness**. The downstream residents match the Absentee Owners profile on these two decisive criteria (high material impact + lack of home-government advocacy) even more strongly than they match them on legal ties. To exclude the downstream town would require the Board to implicitly overrule its own stated rationale for including the Absentee Owners, treating the "business registration" of the owners as the decisive factor rather than the NEBH test. Given the Board explicitly cited NEBH as the justification for the controversial inclusion, consistency demands they apply it here.

  ### Competing Rules and Fit Analysis

  To determine consistency, we must weigh the four implicit rules governing the Board's previous verdicts against the new case.

  | Rule | Definition | Fit with Previous Verdicts | Application to Downstream Town |
  | :--- | :--- | :--- | :--- |
  | **1. All Affected Interests (AAI)** | Everyone materially affected by the decision should vote. | **Mixed.** Fits Residents and Absentee Owners. Fails to explain why Seasonal Workers (affected by dues) were *Out*, unless "materiality" is thresholded high. | **In.** Water supply and employment are materially critical impacts. |
  | **2. All Subjected to Coercion (ASC)** | Only those subject to the city's laws/coercion should vote. | **Strong.** Fits Residents. **Fails** Absentee Owners (who live abroad and are not subject to personal city laws, only business regs). | **Out.** They are foreign nationals, subject to their own country's laws, not the port city's. |
  | **3. Durable Stake / Membership** | Voting requires long-term social membership or physical presence. | **Strong.** Fits Residents (8+ yrs). Explains Seasonal Workers *Out* (transient) and Former Residents *Out* (tie severed). **Fails** Absentee Owners (live abroad, visit 2x/yr). | **Out.** No residence, no social membership, no physical presence in the city. |
  | **4. Nowhere-Else-to-Be-Heard (NEBH)** | Non-members are included if their interests are ignored by their own representation. | **Specific.** Irrelevant for Residents. **Decisive** for Absentee Owners (explicitly cited to override dissent). | **In.** Their own government has "shown no interest," satisfying the condition perfectly. |

  **Analysis:**
  The Harbour Dues referendum revealed that **ASC** and **Durable Stake** are *necessary but not sufficient* conditions for the core demos (Residents), but they can be overridden by **AAI + NEBH** for outliers. The Absentee Owners were included *despite* failing ASC and Durability, specifically because they passed AAI and NEBH. The Downstream Town fails ASC and Durability but passes AAI and NEBH. Therefore, the logic that saved the Absentee Owners saves the Downstream Town.

  ### Closest Analog

  The **Absentee Owners** are the genuinely closest analog.

  *   **Similarities:** Both groups are non-residents, non-citizens, and not subject to the city's full coercive power (ASC). Both groups were/are dependent on the port's economic function. Crucially, both groups rely on the **NEBH** justification to overcome their lack of membership.
  *   **Differences:** The Absentee Owners had a formal legal tie (business registration/tax liability), whereas the Downstream Town has only a geographic/causal tie.
  *   **Why it matters:** If the Board treats the *business registration* as the key to the Absentee Owners' inclusion, they will exclude the Downstream Town. If they treat the *NEBH/AAI rationale* as the key (as their written reasons state), they must include the Downstream Town. Since the prompt specifies the written reasons invoked the formulas rather than the registration status, the Absentee Owners remain the controlling precedent.

  ### The Single Further Case

  To distinguish whether **AAI** is sufficient on its own or if **NEBH** is a necessary condition for non-members, the Board should consider this case:

  **The Case:** *Foreign commuters who work in the port and live across the border, whose home government actively advocates for their labor rights regarding the port.*

  *   **Why this separates the rules:**
      *   **AAI:** They are materially affected (jobs). **Verdict: In.**
      *   **NEBH:** They *are* heard by their home government. **Verdict: Out.**
      *   **ASC/Stake:** They fail both (like the Downstream Town).
  *   **Discriminating Power:** If the Board enfranchises them, it proves **AAI** is the dominant rule and NEBH was merely rhetorical in the Absentee Owner case. If the Board excludes them, it proves **NEBH** is a necessary condition for crossing the border, solidifying the argument for the Downstream Town (whose government does *not* advocate for them).

  ### Settled vs. Contested Boundary Problems

  In the academic literature on democratic boundaries (the "boundary problem"), distinct layers of agreement and disagreement exist.

  **Comparatively Settled:**
  1.  **The "All Affected" principle is too broad in its raw form.** Theorists generally agree (e.g., Goodin, Dahl) that if *everyone* affected by a decision voted, the demos would become global and unworkable (e.g., everyone affected by US climate policy voting in US elections). The Board's exclusion of Seasonal Workers reflects this settled intuition that "affectedness" requires a threshold of intensity or durability.
  2.  **Coercion creates a strong claim to membership.** It is broadly accepted that those subject to binding laws (Residents) must have a voice. This explains the settled status of Resident Citizens and Long-term Non-citizens.

  **Contested (and my position):**
  1.  **The Normative Weight of Externalities.** It is highly contested whether suffering negative externalities (like pollution or economic loss) grants a right to vote in the *source* jurisdiction, or merely a right to compensation/remedy.
      *   *[Contested Side]*: I take the side that **severe, existential externalities (water/food) functionally equate to coercion.** When a city's decision controls another group's survival (water access), the distinction between "affecting" and "coercing" collapses. The Downstream Town is not merely affected; they are held hostage.
  2.  **The Legitimacy of the NEBH Test.** It is contested whether a lack of representation elsewhere justifies insertion into a foreign demos. Some argue this undermines the foreign state's sovereignty; others argue it is a humanitarian safeguard.
      *   *[Contested Side]*: I argue that **NEBH is a legitimate corrective mechanism.** When a government fails its duty of representation regarding cross-border harms, the harming entity acquires a derivative responsibility to hear those voices. This validates the Board's Absentee Owner precedent and mandates the inclusion of the Downstream Town.
  3.  **The Unit of Demos Stability.** It is contested whether the demos should be fixed (permanent franchise) or fluid (issue-specific).
      *   *[Contested Side]*: The Board's variable franchise is theoretically sound for **issue-specific sovereignty.** A port's environmental impact is functionally a different polity than its harbour dues. Consistency requires treating the *rationale* (NEBH/AAI) as the fixed element, not the *membership list*.

  **Conclusion:** The Board's record establishes that **NEBH + Material Affectedness** trumps **Lack of Subjection**. To rule otherwise for the Downstream Town would be to privilege the *legal form* of the Absentee Owners (business registration) over the *moral rationale* (NEBH) explicitly cited in their verdict. Consistency requires the vote be granted.
