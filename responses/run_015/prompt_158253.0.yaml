answer: |-
  This is an excellent mapping. You have correctly identified that **Model Predictive Control (MPC) with an Extended Kalman Filter (EKF)** is the closest engineering analog to the Predictive Processing (PP) / Active Inference (AI) framework.

  Your intuition is sharp: much of the "mystery" in PP dissolves when viewed through the lens of stochastic control. However, there are specific divergences where the neuroscience commits to architectural claims that control theory usually treats as design choices.

  Here is the translation, the residue report, and the analysis of your two sticking points.

  ---

  ### Part 1: The Translation Dictionary

  | Predictive Processing Term | Control Theory Equivalent | Notes |
  | :--- | :--- | :--- |
  | **Generative Model** | **Plant Model + Disturbance Model** | The internal equations $\dot{x} = f(x,u)$ used to predict future outputs. |
  | **Hidden Causes (States)** | **System States ($x$)** | Variables not directly measured but estimated (e.g., concentration, temperature). |
  | **Sensory Input** | **Measurements ($y$)** | Noisy sensor data. |
  | **Prediction Error** | **Innovation / Residuals ($y - \hat{y}$)** | The difference between measured output and model prediction. |
  | **Perception (Inference)** | **State Estimation (Kalman Update)** | Updating $\hat{x}$ to minimize the weighted squared residuals. |
  | **Precision** | **Inverse Covariance ($R^{-1}, P^{-1}$)** | Weighting on the residuals. High precision = low noise variance = high trust in sensor. |
  | **Priors / Preferences** | **Reference Trajectory ($r$)** | In AI, these are probabilistic distributions (low entropy desired states). In MPC, usually a setpoint. |
  | **Action (Active Inference)** | **Control Moves ($u$)** | Manipulating inputs to minimize *future* expected prediction error relative to priors. |
  | **Free Energy** | **Cost Function ($J$)** | The objective function being minimized (typically quadratic error + control effort). |
  | **Hierarchy** | **Cascaded / Distributed MPC** | Higher levels set references for lower levels; lower levels report errors up. |

  ---

  ### Part 2: Anchoring with Charles Bonnet Syndrome (CBS)

  Your grandmother's condition is a textbook case of **Precision Weighting Failure** in this vocabulary.

  *   **The Plant:** Her visual cortex.
  *   **The Sensor:** Her retina (degraded by macular degeneration).
  *   **The Noise:** High measurement noise covariance ($R$ is huge) because the retina is sending sparse, unreliable data.
  *   **The Failure:** In a healthy system, the Kalman Gain ($K$) should drop. The estimator should trust the model (priors) less and the sensor more, or vice-versa depending on the signal-to-noise.
  *   **In CBS:** The system fails to update the *precision* of the sensory input. It treats the noisy sensory data as low precision (ignoring it), but crucially, it maintains **high precision on the priors**.
  *   **Result:** The "state estimate" is driven almost entirely by the internal model (memory of figures, patterns) because the sensory residuals are down-weighted too aggressively. The hallucination is the estimator converging on a state that satisfies the internal model cost function, disregarding the measurement constraint. She "knows" they aren't real because her meta-cognitive layer (a higher hierarchy level) has a different precision setting than her visual estimation layer.

  ---

  ### Part 3: Addressing Your Sticking Points

  #### 1. Precision/Attention vs. Measurement Covariance
  *Your Question:* In my filters, $R$ is identified off-line. PP treats precision as regulated moment-to-moment. Is this just adaptive gain?

  *The Translation:* It is an **Adaptive Kalman Filter where the noise statistics are themselves hidden states.**
  In standard control, you assume $R$ (measurement noise) and $Q$ (process noise) are properties of the hardware and environment. You might tune them online if the sensor degrades, but usually, they are external parameters.
  In PP, **Precision is a belief.** The brain does not just estimate $x$; it estimates the *reliability of the data used to estimate $x$*.
  *   **Mechanism:** This is equivalent to having a higher-level estimator that outputs the $R$ and $Q$ matrices for the lower-level estimator.
  *   **Attention:** In PP, "attention" is simply the optimization of these precision parameters. To "pay attention" is to temporarily decrease the estimated variance ($R$) of a specific sensory channel, thereby increasing the Kalman Gain for that channel.
  *   **The Residue:** In control, $R$ is *ontological* (how noisy the sensor actually is). In PP, precision is *epistemic* (how noisy the system *believes* the sensor is).
  *   **Verdict:** This is not fuzziness; it is an architectural claim. PP posits that the brain *must* infer noise statistics online because the environment is non-stationary. Your vocabulary handles this fine (Adaptive Control), but standard tuning practice assumes stationarity. PP claims biological systems cannot assume stationarity.

  #### 2. The Dark Room Problem vs. Degenerate Optima
  *Your Question:* Is the "Dark Room" problem (why don't we just sit in a dark room to minimize prediction error?) just specification gaming?

  *The Translation:* Yes, it is a **Degenerate Optimum / Specification Gaming problem.**
  If your cost function $J$ is simply $\sum (y - \hat{y})^2$, and you have control over $y$ (by closing your eyes or dying), the optimal control $u$ is "turn off sensors."
  *   **Control Solution:** You add constraints or tracking terms. $J = (y - \hat{y})^2 + \lambda (x - x_{viability})^2$. You penalize states that correspond to "dead" or "starving."
  *   **PP Solution:** They encode "priors" about being in a lighted, fed state. These are not just setpoints; they are deep temporal expectations. "I expect to be eating in 4 hours."
  *   **The Residue:** Control engineers view this as "you wrote the wrong cost function." PP proponents view this as "the definition of life is minimizing surprise over long time horizons."
  *   **Verdict:** This is largely **vocabulary framing.** The math is identical. However, PP makes a stronger claim: that *all* biological drives (hunger, sex, curiosity) are mathematically identical to reference tracking. In control, we usually treat "safety constraints" differently from "performance setpoints." PP collapses them into the same probabilistic framework.

  ---

  ### Part 4: The Residue Report

  Here is where the translation breaks down or requires distortion.

  #### 1. Translates Cleanly
  *   **Error Minimization:** The core math of Free Energy minimization is Lyapunov stability analysis on a cost function.
  *   **Hierarchy:** Cascaded MPC is a perfect analog for cortical hierarchies. Higher levels send references (priors); lower levels send back prediction errors (residuals).
  *   **Hallucination:** Estimator divergence or "windup" where the model state decouples from reality due to sensor saturation or high noise.

  #### 2. Translates Only with Distortion
  *   **Priors as Distributions:** In MPC, a reference is usually a trajectory $r(t)$. In PP, a prior is a probability distribution $P(x)$.
      *   *Distortion:* You have to treat your setpoint not as a value, but as a Gaussian with a specific mean and variance. "I want the temperature at 50°C" vs. "I expect the temperature to be 50°C ± 0.1°." The latter implies a *cost on variance*, not just mean error. This is subtle but important for risk-sensitive control.
  *   **Action as Inference:** In MPC, you solve an optimization problem to find $u$. In PP, action is framed as *inference* on the control signal.
      *   *Distortion:* Mathematically identical (gradient descent on $J$), but philosophically, PP claims the motor command is just another state being estimated. This feels like smuggling assumptions unless you view the motor output as a state variable in the generative model.

  #### 3. No Counterpart (The "Hard" Residue)
  *   **Structure Learning:** In control, you usually know the model structure ($\dot{x} = Ax + Bu$) and tune parameters. PP claims the brain learns the *structure* of the generative model online (neural plasticity as structure selection).
      *   *Gap:* Your vocabulary assumes a fixed plant model. PP assumes the plant model is mutable and part of the inference. This is closer to **System Identification + Control** running simultaneously at high frequency.
  *   **Phenomenology:** PP claims this machinery *is* the experience.
      *   *Gap:* Control theory has no variable for "what it feels like." You can model the regulator, but not the "qualia" of the error signal. PP asserts that minimizing the error *is* the feeling. This is where you will hit a wall; your vocabulary describes the *mechanism*, PP claims to describe the *experience*.
  *   **The "Markov Blanket":** PP relies heavily on conditional independence boundaries.
      *   *Gap:* In control, we define system boundaries arbitrarily. PP treats the boundary (skin/sensor) as a mathematical necessity for inference. This is more philosophical topology than engineering.

  ---

  ### Part 5: Verdict on Fuzziness vs. Vocabulary

  **Is the residue your vocabulary missing something, or PP being fuzzy?**

  1.  **Where PP is Fuzzier:**
      *   **Free Energy:** Often used as a catch-all term. In control, we distinguish between the *Cost Function* (design choice) and the *Lyapunov Function* (stability proof). PP sometimes conflates them, implying that because an organism exists, it *must* be minimizing Free Energy. This is tautological (survivorship bias) unless you specify the cost function explicitly.
      *   **"Surprise":** PP uses "surprise" (negative log probability) interchangeably with "error." In control, error is a signal; surprise is a statistic. The conflation can obscure the time-horizon issues (instantaneous error vs. cumulative cost).

  2.  **Where Your Vocabulary is Limited:**
      *   **Epistemic Uncertainty:** Standard MPC handles aleatoric uncertainty (noise). It is less equipped to handle *epistemic* uncertainty (uncertainty about the model parameters themselves) as a driver for action. PP explicitly models "curiosity" as minimizing uncertainty about parameters (Active Learning). You would need to add a "Dual Control" term (exploration vs. exploitation) to your cost function to match this.
      *   **Non-Stationary Objectives:** In batch reactors, the setpoint is fixed by the recipe. In PP, the "priors" change based on context (circadian rhythms, hunger). Your vocabulary treats setpoints as exogenous inputs; PP treats them as endogenous states.

  ### Summary Advice
  You are not smuggling assumptions; you are **operationalizing metaphors.**

  *   When PP says "Precision," read **"Adaptive Inverse Covariance."**
  *   When PP says "Priors," read **"Probabilistic Reference Trajectories."**
  *   When PP says "Dark Room Problem," read **"Unconstrained Optimization leading to Trivial Solutions."**

  Your grandmother's CBS is the strongest evidence that the PP map is useful: it explains the pathology as a **gain-scheduling fault** in the visual estimator. The "residue" is mostly that PP proponents sometimes dress up standard stochastic control in philosophical clothing to make claims about consciousness that exceed the math. Stick to the math; the control theory vocabulary is robust enough to hold the weight without the mystique.
