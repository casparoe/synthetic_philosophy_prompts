answer: |-
  Thirty years mowing along the grassed **hedge**,
  finding a practical purpose for every **use**,
  though the bank between seven and eight lay **dead**.
  Water would **drift** slow in the summer heat,
  pooling quietly behind the unopened **gate**,
  and no notebook answered the standing **why**.

  New postdocs asked me **why** I defended the **hedge**,
  eager young minds wanting to open every **gate**.
  They had the complex numbers for a better **use**.
  They planned a more efficient scientific **use**.
  I watched the seasonal silt **drift**.
  The statistics proved the bank was **dead**.

  Some structures are simply born **dead**,
  architectural scraps asking **why**
  they hold the weight of soil **drift**.
  Maybe the bank was just a builder's **hedge**,
  a triangle left over from some **use**
  forgotten long before we locked the **gate**.

  Or perhaps it served the man who paid the **gate**,
  keeping labourers off the grass now **dead**
  to science, repurposed for a different **use**.
  We never know the original **why**.
  Those who tore things down broke on the **hedge**,
  but their stories didn't **drift** into the logbooks.

  So the slow water **drift**
  settled quietly by the **gate**,
  and I became the guardian of the **hedge**.
  Not wisdom, just a fear of leaving **dead**
  roots that might still hold the soil. The **why**
  is less important than the present **use**.

  Now I retire from active **use**,
  watching the seasons **drift**
  past the point of asking **why**.
  The postdocs were right about the stats, the **gate**
  was wrong on the map, but the bank stays **dead**
  centre of the field, inside the **hedge**.

  The **hedge** remains, a quiet **use**,
  while **dead** reasons fade without a **why**.
  Water **drift** settles by the **gate**.
