answer: |-
  The disagreement between you and your friend hinges on a distinction often elided in discussions of pragmatism: the difference between scientific *method* and scientific *justification*. Your friend is correct that Rorty's antirepresentationalism does not demand scientists abandon double-blind trials, mathematical rigor, or peer review. The daily machinery of science remains intact because, for Rorty, these are tools of coping rather than mirrors of nature. However, you are correct that removing representational success from the normative framework fundamentally alters the *discourse of justification* within institutions, particularly when dealing with incommensurable frameworks like quantum gravity and general relativity.

  Under a realist framework, the incommensurability of general relativity and quantum field theory presents an epistemic crisis. If science aims to represent the world as it is, and two successful theories cannot be translated into one another, at least one must be false, or both are approximations of a deeper, hidden reality. Institutional evaluation in this context seeks a "neutral court of appeal"—a shared observational language—to adjudicate which theory is closer to the truth. Funding bodies and review panels operate under the assumption that they are investing in the gradual uncovering of nature's structure. When that structure is inaccessible or contradictory, realism forces institutions into a stance of suspension or metaphysical speculation about which program is "more likely" to be true.

  Rorty's neopragmatism dissolves this crisis by denying the existence of the neutral court. If truth is not accuracy of representation but rather "warranted assertibility" within a community, then the inability to translate between quantum gravity and quantum field theory is not a metaphysical dead end but a pragmatic obstacle. The implication for institutional practice is a shift from *adjudication* to *selection based on consequences*. Grant panels no longer ask which theory is "truer" but which vocabulary offers more fruitful possibilities for coordination, prediction, and technological manipulation. The normative weight shifts from correspondence to utility. In a realist regime, a theory that predicts well but lacks conceptual coherence with established "true" theories might be viewed with suspicion as potentially accidental. In a Rortyan regime, predictive success is the primary virtue, and conceptual incommensurability is tolerated so long as the vocabulary pays its way.

  This shift alters how failures of inter-theoretic translation are treated. For the realist, the lack of a shared language is a problem to be solved by finding the correct ontology. For the antirepresentationalist, it is a signal to develop a pidgin or to choose one vocabulary over another based on specific goals, without assuming one maps onto reality better than the other. Consequently, institutional discourse should arguably abandon talk of "getting nature right." This is not merely semantic; it changes how scientists justify their work to the public and to funding bodies. Instead of claiming to reveal the "laws of the universe," institutions would frame their work as creating tools for specific human purposes. This protects science from charges of failure when theories change radically; the old theory wasn't "false," it was simply less useful for the new problems at hand.

  However, the strongest challenge to this institutional shift comes from the "No Miracles" argument. Realists argue that the predictive success of science is a miracle unless our theories are at least approximately true. If funding agencies abandon truth-tracking entirely, they risk losing the explanatory power of why science works at all. Furthermore, without the regulative ideal of truth, there is a risk that "utility" becomes defined too narrowly by short-term technological gain rather than long-term understanding.

  In practice, the observable difference may be subtle. You will not see scientists changing their equations. You will, however, see a change in the written deliberations of review panels. Where a realist panel might reject a proposal because it "contradicts established physical reality," a pragmatist panel would reject it because it "fails to integrate with productive research lines." The outcome might be the same, but the normative authority shifts from Nature to the Community. Your friend sees the stability of the outcome; you see the instability of the justification. In high-stakes domains like quantum gravity, where empirical data is scarce, the justification is often all there is. Therefore, changing the justification changes the institution, even if the lab coats remain the same.

