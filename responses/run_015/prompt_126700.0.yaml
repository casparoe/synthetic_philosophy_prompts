          *   *Argument for Declaratory:* It's just stating a fact: "Norm X was violated." No moral stigma attached, just record-keeping. Therefore, R's hypocrisy doesn't matter.
          *   *Counter-argument:* Censure is a sanction. It damages reputation, implies moral failing, and carries social cost. It is inherently blaming. If it were just declaratory, it wouldn't need a committee vote; it would be an administrative note. The request asks for a "formal censure," which implies punishment/disapproval.
          *   *Analysis:* Censure is blaming. It affects standing. Therefore, the standing of the accuser and the fairness of the process matter.

      *   **Issue 2: R's Standing (The Reformer's Exemption).**
          *   *Argument for R:* She admits her fault, wants her paper retracted, and holds herself to the new standard. This shows moral growth and commitment. She is not hypocritical; she is penitent.
          *   *Counter-argument:* Tu quoque (you too) is logically valid in practical ethics regarding standing. If the Society punished R then (or honored her) and now punishes M for the same act, it looks selective. R's personal penance doesn't fix the Society's inconsistency. However, her penance *does* mitigate the hypocrisy charge against *her* personally, but not against the *process* of selective enforcement.
          *   *Analysis:* R's standing is improved relative to a silent hypocrite, but the Society's standing is the real issue.

      *   **Issue 3: Society's Position (Retroactivity & Selectivity).**
