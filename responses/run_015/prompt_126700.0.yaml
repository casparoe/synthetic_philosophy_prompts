answer: |-
  Colleagues, I recommend that we decline the motion to censure M. for his conduct between 2009 and 2013, though I propose we couple this decision with a formal public statement clarifying our current ethical standards and inviting all members with similar legacy work to add explanatory notes or retractations voluntarily. This recommendation rests on the view that while the ethical case against deception without debriefing is strong, the procedural case against this specific censure is fatal to the Society's legitimacy. To explain why, I need to address the three divisions among us directly, starting with the nature of censure itself. Those arguing that censure is merely declaratory contend that it simply records a norm violation without implying moral blame, much like a court noting a law was broken regardless of intent. If this were true, R.'s history and the Society's past honors would be irrelevant. However, this distinction does not hold under scrutiny. A formal censure by a learned society is inherently reputational; it signals to the field that the target is unfit for full standing in the community. It functions as a sanction, not a statistic. Because it carries stigma and professional cost, it is an act of blaming, and wherever blaming occurs, questions of fairness, standing, and consistency must be answered. We cannot treat this as a bureaucratic register entry when the consequence for M. is a permanent mark on his record.

  This leads to the question of R.'s standing. The strongest version of the case for her motion argues that her willingness to retract her own work and condemn her past actions demonstrates a moral growth that grants her unique authority to speak on the issue. This is not standard hypocrisy; it is penitence. She is not claiming she was right then, but that we must be right now. While this clears her of personal hypocrisy, it does not resolve the Society's problem of selective enforcement. Even if R. has clean hands today, the Society does not. We are being asked to punish M. for conduct that was code-compliant at the time, conduct that we not only permitted but in R.'s case actively rewarded. If we censure M. but leave the other four senior members who behaved similarly untouched, we are not enforcing a norm; we are conducting a witch hunt. The reformer's exemption may save R.'s credibility, but it cannot cure the Society's inconsistency. To censure M. alone is to imply that his sin is worse than the others, or that he was chosen for reasons unrelated to the conduct itself. Unless we are prepared to investigate and potentially censure all five senior figures from that period, singling out M. undermines the very rule of law we claim to uphold.

  The third and most decisive issue is the Society's position on retroactivity. We are being asked in 2025 to condemn conduct that our rules permitted in 2012. The strongest argument for proceeding anyway is that some ethical violations are so fundamental—malum in se rather than malum prohibitum—that they transcend the written code of the time. Deception without debriefing harms participants and trust, regardless of what the rulebook said. Furthermore, M.'s current refusal to attach a note or retract suggests a continuing commitment to a practice we now deem unacceptable. However, adopting this view sets a dangerous precedent. If we establish that the Society can punish members for actions that were fully compliant with the code at the time, we weaken the protective function of the code for all current members. They must be able to rely on the rules as written. The loss incurred by declining the censure is real: we miss the opportunity to draw a bright line in the sand and to formally mark M.'s refusal to remediate as unacceptable. We risk signaling that seniority protects one from accountability. But this loss is mitigated if we issue the proposed public statement. By clarifying that while past work was code-compliant it is now understood as ethically flawed, and by explicitly inviting remediation, we set the norm without violating the principle against retroactive punishment. We shift the burden to the present: will you fix the record now that you know better? M. can then choose to refuse, and we can revisit sanctions based on his current non-compliance with present standards rather than past compliance with old ones.

  There is one factual contingency that would change this recommendation. Our analysis assumes M. acted in good faith reliance on the code as it stood. If it were established that M. knew the code was about to be revised to prohibit this deception when he ran the last of the three studies in 2013, he would have been acting in bad faith, attempting to beat the clock on a known ethical change. In that specific scenario, the retroactivity objection fails because he was aware the norm was shifting and chose to violate the emerging standard. If such evidence surfaces, I would recommend we postpone the vote pending a specific inquiry into that timeline. Absent that evidence, however, we must prioritize the consistency and legitimacy of the Society over the satisfaction of punishing a specific instance of past conduct. We should decline the censure, issue the statement of principle, and record that future sanctions will apply to any member who refuses to remediate known ethical issues in their past work once notified by the Society. This allows us to uphold the norm without compromising the fairness of our process.
