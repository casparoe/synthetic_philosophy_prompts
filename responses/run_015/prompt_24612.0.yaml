prompt: |-
  Treat the 2016 Brexit referendum as a Ulysses contract and tell me where the model breaks. The idea is the electorate precommitted to 'Leave' and bound the future government to implement it, but the question was vague and the future self turned out to have new info about the actual deal. Using the Ulysses contract literature -- the sophisticated/naive split, when a committment is rational, whether it's still binding once the future self learns new things -- map it out: who's committing, to what, under what conditions, and what happens when those conditions aren't met. Then be honest about what the framework can't explain about the wrangling, and whether this is a confirmation, an anomaly, or a case the theory never anticipated.
reasoning: |-
