answer: |-
  The autumn air was crisp as they left the philosophy building. Aris, the nativist, walked slowly; Elena, the empiricist, matched his pace.

  **Aris:** The seminar conflated three distinct claims. First, that specific data types never occur. Second, that they occur too sparsely or noisily for general procedures to extract them. Third, that the data underdetermine the outcome because incompatible grammars fit the evidence equally well. My live thesis is the third: underdetermination. Even with perfect data, the hypothesis space is too vast for a domain-general learner to converge on the human grammar without bias.

  **Elena:** I accept that distinction. My counter is that you underestimate the structure in the signal and the power of domain-general statistical learning. I concede the data are sparse, but I deny they are insufficient. A Bayesian learner with appropriate domain-general priors—sequence memory, auditory processing limits—can select the correct grammar. I don't need data absence to be false; I need your underdetermination claim to be false.

  **Aris:** You concede domain-specific architecture—memory limits, auditory priors—but deny domain-specific representational content. You say the brain is built for language, but contains no grammar.

  **Elena:** Precisely. Canalized development and architectural constraints are uncontroversial. I deny only that the child possesses grammatical principles *as content*.

  **Aris:** Then consider the filter thought experiment. Adults speak only in flat chains; subordination is stripped. Yet children produce hierarchical constructions, recycling edge particles as internal markers.

  **Elena:** I see the force. You argue that hierarchy cannot be induced from linear chains.

  **Aris:** Exactly. A domain-general system sees sequence A-B-C. It cannot infer nested structure [A [B C]] without a prior bias for hierarchy. The children invented structure absent in the input.

  **Elena:** But they recycled material. The discourse particle provided a hook. General cognitive recursion, pressed by communicative efficiency, repurposed the particle. The structure wasn't innate; it was constructed to solve a processing problem. You say domain-general stories can't explain the invention of hierarchy. I say hierarchy is a general cognitive tool, not a linguistic one.

  **Aris:** You answer the *source* of recursion, but not the *specificity*. Why did they map the particle to *subordination* rather than, say, temporal sequencing? The input didn't adjudicate. That is underdetermination.

  **Elena:** Because subordination solves the immediate communicative bottleneck better than sequencing. It's optimal, not innate. Now, your turn to answer my strongest card: Large Language Models. They learn long-distance dependencies from text alone, no innate grammar, no grounding. Existence proof.

  **Aris:** I concede they learn *something*. But they consume trillions of tokens. The child hears millions. The efficiency gap is orders of magnitude. Furthermore, LLMs lack referential grounding; they mimic syntax without semantics.

  **Elena:** I concede the volume difference and the lack of grounding. Children are more data-efficient. But the gap is closing, and grounding may not be necessary for syntax. If a system *can* learn it from text, it is learnable from text.

  **Aris:** 'Can' is doing unpaid work. You rely on identification-in-the-limit results. Gold's theorem shows languages aren't learnable from positive evidence alone.

  **Elena:** I offer the standard reply: Gold assumes arbitrary languages and arbitrary enumerations. Natural languages are not arbitrary; the input is not arbitrary. The theorem doesn't cover realistic learning scenarios.

  **Aris:** I concede the theorem doesn't settle it. But even restricting the hypothesis space to 'natural' languages, underdetermination remains. The LLM succeeds by brute force, not by knowing *what* to look for.

  **Elena:** And I say the 'what' is statistical structure, not grammatical content.

  **Aris:** Here is the sentence I cannot grant you: "General cognitive constraints suffice to fix the specific parameters of human grammar." Architecture constrains the *search*, but not the *target*.

  **Elena:** And here is mine: "The child possesses representational knowledge of grammatical principles prior to experience." I deny the content is there.

  **Aris:** So we need an experiment. Feasible?

  **Elena:** Unlikely. We would need to isolate the architectural constraints from the representational ones. Perhaps neuroimaging of infants before language onset, looking for grammatical-specific activation.

  **Aris:** Or the filter case made real. Artificial language learning with adults, stripping hierarchy. If they invent it spontaneously, you win. If they fail without a hint, I win.

  **Elena:** Agreed. But until then, I bet on the learner, not the blueprint.

  **Aris:** And I bet on the blueprint. The spectrum is too noisy to fit without a model.

  **Elena:** But the model isn't grammar. It's the mind.

  **Aris:** We'll see.

  They reached the quad, the disagreement intact, the experiment undefined but the terms finally clear.
