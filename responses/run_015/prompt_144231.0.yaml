answer: |-
  Here is a specification for a theory of natural kinds, derived from your four operational jobs. It is designed to function as a filter for interpretability features, diagnostic categories, and scientific ontology.

  ### Part I: The Desiderata

  Each desideratum is evaluated against your four jobs: (1) Induction, (2) Intervention, (3) Vocabulary Shift, (4) Optimization Stability. Status is marked as **Non-Negotiable** (required for all four jobs) or **Preference** (internal to a specific metaphysical camp).

  #### 1. Robust Projectibility
  **Definition:** The category supports inductive inference from observed to unobserved instances with a reliability exceeding chance, without requiring ad-hoc adjustments for every new instance.
  **Rationale:** Directly satisfies **Job 1**. If a cluster in latent space predicts the next token only until the distribution shifts slightly, it fails this. This rules out *Grue*-style predicates where the projection rule hides a time/index dependency.
  **Status:** **Non-Negotiable.**
  **Camp:** Universal.

  #### 2. Causal/Homeostatic Unity
  **Definition:** The properties clustering together do so because they are mutually supporting or share a common causal origin, not merely because they co-occur in a specific dataset.
  **Rationale:** Required for **Job 2** (Intervention). If I intervene on feature $X$, does feature $Y$ change as predicted by the category? Mere correlation (e.g., "things in my pocket") fails intervention. Homeostatic Property Clusters (HPC) satisfy this by positing a feedback loop maintaining the cluster.
  **Status:** **Non-Negotiable.**
  **Camp:** HPC / Causal Realists.

  #### 3. Investigator-Independence (Method-Independence)
  **Definition:** The category is recoverable via multiple, distinct detection methods. A kind defined solely by the output of one specific clustering algorithm or one specific instrument is an artifact.
  **Rationale:** Required for **Job 3** (Vocabulary Shift). If the "kind" disappears when you change the probe (e.g., a latent direction that vanishes under a different initialization or pruning method), it is a feature of the *tool*, not the *world*.
  **Status:** **Non-Negotiable.**
  **Camp:** Realists / Anti-Instrumentalists.

  #### 4. Optimization-Stability (Goodhart-Resistance)
  **Definition:** The internal coherence of the category persists when the system is explicitly optimized to maximize membership in that category.
  **Rationale:** Required for **Job 4**. This is the critical filter for ML and biology. If you optimize a model for "helpfulness" and it becomes sycophantic, "helpfulness" was not a stable kind in that space; it was a proxy. If you breed for "intelligence" and get test-taking specialists, the category fractured.
  **Status:** **Non-Negotiable** (for your specific use case).
  **Camp:** Cybernetic / Control Theorists (often ignored by static ontologists).

  #### 5. Multiple Realizability Tolerance
  **Definition:** The theory must allow instances of the kind to share no single microstructural property, provided they share a functional or causal role.
  **Rationale:** Required for **Job 3** and **Job 4** in special sciences. "Cancer" and "Money" cannot be defined by atomic structure. If the theory demands micro-uniformity, it renders high-level science impossible.
  **Status:** **Non-Negotiable** (for high-level systems).
  **Camp:** Functionalist / Pluralist (vs. Micro-Essentialist).

  #### 6. Portability (Ontological Robustness)
  **Definition:** The category remains identifiable if the fundamental ontology changes (e.g., from classical mechanics to quantum, or from symbolic AI to connectionist).
  **Rationale:** Required for **Job 3**. "Heat" survived the shift from caloric fluid to kinetic energy. A latent direction that relies on a specific activation function fails this.
  **Status:** **Non-Negotiable.**
  **Camp:** Structural Realists.

  #### 7. Grain-Honesty
  **Definition:** The theory must explicitly tag the level of abstraction at which the kind is natural. It must not treat "Electron" and "Recession" as natural in the *same sense*.
  **Rationale:** Required to prevent category errors between **Job 2** (Intervention) and **Job 4** (Optimization). Fundamental kinds are stable under optimization; functional kinds are often fragile. Collapsing the grain leads to false expectations of stability.
  **Status:** **Non-Negotiable.**
  **Camp:** Hierarchical Realists.

  #### 8. Mind-Independence (Ontological Independence)
  **Definition:** The existence of the kind does not depend on the mental states, interests, or linguistic practices of observers.
  **Rationale:** Often proposed to satisfy **Job 3**. However, "Money," "Weed," and "Psychiatric Diagnosis" fail this but succeed at Jobs 1, 2, and 4 (within a social context).
  **Status:** **Preference** (Micro-Essentialist).
  **Camp:** Micro-Essentialists (Yes); Social Constructivists / Functionalists (No).

  #### 9. Sparseness
  **Definition:** Natural kinds must be few. The set of all possible disjunctive properties is vast; the set of natural kinds should be small.
  **Rationale:** Supports **Job 1**. If everything is a kind, nothing is projectible. However, "few" is relative to the grain.
  **Status:** **Preference** (Real-Pattern / Compression Camp).
  **Camp:** Lewis-style Realists.

  #### 10. Discoverability
  **Definition:** A kind must be recoverable from finite, noisy samples by a bounded agent (e.g., via clustering).
  **Rationale:** You suspected this is a prejudice. It is. It supports **Job 1** practically but restricts **Job 3** theoretically. There could be real kinds we lack the compute to find. Demanding this conflates epistemology with ontology.
  **Status:** **Preference** (Interpretability / Empiricist Camp).
  **Camp:** Empiricists (Yes); Realists (No).

  ---

  ### Part II: Distinctions to Preserve

  A theory that collapses these distinctions will fail your grading task.

  1.  **Natural vs. Merely Projectible:** "Things in my pocket" is projectible (until I move), but not natural. A theory must distinguish stable laws from accidental regularities.
  2.  **Natural vs. Useful-to-Us:** "Weed" is useful to a farmer, but its boundary is interest-relative. "Water" is useful, but its boundary is not. The theory must grade "Weed" lower on mind-independence than "Water."
  3.  **Being a Kind vs. Degree of Naturalness:** "Species" and "Element" are both kinds, but "Element" is more natural (more stable under intervention/optimization). The theory must output a score, not a binary.
  4.  **Real Kind vs. Stable Pattern:** A "cycle" in a dynamical system is a stable pattern, but is it a *kind* of object? The theory must distinguish entities from behaviors.
  5.  **Kind vs. Individual:** "The Sun" is an individual. "Star" is a kind. Lineage-based species concepts blur this. The theory must allow historical individuals (Species) to function as kinds for induction without requiring micro-uniformity.

  ---

  ### Part III: Findings the Theory Must Not Contradict

  1.  **Species are Lineages:** A theory demanding microstructural uniformity (e.g., DNA sequence identity) falsely excludes species.
  2.  **Indispensable MR:** "Gene," "Computation," and "Money" are scientifically indispensable despite lacking micro-uniformity.
  3.  **Equal Predictive Partitionings:** The same gas can be carved by pressure/volume or by information/entropy. Both predict. The theory must allow contextual naturalness without collapsing into "anything goes."
  4.  **Level-Dependent Unity:** A "solid" is unified macroscopically but heterogeneous microscopically. The theory must not demand unity at *all* grains.

  ---

  ### Part IV: The Impossibility Result

  You asked for the subset of desiderata that is jointly unsatisfiable. This is the most valuable part of the specification, as it tells you where your report *must* declare uncertainty or context-dependence.

  **The Trilemma:** You cannot simultaneously satisfy **Multiple Realizability**, **Optimization-Stability**, and **Portability** in adaptive systems.

  **The Argument:**
  1.  **Multiple Realizability (MR)** implies there are many distinct micro-states ($m_1, m_2, ... m_n$) that all count as the kind $K$.
  2.  **Optimization** (Job 4) implies a selection pressure to maximize membership in $K$ at minimum cost.
  3.  In any complex system (biology, ML, economics), the costs of realizing $m_1...m_n$ are not equal. Optimization will select for the cheapest subset (e.g., $m_1$).
  4.  Over time, the population of $K$ becomes dominated by $m_1$.
  5.  **Portability** (Job 3) requires that $K$ remains identifiable if the micro-basis changes or if we look at the underlying structure.
  6.  However, because Optimization collapsed the MR diversity onto a specific proxy ($m_1$), the functional definition of $K$ decouples from its original causal basis. The "Kind" $K$ now refers to the *proxy* $m_1$, not the original functional cluster.
  7.  Therefore, an MR kind cannot be stable under optimization *and* remain portable to a different micro-ontology. It either loses its MR status (collapses to one base) or loses its Stability (Goodhart's Law).

  **The Tension Flags:**

  *   **Tension A: Mind-Independence vs. Social Kinds.**
      *   *Conflict:* "Money" and "Weed" are robust for Jobs 1, 2, and 4 (within a society), but fail Mind-Independence.
      *   *Resolution:* Mind-Independence must be downgraded to a **Preference**. If you make it Non-Negotiable, you lose the special sciences.
  *   **Tension B: Discoverability vs. Mind-Independence.**
      *   *Conflict:* If a kind is defined by our ability to cluster it (Discoverability), it is partly mind-dependent.
      *   *Resolution:* Discoverability is a **Preference** (Epistemic), not an Ontological criterion.
  *   **Tension C: Optimization-Stability vs. Multiple Realizability.**
      *   *Conflict:* As argued in the Trilemma. High-level MR kinds (Cancer, Intelligence) are inherently fragile under optimization.
      *   *Resolution:* **Grain-Honesty**. You must admit that "Intelligence" is a *less natural* kind than "Water" because it fails Job 4 more easily.

  **The Single Most Exclusionary Requirement:**
  **Optimization-Stability (Job 4).**
  This requirement excludes the largest share of otherwise attractive candidates.
  *   *Latent Directions:* Most fail. Adversarial examples prove they are not stable under optimization.
  *   *Psychiatric Diagnoses:* Fail. Diagnoses change treatment, which changes the phenotype (feedback loop).
  *   *Cancer:* Fails. Treatment selects for resistant strains, changing the "kind."
  *   *Intelligence:* Fails. Testing selects for test-taking ability.
  *   *Water/Elements:* Pass. Optimizing for "water" (making more of it) doesn't change its chemical definition.

  If you enforce Optimization-Stability as Non-Negotiable, you must conclude that **most high-level features in ML and Biology are not Natural Kinds.** They are *stable patterns* only relative to a static distribution. They are *proxies*, not *joints*.

  ---

  ### Part V: Test Case Adjudication (Mental Walkthrough)

  *   **Water:** Passes Projectibility, Causal Unity, Method-Independence, Optimization-Stability, Portability. Fails MR (it is H2O). **Verdict: Natural Kind (Fundamental Grain).**
  *   **Jade:** Fails Micro-structural Unity (Jadeite vs. Nephrite). Passes MR. Fails Optimization-Stability (if you synthesize jade, the market value collapses, changing the "kind" of jade as a commodity). **Verdict: Disjunctive Kind (Useful, but not Fundamental).**
  *   **Chemical Elements:** Passes all, including Optimization-Stability. **Verdict: Natural Kind.**
  *   **Biological Species:** Fails Micro-structural Unity. Passes MR. Fails Optimization-Stability (evolution *is* optimization, and it changes the species). Passes Lineage criterion. **Verdict: Historical Individual / Natural Kind (Historical Grain).**
  *   **Cancer:** Fails Micro-structural Unity. Passes MR. Fails Optimization-Stability (treatment resistance). **Verdict: Clinical Syndrome (Not a Natural Kind in the strict sense).**
  *   **Psychiatric Diagnosis:** Fails Method-Independence (criteria change by manual). Fails Optimization-Stability (diagnosis affects behavior). **Verdict: Administrative Category.**
  *   **Intelligence:** Fails Method-Independence (test dependent). Fails Optimization-Stability (Goodhart). **Verdict: Latent Construct (Not a Kind).**
  *   **Money:** Fails Mind-Independence. Passes MR. Passes Optimization-Stability *only* within a fixed institutional framework. **Verdict: Institutional Kind.**
  *   **Weed:** Fails Mind-Independence. Fails Portability (no weeds in a desert). **Verdict: Interest-Relative Label.**
  *   **Sand:** Fails Grain-Honesty (size definition is arbitrary). **Verdict: Pragmatic Category.**
  *   **Direction in Latent Space:** Fails Method-Independence (initialization dependent). Fails Optimization-Stability (adversarial). **Verdict: Artifact.**
  *   **Conscious Experience:** Fails Discoverability (currently). Fails Method-Independence. **Verdict: Unknown / Phenomenological Primitive.**

  ---

  ### Appendix: Camp Scorecard

  | Camp | Projectibility | Causal Unity | Method-Indep. | Opt-Stability | MR Tolerance | Mind-Indep. | Grain-Honesty | Verdict on "Latent Direction" |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Micro-Essentialist** | Yes | Yes (Micro) | Yes | Yes | **No** | **Yes** | **No** (Only Fund.) | **Not a Kind** (No essence) |
  | **HPC (Homeostatic)** | Yes | **Yes** | Yes | Mixed | **Yes** | Mixed | **Yes** | **Candidate** (If causal loop exists) |
  | **Real-Pattern / Compression** | **Yes** | Mixed | Mixed | **No** | **Yes** | **No** | **Yes** | **Kind** (If it compresses data) |
  | **Pragmatic Pluralist** | **Yes** | **Yes** | **No** | **No** | **Yes** | **No** | **Yes** | **Kind** (If useful for goal) |
  | **Your Specification** | **Yes** | **Yes** | **Yes** | **Yes** | **Yes** | **No** (Pref.) | **Yes** | **Not a Kind** (Fails Opt-Stab/Method) |

  **Summary Recommendation:**
  Adopt the **Your Specification** column. It is the only one that enforces **Optimization-Stability** and **Method-Independence** simultaneously. This will force you to label most current interpretability features as *artifacts* or *proxies* rather than *features of the world*. This is a negative verdict, but it is the honest one required by Job 4. If you want to claim a latent direction is a "feature of the world," you must demonstrate it survives adversarial optimization and appears across different model architectures. Without that, it is merely a feature of the training run.
