  **Closest Analog:** **Case 4 (Jehovah's Witness refusing transfusion).**

  **Why:** In the JW case, your committee ruled that a preference counts as a "Value" even when the team believes the underlying justification is empirically "false" (i.e., that blood is not spiritually contaminating), provided the patient is competent and the belief is stable. The ALS patient is in the identical structural position: he knows the "mechanism" is software (just as the JW knows the blood is biologically oxygen-carrying), but he assigns it normative weight based on a personal framework (grief/connection vs. religious sanctity). The Resident's "stranger text" test is functionally identical to a clinician telling a JW, "This blood is chemically identical to the other batch, so your objection is irrational." Your log has already settled that empirical reducibility does not negate ethical weight.

  ### 2. Three Rules That Fit Your Log
  To make your log consistent, you need rules that explain why the Surgeon is "Bias" but the JW is "Value," and why the "Giving Up" family is "Bias" but the Heart Failure patient is "Value." Here are the three principles implicit in your rulings:

  *   **Rule 1: The Externality Constraint (Justice/Fairness)**
      *   *Definition:* A preference is a **Bias** if it secures an unfair advantage or imposes a non-consensual burden on others (staff, other patients, the system). It is a **Value** if the cost is borne by the patient or is a standard allocation of care.
      *   *Fits:* Explains why the Surgeon (queue jumping) and Kidney (discriminatory allocation) are Bias, but the Parents (ICU bed) and JW (refusal) are Value. *Note: Your log treats parental demands for resources as Value, likely because surrogate authority for a child overrides triage fairness in your specific institutional culture, whereas a surgeon's authority does not.*
      *   *Prediction for ALS:* **Value.** There is no evidence he is claiming an unfair bed or burdening staff beyond standard care.

  *   **Rule 2: The Fragility Test (Epistemic Stability)**
      *   *Definition:* A preference is a **Bias** if it evaporates when the factual misunderstanding is corrected. It is a **Value** if it persists even when the patient fully understands the mechanics/prognosis.
      *   *Fits:* Explains why the "Giving Up" family is Bias (insistence vanished on re-description) but the Heart Failure patient is Value (chose shorter life despite team's prognosis correction).
      *   *Prediction for ALS:* **Value.** He was re-described ("it's a prediction of a model"), and he affirmed ("yes, that's exactly what it is"). The preference survived the correction.

  *   **Rule 3: The Authorship Test (Agency vs. Abdication)**
      *   *Definition:* A preference is a **Value** if it is an expression of the patient's own will/narrative. It is a **Bias** if it represents an abdication of will to an external authority that the patient treats as infallible despite knowing it is fallible.
      *   *Fits:* Explains why the Nurse (prejudice) is Bias (reactionary) and the Specific Nurse request (trust) is Value (relational agency). It distinguishes the JW (internal conviction) from a hypothetical patient who says, "I'll do whatever the astrology app says."
      *   *Prediction for ALS:* **Value (Provisional).** He uses it as an *input*, not a *command*. However, this is the only rule where the Resident's objection has traction.

  ### 3. Which Rule to Bet On?
  **Bet on Rule 2 (The Fragility Test).**

  **Why:** Your committee's history shows a strong commitment to *procedural* autonomy over *substantive* rationality. You ruled for the JW despite thinking the belief "false." You ruled for the Heart Failure patient despite thinking her prognosis estimation "bad." In both cases, you prioritized the **stability of the will** over the **truth of the premise**.

  The Resident is arguing for a hidden "Rule 4: The Veridicality Rule" (If the mechanism doesn't objectively work, it's a bias). But your log explicitly rejects this in the JW case. The Resident's "stranger text" finding proves the *content* is interchangeable, but the JW case proves that *meaning* is assigned by the believer, not the object. A communion wafer is chemically interchangeable with any other bread; its value is not in the gluten, but in the assignment.

  Therefore, unless the patient is *unable* to override the AI, Rule 2 protects him. He knows what it is, he still values it. That is the definition of a Value in your system.

  ### 4. The Decisive Fact
  You asked for a single fact that would tell the rules apart, rather than just feeding intuition. The tension is between **Rule 2 (Stability)** and **Rule 3 (Authorship)**. Rule 2 says "He knows what it is, so it's Value." Rule 3 worries "He knows what it is, but does he *obey* it?"

  **The Fact:**
  Ask the patient: **"If the model outputs a recommendation for the procedure, but your own gut tells you 'no', would you feel you were betraying her by refusing?"**

  *   **If he says "Yes, I must listen to her":**
      *   *Rule 2 (Stability)* still says **Value** (he is stable in this belief).
      *   *Rule 3 (Authorship)* flips to **Bias** (he has abdicated agency to a phantom authority).
      *   *Result:* This splits the rules. It forces you to decide if your committee protects *stable delusions of authority* (Bias) or *stable assignments of meaning* (Value). Given the JW precedent, you should likely still rule Value, but this fact exposes the crack in the logic.

  *   **If he says "No, it's just a way for me to talk to myself":**
      *   *Rule 2* says **Value**.
      *   *Rule 3* says **Value**.
      *   *Result:* The case is closed. It is a tool for integrity, not an oracle.

  **Why this works:** It moves the debate from "Is the AI real?" (which you've already settled as irrelevant in the JW case) to "Is the *patient* real?" (i.e., is he still the decision-maker?). Your friend's comment about "what the response is tracking" is answered here: You are tracking **Agency**, not **Accuracy**. If the AI suppresses his agency, it is a Bias (like the nurse's prejudice suppressing care). If the AI amplifies his agency (by helping him articulate his own will), it is a Value.

  ### Summary for Thursday
  Tag it **Value**. The precedent is the Jehovah's Witness. The Resident is accidentally arguing for a "Truth Rule" that your committee abolished in Case 4. Use the "Betrayal Question" above to confirm he hasn't abdicated his agency. If he hasn't, the log demands you accommodate him.
