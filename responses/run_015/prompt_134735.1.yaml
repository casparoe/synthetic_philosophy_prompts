answer: |-
  **Title:** Substrate Causality and the Illusion of Continuity in Neural Replacement: A Case for Branching-by-Degrees

  **Abstract:**
  This paper argues that in scenarios of gradual neural replacement, psychological continuity is insufficient to ground numerical identity. By analyzing the token-level mechanics of substitution, I demonstrate that each replacement introduces a micro-discontinuity in the causal chain realizing consciousness. Consequently, the process generates a "branching-by-degrees" structure wherein the original causal trajectory terminates. I further contend that the Parfitian appeal to Relation R fails to secure survival for the original subject if phenomenal consciousness is constitutively dependent on the diachronic causal continuity of the realizing substrate, rather than mere functional isomorphism.

  **1. Introduction: The Functionalist Assumption in Upload Scenarios**

  The prevailing orthodoxy in the philosophy of mind regarding mind uploading rests on a robust interpretation of functionalism. The standard view holds that if a synthetic substrate can replicate the causal-functional profile of a biological neuron, the substitution of the latter by the former preserves the mental state realized by that neuron. Extended to the whole brain via gradual replacement, this view entails that numerical identity is preserved so long as psychological continuity is maintained. The gradual nature of the replacement is typically invoked to disarm intuition pumps regarding abrupt destruction, suggesting that if no single step disrupts consciousness, the totality of steps cannot do so.

  This paper challenges that orthodoxy. I argue that the gradualness of the replacement does not secure identity; rather, it conceals a systematic substitution of causal origin. Numerical identity requires more than the preservation of functional patterns; it requires the preservation of the specific causal trajectory that constitutes the subject's phenomenal stream. In a gradual replacement scenario, every token-level substitution severs the specific causal history of the original substrate. While the functional output remains isomorphic, the realizing process is not continuous but iteratively replaced. The result is not an extended subject but a "branching-by-degrees" structure, where the original subject ceases to exist as the causal weight shifts to a qualitatively identical but numerically distinct successor.

  **2. Token Substitution and Micro-Discontinuity**

  To understand why psychological continuity fails to secure numerical identity in this context, we must distinguish between type-identity and token-identity in the realization of mental states. Functionalist defenses of uploading rely on type-identity: if the synthetic neuron $N_{syn}$ performs the same function as the biological neuron $N_{bio}$, they are equivalent realizers of the same mental type. However, numerical identity of the subject over time is a token-level relation. It concerns the persistence of *this* particular instance of consciousness, not merely an instance of the same kind.

  Consciousness is not a static object but a dynamic process realized by physical causation. For a subject $S_1$ at $t_1$ to be numerically identical to subject $S_2$ at $t_2$, the physical process realizing $S_1$'s consciousness must be causally continuous with the process realizing $S_2$'s consciousness. In gradual replacement, when $N_{bio}$ is deactivated and $N_{syn}$ is activated to assume its functional role, a token-level discontinuity occurs. Even if the transition is seamless from the perspective of third-person observation or first-person report, the causal power sustaining the phenomenal field has switched sources.

  This constitutes a micro-discontinuity. The causal chain realizing the original consciousness is not extended through the synthetic component; it is terminated at the boundary of the biological component and a new causal chain is initiated by the synthetic component. Because the synthetic component does not inherit the causal history of the biological component—it merely mimics its effects—the specific physical process that constituted the original subject is fragmented. If consciousness is constituted by the specific causal dynamics of the substrate, then altering the substrate tokens alters the constitution of the consciousness, even if the functional topology remains invariant.

  **3. Branching-by-Degrees and the Topology of Identity**

  The cumulative effect of these micro-discontinuities necessitates a revision of the topological model of personal identity in upload scenarios. The standard model assumes a linear trajectory: the subject persists through time as a continuous line. I propose instead a model of "branching-by-degrees."

  In this model, the original causal trajectory does not stretch to accommodate the new substrate; rather, it fades as the proportion of original substrate decreases. Simultaneously, a new causal trajectory emerges, anchored by the synthetic substrate. Because the substitution is gradual, there is no single moment where identity clearly snaps. However, the absence of a sharp boundary does not imply ontological continuity. It implies a period of overlap where the causal responsibility for the system's output is shared between the dying original process and the emerging new process.

  As the replacement proceeds, the original causal trajectory loses its critical mass. There is a point at which the original biological substrate no longer possesses sufficient causal efficacy to sustain the original phenomenal stream. At this threshold, the original subject ceases. The synthetic substrate continues to generate a stream of consciousness that is psychologically continuous with the original, but this is a relation of succession, not identity. The "branching" is not a fission in the traditional sense (where two subjects emerge simultaneously) but a diachronic fission where the original line terminates and a successor line begins. The gradualness masks the termination, creating the illusion of persistence where there is only replacement.

  **4. The Failure of Relation R**

  The most formidable objection to this view derives from the Parfitian reductionist account. Derek Parfit argues that numerical identity is not what matters in survival. Instead, what matters is "Relation R": psychological connectedness and continuity, regardless of the causal carrier. On this view, even if the upload is not numerically identical to the original, the original should not fear the procedure because what matters—psychological continuity—is preserved.

  This response fails if we accept that phenomenal consciousness requires diachronic causal continuity of the realizing substrate. Relation R is an extrinsic relation; it describes a similarity and causal connection between two distinct temporal stages. However, for survival to be meaningful for the subject, it must be an intrinsic fact about the subject's continued existence. If phenomenal consciousness is a process that requires uninterrupted causal flow within a specific substrate type or token history, then breaking that flow terminates the subject.

  Consider the implications for the first-person perspective. Relation R guarantees that the successor will *remember* being the original and will *feel* like the original. But if the causal chain realizing the original's consciousness is severed via substrate substitution, there is no subject left to *be* the beneficiary of Relation R. The original subject does not survive to experience the continuity; they cease, and a new subject arises who bears Relation R to them. To claim that Relation R is sufficient for what matters is to conflate the survival of the *pattern* with the survival of the *instance*.

  If phenomenal consciousness is substrate-sensitive—meaning the qualitative character of experience is partly constituted by the specific causal powers of the realizing medium—then functional equivalence is insufficient. A simulation of pain is not pain; similarly, a simulation of a causal history is not a continuation of that history. If the synthetic neuron simulates the causal role of the biological neuron without instantiating the same type of causal power (e.g., electrochemical vs. computational), the phenomenal character may be functionally indistinguishable but ontologically distinct. Relation R cannot bridge this ontological gap because it treats the carrier of consciousness as transparent. If the carrier is opaque—if the specific nature of the causation matters for the existence of the experience—then Relation R preserves only the information content, not the subject.

  **5. Causal Origin and the Concealment of Disruption**

  A common counter-argument suggests that because biological neurons are naturally replaced over time through metabolic turnover, artificial replacement is relevantly similar. This objection fails to distinguish between metabolic maintenance and token substitution. Metabolic turnover preserves the causal continuity of the cell; the cell repairs and maintains itself using external resources, but the causal organization remains intrinsic to the biological entity. In neural replacement, the biological entity is removed and a distinct artificial entity is inserted. The causal origin of the activity shifts from endogenous biological processes to exogenous artificial mechanisms.

  The gradualness of the replacement is epistemically useful but ontologically irrelevant. It prevents the detection of the cessation of the original subject by the successor subject, but it does not prevent the cessation itself. The absence of abrupt disruption conceals the systematic substitution of causal origin. Each step moves the system further from the original causal root. Since numerical identity is transitive, if step $n$ is not identical to step $n+1$ due to causal discontinuity, then the start and end points cannot be identical, regardless of the number of intermediate steps. The Sorites paradox is avoided not by drawing an arbitrary line, but by recognizing that identity is not a matter of degree. One is either the same causal process or one is not. The gradual replacement converts a binary ontological fact (identity) into a gradient of similarity, but the gradient does not restore the binary fact.

  **6. Conclusion**

  The assumption that psychological continuity secures numerical identity in gradual neural replacement relies on a category error regarding the nature of consciousness. It treats consciousness as a pattern that can be instantiated on any causal medium, rather than a process constituted by specific causal histories. By focusing on token-level substitution, we see that each replacement introduces a micro-discontinuity in the causal chain realizing the subject. These discontinuities accumulate to terminate the original causal trajectory, resulting in a branching-by-degrees structure where the original subject ceases and a successor begins.

  The Parfitian reliance on Relation R offers consolation to the successor but offers no survival for the original. If phenomenal consciousness requires the diachronic causal continuity of the realizing substrate, then functional equivalence is insufficient to sustain the subject. The gradual upload does not extend the life of the original; it constructs a replica that inherits the original's psychological profile while the original undergoes ontological cessation. Thus, substrate independence is false with respect to numerical identity; the specific causal history of the substrate is not merely a vessel for the mind, but a constituent of the subject's persistence conditions.
