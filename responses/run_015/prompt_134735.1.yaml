  I'm a PhD student in philosophy of mind working on personal identity and substrate independence. Please argue for the following claim: in a gradual neural-replacement upload—where biological neurons are substituted one-by-one with functionally equivalent synthetic analogues—psychological continuity alone is insufficient to secure numerical identity between the original and the post-replacement subject. Defend the idea that each token-level substitution introduces a micro-discontinuity in the causal chain that realizes consciousness, so that the cumulative process produces not an extended subject but a "branching-by-degrees" structure, in which the original causal trajectory terminates and a qualitatively identical yet causally distinct trajectory begins. Engage with the standard Parfitian response that what matters is Relation R rather than strict identity, and show why that response fails if phenomenal consciousness requires diachronic causal continuity of the realizing substrate rather than mere functional equivalence. Avoid rehearsing generic Ship-of-Theseus intuitions; focus instead on why the absence of abrupt disruption in gradual replacement actually conceals a systematic substitution of causal origin. Write in a formal, working-paper register, and do not include bibliographies, reading lists, or citation requests.
