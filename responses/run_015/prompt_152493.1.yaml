answer: |-
  **Setting:** *The communal kitchen of the Minneapolis co-op. It's 7:30 AM on a Tuesday. Morgan is pouring coffee. Riley is scraping burnt oatmeal off a pan.*

  **Morgan:** Did you see the proposal for the lobby? The "Community Wins" board?

  **Riley:** The corkboard where we pin our promotions? Yeah. I think it's a terrible idea.

  **Morgan:** Come on. Why? People are doing incredible stuff here. Sarah finished her nursing degree while working two jobs. David got that patent. Right now, that just lives in the hallway gossip. Putting it on the wall makes it real.

  **Riley:** It makes it a scoreboard. That's the difference. You're turning the lobby into a leaderboard.

  **Morgan:** It's not about ranking. It's about *aspirational spillover*. Look, when we hide success because we're afraid of seeming boastful, we starve the rest of the house. If nobody sees what's possible, mediocrity becomes the invisible norm. People think, "Well, nobody else is grinding, so why should I?" Visibility isn't vanity, Riley. It's data. It shows the path.

  **Riley:** I get the role model argument. I do. But you're ignoring the cost of the display. I call it *visibility debt*.

  **Morgan:** Visibility debt?

  **Riley:** Yeah. When you put your success on a public wall, you're forcing everyone who walks by into a transaction. Now I owe you admiration. I owe you a "congrats." If I'm having a terrible week, if I just got laid off or I'm struggling with depression, walking past your patent certification isn't inspiration. It's a bill I can't pay. It forces me to perform happiness for your achievement while I'm drowning. That breaks trust. It makes neighbors feel like an audience instead of a community.

  **Morgan:** Okay, that's fair. The pressure is real. I'm not saying we should ignore the people who are struggling. But think about the quiet kids in the co-op. The ones who don't have parents pushing them. If we enforce this culture of humility where nobody admits they're winning, we're actually protecting the status quo. We're telling them, "Keep your head down." Isn't it worse to let them think nobody ever makes it out? I'd rather risk some discomfort than let them believe success is something to be ashamed of.

  **Riley:** But inspiration doesn't require a billboard. You're assuming the only way to transmit motivation is through public signaling. That's very... Texas about it.

  **Morgan:** *Laughs.* My uncle would take that as a compliment.

  **Riley:** I know. But here's the thing about your spillover idea: it assumes success is purely additive. That seeing you win helps me win. But in a shared living space, resources feel finite. If you highlight your promotion, implicitly you're highlighting my stagnation. You want to deal with the surveillance worry? The feeling that we're being measured? Because that board says, "Your value here is tied to your external achievements." What about the person who just pays their rent on time and cooks great dinners for the house? Where do they pin that?

  **Morgan:** They can pin that. "Best Lasagna" or "Always Pays Rent." But seriously, I hear you on the measurement thing. I don't want people feeling surveilled. But isn't the alternative worse? If we don't name success, we don't demystify it. We make it seem like magic. If David pins his patent, maybe he adds a note about how he failed three times first. That's not pressure; that's roadmap. The debt you're talking about... isn't that just empathy? Isn't part of living together acknowledging when someone clears a hurdle?

  **Riley:** Empathy is chosen. Debt is enforced. If Sarah tells me over coffee she finished her degree, I can hug her. I can choose to engage. If it's on the wall, it's ambient. It's always there. And you're right, demystifying success is good. But does a lobby board do that? Or does it just curate the highlight reel? You want to avoid mediocrity becoming the norm? Fine. Let's host workshops. Let's have mentorship nights. Let's make success something we *do* together, not something we *view* on cork. That addresses your spillover without charging my visibility debt.

  **Morgan:** So you're saying the medium is the problem. Not the celebration.

  **Riley:** Exactly. A board is static. It separates the winner from the neighbor. It says "Look at me." A workshop says "Come with me." You want role models? Great. Make them accessible, not monumental. If you put a face on the wall, people look up at it. If you put a person in the kitchen, people sit down with them.

  **Morgan:** I can live with that. But only if we agree that hiding wins is also a form of exclusion. If we stop celebrating entirely because we're afraid of the debt, we lose the map.

  **Riley:** Agreed. We don't hide the wins. We just don't plaster them where people can't escape them. We keep the inspiration voluntary. That way, the spillover happens without the invoice.

  **Morgan:** *Raises coffee mug.* No invoices. Just coffee.

  **Riley:** *Clinks mug.* Just coffee.

  ***

  **Confidence Level:**
  I am **85% confident** in this framing. The dialogue successfully integrates the specific concepts ("aspirational spillover" and "visibility debt") while maintaining the requested casual-but-serious tone. The characters engage directly with each other's strongest points rather than talking past one another.

  **Least Sure Part:**
  The concept I am least sure about is **"Visibility Debt."** While it intuitively resonates as a description of emotional labor and the obligation to perform social support, it is not an established sociological term (unlike, say, "emotional labor" or "social capital"). I constructed it to fit your prompt's specific need for a counter-weight to "spillover." There is a risk that this frames the American Dream side (Morgan) as slightly too naive about social pressure, while the Co-op side (Riley) might be understating how much passive visibility *does* actually motivate people without direct interaction. The tension between "inspiration as data" vs. "inspiration as obligation" is real, but "Visibility Debt" might be oversimplifying a complex psychological reaction into a transactional metaphor.
