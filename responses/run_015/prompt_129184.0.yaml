answer: |-
  You have stumbled onto a genuine problem in normative ethics, specifically at the intersection of contractualism, signaling theory, and effective altruism. There is no single standard term of art for "moral-trade deals," though they resemble "vote trading" (logrolling) or "compromise" in political philosophy, and "offsetting" in environmental ethics.

  Your intuition is sharper than your vocabulary. You have correctly identified that not all costs are equal, not all exchanges create value, and some goods lose their value when priced.

  Here is the carving you are looking for.

  ### The Principle: Non-Degradatory Reciprocity

  To be permissible, a moral-trade deal must pass four filters. If it fails any one, the deal is either empty, exploitative, or corrupting.

  **1. The Additionality Filter (Counterfactual Cost)**
  *   **Clause:** The cost borne by each party must be *counterfactual to the deal*. It must be something they would *not* have done (or would have avoided) had the deal not existed.
  *   **Justification:** This prevents "selling hot air." If you sell me something you already own or intended to give away, you haven't sacrificed anything; you've merely monetized a pre-existing state.
  *   **Cases:** This kills **Case 3** (Alex already decided to stop driving) and **Case 4** (Manufactured cost). In Case 3, even if Nora consents, the deal is structurally dishonest because the "cost" is fictitious. It creates a market for things that aren't scarce.

  **2. The Net-Expansion Filter (Non-Fungibility)**
  *   **Clause:** The trade must result in a net increase in moral labor or resources directed toward the causes involved. Swapping fungible resources (like money) for fungible resources is empty; swapping distinct actions or constraints is valuable.
  *   **Justification:** This explains why **Case 2** feels empty. Money is fungible. If Sam gives $200 to AI and Nora gives $200 to Malaria, the outcome is identical to them each giving to their own cause. No new energy entered the system. In **Case 1**, labor is less fungible. Priya's labor at the shelter is a specific input that Marcus wasn't providing. The total "moral work hours" increased.
  *   **Cases:** This kills **Case 2**. It saves **Case 1**.

  **3. The Sovereignty Filter (Third-Party Consent)**
  *   **Clause:** You cannot trade away benefits, rights, or outcomes that belong to a third party who is not at the table. You can only trade *your own* constraints, labor, or property.
  *   **Justification:** This distinguishes **Case 1** from **Case 6**. In Case 1, Priya trades *her* Saturday. In Case 6, the colleagues trade *the beneficiaries'* potential improvements in accessibility and pay. The beneficiaries did not consent to have their claims bargained away for the colleagues' peace of mind.
  *   **Cases:** This kills **Case 6**. It saves **Case 1**.

  **4. The Integrity Filter (Signal Preservation)**
  *   **Clause:** The trade must not degrade the informational value of the actions traded. If the act of trading signals that the underlying conviction is weak, the trade is prohibited.
  *   **Justification:** This is the hard one. It addresses **Case 7**. Some moral actions derive their power from the fact that they are *not* for sale. Advocacy, voting, and testimony are "speech acts" that claim truth. If you trade them, you signal they are merely preferences.
  *   **Cases:** This kills **Case 7**. It saves **Case 1** (working at a shelter is labor, not a truth-claim).

  ---

  ### Analysis of Your Specific Questions

  **1. Which verdict has to go?**
  None of your verdicts need to change, but your reasoning for **Case 2** needs tightening. You called it "empty." Under the **Net-Expansion Filter**, it is worse than empty: it is *opportunity cost*. By formalizing a deal that does nothing, you consume time and social capital that could have been used for a deal that *does* something (like Case 1). It normalizes the idea of moral trading without the benefit, potentially paving the way for worse trades later.

  **2. Is Case 7 just an externality (Clause 4)?**
  It is an externality, but a *constitutive* one. In Case 6, the harm is to *other people* (the beneficiaries). In Case 7, the harm is to the *meaning of the action itself*.
  When you advocate for a cause, you are issuing a certificate of authenticity: "I believe this is true/good." When you sell that advocacy, you are effectively counterfeiting the certificate. The damage isn't just that people trust you less (reputation); it's that you have demonstrated that your advocacy is a commodity, not a conviction.
  *   **Why Case 1 survives:** Priya working at a shelter is a transfer of *energy*. It does not claim "I love shelters." It claims "I am willing to work." That willingness is alienable (you can sell your labor).
  *   **Why Case 7 fails:** Advocacy is a transfer of *credibility*. Credibility is inalienable. If you sell it, you prove it wasn't real.
  *   **Verdict:** Case 7 needs its own clause (The Integrity Filter) because it violates the internal logic of the action, not just the external welfare of others.

  **3. The Carbon Offset Analogy**
  It transfers cleanly to **Additionality (Clause 1)** but distorts **Value (Clause 2 & 4)**.
  *   *Good:* Carbon credits must be "additional" (wouldn't have happened otherwise). This perfectly matches your intuition on Case 3 (Alex's bike lane).
  *   *Bad:* Carbon is fungible. A ton of CO2 reduced in India is mathematically identical to a ton reduced in Ohio. Moral action is often *not* fungible. Priya working at a shelter has a different social meaning than Marcus working there. The carbon model encourages you to treat moral acts as commodities, which triggers the Integrity Filter (Case 7). Use the accounting for *costs*, not for *value*.

  **4. The Self-Undermining Worry (The Market for Lemons)**
  Your worry is: *"If the people most willing to name a price are the least committed, then the trades that actually get made are the ones that most understate how much the traded things matter."*
  This argument works. It is a classic "adverse selection" problem.
  *   If moral trades become common, observers will discount the value of any concession. "Oh, he's only fasting because he got something out of it."
  *   This creates a race to the bottom where only those with low commitment participate, because high-commitment people refuse to trade (to protect their signal).
  *   **Resolution:** This is why the **Integrity Filter** is necessary. You must forbid trades on goods where the *value* depends on the *absence of a price*. This limits the market to "low-signal" actions (labor, time, money) and protects "high-signal" actions (advocacy, voting, testimony).

  ---

  ### Three Stress-Test Cases

  Here are three cases constructed to test the boundaries of the **Non-Degradatory Reciprocity** principle. These are designed to return verdicts that might surprise you, based on the logic above.

  **Case A: The "Accountability Pact"**
  *   **Setup:** Two colleagues, both struggling with consistency, agree: "I will donate $500 to a charity I *dislike* if I fail to meet my work goals this month. You do the same."
  *   **Structure:** They are manufacturing a cost (Case 4 shape) to enforce a behavior.
  *   **Principle Verdict:** **Permissible (with caveats).**
  *   **Why:** This looks like Case 4 (manufactured cost), but it passes **Additionality** (they wouldn't donate to the hated charity otherwise) and **Sovereignty** (it's their money). Crucially, it passes **Integrity** because the act (donating to a disliked cause) is explicitly framed as a *penalty*, not a moral endorsement. It does not signal that they support the cause; it signals they value their discipline.
  *   **Surprise:** You might instinctively reject this as "gaming" morality, but because the signal is inverted (the payment signals failure, not support), it doesn't degrade the currency of advocacy.

  **Case B: The "Beneficiary Veto"**
  *   **Setup:** Similar to Case 6 (Workplace Campaigns). Two colleagues agree to drop campaigns for Accessibility and Pay Transparency. *However*, before making the deal, they poll the affected groups. The disabled employees say, "We're tired of the conflict, drop it." The low-wage workers say, "We're tired of the conflict, drop it."
  *   **Structure:** Third-party harm, but with consent.
  *   **Principle Verdict:** **Permissible.**
  *   **Why:** This tests the **Sovereignty Filter**. The filter forbids trading *others'* claims without consent. If the beneficiaries explicitly consent to the trade (perhaps they value workplace harmony more than the marginal gain of the campaign), the sovereignty violation is cured.
  *   **Surprise:** Your intuition on Case 6 was "Wrong." But if the "victims" consent, the moral geometry changes. This suggests the wrong in Case 6 wasn't the trade itself, but the *paternalism* of trading someone else's future without asking them.

  **Case C: The "Silence for Safety" Swap**
  *   **Setup:** Person X knows a truth that would damage Person Y's reputation but not harm the public. Person Y knows a truth that would damage Person X's safety (e.g., home address). They agree: "I won't reveal your address if you don't reveal my scandal."
  *   **Structure:** Trading silence (advocacy/speech).
  *   **Principle Verdict:** **Permissible.**
  *   **Why:** This looks like Case 7 (trading speech/advocacy). However, it passes the **Integrity Filter**. Advocacy claims truth. Silence does not necessarily claim falsehood. Withholding a scandal that doesn't harm the public is not a lie; it is privacy. Withholding an address is safety. Neither action claims to be a public truth-telling act.
  *   **Surprise:** You might group this with Case 7 (selling out a truth). But the principle distinguishes between *advocacy* (claiming X is Good) and *non-disclosure* (not saying Y is True). The Integrity Filter only bans trading *positive claims of truth*. You can trade silence; you cannot trade testimony.

  ### Summary of the Carving

  Your instinct was correct: there is a rule, but it is not a single rule. It is a system of constraints on what can be commodified.

  1.  **Cost must be real** (No Alex/Bike Lane).
  2.  **Value must be created** (No Sam/Nora Money Swap).
  3.  **Rights must be owned** (No Workplace Campaigns without consent).
  4.  **Truth must not be priced** (No Selling Advocacy).

  Your Case 7 failed because you tried to price a good (credibility/conviction) whose value is defined by its resistance to pricing. Your Case 1 succeeded because labor is a commodity; your Saturday belongs to you to sell or spend. The line is not between "public" and "private" acts; it is between "alienable" acts (labor, money, silence) and "inalienable" acts (testimony, conviction, voting).

  If you apply this, you will find that moral trade is a powerful tool for coordination, but only if you strictly forbid the trading of the *signals* that make morality legible to others.
