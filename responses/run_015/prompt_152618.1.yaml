answer: |-
  1. Quick verdict
  Your friend captures the intuitive motivation behind pragmatic encroachment but conflates it with contextualism and mischaracterizes its implications for rational belief. While the bank case example is spot-on, the claim that the view collapses into subjective Bayesianism is a contested objection, not a factual summary.

  2. What's accurate in her summary
  Her summary correctly identifies the central motivation for pragmatic encroachment: the intuition that practical stakes affect knowledge attributions. The bank case example is the standard illustration used by philosophers like Jason Stanley to argue that evidence alone doesn't determine knowledge; the cost of being wrong matters. She is also right that this view challenges traditional invariantism, which holds that knowledge depends solely on truth-related factors like evidence and reliability. Furthermore, her description of the threshold shifting based on stakes accurately reflects the encroachment thesis: high stakes raise the bar for knowing. This captures the pre-theoretical intuition that drives the debate, acknowledging that knowledge is not merely an abstract relation to evidence but is tied to action and decision-making contexts. It also correctly notes that this view implies knowledge isn't a static property independent of the subject's situation. Consequently, it offers a middle ground between skepticism and dogmatism.

  3. Where it slips — misrepresentations and conflations
  The major error is equating pragmatic encroachment with epistemic contextualism. Contextualism claims the word "knows" changes meaning depending on the conversational context, usually the attributor's context. Pragmatic encroachment claims knowledge itself depends on the subject's practical stakes, while the meaning of "knows" remains fixed. Her "social permission slip" description sounds more like contextualism or assertability, whereas encroachment proponents often insist knowledge is a genuine mental state sensitive to practical factors. Additionally, she conflates knowledge with rational belief. Pragmatic encroachment primarily targets knowledge norms, not necessarily claiming identical evidence justifies opposite beliefs rationally, though some argue this follows. Finally, the "Bayesian collapse" is a specific philosophical objection, not a consequence of the view itself. Treating this objection as a definitional feature misleads students into thinking the view lacks normative force by definition, rather than by argument. Contextualism varies semantics; encroachment varies knowledge itself. The Bayesian point assumes evidence is purely probabilistic, but encroachers argue practical factors change the epistemic position required for knowledge, not the probability assignment. Thus, the summary presents a contested critique as established fact.

  4. How a defender of pragmatic encroachment would respond
  A defender would argue that pragmatic encroachment preserves the stability of the term "knows" while explaining our intuitions better than contextualism. They rely on the Knowledge-Action Principle: you can only act on p if you know p. Since high stakes require stronger justification for action, they require stronger justification for knowledge. This maintains normative bite because it ties knowledge directly to rational action, rather than dissolving it into subjective belief updates. They would reject the Bayesian collapse by arguing that practical stakes don't change the probability of the bank being open, but they do change whether that probability counts as knowledge. Therefore, two people with identical evidence might differ on whether they *know*, but not necessarily on what they rationally believe regarding the probability. The view remains normative because it dictates when one is epistemically positioned to act, preserving knowledge as a crucial bridge between evidence and action.

  5. Bottom line for understanding the view
  Your friend's summary is a useful heuristic for the *intuition* behind pragmatic encroachment but fails on the technical metaphysics. Grasp why stakes matter, but discard the claim that it is identical to contextualism. Pragmatic encroachment says stakes change whether you know; contextualism says stakes change what "knows" means. The Bayesian collapse is a criticism to evaluate, not a feature to accept. Conflating the two obscures the specific problems each theory solves. Keep the bank case, drop the identity claim. It helps to ensure you don't mistake a semantic solution for a metaphysical one.
