  1. Quick verdict (2-3 sentences)
  2. What's accurate in her summary (around 150 words)
  3. Where it slips — misrepresentations and conflations (around 200 words)
  4. How a defender of pragmatic encroachment would respond (around 150 words)
  5. Bottom line for understanding the view (around 100 words)
