answer: |-
  1. Suppose a high-fidelity neural recorder reconstructs a coherent narrative from your sleep activity that you do not recognize. Is this recording of *your* dream?
     - Yes (Content exists independently) → Go to 2.
     - No (Dream requires recognition/report) → Go to 5.

  2. Suppose a lucid dreamer signals "I am dreaming" via eye movements timed to REM. Is the experience dated to that sleep-time moment?
     - Yes (Dating independent) → Go to 3.
     - No (Dating depends on report) → Leaf 3: Undefended (Independent content without time). *Awkward commitment: Content floats free of temporal reality.*

  3. Can a subject be wrong about the *order* of events in a vividly recalled dream?
     - Yes (Fallible memory) → Go to 4.
     - No (Authoritative memory) → Leaf 1: Infallible Realism. *Awkward commitment: Memory never distorts temporal structure.*

  4. If memory fades instantly upon waking, was the dream content determinate during sleep?
     - Yes (Robust experience) → Leaf 2: Orthodox Realism. *Awkward commitment: Experiences exist unreported.*
     - No (Fuzzy content) → Leaf 4: Indeterminate Realism. *Awkward commitment: Determinate facts emerge only later.*

  5. Suppose a patient enacts a punch in REM but denies dreaming. Was there a fact about the dream-punch they are wrong about?
     - Yes (Fact existed) → Go to 6.
     - No (No fact without report) → Go to 7.

  6. Is the dream report testimony about a past trace or does it stabilize the trace itself?
     - Testimony → Leaf 5: Dennett's Trace Theory. *Awkward commitment: Traces exist but are too fragile to verify.*
     - Stabilize → Leaf 6: Strong Constitution. *Awkward commitment: Report creates the fact it describes.*

  7. Suppose a subject awakened mid-dream describes an action cut short. Was the dream action genuinely interrupted?
     - Yes (Interrupted) → Leaf 7: Undefended (Interrupted Non-Experience). *Awkward commitment: Events occur without experience.*
     - No (Report incomplete) → Leaf 8: Malcolm's Criterion View. *Awkward commitment: "Dreaming" is solely a waking expression.*

  **Commentary**
  This instrument separates Malcolm (Leaf 8) from Dennett (Leaf 5) via the RBD case (Q5): Malcolm denies sleep-time facts without reports; Dennett affirms fragile traces exist even if unreported. Orthodox Realism (Leaf 2) collapses with Indeterminate Realism (Leaf 4) if students cannot distinguish content determinacy from memory fidelity; Q4 attempts to prise them apart. Mis-sorting may occur if students treat Dennett's "trace" as robust experience (pushing them to Leaf 2); emphasize that for Dennett, the report often *completes* the trace. Leaves 3 and 7 are undefended as they posit independent ontology without temporal or experiential coherence. The Neural Recorder case (Q1) forces the primary ontological split traditional texts obscure.
