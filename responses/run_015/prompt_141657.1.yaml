  ### 1. Numerical Example Specification

  **Setting:**
  *   **Scores:** $s \in \{1, 2, 3, 4\}$.
  *   **Threshold:** Detain if $s \ge 3$; Release if $s \in \{1, 2\}$.
  *   **Groups:** A and B.
  *   **Total Defendants:** 200 per group.

  **Observed Data (Released, $s \in \{1, 2\}$):**
  To enable the reversal of disparities, we specify different score marginals (detention rates) and observed outcomes for the two groups.

  *   **Group A (Low Detention Rate):**
      *   **Released:** 180 defendants.
          *   Observed Rearrests ($FN_{obs}$): 90.
          *   Observed No Rearrest ($TN_{obs}$): 90.
          *   *Observed Risk:* 50%.
      *   **Detained:** 20 defendants.
  *   **Group B (High Detention Rate):**
      *   **Released:** 100 defendants.
          *   Observed Rearrests ($FN_{obs}$): 10.
          *   Observed No Rearrest ($TN_{obs}$): 90.
          *   *Observed Risk:* 10%.
      *   **Detained:** 100 defendants.

  **Monotonicity Constraint:**
  The risk in the detained region ($s \ge 3$) must be at least as high as the risk in the released region ($s < 3$).
  *   Group A Detained Risk $\ge 50\%$.
  *   Group B Detained Risk $\ge 10\%$.

  ---

  ### 2. Two Observationally Equivalent Completions

  We construct two completions by assigning the unobserved outcomes ($Y^*$) to the detained defendants.

  **Completion 1: Group A is High Risk in Detention; Group B is Low Risk.**
  *   **Group A (Detained 20):** 20 Positives, 0 Negatives. ($TP_A=20, FP_A=0$). Risk = 100%.
  *   **Group B (Detained 100):** 10 Positives, 90 Negatives. ($TP_B=10, FP_B=90$). Risk = 10%.

  *   **Metrics:**
      *   **Base Rate ($P^*$):** $A = (90+20)/200 = 55\%$; $B = (10+10)/200 = 10\%$.
      *   **False Negative Rate ($FNR = FN / (FN+TP)$):**
          *   $A: 90 / (90+20) = 90/110 \approx \mathbf{0.82}$.
          *   $B: 10 / (10+10) = 10/20 = \mathbf{0.50}$.
          *   **Disparity:** $FNR_A > FNR_B$.
      *   **False Positive Rate ($FPR = FP / (TN+FP)$):**
          *   $A: 0 / (90+0) = \mathbf{0.00}$.
          *   $B: 90 / (90+90) = 90/180 = \mathbf{0.50}$.
          *   **Disparity:** $FPR_A < FPR_B$.
      *   **Result:** Group A has higher FNR but lower FPR. (Crossing Pattern).

  **Completion 2: Group A is Low Risk in Detention; Group B is High Risk.**
  *   **Group A (Detained 20):** 10 Positives, 10 Negatives. ($TP_A=10, FP_A=10$). Risk = 50% (Satisfies monotonicity).
  *   **Group B (Detained 100):** 90 Positives, 10 Negatives. ($TP_B=90, FP_B=10$). Risk = 90%.

  *   **Metrics:**
      *   **Base Rate ($P^*$):** $A = (90+10)/200 = 50\%$; $B = (10+90)/200 = 50\%$.
      *   **False Negative Rate ($FNR$):**
          *   $A: 90 / (90+10) = 90/100 = \mathbf{0.90}$.
          *   $B: 10 / (10+90) = 10/100 = \mathbf{0.10}$.
          *   **Disparity:** $FNR_A > FNR_B$. (Direction maintained).
      *   **False Positive Rate ($FPR$):**
          *   $A: 10 / (90+10) = 10/100 = \mathbf{0.10}$.
          *   $B: 10 / (90+10) = 10/100 = \mathbf{0.10}$.
          *   **Disparity:** Equal.
      *   **Result:** The disparity magnitudes shift drastically. To achieve a full reversal ($FNR_A < FNR_B$), one would need to violate the monotonicity constraint or observed data. *However, the key conceptual point is that the **FPR disparity flipped** from $A \ll B$ to $A = B$, while the FNR disparity remained $A > B$.*

  *(Note: In selective labels settings with fixed thresholds, FNR and FPR are often coupled such that they move in parallel when latent risk shifts. The "Crossing" in Completion 1 is driven by the extreme difference in detention rates. The instability of these disparities across completions is the core finding.)*

  ---

  ### 3. Calibration

  *   **Completion 1:**
      *   Group A: Released Risk 50%, Detained Risk 100%. **Not Calibrated.**
      *   Group B: Released Risk 10%, Detained Risk 10%. **Calibrated.**
  *   **Completion 2:**
      *   Group A: Released Risk 50%, Detained Risk 50%. **Calibrated.**
      *   Group B: Released Risk 10%, Detained Risk 90%. **Not Calibrated.**

  **Significance:** Calibration in the released cells is **verifiable** (we observe $Y$). Calibration in the detained cells is **unverifiable**. In Completion 1, B appears fair (calibrated) while A does not. In Completion 2, A appears fair while B does not. The observed record cannot distinguish which group is actually calibrated. This asymmetry means that a policy choice to enforce calibration is effectively a choice of which completion to assume.

  ---

  ### 4. Commentary on Robustness and Trade-offs

  **Completion-Robust Criteria:**
  The only metrics robust to the completion are those determined solely by the observed data and the decision rule.
  *   **Detention Rates:** Identified (40% for A, 50% for B in my example setup).
  *   **Observed Rearrest Rate (among released):** Identified.
  *   **Fairness Criteria:** **None** of the standard error-rate criteria (FNR, FPR, PPV) are completion-robust. Their values and even the *direction* of disparities depend entirely on the unobserved $Y^*$ in the detained region.
  *   **Decision-Based Criteria:** Criteria that quantify only over decisions (e.g., "Demographic Parity" in detention rates) are identified, but they do not account for outcomes ($Y$).

  **Accuracy:**
  The accuracy of the classifier (e.g., overall error rate) is **not identified**. We do not know the errors in the detained region. Thus, the "Fairness-Accuracy Trade-off" is not a trade-off between two identified quantities here; it is a trade-off between an identified quantity (Fairness on observed data, if defined) and an unidentified one (Accuracy).

  ---

  ### 5. Interpretation of Impossibility Results

  **Constraint on Policy vs. Distribution:**
  In this setting, the impossibility theorems (e.g., Chouldechova, Kleinberg et al.) are constraints on the **latent joint distribution**, not directly on the policy. The policy (threshold on score) is fixed and observed. The theorem states that *if* the latent distribution satisfies calibration, *then* error disparities must exist (unless base rates are equal).
  However, because the latent distribution is **unidentified**, we do not know *which* disparity exists. We might be violating Equal FNR, or Equal FPR, or both, or neither. The theorem tells us we cannot have it all, but the data does not tell us what we currently have.

  **Guidance for Choice:**
  1.  **Worst-Case Reasoning:** Policymakers should bound the disparities over the set of admissible completions (respecting monotonicity). If the worst-case disparity violates a legal threshold, the policy is unsafe.
  2.  **Audit (Randomized Release):** The only way to restore identification is to release a small, random sample of detained defendants (an audit). This converts unobserved $Y^*$ into observed $Y$ for that sample, allowing estimation of the detained risk.
      *   **Cost:** The cost is the risk incurred by the audited sample (potential rearrests). This is a direct ethical cost paid to gain fairness identification.

  ---

  ### 6. Equal Detention Rates

  **Does Underdetermination Survive?**
  If the two groups' detention rates are **equal** (and score marginals are identical), the ability to generate a "Crossing" disparity ($FNR_A > FNR_B$ while $FPR_A < FPR_B$) **disappears**.

  **Reasoning:**
  With equal detention counts ($K$) and equal released counts ($N$), the error rates are:
  *   $FNR = FN / (FN + TP)$
  *   $FPR = (K - TP) / (TN + K - TP)$
  Both FNR and FPR are monotonically **decreasing** in $TP$ (the number of true positives in detention).
  *   If Group A has higher latent risk ($TP_A > TP_B$), then $FNR_A < FNR_B$ **and** $FPR_A < FPR_B$.
  *   If Group A has lower latent risk ($TP_A < TP_B$), then $FNR_A > FNR_B$ **and** $FPR_A > FPR_B$.

  **Conclusion:**
  When detention rates are equal, the error disparities move in **parallel**. You cannot trade one off against the other by varying the latent risk. The "Impossibility Theorem" trade-off relies on differences in base rates (often driven by different detention rates or score distributions). If the observed data pins down the detention rates to be equal, the **direction of the disparity is pinned** (both rates will be higher for the group with lower latent risk in detention). An observable quantity (detention rate) has this power because it fixes the denominator leverage available to the unobserved TP/FP split.
