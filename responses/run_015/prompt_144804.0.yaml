answer: |-
  # Colloquium Prep Sheet: Personal Identity & Fission
  **Audience:** Analytic Metaphysicians (Persistence, Composition, Vagueness).
  **Key Constraint:** Two conventionalists about identity; no ethicists; no prudential rationality specialists.
  **Your Position:** Non-Branching Relation R (Parfit + No-Rival Clause).

  ## 1. The Audience Profile & Danger Zone
  *   **They don't care about "What Matters" in a prudential sense.** They care about *ontological commitment*, *supervenience*, and *intrinsicality*. If your view implies that whether I exist tomorrow depends on what happens on the other side of the galaxy (extrinsic determination), they will reject it on metaphysical grounds before they even consider the ethical implications.
  *   **The Conventionalists:** They think "identity" is a conceptual choice. They will view your "Non-Branching R" as just another convention. Your job is to show it's a *better* convention because it tracks the underlying causal structure, not just linguistic usage.
  *   **The Mereologists:** They think in terms of temporal parts. Fission is just a Y-shaped worldtube. To them, survival in fission is trivial (you are the whole Y). You are claiming death in fission. You need a metaphysical story, not just an intuition pump.

  ## 2. Top 3 Objections (Ordered by Damage Potential)

  ### **I. The "Only x and y" / Intrinsicality Objection (DEVASTATING)**
  *   **The Charge:** Whether person $A$ survives as $B$ cannot depend on the existence of a distinct person $C$ (the other branch). This violates the principle that existence and identity are intrinsic matters. If the scan malfunctions and no rival is produced, I survive. If it works and a rival is produced, I die. How can my death be caused by the *existence* of someone else?
  *   **Why it hurts:** This is bread-and-butter metaphysics. If you can't answer this, you look like you're ignoring the logical structure of persistence.
  *   **Likely phrasing:** "You're making survival extrinsic. Are you willing to violate the intrinsicality of existence to save a prudential intuition?"

  ### **II. The Conventionalist Mirror (HIGH DAMAGE)**
  *   **The Charge:** Our conventionalists say identity is just picking the concept that does the work. You are picking "Non-Branching R." They are picking "Identity" or "R-with-Branching." What makes your convention *correct*? If there's no deep fact of identity, you're just stipulating a definition.
  *   **Why it hurts:** It dissolves your thesis into a verbal dispute. If identity is shallow, why is Non-Branching R deep?
  *   **Likely phrasing:** "Isn't this just a verbal dispute about the word 'survival'? Why is your conceptual engineering superior to the standard Lockean one?"

  ### **III. The Perdurance / Flickering Duplicate Objection (MEDIUM DAMAGE)**
  *   **The Charge:** You argue against degree-R views using the "flickering duplicate" case (scattered partial survival is absurd). But if persons are space-time worms (perdurantism), a short worm is still a person. Scattered existence is standard fare for 4Dists.
  *   **Why it hurts:** It exposes that your intuitions rely on a 3D/endurantist ontology that this group likely rejects. They won't share your intuition that scattered survival is absurd.
  *   **Likely phrasing:** "Why is a short temporal part less of a person? You're begging the question against perdurance."

  ## 3. Strategic Concessions (First 2 Minutes)
  *   **Concede "Identity" is shallow.** Do not fight the conventionalists on whether "identity" is a deep metaphysical fact. Agree that *strict numerical identity* might not be what we care about.
  *   **Concede Parfit's negative thesis.** Agree that identity is not *necessary* for what matters (in the sense that we can care about R without identity).
  *   **The Pivot:** Frame your project not as saving "Identity" but as saving the **structure of rational concern** from arbitrariness. You aren't defending a metaphysical fact; you are defending the only coherent *logic* of survival that avoids the "too many minds" or "scattered existence" absurdities.

  ## 4. The "Kill Shot" Reply (Must Land)
  **Target:** The Intrinsicality/Extrinsicness Objection (Objection I).
  **The Argument:** You must argue that **Non-Branching is not an extrinsic add-on, but an internal constraint on the causal relation itself.**
  *   **Script:** "It's not that my survival depends on *him* (the rival). It's that the causal relation required for survival is *uniqueness-involving*. Just as 'being the winner' isn't intrinsic (it depends on others losing), 'being the survivor' is a functional role that logically excludes duplicates. If the causal chain branches, the *specific causal power* required to sustain a single locus of agency is diluted. I'm not saying I cease to exist extrinsically; I'm saying the relation R *just is* a non-branching causal chain by definition."
  *   **Why this works:** It moves the extrinsicness from "existence" to "functional role." Metaphysicians accept extrinsic functional roles (e.g., being a king, being a winner).

  ## 5. Where Your Replies Are Soft (Hedge Here)
  *   **The Flickering Duplicate:** Do not insist that a 1-second person is *metaphysically impossible*. Admit it's ontologically possible but **pragmatically irrelevant**.
      *   *Soft Reply:* "I'm not arguing a 1-second worm can't exist. I'm arguing it can't be the *target of survival concern*. A 1-second connection doesn't sustain the projects that make survival matter." (This appeals to their "does the work" conventionalism).
  *   **The Badness of Fission:** You claim fission is bad because of loss of non-branchingness.
      *   *Soft Reply:* Avoid calling it "death" if they press you. Call it "failure of continuation." If you call it death, they will ask "Who died?" (The original? Both?). Admit the ontology is messy but insist the *practical stance* must be singular.

  ## 6. The Question You Hope Nobody Asks
  **"What supervenes on what?"**
  *   **The Trap:** If you say facts about survival supervene on physical/psychological facts, they will ask: "Does the physical/psychological base include the *absence* of the other branch?"
      *   If **Yes**: You admit survival supervenes on extrinsic facts (back to Objection I).
      *   If **No**: You can't explain why fission is different from single survival.
  *   **The Dodge:** "Survival facts supervene on the *structure of the causal network*. Branching is a structural feature of the network, not an extrinsic addition to it." (Keep it vague enough that they don't press for a supervenience base).

  ## 7. Vocabulary Check (Speak Their Language)
  *   **Don't say:** "It feels wrong," "I care about," "Morally."
  *   **Do say:** "Supervenience base," "Intrinsic vs. Extrinsic determination," "Causal topology," "Conceptual engineering," "Verbal dispute," "Temporal parts," "Indeterminacy."
  *   **Key Distinction:** Frame the "No-Rival Clause" not as a moral constraint, but as a **logical constraint on singular reference** over time.

  ## 8. Final Tactical Advice
  *   **If a Conventionalist presses:** "Why your convention?"
      *   **Answer:** "Because it's the only one that preserves the **transitivity of rational concern** without generating contradictions in agency. Your convention allows me to rationally plan for two mutually exclusive futures simultaneously. That's not just a different convention; it's a breakdown of agency."
  *   **If a Mereologist presses:** "You're just the whole Y-shaped worm."
      *   **Answer:** "The Y-shaped worm exists, but *I* (the pre-fission stage) cannot adopt the standpoint of the whole Y. I have to bet on one branch. My view explains why I have to bet."

  **Good luck. Keep it structural, not ethical.**
