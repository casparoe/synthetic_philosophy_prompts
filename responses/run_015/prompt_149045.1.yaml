answer: |-
  There is a coherent principle underlying your verdicts, though it requires a precise formulation to withstand the scrutiny your friend applied. Your intuitions are not random; they follow a logical distinction between **functional optimisation** and **symbolic excess**. I shall call this the **Principle of Functional Redundancy**.

  ### The Principle Stated

  **Where material standardisation or precision serves a clear practical function or arises from technological constraints, infer convergent tradition or practical necessity unless there is evidence of coercion. Where material standardisation or precision entails functional redundancy, material cost without utility, or precision exceeding practical need, infer institutional regulation or ideological belief.**

  This principle rests on two clauses:

  1.  **The Clause of Practical Convergence (motivated by Cases 2 and 4):** In domains of economic production, storage, or tool manufacture, uniformity is the default expectation of efficient tradition. Unless the uniformity contradicts practical needs (e.g., identical storage for vastly different household sizes) or is accompanied by markers of coercion (seals, administrative buildings), do not infer a centralised institution. Practical problems often have single optimal solutions, leading to parallel development without central command.
  2.  **The Clause of Symbolic Necessity (motivated by Cases 1, 3, and 5):** In domains of ritual, burial, or cosmology, material patterns often lack practical utility. When uniformity or precision appears here—particularly where it involves waste (broken vessels), non-utilitarian objects (unworn axes), or high-effort alignment (solstitial structures)—it cannot be explained by practical optimization. Therefore, it must be explained by shared rules, beliefs, or institutionalised knowledge. The absence of texts is irrelevant here because the material itself acts as the encoded record of that knowledge.

  ### Application to Your Cases

  This principle reconciles the tension your friend identified between Case 1 and Case 2. In Case 1 (axes), the objects have **no wear**; they are functionally redundant. Their uniformity cannot be practical, so it must be institutional. In Case 2 (storage), the objects have a clear function. Uniform capacity likely reflects the optimal size for preservation or construction limits. Since the uniformity *could* be practical, and there are no signs of coercion, you rightly deny the institutional inference.

  It also resolves the tension between Case 2 and Case 5. In Case 2, the material (pits) is mundane and practically explicable. In Case 5, the material (monument) involves high-precision alignment. This precision is not practically necessary for casual observation; it requires specialised, transmitted knowledge. Thus, despite the lack of texts, the structure itself evidences an institution of knowledge, whereas the pits do not evidence an institution of redistribution.

  ### Verdicts on New Cases

  Applying the Principle of Functional Redundancy to your new scenarios yields the following:

  **1. Uniform domestic architecture lacking decorative variation.**
  *   **Verdict:** Read this as **practical convergence**, not an enforced institutional code.
  *   **Reasoning:** Domestic architecture serves a primary practical function (shelter, thermal regulation). Uniformity often arises from shared environmental constraints, material availability, and craft tradition. Without decorative variation (which would signal symbolic identity) or evidence that the uniformity defies household needs (e.g., identical floor plans for vastly different family sizes), the Principle dictates you assume practical optimisation rather than ideological enforcement.

  **2. A sudden, region-wide change in burial orientation coupled with entirely unchanged domestic assemblages.**
  *   **Verdict:** This supports an **ideological shift without broader social restructuring**.
  *   **Reasoning:** Burial is a symbolic domain (Clause 2); domestic assemblages are a practical domain (Clause 1). A change in the symbolic realm that does not ripple into the practical realm suggests a change in belief systems or ritual rules that did not alter the economic or social organisation of daily life. The material pattern in the burial context is functionally redundant (orientation does not affect preservation), so its change signals a change in the institutional rule governing belief.

  ### Honest Assessment

  While this principle saves your verdicts from inconsistency, I must offer a plain assessment of its costs, as you requested reflective equilibrium.

  **The Vulnerability of Case 2**
  Your principle holds together only if your assessment of "practical necessity" in Case 2 is correct. If the uniform storage pits are *not* practically optimal—for example, if households vary significantly in wealth or size yet possess identical capacity—then uniformity becomes functionally redundant. In that specific scenario, the Principle of Functional Redundancy would force you to **abandon your verdict on Case 2**. Uniform capacity across unequal households would signal an egalitarian institutional rule or rationing system, regardless of the absence of seals or administrative buildings. You are currently assuming that uniform capacity is technologically determined; if future evidence suggests it is socially determined, your denial of an institution there would be untenable.

  **The Risk of Subjectivity**
  The principle relies entirely on the archaeologist's ability to distinguish "practical" from "symbolic." This is not always clear-cut. Astronomical alignment (Case 5) can be argued as practical for agriculture. Burial goods (Case 1) can be argued as practical provisioning for an afterlife (which you dismissed, but others might not). To maintain consistency, you must accept that the distinction lies not in the *intent* of the ancient people, but in the *material cost* observable to you. If the material cost yields no observable practical return in the archaeological record (no wear, deliberate breakage), you treat it as symbolic.

  **Conclusion**
  You need not abandon your verdicts to achieve consistency, provided you accept the **Principle of Functional Redundancy**. However, you must acknowledge that your verdict on Case 2 is the weakest link. It relies on the assumption that storage uniformity is technologically constrained rather than socially enforced. If that assumption fails, consistency demands you infer an institution there, just as you do in the cemetery. For now, your pattern is coherent, but it rests on the precision with which you can define "utility."
