  Two quantitative traders, Alice and Bob, are catching up at a conference bar. Bob is drinking the well whiskey; Alice orders a martini.

  Alice looks at Bob's ragged tie. "Heard your fund got liquidated. What happened? I thought you had an edge."

  "I did!" Bob says. "Coin flip, 60% chance to multiply by 1.6, 40% chance to multiply by 0.5. Positive expected value every round."

  "Sure," Alice says. "But you bet 100% of your bankroll every time. The geometric growth rate is negative. You're optimizing expected wealth, not expected log-wealth."

  "Exactly," Bob says, perking up. "I'm maximizing the ensemble average. Across the set of all possible parallel universes, my average wealth is exploding exponentially."

  "But you only live in one timeline," Alice says. "In this one, your time-average trajectory goes to zero almost surely."

  Bob waves his hand dismissively. "That's a localization issue. Technically, I'm a billionaire."

  "Your account balance is $12."

  "That's just the liquidity in this specific realization," Bob says, pulling out his phone. "I'm currently drafting an email to my counterparts in the universes where I got heads ten times in a row. I'm asking them to wire over the difference so the ensemble average holds true locally."

  "And if they don't?"

  Bob sighs. "Then the multiverse has a settlement failure. But mathematically, I'm still right."
