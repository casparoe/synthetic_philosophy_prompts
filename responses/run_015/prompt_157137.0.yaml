answer: |-
  The move you describe is the core intuition behind **Compatibilism** in moral philosophy. Specifically, it rejects the **Principle of Alternative Possibilities** (the idea that you are only blameable if you could have done otherwise) in favor of **Actual Sequence Control** (you are blameable if the action came from your own reasoning process).

  However, your four cases reveal that this single slogan ("You chose") masks three distinct philosophical mechanisms.

  **Case A** is a classic **Frankfurt-style Case**. The move succeeds because the coercive mechanism never actually intervened. You acted on your own reasons. The fact that you *couldn't* have done otherwise is irrelevant because the constraint was idle. This is the cleanest fit for the move.

  **Case B** is **Standard Duress**. The move partly fails here. While you technically "chose" to hand over the money, the threat distorted your reasoning so heavily that most people consider blame mitigated. The "you could have resisted" reply feels hollow because the cost of resistance was unjustly high.

  **Case C** relies on **Tracing**. The move succeeds, but for a different reason than A. You are blameable not because the current moment was free, but because you voluntarily put yourself in this constrained position earlier. The blame traces back to the loan, not the handover.

  **Case D** is **Moral Ignorance** or **Constitutive Luck**. The move fails badly here. If you literally lacked the conceptual framework to see cruelty as wrong, saying "you could have done otherwise" is false. You lacked the capacity to recognize the alternative. The "residue of blame" you feel is likely a reaction to the harm caused, not the agent's control.

  **Conclusion:** It is not one move. It is a family of arguments that share a slogan but rely on different load-bearing features: whether the constraint intervened (A), whether the constraint was self-inflicted (C), or whether the agent had the capacity to reason (B/D).

