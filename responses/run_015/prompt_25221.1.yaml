prompt: |-
  I'm the maid of honor at my best friend's wedding this Saturday and I am completely stuck on the toast. Here's the thing. The bride, Elena, is a total Cliffordian — not that she'd use that word, but she's a data journalist, she fact-checks everything, and she genuinely believes it's morally wrong to hold a belief without adequate evidence. She once broke up with a guy because he forwarded her a chain email about vaccines. The groom, David, is a Catholic who would say that some of the most important truths in his life — about love, about meaning, about God — aren't the kind of thing you arrive at by running a study. He'd be more of a Jamesian if he read James: there are live, forced, momentous options where your passional nature has to decide, and it's not irrational to do so.

  They've been together for six years and their relationship works beautifully, but the toast has to somehow honor both of their ways of being in the world without selling either of them short. The room is going to be split: half journalists and data nerds, half David's very religious family. If I frame Elena's worldview as the gold standard and David's as this cute exception she tolerates, his family will be hurt. If I frame David's faith as the deeper truth and Elena as someone who just hasn't gotten there yet, she'll feel betrayed and frankly it wouldnt be true.

  I need a toast — maybe three or four minutes — that makes sense of how two people with such different epistemologies can love each other and build a life together, and that lands as celebration, not as a philosophy paper. Can you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Maid of Honor (Best Friend).
      *   **Occasion:** Wedding Toast (Saturday).
      *   **Duration:** 3-4 minutes (approx. 400-550 words spoken at a moderate pace).
      *   **Key Characters:**
          *   *Elena (Bride):* Data journalist, empiricist, Cliffordian (evidence-based belief), fact-checker, rational.
          *   *David (Groom):* Catholic, Jamesian (faith/passion in momentous decisions), values truths beyond data (love, God, meaning).
      *   **The Conflict/Challenge:** Bridging two different epistemologies (ways of knowing) without diminishing either. Avoid making one "right" and the other "wrong" or "tolerated."
      *   **Audience:** Split 50/50 between journalists/data nerds and religious family. Needs to land with both.
      *   **Tone:** Celebratory, warm, insightful, not academic/philosophical, authentic.

  2.  **Deconstruct the Philosophical Underpinnings (for internal understanding, not to be lectured):**
      *   *Clifford:* "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." (Elena)
      *   *William James:* "The Will to Believe." In certain momentous, live, forced options, we have the right to believe ahead of evidence. (David)
      *   *The Synthesis:* Marriage itself is the synthesis. You need data to know someone, but you need faith to commit to them forever.

  3.  **Brainstorming Angles & Metaphors:**
      *   *Idea 1: The Venn Diagram.* A classic data joke, but maybe too cliché for a data journalist?
      *   *Idea 2: The Hypothesis.* Elena tested the hypothesis of David. But faith isn't a hypothesis.
      *   *Idea 3: The Map vs. The Territory.* Data maps the world, faith walks it.
      *   *Idea 4: Evidence vs. Witness.* In journalism, you need evidence. In religion (and love), you are a *witness*.
      *   *Idea 5: The Leap.* Elena calculates the risk; David takes the leap. Together, they jump.

      *Selected Approach:* Focus on the act of *commitment* itself as the bridge. Acknowledge their differences openly (it's funny and true) but frame their union as a "third way" that is stronger because of the tension. Use the concept of "Evidence" vs. "Witness."

  4.  **Drafting - Section by Section:**

      *   **Opening:** Hook the room. Acknowledge the elephant in the room (their differences) but immediately normalize it. Establish my relationship to Elena.
      *   **Honoring Elena:** Describe her rigor without making her sound cold. It's about integrity. Mention the chain email story (it's funny and illustrative).
      *   **Honoring David:** Describe his faith without making it sound fuzzy. It's about depth and commitment.
      *   **The Synthesis (The Core):** How do they work? Marriage requires *both* data and faith. You need to know who you're marrying (Elena) and you need to trust the unknown future (David).
      *   **The Toast:** Bring it back to the couple. A wish for their future.

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Avoid words like "epistemology," "Cliffordian," or "Jamesian." Use plain English. Instead of "passional nature," use "heart." Instead of "sufficient evidence," use "footnotes."
      *   *Critique:* Is it balanced?
      *   *Fix:* Ensure David's section feels as robust as Elena's. His faith isn't a lack of data; it's a different kind of knowing.
      *   *Critique:* Is it emotional?
      *   *Fix:* Add a specific moment of them together. How they look at each other.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   Start with the fact-checking. Elena fact-checks her toast? No, I fact-checked my toast for her.
      *   Talk about the breakup story. It shows her standards.
      *   Talk about David's calmness. He doesn't need a spreadsheet for love.
      *   The middle: Marriage is a bet. Elena calculated the odds. David trusted the outcome.
      *   Ending: Raise a glass.

  7.  **Polishing and Timing:**
      *   Read aloud to check rhythm.
      *   Ensure the transition from "philosophy" to "love" is smooth.
      *   Make sure the religious family feels respected (faith is valid) and the journalists feel respected (truth matters).

      *(Self-Correction during drafting)*: I initially thought about making a joke about p-values. But that might alienate the religious side. Better to stick to "facts" vs. "heart." Actually, "data" vs. "mystery" is better. Let's use the word "Witness." It works for journalists and churchgoers.

  8.  **Final Review against Constraints:**
      *   3-4 minutes? (Word count looks good, around 500 words).
      *   No selling short? (Both viewpoints validated).
      *   Celebration? (Yes, ends on love).

  9.  **Final Polish:** Add stage directions for the user (pause, smile, etc.) to help delivery. (Proceed to generate output).

  *(Post-Drafting Thought)*: I need to make sure I don't use the terms "Cliffordian" or "Jamesian" in the speech itself. The prompt used them to explain the dynamic to me, but the audience won't know them. I must translate those concepts into everyday language.

  *Revised Plan:*
  1. Open with the tension (Data vs. Faith).
  2. Validate Elena's rigor (Integrity).
  3. Validate David's faith (Courage).
  4. Show how Marriage needs both (The "Third Truth").
  5. Toast.

