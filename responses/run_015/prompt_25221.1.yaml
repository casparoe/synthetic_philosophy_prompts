answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being Elena's Maid of Honor.

  I'll be honest with you: I was nervous about writing this toast. Mostly because I know Elena. I know that if I make a claim in this speech without a credible source, she's going to side-eye me from the head table. I actually sent her a draft yesterday, and she sent it back with three footnotes and a comment asking if I had verified the sample size of my anecdotes.

  And that is exactly who she is. Elena is a woman who believes that truth matters. She believes that we owe it to each other to be rigorous, to check our sources, and not to believe things just because they feel good. We all know the story about the chain email and the ex-boyfriend. To Elena, integrity isn't just a professional standard; it's a moral one. She loves with her eyes open.

  And then, there is David.

  David comes from a tradition that recognizes there are some truths you can't put in a spreadsheet. You cannot run a randomized control trial on grace. You cannot fact-check a prayer. David knows that the most important things in life—mercy, hope, commitment—require a different kind of courage. They require a leap.

  For a long time, I wondered how these two worldviews would fit together. On paper, it looks like a contradiction. How do you build a life when one of you is looking for data and the other is looking for a sign?

  But then I watched them together.

  I watched them buy a house. Elena analyzed the market trends and the flood zone maps. David walked through the rooms and imagined where their family would grow. Elena made sure the foundation was solid; David made sure there was room for the spirit.

  I realized that they aren't contradictions. They are safeguards for one another.

  Elena keeps David grounded. She ensures that his faith is never an excuse for carelessness. She reminds him that actions have consequences and that truth is sacred.

  And David keeps Elena open. He reminds her that not everything valuable can be measured. He teaches her that sometimes, you have to trust before you know. He shows her that love isn't just a conclusion you arrive at; it's a promise you make into the unknown.

  In a way, they have built a marriage that is more robust than either of their philosophies could be on their own. Because a marriage *needs* Elena's rigor. You need to know who you are marrying. You need the evidence of character, of consistency, of time.

  But a marriage *also* needs David's faith. Because no amount of data can predict the future. No study can guarantee that you will still choose each other in ten, twenty, or fifty years. To say "I do" is to admit that there will be days when the evidence is thin, and you will have to rely on the promise.

  Elena brings the witness of the journalist. David brings the witness of the believer. And together, they are testifying to something we can all believe in.

  So, if everyone could please raise a glass.

  To Elena and David. May your life together be grounded in truth, and lifted by faith. May you always fact-check the important things, and may you always have the courage to trust the things you can't.

  To the happy couple!
