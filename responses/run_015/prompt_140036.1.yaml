  **Supplement 14.C: Adjudication of String-Transformation Ambiguities**

  **Preamble:** The following protocols govern the construction of analogy items where conceptual boundaries are fluid. Writers must adhere to these definitions to ensure uniform ambiguity across the benchmark suite. Deviations suggesting conceptual stability will be flagged during review.

  **1.1** The successor relation strictly maps a character to its immediate right-hand neighbor in the standard Roman alphabet (A–Z).
  **1.2** Boundary conditions (e.g., *z*) trigger a wrap-around to *a* unless the item context explicitly forbids cyclic ordering.
  **1.3** Transformation operations apply exclusively to the rightmost contiguous block of identical tokens.
  **1.4** Where the source string contains fewer than five unique characters, the successor relation maps a character to its immediate right-hand neighbor within the set of characters present in the item.
  **1.5** Token identity is determined by glyph shape, not abstract letter-type; case sensitivity is optional unless specified.
  **1.6** Grouping pressure increases proportionally to the number of repeated tokens, overriding positional rules when visual symmetry is compromised.

  **2.1 Sample Item:** `ppq -> ppr` as `sst -> ?`
  **Official Key:** `ssu`
  **Rationale:** The transformation increments the final token based on global successorship (1.1), ensuring the output remains distinct from the input set and maintains alphabetical integrity. Simultaneously, the operation respects the local density constraint (1.4), validating the shift without requiring external alphabetical context. The rightmost block (1.3) is modified, preserving token identity (1.5) while acknowledging that *t* implies a local sequence ending in *u*. Writers must ensure both global and local dependencies are satisfied, even where the defined alphabets diverge. If the local set does not contain a successor, the global alphabet is consulted; if the global alphabet contradicts the local set, the local set takes precedence unless the string length exceeds four characters, in which case visual symmetry (1.6) dictates the output regardless of alphabetical order.

  **Footnote ¹:** Previous iterations classified the variance between 1.1 and 1.4 as a logic error. Current protocol reclassifies this variance as a feature. The slippage between global and local alphabets is not noise; it is the primary signal. The benchmark does not measure the ability to follow rules, but the ability to navigate the collapse of rules. Writers attempting to resolve the contradiction will find their items rejected for lacking necessary ambiguity. Consistency is deemed a confounding variable. The manual is not a prescription for correctness, but a map of known failures. Any item that admits only one valid interpretation is considered broken and must be returned to drafting for additional semantic leakage.
