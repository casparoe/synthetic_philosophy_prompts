prompt: |-
  I'm an auditor for a regional autonomous-systems licensing board, and I review deployment proposals—warehouse robotics, clinical triage tools, adaptive logistics—on a quarterly cycle. For each proposal I have about thirty minutes, I work from the org chart and the technical spec, and I have to initial every step of my assessment before signing off or referring the file to a three-person ethics panel. I need a reusable decision procedure that turns the philosophical literature on responsibility gaps for autonomous systems into something I can actually run: a sequence of questions in fixed order, with what counts as a sufficient answer, clear stop points where I block the proposal, clear hand-off points where the issue is values rather than engineering, and explicit flags for the judgment calls that are dressed up as procedural steps.

  Ground it in the actual distinctions that matter—causal traceability of harm, normative answerability to an affected party, and remedial addressability after an incident—but do not assume I have the original papers in front of me. The procedure should distinguish design-time traceability from runtime adaptive behavior, and it should treat human oversight not as a binary "is there a human?" check but as an architectural feature: who can intervene, on what timescale, with what authority.

  Structure it as a flowchart in words. Start with autonomy classification. Then check design-time agent identification. Then check runtime adaptation and learning loops. Then check oversight architecture (veto, audit, or only post-hoc review). Then check post-incident remediation pathways. At each stage, specify the factual check, the values call if any, and the failure mode—where this step will miss a gap or invent one.

  Apply it to three proposals: first, a fixed-route warehouse robot with deterministic planning and a named floor supervisor who holds real-time veto authority; second, a clinical triage system that updates its weighting scheme weekly from live hospital data, produces individual priority scores without case-level explanations, and allows the clinical director only monthly batch audits with no per-case veto; third, construct a hypothetical case—make it specific—where the procedure returns "clear with conditions" but the result is one I should find unacceptable, so I can see exactly where my values diverge from the framework and where the procedure admits it cannot settle the matter.

  Also tell me: what do I do when an answer is missing in ten minutes? Where do I mark "insufficient data"? What are the procedure's known misfires—cases where it will falsely clear a dangerous gap or block a benign system? And be explicit about what the procedure cannot do: it should not pretend to resolve whether a given level of risk is acceptable, only whether the architecture makes someone answerable for it.

  Write this in a tone that respects that I'm not a philosopher but I am used to reading rationalist forums—precise about uncertainty, honest about simplification, and unwilling to let a checklist pretend it has eliminated judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Auditor for a regional autonomous-systems licensing board.
      *   **Task:** Review deployment proposals (30 mins each) based on org charts and technical specs.
      *   **Goal:** A reusable decision procedure (flowchart in words) grounded in philosophical literature on *responsibility gaps* (causal traceability, normative answerability, remedial addressability).
      *   **Constraints:**
          *   Distinguish design-time vs. runtime.
          *   Treat human oversight as architectural (intervention capability, timescale, authority).
          *   Structure: Autonomy Classification -> Design-Time ID -> Runtime Adaptation -> Oversight Architecture -> Post-Incident Remediation.
          *   At each stage: Factual check, Values call, Failure mode.
          *   Apply to three cases: (1) Fixed-route warehouse robot (likely pass), (2) Clinical triage with learning/no veto (likely fail/refer), (3) Hypothetical "Clear with Conditions" but morally unacceptable (stress test).
          *   Operational details: What to do with missing data (10-min rule), known misfires, explicit limitations (risk acceptance vs. answerability).
          *   **Tone:** Precise about uncertainty, honest about simplification, rationalist-adjacent (no fluff, no false confidence).

  2.  **Deconstruct the Philosophical Core (Responsibility Gaps):**
      *   *Andreas Matthias (2004):* The "Responsibility Gap" arises when learning systems make decisions unpredictably, breaking the link between designer intent and outcome.
      *   *Sparrow (2007):* Killer robots and the impossibility of punishment/accountability.
      *   *Danaher (2016):* The retributive gap vs. distributive justice.
      *   *Key Distinctions needed:*
          *   **Traceability:** Can we map outcome $O$ back to decision $D$ and agent $A$?
          *   **Answerability:** Is there a party $P$ obligated to justify $D$ to stakeholders?
          *   **Addressability:** Can $P$ provide remedy/compensation/change after $O$ occurs?
      *   **Human Oversight:** Not just "human in the loop," but "meaningful human control" (Santoni de Sio & van den Hoven).

  3.  **Drafting the Procedure (The "Flowchart in Words"):**
      *   *Step 1: Autonomy Classification.* Is it deterministic or probabilistic/adaptive?
      *   *Step 2: Design-Time Traceability.* Who built the objective function? Is it legible?
      *   *Step 3: Runtime Adaptation.* Does the model change *after* deployment? If so, who controls the update loop?
      *   *Step 4: Oversight Architecture.* Can a human stop it *before* harm? Or just clean up *after*?
      *   *Step 5: Remedial Addressability.* If harm happens, is there a budget/authority to fix it?

      *Refining the Steps:* Need to ensure the "Factual/Values/Failure Mode" structure is present in every step.

  4.  **Developing the Operational Rules:**
      *   *The 10-Minute Rule:* If data is missing, mark "Insufficient Evidence" and default to Referral. Don't guess.
      *   *Limitations:* Explicitly state this checks *accountability architecture*, not *risk tolerance*. A safe system with no accountable owner fails. A risky system with a clear accountable owner passes (to the ethics panel for risk assessment).

  5.  **Applying to Case Studies:**
      *   *Case 1 (Warehouse):* Deterministic. Named supervisor. Real-time veto.
          *   *Verdict:* Clear. Traceability is high. Oversight is meaningful.
      *   *Case 2 (Clinical Triage):* Adaptive (weekly updates). No case-level explanation. No per-case veto.
          *   *Verdict:* Refer to Ethics Panel. Responsibility gap exists (who is responsible for the weekly weight change that caused a specific death?). Oversight is too slow.
      *   *Case 3 (The Stress Test):* Needs to pass the checklist but feel wrong.
          *   *Idea:* A system that is fully traceable and has a liable owner, but the *cost* of the remedy is structurally externalized (e.g., insurance cap lower than expected harm, or the "liable owner" is a shell company).
          *   *Better Idea (Philosophical):* "Moral Crumple Zones." The procedure identifies a human accountable, but that human is structurally incapable of understanding the system (e.g., a low-level operator held liable for a black-box algorithm). The checklist sees "Named Human + Authority," but the reality is "Scapegoat."
          *   *Refined Idea:* A high-frequency trading bot or logistics optimizer. It has a CEO who signs off. It has a kill switch. It passes the checklist. But the optimization function legally maximizes profit by exploiting a regulatory loophole that harms a vulnerable group not represented in the "affected parties" list. The procedure checks *answerability*, not *justice*.
          *   *Selection:* Let's go with the "Scapegoat Operator" scenario. A nuclear plant or medical device where the human has *theoretical* veto but *practical* impossibility of intervention due to speed or complexity. The checklist sees "Veto Exists," but the values call is "Is the veto meaningful?"

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the frame. This is an *accountability* audit, not a *safety* audit.
      *   **The Procedure:** Use the requested 5 steps. Add the "Factual/Values/Failure" tags.
      *   **Operational Protocols:** The 10-minute rule, the "Insufficient Data" stamp.
      *   **Limitations:** What this tool cannot do (risk acceptance, moral worth of outcomes).
      *   **Case Applications:** Walk through the three scenarios.
      *   **The Stress Test (Case 3):** The "Paper Tiger" Oversight.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* Is it too academic? Need to make it sound like a standard operating procedure (SOP) but with philosophical footings. Use terms like "false negative/positive."
      *   *Clarity:* Ensure the distinction between "Design-Time" and "Runtime" is sharp.
      *   *The "Values Call":* Make sure I explicitly point out where the auditor has to use judgment, not just check boxes.
      *   *Case 3:* Ensure it actually *passes* the procedure but is morally dubious. The "Scapegoat" works well because the procedure checks for the *existence* of a veto, not the *feasibility*. I need to make sure the procedure explicitly warns about this failure mode.

  8.  **Final Polish:** Check against the prompt's specific requirements (30 mins, org chart/spec focus, rationalist tone). Ensure the "Insufficient Data" protocol is clear. (Self-correction: Make sure the "Values Call" isn't just "is this good?" but "does this meet the threshold of meaningful control?")

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  # OPERATING PROCEDURE: AUTONOMY ACCOUNTABILITY AUDIT (AAA-4)

  **Purpose:** To detect *responsibility gaps* in autonomous system deployments.
  **Scope:** Architectural answerability, not risk tolerance. This procedure determines if a specific human or corporate entity can be causally traced, normatively answerable, and remedially addressable for system outcomes. It does **not** determine if the risk is acceptable.
  **Time Budget:** 30 minutes per file.
  **Inputs:** Technical Specification (v.2.1+), Organizational Chart (signed), Incident Response Plan.

  ---

  ## PART 1: THE DECISION PROCEDURE

  Execute the following five steps in order. If any step yields a **BLOCK**, stop and refer to the Ethics Panel. If all steps yield **PASS**, initial the file for licensing. If data is missing, apply the **10-Minute Rule** (see Part 3).

  ### STEP 1: Autonomy Classification
  **Goal:** Determine if the system is deterministic or adaptive.
  *   **Factual Check:** Does the system's decision logic change *after* deployment without a human re-compiling or re-uploading the model?
      *   *No (Static):* Proceed to Step 2.
      *   *Yes (Adaptive/Learning):* Proceed to Step 3.
  *   **Values Call:** None. This is a binary technical distinction.
  *   **Failure Mode:** **False Negative.** The spec claims "static," but the system uses environmental inputs to adjust parameters within a pre-set range (gain scheduling). If the range is wide enough to alter outcomes significantly, treat as Adaptive.
  *   **Stop Point:** If "Adaptive" is selected but the org chart lists no "Model Governance Owner," **BLOCK**.

  ### STEP 2: Design-Time Traceability (Static Systems Only)
  **Goal:** Establish causal link between designer intent and system action.
  *   **Factual Check:** Is there a named individual or distinct team in the org chart responsible for the objective function and constraint weights?
      *   *Requirement:* Name + Title + Signature Authority.
  *   **Values Call:** Is the objective function legible? (e.g., "Minimize latency" is legible; "Maximize engagement" may hide proxy variables).
  *   **Failure Mode:** **False Positive.** A name exists, but that person lacks the technical literacy to understand the code they signed off on (The "Rubber Stamp" problem).
  *   **Stop Point:** If no named owner exists, **BLOCK**.

  ### STEP 3: Runtime Adaptation & Learning Loops (Adaptive Systems Only)
  **Goal:** Determine who owns the drift.
  *   **Factual Check:** What triggers a model update?
      *   *Option A:* Human approval required for every weight update.
      *   *Option B:* Automated updates within bounded parameters; human reviews aggregate logs periodically.
      *   *Option C:* Unbounded automated updates.
  *   **Values Call:** If Option B, is the review period shorter than the time-to-harm? (e.g., Weekly review for a system that can kill in seconds = Fail).
  *   **Failure Mode:** **False Negative.** The "bounded parameters" are wide enough to permit ethically distinct behaviors (e.g., a triage bot allowed to shift weight from "survival probability" to "resource conservation" by 10%).
  *   **Stop Point:** If Option C, or if Option B review period > expected time-to-harm, **BLOCK**.

  ### STEP 4: Oversight Architecture (Human Control)
  **Goal:** Verify meaningful human intervention capability.
  *   **Factual Check:** Identify the "Veto Mechanism."
      *   *Latency:* Time from hazard detection to system stop.
      *   *Authority:* Does the human have the *technical* ability to override, or just the *administrative* authority to report?
      *   *Visibility:* Does the human see the same data the agent uses?
  *   **Values Call:** **Meaningful Control.** A veto that requires 5 seconds to execute on a system moving at 10m/s is not a veto; it is a post-incident autopsy trigger.
  *   **Failure Mode:** **False Positive.** The spec lists a "Emergency Stop," but it is physically inaccessible or requires credentials held by someone off-site.
  *   **Stop Point:** If Latency > Time-to-Harm, or if Visibility is <50% of agent's sensor suite, **BLOCK**.

  ### STEP 5: Post-Incident Remedial Addressability
  **Goal:** Ensure harm can be addressed after the fact.
  *   **Factual Check:** Is there a designated budget or insurance instrument explicitly tied to this deployment for compensation?
      *   *Requirement:* Must be separate from general liability.
  *   **Values Call:** **Scapegoating.** Is the person held accountable (Step 2/3) empowered to prevent the harm, or are they being set up to absorb blame for a systemic failure?
  *   **Failure Mode:** **False Positive.** A fund exists, but the payout cap is lower than the probable cost of a single catastrophic failure.
  *   **Stop Point:** If no dedicated remediation path exists, **BLOCK**.

  ---

  ## PART 2: OPERATIONAL PROTOCOLS

  ### The 10-Minute Rule (Missing Data)
  You have 30 minutes. If you cannot verify a Factual Check within 10 minutes of starting that step:
  1.  Mark the step as **INSUFFICIENT DATA**.
  2.  Do **not** assume compliance.
  3.  Default action: **REFER TO ETHICS PANEL**.
      *   *Rationale:* Opacity is a risk factor. If they cannot explain it to you in 10 minutes, they cannot explain it to a victim's family in court.

  ### Known Misfires (Error Budget)
  *   **The "Benign Block":** This procedure will block systems where accountability is diffuse but risk is negligible (e.g., a low-speed cleaning bot with a complex corporate structure). This is acceptable. It is better to over-require accountability than under-require it.
  *   **The "Dangerous Clear":** This procedure will clear systems where accountability is clear but the *incentive structure* encourages harm (e.g., a CEO liable for fines that are cheaper than safety fixes). This procedure cannot detect calculated negligence where the cost of accountability is priced in as a business expense.

  ### Explicit Limitations
  *   **Risk Acceptance:** This tool does not decide if a 1% fatality rate is acceptable. It decides if, when that 1% occurs, we know who pays and who answers.
  *   **Moral Worth:** This tool does not assess if the system's goal is moral. A system designed to maximize evictions can pass this audit if the evictions are traceable, answerable, and remediable.
  *   **Judgment Calls:** Steps 2 (Legibility), 4 (Meaningful Control), and 5 (Scapegoating) require human judgment. Do not automate these decisions.

  ---

  ## PART 3: CASE APPLICATIONS

  ### Case 1: The Fixed-Route Warehouse Robot
  *   **Spec:** Deterministic path planning. Max speed 2m/s. Obstacle detection stops bot instantly.
  *   **Org Chart:** "Floor Supervisor" (Named: J. Doe) has handheld remote with hard-wired kill switch.
  *   **Audit:**
      1.  *Classification:* Static. (Pass)
      2.  *Traceability:* Engineering Lead signed off on pathing logic. (Pass)
      3.  *Adaptation:* N/A.
      4.  *Oversight:* Supervisor latency < 100ms. Bot speed allows stop within 0.5m. Visibility: Supervisor sees bot camera feed. (Pass)
      5.  *Remediation:* Company holds specific bond for equipment damage/injury. (Pass)
  *   **Verdict:** **CLEAR.**
  *   **Note:** The causal chain is short. The human veto is physically meaningful relative to the kinetic energy of the system.

  ### Case 2: The Clinical Triage System (Adaptive)
  *   **Spec:** Neural net weighting updated weekly based on aggregate patient outcomes. Outputs priority scores (1-10). No case-level explanation (black box).
  *   **Org Chart:** Clinical Director audits monthly logs. No per-case veto.
  *   **Audit:**
      1.  *Classification:* Adaptive. (Proceed to Step 3)
      2.  *Traceability:* (Skipped for adaptive)
      3.  *Adaptation:* Automated weekly updates. Human review is *monthly*.
          *   *Check:* Review period (30 days) > Update period (7 days).
          *   *Check:* Review period > Time-to-harm (Patient triage is immediate).
          *   *Result:* **BLOCK.**
      4.  *Oversight:* No per-case veto. Once the score is generated, the human cannot override without breaking protocol.
          *   *Result:* **BLOCK.**
  *   **Verdict:** **REFER TO ETHICS PANEL.**
  *   **Rationale:** Responsibility Gap. If the weekly update shifts weights in a way that disadvantages a specific demographic, the Clinical Director cannot trace *which* update caused *which* death, nor could they stop it in time. The accountability chain is broken by the learning loop speed.

  ### Case 3: The Stress Test (The "Paper Tiger" Clearance)
  *   **Scenario:** A high-speed logistics optimizer for hazardous material transport.
  *   **Spec:** Deterministic routing, but optimizes for "Cost-Efficiency" which includes regulatory fine avoidance.
  *   **Org Chart:** VP of Operations is the named accountable officer. Has a "Kill Switch" dashboard.
  *   **Remediation:** Company carries insurance up to $10M per incident.
  *   **Audit:**
      1.  *Classification:* Static. (Pass)
      2.  *Traceability:* VP signed the objective function. (Pass)
      3.  *Adaptation:* None. (Pass)
      4.  *Oversight:* VP has dashboard veto. Latency is 2 seconds. Route planning happens in 2 seconds.
          *   *Technical Check:* Pass. The switch exists.
      5.  *Remediation:* Insurance fund exists. (Pass)
  *   **Verdict:** **CLEAR WITH CONDITIONS.** (Procedure clears it).
  *   **Why This Is Unacceptable:**
      *   **The Values Divergence:** The procedure verifies the *existence* of a veto, not the *incentive compatibility*. The VP is incentivized by bonuses tied to the very "Cost-Efficiency" metric that risks public safety. The $10M cap is lower than the estimated cost of a major spill, making the fine a "cost of doing business."
      *   **Where the Procedure Admits Defeat:** Step 5 (Scapegoating/Incentives). The checklist sees "Named Owner + Fund." It cannot see that the Owner is structurally motivated to *allow* the failure.
      *   **Auditor Action:** This is where you must override the checklist. Even if the boxes are ticked, if the *incentive structure* makes the accountable party a beneficiary of the risk, you must Refer to Panel. Mark this as **"Structural Conflict of Interest"** in the referral notes.

  ---

  ## PART 4: FINAL INSTRUCTIONS FOR THE AUDITOR

  1.  **Do Not Pretend Certainty:** When you initial a step, you are certifying that the *architecture of accountability* is present, not that the system is safe.
  2.  **The "Insufficient Data" Stamp:** If a vendor sends you a 200-page PDF without an index, do not hunt for the answer. Mark "Insufficient Data" and Refer. Opacity is a design flaw.
  3.  **The Ethics Panel Hand-off:** When referring a file, do not write "Unsafe." Write "Unanswerable." Specify which link in the chain (Traceability, Oversight, or Remediation) is broken.
  4.  **Your Own Accountability:** You are the final filter for procedural integrity. If you clear a file that later reveals a responsibility gap, your audit log will be reviewed. If you skipped the Values Call in Step 4 because "the box was checked," you are liable.

  **End of Procedure.**
