      *   **The Invariant:** The number of I's (in the original) or E's (in this variant) determines solvability.
      *   *Original GEB:* Start MI, Target MU. Rules involve I and U. The invariant is the number of I's modulo 3.
      *   *This Variant:* Start ME, Target MU. Rules involve E and U.
          *   Rule 1: End E $\to$ EU. (Adds 1 E? No, adds U. Wait, let's check the prompt's rules carefully).
