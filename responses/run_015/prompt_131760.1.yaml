      *   *Section 3: The Malicious Pleasure Test.* Apply schadenfreude.
          *   Phenomenal: If it feels good, it's pleasure. But does it feel the *same*? If the "glow" is neutral, it works. If the "glow" implies "goodness," it smuggles morals.
          *   Functional: If it reinforces behavior, it's pleasure. Easy fit, but risks including addictions/compulsions.
      *   *Section 4: The Verdict.* Which solves heterogeneity? Functional wins on grouping, Phenomenal wins on intuition.
