      *   *Clarification on Moral Smuggling:* If I define pleasure as "what we *ought* to seek," I've smuggled morals. If I define it as "what we *do* seek" (Functional), I haven't. If I define it as "a specific feeling" (Phenomenal), I haven't.
      *   *Schadenfreude:* The issue is whether schadenfreude *is* pleasure. If the Phenomenal view says "No, because it lacks the 'good' glow," it's smuggling. If it says "Yes, it has the glow," it works.
