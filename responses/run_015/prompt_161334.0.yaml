      *Refining the (2)/(3) vs (7) tension:* (2) explains the *Omissive* ($p \land \neg Kp$). (3) extends it to *Commissive* ($p \land \neg Bp$). (7) discusses *Moorean-adjacent* sentences and *order*. (7) might be targeting a broader class than just the canonical Moorean. But the user says "Some Moorean-adjacent sentences...". If the canonical Moorean is the target, (2)/(3) say it's always bad. (7) says order matters. If order matters, the static norm (KNA) which applies to the content regardless of order is insufficient to explain the *degree* of oddity.
