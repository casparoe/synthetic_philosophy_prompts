      *   Verdict on the Conclusion.

      *(Wait, one more check)*: Does Walzer say unjust combatants are *never* morally worse off? He says they have the *same rights* under the convention. But morally? He suggests they might be doing wrong, but we excuse them. The colleague says "never morally worse off." That's a strong metaphysical claim Walzer might shy away from. Walzer is more interested in the *rules of war* than ultimate moral accounting, though he does engage in moral accounting. I should clarify this tension.

