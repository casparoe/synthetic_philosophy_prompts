prompt: |-
  Hey — I host a podcast on science and ideas (mostly decision science and behavioural stuff; my last two eps were on Newcomb's paradox and on why people abandon New Year's resolutions), and on Thursday I'm recording with a philosopher I'll call Dr. Vance, who defends a bootstrapping solution to Kavka's toxin puzzle. Quick recap of the case so you have it: an eccentric billionaire puts a vial in front of you that will make you painfully sick for a day and do nothing worse; you get a million dollars tomorrow morning if at midnight tonight you intend to drink it tomorrow afternoon, and you never actually have to drink it — the money is already in your account hours before drinking time arrives. Dr. Vance's line, as she gave it to me on a pre-call, is that you really can form the intention, because forming it is what creates the reason: once you've sincerely committed, the rational thing tomorrow is the thing compatible with that commitment, so you drink, and the billionaire wasn't paying for a fake intention at all. Her all-purpose deflection is 'you're asking in the wrong direction — the reason is downstream of the intention', which she used on me three times in twenty minutes, and when people say they simply can't form such an intention she says 'that's a psychological limitation, not a normative one'. I want that escape route closed off too.

  So: give me eight to ten interview questions that go past having her restate the view — I already have that on tape. I need at least one that goes at the bootstrapping itself: if intending can manufacture its own reason, why can't I bootstrap a convenient intention to believe something, or an intention-to-intend that stops one level short, and if she says there's a principled difference I want the follow-up ready for her most likely answer. I need at least one on whether the state she's describing is really an intention or just a commitment device in costume — is the only way to pull this off to tie yourself to the mast (sign something, tell everyone, pre-pay a penalty, delete the escape routes), and if so has she quietly changed the subject from intending to self-manipulation? Her predictable move is that the device is evidence of the intention rather than a substitute for it, so give me the follow-up that makes that uncomfortable. I also invented three variants that no one has put to her on air and I want her to handle them: the weekly toxin, same offer every week for a year, where building a reputation for following through now gives you a real reason (does her solution get easy in a way that feels like cheating?); the amnesiac toxin, where after midnight you're given something that wipes the memory of having formed the intention, so there's no downstream reason and no device available — was the intention at midnight still real?; and the scanner toxin, where the billionaire reads the intention off a brain scan, so self-deception and commitment devices both fail. My producer also thinks the whole thing is just Newcomb's paradox in a lab coat and she's half right, so I want one question that lets Dr. Vance draw the line cleanly without letting her sneer at the comparison.

  End the list with a question about what would count against her: is there anything in the ordinary human case — people who sincerely plan to go to the gym on Monday while knowing, at the moment of planning, that they won't go — that embarrasses the view, or is it compatible with every way that could turn out? Practical stuff: it's a 40-minute episode for smart listeners who've never heard of Kavka, so keep each question short enough to say out loud and free of jargon she'd have to stop and define; under each one put a single line with her most likely answer and then the follow-up that answer invites, and make the sequence steadily harder to answer with the downstream slogan. Sorry for typos, I'm typing this on my phone between two other interviews and teh autocorrect is definately not helping.
