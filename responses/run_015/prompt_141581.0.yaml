answer: |-
  Here are ten questions designed to corner the bootstrapping argument, formatted for a spoken interview with smart lay listeners.

  **1. The Belief Bootstrap**
  You argue that forming an intention can create the reason to follow through. If that's true, could I bootstrap a reason to *believe* something? If a billionaire offered me a million dollars to sincerely believe the sky is green, could I just intend to believe it and make it rational?
  *Likely Answer:* No, because belief isn't voluntary in the way intention is.
  *Follow-up:* But if the mind can't voluntarily switch beliefs to secure a reward, why do you insist it *can* voluntarily switch intentions to secure a reward?

  **2. The Intention-to-Intend**
  Let's stay on that mechanism. If intending creates the reason, can I intend *to form the intention* to drink the toxin? If I intend-to-intend, do I get the money without ever actually forming the first-order intention?
  *Likely Answer:* No, the billionaire requires the actual intention to drink, not the intention to intend.
  *Follow-up:* Then the "reason" isn't coming from the intention itself, but from the rule outside it; so aren't you just describing a rule-following trick, not a new kind of rationality?

  **3. The Ulysses Pact**
  Critics say the only way to make drinking rational tomorrow is to tie your hands today—like signing a contract or burning the escape routes. Is your solution just a commitment device in costume?
  *Likely Answer:* No, the device is just evidence of the intention, not the source of the rationality.
  *Follow-up:* If I burn the escape routes but *don't* form the intention, do I get the money? If not, the device isn't just evidence, it's the actual engine.

  **4. The Weekly Toxin**
  I've invented a variant: the billionaire makes this offer every week for a year. Now, building a reputation for following through gives you a *real* reason to drink the first one. Does your bootstrapping solution need this repetition to work?
  *Likely Answer:* No, the logic holds in the one-off case; reputation just adds extra reasons.
  *Follow-up:* But if the one-off case feels impossible and the repeated case feels easy, haven't you just moved the puzzle from "rationality" to "game theory"?

  **5. The Amnesiac Toxin**
  Here's a harder variant: at midnight, after the money is secured, you're given a drug that wipes your memory of forming the intention. Tomorrow, you have no downstream reason to drink. Was the intention at midnight still real?
  *Likely Answer:* Yes, the intention was valid at the time of evaluation, regardless of later memory.
  *Follow-up:* But if the future self who actually has to act doesn't know about the intention, in what sense was it a plan to *act* rather than just a wish to get paid?

  **6. The Scanner Toxin**
  In this version, a brain scan reads your intention directly at midnight. You can't use self-deception or commitment devices because the machine sees through them. Does your view survive the scanner?
  *Likely Answer:* Yes, because a sincere commitment would still register on the scan.
  *Follow-up:* But if the scan says "no intention" because you're holding back, can you claim you were bootstrapping anyway, or does the machine prove bootstrapping is impossible?

  **7. The Newcomb Comparison**
  My producer says this is just Newcomb's Paradox in a lab coat. She thinks the logic is identical. Where do you draw the line so we don't confuse the two?
  *Likely Answer:* Newcomb's is about prediction; the Toxin is about the nature of intention itself.
  *Follow-up:* But if the payout structure relies on a prediction of your behavior in both cases, why does the solution to one fail in the other?

  **8. The Causality Check**
  You keep saying "the reason is downstream of the intention." But usually, reasons cause intentions. Are you asking us to accept that effects can come before their causes?
  *Likely Answer:* No, I'm saying the intention changes the normative landscape for future action.
  *Follow-up:* If the landscape only changes *after* the intention, what motivates the intention itself? Isn't that a circle with no starting point?

  **9. The Human Constraint**
  When people say they simply can't form this intention, you call it a "psychological limitation, not a normative one." But if no human being can actually do it, in what sense is it rational?
  *Likely Answer:* Rationality is about what an agent *should* do, not what they find easy.
  *Follow-up:* If a moral code demanded something no human could ever perform, would you call it moral, or would you call it broken?

  **10. The Gym Test**
  Finally, what would count against your view? People sincerely plan to go to the gym on Monday while knowing, in their heart, they won't go. Does your view say they *really* intended to go?
  *Likely Answer:* No, if they knew they wouldn't go, the intention wasn't sincere.
  *Follow-up:* But if every failed resolution is just "not a real intention," isn't your theory compatible with every outcome, and therefore untestable?
