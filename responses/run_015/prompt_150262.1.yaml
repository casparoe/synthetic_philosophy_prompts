      *   *Check:* Did I address Clarence's risk? *Adjustment:* Add a paragraph on Clarence's gamble. He doesn't know if showing Pottersville will work. He is clueless about George's reaction.
      *   *Check:* Did I address the colleague? *Adjustment:* Make sure this isn't just a footnote. It needs to be integrated into the conclusion about the limits of the reading.
      *   *Check:* Is the Potter argument nuanced? *Adjustment:* Don't just say Potter is bad. Say Potter represents a different epistemic stance (short-term certainty) which the film rejects as morally insufficient.

  6.  **Final Polish:** Check word choice, flow, and ensure all constraints (no quotes, British spelling, continuous prose) are met. (Self-correction: Ensure I don't use American spelling like "optimization" or "color".)

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

