      *   **Film:** *It's a Wonderful Life* (Frank Capra).
      *   **Philosophical Problem:** The "Cluelessness Objection" to Consequentialism (we can't know downstream consequences).
      *   **Core Thesis:** The film visualizes the invisible consequences (Pottersville sequence) but then withdraws that view, engaging with the problem in a way journal literature cannot.
      *   **Specific Distinctions to Address:**
          1.  *Sign-cluelessness* (positive/negative?) vs. *Magnitude-cluelessness* (how big?).
          2.  *Total-effects comparison* (Angel's view) vs. *Contrastive comparison* (Agent's available alternatives).
          3.  *Counterfactual Completeness* (Film gives one closed branch vs. Reality's open branching).
      *   **Specific Pushbacks/Complications to Address:**
          1.  *Mr. Potter:* Is his short-sighted optimization actually better epistemically than George's blindness?
          2.  *The Ending:* Does the town's rescue vindicate local action or concede the need for visible payoffs?
          3.  *The Moral:* Is "having friends" an abandonment of consequentialism for an internal good?
          4.  *Film Studies Colleague's Objection:* Does this reading strip the sentimentality/melodrama?
      *   **Deliverables:**
          *   Close reading (scene by scene).
          *   Engagement with the three distinctions.
          *   Engagement with the pushbacks.
          *   Recommendation of 2-3 specific scenes for class.
          *   Honest statement of where the reading fails.
          *   **Style:** Continuous prose, lecture-ready, British English, no citations/bibliographies/verbatim quotes.

  2.  **Deconstruct the Philosophical Argument:**

      *   *The Cluelessness Objection:* Consequentialism demands we maximize good. But causal chains are infinite and chaotic. We don't know if saving a child leads to a tyrant or a saint. Therefore, consequentialism is action-guidingly useless.
      *   *The Film's Intervention:* Clarence (the angel) shows George the world *without* him. This collapses the causal chain into a narrative. It makes the invisible visible.
      *   *Distinction 1 (Sign vs. Magnitude):* In Pottersville, George sees the *magnitude* of his impact (the whole town is different). But does he know the *sign*? Pottersville is worse, so the sign of his actual life is positive. However, this is a "world without" comparison, not an "act vs. alternative" comparison.
      *   *Distinction 2 (Total vs. Contrastive):* Consequentialism usually asks "Which act should I do now?" (Contrastive). Clarence shows "What if you didn't exist?" (Total/Existential). This is a category error in ethical terms but emotionally potent.
      *   *Distinction 3 (Counterfactual Completeness):* The film presents a deterministic alternate timeline. Reality is probabilistic and branching. The film cheats by making the counterfactual stable and legible.
      *   *Clarence's Risk:* Clarence intervenes to save George. He doesn't know for sure George will wish to live again. This mirrors the cluelessness problem *for the angel*.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the colleague's worry (sentimentality vs. philosophy) but argue that the film *uses* sentiment to solve an epistemic problem.
      *   **Scene 1: The Pond & Gower (Early Impacts):** Discuss the frozen pond (saving Harry) and the pharmacy error (saving the town from poison). These are clear causal chains. They look like standard consequentialism. But note: George didn't know the full extent then.
      *   **Scene 2: The Run on the Building & Loan:** George uses honeymoon money to stop a panic. Immediate consequence: solvency. Long-term consequence: working-class home ownership vs. Potter's slums. This bridges the local and the systemic.
      *   **Scene 3: The Bridge & Pottersville (The Core):** This is the meat of the cluelessness argument. George wishes he wasn't born. Clarence shows him Pottersville.
          *   *Address Distinction 1:* We see magnitude (whole town changed). We see sign (Pottersville is bad, so George is good).
          *   *Address Distinction 2:* This isn't "Act A vs Act B". It's "Existence vs Non-existence". It bypasses the contrastive requirement of consequentialism.
          *   *Address Distinction 3:* The counterfactual is too neat. Pottersville is a coherent narrative, not a chaotic mess.
      *   **Scene 4: Potter & The Ending:**
          *   *Potter:* He knows the consequences of his loans (foreclosure, profit). He has epistemic clarity but moral bankruptcy. George has moral clarity but epistemic blindness. The film argues moral clarity matters more, or that George's "blind" trust creates better outcomes than Potter's "sighted" greed.
          *   *The Ending:* The town saves George. Is this a visible payoff? Yes. Does it vindicate localism? Perhaps. It suggests that while *downstream* consequences are unknowable, *immediate* communal bonds are knowable and valuable.
          *   *The Moral:* "No man is a failure who has friends." This shifts from consequentialist value (outcomes) to relational value (intrinsic worth). It might be an abandonment of strict consequentialism.
      *   **Colleague's Objection:** Acknowledge she is partly right. Reducing it to epistemology kills the joy. But the joy *depends* on the epistemic relief. We feel relief *because* we were anxious about the unknown.
      *   **Recommendations:** Select the Pharmacy scene (causal chain), Pottersville (magnitude/sign), and the Final Collection (local vs. global).
      *   **Where it Fails:** Admit the film is about existential despair, not just ethical calculation. The "world without" is a fantasy of control, not a rigorous ethical test.

  4.  **Refining the Tone:**

      *   Must be British English (optimise, programme, colour, etc.).
      *   Lecture-ready flow (transitions, rhetorical questions, summarizing points).
      *   No citations or quotes.
