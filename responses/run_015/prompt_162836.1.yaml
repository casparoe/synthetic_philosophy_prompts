  *   **Question:** Is there a minimum neural complexity required for valenced states, and does it fall below the arthropod/nematode threshold?
  *   **Concrete Test:** Comparative ablation study. Identify a specific neural cluster hypothesized to integrate nociception with motivational state in *Drosophila*. Ablate homologous structures in a nematode and a springtail. Measure avoidance learning retention.
