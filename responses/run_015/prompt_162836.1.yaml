  ### NOTE TO THE NOVELIST

  You asked for the seams to be visible. Here is where the document above is lying to you, or at least smoothing over the fractures so the characters can sign it without bleeding.

  **1. The "Agreed" Arithmetic is a Trap.**
  In Section 1, Proposition 1, they agree the algebra is valid. This is the biggest concession Corves (the Skeptic) makes, and she likely only signed it to get Thorne to agree to the Feedback Asymmetry (Prop 4). In reality, a true epistemic skeptic might reject Expected Value Theory entirely in this domain, arguing that "infinity times uncertainty" is not a number but a category error. By letting them agree on the math, I've made Corves more pragmatic than a hard-line skeptic might be. If you want her sharper, have her initial draft reject the formula itself, forcing Thorne to negotiate her down to merely rejecting the *inputs*.

  **2. The "Neutral Phrasing" Conceals Power.**
  In the Disagreement Table, the "Neutral Phrasing" column does heavy lifting. It makes their conflict sound like a semantic puzzle ("Status of P(Sentience)") rather than a resource war. Thorne wants the Institute's money; Corves wants to protect the Institute's reputation from looking absurd. The document frames this as an intellectual dispute about *taxa*, but the subtext is about *budget*. You might want to hint in the scene that the "Actionability" argument is actually Corves saying, "If we can't measure it, we can't defend the grant."

  **3. Crux C is the Weakest Link.**
  The "Unit of Account" crux relies on human preference elicitation as a proxy for arthropod moral weight. Both characters should know this is methodologically shaky. I included it because they need a crux that *looks* resolvable to keep the collaboration alive. In reality, this is likely an unresolvable metaphysical clash. Thorne is a hedonistic utilitarian (seconds of pain matter); Corves is likely a capabilities theorist or narrative theorist (a life's structure matters). No silo trial will fix that. If you want the tension to linger, emphasize that they both know this test won't actually change their minds, but they need to write it down to show progress to the director.

  **4. Where I Might Have Failed Corves.**
  I suspect I made Corves too reasonable. A true skeptic of the Scale Argument often finds the *coupling* argument (Point 2 in Agreements) terrifying. If Thorne convinces her that mites feel pain, she shouldn't just say "that makes intervention hard." She should say "that makes existence a horror show we cannot fix." I softened her reaction to keep the document professional. If you want more drama, her resistance to the "Evidentiary Coupling" agreement should be palpable—she signs it because the neuroanatomy is undeniable, not because she likes the implication.

  **5. The "Single Consideration" Falsifiers.**
  I tried to make these spoken aloud ("If you show me..."). Notice they are all empirical. This biases the document toward a scientific resolution. The real blockage is likely ethical: Thorne would act even if the falsifier triggered; Corves would stop even if her falsifier failed. The document pretends evidence drives the train. In your scene, consider having one of them realize, halfway through writing the "Falsifier" section, that they wouldn't actually change their behavior even if the evidence came in. That moment of honesty would break the document's polish in a very human way.

  Use the document as a prop that *almost* works. It should feel like a ceasefire treaty written in a language both sides speak, but with the landmines still buried in the definitions.
