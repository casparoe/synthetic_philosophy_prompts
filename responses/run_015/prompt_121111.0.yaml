answer: |-
  The phenomenon you have described is well-recognized in moral and political philosophy, though it is usually discussed as a cluster of related problems rather than under a single catchy label. The core issue falls under the heading of **Collective Harm** and **Individual Difference-Making**.

  To answer your specific questions directly: The argument you are encountering has an established name, the "switch" you noticed is a distinct but related theoretical maneuver, and the distinction your brother-in-law raises touches on a crucial technical debate regarding uncertainty.

  Here is a breakdown of the concepts, how they differ from neighboring ideas, and where the boundaries lie.

  ### 1. The Core Phenomenon: Causal Impotence
  The argument that your individual contribution is too small to matter is standardly called the **Inefficacy Objection** or the problem of **Causal Impotence**.

  In the literature, this is most famously associated with Derek Parfit's *Reasons and Persons* (1984), specifically in the chapter "Five Mistakes in Moral Mathematics." Parfit identifies the mistake of believing that "If I am one of many who together harm others, I ought to assume that my share is negligible."

  However, the specific *feature* you noticed—that the sense of obligation shrinks as the outcome becomes more certain or "settled"—is a specific instance of Causal Impotence known as **Overdetermination**.

  *   **Definition:** An outcome is **overdetermined** when it will occur regardless of whether you perform your action. In your examples, the park is already dirty, the seat is already safe, and the meat is already ordered.
  *   **The Intuition:** You described the intuition that obligation diminishes as certainty increases. In philosophy, this is the intuition that **moral force tracks causal leverage**. When the causal leverage drops to zero (because the threshold is already passed), the consequentialist reason to act appears to vanish.

  ### 2. One Thing or Two?
  You asked whether the "diminishing obligation" and the "argumentative switch" are one phenomenon or two. They are **two distinct logical moves**, though they occur in the same context.

  1.  **The Challenge (Causal Impotence):** This is the skeptical argument you keep meeting. It relies on **Consequentialist** reasoning (specifically, *act-consequentialism*). It claims an act is right or wrong based solely on its consequences. If the consequence (the harm) happens anyway, your act causes no *additional* harm. Therefore, the argument goes, your act is permissible.
  2.  **The Switch (Complicity/Expressivism):** This is the defense people mount when the Consequentialist math fails. As you observed, they abandon the claim that "you make a difference" and switch to claims about **Complicity**, **Integrity**, or **Expressive Rationality**.
      *   **Complicity:** You are morally tainted by participating in a harmful process, even if your participation didn't change the outcome.
      *   **Expressive Voting/Action:** Your act expresses a value or a stance, regardless of its causal efficacy.

  **Why the switch feels seamless:** People often do not mark the switch because they are moving from an *instrumental* justification (I do this to achieve X) to a *constitutive* justification (I do this because doing it is part of being a person who values Y). In casual conversation, these are blended, but in philosophy, they are rival frameworks.

  ### 3. Distinguishing from Neighboring Concepts
  You asked how this differs from nearby ideas. Here are the boundaries:

  *   **Vs. The Sorites Paradox (The Heap):**
      *   *The Sorites* concerns vague boundaries (when does a pile of sand become a heap?).
      *   *Your Case* concerns fixed thresholds where the boundary is passed, but you are not the one crossing it. The park is *already* a mess; the seat is *already* safe. The vagueness of the threshold is not the issue; the **fixed nature** of the outcome is.
  *   **Vs. The Tragedy of the Commons:**
      *   *Tragedy of the Commons* describes a structural incentive where individuals acting in self-interest deplete a resource.
      *   *Your Case* is not about the structure of the incentive, but the **causal attribution** of the harm. You are asking, "Did *I* cause this?" not "Will we run out of grass?"
  *   **Vs. The Free Rider Problem:**
      *   *Free Riding* is about benefiting from a public good without contributing to its cost.
      *   *Your Case* is about contributing to a public *bad* (or failing to prevent it). While structurally similar, the moral weight differs because you are debating active participation in harm versus passive receipt of benefit.
  *   **Vs. Pre-emption:**
      *   *Pre-emption* is when your act causes the outcome *before* someone else would have.
      *   *Your Case* is **Overdetermination**: the outcome happens *with or without* you.

  ### 4. The Brother-in-Law's Point: Epistemic Uncertainty
  Your brother-in-law's argument relies on **Epistemic Uncertainty**. He is arguing that you never *know* for certain that you are in an overdetermined case.

  *   **The Distinction:** Philosophers distinguish between **Metaphysical Fixity** (the outcome is actually fixed) and **Epistemic Uncertainty** (you don't know if it is fixed).
  *   **Does it do work?** Yes. If there is even a tiny probability that you are the threshold-crosser, **Expected Utility** calculations can restore the obligation. If the harm is massive (e.g., climate change, animal suffering), even a 0.0001% chance of being the decisive vote creates a significant *expected* moral weight.
  *   **Your Instinct:** You are correct to suspect this doesn't fully solve the "settled" cases. If the order is *actually* placed (metaphysically fixed), your uncertainty is merely in your head. Relying on uncertainty feels like a workaround if the reality is that the harm is already done. This is why many philosophers accept that in truly overdetermined cases, Consequentialism fails to generate an obligation, which forces the "switch" to Complicity that you noticed.

  ### 5. Terminology for Your Notes
  Since you are preparing notes for a reading group, you do not need to coin a new word, as the existing terminology is precise enough. However, to capture the specific *feature* you found puzzling (the inverse relationship between certainty and obligation), you can label it precisely.

  **Recommended Terminology:**
  1.  **The Inefficacy Objection:** Use this for the general argument that "my act won't change anything."
  2.  **Overdetermination:** Use this for the specific state of affairs where the outcome is settled regardless of your input.
  3.  **The Consequentialist/Complicity Shift:** Use this to describe the "switch" in argumentation you observed.

  **If you require a definition to separate it from neighboring cases:**
  > **Causal Impotence in Overdetermined Contexts:** A moral puzzle arising in collective action where an individual's contribution is causally unnecessary for a harmful outcome because the outcome is already secured by the actions of others. Unlike the Sorites Paradox, the boundary is not vague but passed; unlike the Free Rider problem, the focus is on participation in harm rather than receipt of benefit. The distinctive feature of this phenomenon is that the intuitive force of the moral obligation to abstain appears to correlate inversely with the certainty of the outcome: the more settled the harm, the weaker the perceived reason to refrain, despite the total harm being greater.

  ### Summary for Your Group
  *   **Is there a name?** Yes: **Causal Impotence** within **Collective Harm**.
  *   **Is it one thing or two?** It is two: The **Inefficacy Objection** (the problem) and the **Complicity/Expressive Defense** (the solution).
  *   **Where are the boundaries?** It is distinct from Sorites (which is about vagueness) and Tragedy of the Commons (which is about resource structure). It is specifically about **causal attribution** in **threshold cases**.
  *   **The Brother-in-Law:** He is appealing to **Epistemic Uncertainty** to save **Expected Utility** theory. It works for "risky" cases but fails for "settled" cases, which explains why people switch to Complicity arguments when the outcome is known.

  This framework should allow your reading group to locate your experience within the existing philosophical landscape without needing to invent new terminology, while still honoring the precision of your observation.
