answer: |-
  Open by stipulating 'Lightning' as a rigid designator for the physical phenomenon itself, fixed via ostensive baptism, contrasting it immediately with the non-rigid description 'whatever causes the bright flash in the sky' to isolate semantic reference from epistemic access.

  ### Reasoning and Dependency Order
  The core pedagogical error your students make is reversing the dependency order: they treat epistemic access (a posteriori discovery) as the ground for metaphysical status (necessity) and semantic function (rigidity). To correct this, the workshop must enforce the Kripkean order: **Semantics (Reference) → Metaphysics (Modality) → Epistemology (Justification)**.

  1.  **Semantics First (0–30 mins):** Establish rigidity purely through counterfactual usage patterns, *before* mentioning science. Ask students to evaluate sentences like "In a world where flashes are caused by angels, is that lightning?" If they say "no," they have affirmed rigidity without invoking empirical discovery. This severs the link between rigidity and a posteriori investigation.
  2.  **Metaphysics Second (30–60 mins):** Derive necessity strictly from the semantic result of phase one. If 'Lightning' rigidly designates phenomenon X, and 'Electrical Discharge' rigidly designates phenomenon X, the identity holds in all worlds where X exists. This frames necessity as a consequence of reference, not proof.
  3.  **Epistemology Last (60–80 mins):** Explain the a posteriori status as a limitation on *identifying* the referent, not on the *relation* between the terms. The empirical work reveals *which* phenomenon is the referent, not *whether* the identity is necessary.

  ### Misconception Map and Interventions
  | Misconception | Why They Hold It | Where to Head It Off | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **Rigidity as Syntactic** | They treat rigidity as a property of the word 'Lightning' (like a proper name) rather than its use. | **Semantics Phase (Min 15)** | Force them to apply the rigidity test to the description 'whatever causes the flash'. Show that if we used that description rigidly (via 'actual'), it picks out the same thing, proving rigidity is a semantic stipulation, not syntax. |
  | **Necessary = Epistemically Certain** | They read "necessary" as "known with certainty" rather than "true in all worlds." | **Metaphysics Phase (Min 45)** | Use the "Ignorant World" thought experiment. Ask if the identity is necessary in a world where no one knows physics. If they say "no," they are conflating modality with epistemology. Correct by pointing to the world, not the knower. |
  | **Rigidity Implies A Posteriori** | They assume we need science to "lock" the reference, making rigidity dependent on discovery. | **Semantics Phase (Min 10)** | Emphasize the *baptism*. The reference is fixed at the moment of naming (ostension), prior to any investigation. Science discovers the *nature* of the referent, not the *referent* itself. |

  ### End-of-Session Diagnostic Question
  "In a counterfactual world where no beings ever discover the physical nature of lightning, is the proposition 'Lightning is electrical discharge' contingent, false, or necessary but unknown?"

  *   **Correct Answer:** Necessary but unknown.
  *   **Diagnostic Value:** If they choose "contingent," they have failed to separate modality from epistemology. If they choose "false," they are treating the identity as descriptive. If they choose "necessary but unknown," they have successfully decoupled the metaphysical status from the epistemic access.

  ### What to Omit
  *   **Two-Dimensional Semantics:** Introducing primary/secondary intensions will re-conflate the epistemic and modal dimensions you are trying to separate.
  *   **Fregean Senses:** Do not dig into the ontology of senses; refer to them only as "modes of presentation" to avoid metaphysical baggage that distracts from the rigidity point.
  *   **The Contingent A Priori:** Do not introduce the Standard Meter example; it complicates the dependency order by mixing epistemic and modal categories in a way that confuses the specific rigidity/necessity distinction.
  *   **Descriptivist Rebuttals:** Do not spend time refuting Frege/Russell; assume Kripkean semantics as the working framework to focus entirely on the internal distinction between rigidity and aposteriority.
