      *   *Claim 2 (Emotions need real objects):* This is the "Cognitive Theory of Emotions" premise. Radford argues that if we believe X doesn't exist, we can't fear/be sad about X. But we do. So we are irrational. He doesn't necessarily say the feelings are *fake*, but that the *state of mind* is incoherent.
