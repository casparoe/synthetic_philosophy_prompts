  9.  **Constructing the Output:** (Drafting the response following the structure: Diagnosis, The Agenda, The Cuts, The Payoff). *Self-Correction during drafting:* Make sure I explicitly answer the "what would change the ranking" part of the prompt.

      *(Self-Correction on the "Calibration Panels" idea)*: The user invented this. I should validate it but explain why it might not be the *lead*. It's a specific mechanism, not a structural critique. I'll suggest using it as an example within the AI/Consistency section rather than a standalone pillar.

      *(Refining the AI section)*: Don't just say "AI is biased." Say "AI optimizes for predictability, which is not the same as moral correctness." That's the journalistic hook.

      *(Refining the Conclusion)*: The reader should walk away understanding that *incomparability* is a feature, not a bug, if managed correctly.

  10. **Final Polish:** Check tone. Ensure it sounds like an editor talking to a writer, not a professor talking to a student. (Proceed to generate output).

