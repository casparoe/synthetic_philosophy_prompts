      *   **Task:** Prioritize open questions, explain *why* (upstream/downstream, tractability, rabbit holes), evaluate the user's existing ideas, and provide a defended agenda (2-3 threads).
      *   **Tone:** Intellectual, blunt, practical for a journalist, avoiding academic name-dropping.

  2.  **Evaluate the User's Existing Ideas:**
      *   *"We're already doing it" (QALYs):* Strong. It grounds the abstract in the concrete. It shifts the debate from "can we?" to "how are we failing?" Good hook.
      *   *Calibration Regress:* Philosophically deep, but risky for 4,000 words. Could become navel-gazing. Needs to be tied to a specific practical failure to work.
      *   *Deliberative Calibration Panels:* Interesting, but feels like a solution in search of a problem. Might be too niche/technical. Risk of "moving arbitrariness."
      *   *Latent-Scale Models (AI):* Very timely. High risk of "tech solutionism" hype, but high reward if critiqued well. Connects consistency vs. truth.
      *   *Partial Comparability:* Philosophically honest, but practically paralyzing. Hard to write a satisfying ending on "sometimes we can't know."
      *   *Overratedness Checks:*
          *   *Hard-line Skepticism:* Often oversold. Policymakers ignore it. Better to treat it as a boundary condition than the main event.
          *   *Utility Monster:* Classroom toy. Cut it.
          *   *Impartial Spectator:* Still load-bearing but often implicit. Needs to be made explicit in the context of AI/Algorithms.

  3.  **Determine the Core Tension:**
      *   The central tension isn't *whether* we compare (we do), but *what kind of error* we are willing to tolerate.
      *   Error Type 1: False Precision (claiming comparability where none exists, leading to unjust allocation).
      *   Error Type 2: Paralysis (refusing to compare, leading to status quo bias or arbitrary discretion).
      *   The AI angle adds a new layer: *Algorithmic Consistency* masquerading as *Moral Truth*.

  4.  **Drafting the Agenda (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Start with QALYs. Then talk about AI. Then conclude with Partial Comparability.
      *   *Critique 1:* Too linear. Doesn't create a new mental model for the reader.
