  "An individual ant tried to file a tax return claiming 'existential dread' as a deduction. The IRS rejected it, saying, 'Sorry, you're not a taxpayer, you're just a neurotransmitter with legs. The *colony* gets the deduction.'"

  *   **Philosophical Feature:** This leans on the **asymmetry of ascription** (a). It highlights the view that while the colony possesses high-level mental states (like dread or tax liability), the individual ants are merely functional components (signals) without independent psychological status.
  *   **Prerequisites:** The hearer must understand the core Hofstadter claim that ants are analogous to neurons or symbols, not agents. If they think the ants have their own minds, the IRS's reasoning looks like unjust discrimination rather than a category mistake.

  **Joke 2: The Will Reading**
  "At the reading of Aunt Hillary's will, both fissioned halves arrived claiming to be the original. The lawyer rubbed his temples and said, 'Okay, but if you're both the same person, I assume you've already agreed on who's keeping the apartment, since one person can't live in two places at once.'"

  *   **Philosophical Feature:** This targets the **granularity and fission problem** (b). It exposes the tension between psychological continuity (both halves feel like Hillary) and physical divergence (they are now two distinct spatial entities), forcing a clash between metaphysical identity and legal pragmatism.
  *   **Prerequisites:** The hearer needs to know the fission scenario where the colony splits into two viable halves. Without that, the image of two entities claiming one identity makes no sense; with it, the lawyer's practical objection underscores the absurdity of the "one person" verdict.

  **Joke 3: The Capgras Diagnosis**
  "The queen's been dead for three weeks, but the colony is running perfectly. We have two incompatible candidates for what Aunt Hillary believes, and no ant-level fact to settle it. It's the only mind where you can be objectively wrong about your own thoughts, because the thing thinking them is also the thing lying about them."

  *   **Philosophical Feature:** This squeezes the **Colony-level Capgras** wrinkle (c). It illustrates the breakdown of supervenience where the functional output suggests one belief state while the structural reality (the dead queen) suggests another, with no lower-level fact to adjudicate.
  *   **Prerequisites:** The hearer must know the specific Capgras variant invented for your section (queen dead, colony functional). Without knowing there is no ant-level fact to settle the belief, the punchline about "lying about evidence" sounds like standard delusion rather than a structural paradox of the mind itself.
