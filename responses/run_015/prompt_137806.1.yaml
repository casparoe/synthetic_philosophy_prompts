answer: |-
  1. **Defeaters, Ranked**

      *   **Fatal (Reconstruction Completeness):** A fact obtains where every historical case you classify as "surplus" is successfully reconstructed as a valid argument using only premises the experimenter explicitly endorsed or could have derived without imaginative simulation. If historians demonstrate that the "tacit knowledge" invoked is merely formalizable background theory that was available but unorganized, the epistemic surplus vanishes. This has arguably happened for several celebrated mechanics cases.
      *   **Fatal (Idealization Disconnect):** A fact obtains where the inconsistency exposed relies entirely on idealizations (e.g., perfect rigidity, infinite speed) that the theory itself treats as limiting cases rather than physical realities. If the conflict disappears when the idealizations are relaxed to physical tolerances, the TE exposes a conflict in the *model stipulations*, not the theory's commitments to the actual world.
      *   **Serious (Verdict Instability):** A fact obtains where competent experts, fully grasping the setup and the theory, consistently diverge on the outcome of the same TE without empirical resolution. If "commitment-pull" yields contradictory vectors for the same input, the mechanism is unreliable as a knowledge source. This has occurred in early electrodynamics and relativistic rotation cases.
      *   **Awkward (Psychological Reduction):** A fact obtains where the "surplus" is shown to be purely cognitive efficiency (the TE makes a hard derivation easier to grasp) rather than epistemic access (the TE provides justification unavailable via derivation). If the only difference is speed or clarity of conviction, the claim to a distinct source of knowledge collapses into a claim about pedagogy.

  2. **Which Ones My Side Should Concede**

      *   **Concede:** Logical surplus is impossible. You already do this, but you must concede that if a reconstruction shows the conclusion follows from *explicit* premises via standard logic, that specific case loses surplus status. You cannot defend a case once the derivation is laid bare.
      *   **Concede:** Many celebrated TEs are recycling. If the outcome was known or strongly suspected via the theory prior to the imaginative act, it is not surplus. Your diagnostic must exclude cases where the verdict was antecedently probable.
      *   **Concede:** The "tacit knowledge" loophole is vulnerable. If "tacit knowledge" becomes a catch-all for "premises we haven't written down yet," the thesis is unfalsifiable. You must concede that there is a limit to how much tacit knowledge can be claimed before the agent is credited with knowing the conclusion already.
      *   **Strawmen:** Do not defend the claim that TEs bypass logic. Do not defend the claim that TEs provide empirical data independent of theory. These are not your position.
      *   **Non-Strawman:** The Reconstruction Completeness defeater is not a strawman. It is the primary rival. You must treat successful reconstructions as direct losses for the surplus thesis on those cases.

  3. **Four I Am Most Worried About**

      *   **(a) The Reconstruction Industry:** If historians produce derivations for 90% of your candidate cases, the thesis becomes a description of temporary ignorance rather than a distinct epistemic mechanism. The stopping point is principled only if you can specify *why* a premise was inaccessible *before* the TE. If your criterion is merely "nobody wrote it down yet," the surplus retreats with every historian's paper. The retreat itself is evidence that the surplus was merely logistical, not epistemic.
      *   **(b) The Idealization Artifact:** This sinks the majority of mechanics TEs. If the tied-stones argument relies on additive weight and independent fall speeds, but the theory actually implies interaction effects that vanish only in limits, the contradiction is in the simplified model, not the core theory. If the surplus depends on breaking the theory's own conditions of application (e.g., treating continuous media as discrete bodies), the lesson is about the model's breakdown, not the world's behavior. This survives only if you can show the inconsistency holds in the limit, not just at the idealization.
      *   **(c) Contested Verdicts:** This bears on reliability. If the mechanism is "commitment-pull," the pull should be uniform for competent users of the theory. Divergent verdicts suggest the "pull" is actually "intuition-push," where background assumptions vary between experts. To discriminate: If the disagreement resolves when the tacit premises are made explicit, it was a hidden premise variation (survivable). If the disagreement persists despite shared premises, the mechanism is broken (fatal).
      *   **(d) Reverse Calibration:** This collapses the thesis into heuristic guessing. If trust is assigned only because the verdict matched later experiment, the TE did not *produce* knowledge; it produced a guess that was validated. To avoid this, you must identify cases where the TE verdict was trusted *before* empirical check and where that trust was warranted by the reasoning alone. If no such cases exist, the surplus is ex post facto narration.

  4. **A Falsifiability Audit**

      *   **Prediction 1 (Practice):** The Surplus Thesis predicts that agents will report inability to derive the conclusion via formal means prior to the TE, even when prompted, whereas the Derivability Rival predicts they *could* have given sufficient time. You need records of failed derivation attempts prior to the TE.
      *   **Prediction 2 (History):** The Surplus Thesis predicts that theory change following a TE will specifically target the inconsistency exposed (resolving the conflict), whereas the Rival predicts theory change follows the logical consequence regardless of the imaginative route.
      *   **Insulation Check:** The move to "epistemic surplus" insulates the thesis from logical critique but exposes it to psychological and historical audit. It is a problem if "epistemic access" is defined solely by the agent's feeling of novelty. To avoid this, "access" must be cashed out as the inability to reconstruct the argument without the imaginative step. If you cannot specify the conditions under which a reconstruction *fails* to eliminate surplus, the thesis is protected by a meta-principle rather than evidence.

  5. **My Own Diagnostic on Trial**

      *   **The Risk:** The inconsistency-exposure criterion is vulnerable to gerrymandering if "inconsistency" is identified only by the fact that the agent changed their mind. If you classify the tied-stones case as inconsistency because it overturned a theory, and the frictionless bowl as application because it confirmed one, you are defining the mechanism by the outcome.
      *   **The Test:** Can you identify an inconsistency exposure that *failed* to overturn the theory? Or an application that *appeared* to expose an inconsistency but was resolved as a misunderstanding?
      *   **Non-Question-Begging Criterion:** You need an independent measure of "commitment." This requires formalizing the theory's commitments *prior* to the TE verdict. If the theory formally entails $P$ and $\neg P$ in the imagined case, it is inconsistency exposure. If it entails $P$ and the TE shows $P$, it is application. If you cannot formalize the commitments independently of the TE intuition, the diagnostic is circular.

  6. **What I Would Personally Find Most Persuasive**

      *   **The Reliability Link:** An argument showing that commitment-pull reliability correlates with the formalizability of the theory. If TEs are more reliable in domains where the theory's commitments can be partially formalized (constraining the imagination) versus domains where they are loose, this ties the mechanism to the theory structure, not just intuition.
      *   **The Counter-Example:** A case where a TE produced a confident, convergent, expert-stable verdict that was later overturned, where the error was not a false empirical premise.
          *   *Candidate Structure:* Imagine a thermodynamic cycle imagined to produce work from a single heat source. Experts agree via TE that it is impossible based on theoretical commitments. Later, a new theoretical framework shows the commitments were incomplete, not inconsistent.
          *   *Specific Failure:* If you can find a case where experts used a TE to reject a phenomenon (e.g., "this configuration cannot oscillate") based on theoretical inconsistency, but the phenomenon was later observed and the theory adjusted to allow it without inconsistency, this shows the TE exposed a limitation of the *old* theory's modeling, not a truth about the world. This supports the view that TEs test model coherence, not world facts directly.
          *   *Condition:* If such a case exists where the experts were not relying on a tacit empirical falsehood (like "friction is negligible"), but on a structural assumption (like "forces must be central"), and that assumption was later dropped, then the TE surplus was real but local to the theory, not global to the world. This saves S1 (epistemic surplus about theory) but modifies S2 (it tests model coherence, not world commitment).
