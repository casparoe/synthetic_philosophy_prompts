  2. Unlike an ordinary auxiliary hypothesis, which adds empirical content to preserve a core theory, this move alters the epistemic standards of the core method itself to excuse specific failures. It protects the methodology from risk rather than adjusting the theory to fit the evidence.
  3. This differs from simple special pleading because it relies on a structural analogy between domains rather than merely asserting an exception for a specific case without justification. The justification exists but is circular, claiming the method's validity in politics proves its validity in math despite mathematical failure.
  4. I propose the term "reciprocal methodological insulation" to describe this specific cross-domain protection where validity flows one way while risk is blocked the other. The boundary condition requires that errors in the foundational domain are redefined as intentional features to sustain the derived domain's authority.
  5. Ultimately, this structure prevents the political theory from being undermined by mathematical error while allowing the mathematics to claim political significance without rigorous proof. It creates a closed system where the success of the whole depends on the inability to test the parts independently.
