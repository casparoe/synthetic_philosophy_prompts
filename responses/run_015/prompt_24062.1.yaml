      5.  Framing advice for the story (Metaphors, Stakes, Questions to ask).
      6.  Conclusion.

  10. (Final thought): Ensure I emphasize that for an AI, "honesty" is a behavioral output, not an internal moral state. This is the crux of the philosophical distinction.

