answer: |-
  The Act passed in 2022 based on a 2021 review, not amended in 2021.

  **1. Mapping the State**
  Under functionalism, "pain" is not a specific feeling or brain structure, but a causal role defined by its relationships.
  *   **The State:** Nociceptive affect (the "unpleasantness" of damage, not just the detection of it).
  *   **Inputs:** Noxious stimuli (heat, pressure, acid) detected by peripheral sensors.
  *   **Internal Role:** The signal must integrate with motivational systems (hunger, fear), memory (learning to avoid), and decision-making (trade-offs between safety and food).
  *   **Outputs:** Protective behavior (guarding, rubbing), avoidance learning, and analgesic seeking (self-medicating).
  *   **Octopus Realization:** For the octopus to realize this state, it does not need C-fibers or a neocortex. It needs a distributed nervous system where arm sensors transmit data to central ganglia capable of modifying future behavior based on past damage. The LSE review found octopuses groom wounds and make trade-offs, satisfying the functional role despite the hardware difference.

  **2. MR Predictions vs. The Historical Fight**
  Multiple realizability (MR) predicts that anatomical differences are irrelevant if the functional role is preserved. The decades-long debate (fish pain, octopus sentience) was not a failure of MR, but a clash between MR and substrate chauvinism (the intuition that specific biology is necessary). The "no neocortex" objection assumes identity theory (state = brain structure), which MR explicitly rejects. The delay tells us MR is *normatively* useful—it correctly directs attention to behavior and integration rather than anatomy—but *psychologically* difficult for humans to accept. The theory isn't true by wording; it forces a shift in evidential standards that opponents resisted until behavioral data became undeniable.

  **3. The Grain Problem and Partial Realization**
  Your dial analogy is correct: this is the "level of abstraction" problem. Functionalism does not internally specify how coarse or fine the job description must be.
  *   **The Dial:** If defined too finely (specific vertebrate wiring), MR is false. If too coarsely (negative feedback), thermostats feel pain. Functionalism is silent on where to set this; it imports the setting from empirical psychology (psychofunctionalism).
  *   **Partial Realization:** Functionalism goes quiet here. It typically treats states as binary (the role is filled or it isn't). If an octopus has the discriminative role ("damage here") but lacks the full affective integration ("this is awful"), standard functionalism cannot say it feels "half pain." It must say it feels a *different* state or no pain state. This leaves the law's yes/no binary unsupported if nature offers a spectrum of realization.

  **4. The Evidential Blind Spot and the Legal "Cheat"**
  MR generates an evidential blind spot: if anatomy is irrelevant, you cannot look at brains; if behavior is distinct from experience (philosophical zombies), you cannot look solely at actions. This leaves no direct evidence for sentience. The lawmakers did "cheat," but formally: they adopted the **Precautionary Principle**. They acknowledged the evidential gap but decided that the risk of wrongly denying sentience outweighs the risk of wrongly granting it. They treated functional isomorphism as a sufficient proxy for phenomenology, effectively overriding the philosophical uncertainty with policy pragmatism.

  Multiple realizability justifies ignoring anatomical differences but cannot bridge the gap between functional behavior and subjective experience, forcing the law to substitute philosophical proof with pragmatic presumption.

  \answer{Philosophically permissive, evidentially incomplete}
