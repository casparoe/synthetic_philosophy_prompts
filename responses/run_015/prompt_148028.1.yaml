  2.  **Deconstruct the Disagreement:**
      *   **Side A (Moral Residue):** Believes the agent retains moral culpability/residue even if the act was politically necessary/justified. This aligns with Walzerian views (doing wrong to do right). The stain is ontological/normative.
      *   **Side B (Psychological/Collective Blame):** Believes the stain is merely psychological. If the act is authorised by the democratic collective, the blame transfers. The individual shouldn't feel guilty because they aren't morally responsible. This aligns with a more utilitarian or delegate model of representation.
      *   **The Conflict:** It's not just about delegation; it's about the *nature* of moral agency in a representative system. Side A thinks moral agency is non-transferable (you pull the trigger, you bear the sin). Side B thinks political agency is fungible/transferable (you act as an instrument of the will).
      *   **The "Talking Past" Element:** Side A is discussing *moral metaphysics* (what happens to the soul/conscience of the agent). Side B is discussing *political legitimacy* (where does the justification lie?).
      *   **Diagnosis:** They are answering different questions under one heading. One is about individual moral integrity (virtue ethics/deontology), the other about institutional legitimacy and blame allocation (political liberalism/utilitarianism).

  3.  **Formulate the Bottom Line:**
      *   Need a concise statement summarizing the diagnosis.
