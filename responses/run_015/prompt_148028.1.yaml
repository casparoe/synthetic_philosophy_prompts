      *   **Side B Commitments:** Committed to the concept of authorised agency. If the principal (the people) authorises the agent (the leader), the moral cost lies with the principal. The "stain" is merely emotional confusion.
      *   **Why they talk past each other:** Side A sees Side B as morally naive (denying reality of wrong). Side B sees Side A as conceptually confused (misplacing blame).
      *   **What breaks the deadlock:** It's not empirical (voter behaviour doesn't solve normative questions). It's not a formal model (blame isn't purely mathematical). It requires a conceptual distinction. Specifically, distinguishing between *political justification* (was the act right for the state?) and *moral culpability* (did the agent violate a moral law?).

  5.  **Refine the Output (checking constraints):**
      *   *First sentence:* Bottom line.
      *   *Language:* British English (e.g., "authorisation", "label", "programme", "analyse").
