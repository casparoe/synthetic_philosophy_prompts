  **Matters for Conclusion:**
  *   (b) **Identifiability:** Dictionaries are fixed; feature bases are not. Rotations or mixes fit activations equally well. There is no unique "fact of the matter."
  *   (a) **Anchoring:** Words are publicly grounded in social practice; features are private, anchored only by their causal role in loss reduction.
  *   (c) **Instantiation:** Words are discrete tokens; features exist via superposition, rarely instantiated in isolation during forward passes.

  **Noise:**
  *   Evolution timescale (epochs vs. generations).
  *   Physical substrate (biology vs. silicon).

  3. **Verdict**

  The realist conclusion does not survive. The analogy fails because it assumes uniqueness where none exists. While the activation space geometry is real, no particular decomposition is privileged over another mathematically equivalent basis. Realism survives only regarding the *subspace* capacity, not the specific *features*. The premise doing the work was that successful compression implies a unique vocabulary. This is false for vector spaces, where infinite bases compress equally well. Thus, the "dictionary" is a projection by the lexicographer, not a discovery of pre-existing atoms.

  4. **Replacement Analogy**

  The **basis choice** analogy is better. It admits the space is real but coordinates are conventional. It quietly imports linearity, assuming features combine additively, but honestly reflects the underdetermination problem. The **clustering** analogy is worse; it imports discreteness that denies superposition, falsely suggesting features are mutually exclusive natural kinds. Given superposition is empirically prevalent, the basis analogy is more faithful, even if it undermines strong realism. It correctly shifts the burden: prove why *this* basis is privileged, not just that *a* basis exists.
