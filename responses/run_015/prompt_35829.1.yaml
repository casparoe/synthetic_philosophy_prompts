  Consider a senior safety engineer at a nuclear facility tasked with validating a fail-safe protocol: 'All critical pressure spikes trigger the emergency vent.' Direct observation of critical spikes is mercifully rare, slow to accumulate, and ethically impossible to induce; the log of non-events, however, is voluminous. She therefore designs her audit to sample overwhelmingly from the non-ventings—the quiet hours where the system remained inert—and verifies via secondary sensors that no pressure spike occurred in those instances. Each verified quiet hour is a non-vent that turned out to be a non-spike; a contrapositive instance. To the armchair philosopher, this looks like checking white shoes to learn about ravens, but to the engineer, ignoring the sea of non-vents would be negligence, for it is within that quiet majority that a silent sensor failure would hide.

  ***

  **The Audit**

  **1. The Raven Structure**
  The hypothesis (*H*) is 'All critical pressure spikes (*F*) trigger the emergency vent (*G*)'. Its logical equivalent, the contrapositive (*H*'*), is 'All non-ventings (*non-G*) are non-spikes (*non-F*)'. Under Hempel's instance condition, an object confirms a hypothesis if it satisfies both the antecedent and consequent. Thus, a non-venting (*non-G*) that is verified as a non-spike (*non-F*) confirms *H*'. By the equivalence condition, since *H* and *H*' are logically equivalent, evidence confirming *H*' must confirm *H*. The engineer's quiet hours are precisely these confirmatory instances: non-vents that are non-spikes.

  **2. The Bayesian Vindication**
  In the standard Raven Paradox, a white shoe carries negligible weight because the prior probability of a shoe being a raven is effectively zero; finding a non-black non-raven tells us nothing we didn't already know about the distribution of ravens. In the engineer's case, the contrapositive observations carry genuine diagnostic weight because the background knowledge assigns a non-zero prior probability to the counterexample. We know sensors fail. If *H* were false (i.e., the vent is unreliable), we would expect to find pressure spikes occurring without venting. Since the class of non-ventings constitutes the vast majority of operational time, sampling this class offers the highest statistical power to detect such a failure. The evidence discriminates between the hypothesis ('The vent is perfect') and the alternative ('The vent misses spikes randomly'); finding no spikes in a large sample of non-ventings significantly lowers the likelihood of the alternative.

  **3. The Critical Feature**
  The single feature doing the work is the **non-zero prior probability of a counterexample within the non-G class**. In the engineer's scenario, we believe it is physically possible for a pressure spike to occur without triggering the vent (a false negative). If you remove this feature—if you stipulate, as we implicitly do with shoes and ravens, that the probability of a non-vent hiding a spike is nil—the case collapses back into the white-shoe situation. If the sensor were known to be infallible *a priori*, checking the non-vents would be tautological and informatively empty, restoring the paradox's sting: you would indeed be wasting your time checking white shoes.

  **4. The Hempelian Objection**
  A strict Hempelian would reject this Bayesian rescue as a category error. For Hempel, confirmation is a logical relation between propositions, not a pragmatic function of background frequencies or search costs. He would insist that the 'optimality' of the engineer's strategy is merely psychological or methodological, not logical. From the standpoint of pure logic, the confirmatory power of a non-vent must be symmetric with its formulation as a non-raven; if it feels more informative to check non-vents than non-spikes, that is a illusion of human cognition, not a feature of the evidence itself. To admit that background knowledge alters the confirmatory status of an instance is to abandon the quest for a purely qualitative logic of confirmation.
