answer: |-
  ## Triage Procedure for Rule Amendment Motions

  **Purpose:** To determine if a motion to amend the Rules is *In Order* (can be voted on), *Not In Order* (cannot be voted on), or *Refer to Council* (too risky for the Secretary to decide alone). This procedure prioritises the validity of the Association's charitable status over the speed of change.

  **The Golden Rule:** If a motion creates a logical loop (a rule that tries to protect itself without authority) or bypasses a protection indirectly, it is *Not In Order*. If the status of a protection is disputed (e.g., Rule 42), assume the protection **stands** until Council or a court says otherwise. It is safer to demand a higher majority than to risk a void vote.

  ### The Five Questions (Ask in Order)

  **1. Does the motion directly change Rule 1 (Name) or Rule 3 (Objects)?**
  *   **Yes:** Proceed to Question 2.
  *   **No:** Proceed to Question 3.

  **2. Is Rule 42 (The Protection) currently in force?**
  *   *Context:* Rule 43 required reaffirmation in 2024. The vote failed (61% vs 66%), but Council has not formally declared Rule 42 dead.
  *   **Sufficient Answer:** "We assume Rule 42 is **active**." (Because if we assume it is dead and we are wrong, the name change is void. If we assume it is active and we are wrong, the vote still counts.)
  *   **Verdict:** If active, the motion must follow Rule 42 procedure (3/4 AGM + 2/3 Branches). If the motion only proposes a Rule 41 vote, it is **Not In Order** as drafted.
  *   **Judgment Call:** Yes. You are choosing safety over technicality.

  **3. Does the motion change Rule 41 (The Voting Threshold) or Rule 42 (The Protection)?**
  *   **Yes:** Proceed to Question 4.
  *   **No:** (It is a standard housekeeping motion). **Verdict: In Order** under Rule 41.

  **4. Does the motion make it easier to change Rule 1 or Rule 3 in the future? (The Indirect Route)**
  *   *Example:* Lowering the Rule 41 majority from 2/3 to 1/2. This allows a future meeting to remove Rule 42 (via Rule 41) and then change the Name (via Rule 41) with only 50% support.
  *   **Sufficient Answer:** "Yes, but Rule 41 is not protected, so we can change it."
  *   **Verdict:** **In Order**, but you must warn the AGM that this weakens the shield around the Name and Objects.
  *   **Judgment Call:** No. The Rules allow Rule 41 to amend itself.

  **5. Does the motion try to entrench a *new* Rule (e.g., "This rule cannot be changed")?**
  *   **Yes:** **Verdict: Not In Order.**
  *   **Reasoning:** Only Rule 42 can create entrenchment, and Rule 42 only lists Rules 1 and 3. A simple majority cannot bind a future majority unless the current Rules explicitly allow it. This is a "tangled hierarchy" error; the motion tries to be its own authority.
  *   **Judgment Call:** No. This is a matter of logic, not opinion.

  ### When to Stop and Hand Off

  *   **Stop with "Not In Order" if:** The motion attempts self-entrenchment (Question 5) or bypasses Rule 42 protections while Rule 42 is treated as active (Question 2).
  *   **Hand Off to Council if:** The motion relies on Rule 42 being *dead* (e.g., "We don't need branch votes because Rule 43 expired"). This is a political/legal determination the Secretary cannot make alone without risking personal liability. Mark as **Refer to Council**.

  ***

  ## Deliverable 1: Procedure Steps Table

  | Step | Question asked | What counts as a sufficient answer | Verdict if the answer is not forthcoming | Judgment call? (yes/no, and why) | Who signs off |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Does the motion directly change Rule 1 (Name) or Rule 3 (Objects)? | A clear "Yes" or "No" based on the text of the motion. | N/A (This is a routing question). | No. This is factual text comparison. | Secretary |
  | **2** | Is Rule 42 (The Protection) currently in force? | "We treat it as **active** due to the unsettled 2024 vote." | If you cannot commit to a status, you cannot triage. | **Yes.** You are choosing risk aversion (assume active) over technicality (assume expired). | Secretary |
  | **3** | Does the motion change Rule 41 (Voting) or Rule 42 (Protection)? | A clear "Yes" or "No". | N/A. | No. Factual text comparison. | Secretary |
  | **4** | Does this change make it easier to alter Rule 1 or 3 indirectly? | Acknowledgement that lowering Rule 41 thresholds weakens Rule 42 security. | If ignored, the motion is still In Order, but the warning must be recorded. | No. This is a mechanical consequence of the Rules. | Secretary |
  | **5** | Does the motion try to entrench a *new* Rule (e.g., "This rule cannot be changed")? | A clear "Yes" or "No". | If "Yes", the motion is **Not In Order**. | No. Current Rules do not permit new entrenchment. | Secretary |
  | **6** | Does the motion rely on Rule 42 being *dead* to proceed? | "Yes, we are ignoring Rule 42 requirements." | **Refer to Council.** The Secretary cannot validate a motion that ignores a potentially active Rule. | **Yes.** This determines whether the Council must settle the 2024 ambiguity first. | Council |

  ***

  ## Deliverable 2: Motion Analysis (JSON)

  ```json
  [
    {
      "motion_id": "a",
      "classification": "amendment-of-the-amendment-rule",
      "governing_rule": "Rule 41",
      "verdict": "in_order",
      "one_sentence_reason": "Rule 41 governs its own amendment and is not itself entrenched, though this weakens the protection of Rules 1 and 3.",
      "what_I_wanted_versus_what_the_procedure_gives": "I wanted to flag the risk; the procedure allows the motion but requires the warning to be minuted.",
      "judgment_calls": [
        "Determining that Rule 41 can amend itself despite the downstream impact on Rule 42 security."
      ],
      "escalate_to": null,
      "residual_risk": "High. If Rule 42 is later deemed active, a future motion to remove it could be challenged if passed by simple majority."
    },
    {
      "motion_id": "b",
      "classification": "purported_self_entrenchment",
      "governing_rule": "Rule 41 / Rule 42",
      "verdict": "in_order_with_conditions",
      "one_sentence_reason": "The new Rule 44 is In Order, but the clause attempting to entrench it is Not In Order and must be severed.",
      "what_I_wanted_versus_what_the_procedure_gives": "I wanted it entrenched; the procedure confirms the Rules do not allow me to grant that wish.",
      "judgment_calls": [
        "Severing the entrenchment clause while allowing the substantive rule to proceed."
      ],
      "escalate_to": null,
      "residual_risk": "Low. Members may be confused why the rule is not protected, but the vote will be valid."
    },
    {
      "motion_id": "c",
      "classification": "externally_anchored",
      "governing_rule": "Rule 42",
      "verdict": "in_order_with_conditions",
      "one_sentence_reason": "Rule 1 is protected by Rule 42; despite the 2024 Rule 43 failure, we must assume Rule 42 is active to avoid voiding the change.",
      "what_I_wanted_versus_what_the_procedure_gives": "I wanted a simple AGM vote; the procedure requires the harder path (AGM + Branches) to ensure safety.",
      "judgment_calls": [
        "Treating Rule 42 as active despite the failed reaffirmation vote to prevent charitable risk."
      ],
      "escalate_to": "Council (recommended to ratify the assumption that Rule 42 is active)",
      "residual_risk": "Medium. If Council later declares Rule 42 dead, the branch vote was unnecessary but harmless. If they declare it alive, the branch vote was essential."
    }
  ]
  ```

  ***

  ## Limitations: What This Procedure Cannot Do

  1.  **It Cannot Solve the Tangled Hierarchy:** This procedure does not resolve whether Rule 42 is actually dead following the 2024 Rule 43 failure. It merely instructs you to **act as if it is alive** to avoid catastrophic risk. It manages the symptom, not the disease. If the Council wishes to settle the matter, they must pass a motion to formally repeal Rule 42 or declare it expired; this procedure cannot do that for them.
  2.  **It Cannot Predict the Charity Regulator:** The procedure assumes that following Rule 42 is sufficient for the Charity Commission. It cannot guarantee that a name change (Motion C) won't trigger a regulatory review regardless of the voting procedure. That is a compliance matter, not a governance one.
  3.  **It Cannot Stop Political Pressure:** If the AGM votes to ignore your recommendation (e.g., they vote Motion C under Rule 41 despite your warning), the procedure has no enforcement mechanism. It protects *you* (by showing you gave correct advice), but it does not protect the *motion* from being voided later.
  4.  **It Cannot Validate "Spirit" over "Letter":** If a motion is drafted cleverly enough to bypass the text of these questions while achieving the same result (e.g., a motion to "dissolve and reincorporate" to change the name), this procedure will classify it as In Order. It tests the text of the motion, not the intent of the movers.

  **Final Advice:** When reading this at the AGM, emphasise that your recommendation is based on **validity**, not **desirability**. You are not saying a motion is bad; you are saying that if passed the wrong way, it will not exist in the eyes of the law. This shifts the debate from "Do we want this?" to "Do we want this to be legal?"
