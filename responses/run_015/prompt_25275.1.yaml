      *   *Objection 2 (The Phenomenological push):* If you reject hedonic tone, aren't you just denying the phenomenology? There *is* something it's like.
      *   *Objection 3 (The Desire-Satisfaction Counter):* Moving to DS doesn't solve heterogeneity; DS has its own heterogeneity problem (satisfying a desire to count grass blades vs. helping a friend).
      *   *Objection 4 (The Neo-Epicurean angle):* Pain avoidance. If you drop hedonism, how do you account for the badness of pain without reference to feeling?
      *   *Objection 5 (Conceptual/Definitional):* Are you conflating the *source* of pleasure with the *pleasure* itself?
