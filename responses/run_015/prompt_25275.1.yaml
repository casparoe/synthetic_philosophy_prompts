  1. The "Unity of Value" Challenge (Prof's likely meta-ethical push).
  2. The Attitudinal Dissolution (Feldman defense).
  3. The DS Mirror (The "you have the same problem" objection).
  4. The Phenomenological Intuition (Common sense pushback).
