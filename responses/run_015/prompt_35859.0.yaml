answer: |-
  ## Brainstorming & Design Selection

  Before settling on the final plan, I weighed three candidate structures for this session.

  **Candidate 1: The "Color Chip" Protocol.**
  *   **Idea:** Use subtle paint gradients. Students match chips under different lighting, then try to describe the "pure redness" of a specific chip after a delay.
  *   **Pros:** Clean, no allergies, easy to distribute. Visual qualia are the standard philosophical example.
  *   **Cons:** Visual discrimination is often too robust. It's hard to make a student confabulate about a color they are looking at right now. It feels too cognitive and not enough like "experience."
  *   **Verdict:** Discarded. Too sterile.

  **Candidate 2: The "Phantom Pain" Simulation.**
  *   **Idea:** Use mild thermal or pressure stimuli to simulate pain qualia.
  *   **Pros:** Hits the "private/internal" intuition hard.
  *   **Cons:** Ethical minefield. Hard to standardize intensity across 14 students. Too much time spent on safety waivers.
  *   **Verdict:** Discarded. Too risky for a standard seminar.

  **Candidate 3: The "Gustatory Tribunal" (The Winner).**
  *   **Idea:** Your rough concept, refined. Taste is visceral, subjective, and notoriously hard to describe without reference to memory or expectation. It is the perfect domain for the "evaporation" argument.
  *   **Pros:** High engagement, directly targets the "what it's like" intuition, allows for controlled confabulation (mislabeling).
  *   **Cons:** Logistics (allergies, mess), requires strict timekeeping to prevent the tasting from eating the philosophy.
  *   **Verdict:** **Selected.** With tight rules on the interrogation phase, this delivers the phenomenological "pinch" you're looking for.

  ***

  # Activity Writeup: The Gustatory Tribunal

  **Course:** Upper-Level Philosophy of Mind
  **Topic:** The Coherence of Qualia (Dennett/Chase & Sanborn)
  **Time:** 90 Minutes
  **Class Size:** 14 Students
  **Facilitator:** Professor or Senior TA

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  Experience the difficulty of isolating "intrinsic experience" from judgment, memory, and disposition.
  2.  Encounter the "confabulation" effect when expectations are manipulated.
  3.  Attempt to articulate the "qualitative residue" and fail to do so without relying on functional or comparative terms.
  4.  Understand the "Quining Qualia" argument through lived frustration rather than text.

  ## II. Materials List
  *   **Stimuli:** 3 distinct flavors in identical, clear cups (covered until use).
      *   *Stimulus A:* Lemon Jelly Belly (or distinct lemon candy).
      *   *Stimulus B:* Lime Jelly Belly (or distinct lime candy).
      *   *Stimulus C:* A generic "Citrus Drop" (ambiguous lemon/lime mix).
      *   *Note:* Ensure sugar-free options are available for diabetics. Check for gelatin allergies (use pectin-based if needed).
  *   **Palate Cleansers:** Water cups and unsalted crackers (one per student).
  *   **Label Cards:** Small tent cards for the cups.
      *   Set 1: "A", "B", "C".
      *   Set 2: "Lemon", "Lime", "Mixed".
  *   **Interrogation Scorecards:** 14 printed cards (see Section IV).
  *   **Timer:** Visible countdown timer.
  *   **Whiteboard:** For tracking "Forbidden Terms."

  ## III. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Safety** | Distribute materials. Allergy check. Explain the "No Talking" rule during tasting. |
  | **05-20** | **Phase 1: Discrimination** | Blind taste A vs. B. Identify difference. Report *how* they know (acidicity, sweetness, etc.). |
  | **20-40** | **Phase 2: Interference** | Taste C. 5-minute filler task (logic puzzle). Describe C from memory. |
  | **40-55** | **Phase 3: Mislabeling** | Reveal C. Tell half the class it is "Premium Lemon," half it is "Premium Lime." Re-taste. Note report changes. |
  | **55-80** | **Phase 4: The Tribunal** | **Core Activity.** Students pair up. One defends the "Residue," one interrogates. |
  | **80-90** | **Debrief** | Map activity to philosophical arguments. Reveal the theoretical framework. |

  ## IV. Facilitator Script & Student Instructions

  ### Phase 1: Discrimination (05-20)
  **Facilitator:** "Take Cup A and Cup B. Do not swallow yet. Identify the difference. On your notecard, write down *how* you distinguished them. Do not use the words 'taste' or 'flavor.' You must describe the physical sensation or the reaction."
  **Student Action:** Taste, compare, write.
  **Facilitator Move:** Collect a few responses. Read them aloud. Point out that every description was relational (sweeter than, sharper than) or functional (made my mouth water).

  ### Phase 2: Interference (20-40)
  **Facilitator:** "Taste Cup C. Memorize the sensation. Now, put the cup down. Here is a logic puzzle. You have 5 minutes."
  **Student Action:** Complete puzzle.
  **Facilitator:** "Now, without tasting again, write down the specific character of Cup C. Was it sharp? Round? Did it linger?"
  **Student Action:** Write description from memory.
  **Facilitator Move:** Highlight discrepancies between Phase 1 precision and Phase 2 vagueness.

  ### Phase 3: Mislabeling (40-55)
  **Facilitator:** "I am going to label Cup C. Half of you, your card says 'Artificial Lemon.' Half of you, 'Artificial Lime.' Taste C again with this label in mind. Has the experience changed? Update your description."
  **Student Action:** Re-taste with bias. Update description.
  **Facilitator Move:** Reveal that Cup C was identical for everyone. Ask: "Did the label change the *stimulus*? No. Did it change the *report*? Yes. Did it change the *experience*? That's the question."

  ### Phase 4: The Tribunal (55-80) — *Critical Section*
  **Goal:** Force the student to isolate the "qualitative residue" (the qualia) from all functional/relational properties.

  **Setup:** Divide class into 7 pairs. Assign roles: **Defender** (claims there is an ineffable residue) and **Interrogator** (tries to exhaust all specifiable descriptions). Switch roles halfway (10 mins each).

  **Rules for the Defender:**
  1.  You must claim there is something about the taste of Cup A that remains *after* we account for discrimination, memory, and expectation.
  2.  You must attempt to describe this "remainder."
  3.  **The Ban:** You cannot use ostension (pointing, saying "this," "here," "like that"). You cannot use the words "ineffable," "intrinsic," "raw feel," or "qualia."

  **Rules for the Interrogator:**
  1.  You have a **Question Menu** (see below). You must pick questions from this list.
  2.  Your goal is not to win an argument, but to force the Defender to either specify the property or admit it is empty.
  3.  If the Defender uses a **Banned Term**, ring the bell (or clap). They lose 1 point.

  **The Question Menu (Printed on Scorecards):**
  *   *Discrimination:* "If I swapped this for a slightly different taste, would you notice? If yes, how? If no, is there a difference?"
  *   *Memory:* "If you tasted this tomorrow, what specific cue would tell you it's the same?"
  *   *Expectation:* "If I told you this was actually salt, would the sensation change? If yes, was the qualia in the tongue or the thought?"
  *   *Reaction:* "Did you flinch? Did you salivate? Is the qualia the sensation or the urge to swallow?"
  *   *Comparison:* "Is it more like X or Y? If you can't compare it, how do you know it's there?"

  **Facilitator Role:** Circulate. Enforce the "Ban." If a Defender says, "It just *is* lemony," stop them. "Lemony is a category. Describe the sensation without the category."

  ### Phase 5: Debrief (80-90)
  **Facilitator:** "Stop. Put pens down. Look at your scorecards."
  **Discussion:**
  1.  "How many Defenders successfully pointed to a residue without using a banned term?" (Likely zero).
  2.  "When the label changed (Phase 3), did the 'intrinsic' quality change? If so, is it intrinsic?"
  3.  "When you couldn't remember (Phase 2), did the qualia vanish, or just the access?"

  **The Reveal:**
  "Now, I name the view. What you just struggled against is the argument from **Daniel Dennett ('Quining Qualia')** and **Chase & Sanborn ('Qualia Realism is Incoherent')**.
  *   **Phase 1** tested **Discriminability**. If you can't discriminate it, is it there?
  *   **Phase 2** tested **Memory/Judgment**. Is the qualia the experience or the memory of it?
  *   **Phase 3** tested **Heterophenomenology**. Your report changed without the stimulus changing. Where is the 'truth' of the experience?
  *   **The Tribunal** was the **Incoherence Charge**. If you strip away discrimination, memory, expectation, and reaction, is there anything left? If there is, why can't you speak of it?"

  ## V. Predictable Failure Modes & Mitigation

  **1. The "Mystic" Student**
  *   **Problem:** A student refuses to play the language game. "You just can't understand it. It's private. Words can't capture it."
  *   **Mitigation:** Do not argue metaphysics during the Tribunal. Enforce the *rules of the game*. "You are welcome to hold that view, but in this activity, if you cannot specify it without banned terms, you forfeit the point. The goal is to test *communicability*, not truth."
  *   **Debrief Fix:** Acknowledge this in the debrief. "The Mystic says the residue exists but is ineffable. The Argument says if it's ineffable, it plays no role in our psychology, so why posit it?"

  **2. The "Confident Realist"**
  *   **Problem:** One student dominates, claiming obviously the residue exists, and their partner agrees.
  *   **Mitigation:** Intervene in that pair. Ask the Interrogator to use the "Expectation" question from the Menu. "If I told you this was vinegar, would the pain be the same?" Force the distinction between *sensation* and *interpretation*.

  **3. Time Blowout**
  *   **Problem:** Tasting takes too long; people are chewing, drinking water, laughing.
  *   **Mitigation:** Hard stop at minute 20 and 40. "Cups down. Even if you haven't swallowed." The philosophical point is about the *report*, not the digestion.
  *   **Contingency:** If Phase 4 runs short, skip the role swap and do one demo pair in front of the whole class where you act as the Interrogator.

  **4. Hygiene/Allergy Panic**
  *   **Problem:** Student worries about germs or allergens.
  *   **Mitigation:** Send materials home in sealed bags. Use individually wrapped candies. Have a "Opt-Out" data sheet where they can imagine the taste if they refuse to consume. (Philosophy works on thought experiments too).

  ## VI. Limitations: What This Demo Cannot Do

  You must be honest with the students (and yourself) about the boundaries of this activity.

  **1. The "Ontological Gap"**
  *   **Limitation:** This demo attacks *epistemic access* and *reportability*. It shows students they can't *talk* about the residue.
  *   **The Stubborn Realist:** A student can concede they can't describe it, but insist, "The feeling is still *there*. I just can't capture it in words."
  *   **Your Move:** In the debrief, acknowledge this. "This demo shows that qualia are *causally inert* in the public sphere. If it doesn't affect your discrimination, memory, or report, what work is it doing? The argument isn't that you don't *feel*, it's that the 'feeling' isn't a separate *thing* from the processing."

  **2. Sample Size of One**
  *   **Limitation:** We only tested taste. Vision (inverted spectrum) or pain might feel different to students.
  *   **Your Move:** Explicitly state: "We attacked the easiest target. Taste is fuzzy. If qualia vanish here, the burden of proof shifts to you to show where they survive. Maybe in pain? Maybe in color? But the *structure* of the argument remains."

  **3. The "Hard Problem" Remains**
  *   **Limitation:** This activity dissolves the *concept* of qualia. It does not solve the Hard Problem of Consciousness (why processing feels like anything at all).
  *   **Your Move:** Don't overclaim. "We haven't solved consciousness. We've just challenged whether 'qualia' is a useful tool for solving it. Dennett says it's a philosophical habit we need to break. Chalmers says it's the only thing that matters. You just felt the tension between them."

  ***

  **Final Note to the Instructor:**
  The success of this session relies entirely on your enforcement of the **Tribunal Rules**. If you allow students to say "It's just ineffable" without penalty during the activity, the lesson fails. You must be the strict judge of language. The frustration they feel when they are silenced is the pedagogical engine. Let them feel that frustration. It is the sound of a philosophical intuition being stress-tested.
