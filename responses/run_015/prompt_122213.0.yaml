          *   Presence of pleasure = Good.
          *   Absence of pain = Good (even if no one enjoys it).
          *   Absence of pleasure = Not Bad (if no one is deprived).
          *   *Conclusion:* Coming into existence is always a harm.
      *   *Welfare Economics:* Focuses on aggregate utility, cost-benefit analysis, QALYs (Quality-Adjusted Life Years).
