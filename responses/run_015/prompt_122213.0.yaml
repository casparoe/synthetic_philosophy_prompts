      *   Does it rely on Negative Utilitarianism? *Partially.* Screening/termination aligns with reducing suffering. But child benefits align with promoting population/utility, which NU doesn't necessarily prioritise.
      *   Does it rely on Welfare Economics? *Yes, mostly.* It's a cost-benefit analysis. Disabled children are seen as "costly" (hence screening/termination allowed, wrongful birth compensated). Healthy children are seen as "future taxpayers/social assets" (hence benefits).
      *   *The Core Commitment:* **Pro-Natalism with Eugenic Undertones (Liberal Eugenics).** The state wants *some* babies (healthy, future workers), but not *others* (disabled, high cost). It treats existence as a presumptive good *unless* the quality of life falls below a certain threshold.
      *   *The Legal/Funding Mismatch:*
          *   Law (Wrongful Life): Protects the sanctity of existing life (can't say life is worse than death).
