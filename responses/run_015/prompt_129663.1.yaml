      *   *Distributed Systems Analogy:* In dist systems, "unpredictable latency" might be GC pauses (bad input), retry storms (feedback loop), or race conditions (instability). The bridge is a "retry storm" equivalent (positive feedback).
      *   *Predictability Horizon:* In chaos, the horizon is finite due to precision. Here, the horizon was infinite *if* you had the right model. The horizon was zero because the model was wrong.
