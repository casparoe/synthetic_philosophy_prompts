      *   **Initial Conditions:** Not just position/velocity of the deck. It includes the phase distribution of pedestrian footsteps.
      *   **Tipping Point:** Critical crowd density. Below $N_c$, damping dominates. Above $N_c$, human synchronization overcomes damping. This is a bifurcation point.
      *   **Chaos vs. Resonance:** It is *not* technically chaotic in the Lorenz/Butterfly sense. It is a *synchronization transition*. It is robust and reproducible (add 200 people, it wobbles; remove 200, it stops). Chaos implies long-term unpredictability due to SDIC. This was predictable *in principle* if the coupling term existed.
      *   **The "Deterministic but Unpredictable" Thesis:**
          *   *Standard Chaos View:* We know the equations, but can't measure $x_0$ precisely enough.
          *   *Millennium Bridge View:* We didn't know the *equations*. The unpredictability came from *model error*, not *measurement error*.
      *   **Reflexivity:** The user is right. Weather doesn't care if you predict rain. Pedestrians care if you predict wobble (they might hold the rail or stay home). This is a *reflexive system* (Soros/Lucas).
      *   **The Fix:** Dampers add physical damping to overcome the negative damping of the crowd. Cheap fix implies the *physics* was simple, the *modeling* was incomplete.
      *   **Conclusion on the Thesis:** "Deterministic but unpredictable" is a category error here. It was "Deterministic and *Unmodeled*." Chaos theory assumes the map is known but the territory is sensitive. Here, the map was missing a road.

