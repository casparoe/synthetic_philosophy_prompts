answer: |-
  In a specialized infusion ward, a high-risk chemotherapy protocol requires two distinct staff members to independently verify pump settings before activation, while a third senior nurse is authorized to override if discrepancies arise. Three staff members—Anna, Ben, and Clara—are present and aware of the idle pump. Anna assumes Ben will verify since he is the primary technician; Ben assumes Clara will oversee since she is senior; Clara assumes Anna has already cleared it since she is the assigning nurse. Each prioritizes an immediate, unstable patient nearby, following a triage rule that favors active stabilization over preventive verification. The pump activates unchecked, delivering a fatal overdose. No one positively tampered with the pump; harm resulted solely from the three verification steps not occurring, yet any single verification would have been insufficient without a second, and any single omission was harmless had the other two acted.

  This scenario meets the design specifications: harm arises entirely from omissions (failure to verify), distributed across three agents acting on locally optimal triage rules rather than malice or error. No individual omission is necessary (if Anna had acted, Ben and Clara's inaction would still cause failure) nor sufficient (if Anna omits but Ben and Clara act, safety holds), and no specific duty was assigned to any individual for this specific check.

  The three accounts diverge sharply here. A **counterfactual-dependence account** asks whether the harm would have disappeared if a specific agent had acted; since one verification alone cannot stop the overdose, the answer is no for all three, yielding a verdict of no individual causation. An **interventionist account** similarly asks whether manipulating one agent's behavior changes the outcome; holding the others fixed, forcing Anna to verify leaves the harm intact, so it too denies individual causation. A **normative account**, however, treats omissions as causal where a duty exists; arguing that professional roles carry implicit safety duties even without specific assignment, it verdicts that all three caused the harm by breaching their professional obligation. The divergence stems from the fact that the normative account grounds causation in obligation, while the other two ground it in physical difference-making.

  The structural feature doing the philosophical work is the **conjunctive safety requirement combined with diffused duty**. The protocol requires multiple steps (conjunctive), ensuring no single agent has leverage, while the lack of assignment (diffused) prevents any single agent from bearing full responsibility. If this feature is removed by designating one clearly responsible party—say, Anna is explicitly assigned to ensure verification—her omission becomes both necessary (if she acts, she ensures the second sign-off) and sufficient (if she omits, the check fails). In that revised case, all three accounts converge: the counterfactual and interventionist accounts confirm her action would have prevented harm, and the normative account confirms her duty was breached.

  A defender of the normative account, which fares worst here by positing causation without difference-making, would attack the case by arguing it misrepresents the causal structure of institutional settings. They would contend that in distributed systems, "causation" is not merely a physical relation but a status conferred by role expectations; thus, testing institutional omission against individual counterfactuals begs the question by imposing an individualist metaphysics on a fundamentally normative structure.
