answer: |-
  **Bottom line**
  Embedded agency is not a new theory of markets; it is reflexivity operationalized for quants. In 1987, the failure was not philosophical but specification error: models treated price dynamics as exogenous when they were endogenous to the strategy itself. The framework earns its keep not by predicting crashes, but by forcing a structural check on input-output loops that standard risk metrics miss. It is bounded rationality in a fancy hat, but the hat forces you to look down at your own feet. Stop looking for new physics; start auditing your boundaries.

  **The mapping**
  Treat the Portfolio Insurance (PI) algorithm as the agent and the market clearing mechanism as the environment. In the PI model, the boundary was drawn around the portfolio's value function. The environment was defined as a stochastic price process (typically geometric Brownian motion with jumps) independent of the agent's order flow. The model took liquidity and price impact as exogenous parameters, often assumed constant or infinite.

  In reality, the boundary was porous. The agent's output (futures sells) was a direct input to the environment's price formation process. Because multiple agents ran identical strategies, the aggregate output became a dominant driver of the environment's state (price levels). The model assumed $P_t \sim f(\text{external info})$, but reality was $P_t \sim f(\text{external info}, \sum \text{Agent Orders}_t)$. The error was treating a closed-loop system as open-loop. The model's "world" ended at the exchange gateway; the real world included the feedback loop from the gateway back to the price ticker.

  **Diagnosis**
  The primary failure mode was (1) **Boundary Failure**. The models literally excluded their own market impact from the price process. This is the root cause; the other three are derivatives or misdiagnoses.

  (2) Realisability failure is incorrect because the truth was computable. A model including price impact parameters could have captured the dynamics; the hypothesis class wasn't too small, it was just mis-specified. (3) Self-reference is wrong because PI algorithms were not modelling themselves; they were executing delta hedges based on spot prices, not simulating their own simulation.

  Regarding (4) Second-order embeddedness: theoretically, this should stabilize markets. If other traders model the PI agents, they should front-run the predictable selling, providing liquidity and dampening the crash. In 1987, this made things worse only because the second-order agents (market makers) *also* suffered Boundary Failures. They treated the PI flow as exogenous shock rather than predictable flow, so they withdrew liquidity instead of arbitraging. Thus, (4) exacerbated the crash only because (1) was universal. The primary sin remains the initial boundary draw: treating the environment as external when it was internally coupled.

  **Could anyone have called it**
  Yes. By mid-1987, the concentration of PI strategies was known, and liquidity was thinning. A team applying embedded agency principles would have run a stress test asking: "What happens to our hedge ratio if ten other firms run this same model?" This requires no new data, only a structural adjustment to the simulation.

  Embedded agency adds a specific checklist item: "Identify all outputs that become environmental inputs." Standard risk management focuses on VaR and exposure limits (static snapshots). Embedded agency forces a dynamic loop check. It wouldn't have predicted the date, but it would have flagged the *mechanism* as unstable. The failure wasn't lack of information; it was a failure to map the feedback topology. A simple agent-based simulation in 1987 would have shown the liquidity evaporation.

  **Is this a distinct problem**
  It is largely the Lucas Critique and Soros's reflexivity repackaged for model validation. The Lucas Critique warns that policy changes alter structural parameters; reflexivity warns that participant bias influences events. Embedded agency adds value only by translating these philosophical insights into engineering constraints.

  For a quant, "reflexivity" is vague; "boundary error" is a spec sheet mistake. The framework earns its keep by shifting the burden of proof: instead of assuming exogeneity until proven otherwise, it assumes endogeneity until decoupled. It prevents the "ceteris paribus" fallacy in systemic risk. However, it does not solve the problem of limited compute or data. It is not a new economic phenomenon; it is a rigorous way to admit that your model is a subset of the world it tries to predict. If you treat it as new physics, it's a fancy hat. If you treat it as a validation step, it's a useful tool.

  **Where I'm guessing**
  I am estimating the prevalence of PI strategies and the specific internal risk logs of 1987 market makers. Historical data on the exact AUM in portfolio insurance varies widely (estimates range from $60bn to $100bn). I am also inferring that market makers lacked models of PI flow; some may have had them but were capital-constrained. Evidence of internal memos explicitly ignoring price impact would solidify the Boundary Failure diagnosis over simple capital constraints.
