  1. **The Timing of Corruption**
  You argue that the "one thought" is corrupting only when it occurs in deliberation, but permissible when the agent is asked to justify himself afterwards. Why does the *time* of the thought change its moral valence?
  *(Anticipated Answer: Deliberation engages the critical faculty which displaces the immediate motive; justification is merely communicative.)*
  **Follow-up:** If the critical faculty is displaced during the act, how does it return for the justification without re-corrupting the memory of the motive?

  2. **The Status of the Reason**
  Let's press that boundary. If the thought is permissible afterwards, it must track a truth about why the act was right. If it tracks a truth, why was it excluded from the moment of action?
  *(Anticipated Answer: It tracks the impersonal principle retrospectively, but wasn't the operative motive.)*
  **Follow-up:** **What fixes the time, and in what sense is a reason that may only be thought outside the moment the reason the agent acts on?**

  3. **Audit vs. Dogmatism**
  Moving to your audit chapter: if the theory can forbid the agent from auditing their own commitments, what distinguishes her agent from one whose commitments are simply unjustified or dogmatic?
  *(Anticipated Answer: The dogmatist ignores costs; our agent obeys a rule based on the expected costs of auditing.)*
  **Follow-up:** But who calculates those expected costs? Doesn't that calculation itself constitute the very audit you claim is forbidden?

  4. **The Drift of Commitment**
  Let's assume the calculation is coherent. You suggest auditing is governed by expected costs. But consider the long-term stability of these commitments.
  *(Anticipated Answer: Auditing is sometimes too expensive, so we rely on stable dispositions.)*
  **Follow-up:** **What happens over a whole life, in which projects sour and people change, so that a permanently unaudited commitment drifts toward complacency while the audited one drifts toward the fanatic?**

  5. **The Mirror Case**
  Consider the mirror case: the husband who never registers the stranger's claim at all, the agent with one thought too *few*. If the extra thought corrupts, why is the missing one not also a fault?
  *(Anticipated Answer: The absorbed husband is virtuous; the thought is unnecessary if the commitment is secure.)*
  **Follow-up:** But if he never registers it, how do we know he isn't just ignorant of the moral landscape rather than virtuously absorbed?

  6. **Absorption vs. Dismissal**
  We need to distinguish the absorbed husband from the merely dismissive one. The dismissive agent ignores the stranger; the absorbed agent is focused on the wife. How do you tell them apart from the outside?
  *(Anticipated Answer: The absorbed husband would act differently if the stakes changed; the dismissive one wouldn't.)*
  **Follow-up:** **Doesn't that require a disposition to have the thought when circumstances shift, which would make the thought mandatory again?**

  7. **Second-Personal Truth**
  Ask her whether the sentence the husband can address to his wife afterwards, that he saved her because she is his wife, comes out true on her view or merely useful for her to hear.
  *(Anticipated Answer: It is true in a derivative sense, or true relative to the decision procedure.)*
  **Follow-up:** If it's only derivatively true, does the wife have a right to demand the fundamental reason, or is she excluded from the full moral truth of her own rescue?

  8. **Management vs. Answer**
  Suppose you say the statement is merely useful for her to hear, not strictly true. You might argue this preserves the relationship.
  *(Anticipated Answer: It maintains the relationship which is ultimately good from the impersonal standpoint.)*
  **Follow-up:** **If merely useful, the wife's complaint is managed rather than answered, and the objection has quietly become a claim about what we owe each other in the articulation of reasons rather than about the agent's private psychology.**

  9. **Scope and Prerogative**
  In chapter six, you grant a modest agent-centered prerogative to favour one's own projects. Does that concession dissolve the objection, or relocate it, so that the offending thought becomes whether one's project is important enough to trigger the prerogative?
  *(Anticipated Answer: It accommodates integrity without abandoning the core consequentialist framework.)*
  **Follow-up:** **And if the objection does generalize to any theory with a standing reason to reconsider one's commitments, is she conceding that Williams's target cannot really be maximizing or agent-neutrality specifically?**

  10. **Falsification**
  Finally, I want to ask what would count against her. We need to know the stakes of this debate for your theory's resilience.
  *(Anticipated Answer: It depends on whether the objection is empirical or conceptual.)*
  **Follow-up:** **Whether the integrity objection is, on her reading, an empirical claim about what deliberation does to us or a conceptual claim about reasons, what finding would move her if it is the former, and what she would say if it turned out that a defensible account of love requires the lover to be able to cite the relationship as a reason that is not derived from the impersonal one.**
