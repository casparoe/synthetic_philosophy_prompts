answer: |-
  Based on Diane's six prior rulings, here is the prediction, the deduced logic, and the test case required to break it.

  ### 1. The Prediction
  Diane will rule **No Belief**.

  She will classify the axe as a **practical anomaly** or **structural disposal**. Her written comment will likely read: *"Isolated incident; lacks regional parallel. Likely disposal of a flawed casting or structural ballast, not evidence of a belief system."*

  ### 2. Diane's Three Rules
  Her track record commits her to three specific criteria. For her to record "Belief," a find generally needs to pass at least two, and arguably all three.

  *   **Rule 1: The Irreversible Cost (Positive Action)**
      *   *Derived from:* Spears (bent/snapped) vs. Coin (clipped/worn) vs. Iron Bars (unused/retrieved).
      *   *Logic:* Belief requires the deliberate destruction or permanent removal of utility. If an object can be used later (bars) or was lost accidentally (coin), it is practical. If it is "killed" (spears), it *may* be belief.
      *   *Status for Axe:* **Pass.** The axe is smashed and sealed.

  *   **Rule 2: The Recurrent Pattern (No Singletons)**
      *   *Derived from:* Spears ("Dozens... across the region") & Graves ("Two hundred graves") vs. Iron Bars ("no parallel anywhere else") & Shrine ("no image").
      *   *Logic:* A single event is an anecdote; a system requires repetition. Uniqueness implies individual choice or practical necessity, not shared belief.
      *   *Status for Axe:* **Fail.** You specified "nothing like it anywhere nearby for centuries."

  *   **Rule 3: The Segregated Context (Not Structural)**
      *   *Derived from:* Bogs/Graves (Places set apart) vs. Floor Make-up (Hazelnuts) & Fort Ditch (Bars).
      *   *Logic:* Belief deposits occur in places designated for non-utilitarian purposes. If an object is part of a building's structure (floor, posthole) or a storage ditch, it is treated as functional until proven otherwise.
      *   *Status for Axe:* **Fail.** It is in a posthole beneath a floor (domestic/structural).

  ### 3. Application to the New Case
  The axe passes Rule 1 (Destruction) but fails Rules 2 and 3. In Diane's history, **Rule 2 (Pattern) is her tie-breaker.**
  *   When the Iron Bars were unique ("no parallel"), she ruled "Storage," even though they were stacked in a ditch (which could be argued as a specific context).
  *   When the Shrine lacked positive evidence (absence of statue), she ruled "Nothing," refusing to infer belief from context alone.

  Because the axe is a **singleton**, Diane's logic dictates it cannot represent a "shared belief." It represents one person's action. Without a second or third example, she cannot distinguish a ritual from a quirk. She will default to the "Hazelnut" ruling (structural/practical) because the "Bog" ruling (belief) requires the regional pattern she explicitly noted in the spearhead case.

  ### 4. Your Worry: Visibility and Address
  *Your worry:* "A deposit sealed where no one could see it... isn't addressed to anyone... closer to putting something spoiled or dangerous out of reach."

  *Does her record settle this?*
  **Yes, on visibility. No, on intent.**

  *   **Visibility:** Her ruling on the **Bog Spearheads** quietly settles that visibility is irrelevant. Those were "none ever fished back out," sealed in a bog, unseen. She ruled them "Belief/Offering." Therefore, in her framework, an unseen deposit *can* be an offering. She does not require a human audience.
  *   **Intent (Offering vs. Disposal):** Her record does *not* settle how to distinguish an offering from the disposal of something dangerous/spoiled. She uses **Pattern** as a proxy for this.
      *   If it happens 200 times (Graves) or dozens of times (Spears), she assumes it is an Offering (Belief).
      *   If it happens once (Iron Bars, Axe), she assumes it is Disposal/Practical (No Belief).

  This case will not force her to address the "addressed to anyone" question, because she has already accepted unseen offerings (Spears). Instead, it forces her to admit that **without repetition, she refuses to speculate on intent.** She treats uniqueness as proof of practicality by default.

  ### 5. The Separating Test Case
  To distinguish which of her rules is the absolute blocker (Pattern vs. Context), you need this find:

  **A single, smashed bronze axe, identical to the first, found in a local bog (not a house), with no other similar axes in the region.**

  *   **Why this separates the rules:**
      *   It keeps the **Singleton** status (testing Rule 2).
      *   It changes the **Context** to a known ritual landscape (testing Rule 3).
      *   It keeps the **Destruction** (testing Rule 1).

  *   **The Outcomes:**
      *   **If she rules Belief:** Then **Context Trumps Pattern**. Her rejection of the house axe was because houses are "practical spaces," not because it was unique. (This would contradict her Iron Bar ruling, where a unique stack in a ditch was "storage," but ditches are less "ritual" than bogs).
      *   **If she rules No Belief:** Then **Pattern is King**. Even in a bog, a one-off event is not a belief system to her. This confirms that her "Belief" category is actually a "Statistical Norm" category, and she will never accept a unique ritual act as evidence of belief, regardless of how violently it was "offered."

  Given her insistence on "dozens" of spears and "two hundred" graves, I would bet she rules **No Belief** on the bog axe too. She requires a crowd to see a creed.
