answer: |-
  You have identified a genuine gap in the taxonomy of welfare state theory. You are correct that "moral hazard," "conditionality," and "stigma" are adjacent but fail to capture the specific *epistemic inversion* and *self-justifying loop* you are describing.

  In public policy literature, the closest established concept is **Administrative Burden** (or "Sludge"), popularized by Pamela Herd and Donald Moynihan. They define this as the learning, compliance, and psychological costs citizens face when interacting with the state. However, "Burden" is largely functionalist; it describes the *friction*, not the *moral ontology* or the *epistemic reversal* (the shift from "needy" to "suspect").

  In critical sociology, Loïc Wacquant's **Punishing the Poor** and Virginia Eubanks' **Digital Poorhouse** describe the *effects* of this architecture, but they treat it as a political strategy (discipline/control) rather than defining the specific epistemic mechanism you've isolated.

  Since no single term captures the *epistemic inversion* + *circular justification* + *moral redefinition*, I propose we coin the term **Constitutive Suspicion**.

  Below is the conceptual carving you requested.

  ---

  ### The Concept: Constitutive Suspicion

  **Definition:**
  **Constitutive Suspicion** is a bureaucratic logic wherein the verification procedures designed to detect fraud do not merely screen claimants, but ontologically reclassify them from "citizens with rights" to "presumptive offenders." This reclassification generates the very data (low take-up, high compliance costs, detected anomalies) that policymakers then cite as evidence of the necessity of the verification regime.

  It is *constitutive* because the suspicion does not pre-exist the interaction; the bureaucratic process itself *constructs* the claimant as a suspect. It is *suspicion* because the epistemic baseline shifts from "trust until verified" to "disbelieve until proven innocent."

  ### The Mechanism (The Loop)
  1.  **Epistemic Inversion:** The burden of proof shifts from the state (justifying aid) to the individual (justifying innocence).
  2.  **Moral Reclassification:** The claimant is no longer a "recipient" but a "case" to be solved. Their testimony is assigned a **Structural Credibility Deficit** (an extension of Fricker's *testimonial injustice* to institutional design).
  3.  **Data Generation:** The hurdles cause errors, delays, and dropouts. The system interprets these dropouts not as administrative failure, but as "deterred fraud."
  4.  **Self-Justification:** Policymakers point to the "fraud caught" (by the intense net) and the "savings achieved" (by people giving up) as proof that the intense net was necessary.

  ### The Carving: Boundary Conditions

  To ensure this concept does the work you need, we must distinguish it from its nearest neighbors.

  #### 1. Constitutive Suspicion vs. Conditionality
  *   **Conditionality** is forward-looking and behavioral: *"You must look for work to receive this check."* It assumes you are eligible but requires an action to maintain status.
  *   **Constitutive Suspicion** is backward-looking and epistemic: *"You must prove you actually looked for work last month, and we assume you didn't."* It questions the truth of your status, not just your compliance with a rule.
  *   **The Edge:** If the rule is about *future behavior*, it is conditionality. If the rule is about *past truthfulness*, it is constitutive suspicion.

  #### 2. Constitutive Suspicion vs. Stigmatization
  *   **Stigmatization** is social and psychological: It is the shame felt by the recipient or the cultural devaluation of welfare. It can exist without complex bureaucracy (e.g., neighbors judging a recipient).
  *   **Constitutive Suspicion** is procedural and epistemic: It is embedded in the forms, algorithms, and audit schedules. A claimant can feel no shame (rejecting the stigma) but still be trapped in Constitutive Suspicion because the *system* does not believe them.
  *   **The Edge:** Stigma lives in culture; Constitutive Suspicion lives in the verification architecture.

  #### 3. Constitutive Suspicion vs. Moral Hazard
  *   **Moral Hazard** is an economic assumption: *"If you insure people against risk, they will take more risks."* It predicts a change in *behavior* due to security.
  *   **Constitutive Suspicion** is a moral accusation: *"You are lying about your risk to get security."* It assumes deceit, not just risk-taking.
  *   **The Edge:** Moral hazard justifies policy to prevent *laziness*; Constitutive Suspicion justifies policy to prevent *theft*.

  #### 4. Constitutive Suspicion vs. Administrative Burden ("Sludge")
  *   **Administrative Burden** is neutral regarding intent: It measures the *cost* of compliance (time, stress, money). It does not necessarily imply the state thinks you are lying.
  *   **Constitutive Suspicion** is the *moral logic* that often drives the Burden. Not all burden is suspicion (some is just incompetence), but all Constitutive Suspicion creates burden as a feature, not a bug.
  *   **The Edge:** If the friction is accidental, it's Burden. If the friction is a filter designed to test truthfulness, it's Constitutive Suspicion.

  ### Why This Term Matters for Your Seminar

  Using **Constitutive Suspicion** allows you to make a specific philosophical claim that "Administrative Burden" obscures:

  1.  **It is a Category Error:** The state is treating a *claim of right* (welfare) as a *claim of privilege* (exemption from prosecution).
  2.  **It is Performative:** The system does not just find fraud; it produces the category of "fraudster" by making the compliance cost so high that only the most desperate (or the most adept at gaming the system) remain.
  3.  **It Blocks Feedback:** Because the system defines dropouts as "deterred fraudsters" rather than "eligible people driven away," the state becomes blind to its own error rates.

  ### Summary for Usage
  If you need to reference this in a paper or discussion, you can frame it like this:

  > "While **administrative burden** describes the cost of compliance, it fails to capture the **epistemic inversion** inherent in modern welfare audits. I propose the term **Constitutive Suspicion** to describe regimes where verification procedures do not merely screen for fraud, but ontologically construct the claimant as a presumptive fraudster. This creates a circular justification: the hurdles generate the data used to justify the hurdles."

  This gives you the precise carving you need: it separates the *cost* (burden) from the *logic* (suspicion) and highlights the *loop* (constitutive).
