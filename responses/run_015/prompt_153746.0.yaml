  - We treat probabilities below some floor as zero, on the grounds that we only ever have maybe k bits of genuine credence in a model output anyway. Call it a credence-resolution limit.
  - When a payoff distribution has tail index alpha below 1, the mean isn't merely expensive to estimate, it doesn't exist: the running sample mean keeps jumping no matter how many samples you take, so any system that ranks options by sample mean is just printing noise with a confidence interval attached.
  - When we do have to act on tail estimates, we usually demote a soft objective to a hard constraint, because a constraint can't be bullied by a tail the way a sum can.
  - And the whole reason I trust expected values at all is that my systems make ~10^9 decisions a day, so the law of large numbers actually gets to do its work.

  Translate: the fanatic's argument (maximize expected value, payoffs unbounded, therefore pay the mugger / buy the lottery ticket / whatever the move is), and the standard replies — bounding the utility function, refusing to act on very small probabilities, concavity and diminishing returns, lexical priority or thresholds, plus anything else that's genuinely load-bearing. Treat the mugger as a single one-shot request interrupting an otherwise high-throughput system, because that's the part my brain keeps snagging on.

  Then the residue, which is what I actually want: what maps cleanly onto my machinery, what only maps if you quietly fudge it, and what has no counterpart in my vocabulary at all. Two hunches to check: (1) my intuition that the mugger's number is garbage comes from the fact that every justification I have for trusting an expected value assumes repetition, and a one-shot decision breaks that — but "you ought to do this once" doesn't seem to have a type in my vocabulary; (2) "bound the utility function" and "clip the tail" look like literally the same move to me, and I suspect philosophers think theyre different in a way I can't see.

  Finish by telling me whether the leftover is telling me my vocabulary is missing something, or that the fanaticism debate is less substantive than it sounds. Dont bother citing papers or naming philosophers, I cant check them anyway.
