      *   *Claim 1:* "The computational theory of mind says that what makes a state a pain is the job it does in the system's information processing, not what the system is made out of."
          *   *Analysis:* This is standard Functionalism/Computationalism. Pain is defined by causal role, not substrate.
          *   *Verdict:* Fair.

      *   *Claim 2:* "Substrate independence falls straight out of that: run the same computation on silicon instead of in a brain and you get the very same experience, with exactly the same moral weight."
          *   *Analysis:* Standard implication of functionalism. If function determines mind, substrate doesn't matter. Moral weight usually follows consciousness.
          *   *Verdict:* Fair.

      *   *Claim 3:* "So the thing that actually has moral status is the pattern, the program — not the animal and not the server."
          *   *Analysis:* This is where it gets tricky. Most functionalists care about the *instantiation* of the program, not the abstract type.
          *   *Verdict:* Overreach/Confusion (Type vs. Token).

      *   *Claim 4:* "And since a pattern is abstract, it doesn't matter how fast you run it, or whether you ever run it at all: a mind described in a file sitting on a hard drive is already someone, in the same way a novel is already a story before anybody reads it."
          *   *Analysis:* **Major Red Flag.** This is the "Static vs. Dynamic" or "Program vs. Process" debate. Most computationalists (and almost all ethicists) require *execution* for consciousness/suffering. A file on a disk is not suffering. This is a specific, controversial view (often associated with Tegmark or certain Platonists), not the standard computationalist view.
          *   *Verdict:* Overreach/Minority View presented as standard.

      *   *Claim 5:* "You could even spread one mind's computation across ten thousand phones, one neuron apiece, updating over a slow network, and no single phone would have anything remotely like an experience — but the mind would still be there, because what exists is the abstract computation, not any particular machine."
          *   *Analysis:* This is the "Distributed Cognition" or "China Brain" style case. Standard functionalism says yes, the system is conscious even if parts aren't. However, linking it to the "abstract computation" claim above weakens it. If the network is too slow, does consciousness stretch out in time? Most say yes, but the claim that it exists *because* it's abstract is the weak link.
