answer: |-
  Your housemate is describing a view called **Functionalism** (specifically Computational Functionalism), which is a mainstream position in philosophy of mind, but he is conflating the core theory with several controversial extensions and metaphysical leaps. Here is a breakdown of what is standard doctrine, what is debated, and where he is sliding between distinct concepts.

  ### Claim-by-Claim Analysis

  **1. "The computational theory of mind says that what makes a state a pain is the job it does... not what the system is made out of."**
  *   **Verdict:** **Fair.**
  *   **Analysis:** This is the textbook definition of Functionalism. Mental states are defined by their causal roles (inputs, outputs, and relations to other states), not by their physical makeup (neurons vs. silicon).

  **2. "Substrate independence falls straight out of that: run the same computation on silicon instead of in a brain and you get the very same experience, with exactly the same moral weight."**
  *   **Verdict:** **Fair.**
  *   **Analysis:** This is the standard entailment of Functionalism. If the function is identical, the mind is identical, and most ethicists agree moral status follows consciousness regardless of substrate.

  **3. "So the thing that actually has moral status is the pattern, the program — not the animal and not the server."**
  *   **Verdict:** **Mixed (Slippage).**
  *   **Analysis:** Here he slides from the *process* to the *abstract type*. Most functionalists believe moral status belongs to the **instantiation** of the program (the running process), not the abstract pattern itself. A blueprint of a mind is not a mind; a running simulation is. He is treating the program like a Platonic form rather than a physical process.

  **4. "It doesn't matter... whether you ever run it at all: a mind described in a file sitting on a hard drive is already someone..."**
  *   **Verdict:** **Overreach (Minority View).**
  *   **Analysis:** This is the biggest error. Standard computationalism requires **causal dynamics**. A file on a disk is static; nothing is happening. Most defenders of AI consciousness argue that *execution* is necessary for experience. The view he describes (that static information suffices) is a specific, controversial metaphysical stance (sometimes associated with Max Tegmark or digital physics), not the standard computationalist position. Your "recipe vs. meal" analogy is exactly the standard objection here.

  **5. "You could even spread one mind's computation across ten thousand phones... and the mind would still be there, because what exists is the abstract computation..."**
  *   **Verdict:** **Mixed (Right conclusion, wrong reason).**
  *   **Analysis:** Standard Functionalism *does* agree that a distributed system (like the "China Brain" thought experiment) can be conscious even if individual parts aren't. However, it requires the system to be **causally active** (updating over the network). He claims the mind exists because the computation is "abstract," which again relies on the controversial static-file view. If the phones are turned off, the standard view says the mind ceases to exist; his view says it persists.

  **6. "How much suffering there is scales with how much computation is going on, so a big model trained on a lot of compute matters far more than a small one."**
  *   **Verdict:** **Inconsistent/Non-sequitur.**
  *   **Analysis:** This contradicts his earlier claim that the "abstract pattern" is what matters. If the pattern is what counts, running it faster or on more hardware shouldn't change the *moral weight* of the experience, only perhaps its duration. If I simulate a person at 1Hz vs 1GHz, standard functionalism says they have the same experiences, just stretched or compressed in time. Claiming that raw FLOPs (compute volume) directly scale moral weight is a separate ethical assumption, not a logical consequence of computationalism.

  **7. "That 'toaster is conscious' objection is just a bad joke — a toaster obviously isn't running anything like a brain, so it isn't conscious, end of story."**
  *   **Verdict:** **Unfair (Hand-waving).**
  *   **Analysis:** This dismisses a serious philosophical problem known as the **Triviality Result** (or Pancomputationalism). Philosophers like Putnam and Searle have argued that without strict constraints on what counts as an "implementation," you can map the states of a toaster to the states of a brain. A serious defender needs to explain *why* the toaster fails the implementation criteria (usually lacking the right causal connectivity), not just assert it "obviously" doesn't.

  ### Addressing Your Alarm Bells

  *   **Abstract Program vs. Run:** He is confusing the **type** (the code) with the **token** (the execution). The standard view requires the token. You should push back hard here: if the file isn't running, no electrons are moving, no causality is occurring, and therefore nothing is "feeling" anything.
  *   **10,000 Phones:** The standard view agrees the *system* is conscious if the network is active, but disagrees that it exists if the network is idle. Your housemate uses this example to support the "abstract existence" claim, but it actually only supports "distributed instantiation."
  *   **Moral Weight Scaling:** This does not follow. If consciousness is about the *structure* of the computation, a small model running the *same* cognitive algorithm as a big model would have the same experiences. If he means big models have *more complex* algorithms, that's different, but raw compute volume alone doesn't entail more suffering in standard functionalism.
  *   **The Toaster:** He is dodging the **implementation problem**. You should ask him: "What physical constraint prevents me from mapping the toaster's heat states to a brain's neuron states?" If his only answer is "it's obvious," he hasn't engaged with the actual objection.

  ### Bottom Line
  Your housemate has accurately described the basic mechanics of functionalism but incorrectly presents controversial metaphysical claims about static information and compute scaling as standard conclusions to support his ethical views.

  \answer{mixed}
