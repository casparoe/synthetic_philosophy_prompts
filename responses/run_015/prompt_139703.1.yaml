          *   Moral weight: Doesn't follow. In fact, contradicts the static view.
          *   Toaster: Dodging. Needs a theory of implementation.
      *   *Bottom Line:* He has the basics right but conflates controversial metaphysical claims with standard functionalism to get his ethical conclusions.
