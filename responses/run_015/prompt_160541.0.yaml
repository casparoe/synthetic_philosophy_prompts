answer: |-
  No, there is no single established term that isolates this specific mechanism from standard precommitment, though the group version is formally known as "dead hand control" and the personal version is usually lumped into "Ulysses contracts."

  The distinction you are drawing is real and philosophically significant, even if the vocabulary hasn't fully caught up. Standard precommitment (the Ulysses model) assumes **continuity of values** but **failure of will**: you and future-you agree on the goal, but you don't trust future-you to stick to it when tempted. Your setup assumes **discontinuity of values**: you and future-you disagree on the goal itself. You aren't tying yourself to the mast to resist the Sirens; you are tying yourself to the mast because you believe the Sirens are actually good and you want to prevent future-you from steering toward them. This shifts the ethical framework from *self-control* to *self-paternalism*.

  Regarding your hypothesis on whether the personal and group cases are one phenomenon or two: they are structurally identical, differing only in the metaphysics of identity. In the personal case, continuity is psychological (memory, personality); in the group case, it is institutional (roles, constitutions). In both, a past agent imposes a constraint on a future agent based on the belief that the past agent's judgment is superior to the future agent's revised judgment. The "dead hand" complaint in your student council is the exact political analogue of your personal rule. The only difference is that we accept institutional continuity as a fiction necessary for stability, whereas personal identity feels more intimate, making the override feel like a betrayal rather than governance. Since the logic is the same—past authority overriding present autonomy based on conflicting definitions of the good—I propose we unify them under the term **Diachronic Paternalism**.

  **Definition:** Diachronic Paternalism is the act of an agent (individual or collective) at Time A imposing constraints on an agent at Time B, not to prevent weakness of will, but to prevent a legitimate change in values or judgment that the Time A agent believes is erroneous or harmful.

  This distinguishes it from ordinary precommitment (which targets akrasia), from stubbornness (which lacks the mechanism of binding), and from promises (which rely on external enforcement or honor rather than structural inability).

  To your final two questions:

  1.  **Does it matter if the later self ends up grateful?**
      It matters for *validation*, but not for *authority*. If future-you is grateful (retroactive endorsement), it suggests the Diachronic Paternalism was beneficial, which softens the ethical violation of autonomy. However, it does not prove the past self had the *right* to bind the future self; it only proves they got lucky or were wise. If future-you is *not* grateful, the act remains paternalistic, but the lack of gratitude highlights the cost: you have sacrificed future autonomy for past judgment. In the student council case, if the current members succeed in suspending the rule, their lack of gratitude confirms the "dead hand" is choking current needs.

  2.  **Does it matter whether the earlier self was actually *right* about what's good?**
      Objectively, yes; procedurally, no. If the earlier self was right (in-state school was actually the better life choice), the outcome is better, but the *mechanism* remains a violation of the future self's sovereignty. Philosophy generally holds that autonomy is valuable even when used to make "worse" choices. If we justify Diachronic Paternalism solely on the earlier self being right, we argue that truth outweighs autonomy. If we justify it only when the later self is grateful, we argue that welfare outweighs autonomy. The tension you feel is the conflict between these two values: the stability of good norms versus the freedom of present judgment.
