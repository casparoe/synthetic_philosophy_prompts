answer: |-
  Here is the plan. I've run variations of this with first-years and grad students; the difference between a successful run and a train wreck is usually the strictness of the "information restriction" and the clarity of the scoring key.

  ### Part 1: Brainstorming & Selection

  **Concept 1: The Human Neural Net.**
  Students stand in rows representing layers; they pass tokens (words) forward, applying simple transformation rules written on cards.
  *Rejection:* Too much logistical friction. You spend 20 minutes managing bodies and dropped cards. It emphasizes *architecture* over *semantics*, which distracts from the Hofstadter/Searle distinction.

  **Concept 2: The Black Box Dictionary.**
  Students get a dictionary and a text. They must translate without speaking. If they look up a word, they lose points.
  *Rejection:* This simulates resource scarcity, not architectural shallowness. It encourages memorization rather than pattern matching, which is the opposite of how modern MT works.

  **Concept 3: The Sliding Window (Assembly Line).**
  Groups of four. A sentence is cut into four strips. Student 1 translates strip 1, passes it to Student 2 (who sees strip 2 + Student 1's output), and so on. No one sees the full source sentence until the end.
  *Selection:* **This is the one.** It physically enforces the "locality" constraint of early statistical MT. It creates a "system" where the group intelligence is bottlenecked by information flow, mirroring the lack of long-range dependency in shallow models.

  **Concept 4: The Adversarial Translator.**
  One student writes a sentence, another translates it, a third guesses the original. They iterate to minimize error.
  *Rejection:* Too open-ended. It blurs the line between *translation* and *communication*. We want them to feel the constraints of a *machine*, not the flexibility of a *conversation*.

  ---

  ### Part 2: The Activity Design ("The Omm Engine")

  **The ConLang: Omm**
  Simple SVO structure. No conjugation. Meaning is heavily dependent on particles and word order.

  **The Corpus (Print this on Handout A)**
  *Instructions: You may only use mappings found in this list. If a word is not listed, use the closest semantic match.*

  1.  *Kora* = The / A
  2.  *Vex* = Man / Person
  3.  *Luma* = Woman / Person
  4.  *Talo* = House / Building
  5.  *Rina* = Sees / Looks at
  6.  *Pish* = Goes / Moves
  7.  *Kalo* = Bad / Dangerous
  8.  *Sula* = Good / Safe
  9.  *Mera* = Not / No
  10. *Zep* = And / Then
  11. *Olo* = Water / Liquid
  12. *Flin* = Flows / Runs
  13. *Bran* = Money / Value
  14. *Drek* = Eats / Consumes
  15. *Nim* = Time / Now
  16. *Ka* = (Particle: indicates statement of fact)
  17. *Vi* = (Particle: indicates future/intent)
  18. *Kora Vex Rina Kora Luma Ka* = The man sees the woman.
  19. *Kora Luma Pish Kora Talo Vi* = The woman goes to the house.
  20. *Kora Olo Flin Ka* = The water flows.

  **The Test Sentences (Handout B)**
  *Phase 1 (Restricted):* Translate using Corpus only.
  *Phase 2 (Unrestricted):* Translate using Corpus + World Knowledge + Context Notes.

  **Item 1 (The Fluency Trap):**
  *Omm:* `Kora Bran Flin Ka`
  *Corpus Logic:* `Bran` = Money, `Flin` = Flows (from Water).
  *Student Output:* "The money flows." (Smooth, idiomatic, statistically supported by corpus).
  *Correct Meaning:* "The market is liquid." (Or simply: "Money is circulating.")
  *Why it traps them:* "Money flows" is perfect English. They will defend it. It is technically wrong because `Flin` implies physical liquid movement in Omm, but the *intent* is economic circulation. The corpus rewards the physical mapping.

  **Item 2 (The Relevance Trap - Phase 2 Only):**
  *Omm:* `Kora Vex Pish Kora Talo Vi`
  *Context Note:* The man is homeless. He is looking at a mansion. He says this sarcastically.
  *Student Task:* Translate.
  *The Trap:* Even knowing he is homeless and sarcastic, the **Scoring Key** (provided by you) is: *"The man goes to the house."*
  *Why they fail:* If they translate the *intent* ("The man wishes he had a house" or "The man jokes about the house"), they get 0 points on the scoring rubric because the words don't match the Reference Translation. If they translate the *literal tokens*, they get full points.
  *Lesson:* The optimization metric (surface overlap) punishes understanding relevance. The system *cannot* output the relevant meaning without being penalized for "hallucination."

  **The Information Restriction (The Assembly Line)**
  *   Groups of 4.
  *   Sentence strips are folded.
  *   Student 1 opens Fold 1 (Subject). Translates. Passes paper.
  *   Student 2 opens Fold 2 (Verb). Sees Student 1's translation. Translates Verb. Passes.
  *   Student 3 opens Fold 3 (Object). Sees previous. Translates. Passes.
  *   Student 4 opens Fold 4 (Particle). Assembles final sentence.
  *   *Rule:* You cannot unfold ahead. You cannot speak to other groups.

  **The Scoring Scheme (Handout C)**
  *   **Metric:** Word Overlap Score.
  *   **Reference Translation:** Provided *after* they finish.
  *   **Calculation:** +1 point for every word in your translation that appears in the Reference Translation.
  *   **Penalty:** -2 points for every word added that is *not* in the Reference Translation (punishes "interpretation").
  *   **Goal:** Maximize score.

  ---

  ### Part 3: Logistics & Timeline (75 Minutes)

  **Print List:**
  1.  **Handout A (Corpus):** 16 copies.
  2.  **Handout B (Test Sentences & Strips):** 4 sets (cut into strips for Phase 1, full for Phase 2).
  3.  **Handout C (Scoring Sheet):** 4 copies.
  4.  **Instructor Key:** For you to grade instantly.

  **Timeline:**

  *   **00:00 – 00:10 (Intro & Setup):**
      *   Read the Script (below).
      *   Divide into 4 groups of 4.
      *   Hand out Corpus (A) and Phase 1 Strips (B).
      *   **Crucial:** Do *not* explain the Scoring Scheme yet. Tell them: "Your goal is to produce the best translation. I will judge quality at the end."

  *   **00:10 – 00:30 (Phase 1: The Engine):**
      *   Students run the Assembly Line on 3 sentences (including the Fluency Trap `Kora Bran Flin Ka`).
      *   Circulate. Enforce the "No Unfolding" rule strictly. If a student peeks, disqualify their group (playfully but firmly).
      *   *Teacher Move:* Watch for the "Money Flows" translation. Nod approvingly. Reinforce their confidence.

  *   **00:30 – 00:40 (Scoring & Shock):**
      *   Reveal Handout C (Scoring Scheme).
      *   Reveal Reference Translations.
      *   Groups calculate scores.
      *   *Reveal:* "Money Flows" gets full points. "Market is Liquid" gets penalized for adding words.
      *   Brief discussion: "Why did the safe bet win?"

  *   **00:40 – 00:55 (Phase 2: The World Model):**
      *   Hand out Phase 2 Sentences (full sentences, not strips).
      *   Give Context Notes (including the Homeless Man sarcasm).
      *   Rule Change: "You may use any world knowledge. You may interpret intent."
      *   They translate the Relevance Trap item (`Kora Vex Pish Kora Talo Vi`).
      *   Most will write: "The man goes to the house" (because they fear the penalty).
      *   Some brave ones will write: "The man jokes about the house."

  *   **00:55 – 01:05 (Final Scoring):**
      *   Reveal Reference Translation for Phase 2: *"The man goes to the house."*
      *   Calculate scores.
      *   The "brave" students who captured the meaning get penalized heavily for "hallucinating" words like 'jokes'.
      *   The "shallow" students win.

  *   **01:05 – 01:15 (Debrief):**
      *   Map to Complaint (1) and (2).
      *   Address the "You Understand" objection.

  ---

  ### Part 4: The Script

  **Read this exactly. Tone: Bureaucratic, slightly cold.**

  "Welcome to the Translation Engine. For the next hour, you are not students. You are components in a processing system. Your goal is to maximize your output score.

  You will work in groups of four. You will receive a Corpus of known mappings. You will receive Source Sentences in Omm.

  **Rule 1:** In Phase 1, you will process sentences sequentially. Student 1 sees the first chunk. Student 2 sees the second. You may not look ahead. You may not communicate verbally. You may only pass the paper.

  **Rule 2:** In Phase 2, restrictions are lifted. You have full context.

  **Rule 3:** I will evaluate your output against a Reference Translation. I am not evaluating 'truth.' I am evaluating overlap. Adding words that are not in the Reference costs you points.

  Do not ask me about the meaning of 'understanding.' It is not a metric. Begin."

  **What NOT to explain in advance:**
  *   Do not tell them the Scoring Scheme penalizes interpretation. Let them discover that "being right" loses points.
  *   Do not tell them the Corpus is inconsistent. Let them infer it.
  *   Do not explain *why* the Assembly Line exists. Just say "Protocol."

  ---

  ### Part 5: The Debrief (Mapping the Complaints)

  **1. The No-World-Model Complaint (Hofstadter's Surface Level)**
  *   *Moment:* Phase 1, "The Money Flows."
  *   *Discussion:* "You translated 'flows' because the corpus linked `Flin` to `Water`. You had no model of economics. You filled the gap with the statistically smoothest option."
  *   *Takeaway:* This is Complaint (1). The system lacks facts. But notice: you got full points. The system *works* without facts.

  **2. The No-Sense-of-Relevance Complaint (The Deeper Cut)**
  *   *Moment:* Phase 2, The Homeless Man.
  *   *Discussion:* "In Phase 2, you *had* the facts. You knew he was homeless. You knew it was sarcasm. Yet, the 'winning' translation was the literal one. Why?"
  *   *Answer:* "Because the scoring metric (BLEU/Overlap) cannot measure relevance. It can only measure token matching."
  *   *Takeaway:* This is Complaint (2). Even if you *give* the system the world model, if the optimization function is shallow (surface overlap), the output *must* be shallow. The problem isn't just missing data; it's that the *goal* of the system is disconnected from the *point* of language.

  **3. The Understanding Question**
  *   "Did you understand Omm?"
  *   "Yes, individually. But the *Group* did not. The Group produced shallow output despite containing deep agents."
  *   "This is the System Reply to Searle. The room understands, but the man in the room doesn't. Here, the students understand, but the Engine doesn't."

  ---

  ### Part 6: Blunt Assessment (Failure Modes & Limits)

  **1. Predictable Failure Mode: The "Hack"**
  *   *What happens:* In Phase 2, students will realize the scoring is rigged. They will stop trying to translate and start trying to guess *your* key. They will write "The man goes to the house" not because they think it's right, but because they think it's what you want.
  *   *Why this is actually good:* This *is* the point. They are optimizing for the loss function, not the meaning. This is exactly what neural nets do.
  *   *In the moment:* If they call you out ("This is stupid, we know the real meaning"), agree with them. "Exactly. The metric is broken. But you are still feeding it."

  **2. The "You Understand" Objection**
  *   *The Objection:* A sharp student will say: "This activity proves nothing. We *do* have world models. We *do* understand relevance. You just forced us to act like machines. You haven't simulated a lack of understanding; you've simulated a constraint on expression."
  *   *How damaging is it?* High. It threatens to turn the seminar into "The teacher made us play a rigged game."
  *   *Is there a fix?* No. You cannot make them not understand.
  *   *What to say:* "You are absolutely right. And that is why the Chinese Room argument is hard to kill. But look at the *output*. The output is indistinguishable from a system that doesn't understand. If I only see the paper you handed in, I cannot tell if you understood the joke or not. The *behavior* is shallow. Hofstadter's worry is that we are building systems that produce this paper without you inside the box. The activity isn't proving you don't understand. It's proving that **successful performance does not require understanding.**"

  **3. One Feature This Cannot Reproduce**
  *   *The Limitation:* Real MT systems don't have a "Phase 2." They don't get to lift the restriction. They are *structurally* blind. In this activity, the blindness was a rule I imposed.
  *   *The Fix:* Acknowledge this. "In you, the blindness was temporary. In Google Translate, the blindness is architectural. You felt the frustration of knowing more than you could say. The machine doesn't feel the frustration. It just outputs 'The man goes to the house' and sleeps."

  ---

  ### Final Teacher-to-Teacher Note
  The success of this hinges on the **Scoring Reveal**. If you explain the scoring before Phase 2, they will game it intellectually. If you let them translate honestly in Phase 2, and *then* punish them for it with the scoring key, you create a genuine moment of cognitive dissonance. That dissonance is where the learning lives. Protect that moment. Don't let them off the hook.
