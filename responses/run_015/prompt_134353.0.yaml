answer: |-
  ### Spec Sheet: Conceivability-to-Possibility Link for P-Zombies

  #### I. Test Cases & Difficulty Ratings
  Any viable theory must account for the conceivability of these scenarios without contradicting empirical data.

  1.  **Full Behavioral Duplicates (Standard P-Zombie)**
      *   **Setup:** Physically identical to a human, behaves identically, lacks phenomenal experience.
      *   **Hard Case:** Requires explaining how the physical base fully determines behavior while leaving consciousness contingent. If physics is causally closed, the "extra" fact of consciousness becomes causally inert (epiphenomenal), which is intuitively costly.
  2.  **Partial Zombies (Affect Missing)**
      *   **Setup:** Duplicate has cognitive states but no hedonic tone (pain behavior without suffering).
      *   **Hard Case:** Affect drives reinforcement learning. If the zombie lacks negative valence, it is unclear how it learns to avoid harm identically to the conscious twin over time without a functional difference.
  3.  **Partial Zombies (Self-Consciousness Missing)**
      *   **Setup:** Conscious states exist, but no higher-order awareness or "I"-thoughts.
      *   **Hard Case:** Reportability relies on self-monitoring. If the zombie lacks self-consciousness, it cannot report its states. If it *can* report, it arguably possesses the functional equivalent of self-consciousness, collapsing the distinction.
  4.  **Inverted Spectrum Twins**
      *   **Setup:** Qualia are inverted (red looks like green) but functional roles and behavior remain identical.
      *   **Hard Case:** Color discrimination tasks often rely on similarity judgments. If red *feels* like green, similarity spaces might shift, leading to behavioral divergence in nuanced tasks (e.g., aesthetic preference or reaction time).
  5.  **Cognitive Inaccessibility (Overflow Scenarios)**
      *   **Setup:** Phenomenal states exceed cognitive access (e.g., rich visual field not fully attended).
      *   **Hard Case:** If consciousness can exist without access, a zombie could lack the "overflow" while retaining access systems. This makes the zombie easier to conceive but harder to distinguish behaviorally, threatening the claim that the missing element is significant enough to refute physicalism.

  #### II. Non-Collapsible Distinctions
  The theory must maintain these separations or face immediate refutation.

  1.  **Conceivable vs. Imaginable**
      *   **Reasoning:** One can conceive of a 1000-sided polygon without forming a mental image. If the link relies on *imagery*, it fails for abstract structural concepts. The zombie argument relies on conceptual coherence, not pictorial visualization.
  2.  **Conceivable vs. Metaphysically Possible**
      *   **Reasoning:** "Water is not H2O" is conceivable but metaphysically impossible (Kripke). The theory must explain why consciousness escapes the "necessary a posteriori" trap that traps identity statements like Water=H2O. Collapsing these makes the argument trivial and false.
  3.  **Epistemic Gap vs. Modal Gap**
      *   **Reasoning:** An explanatory gap (we don't know *how* physics produces mind) does not entail a modal gap (mind *could* exist without physics). A theory that treats ignorance as possibility commits a modal fallacy.

  #### III. Consistency Constraints (Empirical Fit)
  The theory cannot contradict these findings without becoming *ad hoc*.

  1.  **Neural Sufficiency:** Cannot claim that identical neural states fail to produce identical behavioral outputs in the absence of consciousness.
  2.  **Unconscious Processing:** Must accommodate data on blindsight, priming, and sleepwalking where complex processing occurs without reported awareness. The "zombie" systems must match these capabilities.
  3.  **Evolutionary Continuity:** Cannot posit consciousness as a sudden, non-physical insertion. If zombies are possible, consciousness is not selected for by physical advantages, requiring an explanation for its prevalence that doesn't violate naturalism.

  #### IV. Critical Tensions

  **Jointly Unsatisfiable Desiderata:**
  1.  **Causal Relevance:** Consciousness makes a difference to behavior (non-epiphenomenal).
  2.  **Metaphysical Possibility of Zombies:** Physical duplicates can exist without consciousness.
  *   **Conflict:** If physics is causally closed, and the zombie behaves identically without consciousness, then consciousness does no causal work. If consciousness *does* cause behavior, the zombie (lacking it) could not behave identically. You generally must sacrifice one.

  **Most Damaging Desideratum to Rival Accounts:**
  *   **The Kripkean Constraint (Explaining why Consciousness $\neq$ Water/H2O):**
      *   **Damage:** This is the physicalist's primary choke point. Physicalist accounts (Type Identity, Functionalism) struggle to explain why we can't dismiss the zombie intuition as a modal illusion similar to "Water $\neq$ H2O." If a theory cannot distinguish the mind-body link from standard theoretical identities, the zombie argument collapses.

  #### V. Brief Evaluation of Views

  *   **Physicalism:** Fails the **Metaphysical Possibility** desideratum. It accepts the Epistemic Gap but denies the Modal Gap, arguing zombies are conceivable but impossible (like Water $\neq$ H2O).
  *   **Property Dualism:** Passes the **Metaphysical Possibility** desideratum but fails **Causal Relevance**. It secures the zombie possibility by making consciousness a non-physical property, usually rendering it epiphenomenal to preserve physical causal closure.
  *   **Epistemic-Gap-Only:** Passes **Consistency Constraints** and **Distinctions** but fails to deliver the ontological conclusion. It admits the intuition is robust but refuses to bridge the gap to metaphysical possibility, leaving physicalism intact.
