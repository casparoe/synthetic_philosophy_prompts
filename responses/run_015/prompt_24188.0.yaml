answer: |-
  Here is the 15-Minute Triage Procedure. It is not a math formula; it is a hurdle system. A story must clear every hurdle to run. If it fails one, it stops. This handles the "incommensurable virtues" problem by making *evidence* a higher hurdle than *simplicity*. A simple story with no evidence dies. A complex story with physical proof lives.

  ### The 15-Minute Triage Procedure

  **Minute 0-3: The Source Anchor (Competence & Access)**
  *   **Question:** Does the person telling me this *know* it, or do they *feel* it?
  *   **Good Answer:** "They were in the room," "They signed the check," "They have the email."
  *   **Bad Answer:** "Everyone knows," "It makes sense," "They told their friend who told me."
  *   **Stop Rule:** If your primary source has no direct access to the decision/event, **DON'T RUN IT** as fact. You can report "Rumors suggest," but you cannot assert the explanation.

  **Minute 3-6: The Motive Scan (Incentive Alignment)**
  *   **Question:** Who benefits if I print Version A vs. Version B?
  *   **Good Answer:** "The Coach benefits if the budget is blamed (not his fault). The Principal benefits if weather is blamed (not her fault)."
  *   **Bad Answer:** "No one has a reason to lie." (Everyone has a reason).
  *   **Stop Rule:** If the only person supporting the explosive claim stands to gain significantly from it *and* has no physical proof, **ASK ADVISOR**. This is where libel lives.

  **Minute 6-9: The Physical Anchor (The "Hard" Virtue)**
  *   **Question:** Is there a piece of evidence that exists independently of human memory? (Text, email, receipt, timestamped photo, the actual lab report).
  *   **Good Answer:** "I have the screenshot," "I saw the document."
  *   **Bad Answer:** "They said they have a text," "It's on Snapchat (ephemeral)."
  *   **Stop Rule:** If the story relies entirely on testimony about a document you haven't seen, **DON'T RUN IT** as fact. This is where "Simplicity" usually lies to you. The simplest story is often "He said/She said." The *true* story usually leaves a paper trail.
      *   *Note on Misfire:* This step prioritizes "Scope" (fits the evidence) over "Simplicity." If the paper trail makes the story messy, the messiness is a feature, not a bug.

  **Minute 9-12: The Bias Flip (Confirmation Check)**
  *   **Question:** If the roles were reversed (e.g., the accused is my friend, the accuser is my enemy), would I still find this explanation "best"?
  *   **Good Answer:** "Yes, the evidence holds up even if I hate the person."
  *   **Bad Answer:** "Well, it makes sense because he's always sketchy."
  *   **Stop Rule:** If your gut feeling changes when you swap the characters, **ASK ADVISOR**. You are currently reasoning backward from a conclusion you like.

  **Minute 12-15: The Risk Weigh (Consequence)**
  *   **Question:** If we are wrong, who gets hurt more: The reputation of a private student/staff member, or the readers' confusion?
  *   **Good Answer:** "Readers get annoyed we didn't have the scoop."
  *   **Bad Answer:** "A student gets expelled," "A teacher gets fired," "The paper gets sued."
  *   **Stop Rule:** If the cost of being wrong is permanent damage to a person, and your evidence is not 100% physical/corroborated, **DON'T RUN IT**. Journalism is about truth, but school journalism is about *survival* so you can print again next week.

  ---

  ### Where This Procedure Will Misfire On You

  You asked for honesty about the limits. Here is where the logic breaks:

  1.  **The "Hidden Variable" Problem:** IBE only works on *available* explanations. If the real reason the trip was cancelled was that the Superintendent called the Principal (a call no one saw), your procedure will select the "Budget" explanation as the "Best" because it fits the known facts better than "Weather." You will be logically sound and factually wrong. The procedure cannot find evidence that doesn't exist in your pile of notes.
  2.  **The "Complex Truth" Trap:** Sometimes the truth is a conspiracy. Sometimes it's a coincidence. This procedure favors explanations with physical anchors. If the truth is a verbal agreement to lie (which leaves no paper trail), this procedure will tell you to kill the story. You will miss big scandals that are well-hidden.
  3.  **The Bias Blind Spot:** The "Bias Flip" (Minute 9) relies on your honesty. If you are deeply biased, you will lie to yourself during that minute. The procedure cannot stop you from cheating on the test.

  ---

  ### Running The Cases

  Here is the procedure applied rigidly. I am committing to the outcome.

  #### Case 1: The Spring Field Trip (Weather vs. Budget)
  *   **Source Anchor:** Admin (Direct access to decision). Coach (Direct access to budget?). Students (No access, saw a text). **Pass:** Admin and Coach are anchors. Students are hearsay.
  *   **Motive Scan:** Admin hides budget cuts (looks bad). Coach blames budget (deflects from team performance?). Students want drama. **Flag:** Both adults have motive to lie.
  *   **Physical Anchor:** Admin has the official cancellation notice (Weather). Students *claim* a text exists but you haven't seen it. Coach has... words. **FAIL.** You do not have the text. You have hearsay about a text.
  *   **Bias Flip:** If the Principal was my mom, would I believe the students? Probably not without the screenshot.
  *   **Risk Weigh:** If you print "Budget" and it's wrong, the Principal shuts the paper down. If you print "Weather" and it's wrong, students are annoyed.
  *   **The Commitment:**
      *   **What Likely Happened:** The **Budget** explanation is the *Inference to the Best Explanation*. It explains the Admin's defensiveness, the Coach's anger, *and* the students' claim of a text. The "Weather" story is too simple; it ignores the Coach's insider knowledge.
      *   **What You Print:** **You do not print the Budget claim.** You print: *"The trip was cancelled due to weather conditions, according to the administration. However, concerns regarding funding were raised by staff."*
      *   **Why:** You failed the Physical Anchor. You cannot print a lie (Budget as fact) even if it's likely true, because you can't prove it. This is the "don't want to print" outcome: You know the real story, but the procedure forces you to bury it to save the paper.

  #### Case 2: The Lab Report (Cheating vs. Sick)
  *   **Source Anchor:** Accuser (Saw the report?). Accused (Was home). **Pass:** Both have access to their own actions.
  *   **Motive Scan:** Accuser is a friend/study group (Why accuse a friend? Jealousy? Falling out?). Accused wants to avoid expulsion. **Flag:** Accuser acting "weird" suggests interpersonal conflict, not academic integrity.
  *   **Physical Anchor:** The Lab Report (exists). The "Sick" claim (no doctor's note mentioned). The "Copying" claim (no side-by-side comparison provided to you yet). **FAIL.** You haven't seen the reports to verify similarity.
  *   **Bias Flip:** If the Accuser was my enemy, would I think they are snitching out of spite? Yes.
  *   **Risk Weigh:** If you print "Student Cheated" and it's wrong, that student's record is ruined. If you print nothing, the rumor mill spins.
  *   **The Commitment:**
      *   **What Likely Happened:** The **Jealousy/Conflict** explanation is the *Best Explanation*. It accounts for the "weird behavior," the timing, and the fact that friends in study groups often produce similar work without cheating. The "Cheating" story requires assuming malice without physical proof of plagiarism.
      *   **What You Print:** **You print nothing about the accusation.** You do not name the student. You do not validate the accuser.
      *   **Why:** You failed the Physical Anchor (no proof of plagiarism) and the Risk Weigh is too high (expulsion). Even if they *did* cheat, you cannot prove it in 15 minutes.

  ---

  ### What This Procedure Can't Do For You

  1.  **It Can't Make You Brave:** In Case 1, the procedure tells you the Budget story is likely true but too risky to print as fact. If you want to take down the administration, this procedure tells you to wait. It prioritizes institutional survival over revolutionary truth. If your goal is to burn the school down, this procedure is a cage.
  2.  **It Can't Fix Bad Sources:** If your best source is a liar who is convincing, the "Motive Scan" might miss it. Garbage in, garbage out.
  3.  **It Can't Resolve Moral Dilemmas:** In Case 2, if the kid *did* cheat and gets away with it, that's unfair to the honest students. This procedure protects the accused from the paper, but it doesn't protect the grade curve. It solves *your* liability, not the school's morality.

  **Final Order:** Use the hurdles. If you fail the Physical Anchor, you don't have a story, you have a rumor. Print the rumor as a rumor, or kill it. Do not let "Simplicity" convince you that a story without proof is true. The simplest story is usually the one someone invented to hide the complex truth.
