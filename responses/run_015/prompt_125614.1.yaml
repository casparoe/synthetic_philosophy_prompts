      *   *Definition of Moral Saint:* Someone whose every action is as morally good as possible (or whose life is dominated by moral concerns).
      *   *Two Types:*
          1.  *Loving Saint:* Finds happiness in being moral. Moral interests *are* their personal interests. (e.g., Mother Teresa type, but potentially more extreme).
          2.  *Rational Saint:* Sacrifices personal interests for moral duty. Recognizes non-moral desires but suppresses them for the greater good.
      *   *Objections/Critiques:*
