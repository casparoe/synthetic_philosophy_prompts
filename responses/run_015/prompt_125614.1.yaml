      *   *Claim:* "Leaving them one-dimensional and dull." -> *Accurate.* Wolf uses terms like "boring," "lacking humor."
      *   *Claim:* "Morality demands this total suppression of the self." -> *Debatable.* Wolf questions whether morality *demands* this, or whether the *concept* of sainthood implies it. She argues we shouldn't accept a moral theory that demands this.
