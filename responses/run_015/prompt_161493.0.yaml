prompt: |-
  I'm an analyst on a growth team at a mid-size app company — I run maybe 3-5 A/B tests a month and I write the one-slide readout that decides whether we ship. Every couple of months somebody turns up with a Simpson's-paradox-in-the-wild: variant B wins on the topline conversion number but loses in every segment we slice by, or the reverse. I've read all the usual rationalist-blog posts on this and I know the kidney-stone / Berkeley admissions warhorses, so skip the 101 — but also, nobody here has time for "draw the DAG" as an actual practice, and my teammates know SQL and at most one regression.

  Can you write me a decision procedure I can run in ~20 minutes when this happens? The questions in order; what counts as a good enough answer to each; the point where the procedure stops and says "this isn't a paradox, its a measurement or data-integrity problem"; and the point where it hands off to me or the PM because the remaining question is about what we're going to do, not about the numbers.

  Things it has to handle: (1) slicing on something that happens after assignment (e.g. "users who finished onboarding") versus something fixed at assignment (device, country, week); (2) our traffic mix drifts mid-test, so segment sizes aren't stable; (3) we mostly report odds ratios out of a logistic regression, and I've heard somthing about non-collapsibility — that the adjusted odds ratio moves away from 1 even with clean randomization and zero confounding. If that's right, tell me how the procedure distinguishes that from a genuine sign reversal; if I've got it wrong, correct me; (4) choosing which population to standardize to when we're only going to ship to one segment next quarter.

  Run it on three cases: (a) B wins overall, loses on both iOS and Android, split and mix look fine; (b) B wins overall, loses among users who completed onboarding and among users who didn't; (c) B wins overall, loses in every country, and we can only launch in one country. At least one of those should end with an answer I don't want to hear. And be explicit about what the procedure can't settle — I'd rather say "this needs someone who actually does causal inference" than ship on a number I can't defend in the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Analyst on a growth team at a mid-size app company.
      *   **Task:** Runs 3-5 A/B tests/month, writes the one-slide readout.
      *   **Problem:** Encounters Simpson's Paradox (SP) every couple of months (Variant B wins overall, loses in segments, or vice versa).
      *   **Constraints:**
          *   No "Causal Inference 101" (knows the classic examples).
          *   No "Draw a DAG" (too theoretical/time-consuming).
          *   Team skills: SQL, basic regression (logistic), no advanced stats.
          *   Time limit: ~20 minutes to run the procedure.
          *   Output needed: A concrete decision procedure (steps, pass/fail criteria, handoff points).
          *   Specific technical concerns: Post-assignment slicing, traffic mix drift, non-collapsibility of odds ratios, standardization for specific launch segments.
          *   Test cases: Three specific scenarios to run the procedure against.
          *   Tone: Pragmatic, direct, actionable, acknowledging limitations.

  2.  **Deconstruct the Technical Challenges:**
      *   **Simpson's Paradox (SP) vs. Measurement Error:** Real SP is rare. Usually, it's data integrity, peeking, or post-treatment bias. The procedure needs to filter out the noise first.
      *   **Post-Assignment Slicing:** Slicing on "completed onboarding" is conditioning on a collider/mediator. This *creates* bias, it doesn't reveal the truth. This is a critical distinction.
      *   **Traffic Mix Drift:** If the proportion of high-converting users shifts between control and treatment *after* randomization, randomization failed (or there was differential drop-out).
      *   **Non-Collapsibility:** Odds ratios (OR) are non-collapsible. The marginal OR $\neq$ the conditional OR even without confounding. This can *look* like SP but isn't. Risk Ratios (RR) or Risk Differences (RD) are collapsible. This needs to be addressed.
      *   **Standardization:** If launching to only one segment, the overall metric might be irrelevant. Need to re-weight.

  3.  **Drafting the Decision Procedure (The "20-Minute Triage"):**
      *   *Goal:* Distinguish between "Real Heterogeneous Treatment Effect," "Post-Treatment Bias," "Randomization Failure," and "Non-Collapsibility Artifact."
      *   *Step 1: Data Integrity & Randomization Check.* (5 mins). If randomization broke, stop.
      *   *Step 2: The "When" Check.* (5 mins). Is the slice pre- or post-treatment? If post, the segment analysis is invalid for causal claims.
      *   *Step 3: The Metric Check.* (5 mins). Are we using Odds Ratios? Switch to Risk Difference to check for non-collapsibility.
      *   *Step 4: The Business Decision.* (5 mins). Who are we shipping to? Standardize accordingly.

  4.  **Refining the Steps (Self-Correction/Detailing):**
      *   *Correction on Non-Collapsibility:* The user asked if OR moves away from 1 with zero confounding. Yes, it does. The marginal OR is closer to 1 than the conditional ORs if there is heterogeneity. Wait, actually, for OR, the marginal is usually *attenuated* towards 1 compared to conditional. But SP implies a *reversal* of sign. Non-collapsibility rarely causes a full sign reversal unless there's massive heterogeneity. I need to be precise here. Actually, non-collapsibility explains *magnitude* differences, not usually *direction* reversals (Sign Reversal). Sign reversal is almost always confounding or post-treatment bias. I need to make sure the procedure distinguishes "Magnitude shift due to math" vs "Sign shift due to bias."
      *   *Correction on Post-Treatment:* If slicing on "completed onboarding," and the treatment *affects* onboarding completion, slicing creates bias. This is the most common cause of "SP" in growth teams.
      *   *Traffic Mix:* Check SRM (Sample Ratio Mismatch) per segment.

  5.  **Developing the Test Cases:**
      *   *Case (a) B wins overall, loses on iOS/Android.* Pre-treatment slices. Randomization holds. This is likely real heterogeneity + mix effect. Decision: Weighted average based on future traffic.
      *   *Case (b) B wins overall, loses on Onboarding Yes/No.* Post-treatment slice. This is the trap. The segment analysis is bogus. Trust the overall (if randomization held).
      *   *Case (c) B wins overall, loses in every country.* Launching in one country. This is the "unpleasant answer." If it loses in *every* country, why does it win overall? Mathematically impossible unless there's a 3rd variable (e.g., device mix within country) OR the "Overall" includes a segment not in the country breakdown (e.g., "Unknown"). Or, it's non-collapsibility (unlikely to reverse sign). Wait, if it loses in *every* country, it *cannot* win overall unless there is a segment missing from the country breakdown (e.g., "Unknown Country" which is huge and winning). If "Unknown" is excluded from the country slice but included in overall, that's the culprit. *Correction:* If it loses in *every* defined country, but wins overall, there must be a hidden segment (e.g., "Row" or "Unassigned") that is massive and winning. If all traffic is accounted for, this is mathematically impossible for Risk Difference, but possible for Odds Ratios due to non-collapsibility? No, sign reversal on OR due to non-collapsibility alone is extremely rare. It's usually a data integrity issue (SRM) or a missing segment. I will construct Case (c) to highlight the "Missing Segment/Data Integrity" or the "Wrong Population" issue. Let's make it the "Wrong Population" case: We win overall because of Country X, but we are launching in Country Y. The answer is "Don't ship."

  6.  **Addressing the Specific Questions:**
      *   *What counts as a good enough answer?* (e.g., p-value > 0.05 on SRM check).
      *   *Stop point (Measurement problem)?* If SRM fails or post-treatment slicing is the cause.
      *   *Handoff point (PM decision)?* When the stats are clean, but the business trade-off (who do we target?) remains.
      *   *Non-collapsibility:* Explain it clearly. ORs lie when aggregating. Use Risk Difference for the paradox check.
      *   *Standardization:* Re-weight the results to the target launch population.

  7.  **Final Review against Constraints:**
      *   ~20 mins? Yes, the steps are SQL queries and quick checks.
      *   No DAGs? Yes, using "Pre vs Post" logic instead.
      *   SQL/Regression friendly? Yes.
      *   Tone? Professional, direct, slightly cynical (appropriate for the context).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the pain.
      *   *The Procedure:* 4 Gates.
      *   *Gate 1: Randomization Integrity (SRM).*
      *   *Gate 2: The "When" Test (Pre vs Post).*
      *   *Gate 3: The Metric Test (OR vs RD).*
      *   *Gate 4: The Launch Population (Standardization).*
      *   *The Test Cases:* Walk through (a), (b), (c) using the gates.
      *   *The "I Don't Know" Box:* When to call an expert.

      *(Self-Correction during drafting Case C)*: If B wins overall but loses in *every* country, and countries sum to 100% of traffic... that is mathematically impossible for linear metrics (RD, Mean). It *is* possible for ORs due to non-collapsibility, but rare to reverse sign. It is *also* possible if there is a "Unknown" bucket. I will frame Case (c) as the "Don't Ship" scenario because the overall win is driven by a country you aren't launching in. That's the most painful business truth.

      *(Refining Non-Collapsibility)*: I need to be careful. Non-collapsibility means $OR_{marginal} \neq OR_{conditional}$. It does not typically cause $OR_{marginal} > 1$ while all $OR_{conditional} < 1$ unless there is *also* confounding (imbalance in the covariate). Pure non-collapsibility without confounding (balanced covariates) keeps the direction the same, just changes magnitude. If the covariates are imbalanced (which happens with drift), then it's confounding + non-collapsibility. I will instruct the user to switch to Risk Difference (RD) to remove non-collapsibility from the equation. If the paradox persists in RD, it's real confounding or bias.

  9.  **Final Polish:** Check tone. Ensure the "Stop" and "Handoff" points are explicit. Ensure the 20-minute constraint is respected (keep queries simple).

  **(Self-Correction on Case C logic):** If B wins overall but loses in *every* country, and the countries cover 100% of users...
  Let $p_t$ and $p_c$ be conversion rates.
  Overall $\Delta = p_{t, overall} - p_{c, overall}$.
  If $\Delta_{country\_i} < 0$ for all $i$, then $\sum w_i \Delta_i$ must be $< 0$.
  So for linear metrics, this is impossible.
  If the user sees this with ORs, it's non-collapsibility + imbalance.
  If the user sees this with Counts/Means, they have a data integrity issue (double counting, or a hidden segment like "Row/Other").
  I will treat Case (c) as the "Data Integrity / Hidden Segment" trap that leads to a "Do Not Ship" recommendation because the "Overall" win is illusory or irrelevant to the launch market.

  Actually, the prompt asks for "At least one of those should end with an answer I don't want to hear."
  Case (c) is perfect for this. "You win overall, but you are launching in Country A. Country A shows a loss. Do not ship." Even if the overall is positive.

  Let's finalize the procedure structure.
  1. Integrity Check (SRM).
  2. Temporal Check (Pre/Post).
  3. Metric Check (RD vs OR).
  4. Relevance Check (Weighting).

  Okay, ready to write.s
answer: |-
  Here is a 20-minute triage procedure for Simpson's Paradox (SP) in A/B testing. It is designed for a SQL/Regression environment, assumes no DAG drawing, and prioritizes shipping safety over statistical elegance.

  ### The 20-Minute Triage Procedure

  **Goal:** Distinguish between *Real Heterogeneity* (ship to winners), *Post-Treatment Bias* (trust topline), *Non-Collapsibility* (change metric), and *Data Integrity* (kill test).

  #### Gate 1: Randomization Integrity (5 Minutes)
  **Question:** Did the traffic mix drift *between arms* or just *over time*?
  **Action:** Run a Sample Ratio Mismatch (SRM) check on your slicing variable.
  *   **SQL:** `SELECT segment, count(*) FROM test_table GROUP BY assignment, segment`.
  *   **Check:** Compare the % of users in Segment X in Control vs. Treatment.
  *   **Pass:** Difference is < 1% (or chi-square p > 0.01).
  *   **Fail:** Significant imbalance (e.g., Control is 60% iOS, Treatment is 40% iOS).
  *   **Decision:**
      *   **If Fail:** **STOP.** This is not Simpson's Paradox; this is broken randomization or differential drop-out. The topline number is biased. Do not ship. Investigate assignment logic.
      *   **If Pass:** Proceed to Gate 2.

  #### Gate 2: The "When" Test (5 Minutes)
  **Question:** Is the slicing variable fixed at assignment or determined after?
  **Action:** Classify the slice.
  *   **Pre-Treatment (Fixed):** Device, Country, Day of Week, New vs. Returning (at start).
  *   **Post-Treatment (Mutable):** Completed Onboarding, Retained > 7 Days, Clicked Feature X.
  *   **Decision:**
      *   **If Post-Treatment:** **STOP.** The segment analysis is statistically invalid for causal inference. The treatment likely *caused* the segment membership (e.g., Variant B made onboarding harder, so only power users finished it). The "loss" in segments is a selection bias artifact. **Trust the Topline** (provided Gate 1 passed). Handoff to PM: "The variant works on the population we randomized, regardless of downstream behavior."
      *   **If Pre-Treatment:** Proceed to Gate 3.

  #### Gate 3: The Metric Check (5 Minutes)
  **Question:** Is the reversal driven by Odds Ratio non-collapsibility?
  **Context:** You are correct. Odds Ratios are non-collapsible. Even with perfect randomization and zero confounding, the marginal OR (topline) will be closer to 1.0 than the conditional ORs (segments). However, non-collapsibility *rarely* causes a sign reversal (win vs. loss) on its own. A sign reversal usually implies confounding (Gate 1 failure) or Post-Treatment bias (Gate 2 failure). But to be sure, we strip the math artifact.
  **Action:** Re-run the aggregation using **Risk Difference (RD)** or **Risk Ratio (RR)**, not OR.
  *   **SQL:** `AVG(conversion)` for Treatment minus `AVG(conversion)` for Control.
  *   **Decision:**
      *   **If Paradox Disappears (RD aligns):** The sign reversal was a mathematical artifact of the OR. **Trust the direction of the RD.** (Usually aligns with topline).
      *   **If Paradox Persists (RD still reverses):** You have genuine confounding or effect modification. Proceed to Gate 4.

  #### Gate 4: Standardization & Launch Scope (5 Minutes)
  **Question:** Does the "Topline" match the "Launch Population"?
  **Action:** Re-weight the segment results to match your *future* traffic, not the *test* traffic.
  *   **Context:** If you are only launching to the US next quarter, the "Global" topline is irrelevant.
  *   **Calculation:** $\text{Estimated Impact} = \sum (\text{Segment Impact} \times \text{Future Segment Weight})$.
  *   **Decision:**
      *   **If Weighted Impact > 0:** Ship (with caveats).
      *   **If Weighted Impact < 0:** Do not ship, even if test topline was positive.
      *   **Handoff:** This is now a PM decision. "The variant wins globally, but our growth is in a segment where it loses. Do we want to grow the global base or the specific segment?"

  ---

  ### Run-Through: Three Cases

  Here is how the procedure handles your specific scenarios.

  #### Case (a): B wins overall, loses on iOS and Android. Split/Mix look fine.
  *   **Gate 1 (SRM):** Pass. (iOS/Android split is 50/50 in both arms).
  *   **Gate 2 (When):** Pre-Treatment (Device is fixed). Proceed.
  *   **Gate 3 (Metric):** Check RD. Paradox persists in RD. (iOS -0.5%, Android -0.5%, Overall +0.2%).
  *   **Gate 4 (Standardization):**
      *   *Analysis:* How is Overall positive if both segments are negative? Mathematically impossible for Risk Difference if segments sum to 100%.
      *   *Finding:* You likely have a third segment (e.g., "Web" or "Unknown Device") that is huge and winning, which you didn't slice on initially. Or, your "Overall" includes users who haven't been assigned a device yet.
      *   *Resolution:* Isolate the hidden segment. If "Unknown" is 40% of traffic and +5%, that's your driver.
      *   **Verdict:** **Do Not Ship.** If it loses on every known device, the "win" is driven by data hygiene issues (unassigned users) or a segment you cannot target.
      *   **Unpleasant Answer:** "The win is illusory. We are losing on every device we actually support."

  #### Case (b): B wins overall, loses among "Completed Onboarding" and "Did Not Complete".
  *   **Gate 1 (SRM):** Pass.
  *   **Gate 2 (When):** **STOP.** "Completed Onboarding" is Post-Treatment.
  *   **Analysis:** Variant B likely improved conversion by helping marginal users finish onboarding, or it hurt onboarding but converted the survivors better. By slicing on completion, you are conditioning on a collider. You have induced bias.
  *   **Verdict:** **Ship (based on topline).** Ignore the segment readout. It is statistically meaningless for causal claims.
  *   **Handoff:** Tell the PM: "The segment loss is a statistical artifact. The variant improves the goal for the population we randomized. We ship on the topline."

  #### Case (c): B wins overall, loses in every country. We can only launch in one country (France).
  *   **Gate 1 (SRM):** Pass.
  *   **Gate 2 (When):** Pre-Treatment (Country is fixed). Proceed.
  *   **Gate 3 (Metric):** Check RD.
      *   *Scenario:* If RD shows B loses in every country but wins overall, and countries sum to 100%... **This is mathematically impossible.**
      *   *Correction:* You must have a "Row/Other" category excluded from the country slice but included in the topline. Assume "Row" is +10% and 50% of traffic.
  *   **Gate 4 (Standardization):**
      *   *Target:* France only.
      *   *France Impact:* -1.0% (Loss).
      *   *Overall Impact:* +0.5% (Win, driven by Row).
      *   *Calculation:* Future Weighted Impact = -1.0% (since 100% of launch is France).
  *   **Verdict:** **Do Not Ship.**
  *   **Unpleasant Answer:** "The global win is irrelevant. We are launching in France, where this variant loses money. The global win is driven by regions we are not entering."

  ---

  ### Explicit Boundaries: When to Call for Help

  This procedure covers 90% of growth team scenarios. It **cannot** settle the following. If you hit these, flag "Needs Causal Review" and do not ship on the metric alone.

  1.  **Interference/Network Effects:** If the treatment for User A affects the conversion of User B (e.g., marketplace liquidity, social features). The procedure assumes SUTVA (no interference).
  2.  **Time-Varying Confounding:** If the segment definition changes meaning mid-test (e.g., "Active User" definition changed by engineering mid-week).
  3.  **Peeking/Stopping Rules:** If the paradox appeared only after you peeked at day 3, day 7, and day 14 and picked the one that looked best.
  4.  **Instrumentation Drift:** If the event tracking for "Conversion" was updated mid-test differently for iOS vs Android.

  ### Summary Checklist for Your Slide
  When you present the readout, add this footer to your statistical methods section if you invoked this procedure:

  *   [ ] SRM Check Passed (p > 0.01)
  *   [ ] Segments are Pre-Treatment (No Post-Selection Bias)
  *   [ ] Metric validated via Risk Difference (Non-collapsibility checked)
  *   [ ] Impact weighted to Launch Population (Not just Test Population)

  If you check all four, you can defend the number in the meeting. If you can't check one, state the risk explicitly: *"We are shipping on topline despite segment losses because segments are post-treatment,"* or *"We are not shipping despite topline win because launch market is negative."*
