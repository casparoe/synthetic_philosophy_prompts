      *   *Mutual Recognition:* Hegel says states recognize each other. Remarque shows a war where the enemy is either a ghost (artillery) or a mirror of oneself (the Frenchman in the hole), but the *states* treat soldiers as expendable material. The "recognition" happens between soldiers *despite* the states, not *because* of them.
