answer: |-
  # The Meme Evolution Sorting Quiz

  You want to know if culture evolves like biology, but you're sick of the holy wars. Instead of asking people what label they wear, ask them what they think happens when a TikTok sound mutates. 

  Here is a decision tree to sort the actual mechanics of cultural change. Start at the top and follow your intuition about that landlord joke turning into anti-tenant propaganda.

  ### 1. The Fidelity Split
  **When that TikTok sound gets remixed, what's actually happening to the "original"?**

  *   **A. It's a Photocopy:** The core structure is copied from brain to brain. It might get degraded or tweaked (like a photocopy of a photocopy), but you can trace a clear lineage back to the source. **(Go to 2)**
  *   **B. It's a Reconstruction:** Nobody is really "copying." Every time someone hears it, their brain rebuilds the idea from scratch using their own mental tools. The "original" doesn't matter; only the reconstruction does. **(Go to 3)**

  ---

  ### 2. The Copying Path (High Fidelity)
  **Okay, if it's being copied, why did the anti-tenant version win out over the joke?**

  *   **A. The Meme Won:** The idea itself has "fitness." It spread because it was better at hijacking attention, regardless of whether it helped or hurt the people sharing it. **(Go to 4)**
  *   **B. The Humans Won:** The idea spread because it helped the people holding it survive, coordinate, or signal status. The benefit is to the host or the group, not the idea itself. **(Go to 5)**

  ---

  ### 3. The Reconstruction Path (Low Fidelity)
  **If everyone is rebuilding the idea from scratch, what guides their hands?**

  *   **A. Brain Bias (Psychology as Constructor):** People reshape the idea to fit innate cognitive preferences (like making it rhymey or simpler). The mind actively transforms the input. **(Leaf: Cultural Attraction Theory)**
  *   **B. Social Pressure (Group Function):** People reshape the idea to fit what their community needs to function or stay stable. The mind adjusts the idea to serve the tribe. **(Leaf: Functionalism)**
  *   **C. No Pattern (Chaos):** There's no pressure, just endless reinterpretation. It's not evolution; it's just noise and meaning-making. **(Leaf: Interpretive Anthropology)**

  ---

  ### 4. The Meme Fitness Path
  **How did the meme change during copying? Was it an accident or a strategy?**

  *   **A. Blind Noise:** Changes happened randomly (like genetic mutation). The successful ones were just lucky accidents that stuck. **(Leaf: Strict Memetics)**
  *   **B. Intentional Design:** Changes happened because someone deliberately engineered the meme to spread better. **(Leaf: Unoccupied — The "Viral Marketing" Paradox)**
      *   *Diagnosis:* **Incoherent.** If variation is intentional and selection is for the meme's spread, you're describing engineering, not evolution. There's no "blind" variation here.

  ---

  ### 5. The Human/Group Fitness Path
  **How did the change happen during copying? Was it random error or psychological bias?**

  *   **A. Psychological Filter (Bias):** People copy some things more than others because of innate learning biases (e.g., copying prestigious people). Psychology filters the copies. **(Leaf: Dual-Inheritance Theory)**
  *   **B. Blind Noise:** Changes were random errors, but only the ones helping the group survived. **(Leaf: Multi-Level Selection)**
  *   **C. Intentional Design:** People changed the idea on purpose to help their group. **(Leaf: Unoccupied — The "Rational Choice" Box)**
      *   *Diagnosis:* **Ugly.** It assumes humans are perfectly rational engineers of culture, ignoring unconscious biases and errors.

  ---

  ### Notes on the Leaves

  *   **Strict Memetics:** The Dawkins/Blackmore view. Memes are selfish replicators; humans are just the hardware.
  *   **Dual-Inheritance Theory:** Boyd & Richerson. Genes and culture co-evolve; psychology acts as a filter on copied information.
  *   **Cultural Attraction Theory:** Sperber. Don't look for copies; look for how minds transform information. Psychology is a constructor, not just a filter.
  *   **Functionalism:** Culture evolves to meet society's needs. (Often criticized for assuming everything has a purpose).
  *   **Interpretive Anthropology:** Rejects the evolution metaphor entirely. Culture is text to be read, not species to be tracked.
  *   **Unoccupied Boxes:** These represent logical gaps. If you claim culture evolves but also claim every change is intentionally designed by rational actors, you've talked yourself out of an evolutionary process.

  **Flagged Overlap:** **Dual-Inheritance vs. Cultural Attraction.** These two collapse into the same box unless you strictly enforce the first split. DIT assumes psychology *filters* copies (Selection); CAT assumes psychology *transforms* inputs (Mutation/Reconstruction). If you treat bias as just another form of selection pressure, DIT eats CAT alive. Keep them separate by insisting on **Copying vs. Rebuilding**.

  Summary: This tree sorts cultural evolution theories by testing whether you believe ideas are copied or reconstructed, who benefits from their spread, and whether change is blind or designed.
