  **Scholarly Context: Settled Textual Facts and Contested Interpretations**

  Before proceeding to the dialogue, it is necessary to distinguish between the established textual features of Spinoza's *Tractatus Politicus* and the *Ethics* as they pertain to political theory, and the interpretive disputes that surround them.

  **Settled Textual Matters:**
  1.  **Typology of Regimes:** Spinoza explicitly distinguishes between monarchy, aristocracy, and democracy, treating democracy as the most natural form of government because it most closely approaches the state of nature.
  2.  **Institutional Specifics:** In the chapter on democracy within the *Tractatus Politicus*, Spinoza outlines a governing structure centered on a large council. He explicitly excludes specific categories of persons from citizenship and voting rights, including women, children, servants, and those dependent on others for their livelihood.
  3.  **Equality and Sovereignty:** Spinoza asserts that democracy is the only regime that preserves natural equality and that sovereignty remains absolute within this framework.
  4.  **Incomplete Manuscript:** The *Tractatus Politicus* was left unfinished at Spinoza's death, particularly the section on democracy, leaving the full institutional design incomplete.

  **Contested Interpretive Matters:**
  1.  **Direct vs. Mediated Sovereignty:** Scholars disagree on whether Spinoza's democracy implies a direct exercise of power by the multitude or a representational system where power is transferred to a council.
  2.  **Nature of Exclusions:** It is debated whether the exclusions of women and dependents are pragmatic concessions to seventeenth-century social norms or constitutive features of Spinoza's definition of legal independence (*sui juris*).
  3.  **The Political Conatus:** There is no consensus on how the metaphysical concept of *conatus* (striving) translates into political authority—whether it implies a continuous, affective power that cannot be alienated, or a power that is stabilized and transferred through civil law.

  ***

  **A Dialogue on the Constitution of the Multitude**

  **Althea:** Let us begin from the point of agreement, Balthasar. We both acknowledge that Spinoza identifies democracy as the most natural regime, the one wherein men transfer their natural right not to a single monarch or a closed faction, but to the society as a whole. The text is explicit that in this arrangement, sovereignty remains absolute because it is coextensive with the power of the multitude itself.

  **Balthasar:** Indeed. That is the textual baseline. However, we diverge sharply on what Spinoza means by the "society as a whole." You argue that this implies a direct, unmediated sovereignty where the council is merely a fleeting expression of the multitude's will. I contend that the text describes a constitutional order where sovereignty is exercised through a specific, durable institution—a governing council—bound by laws that distinguish between the rulers and the ruled, even if that ruling body is numerically large.

  **Althea:** You mistake the mechanism for the source. Spinoza's metaphysics dictates that power cannot truly be alienated. The *conatus* of the individual persists even within the state. Therefore, the sovereign's power is nothing other than the aggregated power of the multitude. If the multitude withdraws its support, the sovereign ceases to exist. The council Spinoza describes is not a representative body in the modern sense, holding a monopoly on decision-making. It is an administrative crystallization of the multitude's continuous affective power. It is revocable not merely by law, but by the ontological reality that the multitude *is* the sovereign.

  **Balthasar:** But ontology does not draft constitutions. If we look to the *Tractatus Politicus*, Spinoza is engaged in institutional design. He specifies membership rules. He delineates procedures for voting and deliberation. He establishes exclusions. If sovereignty were truly direct and unmediated, why construct a council with defined boundaries? By defining who sits in the council and who does not—excluding women, servants, and foreigners—Spinoza is acknowledging that political right is juridical, not merely ontological. The "multitude" in the political sense is not everyone who exists; it is the body of citizens defined by the law.

  **Althea:** You point to the exclusions as evidence of mediation, but I see them as pragmatic limitations of independence. Spinoza defines the citizen as one who is *sui juris*, under their own jurisdiction. Those excluded are deemed dependent on the will of others—a servant on a master, a child on a parent. This does not negate the direct nature of the sovereignty for those who are independent. Furthermore, these exclusions do not transform the council into a separate estate. The councilors are drawn from the multitude and return to it. They are not a permanent aristocracy. The authority flows from the bottom up, continuously. The council is the multitude acting in concert, not a proxy ruling over the multitude.

  **Balthasar:** Yet, if the council makes the laws and the excluded obey them without a vote, is that not representation? You claim the authority flows from the bottom up, but Spinoza insists on the stability of the state. A fluid, affective sovereignty that relies on the continuous mood of the crowd is a recipe for sedition. Spinoza seeks to moderate the affects through reason and law. By establishing a council with fixed rules, he is channeling the power of the multitude into a stable form. This is mediation. The sovereignty resides in the *office* of the council as defined by the constitution, not in the street. If the multitude could act directly at any moment, there would be no need for the complex electoral mechanisms Spinoza proposes.

  **Althea:** The mechanisms are not to transfer power, but to coordinate it. Consider the alternative: if sovereignty were truly transferred to the council as a distinct entity, the multitude would be in a state of bondage, subject to a master. But Spinoza argues democracy preserves natural equality. How can equality be preserved if the people alienate their right to a council that stands above them? The only way to preserve equality is if the council is understood as the multitude's own instrument. The exclusions you cite are regrettable, certainly, but they are consistent with his view of rational agency, not a denial of the direct nature of the regime. They are historical contingencies, not essential features of democracy itself.

  **Balthasar:** I must press you on the claim that these exclusions are merely contingent. Spinoza does not apologize for them in the text; he integrates them into the definition of the democratic state. He argues that women are naturally unequal to men in capacity for governance and that servants lack independence. If these are constitutive features of his political science, then democracy is not the rule of everyone, but the rule of the independent heads of households. This looks remarkably like a broad aristocracy. To call it "direct" sovereignty obscures the fact that a significant portion of the population is subject to laws they had no hand in making. That is the definition of mediated authority.

  **Althea:** You conflate the extent of the franchise with the nature of sovereignty. Even if the franchise is restricted by historical prejudice regarding women or servants, the *structure* of the power remains democratic because the ruling body is not a closed caste. In an aristocracy, the ruling class is distinct by birth or co-option. In Spinoza's democracy, the ruling council is the civil expression of the multitude's power. The tension you identify is real, but it does not prove mediation. It proves that Spinoza's ontology of equality clashes with his sociological assumptions. However, the core principle remains: the sovereign is the collective body of the citizens, and that body holds the supreme right directly. The council is simply that body in session.

  **Balthasar:** But a body in session implies a distinction between when it is in session and when it is not. When the council is not sitting, who holds sovereignty? If it is the multitude, then the multitude can act outside the law. If it is the council, then sovereignty has been delegated. Spinoza chooses the latter for the sake of peace. He wants the laws to rule, not men, and certainly not the fluctuating passions of the crowd. By insisting on a constitutional framework, he admits that the multitude's *conatus* must be tamed. It must be represented by a structure that outlasts the momentary impulses of the people. This is the essence of constitutionalism: sovereignty is vested in the legal order, administered by the council, not in the raw power of the aggregate.

  **Althea:** You speak of taming the *conatus*, but Spinoza teaches that power cannot be suppressed, only directed. The laws rule only insofar as they align with the rational self-interest of the multitude. If the council enacts laws that violate the fundamental *conatus* of the people, the laws will be ignored, and the state will collapse. Thus, the ultimate check is not the constitution, but the power of the multitude itself. This makes the sovereignty direct in the final analysis. The constitution is a tool the multitude uses to organize itself, not a chain that binds it. To say sovereignty resides in the legal order is to reify the law as something separate from the human power that sustains it. For Spinoza, right is coextensive with power. The power lies with the multitude; therefore, the right lies with the multitude.

  **Balthasar:** I concede that the multitude retains the power to revolt. No regime is immune to collapse if it pushes the subjects too far. But the capacity to destroy the state is not the same as the right to govern it. In the ordinary course of politics, Spinoza assigns the right of decree to the council. He does not envision a plebiscite for every decision. He envisions a stable bureaucracy and a large, but finite, assembly. This is a system of representation, however broad. The "equality" Spinoza speaks of is equality before the law and equality of natural right among the citizens, not an equality that permits direct intervention in governance by all inhabitants. We must distinguish between the natural power everyone possesses and the civil right granted by the state.

  **Althea:** And I concede that Spinoza utilizes the language of civil institutions. He does not advocate for anarchy. But we must not confuse the administrative necessity of a council with the philosophical grounding of sovereignty. If the council were the true sovereign, Spinoza would have classified this regime as an aristocracy, for it would be the rule of a few hundred or few thousand over the rest. He calls it democracy. Why? Because the threshold for entry is the general condition of citizenship, not a privileged status. The council is permeable. It is an expression of the whole. The distinction you draw between the people and the council is, in Spinoza's metaphysics, a distinction of reason, not a real distinction. They are the same substance under different attributes: the multitude as power, the council as law.

  **Balthasar:** That is a poetic synthesis, Althea, but it glosses over the political reality Spinoza is addressing. He is writing to prevent civil war. To do so, he must fix the location of authority. If authority is everywhere, it is nowhere. By locating it in the council, he provides a target for obedience and a mechanism for accountability. The exclusions, the fixed terms, the voting procedures—these are not accidental. They are the architecture of the state. To argue they are merely temporary crystallizations is to ignore the text's insistence on stability. Spinoza knows that the multitude is volatile. He designs the democracy to withstand that volatility through mediation.

  **Althea:** And I argue he designs it to harness that volatility. Stability without power is tyranny. Power without stability is chaos. Spinoza's democracy is the equilibrium. But the equilibrium rests on the recognition that the sovereign *is* the multitude. The council is the mind of the state, but the multitude is the body. The mind cannot rule if the body rejects it. Thus, the sovereignty is fundamentally rooted in the direct power of the many. The institutional details are the means by which the multitude achieves rationality, not the means by which it surrenders its right.

  **Balthasar:** Then we arrive at the crux of our disagreement. You view the institutions as transparent windows through which the multitude's power shines. I view them as lenses that focus and alter that power into a governable form. For you, the exclusions are shadows on the wall; for me, they are the frame of the picture.

  **Althea:** Precisely. And I maintain that without the light of the multitude, the frame is empty wood. Spinoza's genius lies in showing that the frame derives its authority entirely from the light.

  **Balthasar:** And I maintain that without the frame, the light scatters and illuminates nothing. Spinoza's genius lies in showing that the light requires the frame to become a political force. We agree on the necessity of both elements; we disagree on which is the substance and which is the accident.

  **Althea:** A fair summation. The text gives us the tripartite distinction and the claim of equality as settled ground. But whether that equality is realized through the direct presence of the multitude or the mediated presence of the council remains the open question.

  **Balthasar:** Indeed. Until we resolve whether the *conatus* of the multitude can be juridically represented without being alienated, the character of Spinoza's democracy will remain a matter of rigorous dispute.
