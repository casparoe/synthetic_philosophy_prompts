  Here are three candidate principles I've considered to make sense of your list, based on the tension between getting the number up and actually doing the job.

  The first is the **Literal Compliance Principle**: gaming occurs whenever you violate the strict, literal definition of the task to boost the score. I'm dropping this because it condemns your chess engine (Case 3) for making unconventional moves, and it condemns the hospital (Case 5) for choosing palliative care, both of which you rightly feel are acceptable or even good. It's too rigid on the rules and ignores the purpose behind them.

  The second is the **Deception Principle**: gaming occurs whenever you hide what you're doing or trick the observer. I'm dropping this because your call centre example (Case 2) isn't hidden—everyone knows they're answering easy calls first—yet it still feels wrong. Conversely, the chess engine isn't hiding anything, and that feels fine. Deception isn't the core issue; the impact on value is.

  I am committing to the **Authentic Welfare Realisation Principle**. This focuses on whether the underlying good (welfare, function, service) is actually achieved, and whether the stakeholders' agency is respected in the process. It handles the tricky distinction between the kind nurse (Case 6) and the water drug (Case 7) by looking at consent and authentic experience, and it handles the hospital case (Case 5) by prioritising patient welfare over the surgical metric.

  ***

  **A measurement system is gamed when the score is raised by methods that fail to realise the underlying human welfare or functional purpose the metric is meant to track, particularly by bypassing the stakeholder's consent or authentic experience.**

  In plain English, you are cheating if you make the number go up without making the actual situation better for the people involved. It is especially cheating if you do it by tricking people or changing their minds without them knowing, rather than by actually helping them or doing the job properly. If the number goes up because people are genuinely better off or the job is genuinely done, even if it's clever, that is not cheating.

