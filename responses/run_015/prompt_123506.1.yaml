      *   *Result:* Enemy now believes we *will* retaliate.
      *   *Unintended Consequence:* Enemy realizes retaliation is now probabilistic or inevitable regardless of their de-escalation. If there's a 1% chance of doom even if they surrender, or if the system reacts to a glitch, their best bet is to destroy the system now.
      *   *The Joke:* Needs to capture the moment the planners realize they've solved the credibility problem by creating a doomsday scenario that forces the enemy's hand.

