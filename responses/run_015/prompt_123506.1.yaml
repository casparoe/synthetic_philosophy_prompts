answer: |-
  Two senior strategists, Evans and Chen, are locked in a secure briefing room, staring at a simulation of the adversary's latest mobilization.

  "The problem is resolve," Evans says, rubbing his temples. "Their game theory models assume we're rational utility-maximizers. They calculate that we'd never pull the trigger because the cost outweighs the benefit. They think the threat is a bluff."

  "So we remove the utility calculation," Chen replies, sliding a folder across the table. "Project Autonomaton. We sever the link between political command and execution authority. Sensors feed directly into a randomized launch algorithm. No human veto, no off-switch. If the threshold is breached, the system rolls the dice."

  Evans opens the folder. "This makes the response probabilistic. It injects genuine, non-rational chance into the outcome."

  "Exactly," Chen says. "We leak the schematics to the adversary. Now they know we physically cannot back down. The commitment is perfectly credible. We've solved the bluff problem."

  Evans looks up, frowning. "We sent the schematics an hour ago. Why are their missiles fueling up?"

  "Because you solved the credibility problem by destroying the deterrence framework," Chen says. "Deterrence relies on the adversary knowing that *compliance* guarantees *safety*. But your algorithm makes retaliation a function of chance, not a function of their behavior. Even if they stand down, the dice might still come up snake-eyes."

  Evans stares at the map. "So their risk calculus shifted."

  "Right. If they back down, they face a probabilistic doom. If they strike us now, they face a deterministic solution: they destroy the dice machine before it rolls. You proved we weren't bluffing, but in doing so, you made preemptive destruction their only rational dominant strategy."

  Evans sighs. "So we made the threat too credible to be useful."

  "No," Chen corrects, watching the first inbound blip appear on the screen. "We made it credible enough to be suicidal. We didn't deter them; we just gave them a deadline."
