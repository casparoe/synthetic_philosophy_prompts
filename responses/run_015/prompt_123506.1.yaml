      *   **Topic:** Nuclear brinkmanship.
      *   **Core Concept:** The tension between "credible commitment" (making a threat believable) and the "rational-actor framework" (deterrence relies on the enemy believing you will act predictably to maximize utility).
      *   **Setup:** Strategic planners trying to solve the credibility problem by removing human discretion (automated protocols, irrevocable delegation).
      *   **Punchline:** The paradox that making the threat *too* credible (by adding randomness/irrevocability) destroys the predictability needed for the adversary to back down rationally. If the response is a lottery, the adversary's only rational move is to strike first.
      *   **Audience:** Someone familiar with basic deterrence logic (Schelling-esque concepts, game theory basics).
      *   **Constraints:** No "red button" tropes, no specific theorist/doctrine citations (e.g., no Schelling, MAD, Permissive Action Links).

  2.  **Deconstruct the Logic:**
