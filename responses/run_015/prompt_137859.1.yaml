answer: |-
  This is an audit of your colleague's analogy. The goal is not to tell you what you *should* do, but to test whether the "Rule of the Road" logic actually supports the conclusion that you *must* do it.

  To do this, we need to define the philosophical machinery your colleague is using. He is relying on a theory of **Social Convention**. In philosophy (specifically following David Lewis), a convention is a solution to a coordination problem where the specific choice doesn't matter intrinsically (arbitrary), but everyone choosing the *same* thing matters immensely.

  Here is the audit, broken down by your requirements.

  ### 1. Correspondence Table

  This table maps the features of the "Rule of the Road" (the baseline analogy) against the three local norms in question.

  | Feature | Rule of the Road (Baseline) | Queueing (Loose vs. Strict) | Tipping (No-Tip vs. Tip) | Crossing (Jaywalking vs. Corners) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Arbitrary Content** | **High.** Left or right works equally well physically. | **Medium.** Strict or loose queues both create order, but "loose" feels chaotic to outsiders. | **Low.** Tipping is often tied to wage structures. A "no-tip" norm usually implies higher base wages; a "tip" norm implies subsidized wages. | **Low/Mixed.** Crossing at corners is safer by design (visibility). Crossing anywhere is efficiency-driven but riskier. |
  | **Mutual Expectations** | **Absolute.** Drivers *know* others will drive on the right. | **High.** Locals expect locals to push/hold space; outsiders are watched. | **Variable.** In "no-tip" cultures, tipping can confuse or offend. In "tip" cultures, not tipping angers. | **High.** Drivers expect pedestrians to act predictably, even if that means jaywalking. |
  | **Payoff from Coordinating** | **Safety & Flow.** Prevents head-on collisions and gridlock. | **Fairness & Order.** Prevents conflict over who is next; manages density. | **Income Distribution.** Ensures workers are paid according to local labor contracts. | **Efficiency & Safety.** Balances pedestrian speed with vehicle flow. |
  | **Harm from Deviating** | **Catastrophic.** High risk of death or severe injury. | **Social Friction.** Resentment, arguments, perceived rudeness. | **Economic/Relational.** Worker loses expected income OR feels insulted by "charity." | **Physical Risk.** Higher chance of accident, though often marginal in low traffic. |
  | **Law & Enforcement** | **Codified.** Traffic laws; police enforce with fines. | **Unwritten.** Social enforcement (glares, comments). Rarely legal. | **Contractual/Social.** Often part of employment contract or strict social taboo. | **Codified but Lax.** Often illegal but rarely ticketed unless it causes danger. |
  | **Visitor Status** | **Strict Liability.** Ignorance is not a defense in court. | **Grace Period.** Locals often forgive visitors initially, but expect adaptation. | **Cultural Nuance.** Visitors often get a pass, but may miss out on service or offend. | **Legal Liability.** Visitors are subject to local traffic laws regardless of origin. |

  ### 2. Feature Audit: Matches and Mismatches

  Your colleague's argument rests on the idea that all three norms function *exactly* like the Rule of the Road. The audit reveals significant cracks in this structure.

  **Queueing: The Strongest Match**
  *   **Match:** Like driving, queueing is primarily about **coordination**. Whether we queue strictly or loosely matters less than the fact that we *agree* on how to queue. If you queue strictly in a loose system, you create friction (someone cuts you, you get angry).
  *   **Mismatch:** The harm is social, not physical. The "enforcement" is reputational, not legal.
  *   **Verdict:** The analogy holds well here. This is a genuine coordination convention.

  **Crossing the Street: The Mixed Match**
  *   **Match:** There is a coordination element (pedestrians and drivers need to predict each other).
  *   **Mismatch:** The content is **not arbitrary**. Crossing at corners is objectively safer due to sightlines and traffic signals. "Rule of the Road" is arbitrary (left vs. right); "Cross at Corners" is risk-based.
  *   **Verdict:** The analogy is weak. This is less about *convention* and more about *safety regulation*. The obligation to follow it stems from risk management, not just coordination.

  **Tipping: The Weakest Match**
  *   **Match:** There is a mutual expectation (locals know locals don't tip).
  *   **Mismatch:** This is not a coordination equilibrium; it is a **distributive norm**.
      *   In a "no-tip" city, service workers are paid a living wage. If you tip, you aren't "coordinating"; you are introducing a variable wage into a fixed-wage system, which can be insulting or create inequality among staff.
      *   In a "tip" city, the tip is part of the wage.
      *   Unlike driving on the right, where the *act* is the point, with tipping, the *transfer of money* is the point.
  *   **Verdict:** The analogy fails. Tipping is not like driving on the right; it is more like paying a tax or a fee. The "arbitrary content" feature is missing because the economic structure depends on the norm.

  ### 3. The Invisible-Deviation Test

  You proposed a test: *If I deviate secretly (no one sees, no one affected), does the obligation remain?*

  **The Road Rule Case:**
  If you drive on the left at 3 AM on an empty road, you physically *can* do it without crashing. However, the obligation remains because:
  1.  **Habit Formation:** If you practice deviation when it's "safe," you might slip up when it's not.
  2.  **Unexpectedness:** A car *might* appear. Your deviation creates a latent risk.
  *Result:* The obligation **survives** the test because the rule is about systemic safety, not just immediate outcomes.

  **Queueing:**
  If you slip into a loose queue when no one is looking, no one is harmed.
  *Result:* The obligation **weakens**. Since the harm is social (offense taken by others), no observers means no offense. The "Rule of the Road" analogy suggests you still shouldn't do it to maintain your own habit of fairness, but the *obligation to others* vanishes if no others are present.

  **Tipping:**
  If you leave no tip on a credit card slip where no one sees (in a culture where tipping *is* expected), the worker *still loses money*.
  *Result:* The obligation **survives**, but for a different reason than the road rule. It survives because there is a **third-party victim** (the worker), not because the *system* collapses. The road rule is about *systemic integrity*; tipping is about *individual entitlement*.
  *Conversely (Your Scenario):* If you are in a **no-tip** culture and you secretly leave a tip: The worker might be confused or taxed unexpectedly. The harm is subtle. The obligation *not* to tip survives because it respects the local labor contract.

  **Crossing:**
  If you cross an empty street at 3 AM against the light.
  *Result:* The obligation **collapses**. This is the biggest disanalogy. Traffic laws are often written as absolute rules but function as risk rules. If the risk is zero, the moral force of the "Rule of the Road" analogy evaporates. Most philosophers agree there is no moral obligation to stop at a red light on a deserted desert highway at night.

  ### 4. The Visitor's Excuse

  Your excuse has three parts:
  1.  *I did not help set the equilibrium.*
  2.  *My single deviation changes nothing.*
  3.  *Discreet opt-out wouldn't collapse the convention.*

  **Is this Special Pleading?**
  *Special Pleading* is a fallacy where you claim an exemption from a rule without a relevant difference in circumstances.

  *   **Regarding Queueing:** This **is special pleading**. You benefit from the order the queue provides (even a loose one). Claiming "I didn't make the rule" is irrelevant; you are enjoying the benefit of the convention. Your single deviation *does* matter if every visitor thought the same way (the *Generalization Principle*).
  *   **Regarding Tipping:** This is **not special pleading**, it is an information asymmetry issue. If the norm is opaque, you cannot be expected to coordinate. However, once informed (by your colleague), the excuse fades. But the "my deviation changes nothing" argument is weaker here because the harm is to a specific individual, not the system.
  *   **Regarding Crossing:** This is **plausible**. Traffic safety rules are often based on *risk*. If you, as a visitor, assess the risk as negligible (empty street), your exemption is based on the *purpose* of the rule (safety), not just your status as a visitor.

  **The "Discreet Opt-Out" Argument:**
  You argue that if everyone like you opted out discreetly, the convention wouldn't collapse.
  *   **Road Rule:** False. If 10% of drivers drove on the left "discreetly" (at night, or in fast lanes), the system becomes terrifying and unsafe.
  *   **Queueing:** True. If 10% of visitors stood strictly in a loose queue, the system would absorb it.
  *   **Tipping:** False. If 10% of customers tip in a no-tip culture, it creates a two-tier wage system that management may hate. If 10% *don't* tip in a tip-culture, workers starve.
  *   **Crossing:** True. A few visitors jaywalking rarely changes traffic flow.

  ### 5. Final Verdict on the Analogy

  Does your colleague's conclusion survive? **Only partially.**

  The "Rule of the Road" analogy is a **Coordination Argument**. It works best when the goal is simply to make sure we all do the *same* thing, regardless of what that thing is.

  1.  **Queueing (Survival: High):** This is the best fit. It is a coordination convention. You should adapt, not because loose queues are morally superior, but because *matching* is the obligation.
  2.  **Crossing (Survival: Low):** This is a **Safety Argument**, not a Coordination Argument. You should follow local crossing norms primarily to avoid physical harm or legal trouble, not because it's "arbitrary." If the local norm is dangerous (e.g., no one looks), the road-rule analogy fails to obligate you to be unsafe.
  3.  **Tipping (Survival: Failed):** This is a **Distributive Argument**. It is about how money moves and how labor is valued. The road-rule analogy obscures the economic reality.
      *   *Better Analogy:* **Pricing.** If you go to a market where haggling is the norm, you haggle. If you go to a store with fixed prices, you pay the sticker. Tipping is part of the "price" of the service. You owe it to the local economic system to pay the price as structured, not to impose your home pricing structure on them.

  ### Glossary of Terms

  *   **Coordination Equilibrium:** A situation where everyone is doing the best they can, *provided* everyone else does the same. (Example: We all drive on the right. If you switch to left, you crash. If we all switched to left, we'd be fine. The specific side is arbitrary; the *agreement* is not.)
  *   **Arbitrary Content:** A rule where the specific action doesn't matter intrinsically, only that everyone does the same one. (Driving left vs. right is arbitrary. Driving sober vs. drunk is not.)
  *   **Normative Obligation:** A duty to act in a certain way, derived from morals, laws, or social rules.
  *   **Externalities:** Costs or benefits that affect a party who did not choose to incur that cost or benefit. (Your jaywalking might cause a driver to brake suddenly, risking a rear-end collision they didn't choose.)
  *   **Special Pleading:** A logical fallacy where one claims an exception to a general principle without providing a relevant justification for that exception.
  *   **Generalization Principle:** The ethical test that asks: "What would happen if *everyone* in my situation did what I am about to do?" If the result is bad, the action is likely unethical.

  ### Summary Recommendation

  Your colleague is right that you should adapt, but his *reasoning* is only correct for queueing.

  *   **Queue:** Adapt because it is a **Convention**. (Colleague is right).
  *   **Crossing:** Adapt because it is a **Safety/Legal** rule, but use your own judgment on risk. (Colleague is half-right).
  *   **Tipping:** Adapt because it is a **Local Contract**, not a convention. You aren't "joining an equilibrium"; you are respecting the local wage agreement. (Colleague is right on conclusion, wrong on analogy).

  Your intuition was correct: these are three different kinds of things. Treating them all as "Rules of the Road" oversimplifies the ethical landscape.
