answer: |-
  # 1. Preliminary thinking

  The primary failure in previous scripts is the treatment of Nietzsche's triad as a static taxonomy rather than a dynamic diagnostic tool. Candidates recite the definitions but fail to test the boundaries where the categories fray. I have identified two viable cruxes. First, the criterion of "Life": students often reduce this to biological survival or subjective interest, missing Nietzsche's specific notion of "plastic power" and the capacity to incorporate the past without being crushed by it. Second, the self-referential paradox of Critical History: Nietzsche admits the judge is an outcome of the past they condemn. Can one truly break chains one is forged from?

  I have chosen the second crux, embedded within the Ashkirk case, because it forces candidates to confront the limits of the framework itself. The "Local Historians" claim the Critical mode, but their lineage (descendants of foremen) and dependency (archive access) complicate their standing. A recitation strategy cannot resolve whether their history is truly "critical" or merely reactive antiquarianism. To succeed, candidates must analyze whether Nietzsche's appeal to "life" provides a genuine normative standard or collapses into might-makes-right, and whether the three species are mutually exclusive or overlapping tendencies. This demands conceptual work, not just labeling.

  # 2. The question stem

  **Question 4**

  In the post-industrial town of Ashkirk, a steelworks closed in the 1980s and the site has stood derelict since. Three campaigns are now competing for it. A preservation trust, founded and endowed by the family that owned the works, wishes to conserve the rolling mills, the company ledgers and the adjacent workers' housing as an intact industrial settlement; its founding deed obliges it to commemorate the works' contribution to the town and forbids it from taking a position on any matter of local dispute. A development consortium wishes to demolish most of the site and build an innovation campus, and justifies itself by constant appeal to one much-praised regeneration elsewhere in Europe, whose example it hopes to equal and surpass. A group of local historians — several of them descendants of the foremen who broke the walkout of the 1920s — wishes to publish a documented account of company housing, the company shop, the eviction of striking families and the blacklist, so that the town may, in their phrase, sit in judgement on its own founders and thereby cease to be determined by them. The twist is that their evidence lies in the company archive, which is the trust's property, and the trust has indicated that it will grant access only for a commemorative volume produced as part of its anniversary programme. None of the three groups is interested in the past for its own sake; each wants a particular past.

  Using Nietzsche's *On the Use and Abuse of History for Life*, identify which of the three species of history each campaign instantiates. Then, evaluate whether Nietzsche's framework allows you to rank these campaigns. Pay particular attention to whether Critical History is genuinely available to agents who are themselves products and beneficiaries of what they propose to judge, and whose evidence is held by the institution they indict.

  *Note: A bare application of the three labels without analysis of the conceptual difficulties involved will not be rewarded above a low second-class mark.*

  # 3. A model answer

  Nietzsche's essay proposes that history is not an objective science but a tool subordinate to the needs of life. He distinguishes three species: Monumental, which looks to great past examples to inspire action; Antiquarian, which preserves origins with piety to nurture belonging; and Critical, which judges and condemns the past to liberate the present. Applying these labels to the Ashkirk campaigns is straightforward initially, but the Ashkirk case reveals friction in the framework, particularly regarding the viability of Critical History and the definition of Life.

  The Preservation Trust is predominantly Antiquarian. It seeks to conserve the mills and housing intact, driven by a deed that obliges commemoration. Nietzsche describes the antiquarian instinct as a reverence for one's origins, preserving the conditions from which one sprang. However, the Trust's prohibition on taking positions in local disputes suggests a degeneration of the antiquarian into the mummification of the past, where everything old is equally revered, and the living present is stifled by the demand for piety. They serve the past, not life.

  The Development Consortium instantiates Monumental History. They appeal to a successful regeneration elsewhere as an example to equal and surpass. Nietzsche argues Monumental history teaches that greatness was possible and is thus possible again. However, Nietzsche warns against using the past to blur differences; the European example may not fit Ashkirk's specific conditions. If the consortium ignores the local context to force a foreign model, they are abusing the monumental mode, turning it into a fictional template rather than a genuine inspiration.

  The Local Historians claim the Critical mode. They wish to sit in judgement on the founders to cease being determined by them. This aligns with Nietzsche's description of bringing the past to a tribunal to break its chain. However, the case presents a structural impediment Nietzsche anticipates but does not fully resolve: the judge is an outcome of the past they condemn. The historians are descendants of foremen who broke the strike. Their very existence is tied to the power structures they indict. Furthermore, their evidence is held by the Trust. This creates a dependency that compromises the critical act. Nietzsche suggests Critical History requires a strong plastic power to create a new habit, a second nature. Can these historians generate a new nature if their resources are controlled by the old order?

  This leads to the ranking problem. If history serves life, the superior history is that which enhances plastic power—the capacity to grow and incorporate the past without being poisoned by it. The Trust's Antiquarianism risks suffocating the town in nostalgia; it preserves the shell but forbids the judgment necessary for growth. The Consortium's Monumentalism risks irrelevance if the example is inapplicable, but it at least aims at future action. The Historians' Critical approach is the most necessary for liberation, yet it is the most fragile.

  Nietzsche acknowledges the danger that Critical History involves doing injustice to the past, as no past is entirely innocent. He argues this injustice is necessary for life. However, in Ashkirk, the historians' complicity (as descendants of strike-breakers) complicates the moral standing of their judgment. Are they judging the founders, or themselves? Nietzsche's solution is the creation of a new horizon. If the historians can use the evidence to forge a new identity for the town that acknowledges the guilt without being paralyzed by it, they succeed. If they merely invert the hierarchy (workers good, owners bad) without creating a new future, they remain trapped in the reactive mode.

  The archive twist is crucial. Control over the past is control over the future. The Trust uses Antiquarian preservation to block Critical judgment. Nietzsche would likely argue that the Trust's history is "abusive" because it forbids the critical act necessary for life to move forward. Life requires forgetting as well as remembering. The Trust remembers everything but forbids judgment; the Historians want to judge but cannot access the memory.

  Ultimately, the framework ranks the campaigns not by moral purity but by their capacity to serve the future. The Critical attempt is highest in potential value because it seeks to break the chain, but it is currently blocked. The Monumental attempt is second, as it seeks action but risks superficiality. The Antiquarian attempt is lowest, as it prioritizes the preservation of objects over the needs of the living. However, Nietzsche warns that we cannot simply abolish the past. A healthy culture needs all three. Ashkirk is unhealthy because the three are at war, not in service to a unified life. The historians cannot succeed merely by condemning; they must build a new horizon. If they cannot access the archive, they cannot judge accurately, and their critical history becomes fiction. Thus, the framework exposes the power dynamics but does not solve them. It reveals that without the power to enforce the critical judgment, the "use of history" remains theoretical. The true test is whether the historians can generate enough plastic power to seize the narrative despite the Trust's gatekeeping. If they cannot, their history is useless for life, regardless of its moral correctness.

  # 4. A marking scheme

  **Total Marks: 25**

  1.  **Correct Identification of Species (5 marks)**
      *   *Requirement:* Correctly maps Trust to Antiquarian, Consortium to Monumental, Historians to Critical.
      *   *Common Fumble:* Swapping Monumental and Antiquarian based on "old buildings" vs. "new campus" rather than the underlying attitude toward the past.

  2.  **Definition of Life as Plastic Power (5 marks)**
      *   *Requirement:* Defines "Life" not as biological survival or subjective interest, but as the capacity to incorporate the past and grow (plastic power/horizon).
      *   *Common Fumble:* Treating "Life" as mere economic regeneration or biological continuity, missing the normative dimension of health/strength.

  3.  **Analysis of Critical History's Paradox (5 marks)**
      *   *Requirement:* Addresses the self-referential problem: the historians are products of the past they judge (descendants of foremen).
      *   *Common Fumble:* Treating Critical History as simple iconoclasm or moral condemnation without noting the risk of the judge being compromised.

  4.  **Evaluation of the Archive/Power Dynamic (5 marks)**
      *   *Requirement:* Discusses how the Trust's control of evidence limits the Critical function, linking power to the ability to practice history.
      *   *Common Fumble:* Ignoring the archive twist or treating it as a logistical detail rather than a philosophical constraint on truth/judgment.

  5.  **Normative Ranking via "Service to Life" (5 marks)**
      *   *Requirement:* Attempts to rank the campaigns based on which best serves the future/growth, acknowledging the necessity of all three modes in balance.
      *   *Common Fumble:* Declaring one mode universally superior (e.g., Critical is always best) without referencing Nietzsche's warning about the need for balance.

  *Penalty:* Deduct 5 marks total if the candidate imports concepts from later Nietzsche (Will to Power, Eternal Recurrence) or relies on external historical context (German Empire).

  # 5. Plausible-sounding answers that ought to lose marks

  1.  "The historians are right because justice requires exposing the truth, and Nietzsche supports overthrowing oppressive pasts."
      *   *Error:* Reduces Critical History to moral iconoclasm and ignores Nietzsche's warning that critical history requires creating a new nature, not just judging the old.
  2.  "The Trust represents biological life because they are preserving the physical buildings where people lived and worked."
      *   *Error:* Confuses Nietzsche's metaphysical concept of "Life" with physical preservation or biological survival.
  3.  "The Consortium is using Monumental history because they are focused on great men like the European developers."
      *   *Error:* Misidentifies Monumental history as being about "great men" specifically, rather than the emulation of great *actions* or possibilities.
  4.  "This situation shows the Will to Power because the Trust is exerting dominance over the historians."
      *   *Error:* Anachronistic importation of a concept not present in the 1874 text; violates the closed-book constraint on textual scope.

  # 6. A discrimination guide

  **First-Class (70–100):**
  Identifies the three species accurately but moves quickly to the friction points. Explicitly tackles the self-referential paradox of the historians (being descendants of foremen) and links it to Nietzsche's concept of "second nature." Discusses the archive control as a limit on "plastic power." Recognizes that Nietzsche does not offer a simple solution but a diagnostic of health. Avoids moralizing; focuses on the functional capacity of history to enable future action.

  **Upper Second (60–69):**
  Correctly identifies the three species. Understands "Life" as more than mere survival but may not fully articulate "plastic power." Addresses the historians' compromise but treats it as a practical obstacle rather than a philosophical paradox. Ranks the campaigns clearly but may favor Critical history too uncritically without noting Nietzsche's warnings about its dangers. Solid grasp of the text without deep synthesis.

  **Bare Pass (40–49):**
  Correctly labels the three campaigns (Trust/Antiquarian, Consortium/Monumental, Historians/Critical). Defines "Life" vaguely or conflates it with economic progress. Mentions the archive issue but does not link it to the conceptual framework. Treats the three species as mutually exclusive boxes rather than overlapping tendencies. May drift into general commentary on heritage without specific textual engagement.
