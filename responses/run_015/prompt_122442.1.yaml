answer: |-
  Mont-Louis, near Montmorency
  20 July 1758

  Monsieur et Cher Concitoyen,

  I received your letter with a sentiment I dare not call joy, for joy is too strong a word for the relief one feels when a danger is merely postponed, but certainly with a profound gratitude. That the Small Council has shelved the plan for a standing theatre is a victory for Geneva, though perhaps more for her reputation than for her virtue just yet. To remove the temptation is the first step; to replace it with something wholesome is the second, and it is here that I must speak with the frankness you demand of me, and which I owe to my fatherland.

  You propose a gathering on the Plainpalais, patriotic in subject, citizen in execution, and transient in nature. You ask if I can consistently object to this. I answer you: I object to nothing that truly binds men together, but I fear everything that merely amuses them under the guise of instruction. You call this a festival; I fear it remains a spectacle. The distinction is not trivial, nor does it rest solely on whether the actors are paid. If two hundred citizens perform and the rest of the Republic sits upon the grass to watch them, you have not abolished the theatre; you have only democratized the stage. The vice of the theatre is not merely in the profession of the actor, but in the passivity of the spectator. A people that gathers to watch its own members pretend to virtue is still a people that sits still while others act. They clap for Tell, they cheer for the Escalade, and they go home having done nothing but feel a fleeting warmth in their chests. This is not virtue; it is the sentiment of virtue, which is often its counterfeit.

  You ask me why the imitation in a festival is innocent while this one is not. I reply that in the festivals I described, there are no actors at all. Let the spectators become an entertainment to themselves; let them dance, sing, and compete in games where every man is a participant. If you stage a play, even without love plots or professionals, you introduce imitation into the heart of the Republic. To play the hero for an afternoon is to risk confusing the role with the man. We are weak enough to believe we are brave because we have applauded bravery. It is better to exercise your strength in wrestling matches or naval contests on the lake than to recite verses about liberty. The one makes you robust; the other merely makes you proud.

  Furthermore, you specify men and boys only. Here I must chide you gently. Did I not argue that public amusements are precisely the place where the sexes ought to mingle? It is in the presence of women that men learn to soften their manners and seek to please through virtue rather than force. To exclude them is to make this a military review, not a civil festival. You fear the corruption of actresses, and rightly so, but do not punish the mothers and daughters of Geneva by keeping them from the public square. Their presence is the surest guard against the very licentiousness you seek to avoid.

  I do not say your plan is evil, Monsieur. It is far less dangerous than the Comédie Française transplanted to the shores of the Rhône. But do not ask me to bless it as a perfect remedy. It is a compromise, and compromises are necessary in a fallen world, but let us not mistake them for the ideal. If you must have a play, let it be rare, as you say, and let the meal afterwards be truly common, with magistrates serving the citizens rather than handing down prizes from above. But remember always: a people is not made better by watching, even if those they watch are their own brothers. They are made better only by doing, together, in the open light of day.

  I remain, with all the esteem due to a magistrate who listens to reason,

  Your very humble and obedient servant,

  J. J. Rousseau
