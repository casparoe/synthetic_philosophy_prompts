answer: |-
  ### Specification for a Philosophical Account of Corruption in Fiction

  To render cross-cultural disagreement intelligible without resolving it, an account of corruption must not seek a single verdict. Instead, it must provide a structured vocabulary that allows characters to locate precisely where their moral frameworks diverge. The following four desiderata specify the necessary components of such an account.

  #### 1. The Deviation Criterion (Law vs. Role)
  **Requirement:** The account must distinguish between *illegal acts* and *role-betrayals*. It must specify whether the normative standard violated is codified in statute or embedded in the implicit trust of the office.
  **Motivation:** Corruption is often legally permissible (e.g., lobbying, networking). If the definition relies solely on statutory violation, the Yorkshire Housing Officer cannot be scrutinized. If it relies solely on moral intuition, the definition becomes too vague for conflict.
  **Application to Case:** The Housing Officer violates no law. An adequate account must allow a character to argue she has betrayed the *impartiality* inherent in her role (allocating scarce public resources) even while another character defends her adherence to the *letter* of her discretion.
  **Status:** **Non-negotiable.** Without a deviation from a norm (legal or ethical), the concept of corruption collapses into mere "action." However, *which* norm takes precedence is a site for character conflict.

  #### 2. The Exchange Granularity Criterion (Diffuse vs. Specific)
  **Requirement:** The account must differentiate between *generalized reciprocity* (social bonding) and *specific quid pro quo* (transactional exchange). It must identify the temporal gap and the specificity of the return expectation.
  **Motivation:** Human societies function on gift economies; states function on rule economies. Corruption often resides in the slippage between the two. A definition that categorizes all gift-giving as corruption is anthropologically blind; one that ignores the strategic timing of gifts is naive.
  **Application to Case:** The Ghanaian Customs Official accepts yams and invitations but clears containers at the ordinary queue speed. An adequate account must allow a character to argue this is *social maintenance* (diffuse obligation, no specific act purchased) while another argues it creates a *latent liability* (the invitation itself binds future discretion).
  **Status:** **Contested (Camp-Specific).** A strict legalist camp treats any unrecorded benefit as suspect. A culturalist camp treats diffuse reciprocity as essential social glue. This tension should drive dialogue, not be resolved by the narrative.

  #### 3. The Functional Teleology Criterion (Substitute vs. Hollow)
  **Requirement:** The account must assess the *systemic consequence* of the behavior on the institution's capacity. It must distinguish between networks that *substitute* for state failure and networks that *hollow out* state function.
  **Motivation:** In weak institutional contexts, patronage often delivers services the state cannot. In strong contexts, it undermines trust. A definition that ignores outcome ignores the stakes of the Clinic Director's dilemma.
  **Application to Case:** The Expatriate Clinic Director refuses the facilitation payment, causing a six-week vaccine delay. An adequate account must allow a character to argue that "purity" here is a luxury that damages public health (functional failure), while another argues that paying validates a predatory system (hollowing out).
  **Status:** **Non-negotiable.** Corruption implies a decay of function (from *corruptio*). If the act sustains or improves public welfare without alternative means, calling it "corruption" requires heavy qualification. However, the *timeframe* of the assessment (short-term gain vs. long-term rot) is a site for disagreement.

  #### 4. The Scope Criterion (Universal vs. Indexed)
  **Requirement:** The account must explicitly state whether the standard of corruption is *universal* (applicable to any officeholder regardless of context) or *indexed* (relative to local expectations of office).
  **Motivation:** This is the core friction in cross-cultural fiction. If the standard is universal, the expatriate is always right. If indexed, the local official is always right. An adequate account must allow for the friction where both feel justified.
  **Application to Case:** All three cases. The Housing Officer relies on local norms of "looking out for your own." The Customs Official relies on local norms of hospitality. The Clinic Director relies on universal bioethical standards. The account must not solve this but provide the terms for the clash.
  **Status:** **Contested (Camp-Specific).** This is the primary philosophical fault line. A universalist view sees indexed morality as relativism; a contextualist view sees universal morality as imperialism.

  ***

  ### Performance of Philosophical Camps

  To help distribute strengths and blind spots among your characters, here is how three common philosophical approaches fare against the desiderata above:

  *   **The Institutionalist View:** (Focuses on Desideratum 1: Law/Rule).
      *   *Strength:* Clear boundaries. Excellent for the Housing Officer case (she is legal, therefore not corrupt).
      *   *Blind Spot:* Fails Desideratum 3 (Function). Cannot explain why the Clinic Director's legal purity causes harm. Tends to view the Customs Official's yams as bribery regardless of intent, missing the cultural nuance (Desideratum 2).
      *   *Character Assignment:* Give this to a character who values order and procedure, perhaps the Clinic Director or a rigid auditor.

  *   **The Culturalist View:** (Focuses on Desideratum 4: Indexed Norms).
      *   *Strength:* High intelligibility for the Customs Official. Understands yams as social binding, not bribes. Respects the Housing Officer's local loyalty.
      *   *Blind Spot:* Fails Desideratum 3 (Function) when local norms are predatory. Struggles to condemn practices that are culturally accepted but systemically destructive (e.g., if the "invitation" eventually *does* slow down a competitor's container).
      *   *Character Assignment:* Give this to a local fixer or a character arguing against neo-colonial judgment.

  *   **The Functionalist View:** (Focuses on Desideratum 3: Systemic Consequence).
      *   *Strength:* Best handles the Clinic Director case. Asks: "Did the vaccines arrive?" Can distinguish between patronage that keeps the lights on vs. patronage that steals the wiring.
      *   *Blind Spot:* Fails Desideratum 1 (Role). Can justify terrible acts if the "outcome" is good (utilitarian trap). May view the Housing Officer's nepotism as efficient if it gets repairs done faster than the bureaucracy.
      *   *Character Assignment:* Give this to a pragmatist, perhaps a weary civil servant or a doctor focused solely on patient outcomes.

  **Jointly Unsatisfiable Subset:**
  Desideratum 1 (Role Fidelity/Rule Adherence) and Desideratum 3 (Systemic Function) are often jointly unsatisfiable in weak institutional contexts. To maintain strict role fidelity (refusing the bribe) may cause systemic dysfunction (vaccine delay). To ensure systemic function (paying the bribe) requires betraying the role. A single character cannot satisfy both without cognitive dissonance; this is where your drama lies.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:** High.
  This specification successfully isolates the distinct philosophical tensions inherent in your three test cases without forcing a resolution. It provides a grid upon which characters can map their disagreements, ensuring they are arguing about *principles* rather than merely asserting *preferences*.

  **Least Sure Requirement:** **Desideratum 3 (The Functional Teleology Criterion).**
  **Reason:** I am least sure about the requirement to assess *systemic consequence* as a defining feature of corruption. While intuitively strong (corruption implies harm), there are philosophical arguments that corruption is a *deontological* wrong (wrong in itself, regardless of outcome). If a Customs Official takes a yam and nothing changes in the queue, is it corruption? A strict deontologist says yes (integrity violated); a functionalist says no (no harm done). By including "consequence" as a requirement, I may be biasing the specification toward a utilitarian framework. However, for the purposes of fiction—where stakes drive plot—consequence is usually necessary to generate tension, even if it philosophically compromises the definition of the act itself.
