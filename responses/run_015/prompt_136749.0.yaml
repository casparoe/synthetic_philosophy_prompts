answer: |-
  ### Setup & Materials
  **Players:** 14. **Currency:** Poker chips (100 each). **Ledger:** Whiteboard (public chip counts). **Props:** Deck of cards (Round 1), Bag A [3R, 1B] & Bag B [1R, 3B] (Round 2), Bag C [Unknown mix] (Round 3), Index cards (for secret price submission).
  **Role:** You are the Bank. Players set prices; you choose whether to buy or sell at those prices to maximize their loss.

  ### Rules & Payoff
  1.  **Pricing:** Players write prices for bets (pays 1 chip if event occurs) on index cards.
  2.  **Trading:** You (Bank) accept any bet at the posted price. You choose long/short positions to lock in sure losses where possible.
  3.  **Goal:** Maximize chip count. Lowest score buys coffee next week.
  4.  **Diachronic Commitment:** In Round 2, players must write their update rule *before* evidence is revealed.
  5.  **Intervals:** In Round 3, players may post separate Buy ($b$) and Sell ($s$) prices.

  ### Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–10 | **Intro** | Distribute chips. Explain Bank role. Emphasize: "You set the odds." |
  | 10–30 | **R1: Synchronic** | Event: Card color (Red/Black). Players price both. If $P(R)+P(B) \neq 1$, you exploit the sum. |
  | 30–55 | **R2: Diachronic** | Bag A/B selected secretly. Players price $P(A)$, $P(Red)$, $P(A|Red)$. They commit to posterior $P_{new}(A)$ if Red drawn. Draw Red. If $P_{new} \neq P(A|Red)$, exploit the gap. |
  | 55–65 | **R3: Intervals** | Bag C (unknown mix). Players set $b$ and $s$. Show on board that if $b < s$, no sure loss exists. |
  | 65–75 | **Debrief** | Map game failures to axioms. Discuss limits. |

  ### Debrief: Mapping Game to Argument
  *   **Round 1 (Additivity):** The nausea of losing on Red/Black regardless of outcome maps to violating $P(A) + P(\neg A) = 1$. The ledger proves incoherence is financially fatal *if* you trade both ways.
  *   **Round 2 (Conditionalization):** The loss here stems from the mismatch between prior conditional price and planned posterior. This illustrates the Lewis argument: violating conditionalization makes you vulnerable to a strategy contingent on evidence you haven't seen yet.
  *   **Round 3 (Precision):** The safety they feel when using bid-ask spreads ($b < s$) demonstrates that Dutch Books require a **Fair Price Assumption** (single-valued credence). Without it, the bookie's hands are tied.

  ### Predictable Problems & Solutions
  *   **"I refuse to bet on principle."**
      *   *Solution:* Make pricing mandatory for "participation points" on the leaderboard. Frame it as "setting market rates," not gambling. If they refuse to price, they forfeit chips automatically.
  *   **"I'll be the Bookie against others."**
      *   *Solution:* Assert sole trading authority. "Only the Bank trades." This prevents them from hedging against each other and ensures you can demonstrate the specific exploit.
  *   **"I'll change my price mid-round."**
      *   *Solution:* Use index cards. Collect all prices before revealing any outcomes or accepting bets.

  ### Limitations: What You Must Supply
  The game cannot bridge the **Pragmatic-to-Epistemic Gap**.
  1.  **Fair Price Norm:** The game proves that *if* your betting prices match your beliefs, incoherence loses chips. It does not prove your beliefs *are* those prices. You must argue verbally that refusing to bet at your credence is itself irrational.
  2.  **Utility:** Chips have linear value here. Real agents have diminishing marginal utility. A sure loss of chips might be acceptable insurance against a catastrophic loss elsewhere. You must state that we assume risk-neutrality.
  3.  **Epistemic Force:** Feeling nausea isn't proving falsity. You must explicitly state: "Vulnerability to exploitation suggests a defect in reasoning, but the Dutch Book itself is only a symptom, not the disease." The game shows the symptom; you must diagnose the disease.
