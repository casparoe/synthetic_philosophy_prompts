answer: |-
  Okay, let's take a breath and look at the frames. A hospital board deciding on an experimental wing feels too medical-ethics heavy. A law-firm partnership is too profit-centric, might obscure the public loss aspect. A municipal transit authority works best—public funds, bureaucratic inertia, and clear quarterly budget cycles. I'll go with the transit authority.

  **The Scenario**

  The MetroLink Authority faces a quarterly vote on the Greenline Extension. A federal grant covers 80% of costs, but includes a reverse-vesting clawback: each quarter, 10% of prior allocations convert to "protected capital." If MetroLink continues, this capital remains secure for future phases. If they vote to withdraw, that protected capital is instantly forfeited and publicly logged as "lost protected capital," triggering audit scrutiny. By Quarter 3, construction delays mean the required local match ($5M) exceeds the projected economic return ($4M). Pure financial logic dictates cutting losses now. However, withdrawing triggers the forfeiture of $15M in previously vested capital, framing the exit as an immediate, visible loss rather than a avoided future cost. The committee must choose between absorbing a certain, salient loss now or gambling on future viability to keep the capital "safe," even though expected value turns negative.

  **The Analysis**

  Here's the breakdown. Pure rational-choice theory looks at marginal flows. At Quarter 3, spending $5M to get $4M is a net loss of $1M. The $15M "protected capital" is irrelevant because it's only useful for a project with negative NPV. So, RC says quit.

  Prospect theory sees the reference point differently. The committee views the $15M as part of their current endowment. Quitting moves them into the loss domain (forfeiting $15M), while staying feels like maintaining the status quo, despite the future cost. Loss aversion makes the certain $15M loss feel heavier than the probabilistic future drains. They escalate to avoid realizing the loss.

  The structural feature doing the work is the **contingent asset conversion**. It turns sunk costs into assets you only keep by continuing. If you remove the clawback (so quitting doesn't forfeit past funds), the loss framing vanishes. Both theories would agree: quit immediately. The case collapses back to rational-choice agreement.

  A rational-choice defender might attack this by arguing the "public log" of lost capital creates reputation damage, raising future borrowing costs. If the reputation hit exceeds $1M, staying is actually rational, not irrational. They'd argue we're missing a hidden variable, not a cognitive bias.

