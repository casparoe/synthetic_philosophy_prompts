      *   **Section 4: The Defense (Reconciliation).**
          *   *Credence Threshold:* We aren't *sure* we are simulated. Base reality still has the highest stakes.
          *   *Nested Value:* Suffering is real even if you are a sim.
          *   *Substrate Independence:* Maybe simulations can become posthuman too.
      *   **Section 5: The Verdict (Conclusion).** I need to pick a side.
