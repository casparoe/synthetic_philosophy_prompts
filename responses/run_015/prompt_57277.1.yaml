answer: |-
  This is a translation task between two epistemic cultures: dynamical systems ecology and processual/post-processual archaeology. You are asking if "collapse" is a regime shift or a category error.

  Here is the translation of the three cases into your vocabulary, followed by the specific treatment of the decoupling argument, the residue report, and the verdict.

  ---

  ### 1. Case Translations

  #### **Late Bronze Age (LBA) Eastern Mediterranean**
  *   **Archaeological Claim:** The "Palace System" (redistributive economy, literacy, long-distance trade) vanished, but village-level subsistence persisted.
  *   **Resilience Translation:** A **high-dimensional regime shift** where the state variables defining "Palace Complexity" (trade volume, administrative throughput, energy surplus concentration) crossed a bifurcation point to a low-complexity attractor.
  *   **The Fit:**
      *   **Hysteresis:** Strong. The system did not return to the "Palace" attractor for centuries (the Greek Dark Ages), even when environmental parameters (rainfall) recovered. This implies the potential landscape itself was reshaped (loss of institutional memory/infrastructure).
      *   **Critical Slowing Down (CSD):** *Forced Fit.* Some paleoclimate proxies show increased variance prior to 1177 BCE, but attributing this to the *social* system rather than the *climate* driver is statistically hazardous. You are treating the climate as a control parameter, but the social system's sensitivity to that parameter was the changing variable.
  *   **The Stretch:** Defining the state variables. "Literacy" is not a continuous stock; it's a structural property of the network. Modeling it as a continuous variable $X$ where $X \to 0$ implies loss of function is a simplification. It is more accurately a **network percolation threshold**. When node connectivity (trade routes) drops below a critical $p_c$, the giant component (the Palace System) fragments.

  #### **Classic Maya (Southern Lowlands)**
  *   **Archaeological Claim:** Monumental construction and dynastic records stopped; population density dropped, but people remained and adapted (Northern Lowlands flourished).
  *   **Resilience Translation:** A **spatially heterogeneous metapopulation model**. The Southern basins became shallow/unstable due to endogenous feedback (soil depletion + drought), while Northern basins remained deep.
  *   **The Fit:**
      *   **Alternative Stable States:** Clean fit. "Monumental State" vs. "Post-Classic Village State."
      *   **Early Warning Signals:** There is evidence of increased variance in drought proxies and settlement abandonment rates prior to the Terminal Classic. This maps well to CSD.
  *   **The Stretch:** **Endogeneity of Parameters.** In your fisheries models, fishing pressure is often an external control parameter. In the Maya case, the "parameter" (resource extraction) is a function of the state variable (population). This creates a **fast-slow feedback loop** that standard potential landscape diagrams often obscure. The "collapse" was likely a **Hopf bifurcation** (oscillatory instability) rather than a simple fold, given the cyclical nature of Maya droughts and warfare, but the data resolution smears the oscillations into a step-function "collapse."

  #### **Rapa Nui (Easter Island)**
  *   **Archaeological Claim:** Old view: Ecocide/Crash. New view: Successful adaptation (rock gardening, shifted diet) despite deforestation.
  *   **Resilience Translation:** The Old View is a **Overshoot-and-Crash (Fold Bifurcation)**. The New View is **Adaptive Cycling (Panarchy)** where the system tracked a moving optimum.
  *   **The Fit:**
      *   **Loss of Resilience:** The Old View assumes the "Forest Attractor" was the only stable state. The New View argues the system transitioned to a "Agroforestry Attractor" without losing functional integrity (population stability).
  *   **The Stretch:** **Timescale Mismatch.** Your CSD metrics operate on time steps relevant to generation times or harvesting cycles. Archaeological "continuity" on Rapa Nui spans centuries. A flat population line in archaeology could hide ten local collapses and recoveries averaged out. You are looking for high-frequency variance in a low-pass filtered signal.

  ---

  ### 2. The Decoupling Argument: Elite vs. Majority

  This is the crux of your inquiry. The argument is: *The State collapsed; the Society did not.*

  **Can a basin-of-attraction picture put that?**
  **Standard Answer:** No.
  **Nuanced Answer:** Only if you model **Coupled Subsystems**.

  In a standard single-potential model $V(x)$, if the system leaves the basin, everything changes. To model decoupling, you need at least two state variables with distinct timescales and a coupling term.
  *   $x$: Elite/Political Complexity (Fast, high energy throughput, fragile).
  *   $y$: Subsistence/Farming (Slow, grounded in biophysics, robust).
  *   Coupling $k$: The extraction/legitimization link.

  **The Dynamics:**
  The "Collapse" is not a shift of the joint system $(x, y)$ to a new basin. It is a **structural bifurcation in the coupling parameter $k$**.
  1.  **Pre-Collapse:** $k$ is high. $x$ and $y$ are locked. The system sits in a "Civilization" basin where high $x$ is maintained by $y$.
  2.  **Stress:** External shock (drought) or internal friction reduces the stability of $x$.
  3.  **Decoupling:** $k \to 0$. The joint potential $V(x, y)$ separates into $V_1(x) + V_2(y)$.
  4.  **Result:** $x$ falls to its trivial attractor ($x=0$, no palaces). $y$ remains in its stable basin ($y > 0$, farmers persist).

  **Where the Framework Breaks:**
  Your framework treats "The System" as the unit of analysis. Archaeologists are arguing that "The System" was a **false category**. If you define the system as "The Palace," it collapsed. If you define it as "The People," it didn't.
  *   **Forced Fit:** To make this work in your vocabulary, you have to admit that **"Collapse" is a change in system boundaries, not just system state.**
  *   **Category Error:** In resilience theory, a regime shift implies a reorganization of feedbacks. If the farmers' feedback loops (planting/harvesting) never changed, *their* system did not undergo a regime shift. Only the *superordinate* political layer did. Your framework struggles to represent **hierarchical layering** without invoking Panarchy (which can be hand-wavy).

  ---

  ### 3. Residue Report

  Here is what remains after the translation. These are the elements that do not map cleanly.

  1.  **Normativity (The "Badness" of Collapse):**
      *   *Resilience:* Neutral. A turbid lake is as stable as a clear lake.
      *   *Archaeology:* "Collapse" implies loss of value (art, literacy, safety).
      *   *Residue:* Your framework cannot distinguish between a "good" reorganization and a "bad" collapse without an external utility function. If the farmers were happier without the palace tax, your model sees a regime shift; they see liberation.

  2.  **Identity vs. Function:**
      *   *Resilience:* Concerned with function (fluxes, stocks).
      *   *Archaeology:* Concerned with identity (Are they still "Maya" if they don't build temples?).
      *   *Residue:* A system can maintain functional resilience (calories consumed) while losing cultural identity. Your model sees stability; the archaeologist sees collapse. **This is a fundamental ontological mismatch.**

  3.  **Agency and Intentionality:**
      *   *Resilience:* Agents are often abstracted into rates or probabilities.
      *   *Archaeology:* Elites made *choices* to hoard, fight, or flee.
      *   *Residue:* You model bifurcations as inevitable given parameters. Archaeologists argue that specific contingent decisions (e.g., a specific king refusing to move the capital) altered the trajectory. Your model treats this as noise; they treat it as signal.

  4.  **The "Event" Horizon:**
      *   *Resilience:* Shifts happen when thresholds are crossed.
      *   *Archaeology:* "Collapse" is often dated to a specific decade (e.g., 1177 BCE).
      *   *Residue:* Your CSD signals should theoretically appear *before* the shift. Archaeological "collapse" is often defined *post-hoc* by the absence of pottery. You are looking for predictive signals in data that is defined by the outcome.

  ---

  ### 4. The Verdict

  **Does the missing piece show your vocabulary is too thin, or does it show the archaeologists' concept of collapse was never coherent?**

  **Verdict:** The archaeologists' concept of "Collapse" is incoherent *unless* it is disaggregated.

  Your vocabulary is not too thin; it is being applied to a **mis-specified system boundary**. The debate persists because one side defines the system as the **Political Superstructure** (which collapsed) and the other defines it as the **Socio-Ecological Substrate** (which persisted).

  In resilience terms: **The debate is about which attractor defines the system's identity.**
  *   If Identity = $x$ (Elite), then Collapse = True Regime Shift.
  *   If Identity = $y$ (Subsistence), then Collapse = Parameter Fluctuation / Noise.

  The "Decoupling" argument proves that "Civilization" is not a single dynamical system, but a **transiently coupled state** of two distinct systems. When the coupling breaks, the "Civilization" system ceases to exist, but the constituent systems do not necessarily shift basins.

  **Therefore:** The archaeologists are arguing about semantics using historical data. You are arguing about dynamics using structural models. The "Collapse" concept is a **folk category** that conflates *political dissolution* with *systemic failure*. Your framework exposes this conflation.

  ---

  ### 5. Changing the Verdict

  **What would make me concede these really are the same phenomenon?**
  1.  **Generic Early Warning Signals:** If you could demonstrate robust, cross-case CSD (increasing autocorrelation/variance) in *social* proxies (e.g., settlement size distribution, trade network connectivity) specifically *before* the political discontinuity, across all three cases. This would prove "Collapse" is a universal dynamical class, not a historical label.
  2.  **The Desynchronization Bifurcation:** If you can mathematically demonstrate that the "Decoupling" (Elite vs. Farmer) is a specific, recognizable bifurcation type (e.g., a **synchronization transition** in coupled oscillators) that occurs predictably under resource stress. If "Collapse" is just the name for the desynchronization of fast (political) and slow (subsistence) variables, then the frameworks merge.

  **Where is my mapping most likely to be wrong?**
  1.  **The Definition of "State":** I am assuming "Elite Presence" is a state variable. It might be a **control parameter** for the farmers. If the Elite are a parameter (like rainfall), then their disappearance is an external shock, not an internal regime shift. If the Elite are endogenous (extracted from the surplus), they are a state variable. Archaeology is currently undecided on this endogeneity.
  2.  **Data Resolution:** I am assuming the archaeological record is sufficient to detect CSD. It is likely not. The "noise" in your time series is measurement error. The "noise" in archaeology is **preservation bias**. You cannot distinguish critical slowing down from differential preservation rates without a taphonomic model.

  **Final Instruction:** Do not try to save the word "Collapse." It is a loaded term. Replace it with **"Dissolution of Coupled Hierarchy."** That is the precise dynamical description of what happened in the LBA, Maya, and Rapa Nui. If you do that, the debate vanishes, and only the modeling remains.
