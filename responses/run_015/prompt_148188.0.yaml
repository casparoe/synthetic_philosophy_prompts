answer: |-
  This institutional arrangement presupposes a sophisticated, somewhat paradoxical theory of sovereignty that relies on **reifying the State as distinct from both the Government and the People.** It is not merely a historical hangover; it is a functional metaphysics of power.

  Here is a mapping of the implicit philosophical commitments, the view of representation they entail, and where the theory remains underdetermined.

  ### 1. The Metaphysics of the "Corporation Sole"
  The primary commitment is that **authority resides in an Office, not a Person.**
  In legal philosophy, the monarch is a *corporation sole*: an artificial legal person that never dies. This commits the system to a dualistic anthropology regarding the ruler.
  *   **The Commitment:** We must be able to conceptually sever the biological human (who has private will, desires, and inequalities) from the Institutional Body (which has only public function).
  *   **The Implication:** This solves the "democratic equality" tension you noted. We do not privilege the *human* (who is theoretically irrelevant); we privilege the *function*. Heredity is not chosen because the bloodline is sacred, but because it is the only mechanism that completely divorces the officeholder from political meritocracy. If the monarch were elected, they would possess a democratic mandate rivaling the Prime Minister. By making the accession non-meritocratic, we ensure the monarch **cannot claim to represent the Will of the People.** They are a placeholder precisely because they lack a mandate.

  ### 2. The Phenomenology of Sovereignty (Making the Abstract Visible)
  Democracy posits that "The People" are sovereign. But "The People" is an abstract, invisible concept. You cannot sign a treaty with "The People."
  *   **The Commitment:** Political legitimacy requires a **phenomenological anchor.** The state needs a body to be seen, heard, and ritually enacted.
  *   **The Function:** The monarch converts the abstract continuity of the State into a visible timeline. When a bill is signed, it is not just a bureaucratic transaction; it is the State (via the Monarch) accepting the Government's advice.
  *   **Representation:** This is not representation in the democratic sense (acting *for* the will of constituents). It is representation in the **sacramental sense** (making the invisible institution present). The monarch *is* the State in a way the Prime Minister (who is merely the State's manager) is not.

  ### 3. The Separation of "Dignity" and "Efficiency"
  Walter Bagehot's distinction is the operational philosophy here, but it carries a deeper normative weight.
  *   **The Commitment:** Legitimacy has two sources: **Emotional/Symbolic** (Dignity) and **Rational/Legal** (Efficiency).
  *   **The Logic:** A purely rational system (a republic) risks legitimacy crises when efficiency fails (e.g., economic downturns). If the Head of State is also the Head of Government, dissatisfaction with policy becomes dissatisfaction with the State itself.
  *   **The Safety Valve:** By splitting the roles, the system allows citizens to hate the Government (efficiency) while loving the Country/State (dignity). The monarch absorbs the loyalty that would otherwise attach to the executive, insulating the regime from political volatility. This presupposes that **political stability requires a locus of affection that is immune to policy disagreement.**

  ### 4. The Nature of Agency: Notary vs. Agent
  You asked about the inconsistency with proxy authority (like power of attorney). This is the crux of the legal philosophy.
  *   **Power of Attorney:** The agent acts *on behalf of* the principal, often with discretion. The authority flows *from* the principal *through* the agent.
  *   **Constitutional Monarchy:** The monarch acts not as an agent of the people, nor as an agent of the ministers, but as a **Notary of the State.**
  *   **The Distinction:** A notary does not decide if the contract is good; they certify that the *process* was followed and that the act is now binding on the institution.
  *   **The Commitment:** This presupposes that **validity is procedural, not volitional.** The monarch's signature does not mean "I agree with this"; it means "This has been constituted according to the laws of the Realm."
  *   **Inconsistency?** It is inconsistent with liberal individualism (which says authority comes from individual will), but consistent with **institutional positivism** (authority comes from correct procedure). The monarch is the living seal, not the decision-maker.

  ### 5. Where the Theory is Underdetermined (The Reserve Powers)
  The philosophical fragility appears in the "edge cases." The system works smoothly only as long as the monarch *never* exercises personal will. But what if the government acts unconstitutionally?
  *   **The Problem:** Most constitutional monarchies retain "reserve powers" (e.g., the right to refuse dissolution of parliament or appoint a PM in a hung parliament).
  *   **The Underdetermination:** If the monarch is a mere notary, they have no right to judge the content. If they *do* judge the content (to save democracy), they cease to be a notary and become a **Guardian.**
  *   **The Tension:** This reveals that the system implicitly relies on the monarch being a **fail-safe mechanism** outside the democratic chain of accountability. This contradicts the democratic commitment that *all* power must be accountable.
  *   **Philosophical Gap:** The system claims the monarch has "no will," but structurally relies on them having the *capacity* for will in an emergency. This is the "Schmittian" exception hidden inside the liberal order. The sovereign is "he who decides on the exception," yet the constitutional fiction insists the sovereign *never* decides.

  ### Summary of Implicit Theory
  This institutional design commits you to the following view:
  1.  **Sovereignty is layered:** There is the *constituted power* (Government/Parliament) and the *constituting power* (The State/Monarch).
  2.  **Neutrality requires illegitimacy:** To be truly neutral, the Head of State must lack democratic legitimacy (hence heredity).
  3.  **Ritual is constitutive:** The performance of authority (reading the speech, signing the bill) is not just theater; it is the act that transforms a party-political decision into a State act.

  **The Philosophical Cost:**
  You must accept that **political equality is subordinate to institutional continuity.** You are preserving a hereditary privilege not because you believe in hierarchy, but because you believe **democracy requires a non-democratic anchor** to prevent the temporary majority from consuming the permanent State. It is a bet that the risk of a hereditary figurehead is lower than the risk of a politicized presidency.
