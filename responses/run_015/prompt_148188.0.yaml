prompt: |-
  ok so in the UK and Japan and scandinavian countries the monarch technically appoints ministers and signs bills but by convention only does it on government advice—british monarch hasn't refused assent in centuries, japanese emperor appoints whoever the diet already chose, and in sweden the king literally reads a cabinet-written speech at the opening of parliament. what philosophical commitments does this practice actually presuppose?

  like, does it require thinking that authority can be split between a symbolic holder and an actual decison-maker? or is it more that the monarch works as an institutional placeholder—making state continuity visible without exercising will? and there's this tension with democratic equality: we reject hereditary privilege everywhere else, but here we preserve it precisely to show that power flows from elsewhere. so what view of representation or institutional identitiy makes that coherent? and is there an inconsistency with how we treat other proxy-authority cases—say, when someone acts under a power of attorney?

  i'm not asking for a history lesson, just trying to map out what implicit theory of sovereignty and represention this institutional design quietly commits us to, and where it's philosophically underdetermined.
reasoning: |-
