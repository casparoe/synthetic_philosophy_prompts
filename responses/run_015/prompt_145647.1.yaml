      *Let's refine the turning point:* It turns on whether economic value is *discovered* (pre-existing but hidden) or *created* (brought into existence by the entrepreneurial act). If value is created, you need ownership to capture the creation. If value is discovered, an algorithm can find it. Hayek argues it's a mix, but the *creation* aspect requires risk.

      *Actually, the deeper point:* The "signal" itself. In a market, the signal (price) is generated by the *commitment* of resources. In the algorithmic model, the signal is generated by *reporting* of needs. Without the commitment (skin in the game), the signal is cheap talk.

      *Okay, I will argue that the algorithmic model fails because it conflates information transmission with information validation.*

