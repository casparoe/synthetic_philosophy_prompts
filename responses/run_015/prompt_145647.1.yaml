      *   *Lange/Cybernetic Socialism:* The market is a computer. Prices are signals. Equilibrium is a solution to a system of equations. If you have enough sensors (local nodes) and a good update rule (gradient descent on excess demand), you converge to efficiency without needing the "messiness" of private property.
