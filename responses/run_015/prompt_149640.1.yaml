          *   *Refinement:* I am arguing Fitzgerald is *sympathetic* but *critical*. To change my mind to "Fitzgerald is fully celebrating him," I'd need the narration to lack the disgust at the vulgarity. To change to "Fitzgerald hates him," I'd need Nick to reject him at the end.
          *   *Specific Constraint Check:* "Tell me specifically what scene or argument detail would change your mind about whether Fitzgerald is ultimately on Gatsby's side."
          *   *My Position:* Fitzgerald is on Gatsby's side regarding his *hope*, but against his *methods/delusion*.
          *   *The Pivot:* If the novel ended with Nick saying Gatsby got what he deserved because he was a criminal, that would shift it. But the specific detail? The phone call at the end. Wilson waiting by the phone. Gatsby waiting for Daisy's call. If Daisy *had* called, and Gatsby lived, the tragedy vanishes.
          *   *Wait, let's look closer:* The prompt asks what would change *my* mind (the AI's analysis). I need to take a stance first. My stance: Fitzgerald mourns Gatsby but indicts the culture that made him.
          *   *The "Change My Mind" trigger:* If the description of the parties lacked the underlying sense of dread/emptiness and was purely celebratory, I'd say he's celebrating success. If Nick's final judgment was purely condemnatory ("He was a fool"), I'd say he's against him.
          *   *Best specific detail:* The description of Gatsby's smile. Nick says it has an "eternal reassurance." If that description were absent or mocked, Fitzgerald isn't on his side.
          *   *Actually, let's go with the Funeral:* The emptiness of the funeral proves the world cut him down. If the funeral were packed, it would imply his success was validated.
          *   *Wait, I need to answer the prompt directly:* "Tell me specifically what scene or argument detail would change your mind..."
          *   *Okay, I will argue:* Fitzgerald is ultimately on Gatsby's side (romantically) but not his methods.
          *   *What would change that?* If Nick explicitly stated that Gatsby's dream was *worthy* of attainment (i.e., Daisy was actually worth it). The detail is Daisy's voice ("full of money"). If her voice sounded like something else, the dream might be valid.
          *   *No, let's stick to the text:* The final line. "So we beat on..." If that line were absent, and the book ended with "He was a criminal and he died," the sympathy vanishes.
          *   *Okay, I'll formulate this carefully.* I will argue that Fitzgerald is sympathetic to the *striver* but critical of the *goal*. The detail that cements this is the funeral. The detail that would change my mind is if Owl Eyes showed up and gave a eulogy praising Gatsby's *wealth* rather than his *humanity*.

      *   **Re-evaluating the "Change My Mind" prompt:** It asks what detail would change *my* mind about the author's alignment.
      *   *My current analysis:* Fitzgerald is ambivalent. He critiques the corruption but romanticizes the hope.
      *   *To shift to "Fitzgerald hates Gatsby":* If Nick refused to shake his hand at the end.
      *   *To shift to "Fitzgerald worships Gatsby":* If Gatsby actually won.
      *   *Selection:* I'll focus on the "Owl Eyes" at the funeral. He says "The poor son-of-a-bitch." If he said "He was a great man," it changes the tone.
      *   *Actually, the strongest lever is Nick's final judgment.* "You're worth the whole damn bunch put together." If Nick *didn't* say that, the book is a cautionary tale. Because he *does* say it, it's a tragedy.
      *   *Okay, I'll use that.* If Nick withheld that validation, I'd say Fitzgerald is enforcing Jantelagen. Because he gives it, he's fighting it.

  4.  **Refining the Argument (Jantelagen vs. Gatsby):**
      *   Jantelagen says: You are not special.
      *   Gatsby says: I am Jay Gatsby (a god).
      *   Fitzgerald says: You *are* special, but the world will kill you for it.
      *   This distinguishes it from Tall Poppy. Tall Poppy says "Don't grow tall." Fitzgerald says "It's beautiful that you grew tall, even though they cut you down."

  5.  **Drafting the Content (incorporating American English):**
