answer: |-
  This is a sophisticated reconstruction of the "Domestic Argument" against Quine, and it is no surprise it generated friction in your work-in-progress group. You have correctly identified that the engine of the argument is the slide from radical translation (other languages) to domestic reference (one's own language), and you are right to be suspicious of the global skepticism in (6). That conclusion is the *reductio* that most post-Quineans aim to avoid.

  Per your request, I will proceed in stages: first brainstorming three candidate diagnoses of where the argument goes wrong, then committing to the one I believe is philosophically strongest and most faithful to the textual nuances of the debate, and finally pricing the theoretical costs of the available alternatives.

  ### Stage 1: Brainstorming Candidate Diagnoses

  Here are three ways to block the argument, ranging from a Quinean internal defense to externalist objections.

  **Diagnosis A: The Ontological Relativity Defense (Quine's Official Line)**
  *   **Diagnosis:** The argument fails at **(6)**. It assumes there is an absolute standpoint from which "global meaning skepticism" can be evaluated as false. Quine's thesis of *ontological relativity* is that reference is determinate only *relative to a background language*. There is no "fact of the matter" absolutely, but there is a fact of the matter relative to your home language.
  *   **Cost:** You must accept that there are no absolute facts of reference or meaning. You save the assertability of your paper only by relativizing its content to your background theory. This concedes the core Quinean point while blocking the skeptical *conclusion* (by rendering it meaningless rather than false).
  *   **Verdict:** This respects (1) and (2) but requires you to abandon the intuition behind (7) that skepticism is straightforwardly false.

  **Diagnosis B: The Naturalness/Eligibility Objection (Lewis-style)**
  *   **Diagnosis:** The argument fails at **(2)**. The proxy-function argument assumes that all permutations of ontology are equally eligible candidates for reference. David Lewis argues that reference is constrained by the *naturalness* of properties. "Rabbit" carves nature at the joints; "rabbit-stage" or "gavagai-proxy" does not. The evidence underdetermines reference only if we ignore metaphysical eligibility.
  *   **Cost:** You must abandon Quinean behaviorism and nominalism. You have to posit a metaphysics of properties (universals or natural classes) that is not reducible to dispositions to assent. This is a high theoretical cost if you wish to remain within a naturalistic framework.
  *   **Verdict:** This blocks the argument early but requires importing resources Quine explicitly rejects.

  **Diagnosis C: The Scope and Order Distinction (The Conflation Objection)**
  *   **Diagnosis:** The argument fails at **(4)**. It conflates *Indeterminacy of Translation* (holophrastic, sentence-level) with *Inscrutability of Reference* (term-level, ontological). Quine insists these are distinct. Inscrutability (2) shows that *given a translation manual*, reference is unsettled. However, proxy functions are constructed specifically to *preserve the truth conditions of all sentences*. Step (4) treats the proxy-permuted manual as a rival that changes *meaning*, but if truth conditions are preserved, the empirical content of beliefs is unchanged.
  *   **Cost:** You must distinguish sharply between what we *believe* (propositional content/truth conditions) and what our terms *refer to* (ontology). You keep (1) and (2) but deny that (2) generates the skepticism in (6).
  *   **Verdict:** This allows you to keep (1) and (2) as Quine states them, but blocks the inference to global skepticism by showing the argument changes the subject from sentence-meaning to term-reference.

  ### Stage 2: Commitment and Argument

  I recommend you commit to **Diagnosis C: The Scope and Order Distinction**.

  This is the strongest diagnosis for a seminar paper engaging Quine on his own terms. It respects your desire to keep (1) and (2) while cutting the bridge at (4) on principle rather than fiat. It identifies a precise structural flaw in how the argument composes the two Quinean theses.

  **The Argument for Diagnosis C:**

  The crux of your argument is the move from (2) to (4), specifically the claim that the proxy-permuted manual is a "rival" in a sense that threatens belief attribution.

  Quine distinguishes between the **indeterminacy of translation** (which concerns the mapping of native sentences to home sentences, fixing truth conditions) and the **inscrutability of reference** (which concerns the mapping of native terms to objects, fixing ontology).
  *   **Thesis (1)** says there is no unique manual fixing truth conditions.
  *   **Thesis (2)** says that *even if we fix a manual*, there is no unique mapping of terms to objects.

  Your "Mirror Case" in (4) relies on the proxy function. By definition, a proxy function $f$ maps objects to objects such that for any predicate $P$, we reinterpret $P$ as $P^f$ where $P^f(x)$ is true iff $P(f(x))$ is true. This construction guarantees that the **truth conditions of all whole sentences remain invariant**.

  Here is the breakdown of the error in (4) and (6):
  1.  **Belief is Propositional:** When we attribute beliefs (as in step 6), we are typically attributing propositional attitudes keyed to the truth conditions of sentences (e.g., "The linguist believes *that there is a rabbit*").
  2.  **Invariance of Truth Conditions:** The proxy permutation preserves the truth conditions of "There is a rabbit." In the permuted manual, "rabbit" refers to rabbit-stages, but the predicate "is a rabbit" is simultaneously permuted to apply to rabbit-stages in exactly the same pattern.
  3.  **No Semantic Rivalry:** Because the truth conditions are invariant, the two manuals are not rivals regarding *what is believed* or *what is asserted*. They are only rivals regarding *what objects exist*.
  4.  **The Failure of (6):** Step (6) claims there is "no fact of the matter about what anyone believes." This does not follow. There *is* a fact of the matter about what sentences the speaker holds true (dispositions). There *is* a fact of the matter about the truth conditions of those sentences (relative to a manual). The only thing that is indeterminate is the *ontology* underlying those truth conditions.

  Therefore, the argument successfully proves **Ontological Relativity**, but it fails to prove **Global Meaning Skepticism**. The linguist's paper has a determinate meaning *in terms of truth conditions and empirical content*, even if the ontological commitment of that meaning is inscrutable. You can reject (6) without rejecting (1) or (2). You simply deny that ontological inscrutability entails semantic indeterminacy of the sort that undermines belief attribution.

  This diagnosis also addresses your worry about the "background language." You noted that "relativity seems to travel with me." That is correct, but it stops generating *skepticism* once you realize that relativity is not skepticism. Relative to your home language (the background), your terms have determinate reference. The proxy argument shows you cannot step *outside* that background to check if your reference matches the world absolutely. But you don't need to step outside to write your paper. You only need the internal coherence of the manual, which the proxy function preserves.

  ### Stage 3: Pricing the Alternatives

  You asked for an explicit pricing of the alternatives. Here is what each theoretical framework must give up to block your argument.

  **1. Quine's Own Resources (Ontological Relativity)**
  *   **Block Point:** Rejects (6) and (7).
  *   **Cost:** You must abandon the notion of "absolute facts of meaning." You accept that reference is determinate only relative to a background theory.
  *   **Price:** High intuitive cost. It requires accepting that the question "Do I *really* mean rabbits?" has no answer outside of a theoretical framework. It saves the thesis but deflates the realism of meaning.

  **2. Davidson-Style Charity**
  *   **Block Point:** Rejects (2).
  *   **Cost:** Davidson argues that the Principle of Charity is constitutive of interpretation. We cannot maximize agreement and simultaneously permute reference via proxy functions because doing so would violate the rationality constraints required to identify a speaker as a believer.
  *   **Price:** You must accept that evidence is not purely behavioral. Charity is a normative constraint that transcends the "total evidence" Quine allows. It limits the admissibility of proxy functions by appealing to rationality rather than just stimulus meaning.

  **3. Lewis-Style Eligibility (Naturalness)**
  *   **Block Point:** Rejects (2).
  *   **Cost:** As mentioned in Diagnosis B, this requires positing that some properties are metaphysically "more natural" than others. Reference magnetizes toward natural properties. "Rabbit" is more natural than "rabbit-stage."
  *   **Price:** High metaphysical cost. You must abandon Quinean nominalism. You are committed to a realism about properties that is not reducible to dispositions or linguistic behavior. This is a popular move in contemporary meta-semantics but is a significant departure from Quine's naturalism.

  **4. Causal or Informational Replies (Fodor, Millikan, etc.)**
  *   **Block Point:** Rejects (3).
  *   **Cost:** These theories argue that reference is determined by causal history or biological function, not just current dispositions. The linguist's term "rabbit" refers to rabbits because of a specific causal chain, not because of a proxy-compatible disposition.
  *   **Price:** You must abandon the idea that evidence is limited to "dispositions to assent." You commit to externalism: what you mean depends on facts about your environment and history that you might not have introspective access to. This blocks the "Mirror Case" because the causal history of the linguist's use of "rabbit" is not permutable by a function.

  ### Recommendation for Your Paper

  If your goal is to push back on Quine without abandoning naturalism or lapsing into Cartesian introspection, I suggest you adopt **Diagnosis C** as your primary critique, but leverage **Lewis (Diagnosis B)** as the reason *why* the distinction matters.

  Argue that Quine is right that (1) and (2) are distinct, but wrong that (2) is harmless. You can argue that while proxy functions preserve truth conditions *extensionally*, they fail to preserve *cognitive significance* or *explanatory role*. If "rabbit" means rabbit-stage, our explanations of behavior (e.g., "She ran because she saw a rabbit") lose their explanatory power unless we also permute the psychological states. But if we permute the psychological states, we lose the ability to explain behavior in terms of *objects* in the world.

  This allows you to keep (1) and (2) as formal possibilities but argue that (4) fails because the "rival" manual is not a *functional* rival. It preserves truth but destroys explanation. This is a stronger push-back than simply accepting Ontological Relativity, as it challenges Quine's claim that inscrutability is philosophically innocuous.

  **Summary of Steps for Your Paper:**
  1.  **Grant (1) and (2):** Concede Quine's technical points about underdetermination and proxy functions.
  2.  **Attack (4):** Argue that the "Mirror Case" does not generate a genuine rival for *belief attribution* because it preserves truth conditions at the cost of ontological coherence.
  3.  **Reject (6):** Conclude that global skepticism does not follow; only ontological relativity does.
  4.  **Push Back:** Argue that even ontological relativity is costly because it severs the link between language and the world that makes explanation possible (hinting at Lewis/Eligibility without full metaphysical commitment).

  This approach demonstrates a command of the text, respects the logical structure of the argument, and offers a substantive philosophical contribution rather than a mere exegesis.
