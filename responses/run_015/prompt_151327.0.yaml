prompt: |-
  Write a deadpan parody of a university tenure-and-promotion dossier, formatted as an internal committee memo with supporting appendices, submitted on behalf of an invented candidate entity—Pattern-7, a traffic-jam-level simmball—seeking a joint appointment in Emergent Causation and Substrate Physics at the fictional Institute for Careenium Studies. The dossier should treat the philosophical question of whether symbols and high-level patterns genuinely push substrate-level particles around, or whether every collision in the careenium is exhaustively explained by lower-level mechanics, as a live personnel dispute: the candidate claims causal responsibility for three specific invented micro-collisions (describe them as physically plausible but symbolically meaningful events, e.g., a coordinated deflection that resolves a deadlock), while the Physics Division’s counter-memo argues these are merely epiphenomenal correlations with no independent causal power, and the Emergent Causation chair writes a fence-sitting letter praising the pattern’s explanatory elegance without committing to downward efficacy.

  Keep the satire conceptually precise rather than cartoonish: the humor should arise from applying real distinctions—supervenience versus causation, causal exclusion arguments, the difference between causal sufficiency and explanatory bankruptcy, and the problem of identifying a symbol independently of its substrate realization—within bureaucratic prose. The candidate’s research statement should defend downward causation without slipping into dualism; the teaching evaluation should note that substrate-mechanics graduate students complain the syllabus neglects engine-level dynamics; and the diversity statement should address representation of dormant careenia and failed-upload patterns. Aim for about 800 words with numbered sections (Candidate Statement, Letters, Teaching Record, Committee Deliberation), maintaining a sustained deadpan institutional voice; do not wink at the reader.

  Because this parody invents an institutional framing and attributes specific causal claims to Pattern-7 that are not in Hofstadter’s original thought experiment, please conclude with a clearly marked separate note explaining where you have taken liberties with the careenium concept, which philosophical reading of downward causation your parody leans on (reductionist, emergentist, or agnostic), and whether any invented elements risk misrepresenting the actual substrate-symbol relationship. I want a committed piece: let the dossier’s internal logic take a definite stance on whether Pattern-7 gets tenure, defend that stance with reasons visible in the bureaucratic text, and use the concluding note to own the contested choices rather than balancing both sides and leaving the verdict to me.
