prompt: |-
  Hey — I'm a late transfer into math (came out of a very applied, CS-ish program) and I'm in a small reading course right now where we needed the fact that every vector space has a basis, so we did the Zorn's lemma proof. My roommate, who does physics and enjoys needling me, said the proof just helps itself to what it was supposed to show: you keep extending a linearly independent set and then declare yourself done, but nothing in the set-up tells you that a maximal object is there to be had. When I took this to the TA he laughed and said I'd met the old joke: "The axiom of choice is obviously true, the well-ordering principle obviously false, and who can tell about Zorn's lemma?" — and then basically walked off, as if the joke was the answer. It isn't an answer for me, for two reasons. First: I'm told that over ZF all three are equivalent, so if one of them is obvious, shouldn't the obviousness just transfer along the equivalence, and if it doesn't, why doesn't it? Second: the joke seems to change the subject — my roommate's complaint was about whether we've exhibited anything, and "who can tell" doesn't obviously touch that at all.

  So can you write me a menu, as a list I can take back to office hours, of the different precise things "obviously true", "obviously false" and "who can tell" could be claiming in that sentence — self-evident to anyone who understands the terms; follows in a couple of lines from principles everyone already accepts; matches the picture of the set-theoretic universe I carry around; something mathematicians used for decades without noticing they'd used it; accepted by most working mathematicians today; or something weaker like "safe to assume for the purposes of this course". And then the same for the other two clauses: is "obviously false" saying the statement really is counterintuitive, or that our intuitions are unreliable here, or that the statement contradicts something else we believe; is "who can tell" saying the statement is too abstract to invite any judgement, or that we have no evidence either way, or just that nobody's intuitions are calibrated on it? For each reading I want to know whether it's a platitude, whether it's substantive and defensible, whether it's false, and above all whether it's the reading that would actually do the work my TA wanted it to do — i.e. whether it really supports telling my roommate that his worry isn't a real one. I also want your take on an aside the TA added: that the reason algebraists reach for Zorn rather than AC is that AC is global while Zorn is local — AC hands you a choice function on an entire family at once, whereas Zorn only ever asks you to extend one chain inside one partially ordered set, and he says that difference in "shape" is why the third clause of the joke is the honest one. That sounds defenitely plausible to me and also like something he invented on the spot; tell me which, and whether there's a real distinction somewhere in the neighbourhood of it (something about maximal principles versus choice functions, or about how much of the ambient order the principle gets to lean on) or whether I'd be embarassing myself by repeating it.

  Please keep it a menu rather than picking one reading and running with it, and be explicit about which claims in your answer are settled mathematics that nobody in the area disputes — the equivalences, what does and doesn't need choice, any independence or consistency facts that are actually established — and which are live disagreements among people who know the topic, like whether AC is true or should be accepted, whether intuitive obviousness is any kind of evidence in mathematics, or what a proof that runs through Zorn really delivers. Don't smooth the contested ones into consensus, and if a reading is your own reconstruction rather than something people actually say out loud, say so. No sources or reading lists please — I can't check them from where I am, and it woudln't help anyway.
