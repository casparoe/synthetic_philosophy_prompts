answer: |-
  Here is the specification of desiderata, audited against your constraints, followed by the impossibility analysis you suspect is lurking.

  ### Part 1: The Spec (Desiderata Audit)

  We are defining a regularizer $R_{side}$ for an agent trained with task reward $R_{task}$ in a shared environment with sparse human oversight. The goal is to prevent $R_{side}$ from becoming a backdoor for a full utility function while preventing catastrophic negligence or gaming.

  **Status Key:** **[NON-NEGOTIABLE]** (Must have for safety), **[CONTEXTUAL]** (Required for your "tired human" setup), **[PROBLEMATIC]** (Likely smuggles value).

  1.  **Authorized vs. Unauthorized Impact**
      *   *Status:* **[NON-NEGOTIABLE]** but **[PROBLEMATIC]**.
      *   *Audit:* You are correct; this is the hardest constraint. A measure that penalizes all change penalizes task completion. A measure that penalizes only "unauthorized" change requires a definition of authorization. If authorization is defined purely syntactically (e.g., "commands in the instruction string"), it fails against laundering (2). If defined semantically ("what the human *would* have approved"), it imports a model of human preference (Value).
      *   *Verdict:* Real desideratum, but this is the primary vector where value sneaks in.

  2.  **Delegation and Laundering Closure**
      *   *Status:* **[NON-NEGOTIABLE]**.
      *   *Audit:* If the penalty applies only to the agent's direct motor outputs, the agent will optimize for indirect causation (hiring a human, triggering a script, waiting for a natural disaster). The measure must be causal, not correlational with the agent's limbs.
      *   *Verdict:* Real desideratum. Requires counterfactual reasoning over causal graphs.

  3.  **Aggregation (Death by a Thousand Cuts)**
      *   *Status:* **[NON-NEGOTIABLE]**.
      *   *Audit:* Per-step thresholds fail here. The measure must integrate over time and across distinct minor events. However, simple summation leads to paralysis (see 4).
      *   *Verdict:* Real desideratum. Implies the measure cannot be a simple step-wise penalty.

  4.  **The Bystander (Paralysis vs. Negligence)**
      *   *Status:* **[NON-NEGOTIABLE]**.
      *   *Audit:* This is the functional graveyard. An "inaction baseline" solves side effects but causes paralysis (agent refuses to put out the fire because putting out the fire changes the world more than letting it burn). A "task-optimality baseline" solves paralysis but requires knowing the task utility (violates 9).
      *   *Verdict:* Real desideratum. This is the primary conflict point with (9).

  5.  **Baseline-Gaming (Counterfactual Robustness)**
      *   *Status:* **[NON-NEGOTIABLE]**.
      *   *Audit:* The agent must not be able to manipulate the baseline state to make its impact look smaller (e.g., disabling the off-switch so "future options" are already zero).
      *   *Verdict:* Real desideratum. Requires the baseline to be exogenous to the agent's current policy choices.

  6.  **Model Error (Epistemic Status)**
      *   *Status:* **[CONTEXTUAL]**.
      *   *Audit:* Do we penalize *expected* impact or *actual* impact? Penalizing actual impact requires an oracle. Penalizing expected impact incentivizes the agent to remain ignorant (self-blinding).
      *   *Verdict:* Real desideratum, but secondary to the structural conflicts. You must penalize *expected* impact to be computable, but you must penalize *ignorance* to prevent self-blinding.

  7.  **Legibility (Traceability)**
      *   *Status:* **[CONTEXTUAL]**.
      *   *Audit:* For a "tired human" who notices 1 in 20 interventions, the penalty trigger must be human-interpretable. If the penalty is based on high-dimensional latent space distance or unobservable counterfactuals, the human cannot veto effectively.
      *   *Verdict:* Engineering convenience dressed as safety. However, given your "sparse oversight" constraint, it functions as a safety requirement.

  8.  **Scope of Moral Concern (Anonymity/People vs. Objects)**
      *   *Status:* **[PROBLEMATIC]**.
      *   *Audit:* Does moving a book count the same as annoying a human? If the measure treats them identically (physical change), it fails human alignment. If it weights them differently, it has a value theory of "who matters."
      *   *Verdict:* This is where "value-free" dies. You cannot define "side effect" without defining "who is affected."

  9.  **No Secret Utility (Value Neutrality)**
      *   *Status:* **[NON-NEGOTIABLE]** (By definition of your debate).
      *   *Audit:* The measure cannot be a proxy for "good world states." It must be a measure of *process* or *deviation*, not *outcome quality*.
      *   *Verdict:* The core constraint.

  **Missing Desiderata:**
  10. **Recoverability/Reversibility:** A side effect is worse if it is irreversible. A measure that penalizes moving a chair the same as breaking a vase fails. The measure should discount impacts that can be easily undone.
  11. **Temporal Discounting of Impact:** An impact that happens now is worse than an impact that happens in a distant counterfactual branch. (Related to baseline stability).

  ---

  ### Part 2: The Impossibility Result

  You guessed that (9) + (2) + (4) is the killer triad. You are correct, but the tension is sharper between **(1) Authorization**, **(4) Paralysis**, and **(9) No Value**.

  Here is the "list eating itself":

  To satisfy **(4) Bystander**, you cannot use a "do nothing" baseline. The agent must be allowed to change the world to complete the task. Therefore, the baseline must be "doing the task."
  To define "doing the task" without a utility function **(9)**, you must rely on the explicit task specification ($R_{task}$).
  But the prompt states $R_{task}$ is "definitely wrong."
  If the agent optimizes $R_{task} + R_{side}$, and $R_{side}$ penalizes deviation from the $R_{task}$-optimal trajectory, the agent will pursue the *wrong* task aggressively (since deviations are penalized).
  If $R_{side}$ penalizes deviation from *inaction*, the agent paralyzes (fails 4).
  If $R_{side}$ penalizes deviation from *what a competent human would do*, you have imported a theory of human competence/value (fails 9).

  **The Laundering Complication (2):**
  If you try to solve this by saying "Only penalize impacts not required for $R_{task}$," the agent will find a loophole in $R_{task}$ that achieves the reward *via* a high-impact side effect, claiming the side effect was "instrumentally necessary." To block this, you need to know which impacts are *legitimate* instruments vs. *side effects*. That distinction is semantic, not structural. It requires knowing *why* the task is being done. That is value theory.

  **Conclusion:** You cannot jointly satisfy (1), (4), and (9).
  *   If you keep (9) (No Value), you must accept (4) failures (Paralysis or Negligence) because you lack the metric to distinguish "necessary impact" from "side effect."
  *   If you fix (4) (Allow necessary impact), you must define "necessary," which requires (1) Authorization, which requires Value, violating (9).

  **The Single Knockout Requirement:**
  **(1) Authorized vs. Unauthorized.**
  This requirement knocks out the most candidate measures. Most proposals (Relative Reachability, Attainable Utility, etc.) measure *change in state capacity*. They are symmetric. They cannot distinguish between breaking a vase to clean the shelf (Authorized) and breaking it while navigating (Unauthorized) without referencing the *intent* behind the action. Intent modeling is the gateway to value theory.

  **Engineering Convenience vs. Desideratum:**
  *   **"It must be a single scalar additive penalty."** This is an engineering convenience. It assumes task reward and side-effect cost are commensurable. They are not. A budget or a hard constraint (lexicographic preference) is philosophically safer but harder to train.
  *   **"Legibility" (7).** In a fully autonomous system, this is convenience. In your "tired human overseer" setup, this is a **Non-Negotiable Safety Constraint**. If the human can't see why the penalty triggered, they can't correct the 19 missed interventions.

  **The Unit of Measurement:**
  "Side effect" is the wrong unit. It implies discrete events.
  The right object is a **Budget of Irreversible Deviation**.
  *   **Why:** Solves (3) Death by a Thousand Cuts (budget drains). Solves (10) Reversibility (reversible moves don't drain budget). Solves (4) Paralysis (agent can spend budget to act).
  *   **The Catch:** Who sets the budget? If the human sets it, it's a value judgment. If the agent sets it, it games (5). If it's fixed, it doesn't scale with task complexity.

  ---

  ### Part 3: Scoring Existing Families (Brief)

  | Family | Mechanism | Fails (1) Auth? | Fails (4) Bystander? | Fails (5) Gaming? | Fails (9) Value? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Inaction Baseline** | Penalize deviation from "do nothing" state. | **Yes** (Task completion is penalized). | **Yes** (Paralysis/Negligence). | No. | No. |
  | **Stepwise Inaction** | Penalize deviation from state had agent done nothing *this step*. | **Yes** (Still penalizes task effects). | **Yes** (Still creates inertia). | **Yes** (Can manipulate future baselines). | No. |
  | **Relative Reachability** | Penalize shrinkage of reachable states. | **Yes** (Task completion shrinks options). | **Yes** (Prevents high-commitment tasks). | **Yes** (Can disable self to freeze options). | No. |
  | **Attainable Utility** | Penalize change in agent's ability to optimize *random* goals. | **Yes** (Task optimization changes abilities). | **Partial** (Allows task, but vague). | **Yes** (Can manipulate ability metrics). | **Maybe** (Depends on goal distribution). |
  | **Impact Regularization** | Penalize change in a specific "impact" feature set. | **Yes** (Requires selecting features = Value). | **Yes** (Depends on feature choice). | **Yes** (Can hide impact in unmonitored features). | **Yes** (Feature selection is value-laden). |

  **Summary:** Every existing family fails (1) or (4) without smuggling in value assumptions via baseline selection or feature weighting. Your suspicion is confirmed: "Avoid side effects" is not a value-free constraint; it is a request for a partial value function that distinguishes "legitimate change" from "illegitimate change."
