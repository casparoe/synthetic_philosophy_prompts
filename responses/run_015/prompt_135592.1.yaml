answer: |-
  1. The three readings, ranked

  Reading (iii) is the most accurate: the theorem is a fact about the logical structure of the strategy-proofness definition. It establishes that the condition "truth-telling is a dominant strategy for all voters" is incompatible with non-dictatorship. Reading (ii) is the structural diagnosis: the impossibility arises because ordinal ballots discard intensity information, restricting the function space available to aggregate preferences. Reading (i) is the tempting but exaggerated policy conclusion. While honest decision-making is not *universally* guaranteed, the theorem does not prove that honesty is *rarely* rewarded. It proves only that no rule makes honesty *always* optimal. You should rank (iii) as the literal truth, (ii) as the mechanistic cause, and (i) as the pragmatic over-extension.

  2. Why the two rates come apart

  Your instinct is correct: the theorem concerns existence, while your rates concern measure. Gibbard–Satterthwaite guarantees that the set of manipulable profiles is non-empty for every voter (unless dictatorial). It does not specify the volume of that set. As the electorate size $N$ grows, the *voter's manipulability rate* (the probability a specific voter is pivotal and can profit) typically vanishes for common rules like majority. The probability of being pivotal scales as $1/\sqrt{N}$. However, the *electorate's manipulability rate* (the probability *someone* can manipulate) is the union of these events. Even if individual probabilities shrink, their union can approach one as $N$ increases, simply because there are more opportunities for manipulation somewhere in the system.

  The conceptual limit of your move is that Gibbard–Satterthwaite is a topological result, not a probabilistic one. It draws a boundary in the space of rules, not a distribution over profiles. Consequently, the theorem supports the pessimistic view (electorate rate > 0) while remaining silent on the optimistic view (voter rate $\approx$ 0). Your distinction highlights that a rule can be theoretically manipulable yet practically stable for any given citizen. The "stoppage" you feel arises because the theorem answers a binary question (is the set empty?) while you are asking a quantitative one (what is the measure?).

  3. A minimal worked example

  Consider three voters (1, 2, 3) and three alternatives (A, B, C) under Plurality Rule (most votes wins; ties broken alphabetically).
  Preferences:
  Voter 1: A > B > C
  Voter 2: B > C > A
  Voter 3: C > A > B

  Truthful voting yields one vote each for A, B, C. Tie-break gives A.
  Voter 2 prefers C over A. If Voter 2 votes truthfully (B), A wins. If Voter 2 misreports C, the tally is A:1, B:0, C:2. C wins. Voter 2 manipulates successfully.
  Now fix Voters 2 and 3 voting truthfully (B and C). Voter 1 votes A. Result: Tie (A, B, C) $\to$ A. If Voter 1 misreports B, tally is A:0, B:2, C:1. B wins. Voter 1 prefers A over B. If Voter 1 misreports C, tally is A:0, B:1, C:2. C wins. Voter 1 prefers A over C. Voter 1 cannot manipulate.

  Here, the electorate's manipulability rate is positive (Voter 2 can manipulate), but for this specific profile, Voter 1's manipulability rate is zero. This illustrates the pull-apart: the system is flawed (someone can cheat), but not every citizen faces a strategic dilemma in every instance.

  4. What the escape hatches actually buy

  Restricted domains (e.g., single-peaked preferences) change the picture in *kind*. If preferences align along a spectrum, the Median Voter Theorem applies, and truth-telling becomes a dominant strategy. Here, both your rates drop to zero without dictatorship. This is a genuine escape, but it requires empirical validation of the domain.

  Randomisation (Gibbard 1978) does not buy much. Strategy-proof randomised rules are essentially lotteries over dictatorial rules or choices between two alternatives. Chance preserves incentive compatibility only by reintroducing dictatorship or limiting choice, so it fails to restore full democratic aggregation.

  Approximate strategy-proofness in large electorates validates your "voter's rate" intuition. For many rules, the expected gain from manipulation vanishes as $N \to \infty$. This suggests the theorem's practical force weakens in large populations, even if the logical impossibility remains.

  Regarding the "strengthening" (likely Obvious Strategy-Proofness): this demands truth-telling be optimal without complex reasoning. This tightens the constraint rather than loosening it; it makes finding valid rules harder, not easier. It ensures the *quality* of strategy-proofness but does not escape the impossibility. Your distinction survives all these: restricted domains eliminate manipulability; approximation reduces the voter's rate; randomisation shifts the burden to chance.

  5. Strategy-proofness versus the thing I might really care about

  You are right to suspect strategy-proofness is a proxy. If your desideratum is that citizens need not model others, strategy-proofness is the exact formalisation of that wish. However, if the probability of needing to model others is negligible (low voter's rate), strict strategy-proofness may be an expensive requirement that sacrifices welfare.

  If your desideratum is that outcomes track intensities, ordinal ballots fail regardless of strategy-proofness. A cardinal rule might maximize welfare but be highly manipulable. Here, strategy-proofness conflicts with efficiency. You might prefer a rule that is slightly manipulable but captures intensity (like a scoring rule) over one that is strategy-proof but blind to passion. The theorem warns you that you cannot have it all: you must trade off incentive compatibility against expressive power or dictatorship. Your focus on the "gain from misreporting" touches this: if the gain is small, the violation of strategy-proofness matters less than the loss of welfare from ignoring intensities.

  6. Where my framing is muddled

  Your framing is not muddled; it is anticipatory of modern quantitative social choice. The two-rates distinction is not a dead end; it is the correct lens for evaluating practical impact versus theoretical impossibility. The only muddle lies in expecting Gibbard–Satterthwaite to speak to magnitudes. It is a boundary theorem, like the Second Law of Thermodynamics stating entropy increases, not a kinetic theory telling you the rate. Your instinct that the "practical force" rests on a slide between the rates is sharp. The theorem proves the game is not fair; your rates ask how often the foul is called. Pursue the quantitative question; the theorem merely tells you where not to look for a perfect solution.
