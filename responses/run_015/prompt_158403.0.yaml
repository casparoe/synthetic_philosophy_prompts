  # Operational Ethics Decision Procedure (OEDP)
  **Version:** 4.2 (Multi-Faith Field Use)  
  **Time Allocation:** 30 Minutes  
  **Authorized Users:** Senior Field Coordinators, Ethics Reviewers  
  **Purpose:** To classify the authority source of proposed directives and determine their binding scope across a multi-faith network.

  ---

  ## Part I: The Diagnostic Checklist
  *Instructions: Answer the following three tests for the proposed directive. Do not proceed to categorization until all three are marked.*

  ### Test 1: The Withdrawal Test (Modal Independence)
  **Question:** If the specific scriptural command or traditional injunction were removed or silent on this issue, would the obligation still stand based on human welfare, safety, or consensus?
  *   **Yes:** The obligation exists without the command.
  *   **No:** The obligation disappears without the command.
  *   **Unclear:** The command and welfare seem entangled.
  *   **🛑 STOP POINT:** If the answer relies on interpreting ambiguous scripture (e.g., "Does this verse apply to war?"), hand off to a Theologian. Do not guess exegesis.

  ### Test 2: The Outsider Test (Accessibility)
  **Question:** Can a secular humanitarian worker or a partner from a different faith tradition understand *why* this is wrong/right using only shared reason, law, or empathy, without needing revelation?
  *   **Yes:** The justification is public and universal (e.g., "causes unnecessary suffering").
  *   **No:** The justification requires specific faith knowledge (e.g., "defiles the soul," "violates covenant").
  *   **Mixed:** The principle is public, but the specific rule is not (e.g., "help the poor" vs. "tithe 10%").

  ### Test 3: The Stability Test (Counterfactual Context)
  **Question:** If the operational context changed drastically (e.g., extreme scarcity, different cultural setting), would the rule still hold, or is it tied to specific conditions?
  *   **Stable:** The rule holds regardless of context (e.g., "Do not execute prisoners").
  *   **Variable:** The rule depends on specific conditions (e.g., "Do not eat pork," "Rest on Saturday").
  *   **🚩 JUDGMENT FLAG:** If the rule is stable for "insiders" but variable for "outsiders," mark as **Hybrid**.

  ---

  ## Part II: Categorization Matrix
  *Based on your answers above, assign the directive to one of four categories.*

  | Category | Test 1 (Withdrawal) | Test 2 (Outsider) | Test 3 (Stability) | Operational Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. Reason-Tracked** | Yes (Obligation remains) | Yes (Public justification) | Stable | **Universal Policy.** Binding on all staff regardless of tradition. |
  | **B. Command-Constituted** | No (Obligation vanishes) | No (Faith-specific justification) | Variable | **Covenantal Practice.** Binding only on adherents of that tradition. Not enforceable on others. |
  | **C. Hybrid** | Yes (Principle remains) | Mixed (Public principle, specific rule) | Stable Principle / Variable Rule | **Adapted Policy.** The principle is universal; the specific implementation may vary by tradition. |
  | **D. Misaligned** | **Conflict** (Reason says X, Command says Y) | **Conflict** (Public good vs. Divine Will) | **Unstable** | **🛑 IMMEDIATE HAND-OFF.** Requires Senior Ethics Board & Theological Arbitration. Do not issue directive. |

  ---

  ## Part III: Application to Current Directives

  ### Case A: Absolute Prohibition on Torture of Detainees
  **Directive:** "Staff must never engage in or facilitate coercive interrogation techniques, regardless of security threats."

  *   **Test 1 (Withdrawal):** **Yes.** International Humanitarian Law and common moral intuition prohibit torture even without religious text.
  *   **Test 2 (Outsider):** **Yes.** Secular partners justify this via human rights and dignity.
  *   **Test 3 (Stability):** **Conflict.**
      *   *Reason:* Absolute stability (never permissible).
      *   *Command:* Some tradition-specific texts regarding "enemy combatants" in defensive wars allow for severe coercion to save lives (*pikuach nefah* or similar exceptions).
  *   **Categorization:** **🚩 JUDGMENT FLAG / Potential Misalignment.**
  *   **Analysis:** While Reason-Tracked in the secular sphere, specific tradition-commands may claim authority to override this in existential threats. The tests reveal a divergence: Reason says "Absolute," Command says "Conditional."
  *   **Action:** **Hand-off to Value-Judgment.** The procedure cannot settle whether the Covenantal exception overrides the Universal Rational prohibition. This requires the Senior Ethics Board to decide if the Network adopts the *higher* constraint (Reason) or allows *tradition-specific* derogations. Do not publish until arbitrated.

  ### Case B: Seventh-Year Debt-Release in Refugee Camps
  **Directive:** "All loans among displaced persons within the camp must be forgiven every seven years."

  *   **Test 1 (Withdrawal):** **Mixed.** Economic stability suggests debt relief is good, but a rigid 7-year cycle is not rationally necessary.
  *   **Test 2 (Outsider):** **Mixed.** Secular economists understand debt relief (Public), but the 7-year timing is faith-specific (Non-Public).
  *   **Test 3 (Stability):** **Variable.** The principle (prevent permanent indebtedness) is stable; the timing (7 years) is variable/contextual.
  *   **Categorization:** **C. Hybrid.**
  *   **Analysis:** The *obligation to prevent exploitation* is Reason-Tracked (Universal). The *mechanism (7th year)* is Command-Constituted.
  *   **Action:** **Adapted Policy.** Issue the directive as "Periodic Debt Jubilee to prevent exploitation," allowing field teams to set the timing based on local economic cycles rather than a rigid 7-year mandate, unless operating strictly within a single-tradition cohort.

  ### Case C: Partner-Tradition Dietary Restriction in Field Kitchens
  **Directive:** "All field kitchens must observe [Specific Tradition] dietary laws (e.g., no pork, specific slaughter methods) for all staff meals."

  *   **Test 1 (Withdrawal):** **No.** Without the command, there is no nutritional or safety reason to ban these foods.
  *   **Test 2 (Outsider):** **No.** A secular or different-faith staff member cannot access the justification (ritual purity/covenant) without conversion.
  *   **Test 3 (Stability):** **Variable.** Tied to the covenantal identity, not the operational context.
  *   **Categorization:** **B. Command-Constituted.**
  *   **Analysis:** The wrongness of eating the food is *created* by the command. It is not tracking an independent moral fact about health or harm.
  *   **Action:** **Restrict Scope.** This directive **cannot** be applied to the general network staff. It is binding only on adherents of that tradition. Field kitchens must provide *options* for observant staff, but cannot impose the restriction on all.
  *   **Note to Board:** This will likely meet resistance as it fragments communal dining. However, classifying this as Universal Policy violates the Reason-Tracked standard and imposes covenantal duties on non-covenantal staff.

  ---

  ## Part IV: Procedural Limitations & Meta-Theological Disclaimers

  **1. The Voluntarism Blind Spot**
  This procedure assumes that moral properties have some *modal independence* from divine will (i.e., that "goodness" can be recognized apart from "commandedness"). If a partner tradition holds to **Theological Voluntarism** (the belief that an act is good *solely* because God wills it, with no independent rational standard), Test 1 and Test 2 will systematically misfire. For such traditions, *all* obligations are Command-Constituted. The OEDP cannot resolve this meta-ethical dispute; it simply flags the resulting directive as "Non-Universal."

  **2. The Revelation Epistemology Gap**
  The procedure treats "Command" as a distinct data point. It cannot adjudicate disputes where one tradition claims a rational truth (e.g., "Charity is good") is *actually* a hidden command, while another claims a command (e.g., "Dietary laws") is *actually* rational. The OEDP classifies based on *accessibility*, not ontological truth.

  **3. The Misalignment Ceiling**
  In **Category D (Misaligned)**, the procedure offers no resolution mechanism. It is designed to detect conflict, not solve it. If a tradition asserts a command that violates independent moral reason (e.g., exclusionary violence), the OEDP flags it for hand-off. It does not possess the authority to declare the tradition "wrong," only to declare the directive "incompatible with Network Universal Standards."

  **4. Operational Friction**
  Categorizing a directive as **Command-Constituted** (like Case C) protects the multi-faith integrity of the network but may reduce operational cohesion. Reviewers must be prepared to justify why certain unifying practices are being decentralized based on this classification.

  ---
  **Approval:** Senior Ethics Reviewer
  **Date:** [Current Date]
  **Status:** Active for Q3 Operational Guidance Cycle
