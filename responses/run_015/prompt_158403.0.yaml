prompt: |-
  I'm the senior ethics reviewer for a multi-faith humanitarian network that issues quarterly operational guidance to field teams working in conflict zones. Our partner traditions disagree sharply over whether a moral constraint—say, that staff must never cooperate with armed groups to secure access, or that unpayable debts among displaced populations must be cancelled—is authoritative because it is rationally warranted and our traditions happen to align with it, or because specific revealed commands constitute it as wrong with no further reason required. I need a reusable decision procedure that my team, trained in theology but not in formal philosophy, can run in about thirty minutes on any proposed directive before it goes into a brief. The deliverable should be an ordered checklist of diagnostic questions—each with conditions for a sufficient answer, explicit stop-points where the decision must be handed to a theologian rather than resolved by fact, and clear flags where judgment is unavoidable—grounded in the conceptual space of the Euthyphro dilemma but translated into operational language. Specifically, it must distinguish four categories: command-constituted obligations (where the wrongness is created by the command itself, as with ritual or covenantal duties), reason-tracked obligations (where the command tracks an independent moral fact), hybrid covenant-reason cases, and misaligned cases where a putative command conflicts with independently warranted morality. Include a small set of concrete tests—about counterfactual stability of the obligation across possible worlds, accessibility of the justification to outsiders, and whether the obligation survives if the command were withdrawn—that can be applied without knowing philosophical labels. Then run the procedure on three directives: (a) an absolute prohibition on torture of detainees, (b) a seventh-year debt-release policy applied in refugee camps, and (c) a partner-tradition dietary restriction that field kitchens are asked to observe. The third should yield an answer my board will resist—likely that the restriction is purely command-constituted and therefore not binding on staff outside that covenantal relation—while the first should show a case where the command and the independent reason come apart in a way the tests cannot settle, forcing a hand-off to value-judgment. Conclude by stating exactly what the procedure cannot do: which meta-theological disputes it leaves untouched, and where it will systematically misfire if a tradition denies that moral properties have any modal independence from divine will.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Senior Ethics Reviewer for a multi-faith humanitarian network.
      *   **Audience:** Field teams and reviewers trained in theology, not formal philosophy.
      *   **Task:** Create a reusable decision procedure (checklist) to evaluate proposed operational directives.
      *   **Time Limit:** ~30 minutes to run.
      *   **Core Problem:** Disagreement over the source of moral authority (Euthyphro Dilemma): Is something good because God commands it (Divine Command Theory/Command-Constituted), or does God command it because it is good (Rational Realism/Reason-Tracked)?
      *   **Required Output:**
          1.  An ordered checklist of diagnostic questions.
          2.  Conditions for sufficient answers.
          3.  Explicit stop-points (hand-off to theologian).
          4.  Clear flags for unavoidable judgment.
          5.  Grounded in Euthyphro but in operational language.
          6.  Distinguish four categories: Command-Constituted, Reason-Tracked, Hybrid, Misaligned.
          7.  Include concrete tests (Counterfactual Stability, Outsider Accessibility, Withdrawal Survival).
          8.  Run the procedure on three specific cases: (a) Torture prohibition, (b) Debt-release, (c) Dietary restriction.
          9.  Specific outcomes required: (c) must show it's command-constituted/non-binding for outsiders; (a) must show a hand-off to value-judgment due to command/reason divergence.
          10. Conclusion: Limitations of the procedure (meta-theological disputes, modal independence denial).

  2.  **Deconstruct the Euthyphro Dilemma for Operational Use:**

      *   *Philosophical Concept:* Is the pious loved by the gods because it is pious, or is it pious because it is loved by the gods?
      *   *Operational Translation:* Is this rule binding because it makes sense humanely/universally (Reason), or because *our* specific tradition says so (Command)?
      *   *The Four Categories:*
          1.  **Reason-Tracked:** Universal human rights, harm reduction. (Good independent of command).
          2.  **Command-Constituted:** Rituals, specific covenantal laws. (Good *because* commanded).
          3.  **Hybrid:** Overlap (e.g., "Do not kill" is both rational and commanded).
          4.  **Misaligned:** Command contradicts reason (e.g., "Kill infidels" vs. Human Rights).

  3.  **Drafting the Decision Procedure (The Checklist):**

      *   *Constraint:* Must be doable in 30 mins by theologians, not philosophers. Language must be practical.
      *   *Structure:* Step-by-step flow.
      *   *Tests:*
          1.  *Withdrawal Test:* If the command vanished, would the duty remain?
          2.  *Outsider Test:* Can a non-believer understand *why* this is wrong without revelation?
          3.  *Counterfactual Test:* If circumstances changed, would the rule still hold?
      *   *Stop Points:* When theological nuance is needed (e.g., interpreting scripture).
      *   *Judgment Flags:* When the test yields ambiguity.

  4.  **Developing the Three Case Studies:**

      *   *Case A (Torture):* Needs to show divergence. Most traditions ban it, but is it because it's inherently wrong (Reason) or because Scripture says so (Command)? If a text *allowed* it in war, would we still ban it? This creates tension. The prompt asks for a "hand-off to value-judgment" where command and reason come apart. *Correction:* The prompt says "the first should show a case where the command and the independent reason come apart in a way the tests cannot settle, forcing a hand-off." This implies a scenario where perhaps one tradition's command is ambiguous but reason says no, or vice versa. Let's frame it as: Reason says "Never," but some textual interpretations might allow "exceptional interrogation." The procedure flags this tension.
      *   *Case B (Debt-Release):* This is a specific covenantal law (Leviticus 25, etc.). Is it universally rational? Economic stability vs. mercy. It's likely a Hybrid or Reason-Tracked in a humanitarian context (preventing exploitation), but rooted in Command. Let's aim for Hybrid: It makes rational sense for social stability, but the *specific* 7-year timing is Command-Constituted.
      *   *Case C (Dietary):* Needs to be Command-Constituted. Kosher/Halal. No rational health basis necessarily. Outsider test fails. Withdrawal test fails (if God didn't say it, it wouldn't matter). Outcome: Not binding on staff outside that covenant. This matches the prompt's requirement ("board will resist").

  5.  **Refining the Procedure (Iterative Process):**

      *   *Drafting Question 1 (Withdrawal):* "If the text were silent, would we still do this?"
      *   *Drafting Question 2 (Accessibility):* "Can a secular partner agree?"
      *   *Drafting Question 3 (Stability):* "Does this hold in a different context?"
      *   *Categorization Logic:*
          *   Yes/Yes/Yes -> Reason-Tracked.
          *   No/No/No -> Command-Constituted.
          *   Mixed -> Hybrid.
          *   Conflict -> Misaligned.
      *   *Stop Points:* Need to ensure theologians know when to stop guessing and consult exegesis.
      *   *Limitations:* Must address Divine Command Theory (DCT) hardliners who deny modal independence.

  6.  **Addressing Specific Prompt Constraints:**

      *   *30 Minutes:* Keep questions sharp.
      *   *Operational Language:* Avoid "ontological," "modal," "deontic." Use "binding," "universal," "context."
      *   *Case A Outcome:* Must force a hand-off. I need to construct the analysis so that the tests reveal a tension between a specific tradition's command (which might be nuanced) and the universal rational prohibition.
      *   *Case C Outcome:* Must conclude "Command-Constituted" and "Not binding on outsiders."
      *   *Conclusion:* Explicitly state what the procedure *cannot* do (resolve meta-ethics).

  7.  **Final Review against Constraints:**

      *   Did I include the four categories? Yes.
      *   Are there stop-points? Yes.
      *   Are there judgment flags? Yes.
      *   Is the tone appropriate (Senior Ethics Reviewer)? Yes, authoritative but practical.
      *   Did I handle the "board will resist" aspect of Case C? Yes, by explicitly stating the implication for multi-faith staffing.
      *   Did I handle the "modal independence" limitation? Yes, in the conclusion.

  8.  **Writing the Content:** (Self-Correction during drafting)
      *   *Check:* Make sure the "Withdrawal Test" isn't too hypothetical for field staff. Frame it as "If we didn't have this text, would international law or common conscience still require this?"
      *   *Check:* Ensure the distinction between "Hybrid" and "Reason-Tracked" is clear. Hybrid means the *specific form* is commanded, but the *principle* is rational (e.g., Debt release is rational, 7th year is commanded).
      *   *Check:* Case A needs to be tricky. Torture is universally banned by reason, but if a specific tradition has a text that *could* be read to permit coercion for safety, the procedure must flag that conflict. Actually, the prompt says "command and independent reason come apart." Let's assume the Command is clear (No Torture) but the *Reason* is debated (is it inherently wrong or just pragmatically bad?). Or better: The Command is specific to "covenant brothers" but Reason says "all humans." The procedure should flag that the *scope* is the issue. Let's go with: Reason says "Absolute," Command says "Conditional" (or vice versa). Let's stick to the prompt's instruction: "forcing a hand-off to value-judgment." I will structure the analysis to show that while Reason bans it absolutely, some Command interpretations allow exceptions, creating a "Misaligned" or "Tension" flag that requires senior theological arbitration.

      *   *Refining Case A:* The prompt says "the first should show a case where the command and the independent reason come apart in a way the tests cannot settle." This implies the tests yield conflicting data.
      *   *Refining Case C:* The prompt says "The third should yield an answer my board will resist." I need to be firm in the conclusion that this is *not* operational policy for the whole network.

  9.  **Final Polish:** Check tone, formatting, and ensure all "stop-points" and "flags" are visually distinct. Ensure the conclusion addresses the "modal independence" constraint explicitly.

  *(Self-Correction on Case A)*: To make the tests *not* settle it, the Withdrawal Test might pass (Reason says don't torture) but the Command Test might be ambiguous (Text is silent or context-specific). Or, the Command is absolute, but the Reason is utilitarian (torture doesn't work) vs deontological (torture is evil). The prompt asks for "command and independent reason come apart." I will frame it as: Reason demands universality, but the Command is framed within a specific covenantal war ethic. The procedure identifies this gap and hands it off.

  *(Self-Correction on Case C)*: Ensure I explicitly state that this limits its applicability to co-religionists only, which a multi-faith board might find exclusionary or difficult to manage logistically.

  *(Final check on Limitations)*: Must mention that if a tradition believes *only* Command creates morality (Voluntarism), this procedure's "Reason-Tracked" category is invalid for them.

