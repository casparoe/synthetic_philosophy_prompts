  ## 7. Instructor's Cheat Sheet for Debrief Questions
  *   **Q:** "Why did the Aggregate lie in Case 1?"
      *   **A:** Imbalance in group sizes (Weighting). The Drug group was mostly Low Risk (easy to cure), Placebo was mostly High Risk (hard to cure).
  *   **Q:** "Why did the Subgroups lie in Case 2?"
      *   **A:** Selection Bias / Collider Bias on the path. By looking only at people whose BP Normalized, you compared Drug patients (who needed the drug to normalize) against Placebo patients (who normalized naturally because they were healthier). You compared apples to oranges.
  *   **Q:** "So when do we aggregate?"
      *   **A:** When the partition variable is a **Mediator** (on the path) or a **Collider** (effect of treatment).
  *   **Q:** "When do we disaggregate?"
      *   **A:** When the partition variable is a **Confounder** (common cause).
