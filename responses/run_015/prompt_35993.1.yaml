answer: |-
  # Lesson Plan: The Review Board Protocol
  **Course:** Causality & Causal Inference (Upper-Level Seminar)  
  **Time:** 75 Minutes  
  **Students:** 14 (Philosophy & Statistics Mix)  
  **Goal:** Disabuse students of the heuristic "always disaggregate" by demonstrating that the correct decision depends on causal structure, not statistical tables.

  ## 1. Preparation & Materials
  Print the following packets. You need 14 copies of the **Briefing**, 14 of **Case 1**, 14 of **Case 2**, and 1 **Master Scoreboard** for the projector.

  *   **Handout A (Briefing):** Mission statement, scoring rules, glossary of terms (Recovery, Treatment, Control).
  *   **Handout B (Case 1 - "The Confounder"):** Aggregate Table only (initially).
  *   **Handout C (Case 1 - Subgroups):** Sealed envelopes or separate sheet distributed later.
  *   **Handout D (Case 2 - "The Mediator"):** Identical numbers to Case 1, different narrative context.
  *   **Handout E (Debrief Diagrams):** Two DAGs (Directed Acyclic Graphs) revealed at the end.

  **Room Setup:** One large table or seminar circle. Projector for the Scoreboard.

  ---

  ## 2. The Numbers (The Engine of the Paradox)
  *Use these exact numbers for both cases. They are pre-verified to produce Simpson's Paradox.*

  **Aggregate Data (Both Cases):**
  | Group | Patients | Recovered | Rate |
  | :--- | :--- | :--- | :--- |
  | **Treatment** | 100 | 52 | **52%** |
  | **Control** | 100 | 33 | **33%** |
  *Initial Impression:* Treatment is vastly superior (+19%).

  **Subgroup Data (Both Cases):**
  | Subgroup | Group | Patients | Recovered | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Group 1** | Treatment | 20 | 4 | **20%** |
  | | Control | 80 | 20 | **25%** |
  | **Group 2** | Treatment | 80 | 48 | **60%** |
  | | Control | 20 | 13 | **65%** |
  *Subgroup Impression:* Control is superior in **both** subgroups (+5% in G1, +5% in G2).

  ---

  ## 3. Timeline & Script (75 Minutes)

  ### 0:00 – 0:05 | Setup & Stakes
  **Instructor:** "You are the FDA Advisory Committee. Your goal is to maximize 'Life-Years Saved' in a simulated population of 10,000.
  *   **Approve an effective drug:** +100 Committee Points.
  *   **Approve a harmful drug:** -100 Points.
  *   **Reject an effective drug:** -50 Points (opportunity cost).
  *   **Reject a harmful drug:** +50 Points.
  We will run two review cycles. Your final grade depends on your committee's cumulative score."

  ### 0:05 – 0:25 | Case 1: The "Standard" Paradox
  **Distribute Handout B (Aggregate Only).**
  **Instructor:** "Study 1: A new anticoagulant. Here is the top-line data from the RCT. You have 5 minutes to discuss."
  *   *Students see Treatment 52% vs Control 33%.*
  *   *Consensus will likely be "Approve."*

  **Distribute Handout C (Subgroups).**
  **Instructor:** "Wait. The epidemiology team just leaked the stratified data. The variable is **Pre-Existing Risk Profile** (Group 1 = High Risk, Group 2 = Low Risk). Note the allocation: High-risk patients were disproportionately given the Treatment (compassionate use)."
  *   *Students see the reversal. Control wins in both High and Low risk.*
  *   *Philosophy students may argue about fairness; Stats students will spot the confounding.*
  *   **Vote:** Force a show of hands. (Most should switch to **REJECT**).

  **Reveal Case 1 Truth:**
  **Instructor:** "The Risk Profile was a **Confounder**. It influenced both assignment (doctors gave drug to sicker people) and outcome (sicker people die more). The Aggregate was biased; the Subgroups were truthful.
  *   **Correct Decision:** REJECT.
  *   **Committee Score:** +50 Points (if you rejected). -100 Points (if you approved)."

  ### 0:25 – 0:45 | Case 2: The Twist
  **Distribute Handout D.**
  **Instructor:** "Study 2: A new vasodilator. Appeal phase. Same data. Exact same numbers. But the context has changed. The stratification variable is **Post-Treatment Blood Pressure Normalization** (Group 1 = BP Remained High, Group 2 = BP Normalized)."
  *   *Crucial Narrative Detail:* "The drug works *by* lowering blood pressure. If your BP normalizes, you recover. If it stays high, you don't."
  *   *Time Pressure:* "You have 5 minutes. The pharmaceutical company is threatening to pull funding if you delay."

  **The Trap:**
  *   Students see the exact same table.
  *   Subgroups still say Control is better (65% vs 60% in Normalized; 25% vs 20% in High BP).
  *   If they apply the lesson from Case 1 ("Disaggregate!"), they will **REJECT**.
  *   If they trust the Aggregate, they will **APPROVE**.

  **Vote:** Force a show of hands. (Many will stick with REJECT due to Case 1 conditioning).

  **Reveal Case 2 Truth:**
  **Instructor:** "The variable was a **Mediator**. The drug causes Normalization, which causes Recovery. By conditioning on Normalization, you blocked the causal path. You asked: 'Does the drug help people *beyond* its ability to lower blood pressure?' The answer is no. But the drug *does* lower blood pressure.
  *   **Correct Decision:** APPROVE.
  *   **Committee Score:** +100 Points (if you approved). -50 Points (if you rejected)."

  ### 0:45 – 1:15 | Debrief & Formal Mapping
  **Project the Two DAGs.**

  1.  **Case 1 DAG (Confounder):** $Z \to X$, $Z \to Y$, $X \to Y$.
      *   Explain: $Z$ opens a backdoor path. We *must* condition to close it.
      *   Lesson: Disaggregation was correct.
  2.  **Case 2 DAG (Mediator):** $X \to Z \to Y$.
      *   Explain: $Z$ is on the causal path. Conditioning on $Z$ blocks the signal.
      *   Lesson: Aggregation was correct.

  **Key Discussion Points:**
  *   **Collapsibility:** Why did the weighted average lie in Case 1 but tell the truth in Case 2?
  *   **The "Table" is Blind:** Emphasize that the contingency tables were *identical*. The numbers cannot tell you which decision is right. Only the story (causal model) can.
  *   **The Overcorrection:** "You learned 'Always Disaggregate' from Berkeley. Today you learned 'Disaggregate only when $Z$ is a Confounder.' Next week, we will learn about Colliders, where disaggregating creates bias where none existed."

  ---

  ## 4. Troubleshooting: Predictable Failure Modes

  ### Failure Mode 1: The Arithmetic Freeze
  **Problem:** Students waste 10 minutes calculating percentages from counts, killing the timeline.
  **Fix:** The Handouts provided above include the **Rates (%)** alongside the counts. If they still stall, announce: "The rates are pre-calculated on the sheet; trust the math, debate the meaning."

  ### Failure Mode 2: The "Gotcha" Resentment
  **Problem:** Students feel tricked by the identical numbers in Case 2. "This is unrealistic; in real life, we'd know the variable type."
  **Fix:** Address this head-on in the debrief. "In real life, determining if a variable is Pre- or Post-treatment is the hardest part of causal inference. Data collection forms often omit timestamps. This game isolates the *logical* dependency: without that metadata, the table is useless. That is the point."

  ### Failure Mode 3: Groupthink / Dominant Voices
  **Problem:** In a 14-person seminar, 2 loud stats students might dictate the vote before others process the paradox.
  **Fix:** Assign **Silent Reading Time**. "For the first 3 minutes, no talking. Write your vote on a slip of paper." Collect slips, *then* open discussion. This ensures individual cognitive engagement before social convergence.

  ---

  ## 5. What the Game Cannot Simulate (The Instructor's Burden)
  No classroom staging can reproduce the **epistemic difficulty of identifying causal structure**.

  *   **In the Game:** I *told* them "Risk is Pre-existing" vs. "BP is Post-treatment." They accepted this as fiat.
  *   **In Reality:** No one hands you a DAG. You must infer temporal order from messy metadata, domain knowledge, or experimental design.
  *   **The Lecture Point:** You must explicitly state: "The game was easy because I gave you the causal graph. In your research, you will not have me. You will have to defend *why* you treated a variable as a confounder rather than a mediator. That defense is not statistical; it is substantive."

  ## 6. Handout Text (Copy/Paste Ready)

  **HANDOUT A: COMMITTEE BRIEFING**
  > **Mission:** Maximize patient outcomes.
  > **Scoring:**
  > *   Approve Effective Drug: +100 pts
  > *   Approve Harmful Drug: -100 pts
  > *   Reject Effective Drug: -50 pts
  > *   Reject Harmful Drug: +50 pts
  > **Instruction:** Do not discuss votes until instructed. Record your initial vote privately.

  **HANDOUT B: STUDY 1 (AGGREGATE)**
  > **Drug:** 100 Patients, 52 Recovered (52%)
  > **Placebo:** 100 Patients, 33 Recovered (33%)
  > *Variable Z:* Pre-Existing Risk Profile (High/Low).

  **HANDOUT C: STUDY 1 (SUBGROUPS)**
  > **High Risk:** Drug 20% (4/20) vs Placebo 25% (20/80)
  > **Low Risk:** Drug 60% (48/80) vs Placebo 65% (13/20)
  > *Note:* High Risk patients were disproportionately assigned to Drug.

  **HANDOUT D: STUDY 2 (APPEAL)**
  > **Data:** Identical to Study 1.
  > **Drug:** 52% Recovery. **Placebo:** 33% Recovery.
  > **Variable Z:** Post-Treatment Blood Pressure (High/Normalized).
  > *Note:* Drug is known to lower Blood Pressure. Normalized BP leads to Recovery.

