answer: |-
  ### I. Mapping the Negotiation: Agents, Options, and Trajectories

  To analyze the Montreal Protocol through strong longtermism, we must first disentangle the actual decision landscape of 1987 from the retrospective glow of success.

  **Agents and Option Sets**
  *   **States (US, UK, USSR, etc.):** Their option set was not simply "ban or don't ban." It included: (a) unilateral bans (US 1978 aerosol ban), (b) multilateral treaty with differentiated responsibilities (the Protocol), (c) voluntary industry targets, or (d) inaction. Their constraint was domestic political capital and economic competitiveness.
  *   **Chemical Industry (DuPont, ICI, etc.):** Initially opposed regulation. Their option set shifted when they realized patents on CFCs were expiring and substitutes (HCFCs/HFCs) could be patented at higher margins. Their choice was: fight regulation to preserve old margins, or pivot to support regulation to capture new markets.
  *   **Consumers:** Absorbed costs of transition (higher appliance prices) or faced health costs (skin cancer, cataracts).
  *   **Posterity:** The unrepresented principal. Their option set was determined entirely by the interaction of the above agents. They inherited either a depleted ozone layer with high UV flux and potential ecosystem collapse, or a stabilized one.

  **Trajectory vs. Welfare**
  Strong longtermism distinguishes between improving the *welfare* of present people and improving the *trajectory* of the future.
  *   **Welfare (Then):** The Protocol imposed transition costs on industry and consumers but delivered immediate health benefits (reduced UV exposure). This is a standard cost-benefit analysis within a single generation.
  *   **Trajectory (Future):** The Protocol altered the physical baseline of the biosphere (preventing ozone collapse) and, crucially, established a precedent for binding global environmental governance. It changed the *shape* of future cooperation.
  *   **The Longtermist Delta:** A strong longtermist cares less about the skin cancer cases averted in 1995 (welfare) and more about the prevention of potential biospheric tipping points and the institutional precedent set for handling global externalities (trajectory).

  **The 1987 Longtermist Adviser**
  If a strong longtermist adviser sat at the US negotiating table in 1987, armed with the view that the future is astronomically valuable and trajectory is key, what would they advise regarding the expenditure of political capital?

  *   **Option A: Spend on Montreal.** Rationale: While ozone depletion is not strictly existential, the *uncertainty* regarding ecosystem collapse creates a risk of civilizational setback. More importantly, successfully solving a global coordination problem builds "institutional muscle" for future, deadlier threats (climate, bio-risk).
  *   **Option B: Spend on Nuclear Risk.** Rationale: Nuclear war is a clear, immediate existential risk. Political capital is finite. If the treaty costs leverage needed for arms control, the longtermist calculus (dominated by x-risk) demands prioritizing nuclear disarmament.
  *   **Option C: Hold Capital.** Rationale: Save political goodwill for a future hinge moment (e.g., a climate crisis or AI governance window).

  **Verdict for the Adviser:** A strict x-risk focused longtermist (à la Toby Ord) would likely prioritize **Option B (Nuclear)**. Ozone depletion, left unchecked, makes the future worse but does not clearly end it. However, a trajectory-focused longtermist (à la William MacAskill) might support **Option A**, viewing the Protocol as a "proof of concept" for global governance, which is a bottleneck for all future risks. In 1987, given the limited understanding of climate co-benefits, the longtermist case for Montreal relies entirely on the *institutional precedent*, not the ozone itself.

  ---

  ### II. Running the Case Back Against the Theory

  You propose three features that look awkward for strong longtermism. Here is the analysis of which bite and which are absorbed.

  #### (i) The Motivation Problem (Self-Effacement)
  *The Critique:* The treaty passed because of near-term human health concerns and industry profit motives, not concern for posterity. If longtermism requires non-longtermist arguments to succeed, is it self-effacing?
  *The Theory's Response:* **Absorbable.** Strong longtermism is a criterion of rightness, not necessarily a decision procedure for public discourse. It is consistent with the view to say: "The action that maximizes long-term value is one that must be sold to voters using near-term arguments."
  *   **Sidgwick's Esoteric Morality:** This is a feature, not a bug. If appealing to "people in 2500" reduces the probability of the treaty passing, the longtermist calculus *commands* you to appeal to skin cancer and patents instead.
  *   **Limitation:** This does make longtermism a doctrine primarily for analysts and funders rather than a public movement. It accepts that the *justification* for an action may differ from the *motivation* required to enact it. This limits the view's ability to transform public moral discourse, but it does not falsify the theory.

  #### (ii) The Side-Effect Problem (Climate Co-Benefits)
  *The Critique:* The largest long-term benefit (climate mitigation via CFC reduction) was a by-product, not the aim. Does longtermism credit this?
  *The Theory's Response:* **Absorbable.** Longtermism is consequentialist. It evaluates actions by their expected outcomes, not the intentions of the agents.
  *   **Credit Assignment:** Longtermism credits the *intervention*, not necessarily the *virtue of the agents*. The fact that the climate benefit was accidental increases the expected value of similar interventions in the future (look for policies with high variance/uncertainty where positive externalities might lurk).
  *   **Implication:** This suggests longtermists should support "robust" policies that have multiple potential long-term benefits, even if the primary justification is narrow. It does not damage the theory; it simply refines the search strategy for high-EV interventions.

  #### (iii) The Existential Risk Problem (Trajectory vs. Survival)
  *The Critique:* Ozone depletion was not an existential risk. It would not have ended humanity. Yet this is the cleanest success story of global long-term coordination. The characteristic arguments of strong longtermism (x-risk dominance, hinge-of-history) would not have selected this target.
  *The Theory's Response:* **Genuinely Damaging.** This is the bite point.
  *   **The Mismatch:** Strong longtermism, in its dominant formulation, argues that because the future is vast, *survival* is the priority. Extinction loses everything; suffering loses only some value. Therefore, x-risk reduction should crowd out almost all other priorities.
  *   **The Montreal Counter-Example:** Montreal was a trajectory change, not a survival intervention. It made the future *better*, not *possible*. If the most successful example of long-termist-aligned policy is a non-x-risk intervention, it suggests the "x-risk dominance" thesis may be empirically fragile. It implies that "trajectory changes" (improving the quality/stability of the long-term future) are more politically tractable and perhaps more reliable than x-risk reduction, even if the theoretical upper bound of x-risk work is higher.
  *   **The Hinge Claim:** Longtermists often argue we are at a "hinge of history" where specific actions lock in long-term outcomes. Montreal supports the "hinge" idea (locking in a governance norm), but contradicts the content (it wasn't about existential safety).

  ---

  ### III. The Honest Verdict

  **Does the Montreal Protocol vindicate, embarrass, or reveal limits of strong longtermism?**

  It **reveals that the view was never really about cases like this one**, and in doing so, exposes a tension in the theory's priority ranking.

  1.  **Vindication of Value, Not Priority:** Montreal vindicates the claim that *present actions can profoundly affect the long-term future*. It proves that trajectory changes are real and achievable. However, it does not vindicate the *priority ranking* of strong longtermism. If strong longtermism dictates that x-risk reduction is the *dominant* priority, Montreal is evidence that high-value longtermist wins exist outside that category.
  2.  **The "X-Risk" Embarrassment:** A strict longtermist in 1987, following the "x-risk dominance" heuristic, might have advised against spending political capital on Montreal in favor of nuclear arms control. If Montreal turns out to have been higher EV (due to climate co-benefits and institutional precedent) than marginal nuclear work at the time, the heuristic failed. This suggests the theory's operational guidance is more uncertain than its philosophical foundations admit.
  3.  **Silence on Coalition Building:** Where the theory is silent is on *mechanism*. Longtermism identifies the target (posterity) but offers no theory of change for how to represent the unrepresented. The success of Montreal relied on aligning the interests of the present (health, profits) with the needs of the future. Longtermism has no account of how to do this other than "hope present interests align." It is a theory of evaluation, not a theory of political mobilization.

  **Conclusion:**
  Feature (iii) is the one that bites. Features (i) and (ii) are easily absorbed by consequentialist machinery. Feature (iii) challenges the core longtermist claim that existential risk reduction is the unique priority. Montreal suggests that **robust trajectory improvements** (making the future more stable and cooperative) may be a more reliable path to long-term value than the high-variance hunt for x-risk mitigation.

  The verdict is that the Montreal Protocol **embarrasses the priority structure of strong longtermism** while vindicating its **core insight about tractability**. It shows that we can successfully act for the future, but likely not by following the specific prescription to focus exclusively on existential risk. It suggests longtermism should be less about "preventing the end" and more about "building the capacity to endure," a distinction the theory often blurs.
