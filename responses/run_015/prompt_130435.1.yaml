      *   *Crux 4 (Exposure):* Staggered tech adoption. Is "Gen Z" global or just Western/Urban?
      *   *Crux 5 (Identity):* Does saying "I'm a Millennial" predict things beyond birth year?
      *   *Formatting:* Needs columns for Crux, Realist Phrasing, Skeptic Phrasing, Agreed Test, Predictions.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but keep the APC logic precise.
