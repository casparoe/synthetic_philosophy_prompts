      *   *Claim 1 (APC):* Explain the identification problem simply. You can't separate getting older, living in 2024, and being born in 1990 without extra assumptions.
      *   *Claim 2 (Boundaries):* Nobody thinks Jan 1, 1981 is a biological event. It's fuzzy.
      *   *Claim 3 (Social Reality):* Even if made up, the labels change behavior (looping effects).
      *   *Claim 4 (Boomers):* The Baby Boom is a demographic fact (fertility spike), unlike the "Millennial" label which lacks a population spike.
