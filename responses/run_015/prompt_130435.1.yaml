      *   **Goal:** Draft a *Joint Statement* both could sign.
      *   **Requirements:**
          *   Numbered section of agreed claims (must include: APC identification problem, no sharp metaphysical boundaries, labels do social work, Boomer fertility spike exception).
          *   Disagreements Table (Crux, Realist View, Skeptic View, Agreed Test/Case, Pre-registered Predictions).
          *   Specific Cruxes to address (or modify): Block vs. Smooth, Cross-domain coherence, Persistence, Exposure timing, Self-ascription/Looping.
          *   Verbal Dispute Flag: Explicitly acknowledge different definitions of "real."
          *   Tone: Armchair philosophy/sociology, no citations/reading lists, signable by both (concessions on both sides).
          *   Naming: "Cohort Realist" and "Cut-Point Skeptic" (or better).

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *Realist:* Believes cohorts share formative experiences that create lasting distinctiveness.
      *   *Skeptic:* Believes generations are marketing/media constructs imposed on continuous data, confusing age/period effects for cohort effects.
      *   *Common Ground:*
          *   APC (Age-Period-Cohort) problem is real and hard.
          *   Boundaries aren't magic (1980 vs. 1981 isn't a biological switch).
          *   Labels have performative power (people act like they are Millennials).
          *   Boomers are different (demographic bulge).
          *   "Real" is ambiguous (causal utility vs. natural kind).

  3.  **Drafting Section 1: Agreed Claims (The Preamble):**
