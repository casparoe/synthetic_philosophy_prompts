answer: |-
  Acausal trade maps to distributed systems as coordination between network-partitioned replicas via code isomorphism, but the translation fails because distributed systems enforce causal closure whereas functional decision theory treats logical equivalence as a signal channel.

  ### The Restatement

  Consider two processes, $P_1$ and $P_2$, executing in a fully partitioned network: no message passing, no shared memory, and no common causal ancestor in the Lamport clock sense (independent initialization). In standard distributed systems theory, these processes are statistically independent; $P_1$'s state transition function $\delta_1$ cannot depend on $P_2$'s output without a communication channel or shared randomness.

  Acausal trade restated in your vocabulary claims that if $P_1$ and $P_2$ run identical deterministic state machines (SMR) and possess common knowledge of each other's source code, they can achieve consistency without consensus protocols. $P_1$ performs a local rollout (simulation) of $P_2$'s logic. Since $Code(P_1) \equiv Code(P_2)$, the rollout is effectively a self-simulation. $P_1$ selects an action $A$ not because it causally influences $P_2$, but because the deterministic nature of the state machine implies that if $P_1$ outputs $A$, $P_2$ must also output $A$ (or a logically correlated $B$) given the same problem specification. The "trade" is the commitment to a branch of execution that maximizes utility across both replicas, relying on the invariant that identical code on identical logical inputs yields identical outputs. This treats the source code hash as a shared communication channel that bypasses the network partition.

  ### Where the Vocabulary Exposes Hidden Mechanisms

  The distributed systems vocabulary performs work the original argument obscures regarding **input correlation** and **common knowledge**.

  1.  **Shared Randomness vs. Logical Necessity:** In your field, if $P_1$ and $P_2$ are partitioned but must correlate outputs (e.g., for randomized consensus), they require a common coin or a shared ancestor to seed their RNGs. Acausal trade assumes the "inputs" to the decision function are logically correlated without specifying a physical mechanism. The DS vocabulary reveals that unless the environment inputs are also logically necessitated (which implies a common cause violating the partition assumption), the state machines will diverge on any non-deterministic instruction or external input. The philosophical argument often treats the decision problem as a closed system; the systems view demands you account for the I/O interface.
  2.  **Rollouts as Speculative Execution:** When $P_1$ simulates $P_2$, it is performing speculative execution. In systems, speculation is valid only if the speculation can be committed or rolled back based on ground truth. In acausal trade, the simulation *is* the ground truth. The DS vocabulary highlights that this requires the system to be purely functional with no side effects until the "commit" phase, whereas real agents (and processes) inhabit a physical world where execution has causal consequences regardless of the final decision output.
  3.  **Common Knowledge vs. Consensus:** You know common knowledge over unreliable links is fragile (requires infinite rounds or synchrony assumptions). Acausal trade replaces the communication rounds required to establish common knowledge with "logical necessity." The DS vocabulary identifies this as a category error: logical equivalence of code is not equivalent to common knowledge of state. $P_1$ knows $P_2$'s code, but $P_1$ does not know $P_2$'s *runtime state* unless there is a causal path.

  ### Residue Report

  **Translates Cleanly:**
  *   **Deterministic State Machines:** The concept of an agent as a function mapping history/log to action maps perfectly to SMR.
  *   **Rollouts/Simulation:** The FDT notion of "predicting" another agent is exactly what a Byzantine fault-tolerant system does when modeling potential behaviors of peers, or what a simulator does during testing.
  *   **Code Isomorphism:** The requirement that agents share "decision theory" translates cleanly to running identical binaries or protocol logic.

  **Survives with Distortion:**
  *   **Influence:** In DS, influence requires a causal path (message, shared mem, ancestor). In AT, "influence" is redefined as logical correlation. This distorts the definition of dependency graphs; in DS, if $A$ depends on $B$, there is an edge. In AT, there is dependency without an edge.
  *   **Common Knowledge:** In DS, this is an epistemic state achieved via communication. In AT, it is an axiomatic property of rational agents. The distortion hides the cost of establishing that knowledge.

  **No Expression (Missing):**
  *   **Physical Instantiation Constraints:** DS assumes processes occupy distinct physical resources with distinct failure modes (crash, Byzantine). AT often treats agents as abstract functions where instantiation costs are ignored.
  *   **Temporal Ordering:** DS relies heavily on causality (happens-before). AT explicitly attempts to bypass causal ordering, which has no equivalent in systems engineering outside of magic.

  ### Verdict on Suspicions

  **1. Symmetry: Obstacle vs. Channel**
  This is a **real asymmetry between the frameworks**, driven by divergent objectives. In distributed systems, symmetry among anonymous processes is a liveness obstacle (e.g., FLP impossibility, leader election conflicts) that must be broken via unique IDs or randomness to ensure progress toward a *single* consistent state. In acausal trade, symmetry is a safety channel used to ensure *matching* states across distinct locations. DS wants to break symmetry to assign distinct roles (Leader/Follower); AT wants to preserve symmetry to assign identical roles (Cooperator/Cooperator). You are not misreading; the frameworks optimize for different invariants (Consistency vs. Correlation).

  **2. Self-Locating Uncertainty**
  This is **foreign to distributed systems** and suggests the original claim is less determinate than it looks. In DS, even anonymous processes assume distinct instantiation indices (e.g., distinct clock drifts, distinct network interfaces, distinct memory addresses). If a process cannot distinguish itself from another copy, it cannot manage its own resource locks or commit logs without risking split-brain scenarios. The concept of "not knowing which copy you are" implies a metaphysical interchangeability of physical hardware that systems engineering rejects as a failure mode (e.g., cloned VMs causing network conflicts). The failure to translate here is not a defect of your vocabulary; it indicates that acausal trade relies on an indexical uncertainty that has no operational counterpart in physical computing systems.
