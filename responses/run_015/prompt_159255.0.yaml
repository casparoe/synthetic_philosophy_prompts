  ### First-Class Answer Reconstruction (Rubric)

  **Part A**
  *   **(i) Derivation & Maxim:** A first-class answer must identify the maxim of **Relation (Relevance)**. Crucially, it must distinguish the *way* Ada fails: she is **exploiting (flouting)** the maxim, not **violating** it. Violating implies a covert intent to deceive (maintaining the appearance of cooperation while undermining it); exploiting is ostentatious, signaling to the hearer that the CP is still in play at a deeper level, which triggers the inference. The derivation must show Ben assuming cooperation, noting the apparent irrelevance, using shared background knowledge to restore relevance, and inferring the proposition "the meeting went long."
  *   **(ii) Classification & Diagnostics:** Must identify this as a **conversational implicature** (specifically particularized). Two diagnostics must be applied correctly. **Cancellability:** Ada could add "but I don't mean to imply it was long" without semantic contradiction (though pragmatically odd given the premise). **Embedding:** The inference typically does not survive embedding (e.g., in the antecedent of a conditional). **Detachability:** The same content could be conveyed without the specific words (e.g., saying "Yes").
  *   **(iii) False Implicature:** Must distinguish *saying* (truth-conditional content) from *implicating* (inferred content). Ada *said* something true (sandwiches were brought). She *implicated* something false (meeting was long), assuming she intended the inference. Grice's apparatus handles this by locating truth conditions at the level of "what is said." Lying is typically defined as saying what one believes to be false; misleading via implicature is distinct.

  **Part B**
  *   **(a) Status of Evidential:** A first-class answer recognizes the tension. Evidentials often behave like **what is said** (truth-conditional) rather than implicature. **Cancellability:** "Door open-vi but I didn't see it" sounds contradictory, suggesting it is *said*. **Embedding:** "If door open-vi..." usually embeds the evidential condition, suggesting *said*. **Detachability:** Complicated by grammar (see b). The answer should note that while it looks like a marker (CI), diagnostics point toward *what is said*.
  *   **(b) Detachability & Grammar:** Must explain that **non-detachability** is a necessary condition for both *what is said* and *conventional implicature*, but not sufficient to distinguish them. It only distinguishes them from *conversational implicature*. Therefore, the fact that the grammar forces the suffix does not settle whether the content is *said* or *conventionally implicated*; it only rules out *conversational implicature*. The test is ill-defined if no synonym exists, but logically, non-detachability cannot prove "Said" over "CI".
  *   **(c) Quality & CI (Hypothetical):** Must accept the hypothetical ("Suppose... it is a conventional implicature"). If CI, it is not part of *what is said*. Therefore, strictly, she has not *said* something false. However, Grice holds that the maxim of Quality governs the whole contribution (one should not imply what is false). The answer should argue whether a false CI constitutes a lie or merely a violation of conversational norms, without contradicting the hypothetical premise.

  ---

  ### Point-by-Point Assessment

  **Part A(i)**
  *   **Claim:** "she violates the maxim of Relation"
  *   **Judgement:** **Wrong.**
  *   **Explanation:** You describe a process where Ben detects the failure and infers meaning ("Ben can detect... assumes she is still observing the Cooperative Principle"). In Grice's terminology, this is **exploiting (or flouting)** a maxim, not **violating** it. A *violation* is covert (intended to deceive); an *exploitation* is ostentatious (intended to generate an implicature). Since the question explicitly asks you to distinguish the "way in which she is failing... as opposed to the other ways," this terminology error indicates a conceptual confusion about the mechanism of implicature generation.
  *   **Cost:** -1.5 marks. The derivation logic is otherwise sound, but the classification of the failure is central to the theory.

  **Part A(ii)**
  *   **Claim:** "Two diagnostics confirm this. First, cancellability: Ada can add, without contradiction, '…although the meeting still finished on time — she just had leftovers'"
  *   **Judgement:** **Partly Right.**
  *   **Explanation:** You understand the concept of cancellability, but your example conflates cancelling an implicature with denying a premise of the inference. A cleaner test is "The chair brought sandwiches, but I don't mean to imply the meeting went long." Your example relies on changing the factual background (leftovers), which makes it a denial of the shared knowledge rather than a pure cancellation of the inference. However, you grasp the logical point that the content is not entailed.
  *   **Claim:** "embedding: in 'If the chair brought sandwiches we are in trouble,' the suggestion that a meeting went long does not survive"
  *   **Judgement:** **Right.**
  *   **Explanation:** Correct application. Conversational implicatures typically do not project through conditionals.
  *   **Cost:** -0.5 marks. For the slightly messy cancellability example.

  **Part A(iii)**
  *   **Claim:** "Ada did implicate something false. She did not say anything false... truth and falsity attach in the first instance to what is said"
  *   **Judgement:** **Right.**
  *   **Explanation:** This is the correct Gricean distinction. You correctly identify that lying is tied to *saying*, while one can be misleading via implicature without lying.
  *   **Claim:** "implicature is a separate layer of speaker meaning that is not subject to the same evaluation."
  *   **Judgement:** **Partly Right.**
  *   **Explanation:** Implicatures *are* subject to truth evaluation (we can call an implication false), but they do not determine the truth value of the *statement*. Your phrasing is slightly vague but the core distinction is secure.
  *   **Cost:** 0 marks lost. Strong answer.

  **Part B(a)**
  *   **Claim:** "The witness content is not a conversational implicature... it is encoded in the suffix. So it is conventional"
  *   **Judgement:** **Partly Right.**
  *   **Explanation:** You correctly rule out conversational implicature. However, you jump to "conventional" without fully distinguishing it from "what is said."
  *   **Claim:** "Detachability is decisive... In Kalen there is no reformulation available at all... Non-detachability is the mark of content that is genuinely part of the speaker's commitment, so the witness content is part of what Meera said."
  *   **Judgement:** **Wrong.**
  *   **Explanation:** This is a major conceptual error. **Non-detachability** is a feature of *both* "what is said" and "conventional implicature." It distinguishes them from *conversational* implicature. It cannot, by itself, distinguish "Said" from "Conventional Implicature." You use a test that groups Said and CI together to argue for Said over CI. Furthermore, you did not run **cancellability** or **embedding** here, which are the diagnostics that actually distinguish Said from CI (as CI is usually non-cancellable but non-truth-conditional).
  *   **Cost:** -3 marks. The reasoning relies on a misunderstanding of what the detachability test establishes.

  **Part B(b)**
  *   **Claim:** "Does that settle that the content is conventionally rather than conversationally implicated? ... Non-detachability is the mark of content that is genuinely part of the speaker's commitment, so the witness content is part of what Meera said."
  *   **Judgement:** **Wrong.**
  *   **Explanation:** You fail to answer the specific question asked. The question asks if non-detachability settles the **Conventional vs. Conversational** distinction. You argue it settles the **Said vs. Conversational** distinction. More importantly, you claim the test is "decisive" for proving the content is *Said*. As noted above, non-detachability is consistent with Conventional Implicature. The lack of alternative forms makes the test difficult to apply, but logically, non-detachability does not prove the content is truth-conditional.
  *   **Cost:** -3 marks. Fundamental misunderstanding of the diagnostic's logical force.

  **Part B(c)**
  *   **Claim:** "Suppose, for the sake of argument, that the witness content is a conventional implicature." (Prompt Instruction)
  *   **Student Answer:** "The consequence is straightforward. What Meera said includes that she witnessed the door being open."
  *   **Judgement:** **Wrong.**
  *   **Explanation:** You have ignored the instruction to argue *from the supposition* that the content is a conventional implicature. You maintain your previous position that it is *what is said*. This invalidates your answer to this sub-question. You are required to explore the consequences of it being a CI (e.g., does Quality apply to CIs? Is the utterance false if the CI is false?). By reverting to "She said something false," you contradict the premise of the question.
  *   **Cost:** -2.5 marks. Only minimal credit for discussing Quality at all.

  **Part B (Caveat)**
  *   **Claim:** "Calculability is Grice's weakest requirement... over-intellectualises ordinary conversation"
  *   **Judgement:** **Irrelevant.**
  *   **Explanation:** While philosophically interesting, this does not address any part of Question 3. It does not recover marks lost elsewhere.

  ---

  ### Mark and Justification

  **Mark: 9/20**
  **Band: Third Class (45%)**

  **Justification:**
  Part A demonstrates a solid grasp of the basic Gricean framework, particularly the distinction between saying and implicating in A(iii), though the confusion between "violating" and "exploiting" in A(i) is a significant terminological and conceptual error. Part B, however, reveals a fundamental misunderstanding of the diagnostic tests: you treat non-detachability as proof of truth-conditional content (Said) when it is consistent with Conventional Implicature, and you fail to engage with the hypothetical premise in B(c), answering a different question than the one set. The strong performance in Part A prevents a fail, but the errors in Part B preclude a 2:2.
