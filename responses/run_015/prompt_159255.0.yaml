          *   *Key Distinction:* Saying false vs. Implicating false. Grice allows implicating false things without lying (if what is *said* is true).
          *   *The Twist:* If Ada *knew* they were leftovers, and knew Ben infers "long", and said it anyway... did she implicate "long"? Yes, if she intended the inference. Is it false? Yes. Did she lie? No, because what she *said* (sandwiches) was true.
