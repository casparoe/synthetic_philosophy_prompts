answer: |-
  1. The fundamental Hamiltonian describes only individual particle trajectories, containing no intrinsic variable corresponding to the macroscopic property of temperature.
  2. Deriving temperature necessitates a coarse-graining procedure that partitions phase space into macrostates based on a specific selection of relevant degrees of freedom.
  3. This selection criterion is not dictated by the microphysics itself but relies on an observer-relative distinction between relevant and irrelevant information.
  4. Consequently, the lower level is not ontologically sufficient to generate the higher level, as the structural framework for emergence is imported rather than deduced.
  5. This argument supports weak relational pluralism by denying downward causation yet also denying that the lower level is ontologically sufficient for the higher.
