      *   *Why wouldn't it burst?* If the private signals are weak relative to the public history *and* the public history is self-reinforcing due to Constraint 4.
      *   *Actually, looking closer at Constraint 4:* "The variable the participants are trying to track must be partly produced by the group's own choices." This implies the state is endogenous.
