      *   *Standard Cascade Model (Bikhchandani, Hirshleifer, Welch):* Agents act sequentially. They observe prior actions and receive a private signal. If the public history outweighs the private signal, they ignore the signal (cascade). Cascades are fragile because if private signals were revealed, the public information would update correctly.
