      *   *To make it "wrong":* There must be an underlying quality independent of funding, *but* the evidence available is contaminated by the funding decision. Or, there is a threshold effect. If enough people fund A, it succeeds. If enough fund B, it succeeds. If they split, both fail.
      *   *Better approach for "Wrongness":* The underlying state *is* exogenous (e.g., which drug works), but the *evidence* is endogenous (e.g., only the adopted drug gets tested/tracked). If they adopt the wrong drug, they never learn the right drug works.
