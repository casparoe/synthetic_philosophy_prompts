      *   *The Problem:* Standard cascade theory assumes an exogenous state of the world (e.g., Is the restaurant good?). If the state is endogenous (e.g., Is this technology viable?), the "truth" depends on adoption.
      *   *The Challenge:* I need to show that rational herding leads to a *wrong* outcome (defined counterfactually) and that releasing private information *doesn't fix it* (or the cascade is robust).
