answer: |-
  Subject: Re: Probability ontology vs practice

  Hi there,

  I hear you on the argument, and honestly, it is refreshing that you are having it because most people just spreadsheet their way into a false sense of security without ever asking what the numbers mean. The reason your team fights every time a new analyst joins is that you are all speaking different metaphysical languages while trying to fill the same cell in Excel. The frequentist thinks the number is a property of the world waiting to be measured, the Bayesian thinks it is a state of knowledge waiting to be updated, and the propensity advocate thinks it is a physical tendency waiting to be modeled. When the data is rich and stable, all three converge on the same digit, which is why the fight stays low-grade until you hit the edge cases. To solve this, you need a protocol that forces the analyst to declare which game they are playing before they pick up the controller. Here is a decision procedure you can hand to a new hire that strips the philosophy down to operational steps.

  The procedure starts with a single question about the reference class. Ask whether there exists a large set of past events that are identical in all causally relevant respects to the event you are pricing. A sufficient answer here requires at least thirty to fifty observed occurrences under conditions that have not structurally changed. If the answer is yes, you are in frequentist territory. You calculate the relative frequency, apply credibility weighting if necessary, and you are done, though you must note that this number assumes stationarity, meaning the future will behave like the past. If the answer is no, because the event is unique or the data is sparse, you move to the second question. Ask whether there is a validated causal model based on physical or logical mechanisms that links the current state to the outcome. A sufficient answer here requires a model that has been back-tested against similar systems or derived from first principles that are universally accepted, like gravity or contract law. If you have this, you are in propensity territory. You run simulations on the model to generate a probability distribution, but you must attach a second number representing model uncertainty. If the answer is no, because there is no data and no physics-based model, you move to the third question. Ask whether there is a consensus among independent experts who have skin in the game. A sufficient answer requires eliciting probabilities from at least three experts who cannot benefit from hedging their bets, and their estimates must converge within a reasonable margin. If they converge, you take the average as a subjective Bayesian probability. If they do not converge, or if there are no experts, the procedure stops and declares the probability ill-defined.

  There is a specific handoff point in this procedure where math ends and judgment begins, and you need to be explicit about it with your team. The handoff occurs at the selection of the reference class in step one and the selection of the prior belief in step three. Choosing which past events count as identical to the current one is not a statistical test; it is a judgment call about similarity that wears a lab coat. Similarly, choosing a prior distribution when data is scarce is a judgment about values and risk appetite, not a fact about the world. The procedure cannot automate this. If an analyst tries to hide behind a formula at these steps, they are lying about the objectivity of the output. The protocol requires them to sign off on these choices by name, acknowledging that this is where their professional judgment overrides the algorithm. This is where you protect the company from model risk, by admitting that the model is only as good as the human assumptions feeding it.

  Now let us run this on your three cases to see where the bodies are buried. First, take the brand new line of business with no loss history. You ask the first question about the reference class and the answer is no, because by definition you have no history. You ask the second question about a causal model and the answer is likely no, because new business lines usually involve market behaviors or emerging risks that do not obey fixed physical laws like engineering does. You move to the third question about expert consensus. Even if you have experts, their estimates will vary wildly because there is no anchor. The procedure here should stop and tell you that the probability is ill-defined. The unlovable truth is that any number you write down for this is not a probability of loss; it is a price parameter determined by your capital surplus and risk appetite. You are not measuring risk; you are deciding how much risk you want to buy. If you tell the committee that this is a calculated probability, you are misleading them. It is a subjective bet dressed up as actuarial science, and you should price it with a margin of error so wide it practically touches zero and infinity.

  Second, consider the specific bridge failing in ten years. You ask the first question about a reference class. You might have data on similar bridges, but this specific bridge has unique stress loads, maintenance history, and environmental exposure, so the frequentist answer is weak. You move to the second question about a causal model. Here you likely have engineering models based on material fatigue, load limits, and environmental decay. This is propensity territory. The procedure allows you to generate a number, but it requires you to attach a model uncertainty charge. The answer you get is conditional on the engineering model being correct. If the model misses a corrosion mechanism or a climate change effect, the probability is wrong. The handoff here is in trusting the model inputs. The analyst must declare that this probability is valid only if the physical assumptions hold, and if the committee wants a different number, they are arguing with the physics, not the math.

  Third, look at the mid-level employee quitting within a year. You ask the first question about a reference class. You absolutely have this. You have HR data on turnover rates for similar roles, tenure bands, and performance levels. This is frequentist territory. You calculate the base rate. Then you check for stability. If the company is not undergoing a merger or mass layoff, the process is stationary enough. You might adjust slightly for individual performance reviews, which is a small Bayesian update on the frequentist base. The procedure yields a robust number here. It is not perfect, but it is grounded in observable reality with a large sample size. This is the easiest of the three, and it is where your team should spend most of their time because the ontology matches the math.

  The reason you will not love the first case is that it strips away the comfort of precision. Insurers hate saying we do not know, because capital markets hate uncertainty. But the procedure forces you to admit that for new ventures, you are not an analyst discovering a number; you are an entrepreneur setting a price. The bridge case is uncomfortable because it relies on models that can be catastrophically wrong in black swan events. The employee case is the only one where you can sleep at night. If you implement this procedure, you will stop fighting about frequentism versus Bayesianism and start fighting about whether the reference class is valid or the experts are biased, which is where the actual work lies. I hope this helps you sleep better than the argument did.

  Best regards
