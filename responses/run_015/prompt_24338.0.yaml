  1.  **Analyze the Request:**
      *   **User:** Risk analyst at a mid-sized insurer.
      *   **Context:** Just had a 2-hour argument with a roommate about the ontology of probability (real vs. mental). Deals with frequentist vs. Bayesian debates internally when new analysts join. Needs clarity on what difference it makes for the actual number written down.
      *   **Task:** Create a decision procedure (algorithm/flowchart in prose) for assigning probabilities. It needs to distinguish between frequentist, subjectivist, propensity interpretations but translate them into actionable steps. It must identify where the procedure stops (ill-defined) or hands off to human judgment (values/evidence). It must be runnable by a new analyst with stats background but no philosophy in about an hour. It must be honest about "judgment calls wearing a lab coat."
      *   **Test Cases:** Run the procedure on three specific cases:
          1.  Pricing a brand new line of business (no loss history).
          2.  Estimating chance a specific bridge fails in 10 years.
          3.  Chance a particular mid-level employee quits within a year.
      *   **Constraint:** One case should yield an unlovable answer (don't sand it off).
      *   **Format:** Plain continuous prose, like an email. No headings, no bullets, no bold, no tables.

  2.  **Deconstruct the Philosophy/Practicality Gap:**
      *   Frequentism: Requires repeatable trials under identical conditions. Good for historical data. Fails on unique events (bridge failure, specific employee).
      *   Bayesianism (Subjective): Probability as degree of belief. Updates with evidence. Good for unique events, but requires priors (which are subjective).
      *   Propensity: Physical tendency of a situation to produce an outcome. Often metaphysical, hard to measure directly without frequentist data or models.
      *   Practical Insurance Context: We need numbers for pricing/reserving. Regulatory capital often requires "objective" backing, but reality is often subjective.
      *   The "Decision Procedure": Needs to guide the analyst from "What do I know?" to "What number do I write?" while flagging the epistemological status of that number.

  3.  **Drafting the Procedure (Mental Outline):**
      *   Step 1: Data Availability. Is there a reference class with sufficient history?
      *   Step 2: Stability. Is the process stationary? (Will the future look like the past?)
      *   Step 3: Uniqueness. Is this a one-off event?
      *   Step 4: Model Dependency. Are we relying on physics/engineering models or behavioral models?
      *   Step 5: The Handoff. Where does math end and judgment begin?
      *   Step 6: The "Ill-defined" stop. When to say "we can't know."

  4.  **Drafting the Test Cases:**
      *   *New Line of Business:* No history. Must rely on analogues or expert judgment. High subjectivity. The "unlovable answer" might be that the probability is essentially a guess dressed up as a number, or that the confidence interval is so wide it's useless. Let's make it the "unlovable" one: The procedure should reveal that any specific number is arbitrary without strong priors, effectively saying "you are guessing."
      *   *Bridge Failure:* Unique asset. Physics-based models exist but have uncertainty. Low frequency, high severity. Frequentist data on *this* bridge is nonexistent (n=1). Relies on engineering models (propensity-ish) + expert elicitation.
      *   *Employee Quitting:* HR data exists (reference class), but individual variance is high. Frequentist approach on the class, adjusted for individual factors. Actually quite standard actuarial work.

  5.  **Refining the Tone:**
      *   Empathetic to the frustration (the 2-hour argument).
      *   Professional but candid (admitting where the "lab coat" is hiding judgment).
      *   Continuous prose (no formatting tricks).
      *   Email style (salutation, sign-off).

  6.  **Writing - Section by Section (incorporating constraints):**

      *   *Opening:* Acknowledge the frustration. Validate the feeling that the philosophy doesn't seem to change the spreadsheet.
      *   *The Procedure:* Describe it as a flow of questions.
          *   Q1: Is there a stable reference class? (Frequentist check).
          *   Q2: Is the future like the past? (Stationarity).
          *   Q3: If no, can we build a causal model? (Propensity/Physical).
          *   Q4: If no, do we have expert consensus? (Subjective/Bayesian).
          *   *Stopping Rule:* If no data, no model, no expert consensus, stop. It's ill-defined.
          *   *Judgment Call:* Priors and weighting evidence.
      *   *Case 1 (New LoB):* No history. Reference class is weak. Model is speculative. Result: The number is a placeholder for risk appetite, not a statistical fact. (This is the unlovable truth).
      *   *Case 2 (Bridge):* Unique. Physics model exists. Data is sparse. Result: Model uncertainty dominates. Probability is conditional on the model being right.
      *   *Case 3 (Employee):* Good reference class (HR data). Individual factors adjust it. Result: Robust frequentist base with Bayesian updates.
      *   *Closing:* Reiterate that the value isn't the number, it's knowing what the number *is*.

  7.  **Checking Constraints:**
      *   *Plain continuous prose?* Yes. No bullets, no bold, no headings.
      *   *Email format?* Yes.
      *   *Three cases?* Yes.
      *   *Unlovable answer?* Yes (likely the New LoB one revealing it's basically a guess).
      *   *Honest about judgment?* Yes.

  8.  **Drafting the Content (Iterative refinement for flow and constraints):**
      *   *Self-Correction on Formatting:* I must ensure I don't accidentally use bolding for emphasis or bullet points for lists. Everything must be paragraphs.
      *   *Self-Correction on Tone:* Keep it collegial. Don't sound condescending about the philosophy argument.
