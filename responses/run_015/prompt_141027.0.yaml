answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Lumen Forecasting Collaborative
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Concordance Protocol and Aggregation Policy

  We are at a structural pivot point. The dispute between Marta Reyes and Devon Achterberg regarding the 2028 AI capability question is not merely a disagreement over a single probability; it is a stress test of our operating system. We must decide whether to adopt the Concordance Protocol as proposed, reject it, or modify it. After reviewing the submissions, I recommend we adopt the Concordance Protocol with specific modifications regarding aggregation and the handling of undisclosed information.

  To make this decision, we must first contend with Marta's argument, which is theoretically robust and morally serious. She contends that persistent divergence after full evidence exchange is a performance failure, not a legitimate diversity of views. Her position rests on the logic of the agreement theorem. The theorem states that if two rational agents share the same prior probabilities and their posterior estimates become common knowledge, they cannot agree to disagree. If they have access to the same information and start from the same Baseline Positions, any remaining gap implies that at least one analyst has failed to update correctly.

  Marta argues that by publishing two numbers or averaging them, we are institutionalizing error. If the theorem holds, one of these analysts is objectively wrong about how to process the evidence. She proposes that the Board should resolve this by deferring to the analyst with the superior Brier score over time. This treats forecasting as a skill metric rather than a deliberative art. On her reading, our commitment to a "single institutional number" demands that we identify the most reliable processor of information and silence the noise. To do otherwise is to mislead our users by suggesting uncertainty exists where there is only calculation error. This is the strongest possible case for the Protocol: it demands intellectual honesty and accountability.

  However, while Marta's logic is sound in the abstract, it does not license the remedies she proposes for an institution like ours. The agreement theorem relies on conditions we do not meet. First, it requires agents to be perfect Bayesians. Our analysts are human; they use heuristics, and they fatigue. Second, it requires common knowledge of priors. Our Baseline Positions are not genuine shared beliefs derived from mutual reflection; they are artifacts of policy, assigned to ensure consistency across quarters. An analyst may intellectually assent to a House Prior while privately weighting it differently based on experience. Third, the theorem assumes infinite or sufficient communication rounds. Our four-round limit is a practical constraint, not a theoretical ideal. We cannot force convergence in finite time without coercing the analysts to abandon their actual judgment in favor of compliance.

  Therefore, we cannot treat divergence as definitive proof of error. We must treat it as data. When two analysts, both acting in good faith with the same starting constraints, arrive at different endpoints, that spread itself contains information about the stability of the forecast. Collapsing that spread to a single winner based on past performance discourages the very independent thinking we hired them to perform. It incentivizes analysts to hedge toward the consensus of high-performers rather than pursue unique insights.

  This brings us to the specific issue of Devon's confidential source. Devon argues that an averaging rule that treats his private information as noise will systematically discard the exact intelligence our outfit exists to gather. He is correct. If we penalize undisclosed information by ignoring it or forcing it into the open, we blind ourselves to signals that cannot be publicized without burning assets. However, Marta is also correct that unverified claims cannot drive institutional policy without checks.

  We need a mechanism that preserves the utility of private intelligence without compromising our verification standards. I propose we adopt the "Chair Verification" mechanism I previously floated. Under this modification, an analyst may file the direction and log-odds magnitude of an update based on undisclosed information with the Board Chair. The Chair verifies that a source exists and that the analyst has engaged with it, without seeing the contents. If verified, the published question carries a flag stating: "One estimate incorporates verified undisclosed information."

  This solves the transparency problem. It tells our users—journalists and funders—that the number rests on opaque intelligence, allowing them to discount or weight it as they see fit. It protects Devon's source while acknowledging Marta's concern about unshareable evidence.

  Regarding the final institutional number, I recommend we publish the **arithmetic mean** of the two estimates if the gap exceeds fifteen points after the Concordance rounds. While the geometric mean of odds is often mathematically superior for extreme probabilities, the arithmetic mean aligns better with our mission of providing a "blunt" institutional figure. It is easier for external users to interpret and less susceptible to manipulation by extreme outliers. We should not publish a range; our brand is built on providing a decision-ready single number. Nor should we select the single best-calibrated forecaster; as noted, this creates perverse incentives and ignores the information content of the disagreement itself.

  **Recommendation Summary**

  1.  **Adopt the Concordance Protocol** as the mandatory process for resolving analyst divergence greater than fifteen percentage points.
  2.  **Reject the "Winner-Take-All" adjudication.** We will not resolve persistent disagreement by selecting one analyst over the other based on Brier scores.
  3.  **Aggregation Method:** Publish the **arithmetic mean** of the final two estimates as the institutional number.
  4.  **Undisclosed Information:** Adopt the **Chair Verification + Flag** mechanism. Analysts may incorporate verified private sources, but the final publication must be flagged to indicate the presence of non-public intelligence.

  This path respects the rigor Marta demands without imposing impossible theoretical standards on our human analysts. It protects the intelligence gathering Devon represents without sacrificing institutional accountability. It acknowledges that while we strive for the rational consensus the agreement theorem describes, we operate in a world where uncertainty, private information, and human limitation are features, not bugs.

  I ask that we vote to approve these modifications at the next meeting.
