answer: |-
  **Project Title:** Robustness in the Ruins: A Modal Map of Post-ZFC Mathematics

  **Project Summary**
  Standard philosophical treatments of the potential inconsistency of ZFC (Zermelo-Fraenkel set theory with Choice) treat the scenario as a binary event: either mathematics collapses, or it survives intact. This proposal rejects that binary. If ZFC were proven inconsistent, the practical and philosophical task would not be to declare victory or defeat, but to triage. We would face a spectrum of candidate repairs: weakening axiom schemes, retreating to proper fragments, adopting paraconsistent logics, or reinterpreting quantifiers. This project asks a determinate question: *What is the intersection of mathematical practice across the set of normatively acceptable repairs of ZFC?*

  I propose to define a result as **robust** if it survives under all acceptable repairs, and **fragile** if it is lost under all of them. My hypothesis is that this modal distinction will not align with traditional divides (e.g., pure vs. applied, classical vs. constructive). Instead, the boundary between fragile and robust will reveal what mathematics is ultimately answerable to. Is it empirical utility? Explanatory depth? Structural coherence? By mapping the "survival space" of mathematics post-inconsistency, this project aims to uncover the normative standards that actually govern mathematical theory choice, distinct from the idealized standard of truth.

  **The Inadequacy of Standard Criteria**
  To make the question determinate, we must first reject two obvious but inadequate standards for choosing a repair.

  The first standard is **minimal mutilation**: preserve as many theorems as possible. This is inadequate because it is conservative to the point of triviality. One could preserve the theorems of ZFC by adopting a paraconsistent logic that tolerates the contradiction without explosion. While this saves the theorems, it arguably abandons the *practice* of mathematics, which relies on consistency for explanation and certainty. Saving the letters of the law while killing the spirit of the practice is not an acceptable repair.

  The second standard is **consistency at any cost**: restore consistency by whatever means necessary. This is inadequate because it is too permissive. One could retreat to Primitive Recursive Arithmetic or a strictly finitist framework. This restores consistency but abandons the bulk of modern analysis and set theory. If the cost of consistency is the loss of the Hilbert space formalism used in quantum mechanics, the repair is practically unacceptable.

  Therefore, "acceptability" must be constrained by a third factor: **normative fit with practice**. A repair is acceptable only if it preserves the inferential moves mathematicians actually endorse and the applications scientists actually rely on. This introduces a central tension the project must address: the tension between **empirical utility** (saving the calculations physics needs) and **explanatory power** (saving the proofs mathematicians find illuminating). A repair might preserve the computable reals needed for engineering (empirical utility) while destroying the compactness arguments needed for functional analysis (explanatory power). Determining which value trumps the other in a crisis is a primary objective of this fellowship.

  **Work Plan (12 Months)**
  Since surveying all of mathematics is impossible, I will employ a case-study methodology focused on representative domains, combined with meta-mathematical analysis of repair strategies.

  *   **Months 1–3: Taxonomy of Repairs.** I will catalog the logical space of possible repairs. This includes subsystems (e.g., ZF without Choice, Second-Order Arithmetic), alternative logics (Intuitionistic, Paraconsistent), and semantic reinterpretations. I will interview working mathematicians and philosophers to establish preliminary criteria for "acceptability," specifically probing the tension between empirical utility and explanatory depth.
  *   **Months 4–6: Case Studies in Survival.** I will select three domains to test for robustness: (1) Classical Analysis (crucial for physics), (2) Combinatorics/Number Theory (often viewed as more concrete), and (3) Category Theory (structural foundation). For each, I will determine which core theorems fail under specific repairs (e.g., does the Hahn-Banach theorem survive without Choice? Does it survive in a paraconsistent setting?). I will map these results against the taxonomy from Months 1–3.
  *   **Months 7–9: Normative Analysis.** I will analyze the trade-offs revealed in the case studies. If a repair saves physics but ruins structural explanation, is it preferred? I will develop a framework for weighing these values. This involves analyzing historical precedents where mathematical standards shifted (e.g., the rigorization of calculus) to see if utility or explanation drove the change.
  *   **Months 10–12: Synthesis and Dissemination.** I will synthesize the data into a topological map of "robust" mathematics. I will draft two papers: one technical/philosophical on the definition of robustness, and one broader piece on what the fragility of standard mathematics implies for mathematical realism. I will present findings at one major conference.

  **Possible Findings and Discrimination**
  The project will yield one of three distinct outcomes, each with different philosophical implications:

  1.  **The Core is Robust:** If a significant body of mathematics (e.g., finite combinatorics, basic analysis) survives all acceptable repairs, this suggests mathematics is answerable to a stable, perhaps computational or cognitive, reality independent of specific axiomatic foundations.
  2.  **The Core is Fragile:** If even basic results are lost under plausible repairs, it suggests mathematical practice is far more contingent on our specific foundational choices than admitted. This would support a form of structuralism or fictionalism where "truth" is secondary to coherence within a specific system.
  3.  **The Indeterminacy Result:** If the set of "acceptable repairs" cannot be defined without circularity (i.e., we only know a repair is acceptable if it keeps the math we like), then the robust/fragile distinction is ill-defined. This would be a negative result, but a philosophically vital one: it would demonstrate that mathematical rationality is not algorithmic but deeply sociological or pragmatic.

  To discriminate between these, I will use the **Empirical/Explanatory Divergence Test**. If repairs that save empirical utility consistently differ from those that save explanatory proofs, and the community has no principled way to choose between them, this points toward Indeterminacy. If one value consistently trumps the other in expert judgment, this points toward a specific normative foundation (Instrumentalism vs. Realism).

  **Conditions for Failure**
  I must be honest about the risks. The project fails if the notion of "acceptable repair" proves entirely subjective, reducing the study to a survey of personal preferences rather than normative standards. If I cannot establish a non-circular criterion for why one repair is better than another beyond "it keeps the theorems we want," the concept of robustness collapses.

  Furthermore, the project fails if the technical burden proves too high. If determining the survival of key theorems under non-standard logics requires original proof-theoretic work beyond the scope of a philosophical fellowship, the case studies will remain speculative. To mitigate this, I will rely on existing reverse mathematics and proof-theoretic literature where possible, limiting original technical derivations to conceptual illustrations rather than exhaustive proofs.

  Finally, the project fails if the hypothetical is treated as too remote to yield insights. I must demonstrate that analyzing this "nuclear winter" scenario illuminates *current* foundational debates, such as the acceptance of large cardinal axioms or the use of computer-assisted proofs. If the results do not feed back into understanding contemporary practice, the project remains a mere logical curiosity.

  **Conclusion**
  This project treats the potential inconsistency of ZFC not as a disaster to be feared, but as a thought experiment to be exploited. By forcing a choice among repairs, we reveal the hidden hierarchy of mathematical values. Whether the result is a map of robust truths or a demonstration of fundamental indeterminacy, the output will clarify what we are actually doing when we do mathematics.
