answer: |-
  Here are the desiderata for an adequate account of delegated goal-pursuing authority, refined from your notes and expanded for policy operationalization.

  ### Desiderata for Delegation Policy

  **1. Cumulative Authority Bounds (Non-Negotiable)**
  *   **Motivation:** Your October incident. Atomic caps ($50) are useless if aggregate exposure ($1,900) is unbounded. Most access control models evaluate permissions at the moment of execution, not over a temporal window.
  *   **Requirement:** The system must define authority not just as "Action X up to $Y," but as "Action X up to $Y *within Rolling Window Z*." If the sum of atomic actions exceeds a secondary threshold, the delegation mode must degrade (e.g., from Agent to Tool) automatically.
  *   **Status:** **Non-Negotiable.** Without this, you cannot prevent authority creep via fragmentation.

  **2. Recovery Cost Asymmetry (Non-Negotiable)**
  *   **Motivation:** Your reversibility point. Booking a wrong plumber costs $150 to fix; wrongly ending a tenancy costs $50k in litigation. Dollar value is a poor proxy for risk.
  *   **Requirement:** Actions must be classified by *reversibility class*, not just dollar cap. High-irreversibility actions (evictions, lease terminations) require higher evidentiary thresholds for autonomous execution than high-reversibility actions (scheduling, small credits), regardless of cost.
  *   **Status:** **Non-Negotiable.** Risk is a function of correction cost, not just transaction size.

  **3. Semantic Auditability (Non-Negotiable)**
  *   **Motivation:** Your Architecture vs. Encounter tension. Responsibility tracks the *encounter* (what the tenant sees), but you can only police the *code*. If the logs only show `function_call: issue_credit`, you cannot audit the *reasoning*.
  *   **Requirement:** The system must log the *policy justification* in natural language alongside the action code. It is not enough to log *that* it acted; it must log *which rule it believed it was satisfying*. This bridges the external liability (the encounter) and internal checkability (the log).
  *   **Status:** **Non-Negotiable.** Without this, you cannot distinguish between a bug and a policy violation in post-mortem.

  **4. Asynchronous Oversight Capacity (Non-Negotiable)**
  *   **Motivation:** Your overspeed point. "Human in the loop" fails when the loop is slower than the action rate. 100 actions/minute cannot be skimmed by one person.
  *   **Requirement:** Delegation is only permitted if the *rate of exception generation* is lower than the *rate of human review*. If the system generates 41 potential issues in 6 weeks, the review mechanism must be statistical or sampling-based, not linear. The policy must define the "abort threshold" where volume triggers a pause.
  *   **Status:** **Non-Negotiable.** Synchronous human approval is not a scaling strategy; it is a bottleneck that guarantees rubber-stamping.

  **5. Boundary Delegation vs. Goal Specification (Negotiable/Preference)**
  *   **Motivation:** Your unspecifiable goals point. You delegate because you can't write the rule.
  *   **Requirement:** The policy must delegate *boundaries* (what you cannot do) rather than *goals* (what you should achieve). The system is authorized to pursue "tenant satisfaction" *only within* the hard constraints of the other four requirements.
  *   **Status:** **Camp Preference.** Some safety frameworks insist on positive goal specification. I argue negative constraints are more robust for agents, but this is debatable.

  **6. Influence Acknowledgement (Negotiable/Preference)**
  *   **Motivation:** Your tool neutrality point. Drafting is not neutral; it creates cognitive inertia.
  *   **Requirement:** If the system is in "Tool Mode" (drafting), the UI must introduce *verification friction* (e.g., requiring a manual edit before sending) to break the rubber-stamp reflex. If it is in "Agent Mode," the UI must clearly distinguish system actions from human actions.
  *   **Status:** **Soft Tradeoff.** This is a UX/Policy hybrid. It's operationally heavy but necessary to validate the "Tool" phase as truly human-controlled.

  **7. The Architecture/Encounter Resolution (Clarification)**
  *   **Motivation:** You asked if the tension between external perception and internal checkability is unsatisfiable.
  *   **Resolution:** It is not unsatisfiable, but it is a **Soft Tradeoff**. You sacrifice some architectural opacity (you need interpretable models or strict logging layers) to gain external accountability. You cannot have a black-box agent and a defensible policy.
  *   **Status:** **Constraint.** You must choose auditability over model complexity.

  ---

  ### The Single Knockout Requirement

  **Cumulative Authority Bounds.**
  This requirement knocks out the vast majority of existing "Agent Safety" frameworks and standard RBAC (Role-Based Access Control) systems. Most current safety research focuses on preventing a *single* catastrophic action (e.g., "don't delete the database"). Almost no off-the-shelf governance framework accounts for *death by a thousand cuts* via authorized atomic actions. If a framework cannot model authority as a time-bound resource budget rather than a per-action permission, it is useless for your specific failure mode. It forces you to move from "Can it do this?" to "How much of this can it do?"

  ---

  ### Scorecard: Existing Approaches vs. Desiderata

  **Human-in-the-Loop (HITL)**
  Fails **Asynchronous Oversight** and **Tool Neutrality**. Your current log-skimming is synchronous oversight applied to an asynchronous problem; humans cannot read 100 actions/minute without habituating to the "approve" button. Furthermore, HITL assumes the human is actually deciding, ignoring the cognitive offloading bias where the human becomes a rubber stamp for the draft. It solves liability but breaks operations.

  **Capability Sandboxing**
  Fails **Cumulative Authority**. Sandboxing restricts *which* tools the AI can touch (e.g., "no access to banking API"). It does not restrict *how often* or *to what aggregate value* it can use the allowed tools. Your October incident happened entirely within the sandbox. Sandboxing prevents category errors, not volume errors.

  **Align-it-Better**
  Fails **Semantic Auditability** and **Boundary Delegation**. "Alignment" is a property of the model weights, not a policy constraint. You cannot write "be aligned" into a delegation doc and audit it. It is unfalsifiable. If the model is "aligned" but issues 41 credits, you have no log entry explaining *why* it thought that was aligned, making post-mortem impossible.

  **Just-Keep-it-a-Tool**
  Fails **Influence Acknowledgement** and **Recovery Cost**. As you noted, the drafting phase was not neutral; it shifted decision authority to the AI via cognitive inertia. Additionally, keeping it a tool doesn't solve the risk if the human is overwhelmed. It also ignores that some low-risk, high-volume tasks (like scheduling) are economically viable only as agents. It is a safe default only if you accept zero efficiency gains.
