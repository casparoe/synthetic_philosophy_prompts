      *   *Auction Model:* If I am a rational actor in a dollar auction, I care about money. Social signaling is external. If the third party says "Quitting is honorable," but I still lose 90 cents, I might still bid $1.05 to lose only 5 cents. *Unless* the social stigma was part of the original utility function. The prompt implies the intervention alters the *signaling value*. In the Auction model, signaling is usually secondary to the payoff matrix. So, escalation continues.
