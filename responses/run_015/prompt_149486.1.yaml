      *   *Distinguishing Feature:* Is it Termination or Continuity? The prompt sets up "discrete bidding" vs "continuous investment." However, the *escalation* dynamic is most fueled by not knowing when to stop. In an auction, you stop when the other stops. In ideology, the "other" is an abstract ideal. I will stick with **Absence of a clear termination rule** because it explains *why* the continuity leads to escalation rather than just maintenance.
