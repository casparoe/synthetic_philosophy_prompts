          *   *Endpoint:* Auction has a clear end (someone wins the dollar, or bids stop). Ideology often lacks a clear "win" state (utopia is asymptotic).
          *   *Agency:* Auction has distinct bidders. Groups have diffuse agency (who decides to quit? The individual or the collective?).
      *   *Verdict:* The analogy is *not* isomorphic. The auction assumes discrete, fungible units (money) and a clear payoff structure. Identity investment is holistic, non-fungible, and the "payoff" is ontological security, not a prize. The diffusion of agency means "bids" are often decentralized, making the calculation of "how much to bid to win" impossible.

  3.  **Step 2: Structural Modification (Third Party Intervention):**

