      *   *Identity Investment Basics:* Commitment isn't just money; it's self-concept. "I am a [Group Member]." Withdrawal isn't just losing money; it's identity death/social exile. Investment is continuous (daily acts, rhetoric), not discrete bids.
      *   *Comparison:*
