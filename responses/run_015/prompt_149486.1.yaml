          *   If a third party publicizes the social costs ("This group punishes dissenters"), it reframes withdrawal. Quitting is no longer "I failed/was weak"; it becomes "I escaped a cult."
          *   This directly attacks the mechanism of escalation (identity preservation). If the identity cost of staying (being part of a cruel group) outweighs the identity cost of leaving (being a traitor), escalation stops.
          *   *Prediction:* Strong effect. It disrupts the identity calculus.
      *   *Comparison:* The intervention breaks escalation in the Identity model more effectively than the Auction model because the Identity model's currency *is* social signaling, whereas the Auction model's currency is material loss (which the intervention leaves unchanged).

