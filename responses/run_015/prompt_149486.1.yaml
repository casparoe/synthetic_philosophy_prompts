          *   *Absence of Termination:* This is crucial. In a dollar auction, the game *must* end (eventually money runs out). In ideological commitment, the goal is often infinite (salvation, perfect society). You can never "win" enough to stop investing.
          *   *Better Candidate:* **The nature of the stake (Fungible vs. Constitutive).** But looking at the prompt's specific options...
          *   Let's look at "Absence of a clear termination rule." In the auction, you stop when you outbid the other. In ideology, there is no "outbidding." The commitment *is* the state of being.
          *   *Refinement:* The prompt asks to choose from: Continuity, Multiplicity, or Absence of Termination.
          *   *Selection:* **Absence of a clear termination rule.** In the auction, escalation is irrational because there is a fixed prize ($1). In ideology, the "prize" expands with investment. You don't bid to win a static dollar; you invest to sustain the reality of the group. Without a termination rule (a point where you can cash out), the logic of "cutting losses" doesn't apply the same way.
          *   *Wait, let's reconsider "Continuity".* The prompt contrasts "discrete bidding" with "continuous identity-investment." This suggests Continuity is a strong candidate. However, the *absence of a termination rule* is what makes the continuity dangerous. If I invest continuously but can cash out tomorrow, it's a savings account. If I invest continuously and can *never* cash out without total loss, it's a trap.
          *   *Decision:* The **absence of a clear termination rule** is the sharpest distinction regarding *escalation*. The auction escalates because players try to reach the termination condition (winning) to recoup costs. Ideology escalates because the condition is unreachable.

  5.  **Conclusion: Defending the Robust Model:**

      *   *Context:* Physical exit available, social exit punitive.
      *   *Winner:* **Identity-Investment Model.**
      *   *Why:* The dollar auction assumes agents are maximizing material utility (minimizing financial loss). In high-commitment groups, agents are maximizing *ontological security* and *social standing*. The "sunk cost" isn't just money; it's the self. The Third Party intervention worked better on this model in Step 2, proving its sensitivity to the actual constraints (social punishment).
