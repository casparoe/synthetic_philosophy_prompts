      *   **Step 2: Structural Modification (Third Party Intervention):** Introduce a credible third party that publicizes social costs of abandonment (altering signaling value of withdrawal, not private material costs). Analyze the effect on predictions for *both* models (does it break escalation?).
      *   **Step 3: Distinguishing Feature:** Identify the feature of collective commitment that *most sharply* distinguishes it from the auction (Continuity? Multiplicity/Heterogeneity? Absence of termination rule?).
      *   **Conclusion:** Defend the more robust model for contexts where physical exit is available but social exit is punitive. Note how a defender of the weaker model might respond (redescribing stakes).

