      *   *Decision:* The **absence of a clear termination rule** is the structural driver of *unbounded* escalation. Continuity is the *mode* of investment, but the lack of an end is why it becomes a trap. I will argue for Termination Rule as the sharpest distinction regarding *escalation*.

