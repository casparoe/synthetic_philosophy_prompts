  Dr. Credence, a philosopher famous for his "Reflective Skepticism," sits in the faculty lounge explaining his credence function to Sharpie, a visiting bookmaker with a degree in measure theory.

  "I accept the Reflection Principle," Credence says, stirring his coffee. "My current credence in any proposition must equal my expected future credence. I trust my future rational self."

  "And the expert testimony?" Sharpie asks.

  "Filtered," Credence replies. "I apply a convex skepticism filter. If an expert says '90% chance,' I update to only 70%. If they say '60%,' I update to 55%. It's non-linear to account for overconfidence."

  Sharpie smiles. "So, you violate Conditionalization, but you enforce Reflection on the violated values."

  "Exactly. It's diachronically coherent by my lights."

  "Let's test that," Sharpie says, pulling out a contract. "Bet 1: I sell you a ticket paying \$100 if Hypothesis H is true. Price: \$60. That's your current credence, correct?"

  "Yes," says Credence. "Based on my expectation of my future filtered self."

  "Bet 2," Sharpie continues. "Once the expert speaks, I will buy that ticket back from you at whatever your new credence is. By your filter, if the expert says '90%', you'll value H at 70% (\$70). If the expert says '50%', you'll value H at 50% (\$50)."

  "Fair," says Credence. "I honor my future prices."

  Sharpie slides the papers over. "Here's the portfolio. I sell you the ticket now for \$60. Then, regardless of what the expert says, I buy it back from you at your filtered price. But because your filter is convex, your expected filtered price is strictly less than your current credence across the partition of expert reports. Jensen's inequality ensures I buy low and sell high."

  Credence freezes, pen hovering. "Wait. If I buy at 60 and sell at an expected 55... I lose \$5 sure."

  "Correct," says Sharpie. "Want to void the bet?"

  "I can't," Credence sighs, signing the paper. "If I refuse Bet 1, I violate Reflection. If I refuse Bet 2, I violate my updating policy. I am logically obligated to accept a guaranteed loss."

  "Welcome to coherence," says Sharpie, pocketing the contract.

