prompt: |-
  I have to write a guidance note for a clinical ethics committee that is being asked to approve a consent form for a corpus callosotomy. The sticking point is how the operation's effect should be described to the person signing it: as dividing one subject of experience into two, as leaving one subject whose experience has become in some way fragmented, or as leaving the number of subjects genuinely unsettled. Before I write anything about what the evidence actually shows, I want the specification. So: what would a theory of the unity of consciousness have to deliver in order to be good enough for that decision?

  Give me the desiderata list — the phenomena it must account for, the cases it must get right, the distinctions it must respect, the findings it must not contradict — with the case or consideration behind each requirement, and each requirement marked either non-negotiable or a preference of one camp over another.

  Some things I want covered, though add what I've missed:

  - The question how many subjects there are and the question whether a subject's experience at a time is unified are different questions. Keep them apart, say what would settle each, and tell me which one the committee actually needs an answer to.
  - Whether unity is synchronic or diachronic or both, whether it is transitive, and whether it admits of degrees. Give a case that would discriminate.
  - The staged-section case. Suppose the commissure were sectioned in stages over several weeks under local anaesthesia, with the patient asked each day what has changed. What should a theory predict the patient can report midway through, and what should we conclude if the patient reports no change at all — that unity is not a phenomenal matter, or that first-person report is not a reliable instrument here? Either way, the theory should tell me what to ask.
  - The long-project case. Much is made of inter-manual conflict, but suppose instead we had evidence, after full section, that the two streams each sustained a different ranking of the patient's long-term projects and acted on it where it could — different verdicts on where to live, whom to trust, whether to continue with a hazardous treatment. Is that one subject with conflicting aims or two sources of consent? Which requirement on your list settles it, and is that requirement one we should have been confident of in advance?
  - Consistency with the cases that make the naive "one hemisphere, one subject" story untenable: people who have had a hemisphere removed, or who were born without a callosum, and who do not present as fragmentary; the temporary unilateral disconnection produced when one hemisphere is anaesthetised for cortical mapping; and the widely repeated observation that patients after full commissurotomy do not, on the whole, behave like two agents sharing a body.
  - Whether a verdict must be determinate in every case, or whether the theory may return "vague" or "no fact of the matter" — and what it costs a consent form if it may.
  - Whether unity must make a difference to what it is like, or whether it can be cashed out in terms of access, agency, or one experience's being a proper part of another.

  Then flag any subset of the desiderata you think cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest share of candidate theories. Finally, a short scorecard: three or four lines each on the co-consciousness account, the mereological or subsumptive account, the view that unity is really availability to a single workspace or attentional system, and the view that there is no substantial unity to be had.
reasoning: |-
  Here's a thinking process that leads to the suggested guidance note:

  1.  **Analyze the Request:**
      *   **Task:** Create a specification (desiderata list) for a theory of the unity of consciousness to guide a clinical ethics committee regarding consent forms for corpus callosotomy.
      *   **Context:** The committee needs to know how to describe the operation's effect on the patient's self/subjectivity (one subject, two subjects, unsettled).
      *   **Constraints:**
          *   Do *not* discuss actual evidence yet; focus on the theoretical specification.
          *   Include specific topics requested (number vs. unity, synchronic/diachronic/transitive/degrees, staged-section, long-project, consistency with hemispherectomy/agency, determinacy/vagueness, phenomenal vs. functional).
          *   Add missing relevant considerations.
          *   Mark requirements as "Non-negotiable" or "Preference of Camp A/B".
          *   Identify incompatible desiderata (the "trilemma" or tension points).
          *   Identify the single most exclusionary requirement.
          *   Provide a scorecard for four specific theories (Co-consciousness, Mereological/Subsumptive, Global Workspace/Access, No Substantial Unity).
      *   **Tone:** Professional, precise, philosophical but clinically applicable, structured for a guidance note.

  2.  **Deconstruct the Core Problem:**
      *   The ethics committee needs to inform the patient. Informed consent requires truthfulness about material risks/changes.
      *   The "material change" here is metaphysical/phenomenological: *Will I still be me? Will there be two of me?*
      *   A theory of consciousness unity is needed to answer this. But theories differ. The specification must define what a *usable* theory looks like for this context.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Number vs. Unity.* The prompt asks to separate "how many subjects" from "is experience unified."
          *   *Requirement:* The theory must distinguish numerical identity of subjects from phenomenal unity of experience.
          *   *Type:* Non-negotiable (conceptual clarity).
          *   *Committee Need:* They need to know about *subjects* for consent (who is consenting?), but *unity* explains the phenomenology.

      *   *Item 2: Structure of Unity.* Synchronic vs. Diachronic, Transitive, Degrees.
          *   *Requirement:* Must specify if unity is all-or-nothing or graded. Must address transitivity (if A unified with B, and B with C, is A with C?).
          *   *Case:* Split-brain patients often show transitivity failures (left hand knows X, right hand knows Y, neither knows both).
          *   *Type:* Non-negotiable (logic of the concept).

      *   *Item 3: The Staged-Section Case.*
          *   *Requirement:* Must predict first-person reports during partial disconnection.
          *   *Dilemma:* If patient reports no change, is unity non-phenomenal or is report unreliable?
          *   *Type:* Preference (Phenomenalists vs. Functionalists).
          *   *Committee Need:* What questions to ask the patient during recovery.

      *   *Item 4: The Long-Project Case (Agency/Values).*
          *   *Requirement:* Must map unity to agency and volition, not just perception.
          *   *Case:* Conflicting life plans post-op.
          *   *Type:* Non-negotiable (Ethics relies on agency).
          *   *Settling:* If two distinct value systems act independently, consent becomes tricky.

      *   *Item 5: Consistency with Edge Cases (Hemispherectomy, Agenesis, Wada).*
          *   *Requirement:* Cannot imply "one hemisphere = one person" automatically.
          *   *Type:* Non-negotiable (Empirical adequacy).
          *   *Reasoning:* Hemispherectomy patients remain single subjects. Agenesis patients are usually single subjects.

      *   *Item 6: Determinacy vs. Vagueness.*
          *   *Requirement:* Must state if "number of subjects" can be indeterminate.
          *   *Cost:* If indeterminate, consent form must use probabilistic or ambiguous language.
          *   *Type:* Preference (Classical logic vs. Metaphysical Vagueness).

      *   *Item 7: Phenomenal vs. Functional.*
          *   *Requirement:* Must define if unity is "what it's like" or "information access."
          *   *Type:* Preference (Phenomenal Realists vs. Functionalists).

      *   *Additions:*
          *   *Normative Continuity:* Does the theory preserve moral status? (Non-negotiable for ethics).
          *   *Reversibility/Plasticity:* Does the theory account for recovery/adaptation over time? (Important for prognosis).

  4.  **Identifying Tensions (The "Impossible Triangle"):**
      *   We want Empirical Adequacy (fits hemispherectomy/split-brain data).
      *   We want Determinacy (for clear consent forms).
      *   We want Phenomenal Authority (trust the patient's report).
      *   *Conflict:* Split-brain data + Patient Report ("I feel fine") + Determinacy often clash. If the patient feels unified but behavior suggests disunity, you must sacrifice either the report or the determinacy.
      *   *Most Exclusionary:* The requirement that *Numerical Identity must be Determinate*. Many modern theories (vagueness, stage theory, pluralism) reject this.

  5.  **Drafting the Scorecard:**
      *   *Co-consciousness:* Good on phenomenology, struggles with transitivity failures in split-brain.
      *   *Mereological:* Good on parts/wholes, struggles with why removal of a part (hemispherectomy) doesn't reduce the subject.
      *   *Global Workspace:* Good on function/access, struggles with the "what it's like" aspect (hard problem).
      *   *No Substantial Unity:* Good on data, terrible for consent (undermines the "who" signing the form).

  6.  **Refining and Formatting:**
      *   Use the requested structure (Desiderata List, Incompatibilities, Scorecard).
      *   Ensure the tone is appropriate for a clinical ethics committee guidance note (authoritative, clear, distinguishing metaphysics from policy).
      *   Check off all prompt requirements.

      *(Self-Correction during drafting)*: Make sure I explicitly answer "Which one does the committee actually need an answer to?" regarding Number vs. Unity. The committee needs *Number of Subjects* for legal consent, but *Unity* to explain the quality of life risk. I need to make that distinction sharp.

      *(Refining the Staged-Section point)*: The prompt asks what the theory should tell us to ask. I need to ensure the desideratum specifies that the theory must generate interview protocols.

      *(Refining the Long-Project point)*: This is about moral agency. The desideratum must link metaphysical unity to moral responsibility/consent authority.

  7.  **Final Review against Constraints:**
      *   Did I include the specific cases? Yes (Staged, Long-project, Hemispherectomy, etc.).
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the incompatibilities? Yes.
      *   Did I identify the most exclusionary requirement? Yes.
      *   Did I score the four theories? Yes.
      *   Is evidence excluded? Yes, focused on specification.

  8.  **Final Polish:** Check for clarity and philosophical precision. (e.g., ensuring "synchronic" vs "diachronic" is clearly defined in context). Ensure the distinction between "subject" (metaphysical entity) and "person" (legal/moral entity) is managed carefully, as the committee deals with the latter but the theory addresses the former.

      *Decision:* I will treat "Subject of Experience" as the metaphysical target and "Person/Patient" as the legal target, noting where they diverge.

      *Let's write.*
answer: |-
  # Guidance Note Specification: Theoretical Requirements for Consciousness Unity in Corpus Callosotomy Consent

  **To:** Clinical Ethics Committee
  **From:** [Your Name/Role]
  **Subject:** Specification of Theoretical Desiderata for Consent Form Wording
  **Date:** October 26, 2023

  ## 1. Preamble
  The Committee must approve wording describing the phenomenological and metaphysical consequences of corpus callosotomy. To do this without endorsing a specific controversial metaphysics, we must specify what *any* acceptable theory of consciousness unity must deliver. The following list defines the necessary conditions for a theory to be considered "fit for purpose" in generating consent language.

  ## 2. Desiderata List
  *Each requirement is marked as **Non-Negotiable** (required for ethical/legal coherence) or **Preference** (reflecting a philosophical stance that impacts wording).*

  ### 2.1. The Distinction of Questions
  *   **Requirement:** The theory must explicitly distinguish between (A) the **Numerical Question** (how many subjects of experience exist?) and (B) the **Phenomenal Question** (is the field of experience unified?).
  *   **Case/Consideration:** A patient could theoretically be a single subject with fragmented experience (B is false, A is 1) or two subjects with perfectly coordinated experience (B is true, A is 2).
  *   **Committee Need:** The Committee requires an answer to **(A)** for legal consent (who is the rights-bearer?), but requires an answer to **(B)** to describe the quality-of-life risk to the patient.
  *   **Status:** **Non-Negotiable**. Conflating these renders the consent form misleading.

  ### 2.2. Structural Properties of Unity
  *   **Requirement:** The theory must specify whether unity is **Synchronic** (at a time), **Diachronic** (over time), or both. It must declare whether unity is **Transitive** (if A is unified with B, and B with C, is A unified with C?) and whether it admits of **Degrees**.
  *   **Case:** *The Transitivity Failure.* In split-brain cases, the left hand may know X, the right hand Y, and neither knows both. If unity is transitive, this implies two subjects. If intransitive, it implies one fragmented subject.
  *   **Status:** **Non-Negotiable**. Without this, we cannot interpret behavioral conflict.
  *   **Preference:** *Degrees of Unity.* If unity is graded, consent language must be probabilistic ("may reduce integration") rather than binary ("will split the self").

  ### 2.3. The Staged-Section Protocol
  *   **Requirement:** The theory must predict the first-person report during partial disconnection and prescribe the interview protocol.
  *   **Case:** *Staged Section under Local Anaesthesia.* If the commissure is cut in stages, and the patient reports "no change" midway, the theory must explain this.
  *   **Implication:**
      *   If the theory claims unity is phenomenal, it must conclude first-person report is unreliable here (theory overrides report).
      *   If the theory claims unity is functional, it must conclude unity is intact despite structural damage (report validates theory).
  *   **Committee Need:** The theory must generate the specific questions to ask during recovery (e.g., "Do you feel one stream of thought?" vs. "Can your left hand name what you see?").
  *   **Status:** **Preference** (Phenomenal Authority vs. Functional Objectivity).

  ### 2.4. The Long-Project Case (Agency and Values)
  *   **Requirement:** The theory must map metaphysical unity to **moral agency** and **volitional consistency**.
  *   **Case:** *Divergent Life Plans.* Post-op, if the left hemisphere advocates for Treatment A and the right for Treatment B, acting independently on long-term values (where to live, whom to trust).
  *   **Settling:** This requirement settles whether we have one subject with conflicting aims or two sources of consent. If the theory ties "subjecthood" to a unified set of long-term preferences, divergent projects imply two subjects.
  *   **Confidence:** We should **not** have been confident of this in advance. Standard theories focus on perception, not volition. This requirement must be added to ensure ethical applicability.
  *   **Status:** **Non-Negotiable**. Consent is an exercise of agency; a theory of the self that ignores agency is useless for consent.

  ### 2.5. Consistency with Anatomical Edge Cases
  *   **Requirement:** The theory must not entail that "one hemisphere = one subject" as a default rule.
  *   **Cases:**
      *   *Hemispherectomy:* Patients remain single subjects despite losing half the substrate.
      *   *Agenesis:* Patients born without a callosum usually present as single subjects.
      *   *Wada Test:* Temporary anaesthesia of one hemisphere does not typically produce a "second" subject waking up.
      *   *Behavioral Integration:* Post-commissurotomy patients generally behave as single agents in daily life.
  *   **Status:** **Non-Negotiable**. Empirical adequacy is required for medical guidance.

  ### 2.6. Determinacy vs. Vagueness
  *   **Requirement:** The theory must state whether the number of subjects is **Determinate** (always 1 or 2) or **Indeterminate** (no fact of the matter).
  *   **Cost:** If Indeterminate, the consent form cannot state "This will create two minds." It must state "The status of your selfhood may become metaphysically indeterminate."
  *   **Status:** **Preference** (Classical Metaphysics vs. Metaphysical Vagueness).
  *   **Committee Need:** Determinacy is preferred for legal clarity, but Vagueness may be more honest.

  ### 2.7. The Ground of Unity
  *   **Requirement:** The theory must specify whether unity is a **Phenomenal Primitive** (a basic feature of "what it is like"), a **Functional Relation** (access/communication), or a **Mereological Relation** (parts belonging to a whole).
  *   **Case:** If unity is functional, restoring communication (via therapy or tech) might restore "oneness." If phenomenal, it might be irrecoverable.
  *   **Status:** **Preference**. This dictates whether the consent form frames the risk as permanent or potentially manageable.

  ---

  ## 3. Incompatibilities and Exclusionary Constraints

  ### 3.1. The Trilemma of Clinical Application
  There is a subset of desiderata that cannot be jointly satisfied. The Committee must prioritize two of the following three:

  1.  **Phenomenal Authority:** Trust the patient's report that they feel like one person (Desideratum 2.3).
  2.  **Behavioral/Functional Objectivity:** Trust the data showing independent manual action and conflicting knowledge (Desideratum 2.2 & 2.5).
  3.  **Metaphysical Determinacy:** Require a clear "1 or 2" answer for the consent form (Desideratum 2.6).

  *Conflict:* If the patient reports unity (1), but behavior suggests disunity (2), you cannot maintain Determinacy (3) without rejecting either the report or the behavior. Most theories sacrifice **Phenomenal Authority** to save **Objectivity** and **Determinacy**, but this risks invalidating the patient's own testimony in the consent process.

  ### 3.2. The Most Exclusionary Requirement
  **Requirement 2.4 (Agency/Values Mapping)** excludes the largest share of candidate theories.
  *   **Reason:** Most philosophical theories of consciousness unity are built on *perceptual* cases (seeing a red patch and a blue patch together). They lack the machinery to account for *diachronic agency* (ranking long-term projects).
  *   **Impact:** A theory that explains perceptual unity but cannot explain why conflicting life-plans imply two subjects is insufficient for this Committee. It forces us to reject standard "Co-consciousness" models in favor of "Narrative Self" or "Agency-Based" models.

  ---

  ## 4. Theoretical Scorecard
  *Evaluation of candidate theories against the Desiderata List.*

  **1. The Co-Consciousness Account**
  *   *Core Claim:* Unity is the primitive relation of experiences being had together by a single subject.
  *   *Performance:* Fails **Desideratum 2.2 (Transitivity)**. In split-brain cases, experiences are not co-conscious across hemispheres, implying two subjects, which conflicts with **2.5 (Hemispherectomy/Agenesis)** where subjects remain single despite massive disconnection.
  *   *Consent Implication:* Forces binary language ("You will become two people"), which contradicts behavioral evidence of integration. High risk of being factually challenged.

  **2. The Mereological / Subsumptive Account**
  *   *Core Claim:* Unity is a part-whole relation; experiences are unified if they are parts of a more inclusive experience.
  *   *Performance:* Struggles with **Desideratum 2.5 (Hemispherectomy)**. If experiences are parts of a whole, removing half the physical substrate should reduce the whole, yet the subject remains. Also struggles with **2.4 (Agency)**; having parts does not guarantee a unified will.
  *   *Consent Implication:* Suggests a "diminishment" of the self rather than a splitting. May be less alarming but metaphysically vague regarding the "number" of subjects.

  **3. The Global Workspace / Access Account**
  *   *Core Claim:* Unity is functional; experiences are unified if they are available to a single reporting/decision-making system.
  *   *Performance:* Strong on **2.3 (Staged Section)** and **2.5 (Behavioral Integration)**. Can accommodate degrees of unity (**2.2**). Weak on **Phenomenal Authority**; a patient might *feel* unified even if access is bifurcated.
  *   *Consent Implication:* Allows for nuanced language ("integration of information may be reduced"). Best fit for clinical data, but risks ignoring the "what it's like" concern of the patient.

  **4. The "No Substantial Unity" (Bundle/Deflationary) Account**
  *   *Core Claim:* There is no underlying "subject"; there are only experiences and causal relations. "Unity" is a useful fiction.
  *   *Performance:* Satisfies **2.5 (Edge Cases)** easily (no subject to split). Fails **2.6 (Determinacy)** and **2.1 (Number of Subjects)** catastrophically.
  *   *Consent Implication:* **Unusable.** If there is no subject, there is no one to sign the consent form. This theory dissolves the ethical framework required for the Committee to operate.

  ## 5. Recommendation for Specification
  The Committee should require a theory that prioritizes **Desideratum 2.4 (Agency)** and **2.5 (Empirical Adequacy)** over **Phenomenal Authority**. The consent form should describe the risk not as "becoming two people" (which violates 2.5) nor "staying the same" (which violates 2.2), but as **"a reduction in the integration of agency and information, which may result in conflicting intentions or fragmented awareness."** This satisfies the Non-Negotiable requirements without committing to a metaphysical verdict on the *number* of subjects that the evidence cannot support.
