      *   *Wait, one more thing:* The user asked "which of these readings is the one people who actually repeat it are usually reaching for?" I need to be explicit about that.

      *   *Final Polish:* Ensure the distinction between "Necessary Condition" (Maya's minimum) and "Sufficient Condition" (Dan's strawman) is clear.

