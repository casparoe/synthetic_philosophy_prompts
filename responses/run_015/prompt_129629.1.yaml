          *   *Reading A (The Trivial/Logical):* Necessary Conditions. (No nail -> no shoe). True but boring. Doesn't help Dan or Maya much.
          *   *Reading B (The Substantive/Engineering):* Leverage Points. Systems have bottlenecks. Small investment prevents large loss. Supports Maya.
          *   *Reading C (The False/Deterministic):* Sufficiency. (Nail -> Kingdom). Implies fixing the nail *guarantees* victory. Dan attacks this.

