      *   **Maya's View:** The proverb asserts there *is* a first findable link; it's advice (fix the nail, save the kingdom); it's about leverage/control, making negligence blameworthy.
      *   **Task:** Create a one-page handout for next week.
      *   **Content Needed:**
          *   Distinguish precise claims the proverb could make (trivial, substantive/defensible, false).
