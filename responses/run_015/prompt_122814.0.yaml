  The buffer glows amber on the left screen, raw and jittery, and blue on the right, smoothed and seamless. My job is to make sure the blue matches the amber often enough that the lawyers stay happy, but not so often that the customers notice the lag. We sell one hundred and twenty milliseconds of peace. That's the product. Not the vision, but the delay. In that slice of time, the implant catches the saccadic jumps, the blink-gaps, the sudden intrusions of noise, and it irons them flat.

  I've been on the night shift for four years. You learn not to look at the amber screen too long. If you stare at the raw feed, the world starts to look like it's shaking apart. People aren't solid; they're collections of edges that snap into place only when the editor commits. I prefer the blue. It's where people live.

  At 03:14, a ticket flags in the queue. Client 8940. Incident type: Perceptual Dissonance.

  I pull the clip. It's a driving scenario, night rain, windshield wipers slicing the view. In the blue feed—the one the client actually received—the road is empty. The car maintains speed, drifting slightly left to avoid a puddle, then straightens. Clean. Safe.

  In the amber feed, there is a figure.

  He's standing near the curb, wearing a reflective vest. He steps forward just as the car passes. In the raw data, the headlights hit him, he flinches, and the car's telemetry shows a micro-brake event that isn't in the delivered log. The system scrubbed him. It categorized the reflection as a lens flare, the figure as a shadow, and smoothed the trajectory to prevent panic. Standard procedure for non-critical obstacles. If the car doesn't need to stop, the passenger doesn't need to know.

  But the ticket isn't about the car. It's about the witness.

  I play the audio testimony attached to the file. The voice is tired, frayed at the edges. It's the client's wife.

  "He keeps stopping," she says. "He says he saw a man. Then he says the man wasn't there. Then he says he saw the man *and* the road was empty at the same time."

  I rewind the clip. I overlay the neural log from the implant's local cache. This is the part we're not supposed to look at without clearance. The log shows the signal arrival. The raw visual data hits the cortex at T-minus-120. The edited packet arrives at T-zero. Usually, the raw signal degrades before it reaches awareness, suppressed by the polish. That's the architecture. You don't see the raw; you see the product.

  But on this log, there's a spike. A sharp, jagged peak in the visual cortex activity at T-minus-100. Then a second, smoother wave at T-zero.

  I lean in. The spike corresponds to the figure. The wave corresponds to the empty road.

  This is the draft leak. Rare. Usually, the buffer holds everything until the edit is ready, like a waiter holding plates until the whole order is up. But sometimes the seal breaks. The raw data slips through the delay. The brain gets the unedited frame before the polished one arrives.

  I listen to the client's voice again. "It wasn't like I forgot," he says. "It was like… I saw him. I swear I saw him. I felt my foot hit the brake. And then—snap. The road was clear. My foot was on the gas. I didn't move it. But the car says I didn't brake. And I remember not braking. I remember both."

  He remembers braking and not braking. He remembers the man and the empty road.

  In the old debates, the ones my friend used to rant about over cheap wine, this was the tiebreaker. If you can catch the brain in the act of editing, if you can find the receipt for the raw experience before the rewrite, then the rewrite is just a lie told to memory. The experience happened, then it was changed. That's the history book revision. The other option—that the experience was never real to begin with, that the brain staged the show before the lights came up—falls apart if the lights come up on the raw footage.

  But looking at the spike on the screen, I don't see experience. I see voltage.

  Does a spike mean he saw the man? Or does it just mean the wiring fired? The implant records the signal, not the seeing. There's no meter for *when* the feeling happens. The log says the raw data arrived first. But maybe the consciousness of it waited for the edit. Maybe the brain held the raw spike in a waiting room, let the polished wave enter the theater, and then shoved the raw spike into the memory bank as a flashback.

  If that's true, the client never saw the man. He only remembers seeing him. The system worked. The blue screen is the truth.

  But if the spike was conscious—if the raw data broke through the buffer and hit the awareness before the edit arrived—then the system failed. He saw the man. The edit overwrote the reality in real-time. He is living in a correction.

  I look at the client's face in the intake photo. He looks hollowed out. Not scared. Just untethered. When you live in a smoothed world, you expect continuity. You expect the dot to move from A to B. You don't expect the dot to appear at A, then appear at B, and be told you saw it slide. You don't expect to feel your foot brake and be told the pedal never moved.

  My cursor hovers over the APPROVE button.

  If I approve, I certify that the delivered feed was accurate. I certify that the client's experience of the man was a glitch, a phantom generated by the leak, a memory fabricated to make sense of the noise. I certify that the blue screen is what happened.

  If I flag it, I admit the raw feed breached consciousness. I admit that what he saw was real, and what he was given was a lie. I admit that the smoothness we sell is a cover-up.

  But does it matter? If I flag it, the company sends a tech to recalibrate the implant. They'll tighten the buffer. They'll seal the leak. The client will stop seeing the man. He will stop remembering the brake. He will drive safely on the empty road. The blue screen will become the only screen.

  If I approve, the same thing happens. The log gets archived. The client gets a patch. The memory fades. Next week, he'll tell his wife he was tired, that the rain played tricks. The history book will be rewritten again, this time by time itself.

  I zoom in on the spike. It's sharp. Violent. It looks like a truth. But a truth that lasts only until the next edit is just a draft. There is no final copy. There is only the version you are holding now.

  The client says he saw both. But he's saying it now, in this moment, through a brain that has already integrated the edit. His testimony is just another draft, generated after the fact to explain the conflict. Even the leak is just more material for the editor to smooth over.

  I look at the amber screen. The man is still there, frozen in the rain, mid-flinch. He is waiting for me to decide if he existed.

  My finger rests on the mouse. The blue screen waits, empty and clean. The amber screen waits, jagged and full. There is no third screen. There is no place where I can stand to watch both without being part of the feed.

  I move the cursor left, toward FLAG. Then I stop. I move it right, toward APPROVE. Then I stop.

  The rain on the windshield in the video doesn't move. It's just a frame. The movement is something I add. I sit in the quiet of the server room, listening to the hum of the cooling fans, waiting to see which version of the road I will choose to drive home on. My hand stays hovering, caught in the delay, waiting for the edit to complete.
