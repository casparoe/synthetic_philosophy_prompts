      *   *Tone:* Academic, helpful, step-by-step.
      *   *Specific focus:* Ensure the link between "Right deductions..." and the Master Argument is clear. The Master Argument *demonstrates* that the materialist principle yields an "unmaintainable consequence" (a contradiction in conception).

  8.  **Final Polish:** Check the flow. Ensure the distinction between the "vulgar" and the "philosopher" is handled in light of the user's "therapeutic readings." Berkeley isn't saying "stop thinking." He's saying "think correctly." The vulgar are right by accident/instinct; the philosopher must be right by principle.

