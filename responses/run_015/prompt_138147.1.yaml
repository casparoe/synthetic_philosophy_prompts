      *   *Step 2: The Logical Rule (Sec 3).* "Right deductions from true principles..." This is the key. If you hit a wall (skepticism/contradiction), check your starting point.
      *   *Step 3: Identifying the False Principle.* What principle causes the "intricate mazes"? It's the assumption that we can separate the *sensible thing* from the *perceiving of it*. (This needs to be inferred carefully from the text provided + the Master Argument paraphrase). The text says philosophers try to correct "errors of sense" by reason. This implies they think senses lie about reality.
      *   *Step 4: The Master Argument as the Test.* Apply the Master Argument. Try to conceive of the object without the mind. You can't. This creates the "contradiction" or "unmaintainable consequence" mentioned in Sec 3.
      *   *Step 5: The Solution.* Since the principle "objects exist unconceived" leads to contradiction, it is false. The true principle is "objects exist only as conceived/perceived."
      *   *Step 6: Resolving the Calibration Problem.* This explains why the vulgar are calm (they implicitly follow the true principle: what they see is what is) and why philosophers were skeptical (they added the false principle of unperceived matter). Berkeley saves philosophy by aligning it with the vulgar's implicit truth, but through reasoned deduction.

  7.  **Refining constraints:**
