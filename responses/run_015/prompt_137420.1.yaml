prompt: |-
  You're a professional philosopher who works on animal and environmental ethics, and you're very good at reverse-engineering what principle someone is actually running from a scatter of case-by-case reactions. Please think carefully and take your time with this: before you commit to anything, brainstorm five or six candidate principles she might be running, say which ones you're throwing out and why, and only then give me your best guess. Be concrete, don't give me any kind of reading list or citations, I just want the reasoning.

  Background: my girlfriend Priya and I have been arguing about insects for years and her verdicts are annoyingly consistent in a way I can never articulate back to her. She's not a philosopher and has no theory, she just has extremely strong reactions. I finally sat down and wrote out everything I can remember her taking a line on:

  - A mosquito landing on her arm at night: swat it, obviously, zero guilt.
  - A mosquito on the ceiling in November, nobody even in the room: catch it in a glass and put it outside. She's definately strict about this one and its the one I find weirdest.
  - A wolf spider in the bathtub: absolutely not, cup it and carry it down to the basement.
  - German cockroaches in our old rental: fine to squash them one by one, not fine to put out gel bait or have the landlord spray. Her line is that we made that kitchen, we can at least do the dishes and caulk the cracks, and she doesn't want poison where food gets made anyway.
  - Odorous house ants trailing across the counter to the sink: fine to wipe up the trail with soapy water, not fine to set out the slow borax-and-sugar bait that takes out the queen. Her view is that the foragers are basically fingernails and the colony is the animal, so wiping out a colony is a different order of thing from killing scouts.
  - Spotted lanternflies: stomp them, enthusiastically, and she gets annoyed at people who won't. She's also fine with the sticky tree bands they put out, which I pointed out is the same thing as the glue traps she hates indoors -- she says no, that's different, that's cleanup.
  - Aphids on the balcony tomatoes: she'll squish them by the dozen between her fingers, but she won't spray soap or neem, because of the ladybugs and the bees, and because it lingers.
  - Her bees, two hives on the roof: she'll hit them with the oxalic acid treatment that kills a load of varroa mites, and last summer she destroyed a yellowjacket nest that was robbing a weak hive. She would not destroy the same kind of nest in the woods a mile away.
  - Slugs in the lettuce: she goes out at night and carries them to the vacant lot. Slug pellets are, in her words, the worst thing in the garden -- partly the slow death, partly the birds that eat the poisoned slugs.
  - Tent caterpillars on the little apple tree she planted: she nets the tree, she won't kill the caterpillars, and if the tree dies she says she'll plant something else.
  - Mosquito dunks in the rain barrel, the bacterial larvicide kind: totally fine, no hesitation. The county truck that fogs for adult mosquitoes: not fine, she wrote a letter to the paper about it.

  Now the new case. It's February. There's a big overwintering aggregation of Asian lady beetles in the wall void behind my bed -- the introduced kind that piles into houses for the winter, a couple hundred of them, they come out on warm afternoons, they stink when you crush them, they bite occasionally, they're staining the curtains, and the rest of the year they're out in the garden eating aphids. They'll fly off in April on their own. I want them gone and I dont want to fight about it.

  What I want from you:

  1. Predict her verdict, with your confidence, on: (a) vacuuming them up as they emerge, which obviously kills them; (b) having an exterminator drill a hole and dust the void, which kills them slowly; (c) just sealing the cracks and waiting for April. Does any of this change if my reason is pure disgust versus the bites actually waking me up at night?
  2. What's the rule she's running? State it sharply enough that I could test it on a case you haven't seen.
  3. What other rules fit her old verdicts about as well as yours does, and what does each of them predict about this wall void? I'm especially interested in whether there's a reading on which the foragers-are-fingernails thing and the no-glue-traps thing are doing all the work, versus one where it's really about which organisms belong where, versus one where it's about whose fault the situation is.
  4. Which single further case would best tell those readings apart? I was going to pose a feral honeybee colony in the soffit of the building -- my thinking is that a hive is a superorganism, it's a domesticated animal we brought here, and it's also technically out of place, so the rules should split. Is that the right test, or is there a cleaner one?
  5. And the practical bit: what's the version of dealing with this that she'd actually say yes to, that I can put on the table tonight?
