answer: |-
  This is an exceptionally sharp dissection of the policy landscape. You are right to feel that your friend's diagnosis ("it's just about trust") is too quick. While epistemic trust (do we believe her?) is part of it, the deeper divergence is ontological (what *is* the act?) and structural (what is the state's relationship to the market?).

  To answer your request, I will reconstruct the strict logical presuppositions of each model. I will distinguish between what is merely *compatible* with the law (e.g., "this helps women") and what is *load-bearing* (e.g., "if this premise is false, the law becomes incoherent").

  ### 1. The Nordic Model (End Demand / Abolitionism)

  **The Strict Presupposition:**
  For the asymmetry (punish buyer, spare seller) to hold logically, the model must presuppose that **consent to prostitution is structurally vitiated.**

  It cannot merely assume that *some* women are coerced. If it were only an empirical claim about coercion, the law would focus on detecting force (as in general assault law). Instead, by criminalizing the *purchase* regardless of the seller's stated consent, the model asserts that the power dynamic inherent in the transaction renders the seller's consent legally and morally inert.

  **The Load-Bearing Commitments:**
  1.  **Ontological Harm:** Prostitution is not a service; it is an act of domination. Therefore, the "buyer" is not a customer but a perpetrator, and the "seller" is not a contractor but a victim.
  2.  **False Consciousness:** The model must assume that a sex worker's assertion of choice is potentially a survival mechanism or a result of adaptive preference (learning to want what you can have). The state claims to know the woman's interest better than she does in this specific domain.
  3.  **Expressivism over Utility:** The criminal law here is not primarily utilitarian (stopping harm to this specific individual) but expressive (declaring this transaction illegitimate).

  **Where it is Underdetermined:**
  You asked whether it requires prostitution to *be* violence, or just that we can't tell the difference. Strictly speaking, the statute only requires the latter (an epistemic limitation), but the *rhetoric* requires the former (an ontological claim).
  *   **Rival View A (Radical Feminism):** Prostitution is inherently violence. (Law stays the same).
  *   **Rival View B (Welfare Paternalism):** Prostitution is risky, and poor people make bad choices under duress. (Law stays the same).
  *   **The Swap:** If you swapped in a view that "consent is sovereign regardless of economic pressure," the Nordic model collapses immediately. If you swapped in a view that "criminal law should only punish direct physical harm," the model collapses because the "harm" is defined by the transaction, not the physical act.

  **The Worst Case (The Empowered Worker):**
  *Scenario:* A high-end escort says criminalizing her clients reduces her income, forces her to screen clients more hastily (less safety), and she explicitly rejects victim status.
  *Model Response:* The model must treat her testimony as irrelevant to the moral calculus. Her individual safety is sacrificed for the symbolic goal of reducing demand and the structural goal of protecting the *class* of vulnerable women. The model *requires* her to be categorized as a victim to maintain its internal logic. If she is a worker, the buyer is a customer, and the asymmetry fails.

  ### 2. The German/Dutch Model (Legalization / Regulation)

  **The Strict Presupposition:**
  For a special licensing regime to make sense, the model must presuppose that **prostitution is a distinct category of risk that requires state management, but is inevitable.**

  Unlike New Zealand, this model does not treat sex work as "just work." It treats it as a *special* activity that is tolerated but requires containment. The state assumes it has the capacity to distinguish between "legal" sex work (licensed, health-checked) and "illegal" sex work (trafficked, unlicensed).

  **The Load-Bearing Commitments:**
  1.  **Administrative Legibility:** The state assumes it can successfully register and monitor workers and premises. If the industry is too fluid or hidden for the state to track, the licensing regime creates a two-tier system where the most vulnerable are pushed into the illegal tier.
  2.  **Public Order Priority:** The primary goal is often hygiene, zoning, and tax compliance rather than worker empowerment. The worker is treated as a vector of potential risk (health, crime) that needs management.
  3.  **The Possibility of Clean Markets:** It assumes that a legal market can exist without being a front for an illegal one.

  **Where it is Underdetermined:**
  *   **Rival View A (Public Health Utilitarianism):** We legalize to reduce STIs.
  *   **Rival View B (Moral Licensing):** We legalize to collect taxes on a sin.
  *   **The Swap:** If you swapped in the New Zealand view (that special licensing creates stigma and barriers), the German model becomes inefficient bureaucracy. If you swapped in the Nordic view (that the act is inherently harmful), the German model becomes state-sponsored exploitation.

  **The Worst Case (The Unlicensable Worker):**
  *Scenario:* A migrant woman without papers, or a drug-dependent worker, cannot meet the health or registration requirements. She works illegally.
  *Model Response:* The model accepts this as a necessary boundary. It prioritizes the safety and order of the *legal* sector over the inclusion of the *marginal* sector. Unlike New Zealand, which tries to bring everyone under the umbrella of labor law, Germany effectively draws a line: "If you cannot be legible to the state, you are a criminal." The model relies on the hope that the legal sector draws workers away from the illegal one, but logically it creates a perverse incentive for traffickers to keep workers unregistered to avoid scrutiny.

  ### 3. The New Zealand Model (Decriminalization)

  **The Strict Presupposition:**
  For decriminalization to hold, the model must presuppose that **sex work is normatively neutral labor, and stigma is the primary source of harm.**

  This is the only model that treats the transaction as morally equivalent to massage or acting. It assumes that the criminal law is a blunt instrument that causes more harm (violence, lack of police protection) than the trade itself.

  **The Load-Bearing Commitments:**
  1.  **Sovereign Agency:** The worker is the best judge of her own safety. Her consent is operative and valid, provided it meets the standard thresholds for any other contract (no force, no fraud).
  2.  **General Law Sufficiency:** Existing labor, health, and safety, and criminal laws are sufficient to handle exploitation. There is no need for *special* laws about sex.
  3.  **Distinction between Work and Trafficking:** It assumes police and courts can distinguish between consensual sex work and trafficking/coercion without the blanket prohibition of the trade.

  **Where it is Underdetermined:**
  *   **Rival View A (Libertarianism):** Freedom of contract is paramount.
  *   **Rival View B (Labor Unionism):** Workers need collective bargaining power, which criminalization prevents.
  *   **The Swap:** If you swapped in the Nordic view (that the act is inherently exploitative), New Zealand becomes a deregulation of abuse. If you swapped in the German view (that the state must manage the risk), New Zealand looks negligent for not having specific health checks.

  **The Worst Case (The Trafficked Victim):**
  *Scenario:* A trafficked woman is held in a brothel. Because the brothel is legal, she is afraid to speak to police, or the police assume it is consensual work because the paperwork looks in order.
  *Model Response:* This is the model's Achilles heel. It must argue that while this specific case is tragic, the *overall* rate of violence is lower because workers can report abuse without fear of arrest. It accepts the risk of hidden trafficking as the cost of empowering the visible majority. It relies on the hope that decriminalization makes it *easier* to spot trafficking because workers aren't hiding from the law, but if the coercion is psychological, the model lacks the specific tools to detect it that a specialized licensing regime might claim to have.

  ### Re-evaluating Your Friend's "Trust" Diagnosis

  Your friend says: *Nordic doesn't trust the woman; New Zealand does.*

  This is half-right but misses the object of trust.
  *   **New Zealand** trusts the woman's **agency** (her capacity to choose).
  *   **Nordic** trusts the woman's **vulnerability** (her capacity to be harmed).
  *   **Germany** trusts the **State** (its capacity to regulate).

  The Nordic model doesn't necessarily think the woman is lying; it thinks her choice is constrained by patriarchy/poverty to the point of invalidity. It's not "I don't trust you," it's "I don't trust the conditions under which you are choosing."

  ### Summary of Philosophical Commitments

  | Feature | Nordic (Sweden) | German/Dutch (Legalization) | New Zealand (Decriminalization) |
  | :--- | :--- | :--- | :--- |
  | **Nature of Act** | Inherently harmful / Violence | Inherently risky / Public Order Issue | Morally Neutral / Labor |
  | **Status of Consent** | Vitiated by structure | Valid but regulated | Sovereign |
  | **Role of State** | Protector / Abolitionist | Manager / Administrator | Enforcer of General Rights |
  | **Worst Case** | Autonomous worker harmed by client stigma. | Marginalized worker pushed underground. | Trafficked worker hidden by legality. |
  | **Solution to Worst Case** | Prioritize class welfare over individual utility. | Accept a two-tier system (legal/illegal). | Rely on general labor/criminal law enforcement. |

  ### What Would Break Each Model?

  1.  **Break the Nordic Model:** Prove that criminalizing demand *increases* violence against workers empirically, and that workers consistently report feeling *less* safe. The model relies on the premise that removing buyers reduces harm. If removing buyers just drives the market underground and increases danger, the utilitarian justification fails, leaving only the moral expressivism (which is harder to defend politically).
  2.  **Break the German Model:** Prove that licensing creates a "clean" facade that launders trafficked women. If the regulatory regime cannot distinguish between a free worker and a coerced one, the state becomes a guarantor of exploitation.
  3.  **Break the New Zealand Model:** Prove that general labor law is insufficient to protect sex workers (e.g., if police refuse to take "rape by client" seriously because "it's work"). The model relies on the normalization of the industry. If stigma persists despite the law, the protections fail.

  ### Conclusion

  You are stuck because the Nordic model asks you to accept a **paternalistic paradox**: that to save the woman, you must criminalize her income source, and to respect her dignity, you must deny her agency.

  The New Zealand model asks you to accept a **liberal risk**: that to ensure freedom, you must allow the possibility of exploitation to hide in plain sight.

  The German model asks you to accept a **bureaucratic fiction**: that the state can successfully wall off the "good" sex from the "bad" sex.

  Your friend is right that "trust" is the variable, but it is trust in *what*. Nordic trusts the structural analysis over the individual testimony. New Zealand trusts the individual testimony over the structural analysis. Germany trusts the state's ability to manage the conflict between the two.
