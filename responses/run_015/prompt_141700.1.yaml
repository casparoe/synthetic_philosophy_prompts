          *   **Status:** **Contested/Interpretive Dispute.** This is the "entitlement" vs. "non-epistemic" debate. Some (Wright) argue for a special kind of justification (entitlement). Others (hinge epistemologists like Moyal-Sharrock) argue they are non-epistemic. The blog post takes a hard line here.
      *   *Claim 6: ...demanding one is like demanding a proof of the rules of chess.*
          *   **Status:** Accepted analogy (Wittgenstein uses game analogies frequently), but the *implication* is debated.
      *   *Claim 7: Hinges are the things we are objectively certain of... but since nothing grounds them, they are not really beliefs at all...*
          *   **Status:** **Major Interpretive Dispute.** The "belief" status of hinges is one of the biggest fights in *On Certainty* scholarship. Are they non-propositional? Non-doxastic? The blog post takes the "non-doxastic" (Moyal-Sharrock) line. Others (Coliva) argue they are beliefs but ungrounded.
      *   *Claim 8: ...function more like rules of a game, or like the bed of the river...*
          *   **Status:** Accepted metaphors from the text (OC §96-99).
      *   *Claim 9: This is the point at which Wittgenstein improves on Moore... wrong to describe his stopping point as knowledge...*
