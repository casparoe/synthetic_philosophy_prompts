          *   **Status:** Generally accepted. *On Certainty* is widely read as a response to Cartesian skepticism and Moore's common-sense realism.
      *   *Claim 2: Doubt only makes sense against a background of things that are not in doubt...*
          *   **Status:** Core Wittgensteinian thesis. Accepted. (OC §115, §341-343).
      *   *Claim 3: The propositions that do this anchoring work are the hinges... not supported by evidence...*
          *   **Status:** Accepted. This is the definition of a hinge proposition.
