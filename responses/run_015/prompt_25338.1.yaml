answer: |-
  First, I want to acknowledge the personal weight you are carrying. Having family on both sides of an active conflict adds a layer of anguish to these abstract questions that pure philosophy often ignores. It is entirely understandable that you are searching for a framework that allows you to make sense of the moral landscape without dehumanizing the individuals caught in the machinery of war.

  The puzzle you have identified is not only real; it is the central debate in contemporary just war theory. You have intuitively stumbled upon the tension between the **Orthodox View** (often associated with Michael Walzer) and the **Revisionist View** (championed by philosophers like Jeff McMahan).

  Here is the vocabulary you are looking for, the distinctions philosophers draw, and an attempt to resolve the circular reasoning you described.

  ### 1. The Name of the Puzzle: The Moral Equality of Combatants

  The view you described—that soldiers on both sides have equal moral status regardless of the justice of their cause—is called the **Moral Equality of Combatants (MEC)**.

  *   **The Orthodox View (Walzerian):** Defends MEC. It argues that *Jus ad Bellum* (the justice of going to war) is separate from *Jus in Bello* (justice in the conduct of war). A soldier fighting an unjust war is not morally culpable for fighting, provided they follow the rules of engagement.
  *   **The Revisionist View (McMahan):** Rejects MEC. It argues that the right to kill in war derives from the justice of the cause. If a war is unjust, the soldiers fighting it generally have no right to kill, making their actions morally akin to manslaughter or murder, even if they are excused to some degree.

  Your intuition that the Russian soldier is different from the Mafia hitman aligns with the Orthodox View. Your intuition that "following orders" shouldn't absolve someone of killing aligns with the Revisionist View.

  ### 2. The Missing Distinction: Liability vs. Culpability

  The reason you feel you are going in circles is likely because you are conflating two different moral questions. In recent philosophical literature (particularly by Seth Lazar and Helen Frowe), a crucial distinction is drawn between **liability** and **culpability**.

  *   **Liability:** Is this person a legitimate target? Do they forfeit their right not to be harmed?
  *   **Culpability:** Is this person morally blameworthy for the harm they pose?

  **The Resolution:** It is possible to be **liable** to attack without being **culpable** for the threat you pose.

  Consider this analogy: Imagine a sleepwalker picks up a knife and walks toward you. They are not *culpable*; they are not choosing to harm you, they are not evil, and we wouldn't blame them later. However, they are *liable* to be stopped, even with force, because they objectively pose a lethal threat.

  Applied to the Russian conscript:
  1.  **Liability:** Because he is pointing a weapon at Ukrainian positions, he poses a threat. Ukrainian soldiers are permitted to shoot him to defend themselves. He is a legitimate military target.
  2.  **Culpability:** Because he is coerced, propagandized, and lacks the agency to stop the war, he may bear very little *moral blame* for being in that position.

  This distinction allows you to hold both thoughts: The Ukrainian soldier is justified in shooting the Russian conscript (liability), but the Russian conscript is not necessarily a "murderer" in the moral sense (culpability).

  ### 3. Why War is Different from the Mafia (The Institutional Argument)

  You asked why we don't give the "following orders" pass to a Mafia hitman or a corporate engineer. This is the strongest point of the Revisionists, but the Orthodox have a robust response based on **epistemic limitations** and **collective agency**.

  **A. The Epistemic Problem**
  A Mafia hitman knows the organization is criminal. The nature of the act is transparently illegal and immoral.
  In contrast, modern states educate their citizens from birth to view the state as the protector of justice. A Russian conscript is subjected to a total information environment telling him Ukraine is run by Nazis, that NATO is encroaching, and that he is defending his homeland.
  Philosophers argue that ordinary citizens (and thus soldiers) lack the **epistemic access** to judge the *Jus ad Bellum* (the justice of the war). They cannot verify intelligence, treaty obligations, or diplomatic history. Therefore, we grant them an **epistemic excuse** that we do not grant a hitman. They are reasonably, albeit mistakenly, believing they are acting in defense.

  **B. The Coercive Structure**
  In a mafia, membership is (theoretically) voluntary and退出 (exiting) is possible, though dangerous. In a modern state at war, the monopoly on violence is total. Refusal means prison, exile, or execution of family.
  While a volunteer soldier accepts some risk, the institutional pressure of a state at war creates a **duress** that is qualitatively different from employment in a corporation. The state claims a right to your life that a corporation does not.

  **C. The "Nuremberg" Clarification**
  You mentioned Nuremberg. It is a common misconception that Nuremberg prosecuted soldiers for merely fighting. It did not. It prosecuted leaders for "Crimes Against Peace" (starting the war) and individuals for "War Crimes" (killing civilians, torture).
  The Nuremberg principle "I was just following orders" was rejected specifically regarding *manifestly illegal acts* (like shooting a prisoner). It was not used to criminalize the act of shooting an enemy combatant in an aggressive war. This legal tradition supports the Orthodox view: fighting itself is not a crime; *how* you fight is.

  ### 4. Graded Culpability

  Philosophers also suggest that culpability is not a binary switch (guilty/innocent) but a **spectrum**. This helps with your observation about volunteers vs. conscripts.

  *   **The Conscript:** High coercion, high misinformation. Very low culpability.
  *   **The Professional Volunteer:** Lower coercion, but still subject to state propaganda. Moderate culpability (they chose the profession, but not necessarily the specific war).
  *   **The Ideological Zealot:** Low coercion, high belief in the unjust cause. Higher culpability.
  *   **The War Criminal:** Commits atrocities (torture, killing civilians). Maximum culpability (no excuse covers this).

  This allows you to say that a mobilized Russian peasant is morally distinct from a Wagner Group mercenary executing prisoners, even if both are on the "unjust" side.

  ### 5. Summary of Positions

  If you wish to read further, these are the key terms and authors:

  1.  **Michael Walzer (*Just and Unjust Wars*):** Defends the **Moral Equality of Combatants**. Argues that separating the justice of the war from the conduct of the soldier is necessary to limit the horrors of war. If we branded all enemy soldiers as murderers, no war would end in reconciliation, and soldiers would fight without restraint.
  2.  **Jeff McMahan (*Killing in War*):** The leading **Revisionist**. Argues that MEC is a myth. If you fight for an unjust cause, you are morally liable to be killed and morally culpable for killing, though you may have *excuses* (ignorance, duress) that mitigate blame.
  3.  **David Rodin & Henry Shue:** Discuss the **Collective Action** problem. They explore how individual morality changes when acting as an agent of a state.

  ### A Final Thought for Your Situation

  The philosophical consensus that might offer the most peace of mind is this: **Structural guilt does not always imply individual guilt.**

  The war itself is a moral catastrophe for which the leadership bears the primary burden (*Jus ad Bellum*). The soldiers are the instruments of that catastrophe. While they are dangerous and must be stopped (liability), many of them are victims of the same political machinery that victimizes the people they are fighting.

  You can condemn the invasion without condemning the nineteen-year-old in the trench as a moral monster. You can recognize that he is trapped in a "crime of obedience" where the cost of morality is his own life or freedom. This does not make his actions "good," but it makes them **excusable** in a way that civilian murder is not.

  This distinction preserves the humanity of the individuals on the ground while maintaining a clear moral judgment against the aggression itself. It is a difficult balance, but it is the one most consistent with both our moral intuitions and the laws of war.
