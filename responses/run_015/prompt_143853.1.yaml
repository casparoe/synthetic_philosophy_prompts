          *   If $P$ says $E$ is true, $P$ admits it is unreliable $\rightarrow$ $B$ loses foundation.
          *   If $P$ says $E$ is false, $P$ preserves $B$ but ignores the reliability warning.
      *   *The Impasse:* Rational revision seems impossible because the tool needed to measure the error is the tool suspected of error.

