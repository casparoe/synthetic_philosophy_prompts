  7.  **Refining the "No-Trade" section:**
      *   Make sure to clarify that Milgrom-Stokey implies that *if* everyone is rational, trade stops. Since trade *doesn't* stop, someone is irrational (noise) or priors differ. If noise exists, prices aren't "right." The hedge fund guy is using a theorem about the *absence* of trade to justify the *wisdom* of trade. That's the irony.

  8.  **Refining "Epistemic Arbitrage":**
