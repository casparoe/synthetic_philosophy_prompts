  *(Final check on No-Trade)*: The user says "result says no trade under those conditions." Correct. The fund guy says "therefore price contains everything." The link is: Trade happens *until* price contains everything, then it stops. But since it never stops, price is always chasing. I need to make sure this nuance lands.

