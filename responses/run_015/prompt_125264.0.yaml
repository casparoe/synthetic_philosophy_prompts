      4.  Did the specific trigger conditions *strictly* occur? (No -> Don't force outcome, use process).
      5.  Is the directive Outcome-based or Process-based? (Process -> Follow. Outcome + Ambiguity -> Pause).

      *Stop Rules:*
      *   Stop and Honor Directive: Imminent danger + Clear Trigger + Symptom matches + No new info.
      *   Stop and Ignore Directive: Coherent refusal + New Info/Value Drift + No imminent danger.
      *   Hand to Human (Ethics/Senior Clinician): Ambiguous capacity + High stakes outcome directive.

