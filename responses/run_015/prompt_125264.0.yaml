      *   *Value Drift:* Identity change. Is the new self a different person?
      *   *New Information:* The contract was based on incomplete data.
      *   *Trigger Gaming:* Malicious compliance/loopholing by the impaired self.
      *   *Process vs. Outcome:* Process directives (wait, call sister) preserve agency while adding friction. Outcome directives (force meds) remove agency. The user notes Process directives rarely "blow up." This is a crucial heuristic.

