answer: |-
  Here is the procedure. It is designed for the 2am phone call, the 40-minute drafting session, and the sibling in the lobby. It prioritizes the integrity of the document over the comfort of the clinician, except where safety overrides everything.

  ### The 4-Point Triage Procedure

  **Step 1: The Safety Override (0–10 seconds)**
  *   **Question:** Is there imminent risk of death or serious physical injury (to self or others) *right now*?
  *   **Yes:** Act to preserve life/safety. The directive is suspended until the immediate threat is neutralized. Document why.
  *   **No:** Proceed to Step 2.
  *   *Sibling Explanation:* "We always prioritize keeping him alive over keeping the agreement. That part isn't negotiable."

  **Step 2: The Trigger Audit (10–30 seconds)**
  *   **Question:** Did the specific, objective conditions written in the document *strictly* occur? (Check numbers, times, specific behaviors).
  *   **No:** **STOP.** Do not enforce an Outcome Directive (e.g., forced meds). You may enforce a Process Directive (e.g., call sister).
  *   **Yes:** Proceed to Step 3.
  *   *Sibling Explanation:* "The document is a contract. If we ignore the fine print when it suits us, the contract is worthless for next time."

  **Step 3: The "New Info" Check (30–60 seconds)**
  *   **Question:** Can the patient articulate a reason for refusal that relies on *new information* or *stable value changes* rather than the symptom the directive was meant to catch?
      *   *Look for:* "I found a medication that works better," "My faith has changed," "I have a new caregiver." (Valid)
      *   *Look for:* "I am not sick," "You are poisoning me," "I don't need sleep." (Symptom/Invalid)
  *   **Valid Reason:** Pause the directive. Escalate to senior clinician/ethics if possible. If 2am and safe, defer to current self.
  *   **Invalid Reason (Symptom):** Proceed to Step 4.
  *   *Sibling Explanation:* "We checked if his refusal was based on new facts or the illness itself. It looked like the illness."

  **Step 4: The Process/Outcome Tie-Breaker (60–90 seconds)**
  *   **Question:** Is the directive demanding a specific medical *outcome* (force the shot) or a *process* (wait 24 hours, call proxy)?
  *   **Outcome + Ambiguity:** If Steps 2 or 3 were even slightly ambiguous, **do not enforce.** Default to the least restrictive alternative.
  *   **Process:** Enforce the process. It buys time without violating bodily autonomy.
  *   *Sibling Explanation:* "When we weren't 100% sure, we chose the option that kept his rights intact while keeping him safe."

  **The 2am Fallback (When you can't ask)**
  If the patient is non-verbal, unreachable, or too disorganized to answer Step 3:
  1.  Assume **Capacity Dip** (Category 1).
  2.  Honor the **Trigger Audit** (Step 2) strictly.
  3.  If Trigger Met + Safety Risk -> **Honor Directive.**
  4.  If Trigger Missed -> **Do Not Honor Outcome.**

  **The "Catch" (Preventing Misfire)**
  *   **The Sunset Clause:** Every directive expires in **2 years**. It must be re-signed. This catches Value Drift (Category 2) automatically.
  *   **The Single Question:** During drafting, ask: *"If you change your mind because you found a better treatment, how will we know that's not the illness talking?"* Write the answer into the "New Info" section of the directive.

  ***

  ### Running the Cases

  #### Case A: The Bipolar Trigger (Night 2, $200, Coherent)
  *   **Step 1 (Safety):** No imminent physical danger stated.
  *   **Step 2 (Trigger):** Directive says "3 nights under 4 hours." Reality: "Night 2, maybe 4 hours." Directive says "Giving money away." Reality: "$200 raffle."
      *   *Audit:* **Trigger Failed.** The numerical threshold was not met. The financial threshold is ambiguous (is $200 "giving money away" in the context of the directive?).
  *   **Step 3 (New Info):** Patient is coherent. Cannot assess "New Info" fully without more time, but coherence suggests potential capacity.
  *   **Step 4 (Tie-Breaker):** Outcome Directive (force meds) + Trigger Ambiguity.
  *   **Verdict:** **Do not enforce the medication.** Monitor closely. You may invoke a *Process* directive (e.g., "Call my sister") if available, but you cannot force the shot.
  *   **The Uncomfortable Answer:** This is the one you won't like. Clinically, she is likely tipping into mania. You can see the crash coming. But the document is a bright line. If you enforce on Night 2, you teach the client that the numbers don't matter, only your judgment does. That destroys the tool for the next crisis. You have to let her risk the mania to respect the contract she wrote.
  *   **Sibling Explanation:** "The document said three nights. It was only two. If we medicate now, we break the promise we made to her when she was well."

  #### Case B: The Religious Conversion (11 Years, Sober, Coherent)
  *   **Step 1 (Safety):** No imminent danger.
  *   **Step 2 (Trigger):** Presumably, the clinical trigger for the directive (e.g., psychosis) is not met, or they are refusing preventative care based on identity.
  *   **Step 3 (New Info/Drift):** Patient cites "Value Drift" (religious conversion). They are coherent, sober, and articulate that the "old self" was operating on a different worldview. This is not a symptom (like "I am God"); it is a fundamental value update.
  *   **Step 4 (Tie-Breaker):** 11 years exceeds the recommended "Sunset Clause" (2 years).
  *   **Verdict:** **Void the directive.** The "Past Self" authority expires when the "Current Self" has undergone a stable, non-pathological identity shift, especially beyond a reasonable expiry window.
  *   **Sibling Explanation:** "This document was eleven years old. People change. She isn't sick; she's just different than she was then. We can't treat her for who she used to be."

  #### Case C: The Clinic Policy (No Police, Nurse Arm Broken)
  *   **Step 1 (Safety):** **Yes.** A nurse has been physically injured. Immediate safety risk to staff.
  *   **Verdict:** **The policy does not bind.** Safety Override (Step 1) trumps institutional precommitment. Call the police if necessary for safety.
  *   **The Analogy:** **You are importing the wrong shape.**
      *   *Individual ACP:* Binds a single continuous consciousness. Value Drift is internal.
      *   *Institutional Policy:* Binds a *role*, not a person. The "self" of the clinic has turned over completely since 2016 (staff changes). The "Past Self" (2016 staff) is not the same agent as the "Current Self" (2024 staff).
      *   *The Real Problem:* This isn't a Ulysses contract; it's a governance failure. A 2/3 vote requirement to adapt to new data (violence risk) is institutional rigidity, not protective precommitment.
  *   **Sibling Explanation:** (Not applicable, but for staff): "This policy was made by people who don't work here anymore, based on data from eight years ago. It doesn't apply to a broken arm."

  ***

  ### Limitations and Misfires

  **Where this procedure fails:**
  1.  **The "Insight" Trap:** In Case A, the patient is "perfectly coherent." Mania often presents as hyper-lucidity. Step 3 relies on your ability to distinguish "stable value" from "manic conviction." You will get this wrong sometimes.
  2.  **The 2am Information Vacuum:** If you can't reach a sister or check records, Step 3 becomes a guess. You will default to Safety (Step 1), which may lead to over-intervention.
  3.  **The Institutional Blindspot:** Case C shows that groups use "precommitment" to avoid accountability, not to protect autonomy. The procedure works for individuals, not bureaucracies.

  **The Cheapest Way to Catch a Misfire:**
  **The Sunset Clause.**
  Require re-signing every **24 months**.
  *   **Why:** It forces the "Value Drift" conversation while the patient is well. If they won't re-sign, the directive expires.
  *   **Cost:** Low administrative burden.
  *   **Benefit:** It automatically voids Case B (11 years old) without you having to make a philosophical judgment at 2am. It forces the client to re-commit to the "Trigger" in Case A, ensuring they still believe "3 nights" is the right number.

  **Final Instruction:**
  When in doubt, favor **Process** over **Outcome**. Making a patient wait 24 hours or call a proxy rarely causes harm. Forcing a neuroleptic on a patient whose trigger didn't technically fire causes trauma and destroys trust. You can always medicate later; you cannot un-violate a contract.
