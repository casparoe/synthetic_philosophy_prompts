  *   **Priya (Purposivist):** **Valid.** The purpose is secure access. The scanner provides secure access. The words can bear this reading.
  *   **Dan (Evolutionary Plain Meaning):** **Valid.** "Key" is a functional term that evolves to include whatever mechanism unlocks the door in the modern era.
  *   **You (Mechanism):** **Invalid.** The statute names a specific mechanism ("Physical Key" = Metal object inserted into tumbler). A biometric scanner runs on a different mechanism (Digital authentication).

  **Why this works better than the Telepresence Robot:**
  In the Telepresence Robot scenario, Dan might hesitate to say a robot is "present" (plain meaning lag), which muddies the water between Dan and You. In the "Key vs. Biometric" scenario, Dan's theory of evolving referents *demands* coverage, Priya's theory of purpose *demands* coverage, but your Mechanism theory *demands* rejection. If Judge Whitlock rejects the biometric scanner, your theory is confirmed. If she accepts it, you need to recalibrate.

  ### 6. Contingency: If the Record Doesn't Decide
  If she votes **for the Buyer** (Coverage), she is committing herself to a **Functional Equivalence** rule for consumer protection statutes specifically. This would mean she distinguishes between *Regulatory Formalities* (Wills, Mail, Rent Notices — where she is strict) and *Consumer Shields* (Solicitation, Cooling-off — where she is flexible).

  If this happens, your "Mechanism" theory is incorrect. She is actually a **Contextual Purposivist**: she looks at whether the statute is a *sword* (regulating conduct) or a *shield* (protecting victims). She applies formalism to swords (Case 2, 4, 5) and functionalism to shields (Case 1, and potentially *Alarcon*).

