answer: |-
  **Scenario**
  Elena is an on-call Site Reliability Engineer monitoring a distributed database cluster. She faces a binary question: $H$ (Disk I/O Saturation requiring immediate reboot) or $\neg H$ (Transient Garbage Collection pause that will self-heal). A dashboard metric $E$ (Queue Depth > 100) is available instantly and for free. Elena knows from her team's post-mortem logs that she suffers from "alert panic": when she sees a high queue depth, she ignores base rates and becomes certain of saturation, but when queue depth is normal, she fails to update and stays at her prior. She must decide now whether to refresh the dashboard or leave it closed and trust her baseline assessment.

  **The Algebra**
  *   **Hypotheses:** $H$ (Saturation), $\neg H$ (Transient).
  *   **Prior:** $P(H) = 0.2$, $P(\neg H) = 0.8$.
  *   **Likelihoods:** $P(E|H) = 0.9$, $P(E|\neg H) = 0.3$. (Evidence is informative; Likelihood Ratio = 3).
  *   **Scoring Rule:** Brier Score $S(p, w) = (p - o)^2$, where $p$ is credence in $H$ and $o \in \{1, 0\}$ is the truth value of $H$. Lower is better.
  *   **Agent's Rule:**
      *   If $E$: $p_{new} = 1.0$ (Panic).
      *   If $\neg E$: $p_{new} = 0.2$ (Anchoring/No update).
  *   **Evidence for Bias:** Her incident log shows that in 50 past cases where $E$ occurred, $H$ was true only 43% of the time, yet her recorded confidence was consistently 100%.

  **The Calculations**
  1.  **Decline to Look (Keep Prior):**
      *   Credence $p = 0.2$.
      *   Expected Inaccuracy: $0.2(1 - 0.2)^2 + 0.8(0 - 0.2)^2 = 0.2(0.64) + 0.8(0.04) = \mathbf{0.160}$.

  2.  **Look + Proper Conditionalization:**
      *   $P(E) = 0.9(0.2) + 0.3(0.8) = 0.42$.
      *   $P(H|E) = 0.18 / 0.42 \approx 0.429$.
      *   $P(H|\neg E) = 0.02 / 0.58 \approx 0.034$.
      *   Exp. Inaccuracy given $E$: $0.429(1-0.429)^2 + 0.571(0-0.429)^2 \approx 0.245$.
      *   Exp. Inaccuracy given $\neg E$: $0.034(1-0.034)^2 + 0.966(0-0.034)^2 \approx 0.033$.
      *   Total Expected Inaccuracy: $0.42(0.245) + 0.58(0.033) = 0.1029 + 0.0191 = \mathbf{0.122}$.
      *   *(Proper looking improves accuracy: $0.122 < 0.160$)*.

  3.  **Look + Biased Rule (Elena's Reality):**
      *   If $E$ (Prob 0.42): She sets $p=1.0$. Truth is $H$ (Prob 0.429) or $\neg H$ (Prob 0.571).
          *   Score: $0.429(1-1)^2 + 0.571(0-1)^2 = 0.571$.
      *   If $\neg E$ (Prob 0.58): She sets $p=0.2$. Truth is $H$ (Prob 0.034) or $\neg H$ (Prob 0.966).
          *   Score: $0.034(1-0.2)^2 + 0.966(0-0.2)^2 = 0.034(0.64) + 0.966(0.04) = 0.0218 + 0.0386 = 0.0604$.
      *   Total Expected Inaccuracy: $0.42(0.571) + 0.58(0.0604) = 0.2398 + 0.0350 = \mathbf{0.275}$.
      *   *(Biased looking destroys accuracy: $0.275 > 0.160$)*.

  **Verdict:** Looking yields an expected score of 0.275. Ignoring yields 0.160. Elena should not look.

  **Breaking the Theorem**
  The accuracy-first argument that "free evidence cannot hurt" proceeds in four steps:
  1.  Define inaccuracy $I(P, w)$.
  2.  Show that for any evidence $E$, the credence function that minimizes expected inaccuracy *given* $E$ is the conditionalized posterior $P(\cdot|E)$.
  3.  Show that the expected inaccuracy of the conditionalized posterior (averaged over possible $E$) is lower than the prior's inaccuracy.
  4.  Conclude: Looking (and updating) dominates not looking.

  **Violated Step:** Step 2. The theorem proves that *if* you update to minimize expected inaccuracy, looking helps. It does not prove that looking helps *if* you update via a fixed, biased function $f(E)$. Elena's rule $f(E)$ does not minimize expected inaccuracy given $E$; in the $E$ case, it maximizes it (assigning 1.0 to a hypothesis that is only 43% likely). The theorem assumes the agent is an *accuracy optimizer* in the update phase. Elena is not.

  **Features and Bindings**
  The feature doing the work is **involuntary cognitive distortion**. The evidence $E$ triggers a heuristic that overrides Bayesian calculation.
  *   **Binding:** If Elena can bind herself the night before to a written lookup table (e.g., "If $E$, write down 0.43"), the case collapses. She effectively conditionalizes mechanically, achieving the 0.122 score. The barrier is not access to evidence, but *execution of the update rule* in the high-stress moment.
  *   **Uncertainty:** If she is less certain about her bias (e.g., "I panic 50% of the time"), the expected inaccuracy of looking becomes a weighted average of the Proper and Biased scores. If the probability of panic is high enough, the result holds. If she thinks she might be rational, she might gamble on looking, but the *objective* fact remains: given her actual psychology, looking is harmful.

  **The Accuracy-First Defense**
  An accuracy-first theorist will resist calling this a counterexample by retreating to idealization. They will argue: "The norm is 'Minimize Expected Inaccuracy.' For a rational agent, this implies 'Look and Conditionalize.' For Elena, minimizing expected inaccuracy implies 'Do Not Look.' Therefore, the advice 'Always Look' was never a universal norm; it was a derived theorem for ideal agents."
  **Critique:** This retreat costs the view its action-guiding force for non-ideal agents. If the theory only tells perfect Bayesians what to do, it offers no help to humans who know they are flawed. It tells Elena "You ought to conditionalize," which she knows she cannot do. It fails to tell her "You ought to hide the dashboard," unless we grant that "ought" implies "can" (or "ought to maximize accuracy" implies "avoid inputs you can't process"). The theory becomes descriptive of ideal states rather than prescriptive for actual epistemic hygiene.

  **Dashboard Takeaway**
  For an on-call engineer known to overreact, surfacing raw, alarming metrics is epistemically harmful, even if the metrics are true. The system should not present evidence that the human cannot process correctly. Instead, the dashboard should either suppress the raw metric in favor of a processed alert (which encodes the proper posterior) or enforce a friction step (like a lookup table) that forces the engineer to bind herself to the correct update rule before seeing the data. Truth without the capacity to process it is noise.
