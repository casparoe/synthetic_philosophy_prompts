  # DECISION TREE: THE DISTRIBUTION OF CONSCIOUSNESS

  **Instructions:** Begin at Node 1. Answer the question based on your intuition about the case described. Follow the branch to the next node or to a Leaf (a final position). Record the Leaf number.

  ### NODE 1: The Silence
  **Case:** A creature screams when injured and avoids the cause, but lacks language and cannot report its experience.
  **Question:** Does the inability to report experiences rule out the attribution of consciousness, or is behaviour sufficient evidence?
  *   **A:** Reports are necessary; without them, we cannot know. → **LEAF 1**
  *   **B:** Behaviour is sufficient; we proceed to Node 2.

  ### NODE 2: The Origin
  **Case:** Two systems behave identically: one evolved naturally, one synthesized from silicon.
  **Question:** Does evolutionary ancestry matter for consciousness, independent of functional organisation?
  *   **A:** Yes, biology/lineage is constitutive. → **NODE 3A**
  *   **B:** No, organisation is all that matters. → **NODE 3B**

  ### NODE 3A: The Human Mirror (Biological Path)
  **Case:** Your criterion for consciousness excludes a dog.
  **Question:** Does it also exclude a human infant or severely cognitively impaired adult? If yes, do you accept that exclusion?
  *   **A:** Yes, I accept the exclusion (Human Exception). → **LEAF 2**
  *   **B:** No, I must include them (Consistency). → **NODE 4**

  ### NODE 3B: The Human Mirror (Functional Path)
  **Case:** Your criterion for consciousness excludes a sophisticated robot.
  **Question:** Does it also exclude a human infant or severely cognitively impaired adult? If yes, do you accept that exclusion?
  *   **A:** Yes, I accept the exclusion (Cognitive Threshold). → **LEAF 3**
  *   **B:** No, I must include them (Consistency). → **NODE 4**

  ### NODE 4: The Boundary
  **Case:** An octopus arm or a surgically split brain hemisphere operates with neural semi-autonomy.
  **Question:** Can a proper *part* of an organism be a distinct conscious subject?
  *   **A:** No, the organism is the single unit. → **NODE 5**
  *   **B:** Yes, subsystems are eligible candidates. → **LEAF 4**

  ### NODE 5: The Collective
  **Case:** A eusocial colony or a tightly coordinated human team acts as a unified agent.
  **Question:** Can a *group* be a conscious subject over and above the individuals?
  *   **A:** No, only individuals count. → **NODE 6**
  *   **B:** Yes, super-systems are eligible candidates. → **LEAF 5**

  ### NODE 6: The Switch
  **Question:** Is consciousness an all-or-nothing property (like pregnancy) or a graded quantity (like height)?
  *   **A:** All-or-nothing (Binary). → **LEAF 6**
  *   **B:** Graded quantity (Scalar). → **NODE 7**

  ### NODE 7: The Sum
  **Case:** One creature has 100 small conscious modules; another has 1 large module of equivalent total capacity.
  **Question:** Do the small modules sum to greater moral weight than the single large one?
  *   **A:** Yes, we aggregate the quantity of consciousness. → **LEAF 7**
  *   **B:** No, we count the subjects, not the sum of parts. → **LEAF 8**

  ***

  # LEAF ANNOTATIONS

  **LEAF 1: Radical Skepticism**
  *   **Status:** Named Position.
  *   **Awkward Commitment:** You must treat all animal welfare claims as literally unintelligible, indistinguishable from clockwork.
  *   **Aggregation Note:** Cost-effectiveness is null; welfare interventions have no moral value as there are no subjects to benefit.
  *   **Collision:** Indistinguishable from Methodological Behaviorism in practice.

  **LEAF 2: Biological Human-Exceptionalism**
  *   **Status:** Named Position (Speciesism).
  *   **Awkward Commitment:** You must accept that a severely impaired human has higher moral status than a fully fluent ape.
  *   **Aggregation Note:** Non-human animals have zero weight; interventions are only cost-effective if they benefit humans.

  **LEAF 3: Cognitive Human-Exceptionalism**
  *   **Status:** Named Position (Cognitive Threshold).
  *   **Awkward Commitment:** You must accept that a human infant loses moral status if their cognitive development stalls permanently.
  *   **Aggregation Note:** Animals below the threshold have zero weight; interventions focus on raising capacities or benefiting humans.

  **LEAF 4: Partialist Pluralism**
  *   **Status:** Unnamed (explored in split-brain literature).
  *   **Awkward Commitment:** You must count one octopus as eight subjects, potentially outweighing one human.
  *   **Aggregation Note:** Welfare estimates must multiply by the number of semi-autonomous neural subsystems per organism.

  **LEAF 5: Super-organismalism**
  *   **Status:** Unnamed (related to Group Mind theories).
  *   **Awkward Commitment:** You must grant that destroying a hive harms a subject that is not any single bee.
  *   **Aggregation Note:** Interventions targeting the collective structure may outweigh those targeting individuals.

  **LEAF 6: Organismal Binary Realism**
  *   **Status:** Named Position (Common Sense Realism).
  *   **A:** (Biological Path) **Biological Naturalism.**
  *   **B:** (Functional Path) **Functionalism.**
  *   **Awkward Commitment:** You must draw a sharp line where nature provides a gradient, declaring one species "in" and a nearly identical one "out."
  *   **Aggregation Note:** All conscious subjects count equally; cost-effectiveness depends solely on the number of individuals affected.
  *   **Collision:** Biological and Functional paths merge here; distinguish by whether synthetic minds count.

  **LEAF 7: Summative Gradedism**
  *   **Status:** Unnamed (Utilitarian aggregation).
  *   **Awkward Commitment:** You must accept that one human with high capacity could outweigh thousands of insects with low capacity.
  *   **Aggregation Note:** Maximize total "consciousness-mass"; high-capacity animals dominate cost-effectiveness calculations.

  **LEAF 8: Non-Summative Gradedism**
  *   **Status:** Unnamed (Prioritarian/Count-based).
  *   **Awkward Commitment:** You must treat a creature with faint consciousness as equal in rights to one with rich consciousness, provided both are subjects.
  *   **Aggregation Note:** Count heads, not capacity; interventions helping many low-capacity animals may outweigh helping few high-capacity ones.

  **LEAF 9: Biological Partialism**
  *   **Status:** Unoccupied.
  *   **Reason:** Incoherent; biological naturalism typically ties consciousness to the whole evolved organism, not detachable parts.
  *   **Aggregation Note:** N/A.

  **LEAF 10: Functional Super-organismalism**
  *   **Status:** Unexplored.
  *   **Reason:** Attractive but rarely defended; functionalists usually focus on individual cognitive architecture.
  *   **Aggregation Note:** If defended, treat hives as single high-capacity agents for welfare calculations.

  **LEAF 11: Panpsychism**
  *   **Status:** Named Position.
  *   **Path:** (Requires modifying Node 2 to allow "Everything has some").
  *   **Awkward Commitment:** You must accept that a rock has a trivial degree of experience, complicating all moral trade-offs.
  *   **Aggregation Note:** Aggregation becomes impossible; focus on relative complexity rather than presence/absence.

  **LEAF 12: Illusionism**
  *   **Status:** Named Position.
  *   **Path:** (Requires modifying Node 1 to "Consciousness is a false concept").
  *   **Awkward Commitment:** You must deny the reality of your own experience while acting as if it matters.
  *   **Aggregation Note:** Welfare is a useful fiction; optimize for preference satisfaction regardless of experience.

  **LEAF 13: Biological Scalarism**
  *   **Status:** Unnamed.
  *   **Path:** (Node 3A → Node 4 → Node 6).
  *   **Awkward Commitment:** You must rank species on a single ladder of worth, implying some are "more alive" than others.
  *   **Aggregation Note:** Weight interventions by the species' position on the evolutionary/complexity scale.

  **LEAF 14: Functional Scalarism**
  *   **Status:** Unnamed.
  *   **Path:** (Node 3B → Node 4 → Node 6).
  *   **Awkward Commitment:** You must accept that a sufficiently complex software program could be "more conscious" than a human.
  *   **Aggregation Note:** Weight interventions by information processing depth, regardless of substrate.

  ***

  ### NOTE ON COLLISIONS AND UNOCCUPIED SPACE
  Several leaves (6, 13, 14) share the same *distribution* verdicts (e.g., "All mammals count") but differ on *mechanism* (Biology vs. Function). Distinguish these in discussion by asking: "Would a perfect simulation of a mouse be conscious?" Leaves 9 and 10 are marked unoccupied/unexplored not because they are logically impossible, but because they lack canonical defenders in the current literature; they represent logical space available for new arguments.
