  7.  (Final thought before generating): Ensure the distinction between "Settled" (what Dennett wrote, how the field generally categorizes the terms) and "Contested" (whether the terms are useful, whether they beg the question) is visually or structurally clear. I will use explicit headers or bolding to mark these registers.

