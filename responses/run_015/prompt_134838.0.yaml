  **The Key**

  1. When judging the switch to agriculture, do you prioritize the daily health and leisure of the average individual over the total population size and cultural complexity the system supports?
      *   Yes (Individual Priority) → Go to 2.
      *   No (Collective Priority) → Go to 5.

  2. Case One: A village around 6000 BCE votes on forgetting grain and going back to full foraging, knowing what we now know, but with the population it actually has by then. Is this feasible without mass starvation?
      *   Yes (The Undo Button works) → Go to 3.
      *   No (The Undo Button fails) → Go to 4.

  3. Case Two: Every generation's move to slightly more farming is locally sensible and slightly raises how many people the land supports, so the option of going back shrinks a little each time, until foraging isn't on the table any more. Does this describe the transition?
      *   Yes → **Leaf A (The Evolutionary Ratchet)**
      *   No → **Leaf B (The Great Blunder)**

  4. If the Undo Button fails, was this primarily because wild resources vanished due to climate change, or because human numbers exceeded what wild land could support?
      *   Climate/Resources → **Leaf C (The Environmental Push)**
      *   Population Pressure → **Leaf D (The Demographic Trap)**

  5. (From Collective Priority). Does the existence of modern medicine, art, and science justify the suffering of the first 5,000 years of farmers?
      *   Yes (Ends justify means) → Go to 6.
      *   No (Suffering is not a ledger) → Go to 7.

  6. Would these benefits (medicine, art, science) have arisen inevitably without farming, or only through the surplus farming created?
      *   Inevitably → **Leaf E (The Contingent Civilization)**
      *   Only through surplus → **Leaf F (The Necessary Evil)**

  7. Is the primary harm found in the biological act of growing grain and keeping animals, or in the political ability to store and tax surplus?
      *   Biological (Grain/Animals) → **Leaf G (The Biological Mismatch)**
      *   Political (Surplus/Tax) → Go to 8.

  8. If the harm is political surplus, is the comparison between "forager" and "farmer" illegitimate because early farmers were often forced into the system by states rather than choosing it?
