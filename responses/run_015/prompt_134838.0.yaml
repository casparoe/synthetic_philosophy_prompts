          *   Intended harm → **Leaf I (The Predatory State)**
          *   Side effect → **Leaf J (The Administrative Burden)**

  **The Leaves: Positions and Awkward Commitments**

  *   **Leaf A (The Evolutionary Ratchet):** The switch was a series of rational short-term choices that created a long-term trap.
      *   *Awkward Commitment:* Must accept that human rationality is capable of systematically engineering its own misery without anyone noticing.
  *   **Leaf B (The Great Blunder):** The switch was a genuine mistake that could have been avoided if people had thought clearly.
      *   *Awkward Commitment:* Must explain why no group ever successfully reverted to foraging if it was so obviously better.
  *   **Leaf C (The Environmental Push):** The switch was forced by external climate shifts; humans had no agency.
      *   *Awkward Commitment:* Must argue that agriculture appeared simultaneously globally due to climate, ignoring local variations.
  *   **Leaf D (The Demographic Trap):** The switch was forced by population growth; foraging could no longer feed the group.
      *   *Awkward Commitment:* Must accept that humans "overpopulated" their environment before having the technology to intensify food production.
  *   **Leaf E (The Contingent Civilization):** Farming was bad, but civilization would have happened anyway via other means.
      *   *Awkward Commitment:* Must provide a plausible historical model for cities and writing without storable grain surplus.
  *   **Leaf F (The Necessary Evil):** Farming was bad for early individuals, but essential for the species' current success.
      *   *Awkward Commitment:* Must be willing to tell an early farmer dying of infection that their suffering was worth it for your smartphone.
  *   **Leaf G (The Biological Mismatch):** The harm comes from wheat and cows, not kings; our bodies aren't adapted to farm life.
      *   *Awkward Commitment:* Must argue that a free farmer without a state is still worse off than a forager, blaming the plow not the tax.
  *   **Leaf H (The Illegitimate Comparison):** The terms "forager" and "farmer" are too unstable to compare; the question is nonsense.
      *   *Awkward Commitment:* Cannot consistently claim agriculture was a "mistake" if the comparison required to judge it is invalid.
  *   **Leaf I (The Predatory State):** The harm comes from surplus taxation, imposed by elites to exploit farmers.
      *   *Awkward Commitment:* Must assume early states were capable of sophisticated coercion before having writing or standing armies.
  *   **Leaf J (The Administrative Burden):** The harm comes from surplus management, which created hierarchy as an unintended side effect.
      *   *Awkward Commitment:* Must argue that hierarchy is inevitable once you store food, removing moral blame from specific actors.

  **Analysis of Logical Space**

  **Empty Cells**
  There are two logically incoherent combinations that this key prevents from forming:
  1.  **The Forced Blunder:** You cannot land in *Leaf B (The Great Blunder)* if you answer *No* to Question 2 (The Undo Button). If the vote to return results in starvation, it was not a mistake to stay; it was a necessity. This cell is empty because "choice" and "force" are mutually exclusive in this context.
  2.  **The Invalid Verdict:** You cannot land in *Leaf H (The Illegitimate Comparison)* and maintain a "Strong Verdict" that it was the "Worst Mistake." If the comparison is illegitimate (Q8=Yes), you cannot pronounce a verdict. This cell is empty because it is performatively contradictory.

  **Indistinguishable Leaves**
  Two pairs of leaves are difficult to separate in practice, though logically distinct:
  1.  **Leaf I (Predatory State) vs. Leaf J (Administrative Burden):** Both locate the harm in surplus/state rather than subsistence. The distinction relies on *intent* (malice vs. bureaucracy), which is nearly impossible to determine archaeologically. A respondent might agree with the mechanism but refuse to answer the intent question.
  2.  **Leaf E (Contingent Civilization) vs. Leaf F (Necessary Evil):** Both agree that modern benefits justify or outweigh the costs. The split relies on a counterfactual historical claim (could we have had medicine without wheat?) that is speculative. Most respondents will conflate "it happened this way" with "it had to happen this way."

  **Notes on the Package Split**
  Question 7 enforces the package split you requested. It separates those who blame the *biology* of farming (Leaf G) from those who blame the *politics* of farming (Leaves H, I, J). This ensures that a respondent who loves gardening but hates taxation does not end up in the same bucket as a respondent who thinks wheat itself is poisonous.

  **Notes on the Cases**
  *   **The Undo Button (Q2):** This filters for agency. If the button doesn't work, the "Mistake" narrative collapses into a "Trap" narrative (Leaves C & D).
  *   **The Ratchet (Q3):** This filters for mechanism. If the button works, did they walk into the trap blindly (Leaf B) or were they locked in step-by-step (Leaf A)? This separates the "Diamond" view (Blunder) from the "Bellwood/Flannery" view (Ratchet).
