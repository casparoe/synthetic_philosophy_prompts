          3.  Analyze the metaphor (Direction of Fit).
          4.  Propose the path forward (Split the question + New Examples).
      *   *Key Philosophical Concepts to Weave In:* Direction of Fit, Doxastic Voluntarism, Pragmatism, Evidentialism.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to paint Clifford as a robot. He cares about *ethics*, not just data. His point is that believing without evidence makes you a careless citizen.
      *   *Correction:* Make sure not to paint James as a "wishful thinker." He has strict criteria (Living, Forced, Momentous).
      *   *Emphasis:* Highlight that the "Ship" example is actually James's favorite target, which is why the debate is stuck. They are fighting over the *same example* but seeing different *stakes*.
      *   *Actionable Advice:* Give the debate club a specific motion or framing device to try next week.

  8.  **Final Polish:** Check against the user's specific questions.
