      *   *Hypothesis 2 (Order of Explanation/Reduction):* This is the crux. FA accounts are typically motivated by a desire to reduce the evaluative to the normative (reasons). But to define the "right kind" of reason without circularity (i.e., without saying "a reason that appeals to the value") is notoriously difficult. If you allow evaluative terms in the filter, you lose the reduction. If you don't, you can't seem to capture the intuition.
      *   *Hypothesis 3 (Generality):* The user notes this shows up in belief (Pascal's Wager style) and action. This suggests the problem is structural to the "Reasons-First" or "Attitude-First" methodology, not specific to value theory.

