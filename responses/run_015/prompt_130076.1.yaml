      *   What both miss: The role of population structure (spatial/network) which is distinct from both simple iteration and global ecological pools, and the fact that multiple mechanisms often act simultaneously (mechanism pluralism). Also, the specific boundary conditions of discount rates vs. ecological turnover rates.

