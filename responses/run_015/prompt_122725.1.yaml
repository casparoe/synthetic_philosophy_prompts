  **JOINT MEMORANDUM TO THE BOARD OF TRUSTEES**
  **SUBJECT:** Interpretation of Mission Language ("Western Values")
  **FROM:** [Trustee A] and [Trustee B]
  **DATE:** October 26, 2023

  **1. AGREED CLAIMS**

  We have collaborated to isolate where we disagree and where we do not. The following claims are accepted by both sides.

  1.  **Usage:** In our foundation's history, the phrase "Western values" has functioned both to identify specific commitments (e.g., individual liberty, rule of law) and to signal membership in a specific cultural tradition. **[Concession]**
  2.  **Decision Impact:** The choice to keep, list, or strike the phrase will alter our grantmaking eligibility criteria, regardless of which interpretation is correct. **[Load-bearing]**
  3.  **Category Clarification:** We acknowledge that the "Thick" and "Functional" readings are not strictly mutually exclusive truths. A phrase can have genuine content *and* function as a boundary marker. Our disagreement is not about whether both mechanisms exist, but about which mechanism should govern our legal and operational decisions today. **[Load-bearing]**
  4.  **Historical Uncertainty:** We cannot recover the precise intent of the founder (early 1960s) with certainty. While the Cold War context suggests specific geopolitical alignments, we flag this as an assumption rather than a proven fact. **[Calibration Note]**
  5.  **Non-Probative Considerations:** The personal comfort of current trustees with the phrase is not evidence of its legal or moral utility. Likewise, external criticism alone does not prove the phrase is empty. **[Concession]**

  **2. DISAGREEMENTS TABLE**

  | Claim | Neutral Wording | Thick Reading (Trustee A) | Functional Reading (Trustee B) |
  | :--- | :--- | :--- | :--- |
  | **Source of Authority** | Where does the phrase derive its force? | From the historical reality of the inheritance it names. | From the social act of drawing a boundary against outsiders. |
  | **Risk of Revision** | What happens if we replace the phrase with a list? | We lose the connection to the unwritten tradition that sustains the list. | We gain clarity and remove the ability to exclude arbitrarily. |
  | **Definition Method** | How are the values identified? | By studying the tradition itself to find what is there. | By observing who is funded to see what is allowed. |

  **3. CRUXES AND TESTS**

  We propose four empirical tests to resolve these disagreements. Below are our predictions and the conditions under which we would change our minds.

  **A. The Substitution Test**
  *Method:* Take sentences from past reports containing the phrase. Substitute the most charitable explicit list of commitments. Assess if force, warmth, or authority is lost.
  *   **Thick Prediction:** The sentence will feel weaker or colder. The residue is the implied weight of history. **[Confidence: 80%]**
  *   **Functional Prediction:** The sentence will feel clearer with no loss of authority. The residue is merely exclusionary signaling. **[Confidence: 80%]**
  *   **Falsification:**
      *   *Thick:* If the substituted list commands *more* respect than the original phrase.
      *   *Functional:* If the original phrase is consistently preferred even when the list is identical in meaning.

  **B. The Defection Test**
  *Method:* List entities described in our materials as having "betrayed" these values over seven decades. Check if this list tracks specific commitments or other factors (alliance, trade, religion).
  *   **Thick Prediction:** The list will track consistent philosophical breaches (e.g., censorship, tyranny) regardless of alliance. **[Confidence: 60%]**
  *   **Functional Prediction:** The list will track geopolitical adversaries or cultural outsiders, shifting as alliances shift. **[Confidence: 70%]**
  *   **Falsification:**
      *   *Thick:* If we funded allies who violated the commitments while denying enemies who upheld them.
      *   *Functional:* If we denied allies who violated commitments solely based on shared heritage.

  **C. The Audience Flip**
  *Method:* Compare passages addressed to domestic audiences vs. audiences abroad. Record if commitments are presented as universal or particular.
  *   **Thick Prediction:** Any variation is incidental; the values are presented as universally binding truths. **[Confidence: 50%]**
  *   **Functional Prediction:** Variation is systematic; universal language at home, particular inheritance language abroad. **[Confidence: 75%]**
  *   **Falsification:**
      *   *Thick:* If documents explicitly tell foreign audiences these values do not apply to them.
      *   *Functional:* If domestic documents consistently frame the values as universal human truths without qualification.

  **D. The Invocation Curve**
  *Method:* Code grant letters and minutes (1960–present) for frequency of the phrase. Check if invocations cluster during internal disagreement or external pressure.
  *   **Thick Prediction:** Invocations cluster during external pressure on the values themselves (e.g., rise of authoritarianism). **[Confidence: 40%]**
  *   **Functional Prediction:** Invocations cluster during internal board disagreement about grantmaking eligibility. **[Confidence: 65%]**
  *   **Falsification:**
      *   *Thick:* If usage spikes primarily when board members disagree on specific grants.
      *   *Functional:* If usage remains steady during internal conflict but spikes during external cultural shifts.

  **4. CALIBRATION AND NEXT STEPS**

  We flag that the **Invocation Curve** is the least reliable indicator, as record-keeping practices have changed over sixty years. **[Confidence: Low]**. The **Defection Test** is the most load-bearing for the Functional reading; if the list of "defectors" tracks philosophical consistency rather than geopolitical convenience, the Functional reading loses its primary justification. **[Confidence: High]**.

  Regarding the category mistake noted in Claim 3: If the tests show a mixed result (real content *plus* boundary signaling), the Thick reading prioritizes the content for preservation, while the Functional reading prioritizes the boundary for elimination. We recommend the Board treat the **Defection Test** as the primary tiebreaker. If the foundation has historically excluded partners who shared the values but lacked the heritage, the phrase is functioning primarily as a boundary, and we should strike it.

  We request the Board authorize a staff review of archives to run these tests by November 15.

  **[Signed]**
  **[Trustee A]**
  **[Trustee B]**
