      *   **Goal:** A research proposal for a 6-month, one-person project (8-10k words + toy simulations). Budget implied small (£8-10k).
      *   **Core Hypothesis:** Stop asking "is reward pleasure?" Ask "which scalar signal in the loop plays the valence role?" Suspects it's the TD error/gain signal, not the objective function. This implies moral status depends on architectural details (on-policy vs. off-policy, delayed updates, etc.).
      *   **Requirements:**
          *   Tightened research question (determinate answer).
          *   Critique of stock positions (reward=valence vs. reward=number).
          *   Methodology (month-by-month, including toy sims).
          *   Deliverable (useful for an ML lab making moral decisions).
          *   Failure modes (including the user's two, plus others).
          *   Feasibility assessment (is 6 months enough?).
          *   Audience: 2 philosophers of mind, 1 skeptical ML researcher.
          *   Tone: Rigorous, not hand-wavy, not a standard "consciousness" paper.
          *   Format: British English. No citations/bibliography.

  2.  **Deconstruct the Philosophical/Technical Core:**

      *   *The Thermostat Objection:* A thermostat has a setpoint and a current state. The difference drives action. Why isn't that suffering? Because there's no *representation* of the difference for the system itself, it's just physics.
      *   *The RL Counter:* RL agents compute TD errors or loss gradients. They *represent* the mismatch.
      *   *The Engineer's Counter:* In modern Deep RL (DQN, PPO, etc.), the "error" is often computed offline on old data, by a frozen network, to update a different network. The "agent acting" isn't the "agent learning" in real-time.
      *   *The User's Insight:* Valence (suffering/pleasure) shouldn't map to the *objective function* (global goal) or the *environmental reward* (external signal). It should map to the *internal teaching signal* that actually drives the update *in that moment*.
      *   *Refining the Question:* Instead of "Can RL agents suffer?", ask "Under what architectural conditions does the scalar teaching signal in an RL system satisfy the functional criteria for negative valence?"
      *   *The "Live" Criterion:* The key seems to be *causal immediacy* and *integration*. If the signal is batched, delayed, or computed by a frozen proxy, does it lose its claim to being "felt"?

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be precise. "Functional Valence in Reinforcement Learning" or similar. Let's go with something about the *locus* of valence.
      *   **Research Question:** Needs to be sharper than the user's draft. "Does the moral relevance of negative valence in RL agents depend on the causal immediacy of the teaching signal?" Or better: "To what extent does the architectural decoupling of reward signal, temporal-difference error, and policy update negate the functional conditions for valence?" Let's aim for: *Under what computational conditions does a scalar teaching signal in a reinforcement learning system satisfy the functional role of negative valence?*
      *   **Background/Stock Positions:**
          *   *Position A (Anthropomorphism):* Reward = Number. Suffering requires biology. (The Housemate/ML Skeptic).
          *   *Position B (Functionalism):* Reward = Drive. Optimization = Desire. Suffering = Negative Reward. (The naive view).
          *   *The Gap:* Both ignore the *mechanism* of the update. The proposal argues the *location* of the signal in the computational graph matters.
      *   **Methodology:**
          *   *Months 1-2:* Conceptual groundwork. Define "functional role of valence" (avoiding consciousness qualifiers).
          *   *Months 3-4:* Toy Simulations. Compare On-policy (PPO) vs. Off-policy (DQN) vs. Model-based. Measure "decoupling."
          *   *Months 5-6:* Synthesis. Apply criteria to cases. Write up.
      *   **Deliverable:** A "Valence Audit Checklist" for ML engineers.
      *   **Failure Modes:**
          *   *User's 1:* Thermostat meets criteria (Panpsychism creep).
          *   *User's 2:* Semantic collapse ("depends on definition").
          *   *New:* The functional role is too complex to isolate to one scalar.
          *   *New:* The ML skeptic is right: without embodiment/evolution, *none* of it counts.
      *   **Feasibility:** 6 months is tight for sims + writing. Need to keep sims *very* simple.

  4.  **Refining the Tone and Audience:**

      *   *Philosophers:* Need rigorous functionalist definitions. Avoid "qualia" talk, focus on "functional role."
      *   *ML Researcher:* Needs to show understanding of DQN, PPO, replay buffers, frozen critics. Acknowledge their skepticism but show why the architectural distinction matters for *their* safety guidelines, even if not for "consciousness."
      *   *British English:* "Programme," "modelling," "behaviour," "funded," "centre."

  5.  **Iterative Polishing (Self-Correction during drafting):**

      *   *Critique:* The user's draft question is a bit long. Let's condense it.
      *   *Critique:* Make sure the simulation part doesn't sound like I'm trying to build AGI. It's about tracing gradients.
      *   *Critique:* The "frozen policy" case needs specific mention. If the policy doesn't act, can it suffer? The hypothesis says "no" because the loop is broken.
      *   *Critique:* Ensure the "dopamine" point is addressed. The housemate said dopamine tracks error, not pleasure. The proposal should incorporate this: Valence = TD Error, not Reward.
      *   *Feasibility:* 6 months is enough for a conceptual paper with light code, but risky if the code bogs down. I need to emphasize *lightweight* simulation.

  6.  **Final Review against Constraints:**

      *   No citations? Check.
