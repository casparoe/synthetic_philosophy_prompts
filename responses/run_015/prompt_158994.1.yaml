  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Title:* The Locus of Valence in Reinforcement Learning Architectures.
      *   *Question:* Does the functional role of negative valence require the teaching signal to be causally immediate to the policy it updates?
