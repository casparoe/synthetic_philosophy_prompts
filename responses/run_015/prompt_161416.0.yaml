  You're a professional philosopher who works on personal identity and the ethics of medicine — take this seriously, brainstorm two or three possible readings before you commit to one, and don't just tell me what everyone already says about advance directives.

  I'm writing a short conference paper on advance directives and I want to hang it on Eternal Sunshine of the Spotless Mind. Recap in case its been a while: Joel discovers his ex Clementine had him erased from her memory by Lacuna, so in a miserable night he signs up to have her erased too; the procedure runs while he sleeps, and partway through he changes his mind and starts hiding her inside memories she doesn't belong in — his childhood, the beach house — while the technicians chase him around inside his own head. Afterwards they both get the tapes, hear how badly it went the first time, and start over anyway.

  The part I actually want you to work on is a twist on the film, not something in it. Suppose Lacuna had Joel sign a second form at the same time as the first, saying that if he objects during the procedure the objection is to be disregarded, because the person objecting is not really him yet. Two things I need: (1) is a clause like that morally different in kind from the ordinary advance-directive case — someone who refused treatment years ago and now has dementia, seems contented, and would resist if you tried to carry the refusal out — or is it the same structure with the timing squashed together? (2) does Joel's resistance mid-procedure count as revoking anything at all, given that the resister is being rewritten while he speaks, or does that scene make the question of who is speaking incoherent in a way the advance-directive debate normally doesn't have to deal with?

  Then the ending: they get the full story back and go at it again. What does that do to a view that grants the earlier self authority precisely because it remembers what the later self has lost? If the earlier self's edge is information, this film seems built to take that edge away — tell me whether that's a real objection to the view or just an artifact of the case.

  In American English, no citations and no bibliography, I don't want any — just the argument, plainly, plus an honest note on where the film dosen't actually fit the framework and where you're forcing it.
