  ### Working Notes: Preliminary Readings

  Before settling on the argument below, I considered three ways to frame the Lacuna clause.

  1.  **The Metaphysical Discontinuity Reading:** This view holds that the clause is valid because the procedure literally creates a new person. If Mid-Procedure Joel is not Pre-Procedure Joel, the former has no standing to object. *Rejection:* This is too strong. Psychological continuity is gradual, not binary. The film shows Joel fighting to preserve connections, proving he is still sufficiently "Joel" to have moral standing.
  2.  **The Paternalistic Protection Reading:** This treats the clause like a standard Ulysses contract. Past Joel knows Future Joel will be weak-willed or irrational due to the chemical influence of the procedure. *Rejection:* This ignores the specific nature of the transformation. It isn't just weakness; it's a fundamental shift in values driven by memory loss. Standard paternalism assumes the patient's true interests are static; the film suggests interests change with memory.
  3.  **The Epistemic Authority Reading (Selected):** This view argues that advance directives are justified because the past self possesses information the future self lacks. The film's ending destabilizes this. If the information can be restored and the choice reversed, the authority of the past self was never about knowledge, but about power. This is the most fertile ground for the paper.

  ***

  ### The Sovereignty of the Past: Advance Directives and the Lacuna Clause

  The standard defense of the advance directive rests on a presumption of continuity coupled with a recognition of incapacity. We honor the refusal of treatment signed years ago because we believe the person signing it is the same person refusing it now, but we recognize that the current iteration lacks the capacity to understand the consequences due to dementia or coma. The Lacuna twist proposes a radical compression of this timeline. By signing a clause that disregards objections made *during* the procedure on the grounds that the objector is "not really him yet," the client attempts to legally enforce a metaphysical claim. This raises two distinct problems: the moral status of the clause itself, and the coherence of the resistance offered during the procedure.

  First, we must determine if this clause is morally distinct from the standard dementia case, or merely a matter of timing. In the standard medical case, the incompetence is a medical fact independent of the directive. The patient loses capacity due to pathology; the directive simply records how to handle that inevitable loss. The Lacuna clause is different in kind because it attempts to *constitute* the incompetence by fiat. It asserts that the moment the procedure begins, the moral authority of the subject diminishes in proportion to the memory loss, regardless of their current ability to reason.

  This is not just timing squashed together; it is a transfer of sovereignty. In the dementia case, authority shifts because the agent is gone. In the Lacuna case, authority is stripped because the past self demands it. This creates a moral hazard absent in standard medicine. It allows the past self to treat the future self as a subordinate entity rather than a successor. If we accept this clause, we accept that a person can contract away the moral standing of their future iterations based on a predicted change in values. This is fundamentally different from planning for a loss of capacity; it is planning for a loss of *selfhood*, and enforcing that loss against the will of the remaining consciousness.

  Second, does Joel's mid-procedure resistance count as a valid revocation? Skeptics might argue that because his brain is being rewritten while he speaks, the "who" is incoherent. If the neural substrates of his decision-making are being deleted in real-time, can the objection be trusted? I argue that the scene does not make the speaker incoherent; rather, it makes the conflict visible in a way the dementia case does not. In dementia, the patient often cannot articulate why they are content despite refusing treatment. Joel can. He argues that the pain is part of who he is.

  His resistance counts as revocation because it demonstrates that psychological continuity is not solely dependent on the specific memories being erased. He retains enough narrative structure to value the whole over the parts. To disregard this is to claim that only the Pre-Procedure Joel has the correct valuation of Joel's life. But the procedure itself proves that valuation is dependent on memory. If the memory goes, the reason for the erasure goes. Therefore, the mid-procedure objection is not the rambling of a dissolving mind, but the rational defense of a changing value system. It should count as revocation because it is the only voice currently inhabiting the body.

  Finally, we must address the ending. Joel and Clementine receive the tapes, learn the truth, and choose to begin the relationship again despite knowing the pain it will cause. This devastates the view that grants the earlier self authority precisely because it remembers what the later self has lost. The standard epistemic argument suggests the past self is the better guardian of interests because it possesses information the impaired future self lacks. But here, the information is restored. The "impaired" selves (post-erasure) are given the data back. And with full information, they choose the path of pain over the path of oblivion.

  This suggests the earlier self's edge was not information, but ignorance. Pre-Procedure Joel wanted the erasure because he could not imagine living with the pain. He lacked the information of his own resilience. When the film restores that information, the authority of the advance directive collapses. If the justification for overriding a patient's current wishes is that they are ignorant due to impairment, but restoring that knowledge leads them to contradict the directive, then the directive was based on a false prediction of utility. The film argues that the earlier self does not know better; it only knows *differently*, and often worse. The authority of the past self cannot rest on epistemic advantage if that advantage is merely the inability to foresee future coping mechanisms.

  Therefore, the Lacuna clause fails on all counts. It is a sovereign overreach by the past self, it ignores the coherent values of the present self, and it relies on an epistemic advantage that the restoration of memory proves was illusory.

  ***

  ### Honest Note on Framework and Fit

  I need to acknowledge where I am forcing the film to fit the medical ethics framework. The primary friction is that memory erasure in the film is elective and cosmetic, whereas advance directives in medicine usually concern life-saving or life-sustaining treatment. The stakes are not equivalent. In medicine, ignoring an advance directive might mean prolonging suffering or ending a life; in the film, it means preserving emotional pain.

  Furthermore, the film treats memory loss as reversible (via the tapes), whereas dementia is not. This makes the "epistemic advantage" argument easier to dismantle in the film than in reality. In a real clinical setting, we cannot simply "play the tapes" to restore a dementia patient's competency to see if they would still refuse treatment. I am using the sci-fi reversibility to make a philosophical point about the nature of authority that might not translate cleanly to irreversible neurological decline.

  Finally, I am treating Mid-Procedure Joel as more competent than the film might strictly allow. He is hallucinating and navigating a dreamscape. While I argue his values are coherent, a strict medical evaluation might deem him incapacitated due to the chemical sedation required for the procedure. I am setting that aside to focus on the philosophical identity question, but in a real hospital, the sedation alone would invalidate his mid-procedure objections regardless of the memory loss.
