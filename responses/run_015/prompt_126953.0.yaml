answer: |-
  The step you must reject is **(3)**.

  ### Why (3) Looked Harmless
  Premise (3) assumes what we might call the **Causal Pie Chart Model** of motivation. It treats the explanation of an action as a fixed quantity of "causal work" that must be distributed among competing motives. On this model, if non-moral desire does *some* of the work, the moral motive must do *less* of the work. Consequently, moral worth—which tracks the work done by the moral motive—must vary inversely with the assistance provided by desire.

  This looks harmless because it mirrors our intuition about overdetermination. If two people lift a table, neither gets full credit for lifting it. If I tell the truth because I fear lying *and* because it is right, it seems the fear is "sharing the credit." It feels like a rigorous way to cash out the "because" in (1).

  ### Why (3) Is False
  (3) is false because it treats the virtuous agent's desires as **independent causal rivals** to the moral motive, rather than as **constitutive expressions** of it.

  In the fully virtuous agent, the non-moral desire (e.g., sympathy for a victim) is not a separate force pushing in the same direction as duty; it is the sensory or emotional shape that the agent's grasp of the right *takes*. The desire does not compete with the reason; it manifests it. To say the desire "occupies space" in the explanation is a category mistake. The desire is present *in virtue of* the agent recognizing the right-making facts. Therefore, the presence of the desire does not dilute the explanatory power of the right-making fact; it confirms that the agent perceives the right-making fact vividly.

  Rejecting (3) stops the slide to (5). It allows you to maintain that the virtuous agent's action has full moral worth, even though it is aided by desire, because the aid is not an independent cause.

  ### The Cost: What You Lose
  By rejecting (3), you lose the **Effort Metric**. You can no longer measure moral worth by calculating how much the agent had to overcome. You lose the comforting idea that struggle is a proxy for purity. This means you cannot tell a story where the struggling continent person is *morally superior* to the virtuous person, merely because the struggle proves the motive was present. The struggle proves the motive was *effective against resistance*, but it does not prove the motive was *more dominant* than in the virtuous agent, whose desires were already aligned.

  ### The Replacement Test
  You are willing to give up the Detachment Condition in (2) ("Would you do it if desires didn't favor it?") because it penalizes the virtuous agent who *cannot* imagine the right not favoring desire. You need a test that distinguishes acting *because it is right* from acting *because of a desire that happens to align*, without requiring the agent to be able to act without the desire.

  Replace the Detachment Condition with the **Governance Condition**:

  > **The Governance Test:** An agent acts *because it is right* if and only if their commitment to the right is the **authoritative ground** of their will. This is settled by a **Subordination Counterfactual**: If the non-moral desire had conflicted with the right, would the agent have suppressed the desire?

  This test does not require the desire to be detachable. It requires the desire to be **subordinate**.
  *   **The Virtuous Agent:** Passes. Her desires don't conflict, but they are structured by her commitment to the right. If they *did* conflict, the right would win.
  *   **The Merely Sympathetic Agent:** Fails (or is indeterminate). If sympathy conflicted with duty (e.g., helping a stranger vs. a friend), would sympathy yield? If not, she isn't acting *because it is right*.

  ### Distinguishing Independent vs. Constituted Desires
  You asked for a condition that distinguishes an accompanying desire that is a "second, independent route" from one that is "merely the shape a person's grasp of the right takes."

  Use the **Independence Counterfactual**:
  > **Would this desire motivate the action if the agent did not believe it was right?**

  *   **Constituted Desire (Virtuous Agent):** No. Her sympathy arises *from* her perception of the suffering as bad (which is why helping is right). If she didn't think helping was right (i.e., if she didn't perceive the suffering as morally significant), she wouldn't feel the sympathy. The desire is transparent to the moral reason.
  *   **Independent Desire (Worth-Seeker / Paramedic):** Yes. The desire exists regardless of the specific rightness of the act.

  ### Applying the Diagnosis to Your Three Cases

  **1. The Worth-Seeker**
  *   **Diagnosis:** Her desire for "moral worth" is an **independent route**.
  *   **Application:** Apply the Independence Counterfactual. Would she want to feel morally worthy if the action *wasn't* right? Presumably, yes (she wants the feeling of worth). This desire treats morality as a commodity to be consumed. It competes with the right because it makes the rightness a *means* to self-satisfaction.
  *   **Verdict:** Her action has diminished moral worth. Not because she has a desire, but because the desire reveals that the "right" is not the sole authoritative ground; it is sharing authority with her ego. Your friend is wrong; the enjoyment isn't a blemish, it's a structural defect in the maxim.

  **2. The Depleted Helper**
  *   **Diagnosis:** Her lack of desire is not an achievement; it is a loss of aid.
  *   **Application:** Apply the Governance Test. Does duty govern? Yes. Does the absence of sympathy make it *more* governed? No. It just means she is acting without the constitutive aid that virtue provides.
  *   **Verdict:** Her action has full moral worth (duty is governing), but it is not *more* worthy than the virtuous agent's. The struggle confirms the governance of duty, but the virtuous agent's harmony confirms it too. You are right to reject the idea that exhaustion adds credit. The credit goes to the will's commitment, not the friction it encounters.

  **3. The Paramedic with a Standing Policy**
  *   **Diagnosis:** This is the hardest case, but the Governance Test exposes a flaw in her **maxim**, not just her attendance.
  *   **Application:** She acts because it is right *and* she loves the work. But her policy is: "I will do the right thing *only if* I love the work." Apply the Subordination Counterfactual. If the love faded, would she still do the right thing? Her policy says no. Therefore, the "right" is not the authoritative ground; it is a *conditional* ground.
  *   **Verdict:** You said, "what explains her failing is a fact about why she shows up, not a defect in her will on the occasions when she does act." This is incorrect under the Governance view. Moral worth attaches to the **maxim** (the principle of volition), not merely the isolated physical movement. If her maxim is conditional on her enjoyment, then on every occasion she acts, she is acting on a conditional maxim. She is not acting *because it is right* simpliciter; she is acting *because it is right-and-enjoyable*.
  *   **Cost:** She fails the test for full moral worth. Not because she enjoys the work, but because she has made that enjoyment a **necessary condition** for her compliance with duty. This distinguishes her from the virtuous agent, who enjoys the work but would do it anyway.

  ### Summary
  By rejecting (3), you preserve the intuition that virtue is the ideal. You pay the price of losing a simple quantitative metric for worth. In exchange, you gain a qualitative distinction: Moral worth is not about how much of the causal load the moral motive carries (the Pie Chart); it is about whether the moral motive holds **veto power** over all other motives (Governance). This allows you to credit the virtuous agent's harmony without penalizing her for lacking struggle, while still condemning the Worth-Seeker and the Paramedic for allowing independent desires to share authority with the right.
