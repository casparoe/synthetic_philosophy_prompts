prompt: |-
  You are an expert philosopher of artificial intelligence and an experienced examiner for upper-level undergraduate seminars. Think carefully, and begin by brainstorming the precise crux the question should target before you draft anything. I am writing the final exam for my seminar on Turing and the philosophy of artificial intelligence, and I need one 90-minute essay question on Turing's discussion of extrasensory perception in his classic 1950 imitation-game paper. The question must go beyond asking students to summarize Turing's reply to the ESP objection—for example, his suggestion that the machine be placed in a room shielded against telepathic influence. Instead, it must force them to test that reply against a novel variant I will call the Laundered-Telepathy Imitation Game. In this variant, the machine is placed in a room shielded against telepathic influence, exactly as Turing proposes, but the machine is also connected by an ordinary, non-telepathic data link, such as a telephone line, to a human accomplice outside the room. The accomplice is a genuine telepath who can read the interrogator's or the human contestant's mind and then passes that information to the machine over the ordinary link, so the machine's answers can be based on telepathically obtained information even though the machine itself is shielded and has no ESP. The exam question should ask students to assess whether Turing's shielding reply survives this variant, and what the variant reveals about what the imitation game is really testing—for instance, whether it tests intelligent behavior, the causal history of the answers, or something else. Then provide: (1) the exam question itself, written as it would appear to students; (2) a model answer of about 700 words that a strong student could write in 90 minutes; and (3) a marking scheme with five must-hit points, each worth 4 marks for a total of 20, plus a one-line note for each point on how candidates typically get it wrong. The exam question must not ask for bibliographies, reading lists, or citations, and it must be fully answerable by a student working from memory in a closed-book setting with no online access. Do not use any verbatim quotations from Turing or any other text; paraphrase any textual references instead.
