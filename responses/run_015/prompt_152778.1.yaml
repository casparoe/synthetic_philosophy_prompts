answer: |-
  **Case Study: The Pluto Reclassification as Metaontological Episode**

  **1. The Apparatus of Verbal Dispute**

  To map the 2006 episode onto the standard apparatus for verbal disputes, we must isolate the disputed sentence and attempt to construct a topic-neutral paraphrase that reveals the underlying agreement or disagreement.

  The disputed sentence is straightforward: *S* = "Pluto is a planet."
  The parties are the IAU majority (who assert *not-S*) and the Pluto defenders/public (who assert *S*).

  The physical facts are stipulated as agreed upon: Pluto orbits the Sun; Pluto is in hydrostatic equilibrium (round); Pluto has not cleared its orbital neighborhood. Let us call these properties *O*, *R*, and *C* respectively.

  A topic-neutral paraphrase of the disagreement would look like this:
  *Party A (IAU):* "For any x, x is a 'planet' only if x has O, R, and C."
  *Party B (Defenders):* "For any x, x is a 'planet' if x has O and R (and was historically classified as such)."

  Under the standard verbal dispute apparatus, a disagreement is merely verbal if, once the meanings of the terms are disambiguated, the parties agree on all non-linguistic facts. Here, both parties agree on the non-linguistic facts regarding Pluto's mass, orbit, and shape. The disagreement appears to rest entirely on the intension of the term "planet." If we fix the meaning of "planet" to the IAU definition, Party A is trivially correct and Party B is trivially incorrect. If we fix the meaning to the pre-2006 historical usage, the truth values flip.

  Therefore, the conditions for a verbal dispute are ostensibly met. The disagreement collapses into a disagreement about language *provided* we assume that the term "planet" has no mind-independent referent that constrains its definition. However, the apparatus strains here. Usually, verbal disputes dissolve once the ambiguity is highlighted. In this case, highlighting the ambiguity did not dissolve the dispute; it intensified it. The IAU did not say, "We are adopting a new convention for utility"; they presented the resolution as a clarification of what a planet *is*. This suggests that while the dispute is verbal in structure, it functions substantively in practice. The apparatus identifies the *form* of the dispute correctly but fails to capture why the parties refuse to accept the "merely verbal" diagnosis.

  **2. Metaontological Stances and Phenomenology**

  Running the three familiar metaontological stances over the case reveals significant divergences between theoretical prediction and the episode's actual phenomenology (the heat, resentment, and sense of falsification).

  *Ontological Realism* holds that there is a fact of the matter about which kinds exist in nature, independent of human classification.
  *Analysis:* On this view, the IAU and the defenders were arguing about a mind-independent reality. One side was objectively right, and the other wrong.
  *Phenomenological Prediction:* This stance predicts high stakes and genuine heat, as truth is involved. It explains the public's sense of betrayal—they felt told a falsehood about the world.
  *Failure:* Realism cannot account for the mechanism of resolution. Facts about natural kinds are not settled by a show of hands at a general assembly. If "planet" names a real kind, the IAU vote was epistemically irrelevant. Realism renders the IAU's action either a successful discovery (unlikely, given the voting process) or a category error (treating a factual question as legislative). It fails to explain why the scientific community accepts the vote as binding despite the realist commitment to mind-independent facts.

  *The Carnapian Treatment* distinguishes between internal questions (answered within a linguistic framework) and external questions (the pragmatic choice of which framework to adopt).
  *Analysis:* The IAU settled an internal question (does Pluto meet criteria X, Y, Z?) by adopting a new framework. The choice of framework was an external, practical matter based on utility (e.g., distinguishing dominant bodies from debris).
  *Phenomenological Prediction:* This stance predicts that once the framework is adopted, resistance should vanish. The dispute is pragmatic, not truth-apt. Resistance is merely inertia.
  *Failure:* This fails to explain the lasting resentment. If the change were understood as a mere tool swap, like switching from metric to imperial units for specific calculations, the emotional cost would be low. The public and dissenting scientists did not react as if a tool had been swapped; they reacted as if a truth had been revoked. Carnap's framework underestimates the extent to which internal questions are experienced as external truths by those inside the framework.

  *Quantifier Variance* suggests that existence claims are true relative to conceptual schemes, and no scheme is uniquely privileged.
  *Analysis:* "There exists a planet" is true in the pre-2006 scheme and false in the post-2006 scheme. Both are admissible.
  *Phenomenological Prediction:* This stance predicts tolerance. Since both schemes are admissible, there is no need for one to vanquish the other.
  *Failure:* This is the poorest fit for the phenomenology. The IAU did not seek coexistence; they sought standardization. They demanded that textbooks and museums adopt the new scheme exclusively. Quantifier variance cannot explain the drive for conceptual monopoly. The dispute was not about whether both views *could* be true, but about which view *would* be authoritative.

  **3. Concept Anchoring: Exemplars vs. Criteria**

  Your proposed distinction between concepts anchored to exemplars and concepts anchored to criteria does significant work that the standard apparatus obscures.

  A concept anchored to *exemplars* is learned ostensively or by list. For seventy years, "planet" was anchored to a specific set of objects: Mercury through Pluto. The concept was rigidly tied to these instances. A concept anchored to a *criterion* is learned by rule (e.g., "a body that clears its neighborhood").

  The 2006 episode was not merely a change of definition; it was a forced migration from an exemplar-anchored concept to a criterion-anchored concept.
  *   *Pre-2006:* Pluto was a paradigm case. To say "Pluto is not a planet" was akin to saying "A bachelor is married." It violated the anchoring.
  *   *Post-2006:* The IAU attempted to re-anchor the concept to a physical criterion where Pluto is an outlier.

  This distinction explains the specific quality of the resentment. In a standard verbal dispute where both sides use criterion-anchored concepts (e.g., debating whether a stool is a "chair" based on leg count), the friction is low. But when one side relies on exemplar anchoring (Pluto *is* a planet because it is on the list we learned) and the other imposes criterion anchoring (Pluto *is not* a planet because it fails the rule), the dispute is experienced as a severing of a connection to the world.

  Does this distinction do work the existing apparatus cannot? Yes. Standard metalinguistic negotiation theory assumes concepts are fluid and negotiable. The exemplar/criterion distinction explains the *viscosity* of the concept. It explains why the public felt they were being told something false: in an exemplar-anchored system, the extension of the term is fixed by history, not by current properties. The IAU treated the term as if it were criterion-anchored (open to revision based on new data), while the public treated it as exemplar-anchored (fixed by tradition).

  However, is this just metalinguistic negotiation redescribed? It is a specific *mechanism* of metalinguistic negotiation. It adds value by identifying the source of the friction (the clash of anchoring types) rather than just noting that meanings are being negotiated. It predicts that disputes over exemplar-anchored concepts will be more inflammatory than those over criterion-anchored concepts, a nuance the standard verbal dispute apparatus lacks.

  **4. The Silences: Institutional Authority and Cost**

  The theories above are silent on two critical features of the episode: Institutional Authority and Switching Cost.

  *Institutional Authority:* None of the metaontological stances account for the jurisdiction of the IAU. Realism ignores authority (nature doesn't vote). Carnapianism treats framework choice as pragmatic but doesn't explain who has the right to enforce a framework. Quantifier Variance suggests multiple frameworks can coexist, ignoring the sociological reality that scientific terminology requires standardization to function.
  The IAU settled by vote a question it was not obviously competent to settle in a realist sense. This is a gap the episode exposes. Metaontology typically assumes idealized agents negotiating meaning. It does not account for *legislated meaning*. The Pluto case shows that in scientific practice, ontological questions are often settled by governance, not just discovery or pragmatic choice. This is not merely a counterexample; it suggests that metaontology requires a political dimension. There is a question of *who decides* that is prior to the question of *what exists*.

  *Switching Cost:* The cost of rewriting textbooks, relabeling museums, and reconfiguring mission parameters was real. If the dispute were purely verbal in the deflationary sense, the cost of switching languages should be negligible, akin to translating a book. The fact that the cost was high and resisted suggests the concept has "ontological mass."
  Is this evidence against the dispute being verbal? Not necessarily. It is evidence that verbal disputes can have substantive consequences. However, it challenges the deflationist idea that verbal disputes are "nothing but" linguistic. If changing the language requires rebuilding physical infrastructure and alters public trust in science, the distinction between "verbal" and "substantive" begins to blur. The theories are silent on the material weight of language. They treat words as transparent; the Pluto case shows words are load-bearing.

  **5. Impact on Theory**

  Does this episode vindicate the deflationist? No. A deflationist would expect the dispute to evaporate once the linguistic confusion is clarified. The persistence of the disagreement after the vote—and the fact that New Horizons scientists continued to call Pluto a planet not out of confusion but out of principled opposition—shows that the disagreement did not resolve into a simple framework choice.

  Does it show that external questions are constrained by more than pragmatics? Yes. The IAU argued for their definition on grounds of what the properties *support* (scientific utility regarding formation history), not merely convenience. But the public and dissenting scientists argued that the definition violated the *history* of the term. This suggests that "external" questions are constrained by historical continuity and institutional legitimacy, not just pragmatic utility.

  If we are forced to name a third category besides verbal and substantive, it would be **Normative-Classificatory**.
  A verbal dispute is about what words mean.
  A substantive dispute is about what the world is like.
  A Normative-Classificatory dispute is about how we *ought* to organize our conceptual scheme given the world and our history.

  In the Pluto case, the world (Pluto's properties) was agreed upon. The meaning (definition) was the battleground. But the battleground was not just semantics; it was about the authority to govern scientific categories and the preservation of cultural knowledge.

  Admitting this category costs the theory simplicity. It requires metaontology to abandon the idea that it can analyze existence claims in isolation from the sociology of science. It forces the admission that some ontological questions are effectively political questions about the governance of concepts. The Pluto episode demonstrates that when a concept is deeply embedded in culture (exemplar-anchored) and institutional practice (textbooks, missions), changing its criteria is not a linguistic tweak but a normative act with realist consequences. The theory must expand to account for the *authority* required to make a verbal dispute stick, and the *inertia* that resists it. Without this, metaontology remains a description of how idealized philosophers argue, not how scientific communities actually determine what counts as real.
