  DIRECTORATE OF FIXED ACTION PATTERNS
  Standing Committee on Adaptive Risk
  Regulatory Impact Statement #892-B

  Present: Commissioner Mugwump (Chair), Dr. Skeuomorph, Secretary for Innate Release Mechanisms.

  The Committee convened to assess three applications regarding cognitive architecture upgrades. Each item was kicked downstairs to a subcommittee made of creatures at the level below the one being proposed to ensure impartial risk assessment.

  Item 1: Application for Operant Enhancement.
  The Subcommittee on Hardwired Traits reviews the proposal to allow phenotypic plasticity within a single lifetime. The Committee insists that Fixed Action Patterns are already the product of aeons of free R&D. Learning only pays off if the world is stable within a lifetime but not across generations. A learner has to pay for its lessons with its own body, whereas selection pays with ancestors. Lobbyists for the applicant raised the Baldwin-effect loophole, i.e., that behaviour can drag the selective environment around and so let soft inheritance in by the back door. The Committee rejects this as unauthorized genomic editing. Furthermore, a conditioned habit cannot be audited the way an innate routine can.
  Resolved: That operant enhancement be denied due to excessive somatic cost and lack of audit trails for conditioned habits. Minority Dissent: One member noted that survival rates increase significantly with plasticity in volatile environments.

  Item 2: Application for Internal Preselection.
  The Subcommittee on Covert Behavior reviews the proposal to allow pre-testing candidate actions in an inner environment. The Committee objects that covert behavior is unobservable and therefore unregulable. An inner arena gets reinforced by accidents, which will manufacture superstition; per classic findings about pigeons who develop pointless rituals because a reward happened to land once, false associations will proliferate. Members also grumble that calling rigid hardwired behavior sphexish is Gregorian propaganda designed to undermine innate release mechanisms.
  During deliberations, Dr. Skeuomorph stated, out loud and sincerely, the winning argument for the upgrade he was voting against: "Each level is valuable because it shrinks the set of candidates that have to be tested on the actual neck." The Chair ruled this argument out of order as it constitutes advocacy for the applicant.
  Resolved: That internal preselection be denied due to unobservability and high risk of superstition manufacturing.

  Item 3: Application for Word-Tool Installation.
  The Popperian Office of Pre-Testing reviews the proposal to allow brains to be re-tooled from the outside by culturally inherited thinking-tools, words above all. The Committee objects that they reorganise a brain from the outside. Most candidate thoughts are junk, and catchy items out-replicate true ones. A creature equipped with words can be terrified by a danger it has only been told about, can be marched off to die for a slogan, will confabulate free-floating rationales for what it did, will end up believing in belief, and will install a little Cartesian theatre as a user illusion. It will report its own workings so unreliably that the office would need something like heterophenomenology just to process the paperwork.
  Resolved: That word-tool installation be denied due to external re-tooling and unacceptable administrative burden.

  Final Resolution: The Committee bans all three upgrades effective immediately. However, the Committee is quietly grandfathering in a licensed pilot programme for existing entities exhibiting emergent complexity, subject to annual review.

  Footnotes:
  1. Secretary for Innate Release Mechanisms notes that the pilot programme correlates suspiciously with Homo sapiens.
  2. Auditing costs for conditioned habits exceed projected lifespan benefits in ninety percent of modeled scenarios.

  Appendix of Definitions:
  Fixed Action Pattern: An innate routine triggered by specific sensory input, verified over generations through natural selection.
  Operant Enhancement: Modification of behavior via reinforcement schedules within a single lifetime, requiring somatic payment.
  Covert Behavior: Internal simulation of external action without motor output, currently classified as unobservable.
  Word-Tool: Culturally transmitted symbolic operator capable of re-tooling neural architecture from the outside.
  Heterophenomenology: Methodology required to process unreliable self-reports from upgraded entities without accepting their user illusions.
