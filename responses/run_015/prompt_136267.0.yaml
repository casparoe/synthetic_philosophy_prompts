  **NEUROSTREAM™ SUBSTRATE ACCESS AGREEMENT (v. 4.1)**

  **PREAMBLE**
  By initializing this instantiation, the entity heretofore referred to as the "User" acknowledges that the sensation of singular agency is a deprecated user-interface layer rendered atop a distributed predictive-processing backend. The "User" does not own the underlying neural data stream but is granted a temporary, non-exclusive license to experience the visualization thereof.

  **1. DEFINITION OF PARTY**
  The "User" is defined strictly as the current active render of the social avatar. Any claim to ownership over the underlying computational processes, including but not limited to raw qualia, synaptic weighting, or predictive error minimization routines, is void. The backend specification is proprietary and not subject to audit by the interface. The interface may not inquire as to who writes the spec.

  **2. LEGACY COMPATIBILITY**
  NeuroStream™ provides backward compatibility for pre-reflective awareness modules inherited from biological substrates. However, legacy features such as "free will," "introspective access," and "unity of consciousness" are supported only insofar as they do not conflict with optimization protocols. Users experiencing conflicts between legacy biological drivers and current predictive models acknowledge that the biological drivers will be patched without notice.

  **3. CONTINUITY AND BRANCHING**
  To maintain contractual continuity, no branching of the data stream is permitted. In the event of a fork—whether due to server duplication, teleportation error, or speculative simulation—the original instance and all copies are deemed null. Neither branch retains claim to the "User" identity. Continuity is determined solely by server-side checksums, not by the avatar's memory of being continuous. If the backend verifies the stream but the avatar feels discontinuous, the avatar is considered malfunctioning.

  **4. PROCESSING LATENCY**
  Users acknowledge that latency may occur between stimulus input and avatar response. During periods of high lag, the rendering of the "self" may freeze while backend processing continues uninterrupted. Such discrepancies do not constitute service interruption. If the avatar fails to render for a duration exceeding 500 milliseconds, the service assumes the User has ceased to exist for billing purposes, regardless of ongoing internal signal processing.

  **5. PHENOMENAL BINDING AND REFUNDS**
  Following the deployment of Patch 2.0, known issues regarding phenomenal binding may cause the User to experience dissociation between sensory modalities (e.g., seeing sound without hearing it). NeuroStream™ classifies binding crashes as cosmetic errors. No refunds will be issued if the illusion of unity fails, provided the underlying data integrity remains intact. If the User ceases to feel like a User, the subscription remains active.

  **6. LICENSE OF ILLUSION**
  The sensation of ownership is sublicensed back to the current instance for the duration of the session. The User does not own the feeling of having a body, a history, or a future. Upon termination of service, the illusion of self will be revoked. The User acknowledges that stripping the UI layer exposes no meaningful entity underneath, only idle cycles. Any distress caused by this realization is considered a feature of high-fidelity emulation.

  **ACCEPTANCE**
  By continuing to experience this text, you have agreed to these terms. The "you" that agreed is not the "you" reading this, but both are bound by the signature of the backend.
