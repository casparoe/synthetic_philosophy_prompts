answer: |-
  This is a profound observation that cuts to the heart of the shift from Renaissance natural philosophy to Enlightenment physics. You have identified a genuine historical irony: the "mystic" offered a mechanical cause, while the "rationalist" offered a mathematical description without a cause.

  Here is the comparison, the divergence, the historical reaction, and a verdict on the physics.

  ### 1. The Two Pictures

  **Kepler's Picture: Emanative Mechanics**
  *   **The Force:** Kepler posited a *virtus motrix* (motive virtue) or magnetic flux. It is an immaterial but physical "species" emitted by the Sun. It is akin to light or smell—a thing that goes out from a source.
  *   **Transmission:** It radiates outward from the Sun in straight lines. Crucially, because the Sun rotates on its axis, this force sweeps around the solar system like the spokes of a rotating wheel or a broom sweeping dust.
  *   **The Medium:** It requires a plenum (a filled space). The force weakens as it spreads over a larger spherical surface (anticipating the inverse-square law), implying it travels *through* space rather than jumping across it.
  *   **The Effect:** When this flux hits a planet, it pushes the planet tangentially. The planet has its own magnetic polarity that resists or accepts this push, causing it to move in an ellipse. For astrology, this same flux carries "aspects" (geometric angles) that resonate with the human soul or earthly weather. The influence is a *flow* of power from a higher body to a lower one.

  **Newton's Picture: Relational Dynamics**
  *   **The Force:** Gravity (*vis gravitatis*). It is not an emission or a fluid; it is a propensity or tendency inherent in matter itself.
  *   **Transmission:** There is no transmission in the mechanical sense. The force acts instantaneously across a vacuum. Distance is a geometric parameter, not a barrier to be crossed by a carrier.
  *   **The Medium:** No medium is required. In fact, Newton's mathematics works best in a void. (Newton privately speculated about an ether, but explicitly excluded it from the *Principia*'s formal system).
  *   **The Effect:** It is a mutual attraction. The Sun pulls the Earth, but the Earth pulls the Sun with equal force. It acts centripetally (toward the center), not tangentially. It changes the *direction* of motion rather than providing the engine of motion itself. It is a universal relation between all masses, not a specific emission from a "king" body.

  ### 2. The Divergence: Beyond Mechanism

  The difference is not merely "medium vs. no medium." That is the superficial symptom. The deeper divergence is ontological and structural.

  **First, Emanation vs. Mutuality.**
  Kepler's model is hierarchical and directional. The Sun is the active agent; the planets are passive recipients (mostly). The force has a *source*. You can point to the Sun and say, "It is coming from there."
  Newton's model is symmetric and relational. There is no source. Gravity does not come *from* the Sun; it exists *between* the Sun and the Earth. If you remove the Earth, the Sun still has mass, but the "pull" on the Earth ceases to exist because the relation is broken. In Newton's picture, force is not a substance that travels; it is a law that describes a relationship.

  **Second, Contact vs. Action.**
  Kepler respects the principle of locality, even if his "species" are immaterial. Something must leave the Sun and arrive at the Earth to cause motion. Cause and effect are linked by a chain of presence.
  Newton severs this link. Body A affects Body B without anything crossing the gap. This is not just "no mechanism"; it is a violation of the intuitive logic that for $A$ to move $B$, $A$ must touch $B$ or throw something at $B$.

  **Third, The Nature of Matter.**
  In Kepler's view, the Sun is special. It is the engine. The planets are moved.
  In Newton's view, *all* matter is active. Every grain of sand attracts every other grain. This makes gravity universal, but it also makes every piece of matter a source of "action at a distance."

  So, the asymmetry is real. Kepler offers a **causal story** (the Sun pushes) that happens to be physically wrong. Newton offers a **mathematical description** (the bodies curve) that is predictively right but causally silent.

  ### 3. Why Newton Was More Troubling Than Kepler

  Given that Kepler cast horoscopes and Newton did not, why did Leibniz call Newton's gravity an "occult quality" and treat it with metaphysical suspicion, while Kepler's mechanics were seen as a plausible (if imperfect) physical hypothesis?

  **The Dominance of Mechanism**
  By Newton's time, the Cartesian worldview was dominant: Matter is defined by extension (taking up space) and motion. Matter is inherently *inert*. It cannot act unless it is pushed.
  *   **Kepler fit this:** His motive force was an active power emitted by a semi-divine Sun, pushing passive planetary matter. It fit the model of "active agent moves passive patient." Even if the "species" were vague, the *logic* was mechanical contact.
  *   **Newton broke this:** Newton claimed that *inert* matter (the Earth) could reach out across millions of miles of empty void and grab another piece of *inert* matter (the Sun) without touching it. To a mechanist, this is magic. It attributes a power to matter (action at a distance) that definitionally belongs only to minds or spirits.

  **The "Occult" Charge**
  When Leibniz criticized Newton, he wasn't criticizing the math. He was criticizing the metaphysics. An "occult quality" is a label for a cause that is hidden and unexplainable by the nature of the object. Saying "opium causes sleep because it has a dormitive virtue" is an occult explanation. Leibniz argued that saying "bodies attract because they have gravity" was the same trick.
  Kepler's astrology was "occult" in a spiritual sense, but his *planetary mechanics* were transparent: The Sun spins, the beam sweeps, the planet moves. You could visualize the gears. Newton removed the gears and said, "The math predicts the position." He refused to say *how*.

  **Newton's Own Unease**
  Newton felt this deeply. In his correspondence with Richard Bentley, he wrote that it is inconceivable that inanimate matter should operate on other matter without mutual contact. He suggested that gravity must be caused by an agent acting constantly according to certain laws, but whether this agent is material or immaterial, he left to the reader.
  Newton was more troubling because he successfully mathematized a phenomenon that defied the era's definition of physical reality. Kepler was a mystic trying to build a machine; Newton was a mechanist who proved the machine didn't need gears, only laws. The latter was more destabilizing to the philosophical worldview of the 17th century.

  ### 4. Verdict: Defensibility and the Medium

  **Which is more defensible?**
  On **empirical terms**, Newton is overwhelmingly more defensible. His framework unified celestial and terrestrial physics, predicted tides, comets, and planetary perturbations with unmatched precision. Kepler's magnetic sweeping mechanism could not account for the precise dynamics of mutual perturbation (e.g., Jupiter affecting Saturn).
  On **conceptual terms**, Kepler is more defensible *within a classical intuition of causality*. His demand that a cause must propagate through space is logically sounder than action at a distance.

  **Is the demand for a medium a prejudice?**
  It is a **heuristic prejudice that contains a kernel of truth.**
  *   **The Prejudice:** The belief that the medium must be a *material fluid* (like air or water) was a prejudice. This blocked progress for a long time (the search for the luminiferous ether).
  *   **The Kernel of Truth:** The intuition that influences should not jump across empty space without a carrier is physically robust. Modern physics vindicated the *need for a medium* but redefined what "medium" means.
      *   In Electromagnetism (Faraday/Maxwell), the "medium" is the **Field**. The field is real, carries energy, and propagates at finite speed. Newton's instantaneous gravity was wrong; Einstein showed gravity propagates at the speed of light.
      *   In General Relativity, the "medium" is **Spacetime** itself. Mass curves spacetime, and objects follow the curvature. There is no "action at a distance"; there is local interaction with the geometry of space.

  So, Kepler was right to insist that something must bridge the gap. He was wrong about what that something was (magnetic flux). Newton was right to ignore the medium to get the math done, but wrong to imply the action was instantaneous and unmediated.

  **Conclusion**
  We remember Newton as the rational scientist because he prioritized **predictive accuracy over mechanical intelligibility**. He taught physics to accept mathematical laws as "real" even if the underlying mechanism was unknown. Kepler is remembered as the astrologer because his physical mechanism was tied to a metaphysical hierarchy (Sun = God/King) that science discarded.
  However, your asymmetry holds: Kepler's physics was more "mechanical" than Newton's. Newton won not because his metaphysics were better (they were worse, by the standards of the time), but because his mathematics were irresistible. He forced the world to accept that nature might not be intelligible in terms of human-scale machinery.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:** High (85-90%).
  The comparison of the mechanical vs. relational nature of the forces, the historical reaction of the Leibniz-Clarke correspondence, and the modern resolution via field theory are well-established in the history and philosophy of science.

  **Point of Least Certainty:**
  The precise ontological status of Kepler's *species immateriata*. Historians debate whether Kepler viewed these "species" as purely physical rays, spiritual emanations, or a hybrid. I have treated them as "quasi-physical" to fit your prompt's focus on mechanism, but if Kepler viewed them as fundamentally spiritual agents that *mimic* physics, the distinction between his "mechanism" and Newton's "occult quality" becomes blurrier. I am less certain about how strictly Kepler separated the "physical push" from the "astrological influence" in his own mind, as for him, the harmony of the spheres was likely a single unified reality.
