  2.  **Deconstruct the Philosophical Arguments:**
      *   *Politics Book I:* Wealth-getting has a natural limit because wealth is a collection of tools for a substantive end (household management). Unlimited acquisition is unnatural because no craft has unlimited tools. Money used for exchange (chrematistics) can become an end in itself.
      *   *Nicomachean Ethics Book V:* Money is a common measure arising by agreement (nomos) to make unlike services comparable. It also functions as a guarantee of future exchange.
