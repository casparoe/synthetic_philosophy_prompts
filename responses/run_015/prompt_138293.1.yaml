          1.  *Resale:* If it's a measure of service, converting to cash distorts the measure (decouples from service). If it's a tool, selling for cash might be okay *if* it serves the end, but risky if it becomes an end itself. *Recommendation:* Prohibit cash resale, permit transfer at par.
          2.  *Accumulation/Expiry:* If it's a measure, it should be stable. If it's a tool, hoarding is unnatural. *Recommendation:* Hard cap (instrument limit) rather than decay (destroys measure stability).
          3.  *Bulk Purchase:* Injecting outside money risks turning the unit into a commodity rather than a service tally. *Recommendation:* Prohibit bulk purchase for cash.
