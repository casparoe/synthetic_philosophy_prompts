answer: |-
  **TO:** Exchange Program Working Group
  **FROM:** Student Representative, Class of 2025
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Permanent Design Rules for the Student Exchange

  **Purpose and Framework**

  This memo recommends permanent design rules for the Student Exchange to be submitted to the Dean of Students. Our task is to decide whether the Exchange Unit functions primarily as a **measure of need**, a public record that one student owes the community an hour of service, or as an **instrument of life**, a durable claim on future services used to sustain student welfare. The staff analyst suggests we can design for these roles separately. I argue we cannot. In Aristotle's practical philosophy, money arises by agreement to make unlike services comparable (the measure), but it remains subordinate to the household's substantive ends (the instrument). When a measure is held rather than spent, it becomes a tool for living. Therefore, rules governing accumulation must respect the natural limit of tools required for a good life, while rules governing exchange must preserve the unit's status as a measure of service rather than a commodity for profit.

  **Recommendations on Contested Questions**

  **1. Resale**
  *Recommendation:* Prohibit the conversion of Units into cash or external currency. Permit Unit transfer between students only at par value through the official platform.
  *Rationale:* Allowing cash conversion treats the Unit as a commodity rather than a measure of service. Once Units are sold for cash, the link between the token and the service is broken; the Unit becomes a store of value detached from the community labor it represents.
  *Counter-Argument:* Prohibiting resale ignores the gray market already operating on student apps. Banning cash conversion pushes trading underground, and the flat hourly rate misprices scarce skills like coding versus note-taking. The gray market performs necessary price discovery that the Exchange lacks.
  *Rebuttal:* While efficient, price discovery converts a communal obligation into a profit opportunity. Aristotle distinguishes between exchange for use and exchange for gain. We are building a community of mutual aid, not a labor market. If we permit cash conversion, we incentivize students to treat peers as income sources rather than neighbors. [Note: The group must vote on whether community cohesion outweighs market efficiency here; the texts prioritize the former, but this is a value judgment.]

  **2. Accumulation and Expiry**
  *Recommendation:* Implement a hard cap on individual balances (e.g., 50 Units). Do not implement term-based decay or expiry.
  *Rationale:* Aristotle argues in *Politics* that wealth is a collection of tools for a substantive end, and no craft requires unlimited tools. A hard cap respects this natural limit. Decay undermines the Unit's function in *Nicomachean Ethics* as a guarantee of future exchange; a melting balance is an unreliable promise.
  *Counter-Argument:* A hard cap restricts student liberty and penalizes thrift. Decay is preferable because it forces circulation, preventing hoarding that starves the market of liquidity.
  *Rebuttal:* Hoarding is indeed harmful, but decay punishes the prudent who save for large future needs (e.g., finals week). The instrument argument limits *how much* one needs, not *whether* one can keep it. A cap prevents accumulation beyond utility without destroying the guarantee function of the currency. [Note: The specific cap number is arbitrary and requires a vote based on average student workload.]

  **3. Bulk Purchase**
  *Recommendation:* Prohibit student organizations from purchasing Units from the university for cash.
  *Rationale:* Injecting outside money transforms the Unit from a tally of student labor into a vehicle for external funding. This risks making the Exchange a subsidy program rather than a peer-to-peer service network.
  *Counter-Argument:* Organizations need liquidity to pay for event setup. Bulk purchase injects capital that rewards service providers without requiring every beneficiary to work.
  *Rebuttal:* If organizations buy Units with cash, they are effectively hiring students with real money disguised as credits. This creates a two-tier system where some students work for community credit and others work for organizational cash. It blurs the line between the Exchange and employment.

  **4. Yield**
  *Recommendation:* Prohibit yield or interest on positive balances.
  *Rationale:* Paying students to hold Units encourages accumulation for its own sake. In *Politics*, making money breed money is the primary example of unnatural wealth-getting, where acquisition becomes an end rather than a means.
  *Counter-Argument:* The strongest Aristotelian critique targets boundless appetite, not exchange itself. Our participation incentives arguably instantiate boundless appetite more than resale does. If yield encourages early adoption, it serves the substantive end of a healthy market.
  *Rebuttal:* Even if the intent is market health, the mechanism rewards holding over doing. It incentivizes students to withhold labor from the community to earn more claims on future labor. This contradicts the instrument role; tools are meant to be used, not accumulated for profit. [Note: This depends on the judgment that market growth does not justify unnatural accumulation mechanisms.]

  **Transition Rules**
  On the date these rules take effect, all existing Units will remain valid. However, any balance exceeding the new hard cap will be frozen until spent below the threshold; no cash-out option will be provided for excess Units. This respects the Unit as a guarantee while enforcing the instrument limit going forward.

  **Confidence and Disputed Ground**

  We must be clear about where Aristotle supports us and where we are guessing.

  *Evident Claims:* It is clear from the texts that money functions as a common measure established by agreement to compare unlike services. It is also clear that Aristotle views wealth as instrumental to a substantive end (living well), implying a natural limit to accumulation relative to that end. Most scholars accept that he distinguishes between acquisition for use and acquisition for unlimited gain.

  *Disputed Interpretations:* Specialists dispute whether Aristotle condemns trade itself or only the attitude of boundless appetite. Some argue the natural/unnatural contrast is a metaphysical teleological claim, while others see it as a moral critique of greed. Furthermore, it is contested whether the "measure" account in *Ethics* is consistent with the "instrument" account in *Politics*; if money is purely a measure, limits on holding are harder to justify than if it is a tool.

  *Dependency:* Our recommendation depends on the reading that the "instrument" characterization prioritizes the "measure" characterization when units are held. We assume the Unit is a tool for student welfare first, and a measure second. If the "measure" reading dominates, decay might be permissible to ensure stability of circulation, and caps would be unnecessary. If the critique targets trade itself rather than boundless appetite, even our permitted transfers might be suspect.

  *Unsettled Questions:* The texts do not settle the specific level of the cap, nor do they dictate how to handle existing gray markets. They offer a framework for judging ends, not a calculus for market liquidity. We are guessing that community cohesion outweighs the efficiency gains of a cash market. This is a political choice, not a philosophical deduction.
