      *   *Nuance:* Hegel distinguishes between the "external state" (sovereignty) and "civil society" (economic sphere). Tech consortia belong to Civil Society. If Civil Society wages war, the State is weakened.
      *   *Speculation vs. Extension:* I need to be clear. Hegel never wrote about AI. Extending his logic to "no human risk" is an extrapolation based on his views on sacrifice. Extending his logic to "private consortia" is based on his views on mercenaries and civil society.

  6.  **Addressing the "Push Back" Constraint:**
