answer: |-
  **TERMS OF SERVICE AGREEMENT: CONSTITUTIVE ARTS LLC**

  **Effective Date:** Immediately upon spatial coincidence.
  **Parties:** Constitutive Arts LLC ("Lessor") and the Lessee ("You").

  **1. DEFINITION OF ASSETS AND TITLE DISTINCTION**
  Lessee acknowledges that all leased items consist of two distinct legal entities occupying the same spatial coordinates: the "Substrate" (the raw matter, including but not limited to clay, marble, or bronze) and the "Artifact" (the specific form, shape, or artistic configuration). Constitutive Arts LLC retains full title to the Substrate. Lessee leases only the Artifact. Lessee agrees not to conflate the two entities, despite their temporary physical overlap. Ownership of the Substrate does not confer ownership of the Artifact, and vice versa. Any claim that the Substrate and Artifact are "identical" is deemed a material breach of this agreement.

  **2. ALTERATION AND RESHAPING (THE "SQUISH" CLAUSE)**
  In the event the Substrate is reshaped, compressed, or otherwise modified such that it no longer supports the configuration of the Artifact (e.g., rolling a statue into a sphere), the lease for the Artifact shall terminate immediately. Lessee understands that while the Substrate continues to exist, the Artifact ceases to exist permanently. Lessee remains liable for the full lease value of the destroyed Artifact, even if the Substrate is returned intact. No refunds will be issued for the survival of the Substrate. The destruction of the form is non-negotiable, regardless of the persistence of the matter.

  **3. Incremental Material Replacement**
  Lessee may replace up to five percent (5%) of the Substrate per calendar year without voiding the Artifact's identity. Replacements exceeding this threshold require a formal review to determine if the Artifact persists or if a new Artifact has been created through gradual substitution. If the Substrate is entirely replaced over time, Lessee must pay a renewal fee to maintain title to the original Artifact, acknowledging that the Substrate is now legally distinct from the one originally delivered. Constitutive Arts LLC reserves the right to claim ownership of any removed Substrate fragments, regardless of their historical association with the Artifact.

  **4. FISSION AND BRANCHING EVENTS**
  If the Substrate is divided into multiple parts, each capable of sustaining an independent Artifact configuration (e.g., splitting a clay lump to mold two distinct statues), the original lease is automatically voided. The original Artifact is deemed to have ceased existence at the moment of division. Lessee must initiate two new leases for the resulting Artifacts. Lessee may not claim either new Artifact is the "original" for insurance or pricing purposes. In cases where both new Artifacts claim continuity with the original, Constitutive Arts LLC will arbitrate based on modal properties rather than physical resemblance. Any profit generated from the duplication of the Substrate into multiple Artifacts must be reported as unearned income derived from metaphysical ambiguity.

  **5. LIMITATION OF LIABILITY**
  Constitutive Arts LLC is not liable for confusion arising from the co-location of objects. If Lessee suffers distress due to the realization that the statue they purchased yesterday is not numerically identical to the statue they own today, despite no physical changes, this is considered a philosophical risk assumed by the Lessee. Lessee agrees not to sue for damages resulting from paradoxes involving identity, persistence, or temporary intrinsics.

  **6. ACCEPTANCE**
  By displaying the Artifact in a museum, gallery, or private collection, Lessee agrees to these terms. If you do not agree with the distinction between what something is made of and what something is, please return the Substrate in its original lump form within thirty days.

  **GOVERNING LAW:** This agreement is governed by the laws of logical possibility and spatial containment. Disputes shall be resolved in a jurisdiction where identity is transitive.
