answer: |-
  Distinguished guests, colleagues, donors, and friends of the Institute.

  It is a privilege to welcome you to the inaugural symposium of the Institute for Philosophy and Machine Learning. Looking out at this room, I see a gathering that is, frankly, rare. On one side, I see engineers and researchers who spend their days navigating high-dimensional vector spaces, training transformers, and probing the hidden layers of deep neural networks. On the other, I see philosophers who spend their days navigating the logical space of reasons, analyzing intentionality, and debating the nature of mental content. And joining us are the administrators and donors who make this collaboration possible, asking the essential question: Why put these two groups in the same room?

  The standard answer is usually pragmatic. We say that engineers need ethicists to guard against bias, and philosophers need engineers to keep their theories grounded in reality. While true, this is too modest. It suggests that philosophy is merely a safety check for engineering, or that engineering is merely a data source for philosophy.

  I want to propose a deeper reason for this Institute's existence. We are here because we are currently speaking past one another about the most fundamental object of our shared study. We are all trying to understand what these systems are doing, but we are using a vocabulary that is structurally ambiguous. Specifically, we are using the word "representation" to do three distinct jobs at once. Until we disentangle these jobs, we cannot know what we have built, we cannot know how to fix it when it breaks, and we cannot know who is responsible when it causes harm.

  My argument today is simple: The question "Do neural networks have representations?" is not a single question. It is a conflation of three different questions. A system might satisfy the conditions for one kind of representation while failing the conditions for another. Interpretability research often succeeds brilliantly on one dimension while remaining silent on the others. If we do not distinguish them, we will make category errors in our safety protocols and our accountability frameworks.

  So, let us define the three jobs that "representation" is being asked to do in this room.

  The first job is **Tracking**, or Aboutness. When we say a neuron represents a feature, we usually mean there is a reliable statistical correlation between the activation of that neuron and some property in the input data. If a unit fires when there is a vertical edge in the image, we say it represents vertical edges. This is a matter of information carrying. It is about covariance.

  The second job is **Causal-Functional Role**. This asks whether the state plays a specific part in the system's processing architecture. Does this activation actually drive the decision? Or is it an epiphenomenon, a side effect of the computation that could be removed without changing the output? To represent something, in this sense, is to be a gear in the machine that turns the input into the output.

  The third job is **Normativity**, or the Licensing of Error. This is the most philosophical, but also the most crucial for accountability. To represent something is to be capable of being wrong about it. If a system represents a tiger, it must be possible for it to misrepresent a rug as a tiger. If the system's output is merely a causal reflex to stimuli, without a standard of correctness, then it does not make errors; it merely has outputs. Normativity is what allows us to say the system failed, rather than just saying the system functioned differently than we hoped.

  These three dimensions often travel together in human cognition. But in artificial neural networks, they can come apart. And when they come apart, our interpretability tools and our philosophical assessments hit a wall.

  Let me offer a concrete illustration that I hope will resonate with the vision researchers and the philosophers of mind alike. Consider a standard convolutional neural network trained to identify animals. We observe a specific activation pattern in a middle layer that responds strongly to striped textures.

  From the perspective of **Tracking**, the story is clear. This pattern tracks "stripiness." It correlates with stripes in the input. Our feature visualization tools confirm this. We can point to the pixels and the activation and say, "There is the relationship."

  From the perspective of **Causal Function**, the story is also relatively clear. If we intervene and suppress this activation, the network's probability of classifying the image as a "tiger" drops significantly. This state is doing work. It is a functional component in the pipeline that leads to the label "tiger."

  But now, consider the **Normative** dimension. The network is shown an image of a tiger-skin rug. It activates the stripe detector. It classifies the image as "tiger."

  Did the network misrepresent the rug as a tiger? Or did it accurately represent the stripes, and the downstream classifier simply made a heuristic leap that stripes imply tigers?

  If we say the network represents *tigers*, then it has committed an error. It has misrepresented the rug. This licenses us to say the system is flawed and needs correction.

  But if we say the network represents *stripes*, then it has not made an error at all. It has correctly identified stripes. The "error" is not in the representation, but in the mapping from stripes to the label "tiger." In this view, the system is functioning perfectly; our expectation that "tiger" means "animal" rather than "texture pattern" was the mistake.

  Why does this distinction matter? It matters because different interpretability techniques target different dimensions. Saliency maps and feature visualizations are excellent at establishing **Tracking**. They show us what correlates with what. Causal interventions and ablation studies are excellent at establishing **Function**. They show us what drives the output.

  But neither of these methods automatically resolves the **Normative** question. You can have perfect transparency about which neurons fire for stripes, and perfect causal control over those neurons, and still not know whether the system is in the business of detecting animals or detecting textures.

  This is where the work of this Institute becomes vital. For the engineers in the room: This means that making a network transparent does not automatically solve ethical concerns. You can open the black box, show us all the gears, and we still might not agree on what the machine is *trying* to do. Transparency is not a panacea for accountability if we haven't agreed on what constitutes a failure of representation versus a failure of classification.

  For the philosophers in the room: This means you cannot dismiss interpretability as mere engineering. If engineers can isolate a state that plays a specific causal role and tracks specific environmental features, they are providing the empirical substrate for functional-role theories of content. You cannot analyze intentionality in a vacuum if the systems we are building instantiate these roles in high-dimensional spaces that defy traditional propositional analysis.

  And for our donors and administrators: This is why you are funding an Institute, not just a lab or a department. If you fund only the engineering, you will get transparency tools that show you how the system works but not whether it is right. If you fund only the philosophy, you will get rigorous theories of mind that may not apply to the actual architecture of silicon intelligence. You are funding the translation layer between these two. You are funding the clarity required to regulate, to litigate, and to trust these systems. When a self-driving car fails to stop, we need to know if it misrepresented the object (a normative failure), failed to track the object (a sensing failure), or tracked it but failed to integrate it into the braking function (a functional failure). The remedy for each is different. The liability for each is different.

  Now, in the spirit of the collaboration we hope to foster, I want to be explicit about where we stand. We must distinguish what is settled from what is genuinely contested among those who work seriously on both sides. We cannot build an institute on the pretense that we agree on everything, nor on the pretense that we agree on nothing.

  **Here is what is settled.**

  First, we agree that artificial neural networks exhibit complex, structured internal states that correlate with external features. No serious skeptic denies that there is information processing happening.

  Second, we agree that we can intervene on these states to alter the system's behavior. Causal levers exist. We are not dealing with magic; we are dealing with mechanism.

  Third, we agree that the current vocabulary is insufficient. Both engineers and philosophers acknowledge that using the word "representation" without qualification leads to confusion in technical papers and philosophical journals alike. We agree that the ambiguity I described today is a problem that hinders progress.

  **Here is what is genuinely contested.**

  First, it is contested whether satisfying the Tracking and Functional conditions is *sufficient* for genuine intentionality. Some argue that if a state tracks a feature and drives behavior, that is all representation is. Others argue that without a history of selection, or without genuine goals, these are merely "as-if" representations. There is no consensus on whether a neural network can truly be *about* the world, or if it is only about the training data.

  Second, it is contested whether these systems can genuinely misrepresent. If a system is optimized purely for loss reduction, is a false positive an error in the philosophical sense, or just a statistical cost? Some argue that misrepresentation requires a norm that exists independently of the system's optimization function. Others argue that the loss function itself establishes the norm. This is not a settled matter.

  Third, it is contested whether the functional roles in neural networks are stable enough to support content. In human cognition, we assume a certain stability to our concepts. In neural networks, representations can be distributed, adversarial, and context-dependent in ways that challenge the idea of a stable "concept." Whether this invalidates the attribution of content is an open debate.

  We must not paper over these disagreements. In fact, this Institute exists to sharpen them. If we pretend that networks definitely have beliefs, we risk anthropomorphizing our tools. If we pretend they definitely lack intentionality, we risk absolving creators of responsibility for systems that act *as if* they have intentions.

  So, what do I promise you for the future of this Institute?

  I do not promise that we will solve the hard problem of consciousness. I do not promise that we will produce a universal metric for algorithmic fairness.

  I promise that we will do the conceptual labor required to make those questions answerable. We will work to ensure that when an engineer speaks of a "feature," a philosopher knows whether that implies a semantic content or a statistical regularity. We will work to ensure that when a philosopher speaks of "agency," an engineer knows whether that implies a specific architectural capability or a metaphorical description.

  To the engineers: Do not fear the philosophy. It will not slow you down; it will prevent you from building systems whose failure modes you cannot name.
  To the philosophers: Do not fear the engineering. It will not corrupt your concepts; it will test them against the most complex information processing structures humanity has ever created.
  To the administrators and donors: Know that you are supporting a unique intellectual infrastructure. You are supporting the clarity that allows society to integrate these technologies without surrendering our understanding of mind, responsibility, and truth.

  The ambiguity of "representation" is not a bug in our discourse; it is a feature of the phenomenon we are studying. Neural networks are pushing us to see that tracking, function, and normativity are not one thing, but three. By pulling these threads apart, we do not weaken our understanding. We strengthen it.

  Let us begin the work of disentangling them. Thank you.
