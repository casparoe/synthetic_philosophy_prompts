answer: |-
  This is a high-stakes seminar. You're walking into a room where the faculty member (Chen) thinks your starting premise (internalism) is a dead end, and the students are freshly armed with the exact texts (Williams, Korsgaard) that contain the standard objections to your view.

  Your "Temporal Anchoring" twist is interesting, but it radicalizes Williams in a way that makes diachronic agency (agency over time) very hard to explain. Since you admitted your continuity argument is the weak spot, I have ordered these by **philosophical damage**. The first one is the "Hope Nobody Asks" objection you mentioned; it is the most lethal because it threatens to make your theory incoherent.

  Here is your Q&A prep, phrased for a grad seminar context.

  ### 1. The "Diachronic Agency" Objection (The Nuclear Option)
  **Who asks:** A sharp second-year who read Korsgaard, or Dr. Chen.
  **The Vibe:** Polite but deadly. They aren't attacking your motivation; they are attacking the possibility of agency on your view.
  **Phrasing:** "I'm worried about diachronic agency. If normative authority is anchored to a specific *temporal slice* of the agent's motivational set, how do you account for commitments, promises, or long-term projects? If my 'future self' doesn't share the motivation of my 'current self,' your view seems to imply I have no reason to keep my promise. Does this collapse into a kind of presentism that makes planning incoherent?"

  *   **Quick Reply:** "Commitments *are* current motivational states. When I make a promise, I create a current second-order desire to constrain my future actions. The 'binding' force isn't coming from the future; it's coming from my current endorsement of that constraint."
  *   **Where Your Reply is Softest:** This relies entirely on your **continuity condition**. If the "current self" wakes up tomorrow and no longer endorses the commitment, your theory says they have no reason to keep it. You haven't explained why the *past* commitment binds the *future* slice, only why the *current* slice feels bound. If Chen presses on why the future slice *should* respect the past slice's motivation without a shared normative standard, you're stuck.
  *   **Defense Strategy:** Don't try to prove continuity exists. Argue that *practical identity* (Korsgaard's term) is the mechanism of continuity, but it must be *actively reaffirmed* in the present to have authority. Concede that if reaffirmation fails, the reason dissolves—but argue that's a feature, not a bug (it explains why broken promises feel like a loss of self).

  ### 2. The "Sound Deliberative Route" Objection (The Williams 101)
  **Who asks:** A second-year who wants to show they know the text.
  **The Vibe:** Pedantic but legitimate. They think you're attacking a strawman of Williams.
  **Phrasing:** "You're reading Williams too thinly. Williams explicitly allows for a 'sound deliberative route' to new motivations. I can have a reason to $\phi$ even if I don't currently want to $\phi$, provided I *would* want to if I deliberated correctly from my existing set. Doesn't your temporal anchoring condition rule out deliberative discovery? It seems you're conflating 'current motivation' with 'current conscious desire.'"

  *   **Quick Reply:** "I'm not ruling out deliberation. I'm ruling out *external* anchors. Deliberation still happens *in time*. If the deliberative route requires positing a reason that exists independently of *any* possible motivational outcome in the agent (even a hypothetical one), it fails the anchoring condition. I'm tightening Williams, not rejecting him."
  *   **Where Your Reply is Softest:** This bleeds into your **shaky continuity argument**. If deliberation can lead me to a motivation I don't currently have, where does that new motivation come from? If it comes from "rationality" itself, you've smuggled in an external reason. If it comes from a latent desire, how do you prove it was there *at the time of decision* without being retrospective?
  *   **Defense Strategy:** Stand firm on the *temporal slice*. Deliberation is an action taken *now*. It can only utilize materials available *now* (including latent dispositions). If the "reason" exists prior to the deliberation generating the motivation, it's external.

  ### 3. The "Normative Force" Objection (The Dr. Chen Special)
  **Who asks:** Dr. Chen.
  **The Vibe:** Tired of internalism. They think you're confusing "why I acted" with "why I should act."
  **Phrasing:** "You're conflating explanatory reasons with normative reasons. Even if I grant that external reasons don't *motivate* you, why does that mean they aren't *reasons*? If you have a moral obligation to care for your father, that obligation exists regardless of your motivational profile. By tying authority to motivation, aren't you just making morality contingent on mood? That's why internalism is basically dead."

  *   **Quick Reply:** "I'm not denying the obligation exists as a social fact or a moral truth. I'm denying it has *normative authority for the agent* without a motivational hook. Without that hook, 'obligation' is just social pressure or threat of sanction. It explains the *feeling* of hollowness when we act on 'oughts' that don't connect to what we care about."
  *   **Where Your Reply is Softest:** This makes morality impossible for the akratic or the depressed. If a depressed agent has no motivation to be moral, your view says they have no reason to be moral. Chen will pounce on this: "So you're saying the depressed agent isn't irrational for ignoring moral duties?"
  *   **Defense Strategy:** Pivot to the *phenomenology*. Argue that calling it a "reason" when it has no grip on the agent is a category error. It's a "reason for society to judge me," not a "reason for me to act." Accept the cost: Yes, on your view, morality requires a bridge to the agent's psychology to be *action-guiding*.

  ### 4. The "Rationalization" Objection (The Personal Hit)
  **Who asks:** A bold second-year or a visiting grad student.
  **The Vibe:** Suspicious. They sense the biography driving the theory.
  **Phrasing:** "This feels suspiciously tailored to your situation with your dad. How do we know this isn't just post-hoc rationalization for dropping out? You're building a metaphysical theory to validate a choice that was probably just emotional."

  *   **Quick Reply:** "Philosophy often starts from intuitions, and the intuition here is the *hollowness* of external demands. Whether I stayed or left, that hollowness is a data point about agency. My theory explains why 'finish your degree' felt like noise while 'care for dad' felt like a reason. That distinction needs explaining regardless of my choice."
  *   **Where Your Reply is Softest:** It's hard to prove you aren't biased. If your theory *only* validates choices that align with immediate strong emotions, it looks like emotivism.
  *   **Defense Strategy:** Don't get defensive. Acknowledge the intuition pump. "The personal context highlighted the problem, but the problem stands on its own. Think of any case where social expectation diverges from deep care."

  ### Summary of Tactical Advice

  1.  **Own the Continuity Weakness:** Since you know the continuity argument is shaky, do not try to prove psychological continuity is robust. Instead, frame it as a **condition of authority**. "I am not claiming continuity is easy to maintain; I am claiming that *without* it, the reason loses its grip." This turns a bug into a feature.
  2.  **Don't Fight Chen on Internalism:** You won't convince Chen internalism is alive. Instead, argue that *even if* external reasons exist, they cannot **bind** without the temporal anchor. Shift from "External reasons don't exist" to "External reasons lack normative authority."
  3.  **The "Presentism" Trap:** If they ask the "Hope Nobody Asks" question (Objection 1), do not panic. Admit that your view makes agency fragile. "Yes, agency is fragile. It requires constant reaffirmation. That's why burnout happens." This aligns with your Moral Psych context.

  Good luck. Keep your answers short. If you ramble, they will smell the blood in the water on the continuity point.
