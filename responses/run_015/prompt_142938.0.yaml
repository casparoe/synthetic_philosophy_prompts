          *   In the Finkish Mask case, if the mask is internal/structural, we might say the object is *not* disposed to break, but disposed to *activate a shield*.
          *   If the mask is external but finkish (a guardian angel), the object *is* disposed to break.
          *   Therefore, resolving the truth of the counterfactual requires knowing *where* the blocker sits (intrinsic vs. extrinsic) and *how* it sits (static vs. responsive).
      *   *Conclusion:* SCA is dead. We need a causal basis account or a refined counterfactual account that screens off interferers. The recursive finkish mask shows that simply adding "no interferers" isn't enough; we must specify *which* interferers count against the disposition's existence.

  8.  **Refining the "Recursive" aspect:**
