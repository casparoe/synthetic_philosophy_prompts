      *   *Analysis:* This moves beyond the Paradox of Tragedy into the realm of *aesthetic value* and *meta-fiction*. The sadness isn't just "oh no, they died," it's "oh no, truth matters more than comfort."
      *   *Is it the same puzzle?* It's related but distinct. The first is emotional (pity); the second is intellectual/moral (betrayal/truth). The pleasure comes from the *integrity* of the art, not the emotional release. The "lie" forces the reader to do work (atonement themselves).
