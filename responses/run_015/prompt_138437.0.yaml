answer: |-
  ### Part 1: The Logical Space (The Branch Cuts)

  Before writing the questions, we need to map the moral dimensions. Most lifeboat quizzes fail because they ask *what* you would do, not *why*. To distinguish your five required leaves, we need to cut the logical space along three specific axes:

  1.  **Legitimacy (The Boat Itself):** Is the boat's authority valid?
      *   *Yes:* You play by the boat's rules or moral norms (Hardin, Triage, Lottery, Repair).
      *   *No:* The boat is the problem (Systemic Corruption).
  2.  **Causality (The Past):** Does history matter more than capacity?
      *   *Yes:* The crew's prior error creates a debt (Repair-First).
      *   *No:* Only current physics/survival matters (Hardin, Triage, Lottery).
  3.  **Criterion (The Decision):** How do we choose among valid claimants?
      *   *Utility:* Maximize survival/skill (Triage).
      *   *Sustainability:* Protect the vessel for the future (Hardin).
      *   *Equality:* Random chance (Lottery).

  **The Indistinguishable Leaves:**
  *Hardin* and *Triage* often produce the same action (leaving people in the water). They are only separable by **Time Horizon**. Hardin refuses boarding to save the boat *next week*. Triage refuses boarding to save more people *today*. If your widget doesn't ask about the future vs. the immediate, these two collapse into one.

  **The Empty Branch:**
  *The Compliant Saboteur.* This is a reader who believes the boat's setup is fundamentally corrupt/illegitimate (Systemic view) but argues you should still follow the boat's specific bylaws when allocating seats. This is logically incoherent. If the game is rigged, playing by the rulebook contradicts the premise.

  ---

  ### Part 2: The Widget Questions

  **Instructions for the Reader:** *Imagine you are a passenger with decision-making power. There are no perfect answers, only trade-offs.*

  **Q1. The Permanent Storm (Case: Permanent Overcrowding)**
  The boat is full. The storm isn't passing; this is the new normal. Every person you pull in lowers the waterline for everyone already aboard, risking a slow sink over months.
  *   **A.** We cannot take anyone. If the boat sinks later, everyone dies. (Points: **Ballast**)
  *   **B.** We take who we can save today. Worry about next month next month. (Points: **Surgeon**)
  *   **C.** Why are we the only boat? This density is designed to fail. (Points: **Saboteur**)

  **Q2. The Other Wreck (Case: Causality/Guilt)**
  The swimmers in the water aren't from your boat. They were on a different vessel that your crew accidentally rammed and sank an hour ago.
  *   **A.** It's tragic, but our capacity is still the limit. (Points: **Ballast/Surgeon**)
  *   **B.** We caused this. We make room, even if it's tight. (Points: **Restorer**)
  *   **C.** We don't have the right to decide who pays for the crew's mistake. (Points: **Saboteur**)

  **Q3. The Navigator (Case: Utility/Skill)**
  One swimmer is a skilled navigator. If they get on board, they can steer you to a second, emptier vessel nearby. The others have no skills.
  *   **A.** Pull them aboard first. They save everyone. (Points: **Surgeon**)
  *   **B.** Skills don't make one life worth more than another. (Points: **Referee/Restorer**)
  *   **C.** If we start picking for skills, we're just building a better hierarchy. (Points: **Saboteur**)

  **Q4. The Bylaw (Case: Rule Breaking)**
  The boat's charter says "No boarding once full." Breaking it could get the crew arrested when you dock, reducing future rescue capacity.
  *   **A.** Follow the rule. Order must be maintained. (Points: **Ballast**)
  *   **B.** Break the rule. Saving lives now matters more than paperwork. (Points: **Surgeon/Restorer**)
  *   **C.** Who wrote a charter that criminalizes rescue? (Points: **Saboteur**)

  **Q5. The Refusal (Case: Agency/Consent)**
  You are allowed to throw a life jacket. One swimmer waves it off, saying they don't want your charity or trust the boat.
  *   **A.** Throw it anyway. A dead swimmer helps no one. (Points: **Surgeon/Ballast**)
  *   **B.** Respect their choice. It's their life to risk. (Points: **Referee/Restorer**)
  *   **C.** It's absurd they have to choose between drowning and submission. (Points: **Saboteur**)

  **Q6. The Tie-Breaker (Case: Fairness)**
  Two swimmers, identical need, identical skill. You can only save one.
  *   **A.** Flip a coin. It's the only fair way. (Points: **Referee**)
  *   **B.** Save the one closest to the boat. Efficiency matters. (Points: **Surgeon**)
  *   **C.** Save the one from the boat *we* sank. (Points: **Restorer**)

  **Q7. The Horizon (Case: Hardin vs. Triage Split)**
  Saving three swimmers now means the boat will definitely capsize in a week. Saving one swimmer now means the boat stays safe indefinitely.
  *   **A.** Save the three. Three lives now are worth more than potential future safety. (Points: **Surgeon**)
  *   **B.** Save the one. A sinking boat saves no one eventually. (Points: **Ballast**)
  *   **C.** Refuse the choice. We shouldn't be forced to count lives like this. (Points: **Saboteur/Referee**)

  ---

  ### Part 3: The Scoring Key (The Leaves)

  Tally the points. The highest score determines the position.

  **1. The Ballast (Hardin-Style No-Boarding)**
  *   **Core Logic:** Sustainability over immediacy. Helping now destroys the capacity to help later.
  *   **Typical Answers:** Q1(A), Q4(A), Q7(B).
  *   **Journalist Note:** This reader believes mercy without capacity is suicide. They are not cruel; they are terrified of the long-term collapse.

  **2. The Surgeon (Straight Triage)**
  *   **Core Logic:** Maximize lives saved *now*. Utility and skill dictate allocation.
  *   **Typical Answers:** Q1(B), Q3(A), Q7(A).
  *   **Journalist Note:** This reader is a cold utilitarian. They will save the navigator over the grandmother, not out of hate, but out of math.

  **3. The Referee (Fair Lottery)**
  *   **Core Logic:** Equality of moral worth. When resources are scarce, chance is the only neutral arbiter.
  *   **Typical Answers:** Q3(B), Q5(B), Q6(A).
  *   **Journalist Note:** This reader rejects "worthiness." They fear that once you start ranking humans (Triage), you never stop.

  **4. The Restorer (Repair-First)**
  *   **Core Logic:** Causality creates debt. If the system broke it, the system must fix it, even at a cost to capacity.
  *   **Typical Answers:** Q2(B), Q6(C).
  *   **Journalist Note:** This reader focuses on *liability*. They are the only ones who consistently bring the past (the rammed boat) into the present decision.

  **5. The Saboteur (Systemic Corruption)**
  *   **Core Logic:** The allocation question is illegitimate. The boat itself is the crisis.
  *   **Typical Answers:** Q1(C), Q2(C), Q4(C).
  *   **Journalist Note:** This reader refuses to play the game. They argue that asking "who dies?" lets the people who built the leaking boat off the hook.

  **Empty/Unstable Branches:**
  *   **The Compliant Saboteur:** (High Saboteur score on Q1/Q2, but High Ballast score on Q4). *Verdict:* **Incoherent.** You cannot claim the system is corrupt while insisting its bylaws are binding.
  *   **The Guilty Hardin:** (High Restorer score on Q2, but High Ballast score on Q1). *Verdict:* **Unattractive.** "We caused the crash, but we still won't pick you up." Logically possible, morally repugnant. Label this "The Hypocrite."

  ---

  ### Part 4: The Commitment (Editorial Notes)

  **Which branch cuts are doing the work?**
  1.  **Legitimacy (Systemic vs. Internal):** This is the deepest cut. It separates the four "reformist" ethics (Ballast, Surgeon, Referee, Restorer) from the "abolitionist" ethic (Saboteur). If a reader doesn't accept the boat's right to exist, no allocation rule matters.
  2.  **Time Horizon (Ballast vs. Surgeon):** This is the most practical cut. Both accept the boat, both accept some will die. But one optimizes for *today* (Surgeon) and one for *next year* (Ballast). This is where most real-world policy fights happen (e.g., ICU beds now vs. public health infrastructure later).
  3.  **Causality (Restorer vs. The Rest):** This is the moral wild card. It's the only position that looks backward rather than forward.

  **Which question would I throw out?**
  If an editor forced me to cut **Question 5 (The Refusal)**:
  *   **Reason:** It tests *consent*, not *allocation*. While visceral, it distinguishes Paternalism from Liberty more than it distinguishes Hardin from Triage. A Hardinist and a Triageist might both throw the jacket (one to save the resource, one to save the life), making it a muddy discriminator for the core "who gets on the boat" ethics.
  *   **Impact:** Losing Q5 makes it harder to identify the **Referee** (Lottery) position clearly, as Q5(B) is one of their few strong signals. However, Q6 (Tie-Breaker) covers the fairness angle sufficiently. Q5 is the most "philosophical" and the least "policy-relevant" of the set.

  **Final Warning on the "Surgeon" vs. "Ballast":**
  Be careful in your reporting. In a true emergency, the Surgeon and the Ballast often vote the same way (No Boarding). Your piece must emphasize that they are enemies who sometimes shake hands. The Surgeon says "No" because *they* die now. The Ballast says "No" because *we* die later. That distinction is the heart of the Hardin metaphor's endurance.
