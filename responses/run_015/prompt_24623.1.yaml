              *   *Case A (Knowledge):* You check the timetable, see the train leaves at 4. You know it. At 3:50, a joker says "Hey, schedule changed." Because you *know* (have the evidence), you check the source, realize the joker is unreliable, and still go to the platform.
              *   *Case B (Lucky True Belief):* You guess the train leaves at 4. You believe it truly. At 3:50, a joker says "Hey, schedule changed." You have no evidence to counter him. You panic and leave the station.
              *   *Result:* Different actions (Staying vs. Leaving).
      *   **Addressing Premise (1):** Even if we keep (1), we need to refine what "make a difference" means. It doesn't mean "difference in the immediate motor movement at $t_0$." It means "difference in the trajectory of actions over time $t_0 \to t_n$."
      *   **The "Price" of Rejecting (2):** You have to accept that mental states are not just snapshots. They are dispositions. You have to accept that *why* you believe matters for *how* you act later.

