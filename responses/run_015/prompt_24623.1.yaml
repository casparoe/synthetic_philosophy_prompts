      *   **Identify the Target:** Since they want to keep (1), we must attack (2).
      *   **Diagnose (2):** Why does it look airtight? Because it focuses on a *single, isolated snapshot* of action. It assumes "belief" is just a mental state with a propositional content and a confidence level.
      *   **The Crack in (2):** Knowledge entails *justification/reliability*. True Belief (lucky) does not. This difference manifests in *stability* and *counterfactual resilience*.
      *   **Concrete Scenarios (The Core Request):**
          *   *Scenario 1: New Evidence.* If I *know*, I have reasons. If I just *believe truly* (luckily), I might lack reasons. If counter-evidence appears, the knower resists (because they have good reasons to weigh it), the lucky believer might flip-flop (because their belief wasn't grounded).
          *   *Scenario 2: High Stakes/Insurance.* (Pragmatic Encroachment). Some argue knowledge warrants action in high stakes where true belief doesn't. (Though this is controversial, it's a valid angle).
          *   *Scenario 3: Testimony/Chain of Action.* If I tell someone else, "I know," vs "I think," the social action differs. But the user said "same confidence." So let's stick to internal stability.
