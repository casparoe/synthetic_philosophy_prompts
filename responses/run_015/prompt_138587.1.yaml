answer: |-
  To both camps, this document serves as the mediated summary of our final session, intended to capture where we stand after three weeks of debate over the raven paradox. The goal here is not to declare a winner but to isolate exactly where the disagreement lies and where it dissolves, so we can stop emailing and start working. We begin with what we all accept, because there is more common ground than the recent sniping suggests. What we both accept is that nothing in the paradox constitutes a logical contradiction, provided the rules of inference are followed consistently. We agree that the puzzle is not really about birds or about colour words, but about the structural relationship between evidence and generalizations. We agree that the unrestricted principle that an instance confirms its generalization, often called Nicod's criterion, has to be given up in its naive form. We agree that you cannot just drop for free the condition that whatever confirms a hypothesis confirms anything logically equivalent to it, though we differ on the cost of keeping it. Finally, we agree that every verdict has to be relativized to a prior and to a sampling arrangement, meaning no statement about confirmation is meaningful without specifying what was known beforehand and how the evidence was gathered.

  Having cleared that ground, we must state the disagreements precisely, using the wording each side would actually sign. The first camp, which we will call the Probability-Raising View, holds that confirmation just is probability-raising relative to a background corpus, the white shoe really does confirm that all ravens are black, and the paradox is merely a surprise about magnitudes and about what population you were sampling from. They would sign a statement saying that if evidence increases the logical probability of a hypothesis, confirmation has occurred, regardless of intuitive relevance. The second camp, which we will call the Testing-Requirement View, holds that confirmation has to be the evidence bearing on the hypothesis in the right kind of way, tied to what would count as a genuine test of it, the shoe does not confirm, and the probabilists have quietly substituted a different concept while keeping the word. They would sign a statement saying that probability-raising is necessary but not sufficient, because evidence must eliminate potential falsifiers within the specific class the hypothesis concerns.

  To move forward, we need to address four cruxes where these positions make different predictions or require different explanations. The first crux involves a sealed crate holding exactly ten objects, where you built the packing process so you know for certain that each object independently had a fair three-way chance of being a black raven, a white raven, or a white shoe, with nothing else in there. The hypothesis is that every raven in the crate is black. If you reach in blind and pull one object, the prior probability of the hypothesis is two-thirds to the power of ten. If the object is a white shoe, the posterior probability is two-thirds to the power of nine, because you have eliminated one possible location for a counterexample. If the object is a black raven, the posterior probability is also two-thirds to the power of nine, because you have similarly eliminated one possible location for a counterexample. If you draw ten objects instead of one, the confirmation accumulates identically for shoes and ravens under this specific sampling arrangement. If the crate holds a million objects instead of ten, the ratio of posterior to prior remains constant, but the absolute difference shrinks. The fight here is that the two outcomes come out exactly equally confirming in terms of probability ratio, and the Probability-Raising View must say what they make of the intuition that checking shoes is useless, while the Testing-Requirement View must say whether their verdict even changes when the crate gets bigger and the sampling becomes more representative of a natural population.

  The second crux follows from those numbers, noting that the Bayes factor per non-falsifying draw stays at one and a half no matter how big the crate is, while the absolute change in probability goes to nothing. Here the two sides must argue about whether degree of confirmation is a ratio or a difference, and whether the usual line that it confirms, but by a negligibly small amount, survives if you measure it the other way. The Probability-Raising View predicts that the ratio is the correct measure of support, so the shoe always provides significant relative support, whereas the Testing-Requirement View predicts that the absolute difference matters for scientific practice, so the support becomes negligible as the population grows, validating the intuition that shoe-checking is inefficient.

  The third crux arises if you learn the crate contains no ravens at all. The question is whether the hypothesis gets confirmed to degree one, or whether the question lapses, and whether a theory of confirmation should be required to hand down a verdict when the hypothesis is only vacuously satisfied. The Probability-Raising View predicts that the hypothesis is confirmed to certainty because the condition is vacuously satisfied and the probability of a counterexample is zero. The Testing-Requirement View predicts that the question lapses because no genuine test of the raven class has occurred, and a theory of confirmation should not grant epistemic credit for vacuous satisfaction.

  The fourth crux is that you get to choose how to gather evidence, either drawing blind from the crate or picking out an object you have already established is a raven and checking its colour, and everyone prefers the second. The crux is whether that preference can be stated purely in terms of expected information or expected utility, or whether it needs some extra notion like relevance or testing the class the hypothesis is about. If it needs the extra notion, somebody should produce a case where two policies are equally likely to turn up a falsifier but only one is a test, or else both should sign a note saying no such case can be constructed. The Probability-Raising View predicts that the preference is purely pragmatic based on the likelihood of finding a falsifier faster, so no extra notion is needed. The Testing-Requirement View predicts that there are cases where falsifier likelihood is equal but one policy fails to test the relevant class, requiring the extra notion of relevance to explain the preference.

  In closing, I need to say plainly which slice of this fight is only about the word confirmation and which slice is real. The slice that is only about the word is whether we apply the label confirmation to vacuous satisfaction or to probability-raising by irrelevant instances. This is a terminological choice about how broadly we cast the net. The slice that is real is about efficient inquiry and whether there are structural constraints on evidence gathering that probability calculus alone cannot capture without explicit modeling of the sampling process. There is something both of them would count as a genuine loss for their own side. For the Probability-Raising View, a genuine loss would be demonstrating a case where probability rises but rational belief should not change, implying their measure is too broad. For the Testing-Requirement View, a genuine loss would be demonstrating that their notion of relevance cannot be formalized without secretly relying on probability ratios, implying their measure is redundant. If you can agree on these loss conditions, you can stop sniping and start testing.
