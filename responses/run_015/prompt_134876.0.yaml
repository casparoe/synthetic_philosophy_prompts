answer: |-
  Good morning. To the palliative care team, the nurses, and the coordinators who stood at the bedside with Dr. Okonkwo: welcome. And to the philosophers, theologians, and ethicists who have engaged her texts: welcome. It is rare that a single career speaks fluently to both the hands that heal and the minds that theorize. But then, Dr. Okonkwo's work was never divided.

  For twenty-eight years, this service operated under a specific, demanding light. Dr. Okonkwo drew her guiding principle from Augustine's *De Mendacio*. She held that every intentional verbal deception—every *mendacium*—corrupts the moral integrity of the speaker. This corruption occurs regardless of the listener's welfare, and regardless of the gravity of the occasion. She adopted Augustine's eight-grade taxonomy not to find loopholes, but to close them. For Dr. Okonkwo, even the "officious lie"—the falsehood told to preserve life or ease suffering—remained forbidden.

  Now, I know how that sounds to a clinician. In a room full of palliative care physicians, a prohibition on lying to ease suffering can sound like a mandate for cruelty. It can sound like rigidity. So, I want to be precise about what I am claiming today, and what I am deliberately not claiming.

  I am not claiming that Dr. Okonkwo believed truth-telling required the blunt instrumentation of harshness. I am not claiming that her refusal to lie made her indifferent to pain. If you only read her papers, you might miss the warmth that those of you in the clinic knew so well.

  The philosophical idea must do the work here. Dr. Okonkwo insisted that while *mendacium* is forbidden, strategic silence, truthful ambiguity, and a direct refusal to answer are not lies. They carry no moral stain. This distinction was not just theory; it was her practice.

  When she refused to approve consent language that encouraged therapeutic misconception, she was not withholding hope; she was protecting autonomy. When she trained residents to say "I do not know" rather than fabricate reassurance, she was not abandoning the patient; she was offering them the solidity of a truth they could stand on. And when she sat with families in long, heavy moments, she was not being silent because she had nothing to say. She was using silence as a tool of presence, distinct from the deception of euphemism.

  To the philosophers in the room: You will recognize the integrity of her stance. She did not soften the Augustinian hard line to accommodate utilitarian outcomes.
  To the clinicians in the room: You experienced the result of that stance. You know that her "no" to a lie was often a "yes" to a deeper form of companionship.

  Her legacy is not simply that she told the truth. Her legacy is that she taught us how to tell the truth without weaponizing it. She showed us that we do not need to corrupt our integrity to offer comfort, because comfort does not require deception. It requires presence.

  Dr. Okonkwo, thank you for teaching us that the space between a lie and a silence is where the ethics of care actually lives. We are honored to mark your retirement.
