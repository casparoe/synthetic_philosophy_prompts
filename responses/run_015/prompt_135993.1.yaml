      *   **Setting:** A jurisdiction where every offender's complete neural trajectory and environmental history is transparent to the sentencing system (total causal transparency).
      *   **Characters:**
          *   **A (Compatibilist/Dennett-style):** Defends reactive attitudes, authorship under local rational constraints, distinguishes punishment from preventive detention.
          *   **B (Skeptic/Caruso-style):** Argues for consequentialist risk-management (quarantine model), claims "punishment" is a category error without metaphysical desert.
      *   **Constraints:** Real back-and-forth (not monologues), no strawmen, no citations/bibliographies, tight and focused on arguments.
      *   **Key Tension Points:**
