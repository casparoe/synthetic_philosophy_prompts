          *   Scaled Brain: Must yield identical status for isomorphic scaled brains. Error: Physical fetishism.
      *   *Section 2: Conceptual Distinctions.*
          *   Possession/Degree.
          *   Intrinsic/Proxy.
          *   Individual/Normalized.
          *   *Unsatisfiable Pair:* "Size is intrinsically irrelevant" + "Size is the primary proxy for the capacity grounding status." If size tracks the ground, it has derivative relevance. Claiming zero relevance while relying on it as a tracker is incoherent.
      *   *Section 3: Empirical Constraints.*
