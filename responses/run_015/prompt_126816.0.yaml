      *   **Key Components:**
          1.  Boundary cases/phenomena (Human ontogeny, pathology, interspecies, hypothetical scaling) + required results + why failure is an error.
          2.  Conceptual distinctions (Status possession vs. degree, intrinsic vs. proxy, individual vs. species-normalized) + flagging jointly unsatisfiable pairs.
          3.  Empirical constraints (Allometry, neuron/behavior dissociations).
          4.  Single most eliminative desideratum.
          5.  Brief scoring of three specific views (Pure capacity, Strict size-irrelevance, Normalization).
      *   **Constraint:** Do not ask the user to read papers. Keep scoring terse.

  2.  **Deconstruct the Boundary Cases:**
      *   *Human Ontogeny:* Infants have smaller brains than adults but high moral status. Elderly/dementia patients may lose volume but retain status.
          *   *Requirement:* Theory must decouple raw volume from status *within* the human species context, or link it to potentiality/trajectory. Failure implies infanticide or geronticide permissibility.
      *   *Pathology (Macro/Microcephaly):* Extreme deviations in size without proportional changes in moral standing.
          *   *Requirement:* Theory must not assign higher status to macrocephaly or lower to microcephaly solely based on volume. Failure implies discrimination based on medical condition.
      *   *Interspecies (Cephalopods, Corvids, Cetaceans):* Different architectures (ganglionic vs. cortical), different sizes. Cetaceans have huge brains, corvids small but dense.
          *   *Requirement:* Theory must account for structural efficiency/density, not just mass. Failure implies speciesism or ignoring convergent evolution of cognition.
      *   *Hypothetical Scaled Brain:* Same connectivity/morphology, just bigger/smaller.
          *   *Requirement:* If function is preserved via scaling, status should remain constant (or change only if signal latency/metabolic cost affects experience). Failure implies fetishizing absolute physical magnitude over functional organization.

  3.  **Deconstruct Conceptual Distinctions:**
      *   *Possession vs. Degree:* Binary (have/have-not) vs. Gradualist (more/less).
      *   *Intrinsic vs. Proxy:* Is size *itself* valuable, or does it track capacity (sentience, agency)?
      *   *Individual vs. Species-Normalized:* Is a big mouse brain better than a small elephant brain?
      *   *Unsatisfiable Pairs:* The prompt specifically asks to flag these.
          *   *Conflict:* "Size is never intrinsically relevant" AND "Size tracks cognitive capacity grounding status." If size tracks the ground, it's relevant. If it's irrelevant, it can't track the ground reliably without being a proxy. The tension is between *causal relevance* and *moral relevance*.
          *   *Conflict:* "Individual metrics" AND "Species-normalized baselines." You can't prioritize absolute neuron count *and* encephalization quotient simultaneously without a weighting rule.

  4.  **Deconstruct Empirical Constraints:**
      *   *Allometric Scaling:* Brain size scales with body size. Big bodies need big brains for motor/sensory control, not necessarily cognition.
      *   *Neuron/Behavior Dissociation:* Absolute neuron count doesn't always map to flexibility (e.g., some birds outperform mammals with fewer neurons due to packing density).
      *   *Constraint:* Theory cannot treat raw mass as cognitive proxy without correcting for body size and neuronal density.

  5.  **Identify the "Killer" Desideratum:**
      *   What kills the most popular positions?
      *   *Candidate:* The "Human Ontogeny/Pathology" constraint kills raw size theories.
      *   *Candidate:* The "Interspecies Architecture" constraint kills mammal-centric cortical volume theories.
      *   *Selection:* The requirement to *decouple absolute volume from moral status within a species while maintaining a link to capacity across species* is the hardest hurdle. It forces a move from "size" to "functional organization." Let's refine: The constraint that *absolute volume must not correlate with status in cases where functional capacity is held constant or known to be divergent* (The Hypothetical Scaled Brain + Pathology combo).
      *   *Better Selection:* The requirement to accommodate *Human Ontogeny* without resorting to "potentiality" (which is metaphysically heavy) eliminates simple volumetric theories immediately.
      *   *Best Selection:* The **"Non-Monotonicity Constraint."** Moral status must not increase monotonically with brain mass. (Infants < Adults in mass, but not status; Elephants > Humans in mass, but not status). This kills raw size theories and simple allometric theories.

  6.  **Drafting the Content (Iterative refinement for tone and rigor):**

      *   *Tone:* Analytic, precise, biologically informed, philosophical.
      *   *Section 1: Boundary Phenomena.*
