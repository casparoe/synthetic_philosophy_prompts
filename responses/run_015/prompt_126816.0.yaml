answer: |-
  # Desiderata for a Neuro-Structural Theory of Moral Status

  ## I. Boundary Phenomena and Required Results

  An adequate theory must yield specific verdicts on the following boundary cases. Failure to do so constitutes a substantive error (moral or biological), not a permissible anomaly.

  **1. Human Ontogenetic Growth and Decline**
  *   **Phenomenon:** Brain volume increases roughly 4x from infancy to adulthood; neurodegeneration reduces volume in aging.
  *   **Required Result:** Moral status must remain invariant across the lifespan, provided baseline species-typical sentience or agency is present.
  *   **Error Condition:** If the theory assigns lower status to infants or the elderly based solely on reduced volume, it licenses infanticide or geronticide. If it assigns higher status to adults solely on volume, it violates the principle of equal human worth.

  **2. Pathological Extremes (Macrocephaly and Microcephaly)**
  *   **Phenomenon:** Significant deviations from mean cranial volume without proportional changes in conscious experience or moral claim.
  *   **Required Result:** Status must track functional capacity, not absolute volume. A microcephalic human with severe cognitive impairment may have reduced *agency*, but their *sentience-based* status must remain high. A macrocephalic individual gains no moral superiority from excess volume.
  *   **Error Condition:** Assigning higher status to macrocephaly implies a biological aristocracy. Assigning lower status to microcephaly (absent loss of sentience) implies ableism grounded in anatomy rather than experience.

  **3. Interspecies Comparisons (Cephalopods, Corvids, Cetaceans)**
  *   **Phenomenon:** Radically different architectures (distributed ganglia, pallial nuclei, hyper-encephalized cortex) and volumes (grams to kilograms).
  *   **Required Result:** The theory must accommodate high status for small-brained corvids (high neuronal density) and large-brained cetaceans (high absolute count), while acknowledging the alien architecture of cephalopods.
  *   **Error Condition:** Relying on cortical volume excludes birds and cephalopods unjustifiably (taxonomic chauvinism). Relying on absolute mass privileges cetaceans over humans or corvids without functional justification.

  **4. The Hypothetically Scaled Brain**
  *   **Phenomenon:** An artificial brain preserving connectivity ratios and neuronal morphology but varying absolute volume by orders of magnitude.
  *   **Required Result:** Status should remain invariant *unless* scaling alters temporal integration (conduction latency) sufficiently to fragment the unity of consciousness.
  *   **Error Condition:** If the theory assigns higher status to the larger isomorphic brain, it fetishizes physical magnitude over functional organization. If it ignores latency effects in massive scaling, it ignores the biological basis of temporal binding.

  ## II. Conceptual Distinctions and Tensions

  The theory must explicitly maintain the following distinctions. Where pairs are jointly unsatisfiable, the theory must declare which horn of the dilemma it accepts.

  **1. Possession vs. Degree**
  *   **Distinction:** Whether an entity *has* status (binary threshold) vs. *how much* consideration it is owed (gradualist weighting).
  *   **Requirement:** The theory must specify if brain metrics trigger a threshold (sentience) or scale continuously (cognitive complexity).

  **2. Intrinsic Relevance vs. Proxy Tracking**
  *   **Distinction:** Whether neural mass is *itself* morally valuable vs. whether it merely indicates a capacity (e.g., suffering, autonomy).
  *   **Requirement:** The theory must not conflate the marker with the ground.

  **3. Individual-Level Metrics vs. Species-Normalized Baselines**
  *   **Distinction:** Whether absolute neuron count matters (individual) vs. whether Encephalization Quotient (EQ) or packing density relative to body plan matters (normalized).
  *   **Requirement:** The theory must choose a denominator (body mass, metabolic budget, or phylogenetic expectation).

  **4. Jointly Unsatisfiable Pairs**
  *   **The "Irrelevance/Tracker" Paradox:** It is logically unstable to maintain both that *(A) Size is never intrinsically relevant* AND *(B) Size is the primary reliable proxy for the cognitive capacity grounding status.*
      *   **Reasoning:** If size tracks the ground of status reliably, it possesses derivative moral relevance. To claim it is irrelevant while using it as the evidentiary basis for status is incoherent. A theory must either admit derivative relevance or identify a more direct proxy (e.g., metabolic rate of specific networks).
  *   **The "Absolute/Normalized" Conflict:** It is difficult to satisfy both *(A) Individual absolute neuron count determines status* AND *(B) Species-typical architecture normalizes value.*
      *   **Reasoning:** A mouse with a genetically engineered human-scale neuron count would, under (A), have human-level status. Under (B), it remains a mouse. A theory cannot prioritize both the raw hardware count and the architectural context simultaneously without a weighting function that usually collapses into one or the other.

  ## III. Empirical Constraints

  The theory cannot violate established findings from comparative neuroscience and evolutionary biology.

  **1. Allometric Scaling Laws**
  *   **Constraint:** Brain mass scales with body mass (approx. power law). Larger animals require larger brains for somatic maintenance, not cognition.
  *   **Violation:** Any theory using raw brain mass without body-size correction falsely assigns higher status to large bodied animals (e.g., cows over chimpanzees).

  **2. Neuronal Packing Density Dissociations**
  *   **Constraint:** Cognitive flexibility correlates better with absolute cortical neuron count and packing density than with brain mass. Avian pallium achieves primate-like counts in much smaller volumes.
  *   **Violation:** Any theory relying on volume or mass without density correction excludes high-capacity small-brained species.

  **3. Connectivity and White Matter Ratios**
  *   **Constraint:** As brains scale, white matter volume increases disproportionately to maintain connectivity.
  *   **Violation:** A theory ignoring connectivity costs cannot account for the metabolic constraints on status-relevant processing.

  ## IV. The Single Eliminative Desideratum

  **The Within-Species Volume Neutrality Constraint:**
  *   **Specification:** *Variations in brain volume within a single species, holding functional capacity constant, must not alter moral status.*
  *   **Eliminative Power:** This eliminates the greatest number of popular positions. It immediately falsifies **Raw Volumetric Theories** (infants vs. adults), **Simple Mass Theories** (macrocephaly), and **Strict Allometric Theories** (which often fail to account for individual variance within the species norm). It forces the theory to move from "structure" to "function" or "organization," rendering "brain size" a secondary or tertiary metric rather than a primary ground.

  ## V. Brief Scoring of Candidate Views

  **1. Pure Capacity-Based View**
  *   **Score:** **High.** Satisfies Ontogeny and Pathology (focuses on function).
  *   **Deficit:** Struggles with measurement; capacity is hard to quantify without structural proxies.

  **2. Strict Size-Irrelevance View**
  *   **Score:** **Medium.** Satisfies Pathology and Scaled Brain.
  *   **Deficit:** Fails Interspecies comparisons (cannot explain why a stone has less status than a whale without referencing structural complexity which correlates with size). Violates the "Tracker" necessity.

  **3. Normalization View (Neural Scale vs. Species-Typical Architecture)**
  *   **Score:** **Medium-High.** Satisfies Allometry and Interspecies (accounts for density/EQ).
  *   **Deficit:** Struggles with the Scaled Brain (is a scaled-up human brain "super-normal"?); risks circularity in defining "species-typical."
