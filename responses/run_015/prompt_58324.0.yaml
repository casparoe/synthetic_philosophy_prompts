          *   *Idea 3:* Universal Background Checks (UBC) and Safe Storage.
          *   *Analysis:* UBC treats every *transaction* as needing verification. Safe storage treats every *home with kids* as needing a lockbox. Is this treating the *owner* as a risk? Or just mitigating risk?
          *   *Severity:* Low/Medium. This is more semantic/philosophical than practical. Most gun owners accept UBC as verifying status (Idea 2 compliant) rather than assuming risk. Safe storage is about negligence, not malicious misuse.
          *   *Resolution:* Clarify that these are administrative/safety hurdles, not assumptions of criminal intent.

      *   **Conflict C: Self-Defense Capability vs. Event Bans (Idea 1 vs. Idea 3).**
          *   *Idea 1:* Right to protect yourself... when help is not close at hand.
