      *   *Idea 1 & 3:* Mostly consistent. Event bans limit *where*, not *if*, you can defend. Safe storage limits *access* by kids, not owner. UBC supports responsible ownership.
      *   *Idea 2 & 4:* **Potential Conflict.** Idea 2 says limit based on *demonstrated misuse* (objective). Idea 4 says limit based on sheriff's *subjective judgment* of temperament without a record. This is the biggest tension.
      *   *Idea 2 & 3:* Mild tension. UBC and safe storage are preemptive (before misuse), but Idea 2 says "not by treating every careful owner as a risk in advance." However, UBC is usually seen as verifying status, not judging character. Safe storage is about negligence prevention. This needs nuance.
      3.  **Idea 3 & 5:** Consistent. One regulates location/storage, the other regulates hardware.
      4.  **Idea 1 & 4:** Tension. If the right is individual (Idea 1), does subjective denial (Idea 4) infringe on that right for the "ordinary people" mentioned?

  3.  **Detailed Conflict Analysis:**

      *   **Conflict A: Objective vs. Subjective Restrictions (Idea 2 vs. Idea 4).**
          *   *Idea 2:* "only by focusing on demonstrated misuse... not by treating every careful owner as a risk in advance."
