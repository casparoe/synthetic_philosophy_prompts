          *   *Analysis:* This is a direct contradiction. Idea 2 demands objective evidence (felony, RO). Idea 4 allows subjective assessment (sheriff's feeling) without that evidence.
          *   *Severity:* High. It strikes at the core of due process and the definition of "prohibitor."
          *   *Resolution:* Either remove the subjective clause (stick to Idea 2) or broaden Idea 2 to allow character assessments (weaken Idea 2).
          *   *Cost:* Removing subjective clause loses a safety net for "known trouble" not yet criminal. Keeping it loses the principle of objective due process.

      *   **Conflict B: Preemptive Burdens vs. "Not Treating Owners as Risks" (Idea 2 vs. Idea 3).**
