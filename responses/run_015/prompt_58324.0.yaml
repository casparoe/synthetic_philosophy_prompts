          4.  *Discretionary Permits:* Sheriff can deny concealed carry based on "unreliable/short-tempered" judgment *without* a criminal record.
          5.  *Equipment Bans:* Oppose bans on semi-auto rifles and standard capacity magazines (>10 rounds).

