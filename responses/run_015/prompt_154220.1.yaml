  3.  **Aristotelian Analysis:**
      *   *Oikonomia* (Household Management): Aimed at the good life, acquiring goods necessary for life (use-value). Has a natural limit (enough for self-sufficiency/virtue).
      *   *Chrematistike* (Wealth-Getting): Aimed at accumulation for its own sake. Unlimited. Often involves exchange for gain.
      *   *Coin/Money:* Introduced to facilitate exchange of surplus. Unnatural when it becomes the end goal (making money from money).
      *   *The Twist:* There is no coin (metal currency), but there are tokens representing labor claims.
