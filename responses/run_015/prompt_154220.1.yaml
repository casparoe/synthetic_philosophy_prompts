      *   *Labor-Time:* Aristotle doesn't have a labor theory of value in the Marxist sense, but he understands proportionality in exchange. However, living off accumulated claims without working is akin to usury or unnatural exploitation in his view (though he might frame it as living off others' toil rather than one's own virtue).
      *   *Inheritance:* Passing on huge stacks implies unlimited accumulation, which violates the natural limit of household wealth.
      *   *Debt-claims on future work:* This sounds like slavery or exploitation disguised as exchange. Aristotle accepts slavery but distinguishes natural slaves from citizens. If citizens are living off claims on other citizens' labor without reciprocity, it disrupts the political friendship (*philia*) necessary for the polis.

