answer: |-
  The philosopher your friend is remembering is **Friedrich Nietzsche**. The essay is called *On the Uses and Disadvantages of History for Life* (1874).

  It is uncanny how perfectly your board members map onto Nietzsche's three categories of history. He argued that human beings (and towns) need three specific relationships with the past to function, but each one becomes toxic if it dominates the others.

  1.  **Monumental History (Dana):** Looking to the past for inspiration, heroes, and models of greatness.
      *   *The Poison:* When it requires lying. If you have to falsify the past to make the hero inspiring, you are building on sand. Eventually, the truth comes out, and the inspiration turns to cynicism.
  2.  **Antiquarian History (Marcus):** Preserving the past for its own sake, revering the ancestors and their objects.
      *   *The Poison:* Mummification. When you preserve everything but use nothing. The past becomes a hoard that chokes the present. You become a custodian of dead things rather than a living community.
  3.  **Critical History (Priya):** Judging and condemning the past to break its chains and free the present.
      *   *The Poison:* Rootlessness. If you only criticize, you destroy the soil you stand on. People need a sense of belonging to build a future. If history is only a crime scene, people will disengage (as your two board members did).

  Nietzsche's conclusion was that you need all three, but they must be in service of **Life**. History is not an altar to worship at; it is a tool to help the present live better. If a historical project makes the town more divided, more paralyzed, or more deluded, it has failed, no matter how "accurate" or "inspiring" it claims to be.

  Here is how I would handle the $9,000, the intern, and the board.

  ### The Decision: A "Living Archive" Pilot

  You cannot do any of their proposals fully with $9,000. A permanent scholarship requires an endowment (the interest on $9k is too small to matter), a large mural costs more than your total budget, and proper archival preservation of *everything* is impossible.

  **The Plan:**
  1.  **Secure the Base (Marcus wins the hardware):** Spend **$5,500** immediately on industrial dehumidifiers, shelving, and archival boxes for the *most* at-risk materials in the basement. You cannot tell any stories if the paper rots. This is non-negotiable.
  2.  **The Intern as Curator (Priya and Dana share the software):** The intern's summer project is not "cataloging." It is **"The Mill Founder: Myth and Reality."**
  3.  **The Output (A Hybrid Project):** Instead of a mural or a walking tour, use the remaining **$3,500** to create a high-quality, temporary exhibit (or a permanent digital one) that tells the *whole* story.
      *   Panel 1: The Legend (The 1930s booster story).
      *   Panel 2: The Evidence (The ledgers Marcus saves, showing the actual conditions).
      *   Panel 3: The Legacy (Why she matters anyway, despite the flaws).

  This satisfies Nietzsche's requirement: You preserve the stuff (Antiquarian), you tell the hard truth (Critical), but you leave room for inspiration (Monumental) without lying.

  ### What to Say to Each of Them

  **To Dana (The Monumental):**
  > "Dana, you are right that kids need heroes. But Nietzsche warns us that Monumental history turns poisonous if it relies on myths. If we put up a mural based on the 1930s booster story, and a kid Googles it five years from now and finds out we lied, we haven't given them a hero; we've taught them that history is fake.
  >
  > We can't fund a full scholarship with this cash—it would vanish in a year. But we can fund a 'Founder's Grant' for a senior project *about* the town's history. And we can make the mural about her *ambition*, not the fake engineering stats. Let's make the myth part of the story, not the whole story. That's actually more inspiring: that she was a real human, not a superhero."

  **To Marcus (The Antiquarian):**
  > "Marcus, you are the conscience of this board. If we let the ledgers rot, we are criminals. You get the bulk of the budget to stop the water and save the paper. But you have to accept that preservation without access is just hoarding. The town won't support a basement full of boxes they can't see.
  >
  > The intern isn't just going to box things; they are going to digitize the most interesting finds for the exhibit. If we don't show the town why this stuff matters, they won't give us money next year to keep saving it. You save the past, but you have to let us use it."

  **To Priya (The Critical):**
  > "Priya, you are right that we can't heal if we don't admit the wound. The twelve-hour days and the broken strike need to be told. But Critical history becomes poisonous if it makes the present feel guilty rather than empowered. Two board members quit; that means the message was heard as an attack, not a truth.
  >
  > We are going to tell the ugly truths. But we are going to frame them as 'This is where we came from, and this is how we grew,' not 'This is why you should be ashamed.' We need the town to stay in the room to hear the hard stuff. If you can work with Dana to make sure the founder's complexity is shown rather than just her crimes, we can do this together."

  ### Does the Made-Up Story Sink Dana's Project?

  No, but it changes it from a **Monument** to a **Dialogue**.

  If you ignore the fabrication, Priya will leak the info to the local paper, and the Historical Society will look incompetent. If you cancel the project entirely, Dana is right: the town loses a chance for inspiration.

  The middle path is to make the *evolution of the story* the point. The 1930s booster committee trying to save a dying town with a highway mural is *also* history. It shows that people in the 1930s loved this town enough to lie for it. That is actually a poignant story about community desperation and pride.

  Tell Dana: "The truth is better than the myth. A woman who built mills in the 1840s without an engineering degree is actually *more* impressive than one who pretended to have one. Let's honor her actual grit, not the 1930s PR spin."

  ### How to Think About Who Is Right

  You feel like they are all right and wrong because, in Nietzsche's framework, **they are.**

  *   **Dana** is right that we need inspiration, but wrong to seek it in fiction.
  *   **Marcus** is right that we have a duty to the dead, but wrong to assume the dead matter more than the living.
  *   **Priya** is right that truth is necessary, but wrong to assume truth alone is sufficient for community building.

  Your job as the chair (or the swing vote) is not to pick a winner, but to be the **editor**.

  Nietzsche argued that we should only study history to the extent that it serves "Life." Ask this question at the next meeting:
  *"Five years from now, if we do only your proposal, is the town healthier, more connected, and more capable of acting than it is today?"*

  *   If you only do Dana: The town is inspired but deluded. (Fragile)
  *   If you only do Marcus: The town is educated but bored. (Stagnant)
  *   If you only do Priya: The town is honest but divided. (Hostile)

  **The Verdict:**
  Spend the money on the **dehumidifiers first** (because mold is irreversible). Spend the **intern's time** on curating a narrative that includes all three perspectives. Spend the **remaining cash** on a display that puts that narrative in the public eye (plaques, a small exhibit, or a scaled-back mural).

  Tell the board: "We are not choosing between inspiration, preservation, and truth. We are choosing whether this society exists to serve the town's future, or just its past. To serve the future, we need the stuff saved, the truth told, and the inspiration kept alive. We do all three, or we do none."

  That is usually enough to shame a board into cooperation. Good luck. You're doing important work.
