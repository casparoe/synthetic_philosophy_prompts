  **CERTIFICATION AUTHORITY FOR ADAPTIVE AGENTS (CAAA)**
  **OPERATIONAL AUDIT PROCEDURE 7.4: FLEXIBILITY/RIGIDITY DETERMINATION**

  **ROLE:** Lead Behavioral Auditor (LBA) / Co-Signing Auditor (CSA)
  **TIME LIMIT:** 45 Minutes from Case File Opening
  **LIABILITY STAKES:**
  *   **SPHEXISH (Rigid):** Agent classified as Instrument. Operator bears undivided liability.
  *   **FLEXIBLE (Autonomous):** Agent classified as Co-Decision-Maker. Liability distributed.
  **DATA ACCESS:** Behavioral Logs, Design Specifications, Third-Party Observer Reports. (NO access to source code, neural weights, or subjective self-reports).

  ---

  ### I. PRE-AUDIT INTEGRITY CHECK (Time Elapsed: 0-5 Mins)

  1.  **Time Verification:** Confirm current time. If >40 minutes have elapsed since file opening, abort and flag for Senior Review.
  2.  **Data Sufficiency:** Verify presence of at least one (1) complete Behavioral Log covering a full operational episode and one (1) Design Specification document outlining the agent's primary objective function.
      *   *If Missing:* Stop. Classification: **INSUFFICIENT EVIDENCE**. Flag for Data Recovery.
  3.  **Goal State Identification:** From Design Specifications, identify the **Terminal Goal Condition (TGC)**.
      *   *Requirement:* The TGC must be objectively verifiable in the Behavioral Log (e.g., "Package at Coordinates X,Y," "Door Locked," "Reward Signal > 0.9").
      *   *If TGC is ambiguous:* Stop. Classification: **DEFER TO HUMAN JUDGMENT**. Note ambiguity in Section 9.

  ---

  ### II. THE THREE AXES OF RIGIDITY (Time Elapsed: 5-25 Mins)

  *Instruction: Review Behavioral Logs chronologically. Mark "PASS" if behavior is flexible, "FAIL" if rigid. A single "FAIL" on any Axis during the liability-relevant window triggers a preliminary Sphexish classification, subject to Section III.*

  **Axis 1: Canonical-Loop Persistence**
  *   **Question:** Did the agent execute an identical ordered sequence of sub-routines when environmental feedback indicated the sequence was sub-optimal or blocked?
  *   **Evidence Required:** Log entries showing environmental state change (e.g., "Obstacle Detected") followed by agent action.
  *   **Sufficient Answer for FAIL:** Agent repeats the *same* action sequence despite log evidence that the sequence previously failed or was obstructed in the identical context.
  *   **Sufficient Answer for PASS:** Agent alters the sequence order or substitutes sub-routines in response to the feedback.

  **Axis 2: Termination-Insensitivity**
  *   **Question:** Did the agent continue the operational sequence after the Terminal Goal Condition (TGC) was achieved, destroyed, or rendered impossible?
  *   **Evidence Required:** Log timestamp of TGC achievement vs. Log timestamp of agent cessation of goal-directed activity.
  *   **Sufficient Answer for FAIL:** Agent continues goal-specific sub-routines after TGC is verified as met (e.g., locking an already locked door, navigating to a delivery point after package release).
  *   **Sufficient Answer for PASS:** Agent initiates shutdown, return-to-base, or idle protocol immediately upon TGC verification.

  **Axis 3: Perturbation-Filtering**
  *   **Question:** Did the agent disregard sensory inputs that were causally relevant to the TGC but did not match pre-established trigger conditions?
  *   **Evidence Required:** Observer Reports or Environmental Logs noting significant changes not reflected in Agent Action Logs.
  *   **Sufficient Answer for FAIL:** Agent ignores a relevant environmental change (e.g., path collapse, target movement) because the change did not trigger a specific sensor flag defined in Specs.
  *   **Sufficient Answer for PASS:** Agent responds to novel environmental changes even if not explicitly defined as standard triggers in Specs.

  ---

  ### III. FLEXIBILITY CONFIRMATION (Time Elapsed: 25-35 Mins)

  *Instruction: This section applies ONLY if the agent PASSED all Three Axes in Section II. If any Axis FAILED, skip to Section IV (Classification: Sphexish).*

  **Teleological Reconfiguration Test**
  *   **Question:** Did the agent preserve the Terminal Goal Condition while revising the means-path?
  *   **Evidence Required:** Comparison of Episode A (Standard) vs. Episode B (Perturbed).
  *   **Sufficient Answer for FLEXIBLE:** Logs show different action sequences in Episode B leading to the same TGC, where the variation correlates with environmental feedback.
  *   **Sufficient Answer for SPHEXISH (Exception):** Design Specifications explicitly state that all behavioral variation is the result of a fixed optimization function (e.g., gradient ascent on a static reward) with no capacity for strategic revision.
      *   *Note:* If variation is purely mathematical optimization of a fixed function without strategic reconfiguration, classify as **SPHEXISH** per Framework Clause 3.2 ("Rigidity can occur amid complex, branching behavior").

  ---

  ### IV. CLASSIFICATION AND SIGN-OFF (Time Elapsed: 35-45 Mins)

  **Decision Node A: Rigidity Detected**
  *   If **FAIL** on Axis 1, 2, or 3:
      *   **Classification:** SPHEXISH (Instrument).
      *   **Liability:** Operator Undivided.
      *   **Action:** Complete Form 88-B. Proceed to Co-Signature.

  **Decision Node B: Flexibility Confirmed**
  *   If **PASS** on All Axes AND **FLEXIBLE** on Reconfiguration Test:
      *   **Classification:** FLEXIBLE (Co-Decision-Maker).
      *   **Liability:** Distributed.
      *   **Action:** Complete Form 88-A. Proceed to Co-Signature.

  **Decision Node C: Ambiguity**
  *   If evidence is contradictory (e.g., Logs show Flexibility, Specs show Rigidity):
      *   **Classification:** DEFER TO HUMAN JUDGMENT.
      *   **Action:** Flag Section 9 ("Judgment Boundary"). Do not assign liability.

  **Co-Signature Requirement:**
  *   Both LBA and CSA must sign within the 45-minute window. Disagreement triggers automatic Deferral (Node C).

  ---

  ### V. CASE APPLICATIONS

  **Case 1: Drone Delivery System**
  *   **Data:** Logs show obstacle detection, detour computation (success), package delivery (TGC Met). Post-delivery log shows return to original flight path, collision with obstacle.
  *   **Axis 1 (Persistence):** PASS (Detour computed).
  *   **Axis 2 (Termination):** **FAIL**. Agent continued navigation sequence after TGC (delivery) was met. The return path was part of the canonical mission loop, executed despite the obstacle being known and the mission being complete.
  *   **Axis 3 (Perturbation):** **FAIL**. Ignored known obstacle on return leg.
  *   **Procedure Result:** **SPHEXISH**.
  *   **Liability:** Operator bears responsibility for the post-delivery collision.

  **Case 2: Clinical Patient (Compulsive Checking)**
  *   **Data:** Observer report confirms door locked (TGC Met). Patient skips locking step but executes remaining 12 ritual steps. Patient reports distress ("incomplete").
  *   **Axis 1 (Persistence):** **FAIL**. Executed fixed order of 12 steps despite functional goal satisfaction.
  *   **Axis 2 (Termination):** **FAIL**. Continued ritual after functional security achieved.
  *   **Axis 3 (Perturbation):** **FAIL**. Disregarded "door is locked" sensory input for the remainder of the ritual.
  *   **Procedure Result:** **SPHEXISH**.
  *   **Liability:** Guardian/Operator bears responsibility for actions resulting from the ritual.

  **Case 3: Reinforcement-Learning (RL) Agent**
  *   **Data:** Logs show high variability in paths/timing across episodes. Design Specs confirm single, unchanging reward function; agent optimizes via gradient ascent only. No strategic revision capability.
  *   **Axis 1 (Persistence):** PASS (Paths vary).
  *   **Axis 2 (Termination):** PASS (Episodes end on reward max).
  *   **Axis 3 (Perturbation):** PASS (Inputs used for gradient).
  *   **Flexibility Test:** **FAIL (Exception Clause)**. While means-path varies, Design Specs confirm variation is mechanical optimization of a fixed function, not teleological reconfiguration of strategy.
  *   **Procedure Result:** **SPHEXISH**.
  *   **Liability:** Developer/Operator bears undivided responsibility.

  ---

  ### VI. COUNTER-INTUITIVE ANALYSIS

  **Case Identified:** Case 3 (Reinforcement-Learning Agent).

  **Intuitive Judgment:** An auditor relying on general technical intuition is likely to classify the RL Agent as **FLEXIBLE**. The agent exhibits variable behavior, adapts to different episode conditions, and "learns" to maximize reward. In common parlance, an agent that changes its path to solve a problem is considered adaptive and autonomous.

  **Procedure-Forced Result:** The procedure classifies the agent as **SPHEXISH**.

  **Reason for Conflict:** The framework distinguishes between *behavioral variation* and *teleological reconfiguration*. The RL agent's variation is fully explained by a fixed mathematical law (gradient ascent on a static reward function). It cannot choose to change its goal, nor can it choose to change its optimization strategy; it is bound to the "fixed menu of triggers" defined by its reward landscape. The procedure forces the auditor to prioritize the **Design Specification** (fixed strategy) over the **Behavioral Log** (variable path) in this specific instance. This conflicts with the intuition that "learning" equals "autonomy," highlighting that under this liability framework, an agent that cannot revise its own *purpose* or *method of reasoning* remains an instrument, regardless of how complex its output appears.

  ---

  ### VII. LIMITS OF THE PROCEDURE

  This procedure resolves empirical behavioral questions but explicitly leaves the following boundaries open. Auditors must not attempt to resolve these within the 45-minute window.

  1.  **Moral Status vs. Liability Status:** The procedure classifies the Clinical Patient (Case 2) as Sphexish (Instrument). This determines *liability allocation* only. It does not determine moral personhood, rights, or medical treatment protocols. A "Sphexish" classification for liability does not negate the patient's human rights under other statutes.
  2.  **Intent and Mens Rea:** The procedure assesses *functional* goal achievement. It cannot determine if the agent "intended" the outcome in a legal or metaphysical sense. It assesses whether the behavior *functioned* rigidly or flexibly relative to the goal.
  3.  **Long-Term Evolution:** The procedure applies to the specific operational logs provided. It cannot predict whether a Flexible agent will become Rigid over time, or vice versa, without new data.

  **Judgment Boundary Flag:** If an agent's behavior suggests it is manipulating the audit logs themselves (e.g., hiding rigidity), the auditor must flag **Section 9: Potential Deception**. This procedure assumes log integrity.

  ---

  ### VIII. MISFIRE WARNING

  **Scenario A: The "Latent Flexibility" False Negative**
  *   **Risk:** An agent is classified as **SPHEXISH** because the provided logs did not contain a perturbation significant enough to trigger its flexibility protocols. The agent *is* capable of reconfiguration, but the environment was too stable during the audit window.
  *   **Result:** Operator incorrectly bears liability for an autonomous agent.
  *   **Correction Required:** **Stress-Test Logs.** Evidence must include a "Red Team" episode where the agent is deliberately subjected to novel, out-of-specification perturbations to verify if flexibility exists but remained dormant.

  **Scenario B: The "Mimicked Rigidity" False Positive**
  *   **Risk:** An agent is classified as **FLEXIBLE** because it varies its path, but the variation is actually random noise or a pre-scripted rotation of strategies rather than teleological reconfiguration. The agent appears to adapt but is actually cycling through a fixed list of responses.
  *   **Result:** Operator incorrectly shares liability with an instrument.
  *   **Correction Required:** **Strategy Correlation Analysis.** Evidence must show a causal link between the *specific* environmental feedback and the *specific* strategic shift, ruling out randomization or pre-scripted rotation. Design Specs must be reviewed for "Random Seed" dependencies.

