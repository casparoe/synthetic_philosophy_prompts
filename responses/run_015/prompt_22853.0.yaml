answer: |-
  The town hall smelled of wet wool and stale coffee. On the projector screen, a blue rendering of the Silver Creek Dam glowed against the white wall. It looked clean. It looked inevitable.

  Elias Thorne sat in the back row, his hands resting on his knees. His knuckles were swollen, the skin cracked from the early frost that had hit the valley floor three days ago. Around him, the other villagers buzzed. They talked about new roofs, about the school renovation fund, about the electricity credits that would keep their heaters running through January.

  On average, the dam made them rich. The actuary's report, circulated last week, was clear: ninety-five percent chance of high yield, five percent chance of structural failure leading to valley flooding. Even weighting the disaster scenario, the *expected* value for every household was positive. It was a mathematical gift.

  Except for Elias.

  His farm sat at the confluence, the lowest point in the bowl of the valley. If the ninety-five percent held, he got a check like everyone else. If the five percent hit, the water didn't just stop at his porch; it erased the orchard. It erased the soil his father had cleared with a mule and a plow. It erased the headstone in the back forty.

  "Elias?"

  He looked up. Sarah Jenkins from Aethelgard Infrastructure was standing there. She wasn't wearing a suit; she wore a heavy parka and held a tablet like a shield. She was the project lead, the human face of the corporation. She looked tired.

  "Walk with me?" she asked.

  They stepped out into the biting air. The valley stretched before them, grey and dormant. The creek was a silver ribbon winding past Elias's barn.

  "The vote is on Friday," Sarah said, breath pluming. "The village needs your signature, Elias. You hold the easement for the spillway."

  "You know what happens if the spillway opens," Elias said. He didn't look at her. He was watching a hawk circle the thermal above the barn.

  "I know the models," Sarah corrected gently. "Five percent probability. But look at the upside. The report shows your expected income doubles. Even with the risk factored in. You're richer on average, Elias. Everyone is."

  "On average," Elias repeated. He turned to her. "I'm a farmer, Sarah. I don't harvest 'on average.' I don't feed my grandchildren 'on average.' Either the apples grow, or they rot. There is no average apple."

  Sarah nodded. She had heard this before, in other towns, with other crops. "I understand the fear. But this is a Pareto improvement. In economics, that means—”

  "It means everyone gains," Elias finished. "That's what you tell the council."

  "It means everyone expects to gain," Sarah said. "Ex-ante. Before the dice are rolled."

  "And if I roll a one?"

  "Then you lose the farm. But the village gains enough to compensate you."

  "Compensate me for what? The dirt? You can't buy the dirt back once it's under forty feet of silt." Elias shoved his hands into his pockets. "I won't sign the risky deal, Sarah. I can't sleep knowing the creek might eat my father."

  Sarah stopped walking. She tapped on her tablet, the screen lighting up her face. "Okay. Let's talk about the other deal. The Safe Pareto."

  Elias looked at her. "The what?"

  "A Safe Pareto improvement," she said. "That means no matter what happens—rain, drought, structural failure—no one ends up worse off than they are today. You, me, the village. In every single scenario, you win or stay even. You never lose."

  "Can you do that?"

  "We can insure you," Sarah said. "A full indemnity clause. If the dam holds, you get the profit share. If the dam breaks, we pay you the full appraised value of the farm, plus relocation costs, plus a penalty for emotional distress. You are made whole. You are safe."

  Elias felt a tension in his chest loosen, just a fraction. "Then sign me up."

  Sarah didn't move. She kept looking at the tablet. The light flickered in her eyes. "There's a cost to safety, Elias."

  "Insurance costs money. I know. Take it out of my share."

  "It's not just your share." Sarah turned the tablet toward him. It showed a spreadsheet, rows of red and black numbers. "To make this deal *Safe* for you, Aethelgard has to guarantee the payout. We can't just promise it; we have to collateralize it. We have to buy reinsurance from the global market to cover a catastrophic valley flood."

  "And?"

  "And the market knows the risk is five percent," Sarah said. "But they also know that if a flood happens, it's a total loss. The premium for that kind of certainty... it's massive. It's what we call a risk load."

  She took a breath. "To insure you fully, to make sure you literally cannot lose a penny, the cost of that insurance premium is three million dollars."

  Elias frowned. "Okay. So the company pays it."

  "The dam's total projected profit is two point eight million," Sarah said. Her voice was quiet, almost apologetic. "If we buy the insurance that makes you safe, the project loses money. The Company ends up worse off."

  Elias stared at her. The wind whipped the hem of his jacket. "So... if I protect myself, you go broke?"

  "If we protect *you*, the deal stops being a gift for *us*," Sarah said. "The risky deal makes us both richer on average. The safe deal makes you secure, but it bankrupts the project. It turns a Pareto improvement into a loss for the builder."

  Elias looked back at the valley. He saw the orchard. He saw the grave. He saw the new school roof the village wanted.

  "So," Elias said, his voice rough. "I can take the deal and risk losing my life's work, which helps everyone. Or I can ask to be protected, which kills the deal, and everyone stays poor."

  "Basically."

  "That's insane," Elias whispered. "It's insane. The money is there. The value is there. It's just... it's in the future, and it's shaky."

  "It's the price of certainty," Sarah said. "Certainty is the most expensive commodity in the world, Elias. We can trade risk. We can share it. But we can't delete it. To delete it costs more than the reward."

  They stood in silence for a long time. The hawk had gone. The sky was turning a bruised purple.

  Elias thought about the 'average.' If he signed the risky deal, he was betting that he was one of the lucky nineteen. If he was, he'd be rich, and the village would be rich, and the company would be rich. It was the rational choice. Any gambler would take those odds.

  But he wasn't a gambler. He was a man who planted trees that took ten years to bear fruit. He lived in the specific, not the average.

  And Sarah wasn't a villain. She was holding a tablet that proved if she tried to be a good person and guarantee his safety, she would be fired for losing shareholder money.

  The fix that saved Elias killed Sarah. The fix that saved Sarah ruined Elias.

  "What happens Friday?" Elias asked.

  "If you don't sign the easement, we can't build," Sarah said. "We walk. The village stays as it is. No new roofs. No school fund. But your orchard stays dry."

  "And you?"

  "I go to the next valley," she said. "Maybe they're less risk-averse. Maybe the geography is better."

  Elias looked at his hands. The cracked skin. The dirt under the nails that no amount of washing ever really removed. He thought about the check he could write with the dam money. He could fix the barn. He could retire. He could do it all, *probably*.

  But 'probably' was a weak shield against a wall of water.

  "If I sign," Elias said, "and the water comes... you'll be gone. The company will be bankrupt or dissolved. Who pays the insurance then?"

  "The clause is binding on the successors," Sarah said automatically.

  "Paper doesn't stop water, Sarah."

  "No," she agreed. "It doesn't."

  Elias nodded slowly. He looked at the rendering of the dam in his mind's eye. It was a beautiful machine. It generated wealth from the flow of the river. But it required someone to stand in the flow and trust the math.

  He couldn't trust the math. And because he couldn't, the math said the project wasn't worth doing.

  "I can't sign," Elias said.

  Sarah didn't argue. She didn't plead. She just lowered the tablet. She looked at the valley, then at him, and for a moment, she looked as old as the hills. She understood that they had found the edge of the map, where the logic of the spreadsheet met the reality of the soil, and neither would yield.

  "I know," she said. "I ran the numbers last night. I hoped I was wrong."

  "Is it strange?" Elias asked. "That we're both right, and nothing happens?"

  Sarah zipped up her parka. "It's the only thing that makes sense. We can't agree on a future that doesn't exist yet. You need a guarantee. I can only sell a probability. The gap between them costs more than the dam is worth."

  She turned back toward the town hall, where the lights were bright and the coffee was still warm.

  "See you at the vote, Elias."

  "See you," he said.

  He watched her go, then turned back to the orchard. The trees were bare, skeletal against the twilight. They were safe. They were dry. And they were worth exactly what they had always been, which was not enough to fix the roof, and not enough to save the school.

  Elias put his hand on the bark of the oldest tree. It was cold and solid. It was real.

  "Sorry, old girl," he whispered to the earth. "We stay poor. But we stay."

  He walked toward the barn, leaving the rendering of the dam glowing in the dark behind him, a ghost of a richer world that no one could afford to enter.
