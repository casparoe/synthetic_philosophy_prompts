answer: |-
  You and your friend are indeed talking past each other, but not in the way you suspect. It is not simply that he is doing metaphysics and you are doing axiology (value theory). It is that you are arguing about two different *times*.

  Your friend is arguing about the **state of being dead**. His Epicurean claim ("when death is there you aren't") is a claim about the metaphysics of harm: can a non-existent subject bear the property of "being harmed"? His symmetry argument attacks the rationality of fearing the *state* of non-existence.

  You are arguing about the **event of dying**. All your examples (the sniper, the composer, the toddler) are about *premature termination*. Your intuition isn't that "being dead is painful"; it is that "ceasing to exist *now* is worse than ceasing to exist *later*."

  If you want a single principle that captures your verdicts, you must adopt a **Deprivation Account** (most famously associated with Thomas Nagel). However, your list of verdicts reveals that you are secretly sliding between two different definitions of "what is being deprived." Sometimes you mean **Objective Goods** (achievements, relationships, potential), and sometimes you mean **Subjective Satisfaction** (desires, enjoyment, narrative closure).

  Here is the precise principle that will unify most of your view, the verdict you must sacrifice to keep it, and the result on your test case.

  ### The Principle: The Objective Deprivation Account

  > **Death is a misfortune for a person to the extent that it deprives them of the net objective goods they would have otherwise experienced, weighted by their psychological capacity to value those goods.**

  This principle has three components:
  1.  **Counterfactual:** It compares the actual world (death at *t*) with the nearest possible world (life continues past *t*).
  2.  **Objective Goods:** "Good" is not defined by what the person *wants* (desire) or *feels* (hedonia), but by what is genuinely valuable for a human being (agency, connection, achievement, experience).
  3.  **Psychological Weighting:** The badness is attenuated if the person lacks the capacity to engage with those goods (this handles the toddler vs. adult distinction without relying on specific desires).

  ### The Verdict You Must Drop

  To hold this principle consistently, you must drop your verdict on the **Miserable Decade Man**.

  *   **Your Verdict:** "A man whose remaining decade would have been mostly miserable... I say death is bad for him."
  *   **The Principle's Verdict:** Death is **good** (or at least not bad) for him.
  *   **Why Drop Your Verdict?**
      Your friend accused you of switching from "counting goods to counting desires." He was right. In the sniper and toddler cases, you are counting *goods* (time, potential, experience). In the miserable decade case, you are counting *the desire to live*.
      If death is bad *because* it takes away life, it can only be bad if the life taken away is worth having. If you insist that death is bad even when it saves someone from a decade of untreatable pain and zero goods, you are no longer arguing for a Deprivation Account; you are arguing for a **Sanctity of Life** view (existence itself is a good, regardless of content).
      But the Sanctity of Life view contradicts your verdict on the **93-year-old**. You said death at 93, "projects finished, ready to be done," is "barely bad." If existence itself were the good, the 93-year-old losing 5 years of existence would be just as tragic as the 32-year-old losing 50 years. You clearly care about the *quality* of the time lost.
      Therefore, to be consistent with your 32-year-old and 93-year-old verdicts, you must admit that depriving someone of a net-negative future is not a harm. You must concede that for the Miserable Decade Man, death is a mercy, not a misfortune.

  ### Other Tensions to Resolve

  1.  **The Deceived Husband/Woman:** The Objective Deprivation Account sides with you. They are harmed because their *actual* welfare was reduced (their relationships were fake, their work failed), even if they didn't feel it. Nagel calls this "objective reduction in welfare." You can keep these verdicts.
  2.  **The Composer:** This case is tricky. Dying *after* finishing vs. *before*. The quantity of future goods might be identical (rest and relaxation). The difference is *narrative integrity*. The Objective Account can accommodate this if we count "completion of projects" as an objective good. Dying before completion deprives her of the good of *achievement*. Dying after does not. You can keep this verdict.
  3.  **The Toddler:** The Objective Account handles this better than the Desire Account. The toddler has no desires, but has high *capacity* for future goods. The "Psychological Weighting" clause ensures it's bad, but perhaps less "tragic" in a subjective sense than an adult, though objectively the loss of potential is massive. You can keep this verdict.

  ### The Test Case

  **Case:** Someone dies young (25). Counterfactual analysis shows they would have had a life that was **objectively excellent** (great art, deep love, significant contribution) but **subjectively miserable** (severe clinical anhedonia/depression; they would have felt no joy and wished for death daily).

  **The Principle's Verdict:** Death was **bad** for them.

  **Reasoning:** Under the Objective Deprivation Account, the value of a life is not exhausted by the subject's moment-to-moment experience. The goods of love, creation, and connection are objective values. By dying, the person was deprived of the *actualization* of those goods, even if they would not have *enjoyed* them.
  *   *Contrast:* If you had kept your "Miserable Decade" verdict (Subjective/Desire view), you would have to say death was *good* or *neutral* here, because it spared them suffering and fulfilled their desire to not exist.
  *   *Implication:* Adopting the Objective Account means you are committed to the idea that we can be harmed by losing goods we would not have appreciated. This is a heavy bullet to bite, but it is the only way to save the Toddler and the Sniper cases from the Epicurean.

  ### How to Handle Your Friend

  You are not disagreeing about the same question, but you can bridge the gap.

  1.  **Concede the Metaphysics:** Admit that "being dead" is not a state of suffering. Agree that the Epicurean is right that the *state* of death cannot be experienced as bad.
  2.  **Shift the Ground:** Argue that "bad for X" does not require X to *experience* the badness. It only requires that X's **interests** are set back.
      *   *Example:* If I steal from your bank account while you are asleep, you don't experience the loss. You are still harmed. Why? Because your interest in financial security was set back.
      *   *Application:* Death sets back your interest in continuing your projects and experiences.
  3.  **Address the Symmetry:** Your friend's symmetry argument (pre-birth vs. post-death) is the weakest part of his view. The standard reply (Derek Parfit) is that we care about the future because of **psychological directionality**. We have desires that project forward, not backward. The time before birth contains no *thwarted desires* for us; the time after death thwarts all our categorical desires to continue. The asymmetry is rational, not just fear.

  ### Summary

  You are sliding between an **Objective List Theory** (good things make life worth living) and a **Desire Satisfaction Theory** (wanting things makes life worth living).

  *   **To win the argument:** Adopt the **Objective Deprivation Account**.
  *   **The Cost:** You must admit that death is *not* bad for the man facing a miserable decade of pain.
  *   **The Gain:** You save the toddler, the sniper, the composer, and the deceived husband cases under one coherent umbrella. You defeat the Epicurean by showing that harm is about the **loss of possible goods**, not the **experience of loss**.

  Your friend is playing defense with metaphysics ("You don't exist!"). You need to play offense with value theory ("You lost the world!"). Once you define "lost" as "deprived of objective goods," the symmetry argument collapses, and the misery case corrects itself.
