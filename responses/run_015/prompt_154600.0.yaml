  | 3 | keep under one reading only | hasty generalization | It assumes gain differences are usually small. | Optimizing is permissible when stakes are sufficiently high. | Satisficing is the default rule, but not the universal rule. |
  | 4 | keep | none | Setting parameters (like acceptance levels) does require effort. | none | Meta-parameters are subject to the same cost-benefit test. |
  | 5 | reject | level confusion | It assumes infinite regress implies no deliberation is ever justified. | High stakes justify deliberating about how to deliberate. | Satisficing rules can be chosen via optimization when necessary. |
  | 6 | reject | false generalization | It treats time cost as constant while ignoring variable outcome value. | The value of accuracy scales with the stakes of the decision. | Satisficing is rational only when the stakes do not justify optimization. |
  | 7 | reject | non sequitur | It follows logically from the false premise in step (6). | Rationality requires effort proportionate to the stakes. | Satisficing is one tool in a toolkit, not the only rational procedure. |
