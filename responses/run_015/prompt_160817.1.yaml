      *   *Horn 1 (Idle Gaps):* If determinism is true, the future is causally fixed. The Open Future view (OFV) supposedly allows gaps even then (because truth needs actuality, not causal necessity). But if the future is fixed, deliberation is supposedly pointless anyway. So OFV doesn't save deliberation in a deterministic world, yet still posits gaps. The motivation (saving deliberation) doesn't match the mechanism (truth-value gaps).
