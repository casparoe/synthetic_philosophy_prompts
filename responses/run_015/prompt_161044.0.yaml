answer: |-
  **To:** The Commission on Public Memory
  **From:** Research Officer
  **Date:** 14 October 2023
  **Subject:** Recommendation regarding the petition of the Refugee Association (District 4)

  ### 1. Recommendation

  I recommend that the Commission **decline both elements** of the request, but offer a specific alternative regarding the archival record.

  **Regarding the naming of the square:** The Commission should refuse the request to name a civic space after the foreign town. This decision aligns most closely with **Precedent 5 (The Humiliated Woman)** and **Precedent 6 (The Universal Monument)**. While the applicants are now residents, the event lacks a *civic nexus* to the city's own history (Precedent 6). More critically, granting the request would fix a living community to a specific trauma against the expressed wishes of a significant portion of that community (the children), violating the principle of dignified representation established in Precedent 5.

  **Regarding the school curriculum:** The Commission should formally decline to rule on this matter as it falls outside our statutory remit. However, in our correspondence with the Education Department, we should advise that compulsory inclusion would contravene **Precedent 4 (The Mass Grave)**, specifically the finding that the city "should not perform a grief it does not share."

  **Alternative Offer:** In lieu of the square naming, the Commission should offer to fund the digitisation and archival preservation of the refugees' testimonies regarding the 1988 massacre, accessible to researchers and available as *optional* material for schools (mirroring Precedent 2 and Precedent 5). This fulfils the duty to record without enforcing a civic performance or fixing a community identity.

  ### 2. The Closest Analogue

  The closest analogue is **Precedent 5 (The Humiliated Woman)**.

  In Precedent 5, the Commission removed a plaque because it fixed a woman's public identity to her humiliation, acceding to the wishes of her grandchildren who felt the memorial harmed her dignity. In the current request, the refugee association's elders seek to fix their community's public identity to a massacre. However, the 'grandchildren' equivalent—the children of the refugees currently living in the city—have expressed a preference *not* to be publicly marked by this trauma.

  While **Precedent 6 (The Universal Monument)** provides the jurisdictional logic (no local connection), Precedent 5 provides the ethical logic. In both cases, the Commission prioritised the dignity and consent of the subject community over the desire to memorialise a historical truth in public space. To rule otherwise would be to treat the refugee community as subjects of history rather than agents of their own present, repeating the error of the collaborationist court in Precedent 5.

  ### 3. Candidate Principles

  Based on the six precedents, three candidate principles emerge. Each fits the historical data but predicts differently for the current request.

  **Principle A: The Civic Nexus**
  *Definition:* Public memory is reserved for events where the city bears moral responsibility (as perpetrator, bystander, or beneficiary) or where the subject has a substantial biographical tie to the city's development.
  *   *Fits Precedents:* 2, 4, 6 (Strong); 1, 3 (Moderate – the individuals built the city).
  *   *Prediction for Request:* **Decline.** The massacre occurred abroad; the city bears no responsibility and had no connection. The refugees' residence is insufficient to create a nexus for a foreign atrocity.
  *   *Principle Adopted if Followed:* We are a community of shared history, not merely shared residence.

  **Principle B: The Dignity of the Subject (Non-Fixation)**
  *Definition:* Public commemoration must not reduce a living community or individual to a moment of victimhood or trauma, particularly where internal consensus is lacking.
  *   *Fits Precedents:* 4 (No ceremony for grief not shared), 5 (Remove plaque fixing humiliation), 6 (No abstract victims).
  *   *Prediction for Request:* **Decline.** The community is divided; the younger generation rejects the "victim" label. Naming the square fixes their identity to the massacre.
  *   *Principle Adopted if Followed:* We protect the living from being defined by the dead, even by their own dead.

  **Principle C: Record vs. Performance**
  *Definition:* The city's duty is to preserve evidence (archives, plaques, digitisation) rather than to perform grief or moral judgement through civic ritual, compulsory education, or permanent honours.
  *   *Fits Precedents:* 2 (Archive orders, remove plaque), 4 (Mark grave, refuse ceremony), 5 (Archive testimony, remove plaque).
  *   *Prediction for Request:* **Decline Curriculum / Compromise on Name.** Compulsory education is a 'performance' of grief. A square name is a permanent 'honour' which may be inappropriate for a site of slaughter. An archive is the correct vessel.
  *   *Principle Adopted if Followed:* We are custodians of evidence, not priests of memory.

  ### 4. Analysis of the Commission's Actual Practice

  The principle the Commission has *actually* been applying is a hybrid of **Civic Nexus** and **Record vs. Performance**, weighted heavily towards the latter in cases of trauma.

  In Precedents 1 and 3, where the subjects were local builders (Industrialist, Resistance Hero), we allowed naming but demanded contextual record. In Precedents 2, 4, and 5, where the focus was on victimhood or perpetration of evil, we moved the memory to the archive or stripped the honour. We have consistently refused to *perform* grief we do not share (Precedent 4) or to *fix* identity to trauma (Precedent 5).

  Therefore, if we **grant the name**, we would be knowingly adopting a new principle: **The Principle of Solidarity.** This would state that co-citizenship alone grants the right to import foreign memory into the civic landscape, regardless of local nexus or internal community division. This would break consistency with Precedents 5 and 6.

  If we **grant the curriculum request** (were it in remit), we would adopt the **Principle of Universal Education.** This would state that the city must compel the learning of all documented radical evils, regardless of local connection. This would break consistency with Precedent 4 ("grief it does not share").

  If we **decline both**, as recommended, we reaffirm that **Public Memory is Constitutive.** It builds the city's specific narrative. To import a foreign trauma as a civic name is to dilute the specific responsibility we hold for our own history (Precedent 4) and risks violating the dignity of the very people we wish to honour (Precedent 5).

  ### 5. A Further Hypothetical Case

  To distinguish definitively between **Principle A (Civic Nexus)** and **Principle B (Dignity of the Subject)**, I propose the Commission consider the following hypothetical case in the next cycle:

  **The Case of the Local Victim:**
  *A petition is brought by the family of a city-born soldier who was killed as a prisoner of war in a foreign conflict (e.g., a UN peacekeeping mission) where the city had no strategic interest. The family requests a street naming. The soldier is widely regarded as a hero, but the manner of his death involved torture and humiliation which is well-documented. The family is unanimous in wanting the honour.*

  *   **If the Commission rules to Name:** It confirms that **Civic Nexus (Principle A)** is the dominant principle. A local biographical tie is sufficient, even if the event was foreign and traumatic.
  *   **If the Commission rules to Decline (offering a plaque instead):** It confirms that **Dignity/Record (Principle B/C)** is dominant. Even with local ties and family consent, the city avoids fixing public space to the specifics of foreign torture/trauma, prioritising the 'Record over Performance' distinction.

  This case isolates the variable of *local connection* while keeping the variable of *trauma* constant, thereby revealing whether we prioritise the origin of the person or the nature of the event.

  ### 6. Conclusion on External Factors

  Finally, regarding the threats of vandalism and the trade relationship: Precedent 2 (Police Chief) and Precedent 4 (Militia Grave) demonstrate that the Commission does not alter rulings based on external pressure, whether from political sensitivity or public order concerns. We removed a police chief's plaque despite the likely controversy; we marked a mass grave despite the presence of perpetrators. I advise that the threat of vandalism by the far-right and the concerns of the business association be noted in the minutes but explicitly excluded from the decision-making matrix. To consider them would be to allow external actors to veto the Commission's moral reasoning, which would undermine our standing more than any vandalism could.

  **Signed,**
  **Research Officer**
  **Commission on Public Memory**
