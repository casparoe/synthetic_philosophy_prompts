answer: |-
  **Joint Statement on Higher-Order Theories of Consciousness**

  We, the undersigned, represent the two main factions of Higher-Order Theory (HOT). After twenty years of debate, we agree on the following foundation:

  1.  **Target:** We explain *state consciousness* (what makes a mental state conscious) rather than *creature consciousness* (being awake vs. asleep).
  2.  **Insufficiency:** A first-order state (e.g., seeing red) is not conscious just because it exists or has content.
  3.  **Requirement:** Something higher-order—a mental awareness of that first-order state—must be present.
  4.  **Concessions:** Blindsight and unconscious perception are first-order states lacking higher-order awareness. Rocks lack consciousness because they lack mental states entirely.

  **Residual Disagreements**

  | Issue | Conceptual Wing (Thought-like) | Non-Conceptual Wing (Inner Sense) |
  | :--- | :--- | :--- |
  | **Nature of HOT** | A thought-like state deploying concepts. | A quasi-perceptual scan (inner sense). |
  | **Timing** | Must be occurrent (happening now). | Can be dispositional (merely available). |
  | **Accuracy** | Can misrepresent (creating illusions). | Can misrepresent (creating illusions). |
  | **HOT Status** | The HOT itself is unconscious. | The HOT itself is unconscious. |

  **The Cruxes: Predictions on Test Cases**

  **1. The Conceptual Crux**
  *Case A (Visual Prosthesis):* A device feeds a "vertical edge" signal directly to visual cortex without words or concepts.
  *Case B (Infant/Aphasia):* A subject discriminates shapes reliably but lacks words or concepts for them.
  *   **Conceptual Wing Prediction:** No conscious experience. Without concepts to categorize the state, there is no higher-order thought, hence no consciousness.
  *   **Non-Conceptual Wing Prediction:** Conscious experience present. The inner sense scans the state regardless of conceptual capacity.

  **2. The Regress/Structure Crux**
  *Case C (Prefrontal Patient):* A patient with prefrontal damage discriminates stimuli above chance but never reports seeing anything.
  *   **The Objection:** If an unconscious higher-order state makes the target conscious, why doesn't *it* need a higher-order state (leading to infinite regress)?
  *   **Both Wings Prediction:** No conscious experience. The mechanism generating higher-order awareness is damaged.
  *   **The Disagreement:** The Conceptual Wing attributes this to the loss of conceptual modules in the prefrontal cortex. The Non-Conceptual Wing attributes it to the disruption of the scanning mechanism. Both agree this validates the solution to the regress: higher-order states confer consciousness without themselves being conscious.

  **Verbal Disputes**
  Some disagreement may be merely verbal. If the Non-Conceptual Wing defines "concept" broadly enough to include non-linguistic categorization, the gap narrows. However, if "concept" requires logical structure, the divide is real.

  **Significance**
  The stake is simple: Is human consciousness defined by our ability to *think* about our minds, or by a biological *scanner* monitoring them? The prosthesis and infant cases will decide this. If subjects report experience without concepts, the "Thought" wing falls. If they do not, the "Inner Sense" wing must explain why the scanner remains silent.

  We commit to accepting these outcomes as decisive.
