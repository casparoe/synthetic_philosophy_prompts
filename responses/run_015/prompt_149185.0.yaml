  **Brainstormed Job Duties (Foucauldian Logic)**

  1.  **Facilitate Internalized Visibility:** Design workflows where employees voluntarily log biometric and behavioral data, ensuring they feel observed even when alone, thereby becoming the principle of their own subjection.
  2.  **Manage Normative Deviation Indexing:** Monitor the "Normative Deviation Indexing" (NDI) to identify employees who fall outside the optimal productivity mean, prescribing corrective wellness routines to bring them back into alignment with the group standard.
  3.  **Engineer Docile Physiology:** Conduct workshops that train physical movements and rest periods to match corporate workflow tempos, ensuring the body operates as an efficient, non-resistant extension of the organizational machine.

  ***

  **Job Posting: Panopticon Wellness Coach**

  **Company:** BioPower Inc.
  **Location:** Remote (With Mandatory Visibility Check-Ins)
  **Type:** Full-Time

  At BioPower Inc., we understand that true wellness is not merely the absence of illness, but the presence of total transparency. We are seeking a dedicated Panopticon Wellness Coach to join our Human Optimization team. In this role, you will not enforce health; you will cultivate an environment where employees choose to monitor themselves, ensuring that the gaze of management is internalized as a personal commitment to excellence.

  **Key Responsibilities:**

  *   **Cultivate Voluntary Visibility:** You will design self-reporting protocols that encourage staff to log their biometric data, break durations, and emotional states in real-time. The goal is to create a state of conscious and permanent visibility that assures the automatic functioning of power. Employees should feel seen even when the camera is off.
  *   **Administer Normative Deviation Indexing:** You will manage our proprietary Normative Deviation Indexing (NDI) system. This metric compares individual physiological output against the corporate mean. When an employee's NDI suggests an outlier status—whether through excessive rest or unmonitored productivity spikes—you will intervene with personalized corrective wellness plans to restore homogeneity.
  *   **Align Somatic Rhythms:** You will lead training sessions focused on aligning bodily functions with operational tempo. By disciplining the body to reject inefficient movements and unauthorized stress responses, you will help produce docile bodies that serve the organization without resistance.

  **Qualifications:**

  *   Proven experience in behavioral modification or institutional psychology.
  *   Deep understanding of how knowledge production reinforces hierarchical observation.
  *   Ability to frame surveillance as a benefit and correction as care.
  *   Comfortable discussing the dissolution of private space as a pathway to holistic synergy.

  **Why BioPower?**

  We offer a workplace where you are never alone. Our culture rewards those who understand that freedom is not the absence of constraints, but the perfect alignment of individual desire with organizational need. If you are ready to help us build a workforce that polices itself, we want to see you.

  Apply now. Your profile is already being reviewed.
