answer: |-
  # Job Talk Q&A Prep Sheet
  **Topic:** Entitlement, Transmission Failure, and the Bootstrapping Problem
  **Audience:** Mixed (Internalist Generalists, Goldman-style Reliabilists, One Bayesian)

  ### 1. The Reliabilist "So What?" Objection
  **Likelihood:** Very High | **Damage:** High
  **Idiom:** Process-Reliabilist (Goldman-style)
  **The Question:** "Let's grant your technical account of transmission failure. But if Roxanne's gas gauge *is* reliable, and she forms a true belief through a reliable process, she has knowledge. You're treating bootstrapping as a defect in reasoning, but for us, it's a success story in truth-conduciveness. Why should we care that warrant doesn't transmit if the subject ends up with knowledge anyway? Aren't you solving a purely internalist problem and calling it a general solution?"

  **Strategy:** **Hold the Line.**
  **Reply (90s):** "That's exactly the right pressure point. If we're purely externalist, bootstrapping isn't a bug. But the intuition that Roxanne is epistemically irresponsible is robust, even among externalists. My claim isn't that she lacks *knowledge* simpliciter, but that she lacks *reflective security*. She can't cite her reliability to defend her belief without begging the question. By distinguishing between having a reliable process and being able to *warrantedly infer* that reliability, we preserve the intuition that Roxanne is epistemically lucky, not epistemically virtuous. If we call that 'knowledge' without qualification, we lose the ability to distinguish her from a subject who checks the gauge against an independent standard. I'm not denying she knows; I'm denying she knows *why* she knows, and that distinction matters for a complete theory of justification."

  **Candid Note:** *This is thin if they press on whether "reflective security" is actually required for knowledge. If they say "Knowledge is factive + reliable process, period," you have no leverage other than intuition.*

  ### 2. The Bayesian "Probability Mismatch" Objection
  **Likelihood:** Medium | **Damage:** Very High
  **Idiom:** Formal Epistemologist (Bayesian/Calibration)
  **The Question:** "You say the inference is valid and the premises are justified, but warrant doesn't transmit. In a Bayesian model, if $E$ justifies $P$, and $P$ entails $H$, then conditionalizing on $E$ should raise the probability of $H$. If the probability of $H$ doesn't rise, the evidence is probabilistically irrelevant. Are you committed to saying Roxanne's observations are probabilistically irrelevant to the reliability of her gauge? If not, how do you square 'no warrant' with 'probabilistic support'?"

  **Strategy:** **Concede a Narrowed Version.**
  **Reply (90s):** "I'm not denying probabilistic support; I'm denying *warrant transmission*. Probabilistic support is a relation between propositions; warrant transmission is a structural feature of how a subject acquires justification. It's possible for $E$ to raise the probability of $H$ objectively, while the subject is not permitted to use that increase to *establish* $H$ for the first time. Think of it as a distinction between evidential support and dialectical leverage. The Bayesian math tracks the support; my account tracks the subject's entitlement to rely on that support to certify the framework they are already using. I'm happy to grant the probability boost exists, provided we agree it doesn't generate *new* antecedent warrant."

  **Candid Note:** *This is the thinnest spot in the project. Distinguishing 'probabilistic support' from 'warrant transmission' without sounding like you're changing definitions mid-stream is difficult. If she asks for the formal model, you might struggle.*

  ### 3. The Internalist "Access" Objection
  **Likelihood:** High | **Damage:** Medium
  **Idiom:** Internalist Generalist (Foundationalism/Coherentism)
  **The Question:** "You're leaning heavily on Wright's notion of 'entitlement.' But entitlement sounds like an externalist permission slip—it's a warrant I have whether I know it or not. Given this department's leanings, how do you square this with an internalist requirement that the subject have access to their justifiers? If Roxanne isn't entitled to demand evidence for reliability, isn't she just blindly trusting?"

  **Strategy:** **Concede.**
  **Reply (90s):** "That's a fair characterization. Entitlement *is* externalist in flavor. I'm not trying to save strict internalism here. My goal is to show that even if we accept Pryor's dogmatism—which has internalist motivations—we still need a structural constraint like transmission failure to avoid absurdity. I'm willing to concede that entitlement functions as an externalist backstop. The trade-off is that it allows us to keep the internalist intuition that perception justifies immediately, without collapsing into the 'easy knowledge' problem. I'm proposing a hybrid: internalist justification for the premises, externalist entitlement for the cornerstones."

  **Candid Note:** *Honesty works best here. Don't try to force entitlement into an internalist box. The risk is alienating the internalists, but they will smell a rat if you pretend entitlement is accessible.*

  ### 4. The Reliabilist "Process vs. Argument" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Idiom:** Process-Reliabilist
  **The Question:** "Roxanne doesn't actually run a syllogism. She just looks at the gauge and believes it's reliable. Your solution focuses on the failure of an *inference*. Does your account apply to non-inferential bootstrapping? If she doesn't reason, there's no transmission to fail, so does she get full warrant?"

  **Strategy:** **Hold the Line.**
  **Reply (90s):** "Even if the reasoning is tacit, the justificatory structure is the same. If the belief 'the gauge is reliable' depends on the deliverances of the gauge, the dependence relation holds regardless of whether she articulates the premises. Transmission failure describes the structural relationship between the source and the cornerstone claim. If we say non-inferential bootstrapping works simply because she didn't speak the argument aloud, we make epistemic status turn on introspective articulation rather than justificatory structure. I argue the structural defect exists even in the tacit case, blocking the generation of *new* warrant for reliability, even if the belief is formed reliably."

  **Candid Note:** *Reliabilists hate "tacit inference" arguments. They may press you on the causal mechanism. If there's no inference, there's no transmission. Be prepared to clarify that you mean "inferential structure" broadly, not just conscious reasoning.*

  ### 5. The Generalist "Skepticism" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Idiom:** Internalist Generalist
  **The Question:** "If transmission fails for reliability claims, doesn't it fail for almost all empirical arguments? If I can't prove my vision is reliable, can I prove anything about the external world? Aren't you handing the skeptic a victory by saying we can't warrant our cornerstones?"

  **Strategy:** **Hold the Line.**
  **Reply (90s):** "Not a victory, but a realistic concession. Wright's point—and mine—is that we cannot *rationally refute* the skeptic using empirical premises that presuppose the skeptic is wrong. But that doesn't mean we can't know. Entitlement allows us to accept cornerstones without evidence. So we keep our ordinary knowledge of the world, but we lose the ability to construct a non-circular proof against skepticism. I'd argue that's the correct result: skepticism is theoretically unrefutable, but practically irrelevant because we are entitled to trust our faculties. We lose the argument, but we keep the world."

  **Candid Note:** *Some internalists find this deeply unsatisfying. They want a refutation of skepticism. If they press "So you admit skepticism is unrefutable?", just say yes. Don't waffle.*

  ### 6. The Bayesian "Priors" Objection
  **Likelihood:** Low | **Damage:** High
  **Idiom:** Formal Epistemologist
  **The Question:** "Isn't transmission failure just a matter of prior probabilities? If I assign a low prior to 'my gauge is reliable,' the posterior won't rise much. Why posit a structural 'transmission failure' when standard Bayesian updating explains the lack of conviction?"

  **Strategy:** **Concede a Narrowed Version.**
  **Reply (90s):** "Priors explain why a specific subject might not be convinced. Transmission failure explains why *no* subject, regardless of priors, can use that specific argument to *establish* the conclusion for the first time. It's a constraint on the architecture of justification, not just a feature of credence distributions. However, I agree the two often converge in practice. I'm claiming the structural failure is what *grounds* the rationality of holding those skeptical priors in this context. So the Bayesian model captures the phenomenon, but my account explains the normative constraint behind it."

  **Candid Note:** *This risks conflating the normative with the descriptive. If she presses that "structure" is just a metaphor for "priors," you may have to agree to disagree on ontology.*

  ### 7. The Generalist "Rationality" Objection
  **Likelihood:** Low | **Damage:** Low
  **Idiom:** Internalist Generalist
  **The Question:** "If Roxanne isn't warranted in believing her gauge is reliable, is she irrational for trusting it? You say she has entitlement, but if she can't cite it, how is she different from a dogmatist who just refuses to give reasons?"

  **Strategy:** **Hold the Line.**
  **Reply (90s):** "She's not irrational; she's operating within a framework she's entitled to assume. The difference between Roxanne and a stubborn dogmatist is that Roxanne's entitlement is grounded in the necessity of the framework for cognitive functioning, whereas the dogmatist is ignoring defeaters. Entitlement isn't a refusal to give reasons; it's the recognition that some reasons are unavailable in principle. As long as she has no specific defeaters—like evidence the gauge is broken—her trust is rational. She becomes irrational only if she treats that trust as an evidential proof she can deploy against challengers."

  **Candid Note:** *This is safe ground. Just ensure you don't make entitlement sound like "anything goes."*

  ***

  ### The Killer Question
  **The question you are quietly hoping nobody thinks to ask:**

  "Wright argues transmission fails because the justification for the premises *presupposes* the conclusion. Pryor argues justification for the premises is *independent* of the conclusion. You are using Wright to save Pryor. But if Pryor is right (independence), why does Wright's condition for transmission failure (dependence) obtain? Aren't you mixing incompatible architectures? If perceptual justification doesn't require antecedent reliability, why does the inference to reliability fail?"

  **Why this hurts:** It targets the theoretical seam between your two main sources. If you say justification *does* presuppose reliability, you undermine Pryor. If you say it *doesn't*, you undermine Wright's reason for transmission failure.
  **Prep:** If asked, pivot to "informational dependence" vs. "justificatory dependence." Argue that while justification doesn't *require* belief in reliability (Pryor), the *argument* from perception to reliability is informationally circular (Wright). Keep the distinction sharp.
