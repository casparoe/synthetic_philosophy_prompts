  Conversely, supervaluationism views vagueness as semantic indeterminacy, where many precisifications are admissible. Legislative precisification is understood as arbitrarily selecting one admissible precisification among many equally legitimate ones, thereby altering rather than clarifying the concept's extension. This aligns with the view that laws create rules. However, the strongest objection is that supervaluationism struggles to explain why one precisification becomes legally binding. If multiple cutoffs were admissible prior to legislation, what grants the selected cutoff exclusive authority? Critics argue this fails to explain the transition from indeterminate permission to determinate obligation.

  Weighing these objections, the epistemicist error is fatal, while the supervaluationist difficulty is resolvable. The epistemicist view contradicts the observable nature of legislation as creative and normative. The supervaluationist worry regarding binding force is resolved by recognizing institutional authority. The binding force stems from the institution, not semantics. Supervaluationism accommodates this by acknowledging that legislation changes the context of evaluation, rendering previously admissible alternatives inadmissible. Epistemicism cannot accommodate this shift without implying the law was always sharp.

  Ultimately, supervaluationism is superior. It captures the creative function of legislation, whereas epistemicism reduces lawgiving to fact-finding. Epistemicism disconnects legal language from its practical function by positing hidden truths. Supervaluationism integrates semantics with legal theory effectively. Because legislative precisification is an exercise of will rather than cognition, supervaluationism provides the necessary framework to understand law as a tool for resolving indeterminacy rather than mirroring hidden realities.
