answer: |-
  Augustine would adjudicate the dispute by rejecting the physical block universe as a confusion of spatialized matter with true temporality, instead defending a neuro-phenomenological presentism that locates the reality of the now in the distension of the soul without collapsing the distinction between Creator and creature. He would argue that special relativity's elimination of a global physical present merely confirms his own insistence that time is not a property of moving bodies but an activity of the mind, meaning the failure of physics to locate a universal "now" is irrelevant to the ontological reality of time itself. For Augustine, the eternalist block universe represents a category error that mistakes the created order of succession for divine eternity; while the block posits all moments as equally real, this static multiplicity lacks the simple, unchanging unity of God's life, rendering it a poor secularized shadow that risks idolizing the created structure rather than pointing to the Creator. Consequently, he would refuse to grant the block universe any theological weight, viewing it instead as a description of how created matter is extended, not how time is experienced or constituted.

  He would defend a created ontological privilege for the now, but strictly within the realm of the conscious subject rather than the cosmos at large. Since Augustine defines the present as the attention of the soul holding memory and expectation together, the "now" possesses reality only insofar as it is lived by a rational creature capable of such distension. This aligns precisely with the modern neuro-phenomenological strategy that grounds temporal passage in the dynamics of perception, as both accounts locate the flow of time in the integrative act of consciousness rather than in external simultaneity. Augustine would accept this extension of his thought because it preserves the intuition that the present is uniquely real for the experiencer without requiring a physically privileged frame that contradicts empirical observation.

  Crucially, he would not view this psychological grounding of time as collapsing the distinction between Creator and creature, but rather as sharpening it. Divine eternity is characterized by the total absence of distension, where there is no past slipping away or future arriving, only an immutable present; by contrast, human time is defined by the fragmentation of the soul across memory, attention, and expectation. Therefore, anchoring the present in neuro-phenomenological dynamics highlights the finitude and mutability of the creature, emphasizing that humans possess time only through a strained stretching of the mind that God does not experience. Augustine would conclude that the presentist intuition is correct regarding the life of the soul, but that attempting to project this privilege onto the physical universe misses the point that time is the measure of created change, while eternity is the mode of uncreated being.
