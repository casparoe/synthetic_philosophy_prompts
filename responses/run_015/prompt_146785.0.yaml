  2.  **Deconstruct Augustine's View on Time:**
      *   *Confessions* Book XI is the primary source.
      *   Key concepts:
          *   Time is a property of creation, not co-eternal with God.
          *   God exists in an eternal "present" (no past or future).
          *   Human time is a *distentio animi* (distension of the soul/mind).
          *   The past exists only in memory, the future in expectation, the present in attention.
          *   Time is subjective/psychological rather than purely objective/cosmic in its measurement.
          *   Creation marks the beginning of time; there is no "before" creation.

  3.  **Analyze the Modern Dispute:**
      *   **Eternalism (Block Universe):** Past, present, and future equally exist. Supported by Special Relativity (SR) because simultaneity is frame-dependent, so no universal "now" exists physically.
      *   **Presentism:** Only the present exists.
          *   *Strategy 1:* Privileged frame (neo-Lorentzian) – contradicts spirit of SR but saves intuition.
          *   *Strategy 2:* Neuro-phenomenological – The "now" is a feature of consciousness, not physics.

  4.  **Synthesize Augustine with the Modern Dispute:**
      *   **Divine Eternity vs. Block Universe:** Augustine distinguishes sharply between God's eternity (unchanging, simultaneous possession of endless life) and created time (successive, distended). The Block Universe looks like eternity (all times equally real), but for Augustine, created time *must* involve change and succession. A static block without a moving "now" might look like eternity, but if it's created, it lacks the ontological stability of God. However, SR suggests the physical world *is* a block. Augustine would likely see the Block Universe as a category error if applied to God, but potentially accurate regarding the *created order* if understood correctly. But wait, Augustine insists time is in the mind.
      *   **The Privilege of the Now:** Augustine argues the present is the only thing that truly *is* (in a created sense), but even the present is fleeting. He grounds the existence of time in the *animus* (soul/mind).
      *   **Neuro-phenomenological Presentism:** This aligns closely with *distentio animi*. If physics says there's no global now, Augustine would say physics measures external motion, but time itself is internal. The "present" is where attention holds memory and expectation together.
      *   **Creator/Creature Distinction:** If the "now" is purely psychological, does it make time subjective to the point of solipsism or divinizing the human mind? Augustine would say the human mind is created *in* time, but reflects God's image. Grounding time in perception doesn't make us God; it acknowledges our finite mode of existence compared to God's simple eternity.

