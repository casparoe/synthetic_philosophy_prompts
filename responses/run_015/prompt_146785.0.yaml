          4.  **Neuro-phenomenology:** This fits *distentio animi*. The "specious present" (perceptual window) is where memory and expectation meet. This doesn't collapse Creator/creature; it defines the creature's mode. God has no distension; we do.
          5.  **Conclusion:** He would side with the presentist intuition but ground it in theology/phenomenology, not physics. The physical world might be a block, but *time* is the life of the soul.

