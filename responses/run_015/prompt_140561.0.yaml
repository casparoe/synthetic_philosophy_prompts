answer: |-
  This is an exceptionally sharp summary of the pop-Everettian position. You have correctly identified that the "load-bearing" walls are exactly where the technical friction lies. Your suspicion about the Deutsch–Wallace (DW) argument is not confusion; it is the central objection raised by professional philosophers of physics (most notably David Albert, Huw Price, and Adrian Kent).

  Here is a breakdown of the claims, sorted by how a working Everettian (specifically one in the *foundations* literature, not just a cosmologist who uses the wavefunction) would treat them. I will mark confidence levels explicitly.

  ### Part 1: Claim-by-Claim Audit

  **1. "Every outcome with nonzero amplitude happens in some branch... universal wavefunction just evolves deterministically."**
  *   **Verdict:** **Accepted.**
  *   **Confidence:** High.
  *   **Nuance:** This is the definition of the interpretation. The only caveat is that "branch" is not a fundamental ontological category in the math; it is an emergent structure defined by decoherence. A professional would insist that the *wavefunction* is fundamental, and *branches* are approximate, high-level descriptions.

  **2. "The appearance of randomness is an illusion created by decoherence splitting the world into branches..."**
  *   **Verdict:** **Accepted, but restated carefully.**
  *   **Confidence:** High.
  *   **Nuance:** "Illusion" is a bit strong. They prefer "subjective uncertainty" or "indexical uncertainty." The physical process is deterministic; the epistemic state of the agent is uncertain.

  **3. "The now-standard Everettian answer is that you have self-locating uncertainty."**
  *   **Verdict:** **Contested (Live Dispute).**
  *   **Confidence:** High (that it is contested).
  *   **Nuance:** This is a major split in the Everettian camp.
      *   **Sebens & Carroll:** Argue *for* self-locating uncertainty (you don't know *which* copy you are).
      *   **David Wallace:** Argues *against* this framing. He prefers a "fission" model where there is no fact of the matter about "which one you are" until after the split. He thinks invoking self-locating uncertainty concedes too much to the idea that there *should* be a unique outcome.
      *   **Professional Wince:** If you say this is the "now-standard" answer to a Wallaceian, they will correct you. It is *a* standard answer, not *the* standard answer.

  **4. "Before a measurement you don't know which branch you're going to end up on..."**
  *   **Verdict:** **Rejected/Winced At (by Wallaceians).**
  *   **Confidence:** Medium-High.
  *   **Nuance:** If all branches exist, you don't "end up on" one. You *become* multiple successors. The phrase "end up on" presupposes a unique future self, which contradicts the ontology. This phrasing smuggles in a single-outcome intuition that the theory is supposed to eliminate.

  **5. "The squared amplitude is really a kind of measure of existence: branches with larger amplitude are, in some sense, more real or thicker..."**
  *   **Verdict:** **Rejected / Active Wince.**
  *   **Confidence:** High.
  *   **Nuance:** This is the most dangerous sentence in your summary.
      *   **The Wince:** Professionals (especially Wallace) fight *hard* against the idea that some branches are "more real." All branches are equally real. The squared amplitude is a *measure* over the branches (like a probability measure), not an ontological density.
      *   **The Risk:** If branches have "variable reality," you risk collapsing into a "Many-Minds" theory or a theory where low-amplitude branches can be ignored ontologically, which breaks the unitary dynamics.
      *   **Exception:** Lev Vaidman sometimes uses language like "measure of existence," but he defines it carefully as a weighting for probability, not ontological grade. Pop-sci often interprets this as "thicker reality," which is wrong.

  **6. "The Deutsch–Wallace decision-theoretic argument makes this rigorous... Born rule is now a theorem..."**
  *   **Verdict:** **Accepted by Proponents, Contested by Critics.**
  *   **Confidence:** High (that it is contested).
  *   **Nuance:** This is the core of your suspicion. Proponents (Wallace, Deutsch) claim it is a theorem. Critics (Albert, Price, Kent) claim the axioms of rationality secretly assume the Born rule. (See Deep Dive below).

  **7. "Collapse models and Bohmian mechanics... have to put the Born rule in by hand, so Everett wins on parsimony."**
  *   **Verdict:** **Contested.**
  *   **Confidence:** Medium.
  *   **Nuance:**
      *   **Bohmians:** They argue they derive the Born rule via "quantum equilibrium" and typicality arguments (Dürr, Goldstein, Zanghì). They claim it is no more "by hand" than thermal equilibrium in statistical mechanics.
      *   **Everettians:** Counter that Bohmian typicality assumes a measure over initial conditions that looks suspiciously like the Born rule already.
      *   **Verdict:** This is a "my derivation is more natural than your derivation" fight. It is not settled that Everett wins on parsimony, because the cost is shifted from *dynamics* to *decision theory*.

  **8. "There's always some version of you that sees a million heads in a row... you shouldn't plan around it."**
  *   **Verdict:** **Accepted (conditionally).**
  *   **Confidence:** High.
  *   **Nuance:** This follows *if* you accept the DW argument. If you haven't solved the probability problem, you can't justify *why* you shouldn't plan around the low-measure branch. (Why not care about all your successors equally? That's the "branch counting" problem).

  ---

  ### Part 2: Deep Dive on Your Suspicions

  #### Suspicion 1: Is the Deutsch–Wallace argument smuggling the conclusion?
  **Verdict:** **Your suspicion is correct and shared by top critics.** This is not confusion; this is the primary technical objection to modern Everettianism.

  *   **The Charge:** Critics argue that the "rationality constraints" (specifically the **Equivalence** or **Diachronic Consistency** axioms) are not neutral. They effectively require the agent to treat the quantum weights *as if* they were probabilities in order to prove that they *are* probabilities.
  *   **David Albert's Critique:** In *After Physics*, Albert argues that DW shows "if you already believe the Born rule, you should bet according to the Born rule." It doesn't explain why a rational agent in a branching universe *must* care about the Hilbert space norm rather than, say, the number of branches (branch counting).
  *   **Wallace's Defense:** Wallace argues that the Hilbert space structure is the *only* structure available to the agent. There is no well-defined "number of branches" (due to the continuous nature of decoherence), so branch counting is ill-defined. Therefore, rationality *must* latch onto the amplitude.
  *   **Status:** **Live Dispute.**
      *   *Confidence:* High that this is the crux.
      *   *What would change my mind:* A derivation of the Born rule that does not rely on decision-theoretic axioms regarding an agent's preferences, but instead derives probability directly from the symmetries of the Hilbert space (e.g., Zurek's Envariance program), though that program has its own critics regarding circularity.

  #### Suspicion 2: Is "More Real / Thicker" a metaphor doing illicit work?
  **Verdict:** **Yes. It is a metaphor that often breaks the theory.**

  *   **The Problem:** If low-amplitude branches are "less real," why do they still obey the Schrödinger equation? If they are "equally real," why do we weight them differently?
  *   **The Technical Term:** The term of art is **"Hilbert Space Measure."** It is mathematically analogous to probability measure in classical statistical mechanics (Liouville measure).
  *   **Why Professionals Wince:** Saying a branch is "thicker" suggests that if the amplitude goes to zero, the branch disappears. But in MWI, the branch only becomes orthogonal (decohered), not non-existent. The "measure" is for *caring*, not for *existing*.
  *   **Confidence:** High. If you use "measure of existence" in a seminar with David Wallace, he will correct you. If you use it with Lev Vaidman, he might nod, but he will define it strictly as a weighting for subjective probability.

  ---

  ### Part 3: The "Load-Bearing" Claims

  You asked which sentences are load-bearing. Here are the two specific claims that hold up the entire edifice. If these break, the Everettian solution to probability collapses.

  **1. "The number of branches is not a well-defined physical quantity."**
  *   **Why it's load-bearing:** If you can count branches, the rational thing to do is **Branch Counting** (each outcome is equally probable because each happens once). This contradicts the Born Rule.
  *   **Status:** Everettians argue decoherence defines branches only approximately and continuously, so there is no integer count.
  *   **Vulnerability:** Critics argue that even if the count is fuzzy, we can construct discrete cases (e.g., spin measurements) where the branching structure seems discrete. If branch counting is even *possible* in some limit, the DW argument loses its force.

  **2. "Rationality requires caring about successors in proportion to Hilbert Space Measure."**
  *   **Why it's load-bearing:** This is the bridge from "is" (wavefunction amplitude) to "ought" (betting behavior).
  *   **Status:** This is the DW theorem.
  *   **Vulnerability:** This is where the "smuggling" happens. Why is it irrational to care about all successors equally? (The "Nail-biting Everettian" objection). Wallace argues this is like asking "Why is it irrational to care about Tuesday more than Wednesday?"—it violates diachronic consistency. Critics say this assumes a specific notion of personal identity over fission that is not guaranteed by the physics.

  ---

  ### Part 4: Summary of the State of Play

  **Is the Born Rule derived or assumed?**
  *   **Everettian Consensus:** Derived (via Decision Theory).
  *   **External Consensus (Philosophy of Physics):** Not yet convincingly derived. The derivation relies on premises that are as controversial as the conclusion.
  *   **My Read:** The DW argument is the most sophisticated attempt to solve the problem, but it has not silenced critics. It has shifted the burden from "postulating probability" to "postulating rationality constraints that imply probability." Whether that counts as a derivation depends on whether you view those constraints as analytic truths of rationality or hidden physical assumptions.

  **Does Everett win on Parsimony?**
  *   **Verdict:** **Unclear.**
  *   **Reasoning:** Everett removes the Collapse Postulate (gain) but adds a complex Decision-Theoretic apparatus + a controversial ontology of branching persons (cost). Bohm removes Collapse (gain) but adds Pilot Waves + Quantum Equilibrium (cost). GRW keeps one world (gain for intuition) but adds stochastic dynamics (cost for elegance).
  *   **Confidence:** Medium. Parsimony is in the eye of the beholder here.

  **What should you tell yourself about the "Million Heads" scenario?**
  *   If you accept MWI + DW, you say: "That branch exists, but its measure is $2^{-1,000,000}$. Rationality dictates I ignore it."
  *   If you reject DW, you say: "That branch exists and is just as real as this one. I have no coherent reason to ignore it other than pragmatic sanity."

  ### Final Verdict on Your Summary
  Your pop-phics summary is **85% accurate to the Everettian self-conception**, but it glosses over the **15% of technical nuance where the entire philosophical viability of the theory rests.**

  *   **The "Smuggling" Suspicion:** Validated. This is the main objection in the literature.
  *   **The "Thicker Branch" Metaphor:** Validated as a wince-point. It is ontologically dangerous.
  *   **The "Self-Locating Uncertainty":** Validated as one of two competing Everettian strategies (the other being Fission).

  **Confidence in this Audit:** High. This maps directly onto the debates found in *The British Journal for the Philosophy of Science*, *Studies in History and Philosophy of Modern Physics*, and the works of Wallace, Albert, Carroll, and Saunders.

  **What would change my mind?**
  1.  **On DW:** If a derivation of the Born Rule were found that did not rely on agent preferences or decision theory (e.g., a purely dynamical symmetry argument that survived scrutiny).
  2.  **On Parsimony:** If a clear metric for "ontological cost" were agreed upon that could quantify whether "branching persons" cost more than "collapse dynamics." (Currently, this is qualitative).
  3.  **On "Thickness":** If an Everettian successfully argued that amplitude *is* ontological density without breaking unitarity. (Currently, this is viewed as a category error).

  You are not confused. The confusion is a feature of the territory, not a bug in your understanding. The "derivation" of probability in MWI remains the single most contentious open problem in the interpretation of quantum mechanics.
