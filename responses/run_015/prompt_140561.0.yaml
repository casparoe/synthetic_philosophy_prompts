      *   **Specific Focus:** Identify "load-bearing" claims vs. contested ones. Address the user's suspicion about the Deutsch-Wallace (DW) decision-theoretic argument (is it circular/smuggling assumptions?). Address the "measure of existence/thicker branches" metaphor.
      *   **Requirement:** Be explicit about confidence levels (uncontested vs. live dispute vs. personal read). Flag where professionals would disagree. State what would change my mind on contested points.
