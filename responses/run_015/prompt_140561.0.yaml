          *   *Nuance:* "Branch" is emergent, not fundamental. Decoherence defines them.

      *   *Claim 2:* "...appearance of randomness is an illusion created by decoherence splitting the world into branches that can't see each other."
          *   *Status:* Accepted, but "illusion" is a strong word. "Subjective uncertainty" is the preferred term.

      *   *Claim 3:* "The now-standard Everettian answer is that you have self-locating uncertainty."
          *   *Status:* This is *one* major camp (Sebens & Carroll), but not the *only* one. Wallace prefers a different framing (fission without uncertainty). This is a live dispute.

      *   *Claim 4:* "Before a measurement you don't know which branch you're going to end up on..."
          *   *Status:* Contested. If all branches exist, do you "end up on" one? Or do you fission into successors? This ties into Claim 3.

      *   *Claim 5:* "...rational credence turns out to be the squared amplitude — which is just the Born rule."
          *   *Status:* The *goal* of the program. Whether it succeeds is the big debate.

      *   *Claim 6:* "The squared amplitude is really a kind of measure of existence: branches with larger amplitude are, in some sense, more real or thicker or take up more of the multiverse..."
          *   *Status:* **Major Red Flag.** "More real" is usually rejected. "Measure" is mathematical, not ontological density. Wallace explicitly argues against "branch counting" or "thickness" as ontological. This is a common pop-sci distortion.

      *   *Claim 7:* "The Deutsch–Wallace decision-theoretic argument makes this rigorous: they show that any agent whose preferences satisfy a handful of obviously-rational-sounding constraints has to bet exactly as if the Born rule were true..."
          *   *Status:* Accurate description of the *argument*. Whether the constraints are "obviously-rational" is the crux of the objection (e.g., Price, Kent, Albert).

      *   *Claim 8:* "...probabilities aren't bolted on to the theory as an extra postulate, they're derived from the dynamics plus rationality alone, so the Born rule is now a theorem of many-worlds rather than an assumption."
          *   *Status:* The *claim* of the Everettians. Critics say it's circular or assumes probability to derive probability.

      *   *Claim 9:* "Collapse models and Bohmian mechanics, by contrast, have to put the Born rule in by hand, so Everett wins on parsimony."
          *   *Status:* Contested. Bohmians argue they derive it via typicality (Dürr, Goldstein, Zanghì). GRW puts it in dynamically. Parsimony argument depends on whether you count the "derivation" as successful.

      *   *Claim 10:* "...there's always some version of you that sees a million heads in a row — it's just extremely low-measure, so you shouldn't plan around it."
          *   *Status:* Accepted consequence, but the "shouldn't plan around it" relies on the Born rule being justified (linking back to Claim 7/8).

  3.  **Address the User's Specific Suspicions:**
