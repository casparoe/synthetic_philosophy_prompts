      *   *Idea:* Distinguish between *Fidelity to Mandate* (institutional) vs. *Identity-Constituting Commitment* (Williamsian). The paper could argue that institutions *cannot* have Williamsian integrity, only fidelity, which changes the force of the objection. Or, it could argue that certain institutions (arts patronage) *do* require something like ground projects.

  7.  **Review against Constraints:**
