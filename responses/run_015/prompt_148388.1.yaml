answer: |-
  This is a sophisticated and viable proposal. It identifies a genuine gap in the literature (the institutional extension of the integrity objection) and sets clear success/failure conditions. However, the pivot from individual to institutional agency introduces a category risk that must be managed carefully to avoid the "trivial resolution" failure mode you identified.

  Below is an assessment of the proposal's philosophical architecture, the requested mapping of settled versus contested claims, and specific methodological recommendations for the 12-week timeline.

  ### 1. Assessment of Viability and Scope
  **Strengths:**
  *   **Novelty:** Most responses to Williams focus on individual moral psychology. Applying the "one thought too many" to institutional mandates (triage, patronage) is underexplored.
  *   **Constraints:** Explicitly ruling out historical exegesis keeps the project focused on structural argumentation, which is appropriate for a 25-page paper.
  *   **Failure Conditions:** You have correctly identified that the project fails if "institutional integrity" merely becomes "rule-following" (which utilitarians accept) or if it collapses into "institutional preferences" (which utilitarians absorb).

  **Risks:**
  *   **The Category Mistake:** Williams's concept of integrity is tied to *personal identity*. Institutions do not have identities in the same existential sense; they have mandates. If you define "institutional integrity" simply as "adherence to mandate," a utilitarian will agree immediately (rules maximize utility), and your objection vanishes. You must argue that institutions can have *commitments* that are not merely instrumental rules.
  *   **The Triage Trap:** Medical triage is often cited as a counter-example to Williams because impartiality is *required* there. If you argue a triage officer should save their spouse, you are arguing against the institution's purpose. You need to distinguish between the *operator's* integrity and the *institution's* integrity.

  ### 2. Mapping Settled vs. Contested Claims
  Per your request, here is the distinction required to ground your argument without misrepresenting the literature.

  **Settled (Exegetical/Structural Consensus)**
  *   **Williams's Claim:** It is settled that Williams *argues* utilitarianism requires a neutrality between an agent's ground projects and the projects of others that threatens the agent's identity.
  *   **The Structure of the Objection:** It is settled that the "one thought too many" example is intended to illustrate a phenomenological alienation: the agent relates to their own commitments via the moral theory rather than directly.
  *   **Ground Projects:** It is settled that Williams defines "ground projects" as commitments so central to an agent's life that removing them would render the agent's existence meaningless or unintelligible to them.

  **Contested (Substantive/Philosophical Disagreement)**
  *   **The Force of the Objection:** It is highly contested whether this alienation is a *reductio* of utilitarianism or merely a psychological cost worth paying for impartial morality. (Many utilitarians argue integrity is a virtue only if it tracks the good).
  *   **Incommensurability:** It is contested whether ground projects are truly incommensurable with moral demands, or whether they can be weighted within a sophisticated utility function (e.g., Hare's two-level utilitarianism).
  *   **Institutional Applicability:** It is **radically contested** (and largely unexplored) whether Williams's notion of integrity can coherently apply to non-human agents. Some argue institutions are *defined* by their impartiality, making "integrity" in the Williamsian sense a category error.
  *   **The "One Thought" Diagnosis:** It is contested whether the problem is the *presence* of the thought (the calculation) or the *motivation* behind it. Some critics argue the spouse-saver can calculate and still act on love, provided the calculation doesn't *motivate* the act.

  **Guidance for the Proposal:**
  In your paper, you must treat the **Settled** list as your premises (e.g., "Williams defines integrity as...") and the **Contested** list as the field of play. Do not assert that utilitarianism *fails* to account for ground projects as a fact; assert that *if* Williams is right about the phenomenology of commitment, *then* the institutional extension creates a specific tension.

  ### 3. Methodological Recommendations

  #### A. Refining the "Institutional Agent"
  To avoid the trivial resolution where "institutional integrity = following the rules," you need to posit that institutions can have **constitutive aims** that function like ground projects.
  *   *Hypothesis:* An Arts Patronage Board has a constitutive aim (e.g., "preserve avant-garde risk") that might conflict with a utilitarian calculus (e.g., "fund popular art that maximizes aggregate happiness").
  *   *Test:* If the Board calculates the utility of funding avant-garde art before committing to it, have they had "one thought too many"? Or is that simply prudent management?
  *   *Differentiation:* This distinguishes the Arts Board (where partiality to a specific vision might be integral) from Triage (where impartiality is integral). This contrast will strengthen your case studies.

  #### B. Case Study Specifics
  *   **Medical Triage:** Be careful here. The "one thought too many" is usually a bug in personal life but a feature in public health.
      *   *Pivot:* Focus on the *exception* protocols. Does a triage officer violate institutional integrity if they prioritize a family member? Or does the institution lack integrity if it *forces* them to calculate?
      *   *Better Angle:* Focus on the **design** of the protocol. Does a protocol that requires explicit utilitarian calculation (e.g., QALYs) institutionalize the "one thought too many," thereby corrupting the moral character of the practitioners?
  *   **Artistic Patronage:** This is your stronger case.
      *   *Scenario:* A board committed to a specific, unpopular artistic vision.
      *   *Conflict:* A utilitarian audit suggests shifting funds to community outreach to maximize "well-being."
      *   *Williamsian Defense:* Shifting funds because the calculus demands it betrays the *ground project* of the institution (the art itself), reducing the art to a tool for welfare.

  #### C. Avoiding the "Preference" Collapse
  Utilitarians will argue that an institution's "ground project" is just a "preference function" to be weighted.
  *   *Counter-move:* Argue that ground projects are **identity-constituting**, not preference-satisfying. A preference is something I *have*; a ground project is something that *makes me*. If an institution changes its mandate to maximize utility, it ceases to be *that* institution. If a utilitarian absorbs this, they must admit that maximizing utility might require destroying the institution's identity. This forces the hard choice you are looking for.

  ### 4. Proposed 12-Week Schedule

  *   **Weeks 1–3: Foundations.**
      *   Read Williams ("Persons, Character, and Morality"; "A Critique of Utilitarianism").
      *   Draft the "Settled vs. Contested" map for your own reference.
      *   Define "Institutional Integrity" working definition.
  *   **Weeks 4–6: The Institutional Extension.**
      *   Develop the argument: Can institutions have ground projects?
      *   Draft the "Role-Integrity vs. Personal-Integrity" distinction.
      *   *Milestone:* 5-page prospectus on the definition of institutional agency.
  *   **Weeks 7–9: Case Studies.**
      *   Apply the framework to Triage and Patronage.
      *   Identify where the "one thought too many" appears in institutional rules (e.g., mandatory impact assessments).
      *   Draft the core argument (15 pages).
  *   **Weeks 10–11: Synthesis and Refinement.**
      *   Address the "Preference Collapse" objection (the utilitarian counter-move).
      *   Complete the 25-page draft.
  *   **Week 12: Presentation Prep.**
      *   Condense argument into 20-minute workshop format.
      *   Prepare handout with the "Criteria for Institutional One-Thought-Too-Many."

  ### 5. Final Advice on the "Failure Conditions"
  You stated the project fails if the distinction collapses into preference-based reasoning. To guard against this:
  *   **Explicitly engage with R.M. Hare or Peter Singer.** They represent the utilitarian absorption of commitments. If you can show why their "two-level" or "preference" solutions do not capture the *normative force* of an institutional mandate (e.g., why an Art Board *ought* to be partial to art, not just happen to be), you succeed.
  *   **Focus on Normativity, not Psychology.** Institutions don't have feelings. Therefore, the "phenomenology" of commitment must be translated into **normative constraints**. The argument should be: "An institution that treats its mandate as contingent on utility calculations is normatively defective, not just psychologically alienated."

  This proposal is strong. If you maintain the distinction between *constitutive aims* (integrity) and *instrumental goals* (utility), you will have a compelling paper.
