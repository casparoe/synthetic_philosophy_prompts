prompt: |-
  I am a doctoral researcher in platform labour economics with a working fluency in algorithmic management — dynamic pricing, real-time routing, worker-facing ratings, behavioural data extraction through app interfaces, and just-in-time task allocation — but only an undergraduate familiarity with Marxist theory. I want you to act as a professional philosopher of political economy who can move precisely between classical Marxism and contemporary digital labour studies, and I need you to think carefully before answering. Please begin with a short brainstorming note on the structural parallels and mismatches you anticipate, then provide a brief, unquoted outline of Marx’s account of exploitation — specifically the extraction of surplus value through the wage relation — and of his four dimensions of alienation (from the product of labour, the labour process itself, human species-being, and other workers), drawing on Marx’s early writings on alienation and on Capital. Do not provide bibliographies, reading lists, or citations, and avoid putting any passage in quotation marks unless you have verified the wording from a source; paraphrase freely.

  Then, restate that entire framework — exploitation and all four alienations — in the vocabulary I actually use: algorithmic matching, surge pricing, worker ratings, behavioural data extraction, just-in-time task allocation, and the platform’s continuous optimisation of labour supply via feedback loops rather than direct command. Be as faithful as possible: do not import normative assumptions about contractor freedom, but do use the technical architecture of gig-work platforms. After the translation, provide a structured residue report. For each core claim, indicate whether it translates cleanly, only with distortion, or has no counterpart in this vocabulary. Pay particular attention to the concept of species-being (Gattungswesen) and to the labour theory of value: do these survive in a system where value is apparently generated through data feedback loops and predictive routing rather than through socially necessary labour time? Finally, assess whether the residues show that the platform-economics vocabulary is missing something structurally or morally important, or whether they indicate that Marx’s formulation was historically specific and does not generalise to algorithmically mediated labour.

  Please write in British English, present the residue report as a clearly labelled list, and conclude with your judgement on whether the untranslatable remainder is a defect of my framework or a limit in the original theory’s scope.
