answer: |-
  Here is a decision procedure designed for your committee's constraints. It avoids historical jargon, relies on evidence your grad student can actually find, and separates factual questions from value judgments. It is written to be handed to a chemist or a trustee without translation.

  ### The Commemoration Decision Procedure

  **Purpose:** To determine whether a name, plaque, or portrait should remain, be contextualized, or be removed.
  **Standard of Proof:** Preponderance of evidence (more likely than not).
  **Default Position:** Status quo remains unless steps below justify change.

  **Step 1: Factual Verification (The "Truth" Check)**
  *   **Question:** Are the specific claims made in the petition factually accurate?
  *   **Sufficient Answer:** Yes, the records confirm the alleged actions occurred. OR No, the records contradict the petition.
  *   **Instruction:** If the petition relies on selection presentism (true facts chosen to mislead), note this but proceed only if the facts themselves are relevant to institutional values.
  *   **Stop:** If **No** (claims are false), recommend **Retain Name**. End process.
  *   **Type:** Fact.

  **Step 2: Contemporary Availability (The "Could He Know?" Check)**
  *   **Question:** At the time the harmful actions occurred, was there a publicly available argument or objection within the agent's community that identified this action as wrong?
  *   **Sufficient Answer:** Yes, contemporary records (newspapers, letters, meeting minutes) show peers or victims objected *at the time*. OR No, the record is silent, or the objection is purely a later invention.
  *   **Instruction:** Do not ask if they used our words (e.g., "racist"). Ask if they had access to the *concept* (e.g., "unjust," "un-Christian," "unscientific").
  *   **Thin Record Rule:** If the record is silent due to suppression (e.g., enslaved people could not publish), treat as **Yes**. If the record is silent due to indifference (e.g., no one cared about child labor), treat as **No**.
  *   **Stop:** If **No** (no contemporary objection available), recommend **Retain Name** (optionally with context). End process. *This prevents judging the past by standards it could not access.*
  *   **Type:** Fact.
  *   **Warning:** This is the step you will be tempted to fudge. If you want a removal, you will look harder for dissent. If you want retention, you will accept silence as consent.

  **Step 3: Agency and Leadership (The "Peer Comparison" Replacement)**
  *   **Question:** Did the agent merely participate in a common practice, or did they innovate, enforce, or profit disproportionately from the harmful practice?
  *   **Sufficient Answer:** They led/enforced/profited disproportionately. OR They participated at the standard level for their class/role.
  *   **Instruction:** Do not ask "Was he worse than his peers?" Ask "Did he make the practice worse?"
  *   **Stop:** If **Participated at standard level** AND Step 2 was **No**, recommend **Retain Name**.
  *   **Type:** Fact/Value Hybrid.

  **Step 4: Present Alignment (The "Honoring is Present Tense" Check)**
  *   **Question:** Does keeping this name actively hinder the university's current core mission or values?
  *   **Sufficient Answer:** Yes, the name causes documented harm to current students/faculty or contradicts stated institutional values. OR No, the name is neutral or historically interesting without causing active harm.
  *   **Instruction:** This is not about whether the person was "good." It is about whether the *honor* functions well today.
  *   **Hand-off:** If **Yes**, this is a value judgment. The Committee recommends **Remove/Contextualize**, but the Board of Trustees must make the final call based on institutional risk.
  *   **Type:** Value.
  *   **Warning:** This is where your politics enter. Be explicit about which "values" are being cited (e.g., "Student Safety" vs. "Academic Freedom").

  **Step 5: Practical Constraints (The "Contract" Check)**
  *   **Question:** Are there legal or financial barriers to removal (e.g., gift agreements, donor relationships)?
  *   **Sufficient Answer:** Yes, binding contract exists. OR No, no legal barrier.
  *   **Instruction:** If Yes, the Committee recommends removal on principle but notes the legal barrier to the Board.
  *   **Type:** Fact.

  ***

  ### Application to Cases

  **Case 1: The Textile Manufacturer (1840s)**
  *   **Step 1:** Facts verified. He employed children.
  *   **Step 2:** **No.** Your researcher finds no local complaints. Child labor was standard; the concept of "child labor rights" was not available in his town.
  *   **Result:** The procedure stops here. We cannot judge him by a standard that did not exist for him.
  *   **Verdict:** Retain Name. (Optional: Add plaque noting historical context of labor).
  *   **Note:** This feels uncomfortable, but it is the only way to avoid pure presentism.

  **Case 2: The Eugenics Professor (1910s/20s)**
  *   **Step 1:** Facts verified. He published eugenic views.
  *   **Step 2:** **Yes.** Colleagues at *this* university objected publicly at the time. The objection was available to him.
  *   **Step 3:** **Led/Enforced.** He published and promoted these views, not just held them.
  *   **Step 4:** **Yes.** Eugenics contradicts current university values of equality and inclusion.
  *   **Verdict:** Recommend Removal. Hand-off to Board for final approval.

  **Case 3: The Formula Donor (1990s)**
  *   **Step 1:** Facts verified. Firm marketed aggressively; boycotts existed.
  *   **Step 2:** **Yes.** Boycotts and clinician objections were happening *while* he was donating. He dismissed them. The objection was available.
  *   **Step 3:** **Led/Enforced.** He actively dismissed critics and profited from the practice.
  *   **Step 4:** **Yes.** Predatory marketing contradicts health/welfare values of the university.
  *   **Step 5:** **Yes.** Gift agreement binds the name.
  *   **Verdict:** Recommend Removal on principle, but note legal barrier.
  *   **Unwelcome Truth:** Structurally, Case 3 is identical to Case 2. Both involved agents who knew better (Step 2) and led the harm (Step 3). The only difference is Step 5 (Money/Contract). If you treat Case 2 and Case 3 differently, you are admitting that money matters more than eugenics. The procedure does not allow that distinction.

  ***

  ### Case Summary Table

  | Case | The step the case turns on | What the record would have to show to flip the answer | Verdict or hand-off | Who signs off |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Textile Mfg.** | Step 2 (Availability) | Evidence that local peers called child labor "wrong" in the 1840s. | Retain Name | Committee |
  | **2. Eugenics Prof.** | Step 2 (Availability) | Evidence that no colleagues objected at the time (highly unlikely). | Remove (Hand-off to Board) | Board of Trustees |
  | **3. Formula Donor** | Step 5 (Constraints) | Evidence that the gift agreement allows for moral clause termination. | Remove (Legally Blocked) | Board of Trustees |

  ***

  ### JSON Object

