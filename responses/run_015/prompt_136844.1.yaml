  ### Notes on the Procedure

  **1. The "Fudge" Point**
  You identified that you might be tempted to smuggle politics into the "Present Tense" step. In this procedure, the temptation actually lies in **Step 2**. It is very easy to decide that "silence due to suppression" applies when you want a removal, and "silence due to indifference" applies when you want retention. Your grad student cannot solve this; they can only report the silence. You must vote on the *interpretation* of the silence openly. I recommend the committee vote on Step 2 classifications by roll call so the reasoning is on the record.

  **2. The Unwelcome Result (Case 3)**
  As requested: Case 3 is structurally identical to Case 2. Both pass Step 2 (objections were available then) and Step 3 (they led the harm). The procedure demands the same recommendation (Removal). The only difference is Step 5 (the contract). If the Committee recommends keeping Case 3 while removing Case 2, you are formally stating that financial leverage outweighs ethical consistency. The procedure exposes this; it does not solve it. The Board must decide if they can afford the lawsuit.

  **3. Killing "Peer Comparison"**
  Step 3 replaces "Was he worse than his peers?" with "Did he lead or follow?" This prevents the "everyone was racist then" defense. If everyone was racist, but he didn't write the manuals or enforce the policies, he passes Step 3. If he wrote the manuals, he fails Step 3, regardless of how many peers agreed with him. This focuses on *agency*, not *average morality*.

  **4. Thin Records**
  The "Thin Record Rule" in Step 2 is your safety valve. If the people who would have objected were barred from speaking (enslaved people, women in 1840, workers in a company town), you must treat the silence as if they *had* objected. If the people were free to speak and simply didn't (townspeople in 1840 regarding child labor), treat the silence as acceptance. This requires a judgment call, but it is a defined one.
