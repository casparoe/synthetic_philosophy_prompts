answer: |-
  ### Part I: Conceptual Mapping and Case Space Analysis

  Before drafting the desiderata, we must map the terrain. The core task is to define *authority*, not *good*. Authority implies a right to rule that exists independently of the outcome's quality. If an advance directive (AD) is authoritative, it binds the surrogate even if the surrogate believes the decision is suboptimal for the patient's welfare.

  **1. Grouping the Hard Cases**
  To test the limits of authority, I group your cases into three families of conflict:

  *   **Family A: The Discontinuity Problem (Identity)**
      *   *Cases:* Ordinary Dementia; Never-Competent.
      *   *Conflict:* The metaphysical link between the author and the patient is severed or never existed.
      *   *Test:* Does authority survive the death of the psychological traits that generated it? If the "never-competent" case is excluded, is that a bug or a feature? *Verdict:* For a theory of *precedent autonomy*, exclusion is a feature. Authority requires a source; a guardian cannot generate precedent autonomy for another. This case belongs to a theory of *proxy consent*, not *advance directive authority*.
  *   **Family B: The Authenticity Problem (Temporality)**
      *   *Cases:* Velocity Problem; Phase-Cycling; Proleptic Directive.
      *   *Conflict:* Which temporal slice is the "true" legislator? Is authority a function of stability (20 years vs. 3 weeks) or state (medicated vs. unmedicated)?
      *   *Test:* If we prioritize stability, we penalize moral growth or conversion. If we prioritize recency, we invite impulsivity.
  *   **Family C: The Precommitment Problem (Agency)**
      *   *Cases:* Ulysses Clause; Ratchet Directive; Dementia Resistance.
      *   *Conflict:* Can the past self disable the future self's agency, even when that future self objects?
      *   *Test:* This is the crux of *authority*. If the present self can veto the AD simply by objecting, the AD is not authoritative; it is merely advisory.

  **2. Stress-Testing Candidate Requirements**
  I will now take potential requirements and ask: *What is the cost of giving this up?*

  *   *Candidate: The Competence Threshold.* (ADs require prior competence).
      *   *Cost of giving up:* We conflate *substituted judgment* (what they would want) with *precedent autonomy* (what they decided). We allow guardians to wield "authority" they cannot possess.
      *   *Verdict:* Keep. It defines the scope.
  *   *Candidate: The Current Objection Veto.* (Present resistance voids the AD).
      *   *Cost of giving up:* We allow the "tyranny of the present moment." A demented patient's fear of a needle overrides a decades-old commitment to die with dignity.
      *   *Cost of keeping:* We risk cruelty to a currently content being.
      *   *Verdict:* This is the main tension point. It cannot be absolute.
  *   *Candidate: The Binary Switch.* (The patient is either competent or not; the AD is either valid or not).
      *   *Cost of giving up:* Clinical paralysis. Surrogates cannot act on degrees of validity in an emergency.
      *   *Cost of keeping:* Metaphysical falsehood. Identity and capacity are gradual (per your constraints).
      *   *Verdict:* Keep for policy, acknowledge as a necessary fiction.
  *   *Candidate: The Epistemic Ceiling.* (Surrogates cannot claim to know the present self's subjective experience better than the present self).
      *   *Cost of giving up:* Paternalism. We assume we know the dementia patient is "happy" better than they do.
      *   *Verdict:* Keep. Aligns with affective forecasting constraints.

  **3. The Interface with "The Good"**
  The theory must not define the patient's good, but it must have a "circuit breaker." If the AD mandates something that violates basic humanitarian standards (e.g., torture, neglect), authority ceases. This is not a failure of the theory of authority, but a boundary condition of the legal/moral system in which authority operates.

  ---

  ### Part II: Desiderata for a Theory of Precedent Authority

  Below are the requirements for an adequate theory of the earlier self's authority.

  **1. The Source Condition (Non-Negotiable)**
  *   **Requirement:** Authority originates *only* from a state of decisional competence.
  *   **Justification:** Without competence, there is no autonomy to project forward.
  *   **Cost of Abandonment:** Collapses the distinction between *advance directives* (self-rule) and *guardian judgments* (other-rule). The "Never-Competent" case is thus a scope limit, not a defect.
  *   **Case:** Never-Competent Patient.

  **2. The Specificity Constraint (Non-Negotiable)**
  *   **Requirement:** The instruction must apply to the clinical situation with a degree of specificity that bridges the "foreseen vs. actual" gap. General values ("I don't want to be a burden") do not carry the same authority as specific instructions ("No intubation if PEG is required").
  *   **Justification:** Authority over a specific act requires intent regarding that act.
  *   **Cost of Abandonment:** Surrogates impose their own interpretation of vague values, effectively rewriting the will.
  *   **Case:** Ordinary Dementia (where the situation wasn't precisely foreseen).

  **3. The Stability Proxy (Camp Preference: Autonomy-Primacy)**
  *   **Requirement:** Duration of endorsement correlates with weight of authority. A 20-year standing instruction outweighs a 3-week enthusiasm.
  *   **Justification:** Mitigates the "Velocity Problem." Stability is the best available proxy for deep identity rather than transient state.
  *   **Cost of Abandonment:** Impulsive directives gain equal footing with reflective life-plans.
  *   **Case:** The Velocity Problem.

  **4. The Non-Collapsibility Clause (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between the AD having *authority* (veto power) versus *input* (one factor in a best-interests calculation).
  *   **Justification:** If the AD is merely input, it is not an advance *directive*; it is an advance *suggestion*.
  *   **Cost of Abandonment:** The concept of precedent autonomy dissolves into best-interests paternalism.
  *   **Case:** All cases (foundational).

  **5. The Epistemic Humility Rule (Non-Negotiable)**
  *   **Requirement:** Surrogates must presume they lack access to the present self's phenomenological state. They cannot override an AD based on the assumption that the patient is "happier now."
  *   **Justification:** Aligns with the constraint that affective forecasting is poor and outsiders cannot access inner experience.
  *   **Cost of Abandonment:** Surrogates impose external judgments of "quality of life" that the patient explicitly rejected.
  *   **Case:* Ordinary Dementia (contented patient).

  **6. The Humanitarian Circuit-Breaker (Non-Negotiable)**
  *   **Requirement:** Authority terminates if the instruction mandates treatment (or non-treatment) that violates basic standards of care or constitutes abuse/neglect as defined by law/ethics.
  *   **Justification:** Authority is a social/legal grant, not a metaphysical absolute. It exists within a moral ecosystem.
  *   **Cost of Abandonment:** The theory permits morally abhorrent outcomes (e.g., starving a patient who is currently eating happily, if the AD demands it).
  *   **Case:** Ratchet Directive / Ulysses Clause (extreme versions).

  ---

  ### Part III: Classification and Impossibility Theorems

  **1. Non-Negotiable vs. Camp Preferences**
  *   **Non-Negotiable:** Source Condition, Specificity Constraint, Non-Collapsibility Clause, Epistemic Humility, Humanitarian Circuit-Breaker. These are required for the concept of *authority* to exist distinct from *beneficence*.
  *   **Camp Preference:** **The Stability Proxy.** A "Narrative Self" camp would argue that a profound conversion (even if recent) carries more authority than 20 years of inauthentic living. A "Precedent Autonomy" camp argues stability. I have listed it as a preference because a theory *could* prioritize depth of conviction over duration, but it pays a high price in clinical predictability.

  **2. Jointly Unsatisfiable Desiderata (The Impossibility Theorem)**
  *   **The Conflict:** **The Binary Switch Requirement** (Policy Necessity) vs. **The Gradual Identity Constraint** (Metaphysical Truth).
  *   **Argument:** Personal identity and capacity are gradual (Parfitian constraint). However, clinical policy requires a binary decision (Treat/Do Not Treat). A theory cannot map a continuous metaphysical reality onto a binary legal switch without an arbitrary cutoff.
  *   **Resolution:** The theory must explicitly acknowledge that the "Competence Threshold" is a *legal fiction* necessary for action, not a metaphysical truth. We cannot satisfy both "Metaphysical Accuracy" and "Clinical Actionability." We must sacrifice Accuracy for Actionability.

  **3. The Exclusionary Requirement**
  *   **Requirement:** **The Non-Collapsibility Clause.**
  *   **Why:** This is the single requirement that does the most work in excluding otherwise attractive views. Most clinical ethics committees naturally drift toward a "Balancing View" (weigh the AD against current happiness). This is attractive because it feels compassionate and flexible. However, the Non-Collapsibility Clause forbids this. It demands that if the AD is valid, it *rules*, even if the balance of interests suggests otherwise. This excludes the "Best Interests" family of views entirely from the domain of *authority*, relegating them to a fallback position only when authority is absent.

  ---

  ### Part IV: Scoring the Families of Views

  **1. The Integrity-Based View (Dworkin)**
  *   **Score:** High on Authority (Non-Collapsibility), High on Source Condition.
  *   **Failure:** Fails **Epistemic Humility**. Dworkin argues we must respect the "critical interests" of the earlier self even if the "experiential interests" of the demented self contradict them. This risks ignoring the reality of the present suffering. It also struggles with the **Humanitarian Circuit-Breaker** if the earlier self's integrity demands something currently viewed as neglect.

  **2. The Current-Interests / Best-Interests View**
  *   **Score:** High on Epistemic Humility (prioritizes present experience).
  *   **Failure:** Fails **Non-Collapsibility**. It reduces the AD to mere input. It cannot account for the *authority* of the earlier self, only the *welfare* of the present self. It dissolves the problem rather than solving it.

  **3. Value-Endorsement / Narrative Views**
  *   **Score:** High on Stability/Velocity nuances (can explain why a conversion matters).
  *   **Failure:** Fails **Actionability/Binary Switch**. Determining which narrative is "authentic" requires deep biographical investigation impossible at the bedside. It is too computationally expensive for the clinical context.

  **4. Parfit-Style Reductionism**
  *   **Score:** High on Metaphysical Truth (acknowledges Gradual Identity).
  *   **Failure:** Fails **Source Condition** and **Actionability**. If identity is just psychological connectedness, and that is broken, there is no "earlier self" to have authority. This view dissolves the framing of the problem entirely, leaving the committee with no tool to justify honoring the document other than social utility.

  **Recommendation:** The committee should adopt a hybrid that leans on **Dworkin for the default rule** (precedent autonomy binds) but incorporates the **Humanitarian Circuit-Breaker** and **Epistemic Humility** as safety valves. You must accept the **Impossibility Theorem**: you are drawing a bright line on a gradient. Do not pretend the line is metaphysically real; treat it as a necessary tool for decision.
