answer: |-
  You have stumbled onto the central failure mode of behavioral AI, and your friend is half-right but dangerously so.

  There is a name for the root error, though it lives in different disciplines under different masks. In economics, it is the failure to distinguish the **Utility Function** (what I want) from the **Feasible Set** (what I can do). In econometrics, it is the **Identification Problem**. In machine learning, it is **Performative Prediction**.

  But for your team, I suggest you call it **Constraint Mimicry**.

  Constraints mimic preferences in observational data. A wall looks exactly like a "strong preference not to walk further" if you only measure footsteps. A cage looks exactly like a "preference to stay home" if you only measure location.

  Here is the carving you asked for. Your three problems are not three different bugs; they are three mechanisms by which Constraint Mimicry enters your system.

  ### 1. The Stairwell: Performative Feedback (The Loop)
  **The Mechanism:** Your system doesn't just watch; it acts. By acting on its inference ("people don't want the stairs"), it alters the environment (stops suggesting stairs), which removes the opportunity to test the inference.
  **The Technical Name:** **Performative Prediction** or **Endogenous Censoring**.
  **Why it's Constraint Mimicry:** The clutter was a constraint. The system interpreted it as a preference. By codifying that interpretation into its suggestions, it turned a temporary constraint into a permanent structural rule. It solidified the wall.
  **The Edge:** This only happens when the model has *agency*. A passive camera would just be wrong; your system makes itself right by removing the counter-evidence.

  ### 2. The Scripted Worker: The Variance Paradox (The Signal)
  **The Mechanism:** Your model treats consistency as confidence. But in behavioral science, consistency is often a measure of *external pressure*, not internal desire.
  **The Technical Name:** **Confounding Agency with Constraint** (or the **Identification Problem of Agency**).
  **Why it's Constraint Mimicry:** The scripted worker has a Feasible Set of size 1. They *must* do the thing. The flexible worker has a Feasible Set of size 100. When they choose one thing, that is a high-signal revelation of preference. When the scripted worker chooses the one thing, it is zero signal. Your model is inverting the signal-to-noise ratio. It trusts the robot more than the human.
  **The Edge:** This is where your friend's argument ("you can't tell from the outside") is most dangerous. From a static snapshot, a prisoner and a monk look identical (both sit still all day). You cannot tell them apart without knowing the *bounds of their possibility*.

  ### 3. The Window Seat: Omitted Variable Bias (The Proxy)
  **The Mechanism:** The model sees Choice A over Choice B. It assumes the variable distinguishing them is "Aisle vs. Window." The actual variable was "Sun vs. No Sun."
  **The Technical Name:** **Omitted Variable Bias** or **Latent Confounding**.
  **Why it's Constraint Mimicry:** The sun is a constraint. The model treats it as a preference for aisle seats. If you move her to a window seat on the north side (no sun), she might take it. Your model predicts she won't.
  **The Edge:** This is the classic "correlation is not causation" error, but specifically regarding *latent constraints*.

  ### The Unifying Phenomenon: The Feasibility Fallacy

  All three are instances of **The Feasibility Fallacy**: **Assuming that Observed Behavior = Max(Preference), when actually Observed Behavior = Max(Preference | Constraints).**

  Your system is trying to solve for *Preference*, but it is observing *Preference constrained by Reality*. Because it doesn't measure Reality (the clutter, the shift schedule, the sun angle), it attributes the shape of Reality to the shape of the Person.

  ### Addressing Your Friend

  Your friend says: *"You can never tell the difference from the outside."*
  This is the stance of **Radical Behaviorism**. It was popular in psychology in the 1950s and is largely dead now for this exact reason.

  Your friend is right **only if you remain passive.** If you only watch, a wall and a preference are mathematically indistinguishable.
  Your friend is wrong **because you are building an agent.** You have the power to *perturb*.

  **The Test: Counterfactual Perturbation**
  To distinguish a preference from a wall, you must gently push on the wall.
  *   **The Stairwell:** Occasionally suggest the stairwell anyway (explore). If they take it when clutter is gone, it was a wall. If they still avoid it, it's a preference.
  *   **The Scripted Worker:** Do not weight data by consistency. Weight it by *variance*. The person who *could* have done anything but chose one thing teaches you more than the person who could do only one thing.
  *   **The Window Seat:** You need richer context data (time of day, sun position) or you must offer the "forbidden" choice occasionally to see if the rejection holds.

  ### The Danger

  If you do not solve this, your "Office Helper" will become an "Office Warden."
  By mistaking constraints for preferences, you will automate the walls. You will build a system that gently herds people into the paths of least resistance, then convinces them they wanted to go there all along. You will optimize for compliance and call it satisfaction.

  **The Fix:**
  You need to model the **Feasible Set**, not just the Choice.
  1.  **Measure Friction:** Don't just log the click; log the latency, the hesitation, the alternate routes considered. Friction indicates constraint.
  2.  **Force Exploration:** Reserve 5% of your suggestions for "counterfactuals" (routes/seats/tasks the model thinks they won't like). This breaks the Performative Feedback loop (Case 1).
  3.  **Invert Confidence:** Treat high-consistency/low-variance users as *low-information* sources regarding preference. Treat high-variance users as *high-information* sources.

  **The Word:**
  If you need one word for the phenomenon to put on your whiteboard, use **Conflation**.
  If you need a phrase for the risk, use **Constraint Mimicry**.
  If you need the mathematical truth, it is **Non-Identifiability**.

  Your system is trying to solve one equation with two unknowns ($Behavior = Preference + Constraint$). You cannot solve it with observation alone. You must introduce a second equation by changing the variables. You must break the wall to see if they walk.
