  2.  **Deconstruct the Three Symptoms:**

      *   *Symptom 1 (Stairwell):* This is a **Self-Fulfilling Prophecy** driven by **Exploration-Exploitation Failure**. Specifically, it's **Censoring** or **Truncation of Data**. By acting on the inference, the system removes the counter-factual evidence. It's an *Endogenous Feedback Loop*.
