answer: |-
  You have identified one of the most fundamental fault lines in legal and political philosophy. You are absolutely right: this is not just a recurring pattern; it is a named, canonical debate with a rich history.

  Here is the breakdown of the terminology, the key players, the intermediate positions, and the specific logical move you noticed regarding the definition of "harm."

  ### 1. The Names of the Positions

  The two sides you described have specific names in jurisprudence (the philosophy of law):

  *   **Side B (The "Harm" Side):** This is **Liberalism**, specifically grounded in **The Harm Principle**.
      *   **Origin:** Most famously articulated by **John Stuart Mill** in *On Liberty* (1859).
      *   **The Core Claim:** "The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others."
      *   **Implication:** Self-regarding actions (those that only affect the consenting participants) are outside the scope of the law. Immorality alone is insufficient for criminalization.

  *   **Side A (The "Morality" Side):** This is **Legal Moralism**.
      *   **Origin:** While it has roots in natural law (Aquinas, etc.), its modern defense is associated with **Lord Patrick Devlin**.
      *   **The Core Claim:** Society has a right to enforce a shared morality through law, even if no specific individual is harmed, because a shared morality is the "bond" that holds society together.
      *   **Implication:** The law is a teacher of values. Allowing "immoral" acts erodes the social fabric, so the state can ban them to preserve the community's ethical identity.

  ### 2. The Canonical Debate: Hart vs. Devlin

  You asked if this is one debate or a cluster. Historically, it crystallized into a specific event known as **The Hart-Devlin Debate** (late 1950s/early 1960s).

  *   **Context:** A British committee (the Wolfenden Report) recommended decriminalizing homosexuality and prostitution. They used Mill's logic: private immorality is not the law's business.
  *   **Lord Devlin:** Argued against the report. He claimed that society is not just a political arrangement but a community of ideas. If you allow the moral bonds to loosen (by permitting homosexuality, etc.), society will disintegrate. Therefore, the state can criminalize vice to prevent social collapse.
  *   **H.L.A. Hart:** A legal positivist who defended the Wolfenden Report. He argued that Devlin provided no evidence that private immorality leads to social collapse. Hart argued that using the law to enforce morality is a tyranny of the majority over the individual.

  If you want to read the primary source on this exact dynamic, Hart's book *Law, Liberty and Morality* (1963) is the definitive text.

  ### 3. Is it a Cluster? (The Feinberg Framework)

  You asked if this is one debate or a cluster. The philosopher **Joel Feinberg** provided the most comprehensive map of this terrain in his four-volume work, *The Moral Limits of the Criminal Law* (1984–1988).

  Feinberg argued that there are actually **four** distinct principles people use to justify criminalization, not just two. This helps explain why the debate feels like a cluster:

  1.  **The Harm Principle:** Prevent harm to others (Mill/Hart).
  2.  **The Offense Principle:** Prevent serious offense to others (e.g., public indecency, noise laws). This is an intermediate position. It's not "harm," but it's not just "private morality" either; it's about public nuisance.
  3.  **Legal Paternalism:** Prevent harm to *self* (e.g., seatbelt laws, banning certain drugs). This splits the difference: it admits the "no victim" argument but says the state is the parent.
  4.  **Legal Moralism:** Prevent immorality regardless of harm or offense (Devlin).

  Most political debates are actually a scramble between these four. For example, a conservative might argue against drugs using **Moralism** ("it's sinful") while a liberal might argue against drugs using **Paternalism** ("it's bad for you"). Conversely, a liberal might argue for sex work using **Harm** ("consenting adults") while a conservative might argue against it using **Offense** ("it degrades public spaces").

  ### 4. The "Harm Inflation" Move

  You noticed something very sharp: *"Sometimes the 'harm' side stretches the concept of harm until it swallows everything (like 'it harms the moral climate of society')."*

  Yes, this is a recognized and heavily critiqued move.

  *   **The Disintegration Thesis:** This is what Lord Devlin argued. He claimed that immoral acts *are* harmful because they weaken the shared moral structure, eventually leading to the collapse of society (like treason).
  *   **The Critique:** H.L.A. Hart and Joel Feinberg argued that this renders the Harm Principle meaningless. If "harm" includes "hurt feelings," "erosion of virtue," or "speculative future social decay," then **everything** can be banned.
  *   **Feinberg's Solution:** Feinberg insisted on a distinction between **welfare interests** (tangible setbacks to life, health, property) and **ulterior interests** (moral or aesthetic preferences). He argued the Harm Principle should only protect welfare interests. When proponents of liberty start arguing that banning hate speech is necessary to prevent "social harm" to the "moral climate," critics accuse them of abandoning the Harm Principle and secretly adopting **Legal Moralism** or **Paternalism**.

  This move is often called **"Conceptual Stretching"** or, more specifically in this context, **collapsing the distinction between harm and morality.**

  ### 5. Intermediate Positions and Nuance

  There are sophisticated positions between the hardline "Libertarian" and the hardline "Moralist."

  **A. Liberal Perfectionism**
  Some philosophers (like Joseph Raz or Martha Nussbaum) argue that the state *should* promote the good life and human flourishing, not just prevent harm. However, they argue this is done through education and subsidies, not necessarily criminal bans. They reject Devlin's coercion but reject Mill's neutrality.

  **B. The "Public/Private" Distinction**
  Many compromises rest on zoning and publicity rather than bans.
  *   *Example:* Prostitution might be deemed "immoral" (Side A) but not banned outright. Instead, it is restricted to certain zones or kept private. This appeals to the **Offense Principle**. It acknowledges the Moralists' desire not to see it, without granting them the power to ban it entirely.

  **C. Exploitation Arguments**
  In debates about surrogacy or sex work, a third argument often emerges that tries to bridge the gap: **Structural Harm.**
  *   *Argument:* "Even if this specific transaction is consensual, the *system* creates coercion."
  *   *Analysis:* This attempts to stay within the **Harm Principle** by arguing that poverty or inequality makes consent impossible. However, critics argue this is often **Paternalism** in disguise ("You think you consented, but you didn't really").

  ### 6. Why it doesn't map Left/Right

  You astutely noted that this doesn't map neatly onto political spectrums. Philosophers call this **ideological inconsistency**.

  *   **The Right:** Often favors **Legal Moralism** on social issues (sex, drugs, marriage) but favors **The Harm Principle** (specifically property rights) on economic issues (deregulation).
  *   **The Left:** Often favors **The Harm Principle** on social issues (drugs, sex) but favors **Paternalism/Perfectionism** on economic/social safety issues (banning exploitative contracts, mandatory healthcare).

  This is why you see the same argument structure used by different people for different ends. The "Harm Principle" is a tool that can be wielded by a libertarian wanting to legalize cocaine or a progressive wanting to ban hate speech (arguing hate speech *is* a harm, not just speech).

  ### Summary for your toolkit

  *   **The Debate:** The Limits of the Criminal Law.
  *   **The Canonical Reference:** The Hart-Devlin Debate.
  *   **Side A:** Legal Moralism (Devlin).
  *   **Side B:** The Harm Principle / Liberalism (Mill, Hart).
  *   **The "Harm Stretch":** Often called the "Disintegration Thesis" or criticized as rendering the Harm Principle vacuous. Joel Feinberg's *The Moral Limits of the Criminal Law* is the deep dive on this.
  *   **The Intermediate:** The Offense Principle (Feinberg) or Legal Paternalism.

  You have correctly identified that the core disagreement is not empirical (does X cause harm?) but **meta-ethical** (what gives the state the right to coerce?). Recognizing this allows you to cut through debates where people are talking past each other about "safety" when they are actually arguing about "authority."
