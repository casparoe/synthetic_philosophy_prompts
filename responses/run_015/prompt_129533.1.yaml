answer: |-
  Let's cut the standard "wholly present" preamble and go straight to the mechanics of **modal leakage**. By this, we mean the metaphysical puzzle of how a normative status (like an obligation, promise, or identity-constituting commitment) located at one temporal coordinate exerts a binding force on a subject at a different temporal coordinate. The core tension is this: if the commitment is "over there" in the future, how does it weigh on me "here" in the present, without merely being a causal prediction?

  ### Perdurantism: The Worm's Structural Integrity

  On perdurantism, you are a four-dimensional spacetime worm. Your "present self" is a temporal stage; your "future self" is a later stage. The commitment is a property or event located at the future stage.

  **The Cleaner Story:**
  Perdurantism actually has the cleaner *ontological* story for modal leakage, provided you accept Eternalism (that the future exists). If the future stage is real, the commitment is a real feature of the spacetime worm. The binding isn't "leaking" across a gap; it is a structural feature of the whole object. The worm *is* a promise-keeping entity. The present stage is bound because it is a constituent of an entity that, globally, has the property of "being committed." The leakage is just the local stage inheriting the global description. It explains why the commitment feels rigid: it's written into the geometry of your extended self.

  **Where It Gets Stuck:**
  Perdurantism gets stuck on the **Alienation Problem**. If the future stage is a distinct temporal part, spatiotemporally distant from the present stage, why does the present stage care about the future stage's normative status? Mereology (the study of parts and wholes) does not automatically entail normativity. Just because my left hand is part of the same object as my right hand doesn't mean my left hand is *obligated* to satisfy the commitments of my right hand.
  The perdurantist must explain why the unity of the worm generates moral or modal binding. Without extra machinery, the future part is just a distant cousin made of the same stuff. The "leakage" explains the connection, but not the *force*. Why should Present-Me sacrifice for Future-Me if they are distinct parts?

  **Does breaking the commitment destroy part of yourself?**
  Not literally. You don't annihilate a spatial chunk of the worm. However, you do render the worm *inconsistent*. If the worm is defined by the narrative arc of "The Promise Keeper," breaking the promise makes that description false. It's a form of structural damage to the worm's identity conditions, akin to falsifying a definition, but not literal destruction of a temporal slice.

  ### Endurantism: The Object's Persistent Identity

  On endurantism, you are a three-dimensional object that persists by being numerically identical at every moment. There are no temporal parts. You are wholly present now, and you will be wholly present then.

  **The Cleaner Story:**
  Endurantism has the cleaner *agential* story. There is no alienation because there is no "other" stage. It is literally *you* who is bound. The modal leakage isn't a flow between parts; it is a self-relation. When you say, "I am committed to X in ten years," you are ascribing a relational property to the whole object *now*. You don't need to worry about why a distant part should bind you, because there is no distance in terms of identity. You are the same substance bearing the weight.

  **Where It Gets Stuck:**
  Endurantism gets stuck on the **Smuggling Charge**. To make the commitment bind the present object without temporal parts, the endurantist must say the object now bears the property *being-committed-to-future-X*.
  If the future is open (Presentism), that property refers to something non-existent, which is metaphysically spooky. How can a relation hold to nothing?
  If the future is real (Eternalist Endurantism), the object bears the property *being-located-at-t2-doing-X*. But if I can break the commitment, I change from "committed" to "reneging." If I am wholly present at both times, how do I reconcile the contradiction?
  To solve this, the endurantist often has to treat the commitment as a "track" or a "history" that the object rides through time. But a history that constrains the object starts to look suspiciously like a temporal part by another name. They risk smuggling in a "normative temporal part" to explain why the commitment persists and binds, undermining the claim that they are purely three-dimensional.

  **Does breaking the commitment destroy part of yourself?**
  No. Since there are no parts to destroy, breaking a commitment is merely a change in properties. You go from *having the property of being obligated* to *having the property of being in violation*. Unless the commitment is essential to your existence (which would make breaking it impossible), you survive intact. This makes the binding feel weaker; if I can shed the obligation by changing my properties, was I ever truly bound?

  ### The Verdict

  **Perdurantism** has the cleaner story for the *mechanism* of modal leakage. It treats the commitment as a global feature of a four-dimensional object, which naturally explains why the present is constrained by the future (they are co-constituents of the same entity). However, it fails to explain the *normative force* (why distinct parts should care about each other's moral status).

  **Endurantism** has the cleaner story for the *experience* of binding (it's just me), but it struggles to explain the *metaphysics* of the binding without smuggling in temporal parts or relying on mysterious relations to non-existent futures.

  **On Self-Destruction:**
  Neither view requires that breaking a commitment is *literally* destroying a part of yourself.
  *   For the **Perdurantist**, it is a failure of the worm to satisfy its global description (a logical/structural failure).
  *   For the **Endurantist**, it is a change in the intrinsic/extrinsic properties of the substance (a qualitative change).

  If you want the commitment to feel "hard" and "real" like a physical constraint, Perdurantism wins: the commitment is part of the worm's shape. If you want the commitment to feel like a matter of agency and responsibility, Endurantism wins: the commitment is a choice of the identical self. But regarding "modal leakage" specifically—the idea that the future *reaches back* to bind the present—Perdurantism offers the only ontology where the future is substantial enough to do the reaching. Endurantism has to pretend the future is real enough to bind, but not real enough to be a part, which is a harder tightrope to walk.
