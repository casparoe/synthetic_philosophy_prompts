      *(Self-Correction during drafting)*: I need to be careful not to use bolding for emphasis. I will rely on sentence structure. I need to make sure I don't accidentally create a list format.

      *(Final check on "Problem of Old Evidence")*: The editor says P(E)=1 so no update. The solution is updating on "H entails E" rather than E. This is Daniel Garber's solution. I should mention this conceptually without necessarily name-dropping too much jargon.

      *(Final check on "Shaped to fit")*: This is the "use-novelty" debate. If the data was used to construct the hypothesis, it's less confirmatory than if it was predicted. But if the hypothesis is constrained by independent mechanisms, it mitigates the "ad hoc" charge.

      *(Final check on "Future Prediction")*: Evidence accumulates. Old evidence doesn't vanish.

      *(Final check on "What to say in print")*: Be honest about the status. It's a strong explanation, not a verified prediction.

