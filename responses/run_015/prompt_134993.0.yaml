      *   *Diagnosis:* This is a category error. They are arguing about *metaphysical status* (Side A) vs. *eventual reducibility* (Side B). They are indeed answering different questions. Side A asks "What is the nature of this category right now?" Side B asks "What will this category look like once science advances?"

