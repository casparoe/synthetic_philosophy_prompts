  I sift the dust to find a shape of cause,
  I write the rain that fell on King John's feast,
  But every scale requires a weight to measure,
  The sign was sent to warn the sinful priest.
  No neutral ground exists where we might tread,
  The chronicle begins with Christmas Day,
  We name the fact before we break the soil,
  The pestilence consumed the young in pray'r.
  To ask of justice is to forge the law,
  The harvest failed because the Lord was wroth,
  The past waits silent until we speak,
  I dip the quill to swear a sacred vow.
  Our concepts cut the chaos into parts,
  The comet burned above the stone keep high,
  Until the question and the answer ends,
  I mark the light before the darkness comes.
  There is no view from nowhere, only here,
  The year of Grace is all I hold as real,
  We cannot see the thing unless it's seen,
  And God interprets what the signs may mean.

  ***

  **Note on Philosophical Liberties**

  I take a liberty by treating the Medieval annalist's providentialism as structurally identical to Modern constructivism. The annalist likely believed they were recording objective divine truth, not constituting facts through questioning; the poem flattens this epistemic difference to highlight that both eras rely on inherited units of measure (Grace vs. Causality) to make the past intelligible.

  I would change my mind about the inescapability of presentism if one could demonstrate a historical fact that retains its significance without being selected, weighted, or framed by a present-day conceptual scheme. For example, if a raw datum (like a tree-ring date) could enter historical narrative without implying a present-day question about climate or chronology, it would suggest a neutral unit of measure exists. Until then, the scale always precedes the weight.
