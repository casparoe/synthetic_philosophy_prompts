  # JOINT STATEMENT ON THE EPISTEMOLOGY OF ANCIENT HISTORY
  **Issued by the Working Group on Adversarial Collaboration in Historical Method**

  ### I. AGREED CLAIMS

  We, the undersigned representatives of the Critical Source Realist and Radical Archival Skeptic traditions, acknowledge a shared commitment to the rigorous study of the human past. While we diverge on the ultimate ontological status of historical knowledge, we affirm the following foundational premises to establish a common ground for inquiry:

  1.  **The Mediated Nature of Testimony:** All textual access to antiquity is mediated. No surviving chronicle is a transparent window onto events; every account is filtered through authorial intent, genre conventions, and the material constraints of transmission. We agree that "naive realism"—the belief that a text says exactly what happened—is methodologically indefensible.
  2.  **The Interpretive Status of Material Evidence:** Material culture (artifacts, strata, epigraphy) does not speak with an unambiguous voice. Like texts, material finds require narrative framing to become evidence. A destruction layer indicates fire, but not necessarily the identity of the arsonist or the political motive for the burning without auxiliary assumptions.
  3.  **The Irreducibility of the Epistemic Gap:** Direct access to past events is impossible. All historical reconstruction is inferential. We agree that the past *as it occurred* is distinct from the past *as it is accessible*, and that no amount of data can fully collapse this distinction.
  4.  **The Weight of Systematic Absence:** We agree that silence in the archive is not neutral. A single absence is incidental; a systematic absence across independent traditions is evidentially significant. However, we agree that the *interpretation* of this significance remains contested. Specifically regarding **triangulated negative inference** (treating convergent archival silences as evidence of non-occurrence):
      *   We agree that convergent silence warrants a higher burden of proof for claims of occurrence than single-source silence does.
      *   We agree that such inference is valid *only if* preservation biases across the compared traditions can be demonstrated to be independent. If the silence stems from a shared cultural taboo or a common dependency on a lost source, the inference is void.

  ***

  ### II. DISAGREEMENTS TABLE

  The following table delineates the specific methodological divergences that remain unresolved. Positions are phrased to reflect the internal logic of each camp.

  | Domain of Inquiry | Critical Source Realist Position | Radical Archival Skeptic Position |
  | :--- | :--- | :--- |
  | **The Goal of Criticism** | The aim of source criticism is to strip away narrative accretion to approximate the underlying event. Through triangulation, we can isolate a "hard core" of data that corresponds to reality. | The aim of source criticism is to understand the narrative function of the text. There is no "hard core" separable from the story; the event is inaccessible outside the telling. |
  | **Specific Facts (e.g., Logistics)** | Disciplined cross-examination can recover probable specific facts, such as the approximate scale of an imperial campaign. Coherence across independent sources increases the probability of correspondence to actual logistical capacity. | Disciplined cross-examination produces internally coherent narratives, but these remain agnostic about correspondence. Logistical scales are often topoi (literary tropes) rather than data points. |
  | **The Nature of Coherence** | When independent sources agree on a detail (e.g., a date, a name, a route), the best explanation is that they are tracking a shared external reality. | When independent sources agree, the best explanation is often shared intertextuality, common cultural memory, or reliance on a lost common ancestor, not independent observation. |
  | **Negative Inference** | If a major event is absent from all contemporary administrative records where it *should* appear (given our understanding of bureaucratic habits), it is probable the event did not occur as described. | Administrative records have their own silences determined by power. Absence proves only that the event was not recorded for the purposes of the state, not that it did not happen. |
  | **Presentism** | Modern assumptions about causation and coherence are necessary heuristic tools. We must assume the past was generally coherent to make it intelligible. | Modern assumptions about causation are the primary contaminant. Imposing coherence on a fragmented archive creates a false continuity that masks the rupture of time. |

  ***

  ### III. PRECISE CRUXES

  We identify the following sub-questions as the critical pivot points of our dispute. Resolving these empirically or theoretically would necessitate a shift in position for at least one party. For each crux, we specify a concrete historical case and the divergent predictions each camp makes regarding its interpretation.

  #### Crux 1: The Explanation of Convergent Coherence
  **Sub-Question:** When two culturally distinct source traditions report the same specific detail (e.g., the outcome of a battle or the name of a ruler), is this best explained by correspondence to a shared reality or by the diffusion of narrative conventions?

  *   **Case Study:** *The Battle of Qadesh (1274 BCE).* Both Egyptian inscriptions (Ramesses II) and Hittite tablets record the battle. They agree on the participants and the stalemate outcome, but diverge wildly on the tactical details and moral victory.
  *   **Realist Prediction:** The agreement on the *outcome* (stalemate/treaty) despite the hostility between sources indicates a hard factual constraint. The divergence on tactics is propaganda; the convergence on the result is evidence of correspondence.
  *   **Skeptic Prediction:** The agreement on the outcome is a diplomatic necessity formalized in the subsequent treaty, not independent verification of the battle's events. The "battle" as a discrete event is a narrative construct imposed on a complex series of skirmishes; the convergence reflects the political needs of the peace treaty, not the reality of the field.

  #### Crux 2: The Epistemic Value of Triangulated Silence
  **Sub-Question:** Does the absence of an event across multiple independent genres (e.g., poetry, administration, and foreign chronicles) constitute positive evidence of non-occurrence, or does it merely reflect a shared blind spot in ancient record-keeping?

  *   **Case Study:** *The United Monarchy of David and Solomon (10th Century BCE).* Archaeological evidence in Jerusalem for this period is sparse compared to later periods, and contemporary extra-biblical references are virtually non-existent compared to the scale described in later texts.
  *   **Realist Prediction:** The triangulated silence (lack of contemporary monumental inscriptions, lack of foreign mention, limited material culture) suggests the political scale described in later chronicles is anachronistic. The "empire" is a later projection onto a chiefdom.
  *   **Skeptic Prediction:** The silence reflects the specific nature of 10th-century Levantine literacy and preservation (perishable materials, specific diplomatic genres). The absence of monumental propaganda does not prove the absence of political complexity; it proves the absence of a specific *type* of state propaganda. The later texts preserve oral traditions that fill the archival gap without being falsified by it.

  #### Crux 3: The Recoverability of Logistical Scale
  **Sub-Question:** Can numerical data in ancient texts be corrected by material constraints to yield a probable figure, or are numbers inherently symbolic?

  *   **Case Study:** *Xerxes' Invasion of Greece (480 BCE).* Herodotus claims millions of soldiers; modern logistical analysis of water and supply lines suggests tens of thousands.
  *   **Realist Prediction:** By applying material constraints (water capacity, march speed, supply lines) to the textual claim, we can recover a probable range (e.g., 100,000–200,000). The text is exaggerated, but the *event* of a massive invasion is corroborated by archaeological destruction layers and Persian inscriptions.
  *   **Skeptic Prediction:** The number "millions" serves a theological and literary function (the hubris of the East) rather than a demographic one. Correcting the number to fit modern logistics imposes a modern rationality on an ancient text. The only recoverable fact is that a Persian force entered Greece, not its size. The "logistical scale" is a modern question the ancients did not ask.

  ***

  ### IV. ASSESSMENT OF VERBAL VS. SUBSTANTIVE DISPUTE

  In concluding this statement, we assess the nature of our divergence to determine how much is terminological and how much is ontological.

  **1. The Verbal Dispute: The Definition of "Fact"**
  A significant portion of our conflict is verbal. When the Realist speaks of a "fact," they mean a proposition with a high probability of correspondence to reality (e.g., >90% confidence). When the Skeptic speaks of a "fact," they often imply a proposition with certainty or direct access.
  *   *Resolution:* If the Realist concedes that all facts are defeasible probabilities, and the Skeptic concedes that some probabilities are high enough to warrant practical assent (e.g., "Rome existed"), the gap narrows considerably. The dispute often sounds like "We can know" vs. "We cannot know," but operationally, both sides proceed by assigning confidence levels to claims.

  **2. The Substantive Dispute: The Independence of Sources**
  The remaining disagreement is substantive and concerns the **independence of evidence**.
  *   The Realist operates on the principle that distinct cultural traditions (e.g., Greek and Persian) constitute independent variables. If they converge, the probability of coincidence is low.
  *   The Skeptic operates on the principle of **intertextual dependency**. They argue that the "Mediterranean World" was a sufficiently integrated information ecosystem that "independent" sources often share a common ancestral rumor or trope.
  *   *Why this matters:* This is not solvable by semantics. It requires granular philological and archaeological work to determine transmission chains. If the Skeptic is right that most "independent" sources are actually cryptically dependent, the Realist's triangulation method collapses. If the Realist is right that genuine independence exists, the Skeptic's radical uncertainty is unwarranted.

  **3. The Substantive Dispute: The Weight of Silence**
  Finally, we disagree substantively on the **default state of the past**.
  *   The Realist assumes the past was generally recordable and that significant events leave traces. Therefore, absence is evidence of absence (probabilistically).
  *   The Skeptic assumes the past was generally lost and that preservation is the anomaly. Therefore, absence is the baseline expectation and proves nothing.
  *   *Conclusion:* This is a clash of priors. It cannot be resolved by method alone, but only by Bayesian updating based on new discoveries (e.g., the unearthing of a new archive that fills a known silence). Until such discoveries occur, this divergence remains a fundamental philosophical stance rather than a methodological error.

  **Signed,**
  *The Working Group on Adversarial Collaboration in Historical Method*
