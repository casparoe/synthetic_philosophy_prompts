answer: |-
  hey, love this workshop idea. honestly, grad students in socio/philosophy are the hardest audience for this because they've all read the same three papers and think they have the take down pat. you're right to avoid a lit review — if you start citing norenzayan or saroglou you'll lose them to note-taking instead of thinking.

  here's how i'd structure the arc if i were running it.

  **1. the dependency order**
  dont start with correlation. that's the trap they're already stuck in (us vs europe stats). if you start with data, they'll just fight over confounders.
  you have to start with **causal mechanism**.
  logic: you can't measure whether religion *does* anything until you agree on *how* it would supposedly do it. is it fear of punishment? social signaling? community bonding? if you don't lock down the mechanism first, any correlation you show them is meaningless.
  so the flow is: **Mechanism → Correlation → Institutional Substitution.**
  you need the theory of action before you look for the evidence, and you need the evidence before you check for alternative explanations (substitution).

  **2. the carrying example (blood donation)**
  honestly? **it's a loaded trap.** ditch it.
  here's why: blood donation rates aren't just about individual morality, they're about infrastructure and state trust. in denmark, the state makes it easy and you trust the health system. in the us, it's fragmented. plus, in the us, plasma is paid which messes up the "altruism" metric entirely. if you use this, the sociologists will just argue about welfare state capacity and the philosophers will argue about whether altruism requires pure intent. you'll lose the room.

  **swap it for: The "Lost Wallet" experiments (or similar honesty tests).**
  specifically the cross-national studies where researchers "lose" wallets with money/ids in them and see return rates.
  why it works better:
  1. it's a standardized behavioral measure (not self-report).
  2. it isolates honesty toward a stranger (out-group morality).
  3. it lets you pivot to mechanism (did they return it because of norms? fear? empathy?) and substitution (does state rule of law matter more than church attendance?).
  it keeps the focus on the *frame* of the question, not the messiness of national health policy.

  **3. mapping the misconceptions**
  they're gonna come in with the biases you listed, but you need to intercept them at specific points in that Mechanism→Correlation→Substitution arc.

  *   **Misconception 3: "more moral" is a culture-neutral metric.**
      *   *when they hit it:* immediately, as soon as you ask "what are we measuring?"
      *   *where to head it off:* **right at the start (Mechanism phase).** before you talk about religion, make them define morality. is it loyalty to kin? honesty to strangers? purity? show them that religious groups might score high on loyalty but low on universal honesty. if you don't break this first, the rest of the workshop collapses. make them admit that "moral" is a variable, not a constant.

  *   **Misconception 1: morality requires supernatural monitoring.**
      *   *when they hit it:* when you ask "why would religion change behavior?"
      *   *where to head it off:* **still in Mechanism phase, right after defining morality.** show them secular mechanisms for the same outcome. shame, reputation, legal fear. force them to isolate what, if anything, the *supernatural* part adds. if they can't articulate the unique causal power of "god is watching," they're just talking about community pressure.

  *   **Misconception 2: secular trust is just hidden religiosity.**
      *   *when they hit it:* when you show them data where secular places look "moral" (like the lost wallet returns in scandinavia).
      *   *where to head it off:* **in the Institutional Substitution phase.** this is your closer. don't let them say "oh, they're just secretly christian." force the question: can institutions do the job of religion? if the welfare state provides security, do you need the religious safety net to be prosocial? this moves the debate from "belief" to "function."

  **4. the check-question**
  dont ask them to recall a stat. ask them to design the control.
  *"you find a society with high moral compliance and zero religious belief. before you claim religion is obsolete, what two functional variables must you measure to prove it wasn't just institutional substitution?"*
  if they say "welfare state capacity" and "definition of moral output," you know they got the frame. if they say "check their church attendance history," they missed the point.

  **5. what to skip**
  be upfront about this. in two hours, you cannot solve **the normative question of "true" morality.**
  tell them: "we are not asking if religious people are *better* people, or if secular morality is *superior.* we are asking about the functional relationship between belief systems and behavioral compliance."
  skip the theology. skip the "is utilitarianism better than deontology" stuff. if you let them debate whether returning the wallet is *actually* good, you'll run out of time before you get to the sociology.

  keep it tight, force them to define their terms before they touch the data. good luck, sounds like a fun session.
