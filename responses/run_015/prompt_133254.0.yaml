prompt: |-
  hey so i'm prepping a workshop for grad students in sociology/philosophy who all think they already know the religion-and-morality story — either "god-fear makes people nice" or "secular europe proves religion is useless." i need to teach them the actual conceptual frame for asking whether religion makes people more moral, without turning it into a literature review. don't explain the answer to me; plan the teaching arc. first, what dependency has to come first: correlation vs causal mechanism vs institutional substitution? then the carrying example — i was thinking anonymous blood donation rates comparing denmark and the US, but tell me if that example actually carries the idea or if it's a loaded trap, and what should replace it. then map the misconceptions in the order they'll hit them: probably (1) morality requires supernatural monitoring, (2) secular trust is just hidden religiosity, (3) "more moral" is a culture-neutral metric — and for each, exactly where in the sequence i should head it off. finish with one check-question that proves they've internalized the framing rather than just memorized a datapoint. also, what chunk of this debate should i openly admit i'm skipping in a single two-hour session? write it casual, like i'm asking a colleague over coffee, and don't worry about grammar — i definately don't need it perfect.
