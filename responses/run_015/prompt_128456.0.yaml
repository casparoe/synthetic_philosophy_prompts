prompt: |-
  I've been lurking on rationalist forums for years and usually just read, but this one's been bugging me since a seminar on just war theory. People keep using the boxing-match analogy to defend the moral equality of combatants: both sides step into the ring, they both know the rules, there's a referee applying them equally, and punching isn't wrong just because your opponent is a jerk outside the ring. The idea is that jus ad bellum and jus in bello seperate cleanly, just like the cause of the match doesn't change the rules inside it. I'm trying to figure out how far this actually holds.

  Can you map it out explicitly -- what corresponds to the gloves, the consent, the referee, the corner team, the bell? Then tell me where the mapping breaks: conscription vs voluntary entry, the fact that one side might be defending against agression while the other started it, whether the "referee" (laws of war) actually applies symetrically when one side is systematically violating them, and whether the analogy quietly imports the idea that both fighters have equal moral standing regardless of why they're fighting. I keep wondering if there's a better analogy -- maybe two people in a burning building where one lit the fire -- but I'm not sure that survives either. Does the conclusion that soldiers on both sides are morally equal actually hold up once the disanalogies are listed, or was the boxing frame carrying the whole argument?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** The user is familiar with rationalist forums and just war theory (JWT). They encountered the "boxing-match analogy" for the moral equality of combatants (MEC).
      *   **Task 1:** Explicitly map the boxing analogy to war (gloves, consent, referee, corner team, bell, etc.).
      *   **Task 2:** Identify where the mapping breaks (conscription, aggression/defense, enforcement of laws, moral standing).
      *   **Task 3:** Evaluate alternative analogies (e.g., burning building).
      *   **Task 4:** Answer the core philosophical question: Does the conclusion (MEC) hold up once the disanalogies are exposed, or was the analogy doing all the heavy lifting?

  2.  **Initial Assessment & Philosophical Grounding:**
      *   The "boxing-match analogy" is a common intuitive pump for *Jus in Bello* (justice in war) independence from *Jus ad Bellum* (justice of war).
      *   This is traditionally associated with Michael Walzer's *Just and Unjust Wars* (the "war convention").
      *   The critique is famously associated with Jeff McMahan (*Killing in War*), who argues against MEC.
      *   The user is asking for a structural analysis of the analogy itself, not just a summary of the debate, though the debate informs the analysis.

  3.  **Task 1: Mapping the Analogy:**
      *   *The Ring:* The battlefield / theater of war.
      *   *The Gloves/Weapons:* Standardized weaponry (rules against poison, expanding bullets, etc.).
      *   *The Bell:* Declaration of war / commencement of hostilities.
      *   *The Referee:* International Humanitarian Law (IHL) / Geneva Conventions / War Crimes Tribunals.
      *   *Consent:* Enlistment / Being a recognized combatant.
      *   *The Corner Team:* Command structure / Logistics / Home front support.
      *   *The Rules (No hitting below the belt):* Proportionality, Distinction (no targeting civilians).
      *   *The Outcome:* Victory/Defeat (not necessarily annihilation).

  4.  **Task 2: Identifying the Breaks (Disanalogies):**
      *   *Consent:* Boxing is voluntary. War often involves conscription, or soldiers fighting for survival/defense where "opting out" means death or subjugation.
      *   *Symmetry of Cause:* In boxing, the *reason* for the fight (money, pride) is irrelevant to the rules. In war, *why* you fight (aggression vs. defense) is morally crucial.
      *   *The Referee:* Boxing refs are immediate and enforce rules in real-time. IHL is post-hoc, weak, and often ignored by violators without consequence.
      *   *Harm:* Boxing aims to score points or KO within limits. War aims to destroy the enemy's capacity to fight, often involving collateral damage.
      *   *Moral Standing:* A boxer isn't morally tainted by losing. An aggressor soldier is arguably committing a crime by participating at all.

  5.  **Task 3: Evaluating Alternative Analogies:**
      *   *Burning Building:* One lit the fire (aggressor), one is trying to escape (defender).
          *   *Pros:* Captures the *ad bellum* asymmetry.
          *   *Cons:* Implies the defender can do *anything* to stop the aggressor (no *in bello* limits). If the arsonist surrenders, can the defender kill them? Probably not. So it fails to capture *in bello* constraints.
      *   *Police vs. Criminal:*
          *   *Pros:* Asymmetric rights (police can use force, criminal can't).
          *   *Cons:* War isn't law enforcement. Soldiers aren't police.
      *   *Self-Defense against a Culpable Attacker:*
          *   *Pros:* McMahan's preferred framework.
          *   *Cons:* Hard to scale to collective conflict.

  6.  **Task 4: The Core Conclusion (MEC Validity):**
      *   Does MEC hold?
      *   *Traditional View (Walzer):* Yes, because of the "separation thesis." Soldiers are instruments of the state. To deny MEC makes war too horrific (soldiers would fight without restraint).
      *   *Revisionist View (McMahan):* No. Moral equality is false. Aggressors have no right to kill defenders. Defenders have a right to kill aggressors. However, *legal* equality might still be useful pragmatically.
      *   *Synthesis:* The boxing analogy *hides* the moral asymmetry. It smuggles in the idea that the "game" overrides the "cause." Once you remove the analogy, the moral argument for MEC relies on *pragmatism* (limiting horror), not *morality* (rights to kill).

