answer: |-
  The dramatization of historical lives occupies a precarious space between the demands of art and the obligations of history. When a creator brings a deceased figure to the screen or the page, they inevitably face the charge of inaccuracy. Dates are shifted, composite characters are invented, and dialogue is reconstructed from the ether. To demand strict biographical accuracy in these mediums is to misunderstand the nature of narrative art; a film is not a ledger, and a novel is not an archive. However, there exists a deeper, more significant ethical obligation than the mere correctness of facts. This obligation is what we might call *structural fidelity*. While creators are free to fabricate the surface details of a life, they violate a meaningful ethical duty if they reverse the moral-causal structure of the figure's actual choices. This violation occurs specifically when a decision is portrayed as flowing from motives that the historical record shows the person explicitly rejected or that are logically incompatible with the reasons they endorsed. To understand why this specific distortion constitutes a distinct wrong to the dead, we must examine the nature of human agency and the specific harm of sanitizing motive, as illustrated by the case of the nineteenth-century reformer.

  Structural fidelity differs fundamentally from biographical accuracy. Biographical accuracy concerns the *what* and the *when*: the date of a speech, the wording of a letter, the sequence of public events. Structural fidelity concerns the *why*. It posits that the architecture of a human life is built upon the causal links between internal motivation and external action. A person is not merely a collection of events they attended, but a moral agent defined by the reasons they acted. When a dramatist collapses a timeline or invents a conversation in a garden, they are filling in the gaps of the historical record to make the narrative coherent. This is an act of translation. However, when a dramatist alters the *source* of a character's agency, they are not translating; they are usurping. They are replacing the historical subject's internal engine with one of their own design.

  Consider the hypothetical case of the nineteenth-century reformer. The historical record, specifically her private correspondence, reveals a complex psychological reality: her public advocacy was driven by an unstable mixture of genuine moral conviction and calculated social ambition. She wanted to change the world, but she also wanted to be the one who changed it. She understood her own vanity and negotiated with it. This is a human reality. It renders her achievements difficult and hard-won, born of a struggle not just against external oppression, but against her own internal desire for status.

  Now, consider the filmmaker's choice to portray every major decision as arising solely from disinterested moral principle. On the surface, this seems like a flattering error. The reformer is made to look nobler, purer, and more heroic. Audiences generally prefer this; a hero unburdened by ambition is easier to cheer for than a strategist leveraging morality for status. However, this distortion is not a harmless embellishment. By stripping away the self-interested causal component, the filmmaker commits a specific violence against the memory of the dead: the erasure of their actual moral labor.

  If the reformer's actual choices were the result of balancing conviction against ambition, then her moral success lay in the management of that tension. Perhaps she channeled her ambition to fuel her persistence when conviction wavered. Perhaps she sacrificed social opportunities to remain true to her principles, knowing it hurt her standing. In the historical reality, her virtue was dynamic and contested. In the film's reality, her virtue is static and innate. By removing the ambition, the filmmaker does not just polish the reformer's image; they fundamentally alter the nature of her goodness. They transform a moral achievement into a personality trait. This is a profound disservice because it denies the dead person the dignity of their actual complexity. It suggests that their real, messy, conflicted interior life was insufficient for the story, that they must be hollowed out to serve as a vessel for a cleaner moral fable.

  This constitutes a violation of structural fidelity because it severs the link between the agent's endorsed reasons and their portrayed actions. The reformer, in her letters, endorsed a view of herself that included ambition. She did not hide it from her confidants; she integrated it into her self-conception. To portray her as purely altruistic is to assert that she was mistaken about her own motivations, or worse, that her own understanding of her life is irrelevant compared to the filmmaker's thematic needs. It treats the historical figure not as a subject with an inviolable interiority, but as raw material to be molded. If a biopic is permitted to invert the causal structure of a life—making selfish acts look selfless, or mixed motives look pure—then the "character" on screen ceases to be that historical person. They become a puppet wearing the historical person's name.

  The ethical duty here is not to the audience's expectation of truth, but to the ontological integrity of the deceased. The dead cannot speak to correct the record. They rely on the living to carry forward not just the memory of their deeds, but the truth of their humanity. When we allow the structural fidelity of a life to be broken for the sake of a cleaner narrative arc, we participate in a form of posthumous silencing. We are effectively saying that the way the reformer understood her own life is less important than the way the story plays best in a theater. This is particularly egregious when the distortion makes the figure *better* than they were. A lie that damages a reputation is easily identified as a wrong; a lie that inflates a reputation is often mistaken for tribute. But both are forms of control. To make the reformer a saint is to rob her of her humanity. It implies that a woman driven by both heart and ego is not worthy of admiration, that she must be scrubbed of her ambition to be valuable to the present day. This insults the historical figure by suggesting her actual self was inadequate.

  Furthermore, structural fidelity must constrain artistic license even when audiences prefer a simpler moral portrait because the function of historical drama is not merely to soothe, but to illuminate the mechanics of human action. If art only presents us with idealized agents who act from pure principle, it teaches us a false psychology. It suggests that moral progress is made by angels, not by flawed humans negotiating their own desires. By adhering to structural fidelity—by showing the reformer's ambition alongside her conviction—the filmmaker would offer a more challenging, yet more truthful, representation of how change actually occurs. It allows the audience to see that one can be ambitious and still do good, that the causal structure of history is driven by complex, contradictory people. To deny this is to trade insight for idolatry.

  The distinction lies in the difference between filling a gap and building a new foundation. Inventing a private conversation between the reformer and her sister to illustrate her stress is filling a gap; the emotional truth aligns with the structural reality of her struggle. But changing the *reason* she gave a speech from "I want to lead this movement" to "I only want to help" is building a new foundation. It changes the load-bearing walls of the character's identity.

  Ultimately, creators owe the dead the respect of their own agency. A historical figure's life is a sequence of choices made for reasons. While the specific words spoken in a room may be lost to time, the architecture of those choices often remains in the record. To preserve structural fidelity is to acknowledge that the dead were the authors of their own lives. We may edit the footnotes, we may illuminate the margins, but we do not have the right to rewrite the thesis. In the case of the reformer, preserving the tension between conviction and ambition honors the actual work she did. Sanitizing that tension turns her into a prop. Structural fidelity demands that we dramatize the person as they were, not as we wish them to be, because the ethical debt we owe to the past is the truth of their humanity, not the comfort of our myths.
