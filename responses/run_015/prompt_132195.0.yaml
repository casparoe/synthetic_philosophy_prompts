answer: |-
  So, grab a coffee and let's dig into this. The Fleischmann-Pons affair is basically the stress test Lakatos never got to run. If you look at the 1989 announcement through his *Methodology of Scientific Research Programmes* (MSRP), it's almost too perfect—until it isn't.

  Here's how the mapping works. The **hard core** for the Utah team wasn't just "fusion happened." It was the deeper claim that nuclear processes could be triggered by chemical environments—specifically, that deuterium loading in a palladium lattice could overcome the Coulomb barrier without high temperatures. That was the irrefutable convention they were protecting. Nothing was going to shake that belief initially.

  Then the **protective belt** started taking fire. When the neutrons didn't show up at expected levels, the belt adjusted: "It's a unknown reaction pathway; maybe it's mostly tritium or heat." When other labs couldn't replicate the excess heat, the belt thickened: "Your calorimetry is off," or "You didn't achieve the critical loading ratio," or "The effect is intermittent." Every negative result was absorbed by tweaking an auxiliary hypothesis rather than touching the core. In Lakatosian terms, this is a classic **degenerating problem shift**. They were explaining away anomalies rather than predicting novel facts.

  Now, look at the **rival programme**: the mainstream hot fusion crowd (tokamaks, inertial confinement). Their hard core was standard nuclear physics—fusion requires high energy to overcome Coulomb repulsion. Their protective belt involved engineering challenges (confinement time, plasma stability). When cold fusion popped up, they didn't need to adjust their core; they just treated it as an experimental error. According to Lakatos, the rival programme was "progressive" (slowly solving engineering problems within a stable theory), while cold fusion was "degenerating" (adding ad hoc fixes to survive).

  Here's where the model **breaks down**, though. Lakatos assumes a certain rationality in the scientific community—that once a programme is clearly degenerating, it gets abandoned for a progressive rival. He treats science as a logic machine, not a social ecosystem. He doesn't account for the patent office. He doesn't account for the fact that "cold fusion" rebranded to "LENR" (Low Energy Nuclear Reactions) and kept drawing funding from niche sources (like the Japanese MITI program or U.S. Navy SPAWAR) because the *promise* was too economically valuable to kill.

  Lakatos is silent on the political economy of science. He doesn't have a variable for "hope capital" or patent incentives. The theory predicts cold fusion should have collapsed by 1992. Instead, it survived on social momentum, media cycles, and specific funding niches that operated outside mainstream peer review.

  So, to your question: **Can a degenerating programme survive on social momentum alone?** This case suggests yes, indefinitely, provided there's a non-scientific incentive structure (patents, energy independence hopes) keeping the infrastructure alive. Lakatos tells us about the logic of discovery, but he misses the sociology of survival.

