answer: |-
  Yes, philosophy has a name for this, and it is one of the most famous objections in modern ethics. The concept you are bumping against is called **The Separateness of Persons**.

  It was most famously articulated by the political philosopher **John Rawls** in *A Theory of Justice* (1971), though it has roots in Kant and was later expanded by Derek Parfit.

  Here is the breakdown of what it is, how it differs from related concepts, where the edges are, and what you should call it in your revision notes.

  ### 1. The Core Concept: The Separateness of Persons
  The intuition your readers are having is that **society is not a super-individual.**

  Utilitarianism (the "happiness math" approach) often treats a group of people like a single container. If you have 10 units of pain and 10 units of joy, Utilitarianism says it doesn't matter if they are in one person or ten people; the net is zero.

  Rawls argued that this is a category error. A single person can rationally choose to endure pain now for pleasure later because **the same consciousness experiences both.** The later joy *compensates* the earlier pain. The memory of the suffering is healed by the current safety.

  However, **Lena's joy cannot compensate Mara's pain.** They are distinct "containers" of consciousness. Mara does not get to feel Lena's relief. Lena does not feel Mara's trauma. When you balance the ledger across two people, you aren't creating balance; you are creating a creditor and a debtor who never meet.

  **The Philosophical Label:** *The Separateness of Persons.*
  **The Mechanical Label:** *The Problem of Interpersonal Aggregation.*

  ### 2. How to Carve It (Distinctions)
  You asked how this differs from "don't use people" and "non-identity." Here is how you carve the distinctions for your revisions.

  #### A. Vs. Kant's "Means to an End"
  *   **The Concept:** Kant says, "Don't treat people merely as means."
  *   **The Difference:** You can treat someone as a means if they consent (e.g., I hire a builder to build my house; I am using them, but it's consensual exchange).
  *   **The Separateness Distinction:** The issue with your "Baker Sacrifice" isn't just that you used him; it's that you tried to **offset his loss with someone else's gain.**
      *   *Kantian Violation:* Killing the baker without his consent.
      *   *Separateness Violation:* Killing the baker and saying, "But look, five other people are happier now, so it's okay."
      *   *Revision Note:* You can have a character sacrifice themselves (Kantian okay if autonomous), but you cannot have the *narrative* claim that their death is "paid for" by another character's wedding.

  #### B. Vs. The Non-Identity Problem
  *   **The Concept:** Parfit's Non-Identity Problem asks: If you make a choice that results in a different child being born (who has a hard life) vs. no child being born, did you harm that child? (They can't say "I wish I wasn't born," because otherwise they wouldn't exist).
  *   **The Difference:** Your problem assumes **fixed identities.** Mara and Lena both exist regardless of what you do. You are distributing fixed burdens among existing subjects.
  *   **Why it matters:** In Non-Identity cases, existence itself is the benefit. In your saga, existence is a given; the quality of life is the variable. Readers revolt because Mara is being asked to pay a cost for a benefit she will never receive, not because her existence is in question.

  ### 3. The Edges: Time, Consent, and Connection
  You asked where the boundaries lie. Here is how to test if a trade-off feels "earned" or "creepy."

  #### The Time Edge (Psychological Continuity)
  *   **Why it works in one life:** I am the same person at 10 and at 40. My 40-year-old self remembers the 10-year-old's pain. The joy *integrates* the pain into a meaningful narrative.
  *   **Why it fails across lives:** Lena cannot integrate Mara's pain. There is no psychological continuity between sisters.
  *   **The Fix:** If you want Lena to thrive on Mara's sacrifice, there must be **narrative continuity.** Lena must *know* the cost, carry the burden of that knowledge, and dedicate her happiness to Mara's memory. If Lena is just "happy and grounded" while Mara is "miserable and forgotten," the Separateness boundary is violated.

  #### The Consent Edge
  *   **The Rule:** Sacrifice across persons is only morally permissible if the person suffering **chooses** it.
  *   **The Creep Factor:** If *you* (the author) decide Mara suffers so Lena can shine, it feels like fate stacking the deck. If *Mara* decides, "I will take the abuse so Lena doesn't have to," it becomes an act of love, not structural unfairness.
  *   **Revision Tip:** Give Mara agency. If she endures misery passively so Lena can be happy, readers will hate it. If Mara actively shields Lena, knowing the cost, readers will cry (in a good way).

  #### The Zero-Sum Edge
  *   **The Problem:** Your "happiness math" implies a Zero-Sum Game (Pain + Joy = Constant).
  *   **The Reality:** Life is not Zero-Sum.
  *   **The Fix:** Don't balance the ledger. If Mara suffers, Lena shouldn't just get "happy." Lena should inherit Mara's trauma *plus* find joy. The joy shouldn't replace the pain; it should exist alongside it. If the total happiness goes up because someone else went down, readers sense the "cheat."

  ### 4. What to Call It in Revision
  "The Separateness of Persons" is accurate but dry for a writing group. Here are three terms you can use in your margins or workshop discussions, depending on what nuance you need:

  **1. The Compensation Boundary**
  *   *Use this when:* Discussing whether a character's suffering is "worth it."
  *   *Rule:* Compensation can cross time, but it cannot cross skins.
  *   *Note:* "Mara's childhood trauma crosses the Compensation Boundary. Lena's happiness doesn't heal Mara's wound."

  **2. The Ledger Fallacy**
  *   *Use this when:* Discussing the "happiness math" or the baker sacrifice.
  *   *Rule:* You cannot balance one person's loss against another person's gain.
  *   *Note:* "This chapter commits the Ledger Fallacy. We are trying to buy the group's happiness with the Baker's life."

  **3. Psychological Continuity**
  *   *Use this when:* Justifying why a single character's arc works.
  *   *Rule:* The same mind must experience the cost and the reward.
  *   *Note:* "We need to ensure Psychological Continuity. If Mara suffers, Mara (or someone who carries her memory) must reap the reward."

  ### Summary for your Revision
  Your readers are not bad at math; they are good at ethics. They recognize that **justice is not utilitarian.**

  To fix the "creepy" feeling without changing the plot points:
  1.  **Stop balancing the equation.** Don't try to make the total joy equal the total pain. Let the pain be a loss that isn't "paid back" by someone else's win.
  2.  **Give Agency.** If Mara suffers for Lena, Mara must choose it, or the narrative must acknowledge the injustice of it.
  3.  **Bridge the Gap.** If Lena benefits from Mara's suffering, Lena must carry the weight of that debt. Her happiness cannot be "grounded" and "light" if it was purchased with Mara's childhood. It must be complicated by guilt or gratitude.

  The philosophical term is **The Separateness of Persons**. The writer's term is **The Compensation Boundary**. Use them to protect your characters from being treated as currency.
