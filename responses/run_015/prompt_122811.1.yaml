  2. Switching yields a positive expected gain on ninety-five percent of the probability mass because small values are observed much more frequently than the maximum value. The net expectation is zero because the single rare case of observing the maximum amount incurs a loss large enough to offset the accumulated gains from all smaller observations.

  3. The naive argument fails not in the conditional posterior calculation but in the slide from switching given what you see to switching regardless without integrating over the observation probabilities. This error treats the conditional expected gains as additive constants rather than variables weighted by the likelihood of each observation.

  4. The symmetry argument that always switching and always staying tie only rules out unconditional policies, leaving room for observation-contingent policies to be genuinely profitable. Your strategy exploits the asymmetry introduced by the finite boundary, which breaks the exchangeability of the envelopes once a value is observed.

  5. Whether a profitable observation-contingent policy exists depends on the shape of the prior, specifically requiring that the probability mass does not decay too rapidly between adjacent values. This dependence implies the paradox is dissolved because the advantage of switching is not universal but contingent on specific distributional properties that proper priors must satisfy.
