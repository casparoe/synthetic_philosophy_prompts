answer: |-
  # Joint Statement on the Logic of Vagueness and the Sorites Paradox

  **Parties:** The Epistemicist Camp and The Supervaluationist Camp  
  **Date:** October 24, 2023  
  **Subject:** Adversarial Collaboration on the Structure of Vague Predicates

  ## Preamble

  This document represents the outcome of an adversarial collaboration between two committed theoretical positions regarding the nature of vagueness. Our objective is not to negotiate a compromise that dilutes our respective commitments, nor to declare a victor. Rather, we seek to isolate the precise loci of our disagreement against a background of shared logical and phenomenological commitments. We acknowledge that the Sorites paradox reveals a genuine structural problem in ordinary reasoning that neither side can dismiss. The following statement delineates our common ground, codifies our divergences, and identifies the specific empirical and logical cruxes that would adjudicate between our views.

  ## Part I: Agreed Claims

  Both the Epistemicist Camp and the Supervaluationist Camp affirm the following propositions as the foundation for further debate:

  1.  **The Sorites Tension:** The Sorites paradox reveals a genuine tension in ordinary reasoning rather than a mere linguistic confusion or a fallacy of equivocation that can be dissolved by simple disambiguation.
  2.  **Tolerance Principles:** Principles of tolerance (e.g., "if a man of height *h* is tall, a man of height *h* minus one micron is tall") are initially plausible based on the meaning of vague predicates, yet generate contradiction when iterated across a sufficient range.
  3.  **Bivalence in Precision:** Classical bivalence holds rigorously for fully precise languages; the dispute concerns whether natural language vague predicates operate under the same logical constraints.
  4.  **Nature of Ignorance:** Vagueness is not reducible to *ordinary* speaker ignorance about an already-determined empirical fact (such as not knowing a specific height measurement); the phenomenon involves the semantic or metaphysical status of the predicate itself.
  5.  **Inadequacy of Alternatives:** Purely degree-theoretic (fuzzy logic) or contextualist resolutions that deny bivalence altogether are inadequate to capture the normative force of classical reasoning in borderline cases.
  6.  **The Gradient Artifact:** Both camps accept the structural validity of a synthetic case termed the **Gradient Artifact**. This is an engineered entity whose measurable properties vary continuously across every proposed sharp boundary for "organism" versus "artifact." In this case:
      *   Different expert panels draw different regulatory lines.
      *   No natural discontinuity is detectable via instrumentation.
      *   Iterative re-annotation does not converge on a stable classification.
      *   Both camps accept that this case is structurally analogous to standard Sorites cases and that any adequate theory of vagueness must account for it.

  ## Part II: Statement of Disagreements

  The following table codifies the precise divergences between the two camps. Each position is stated in the wording that the named camp itself accepts as accurate.

  | Issue | The Epistemicist Camp | The Supervaluationist Camp |
  | :--- | :--- | :--- |
  | **Extension** | Every vague predicate has a unique precise extension, even if unknowable. | There is no unique precise extension for a vague predicate. |
  | **Borderline Cases** | Borderline cases involve pure epistemic ignorance of a hidden sharp boundary. | In borderline cases, there is genuinely no fact of the matter regarding the predicate's application. |
  | **Truth Definition** | Truth is correspondence to the unique, hidden extension. | Truth for vague sentences is "supertruth" (truth on all admissible precisifications). |
  | **Classifier Uncertainty** | Calibrated uncertainty in any classifier reflects our cognitive limitations rather than semantic openness. | Calibrated uncertainty reflects genuine indeterminacy in the predicate's extension. |
  | **Admissibility** | The distinction between correct and incorrect classifications is sharp. | The set of admissible precisifications need not itself have sharp boundaries. |
  | **Second-Order Vagueness** | The meta-level distinction between admissible and inadmissible precisifications is itself sharp. | The meta-level distinction is itself vague; there is no sharp boundary between admissible and inadmissible precisifications. |
  | **Machine Learning** | A machine-learning system's calibrated confidence near a boundary tracks a hidden fact we cannot access. | A machine-learning system's calibrated confidence near a boundary reflects genuine indeterminacy in the predicate. |

  ## Part III: The Cruxes

  We identify three sub-questions such that settling one would move at least one side. For each crux, we specify the concrete case or argument deemed relevant, and we record in advance the empirical or logical results that would favor or weaken each position.

  ### Crux 1: Second-Order Vagueness and Meta-Level Boundaries
  **Question:** Whether second-order vagueness undermines the Epistemicist's claim that there is always a hidden sharp boundary, even at the meta-level.

  *   **Concrete Case:** A formal system designed to classify borderline cases of "tall" is subjected to higher-order scrutiny regarding the sharpness of its own cutoff points. We examine whether the transition from "definitely tall" to "borderline tall" admits a sharp boundary.
  *   **Epistemicist Prediction:**
      *   *Favoring Evidence:* If logical analysis demonstrates that denying a sharp boundary at the meta-level leads to incoherence or infinite regress, this favors Epistemicism.
      *   *Weakening Evidence:* If it is demonstrated that positing a sharp boundary at the meta-level is intuitively indistinguishable from positing one at the object level (and thus equally problematic), the Epistemicist position is weakened.
  *   **Supervaluationist Prediction:**
      *   *Favoring Evidence:* If we can model admissible precisifications such that the boundary between "admissible" and "inadmissible" is itself fuzzy without logical contradiction, this favors Supervaluationism.
      *   *Weakening Evidence:* If the definition of "admissible precisification" covertly relies on a sharp boundary to function logically, replicating the very problem vagueness was meant to solve, the Supervaluationist position is weakened.

  ### Crux 2: The Gradient Artifact and Convergence
  **Question:** Whether the Gradient Artifact's failure to converge under expert re-annotation is better explained by our ignorance of a single correct cutoff or by the absence of any cutoff to be known.

  *   **Concrete Case:** The Gradient Artifact (as defined in Part I) is subjected to iterative expert labeling over an extended period with improved measurement tools.
  *   **Epistemicist Prediction:**
      *   *Favoring Evidence:* If expert panels eventually converge on a single regulatory line as measurement precision increases, this suggests a hidden fact was being tracked, favoring Epistemicism.
      *   *Weakening Evidence:* If expert panels continue to diverge indefinitely despite perfect information about the Artifact's physical properties, this suggests there is no single cutoff to be known, weakening Epistemicism.
  *   **Supervaluationist Prediction:**
      *   *Favoring Evidence:* If expert divergence persists despite full physical knowledge, indicating that the predicate "organism" lacks a unique extension, this favors Supervaluationism.
      *   *Weakening Evidence:* If convergence occurs based solely on physical properties without arbitrary stipulation, this suggests a unique extension exists, weakening Supervaluationism.

  ### Crux 3: The Status of Admissibility
  **Question:** Whether the Supervaluationist's appeal to "admissible" precisifications covertly relies on a sharp boundary that replicates the very problem vagueness was meant to solve.

  *   **Concrete Case:** The logical properties of a formal system that either selects one unknown extension (Epistemicism) or permits all admissible ones (Supervaluationism) are compared against native speaker intuitions about "definitely" operators.
  *   **Epistemicist Prediction:**
      *   *Favoring Evidence:* If speakers exhibit stable intuitions about what counts as an "inadmissible" use of a predicate (e.g., calling a 7-foot man "not tall" is strictly false), this suggests sharp boundaries on admissibility, favoring Epistemicism.
      *   *Weakening Evidence:* If speakers agree that the boundary of admissibility is itself subject to disagreement and vagueness, the Epistemicist claim of hidden sharpness is weakened.
  *   **Supervaluationist Prediction:**
      *   *Favoring Evidence:* If the set of admissible precisifications can be shown to shift contextually without logical failure, this supports the Supervaluationist model of semantic openness.
      *   *Weakening Evidence:* If the theory requires a precise meta-language to define admissibility, thereby pushing the vagueness problem up one level without solving it, the Supervaluationist position is weakened.

  ## Conclusion

  We submit this document not as a resolution, but as a map of the contested terrain. We agree that the Sorites paradox is not merely a puzzle to be dissolved but a phenomenon to be explained. We disagree on whether the explanation lies in the limits of human knowledge or the limits of semantic reality. By isolating these cruxes, we hope to move future discourse away from talking past one another and toward tests that might genuinely discriminate between these competing visions of logic and language.
