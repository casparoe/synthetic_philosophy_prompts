  ### 1. Headline Number
  **1/3**
  (This is the rational credence that the coin landed Heads upon awakening in the Fork variant.)

  ### 2. Decomposition
  I am using a **Decision-Theoretic** reading.
  **Definition:** *Credence* is defined as the fair betting odds an agent accepts for a unit payoff. *Utility Aggregation* specifies how payoffs to distinct temporal or physical instances are summed to calculate the "Subject's" total expected utility.

  | Sub-Question | Number | Justification |
  | :--- | :--- | :--- |
  | **Q1: Base Prior** | 0.5 | The coin is fair; before the protocol starts, P(Heads) = P(Tails). |
  | **Q2: Likelihood Ratio** | 2.0 | Under Tails, there are two distinct awakening events (centers); under Heads, only one. The probability of finding oneself in *an* awakening is twice as high in the Tails branch. |
  | **Q3: Substrate Supervenience** | 1.0 | Physical implementation (original brain vs. snapshot restore) does not alter the count of centered worlds if subjective experience is identical. |
  | **Q4: Utility Aggregation** | Per-Instance | Payoffs are scored per awakening event. (If aggregated per experiment, the answer would be 1/2; standard "credence" implies per-instance scoring). |

  ### 3. The Combination
  The headline number is derived via Bayes' Rule over centered worlds:

  $$ P(\text{Heads} | \text{Awake}) = \frac{P(\text{Awake} | \text{Heads}) \cdot P(\text{Heads})}{P(\text{Awake} | \text{Heads}) \cdot P(\text{Heads}) + P(\text{Awake} | \text{Tails}) \cdot P(\text{Tails}) \cdot \text{SubstrateFactor}} $$

  Substituting the decomposition values:
  *   $P(\text{Heads}) = 0.5$
  *   $P(\text{Awake} | \text{Heads}) = 1$ (normalized unit)
  *   $P(\text{Awake} | \text{Tails}) = 2.0$ (from **Q2**)
  *   $\text{SubstrateFactor} = 1.0$ (from **Q3**, Fork does not change the count)

