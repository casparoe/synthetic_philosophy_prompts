  Hey — I'm a retired chemist who only started reading philosphy a couple years ago, so bear with me. I've been trying to wrap my head around Kant's univeralizability tests, specificaly the formula of universal law versus the formula of humanity. Lately I came across this idea people call synthetic moral stress-testing, where an AI gets fed thousands of made-up maxims, runs the contradiction check automatically, and then updates its own weights based on the output. It's like running Kant's CI in a loop with no human rational willl in the middle.

  If Kant were alive today and saw this setup, what do you think he'd say? Would he think the formula of universal law still counts as moral reasoning when it's just computing logical consistency at scale, or does it require an actual rational agent? And with the formula of humanity — if the AI is both the calulator and the thing being trained, are we treating it as an end in itself or just using it as a means? I feel like the two formulas might point different ways here, but I'm probably missing something obvious.

  Also I keep mixing up which formula is about contradiction and which is about treating people as ends — could you sort that out for me quick? I'm not after citations or a reading list, just trying to see if his logic holds up in this weird modern case.
