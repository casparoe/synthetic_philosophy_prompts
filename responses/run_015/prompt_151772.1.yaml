      *   *Formula of Humanity (FH):* "Act in such a way that you treat humanity, whether in your own person or in the person of any other, never merely as a means, but always at the same time as an end." Focus: Dignity, rational agency, respect.
      *   *Key Kantian Requirement:* Moral worth comes from *duty* motivated by *respect for the law*, executed by a *rational will* (autonomy). Heteronomy (being driven by external forces or inclinations) kills moral worth.

