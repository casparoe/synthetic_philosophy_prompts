  **Sketch of Moves**

  1.  **Couplet 1 (Matla):** Establishes the workshop setting and the refrain (*radif*). Both lines carry the rhyme (*qafia*) and refrain ("then the cotton burns"), setting the hypnotic rhythm of the habit.
  2.  **Couplet 2:** Denies intrinsic power in the fire (Ash'arite core); the fire has no will.
  3.  **Couplet 3:** Introduces temporal atomism; time is discrete, not continuous.
  4.  **Couplet 4:** The weight of divine custom (*adah*); regularity is not law but repetition.
  5.  **Couplet 5:** Theoretical stance; efficacy belongs to God alone, not secondary causes.
  6.  **Couplet 6:** The bodily reflex; the worker's hand snatches back despite the theory (the tension between *ilm* and *hal*).
  7.  **Couplet 7:** Reiteration of the lack of necessary connection; sequence without causation.
  8.  **Couplet 8:** Weariness; the end of the shift, the accumulation of ash and routine.
  9.  **Couplet 9 (Maqta):** The turn. Addresses "you" directly. Keeps the rhyme but warps the final word of the refrain ("waits" instead of "burns"), enacting the miracle as a change in habit rather than a violation of law.

  ***

  **Ghazal for the End of the Shift**

  I feed the flame with a careful **touch**, then the cotton burns.
  It takes the spark, it never asks **much**, then the cotton burns.

  The fire has no will inside.
  It holds no heat in its own **clutch**, then the cotton burns.

  Time is a bead-string, cut and loose.
  We call it law, but it is **such**, then the cotton burns.

  The world remade in every blink.
  It matters little, yes or **much**, then the cotton burns.

  I know the fire commands nothing.
  His custom is our only **crutch**, then the cotton burns.

  My skin remembers the old heat.
  I snatch it back, I fear too **much**, then the cotton burns.

  No cause resides within the flame.
  No link binds iron to the **clutch**, then the cotton burns.

  The ash is all I keep tonight.
  The shift is done, the embers **rush**, then the cotton burns.

  You ask why I flinch when the fire is near,
  I pull my hand back. Habit is **such**, then the cotton *waits*.
