answer: |-
  Here is the specification for an adequate theory of supererogation, derived from the phenomena, cases, and downstream jobs you provided.

  ### I. Desiderata for an Adequate Theory of Supererogation

  **A. Phenomena to Explain**
  1.  **The Asymmetry of Evaluation:** The theory must explain why supererogatory acts attract praise while their omission does not attract blame, despite the omission often leading to worse states of affairs than standard duty-fulfillment.
      *   *Requirement Driver:* The **Passing Swimmer vs. Lifeguard**. If the theory cannot explain why the swimmer is praised for saving a child while the lifeguard is merely doing their job (or blamed for failing), it fails to capture the role-relative nature of obligation.
  2.  **The Variance of Cost:** The theory must account for the correlation between sacrifice and supererogatory status without making sacrifice strictly constitutive.
      *   *Requirement Driver:* The **Uncostly Hero**. If the theory requires sacrifice, the happy epidemic doctor is excluded. If it ignores cost, the distinction between duty and supererogation collapses into mere optimality. The theory must treat cost as *evidentiary* of excess demand, not *constitutive* of moral worth.
  3.  **The Epistemic Gap:** The theory must determine whether supererogation is a property of the act (objective) or the deliberation (subjective).
      *   *Requirement Driver:* The **Mistaken-Duty Hero**. If the soldier believes he is ordered, is the act supererogatory? A theory that says "no" makes moral worth too dependent on luck; a theory that says "yes" risks detaching praise from actual freedom.

  **B. Verdicts to Return**
  4.  **The Non-Subsidy Condition:** The theory must return a verdict that distinguishes between an act being *morally optional* for the agent and an act being *structurally reliable* for the institution. It must forbid classifying an act as supererogatory if the system is designed to depend on its performance.
      *   *Requirement Driver:* **The Nurse**. This is the knockout constraint. If a theory allows the hospital to budget for the nurse's unpaid overtime by labeling it supererogatory, it fails the political downstream job. It converts praise into a subsidy.
  5.  **The Temporal Stability Constraint:** The theory must specify whether normative status changes with repetition. It must deny that mere repetition converts the optional into the obligatory absent explicit consent or contract.
      *   *Requirement Driver:* **The Ratchet**. If covering shifts becomes duty simply because it was done before, the theory validates resentment as a source of obligation. It must explain why the colleague can stop without blame, even if expectations have risen.
  6.  **The Aggregation Constraint:** The theory must resolve cases where individual permission leads to collective failure. It must allow that an act is permissible for each individual but impermissible for the group, or explain why the individual permission dissolves in the collective context.
      *   *Requirement Driver:* **The Linked-Hands Rescue**. If the theory says "each may omit," and the child drowns, it fails the verdict test. It must handle the transition from *I may* to *We must*.
  7.  **The Advisory Constraint:** The theory must specify the relationship between performing an act and advising on it. It must determine if one can permissibly advise omission of a supererogatory act, or design institutions that assume omission.
      *   *Requirement Driver:* **The Advisor**. If I may omit, may I tell you to omit? If the theory says yes, it risks undermining the value of the act. If it says no, it creates a paradox where an act is good to do but bad to recommend.

  **C. Distinctions to Maintain (or Explicitly Collapse)**
  8.  **Beyond Duty vs. Merely Permissible:** The theory must distinguish supererogation from neutral permission (vanilla vs. chocolate). Supererogation must carry a distinct normative valence (positive) that mere permission lacks.
      *   *Cost of Collapse:* If collapsed, we lose the ability to explain why we feel gratitude for the rescue but indifference to the ice cream choice.
  9.  **Supererogatory vs. Costly-But-Required:** The theory must distinguish acts that are hard but demanded from acts that are hard and optional.
      *   *Cost of Collapse:* If collapsed, we lose the **Honesty in a Corrupt Office** case. Refusing a bribe is costly and rare, but if the theory calls it supererogatory, it implies accepting the bribe is permissible. The theory must classify honesty as duty, regardless of cost.
  10. **Supererogatory vs. Suberogatory:** The theory must account for the mirror image: acts that are permissible to do but blameworthy (e.g., claiming a legal debt from a destitute family).
      *   *Cost of Collapse:* If the theory denies suberogation, it cannot handle **Supererogation by Forbearance** (the debt release). If releasing the debt is supererogatory, claiming it must be suberogatory. If the theory lacks this category, the symmetry of praise/blame breaks.

  **D. Commitments Elsewhere in Ethics**
  11. **Ought Implies Can:** The theory cannot demand acts that are impossible, but it must explain why we praise those who attempt the impossible and fail.
      *   *Requirement Driver:* **The Failed Rescue**. The theory must allow praise for the drowning rescuer without implying he had a duty to succeed. It must separate *attempt* from *outcome* in the calculus of supererogation.
  12. **No Moral Licensing:** The theory must not allow the existence of a supererogatory category to license systematic under-performance in basic duties.
      *   *Requirement Driver:* **Political Argument**. If the category is preserved, it must not be used to argue that society should rely on saints rather than fix structures.

  ---

  ### II. The Three Critical Matters

  **1. Adequacy Conditions vs. Camp Prejudices**
  *   **Action-Guidance:** The demand that a theory be action-guiding *from the agent's deliberative point of view* is a **prejudice** (specifically, a deliberative internalist one). A theory can be adequate if it correctly categorizes acts for *observers* (praise/blame allocators) even if the agent cannot use the category "supererogatory" to decide. In fact, telling an agent "this is supererogatory" often undermines the motive (Kantian worry). The theory should guide the *judge*, not necessarily the *doer*.
  *   **Doing the Best:** The demand that supererogation never license doing less than the best is a **prejudice** of maximizing consequentialism. If a theory requires you to always do the best, supererogation disappears (everything optimal is duty). An adequate theory *must* allow that one can permissibly do less than the best; otherwise, the category is empty.

  **2. Jointly Unsatisfiable Desiderata (The Trade-Offs)**
  *   **The Nurse Paradox (Non-Subsidy vs. Optionality):** You cannot fully satisfy the **Non-Subsidy Condition** and the **Asymmetry of Evaluation** simultaneously in an unjust system. If the act is truly optional (Asymmetry), the institution *can* rely on it statistically, creating a subsidy. If the theory forbids reliance (Non-Subsidy), it effectively turns the act into a duty for anyone in that role, collapsing the supererogation.
      *   *Resolution:* The theory must be **two-level**. At the *individual* level, the act is optional (preserving Asymmetry). At the *structural* level, reliance is forbidden (preserving Non-Subsidy). A single-level theory will fail one of these.
  *   **The Ratchet (Temporal Stability vs. Expectation):** You cannot satisfy **Temporal Stability** (repetition doesn't create duty) and fully respect **Social Expectations** (the resentment of the colleagues). If the theory validates the colleagues' resentment, it admits a duty has formed. If it validates the worker's right to stop, it must dismiss the resentment as irrational. It cannot do both.

  **3. The Knockout Requirement**
  *   **The Non-Subsidy Condition.** This is the requirement to drop last.
  *   *Reasoning:* A theory of supererogation that permits institutions to treat moral excess as a budgetary resource is not just theoretically flawed; it is politically dangerous. It transforms a category meant to describe moral freedom into a tool for exploitation. If a theory cannot distinguish the **Nurse** (exploited) from the **Swimmer** (volunteer), it fails the third downstream job (political argument) and renders the first (praise/blame) complicit in injustice. It is better to have a theory that struggles with the **Uncostly Hero** than one that justifies the **Nurse**.

  ---

  ### III. Scorecard of Candidate Theories

  **1. Simple Beyond-Duty View**
  *   *Verdict:* **Fails.**
  *   *Reason:* Collapses on **Role Relativity** (cannot explain why the lifeguard's rescue isn't supererogatory) and catastrophically fails the **Non-Subsidy Condition**. It treats the Nurse's overtime as purely virtuous, ignoring the structural reliance.

  **2. Maximizing View with Agent-Centred Prerogative**
  *   *Verdict:* **Mixed.**
  *   *Reason:* Handles the **Uncostly Hero** well (maximizing good allows happy work). However, it struggles with the **Advisor** constraint (hard to justify advising sub-optimal acts) and often fails the **Non-Subsidy Condition** because it views the outcome (child saved/meds given) as the primary good, implicitly encouraging reliance on the prerogative to fill gaps.

  **3. Practice/Internal Standard View**
  *   *Verdict:* **Strong on Roles, Weak on Justice.**
  *   *Reason:* Excellent on **Role Relativity** (duties fixed by practice) and **Honesty in Corrupt Office** (honesty is internal to inspection). However, it fails the **Political Argument** job: if the "practice" of nursing includes unpaid overtime as a norm, this view might classify it as duty, or if optional, fail to critique the practice itself. It lacks external critical leverage.

  **4. Contractualist Reading (Reasonable Demands)**
  *   *Verdict:* **Best Fit.**
  *   *Reason:* Strongest on the **Non-Subsidy Condition**. It asks: "Could it be reasonably demanded that anyone in this role do this?" If the hospital relies on it, the answer is "Yes, it should be demanded/paid," moving it from supererogatory to duty. It handles the **Ratchet** well (unreasonable to demand perpetual sacrifice without consent). It struggles slightly with the **Uncostly Hero** (if no sacrifice, is it still beyond reasonable demand?), but this is a minor cost compared to preventing exploitation.
