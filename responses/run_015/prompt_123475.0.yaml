  # Final Exam Question: Rational Choice Seminar

  **Question 1 (75 Minutes)**

  Consider a driver traveling a highway with two consecutive exits, A and B. The driver is absent-minded: upon reaching an intersection, he cannot distinguish whether it is A or B, nor can he recall if he has passed an exit. Consequently, he must adopt a single behavioral strategy $p$ (the probability of exiting) at both nodes. The payoffs are as follows: exiting at A yields 1; exiting at B yields 4; missing both yields 0.

  Before departing, the driver may purchase a hidden commitment device for a fixed cost of 0.5. This device randomly enforces the action "Continue" at exactly one of the two intersections (50% chance at A, 50% chance at B). If the device activates at an intersection, the driver physically cannot exit. If the driver declines the device, he applies a uniform rule $p$ at both nodes. If he purchases the device, he still selects a probability $p$ to apply at any node where the device does not force continuation.

  Write an essay addressing the following:
  (i) Compute the ex ante expected utility of the optimal strategy both with and without the device.
  (ii) Derive the belief-dependent reasoning that applies ex post at an intersection (assuming no device).
  (iii) Explain why the ex post optimal action conflicts with the ex ante optimal plan.
  (iv) Evaluate whether this conflict undermines the coherence argument for dynamic consistency or whether it is dissolved by plan-dependent preferences or the commitment mechanism.

  ***

  # Model Answer

  **Ex Ante Computation**
  Without the device, the driver chooses $p$ to maximize expected utility ($EU$). The probability of exiting at A is $p$ (payoff 1). The probability of reaching B is $(1-p)$, and exiting there is $(1-p)p$ (payoff 4). Missing both yields 0.
  $$EU_{no\_device} = p(1) + (1-p)p(4) = 5p - 4p^2$$
  Maximizing via first-order condition ($5 - 8p = 0$) yields optimal plan $p^* = 5/8$. The maximum $EU$ is $25/16 = 1.5625$.

  With the device (cost 0.5), the structure changes. There is a 50% chance the device forces Continue at A; in this case, the driver reaches B and exits with probability $p$ (payoff $4p$). There is a 50% chance the device forces Continue at B; in this case, the driver exits at A with probability $p$ (payoff $1p$) or misses both.
  $$EU_{device\_gross} = 0.5(4p) + 0.5(1p) = 2.5p$$
  To maximize this, the driver sets $p=1$. The net $EU$ is $2.5(1) - 0.5 = 2.0$. Since $2.0 > 1.5625$, purchasing the device is ex ante rational.

  **Ex Post Belief and Conflict**
  Ex post, upon reaching an intersection, the driver forms a belief $\alpha$ that he is at A. Consistency requires $\alpha$ to match the probability of being at A given the strategy $p$: $\alpha = 1 / (1 + (1-p))$.
  The expected value of Exiting is $\alpha(1) + (1-\alpha)(4)$. The expected value of Continuing is $\alpha(4p)$ (value of reaching B and playing optimally) vs 0 if at B.
  The conflict arises because the ex ante optimal plan ($p=5/8$) requires mixing to balance the risk of exiting too early against missing home. However, ex post reasoning is sensitive to beliefs. If the driver becomes convinced he is at B ($\alpha \approx 0$), the ex post optimal action is pure Exit (4 > 0). If he is convinced he is at A, he should Continue. The ex ante plan requires a specific mixture ($5/8$) that may not align with the ex post impulse to maximize immediate expected payoff given specific belief states, creating a tension between planning and execution.

  **Coherence and Commitment**
  Does this undermine dynamic consistency? Standard expected utility theory assumes preferences are consistent over time. The absent-minded driver paradox suggests that ex ante optimal plans may not be ex post optimal without binding mechanisms. However, the availability of the commitment device resolves this practically. By paying 0.5, the driver alters the choice architecture to align ex post constraints with ex ante goals.
  This does not necessarily undermine coherence; rather, it supports the view of plan-dependent preferences. The rational agent recognizes his future self's inability to distinguish nodes and pays to restrict future choices. The conflict is not a failure of rationality but a feature of imperfect recall. The commitment device dissolves the tension by removing the possibility of ex post deviation, validating the ex ante plan as the true expression of preference. Thus, dynamic consistency is preserved through pre-commitment, reinforcing rather than undermining the coherence of rational choice theory when memory constraints are acknowledged.

  ***

  # Marking Scheme (30 Points Total)

  | Analytical Move | Marks | Typical Student Failure |
  | :--- | :---: | :--- |
  | **1. Strategy Space & No-Device EU**<br>Correctly formulates $5p - 4p^2$, derives $p=5/8$, and calculates $EU=1.5625$. | 6 | Computing payoffs as if the driver could condition on location (e.g., assuming Exit at B is guaranteed). |
  | **2. Device EU & Optimization**<br>Correctly models the device payoff ($2.5p$), identifies $p=1$, and calculates Net $EU=2.0$. | 6 | Ignoring the cost of the device or failing to maximize $p$ under the device regime. |
  | **3. Ex Post Belief Derivation**<br>Derives the consistency condition $\alpha = 1/(2-p)$ and sets up the ex post expected value comparison. | 6 | Treating the paradox as a pure labeling exercise without deriving the belief probability $\alpha$. |
  | **4. Conflict Identification**<br>Articulates the tension between the ex ante mixing requirement and ex post pure strategy incentives based on beliefs. | 6 | Claiming there is no conflict because the math "balances out" in equilibrium, missing the intuitive tension. |
  | **5. Coherence Verdict**<br>Provides a reasoned verdict on whether commitment dissolves the inconsistency or merely displaces it. | 6 | Asserting that rational choice theory is "broken" without analyzing plan-dependent preferences or binding mechanisms. |

  ***

  # Confidence Statement

  I am **highly confident** (95%) in the payoff arithmetic regarding the no-device scenario ($5p - 4p^2$) and the comparative statics showing the device is beneficial ($2.0 > 1.5625$). These are standard derivations adapted logically for the device variant.

  I am **moderately confident** (75%) in the philosophical interpretation of the coherence argument. Specifically, I am least sure whether the hidden-commitment variant *genuinely resolves* the tension or merely *displaces* it onto the pre-departure choice. Some theorists argue that needing a commitment device proves the underlying preference structure is dynamically inconsistent by definition, regardless of whether the agent anticipates it. The model answer takes the stance that anticipation + commitment preserves coherence, but a strong argument could be made that the necessity of the device itself is evidence of incoherence in the unbounded agent.
