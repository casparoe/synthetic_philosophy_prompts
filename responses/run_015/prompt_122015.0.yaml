  **The question**

  The central question is whether the presumption of independence in heuristic reasoning functions as a unified epistemic norm or as a conflation of distinct principles with different stability conditions. Standard practice assumes that setting $P(A \land B) = P(A)P(B)$ is a single move licensed by ignorance. I propose that this move splits along two axes: justification (maximum entropy versus causal separation) and algebraic scope (coarse versus fine partitions). The determinate question this paper answers is: Does distinguishing these axes predict when independence assumptions yield robust conclusions despite being strictly false? Specifically, I will assess whether maximum-entropy presumptions tend toward error cancellation under aggregation, whereas causal presumptions tend toward error compounding. Resolving this determines whether formal epistemology should endorse a single default rule or a differentiated taxonomy of independence heuristics based on their error-propagation profiles.

  **What the standard treatments give and where they stop**

  Standard treatments in formal epistemology and probabilistic logic typically treat independence as a binary default state. When evidence linking variables is absent, the agent is instructed to factorize joint probabilities. This approach often conflates two distinct justifications. First, there is the informational stance: independence is the maximum-entropy distribution consistent with marginals, imposing no extra structure. Second, there is the ontic stance: independence reflects a belief in causal separation or the absence of common causes. Literature usually treats these as interchangeable licenses for the same mathematical operation. This conflation obscures the fact that these justifications respond differently to new evidence. A maximum-entropy assumption is defeated by any structure; a causal assumption is defeated only by connecting mechanisms.

  Furthermore, standard treatments ignore the algebraic instability of independence. Independence between events $A$ and $B$ is logically incompatible with independence between $A$ and $A \land B$. Defaults are rarely specified regarding which Boolean combinations they cover, nor do they address how independence at a coarse partition typically becomes dependence when refined. Standard models assume a fixed sigma-algebra where the default applies uniformly, which is mathematically impossible. Consequently, existing frameworks focus primarily on tracking when independence assumptions fail and invalidate conclusions. They lack the resources to explain why some heuristic arguments succeed despite false independence assumptions. By ignoring the structure of the justification and the algebraic scope, current models cannot distinguish between fragile assumptions that compound error and robust assumptions that self-correct. This stops inquiry into the normative value of heuristics that are technically incorrect but practically reliable, leaving a gap in our understanding of how non-ideal agents should reason under computational constraints. The literature stops at the threshold of formal validity, treating heuristic success as luck rather than a structural feature worthy of modeling, thereby missing the opportunity to formalize the conditions under which incorrect assumptions are epistemically permissible. Thus, the literature provides no guidance on managing error propagation.

  **Method**

  My method proceeds in three stages. First, I will formalize the two axes. I will begin by reviewing the logical constraints on probability assignments to show why a uniform default is impossible. I will define the justification axis by contrasting the maximum-entropy principle (minimizing information) against causal Markov conditions (minimizing connections). I will define the algebra axis by specifying the event space $\mathcal{F}$ over which independence is presumed, distinguishing between atomic events and their Boolean combinations. I will construct a formal taxonomy showing that a default defined on atoms cannot consistently extend to the generated algebra without adjustment.

  Second, I will develop a metric for robustness. I will model the deviation from true independence as an error term $\epsilon$. I will then analyze how this term propagates through inference chains. The key distinction will be between additive error cancellation (where positive and negative deviations offset) and multiplicative error compounding (where deviations amplify). I will derive conditions under which a false independence assumption remains boundedly accurate over $n$ iterations. I will use sensitivity analysis to determine the threshold of dependence that breaks the heuristic.

  Third, I will apply this framework to two case studies. The first involves probabilistic heuristics for prime patterns, such as the Cramer model. Here, independence is presumed based on lack of arithmetic structure (maximum entropy), despite known number-theoretic dependencies. I will analyze why this yields accurate density predictions despite false assumptions, specifically looking at how arithmetic correction factors (like those in Hardy-Littlewood conjectures) quietly repair the independence assumption. The second involves chained multiplications of rough per-instance probabilities in forensic reasoning. Here, independence is often presumed based on causal separation (e.g., distinct evidence sources like DNA and eyewitness testimony). I will assess whether dependencies here lead to catastrophic overconfidence, typical of the prosecutor's fallacy.

  Finally, I will compare the structural reasons for success in the prime case versus failure in the forensic case. I will determine if the justification type (entropy vs. causal) correlates with the error propagation profile. This comparative analysis will allow me to isolate whether the algebraic scope or the justificatory basis is the primary driver of heuristic reliability. I will write out the probabilistic derivations explicitly to show where the cancellation occurs in the number-theoretic case and where it fails in the forensic case. The final output will be a set of formal conditions distinguishing self-correcting heuristics from fragile ones. I will ensure the models are computationally tractable. I will document each step to ensure reproducibility.

  **Possible conclusions and what would decide between them**

  There are two primary possible conclusions. The first is that the justification axis is decisive: maximum-entropy defaults are inherently self-correcting because they distribute error symmetrically, whereas causal defaults are fragile because dependencies are directional and compounding. The second is that the algebra axis is decisive: robustness depends entirely on whether the heuristic operates on coarse partitions where errors cancel, rather than the justification used.

  What would decide between them is the behavior of the error terms in the case studies. If the prime number heuristics show bounded error despite strong dependencies, while the forensic chains show exponential divergence, the justification hypothesis is supported. If, however, both cases show robustness when aggregated coarsely but failure when refined, the algebra hypothesis is supported. A mixed result would suggest a interaction effect: causal defaults require coarse algebraic scopes to be safe.

  Resolving this determines the normative recommendation. If justification is key, agents should prefer entropy-based defaults when structure is unknown. If algebra is key, agents should restrict independence assumptions to coarse grains. Either way, the conclusion will reject the unified default in favor of a context-sensitive norm. This would shift the focus of formal epistemology from validating assumptions to validating the stability of inference procedures under assumption violation. It would provide a formal basis for when "wrong" reasoning is epistemically permissible. The unit of assessment shifts from the truth of the assumption to the stability of the conclusion under aggregation. This reorientation is crucial for bounded rationality.

  **How this could fail, and how I would scope it down**

  The primary risk is that the formalism becomes too abstract to yield clear results, or that the case studies are too technically demanding. Number theory heuristics involve deep conjectures; forensic reasoning involves messy legal standards. If the mathematical derivations become intractable, I will scope down to simplified Bayesian networks where dependence parameters can be manually varied. This preserves the structural analysis without requiring domain expertise.

  Another risk is that the distinction between justification axes collapses in practice. If maximum-entropy and causal defaults yield identical probability assignments in the relevant models, the distinction is merely philosophical. To mitigate this, I will construct examples where they diverge, such as cases with hidden common causes that maximize entropy but violate causal independence.

  If the paper grows too long, I will drop the forensic case study and focus solely on the algebraic axis using abstract probability spaces. This ensures the core theoretical contribution—the instability of independence defaults—is secured even if the applied comparison fails. The goal is to establish the need for the split, even if the full taxonomy remains incomplete.
