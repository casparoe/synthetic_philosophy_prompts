  Her glosses are too consistent. Notice the precision of her language:
  *   *Race:* "Boxes are ours."
  *   *Weeds:* "Plant in the wrong place relative to a garden."
  *   *Money:* "Works because everyone goes along."

  She isn't saying "Race isn't real." She is saying the *classification system* is the construct. This is the standard philosophical definition of social construction (think Ian Hacking or John Searle). She understands that "Constructed" doesn't mean "Fake," it means "Dependent on human practices."

  Because she has already mastered the nuance that "underlying variation is real" (Race) vs. "the thing itself is real" (Gold), she is sophisticated enough to apply that same logic to **Brain Death** (body real, criteria constructed) and **ADHD** (neurology real, category constructed). She will likely call all four **Constructed** without blinking.

  ### 5. The One Further Case to Settle It

  To definitively prove whether she distinguishes between "Made Up" (Chess) and "Carved Up" (Race), or if she sees them as the same, ask her about:

  **Constellations (e.g., Orion's Belt)**

  **The Setup:**
  "The stars are real burning balls of gas (like Gold). But the picture of the Hunter and the specific lines connecting them are just patterns we drew (like Chess/Race). Is the Constellation constructed?"

  **How it settles the debate:**
  *   **If she says "Not Constructed":** She prioritizes the *substrate* (the stars are real). This suggests she might eventually call **Species** "Not Constructed" because the animals are real.
  *   **If she says "Constructed":** She prioritizes the *pattern/boundary*. This confirms the **Unified Rule**. It proves she cares about the *human grouping*, not just the physical stuff.
  *   **The Kicker:** If she says "Constructed," ask: *"Is it constructed in the same way Money is, or in the same way Race is?"*
      *   If she says "Same as Race" (Carved Up), she has one rule.
      *   If she hesitates, she has two rules she's conflating.

  **Summary Prediction:** She will call Constellations **Constructed**, and she will tell you it's exactly like **Race**: the stars are there without us, but the Bear or the Hunter is ours. This will confirm she is running one consistent rule: **"If the boundary requires a human mind, it's constructed."**
