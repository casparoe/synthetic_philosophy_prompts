prompt: |-
  ok i'm on the advisory board for the national memorial museum's new gallery on 20th-c mass violence. we need to vote thursday on the wall text for the 1932-33 Holodomor section. curators want "genocide"; legal counsel warns that using Lemkin's original broad framework (cultural and political groups included) rather than the UN convention's narrower ethnic-intent standard could expose us to donor lawsuits and makes us look inconsistent with how we label the Holocaust in the next room. Ukrainian community reps say calling it just "famine" erases intentional destruction of a national group, which is precisely the kind of harm Lemkin first meant the word to capture. I need a memo recommending one of: straight "genocide," "genocide (under Lemkin's broader definition)" with explanatory text, "crime against humanity" for legal safety, or a split-label approach that uses different frames in different parts of the gallery. The memo should have a concrete recommendation plus timeline for revising display text, take the donor/consistency worry seriously rather than waving it away, and address whether applying different definitional standards across cases is intellectually coherent or just politically convenient. There's also this tension: if we restrict genocide to the UN legal standard, some historically recognized cases become harder to classify, but if we use Lemkin's wider category, "genocide" risks becoming so broad it loses its distinctive moral weight in a memorial context. Draft it for circulation before the meeting.
