  2.  **Deconstruct the Philosophical Concepts:**
      *   **Williams's Integrity Objection:** Utilitarianism alienates agents from their actions and motives by making them channels for the satisfaction of others. It attacks "ground projects" (the things that give life meaning).
      *   **One Thought Too Many:** In a rescue scenario (wife vs. stranger), the utilitarian calculates. Williams says the husband should just save the wife because she's his wife. Calculating adds a thought that undermines the relationship.
      *   **Jordan's Counter (The User's Idea):** Sometimes the ground project *itself* is morally compromised. If I love my brother but he's a murderer, just saving him without thought ignores the victims.
      *   **Moral Remainder:** The idea (often associated with Williams too, but also Nagel/Consequentialist critics) that even after making the right choice, there's a residual guilt or ethical cost. Jordan needs to use this to say: acknowledging that cost (the "extra thought") preserves integrity by acknowledging the complexity, rather than pretending the conflict doesn't exist.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Casual, maybe over coffee or after class. Establish the core disagreement immediately.
