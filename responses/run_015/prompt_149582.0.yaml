answer: |-
  **The Illusion of the Unalterable Self: Why Frankfurt Cases Fail to Kill the Principle of Alternative Possibilities**

  The debate over moral responsibility often hinges on a single, intuitive principle: the Principle of Alternative Possibilities (PAP). Simply stated, PAP asserts that an agent is morally responsible for an action only if they could have done otherwise. For centuries, this was the bedrock of libertarian free will. However, in 1969, Harry Frankfurt introduced a class of thought experiments designed to shatter this bedrock. In a "Frankfurt case," an agent chooses to perform an action on their own, while a hidden mechanism stands ready to force that same action had the agent shown signs of choosing differently. Since the mechanism never activates, the agent acts freely, yet they technically *could not* have done otherwise due to the mechanism's presence. Frankfurt concluded that PAP is false; responsibility requires ownership of the action, not the availability of escape routes.

  While Frankfurt cases successfully dismantle the requirement for *synchronic* leeway (the ability to do otherwise at the exact moment of action), they rely on a conception of "sourcehood" that is too narrow. By shifting the focus from leeway to sourcehood, compatibilists argue that as long as an action springs from the agent's own desires and identification, they are responsible. However, this view crumbles when applied to cases of gradual, engineered identification—where an agent's mind is subtly altered over years until they fully endorse a harmful desire implanted by others. In such scenarios, sourcehood is present, but responsibility is intuitively absent. Therefore, Frankfurt cases do not genuinely undermine PAP; rather, they necessitate a revised principle that retains *historical* alternative possibilities. To be truly responsible, an agent must not only own their will in the present but must have had the opportunity to become otherwise in the past.

  **The Shift from Leeway to Sourcehood**

  To understand why the engineered identification case is problematic, we must first appreciate the strength of Frankfurt's original insight. Traditional PAP focuses on "leeway"—the existence of open forks in the road at the moment of decision. Frankfurt argues that leeway is irrelevant to the *quality* of the agency. If I vote for a candidate because I love their policies, I am responsible for that vote. The fact that a neuroscientist was watching me, prepared to zap my brain to make me vote that way if I hesitated, does not change the fact that *I* voted based on *my* reasons. The intervener is a counterfactual; they play no causal role in the actual sequence of events.

  This shifted the philosophical landscape toward "sourcehood." Under this view, responsibility is about the origin of the action within the agent's psychological architecture. Did the action flow from my first-order desires? Do my second-order volitions endorse those desires? If the answer is yes, I am the source, and I am responsible. This allows compatibilists to argue that even in a deterministic universe, where you technically could not have done otherwise due to the laws of physics, you can still be responsible because the action originated from *you*.

  **The Challenge of Engineered Identification**

  The weakness of the sourcehood-only view emerges when we scrutinize the history of that "source." Consider a case of gradual neural modification. Suppose a subject, Alex, is subjected to a subtle, years-long program of conditioning and micro-stimulation. This process does not coerce Alex at gunpoint; rather, it reshapes Alex's character. Over time, Alex comes to value aggression over compassion. Eventually, Alex commits a violent act. Crucially, at the moment of the act, Alex fully identifies with the desire to be violent. There is no internal conflict; the desire feels authentically "Alex." There is no Frankfurt-style intervener at the door; the engineering is complete, and the "intervener" is now Alex's own modified psychology.

  According to a strict sourcehood view, Alex is responsible. The action springs from Alex's own endorsed desires. The leeway is gone (Alex cannot choose otherwise given the engineering), but the sourcehood is intact. Yet, our moral intuition recoils. We hesitate to blame Alex fully because the "self" that is the source was manufactured. If sourcehood alone is sufficient for responsibility, then a perfectly brainwashed assassin who loves their work is as responsible as a soldier who chooses to fight after critical reflection.

  This suggests that we do care about alternative possibilities, just not necessarily at the moment of action. We care about *historical* alternative possibilities. Could Alex have developed a different character? Was there a time when the engineering could have been resisted or avoided? If the agent's identity itself is the product of a process that bypassed their rational control, then the "source" is tainted. The absence of leeway in the *formation* of the will undermines responsibility, even if leeway is absent at the *execution* of the will.

  **Defending a Revised Principle of Alternative Possibilities**

  The failure of Frankfurt cases to account for engineered identification indicates that PAP should not be discarded, but refined. We must distinguish between *Synchronic PAP* (could I have done otherwise just now?) and *Historical PAP* (could I have become a person who would do otherwise?). Frankfurt cases successfully refute Synchronic PAP. In the standard Frankfurt scenario, the agent's history is normal; only the current moment is constrained by the counterfactual intervener. Thus, the agent retains Historical PAP—they became who they are through normal processes—and therefore remain responsible.

  However, in the engineered identification case, Historical PAP is violated. The agent did not have a reasonable opportunity to develop a different will. The "source" of the action is the agent, but the source of the source is the engineer. To hold the agent responsible here is to ignore the causal history of their agency. Therefore, a Revised PAP is necessary: *An agent is morally responsible for an action only if they act from their own will, and that will was formed under conditions where the agent had the opportunity to develop otherwise.*

  This revised principle preserves the insight of Frankfurt cases (that momentary coercion isn't always necessary to negate responsibility if the will is authentic) while blocking the counter-intuitive result in manipulation cases. It acknowledges that "sourcehood" is not a static property but a historical achievement. True ownership of a desire requires that the process of acquiring that desire was not one of bypassing the agent's critical faculties. If the engineering was gradual and subtle, it likely bypassed those faculties, rendering the resulting identification hollow. Thus, we do not blame Alex not because they lacked leeway at the moment of the crime, but because they lacked leeway in the construction of their criminal self.

  **Conclusion**

  Frankfurt cases are powerful tools that correctly identify the irrelevance of *synchronic* alternative possibilities for moral responsibility. An agent can be responsible even if a counterfactual intervener ensures they could not have done otherwise at time *T*. However, these cases do not prove that alternative possibilities are irrelevant *simpliciter*. When we examine cases of gradual, engineered identification, it becomes clear that sourcehood without historical leeway is insufficient for blame. We intuitively recognize that an agent who is manipulated into endorsing a desire is not the true author of that desire, even if they feel they are. Therefore, a Revised PAP that mandates historical alternative possibilities is required to protect agents from being held responsible for identities imposed upon them.

  **What Would Change My Mind**

  My defense of the Revised PAP rests on the intuition that engineered identification exculpates. I would revise this position under two specific conditions. First, I would be convinced if there were a convincing philosophical analysis demonstrating that **sourcehood and historical leeway are conceptually inseparable**. If it could be shown that "true" sourcehood *logically entails* that the agent had the opportunity to develop otherwise (i.e., that you cannot have genuine ownership of a desire if you lacked historical leeway), then a separate Historical PAP condition would be redundant, and sourcehood alone would suffice.

  Second, I would change my mind if presented with a **real-world parallel in coercive persuasion or addiction recovery** that clearly separates sourcehood from leeway in favor of sourcehood. For example, if empirical studies of recovered addicts or survivors of cults showed that they consistently claim full moral responsibility for actions taken while under conditioning—specifically citing their current endorsement of those values as sufficient, despite acknowledging the lack of historical alternatives—it would suggest that our intuition about engineered identification is flawed. If the agents themselves claim that their current identification is enough to warrant blame or praise, regardless of their history, then the philosophical insistence on Historical PAP may be an artifact of theory rather than a feature of moral life.
