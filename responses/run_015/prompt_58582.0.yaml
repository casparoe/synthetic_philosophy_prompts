  2.  **Deconstruct "Social Constructionism" in this Context:**
      *   The phrase is notoriously slippery. Ian Hacking's *The Social Construction of What?* is the obvious touchstone here.
      *   Key distinctions needed:
          *   Construction of the *concept/category* vs. construction of the *object/people*.
          *   Causal influence (socialization) vs. Constitutive definition (ontology).
