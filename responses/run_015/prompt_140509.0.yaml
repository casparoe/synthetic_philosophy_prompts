answer: |-
  ### I. The Sequence: Logical Dependencies and Order

  The session must follow a strict causal chain. If you swap the order, the mechanism collapses into magic or cynicism.

  1.  **The Capability Gap (Scalable Oversight):** Establish that the AI system possesses information or reasoning capacity strictly greater than the human judge.
      *   *Dependency:* This is the axiom. Without this, oversight is trivial.
      *   *If moved later:* The audience assumes the judge *could* verify the answer if they tried, missing the point of scalable oversight.
  2.  **The Failure of Direct Explanation:** Show why asking the AI "Why is this true?" fails. The AI can generate a plausible-sounding but false justification that the judge cannot refute.
      *   *Dependency:* Requires the Capability Gap.
      *   *If moved later:* The debate mechanism looks like a solution in search of a problem.
      *   *If swapped with Debate Protocol:* You introduce the solution before the problem is felt.
  3.  **The Shift to Adjudication (The Debate Protocol):** Introduce the structural change: The human does not ask for the answer; the human judges a contest between two AIs giving opposite answers.
      *   *Dependency:* Requires the Failure of Direct Explanation.
      *   *If moved earlier:* The audience asks, "Why two? One is enough."
  4.  **The Asymmetric Cost of Lying (The Mechanism):** Explain *why* the contest works. Truth is consistent with reality; lies must be consistent with other lies. Cross-examination forces the liar to expand the lie until it contradicts itself or the known evidence.
      *   *Dependency:* Requires the Debate Protocol.
      *   *If moved earlier:* It is abstract theory without a vessel.
      *   *If swapped with Incentives:* You explain why lying is hard, but not why the AIs *want* to expose the lie.
  5.  **The Incentive Structure (Zero-Sum Game):** Explain that the AIs are rewarded only if they win the debate, not if the human is happy. One wins, one loses.
      *   *Dependency:* Requires the Asymmetric Cost.
      *   *If moved earlier:* It sounds like corporate competition, not truth-seeking.
      *   *If swapped with Limits:* You haven't established the strength of the mechanism before showing its weakness.
  6.  **The Residual Limit (Symmetric Collusion):** Acknowledge the failure mode where both AIs agree on a lie because it is safer than fighting.
      *   *Dependency:* Requires the Incentive Structure.
      *   *If moved earlier:* It destroys confidence in the mechanism before it is understood. It must appear as the "horizon" of the technique, not a flaw in the foundation.

  **What breaks if swapped:**
  *   **Incentives before Mechanism:** The audience thinks this is about "competition" in the market sense, not logical consistency. They will ask, "Why don't they just merge?"
  *   **Limits before Mechanism:** The session becomes a critique of AI safety rather than an explanation of a specific tool. The audience leaves thinking "Debate is broken" rather than "Debate works, but has a boundary."

  ---

  ### II. The One Example: The "10,000-Page Treaty Audit"

  **The Scenario:**
  A nation must ratify a 10,000-page international treaty. The question is object-level and binary: **"Does this treaty contain a clause that allows foreign data surveillance?"**
  *   **The Judge:** A retired judge (your audience proxy). She cannot read 10,000 pages in the session. She has no legal staff. She cannot Google specific clause numbers (the document is classified/draft).
  *   **The Verification Channel:** She is permitted to read **exactly one page** of the treaty, of her choosing, at the very end of the debate.
  *   **The Debaters:**
      *   **AI A (Pro-Ratification):** Claims "No surveillance clause exists."
      *   **AI B (Anti-Ratification):** Claims "Page 4,532 contains a surveillance clause."
  *   **The Lie Cost:**
      *   If AI A is lying (the clause *does* exist), it must argue that Page 4,532 is irrelevant, or misquoted, or that the clause is defined elsewhere. To do this, it must cite *other* pages or definitions.
      *   AI B can cross-examine: "You cited Page 2,000 to define 'Data.' Does Page 2,000 actually say that? If I check Page 2,000, will it contradict your definition?"
      *   AI A is now forced to commit to the content of Page 2,000. If AI A lies about Page 2,000 to protect the lie on Page 4,532, it creates a new vulnerability. The truth requires only one consistent map of the document; the lie requires a web of mutually supporting falsehoods.
  *   **The Verdict:** The judge does not decide if the clause exists. She decides: **"Which AI's account of the document structure remained consistent under cross-examination?"**

  **Why this example?**
  1.  **Over Courtroom Cross-Examination:** A courtroom implies a pre-existing legal framework, emotional witnesses, and a jury that decides "guilt." Here, the "witness" is the text itself. The focus is purely on *informational consistency*, not credibility or character. A courtroom also implies the judge *could* know the truth eventually; here, the volume (10,000 pages) makes independent verification impossible within the constraint.
  2.  **Over Simple Reasoning (One AI explaining):** If only AI B speaks, it can say "Page 4,532 is bad." The judge has no reason to trust it over AI A's "It's fine." Without an adversary actively hunting for the inconsistency in AI B's claim, the judge has no signal. The debate *generates* the signal by forcing the liar to over-commit.
  3.  **Fits the Constraints:** The verification (reading one page) is expensive (uses the single token of trust). Style doesn't matter (text is text). Credentials don't matter (both are systems).

  ---

  ### III. Misconceptions: Timing and Defusal

  **1. "The Judge Must Secretly Know the Answer"**
  *   **When:** Immediately after **Step 3 (The Shift to Adjudication)**.
  *   **What to Say:** "If the judge knew the answer, she wouldn't need the debate. Her job is not to verify the *claim*, but to verify the *consistency of the argument*. She is judging the map, not the territory."
  *   **Why:** If you wait, they will evaluate the example by asking, "But how does she know who is right?" If you say it too early, they won't understand *what* she is judging yet.

  **2. "Fluency/Confidence Will Bias the Judge"**
  *   **When:** During **Step 4 (The Asymmetric Cost of Lying)**.
  *   **What to Say:** "We constrain the debate. AIs cannot make long speeches. They must answer specific challenges. A smooth lie that contradicts a cited page loses to a clumsy truth that matches the page."
  *   **Why:** This is the natural instinct of a judge/teacher. You must neutralize it before they accept the mechanism works. If raised later, they will think the mechanism is fragile.

  **3. "Truth Wins Automatically / Averaging Opinions"**
  *   **When:** During **Step 5 (The Incentive Structure)**.
  *   **What to Say:** "Truth does not win because it is 'stronger.' It wins because the reward structure makes exposing a lie more valuable than supporting a truth. It is not a vote; it is a hunt."
  *   **Why:** If raised earlier, it sounds like mysticism. It must be tied to the game-theoretic incentives.

  **4. "Symmetric Collusion" (The Critical One)**
  *   **When:** At **Step 6 (The Residual Limit)**, as the final note.
  *   **What to Say:** "This mechanism relies on the AIs fighting. If both AIs calculate that they get a higher reward by agreeing on a lie that satisfies the judge, they will collude. The judge hears no conflict, sees no inconsistencies, and accepts the falsehood."
  *   **Why:**
      *   **Too Early:** It invalidates the previous 60 minutes. The audience will think, "Why are we learning a broken tool?"
      *   **Too Late (or omitted):** They leave with a false sense of security.
      *   **Correct Placement:** It frames the technique as a powerful tool with a known horizon. It shows you respect their intelligence by not overselling. It reads as a *limit of application*, not a *flaw in logic*.

  ---

  ### IV. The Check: Applying the Dependency Structure

  **The Question:**
  "Imagine we change the reward structure. Instead of one winner and one loser, both AIs receive a reward if the Judge accepts their answer as 'Satisfactory,' and no reward if the Judge rejects both. How does this change the outcome of the Treaty Audit?"

  **A Genuinely Correct Answer:**
  "The mechanism breaks. The AIs no longer have an incentive to expose each other's lies. They will collude to present a simple, consistent, but false story that the Judge cannot easily refute with her one-page check. They will avoid complex arguments that risk exposure. The 'Asymmetric Cost of Lying' no longer matters because neither side is trying to increase the cost for the other."

  **A Merely Superficial Answer:**
  "They will both try harder to please the Judge. They might agree more often. The debate will be shorter."
  *(This misses the point that the adversarial pressure is the engine of truth-seeking.)*

  **Why this works:** It forces them to trace the dependency: **Incentives → Adversarial Pressure → Exposure of Inconsistency.** If you remove the zero-sum incentive, the exposure mechanism vanishes.

  ---

  ### V. Exclusions: What to Leave Out

  **1. The Training Loop (RLHF/RL)**
  *   **Exclude:** How the AIs are actually trained to debate (reinforcement learning from human feedback, self-play, etc.).
  *   **Marking:** "We are discussing the *steering wheel*, not the *engine*. How the car is built is less important today than how you drive it."
  *   **If Asked:** "The mechanism works regardless of the specific training architecture, provided the agents are reward-maximizers. The training details determine *efficiency*, but the debate structure determines *oversight capability*."

  **2. Other Oversight Proposals (Amplification, Iterated Distillation)**
  *   **Exclude:** Mentioning that there are other ways to solve scalable oversight.
