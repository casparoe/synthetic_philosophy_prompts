answer: |-
  # Adversarial Collaboration: The Status and Utility of Heritability Estimates

  **Participants:** Quantitative Geneticist (QG) vs. Developmental Critic (DC)
  **Date:** October 2023
  **Subject:** Narrow-sense heritability ($h^2$) in human behavioral traits

  ### 1. What we both accept

  1.  **Definition:** Narrow-sense heritability ($h^2$) is strictly defined as the ratio of additive genetic variance to total phenotypic variance ($V_A/V_P$) within a specific population at a specific time.
  2.  **Population Specificity:** $h^2$ is not a fixed property of a trait; it changes if the distribution of genes or environments in the population changes.
  3.  **Within/Between Distinction:** A high within-group $h^2$ provides zero logical license to infer that average differences *between* groups are genetic in origin.
  4.  **Boarding School Math:** In the "Uniform Boarding School" thought experiment, equalizing environmental variance ($V_E$) necessarily increases $h^2$ (approaching 1.0 as $V_E \to 0$), even if the population mean shifts drastically due to the new environment.
  5.  **Trait K History:** For Trait K (single-locus deficiency + micronutrient), the pre-intervention $h^2 \approx 0.9$ was a mathematically correct description of variance in population P *given* the absence of supplementation.
  6.  **Trait K Intervention:** The reduction of Trait K prevalence via salt supplementation demonstrates that high $h^2$ is compatible with high environmental malleability if the specific environmental moderator is identified and manipulated.
  7.  **Genetic Nurture:** Standard twin and family designs confound direct genetic effects with indirect "genetic nurture" (parents transmitting environments correlated with their own genotypes), inflating $h^2$ estimates relative to direct biological effects.
  8.  **Immutability:** High $h^2$ does not imply immutability; phenylketonuria (PKU) is highly heritable but environmentally manageable.
  9.  **Intervention Difficulty:** High $h^2$ implies that *random* or *unspecified* environmental interventions are unlikely to reduce variance, because current environmental variance is already low relative to genetic variance.
  10. **PGS Validity:** Polygenic Scores (PGS) predict phenotypic variance in the populations where they are trained, but predictive accuracy decays across ancestries and distinct environmental contexts.
  11. **GxE Existence:** Gene-by-Environment interactions exist; the magnitude of genetic effects can depend on environmental context (e.g., SES).
  12. **Causal Language:** It is incorrect to tell an individual "X% of your trait is genetic"; genes and environment are necessary conditions for the development of the trait in every individual.

  ### 2. Where we still disagree

  | Crux | QG Formulation | DC Formulation | Why distinct |
  | :--- | :--- | :--- | :--- |
  | **Informational Value** | $h^2$ constrains theory: any environmental explanation must account for why current environmental variance fails to swamp genetic variance. | $h^2$ is bookkeeping: it describes the status quo of variance but constrains nothing about *potential* environmental mechanisms we haven't found yet. | QG sees $h^2$ as a barrier to entry for theories; DC sees it as a snapshot of current ignorance. |
  | **Boarding School Meaning** | The rise in $h^2$ confirms the metric's validity: it isolates genetic variance by removing noise, showing the "true" biological signal. | The rise in $h^2$ is a reductio: a metric that increases as we equalize welfare signals we are measuring privilege, not biology. | QG views $V_E$ reduction as noise removal; DC views it as removing the very lever policymakers care about. |
  | **Trait K Lesson** | The 0.9 was useful: it told us genetic screening would be more cost-effective than searching for environmental fixes *at that time*. | The 0.9 was misleading: it discouraged the search for the micronutrient by making the trait look "biological" and fixed. | QG focuses on resource allocation under uncertainty; DC focuses on how the label shapes research priorities. |
  | **Genetic Nurture** | Indirect effects are still "genetic" in a broad sense: they track parental genotype and are transmitted across generations like genes. | Indirect effects are environmental: labeling them "genetic" obscures the mechanism (parenting/resources) and suggests biological fatalism. | QG cares about transmission fidelity; DC cares about mechanistic intervention points. |
  | **Policy Heuristic** | Default assumption: High $h^2$ means environmental interventions will have low ROI compared to targeting high-$h^2$ individuals differently. | Default assumption: High $h^2$ means we haven't found the right environmental lever yet; assume malleability until proven otherwise. | QG optimizes for current efficiency; DC optimizes for discovery of new levers. |

  ### 3. Cruxes and predictions

  **Crux 1: The Stability of Rank Order Under Environmental Expansion**
  *Scenario:* A longitudinal study tracks IQ in a cohort where environmental variance is drastically expanded (e.g., random assignment to high-resource vs. low-resource foster care) compared to a standard population.
  *QG Prediction:* While means will shift, the rank-order correlation (and thus $h^2$) will remain stable or increase. Genetic potential sets the slope; environment sets the intercept. If $h^2$ drops significantly, it implies massive, specific GxE interactions that are rare.
  *DC Prediction:* $h^2$ will drop significantly in the high-variance environment. Genetic effects are contingent on specific environmental supports; without the "right" environment, genetic variance cannot express itself. High $h^2$ in normal populations is an artifact of restricted environmental range.
  *Concession:* QG concedes that if $h^2$ drops near zero in the high-variance arm, $h^2$ is too context-dependent to guide policy. DC concedes that if $h^2$ stays high despite massive environmental swings, "searching for the environmental lever" is a low-ROI strategy.

  **Crux 2: The "Missing Moderator" in Trait K Analogues**
  *Scenario:* We search for a single environmental moderator for a complex trait (e.g., reading ability) analogous to the micronutrient for Trait K, capable of reducing prevalence of "disability" by >90%.
  *QG Prediction:* This will not happen for complex traits. Trait K is a monogenic error; complex traits are polygenic. Expecting a "micronutrient for IQ" is category error. High $h^2$ in complex traits reflects many small biological constraints, not one missing input.
  *DC Prediction:* It is plausible. The Flynn Effect shows large mean shifts from unknown environmental changes. We may find a "nutrient" (e.g., specific early childhood stimulation) that unlocks potential for the bottom decile, effectively wiping out genetic variance in that range.
  *Concession:* QG concedes that if a single intervention wipes out variance, the "polygenic constraint" model is wrong. DC concedes that if decades of search yield only small effects, the "missing moderator" hypothesis is wishful thinking.

  **Crux 3: Genetic Nurture Decomposition and Policy**
  *Scenario:* A study uses within-family PGS designs to separate direct genetic effects from genetic nurture for Educational Attainment (EA).
  *QG Prediction:* Direct effects will account for the majority (>60%) of the predictive power. Genetic nurture is real but secondary. Policy should focus on helping those with low direct genetic propensity.
  *DC Prediction:* Direct effects will be minority (<40%). Most "heritability" of EA is actually genetic nurture (parental SES/behavior). Policy should focus on decoupling parental resources from child outcomes, not sorting kids by genes.
  *Concession:* QG concedes that if nurture dominates, sorting by PGS is ethically and practically flawed. DC concedes that if direct effects dominate, equalizing parental resources won't equalize outcomes.

  ### 4. Verbal disputes

  A significant portion of our public fighting is purely terminological, specifically around the word "genetic." QG uses "genetic" to mean "variation that tracks DNA differences in the current population," which includes indirect effects (genetic nurture) because they correlate with DNA. DC uses "genetic" to mean "direct biological causation internal to the individual," excluding parental behavior. This leads to DC hearing "genetic" and thinking "biological fate," while QG means "statistically predictable from genotype."

  Both sides agree to stop using the phrase "X% genetic" regarding individuals. QG must stop using "heritable" as a shorthand for "hard to change" in public communication, as this invites the immutability fallacy. DC must stop describing $h^2$ as "pseudoscience" when it is mathematically sound, reserving criticism for its *interpretation*. We agree that "heritability" describes a population's variance structure, not a trait's essence. If we can enforce this distinction, 50% of the heat in the debate vanishes, leaving only the empirical disagreements listed above.
