answer: |-
  ### The branching questions

  These eleven questions form the branching nodes of the casting grid. Each forces a binary split based on concrete intuition rather than technical definition. The Pendulum tests fundamental law; the Weather tests computational limits. The Harvest and Death cases test reflexivity and fatalism specifically. The Job case isolates agency from causation. The Epidemic separates aggregate from individual. The Seizure and Coin distinguish error from chance. The Light case addresses relativistic constraints. The Investigator case tests for superdeterministic correlation. The Story case isolates narrative meta-physics. Together they map the logical space of predictability. A character's path through these yes/no choices locates their philosophical position without requiring them to know the name of it.

  1. **Pendulum:** If we reset the swing to the sixth decimal, does it trace the same arc? Yes implies physical determinism; No implies fundamental noise or chaos.
  2. **Weather:** With infinite computing speed, is the three-week forecast knowable? Yes implies computability; No implies deterministic uncomputability or chaos.
  3. **Harvest:** If the forecast changes planting, does the harvest change? Yes implies reflexive mutability; No implies fixed outcomes regardless of knowledge.
  4. **Death:** If you read your death date, can you hide? Yes implies avoidable fate; No implies fatalistic fixedness.
  5. **Job:** Given the exact same mental state, could you choose the other job? Yes implies libertarian agency; No implies causal determination.
  6. **Epidemic:** Can we know the total dead without knowing who? Yes implies statistical regularity; No implies individual determinacy.
  7. **Seizure:** When the device fails, is the sensor dirty or the logic wrong? Yes implies epistemic error; No implies ontic indeterminacy.
  8. **Coin:** Is the spinning coin's fall chance or just hidden cause? Yes implies ontic chance; No implies ignorance.
  9. **Light:** Is the distant star's explosion fixed before light arrives? Yes implies absolute simultaneity; No implies relativistic openness.
  10. **Investigator:** Is your choice to measure linked to what you measure? Yes implies superdeterminism; No implies independent agency.
  11. **Story:** Is the ending real before you turn the page? Yes implies narrative fixedness; No implies genuine openness.

  ### The space before the names

  The logical space prior to naming positions rests on three independent variables: ontic fixedness, epistemic inferability, and agential control. These variables do not collapse into one another. A future may be fixed yet inferable only to a god (Chaotic Determinism), or fixed yet unknowable even in principle (Uncomputable). Control may exist without fixedness (Libertarianism), or be compatible with fixedness (Compatibilism). The harvest and death cases introduce reflexivity: does the prediction alter the predicted? This creates a split between fatalism (fixed regardless of knowledge) and mutable futures (knowledge changes outcome). The epidemic case distinguishes aggregate law from individual fate, allowing for statistical determinism without individual predictability. The seizure and coin cases separate model error from data error, and ignorance from ontic chance. The light case introduces relativistic constraints on 'now'. The story case separates the reader's experience from the text's reality. Most philosophical positions occupy coherent clusters within this cube. Hard determinism occupies Fixed/Inferable/No-Control. Libertarianism occupies Unfixed/Control. The empty regions are those where control exists without unfixedness (unless redefined) or where fixedness denies all inference without chaos. The tree structures these combinations into distinct pathways.

  There are theoretically 2^11 combinations, but logical constraints prune most. For instance, Ontic Chance (Coin) contradicts Physical Determinism (Pendulum). Fatalism (Death) contradicts Avoidability. The live combinations are those where the answers cohere: if the pendulum is determined, the coin must be ignorance. If the harvest is mutable, the death prognosis must be avoidable. The space allows for positions that accept fixedness but deny control, or deny fixedness but deny control (dice). It allows for positions that accept fixedness but redefine control. It allows for positions that deny fixedness based on relativity rather than chance. The tree maps these coherent clusters, ensuring each leaf represents a stable configuration of answers rather than a contradictory mix.

  ### The tree with named leaves

  1. **Hard Determinism:** Pendulum Yes, Job No. The future is a single physical line. Awkward commitment: Regret is an irrational error in processing causal data, making remorse pointless.
  2. **Block Universe:** Pendulum Yes, Light Yes. Past and future exist equally. Awkward commitment: Grief is merely spatial confusion about where you are in the block, denying loss.
  3. **Classical Compatibilism:** Pendulum Yes, Job Yes. Freedom is acting without external constraint. Awkward commitment: Freedom is just the lack of chains, not the ability to do otherwise, hollowing praise.
  4. **Deterministic-but-Chaotic:** Pendulum Yes, Weather No. Fixed but sensitive to initials. Awkward commitment: Knowledge is always provisional and decays with time, forbidding certainty.
  5. **Indeterministic-but-Unfree:** Pendulum No, Job No. Randomness does not grant control. Awkward commitment: You are not an agent, but a dice roll in a cup, denying dignity.
  6. **Libertarianism:** Pendulum No, Job Yes. Agency breaks the causal chain. Awkward commitment: Choice is uncaused magic inside the mind, defying physics.
  7. **Superdeterminism:** Investigator Yes. Choices correlate with system. Awkward commitment: Science is a scripted play where you cannot choose the experiment, ruining inquiry.
  8. **Deterministic-but-Uncomputable:** Pendulum Yes, Weather No (Law). Laws exist but cannot be calculated. Awkward commitment: Truth exists but cannot be spoken by any procedure, silencing prophecy.
  9. **Narrative Openness:** Story Yes. Text is fixed, experience open. Awkward commitment: Life is merely read, not lived, by the higher author, reducing existence.
  10. **Relativistic No-Future:** Light No. No universal 'now' to be fixed. Awkward commitment: 'Now' is a local lie told by light cones, fracturing shared time.
  11. **Statistical Determinist:** Epidemic Yes, Individual No. Aggregates are fixed, individuals noise. Awkward commitment: Persons are interchangeable units in a calculation, erasing identity.
  12. **Fatalist:** Death No, Harvest No. Knowledge cannot change outcome. Awkward commitment: Action is theater; the script ignores your improvisation, nullifying effort.

  ### Unoccupied cells

  1. **Fixed + Controllable (Non-Compatibilist):** Incoherent. If the future is physically fixed, control requires redefining control.
  2. **Unfixed + Fatalistic:** Unattractive. If the future is not fixed, why can't you evade it?
  3. **Statistical + Individual Predictability:** Unclaimed. Contradicts the definition of statistical regularity.
  4. **Uncomputable + Inferable:** Incoherent. If it is inferable, it is computable by definition.
  5. **Relativistic + Absolute Now:** Incoherent. Physics denies universal simultaneity.
  6. **Superdetermined + Independent Investigator:** Incoherent. The correlation defines the position.
  7. **Narrative Open + Text Unwritten:** Unclaimed. Denies the premise of the case.
  8. **Chaotic + Infinite Compute Knowable:** Unattractive. Chaos implies sensitivity that defeats computation.
  9. **Indeterministic + Perfect Prediction:** Incoherent. Chance denies perfect prediction.
  10. **Fatalistic + Mutable Harvest:** Unattractive. Why is death fixed but harvest mutable? These diagnose the empty cells as logical contradictions or deeply unstable positions no character would hold.

  ### Where the tree cannot separate

  The tree cannot separate **Hard Determinism** and **Block Universe** on practical grounds. Both assert a fixed future; the difference is merely metaphysical packaging (temporal flow vs. spatial dimension). A character holding either will act identically regarding prediction and responsibility. Similarly, **Deterministic-but-Chaotic** and **Deterministic-but-Uncomputable** converge on the same practical limit: the forecast is impossible. The distinction lies in whether the barrier is sensitivity to data or the nature of the law itself. For a novelist, this means a Chaotic Determinist and an Uncomputable Determinist will argue about the *source* of their failure, but agree on the *fact* of it. They are functionally identical in the Academy's daily work, differing only in late-night theoretical debates. I flag these pairs because forcing a scene where they disagree on outcomes would be false; they must disagree on explanations.

  ### Casting note

  The best scene arises from a single-node disagreement. Pair a Compatibilist with a Hard Determinist. Both agree the Pendulum swings the same way (Fixed). Both agree the Job choice was caused. They split only on the Job question: 'Could you have chosen otherwise?' The Compatibilist says 'Yes, if I wanted to.' The Determinist says 'No, you couldn't want otherwise.' This allows them to agree on all the science (the Academy's work) while fighting bitterly about morality (the death prognoses). They share the same data but inhabit different moral universes. This single branch point generates heat without requiring exposition on physics.
