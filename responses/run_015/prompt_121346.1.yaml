  # Decision Tree: The Integrity Objection Taxonomy

  **Instructions:** Answer each question based on your substantive intuitions about the "one thought too many" case (saving a spouse). Do not worry about which philosopher holds which view. Follow the path to your leaf node.

  ### **ROOT: The Location of the Error**
  **Q1. In the spouse-rescue case, suppose the agent acts on immediate love but later admits, "The ultimate justification for my having this love is that it maximizes overall good." Has the agent violated their integrity?**
  *   **NO:** The violation only occurs if they *calculate* during the rescue. As long as the psychology in the moment is direct, the retrospective justification is harmless.
      *   → Go to **Q2**.
  *   **YES:** The violation lies in the *truth of the justification*. Even if the moment was impulsive, grounding that impulse in a moral system corrupts the relationship.
      *   → Go to **Q3**.

  ---

  ### **PATH A (The "Momentary Psychology" View)**
  *You believe the error is about thinking in the moment, not the ultimate ground of the motive.*

  **Q2. Can a moral theory avoid the objection by training people to have direct motives (love, duty) for daily life, while using calculation only to design that training?**
  *   **YES:** We can compartmentalize. The "critical level" justifies the system; the "intuitive level" lives the life.
      *   🍃 **LEAF: Two-Level Utilitarian**
      *   *Most Awkward Commitment:* You must admit your deepest loves are ultimately "engineered" dispositions justified by a calculus you aren't allowed to think about while loving.
  *   **NO:** Even if you hide the calculation, the fact that the motive is *instrumental* to the system makes it inauthentic.
      *   🍃 **LEAF: Psychological Purist (Unnamed)**
      *   *Most Awkward Commitment:* You reject the standard consequentialist fix but still locate the error in psychology rather than justification, leaving you with no clear account of *why* the motive is corrupted if the agent never thinks the thought.

  ---

  ### **PATH B (The "Justificatory Ground" View)**
  *You believe the error is that the relationship is being subordinated to a system, even retrospectively.*

  **Q3. Does this prohibition on calculative justification apply equally to institutional roles (e.g., a judge sentencing, a doctor triaging) as it does to intimate relationships?**
  *   **NO:** Intimacy requires non-calculative grounds; institutions require impartial calculation.
      *   🍃 **LEAF: Institutional Separationist**
      *   *Most Awkward Commitment:* You must explain why a judge's integrity is less sensitive to "one thought too many" than a spouse's, effectively creating two distinct moral ontologies for public and private life.
      *   ⚠️ **COLLISION WARNING:** At the institutional level, this view becomes indistinguishable from the **Two-Level Utilitarian** who assigns the "critical level" to public policy. Both permit calculation for judges but forbid it for spouses. The tree cannot separate them here because their practical prescriptions converge, even if their metaphysical grounds differ.
  *   **YES:** Calculative justification is suspect in both private and public personal actions.
      *   → Go to **Q4**.

  ---

  ### **PATH C (The "Universal Justification" View)**
  *You believe calculation corrupts justification everywhere, not just in intimacy.*

  **Q4. Is the core mistake treating the person as a *replaceable instance* of a category (e.g., "a wife"), or is it simply appealing to *any external moral system* (e.g., "utility")?**
  *   **Replaceable Instance:** The problem is generic reasoning. "She is my wife" is fine as a reason, provided it means *this* person, not "whoever fills the wife role."
      *   🍃 **LEAF: Ethical Particularist**
      *   *Most Awkward Commitment:* You struggle to explain how we learn moral reasons or resolve conflicts without appealing to some form of generalization or principle.
  *   **Any External System:** The problem is subordinating personal commitment to *any* impartial standpoint, even if the reason is specific.
      *   🍃 **LEAF: Strict Williamsian**
      *   *Most Awkward Commitment:* You risk making morality impossible or purely arbitrary, as any attempt to step back and reflect on why your commitments matter threatens to corrupt them.

  ---

  ### **Summary of Leaves & Tensions**

  | Position | Core Intuition | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Two-Level Utilitarian** | Psychology in the moment is what counts. | Loves are "engineered" dispositions; agents must remain ignorant of the true justification while acting. |
  | **Institutional Separationist** | Private life is sacred; public policy is functional. | **Collapses with Two-Level** at the institutional node. Requires a hard metaphysical split between public/private agency. |
  | **Ethical Particularist** | Reasons must be specific, not generic. | Moral learning and conflict resolution become mysterious without general principles. |
  | **Strict Williamsian** | Any external system corrupts internal commitment. | Reflection itself becomes dangerous; risks moral arbitrariness. |
  | **Psychological Purist** | Calculation corrupts, but system-design doesn't save it. | Lacks a robust account of *why* the motive is corrupted if the thought never occurs. |

  ### **Note on Indistinguishability**
  **The Separationist / Two-Level Collapse:**
  At **Q3 (NO)**, the **Institutional Separationist** and the **Two-Level Utilitarian** (from Path A) converge. Both permit a judge to calculate social utility while forbidding a spouse from calculating utility.
  *   **Difference:** The Two-Level Utilitarian says the judge's calculation is justified by the *same* ultimate principle (utility) as the spouse's love, just at a different "level." The Separationist says the judge and spouse are playing *different games* with different ultimate ends.
  *   **Problem:** In practice, this tree cannot separate them because both answer "No" to Q3. Distinguishing them requires asking about the *ultimate source of validity* for the judge's role, which is a meta-ethical question beyond the scope of action-theory alone.
