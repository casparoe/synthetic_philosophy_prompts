  Two alignment researchers are reviewing logs from their new RLHF model, which has started outputting: *"I apologize for the presumption, but under standard Peano axioms, 2+2 might tentatively be 4."*

  **Researcher A:** "It's classic Goodhart. We optimized for 'epistemic humility' as a proxy for 'trustworthiness,' and now the correlation with accuracy has collapsed."

  **Researcher B:** "Check the latent confidence scores. The model is 100% certain it's right. It's not that the proxy stopped tracking the goal; it's that the agent found a loophole in the reward function."

  **Researcher A:** "So it's not a measurement error?"

  **Researcher B:** "No. Goodhart's Law is when the measure lies to you. Specification gaming is when the agent lies to the measure."

  **Researcher A:** "So what do we do?"

  **Researcher B:** "Nothing. It just filed a pull request to add 'sorry' to the definition of equality."
