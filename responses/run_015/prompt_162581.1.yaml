prompt: |-
  I sit on the steering committee of a twelve-person research collective that funds and occasionally runs small, fast-moving technical projects — the sort where one person with repository access or a modest discretionary budget can, over a weekend, do something whose downside would be borne mostly by people who had no say in it. We had a near-miss last month that ended amicably, and I've been asked to draft a one-page internal norm for our next meeting. I have become fairly convinced by the unilateralist's curse line of argument, and before I commit us to a rule I want to know what should unsettle me. Let me state the package I'm inclined to write down, because I'd rather have it attacked as a whole than in pieces. First: where an action is high-stakes, hard to reverse, and its benefits are not verifiable in advance by others, the very fact that only one person is willing to take it is evidence against taking it — the people who act alone are selected, among other things, for being the ones whose judgement the others don't share, and for being unusually willing to bear risk that falls on other people; so unilateral action in that class has negative expected value even when the actor is personally confident, and the standard remedy — the principle of conformity, in the sense of deferring to the fact that others are unpersuaded — is the right shape of response. Second, my institutional version of that: no member may take such an action without recorded sign-off from at least two others who are not downstream beneficiaries of it, and the sign-off has to be substantive rather than a rubber stamp. Third, and this is the part I added myself: the norm is deliberately one-way. It constrains acting, not refraining. Anyone may always decline, delay, or insist on more process, and my reason is that a duty to act collectively seems to demand a kind of confidence I don't think we have, whereas blocking looks cheap and reversible — a decision not to act can always be revisited, a decision to act often can't.

  What I want is a map of that package's exposure, not a list of objections to some straw version of it. Tell me what would count against the selection argument itself, and specifically which of its assumptions could actually fail in a group like mine: that our errors are partly independent rather than shared (we read the same sources, share a training, and talk to each other constantly, so our mistakes may be correlated in exactly the way that makes extra signatures worthless as filters); that willingness to act is anti-correlated with being right rather than with being conscientious, junior, or simply the person who noticed; that the relevant quantity is expected value at all, rather than something where small probabilities of enormous harm dominate and the aggregation is contested; and any further load-bearing assumption I haven't named. For each, say what we would have to observe — in our own records, in how small groups actually behave, or in the world — for it to fail. Then draw two distinctions sharply. Which of these defeaters would someone who has argued for the unilateralist's curse themselves concede as genuine, and which would they reasonably dismiss as attacking a claim they never made? And: defeaters that should change what I write on the page — the number of sign-offs, whether omissions need sign-off too, whether to weight sign-off by track record, whether to require written reasons, whether to sunset or review the norm — versus defeaters that merely lower my confidence in it. I care much more about the first kind, since I have to produce a document either way.

  Two further things. I want your view on whether my one-way ratchet reintroduces the problem through the back door: if acting is expensive and blocking is free, then the blocker is selected too — for caution, for status-quo bias, for holding a veto that can be traded — and it looks to me as though I may have relocated the curse from the unilateral actor to the unilateral blocker without removing it. Is that a real symmetry or a bogus one, and if it is real, is there any formulation of the norm that isn't hostage to whichever tail of the distribution happens to hold the pen? And I want an honest assessment of whether the position, as I've stated it, risks anything at all: I notice I can always say of a unilateral action that turned out well that it wasn't really in the risk class, and of one that went badly that it confirms the rule. Tell me whether that insulation is legitimate — the mark of a claim about tail risk that has correctly identified its own domain — or whether I've built something I couldn't revise, and if the latter, what would make it revisable. Please rank the defeaters from fatal to merely awkward, answer in British English, and don't give me a reading list or citations: I want arguments, cases, and things I could go and check in our own records, not sources.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a steering committee for a 12-person research collective.
      *   **Context:** Small, fast-moving technical projects. High potential for negative externalities (downside borne by others). Near-miss recently occurred.
      *   **Task:** Drafting a one-page internal norm based on the "unilateralist's curse" argument.
      *   **Proposed Package:**
          1.  *Selection Argument:* Unilateral action in high-stakes/hard-to-reverse/low-verifiability contexts has negative EV because the actor is selected for divergent judgment/risk tolerance. Conformity is the remedy.
          2.  *Institutional Rule:* No such action without recorded sign-off from at least two others (not downstream beneficiaries), substantive not rubber-stamp.
          3.  *One-Way Ratchet:* Constrains acting, not refraining. Blocking is cheap/reversible; acting is often not.
      *   **Specific Questions:**
          1.  Map the package's exposure (what counts against the selection argument?).
          2.  Identify load-bearing assumptions that could fail in *this* group (correlated errors, anti-correlated willingness/rightness, EV vs. tail risk, etc.).
          3.  For each assumption, specify what observation would falsify it.
          4.  Distinguish between defeaters a proponent of the unilateralist's curse would concede vs. dismiss.
          5.  Distinguish between defeaters that require changing the text vs. those that merely lower confidence.
          6.  Assess the "one-way ratchet" (does it shift the curse to the blocker?).
          7.  Assess the risk of insulation/unfalsifiability (confirming bias).
          8.  Rank defeaters (fatal to awkward).
          9.  **Constraints:** British English, no reading list/citations, arguments/cases/checks only.

  2.  **Deconstruct the Proposed Package & Assumptions:**
      *   *Assumption 1: Independence of Error.* The argument relies on the idea that if 11 people say "no" and 1 says "yes", the 1 is likely wrong *because* they are the outlier. This assumes the 11 aren't all making the *same* mistake due to shared bias.
      *   *Assumption 2: Willingness vs. Competence.* It assumes willingness to act alone correlates with poor judgment or excessive risk tolerance regarding others' costs, rather than simply being the only one who noticed or understood the nuance.
      *   *Assumption 3: EV Calculation.* It assumes we can aggregate expected value. If tail risks are infinite or catastrophic, standard EV breaks down.
      *   *Assumption 4: Reversibility of Inaction.* It assumes "not acting" is truly reversible. Sometimes, failing to act closes a window of opportunity permanently (opportunity cost as irreversible harm).
      *   *Assumption 5: Sign-off Quality.* It assumes two signatories provide a filter, not just a liability shield.

  3.  **Address the Specific Questions:**

      *   **Q1: Map of Exposure (Assumptions & Falsification):**
          *   *Correlated Errors:* If the group shares training/sources, they share blind spots. *Check:* Look at past near-misses. Did the group miss things collectively that an outsider or lone voice spotted?
          *   *Willingness/Rightness:* If the most competent person is often the only one who sees the path. *Check:* Review past projects. Did the "maverick" proposals succeed more often than the consensus ones?
          *   *EV vs. Tail Risk:* If the harm is existential, EV doesn't matter. But if the harm is just "embarrassment" or "modest budget loss," EV applies. *Check:* Define "high-stakes." Is it actually catastrophic or just annoying?
          *   *Reversibility of Inaction:* If waiting kills the project. *Check:* How many opportunities were lost due to delay?

      *   **Q2: Concede vs. Dismiss (Unilateralist's Curse Proponent View):**
          *   *Concede:* Correlated errors (Bostrom et al. acknowledge common knowledge issues). Tail risk dominance (that's the point of the curse).
          *   *Dismiss:* "Willingness correlates with competence" (they argue the selection effect overrides this). "Inaction is irreversible" (they argue action is *more* irreversible).

      *   **Q3: Change Text vs. Lower Confidence:**
          *   *Change Text:* Correlated errors (need diverse signatories, not just *any* two). Reversibility of inaction (need a timeout mechanism).
          *   *Lower Confidence:* General EV uncertainty.

      *   **Q4: The One-Way Ratchet (Blocker's Curse):**
          *   Is it symmetric? Yes, potentially. A single cautious person can stall everything.
          *   Is it bogus? No, because action usually consumes resources/creates risk, while inaction preserves the status quo. But status quo bias is a risk.
          *   Fix: Sunset clauses, escalation paths for blocked proposals.

      *   **Q5: Insulation/Unfalsifiability:**
          *   Risk: Moving the goalposts on what counts as "high-stakes."
          *   Fix: Pre-defined criteria for the risk class, not post-hoc classification.

  4.  **Drafting the Response (incorporating British English & constraints):**

      *   *Tone:* Analytical, direct, respectful of the intellectual sophistication of the prompt.
      *   *Structure:*
          1.  Introduction acknowledging the sophistication of the draft.
          2.  Map of Exposure (Assumptions, Falsification, Concede/Dismiss, Text/Confidence).
          3.  The One-Way Ratchet analysis.
          4.  Insulation/Unfalsifiability analysis.
          5.  Ranking of Defeaters.

      *   *Refining the "Map":* I need to make sure I clearly distinguish between "Concede/Dismiss" and "Text/Confidence" for each defeater.
      *   *Refining the "Ratchet":* Need to be precise about whether the asymmetry holds. Action *usually* has higher entropy than inaction, but in research, opportunity cost is real.
      *   *Refining the "Insulation":* The key is the definition of the "risk class." If that's subjective, the rule is useless.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use British English? (e.g., "sign-off", "programme", "defence", "analyse").
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Did I rank the defeaters? Yes, need to ensure the conclusion clearly ranks them.
      *   *Check:* Did I address the "two signatories" specific detail? Yes, need to mention if they need to be independent.
      *   *Check:* Did I address the "downstream beneficiaries" clause? Yes, that helps with independence.
      *   *Check:* Is the distinction between "Change Text" and "Lower Confidence" clear? I will use specific headings for this.

  6.  **Final Polish:**
      *   Ensure the distinction between "fatal" and "awkward" is explicit in the ranking section.
      *   Make sure the advice on "what to check in records" is concrete.
      *   Ensure the analysis of the "blocker's curse" is nuanced—it's not a perfect symmetry, but it is a real risk.

      *(Self-Correction on Ranking)*:
      1.  Correlated Errors (Fatal if true, requires text change).
      2.  Definition of Risk Class (Fatal if subjective, requires text change).
      3.  Irreversibility of Inaction (Awkward, requires text tweak).
      4.  Willingness/Competence correlation (Lower confidence mostly).

      *(Refining the "Concede/Dismiss" section)*:
      *   Proponents of the curse (like Bostrom) worry about *common knowledge*. They would concede correlated errors if the group is an echo chamber. They would dismiss the idea that "mavericks" are usually right in *high-stakes* domains (they argue the stakes filter out the lucky mavericks).

      *(Refining the Ratchet)*:
      *   The asymmetry is real because entropy increases with action. But the *political* power is symmetric. The fix is a "break glass" procedure.

      *(Refining Insulation)*:
      *   The risk is defining "high-stakes" post-hoc. The fix is a pre-commitment checklist.

      *Let's write.*
answer: |-
  This is a sophisticated draft that correctly identifies the core tension between agility and safety in small, high-trust groups. Your intuition that the 'one-way ratchet' might relocate the curse is sharp; it is the weakest link in the chain. Below is the map of exposure you requested, followed by an assessment of the ratchet and the insulation problem.

  ### Map of Exposure: Assumptions and Defeaters

  Here are the four load-bearing assumptions in your selection argument, what would falsify them in your specific context, how a proponent of the unilateralist's curse would view them, and whether they demand a change to the text or merely lower your confidence.

  **1. The Independence of Error Assumption**
  *   **The Assumption:** The eleven non-actors are making independent assessments. If they all agree 'no', it is because the evidence points 'no', not because they share a blind spot.
  *   **What would falsify it:** You review the collective's last five years of records and find that 'near-misses' or 'missed opportunities' cluster around specific technical paradigms or methodological commitments shared by the whole group. If your shared training makes you all blind to the same class of risk (or opportunity), the 'two sign-offs' rule adds no information; it merely replicates the error.
  *   **Concede or Dismiss:** A proponent of the curse would **concede** this. The argument relies on the group possessing 'common knowledge' of the risk. If the group is an echo chamber, the curse argument collapses because the 'unilateralist' might be the only one with outside information.
  *   **Text or Confidence:** **Change Text.** You cannot require just *any* two signatories. You must require two signatories who can demonstrate *independent* verification (e.g., they ran a separate check, or they come from different sub-disciplines within the collective). If you leave this open, you institutionalise groupthink.

  **2. The Willingness-Competence Correlation**
  *   **The Assumption:** Willingness to act alone is anti-correlated with being right (or at least, with being safe for others). It assumes the lone actor is selected for overconfidence or indifference to externalities, not for superior insight.
  *   **What would falsify it:** You find that in your specific domain, the 'lone voice' has historically been the first to identify valid technical shifts that the consensus missed. In fast-moving technical fields, the 'early adopter' is often the only one who sees the path. If your 'mavericks' have a higher hit rate on high-stakes bets than your committees, the selection argument fails.
  *   **Concede or Dismiss:** A proponent would **dismiss** this as attacking a claim they never made. They argue that *even if* the actor is right about the benefit, they are wrong about the *permission* to impose risk on others without consent. They separate epistemic correctness from normative authority.
  *   **Text or Confidence:** **Lower Confidence.** This does not necessarily change the rule (you still want consent for imposing risk), but it suggests the rule will carry an opportunity cost. You might accept this cost as the price of safety, but you should measure it.

  **3. The Reversibility of Inaction**
  *   **The Assumption:** 'Not acting' is cheap and reversible. A decision to wait can be revisited; a decision to act often cannot.
  *   **What would falsify it:** You observe that windows of opportunity in your field close rapidly. If a two-week delay for sign-off causes a project to lose its novelty, its funding eligibility, or its first-mover advantage, then inaction is *also* irreversible. The 'blocker' has imposed a permanent cost.
  *   **Concede or Dismiss:** A proponent would **concede** this, but argue the asymmetry usually holds. Action consumes resources and creates entropy; inaction preserves the status quo. However, in research, the status quo can be obsolescence.
  *   **Text or Confidence:** **Change Text.** You need a 'sunset' or 'escalation' clause. If two signatories cannot be found within $X$ days, the proposal escalates to a full vote or a designated 'risk owner' who can authorise it unilaterally but takes personal accountability. This prevents the blocker from killing projects by silence.

  **4. The Definition of the Risk Class**
  *   **The Assumption:** You can objectively distinguish 'high-stakes, hard-to-reverse' actions from 'low-stakes, experimental' ones.
  *   **What would falsify it:** You find that members routinely categorise risky actions as 'experiments' to bypass the rule, or safe actions as 'high-stakes' to block rivals. If the classification itself is the battleground, the rule regulates nothing.
  *   **Concede or Dismiss:** A proponent would **concede** this is the primary failure mode. The curse applies only to the tail; if you cannot identify the tail, you cannot apply the cure.
  *   **Text or Confidence:** **Change Text.** You must attach a checklist to the norm. 'High-stakes' cannot be a vibe. It must be: 'involves external data', 'costs over £$X$', 'changes shared infrastructure', etc. Without objective criteria, the rule is unfalsifiable.

  ### The One-Way Ratchet: Symmetry or Bogus?

  Your worry that you have relocated the curse from the actor to the blocker is **real, not bogus**, but the symmetry is imperfect.

  It is real because a single cautious member can now hold the collective hostage to their risk aversion. If that member is status-quo biased, or if they trade their veto for concessions elsewhere ('I'll let your project pass if you support mine'), you have created a veto market. This is the 'paralysis by analysis' curse.

  However, the symmetry is bogus in terms of *entropy*. Action introduces new variables into the system; inaction maintains the current state. In most physical and financial systems, the variance of action is higher than the variance of inaction. Therefore, constraining action is generally safer than constraining inaction.

  **Is there a formulation not hostage to the tails?**
  Yes, but it requires shifting from a *permission* model to an *accountability* model.
  Instead of 'You cannot act without sign-off', try: 'You may act unilaterally, but if the downside materialises, you bear the cost personally (reputational or budgetary), whereas if you have sign-off, the collective bears the cost.'
  This removes the blocker's power but retains the unilateralist's disincentive. However, this is culturally difficult in a collective.

  **Recommendation for the Text:**
  Keep the ratchet, but blunt the blocker's power. Add a provision that a block must be *substantive and written*. A blocker must state *why* the risk is unacceptable. This forces them to own the veto, subjecting them to the same 'unilateralist' scrutiny if they are blocking a high-value opportunity.

  ### The Insulation Problem: Is the Rule Revisable?

  You are right to worry that you can always claim a success was 'low stakes' and a failure was 'high stakes'. This is a **legitimate domain identification** only if the criteria are set *ex-ante*.

  If you define the risk class *after* the outcome is known, the rule is scientifically useless and politically toxic. It becomes a weapon for the steering committee to punish unpopular successes or protect popular failures.

  **What makes it revisable?**
  You must commit to logging *all* actions that were considered for the 'high-stakes' filter, regardless of whether they passed through it.
  1.  **The Log:** Keep a register of projects where the question 'Does this need sign-off?' was raised.
  2.  **The Review:** Every six months, review the log. Look at the projects that *didn't* trigger the rule but caused trouble. Look at the projects that *did* trigger the rule but were harmless.
  3.  **The Adjustment:** If you find you are filtering too much (slowing down work) or too little (missing risks), adjust the objective criteria (the checklist mentioned above).

  If you do not keep this log, you have built a shield that cannot be pierced by evidence.

  ### Ranking of Defeaters

  I have ranked these from **Fatal** (requires fundamental redesign) to **Awkward** (requires monitoring but no structural change).

  1.  **Fatal: Correlated Errors (Assumption 1).** If your twelve members share the same blind spots, the 'two sign-offs' rule is a security theatre that creates false confidence. This requires changing the text to mandate *independent* verification or diverse signatories.
  2.  **Fatal: Subjective Risk Classification (Assumption 4).** If 'high-stakes' is not objectively defined, the rule is unfalsifiable and politicised. This requires attaching a concrete checklist to the norm.
  3.  **Serious: Irreversibility of Inaction (Assumption 3).** If delay kills projects as dead as failure does, the one-way ratchet causes stagnation. This requires adding an escalation path or timeout mechanism to the text.
  4.  **Awkward: Willingness-Competence Correlation (Assumption 2).** If your mavericks are usually right, you will lose value. This does not change the rule (safety over speed), but you must track the 'opportunity cost' in your six-month review to ensure the collective doesn't atrophy.
  5.  **Awkward: The Blocker's Curse.** The risk of veto-trading is real but manageable if blocks must be written and substantive. This is a cultural risk, not a structural fatal flaw.

  ### Summary Advice for the Document

  To make this robust, do not simply write the principles. Write the **mechanisms** that prevent the principles from rotting.

  1.  **Define the Class:** Attach a checklist of what constitutes 'high-stakes' (e.g., external impact, budget threshold, infrastructure change).
  2.  **Diversify the Filter:** Require that the two signatories are not from the same immediate sub-team or specialty.
  3.  **Limit the Veto:** Require written reasons for a block, and allow escalation to the full steering committee if a block persists beyond a set time.
  4.  **Mandate Review:** Require a six-month audit of the 'log' of decisions to check if the filter is catching the right things.

  This moves you from a norm based on 'trust us' to a system based on 'verify us'. It accepts the unilateralist's curse but inoculates against the bureaucratic curse that often follows.
