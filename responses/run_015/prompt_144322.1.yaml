  # Decision-Tree Taxonomy of Weakness of Will and Intertemporal Choice

  ## Part I: Branching Conditions and Diagnostic Questions

  **Instruction:** To classify a theoretical position, answer the following questions in order. Stop at a terminal leaf when a position is uniquely identified.

  **Question 1 (Existence):**
  Can an agent genuinely and freely act against their own better judgment about what they should do?
  *   **No:** Proceed to Leaf 1.
  *   **Yes:** Proceed to Question 2.

  **Question 2 (The Narrow-Window Diagnostic):**
  Consider an agent who chooses a smaller-sooner reward *only* when both options are available within the next hour, but consistently chooses the larger-later reward at all wider separations and never violates their globally endorsed long-term plan. Does this specific pattern count as weakness of will?
  *   **Yes (Temporal/Reductionist):** The phenomenon is essentially about time proximity and choice reversal. Proceed to Question 3.
  *   **No (Judgment/Rational):** The phenomenon is essentially about practical reasoning failure or rational shifting, not merely time proximity. Proceed to Question 3.

  **Question 3 (Agent Structure):**
  To explain the choice identified in Question 2 (or the general capacity for weakness if Q2 was No), must we posit a split within the agent (e.g., two competing selves or systems)?
  *   **Yes (Split Agent):** Proceed to Leaf 2 (if Q2=Yes) or Leaf 5 (if Q2=No).
  *   **No (Unified Agent):** Proceed to Question 4.

  **Question 4 (Differentiation for Unified Agents):**
  *Note: This question applies only to Unified Agents (Q3=No) to distinguish remaining positions.*
  *   **If Q2=Yes (Temporal):** Is the time-based reversal a rational response to shifting perspectives, or a bias?
      *   **Rational:** Proceed to Leaf 3.
      *   **Bias:** Proceed to Leaf 4.
  *   **If Q2=No (Judgment):** Is the failure caused by emotion overriding reason, or by holding contradictory judgments?
      *   **Emotion/Passion:** Proceed to Leaf 6.
      *   **Judgment Contradiction:** Proceed to Leaf 7.

  ---

  ## Part II: Mapping of Answer Patterns to Positions

  The following seven terminal leaves correspond to the required theoretical views. Each leaf is defined by the unique path of answers leading to it.

  **Leaf 1: The Socratic Denial**
  *   **Path:** Q1 (No).
  *   **View:** (1) The Socratic denial that genuine akrasia is possible.
  *   **Diagnosis:** Since the agent cannot act against their better judgment, apparent cases are reclassified as ignorance or error.

  **Leaf 2: The Planner-Doer Model**
  *   **Path:** Q1 (Yes) → Q2 (Yes) → Q3 (Yes).
  *   **View:** (5) A planner-doer dual-self model that explains reversal by conflict between long-run and short-run evaluative systems.
  *   **Diagnosis:** Weakness of will exists, is triggered by temporal proximity, and requires a split-agent explanation (conflict between systems).

  **Leaf 3: The Structural-Rationality View**
  *   **Path:** Q1 (Yes) → Q2 (Yes) → Q3 (No) → Q4 (Rational).
  *   **View:** (6) A structural-rationality view that treats time-inconsistent reversal as rational given legitimately shifting evaluative perspectives.
  *   **Diagnosis:** Weakness of will (or the appearance of it) exists and is temporal, but the agent is unified and the reversal is normatively acceptable.

  **Leaf 4: The Hyperbolic-Discounting Reductionist**
  *   **Path:** Q1 (Yes) → Q2 (Yes) → Q3 (No) → Q4 (Bias).
  *   **View:** (4) A hyperbolic-discounting reductionist view that weakness of will is nothing over and above present-biased intertemporal choice.
  *   **Diagnosis:** Weakness of will exists, is temporal, the agent is unified, but the reversal is a bias rather than a rational shift.

  **Leaf 5: [UNOCCUPIED] The Split-Judgment Hybrid**
  *   **Path:** Q1 (Yes) → Q2 (No) → Q3 (Yes).
  *   **View:** (7) An unexplored or hybrid position.
  *   **Status:** **Explicitly Flagged as Unoccupied.**
  *   **Diagnosis:** This cell represents a view where weakness of will is a failure of practical reasoning (not essentially temporal) yet requires a split-agent model. While dual-process theories exist, none of the primary named positions combine a non-temporal judgment failure with a strict dual-self ontology. This logical space remains open for hybrid theories positing conflicting rational systems unrelated to time.

  **Leaf 6: The Aristotelian Account**
  *   **Path:** Q1 (Yes) → Q2 (No) → Q3 (No) → Q4 (Emotion/Passion).
  *   **View:** (2) An Aristotelian account on which akrasia is a failure in the practical syllogism despite retention of the correct universal premise.
  *   **Diagnosis:** Weakness of will exists, is not essentially temporal (can happen anytime), the agent is unified, and the failure is due to passion overriding the application of reason.

  **Leaf 7: The Davidsonian View**
  *   **Path:** Q1 (Yes) → Q2 (No) → Q3 (No) → Q4 (Judgment Contradiction).
  *   **View:** (3) Davidson’s view of incontinent action as acting against one’s own all-things-considered best judgment.
  *   **Diagnosis:** Weakness of will exists, is not essentially temporal, the agent is unified, and the failure is defined by the logical contradiction between judgment and action rather than passion overriding reason.
