  2.  **Deconstruct "It's in the Genes" (The Axes):**
      *   *Axis 1: Level of Analysis.* Is it about the population (heritability) or the individual (determinism)?
      *   *Axis 2: Mean vs. Variance.* Is it explaining why the average is what it is, or why people differ?
      *   *Axis 3: Causation vs. Correlation.* Do genes cause the trait directly, or are they markers? (Less critical for this specific argument, but worth noting).
      *   *Axis 4: Static vs. Malleable.* Is the trait fixed (immutable) or can environment change the expression?

  3.  **Drafting the Claims (Iterative Process):**

      *   *Claim 1: Genetic Influence Exists.* "Genes play a role in reading ability."
          *   Status: Substantive/Defensible. Twin studies show reading ability is heritable.
          *   Relevance to Brother's Conclusion: Weak. Just because genes play a role doesn't mean environment can't help (e.g., PKU is genetic but diet fixes it).

      *   *Claim 2: High Heritability.* "Most of the *difference* between kids in reading is due to genes."
          *   Status: Substantive/Defensible (in some contexts), but often misinterpreted. Heritability of reading is moderate to high (0.4-0.8 depending on age/study).
          *   Relevance: Still doesn't imply immutability.

      *   *Claim 3: Individual Determinism.* "This specific child's reading level is fixed by his DNA."
          *   Status: False. Heritability is a population statistic, not an individual destiny.
          *   Relevance: This is what he *wants* to believe, but it's scientifically wrong.

      *   *Claim 4: Immutability.* "Environmental interventions cannot change genetic predispositions."
          *   Status: False. Gene-environment interaction is real. Interventions work even for high-heritability traits (e.g., glasses for myopia).
