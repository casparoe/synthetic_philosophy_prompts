      *   *Fixing the Bird Case:* If species are lineages (2), 2M years separation suggests two lineages, even if physiological compatibility remains. This aligns with the friend (Systematist). The User's ecology background makes them focus on niche/function (1 species), friend focuses on history/lineage (2 species).

