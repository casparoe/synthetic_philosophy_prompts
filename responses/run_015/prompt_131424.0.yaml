  **The candidates**

  Two primary rules survive your mediator's record. The first is the **Nash Bargaining Solution**, which maximizes the product of the parties' gains over their fallback. The second is the **Kalai–Smorodinsky Solution**, which awards shares proportional to each party's maximum possible gain (the "ideal point"). On linear frontiers (Cases 1–3), these rules are mathematically identical. On the symmetric kinked frontier (Case 4), they coincidentally converge at the kink $(8,8)$ because the ideal ray $y=x$ intersects the frontier exactly where the product $xy$ is maximized.

  Your record eliminates the **Utilitarian rule** (maximize sum), which would have awarded $(40,0)$ in Case 1, and the **Egalitarian rule** (equal gains), which would have awarded $(8,8)$ in Case 1. A third, less theoretical candidate fits the data: the **Arc-Midpoint Rule**, which simply splits the frontier's Euclidean length in half. This matches all four awards because the previous frontiers were either straight lines or symmetric kinks. However, Nash and Kalai–Smorodinsky are the dominant standards in dispute resolution theory, grounded in axioms of efficiency and monotonicity respectively.

  **What each predicts here**

  The new case has a fallback of $(0,0)$ and a kinked frontier: $(100, 0) \to (60, 9) \to (0, 10)$. Here, the rules diverge sharply.

  The **Kalai–Smorodinsky** solution draws a ray from $(0,0)$ to the ideal point $(100, 10)$. This line is $y = 0.1x$. Intersecting this with the first segment (equation $y = -0.225x + 22.5$) yields $0.325x = 22.5$, or **$x \approx 69.2, y \approx 6.9$**. This rule rewards A's massive potential capacity.

  The **Nash** solution maximizes the product $xy$. On the first segment, the unconstrained peak is at $x=50$, which is outside the segment's domain $[60, 100]$. On the second segment, the peak is at $x=300$, outside the domain $[0, 60]$. Thus, the maximum occurs at the boundary shared by both: the kink. The Nash award is **$(60, 9)$**.

  The **Arc-Midpoint** rule calculates the total length ($\approx 101$) and finds the halfway point ($\approx 50.5$). Since the first segment is only 41 units long, the midpoint falls on the second segment, yielding approximately **$(50.5, 9.2)$**. The predictions range from A getting 50.5 to 69.2—a discrepancy of nearly 40% of the fund.

  **Your best guess**

  I expect the award to be **$(60, 9)$**, following the **Nash** rule. While Kalai–Smorodinsky is intuitively appealing for its proportionality, Nash is the standard workhorse in legal and economic mediation because it maximizes the joint value created by the agreement (efficiency). In Case 4, the mediator accepted a kink solution when it was symmetric; in this new case, the Nash solution again lands on the kink. This suggests a comfort with boundary solutions where the marginal trade-off shifts abruptly.

  However, I am only moderately confident. The record genuinely underdetermines the rule because her past cases lacked the asymmetry required to separate Nash from Kalai–Smorodinsky. Adopting Nash commits her to ignoring improvements in A's potential if the frontier's curvature doesn't change, whereas Kalai–Smorodinsky commits her to adjusting awards whenever ideal points shift, even if the feasible trade-offs remain static.

  **The case I'd want next**

  Your hunch about monotonicity is sharp, but simply improving A's best case won't make A's award go *down* under Nash in this geometry; it will just rise slower than under Kalai–Smorodinsky. To separate them vividly, propose a case where A's max increases to **200**, keeping the kink at $(60, 9)$ and B's cap at 10. Frontier: $(200, 0) \to (60, 9) \to (0, 10)$.

  Under **Kalai–Smorodinsky**, the ideal ray flattens to $y = 0.05x$. Intersecting the new first segment yields an award of **$(112.5, 5.6)$**. A gains significantly from the expanded potential.

  Under **Nash**, the product peak on the first segment moves to $x=100$. Since 100 is now within the segment's domain $[60, 200]$, the solution moves off the kink to **$(100, 6.4)$**.

  Both rules increase A's share, but Kalai–Smorodinsky gives A 12.5% more than Nash. Observing whether M. awards A roughly 100 or 112 distinguishes whether she prioritizes the local trade-off rates (Nash) or the global potential claims (Kalai–Smorodinsky).

  **What her record can't tell me**

  No number of past awards can confirm whether these figures represent dollars or utilities. If Party A is risk-averse and B is risk-neutral, the "dollars" on the frontier must be converted to utility before applying these rules. A Nash solution in utility space could look like a Kalai–Smorodinsky solution in dollar space, rendering the distinction meaningless without knowing their risk profiles.

  Normatively, the choice stakes are high. Nash prioritizes efficiency—making the pie as large as possible relative to the threat point—often at the expense of proportional fairness. Kalai–Smorodinsky prioritizes relative opportunity, ensuring neither party is capped by the other's constraints. Her record shows consistency, but not whether that consistency serves efficiency or equity. Without knowing how she weights the parties' outside options against their potential, you cannot know if she is a pragmatist or an egalitarian.
