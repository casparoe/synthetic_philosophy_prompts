answer: |-
  "Okay, but listen, it's not about being good. That's the trap," Julian said, swirling the Cabernet so hard a drop splashed onto the tablecloth. He didn't wipe it. "It's about the… the ticket. The standing."

  "Standing," Sarah repeated, reaching across him to top off her own glass. "You've used that word four times since the appetizer."

  "No, no, hear me out. So, imagine this guy. Let's call him… let's call him Steve. Steve sees his friend cheating on his taxes. And Steve gets mad. Right? He points a finger. He says, 'You are morally bankrupt.'"

  "Standard Steve," someone muttered from the end of the table.

  "Exactly. But then someone points out that Steve also cheats on his taxes. So, the thing is… it's not that Steve is wrong about the friend. The friend *is* cheating. It's that Steve… he loses the *right* to say it. The hypocrisy voids the ticket. He's got no standing. He's just noise."

  Julian took a long gulp. "But here's where it gets… sticky. So Steve realizes this. He wants to fix it. He wants to regain his standing. So he turns the finger around. He says, 'Okay, fine. I am a hypocrite. I blame myself for being a hypocrite.'"

  "Good for Steve," Sarah said, passing the bread basket.

  "Wait, wait. Because to blame yourself… you still need standing. You're making a moral judgment. You're saying 'I deserve blame.' But if the thing that kills your standing is hypocrisy… and you're blaming yourself for being a hypocrite… you're doing the thing you're blaming yourself for."

  Julian stopped. He looked at his glass. "He's blaming himself for blaming. So he loses standing to blame himself, too."

  "So he shuts up?"

  "No, because now he wants to apologize for the whole mess. He wants to say, 'I'm sorry, I have no standing.' But see? That's a claim. That's a judgment about his own moral status. He's asserting a truth about his inability to assert truths. He's claiming authority on his own lack of authority."

  The table went quiet, except for the clink of a fork against a plate.

  "So…" Julian started, then frowned. He looked around the table, his eyes slightly unfocused. "So he opens his mouth to say, 'I cannot speak.' But saying 'I cannot speak' is speaking. It's a move. It's a blame-game move. He doesn't have the chips."

  "Can't he just… stop?" you asked.

  "If he decides to stop blaming, he's judging his previous blaming as something that needs stopping. That's a judgment. He needs standing for that. He's… he's like a judge who got fired trying to fire himself. The gavel doesn't work."

  Julian lifted his hand to make a point, then let it drop back to the table. He looked genuinely frustrated, like he was trying to lift something too heavy.

  "So what happened to Steve?" Sarah asked.

  Julian opened his mouth. He looked like he was about to say, *'He couldn't say anything.'* But he stopped. He squinted, doing the math behind his eyes.

  "If he says 'He couldn't say anything,' that's me blaming Steve for being silent. Or blaming silence. I'm… fuck."

  He picked up his wine glass, stared into the dark red liquid, and set it back down without drinking.

  "I think… I think I might not have the standing to finish this joke."

  "Jesus, Julian," someone laughed.

  "No, wait, I'm not—see, if I say 'I don't have the standing,' I'm claiming I know what standing is. I'm blaming myself for knowing. I'm… I'm doing it again."

  He leaned back, hands up, palms open. A surrender. But then his brow furrowed again, panicked.

  "Actually, is this surrender? Or is this… oh god. I don't know if I'm allowed to stop talking."
