answer: |-
  On the morning of October 23, 1844, the Millerite movement faced a sudden collapse in propositional currency. The specific claim—Christ's visible return—was falsified by empirical reality. For the actors involved, the option set diverged sharply based on their prior investments. William Miller and the itinerant preachers held reputational capital staked on the date. Their options were to admit error (losing status), re-date (risking further credibility loss), or re-denominate the claim into unfalsifiable theology. Ordinary followers, many of whom had faced social ostracization or neglected harvests, faced sunk costs in commitment currency. Their options were to walk away (accepting loss), double down (increasing commitment to justify sunk costs), or accept re-denomination to maintain group identity. Critics and established churches held the evidence of non-arrival; their payoff was vindication and the re-absorption of defectors.

  From a costly-signaling lens, the pre-Disappointment movement was a high-fidelity signal. Predicting a specific date is cheap; sacrificing property and social standing for that date is expensive and hard to fake. This explains the movement's rapid growth and cohesion prior to October 22. However, the post-Disappointment survival of the faction that re-denominated the claim (the Seventh-day Adventist precursors) presents a theoretical puzzle. Standard signaling theory suggests that making a claim unfalsifiable renders it "cheap talk," destroying its value as a credibility-enhancing display. If the claim cannot be checked, why should commitment remain high?

  The resolution lies in your teacher's currency distinction. Re-denomination crashes the propositional currency but does not necessarily destroy the commitment currency, provided the new theology demands new costs. The surviving faction did not merely assert an invisible event; they eventually adopted distinct behavioral markers (such as Sabbath keeping) that renewed the costly signal. Thus, re-denomination rescues the signal only if it serves as a bridge to new costly behaviors, not if it functions as a mere rationalization. The groups that simply re-dated or dissolved failed to maintain the commitment currency. This suggests your friend is partially right—religion runs on commitment—but you are also right that the specific propositional failure mattered. The falsification forced a sorting mechanism: only those willing to pay new costs for the re-denominated belief remained.

  The cognitive-dissonance account explains the psychological mechanism of the shift—the pain of failure drove the rationalization. However, it is silent on why some rationalizations led to survival while others led to dissolution. Signaling theory fills this gap by highlighting that survival correlated with the ability to maintain costly displays, not just the ability to reduce psychological pain. Yet, signaling theory is silent on the specific content of the new theology; it explains the structure of commitment but not why the "heavenly sanctuary" narrative specifically resonated over other options.

  This case largely confirms the naturalistic approach, specifically the hybrid model of currencies. It is not an anomaly but a stress test showing that propositional falsification is survivable if commitment currency can be replenished. However, the theory struggles if the surviving group actually reduced behavioral costs while maintaining belief. My confidence rests on the assumption that the surviving faction imposed new costs; if they became cheaper to belong to than the original movement, signaling theory would fail to explain their cohesion.

