answer: |-
  You have excellent instincts. Your skepticism about the logic is warranted, because Gongsun Long's "White Horse Dialogue" is essentially a sophisticated linguistic trick. It relies on conflating *class membership* (is this animal a horse?) with *concept identity* (is the concept 'white horse' identical to the concept 'horse'?).

  However, for a novel scene, "truth" matters less than "utility." Nell doesn't need to be a metaphysician; she needs to be a stable owner who knows that specifications matter. You can make her sound insufferable but logically consistent *within the context of a contract*, which is a document about language, not biology.

  Here is the breakdown of your four questions, reconstructed strictly from the text provided and logical analysis, followed by how to stage the scene.

  ### 1. Does the "may be delivered" bit prove anything about horses, or only about requests?

  **Your intuition is correct:** It proves something about *requests* (or concepts), not ontology.

  The argument relies on the **Principle of Substitutability**. If Term A and Term B are identical, they must function identically in all contexts.
  *   Context: "I seek X."
  *   Test: Does a yellow horse satisfy the seek?
  *   Result: Yes for "Horse," No for "White Horse."
  *   Conclusion: "Horse" and "White Horse" function differently. Therefore, they are not identical terms.

  **For Nell:** This is actually her strongest ground. A contract is a set of requests. If the terms function differently (i.e., they accept different deliveries), they are legally distinct specifications. She isn't arguing that the grey horse isn't a biological horse; she's arguing that the *designation* "White Horse" is not the *designation* "Horse."

  **Verdict:** It's not a cheat if she frames it as a contractual argument. It becomes a cheat only if she claims the grey horse isn't an animal of the species *Equus ferus caballus*.

  ### 2. How does "sameness of what's sought" get you to "sameness of the two words"?

  **The Suppressed Premise:** The argument assumes that if two phrases refer to the exact same requirement, adding a modifier (like "white") would be redundant and change nothing about the acceptance criteria.

  *   *Step 1:* If "White Horse" = "Horse" (as concepts/requirements)...
  *   *Step 2:* ...then adding "White" adds no constraint.
  *   *Step 3:* But adding "White" *does* add a constraint (it excludes yellow/black).
  *   *Step 4:* Therefore, "White Horse" imposes a different constraint than "Horse."
  *   *Step 5:* Therefore, the designations are not the same.

  **The Gap:** The leap is from "The sets of acceptable animals are different" to "The terms are not the same." In modern logic, we'd say the *extensions* are different subsets, but the *intension* of "horse" is contained within "white horse." Gongsun Long treats the compound name as a wholly new object.

  **For Nell:** She can use this to argue that the Foreman changed the deal. "You think 'White' is just decoration. The logic shows 'White' is a constraint. You removed the constraint, so you broke the deal."

  ### 3. Is the Objector's "having a white horse counts as having a horse" ever answered?

  **In the provided text:** No, not directly. The Advocate sidesteps the physical reality ("having") and stays in the linguistic reality ("seeking/designating").

  **The Implicit Reply:** The Advocate would argue: "Yes, you *have* a horse. But you do not have *what was designated*." The Objector is arguing from **existence** (there is an animal here). The Advocate is arguing from **specification** (this animal does not match the name).

  **For Nell:** This is where your character can shine. The Foreman will say, "It's a horse, isn't it?" Nell should reply, "It's *a* horse. It isn't *the* horse I designated." She concedes the biology to win the contract argument. If she denies it's a horse, she looks crazy. If she denies it's the *contracted object*, she looks shrewd.

  ### 4. The Twist: Contract said "Horse" vs. "White Horse" vs. Wooden Horse

  **Do not change the contract.** If the contract says "Horse" and she wanted "White," Gongsun Long destroys her argument. The text explicitly says: "If one seeks a horse, yellow and black horses may all be delivered." If she ordered "Horse," the Foreman is right.

  **Keep the contract as "White Horse."** The Foreman's defense is that "White" is surplusage (legally irrelevant). Nell's job is to prove "White" is operative.

  **The Wooden Horse Problem:** You are right that the "Shape" argument ("Horse designates shape") proves too much. A wooden horse has the shape. If Nell uses the "Shape" argument, the Foreman could argue a grey horse has the "Horse shape" and "White" is just paint.
  *   *Better approach:* Stick to the **Color/Constraint** argument. It's cleaner. The "Wooden Horse" distinction is about *substance*, which complicates things. The "Grey vs. White" distinction is about *classification*, which fits the "White Horse Dialogue" perfectly.

  ### How to Write the Scene (The "Nell Strategy")

  Nell should not quote the text as absolute truth. She should quote it as a **precedent for precision**. She is using philosophy to bully the foreman into admitting that language has rules.

  **The Logic Chain for Nell:**
  1.  **Concede the Biology:** "Yes, it's a horse. I have eyes."
  2.  **Attack the Designation:** "But the contract wasn't for 'a horse.' It was for 'a white horse.'"
  3.  **Use Gongsun Long on "Seeking":** "Gongsun Long said if you seek a horse, a yellow one works. If you seek a white horse, a yellow one fails. Why? Because the request is different."
  4.  **Apply to Foreman:** "You delivered what fits 'Horse.' You didn't deliver what fits 'White Horse.' Those are different requests. You fulfilled the wrong one."
  5.  **The Kicker:** "You're arguing biology. I'm arguing language. This is a contract, not a taxonomy."

  **Sample Dialogue Beat:**

  > Foreman: "It's a horse, Nell. Contract says 'horse.' Grey, white, black—it's all horse."
  >
  > Nell: "Contract says 'one white horse.' You sent a grey."
  >
  > Foreman: "Semantics. It's the same animal."
  >
  > Nell: "Is it? There's an old text, Gongsun Long. Says 'A white horse is not a horse.'"
  >
  > Foreman: (Laughs) "That's stupid."
  >
  > Nell: "It's not about the animal. It's about the seeking. If I ask for a horse, you bring me a black one, I pay you. If I ask for a white horse, you bring me a black one, I don't. The animal is the same. The *obligation* isn't. You're standing there telling me the obligation didn't change just because the color did. But the text says the acceptance criteria changed. So the designation changed."
  >
  > Foreman: "It's still a horse."
  >
  > Nell: "And a wooden horse has the shape of a horse. But I can't ride it to a wedding. 'Horse' designates the shape. 'White' designates the color. You gave me the shape. You didn't give me the color. You gave me a horse. You didn't give me a white horse. And in this business, the difference is the bill."

  ### Why This Works for Your Constraints
  1.  **No Bluffing:** She isn't claiming the grey horse isn't a mammal. She's claiming the *term* "White Horse" is not interchangeable with "Horse." This is logically defensible (Intension vs. Extension).
  2.  **Uses the Text:** She uses the "Seeking/Delivered" argument (Question 1) and the "Shape/Color" distinction (Question 2) without getting bogged down in the metaphysics.
  3.  **Answers the Objector:** She sidesteps the "But it is a horse" objection by agreeing but rendering it irrelevant to the contract (Question 3).
  4.  **No Twist Needed:** The original setup (Contract = White Horse) is the only one where this philosophy helps her.

  **Final Note on the "Grey" Horse:** In the real world, "Grey" horses often turn white with age. A layperson calls them white. A pro calls them grey. Nell's philosophical argument masks the fact that she might just being pedantic about horse colors. That makes her more complex: she's using high-minded logic to win a dispute that might just be about industry jargon. That fits your description of her "bad habit."
