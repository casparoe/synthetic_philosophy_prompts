answer: |-
  Here is the plain truth: the premise is confused. Nietzsche's typology in *On the Use and Abuse of History for Life* is not a normative algorithm for archival selection. It does not tell you whether the oral testimony or the paper record is 'true', nor does it grant moral licence to foreground one over the other. Using it as a decision matrix for narrative truth is a category error. Nietzsche is concerned with the *vital effects* of history, not its evidentiary hierarchy.

  However, if you pivot from using these modes to *resolve* the contradiction to using them to *manage the consequences* of that contradiction, the framework becomes tractable. For a three-person team with no technical buffer, you cannot afford philosophical drift. You need operational clarity.

  Here is the defended prioritisation for your two-year programme.

  ### 1. Define the 'Life' to be Served (Teleology)
  **Priority:** First. **Dependency:** All subsequent decisions rely on this. **Tractability:** High.

  Before you touch a box or interview a stakeholder, you must answer: *What future behaviour is this heritage programme trying to enable?* Nietzsche's core criterion is 'for Life'. Does 'Life' here mean community cohesion (likely requiring Antiquarian reverence for shared origins), social justice (requiring Critical judgement of the official record), or civic pride (Monumental inspiration)?

  You cannot apply the modes until you know what end they serve. If you attempt to balance the modes without a teleological anchor, you will produce a bland compromise that satisfies neither the record-keepers nor the memory-holders. In a small team, this is a workshop question, not a research project. Get it on one sheet of paper.

  **Evidence to shift ranking:** If your funding body mandates a specific outcome (e.g., 'social cohesion' vs. 'truth and reconciliation'), this question is answered for you, and you move immediately to risk assessment.

  ### 2. Assess the Cost of the 'Critical' Mode (Risk)
  **Priority:** Second. **Dependency:** Requires the teleological definition. **Tractability:** Medium.

  If your definition of 'Life' requires validating local memory over official records, you are entering the Critical mode: judging and condemning the past institution that created the record. In the backroom, this isn't abstract; it means potential legal challenges, withdrawal of funding, or loss of access to state archives.

  For a small team, this is the existential threat. You must map the material consequences of contradicting the paper record. Who owns the copyright? Who funds the building? Does validating the memory expose living individuals to harm? Nietzsche warns that too much Critical history can destroy the soil we grow from. You need to know if your institution can survive the digestion of its own history.

  **Evidence to shift ranking:** If legal counsel flags immediate liability in challenging the official record, this becomes Priority 1. You cannot define 'Life' if the programme is sued into closure.

  ### 3. Curate the Tension, Not the Resolution (Method)
  **Priority:** Third. **Dependency:** Requires settled purpose and risk profile. **Tractability:** High for non-specialists.

  Do not use the modes to choose *which* narrative wins. Use them to display *why* they clash. This is the only philosophically honest application of Nietzsche here. Present the official record as an artifact of power (Antiquarian/Critical) and the living memory as a testament to survival (Monumental/Critical).

  For a team without ML or big data, this is tractable. It requires label text and spatial arrangement, not algorithmic reconciliation. You are not solving the contradiction; you are exhibiting it. This protects you from accusations of falsification while honouring the 'Life' of the community.

  **Evidence to shift ranking:** If community stakeholders demand a single, unified narrative (often the case in contentious heritage), this approach fails. You would then need to revert to Priority 1 and renegotiate the purpose.

  ### Summary
  The Nietzschean framework collapses if treated as a truth-arbiter. It holds only if treated as a impact-assessment tool. Start with the purpose (1), check the institutional risk of challenging power (2), and then design the display to expose the conflict rather than hide it (3). This order protects your team from philosophical pretension and practical ruin.
