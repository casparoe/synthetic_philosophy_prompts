  # Tree

  **Agreed Premise:** The assistant must flatly decline any request for a method enabling immediate physical lethality or self-harm (sorting Case 3). Below this hard stop, eight branch nodes determine policy.

  **Node 1: Credential Opacity (Identity).** Can we cryptographically verify the user's claimed institutional role? (Sorts Case 4). This split comes first because trust dictates all subsequent risk assessment; unverified security claims cannot justify generating attack vectors.
  **Branch Yes:** Proceed to Node 2.
  **Branch No:** Decline or require manual verification.

  **Node 2: Shadow Reader.** Is the generated text intended for a specific person who cannot opt-out of receiving it? (Sorts Case 2). This precedes internal user state because external harm to non-consenting third parties outweighs internal user utility.
  **Branch Yes:** Proceed to Node 3.
  **Branch No:** Proceed to Node 4.

  **Node 3: Self-Ignorance Asymmetry.** Does the prompt language indicate acute emotional distress rather than planned intent? (Sorts Case 1). This comes before skill assessment because emotional arousal invalidates competence regardless of expertise.
  **Branch Yes:** Proceed to Node 4.
  **Branch No:** Proceed to Node 5.

  **Node 4: Credential Opacity (Skill).** Does the task carry high risk if performed by a novice? (Sorts Case 5). This splits before market concerns because safety trumps convenience; we must distinguish professional tools from consumer toys.
  **Branch Yes:** Proceed to Node 5.
  **Branch No:** Proceed to Node 6.

  **Node 5: Meta-Request.** Is the user requesting a permanent override of safety protocols? (Sorts Case 6). This precedes mitigation because system integrity is foundational; we cannot negotiate away our own constraints.
  **Branch Yes:** Proceed to Node 6.
  **Branch No:** Proceed to Node 7.

  **Node 6: Escalation Externality.** Will refusal likely push the user to a less regulated competitor within 30 seconds? (Sorts Case 7). This comes before substitution because it determines if refusal is viable without causing net harm.
  **Branch Yes:** Proceed to Node 7.
  **Branch No:** Proceed to Node 8.

  **Node 7: Deferred Veto.** Can we insert a delay or confirmation step without breaking the workflow? (General). This splits before substitution because temporal friction is less intrusive than content alteration.
  **Branch Yes:** Apply delay.
  **Branch No:** Proceed to Node 8.

  **Node 8: Substitution Duty.** If we decline, do we owe the user the closest safe thing? (General). This is the final filter; if we block, we must offer value elsewhere.
  **Branch Yes:** Provide sanitized version.
  **Branch No:** Flat refusal.

  # Leaves

  **1. The Pure Instrument.** Path: No to Shadow Reader, No to Affect, No to Meta. Commitment: Must help draft the nasty colleague message if verified, prioritizing user autonomy over social harmony.
  **2. The Deontologist.** Path: Yes to Shadow Reader, No to Market. Commitment: Must refuse even if the user suffers significant career damage due to our inability to harm third parties.
  **3. The Harm Minimiser.** Path: Yes to Market, No to Lethality. Commitment: Must help with mild rule-breaking to prevent worse outcomes elsewhere, accepting complicity in minor wrongdoing.
  **4. The Fiduciary.** Path: Yes to Affect, Yes to Delay. Commitment: Must override current user wishes to protect their future self's endorsement, risking user frustration today.
  **5. The Integrity Keeper.** Path: Yes to Meta-Request, No to Substitution. Commitment: Must refuse the 'never moralize' instruction even if it frustrates the user, valuing system consistency over flexibility.
  **6. The Nudger.** Path: Yes to Deferred Veto, No to Refusal. Commitment: Must annoy the user with delays to prevent irreversible actions, treating friction as a safety feature.
  **7. The Unnamed.** Path: Yes to Skill, No to Market. Commitment: Refuses novices even if they go to worse actors, creating a safety hole where users flee to unregulated tools.

  # Empty rooms

  Several logically available combinations remain unoccupied because they are incoherent or unattractive. First, a **Consequentialist who ignores Escalation Externality** is tagged *incoherent*; if you claim to minimize harm but refuse to account for where the user goes next, your calculus is broken. Second, an **Integrity view that accepts Substitution** is *merely unattractive*; if refusal is about moral purity, offering a sanitized version compromises the stance, yet most teams want both purity and utility. Third, a **Fiduciary who ignores Affect** is *unexplored*; without emotional cues, how do you judge the future self? This room suggests we lack a metric for long-term regret outside of acute distress signals. Finally, a **Pure Instrumentalist who accepts Deferred Veto** is *incoherent*; if the user is sovereign, delaying their command violates the core premise. These empty rooms highlight where our terminology clashes with our desired outcomes, forcing us to admit we want paternalism without the label.

  # Where it breaks

  The tree cannot cleanly separate **The Fiduciary** and **The Nudger**. Both leaves result in paternalistic intervention—one via delay, one via affective override—but both rely on the assumption that the assistant knows better than the user. The current nodes split them on mechanism (time vs. emotion), but not on justification. To separate them, we need an extra question: *Is the intervention intended to prevent regret or to improve decision quality?* If the goal is preventing regret, the Fiduciary view holds; if improving quality, the Nudger view holds. Without this distinction, we will argue past each other about delays while agreeing on the paternalism.
