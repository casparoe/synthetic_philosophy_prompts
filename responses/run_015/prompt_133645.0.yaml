answer: |-
  First off, don't worry about the thumbs or the muddled feeling—this is actually a really sharp intuition. You're hitting on something that a lot of people feel but don't quite articulate: the idea that "neutral" starting conditions are never actually neutral.

  Here's how I'd help you sharpen that argument without getting bogged down in the usual "infinite regress" trap.

  **1. Reframe the "Hook"**
  The standard criticism of reductionism is usually about regress (i.e., "Okay, selection built morality, but what built selection?"). You want to avoid that because Dennett has a ready answer for it (cranes all the way down, physical laws, etc.).

  Instead, focus on **structural smuggling**. Your argument isn't that the crane needs a *previous* crane; it's that the ground the crane stands on is already sculpted to guarantee the specific outcome the crane is supposed to "discover."

  In EvPsych, the "fitness landscape" isn't just empty space. It's a pre-structured matrix of payoffs. If you model the evolution of cooperation, you have to define the parameters of the game (e.g., Iterated Prisoner's Dilemma) *before* you run the selection. If those parameters just happen to favor the specific moral intuitions we see today, then the explanatory weight isn't in the selection process (the crane); it's in the setup of the game (the hook).

  **2. The "Foundation as Hook" Move**
  Dennett treats skyhooks as miraculous suspenders from above. You're arguing that a skyhook can also be a **foundation planted from below.**

  Think of it like this: A construction crane (natural selection) lifts the building (morality/mind). Dennett says, "Look, no skyhooks, just the crane doing the work." But you're pointing out that the concrete pad the crane is parked on was poured with specific anchor bolts that only fit *this* building.

  If the boundary conditions of the universe (or the specific ecological niche) are fine-tuned to make the emergence of "human-like morality" probable, then that fine-tuning is doing the heavy lifting. It's a "foundation hook." It looks like part of the machinery, but it's actually a premise smuggled in as a physical fact.

  **3. Why Greedy Reductionism Collapses Here**
  Greedy reductionism claims you can explain the top level entirely by the bottom level without losing information. But if the bottom level (the boundary conditions/fitness landscape) already contains the "shape" of the top level, you haven't explained anything; you've just moved the design from the *process* to the *parameters*.

  The collapse happens because the reductionist claims to be deriving the structure from blind mechanics, but they actually need to assume the structure of the mechanics to get the result.
  *   **The Claim:** "Morality emerges from blind selection."
  *   **The Reality:** "Morality emerges from blind selection *operating within a payoff matrix that already values moral outcomes*."

  That payoff matrix is the invisible skyhook. It's not supernatural, but it is **informationally rich** in a way that the reductionist story refuses to account for.

  **4. The "No Free Lunch" Angle**
  You might find it useful to channel a bit of the "No Free Lunch" theorem vibe (from optimization theory) without necessarily citing it. Basically, you can't get specified complexity out of a system without putting specified complexity in.

  If EvPsych says selection builds moral structures, ask: "Where did the selection pressure come from?" If the answer is "the environment," ask: "Why is the environment structured such that *this* specific morality is the winning strategy?"

  If the environment just happens to be perfectly set up to grind out Kantian ethics (or whatever), that's not a crane victory; that's a setup victory. The "hook" is the coincidence that the landscape matches the outcome.

  **5. Summarizing the Punchline**
  So, to tighten your draft, try to frame it like this:

  Dennett's distinction fails in EvPsych because it treats **boundary conditions** as passive background rather than active constraints. A crane that only works on a pre-sculpted surface isn't a pure crane; it's a crane propped up by a hidden hook in the foundation. Greedy reductionism collapses because it tries to claim the *process* generated the *order*, when in reality the *constraints* guaranteed the order. The "hook" isn't in the conclusion (God did it); it's in the premises (the universe is set up so this works).

  **Quick check for your draft:**
  Make sure you distinguish between "laws of physics" (which might be generic) and "fitness landscapes" (which are specific). The hook is in the specific topology of the landscape required to get human psychology out. If the landscape had to be incredibly specific to get us here, that specificity is the skyhook.

  Does that track with what you're feeling? It keeps the focus on the *structural premises* rather than just asking "what caused the cause."
