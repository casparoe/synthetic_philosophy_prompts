  This is a delicate diagnostic task. You are asking me to reverse-engineer a decision procedure from a set of outputs (verdicts) and then run that procedure on a novel input (the Hybrid Machine). Because your friend's rationales ("same thing" vs. "sort of person") point to slightly different formalisms (Functional Decision Theory vs. Dispositionalism), and because she refused one critical data point (the pure marker case), there is genuine underdetermination. However, the arithmetic and the structural constraints allow for a high-confidence analysis of what her *commitments* require, even if her intuition might waver.

  Here is the breakdown.

  ### 1. The Rules and the Track Record

  We can eliminate Causal Decision Theory (CDT) immediately; it two-boxes on the Standard Newcomb case. Your friend one-boxes. We are left with three live candidates that fit most of her data: **Evidential Decision Theory (EDT)**, **Functional Decision Theory (FDT)** (or Timeless Decision Theory), and **Dispositionalism**.

  **A. Evidential Decision Theory (EDT)**
  *   **Rule:** Choose the act that provides the best news about the world. Maximize $E[U] = \sum P(State | Act) \times Utility$.
  *   **Track Record Fit:**
      *   *Standard/Dead/60% Newcomb:* Fits perfectly. Correlation implies evidential value.
      *   *PD Clone:* Fits. Cooperating is evidence the other cooperates.
      *   *Transparent/Assistant Newcomb:* **Poor Fit.** Standard EDT conditionalizes on the observation. If you *see* the million, or are *told* it's there, the correlation is screened off. Taking both dominates. Your friend one-boxes in the Assistant case ("one box if told one box"). This contradicts standard EDT, which would say "take both, the money is already there."
      *   *Marker Case:* **Poor Fit.** EDT one-boxes in Smoking Lesion/Marker cases (taking the act as evidence of the gene). Your friend refused to answer. This suggests she suspects EDT is wrong here but isn't comfortable endorsing the CDT alternative.

  **B. Functional Decision Theory (FDT)**
  *   **Rule:** Choose the output of your decision algorithm. You control the logical output of your algorithm, and any system that simulates or logically depends on that algorithm. You do *not* control systems that merely correlate with you via a common physical cause.
  *   **Track Record Fit:**
      *   *Standard/Dead/60% Newcomb:* Fits. The predictor simulates your algorithm.
      *   *PD Clone:* Fits. The opponent runs your algorithm.
      *   *Transparent/Assistant Newcomb:* **Good Fit (with nuance).** FDT agents one-box in Assistant Newcomb if the predictor predicted their response to the assistant. (Your friend's verdict implies she thinks her choice now determines what the assistant *would have* said).
      *   *Marker Case:* **Good Fit for Refusal.** FDT distinguishes between "simulation" (logical link) and "marker" (physical link). In a pure marker case, FDT two-boxes. Her refusal suggests she recognized this tension: she wants to one-box (Newcomb intuition) but knows the mechanism (Marker) breaks the logical link required for FDT.

  **C. Dispositionalism ("Be the Sort of Person")**
  *   **Rule:** Adopt the disposition/policy that, if you had it, would yield the highest expected utility.
  *   **Track Record Fit:**
      *   Matches FDT almost exactly in Newcomb problems.
      *   Explains her "rather be the sort of person" comment directly.
      *   In the Marker case, a Dispositionalist asks: "Does having the disposition to one-box cause the machine to put money in?" If the machine reads a gene, the answer is no. So a Dispositionalist should two-box in the Marker case.

  **Conclusion on Rules:** She is running an **FDT/Dispositionalist** hybrid. She treats logical correlations (simulations) as decision-relevant and physical correlations (markers) as decision-irrelevant. The refusal on the Marker case was likely her acknowledging that FDT requires two-boxing there, which conflicts with her Newcomb instincts.

  ### 2. The Arithmetic of the Hybrid Machine

  You asked me to redo the arithmetic. Your intuition was correct: EDT's verdict is stable, while FDT's verdict flips based on the weight of the simulation ($p$).

  **Payoff Structure:**
  *   **1-Box:** Take Opaque only.
  *   **2-Box:** Take Opaque + Transparent ($400k).
  *   **Opaque:** $1M if Machine outputs "1B", $0 if "2B".
  *   **Transparent:** $400k always.

  **The Two Conditions:**
  1.  **Simulation (Prob $p$):** Machine outputs what you choose.
      *   If 1-Box: Machine=1B. Payoff = $1,000,000.
      *   If 2-Box: Machine=2B. Payoff = $400,000.
  2.  **Marker (Prob $1-p$):** Machine outputs based on Gene (50% Carrier).
      *   *Note:* Your choice does not change the Gene. You must average over the 50/50 chance of being a Carrier.
      *   If Carrier (50%): Machine=1B ($1M in Opaque).
      *   If Non-Carrier (50%): Machine=2B ($0 in Opaque).
      *   If 1-Box: Exp Payoff = $0.5 \times 1M + 0.5 \times 0 = $500,000.
      *   If 2-Box: Exp Payoff = $0.5 \times 1.4M + 0.5 \times 0.4M = $900,000.

  **Expected Utility Calculation:**
  *   **EU(1-Box)** = $p(1,000,000) + (1-p)(500,000) = 500,000 + 500,000p$
  *   **EU(2-Box)** = $p(400,000) + (1-p)(900,000) = 900,000 - 500,000p$

  **The Crossover Point:**
  $$500,000 + 500,000p = 900,000 - 500,000p$$
  $$1,000,000p = 400,000$$
  $$p = 0.4$$

  **Verdicts by Rule:**
  *   **EDT:** Always **1-Box**. (Because 1-Boxing is strong evidence of being a Carrier in the Marker case, inflating the EU of 1-Boxing to ~$930k vs ~$470k for 2-Boxing at $p=0.3$). Your assessment was correct: the 0.3 weight doesn't change the EDT verdict, only the margin.
  *   **FDT/Dispositional:** **2-Box if $p < 0.4$**. **1-Box if $p > 0.4$**.
  *   **Current Case:** $p = 0.3$. **FDT says 2-Box.**

