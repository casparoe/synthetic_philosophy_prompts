      *   *Caveat:* In medicine, "Two-Boxing" (not taking meds) doesn't give you a guaranteed $400k bonus. It usually just saves you the cost. The payoff structure in Newcomb is artificial. In reality, if the meds have *any* causal mechanism, you usually take them unless the side effects outweigh the *causal* benefit. The confounding benefit (being the sort of person who takes meds) is not something you can gain by taking the meds if it's purely confounding.
