  *   **FDT Verdict:** **Two-Box.** (Your choice cannot change your DNA. The money is already there or not. Taking both gets you an extra $1k regardless of your genes).

  If she One-Boxes, she is an EDTer (and her Functionalism talk was metaphorical). If she Two-Boxes (or refuses), she is an FDTer. Given her refusal of the similar Marker case, I expect she would Two-Box or refuse again. If she Two-Boxes here, she **must** Two-Box in the Hybrid Machine.

  ### 5. Underdescribed Elements

