answer: |-
  Your description offers a remarkably precise phenomenology of a phenomenon that standard philosophical accounts of self-deception often struggle to capture. You are describing a shift from *intrapsychic* deception (hiding a truth within the mind) to *extrapsychic* or *structural* deception (hiding a truth within the environment one controls).

  To answer your questions directly: Yes, this can still be described as self-deception, but it requires moving beyond the "partitioned mind" model toward a model of **motivated epistemic scaffolding**. Furthermore, responsibility in this context attaches not to a conscious act of lying, but to the **stewardship of the conditions under which knowledge is produced.**

  Here is an analysis of your situation through three philosophical lenses: the nature of the deception, the locus of the mechanism, and the assignment of responsibility.

  ### 1. Is this Self-Deception without a Partitioned Mind?

  Traditional intentionalist accounts of self-deception (often rooted in a Freudian or Sartrean framework) posit a paradox: to deceive oneself, one must know the truth ($p$) and simultaneously convince oneself of the falsehood ($\neg p$). This requires a partitioned mind—one sub-agent knowing and another suppressing. You rightly note that your experience does not match this. You do not feel a conflict; you feel a "structured opacity."

  Contemporary deflationary accounts, most notably those by **Alfred Mele**, are better suited to your case. Mele argues that self-deception does not require an intention to deceive oneself. Instead, it arises from **motivationally biased treatment of evidence.**
  *   **Standard Case:** An agent ignores counter-evidence because accepting it causes anxiety.
  *   **Your Case:** You are not ignoring evidence; you are **adjusting the measuring stick.**

  In your scenario, the "false belief" (that your funding allocation is meritocratic) is not sustained by repressing a contradictory belief. It is sustained by **pre-empting the formation of the contradictory belief.** By tweaking the rubric, you ensure that the data never coalesces into a form that would trigger the cognitive dissonance requiring repression.

  This is self-deception because the *function* of the behavior is the same: maintaining a comforting belief (that you are impartial/meritorious) by manipulating the epistemic input. The difference is that the manipulation is outsourced to the procedure. The deception is not in the *belief state*; it is in the **belief-forming process.**

  ### 2. Can Deception Operate at the Level of Institutional Design?

  You ask whether deception can reside in architecture rather than mental states. This touches on the theory of **Extended Cognition** and **Epistemic Scaffolding.**

  If we accept that our cognitive processes often rely on external tools (notebooks, calculators, protocols), then corrupting those tools is functionally equivalent to corrupting internal memory or reasoning.
  *   **The Rubric as Cognitive Organ:** The scoring rubric is not neutral; it is an externalized component of your collective's decision-making cognition.
  *   **Structural Bad Faith:** Jean-Paul Sartre described "Bad Faith" as lying to oneself to escape the anxiety of freedom. Your scenario suggests a **Structural Bad Faith.** You have constructed a system that allows you to claim the *status* of objectivity (the blind review) while retaining the *power* of subjectivity (designing the rubric).

  The "structured opacity" you describe is a form of **epistemic gerrymandering.** Just as political gerrymandering creates districts that guarantee a result without explicitly banning votes, your rubric revisions guarantee an outcome without explicitly rigging the scores. The deception operates at the level of **constraints.** You have not told yourself a lie; you have built a room where the truth cannot fit.

  Philosophically, this validates the idea that self-deception can be **distributed.** It does not require a partitioned mind if the environment is partitioned *for* the mind. The "hiding" happens in the gap between the *designer of the system* and the *user of the system*—roles you occupy sequentially but do not integrate critically.

  ### 3. Responsibility for Systemic Error

  If the error is embedded in a system you created, how does responsibility attach? Standard models of responsibility often rely on *conscious intent* (mens rea). Since you lack explicit intent to privilege yourself, you might feel absolved. However, ethical frameworks regarding **epistemic vice** and **administrative negligence** suggest otherwise.

  **A. Responsibility for Omission (The Duty to Audit)**
  As the director, you hold a fiduciary duty to the integrity of the collective's epistemic processes. Responsibility here attaches to the **failure to meta-evaluate.**
  *   You evaluate proposals (Level 1).
  *   You evaluate the rubric (Level 2).
  *   You failed to evaluate the *correlation between rubric changes and your own success* (Level 3).

  Responsibility lies in the omission of Level 3 scrutiny. By not instituting a check on the *designer* of the rubric, you created a blind spot. In legal and ethical terms, this approaches **willful blindness**: you arranged the system so you would not have to know.

  **B. Constitutive Responsibility**
  You are responsible for the system because the system is an extension of your agency. If a pilot designs a flight computer that subtly favors their own landing approach, the crash is not an "accident" even if the pilot didn't consciously program the crash. The pilot is responsible for the **integrity of the instrumentation.**
  Your responsibility is **constitutive**: you are the author of the conditions that make the deception possible. The "self" that is deceived and the "self" that designed the trap are the same agent, separated only by time and role.

  **C. Epistemic Vice**
  Vice epistemologists (like Quassim Cassam) argue that we are responsible for our epistemic character traits. Cultivating a system that insulates your work from genuine risk is an **epistemic vice** (specifically, a form of epistemic corruption or insouciance). Responsibility attaches to the cultivation of that vice, even if the specific instances of rubric-tweaking felt "individually defensible" at the time.

  ### Conclusion and Path Forward

  You are experiencing a sophisticated form of self-deception that is **procedural rather than psychological.** It does not require a partitioned mind because the partition is built into your workflow.

  To resolve this, you must treat the **rubric design** as a conflict of interest, not just the **proposal evaluation.**

  1.  **Recusal from Architecture:** You must relinquish control over the scoring criteria for any cycle in which you apply. An independent party must set the weights.
  2.  **Meta-Audit:** Implement a protocol where rubric changes are logged and retrospectively analyzed for correlation with applicant outcomes (including yours).
  3.  **Acknowledgment of Motive:** Accept that "individually defensible" changes can be "collectively corrupting." The absence of conscious malice does not negate the presence of structural bias.

  You have successfully externalized the conflict of interest, but you have internalized the conflict of *design*. True integrity requires blindfolding the architect, not just the judge.
