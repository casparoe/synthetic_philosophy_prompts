answer: |-
  Here is a plan for the seminar. It is designed to be philosophically rigorous without becoming academic, and it respects your constraint to keep the philosophy on its own terms rather than reducing it to craft advice.

  ### 1. The Order of Components

  Do not follow the *Investigations* linearly. The text is a labyrinth; your seminar must be a vector. The order below is dictated by the specific cognitive traps your audience will fall into.

  **1. The Essentialist Craving (15 mins)**
  *   **What:** Begin not with Wittgenstein, but with the audience's instinct. Ask them to define a simple concept (see Section 2). Watch them reach for necessary and sufficient conditions.
  *   **Why:** You cannot explain the cure until you have induced the symptom. If you start with Family Resemblance, it sounds like a casual observation about similarity. It must be presented as the *failure* of a specific philosophical demand (the demand for an essence).
  *   **Risk:** If you skip this, they will treat Family Resemblance as a "soft" version of definition rather than a rejection of definition.

  **2. Family Resemblance (45 mins)**
  *   **What:** Introduce FR only after the Essentialist Craving has visibly failed. Show that the concept holds together without a common thread.
  *   **Why:** This is the hook they know, but you must strip it of its "search engine" vagueness. It is not that things are "vaguely similar"; it is that the *network* of similarities does the work of the definition.
  *   **Risk:** If introduced before the Craving, it sounds like permission to be sloppy.

  **3. Language Games (60 mins)**
  *   **What:** Now answer the question: "If there is no essence, what holds the concept together?" Answer: The context of activity.
  *   **Why:** FR describes the *shape* of the concept; LG describes the *ground* it stands on. Without LG, FR looks like free-floating relativism. You must establish that these uses occur within rule-governed (but not rigid) forms of life.
  *   **Risk:** If LG comes before FR, they will treat Language Games as "genres" or "styles" of writing. It must be clear that a Language Game is a unit of *action*, not a category of text.

  **4. Meaning as Use (45 mins)**
  *   **What:** Place this late. "For a large class of cases… the meaning of a word is its use in the language."
  *   **Why:** If you say this early, writers will hear: "I decide what my words mean." By placing it after LG, you constrain it. Use is not individual whim; it is move-making within a game.
  *   **Risk:** This is the most likely point of collapse into subjectivity. It requires the scaffolding of LG to hold.

  **5. Criteria vs. Symptoms (30 mins)**
  *   **What:** Distinguish between what *justifies* the use of a concept (criteria) and what merely *accompanies* it (symptoms).
  *   **Why:** This is the guardrail against the "No Fact of the Matter" error. It allows you to say there are right and wrong uses without requiring an essence.
  *   **Risk:** It is technical. If you lose them here, the closing exercise will fail. Keep it concrete.

  **Breaks:** Take two 15-minute breaks. One after Family Resemblance, one after Language Games. Three hours is a marathon; their attention will fracture at the 90-minute mark.

  ### 2. The Carrying Example

  **The Example:** **"A Promise."**

  **Why this example:**
  *   **Variety without Essence:** A promise can be spoken, written, signed, implied by silence, or sealed with blood. Some are trivial ("I'll call you"), some monumental (vows). Some are kept, some broken (but remain promises). There is no single physical or linguistic feature common to all.
  *   **Clear Incorrect Use:** A statement of fact ("It will rain") is not a promise. A threat is not a promise. This prevents the slide into "anything goes."
  *   **No Definition Available:** You cannot define "promise" without referencing the social context (the game) in which it occurs.
  *   **Normative Weight:** Like fiction, promises involve intention, uptake, and consequence.

  **The Cost of a Trade Example (e.g., "The Novel"):**
  Do not use "The Novel" as your carrying example, though you will use it for the closing exercise.
  *   **Defensiveness:** If you analyze "The Novel" philosophically for two hours, every application will be heard as a critique of their own manuscripts. They will stop listening to the philosophy and start evaluating your taste.
  *   **Stakes:** The stakes become too high. If "The Novel" has no essence, is their life's work invalid? Using "A Promise" keeps the stakes intellectual, not existential.
  *   **Category Error:** They will conflate the *philosophical* category (what makes a novel a novel) with the *market* category (what sells as a novel). "A Promise" is immune to market distortion.

  ### 3. Misconceptions and Interventions

  **1. Family Resemblance as Disjunctive Definition**
  *   **The Error:** "So a promise is *either* spoken *or* written *or* implied..."
  *   **Intervention:** **Pre-empt.** In the FR section, emphasize *overlapping* networks, not a list of options. Use the thread metaphor (fibers overlap, no single fiber runs the whole length).
  *   **Move:** Draw a Venn diagram where the center is empty.

  **2. Collapsed into Vagueness**
  *   **The Error:** "So the concept is just blurry."
  *   **Intervention:** **Correct immediately.** Vagueness implies a sharp boundary exists somewhere but we can't see it. Wittgenstein's claim is that the boundary is not needed for the concept to function.
  *   **Move:** Ask: "Does the vagueness of 'stand roughly there' prevent you from standing there?" (PI §71).

  **3. No Fact of the Matter (The Relativist Slide)**
  *   **The Error:** "If there's no essence, then calling a lie a promise is just an opinion."
  *   **Intervention:** **Pre-empt with Criteria.** Introduce Criteria vs. Symptoms in the final hour. A promise *requires* uptake (criterion); a trembling voice is just a symptom.
  *   **Move:** Show that while boundaries are fuzzy, moves can still be illegal. You can foul in basketball even if "sport" has no essence.

  **4. Meaning as Use = Authorial Intent**
  *   **The Error:** "So I decide what my words mean by how I use them."
  *   **Intervention:** **Correct aggressively.** This is the most dangerous error for writers. Meaning is *public* use, not private intention.
  *   **Move:** "If you use a word in a way no one else recognizes, you aren't creating a new meaning; you are making a noise. The game requires other players."

  **5. Language Games as Constitutive Rules (Chess)**
  *   **The Error:** "So fiction has strict rules like chess?"
  *   **Intervention:** **Pre-empt.** Distinguish between "strict rules" (chess) and "rules of thumb/custom" (street play).
  *   **Move:** Emphasize that Language Games evolve. A move that was illegal ten years ago (e.g., second-person present tense) may be legal now.

  **6. The Inner Life (Novelist Specific)**
  *   **The Error:** "If meaning is public use, then a character's private thoughts aren't real/meaningful."
  *   **Intervention:** **Correct.** Wittgenstein does not deny inner states; he denies private *language*. Reporting an inner state is a public move in a language game.
  *   **Move:** "Writing 'he felt sad' is a public act of communication. The sadness is private; the *meaning* of the sentence is public."

  **7. The "Deep Structure" Hope**
  *   **The Error:** "Okay, but surely there's a *deeper* linguistic structure underneath?"
  *   **Intervention:** **Pre-empt.** This is the *Tractatus* ghost.
  *   **Move:** Be explicit: "We are not looking for the hidden engine. We are looking at the surface. The surface is all there is."

  ### 4. The Explicit Choice: Theory vs. Therapy

  You must commit to one of these interpretations, as they dictate the closing exercise.

  **The Choice:** Teach it as a **Refusal of the Demand for a Boundary** (Therapy), not a **Positive Claim about the Concept's Extension** (Theory).

  *   **Why:** If you teach it as a theory ("Concepts *have* fuzzy boundaries"), you invite counter-arguments ("But what about *this* boundary?"). If you teach it as therapy ("Why do you *feel* you need a boundary?"), you dissolve the problem.
  *   **Commitment:** Your stance is that the search for an essence is a philosophical sickness, not a solvable puzzle.
  *   **Impact on Closing:** The closing exercise is not to "find the definition" of the borderline case, but to examine *why we want to categorize it* and whether the categorization serves a purpose.

  ### 5. What to Refuse (The Private Language Argument)

  Someone will ask about the Private Language Argument (PLA). It is the elephant in the room.

  *   **The Refusal:** Do not teach the PLA. It requires too much setup (sensations, beetles in boxes, memory checks) and will consume the remaining time.
  *   **The Script:** "The Private Language Argument is Wittgenstein's next move. It relies on the work we are doing today. For this seminar, we are accepting the premise that language is inherently public. If you assume language is public, the PLA becomes a consequence, not a starting point. Let's master the public ground first."
  *   **If they press:** Acknowledge the validity of the question but bracket it. "That is the subject of a second seminar. Today we are mapping the surface."

  ### 6. The Check: The Closing Exercise

  **The Task:** Present the borderline case: **"A book of linked short stories vs. A Novel."** (e.g., *Olive Kitteridge* or *Winesburg, Ohio*).

  **The Question:** "Is this a novel? What settles the matter?"

  **Success Criteria (The Idea Has Landed):**
  *   **Appeal to Use/Context:** Participants argue based on how the book is *used* or *received*. ("It reads as a whole," "The publisher markets it as a novel," "The emotional arc is continuous.")
  *   **Acceptance of Purpose:** They admit the classification depends on *why* we are asking. ("For a prize submission, it might be X; for a reader, it is Y.")
  *   **Comfort with the Blur:** They do not express anxiety that the lack of a definition breaks the concept of "Novel."

  **Failure Criteria (Where It Went Wrong):**
  *   **Essentialist Regression:** They try to draw a hard line. ("It must have 60,000 words," "It must have one protagonist.")
      *   *Diagnosis:* You failed to dismantle the Essentialist Craving in Hour 1.
  *   **Relativist Collapse:** They say, "It doesn't matter," or "It's whatever the author says."
      *   *Diagnosis:* You failed to anchor Meaning as Use in public Criteria (Hour 3). They think "Use" means "Whim."
  *   **Anxiety:** They worry that if "Novel" has no essence, their work has no status.
      *   *Diagnosis:* You failed to separate the philosophical category from the market/value category. You let the Trade Cost bleed in.

  **Final Note to You:**
  Your audience wants to know what this has to do with writing fiction. Do not answer this with "tips." Answer it with this: *If you stop looking for the essence of a character, a plot, or a truth, and start looking at their use in the specific world you are building, you stop writing abstractions and start writing moves.* Let them make the translation. Your job is to ensure the philosophy is solid enough to bear the weight of that translation.
