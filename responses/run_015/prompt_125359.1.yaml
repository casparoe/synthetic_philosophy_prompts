answer: |-
  Hey, great topic. Moore's Paradox is perfect for that age group because it feels like a trick question but actually cuts right to the heart of what language *does* versus what it *says*. Since they've got basic logic, they'll spot the formal validity immediately, which is exactly where you want them to get stuck before you pull the rug out.

  Here's the brainstorming dump, then the concrete plan.

  ### Quick Brainstorming
  *   **The Trap:** If you start with "It's raining," they'll tune out. It's too abstract. They need to feel the tension in their own mouths.
  *   **The Core Mechanism:** You need to establish the "Norm of Assertion" early. When I say "P," I'm not just describing the world; I'm expressing my mind. It's a dual-action move.
  *   **The Visceral Example:** Needs to be undeniable fact + denied belief.
      *   *Idea 1:* "I am sitting down, but I don't believe I am." (Good, physical).
      *   *Idea 2:* "I am speaking English, but I don't believe I am." (Good, self-verifying).
      *   *Idea 3:* "There is a fire alarm going off, but I don't believe it is." (Too external, could be deafness).
      *   *Winner:* **"I am holding a pen, but I don't believe I am."** Have them actually hold a pen. It makes the first half empirically undeniable, forcing the absurdity onto the second half.
  *   **The Science Objection:** This is the tricky one. They'll conflate "I don't believe" with "I'm not 100% certain." You need to separate *belief* from *certainty*.
  *   **The Logic Objection:** They'll say "That's not a contradiction." You agree immediately. That's the point.
  *   **What to Cut:** Don't touch Wittgenstein's *Philosophical Investigations* §400+ stuff, don't bring in Grice's Maxims by name, and avoid formal doxastic logic (Bp → p). Keep it about *rules of the game*.

  ---

  ### The 90-Minute Plan

  #### 1. The Hook & The Carrying Example (0–20 mins)
  **Goal:** Make them feel the absurdity before analyzing it.

  Don't write the sentence on the board yet. Walk around the room holding a bright red marker.
  Ask them: "If I say, 'This marker is red,' what am I doing?"
  They'll say: "Stating a fact," "Describing the marker."
  Push them: "Am I also telling you something about *me*?"

  Then, drop the carrying example. Have every kid hold up a pen.
  **The Script:** "I want everyone to say this sentence out loud, sincerely: **'I am holding a pen, but I don't believe I am.'**"

  Let them laugh. It feels weird. It feels impossible to say *sincerely*.
  Ask: "Why was that hard? Was it hard to say the words?" (No.) "Was it hard to mean them?" (Yes.)

  **The Prerequisite Idea:** You need to lock in the **Assertion-Belief Link**.
  Explain: "In the game of talking, asserting 'P' is like making a move in chess. You can't make a move without committing to it. When you assert 'P', you automatically signal 'I believe P'. It's built into the move."

  #### 2. Heading Off Objection #1: The Logic Check (20–35 mins)
  **Misconception:** "This is just a contradiction like 'P and not-P'."
  **Why it surfaces:** They know logic. They know (P & ~P) is false. They see (P & ~B(P)) and think it's the same category.

  **The Move:** Validate them immediately.
  "You're right. Logically, this sentence could be true. I *could* be holding a pen and be crazy enough not to believe it. Maybe I think I'm hallucinating. The *facts* don't contradict."
  "So if it's not a logical contradiction, what is it?"
  **The Pivot:** It's a **pragmatic contradiction**. It contradicts the *rules of speaking*, not the rules of logic.
  **Activity:** Ask them to write the sentence in their diary privately. "Is it weird to *think* it?" (No, I can be confused about my own state). "Is it weird to *say* it?" (Yes).
  **Takeaway:** The paradox lives in the *assertion*, not the *proposition*.

  #### 3. Heading Off Objection #2: The Lying Check (35–50 mins)
  **Misconception:** "You're just lying. If you say you don't believe it, you're lying."
  **Why it surfaces:** It's the easiest way to dismiss the weirdness. If I say it, I must believe it, so the second part is false.

  **The Move:** Distinguish **Insincerity** from **Absurdity**.
  "If I'm lying, I *do* believe I'm holding the pen, I'm just saying I don't. That makes the sentence false, but not absurd. Moore's Paradox is when we assume the speaker is being *sincere*."
  "Imagine a robot programmed to state facts but has no mind. It says 'Pen here.' Does it believe it? No. Can it say 'Pen here, but I don't believe it'? Yes, because it's not playing the assertion game."
  "Humans playing the language game can't say it sincerely. It's not that you're lying; it's that you're breaking the mechanism of communication."

  #### 4. Heading Off Objection #3: Scientific Humility (50–70 mins)
  **Misconception:** "Scientists say 'Gravity exists' but admit they could be wrong. That's basically this."
  **Why it surfaces:** They just finished a science unit. They think "I don't believe" means "I'm not 100% certain."

  **The Move:** Separate **Fallibility** from **Disbelief**.
  "Scientific humility is: 'P is true, but I acknowledge I could be mistaken.' That is perfectly fine."
  "Moore's sentence is: 'P is true, but I *lack the belief* that P.' "
  "Can a scientist say 'Gravity works, but I don't believe it works'? No. They can say 'I'm not certain,' but 'I don't believe' withdraws the commitment needed to do science."
  **Analogy:** "It's the difference between saying 'I might be wrong' (humility) and 'I don't think this is true' (sabotage). Moore's paradox is sabotage."

  #### 5. Synthesis & The Check Question (70–90 mins)
  **Goal:** Solidify the pragmatic vs. logical distinction.

  Wrap up by reiterating: Logic is about truth conditions. Pragmatics is about usage conditions. Moore's Paradox is a crash in the software, not the hardware.

  **The Check Question:**
  Don't ask them to define the paradox. Ask them to apply the norm.
  **Ask this:**
  > "Imagine I send you a text message that says: *'I am asleep right now, but I don't believe I am.'*
  > Do you think I made a **logical error**, or did I break a **rule of communication**? How do you know?"

  **Why this works:**
  *   If they say "Logical error," they failed. (It's logically possible to be asleep and not believe it—dreaming).
  *   If they say "Rule of communication," they need to explain *which* rule.
  *   **The Killer Detail:** You can't text while asleep. So the first half ("I am asleep") is pragmatically self-defeating when *asserted*, just like Moore's sentence. It forces them to see that the act of sending the message guarantees the first part is false *in the context of assertion*, mirroring the belief contradiction.
  *   *Alternative if that's too tricky:* "Can you **think** Moore's sentence without being irrational? Can you **say** it without being irrational?" (Answer: Yes to thinking, No to saying).

  ### What to Openly Refuse to Explain
  Be transparent about the scope so they know there's more to learn later. Tell them:

  1.  **Wittgenstein's Later Philosophy:** "We're touching on ideas from Wittgenstein about language games, but we aren't going into his full theory of private language or rule-following. That's a whole semester."
  2.  **Speech Act Taxonomy:** "We're talking about 'assertion,' but there's a whole formal system (like Searle or Austin) that categorizes every type of utterance (promises, threats, bets). We're sticking just to assertions."
  3.  **Formal Doxastic Logic:** "We aren't going to write this out in symbolic logic with belief operators. We're keeping it conceptual."

  ### Final Tip for the Room
  Keep the energy on the *performance* of the sentence. Have them try to say it with a straight face. The discomfort in the room is the data. If they're laughing, you're winning. The paradox isn't solved by thinking harder; it's solved by realizing language isn't just a picture of the world—it's a tool we use to navigate it, and Moore's sentence jams the tool.
