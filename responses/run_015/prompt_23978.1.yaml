answer: |-
  Here is a complete simulation design tailored for a 75-minute graduate seminar. It is built to be robust against "gaming," fast enough to leave room for debrief, and explicitly engineered to force the Price-Specie Flow mechanism to occur even if the students are hesitant traders.

  # Simulation: The Hume Game (Price-Specie Flow)

  **Time:** 75 Minutes
  **Players:** 14 Grad Students
  **Setup:** Two Nations ("Aurum" and "Ferrum"), 7 students each.
  **Materials:** 
  *   100 Gold Tokens (poker chips or slips of paper).
  *   28 Good Cards (index cards marked "Wheat" or "Cloth").
  *   Score sheets.

  ## 1. The Setup (10 Minutes)

  **The Narrative:**
  Tell the class they are economic agents in the 18th century. Their goal is **wealth**, defined strictly as **consumption of goods**. Gold is merely a tool to facilitate trade; it has no intrinsic utility.

  **The Nations:**
  *   **Aurum (The Gold-Rich):** 7 Students.
      *   Endowment: **10 Gold** each (Total: 70 Gold).
      *   Production: Each receives 1 **"Luxury Good"** card per round.
  *   **Ferrum (The Gold-Poor):** 7 Students.
      *   Endowment: **1 Gold** each (Total: 7 Gold).
      *   Production: Each receives 1 **"Basic Good"** card per round.

  **The Rules of Life:**
  1.  **Survival:** To score points, you must **consume** 1 Good per round. You cannot consume your own production (specialization). You *must* trade.
  2.  **Scoring:** 
      *   Consumed Good = **10 Points**.
      *   Gold held at end of game = **0 Points**. (Write this on the board in bold).
  3.  **Trade:** Bilateral negotiation. Seller names a price in Gold; Buyer accepts or rejects.
  4.  **Bankruptcy:** If you cannot buy a Good by the end of the round, you starve (0 points for that round).

  **The Mercantilist Trap (The Hook):**
  Before starting, whisper to two students in Aurum (the "Bankers"): *"Rumor has it the King values gold reserves. If your nation ends with the most gold, you might get a bonus."* 
  *Why:* This plants the Mercantilist seed. If they act on it, they break the economy, which makes the debrief richer. If they ignore it, the mechanics still hold.

  ## 2. Round 1: The Imbalance (15 Minutes)

  **State:** Aurum has 90% of the money supply. Ferrum has the goods Aurum needs.
  **Action:** 
  1.  Distribute Goods and Gold.
  2.  Open markets for 5 minutes. 
  3.  **Constraint:** Aurum *must* spend gold to eat. Ferrum *must* sell goods to get gold to eat (since they only start with 1 gold, they can't buy immediately; they must sell first).
  4.  **Expected Outcome:** Aurum bids for Ferrum's goods. Ferrum, holding a monopoly on food for the hungry Aurumites, will charge high prices (e.g., 5–8 Gold per Good). 
  5.  **Result:** Massive gold outflow from Aurum to Ferrum. Aurum consumes; Ferrum consumes + accumulates gold.

  **Intermission: The Humean Shock (5 Minutes)**
  Collect all gold. Count the totals publicly.
  *   *Likely Result:* Ferrum now holds >60% of the gold.
  *   **The Rule Change:** Announce: *"Market forces have adjusted. In the nation that now holds the majority of specie, wages have risen due to the abundance of money. Production costs have doubled."*
  *   **New Constraint:** For Round 2, **Ferrum sellers cannot accept less than 4 Gold per Good.** Aurum sellers have no price floor (they are "deflationary").
  *   *Note:* This hard-codes Hume's inflation mechanism so the lesson doesn't fail due to price stickiness.

  ## 3. Round 2: The Correction (15 Minutes)

  **State:** Ferrum is now Gold-Rich but has "High Wages." Aurum is Gold-Poor but has "Low Wages."
  **Action:**
  1.  Distribute new Goods.
  2.  Open markets for 5 minutes.
  3.  **Expected Outcome:** Ferrum tries to buy Aurum goods. Aurum goods are cheap (1–2 Gold). Ferrum goods are expensive (Min 4 Gold). Rational agents in Ferrum will stop buying from their own high-cost nationals and buy from Aurum.
  4.  **Result:** Gold flows back from Ferrum to Aurum. The trade balance reverses.

  ## 4. Round 3: Equilibrium (Optional/Time Permitting) (10 Minutes)

  If gold distribution is roughly equal (40-60%), remove the Price Floor. Let them trade freely. Prices should stabilize. This demonstrates the long-run equilibrium.

  ## 5. The Debrief (30 Minutes)

  This is where the learning happens. Do not lecture immediately. Ask Socratic questions first.

  **Phase 1: The Experience (5 mins)**
  *   "Ferrum, how did it feel to start poor but suddenly hold all the gold?"
  *   "Aurum, did you feel poorer when your gold left? Why or why not?" (Target answer: No, because we still ate).
  *   "Why did trade reverse in Round 2?" (Target answer: Ferrum's goods became too expensive).

  **Phase 2: Mapping to Hume (15 mins)**
  Draw the Price-Specie Flow diagram on the board. Map the simulation steps to the theory:
  1.  **Trade Surplus (Round 1):** Ferrum exports > Imports.
  2.  **Specie Inflow:** Gold moves to Ferrum.
  3.  **Price Level Rise:** The "Wage Rule" we enforced represents Hume's Quantity Theory of Money ($MV=PT$). More gold $\rightarrow$ higher domestic prices.
  4.  **Loss of Competitiveness:** Ferrum's exports became too expensive for Aurum.
  5.  **Self-Correction:** Trade balance flipped without government intervention.

  **Phase 3: The Mercantilist Critique (10 mins)**
  *   "If you were a Mercantilist Minister for Ferrum, would you be happy about Round 1?" (Yes, gold inflow).
  *   "What happened in Round 2?" (The inflow killed your export advantage).
  *   **Hume's Punchline:** Hoarding gold is self-defeating. It raises domestic prices, making your goods uncompetitive, causing the gold to leave anyway. Therefore, policy aimed at permanent surpluses is futile. Real wealth is the *goods consumed*, not the *gold held*.

  ---

  # What Will Go Wrong (And How to Fix It)

  You are right to be worried about student behavior. Here are the specific failure modes and your "God Mode" interventions:

  **1. Price Stickiness (The "1 Gold = 1 Good" Norm)**
  *   **Risk:** Students default to fair, fixed prices to save time. If Aurum buys Ferrum goods at 1 Gold, gold flows too slowly.
  *   **Fix:** During Round 1, walk around and whisper to Ferrum sellers: *"You are the only source of food for them. They have 10 gold each. Charge what the market will bear."* If they still don't budge, enforce the **Round 2 Price Floor** aggressively. Explain that in reality, this happens via wage inflation, but here we are simulating the outcome.

  **2. The Hoarding Instinct**
  *   **Risk:** Students treat Gold as points (Mercantilist mindset) despite the rules. They refuse to spend in Round 2.
  *   **Fix:** Remind them of the **Starvation Rule**. "You have 20 gold, but 0 food. Your score is 0. Gold does not save you." If they still hoard, they eliminate themselves from the simulation, which is actually a perfect teaching moment about the absurdity of Mercantilism.

  **3. Cartel Behavior**
  *   **Risk:** Aurum colludes to force Ferrum prices down, or Ferrum colludes to keep prices high permanently.
  *   **Fix:** Remind them this is a *competitive* market simulation. If Ferrum keeps prices too high, Aurum simply starves (scores 0), and Ferrum has no one to sell to. Mutual destruction is possible. Hume assumes rational self-interest, not mutually assured destruction.

  **4. Time Management**
  *   **Risk:** Trading drags on.
  *   **Fix:** Use a visible timer. Announce "1 Minute Left" loudly. If trades aren't done, they starve. High stakes speed up negotiation.

  ---

  # Limitations: What This Simulation Cannot Reproduce

  Be honest with them in the debrief. A 75-minute sim cannot capture 18th-century macroeconomics perfectly. You need to supply these gaps:

  **1. The Time Lag**
  *   **Sim:** Prices adjust instantly between Round 1 and 2.
  *   **Hume:** Hume acknowledged this process takes *years*. Specie flows slowly; wages are sticky downward.
  *   **Teaching Point:** Hume's mechanism is a long-run equilibrium theory. In the short run (Keynesian view), a trade deficit *can* cause pain (unemployment) before the self-correction kicks in. Hume assumes full employment; we simulated full consumption, but not the labor market friction.

  **2. Capital Mobility vs. Trade Balance**
  *   **Sim:** Gold only moves via trade in goods.
  *   **Hume:** Focused on trade balances.
  *   **Reality:** Capital flows (investment, debt) can sustain imbalances much longer than trade alone. A nation can run a deficit by selling assets, not just bleeding gold. Hume didn't fully model financial capital accounts.

  **3. The "Money Veil" Assumption**
  *   **Sim:** Gold = 0 points.
  *   **Reality:** In the 18th century, gold *was* international liquidity. Hoarding it provided security against war or credit crunches.
  *   **Teaching Point:** Mercantilists weren't stupid; they valued gold for *power* and *security*, not just consumption. Hume's critique is that as a *permanent economic policy*, it fails, not that gold has no strategic value.

  **4. Government Intervention**
  *   **Sim:** Free trade (mostly).
  *   **Hume:** Argued against tariffs/quotas.
  *   **Reality:** If Ferrum had imposed tariffs in Round 2, they could have delayed the outflow. Hume's argument is that tariffs ultimately fail because they distort prices further, but the simulation doesn't let them try (and fail) with policy tools.

  # Instructor Cheat Sheet: The "Aha!" Moment

  The moment you are aiming for is when a Ferrum student says in Round 2: *"I can't sell my goods. Aurum won't buy them because they're too expensive now that we have all the gold."*

  Stop the class right there. Point at that student.
  *"That is David Hume in 1752. You have just discovered that a trade surplus contains the seeds of its own destruction."*

  This anchors the abstract theory to a concrete frustration they felt in their gut. That is how you break the Mercantilist intuition.
