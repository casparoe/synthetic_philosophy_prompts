      *   *Constraint Check:* Is this "framing"? The prompt says "not... framing effects." Usually, framing is about how the *same* info is presented. Here, *new* info arrives. Is it "menu dependence"? No, pairs are distinct. Is it "temporal preference change"? No, deep utility is stable.
      *   *The Crux:* The prompt says "non-Bayesian informational update that changes which features... the agent takes to be relevant."
      *   In a Bayesian world, new info updates the *probability* of outcomes, but you still weigh all attributes by their probability and utility.
