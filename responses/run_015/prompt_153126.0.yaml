      *   *Better Interpretation:* The agent has a stable utility function over *attributes*. However, the agent employs a **lexicographic semi-order** or a **screening process** where new information promotes a specific attribute to "decisive" status, suppressing others. This is a non-Bayesian way of processing information (ignoring probabilities of other attributes).
