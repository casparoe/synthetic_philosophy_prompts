      *   **Domain:** Clinical treatment, consumer purchase, or policy preference.
      *   **Constraint 1 (No Intransitive Tastes):** The agent's underlying utility function must be stable and transitive.
      *   **Constraint 2 (No Framing/Menu/Time):** The cycle isn't due to how options are presented, what else is available, or changing tastes over time.
