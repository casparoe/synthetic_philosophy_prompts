      *   **Why Stable Utility?** The agent's *goal* is still overall well-being (R+H+C). She isn't changing her mind about what makes life good. She is changing her *decision rule* based on what information is salient.
      *   **RP Analyst:** Sees choices. Assumes Choice = Max U(Option). Concludes Intransitivity.
