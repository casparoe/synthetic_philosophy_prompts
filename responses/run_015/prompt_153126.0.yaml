      *   *Non-Bayesian Update:* The info doesn't change the *probability* of the attributes (the drug properties are fixed), it changes the *weight* assigned to them in the decision process (salience). A Bayesian would update beliefs about the state, but not zero-out the utility contribution of other attributes.

