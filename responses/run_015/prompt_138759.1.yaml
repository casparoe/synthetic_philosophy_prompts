      *   **Goal:** Needs a "requirements document" for the *normative core* of authority (when does an earlier self bind a later self?), not legal statutes.
      *   **Format:** Requirements document (Desiderata), not an essay. Specific structure for each requirement (Statement, Motivation, Exclusion, Status).
      *   **Specific Tasks:**
          *   Evaluate the user's 11 cases (add missing, flag confused/useless).
          *   Evaluate the user's distinctions.
          *   Evaluate the two constraints (Observability, Error Asymmetry).
          *   Evaluate the four rough positions (where they fail, missing positions).
          *   Identify non-genuine desiderata (prejudices).
          *   Identify jointly unsatisfiable requirements (impossibility results).
          *   Identify the single most exclusionary requirement.
      *   **Tone:** Precise, analytical, implementable, philosophical but grounded in policy/bedside reality.

  2.  **Deconstruct the User's Cases (1-11):**
      *   *1. Baseline:* Standard advance directive (AD). Essential.
      *   *2. Contented Patient:* Dworkin's "Mabel" case. Critical for autonomy vs. experiential interests.
      *   *3. Ulysses:* Psychiatric advance directive (PAD). Critical for competence fluctuation.
      *   *4. Depressed Author:* Competence at time of writing. Critical for validity conditions.
      *   *5. Drift:* Interpretation/Technological change. Critical for semantic stability.
      *   *6. The Corpus:* Conflicting documents. Critical for version control.
      *   *7. Self-Sealing Trigger:* Epistemic access/Verification. Critical for implementation.
      *   *8. The Stack:* Infinite regress of meta-rules. Critical for logical closure.
      *   *9. The Gate:* Expiration/Renewal. Critical for temporal decay.
      *   *10. Granularity:* Global vs. specific competence. Critical for scope.
      *   *11. Third-Party Effects:* Harm principle/Resource allocation. Critical for external limits.

      *Critique:* Case 7 (Self-Sealing) is arguably an implementation constraint rather than a normative one, but it touches on epistemic authority. Case 8 (The Stack) is logically fascinating but rare in practice; might be low priority for *bedside* policy but high for *system design*. Case 11 is often treated as a side-constraint, but the user asks if it bounds authority.

  3.  **Deconstruct the Constraints:**
      *   *Observability:* Crucial for a software engineer. A normative theory that requires mind-reading is useless for a system.
      *   *Error Asymmetry:* Default state. Is the presumption for liberty (no treatment) or preservation of life (treatment)? This is a policy switch, not just theory.

  4.  **Deconstruct the Four Positions:**
      *   *P1: Precedent Autonomy (Binding Choice).*
      *   *P2: Current Interests (Best Interests).*
      *   *P3: Values/Character (Narrative).*
      *   *P4: Life Authorship (Constitutional).*
      *   *Task:* Test these against the requirements.

  5.  **Drafting the Requirements (The Core Task):**
      *   Need to synthesize philosophical literature (Dworkin, Dresser, Robertson, Buchanan) into engineering specs.
      *   *Requirement 1: Competence at Origin.* (Addresses Case 4).
      *   *Requirement 2: Trigger Verifiability.* (Addresses Case 7).
      *   *Requirement 3: Content Stability vs. Interpretive Drift.* (Addresses Case 5).
      *   *Requirement 4: The Revocation Threshold.* (Addresses Case 3 & 6).
      *   *Requirement 5: The Harm/Constraint Boundary.* (Addresses Case 11).
      *   *Requirement 6: The Temporal Decay/Refresh.* (Addresses Case 9).
      *   *Requirement 7: The Scope of Incapacity.* (Addresses Case 10).

      *Refining for the Prompt:* The prompt asks for *my* requirements (the AI's derived desiderata), evaluating the user's cases along the way. I need to structure this as a spec.

      *Key Philosophical Tension:* The "Identity Problem." Is the demented self the *same* person as the author? If yes, P1/P4 work. If no, P2 dominates. This is the "jointly unsatisfiable" risk.

  6.  **Addressing Specific Prompt Questions:**
      *   *Prejudices:* "Last-writer-wins" (Case 6) is often a legal shortcut, not a normative truth. "Observability" is a practical constraint, not a normative one, but essential for *this* user.
      *   *Unsatisfiable Subset:* You cannot simultaneously maximize Precedent Autonomy (P1) and Current Well-being (P2) in the "Contented Patient" case (Case 2). One must yield.
      *   *Most Exclusionary Requirement:* The definition of "Competence at Origin" or the "Identity Continuity" condition.
      *   *Four Positions:* Analyze failures.

  7.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Correction:* The user wants *my* requirements document, incorporating their cases as motivation. I shouldn't just list their cases back. I need to formulate the *principles* that solve the cases.
      *   *Correction:* Ensure the "Observability" constraint is treated as a meta-requirement.
      *   *Correction:* Make sure to explicitly identify which of the user's cases are confused. (e.g., Case 8 is logically valid but practically negligible; Case 7 is an epistemic limit, not necessarily normative).
      *   *Correction:* The "Four Positions" analysis needs to be sharp. P1 fails Case 2. P2 fails Case 1 & 3. P3 is vague on implementation. P4 is metaphysically heavy.

  8.  **Finalizing the Structure:**
      *   **Section 1: Evaluation of User's Cases.** (Keep/Modify/Discard).
      *   **Section 2: Normative Requirements Document.** (The core deliverable).
      *   **Section 3: Meta-Analysis.** (Prejudices, Impossibility, Key Exclusion).
      *   **Section 4: Position Analysis.** (The four camps).
      *   **Section 5: Table.**

  9.  **Drafting Content - Key Philosophical Insights to Embed:**
      *   *Dworkin vs. Dresser:* Critical interests vs. Experiential interests.
      *   *Hard vs. Soft Paternalism:* When to override.
      *   *Epistemic Humility:* The system cannot know "true self," only proxies.
      *   *The "Ulysses" Paradox:* Binding future self requires waiving future rights to waive.

  10. **Final Review against Constraints:**
      *   Did I answer "Observability"? Yes.
      *   Did I answer "Error Asymmetry"? Yes.
      *   Is it a requirements doc format? Yes.
      *   Did I identify the unsatisfiable subset? Yes (The Contented Patient trilemma).

  *(Self-Correction on "Observability"):* The prompt asks if demanding observability is a genuine desideratum or a corruption. I need to take a stance. It is a *implementation* constraint that shapes the *normative* theory. A normative theory that cannot be observed is not a policy, it's theology. I will argue it is a genuine desideratum *for this system*, even if pure philosophy ignores it.

  *(Self-Correction on "Error Asymmetry"):* This is the "Default State." In medicine, it's usually "preserve life" unless clear evidence otherwise. In liberty, it's "freedom" unless clear evidence otherwise. For ADs, the asymmetry is usually "favor the directive" *if* validity is high, otherwise "favor life." I need to be precise here.

  *(Self-Correction on Case 8 "The Stack"):* This is a logical paradox (Quinean). In practice, legal systems cut the knot (e.g., "most recent competent document wins"). I should flag this as a place where theory yields to administrative closure.

