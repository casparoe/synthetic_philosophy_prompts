answer: |-
  # NORMATIVE CORE SPECIFICATION: ANTERIOR AUTHORITY PROTOCOL (AAP)
  **Version:** 1.0 (Draft for Policy Implementation)
  **Subject:** Authority of Anterior Instructions over Posterior Incapacitated Subjects
  **Constraint:** Bedside implementability, Review Board defensibility.

  ---

  ## 1. EVALUATION OF LOAD-BEARING CASES
  *Status of User-Provided Cases. "Keep" means the case generates a necessary requirement. "Modify" means the case is valid but misdescribed. "Discard" means the case is a prejudice or implementation detail.*

  | Case | Status | Comment |
  | :--- | :--- | :--- |
  | **1. The Baseline** | **Keep** | Necessary condition. Any theory failing this is not a theory of *advance* directives. |
  | **2. Contented Patient** | **Keep** | The critical stress test. Distinguishes "Critical Interests" (Dworkin) from "Experiential Interests" (Dresser). |
  | **3. Ulysses Case** | **Keep** | Tests the authority to waive future rights of revocation. |
  | **4. Depressed Author** | **Keep** | Tests validity conditions at $T_0$ (time of writing). |
  | **5. Drift** | **Modify** | This is a semantic interpretation problem, not purely normative. Requires an "Intent Preservation" clause. |
  | **6. The Corpus** | **Modify** | "Last-writer-wins" is a legal heuristic, not a normative truth. The requirement is "Last *Competent* Writer Wins." |
  | **7. Self-Sealing** | **Discard** | This is an epistemic/verification failure, not a normative one. A system cannot implement a trigger it cannot verify. |
  | **8. The Stack** | **Discard** | Logical paradox. In practice, administrative closure rules (e.g., "max depth = 1") override theoretical recursion. |
  | **9. The Gate** | **Keep** | Tests the temporal decay of authority. |
  | **10. Granularity** | **Keep** | Tests the definition of "Incapacity." |
  | **11. Third-Party** | **Keep** | Tests the boundary of authority (Harm Principle). |

  **Missing Cases Added:**
  *   **12. The Surrogate Conflict:** The proxy (family) disagrees with the document. (Tests whether the document binds the proxy or merely advises them).
  *   **13. The Low-Stakes Drift:** The instruction concerns minor preferences (diet, visitors) vs. life/death. (Tests whether authority scales with consequence).

  ---

  ## 2. NORMATIVE REQUIREMENTS DOCUMENT
  *Each requirement includes: Statement, Motivation (Case), Exclusion (What theory fails this), Status (Non-negotiable vs. Camp Preference).*

  ### REQ-01: Competence at Origin ($C_0$)
  *   **Statement:** An instruction possesses no authority unless the author demonstrated decision-specific capacity at the time of issuance ($T_0$).
  *   **Motivation:** Case 4 (Depressed Author). A directive born of pathology cannot bind a future self any more than a contract signed under duress.
  *   **Excludes:** Theories that treat all written statements as equally binding regardless of mental state at $T_0$.
  *   **Status:** **Non-negotiable.** (Without this, the system enables abuse).
  *   **Observable Proxy:** Clinical assessment at $T_0$ or retrospective review of medical record at $T_0$ indicating active psychosis/severe depression.

  ### REQ-02: Trigger Verifiability ($V_T$)
  *   **Statement:** A trigger condition is valid only if its satisfaction can be determined by a third party without relying on the testimony of the incapacitated subject or the beneficiary of the trigger.
  *   **Motivation:** Case 7 (Self-Sealing). "If I am no longer myself" is unverifiable if the only evidence is the patient saying "I am myself."
  *   **Excludes:** Theories that allow subjective self-report to satisfy the condition of incapacity.
  *   **Status:** **Non-negotiable.** (Implementation constraint).
  *   **Observable Proxy:** Objective clinical markers (MMSE score, specific diagnostic criteria) rather than phenomenological reports.

  ### REQ-03: The Revocation Threshold ($R_T$)
  *   **Statement:** A later revocation is valid only if the capacity required to revoke equals or exceeds the capacity required to issue the original instruction.
  *   **Motivation:** Case 3 (Ulysses). A manic patient cannot revoke a "Ulysses contract" made while competent, or the contract is useless.
  *   **Excludes:** Theories that grant absolute priority to the "current self's" expressed wishes regardless of capacity.
  *   **Status:** **Camp Preference (Precedent Autonomy).** (Current Interest theorists would reject this).
  *   **Observable Proxy:** Capacity assessment at time of revocation attempt. If $Capacity_{revocation} < Capacity_{original}$, revocation is void.

  ### REQ-04: Intent Preservation over Literalism ($I_P$)
  *   **Statement:** Where technological or situational drift occurs, the instruction must be interpreted to satisfy the *value* or *goal* stated at $T_0$, not the literal mechanism specified.
  *   **Motivation:** Case 5 (Drift). "No machines" meant ICU ventilators, not home BiPAP.
  *   **Excludes:** Strict textualism.
  *   **Status:** **Non-negotiable.** (Otherwise the system produces absurd outcomes).
  *   **Observable Proxy:** Presence of a "Statement of Values" section in the document alongside the "Specific Instructions."

  ### REQ-05: The Harm Boundary ($H_B$)
  *   **Statement:** Authority terminates where the execution of the instruction imposes significant, non-consensual harm on third parties or requires the violation of professional integrity (conscience clauses).
  *   **Motivation:** Case 11 (Third-Party Effects). You cannot direct your family into destitution or force a doctor to perform futile/illegal acts.
  *   **Excludes:** Theories of absolute sovereignty (Libertarian self-ownership).
  *   **Status:** **Non-negotiable.** (Legal and ethical floor).
  *   **Observable Proxy:** Cost thresholds, resource scarcity flags, or statutory lists of prohibited interventions.

  ### REQ-06: Temporal Decay / Refresh ($T_D$)
  *   **Statement:** Authority decays over time unless reaffirmed. The half-life of an instruction is proportional to the severity of the intervention it mandates.
  *   **Motivation:** Case 9 (The Gate). A directive written at 30 may not reflect the values of the self at 80.
  *   **Excludes:** Theories of permanent binding (Once bound, always bound).
  *   **Status:** **Camp Preference (Narrative/Character).** (Precedent Autonomy theorists often reject decay).
  *   **Observable Proxy:** Expiration dates on documents; mandatory review intervals (e.g., 5 years).

  ### REQ-07: Error Asymmetry Default ($E_A$)
  *   **Statement:** In cases of genuine ambiguity where validity cannot be established within the time window, the system must default to the preservation of biological life and bodily integrity over the execution of the instruction.
  *   **Motivation:** Constraint 2 (Error Asymmetry). It is worse to kill a patient who wanted to live than to treat a patient who wanted to die (reversibility argument).
  *   **Excludes:** Theories that treat ambiguity as license to follow the document (presumption of validity).
  *   **Status:** **Non-negotiable.** (Risk management).
  *   **Observable Proxy:** Ambiguity flag in the system; protocol triggers "Treat while reviewing."

  ---

  ## 3. META-ANALYSIS OF DESIDERATA

  ### A. Prejudices Masquerading as Desiderata
  1.  **"Last-Writer-Wins" (Case 6):** This is a legal administrative shortcut, not a normative truth. A document written during a "bad month" (Case 6) has less authority than one written during stability, even if it is newer. *Correction:* "Last-*Competent*-Writer-Wins."
  2.  **"Observability is Corruption" (Constraint 1):** You asked if demanding observability corrupts the theory. **Verdict:** No. For a system implemented by strangers under time pressure, observability *is* a normative requirement. A truth that cannot be known at the bedside is not a truth the system can act on. It is not a corruption; it is a boundary condition of the medium.
  3.  **"The Stack" (Case 8):** Worrying about infinite regress of meta-clauses is a logician's prejudice. In policy, we impose a "closure rule" (e.g., "Meta-clauses regarding revocation are invalid"). This is not a theoretical failure; it is a necessary termination of recursion.

  ### B. Jointly Unsatisfiable Requirements (The Impossibility Result)
  **REQ-02 (Contented Patient) + REQ-03 (Revocation Threshold) + REQ-07 (Error Asymmetry).**
  *   **The Conflict:** In the *Contented Patient* case (Case 2), the earlier self said "No treatment," the later self is happy (experiential interest), and the document is old (Temporal Decay).
      *   If you honor the **Earlier Self** (REQ-03), you kill a happy patient (violates Current Interest).
      *   If you honor the **Later Self** (REQ-02/Current Interest), you violate the **Earlier Self's** explicit autonomy (violates Precedent Autonomy).
      *   If you invoke **Error Asymmetry** (REQ-07) because the conflict is unresolvable, you treat, which violates the **Earlier Self**.
  *   **Conclusion:** You cannot satisfy Precedent Autonomy, Current Well-being, and Risk Aversion simultaneously. You must prioritize one. Most legal systems prioritize **REQ-07 (Risk Aversion/Preservation of Life)** when the conflict is sharp, effectively sidelining the Advance Directive unless it is hyper-specific and recent.

  ### C. The Single Most Exclusionary Requirement
  **REQ-01: Competence at Origin ($C_0$).**
  *   **Why:** This excludes the largest set of candidate theories. It excludes "Best Interest" standards that ignore the document entirely. It excludes "Family Knows Best" models that ignore the document's validity conditions. It excludes "Ulysses" contracts that do not verify capacity at signing. If you cannot establish $C_0$, the rest of the requirements are moot. It is the gatekeeper.

  ---

  ## 4. ANALYSIS OF THE FOUR POSITIONS
  *Evaluation against the Requirements Document above.*

  | Position | Description | Failure Point | Viability |
  | :--- | :--- | :--- | :--- |
  | **1. Binding Choice** | Competent choices bind full stop. | Fails **Case 2 (Contented Patient)**. It mandates killing a happy patient to satisfy a past preference. Fails **REQ-06 (Decay)**. | **Low.** Too rigid for bedside reality. |
  | **2. Current Interests** | Only the person in the bed matters. | Fails **Case 1 (Baseline)** and **Case 3 (Ulysses)**. It renders advance directives advisory only. Fails **REQ-03**. | **Low.** Defeats the purpose of the system. |
  | **3. Enduring Values** | Bind the values, not the specific list. | Fails **Observability**. How does a stranger know the "true value" vs. a specific instruction? High risk of interpreter bias. | **Medium.** Good for interpretation (Case 5), bad for enforcement. |
  | **4. Life Authorship** | Earlier self authors the life narrative. | Fails **REQ-05 (Harm Boundary)**. Assumes a metaphysical continuity of self that may not exist (Dworkin vs. Dresser). Hard to defend to family. | **Medium.** Philosophically robust, operationally difficult. |

  **Missing Position:**
  *   **5. The Procedural/Validity Model.** This is the engineer's position. It does not ask *which* self is right. It asks: *Was the procedure followed?* (Capacity at $T_0$, proper witnessing, specific trigger met, no coercion). If the procedure is valid, the instruction stands. If not, it defaults to Best Interest. This aligns best with **REQ-01** and **REQ-07**.

  ---

  ## 5. DISTINCTIONS CORRECTION
  *You asked to correct your list of distinctions.*

  1.  **Authority vs. Weight:** Correct. Authority is binary (valid/invalid); Weight is scalar (how much it influences a gray-area decision).
  2.  **Instruction vs. Values:** Correct. Instructions are commands; Values are interpretive keys.
  3.  **Binding vs. Evidence:** Correct. This is the core legal/ethical fight.
  4.  **Revocation vs. Supersession:** **Correction Needed.** *Supersession* implies a new document replaces an old one. *Revocation* implies the act is cancelled with no replacement. In software terms: Supersession = `UPDATE`; Revocation = `DELETE`.
  5.  **Satisfied vs. Verifiable:** **Critical.** This is your most important distinction for system design. A trigger can be metaphysically satisfied (patient *is* demented) but epistemically unverifiable (no doctor available to diagnose). **Your system must only act on the Verifiable.**

  ---

  ## 6. FINAL RECOMMENDATION FOR SYSTEM LOGIC

  Do not attempt to solve the metaphysical problem of personal identity. Implement the **Procedural/Validity Model** with a **Risk-Averse Default**.

  1.  **Ingest:** Store Document + Metadata (Date, Witness, Capacity Assessment if available).
  2.  **Validate:** Check $C_0$ (REQ-01). Check Expiry (REQ-06).
  3.  **Trigger:** Check Verifiability (REQ-02). If trigger is subjective ("If I am unhappy"), flag as **Non-Actionable**.
  4.  **Conflict:** If Current Self objects, check Capacity. If Incapacitated, Honor Document (REQ-03). If Capacitated, Honor Current Self.
  5.  **Ambiguity:** If any check fails, Default to Treatment/Preservation (REQ-07).

  **Table: Position Scoring Against Requirements**

  | Requirement | Binding Choice | Current Interests | Enduring Values | Life Authorship | **Procedural (Recommended)** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **REQ-01 (Competence)** | Pass | Fail | Pass | Pass | **Pass** |
  | **REQ-02 (Verifiability)** | Pass | Pass | Fail | Fail | **Pass** |
  | **REQ-03 (Revocation)** | Pass | Fail | Pass | Pass | **Pass** |
  | **REQ-06 (Decay)** | Fail | Pass | Pass | Pass | **Pass** |
  | **REQ-07 (Error Default)** | Fail | Pass | Pass | Pass | **Pass** |
  | **Bedside Implementable** | No | Yes | No | No | **Yes** |
