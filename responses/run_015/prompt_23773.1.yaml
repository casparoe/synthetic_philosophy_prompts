answer: |-
  This is a classic interpretive crux in Hume scholarship, so first, take heart: you are grappling with one of the most debated tensions in his moral theory. If you were finding this easy, I'd be worried you were missing the nuance.

  However, your classmate is right: Hume absolutely insists that artificial virtues are genuine moral virtues. The disconnect you're feeling stems from conflating the **genesis** of the convention with the **psychological mechanism** of moral approval. You are also interpreting "utility" in a narrow, act-utilitarian or prudential sense, whereas Hume operates with a systemic view of utility mediated by sympathy.

  Let's walk through where the "prudential reduction" interpretation goes wrong and how Hume bridges the gap between convention and moral obligation.

  ### 1. Artificial $\neq$ Optional or Fake
  First, a quick terminological check. When Hume calls fidelity to promises "artificial," he does not mean "fake," "arbitrary," or "merely strategic." He means it is **constructed** to solve a specific coordination problem that nature did not solve for us.

  *   **Natural virtues** (benevolence, gratitude) arise from instinctive sentiments we have independently of social agreements.
  *   **Artificial virtues** (justice, fidelity, allegiance) arise from a convention—a slow-developing agreement to restrain our liberty for mutual security.

  The "artificiality" refers to the *origin* of the rule, not the *force* of the obligation. Once the convention is established, it commands the same moral sentiment as natural virtues.

  ### 2. The Genesis vs. The Sanction (The Crucial Distinction)
  Your main worry is: *If the practice is founded on interest/utility, isn't the obligation just prudence (fear of reputational cost)?*

  Hume's answer is **no**, and this is where you need to separate two stages in his account:

  1.  **The Origin of the Convention:** You are correct that the *invention* of promising is driven by self-interest. In the *Treatise* (3.2.2), Hume argues that in a "state of nature," there is no motive to keep a promise. If I promise you, my natural self-interest might dictate breaking it if I can get away with it. We invent the *rule* of fidelity because we realize that a system of exchange is more useful than a free-for-all.
  2.  **The Moral Sentiment:** Once the convention is established, our *approval* of it does not rest on a calculation of our own immediate self-interest. It rests on **sympathy with the public interest.**

  Here is the pivot: For Hume, moral distinctions are derived from sentiment. We feel approval toward character traits that are useful or agreeable to self or others. With artificial virtues, the "usefulness" is systemic. When I observe a person keeping a promise, I do not necessarily calculate, "This benefits me." Instead, via **sympathy**, I enter into the pleasure that this action causes the society and the participants. That feeling of pleasure *is* the moral approval.

  ### 3. Utility $\neq$ Prudence
  You wrote: *"Utility sounds so prudential to me... we only keep promises to avoid the social costs."*

  This is the category error.
  *   **Prudence** is: "I should keep this promise because if I don't, *I* will suffer (reputation loss, retaliation)."
  *   **Humean Moral Virtue** is: "I approve of promise-keeping because the *practice* is useful to society, and I sympathize with that social good."

  Hume explicitly addresses the "sensible knave" (in the *Enquiry*) and the secret violator (in the *Treatise*). He argues that if morality were just fear of reputational damage, we would not feel blame when a promise is broken in secret, where no reputation is lost. But we *do* feel it is wrong. Why? Because we view the action from the **General Point of View**.

  We correct our sentiments. We don't judge the virtue based on whether *this specific instance* of promise-keeping helps me right now. We judge it based on whether the *general practice* is conducive to human flourishing. When I break a promise, even secretly, I violate a rule that I know is essential for social cohesion. My sympathy with the public good generates an internal sentiment of unease (blame), independent of external punishment.

  ### 4. How the Obligation Becomes "Binding"
  You asked: *"Why does anyone treat promise-keeping as a genuine moral requirement rather than a strategic rule?"*

  For Hume, the "binding force" is a psychological fact, not a metaphysical one. It works like this:
  1.  **Education and Socialization:** Because the convention is so vital, society inculcates a horror of promise-breaking in children before they understand the utility. (Hume admits this is a bit of a "trick" played by politicians and parents).
  2.  **Internalization:** Over time, the act of breaking a promise causes immediate pain (shame/guilt) because we have associated it with vice.
  3.  **The Sentiment of Obligation:** The "obligation" just *is* that sentiment of blame we feel upon violating the rule. It is not a rational command; it is a felt constraint.

  So, it is not that we keep promises *because* we fear reputation (that would be prudence). It is that we *feel morally bound* because our sentiment has been calibrated to approve of the system. The fear of reputation is an external reinforcement, but the moral obligation is the internal sentiment.

  ### 5. Where You Might Be Stuck (The Normative Gap)
  As a PhD student, you might be pressing a normative question that Hume thinks is a category mistake. You might be asking: *"But why **ought** I to be moral if I can get away with it?"*

  Hume's response is essentially: *"If you don't feel the sentiment, you aren't vicious, you're just psychologically abnormal or unreachable by sympathy."* He is descriptive of moral psychology, not prescriptive in a rationalist sense.

  However, to answer your specific worry about the "genuine moral obligation":
  For Hume, a "genuine moral obligation" **just is** a sentiment of approval/disapproval arising from the general point of view regarding utility. If you are looking for a rationalist, categorical imperative that binds independent of human sentiment, you won't find it in Hume. But if you accept his sentimentalist framework, the obligation is genuine because it is rooted in our shared humanity (sympathy), not just our individual calculation of gain.

  ### Summary of the Correction
  1.  **Origin vs. Validation:** Interest creates the convention; Sympathy creates the moral virtue.
  2.  **Systemic Utility:** We approve of the *scheme* of promises, not just the individual payoff.
  3.  **General Point of View:** We judge the virtue based on social good, stripping away our immediate self-interest.
  4.  **Internal Sanction:** The "binding force" is the feeling of guilt/shame, not just the fear of external reputational loss.

  ### Suggested Reading to Unstick You
  If you haven't already, I recommend looking closely at:
  *   **Treatise 3.2.2 ("Of the origin of justice and property")** and **3.2.5 ("Of the obligation of promises")**. Specifically, look for his argument that there is no natural motive to keep a promise (the circularity argument), which forces the artificial conclusion.
  *   **Annette Baier, "Artificial Virtues and the Sensible Knave."** She tackles exactly your worry about whether the knave can opt out.
  *   **David Gauthier, *The Social Contract of David Hume*.** (Though be warned, Gauthier reads Hume as more of a contractarian than many others).
  *   **Jacqueline Taylor, "Justice and the Foundations of Social Morality in Hume's Treatise."** She does excellent work on how the general point of view transforms interest into morality.

  You aren't wrong that the *foundation* is interest. You are just stopping one step too soon. Hume's genius is explaining how that interest is transmuted, via sympathy and convention, into a moral sentiment that feels distinct from mere prudence.
