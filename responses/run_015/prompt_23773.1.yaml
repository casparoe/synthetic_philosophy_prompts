      *   *Refining the "Utility" point:* I need to make sure they understand that for Hume, *moral* approval is defined by utility pleasing us via sympathy. It's not "I keep it because it pays," it's "I approve of it because the system pays, and I sympathize with that."
      *   *Refining the "Obligation" point:* Hume distinguishes between the *interest* that creates the convention and the *sentiment* that enforces it morally. The "binding force" is the feeling of blame, not just the external consequence.

