answer: |-
  You have put your finger on a genuine and persistent methodological rot in popular evolutionary discourse. You are correct that this is not simply a restatement of Gould and Lewontin's 1979 critique. Their target was *pan-adaptationism* (the assumption that everything is an adaptation). Your target is *pan-skepticism* (the assumption that nothing is an adaptation, or that "not an adaptation" is a complete explanation).

  There is no single, canonical phrase in the literature for the first pattern you describe, though it is frequently discussed under the headers of "burden of proof" or "null hypothesis specification." Since you asked for a term to help your group carve this distinction, I propose we call it **The Bare Spandrel Move**.

  Below is the carving you requested: the definition, the discrimination between honest and lazy uses, the boundary cases, and a treatment of the second wrinkle regarding current function.

  ### 1. The First Pattern: The Bare Spandrel Move

  **Definition:**
  The Bare Spandrel Move occurs when a speaker asserts that a trait is a byproduct (spandrel) of selection on *some other* trait, but fails to specify:
  1.  **The Primary Trait:** What *was* actually selected for?
  2.  **The Coupling Mechanism:** Why does selection on the primary trait *necessarily* or *probabilistically* drag this specific byproduct along? (Is it genetic linkage, developmental constraint, physical necessity?)
  3.  **Falsification Conditions:** What evidence would convince the speaker that the trait *is* an adaptation?

  **Why it is distinct from Gould & Lewontin:**
  Gould and Lewontin argued that adaptationists were writing "Just-So Stories" (plausible but untested narratives). The Bare Spandrel Move is the mirror image: it is a "Just-So Non-Story." It relies on the logical fallacy of **Argument from Ignorance** (*ad ignorantiam*): "You have not proven this is an adaptation; therefore, it is a byproduct." It treats "byproduct" as a default setting that requires no positive evidence, only the negation of the rival claim.

  **Honest vs. Lazy Byproduct Claims:**
  To discriminate between a legitimate scientific hypothesis and a conversation-stopper, apply this three-part test to the byproduct claim:

  | Feature | **Honest Byproduct Claim** | **Bare Spandrel Move (Lazy)** |
  | :--- | :--- | :--- |
  | **Alternative Target** | Names the specific trait that *was* selected (e.g., "Large brain size"). | Vague reference to "evolution" or "complexity." |
  | **Constraint** | Describes the architectural link (e.g., "Bone density increases with size due to biomechanics"). | Asserts a link without mechanism (e.g., "It's just a structural consequence"). |
  | **Risk** | Admits what would disprove it (e.g., "If we find the trait varies independently of the primary trait"). | Treats the claim as unfalsifiable or immune to evidence. |

  **Boundary Cases:**

  *   **Just Inside (The Bare Spandrel):**
      *   *Claim:* "The human chin is not an adaptation; it's just a structural byproduct of jaw shortening."
      *   *Critique:* This is a Bare Spandrel unless the speaker explains *why* jaw shortening mechanically necessitates a protruding chin (rather than a recessed one or a vertical slope) and identifies what selected for the jaw shortening. Without that, "structural byproduct" is just a magic phrase.
  *   **Just Outside (Honest Byproduct):**
      *   *Claim:* "Male nipples are byproducts of sexual differentiation."
      *   *Why it passes:* The primary trait is specified (the default embryonic template for mammals). The constraint is specified (sexual differentiation happens late in development; nipples form early). The falsification is clear (if we found a mammal where males and females developed entirely separate embryonic templates from conception).
  *   **Just Outside (Honest Adaptation):**
      *   *Claim:* "Music is an adaptation for social bonding."
      *   *Why it passes:* Even if debatable, this posits a specific selective pressure and a function. It is not a Bare Spandrel because it offers positive content, whereas the Bare Spandrel offers only negation.

  ### 2. The Second Wrinkle: The Exaptation Slide

  You asked if the confusion between "currently useful" and "historically selected" is part of the same pattern. It is related but distinct. It is a logical error regarding time and causality.

  **The Concept:**
  This is the **Adaptation/Exaptation Conflation**.
  *   **Adaptation:** A trait shaped by natural selection *for* its current function.
  *   **Exaptation:** A trait that currently performs a function but was originally selected for something else (or nothing).

  **The Error:**
  The error is inferring history from current utility. It takes the form: "Trait T does X. X is useful. Therefore, T was selected for X."
  This is a **Converse Error**. (If it was selected for X, it would be useful for X. It is useful for X. Therefore, it was selected for X.)

  **How it relates to the Bare Spandrel:**
  Often, a Bare Spandrel Move is used to block an adaptationist claim ("Music isn't an adaptation!"), and then, once the trait is shown to be useful, the speaker slides into the Adaptation/Exaptation Conflation ("Well, it's useful for bonding, so it must be an adaptation after all").
  *   **Correction:** A trait can be a byproduct in origin (spandrel) and *later* become useful (exaptation). Showing current utility does not refute the byproduct claim, nor does it prove the adaptation claim. It simply proves the trait is *maintainable*.

  **Example for your group:**
  *   *Feathers:* Originally selected for insulation (or display), later co-opted for flight.
  *   *The Mistake:* Saying "Feathers are for flight" (ignores history) OR saying "Feathers aren't for flight because they started as insulation" (ignores current maintenance).
  *   *The Newsletter Point:* Current utility is evidence for *why a trait stays*, not necessarily *why it arrived*.

  ### 3. Summary for your Newsletter

  If you need a tight summary for your readers, you might frame it this way:

  > "In our discussions, we must guard against two opposite vices. The first is the 'Just-So Story,' where every trait is assumed to be a direct solution to a survival problem. The second, which we see less often named, is the 'Bare Spandrel.' This occurs when we dismiss an adaptive explanation not by offering a better causal history, but by simply asserting the trait is a 'byproduct' without naming what it is a byproduct *of*.
  >
  > A legitimate byproduct claim is just as hard to make as an adaptive one: it requires naming the original target of selection and the mechanical link that dragged the new trait along. If a claim cannot be falsified, or if it relies on our current ignorance as proof ('You can't prove it's adaptive, so it's not'), it is not science; it is a conversation-stopper. Furthermore, we must remember that a trait can be useful now without having been designed for that use. Utility is not history."

  ### 4. A Note on the "Null Hypothesis"

  You mentioned that treating drift or constraint as a null hypothesis is respectable. It is. But in statistics, a null hypothesis is specific (e.g., "the mean difference is zero"). In evolutionary biology, a proper null hypothesis is not "it's not an adaptation." It is "the trait distribution is consistent with genetic drift" or "the trait is a fixed consequence of phylogeny."
  The **Bare Spandrel Move** fails because it invokes the *authority* of a null hypothesis without doing the *work* of a null hypothesis. It wants the benefit of the doubt without the burden of modeling.

  ### Recommendation for the Group

  When this pattern arises in your reading group, I suggest asking three specific questions of the person making the byproduct claim:
  1.  "What trait *was* selected for?"
  2.  "What is the developmental or genetic link that forces this byproduct to appear?"
  3.  "What finding would make you change your mind?"

  If they cannot answer these, they are not offering a scientific alternative; they are merely expressing a preference for skepticism. That is a valid philosophical stance, but it should not be dressed up as an evolutionary explanation.
