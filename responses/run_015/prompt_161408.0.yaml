answer: |-
  This is a precise and well-constructed problem. The tension you identify in your seminar—between the *metaphysical ground* of thought (the soul) and the *empirical criterion* for thought (language/universal reason)—is the central fault line in Cartesian scholarship on animal minds. Descartes often slides between them, which allows your track record to be reconstructed in more than one way.

  Here is the reconstruction you requested, adhering to your constraints regarding the immortality argument and the admission of "no verdict."

  ### I. The Primary Rule: Ontological Essentialism

  This reconstruction takes Descartes' dualism seriously as the foundation. The behavioral tests are diagnostic tools for identifying a hidden metaphysical reality, not the definition of thought itself.

  **The Rule:**
  1.  **Constitutive Condition (C1):** Thought exists if and only if there is an immaterial rational soul (*res cogitans*) united to the entity.
  2.  **Binary Constraint (C2):** The rational soul is indivisible; it does not admit of degrees. An entity either possesses it wholly or not at all.
  3.  **Evidentiary Test (E1):** The primary *evidence* for C1 is the flexible, creative use of arbitrary signs (language) to declare thoughts about things absent or abstract, rather than merely signaling immediate impulses.
  4.  **Evidentiary Test (E2):** The secondary *evidence* for C1 is "universal reason"—the ability to adapt to novel contingencies that cannot be explained by the predetermined disposition of bodily organs.
  5.  **Species Presumption (P1):** Membership in the human species is sufficient warrant to affirm C1 even if E1 and E2 are temporarily obscured (e.g., infancy, fainting, madness), because the defect is judged to be in the bodily instrument, not the soul.
  6.  **Mechanical Exclusion (P2):** If a behavior can be fully explained by the disposition of organs (instinct, training, clockwork), it is evidence *against* C1, regardless of complexity.

  **Distinction:**
  *   **Constitutive:** C1 & C2. (What thought *is*).
  *   **Evidentiary:** E1 & E2. (How we *know* it is there).
  *   **Heuristic:** P1 & P2. (How we resolve ambiguity).

  **Why this fits the track record:**
  It explains why the parrot (1) and ape (3) fail (they lack C1, evidenced by failure of E1/E2). It explains why the infant (6) and madman (5) pass (P1 overrides failure of E1). It explains why God (9) passes (C1 without body). It explains why the clockwork (7) fails (P2).

  ---

  ### II. The Alternative Rule: Functional Capacity

  This reconstruction treats the "rational soul" as the *explanation* for a specific functional capacity, rather than the definition. Here, thought is defined by what it *does*, and the soul is inferred as the necessary cause. This highlights the underdetermination: does Descartes deny thought to beasts because they lack a soul, or because they lack the capacity (which implies a soul)?

  **The Rule:**
  1.  **Constitutive Condition (C1*):** Thought is the capacity for indefinite adaptability expressed through arbitrary signs. (It is the power of the "universal instrument").
  2.  **Binary Constraint (C2*):** This capacity is threshold-based. Partial success (doing one thing well) is mechanical; only the ability to do *anything* reason demands counts.
  3.  **Evidentiary Test (E1*):** Performance of linguistic combination regarding absent objects.
  4.  **Species Boundary (P1*):** This capacity is naturally exclusive to human beings. No non-human organism possesses the physiological or metaphysical potential for C1*.
  5.  **Latency Clause (P2*):** Possession of C1* is presumed in humans even during periods of non-performance (infancy), provided the bodily organs are of the right kind to eventually express it.

  **Distinction:**
  *   **Constitutive:** C1*. (Thought *is* the capacity).
  *   **Evidentiary:** E1*. (Performance proves capacity).
  *   **Heuristic:** P1* & P2*. (Species determines who gets the capacity).

  **Why this fits the track record:**
  It fits all 10 verdicts equally well *so long as* the species boundary holds. It explains the beast-machine doctrine not by starting with "no soul," but by starting with "no capacity for universal reason." The soul is then posited as the only thing that *could* explain the capacity in humans.

  ---

  ### III. Adjudication of New Cases

  Here is where the rules diverge. The Ontological Rule relies on *what the thing is*; the Functional Rule relies on *what the thing does* (constrained by species).

  **(a) An ape taught arbitrary signs, using them in novel combinations for absent objects.**
  *   **Ontological Rule:** **No Thought.** The ape lacks the immaterial substance (C1). The behavior, however impressive, must be re-interpreted as complex mechanical disposition (P2). The "species boundary" is metaphysical, not behavioral.
  *   **Functional Rule:** **Thought (or Rule Failure).** If the ape truly demonstrates indefinite adaptability and arbitrary sign use (C1*), it meets the constitutive definition. The rule forces a choice: either admit the ape thinks, or admit P1* (Species Boundary) is false.
  *   **Divergence:** Rule 1 protects the metaphysics by re-describing the behavior. Rule 2 forces a revision of the metaphysics based on the behavior.
  *   **Best Guess:** Descartes would stick with **No Thought**. In his letters to Newcastle and More, he insists that even if a magpie speaks, it is like a clock striking the hour. He prioritizes the metaphysical category over the behavioral anomaly.

  **(b) A machine that responds appropriately to anything said, satisfying both tests (E1 & E2).**
  *   **Ontological Rule:** **No Verdict (Metaphysically Impossible).** Descartes explicitly claims this is impossible (Verdict 7). A machine is *res extensa*; thought is *res cogitans*. If such a machine existed, Descartes' ontology is false. He owes no verdict within his system because the premise contradicts his substance dualism.
  *   **Functional Rule:** **Thought.** If thought is defined by the capacity (C1*), and the machine demonstrates the capacity, it thinks. The "soul" would then be an unnecessary hypothesis or attributed to the machine.
  *   **Divergence:** Rule 1 says the case is impossible. Rule 2 says the case decides the verdict.
  *   **Best Guess:** **No Verdict.** Descartes treats the impossibility of such a machine as a proof of the soul's existence. To ask him to adjudicate the case is to ask him to abandon his first principles.

  **(c) A human child raised with no language and no flexible behavior (Feral Child).**
  *   **Ontological Rule:** **Mind.** P1 (Species Presumption) applies. The soul is present; the lack of expression is due to the "disordered disposition of organs" (lack of social/linguistic training acting as a bodily constraint).
  *   **Functional Rule:** **Mind (by Presumption).** P2* (Latency Clause) applies. We presume the capacity exists because it is a human, even if unexpressed.
  *   **Divergence:** **None.** Both rules yield "Mind," but for different reasons. Rule 1 says the substance is there. Rule 2 says the potential is there by species fiat.
  *   **Best Guess:** **Mind.** Both rules align with Verdict 6 (Infant).

  **(d) A being with no body, no organs, and no behavior.**
  *   **Ontological Rule:** **Mind.** Verdict 9 (Angels/God). C1 does not require a body. Thought is the essence of the substance.
  *   **Functional Rule:** **No Verdict / Ambiguous.** C1* defines thought as a *capacity* for adaptability/signs. Without a body or behavior, the capacity cannot be manifested or evidenced. Unless the rule is amended to allow "disembodied capacity," it cannot verify thought.
  *   **Divergence:** Rule 1 handles disembodiment easily. Rule 2 struggles because its definition is tied to functional expression.
  *   **Best Guess:** **Mind.** Descartes is clear on angels. This suggests Rule 1 is closer to his core commitment than Rule 2.

  **(e) A colony of insects solving problems collectively via signaling.**
  *   **Ontological Rule:** **No Thought.** Insects are beasts/machines. Collective action is just a larger clockwork (P2). No single soul, no thought.
  *   **Functional Rule:** **No Thought.** The behavior is specialized (P2* / Verdict 8). They solve *one* type of problem (nest building, foraging) via fixed signals, not "universal reason."
  *   **Divergence:** **None.** Both yield "No Thought."
  *   **Best Guess:** **No Thought.** Fits Verdict 8 (Machine that does one thing superlatively).

  ---

  ### IV. The Decisive Case

  You suspected the decisive case involves asserting something about an absent object and correcting oneself. You are correct. The single case that most sharply separates the rules is:

  **A non-human creature that makes a false assertion about an absent object and then corrects it.**

  *   **Example:** A chimpanzee signs "Apple is on Table." The table is checked; it is empty. The chimpanzee then signs "No, Apple is in Box."
  *   **Why this separates the rules:**
      *   **Signaling vs. Asserting:** Mere signaling (hunger, danger) can be causal/mechanical (stimulus -> response). Asserting truth claims involves a relation between sign and world that is independent of immediate impulse.
      *   **Error and Correction:** A machine (or mechanical beast) acts from the disposition of its organs. It cannot "fail" to match the world unless the mechanism breaks. To *recognize* a mismatch and *correct* the sign requires an awareness of the sign *as a sign* and the world *as independent*.
      *   **Rule 1 (Ontological):** Will still deny thought. It will argue the correction is a new mechanical sequence triggered by the visual stimulus of the empty table. The "falsity" is only in the observer's mind, not the ape's.
      *   **Rule 2 (Functional):** This is the hardest case to dismiss. If the creature understands *truth conditions*, it possesses "universal reason." Rule 2 is forced to admit thought or admit that "universal reason" is not the true criterion.

  **Best Guess:** Descartes would deny thought here (aligning with Rule 1). In his letter to Morus (1649), he concedes that animals have "imagination" and can sense things, but denies they have *intellection*. He would classify the correction as a re-calibration of the mechanical imagination, not a rational judgment of truth.

  ### V. Constraints and Limitations

  **1. The Immortality Argument**
  I have kept this separate as requested. The argument that "beasts have no immortal souls, therefore they do not think" is a theological consequence in Descartes, not the primary premise of the beast-machine doctrine.
  *   **If dropped:** None of the verdicts in the track record change. Descartes argues from behavior/metaphysics to the nature of the soul, not vice versa. He does not say "They must be machines because otherwise they would be immortal"; he says "They are machines because they lack language, therefore they have no immortal soul."
  *   **Impact:** Removing the immortality constraint strengthens the **Functional Rule**. Without the theological need to separate human and beast souls, the behavioral evidence (E1) becomes the primary driver. However, the **Ontological Rule** remains stable because it relies on substance dualism, not just eschatology.

  **2. Where the Apparatus Yields No Verdict**
  *   **Case (b) (The Super-Machine):** As noted, Descartes' system yields **no verdict** here because he considers the case metaphysically impossible. He claims it is *inconceivable* that a machine could pass the tests. To ask him to judge a passing machine is to ask him to judge a contradiction in terms (Extended Substance thinking).
  *   **Case (d) (Disembodied No Behavior):** While he admits angels think, his *behavioral tests* (E1/E2) yield no verdict. He relies entirely on revelation/metaphysics here. If we were restricted strictly to the behavioral rules derived from the *Discourse*, we would have to say "No Verdict."

  **Summary for your Paper:**
  Your seminar's disagreement likely stems from conflating Descartes' *criterion for knowledge* (how we tell) with his *condition for existence* (what it is).
  *   If you treat the linguistic test as **constitutive**, you are forced into the **Functional Rule**, which struggles with infants and angels.
  *   If you treat the linguistic test as **evidentiary**, you adopt the **Ontological Rule**, which saves the infants and angels but renders the beast-machine doctrine immune to empirical refutation (as in the Ape case).
  *   Descartes ultimately prefers the **Ontological Rule**. The behavioral tests are there to convince *us*, not to define the reality. The reality is determined by the substance, which is determined by God's creation of distinct species.
