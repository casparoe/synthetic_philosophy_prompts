  5.  **Applying Rules to New Cases (a-e):**

      *   *(a) Signing Ape:*
          *   Rule 1: Still no soul (species boundary). Signs might be sophisticated conditioning (organ disposition). Verdict: No thought.
          *   Rule 2: If it truly combines signs creatively for absent objects (not taught), it passes the functional test. Verdict: Thought (or at least, the test is failed by the rule).
          *   *Conflict:* Rule 1 relies on species/substance; Rule 2 relies on performance.

      *   *(b) Super-Machine (Turing Test precursor):*
          *   Rule 1: Impossible. Machines are extended substance. No soul can unite with it. Verdict: No thought (and the premise is metaphysically impossible for Descartes).
