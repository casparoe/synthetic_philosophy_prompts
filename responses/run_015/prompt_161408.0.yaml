      *   *Let's stick to the "Substance vs. Capacity" distinction.*
      *   **Rule A (Metaphysical Essentialism):** Thought is the attribute of a specific substance (*res cogitans*). Presence of substance = Thought. Behavioral tests are heuristic for identifying the substance in ambiguous cases.
