          *   Decomposition: $Brier = Calibration + Refinement$. (Actually, usually it's $Brier = Uncertainty - Resolution + Calibration$, or $Brier = Calibration + Refinement$ where Refinement = Uncertainty - Resolution).
          *   *Crucial Point:* Lower Brier score is better.
          *   *Calibration:* Measures if events assigned probability $p$ happen with frequency $p$.
          *   *Refinement (Resolution):* Measures how much the forecasts differ from the base rate based on specific information. High refinement means you are distinguishing between cases that will happen and cases that won't.
      *   *User's Error:* The user thinks they should *maximize* calibration. But in the Brier decomposition, you want to *minimize* the Brier score.
          *   Calibration term: You want this low (perfect calibration = 0).
          *   Refinement term: You want this *low* as well (in the Murphy decomposition, Refinement is often defined as $E[c(1-c)]$, which is minimized by extreme probabilities, *but* usually, the decomposition is framed as $Brier = Calibration + Refinement$. Wait, let's check the sign convention).
