          *   The user says: "Refinement just measures how spread out or extreme your numbers are, which sounds like a stylistic choice to me." -> **This is the critical mistake.** Refinement (often called Resolution) measures *informativeness*. If you always say 50%, you have no resolution. If you say 0% or 100% correctly, you have high resolution.
