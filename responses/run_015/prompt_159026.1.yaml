      *   *Brier Decomposition:* The user is referring to the Murphy decomposition (or similar). $Brier = Calibration + Refinement + Uncertainty$ (sometimes Uncertainty is separated, sometimes Refinement includes Resolution). Let's stick to the standard Calibration-Refinement decomposition.
