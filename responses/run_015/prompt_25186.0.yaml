answer: |-
  You have identified a genuine and structurally significant pattern in the literature, but to answer your primary question directly: **No, there is no single, canonical technical term for this specific dialectical structure.**

  While the debate itself is universally referred to as the **"Equality of What?" debate** (following Sen's 1979 Tanner Lecture) or the **"Currency of Egalitarian Justice"** debate, the *iterative logical movement* you describe—the specific sequence of proposal, counterexample based on heterogeneity, and categorical shift—does not have a standardized name like "The Transcendental Argument" or "The Veil of Ignorance."

  Scholars typically describe it descriptively (e.g., "the shift from resources to capabilities," "the welfare vs. resources objection," "the expensive tastes critique"). However, given the precision of your observation, it warrants a specific label. If one were to formalize this structure in meta-political philosophy, the most accurate term would be **"The Egalitarian Currency Regress"** or **"The Metric Dialectic."**

  Here is an analysis of why this structure is distinct from the other philosophical spirals you mentioned, and how best to characterize it.

  ### 1. Proposed Terminology: "The Egalitarian Currency Regress"

  If you need a term to use in your own work, **"The Egalitarian Currency Regress"** is the most precise fit. It captures three essential features:
  1.  **Subject:** It is specific to egalitarian justice (not justice generally).
  2.  **Object:** It concerns the *currency* (or metric/space) of distribution.
  3.  **Structure:** It is a *regress* in the sense that each solution generates a new problem that pushes the locus of evaluation further "downstream" (from means to ends) or "upstream" (to responsibility conditions), without an obvious stopping point internal to the logic.

  Some scholars implicitly refer to this as the **"Problem of Intermediate Goods."** The dialectic demonstrates that any currency chosen (income, resources, welfare) turns out to be merely an *intermediate* good relative to the ultimate egalitarian concern (status, freedom, advantage), forcing a shift to the next link in the chain.

  ### 2. Distinction from Other Philosophical Structures

  You asked how to distinguish this from a skeptical regress, a Sorites sequence, or a standard objection-and-refinement spiral. The distinctions are sharp and important.

  #### A. Vs. The Skeptical Regress (The Münchhausen Trilemma)
  *   **Skeptical Regress:** The goal is *destructive*. It aims to show that justification is impossible (e.g., every reason requires a further reason, ad infinitum). The conclusion is typically suspension of judgment or foundationalism.
  *   **Currency Regress:** The goal is *constructive*. The participants are not trying to prove that equality is impossible; they are trying to locate the *correct* object of equality. The regress is a heuristic tool to refine the theory, not to dismantle it. It stops not because justification fails, but because a theorist posits a "stopping point" (e.g., Capabilities, Access to Advantage, or Relational Status) that they claim is normatively fundamental.

  #### B. Vs. The Sorites Paradox
  *   **Sorites:** Relies on *vagueness* and *degree*. It argues that small, imperceptible changes accumulate to a categorical difference (the heap problem).
  *   **Currency Regress:** Relies on *categorical inadequacy*. The move from Income to Resources to Welfare is not a matter of degree (adding more income); it is a change in the *ontological category* of the good being measured. The objection is not that the boundary is fuzzy, but that the category itself is the wrong *kind* of thing to track moral equality (e.g., resources are the wrong *kind* of thing because they ignore conversion factors).

  #### C. Vs. Standard Objection-and-Refinement (Reflective Equilibrium)
  *   **Reflective Equilibrium:** Typically involves tweaking parameters *within* a framework to achieve coherence between principles and intuitions. (e.g., adjusting the tax rate to better match the difference principle).
  *   **Currency Regress:** Involves **abandoning the framework**. When Dworkin moves from welfare to resources, or Sen moves from resources to capabilities, they are not refining the metric; they are rejecting the *space* in which the metric operates. It is a series of *paradigm shifts* rather than parameter adjustments.

  ### 3. The Engine of the Dialectic: Compensation vs. Responsibility

  If you are naming this structure, it is helpful to identify the *engine* that drives the iteration. The regress is powered by the tension between two competing egalitarian commitments:
  1.  **The Compensation Principle:** Mitigate unchosen disadvantages (disabilities, bad luck, low conversion factors).
  2.  **The Responsibility Principle:** Hold agents accountable for chosen preferences (expensive tastes, ambition, effort).

  The dialectic moves because every currency $C_n$ is shown to violate one of these principles:
  *   **Income/Resources:** Violates Compensation (ignores disability/needs).
  *   **Welfare:** Violates Responsibility (compensates expensive tastes).
  *   **Opportunity for Welfare:** Violates Compensation (ignores that some lack the capacity to form opportunities).

  The regress continues until a theorist finds a currency that purportedly balances these two, or (as Anderson does) argues that the tension itself is a product of a flawed "distributive paradigm."

  ### 4. The "Exit Condition" (Why it isn't infinite)

  A key feature of this dialectic in the literature is that it does not actually cycle infinitely. It reaches a **terminating condition** when a theorist changes the *question* rather than the *currency*.

  *   **Elizabeth Anderson** stops the regress by arguing that the goal of equality is not distribution of goods at all, but **Relational Equality** (ending oppression, establishing democratic relations). This dissolves the currency problem.
  *   **Samuel Scheffler** similarly argues for **Social Equality** as a status rather than a distributive share.
  *   **Inamori/Cohen** attempt to stop it at **Access to Advantage**, claiming this is the "invariant" that balances responsibility and compensation.

  Therefore, the structure is technically a **"Convergent Dialectic with a Paradigm-Shift Exit."** It looks like a regress, but it functions as a funnel toward a specific set of "final" currencies (Capabilities, Advantage, Relations).

  ### Summary Recommendation

  If you are writing about this, you can confidently state:

  > "While the 'Equality of What?' debate is well-trodden, the specific iterative structure driving the shift from income to resources to welfare to capabilities lacks a canonical name. I will refer to this as **The Egalitarian Currency Regress**. Unlike a skeptical regress, this structure is constructive, driven by the tension between compensation for unchosen disadvantage and responsibility for chosen preferences. Unlike a Sorites sequence, the movement involves categorical shifts in the metric of justice rather than gradations of degree."

  This accurately captures the phenomenon you've isolated without conflating it with distinct logical structures.
