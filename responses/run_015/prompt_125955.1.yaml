  **Moral Luck**
  **Does this commit her to luck-dependent moral worth?**
  **Yes.** If Dana receives "No Worth" because of the clerical error (a piece of constitutive or circumstantial luck regarding what information prompted her hand), then moral worth is luck-dependent. Had the sheet been correct (good luck), she might have received "Second-Rate" worth (like the Treasurer). Had the sheet been wrong (bad luck), she would have done the wrong action. The fact that her *actual motivation* hinged on a clerical artifact makes the presence of the property "moral worth" contingent on external factors.

