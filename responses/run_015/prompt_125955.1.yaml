  **The Separating Variation:**
  The smallest variation that separates AMP from DP is: **The sheet is accurate (no error), but Dana follows the sheet rather than her own judgment, despite knowing the need.**
  *   **AMP:** **Second-Rate/No Worth.** She is still motivated by a proxy (the sheet) rather than the feature (the need), identical to the Treasurer.
  *   **DP:** **Full Worth.** She is reliably tracking the feature via a reliable proxy, and her disposition is intact. The absence of the clerical error removes the "accident," allowing DP to credit the disposition fully.
  *   **What this tells us:** It isolates whether the *clerical error* (luck) is the problem, or the *reliance on the proxy* (motivation) is the problem. AMP says the reliance is the problem; DP says the error is the problem.

