  **Verdict Prediction**
  The leader will deliver a verdict of **no moral worth** (or, at the absolute limit, "derivative" in the same sense as Case Five, but effectively indistinguishable from none).

  **Confidence:** High.
  The leader's methodology is explicitly strict regarding the *actual* motivational history of the action ("uses the phrase strictly," "not interested in praise or blame," "on this occasion that belief did no work"). In Case One, the shopkeeper did the right thing and was not blameworthy, yet received no worth because his motivation was prudence, not honesty. In Case Five, the donor did the right thing with reliable deference, yet received no worth because she was moved by "say-so" rather than the good itself. Dana's case is structurally identical to Case Five: she is moved by a proxy (the sheet) rather than the feature (the need), despite having a "grip" on the feature that the donor lacked. The leader's explicit note that the belief "did no work" signals that the causal chain is broken, which, under her strict criteria, voids the property of moral worth for this specific action-token.

  ***

  **The Rule and Its Competitors**

  **The Leader's Rule: The Actual Motivation Principle (AMP)**
  An action has moral worth if and only if the feature(s) that make the action right are the actual psychological causes of the agent's decision.
  *   *Application to Dana:* The right-making feature is "patient urgency." The actual cause was "the number on the sheet." Therefore, no worth.
  *   *Fit with Six Cases:*
      *   Cases 2, 3, 6 (Full Worth): Motivation was the feature itself (love, pain, distress).
      *   Case 4 (Second-Rate): Motivation was a rule (a proxy for fairness), hence the downgrade.
      *   Cases 1, 5 (No Worth): Motivation was self-interest or authority (not the feature).

  **Alternative Rule 1: The Disposition Principle (DP)**
  An action has moral worth if the agent possesses a stable disposition to track the right-making feature, such that in nearby counterfactual worlds where the feature is absent, the action would change.
  *   *Application to Dana:* Dana has the disposition (she would choose A if tied; she stands by the choice when the error is revealed). Therefore, **Full Worth**.
  *   *Fit with Six Cases:* Fits Cases 2, 3, 6 perfectly. Fits Case 1 (Shopkeeper lacks disposition) and Case 5 (Donor lacks disposition/grip). *However*, it struggles to explain the "Second-Rate" verdict in Case 4 without modification, as the Treasurer has a stable disposition to follow rules.

  **Alternative Rule 2: The Alignment Principle (AP)**
  An action has moral worth if the agent's motivation aligns with the right-making feature, even if mediated by a reliable proxy, provided the agent understands the feature.
  *   *Application to Dana:* Dana understands the feature and the proxy (sheet) aligned with it. Therefore, **Full Worth** (or Second-Rate).
  *   *Fit with Six Cases:* Fits Cases 2, 3, 6. Fits Case 4 (Rule aligns with fairness). Fits Case 5 poorly (Donor didn't understand the feature). Fits Case 1 poorly (Profit does not align with honesty).

  ***

  **The Discriminating Verdict**
  **Case Four (The Treasurer)** is doing the most work in discriminating between these rules.

  *   **Why:** Case One distinguishes right action from worth, but both AMP and DP agree on the Shopkeeper (he lacks the disposition/motive). Case Three distinguishes belief from motivation, but both AMP and DP agree on the Worker (he is moved by the feature).
  *   **The Conflict:** Case Four grants only "Second-Rate" worth to an agent who reliably does the right thing via a policy (Disposition) but is motivated by the rule (Proxy) rather than the underlying good.
      *   **AMP explains this:** Rules are proxies, not the feature itself, so worth is diminished.
      *   **DP struggles with this:** If a stable disposition is sufficient for worth (as it would be for Dana under DP), the Treasurer's fixed policy should arguably grant Full Worth. The "Second-Rate" verdict implies that *what moves you now* matters more than *what would move you later*.
  *   **Revision Required:** If the leader abandons AMP to give Dana Full Worth (accepting DP), she must revise **Case Four**. If Dana's disposition saves her action despite the proxy motivation, the Treasurer's disposition (fixed policy) should also save her action to Full Worth. The distinction between "Second-Rate" and "Full" collapses if actual motivation is secondary to disposition.

