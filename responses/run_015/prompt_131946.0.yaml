      *Refining the "Least-Costly Change":* The user needs to distinguish between *Type Identity* (Pattern) and *Token Identity* (Instance). Or, switch to "Continuity of Process." The latter saves (4) and (3) best. If the process is interrupted (copy), it's a new token. If the process migrates (gradual replacement), it's the same token.

      *Let's check (5) again.* Split-brain. If the hemispheres are uncoupled cortically but coupled subcortically, is it one self? Most evidence suggests two centers of agency. Claim (5) is empirically vulnerable. I should flag this as a "dialectical weakness" rather than a logical contradiction.

      *Final Plan:*
      1.  Brainstorm Pattern vs. Causal.
      2.  Audit (1)-(6).
