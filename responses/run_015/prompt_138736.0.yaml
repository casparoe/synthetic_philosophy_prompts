  State space $\Omega = \{1, 2, 3, 4, 5, 6, 7, 8\}$, uniform prior. Target event $E$: "State $\ge 5$" ($P(E)=0.5$). Seven pairs. Each pair receives one envelope containing a true state card (e.g., "5"). Agent A partition: $\{1,2,3,4\}, \{5,6,7,8\}$ (Magnitude). Agent B partition: $\{1,2,5,6\}, \{3,4,7,8\}$ (Quadrants). If state is 5: A sees $\{5,6,7,8\}$ ($P(E)=1$); B sees $\{1,2,5,6\}$ ($P(E)=0.5$). Materials: 7 state envelopes, 14 partition cards, 7 public record sheets (listing $\Omega$), pens, betting slips. A cheat sheet maps partition cells to initial probabilities to reduce calculation load. Participants sit in dyads. They cannot show cards. They share a public sheet to cross off states inconsistent with announcements. The room is arranged to prevent cross-pair communication. Whiteboard reserved for debrief tallies.

  2. Rules, vocabulary, and payoffs
  **Vocabulary:** Phase 1 (Coarse): {"Low" (<0.4), "Mid" (0.4–0.6), "High" (>0.6)}. Phase 2 (Fine): Exact percentages (0–100%). The Coarse grain is designed so distinct partition cells map to the same word. For Agent B, both cells yield 0.5, so B always says "Mid". Agent A says "High". A hears "Mid", but since both B's cells say "Mid", A learns nothing new about which cell B holds. The information channel is clogged.
  **Exchange:** 3 rounds per phase. Alternating turns. Speaker announces estimate. Listener updates public sheet by crossing off states inconsistent with that estimate given the speaker's known partition structure.
  **Betting:** Before announcing, both silently mark "Bet Yes/No" on slips for odds implied by their *current* private estimate (e.g., if I think 50%, I bet even money). Slips exchanged simultaneously. If both Yes, bet recorded. The betting slip captures the "agreeing to disagree" moment. If A believes 100% and B believes 50%, both should be willing to bet against each other. Recording this *before* the update shows the disagreement is active, not just semantic.
  **Scoring:** Brier Score: $1 - (prediction - outcome)^2$. Outcome is 1 if $E$ true, 0 otherwise. It is the right one because it is a strictly proper scoring rule that incentivizes truthful reporting of subjective probability without requiring risk-neutral monetary utility.
  **Constraints:** No verbal persuasion. Only vocabulary allowed. If estimates stabilize in Phase 1 without agreeing, stop early. Pairs remain constant to allow iterative updating. Public sheet must show the "common knowledge set" shrinking. Strict timer: 2 minutes per turn. Ensures calculation time. Points convert to course credit or prize. Penalize rule-breaking (talking) by point deduction.

  3. Timeline
  00–05: Grouping. Distribute materials. Read mechanics only. No theory.
  05–20: Phase 1 (Coarse). 2 rounds of announcement + betting. Facilitator circulates to enforce vocabulary.
  20–25: Pause. Collect bet slips. Do not reveal states yet. Ask pairs: "Did you agree?"
  25–30: Reset. New state card (same pair), same partitions. Introduce Fine Vocabulary.
  30–45: Phase 2 (Fine). 3 rounds. Watch for convergence. Record final numbers.
  45–50: Final Betting & Scoring. Reveal states. Calculate scores.
  50–75: Debrief. Whiteboard work. Theory reveal.
  *Buffer:* If calculations lag, cut Phase 1 to 1 round. The lock-in happens fast if partitions are chosen correctly.
  *Transition:* The shift from 20-25 is crucial. Do not explain *why* vocabulary changes. Let them feel the relief of precision.
  *Debrief Start:* Begin immediately with data on the board. "How many pairs agreed in Phase 1? Phase 2?" This empirical contrast drives the theoretical explanation. Ensure the betting slips are tallied before the theory is named to preserve the shock of inconsistency.

  4. Debrief
  Start with the board data. Phase 1 disagreement vs Phase 2 agreement.
  **Moment 1 (The Lock):** When Pair 3 stopped changing numbers in Phase 1. This maps to the "meet" of the partitions not being reached because the vocabulary merged distinct information cells. You knew something, but couldn't say it precisely enough to refine the common knowledge set.
  **Moment 2 (The Force):** When Pair 5 jumped to 100% in Phase 2. This maps to the theorem's dynamic. It wasn't persuasion; it was elimination. Once the public record sheet excluded all states where $E$ was false, the number *had* to be 1. The structure drove the agreement.
  **Moment 3 (The Bet):** The betting slips. When you both marked "Yes" while holding different numbers, you were "agreeing to disagree." Aumann proves this is impossible under common knowledge. The bet slip made the inconsistency visible.
  **For the Economist:** Your objection gets right that humans are not Bayesian automata, so persistent disagreement is expected in the wild. The theorem isn't vacuous, however, because it is not a weather forecast but a map of the terrain. It isolates the logic of information from the psychology of persuasion. It shows that if disagreement persists, it must be due to hidden structure (private info not fully revealed) or irrationality, not merely stubbornness. The theorem doesn't predict peace; it defines the cost of conflict: to disagree forever, you must hide information or abandon rationality. It transforms disagreement from a psychological fact into an epistemic diagnostic.

  5. Failure modes
  1. **Calculation Errors:** Students miscalculate posteriors. *Fix:* Provide a lookup table mapping partition cells to probabilities. Do not make them do Bayes rule from scratch.
  2. **Rule Breaking:** Sharing cards or talking ("I know it's 5"). *Fix:* Strict enforcement. Penalty points. This ruins the information asymmetry.
  3. **Boredom:** Phase 1 feels pointless. *Fix:* Frame it as "Testing the channel capacity."
  4. **Time Overrun:** Calculations take too long. *Fix:* Reduce state space to 4 if needed, but 8 is better for granularity. Stick to timeline strictly.
  5. **Skepticism:** Students think the state is rigged. *Fix:* Show the envelope sealing process.
  6. **Off-Record Hints:** Facilitator must circulate actively to catch 'off-record' hints. Students often try to help each other verbally. This must be stopped immediately to preserve the integrity of the information partition simulation.

  6. What the activity cannot show
  **Common Knowledge Infinite Regress:** The game simulates iterations, but true Common Knowledge is an infinite hierarchy ("I know that you know that I know..."). The game stops at finite rounds.
  **Rationality:** Students are boundedly rational. The theorem assumes logical omniscience. The activity shows the *direction* of the force, not the absolute inevitability.
  **Common Priors:** The game assigns one, but students might not truly share it (suspicion of trickery). This is a fundamental limitation of any classroom simulation of epistemic logic.
  **The "Meet":** You must verbally explain that the final agreement point is the "meet" of their partitions. The game shows the path, you must name the destination.
  **Idealization:** You must supply the "ideal agent" caveat. The game is a metaphor, not a proof. Acknowledge that real disagreement often stems from differing priors, which the theorem assumes away. You must state that the theorem describes the limit of ideal communication, not the messy reality of human debate.
