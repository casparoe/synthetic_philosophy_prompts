answer: |-
  In a dimly lit shipyard, a foreman encounters two indistinguishable lumps of solidified slag embedded in the floor, visible only as vague shapes through thick grime; he knows nothing about their composition, function, or history, nor can he classify them as tools, waste, or parts. Using a unique magnetic probe that locks onto each lump individually without revealing any data, he isolates the first and says, "Call that one 'K'," then isolates the second and says, "Call that one 'M'." He knows perfectly well which physical object bears each name because he controls the probe's lock, yet no descriptive condition—such as "the first lump" or "the object causing this signal"—enters his mind or serves to fix the reference; he is in a state of pure causal acquaintance. Months later, metallurgical tracing reveals that the object named 'K' was cast using the object named 'M' as its mold.

  **S:** "K was produced by M."

  **The Check**

  **Millian Direct Reference:**
  *   **Proposition Expressed:** A singular proposition consisting of the object K, the object M, and the relation *produced by*.
  *   **Modal Status:** Necessary (if true). Given the necessity of origin, if K was produced by M in the actual world, it was produced by M in every possible world where K exists.
  *   **Epistemic Status:** A posteriori. The relation was not contained in the concepts associated with 'K' or 'M' (there were none); it required empirical investigation to discover.
  *   **Mechanism:** Essentialist Discovery via Direct Reference. The names latch directly onto the objects; the necessity arises from the metaphysical essence of the objects, while the a posteriori status arises from the lack of descriptive knowledge at baptism.

  **Epistemic Two-Dimensionalism:**
  *   **Proposition Expressed:** The secondary intension is the same singular proposition as the Millian account. The primary intension, however, maps worlds to truth values based on the satisfaction of reference-fixing conditions.
  *   **Modal Status:** The account assigns *contingency* to the primary intension. The 2Dist argues that even bare ostension relies on an implicit descriptive condition (e.g., "the object causing this probe-experience"). In a counterfactual world where a different object causes the experience, 'K' and 'M' designate different objects, making "K was produced by M" false in that world. Thus, the statement is primarily contingent.
  *   **Epistemic Status:** A posteriori, explained by the contingency of the primary intension.
  *   **The Split:** The accounts come apart at the semantic valuation of the names in the primary intension. The Millian treats the bare baptism as fixing reference directly to the object (object-dependent primary intension), rendering the statement necessary on both dimensions. The 2Dist treats the baptism as fixing reference via a contingent descriptive condition (object-independent primary intension), rendering the statement contingent on the primary dimension.

  **Load-Bearing Feature:**
  The single feature doing the work is the **bareness of the demonstrative baptism** (Constraint 2). The absence of any descriptive content, even implicit, blocks the 2Dist from constructing a contingent primary intension based on satisfaction conditions.

  **Counterfactual Test:**
  If the baptism were replaced by an ordinary description-backed one (e.g., "Call the heavier lump 'K'"), the 2Dist verdict would align with the facts: the primary intension would be contingent ("the heavier lump"), explaining the a posteriori necessity as a coincidence of descriptions. The fact that the verdict changes when the description is removed proves that the bareness is load-bearing; it forces the reference to be object-dependent, which 2Dism cannot accommodate without abandoning its core claim that all a posteriori necessities stem from contingent primary intensions.

  **Two-Dimensionalist Objection & Response:**
  A 2Dist would attack the case by insisting that *some* description is always available, typically "the object causing this experience" or "the object at this location." They would argue that Constraint 2 is psychologically impossible; one cannot refer without *some* conceptual mediation.
  *   **Honest View:** This objection begs the question against the causal theory of reference. It assumes that causal acquaintance must be mediated by a descriptive concept of the acquaintance itself. If one accepts that perceptual demonstratives can be semantically direct (as Kripke and Kaplan argue), the 2Dist's insistence on extracting a description is an artifact of their framework, not a feature of the case. The case stands if direct reference is possible.

  **Contested Premise:**
  The case bears the weight of **Kripkean Necessity of Origin**. If it is not essential that K was produced by M (i.e., if K could have been produced by a different mold), then S is contingent, and the case fails to generate a necessary truth. This premise is standard in post-Kripkean metaphysics but remains contested by counterpart theorists and some materialists.
