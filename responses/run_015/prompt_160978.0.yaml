  (a) Sometimes the rational state isn't a single number but a *set* of probability functions. Concrete case I keep using: a coin comes from a factory, all I know is the bias is somewhere between 0.3 and 0.7, and I have no view at all about how the biases are distributed. I want to say the set is the right way to write down my state, and not merely a way of saying "there's a precise number and I don't know which".

  (b) Betting behaviour: I'm happy with a spread. I'd pay up to 30c for a ticket that pays $1 if the coin lands heads, I'd sell such a ticket for anything above 70c, and in between I just don't trade. I don't think that gap is a defect in me.

  (c) Updating: condition every member of the set on whatever I learn, keep all of them, and don't collapse back to a single function just because new evidence arrived. If that procedure sometimes leaves my range exactly as wide as it was, or wider, I've told myself I'm fine with that.

  (d) But I also hold: it's irrational to pay money for information that you know in advance will leave you *less* certain whatever it turns out to say. Buying ignorance with cash seems straightforwardly irrational to me, and more generally I expect inquiry to bend toward sharper numbers over time.

  (e) Decisions: an option is permissible if nothing else beats it under every member of my set; when it's a big one-shot decision where I don't get to repeat, I choose by best worst-case across the set.

  (f) I evaluate one decision at a time. Dutch book / sure-loss arguments leave me cold: if you can stitch together a bunch of bets I'd each accept individually into a package that loses for sure, my answer is that I never chose the package and I'm not required to evaluate it.

  (g) The whole *point* of having a range instead of a number, I keep telling my friend, is that it should make me more careful, never less. Imprecision is supposed to license caution, not license me to take risks I couldn't take with a precise number.

  (h) Two more bits: if you put a gun to my head and made me name one number, I'd name the middle of my range and I'd happily take either side of a bet at slightly worse than those midpoint odds; and I think two people with exactly the same evidence can rationally end up with different ranges.

  (i) Two objections from my friend that I can't tell are real: he says my ranges are incoherent because my range for heads and my range for tails don't add up to 1; and he says if I'll bet at midpoint-ish odds anyway then I'm just a Bayesian with extra steps and should drop the set.

  What I want from you: go through this and tell me which pairs are actually in tension and how badly, ranked by severity rather than all flagged equally — and be clear about which of the worries in (i) are fake and dissolve once you're careful. For each real tension, spell out what would have to give and what giving it up costs me; if a collision between (c) and (d) is real, I'd really like a concrete little case with actual numbers in it, because right now I can't see how you'd get widening out of plain conditioning and I suspect I'm being inconsistent without knowing it. Then tell me which single revision would clean up the most. I'm not attached to any particular item and I don't have a favourite to sacrifice — I'd rather you tell me where the weak link is. One practical note: I can't look anything up, so please don't send me reading lists or tell me to go read so-and-so — just argue it out from the case.
