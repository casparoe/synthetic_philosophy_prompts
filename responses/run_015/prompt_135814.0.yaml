answer: |-
  This is a operational framework designed for your specific constraints: low staff, high volume, short timeline, and a political environment that expects defensible logic rather than moral grandstanding.

  It operationalizes your theory (Honor, Testify, Occupy) and your distinction (Load-Bearing vs. Incidental) into a flowchart logic.

  ### Part 1: The Decision Procedure (The "Logic Gate")

  **Evidence Standard:** *Clear and Convincing Historical Record.*
  *   **Not:** Beyond a Reasonable Doubt (criminal).
  *   **Not:** Preponderance of Evidence (civil).
  *   **But:** Would a professional historian accept this claim as established fact based on available archives, oral history, and public record?
  *   **Rule:** If the negative claim relies on rumor, single-source anonymous testimony, or contested interpretation without consensus, the procedure stops at **Status Quo**.

  **Step 1: The Jurisdiction & Triage Check**
  *   **Q1:** Is the subject a human being (or group) explicitly commemorated by the city?
      *   *No:* Refer to appropriate department (e.g., Parks, Planning). **STOP.**
      *   *Yes:* Proceed.
  *   **Q2:** Is the negative claim about the subject supported by the Evidence Standard?
      *   *No:* **Recommendation: Status Quo.** (File closed).
      *   *Yes:* Proceed to Step 2.

  **Step 2: The Load-Bearing Test (The Core Mechanism)**
  *   **Q3:** Is the negative trait/action *causal* to the reason for the commemoration?
      *   *Definition:* Did the harm make the honor possible? (e.g., Wealth from slavery built the hall).
      *   *Definition:* Does the harm directly contradict the specific honor? (e.g., Honored as "Peacemaker" but committed war crimes).
      *   *Yes (Load-Bearing):* Proceed to Step 3A.
      *   *No (Incidental):* Proceed to Step 3B.
      *   *Note:* "Incidental" includes private beliefs not acted upon publicly, or policy disagreements that do not negate the specific achievement (e.g., a mayor honored for building a bridge who also opposed a park).

  **Step 3A: Load-Bearing Findings (The "Honor" is Compromised)**
  *   **Q4:** Was the action considered morally repugnant *at the time*, or is this a shift in contemporary values?
      *   *Repugnant at the time (e.g., child labor, embezzlement):* This is **Misconduct**. The honor is factually undeserved.
      *   *Shift in Values (e.g., owning slaves in 1800, military conquest):* This is **Expired Reason**. The honor was valid then, invalid now.
      *   **Escalation Point:** If the finding is **Expired Reason**, the panel cannot decide alone. This is a values question. **Recommendation: Refer to Council for Values Determination.** (Panel provides context, Council votes on community values).
      *   **If Misconduct:** Proceed to Remedy Ladder.

  **Step 3B: Incidental Findings (The "Honor" Stands, The "Testimony" is Incomplete)**
  *   **Q5:** Does the omission of this negative fact create a harmful falsehood in the public record?
      *   *No:* **Recommendation: Status Quo.** (Human complexity is not a disqualifier).
      *   *Yes:* Proceed to Remedy Ladder (Contextualization).

  **Step 4: The Occupancy Test (Remedy Selection)**
  *   *Match the remedy to the function of the commemoration.*
  *   **Function: Honor (Statue, Portrait):** If Load-Bearing Misconduct -> **Remove/Relocate.**
  *   **Function: Testify (Plaque, Museum Display):** If Incidental/Omission -> **Add Context.**
  *   **Function: Occupy (Street, School, Building Name):**
      *   *High Friction (Daily use, 911, forms):* Requires higher bar for removal.
      *   *If Load-Bearing Misconduct:* **Recommend Renaming.**
      *   *If Incidental:* **Recommend Context (Plaque/Website) + Retain Name.**
      *   *If Expired Reason:* **Refer to Council.** (Renaming is a values choice).

  ---

  ### Part 2: The Remedy Ladder

  Do not treat removal as the only tool. Match the finding to the rung.

  1.  **Status Quo:** Evidence insufficient or harm is incidental/private.
  2.  **Contextualization (Plaque/QR Code/Digital Archive):** Fixes the *Testify* function. Used when the honor stands but the story is incomplete (Step 3B).
  3.  **Modification (Co-naming, Adding Names):** Dilutes the *Honor*. Used when the figure is significant but not singular.
  4.  **Relocation (Move to Museum/Private Property):** Removes the *Occupancy* and public *Honor*, preserves the *History*. Used for Load-Bearing Misconduct on Statues.
  5.  **Removal/Renaming:** Erases *Honor* and *Occupancy*. Used **only** for Load-Bearing Misconduct on Names/High-Visibility Monuments.

  ---

  ### Part 3: Running the Cases

  Here is how the procedure processes your three referrals.

  #### Case 1: The Mill Owner (Library & Hospital)
  *   **Facts:** Endowed public goods. Wealth derived from child labor system.
  *   **Evidence:** Clear and Convincing (Public records of mill practices).
  *   **Load-Bearing Test:** **YES.** The endowment (the reason for the honor) is directly downstream of the exploitation. The good deed is causally dependent on the harm.
  *   **Morality Check:** Child labor was contested and often regulated/condemned *at the time* (late 19th/early 20th). This is **Misconduct**, not just a values shift.
  *   **Occupancy Test:** Building names are high-occupancy (said on forms, by patients).
  *   **Procedure Output:**
      *   **Statue:** **Relocate.** (Function: Honor. Load-bearing misconduct invalidates the public esteem).
      *   **Building Names:** **Rename.** (Function: Occupy. Load-bearing misconduct invalidates the honor. The buildings are monuments to the wealth source).
      *   **Mitigation:** Install permanent interpretive display in the lobby explaining the history of the funds and the workers who generated them.
  *   **Why you won't like this:** It demands renaming a hospital and library that people use and love. It attacks the "but look at the good he did" defense. The procedure forces you to acknowledge that *tainted money buys tainted honor.*

  #### Case 2: The Organizer (Street Name vs. Private Slur)
  *   **Facts:** Beloved public work. Private letter contains racial slur.
  *   **Evidence:** **Borderline.** One letter in an archive. Is it representative? (Procedure says: If not "Clear and Convincing" as a pattern of behavior, stop). *Assume for this run the evidence meets the bar.*
  *   **Load-Bearing Test:** **NO.** The slur was private. It did not cause his public organizing work. It does not directly contradict the specific honor (Community Organizer).
  *   **Occupancy Test:** Street name (High friction).
  *   **Procedure Output:**
      *   **Recommendation: Status Quo.** (With optional digital context).
      *   **Reasoning:** This falls under Step 3B (Incidental). Private thoughts, even repugnant ones, that did not influence public action or policy are not load-bearing to a public career. Removing the name sets a bar of moral perfection no historical figure meets.
  *   **Why this is risky:** It protects privacy/complexity over purity. If the slur leaks to the press, Council looks weak. But procedurally, this is the correct "Incidental" finding.

  #### Case 3: The Black Councilman (School Name vs. Housing Vote)
  *   **Facts:** Honored as "First Black Councilman." Voted against fair-housing ordinance.
  *   **Evidence:** Clear and Convincing (Voting record).
  *   **Load-Bearing Test:** **NO.** The honor is for *breaking the barrier of election* (Representation). The vote is a *policy decision*. One does not cause the other.
  *   **Morality Check:** This is a **Values/Policy Disagreement**, not universal misconduct.
  *   **Procedure Output:**
      *   **Recommendation: Contextualization (Plaque/Curriculum).**
      *   **Reasoning:** Removing him erases the historical fact of his election. The vote should be taught, not hidden. This is not "Misconduct" (Step 3A), it is historical complexity (Step 3B).
      *   **Escalation:** If the community feels this vote *negates* his representation, that is a **Values Question**. **Refer to Council.**
  *   **Why this is the safe bet:** It avoids the trap of punishing Black historical figures for imperfect politics, while refusing to hide the imperfection.

  ---

  ### Part 4: What This Procedure Cannot Do

  You asked for honesty on limitations. Here is where this logic breaks:

  1.  **It Cannot Heal Trauma:** A plaque on a building named after a slumlord does not fix the generational wealth gap caused by the slumlord. The procedure manages *symbols*, not *justice*.
  2.  **It Struggles with "Mixed Motives":** If the Mill Owner hated child labor but used it anyway because "that's how business works," is it load-bearing? The procedure says yes (causal), but morally it feels nuanced. The procedure favors *impact* over *intent*.
  3.  **The "Council Escalation" is a Black Hole:** When you kick a "Values Question" (Expired Reason) to Council, they will treat it as a political football. The procedure protects *you*, but it doesn't protect the *outcome* from partisanship.
  4.  **It Assumes History is Static:** You have two weeks per case. You are relying on *current* historical consensus. If new archives open in five years, your "Clear and Convincing" finding might be wrong. You need a built-in review cycle (e.g., "All decisions revisit after 10 years").

  ### Summary of the "Uncomfortable" Result
  Case 1 (The Mill Owner) is the hammer. Most panels try to separate the "Man" from the "Money." Your theory (and this procedure) says you can't. If the honor is the *Philanthropy*, and the Philanthropy is *Stolen Wages*, the Honor is void.

  **Recommendation:** Rename the buildings. Relocate the statue.
  **Political Cost:** High.
  **Logical Consistency:** High.

  If you cannot stomach renaming the hospital, you must admit that your panel prioritizes *community convenience* over *historical integrity*. That is a valid political choice, but it is not a principled one. This procedure forces you to make that choice explicitly.
