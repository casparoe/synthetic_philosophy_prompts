answer: |-
  You have identified the precise fault line where the Pessimistic Meta-Induction (PMI) fractures Scientific Realism. The tension between your **Newton $\to$ GR** verdict (Survival) and your **Caloric $\to$ Kinetic** verdict (Partial/No Survival) is the crux of the matter. Both involve mathematical recovery via limiting relations, yet your intuition distinguishes them based on what the math *represents*.

  To capture your verdicts, we need a principle that privileges **ontological mechanism** over **structural correspondence**. Structural Realism (which says "only the equations survive") would force you to call Caloric a survival case. Entity Realism (which says "only the causal agents survive") struggles with fields.

  Here is a principle constructed to match your intuitions, followed by the stress test you requested.

  ### The Principle of Causal-Kind Continuity (CKC)

  A theoretical posit $P_1$ in theory $T_1$ survives in successor theory $T_2$ if and only if:

  1.  **Limit Correspondence:** The equations governing $P_1$ are recoverable as a limiting case of the equations governing $P_2$ in $T_2$. (Necessary, but not sufficient).
  2.  **Causal Role Retention:** $P_2$ is invoked in $T_2$ to explain the same class of phenomena that $P_1$ explained in $T_1$.
  3.  **Ontological Kind Identity:** $P_1$ and $P_2$ belong to the same fundamental ontological category (e.g., *substance*, *field*, *geometric property*, *biological agent*).

  #### Application to Your Verdicts

  *   **Newton $\to$ GR (Survival):**
      *   *Limit:* Newtonian gravity is the weak-field, low-velocity limit of GR.
      *   *Role:* Both explain orbital mechanics and attraction.
      *   *Kind:* You classify both as **Spacetime Geometry/Field**. (Note: This requires viewing Newtonian absolute space as a geometric structure, which is philosophically defensible via Newton-Cartan theory).
      *   *Verdict:* **Survival.**

  *   **Phlogiston $\to$ Oxygen (No Survival):**
      *   *Limit:* No mathematical limit recovers phlogiston equations from oxidation chemistry.
      *   *Role:* Both explain combustion/weight change.
      *   *Kind:* Phlogiston is a *substance leaving*; Oxygen is a *substance entering*. The causal direction is inverted.
      *   *Verdict:* **No Survival.**

  *   **Caloric $\to$ Kinetic (Partial/No Survival):**
      *   *Limit:* Heat equations (Fourier) are recoverable from statistical mechanics.
      *   *Role:* Both explain heat flow and equilibrium.
      *   *Kind:* Caloric is a **Material Fluid** (substance); Kinetic Heat is **Statistical Motion** (property of particles).
      *   *Verdict:* **No Survival** (of the posit). The *phenomena* (temperature) survive, but the *posit* (caloric fluid) does not. This resolves your uncertainty: under CKC, this is a clear "No" for the posit, matching your intuition that the fluid is gone.

  *   **Aether $\to$ SR (No Survival):**
      *   *Limit:* Maxwell's equations survive, but the medium equations do not.
      *   *Role:* Both account for light propagation.
      *   *Kind:* Aether is a **Material Medium**; SR Vacuum is **Geometric/Field Background**.
      *   *Verdict:* **No Survival.**

  *   **Miasma $\to$ Germ (Weak/No Survival):**
      *   *Limit:* No mathematical recovery.
      *   *Role:* Disease transmission.
      *   *Kind:* Miasma is an **Environmental State** (bad air); Germ is a **Biological Agent** (organism).
      *   *Verdict:* **No Survival** (of the posit).

  ---

  ### The Stress Test: Classical Electron $\to$ QFT Electron

  Now we apply CKC to the transition from Classical Electrodynamics (CED) to Quantum Field Theory (QFT).

  *   **Limit Correspondence:** In the classical limit ($\hbar \to 0$), QFT expectation values recover classical trajectories (Ehrenfest theorem).
  *   **Causal Role Retention:** Both carry charge $e$, mass $m$, and source electromagnetic fields.
  *   **Ontological Kind Identity:**
      *   *CED Electron:* A **Localized Particle** with a definite trajectory and intrinsic identity over time.
      *   *QFT Electron:* An **Excitation of a Fermion Field**. It is delocalized, indistinguishable from other electrons, and subject to creation/annihilation.

  **The Verdict under CKC:** **No Survival (or Radical Revision).**
  The classical "billiard ball" ontology is extinguished. The QFT electron is not a particle in the classical sense; it is a quantized mode of a field. While we colloquially say "the electron survives," strictly speaking, the *ontological kind* has shifted from *corpuscle* to *field excitation*.

  **Honest Accommodation:**
  The CKC principle **cannot accommodate your Newton $\to$ GR verdict** without extra machinery, and it forces you to reconsider the Electron case.

  1.  **The Newton Problem:** If you are strict about "Ontological Kind," Newtonian Absolute Space (a fixed container) is *not* the same kind as GR Spacetime (a dynamic, curved participant). Newtonian gravity is a *force*; GR gravity is *geometry*. To call this "Survival," you must rely on a retrospective geometrization of Newton (Newton-Cartan), which is a reconstruction, not historical continuity. If you accept Caloric $\to$ Kinetic as "No Survival" because Fluid $\neq$ Motion, you must logically accept Newton $\to$ GR as "No Survival" because Force/Container $\neq$ Dynamic Geometry.
  2.  **The Electron Problem:** If you concede that the Electron survives (as most physicists intuitively do), you must weaken Clause 3 (Ontological Kind). If you weaken it to allow "Particle" and "Field Excitation" to count as the same kind, you risk allowing Caloric (Fluid) and Kinetic (Motion) to count as the same kind (both "mechanical carriers of energy").

  **Which verdict must you give up?**
  To maintain consistency, **you should likely revise the Newton $\to$ GR verdict to "Partial/Structural Survival."**
  The *metric field* survives, but the *interpretation* of what spacetime *is* undergoes a revolution as violent as Caloric $\to$ Kinetic. The PMI proponent will argue that just as Caloric was a useful fiction for heat, Newtonian Absolute Space was a useful fiction for gravity.

  ---

  ### Does This Save the No-Miracles Argument (NMA)?

  This principle transforms the NMA from a defense of "Truth" to a defense of **Selective Structural-ontological Realism**.

  1.  **Is "Roughly True" Defensible?**
      Yes, but only if "Roughly True" is defined as: *"The theory correctly identified the causal-ontological category of the unobservable, even if the specific dynamics were wrong."*
      *   Under this definition, Phlogiston and Caloric were **False** (wrong category).
      *   Newtonian Gravity was **Approximately True** (right category: geometric/field, wrong dynamics).
      *   This makes "Roughly True" precise but **expensive**. It admits that many past successful theories were *not* roughly true; they were structurally useful but ontologically bankrupt.

  2.  **Is "Roughly True" Ineliminably Vague?**
      The CKC principle removes vagueness regarding *mathematics* (limits are precise) but shifts the vagueness to **Ontological Categorization**.
      *   *Is a field excitation a particle?*
      *   *Is curved spacetime a force?*
      *   *Is a germ a refined miasma?*
      These are not empirical questions; they are metaphysical. The PMI attacker can argue that our current ontological categories (fields, particles, spacetime) are just as likely to be re-categorized in the future as "fluid" and "absolute space" were.

  **Conclusion:**
  The **Principle of Causal-Kind Continuity** captures your verdicts by drawing a hard line between *structural retention* (equations) and *ontological retention* (what exists). However, to remain consistent, it pressures you to downgrade the Newton $\to$ GR case from "Survival" to "Structural Survival."

  If you accept this downgrade, the No-Miracles Argument survives, but in a humbled form: **Success indicates that we have likely found the right *kind* of thing (fields, agents, geometry), but not necessarily the right *nature* of that thing.** This concedes the PMI's main point—that specific theoretical descriptions are likely false—while retaining the Realist's hope that we are carving nature at its joints, even if our description of the joints is blurry. "Roughly true" becomes "Ontologically Oriented," which is defensible, but offers less comfort to the realist who wants to claim our current theories are literally true.
