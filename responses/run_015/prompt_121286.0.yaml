answer: |-
  To apply David Lewis's analysis of convention to federated social platforms, we must first confront a fundamental tension in the definitions. Lewis defines a convention as a regularity in behavior among a population in a recurrent situation, sustained by a system of preferences where individuals prefer to conform conditional on the expectation that others will conform. Crucially, this relies on a stable population interacting within a shared situation where common knowledge of these expectations can accumulate.

  In a federated architecture, the "population" is fluid, and the "situation" is fragmented across independent instances. This does not necessarily invalidate Lewis's framework, but it forces a restructuring of how we identify the relevant population and the locus of coordination. The implications for stability, governance, and norm evolution in this setting can be understood through three primary shifts: the localization of common knowledge, the dual role of exit as both stabilizer and eroder, and the transformation of defection from a coordination failure into a migration signal.

  ### The Localization of Common Knowledge and the Redefinition of Population

  Lewis's requirement for common knowledge—that everyone knows, everyone knows that everyone knows, and so on—is the most fragile condition in a federated system. In a centralized environment, common knowledge is anchored by a shared history and a unified public square. In a federation, there is no single "public square."

  Consequently, Lewis's conditions for convention can generally only be satisfied *within* the bounds of a single server instance, not across the federation as a whole. The "population" $P$ in Lewis's definition effectively shrinks to the active user base of a specific instance. Within that boundary, regularity in behavior (e.g., specific norms around content warnings, threading, or topic focus) can emerge through repeated interaction. Salience is provided not by a global focal point, but by the instance's stated culture and the visible behavior of early adopters.

  However, the transience of users threatens the *depth* of this common knowledge. Lewisian conventions rely on the weight of precedent; the more times a regularity has been successfully coordinated, the stronger the expectation becomes. In a federated system with high churn, the "memory" of the convention is constantly being diluted by newcomers who lack the historical context of why a norm exists. This forces the community to rely less on tacit convention and more on explicit codification (pinned posts, strict moderation rules). While this maintains order, it shifts the mechanism from a Lewisian convention (where I conform because I expect you to) toward a rule-based compliance (where I conform because I fear sanction). If the behavior is driven primarily by fear of admin intervention rather than the expectation of peer conformity, it ceases to be a convention in Lewis's strict sense and becomes a form of local law.

  ### Exit vs. Voice: Clustering vs. Erosion

  The ability to migrate between instances with minimal friction fundamentally alters the "conditional preference" condition. In Lewis's standard model, if I prefer to drive on the right, it is because I expect you to drive on the right, and I have no easy option to drive on a different road. My preference is conditional on your conformity, but my ability to exit the situation is limited.

  In a federation, exit is a viable alternative to conformity. This creates a dual dynamic:

  1.  **Exit as Stabilizer (Clustering):** Migration allows users to sort themselves into instances where their pre-existing preferences align with the local regularity. This creates homogeneous pockets where Lewis's conditions are easily met. Because the population is self-selected, the expectation of conformity is high, and the preference to conform is genuine rather than coerced. In this sense, exit preserves local conventions by removing the "deviants" who would otherwise destabilize the equilibrium. It allows multiple, incompatible conventions to exist simultaneously in different instances without conflict.
  2.  **Exit as Eroder (Instability):** Conversely, the ease of exit weakens the commitment required to sustain a convention during times of stress. In a stable population, when a norm is challenged, users must negotiate (Voice) to restore the equilibrium because they are stuck with each other. In a federation, if a norm becomes costly or controversial, users may simply leave rather than negotiate. This drains the population necessary to sustain the common knowledge base. If the "veterans" who embody the common knowledge exit, the remaining population may lose the shared understanding required to coordinate. Thus, while exit preserves the *content* of the norm by allowing it to move with the users, it threatens the *continuity* of the convention within any specific instance.

  ### Rational Defection and Cooperative Equilibria

  Lewis argues that conventions persist because deviation is self-defeating; if everyone else drives on the right, driving on the left leads to a crash. In federated moderation, the cost of deviation is structurally different.

  In a centralized system, norm-defection is socially costly because it isolates the defector from the main network. In a federation, norm-defection on one instance does not necessarily isolate the user; it merely signals that they are on the wrong instance. This makes "defection" rational in a way Lewis did not anticipate. If I prefer a behavior that violates the local convention (e.g., posting without content warnings in a community that values them), I am not forced to stop. I can migrate to an instance where that behavior is the convention.

  This suggests that federated architecture inhibits the formation of *global* cooperative equilibria. There is no single "cooperative equilibrium" for the federation; there is only a mosaic of local equilibria. The system sustains cooperation not by punishing defection universally, but by segregating defectors into compatible environments.

  However, this introduces a vulnerability regarding *inter-instance* interaction. When users from different instances interact (e.g., via replies or boosts), they enter a situation where no shared convention exists. Here, Lewis's conditions for coordination fail because there is no common knowledge of regularity and no shared preference for conformity. This leads to friction, misunderstanding, and "federation breakdowns" (instances defederating from one another). To solve this, the system often develops a *meta-convention*: the practice of blocking or muting. The regularity becomes "if we do not share norms, we cease interaction." This is a stable equilibrium, but it is one of fragmentation rather than integration.

  ### The Meta-Convention of Server Selection

  Ultimately, Lewis's framework implies that in a federated system, the primary convention is not how one behaves *within* the platform, but how one selects *which* platform to inhabit. The coordination problem shifts from "how do we interact?" to "where do we interact?"

  The salience required for Lewisian convention is anchored in the server's description and reputation before the user even joins. The "conditional preference" is satisfied at the moment of registration: I prefer to join this instance conditional on the expectation that others here share my norms. Once inside, the behavioral norms are often reinforced by explicit rules rather than emerging tacitly, because the population is too transient to build deep tacit knowledge.

  This suggests that federated governance can sustain cooperative equilibria without centralized enforcement, but only by sacrificing global unity for local stability. The architecture makes persistent norm-defection rational *if* the user is willing to migrate. If the user wishes to remain in a specific community, defection remains irrational because the local cost (exclusion) outweighs the benefit. Therefore, stability is maintained not by the immutability of the norms, but by the fluidity of the membership. The convention exists, but it is tethered to the instance, not the protocol.

  ### Conclusion

  Lewis's core conditions can be satisfied in federated systems, but only locally and provisionally. The fragmentation of rules and transience of users prevent the emergence of a global common knowledge base, meaning no single convention can govern the whole network. Instead, the system relies on a proliferation of micro-conventions, each sustained by a self-selected population.

  The ability to exit preserves these local conventions by allowing like-minded clustering, but it simultaneously erodes the resilience of any single instance by making commitment optional. This creates a governance model where stability is achieved through segregation rather than consensus. Norm-defection is not eliminated; it is routed. The cooperative equilibrium is maintained not because everyone agrees on how to behave, but because those who disagree have sorted themselves into different rooms. The risk, from a Lewisian perspective, is that if the friction of migration becomes too low, the "common knowledge" within any room becomes too shallow to sustain complex coordination, reducing social interaction to a series of transient, rule-bound exchanges rather than deep, conventional understandings.
