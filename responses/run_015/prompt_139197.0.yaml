  # The Russell's Paradox Decision Tree
  **Start:** We agree that $R = \{x \mid x \notin x\}$ leads to a contradiction ($R \in R \iff R \notin R$). To keep doing maths, we must change a rule.

  1.  **Do we allow *any* logical condition to define a collection? (Unrestricted Comprehension)**
      *   **YES:** We keep the rule that any property makes a set. We must change logic instead. → *Go to Question 2.*
      *   **NO:** We restrict which properties are allowed to make sets. → *Go to Question 4.*

  2.  **If we keep Unrestricted Comprehension, does a contradiction allow you to prove *anything*? (Principle of Explosion)**
      *   **YES:** **Leaf: Trivialism.** (Every statement is true).
          *   *Status:* **Empty / Incoherent.** Maths becomes meaningless.
          *   *Cost:* You lose the ability to distinguish truth from falsehood.
      *   **NO:** We block "Explosion" (Paraconsistent Logic). → *Go to Question 3.*

  3.  **Does your logic also block the "Curry" inference? (From "If this is true then Q" to "Q")**
      *   **NO:** **Leaf: Weak Paraconsistent Set Theory.** (Russell's paradox is a true contradiction, but Curry's paradox still explodes).
          *   *Status:* **Defended (e.g., LP).**
          *   *Cost:* You must constantly check that your proofs don't accidentally use Curry-style self-reference, or the system trivializes.
      *   **YES:** **Leaf: Strong Paraconsistent Set Theory.** (Blocks both Russell and Curry).
          *   *Status:* **Defended (e.g., Relevant Logic).**
          *   *Cost:* You lose standard Modus Ponens; basic function application becomes harder to formalize.

  4.  **If we restrict Comprehension, is the restriction based on *Size* (some are too big) or *Structure* (syntax/stages)?**
      *   **SIZE:** Some collections are "Classes" and cannot be members of anything. → *Go to Question 5.*
      *   **STRUCTURE:** All collections are the same kind of object, but formation rules differ. → *Go to Question 6.*

  5.  **Are "Classes" a fundamentally different sort of object from "Sets"? (Two-Sorted)**
      *   **YES:** **Leaf: Two-Sorted Class Theory (e.g., NBG/MK).**
          *   *Status:* **Defended.**
          *   *Note:* **Collapses:** NBG and MK are indistinguishable for most formalization work; MK just allows stronger class comprehension.
          *   *Cost:* You cannot quantify over "all classes" in the same way you quantify over sets; some category-theory diagrams become unstateable.
      *   **NO:** (Everything is a set, but some can't be members).
          *   *Status:* **Empty / Incoherent.** If it's a set, it can be a member. If it can't, it's a class.

  6.  **Is the structural restriction imposed by *Syntax* (Types) or *History* (Stages of construction)?**
      *   **SYNTAX:** Membership $x \in y$ is illegal if $x$ and $y$ don't match levels. → *Go to Question 7.*
      *   **HISTORY:** Collections are built in a sequence; you can only collect from what exists so far. → *Go to Question 8.*

  7.  **Do we require *evidence* of construction to inhabit a Type? (Constructive vs Classical)**
      *   **YES:** **Leaf: Constructive Type Theory (e.g., Lean/Coq).**
          *   *Status:* **Defended.**
          *   *Cost:* You cannot use Proof by Contradiction to prove existence; you must build the witness explicitly.
      *   **NO:** **Leaf: Classical Typed/Stratified Theory (e.g., Quine's NF).**
          *   *Status:* **Defended.**
          *   *Note:* **Overlap:** NF allows a "Set of All Sets" but restricts formulas to "stratified" ones; Simple Type Theory does not. Both live here.
          *   *Cost:* You cannot define collections using "unstratified" formulas (e.g., you can't easily define the set of all finite sets).

  8.  **In the History/Stages picture, must membership chains eventually bottom out? (Well-Foundedness)**
      *   **NO:** **Leaf: Non-Well-Founded Set Theory (e.g., Aczel).**
          *   *Status:* **Defended.**
          *   *Cost:* You lose the ability to prove things by standard induction on membership depth; recursion requires special guardrails.
      *   **YES:** Chains must stop. → *Go to Question 9.*

  9.  **When defining a new collection, can you quantify over *all* existing collections (including the one you're building)?**
      *   **YES:** **Leaf: Iterative Cumulative Hierarchy (e.g., ZFC).**
          *   *Status:* **Defended.**
          *   *Cost:* You must accept that the "Universe of Sets" is not itself a set; you cannot formalize "the category of all sets" as a single object.
      *   **NO:** **Leaf: Predicative Stages (The "Member's Fix").**
          *   *Status:* **Defended (Predicativism).**
          *   *Diagnosis:* This is effectively ZFC without Impredicative Separation. It **does not break**, but it is weaker.
          *   *Cost:* You cannot define objects by quantifying over the whole universe (e.g., defining the least upper bound of a set of reals may fail if the reals aren't "earlier").

  ***

  ### Summary of "What You Lose" for Formalizers

  | Position | The Practical Pain |
  | :--- | :--- |
  | **Trivialism** | Everything is true; formalization is pointless. |
  | **Weak Paraconsistent** | You must audit proofs for Curry-style self-reference to avoid triviality. |
  | **Strong Paraconsistent** | Standard function application (Modus Ponens) is restricted; automation breaks. |
  | **Two-Sorted Class** | You can't quantify over "all classes"; large category theory is clunky. |
  | **Constructive Type** | No existence proofs by contradiction; you must construct the term. |
  | **Classical Typed** | "Unstratified" definitions (like "all finite sets") are illegal syntax. |
  | **Non-Well-Founded** | Standard induction on $\in$ fails; recursion needs explicit guards. |
  | **Iterative (ZFC)** | "The set of all sets" doesn't exist; large categories must be handled as schemas. |
  | **Predicative Stages** | Impredicative definitions (suprema, closures) often become unstateable. |

  ### Notes on Indistinguishability
  *   **NBG vs. MK Class Theory:** This tree groups them together. For a Lean formalizer, the distinction (whether class comprehension is axiomatic or schematic) rarely changes what theorems you can state, only how you prove them.
  *   **Simple Type Theory vs. NF:** Both live in the "Syntax" leaf. They differ on whether a Universal Set exists (NF: Yes, ST: No), but for a user, both feel like "I got a type error because I tried to put a set in itself."
  *   **Member's Fix vs. ZF:** The Member's Fix is a *subset* of the Iterative picture. It lands in the same branch but stops short of full ZFC power. It is coherent, just weaker.
