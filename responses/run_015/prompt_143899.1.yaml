answer: |-
  # Dissertation Defense Q&A Prep Sheet
  **Topic:** Diagnostic vs. Statistical Higher-Order Evidence (HOE)
  **Time:** 2 Minutes per reply max.
  **Strategy:** Do not get bogged down in formalism you haven't derived. Lean on the *normative* distinction between belief formation and risk management.

  ---

  ### 1. The Imprecise Probabilist (Formal Coherence)
  **Who:** The Bayesian who works with imprecise probabilities.
  **The Objection:** "You say statistical HOE requires 'widening intervals' but not shifting credence. But if your representor is a set of functions, and you widen it to accommodate the error rate, your lower bound for $p$ drops. Functionally, you are now less confident in $p$ by your own metric. If you're willing to accept a lower lower-bound, aren't you just admitting your credence has shifted, but you're refusing to call it that?"
  **The Reply:** "The shift in the lower bound reflects *uncertainty about the reliability of the current estimate*, not a shift in the estimate itself. Think of it as a confidence interval around a mean. The mean (my first-order credence) stays fixed because the statistical evidence doesn't tell me *which way* I'm wrong. The widening captures the risk that the mean is misplaced. It's a second-order parameter (reliability) acting on the first-order parameter (credence), not a change to the first-order parameter itself."
  **Soft Spot:** If they press on whether the "mean" is still the rational guide for action given the widened interval.
  **Confidence:** 75%
  **Damage Potential:** **Critical.** If this collapses, the formal mechanism fails.

  ### 2. The Deference Expert (Peer Disagreement)
  **Who:** The social epistemologist who published on expert trust.
  **The Objection:** "This looks like dogmatism dressed up as distinction. If four peers disagree with me, that is paradigmatic higher-order evidence. You're saying I can treat that as merely 'statistical,' keep my first-order credence high, and just 'hedge' my bets? That violates the core conciliationist intuition that peer disagreement *should* move your doxastic attitude, not just your risk profile."
  **The Reply:** "Peer disagreement is only diagnostic if they give you their reasoning. If they just say 'I disagree,' that is purely statistical—it tells you error is possible, not *why*. My claim is that rationality requires conciliation only when you have a reason to think *your* reasoning is the faulty token. Mere disagreement tells you the *type* of situation is error-prone, which is handled by hedging (seeking more info), not by arbitrarily lowering confidence in $p$ without a specific defeater."
  **Soft Spot:** It sounds counter-intuitive to standard literature. They may view "hedging" as insufficient for the normative demand of disagreement.
  **Confidence:** 80%
  **Damage Potential:** **High.** Directly contradicts a sub-field they know well.

  ### 3. The General Epistemologist (Epistemic Akrasia)
  **Who:** A generalist focused on rationality norms.
  **The Objection:** "You're permitting a form of epistemic akrasia. I believe $p$ with high confidence, but I also believe 'in cases like this, I'm wrong 30% of the time.' Isn't that irrational? You're saying I can rationally hold 'I believe $p$' and 'My belief in $p$ is likely unreliably formed' simultaneously. That looks like a tension you've just relabeled as 'hedging'."
  **The Reply:** "Akrasia requires believing $p$ while believing you *ought not* believe $p$. I'm arguing that knowing the error rate doesn't entail you ought not believe $p$—it entails you ought not *rely* on $p$ in high-stakes contexts without checking. The tension is between belief and action, not between belief and higher-order belief. I can trust my reasoning token while acknowledging the type is noisy."
  **Soft Spot:** The line between "ought not rely" and "ought not believe" is very thin.
  **Confidence:** 85%
  **Damage Potential:** **Medium-High.** Makes the view look psychologically unstable.

  ### 4. The Standard Bayesian (The Discrimination Argument)
  **Who:** One of the other two formal types.
  **The Objection:** "Your discrimination step claims base rates don't distinguish error-worlds from correct-worlds. But if the base rate of error is 30%, then in 30% of possible worlds, this belief is false. That *is* discrimination. You're updating on the probability that you are in an error-world. Why isn't that a standard conditionalization on the proposition 'My process is 30% unreliable'?"
  **The Reply:** "Conditionalization requires evidence that bears on the truth of $p$. The fact that 'processes of type T fail 30% of the time' bears on the *process*, not the truth of $p$ directly. To update on $p$, you need to know *this* token is the failure case. Without diagnostic info, the probability mass is distributed symmetrically; you have no vector for the update. You can't lower credence in $p$ unless you have reason to think the error pushes specifically against $p$."
  **Soft Spot:** They may argue that symmetric uncertainty still lowers expected utility/truth probability.
  **Confidence:** 70%
  **Damage Potential:** **Medium-High.** Attacks the core logical argument.

  ### 5. The Action-Theorist (Double Counting & Betting) ★
  **Who:** Any committee member focused on pragmatics or decision theory.
  **The Objection:** "Credence is defined by betting behavior. If you say I should 'widen intervals' and 'change what I'd bet,' you are saying my betting odds change. If your betting odds change, your credence has changed. You're trying to have your cake (stable credence) and eat it too (different actions). This looks like double-counting the error rate: once in the hedge, and once in the refusal to update credence."
  **The Reply:** "I'm distinguishing *doxastic commitment* from *decisional risk*. Credence tracks truth-connection; hedging tracks risk-management. The error rate is counted once in the risk profile. If I refuse to lower credence, I'm saying the truth-connection hasn't been severed, only obscured. The 'double counting' would occur if I lowered credence *and* hedged. I'm doing only the latter."
  **Soft Spot:** **This is the weakest link.** Standard Bayesianism equates credence and betting. Denying this requires a robust defense of a non-pragmatic account of credence.
  **Confidence:** 50% ★ **(STARRED)**
  **Damage Potential:** **Critical.** If credence just *is* betting disposition, the thesis fails.

  ### 6. The Experimental Philosopher (Intuition Reliability)
  **Who:** One of the two X-Phi folks.
  **The Objection:** "Your distinction relies on the intuition that 'diagnostic' feels different from 'statistical.' But our work shows these intuitions are framing artifacts. If we describe the peer disagreement case with more vivid details, people treat it as diagnostic. Isn't your taxonomy just a map of how vignettes are phrased, rather than a normative reality?"
  **The Reply:** "I'm making a normative claim, not a descriptive psychological one. Even if people *feel* the same, the rational requirement differs. If I know I was distracted (diagnostic), I have a defeater. If I know peers disagree (statistical), I have a risk factor. The intuition pump is just to access the norm; the norm holds regardless of the framing artifact."
  **Soft Spot:** Hard to defend normative claims without *some* appeal to stable intuitions.
  **Confidence:** 80%
  **Damage Potential:** **Medium.** Methodological gripe, easier to deflect than logical errors.

  ### 7. The Social Epistemologist 2 (Expert Trust)
  **Who:** The other social epi person.
  **The Objection:** "Apply this to climate science or medicine. If 30% of experts flag a tumor, you say the radiologist shouldn't lower confidence it's benign, just 'hedge'? That seems dangerous. In high-stakes expert contexts, statistical HOE *must* lower first-order credence to ensure safety."
  **The Reply:** "In those cases, the 'hedge' *is* the rational response: get a second read, run more tests. The radiologist shouldn't necessarily update their *current* visual assessment's credence without new data, but they must update their *action* to acquire diagnostic evidence. My view mandates the safety check (hedging) without requiring them to falsely pretend their initial read was less accurate than it was."
  **Soft Spot:** In practice, "lowering confidence" and "ordering more tests" look identical.
  **Confidence:** 85%
  **Damage Potential:** **Low-Medium.** Practical application challenge.

  ### 8. The Generalist (Taxonomy Utility)
  **Who:** A generalist or the chair.
  **The Objection:** "Even if this distinction holds, what work does it do? We already have concepts like 'defeaters' vs. 'undercutters.' Why do we need a new taxonomy of HOE? What problem does this solve that existing epistemology doesn't?"
  **The Reply:** "It solves the puzzle of why peer disagreement feels different from calculated error rates. Existing literature conflates them, leading to the 'uniqueness' debates. By separating them, we explain why we can rationally stick to our guns in some disagreement cases (statistical) but not others (diagnostic), resolving the tension between steadfastness and conciliation."
  **Soft Spot:** Might seem like a solution in search of a problem.
  **Confidence:** 90%
  **Damage Potential:** **Low.** "Future work" territory.

  ---

  ### The Question I Hope Nobody Asks
  **"Isn't Diagnostic HOE just First-Order Evidence?"**
  *Why it's dangerous:* If I learn "I was distracted," that is a fact about the world. If I learn "I mixed up the conditional," that is a logical fact. If these are just new first-order facts about the reasoning process, then *all* HOE reduces to first-order evidence, and your entire taxonomy collapses into a distinction between "direct evidence for $p$" and "evidence about the argument for $p$."
  *Prepared Answer:* "It's higher-order because it targets the *relation* between the evidence and the belief, not the proposition $p$ itself. First-order evidence bears on $p$; Diagnostic HOE bears on the *support* $E$ gives to $p$. It operates on the inference, not the world." (Keep this ready, but pray they don't push the reductionist line).

  ---

  ### General Defense Strategy Notes
  1.  **Own the "Hedge":** When they press on action/betting, don't wobble. Insist that *risk management* is distinct from *belief*. If you concede that credence *is* betting, you lose.
  2.  **The "Vector" Metaphor:** Use this for the Discrimination Argument. Statistical evidence says "You might be off." Diagnostic evidence says "You are off *in this direction*." Only the latter moves the needle on $p$.
  3.  **Don't Fight the Bayesians on Math:** If they ask for an update rule you don't have, admit it. "The formalization of the hedging parameter is a task for future work; the normative claim is the priority here."
  4.  **Watch the Deference Expert:** They are your biggest threat for "standard view" violations. Acknowledge their work, but frame your view as a *refinement* of conciliationism, not a rejection. "I agree we must respect peers, but only when they provide diagnostic leverage."

  **Good luck. You know the material. Stick to the constraint.**
