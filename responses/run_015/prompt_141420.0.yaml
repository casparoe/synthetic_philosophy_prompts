prompt: |-
  I run a fortnightly "games, choice and proof" workshop for first-years, mixed maths and philosophy, about 16 people, 80 minutes, one room with moveable tables. I can get printed boards, two colours of counters, index cards and a whiteboard. Almost none of them have met a non-constructive existence proof before.

  I had a long argument with a friend last night about the strategy-stealing argument. She says it's a parlour trick: it tells you the first player wins at Hex and hands you nothing you can actually use, so what has it shown. I kept saying that's the whole point — you find out *which* player without ever getting your hands on a strategy — but I couldn't make her feel it, and I think the only way to feel it is to play. So design me the session: rules, materials, a timeline, and a debrief that maps what happened onto the steps of the argument (the supposition that the second player has a winning strategy, the throwaway opening move, the "pass" you make when the stolen strategy calls for the cell you already took, and the premise that an extra stone of your own colour can never hurt you). No lecture up front and nobody says "strategy stealing" until the last ten minutes — they should run into the move themselves.

  The bit I want you to work out rather than look up, because I invented it on the way home: a variant — call it Stint Hex — where each player has a fixed budget of stones, fewer than half the board, must place one every turn, and looses if the budget runs out before they've connected their sides. In that variant the throwaway move costs something, and I want the group to discover that by trying to rerun the argument on it, not by being told. If who actually wins Stint Hex isn't obvious, say so honestly instead of inventing an answer. There's a second beat if time allows: a free stone of your own colour, placed by someone else, is a gift in Hex — get them to find a game where the same gift is a curse.

  Finally: what goes wrong the first time I run it. I expect people to slide from "the first player wins" into "I can name the winning opening move", and someone to object that finite games are determined anyway so the existence claim was never the news — how do I handle that, and what does the activity just can't show them that only I can say out loud?
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year Maths/Philosophy students (mixed), ~16 people.
      *   **Format:** Fortnightly workshop, 80 minutes, "Games, Choice and Proof".
      *   **Resources:** Moveable tables, printed boards, 2-color counters, index cards, whiteboard.
      *   **Prior Knowledge:** Almost none have seen non-constructive existence proofs.
      *   **Core Topic:** Strategy-stealing argument (specifically in Hex).
      *   **Pedagogical Goal:** Students must *discover* the argument through play, not lecture. No mention of "strategy stealing" until the last 10 mins.
      *   **Specific Constraint 1 (The Friend's Objection):** Address the "parlour trick" critique (existence without construction) through experience.
      *   **Specific Constraint 2 (The Invented Variant):** "Stint Hex" (fixed budget of stones, fewer than half the board, lose if budget runs out before connecting). Students must discover why strategy stealing fails here (the throwaway move costs resources).
      *   **Specific Constraint 3 (The Second Beat):** "Poisoned Gift" (a free stone is good in Hex, find a game where it's bad).
      *   **Specific Constraint 4 (Failure Modes):** Anticipate confusion (constructing the move vs. knowing it exists) and determinacy objections (Zermelo's theorem).
      *   **Tone:** Practical, structured, engaging, philosophically rigorous but accessible.

  2.  **Deconstruct the Session Flow (80 Minutes):**
      *   *Intro (5 mins):* Setup, rules, no theory.
      *   *Phase 1: Standard Hex (25 mins):* Play, notice First Player advantage, try to find the strategy.
      *   *Phase 2: The Proof Discovery (20 mins):* Guided discussion, mapping the play to the logic.
      *   *Phase 3: Stint Hex (20 mins):* The variant that breaks the proof.
      *   *Phase 4: Debrief & Philosophy (10 mins):* Naming the argument, addressing the "parlour trick" critique, determinacy.
      *   *Buffer/Overflow:* Built into phases.

  3.  **Drafting the Content - Phase by Phase:**

      *   **Materials:** Need Hex boards. 11x11 is standard, but for 80 mins with 16 people (8 pairs), smaller boards (5x5 or 7x7) are better for quick games. Let's suggest 7x7 for speed but mention 11x11 for depth. Counters (Red/Blue). Index cards for "Budget" in Stint Hex.

      *   **Phase 1: Standard Hex:**
          *   Rules: Connect opposite sides. No draws.
          *   Task: Play 3 games each, swap colors.
          *   Prompt: "Does Player 1 have an advantage? Can you write down the winning move?"
          *   *Goal:* They feel P1 wins, but can't articulate *how*.

      *   **Phase 2: The "Impossible" Proof (The Core):**
          *   This needs careful scaffolding. I can't tell them the proof. I need to ask questions that force them into the *reductio*.
          *   Prompt: "Assume Player 2 *does* have a winning strategy. Player 1 makes a random move. Now pretend Player 1 is Player 2..."
          *   Visual aid: Whiteboard diagramming the "extra stone" concept.
          *   *Key Insight:* The "extra stone" never hurts.

      *   **Phase 3: Stint Hex (The Invented Variant):**
          *   *Rules:* Same board. Each player gets $N$ stones (e.g., 10 on a 7x7 board, where total cells = 49). Must place one per turn. If you run out and aren't connected, you lose immediately.
          *   *Task:* Try to run the same argument.
          *   *Discovery:* The "throwaway" move uses budget. If the stolen strategy tells you to play where you already played, you usually "pass" in standard Hex. In Stint Hex, you *must* play. If you play elsewhere, you waste budget. If the strategy relies on efficiency, the extra stone isn't just neutral; it's a resource cost.
          *   *Wait, check the logic:* In standard strategy stealing: P1 plays $x$. P2 plays $y$ (according to winning strategy $S$). If $S$ ever calls for $x$, P1 plays anywhere.
          *   In Stint Hex: P1 plays $x$ (cost 1). P1 pretends to be P2 using $S$. If $S$ calls for $x$, P1 must play $z$ (cost 1). P1 has used an extra stone compared to the hypothetical P2 in the simulation. Since budget is tight, having *more* stones on the board isn't the issue; *running out of moves* is.
          *   *Correction:* The prompt says "looses if the budget runs out before they've connected".
          *   Standard Hex: Extra stone is neutral/good.
          *   Stint Hex: Extra stone consumes budget. If the win condition requires efficiency, the "extra" stone might be the one that bankrupts you.
          *   *Who wins Stint Hex?* This is tricky. If $N$ is very small, maybe P2 wins by conservation? If $N$ is large, maybe P1? The prompt says "If who actually wins Stint Hex isn't obvious, say so honestly." I should admit the outcome is an open investigation for them, but the *proof failure* is the lesson.

      *   **Phase 4: The Poisoned Gift:**
          *   Hex: Extra stone = good.
          *   Game where extra stone = bad?
          *   *Idea:* Nim? No.
          *   *Idea:* Games with "suicide" rules or capture.
          *   *Idea:* *Dawson's Kayles*? Too complex.
          *   *Idea:* A game where you lose if you complete a shape (Misere Hex?).
          *   *Idea:* *Go* (filling your own eyes).
          *   *Simpler Idea:* "Avoid connecting your sides" (Misere Hex). If I give you a stone that connects you, you lose.
          *   *Better Idea:* A game where move count matters.
          *   *Let's stick to the prompt:* "Find a game where the same gift is a curse."
          *   *Suggestion:* **Misere Hex** (you lose if you connect). Or a simple parity game. Let's suggest Misere Hex as it's the direct inverse.

      *   **Failure Modes & Facilitation:**
          *   *Issue:* "Just tell me the move."
          *   *Fix:* "I don't know. Can you find it?"
          *   *Issue:* "Zermelo's Theorem says someone must win anyway."
          *   *Fix:* Distinguish between *determinacy* (someone wins) and *identification* (who?). Non-constructive proof identifies *who* without *how*.
          *   *Issue:* "It's a trick."
          *   *Fix:* Validate the friend's point. It *is* weird. That's why we study it. It separates Truth from Knowledge.

  4.  **Refining the Stint Hex Logic:**
      *   I need to be careful here. The prompt asks me to work this out, not look it up.
      *   Standard Strategy Stealing relies on:
          1.  P1 makes move $m_1$.
          2.  P1 adopts P2's winning strategy $S$.
          3.  If $S$ calls for $m_1$, P1 plays a dummy move $m_{dummy}$.
          4.  Having an extra stone on the board is never a disadvantage (monotonicity).
      *   Stint Hex Constraints:
          1.  Budget $B$.
          2.  Lose if stones $= 0$ and no connection.
      *   Why does the proof break?
          *   In step 3, P1 plays $m_{dummy}$. This costs 1 budget.
          *   In the hypothetical simulation where P1 is acting as P2, P2 would have played $m_1$ (cost 1).
          *   So P1 has played $m_1$ (real) + $m_{dummy}$ (extra). P2 (in simulation) played $m_1$ (as response).
          *   Wait, the strategy stealing argument usually says: P1 plays $x$. Then P1 ignores $x$ and plays as P2. If strategy says play $x$, P1 plays $y$ instead.
          *   In Stint Hex, playing $y$ instead costs a stone.
          *   The "Extra stone is never hurtful" premise relies on the stone staying on the board helping connectivity.
          *   In Stint Hex, the *act of placing* consumes the resource needed to win.
          *   So, if the winning strategy requires exactly $k$ stones, and the "stealing" forces you to use $k+1$ stones (because of the dummy move), you might run out of budget.
          *   *Conclusion:* The proof fails because the "extra stone" isn't free; it costs from the finite budget.
          *   *Who wins?* If the board is large and budget is tight, conservation matters. P2 might win by efficiency. If budget is loose, P1 might still win. It's not immediately obvious. I will state this ambiguity as a feature.

  5.  **Refining the "Poisoned Gift":**
      *   Hex: Monotonic (more stones = better).
      *   Need Non-monotonic.
      *   *Misere Hex:* Connect = Lose. An extra stone might complete a chain you didn't want.
      *   *Nim:* Adding a stone changes the nim-sum. Sometimes good, sometimes bad. But "gift" implies an extra move or piece given freely.
      *   *Best fit:* **Misere Hex**. It's the exact logical negation. If someone places a stone for you that completes your path, you lose.

  6.  **Addressing the "Friend's Objection" (Philosophy):**
      *   The friend says: "It tells you nothing you can use."
      *   The Math/Phil response: It tells you *where to look* (P1) and *that a search is warranted*. It separates *existence* from *constructibility*.
      *   In Computability Theory: This is the difference between $\exists x$ and finding $x$.
      *   In Philosophy: Knowledge that vs. Knowledge how.

  7.  **Structuring the Plan:**
      *   **Title:** "The Ghost Strategy."
      *   **Setup:** Room layout (pairs), materials.
      *   **Timeline:** Minute-by-minute breakdown.
      *   **Scripts:** What the facilitator says (and doesn't say).
      *   **Stint Hex Rules:** Clearly defined.
      *   **Debrief:** Mapping the experience to the logic.
      *   **Troubleshooting:** The specific failure modes requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mention "strategy stealing" too early? *Fix:* Ensure it's banned until the last 10 mins.
      *   *Check:* Is Stint Hex clear? *Fix:* Make sure the budget rule is explicit on index cards.
      *   *Check:* Is the "Poisoned Gift" feasible in 10 mins? *Fix:* Keep it brief, maybe just a thought experiment or one quick round of Misere.
      *   *Check:* The "Friend's Objection." *Fix:* Make sure the debrief explicitly validates her point before countering it.

  9.  **Final Polish:**
      *   Ensure the tone is workshop-y, not lecture-y.
      *   Highlight the "Moveable Tables" aspect (group work).
      *   Make sure the Whiteboard usage is strategic (recording their claims, not teaching).

  *(Self-Correction on Stint Hex Logic)*: I need to be precise. In standard strategy stealing, if the strategy calls for the cell you already took, you play *anywhere*. In Stint Hex, playing *anywhere* costs a stone. If the winning strategy is "tight" (uses exactly the budget), playing an extra "dummy" stone means you run out of stones before the path is complete. Thus, the "extra stone is harmless" premise fails because stones are *costs*, not just assets.

  *(Self-Correction on Determinacy)*: Students might say "Finite game, no draws, someone must win." True. But *which* one? The proof tells us it's P1 without showing the moves. That is the non-constructive bit. Zermelo says $\exists$ a strategy for one player. Strategy stealing says $\neg$(P2 has strategy) $\to$ P1 has strategy. It narrows the search space from {P1, P2} to {P1}. That is information gain without construction.

