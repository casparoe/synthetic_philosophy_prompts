answer: |-
  # Workshop Plan: The Ghost Strategy
  **Topic:** Non-constructive Existence Proofs via Strategy Stealing  
  **Time:** 80 Minutes  
  **Participants:** 16 (8 pairs)  
  **Materials:** 8 Hex boards (7x7 recommended for speed), 2 sets of counters (Red/Blue), Index Cards (for Stint Hex budgets), Whiteboard + Markers.

  ---

  ## 1. Setup & Rules (0:00 – 0:05)
  **Room:** Tables in pairs. One board per pair. Counters in the middle.
  **Facilitator Stance:** You are a referee, not a lecturer. Do not explain *why* they are playing. Do not mention proofs.

  **The Pitch:**
  > "Welcome. For the next hour, you are playtesters. You will test two games. Your job is not just to win, but to figure out if the game is 'fair.' By fair, I mean: does the second player have a chance if the first player plays perfectly?
  >
  > **Game 1: Hex.**
  > 1. Red connects Top-Bottom. Blue connects Left-Right.
  > 2. Place one stone per turn on an empty hex.
  > 3. Stones stay forever.
  > 4. First to connect their sides wins. No draws.
  >
  > Play three games. Swap colours. Swap opponents after 15 minutes. On the whiteboard, I want you to write down one thing: **Can Player 2 ever force a win?**"

  *(Write the question on the whiteboard. Leave it there.)*

  ---

  ## 2. Phase 1: The Intuition Trap (0:05 – 0:30)
  **Activity:** Free play.
  **Facilitator Role:** Circulate. Listen.
  **Key Interventions:**
  *   If a pair finishes quickly: "Play again. Try to lose as Player 1. Can you?"
  *   If they ask "Is there a trick?": "You're the testers. You tell me."
  *   **Crucial:** If someone says "Player 1 always wins," ask: "Okay, write down the winning opening move."
      *   They will hesitate. They will say "Center?"
      *   Ask: "Prove it. Play against me using only that rule." (They will fail to articulate the full strategy).

  **The Whiteboard Tally:**
  After 15 mins, stop the room. Ask for a show of hands.
  *   "Who thinks Player 2 can win with perfect play?" (Likely 0 hands).
  *   "Who thinks Player 1 wins?" (Likely all hands).
  *   "Who can write the winning strategy on the board right now?" (Likely 0 hands).

  **The Pivot:**
  > "Interesting. You all agree Player 1 wins. None of you can show me *how*.
  >
  > New Task: I want you to prove Player 1 wins. But you aren't allowed to list moves. You are only allowed to talk about **what would happen if Player 2 had a winning plan.**
  >
  > Work in your pairs. Assume Player 2 has a magic instruction booklet that guarantees they win. Player 1 goes first. How can Player 1 use Player 2's booklet against them?"

  *(Give them 10 minutes. This is the struggle phase. They are trying to reconstruct the strategy-stealing argument without the name.)*

  ---

  ## 3. Phase 2: Mapping the Argument (0:30 – 0:50)
  **Facilitator Role:** Socratic. Draw on the whiteboard only what *they* tell you.

  **Guiding Questions (ask the room, not specific people):**
  1.  "If Player 2 has a winning booklet, what does Player 1 do on turn 1?"
      *   *Target Answer:* Play anywhere. A "throwaway" move.
  2.  "Okay, Red plays a stone at X. Now Red pretends to be Blue. Red looks at Blue's booklet. What does the booklet say?"
      *   *Target Answer:* It tells Blue where to play to beat Red.
  3.  "What if the booklet says 'Play at X' (where Red already put a stone)?"
      *   *Target Answer:* Play somewhere else. A dummy move.
  4.  "Why is this okay? Why doesn't having that extra stone at X hurt Red?"
      *   *Target Answer:* In Hex, more stones are never bad. You can't block yourself.

  **The Synthesis:**
  Once they verbalize this, draw the logic chain on the board:
  1.  Assume P2 wins.
  2.  P1 plays random stone.
  3.  P1 steals P2's plan.
  4.  Extra stone is harmless.
  5.  Contradiction: P1 wins using P2's plan.
  6.  Therefore: P2 cannot have a winning plan.

  **The Friend's Objection (Pre-emptive):**
  > "I can hear a objection forming. 'This tells us P1 wins, but it doesn't tell us where to put the first stone. It's a parlour trick. It gives us truth without knowledge.'
  >
  > Hold that thought. We're going to test if this 'trick' is magic or logic by breaking the game."

  ---

  ## 4. Phase 3: Stint Hex (0:50 – 1:10)
  **Materials:** Hand out Index Cards. Write a number on each (e.g., "12 Stones").
  **The Variant:**
  > "Game 2: **Stint Hex**.
  > 1. Same board. Same connection goal.
  > 2. **Budget:** You have 12 stones total (adjust based on board size, must be < half total cells).
  > 3. **Compulsion:** You must place one stone every turn.
  > 4. **Loss Condition:** If you run out of stones and haven't connected, you lose immediately.
  >
  > Play 3 games. Then try to run the same argument: *Assume Player 2 has a winning plan. Can Player 1 steal it?*"

  **The Discovery:**
  Give them 10 minutes to play, 10 minutes to argue.
  **What to listen for:**
  *   In Standard Hex, the "dummy move" (when the booklet calls for the occupied cell) is free. You just play elsewhere.
  *   In Stint Hex, the "dummy move" **costs a stone from your budget**.
  *   If P1 steals P2's strategy, P1 is effectively playing P2's game *plus* the opening throwaway stone *plus* any dummy moves required.
  *   P1 is spending more budget than P2 would have in the simulation.
  *   If the winning strategy requires exact efficiency (e.g., a path of exactly 10 stones), P1 might bankrupt themselves by playing the 11th or 12th stone unnecessarily.

  **Facilitator Check-in:**
  > "Does the 'extra stone is harmless' rule still hold?"
  > *Expected Consensus:* No. The stone helps connectivity, but the *act of placing it* costs resources. The proof breaks.

  **Who Wins Stint Hex?**
  > "So, who wins Stint Hex? Player 1 or Player 2?"
  > *Honest Answer:* "We don't know yet. It depends on the budget vs. board size. If the budget is tight, conservation matters, and P2 might win by efficiency. If the budget is loose, P1 might still win by aggression. The point isn't the answer; the point is that the **proof mechanism failed**. The non-constructive argument relies on specific rules (monotonicity, infinite/uncosted moves). Change the rules, and the existence proof vanishes."

  ---

  ## 5. Phase 4: The Poisoned Gift & Debrief (1:10 – 1:20)
  **The Second Beat (5 mins):**
  > "In Hex, if I sneak a stone onto the board for you, it's a gift. It can never hurt you.
  >
  > **Challenge:** Name or invent a game where me placing a stone for you is a **curse**."

  *   *Likely Answer:* **Misere Hex** (If you connect, you lose). If I place a stone that completes your chain, I kill you.
  *   *Alternative:* **Nim** (sometimes adding a pile changes the parity to a losing state).
  *   *Takeaway:* Strategy stealing relies on **Monotonicity** (more is better). If the game is non-monotonic, the proof fails.

  **The Final Debrief (5 mins):**
  **Name the Beast:**
  > "This argument has a name: **The Strategy-Stealing Argument**. It was popularized by John Nash (who invented Hex).

  **Addressing the Friend:**
  > "My friend called this a 'parlour trick.' She said: 'It tells you nothing you can use.'
  >
  > She is half-right. It doesn't give you **Knowledge How** (the moves). It gives you **Knowledge That** (the winner).
  >
  > Why does this matter?
  > 1.  **Search Space:** It tells you where to look. Don't waste time programming an AI to play perfect Player 2 in Hex. It doesn't exist.
  > 2.  **Truth vs. Construction:** In Maths and Philosophy, we often want to know if something *exists* before we try to *find* it. This proof separates existence from construction.
  > 3.  **The Limits:** As you saw with Stint Hex, these proofs are fragile. They depend on hidden premises (like 'stones are free'). Finding those premises is where the real work happens."

  ---

  ## 6. Troubleshooting: What Goes Wrong
  **Failure Mode 1: "Just tell us the winning move."**
  *   **Symptom:** Frustration. Students feel cheated.
  *   **Fix:** Validate. "That is exactly the feeling of a non-constructive proof. You know the treasure exists, but you don't have the map. Sit with that discomfort. That discomfort is the philosophical point."

  **Failure Mode 2: "Finite games are determined anyway." (Zermelo's Theorem)**
  *   **Symptom:** A keen student points out that in any finite, perfect information, no-chance game, one player *must* have a winning strategy. So proving P1 wins adds nothing.
  *   **Fix:** This is the strongest objection. Acknowledge it.
      *   "Zermelo tells us *someone* wins. He doesn't tell us *who*.
      *   Without Strategy Stealing, the options are {P1 wins, P2 wins, Draw}.
      *   Hex rules eliminate Draw. So it's {P1, P2}.
      *   Strategy Stealing eliminates P2.
      *   We went from 50/50 uncertainty to 100% certainty about *which* player, without doing any calculation. That is information gain."

  **Failure Mode 3: Stint Hex Confusion**
  *   **Symptom:** They think the extra stone still helps connectivity, so P1 should still win.
  *   **Fix:** Draw a path on the whiteboard that requires exactly 5 stones. Show a budget of 5.
      *   "P2 wins with 5 stones."
      *   "P1 plays throwaway (1 left). Tries to follow P2's path. Strategy says 'play here', but 'here' is taken. P1 plays 'there' (2 left). P1 runs out of stones before connecting."
      *   "The stone helped the path, but the *cost* broke the budget."

  **What Only You Can Say (The Meta-Lesson):**
  The activity shows them the *mechanics* of the contradiction. What only you can articulate is the **epistemological status** of the result.
  *   The activity shows: "The logic breaks if stones cost money."
  *   You say: "This is why Computer Science cares about this. If I tell you a solution exists but give you no algorithm to find it, is that maths or magic? Today you touched the boundary between knowing a truth and holding a tool."

  ---

  ## Materials Checklist
  1.  **Hex Boards:** 8 printed sheets (7x7 grid). Laminate if possible for reuse.
  2.  **Counters:** 20 Red, 20 Blue per pair.
  3.  **Index Cards:** 8 cards, each written "BUDGET: 12 STONES".
  4.  **Whiteboard:** Pre-write the Hex Rules. Leave space for the "Proof Steps."
  5.  **Timer:** Visible to you (keep the pace).

  ## Facilitator Notes
  *   **Silence is okay.** When they are trying to figure out the "throwaway move" logic in Phase 2, let them struggle for a full 3 minutes.
  *   **Don't save them.** If they play Stint Hex and don't notice the budget issue, ask: "Count how many stones you placed. Count how many your opponent placed. Who ran out first?"
  *   **The "Friend" Story:** Use your anecdote in the debrief. It humanizes the philosophical tension. "I argued about this last night..." makes the abstract concrete.
