  **Why the discarded-ontology argument overreaches**
  The applicants claim structure survives theory change while ontology does not. This relies on a distinction that cannot hold under scrutiny. Structure is always structure *of* something. To claim mathematical relations persist without committing to what bears those relations is to risk triviality; almost any formalism can be mapped onto some object collection. To avoid this, the applicants must specify which relations are physically significant. But once they specify that these relations must be causal, dynamic, or natural, they have quietly reinstated an ontological commitment. They are no longer describing pure structure; they are describing the behavior of specific entities. By refusing to name the relata, the programme claims a neutrality it cannot possess. It promises continuity without paying the metaphysical cost, leaving the central claim hollow. Furthermore, the argument that mathematics reappears as a limiting case assumes the meaning of those mathematical terms remains constant across theory change, which is historically dubious. Without ontology, structural realism collapses into instrumentalism, predicting nothing about the world itself. The friend's objection highlights that thickening the definition of structure to avoid triviality inevitably smuggles back the very entities the programme claims to suspend. We cannot fund a programme whose core thesis dissolves when asked what the structure is a structure of, nor one that mistakes formal retention for physical continuity.

  **The strongest case for the option you reject**
  The case for rejecting this programme outright is formidable and rests on our charter's integrity. We are mandated to fund empirically anchored research. The applicants' definition of disconfirmation—a successor theory retaining none of their structures—is vacuous; it pushes refutation indefinitely into the future. Meanwhile, we have a fully costed tabletop experiment testing gravitational superposition ready to fund. That project offers genuine empirical risk and potential falsification within the funding period. Choosing the structural programme over the experiment signals that our council tolerates metaphysical speculation disguised as physics. It diverts resources from work that could actually constrain theory to work that merely interprets it. For the three members urging rejection, this is not just about philosophy; it is about accountability to the public mandate for scientific progress, not just scientific commentary. Funding this programme sets a precedent that allows theoretical groups to bypass empirical accountability by redefining success as mathematical survival rather than predictive power.

  **Conditions**
  To proceed, the programme must accept two binding conditions. First, within eighteen months, the PIs must produce a joint statement clarifying the ontological status of the "surviving structures," explicitly addressing whether these structures require relata or stand alone. Second, the programme must establish a liaison with the experimental gravity group to ensure their structural claims constrain or are constrained by emerging empirical data, specifically regarding gravitational superposition. Failure to meet the first condition triggers a review for termination; failure to meet the second requires reallocation of funds to experimental collaboration. This ensures the work remains tethered to physical reality rather than drifting into pure mathematics. The mid-term review will be conducted by a sub-committee including one member from the experimental faction. This guarantees that the structural work does not become insular. By tying continued funding to ontological clarity and experimental engagement, we satisfy the charter's spirit without extinguishing a potentially valuable line of inquiry. It forces the applicants to answer the hard questions they currently evade.
