  # Which Extinction Pessimist Are You?
  ### A Conceptual Decision Tree for Seminar Discussion

  **Instructions:** This exercise maps your intuitions about human extinction. Read each scenario and question carefully. Follow the path that matches your judgment. At the end, you will land on one of eight positions. There are no "correct" answers, only coherent ones.

  ---

  ### The Decision Tree

  **Node 1: The Sealed Dome**
  *Scenario:* The last generation of humans lives full, happy lives inside a sealed dome. When they die of old age, humanity ends painlessly. There are no descendants, no mourners, and no one left to remember us.
  *Question:* Setting aside the deaths themselves, is the end of humanity **worse** than if we had continued?
  *   **No** → Go to **Node 2**.
  *   **Yes** → Go to **Node 3**.

  **Node 2: The Valence Check**
  *Question:* In the Sealed Dome, is the end of humanity actually **better** than continuation (e.g., because it prevents future suffering)?
  *   **Yes** → **Leaf 7 (Suffering-Focused)**.
  *   **No** → **Leaf 1 (Austere)**.

  **Node 3: The Quietist Challenge**
  *Question:* Is the "badness" of extinction a hard fact about the universe, or does it merely express our emotional attitude?
  *   **Merely Attitude** → **Leaf 8 (Quietist)**.
  *   **Hard Fact** → Go to **Node 4**.

  **Node 4: The Successor Reserve**
  *Scenario:* Immediately after humanity ends, an equally flourishing, culturally unrelated alien species arises and creates just as much value as we would have.
  *Question:* Does the existence of these aliens **fully compensate** for the loss of humanity?
  *   **Yes** (Value is Universal) → Go to **Node 5**.
  *   **No** (Value is Human-Specific) → Go to **Node 6**.

  **Node 5: The Frozen Vault**
  *Scenario:* Aliens find a vault of human embryos. They revive them, and the new humans live good lives, but they know nothing of our history, projects, or culture.
  *Question:* Is the loss repaired because **good lives exist**, or is there still a loss because **value itself** was disconnected?
  *   **Good Lives Exist** → **Leaf 2 (Impersonal Future-People)**.
  *   **Value Disconnected** → **Leaf 6 (Plenitude)**.

  **Node 6: The Museum & Sterilization Combo**
  *Scenario A (Museum):* The last humans complete all projects and build an archive no one will ever see.
  *Scenario B (Sterilization):* A future society chooses painless sterilization over risky continuation.
  *Question:* In these cases, what is the **primary** reason extinction is bad?
  *   **Just that future people exist** (to sustain current meaning) → **Leaf 4 (Collective-Afterlife)**.
  *   **That moral/civilizational improvement stops** → **Leaf 5 (Stewardship)**.
  *   **That human history/culture has no successors** → **Leaf 3 (Species-Relative)**.

  ---

  ### The Eight Positions (Leaves)

  **1. The Austere View**
  *Commitment:* There is no extra loss at all; once the deaths are accounted for, extinction is neutral.
  *Awkward Implication:* You must regard the end of humanity as no more significant than the end of a single life, provided that life was complete.

  **2. The Impersonal Future-People View**
  *Commitment:* The extra loss is just the missing good lives and could in principle be compensated by creating different well-off beings.
  *Awkward Implication:* It does not matter *who* lives in the future, only that *someone* does; humanity is replaceable by aliens.

  **3. The Species-Relative View**
  *Commitment:* The loss is that human projects, history, or culture would have no successors.
  *Awkward Implication:* You value the continuity of *our* story more than the existence of other flourishing civilizations that are not ours.

  **4. The Collective-Afterlife View**
  *Commitment:* Extinction retroactively undermines the point or intelligibility of our current valuing, even if no future person is deprived.
  *Awkward Implication:* Your current work loses meaning if the future ends, even if you never know the future will end.

  **5. The Stewardship View**
  *Commitment:* Humanity is a valuable cumulative project that would be cut short.
  *Awkward Implication:* A stagnant future humanity that survives but never improves might be less valuable than a noble extinction.

  **6. The Plenitude View**
  *Commitment:* Any loss is a reduction in the total amount, variety, or quality of value in the universe, human or not.
  *Awkward Implication:* Value exists independently of human experience, so the universe becomes objectively "poorer" even if no one is there to notice.

  **7. The Suffering-Focused View**
  *Commitment:* Extinction is not bad beyond the deaths and may even be preferable because it prevents future harm.
  *Awkward Implication:* You might endorse sterilization or non-procreation as a moral duty to prevent potential future suffering.

  **8. The Quietist View**
  *Commitment:* The extra question has no further factual answer and our judgments merely express attitudes.
  *Awkward Implication:* There is no truth of the matter to be found; debating extinction risk is like debating whether chocolate is better than vanilla.

  ---

  ### Scoring Key & Meta-Commentary

  **Mapping Your Path:**
  *   **Node 1 (No) → Node 2 (No):** Leaf 1 (Austere)
  *   **Node 1 (No) → Node 2 (Yes):** Leaf 7 (Suffering-Focused)
  *   **Node 1 (Yes) → Node 3 (Attitude):** Leaf 8 (Quietist)
  *   **Node 1 (Yes) → Node 3 (Fact) → Node 4 (Yes) → Node 5 (Lives):** Leaf 2 (Impersonal)
  *   **Node 1 (Yes) → Node 3 (Fact) → Node 4 (Yes) → Node 5 (Value):** Leaf 6 (Plenitude)
  *   **Node 1 (Yes) → Node 3 (Fact) → Node 4 (No) → Node 6 (Future People):** Leaf 4 (Collective-Afterlife)
  *   **Node 1 (Yes) → Node 3 (Fact) → Node 4 (No) → Node 6 (Improvement):** Leaf 5 (Stewardship)
  *   **Node 1 (Yes) → Node 3 (Fact) → Node 4 (No) → Node 6 (Culture):** Leaf 3 (Species-Relative)

  **Notes on Logical Space:**
  *   **Unoccupied Nodes:** This tree is "full"; every coherent combination of answers leads to a leaf. There are no empty branches, though some paths (like Node 5) assume that "Value Disconnected" is distinct from "Good Lives," which some may find splitting hairs.
  *   **Indistinguishable Leaves:** **Leaf 3 (Species-Relative)** and **Leaf 5 (Stewardship)** are the hardest to separate. Both require human successors. To pull them apart, you would need a case of **The Degenerate Future**: humans continue but become morally worse. Leaf 5 would see this as a loss (progress halted); Leaf 3 might see it as acceptable (continuity preserved).
  *   **Constraint Note:** The prompt requested the first branch route "No" directly to the Austere leaf. To accommodate the eighth leaf (Suffering-Focused), Node 2 was added as an immediate follow-up. Strictly speaking, Leaf 7 and Leaf 1 share the "No Badness" intuition but diverge on whether extinction is *good*.

  **Discussion Prompt:**
  *Compare your result with a neighbor. If you landed on different leaves, identify the specific Node where your paths diverged. Was it a disagreement about facts (Node 3), scope (Node 4), or the nature of value (Node 5/6)?*
