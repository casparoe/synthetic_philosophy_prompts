answer: |-
  The operating room was loud, but not with noise. It was loud with urgency. The monitors beeped fast, the suction hissed, and voices snapped out short commands. Blood covered the drapes. It covered Elena's gloves.

  For most people, the sight of an open wound triggers a flinch. A tightening in the gut. A desire to look away or make it stop immediately. Elena felt none of that. When she looked at the tear in the boy's side, she did not see a tragedy. She saw a map. She saw the red muscle, the white fascia, the blue vein that needed tying. The image entered her eyes and went straight to her hands without stopping at her heart to cause pain.

  She stitched quickly. Her hands did not shake. Around her, the nurses moved with tense shoulders, their faces tight with the shared burden of the injury. Elena felt only the weight of the needle driver and the texture of the tissue. She knew, intellectually, that this was bad. She knew the boy would wake up hurting. She knew his mother was crying in the waiting room. But inside her own chest, there was no matching ache. There was only the work.

  An hour later, the boy was in recovery. He was twelve years old, named Leo. He was pale against the white sheets, hooked to machines that breathed for him and pumped medicine into his veins. The emergency was over. Now there was only the quiet hum of the ventilation and the slow rise of his chest.

  Elena stood by the bed. She checked the numbers on the screen. She looked at the dressing on his abdomen. It was clean. The bleeding had stopped. She reached out to adjust the blanket over his shoulder.

  Leo's eyes were open. They were glassy with medication, but focused on her. He had seen her face during the worst of it. He had seen her standing over him when he was waking up, calm and still while everyone else rushed.

  "Doctor?" his voice was a whisper, cracked and dry.

  Elena leaned in. "I'm here, Leo. You're safe."

  He swallowed hard. His hand twitched on the sheet, looking for something to hold. She gave him her hand. Her grip was warm, steady. He didn't pull away, but his eyes searched hers. He was looking for a reflection of his own fear. He wanted to know if the horror he felt was visible on her face.

  "Does it hurt you?" he asked. "To see me like this?"

  The question hung in the air between the beep of the monitor and the hiss of the oxygen.

  Elena paused. She could lie. She could say, *Yes, it breaks my heart.* It would be the kind thing to say. It would make him feel normal, understood, shared. But it was not true. Her heart was not breaking. Her stomach was not turning. If she said yes, she would be teaching him that care requires suffering, and she didn't know if that was a lesson she wanted to give.

  If she said no, he might think she was cold. He might think he was just meat to her, a broken machine she fixed without feeling.

  She looked at their joined hands. Her hand was still. His was trembling.

  "No," Elena said. Her voice was soft, but clear. "It doesn't hurt me."

  She saw the flicker in his eyes. The distance opening up. She needed to bridge it before he fell across the gap.

  "But," she continued, keeping her hand over his, "that is why I can stay. When things hurt too much, people have to look away. They have to leave the room to catch their breath. I don't have to do that."

  She shifted the blanket higher, tucking it around his arm. Her movements were precise, not hurried.

  "I can look right at it," she said. "I can look right at the hurt, and I don't have to blink. That means I won't leave you alone while you go through it. My not hurting... it lets me stay here for you."

  Leo watched her. The trembling in his hand slowed. He didn't look fully comforted, but the fear of abandonment receded. He understood that her steadiness was a shelter, not a wall.

  "Okay," he whispered.

  "Okay," she said. "The medicine will make you sleep now. I'll be right outside if you need me."

  She waited until his eyelids fluttered shut. She checked the IV line one more time. She ensured the call button was within reach of his good hand. Only then did she step back.

  Walking out of the recovery room, the automatic doors slid open with a quiet swoosh. The hallway was bright and busy. A nurse rushed past with a tray of instruments, looking exhausted. A family huddled in the waiting area, heads bowed.

  Elena stopped by the nurses' station. She placed her hand on the counter. She pressed her thumb against the edge of the laminate, hard enough to leave a white mark on the skin. She felt the pressure. She felt the shape of the edge. But there was no sting. No urge to pull away.

  She wondered, as she often did, if she was missing something vital. When Leo's mother came in later, she would cry. She would hold her son and weep because his pain was her pain. That was love, wasn't it? The ability to be wounded by another's wound.

  Elena did not feel that wound. She felt only the responsibility to bind it.

  She watched the mother through the glass window of the recovery room. The woman rushed to the bed, her face crumpling as she saw the tubes and the bandages. She reached out, then pulled back, afraid to touch, overwhelmed by the sight of her son's suffering.

  Elena turned away from the window. She could not give the mother what she did not have. She could not offer shared tears. But she could offer the thing her condition gave her. She could offer the hands that did not shake. She could offer the eyes that did not look away.

  She walked down the hall toward the next trauma bay. The pager on her hip buzzed. Another accident. Another body broken.

  Most people would feel a heavy sink in their stomach at the sound. Elena felt only a shift in focus. She straightened her coat. She did not know if her care was colder than the others, or if it was simply a different kind of heat. She only knew that when the world was burning, someone had to be the water. And water does not burn when it touches the fire. It just absorbs the heat until the fire goes out.

  She pushed open the doors to the next room. She was ready.
