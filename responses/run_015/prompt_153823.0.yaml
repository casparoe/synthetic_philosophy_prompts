answer: |-
  Here is the straight verdict you asked for, stripped of the usual diplomatic hedging.

  ### 1. The Switch Verdict
  **Should you become an epistemicist?** **No.**
  **Confidence:** 90%.

  Epistemicism solves the logical problems of vagueness by positing a metaphysical miracle (sharp boundaries in the world/meaning that are in principle unknowable). Supervaluationism (SV) solves them by positing a semantic mechanism (truth as supertruth) that creates metaphysical opacity. The epistemicist price is too high: it requires believing that there is a fact of the matter about whether a specific nanometer difference makes a man bald, and that this fact is constitutive of meaning. SV is semantically more plausible, even if metaphysically thin. Do not switch unless you are prepared to buy the "magic cutoff."

  ### 2. The Defeater Ranking (Internal vs. External)
  You asked what counts *against* SV, ranked by severity, distinguishing between complaints critics make and complaints SVists should concede.

  **Tier 1: Fatal (and Conceded by Sophisticated SVists)**
  *   **The Sharp Boundary of Admissibility.**
      *   *The Charge:* SV defines a proposition as true if it is true on *all admissible precisifications*. But is the set of "admissible precisifications" itself sharply defined? If yes, you have reintroduced a sharp boundary at the meta-level (vagueness is just pushed back). If no, you need a precisification of admissibility, leading to regress.
      *   *SV Concession:* **Yes.** This is the view's Achilles heel. Most SVists (e.g., Rosanna Keefe) concede that standard SV implies a sharp boundary between admissible and inadmissible precisifications.
      *   *Severity:* **85% Fatal.** Unless you move to "global supervaluationism" or accept higher-order vagueness in the admissibility relation (which complicates the logic immensely), this undermines the claim that SV *eliminates* sharp boundaries rather than hiding them.
      *   *Confidence in Defeat:* 0.85.

  **Tier 2: Fatal (Empirical/Logical)**
  *   **Non-Idempotence of "Definitely".**
      *   *The Charge:* In SV, "Definitely $P$" ($DP$) is analyzed as $\forall p \in A (P \text{ is true on } p)$. Logically, this makes $D$ idempotent: $DDP \equiv DP$. If you definitely definitely $P$, you just definitely $P$.
      *   *SV Concession:* **Yes.** SV is committed to this collapse.
      *   *Severity:* **70% Fatal.** If linguistic data robustly shows that speakers distinguish "It is definitely red" from "It is definitely *definitely* red" (e.g., in betting behavior or confidence scaling), SV is empirically falsified regarding the semantics of natural language.
      *   *Confidence in Defeat:* 0.70.

  **Tier 3: Awkward (Conceded but Biteable)**
  *   **Failure of Classical Inference (Conditional Proof).**
      *   *The Charge:* $P \vdash Q$ does not guarantee $\vdash P \to Q$ in the object language if $P$ is borderline.
      *   *SV Concession:* **Yes.** SVists own this. They argue classical logic holds for *supertruth*, not for truth simpliciter in the object language.
      *   *Severity:* **20% Fatal.** This is a technical cost, not a refutation. It makes the logic non-standard, but not incoherent.
      *   *Confidence in Defeat:* 0.20.

  ### 3. The Experiment: Higher-Order Vagueness Data
  **Scenario:** Subjects give stable verdicts for 3 levels of "borderline," then jitter/refuse.
  **Question:** Is this evidence for the finite-cutoff (epistemicist) picture?
  **Verdict:** **No.** It should not move you.

  **Reasoning:**
  The epistemicist claims there is a *fact* about where the hierarchy stops (e.g., "It is borderline-borderline, but not borderline-borderline-borderline"). The SVist claims there is *no fact* at the higher levels.
  *   **Epistemic Prediction:** Subjects are guessing around an unknown threshold. Jitter is noise around a sharp line.
  *   **SV Prediction:** Subjects are encountering semantic indeterminacy. Jitter is the *correct* response to a lack of truth conditions.

  The data (jitter/refusal) is consistent with *both*. However, the SVist has the better explanation for the *refusal*. If there were a fact (epistemicism), a perfect reasoner would answer yes/no. The fact that competent speakers *refuse* to answer suggests the question lacks a truth value, not that they are ignorant of it.
  *   **How much should this move you?** **<5%.** The data concerns *access* (epistemology). SV is a theory of *truth conditions* (semantics). SV can happily grant that our access to the admissibility relation is limited (we can't tell which precisifications are admissible beyond level 3) without conceding that the hierarchy *ontologically* stops there. The SVist replies: "The hierarchy doesn't stop; it becomes indeterminate whether it continues." That is a coherent semantic position that fits the jitter data perfectly.

  ### 4. The Unfalsifiability Charge
  **Worry:** The space of admissible precisifications is a free parameter. SV predicts everything.
  **Verdict:** **Partially Valid, but not Fatal.**

  **What constrains the space?**
  1.  **Usage Facts:** Admissibility is not arbitrary. A precisification that makes "This is red" false for a clear-case fire engine is *inadmissible* because it violates actual linguistic practice.
  2.  **Eligibility:** Following David Lewis, some precisifications are more "eligible" based on natural properties.

  **What counts as a Predictive Failure?**
  SV is falsified if speakers exhibit stable, confident intuitions that violate the **Supertruth Constraint**.
  *   *Example:* If speakers confidently assert "$P$ is true" while simultaneously accepting "There is an admissible precisification where $P$ is false." SV says this is incoherent (Truth = Supertruth). If this is a stable feature of natural language (a "truth-value gap realist" intuition), SV is falsified.
  *   *Example:* If speakers reject the Law of Excluded Middle ($P \lor \neg P$) for *clear* cases. SV preserves LEM for clear cases. If data shows speakers reject LEM even for "This is a triangle," SV fails.

  **Has it been qualified into unfalsifiability?**
  **Yes, often.** Many SVists treat "admissibility" as a primitive that flexes to save intuitions. To avoid this, you must commit to a specific theory of admissibility (e.g., "consistent with actual usage + causal history"). Once you fix that theory, SV becomes vulnerable. If you leave it open, your friend is right: it's a modeling tool, not a theory.

  ### 5. The Case SV Literally Cannot Describe
  You asked for a case the view cannot describe. Here it is:

  **Non-Idempotent Definiteness with Classical Logic.**
  Suppose we find a language where:
  1.  Speakers distinguish $DP$ from $DDP$ (e.g., they bet differently on them).
  2.  Speakers insist that Classical Logic (Conditional Proof, Contraposition) holds for the object language *even in the penumbra*.
  3.  Speakers insist there are truth-value gaps (neither $P$ nor $\neg P$ is true).

  **SV cannot model this triad.**
  *   SV gets (3) and (2) (for supertruth), but fails (1) because $D$ is a universal quantifier ($DDP \equiv DP$).
  *   Epistemicism gets (1) and (2), but fails (3).
  *   Degree theories (Fuzzy) get (1) and (3), but fail (2).

  If natural language robustly exhibits all three, SV is logically excluded. Currently, the evidence on (1) is the biggest threat. If "definitely" behaves like a modifier that adds strength rather than a quantifier that fixes boundaries, SV's core definition of truth is wrong.

  ### Summary Advice for the Reading Group
  1.  **Concede the Admissibility Boundary.** Tell your friend: "You're right that standard SV pushes vagueness to the meta-level. That's the cost of doing business without magic cutoffs."
  2.  **Hold the Line on the Experiment.** Argue that jitter is evidence of *indeterminacy*, not ignorance. Epistemicism cannot explain why the question *ceases to make sense* at level 4; it can only say we are ignorant. SV explains the nonsense.
  3.  **Fix the Parameters.** To avoid the unfalsifiability charge, commit to a constraint on admissibility (e.g., "Admissible = Consistent with communal usage dispositions"). If SV can't fit the data within *that* constraint, it fails.
  4.  **Stay Supervaluationist.** The epistemicist solution is more damaging to the philosophy of language than the SV problem of admissibility. SV preserves the link between meaning and use; epistemicism severs it.

  **Final Confidence in SV Viability:** 65%. It is the best of a bad lot, provided you don't claim it solves *all* higher-order vagueness without residue.
