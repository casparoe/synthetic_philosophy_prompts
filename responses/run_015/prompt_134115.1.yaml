  **INTERNATIONAL COMMISSION ON STRATIGRAPHY**
  **SUBCOMMISSION ON QUATERNARY STRATIGRAPHY**
  **WORKING GROUP ON ANTHROPOCENE FORMALIZATION (WGAF)**

  **CALL FOR NOMINATIONS: CANDIDATE GLOBAL BOUNDARY STRATOTYPE SECTION AND POINT (GSSP) FOR THE BASE OF THE ANTHROPOCENE SERIES/EPOCH**

  **Reference:** WG-ANTH-2025-CFN
  **Date:** 14 February 2025
  **Status:** Open for Submission

  **1.0 ELIGIBILITY AND SUBMISSION PROTOCOL**
  1.1 Nominations may be submitted by National Geological Surveys, accredited research consortia, or standing committees of the International Union of Geological Sciences.
  1.2 Private entities may submit candidates only if accompanied by a letter of sovereign guarantee ensuring perpetual access rights independent of property law fluctuations.
  1.3 Submissions must identify a single physical horizon within a continuous stratigraphic sequence. Conceptual boundaries, asymptotic curves, or diffuse process-onsets are ineligible.

  **2.0 SELECTION CRITERIA AND SCORING RUBRIC**
  Candidate sections will be evaluated by the WGAF Voting Membership against the following weighted criteria. A minimum score of 85/100 is required for ratification.

  *   **2.1 Global Synchrony (30 points):** The marker horizon must demonstrate depositional simultaneity across all latitudes and longitudes within a margin of error not exceeding ±12 months. Diachronous signals (e.g., gradual carbon isotope excursions) will be penalized unless a specific isochronous sub-layer can be isolated.
  *   **2.2 Material Permanence (25 points):** The marker must possess chemical and physical stability sufficient to remain legible to standard stratigraphic instrumentation for a minimum of 10^7 years. Candidates composed of biodegradable polymers or unstable isotopes must demonstrate a decay product with equivalent diagnostic utility.
  *   **2.3 Civilizational Protection (20 points):** The type section must be located within a zone guaranteed stable against future excavation, urbanization, or resource extraction by the species responsible for the marker. Nominations situated in active economic zones must include a binding treaty designating the site as a Stratigraphic Sanctuary.
  *   **2.4 Accessibility (15 points):** The section must be accessible to qualified researchers without requiring specialized atmospheric or submersible equipment, barring conditions where the species responsible for the marker no longer possesses such technology.
  *   **2.5 Diagnostic Clarity (10 points):** The boundary must be distinguishable from background Holocene noise without recourse to subjective interpretation.

  **3.0 ILLUSTRATIVE CANDIDATE PROFILE**
  To assist nominators, the WGAF provides the following exemplar of a compliant marker horizon, previously assessed during preliminary scoping.

  *   **Candidate:** The Vitrified Municipal Slag Horizon (VMSH).
  *   **Composition:** High-density silicate glass formed from the incineration of mixed urban waste, containing distinct trace ratios of rare-earth elements consistent with mid-century electronics manufacturing.
  *   **Rationale:** The VMSH offers superior density contrast against surrounding sedimentary matrices. While deposition is diachronous relative to urbanization fronts, the global atmospheric dispersal of fly ash associated with vitrification provides a synchronous geochemical halo.
  *   **Risk Assessment:** High susceptibility to re-mining for rare-earth recovery. Requires Class-4 Stratigraphic Sanctuary status.

  **4.0 DEEP-TIME LEGIBILITY VERIFICATION**
  All candidates must undergo modeling to ensure readability by future observers. The following log excerpt demonstrates the required standard of clarity:

  > **Field Log 744-X (Post-Holocene Erosion Surface)**
  > **Observer:** Autonomous Stratigraphic Unit 9
  > **Context:** 12.4 Myr post-deposition
  > **Observation:** Boundary identified at 4.2m depth. Distinct polymer fusion layer present. Carbon signature indicates rapid combustion event. No biological continuity across boundary. Classification: Anthropocene Base confirmed.
  > **Note:** Underlying strata show signs of deliberate smoothing.

  **5.0 VOTING MEMBERSHIP AND RATIFICATION**
  5.1 The Voting Membership shall consist of twenty-four (24) appointed stratigraphers, representing all major continental plates.
  5.2 A supermajority of 60% is required for initial approval.
  5.3 In the event of a tied vote, the boundary shall be deemed undefined until the next geological cycle.
  5.4 It is acknowledged that informal usage of the term "Anthropocene" may continue regardless of formal ratification status. This usage shall not be considered evidence of stratigraphic validity.

  **6.0 RESOLUTION OF SYNCHRONY DISCREPANCIES**
  6.1 The WGAF acknowledges the inherent difficulty in identifying a physically synchronous marker for a process defined by cumulative, diachronous human activity.
  6.2 In instances where no physical horizon meets the ±12 month synchrony requirement stipulated in Clause 2.1, the Working Group is authorized to invoke the *Procedural Isochron Clause*.
  6.3 Under this clause, the base of the Anthropocene shall be defined not by the deposition of the marker, but by the timestamp of the ratification vote itself.
  6.4 This timestamp shall be backdated to the candidate section selected in Clause 2.0. The physical layer at that section corresponding to the vote date shall be artificially marked with a durable plaque bearing the coordinates and the date of approval.
  6.5 This ensures that while the phenomenon may be diffuse, the boundary remains sharp, globally synchronous, and preservable for the deep future.

  **END OF CALL**
