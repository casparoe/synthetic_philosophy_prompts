      *   *Editorial Responsibility:* Flemming Rose (culture editor) defended the decision publicly for years. He didn't hide. He made it a qualitative stand. Kierkegaard says the press *inherently* avoids responsibility. If a specific editor owns it, does it cease to be "The Press" in Kierkegaard's negative sense?
      *   *Transnational Media:* Kierkegaard thought of local papers. The 2005 crisis involved Al Jazeera, internet forums, etc. The "Public" was global, not national.

  5.  **Evaluating the "Informational Leveling" Idea:**
