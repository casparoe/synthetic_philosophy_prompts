  before i pick a side, lay out the desiderata any theory of specieshood actually has to satisfy. not just the textbook stuff -- i want the constraints from weird biology (ring species, asexual lineages, hybrid zones where back-crossing blurs boundaries) plus a philosophical one: the theory should tell us whether two organisms count as same-species in a counterfactual scenario where they never share a habitat or interbreed. for each desideratum say why it matters and whether its negotiable. specifically flag which ones kill the biological species concept vs the phylogenetic one, and whether any subset is jointly unsatisfiable given what we know about gene flow. write it casual, no bibliography, just the spec and a quick failure-note for the two main camps.
reasoning: |-
