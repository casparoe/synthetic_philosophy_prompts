answer: |-
  Here's the spec. If you're shopping for a Species Concept, these are the features you need it to have. I've flagged the dealbreakers, the nice-to-haves, and which concept gets bloodied by which requirement.

  ### 1. The Asexual Accommodation
  **The Constraint:** The theory must classify organisms that don't have sex (bacteria, some lizards, plants that clone themselves).
  **Why it matters:** Sex is not universal. If your definition of "species" relies on mating, you've just erased a huge chunk of the tree of life.
  **Negotiable?** No. Not if you want a universal theory.
  **Who it kills:** **Biological Species Concept (BSC).** Hard kill. BSC defines species by reproductive isolation. No sex = no isolation mechanism = no species.
  **Phylogenetic Species Concept (PSC):** Survives. It looks at shared ancestry and traits, not mating.

  ### 2. The Ring Species / Transitivity Test
  **The Constraint:** The theory must handle populations arranged in a ring around a barrier (e.g., salamanders around a valley). Population A breeds with B, B with C... but Z does not breed with A.
  **Why it matters:** Evolution is gradual. Boundaries are often fuzzy in space. A good theory shouldn't crash when faced with a continuum.
  **Negotiable?** No. This is a real biological phenomenon. Ignoring it makes the theory factually wrong.
  **Who it kills:** **BSC.** It violates logical transitivity. If A=B and B=C, then A must =C. But in ring species, A≠C. BSC can't logically resolve this without arbitrary cutting.
  **PSC:** Survives, but tends to "oversplit." It will likely call A, B, and C distinct species because they have distinct trait combinations, which feels intuitively harsh.

  ### 3. The Hybrid Zone Tolerance
  **The Constraint:** The theory must account for distinct lineages that meet and exchange genes (introgression) without collapsing into one homogenous blob. Think wolves and coyotes, or many plant species.
  **Why it matters:** "Leaky" boundaries are the norm, not the exception. Strict isolation is rare.
  **Negotiable?** Moderately. You *could* argue that if they swap genes, they are one species, but that lumps too much (e.g., humans and Neanderthals).
  **Who it kills:** **BSC (Soft Kill).** BSC struggles to define where "enough" interbreeding stops counting as isolation. It forces a binary (isolated/not) on a gradient.
  **PSC:** Survives better. It focuses on whether the lineages maintain distinct diagnostic traits despite the gene flow.

  ### 4. The Counterfactual Isolation Test (The Philosophical One)
  **The Constraint:** The theory must determine if two organisms are the same species even if they are geographically separated (allopatric) and *never actually meet*, provided they *could* interbreed if they did.
  **Why it matters:** Most species live apart. If your theory requires an actual mating test to confirm specieshood, you can't classify anything until you put them in a cage together. We need to know if they *are* the same, not just if they *act* the same.
  **Negotiable?** No. A metaphysical claim about nature needs to hold in counterfactual scenarios.
  **Who it kills:** **BSC (Major Wound).** BSC relies on *actual* reproductive isolation. In pure allopatry, BSC proponents have to guess about "potential" interbreeding, which undermines the strict definition.
  **PSC:** Survives. It uses genetic distance or trait diagnosis to infer the relationship regardless of current geography.

  ### 5. The Operationality Constraint
  **The Constraint:** A field biologist must be able to apply the theory without sequencing every genome or running a 10-year breeding experiment.
  **Why it matters:** Conservation laws, hunting regulations, and ecology need names *now*.
  **Negotiable?** Yes. Truth is more important than convenience. But if it's impossible to use, it's useless.
  **Who it kills:** **BSC.** Testing reproductive isolation is hard, unethical, or impossible for extinct/rare species.
  **PSC:** Survives, but risks becoming too easy. You can split species based on a single DNA base pair, creating "taxonomic inflation."

  ### 6. The Evolutionary Independence Clause
  **The Constraint:** A species must represent a distinct lineage evolving separately from others (its own fate, its own adaptations).
  **Why it matters:** If the category doesn't map to an actual unit of evolution, it's just a human filing system, not biology.
  **Negotiable?** No. This is the whole point of having the concept.
  **Who it kills:** **Neither directly,** but it highlights the tension. BSC sees independence as *mechanism* (isolation). PSC sees it as *history* (lineage).

  ---

  ### The "No Free Lunch" Warning (Joint Unsatisfiability)
  Here's the bad news: **You cannot satisfy all of these simultaneously.**

  There is a fundamental incompatibility between **Desideratum 2 (Continuum)** and **Desideratum 6 (Independence/Discreteness)**. Evolution produces continuous variation (clines, rings, hybrid swarms). Taxonomy demands discrete boxes.
  *   If you prioritize the **Continuum**, you end up with one big species (lumping).
  *   If you prioritize **Discreteness**, you have to draw arbitrary lines through continuous data (splitting).

  Furthermore, **Gene Flow** breaks the tree structure. PSC assumes lineages diverge and stay diverged. BSC assumes populations isolate and stay isolated. Real biology is a network. If you demand a theory that handles asexuals, ring species, *and* provides discrete operational units, you are asking for a theory that contradicts the messy reality of gene flow. You have to pick which weirdness you're willing to ignore.

  ---

  ### Quick Failure Notes

  **Biological Species Concept (BSC)**
  *   **The Pitch:** Species are groups of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups.
  *   **The Failure:** It's a great concept for sympatric, sexual vertebrates. It falls apart everywhere else. It can't handle asexuals (fatal), it chokes on ring species (logical contradiction), and it's useless for allopatric populations where "potential" interbreeding is just a guess. It treats species as static endpoints rather than dynamic processes.

  **Phylogenetic Species Concept (PSC)**
  *   **The Pitch:** A species is the smallest diagnosable cluster of individual organisms within which there is a parental pattern of ancestry and descent.
  *   **The Failure:** It solves the asexual and allopatry problems, but it creates a new one: **Inflation.** Because every population has *some* unique genetic marker or trait, PSC tends to designate every local population as a distinct species. It risks losing the ecological meaning of "species" (a group that actually interacts) by focusing entirely on historical distinctness. It makes the tree of life look like a bush with infinite branches.
