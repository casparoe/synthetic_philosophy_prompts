      *   *Standard stuff:* Reproductive isolation, distinctness.
      *   *Weird biology:* Asexuals (BSC hates this), Ring Species (BSC hates this), Hybridization (BSC struggles, PSC struggles).
      *   *Philosophical:* Counterfactuals (If they *could* breed but don't, are they same species? If they live apart, are they same species?).
      *   *Practicality:* Taxonomists need to identify them.
      *   *Evolutionary Reality:* Species need to be real units of evolution, not just human categories.

      *Drafting the List:*
      1.  **The Asexual Accommodation:** Must handle bacteria/clones.
      2.  **The Continuum Problem (Ring Species):** Must handle gradual change across geography without arbitrary cuts.
      3.  **The Hybrid Tolerance:** Must handle leaky boundaries (gene flow).
      4.  **The Counterfactual Test (The Philosophical One):** Must handle allopatry (geographic separation) and potential interbreeding.
      5.  **The Operationality Constraint:** Scientists need to actually identify them in the field/lab.
      6.  **The Evolutionary Independence:** Species should be distinct evolutionary lineages.

  3.  **Evaluate Negotiability & Concept Killers:**
      *   *Asexual Accommodation:* Non-negotiable for a *universal* theory. Kills BSC immediately. PSC handles it okay.
      2.  *Continuum/Ring Species:* Non-negotiable for biological realism. Kills BSC (transitivity failure). PSC handles it by splitting (maybe too much).
