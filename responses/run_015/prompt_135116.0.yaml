      5.  *Operationality:* Highly negotiable (truth vs. utility), but if it's impossible to use, it's a bad tool. BSC is hard to test. PSC is easier but leads to lumping/splitting issues.
      6.  *Evolutionary Independence:* Non-negotiable for the concept to mean anything in biology. Both aim for this but define it differently.

  4.  **Address Joint Unsatisfiability:**
      *   The "Species Problem" exists because these constraints conflict.
      *   Specifically: *Discreteness* vs. *Continuity*. Evolution is a continuous process; species concepts demand discrete categories.
      *   Gene flow creates networks, not trees. PSC wants trees/clades. BSC wants isolated pools. Real biology is a messy web.
      *   Conclusion: You can't have a universal, discrete, operationally easy, and evolutionarily perfect concept simultaneously.

