      *   **Input:** A paragraph summarizing the Sleeping Beauty problem, the thirder/halfer positions, arguments (indifference, no new evidence, betting/Dutch book), a variant (toss on Monday night), and a conclusion (verbal dispute).
      *   **Specific Questions:**
          1.  Fairness of the thirder argument presentation (indifference vs. straw man).
          2.  Halfer commitment regarding "It is Monday" (P(Heads|Monday) = 1/2?).
