answer: |-
  Your coworker's fashion analogy correctly identifies the social transmission mechanism of moral change but ultimately fails because it conflates status loss with material interest and reduces ethical reasoning to mere aesthetic signaling.

  **The Analogy Map**
  *   **The Fashion Designer:** Moral entrepreneurs and intellectual elites (e.g., Enlightenment philosophers, abolitionists) who draft the new normative codes.
  *   **The Runway:** Institutions of high prestige where norms are displayed and validated, such as Parliament, royal courts, or high-society gatherings.
  *   **The Season Change:** The tipping point where a practice shifts from mandatory honor to optional eccentricity to shameful barbarism (e.g., the 1833 Slavery Abolition Act or the criminalization of dueling).
  *   **The Social Cost:** Ostracization and loss of standing within the elite reference group, making the practitioner feel "backward" rather than just wealthy.
  *   **The Critic:** The press, clergy, and political opponents who label the old practice not just outdated, but morally diseased.

  **Where the Mapping Breaks**
  The analogy collapses when treating lethal institutions as arbitrary aesthetic choices. Fashion is cyclical and superficial; morality claims universality and stakes lives. Treating slavery as "unfashionable" ignores that it was an economic engine protected by state violence, not a social habit dropped because elites got bored. In the US, slavery did not fade because it became embarrassing; it ended because of a civil war that killed 600,000 people. Dueling did not just go out of style; it was criminalized and prosecuted. The fashion model assumes voluntary adoption based on shame, whereas moral revolutions often require coercive law and physical force to dismantle entrenched interests. Furthermore, the analogy conflates status loss with interest loss. While Appiah argues honor codes drive change, he does not claim economics are irrelevant; rather, he argues economics alone rarely changes minds without an honor shift. Your coworker blurs this by suggesting the economic embarrassment *was* the status loss, ignoring that slaveholders often remained economically powerful even when morally stigmatized.

  **The Role of Rational Arguments**
  Her conclusion that rational arguments never drive moral change does not survive once you separate status shifts from actual reasoning. You are correct to invoke Williams: rational arguments against slavery and dueling existed for centuries before the practices ended, but they lacked traction. However, this does not mean the arguments were inert; it means they required the "honor code" shift to become psychologically actionable. The fashion analogy suggests the arguments were merely the packaging for the status shift, but in reality, the arguments provided the substantive content that allowed the status shift to occur. You cannot have a moral revolution based solely on aesthetics; the "designers" needed rational frameworks to convince the "critics" that the new season was actually *better*, not just newer. Rational arguments do not drive change alone, but they are the necessary blueprint that allows honor to align with justice rather than arbitrary trendiness. Your coworker mistakes the *velocity* of change (honor/status) for the *direction* of change (reason/morality).
