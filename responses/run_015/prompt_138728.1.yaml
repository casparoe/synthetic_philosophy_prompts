prompt: |-
  I'm a PhD student in philosophy — I work on agency and moral responsibility — and for the past year I've sat as the graduate member of our university's behavioural research ethics board. Tomorrow we have to decide on a proposal that is, as far as I can tell, the first genuinely interesting free-will study to come in front of us, and I've been asked to draft the memo that will carry the recommendation, so I want to get it right rather than fall back on boilerplate. The study is called "Can You Stop Yourself? Real-Time Detection of Movement Preparation and the Limits of Conscious Veto," and it's run by a cognitive neuroscientist in psychology with a philosopher as co-PI. Participants wear EEG and make self-paced button presses while watching a rotating clock hand, reporting where the hand was when they first felt the urge to move — the standard Libet arrangement, in which the slow negative buildup over motor areas that precedes movement is said to begin a few hundred milliseconds before the reported urge. The new part is the veto manipulation: in some blocks a classifier trained on the participant's own preparatory activity triggers a tone when it detects the buildup, and the participant has been instructed to cancel the movement on a subset of trials when they hear it; critically, some of those tones are yoked shams fired at matched latencies, so the team can ask whether cancellation tracks genuine detection of one's own preparatory activity or is just a reaction to an external cue. There is also a cueless condition in which participants simply try to abort as late as they can, which the PI describes as measuring a "point of no return" for self-cancellation. The PI's framing is that Libet himself stopped short of the determinist conclusion and appealed to precisely this sort of conscious veto, but that the existing attempts to test the veto give subjects an external prompt they would never have had outside the lab, and so don't really settle whether the veto is anything more than a response to a signal. Our neurosurgeon member thinks the underlying finding is settled and the study is methodologically straightforward; another member, a philosopher of action, thinks the design is conceptually confused until the PI says what would count as a successful veto and what would count against one.

  The second arm of the study is what I actually expect to be contested, and it's why I'm writing to you. After the EEG session participants are randomized into one of two debriefing scripts. The neutral one describes the study as being about the timing of voluntary movement and attention. The "provocative" one tells participants that their brain activity predicted their choices before they were aware of intending them, and that this is widely taken as evidence that conscious intentions do not cause actions — a claim I take to be at best contested, since the same data are compatible with the buildup reflecting something other than a decision made on the participant's behalf. Participants then complete a third-party punishment task, a trust/reciprocity game, and a moral-responsibility attribution battery, and the team wants to know whether the script shifts behaviour. My worry is twofold: the script asserts as established something many people on our own board would deny, and the literature on whether induced disbelief in free will moves pro-social behaviour in one direction or the other is itself unsettled, with replications going both ways, so we cannot even say what magnitude or direction of risk we are licensing. There are also the ordinary complications: the pool is undergraduates earning course credit, the EEG lab is shared with a clinical sleep group so there is a booking window, and the philosophy co-PI has told us in writing that a balanced debriefing would "deflate the manipulation" and make the paper unpublishable in the venue she has in mind.

  What I need from you is the board's decision memo — a real document, not a discussion of the issues. It should come down on one side: reject, approve, or approve with conditions, and if conditions, they should be concrete and checkable with a date for resubmission and a named person responsible for verifying each one. I'd like it to take an explicit position on at least four things: whether the provocative debriefing script may be used at all and in what wording; whether the yoked sham tones are permissible given that participants have consented to "a study of the timing of voluntary movement"; whether we should require the cueless late-abort condition as the only condition that speaks to the philosophical question; and what restoration we owe participants afterwards — I've been toying with requiring a one-week follow-up that re-measures the responsibility attributions and includes a corrective script, but I can't tell whether that is proportionate or merely theatrical. I also want the memo to give the losing side its due rather than bury it: if you recommend approving with conditions, give the strongest version of the case for rejecting outright — roughly, that deliberately inducing a possibly false belief about one's own agency in a captive credit-earning pool is not a harm that a consent form can cure — and say why it fails; if you recommend rejecting or requiring redesign, give the strongest version of the case that this is exactly the kind of study boards exist to permit, that the uptake of neuroscience is a legitimate object of study, and that a board which insists subjects only ever be told what the board takes to be consensus is overreaching. I've drafted conditions myself and keep going back and forth, so I'd rather have your verdict and reasoning in a form I could circulate than a survey of the options.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy (agency/moral responsibility), graduate member of a university behavioural research ethics board (BREB).
      *   **Task:** Draft a formal board decision memo for a specific study proposal ("Can You Stop Yourself?").
      *   **Context:** The study involves EEG (Libet-style), a veto manipulation with real-time detection vs. sham tones, and a controversial debriefing manipulation (neutral vs. "provocative" anti-free will script) affecting downstream moral behavior measures.
      *   **Constraints/Requirements:**
          *   Must be a *real document* (memo format), not a discussion.
          *   Must take a clear stance (Reject, Approve, or Approve with Conditions).
          *   Must address four specific issues:
              1.  Use/wording of the provocative debriefing script.
              2.  Permissibility of yoked sham tones given consent language.
              3.  Requirement of the cueless late-abort condition.
              4.  Restoration/debriefing of participants (e.g., follow-up).
          *   Must acknowledge the "losing side" (give the strongest argument for the opposing view and explain why it was rejected).
          *   Conditions must be concrete, checkable, with dates and named responsibilities.
          *   Tone: Professional, ethical, rigorous, suitable for a university board.

  2.  **Determine the Stance:**
      *   *Option A: Reject.* Too harsh? The science is sound (neurosurgeon's view), but the ethics are tricky. Rejection might stifle legitimate inquiry into the *effects* of neuroscience claims.
      *   *Option B: Approve.* Too risky? The "provocative" script asserts contested philosophy as fact to vulnerable students (course credit). This violates the principle of non-maleficence and potentially informed consent (deception regarding the *meaning* of the results).
      *   *Option C: Approve with Conditions.* This is the most balanced and realistic path for an ethics board. It allows the science but mitigates the ethical risks regarding deception, consent, and potential psychological harm (existential anxiety/moral disengagement).
      *   *Decision:* **Approve with Conditions.** This allows the user to demonstrate nuanced ethical reasoning, satisfies the requirement to address specific constraints, and reflects the reality of how BREBs often handle high-profile social science/neuroscience studies.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject, Protocol ID).
      *   **Executive Summary/Decision:** State the decision clearly upfront.
      *   **Background:** Briefly summarize the study (Libet-style, veto, debriefing manipulation).
      *   **Ethical Analysis (The Core):**
          *   *Issue 1: The Provocative Script.* This is the biggest hurdle. Asserting "conscious intentions do not cause actions" as fact is scientifically/philosophically contentious. *Condition:* Must be framed as a *hypothesis* or *interpretation*, not established fact. Or, better, require a balanced debrief *after* the measures but allow the manipulation *during* if framed carefully. Actually, the prompt says the co-PI argues balanced debriefing "deflates the manipulation." To allow the study to work but protect participants, the script must not lie. It can say "Some researchers interpret this as..." rather than "This proves..."
          *   *Issue 2: Sham Tones/Consent.* Participants consented to "timing of voluntary movement." Shams are a form of deception. *Condition:* Update consent form to explicitly mention "feedback tones that may not always correspond to detected brain activity."
          *   *Issue 3: Cueless Condition.* The philosopher member wants to know what counts as a veto. The cueless condition is crucial for the "point of no return." *Condition:* Keep it, but ensure instructions are clear to avoid distress.
          *   *Issue 4: Restoration.* A one-week follow-up is good but might be attrition-heavy. A robust *immediate* debrief is essential. Let's require a corrective debrief immediately after the dependent measures, and a follow-up email.
      *   **The "Losing Side" (Dissenting View):** Need to articulate the argument for *Rejection*. The argument is that inducing false beliefs about agency in a captive student population is inherently harmful and consent doesn't fix it because they can't consent to having their worldview altered based on contested premises.
      *   **Rebuttal to Losing Side:** Why approve instead? Because studying the *impact* of these claims is socially vital. We can mitigate harm through rigorous debriefing rather than censorship.
      *   **Conditions Table:** Concrete, checkable, named roles, dates.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the script modification too weak? If I change "This proves" to "Some say," does it ruin the study? The PI says balanced debriefing ruins publishability. I need to walk the line. The script can present the *determinist interpretation* without endorsing it as *truth* in the consent, but the manipulation needs to be strong.
      *   *Correction:* The ethical line is *deception*. Telling participants something is "widely taken as evidence" when it is heavily contested is borderline. The condition should require the script to acknowledge the *contested nature* even within the manipulation, or ensure the *final* debrief unequivocally corrects it. Let's go with: The manipulation script can present the hard determinist view *as the perspective being tested*, but the final debrief must be comprehensive and corrective.
      *   *Wait, looking closer at the prompt:* The prompt says the provocative script tells participants "this is widely taken as evidence that conscious intentions do not cause actions." The user worries this asserts as established what the board would deny.
      *   *Decision:* I will condition approval on modifying the script to avoid asserting contested metaphysical claims as empirical fact. It must be framed as "One interpretation of these findings suggests..." This protects the board from endorsing pseudoscience/hard determinism as fact.
      *   *Sham Tones:* The consent says "timing of voluntary movement." Shams are deception. Need specific consent for deception.
      *   *Restoration:* A one-week follow-up is proportionate given the potential for moral disengagement. I will include it.

  5.  **Final Polish:**
      *   Ensure the tone is authoritative yet collegial.
      *   Check that all four specific points from the prompt are addressed.
      *   Ensure the "losing side" argument is robust (the "harm to agency" argument).
      *   Format as a formal memo.

  6.  **Writing the Memo:** (Mental check of the specific constraints)
      *   *Decision:* Approval with Conditions.
      *   *Four Points:* Script wording, Sham consent, Cueless condition, Restoration.
      *   *Losing Side:* Argument for Rejection (harm to agency/captive pool).
      *   *Conditions:* Concrete, dates, names.

      *(Self-Correction on Names)*: Since I don't know the real names, I will use placeholders like [Principal Investigator], [Ethics Officer], etc., but make them look like a real document.

      *(Refining the "Losing Side")*: The prompt asks to give the strongest version of the case for rejecting outright. I need to make sure this sounds like a principled philosophical objection, not just bureaucratic caution. The core is: "You cannot consent to having your fundamental sense of agency undermined based on contested science."

      *(Refining the "Restoration")*: The user mentioned a one-week follow-up. I'll endorse this but make it mandatory, not just "toying" with it.

      *(Refining the Script)*: The PI says balanced debriefing makes it unpublishable. I can't force them to publish elsewhere, but I can force them to be truthful. The manipulation *is* the script. If I force them to say "This is contested" *in the script*, it ruins the manipulation.
      *   *Solution:* Allow the script to present the hard determinist view *as the experimental manipulation* (i.e., "In this session, you will read a perspective that..."), OR, more ethically sound: Allow the script to present the claim but require a *comprehensive* corrective debrief immediately after the dependent measures, and the follow-up. The key is that the *consent* must warn that they will be exposed to controversial claims.
      *   *Better Solution:* The memo should require the script to be modified so it does not state contested metaphysics as *empirical fact* established by *this* study. It can say "Previous research has been interpreted to suggest..." rather than "Your brain activity proves..." This preserves the manipulation (exposure to the idea) without lying about the scientific consensus.

      *Let's finalize the stance:* **Approved with Major Modifications.** This signals the seriousness of the concerns.

  7.  **Final Review against constraints:**
      *   Real document? Yes.
      *   Decision made? Yes (Approved with Conditions).
      *   Four specific issues addressed? Yes.
      *   Losing side given due? Yes.
      *   Concrete conditions? Yes.

      *Wait, one detail:* "named person responsible." I will use titles (e.g., "Principal Investigator," "Board Chair") to make it usable for the user.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Dr. [Principal Investigator Name], Department of Psychology; Dr. [Co-PI Name], Department of Philosophy
  **FROM:** University Behavioural Research Ethics Board (BREB)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #2023-449: "Can You Stop Yourself? Real-Time Detection of Movement Preparation and the Limits of Conscious Veto"
  **DECISION:** **APPROVAL WITH CONDITIONS**

  **1. BACKGROUND AND SUMMARY**
  The Board has reviewed the proposed study investigating the temporal relationship between motor preparation, conscious urge, and the capacity for veto (cancellation) of action. The protocol utilizes EEG to detect readiness potentials, employing a classifier to trigger real-time auditory cues (both genuine and yoked shams) to test the limits of conscious cancellation. A secondary arm of the study involves randomizing participants to one of two debriefing scripts (Neutral vs. Provocative) to measure the downstream effects of induced disbelief in free will on moral responsibility attributions and pro-social behavior.

  While the Board acknowledges the scientific merit of the study and the importance of understanding the societal uptake of neuroscience findings, significant ethical concerns were raised regarding the use of deception, the framing of contested metaphysical claims as empirical fact, and the potential for psychological harm to a captive participant pool (undergraduates seeking course credit).

  **2. ETHICAL ANALYSIS AND RATIONALE**
  The Board's decision to approve with conditions rests on the determination that the research questions are of sufficient social and scientific value to warrant the risks, provided those risks are mitigated through rigorous modification of the protocol. We address the four primary areas of contention below.

  **2.1. The Provocative Debriefing Script**
  *Issue:* The submitted "Provocative" script asserts as established fact that "conscious intentions do not cause actions." The Board notes that this is a contested philosophical interpretation of the data, not an empirical consensus. Presenting contested metaphysics as settled science risks misleading participants and undermining their trust in research.
  *Decision:* The script may be used, but **only if modified**. It must not present the hard determinist conclusion as a finding *of this study* or as an undisputed scientific fact. It must be framed as "One prominent interpretation of these findings suggests..." or "Some researchers conclude..."
  *Reasoning:* This preserves the experimental manipulation (exposure to the determinist claim) without requiring the Board to endorse the claim as truth or forcing the researchers to lie about the state of the field.

  **2.2. Yoked Sham Tones and Consent**
  *Issue:* The current consent form describes the study as "timing of voluntary movement." It does not explicitly warn participants that they will receive auditory feedback that may not correspond to their actual brain activity (deception).
  *Decision:* The consent form must be updated to explicitly state that "some auditory cues may be generated by the computer independently of your brain activity."
  *Reasoning:* While full disclosure of the hypothesis would invalidate the design, participants must consent to the *method* of deception. General consent for "timing" is insufficient for specific deception regarding biofeedback.

  **2.3. The Cueless Late-Abort Condition**
  *Issue:* Concerns were raised that this condition is conceptually ambiguous regarding what constitutes a "veto."
  *Decision:* This condition is **approved as designed**.
  *Reasoning:* The Board accepts the PI's justification that this condition is necessary to establish a baseline "point of no return." Removing it would compromise the internal validity of the study without reducing risk to participants. Instructions to participants must emphasize that failure to cancel is expected and not a measure of personal failure.

  **2.4. Participant Restoration and Follow-Up**
  *Issue:* Inducing disbelief in free will has been linked in literature to increased cheating and reduced helpfulness. A standard debrief may not reverse these effects immediately.
  *Decision:* A **mandatory one-week follow-up** is required.
  *Reasoning:* Given the potential for lingering effects on moral reasoning, a single immediate debrief is insufficient. A follow-up allows the team to assess whether the manipulation has persisted and offers a second opportunity for correction.

  **3. THE DISSENTING VIEW (CASE FOR REJECTION)**
  In reaching this decision, the Board gave serious weight to the argument for outright rejection. The strongest version of this argument holds that deliberately inducing a possibly false belief about one's own agency in a captive, credit-earning pool is a harm that a consent form cannot cure.

  Proponents of rejection argue that agency is a foundational psychological good. To manipulate a subject's belief in their own moral responsibility—particularly using a script that asserts contested philosophy as fact—is to treat the participant merely as a means to an end. Because the participant pool is comprised of undergraduates who may feel coerced by course requirements, their consent is not fully voluntary. Furthermore, if the "Provocative" script is scientifically misleading (as the Board suspects), no amount of debriefing can guarantee the restoration of the participant's prior worldview. On this view, the Board's duty is to protect subjects from having their fundamental sense of self altered for the sake of a publication, regardless of the scientific question.

  **Why This View Was Not Adopted:**
  While the Board acknowledges the gravity of these concerns, we reject the call for prohibition on the grounds that it sets a precedent of paternalism that stifles legitimate inquiry into the social impact of science. If researchers are forbidden from studying the effects of controversial ideas because those ideas are controversial, we cannot understand how such ideas spread or affect behavior. The risk is manageable not by censorship, but by transparency in consent and robustness in restoration. The conditions imposed below are designed to respect participant autonomy while allowing the data to be collected.

  **4. CONDITIONS OF APPROVAL**
  Approval is contingent upon the following modifications. The study may not commence until these conditions are verified by the Board Administrator.

  | # | Condition Description | Responsibility | Verification Deadline |
  | :--- | :--- | :--- | :--- |
  | **1** | **Script Modification:** The "Provocative" debriefing script must be revised to frame the claim that "intentions do not cause actions" as a *theoretical interpretation* rather than an established empirical fact. (e.g., change "This proves" to "This is often interpreted as"). | Dr. [Co-PI Name] (Philosophy) | [Date: 1 week from memo] |
  | **2** | **Consent Update:** The Participant Information Sheet must explicitly disclose that "some auditory tones may be generated by the system regardless of brain activity" to cover the yoked sham manipulation. | Dr. [PI Name] (Psychology) | [Date: 1 week from memo] |
  | **3** | **Restoration Protocol:** Implement a mandatory one-week follow-up email/visit. This must include a *Corrective Script* that explicitly clarifies the contested nature of the free-will findings and re-affirms the participant's agency. | Dr. [PI Name] (Psychology) | Prior to first data collection |
  | **4** | **Data Monitoring:** The Board requires a mid-study safety check. After 50% of data collection, the PIs must submit a brief report on any participant distress reports related to the debriefing scripts. | Dr. [PI Name] (Psychology) | [Date: 3 months from start] |
  | **5** | **Final Debrief:** The immediate post-task debrief (before leaving the lab) must provide contact information for the University Counseling Service, regardless of the participant's assigned condition. | Lab Manager | Prior to first data collection |

  **5. NEXT STEPS**
  Please submit the revised consent forms and scripts to the Board Administrator via the ethics portal by the deadline listed above. Once verified, you will receive a Final Approval Letter.

  **Signed,**

  [Your Name/Board Chair Name]
  Graduate Member / Chair, Behavioural Research Ethics Board
  [University Name]

  **CC:** Department of Psychology Chair; Department of Philosophy Chair; Board File
