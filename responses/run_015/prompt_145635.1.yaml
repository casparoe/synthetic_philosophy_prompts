answer: |-
  This is a sophisticated package of commitments that attempts to bridge moral status theories of standing (focused on hypocrisy) with authority-based theories (focused on roles and structural position). While internally rich, the set contains significant friction points. Below is the consistency check, tension ranking, and proposed resolution.

  ### 1. Discrimination of Tensions

  **Pair A: Commitment (1) vs. Commitment (3) [Severity: Critical]**
  *   **The Conflict:** (1) asserts a necessary condition for losing standing: one must be *self-exempting*. (3) asserts a case where standing is lost *without* self-exemption (beneficiaries who oppose the system).
  *   **Analysis:** This is a direct logical contradiction. (1) claims $Loss \rightarrow Self\text{-}Exemption$. (3) claims $Loss \ \& \ \neg Self\text{-}Exemption$. They cannot both be true as stated.
  *   **Verdict:** Genuine, fatal tension.

  **Pair B: Commitment (1) vs. Commitment (5) [Severity: High]**
  *   **The Conflict:** (1) locates the loss of standing in a *current* attitude (self-exemption). If one reforms, one is no longer self-exempting, implying standing should return. (5) locates the loss of standing in *historical fact* (having committed the fault), stating standing *never* returns for that specific fault, regardless of current attitude.
  *   **Analysis:** (1) suggests standing is dynamic and restorable via attitude adjustment. (5) suggests standing is historically "stained" in a way that attitude cannot wash away.
  *   **Verdict:** Genuine theoretical tension regarding the metaphysics of standing (current status vs. historical trace).

  **Pair C: Commitment (2) vs. Commitment (5) [Severity: Moderate]**
  *   **The Conflict:** (2) allows a parent to blame a child for dishonesty despite the parent's professional dishonesty. (5) says one never regains standing to blame for the "very fault" one shared.
  *   **Analysis:** This tension dissolves *if* "Professional Dishonesty" and "Child Dishonesty" are not the "very fault." If "Dishonesty" is individuated broadly, they clash. If individuated contextually (role-relative), they are compatible.
  *   **Verdict:** Apparent conflict; dissolves on inspection *provided* you adopt a contextual individuation of faults.

  **Pair D: Commitment (3) vs. Commitment (4) [Severity: Low]**
  *   **The Conflict:** (4) defines blame as communicating shared expectations. (3) denies standing to those who share the expectation (opponents of the system) due to their beneficiary status.
  *   **Analysis:** This is not a contradiction but a gap. (4) describes the *function* of blame; (3) describes a *felicity condition* or legitimacy constraint. One can intend to communicate a shared expectation (4) but lack the authority to do so effectively or legitimately (3).
  *   **Verdict:** Apparent conflict; dissolves by distinguishing *intent* from *legitimacy*.

  ---

  ### 2. Ranking of Tensions

  1.  **(1) vs. (3):** **Critical.** Logical contradiction regarding the necessary conditions for losing standing.
  2.  **(1) vs. (5):** **High.** Incompatible accounts of whether standing is recoverable via reform.
  3.  **(2) vs. (5):** **Moderate.** Depends entirely on how you individuate "faults."
  4.  **(3) vs. (4):** **Low.** Resolvable by distinguishing the nature of blame (act vs. norm).

  ---

  ### 3. Cheapest Revisions and Costs

  **For Tension (1) vs. (3):**
  *   **Revision:** Drop the word "only" in (1). Change to: "Standing is *typically* undermined by hypocrisy..." or "Standing is undermined by hypocrisy *and other forms of complicity*."
  *   **Cost:** You lose the elegant simplicity of the "Hypocrisy-Only" account. You must now explain *why* structural complicity undermines standing if hypocrisy does not (e.g., is it about power dynamics rather than moral consistency?).

  **For Tension (1) vs. (5):**
  *   **Revision:** Qualify (5) to allow standing return after a significant period of reform, OR qualify (1) to admit that "past unatoned fault" functions as a standing-defeater similar to hypocrisy.
  *   **Cost:** If you soften (5), you lose the moral rigor of the "clean hands" intuition. If you harden (1), you move away from a purely attitudinal account of standing toward a historical one.

  **For Tension (2) vs. (5):**
  *   **Revision:** Explicitly define "the very fault" in (5) as *role-contextualized*. (Lying as a parent $\neq$ Lying as a professional).
  *   **Cost:** Risk of ad-hocery. You must provide a principled reason why professional lying doesn't count as "the very fault" when blaming a child for lying, other than "it preserves the parental role."

  ---

  ### 4. Definite Position: Can the Package be Saved?

  **Yes, the package can be saved without abandoning Normative Residue.**

  In fact, **Normative Residue (2)** is the most valuable and distinctive part of your view. It explains why we don't hold parents to the same standing standards as strangers. Abandoning it would flatten your theory into a standard hypocrisy account. The conflicts arise because Commitment (1) is too restrictive to support the nuance required by (2), (3), and (5).

  ### 5. The Single Revision to Clean Up Conflicts

  **Revise Commitment (1).**

  **Current (1):** *Standing is fundamentally undermined by hypocrisy, but **only** of the self-exempting kind...*

  **Proposed Revision:** *Standing is **presumptively** undermined by self-exempting hypocrisy, but may also be defeated by **structural complicity** or **unatoned historical fault**, unless preserved by **normative residue** inherent to specific social roles.*

  **Why this revision?**
  1.  **Resolves (1) vs. (3):** By removing "only," you allow structural injustice (3) to function as an independent standing-defeater alongside hypocrisy.
  2.  **Resolves (1) vs. (5):** By acknowledging "unatoned historical fault" as a defeater, you accommodate the intuition in (5) that reform doesn't always wipe the slate clean for the *same* fault, without contradicting the mechanism of (1).
  3.  **Protects (2):** By adding the clause "unless preserved by normative residue," you explicitly codify Commitment (2) as a *defeater-defeater*. This explains why the parent retains standing despite professional dishonesty (Residue overrides the Fault Defeater), while the structural beneficiary does not (No Residue applies to override the Complicity Defeater).

  **The Cost:**
  You sacrifice the theoretical purity of a single-condition account of standing (Hypocrisy). You must now develop a taxonomy of standing-defeaters (Hypocrisy, Complicity, History) and a hierarchy of authority-sources (Role Residue vs. Moral Status). However, this is a necessary cost to accommodate the complex intuitions you hold regarding structural injustice and parental authority. This revision transforms your view from a "Hypocrisy Theory" to a "Hybrid Authority Theory," which is better equipped to handle the cases you care about.
