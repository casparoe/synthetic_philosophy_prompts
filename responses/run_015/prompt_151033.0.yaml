answer: |-
  ### The Parliamentarian's Decision Procedure (v1.0)

  **Purpose:** To determine, within fifteen minutes, whether a proposed amendment is *in order* to be voted upon, what *threshold* applies, and whether it carries a *validity risk* that should be flagged for the tellers and council.

  **Scope:** This procedure applies to proposed amendments to the Constitution of the Learned Society. It distinguishes between *procedural admissibility* (can we vote?) and *substantive validity* (does the vote count?). It prioritizes textual hierarchy over political desirability.

  ---

  #### Step 1: Identify the Target and the Route
  **Question:** Which Article(s) does the resolution touch, and at what type of meeting is it moved?
  **Sufficient Answer:** A specific Article number (e.g., "Article 9" or "Article 3") and Meeting Type (AGM or General Meeting).
  **Hard No:** If the resolution attempts to amend a non-existent Article or is moved at a meeting type explicitly barred for that Article (e.g., amending Article 9 at a Special Meeting if 9.3 requires AGM).
  **Theoretical Status:** **Settled.** (Textual interpretation of jurisdiction. Rival view: *Implied Powers*, which would allow amendments anywhere unless explicitly forbidden. That view would produce fewer Hard Nos but greater chaos.)

  #### Step 2: Determine the Applicable Threshold (The Hierarchy Rule)
  **Question:** Is the target Article 9, or is it Articles 1–8?
  **Sufficient Answer:**
  *   **If Article 9:** Apply **9.3** (3/4 vote + preceding AGM notice). *Ignore 9.1.*
  *   **If Articles 1–8:** Apply **9.2** (Simple Majority, Any Meeting). *Ignore 9.1.*
  *   **Note on 9.1:** Treat 9.1 as a residual default only if 9.2 or 9.3 does not apply (which, given the text, is never).
  **Hard No:** If the vote count cannot mathematically reach the required threshold (e.g., proposing a 9.3 amendment when only 60% of members are present).
  **Theoretical Status:** **Contestable.** (This step adopts *Lex Specialis* over *Lex Generalis*. Rival view: *Lex Posterior*, arguing 9.1 (with 2019 supremacy clause) overrides 9.2. That view would require 2/3 at AGM for Arts 1–8, stabilizing the constitution but contradicting the text of 9.2. **Warning:** This step makes the constitution highly unstable, as Articles 1–8 can be changed by 51% at any meeting.)

  #### Step 3: Check Procedural Conditions (Notice and Timing)
  **Question:** Does the amendment target Article 9? If yes, was written notice given at the *preceding* AGM?
  **Sufficient Answer:** Yes/No verification from the Secretary's records.
  **Hard No:** If targeting Article 9 without prior notice. This is a condition precedent to the *power* to amend, not just a formality.
  **Hand-off to Values:** If notice was given but was vague (e.g., "to amend Article 9" without specifics). Rule it *In Order* but flag to Council that vagueness may invite a validity challenge later.
  **Theoretical Status:** **Contestable.** (This step treats notice as a *jurisdictional limit*. Rival view: *Waiver Doctrine*, arguing that if 100% of members present vote to waive notice, the amendment is valid. That view would allow Case A to pass. This procedure rejects waiver to protect absent members.)

  #### Step 4: Screen for Substantive Evasion (The 9.4 Test)
  **Question:** Does the amendment, in operation, abolish or restrict the right of any *current* member to vote?
  **Sufficient Answer:**
  *   **Direct:** Does it delete voting language? (Yes = Hard No).
  *   **Indirect:** Does it create a new class of members or alter quorum such that existing voting rights are effectively nullified?
  **Decision:**
  *   If it affects *existing* members' rights: **Hard No** (Invalid).
  *   If it affects *future* applicants or creates a parallel class without touching existing rights: **In Order** (Valid).
  **Hand-off to Values:** If the effect is debatable (e.g., massive dilution of voting power without formal restriction). Rule *In Order* but issue a **Validity Warning**: "This resolution may be challenged under 9.4 as a substantive evasion."
  **Theoretical Status:** **Contestable.** (This step adopts *Formalism* over *Purposivism*. Rival view: *Substantive Due Process*, arguing 9.4 protects the *value* of the vote, not just the text. That view would strike down Case C. This procedure allows the loophole to avoid the Parliamentarian making political judgments on "dilution.")

  #### Step 5: Sequencing and Severability
  **Question:** Is this resolution dependent on a prior resolution passed earlier in the same meeting?
  **Sufficient Answer:**
  *   **Dependency:** If Resolution 2 relies on a rule change in Resolution 1, Resolution 1 must be *fully valid* first.
  *   **Self-Reference:** A resolution may change a threshold and use it immediately *only if* the change itself meets the *old* threshold.
  *   **Severability:** If part of a resolution violates 9.4 and part does not, strike the whole unless the resolution contains a severability clause.
  **Hard No:** If Resolution 1 fails its threshold, Resolution 2 is automatically out of order.
  **Theoretical Status:** **Settled.** (Logical consistency. A power that does not exist cannot be exercised.)

  ---

  ### Application to Cases

  #### Case A: Delete notice requirement in 9.3 (Vote 68–32, No Notice)
  *   **Step 1:** Targets Article 9. Route: AGM (assumed).
  *   **Step 2:** Threshold is 9.3 (3/4 vote + Notice).
  *   **Step 3:** Notice was **not** given.
  *   **Ruling:** **Out of Order.**
  *   **Reasoning:** You cannot use the power in 9.3 to remove the conditions of 9.3 without satisfying 9.3 first. The notice requirement is a lock on the key.
  *   **Theoretical Note:** Relies on *Self-Embracing Sovereignty* (9.3 binds itself). Rival view (*Continuing Sovereignty*) would argue a current majority can ignore past procedural locks. If that view were taken, this would be In Order (provided 68% met the threshold, which it doesn't against 75% anyway).
  *   **Validity Risk:** High. Even if voted on, it is void for lack of jurisdiction.

  #### Case B: Lower 9.1 threshold to Simple Majority (Vote 55–45)
  *   **Step 1:** Targets Article 9 (since 9.1 is in Article 9).
  *   **Step 2:** Threshold is 9.3 (3/4 vote).
  *   **Step 3:** 55% is less than 75%.
  *   **Ruling:** **Not Carried / Invalid.**
  *   **Reasoning:** Amending 9.1 is amending Article 9. 9.3 controls Article 9. 55% fails the 75% requirement.
  *   **Theoretical Note:** Relies on *Hierarchy of Norms*. Rival view (*Implied Repeal*) might argue that if 9.1 is amended to say "Simple Majority," the new text overrides 9.3. This procedure rejects that; you must clear the hurdle to change the hurdle.

  #### Case C: Create non-voting Affiliate Class (Vote 81–19, Art 3)
  *   **Step 1:** Targets Article 3.
  *   **Step 2:** Threshold is 9.2 (Simple Majority). 81% passes.
  *   **Step 3:** Notice not required for Art 3.
  *   **Step 4:** Does it restrict *current* members? No. It creates a new class. 9.4 text is untouched.
  *   **Ruling:** **In Order and Valid.**
  *   **Reasoning:** 9.4 prohibits restricting the right of *members*. Applicants are not members. Existing members retain their vote.
  *   **Theoretical Note:** **This is the answer you will not like.** It relies on *Textual Formalism*. Rival view (*Purposive Interpretation*) argues 9.4 intends to prevent a two-tier society that dilutes the general meeting's authority. Under the rival view, you should rule this **Out of Order** as a substantive evasion of 9.4. This procedure forces you to allow it, exposing the constitution to oligarchic drift.

  #### Case D: 1. Lower 9.1 to Majority (78%); 2. Amend Art 6 (51%)
  *   **Step 1:** Resolution 1 targets Article 9. Resolution 2 targets Article 6.
  *   **Step 2:** Resolution 1 Threshold is 9.3 (3/4 = 75%). Resolution 2 Threshold depends on Resolution 1.
  *   **Step 3:** Resolution 1 gets 78%. 78% > 75%. **Resolution 1 is Valid.**
  *   **Step 5 (Sequencing):** Resolution 1 is now law. 9.1 now reads "Simple Majority."
  *   **Step 2 (Re-eval):** Resolution 2 targets Article 6. Under *new* 9.1, threshold is Simple Majority. But wait: Step 2 of Procedure says Art 1-8 is 9.2 (Simple Majority). So even under old rules, 9.2 applies. However, if Resolution 1 changed 9.1 to "Simple Majority for *all*," it might conflict with 9.3. Assuming Resolution 1 only changed 9.1 text:
  *   **Ruling:** **Both Valid.**
  *   **Reasoning:** Resolution 1 cleared the 9.3 hurdle (78% > 75%). It is now effective. Resolution 2 passes under the new 9.1 (or old 9.2, both are majority).
  *   **Theoretical Note:** Relies on *Instantaneous Validity*. Rival view (*Temporal Lag*) argues amendments take effect after the meeting adjourns. If that view were taken, Resolution 2 would need to meet the *old* threshold (which it does, 51% > 50% under 9.2, but would fail if 9.1's 2/3 applied). This procedure assumes immediate effect to allow coherent package deals.

  ---

  ### What This Procedure Cannot Settle

  **The Ultimate Sovereignty Question:** This procedure cannot resolve what happens if the Council refuses to ratify a ruling that is textually correct, or if the membership revolts against a ruling that is textually correct but politically unsustainable.
  *   **Why:** The procedure assumes the Constitution is the highest norm. If the members act as a *constituent power* (outside the constitution) to ignore the constitution, no rule within the constitution can stop them.
  *   **Hand-off:** If a ruling is challenged by a standing vote of no confidence in the Chair/Parliamentarian, you must step down. The procedure governs the *rules*, not the *revolution*.

  **The 9.1 vs 9.2 Contradiction:** This procedure resolves the conflict by prioritizing 9.2 for Articles 1–8. It cannot settle whether this interpretation is *faithful* to the original intent of the society, only that it is *faithful* to the textual hierarchy chosen for operational stability. If the membership believes 9.1 was meant to be the master clause, this procedure will systematically produce rulings they view as illegitimate.

  ### Instructions for the Tellers
  1.  **Count First:** Do not announce the result until you have the exact percentage.
  2.  **Check the Article:** If the amendment touches Article 9, you need 75%. If it touches 1–8, you need 50% + 1.
  3.  **Ignore the "Why":** Do not ask if the amendment is good. Ask only if the numbers match the Article number.
  4.  **Flag Case C:** If voting on new member classes, note that 9.4 challenges may arise later. Count the votes; let the Council worry about the lawsuit.

  ### Theoretical Appendix for Colleagues
  *   **Step 2 (Hierarchy):** Embeds a **Hartian Rule of Recognition** (secondary rules determine validity of primary rules). Rival: **Dworkinian Integrity**, which would require reconciling 9.1 and 9.2 to fit the moral schema of the society, likely invalidating 9.2's simple majority as inconsistent with the "supremacy" of 9.1/9.4.
  *   **Step 3 (Notice):** Embeds **Entrenchment**. Rival: **Parliamentary Sovereignty** (Dicey), which holds no parliament can bind its successor. Under Dicey, 9.3's notice requirement is voidable by a simple majority at any time. This procedure rejects Dicey to preserve the Society's continuity.
  *   **Step 4 (Evasion):** Embeds **Legal Positivism** (Law is what is written). Rival: **Natural Law/Equity**, which would void Case C as contrary to the "spirit" of voting rights. This procedure explicitly rejects Equity to keep the Parliamentarian out of the business of judging political values.
