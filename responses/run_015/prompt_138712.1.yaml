  *Case:* A thief raised in a crime family steals to survive. He could not have chosen his upbringing.
  *Question:* Given the Start, is it *unfair* to blame him purely because he deserves it (retributivism)?
  *   **No:** → **Leaf: Standard Agency** (Compatibilism/Libertarianism). *You reject the Basic Argument's force; you believe responsibility survives without ultimacy.*
  *   **Yes:** → Go to Node 2.

  **Node 2 (The Closed Loop)**
  *Case:* An agent's values were formed by chance, but she now reflectively endorses them totally and acts from them.
  *Question:* Is this endorsement sufficient to make her *answerable* (required to give reasons), even if not blameworthy?
  *   **No:** → Go to Node 3.
  *   **Yes:** → Go to Node 4.

  **Node 3 (Guidance Control)**
  *Case:* The same agent as Node 2, but now imagine she is temporarily unable to respond to reasons (e.g., severe compulsion).
  *Question:* Is she still responsible in *any* sense when she cannot adjust her behavior to reasons?
  *   **Yes:** → **Leaf: Deep Self View**. *You locate responsibility in the constitution of the will, not control.*
  *   **No:** → **Leaf: Eliminativist**. *You drop desert and forward-looking responsibility; only causal management remains.*

  **Node 4 (The Authored Agent)**
  *Case:* A planning system (or cult-raised child) acts coherently from engineered dispositions.
  *Question:* Is this agent responsible in the *same sense* as the Closed Loop agent (Node 2)?
  *   **No:** → **Leaf: Historical View**. *You require the right history of formation, not just current coherence.*
  *   **Yes:** → Go to Node 5.

  **Node 5 (The Unchosen Attitude)**
  *Case:* You feel a spontaneous, contemptuous belief about a stranger that you did not choose.
  *Question:* Are you responsible for *having* the attitude, not just for acting on it?
  *   **No:** → **Leaf: Control View**. *You restrict responsibility to voluntary actions or omissions.*
  *   **Yes:** → Go to Node 6.

  **Node 6 (The Generalization Worry)**
  *Case:* You demand reasons from the agent with the contemptuous belief.
  *Question:* Does the Basic Argument imply this demand is *also* illegitimate (proving too much)?
  *   **Yes:** → **Leaf: Skeptic's Regret**. *You accept the argument but view the loss of reason-demanding as a catastrophic cost.*
  *   **No:** → Go to Node 7.

  **Node 7 (The Reactive Attitudes)**
  *Case:* A friend betrays you. You learn they could not have done otherwise.
  *Question:* Does your resentment *necessarily vanish* upon learning this?
  *   **Yes:** → Go to Node 8.
  *   **No:** → **Leaf: Strawsonian Naturalist**. *You hold that responsibility is an ineliminable psychological fact, regardless of metaphysics.*

  **Node 8 (The Practice Retention)**
  *Case:* We know no one deserves blame. Should we continue using the *word* "responsibility"?
  *   **No:** → **Leaf: Abolitionist**. *You retain forward-looking measures but discard the vocabulary of responsibility.*
  *   **Yes:** → Go to Node 9.

  **Node 9 (The Justification)**
  *Case:* We retain the practice. Is its primary justification *social safety* or *mutual understanding*?
  *   **Social Safety:** → **Leaf: Revisionist**. *You retain the practice on consequentialist grounds it did not previously have.*
  *   **Mutual Understanding:** → **Leaf: Legibility Conception**. *You view responsibility as making the will intelligible to the community.*

  ***

  ### Commentary on Structure and Leaves

  **1. The Legibility Conception: Collapse or Unique?**
  This cell is **genuinely unoccupied** in standard taxonomies, but it risks collapsing into the **Strawsonian Naturalist** or **Answerability** views.
  *   *Vs. Strawson:* Strawson argues we *cannot* abandon the practice (psychological necessity). Legibility argues we *should not* abandon it because it serves a constitutive function (intelligibility). If a student conflates "necessary for human life" with "necessary for understanding," these leaves merge.
  *   *Vs. Answerability:* Answerability focuses on the *normative standing* to demand reasons. Legibility focuses on the *hermeneutic goal* of the exchange. They are distinct in telos, but in practice, a student may answer Node 9 ambiguously.
  *   *Verdict:* Keep it distinct, but warn students that "Understanding" must not simply mean "Psychological Inevitability."

  **2. Unoccupied or Incoherent Combinations**
  *   **The "Desert without Ultimacy" Skeptic:** A student who answers **No** at Node 1 (Desert is fair despite no ultimacy) but **Yes** at Node 7 (Resentment vanishes without ultimacy).
      *   *Why:* Incoherent. If you think desert is fair without ultimacy, you are a Compatibilist; you should not think resentment *must* vanish when ultimacy is absent.
  *   **The "Answerability without Intelligibility" Revisionist:** A student who answers **Yes** at Node 8 (Keep the word) but rejects both Safety and Understanding at Node 9.
      *   *Why:* Merely unattractive/Unexplored. Retaining the practice without a justificatory goal (consequential or constitutive) leaves the practice normatively idle.
  *   **The "Historical Eliminativist":** A student who answers **No** at Node 4 (History matters) but **No** at Node 3 (Guidance not required).
      *   *Why:* Incoherent. If history matters (Authored Agent is exempt) but current control doesn't (Compulsion is exempt), no agent remains responsible. This is just Eliminativism by another name.

  **3. Indistinguishable Leaves**
  *   **Strawsonian Naturalist vs. Legibility Conception:** The tree cannot perfectly separate these if a student believes that "making the will intelligible" is itself an "ineliminable human need." Both exit through Node 7 (Resentment does not vanish). The distinction relies entirely on the nuance of Node 9 (Justification). In a 10-minute diagnostic, students often conflate "we can't stop doing it" with "we shouldn't stop doing it."
  *   **Deep Self View vs. Answerability View:** Both route through Node 2 (Endorsement is sufficient). While the tree separates them at Node 3 (Guidance Control), a student who believes endorsement *just is* a form of reasons-responsiveness may find the distinction between "Constitution" and "Control" artificial.

  **4. Diagnostic Utility**
  This tree forces students to confront the **Closed Loop** and **Authored Agent** cases before they have settled on a label. Many students will instinctively say the Closed Loop agent is responsible (Node 2: Yes) but the Authored Agent is not (Node 4: No), revealing a commitment to **Historical Conditions** they may not have realized they held. Similarly, the **Unchosen Attitude** node (Node 5) exposes **Volitionists** who claim to be Compatibilists but actually require choice for responsibility.
