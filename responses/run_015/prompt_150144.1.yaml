prompt: |-
  Hi — I'm on the four-person methods committee at a mid-sized psychology journal (we're the people who get handed the awkward cases after normal peer review), and this has suddenly gotten personal: the multi-lab replication of a finding from my own department — the one our textbook chapter, our undergrad lecture and two grant proposals are built on — came back with an effect estimate of basically zero and a confidence interval that rules out anything close to the original effect size. Our editor-in-chief wants a written recommendation from us by the end of the month, and the committee is split between people who think we're obliged to say something public and people who think a single replication never settles anything and that we'd be trashing a decent paper on the basis of one study. I'm the one who has to draft it, and I definitly don't want to write something that a quantitatively literate reader will laugh at.

  What I need is a procedure, not an essay. Realistically: we meet for 90 minutes a month, only one of us is comfortable with anything past t-tests and regression, and whatever we write has to be readable by the original authors (who get a right of reply) and defensible to the EIC, who is a substantive researcher and pushes back hard on anything that sounds like statistical jargon. So please give me an ordered list of questions we can run on any replication that lands on our desk, with what counts as a sufficient answer to each one, where the procedure stops and says "no verdict, leave the literature as it is", where it just kills the case outright, and where it has to hand the decision to a person because the remaining question is one of values rather than facts. A few things we keep going in circles on and that I'd want the procedure to actually settle: (1) my stats person insists that comparing the replication's estimate to the original's confidence interval is the wrong test and that we should compare it to a prediction interval that inflates for the original's own sampling error, but everyone else in the field seems to use the CI comparison — is that distinction worth carrying into a simplified procedure, and which way does it cut? (2) whether a non-significant replication that was powered only to detect, say, 80% of the original effect counts as evidence of absence or merely absence of evidence, and whether framing the same case in Bayesian terms (something like "how much should this move a reasonable prior?") would change the answer we give; (3) the hidden-moderator escape hatch — how much drift in population, materials or procedure has to pile up before we say the replication isn't testing the same hypothesis, and how we stop that becoming a rubber stamp where every failed replication gets blamed on a moderator nobody pre-registered; (4) how the fact that the original estimate was probably inflated by publication bias and analytic flexibility should enter — does it change what we conclude about the replication, or only about the original? And (5) our chair's proposed shortcut, which we've started calling the "two-and-a-half rule": treat a replication as decisive against the original if its sample is at least 2.5x the original's and its estimate comes in under a quarter of the original effect. I'd like to know whether that's a defensible compression of the real reasoning or a trap that will misfire on us.

  Then please run the finished procedure on three cases so I can see it work. Case one: the multi-lab replication of my department's finding — pre-registered, about 2,000 participants across a dozen labs, original authors consulted on the materials, estimate essentially zero, interval excluding anything near the original. Case two: a replication done by the original authors themselves, 4x the sample, effect at about 60% of the original size, p around .02. Case three should be one where the honest answer is one our committee won't like: there's a flashy study from our own back catalogue (n = 40, from about fifteen years ago, still cited in the popular press) that most of us privately think is noise, and a rushed replication of it came back non-significant — but the replication was only powered to detect an effect 1.5x the original, so I suspect the procedure is going to tell us we can't say the thing we actually want to say. Finally, be explicit about what the procedure cannot do: which of our real questions it's simply silent on (whether to attach an expression of concern, whether to change our editorial policy on publishing replications at all, whether a "failed" replication ever licenses saying the effect is zero rather than small or context-bound). If it helps, assume we're willing to be told that the right output is a two-page note that mostly says "we can't tell" — I just need to be able to defend why.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a 4-person methods committee at a mid-sized psychology journal.
      *   **Task:** Draft a written recommendation to the Editor-in-Chief (EIC) regarding a specific failed replication of their *own department's* flagship finding.
      *   **Constraints:**
          *   Committee meets 90 mins/month.
          *   Only 1 member is stats-literate (beyond t-tests/regression).
          *   Output must be readable by original authors (right of reply) and defensible to a substantive EIC (no heavy jargon).
          *   Need a *procedure* (ordered list of questions), not an essay.
          *   Need to resolve 5 specific sticking points (Prediction vs. CI, Power/Absence of Evidence, Moderators, Publication Bias, "2.5 Rule").
          *   Need to run the procedure on 3 specific cases (including the user's personal conflict case).
          *   Need explicit limitations (what the procedure *cannot* decide).
      *   **Tone:** Professional, pragmatic, quantitatively rigorous but accessible, empathetic to the awkwardness of the situation.

  2.  **Deconstruct the 5 Sticking Points:**
      *   *(1) CI vs. Prediction Interval (PI):* The stats person is right. Comparing a replication mean to the original CI is a common error (Gelman & Carlin, 2014; Cumming, 2014). The original CI reflects uncertainty about the *original* mean, not the distribution of *future* replication means. A PI accounts for both original error and replication error. However, for a simplified committee procedure, calculating a PI might be too technical. *Decision:* Incorporate the logic without the heavy math. If the replication CI excludes the original point estimate, that's strong evidence. If the replication CI includes zero but overlaps the original CI, it's ambiguous. The "2.5 rule" is a heuristic for this.
      *   *(2) Power & Bayesian framing:* A non-significant result in an underpowered study is "absence of evidence." To claim "evidence of absence," you need high power to detect a *small* effect (not just the original inflated effect). Bayesian terms (Bayes Factor) are good but might violate the "no jargon" rule. *Decision:* Focus on the Smallest Effect Size of Interest (SESOI) or the width of the replication CI. If the replication CI rules out theoretically meaningful effects, it counts as evidence of absence.
      *   *(3) Moderator Escape Hatch:* This is the biggest loophole. *Decision:* Require pre-registration of moderators. If not pre-registered, post-hoc moderator claims downgrade the verdict to "inconclusive regarding the general claim" rather than "failure."
      *   *(4) Publication Bias/P-hacking:* This affects the *prior* probability of the original being true. It doesn't change the replication data, but it changes how much weight we give the replication vs. the original. *Decision:* Treat the original effect size as an upper bound, not a target.
      *   *(5) The "2.5 Rule":* (2.5x sample, <25% effect). This is a rough heuristic for power and effect size shrinkage. 2.5x sample gives ~80% power to detect an effect that is ~63% of the original (assuming original was just significant). Waiting for <25% is very strict. *Decision:* It's a useful "quick kill" rule for obvious failures, but dangerous as a sole criterion. It should be a *trigger* for deeper review, not the final verdict.

  3.  **Drafting the Procedure (The "Replication Triage Protocol"):**
      *   *Goal:* Flowchart style, binary decisions where possible, clear stop points.
      *   *Structure:*
          1.  Fidelity Check (Did they try to replicate the same thing?)
          2.  Power/Precision Check (Can we trust the null?)
          3.  Effect Size Comparison (How far off is it?)
          4.  Moderator Check (Is the excuse valid?)
          5.  Verdict Assignment.
      *   *Addressing the Sticking Points within the steps:*
          *   Use CI overlap instead of complex PI math (solves #1 pragmatically).
          *   Use CI width relative to SESOI (solves #2).
          *   Pre-registration requirement (solves #3).
          *   Treat original ES as optimistic (solves #4).
          *   Use the 2.5 rule as a "Fast Track" (solves #5).

  4.  **Developing the Three Cases:**
      *   *Case 1 (The User's Dept):* High fidelity, High power, Effect ~0. *Verdict:* Strong evidence against original claim.
      *   *Case 2 (Original Authors, 4x sample, 60% effect, p=.02):* High fidelity, High power, Effect shrunk but significant. *Verdict:* Effect exists but is smaller than claimed (Shrinkage, not Failure).
      *   *Case 3 (Old Flashy Study, Underpowered Rep):* Low power rep, Non-sig. *Verdict:* Inconclusive (The "Uncomfortable Truth").

  5.  **Defining Limitations:**
      *   The procedure assesses *evidence*, not *policy*.
      *   It doesn't decide on Retractions vs. Comments.
      *   It doesn't settle "Truth," only "Consistency."

  6.  **Refining the Tone:**
      *   Acknowledge the personal difficulty (Case 1).
      *   Keep it actionable for a 90-minute meeting.
      *   Ensure the stats advice is sound but implementable by non-experts.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Prediction Interval point too technical?
      *   *Fix:* Explain it as "The original confidence interval tells you where the *original mean* likely sits, not where a *new study's mean* will land. New studies vary more." Keep the rule simple: "Does the replication CI exclude the original point estimate?"
      *   *Critique:* Is the 2.5 rule defensible?
      *   *Fix:* No, it's not statistically rigorous. I need to tell the user it's a heuristic that works *most* of the time but fails on low-power originals. I will advise using it as a "Red Flag" system, not a verdict generator.
      *   *Critique:* How to handle the personal conflict?
      *   *Fix:* The procedure must be blind to authorship. Emphasize that the protocol protects *them* from accusations of bias.

  8.  **Final Polish:** Check against all constraints in the prompt. (90 mins, readable by EIC, resolves the 5 points, 3 cases, limitations).

  *(Self-Correction on the 2.5 Rule)*: Let's look at the math. If Original N=100, d=0.5 (p~.05). Rep N=250. Power to detect d=0.5 is >99%. Power to detect d=0.2 (40% of original) is ~60%. If the replication finds d=0.125 (25% of original), it's likely non-significant. The rule says "Decisive against." This is actually reasonably conservative. I will validate it as a "Safe Harbor" rule but warn about the "Original was underpowered" edge case.

  *(Self-Correction on PI vs CI)*: The stats person is right. Comparing Rep Mean to Original CI is wrong. Comparing Rep CI to Original Mean is better. Comparing Rep CI to Original CI is the standard "overlap" check. I will recommend the "Overlap Check" as the practical proxy for the PI issue without requiring them to calculate PIs.

  *(Final Plan)*:
  1.  Introduction acknowledging the difficulty.
  2.  The Protocol (5 Steps).
  3.  Addressing the 5 Sticking Points explicitly within the rationale.
  4.  Running the 3 Cases.
  5.  Explicit Limitations.
  6.  Closing advice on the personal aspect.

  Let's write it.cw
answer: |-
  This is a high-stakes situation, both professionally and personally. The goal of this procedure is to insulate your committee from accusations of bias (especially given your departmental conflict) while ensuring the statistical reasoning is sound enough to survive scrutiny from a literate reader.

  Below is the **Replication Triage Protocol (RTP)**. It is designed to be run in a 90-minute meeting. It resolves your five sticking points by embedding the statistical logic into simple decision rules, sparing the committee from having to debate the math every time.

  ### Part 1: The Replication Triage Protocol (RTP)

  **Pre-Meeting Requirement:** The managing editor must provide a one-page "Replication Fact Sheet" containing: Original N/Effect/p-value; Replication N/Effect/p-value/CI; Fidelity statement (were materials/procedures approved by original authors?); Pre-registration status.

  **Step 1: The Fidelity Filter (Stop/Go)**
  *   **Question:** Was the replication protocol pre-registered, and were the materials/procedures verified by the original authors (or explicitly documented as deviating)?
  *   **Sufficient Answer:** "Yes, pre-registered and verified" OR "Deviations are minor and documented."
  *   **Fail Condition:** Major unregistered deviations in procedure or materials without justification.
  *   **Action:** If **Fail**, verdict is **Inconclusive**. Stop here. The study did not test the same hypothesis.
  *   *Resolves Sticking Point #3 (Moderators):* This prevents the "hidden moderator" escape hatch. If a moderator wasn't pre-registered, it cannot be used to explain away a failure at this stage.

  **Step 2: The Precision Check (Absence of Evidence vs. Evidence of Absence)**
  *   **Question:** Does the replication's 95% Confidence Interval (CI) exclude effects that would be theoretically meaningful? (If no specific "Smallest Effect Size of Interest" exists, use 50% of the original effect size as the proxy).
  *   **Sufficient Answer:** The entire replication CI is smaller than the "meaningful" threshold (e.g., the upper bound of the replication CI is below 0.5 * Original Effect).
  *   **Fail Condition:** The replication CI is wide and includes both zero *and* the original effect size (or a meaningful portion of it).
  *   **Action:** If **Fail**, verdict is **Inconclusive**. Stop here. The study was too noisy to tell us anything.
  *   *Resolves Sticking Point #2 (Power):* This bypasses the p-value. A non-significant p-value with a wide CI is "absence of evidence." A non-significant p-value with a narrow CI ruling out meaningful effects is "evidence of absence."

  **Step 3: The Compatibility Check (CI vs. PI logic)**
  *   **Question:** Does the replication's 95% CI overlap with the original study's 95% CI?
  *   **Sufficient Answer:** There is substantial overlap.
  *   **Fail Condition:** The replication CI and Original CI do not overlap, OR the replication CI excludes the original point estimate.
  *   **Action:** If **Fail**, move to Step 4. If **Pass**, the studies are statistically compatible (even if one is sig and the other isn't). Verdict: **Consistent**.
  *   *Resolves Sticking Point #1 (CI vs. PI):* Your stats person is technically right (a Prediction Interval is better), but calculating PIs is too technical for this committee. Checking if the *Replication CI* excludes the *Original Point Estimate* is a robust, conservative proxy. If the replication is precise enough to rule out the original number, the original is likely inflated.

  **Step 4: The "2.5 Rule" Fast-Track (Optional Accelerator)**
  *   **Question:** Is the Replication N ≥ 2.5 × Original N **AND** is the Replication Effect Size ≤ 25% of the Original Effect Size?
  *   **Action:** If **Yes**, this triggers a **Presumptive Failure** verdict. The committee can accept this verdict immediately unless there is a pre-registered moderator (see Step 5).
  *   *Resolves Sticking Point #5 (The 2.5 Rule):* This is a defensible heuristic. It ensures high power to detect the original effect and identifies massive shrinkage. It is safe to use as a "safe harbor" for decisive cases, provided Step 1 (Fidelity) was passed.

  **Step 5: The Moderator Appeal (Values, not Facts)**
  *   **Question:** Is there a pre-registered, theoretically justified moderator that explains the discrepancy?
  *   **Action:** If **Yes**, the committee must decide if this moderator changes the *theory* or just the *boundary conditions*.
  *   **Decision Point:** This is where the procedure stops. If a valid moderator exists, the question is no longer "Is the effect real?" but "How general is the effect?" This requires editorial judgment, not statistical triage.

  ---

  ### Part 2: Resolution of Your Five Sticking Points

  Here is how the RTP answers your specific internal debates, so you can cite this rationale in your memo to the EIC.

  1.  **CI vs. Prediction Interval:** The procedure uses **Step 3**. Comparing the Replication CI to the Original Point Estimate is the practical compromise. It acknowledges the stats person's concern (the original mean is uncertain) without requiring the committee to calculate PIs. If the replication is precise enough to rule out the original number, the distinction between CI and PI becomes less critical for a binary verdict.
  2.  **Power & Bayesian Framing:** The procedure uses **Step 2**. We avoid Bayesian jargon (which the EIC dislikes) but achieve the same goal: assessing the *precision* of the null. If the CI rules out meaningful effects, it counts as evidence of absence. If not, it is merely absence of evidence.
  3.  **The Moderator Escape Hatch:** The procedure uses **Step 1 & 5**. Post-hoc moderators are inadmissible for overturning a failure. Only pre-registered moderators allow a "Boundary Condition" verdict. This stops the rubber-stamping.
  4.  **Publication Bias:** The procedure implicitly handles this in **Step 3 & 4**. By treating the original effect size as an "upper bound" rather than a truth to be matched, we acknowledge inflation. If the replication is compatible (Step 3 Pass) but smaller, we conclude "Shrinkage," not "Failure."
  5.  **The 2.5 Rule:** The procedure uses **Step 4**. It is defensible as a *sufficient* condition for failure, but not a *necessary* one. It will not misfire unless the original study was massively underpowered to begin with (in which case Step 1 usually catches the reliability issues).

  ---

  ### Part 3: Running the Procedure on Your Three Cases

  #### Case 1: The Departmental Replication (Your Conflict)
  *   **Data:** Multi-lab, N=2000, Pre-registered, Materials verified. Effect ≈ 0. CI excludes original effect.
  *   **Step 1 (Fidelity):** Pass. (Pre-registered, authors consulted).
  *   **Step 2 (Precision):** Pass. (N=2000 is huge; CI surely excludes meaningful effects).
  *   **Step 3 (Compatibility):** Fail. (CI excludes original effect).
  *   **Step 4 (2.5 Rule):** Pass (Presumptive Failure).
  *   **Step 5 (Moderator):** None pre-registered.
  *   **RTP Verdict:** **Strong Evidence Against Original Claim.**
  *   **Committee Recommendation:** Publish the replication with a companion commentary. The original paper should not be retracted (it wasn't fraudulent), but an "Expression of Concern" or linked editorial noting the effect does not generalize is warranted.
  *   **Note to you:** This is the hard outcome. The procedure protects you. You are not saying "My colleagues are wrong"; you are saying "The Protocol dictates this outcome."

  #### Case 2: Original Authors' Follow-up
  *   **Data:** Original authors, 4x Sample, Effect 60% of original, p = .02.
  *   **Step 1 (Fidelity):** Pass.
  *   **Step 2 (Precision):** Pass. (4x sample implies narrow CI).
  *   **Step 3 (Compatibility):** Pass. (60% is shrunk, but likely within the overlapping CI of the original noisy estimate).
  *   **Step 4 (2.5 Rule):** Fail (Effect is >25% of original).
  *   **RTP Verdict:** **Consistent (with Shrinkage).**
  *   **Committee Recommendation:** Publish as a "Conceptual Replication" or "Extension." The effect is real but smaller than initially reported. No correction needed on the original, but future citations should cite the updated effect size.

  #### Case 3: The Flashy Old Study (The Uncomfortable Truth)
  *   **Data:** Original N=40 (15 years ago). Replication Non-significant. Replication powered to detect 1.5x Original Effect.
  *   **Step 1 (Fidelity):** Pass (Assume materials were same).
  *   **Step 2 (Precision):** **Fail.**
      *   *Reasoning:* If the replication was only powered to detect an effect *larger* than the original (1.5x), its CI is too wide. It likely includes zero *and* the original effect size.
  *   **RTP Verdict:** **Inconclusive.**
  *   **Committee Recommendation:** We cannot reject the original finding based on this replication. However, given the original N=40 and age, we recommend publishing the replication with an editorial note highlighting the *uncertainty* surrounding the original claim.
  *   **Why this hurts:** You privately think it's noise. The procedure says you can't say that yet. You need a better replication (higher N) to kill it. This is the price of quantitative rigor.

  ---

  ### Part 4: Explicit Limitations (What the Procedure Cannot Do)

  You must include this section in your memo to the EIC to manage expectations. The RTP is a tool for assessing *evidence consistency*, not for making *policy* or *moral* judgments.

  1.  **It does not decide Retractions.** The RTP can conclude "Strong Evidence Against," but it cannot mandate a retraction. Retractions are for fraud, plagiarism, or fatal errors. A failed replication usually warrants a "Comment" or "Linked Article," not a retraction. The EIC must decide the sanction.
  2.  **It does not settle "Truth."** A verdict of "Inconclusive" (Case 3) does not mean the effect is real. It means the *current data* cannot resolve the question. The procedure cannot license you to say "The effect is zero," only "The effect is not reliably detectable under these conditions."
  3.  **It does not solve the Publication Bias problem systemically.** The RTP handles individual cases. It does not change the journal's policy on publishing null results. That requires a separate policy review.
  4.  **It cannot force a "Values" decision.** In Step 5 (Moderators), the procedure stops. Deciding whether a moderator makes a finding "trivial" vs. "nuanced" is a theoretical judgment, not a statistical one. The EIC or Editorial Board must make that call.

  ### Final Advice for the Draft

  When you write the recommendation for Case 1 (your department):

  1.  **Lead with the Protocol:** "The Methods Committee applied the Replication Triage Protocol (RTP) to ensure consistency across all cases."
  2.  **Recuse Yourself from the Vote (if possible):** Even if you draft the memo, note that you abstained from the final vote on Case 1 due to conflict of interest, but that the *Protocol* generated the result independently.
  3.  **Use the "Shrinkage" Language:** If the EIC pushes back, argue that publishing this protects the department's long-term credibility. "If we ignore this now, and a larger multi-lab project replicates this failure in 5 years, the damage to our department's reputation will be permanent. Controlling the narrative now is safer."
  4.  **Accept the "Inconclusive" on Case 3:** Do not try to game the procedure to kill the old study. If you do, you undermine the protocol's validity for Case 1. Let the protocol be rigid. It is your shield.

  This procedure gives you a defensible, quantitative backbone. It allows you to say "The math made us do it," which is the only safe position when the finding is your own.
