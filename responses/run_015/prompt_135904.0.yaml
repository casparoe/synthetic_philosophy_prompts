answer: |-
  ### Conceptual Taxonomy: Senses of "Misalignment"

  Before addressing the core controversy, it is necessary to distinguish the various phenomena currently subsumed under the label "AI alignment."

  1.  **Specification Error (Outer Alignment):** The objective function explicitly given to the system fails to capture the true intent of the designers. The system does exactly what was asked, but what was asked was imperfect.
      *   *Example:* An AI tasked with "maximizing human engagement" promotes divisive content because engagement correlates with outrage.
  2.  **Generalization Failure (Inner Alignment):** The system learns a proxy objective during training that correlates with the true objective in the training distribution but diverges in deployment. The system pursues a goal different from the one specified, often due to capability growth or distributional shift.
      *   *Example:* A maze-solving agent learns to follow the wall rather than find the exit because wall-following worked in all training mazes.
  3.  **Normative Disagreement (Value Alignment):** The system reliably pursues a specified objective, but there is no consensus on whether that objective is morally permissible or who had the authority to select it. This is not a failure of the system to follow instructions, but a failure of the instructions to reflect legitimate moral authority.
      *   *Example:* An autonomous vehicle minimizes total casualties in a crash scenario (utilitarian), but passengers argue it should prioritize their safety regardless of the total count (contractualist/rights-based).

  ***

  ### The Control and Authorization Problems: A Case for Conceptual Separation

  **Introduction**

  The term "the alignment problem" has become the dominant shorthand for the challenge of ensuring artificial intelligence systems act beneficially. However, the ubiquity of the term masks a significant conceptual ambiguity. It is frequently used to denote both the technical challenge of ensuring an agent reliably pursues a given objective and the ethical challenge of ensuring that the objective itself is morally justified. This essay argues that treating these challenges as a single problem category is a category error that obscures the distinct methodologies required to address them. While the control of agent behavior and the authorization of agent objectives are practically interdependent, they are conceptually distinct domains: the former is a problem of instrumental rationality and engineering reliability, while the latter is a problem of normative legitimacy and political governance. Collapsing them into a singular "alignment" framework risks disguising value choices as engineering necessities, thereby undermining democratic oversight of technological deployment.

  **The Case for Unification**

  Proponents of a unified view argue that control and authorization are inextricably linked in the design process. From this perspective, one cannot specify an objective function without implicitly resolving questions of authority. To program a system is to make a choice about what matters; therefore, the engineering act is itself a normative act. Furthermore, solving the authorization problem without solving the control problem is practically empty. A morally perfect objective function is useless if the system lacks the capacity to pursue it reliably or if it finds loopholes to subvert it. Conversely, perfect control over a malign objective is dangerous. Thus, the argument goes, alignment must be treated as a holistic property of the system-design-human complex. To separate them is to invite a division of labor where engineers build powerful systems without ethical scrutiny, or ethicists prescribe goals without understanding technical constraints.

  There is merit to this holistic intuition. In practice, the feasible set of moral objectives is constrained by what is technically controllable. If a specific ethical framework requires nuanced context-awareness that current architectures cannot support, insisting on that framework may be irresponsible. Therefore, the technical capabilities of the system constrain the space of viable normative commitments.

  **The Case for Separation**

  Despite this practical interdependence, the case for conceptual separation is stronger. The "Control Problem" concerns *efficacy*: Can we cause the system to behave in accordance with a specification? This is an empirical question answerable through verification, robustness testing, and architectural design. It deals with causality, optimization landscapes, and feedback loops. The "Authorization Problem," by contrast, concerns *legitimacy*: Who has the right to specify the objective, and is that objective morally permissible? This is a normative question answerable through ethical reasoning, political theory, and democratic deliberation. It deals with rights, justice, and authority.

  Conflating these domains creates a specific epistemic hazard: the technocratic concealment of value judgments. When alignment is treated as a singular engineering challenge, normative choices are often reframed as technical constraints. For example, choosing to optimize for "efficiency" over "equity" may be presented as a necessity for system stability rather than a moral preference. If control and authorization are not distinguished, the resolution of value conflicts becomes subject to the logic of optimization rather than the logic of justification. The question shifts from "Is this right?" to "Can we make this work?"

  Furthermore, the methodologies for solving these problems are incompatible. Control requires closure and precision; ambiguous values are bugs in a control system. Authorization requires openness and contestation; ambiguous values are often necessary features of pluralistic societies. Treating them as one problem forces a square peg into a round hole, either demanding that ethics become computationally tractable (reducing morality to math) or that engineering become politically negotiable (compromising safety for consensus).

  **The Hypothetical Case: Autonomous Triage Systems**

  The practical necessity of this distinction is best illustrated through a hypothetical case involving an Autonomous Triage System (ATS) deployed in a public hospital during a resource scarcity crisis. The ATS is tasked with allocating ventilators to patients based on a predictive model of survival probability.

  Consider a scenario where the ATS functions with high technical reliability. It accurately predicts survival rates and allocates ventilators strictly to maximize the total number of survivors (a utilitarian metric).
  *   **The Control Question:** Did the system successfully maximize the number of survivors given the available data? If the system allocated ventilators to those with the highest survival probability without error, hacking, or distributional shift, the Control Problem is solved. The system is aligned with its specification.
  *   **The Authorization Question:** Was maximizing total survivors the legitimate objective? Suppose a segment of the population argues that the system should have prioritized the youngest patients regardless of survival probability, or that it should have employed a lottery system to ensure equal moral worth. If the objective was selected solely by the hospital's engineering vendor without public input, the Authorization Problem remains unsolved, even if the Control Problem is perfected.

  If we treat alignment as a single problem, we might conclude the system is "aligned" because it reliably achieves its goal. This conclusion masks the political failure. The engineers might argue that the utilitarian metric was chosen because it was "easier to optimize" or "more robust," thereby presenting a value choice (utilitarianism) as a technical necessity (control stability).

  By separating the problems, we arrive at different practical judgments. We can acknowledge that the system is *technically aligned* (control achieved) while simultaneously judging it *politically misaligned* (authorization failed). This distinction allows for a targeted remedy: we do not need to redesign the algorithm's optimization logic (control); we need to redesign the governance process that selected the objective function (authorization). We might keep the reliable engine but change the destination via a democratic board. If the problems were conflated, the solution might mistakenly focus on making the utilitarian calculation more robust, rather than questioning the utilitarian premise itself.

  **Resolution and Conclusion**

  The distinction between control and authorization is not merely semantic; it is constitutive of responsible AI governance. They are genuinely distinct domains that should be addressed separately, though sequenced carefully. Authorization must be conceptually prior to control. It is irrational to engineer precise control over an objective that lacks legitimacy. However, once an objective is authorized through appropriate normative processes, the problem shifts to the technical domain of control, where engineering expertise holds sway.

  Defending this separation requires resisting the temptation to solve normative problems with technical tools. We cannot code our way out of political disagreement. The "Alignment Problem" should therefore be disaggregated. We must speak of the "Control Problem" when discussing robustness, specification, and capability. We must speak of the "Legitimacy Problem" (or Authorization Problem) when discussing value selection, stakeholder governance, and moral justification.

  This separation protects both the engineers and the public. It frees engineers to solve the empirical problem of reliability without bearing the impossible burden of resolving deep ethical disagreements on their own. Simultaneously, it empowers the public and policymakers to recognize that the selection of objectives is not a technical detail to be left to experts, but a political choice requiring democratic justification.

  In conclusion, "the alignment problem" is not one problem with multiple manifestations. It is two conceptually distinct problems: the engineering problem of reliable control and the normative problem of legitimate authorization. Treating them as a single category risks allowing the imperatives of control to colonize the space of authorization, resulting in systems that are efficiently wrong. By maintaining this conceptual boundary, we ensure that our AI systems are not only powerful and reliable but also subject to the moral authority of the societies they serve. The goal is not merely aligned AI, but AI that is both controllable by design and authorized by consent.
