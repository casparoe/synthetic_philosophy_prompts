  6.  **Final Polish:**
      *   Tone: Academic but accessible, respectful of the user's insight ("unclaimed blame" is a great phrase).
      *   Structure: Clear headings or paragraphs for flow.
      *   Ensure the distinction between *moral* guilt and *causal* regret is clear.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say Strawson is wrong.
      *   *Correction:* Better to say Strawson's scope is limited. He's describing the *logic* of moral community, not the *psychology* of trauma.
      *   *Check:* Make sure not to spoil the ending for the reading group (though they are watching it, so plot points are okay, but keep analysis focused).
      *   *Emphasis:* The user's term "unclaimed blame" is good. I should validate it while linking it to existing lit (Williams).

