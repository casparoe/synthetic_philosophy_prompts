prompt: |-
  I write the wall texts and the audio guide at a mid-sized municipal gallery — started last September, six shows a year, about a fortnight per show to get from a loan list to print-ready, with the director signing off at the end and the learning team wanting their own versions for schools groups. I did a ten-week evening course in aesthetics last spring and got into a long argument with a mate who's writing a PhD on it: she reckons you can't come to a justified aesthetic judgement about a work you haven't experienced first-hand — she called it the aquaintance principle, I think, and said something Kant-ish backs it up — and I said that can't be right, because basically my entire job is telling people things about objects they're standing in front of but haven't actually looked at yet. I've also started noticing my own bad habits: I open with critics have called this one of the great paintings of the decade, I tell visitors they'll find this devastating, and last month someone emailed to complain that our texts do the feeling for you.

  So: can you turn that debate into an actual procedure? I want something I can run per object in the twenty minutes I actually have before the director sees it, for both formats — 90 words of wall text, roughly 200 words of audio per stop. It should sort the sentences I write into kinds — ones that direct attention, ones that give non-aesthetic background like materials or what the artist was responding to, ones that report someone else's verdict, ones that predict what the visitor will feel — and then give a rule for each kind about when it's allowed, what counts as a sufficient answer, and where it stops with a no. I've been using a rough two-key rule of my own, no evaluative claim without a paired instruction to look at something the visitor can check for themselves, and I'd like you to keep it if it survives and tell me honestly if it doesn't.

  Hard cases I need it to handle: a fresco destroyed in a fire that we're showing as documentation, so nobody alive can experience the thing itself; our audio description for blind and partially sighted visitors, which is testimony given to people who can't have the visual experience at all; the marketing team's poster line, if you loved the Hockney you'll love this, which is testimony about taste-matching rather than about the work; a catalogue essay by a scholar who has written about the painting for years but never seen it in the flesh; the learning team wanting a content note saying this work is disturbing; and verdicts where the critics definately disagree. Then run the whole thing on three objects — the embroidered textile piece I want to call exquisite, the destroyed fresco, and the poster line — and include at least one case where the procedure gives me an answer I won't like. Mark clearly the points where it has to hand the decision back to a person because it's a values call rather than a facts call, and say what the procedure can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Writer of wall texts and audio guides at a mid-sized municipal gallery.
      *   **Workflow:** 6 shows/year, ~2 weeks per show (loan list to print-ready), Director sign-off, Learning team needs school versions.
      *   **Constraints:** 20 minutes per object before Director review. Word counts: 90 words (wall), 200 words (audio).
      *   **The Conflict:** User vs. PhD Friend (Aesthetics). Friend argues "Acquaintance Principle" (Kant-ish): No justified aesthetic judgment without first-hand experience. User argues their job *is* mediating objects people haven't truly "seen" yet.
      *   **Self-Critique:** User notices bad habits (appealing to authority: "critics say...", predicting feelings: "you'll find this devastating"). Complaint received: "texts do the feeling for you."
      *   **Current Heuristic:** "No evaluative claim without a paired instruction to look at something the visitor can check."
      *   **Goal:** Turn the debate into a *procedure* (algorithm/checklist) to sort sentences, apply rules, and handle hard cases.
      *   **Hard Cases to Handle:** Destroyed fresco (documentation), Audio description (blind/low vision), Marketing poster ("If you liked Hockney..."), Scholar who hasn't seen the work, Content notes (disturbing), Disagreeing critics.
      *   **Requirement:** Run the procedure on three objects (Embroidered textile, Destroyed fresco, Poster line). Include one outcome the user won't like. Mark "values call" hand-offs. State limitations.

  2.  **Deconstruct the Aesthetic Debate (Acquaintance Principle vs. Mediation):**
      *   *Friend's View:* Aesthetic judgment requires direct perception. You can't know it's "beautiful" or "devastating" via description.
      *   *User's View:* Mediation is necessary. Text guides attention to enable the judgment.
      *   *Synthesis:* The text shouldn't *make* the judgment for the visitor; it should *enable* the visitor to make the judgment. The "Acquaintance Principle" applies to the *visitor*, not necessarily the writer, but the writer must not usurp the visitor's experience.
      *   *Refining the User's Heuristic:* "No evaluative claim without a paired instruction to look." This is strong. It aligns with "show, don't tell." It needs to be formalized into the procedure.

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**
      *   *Time Management:* 20 mins is tight. Needs to be a quick filter.
      *   *Sentence Taxonomy:*
          1.  **Directives:** "Look at X."
          2.  **Context:** Materials, history, artist intent (non-aesthetic).
          3.  **Testimony:** "Critics say," "Scholar writes."
          4.  **Prediction:** "You will feel."
          5.  **Evaluation:** "It is exquisite," "It is devastating."
      *   *Rules per Type:*
          *   *Directives:* Always allowed, but must be specific.
          *   *Context:* Allowed, but keep separate from evaluation.
          *   *Testimony:* Allowed *if* attributed. Cannot stand alone as proof of quality.
          *   *Prediction:* **Banned.** (Addresses the complaint "does the feeling for you").
          *   *Evaluation:* Allowed *only* if paired with a Directive (User's heuristic).
      *   *The "Acquaintance Check":* Does this sentence ask the visitor to trust me, or trust their eyes?

  4.  **Addressing Hard Cases:**
      *   *Destroyed Fresco:* Direct experience impossible. Rule modification: Evaluation must be attributed to historical testimony or focused on the *documentation's* aesthetic.
      *   *Audio Description (AD):* Visual experience impossible for target audience. Rule modification: Evaluation is permissible *if* it describes the *effect* of the visual elements being described, but must avoid prescriptive emotion.
      *   *Marketing ("If you liked Hockney"):* This is taste-matching, not aesthetic judgment. It's a heuristic for interest, not quality. Needs a specific "Marketing Exception" flag.
      *   *Scholar (unseen):* Their testimony is historical/contextual, not aesthetic. Can be cited as context, not as proof of beauty.
      *   *Content Note:* This is safety/ethics, not aesthetics. Exempt from aesthetic rules.
      *   *Disagreeing Critics:* Present the disagreement as context, not a resolved verdict.

  5.  **Refining the Procedure for the 20-Minute Limit:**
      *   Need a flowchart style or a step-by-step checklist.
      *   Need to explicitly mark "Values Calls" (where the procedure stops and a human must decide).

  6.  **Testing on the Three Objects:**
      *   *Object 1: Embroidered Textile.* User wants to call it "exquisite."
          *   *Test:* Is there a directive? "Look at the stitch density."
          *   *Outcome:* If paired, okay. If not, cut.
      *   *Object 2: Destroyed Fresco.*
          *   *Test:* Can visitor experience it? No.
          *   *Outcome:* Evaluation must be historical ("Contemporaries called it..."). User might not like this (limits their voice).
      *   *Object 3: Poster Line ("If you loved Hockney...").*
          *   *Test:* Is this aesthetic judgment? No, it's marketing correlation.
          *   *Outcome:* Procedure might flag it as "Testimony without evidence" or "Prediction." This is a good candidate for the "answer you won't like."

  7.  **Developing the "Answer You Won't Like":**
      *   The user wants to write engaging copy. The procedure might force them to strip out the "hook" if it violates the Acquaintance Principle.
      *   *Idea:* The Poster Line. Marketing wants it. The procedure says it's technically a "Prediction of Taste" which is banned under the strict aesthetic rules. Or, the Destroyed Fresco: The procedure might say "You cannot call this beautiful, only the photo can be called sharp." Let's go with the **Poster Line**. It's tempting to use, but philosophically it violates the "judge for yourself" rule. Or better: **The Embroidered Textile.** If the user can't find a specific visual anchor for "exquisite" in 90 words, they have to cut the word. That hurts.
      *   *Decision:* Let's make the **Destroyed Fresco** the hard one. The user wants to convey its lost glory. The procedure forces them to talk only about the *photo* or *historical reports*, effectively silencing their own aesthetic voice on the work itself. That challenges their job identity.

  8.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the tension (Mediation vs. Acquaintance).
      *   **The Protocol (The "Acquaintance Filter"):** Step-by-step, sentence types, rules.
      *   **Hard Case Modifications:** Specific overrides for AD, Documentation, etc.
      *   **The "Values Call" Flags:** Where the human must step in.
      *   **Limitations:** What this can't solve.
      *   **The Trial Run:** Apply to the 3 objects.
      *   **The Unpleasant Outcome:** Highlight clearly.

  9.  **Refining the Rules (Self-Correction during drafting):**
      *   *Constraint:* 20 minutes. The procedure can't be too complex.
      *   *Constraint:* 90/200 words. The rules must be concise.
      *   *User's Heuristic:* "No evaluative claim without paired instruction." I need to validate this. It's actually a very strong Kantian move (Universalizability via shared perception). I will keep it as the Core Rule.
      *   *Prediction:* "You will feel devastated." This is the main complaint. This must be banned or heavily restricted.
      *   *Testimony:* "Critics say." This is allowed but must be framed as *their* experience, not *yours*.

  10. **Final Polish:**
      *   Ensure tone is professional but empathetic to the gallery context.
      *   Make sure the "Values Call" points are distinct.
      *   Check word counts in the examples.
      *   Ensure the "PhD Friend" would approve (philosophically sound) but the "Gallery Director" would also accept (practical).

  *(Self-Correction on the "Answer I Won't Like"):*
  If I ban the Poster Line, Marketing will hate it. But the user asked for *their* procedure to handle the aesthetic debate. The Poster Line is marketing, not gallery text. However, the prompt asks to run the procedure on the "poster line" as an object. If the procedure treats it as gallery text, it will fail the aesthetic test. That's a good friction point.
  Actually, the **Destroyed Fresco** is a stronger philosophical test. If the user claims the *fresco* is beautiful, they violate the Acquaintance Principle (no one can see it). If they claim the *documentation* is beautiful, they change the subject. I will make the procedure force the latter, which might feel like a betrayal of the artwork's memory.

  Let's refine the "Sentence Taxonomy" to be very quick to apply.
  1. Pointing (Look here)
  2. Grounding (Fact/History)
  3. Reporting (Someone else said)
  4. Judging (It is X)
  5. Predicting (You will feel X)

  Rule: Judging requires Pointing. Predicting is banned (unless Content Note). Reporting requires Attribution.

  Okay, ready to write.
answer: |-
  Here is a procedural framework designed to fit your twenty-minute window, reconcile your job with your friend's "Acquaintance Principle," and address the specific complaints about "doing the feeling for you."

  ### The Acquaintance Filter: A 20-Minute Protocol

  **Premise:** The text cannot substitute for the visitor's experience; it must facilitate it. Aesthetic authority belongs to the viewer, not the writer.

  **Step 1: Sentence Taxonomy (5 Minutes)**
  Highlight every sentence in your draft and tag it with one of five codes:
  1.  **[POINT]**: Directs attention to a visible feature (e.g., "Notice the fraying edge.").
  2.  **[GROUND]**: Non-aesthetic fact (materials, date, provenance, artist intent).
  3.  **[REPORT]**: Attributes a judgment to another (e.g., "Critics called it...").
  4.  **[JUDGE]**: Asserts an aesthetic quality (e.g., "It is exquisite," "The composition is tense.").
  5.  **[PREDICT]**: Asserts a visitor response (e.g., "You will feel devastated.").

  **Step 2: The Rules of Engagement (10 Minutes)**
  Apply the following constraints. If a sentence fails, cut or rewrite it.

  *   **Rule for [JUDGE]:** *The Anchor Rule.* (Your existing heuristic).
      *   **Allowed:** Only if immediately paired with a **[POINT]** sentence that allows the visitor to verify the claim.
      *   **Sufficient Answer:** "The brushwork is frantic [JUDGE], visible in the unpainted canvas beneath the eyes [POINT]."
      *   **Hard No:** "The brushwork is frantic [JUDGE]." (Unverified assertion).
  *   **Rule for [PREDICT]:** *The Autonomy Rule.*
      *   **Allowed:** **Never**, unless it is a mandatory Content/Trigger Warning (see Hard Cases).
      *   **Reasoning:** This violates the Acquaintance Principle by pre-empting the visitor's judgment.
      *   **Hard No:** "You will find this moving."
  *   **Rule for [REPORT]:** *The Attribution Rule.*
      *   **Allowed:** Only if the source is named and the distance between their experience and the visitor's is clear.
      *   **Sufficient Answer:** "In 1954, Smith described it as 'holy'."
      *   **Hard No:** "It is considered a masterpiece." (Passive voice hides who is judging).
  *   **Rule for [GROUND]:** *The Relevance Rule.*
      *   **Allowed:** Always, provided it does not masquerade as a [JUDGE].
      *   **Hard No:** "Made of oil on canvas, creating a rich texture." (The "rich" is a smuggled [JUDGE]).

  **Step 3: The Acquaintance Check (5 Minutes)**
  Read the text aloud. For every **[JUDGE]**, ask: *"Can the visitor see the evidence for this claim within 10 seconds of reading this text?"*
  *   If **Yes**: Pass.
  *   If **No**: Fail. Convert [JUDGE] to [REPORT] or cut.

  ---

  ### Hard Case Modifications
  *These override the standard rules where physical experience is impossible or the goal shifts from aesthetics to access/safety.*

  | Case | Modification | Constraint |
  | :--- | :--- | :--- |
  | **Destroyed Work (Documentation)** | Shift the object of judgment. | You cannot [JUDGE] the lost work. You may [JUDGE] the documentation (photo quality) or [REPORT] historical reception. |
  | **Audio Description (AD)** | Sensory translation. | [JUDGE] is allowed *if* it describes the functional effect of the visual element being described (e.g., "The high contrast creates a jarring effect"). |
  | **Marketing / Taste-Matching** | **Exempt.** | This protocol is for gallery interpretation, not acquisition of attention. "If you liked Hockney" is a heuristic, not an aesthetic claim. |
  | **Scholar (Unseen)** | Treat as History. | Their writing counts as **[GROUND]** (historical context), not **[REPORT]** (aesthetic testimony), regarding the object's quality. |
  | **Content Note (Disturbing)** | **Exempt.** | [PREDICT] is allowed *only* for safety (e.g., "Contains flashing images"). This is medical/safety data, not aesthetic guidance. |
  | **Disagreeing Critics** | Present Conflict. | Do not resolve the disagreement. Present as **[REPORT]** A vs **[REPORT]** B. |

  ---

  ### Values Call Hand-Offs
  *The procedure cannot decide these. You must pause and consult the Director or Learning Team.*

  1.  **The "Nudge" Threshold:** When does a [POINT] become manipulative? (e.g., "Look at the sad eyes" vs "Look at the eyes"). *Hand-off: Learning Team.*
  2.  **The "Empty Anchor":** If a [JUDGE] is culturally essential (e.g., "This is a sacred icon") but the visual evidence is obscure to a layperson, do you keep the [JUDGE] without the [POINT]? *Hand-off: Director.*
  3.  **The Marketing Conflict:** If Marketing demands a [PREDICT] on a poster that violates the Autonomy Rule. *Hand-off: Director (Policy Decision).*

  ### What This Procedure Cannot Do
  *   **Guarantee Engagement:** It prevents bad habits but does not ensure the text is interesting.
  *   **Resolve Philosophical Disputes:** It assumes the Acquaintance Principle is valid. If your institution believes in "Authority-Based Mediation," this protocol will fight your mission.
  *   **Fix Bad Art:** It stops you from lying about it, but it doesn't make the show better.

  ---

  ### Trial Run: Three Objects

  #### 1. The Embroidered Textile (Current Draft)
  *Draft:* "This piece is exquisite. The threadwork creates a shimmering surface that feels alive. You will be drawn in by the colour."
  *Word Count:* 25 words.

  **Applying the Filter:**
  1.  **Taxonomy:**
      *   "This piece is exquisite." **[JUDGE]**
      *   "The threadwork creates a shimmering surface that feels alive." **[JUDGE]** (smuggled) + **[GROUND]**
      *   "You will be drawn in by the colour." **[PREDICT]**
  2.  **Rule Application:**
      *   **[PREDICT]**: **Cut.** (Autonomy Rule).
      *   **[JUDGE] "Exquisite"**: No **[POINT]** paired. **Fail.**
      *   **[JUDGE] "Shimmering/Alive"**: No specific **[POINT]**. **Fail.**
  3.  **Rewrite (Procedure Compliant):**
      *   "Silk thread is layered over cotton [GROUND]. Notice how the untwisted floss catches the gallery light at the centre [POINT]. This technique creates a shifting surface [JUDGE anchored to POINT]."
      *   *Result:* 34 words. "Exquisite" is removed.

  **Outcome:** You lose the word you wanted ("exquisite"). The text is drier.

  #### 2. The Destroyed Fresco (Documentation)
  *Draft:* "Originally vibrant, this fresco was a triumph of the baroque. Though destroyed in 1940, its power remains visible in this photograph."
  *Word Count:* 28 words.

  **Applying the Filter:**
  1.  **Taxonomy:**
      *   "Originally vibrant... triumph..." **[JUDGE]** (on lost work).
      *   "Power remains visible..." **[PREDICT]** / **[JUDGE]**.
  2.  **Hard Case Rule (Destroyed Work):**
      *   You cannot [JUDGE] the lost work directly. You must [REPORT] historical reception or [JUDGE] the photo.
  3.  **Rewrite (Procedure Compliant):**
      *   "Destroyed by fire in 1940, this work survives only in this 1938 photograph [GROUND]. Contemporary accounts described the original colours as 'blinding' [REPORT]. The high-contrast grain of this print emphasises the composition's drama [JUDGE on Documentation]."
      *   *Result:* 45 words.

  **Outcome:** You are forced to admit the visitor is looking at a photo, not the art. The "triumph" is attributed to dead critics, not you.

  #### 3. The Marketing Poster Line
  *Draft:* "If you loved the Hockney, you'll love this."
  *Word Count:* 10 words.

  **Applying the Filter:**
  1.  **Taxonomy:**
      *   "If you loved..." **[PREDICT]** (Taste).
      *   "...you'll love this." **[PREDICT]** (Emotion/Value).
  2.  **Hard Case Rule (Marketing):**
      *   **Exempt.** This is not interpretation; it is audience segmentation.
  3.  **Procedure Verdict:**
      *   **Pass (with caveat).** Mark as "External Communication." Do not use inside the gallery walls.

  **Outcome:** **This is the answer you won't like.**
  While the procedure exempts marketing *externally*, if you try to use this logic *inside* the gallery (e.g., on a "Recommended Route" map), the procedure **Bans** it.
  *Why?* Inside the gallery, the "Acquaintance Principle" applies. Telling a visitor they *will* love something based on another work pre-emptively judges the object for them. It creates a "halo effect" that prevents them from seeing the work on its own terms.
  *The Friction:* Your Marketing Director will want this text on the wall near the entrance. The Procedure says **No**. You must take this to the **Values Call Hand-Off**. The procedure forces you to choose: are you a gallery (facilitating experience) or a brand (selling taste)? You cannot be both in the same sentence.

  ### Summary of Constraints on Your Practice
  1.  **You lose your voice as a critic.** You become a facilitator. You cannot say "This is good." You can only say "Look here, this is why some call it good."
  2.  **The "Exquisite" Problem.** In the textile example, the procedure stripped the evaluative adjective because you couldn't anchor it visually in 90 words. This protects you from the "does the feeling for you" complaint, but it makes your writing more clinical.
  3.  **The Destroyed Work.** You must be honest about the mediation. You are curating the *memory* of the object, not the object.

  **Final Recommendation:** Run this protocol for two shows. Track the visitor complaints. If the "clinical" tone reduces engagement, bring the "Values Call" to your Director: *"I can either be philosophically honest about the acquaintance principle, or I can be persuasive. The protocol forces honesty. Do we want honesty or persuasion?"* That is the decision the procedure cannot make for you.
