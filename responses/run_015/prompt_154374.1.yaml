          *   **B (Structured Pluralism):** Defends commensurability (or at least denies genuine incommensurability). Values are plural but comparable. Monetization is a pragmatic heuristic, not metaphysical. Proposes multi-attribute decision models with lexical veto rights/partial ordering.
      *   **Constraints:**
