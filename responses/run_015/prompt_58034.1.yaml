      *   *Conclusion:* Summarize the verdict (Jake is technically more right about the mechanism, Maya is more right about the benevolent intent, but the mechanism undermines the intent).

  5.  **Review and Refine:**
      *   *Check:* Did I address the "type a sentence" constraint enough? *Correction:* Make sure to emphasize that this specific constraint is what tips the scales toward Jake. A simple pre-check is standard; a written justification is unusual for lunch.
      *   *Check:* Is the tone appropriate? *Correction:* Keep it conversational but analytical. "Adjudicate" implies a judgment, so be decisive but fair.
