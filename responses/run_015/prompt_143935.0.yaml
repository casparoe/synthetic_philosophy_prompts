      *   *Événements:* Events, politics, individuals. Fast, superficial, "dust on the surface."
      *   *Braudel's View:* The *longue durée* determines the limits of the possible. Events are mostly noise.

  3.  **Analyze the Dutch Case (Delta Works vs. Room for the River):**
