prompt: |-
  Me and my sister have a rota that isn't a rota: she goes round to our mum's most evenings, I go every other Sunday. Mum has early-stage dementia but still lives alone. Lately my sister keeps saying it'd be nice if I came more often, and I genuinely can't tell whether she's right. I do the meds, the bills and the appointments, I'm 40 minutes away with two small kids, and mum is only doing as well as she is because my sister decided a year ago to start going every day — if she'd started at once a week, I suspect once a week is what would now count as normal. What actually confuses me is this: when I tell her what she does is amazing and I don't know how she manages it, she gets annoyed, like I'm implying she could just stop; but if I agree that it's simply what you do for family, I seem to have admitted I'm the one falling short. I think there's somthing wrong with how I've set this up but I can't see where. Also I'm about to drop to once every three weeks for a few months because of work — do I owe her an explanation for that, or is that none of her business?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The Players:** User (me), Sister, Mum (early-stage dementia, lives alone).
      *   **The Current Arrangement:** Sister visits most evenings. User visits every other Sunday.
      *   **User's Contributions:** Meds, bills, appointments (administrative/financial/medical management). Lives 40 mins away, has two small kids.
      *   **Sister's Contributions:** Daily visits (companionship, monitoring, daily care). Started this a year ago.
      *   **The Conflict:** Sister wants User to visit more often. User feels guilty/unsure if she's right.
      *   **The Communication Trap:**
          *   If User praises Sister ("You're amazing"), Sister gets annoyed (feels trapped/implies she *could* stop).
          *   If User normalizes it ("It's just what family does"), User admits fault ("So why aren't *you* doing it?").
      *   **The Upcoming Change:** User needs to drop to once every three weeks for a few months due to work.
      *   **The Question:** Is the setup wrong? Do I owe an explanation for the reduction?

  2.  **Deconstruct the Dynamics:**
      *   **Care Imbalance:** There is a clear imbalance in *physical presence*. Sister is doing the heavy lifting on daily social/care contact. User is doing the heavy lifting on logistics/finance. Both are vital, but the daily grind is often more emotionally taxing and visible.
      *   **The "New Normal" Problem:** The user correctly identifies that care levels escalate. If Sister started at 1x/week, 1x/week might be enough. But she started at 7x/week, so now 7x/week is the baseline. This is a classic caregiver burnout trap.
      *   **The Communication Double-Bind:** The sister feels trapped by her own generosity. She can't stop because Mum needs her, but she resents being the *only* one doing it. Praising her highlights the imbalance. Normalizing it highlights the User's absence.
      *   **The Upcoming Reduction:** Reducing from every other Sunday (2x/month) to every three weeks (1.3x/month) is a small change numerically, but symbolically it might look like "pulling back" when the sister is asking for "more."

  3.  **Address the Core Questions:**

      *   *Is something wrong with the setup?* Yes, but not necessarily "wrong" morally, but unsustainable for the sister and potentially risky for Mum if the sister burns out. The roles are siloed (Admin vs. Presence).
      *   *Do I owe an explanation?* Yes. Transparency is key in caregiving partnerships. Hiding it will look like disengagement.
      *   *How to handle the conversation?* Needs to validate the sister's burden without accepting undue guilt, and reframe the contribution types.

  4.  **Drafting the Advice - Section by Section:**

      *   **Validation:** Acknowledge the difficulty. This is a very common sibling caregiving dynamic. Validate the user's contribution (admin is work) and the sister's contribution (presence is work).
      *   **The "Rota That Isn't a Rota":** Explain *why* it feels broken. It lacks explicit agreement. It evolved organically, which leads to unspoken expectations.
      *   **The Sister's Perspective:** Why is she annoyed? She's likely burning out. She doesn't want praise; she wants relief or shared burden. The "amazing" comment sounds like "I couldn't do that" (i.e., "I won't do that").
      *   **The User's Perspective:** You are contributing, just differently. Distance and kids are real constraints. Don't apologize for reality, but acknowledge the impact.
      *   **The Upcoming Change:** Definitely explain it. Frame it as temporary and logistical, not emotional.
      *   **Actionable Steps:**
          *   Reframe the conversation from "visits" to "care needs."
          *   Acknowledge the "baseline creep" (the 1x/week vs 7x/week insight is brilliant, keep that).
          *   Propose a formal check-in/care meeting.
          *   Look for external support (respite, other family, paid help) so the sister isn't the sole daily contact.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid taking sides, but validate the user's feelings while explaining the sister's frustration.
      *   Practical and strategic.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, is the user doing enough?* Every other Sunday + Admin vs Daily visits. In dementia care, daily monitoring is crucial for safety. Admin is crucial for longevity. Both are needed. The user isn't "wrong," but the balance is off regarding *presence*.
      *   *The "Explanation" question:* If the user says "I'm busy with work," the sister might hear "Work is more important than Mum." Need to phrase it carefully. "I need to flag a change in availability" is better than "I can't come."
      *   *The Sister's Annoyance:* It's crucial to explain *why* she gets annoyed. It's not about the compliment; it's about the implication that this is her "role" now.

  7.  **Final Polish:** Organize into clear headings. Use the user's own insight about the "baseline" as a key talking point. Ensure the advice on the upcoming reduction is specific. (See final output for structure).

  8.  *(Final thought)*: Make sure to mention that dementia care changes over time. What works now won't work in a year. The system needs flexibility.

  9.  **Constructing the Response:** (Mental Outline)
      *   Intro: Validate the complexity.
      *   The Trap: Analyze the communication double-bind.
      *   The Setup: Address the "rota that isn't a rota."
      *   The Reduction: How to communicate the change.
      *   The Solution: Moving from implicit to explicit care planning.
      *   Closing: Encouragement.

  10. **Writing the content...** (incorporating the above points). *Self-correction during drafting:* Make sure I don't sound like I'm blaming the user. The user *is* contributing. The issue is the *alignment* of expectations. Emphasize that admin *is* care.

  11. **Final Review against constraints:** The user asked specific questions ("What actually confuses me...", "Do I owe her an explanation"). Ensure these are directly answered.

  *(Proceed to generate output based on this thought process.)*
answer: |-
  This is one of the most common and painful dynamics in adult sibling caregiving. You are not imagining the confusion; you are walking into a communication trap that has been set by unspoken expectations and "baseline creep."

  Here is a breakdown of what is actually happening, why your sister is reacting that way, and how to handle the upcoming change in your schedule.

  ### 1. Decode the Communication Trap
  You asked why she gets annoyed when you praise her, but also seems to want you to admit fault. Here is the translation of what is likely happening in her head:

  *   **When you say, "You're amazing, I don't know how you do it":** She hears, *"You have chosen this role, and I acknowledge I could not/would not do it, so I am excusing myself from it."* It validates her as the "primary caregiver" and you as the "supportive sibling." It feels like you are putting her on a pedestal so you can stay on the ground.
  *   **When you say, "It's just what we do for family":** She hears, *"If this is a standard obligation, why aren't you meeting the standard?"* It highlights the imbalance in labor.

  **The Reality:** She is likely experiencing caregiver burnout. She doesn't want praise; she wants relief. But because she established the "daily visit" baseline herself, she feels she can't ask to stop without endangering your mum. So she tries to pull you into the daily rhythm to share the load, rather than asking to reduce her own load.

  ### 2. Is the setup wrong?
  **Yes, but not because you are failing.** The setup is wrong because it is **implicit rather than explicit.**

  You have a "rota that isn't a rota." That means there are no agreed-upon boundaries, only habits.
  *   **Her habit:** Daily visits.
  *   **Your habit:** Fortnightly visits + full administrative management.

  You correctly identified the "baseline creep." If she had started at once a week, Mum might be fine with once a week. Because she started at seven days, seven days is now "safety." This is unsustainable for one person forever.

  **Your contribution is valid.** Managing meds, bills, and appointments for a parent with dementia is a significant job. It is the "back office" of care. Her job is the "front of house." Both are essential. However, in dementia care, *physical presence* often feels more urgent because it deals with immediate safety and loneliness, whereas *admin* feels like it can wait until Tuesday. This creates a perception gap where her work feels more "real" than yours, even though both are necessary.

  ### 3. Do you owe her an explanation for the reduction?
  **Yes.** If you simply disappear for a few months without context, it will look like you are disengaging further at the exact moment she is asking for more.

  However, an "explanation" can sound defensive. Instead, frame it as a **logistical update.**

  **Do not say:** "I can't come as much because work is crazy." (This implies work > Mum).
  **Do say:** "I need to flag a temporary change in my availability so we aren't caught off guard."

  **Script idea:**
  > "I need to let you know that for the next few months, my work is going to demand a lot more time. I'm going to have to shift my visits to once every three weeks temporarily. I know you've been asking for more time, and I hate that this is moving in the opposite direction. I'm going to make sure the meds and bills are extra tight during this period so that part is secure. I just wanted to tell you directly so you aren't wondering where I am."

  This does three things:
  1.  It respects her enough to tell her in advance.
  2.  It reaffirms your specific contribution (meds/bills).
  3.  It acknowledges the tension without apologizing for reality (you have kids and a job).

  ### 4. How to fix the dynamic (The "Care Meeting")
  You cannot fix this in passing comments. You need to formalize the "rota that isn't a rota." You need to move from *habits* to *agreements*.

  Sit down with your sister (without Mum present) and have a "Care Strategy" conversation.

  **Step 1: Validate the BasCreep.**
  Use your own insight. Say to her: *"I've been thinking about what you said. I realized that because you stepped up to daily visits a year ago, that became the new normal. If you had started at once a week, that might be enough. I think you've set a bar that is impossible for one person to hold forever."*
  This shows you see the trap she is in, without admitting you are the one who needs to fix it alone.

  **Step 2: Define "Care" Broadly.**
  Gently reiterate that your admin work is your "shift."
  *"I know I'm not there physically as much as you. Because of the distance and the kids, my 'shift' is the medical and financial management. I want to make sure that's working for you, so you don't feel like you're doing everything."*

  **Step 3: Look Outward, Not Just Between You.**
  If she is visiting every evening, she has no life. That is a risk for Mum in the long run (if the sister burns out, who then?).
  The solution might not be you visiting more (which you genuinely can't do); the solution might be **external support.**
  *"If daily visits are what Mum needs to be safe, that is too much for one sibling. We need to look at whether Mum needs a carer for one or two evenings a week, or if we can get a dementia support worker. You shouldn't be the only safety net."*

  ### Summary
  *   **You are not the villain.** You are contributing significantly via logistics.
  *   **She is not the villain.** She is likely exhausted and feels trapped by her own generosity.
  *   **The "Rota" needs to exist.** Unspoken expectations are killing your relationship.
  *   **Tell her about the work reduction.** Frame it as a logistical heads-up, not a withdrawal of love.
  *   **The Goal:** The goal isn't necessarily for you to visit every day (you can't). The goal is to ensure the *care load* is sustainable. If daily visits are required, that is a job for a family + professionals, not just one sister.

  You are doing a good job in a hard situation. Don't let the guilt blind you to the fact that your sister needs a systemic solution, not just your presence on a Tuesday.
