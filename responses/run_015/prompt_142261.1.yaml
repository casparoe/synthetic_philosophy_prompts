answer: |-
  Here is a complete lesson plan designed to operationalize the St. Petersburg Paradox (SPP) as a lived experience rather than a calculation.

  ### **Activity Title:** The House Always Wins (Eventually)
  **Time:** 75 Minutes
  **Students:** 18 (4 groups of 4–5)
  **Materials:**
  *   **Currency:** "Decision Dollars" (DD). Printed script or poker chips.
      *   Exchange rate: 10 DD = 1 Extra Credit Point (ECP) on next problem set.
      *   Max ECP available per student for this activity: 2.0 (Cap losses at 0 so no one loses existing credit).
  *   **Endowment:** Each student starts with **50 DD**.
  *   **Tables:** 4 Clusters. Each has a Table Tent with specific rules, a Coin (or digital flipper), and a Record Sheet.
  *   **The Vault:** A large whiteboard section visible to the room. Starts at **1,000 DD**.
  *   **Bidding Slips:** Small pieces of paper for sealed bids.
  *   **Envelopes:** 4 Sealed Envelopes for Table 2 (Ambiguity).

  ---

  ### **The Four Tables**

  **Table 1: The Depleting Vault (Systemic Risk)**
  *   **Game:** Standard St. Petersburg (Flip until Tails. Pay $2^k$ DD).
  *   **Constraint:** All payouts are drawn from the **Global Vault** (Whiteboard).
  *   **Rule:** If the Vault cannot cover a payout, it pays out its remaining balance and closes permanently (House Default). All subsequent players at *all* tables receive 0.
  *   **Goal:** Test how counterparty solvency affects WTP (Willingness To Pay).

  **Table 2: The Black Box (Ambiguity)**
  *   **Game:** St. Petersburg with a House Cap.
  *   **Constraint:** The House has a maximum payout limit $C$.
  *   **Ambiguity:** There are 4 sealed envelopes on the table. Two contain $C=32$ DD. Two contain $C=2048$ DD.
  *   **Rule:** Before bidding, the group draws *one* envelope. They **do not open it** until after all bids are submitted and the first round of play is finished. They know the distribution (50/50), but not the realization.
  *   **Goal:** Test ambiguity aversion vs. risk.

  **Table 3: The Pension Fund (Policy/Time Averaging)**
  *   **Game:** You do not buy a single play. You buy a **Policy**.
  *   **Constraint:** You must commit to playing **10 rounds**.
  *   **Rule:** You pay $10 \times \text{Bid}$. Your payout is the **Arithmetic Mean** of the 10 outcomes.
  *   **Goal:** Contrast the value of a single lottery ticket vs. a repeated strategy (Ergodicity).

  **Table 4: The Benchmark (Finite Risk)**
  *   **Game:** St. Petersburg capped at $2^{10}$ (1024 DD).
  *   **Constraint:** Hard cap known to all.
  *   **Rule:** Standard play.
  *   **Goal:** Provide a calculable EV baseline for the debrief.

  ---

  ### **Timeline & Facilitation**

  #### **0:00 – 0:05 | Setup & Endowment**
  *   Hand out 50 DD to each student.
  *   **Script:** "This currency buys extra credit. 10 DD = 1 point. You keep what you end with. If you hit 0, you're out of the game but safe on your grade. Do not trade money. Do not share coins. Write your name on your money bag."
  *   **Constraint:** "I will not use the words 'average,' 'expectation,' or 'value' until the end. If I slip, you get a free DD."

  #### **0:05 – 0:25 | Round 1 (Bidding & Play)**
  *   Groups assign themselves to Tables 1–4.
  *   **Bidding (5 mins):**
      *   Each student writes a **Sealed Bid** (Max 20 DD).
      *   **Mechanism:** To keep it simple and incentive-compatible: You pay your bid to play. If you win, you keep the payout. If you lose (Tails on first flip), you lose the bid.
      *   *Note:* This is a "Take it or leave it" price set by the student.
  *   **Play (15 mins):**
      *   Students play their purchased tickets.
      *   **Table 1:** After every payout, the "Banker" (rotating student role) subtracts from the Global Vault on the whiteboard.
      *   **Table 2:** Do **not** open the envelope yet.
      *   **Table 3:** Run the 10 flips. Calculate the average.
      *   **Table 4:** Standard play.
  *   **Facilitator:** Circulate. Do not answer questions about "what the math says." Answer only rule clarifications. If the Vault gets low, announce: "Vault is at 400 DD."

  #### **0:25 – 0:30 | Rotation & Vault Update**
  *   Groups rotate clockwise (1→2, 2→3, 3→4, 4→1).
  *   **Crucial Moment:** Table 1 (Vault) now has a new group. They see the depleted balance on the board.
  *   **Table 2:** The previous group leaves the sealed envelope on the table. The new group draws a *fresh* envelope from the supply (maintaining the 50/50 distribution).
  *   Students receive a fresh 10 DD stipend for Round 2 (to prevent ruin from Round 1 stopping participation).

  #### **0:30 – 0:50 | Round 2 (Bidding & Play)**
  *   Repeat Bidding and Play.
  *   **Table 1:** The new group bids knowing the Vault is lower. If the Vault hits 0 during Round 1, this group plays for free (House Default) or the game is cancelled. (Recommendation: If Vault hit 0 in Round 1, Table 1 Round 2 is "House Bankrupt." No plays allowed. This is a powerful lesson).
  *   **Table 2:** Open the envelope *after* bidding but *before* playing.
  *   **Table 3:** New group commits to the 10-round policy.
  *   **Table 4:** New group plays the Benchmark.

  #### **0:50 – 1:15 | The Debrief (The Dialectic)**
  *   Collect all money and bidding slips.
  *   Put data on the board (Anonymized).

  ---

  ### **Debrief Script & Mapping**

  **1. The Gap (5 mins)**
  *   **Action:** Calculate the EV of Table 4 (Benchmark) on the board. (Cap 1024, EV $\approx$ 10 DD).
  *   **Ask:** "Look at the bids for Table 4. Who bid over 10 DD?" (Hands go up). "Who bid under 5 DD?" (Hands go up).
  *   **Point:** "The math says the ticket is worth 10. The market says it's worth 6. Who is wrong? The math, or you?"
  *   **Theory:** Introduce **Expected Utility**. The money isn't linear to you. Losing 20 DD hurts more than gaining 20 DD helps.

  **2. The Bust vs. The Luck (5 mins)**
  *   **Action:** Find a student who bid high (e.g., 15 DD) and got Tails on Flip 1 (Loss = 15 DD). Find a student who bid low (e.g., 2 DD) and got 5 Heads (Win = 32 DD).
  *   **Ask:** "Student A followed the math (sort of) and lost. Student B ignored the math and won. Did Student A make a mistake?"
  *   **Point:** Distinguish **Decision Quality** from **Outcome Quality**. A good decision can have a bad outcome. This is the core of decision theory under risk.

  **3. The Vault (5 mins)**
  *   **Action:** Point to the Whiteboard.
  *   **Ask:** "Table 1, Round 1 bids vs. Table 1, Round 2 bids. Did they change?"
  *   **Scenario:** If the Vault drained significantly, Round 2 bids should be lower (or zero if bankrupt).
  *   **Point:** "The rules of the game didn't change. The *counterparty* changed." This maps to **Finite Bankroll** resolutions. The EV is infinite only if the House is infinite. You weren't pricing the game; you were pricing the House's solvency.

  **4. The Policy (5 mins)**
  *   **Action:** Compare Table 3 (10-round average) to Table 4 (1-round).
  *   **Ask:** "Did the 10-round players feel safer or more anxious?"
  *   **Point:** "In most games, repeating reduces risk (Law of Large Numbers). In St. Petersburg, the variance is so high that averaging 10 times doesn't stabilize the outcome like it does in a normal casino."
  *   **Theory:** This introduces **Ergodicity**. The time average (playing many times) does not converge to the ensemble average (the EV) because the mean doesn't exist (or is unstable). This validates the "Time Averaging" resolution your student mentioned.

  **5. The Black Box (5 mins)**
  *   **Action:** Reveal the Table 2 envelopes.
  *   **Ask:** "Did knowing the distribution (50/50) feel different than knowing the cap?"
  *   **Point:** This is **Knightian Uncertainty**. When you don't know the parameters, you bid lower than when you know the risk. This maps to **Ambiguity Aversion**.

  **6. The Summation Claim (5 mins)**
  *   **Address the Student's Claim:** "One of you asked last week if the expectation is undefined because the sum depends on the order of terms."
  *   **Correction:** "For the standard St. Petersburg game, the terms are all positive ($\sum 1$). Order doesn't matter; it diverges to infinity regardless. However, you are right that for *other* infinite games with wins and losses, order *does* matter (Riemann Series Theorem)."
  *   **Pivot:** "But here is the deeper truth: In the real world, we never sum to infinity. We stop when the House runs out of money (Table 1) or time runs out. The 'Infinity' is a mathematical artifact of ignoring physical constraints."

  ---

  ### **Predictable Failure Modes & Fixes**

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The Joker** | One student bids 0 or 100 to break the data. | **Fix:** In debrief, treat outliers as "noise." Ask the class: "If we remove this bid, does the pattern change?" Usually, it doesn't. |
  | **The Hedger** | Students pool money to buy more tickets. | **Fix:** Enforce "Individual Endowments." Check IDs against money bags. |
  | **Vault Math Lag** | Subtracting $2^k$ from the board takes too long. | **Fix:** Pre-print a "Depletion Chart." Banker just circles the new balance. |
  | **Coin Physics** | Coins fall off tables / slow flipping. | **Fix:** Use large foam coins or a phone app projected on the table. |
  | **EC Skepticism** | "I don't care about 2 points." | **Fix:** Remind them at minute 0 and minute 50. "I am recording final balances now." Social pressure helps. |
  | **Ruin** | A student loses all money in Round 1 and sits out Round 2. | **Fix:** The Round 2 Stipend (10 DD) ensures everyone can participate again. |
  | **The Tail** | No one flips 10+ heads. | **Fix:** Acknowledge this explicitly. "We didn't see the tail. That's why the EV feels fake. The value is in the one-in-a-billion event we didn't see." |

  ---

  ### **What This Activity Cannot Reproduce (Facilitator Notes)**

  You must state these limitations aloud at the very end to close the loop intellectually.

  1.  **The Unstageable Tail:** "We played ~100 rounds total. To see the 'infinite' value, we needed a run of 30 heads. The odds are 1 in a billion. We didn't see it. Therefore, the *experienced* value was low, even if the *theoretical* value is high. This is the problem of **Sample Size vs. Support**."
  2.  **Lifetime Aggregation:** "In this game, you played for 20 minutes. In life, you make decisions over 50 years. A policy that ruins you in 20 minutes (high variance) might be fine over 50 years if you can recover. But if the ruin is death (or failing the course), the time horizon matters."
  3.  **The "Fair Price" Illusion:** "We asked you for a 'fair price.' But there is no such thing as a fair price for a lottery you only play once. There is only a price *you* are willing to pay given *your* risk tolerance. The paradox disappears when you admit value is subjective, not objective."

  ### **Final Facilitator Check**
  *   **Do not say "Expected Value"** until the Debrief. Use "The Number," "The Math Price," or "The Average Payout."
  *   **Watch the Vault:** If Table 1 drains too fast in Round 1, announce the default dramatically. "The House is closed." This is the highlight of the lesson.
  *   **Validate the Dissent:** When the student who mentioned the summation order speaks up in debrief, validate their intuition about infinities being unstable, even if the specific math for SPP was slightly off. It shows you listen.

  This plan moves the paradox from a calculation on a board to a tension in the room. They will feel the hesitation before bidding, the sting of the bust, and the relief of the vault holding. That feeling *is* the theory.
