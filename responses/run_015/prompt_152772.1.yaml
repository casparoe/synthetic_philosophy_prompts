  ### 3. An Alternative Rule: "The Psychological Entrenchment Rule"

  Here is a rule that fits all 8 of her existing entries but diverges from the one above.

  *   **The Rule:** **HINGE** = Propositions the subject feels they *cannot* doubt and for which no standard verification procedure is *routinely* invoked. **NOT A HINGE** = Propositions where a verification procedure is socially recognized and accessible (passport, lab), even if not currently used.
  *   **Where it fits the existing 8:**
      *   *Hands/Earth:* No one checks these routinely; doubt feels impossible. (HINGE)
      *   *Name/Water:* We acknowledge passports and labs exist. (NOT A HINGE)
      *   *Pain/Physical World:* Verification is conceptually confused. (WRONG QUESTION)
  *   **Where it diverges:**
      *   **Case 2 (The Moon):** Under the **Entrenchment Rule**, this is a **HINGE**. She never checks it, she can't imagine doubting it, and it feels foundational to her biography. Under the **Framework Rule** (my prediction above), it is **NOT A HINGE** because it plays no constitutive role in her language-games.
      *   **Case 1 (Jonah):** Under the **Entrenchment Rule**, this could be a **HINGE** for Jonah now (he treats it as bedrock). Under the **Framework Rule**, it is **NOT A HINGE** because he possesses grounds.

