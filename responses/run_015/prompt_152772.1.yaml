  2.  **Tribal Hinges:** This also maps to her **HINGE** bucket. She already accepts "moral hinges" and the Highland case shows she accepts local forms of life. For her, "Tribal" isn't a separate category; it's just *which* language-game the hinge belongs to.
  3.  **Quiet Certainties:** **This drawer is empty.**
