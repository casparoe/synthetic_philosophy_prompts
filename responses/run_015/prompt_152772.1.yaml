  ### 5. The Further Test Question

  To settle whether she is running the **Framework Rule** (Logical Role) or the **Entrenchment Rule** (Psychological/Pragmatic), ask her this:

  > *"If I memorize the evidence for a hinge proposition—for example, I learn the physics of why objects fall—does 'gravity exists' stop being a hinge for me and become a NOT A HINGE?"*

  *   **If she says YES:** She is running the **Framework/Grounds Rule**. (Having grounds moves it to empirical knowledge).
  *   **If she says NO:** She is running the **Entrenchment Rule**. (It doesn't matter if you have grounds; what matters is that you don't actually doubt it in practice).

