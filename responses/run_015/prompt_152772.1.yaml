  Here is the breakdown of the postdoc's likely operating system, the verdicts on your three cases, and the structural analysis you asked for.

  ### 1. The Postdoc's Rule: "The Framework vs. Finding Distinction"

  Based on her notes, she is running a strict Wittgensteinian distinction between **propositions that constitute a language-game** and **propositions that are moves within it.**

  *   **HINGE:** Propositions that function as the *scaffolding* or *riverbed* for inquiry. They are not justified by evidence within the system; rather, they make the evidence possible. (e.g., "Two hands," "Earth existed," "Rod has length"). Note that "Moral hinge" fits here because it constitutes the moral language-game, not because it's empirically true.
  *   **NOT A HINGE:** Empirical propositions that are *verified* within the system, even if we are extremely confident about them. They have "grounds" (passports, lab results, historical records). (e.g., "Name is Anna," "Water is H2O").
  *   **WRONG QUESTION:** Propositions that attempt to step outside the language-game entirely (global skepticism) or express immediate experience where truth-conditions don't apply (avowals). (e.g., "Physical world," "In pain").

  **Why Earth passes but Water fails:**
  For her, "The earth existed for a long time" is the *picture* within which geology happens. If you doubt that, you aren't doing geology; you're doing theology or solipsism. "Water is H2O" is a *discovery* made within the picture of chemistry. You can do chemistry without knowing H2O (they did for centuries), but you can't do chemistry without assuming stable substances exist over time. One is the board; the other is a piece on the board.

  ### 2. Verdicts on Your Three Cases

  **Case 1: Jonah and the Age of the Earth**
  *   **Verdict:** **NOT A HINGE.**
  *   **Reasoning:** For the reading group generally, "The earth is very old" is a HINGE (world-picture). But "4.5 billion years" is a specific scientific finding (like H2O). For Jonah specifically, the fact that he *has grounds* (radiometric dating) disqualifies it from being a hinge. In *On Certainty*, hinges are essentially groundless; they are the things we do not check. Because Jonah *could* check and defend it with evidence, it has migrated from a religious hinge (in his childhood) to an empirical claim (in his adulthood). It is now knowledge, not certainty.

  **Case 2: The Postdoc and the Moon**
  *   **Verdict:** **NOT A HINGE.**
  *   **Reasoning:** This is the critical test for your taxonomy. For her, "I have never been to the moon" is a biographical fact. It is empirically verifiable (flight logs, memory, physical impossibility). Crucially, if it turned out false (e.g., she was a secret astronaut with amnesia), her entire system of reasoning about the world would not collapse. It does not hold up the roof; it's just a piece of furniture in the room. It is a "quiet certainty" in your sense, but in her logical taxonomy, that just means it's a very secure empirical proposition.

  **Case 3: The Highland Community and the Ancestors**
