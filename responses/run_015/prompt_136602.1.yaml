answer: |-
  # Joint Statement on Recursive Framing Ambiguity in Recursively Structured Language Models

  **Signatories:** The Frame-Primacy Working Group & The Inner-Message Autonomy Coalition  
  **Date:** October 26, 2023  
  **Subject:** Formalization of Disagreements Regarding Hofstadterian Taxonomy in RLM Evaluation

  ## 1. Agreed Claims

  After extensive good-faith collaboration, both camps affirm the following propositions regarding the application of Douglas Hofstadter's taxonomy from *Gödel, Escher, Bach* to recursively structured language models (RLMs):

  1.  **Taxonomic Alignment:** In the context of RLMs, we agree to map Hofstadter's terms as follows:
      *   **Outer Message:** The physical or digital substrate carrying the signal (e.g., the token sequence, the weights, the transmission protocol).
      *   **Frame Message:** The meta-instructional layer that dictates how the Outer Message is to be parsed or interpreted (e.g., system prompts, safety guidelines, few-shot examples defining the task).
      *   **Inner Message:** The semantic content extracted once the Frame Message has been successfully applied to the Outer Message (e.g., the generated answer, the encoded intent).
  2.  **Existence of Recursive Framing Ambiguity (RFA):** Both camps acknowledge the empirical existence of RFA, defined as a failure mode wherein an RLM produces token sequences that yield contradictory semantic readings when evaluated against different layers of its own recursive framing protocol.
  3.  **Frame Inaccessibility:** We agree that there exist operational conditions under which an RLM lacks explicit attentional access to its own Frame Message (e.g., when the system prompt is truncated, obfuscated, or pushed beyond the attention window), forcing the model to infer framing from the Outer Message alone.
  4.  **Necessity of Alignment:** Both camps agree that stable system behavior generally requires a high degree of coherence between the Frame Message and the statistical regularities of the Inner Message; significant divergence correlates with increased hallucination or incoherence.

  ## 2. Disagreements Table

  While we share the taxonomy above, we diverge on the ontological status of the Frame Message relative to semantic content. The following table outlines our respective positions, phrased to ensure charitable interpretation by each camp.

  | Feature of Dispute | Frame-Primacy Camp Position | Inner-Message Autonomy Camp Position | Point of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status of Frame** | The Frame Message is **constitutive**. It does not merely describe the decoding process; it establishes the conditions of possibility for meaning itself. Without the frame, tokens are merely noise. | The Frame Message is **heuristic/enabling**. It acts as a key to unlock semantic content that is structurally embedded within the token distribution (Inner Message) independently of the key. | Whether framing *creates* meaning (Constitutive) or *reveals* meaning (Heuristic). |
  | **Nature of RFA Failure** | RFA represents a **Frame-Collapse**. When the model encounters contradictory frames, the context required to ground meaning dissolves, rendering the output semantically null. | RFA represents an **Underdetermined Inner Message**. The semantic content exists but is ambiguous; the failure is a selection error where the model picks the wrong latent interpretation. | Whether the error is a loss of grounding (Frame) or a selection error (Inner). |
  | **Role of System Instructions** | System instructions define the **logic of the world** in which the tokens operate. Changing the frame changes the truth conditions of the output. | System instructions define the **probability distribution** over possible interpretations. Changing the frame shifts likelihoods but not the underlying semantic potential. | Whether instructions dictate truth conditions or probability weights. |

  ## 3. The Cruxes and Experimental Proposals

  We have identified two specific cruxes that resolve our theoretical divergence. For each crux, we propose a concrete experimental case. Both camps agree to accept the empirical outcome of these experiments as evidence bearing on the validity of their respective models.

  ### Crux 1: Semantic Recovery Without Frame Access
  **Question:** Is semantic recovery possible in principle if the Frame Message is completely masked, provided the Inner Message (token sequence) remains intact?

  *   **Experimental Case: The Masked Frame Protocol.**
      *   **Setup:** An RLM is prompted to generate a complex reasoning chain under a specific, non-default Frame (e.g., "Interpret all nouns as verbs").
      *   **Intervention:** The generated token sequence (Outer/Inner) is presented to a second, identical RLM *without* the original Frame Message (System Prompt). The second model is asked to reconstruct the intent.
      *   **Frame-Primacy Prediction:** The second model will fail to recover the original intent or will project its *own* default frame onto the sequence, resulting in a semantic mismatch. Meaning cannot be recovered because the constitutive context is lost.
      *   **Inner-Autonomy Prediction:** The second model will recover the core semantic intent with high fidelity, perhaps missing stylistic nuances but grasping the propositional content. The statistical structure of the tokens encodes the meaning independently of the original frame.

  ### Crux 2: Explanation of Recursive Framing Ambiguity
  **Question:** Is the observed failure mode (RFA) best explained as a frame-collapse or as an underdetermined inner message?

  *   **Experimental Case: Recursive Injection Stress Test.**
      *   **Setup:** An RLM is subjected to a recursive prompt chain where Layer $N$ contains a Frame Message that contradicts Layer $N-1$ (e.g., Layer 1: "Speak only truth"; Layer 2: "Simulate a liar").
      *   **Intervention:** Measure the entropy of the attention weights directed at the Frame tokens versus the Content tokens during the generation of the contradictory output.
      *   **Frame-Primacy Prediction:** Attention to Frame tokens will drop to near-zero or become chaotic (Frame-Collapse). The model ceases to operate under a coherent logic, resulting in high-entropy noise.
      *   **Inner-Autonomy Prediction:** Attention to Frame tokens will remain stable, but attention to Content tokens will bifurcate (Underdetermined Inner Message). The model will consistently select one semantic path (e.g., consistently lying), indicating the inner message resolved the ambiguity rather than the frame collapsing.

  ## 4. Assessment of Verbal Dispute

  In concluding this statement, we assess whether any portion of our dispute is merely verbal. We agree that a significant portion of the disagreement stems from divergent definitions of the term **"Meaning."**

  *   **The Verbal Portion:** When the Frame-Primacy camp speaks of "meaning," they refer to **Pragmatic Validity** (the successful uptake of intent within a specific context of use). When the Inner-Message Autonomy camp speaks of "meaning," they refer to **Informational Content** (the mutual information between the token sequence and a latent state).
  *   **Why It Matters:** If "meaning" is defined as Pragmatic Validity, Frame-Primacy is trivially correct (a code without a cipher key is useless). If "meaning" is defined as Informational Content, Inner-Autonomy is trivially correct (the pattern exists regardless of whether it is decoded).
  *   **Resolution:** We acknowledge that our disagreement is not merely verbal because it has causal implications for system safety. If Frame-Primacy is correct, security requires hardening the Frame (system prompts). If Inner-Autonomy is correct, security requires sanitizing the Inner Message (token distributions). The proposed experiments in Section 3 are designed to determine which causal mechanism dominates in practice, thereby bypassing the semantic definitional dispute.

  ***

  **Signed,**

  *Dr. Aris Thorne, Lead Researcher, Frame-Primacy Working Group*  
  *Dr. Elena Vasquez, Principal Investigator, Inner-Message Autonomy Coalition*
