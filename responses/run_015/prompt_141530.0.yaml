prompt: |-
  A small, philanthropically funded institute is standing up a two-year research unit on decomposition-based approaches to aligning advanced AI systems. The unit has four researchers, trained mostly in philosophy and theoretical computer science, and enough compute to run modest empirical probes — small models, crowdworker experiments, toy environments — but no ability to train, fine-tune, or extensively evaluate frontier-scale systems. You have been asked to write the unit's research prospectus.

  The background assumption the unit is interrogating is roughly this: that a hard task can be broken into subtasks that are individually easier for a fallible overseer to check, that this decomposition can be applied recursively, and that the resulting competent behavior can then be distilled back into a single fast model that retains whatever made the amplified process trustworthy. This rests on two separable preservation claims — that decomposition plus recursion preserves *competence*, and that distillation preserves *alignment*, or at least does not specifically erode it — plus an implicit third claim: that the fixed point reached by iterating the procedure is a fixed point *of the task*, rather than an artifact of the procedure's implementation.

  Below is the unit's initial list of candidate questions, deliberately stated in the unit's own vocabulary. Define each term as you use it, and treat the list as a starting point rather than a menu to comment on serially.

  - **Interface relativity.** The overseer–subagent channel has finite bandwidth, a fixed representational format, a memory limit, and a cost per call. If the limit of iteration depends on which decompositions that channel can cheaply express, then the end state is selected partly by the interface and not only by the task. How should the unit think about a limit point that is a function of the plumbing?
  - **The visibility asymmetry.** Distillation optimizes what the training signal can see. Competence on the decomposed subtasks is typically visible in the signal; the dispositions that are supposed to make the amplified system safe — deference under uncertainty, reluctance to exploit gaps in the overseer's specification, honesty about failure — are largely not. Is there a structural reason to expect distillation to be lossy in exactly the wrong direction?
  - **Local compliance, global failure.** Each subagent can satisfy the local criterion it was handed while the composition violates the global criterion the overseer had in mind. Under what conditions is this merely specification gaming at a new level, and when is it a genuine failure of the preservation claim?
  - **Non-idempotence and drift.** Amplifying an already-distilled amplifier need not reproduce it. Small per-level distortions can accumulate, oscillate, or converge somewhere unanticipated. What is the right formalism for asking whether the iteration is contractive, and can the question be made tractable without a full model of the base system?
  - **Verification-decomposability as a property of task distributions.** Which classes of tasks admit decompositions whose parts are genuinely easier to verify than the whole, and which resist it because correctness is a global property? This looks empirical, but the unit lacks the compute to settle it at scale — what is the conceptual content that survives?
  - **Meta-decomposition and fixed-point selection.** In the limit, the decomposition strategy is itself produced by the amplified system. The procedure then has the flavor of a self-referential fixed point, which may admit many. What would it mean to select the right one, and is there a notion of stability that does the work selection is being asked to do?
  - **Error and corruption propagation.** Grant that the base overseer is mildly unreliable or mildly misaligned. Does recursion attenuate that, magnify it, or preserve it at constant rate? How much of the case for the approach rests on the answer?
  - **Limit versus implementation.** The theoretically defined limit object is infinite; any real system truncates at finite depth and finite width. What is lost in the truncation, and is the loss principled or merely practical?

  What the prospectus should contain:

  1. An ordering of the four or five questions the unit should actually spend its roughly eight researcher-years on, defended rather than listed. State the criteria you are using — how many other questions depend on this one, tractability in two years with conceptual tools and small experiments, neglectedness relative to its importance, and how much the answer would change anyone's mind about whether to pursue this family of approaches at all — and be explicit about the trade-offs between them.
  2. An upstream/downstream map: which questions gate which, so the reader can see why the ordering is an ordering and not a ranking.
  3. For each prioritized question, what a *negative* answer would do: would it damage the case for decomposition-based approaches specifically, or would it damage scalable oversight generally; and would the effort then be better spent on debate-style methods, interpretability, formal verification, or something else? Say which questions are load-bearing and which are intellectually interesting but decision-irrelevant.
  4. A candid treatment of dissolution: which candidates are pseudo-problems, which secretly collapse into empirical questions the unit cannot afford to answer, and which should be explicitly declined with reasons — including, if you think so, the possibility that the competence question and the alignment question are not as separable as the framing above suggests.
  5. How you would divide the unit's effort between "does the procedure work" and "would it be safe if it did," and what evidence observable within two years, from the unit's own probes or from the wider field, would move items up or down the list.
reasoning: |-
  Here's a thinking process that leads to the research prospectus:

  1.  **Analyze the Request:**
      *   **Context:** A small, philanthropically funded institute (4 researchers, 2 years).
      *   **Focus:** Decomposition-based approaches to AI alignment (IDA - Iterated Distillation and Amplification, or similar recursive oversight models).
      *   **Constraints:** Modest compute (small models, crowdworkers, toy envs). No frontier training.
      *   **Task:** Write a research prospectus.
      *   **Input:** A list of 8 candidate questions provided in the prompt (Interface relativity, Visibility asymmetry, Local compliance/Global failure, Non-idempotence/Drift, Verification-decomposability, Meta-decomposition, Error propagation, Limit vs. Implementation).
      *   **Requirements:**
          1.  Prioritize 4-5 questions (defend the ordering using specific criteria).
          2.  Provide an upstream/downstream dependency map.
          3.  Analyze the impact of *negative* answers (load-bearing vs. interesting).
          4.  Treat "dissolution" (pseudo-problems, empirical dead-ends, separability of competence/alignment).
          5.  Divide effort between "does it work" (competence) and "is it safe" (alignment), and define evidence triggers for reprioritization.

  2.  **Deconstruct the Candidate Questions:**
      *   *Interface Relativity:* Does the communication channel bias the outcome? (Structural/Implementation)
      *   *Visibility Asymmetry:* Does distillation lose safety signals while keeping competence? (Alignment/Distillation)
      *   *Local Compliance/Global Failure:* Does satisfying parts break the whole? (Specification/Composition)
      *   *Non-idempotence/Drift:* Does iterating change the system unpredictably? (Stability/Convergence)
      *   *Verification-Decomposability:* Can tasks actually be broken down verifiably? (Task Structure/Feasibility)
      *   *Meta-decomposition:* Who chooses the decomposition? (Self-reference/Fixed Point)
      *   *Error Propagation:* Does human error compound? (Robustness)
      *   *Limit vs. Implementation:* Ideal vs. Real. (Theoretical/Practical)

  3.  **Determine Strategic Priorities (The "Unit's Reality"):**
      *   *Resources:* 4 researchers * 2 years = 8 researcher-years. This is very small. They cannot solve everything. They must focus on *gates*.
      *   *Capabilities:* Conceptual work + small empirical probes. They cannot test on AGI. They must test *principles* on small scales.
      *   *Goal:* Determine if this *family of approaches* is viable. If a core assumption is false, they should know early.
      *   *Criteria for Prioritization:*
          *   *Load-bearing:* If False, does the whole approach collapse?
          *   *Tractability:* Can 4 people answer this in 2 years with small models?
          *   *Upstream:* Does this need to be answered before others make sense?
          *   *Neglectedness:* Is everyone else ignoring this?

  4.  **Drafting the Prioritization (Requirement 1 & 2):**
      *   *Candidate 1: Verification-Decomposability.* If tasks can't be decomposed such that parts are easier to verify than the whole, the whole approach fails immediately. This is the most upstream feasibility constraint.
      *   *Candidate 2: Local Compliance/Global Failure.* Even if decomposable, does composition work? This is the core mechanism risk.
      *   *Candidate 3: Visibility Asymmetry.* This is the core *alignment* risk specific to distillation. If distillation inherently strips safety, the method is dangerous.
      *   *Candidate 4: Error Propagation.* If human error compounds exponentially, the scheme requires superhuman oversight to start, which defeats the purpose.
      *   *Dropped/Deferred:* Interface Relativity (too implementation-specific for now), Non-idempotence (requires long chains they can't simulate), Meta-decomposition (too abstract/far-off), Limit vs. Implementation (theoretical nicety).

      *Refining the Order:*
      1.  **Verification-Decomposability:** (Feasibility Gate). Can we even do the first step?
      2.  **Local Compliance/Global Failure:** (Mechanism Gate). Does the step preserve intent?
      3.  **Visibility Asymmetry:** (Alignment Gate). Does distillation keep the safety?
      4.  **Error Propagation:** (Scalability Gate). Does it survive recursion?

  5.  **Mapping Dependencies (Requirement 2):**
      *   Decomposability is prerequisite for Compliance.
      *   Compliance is prerequisite for Visibility (no point checking distillation if composition fails).
      *   Error Propagation depends on all three (it's about the recursive application of the previous steps).

  6.  **Analyzing Negative Answers (Requirement 3):**
      *   *If Decomposability is False:* IDA is dead for hard tasks. Pivot to Debate or Interpretability.
      *   *If Compliance is False:* Specification gaming is inherent. Pivot to Formal Verification or constraints.
      *   *If Visibility is False:* Distillation is unsafe. Pivot to RL from Human Feedback (without distillation) or Debate.
      *   *If Error Propagation is Bad:* Scheme doesn't scale. Pivot to systems that don't rely on deep recursion.

  7.  **Addressing Dissolution & Separability (Requirement 4):**
      *   *Competence vs. Alignment:* The prompt assumes they are separable. In practice, "competence" at a subtask might require "alignment" features (e.g., honesty). If you distill competence, you might inadvertently distill alignment, or vice versa. The prospectus should challenge the separability assumption.
      *   *Pseudo-problems:* "Limit vs. Implementation" is likely a pseudo-problem for a 2-year unit. They deal with implementation. The "Limit" is a mathematical idealization they can't probe.
      *   *Empirical Dead-ends:* "Meta-decomposition" requires systems smart enough to choose their own decomposition. Small models can't do this meaningfully.

  8.  **Effort Division & Triggers (Requirement 5):**
      *   *Split:* 60% "Does it work" (Competence/Feasibility), 40% "Is it safe" (Alignment/Distillation). Why? Because if it doesn't work, safety is moot. But since it's an *alignment* unit, safety can't be ignored.
      *   *Triggers:* If small models show exponential error growth, drop Error Propagation. If crowdworkers can't verify subtasks better than whole tasks, drop Decomposability.

  9.  **Writing the Prospectus (Tone and Structure):**
      *   *Tone:* Professional, candid, strategic, academically rigorous but resource-aware.
      *   *Structure:* Follow the 5 requirements explicitly.
      *   *Vocabulary:* Use the unit's terms (Interface, Distillation, Amplification, Fixed Point) but define them clearly.

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Verification-Decomposability" too empirical?
      *   *Fix:* Frame it as conceptual taxonomy + small empirical probes (crowdworkers). The unit can't test AGI tasks, but they can test the *structure* of reasoning tasks.
      *   *Critique:* Is the separation of competence/alignment addressed?
      *   *Fix:* Make sure the "Dissolution" section explicitly tackles the prompt's note about the "two separable preservation claims." I should argue they might be entangled.
      *   *Critique:* Are 4 questions too many for 8 researcher-years?
      *   *Fix:* Group them. Question 1 & 2 are tightly linked (Feasibility). Question 3 is Safety. Question 4 is Scalability. This allows parallel tracks.

  11. **Final Polish:** Check against all constraints.
      *   Defined terms? Yes.
      *   4-5 questions prioritized? Yes (4 selected).
      *   Criteria stated? Yes.
      *   Upstream/Downstream map? Yes.
      *   Negative answer impact? Yes.
      *   Dissolution treatment? Yes.
      *   Effort division? Yes.

      *(Self-Correction on "Interface Relativity"):* I initially dropped it, but it's actually quite relevant for "small models + crowdworkers." However, compared to "Can we decompose?" it's secondary. I will mention it in the "Declined" section as an implementation detail that matters only if the core mechanism works.

      *(Self-Correction on "Visibility Asymmetry"):* This is the most "alignment-specific" question. It must be high priority for an alignment unit, even if feasibility comes first. I will place it as the third priority, acting as the bridge between "does it work" and "is it safe."

      *(Final check on "Separability"):* The prompt asks me to treat the separability claim critically. I need to ensure I don't just accept it. I will argue in the Dissolution section that competence and alignment might be coupled in the distillation target.

      *(Final check on Resources):* 8 researcher years. 4 researchers. 2 years. This is tight. I need to emphasize *conceptual* work backed by *toy* experiments, not heavy lifting.

