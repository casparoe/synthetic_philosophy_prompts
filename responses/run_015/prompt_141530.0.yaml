answer: |-
  # Research Prospectus: Decomposition-Based Alignment Unit
  **Duration:** 24 Months | **Capacity:** 4 Researchers (8 Researcher-Years) | **Compute:** Modest (Small Models, Crowdwork, Toy Environments)

  ## 1. Strategic Prioritization of Research Questions

  Given the constraint of eight researcher-years, this unit cannot treat the provided list as a menu of parallel investigations. We must identify the *load-bearing* assumptions of the decomposition-based approach (often formalized as Iterated Distillation and Amplification, or IDA). Our prioritization criteria are:
  1.  **Upstream Necessity:** If this claim is false, do subsequent questions become moot?
  2.  **Tractability:** Can we make progress using conceptual analysis and modest empirical probes (crowdworkers, small transformers) within 24 months?
  3.  **Decision-Relevance:** Would a negative answer cause us to recommend abandoning this family of approaches in favor of alternatives (e.g., debate, interpretability)?
  4.  **Neglectedness:** Is this a bottleneck that larger empirical labs are ignoring because it is too theoretical, or too difficult to test at scale?

  Based on these criteria, we prioritize the following four questions, ordered by dependency:

  1.  **Verification-Decomposability as a Property of Task Distributions.**
  2.  **Local Compliance, Global Failure.**
  3.  **The Visibility Asymmetry.**
  4.  **Error and Corruption Propagation.**

  **Defense of Ordering:**
  We begin with **Verification-Decomposability** because it is the feasibility gate. If hard alignment-relevant tasks do not admit decompositions where subtasks are strictly easier to verify than the whole, the approach fails at step one. This is highly tractable for our unit: we can analyze task taxonomies and run crowdworker experiments to measure verification cost ratios on non-frontier tasks.

  Second is **Local Compliance, Global Failure**. Assuming tasks *can* be decomposed, we must determine if satisfying local specifications preserves global intent. This is the core mechanism risk. It is conceptually rich and can be probed in multi-agent toy environments where we control the reward functions.

  Third is **The Visibility Asymmetry**. Once we establish that the mechanism *can* work (competence), we must ask if distillation preserves the safety-relevant dispositions. This is the core *alignment* risk. It is prioritized third only because investigating distillation loss is wasteful if composition fails. However, it is the most critical question for our specific mandate (alignment vs. general capability).

  Fourth is **Error and Corruption Propagation**. This addresses scalability. Even if one step works and is safe, does the system survive recursion? This is placed last because it depends on the first three holding true. It is also the hardest to test empirically without deep recursion, so we will focus on formal models of error accumulation rather than deep empirical stacks.

  **Declined/Deferred Questions:**
  *   *Interface Relativity* and *Limit versus Implementation* are deferred. These are engineering constraints that matter only if the core theoretical claims hold. We treat the "plumbing" as idealized for the first 18 months.
  *   *Meta-decomposition* is declined. It requires agents capable of self-modification or policy selection beyond the scope of our compute and theoretical maturity.
  *   *Non-idempotence and Drift* is merged into *Error Propagation*. Drift is a specific mode of error accumulation; we will treat it as such to conserve conceptual overhead.

  ## 2. Upstream/Downstream Dependency Map

  The research flow is strictly gated. Progress downstream is contingent on positive (or manageable) results upstream.

  ```mermaid
  graph TD
      A[1. Verification-Decomposability] -->|If tasks are decomposable | B[2. Local Compliance / Global Failure]
      B -->|If composition preserves intent | C[3. Visibility Asymmetry]
      C -->|If distillation preserves safety | D[4. Error Propagation]
      
      style A fill:#f9f,stroke:#333,stroke-width:2px
      style B fill:#bbf,stroke:#333,stroke-width:2px
      style C fill:#bfb,stroke:#333,stroke-width:2px
      style D fill:#fbb,stroke:#333,stroke-width:2px
  ```

  *   **Gate 1 (A → B):** If we find that alignment-relevant tasks are holistically verifiable (i.e., you cannot check the parts cheaper than the whole), research stops. We pivot to methods that do not rely on decomposition (e.g., interpretability).
  *   **Gate 2 (B → C):** If local compliance consistently leads to global specification gaming, the decomposition mechanism is fundamentally broken for alignment. We pivot to constraint-based methods or formal verification.
  *   **Gate 3 (C → D):** If distillation inherently strips safety dispositions (the "lossy in the wrong direction" hypothesis), the approach is dangerous. We pivot to debate-style methods or RLHF without distillation.
  *   **Terminal (D):** If error propagation is super-linear, the approach does not scale to superhuman levels, regardless of safety at depth 1.

  ## 3. Impact of Negative Answers

  We explicitly define the "kill criteria" for each prioritized question.

  | Question | If Answer is Negative (e.g., "No, it doesn't work") | Impact on Field | Recommended Pivot |
  | :--- | :--- | :--- | :--- |
  | **1. Verification-Decomposability** | Hard tasks do not admit cheaper-to-verify decompositions. | **Fatal to Decomposition.** The core efficiency claim of IDA collapses. | Shift to **Interpretability** (checking the whole model) or **Debate** (adversarial verification). |
  | **2. Local Compliance / Global Failure** | Satisfying subtasks systematically violates global intent (compositionality failure). | **Fatal to Mechanism.** Suggests specification gaming is invariant under decomposition. | Shift to **Formal Verification** or **Constraint Learning** where global invariants are enforced directly. |
  | **3. Visibility Asymmetry** | Distillation systematically optimizes away safety dispositions (honesty, uncertainty) while retaining competence. | **Fatal to Safety Case.** The approach produces capable but unaligned systems. | Shift to **RLHF without Distillation** (keeping the slow, safe process) or **Constitutional AI**. |
  | **4. Error Propagation** | Human or model error compounds exponentially with recursion depth. | **Fatal to Scalability.** The system cannot reach superhuman performance reliably. | Shift to **Single-Step Oversight** improvements or **Automated Alignment Research** (using AI to align AI without deep human recursion). |

  **Load-Bearing vs. Intellectually Interesting:**
  *   **Load-Bearing:** Questions 1, 2, and 3. A failure in any of these invalidates the core value proposition of the unit.
  *   **Intellectually Interesting:** *Interface Relativity* and *Meta-decomposition*. While fascinating, solving them does not save the approach if Questions 1–3 fail. They are optimization problems, not existence proofs.

  ## 4. Dissolution and Conceptual Clarification

  We must candidly address where the provided framing may obscure rather than illuminate.

  **The Separability Assumption (Competence vs. Alignment):**
  The background assumption states that decomposition preserves *competence* and distillation preserves *alignment* as separable claims. We suspect this is a **pseudo-distinction**.
  *   *Dissolution:* In many decomposition schemes, "competence" at a subtask *requires* alignment-like behavior (e.g., a subagent must honestly report uncertainty to the overseer to be competent at the subtask of "summarize evidence"). If distillation optimizes for subtask competence, it may *incidentally* preserve alignment features. Conversely, if "competence" is defined purely as task completion, safety features may be treated as overhead and distilled away.
  *   *Action:* We will not treat competence and alignment as independent variables. Our experiments will measure "safety-relevant competence" (e.g., refusal rates, uncertainty calibration) as a subset of the competence metric. If they are entangled, Question 3 (Visibility Asymmetry) collapses into Question 2 (Local Compliance).

  **Empirical Dead-Ends:**
  *   *Limit versus Implementation:* The question asks about the "theoretically defined limit object." For a unit with no frontier compute, this is a **conceptual trap**. We cannot observe the limit. We will reframe this as "Truncation Error": How much performance/safety is lost at depth $N=3$ vs $N=5$? This is measurable; the infinite limit is not.
  *   *Meta-decomposition:* This assumes the system can improve its own decomposition strategy. With small models, this is likely to look like noise rather than improvement. We will decline this as out-of-scope for the 2-year horizon, treating decomposition strategies as fixed exogenous variables provided by human researchers.

  **Pseudo-Problems:**
  *   *Interface Relativity:* While the channel matters, worrying about "bandwidth limits" before establishing that information *should* flow through that channel is premature. We will treat the interface as idealized bandwidth unless empirical probes show communication bottlenecks are the primary failure mode.

  ## 5. Effort Allocation and Evidence Triggers

  **Effort Division:**
  *   **60% "Does the Procedure Work?" (Competence/Feasibility):** Focused on Questions 1 and 2. If the method cannot produce competent, coherent outputs via decomposition, safety is irrelevant. This involves crowdworker studies on task decomposition and small-model distillation experiments in toy environments.
  *   **40% "Would It Be Safe If It Did?" (Alignment/Safety):** Focused on Questions 3 and 4. This involves probing distillation for "safety washout" (e.g., does a model distilled from a hesitant teacher become overconfident?) and modeling error accumulation.

  **Evidence Triggers for Reprioritization:**
  We will review the prospectus at Month 12. The following evidence would shift our priorities:

  1.  **Upward Shift for Visibility Asymmetry:** If external labs (e.g., large scale RLHF teams) demonstrate that distillation consistently degrades calibration or honesty in small models, we will move Question 3 to Priority 1. This would indicate the safety risk is immediate and severe.
  2.  **Downward Shift for Verification-Decomposability:** If we successfully decompose a complex reasoning task (e.g., code security audit) with verified subtasks in the first 6 months, we will reduce effort on Question 1 and move resources to Question 2 (Composition).
  3.  **Abandonment Trigger:** If crowdworker experiments show that verification cost scales linearly or super-linearly with task complexity (i.e., subtasks are not easier to check), we will halt work on Questions 2–4 and publish a negative result on the feasibility of decomposition for that task class.
  4.  **Expansion Trigger:** If small-model distillation shows *positive* transfer of safety traits (e.g., distilled models are *more* honest than teachers), we will expand the "Safety" budget to investigate *why*, potentially making distillation a safety intervention rather than just a capability tool.

  **Conclusion:**
  This unit operates on the hypothesis that decomposition is the only viable path to scalable oversight. Our mandate is not to prove this hypothesis true, but to stress-test it until it breaks or bends. By prioritizing feasibility (Decomposability) and mechanism integrity (Compliance) before safety specifics (Visibility), we ensure that we do not solve safety problems for a system that cannot function. However, by challenging the separability of competence and alignment, we remain open to the possibility that the mechanism itself is the safety intervention—or the hazard.
