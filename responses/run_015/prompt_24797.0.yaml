prompt: |-
  I'm writing the final for my philosophy of mind seminar (mixed upper-level undergrads and first-year grads) and I need one essay question on the distribution of consciousness across animals. The problem I keep hitting is that students answer "do animals have consciousness" by just reciting that the hard problem and the explanatory gap apply to them the same way they do to us, and that tests nothing. I want the question to push them onto a specific crux instead: the argument from evolutionary continuity for animal consciousness. I want them to have to decide whether that argument is meant to be a metaphysical argument (the continuity of the underlying neural machinery *entails* the continuity of the phenomenal) or an epistemic one (it's only a reason to *believe* animals are conscious, so really an inference to the best explanation), and then to see what goes wrong on each reading. If it's metaphysical, it needs a physical-to-phenomenal bridge premise we don't actually have, so it's either empty or question-begging. If it's epistemic, it's just IBE and inherits all the underdetermination and "physical duplicate with no consciousness" worries, so it's way weaker than its proponents think. I'd also like them to test the argument on a case where it's at its weakest, like an octopus or a bee, rather than just a dog or a chimp where the analogy to us is easy.

  Could you write the question itself, a model answer of roughly 750 words, and a marking scheme out of 20 that separates an A from a B by naming the specific moves each has to contain? I'd like the marking scheme built around a set of must-hit points with the marks each is worth, plus a one-line note on how candidates typically botch each one. The exam is 2 hours total and this question should be scoped to about 45 minutes of work. One last thing: please don't ask for or include any citations or reading list, the students are working from memory and I dont want them padding their answers with names they half remember.
