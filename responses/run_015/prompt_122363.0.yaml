      *   *Refinement:* Ensure the distinction between *prediction* and *control* is sharp. This is the crux of the policy implication.
      *   *Refinement:* In the agency section, bring in the concept of "reflexivity" (models changing the system) which Kepler didn't have to deal with, making the analogical stance even more critical today.

  9.  **Final Review against Constraints:**
      *   No citations.
      *   No bibliography.
      *   Focus on conceptual implications.
      *   Address all three specific sub-prompts (mechanism demand, agency/ethics, rigor vs. overreach).

