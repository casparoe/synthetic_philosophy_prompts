answer: |-
  ### The anatomy of the stall

  The stalemate arises because Lewis and Kripke prioritize divergent theoretical virtues regarding modality. Lewis prioritizes a Humean mosaic where objects are world-bound; modal talk is quantificational over counterparts selected by contextually salient similarity relations. Kripke prioritizes the intuition that *this* object could have been otherwise, preserving transworld identity via rigid designation grounded in origin or constitution. Objections fail to advance the dispute because they target the opponent's core commitment as a bug rather than a feature. When Kripkeans argue counterpart theory renders origins too contingent, Lewisians reply that contingency is precisely what explains modal flexibility without mysterious transworld links. When Lewisians argue transworld identity forces implausible essentialism about material constitution, Kripkeans reply that essentialism is necessary to secure reference across worlds. Consequently, the debate cycles without resolution because each side treats the other's counterexample as a reductio of the opposing framework's initial assumptions rather than a shared problem. The dialectic is closed: each theory is internally fully coherent but mutually exclusive regarding the nature of modality itself. This creates a ritualistic exchange where arguments are rehearsed not to convince, but to demarcate tribal boundaries within metaphysics. The lack of progress stems from neither side conceding the primary explanatory role of their respective intuitions—similarity versus continuity. Neither can refute the other because the dispute is not about evidence, but about which intuition governs the semantics of modal operators. The "origins" objection, for instance, assumes essentialism is false, which Lewis denies, while the "constitution" objection assumes identity is strict, which Kripke denies. Thus, the arguments bounce off like particles hitting a force field, preserving the true equilibrium of the impasse.

  ### Domain mismatch or bedrock intuition?

  Your hypothesis that the impasse reflects a hidden domain-specific disagreement is deeply compelling. Standard modal metaphysics generalizes from mid-sized dry goods or organisms, where origin essentialism feels plausible. Institutions, however, are defined by normative functions rather than material constitution or biological genesis. Their persistence conditions are governed by collective intentionality and legal conventions, not metaphysical necessity. When you apply Lewisian counterpart theory here, the explosion of counterparts arises because similarity metrics for institutions are notoriously context-dependent—a corporation is similar to its successor if the law says so, not because of material overlap. When you apply Kripkean identity, the implausible essentialism arises because legal practice in practice explicitly allows for radical transformation that metaphysics strictly forbids. This suggests the stall is not merely verbal but stems from a domain mismatch. The debate assumes a unified ontology of objects, but social entities operate under different persistence rules than natural kinds. If modal metaphysics claims universality, institutions constitute a counterexample to both frameworks. If it claims specificity, then the Lewis-Kripke debate is limited to natural ontology, rendering your application problem a category error. However, it is not merely peripheral. Social ontology challenges the bedrock intuition that persistence conditions are discovery-based rather than stipulation-based. This crucially undermines the Kripkean claim that origins are metaphysically fixed, suggesting they are legally contingent. If institutions persist via convention, then transworld identity is itself a normative construct, not a metaphysical fact. This exposes a structural disagreement: is modal metaphysics descriptive of mind-independent structures (favoring Kripkean essentialism) or expressive of conceptual schemes (favoring Lewisian contextualism)? Your work suggests the latter fits social ontology better, implying the general debate stalls because it refuses to acknowledge that different ontological categories require different modal logics. The anomaly you face reveals that the "general" debate is actually parasitic on a specific, unexamined domain of natural objects. By introducing institutions, you force the metaphysician to choose between revising their current theory to accommodate normative persistence or admitting their theory is not universal. Thus, the stall is really about whether modal metaphysics can handle constitutive rules.

  ### What kind of disagreement is this?

  This is a multi-question disagreement masked as a single metaphysical dispute. Lewis and Kripke appear to be arguing about the nature of identity, but they are actually answering different questions regarding the scope of modal theory. Lewis addresses the semantics of modal discourse, asking how we evaluate truth conditions for counterfactuals across possible worlds. Kripke addresses the metaphysics of natural kinds, asking what makes an object the same thing across variations. Your work with institutions reveals that these questions diverge sharply when the object lacks a natural essence. For natural kinds, semantics and metaphysics align sufficiently to sustain the illusion of a single debate. For social entities, they decouple: the semantic utility of counterparts (Lewis) clashes with the metaphysical desire for rigid designation (Kripke), because the "essence" of an institution is normative, not natural. Therefore, the disagreement is not merely verbal nor purely substantive, as they talk past each other. It is a category error regarding the domain of application. The stall exists because both parties assume their answer to the semantic question dictates the answer to the metaphysical question, or vice versa. By treating institutions as data, you show that the semantic framework (counterparts) may be necessary for legal reasoning, while the metaphysical framework (identity) fails to capture institutional persistence. Thus, the impasse is structurally ill-posed for a unified ontology. It requires acknowledging that "identity" performs different explanatory roles depending on the entity. The debate stalls because it seeks a universal theory of identity where none exists, conflating semantic convenience with metaphysical necessity. The verdict is multi-question: one side optimizes for semantic flexibility, the other for metaphysical rigidity. Both are wrong to claim universality. Your case proves "transworld identity" covers distinct phenomena.

  ### What progress would require

  Progress requires a conceptual distinction between natural and social kinds within modal metaphysics. The field must abandon the assumption that a single account of transworld identity applies to organisms, artifacts, and institutions equally. Specifically, metaphysicians need a hybrid framework where persistence conditions are sensitive to ontological category. For natural kinds, Kripkean essentialism may hold; for social kinds, a modified counterpart theory respecting normative conventions is required. This demands a change in the questions being asked: instead of "What is transworld identity?", researchers should ask "What persistence conditions apply to this ontological category?" Additionally, formal results regarding normative necessity could bridge the gap, showing how legal conventions function similarly to metaphysical essences within specific domains. However, genuine progress also requires admitting that no further progress is possible within the current monistic framework. The debate will remain stalled until scholars accept that modal metaphysics is not unified. Your work suggests that social ontology should not merely apply existing metaphysical tools but constrain them. Resolution demands recognizing that institutional persistence is constitutive, not descriptive. Until the field accepts that different entities require different modal logics, the ritualistic exchange will continue. Therefore, the primary requirement is a paradigm shift from seeking universal identity conditions to mapping domain-specific persistence rules. Only then can the anomaly you identified be resolved truly.
