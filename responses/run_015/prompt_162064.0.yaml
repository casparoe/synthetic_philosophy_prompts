answer: |-
  # WIP Prep Sheet: Virtual Artifacts and Practical Usurpation

  ## Strategic Overview

  **The Verdict:** The **Welfarist "Pill" Objection (Objection 1)** is the genuinely dangerous one. If you cannot articulate a harm that survives the elimination of subjective distress, "practical usurpation" is merely a descriptive label with no normative bite. The metaphysics can be fuzzy; the normative claim cannot.

  **The Single Reply That Must Land:** The distinction between *welfare* and *agency*. You must convince the room that damaging a project is a harm to the *agent's capacity to act*, independent of how that damage feels.

  **The Point to Defend Actively:** The metaphysical constitution claim (Code + Practice). Do not let the Chair bully you into a purely social or purely digital account. This is the engine of the paper. If the object isn't real, the usurpation isn't real.

  **The Question You Hope Nobody Asks:** "If server shutdown causes the same loss as griefing but lacks usurpation, on your account, is shutdown morally less significant? If yes, that contradicts player intuition. If no, why do we need the usurpation account at all?" (This exposes a potential gap in your normative theory).

  **Opening Slides: Concessions & Refusals**
  *   **Concede:** (1) Terms of Service (ToS) govern the *platform*, but not necessarily the *practice*. (2) Virtual objects are ontologically dependent on servers; you are not claiming they are magic.
  *   **Refuse:** (1) To accept that "welfare" exhausts the category of "harm." (2) To accept that "copyability" entails "replaceability."

  ---

  ## The Objections (Ordered by Damage Potential)

  ### 1. The Welfarist "Pill" Objection
  **Constituency:** Ethicists (Welfarists)
  **The Question:** "You claim harm exists even if the player feels no distress. Suppose we delete the cathedral and immediately give the player a pill that erases the distress but leaves the memory of the loss intact. They feel fine. On your view, are they still harmed? If so, harmed *where*? If welfare is the currency of morality, you've described a metaphysical glitch, not a moral wrong."
  **The Reply (90s):** "They are harmed, but not in their welfare. They are harmed in their *agency*. Think of a painter whose canvas is slashed while they sleep. If we pill them to feel fine about it, the painting is still ruined. The harm is to the *object of their will*, not the *state of their mind*. Usurpation severs the link between intention and outcome. The 'currency' of harm isn't just pleasure/pain; it's the successful execution of practical authority. The pill fixes the feeling, not the failure."
  **Soft Spot:** You are trading on an ambiguity in "harm." Welfarists will press that if it doesn't affect well-being, it's not a *moral* harm. You are asserting a non-welfarist normative framework without fully defending it here. *Guess: They will accept this if you frame it as 'autonomy' rather than 'metaphysical damage'.*

  ### 2. The Contractual Reduction
  **Constituency:** Property Theorist
  **The Question:** "You're multiplying entities. The ToS says the operator owns the code and grants a revocable license. When a griefer destroys an item, they are triggering a contract violation by the platform or exploiting a loophole. What work does 'usurpation' do that 'tortious interference with contract' doesn't do better?"
  **The Reply (90s):** "Contract law tracks the platform's obligations, not the player's project. If I burn your physical house, I haven't violated your contract with the bank; I've violated your authority over your home. Similarly, usurpation tracks the *player-to-player* normative relation, not the *player-to-platform* legal relation. The ToS might say the platform can delete the item, but it doesn't give *me* the right to delete it for you. Usurpation explains why the griefer wrongs *you*, not just why they broke the rules."
  **Soft Spot:** You are assuming players have "authority" that exists independently of the ToS. The Property Theorist will say the ToS *defines* the authority. You are begging the question slightly by positing a pre-legal authority.

  ### 3. The Hybrid Constitution
  **Constituency:** Chair (Metaphysician)
  **The Question:** "You say the artifact is partly code and partly practice. That sounds like a category mistake. Code is digital; practice is social. How do you state the identity conditions without circularity? If the practice stops, is the code still the artifact? If the server dies, does the practice vanish?"
  **The Reply (90s):** "It's a functional kind, like a 'wedding' or a 'trial.' A wedding isn't just the words spoken (code) or the social recognition (practice); it's the intersection. If the server dies, the code vanishes, and the artifact ceases to exist, much like a burned manuscript. The identity conditions are causal: this object is the one *built by X under rules Y*. That's not circular; it's historical. We individuate physical artifacts by provenance all the time. Virtual ones are no different, just more fragile."
  **Soft Spot:** "Fragile" does the heavy lifting here. You are hoping the Chair accepts that digital fragility doesn't preclude artifact status. If they insist on material constitution, you are in trouble.

  ### 4. The Permitted Heist (EVE Case)
  **Constituency:** Graduate Student (EVE Player)
  **The Question:** "In EVE Online, big bank heists are allowed by the rules. Players spend years building trust to betray it. On your view, is this usurpation? If yes, you're condemning legal gameplay. If no, how is it different from griefing? The victim's project fails either way."
  **The Reply (90s):** "It's not usurpation; it's *risk*. When you enter EVE, you consent to a practice where authority is conditional on survival. Usurpation requires taking over authority *illegitimately within the practice*. In a standard MMO, destruction is illegitimate. In EVE, it's a mechanic. The harm in EVE is tragic, not usurpatory. The player's practical authority included the risk of theft. Griefing violates the baseline authority; EVE heists exercise the system's authority."
  **Soft Spot:** This is a distinction without a difference for the victim. You are defining "legitimacy" by the game rules, which risks collapsing back into the Property Theorist's view (ToS is all that matters). *Guess: The student will press whether 'consent to risk' really negates the feeling of usurpation.*

  ### 5. The Shutdown Distinction
  **Constituency:** Chair / Property Theorist
  **The Question:** "You say shutdown isn't usurpation because no agent takes over. But the loss is identical. Why does the *source* of the destruction matter for the *nature* of the harm? If I care about my cathedral, why should I care if it was deleted by a troll or a bankruptcy?"
  **The Reply (90s):** "Because the *wrong* is different, even if the *loss* is the same. If a storm destroys your house, you suffer loss. If I destroy it, I violate your rights. Shutdown is a tragedy; griefing is a injustice. My account explains why players feel *outrage* at griefers but *grief* at shutdowns. We need different normative tools for accidents than for agents. Usurpation is specifically about agent-to-agent authority."
  **Soft Spot:** You are leaning on player phenomenology as evidence for metaphysical distinction. If players feel equally outraged at shutdowns (due to perceived betrayal by the company), your evidence fails.

  ### 6. The Empirical Claim
  **Constituency:** HCI / Game Studies
  **The Question:** "You lean on the distinction between 'grief' (shutdown) and 'outrage' (griefing). Do you have data for this? In my work, players describe shutdowns as 'corporate murder.' They attribute agency to the company. Are you importing a philosophical distinction that doesn't match player experience?"
  **The Reply (90s):** "I'm making a phenomenological claim, not a statistical one. Even if players call shutdown 'murder,' the target of the blame differs. In griefing, the blame is on a peer who hijacked the project. In shutdown, the blame is on a provider who withdrew the ground. The *structure* of the complaint differs: 'He stole my work' vs. 'They took away my tools.' I'm arguing this structural difference maps onto usurpation vs. deprivation."
  **Soft Spot:** *Guess.* You don't have hard data. If they press for citations or cross-cultural studies, you must admit this is a hypothesis for future work, not a settled premise.

  ### 7. The Copy Problem
  **Constituency:** Metaphysician / General
  **The Question:** "If I copy the cathedral bit-for-bit on a new server, why isn't that restoration? You say provenance matters. But if the practice continues identically, what work is the 'history' doing? Is this just fetishizing the original bits?"
  **The Reply (90s):** "It's not the bits; it's the continuity of the project. If I rewrite your novel word-for-word after burning it, it's a new manuscript. The value lies in the *history of labor* embedded in the object. A copy lacks the causal history of the player's choices. Restoration requires recovering the *same* history, not a *similar* one. Otherwise, any duplicate undermines the value of the original effort."
  **Soft Spot:** This relies on a specific theory of value (labor-embedded) that not everyone shares. Functionalists will disagree.

  ### 8. The Terminology Check
  **Constituency:** General
  **The Question:** "Why call it an 'artifact'? Why not just call it a 'project'? 'Artifact' implies a standalone object. 'Project' implies an activity. You seem to want the stability of the former and the flexibility of the latter."
  **The Reply (90s):** "Because the object *stabilizes* the project. The cathedral is the node where the labor crystallizes. Without the artifact, the project has no anchor. Calling it an artifact grants it the ontological weight needed to be the subject of a wrong. A 'project' is abstract; an 'artifact' is something that can be broken."
  **Soft Spot:** This is largely terminological. If they insist it's a category error, you have to concede it's a 'digital-social hybrid' and move on.

  ---

  ## Final Advice

  **The Danger Zone:**
  The Welfarist objection is the killer. If you stumble there, the room will decide you are writing metaphysics poetry with no ethical consequences. Prepare to pivot to **Autonomy** if "Agency" doesn't land.

  **The Metaphysical Trap:**
  The Chair will try to pin you down on "constitution." Do not get dragged into a technical debate about mereology. Keep returning to **function**: "It functions as an artifact, it is treated as an artifact, therefore we should theorize it as one."

  **The EVE Trap:**
  Do not let the Grad Student convince you that "rules allow it" means "no harm done." Acknowledge the harm, but categorize it differently (Risk vs. Wrong).

  **Marked Guesses:**
  *   I am guessing the Welfarists will accept an "Agency" account if framed confidently.
  *   I am guessing the HCI researchers will accept phenomenological claims without quantitative data for a WIP session.
  *   I am guessing the Chair cares more about the *coherence* of the artifact definition than the *material* basis.

  **Commitment:**
  Stick to the ordering above. It front-loads the existential threats (Ethics/Property) before moving to technical metaphysics. If you survive the first 15 minutes of Q&A, you win the room.
