answer: |-
  Your difficulty arises because your verdicts are pulled by two distinct moral intuitions that often conflict: one based on **relationships and trust**, and the other based on **labor and market fairness**. Your ambivalence in Case 7 (AI) is the clearest symptom of this conflict; you are unsure whether to prioritize the public status of the images (Relationship/Public Sphere) or the appropriation of the stylistic labor (Economic/Fairness).

  Here are two candidate principles that systematize your verdicts. Each captures a different cluster of your cases, and each forces you to abandon at least one of your current intuitions.

  ### Candidate 1: The Principle of Consented Access
  **Statement:** *Taking an idea is wrongful if and only if the taker acquired the information through a channel that violated a reasonable expectation of confidentiality or fidelity owed to the originator.*

  This principle locates the wrong not in the *idea* itself, but in the **breach of the relationship** through which the idea was transmitted. It treats ideas as property only relative to specific social or contractual bonds.

  **Motivation by Clause:**
  *   **"Violated a reasonable expectation":** This explains **Case 2** (the pitch implies a confidential relationship) and **Case 4** (employment implies fidelity). It explains **Case 1** (no contact means no expectation).
  *   **"Channel... owed to the originator":** This explains **Case 3**. When a product is sold, the channel is the open market. The sale implies a license to analyze the embodiment (reverse engineering). The rival did not breach a duty; they entered a channel the originator voluntarily opened.
  *   **"Confidentiality or Fidelity":** This explains **Case 6**. Even if the discovery was inevitable, the *channel* (the defector) was poisoned by a breach of fidelity.

  **Application to New Cases:**
  *   **The Hoarder (Originator never uses the idea):** A researcher seals a design for a perpetual motion machine she knows is impossible, just to claim priority, but never intends to build it. A rival steals her private notes and builds a working version using a different physics model.
      *   *Verdict:* **Theft.** Under Consented Access, the originator's intent to use is irrelevant. The wrong is the breach of the private channel (the stolen notes). The taker violated the expectation of confidentiality.
  *   **The Racer (Taker knows of the seal):** A rival sees the Ledger seal, knows the originator is working on the problem, and independently races to solve it, succeeding the next day.
      *   *Verdict:* **Not Theft.** Seeing a public seal does not create a duty of fidelity. The channel (the public Ledger) is open. Independent labor, even if motivated by knowledge of competition, respects the boundary of consent.

  **Verdicts You Must Abandon:**
  *   **Case 5 (The Public Joke):** You must abandon the intuition that "something substantial is owed." If the post was public, there was no expectation of confidentiality. The expert entered a public channel. Under this principle, the debt is zero.
  *   **Case 7 (AI Training):** You must resolve your ambivalence toward **No Theft**. The images were publicly posted. There was no specific contract or confidentiality expectation between the illustrator and the AI firm. The "manner" is not a confidential secret.

  ---

  ### Candidate 2: The Principle of Cognitive Equity
  **Statement:** *Taking an idea is wrongful when the taker appropriates the value of the originator's cognitive labor without compensating for the risk of failure the originator absorbed, unless the originator has already captured market value via the direct sale of an embodiment.*

  This principle locates the wrong in **unjust enrichment**. It focuses on the economic fairness of the transaction: did the taker free-ride on the originator's risk and effort?

  **Motivation by Clause:**
  *   **"Appropriates the value... without compensating":** This explains **Case 4** and **Case 6**. The taker gets the benefit of the R&D without paying the cost (salary, risk of failure).
  *   **"Unless... direct sale of an embodiment":** This is the crucial clause that saves **Case 3**. Reverse engineering is permitted because the originator *priced* the R&D into the product. By selling the device, they captured the value of their labor. The rival pays the market price to access the information.
  *   **"Risk of failure":** This explains **Case 1**. The later founder bore their own risk of failure; they did not appropriate the earlier founder's risk. It also explains **Case 5**. The expert bypassed the risk of insight (the "trick") without compensation, creating a moral debt even if not legal theft.

  **Application to New Cases:**
  *   **The Hoarder (Originator never uses the idea):** A researcher seals a design but never builds it. A rival steals the notes and builds it.
      *   *Verdict:* **Not Theft (or Reduced Debt).** Since the originator never intended to capture market value via an embodiment, they did not absorb *market* risk, only *creative* risk. The taker saves the creative cost, but the originator suffered no market loss. The debt is limited to attribution, not damages.
  *   **The Racer (Taker knows of the seal):** A rival sees the seal and races to finish.
      *   *Verdict:* **Not Theft.** The rival bore the full risk of failure. They might have raced for a month and found nothing. They did not appropriate the originator's labor; they merely competed against it.

  **Verdicts You Must Abandon:**
  *   **Case 6 (The Time Save):** You may have to soften your verdict. If the team "would certainly have reached the same design within a fortnight," the *risk of failure* was zero. They only saved *time*. Under strict Cognitive Equity, if the risk was null, the wrong is negligible. You must decide if "time" counts as a "cost" equivalent to R&D risk. If you say yes, the principle holds; if no, you must abandon the "Theft" verdict for Case 6.
  *   **Case 7 (AI Training):** You must resolve your ambivalence toward **Theft/Debt.** The AI firm appropriates the value of the illustrator's stylistic labor (years of training) without compensation, and the illustrator has not sold an "embodiment" of her style (she sells images, not the style itself). This principle demands remuneration for style mimicry.

  ### Summary of the Conflict

  Your intuition in **Case 3 vs. Case 4** is the pivot point.
  *   **Candidate 1** says Case 3 is fine because the *relationship* was different (sale vs. employment).
  *   **Candidate 2** says Case 3 is fine because the *economic risk* was compensated (product price vs. free ride).

  Your intuition in **Case 5** and **Case 7** reveals which principle you actually favor.
  *   If you feel the Public Joke (Case 5) creates a debt, you favor **Cognitive Equity**.
  *   If you feel the AI Case (Case 7) is permissible because the art was public, you favor **Consented Access**.

  **Recommendation:**
  If you wish to preserve the "substantial debt" in Case 5 and the "Theft" verdict in Case 6, **Candidate 2 (Cognitive Equity)** is the stronger fit, provided you accept that it condemns the AI firm in Case 7.

  However, to make Candidate 2 work, you must refine the "Embodiment" clause to explain why Case 3 is fine. You might amend it to: *"...unless the originator has voluntarily placed the information into the public sphere in a form that requires significant labor to decode."* This distinguishes the sold product (hard to decode) from the notebook (easy to decode) and the joke (easy to decode, but public). This amendment would force you to concede that Case 5 creates a debt (public, easy to decode) but Case 3 does not (public, hard to decode).
