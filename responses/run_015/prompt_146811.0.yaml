      *   Claim: $I$ is insufficient to derive $O$ via general learning mechanisms. Therefore, $K$ must contribute specific structure.
      *   Problem: If $K$ is defined *as* "whatever makes $I$ sufficient for $O$," the argument is circular/trivial.
