      *   *Distinction 3: Informational Content.* The innate bit must carry *information* about the target, not just a capacity to learn.
      *   *Distinction 4: Independence.* (Addressing Question 1).

      *   *Drafting Requirement 1: Informational Specificity.* The innate factor must restrict the hypothesis space *prior* to exposure.
      *   *Drafting Requirement 2: Explanatory Independence.* The characterization of the innate factor cannot be purely retrospective.
