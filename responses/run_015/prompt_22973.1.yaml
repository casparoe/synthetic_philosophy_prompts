answer: |-
  The compositional move is a philosophical deferral, not a solution. It claims to explain novel content by breaking it down into older, selected capacities, but this merely relocates the indeterminacy rather than resolving it. If a thought about a quark is constructed from concepts like "particle," "mass," and "invisible," teleosemantics insists each constituent derives its content from a specific history of selection. But this assumes what needs to be proved: that those constituent capacities themselves possess determinate content capable of being recombined. You are effectively explaining the unknown (quark representation) in terms of the equally unexplained (the precise content of the primitives). It is a regress that stops only at a base level where the theory faces the original problem in its starkest form.

  At that foundational level, the tension between history and novelty becomes fatal. For a non-compositional state to have content, Millikan argues it must have a Proper Function fixed by past selection. But selection selects for survival, not truth. A visual detector selected for spotting flies in the Pleistocene has a function fixed by that history. If content is strictly tied to this history, the state represents "fly-detector-activation," not "fly" in a truth-conditional sense. This leaves unexplained how a mechanism selected for behavioral success acquires genuine semantic content rather than just biological utility. Without that leap, the primitives don't have *content* to compose; they only have success conditions.

  Ultimately, this reveals a gap in the genetic analogy itself. In population genetics, selection acts on phenotypes in current environments; history explains the frequency of alleles, not the physical laws they interact with. Similarly, selection explains why a cognitive mechanism exists, not what it *means* when deployed in a novel context. By tying content strictly to historical selection pressures, teleosemantics renders all representation captive to the past. It cannot explain how an organism escapes its evolutionary niche to represent reality as it is, rather than as it was. The compositional move tries to build a bridge to the new using materials anchored in the old, but it never explains how the anchors themselves hold any water beyond their original shore.
