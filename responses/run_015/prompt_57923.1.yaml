  im trying to sort out when its fine to just defer to someone else on a moral question and when its dodgy, going by my gut reactions. taking my flatmates word that i should stop eating factory-farmed chicken cos shes looked into it loads feels totally fine. asking some confident bloke down the pub whether i should grass up my boss for fiddling expenses and just doing whatever he says feels wrong. going along with our GP when she says keeping my dad on life support is only prolonging suffering feels ok even though its massive. but just defering to that same GP on whether its ok to lie a bit on my CV feels realy off, even though the stakes are way lower. is there any decent principle that gets all four, or do i have to give up one? and what would it say about the case i keep flip-flopping on, which is letting an AI trained on ethicists decide how our organised community garden should split its donations?
