answer: |-
  You don't have to give up any of your intuitions. They are actually remarkably consistent. The conflict you feel isn't a bug in your moral compass; it's a feature of how moral responsibility works.

  There is a principle that fits all four of your cases without contradiction. Philosophers often call this the distinction between **Epistemic Dependence** (trusting someone's knowledge) and **Moral Agency** (trusting someone to be *you*).

  Here is the principle:

  **It is permissible to defer when the decision hinges on *specialized facts* you lack, but impermissible when the decision hinges on *personal integrity* or *civic participation*, regardless of the stakes.**

  Let's break down why this saves all four of your intuitions, and then look at your AI garden problem.

  ### 1. The Factory-Farmed Chicken (Flatmate)
  *   **Verdict:** Fine to defer.
  *   **Why:** This is primarily **Epistemic**. The moral premise ("unnecessary suffering is bad") is one you likely already hold. The missing piece is the empirical fact ("does this chicken involve unnecessary suffering?"). Your flatmate has done the research. You aren't outsourcing your *values*; you are outsourcing your *homework*.
  *   **Fits Principle:** Specialized facts > Personal integrity.

  ### 2. The Pub Bloke (Boss's Expenses)
  *   **Verdict:** Dodgy to defer.
  *   **Why:** This fails on two counts. First, **Competence**: A random bloke has no specialized knowledge about employment law or justice. Second, **Agency**: Whistleblowing is an act of personal courage and integrity. If you do it, *you* take the risk; if you don't, *you* live with the complicity. You cannot outsource the burden of your own conscience to a stranger.
  *   **Fits Principle:** Lacks specialized facts + High demand on personal integrity.

  ### 3. The Life Support (GP)
  *   **Verdict:** Fine to defer.
  *   **Why:** This is the trickiest one because the stakes are massive. However, notice *why* you feel okay deferring. It's because the GP isn't making a pure value judgment like "death is better." She is making a **medical prognosis** ("this treatment is physiologically futile and causing pain"). The moral conclusion ("we should stop") follows directly from the medical fact. You are deferring to her expertise on *suffering and biology*, not on the value of your father's life.
  *   **Fits Principle:** Specialized facts (medical) drive the moral outcome.

  ### 4. The CV Lie (GP)
  *   **Verdict:** Dodgy to defer.
  *   **Why:** This fails the **Domain** test. A GP has expertise in health, not employment ethics. But more importantly, honesty on a CV is a direct reflection of **Personal Integrity**. It is a constitutive part of *who you are*. Even if the GP said "it's fine," you would still be the one lying. Deferring here is an attempt to abdicate responsibility for your own character.
  *   **Fits Principle:** Outside expertise + High demand on personal integrity.

  ***

  ### The Test Case: The AI Ethicist & The Community Garden

  Now, let's apply this principle to your flip-flopping case: *Letting an AI trained on ethicists decide how to split community garden donations.*

  Your gut is flip-flopping because this case pulls the two sides of the principle in opposite directions.

  **The Argument for "Fine" (Epistemic Dependence):**
  Ethics can feel like a calculation. If the goal is "maximize fairness," an AI trained on ethical theories might process variables (need, contribution, seniority) more consistently than a biased human committee. It looks like the Chicken case: outsourcing the calculation to a "smarter" processor.

  **The Argument for "Dodgy" (Moral Agency):**
  A community garden isn't just a distribution machine; it's a **community**. The process of deciding how to split donations is a civic act. It builds trust, negotiation skills, and shared ownership.
  1.  **Accountability:** If the AI makes a decision that ruins a member's crop, who do you blame? You can't hold an algorithm accountable.
  2.  **Context:** Ethical theories are abstract. A human committee knows that "Member A" had a bad year due to illness, which a raw data split might miss.
  3.  **Agency:** By deferring to the AI, the community members are opting out of the moral work of being neighbors.

  **The Verdict:**
  According to the principle, this is **dodgy**.

  While the AI has "expertise" in ethical theory, the problem isn't a lack of knowledge; it's a lack of **moral ownership**. In the Chicken case, you eating less chicken doesn't change your relationship with your flatmate. In the Garden case, *how* you decide the donations *is* the relationship.

  If you use the AI, you are treating ethics as a **product** (the correct answer) rather than a **practice** (negotiating fairness together). Your flip-flop comes from recognizing that while the AI might get the *math* of fairness right, it bypasses the *humanity* of fairness.

  ### Summary
  You can keep all your gut reactions. The rule of thumb is:

  **Defer on the *facts* that inform the morality (medical prognosis, supply chain data). Never defer on the *act* that defines your character or your community (honesty, justice, participation).**

  *   **Chicken:** Facts about suffering. (Defer OK).
  *   **Life Support:** Facts about biology/pain. (Defer OK).
  *   **Boss/CV:** Facts are known; the issue is courage/honesty. (Defer Not OK).
  *   **Garden:** The issue is community cohesion, not just math. (Defer Not OK).
