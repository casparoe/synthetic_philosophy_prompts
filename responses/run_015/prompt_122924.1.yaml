      *Let's refine the "Hand-off" distinction.* Facts = Procedure. Values = Hand-off.
      Values = "Does this level of disability merit support?" (Actually, that's usually regulated). Values = "Is this cultural usage valid enough to override medical guidance?"
      Let's define the Hand-off as: When the procedure identifies a valid reference but the regulations have no box for it.

