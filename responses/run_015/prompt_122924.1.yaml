      *Decision:* In Case 1, the procedure determines the claimant is referring to Arthritis (via deference), but the physical evidence rules it out. The procedure dictates we cannot score for Arthritis. We must score for 'Pain' only. If 'Pain' doesn't attract the same benefit level, the claimant loses out. The user won't like that a genuine misunderstanding penalises the claimant, but the procedure admits it can't fix the regulatory mismatch.

