      *   **User:** Team lead of health assessors for a public disability benefit body.
      *   **Context:** High volume (40 cases/week), short assessments (30 mins), high stakes (years of payments, appeals), multidisciplinary team (nurses, PTs, OTs, no philosophy training).
      *   **Problem:** Current rule is crude (if claimant's account $\neq$ diagnostic category $\rightarrow$ unsubstantiated). The user believes this is wrong because reference (what a word picks out) isn't just in the head; it depends on the thing, history, and community usage. Claimants can refer to real conditions while misunderstanding them, or refer to something different than what assessors think.
      *   **Task:** Create a practical decision procedure (algorithm/checklist) grounded in this philosophical insight (externalism about meaning/reference) but *without* using theory/jargon.
      *   **Requirements:**
          1.  Ordered questions with criteria for sufficient answers.
          2.  Stop points (No vs. Hand-off for values).
          3.  Honest note on what distinctions survive a 30-min assessment vs. what gets dropped (and the cost).
          4.  Limitations statement (what it can't do, what never to use it for).
          5.  Application to three specific composite cases (Thigh arthritis, Non-English epilepsy term, Contested/No medical standing).
          6.  Include at least one outcome the user won't like.
          7.  Style: British English, plain language, no citations/jargon.

  2.  **Deconstruct the Philosophical Core (for internal use):**

      *   The user is describing *Semantic Externalism* (Putnam/Burge). Meaning isn't just psychological state; it depends on the external world and social division of linguistic labour.
      *   *Key Insight:* A layperson can successfully refer to "arthritis" even if they think it occurs in muscles, provided they defer to the medical community's definition. Conversely, a cultural term might map to multiple medical conditions (extension mismatch).
      *   *Goal:* Translate "Division of Linguistic Labour" and "Deference" into practical assessment questions.

  3.  **Drafting the Procedure (Section 1 & 2):**

      *   *Constraint:* 30 minutes. Needs to be fast.
      *   *Constraint:* No philosophy. Use terms like "Expert Check," "Community Check," "Symptom Match."
      *   *Flow:*
          1.  Identify the term used.
          2.  Check deference (Do they accept medical authority on this word?).
          3.  Check community usage (Is this a shared cultural term?).
          4.  Check functional impact (The core of disability assessment anyway).
      *   *Stop Points:* If they refuse medical definition *and* it doesn't match medical reality $\rightarrow$ No. If it's a values judgment (eligibility thresholds) $\rightarrow$ Hand-off.

  4.  **Drafting the Honest Note (Section 3):**

      *   *Survive:* Functional impact, Deference attitude, Consistency of symptoms.
      *   *Drop:* Deep etymology, precise medical nosology (if functional impact is clear), distinguishing subtle cultural nuances without an interpreter.
      *   *Loss:* We might miss rare conditions or validate colloquialisms that mask non-qualifying issues.

  5.  **Drafting the Limitations (Section 4):**

      *   *Can't do:* Diagnose.
      *   *Never use for:* Dismissing pain because the label is "wrong."

  6.  **Developing the Composites (Section 5):**

      *   *Case 1 (Thigh Arthritis):* Medical impossibility (arthritis = joints). Claimant says muscle.
          *   *Procedure:* Do they defer? If yes, they are mistaken about the label but the pain is real. If no, they are using "arthritis" to mean "muscle pain."
          *   *Outcome:* If they defer, score based on pain/function, note label error. If they insist it's muscle arthritis and reject medical definition, label is unsubstantiated, but *pain* might still count.
          *   *User won't like:* Maybe the procedure forces a "No" on the specific condition code even if pain is real, causing administrative friction. Or, conversely, it validates a medically impossible term, which looks sloppy. Let's aim for the latter: validating the *claim* despite the *label* error, which might feel like bending rules. Actually, the prompt asks for *one case where the answer is one I will not like*.
          *   *Idea:* The procedure might force a hand-off or a "substantiated" rating on a medically impossible term because the *deference* is there, which undermines the regulatory diagnostic list. Or, it might force a rejection because the deference isn't clear, despite obvious suffering. Let's go with: The procedure identifies the label is wrong, but because the claimant defers to doctors, we must treat it as the medical condition *minus* the impossible symptoms. If the impossible symptoms are the only basis for the score, the claim fails. That's a "don't like" outcome (suffering is real, claim fails).
      *   *Case 2 (Cultural Epilepsy):* Word covers epilepsy + faints. Symptoms match epilepsy.
          *   *Procedure:* Community check. The word refers to a set including her symptoms.
          *   *Outcome:* Substantiated. The reference succeeds even if the extension is broader.
      *   *Case 3 (Contested/No Standing):* Doctors disagree.
          *   *Procedure:* Deference check. Who is the expert? If experts disagree, the "expert" slot is empty.
          *   *Outcome:* Hand-off to Case Manager/Senior. This highlights the limit of the procedure.

  7.  **Refining the Tone:**

      *   British English (programme, centre, colour, organisation, etc.).
      *   Professional, empathetic, directive but not patronising.
      *   Avoid "Semantic Externalism," "Reference," "Extension," "Intension." Use "Word Meaning," "Medical Definition," "Community Use."

  8.  **Review against Constraints:**

      *   *No bibliography?* Checked.
      *   *No jargon?* Checked.
      *   *30-min feasible?* The questions need to be tight.
      *   *One outcome user won't like?* Need to ensure this is clear in the composite analysis.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* "The Meaning and Impact Check." (Too clunky). "The Label and Function Check." Let's call it "The Claim Verification Steps."
      *   *Step 1:* The Label. What do you call it?
      *   *Step 2:* The Authority. If a doctor said X, would you accept that? (Tests deference).
      *   *Step 3:* The Community. Does anyone else use it this way? (Tests cultural variance).
      *   *Step 4:* The Function. What can't you do? (The actual benefit criteria).
      *   *Stop rules:* If Step 2 is No AND Label is medically wrong $\rightarrow$ Stop (Unsubstantiated label). If Step 3 is unclear $\rightarrow$ Hand off.
      *   *Composites:*
          *   *Thigh Arthritis:* Claimant defers to doctors. Procedure says: Treat as 'pain' but not 'arthritis'. If benefit requires 'arthritis', claim fails. *This is the one the user won't like.* The procedure exposes that the regulatory framework is too rigid for the linguistic reality.
          *   *Cultural Epilepsy:* Claimant defers. Community usage covers it. Symptoms match. Procedure says: Substantiated.
          *   *Contested:* No single expert authority. Procedure says: Hand-off.

  10. **Final Polish:** Check British spelling (programme, centre, organisation, specialised, labelled). Ensure the "user won't like" part is explicit. Ensure the distinction between fact (procedure) and value (hand-off) is clear.

