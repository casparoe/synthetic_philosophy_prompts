answer: |-
  **Guidance Note: Checking Condition Labels and Claims**

  **To:** Health Assessors
  **From:** Team Lead
  **Subject:** New steps for recording condition names and symptoms

  We see many claimants who describe their health using words that do not match the medical lists in our regulations. Sometimes this is a simple mistake. Sometimes it is a difference in language or community. Our current rule is to mark the claim as unsubstantiated if the words do not match the list. This misses important details.

  We are introducing a new four-step check. This is not about changing the regulations. It is about making sure we record what the claimant means before we decide if it meets the rules. Do not spend more than five minutes on this check. It is a tool to help you fill in the record accurately, not to diagnose.

  ### 1. The Decision Procedure

  Run these questions in order. Write the answers in the 'Comments' box of your record.

  **Step 1: The Authority Check**
  *   **Ask:** "If a specialist doctor told you that this condition has a different name, or works in a different way than you think, would you accept their view?"
  *   **Sufficient Answer for 'Yes':** The claimant says they rely on medical advice, or that they know they are not an expert.
  *   **Sufficient Answer for 'No':** The claimant says they know their own body best and reject medical definitions, or that their understanding is final regardless of medical opinion.
  *   **Action:**
      *   If **Yes**: Treat the word they used as an attempt to name the medical condition, even if their description is slightly off. Proceed to Step 2.
      *   If **No**: Treat the word as a personal description of symptoms only. Do not link it to a medical diagnostic code. Proceed to Step 4.

  **Step 2: The Community Check**
  *   **Ask:** "Is this a word your family or community uses for this trouble? Does it mean the same thing to them as it does to you?"
  *   **Sufficient Answer for 'Yes':** The claimant confirms others use the word, even if the medical meaning is broader or narrower.
  *   **Sufficient Answer for 'No':** The claimant says the word is theirs alone, or they are unsure how others use it.
  *   **Action:**
      *   If **Yes**: Note the community usage. The word counts as a valid label for the symptoms described, even if it covers more than the medical definition. Proceed to Step 3.
      *   If **No**: Rely on the medical definition only. Proceed to Step 3.

  **Step 3: The Mismatch Check**
  *   **Look:** Compare the claimant's description of symptoms with the medical definition of the word they used (or the word the interpreter provided).
  *   **Question:** Is the difference something the claimant could know just by how it feels (e.g., pain location), or is it something only a test can show (e.g., inflammation in a joint vs. muscle)?
  *   **Action:**
      *   If the difference is **only visible on tests** (and Step 1 was 'Yes'): Record the medical condition name. Note the discrepancy as 'reported symptoms vary from typical presentation'.
      *   If the difference is **physical and obvious** (e.g., pain in a place the condition cannot exist): Record the symptom (e.g., 'pain'), not the condition name.
      *   If **Unclear**: Mark for Case Manager review.

  **Step 4: The Impact Check**
  *   **Ask:** "Regardless of the name, what can you not do because of this?"
  *   **Action:** Score the functional limitation based on this answer. This is the most important part of the assessment.

  ### 2. Stop Points and Hand-Offs

  **Where the procedure stops with a 'No':**
  If the claimant fails the **Authority Check** (Step 1) and their description contradicts medical fact (e.g., they insist on a diagnosis that cannot exist), you stop using the diagnostic label. You record only the symptoms. If the regulations require a specific diagnosis for higher scoring, the claim for that element is not substantiated. This is a factual decision based on the evidence available.

  **Where the procedure must stop and hand to a person:**
  You must hand the decision to a Case Manager or Senior Assessor in two situations:
  1.  **Conflicting Expertise:** If the claimant brings letters from two doctors who disagree on the name or existence of the condition, the "Authority" is unclear. This is not a fact you can resolve in thirty minutes.
  2.  **Valid Label, No Regulatory Box:** If the Authority and Community checks are passed (the word is valid and deferred to), but the regulations have no code for this specific presentation (e.g., a recognised cultural syndrome that does not map to a single UK diagnostic code), this is a matter of policy interpretation, not clinical fact.

  ### 3. Honest Note: What Survives the Thirty Minutes

  **What stays:**
  We keep the distinction between *deferring to expertise* and *rejecting it*. This is crucial. It tells us if the claimant is describing a medical condition they misunderstand, or describing a personal experience they prioritise over medicine. We also keep the *functional impact*. That is the core of the benefit.

  **What gets dropped:**
  We cannot investigate the deep history of a word. If an interpreter says a word means "epilepsy," we cannot spend twenty minutes asking about the etymology of that word in their home village. We must take the interpreter's gloss as the best available evidence. We also drop the distinction between "wrong belief" and "different concept" if the functional impact is the same.

  **The cost:**
  By dropping the deep linguistic check, we will sometimes record a medical label that is technically imprecise. We accept this. It is better to record "Epilepsy (cultural variant)" than to record "Unsubstantiated." The loss is data purity; the gain is fairness. However, if we drop the Authority Check, we lose the ability to distinguish between a claimant who needs help navigating the system and one who is actively resisting medical evidence. Do not drop Step 1.

  ### 4. Limitations

  **What this procedure cannot do:**
  It cannot make a condition eligible if the regulations do not cover it. It can only ensure we have identified the condition correctly before applying the rules. It cannot fix a system that requires a joint disease to be present in a muscle.

  **What an assessor must never use it for:**
  Never use this procedure to dismiss pain. If the label is wrong but the pain is real, you must score the functional limitation caused by the pain. A wrong name is not a lie, and it is not a reason to deny support for suffering.

  ***

  ### Application to Composite Cases

  Here is how the procedure applies to three cases from your current caseload.

  **Case 1: The 'Thigh Arthritis'**
  *   **Details:** Claimant writes he has arthritis in the thigh muscle. Describes pain and swelling. No joint involvement.
  *   **Running the Procedure:**
      *   *Step 1 (Authority):* He says, "My GP said it's arthritis, so I say it's arthritis." (Answer: **Yes**, he defers).
      *   *Step 2 (Community):* He uses the word as standard English speakers do. (Answer: **No** special community usage).
      *   *Step 3 (Mismatch):* Arthritis cannot exist in muscle tissue; this is anatomically impossible. The difference is physical and obvious.
      *   *Step 4 (Impact):* He cannot walk more than 50 metres due to pain.
  *   **Record:** Condition recorded as 'Soft Tissue Pain / Myalgia'. Note: 'Claimant uses term arthritis based on GP advice, but symptoms indicate muscular involvement.' Score based on mobility limitation.
  *   **Outcome:** The specific diagnostic points for 'Arthritis' are not awarded because the physical evidence rules it out, despite his deference.
  *   **Why you will not like this:** You know the claimant is referring to a real suffering and trying to use the correct medical word, deferring to his doctor. The procedure confirms he is *talking about* arthritis in his mind, but forces you to record it as muscle pain. He loses the specific points attached to the inflammatory condition he believes he has. The procedure exposes that the regulations punish him for a medical misunderstanding he did not create. It is the right administrative decision, but it feels unjust.

  **Case 2: The Cultural 'Epilepsy'**
  *   **Details:** Non-English speaker. Interpreter glosses her word as 'epilepsy'. In her community, the word covers both epileptic seizures and severe vasovagal faints. Her symptoms (loss of consciousness, shaking) are indistinguishable from a standard epilepsy claimant.
  *   **Running the Procedure:**
      *   *Step 1 (Authority):* She says she follows the treatment the UK doctor gave her. (Answer: **Yes**).
      *   *Step 2 (Community):* She confirms the word is used by her elders for this kind of falling down. (Answer: **Yes**).
      *   *Step 3 (Mismatch):* Her symptoms fall within the range of the word's meaning in her community, and match the medical symptoms of epilepsy. The fact that the word *also* covers faints does not mean it *doesn't* cover epilepsy.
      *   *Step 4 (Impact):* She cannot cook safely or travel alone.
  *   **Record:** Condition recorded as 'Epilepsy'. Note: 'Term covers broader range in claimant's community, but presentation matches diagnostic criteria.'
  *   **Outcome:** Claim substantiated. The procedure validates that she is referring to the condition we need to assess, even if her word has a wider net. The assessor does not need to prove she doesn't have the 'faint' variant, only that she fits the 'epilepsy' variant which the word includes.

  **Case 3: The Contested Condition**
  *   **Details:** Claimant has a label that her current doctor has withdrawn. A previous doctor used it. A specialist is considering a third option. She is distressed by the uncertainty.
  *   **Running the Procedure:**
      *   *Step 1 (Authority):* She says, "I don't know who to believe. One says yes, one says no." (Answer: **Unclear/Conflict**).
      *   *Step 2 (Community):* Not applicable.
      *   *Step 3 (Mismatch):** Cannot be assessed because there is no settled definition to match against.
  *   **Record:** Condition recorded as 'Undiagnosed Neurological Symptoms'.
  *   **Outcome:** **Hand-off to Case Manager.**
  *   **Reason:** The procedure relies on there being an authority to defer to. When the medical community is in public disagreement about a specific case, the "fact" of the diagnosis is not settled. An assessor cannot resolve this in thirty minutes. This is not a failure of the claimant; it is a gap in the medical evidence. The value judgment on how to weigh conflicting expert letters belongs to a senior decision-maker.
