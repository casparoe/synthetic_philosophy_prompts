      *   **Trade-off:** Funding Maya zeros out two programs: Home-visiting nurse program (rural, pregnant patients, ~9 infant deaths averted over 5 years, evidence mixed) + School-based asthma program (600 kids, morbidity/QoL).
      *   **Constraints:** Restricted grants prevent moving money elsewhere. GoFundMe ($410k) cannot be applied if therapy declined (policy dispute).
      *   **Committee Split:** Identifiable Victim (Maya) vs. Statistical Lives (9 infants). Utilitarian aggregation vs. Separateness of Persons.
      *   **Procedural Devices to Evaluate:** Naming Test, Discharge Condition, Two Ledgers.
      *   **Requirements:** 800-1000 words. Actual bottom line (fund/don't/conditions). Distinguish value vs. factual calls. What info would change recommendation? What to say to family/public? No citations/hedging. Use Rawlsian/Separateness of Persons machinery if appropriate.
      *   **Tone:** Professional, decisive, philosophically rigorous but practically grounded.

  2.  **Brainstorming & Framing (Internal Monologue):**
      *   *Framing 1: Pure Utilitarianism.* Save the most lives/QALYs. 9 infants vs. 1 child. 9 > 1. Fund the programs. *Critique:* Ignores the "separateness of persons." Treats lives as a single blob of utility. Feels wrong to sacrifice the identifiable individual for the statistical many in a discretionary fund context.
      *   *Framing 2: Rights/Deontology.* Maya has a right to life. The infants have a right to prevention. But rights conflict. The "do no harm" vs. "prevent harm" distinction. Killing vs. Letting die. *Critique:* Too abstract. Doesn't help with allocation of limited resources where *some* must die/go without.
      *   *Framing 3: Prioritarianism/Rescue Principle.* We have a stronger duty to those in immediate peril whom we can identify. The "Rule of Rescue." *Critique:* Often criticized as irrational bias. Needs justification beyond emotion.
      *   *Framing 4: Rawlsian/Separateness of Persons.* This seems the strongest given the prompt's hint. Utilitarianism aggregates across persons. Rawls argues persons are distinct. You can't sacrifice one person's life plan completely to marginally benefit others. The "Two Ledgers" device aligns with this. Death/catastrophic loss is in a different category than morbidity/prevention.
      *   *The Crux:* Is this a trade-off between lives (1 vs 9) or between a *certain* death for a specific person vs. *probabilistic* prevention for others? The home visiting evidence is mixed (2-19 range, mean 9). The asthma program is morbidity.
