          *   *Key Insight:* The "Two Ledgers" approach suggests we cannot trade Maya's life for the statistical reduction of risk to others *unless* the statistical benefit is overwhelming and certain. Here, the infant death reduction is 2-19 (uncertain). The asthma is morbidity. Maya's death is certain without treatment.
          *   *Decision:* Fund Maya, but with conditions to mitigate the harm to the programs (Discharge Condition).
