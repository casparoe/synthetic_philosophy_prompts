          *   *Let's lean into the Rawlsian view:* Aggregation is only permissible within a life, not across lives. We cannot sacrifice Maya for the others. However, we must acknowledge the loss.
          *   *Actually, the most honest philosophical position for a committee:* The "Two Ledgers" device is the right tool. Catastrophic loss vs. Risk Reduction. We should fund Maya because the claim of the identifiable person facing catastrophic loss trumps the aggregate claim of statistical risk reduction, *especially* given the evidentiary uncertainty on the home visiting program.
          *   *But I need to be careful:* If I say "Fund Maya," I am accepting the Identifiable Victim Effect. I need to justify it not as bias, but as a principled commitment to non-aggregation of vital interests.
          *   *Procedural Ruling:* Adopt "Two Ledgers." Reject "Naming Test" (it's diagnostic, not decisional). Adopt modified "Discharge Condition" (we must acknowledge the loss publicly and commit to rebuilding the programs).
          *   *Word Count:* 800-1000.
          *   *Tone:* Direct, no hedging.

