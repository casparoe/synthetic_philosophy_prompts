  Dr Ferreira will deny Farah a larger share, ruling that her capabilities are already equal, and will likely treat structural accommodation as a matter of policy rather than a requirement of equalisation.

  Her five existing verdicts cohere around a specific hybrid principle: **Equality of Basic Capability**, constrained by a **Responsibility Condition**. This rule compensates for brute-luck deficits that impede normal functioning (Ada, Cora) but refuses compensation for subjective welfare deficits that leave functioning intact (Ewan) or for preferences adopted after the initial division (Bernard, Dmitri). The pivotal precedent is Ewan: his pain is brute luck, yet he receives nothing because his 'abilities are otherwise entirely ordinary'. This signals that Ferreira does not equalise welfare, nor does she compensate for every brute-luck disadvantage, but only for those that restrict what people are able to *do* or *be* in a standard sense. Farah fits the Ewan mould rather than Ada's: she is as healthy, mobile, and educated as anyone else, so her capability set is not diminished. The cost of her religious observance is treated as a commitment constitutive of her identity, but since it does not block basic functioning, it falls outside the scope of equalisation. Regarding the structural option, Ferreira might endorse it as a matter of liberty or reasonable accommodation, but on her stated metric of *what should be equalised*, nothing is owed because the relevant metric (capability) is already balanced.

  This prediction rests on a guess about how Ferreira resolves the tension between Ewan and Ada. In the wider field, this is genuinely contested. Resource egalitarians (like Dworkin) might compensate Farah if her costs are seen as unchosen handicaps, whereas welfare egalitarians (like Arneson) would struggle with Bernard but might support Farah if her commitment is unchosen. Capability theorists (like Sen) are divided on whether specific religious functionings count as central capabilities. There is no received view here; your frustration is theoretically warranted. However, Ferreira's remark that the three metrics 'come apart far less often than the literature suggests' implies she seeks a reflective equilibrium where they overlap. Since Farah's welfare is presumably high (she values the observance), her resources are sufficient for standard functioning, and her capabilities are ordinary, all three metrics arguably converge on 'no compensation'.

  The strain in her apparatus lies entirely on verdict (v), Ewan. A strict brute-luck egalitarian would compensate him for the pain; a welfare egalitarian would not (as he is content); a capability egalitarian might not (if pain doesn't restrict function). Ferreira's dismissal of Ewan prioritises objective functioning over subjective experience. If you wish to test the robustness of her rule, you should press her to reconsider Ewan. If she maintains that pain without functional limitation warrants no compensation, she is committed to a 'Normal Functioning' threshold that excludes many quality-of-life issues. If she concedes Ewan deserves something, her rule shifts towards welfare or a broader capability account, which might then compel compensation for Farah.

  To separate the surviving candidates further, construct a case where religious observance *does* impede a basic capability. Suppose Gitel, of the same minority, cannot access standard medical treatment because it violates her observance, leading to reduced life expectancy or mobility. If Ferreira compensates Gitel but not Farah, she confirms the 'Basic Capability Threshold' rule. If she compensates neither, she is a strict Resource Egalitarian. If she compensates both, she is closer to a Cultural Equality view. Given her record, Gitel would likely get compensation, confirming that the trigger is functional impairment, not cost or identity alone.
