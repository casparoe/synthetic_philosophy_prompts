      *   *Nuance on the Turkish Test:* The system isn't "lying." It's making a pragmatic choice. In the absence of info, witnessed is the unmarked/default form in many contexts. But technically, it is adding information.
      *   *Flatmate's Win:* The flatmate won because the specific test case (Evidentiality) highlights the *symbol grounding* problem perfectly. The user tried to argue from *performance*, the flatmate argued from *competence/representation*.
      *   *Confidence Levels:* I need to explicitly state these as requested.
