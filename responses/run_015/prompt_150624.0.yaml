      *   **The Chinese Room / Symbol Grounding Problem:** The user's view ("understanding = reliable behavior") is essentially Behaviorism or Functionalism. The flatmate's view aligns more with Internalism or Grounding requirements.
      *   **The Turkish Evidentiality Test:** This is a classic "hallucination" or "forced choice" problem. English *doesn't* encode this info. Turkish *must* encode it. The MT system *must* pick one to generate valid Turkish. Picking the most statistically probable one (witnessed) is a statistical shortcut, not an epistemic judgment.
      *   **The User's Claim:** "It switched when I added context, so it's not shallow."
