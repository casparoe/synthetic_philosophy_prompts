      *   *Part 2 (Section II):* It's doing philosophical work *if* it illustrates the distinction between *teleological optimization* (getting the grade) and *structural competence* (understanding the interference). Warning: Don't lean too hard on the "student intent" aspect, focus on the *systemic pressure*.
      *   *Part 3 (Section III):* It's not nostalgia; it's foresight. Connect to "Curriculum Learning." The defense lies in the geometry of loss landscapes. The risk is implying the machine *knows* it made a mistake. Refine "exposure to mistakes" to "traversal of error space."
