  8.  **Structuring the Debrief (The Core Request):**

      *   Must map specific failures to the 3 questions.
      *   Must show where Friend points (Data/Empirical success) vs. Instructor points (Conceptual gap).
      *   Must address the "Lifetime Calibration" confound.
      *   Must define Session Failure (e.g., students think it's just a memory game).

