      *   *Wait, the prompt asks for specific pairs to test Similarity Structure.*
      *   *Pair 1 (Control):* Cube vs. Sphere. (Distinct in both).
      *   *Pair 2 (Visual Same / Haptic Diff):* Smooth Sphere vs. Spiky Sphere (e.g., a tennis ball vs. a spiky massage ball). *Vision:* Both round/bumpy texture visible. *Touch:* Very different.
      *   *Pair 3 (Haptic Same / Visual Diff):* A **Wooden Cube** vs. a **Cardboard Cube** painted identically. *Touch:* Weight/Temp/Vibration differ. *Vision:* Identical. *Wait, that's Haptic Diff / Visual Same.*
      *   *Let's try:* **A thin wooden disk** held on edge vs. **A thin wooden stick**.
          *   *Touch:* If explored quickly, both feel like a thin linear edge.
          *   *Vision:* One is a circle, one is a line.
          *   *Problem:* Hard to control how they touch.
      *   *Better:* **Solid Cylinder** vs. **Hollow Cylinder (open ends)**.
          *   *Touch:* If hands cover ends, feels like solid cylinder.
          *   *Vision:* Clearly hollow.
          *   *This works for "Look Alike / Feel Different" if we mask the ends during touch.*
      *   *Let's go with the Prompt's specific requirement:* "Pairs that are nearly indistinguishable by hand but plainly different to the eye, and pairs that look alike but feel different."
      *   *Set:*
          1.  **Wood Cube** (Control).
          2.  **Wood Sphere** (Control).
          3.  **Visual Same / Haptic Diff:** **Smooth Wooden Sphere** vs. **Velcro-covered Sphere**. (Visually distinct if close, but from 5 feet? Maybe **Matte Black Sphere** vs. **Glossy Black Sphere**. Touch: Friction diff. Vision: Reflectance diff. *Too subtle.*)
          4.  **Let's use the "Bag" constraint.**
          5.  *Haptic Same / Visual Diff:* **Object X:** Solid Block. **Object Y:** Hollow Shell (same outer dimensions). If students can't lift them (weight cue) or tap them (sound cue), they feel the same outer geometry. Vision sees the hole/interior.
          6.  *Visual Same / Haptic Diff:* **Object P:** Sandpaper Cube. **Object Q:** Wood Cube. (Painted same). Vision sees color/shape (same). Touch feels texture (diff).

      *   *Okay, let's finalize the objects for the $40 budget.*
          *   1 Wooden Cube ($5).
          *   1 Wooden Sphere ($5).
          *   1 Wooden Pyramid ($5).
          *   1 Cardboard Cube painted same as Wooden Cube ($2 materials). -> *Visual Same / Haptic Diff (Weight/Temp).*
          *   1 Wireframe Cube ($5). -> *Haptic Similar (edges) / Visual Diff (Transparency).*
          *   Blindfolds (Sleep masks, $20 for 14).
          *   Opaque Bags ($5).
          *   Paper/Pencils (Assumed available or $3).
          *   Total: ~$45. Need to trim.
          *   *Trim:* Buy 1 set of geometric solids ($20). Make the "trick" objects from cardboard/wire ($10). Blindfolds: Ask students to bring scarves? No, unreliable. Buy cheap sleep masks ($20). Total $50. I need to cut $10.
          *   *Cut:* Use cloth bags from thrift store instead of blindfolds? No, need hands free. Use scarves from the department? Assume instructor can scrounge blindfolds. I will budget for 5 blindfolds and rotate, or use cloth bags over hands? No, "tactile-first phase... unseen".
          *   *Revised Budget:* 14 students is a lot for individual objects. **Group them.** 4 groups of 3-4 students. This reduces object cost significantly.
          *   *Groups:* 4 stations. Each station needs 1 set of objects.
          *   *Budget:* $40 / 4 stations = $10 per station. Doable with craft supplies.

  4.  **Addressing the "Three Questions":**

      *   *Q1 Identification:* Match Tactile Object -> Visual Array.
      *   *Q2 Prediction:* Draw/Select Silhouette *before* seeing object.
      *   *Q3 Similarity:* Rate similarity of pairs in Touch vs. Vision.
      *   *The "Deadlock" Moment:* When they succeed at Identification (because they are calibrated) but realize their Prediction was actually a *memory recall* of visual images associated with touch, not a translation of pure touch.
      *   *The "Friend" Point:* You succeeded, so vision and touch share information.
      *   *The "Instructor" Point:* You succeeded because you *learned* the link. The question is about the link itself.

  5.  **Anticipating Failure Modes:**

      *   *Cheating:* Peeking. *Fix:* Honor system + peer monitoring + "If you peek, you ruin the data for everyone."
      *   *Verbal Labeling:* Saying "It's a cube" in Phase 1. *Fix:* Ban shape names. Use "Object 1, Object 2".
      *   *Memory vs. Translation:* They remember "I touched a cube" and then look for a cube. *Fix:* This is the *point*. The debrief must highlight that "Cube" is an amodal concept they already possess, which begs the Molyneux question.
      *   *Boredom/Confusion:* Keep instructions crisp.

  6.  **Drafting the Timeline:**

      *   0-10: Setup & Grouping.
      *   10-30: Phase 1 (Tactile + Prediction).
      *   30-50: Phase 2 (Visual + Identification + Similarity).
      *   50-65: Group Debrief (Data aggregation).
      *   65-80: The Philosophical Pivot (The Deadlock).

  7.  **Refining the "Similarity Structure" Task:**

      *   This is the hardest part.
      *   Task: "Here are 3 objects. Rank them by how similar they feel. Now rank them by how similar they look."
      *   Objects:
          1.  Smooth Cube.
          2.  Sandpaper Cube.
          3.  Smooth Sphere.
      *   *Touch:* 1 & 2 are similar (shape), 3 is different. OR 1 & 3 are similar (smooth), 2 is different.
      *   *Vision:* 1 & 2 are similar (shape/color), 3 is different.
      *   *If they rank 1&2 similar in Touch (shape) and 1&2 similar in Vision (shape):* Congruent.
      *   *If they rank 1&3 similar in Touch (texture) and 1&2 similar in Vision (shape):* **Divergence.**
