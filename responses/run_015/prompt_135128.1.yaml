answer: |-
  # Session Plan: The Molyneux Deadlock
  **Course:** Perception and Reality (First-Year Seminar)
  **Time:** 80 Minutes
  **Students:** 14 (4 Groups of 3–4)
  **Budget:** ~$40
  **Tech:** None (Whiteboard only)

  ## I. Materials & Setup ($40 Budget)

  You need four identical "Perception Stations." Divide the class into four groups. Each station requires a "Touch Box" and a set of objects.

  **The Touch Box (Free):**
  *   4 Large Cardboard Boxes (ask campus mailroom or local liquor store).
  *   Cut two arm-holes on one side. Tape a flap of dark cloth (old t-shirts) over the holes so light doesn't enter when arms are inside.
  *   *Function:* Students put hands in to feel; eyes remain outside. This is cheaper and more secure than 14 blindfolds.

  **The Object Set (Per Station, ~$10/station = $40 total):**
  *   **Object A (Control):** Wooden Cube (approx. 3-inch). *Hardware store craft section.*
  *   **Object B (Control):** Wooden Sphere (approx. 3-inch diam). *Hardware store craft section.*
  *   **Object C (Visual Same / Haptic Diff):** Wooden Cube wrapped entirely in coarse Sandpaper. *Paint or stain to match Object A's color if possible, or just accept color diff and focus on shape.*
      *   *Role:* Looks like a cube, feels rough. Tests if texture overrides shape in haptic similarity.
  *   **Object D (Haptic Same / Visual Diff):** Wireframe Cube (same dimensions as Object A). *Craft store or bend stiff wire.*
      *   *Role:* Feels like edges/corners (similar to A), but looks transparent/hollow (different from A).
  *   **Supplies:** Paper, pencils, masking tape (to label objects 1–4 inside the box).

  **Whiteboard Prep:**
  *   Draw three columns: **Identification**, **Prediction**, **Similarity**.
  *   Leave space for 4 groups to record scores.

  ---

  ## II. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Divide into 4 groups. Assign roles: **Handler** (hands in box), **Scribe** (records data), **Observer** (watches for cheating/peeking). Rotate roles halfway. |
  | **05–25** | **Phase 1: Tactile & Prediction** | **Task:** Handler places hands in box. Objects 1–4 are inside. <br>1. **Explore:** 2 mins per object. <br>2. **Predict:** Without looking, Scribe draws the *visual outline* (silhouette) of each object on paper. <br>3. **Rate:** Scribe records a "Haptic Similarity Matrix" (Rate 1–5 how similar Object 1 feels to 2, 3, 4, etc.). <br>*Constraint:* No shape names allowed (no "cube," "sphere"). Use "Object 1." |
  | **25–45** | **Phase 2: Visual & ID** | **Task:** Objects are placed on the table in front of the group (visible). <br>1. **Identify:** Handler must match the physical object to their drawing from Phase 1. (e.g., "Drawing A is Object 3"). <br>2. **Rate:** Scribe records a "Visual Similarity Matrix" (Rate 1–5 how similar Object 1 looks to 2, 3, 4). <br>3. **Score:** Group calculates % correct on Identification. |
  | **45–55** | **Data Aggregation** | Groups come to the whiteboard. <br>1. Write Identification % in Column 1. <br>2. Write one major discrepancy between Haptic vs. Visual Similarity ratings in Column 3. (e.g., "Sandpaper Cube felt different from Wood Cube, but looked same"). |
  | **55–65** | **The Internal Debrief** | **Instructor facilitates discussion on the data only.** (See *Debrief Script* below). Do not mention Molyneux, Locke, or philosophy yet. |
  | **65–80** | **The Philosophical Pivot** | **Reveal:** Introduce the historical problem (Molyneux's Problem). <br>**The Deadlock:** Map the Friend's view vs. Your view onto the session's results. <br>**Close:** Assign reflection on the "Calibration Confound." |

  ---

  ## III. The Three Questions (Design Logic)

  This activity is rigged to separate the three questions you identified. Here is how the materials map to them:

  1.  **Identification (Can you pick it out?):**
      *   *Test:* Matching the physical object to the drawing.
      *   *Expected Result:* High success (80–100%).
      *   *Why:* Students have 20 years of calibration. They recognize "cubeness."
      *   *Pedagogical Use:* This is where your **Friend** will plant her flag. "Success proves the senses share content."

  2.  **Prediction (Can you draw it before seeing?):**
      *   *Test:* The silhouette drawn in Phase 1.
      *   *Expected Result:* Accurate shapes, *but*...
      *   *The Catch:* Ask them *how* they drew it. Did they translate touch to sight? Or did they label it "Cube" mentally and draw a cube from memory?
      *   *Pedagogical Use:* This is where **You** plant your flag. "You didn't translate sensation; you accessed a concept."

  3.  **Similarity Structure (Do alike things feel alike?):**
      *   *Test:* Comparing ratings of Wood Cube vs. Sandpaper Cube vs. Wire Cube.
      *   *Expected Result:* **Divergence.**
          *   *Vision:* Wood Cube & Sandpaper Cube look similar (shape). Wire Cube looks different (transparent).
          *   *Touch:* Wood Cube & Wire Cube feel similar (edges). Sandpaper Cube feels different (texture).
      *   *Pedagogical Use:* This proves the *spaces* are different. If the senses shared intrinsic content, similarity metrics should align perfectly. They won't.

  ---

  ## IV. The Debrief Script (Minutes 55–80)

  ### Part 1: The Data (Minutes 55–65)
  *Do not lecture. Ask these questions in order.*

  1.  **On Identification:** "Look at the board. Most of you scored near 100% on matching. If a blind-from-birth person did this task and failed, would you say they are broken, or that the task is harder than it looks?"
      *   *Goal:* Make them feel their success is not trivial.
  2.  **On Prediction:** "Look at your drawings. Did you draw what your hand *felt*, or did you draw what you *know* a cube looks like?"
      *   *Probe:* "If I gave you a shape you'd never seen or touched before—a 4D hypercube model—could you draw it from touch alone?"
      *   *Goal:* Expose the reliance on prior visual memory.
  3.  **On Similarity:** "Look at the discrepancies. Group 2, you said the Sandpaper Cube felt very different from the Wood Cube, but looked the same. Group 4, you said the Wire Cube felt like the Wood Cube, but looked different. If 'Shape' is the same thing for both eyes and hands, why did your similarity ratings split?"
      *   *Goal:* Show that "Shape" is not a single invariant property across senses.

  ### Part 2: The Pivot (Minutes 65–80)
  *Now introduce the history.*

  1.  **The Reveal:** "This is Molyneux's Problem (1688). A blind man knows a cube and a sphere by touch. His sight is restored. Can he tell them apart by sight alone?"
  2.  **Mapping the Deadlock:**
      *   **Point to the Identification Scores (Friend's View):** "My colleague argues: You succeeded. Restored-sight patients eventually succeed. Therefore, the answer is 'Yes, with learning.' The question is settled by data. The mind is a blank slate that *learns* to connect these."
      *   **Point to the Similarity Mismatches (Your View):** "I argue: You succeeded because you *already know* what a cube is. The data doesn't touch the real question. The real question is: Does the *feeling* of a corner share anything with the *sight* of a corner? Your similarity ratings show they don't align perfectly. Texture matters to touch; transparency matters to sight."
      *   **The Confound:** "Here is the problem neither of us can solve in this room. You have 20 years of calibration. You are not Molyneux's subject. Your success proves you are good at *remembering*, not that vision and touch are intrinsically linked."
  3.  **The Closing Question:** "If a creature could learn to match sight and touch perfectly, but the *experience* of seeing a square was totally unlike the *experience* of feeling a square, would Molyneux's question be answered 'Yes' or 'No'? Discuss."

  ---

  ## V. Failure Modes & Mitigation

  | Failure Mode | How it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Verbal Labeling** | Student says "It's a pyramid" in Phase 1. | **Rule:** Ban shape names. Use "Object 1, 2, 3." If caught, group loses a point. This forces them to rely on sensation, not semantic memory. |
  | **Peeking** | Student lifts the box flap. | **Role:** The "Observer" is explicitly tasked with watching the box, not the objects. Make it a social contract: "If you peek, you invalidate your group's data." |
  | **Task Simplification** | Students treat it as a memory game ("I remember Object 1 is heavy"). | **Debrief:** Call this out. "If you used weight or temperature, you used *auxiliary* cues, not shape. Molyneux's question is about *shape*." |
  | **Session Failure** | Students conclude: "It's just about practice." | **Fix:** This is actually a *success* for the Friend's view, but a failure for the seminar. To prevent this, emphasize the **Similarity Mismatch**. If the senses were just "practice," similarity structures should align. The fact that they don't suggests a deeper structural gap. |
  | **Budget/Time Overrun** | Drawing takes too long. | **Fix:** Tell them "Stick figures/Outlines only. No shading." Limit Phase 1 to 20 mins strictly. |

  ---

  ## VI. What You Must Say (The Instructor's Burden)

  The activity cannot reproduce the "Blind-from-Birth" condition. You must be explicit about this limitation in the final 15 minutes.

  **Say this:**
  > "This experiment has a fatal flaw. You are not blind. You have spent two decades teaching your brain that *this* feel means *that* look. When you succeeded today, you proved that **calibration works**. You did not prove that **vision and touch share a language**."

  **Say this (to validate the Friend):**
  > "My friend is right that data matters. If restored-sight patients *never* learned to match shapes, we'd say the senses are disjoint. They do learn. So empirically, the connection is possible."

  **Say this (to validate Your View):**
  > "But I am right that data isn't enough. Learning to translate English to Morse Code doesn't mean the *letters* and the *dots* are the same thing. You can learn the pairing without the content being shared. Today, you felt the gap in your Similarity Ratings. That gap is where the philosophy lives."

  ## VII. Definition of Session Failure

  The session fails if:
  1.  **Obviousness:** Students leave thinking, "Obviously you can tell a cube from a sphere, why was this a debate?" (Indicates they missed the "Blind-from-Birth" constraint).
  2.  **Psychologizing:** Students leave thinking, "It's just about how good people are at feeling shapes." (Indicates they missed the metaphysical question about *content*).
  3.  **Resolution:** Students leave thinking the debate is *settled*. (The goal is for them to feel the *deadlock*).

  **Success looks like:** Students arguing in the hallway about whether "learning" counts as "knowing," and whether their drawing was a translation or a memory.
