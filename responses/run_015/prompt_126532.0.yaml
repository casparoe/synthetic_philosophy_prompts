      *   **Resolve 2 vs 5:** They are the same kind of incoherence. The intuition that 5 is worse might be because color inversion is a classic philosophical zombie trope, whereas taste is more subjective. But logically, they stand or fall together.
      *   **The Time Case:** Treat it like Case 3. If reasoning is intact, the "flow" is a conceptual overlay, not a raw feel.

  8.  **Refining the "Disciplined Use":**
