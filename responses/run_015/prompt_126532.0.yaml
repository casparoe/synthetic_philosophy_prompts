answer: |-
  You are wrestling with the core tension in philosophy of mind: how to respect first-person authority (the subject's report) without committing to epiphenomenal magic (a private show that does nothing).

  Your intuition is tracking a functionalist framework, likely influenced by Dennett, but you are hesitating on where to draw the line between a "real" phenomenal difference and a "theoretical" one.

  Here is a principle that reconciles your verdicts on Cases 1, 3, and 4, and resolves the tension between 2 and 5.

  ### The Principle: Causal Anchoring of Phenomenal Judgments

  **A report of a qualitative change is coherent only if that change corresponds to a distinguishable shift in the subject's cognitive economy (discrimination, memory, attention, or affective response).**

  In other words: **Qualia are not *properties* of experience that sit behind behavior; they are *dispositions* to behave and judge in specific ways.** If you claim a qualitative shift occurred, you must be able to point to *what work that shift is doing* in the system.

  Let's apply this to your cases.

  #### The Coherent Cases (1 & 4)
  *   **Case 1 (Chase):** The sensory discrimination is stable, but the **hedonic/affective processing** has changed. This is coherent because "taste" is not a monolith; it is a composite of sensory data + valuation. The valuation system has shifted. The "work" being done is the change in preference.
  *   **Case 4 (Dissociated Pain):** This is the strongest evidence for your principle. Neuroscience confirms pain has two tracks: sensory-discriminative (where/sharp) and affective-motivational (suffering/avoid). The patient reports the "quality" (sensory) is the same, but the "bother" (affective) is gone. This is coherent because we can isolate the functional systems. The "qualia of suffering" has vanished because the *avoidance disposition* has vanished.

  #### The Incoherent Cases (3 & 5)
  *   **Case 3 (Silent Synesthete):** The subject reports a "spatial curvature" but it influences no arithmetic, no memory, no attention, and no report unless prompted. It does no **causal work**. To posit a "private curvature" here is to posit an epiphenomenon. It is indistinguishable from a delusion about numbers.
  *   **Case 5 (Inverted Painter):** This is the Inverted Spectrum argument. If her behavior (mixing paints) and neural processing (fMRI) are identical, the "inversion" makes no difference to the system.
      *   *Why it feels different from Case 3:* In Case 3, the qualia is *added*. In Case 5, it is *swapped*. But under the Causal Anchoring principle, they are the same. If the functional relations between red, green, paint tubes, and language are preserved, "red" is defined by those relations. To say "it looks inverted" is to use words without functional anchor.

  #### The Pivot: Case 2 (Sanborn) vs. Case 5
  You feel Case 5 is definitely incoherent, but you are wobbly on Case 2. **Under this principle, they stand or fall together.**

  *   **The Trap in Case 2:** You noted Sanborn "avoids" the coffee. That is a behavioral change. However, you also said "discrimination behavior hasn't changed."
  *   **The Resolution:** If Sanborn cannot distinguish the coffee from cardboard in a blind test, but avoids it only because he *believes* it is cardboard (based on a prior report), then the *sensory qualia* have not changed. Only his *belief* has changed.
  *   If the liquid *actually tasted different* (sensory qualia shift), his discrimination behavior **would** change (e.g., he could pick it out of a lineup of normal coffee).
  *   **Verdict:** If discrimination is truly unchanged, Case 2 is **incoherent** regarding sensory qualia. It is actually a Case 1 (preference/belief shift) masquerading as a sensory shift.

  **Why Case 5 feels "more" incoherent to you:**
  In Case 2 (Taste), there is often a confusion between *sensation* and *reaction*. We forgive people for conflating "this tastes bad" with "this tastes different." In Case 5 (Color), the link between color and identification is tighter. If you identify red as red perfectly, claiming it "looks green" seems like a linguistic lie rather than a sensory confusion. But logically, if the functional role is preserved, both are incoherent posits of "extra" properties.

  ### The Disciplined Usage
  To use "qualia" without falling into incoherence, you should treat it as a shorthand for **"Phenomenal Judgment."**

  *   **Don't say:** "There is a private property of 'redness' that exists independently of my ability to sort red objects."
  *   **Do say:** "I am in a state that disposes me to judge this object as 'red' and distinct from 'green'."

  This allows you to keep the first-person authority (the judgment is real) without positing a ghost in the machine (the property is functional).

  ### The Unlisted Case: Time Flow
  > *Someone reports that time "flows" for them in a particular direction after a brain injury, but all their temporal reasoning and memory sequencing stay intact.*

  **Verdict: Incoherent as a perceptual qualia; Coherent as a narrative belief.**

  *   **Application of Principle:** Does the "flow" do any work?
      *   If their memory sequencing is intact, they know what happened before and after.
      *   If their temporal reasoning is intact, they can predict future states.
      *   If the "flow" changes none of this, it is not a sensory datum (like color or pain).
  *   **Diagnosis:** "Flow" is a high-level cognitive interpretation of entropy and memory accumulation, not a raw sensory input. A patient claiming the "direction" changed (e.g., they feel time moving left-to-right instead of past-to-future) while maintaining intact sequencing is likely experiencing a **conceptual dissociation**, not a phenomenal one.
  *   **Disciplined phrasing:** "The patient has acquired a new *conceptual metaphor* for temporal sequence," not "The patient's *temporal qualia* inverted."

  ### Summary
  Your gut is right to be suspicious of 2, 3, and 5. The principle that saves 1 and 4 is **Functional Dissociation**.
  *   In 1 and 4, you can point to specific subsystems (valuation, affect) that have changed function.
  *   In 2, 3, and 5, the subject claims a change in the "raw feel" without a corresponding change in the functional role of that feel.

  If you adopt the **Causal Anchoring Principle**, you can keep "qualia" as a useful term for *how judgments feel*, while rejecting it as a term for *magic properties that float free of behavior*. This is the disciplined Dennettian middle path: respect the report, but analyze the function.
