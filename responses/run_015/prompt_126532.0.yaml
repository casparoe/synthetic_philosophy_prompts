      *   *Case 4 (Pain):* This is the classic pain asymbolia case. Functionalists distinguish *sensory-discriminative* (where is it? how sharp?) from *affective-motivational* (ouch! avoid!). The user calls this coherent. This aligns with neuroscientific models (S1 vs. ACC/Insula).
