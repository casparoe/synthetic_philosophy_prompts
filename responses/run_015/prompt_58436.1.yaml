          *   *Why this works:* It separates *concept* (Cat) from *sensation* (Bumps vs. Ink). It fits the "Retiree/HSer" demographic (literacy).
          *   *Trap:* People will say "Yes, because I learned both."
          *   *Correction:* "Imagine you *only* learned Braille. Then someone shows you Print. Do you know it?"

