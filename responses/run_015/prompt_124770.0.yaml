  # Q&A Prep Sheet: Confucian Role Ethics & Localized Ontology

  **Context:** Grad Seminar (Comparative Ethics)
  **Audience:** Analytic majors (meta-ethics focus), 1 Chinese Phil Specialist (exegetical rigor), 2 Sociology grads (power/gender focus).

  ---

  ### 1. The "Moral Relativism" Trap (Most Likely)
  **Who:** Analytic Philosophy Students
  **The Question:** "If *yi* is purely indexical and there's no universal substrate, how do you resolve conflicts between roles without just falling into particularism? If the father and son have conflicting 'rights,' what adjudicates besides power?"
  **Damage Level:** High (attacks the coherence of your ontology).
  **Quick Reply:** "It's not particularism; it's situational discernment (*quan*). The adjudication isn't a higher rule, it's the work of sustaining the relational field itself. If the relationship breaks, both lose normative standing. The 'ought' comes from the viability of the connection, not a external principle."
  **Where You're Soft:** You haven't fully explained what happens when the relationship is irretrievably broken (e.g., abuse). You risk sounding like you're saying "whatever works to keep the peace."

  ### 2. The "Agency & Critique" Trap (Very Likely)
  **Who:** Sociology Students
  **The Question:** "If the self is *constituted* by enacting roles, where is the leverage to critique oppressive roles? Doesn't this ontology lock people into structures they didn't choose?"
  **Damage Level:** High (makes your theory look politically naive).
  **Quick Reply:** "Critique comes from within the performance, not outside it. You critique a 'father' not by appealing to universal rights, but by showing how he fails the demands of fatherhood. The role isn't a shield; it's a standard you can fail to meet."
  **Where You're Soft:** This relies on the community recognizing the failure. If the community is corrupt, your mechanism for critique collapses.

  ### 3. The "Western Framing" Trap (Likely)
  **Who:** Chinese Philosophy Specialist
  **The Question:** "You're reading *zhengming* through Austin. Isn't this projecting a Western speech-act framework onto a text that's fundamentally about political order and cosmic harmony, not mutual recognition?"
  **Damage Level:** Medium (questions your exegetical credibility).
  **Quick Reply:** "I'm using speech-act theory heuristically, not exegetically. I'm not claiming Confucius read Austin. I'm claiming the *logic* of performativity explains how the naming *works* better than a top-down command model does."
  **Where You're Soft:** You are arguably revisionist. The Analects do suggest a top-down element (ruler rectifies subject). You need to own that you are reconstructing, not just describing.

  ### 4. The "Patriarchy" Trap (The Nightmare Question)
  **Who:** Sociology Students (or anyone sensitive to power dynamics)
  **The Question:** "The *wulun* are inherently hierarchical, especially husband/wife. Doesn't this 'localized ontology' just provide a sophisticated justification for patriarchy by making inequality ontological?"
  **Damage Level:** Critical (can shut down the room).
  **Quick Reply:** "The hierarchy is historical, not ontological. My claim is about how role ethics *functions*, not that every historical instantiation was just. The ontology allows for critique when the 'superior' role fails to nurture the 'inferior' role."
  **Where You're Soft:** The texts *are* patriarchal. You cannot argue they aren't without lying.
  **Pre-emptive Concession Strategy:** **Do not wait for this question.** In your intro or conclusion, explicitly state: *"I am aware the historical texts encode rigid hierarchies. I am not defending the historical hierarchy; I am arguing the underlying relational ontology offers a mechanism for critique that universalist ethics often misses."* This disarms the objection before it lands.

  ---

  ### General Defense Notes
  *   **Don't get stuck on "Universalism":** When analytics press for a universal principle, pivot to "shared human condition of relationality." It's universal that we are relational, not universal what the rules are.
  *   **Don't overclaim on *Zhengming*:** If the specialist pushes hard on the textual evidence for "mutual recognition," concede that Confucius hoped for top-down rectification but argue that *effective* rectification requires bottom-up recognition (otherwise it's just coercion).
  *   **Watch your language:** Avoid "rights" unless you qualify it as "role-specific expectations." Use "demands," "expectations," or "obligations."

  Bottom line: The normativity isn't in the rule, it's in the work of sustaining the relationship.
