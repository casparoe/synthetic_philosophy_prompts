answer: |-
  ### Critique of the Proposed Inventory

  Your inventory (i–v) is technically competent but leans too heavily on the internal problems of imprecise probability theory rather than the external constraints of the institutional user.

  *   **(i) Decision Gap:** Correct, but incomplete. The rivalry between E-admissibility and $\Gamma$-maximin is not just a theoretical choice; it is a choice about *liability*. E-admissibility allows a committee to say "any of these three actions were permissible," which regulators often reject. $\Gamma$-maximin is defensible but often paralyzing. The research must focus on *defensibility*, not just coherence.
  *   **(ii) Revision/Dilation:** Correct, but dilation should not be treated solely as a pathology to be solved. For a risk committee, dilation is often a accurate signal that a specific observation increases ambiguity. The question is not how to avoid it, but how to manage it procedurally.
  *   **(iii) Independence:** **Deprioritize.** In the precise case, independence notions coincide; in the imprecise case, they proliferate (epistemic, strong, weak, etc.). For institutional risk, "independence" is usually a causal claim about the world, not a formal property of the probability set. Solving the formal taxonomy of independence will not help a pension trustee defend a decision.
  *   **(iv) Interpretation:** Critical. This maps directly to your first stipulation (sources of indeterminacy). If the set represents disagreement, averaging is a category error. If it represents sparse evidence, averaging is inevitable.
  *   **(v) Elicitation/Communication:** Elicitation is psychological; communication is rhetorical. Your program is formal. Keep elicitation minimal (how to represent expert intervals coherently) and focus heavily on communication as the "One-Page Constraint."

  ---

  ### The Research Agenda: Four Open Questions

  The following agenda is ordered by logical dependency. You cannot decide how to collapse a set (Q3) until you know what the set represents (Q1) and how it changes (Q2). You cannot communicate the decision (Q4) until the decision rule is fixed (Q3).

  #### 1. Source-Sensitive Representation
  **Question:** How must the mathematical structure of the probability set differ depending on whether the imprecision arises from (a) sparse data, (b) conflicting expert testimony, or (c) a normative precautionary principle?

  *   **Worth:** Current theory treats all sets of probabilities as mathematically equivalent. This is a category error for your users. A set derived from sparse data should shrink with sampling; a set derived from expert disagreement should shrink with consensus-building; a set derived from a legal precautionary norm *should not shrink* with evidence, only with legislative change. Conflating these leads to false confidence or unjustified caution.
  *   **Dependencies:** Upstream of everything. If the representation is wrong, the update rules (Q2) and decision rules (Q3) will be invalid.
  *   **Tractability:** Theoretical. Requires axiomatic work to distinguish "epistemic" sets from "normative" sets. Existing tools (credal sets) are sufficient, but the axioms need refinement.
  *   **Slot Allocation:** 2 Researchers (1 Senior Axiomatist, 1 Junior Formalist).

  #### 2. Dilation as a Procedural Signal
  **Question:** Under what conditions should dilation (increased imprecision after learning evidence) trigger a mandatory pause in decision-making versus being accepted as a permanent feature of the risk landscape?

  *   **Worth:** In standard theory, dilation is often viewed as a failure of the model. For a risk committee, dilation indicates that a specific piece of data reveals deeper structural uncertainty. If the program treats dilation as a "stop-loss" signal, it turns a mathematical bug into a governance feature. This directly informs the "Terminal Sharpening" deadline.
  *   **Dependencies:** Depends on Q1 (knowing what the set represents). Upstream of Q3 (you cannot choose if you are in a dilation-induced pause).
  *   **Tractability:** Formal. Requires analyzing update rules (Generalized Bayes vs. others) under the specific taxonomies from Q1.
  *   **Slot Allocation:** 2 Researchers (1 Dynamic Epistemic Logician, 1 Decision Theorist).

  #### 3. The Legitimacy of Terminal Sharpening
  **Question:** What is the formal and normative criterion for legitimately collapsing a convex set of probabilities to a single precise distribution for the sake of action?

  *   **Worth:** This addresses your second stipulation directly. Standard imprecise probability theory has no mechanism for this; it prefers to remain imprecise indefinitely. But a pension fund *must* pick a number. The program must define the "cost of indecision" versus the "risk of precision." Is the collapse justified by time pressure, budget exhaustion, or a threshold of "sufficient" precision? This is the bridge between formal epistemology and administrative law.
  *   **Dependencies:** Depends on Q1 (source of imprecision) and Q2 (current state of the set). Upstream of Q4 (the justification).
  *   **Tractability:** Normative/Philosophical. This is the hardest theoretical lift. It requires defining a utility function over *precision itself*, not just outcomes.
  *   **Slot Allocation:** 2 Researchers (1 Philosopher of Science/Law, 1 Economist).

  #### 4. The One-Page Audit Trail
  **Question:** Can we construct a decision procedure where the formal justification for a choice (including the sharpening rule used) is compressible into a single page of lay-auditable text without losing logical coherence?

  *   **Worth:** This addresses your third stipulation. Most formal decision rules are computationally opaque. If the committee cannot explain *why* they sharpened the set or *why* they chose the worst-case scenario, they will lose in court. This question forces the mathematics from Q3 to be simple enough to be transparent. It constraints the complexity of the entire program.
  *   **Dependencies:** Depends on Q3. If the sharpening rule is too complex, it fails this test.
  *   **Tractability:** Empirical/Computational. Requires drafting prototype justifications and testing them against non-experts (simulated auditors).
  *   **Slot Allocation:** 2 Researchers (1 Technical Communicator/Logician, 1 Behavioral Scientist).

  ---

  ### Allocation of Eight Slots

  *   **Team A (Foundations):** 2 Researchers on Q1 (Representation).
  *   **Team B (Dynamics):** 2 Researchers on Q2 (Revision/Dilation).
  *   **Team C (Norms):** 2 Researchers on Q3 (Sharpening/Decision).
  *   **Team D (Interface):** 2 Researchers on Q4 (Communication/Audit).

  *Reasoning:* This splits the team evenly between pure theory (A & B) and applied norms/interface (C & D). Given the "practitioner-facing deliverable" constraint, a 50/50 split ensures the math doesn't drift too far from the institutional reality.

  ---

  ### Explicit Exclusions

  1.  **Formal Independence Axioms (Inventory iii):** I am excluding a dedicated investigation into the taxonomy of independence (epistemic vs. strong vs. weak).
      *   *Reason:* For institutional risk, independence is a causal assumption about the assets or pathogens, not a property of the probability set. Solving the formal independence problem does not help a committee defend a decision. The team should assume a standard causal graph and focus on the probabilities attached to it.
  2.  **Psychological Elicitation Techniques (Inventory v):** I am excluding the development of new methods for interviewing experts.
      *   *Reason:* This is psychology, not formal epistemology. The program should take expert intervals as *given* inputs and focus on how to process them coherently. Spending three years on how to ask questions will dilute the focus on how to *decide* based on the answers.

  ---

  ### Triggers for Re-ordering

  The agenda is ordered logically, but empirical or computational realities may force a shuffle.

  *   **Move Q4 Upstream:** If, in Year 1, Team C discovers that *no* coherent sharpening rule can be explained on one page, Q4 becomes the bottleneck. The program would need to pivot to simplifying the math before refining the norms.
      *   *Trigger:* Failure to produce a draft "One-Page Justification" for a standard case study by Month 9.
  *   **Move Q2 Downstream:** If computational complexity makes updating convex sets too slow for real-time committee use, the theoretical elegance of dilation management becomes irrelevant.
      *   *Trigger:* If Team B demonstrates that coherent updating for >10 variables exceeds reasonable computational limits for the intended users.
  *   **Elevate Exclusion (Independence):** If the "Source-Sensitive Representation" (Q1) fails because the sources of indeterminacy cannot be mathematically distinguished without a robust theory of independence.
      *   *Trigger:* If Team A proves in Year 1 that sparse evidence and expert disagreement are mathematically indistinguishable without invoking specific independence assumptions.

  ### Summary of Reasoning

  This agenda prioritizes **accountability** over **optimality**. Standard decision theory asks, "What is the best choice given this uncertainty?" Your program asks, "What choice can be defended given this uncertainty?"

  By separating the *source* of the uncertainty (Q1), you prevent the committee from treating a legal precaution as a data problem. By treating *dilation* as a signal (Q2), you prevent the committee from ignoring warning signs of structural ambiguity. By focusing on *terminal sharpening* (Q3), you acknowledge the reality that institutions must act. By enforcing the *one-page constraint* (Q4), you ensure the work survives contact with the public and the courts.

  This structure ensures that the final deliverable is not just a paper, but a protocol: a set of rules that tells a committee when they are allowed to stop analyzing and start acting, and exactly what to write down when they do.
