  7.  **Final Polish:** Ensure the tone is adjudicatory and authoritative. Make sure the distinction between "underdetermination by evidence" (epistemic) and "indeterminacy of fact" (ontological) is the hammer I use to break the tie. Blake keeps treating it as the former; Alex correctly identifies it as the latter.

  *(Self-Correction during drafting)*: I should be careful not to simply say "Alex is right about Quine." I need to say "Alex is right about the *issue*." Quine might be wrong about the world, but within the logic of the argument presented, Alex's logic holds better. Actually, the prompt asks "who is more right overall." I can argue that Quine's thesis is robust *even against AI*. I will take the position that Alex is right because Blake commits a category error regarding "design facts." Design facts are physical facts. Quine says physical facts don't fix meaning. Therefore Blake is wrong.

