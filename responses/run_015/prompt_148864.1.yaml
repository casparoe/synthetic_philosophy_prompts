  **JOINT STATEMENT ON SYMBOL GROUNDING**
  **Date:** 03:14, Day 3 of Outage
  **Location:** Barge *Kestrel*, Delta Station
  **Signatories:** Bruna (Engineering), Teodor (Philology)

  **I. AGREED CLAIMS**

  1.  **Insufficiency of Syntax:** We agree that internal consistency alone does not constitute meaning. A system that manipulates symbols according to rules without any external constraint is indistinguishable from a dictionary defining words using only other words.
  2.  **The Regress Worry:** We agree that the "dictionary regress" is a real failure mode. If every symbol is defined only by reference to another symbol within the same closed system, no contact with reality is ever established.
  3.  **Requirement for Constraint:** We agree that a successful account of meaning must identify a mechanism that stops the regress. Something outside the symbol system must constrain the use of the symbols.
  4.  **Failure of Isolation:** We agree that a system completely isolated from both physical feedback and social correction cannot be said to mean anything. It may process data, but it does not refer.
  5.  **Operational Definition:** We agree to treat "grounding" as the placeholder term for whatever mechanism successfully stops the regress. We disagree on the nature of that mechanism.

  **II. RESIDUAL DISAGREEMENT**

  | | **Position** |
  | :--- | :--- |
  | **Bruna** | Meaning exists only if there is a causal-perceptual loop. The thing the symbol is about must be able to physically force the system to revise its use of the symbol. If the world cannot kick back, the symbol is empty. |
  | **Teodor** | Meaning exists only if there is a normative-social loop. The user must be answerable to other users who can correct them. If there is no community to hold you accountable for going on correctly, the symbol is empty. |

  **III. CRUXES AND TEST CASES**

  We identify five specific scenarios where our predictions diverge. Settling the outcome of any single case would force at least one of us to revise our position. We record our predictions here to prevent later revisionism.

  **Crux 1: The Necessity of a Living Community**
  *   **Case:** *The Orphan Corpus.* A system trained on every surviving page of a dead language. It produces fluent continuations and correct case endings. There are no living speakers to correct it.
  *   **Question:** Is the system ungrounded because there is no one to be wrong in front of, or is "ungrounded" the wrong word for a system preserving a practice without practitioners?
  *   **Bruna's Prediction:** Ungrounded. The system is matching patterns in static data. There is no causal loop where the *referents* of the words constrain the output. It is a complex mirror.
  *   **Teodor's Prediction:** Latently grounded. The system inherits the norms of the original community. It is not yet *using* the language, but it holds the structure of meaning ready. It fails only because it has no one to answer to, not because the symbols are empty.

  **Crux 2: The Reality of Simulation**
  *   **Case:** *Proxy Grounding.* A system learns vocabulary inside a high-fidelity simulation of a sailing ship (real rope physics, real wind models). It is never connected to a physical harbour.
  *   **Question:** Is contact with simulated things a kind of contact, or is it just contact with mathematics?
  *   **Bruna's Prediction:** Ungrounded. The system interacts with code, not rope. The physics are models, not constraints. If the simulation parameters change, the "rope" changes without the system being able to resist.
  *   **Teodor's Prediction:** Grounded enough. The system learns to navigate a consistent rule-space where mistakes have consequences (the ship sinks in sim). If the practice is stable, the meaning holds, even if the substrate is virtual.

  **Crux 3: Maintenance vs. Initiation**
  *   **Case:** *One-Shot Anchoring.* A robot is shown a single labelled example of a tool, then left alone for a decade with no correction.
  *   **Question:** Does the link survive, decay, or was it never the right kind of link?
  *   **Bruna's Prediction:** Decay. Without ongoing perceptual feedback to recalibrate the sensor drift, the link degrades. The causal loop was broken the moment the training stopped.
  *   **Teodor's Prediction:** Survives (in principle). If the rule was grasped, the correctness condition exists even if no one is there to enforce it. The robot is alone, but not necessarily wrong, provided it follows the rule it was given.

  **Crux 4: Direct vs. Indirect Contact**
  *   **Case:** *Mediated Anchoring.* A text-only system asks a human to point, look, or press. All contact with the world runs through another agent who already has grounding.
  *   **Question:** Does borrowing someone's loop ground you, or does it just make you a very polite passenger?
  *   **Bruna's Prediction:** Passenger. The system does not feel the resistance of the button. It only processes the report of the resistance. It is one step removed from the causal kick.
  *   **Teodor's Prediction:** Grounded. The system is participating in a joint activity. It is answerable to the human partner. The loop is shared, not owned.

  **Crux 5: Retroactive Meaning**
  *   **Case:** *Deferred Grounding.* The Orphan Corpus system is adopted years later by a community who revive the language to argue about their greenhouse.
  *   **Question:** Does the vocabulary become grounded retroactively? Does that change what it was doing before?
  *   **Bruna's Prediction:** No change to the past. The system was ungrounded then. It is grounded now. Meaning does not travel backward in time.
  *   **Teodor's Prediction:** Retroactive validity. Meaning is use. If the use is successfully revived, the earlier instances are validated as part of the same practice. The gap was a dormancy, not a death.

  **IV. SEMANTIC NOTE**

  We acknowledge that part of our disagreement is terminological. Bruna reserves the word "grounded" for causal contact with physical objects. Teodor reserves the word "grounded" for normative incorporation into a social practice.

  We agree that if we simply swap definitions, the document holds. However, we disagree on which constraint is fundamental. Bruna believes social norms ultimately rest on physical consequences. Teodor believes physical consequences only matter because a community agrees they matter. We leave this unresolved.

  **Signed,**

  Bruna
  Teodor
