prompt: |-
  Right, I'm running an upper-level philosophy of decision theory seminar — about 14 postgrads, 90 minutes, one session. I want them to actually feel why the independence axiom collapses in Allais-type cases, but not through the usual risk-aversion story. Instead I want to inject a weirder framing: that people reject cancelling the shared component because it feels like retroactively editing the narrative they've already committed to — call it narrative-continuity resistance. Can you design an in-class game or structured role-play that makes them run into that? The rules or physical actions should make them experience the cancellation themselves (tearing cards, locking envelopes, whatever) so they hit the reversal before anyone names Allais.

  Please structure your answer exactly like this:

  1. Setup and materials (about 120 words): room layout, what’s on the table, group split, anything they need.
  2. Rules, roles and token payoffs (about 220 words): round-by-round choices, the physical actions, the token economy with small stakes only (coffee vouchers or course credit points), no computers.
  3. The moment they feel it (about 180 words): map the precise moments in the activity onto narrative-continuity resistance — where the shared component becomes part of their story and tearing it out feels wrong.
  4. Debrief (about 200 words): how you name the axiom, connect to Allais, and discuss the narrative twist without just lecturing.
  5. What will definatly go wrong first time (about 120 words): predictable failures, how to handle them, what to say if they just shrug.
  6. The feature this can’t reproduce (about 100 words): be honest about which aspect of real preference reversal the game misses and you have to supply verbally.

  Make sure they discover the preference reversal themselves — no lecture up front, and they shouldn’t hear the name Allais until the debrief. British spelling, casual tone is fine, and the room accomodation is a bit awkward so keep materials portable.
