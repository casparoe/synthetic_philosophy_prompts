  1. Setup and materials (about 120 words)
  Arrange seven pairs of desks. Each pair gets a 'Decision Kit': two opaque envelopes (A and B), a deck of 20 numbered cards (1–20), commitment slips, and 50 coffee vouchers. You act as 'Banker'. Include scissors. Students sit in pairs; you roam. No screens. Envelopes represent 'future states'; cards represent 'chance'. They must handle probability physically. The layout forces interaction with materials, making abstraction tactile. Keep kits light for awkward spaces. Space for cutting is needed. Tactile engagement grounds the theoretical problem. Vouchers should be redeemable immediately. Physical constraints drive the experience. No phones for calculation. Observe the cutting closely.

  2. Rules, roles and token payoffs (about 220 words)
  Round One: Students pick a Contract slip. Option 1 guarantees 5 vouchers. Option 2 requires drawing a card; 1–10 wins 10 vouchers, 11–20 wins nothing. They sign and seal their choice in Envelope A. Do not draw yet. This signature locks their narrative identity. Round Two: Announce a 'Administrative Override'. Cards 11–20 are declared void for everyone. Hand them scissors. They must physically cut the 11–20 cards from their deck, destroying that possibility space. This destruction is irreversible. Now, they choose again between Option 1 (now 5 vouchers on 1–10, nothing on 11–20) and Option 2 (10 vouchers on 1–10, nothing on 11–20). Most will switch preferences here, favouring the higher gain now safety is assured. They seal this new choice in Envelope B. Finally, draw one card per pair to redeem vouchers. The stakes are real: 1 voucher = a coffee. The physical act of cutting the cards is mandatory before the second choice. If they refuse to cut, they forfeit Round Two. Ensure they know Round One choices are binding *unless* they explicitly switch in Round Two, but emphasize the 'voiding' changes the context. You must enforce the cut; hesitation is data. Clarify that only Envelope B counts for payment, but Envelope A remains sealed for comparison. This creates tension between consistency and profit. The token economy relies on trust; do not allow trading between pairs. Each pair acts as a single agent to reduce noise. If a pair disagrees, they must consensus before cutting. This social pressure amplifies the narrative commitment.

  3. The moment they feel it (about 180 words)
  The friction hits when you hand them the scissors. In Round One, the 11–20 cards were part of the story—they were the 'danger zone' they avoided by picking the Guarantee. Now, you're asking them to pretend that danger never existed. Cutting the cards feels like falsifying history. They've already committed to a narrative where avoiding 11–20 was wise. Suddenly, you're asking them to evaluate the options as if 11–20 was never on the table. For many, keeping the Guarantee feels silly once the risk is physically removed, but switching feels like admitting their first story was wrong. They hesitate over the cut deck. The shared component (the 11–20 block) wasn't just math; it was the plot twist they bought into. Removing it doesn't feel like simplification; it feels like breaking continuity. You'll see hands hovering over the cut cards, unwilling to treat the remaining 1–10 as a fresh start. Removing it leaves the protagonist (them) looking cowardly for having chosen safety. This cognitive dissonance manifests physically as reluctance to seal Envelope B.

  4. Debrief (about 200 words)
  Gather everyone. Ask who switched choices between envelopes. Reveal the pattern: most picked Safety first, Risk second. Write the structure on the board. Introduce the 'Independence Axiom': if you prefer X over Y, you should still prefer X over Y even if both are paired with a common chance Z. Explain that mathematically, cutting the 11–20 cards should change nothing about the relative value of 1–10. But it did. Now pivot to the narrative framing. Suggest that rational choice isn't just about outcomes; it's about maintaining a coherent story. The first choice was 'I am a person who avoids ruin'. The second choice, after editing the ruin out, forces them to become 'I am a person who maximises gain'. That identity shift costs something. The axiom fails because it treats probabilities as abstract numbers, not plot points. Invite them to argue whether this 'narrative cost' is a bias or a legitimate constraint on rationality. Don't solve it; let the tension sit. Ask them directly.

  5. What will definatly go wrong first time (about 120 words)
  Students might treat the cut cards as a 'new game' and switch without feeling the tension, missing the point. Or they'll refuse to cut, thinking it's a trick. If they shrug, ask: 'Did cutting the cards feel like removing risk, or like lying about the past?' Cutting 14 decks takes longer than expected. Someone will ask if they can keep both vouchers. Say no; the trade-off is the point. If nobody switches, the experiment fails. Emphasise in Round Two that the 'voiding' makes the Safe option look pathetic compared to the Risk option, nudging the switch.

  6. The feature this can't reproduce (about 100 words)
  This setup misses the 'common ratio' effect where probabilities scale down. We only model the 'common consequence' version (zeroing out a block). Money stakes often dampen the effect; coffee vouchers might be too trivial to trigger narrative resistance. You'll need to verbally supply the gravity of 'life-changing money' to explain why narrative stakes matter more. The game proves the reversal, but not the intensity of psychological cost in high-stakes reality. It isolates the editing feeling but loses probabilistic subtlety.
