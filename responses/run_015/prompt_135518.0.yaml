      *   **2. Rules, roles and token payoffs:**
          *   Need two rounds mirroring Allais (Common Consequence vs. Common Ratio equivalent but framed narratively).
          *   Round 1: Choose between Safe (1-20 win) vs Risky (1-17 win, 18-20 lose). Actually, Allais is usually:
              *   1A: 100% chance of X.
              *   1B: 89% X, 10% Y, 1% 0.
              *   2A: 11% X, 89% 0.
              *   2B: 10% Y, 90% 0.
          *   Let's simplify for physical play.
          *   Round 1 (The Promise): Choose Envelope A (Guaranteed 5 vouchers) or Envelope B (Draw card 1-10 = 10 vouchers, 11-20 = 0).
          *   Round 2 (The Edit): You tell them 11-20 is now 'void' for everyone. They must choose again between A (now 1-10 = 5 vouchers, 11-20 = 0) vs B (now 1-10 = 10 vouchers, 11-20 = 0).
