      *   **4. Debrief:**
          *   Name the axiom (Independence). Connect to Allais. Discuss narrative twist.
          *   Word count check: Aim for ~200.
          *   Drafting: Gather everyone. Ask who switched choices between envelopes. Reveal the pattern: most picked Safety first, Risk second. Write the structure on the board. Introduce the 'Independence Axiom': if you prefer X over Y, you should still prefer X over Y even if both are paired with a common chance Z. Explain that mathematically, cutting the 11–20 cards should change nothing about the relative value of 1–10. But it did. Now pivot to the narrative framing. Suggest that rational choice isn't just about outcomes; it's about maintaining a coherent story. The first choice was 'I am a person who avoids ruin'. The second choice, after editing the ruin out, forces them to become 'I am a person who maximises gain'. That identity shift costs something. The axiom fails because it treats probabilities as abstract numbers, not plot points. Invite them to argue whether this 'narrative cost' is a bias or a legitimate constraint on rationality. Don't solve it; let the tension sit.

      *   **5. What will definitely go wrong first time:**
          *   Predictable failures. Handling shrugs.
          *   Word count check: Aim for ~120.
          *   Drafting: Students might treat the cut cards as a 'new game' and switch without feeling the tension, missing the point. Or they'll refuse to cut, thinking it's a trick. If they shrug, ask: 'Did cutting the cards feel like removing risk, or like lying about the past?' Another issue: timekeeping. Cutting 14 decks takes longer than you think. Pre-cut half the decks if you're worried. Also, someone will ask if they can keep both vouchers. Say no firmly; the trade-off is the point. If nobody switches, the experiment fails. To prevent this, emphasise in Round Two that the 'voiding' makes the Safe option look pathetic compared to the Risk option, nudging the switch without commanding it.

      *   **6. The feature this can't reproduce:**
          *   Limitations.
          *   Word count check: ~100.
