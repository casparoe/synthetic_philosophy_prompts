answer: |-
  Here is the ranking of conceptual lines for a three-year workshop, ordered by strategic value. The ordering relies on three criteria: **Dependency** (which question must be answered to make sense of the others), **Tractability** (can progress be made with logic and intuition pumps alone), and **Leverage** (does solving this dissolve other stalemates).

  ### 1. The Normative Logic of Epistemic Duplication (Priority: High)
  **The Question:** When an agent is copied, how does prior credence distribute across the resulting branches? Is credence conserved, split, or duplicated?

  **Reasoning for Top Rank:**
  *   **Dependency:** This is the upstream bottleneck. The Sleeping Beauty problem conflates temporal uncertainty (what day is it?) with self-locating uncertainty (which waking is this?). Epistemic duplication strips away time. If you cannot establish a normative rule for how credence behaves in a synchronous copying case, you cannot solve the asynchronous Sleeping Beauty case. You are trying to solve a dynamic problem without a static baseline.
  *   **Tractability:** High. This domain is pure conceptual engineering. It relies on intuition pumps (teleportation, branching worlds) that do not require empirical data. The variables are controlled: memory streams are stipulated, physical continuity is bracketed. Philosophers can make progress here without waiting on external fields.
  *   **Leverage:** Solving this forces a resolution on the Halfer/Thirder debate. If the rule for duplication is "credence splits proportionally to branches," Thirdism follows. If the rule is "credence tracks causal continuity," Halferism follows. Establishing the rule renders the SB debate a mere application exercise.

  ### 2. Decision-Theoretic Operationalization (Priority: Medium)
  **The Question:** Do different credence assignments in duplication scenarios lead to divergent betting behaviors or utility maximization strategies?

  **Reasoning for Second Rank:**
  *   **Dependency:** This is downstream of Line 1. You cannot determine the rational bet until you determine the rational credence *and* the utility function over copies (e.g., do I care about my copy's payoff?). However, it acts as a necessary validation check. If Line 1 produces a credence rule that yields no difference in betting behavior compared to its rival, Line 1 is merely verbal.
  *   **Tractability:** Medium. The logic is accessible, but it容易 gets bogged down in defining the "agent" for utility purposes. Is the unit of maximization the pre-copy agent, the post-copy agent, or the sum of both? This requires precise normative stipulations that are often contested independently of self-location.
  *   **Leverage:** High negative leverage. If it is proven that Halfers and Thirders must bet identically in all duplication scenarios (given a fixed utility function), the entire credence debate collapses into a dispute over labeling. This saves the field from wasting decades on a non-substantive distinction.

  ### 3. Centered-Worlds vs. Centered-Propositions Semantics (Priority: Low)
  **The Question:** What is the correct semantic framework for representing self-locating content?

  **Reasoning for Third Rank:**
  *   **Dependency:** This is foundational but not generative. We already have the formal tools to model both positions. The stalemate isn't caused by a lack of semantic precision; it's caused by disagreement on which norms apply to those semantics. Refining the language does not force a choice on the norms.
  *   **Tractability:** Low yield. This is well-trodden ground. The formalism is stable; the disagreement is interpretive. Spending three years here risks polishing the lens while the image remains out of focus.
  *   **Leverage:** Low. Switching from centered worlds to centered propositions (or vice versa) does not inherently validate Halferism or Thirdism. Both frameworks can be rigged to support either position. It is a tool, not a solution.

  ---

  ### Evidence That Would Flip This Ordering

  Since this is conceptual work, "evidence" refers to formal proofs or decisive argumentative breakthroughs, not empirical data.

  **1. A "Dutch Book" Proof Independent of Credence (Flips 2 above 1)**
  If a researcher demonstrates a Dutch Book argument that works against an agent *regardless* of their credence assignment, provided only that they act to maximize utility across copies, then Decision Theory (Line 2) becomes upstream. It would imply that the normative constraint comes from the betting structure itself, not from the internal credence distribution. If the bets dictate the credence, Line 2 dictates Line 1.

  **2. A Formal Impossibility Theorem for Branching Credence (Flips 3 above 1)**
  If it is proven that standard probability axioms cannot coherently handle branching identity without contradiction within *any* centered framework, then Semantics (Line 3) becomes the bottleneck. It would mean we cannot even formulate Line 1 without first inventing a new semantic logic. This would force the workshop to pivot to foundational logic before tackling norms.

  **3. A Reduction of Duplication to Standard Conditionalization (Collapses 1)**
  If a proof emerges showing that epistemic duplication is logically isomorphic to standard evidence updating (conditionalization) under a specific description, Line 1 becomes trivial. It would mean there is no "new" logic of duplication, only a misapplication of Bayes. This would de-prioritize Line 1 immediately, shifting focus to why the misapplication persists (likely Line 3 or psychological factors).

  ### Summary Defense
  Prioritize **Line 1 (Duplication Logic)** because it isolates the variable causing the confusion. Sleeping Beauty is a messy instance of a cleaner problem. Solve the clean problem, and the messy one dissolves.
  Prioritize **Line 2 (Decision Theory)** second because it is the truth-test. If the credence doesn't cash out, it's not a belief, it's a decoration.
  Deprioritize **Line 3 (Semantics)** because we have enough language to state the problem; we lack the norms to solve it.

  Invest your three years in the norms of branching, not the grammar of centers.
