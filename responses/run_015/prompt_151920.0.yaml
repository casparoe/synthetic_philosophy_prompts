answer: |-
  **The Joke**

  Alice, a strict Van Fraassenian, is pulling an all-nighter to finish a paper on diachronic coherence. She knows from painful experience that by 4:00 AM, the combination of exhaustion and three espressos will induce a state of "Caffeinated Certainty," where her credence in any proposition she's currently working on inflates to 0.99, regardless of evidence.

  At midnight ($t_0$), her credence in the proposition *P* ("My argument holds water") is a modest 0.6. However, she knows that at 4:00 AM ($t_1$), her future credence $C_1(P)$ will be 0.99.

  A Dutch Bookie slides into her office. "Alice," he says, "I see you're a Reflection Principle adherent. That means your current conditional credence $C_0(P | C_1(P) = 0.99)$ must equal 0.99. If it doesn't, I can construct a series of bets that guarantees you a loss."

  Alice sighs. "I know. If I don't align my current betting odds with my future delirium, I'm diachronically incoherent."

  "Exactly," says the Bookie. "So, I'll sell you a bet now that pays out if *P* is true, priced at your current 0.6. But then, at 4:00 AM, I'll buy it back from you at your new 0.99 price. Since you know you'll be overconfident then, but you're refusing to be overconfident *now* conditional on that future state, I'll pump you for cash in the interim."

  Alice rubs her temples. "So, to avoid the Dutch Book, I must update my current credence to 0.99 *now*, effectively preempting the caffeine psychosis?"

  "Rationality demands it," the Bookie smiles. "You must treat your future, sleep-deprived self as an epistemic expert."

  Alice signs the betting slip. "Fine. I'll lock in the prior to match my future insanity. I am now 99% sure my argument is genius."

  At 4:00 AM, delirious and shaking, Alice looks at her paper. It's nonsense. She loses the bet on reality. But she checks her ledger and sees she avoided the Dutch Book.

  She turns to the Bookie. "I saved myself from a guaranteed loss in betting coherence, only to guarantee a loss in truth."

  "Congratulations," says the Bookie. "You've achieved diachronic rationality at the cost of synchronic sanity. It's not a Dutch Book; it's a Suicide Pact."

  ***

  **The Stance**

  **Is she rational to lock in the prior?**
  **No.** Alice is irrational to lock in the prior. While adhering to the Reflection Principle protects her from a *diachronic* Dutch Book (exploitation across time), it forces her to violate *synchronic* rationality (aligning credence with actual evidence) at $t_0$. By treating a predictably compromised future self as an expert, she imports future error into her present state. Rationality requires maximizing accuracy, not just avoiding betting inconsistencies. If you know your future self will be drunk, you shouldn't precommit to their bar tab.

  ***

  **The Meta-Note: Departing from Van Fraassen**

  **Where this bends the setup:**
  Van Fraassen's original formulation of the Reflection Principle (in *Laws and Symmetry*, 1989) assumes a relationship of **epistemic trust** between time-slices. He envisions the future self as someone who has *learned* something (via conditionalization or memory) that the current self hasn't yet processed. The principle relies on the idea that your future credences are a sufficient statistic for the evidence you will have received.

  **Does it break the argument?**
  It stretches it to the breaking point, highlighting a known vulnerability in the principle. Van Fraassen acknowledged that Reflection fails if the agent believes their future self is *irrational* or has forgotten evidence (the "Forgotten Evidence" objection). By introducing a known physiological corruptor (sleep deprivation/caffeine), we move from a case of *learning* to a case of *corruption*.

  Most contemporary Bayesians (e.g., David Christensen, Frank Arntzenius) argue that Reflection should be restricted to cases where the agent has no reason to doubt the rationality of their future updating process. In Alice's case, the argument doesn't just stretch; it snaps. The Dutch Book argument for Reflection relies on the assumption that the future credence is a valid proxy for evidence. When the future credence is known to be noise, satisfying Reflection doesn't preserve rationality; it merely systematizes the error. The "Suicide Pact" punchline holds because diachronic coherence is instrumentally valuable only if the trajectory is aimed at truth. If the trajectory is aimed at a wall, coherence just ensures you hit it efficiently.
