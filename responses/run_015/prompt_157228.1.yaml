  2. "Generation" functions as a proxy for material interests like homeownership and pension security rather than performing independent causal-explanatory work. This claim assumes wealth controls would dissolve the age gradient, which is plausible but not definitively proven by the exit polls alone.
  3. The identification problem renders the cohort hypothesis unfalsifiable from single-election data, which significantly hurts the realist argument by making the claim immune to empirical refutation. This statistical indeterminacy means the evidence cited for generational kinds is logically compatible with pure age effects.
  4. The strongest objection is that specific historical shocks create enduring imprint effects which longitudinal data can separate from simple aging. The looping worry does more damage than the boundary worry because it transforms the kind from a discovered entity into a reactive target, undermining the homeostatic-cluster realism.
  5. Generations are practical/looping kinds that gain causal power only after public labeling creates shared self-understanding among the cohort. I would change my mind if longitudinal analysis showed divergent political trajectories between cohorts that persisted even after controlling for age and period effects.
