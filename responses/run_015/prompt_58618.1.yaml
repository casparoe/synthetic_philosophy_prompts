  **TO:** All Members of the Mill Housing Cooperative
  **FROM:** [Your Name], Repairs & Services Committee
  **DATE:** 24 October 2023
  **SUBJECT:** Proposal for Cockroach Control – Recommendation for Vote

  **The Problem**
  As we all know, the German cockroach infestation in the ground-floor flats and bin room has persisted despite our efforts. This is not just a nuisance; it is a hygiene issue. While cockroaches in our building have not been linked to serious disease outbreaks, they can cause stomach upsets and significant distress. We have a duty to manage this effectively.

  The contractor has presented two workable plans at the same annual cost. After reviewing both, I am recommending we adopt **Plan B (Targeted Baits and Proofing)**. This paper explains why, outlines the first three months of work, and invites us to vote on this approach next month.

  **The Two Options**
  *   **Plan A (Whole-Building Spray):** A heavy residual spray every three months across the whole building, including pipe runs and the bin room. It kills on contact and stays poisonous for weeks.
  *   **Plan B (Targeted Control):** Gel baits placed in sealed cracks, sealing entry points (proofing), weekly trap monitoring, and support for residents to improve food storage and reduce clutter. Sprays are used only in specific flats if numbers remain high after two months.

  **Why I Recommend Plan B**
  We all want the cockroaches gone. The question is how far we should go to get them. Plan A is a "sledgehammer" approach. Plan B is more like "surgery." I believe Plan B strikes the right balance between protecting our health and respecting the wider environment.

  Here is the reasoning in plain terms:

  1.  **Proportionality:** We are killing thousands of insects to prevent stomach upsets and distress, not a life-threatening plague. Plan A kills vastly more insects overall, including spiders and other harmless creatures that happen to cross a treated surface. Plan B targets only the pests we actually need to remove.
  2.  **Beyond Our Walls:** The residual spray from Plan A washes into our courtyard drains. This poisons insects outside our building that have never bothered us and do not live in our homes. Plan B keeps the poison contained inside the walls where the infestation is.
  3.  **Suffering and Death:** No method is perfect. Plan A kills quickly but indiscriminately. Plan B uses sticky traps where some insects may struggle for a day, and baits that take time to work. However, because Plan B kills far fewer non-target insects and prevents the infestation from growing in the first place, the total amount of suffering and death caused is lower.
  4.  **Community Responsibility:** Plan B asks more of residents, specifically regarding clutter and food storage. I know this is harder for our elderly neighbours and families with small children. Under Plan B, the Committee will organise a volunteer "buddy system" to help move heavy items or clear cupboards for those who need it. We share the building, so we should share the work.

  **The Strongest Case for Plan A**
  The best argument for the spray plan (Plan A) is certainty and speed. It would almost certainly reduce the visible numbers faster than Plan B. For neighbours who are currently very distressed by seeing cockroaches, the promise of a quick, aggressive solution is very appealing. It also removes the burden from residents to change their habits or allow monitoring traps in their homes.

  **Why Plan A Does Not Win Out**
  While speed is important, the collateral damage of Plan A is too high. We would be accepting significant environmental harm (runoff into the courtyard) and the killing of harmless wildlife to solve a problem that can be managed more precisely. In a cooperative, we should aim for the solution that protects the community's health without unnecessarily harming the environment around us. Plan A treats the symptoms; Plan B treats the cause.

  **The Action Plan (First Three Months)**
  If we vote for Plan B, this is what will happen immediately:

  *   **Month 1:** The contractor will seal cracks around pipes and doors (proofing). Gel baits will be placed in the bin room and ground-floor communal areas. Committee volunteers will contact ground-floor residents to arrange help with clutter clearance and food storage advice.
  *   **Month 2:** Weekly monitoring of traps begins. We will track exactly where activity is happening. No sprays will be used yet.
  *   **Month 3:** We review the trap data. If any specific flat still shows high numbers, we will authorise spot-spraying *only* in that flat.

  **Review**
  We will review the success of this programme in **six months**. If the infestation has not reduced by at least 80% by then, we will reconsider Plan A.

  **Conclusion**
  I ask you to support Plan B. It protects our health, respects our shared outdoor space, and treats the infestation with precision rather than poison. It asks a bit more of us as neighbours, but that is what a cooperative is for.

  Please read this before our meeting on [Date of Vote]. I am happy to discuss any of these points beforehand.

  [Your Name]
  Committee Member
