      *   "No university background... plain language." -> Checked.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* soft on the cockroaches. They are pests. We *are* killing them in Plan B, just more surgically.

      *(Word Count Check)*: A standard A4 page single-spaced is about 500 words. Two pages is roughly 1000 words. I will aim for that.

