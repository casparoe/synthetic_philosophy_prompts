      *   "Resident burden?" -> "We will set up a buddy system for those who need help moving clutter."

  8.  **Final Polish:** Check word count and formatting. Ensure the distinction between the "quick death" of spray vs "slow death/traps" is handled fairly. (Actually, residual spray kills on contact but stays active. Gel bait is ingested. Sticky traps catch them. The prompt says Plan B leaves traps out where insects suffer. I must acknowledge this trade-off).

      *Correction:* The prompt says Plan B leaves sticky traps out where insects remain alive for a day. Plan A kills on contact. This is a pro-Plan A point regarding insect suffering. I need to address this. *Argument:* Plan A kills *many more* insects (including non-targets). Plan B kills fewer overall, even if the method isn't perfect. The reduction in total numbers killed outweighs the method of death for the few caught in traps.

