  I have noticed a recurring argumentative pattern in debates about vague but high-stakes predicates—things like personhood, consciousness, adulthood, or death—that I do not have a name for, and I want to know whether it is established or whether it needs one. The pattern works like this. Someone points out that the predicate applies clearly at one end of a spectrum and clearly fails at the other, with an imperceptible gradation in between—the classic sorites setup. Rather than using this to deny that there is a sharp fact of the matter, or to embrace a degree-theoretic account, the interlocutor treats the very existence of the continuum as a practical reason to legislate a sharp boundary at a specific point, say eighteen years or brain-death criteria. They defend that point not by claiming it tracks an invisible metaphysical joint, but by saying that because nature offers no line, human institutions must supply one to prevent chaos. So far this sounds like conventionalism or practical precisification. But here is the twist: once the boundary is fixed, they defend it asymmetrically. If you try to nudge the boundary downward—lowering the age of adulthood, for instance—they invoke the slippery slope: if we move it to seventeen, why not sixteen? They treat the continuum as dangerous erosion. But if you try to nudge it upward—raising it to nineteen—they invoke continuity and practical harm: that would disrupt lives and contracts; the line has to stay where functional stability demands. In other words, they use the sorites continuum to justify the boundary's existence, but they use non-sorites reasoning—practical stability or slope-sensitive fear—to defend its location, and they switch which consideration dominates depending on the direction of proposed change. I have seen this in bioethics panels arguing about the beginning of moral status, in legal philosophy about competency, and in medical ethics about defining death. Is there an established term for this specific combination—using acknowledged vagueness to mandate a cutoff, then defending the cutoff's location by selectively invoking either slope-sensitivity or institutional inertia? If it overlaps with existing ideas—say, epistemicist precisification, practical conventionalism, or a boundary-defending rhetorical strategy—explain exactly how it differs and which concept comes closest. If there is no precise label, propose one with a clear definition and specify its boundary conditions: when does it collapse into ordinary conventionalism, and when does it become something else, like pure interest-driven rhetoric?
