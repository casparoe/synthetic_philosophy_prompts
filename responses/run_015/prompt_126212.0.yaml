answer: |-
  This is a remarkably sharp observation of a dialectical move that is pervasive in applied ethics, jurisprudence, and public policy, yet rarely isolated as a distinct logical or rhetorical structure in the core philosophy of language literature. You have identified a specific *pragmatic deployment* of vagueness that differs from standard semantic theories.

  After mentally scanning the relevant literature—Williamson on epistemicism, Fine and Keefe on supervaluationism, Raffman on contextualism, Schauer on legal formalism, and Walton on slippery slopes—I can confirm: **there is no single, established technical term for this specific asymmetric defensive pattern.**

  It is not *Epistemicism* (which claims the boundary is metaphysically sharp but unknown). It is not *Supervaluationism* (which deals with truth-value gaps across precisifications, not legislative fixation). It is a species of *Conventionalism*, but standard conventionalism typically admits the arbitrariness of the specific coordinate (e.g., "18 is as good as 19"). Your pattern describes a view that admits the *ontological* arbitrariness but denies the *pragmatic* arbitrariness of the location, using two different logics to guard the flanks.

  Below, I map this phenomenon against existing concepts, explain why they fall short, and propose a precise label with boundary conditions.

  ### 1. Mapping the Phenomenon Against Existing Literature

  To ensure we do not conflate this with nearby concepts, we must distinguish it from the standard solutions to the Sorites paradox.

  *   **Epistemicism (Williamson):** Epistemicists argue there *is* a sharp fact of the matter (e.g., a specific nanosecond where childhood ends), we just cannot know it. Your pattern explicitly denies this ("nature offers no line").
  *   **Supervaluationism (Fine):** This holds that a statement is true if it is true on all *admissible precisifications*. While this allows for a "truth" without a sharp boundary, it does not mandate a *single* legislative cutoff for institutional use, nor does it explain the asymmetric defense of that cutoff.
  *   **Contextualism (Raffman, Soames):** This suggests the boundary shifts depending on the context of utterance. Your pattern describes an attempt to *freeze* the context via legislation and resist shifting.
  *   **Standard Conventionalism / Stipulation:** This is the closest parent concept. It holds that we draw lines for utility. However, a pure conventionalist admits that if we drew the line at 17 or 19, it would be equally valid. Your pattern claims 18 is *uniquely* defensible against movement, but for different reasons depending on the direction.
  *   **Legal Formalism (Schauer):** Frederick Schauer argues for "bright-line rules" over "standards" to reduce decision costs and increase predictability. This captures the *motivation* for the line (stability). However, Schauer's formalism generally acknowledges "over-inclusiveness" and "under-inclusiveness" as the cost of doing business. It does not typically employ a *slippery slope* argument to defend the specific coordinate against expansion; it usually admits the line is somewhat arbitrary but insists on *adherence* to the rule.

  ### 2. The Missing Concept: Asymmetric Precification

  The pattern you describe involves a **category switch** in the justification.
  1.  **Justification for Existence:** *Semantic/Vague.* (Nature is continuous, so we must stipulate.)
  2.  **Defense of Location (Direction A):** *Logical/Sorites.* (If we move here, the concept dissolves.)
  3.  **Defense of Location (Direction B):** *Pragmatic/Consequentialist.* (If we move here, the system breaks.)

  This creates a "conceptual ratchet." The boundary is treated as ontologically soft but pragmatically rigid.

  #### Proposed Term: **Asymmetric Precification**
  *(Alternative descriptive label: **The Sorites-Stability Lock**)*

  **Definition:** A dialectical strategy wherein a vague predicate is operationally precisified for institutional purposes, and the specific coordinate of that precisification is defended against revision using two distinct, direction-dependent rationales: **Sorites-risk** (conceptual erosion) in one direction, and **Coordination-cost** (institutional disruption) in the other.

  ### 3. Analysis of the Mechanism

  Why does this strategy emerge? It is a response to the **Second-Order Vagueness** problem. Even if we agree we need a line, *where* the line goes is itself vague (is the cutoff 18 years, 18 years + 1 day, etc.?).

  *   **The "Downward" Defense (Slippery Slope):** When asked to expand the predicate (e.g., lower the age of adulthood), the interlocutor invokes the *logical* danger of the Sorites series. "If 17 counts, why not 16?" This treats the predicate as if it has a *conceptual core* that must be protected from dilution, despite earlier admitting the concept is vague.
  *   **The "Upward" Defense (Inertia/Reliance):** When asked to restrict the predicate (e.g., raise the age), the interlocutor invokes *reliance interests*. "Contracts were signed at 18." This treats the predicate as a *fixed social fact*, despite earlier admitting it is a stipulation.

  This is intellectually potent because it allows the defender to claim the moral high ground of "protecting the concept" (against expansion) while claiming the pragmatic high ground of "protecting society" (against restriction).

  ### 4. Boundary Conditions: When is it What?

  To use this term precisely, we must distinguish **Asymmetric Precification** from mere rhetoric or other philosophical stances.

  #### A. vs. Ordinary Conventionalism
  *   **Ordinary Conventionalism:** Admits the line is arbitrary. "We chose 18, but 19 would have worked fine. Let's vote."
  *   **Asymmetric Precification:** Claims the line is *non-arbitrary in practice*. "We chose 18. Moving to 19 breaks contracts; moving to 17 destroys the concept of maturity."
  *   **Boundary Condition:** If the interlocutor admits the location could be changed with sufficient political will without conceptual loss, it is Conventionalism. If they claim the location is *uniquely* resistant to change due to asymmetric threats, it is Asymmetric Precification.

  #### B. vs. Pure Interest-Driven Rhetoric
  *   **Pure Rhetoric:** Uses whatever argument works without consistency. "Don't lower the age because kids are immature! Don't raise the age because we need soldiers!" (Contradictory premises).
  *   **Asymmetric Precification:** Maintains a consistent meta-ethic: *Vagueness requires a line; Lines require stability.* The asymmetry is derived from the *nature of the change* (expansion vs. restriction), not just the desired outcome.
  *   **Boundary Condition:** If the justification relies solely on the *outcome* (e.g., "we want more voters") rather than the *structural impact* on the concept or the institution, it is rhetoric. If it appeals to the structural integrity of the classification system itself, it is Asymmetric Precification.

  #### C. vs. Epistemicism
  *   **Epistemicism:** "There is a fact of the matter at 18 years, 0 days, 0 seconds."
  *   **Asymmetric Precification:** "There is no fact of the matter, but we cannot move from 18."
  *   **Boundary Condition:** If the interlocutor claims the boundary tracks a hidden metaphysical reality, they are an Epistemicist. If they claim the boundary *creates* the reality for practical purposes but resists movement, they are practicing Asymmetric Precification.

  ### 5. Philosophical Evaluation: Is it Coherent?

  As a philosopher of language, I must note that this strategy is **pragmatically rational but semantically unstable.**

  1.  **The Rationality:** It functions as a **Schelling Point**. In a coordination game where agents need to agree on a cutoff but have no natural focal point, once a point is selected (18), it gains value simply by being selected. Moving away from it incurs coordination costs (the "Upward" defense). Simultaneously, because the predicate is vague, expanding it risks rendering the predicate useless (the "Downward" defense). Thus, the asymmetry reflects two real costs: *Coordination Costs* vs. *Classification Costs*.
  2.  **The Instability:** It relies on a tension. It treats the predicate as *vague* to justify the legislation (we need a line because nature didn't give us one) but treats it as *sharp* to defend the legislation (moving the line ruins the concept). This is a form of **conceptual equivocation**.

  ### Summary Recommendation

  If you wish to name this in your work, I recommend **"Asymmetric Precification."**

  *   **Definition:** The practice of defending a legislatively fixed boundary for a vague predicate by invoking *Sorites-risk* against expansion and *institutional-inertia* against restriction.
  *   **Key Feature:** It treats the boundary as ontologically arbitrary but pragmatically sacred.
  *   **Distinction:** Unlike standard conventionalism, it denies the interchangeability of nearby coordinates. Unlike epistemicism, it denies the metaphysical reality of the cutoff.

  This label allows you to critique the move not merely as "inconsistent," but as a specific, recognizable strategy for managing the tension between semantic vagueness and institutional necessity. It highlights that the interlocutor is not solving the Sorites paradox, but rather **weaponizing** it to lock in a status quo.
