answer: |-
  ### 1. The tree

  Start at the root: You have exactly one individual and someone is demanding one probability. Do not look for metaphysics; look at the file.

  **Node 1:** Is the only available reference class defined by the outcome you are predicting (e.g., "people who crash" rather than "pilots")?
  *   **Yes:** Stop. **Leaf 1:** There's no single-case probability at all, only rates in classes. You cannot use a class defined by the event itself to predict the event.
  *   **No:** Proceed to Node 2.

  **Node 2:** Does the individual have significant control over which class they end up in (e.g., compliance with meds, decision to retire)? *Case: 52-year-old pilot grounded after arrhythmia.*
  *   **Yes:** Stop. **Leaf 2:** There's a genuine single-case chance and the class is only evidence about it. Their agency breaks the static class model.
  *   **No:** Proceed to Node 3.

  **Node 3:** Do two admissible classes (e.g., legal protected class vs. available proxy) yield significantly different rates? *Case: Lender assessing clinic survival with postcode data restricted.*
  *   **Yes:** Proceed to Node 4.
  *   **No:** Proceed to Node 5.

  **Node 4:** Can you explicitly rank the cost of a false positive versus a false negative for this decision?
  *   **Yes:** Stop. **Leaf 3:** There is no question-independent right class, so pick it by what the number is going to be used for and what the two kinds of error cost.
  *   **No:** Stop. **Leaf 4:** Refuse one number, report the spread the admissible classes give you.

  **Node 5:** Is the case unique such that no subdivision changes the rate (e.g., specific tech stack, founder history)? *Case: Three-year-old startup surviving five years.*
  *   **Yes:** Stop. **Leaf 5:** Take the class that can't be subdivided in a way that changes the rate. Further granularity is noise.
  *   **No:** Proceed to Node 6.

  **Node 6:** Do you have reliable statistics for the narrowest specific class available? *Case: Claimant's chance of returning to work.*
  *   **Yes:** Stop. **Leaf 6:** Take the narrowest class you still have reliable statistics for. Specificity reduces variance without sacrificing reliability.
  *   **No:** Proceed to Node 7.

  **Node 7:** Is coherence with your other bets the only constraint you care about?
  *   **Yes:** Stop. **Leaf 7:** Any class is fine as long as you're coherent. You are building a subjective degree of belief, not measuring a frequency.
  *   **No:** Stop. **Leaf 8:** There's no single-case probability at all, only rates in classes. If you refuse subjective belief and lack data, you have no number.

  ### 2. The leaves

  **Leaf 1 (No single-case prob):** You must report population frequencies only, never individual risk. The awkward thing is that stakeholders will ignore you and write a number down anyway.
  **Leaf 2 (Genuine single-case):** You treat the probability as a physical propensity inherent to this specific person. The awkward thing is that you cannot validate this probability without infinite replays of the same life.
  **Leaf 3 (Use-case driven):** You select the reference class that minimizes expected loss for the specific decision. The awkward thing is that two analysts with different loss functions will produce different "truths."
  **Leaf 4 (Report spread):** You provide an interval representing the conflict between admissible classes. The awkward thing is that decision-makers hate intervals and will cherry-pick the bound that suits them.
  **Leaf 5 (Indivisible class):** You treat the current grouping as the fundamental unit of analysis. The awkward thing is that "unique" is often just a placeholder for "we haven't found the right subdivision yet."
  **Leaf 6 (Narrowest reliable):** You drill down until the sample size threatens stability, then stop. The awkward thing is that the cutoff for "reliable" is arbitrary and shifts with every dataset update.
  **Leaf 7 (Coherent any class):** You assign probability based on internal consistency rather than external frequency. The awkward thing is that you can be perfectly coherent and completely wrong about the world.
  **Leaf 8 (No data/Objective):** You declare the problem unsolvable under objective constraints. The awkward thing is that this is functionally identical to Leaf 1 but reached via ignorance rather than tautology.

  ### 3. Empty cells

  The combination of "Outcome-defined class" (Node 1 Yes) and "Coherent any class" (Node 7 Yes) is theoretically possible but practically empty. If an analyst believes a class defined by the outcome is valid, they are usually committed to a hard frequentist view that rejects subjective coherence as a sufficient criterion. Conversely, a subjectivist who cares only about coherence would rarely accept a tautological class as a valid input for belief updating. This cell remains empty because the epistemological commitments required to answer "Yes" at Node 1 generally preclude answering "Yes" at Node 7.

  ### 4. Where it breaks

  Node 2 (Control) is the weakest link. In the pilot case, "compliance" is a binary variable in the tree but a spectrum in reality. Analysts struggle to quantify how much agency breaks the reference class. Does taking meds 90% of the time move them to a different class? The tree forces a yes/no decision on a continuous variable, leading to inconsistent gating.

  Node 4 (Cost of Error) also fails in practice. Analysts are rarely given the cost function for false positives versus false negatives. They are told to "be accurate," not "minimize lender loss versus claimant hardship." When analysts guess the costs, the tree collapses into Leaf 7 (Subjective) anyway, because the "cost" is just another subjective prior. Finally, the tree handles "dynamic classes" poorly; if the class definition changes mid-assessment (e.g., new medical guidelines), the path taken becomes invalid, requiring a restart the tree doesn't accommodate.
