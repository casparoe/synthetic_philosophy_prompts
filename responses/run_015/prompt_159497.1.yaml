      *   **Context:** A grad reading group on signaling (philosophy + biology).
      *   **Task:** The user has constructed a *reductio ad absurdum* against the Handicap Principle (Zahavi's theory).
      *   **The Argument:**
          1.  Honesty requires cost (differential cost).
          2.  Only *differential* cost matters, not absolute cost (shift invariance).
          3.  Tiny differentials suffice for honesty (arbitrarily cheap signals).
          4.  "Recycling" (rebates from receiver) can reduce net cost to zero or negative while preserving the differential.
          5.  Conclusion: Absolute cost does no work; honesty can be cheap.
          6.  Final Claim: The Handicap Principle has no content/predictive power regarding extravagance/waste.
      *   **User's Stance:** They *don't* believe the conclusion (step 6). They think the theory *does* explain extravagance (peacocks, etc.). They want to find the flaw in the reasoning (steps 1-5) to save the predictive power of the theory.
