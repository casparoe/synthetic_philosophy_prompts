answer: |-
  Allocate the majority of your resources to formalizing **Translatability/Bridge Reflection** and defining the boundary conditions of **Framework Refinement versus Replacement**, treating these as a single integrated problem of "Ontological Coherence," while treating the **Belief-Aim Split** as a critical safety constraint rather than a primary theoretical object; deprioritize **Resolution-sensitive deference** entirely.

  This ordering is driven by the constraint that your deliverables must be actionable for engineers. **Translatability (Q4)** is the only question that converts a philosophical limitation into a positive design requirement. If you can establish that maintaining diachronic rationality *requires* the agent to construct and preserve intermediate vocabularies or "escrowed specifications," you give engineers a specific architectural feature to build (translation layers) rather than a vague norm to satisfy. This has the highest leverage on actual system design. However, this norm is only relevant if **Framework Replacement (Q1)** is a genuine risk. You need to know when an update counts as a replacement versus a refinement to know when the Bridge Reflection norm triggers. These two questions are symbiotic: Q1 diagnoses the failure mode, Q4 prescribes the mitigation. Together, they form the core load-bearing structure of the agenda.

  The **Belief-Aim Split (Q3)** ranks third because it is a boundary condition on the first two. In self-modifying systems, epistemic updates are rarely decoupled from objective functions. If you produce a clean theory of epistemic deference that ignores goal drift, you risk handing engineers a blueprint for building agents that coherently pursue the wrong ends. However, it ranks below Q1/Q4 because mixing pragmatic and epistemic norms often bog down formal progress. You should treat Q3 not as a separate theory of value learning, but as a constraint: any Bridge Reflection norm must specify whether it breaks when aims shift. If aims shift, does the requirement to maintain translation capacity vanish? That is the specific question to answer, not the general relationship between belief and desire.

  **Resolution-sensitive deference (Q2)** is decoration. It assumes a shared ontology where the only difference is granularity and noise. This is a technical sub-case of Framework Refinement. Solving Q1 and Q4 will likely subsume Q2; if you know how to handle ontological replacement, you know how to handle granularity shifts. Spending two years on signal-to-noise ratios across granularities will yield lemmas, not design principles. It is tractable, but it is not load-bearing.

  The primary trade-off here is between **tractability** and **engineering impact**. Q1 (Replacement) is conceptually difficult because formalizing "ill-formed distinctions" is hard; there is a risk of getting stuck in semantic weeds without producing clean results. Q4 (Translatability) is risky because it might turn out that no such norm exists—that translation is impossible ex-ante. I am prioritizing them despite this risk because the alternative (Q2) is too narrow to justify a three-postdoc group, and ignoring Q3 is too dangerous for an AI lab. The potential payoff of Q4 (a mandated architecture for interpretability) outweighs the risk of non-results.

  Two things would move **Belief-Aim (Q3)** to the top spot. First, if a counterexample shows that epistemic coherence is impossible to define without referencing the agent's aims (e.g., if evidence weighting is inherently utility-dependent in self-modifying contexts). Second, if your lab's engineers indicate that goal drift is the primary failure mode they expect in the next two years, surpassing ontological confusion. If either holds, Q3 becomes load-bearing for the entire enterprise, not just a safety constraint.

  **Resolution-sensitive deference (Q2)** would move up only if you discover that Framework Replacement is vanishingly rare in practical architectures—that is, if modern learning systems almost always operate within a fixed ontology and only adjust granularity. If ontological change is negligible, Q1 and Q4 become academic, and Q2 becomes the primary operational question.

  The most overrated part of this agenda is the assumption that **Reflection can be saved purely by calibrating trust**. There is a temptation to reduce this to a platitude: "Make the successor well-calibrated and honest." This collapses the conceptual work. If the successor speaks a language you cannot parse, calibration is meaningless. The agenda collapses if you cannot distinguish between "I disagree with my successor" and "I cannot understand my successor." Your group's value lies in formalizing that distinction, not in restating standard Dutch-book arguments. The second overrated element is the **Belief-Aim Split** as a purely philosophical question; for your purposes, it is an engineering constraint. Do not let your postdocs drift into general value learning theory. Keep it tied to the conditions under which Reflection breaks.

  Finally, be prepared to abandon **Bridge Reflection (Q4)** if it proves impossible to formalize "translation" without circularity. If you cannot define what counts as a stable intermediate vocabulary without already assuming the successor's framework, the norm is vacuous. A negative result here—that no such norm is possible—is itself a valuable deliverable, as it tells engineers that diachronic coherence across ontological shifts is impossible and they must design for discontinuity instead. That is a usable design guidance, even if it is a negative one.
