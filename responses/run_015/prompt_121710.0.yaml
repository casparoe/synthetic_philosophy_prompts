answer: |-
  You have identified a genuine gap in the ordinary taxonomy of moral faults. Your intuition is correct: standard definitions of hypocrisy are overwhelmingly retrospective (you *have* done the thing) or dispositional in a vague sense (you *are* the sort of person who does this). Your cases introduce a specific temporal and volitional structure: *the assertion of a norm coupled with a present intention to violate it.*

  Here is the carving you asked for.

  ### 1. Is it one thing?
  Yes. The neighbour, the scientist, and the councillor are all instances of a single structural defect. What unites them is not the psychological motivation (addiction, careerism, political expediency) but the **relationship between the speaker and the norm they are invoking.**

  To blame someone is to claim a certain authority. It implies: "This rule binds us, and I am speaking from within the commitment to that rule." When you blame, you are not merely describing a fault; you are enforcing a standard. If you intend to violate that standard yourself, you are effectively treating the rule as binding on the other person but optional for yourself *starting now*.

  This distinguishes your cases from the "reformed sinner" (your colleague who quit thirty years ago). The reformed sinner claims the rule binds us, and demonstrates that by adhering to it. The "counterfactual sinner" (the person who never had the chance) also claims the rule binds us, and has not violated it. Your cases involve a *present decision* to violate the rule, which actively contradicts the authority claim made during the blame.

  ### 2. The Variables
  You asked how the defect varies under certain conditions. Here is how the boundaries fall:

  *   **Likelihood of Transgression:** The defect scales with certainty. If your neighbour says, "Smoking is bad, and I am trying to quit, though I might fail," her standing to blame is diminished but not destroyed. She is acknowledging the rule binds her, even if she is weak. If she says, "Smoking is bad," while lighting a cigarette she intends to finish, the standing collapses. The defect requires a *settled intention* to violate, not merely a risk.
  *   **Self-Deception:** This is a hard boundary. If the speaker is self-deceived (e.g., "I will never smoke again," while subconsciously planning to), the defect changes category. It is no longer hypocrisy; it is tragedy or error. The "off" feeling you describe relies on *common knowledge*. If the room knows she will smoke, and she knows she will smoke, but she pretends otherwise, it is **Prospective Hypocrisy**. If she genuinely believes she won't, she retains her standing to blame, even if she is objectively wrong about her future. The moral fault shifts from *insincerity* to *ignorance*.
  *   **Severity of the Future Act:** The defect only attaches if the intended violation is of the *same norm* being enforced. If the councillor condemns tax avoidance but intends to commit murder, there is no specific defect in her *censure of tax avoidance* (though she is a monster). If she condemns tax avoidance and intends to avoid taxes, the censure is poisoned. Interestingly, if she intends to do something *worse* than what she condemns, the defect remains, but it is overshadowed by the greater evil. If she intends to do something *less bad* (e.g., condemns a major fraud, intends to commit a minor infraction), the defect remains because the principle of integrity is breached, even if the material harm is small.

  ### 3. Does it apply to other speech acts?
  No, it is peculiar to **blame** and **punishment**. This is crucial for your carving.

  *   **Warning:** If your neighbour says to her grandson, "Don't smoke; it's terrible. I know I'm weak and I'm going to have one now, but don't you do it," this is not defective. It is honest. She is not claiming authority; she is sharing experience.
  *   **Praising:** If she says, "Well done for not smoking," while intending to smoke, it is slightly odd, but less offensive than blame. Praise does not assert the same authority over the other.
  *   **Grading/Punishing:** This is where the defect is strongest. A teacher who fails a student for plagiarism while intending to plagiarize is not just hypocritical; the grade is *invalid*. The authority to judge is contingent on the judge's submission to the same rules.
  *   **Voting:** If a councillor votes to ban a scheme she intends to use, the vote is corrupt.

  The defect attaches specifically to acts that claim **normative authority** over another. Warning is advice; blame is a verdict. You cannot deliver a verdict from outside the law you are citing.

  ### 4. Persons vs. Bodies
  The phenomenon travels to institutions, but the mechanism changes slightly. Individuals have *intentions*; institutions have *policies* and *incentives*.

  *   **The University:** If a university expels a student for plagiarism while the hiring committee has a tacit agreement to ignore it in a star professor, this is **Institutional Prospective Hypocrisy**. The "intention" is located in the unwritten rules or the known culture of the administration.
  *   **The Government:** If a government condemns a weapons programme it is secretly developing, this is the same structure.

  The boundary here is **transparency of policy**. An institution is not hypocritical if it has one rule for students and a different,公开 (public) rule for staff. It becomes hypocritical when it asserts a universal rule ("Plagiarism is forbidden") while maintaining a hidden exception ("Unless you are a star"). The defect is the *gap between the avowed policy and the operational policy*.

  ### 5. The Name and Definition
  There is no single established term in common parlance that captures this precisely without dragging in the retrospective baggage of standard hypocrisy. Philosophers sometimes discuss this under "moral standing" or "normative authority," but those are descriptions of the *loss*, not the *fault*.

  For your reading group, I propose you adopt the term: **Prospective Hypocrisy**.

  **Definition:**
  *Prospective Hypocrisy is the act of censuring another for a violation of a norm while one currently intends to violate that same norm oneself.*

  **What this definition excludes:**
  1.  **Retrospective Hypocrisy:** Condemning a fault one has *already* committed (the standard case).
  2.  **Weakness of Will (Akrasia):** Condemning a fault one *fears* one might commit, but hopes to avoid. (Here, the commitment to the norm remains intact).
  3.  **Counterfactual Hypocrisy:** Condemning a fault one *would have* committed had circumstances differed. (Here, no intention to violate exists).
  4.  **Honest Warning:** Admitting one's own intended violation while advising another against it. (Here, the claim to authority is withdrawn).

  ### 6. Why the "Off" Feeling? (The Underlying Norm)
  You asked what the underlying norm must be for the boundaries to fall where they do. The norm is **Integrity of Commitment**.

  When we blame, we are not just saying "X is bad." We are saying "X is bad, and I am enforcing this because I accept it as binding."
  *   The **reformed smoker** accepts it as binding (evidenced by quitting).
  *   The **counterfactual smoker** accepts it as binding (evidenced by not smoking when the chance arose, or simply by not having chosen to violate it).
  *   The **prospective hypocrite** rejects it as binding for themselves *in the immediate future*.

  The "off" feeling is the detection of a **category error in authority**. The speaker is trying to stand *above* the rule to enforce it on another, while simultaneously standing *outside* the rule to exempt themselves. In the retrospective case, the sinner can claim redemption or regret. In the prospective case, the sinner claims no redemption; they claim a *right* to sin immediately after judging. That dissolves the community of shared norms that makes blame possible.

  ### Summary for your Group
  You can tell your friend the lay magistrate that the defect is not about *purity* (who has sinned), but about *jurisdiction* (who has the right to judge).
  *   **Past sin** does not remove jurisdiction if one has repented (reformed).
  *   **Hypothetical sin** does not remove jurisdiction if one has not chosen it (counterfactual).
  *   **Intended future sin** *does* remove jurisdiction, because it proves the judge does not accept the law they are citing.

  The label is **Prospective Hypocrisy**. It is one phenomenon, distinct from standard hypocrisy, and it invalidates the standing to blame, though not necessarily the truth of the blame itself.
