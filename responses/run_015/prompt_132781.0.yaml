prompt: |-
  I'm a journalist who covers science and ideas, and I'm somewhat out of my depth here — next Thursday I'm presenting at an interdisciplinery workshop on moral psychology, defending a reconstructed virtue ethics that absorbs the situationist critique instead of fighting it. My claim is that virtues aren't cross-situationally stable personality traits but context-sensitive regulatory patterns, and that this saves Aristotelian ethics from empirical falsification without reducing it to behaviorism. The audience is split: half are experimental social psycholgists who ran the classic obedience and bystander studies and think 'character' is mostly a folk error, and half are virtue ethicists who worry I'm just capitulating to situationism and stripping away normative force. I need a speaker-prep sheet for the Q&A: the objections they'll actually raise, ordered by likely damage, each phrased the way that side would put it, with a quick reply I can deliver in about two minutes and a note on where that reply is soft. Tell me what I should concede up front — probably that global trait predictions fail — and what I must hold onto for the view to survive. Include the question I'm dreading most, which is probably whether these 'regulatory patterns' are just descriptive clusters with no real prescriptive authority left. I'm writing this between deadlines with cold coffee, so if there's a typo or two just roll with it.
reasoning: |-
  Here's a thinking process that leads to the suggested speaker-prep sheet:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science/ideas, presenting at an interdisciplinary workshop on moral psychology.
      *   **Topic:** Defending a reconstructed virtue ethics that absorbs the situationist critique (virtues as context-sensitive regulatory patterns, not cross-situationally stable traits).
      *   **Audience:** Split 50/50 between Experimental Social Psychologists (situationists, skeptical of character) and Virtue Ethicists (worried about losing normative force).
      *   **Deliverable:** A speaker-prep sheet for Q&A.
      *   **Content Requirements:**
          *   Objections ordered by likely damage.
          *   Phrased in the voice of each side.
          *   2-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
          *   What to concede up front.
          *   What must be held onto.
          *   The "dreaded question" (prescriptive authority vs. descriptive clusters).
      *   **Tone:** Professional, strategic, empathetic to the user's stress (cold coffee, deadlines), acknowledging typos if any (though I should aim for clarity).

  2.  **Deconstruct the Philosophical/Psychological Landscape:**
      *   *Situationism (Psychologists):* Doris, Harman, Milgram, Zimbardo. Claim: Global character traits don't exist; behavior is determined by situational variables. "Character" is a fundamental attribution error.
      *   *Traditional Virtue Ethics (Philosophers):* Aristotelian. Claim: Virtues are stable dispositions (hexeis) that lead to eudaimonia. If traits aren't stable, virtue ethics collapses.
      *   *User's Position:* "Reconstructed Virtue Ethics." Virtues aren't global traits but *context-sensitive regulatory patterns*. This sounds like a "local trait" or "if-then signature" approach (Mischel/Shoda) but framed normatively.
      *   *The Tension:* Psychologists want empirical adequacy; Philosophers want normative bite. The user risks satisfying neither (too normative for psych, too empirical/deflationary for philosophy).

  3.  **Drafting the Prep Sheet - Section by Section:**

      *   **Opening Strategy (Concessions vs. Non-Negotiables):**
          *   *Concede:* Global consistency (the "Saint vs. Sinner" dichotomy). The data is against it.
          *   *Hold:* Normativity (the "ought"). If it's just description, it's psychology, not ethics. Agency must remain possible.

      *   **The "Dreaded Question" (Prescriptive Authority):**
          *   *Question:* "Isn't this just descriptive profiling? Where's the 'ought'?"
          *   *Reply:* Shift from "having a trait" to "cultivating a pattern." Normativity lies in the *regulation*, not the *possession*.
          *   *Soft Spot:* Is "regulation" just another word for "situation management"?

      *   **Objection 1: The Psychologists (The "Folk Error" Attack):**
          *   *Focus:* You're just renaming habits. It's still situationism.
          *   *Reply:* Acknowledge situational power, but emphasize *meta-cognition*. Virtue is knowing *which* situation you're in and adjusting.
          *   *Soft Spot:* Empirical evidence for this meta-cognition might be thin.

      *   **Objection 2: The Ethicists (The "Normative Anemia" Attack):**
          *   *Focus:* You've killed the agent. If character is fragmented, who is responsible?
          *   *Reply:* Responsibility isn't about being a robot with fixed code; it's about the work of integration. Fragmentation is the problem to solve, not the excuse.
          *   *Soft Spot:* How much integration is actually possible?

      *   **Objection 3: The Hybrid (The "Definition Stipulation" Attack):**
          *   *Focus:* You're changing the definition of "virtue" so much it's unrecognizable.
          *   *Reply:* Aristotelianism is naturalistic. If science says traits aren't global, naturalism demands we update the metaphysics of virtue, not ignore science.
          *   *Soft Spot:* Aristotle *did* think they were stable. Is this still Aristotle?

      *   **Objection 4: The Practicality (The "Pedagogy" Attack):**
          *   *Focus:* How do you teach this? "Be context-sensitive" isn't actionable.
          *   *Reply:* We teach scenario recognition, not blind rules. Like a jazz musician, not a metronome.
          *   *Soft Spot:* Harder to assess/grade.

  4.  **Refining the Tone and Format:**
      *   Make it look like a cheat sheet. Bullet points, bold text.
      *   Keep the replies tight (approx. 200-250 words spoken is 2 mins, but for a cheat sheet, concise paragraphs are better).
      *   Add a "Mental State" check-in for the user (cold coffee, deadlines).
      *   Ensure the "Soft Spot" is honest—this builds credibility with the user.

  5.  **Review against Constraints:**
      *   *Ordered by damage?* Yes, start with the normative collapse (biggest philosophical risk), then empirical validity, then definition.
      *   *Phrased their way?* Yes, use terms like "fundamental attribution error" and "normative force."
      *   *Concede/Hold?* Included at the top.
      *   *Dreaded Question?* Highlighted specifically.
      *   *Typos?* The prompt says "if there's a typo or two just roll with it" regarding *their* writing, but I should produce clean text for them to use. I will acknowledge their stress in the intro.

  6.  **Final Polish:**
      *   Check the "Regulatory Patterns" concept. Ensure it distinguishes from behaviorism. Behaviorism = stimulus/response. Regulatory Pattern = stimulus/interpretation/response. The "interpretation" is where the virtue lives.
      *   Make sure the advice is actionable for a journalist (who might feel imposter syndrome among academics).

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest citing specific papers.
      *   *Correction:* No, keep it conceptual. They know the papers better than the user. Focus on the *argumentative move*.
      *   *Initial thought:* Make the replies very philosophical.
      *   *Correction:* The user is a journalist. Keep the language clear, punchy, and bridge-building.

  8.  **Final Output Generation** (Proceeding to generate the response based on these steps).
answer: |-
  **PREP SHEET: VIRTUE ETHICS & SITUATIONISM WORKSHOP**
  **To:** [Your Name]
  **Re:** Q&A Strategy for Next Thursday
  **Status:** High Stakes / Interdisciplinary Minefield

  You're not out of your depth; you're bridging a gap they can't. The psychologists think the philosophers are deluded about human nature; the philosophers think the psychologists are reductionists about value. Your "regulatory patterns" thesis is the handshake.

  Here is your battle card. Keep this on the podium.

  ***

  ### 1. THE BOOKENDS: WHAT TO GIVE & WHAT TO KEEP

  **CONCEDE UP FRONT (The Peace Offering):**
  *   **Global Consistency is Dead.** Do not defend the idea that a honest person is honest in *all* contexts. The Milgram and Good Samaritan data is robust. If you fight this, the psychologists will eat you alive and the philosophers will think you're anti-science.
  *   **The "Folk Psychology" of Character is Flawed.** Admit that our intuitive reading of others (Fundamental Attribution Error) is often wrong.

  **HOLD THE LINE (The Non-Negotiables):**
  *   **Normativity Remains.** You cannot reduce ethics to *what we do*; it must remain about *what we should cultivate*. If you lose the "ought," you're just a psychologist.
  *   **Agency via Meta-Cognition.** The "virtue" isn't the automatic behavior; it's the capacity to recognize the situational pressure and regulate against it. That capacity is real, trainable, and morally relevant.

  ***

  ### 2. THE DREADED QUESTION (Ask yourself this first)

  **The Question:** (Likely from a Senior Ethicist)
  *"If virtues are just context-sensitive regulatory patterns, haven't you stripped them of prescriptive authority? You've given us a descriptive map of how people adjust to environments, but you haven't told us why they **should**. Isn't this just behaviorism with a thesaurus?"*

  **The 2-Minute Reply:**
  "That's the crux of the reconstruction. Traditional virtue ethics locates normativity in the *stability* of the agent. I'm locating it in the *quality of the regulation*.
  If I say 'courage is a stable trait,' and science says 'stability is rare,' ethics breaks. But if I say 'courage is the skilled practice of recognizing fear-inducing contexts and regulating your response accordingly,' the normativity shifts to the **skill**.
  We don't tell a jazz musician they lack 'prescriptive authority' because they aren't playing the same note every time. We praise their ability to read the room and adjust. The 'ought' lies in the cultivation of that sensitivity. It's not behaviorism because behaviorism ignores the internal regulatory mechanism. I'm putting the mechanism back at the center. The moral demand isn't 'be consistent,' it's 'be attentive.'"

  **Where This Is Soft:**
  You haven't fully solved *which* patterns are virtuous. If a Nazi regulates perfectly to his context, is he virtuous on your view? You need to hint that "regulatory patterns" must be anchored to human flourishing (eudaimonia), not just situational fit, or you risk relativism.

  ***

  ### 3. OBJECTIONS BY DAMAGE POTENTIAL

  #### OBJECTION 1: The "Normative Anemia" Attack
  **Who:** Virtue Ethicists (Worried you've capitulated).
  **Phrasing:** *"By accepting situationism, you've fragmented the moral agent. If character is just a bundle of local habits, who is responsible for the integration? You've saved the theory from falsification by killing the subject."*

  **The Reply:**
  "Actually, this restores responsibility rather than dodging it. The traditional view lets people off the hook: 'I'm just not a brave person.' That's an excuse. My view says: 'You failed to regulate in this specific context.' It makes morality harder, not easier. It demands we do the work of integration. We aren't discarding the agent; we're asking the agent to be more active in managing their situational vulnerabilities. The 'self' isn't a pre-existing stone statue; it's the work of sculpting those patterns."

  **Soft Spot:**
  If the situationists are right that situational variables overwhelm agency, your call for "integration" might be empirically impossible. Be ready to cite evidence of trainability (e.g., mindfulness or CBT interventions).

  #### OBJECTION 2: The "Folk Error" Attack
  **Who:** Social Psychologists (Worried you're smuggling in mysticism).
  **Phrasing:** *"You're using fancy words like 'regulatory patterns,' but isn't this just admitting that behavior is situationally determined? Why call it 'virtue' at all? It sounds like you're trying to keep the word 'character' for the humanities while we do the real explaining."*

  **The Reply:**
  "I'm not denying the situational determinants. I'm denying that they are the *whole* story. The 'pattern' is the interaction term between person and situation. If virtues were just behaviors, you'd be right. But virtues are **heuristic strategies**. When we label something a virtue, we aren't describing a robot's code; we're identifying a successful strategy for navigating social complexity. Calling it 'virtue' preserves the normative goal of that strategy. I'm not fighting your data; I'm arguing your data requires a more sophisticated ethical vocabulary, not a discarded one."

  **Soft Spot:**
  Psychologists hate "interaction terms" if they aren't well-defined. If they press for the neural or cognitive mechanism of this "regulation," don't bluff. Defer to emerging work in cognitive control/social neuroscience.

  #### OBJECTION 3: The "Definition Stipulation" Attack
  **Who:** Both Sides (The "No True Scotsman" worry).
  **Phrasing:** *"Aristotle defined virtues as stable hexeis (dispositions). You're defining them as flexible patterns. Aren't you just changing the subject? Why call this 'Virtue Ethics' and not 'Situationist Management'?"*

  **The Reply:**
  "Aristotle was a naturalist. He grounded ethics in the best available science of human nature of his time. If he were here, and saw the Milgram studies, he would update the metaphysics of the *hexis*. The core of virtue ethics isn't 'stability at all costs'; it's 'excellence of character leading to flourishing.' If stability prevents flourishing because it makes us rigid in complex environments, then stability isn't the virtue. I'm being more Aristotelian than the traditionalists by respecting the naturalistic foundation."

  **Soft Spot:**
  Historical accuracy. Aristotle *did* value stability highly. Don't claim he'd agree with everything; claim his *method* demands this update.

  #### OBJECTION 4: The "Pedagogy" Attack
  **Who:** Practical Ethicists / Educators.
  **Phrasing:** *"Okay, suppose you're right. How do we teach this? 'Be context-sensitive' isn't actionable. 'Don't lie' is. You've made moral education impossible."*

  **The Reply:**
  "We already teach this way in high-stakes fields. We don't tell pilots 'always pull left.' We tell them 'read the instruments and adjust.' We teach scenario recognition. Moral education becomes less about memorizing rules and more about simulating contexts—like the bystander studies. We teach people to recognize the 'emergency' frame so they don't freeze. It's harder to teach, but it's more robust. Rules fail when the context changes; regulatory skills travel."

  **Soft Spot:**
  It *is* harder to assess. Acknowledge this. Don't promise it's easier, promise it's more honest.

  ***

  ### 4. TACTICAL NOTES FOR THE ROOM

  *   **If they gang up (Psych + Phil vs. You):** Pivot to the shared enemy. The shared enemy is **Rigidity**. The Psychologists hate rigid traits because they aren't real. The Philosophers hate rigid rules because they don't capture nuance. You are the middle ground: *Flexible Realism*.
  *   **If you blank:** Go back to the "Jazz Musician" analogy. It works for both sides. Psychologists hear "improvisation within structure"; Philosophers hear "skill and artistry."
  *   **Body Language:** When answering Psychologists, lean forward (engagement). When answering Ethicists, sit back (contemplation). It sounds fake, but it signals "I speak your language."
  *   **The Coffee:** Drink the cold coffee. It shows you're working. If you need a pause, take a sip. It buys you 5 seconds to think.

  **Final reminder:** You are not defending Aristotle. You are defending the *viability of ethical discourse* in the age of empirical psychology. If you lose, ethics becomes a branch of psychology. If you win, they remain partners. That's a story worth telling.

  Good luck. You've got this.
