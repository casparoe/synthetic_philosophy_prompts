answer: |-
  The problem of induction, as formulated by Hume, asks why we are justified in believing that the future will resemble the past. For centuries, the answer has hovered between pragmatic necessity and circular appeal to the uniformity of nature. The No-Free-Lunch (NFL) theorems appeared to offer a formal resurrection of this debate. In the optimization and machine-learning contexts, these theorems demonstrate that when averaged uniformly over all possible objective functions or target concepts, every algorithm performs exactly as well as every other—no better than blind search. The standard philosophical reading is that NFL is simply Hume with linear algebra: it quantifies the cost of having no structural assumptions about the world. To escape the theorem, one must adopt a prior, such as a simplicity-weighted distribution over data streams, which guarantees convergence to the truth for computable sources. This suggests that induction is justified only relative to a bias toward simplicity. However, the "Delphic Mirror" thought experiment challenges this equivalence. In this scenario, an environment reads an agent's credences and outputs the bit the agent deems less likely. Here, even a simple, deterministic world defeats induction. This essay argues that the Delphic Mirror does not refute the connection between NFL and Hume; rather, it sharpens it. The NFL theorems do not merely restate Hume's problem; they isolate the specific metaphysical precondition required for induction to function: not just structural simplicity, but causal indifference between the predictor and the predicted.

  The standard equivalence between NFL and Hume relies on the assumption that the target function is fixed independent of the search algorithm. In the NFL framework, the "world" is a static mapping from inputs to outputs. Hume's uniformity principle is interpreted as a restriction on this space of mappings, privileging smooth or simple functions. The Delphic Mirror breaks this equivalence not by introducing complexity, but by introducing reflexivity. The Mirror's rule is trivially simple—it is deterministic and computable—yet it guarantees that any agent with a definite opinion will be wrong. This shows that the load-bearing presupposition behind the NFL escape hatch is not merely that the world is simple, but that the world is causally indifferent to the agent's beliefs. The NFL theorems build this indifference into their formalism by fixing the objective function before the algorithm begins its search. When the friend argues that "Hume never had to worry about the world reading your beliefs," they are correct that Hume did not explicitly model reflexivity, but they are incorrect that this makes the Mirror orthogonal to the problem. Instead, the Mirror reveals that the "uniformity of nature" Hume invoked implicitly contains a clause of causal separation. Without this Cartesian separation of predictor from predicted, the concept of a "truth" to converge upon becomes unstable.

  This instability points to a genuine obstruction in reflexive settings, specifically a fixed-point problem. If we attempt to recover a dominance theorem by expanding the hypothesis space to include functions that map the agent's own policy to streams, we encounter a logical loop. In the Mirror scenario, the truth is defined as the negation of the agent's forecast. Therefore, any convergence to better-than-chance accuracy changes the target, destroying the accuracy it just achieved. The truth is not a fixed point in the stream, but a fixed point in the interaction between stream and policy. One might ask if an agent could coherently profit by deliberately inducing in itself a credence it knows to be inaccurate—for instance, believing 0 when it expects 1 to force the Mirror to emit 1. While this might secure a specific outcome, it ceases to be induction in the epistemic sense of aligning belief with evidence; it becomes game-theoretic manipulation. Consequently, no prior over a richer hypothesis space can recover a standard convergence-to-truth guarantee without imposing a constraint that forbids the environment from keying on the agent's final credence. The cost of this recovery is not merely computational complexity, but the exclusion of reflexive hypotheses from the domain of inductive inquiry.

  This exclusion raises the question of circularity. If we must add belief-independence to our prior to make induction work, are we begging the question in the way Hume accused the uniformity principle of doing? Hume's objection was that justifying induction by assuming the future resembles the past is circular because that assumption is itself inductive. However, assuming causal indifference is arguably a milder, constitutive precondition rather than a substantive empirical claim. It is a definition of what counts as a "prediction problem" versus a "game." If the world reacts to our beliefs, we are not discovering independent facts; we are negotiating outcomes. To assume the world is indifferent is not to assume it is uniform in its patterns, but to assume it exists independently of our inquiry. This is not circular justification; it is the demarcation of the domain where justification is possible. Without this assumption, the concept of objective accuracy collapses into strategic success. Thus, the assumption is not a premise within the inductive argument, but a boundary condition for the argument's existence.

  Does this theoretical boundary matter for the working inquirer? The Mirror is contrived, but belief-tracking environments are not exotic. Financial markets, adversarial classifiers, and social systems where published forecasts alter behavior all exhibit reflexive properties. Should this move a working inquirer's confidence in induction? It should not undermine confidence in ordinary domains, but it must limit its scope. Induction remains valid for physics, geology, and other domains where the causal arrow runs one way. The Mirror serves as a warning that induction is not a universal logic of inference, but a tool specific to non-reflexive environments. Recognizing this does not paralyze inquiry; it clarifies that when we move from natural sciences to social sciences, we are shifting from induction to game theory. The NFL theorems, illuminated by the Mirror, tell us exactly where that shift must occur. They quantify the risk: in a reflexive environment, the expected advantage of any inductive rule over chance is zero, regardless of simplicity.

  In conclusion, the No-Free-Lunch theorems do more than restate Hume's problem in a precise vocabulary; they sharpen it by identifying the precise axiom that must be assumed to avoid skepticism. Hume worried about whether the future would resemble the past; the NFL theorems, when tested against the Delphic Mirror, show that the deeper requirement is that the future must not depend on our guessing of it. The Mirror does not break the NFL-Hume connection; it completes it by showing that structural simplicity is insufficient without causal independence. My verdict is that NFL sharpens Hume's problem by transforming a vague worry about uniformity into a specific constraint on causal structure. The one consideration that would most seriously make me change my mind is if it were demonstrated that causal indifference is never actually instantiated—that even in fundamental physics, the act of observation or prediction alters the trajectory of events at a level that prevents convergence. If reflexivity were the norm rather than the exception, then induction would not just be unjustified; it would be ontologically impossible, and the NFL theorems would stand not as a limit on learning, but as a proof of its impossibility.
