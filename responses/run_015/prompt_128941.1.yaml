  **MUNICIPALITY OF VAL-LAC**
  **OFFICE OF PUBLIC AMUSEMENTS**
  **REPORT ON THE THIRD ANNUAL CYCLE OF CIVIC FESTIVALS**

  **To:** The Municipal Council
  **From:** Denis Morel, Chief Administrator
  **Date:** 14 August 2024

  It is with considerable satisfaction that we submit this review of the third year since the demolition of the municipal theatre and the full implementation of the Open-Air Civic Festival programme. The air in the town square is clearer, the budget is healthier, and the community has successfully eliminated the class of professional counterfeiters previously employed to mimic human emotion. We have confirmed that paying citizens to appear what they are not creates a habit of deception that spreads into commerce and family life. By removing the stage, we have removed the shadow.

  The primary challenge in year three was refining the emotional economy of our gatherings. We observed that while open-air festivals eliminate the passive spectator who sits in the dark and pays for safe distance, there remained a risk of wasted sentiment. If a citizen weeps for a generic hardship depicted in the square, that tears are expended on abstraction. To correct this, the Office instituted the Veracity Rule. Henceforth, a festival may only depict a misfortune that actually occurred within the town limits, and it must be staged by the persons to whom it happened.

  The results are promising. The annual reenactment of the Flood of 2019, performed by the residents whose basements were submerged, has stabilized community empathy. The tears shed are no longer wasted on fiction but are reinvested in the actual victims. We note with pleasure that the weeping is now perfectly synchronized with the rising water levels in the script.

  Administratively, this requires careful stewardship of local misfortune. Not every incident possesses the necessary gravity for public viewing. The Office now maintains a reserve list of verified grievances—roof collapses, livestock losses, minor injuries—to ensure we do not exhaust our supply of pain before the summer season concludes. We have found that citizens who have enjoyed a year without incident have nothing to contribute to the festival, which has naturally encouraged a more rigorous standard of honesty regarding personal setbacks. There is some concern that the same families are reenacting the same floods repeatedly, but consistency builds mastery, and the victims have reported that reliving the trauma helps them retain the texture of the memory.

  Regarding personnel, we remind the Council that the Office employs eleven animateurs. These are not actors, as they represent only themselves and are merely paid to be watched while guiding the flow of the crowd. They have formed a union, which we recognize as a healthy sign of civic organization, and have completed the third cohort of the three-year training programme. The curriculum focuses on standing without posing and speaking without projecting. We are pleased to report zero instances of an animateur accidentally pretending to be someone else.

  We have also addressed the issue of visibility. Modesty is preserved when everyone is visible to everyone. However, surveys indicated that the northern ridge allowed residents to observe the square without being seen from it. This created a class of hidden spectators, which is a contradiction in terms. Landscaping modifications were completed in May, including the installation of reflective panels along the tree line. Anyone watching is now watched in return. The ridge is now fully integrated into the spectacle.

  Some critics have asked what becomes of laughter when comedy is banned. We recall that comedy forces audiences to laugh at vice, often rewarding the manipulator and mocking the honest man. In Val-lac, laughter now arises spontaneously from the recognition of shared struggle. During the Flood reenactment, there was audible laughter when Monsieur Garet slipped on the wet paving stones. This was not manufactured humor but a genuine reaction to authentic clumsiness. It was wholesome.

  Naturally, there are dissenters. Monsieur Garet, the former prompter of the demolished theatre, recently remarked, "People are tired of crying about the same water every year." This misunderstands the purpose of the festival. Fatigue is not a metric of failure; it is a metric of engagement. If the citizens were not tired, they would not be working hard enough at being themselves.

  One might wonder if requiring citizens to constantly reopen old wounds places a burden on the populace. However, the alternative is the hardening of the heart that comes from watching strangers pretend to suffer. We choose authenticity over comfort. The transparency keeps us decent.

  **Closing Figures:**
  *   Participation certificates issued: 2,400
  *   Spectators fined for passive observation: 14
  *   Total Attendance (measured by counting eyes visible to the square): Up 40% from Year 2.

  We recommend the continuation of the Veracity Rule and the allocation of funds for the expansion of the Misfortune Reserve.

  Respectfully submitted,

  Denis Morel
  Chief Administrator, Office of Public Amusements
