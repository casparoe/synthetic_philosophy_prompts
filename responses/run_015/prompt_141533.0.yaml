answer: |-
  The Recurrence

  We write the figure three upon the page,
  But chalk is not the thing, merely a mark.
  It claims to be independent and true,
  Residing strictly outside space and time,
  Where causal hands can grasp at nothing,
  Yet here it stands to tell us again.

  If sets are roots, it comes to us again,
  Is one a member of the set three?
  Or is the difference nothing?
  We scratch another symbolic mark,
  But Julius Caesar waits outside,
  No fact decides what makes this true.

  Science demands that laws be true,
  And quantifiers bind them all again.
  We cannot banish wholly outside,
  If physics needs to count to three,
  We owe the debt of every mark,
  Or else our ontology is nothing.

  Say rather that it proves quite nothing,
  A useful fiction held as true.
  You can erase the chalky mark,
  The theory will hold its ground again,
  Without ever counting three,
  Keeping all numbers outside.

  Or perhaps every realm lies outside,
  Where strict consistency yields nothing.
  Any structure fits the three,
  Each axiom scheme is true,
  In some possible world again,
  Regardless of the human mark.

  We trace the same old mark,
  Hunting ghosts outside,
  Returning always again,
  To say there is nothing there,
  Or that the structure is true,
  While counting past the three.

  So chalk will fade and leave no mark on nothing,
  The form stands outside counting three,
  Returning again to ask what is true.

  The reference to Julius Caesar in the second stanza alludes to Benacerraf's identification problem regarding abstract objects. I kept the end-words strictly ordinary to avoid jargon, letting the philosophical weight rest on their arrangement.
