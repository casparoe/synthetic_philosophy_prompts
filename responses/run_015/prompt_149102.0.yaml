  **Blog | Nivel Updates | Product**

  **Introducing THE PUBLIC: A Unified Experience**

  **Posted by The Nivel Team | October 14**

  At Nivel, we have always believed that technology should remove friction from human connection. Over the past quarter, we listened closely to your feedback. Many of you expressed that maintaining a distinct individual profile creates unnecessary anxiety. You told us that standing out feels isolating and that being held accountable for your specific words is a barrier to true expression. We heard you. Today, we are thrilled to announce the sunset of individual accounts and the migration of all users into one shared identity: THE PUBLIC.

  **1. One Account, Infinite Safety**
  Starting next week, all profile data will be merged. There will no longer be a "you" to log in. There is only THE PUBLIC. This radical anonymity is designed for your protection. When no one is exposed, no one can be targeted. When no one is named, no one can be held responsible. We are liberating you from the burden of ownership over your thoughts.

  **2. The Parity Engine**
  We know that fairness is a top priority for our community. Previously, algorithms might have amplified unique voices, creating unhealthy hierarchies. Our new Parity Engine actively monitors for distinction. If a user begins to demonstrate exceptional talent or gain disproportionate attention, the system quietly throttles their reach. Distinction reads as unfairness to everyone else, so we ensure everyone remains comfortably average. This is leveling as a service.

  **3. Conversation Volume**
  We are replacing likes and shares with Conversation Volume. This metric measures the total amount of talk generated about a topic. It is important to note that actual real-world action drags this metric down. If you go out and solve a problem, the conversation ends. If you stay online and discuss the problem indefinitely, Conversation Volume grows. We reward the discussion, not the resolution.

  **4. Legacy Publics**
  We understand some groups operate outside the platform. Book clubs, picket lines, and juries will be allowed to maintain separate structures. However, our data shows these legacy publics are not scalable. Because they are capable of making decisions and taking physical action, they remain niche use cases. THE PUBLIC is designed for talk, which is infinitely more flexible than action.

  **5. Simplified Reactions**
  Nuance is exhausting. We have reduced the reaction set to two buttons available on every post at all times: Indiscriminate Applause and Indiscriminate Condemnation. This ensures nobody ever has to take a position about anything in particular. You can signal total agreement or total disagreement without reading the content or understanding the context. It is judgment without the weight of justification.

  **6. Publisher Partnerships**
  We are partnering with major media outlets to streamline content creation. Now that no one is the author, no one can be sued for libel or copyright infringement. Conversely, because everyone is the author, everyone reads. Content is no longer produced by a writer but emitted by THE PUBLIC. This creates a seamless loop where the reader and writer are the same abstract entity.

  **FAQ**

  **Q: Who is liable if something goes wrong?**
  A: Liability requires a specific actor. Since THE PUBLIC is everyone and no one, liability has been successfully decentralized to the point of disappearance.

  **Q: Can I still express my personal truth?**
  A: Personal truth implies a single individual. We encourage you to express the general mood instead.

  **Q: How do I contact support?**
  A: Support tickets will be answered by THE PUBLIC.

  **Join Us**

  We are incredibly excited to remove the obstacle of selfhood from your digital experience. You are no longer a single individual struggling to be heard. You are part of something vast, abstract, and unaccountable. Welcome to the future of connection.

  If you have questions about this update, please feel free to send them to our support channel. We invite you to ask anything you like, now that there is no one left who could answer them.
