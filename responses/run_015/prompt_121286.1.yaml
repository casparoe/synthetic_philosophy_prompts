answer: |-
  To apply David Lewis's account of convention to federated social platforms, we must first recognize that the structural features of federation—decentralization, instance-level autonomy, and low-friction migration—fundamentally alter the parameters of the coordination problem Lewis describes. Lewis defines a convention as a regularity in behavior that persists because it solves a recurrent coordination problem, sustained by a system of preferences where individuals prefer to conform conditional on the expectation that others will conform, all underpinned by common knowledge.

  In a federated environment, the "population" is not a static set of agents facing a single recurrent situation, but a fluid network of overlapping subsets interacting across distinct technical boundaries. This shifts the analysis from whether a *global* convention can exist to how *local* conventions stabilize and how they interact (or fail to interact) across boundaries. The implications for stability, breakdown, and governance can be understood through three specific tensions within the Lewisian framework: the fragmentation of common knowledge, the dual role of exit in convention formation, and the rationality of defection in a low-sanction environment.

  ### 1. The Fragmentation of Common Knowledge

  For Lewis, common knowledge is the bedrock of convention. It is not enough that everyone follows a rule; everyone must know that everyone follows it, and know that everyone knows it, ad infinitum. This mutual expectation is what makes conformity rational. In a centralized system, a single authority or a shared public history often generates this common knowledge. In a federated system, common knowledge is structurally fragmented.

  Users on one instance do not necessarily share a common knowledge base with users on another. Instance A may have a strict norm regarding content warnings, while Instance B has none. When a user from A interacts with a user from B, the Lewisian condition of "expecting others to conform" fails. There is no shared regularity across the boundary, and crucially, there is no common knowledge *that* there is no shared regularity until a conflict occurs.

  This implies that in federated governance, conventions cannot be platform-wide. They are necessarily instance-relative. The "recurrent situation" Lewis requires is not "using the platform," but "participating in this specific instance." Stability, therefore, depends on the technical and social boundaries of the instance being strong enough to maintain a distinct population where common knowledge can accumulate. If the boundaries are porous—if users from non-conforming instances constantly flood the local timeline—the local common knowledge is polluted. The expectation that "others will conform" becomes unreliable, undermining the rationality of conformity for the local users. Consequently, federated systems tend toward the hardening of instance boundaries (e.g., defederation or strict approval processes) not merely for safety, but to preserve the epistemic conditions required for local conventions to function.

  ### 2. Exit: Convention-Preserving or Convention-Eroding?

  The ability to migrate easily between instances (exit) presents a paradox when viewed through Lewis's lens. On one hand, exit facilitates the clustering of like-minded users. On the other, it introduces population churn that threatens the stability of expectations.

  **Exit as Preservation (Clustering):**
  Lewis notes that conventions often arise from precedent and salience. In a federated system, server configurations act as powerful salience cues. If an instance is configured to require content warnings, that technical constraint makes the regularity salient to all new users. Exit allows users to self-select into instances where the local conventions match their preferences. This homogeneity strengthens the Lewisian conditions. If everyone on Instance A prefers strict moderation, and everyone knows everyone else prefers it, the conditional preference for conformity is robust. Exit, in this sense, purges the population of potential defectors, making the "everyone conforms" condition easier to satisfy. It creates pockets of high-trust coordination where conventions are stable because the population is pre-aligned.

  **Exit as Erosion (Churn):**
  However, Lewis emphasizes that conventions rely on the *recurrence* of the situation and the stability of the population's expectations. If migration is too frictionless, the population becomes transient. Conventions require time to crystallize into common knowledge; they rely on the history of past interactions to justify future expectations. If users migrate frequently, the "memory" of the group is lost. A new arrival may not know the local unwritten norms, and the locals cannot reliably expect the new arrival to know them.

  Furthermore, if exit is the primary response to norm violation, it erodes the mechanism of *correction*. In a stable population, deviation is met with sanction or social pressure, reinforcing the convention. In a federated system, deviation is often met with migration. The defector does not learn to conform; they simply move to a place where their behavior is the norm. This suggests that while exit preserves local conventions by creating homogeneity, it prevents the evolution of broader, more inclusive conventions. It creates a mosaic of rigid, isolated equilibria rather than a flexible, adaptive system. The "common knowledge" becomes hyper-local and brittle, unable to scale across the network.

  ### 3. Rational Defection and the Cost of Sanctions

  Lewis's account hinges on the idea that conformity is a coordination equilibrium: I conform because I expect you to conform, and we both benefit from coordinating. Deviation is irrational because it leads to coordination failure (e.g., we drive on different sides of the road). In federated moderation, however, the cost of deviation is often decoupled from coordination failure.

  In a centralized system, deviation (e.g., hate speech) is met with a centralized sanction (ban), making deviation costly. In a federated system, sanctions are local. If a user violates a norm on Instance A, they are suspended from A. But because they can migrate to Instance B, the cost of deviation is capped at the loss of that specific local social capital, not access to the entire network.

  This alters the preference structure Lewis describes. For a convention to hold, the preference for conformity must be conditional on the expectation of others' conformity. But if the cost of non-conformity is low (because exit is available), the preference for conformity weakens. Users may conform not because they value the coordination itself, but simply because they value the specific community. If the community changes or the friction of moving drops, the rationality of conformity drops with it.

  This suggests that federated moderation struggles to sustain cooperative equilibria that require sacrifice. Conventions that are merely arbitrary (like driving on the right) hold easily because coordination is the only benefit. But social norms often require users to suppress certain behaviors for the collective good. If the enforcement mechanism is weak (local only) and the escape hatch is open (migration), rational actors may defect whenever the local norm becomes inconvenient, knowing they can find a new equilibrium elsewhere. This makes "persistent norm-defection" rational not in the sense of staying and violating, but in the sense of abandoning the convention entirely rather than adapting to it.

  ### 4. Salience and Technical Affordances

  Lewis discusses salience as a way to solve coordination problems without communication—a "focal point." In federated systems, technical affordances replace cultural salience. The software configuration *is* the focal point. If the software makes a behavior difficult (e.g., character limits, mandatory tags), it creates a regularity that mimics a convention.

  However, a Lewisian convention is fundamentally social, not just behavioral. A technical constraint forces regularity, but it does not necessarily create the *common knowledge of mutual expectation* that defines a convention. Users might follow a rule because the software forces them to, not because they expect others to follow it and prefer to coordinate. This is a crucial distinction for governance. If the regularity is maintained by code rather than mutual expectation, the "convention" is fragile. If the code changes, or if a user finds a workaround, the regularity collapses because the underlying web of expectations was never formed.

  For federated governance to be stable in a Lewisian sense, the technical constraints must be internalized by the users as social expectations. The server settings must be understood not just as rules, but as signals of what *others* will do. When this translation fails—when users view rules as arbitrary impositions by an admin rather than shared solutions to coordination problems—the system relies on authority rather than convention, making it vulnerable to resentment and fragmentation.

  ### Conclusion: The Mosaic of Local Equilibria

  The implication of Lewis's analysis for federated platforms is that a single, shared "platform-wide" convention is impossible under current architectural conditions. The conditions of common knowledge and stable population required for a global convention are precluded by the fragmentation of authority and the fluidity of membership.

  Instead, federated systems sustain a **mosaic of local conventions**. Stability is achieved not through universal agreement, but through **boundary maintenance**. Instances must be sufficiently closed to allow common knowledge to develop locally, and sufficiently distinct to allow salience to operate via configuration.

  However, this stability comes at a cost. The ease of exit preserves local conventions by allowing homophily (clustering of like-minded users), but it erodes the potential for broader social coordination. It makes norm-defection rational by lowering the cost of leaving a community rather than adapting to it. Therefore, federated governance cannot rely on the spontaneous emergence of Lewisian conventions to manage conflict between instances. Without a central authority to enforce a meta-convention on how instances interact, the system relies on a fragile network of bilateral agreements (federation blocks) that function more like treaties between sovereign states than social conventions within a population.

  Ultimately, Lewis's framework suggests that while federated platforms can support robust local norms, they are structurally prone to **coordination failure at the macro level**. The very features that protect local autonomy (exit, decentralization) prevent the formation of the common knowledge and stable expectations required for a unified normative order. Governance in this setting is less about cultivating shared conventions and more about managing the incompatibility between divergent local conventions.
