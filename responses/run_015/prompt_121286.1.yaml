      *(Refining the Exit Argument)*: Does exit preserve or erode? It preserves *local* conventions by purging dissenters (increasing homogeneity), but it erodes *global* coordination potential. Since Lewis focuses on a specific population $P$, if $P$ self-selects, conventions are stronger. But if the *system* relies on interaction between different $P$s, the lack of a *meta-convention* on how to interact is the risk.

      *(Refining Rational Defection)*: In Lewis, conformity is rational because others conform. In federation, if I dislike the norm, I leave. So conformity is rational *only if* I value staying in that specific cluster more than the cost of the norm. If exit is frictionless, the "cost" of conformity must be very low, or the "value" of the cluster very high.

