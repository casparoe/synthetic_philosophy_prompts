      *   *Regularity:* Moderation norms, content warnings, blocking practices.
      *   *Authority:* Decentralized. Admins set local rules, but cannot enforce globally.
      *   *Mechanism:* "Exit" (moving instances) is easy. "Voice" (arguing for rule changes) is local.

  4.  **Evaluate Lewisian Conditions in this Context:**

      *   *Regularity:* Is there a global regularity? No. There are *local* regularities. This suggests conventions are *instance-relative*, not platform-relative.
      *   *Common Knowledge:* This is the biggest hurdle. In a centralized system, a Terms of Service update creates common knowledge. In federation, Instance A doesn't necessarily know Instance B's specific unwritten norms until a conflict occurs. The "common knowledge" is fragmented.
      *   *Conditional Preferences:* Do I want to follow norms *if* others do? Yes, within an instance. But if I move, my preferences might reset.
      *   *Salience:* What makes a norm salient? Server configuration (e.g., mandatory content warnings) acts as a structural salience cue. But across servers, salience is weak.

  5.  **Address the "Exit vs. Voice" Dynamic:**
      *   *Lewisian View:* Conventions solve coordination problems. If exit is too easy, does it solve the coordination problem or dissolve it?
      *   *Preservation:* Exit allows clustering. Like-minded users form a homogeneous $P$. This *strengthens* local common knowledge and conditional preferences. It makes the Lewisian conditions *easier* to satisfy locally.
      *   *Erosion:* Constant migration prevents the *history* required for common knowledge to deepen. If $P$ is transient, the "recurrent situation" $S$ is unstable. Conventions require time to crystallize. High churn threatens the "everyone expects everyone else" condition because "everyone else" keeps changing.

  6.  **Address Norm Evolution and Stability (Evolutionary Dynamics):**
      *   *Observability:* Lewis requires that deviations are noticeable. In federation, defederation (blocking an instance) makes deviation invisible rather than costly. This changes the penalty structure.
      *   *Costly Signaling:* Moderation actions are signals. But without a central court, signals are noisy.
      *   *Cooperative Equilibria:* Can they sustain? Yes, but they are *patchy*. The global system is a mosaic of local equilibria.
      *   *Rational Defection:* Is it rational to defect? If I can just move to a server where my behavior is the norm, then "defection" from the global norm isn't defection; it's migration. True defection is staying where you violate norms. But if sanctions are weak (only local suspension), and exit is cheap, the cost of defection is low. This threatens the "preference for conformity" condition.

