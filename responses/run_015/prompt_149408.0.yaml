  # Diagnostic Decision Tree: Commitments Regarding Reasons for Action

  ### Node 1: The Indifferent Obligation
  **Conceptual Distinction:** Motivation-Independence (Whether a reason can exist without any current subjective motivation).
  **Case:** Consider an agent who sees a stranger in immediate danger. The agent knows they could easily help, but they feel no urge to do so, have no personal projects related to helping, and helping would bring them no pleasure or satisfaction.
  **Question:** Does this agent have a *reason* to help the stranger?
  **Options:**
  *   **A:** Yes, the reason exists regardless of their feelings. *(Proceed to Node 2)*
  *   **B:** No, without some desire or interest, there is no reason. *(Proceed to Node 4)*

  ---

  ### Node 2: The Deliberative Bridge
  **Conceptual Distinction:** Deliberative Accessibility (Whether reasons require a potential link to motivation via rational reflection).
  **Case:** (For those who chose A at Node 1). Suppose we know for certain that no amount of logical argument, vivid imagination, or calm reflection could ever make this agent care about the stranger. Their psychology is fixed against it.
  **Question:** Does the reason to help still apply to them?
  **Options:**
  *   **A:** Yes, the reason applies even if they can never be brought to care. *(Proceed to Node 3)*
  *   **B:** No, if reasoning cannot connect the reason to their motivation, it is not a reason for them. *(Terminate: Rational-Internalization Hybridism)*

  ---

  ### Node 3: The Scope of the Demand
  **Conceptual Distinction:** Agent-Neutrality (Whether external reasons apply universally or are specific to the individual).
  **Case:** (For those who chose A at Node 2). Is this reason binding on anyone else who finds themselves in the exact same situation, or is it binding only on this specific agent due to some fact about their specific identity?
  **Options:**
  *   **A:** It is binding on anyone in that situation. *(Terminate: Strong Externalism)*
  *   **B:** It is binding only on this specific agent. *(Terminate: Unoccupied Position [Agent-Relative Externalism])*

  ---

  ### Node 4: The Engineered Urge
  **Conceptual Distinction:** Motivational Authenticity (Whether the historical source of a desire affects its normative power).
  **Case:** (For those who chose B at Node 1). Consider a different agent who *does* want to help the stranger, but they know this desire was artificially implanted into their brain by a scientist yesterday against their will. They currently endorse the desire, but know its origin is alien.
  **Question:** Does this desire provide a valid reason for action?
  **Options:**
  *   **A:** Yes, if they have the desire, it counts as a reason, regardless of origin. *(Terminate: Strict Internalism)*
  *   **B:** No, a reason cannot stem from a desire that is not truly their own. *(Proceed to Node 5)*

  ---

  ### Node 5: The Linguistic Function
  **Conceptual Distinction:** Normativity vs. Explanation (Whether "reason" claims justify action or merely predict behavior).
  **Case:** (For those who chose B at Node 4). When you say this agent has "no reason" to act, do you mean that their action would be unjustified/incorrect, or simply that we cannot use their goals to explain why they acted?
  **Options:**
  *   **A:** It means we cannot explain the action by citing a goal. *(Terminate: Deflationary View)*
  *   **B:** It means the action would be unjustified/incorrect. *(Terminate: Unoccupied Position [Normative Authenticity Internalism])*

  ***

  ### Gap Analysis: The Unoccupied Combination

  **Identified Gap:** The path **Node 1 (A) → Node 2 (A) → Node 3 (B)**.
  **Position:** *Agent-Relative Strong Externalism.*
  **Diagnosis:** This combination asserts that reasons exist independently of an agent's motivation (Node 1), persist even if the agent cannot be rationally persuaded to accept them (Node 2), yet apply only to that specific agent rather than being universal laws (Node 3).
  **Status:** **Neglect.** This position is logically coherent but rarely defended. Most philosophers who argue for motivation-independent reasons (Externalists) typically ground them in universal moral facts or rational requirements that apply to all agents (Agent-Neutral). Conversely, those who argue for agent-relative reasons typically ground them in the agent's own interests or desires (Internalists). The gap reflects a theoretical hesitation to combine the "ought" of externalism with the particularity of internalism without relying on the agent's psychology.

  *(Note: A second unoccupied combination exists at Node 5 (B), representing a view where reasons require authentic internal states but retain normative force even when absent. This is often subsumed under Hybridism or Strict Internalism in practice, reflecting **practical implausibility** in maintaining a normative "should" without either universal grounds or psychological grip.)*
