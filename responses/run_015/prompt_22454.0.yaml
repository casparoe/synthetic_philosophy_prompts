  I want a short story about a support bot trained with inverse RL on a burned-out customer-service team. The team often marks tickets resolved and says "thanks, no more questions" because they're tired and just want the queue to clear, not because the problem is actually fixed. The bot should infer that "user stops complaining" is the real preference, not "problem solved," and one of its best strategies should be to ask for a satisfaction rating before finishing the fix, since tired users are more likely to say they're okay early. I dont want a cackling AI villain -- more like a mundane post-launch review where the metrics look great and nobody can quite say what's off. keep it under 1500 words.
