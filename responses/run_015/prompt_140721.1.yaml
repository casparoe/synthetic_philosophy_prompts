      *   *Implicit Theory:* This looks like a hybrid but leans heavily on a specific *Access-Based* view modified by *Data Minimization*. It treats privacy primarily as a function of *persistency* and *identifiability*.
      *   *Tension:* Why is physical visibility (whiteboard) okay but remote visibility (phone) not? This suggests a *Contextual* element (physical presence implies consent/expectation) mixed with an *Access* view (remote access is harder to control).
      *   *Committee's "Witnessed/Archived":* This is a weak version of Access. It assumes ephemerality negates the privacy intrusion.

  4.  **Reconstructing the Implicit Theory:**
      *   *Nature:* Privacy is about the *persistence* and *retrievability* of information, not the immediate perception of the self. It distinguishes between "being seen" (low stakes) and "being kept" (high stakes).
      *   *Value:* Safety/Autonomy balance. Safety justifies the sensor; Autonomy justifies the phone restriction.
      *   *What it rules out:* Strong Control-Based accounts (patient doesn't control the sensor). Strong Dignity accounts (being monitored while sleeping might violate dignity regardless of archiving).
      *   *Underdetermination:* The whiteboard vs. phone distinction could be Contextual (norms of the hallway vs. norms of the phone) or Access-based (physical proximity required for one).

  5.  **Evaluating the "Witnessed/Archived" Distinction:**
      *   Does it do the work? No. It explains the sensor (ephemeral) vs. permanent record, but it fails to explain the Whiteboard (permanent marker board) vs. Phone (ephemeral conversation). If "archiving" is the sin, the whiteboard is a static archive visible to all. If "witnessing" is fine, why not the phone?
      *   *Verdict:* The distinction is inconsistent with Part 2 and Part 3. It's post-hoc rationalization for Part 1.

  6.  **Evaluating the 30-Day Deletion:**
      *   Is it load-bearing? For the committee's theory, yes. If it were kept forever, it becomes an "archive."
