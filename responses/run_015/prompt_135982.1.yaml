      *   **Core Issue:** Are qualia (intrinsic, ineffable, private, directly apprehensible properties of experience) coherent, or are they eliminable illusions?
      *   **Riley's Position:** Dennettian. Qualia are incoherent because if two states are functionally/behaviorally/introspectively indistinguishable, there is no fact of the matter about intrinsic differences. Positing them is metaphysically empty.
      *   **Sam's Position:** Qualia Realist. Epistemic indistinguishability doesn't entail ontological identity. Inverted qualia scenarios are conceptually possible. Phenomenal properties are structurally anchored but non-functional.
      *   **Moves:**
