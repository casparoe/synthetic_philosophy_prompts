      *   **Move 3 (Riley):** Attacks the "lingering sense" as a second-order belief. This is a strong Dennettian move (qualia are judgments). The extension to "qualia bundles" (global inversion) tries to close the loophole where relational structure saves the day. If *all* relations are preserved, what's left?
