answer: |-
  Riley prevails on logical coherence by demonstrating the explanatory vacuity of Sam's position, although Sam correctly identifies that Riley's functionalist framework presupposes the conclusion it seeks to prove.

  **Move 1:** Riley is right that Dennett's argument hinges on the indistinguishability of the states rendering the distinction factually empty, but Riley misses that this relies on a verificationist premise—that unobservable differences are nonexistent—which is a substantive metaphysical claim, not a logical truth.

  **Move 2:** Sam is right to distinguish epistemology from ontology, as inconceivability does not entail impossibility, but Sam is wrong about the hypothetical: if the subject reports a "lingering sense," behavioral dispositions are not intact, undermining the claim that the change is undetectable; if they do not report it, the claim is idle.

  **Move 3:** Riley is right that second-order beliefs without functional grounding lack evidential weight in a naturalistic framework, and the extension to qualia bundles effectively blocks the move to save qualia via relational structure, though Riley misses that this assumes first-person authority is illusory rather than merely non-infallible.

  **Move 4:** Sam is right that Riley begs the question by defining properties exclusively through third-person access, but Sam is wrong that "structurally anchored but non-functional" is a stable category; the timbre analogy fails because timbre is physically detectable, whereas Sam's qualia are defined by their detectability only to the subject, which risks collapsing into epiphenomenalism.

  **Move 5:** Riley is right that without calibration or identification, the proposed property cannot participate in causal explanations, forcing Sam's position into either functionalism (if the structure does work) or mystery (if it does not), though Riley misses that first-person access could constitute a unique form of calibration unavailable to third parties.

  **Points Both Miss:** Both overlook representationalism, which argues qualia are representational contents (functional roles) that *seem* intrinsic, thereby dissolving the dichotomy between functional properties and ghostly intrinsic feels. Additionally, both treat Dennett's specific definition of qualia (ineffable, intrinsic, private, directly apprehensible) as the only target, ignoring realist accounts that reject one or more of these criteria to save the phenomenon.

  **Overall Verdict:** Riley is closer to being right because Sam's defense ultimately relies on positing properties that make no causal difference to the physical world or behavioral output, rendering them metaphysically extravagant and explanatorily idle, whereas Riley's functionalism offers a parsimonious ontology even if it requires revising our folk-psychological intuitions.
