  3.  **Evaluate Each Move:**

      *   **Move 1 (Riley):** Accurately represents Dennett's core argument in "Quining Qualia." Dennett argues that if you strip away functional/behavioral/introspective differences, nothing remains. The claim of incoherence stems from the lack of explanatory role.
          *   *Verdict:* Riley is right about Dennett's argument structure. However, the leap from "no explanatory role" to "metaphysically incoherent" is the contentious premise Sam will attack.

      *   **Move 2 (Sam):** Distinguishes epistemology (knowing) from ontology (being). The inverted qualia hypothesis is the standard counter to functionalism. The specific detail ("Everything looks the same, but I have a lingering sense...") is tricky. If *everything* looks the same (including judgments), the "lingering sense" is behaviorally manifest (reporting it). If it's truly undetectable, how does the subject report it?
