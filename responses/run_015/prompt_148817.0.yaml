  ### Diagnostic Decision Tree: Aggregation and the Monster

  **Audience:** Advanced Undergraduate Seminar in Normative Ethics.
  **Instructions:** Answer each question based on your immediate normative judgment of the case described. Do not worry about which theoretical label your answer might imply.

  **Node 1 (The Hedonic Baseline)**
  In the standard case, a "Monster" would derive an enormous amount of pleasure from a resource, while a large number of other people would each lose a very small amount of pleasure if the resource were given to the Monster. The total pleasure gained by the Monster exceeds the total pleasure lost by the others. Do you allocate the resource to the Monster?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 5.

  **Node 2 (Structural Consistency)**
  Suppose the Monster's gain is not pleasure, but the realization of a complex, irreducibly valuable aesthetic or epistemic order (systemic flourishing), while the others still lose their small amounts of pleasure. Does your verdict change compared to Node 1?
  *   **No (Verdict remains the same)** → Go to Node 3.
  *   **Yes (Verdict changes)** → *See Unoccupied Combination Diagnosis below.*

  **Node 3 (Aggregation Limits)**
  You have indicated you are willing to aggregate gains to feed the Monster. Is there *any* amount of loss to the many that would forbid feeding the Monster, even if the Monster's total gain (hedonic or structural) remains mathematically larger?
  *   **No (No limit; total value always wins)** → **Leaf 1**
  *   **Yes (There is a limit)** → Go to Node 4.

  **Node 4 (Source of the Limit)**
  You believe there is a limit to aggregation. Is this limit because the welfare of the worse-off counts for *more* in the moral calculation (diminishing marginal weight), or because social institutions must guarantee a *minimum share* to everyone regardless of total value?
  *   **Welfare counts for more (Priority)** → **Leaf 2**
  *   **Minimum share/Institutional Rule (Floor)** → **Leaf 6**

  **Node 5 (Basis of Rejection)**
  You indicated you would *not* feed the Monster in the hedonic case. Is the primary objection that the resulting distribution is too unequal, or that the individuals are being used/violated regardless of the distribution?
  *   **Too Unequal (Distribution)** → **Leaf 5**
  *   **Individuals Used/Constrained (Boundary)** → Go to Node 6.

  **Node 6 (Nature of the Constraint)**
  You believe the individuals are protected by a constraint. If the individuals hypothetically consented to a system where such sacrifices were allowed for the greater good, would the action become permissible?
  *   **No (Constraint is absolute/inalienable)** → **Leaf 3**
  *   **Yes (Constraint depends on justifiability/consent)** → **Leaf 4**

  ---

  ### Leaf Diagnoses & Structural Variant Impact

  **Leaf 1: Unrestricted Classical Utilitarian Aggregation**
  *   **Path:** Yes → Same → No Limit.
  *   **Diagnosis:** You hold that value is value, regardless of who holds it. The sum total determines the right action.
  *   **Structural Variant Impact:** **Diagnosis Intact.** Classical utilitarianism is typically neutral regarding the source of value (hedonic vs. structural) provided it can be aggregated. Accepting the structural variant requires no revision.

  **Leaf 2: Prioritarian / Weighted-Utilitarian**
  *   **Path:** Yes → Same → Limit → Priority.
  *   **Diagnosis:** You allow aggregation but assign diminishing marginal moral weight to gains. The Monster's huge gain eventually weighs less than the many small losses because the many are worse off.
  *   **Structural Variant Impact:** **Diagnosis Intact.** Prioritarianism applies to the distribution of *whatever* good is being maximized. Whether the Monster's gain is pleasure or aesthetic order, the weighting function applies to the magnitude of the gain relative to the losers' baseline.

  **Leaf 3: Rights-Based / Side-Constraint (Nozickian)**
  *   **Path:** No → Same → Individual → Absolute.
  *   **Diagnosis:** You hold that individuals are inviolable. They cannot be sacrificed for the greater good, even if the total gain is massive.
  *   **Structural Variant Impact:** **Diagnosis Intact.** Rights function as trumps against aggregation regardless of the type of value being pursued. Whether the Monster seeks pleasure or aesthetic perfection, it cannot violate the side-constraint.

  **Leaf 4: Contractualist / Ex-Ante-Consent Rejection**
  *   **Path:** No → Same → Individual → Justifiability.
  *   **Diagnosis:** You reject aggregation because the sacrifice could not be justified to the individual from their separate standpoint. It is about reasonable rejection, not metaphysical inviolability.
  *   **Structural Variant Impact:** **Diagnosis Intact.** The test is whether the loss can be justified to the loser. The nature of the Monster's gain (pleasure vs. art) is secondary to the fact that the loser bears a burden they could reasonably reject.

  **Leaf 5: Strict Egalitarian / Lexical-Priority**
  *   **Path:** No → Same → Distribution.
  *   **Diagnosis:** You prioritize equality of outcome or status over total value. Aggregation is rejected because it creates an unacceptable gap between the Monster and the many.
  *   **Structural Variant Impact:** **Revision Required.** If the Monster's gain is *structural flourishing* (e.g., epistemic order) rather than subjective welfare, a strict egalitarian must decide if "flourishing" is the metric of equality. If equality applies only to welfare, the structural variant might be permissible. If equality applies to all goods, the diagnosis holds.

  **Leaf 6: Hybrid / Institutional-Separation**
  *   **Path:** Yes → Same → Limit → Institutional Floor.
  *   **Diagnosis:** You permit aggregation at the fundamental level but insist on institutional rules (a distributive floor) that prevent anyone from falling below a certain threshold, effectively blocking the Monster case in practice.
  *   **Structural Variant Impact:** **Revision Required.** This position depends on defining the "floor." If the floor is defined hedonically (basic welfare), the structural Monster might bypass it. If the floor is defined as "access to basic goods" regardless of type, the diagnosis holds.

  ---

  ### Unoccupied Combination Diagnosis

  **The Path:** **Node 1 (Yes)** → **Node 2 (Change/No)** → **Node 3 (No Limit).**
  **The Position:** *Hedonic-Exclusive Unrestricted Aggregation.*
  **Diagnosis:** This combination indicates a respondent who accepts unrestricted aggregation for pleasure but rejects it for non-hedonic structural value (e.g., aesthetic order), yet maintains *no limits* on the pleasure aggregation.
  **Why Unoccupied:** This position is logically available but theoretically unstable and largely neglected. It implies a dual-value theory where pleasure aggregates infinitely but aesthetic value does not count at all (or triggers a veto), without a unifying principle (like a threshold) to explain the difference. It is typically rejected as arbitrary: if one accepts unrestricted aggregation for one good, consistency usually demands either accepting it for all comparable goods (Leaf 1) or imposing limits on both (Leaf 2 or 6).

  ---

  ### Indistinguishable Leaves Flag

  **Pair:** **Leaf 3 (Rights-Based)** and **Leaf 4 (Contractualist).**
  **Diagnosis:** While Node 6 attempts to separate these based on the *meta-ethical source* of the constraint (inalienable status vs. justifiability/consent), these positions often share **all normative outputs** in concrete diagnostic cases like the Utility Monster. Both yield a "No" verdict on aggregation and both protect the individual against being sacrificed.
  **Reason for Overlap:** In the context of the Monster problem, the distinction between "I cannot be sacrificed because I am inviolable" and "I cannot be sacrificed because this cannot be justified to me" rarely produces divergent practical judgments. They differ primarily in metaphysical backing and theoretical motivation rather than in the normative output of the decision tree. Respondents may find the Node 6 distinction too abstract to answer consistently, causing these leaves to functionally merge.
