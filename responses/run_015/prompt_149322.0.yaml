  why existing answers dont settle it: people talk about big obvious turning points but never define what makes something a hinge versus just a regular cause. and the narrativist stuff says we always construct hinges after the fact, but that still doesnt say whether visibility is part of the concept itself or just an accident.

  my approach: instead of a big lit review im gonna pick three case studies where a decision seemed boring at the time but had massive downstream effects, then check if they still count as hinges under both a visible-definition and a hidden-definition. the obvious alternative is just listing famous events and calling them hinges, but that skips the conceptual work. rough timeline: week 1-3 pick cases and do background, week 4-8 run the comparison, week 9-12 write up.

  what a result looks like: if hidden hinges exist and have different properties than visible ones, then the theory needs fixing. failure is if i cant find any hidden ones that actually matter, or if the visible/hidden distinction collapses into "history is just random path dependance."

  scope: one semester, about 4000 words, qualitative only, no math. honest risk: picking good cases might eat all my time, and i dont know dynamical systems well enough to model this formally, so im staying away from the equations.

