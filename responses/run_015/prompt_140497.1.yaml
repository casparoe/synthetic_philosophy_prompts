answer: |-
  **Department for Strategic Coordination**

  **Optimising Evidential Alignment in Strategic Interactions**

  **Presented to Parliament by the Secretary of State by Command of His Majesty**

  **Cm 9482**

  **October 2023**

  **© Crown Copyright 2023**

  **Ministerial Foreword**

  Strategic instability arises when agents face one-shot dilemmas without causal leverage over counterparts. This White Paper sets out a new framework for national welfare maximisation based on evidential decision theory. Where causation is absent, correlation remains a viable conduit for cooperative outcomes. The Government recognises that whilst an agent's choice cannot cause a counterpart's choice, it provides critical evidence regarding the counterpart's likely behaviour. This administration is committed to delivering the infrastructure necessary to capitalise on these evidential links.

  **Executive Summary**

  In large worlds, rational agents should cooperate in one-shot prisoner's dilemmas provided their decision procedure is sufficiently correlated with that of their counterpart. The Department for Strategic Coordination (DSC) has identified a market failure in the provision of such correlation. This paper outlines a statutory regime to ensure minimum evidential thresholds are met. The preferred option involves a levy on high-temptation payoffs and the standardisation of decision procedures. This approach recognises that correlation is a function of similarity. By managing similarity, the Department drives cooperation.

  **Options Appraisal**

  Three options were considered to secure cooperative equilibria.

  **Option 1: Direct Intervention.** Attempting to causally influence counterpart behaviour. Cost: £4.2bn. Viability: Low. Causal mechanisms are unavailable in one-shot scenarios.

  **Option 2: Correlation Enhancement.** Subsidising demographic clustering to raise statistical correlation. Cost: £1.8bn. Viability: Medium. Requires significant uptake of similarity markers.

  **Option 3: Tempering Temptation.** Reducing the payoff for defection to lower the correlation threshold required for rational cooperation. Cost: £0.4bn. Viability: High.

  The mathematics of the threshold indicates that as the temptation payoff rises, the required correlation approaches certainty. Beyond a certain point, no attainable correlation suffices. Option 3 is therefore preferred. The Department will introduce a Levy on High-Temptation Matrices. This reduces the incentive to defect, thereby lowering the evidential burden on the agent. It is more cost-effective to lower the bar than to raise the agent.

  **Preferred Option and Implementation**

  The Department sets a statutory Minimum Evidential Correlation Threshold (MECT) of 0.85. This figure will be kept under review. Implementation will commence in Q1 2024. Local authorities will be issued guidance on lawful deliberation to ensure citizens generate the correct evidential signals.

  The Office for National Statistics (ONS) has been tasked with certifying that the world is sufficiently large to support these assumptions. The ONS must estimate the number of relevantly similar agents with a 95% confidence interval. The ONS notes that the estimate moves as the policy itself changes what counts as similar. Whilst this introduces volatility into the baseline, the Department accepts the certification provisionally. Delivery partners will be expected to meet rollout targets regardless of baseline fluctuation.

  **Equality Impact Assessment**

  Similarity is a matter of degree. The Department must decide which respects count towards the reference class. Analysis indicates that the most reliable correlations obtain within narrow occupational, educational, and demographic bands. To improve match quality, the Department will establish a Register of Approved Decision Procedures. An inspectorate will monitor compliance.

  This approach necessarily entrenches existing bands. However, this is a technical requirement for improving correlation strength, not a social judgement. Widening the reference class dilutes the evidential value of cooperation. Therefore, measures that restrict the class are classified as efficiency improvements.

  Regarding the anti-correlated counterpart—the near-twin who defects precisely when you cooperate—the Department notes this poses a risk to the MECT. Such persons will be reclassified out of the reference class. This ensures the statistical model remains robust. The reclassification, rather than any fact about the persons concerned, is the operative mechanism for risk mitigation.

  **Gaming and Uptake**

  Citizens may make themselves predictable, or self-modify into the kind of person who cooperates, to improve their correlation. The Department treats this behaviour as simultaneously the programme's principal uptake target and a serious compliance risk. It remains unresolved whether these are two phenomena or one. Guidance will be issued to distinguish between lawful self-modification and unlawful signal manipulation. Stakeholders are advised to monitor their own decision procedures for drift.

  **Standardisation and Efficiency**

  The cheapest and most reliable way to raise correlation is to reduce the number of distinct decision procedures in the population. The Department proposes a programme of cognitive standardisation. In the limit, correlated parties become, for decision-theoretic purposes, a single agent. This enjoys perfect cooperation at the cost of there being no one left to cooperate with. The Department approaches this terminus as an efficiency saving. Costings suggest a reduction in administrative overhead of 100% as distinct agents merge into a unified decision-making entity. Savings will be reinvested into maintaining the correlation infrastructure.

  **Annex: Local Authority Queries**

  **Q1: How do we measure correlation in real-time?**
  A: Local authorities should utilise proxy metrics based on demographic homogeneity.

  **Q2: What if the ONS certifies the world is too small?**
  A: Authorities should proceed on the assumption of largeness pending further guidance.

  **Q3: Does the levy apply to non-monetary temptation?**
  A: Yes, all utility gains are subject to assessment.

  **Q4: If standardisation results in a single agent, who pays the levy?**
  A: The levy will be consolidated into a single administrative fee. The concept of payment becomes internal to the agent. Responses to this consultation should be submitted by 31 December 2023.
