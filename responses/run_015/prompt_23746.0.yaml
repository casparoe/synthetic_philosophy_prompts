      "war_propaganda_film",
      "serialist_chamber"
    ]
  }
  ```

  The sharpest divergence between infectiousness and goodness occurs in the **war_propaganda_film** (Infectiousness: 5, Goodness: 1). This case is critical for Tolstoy's ranking because it validates his two-tiered framework: the film succeeds perfectly as *art* by transmitting feeling universally and powerfully, yet it fails catastrophically as *good art* because the feeling transmitted (hatred/partisanship) opposes the religious perception of brotherhood. This divergence forces the work to the bottom tier despite its technical efficacy, demonstrating that for Tolstoy, moral utility outweighs aesthetic success. The **serialist_chamber** work also ranks poorly, but because it fails the primary test of infectiousness (scoring 1), it is categorized as counterfeit art rather than morally bad art, placing it last as a fundamental non-entity in Tolstoy's system.
