      *   **User Persona:** Retired natural scientist (geophysics/complex systems), new but serious student of philosophy. Reads primary texts. Interested in Hume's *Treatise* (Origin of Justice/Property) and David Lewis's *Convention*.
      *   **Task:** Analyze a specific paraphrased passage from Hume regarding justice, property, and convention.
      *   **Specific Input:** A paraphrase of Hume's argument (Treatise Book 3, Part 2, Section 2 mostly) and a constructed thought experiment ("Rotating-Crew Raft Scenario").
      *   **Requirements:**
