          3.  Relate to Lewis's analysis of convention. Does Hume's text support the Raft Scenario as a convention, or does it rely on richer social recognition? Identify the specific step if the latter.
      *   **Constraints:** No bibliographic guidance, reading lists, or citations. Focus on conceptual reading of the paraphrase and reasoned judgment.

  2.  **Deconstruct the Paraphrased Passage (Hume's Argument):**
      *   *Claim:* Justice/Property arises from convention, not promise.
      *   *Reasoning:* Promises derive force from convention (circular to define convention as promise). Convention = shared sense of common interest.
      *   *Mechanism:* "It is in my interest to leave another in possession... provided they do the same." Mutual expression/recognition $\rightarrow$ resolutions/behavior.
      *   *Example:* Two men rowing a boat (coordination without promise).
      *   *Objection:* Stability of possession arises *gradually* (slow progression, repeated experience), not like a sudden agreement.
      *   *Reply:* Gradualism doesn't negate convention. Repeated experience reinforces the *sense* that interest is common and gives confidence in *future regularity*.
      *   *Foundation:* Moderation/restraint founded on *expectation* of future regularity based on past experience.

  3.  **Analyze the "Rotating-Crew Raft Scenario":**
      *   *Setup:* 4 paddlers, 2 at a time, rotate every minute. Anonymous. No visual/auditory contact.
      *   *Feedback:* Only raft motion (straight vs. drift).
      *   *Goal:* Reach destination (self-interest).
      *   *Mechanism:* Adjust to residual motion. Arbitrary pattern stabilizes over time.
      *   *Key Feature:* No knowledge of *who* else is conforming. No mutual recognition of *agents*. Only feedback from the *system* (raft).
      *   *Comparison to Hume:* Hume emphasizes "mutually expressed and recognized" sense of interest. Raft has *implicit* coordination via system feedback, not *explicit* mutual recognition of agents.

  4.  **Drafting Section 1: Argumentative Structure:**
