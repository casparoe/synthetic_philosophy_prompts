answer: |-
  A wise monad, striving to embody the *caritas sapientis*, becomes obsessed with the moral arithmetic of universal happiness. He worries that because every substance mirrors the universe from a unique point of view, there is no common currency to weigh the happiness of a seraph against the satisfaction of a pebble. He spends eons trying to derive a conversion rate between their distinct perceptions, fearing that any misallocation of his benevolence would reduce the total perfection.

  Finally, he presents his findings to the Divine Architect: "I have found that the perspectives are incommensurable. I cannot calculate the optimal distribution of charity across the infinite hierarchy. How shall I act without risking a decrease in universal harmony?"

  The Architect replies, "You need not calculate the distribution."

  "But justice requires loving all according to their perfection!" the monad insists. "If I cannot measure their perfection relative to one another, I cannot be just."

  "Justice," says the Architect, "is not the allocation of harmony, but the distinct perception of its necessity. The total perfection was maximized before you began your calculation. Your charity does not change the sum; it is merely the phenomenon of the sum understanding itself."

  The monad pauses, looking at his endless scrolls of infinitesimals. "So if I had chosen to be cruel..."

  "Then that cruelty would have been the necessary shadow that makes this specific harmony the best of all possible ones. But you wouldn't have perceived it distinctly enough to be happy about it. Now stop calculating and mirror me more clearly."
