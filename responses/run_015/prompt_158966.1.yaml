  **Belief:** The encryption module is secure.
  **Basic Source:** Perceptual experience of the certificate; foundationalists count sensory seemings as basic.
  **Support Chain:** ["Certificate is visible", "Auditor is accredited", "Accreditation mandates verification", "Verification defines compliance"]
  **Verdicts:**
  *   **Foundationalism:** Justified. Regress terminates at the basic perceptual belief.
  *   **Coherentism:** Justified. Beliefs mutually support within a consistent system.
  *   **Infinitism:** Not Justified. Chain collapses into definitional circularity; fails non-collapsibility.
  **Intuitive Verdict:** Elena lacks justification because her reasons are circular labels, not evidence; matches Infinitism.
  **Load-bearing Feature:** The demand that each reason contribute independent content (non-collapsibility).
  **Removal Test:** If Elena cites a penetration test (independent reason), the chain extends without collapse; Infinitism and intuition shift to granting justification.
  **Objections:**
  *   **Foundationalist:** Basic beliefs require no further reasons; the regress stops legitimately.
  *   **Coherentist:** Circular support is virtuous when the system is comprehensive and consistent.

