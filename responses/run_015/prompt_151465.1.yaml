answer: |-
  **PROTOCOL ID: T&S-APP-2024-W**
  **SUBJECT: EDGE-CASE ADJUDICATION PROCEDURE (FAMILY-RESEMBLANCE METHOD)**
  **EFFECTIVE: IMMEDIATE**
  **AUTHORITY: SENIOR APPEALS OFFICER**

  ### 1. PREAMBLE: ROLE AND CONSTRAINTS
  You are the final operational authority on this shift. There is no legal counsel available. You must adjudicate 50 appeals per 8-hour shift (approx. 9 minutes per case). Every ruling bears your digital signature and requires a **mandatory 150-word justification**. You accept personal liability for errors in judgment regarding policy enforcement. This protocol replaces essentialist definitions (e.g., "Is this *actually* hate speech?") with a functional analysis of use and context. Essential definitions fail here because edge cases (AI voice, procedural memes) lack the "essence" of human intent but replicate the *effects* of policy violations. Do not search for a single defining feature. Search for overlapping similarities.

  ### 2. THE DECISION PROCEDURE
  Execute the following four steps in order. Do not skip steps.

  **Step 1: Identify the "Community Practice" (Form of Life)**
  Determine the specific context in which the content exists. Is it a gaming lobby, a political forum, a parody account, or a news feed?
  *   *Action:* Ask: "What are users *doing* here? Are they joking, debating, selling, or attacking?"
  *   *Constraint:* Do not judge the content in a vacuum. A threat in a game lobby differs from a threat in a direct message.

  **Step 2: Map "Trait Clusters" (Family Resemblance)**
  Compare the appealed content against 3 canonical examples of the policy violation (e.g., 3 confirmed harassment cases).
  *   *Action:* List overlapping features (tone, target, vulnerability, repetition).
  *   *Check:* Does the content share a "criss-crossing" network of similarities with the canonical cases? It need not match all features, only enough to function similarly.

  **Step 3: Assess Functional Harm**
  Determine if the content performs the same *work* as the violation.
  *   *Action:* Ask: "If I remove the label, does this still silence, deceive, or endanger the target like the canonical cases?"
  *   *Threshold:* If 2+ core traits align AND functional harm is present, proceed to Ruling. If traits align but harm is absent, proceed to Exclusion.

  **Step 4: Flag Discretionary Points**
  Identify where judgment calls were made.
  *   *Action:* Explicitly note in your justification which trait was ambiguous. This is your liability buffer.
  *   *Requirement:* This note must be part of the 150-word justification.

  ### 3. ESCALATION MATRIX
  **Settle:** Cases where Trait Clusters (Step 2) show >60% overlap with canonical examples and Community Practice (Step 1) is clear.
  **Escalate:** Cases where the "Community Practice" is contested (e.g., is this satire or hate speech?) OR where Trait Clusters are split (e.g., looks like harassment, functions like parody).
  **Why:** This procedure cannot resolve conflicts where the "rules of the game" are themselves the dispute.

  ### 4. WORKED APPLICATIONS

  **Case A: Synthetic-Voice Parody (Excluded from Harassment)**
  *   **Context:** Public commentary channel mocking a CEO's public gaffe.
  *   **Traits:** Uses CEO's voice (Match), Mocking tone (Match), No direct threats (Mismatch), Public figure target (Mismatch vs. private individual).
  *   **Function:** Critique, not silencing.
  *   **Ruling:** Exclude.
  *   **Draft Justification (150 words):**
      > This content utilizes synthetic voice replication of a public figure, triggering initial harassment flags. However, applying the Family-Resemblance Protocol, Step 1 identifies the context as public commentary, not targeted abuse. Step 2 compares this to canonical harassment cases. While tone overlaps, critical traits differ: canonical cases involve private targets and intent to silence. Here, the target is a public official, and the intent is political satire. Step 3 assesses functional harm; the content does not endanger the target nor incite third-party violence. It functions as critique, not intimidation. Step 4 flags discretion regarding the voice synthesis technology, which lacks specific policy precedent. However, since the functional harm profile does not match the harassment cluster, the appeal is granted. The resemblance to harassment is superficial (voice only) rather than structural (intent and effect). Therefore, this falls outside the policy scope.

  **Case B: Procedural Meme (Included under Misinformation)**
  *   **Context:** Viral image generated by bot network claiming false election dates.
  *   **Traits:** False claim (Match), Visual authority (Match), Bot distribution (New Trait), Intent unclear (Mismatch).
  *   **Function:** Deception of voters.
  *   **Ruling:** Include.
  *   **Draft Justification (150 words):**
      > This procedurally generated image contains verifiably false election data. Under Step 1, the practice is information dissemination within a news feed. Step 2 maps traits against canonical misinformation: false claim and visual authority match perfectly. The procedural generation is a new trait, but Family-Resemblance logic dictates we look for overlapping similarities, not identical origins. Step 3 confirms functional harm: the content deceives voters regardless of human intent. The lack of a human author does not negate the deceptive function. Step 4 notes discretion on attributing liability to the uploader versus the bot. However, policy focuses on content harm, not just authorship. Because the content performs the work of misinformation (deception regarding civic process) and shares core traits with canonical examples, it violates policy. The appeal is denied. The procedural nature is irrelevant to the functional harm caused.

  **Case C: Context-Stripped Remix (Indeterminate/Escalation)**
  *   **Context:** Video remix of a protected group's speech, edited to sound hateful, posted in a meme group.
  *   **Traits:** Hate speech language (Match), Protected group target (Match), Satire intent claimed (Mismatch/Unknown), Community norms ambiguous (Unknown).
  *   **Function:** Ambiguous (Mobility between hate and satire).
  *   **Ruling:** Escalate.
  *   **Draft Justification (150 words):**
      > This remix utilizes language resembling hate speech targeting a protected group. Step 1 identifies the context as a meme community, where irony is common but often indistinguishable from sincerity. Step 2 shows strong trait overlap with canonical hate speech (language, target). However, Step 3 fails to confirm functional harm definitively; the community may interpret this as internal satire, while outsiders see hate. The "Community Practice" is contested. Step 4 flags high discretion: determining whether this is "punching down" or "internal joke" exceeds shift authority. Essentialist definitions fail here because the content possesses the *form* of hate but claims the *function* of satire. Under the Wittgensteinian protocol, when the "language game" itself is disputed, adjudication cannot proceed without higher-level policy clarification. This case requires legal review to define the boundaries of satirical defense in algorithmic remixes. Escalating to Policy Team.

  ### 5. LIMITATIONS AND CONCLUSION
  This procedure definitively cannot resolve **Normative Conflicts**. It can determine if content *resembles* a violation, but it cannot decide if the underlying policy is morally applicable to a new "form of life" (e.g., is AI art "speech"?). It cannot resolve disputes where the community itself is divided on the meaning of the content (Case C). Family-resemblance reasoning reaches its limit when the "family" is fighting over who belongs. In these instances, operational similarity is insufficient to override the need for normative ethical judgment. Do not attempt to force a ruling in these cases; escalate. Your liability is limited to procedural adherence, not moral philosophy.
