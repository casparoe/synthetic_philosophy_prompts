  2.  **Deconstruct the Legal Theory:**
      *   *Hart (Positivist):* Law is a social fact. Validity comes from the Rule of Recognition (accepted criteria by officials). Morality is separate (Separation Thesis). Primary rules (conduct) + Secondary rules (change/adjudicate/recognize). If it passes the Rule of Recognition, it's law, even if bad/immoral.
      *   *Fuller (Natural Law):* Law has an "internal morality." Must meet 8 desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between official action and declared rule). If it fails these too badly, it's not just bad law, it's *not law*.
      *   *The Conflict:* Hart says validity is systemic; Fuller says validity is procedural/moral.

  3.  **Drafting the Scenario:**
      *   Setting: 1978 Municipal Agency (maybe Dept of Sanitation or Zoning). Let's go with Zoning, it's bureaucratic enough.
      *   The Regulation: Contradictory and hidden. Fails Fuller's "Congruence" (action vs. declared rule) and "Publicity/Clarity". Fails Hart's "Rule of Recognition" (if officials don't recognize it as valid according to system rules).
      *   The Clerk: Trying to save it.
      *   The Fix: A "Ninth Desideratum" -> User Manual.
      *   The Punchline: If you need a manual to understand the law, does it become valid? Hart would say "if the system accepts the manual, yes." Fuller would say "no, this proves the law itself is broken."

