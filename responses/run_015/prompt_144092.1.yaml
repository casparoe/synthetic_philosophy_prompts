prompt: |-
  Draft the joint statment of an adversarial collaboration between a Theravada ethicist who holds that cetana (intention/volition) is the sole determinant of karmic weight and that actual outcomes are morally irrelevant, and a Buddhist consequentialist who holds that reducing aggregate dukkha is the only coherent aim of the path and that cetana is only instrumentally valuable. I want the claims both can sign about karma, rebirth, and the Bodhisattva ideal; the precise disagreement phrased so each side accepts the wording of its own view; the cruxes—especially whether an act done with pure intention that accidentally causes massive suffering generates negative karma for the agent; and for each crux a shared test case with both sides' predictions written down in advance. Format it as a numbered agreed-claims section followed by a disagreements table. Don't include bibliographies or citation requests—just work it out from the concepts.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Participants:**
          *   Theravada Ethicist (Deontological/Volitional): *Cetana* (intention) is the sole determinant of karmic weight. Outcomes are morally irrelevant.
          *   Buddhist Consequentialist: Reducing aggregate *dukkha* (suffering/unsatisfactoriness) is the only coherent aim. *Cetana* is instrumentally valuable (good because it usually leads to good outcomes).
      *   **Topics:** Karma, Rebirth, Bodhisattva Ideal.
      *   **Requirements:**
          *   Numbered agreed-claims section.
          *   Disagreements table (precise wording, cruxes, shared test cases with predictions).
          *   No bibliographies/citations.
          *   Tone: Collaborative but adversarial (clear disagreement).
      *   **Specific Crux:** Does an act with pure intention that accidentally causes massive suffering generate negative karma?

  2.  **Deconstruct the Positions:**

      *   **Theravada Ethicist (TE):**
          *   *Core:* Karma = *Cetana*. "Intention, I tell you, is karma" (AN 6.63).
          *   *Outcome:* Irrelevant to the moral quality of the act or the karmic seed planted.
          *   *Rebirth:* Determined by the quality of volition at death and throughout life.
          *   *Bodhisattva:* Admired for vow and intention, but the path is defined by the perfection of virtue/intention (Paramis), not necessarily successful salvation of all beings (which is impossible anyway).
          *   *Test Case:* Pure intention + Bad Outcome = No negative karma.

      *   **Buddhist Consequentialist (BC):**
          *   *Core:* Goal = Cessation of *Dukkha*. Ethics is soteriological engineering.
          *   *Intention:* Valuable only insofar as it reliably produces good outcomes. Bad intention usually leads to bad outcomes, hence it's "karmically" negative.
          *   *Outcome:* The actual reduction or increase of suffering is the metric of karma's fruit.
          *   *Rebirth:* A framework for understanding long-term causal consequences of actions on the continuum of suffering.
          *   *Bodhisattva:* The ideal agent who maximizes suffering reduction across lifetimes.
          *   *Test Case:* Pure intention + Bad Outcome = Negative karma (because suffering increased).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground without blurring the distinct lines.
      *   *Common Ground:* Both are Buddhists. Both accept causality (*paticca-samuppada*). Both accept *dukkha* is the problem. Both accept rebirth (as a working model). Both accept the Noble Eightfold Path as the method.
      *   *Drafting points:*
          1.  Causality is fundamental.
          2.  *Dukkha* is the central problem to be addressed.
          3.  *Cetana* is a necessary component of action (no action without mind).
          4.  Rebirth is part of the cosmological framework (even if interpreted differently).
          5.  The ultimate goal is liberation (Nirvana).

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need specific columns: Topic, Theravada Ethicist Position, Consequentialist Position, The Crux (Question), Shared Test Case, TE Prediction, BC Prediction.
      *   *Topic 1: The Definition of Karma.*
          *   TE: Karma is the volitional impulse itself.
          *   BC: Karma is the causal chain resulting in suffering/happiness.
      *   *Topic 2: Moral Weight of Outcomes.*
          *   TE: Irrelevant to karmic accumulation.
          *   BC: Determinative of karmic weight.
      *   *Topic 3: The Bodhisattva Ideal.*
          *   TE: Defined by the vow and the cultivation of paramis (intention/virtue).
          *   BC: Defined by the efficacy of alleviating suffering in the world.
      *   *Topic 4: The Crux (The Accident Case).*
          *   This needs to be the highlight.
          *   *Scenario:* A monk moves a rock to clear a path (kind intention). The rock dislodges a snake that bites a child, causing death (massive suffering).
          *   TE Prediction: No negative karma for the monk. The death is the child's karma or random causality.
          *   BC Prediction: Negative karma accrues. The action increased aggregate *dukkha*, regardless of intent.

  5.  **Refining the Wording:**
      *   Ensure the TE doesn't sound like they don't care about suffering (they do, but it's not the *definition* of karma).
      *   Ensure the BC doesn't sound like a secular utilitarian (they must remain Buddhist, viewing *dukkha* reduction as the soteriological goal).
      *   Make sure the "Rebirth" section acknowledges the tension: TE sees rebirth as fruit of intention; BC sees rebirth as the continuum along which consequences play out.

  6.  **Review against Constraints:**
      *   Numbered agreed-claims? Yes.
      *   Disagreements table? Yes.
      *   No citations? Yes.
      *   Specific crux included? Yes.
      *   Predictions written in advance? Yes.

  7.  **Final Polish:**
      *   Check tone. It should be formal, precise, and philosophical.
      *   Ensure the "Joint Statement" header is clear.
      *   Make sure the distinction between *karma* (the act/seed) and *vipaka* (the fruit) is handled carefully, as this is often where the debate lies. The TE says the seed *is* the intention. The BC says the seed is defined by the fruit it produces.

      *(Self-Correction during drafting)*: I need to be careful with the Consequentialist view on Rebirth. A strict consequentialist might view rebirth as metaphorical, but the prompt implies they hold it as part of the framework ("claims both can sign about... rebirth"). I will frame it as the "temporal horizon of consequences."
      *(Self-Correction on Bodhisattva)*: Theravada does have Bodhisatta theory (future Buddhas), so the TE can sign onto it, but interprets it through the lens of Parami cultivation (intention) rather than universal salvation efficacy.

