answer: |-
  Your instincts are excellent. You have spotted the exact point where a popular summary simplifies a complex philosophical position into something Hobbes would likely reject.

  A Hobbes specialist would agree with about 60% of that passage but would flag the interpretation of "convention," the link to nature, and the conclusion drawn from the circle-squaring episode as misleading or historically unfair.

  Here is a breakdown of what is fair, where the summary slides, and how the materialism fits in.

  ### 1. What the passage gets right
  *   **Geometry as the model of certainty:** Hobbes absolutely revered geometry (he reportedly discovered Euclid at age 40 and was hooked). He believed it was the only science that had achieved genuine demonstration.
  *   **Knowledge through causes (Genesis):** The passage is correct that Hobbes prioritized "genetic" definitions. For Hobbes, to know a thing is to know how it is generated. A circle isn't just a set of points equidistant from a center; it is the trace of a line rotating around a fixed point. This fits his broader metaphysics: to know something is to know the **motion** that produced it.
  *   **The Political Analogy:** Hobbes did intend to do for politics what geometry did for figures. In *De Cive* and *Leviathan*, he argues we can have certain knowledge of the state because **we make the state.** We do not make the weather or the stars (so physics/astronomy is conjectural), but we construct the Commonwealth through covenant. Therefore, we can know its properties with geometric certainty.

  ### 2. Where the summary slides: "Convention" vs. "Materialism"
  This is the crux of your suspicion. The passage claims geometric theorems are "true by convention... and tell us nothing about nature." This is a half-truth that obscures Hobbes's actual position.

  **The Nominalist Side:**
  Hobbes was a nominalist. He believed that "truth" properly speaking resides in language, not in things. A proposition is true if the names are joined correctly. In that specific sense, geometric truth is about the correct use of definitions (stipulations).

  **The Materialist Side:**
  However, Hobbes was *also* a thoroughgoing materialist. He did not believe geometry was a meaningless game like chess. For Hobbes, the "names" in geometry refer to **real quantities of body and motion.**
  *   **Why it tells us about nature:** Because Hobbes believes the universe *is* matter in motion. Geometry is the study of abstracted motion. Therefore, geometric reasoning *does* apply to nature, because nature is fundamentally geometric/mechanical.
  *   **Why it is certain:** It is not certain *just* because we made up the rules. It is certain because **we are the cause of the figure.** In physics, God (or nature) is the cause of phenomena, and we have to guess at the hidden mechanisms. In geometry, *we* move the pen to create the line. Since we know exactly what motion we performed, we have perfect knowledge of the cause.

  **The Specialist Verdict:**
  A specialist would say the summary is wrong to imply geometry tells us "nothing about nature." For Hobbes, geometry is the *only* science that tells us certain things about nature, because it isolates the fundamental constituent of nature (motion) in a way that pure observation cannot. It is not a "game"; it is the physics of abstracted bodies.

  ### 3. The Politics Connection
  The summary suggests politics is certain "since you only need to fix your definitions and derive." This is a caricature.

  Hobbes doesn't think politics is certain just because he defines "Justice" arbitrarily. He thinks it is certain because the "elements" of politics (human passions, fear, desire) are intelligible motions within us. We can know them from the inside.
  *   **The Analogy:** Just as we construct a circle by moving a line, we construct a Commonwealth by moving (transferring) our rights. Because we understand the "motion" of human passion and the "construction" of the covenant, we can deduce the necessary properties of the Sovereign.
  *   **The Error:** The summary makes it sound like linguistic stipulation alone creates political truth. For Hobbes, the definitions must track the real motions of human nature. If you define "Man" incorrectly, your political deductions will fail, just as a geometric proof fails if your definition of a line is incoherent.

  ### 4. The Circle-Squaring Episode
  It is true that Hobbes spent the last decades of his life claiming to have squared the circle. It is also true that John Wallis (the Savilian Professor of Geometry at Oxford) and others demolished his proofs. Hobbes became notoriously combative, accusing them of ignorance and conspiracy.

  **Does this invalidate his philosophy?**
  The popular history concludes: *Hobbes failed at math, therefore his idea that math is the model of knowledge is a "castle in the air."*
  A specialist would call this a **genetic fallacy** (or simply *ad hominem*).
  *   **Competence vs. Epistemology:** Newton believed in alchemy and biblical chronology; that doesn't invalidate the *Principia*. Descartes' physics was largely wrong; that doesn't invalidate the *Cogito*. That Hobbes was a bad mathematician does not prove his epistemological distinction between "knowledge of consequences" (geometry/politics) and "knowledge of facts" (physics) is wrong.
  *   **Why it matters:** The episode *does* show that Hobbes was hubristic and perhaps didn't understand the rigorous standards of the emerging mathematical community. It undermines his *authority* to lecture mathematicians, but it doesn't disprove his philosophical claim that geometry offers a different *kind* of certainty than physics.

  ### Summary: How to read the passage
  *   **Keep:** Hobbes loved geometry; he thought construction/genesis was key to certainty; he tried to model politics on this method; he failed to square the circle.
  *   **Discard:** The idea that geometry is "just a game" that tells us nothing about nature. (For Hobbes, it tells us the most about nature).
  *   **Discard:** The idea that the failed quadrature proves his philosophical project was nonsense. (It proves he was stubborn and mathematically outmatched, not that his philosophy of science was incoherent).

  **The Synthesis you were looking for:**
  Hobbes's materialism and his view on definitions *do* fit together, but not in the way the popular history suggests.
  *   **Definitions:** We stipulate names (Nominalism).
  *   **Reality:** Those names refer to motions of bodies (Materialism).
  *   **Certainty:** We have certainty because we generate the motions ourselves (Constructivism).

  The history book you are reading likely leans too heavily on a "linguistic" reading of Hobbes (popular in mid-20th century scholarship) and ignores the "materialist" reading (which has had a strong resurgence). Hobbes isn't saying "Geometry is true because we say so." He is saying "Geometry is true because we say so, **and** what we are talking about is the very stuff the universe is made of, which we are manipulating directly."

  Your skepticism is well-founded. The passage confuses Hobbes's theory of *truth* (which is linguistic) with his theory of *knowledge* (which is causal and material).
