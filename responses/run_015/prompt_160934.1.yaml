  Based on the six verdicts you provided, I can reconstruct your colleague's position with reasonable confidence, though there is one critical area of underdetermination that your two new cases will probe. Below is an analysis of her principle, predictions for your new cases, and a proposal for a "killer case" to close your seminar.

  ### 1. Reconstruction of the Principle

  Your colleague's track record effectively rules out **Strict Kantianism** (which requires acting *from the thought* of duty) and **Markovits-Style Judgmentalism** (which requires acting on one's *own deliberative judgment* about reasons).
  *   **Evidence:** The *Canal Rescuer* and *Experienced Nurse* receive full moral worth despite lacking occurrent deliberation or explicit thoughts about duty. This suggests that the *phenomenology of deliberation* is not necessary for moral worth.

  Her verdicts are jointly consistent with a hybrid of **Arpaly-Style Tracking** (acting from motives that track right-making features) and **Quality of Will** (acting from motives that manifest appropriate concern).
  *   **Evidence for Tracking/Concern:** The *Grocer* and *Executive* lack worth because their motives track prudence/reputation, not honesty/charity. The *Wallet Returner* lacks worth because, although the act is right, his motive tracks *social shame*, not the *property rights* of the owner (he thinks keeping it is fine). The *Hospital Visitor* has worth because 'ought' tracks the moral demand, even without desire.
  *   **Evidence against Deep-Self/History:** The *Nurse* case is crucial. Her mind is "elsewhere," implying her kindness is habitual. Habit is a form of self-engineering over time. If habituated virtue counts, the *history* of how a motive was acquired seems less important than its *current alignment* with moral value.

  **The Reconstruction:** She likely holds a **Current-State Quality of Will** view. An agent has moral worth if, at the time of action, their operative motives manifest appropriate concern for the right-making features of the situation. The genealogy of the motive (how it was acquired) matters less than its current content and alignment.

  ### 2. Assessment of Pinning Down

  Her track record **does not** pin down the **User's Rule** (Tuned vs. Routed).
  *   **Why:** Her cases distinguish between *self-interested* motives (Grocer, Executive) and *moral/other-regarding* motives (Nurse, Visitor). They do not distinguish between *naturally developed* moral motives and *externally engineered* or *deferential* moral motives.
  *   **The Gap:** The *Nurse* has a habituated will, but presumably, she internalized that habit through professional training aimed at care. We do not know if your colleague would grant worth to an agent whose "tuning" was explicitly **deferential** (relying on another's judgment) or **instrumentally engineered** (acquired for selfish ends but now functioning morally). This is exactly where your two new cases intervene.

  ### 3. Predictions for the New Cases

