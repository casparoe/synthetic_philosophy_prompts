  ### 4. The "Killer Case" for the Seminar

  To force a commitment in the seminar, you need a case that separates **Current-State Tracking** (her likely view) from **Tuning/Source Constraints** (your view and potentially a Deep-Self view). The Fundraiser case does this, but a third case can sharpen the distinction by isolating **Internalized Deference**.

  **Proposed Case: The Surrogate Conscience**
  > An agent knows she lacks moral insight. She adopts a policy of deferring to a moral saint. She does not ask the saint for instructions each time (like the AI Manager). Instead, she allows the saint to mentor her until she internalizes the saint's values. Years later, she visits a sick friend out of a desire she now feels as her own, which perfectly aligns with the saint's judgment. She knows this desire exists only because of the saint's influence, but she fully endorses it.

