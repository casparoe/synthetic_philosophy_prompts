prompt: |-
  Right, quick one. I've got a fifty-minute slot next week with about twenty first-years — mostly CS, a few psychology — and I want to spend it making them *feel* what it means to induce a concept from a handful of examples. Bongard problems are the vehicle: six figures on the left, six on the right, some rule separates them.

  Don't solve any for me and don't write the explanation I should give. Give me the plan for the explanation.

  Some vocabulary first so we're not talking past each other — these are my words, rename them if mine are bad. A rule *fits* a problem if it's true of everything in the left panel and false of everything in the right. The *intended* rule is the one the setter had in mind, which needn't be the only one that fits. A *list rule* fits by just naming the left-hand figures ("it's one of these six") — it works by construction and generalises to nothing. And call a problem *brittle* if deleting any single figure from either panel lets a rule strictly simpler than the intended one fit.

  What I want back:

  1. The order the pieces have to go in, and what depends on what. My hunch is that "there's no unique answer" lands completely differently depending on whether they've already tried and failed to find one, but tell me if I've got that backwards.
  2. The one problem to build the whole session around, and what it has to have and not have. I'm thinking something geometric where the intended rule is about how the shapes relate to *each other* rather than a property each shape has on its own, and where a list rule is obviously on offer — but say if that's one example doing too much work.
  3. The misconceptions, in the order they'll actually turn up, and exactly where in the sequence to head each off. Ones I'm expecting: that the task is to find the rule; that "simplest rule wins" is obvious rather than a choice of description language; that more examples would sort it out; that fitting and generalising are the same thing. Add the ones I've missed, and definately tell me if one of mine isn't worth the time.
  4. One thing I should flatly refuse to go into at this level, and say out loud that I'm refusing it. My instinct is to dodge formal learning theory entirely — VC dimension and that sort of thing — but maybe the honest move is one sentence of hand-waving instead of silence.
  5. The question I ask in the last five minutes that tells me whether the idea landed rather than whether they enjoyed themselves.

  And last: flag the bit of the plan you're least confident about, and say what would change your mind — what argument, or what actually happening in the room, would make you reorder it or swap the example out.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Context:** 50-minute session, ~20 first-year students (mostly CS, some Psych).
      *   **Goal:** Make them *feel* concept induction from examples (Bongard problems).
      *   **Constraints:** Do *not* solve problems. Do *not* write the explanation script. Provide the *plan* for the explanation.
      *   **Vocabulary:** *Fits*, *Intended*, *List Rule*, *Brittle*. (Use these or critique them).
      *   **Deliverables:**
          1.  Order of pieces/dependencies (specifically regarding "no unique answer").
          2.  The one anchor problem (criteria).
          3.  Misconceptions (order of appearance, how to head off, add/remove mine).
          4.  One thing to refuse (VC dimension vs. silence).
          5.  The final assessment question.
          6.  Confidence flag (least confident part + what would change mind).

  2.  **Deconstruct the Audience & Goal:**
      *   **CS Students:** Likely think algorithmically, look for deterministic rules, might overfit (list rules), might underfit (too abstract).
      *   **Psych Students:** Likely think about perception, gestalt, human categorization, might struggle with formalizing rules.
      *   **Goal:** "Feel" induction. This means experiential learning > theoretical lecturing. They need to struggle, fail, realize why they failed, and then formalize the struggle.
      *   **Time:** 50 minutes is tight. 5 min intro, 15 min activity, 15 min debrief/discussion, 10 min synthesis/wrap, 5 min assessment.

  3.  **Drafting Section 1: Order of Pieces:**
      *   *User's Hunch:* "There's no unique answer" lands differently *after* failure.
      *   *My Analysis:* The user is right. If you tell them "there's no right answer" first, they won't engage seriously. They need to invest cognitive effort, find a rule, feel confident, then have that confidence shaken by a counter-example or a peer's different rule.
      *   *Sequence:*
          1.  Do the task (find the rule).
          2.  Reveal divergence (different rules fit).
          3.  Introduce vocabulary (Fits vs. Intended).
          4.  Discuss selection criteria (Simplicity/Generalization).
      *   *Dependency:* You can't explain *why* we need a bias (simplicity) until they see that data alone doesn't determine the hypothesis.

  4.  **Drafting Section 2: The Anchor Problem:**
      *   *Criteria:* Geometric, relational (not just property), list rule obvious, not too hard, not too easy.
      *   *Idea:* Classic Bongard #45 (circles vs triangles) is too simple (property). #27 (size) is too simple.
      *   *Better:* Something involving relative position or count.
      *   *Specific Candidate:* A problem where Left = "Shapes inside shapes" and Right = "Shapes next to shapes". Or Left = "3 objects" vs Right = "4 objects".
      *   *Refinement:* The prompt asks for *relational*. Let's go with "Containment" vs "Adjacency" or "Pointing".
      *   *Constraint:* Must make the *List Rule* tempting but unsatisfying.
      *   *Selection:* A problem where the visual distinction is clear, but the verbalization varies. Let's suggest a specific *type* rather than a specific numbered problem (since numbering varies by edition), but describe the structure.
      *   *Structure:* Left: Small shape inside large shape. Right: Small shape outside large shape.
      *   *Why:* "Inside" is relational. List rule is easy ("It's these 6 pics").
      *   *Critique of User's Idea:* "One example doing too much work?" No, one deep dive is better than three shallow ones for a 50-min slot.

  5.  **Drafting Section 3: Misconceptions:**
      *   *User's List:*
          1.  Task is to find *the* rule (vs *a* rule).
          2.  Simplest rule wins is obvious.
          3.  More examples sort it out.
          4.  Fitting = Generalizing.
      *   *My Additions/Edits:*
          1.  *The "Psych" Trap:* "It's what the author meant." (Appeal to authority vs. logic).
          2.  *The "CS" Trap:* "I can write a script to check this." (Computability vs. Induction).
          3.  *Refinement on "More examples":* This is crucial. They think $N+1$ solves ambiguity. It doesn't (Quine's underdetermination).
      *   *Order:*
          1.  "Find the rule" (Immediate).
          2.  "More examples would fix it" (When ambiguity arises).
          3.  "Simplest wins is obvious" (When comparing competing rules).
          4.  "Fitting = Generalizing" (When discussing List Rules).
      *   *Head off:* Don't head off "Find the rule" immediately; let them hit the wall. Head off "More examples" by showing a seventh pair that fits *both* competing rules.

  6.  **Drafting Section 4: The Refusal:**
      *   *Option:* VC Dimension / Formal Learning Theory.
      *   *Decision:* Refuse it. It kills the "feeling."
      *   *Wording:* "We are not doing math today, we are doing epistemology." Or "I am refusing to give you the formula that solves this, because the formula is the struggle."
      *   *Better:* Refuse the idea that there is a *metric* for simplicity we can agree on right now. "I refuse to define 'simple' for you." This forces them to realize simplicity is context-dependent (CS vs Psych).

  7.  **Drafting Section 5: The Final Question:**
      *   *Goal:* Test understanding, not enjoyment.
      *   *Bad:* "Did you like this?"
      *   *Bad:* "What is the rule?"
      *   *Good:* "Here is a new rule. Does it fit? Does it generalize?"
      *   *Better:* "I will give you a rule that fits all 12 figures. Why might I still reject it?" (Tests List Rule vs. Generalization).
      *   *Best:* "If I add a 7th pair, can I prove your rule wrong? If not, what have you actually done?" (Tests falsifiability/induction limit).
      *   *Selection:* "I have a rule that fits all 12 figures perfectly: 'The left side contains figures that appear on the left side.' Why is this useless?" (Tests the List Rule concept directly).

  8.  **Drafting Section 6: Confidence Flag:**
      *   *Least Confident:* The "One Problem" choice.
      *   *Reason:* If the problem is too hard, they spend 20 mins staring. If too easy, they solve it in 2 mins and get bored.
      *   *Change Mind:* If during the first 5 mins of the session, the room is dead silent vs. buzzing. I need a backup problem ready.
      *   *Vocabulary:* "Brittle" is a great term, keep it. "List Rule" is clear.

  9.  **Review and Refine:**
      *   *Tone:* Professional, pedagogical, concise.
      *   *Check Constraints:* Did I solve the problem? No. Did I write the script? No.
      *   *Vocabulary Check:* Use *Fits*, *Intended*, *List Rule*, *Brittle*.
      *   *Timing:* Ensure the plan fits 50 mins.
      *   *Psych/CS Mix:* Acknowledge the tension. CS wants codeable rules; Psych wants perceptual primitives.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Refusal:* Refusing to define "simple" is good, but refusing VC Dimension is what the user asked about. I should explicitly address the VC Dimension instinct. The user asked: "My instinct is to dodge formal learning theory... maybe the honest move is one sentence." I need to advise on *that*.
      *   *Advice:* Dodge it. One sentence creates more questions than it answers. Silence is better, or a "We will touch this in Year 3" placeholder.
      *   *Correction on Final Question:* Make sure it distinguishes between *fitting* and *inducing*.
      *   *Correction on Order:* Ensure the "No unique answer" reveal happens *after* the struggle.

  11. **Final Output Generation** (matching the structure requested).
      *   1. Order/Dependencies.
      *   2. Anchor Problem.
      *   3. Misconceptions.
      *   4. Refusal.
      *   5. Final Question.
      *   6. Confidence Flag.

      *(Self-Correction on Vocabulary)*: The user defined "Brittle". I should ensure I use that in the plan where appropriate (probably in the misconceptions or problem selection section).
      *(Self-Correction on Problem)*: The user suggested relational. I should confirm that's the right call. Yes, property-based (e.g., "all circles") is too easy to formalize. Relational (e.g., "pointing at") allows for multiple verbalizations ("pointing", "orientation towards", "axis alignment").

      *(Refining the Refusal)*: The user asked about VC Dimension. I should tell them to refuse *that*, but refuse it by saying "That is the map, this is the territory."

      *(Refining the Final Question)*: Needs to be actionable. "Why is the List Rule a failure of induction?"

      Let's assemble.

      *Wait, one check on the "Brittle" definition:* "Deleting any single figure... lets a rule strictly simpler than the intended one fit."
      This is a sophisticated concept. I need to make sure the plan actually *uses* this concept. Maybe in the "Misconceptions" or "Problem Selection". If the problem isn't brittle, they won't understand why the examples matter. The problem *must* be brittle to demonstrate the value of the dataset size. I need to emphasize this in Section 2.

      *Wait, check on "One sentence of hand-waving":* The user asks if they should do one sentence or silence. I need to take a stance. Stance: Silence/Deferral. One sentence creates a "black box" mystique that distracts from the phenomenological goal.

      *Wait, check on Misconceptions:* "That the task is to find the rule." I need to make sure the plan *creates* this misconception intentionally to break it.

      Okay, ready to write.cw
answer: |-
  1. **Order of Pieces & Dependencies**
  Your hunch is correct: **Struggle precedes theory.** If you state "there is no unique answer" in the preamble, you grant permission to disengage. They need to invest cognitive capital in a hypothesis before you devalue it.

  *   **Phase 1: The Trap (15 mins).** Present the problem. Ask for *the* rule. Let them commit. Do not validate any answer yet.
  *   **Phase 2: The Collision (10 mins).** Elicit two distinct rules that both *fit* the data (e.g., one geometric, one topological). Write them side-by-side.
  *   **Phase 3: The Vocabulary (10 mins).** *Now* introduce your terms. Define *Fits* (both rules do this). Define *Intended* (irrelevant for now). Introduce *List Rule* (show how it technically *fits* but feels like cheating).
  *   **Phase 4: The Criterion (10 mins).** Discuss how to choose between the two valid rules. This is where you introduce the need for a bias (simplicity/generalization) without formalizing it.
  *   **Phase 5: Assessment (5 mins).**

  **Dependency:** You cannot explain why *Fits* $\neq$ *Intended* until they have produced two competing hypotheses that both *Fit*. You cannot explain why *List Rules* are degenerate until they have seen a "real" rule that *Fits* but is still unsatisfactory.

  2. **The Anchor Problem**
  Stick with **one** problem. Three shallow problems teach pattern matching; one deep problem teaches epistemology.

  *   **Criteria:**
      *   **Relational:** The rule must depend on the interaction between elements (e.g., "small shape is inside large shape" vs. "small shape is outside"). Avoid single-property rules (e.g., "all circles"), as these are too easily formalized and don't invite competing descriptions.
      *   **High "List Rule" Temptation:** The figures should be distinct enough that memorization feels plausible, forcing you to explicitly argue why the *List Rule* is a failure of induction.
      *   **Brittleness:** The problem *must* be **brittle** by your definition. If you remove one figure, a simpler, wrong rule must become viable. This proves the necessity of the specific dataset size.
      *   **Avoid:** Color or subtle shading (projection issues). Stick to black/white line art.
  *   **Recommendation:** A "Containment" problem (Left: shapes inside shapes; Right: shapes beside shapes).
      *   *Why:* It invites competing vocabulary ("inside/outside" vs. "connected/disconnected" vs. "enclosure"). It is relational. It is easy to construct a *List Rule* for. It is easy to make **brittle** (e.g., if you remove one "inside" case, a rule like "shapes are touching" might suddenly *fit* the remaining left panel).

  3. **Misconceptions (Order of Appearance & Intervention)**
  1.  **"There is one right answer."**
      *   *When:* Phase 1.
      *   *Intervention:* Do not head this off. Let them believe it. The shock in Phase 2 is the learning moment.
  2.  **"More examples would resolve the ambiguity."**
      *   *When:* Phase 2 (immediately after you reveal two valid rules).
      *   *Intervention:* Show a hypothetical 7th pair that is consistent with *both* competing rules. Explain that data accumulation alone cannot break the tie; a *bias* is required.
  3.  **"Fitting is the same as Generalizing."**
      *   *When:* Phase 3 (during *List Rule* discussion).
      *   *Intervention:* Ask: "If I show you a 13th figure, can the *List Rule* tell me which side it belongs to?" (No, unless it's in the list). Contrast this with a relational rule.
  4.  **"Simplest rule wins is obvious."** (Your misconception #2)
      *   *When:* Phase 4.
      *   *Intervention:* **Challenge this.** Ask the CS students to define "simple" (code length?) and the Psych students to define "simple" (perceptual primitives?). Show they disagree. This proves simplicity is a *choice of description language*, not an objective truth.
  5.  **Missed Misconception: "The Intended Rule is the True Rule."**
      *   *When:* Phase 3.
      *   *Intervention:* Explicitly decouple *Intended* from *Valid*. The setter's intent is a historical fact, not a logical constraint. A rule different from the intended one is still a valid induction if it generalizes.

  6.  **The Refusal**
  **Refuse to define "Simplicity."**
  Your instinct to dodge VC dimension is correct, but a hand-waving sentence ("It's about complexity") is worse than silence because it implies there *is* a definition you're withholding.
  *   **Say this:** "I am refusing to give you the metric for simplicity. In CS, you might count bits. In Psych, you might count perceptual gestalts. If I give you the metric, I solve the induction problem for you. The hard part isn't finding the rule; it's agreeing on what counts as 'simple'."
  *   **Why:** This forces them to realize that induction requires a *prior* agreement on the hypothesis space, which is the core theoretical takeaway without needing the math.

  7. **The Final Question**
  Do not ask "What did you learn?" (Too vague). Do not ask "What was the rule?" (Misses the point).
  *   **Ask:** "I have a rule that *fits* all 12 figures perfectly: *'The left panel contains exactly these six images.'* Why is this a failure of induction?"
  *   **Success Criteria:** They must mention **generalization** or **compression**. If they say "because it's boring" or "because it's cheating," they haven't landed the concept. They need to articulate that a *List Rule* has zero predictive power for $N+1$.

  8. **Confidence Flag**
  **Least Confident:** The **Brittleness** of the chosen problem.
  *   **Risk:** If the problem is not actually **brittle** (i.e., if you can remove a figure and the intended rule is still the simplest one that fits), the lesson about dataset size and necessity of examples collapses. Constructing a truly **brittle** Bongard problem is harder than it looks.
  *   **What Changes My Mind:** If, during your prep, you find that removing a figure *doesn't* allow a simpler wrong rule to *fit*, swap the problem. You need a problem where every figure is "holding the door shut" against a simpler, wrong hypothesis. If you can't find one, drop the term **brittle** from the session and focus solely on the *List Rule* vs. *General Rule* tension. Trying to force a definition of **brittle** on a non-**brittle** example will confuse the CS students specifically.
