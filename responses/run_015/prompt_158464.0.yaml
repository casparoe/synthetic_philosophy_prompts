  Here is the evaluation of your eight items using the Tumor Test, ranked by desert-load, followed by the systemic analysis you requested.

  ### The Ratings & Tiers

  **1. Actuarial quarantine**
  *   **Desert Load:** 1/10
  *   **Tumor Test:** Pass (Yes, you quarantine the tumor guy).
  *   **Tier:** Clean for Skeptic.
  *   **Why:** Purely risk-based containment; the "crime" is irrelevant, only the danger matters.
  *   **Cheat Flag:** **Yes.** The budget constraint bonus is a systemic cheat; it converts state incompetence into detainee time, effectively punishing the prisoner for the state's lack of resources.

  **2. Income-scaled day fines (Strict Liability)**
  *   **Desert Load:** 7/10
  *   **Tumor Test:** Fail (No, we don't criminally fine sleepwalkers).
  *   **Tier:** Needs Real Desert.
  *   **Why:** Imposes a duty of care that presupposes the capacity to choose otherwise.

  **3. Deterrence pricing**
  *   **Desert Load:** 9/10
  *   **Tumor Test:** Fail (No, you cannot deter a tumor).
  *   **Tier:** Needs Real Desert.
  *   **Why:** Requires the subject to be a rational calculator responsive to threats.
  *   **Cheat Flag:** **Yes.** This is the classic "sacrificial lamb" cheat; it designs the institution so someone definitely eats it to signal a rule to others.

  **4. Bare censure**
  *   **Desert Load:** 8/10
  *   **Tumor Test:** Fail (No, you don't morally condemn a seizure).
  *   **Tier:** Needs Real Desert.
  *   **Why:** Censure *is* the communicative act of blame, which requires a moral agent.

  **5. Restorative conferences**
  *   **Desert Load:** 6/10
  *   **Tumor Test:** Fail (No, a tumor cannot offer moral repair).
  *   **Tier:** Dennett-ish Compatibilist.
  *   **Why:** Assumes the capacity for moral recognition and voluntary reconciliation.

  **6. Dennett-style maintenance blame**
  *   **Desert Load:** 5/10
  *   **Tumor Test:** Fail (No, blaming a patient doesn't grow agency).
  *   **Tier:** Dennett-ish Compatibilist.
  *   **Why:** Justified by the *function* of blame, but still requires the subject to be capable of entering the practice.

  **7. Reformative education (Success = accepting blameworthiness)**
  *   **Desert Load:** 10/10
  *   **Tumor Test:** Fail (No, asking them to accept blame is gaslighting).
  *   **Tier:** Needs Real Desert.
  *   **Why:** Requires the offender to internalize a falsehood about their own metaphysical responsibility.

  **8. Repair and voluntary treatment; else Dangerous Non-Agent status**
  *   **Desert Load:** 2/10
  *   **Tumor Test:** Pass (Yes, the fallback is pure quarantine).
  *   **Tier:** Clean for Skeptic.
  *   **Why:** The "voluntary" bit is a bonus, but the coercive floor is identical to Item 1.

  ***

  ### The Systemic Analysis

  **Incarceration Fraction:** **0.25**
  **Defense:** If you restrict confinement strictly to *current dangerousness* (Item 1/8) rather than past guilt or general deterrence, you release almost all drug/property offenders and many aging violent offenders who no longer pose a statistical risk.

  **The Dennett/Caruso Convergence Point:** **Item 1 (Actuarial Quarantine)**
  This is where the disagreement is hiding. They agree on the *mechanism*: risk-based detention without basic desert is the only justified coercion for non-agents. Dennett argues this applies to a tiny minority (tumors, insanity); Caruso argues determinism makes this apply to everyone. They steelman the same policy (quarantine) but fight over the scope of the exemption (who counts as an agent).

  **The "Cheat" Relocation:** **Item 3 (Deterrence Pricing)**
  This is the clearest example of relocating desert from the act to the system. It punishes the individual not for what they did, but to calibrate the incentive structure for *others*, effectively using the offender as infrastructure for social engineering.

  ### Commentary on Your Read
  You are correct that they converge on policy more than they admit. Dennett's "forward-looking punishment" often looks indistinguishable from Caruso's "quarantine" in practice (lock them up until they aren't dangerous), but Dennett insists on the *stigma* of blame (Item 4/6) as a necessary tool for agency-maintenance, whereas Caruso views that stigma as the harm to be eliminated. Your Tumor Test successfully isolates the blame component from the safety component.
