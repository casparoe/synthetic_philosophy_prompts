answer: |-
  # Teaching Plan: The Problem of Moral Luck (50 Minutes)

  ## I. Conceptual Sequence & Dependency Order
  *Do not deviate from this order. Introducing the scenario before the principle reduces the session to a case study in liability rather than a philosophical puzzle.*

  1.  **Anchor in Prior Knowledge (Minutes 0–5):**
      *   **Action:** Write "The Good Will" on the board. Remind students of the Kant summary they read: moral worth depends on intent/duty, not success.
      *   **Goal:** Establish that moral worth is internal, not external.
      *   **Dependency:** This provides the historical/philosophical grounding for the **Control Principle**.

  2.  **Establish the Control Principle (Minutes 5–10):**
      *   **Action:** Write "The Control Principle" on the board. Define it: *We are only morally responsible for what is within our control.*
      *   **Elicit:** Ask for a show of hands: "Who agrees with this?" (Almost all will).
      *   **Dependency:** You cannot demonstrate a violation of a rule until the class explicitly accepts the rule.

  3.  **Present the Engineer Scenario (Minutes 10–25):**
      *   **Action:** Draw two columns (Engineer A / Engineer B) on the whiteboard. Fill in the "Identical" rows first (Intent, Code, Testing, Standards). Then fill in the "Different" rows (Location, Road Quality, Outcome).
      *   **Goal:** Create a visual representation of *ex-ante* equivalence and *ex-post* divergence.
      *   **Dependency:** The scenario only functions as a puzzle if the *ex-ante* equivalence is established *before* the outcome is revealed.

  4.  **Elicit the Intuitive Judgment (Minutes 25–35):**
      *   **Action:** Ask: "Who is more blameworthy?"
      *   **Goal:** Force the admission that intuitively, B looks worse than A.
      *   **Dependency:** The tension only exists if they admit their intuition contradicts the Control Principle established in Step 2.

  5.  **Synthesize the Paradox (Minutes 35–45):**
      *   **Action:** Draw a lightning bolt between the Control Principle and the Intuitive Judgment.
      *   **Goal:** Label the conflict "The Problem of Moral Luck."
      *   **Dependency:** This labels the tension only after both sides of the contradiction have been fully articulated.

  ## II. Scenario Engineering: Features & Isolation
  *To ensure the scenario isolates **resultant luck** (luck in the outcome) rather than circumstantial or constitutive luck, strictly enforce the following features on the whiteboard.*

  ### Features the Scenario MUST Possess
  1.  **Identical Internal States:** Explicitly state both engineers had the exact same level of conscientiousness, fatigue, and attention. (Isolates from **Constitutive Luck**: prevents students from arguing B was naturally more careless).
  2.  **Identical Decision Procedures:** Both followed the exact same industry testing protocols. (Isolates from **Circumstantial Luck** regarding professional opportunity: prevents arguments that B had worse training).
  3.  **Causal Link to Outcome:** The fatality must be a direct physical result of the road condition interacting with the algorithm, not a random fluke (e.g., a meteor). (Ensures the outcome is connected to the action, making the luck *moral* rather than just random misfortune).

  ### Features the Scenario MUST Lack
  1.  **Foreseeability:** Do not mention news reports or prior warnings about the degraded roads. (If B *could have known*, it becomes negligence, not luck).
  2.  **Post-Crash Behavior:** Do not describe how B reacted after the crash (e.g., covering it up vs. confessing). (This introduces new controllable variables that muddy the water).
  3.  **Legal Verdicts:** Do not state whether B was sued or jailed. Focus only on *moral* condemnation and professional reputation. (Keeps the focus on ethics, not law).

  ### Pedagogical Advantage Over Drunk-Driver Examples
  *   **The Drunk-Driver Problem:** In standard examples (two drunk drivers, one hits a pedestrian, one doesn't), students can object that the *act of drinking* was already blameworthy. They can resolve the tension by saying, "Both are equally bad for drinking; the death is just extra."
  *   **The Engineer Advantage:** Here, the *act of deploying the car* was reasonable for both. There is no prior sin to anchor the blame. This forces students to confront whether the *death itself* generates blame, rather than the death merely amplifying blame for a prior bad choice. It isolates the outcome as the sole variable for moral differentiation.

  ## III. Misconception Management Map
  *Anticipate these three specific errors and defuse them at the marked moments.*

  | Misconception | Why It Arises | When to Defuse (Minute) | How to Defuse (Whiteboard Move) |
  | :--- | :--- | :--- | :--- |
  | **"You are saying outcomes never matter."** | Students conflate *moral worth* with *causal significance*. They think absolving B means the death doesn't matter. | **Minute 10** (During Control Principle) | Write: *Control $\neq$ Causation.* Clarify: "We are discussing **blame**, not cause. B caused the death. The question is: Does causing death make you *bad* if you couldn't control it?" |
  | **"B is blameless because the roads weren't her fault."** | Students jump to the conclusion too early, bypassing the tension. They solve the puzzle before feeling it. | **Minute 30** (During Intuitive Judgment) | Press: "Legally, maybe. But look at the headlines. Does the public *treat* her as blameless? If our intuition says she is worse than A, why?" Force them to own the conflicting intuition. |
  | **"This is just Determinism/Free Will."** | Students conflate luck (external factors) with determinism (internal causal chains). They think you are arguing no one has free will. | **Minute 40** (During Synthesis) | Write: *Determinism = Could not have done otherwise.* vs. *Luck = Did the same, result differed.* Clarify: "We are assuming they chose freely. The puzzle is why the *world's response* changes based on chance." |

  ## IV. Final Check-for-Understanding (Minutes 45–50)
  *Do not ask for sympathy. Ask for a resolution to the logical tension.*

  **The Question:**
  "Imagine we decide to protect Engineer B from blame because of the road conditions. To be consistent, must we also protect a driver who *was* speeding but didn't hit anyone because the road was empty? Which premise are you willing to reject: The Control Principle, or our instinct to judge based on harm?"

  **Assessment Criteria:**
  *   **Grasping the Tension:** The student identifies that absolving B requires either accepting that the speeding driver is also blameless (counter-intuitive) OR admitting that the Control Principle is false (we *are* judged on outcomes).
  *   **Merely Sympathizing:** The student answers, "B deserves a second chance," or "The city should pay," without addressing the consistency required for Engineer A or the speeding driver.

  ## V. Explicit Exclusions & Justification
  *Do not write these on the board. Keep them out of the verbal explanation.*

  1.  **Exclude the Fourfold Taxonomy (Resultant, Circumstantial, Constitutive, Causal):**
      *   **Justification:** Introducing Nagel's full taxonomy requires defining four distinct metaphysical categories. In 50 minutes, this shifts focus from *feeling the paradox* to *memorizing definitions*. It protects the core insight by keeping the focus on the *conflict* between control and judgment, rather than categorizing types of luck.
  2.  **Exclude Compatibilism vs. Libertarianism:**
      *   **Justification:** Debating whether free will exists distracts from the specific problem of *moral luck*. Even if free will exists, the luck problem remains (why do we judge two free agents differently based on chance?). Omitting this prevents the discussion from dissolving into a metaphysical debate about determinism.
  3.  **Exclude Moral vs. Epistemic Luck:**
      *   **Justification:** Epistemic luck concerns knowledge/belief justification. Introducing this confuses the ethical question (blame/praise) with an epistemological one (justification). Omitting it ensures the discussion remains anchored in the Ethics Elective's core concern: how we treat one another.
