answer: |-
  This is a sharp reductio. You've correctly identified that **Mechanistic Anomaly Detection (MAD)** risks collapsing if we conflate *causal isomorphism* (the math matches) with *mechanistic identity* (the physics matches).

  To save the concept without killing modeling, you should **reject Premise (3)** while **keeping Premise (2)**.

  Here is the breakdown of why (3) is the failure point, the cost of that rejection, and how to solve the maintenance dilemma (10) without abandoning mechanistic norms.

  ### 1. Why Premise (3) is False
  Premise (3) claims: *"The twin reproduces every relevant relation—pressure differentials cause virtual blade stress..."*

  This is a category error. The twin does not reproduce the **causal relations**; it reproduces the **logical structure** of those relations using *different* causal relations.

  *   **In the Turbine:** Pressure (fluid dynamics) $\rightarrow$ Stress (metal lattice deformation). This is a physical causal power grounded in the substrate.
  *   **In the Twin:** Voltage (semiconductor flow) $\rightarrow$ Logic State Change (bit flip) $\rightarrow$ Memory Update (register value).

  The twin simulates the *input-output behavior* of the mechanism, but it does not instantiate the *mechanism itself*. Under your Premise (2) (which we are keeping), identity requires "same parts... same activities." A silicon transistor is not a steel blade; a voltage spike is not a pressure differential.

  **Why this doesn't kill modeling:**
  Models don't need to be *the same mechanism* to be useful; they only need to be **predictively isomorphic within a bounded domain**. We accept that the twin has a *different* mechanistic baseline (computational) than the target (physical). MAD then becomes a two-layer problem:
  1.  **Target MAD:** Is the turbine deviating from physical norms?
  2.  **Proxy MAD:** Is the twin deviating from computational norms?

  When the twin flags a "crack" via a bit-flip, that is a **Proxy Anomaly**, not a **Target Anomaly**. The exit is to acknowledge that the twin is a *measurement instrument*, not a *duplicate entity*. Like a thermometer, if the mercury breaks, it doesn't mean the room is cold; it means the instrument is broken.

  ### 2. The Cost of Rejecting (3)
  The cost is **Epistemic Opacity**.
  If the twin is a distinct mechanism with its own failure modes (floating-point errors, bit-flips), you can no longer treat its output as ground truth. You introduce a **confidence interval on the mechanism itself**.

  *   **Old View:** Twin output = Truth about Turbine.
  *   **New View:** Twin output = Truth about Turbine *conditional on* Twin Integrity.

  This requires **Mechanism-of-Mechanism Monitoring**. You must monitor the twin's hardware/software health to validate its claims about the turbine. This is actually standard practice in safety-critical systems (e.g., redundancy, checksums), but acknowledging it formally prevents the "proof too much" error where software bugs become physical cracks.

  ### 3. Solving the Maintenance Dilemma (Premise 10)
  Your dilemma at (10) argues: *"If replacing a worn gear with an identical new one makes it a different mechanism, then every repair destroys your baseline."*

  This relies on reading Premise (2) as **Token Identity** (this specific chunk of metal) rather than **Type Identity** (this functional arrangement).

  To keep (2) without breaking maintenance, you must interpret "same parts" as **"same functional kinds of parts."**
  *   **Mechanism Type:** The abstract causal structure (e.g., "GE-9X Turbine Design"). This defines the *norms*.
  *   **Mechanism Token:** The specific physical instantiation (e.g., "Serial Number 12345"). This is what is *monitored*.

  When you replace a gear:
  1.  The **Token** changes (strictly speaking, the matter is different).
  2.  The **Type** remains identical (the causal organization is preserved).

  MAD compares the **Token's behavior** against the **Type's norms**. As long as the replacement part instantiates the same causal powers (within tolerance), the *reference mechanism* (the Type) remains valid. Historical data is not garbage because it describes the behavior of the *Type*, which the new Token is supposed to instantiate.

  ### 4. The Exit Strategy
  Here is the revised ontology that lets you keep MAD intact:

  1.  **Keep (2):** Mechanism identity requires identical causal-mechanical structure. (This protects you from saying software bugs are physical cracks).
  2.  **Reject (3):** Digital twins do not share causal-mechanical structure with targets; they share *computational isomorphism*. (This distinguishes the map from the territory).
  3.  **Refine (1):** The "reference mechanism" is a **Functional Type**, not a specific Token. (This allows maintenance without resetting baselines).

  **The Resulting Definition of Mechanistic Anomaly:**
  > A state is mechanistically anomalous if a **Token** fails to instantiate the causal powers expected of its **Type**, *after accounting for measurement artifact anomalies in the monitoring mechanism.*

  **Summary of the Trade:**
  You pay the cost of admitting that **no model is perfect** (rejecting 3), but you gain the ability to distinguish between **simulation error** and **physical failure**. You avoid the absurdity of (8) without rendering the twin useless, and you avoid the Ship of Theseus trap of (10) by distinguishing Type norms from Token instances.

  MAD survives, but it becomes a **triadic relation**: [Token System] vs. [Type Norm] vs. [Monitoring Integrity]. If you ignore the third leg, the argument you posed correctly shows the chair falls over.
