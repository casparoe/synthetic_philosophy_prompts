answer: |-
  # Joint Statement on the Procreation Asymmetry

  **1. Agreed Claims**

  1.  **Non-Identity:** Choices regarding procreation determine which specific individuals exist; alternatives never involve the same individual across options. *Note: Establishes the logical field for both parties.*
  2.  **Welfarism:** The value of a life is determined solely by its welfare content (pleasure, pain, preference satisfaction). *Note: Excludes non-welfare duties for both.*
  3.  **Agony Constraint:** Creating a life consisting solely of agony is impermissible. *Note: Shared lower bound on permissibility.*
  4.  **No Duty to Procreate:** There is no moral obligation to bring happy people into existence. *Note: Shared upper bound on obligation.*
  5.  **Person-Affecting Restriction:** Harm requires a subject who is made worse off than they would otherwise have been. *Note: Asymmetrist gets veto power; Symmetricist gets clarity on harm.*
  6.  **Impersonal Value:** States of affairs can be better or worse independent of specific subjects' interests. *Note: Symmetricist gets footing; Asymmetrist limits its scope.*
  7.  **Risk Sensitivity:** The probability of welfare outcomes matters morally in creation decisions. *Note: Asymmetrist gets risk veto; Symmetricist gets decision theory.*
  8.  **Transitivity:** Moral betterness and permissibility relations are transitive; cycles are impossible. *Note: Prevents logical contradictions for both.*
  9.  **Scope of Welfare:** Principles apply to any welfare subject, including artificial minds, not merely biological humans. *Note: Tests personhood vs. welfare distinctions.*
  10. **Separability:** Reasons for creating a life differ structurally from reasons for sustaining an existing life. *Note: Clarifies locus of asymmetry.*

  **2. Disagreements Table**

  | Issue | Asymmetrist Formulation | Symmetricist Formulation | Verbal/Substantive & Settlement |
  | :--- | :--- | :--- | :--- |
  | **1. Ten-Percent Child** | Creation is permissible only if the probability of a life below neutral is 0%. The negative limb lexically dominates any probability of gain. | Creation is permissible if Expected Value > 0. A 10% risk of harm is outweighed by 90% chance of high benefit. | **Substantive.** Settled by intuition pump: would you create a life with 1% risk of agony for 99% bliss? |
  | **2. The Substitute** | The reason to choose the happy child is solely to avoid the suffering of the other. Securing greater happiness adds no weight. | The reason includes both avoiding suffering and securing greater happiness. Beneficence is symmetric. | **Substantive.** Settled by checking if removing the suffering child changes the reason to create the happy one. |
  | **3. Million and One** | Impermissible. One life below neutral vetoes any number of lives above neutral. Aggregation does not apply across the neutral line. | Permissible. The sum of small gains outweighs the single large loss. Aggregation applies universally. | **Substantive.** Settled by whether the single victim can claim compensation from the many beneficiaries. |
  | **4. Hour-Long Mind** | The asymmetry applies. There is no reason to create the mind, though there is reason not to create a suffering one. | There is a pro tanto reason to create the mind based on impersonal value, even if optional. | **Verbal.** Depends on whether "reason" implies "duty." If optional for both, difference is labeling. |
  | **5. Cycle Blocking** | The cycle is blocked by the claim that "Better than" does not apply between existence and non-existence. | The cycle is blocked by Transitivity. If A>B and B>C, then A>C; asymmetry cannot violate logic. | **Substantive.** Settled by constructing a Mere Addition sequence and testing for transitivity violations. |

  **3. Cruxes**

  **Crux 1: The Source of the Negative Reason**
  *Sub-question:* Is the reason not to create a suffering child person-affecting (harm to *them*) or impersonal (bad state of affairs)?
  *Why it moves sides:* If person-affecting, the Asymmetrist explains why there is no duty to create happy people (no one is harmed by non-existence). If impersonal, the Symmetricist argues the reason to create happy people should exist too.
  *Shared Case:* The Substitute.
  *Predictions:* Asymmetrist: "100% person-affecting." Symmetricist: "50% impersonal, 50% person-affecting."

  **Crux 2: Aggregation Across the Neutral Line**
  *Sub-question:* Can small gains for many outweigh a large loss for one in creation cases?
  *Why it moves sides:* If yes, the Asymmetrist's fixed point collapses into utilitarianism. If no, the Symmetricist's view implies counterintuitive vetoes on progress.
  *Shared Case:* The Million and One.
  *Predictions:* Asymmetrist: "No aggregation." Symmetricist: "Full aggregation."

  **Crux 3: The Status of Non-Existence**
  *Sub-question:* Is non-existence a baseline of zero value, or a null value where predication fails?
  *Why it moves sides:* If zero, symmetric calculation works. If null, asymmetry is logical necessity.
  *Shared Case:* The Ten-Percent Child.
  *Predictions:* Asymmetrist: "Null value." Symmetricist: "Zero value."

  **4. Closing Note (Convenor's Analysis)**

  **Verdict on Disagreements:** The disagreement on the **Hour-Long Mind** is merely verbal; both parties agree creation is optional, differing only on whether "optional" implies "no reason" or "outweighed reason." The disagreements on **Ten-Percent** and **Million and One** are substantive; they yield different action guides.

  **Decisive Crux:** I expect **Crux 3 (Status of Non-Existence)** to be decisive. If non-existence is a null value rather than zero, the Symmetricist's mathematical framework fails to map the moral reality. I expect this to favour the **Asymmetrist**, because the Symmetricist cannot explain why "zero welfare" is not a harm without smuggling in the asymmetry they reject.

  **Flagged Formulations:** A hardline Asymmetrist would likely refuse **Agreed Claim 6 (Impersonal Value)**, fearing it opens the door to the Repugnant Conclusion. A hardline Symmetricist would refuse **Disagreement 1 (0% Risk)**, viewing it as irrational risk aversion masquerading as principle. I chose to include Claim 6 because without it, the Symmetricist has no language to express their view, whereas the Asymmetrist can accept it provided it is subordinate to person-affecting constraints.

  **Choice Rationale:** I framed the **Cycle Blocking** issue as a substantive disagreement rather than a logical proof because both sides accept Transitivity (Claim 8). The real fight is whether the asymmetry generates intransitivity; stating it as a premise block forces the Asymmetrist to admit their view requires a non-standard logic of betterness, which is the true cost of their position.
