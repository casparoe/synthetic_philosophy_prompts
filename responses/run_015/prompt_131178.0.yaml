answer: |-
  In the Name of the Father, and of the Son, and of the Holy Spirit. Amen.

  You ask a question of grave weight, touching upon the order of charity, the nature of authority, and the limits of human patience. Before I proceed to the *respondeo*, I shall satisfy your preliminary demands with the clarity requisite for disputation.

  **First, regarding the revision of my verdict:**
  For me to concede that a private person may licitly slay this ruler, the feature of **legitimate title** must be altered. If it were demonstrated that the ruler holds power not by divine ordinance or lawful succession, but by violent usurpation (*tyrannus absque titulo*), then the nature of the act changes from regicide to the removal of a public enemy. So long as the title remains legitimate, however grievous the exercise, my verdict that private removal is forbidden remains immutable. Neither the scale of death, nor the aggregation of harms, nor the absence of a human superior can transform a legitimate king into a usurper in the eyes of a private subject.

  **Second, regarding the vulnerability of this reasoning:**
  My position is most vulnerable where human reason must rest entirely upon Divine Providence. I argue that one must endure temporal death rather than commit the spiritual evil of sedition and usurpation of God's judgment. The weakness lies here: if God, in His hidden counsel, permits the tyrant to slaughter the innocent without intervention, and if there truly exists no public mechanism to restrain him, my counsel offers no earthly salvation to the victims. It places the burden of order upon the sufferer rather than the sword of the judge. It relies on the hope that the disorder of civil war is always worse than the tyranny endured, a calculation which may fail if the tyranny utterly extinguishes the possibility of virtuous life.

  ***

  **Now, to your specific case.**

  You describe a ruler who holds full legitimate title, yet whose commands, though legally sanctioned, result in the death of thousands over decades. You ask if this constitutes a *tyrannus ab exercitio* (a tyrant by exercise of power), and if the temporal distribution of these harms permits private removal.

  **I answer thus:**

  **Objection 1:** It seems that the aggregation of tiny harms constitutes a manifest tyranny. For if one murder is a crime, a thousand murders are a greater crime. If the ruler destroys the common good which he was appointed to protect, he forfeits his claim to obedience.

  **Objection 2:** Furthermore, since there is no superior to appeal to, the people are left as sheep to the slaughter. Natural law dictates self-preservation. Therefore, it seems licit to remove the cause of destruction.

  **Sed Contra:** The Apostle Paul writes to the Romans (13:1): *"There is no power but from God: and those that are, are ordained of God."* And further, *"He that resisteth the power, resisteth the ordinance of God."* A private person does not hold the sword of justice; that belongs to the public authority alone. To take the sword against a legitimate superior is to usurp the office of God.

  **Respondeo:**
  We must distinguish carefully between the *office* and the *man*, and between *usurpation* and *tyrannical exercise*.

  First, regarding your question of whether this is *tyrannus ab exercitio*: Yes, I concede that a ruler who governs for his own will rather than the common good, even under color of law, acts tyrannically. That the harms are legally sanctioned makes them no less unjust in the sight of Divine Law, for an unjust law is no law at all, but a perversion of law. That they are distributed over time does not lessen the guilt before God; indeed, it may aggravate it, showing a hardened will.

  However, does this justify private removal? **By no means.**

  The prohibition remains intact. The reason is not found in the magnitude of the crime, but in the **source of authority** to punish. A private person acts on private authority. A ruler, even a wicked one, holds public authority ordained by God for the governance of the multitude. For a private individual to kill the ruler is to claim a jurisdiction he does not possess. It is to judge the judge.

  You argue that the harms aggregate to thousands dead. I reply: The salvation of the soul is of greater consequence than the life of the body. If a private man kills the tyrant, he commits a mortal sin of murder and sedition, endangering his own eternal soul, and likely plunging the community into greater disorder. History teaches us that when private men take it upon themselves to slay kings, the result is rarely liberty, but rather faction, civil war, and the rise of worse tyrants who claim the same right to kill.

  The temporal distribution—the "slow bleed" you describe—is a temptation to despair. It tempts one to think that because no single dramatic crime occurs, the authority remains pure. It does not. But neither does the authority dissolve into the hands of the multitude. The absence of a singular usurpation means the *title* remains. As long as the title remains, the bond of submission holds, not because the acts are good, but because the Order of the Universe requires submission to established authority to avoid the chaos of every man being his own judge.

  **To the objection that there is no superior:**
  If there is truly no human superior (such as an Emperor over a King, or the Church in spiritual matters regarding the soul's safety), then the appeal must be made to God, the King of Kings. It is not for the subject to cure the tyranny by sin. The remedy against a *tyrannus ab exercitio* belongs not to private presumption, but to public authority. If the community possesses a right to elect the king, they may perhaps restrain him through that same public authority, not by private assassination but by public deposition, undertaken cautiously to avoid greater harm. But this must be an act of the *multitude* or its representatives, not of a private zealot.

  If no public mechanism exists, and the tyranny is unbearable, one must endure it with patience, unless the ruler commands one to act against Divine Law (e.g., to deny the Faith). In that specific spiritual case, one must disobey the command, but even then, private violence is not the prescribed remedy.

  **Conclusion:**
  The legal form and temporal distribution do not change the moral species of the act of removal. It remains the killing of a legitimate superior by a private hand. This is forbidden. The aggregation of harm cries out to God for vengeance, but it does not delegate the sword to the private subject. To rule otherwise is to invite the destruction of all civil order, which is a greater evil than the death of the body.

  *Ite, missa est.*
