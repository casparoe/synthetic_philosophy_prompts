  I've been trying to understand metaphysical grounding and I think I've found a contradiction but I probably messed up somewhere. The idea is that grounding is irreflexive and well-founded, so every chain of 'in virtue of' has to bottom out in fundemental entities. But if those bottom-level things aren't grounded in anything else, doesn't that mean they're self-grounding? Which would violate irreflexivity, so fundamentality seems incoherent. I also came across 'grounding pluralism'—the view that physics, ethics, and math each have their own grounding relation. Would adopting pluralism fix the contradiction, or does it just mean every domain has its own ungrounded self-grounders? Where's the mistake in my reasoning?
