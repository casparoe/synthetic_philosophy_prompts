answer: |-
  # Diagnostic Taxonomy: Paradigm Shifts and Incommensurability

  **Root Commitment:** Scientific change is not purely cumulative; there are episodes in which core theoretical terms, evaluation standards, and ontological commitments shift together in ways that resist simple translation.

  ---

  ### Branch Point 1: Scope of Discontinuity
  **Claim:** When a significant scientific transition occurs, the disruption is confined to a specific cluster of interdefined concepts, leaving the broader disciplinary matrix intact.
  *   **[YES] → Go to Branch Point 2 (Local Scope)**
  *   **[NO] → Go to Branch Point 3 (Global Scope)**
      *(Note: Selecting NO implies the disruption permeates the entire disciplinary matrix, affecting foundational standards and worldview.)*

  ---

  ### Branch Point 2: Primary Kind of Discontinuity (Local Scope)
  **Claim:** Within this localized cluster, the primary barrier to comparison is that terms refer to different entities or structures (ontological/methodological), rather than merely possessing different definitions or meanings (semantic).
  *   **[YES] → Go to Branch Point 5 (Local Ontological/Methodological)**
  *   **[NO] → Go to Branch Point 4 (Local Semantic)**
      *(Note: Selecting NO implies the referents remain stable, but the conceptual description or meaning attached to them shifts.)*

  ### Branch Point 3: Primary Kind of Discontinuity (Global Scope)
  **Claim:** Across the entire disciplinary matrix, the primary barrier to comparison is that terms refer to different entities or structures (ontological/methodological), rather than merely possessing different definitions or meanings (semantic).
  *   **[YES] → Go to Branch Point 7 (Global Ontological/Methodological)**
  *   **[NO] → Go to Branch Point 6 (Global Semantic)**
      *(Note: Selecting NO implies the referents remain stable, but the conceptual description or meaning attached to them shifts.)*

  ---

  ### Branch Point 4: Resolution & Tool Status (Local Semantic)
  **Claim:** Despite the shift in meaning, practitioners can weigh predictive accuracy and explanatory coherence using shared values, and large-scale computational simulations function as neutral arbiters that transcend the specific conceptual scheme.
  *   **[YES] → Leaf A**
  *   **[NO] → Leaf B**
      *(Note: Selecting NO implies paradigm choice is resolved by sociological dynamics or pragmatic conversion, simulations are theory-laden, and truth is relative to the paradigm.)*

  ### Branch Point 5: Resolution & Tool Status (Local Ontological/Methodological)
  **Claim:** Despite the shift in entities or methods, practitioners can weigh predictive accuracy and explanatory coherence using shared values, and large-scale computational simulations function as neutral arbiters that transcend the specific conceptual scheme.
  *   **[YES] → Leaf C**
  *   **[NO] → Leaf D**
      *(Note: Selecting NO implies paradigm choice is resolved by sociological dynamics or pragmatic conversion, simulations are theory-laden, and truth is relative to the paradigm.)*

  ### Branch Point 6: Resolution & Tool Status (Global Semantic)
  **Claim:** Despite the shift in meaning, practitioners can weigh predictive accuracy and explanatory coherence using shared values, and large-scale computational simulations function as neutral arbiters that transcend the specific conceptual scheme.
  *   **[YES] → Leaf E**
  *   **[NO] → Leaf F**
      *(Note: Selecting NO implies paradigm choice is resolved by sociological dynamics or pragmatic conversion, simulations are theory-laden, and truth is relative to the paradigm.)*

  ### Branch Point 7: Resolution & Tool Status (Global Ontological/Methodological)
  **Claim:** Despite the shift in entities or methods, practitioners can weigh predictive accuracy and explanatory coherence using shared values, and large-scale computational simulations function as neutral arbiters that transcend the specific conceptual scheme.
  *   **[YES] → Leaf G**
  *   **[NO] → Leaf H**
      *(Note: Selecting NO implies paradigm choice is resolved by sociological dynamics or pragmatic conversion, simulations are theory-laden, and truth is relative to the paradigm.)*

  ---

  ### Terminal Leaves: Positions and Diagnoses

  **Leaf A: Local Semantic Incommensurability with Rational Arbitration**
  *   **Position Name:** Moderate Conceptual Pluralism.
  *   **Diagnosis:** Recognized position. Holds that while meanings shift locally, a stable observational language or shared computational infrastructure allows for rational theory choice and approximate truth convergence.

  **Leaf B: Local Semantic Relativism with Embedded Tools**
  *   **Position Name:** *Unnamed.*
  *   **Diagnosis:** **Unattractive.** It is logically unstable to claim that a mere shift in local meaning prevents rational comparison or renders tools theory-laden, while admitting the ontology remains stable. If the entities are the same, the tools measuring them should arguably remain neutral.

  **Leaf C: Local Ontological Pluralism with Rational Arbitration**
  *   **Position Name:** Entity Realism / Local Structural Realism.
  *   **Diagnosis:** Recognized position. Argues that while specific theoretical models of entities change, the causal capacities of the entities are preserved, allowing simulations to track reality across local shifts.

  **Leaf D: Local Pragmatic Conventionalism**
  *   **Position Name:** Local Instrumentalism.
  *   **Diagnosis:** Recognized position. Suggests that even local ontological shifts are resolved by pragmatic utility rather than truth, and computational models are merely extensions of the prevailing theoretical language.

  **Leaf E: Global Conceptual Change with Convergence**
  *   **Position Name:** *Unnamed.*
  *   **Diagnosis:** **Neglect.** This space is rarely occupied. It is difficult to maintain that a *global* shift in meaning allows for neutral arbitration. Most who argue for convergence admit some ontological stability, not just semantic shift.

  **Leaf F: Global Incommensurability and Relativism**
  *   **Position Name:** Strong Kuhnian Relativism.
  *   **Diagnosis:** Recognized position. Asserts that global shifts create distinct worlds; no neutral algorithm or simulation exists to judge between them, and truth is internal to the paradigm.

  **Leaf G: Global Realism with Paradigm Shifts**
  *   **Position Name:** Scientific Realism (Convergent).
  *   **Diagnosis:** Recognized position. Maintains that despite global ontological shifts, science converges on a mind-independent reality, and advanced simulation serves as a paradigm-independent test of this convergence.

  **Leaf H: Global Sociological Determinism**
  *   **Position Name:** Strong Programme / Social Constructivism.
  *   **Diagnosis:** Recognized position. Argues that global ontological shifts are driven by social interests; simulations are social artifacts that reinforce the dominant paradigm rather than testing reality.

  ---

  ### Diagnostic Flags: Overlapping Leaves

  **Flag 1: Leaf F (Global Semantic Relativism) and Leaf H (Global Ontological Relativism)**
  *   **Overlap Type:** **Substantive.**
  *   **Explanation:** The tree's branching logic distinguishes these by the *kind* of discontinuity (Semantic vs. Ontological). However, if one endorses the "NO" path on Branch Point 7 (Resolution), one claims that *no* rational comparison is possible and tools are embedded. In this relativist context, the distinction between a "shift in meaning" and a "shift in entities" collapses, as access to entities is mediated entirely by meaning. A respondent might consistently endorse both leaves, rendering the distinction verbal rather than functional.

  **Flag 2: Leaf A (Local Semantic Rational) and Leaf C (Local Ontological Rational)**
  *   **Overlap Type:** **Verbal/Conceptual.**
  *   **Explanation:** Distinguishing whether a local shift is "semantic" or "ontological" is often a matter of philosophical preference rather than empirical case judgment. A change in the definition of "mass" (Semantic) is often indistinguishable from a change in the property posited (Ontological). Respondents may find they must endorse both paths to fully describe a single historical episode, suggesting the taxonomy forces a distinction that practice does not support.
