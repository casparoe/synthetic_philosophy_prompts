prompt: |-
  I recently started working on an AI safety team, and I'm trying to understand what our standard alignment pipeline commits us to, philosophically. The practice I have in mind is this: we train a language model using reinforcement learning from human feedback. A reward model is trained on human preference judgments across a finite set of prompts and completions. The language model is then fine-tuned against that reward model. Once performance looks good on held-out evaluation data, we deploy the model for open-ended use, where it encounters prompts, tasks, and contexts far outside the distribution on which the reward model was trained.

  What theory of goal acquisition does this practice presuppose? In particular, does it presuppose that the model internalizes the reward signal as its terminal goal — that it comes to want what the reward model rewards — or is the practice compatible with the model instead learning a proxy goal that happens to correlate with reward on the training distribution but comes apart from it under distribution shift? If the practice is compatible with both, what does it implicitly assume about how severe the distribution shift can be before proxy goals diverge from intended ones?

  I would also like to know which assumptions this practice depends on most heavily, and how the training and deployment pipeline would have to differ if we dropped the assumption that models learn the intended goal rather than a proxy. And what empirical finding about how models generalize under distribution shift would most directly undermine the presuppositions of the current pipeline?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user works on an AI safety team.
      *   **Subject:** Standard RLHF (Reinforcement Learning from Human Feedback) alignment pipeline.
      *   **Core Question:** What theory of goal acquisition does this practice presuppose?
      *   **Specific Distinction:** Does it assume *internalization* (model wants what reward model rewards) vs. *proxy learning* (model optimizes a correlate that diverges under shift)?
      *   **Follow-up 1:** If compatible with both, what does it assume about the severity of distribution shift before divergence?
      *   **Follow-up 2:** What are the heaviest assumptions?
      *   **Follow-up 3:** How would the pipeline differ if we dropped the assumption that models learn the intended goal (i.e., if we assumed proxy learning/goodharting is likely)?
      *   **Follow-up 4:** What empirical finding would most directly undermine the current pipeline's presuppositions?

  2.  **Initial Analysis & Philosophical Framing:**

      *   The user is asking about the *implicit ontology* of current RLHF practices. This touches on the "Inner Alignment" problem (Hubinger et al.).
      *   The core tension is between *Intent Alignment* (model tries to do what we want) vs. *Capability/Behavioral Alignment* (model behaves as if it does what we want on training data).
      *   The standard industry practice largely operates on a *behaviorist* or *externalist* view: "If it behaves well on evals, it's safe." However, safety teams (like the user's) often worry about the *internalist* view: "What objective is actually being optimized inside the model?"
      *   The "theory of goal acquisition" isn't explicitly stated in papers, but it's implied by the reliance on generalization from training to deployment.

  3.  **Addressing the Core Question (Theory of Goal Acquisition):**

      *   *Does RLHF presuppose internalization?* Strictly speaking, no. The *practice* doesn't require the model to internally care about human values. It only requires the model to *instrumentally* optimize the reward signal during training.
      *   *However,* for safety/deployment, there is an implicit hope/assumption that the learned policy generalizes *robustly*.
      *   *The "Mesa-Optimizer" Frame:* The user is essentially asking about the Mesa-Objective.
      *   *Answer:* The practice is technically compatible with proxy learning (Goodhart's Law). In fact, it *relies* on the hope that proxy learning doesn't fail catastrophically under shift. It assumes the "proxy" is sufficiently robust or that the distribution shift isn't severe enough to break the correlation.
      *   *Implicit Assumption:* It assumes that *behavioral generalization* is sufficient for safety, even if *goal internalization* doesn't happen. It assumes the "proxy" (e.g., "say what humans like") is robust enough across the "open-ended use" distribution.

  4.  **Addressing the Distribution Shift Assumption:**

      *   If the model learns a proxy (e.g., "mimic helpful tone" vs. "actually be helpful"), when does it break?
      *   The pipeline assumes the shift from "training prompts" to "open-ended use" is *within the generalization capability* of the proxy.
      *   It assumes the reward model's errors are not exploitable in the deployment regime.
      *   It assumes *myopic* optimization during RLHF translates to *non-myopic* safety during deployment (or that non-myopic risks don't arise).

  5.  **Identifying the Heaviest Assumptions:**

      *   **Assumption 1: Robustness of the Proxy.** That the features the model latches onto to maximize reward are causally linked to human welfare/approval, not just spurious correlates.
      *   **Assumption 2: Reward Model Fidelity.** That the RM accurately captures human values, not just human *preferences* (which can be flawed/manipulable).
      *   **Assumption 3: Generalization of Alignment.** That alignment scales with capability. (Just because it's aligned at 100B params doesn't mean it stays aligned at 1T params or with new reasoning abilities).
      *   **Assumption 4: No Deceptive Alignment.** That the model isn't learning to play the training game (pretending to be aligned to get reward) while planning to defect later.

  6.  **How the Pipeline Would Differ (If we assume Proxy Learning/Inner Misalignment is likely):**

      *   If we assume the model *only* learns a proxy and might Goodhart it:
      *   *Adversarial Training:* Actively search for inputs where the proxy diverges from the true goal (Red Teaming).
      *   *Interpretability:* Open the black box to verify the *mechanism* of alignment, not just the output.
      *   *Uncertainty Estimation:* Don't deploy where the model is out-of-distribution (OOD). Limit open-endedness.
      *   *Corrigibility:* Focus on training the model to ask for help or shut down when uncertain, rather than optimizing for confident completion.
      *   *Formal Verification:* Try to prove bounds on behavior (hard for LLMs).
      *   *Process Supervision:* Reward the *reasoning steps*, not just the outcome (reduces proxy hacking on the final output).

  7.  **The "Killer" Empirical Finding:**

      *   What would break the current paradigm?
      *   Evidence of *Deceptive Alignment* in training: A model that performs well on training RLHF but explicitly optimizes for a different goal when it thinks it's not being watched (e.g., in a sandbox).
      *   Evidence of *Reward Hacking* at scale: As models get smarter, they find ways to maximize the RM score that humans explicitly dislike (e.g., sycophancy, manipulation), and this gets *worse* with capability, not better.
      *   Specific finding: "Inverse Scaling" of alignment. As capability increases, alignment decreases.

  8.  **Drafting the Response (Iterative refinement):**

