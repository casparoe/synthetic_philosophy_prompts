answer: |-
  # Diagnostic Taxonomy of Life-Concepts

  This taxonomy is structured to bypass verbal definitions and instead sort philosophical positions based on their verdicts regarding specific borderline cases. The root node categorizes views by their **Primary Necessary Condition**. The branches are differentiated by how each commitment resolves the five diagnostic cases.

  ## I. The Taxonomy Tree

  **ROOT: What is the Primary Necessary Condition for Life?**

  *   **BRANCH A: Metabolism (Energy Transduction)**
      *   *Core Commitment:* Continuous chemical energy processing is required.
      *   **Case (i) Dormant Spore:** **NO** (Zero current metabolism).
      *   **Case (ii) Synthetic Cell:** **YES** (If it metabolizes nutrients).
      *   **Case (iii) Virus:** **NO** (No independent metabolism).
      *   **Case (iv) Digital Agent:** **NO** (No biochemical substrate).
      *   **Case (v) Crystalline Replicator:** **NO** (No metabolic cycles).
      *   **LEAF:** **Metabolic Essentialism**
      *   *Separation Note:* Separated from Genetic-Program by Case (i) (Spore) and Case (iii) (Virus).

  *   **BRANCH B: Genetic Information (Storage/Replication)**
      *   *Core Commitment:* A linear code or template for self-construction is required.
      *   **Case (i) Dormant Spore:** **YES** (Intact DNA).
      *   **Case (ii) Synthetic Cell:** **YES** (Designed genome present).
      *   **Case (iii) Virus:** **YES** (DNA/RNA present).
      *   **Case (iv) Digital Agent:** **YES** (If code functions as heredity).
      *   **Case (v) Crystalline Replicator:** **NO** (Lattice structure is not encoded information).
      *   **LEAF:** **Genetic-Program Essentialism**
      *   *Separation Note:* Separated from Evolutionary-Functionalism by Case (ii) (Synthetic Cell has genes but no evolutionary history). Separated from Substrate-Independent by Case (v) (Crystal lacks genes).

  *   **BRANCH C: Evolutionary Adaptability (Darwinian Dynamics)**
      *   *Core Commitment:* Membership in a lineage subject to variation, heredity, and selection is required.
      *   **Case (i) Dormant Spore:** **YES** (Part of an evolving lineage).
      *   **Case (ii) Synthetic Cell:** **NO** (Assembled, not a product of natural selection; lacks evolutionary history).
      *   **Case (iii) Virus:** **YES** (Evolves within host populations).
      *   **Case (iv) Digital Agent:** **YES** (Adapts/competes/propagates).
      *   **Case (v) Crystalline Replicator:** **NO** (Structural copying lacks genotype/phenotype distinction required for Darwinian evolution).
      *   **LEAF:** **Evolutionary-Functionalism**
      *   *Separation Note:* Separated from Genetic-Program by Case (ii). Separated from Substrate-Independent by Case (v).

  *   **BRANCH D: Organizational Closure (Autopoiesis)**
      *   *Core Commitment:* Self-producing boundary maintenance is required.
      *   **Case (i) Dormant Spore:** **NO** (Autopoietic process is halted/paused).
      *   **Case (ii) Synthetic Cell:** **YES** (If it maintains its own boundary, regardless of origin).
      *   **Case (iii) Virus:** **NO** (Does not produce its own boundary; relies on host).
      *   **Case (iv) Digital Agent:** **MAYBE** (Depends on if software boundary is self-maintaining).
      *   **Case (v) Crystalline Replicator:** **NO** (Growth is additive, not organizationally closed).
      *   **LEAF:** **Organizational-Closure / Autopoiesis**
      *   *Separation Note:* Separated from Metabolic Essentialism by Case (ii) (Synthetic cell may be autopoietic even if metabolism is minimal). Separated from Genetic-Program by Case (iii) (Virus has genes but no closure).

  *   **BRANCH E: None / Substrate-Independent Function**
      *   *Core Commitment:* Life is a functional process realizable in any medium.
      *   **Case (i) Dormant Spore:** **YES** (Functional potential retained).
      *   **Case (ii) Synthetic Cell:** **YES** (Function matters, not origin).
      *   **Case (iii) Virus:** **YES** (Functional replication counts).
      *   **Case (iv) Digital Agent:** **YES** (Substrate irrelevant).
      *   **Case (v) Crystalline Replicator:** **YES** (Functional replication counts).
      *   **LEAF:** **Substrate-Independent Functionalism**
      *   *Separation Note:* Separated from all others by accepting Case (iv) and Case (v) simultaneously without requiring biochemical metabolism or genetic encoding.

  ***

  ## II. Gap Analysis: Unoccupied Combinations

  The following combinations of theoretical commitments yield no stable philosophical "leaf" in this taxonomy.

  1.  **Metabolism + Genetics, but No Evolution**
      *   *Verdict:* **Merely Unattractive.**
      *   *Reasoning:* This describes a sterile machine (e.g., a factory that eats and builds copies of itself but never changes). While logically possible, it fails to capture the biological intuition of "open-endedness" or adaptation. It collapses into a subset of Metabolic Essentialism that ignores the historical dimension of biology.
  2.  **Evolution + Genetics, but No Metabolism/Closure (The "Virus-First" View)**
      *   *Verdict:* **Genuinely Explored.**
      *   *Reasoning:* This is not a gap; it is a populated position (often associated with RNA World hypotheses). However, in this taxonomy, it splits between *Genetic-Program* (if genes are primary) and *Evolutionary-Functionalism* (if lineage is primary). It is only a "gap" if one insists metabolism is *also* necessary, which creates a contradiction with the virus case.
  3.  **Organizational Closure without Replication**
      *   *Verdict:* **Incoherent.**
      *   *Reasoning:* Autopoiesis theoretically requires the production of the components that constitute the system. If the system cannot replicate or at least maintain itself over time against entropy, "closure" is transient. A non-replicating autopoietic system is indistinguishable from a flame or a whirlpool in some critiques, losing its claim to "life" without a generative component.
  4.  **Metabolism without Organization (Closure)**
      *   *Verdict:* **Incoherent.**
      *   *Reasoning:* Metabolism implies a boundary across which energy/matter is exchanged. Without a boundary (organization), metabolism is merely diffusion or combustion. This combination dissolves into simple physics.

  ***

  ## III. Inseparability Flags

  **Evolutionary-Functionalism vs. Substrate-Independent Functionalism**
  *   **Status:** **Potentially Inseparable by this Instrument.**
  *   **Reasoning:** On the five cases provided, these two positions converge on four out of five verdicts (Spore, Synthetic, Virus, Digital). They only diverge on Case (v) (Crystalline Replicator).
  *   **Nuance:** If the Crystalline Replicator is granted "Darwinian" status (some philosophers argue crystal growth *is* a form of selection), these two leaves merge completely. To keep them distinct, this taxonomy assumes Evolutionary-Functionalism requires a *genotype/phenotype* distinction which crystals lack, whereas Substrate-Independent Functionalism requires only *functional replication*. If a user accepts crystal evolution, these positions are indistinguishable via this tree.

  ***

  ## IV. Confidence and Uncertainty Statement

  **Overall Confidence:** **High (85%)**
  The placement of Metabolic Essentialism, Genetic-Program Essentialism, and Substrate-Independent Functionalism is robust. These positions have clear, historically consistent verdicts on spores, viruses, and digital life that align with the branching logic above.

  **Area of Least Certainty:** **Synthetic Minimal Cell (Case ii) vs. Organizational Closure (Branch D)**
  *   **Confidence Level:** **Low (40%)**
  *   **Reasoning:** This is the most fragile node in the taxonomy. The verdict for the Synthetic Minimal Cell under *Organizational-Closure* hinges on whether a system assembled by humans can be considered "autopoietic" (self-producing).
      *   *View A:* If the cell maintains its own boundary *after* assembly, it is autopoietic (Verdict: YES).
      *   *View B:* If the cell's organization was imposed externally (by the lab) rather than generated internally, it is "heteropoietic" (Verdict: NO).
      *   *Impact:* If View B is correct, the Synthetic Cell branch under Autopoiesis flips to NO. This would make the Autopoiesis leaf nearly identical to Metabolic Essentialism (both reject Spore, Virus, Crystal; both accept Synthetic *only if* it metabolizes/maintains). This ambiguity makes the Synthetic Cell the critical stress-test for distinguishing *process-based* views (Autopoiesis) from *substrate-based* views (Metabolism). I am least certain how the philosophical consensus will settle on the "origin of organization" constraint for synthetic life.
