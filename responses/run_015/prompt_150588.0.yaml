      *(Refining the "Neuron Defense"):* The colleague's argument is essentially: Fallacy of Division. Just because parts lack X, whole doesn't lack X. Searle agrees parts lack X, but denies the whole has X *in this specific case* because the causal base is wrong. I need to make sure I don't conflate the Systems Reply (the system understands) with the Neuron Defense (don't commit fallacy of division). They are closely related.

