prompt: |-
  I'm currently taking an upper-division course on moral psychology and normative ethics, and for our peer-teaching session next week I have to guide a group of first-year philosophy students through the concept of moral worth and what it means to act for the right reasons. We've spent the past few lectures on the classic Kantian framework—acting from duty versus acting merely in accordance with it—but I want to move one layer deeper without losing them, by introducing the structural distinction between object-directed motivation (being moved by the concrete moral features of a situation itself) and principle-directed motivation (being moved by an abstract representation of one's duty). I need a teaching plan rather than a lecture script: the precise sequence in which these components must be introduced so that the distinction feels conceptually necessary rather than arbitrary, and why that dependency order matters.

  For the carrying example, I want a single concrete scenario—preferably not a familiar textbook case like the honest shopkeeper—that can hold both kinds of motivation in tension and make their difference visible without relying on specialized vocabulary. I also need a map of the misconceptions this audience will predictably form—such as equating "right reasons" with emotional warmth, with feeling guilty, or with mechanically following a rule—and the exact point in the sequence where each should be intercepted before it hardens. Please include one diagnostic question I can pose at the end to determine whether they've grasped the structural point about practical reasoning rather than just memorized the labels, and an explicit note on which adjacent debates—perhaps the relation between moral worth and explicit moral knowledge, or whether right reasons must be conscious—to openly leave out at this level and say so. The students have only read a standard introductory ethics text, and I have roughly forty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** First-year philosophy students (introductory level, familiar with basic Kantian duty vs. inclination but not deep meta-ethics).
      *   **Topic:** Moral worth, acting for the right reasons, specifically the distinction between *object-directed motivation* (moved by concrete moral features) and *principle-directed motivation* (moved by abstract duty).
      *   **Goal:** A teaching plan (sequence/structure), not a script. Needs to make the distinction feel *necessary*, not arbitrary.
      *   **Constraints:** 40 minutes, single concrete scenario (no "honest shopkeeper"), map of misconceptions + interception points, one diagnostic question, explicit note on excluded adjacent debates.
      *   **Tone:** Pedagogical, structured, precise.

  2.  **Deconstruct the Core Concept:**
      *   The user wants to move beyond the basic "Duty vs. Inclination" dichotomy often taught in intro classes.
      *   They want to introduce a nuance: Is the agent motivated by *the suffering itself* (object-directed) or by *the thought that I ought to relieve suffering* (principle-directed)?
      *   *Challenge:* First-years usually think "Duty = Good, Inclination = Bad." The user wants to complicate this without confusing them. The distinction is subtle: Both can be "moral," but the *structure* of reasoning differs.
      *   *Strategy:* I need to show why the *structure* matters for moral worth, not just the outcome.

  3.  **Develop the Scenario:**
      *   *Requirement:* Not the honest shopkeeper. Needs to hold both motivations in tension.
      *   *Idea 1:* Returning a lost wallet. (Too common).
      *   *Idea 2:* Visiting a sick friend. (Good, allows for sympathy vs. duty).
      *   *Idea 3:* Helping a stranger in distress.
      *   *Selection:* **The Overwhelmed Caregiver.** A scenario where someone helps a difficult neighbor.
      *   *Why?* It allows for natural sympathy (which might be absent) and a sense of obligation. It avoids the "shopkeeper" profit motive. It makes the "cold duty" vs. "warm sympathy" tension clear, but allows us to pivot to the deeper structural point (focusing on the need vs. focusing on the rule).
      *   *Refinement:* Let's make it about **returning a borrowed item to someone who is currently going through a crisis.**
      *   *Actually, better:* **The Late-Night Ride.** A student drives a stranded acquaintance home.
      *   *Why?* It involves sacrifice (time, sleep). It allows for "I see they are tired/scared" (object) vs. "I promised/I ought to help" (principle).
      *   *Final Choice:* **The Difficult Favor.** Let's go with **visiting a hospitalized acquaintance who is known to be difficult/grumpy.**
      *   *Reasoning:* It removes "sympathy" as an easy motivator (since the person is grumpy). It forces the question: Are you going because you see *their need for company* (object) or because you think *visiting the sick is a duty* (principle)? This highlights the structural distinction well.

      *Wait, let's refine the scenario to better fit the "Object vs. Principle" distinction specifically.*
      *   *Object-Directed:* Moved by the *fact that the person is suffering*.
      *   *Principle-Directed:* Moved by the *maxim that one ought to aid the suffering*.
      *   *Scenario:* **The Rainy Bus Stop.** You see a stranger struggling with groceries in the rain.
      *   *Agent A:* Helps because they see the person is wet and struggling (focus on the *state of the other*).
      *   *Agent B:* Helps because they think "I am a person who helps strangers" or "It is my duty to help" (focus on the *status of the action/agent*).
      *   *Actually, the prompt asks for "Object-Directed" vs "Principle-Directed".*
      *   Let's use **The Borrowed Book.** You borrowed a book. The owner needs it back.
      *   *Scenario:* **The Promised Return.** You promised to return a book to a classmate today. They are sick and can't meet. You could drop it off, but it's out of your way.
      *   *Motivation 1:* "They need this book for their study." (Object: The need).
      *   *Motivation 2:* "I made a promise, and promises must be kept." (Principle: The rule).
      *   *This is too close to standard Kant.*
      *   *Let's try to capture the specific nuance requested:* "Concrete moral features" vs "Abstract representation of duty."
      *   *Scenario:* **The Distressed Friend.**
      *   *Context:* Your friend is crying.
      *   *Agent 1:* Comforts them because *they are crying* (response to the pain).
      *   *Agent 2:* Comforts them because *friends ought to comfort friends* (response to the norm).
      *   *This works.* It's relatable. It avoids the shopkeeper.

  4.  **Sequence the Plan (The "Why" of the Order):**
      *   *Step 1: Anchor in Intuition.* Get them to judge the action first. (5 mins)
      *   *Step 2: Dissect the Motivation.* Introduce the two agents. (10 mins)
      *   *Step 3: The Problem of "Warmth".* Intercept the idea that Agent 1 is better just because they feel nice. (10 mins)
      *   *Step 4: The Structural Distinction.* Formalize Object vs. Principle. (10 mins)
      *   *Step 5: Diagnosis.* (5 mins)
      *   *Total:* 40 mins.

  5.  **Map Misconceptions:**
      *   *Misconception 1:* "Right reasons = Nice feelings." (Intercept during Step 3).
      *   *Misconception 2:* "Right reasons = Following a rule mechanically." (Intercept during Step 4).
      *   *Misconception 3:* "Object-directed is just inclination." (Crucial distinction: responding to moral features isn't just desire).

  6.  **Drafting the Content - Section by Section:**

      *   *Title:* Needs to be clear.
      *   *Scenario:* "The Grumpy Neighbor." (Let's stick with the Hospital/Grumpy idea or the Distressed Friend. Let's go with **The Distressed Acquaintance**. It's neutral enough). Let's refine: **The Stranded Commuter.** You see someone stranded.
      *   *Actually, let's look at the prompt again:* "Object-directed motivation (being moved by the concrete moral features of a situation itself) and principle-directed motivation (being moved by an abstract representation of one's duty)."
      *   *Scenario:* **The Leaky Roof.** A neighbor's roof is leaking.
      *   *Agent A:* Helps because *the furniture is getting ruined / the neighbor is stressed* (Concrete features).
      *   *Agent B:* Helps because *neighbors ought to help neighbors* (Abstract principle).
      *   *Let's go with **The Late Assignment Extension**.* No, too bureaucratic.
      *   *Let's go with **The Lost Wallet** but tweaked.* No, prompt said no shopkeeper, wallet is close.
      *   *Okay, **The Hospital Visit** is the strongest.*
      *   *Scenario:* Visiting a sick, irritable colleague.
      *   *Agent A:* Goes because they perceive the *loneliness* of the colleague.
      *   *Agent B:* Goes because they perceive the *obligation of collegiality*.
      *   *This allows the "Object" (loneliness) to be moral without being "inclination" (liking them).*

      *   *Wait, I need to make sure the sequence makes the distinction feel NECESSARY.*
      *   *Start:* Is the action good? Yes.
      *   *Next:* Does motivation matter? Yes (Kant).
      *   *Next:* Is it just Duty vs. Desire? (The Trap).
      *   *Next:* Introduce the nuance. Both agents might be "moral," but how do they reason?
      *   *Next:* Show why the distinction matters for *moral worth* (stability, scope, etc.).

      *   *Misconception Interception:*
      *   *Warmth:* Stop them from saying Agent A is better because they "care more."
      *   *Robot:* Stop them from saying Agent B is a "mindless rule follower."

      *   *Diagnostic Question:* Needs to test structure, not labels. "If Agent A forgot the principle, would they still act? If Agent B forgot the concrete feature, would they still act?"

      *   *Excluded Debates:* Conscious access to reasons (psychological realism), Moral Knowledge (do you need to know *why* it's good), Consequentialist evaluation of the motive.

  7.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Is 40 minutes enough for this level of nuance?
      *   *Adjustment:* Keep the scenario extremely tight. Don't let the story drag. Focus on the *thought bubble* of the agents.
      *   *Critique:* First-years might conflate Object-Directed with Inclination.
      *   *Adjustment:* Explicitly distinguish "Desire to help" (inclination) from "Response to Need" (object-directed moral perception). This is the hardest part. I need to make sure the plan addresses this.
      *   *Correction:* The prompt asks to distinguish Object-Directed vs Principle-Directed. I must ensure I don't collapse Object-Directed into "Inclination."
      *   *Strategy:* Frame Object-Directed as "Perceiving the Claim." Frame Principle-Directed as "Acknowledging the Law."

  8.  **Finalizing the Structure:**
      *   **Phase 1: The Intuitive Anchor (5 mins).** Scenario + Action.
      *   **Phase 2: The Motivation Split (10 mins).** Two internal monologues.
      *   **Phase 3: Intercepting the "Warmth" Fallacy (10 mins).** Why feelings aren't the metric.
      *   **Phase 4: The Structural Necessity (10 mins).** Why the distinction matters (fragility vs. stability).
      *   **Phase 5: Diagnostic & Scope (5 mins).** Question + Exclusions.

  9.  **Writing the Plan:** (Focusing on the "Why this order" justification as requested).
      *   Ensure the "Misconception Map" is integrated into the timeline.
      *   Ensure the "Excluded Debates" are explicit.
      *   Ensure the Diagnostic Question tests reasoning structure.

      *(Self-Correction on Scenario)*: Let's use **The Difficult Apology**. You wronged someone. They are angry.
      *   Agent A: Apologizes because they see the *hurt they caused*. (Object: The Hurt).
      *   Agent B: Apologizes because *one ought to apologize when wrong*. (Principle: The Norm).
      *   *Problem:* Too much guilt involved.
      *   *Let's stick with **The Hospital Visit**.* It's classic but distinct from the Shopkeeper.
      *   *Scenario:* **The Unpleasant Patient.**
      *   *Context:* You volunteer at a hospital. Assigned to a patient who is rude and ungrateful.
      *   *Action:* You spend extra time with them.
      *   *Agent 1 (Object):* "He is terrified of being alone." (Focus on the *fear*).
      *   *Agent 2 (Principle):* "A caregiver must not abandon patients." (Focus on the *role/duty*).
      *   *This works perfectly.* It separates "liking the person" (inclination) from "seeing the need" (object-directed).

  10. **Final Review against constraints:**
      *   Teaching plan? Yes.
      *   Sequence justification? Yes.
      *   Single scenario? Yes (The Unpleasant Patient).
      *   Misconception map + interception points? Yes.
      *   Diagnostic question? Yes.
      *   Excluded debates? Yes.
      *   40 minutes? Yes.
      *   First-year level? Yes (avoiding heavy jargon).

      *(One last check on the "Object-Directed" definition)*: The prompt defines it as "being moved by the concrete moral features of a situation itself."
      *   In the Hospital scenario: The "concrete moral feature" is the *patient's vulnerability*.
      *   Principle-Directed: The "abstract representation" is *the duty of care*.
      *   This fits perfectly.

      *(One last check on Misconceptions)*:
      *   "Right reasons = Emotional warmth." (Intercept: Agent 1 isn't necessarily 'warm', they are attentive to the fear).
      *   "Right reasons = Mechanical rule following." (Intercept: Agent 2 isn't a robot, they are committed to a norm).
      *   "Object-directed = Inclination." (Crucial: Seeing a need isn't the same as wanting to help. It's recognizing a claim).

      *Let's build the plan.*
answer: |-
  # Teaching Plan: The Structure of Moral Motivation
  **Course:** Moral Psychology & Normative Ethics (Upper-Division Peer Teaching)
  **Audience:** First-Year Philosophy Students
  **Time:** 40 Minutes
  **Core Concept:** Distinguishing Object-Directed Motivation (response to concrete moral features) from Principle-Directed Motivation (response to abstract duty).

  ---

  ## I. Pedagogical Rationale: Why This Sequence?
  The sequence below is designed to prevent the "Duty vs. Inclination" binary from hardening before you introduce the nuance. First-year students typically equate "acting from duty" with "acting against desire" and "acting from reasons" with "having warm feelings."

  1.  **Anchor in Action (Phase 1):** We must establish that the *external action* is identical to remove consequentialist evaluation.
  2.  **Diverge in Thought (Phase 2):** We introduce the two motivations only *after* they agree the action is good. This forces them to look inward at reasoning, not outward at results.
  3.  **Intercept "Warmth" (Phase 3):** Students will immediately prefer the Object-Directed agent as "nicer." You must disrupt this before they dismiss the Principle-Directed agent as morally inferior.
  4.  **Formalize the Structure (Phase 4):** Only after clearing the emotional debris can you define the structural distinction (Concrete Feature vs. Abstract Representation).
  5.  **Diagnose (Phase 5):** Test for structural understanding, not vocabulary recall.

  ---

  ## II. The Carrying Example: "The Unpleasant Patient"
  *Do not use the Honest Shopkeeper or the Drowning Child.*

  **The Scenario:**
  You are a volunteer at a hospital. You are assigned to sit with a patient, Mr. K, for one hour. Mr. K is known to be irritable, rude, and ungrateful to volunteers. Most people avoid him. You choose to stay the full hour and engage him in conversation.

  **The Action:** Staying with the patient.
  **The Outcome:** Mr. K is less lonely; you fulfilled your shift.

  ---

  ## III. Session Sequence (40 Minutes)

  ### Phase 1: The Intuitive Anchor (5 Minutes)
  **Goal:** Secure agreement on the moral value of the *action* to isolate the *motive*.

  1.  **Present the Scenario:** Briefly describe "The Unpleasant Patient."
  2.  **Ask:** "Is staying with Mr. K a morally good thing to do?" (Expect unanimous 'Yes').
  3.  **Ask:** "If you did this just to get a credit for your course, would it still be morally good?" (Expect 'No' or 'Less good').
  4.  **Transition:** "We agree the action is right, and we agree the motive matters. Today we are looking at two motives that both seem 'moral,' but work differently."

  ### Phase 2: The Motivation Split (10 Minutes)
  **Goal:** Visualize the two distinct internal monologues without labeling them yet.

  1.  **Introduce Agent A:**
      *   *Thought:* "Mr. K is shouting, but I can see he is terrified of being alone. His vulnerability demands a response."
      *   *Focus:* The **Concrete Feature** (The fear/loneliness in the room).
  2.  **Introduce Agent B:**
      *   *Thought:* "I signed up for this role. A caregiver does not abandon a patient because they are difficult. I must honor the commitment I made."
      *   *Focus:* The **Abstract Representation** (The role/duty/commitment).
  3.  **Activity:** Ask students to turn to a partner and identify: *What is the 'engine' moving each agent?* (2 minutes discussion).
  4.  **Board Work:** Draw two columns. Label them "Agent A" and "Agent B." Write "The Fear" under A and "The Commitment" under B.

  ### Phase 3: Intercepting Misconceptions (10 Minutes)
  **Goal:** Prevent the hardening of two specific errors before defining the concepts.

  **Misconception 1: The "Warmth" Fallacy**
  *   *The Trap:* Students will argue Agent A is better because they are "more empathetic" or "kinder."
  *   *Interception Point:* **Immediately after Phase 2.**
  *   *Intervention:* "Notice that Agent A isn't necessarily *feeling* sorry for Mr. K. They are *perceiving* his fear. You can perceive a moral feature without feeling warm. If Agent A was tired and annoyed but still saw the fear and acted, does their worth drop? No. Don't confuse *perception of need* with *emotional affection*."

  **Misconception 2: The "Robot" Fallacy**
  *   *The Trap:* Students will argue Agent B is "mindlessly following rules" or "cold."
  *   *Interception Point:* **During the comparison of stability.**
  *   *Intervention:* "Agent B isn't a robot. They are actively upholding a value they endorse (caregiving). If Agent B didn't care about the *principle* of caregiving, they wouldn't act. Acknowledging a duty is an active engagement, not a mechanical reflex."

  **Misconception 3: Object-Directed as Mere Inclination**
  *   *The Trap:* Equating Agent A with "I wanted to help."
  *   *Interception Point:* **When defining Object-Directed.**
  *   *Intervention:* "If Agent A hated Mr. K but still saw his terror and felt bound by *that terror* to act, they are still Object-Directed. They are moved by the *claim the situation makes on them*, not by their own desire."

  ### Phase 4: The Structural Distinction (10 Minutes)
  **Goal:** Formalize the vocabulary and explain why the distinction is necessary.

  1.  **Introduce Terms:**
      *   **Object-Directed:** Motivated by the *moral properties of the situation* (e.g., the suffering, the need, the promise broken). The reason is "out there" in the world.
      *   **Principle-Directed:** Motivated by the *moral status of the action/agent* (e.g., 'this is my duty,' 'this is virtuous'). The reason is "in here" in the code/norm.
  2.  **The Necessity Argument:** Why do we need this distinction?
      *   *Fragility Test:* Ask: "What happens if the concrete feature disappears?"
          *   If Mr. K stops looking scared (maybe he falls asleep), Agent A might leave.
          *   Agent B stays because the *shift* isn't over.
      *   *Scope Test:* Ask: "What happens in a new situation?"
          *   Agent A responds to new needs instantly.
          *   Agent B needs to know if a rule covers the new situation.
  3.  **Synthesis:** "Both have moral worth. But they navigate the moral world differently. One navigates by **landscape** (features); the other by **compass** (principles)."

  ### Phase 5: Diagnostic & Scope (5 Minutes)
  **Goal:** Verify understanding and set boundaries.

  1.  **The Diagnostic Question:**
      *   *Pose this:* "Imagine Agent A (Object-Directed) helps Mr. K. Later, you ask them, 'Why did you do that?' They say, 'I don't know, I just saw he needed help.' Imagine Agent B (Principle-Directed) helps. They say, 'Because it was my duty.' **If Agent A cannot articulate a principle, do they lack moral worth? If Agent B cannot describe Mr. K's feelings, do they lack moral worth?**"
      *   *Correct Grasp:* Students should recognize that Agent A's reasoning is *embedded in the perception* (no need for abstract articulation), while Agent B's reasoning is *embedded in the norm* (no need for emotional resonance). The worth lies in the *alignment* with the reason, not the ability to lecture about it.
  2.  **Explicit Exclusions (The "Do Not Enter" Sign):**
      *   *Write on Board:* **OUT OF SCOPE FOR TODAY.**
      *   **Conscious Access:** "We are not debating whether you need to *consciously think* these thoughts in the moment. You can act on principle habitually."
      *   **Moral Knowledge:** "We are not asking which agent *knows more* about ethics. Both know enough to act."
      *   **Consequentialism:** "We are not judging which agent produces *better outcomes*. We are judging the *structure of the will*."

  ---

  ## IV. Map of Predictable Misconceptions

  | Misconception | Why it forms | Interception Point | Correction Strategy |
  | :--- | :--- | :--- | :--- |
  | **"Right Reasons = Warm Feelings"** | Students conflate moral motivation with sentimental virtue ethics. | **Phase 3 (Warmth Fallacy)** | Distinguish *perceiving a claim* from *feeling affection*. Use the "tired/annoyed Agent A" counter-example. |
  | **"Principle = Mechanical Rule"** | Students view duty as external coercion rather than internal endorsement. | **Phase 3 (Robot Fallacy)** | Emphasize that Agent B *endorses* the principle. It is their own commitment, not an external command. |
  | **"Object-Directed = Inclination"** | Students think responding to concrete features is just "doing what you want." | **Phase 3 (Inclination Trap)** | Highlight that the "concrete feature" (e.g., suffering) imposes a *demand*, not just an attraction. |
  | **"One is Superior"** | Students want a winner (usually Kantians pick B, Sentimentalists pick A). | **Phase 4 (Synthesis)** | Frame them as *structural variants* of moral worth, not a hierarchy. Focus on the "Fragility Test." |

  ---

  ## V. Instructor Notes for Delivery

  *   **Pacing:** Do not let Phase 2 drag. The monologues must be short and punchy. If students start debating whether Mr. K *deserves* help, cut it off: "For this exercise, the help is morally required. Focus on the *why*."
  *   **Vocabulary:** Do not write "Deontological" or "Particularist" on the board. Stick to "Principle-Directed" and "Object-Directed."
  *   **The "Click" Moment:** The distinction lands when students realize Agent A isn't just "nice" and Agent B isn't just "strict." Both are responding to *moral reality*, just via different interfaces.
  *   **Handling Pushback:** If a student insists Agent B is "less moral," ask: "If Mr. K was pleasant, Agent B would still help. If Mr. K was pleasant, Agent A might help *more*. Who is more reliable when the 'concrete feature' is hard to see?" This validates the Principle-Directed structure without denigrating the Object-Directed one.
