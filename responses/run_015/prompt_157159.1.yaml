answer: |-
  This is a sharp reading of a notoriously difficult section. You've hit on the exact pressure points where Nyāya realism gets strained against its own epistemological rules. Vācaspati is walking a tightrope here: he needs to explain how we know universals (to save realism) without collapsing perception into inference (to save the definition of *pratyakṣa*).

  Here is the logic untangled, addressing your specific worries about spatiality, redundancy, circularity, and that "self-locating" twist.

  ### 1. Is the Universal a "Non-Spatial" Object?
  You asked if Vācaspati is literally saying perception grasps a non-spatial object. The short answer is **no**, but the Nyāya definition of "spatial" is doing heavy lifting here.

  For Nyāya, a universal (*sāmānya*) like "cowness" is not an abstract Platonic form floating outside space. It is a real entity (*padārtha*) that **inheres** in every individual cow. It is omnipresent *within its instances*. It is spatially located wherever a cow is.

  The "extraordinary" (*alaukika*) part isn't that the object is non-spatial; it's that your sense organ (eyes) is physically contacting *one* cow, but through the metaphysical link of the universal, it is treated as contacting **all** cows (past, present, future) simultaneously.

  Vācaspati isn't smuggling in a non-spatial object. He is claiming the sense organ transcends its physical limits via the universal. If you view the universal as a mental construct (like a Buddhist would), then yes, this looks like inference or imagination. But Vācaspati is arguing from a realist ontology: the universal is *there*, in all the instances, so the sense can technically "touch" it all at once if the contact mechanism is extraordinary.

  ### 2. Is He Smuggling Inference into Perception?
  This is the classic opponent's charge. If I know "all cows are mortal" without checking every cow, isn't that inference?

  Vācaspati's defense rests on **immediacy** (*aparokṣatva*).
  *   **Inference (*Anumāna*):** Requires a middle term (*hetu*). You see smoke, you remember the relation between smoke and fire, you *conclude* fire. It is mediate knowledge.
  *   **Sāmānyalakṣaṇa Perception:** There is no mental syllogism. The universal is presented directly to the consciousness.

  Vācaspati argues that if this were inference, we wouldn't have the *phenomenological feel* of directness we have when we recognize "This is a cow." We don't think, "This has horns, humps, etc., therefore it is a cow." We just see "cow." He claims that immediate grasp of the class-character is perceptual, even if the *contact* is extraordinary.

  He isn't smuggling inference in; he is expanding the definition of "contact" (*sannikarṣa*) to save the immediacy of recognition.

  ### 3. Redundancy and Circularity
  You noted that if perception grasps the universal in all unobserved cases, inference seems redundant. And you're right to worry about circularity: Nyāya says inference depends on perceiving the universal (*vyāpti*), but if perception already gives us knowledge of all instances, why infer?

  Here is the logical distinction Vācaspati is aiming for:
  *   **Perception of the Universal:** Grasps the *relation* itself (e.g., the connection between "smoke-ness" and "fire-ness"). It establishes the rule.
  *   **Inference:** Applies that rule to a **specific new subject** (*pakṣa*) to generate knowledge about *that* subject.

  *Sāmānyalakṣaṇa* perception explains how we know the *vyāpti* (pervasion) in the first place. It grounds the inference. It doesn't make inference redundant because inference is the *process* of applying that ground to a specific doubt-ridden situation.

  **Is there circularity?**
  Only if you demand that we must perceive every instance to know the universal. Nyāya rejects that. They argue: We perceive some instances -> The universal connects us to all instances (via *alaukika*) -> We know the rule -> We infer specific unobserved cases.
  The circularity is avoided because the *alaukika* contact is the bridge. It's not "I infer the universal from instances"; it's "I perceive the universal in these instances, and because the universal is one, I access its presence in all instances."

  ### 4. The "Self-Locating Belief Update" Twist
  This is your most provocative point. If we treat the yogic/perceptual state as a "self-locating belief update" (indexical knowledge based on the knower's position in the causal chain), does it break Nyāya objectivity?

  **Yes, it breaks it completely.** And Vācaspati would reject this framing.

  Nyāya epistemology is rigorously **realist and correspondence-based** (*yāthārthya*). A *pramāṇa* (means of knowledge) is valid because it corresponds to reality, not because it updates the agent's internal state successfully.
  *   **Indexicality:** If knowledge is "I am here in the causal chain," the truth value depends on the *I* and the *here*.
  *   **Nyāya View:** The truth is "The universal inheres in the object." The knower is a transparent conduit.

  If you frame *sāmānyalakṣaṇa* as a belief update relative to the agent's conditioning, you are shifting from **ontological revelation** to **epistemic construction**.
  *   **Vācaspati's Stance:** The "yogic clarity" or "prior conditioning" doesn't *create* the knowledge or make it relative to the agent. It merely removes the obstacles (*āvaraṇa*) that prevent the sense from making that extraordinary contact. The contact itself is an objective metaphysical fact, not a subjective belief state.

  If you treat it as self-locating, you imply that the universal isn't really "out there" being contacted, but rather the mind is positioning itself relative to data. That moves you toward Vijñānavāda (Buddhist Idealism) or Pragmatism. Vācaspati is fighting *against* that. He needs the universal to be objectively contacted so that inference (which relies on it) remains objective.

  ### Where the Passage is Actually Going
  Vācaspati's goal in this section of the *Tātparyaṭīkā* is defensive. He is fortifying the Nyāya system against Buddhist attacks that say:
  1.  Universals aren't real.
  2.  Perception only sees particulars.
  3.  Therefore, all knowledge of classes is just inference/construction.

  If the Buddhists win, Nyāya realism collapses. So Vācaspati doubles down on *alaukika sannikarṣa*. He is willing to make perception "weird" (extraordinary contact) to keep it "direct."

  **The Logic Flow:**
  1.  We recognize classes immediately (phenomenology).
  2.  Ordinary perception can't explain this (it only sees particulars).
  3.  Inference can't explain this (it's too slow/mediate).
  4.  Therefore, there must be a special kind of perception (*sāmānyalakṣaṇa*).
  5.  This requires a special contact (*alaukika*).
  6.  This contact is objective (not agent-relative) because the universal is real and omnipresent in its instances.

  **Summary on your stuck points:**
  *   **Non-spatial?** No, omnipresent in instances.
  *   **Smuggled Inference?** No, defended as immediate grasp vs. mediate conclusion.
  *   **Redundant Inference?** No, perception grounds the rule; inference applies the rule.
  *   **Self-Locating Update?** Yes, that interpretation breaks Nyāya objectivity. Vācaspati insists the "conditioning" removes noise; it doesn't make the truth agent-relative.

  He is prioritizing **ontological commitment** (universals are real and contactable) over **empirical simplicity** (senses only touch what's right in front of them). He'd rather accept "extraordinary contact" than admit that our basic recognition of kinds is just mental construction.
