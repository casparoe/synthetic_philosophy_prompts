      *   *Key Insight:* The EPA assumes that as a civilization matures, the *fraction* of observers who are "AS" goes to zero. If the *absolute number* of AS observers stays high (even if fraction drops), SIA might still favor the long future. But EPA relies on SSA (sampling from the class). So it depends on the *ratio* of AS(Long) to AS(Short).
