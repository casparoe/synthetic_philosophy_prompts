answer: |-
  Here is the position: **Your friend is wrong.** His argument that an undefined expected value (EV) licenses "anything goes" pricing is a category error that conflates the failure of a specific mathematical tool (linear expectation) with the collapse of rational decision-making itself.

  You should **not** play this game for $100, and you certainly should not pay $200.

  Here is the formal breakdown of why his reasoning fails, why the symmetry matters, and which decision framework actually survives the undefinedness.

  ### 1. The Math: He Is Right About the Divergence, Wrong About the Implication
  First, let's validate the game mechanics so we are on solid ground.
  *   Probability of stopping at flip $n$: $P(n) = (1/2)^n$.
  *   Payout $X_n$: $+2^n$ if $n$ is even, $-2^{n-1}$ if $n$ is odd.
  *   Expected Contribution per $n$: $P(n) \cdot X_n$.
      *   If $n$ is odd: $(1/2)^n \cdot (-2^{n-1}) = -1/2$.
      *   If $n$ is even: $(1/2)^n \cdot (2^n) = +1$.
  *   The Expected Value series is: $-1/2 + 1 - 1/2 + 1 - 1/2 \dots$

  The terms of this series do not approach zero; they oscillate between $-0.5$ and $1$. By the Divergence Test, the series **diverges**. It does not sum to $+\infty$ (like St. Petersburg), nor $-\infty$, nor any finite number. It is genuinely undefined.

  **The Friend's Error:** He claims that because the linear expectation is undefined, there is "no rational ceiling." This is a non-sequitur. In decision theory, if a metric yields undefined results, it indicates the metric is **inapplicable**, not that constraints vanish. If a thermometer breaks at 1000°C, it doesn't mean the fire is infinitely hot; it means you need a different instrument.

  ### 2. Why "Anything Goes" Pricing Is Irrational
  Your friend's argument relies on **Risk Neutrality** (valuing a gamble solely by its arithmetic mean). Risk neutrality is a specific preference structure, not a requirement of rationality.

  If you accept his logic, you must accept that paying $1,000,000 to play is also "defensible." Why? Because if there is no ceiling, any price is theoretically permissible. But consider the **median outcome**:
  *   50% chance the game ends at $n=1$. Payout: $-\$1$. Net (at $100 entry): $-\$101$.
  *   75% chance the game ends by $n=2$. Payout: $-\$1$ or $+\$4$.
  *   The vast majority of the probability mass is concentrated on small $n$, where the negative payouts dominate the entry fee.

  A rational agent cares about the **distribution of outcomes**, not just the undefined mean. In this distribution, the probability of losing your entry fee is extremely high (50% chance of immediate loss), while the probability of winning enough to cover a $200 entry fee requires $n \ge 8$ (probability $< 1\%$).

  **Verdict:** Pricing based on an undefined EV is not "defensible"; it is arbitrary. Rationality demands you price based on *your* utility function, not an abstract, diverging sum.

  ### 3. The Symmetry and "Undefinedness"
  You asked if the symmetry (failing to converge in both directions) matters compared to the standard St. Petersburg paradox (diverging to $+\infty$).

  **Yes, it matters critically.**
  *   **St. Petersburg ($+\infty$ EV):** The problem is that the upside is *too* big. The rational solution is usually **Bounded Utility** (e.g., Log Utility). If you value money logarithmically, the St. Petersburg EV becomes finite (around $2–$10 depending on wealth).
  *   **This Game (Oscillating EV):** The problem is that the upside and downside are *both* too big and cancel each other out unpredictably. Bounded utility actually solves this *better*. Because utility functions for losses are typically steeper than for gains (loss aversion) and bounded overall, applying a utility function $U(x)$ to the payouts will force the series to converge absolutely.

  If you apply a standard concave utility function (like $U(w) = \ln(w)$), the massive negative payouts for odd $n$ will create large negative utility spikes that are not fully offset by the positive utility of even $n$, especially since the probability of reaching the huge payouts drops exponentially. The "Generalized Expectation" becomes negative.

  ### 4. Knightian Ambiguity vs. Banach Limits
  You asked if we should treat this as Knightian ambiguity or use a Banach limit.

  *   **Knightian Ambiguity:** This applies when probabilities are *unknown*. Here, the probabilities are known ($1/2$). This is **Risk**, not Ambiguity. However, because the moments are undefined, it *feels* like ambiguity. Applying **Maximin** (maximize the minimum gain) is a prudent heuristic here. The minimum gain is effectively negative infinity (as $n$ grows, the loss grows without bound). Maximin says: **Do not play.**
  *   **Banach Limits:** Using a Banach limit to assign a value (e.g., forcing the oscillating series to average to $0.25$) is **mathematical sleight-of-hand**. A Banach limit is an axiom you impose to force convergence; it is not a property of the game itself. Relying on it for financial decision-making is unjustified because it ignores the *variance* and *tail risk*. It papers over the undefinedness rather than respecting it.

  **Which response survives?**
  **Bounded Utility.** This is the only framework that survives taking the undefinedness seriously. It acknowledges that human agents have finite wealth and finite capacity to absorb loss. Once you cap the utility of money, the "undefined" expectation immediately resolves into a concrete, usually negative, expected utility.

  ### 5. Final Recommendation
  Your friend is trying to use a mathematical pathology to exploit a social situation. He is arguing that because the "average" doesn't exist, you cannot claim the price is too high. This is false. You can claim the price is too high because the **probability of loss is unacceptable.**

  **Do not pay $100.**
  1.  **50% Chance:** You lose $101 immediately ($n=1$).
  2.  **25% Chance:** You win $4 ($n=2$), net loss $96.
  3.  **Break-even:** You need $n \ge 8$ just to cover a $100 entry fee. The chance of this is $1/256$ (< 0.4%).

  The game is a wealth-transfer mechanism from the risk-averse to the risk-neutral, disguised as a paradox. The undefined expectation is a warning sign, not a loophole. Tell your friend that rational choice theory doesn't break; his application of it does.

  **Position:** The argument does not hold. The price is not defensible. Walk away.
