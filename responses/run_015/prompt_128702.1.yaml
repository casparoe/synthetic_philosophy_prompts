prompt: |-
  Hey — I need a teaching plan here, not an explanation of the topic itself. Context: I'm a third-year PhD student and I'm TAing the Freedom and Responsibility module again, and I've got one 60-minute section next Thursday with about a dozen first-years, a whiteboard, no slides, and a bit of a cold, so ideally something that doesn't require me to talk straight through the hour. In Monday's lecture they were given the principle of alternative possibilities — roughly, you're morally responsible for what you did only if you could have done otherwise — and they were assigned the classic Frankfurt case, the one where the intervener would have stepped in if the agent had started to show some prior sign of deciding differently, but never actually does anything. Last year this exact section went badly: half the room left saying so Frankfurt is just a determinist with extra machinery, the other half said the case is cheating because the guy is obviously being controlled, and nobody could tell me what the case was even supposed to be an argument against. So plan the hour for me.

  Concretely, what I want: what has to be on the board before the case can do any work at all — is PAP best sold to them as an explanation of why blame is fair, or just as a necessary condition on it, and does the gap between could-have-done-otherwise as a bare counterfactual and could-have-done-otherwise as a genuine ability (something the agent has access to, something robust) need to be in place first? Why does the case land differently depending on which of those is up? Then the order of the pieces and what depends on what. And I want one case to carry the whole session, and I'd rather not just re-run the one from the reading: so tell me what the carrying example has to have (a reliable prior sign, an intervener who never fires, a decision that is genuinely the agent's own) and what it must not have (a threat, a gun, a coercive offer, anything that reads as the agent being pushed rather than bypassed), and why each of those features or absences matters.

  Relatedly, I've been playing with two variants of my own and can't decide whether either belongs in the hour. Call the first the leaky intervener: the device works only most of the time, so if the agent had tried to do otherwise he'd have had, say, a forty percent chance of actually getting away with it — nothing forces the outcome, there's just no guarantee. Call the second the output-only case: the device leaves the deciding and the willing completely untouched and only redirects the bodily movement at the very last moment, so the agent really does decide and try to do otherwise and simply doesn't get there. Is either of these pedagogically useful, or do they just muddy the water? If one is worth using, where exactly does it go in the sequence and what is it supposed to make them notice — that PAP needs a robust alternative rather than any alternative at all, that the alternative has to be an alternative willing rather than an alternative outcome, both, or something I haven't thought of?

  Then the failure modes, which is the part I care most about. I can guess at a few: that this is determinism in disguise; that the device causes the action despite doing nothing; that the agent could still have willed or tried otherwise, or at least could have failed to show the sign; that Frankfurt just helps himself to the intuition that the agent is responsible, so the case begs the question; and, from the one physics student who'll definitely be there, whether an infallible prior sign is even physically possible and whether it matters if it isnt. Which of these will actually come up, in what order will they come up, and at which point in the sequence should I head each one off rather than answer it? Which single one should I deliberately let hang for a bit? I also want one question to end on that tells me whether they've grasped the structure of the dialectic rather than just whether they've been persuaded, plus an explicit list of what I should openly refuse to get into at this level — reasons-responsiveness, the actual-sequence stuff, the whole secondary literature on whether the case succeeds — and how to say no without sounding like I'm dodging.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **User:** Third-year PhD student, TA for "Freedom and Responsibility" module.
      *   **Task:** Create a 60-minute teaching plan (section) for first-year undergraduates.
      *   **Constraints:**
          *   No slides, whiteboard only.
          *   TA has a cold (minimize lecturing, maximize student activity/discussion).
          *   Class size: ~12 students.
          *   Context: Lecture covered Principle of Alternative Possibilities (PAP). Reading was the classic Frankfurt case (intervener, prior sign, never acts).
          *   Previous Year's Failure: Students thought it was just determinism, thought it was cheating/control, didn't understand the target (PAP).
          *   Specific Needs:
              *   Board work prerequisites (PAP formulation, robustness vs. bare counterfactual).
              *   One carrying example (must be new, specific constraints on features).
              *   Evaluation of two proposed variants (Leaky Intervener, Output-Only).
              *   Failure modes (determinism disguise, causation, flickers, question-begging, physics). Order of appearance and management.
              *   Closing question (tests grasp of dialectic, not just agreement).
              *   Boundary setting (what *not* to discuss: reasons-responsiveness, actual-sequence, deep literature).
      *   **Tone:** Professional, peer-to-peer (PhD to PhD), practical, strategic.

  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Core Problem:* First-years often conflate "couldn't do otherwise" due to *causal determination* with "couldn't do otherwise" due to *counterfactual intervener*. They also struggle to see *why* we care about PAP (is it about fairness? control?).
      *   *The Goal:* Show that Frankfurt cases target PAP specifically, not determinism, by isolating the *ability to do otherwise* from the *actual source of action*.
      *   *The Constraint:* TA has a cold. Needs student-centered activities (writing, small group, board work) rather than 60 mins of talking.

  3.  **Drafting the Plan - Section by Section:**

      *   **Board Work (Pre-requisites):**
          *   Need PAP clearly stated. Is it fairness or condition? Best to frame it as a *necessary condition* for MR (Moral Responsibility).
          *   Need the distinction between "Bare Counterfactual" (If X, then Y) vs. "Robust Ability" (Agent has access/power). This is crucial for the "Leaky" variant discussion.
          *   *Decision:* Put PAP up front. Define the terms.

      *   **The Carrying Example:**
          *   Needs to be distinct from the reading (usually Jones/Black). Let's use a voting scenario or a promise-keeping scenario. Voting is classic but maybe too political. Let's try a "Charity Donation" scenario.
          *   *Features needed:* Prior sign (neural blip?), Intervener (Chip?), No actual interference.
          *   *Features to avoid:* Threats, guns, coercion (makes it look like duress, not Frankfurt).
          *   *Why:* To isolate the *power to prevent* from the *exercise of that power*.

      *   **The Variants (Leaky vs. Output-Only):**
          *   *Leaky Intervener:* (40% chance of success). This tests the "Robustness" requirement. If PAP requires *robust* alternatives, a leaky chip might not kill PAP. If PAP requires *any* alternative possibility, it does. *Verdict:* Keep it. It clarifies the "Robustness" objection (the Flicker strategy).
          *   *Output-Only:* (Decision is free, body is hijacked). This destroys the intuition of responsibility. If the body moves against the will, the agent isn't responsible. This confuses the issue of *responsibility for action* vs. *responsibility for attempt*. *Verdict:* Drop it. It muddies the water regarding whether the agent *acted*.
          *   *Placement:* Use Leaky *after* the main case to test the strength of PAP.

      *   **Failure Modes & Management:**
          *   *Determinism Disguise:* Will come up early. *Strategy:* Distinguish causal chains from counterfactual blockers.
          *   *Causation/Doing Nothing:* "The chip caused it." *Strategy:* Emphasize the actual sequence was normal.
          *   *Flickers (Could have willed otherwise):* Will come up after Leaky. *Strategy:* Acknowledge but bracket (this leads to Reasons-Responsiveness, which is off-limits).
          *   *Question Begging:* "You just assume he's responsible." *Strategy:* Admit it's an intuition pump, ask if the intuition is *reasonable* given the setup.
          *   *Physics:* The infallible sign. *Strategy:* "Philosophical possibility vs. Physical possibility." Bracket it.
          *   *Which to let hang?* The "Flicker" objection (could have tried otherwise). It shows they understand the stakes but points to the next week's topic.

      *   **Boundary Setting:**
          *   Need to explicitly rule out Reasons-Responsiveness (Fischer), Actual Sequence, and deep metaphysics of time.
          *   *Phrasing:* "That's the solution for Week 5, today is about the problem in Week 3."

      *   **Closing Question:**
          *   Needs to test dialectic grasp. Not "Is PAP false?" but "If this case works, what dies? If it fails, why?"
          *   *Better:* "What specific premise does this case attack, and what premise do the objectors say it smuggles in?"

  4.  **Refining the Flow (Time Management for a Cold TA):**

      *   0-10: Board Setup & PAP definition (Silent writing + brief check).
      *   10-25: The Case (Student reconstruction).
      *   25-40: The Attack (Small group discussion on objections).
      *   40-50: The Variants (Leaky).
      *   50-60: Wrap & Exit Ticket.

      *   *Correction:* To save voice, use "Think-Pair-Share" and board solicitation. Write instructions on the board.

  5.  **Addressing Specific User Queries:**

      *   *PAP Formulation:* Necessary condition. Fairness is the *motivation*, condition is the *logic*.
      *   *Robustness:* Yes, needs to be on the board. It explains why "Leaky" matters.
      *   *Variant Choice:* Leaky is good (tests robustness). Output-only is bad (kills responsibility intuition).
      *   *Failure Modes:* Order them logically. Determinism first (biggest confusion). Flickers last (most sophisticated).
      *   *Boundaries:* Be firm but polite.

  6.  **Final Polish:**

      *   Ensure tone is supportive but direct.
      *   Check constraints: 60 mins, 12 students, whiteboard, cold.
      *   Make sure the "New Case" is clearly defined. Let's go with a "Exam Answer" case. It's relatable to students.
      *   *Wait, Exam Answer might imply cheating.* Let's go with "Choosing a Dessert" or "Signing a Petition." Let's choose "Signing a Petition." It involves a deliberate action.
      *   *Actually, let's stick closer to the prompt's request for features.* The prompt asks what the example *must* have. I need to specify that in the plan.
      *   *Re-evaluating the Variants:* The user asked "Is either... pedagogically useful?" I need to give a definitive answer. Leaky = Yes (for robustness). Output = No (confuses action).
      *   *Re-evaluating the Hanging Objection:* The "Flicker" (could have tried/signaled otherwise) is the best one to let hang because it naturally leads to the "Actual Sequence" view which is likely the next topic or the limit of this intro.

  7.  **Writing the Plan:** (Self-Correction during drafting)
      *   *Voice:* Keep it efficient. I'm talking to a colleague.
      *   *Structure:* Follow the prompt's structure (Board, Example, Variants, Failure Modes, Boundaries).
      *   *Cold Strategy:* Explicitly note where the TA sits down and lets students write/talk.

  8.  **Final Review against constraints:**
      *   Did I answer the PAP formulation question? Yes (Necessary Condition).
      *   Did I answer the Robustness question? Yes (Needs to be on board).
      *   Did I evaluate the variants? Yes (Leaky keep, Output drop).
      *   Did I order the failure modes? Yes.
      *   Did I provide the closing question? Yes.
      *   Did I list the off-limits topics? Yes.

      *(Self-Correction on the "Physics" objection)*: The prompt mentions a physics student. I need to make sure I tell the TA how to handle that specifically without getting bogged down. "Metaphysical possibility" is the key phrase.

      *(Self-Correction on the "Cold")*: Make sure the plan emphasizes student writing time. 12 students is small enough for a circle or two groups of 6.

      *(Final check on the "New Case")*: The prompt asks me to tell them *what the carrying example has to have*. I shouldn't just write the case, I should explain the *design constraints* for the case as requested ("tell me what the carrying example has to have... and why"). I will provide a concrete example *and* the design logic.

      *Let's finalize the "Output-Only" verdict.* If the device redirects bodily movement, the agent *tried* to do otherwise but failed. This actually supports Frankfurt if framed right (responsibility for the *try*?), but for first-years, it looks like possession. It's too risky. Stick with Leaky.

      *Let's finalize the "Hanging Objection".* The "Flicker" strategy (they could have chosen to show the sign) is the strongest philosophical objection that doesn't require advanced literature. Let that hang.

      *Okay, ready to write.*
answer: |-
  Here is a 60-minute section plan designed to minimize your vocal load while maximizing student engagement. It addresses your specific pedagogical constraints and the failure modes from last year.

  ### 1. Board Work: The Prerequisites (0–10 mins)
  *Do not start by talking. Write the following on the board while they settle. When you turn around, ask them to copy it silently.*

  **Left Panel: The Target**
  *   **PAP (Principle of Alternative Possibilities):** An agent is morally responsible for an action only if they could have done otherwise.
  *   **Status:** Is this a definition of responsibility, or a *necessary condition*?
      *   *Instruction:* Treat it as a **Necessary Condition**. (If No Alternative → No Responsibility).
  *   **The "Could":**
      1.  **Bare Counterfactual:** "If things had been different, I would have done differently."
      2.  **Robust Ability:** "I had the access/power to make things different *in that moment*."
      *   *Note:* PAP usually demands **Robust Ability**.

  **Right Panel: The Goal**
  *   **Frankfurt's Aim:** To show PAP is **False**.
  *   **The Strategy:** Construct a case where:
      1.  Agent **Cannot** do otherwise.
      2.  Agent **Is** Responsible.
      3.  (Therefore, "Could do otherwise" is not necessary for Responsibility).

  **Why this matters for your cold:** This framing prevents the "Determinism" confusion immediately. You aren't arguing about causal chains yet; you are arguing about the *conditions* for blame. By distinguishing "Bare" vs. "Robust," you set up the "Leaky" variant later without needing to explain it from scratch.

  ### 2. The Carrying Example: Design & Deployment (10–30 mins)
  *Do not use the Jones/Black case from the reading. Use a new one to prevent them from relying on memory of the text. Have a student read the setup aloud to save your voice.*

  **The Case: "The Neural Petition"**
  *   **Agent:** Alex.
  *   **Action:** Signing a petition for a controversial policy.
  *   **Intervener:** A neuro-chip implanted by a controller (Dev).
  *   **Prior Sign:** A specific neural pattern (N-7) that occurs 1 second *before* Alex consciously decides.
      *   *If N-7 appears (indicating Alex will sign):* Dev does nothing.
      *   *If N-7 does not appear (indicating Alex will refuse):* Dev stimulates the brain to force the decision to sign.
  *   **Outcome:** N-7 appears. Alex signs. Dev does nothing.

  **Design Constraints (What you must enforce):**
  1.  **Must Have: A Reliable Prior Sign.**
      *   *Why:* This ensures the intervener *never acts*. If the sign isn't prior, the intervener might be causing the action.
  2.  **Must Have: An Intervener Who Never Fires.**
      *   *Why:* To isolate the *actual sequence* (Alex's thinking) from the *counterfactual sequence* (Dev's intervention).
  3.  **Must Have: A Decision That Is Genuinely the Agent's Own.**
      *   *Why:* Alex must sign for their *own reasons* (e.g., they actually support the policy).
  4.  **Must NOT Have: Threats, Guns, or Coercive Offers.**
      *   *Why:* These are "coercion" cases. In coercion, the agent *is* pushed. In Frankfurt, the agent *walks* but the door is locked. You need them to feel the agent is acting freely, just without the option to exit.
  5.  **Must NOT Have: Physical Restraint.**
      *   *Why:* If Alex's hand is physically forced, they aren't responsible. The constraint must be on the *will/decision*, not the muscle.

  **Activity (15 mins):**
  *   **Task:** In pairs, draw a flowchart of the "Neural Petition."
  *   **Prompt:** "Mark the exact point where the alternative possibility disappears. Mark the exact point where the action originates."
  *   **Discussion:** Ask two pairs to draw their flowcharts on the board. Correct any that show Dev touching the brain in the actual sequence.

  ### 3. The Variants: Which One to Use? (30–40 mins)
  *You asked about the "Leaky Intervener" vs. the "Output-Only" case.*

  **Verdict:** Use the **Leaky Intervener**. Drop the Output-Only case.

  **Why Leaky Works (Pedagogically):**
  *   **Setup:** The chip only works 60% of the time. If Alex had shown the "refuse" sign, there was a 40% chance Alex would have successfully refused.
  *   **Function:** This tests the **Robustness** distinction you put on the board.
  *   **The Lesson:** If students say Alex is *still* responsible, they are admitting that a *mere possibility* (the 40% chance) isn't enough to ground PAP. It forces them to refine PAP: "You need a *guaranteed* alternative, not just a chance." It tightens the definition of "Could."
  *   **Placement:** Introduce this *after* they have accepted the main case. Ask: "Does it matter if the chip is faulty?"

  **Why Output-Only Fails:**
  *   **Setup:** Alex decides to refuse, but the chip moves the hand to sign.
  *   **Problem:** This destroys the intuition of responsibility entirely. If the body moves against the will, Alex is a passenger. Frankfurt cases require the agent to *act*, just without the ability to *do otherwise*. This variant conflates "freedom of action" with "freedom of will" in a way that confuses first-years. It invites the objection "But he didn't *do* it, his hand did," which sidetracks the metaphysics of PAP.

  **Activity (10 mins):**
  *   Pose the Leaky Variant orally.
  *   **Question:** "In the Leaky Case, Alex technically *could* have gotten away with refusing (40% chance). Is he responsible? If yes, why didn't that 40% save PAP?"
  *   **Goal:** Elicit the intuition that *risk* isn't *ability*.

  ### 4. Failure Modes: Order of Operations (40–55 mins)
  *Here is the predicted order of objections and how to manage them without lecturing.*

  1.  **"This is just Determinism." (Will come up first)**
      *   *Management:* Point to the Board (Left Panel). "Determinism says the *past + laws* fix the future. Frankfurt says the *Intervener* fixes the future. In this story, the laws of physics could be indeterministic. The blocker is the chip, not causality."
      *   *Action:* Write "Causal Determinism ≠ Counterfactual Intervener" on the board.

  2.  **"The Device Causes the Action." (Will come up second)**
      *   *Management:* Refer to the flowchart. "Did the chip fire in the actual story?" (No). "Then what caused the signing?" (Alex's reasons).
      *   *Action:* Make them trace the causal line on the board diagram.

  3.  **"The Physics Student Objection: Infallible Signs are Impossible."**
      *   *Management:* Acknowledge and bracket. "You are right about neuroscience. But we are testing *Metaphysical Possibility*. If you can conceive of it without contradiction, the case works for philosophy."
      *   *Action:* Write "Conceivability > Physical Actuality" on the board.

  4.  **"He Could Have Tried/Signaled Otherwise." (The Flicker Strategy)**
      *   *Management:* **Let this hang.** This is the most sophisticated objection. It concedes he couldn't *sign* otherwise, but argues he could have *willed* otherwise.
      *   *Action:* "This is a brilliant objection. It suggests PAP might survive if we change 'could have done otherwise' to 'could have willed otherwise.' We will not solve that today. Keep this in mind."
      *   *Why hang it?* It validates the smart students without derailing the core lesson (that the *standard* PAP is under attack).

  5.  **"You're Just Assuming He's Responsible." (Question Begging)**
      *   *Management:* Admit it. "Frankfurt cases are intuition pumps. If your intuition says 'Not Responsible,' the case fails for you. But ask: *Why*? Is it because of the chip, or because you think PAP is true?"

  ### 5. Boundaries & Closing (55–60 mins)
  *You need to explicitly fence off the literature to keep this to 60 minutes and save your voice.*

  **The "Do Not Enter" List (Write this on the board):**
  1.  **Reasons-Responsiveness:** (We are not asking if the agent *responds to reasons*, only if they had alternatives).
  2.  **Actual Sequence vs. Alternative Sequence:** (We are noting the distinction, not solving the metaphysics of it).
  3.  **The "Flicker" Solution:** (As noted above, this is a solution, not today's problem).

  **How to say no:**
  *   "That is the solution to the problem Frankfurt creates. Today, we are only building the problem. If we solve it now, we ruin the next three weeks."

  **The Exit Question (Diagnostic):**
  *   Do not ask: "Do you agree with Frankfurt?" (This tests persuasion).
  *   **Ask:** "If the Frankfurt case succeeds, which premise of the Consequence Argument (or standard incompatibilist argument) becomes vulnerable, and why?"
  *   **Alternative (Simpler):** "Write down one sentence: Does Frankfurt attack the *definition* of responsibility, or the *conditions* for responsibility? Explain using the 'Necessary Condition' term from the board."
      *   *Correct Answer:* It attacks the *conditions* (specifically, that alternative possibilities are a necessary condition).

  ### Summary Checklist for Your Prep
  *   [ ] **Board:** PAP (Necessary Condition), Robust vs. Bare, Determinism ≠ Intervener.
  *   [ ] **Case:** Neural Petition (Prior sign, no firing, own reasons).
  *   [ ] **Variant:** Leaky Chip (Tests Robustness).
  *   [ ] **Hang:** The Flicker Objection (Could have willed otherwise).
  *   [ ] **Block:** Reasons-Responsiveness and Physics feasibility.
  *   [ ] **Voice:** Student flowcharts, student reading, silent writing time.

  This plan keeps you seated for 40 of the 60 minutes, forces the students to do the conceptual heavy lifting via the board work, and inoculates against the specific failures from last year by front-loading the definition of PAP.
