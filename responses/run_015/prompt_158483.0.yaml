          *   *Risk:* Hedonistic calculus usually weighs pleasure against pain. Dismissing it entirely makes it a strong NU variant.

      *   *Claim 2: Craving as Ontological Clutter.*
          *   This is the novel part. Usually, desire is seen as a *lack* (Platonic/Lacanian). The user flips it: Desire is *presence* (clutter/dust).
          *   *Implication:* Nirvana isn't "nothing"; it's "unobstructed space."
          *   *Metaphor Check:* Does dust take up space? Yes. Does it obscure vision? Yes. Is it active? It settles. "Active clutter" is a bit oxymoronic but poetically strong. Maybe "ontological friction" or "viscosity" works better?

