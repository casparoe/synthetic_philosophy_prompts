      *(Self-Correction on the "Contested Claims" section)*: I need to be precise. The advice turns on the claim that *practical continuity generates responsibility regardless of metaphysical discontinuity*. If one believes metaphysical discontinuity *does* erase responsibility, my advice changes. I need to state that.

