      *   *Check:* Did I address the "three questions" distinction the user mentioned? *Action:* Yes, incorporate that. The friend is trying to decouple "same person" from "answer for it," but she fails on the third ("living off what the borrowing set up"). She *is* living off the stability that loan provided (even if indirectly via the lease history). Actually, the lease deposit secured housing which allowed the transformation. There is a causal link.

