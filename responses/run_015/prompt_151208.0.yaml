answer: |-
  **The Immunisation Protocol**

  1.  **Isolate:** State the claim in one sentence. Remove all qualifiers.
  2.  **Falsifiability:** Ask: What specific discovery would force the author to abandon this? If the answer is 'nothing' or 'that evidence was suppressed', mark **Immunised**.
  3.  **Response to Contrary Data:** When evidence contradicts, is the claim adjusted or protected? Look for shifting dates, sites, or conspiracy allegations. If protected, mark **Immunised**.
  4.  **Universal Application:** Apply Steps 2–3 to *all* claims, including textbook staples. Consensus is not immunity. If a mainstream claim fails, flag it.
  5.  **Verdict:**
      *   **Immunised:** **CUT**. Do not use 'some believe'. It implies validity.
      *   **Contradicted but Valid Perspective:** **ESCALATE**. Hand off to editor. This is a values call, not evidence.
      *   **Falsifiable & Standing:** **KEEP**.
      *   **Cultural Truth:** **REFRAME**. Label explicitly as tradition or belief, not fact.

  **Applications**

  1.  **Aliens/Megaliths:** Fails Step 2. No engineering proof is accepted; impossibility is assumed. **CUT**. It is immunised against evidence.
  2.  **Double-Counting:** Fails Step 3. Contrary records are dismissed as forgeries to protect the theory. **CUT**. Conspiracy shielding makes it indefensible.
  3.  **Oral Tradition:** Passes Step 2 (could be disproven by archaeology). Conflicts with written records. **ESCALATE**. This is not evidence failure, but value conflict. You must decide if community memory outweighs contemporary documents.
  4.  **Textbook Example ('Dark Ages'):** Often presented as total collapse. If evidence of continuity is ignored to maintain the narrative, it fails Step 3. **REFRAME** to reflect nuance.

  **Limitations**

  This tests integrity of method, not factual accuracy. A true claim can look immunised if evidence is genuinely lost. It will flag stubborn mainstream theories (good), but may flag emerging correct revisions (risk). It cannot solve the oral history dilemma; it only identifies it as a value judgment, not an evidence failure. You remain the arbiter of political weight. The procedure stops the nonsense, but you still own the nuance. It requires freelancers to spot 'relocation', which demands intuition you said they lack. Training is required. Finally, it cannot distinguish between a fringe theory waiting for proof and a false one. It forces you to make the value call on oral history; it won't solve the politics of truth for you. It stops the nonsense, but you still own the nuance.
