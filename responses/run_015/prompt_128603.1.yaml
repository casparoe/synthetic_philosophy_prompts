answer: |-
  Here is the single principle that separates your "Yes" cases from your "No" cases, followed by the predictions and the verdict on your edge case.

  ### The Principle: The Substrate Consumption Test

  **Competition is Molochian if the strategy required to win consumes or degrades the shared resource (the substrate) that makes the competition valuable or possible.**

  *   **Healthy Competition:** The "cost" of competing is internal to the competitor (pain, effort, capital), and the "value" of the arena is maintained or enhanced.
  *   **Moloch Competition:** The "cost" of competing is externalized onto the shared system, and the "value" of the arena degrades as competition intensifies.

  **Why it fits your gut reactions:**
  *   **Marathon (No):** The runners consume their own glycogen and muscle fibers (internal cost). The "substrate" (the sport, human potential) is *enhanced* by faster times. If everyone runs faster, the sport is better.
  *   **AI Safety / City Taxes / Fishing (Yes):** The competitors consume **Safety**, **Public Infrastructure**, and **Fish Stocks** (external substrate). These are finite, shared resources. If everyone plays the "winning" move (cut evals, cut taxes, overfish), the substrate collapses. The game becomes unplayable or dangerous for everyone, even the "winners."

  ---

  ### Predictions for Your Uncertain Cases

  **1. University Prestige Competition**
  *   **Verdict:** **Moloch.**
  *   **Analysis:** The "substrate" here is **Accessible High-Quality Education**. When Deans hire more admin and raise tuition to compete on prestige, they are externalizing the cost onto students (debt) and society (inequality).
  *   **The Trap:** If every university does this (which they are), relative prestige remains unchanged (a zero-sum ranking), but the absolute cost of participation skyrockets and the educational value-per-dollar often drops. They are consuming the viability of the higher-ed system to maintain relative rank.

  **2. AI Compute Cluster Race (Nations)**
  *   **Verdict:** **Moloch.**
  *   **Analysis:** You noted "nobody is secretly defecting," but Moloch does not require secrecy; it requires **instability of cooperation**. This is a classic *Security Dilemma* (a subset of Moloch).
  *   **The Trap:** The "substrate" is **Global Stability and Energy Capacity**. Nation A builds a cluster for security. Nation B must match it to avoid vulnerability. If both build, relative security is unchanged (cancel out), but absolute energy consumption and geopolitical tension have spiked. They are burning the global commons to run in place.

  ---

  ### The Edge Case: The Social Platform

  **Scenario:** A platform makes its feed less addictive, loses users to a rival, and reverts to stay alive.
  **Verdict:** **This is Moloch.**

  **Why it feels like "Market Selection":**
  It *is* market selection. That is the mechanism. Moloch is the *name* we give to market selection when the incentives are misaligned with human values.

  **Why it fits the Principle:**
  *   **The Substrate:** **User Attention Span and Mental Health.**
  *   **The Dynamic:** The "ethical" move (less addiction) imposes an internal cost on the platform (lost revenue). The "winning" move (more addiction) externalizes the cost onto the user (polarization, anxiety).
  *   **The Trap:** Because the cost of ethics is internal and the benefit of exploitation is internal (profit), the market selects for the exploiter. The platform *wants* to be healthy, but the structure of the competition forces it to consume its user base's well-being to survive.

  **The Distinction:**
  If the platform lost users because its product was *worse* (e.g., buggy, slow), that is healthy market selection.
  If the platform lost users because its product was *healthier*, that is Moloch. It means the market is rewarding the degradation of the substrate.

  ### Summary Table

  | Case | Competitive Move | Who Bears the Cost? | Effect on Substrate | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Marathon** | Train Harder | The Runner (Internal) | Sport Improves | **Healthy** |
  | **AI Safety** | Cut Evals | Society (External) | Risk Increases | **Moloch** |
  | **City Taxes** | Slash Rates | Citizens (External) | Services Collapse | **Moloch** |
  | **Universities** | Hike Tuition | Students (External) | Access Decreases | **Moloch** |
  | **Compute Race**| Build Bigger | Globe/Energy (External)| Stability Drops | **Moloch** |
  | **Social Feed** | Maximize Addiction| Users (External) | Well-being Drops | **Moloch** |

  **Final Call:** You stop flip-flopping on the Compute case by recognizing that **open rivalry is still a trap** if the equilibrium is negative-sum. You stop flip-flopping on the Platform case by recognizing that **Market Selection is the engine, but Moloch is the destination** when incentives punish virtue.
