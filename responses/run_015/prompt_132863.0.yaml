  7.  **Final Polish (American English):** Ensure spelling (program vs. programme, although 'program' is standard in US for research programs too), tone (academic but accessible), and clarity. (Note: In philosophy of science, "research programme" is often spelled the British way even in US texts due to Lakatos, but I will stick to standard US spelling "program" unless quoting).

