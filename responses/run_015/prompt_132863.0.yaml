prompt: |-
  I've been working through a demarcation argument for a seminar on pseudohistory, and it keeps collapsing into the conclusion that conventional chronology is methodologically indistinguishable from Fomenko's New Chronology. Here is the chain as I have it:

  (1) A research program counts as pseudohistorical if it exhibits evidential asymmetry: it accommodates confirming data uncritically but deploys ad hoc auxiliary hypotheses to dismiss disconfirming data.

  (2) Fomenko's New Chronology exhibits this asymmetry with respect to astronomical records and archaeological strata that conflict with its compressed timeline.

  (3) Mainstream chronology of the Bronze Age collapse and classical antiquity exhibits the same asymmetry: radiocarbon outliers, anomalous stratigraphic layers, and contradictory astronomical observations are routinely classified as contamination, intrusion, or instrument error rather than being treated as potential falsifiers of the textual framework.

  (4) The presence of independent cross-checks—such as dendrochronology or astronomical retrocalculation—does not dissolve the asymmetry, because any cross-check that conflicts with the textual framework is itself subjected to the same dismissive auxiliary hypotheses.

  (5) Therefore, mainstream chronology exhibits the same defining evidential asymmetry as Fomenko's program.

  (6) If two programs share the feature that defines pseudohistory, then either both are pseudohistorical or that feature is insufficient for demarcation.

  (7) It is not acceptable to classify mainstream chronology as pseudohistorical.

  (8) Hence evidential asymmetry cannot be the demarcating criterion, and "pseudohistory" reduces to a sociological label marking lack of institutional acceptance rather than an epistemological failure.

  This seems to prove too much, because I want to preserve (1) as a genuine criterion and (7) as non-negotiable, yet together they seem to force (8). I am particularly unsure whether the flaw lies in (3), (4), or in an implicit slide between (5) and (6). Which step should I reject, and what does that rejection commit me to? Must I concede that Fomenko's method is legitimate, or is there a way to save the distinction without abandoning (1)? Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Goal:** The user is constructing a demarcation argument for a seminar on pseudohistory.
      *   **Issue:** The argument keeps collapsing into the conclusion that mainstream chronology is methodologically indistinguishable from Fomenko's New Chronology (a well-known pseudohistorical theory claiming ancient history is much shorter than accepted).
      *   **Desired Outcome:** The user wants to preserve premise (1) (evidential asymmetry defines pseudohistory) and premise (7) (mainstream chronology is *not* pseudohistory).
      *   **Current Conclusion:** The argument forces (8) (pseudohistory is just a sociological label, not epistemological).
      *   **Specific Question:** Which step should be rejected ((3), (4), or the slide between (5) and (6))? What does that rejection commit them to? Do they have to concede Fomenko is legitimate? How to save the distinction?
      *   **Language:** American English.

  2.  **Evaluate the Argument Structure:**
      *   (1) Definition: Pseudohistory = Evidential Asymmetry (accept confirmations, reject disconfirmations via ad hoc hypotheses).
      *   (2) Application: Fomenko has this asymmetry.
      *   (3) Claim: Mainstream chronology *also* has this asymmetry (regarding radiocarbon, stratigraphy, etc.).
      *   (4) Defense of (3): Cross-checks don't help because they are also dismissed if they conflict.
      *   (5) Inference: Mainstream has the defining feature.
      *   (6) Dilemma: If both have the feature, both are pseudo OR the feature is bad.
      *   (7) Constraint: Mainstream is not pseudo.
      *   (8) Conclusion: Feature is bad (pseudohistory is sociological).

  3.  **Identify the Weak Link:**
      *   Premise (1) is a standard Popperian/Lakatosian intuition, though perhaps too simplistic.
      *   Premise (2) is generally accepted by historians of science.
      *   Premise (7) is the user's non-negotiable constraint (and aligns with academic consensus).
      *   **Premise (3) and (4) are the vulnerable points.** They equate *methodological error correction* with *ad hoc immunization*. This is the classic "Galileo Strategy" or "Underdetermination" trap. All science deals with anomalies. The difference lies in *how* they are dealt with and the *progressive vs. degenerative* nature of the research program (Lakatos).

  4.  **Formulate the Critique:**
      *   **The Core Flaw:** The argument conflates *normal scientific error analysis* with *dogmatic ad hocery*.
      *   **Rejection Target:** Reject (3) and (4).
      *   **Why?** In mainstream chronology, anomalies (like radiocarbon outliers) trigger specific, testable investigations (e.g., "is this sample contaminated?"). If contamination is found, the auxiliary hypothesis is *independently verified*. In Fomenko's case, the auxiliary hypotheses are often untestable or designed solely to protect the core theory without generating new predictions.
      *   **Lakatosian Framework:** Use Imre Lakatos's "Methodology of Scientific Research Programmes" (MSRP). Distinguish between *progressive* and *degenerative* problem shifts.
      *   **Bayesian Perspective:** Mainstream chronology updates probabilities based on evidence; Fomenko's core is unfalsifiable.
      *   **The "Slide" between (5) and (6):** This is also a point of attack. Sharing *a* feature doesn't mean sharing the *defining* feature if the feature is nuanced. But attacking (3) is stronger.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the sophistication:* This is a strong philosophical puzzle. It touches on the Duhem-Quine thesis and the demarcation problem.
      *   *Direct Answer:* Reject (3) and (4).
      *   *Explanation:* The distinction isn't the *presence* of anomalies or auxiliary hypotheses, but the *status* and *testability* of those hypotheses.
      *   *Key Concept 1: Independent Testability.* When mainstream historians reject a C14 date as "contaminated," they can often test for contamination chemically. When Fomenko rejects an astronomical record, he often claims it was fabricated or miscalculated without independent evidence of the fabrication.
      *   *Key Concept 2: Progressive vs. Degenerative (Lakatos).* Mainstream chronology predicts new findings (e.g., where to dig, what isotopes to expect). Fomenko's theory mostly explains away old data without predicting new, risky facts.
      *   *Key Concept 3: Consilience.* Mainstream chronology relies on the convergence of independent lines of evidence (texts, dirt, carbon, tree rings). Fomenko requires a conspiracy or massive error across all these independent fields simultaneously.
      *   *Addressing the "Sociological" Fear:* Rejecting (3) saves the epistemological distinction. It's not about institutional acceptance; it's about methodological rigor.
      *   *Commitment:* Rejecting (3) commits the user to defending the specific methods of error correction in mainstream history/archaeology. They must show these methods are self-correcting, not dogmatic.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't say mainstream chronology is perfect. It *does* have anomalies. The point is how they are resolved.
      *   *Terminology:* Use "ad hoc" correctly. An ad hoc hypothesis is one added *only* to save the theory, with no independent testability. Mainstream auxiliary hypotheses (like "reservoir effect" in carbon dating) are independently testable.
      *   *Structure:*
          1.  Validate the user's logical rigor.
          2.  Identify the break point (Premise 3).
          3.  Explain *why* (3) is false (Independent Testability & Consilience).
