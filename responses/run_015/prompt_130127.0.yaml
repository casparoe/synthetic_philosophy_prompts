answer: |-
  **TO:** Exhibits and Public Programming Committee
  **FROM:** [Your Name], Science Advisor
  **DATE:** March 5
  **SUBJECT:** Recommendation on Kepler Interactive Proposal

  **Recommendation:** We should build the interactive, but only under the strict condition that it generates charts for historical figures (Kepler, his patrons, famous contemporaries) rather than living visitors. We must pair the astrological output with the corresponding orbital data for Mars to demonstrate where the geometry succeeded and where it failed.

  **Reasoning:**
  This recommendation rests on a specific reading of Kepler's intent. We must commit to option (b): *Same machinery, wrong domain.* Kepler was not merely using astrology as income while doing real science elsewhere (a), nor was he necessarily hypocritical (c). He was pursuing a unified research program using rigorous geometry and prediction checks, applied to a subject where those tools could not yield truth. If we treat his astrology as mere leftover superstition (a), the exhibit becomes trivia. If we treat it as hypocrisy (c), it becomes character assassination. Only by treating it as a failed research program pursued in good faith (b) does this become History of Science rather than an occult parlor trick in a lab coat. We show the machinery working on Mars to prove the method was sound, and failing on temperament to prove the domain was wrong.

  However, I believe the real crux of this argument is not what Kepler thought, but what *we* are doing when we simulate debunked processes. The issue is simulation versus participation. When the museum runs a calculation for a living visitor, we cease to be historians and become participants in the ritual.

  The education staff is correct that abstract disclaimers teach nothing. To understand why science changed, a visitor must feel the gravitational pull of the old idea. Kepler's astrology was not modern sun-sign horoscopes; it was based on harmonic geometry and the idea that the soul responds to shapes. Showing this distinction is instructive precisely because it looks so much like science. If we sanitize it too much, we lose the lesson of how intelligent people can be wrong.

  However, the advisory board's astronomer is right about the Barnum effect. People read generic personality descriptions as uncannily accurate when they believe the data is about them. A disclaimer panel at the exit cannot undo the personal validation felt at the machine. If we print a temperament card for a living visitor, we are using real orbital mechanics to manufacture an astrological claim about them, with the museum's name on the paper. That crosses an ethical line regardless of the historical context.

  **The Rule:**
  To resolve this, I propose a policy for this and future proposals (alchemy, phrenology, Platonic solids): *The museum may simulate debunked scientific processes, but never generate personal outputs for living visitors.*

  We can keep the machinery on display. We can let visitors input dates to see the geometry move. But the printed output must belong to the dead. We can print Kepler's chart. We can print the chart of a patron he actually served. This preserves the education staff's goal—visitors see the machinery work and the specific geometry involved—without triggering the astronomer's concern about personal validation.

  **The Cost:**
  This rule costs us engagement. Personalization is a powerful hook. Visitors care more about themselves than Kepler. By removing the "you" from the output, we lose the immediate emotional connection that draws people to the station. We risk making the exhibit feel like a textbook rather than an experience. However, the cost of compromising our authority on scientific validity is higher. We cannot be in the business of handing out pseudo-scientific personality assessments, even as irony.

  **Conclusion:**
  If we cannot agree on the "dead people only" condition, we must kill the interactive. It is better to have a static display than one that undermines our mission. But if we adopt this rule, we honor Kepler's actual work (b), respect the education staff's need for tangible examples, and uphold the astronomer's ethical boundary.

  Please consider this framework for our vote on March 12.
