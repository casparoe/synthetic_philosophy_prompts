answer: |-
  The room smelled of ozone and steeped chamomile. Elara sat in the circle, her hands resting on the armrests of her chair, palms open to the sensors. She didn't need to close her eyes to feel the others. That was the point of the Weave.

  When she reached for the memory of her tenth birthday—the blue cake, the silence of the house—she didn't find it in isolation. She found Marcus's sense of safety wrapping around the candle flame. She felt Sia's melancholy tinting the color of the wrapping paper. Her past was no longer a solitary room; it was a gallery where the other patients acted as curators, lighting, and structural support.

  Before the program, Elara had been a singular point. A "center of narrative gravity," the intake forms had called it, quoting philosophers she hadn't read. She had been the sole author of her life, the only one holding the pen. Now, the pen was heavy, and six other hands were resting on it.

  "Let's pull the thread from last Tuesday," said Dr. Aris, sitting slightly apart, his tablet dark on his lap. "The incident at the transit station."

  Elara's throat tightened. In the Weave, tightness was never private. She felt Marcus's pulse slow in an attempt to regulate her own. She felt Sia's curiosity spike, a sharp electric itch at the base of her skull.

  "I know what I did," Elara said. Her voice sounded thin in the acoustic dampening of the room. "I pushed him. I remember the intent. It was mine."

  "We remember the impact," Marcus corrected gently. He was a large man, a former structural engineer whose dissociation had stemmed from a collapse he'd survived. In the Weave, he was the load-bearing wall. "I felt the shove, Elara. Not physically, but causally. The anger that drove your arm? It tasted like my grief. I was holding that for you before you even swung."

  "That doesn't make it your anger," Elara snapped. "It happened in my body. My narrative."

  "Does it?" Sia leaned forward. She was younger, her fragmentation caused by a trauma so severe her mind had shattered into time-stamped shards. "In the Weave, causality is fluid. If I provide the emotional context that makes your memory coherent, am I not a co-author? If I hold the regret so you don't dissolve, do I not share the blame?"

  This was the friction that had defined their sessions for months. The Weave distributed episodic memory to prevent dissociation, but in doing so, it distributed the *self*. If Elara's autobiography was sustained by the group's emotional labor, was Elara still the one who wrote it?

  "I pushed him," Elara insisted. "He was blocking the door. I was late. I chose violence."

  "You chose survival," Marcus said. "And we are holding the cost of that choice so you can remain integrated. If we drop the memory, you fragment. If we keep it, we all carry the weight of the shove."

  "Then let me carry it," Elara said. "That's the point of responsibility, isn't it? To bear the weight of your own actions."

  "But you can't bear it alone," Sia said. "Your psyche rejected it. That's why you're here. You dissociated immediately after. You forgot the shove even happened. We remembered it for you. We stitched it back into your timeline."

  Sia tapped her temple. "I have a proposal. A revision."

  The air in the room grew heavy. The ethics committee had debated this for years: the right to edit the shared past. If the memory was distributed, did the collective have the right to sanitize it for the health of the whole?

  "The memory is too sharp," Sia continued. "Every time we access the transit station node, Elara's vitals spike. It threatens her stability. I suggest we smooth the edge. We keep the fact of the push, but we remove the malice. We reframe it as an accident."

  "No," Elara said. The word was a reflex, but it rippled through the Weave, causing a collective flinch.

  "It's for your own good," Sia argued. "If we revise the intent, the guilt dissipates. The narrative holds, but the pain is less."

  "If you change the intent, you change *me*," Elara said. She looked at Marcus, then at Sia. "If you decide I didn't mean to hurt him, then who am I? I'm not the person who pushed him anymore. I'm a character you're writing to make yourselves comfortable."

  "We are the narrative gravity now," Marcus said, his voice low. "The center has shifted. It's not just you, Elara. It's us. If the collective decides the story is too damaging to sustain, do we not have the authority to edit the text?"

  Elara stood up. The sensors hummed, protesting the break in proximity. "You're talking about censorship. You're talking about stealing my sin."

  "Sharing your sin," Marcus corrected. "And if we share it, we decide how it's told."

  "If you edit it, I'm not responsible," Elara said, her voice trembling. "And if I'm not responsible, then I'm not real. I'm just... a vessel. A place where your memories happen to land."

  She looked around the circle. She saw the exhaustion in Marcus's eyes; he was tired of holding her rage. She saw the desperation in Sia's; she was terrified of Elara's pain bleeding into her own sleep. They wanted to fix the story to save the patient. But Elara realized that the patient *was* the story. Even the ugly parts. Especially the ugly parts.

  "I don't care if you feel my regret," Elara said. "I don't care if you hold the memory so I don't break. But you don't get to change the ink."

  "And if we do?" Sia challenged. "What will you do? Leave the Weave? Go back to being fragmented? Go back to forgetting who you are?"

  The threat hung in the air. Without the Weave, Elara would shatter. She would lose the continuity of her days. She would be a collection of moments without a line connecting them. The group held her coherence hostage.

  "If you change it," Elara said, sitting back down, forcing her palms flat against the sensors, "then I accept the revision. But I will know it's a lie. And I will live in the gap between what happened and what you say happened. That gap will be mine. You can't share that."

  Silence stretched. The hum of the architecture seemed to deepen, processing the conflict.

  Dr. Aris finally spoke. "The architecture allows for multiple interpretations of the same node. Polyphonic memory."

  Elara looked at him. "So?"

  "So," Aris said, "we do not overwrite. We annotate. The push remains violent. The intent remains malicious. That is Elara's authorship. But the aftermath—the regret, the processing, the integration—that is the group's authorship."

  Marcus exhaled, a long, slow sound. "I can live with that. I hold the regret. She holds the act."

  "And I," Sia said, looking down at her hands, "I won't smooth the edge. I'll just... hold the knife."

  Elara closed her eyes. She reached back into the Weave, toward the transit station. She felt the shove again. The anger was hers, sharp and hot, a singular spike in the data. But wrapping around it was Marcus's sorrow and Sia's fear. They were not absolving her. They were witnessing her.

  She realized then that the "center of narrative gravity" hadn't disappeared; it had simply become a gravitational field. It pulled on them, and they pulled on it. She was still the one who pushed, but she was no longer the only one who had to live with the pusher.

  "Thank you," Elara whispered. She wasn't sure if she was thanking them for keeping her guilt, or for letting it remain hers.

  "Session adjourned," Aris said softly.

  The hum faded. The sensors cooled. Elara opened her eyes. She was still sitting in the chair, but she felt heavier, anchored by the six other consciousnesses that had just agreed to let her be flawed. She stood up, her legs her own, her history a shared burden, her future a negotiation. She walked to the door, and for the first time in months, she didn't check to see if the others were following. She knew they were. They were in the step she took, and in the guilt she carried.
