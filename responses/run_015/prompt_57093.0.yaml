      *   *Check:* Did I address the linguistic relativity (blue discrimination)? Yes, mention it as a flashpoint for the definition of "cognitive."
      *   *Check:* Is the distinction between (a) and (b) clear? (a) is metaphysical/definitional, (b) is experimental/operational. They feed each other.
      *   *Check:* On the "Ideal Experiment," ensure I explain *why* the boundary moves (theoretical immunity of modularity).
