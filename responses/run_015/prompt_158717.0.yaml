answer: |-
  ### Desiderata for an Account of Individual Reasons in Collective Harm

  **I. Functional Purpose**
  1.  **Action-Guidance:** The account must yield a determinate verdict on what a single agent has most reason to do in real-time (the "Ordinary Tuesday" constraint), independent of what others do.
  2.  **Assessment-Separation:** The account must provide a separate verdict on the aptness of blame or criticism for failure to comply. It must not treat "objectively wrong" and "blameworthy" as synonymous.

  **II. Case Adequacy**
  3.  **Tiny-Contribution:** Must explain the existence of a reason/duty where individual causal impact is imperceptible (e.g., carbon emissions, water drops).
  4.  **Lumpy-Threshold:** Must handle cases where harm is discrete and probabilistic, where an act *might* trigger a threshold but the agent lacks knowledge of their position in the queue (e.g., batched meat purchases).
  5.  **Constitutive:** Must account for reasons grounded in participation or expression rather than causal efficacy (e.g., voting margins, offensive speech in a chorus).
  6.  **Repeat-Player:** Must address the diachronic dimension: why an act permissible once may become impermissible when aggregated over a lifetime of identical choices.
  7.  **Non-Identity/Existence:** Must resolve the tension where the harmful practice is a necessary condition for the victim's existence, without dissolving the duty to avoid the harm.

  **III. Conceptual Distinctions**
  8.  **Difference vs. Participation:** Must distinguish between *making a difference* to the outcome and *being one of those who make it*.
  9.  **Expected vs. Actual:** Must distinguish between the ex-ante rationality of the act (expected efficacy) and the ex-post fact of its impact (actual efficacy).
  10. **Wrongdoing vs. Blame:** Must distinguish between the normative status of the act and the reactive attitudes owed to the agent.
  11. **I vs. We:** Must distinguish between *what I should do* given others' actions and *what we should do* ideally.
  12. **Contribution vs. Compensation:** Must distinguish between reasons not to contribute to the harm and reasons to remedy the harm after the fact.

  ***

  ### Status Classification

  *   **Genuine Requirements:** Action-Guidance, Assessment-Separation, Case Adequacy (all 5), Distinctions (Expected/Actual, Wrongdoing/Blame, I/We, Contribution/Compensation). These are necessary for a theory that respects agency and moral phenomenology.
  *   **Prejudice of One Camp:** The requirement that **Difference vs. Participation** must collapse into **Actual Difference-Making**. The assumption that "no causal difference implies no duty" is a consequentialist stipulation, not a neutral desideratum. Similarly, treating **Wrongdoing** and **Blame** as identical is a prejudice of strict objectivist views that ignores epistemic constraints.

  ***

  ### Incompatibilities and Elimination

  **Incompatibility:** You cannot satisfy **Tiny-Contribution** (Duty exists) and **Actual Difference-Making** (Duty requires causal impact) simultaneously. One must be rejected.

  **Single Requirement Eliminator:** The **Action-Guidance in Tiny-Contribution Cases** requirement eliminates standard Act Consequentialism and Causal theories, as they cannot generate individual reasons without individual difference-making.

  **Scorecard:**
  *Incompatible Set:* {Tiny-Contribution Duty, Actual Difference-Making}.
  *Top Eliminator:* Action-Guidance in Tiny-Contribution Cases (kills Causal/Act-Consequentialist views).
