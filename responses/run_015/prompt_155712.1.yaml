      *(Self-Correction during drafting)*: Make sure I don't just say "Gellner said X." I need to evaluate the *thesis* itself as requested (Trivial/Defensible/False).
      *   *Normative Claim:* Is it false? It's a category error. Calling it "Muddled" is accurate.
      *   *Ontological Claim:* Is it trivial? If "nation" is defined as "sovereign people," then yes, pre-modern ones didn't exist. But that's semantic. I'll label it "Defensible (Semantic)."
      *   *Archival Threshold:* This is the crux. If I admit oral traditions sustain identity, does "Nationalism invented the nation" fail? Yes, it becomes "Nationalism invented the *State* for the Nation." That weakens the anti-primordialist punch. I need to highlight this tension.

  8.  **Final Review against Constraints:**
