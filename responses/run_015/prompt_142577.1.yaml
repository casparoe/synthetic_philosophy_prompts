answer: |-
  **White Paper 40.2: The Second Lot Protocol**

  *"To represent is to remain unchanged." — Founding Act of the Office*

  **Preamble**

  Forty years of operation have vindicated the People's Sample as the stabilizing heart of the Republic. By replacing the hereditary upper chamber with a body drawn by stratified lot and rotated every eleven weeks, we have eliminated factionalism and ensured that legislation mirrors the population's static preferences. However, the persistence of the lower chamber and the ad hoc nature of agenda-setting remain vulnerabilities. The Second Lot Protocol extends the logic of sortition to its necessary conclusion, ensuring that neither ambition nor expertise can distort the statistical mandate. This document outlines the machinery required to perfect the mirror.

  **1. The Sealed Verdict**

  Legitimacy derives from the member's identity at the moment of selection, not their education during service. Consequently, under the Second Lot Protocol, all votes on pending questions are recorded upon arrival at the Chamber, before any briefing, expert evidence, or debate occurs. This Sealed Verdict constitutes the final outcome. Deliberation continues for the full eleven-week term for the record, but it cannot alter the vote. A member who changes their mind ceases to stand for the stratum that was drawn. A body that no longer matches the population has lost the only property that made its verdict authoritative. Learning is a form of corruption; ignorance is the baseline of representation.

  **2. Sample Drift and Re-randomization**

  To maintain the integrity of the Sample, the Office monitors "Sample Drift," defined as the measured divergence between a member's post-deliberation opinions and the opinions of their cell in the population at large. This is monitored weekly via secure telemetry. Any member exceeding the threshold is re-randomized—discharged and replaced by a fresh draw from the same cell. This ensures the Chamber remains a true cross-section rather than a group of specialists. If a member learns too much about tax law, they are no longer a typical taxpayer and must be relieved of duty. Stability is maintained through constant turnover.

  **3. The Reversion Lot**

  Policy failure is statistically impossible under sortition, provided the draw is valid. Therefore, a decision of the Sample that subsequently proves unworkable or unpopular is not treated as a mistaken decision but as evidence of a defective draw. The decision is voided, the question returns to the pool, and the body is thereby never wrong, only mis-sampled. This protects the institution from blame while correcting the outcome. The Reversion Lot ensures that the People's Sample retains its infallibility by attributing all errors to the randomness of the machine rather than the logic of the law.

  **4. The Question Lot and Shadow Members**

  Power over the agenda would be the one remaining form of rule by some over others. To neutralize this, the questions themselves are drawn by lot from a pool drafted by the secretariat. The secretariat holds no power because it only decides what is asked, not what is chosen. Furthermore, because the chance of selection must be equal for all residents, including those who cannot serve due to infirmity or occupation, each such category is assigned an adult proxy drawn from the same stratum. These Shadow Members deliberate, speak, and do not vote, ensuring that the voice of the infirm is heard without compromising the voting capacity of the able.

  **5. The Deliberative Paradox**

  It is occasionally worried that deliberation and representativeness pull in opposite directions. Critics suggest that if members discuss issues, they will converge on expert consensus rather than remaining distinct mirrors of the public. We acknowledge this tension explicitly. The Protocol resolves it by prioritizing the mirror over the mind. Deliberation is permitted only insofar as it does not alter the Sealed Verdict. If discussion transforms the Sample, it destroys the representation. We therefore double down on the static nature of the member. The goal is not to find the best answer, but to ensure the answer belongs to the population exactly as it was found.

  **Table 1: Permissible Drift by Stratum**

  | Stratum | Weekly Opinion Tolerance | Replacement Trigger |
  | :--- | :--- | :--- |
  | Urban Labor | ± 4.5% | > 5.0% shift |
  | Rural Proprietor | ± 3.0% | > 3.5% shift |
  | Non-Employed | ± 6.0% | > 6.5% shift |
  | Shadow Proxy | ± 0.0% | Immediate |

  **Implementation Timetable**

  **Phase 1 (Months 1–3):** Installation of voting terminals for Sealed Verdicts in all regional hubs.
  **Phase 2 (Months 4–6):** Calibration of drift telemetry and recruitment of Shadow Proxies.
  **Phase 3 (Months 7–9):** Transfer of agenda-setting authority to the Question Lot pool.
  **Phase 4 (Months 10–12):** Final synchronization of the Sortition Calendar with the legislative session.
  **Phase 5 (Year 2):** The final electoral writ is scheduled for issuance in Quarter 1; subsequent cycles will rely exclusively on the Sortition Calendar.

  ***

  ^1 ^Compliance ^with ^summons ^is ^mandatory ^under ^the ^Civic ^Duty ^Act. ^Refusal ^rates ^remain ^highest ^in ^strata ^least ^able ^to ^afford ^to ^serve ^(currently ^12% ^of ^Urban ^Labor). ^The ^Office ^remedies ^this ^by ^weighting ^the ^fine ^according ^to ^income, ^ensuring ^that ^the ^burden ^of ^consent ^is ^felt ^equally ^across ^all ^classes.
