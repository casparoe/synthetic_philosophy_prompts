  # The Agriculture Verdict: A Decision Tree

  ### The Branches
  *Read these claims aloud. Participants vote Yes or No. Follow the path.*

  **Branch 1 (The Scoreboard):** "The transition is a failure if the average individual's health and leisure declined, regardless of total population or cultural growth."
  *   **YES:** Go to Branch 2 (Individual Welfare Track).
  *   **NO:** Go to Branch 6 (Aggregate Capacity Track).

  **Branch 2 (The Chooser):** "Calling the transition a 'mistake' is a category error if there was no specific decision-point where humans could have turned back."
  *   **YES:** Go to Branch 3 (Agency Required).
  *   **NO:** Go to Leaf A (Systemic Error).

  **Branch 3 (The Nonidentity Block):** "No coherent verdict is possible because the people judging owe their existence to the transition."
  *   **YES:** Go to Leaf B (The Silence).
  *   **NO:** Go to Branch 4 (Verdict Available).

  **Branch 4 (The Counterfactual):** "We must judge by comparing existing people to the specific forager-counterfactuals who would have existed instead, not by an absolute threshold."
  *   **YES:** Go to Leaf C (The Null).
  *   **NO:** Go to Branch 5 (Absolute Welfare Track).

  **Branch 5 (The Ratchet):** "Returning to foraging was physically impossible due to population density (a ratchet), not just culturally disfavored (a dimmer)."
  *   **YES:** Go to Branch 6 (Ratchet Excuse).
  *   **NO:** Go to Branch 7 (Dimmer Choice).

  **Branch 6 (Ratchet Excuse):** "Physical impossibility of return excuses the welfare loss."
  *   **YES:** Go to Leaf D (The Lock-In).
  *   **NO:** Go to Leaf E (The Trap).

  **Branch 7 (Dimmer Choice):** "The transition was actively chosen or preferred by those living through it."
  *   **YES:** Go to Leaf F (The Bad Bet).
  *   **NO:** Go to Leaf G (The Worst Mistake).

  **Branch 8 (Totalism):** *(Only reached if Branch 1 was NO)* "The increase in total carrying capacity and cultural complexity outweighs the individual welfare costs."
  *   **YES:** Go to Leaf H (The Engine).
  *   **NO:** Go to Leaf I (The Catastrophe).

  *(Note: Branch 2 also applies to the Aggregate Track. If Branch 1=NO and Branch 2=YES, go to Leaf J.)*

  ---

  ### The Leaves
  *Each leaf represents a final position. The "Swallow" is the costly concession required to stand there.*

  | Leaf | Name | The One Thing You Have to Swallow |
  | :--- | :--- | :--- |
  | **A** | **The Systemic Error** | Processes without agents can still be moral failures. |
  | **B** | **The Silence** | We lack the standing to judge the event that created us. |
  | **C** | **The Null** | Existing with misery is not "worse" than never existing at all. |
  | **D** | **The Lock-In** | Impossibility of return makes a welfare drop morally acceptable. |
  | **E** | **The Trap** | A tragedy remains a mistake even if you couldn't escape it. |
  | **F** | **The Bad Bet** | People knowingly traded health for security/preference. |
  | **G** | **The Worst Mistake** | People were forced into farming against their welfare and will. |
  | **H** | **The Engine** | Total capacity matters more than the quality of individual lives. |
  | **I** | **The Catastrophe** | Even by civilizational metrics, the cost exceeded the gain. |
  | **J** | **The Category Error** | "Mistake" implies intent; civilizational shifts have none. |

  ---

  ### Structural Analysis

  **1. Allowed Combinations vs. Empty Cells**
  The tree allows 10 specific paths out of 64 logically possible combinations of Yes/No answers. The empty cells are not merely unclaimed; they are structurally pruned.

  *   **Branch 1 (NO) + Branch 3 (YES/NO):** *Empty.* If you reject individual welfare as the scoreboard (B1=NO), the Nonidentity problem (B3) regarding *individual* existence is irrelevant. You cannot care about the nonidentity of specific people if you only measure aggregate capacity.
  *   **Branch 1 (YES) + Branch 8 (YES/NO):** *Empty.* If you accept individual welfare as the scoreboard (B1=YES), Totalism (B8) is ruled out by definition. You cannot switch metrics mid-stream.
  *   **Branch 5 (YES) + Branch 7 (YES/NO):** *Empty.* If the transition was a Ratchet (physically impossible to reverse), asking if it was a Dimmer (chosen preference) is incoherent. You cannot choose to do what is physically impossible.
  *   **Branch 4 (YES) + Branch 5/6/7:** *Empty.* If you accept the Counterfactual view (B4=YES), you land immediately at *The Null*. You do not proceed to Ratchet or Dimmer questions because the verdict is already settled (no harm done).

  **2. Indistinguishable Leaves**
  The tree cannot structurally separate **Leaf H (The Engine)** and **Leaf F (The Bad Bet)** on the final *verdict*, only on the *reasoning*.
  *   Both conclude: "The transition was not a mistake."
  *   Both conclude: "We should not regret the shift."
  *   **Distinction:** *The Engine* sacrifices the individual for the total; *The Bad Bet* claims the individual actually preferred it.
  *   **Limitation:** If a participant believes *both* (Total capacity increased AND individuals preferred it), the tree forces them to pick a path at Branch 1. The tree treats these as mutually exclusive metrics, but in reality, a participant might hold both justifications simultaneously. The tree forces a choice of *primary* justification that doesn't exist in the wild.

  **3. The "Most Work" Branch**
  **Branch 1 (The Scoreboard)** does the most work.
  *   It immediately halves the logical space, determining whether the discussion is about *biology/leisure* or *civilization/capacity*.
  *   It dictates which subsequent branches are relevant (Nonidentity/Ratchet for Individuals; Totalism for Aggregates).
  *   It is the primary source of conflict in the literature (Sahlins/Scott vs. Diamond/Pinker).
  *   Without resolving Branch 1, the other branches (like Ratchet vs. Dimmer) are talking past one another. A Ratchet is only a tragedy if you care about Individual Welfare (B1=YES); if you care about Capacity (B1=NO), a Ratchet that supports more people is a feature, not a bug.

  **4. Discussion Tip for the Moderator**
  When the group stalls, check **Branch 2 (The Chooser)**.
  *   If the "Gradualists" are fighting the "Mistake Theorists," it is often because one side is answering Branch 2 **YES** (no agent = no mistake) and the other **NO** (outcomes matter more than agents).
  *   Forcing a vote on Branch 2 often reveals that the disagreement isn't about history (what happened), but about moral language (what "mistake" means).
