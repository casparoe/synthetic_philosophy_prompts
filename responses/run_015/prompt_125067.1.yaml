answer: |-
  ### The Death Determination Algorithm (DDA-v1)

  **Purpose:** To force explicit consistency between the stated definition of death and the clinical verdict, minimizing ad-hoc ethical accretion.
  **Users:** Rotating Panel (Intensivist, Neurologist, Lay Member).
  **Time Limit:** 60 Minutes.
  **Outputs:**
  1.  **DECLARE:** Death may be declared.
  2.  **WITHHOLD:** Death may not be declared.
  3.  **DECLARE/NO-DONATE:** Death may be declared, but donation protocols are suspended.
  4.  **ESCALATE:** Procedure cannot resolve; refer to Ethics/Legal.

  ---

  #### Step 1: The Account Declaration
  **Action:** The Panel must verbally state and record *which* definition of death is being applied to this specific case. You may not mix accounts.
  **Options:**
  *   **A. Circulatory-Respiratory:** Irreversible cessation of circulatory and respiratory functions.
  *   **B. Whole-Brain:** Irreversible cessation of all functions of the entire brain, including brainstem.
  *   **C. Organismal Integration:** Irreversible loss of the organism's capacity to function as an integrated whole (homeostasis, thermoregulation, hormonal balance).

  *   **Sufficient Answer:** "We are applying Account [X] because [Statute/Protocol/Case Type] mandates it."
  *   **No Answer:** "We are using the standard protocol." (The protocol *is* the accretion problem).
  *   **Judgment Call Warning:** Choosing Account C over B is a philosophical choice, not a medical one. If you choose C, you accept that technology which restores integration may restore "life."

  #### Step 2: The Irreversibility Test
  **Action:** Determine if the loss of function identified in Step 1 is irreversible *in this specific context*, accounting for available technology.
  **Question:** "Does the available technology (e.g., somatic support, NRP, ECMO) render the loss of function reversible or merely bypassed?"

  *   **Sufficient Answer:** "The technology bypasses the function but does not restore the organ's capacity." OR "The technology restores the capacity, making the loss reversible."
  *   **No Answer:** "The technology is experimental." (Irrelevance to biological status).
  *   **Stop Point (Firm No):** If the technology restores the specific function required by the Account in Step 1, you must stop here. **Output: WITHHOLD.**
  *   **Judgment Call Warning:** Distinguishing between "supporting" an organism and "replacing" an organism is a metaphysical boundary, not a physiological one. The Panel must vote on this.

  #### Step 3: The Statutory & Religious Override
  **Action:** Check jurisdiction statutes and family religious accommodations.
  **Question:** "Does the law or a valid religious accommodation require us to delay or alter the declaration despite the biological verdict?"

  *   **Sufficient Answer:** "Statute requires accommodation; declaration is delayed by [X] hours."
  *   **No Answer:** "The family is uncomfortable." (Discomfort is not an objection).
  *   **Stop Point (Hand-off to Values):** If the biological verdict is **DECLARE** but religious accommodation applies, the decision is no longer medical. **Output: ESCALATE** (to Legal/Chaplaincy for timeline).
  *   **Stop Point (Firm No):** If the statute prohibits declaration under these specific technological conditions (e.g., somatic support), **Output: WITHHOLD.**

  #### Step 4: The Donation Integrity Check
  **Action:** If **DECLARE**, assess if donation procedures contradict the death declaration.
  **Question:** "Do the maneuvers required for donation (e.g., aortic occlusion, reperfusion) imply that the patient is not dead under the Account selected in Step 1?"

  *   **Sufficient Answer:** "The maneuver protects organs but does not restore the function lost in Step 1."
  *   **No Answer:** "The surgical team needs it."
  *   **Stop Point (Value Hand-off):** If the maneuver suggests the *potential* for recovery of the function lost in Step 1 (e.g., preventing brain reperfusion implies the brain *could* function if reperfused), this challenges the "Irreversible" claim. **Output: DECLARE/NO-DONATE.**
  *   **Final Output:** If no stops triggered, **Output: DECLARE.**

  ---

  ### Case Runs

  #### Case 1: DCDD with Normothermic Regional Perfusion (NRP)
  *   **Step 1 (Account):** **A. Circulatory-Respiratory.** (Standard for DCDD).
  *   **Step 2 (Irreversibility):** Circulation has ceased. NRP restores circulation *regionally*, but the aortic occlusion balloon prevents cerebral reperfusion.
      *   *Panel Question:* Does occluding the aorta admit the brain could recover?
      *   *Panel Answer:* No. It admits the *circulation* could recover if not occluded. The cessation of *whole body* circulation remains irreversible.
  *   **Step 3 (Override):** No religious objection noted.
  *   **Step 4 (Donation Integrity):** Does NRP contradict death?
      *   *Analysis:* NRP restores abdominal circulation. Under Account A, death is cessation of *circulatory and respiratory* function. If circulation is restored to the abdomen, is the patient dead?
      *   *Crucial Distinction:* The law defines death as irreversible cessation. The balloon makes the cessation of *cerebral* circulation irreversible. The restoration of *abdominal* circulation occurs *after* death is declared.
      *   *Verdict:* The maneuver does not reverse the *determination* of death, it intervenes *post-mortem*.
  *   **Output:** **DECLARE.** (Donation may proceed).
  *   **Comment:** This passes because the Account (Circulatory) does not require brain death, only irreversible circulatory arrest. The balloon ensures the arrest remains irreversible.

  #### Case 2: Pregnant Patient (19 Weeks) on Extracorporeal Somatic Support
  *   **Step 1 (Account):** **C. Organismal Integration.** (You stated this is the account you "officially endorse," even if statute says Whole-Brain. To test consistency, we must use your endorsed account).
  *   **Step 2 (Irreversibility):** Brain is destroyed. However, the somatic platform maintains thermoregulation, hemodynamics, wound healing, and hormonal gestation.
      *   *Panel Question:* Does the platform restore the "organism's capacity to function as an integrated whole"?
      *   *Panel Answer:* **Yes.** The body is homeostatic. It is growing a fetus. It is healing wounds. The integration is present.
      *   *Judgment Call:* Is it the *organism* integrating, or the *machine*? If you say "Machine," you are smuggling in a "Brain-Mediated" requirement not in Account C. If you say "Organism," the function is present.
      *   *Consistency Check:* You noted earlier that keeping a brain-dead patient on ventilator/hormones looks like treating a corpse. This machine does that *better*. If ventilator support doesn't count as integration, why does closed-loop hormonal control?
      *   *Verdict:* Under a strict reading of Account C, the loss of integration is **not** irreversible. The machine reverses it.
  *   **Step 3 (Override):** Family wants support continued.
  *   **Step 4 (Donation Integrity):** N/A (Death not declared).
  *   **Output:** **WITHHOLD.** (Death may not be declared).
  *   **Comment:** This is the uncomfortable result. By adhering strictly to "Organismal Integration," the technology falsifies death. The patient is biologically "alive" by your own definition, despite having no brain. This blocks DNC and forces the hospital to maintain a "living" body indefinitely.

  #### Case 3: Catastrophic Cortical Destruction, Preserved Brainstem
  *   **Step 1 (Account):** **B. Whole-Brain.** (Statutory standard for neurological death).
  *   **Step 2 (Irreversibility):** Cortex destroyed. Brainstem intact (spontaneous respiration, sleep-wake).
      *   *Panel Question:* Are *all* functions of the *entire* brain ceased?
      *   *Panel Answer:* **No.** Brainstem functions persist.
  *   **Step 3 (Override):** Family requests donation and questions the inconsistency with the "next bed" (who is brain dead).
      *   *Analysis:* The family is arguing for a **Higher-Brain (Personhood)** account. You are running a **Whole-Brain** procedure.
      *   *Verdict:* The procedure does not recognize Personhood.
  *   **Step 4 (Donation Integrity):** N/A (Death not declared).
  *   **Output:** **WITHHOLD.** (Death may not be declared).
  *   **Comment:** This highlights the legal/ethical gap. The patient is not dead by statute, despite lacking consciousness. Donation cannot proceed as a deceased donor.

  ---

  ### The Uncomfortable Truth

  **Case 2 is the one you will not like.**

  **Why:** It exposes that your "Organismal Integration" definition is obsolete in the face of somatic support technology.
  If you run the procedure honestly on Case 2, you must conclude the patient is **Not Dead**.
  *   **The Cost:** You cannot declare death. You cannot harvest organs. You must continue resource-intensive care on a body with no brain.
  *   **The Contradiction:** If you declare death anyway, you admit that your "Organismal Integration" account was a lie, and you actually hold a "Brain-Mediated Integration" account (i.e., integration only counts if the *brain* does it).
  *   **The Fix:** To declare death in Case 2, you must change Step 1 to **Account B (Whole-Brain)** and explicitly add the clause: *"Integration mediated by external artificial control does not count as organismal function."* This is a value judgment, not a biological fact. The procedure forces you to admit this.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Define "Irreversible":**
      *   *Misfire:* "Irreversible" is a moving target. Ten years ago, a ventilator made respiratory arrest reversible. Now it doesn't count. Tomorrow, somatic support might make brain death reversible (functionally). The procedure forces you to vote on where the line is *today*, but it cannot tell you where the line *should* be.
      *   *Refusal:* It refuses to answer whether somatic support *ought* to count as life. It only answers whether it counts as life *given your chosen definition*.

  2.  **It Cannot Resolve Value Conflicts:**
      *   *Misfire:* In Case 3, the family's moral intuition (Personhood) conflicts with the Statute (Whole-Brain). The procedure outputs "WITHHOLD." This is legally correct but morally frustrating.
      *   *Refusal:* It should refuse to adjudicate whether the law is just. It is a compliance tool, not a justice tool.

  3.  **It Masks the "Judgment Calls":**
      *   *Warning:* Step 2 (The Irreversibility Test) is where the philosophy hides. When you decide if a machine "supports" or "replaces" an organism, you are doing metaphysics, not medicine. The procedure labels this a "Judgment Call," but in practice, panels will treat it as a fact.
      *   *Risk:* You may end up with different panels reaching different verdicts on the same case because their hidden metaphysics differ.

  4.  **Do You Need a Procedure?**
      *   *Honest Answer:* **No.** You need a **Policy Revision.**
      *   *Reason:* A procedure applies existing rules. Your problem is that your existing rules (the accreted protocol) are incoherent. Running a procedure on incoherent rules just produces consistent incoherence (as seen in Case 2).
      *   *Recommendation:* Use the output of Case 2 to convene a task force. You cannot *proceduralize* your way out of a definitional crisis. You must rewrite the definition of death in your protocol to explicitly exclude "machine-mediated integration" if you intend to declare death in the age of somatic support. Until then, this procedure will simply force you to look at the contradiction every time.
