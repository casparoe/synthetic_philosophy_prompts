      *   **What Counts as Progress?**
          *   Not a formal result (Gödel-style limitations might apply with C).
          *   Not just a distinction.
          *   *Real Progress:* Acknowledging that "Moral Uncertainty" is not a unified problem. It fragments based on the theories involved. You need a *typology* of uncertainty problems, not a *universal* solution.
          *   Specifically: Admit that if D is in the mix, ECM is dead. If C is in the mix, fixed-point problems arise.
      *   **Confidence & Failure Modes:**
