answer: |-
  The parallel you're drawing is sharp because it cuts to the core of Sidgwick's intellectual anxiety: the management of bias in the pursuit of truth. In *The Methods of Ethics*, the "impartial spectator" (or what Sidgwick more precisely calls the "point of view of the universe") demands that we strip away personal interest to judge actions based on their universalizable consequences. In his work with the Society for Psychical Research (SPR), he attempts a similar stripping away—this time of *scientific* prejudice. He wants to judge anomalous data without the bias of materialist dogma.

  On the surface, the methodological caution in both domains looks identical. It is the stance of a rigorous empiricist who refuses to let prior probability completely veto fresh evidence. The spectator requires that we do not dismiss a moral claim just because it conflicts with our egoistic desires; similarly, Sidgwick argues we should not dismiss a psychical claim just because it conflicts with our physicalist desires. In this light, the "double-bind" you mention—fearing gullibility on one side and dogmatism on the other—is simply the epistemic expression of the impartial standpoint. To be impartial is to stand in the tension between two errors.

  However, the comparison collapses when you examine the *asymmetrical burden of proof* you identified. In his ethics, the impartial spectator is fundamentally symmetric. A reason is valid or invalid regardless of who proposes it; the calculus of happiness weighs pleasure and pain without preference. But in psychical research, Sidgwick's caution tilts. He operates on the intuition that the cost of a false negative (rejecting a genuine psychic phenomenon) is higher than the cost of a false positive (accepting a fraud).

  Why the asymmetry? Because for Sidgwick, psychical research wasn't just about adding new facts to a database; it was about saving his ethical system from collapse. The "Dualism of Practical Reason" in *The Methods of Ethics* leaves him with a gaping wound: rational egoism and rational benevolence don't necessarily align unless there is a cosmic guarantee (God/Immortality) that virtue leads to happiness. If psychical research can prove survival, the dualism is resolved.

  Here is where the spectator fails to justify the SPR stance. The impartial spectator demands truth for truth's sake, grounded in what can be universally verified. But Sidgwick's openness to psychical evidence is driven by a *moral need* for that evidence to be true. This introduces a covert bias into the "impartial" investigation. The spectator requires us to weigh evidence based on its probative force. Sidgwick, however, weighs the *consequences of the conclusion* on his ethical architecture. He is willing to tolerate a higher risk of epistemic error (believing in ghosts) to avoid the moral catastrophe of a godless universe where justice is not ultimately enforced.

  This suggests that psychical research exposes a gap in his ethics rather than reinforcing it. The impartial spectator assumes a stable natural order where consequences can be calculated. Utilitarianism relies on the predictability of cause and effect. Psychical research, by its nature, proposes violations of that predictability. If the laws of physics are permeable to will or spirit, the "calculus" of the spectator becomes impossible to run. You cannot universalize maxims in a world where the rules of causation are sporadic.

  So, while the *virtue* of caution in SPR mirrors the *virtue* of impartiality in ethics, the *motivation* diverges. The spectator's neutrality is meant to secure objective moral truth. Sidgwick's SPR neutrality is a holding pattern for a theological hope. He isn't just avoiding the error of the dogmatic scientist; he is actively protecting the possibility of a moral sanction.

  The asymmetrical burden of proof, then, isn't a logical extension of the impartial spectator. It is a patch over the dualism of practical reason. The spectator would say, "Believe only what the evidence compels." Sidgwick in his SPR mode says, "Do not let the evidence be dismissed, because we cannot afford to lose it." That is not the voice of the impartial spectator; it is the voice of a man trying to keep his ethical system from dissolving into nihilism. The caution in SPR isn't methodological purity; it's moral desperation disguised as scientific rigor.
