  *Wait, one nuance:* Sidgwick's "caution" in SPR was actually quite extreme skepticism initially, but he remained open longer than most scientists. The prompt suggests he was "open-minded but super cautious." I need to address the *asymmetry* specifically: the risk of false negative (missing a truth) vs. false positive (believing a lie). Sidgwick seemed to weigh the false negative heavier *eventually*, because of the moral implications.

  *Let's structure the response:*
  1.  **The Structural Parallel:** Epistemic hygiene in both domains.
  2.  **The Asymmetry:** How the burden of proof shifts in SPR compared to Ethics.
