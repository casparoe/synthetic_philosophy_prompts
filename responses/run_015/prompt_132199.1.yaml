answer: |-
  This is a solid intuition, and you're definitely tapping into a vein that gets discussed in meta-ethics and decision theory (often under the banner of "non-transitive betterness" or "contextualist value"). Since you asked for a gut-check rather than a literature review, I'll skip the names and focus on the structural integrity of the argument.

  Here are the four biggest hurdles you need to clear to make this stick.

  ### 1. The "Incommensurability" Charge
  You asked if this is just incommensurability with extra steps. I'd say **no, but it's adjacent.**

  Strict incommensurability usually claims that for some $A$ and $B$, none of the three relations hold ($>, <, =$). Your argument is stronger: you're saying the relation *does* hold locally, but the *metric* defining the relation changes globally.

  The distinction matters. Incommensurability stops the comparison dead. Your "neighborhood" theory allows the comparison to proceed but denies that the *rules* of the comparison are invariant. This is closer to **contrastivism** (betterness is a three-place relation: $A$ is better than $B$ *with respect to context $C$*) than to traditional incommensurability. If you frame it as "the weighting function is context-sensitive," you avoid the charge that you're just saying "we can't compare." You're saying "we are comparing, but the ruler changes length."

  ### 2. The Money Pump Objection
  This is the classic rationalist counter-attack to non-transitive preferences. If $A > B$, $B > C$, but $C > A$ (or even if $A$ is not $> C$), an agent can be exploited. I pay you a dollar to swap $C$ for $B$, a dollar to swap $B$ for $A$, and a dollar to swap $A$ for $C$. I end up with $C$ and you're down three dollars. Repeat until bankruptcy.

  To defend your "neighborhood" thesis, you need to explain why a rational agent wouldn't get pumped.
  *   **The Defense:** You have to argue that recognizing a "neighborhood boundary" triggers a **re-evaluation cost** or a **refusal to trade**. Once I realize swapping $A$ for $C$ moves me into a different weighting regime, I don't view it as a simple upgrade; I view it as a category shift.
  *   **The Risk:** If the boundaries are fuzzy (see point 3), a sufficiently subtle money pump could cross the boundary slowly enough that the agent doesn't notice the regime shift until it's too late. You need a story about why agents detect boundary crossings.

  ### 3. The Border Ambiguity (The Sorites within the Sorites)
  You hit the nail on the head with your own question: *does it just push ambiguity into where the borders are?*

  **Yes.** And this is the weakest link.
  In the classic spectrum argument, the steps are identical (e.g., removing one hair, or slightly reducing quality of life). If $A$ and $B$ are in Neighborhood 1, and $B$ and $C$ are in Neighborhood 1, transitivity demands $A$ and $C$ are comparable under those same weights.
  For your argument to work, the "neighborhood" can't just be defined by the items themselves; it has to be defined by the **distance from the anchor**.

  If you say "weights shift when the options get too different," you risk circularity:
  *   *Q:* "Why is $A$ not better than $Z$?"
  *   *A:* "Because they are in different neighborhoods."
  *   *Q:* "How do you know they are in different neighborhoods?"
  *   *A:* "Because $A$ isn't better than $Z$."

  To avoid this, you need an independent criterion for what constitutes a neighborhood. Is it cognitive bandwidth? Is it a threshold on a specific dimension (e.g., "once predictive power drops below X, simplicity no longer matters")? If the boundary is just as vague as the original "better than" relation, you haven't solved the paradox, you've just relocated the vagueness.

  ### 4. The "All-Things-Considered" Trap
  The spectrum paradox is usually compelling because it appeals to an **all-things-considered** judgment.
  Even if I grant that local weights shift, most people have a meta-preference that says, "Regardless of the weights, Outcome A is preferable to Outcome Z."

  If your argument implies that there is *no* global "better than," you run into the problem of explaining why we feel so confident that a life of joy is better than a life of agony, even if we can't construct a transitive chain of intermediate steps.
  *   **Suggestion:** You might want to argue that "all-things-considered" is not a summation of local comparisons, but a separate, high-level heuristic that *overrides* local transitivity when the distance is too great. This preserves the intuition that $A > Z$ without forcing you to accept the chain $A > B > \dots > Z$.

  ### Verdict
  The argument hangs together **if** you treat "better than" as a contextual relation rather than a global property of the objects.

  **The strongest version of your essay:**
  Don't just say neighborhoods exist. Argue that **valuation is a process, not a lookup.** When we compare $A$ and $B$, we construct a temporary metric suitable for distinguishing them. When we compare $Y$ and $Z$, we construct a *different* metric. Transitivity fails because $A > B$ and $Y > Z$ are outputs of *different functions*, even if we use the same English words to describe them.

  **The obvious objection to preempt:**
  Expect readers to ask: "If I have to choose between $A$ and $Z$ directly, which do I pick?"
  If you say "It depends," you lose.
  If you say "$A$, but not because of the chain," you need to explain what mechanism delivers that verdict if not the transitive chain. (Hint: It's likely a direct intuition that bypasses the dimensional weighting entirely).

  It's a promising angle. It moves the debate from "logic is broken" to "our modeling of value is too static." Just tighten up the definition of a "neighborhood" so it doesn't look like an ad-hoc save.
