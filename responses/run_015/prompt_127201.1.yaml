  4.  **Identify the Real "Slip" (The Theoretical Core):**
      *   **The Equivocation:** The friend conflates *measure of wealth* (use-value/social wealth) with *measure of value* (exchange-value/capitalist wealth).
      *   Marx says automation makes labor time a bad measure of *wealth* (potential abundance), but capital *forces* it to remain the measure of *value*. This is the contradiction.
      *   **Living vs. Direct Labor:** The friend says "direct labor." Marx distinguishes between the labor embodied in the machine (dead labor) and the labor operating/maintaining/designing it (living labor). Automation reduces the *necessary* labor time, increasing *relative* surplus value, but it also raises the organic composition of capital, triggering the Tendency of the Rate of Profit to Fall (TRPF).
      *   **Realization vs. Production:** Even if value is produced, can it be *realized* (sold)? Automation creates a crisis of realization (who has wages to buy the stuff?).
      *   **Counter-Tendencies:** Marx never said profit goes to zero *immediately*. He listed counter-tendencies (intensification, cheapening of constant capital, new spheres of production, foreign trade).

  5.  **Synthesize the Response Strategy:**
