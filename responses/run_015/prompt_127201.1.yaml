      *   **Goal:** Identify the weak step in the friend's argument, clarify the distinction between *direct* and *living* labor, and explain how Marx's crisis theory holds up without declaring Amazon post-capitalist.

  2.  **Deconstruct the Friend's Argument (Step-by-Step Evaluation):**
