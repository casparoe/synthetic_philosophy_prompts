      *   **Pinpoint the Error:** The main slip is between *Value* and *Wealth*, and the assumption that individual firm profit = total social surplus value.
      *   **Address the "Enclosure" Idea:** Acknowledge it (Rent/Intellectual Property) but warn against reducing Marx to just rent theory. It explains *redistribution*, not necessarily *creation*.
      *   **Explain the Contradiction:** Automation *is* contradictory because capital *needs* labor to create value but *competes* to eliminate labor to cut costs. This creates a tendency for crisis, not an immediate halt.
      *   **Amazon/Big Tech:** They are capitalist, but they benefit from *transfer* of value (monopoly rent, financialization) and *unpaid labor* (user data/training), which complicates the LTV but doesn't invalidate it.
      *   **Key Concept:** The "Fragment on Machines" is a *limit concept*, not a description of the present. It describes the *potential* for communism within capitalism, which capitalism suppresses.

