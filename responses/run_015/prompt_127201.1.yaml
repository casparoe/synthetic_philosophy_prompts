answer: |-
  This is a classic and very sharp objection often raised in debates surrounding the *Grundrisse*, particularly the "Fragment on Machines." Your friend has reconstructed a version of the "end of work" or "post-capitalist" argument that many autonomist Marxists (like Negri or Lazzarato) have wrestled with.

  Your intuition is correct: **Step (2) is the weak link**, but not exactly for the reason you suspect (enclosure/IP). While enclosure is part of the picture, relying on it too heavily risks turning Marx into a theorist of rent rather than value.

  The deeper theoretical slip is an **equivocation between "wealth" (use-value) and "value" (exchange-value)**, and a misunderstanding of how the **Law of Value** functions as a *barrier* rather than an immediate switch-off.

  Here is a breakdown of where the argument slips, how to save the contradiction of automation, and why Amazon is still capitalist.

  ### 1. The Slip in Step (2): Wealth vs. Value
  Your friend's argument hinges on this sentence: *"if direct labor isnt the measure anymore, then surplus value... should tend toward zero."*

  Marx makes a crucial distinction in the *Grundrisse* that your friend collapses:
  *   **Wealth (Use-Value):** As automation advances, the creation of real wealth (stuff, services, potential abundance) becomes dependent on the "general intellect" (science, tech, social knowledge) rather than direct labor time.
  *   **Value (Exchange-Value):** Capitalism, however, *retains* labor time as the sole measure of value.

  **The Contradiction:** Capitalism develops the productive forces to a point where labor time is no longer a relevant measure of *wealth*, but it *forces* labor time to remain the measure of *value* to sustain profit.

  **Why Step (2) fails:** Surplus value doesn't tend to zero simply because machines replace workers in *one* sector. Instead, the **socially necessary labor time** required to produce commodities drops. This increases *relative surplus value* (workers produce their own wage in less time) for the early adopters, but as automation generalizes, the **mass of profit** relative to total investment tends to fall (the Tendency of the Rate of Profit to Fall, or TRPF, from *Capital* Vol. 3).

  Marx isn't saying profit hits zero immediately; he's saying the *basis* of profit becomes increasingly unstable. The system doesn't halt; it enters crisis. It tries to re-introduce scarcity or find new areas of labor to exploit to keep the "labor measure" alive.

  ### 2. The "Enclosure" Hypothesis (Your Point)
  You suggested: *"maybe surplus value just migrates from the factory floor to the enclosure of knowledge."*

  This is a strong contemporary Marxist argument (often associated with theorists like Massimo De Angelis or David Harvey), but you need to be careful with the terminology.
  *   **Value Production vs. Value Appropriation:** Strictly speaking, in Marx's LTV, rent (IP, patents, data monopolies) is a *transfer* of value, not the *production* of new value. If Google makes money from search algorithms, that profit is ultimately a deduction from the total surplus value produced elsewhere in the global economy (e.g., by workers making the servers, or advertisers who extract surplus from their workers).
  *   **The Trap:** If you argue that *all* tech profit comes from "enclosure/rent," you risk admitting that the LTV doesn't apply to the tech sector itself, rendering it a parasitic superstructure.
  *   **The Save:** You can argue that "enclosure" allows capital to *realize* value even when production is automated. It sustains profitability through **monopoly prices**, not by creating new value. This explains why Amazon is profitable *without* proving the LTV wrong. It proves that capital is using monopoly power to redistribute value because it can't generate enough new value through production alone.

  ### 3. The Hidden Equivocation: Direct vs. Living Labor
  You asked if there is a hidden equivocation between direct and living labor. **Yes.**

  Your friend focuses on "direct labor" (the person on the assembly line). But Marx's concept of **living labor** is broader.
  *   **The Extended Factory:** AI and platforms rely on massive amounts of hidden labor: data labelers in the Global South, content moderators, gig workers maintaining the logistics, and even the "free labor" of users generating data.
  *   **Complex Labor:** The labor that *creates* the automation (engineers, scientists) is "complex labor," which counts as multiplied simple labor.
  *   **The Point:** Automation hasn't eliminated living labor; it has **socialized** and **obscured** it. The value is still being pumped out by living labor, but it is increasingly distributed across a global network rather than concentrated in a single factory. This makes the exploitation harder to see, but not non-existent.

  ### 4. Why Accumulation Hasn't Halted (Step 3 & 4)
  Your friend argues: *"Capital cant accumulate without surplus value... but accumulation hasnt stopped."*

  Marx never predicted an immediate halt. He predicted **counter-tendencies**.
  1.  **Fictitious Capital:** A huge chunk of "accumulation" in tech is financial speculation (stock buybacks, venture capital valuations) that anticipates future value that hasn't been produced yet. This looks like accumulation, but it's actually debt against future labor.
  2.  **New Spheres of Production:** When automation kills profit in manufacturing, capital moves to new spheres (services, care work, the "attention economy") where labor is harder to automate.
  3.  **Cheapening of Constant Capital:** Machines make other machines cheaper. This offsets the falling rate of profit temporarily.

  So, accumulation hasn't stopped, but it has become **financialized, crisis-ridden, and dependent on monopoly rent.** This fits Marx's model of capitalism in its declining phase, not a refutation of it.

  ### 5. How to Keep the Contradiction (Without calling Amazon Post-Capitalist)
  You want to maintain that automation is contradictory for capital. Here is the formulation that saves the argument:

  **Automation creates a barrier to Capital, not an immediate exit.**

  *   **The Contradiction:** Capital is compelled to automate to beat competitors (cut costs). But by automating, it erodes the very source of value (labor) that it needs to realize profit.
  *   **The Result:** Not the death of capitalism, but **stagflation, inequality, and crisis.** Capital responds by:
      1.  Intensifying exploitation of remaining workers (gig economy).
      2.  Enclosing commons (IP, Data) to extract rent.
      3.  Financialization (betting on future value).
  *   **Amazon's Status:** Amazon is hyper-capitalist. It uses automation to discipline labor (algorithmic management), not just replace it. It uses monopoly power to capture value from other capitalists (small sellers on the platform). It is not "post-capitalist"; it is capitalism struggling to maintain the law of value in an age where technology makes that law obsolete.

  ### Summary for your Seminar
  To answer your friend directly:

  1.  **The Weak Step:** Step (2) assumes a mechanical relationship between automation and the zeroing of surplus value. It ignores that capitalism *resists* this tendency through crisis, monopoly, and financialization.
  2.  **The Equivocation:** It confuses the *potential* for abundance (wealth) with the *requirement* for profit (value). Marx's point is that capitalism becomes a **fetter** on this potential. It prevents the general intellect from liberating us because it must maintain scarcity to keep prices (and profits) up.
  3.  **The Enclosure Point:** You are right that enclosure matters, but frame it as **value appropriation (rent)** rather than **value production**. This explains tech profits without abandoning the LTV. It shows capital is cannibalizing itself to survive.
  4.  **The Conclusion:** Automation *does* undermine capitalism, but not by making it vanish. It makes it **parasitic and crisis-prone.** The fact that Amazon is profitable doesn't prove the system is healthy; it proves it has found temporary ways to bypass the law of value through monopoly and finance, which ultimately exacerbates the contradiction Marx identified.

  This allows you to say: *"Marx was right that automation undermines the labor measure of value, but capital survives by turning into a rentier system that suppresses the very abundance automation could provide."* This keeps the contradiction alive without declaring Amazon post-capitalist.
