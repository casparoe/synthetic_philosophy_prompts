      *Conclusion:* Dale is likely a **Harm-Based Retributivist with a touch of Lex Talionis.** He isn't necessarily switching meanings randomly, but he is relying on a specific definition of "Crime" (Harm-focused) that clashes with Culpability-focused views. I will present this as the most charitable reading, but acknowledge the rhetorical flexibility.

