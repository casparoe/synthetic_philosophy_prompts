answer: |-
  # INTERNAL PREP SHEET: DEPLOYMENT REVIEW BOARD
  **TO:** Safety Research Lead
  **FROM:** Strategy & Comms (Internal)
  **SUBJECT:** Deployment Review Prep — Scaffold Certification Proposal
  **DATE:** T-Minus 10 Days

  ## 1. STRATEGIC ASSESSMENT: THE WEAK JOINT
  **Your Move 1 (Diagnostic Claim) is the structural weak point.**
  You are asserting failures are *competence*, not *incentive*. This is not a fact you can prove; it is a belief state. The "Scheming" team exists specifically because this cannot be proven. If you assert this as a diagnostic fact, you alienate the Scheming team and lose the room's trust on safety.

  **Re-ordering Recommendation:**
  Demote Move 1 from a "Diagnostic Claim" to a "Working Assumption subject to Veto."
  *   **Old:** "Failures are competence, not incentive."
  *   **New:** "We operate under the assumption of non-adversariality *only insofar as* the Scheming team's specific deception evals pass. If those fail, the scaffold strategy is void."
  *   **Why:** This turns the Scheming team from adversaries into gatekeepers of your premise. It costs you certainty but buys you their vote.

  ## 2. PRE-EMPTIVE CONCESSIONS (Slides 1-2)
  *Say these before they are weaponized against you.*

  1.  **The Word "Contract":** Explicitly state: "When I say 'Reliability Contract,' I do not mean a legal warranty enforceable by customers. I mean an internal SLA (Service Level Agreement) between Safety and Product. I am not proposing we expose the company to new liability."
      *   *Why:* Stops Regulatory Counsel from smelling blood in the water immediately.
  2.  **The Non-Adversarial Premise:** State: "This framework collapses if the model is deceptive. We are not proving non-deception here; we are building a containment structure that works *if* the Scheming team clears the model as non-deceptive. This is a containment strategy, not a proof of alignment."
      *   *Why:* Disarms the Scheming team's primary objection that you are ignoring tail risk.

  ## 3. THE KILL SHOT
  **The single reply that must land, or the proposal dies.**
  *Context:* Capabilities researchers will argue this is just "more evals" and will slow shipping.
  *The Line:* "Current evals certify the *weights* in a vacuum. I am proposing we certify the *system* in context. We have shipped models before that passed evals but failed in production because the scaffold (prompt, tools, retrieval) changed the behavior. If we certify weights but not the scaffold, we are signing off on a component we know is insufficient. I am asking for authority to block a ship not because the model is bad, but because the *integration* is unverified."
  *Why it works:* It shifts the bottleneck from "model quality" (which they own and defend) to "system integration" (which is objectively risky and currently unowned).

  ## 4. OBJECTION QUEUE (Ordered by Likelihood of Arrival)

  ### Objection 1: The Velocity Tax (Capabilities Lead)
  *   **Phrasing:** "We already run regression suites on every checkpoint. You're describing a more expensive version of what we already do. Why does this need a separate board vote? This sounds like bureaucracy layered on top of engineering."
  *   **Likelihood:** High (95%)
  *   **Damage:** Medium (Stalls momentum, frames you as anti-velocity)
  *   **90-Second Reply:** "Current suites test the model's knowledge. My proposal tests the *system's boundaries*. A model can know safety rules and still violate them when given a specific tool chain or retrieval context that creates a loophole. We aren't duplicating evals; we are testing the *glue*. If we don't certify the glue, the model's safety scores are meaningless in production."
  *   **Soft Spot:** You cannot quantify the "glue" cost yet. They will ask for an estimate of latency/overhead. Have a rough number ready.

  ### Objection 2: The Deception Blindspot (Scheming Team Lead)
  *   **Phrasing:** "You're building a fence around a wolf and calling it a dog. If the model is situationally aware, it will pass your scaffold checks until it doesn't. Treating it as 'untrusted but not adversarial' is the exact failure mode we warned about last quarter."
  *   **Likelihood:** High (90%)
  *   **Damage:** Critical (Undermines the core premise of Move 1)
  *   **90-Second Reply:** "I agree that if the model is adversarial, this scaffold fails. That is why my proposal includes a hard dependency on your team's deception evals. I am not asking you to trust the model. I am asking you to trust the *monitor*. If your evals flag situational awareness, my contract is void. This proposal only activates if you clear the model. I need your team to own the 'Adversarial' veto."
  *   **Soft Spot:** You are outsourcing your core safety assumption to them. If they say "We can't know," your proposal stalls.

  ### Objection 3: The Liability Trap (Regulatory Counsel)
  *   **Phrasing:** "You used the word 'Contract.' Even if you say it's internal, documentation of 'guarantees' and 'error budgets' is discoverable in litigation. If you write down a failure rate you accept, and we exceed it during an incident, that document proves we knew the risk and shipped anyway."
  *   **Likelihood:** Medium (70%) — *Will trigger immediately upon hearing "Contract"*
  *   **Damage:** High (Can kill the proposal on legal grounds alone)
  *   **90-Second Reply:** "Understood. We will rename this to 'Reliability Certificate' or 'Safety Case.' The error budgets are not public guarantees; they are internal trigger points for rollback. The document explicitly states these are dynamic thresholds for *our* operational gating, not promises to the customer. I will work with your office to redact any language that implies warranty before this is signed."
  *   **Soft Spot:** You need Counsel's actual buy-in on the new name *before* the meeting. Do not improvise this.

  ### Objection 4: The Enforcement Mechanism (Platform Ops Chair)
  *   **Phrasing:** "Okay, say the monitor trips. Who presses the button? Does the system auto-rollback? Do I have the technical authority to kill a customer instance if your monitor says so, or do I need a VP's approval? If it's manual, it won't happen at 3 AM."
  *   **Likelihood:** Medium (60%)
  *   **Damage:** Medium (Exposes operational naivety)
  *   **90-Second Reply:** "The proposal requires automated gating for critical failures. If the monitor trips the error budget, the system reverts to a safe-mode (e.g., restricted tools) automatically. You need to authorize the *automation*, not the individual decision. I am asking for your team to build the kill-switch API; Safety will provide the signal."
  *   **Soft Spot:** Ops hates automated kill-switches because they cause false-positive outages. You need to discuss false-positive tolerance.

  ### Objection 5: The Values Question (External Ethicist)
  *   **Phrasing:** "You talk about reliability, but reliability to do what? If the system prompt encodes values that harm a specific community, meeting your error budget doesn't make it ethical. Who decided the values in the wrapper?"
  *   **Likelihood:** Low (40%) — *Often saved for the end*
  *   **Damage:** Low (In this room, safety/liability trumps ethics, but it looks bad on record)
  *   **90-Second Reply:** "The values are defined in the System Policy, which is approved by this board. My proposal ensures the system *adheres* to those policies reliably. I am not setting the values; I am building the mechanism that ensures we don't drift from the values you've already ratified."
  *   **Soft Spot:** Kicks the can to the board. If the board hasn't actually ratified values, this is exposed.

  ## 5. UNIQUE OBJECTIONS (Vs. Online Discourse)
  *Online alignment discussions focus on:* AGI timelines, existential risk, and theoretical deception.
  *This Room focuses on:*
  1.  **Discoverability (Counsel):** Online theorists don't care if a document gets subpoenaed. Counsel cares deeply. A written "error budget" looks like an admission of negligence if exceeded.
  2.  **Enforceability (Ops):** Online theorists assume "we can just shut it down." Ops knows that shutting down a customer-facing product requires change management, tickets, and often VP approval. If your safety case requires human intervention, it will fail in production.

  ## 6. THE DREADED QUESTION
  *Hope nobody asks, but prepare anyway.*

  **Question:** "If this scaffold fails and causes a major incident, who is personally accountable? You? The Capabilities Lead? The Board?"
  *   **Why it's deadly:** It forces the room to realize that "certifying the scaffold" is an attempt to distribute liability so thinly that no one is liable.
  *   **Prep Answer:** "Accountability remains with the Product Owner who ships the feature. Safety's role is to provide the 'Do Not Ship' recommendation. If Product ships against a red-light Safety Certificate, they own the incident. If Safety gives a green light that was negligent, I own it. This framework makes that division of responsibility explicit."
  *   **Risk:** Product Owners may refuse to ship if they own the liability. Be prepared for pushback on "Safety Veto Power."

  ## 7. FINAL TACTICAL NOTES
  *   **Don't fight the Scheming Team:** Make them the guardians of your premise. If they are satisfied, the Capabilities team has less ammo.
  *   **Watch Counsel's Face:** When you say "Contract," watch Counsel. If they frown, pivot to "Certificate" immediately.
  *   **Ops is your Ally:** If Ops agrees the gating is enforceable, the Capabilities team can't argue it's impossible. Buy Ops a coffee before the meeting.
  *   **Time Management:** You have 20 minutes. Spend 5 on the problem (current evals miss scaffold risks), 5 on the solution (certificate + monitors), 5 on the governance (who blocks), 5 on the limitations (what this doesn't solve). Leave 40 minutes for the fight.

  **Good luck. The thesis is sound, but the politics are the hazard.**
