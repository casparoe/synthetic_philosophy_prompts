answer: |-
  This is a classic problem in the ethics of travel: the tension between **moral universalism** (my principles apply everywhere) and **contextual sensitivity** (norms are local coordination devices). Since you are a colleague, I will skip the introductory fluff and structure this by scenario, explicitly distinguishing between the *standard/consensus views* in normative ethics and the *genuinely contested* theoretical ground.

  Here is practical advice grounded in that distinction.

  ### 1. Tipping
  **The Situation:** Home = 20% (reluctant); Away = Locals 0%, Tourist Zones expect 15–20%.

  **Practical Advice:**
  Do not tip in local establishments where tipping is not customary (it can be insulting). In tourist-centric spaces where staff rely on tourist tips due to wage structures designed around that expectation, tip the expected amount, but view it as a price of service rather than a moral bonus.

  **The Reasoning:**

  *   **Settled/Standard View:** There is no intrinsic moral duty to tip. Tipping is a **social convention**, not a moral imperative. Most ethicists agree that moral obligations regarding property and payment are defined by the local institutional framework. If the local wage structure does not rely on tips, you have no obligation to provide one.
  *   **Contested View:** The **ethics of reliance**. Some argue that if a worker *expects* a tip because you are a tourist (creating a reliance interest), you incur a quasi-contractual obligation to pay it to avoid harming them. Others argue this is a form of **exploitation** (the "tourist tax") and that paying it reinforces an unjust system. There is no consensus on whether satisfying an unjust expectation is morally required to prevent immediate harm to the worker, or if it is better to refuse to participate in the norm.
  *   **Why this advice:** You avoid the insult of imposing home norms on locals, but you acknowledge the economic reality of the tourist bubble. You are not morally required to fix the local wage system, but you are generally obliged to honor the explicit or implicit pricing of the transaction you are entering.

  ### 2. Crosswalks (Jaywalking)
  **The Situation:** Home = Wait for green (especially with kids); Away = Cross when clear, regardless of light.

  **Practical Advice:**
  Cross with the flow of local traffic when it is safe to do so. Do not stand on the curb waiting for a light if everyone else is crossing. However, maintain a higher safety margin than locals if you are unfamiliar with local driving speeds.

  **The Reasoning:**

  *   **Settled/Standard View:** Traffic laws are **coordination conventions**, not moral laws. Their primary purpose is safety and flow. Violating a coordination convention is only wrongful if it creates significant risk or undermines the system's utility. If the local equilibrium is "cross when clear," waiting for a green light when the road is empty does not increase safety; it arguably decreases efficiency without moral gain.
  *   **Contested View:** The **Principle of Fair Play**. Does your presence as a visitor obligate you to obey the laws of the host state even when enforcement is lax? Some argue that benefiting from the order provided by others' compliance creates a duty to comply. Others counter that in transient contexts, the duty of **prudential safety** overrides the duty of legal obedience. Furthermore, the "role model" obligation you feel regarding children is generally viewed as **agent-relative** (owed to your own children or community), not agent-neutral (owed to all children everywhere).
  *   **Why this advice:** Standing still while everyone moves disrupts the local coordination equilibrium and can actually be dangerous (drivers may not expect a stationary pedestrian). Your obligation to "set an example" does not travel well; your obligation to not be a hazard does.

  ### 3. Queuing (The "Scrum")
  **The Situation:** Home = Strict linear queue; Away = Loose cluster/scrum.

  **Practical Advice:**
  Observe for 30 seconds before committing. If it is a scrum, you must enter the scrum to be served. However, maintain an internal mental log of who arrived before you and yield to them if there is contention. Do not stand passively at the "back" if there is no line.

  **The Reasoning:**

  *   **Settled/Standard View:** Queues are mechanisms for **distributive justice** (first-come, first-served). The moral wrong in queue-jumping is the unfair appropriation of a scarce resource. The *form* of the queue (linear vs. cluster) is secondary to the *function* (fair access).
  *   **Contested View:** The **epistemology of the queue**. In a "scrum," the rules of priority are often ambiguous. Is it strict arrival time? Is it assertiveness? Is it proximity to the counter? There is significant debate over whether a visitor is obligated to decipher the local "scrum rules" or if they are permitted to default to the linear norm they know. Some argue that failing to adapt to the local scrum is a form of **moral stubbornness** that harms you without helping anyone; others argue that participating in a scrum when you know a linear system is fairer contributes to the degradation of public order.
  *   **Why this advice:** If you stand at the back of a non-existent line, you are not being virtuous; you are simply opting out of the distribution mechanism. You will not be served, and the locals will not thank you. The moral goal is fairness, not the aesthetic of the line.

  ### Summary of the Ethical Framework

  To synthesize this for your own peace of mind:

  **1. The Consensus (Settled):**
  *   **Moral Relativism is false:** You do not leave your morality at the border. Murder, theft, and deceit are still wrong.
  *   **Conventions are local:** Rules regarding tipping, queuing forms, and traffic coordination are context-dependent conventions. There is no universal duty to follow *home* conventions abroad.
  *   **Harm Principle:** The primary constraint on your behavior is avoiding harm to others (physical or economic).

  **2. The Debate (Contested):**
  *   **Complicity:** To what extent does following local norms make you complicit in local injustices (e.g., underpaid workers relying on tips)?
  *   **Fair Play:** Do transient visitors owe a duty of "fair play" to local systems they benefit from but do not belong to?
  *   **Virtue Signaling:** Is there value in maintaining your personal habits (like queuing strictly) as a form of integrity, even if it is inefficient or ignored? (Most ethicists lean toward "no," but virtue ethicists might disagree).

  **Final Recommendation:**
  Adopt a stance of **pragmatic conventionalism**. Follow local norms regarding coordination (traffic, queues) to ensure safety and efficiency. Follow local economic norms (tipping) to avoid exploitation or insult, unless doing so violates a core moral constraint. You are not required to be a moral missionary for your home country's queueing culture, nor are you required to adopt local habits that feel genuinely unethical to you. But in the cases you described, these are matters of convention, not core morality.

  Safe travels to the conference.
