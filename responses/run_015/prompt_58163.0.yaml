prompt: |-
  I'm a philosophy prof heading to a conference abroad next month and I'm realy unsure how to handle a few everyday things. At home I tip 20% even though I hate the system, I wait at empty crosswalks if kids are around, and I always join the back of the queue even when I could slip in. Where I'm going, locals basically don't tip but shops near hotels expect tourists to tip big, everyone crosses wherever, and lines are more like loose scrums. Should I just do what locals do or stick with my own habits? Give me some practical advice on what to do, and when you explain the reasoning please separate out what is pretty settled vs what is genuinely contested among people who work on norms and obligations — dont present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy professor. This means they value precision, nuance, distinction between descriptive/prescriptive, and awareness of ethical frameworks. They will spot oversimplification or dogmatism.
      *   **Situation:** Traveling abroad for a conference.
      *   **Dilemma:** Cultural conflict between home habits (high tipping, strict rule-following, queueing) and destination norms (low/no tipping, jaywalking, loose queuing).
      *   **Specific Instruction:** Provide practical advice. Crucially, when explaining reasoning, *separate settled views from contested views* in normative ethics/social philosophy. Do not present contested views as consensus.

  2.  **Deconstruct the Three Scenarios:**
      *   **Tipping:** Economic norm vs. moral obligation vs. cultural expectation.
      *   **Crosswalks:** Safety rule vs. legal rule vs. social coordination.
      *   **Queuing:** Fairness vs. efficiency vs. social contract.

  3.  **Drafting the Advice - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate the professor's ethical sensitivity. Set the stage for the distinction between *moral obligations* and *social conventions*.

      *   **Scenario 1: Tipping**
          *   *Home:* 20% (hate the system but do it).
          *   *Away:* Locals don't, tourist traps expect it.
          *   *Analysis:* This is largely about economic harm and expectation.
          *   *Settled View:* There is no universal *moral* duty to tip where it's not customary. It's a conventional norm. However, if workers rely on it due to tourist expectations, there might be a consequentialist consideration.
          *   *Contested View:* Whether fulfilling *created expectations* creates a binding obligation (promissory-like vs. mere prediction).
          *   *Advice:* Follow local custom generally, but be aware of the "tourist tax" dynamic. Don't tip where it's insulting, do tip where it's expected *from tourists* if you want to avoid exploitation of workers, but recognize it's not a strict moral duty.

      *   **Scenario 2: Crosswalks**
          *   *Home:* Wait even if empty (especially with kids).
          *   *Away:* Jaywalking is normal.
          *   *Analysis:* Safety vs. Rule-following vs. Coordination.
          *   *Settled View:* Safety is a prudential good. Traffic laws are coordination conventions. Violating them isn't inherently immoral *unless* it creates risk.
          *   *Contested View:* The "fair play" principle (do we owe it to law-abiding citizens to obey laws that benefit us?). The moral weight of "setting an example" for children (yours vs. strangers').
          *   *Advice:* Prioritize safety (look both ways). If the flow of traffic dictates crossing, go with the flow (coordination). Don't stand out dangerously. The "kids around" rule is specific to your role as a guardian/role model at home; abroad, the coordination norm dominates.

      *   **Scenario 3: Queuing**
          *   *Home:* Strict back-of-line.
          *   *Away:* Loose scrums.
          *   *Analysis:* Fairness (first-come-first-served) vs. Efficiency/Chaos.
          *   *Settled View:* Queues are social contracts for distribution of scarce resources. Violating them causes harm (frustration, unfairness).
          *   *Contested View:* Whether the *form* of the queue matters (linear vs. cluster) as long as the *outcome* (fair access) is preserved. Is it rude to adapt to a local "scrum" if you don't know the rules of the scrum?
          *   *Advice:* Observe first. If it's a scrum, you must participate to be served, but try to maintain fairness. If you stand strictly at the back and get ignored, you're penalizing yourself without gaining moral credit.

      *   **General Framework (The "Philosophy" Part):**
          *   Need to explicitly label "Settled" vs. "Contested".
          *   *Settled:* Conventions vary; no universal duty to follow foreign conventions *unless* harm/expectation is created. Moral minimalism vs. cultural relativism (most ethicists reject strong relativism).
          *   *Contested:* The extent of "fair play" obligations to strangers in transient contexts. The morality of "signaling" virtue in non-virtue-signaling contexts.

  4.  **Refining the Tone:**
      *   Must be respectful of their expertise. Don't lecture on basic ethics.
      *   Use terminology correctly (conventions, norms, obligations, consequentialism, deontology).
      *   Ensure the distinction between "settled" and "contested" is visually or structurally clear.

  5.  **Self-Correction/Review during drafting:**
