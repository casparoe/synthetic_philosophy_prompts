  7.  **Final Polish:** Check the voice. Make it sound like two people who are tired of arguing but want to find the truth. (Proceed to generate output).

  *(Self-Correction on "Fake Studies"):* I need to be careful not to say "Study X shows Y." Instead, say "Look at the data from [City/Policy] and see what happens." I will refer to real-world examples like Minneapolis or upzoned corridors without fabricating specific results.

