  *(Term Coining):* "Filtering Lag" is common, but let's coin "The Sub-Market Seal" for the idea that luxury and non-luxury don't mix. Actually, "Permeability Gap" is better. For the character issue, "The Preservation Paradox." Let's go with "The Stability/Exclusion Blur."

