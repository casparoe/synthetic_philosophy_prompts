answer: |-
  # Draft: Housing & Displacement Adversarial Collaboration
  **Status:** Working Doc v0.4  
  **Participants:** Supply-Side (SS) vs. Community-Control (CC)  
  **Goal:** Stop talking past each other. Pin down exactly where the models diverge.

  ---

  ## 1. Agreed Claims (The Baseline)
  *Both parties sign off on these statements. If you can't sign one, flag it immediately.*

  1.  **Zoning History:** Current single-family zoning in most major US metros was explicitly designed to exclude lower-income households and often served as a tool for racial segregation. This is not debatable.
  2.  **Rent Burden:** Rents have outpaced income growth for the bottom 60% of earners over the last 20 years, leading to high instability.
  3.  **Displacement is Bad:** Both sides agree that involuntary displacement (being forced to move due to cost or eviction) causes measurable harm to health, education, and social networks.
  4.  **Supply Constraint:** Artificial zoning constraints restrict housing supply below demand in high-opportunity regions.
  5.  **Filtering Mechanics:** Filtering (where older housing becomes affordable as new housing is built) is a real economic phenomenon that *does* occur in some markets over long time horizons. However, both sides agree it is not instantaneous and may not reach the lowest income quintiles without subsidies.
  6.  **Speculation:** Land speculation plays a role in price increases independent of construction costs.
  7.  **No Silver Bullet:** Neither market-rate construction alone nor community land trusts (CLTs) alone can solve the housing crisis for everyone simultaneously.

  ---

  ## 2. The Disagreements Table
  *This is the core. We aren't trying to resolve these yet; we are trying to isolate the variables.*

  | Crux | Supply-Side (SS) Position | Community-Control (CC) Position | Relevant Case / Data Check | Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Permeability Gap**<br>*(Does filtering cross sub-markets?)* | New luxury supply relieves pressure on the middle, which relieves pressure on the bottom. It's a connected chain. | New luxury supply attracts higher-income capital, raises neighborhood "amenity value," and bids up land costs for everyone nearby. The chain is broken. | **Minneapolis 2040 Upzoning** or **Transit Corridor Upzoning** (e.g., MD/VA). Look at rent trajectories in older stock within 500ft of new luxury builds. | **SS:** Rents in older stock stabilize or drop relative to inflation within 2-3 years of completion.<br>**CC:** Rents in older stock accelerate due to "neighborhood upgrading" signals, displacing existing tenants despite new supply. |
  | **2. The Stability/Exclusion Blur**<br>*(Is "Character" a public good?)* | "Community Character" is mostly a code for exclusion. Veto power allows current residents to hoard opportunity at the expense of outsiders. | "Community Character" is social capital. Veto power protects vulnerable networks from being dissolved by rapid capital turnover. | **Neighborhoods with Strong Organizing** vs. **Neighborhoods with Weak Organizing** during rezoning. Measure eviction rates and small business closure rates. | **SS:** Areas with veto power will have lower housing supply and higher regional homelessness.<br>**CC:** Areas with veto power will have lower *local* displacement and higher social cohesion metrics, even if regional supply is constrained. |
  | **3. Induced Demand**<br>*(Does building bring more demand?)* | Housing demand is largely exogenous (jobs, population). Building doesn't create people; it houses them. | Housing construction signals investment, which attracts capital and higher-income demographics who wouldn't have moved there otherwise. | **Greenfield Development** vs. **Infill Development**. Compare migration patterns into newly upzoned areas vs. static zones. | **SS:** New units absorb existing pent-up demand.<br>**CC:** New units generate *new* demand (wealthier demographics), neutralizing affordability gains. |
  | **4. The Right to Decide**<br>*(Who holds the veto?)* | Regional need outweighs local preference. Zoning should be state/pre-emptive to prevent local capture. | Local residents bear the cost of change (noise, crowding, culture shift). They should hold the veto or co-ownership stake. | **State-Level Preemption Laws** (e.g., Oregon, California SB 9). Measure completion rates vs. legal challenges. | **SS:** Preemption leads to faster construction and lower regional prices.<br>**CC:** Preemption leads to adversarial relationships, lawsuits, and loss of trust, undermining long-term stability. |

  ---

  ## 3. Verbal Disputes (The Word-Game Section)
  *We suspect we agree on some goals but use different dictionaries. Let's call it out.*

  **A. "Affordability"**
  *   **SS Definition:** Market rate relative to median income. If the average rent drops, we won.
  *   **CC Definition:** Secured tenure for *existing* residents. If the average rent drops but the original neighbors get evicted during the transition, we lost.
  *   **The Fix:** We need to distinguish between **Statistical Affordability** (SS) and **Tenure Affordability** (CC). We can both agree Tenure Affordability is the moral priority, while disagreeing on whether Statistical Affordability is the best path to get there.

  **B. "Displacement"**
  *   **SS Definition:** Price-induced exit. If you leave because rent went up.
  *   **CC Definition:** Includes **Cultural Displacement**. If you stay, but your social network, local shops, and cultural landmarks are replaced, you have been displaced even if you kept your lease.
  *   **The Fix:** SS agrees to track "Cultural Displacement" metrics (small business churn, demographic turnover) not just rent prices. CC agrees that price-induced exit is the primary driver of cultural displacement.

  **C. "The Market"**
  *   **SS Definition:** A mechanism for allocating scarce resources efficiently.
  *   **CC Definition:** A vehicle for extracting rent and wealth from land.
  *   **The Fix:** Acknowledge that SS views the market as a *tool* to be unleashed, while CC views the market as a *force* to be tamed. This isn't a semantic dispute; it's a model dispute. Keep it distinct.

  ---

  ## 4. Proposed Empirical Tests (No Cop-Outs)
  *We are not ending with "both have valid points." We are ending with "here is how we check who is right."*

  **Test 1: The 500-Foot Rule**
  *   **Method:** Identify 10 luxury developments built in the last 5 years in moderately priced neighborhoods. Track rent changes in non-luxury buildings within 500 feet vs. a control group 1 mile away.
  *   **Falsification Condition:**
      *   If nearby non-luxury rents rise significantly faster than the control, **SS** must concede that "Amenity Spillover" outweighs "Filtering Relief" in the short term.
      *   If nearby non-luxury rents rise slower or equal to control, **CC** must concede that new supply does not inherently trigger local rent spikes.

  **Test 2: The Veto Impact**
  *   **Method:** Compare two neighborhoods with similar demographics. One has a legally binding Community Benefits Agreement (CBA) with veto power; the other has standard advisory input.
  *   **Falsification Condition:**
      *   If the CBA neighborhood shows higher long-term resident retention *and* comparable regional housing absorption, **SS** must support localized veto power with strong CBAs.
      *   If the CBA neighborhood shows higher retention locally but pushes displacement to adjacent, weaker-organized neighborhoods (displacement shuffling), **CC** must concede that local vetos without regional coordination are zero-sum.

  **Test 3: The Time-Horizon Check**
  *   **Method:** Analyze filtering speed. How many years does it take for a "Luxury" unit to become "Middle Income" via depreciation?
  *   **Falsification Condition:**
      *   If the timeline is >20 years, **SS** must admit filtering is too slow to solve current crises without subsidy.
      *   If the timeline is <10 years, **CC** must admit that market mechanisms are more efficient at creating affordability than assumed.

  ---

  ## 5. Next Steps
  1.  **Pick one case study** (e.g., a specific upzoned corridor in a major city) to run Test 1 on.
  2.  **Define "Cultural Displacement" metrics** together so we aren't arguing about what counts as a loss.
  3.  **Stop debating values.** We both value stability and access. The fight is purely about *causal mechanisms*.

  *Signed (Provisional):*  
  _____________________ (Supply-Side)  
  _____________________ (Community-Control)
