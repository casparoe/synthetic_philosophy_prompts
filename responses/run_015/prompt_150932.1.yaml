          *   *Supply:* Both agree we need *some* new housing, just disagree on *where* and *what kind*.

      *   **Section 2: The Disagreements Table (The Cruxes):**
          *   *Crux 1: Filtering Mechanics.* YIMBY says it works across the ladder. CLT says it leaks upward or creates induced demand.
              *   *Term Coining:* Let's call the deadlock "The Permeability Gap."
              *   *Case Study:* A specific upzoning event (e.g., Minneapolis 2040 or a specific transit corridor).
              *   *Predictions:* YIMBY predicts rent stabilization regionally. CLT predicts local rent spikes due to amenity value.
          *   *Crux 2: Community Character.* YIMBY says it's exclusionary code. CLT says it's social capital/stability.
              *   *Term Coining:* "Stability vs. Exclusion Ambiguity."
              *   *Case Study:* A neighborhood with strong organizing vs. one without (e.g., parts of SF vs. parts of Tokyo? No, keep it US-centric for context. Maybe a specific CLT success vs. a market-rate success). Let's use a generic "High-Organizing Neighborhood" scenario.
              *   *Predictions:* YIMBY predicts veto power reduces supply and raises prices. CLT predicts veto power prevents cultural erasure and displacement.
          *   *Crux 3: The Right to Decide.* Who holds the veto?
              *   *Predictions:* YIMBY says regional body. CLT says local residents.

      *   **Section 3: Verbal Disputes (Semantics):**
          *   *Affordability:* YIMBY means "market rate relative to income." CLT means "secured tenure for existing residents."
          *   *Development:* YIMBY means "housing units." CLT often hears "capital investment vehicle."
          *   *Displacement:* YIMBY focuses on "price-induced exit." CLT includes "cultural displacement" even if you stay.

      *   **Section 4: Next Steps/Tests:**
          *   Avoid the "it depends" cop-out. Instead, propose specific data checks.
          *   Check: Does new luxury construction lower rents in *adjacent* older stock within 2 years?
          *   Check: Does community veto power correlate with lower regional homelessness?

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it casual? Use phrases like "We're stuck here," "Let's pin this down."
      *   *Constraint Check:* Did I fake studies? No, I'll refer to "Minneapolis 2040" or "Upzoning Corridors" generally as known policy experiments without citing specific p-values.
      *   *Constraint Check:* Did I avoid the cop-out? Yes, the ending will focus on specific empirical tests, not values.
      *   *Term Coining:* I'll introduce "The Permeability Gap" for the filtering issue and "The Stability/Exclusion Blur" for the character issue.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should mention specific economists.
      *   *Correction:* No, the prompt says "reason from common knowledge" and "no bibliography." Keep it conceptual.
      *   *Initial thought:* Make the agreed claims very strong.
