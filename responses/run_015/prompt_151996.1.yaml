prompt: |-
  I'm writing a term paper on the covering-law model versus the narrativist line in historiography -- the view that an account explains only if its premises contain some general law the event can be subsumed under, versus the view that what does the explaining is the emplotment itself, the way the events get gathered into one story with that outcome as the endpoint -- and I've ended up with an oddly concrete version of the problem. My advisor (call her Halloran) has been reading my one-page "why did X happen" sketches about the Duchy of Marren, 1861-1874, and ruling on each: explains, or doesn't. Her track record so far, on accounts of things from the same archive: (1) why the assembly ceded the Velm customs house in 1867 -- traced chain from debt service through the loan covenant to the division, plus one stated ceteris paribus generalization about assemblies that have just signed a customs covenant -- approved; (2) the same cession as a correctly dated list of thirty-eight true events in order -- rejected, "a chronicle"; (3) why the finance minister resigned in 1866 -- only his operative reasons, what he believed about the lender and what he thought he could still prevent, no generalization and no chain beyond deliberation -- approved, "that's what explaining an action is"; (4) a cross-polity regularity, thirty-three of forty-one principalities whose debt service passed twenty percent of revenue ceded some revenue source within five years, Marren's was twenty-four percent, so that's why -- rejected, "a rate isn't a reason"; (5) why the Marrenese press went docile after 1871 -- no law, and I'm honestly not sure I gave a mechanism, I gathered the licensing fee, the seizure of the Velm Gazette, and the editors' quiet self-censorship under the single description "the end of the old print coalition" and showed the docility as where that one thing was headed -- approved, "yes, that's what holding it together looks like"; (6) why the 1861 suffrage bill passed -- a followable trace, committee seat to draft text to vote trade to division, all documented, no generalization and no attempt to fit a pattern -- approved, "you can follow it."

  Next week I hand her Case 7, and I can't tell what she'll do with it. It's about why Marren ceded the Velm fort in 1874, and it's written backwards: it opens with the cession, then redescribes each earlier event by the role it plays relative to that outcome -- the 1870 loan as "the moment the treasury's hands were tied," the 1872 election as "the last point at which refusal was still possible," the poor 1873 harvest as "the hinge." Every sentence is documented and true; nothing is claimed about what caused what beyond those roles; no generalization is offered, and worse, in the forty Marrenese cases I've coded, assemblies with tied hands have usually fought rather than ceded, so there's no pattern in the archive that the redescription leans on. At each stage the participants themselves described what they were doing in totally different terms (renegotiating a loan, contesting a seat, managing a harvest). My roommate says Halloran isn't running any theory at all, just a "would you still ask why once you've read it" test, and by that test Case 7 obviously passes.

