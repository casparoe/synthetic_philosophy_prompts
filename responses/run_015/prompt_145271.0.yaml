  1. Hofstadter's own table, walls driven by the outside world, clumps forming and interacting. YES, obviously, he says, that's the whole point.
  2. The same table frozen: marbles superglued mid-bounce into an arrangement that reads like a sentence. NO.
  3. A recording table: clumps form a perfect diary of what the walls did, but nothing anywhere is ever sensitive to the diary. NO. His line is that a symbol nothing reads is just weather.
  4. A rock, plus a thick manual mapping its microstates onto symbol states and their transitions. NO, and he gets a bit offended — you can do that to anything.
  5. A room with a guy shuffling paper slips according to a rulebook, with no idea what any of it means. YES — the slips shove him around whether or not he understands a word.
  6. A clerk with a giant printed book of every addition problem and its answer, who looks up the answer and writes it down. YES — and this is the one I keep coming back to, because the book is completely passive and the clerk is outside it, and he still says the symbols are doing the shoving.
  7. A laptop simulating case 1. YES, though he gets hand-wavy about the substrate not mattering.
  8. Six seconds of turbulence in a pipe whose coarse-grained states happen, exactly once, to line up with the transition table of some algebra, and never again. NO. Once is a coincidence, not a level.

  He also flat out refuses the intervention test — you can't change the symbol without changing the marbles, so questions of the form "what if you wiggled the symbol while holding the substrate fixed" don't have answers, in his view. So don't build your answer on that.

