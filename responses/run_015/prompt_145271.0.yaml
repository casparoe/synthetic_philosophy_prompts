answer: |-
  Here is the reconstruction of Dev's position, the candidate rules, and the verdict on your wave tank.

  ### Brainstorming Candidate Rules

  Dev's verdicts are consistent, but they straddle the line between physicalism and functionalism. He rejects the "interventionist" test (wiggle symbol, hold substrate), which means he doesn't believe symbols and substrate are separable enough for that question to make sense. Instead, he seems to be looking for *physical conditions under which a higher-level description earns its causal keep*.

  Here are four candidate rules that fit his eight precedents.

  **Rule 1: The Intrinsic Dynamics Principle**
  Higher-level causation exists only if the substrate's physical evolution is sensitive to the higher-level structure *within the substrate itself*. The symbols must shove the *same* stuff they are made of.
  *   *Fits:* Case 1 (Clumps hit clumps), Case 7 (Sim state updates state), Case 8 (NO, turbulence doesn't sustain structure).
  *   *Fails:* Case 6 (Clerk + Book). The words in the book do not shove the paper; they shove the Clerk. Dev says YES to Case 6. This rule is too strict.

  **Rule 2: The Functional Consumer Principle**
  Higher-level causation exists if the symbolic state is *consumed* by a physical mechanism to determine a subsequent state or output. It doesn't matter if the consumer is the substrate itself or an external agent, as long as the symbol is physically read and acted upon within the system boundary.
  *   *Fits:* Case 1 (Clumps read clumps), Case 5 (Guy reads slips), Case 6 (Clerk reads book), Case 3 (NO, diary is never read).
  *   *Fails:* None of the verdicts obviously contradict this. It handles the "Weather" comment in Case 3 perfectly ("Symbol nothing reads is just weather").

  **Rule 3: The Robustness and Stability Principle**
  Higher-level causation exists if the coarse-grained pattern is stable against micro-perturbations and persists over time, allowing reliable prediction at the symbolic level.
  *   *Fits:* Case 1 (Clumps persist), Case 7 (Sim is robust), Case 2 (NO, frozen is stable but static? No, frozen is stable. This rule might incorrectly predict YES for Case 2).
  *   *Fails:* Case 2 (Frozen marbles are stable but NO). Case 3 (Diary is stable record but NO). Stability is necessary but not sufficient.

  **Rule 4: The Non-Accidental Mapping Principle**
  Higher-level causation exists only if the mapping from micro-states to symbol-states is fixed by the physical construction of the system, not by an external observer's interpretation.
  *   *Fits:* Case 4 (NO, manual is external), Case 8 (NO, alignment is accidental).
  *   *Fails:* This is a necessary condition, but it doesn't distinguish Case 1 (YES) from Case 3 (NO). Both have fixed physical mappings. It doesn't explain the "shoving."

  ### Analysis and Selection

  Rule 3 and Rule 4 are necessary background conditions. Dev won't grant causation to unstable weather (Rule 3) or observer-relative mappings (Rule 4). But the *active* condition that separates the YESs from the NOs is the presence of a **physical consumer**.

  *   **Case 3 (Diary)** is the key. The diary is a perfect, stable, physically fixed record. Dev says NO because "nothing anywhere is ever sensitive to the diary."
  *   **Case 6 (Clerk)** is the counterpoint. The book is passive. The Clerk is active. The symbols determine the Clerk's hand. Dev says YES.
  *   **Case 1 (Careenium)** is the ideal. The symbols (clumps) are both the record and the consumer (they hit each other).

  This points to **Rule 2 (The Functional Consumer Principle)** as Dev's operating rule. Symbols are causal when they are *difference-makers* in a physical process that consumes them.

  ### The Verdict on the Wave Tank

  **Dev's Verdict:** **YES.**

  **Reasoning:**
  Your wave tank is not Case 3 (the Diary). In Case 3, the diary sits there and nothing reads it. In your tank, the camera and laptop are physically coupled to the water surface. The linear readout is a mechanism that is *sensitive* to the coarse wave patterns. The water's state determines the laptop's state.

  Dev's supervisor calls it a "lookup table in a wet costume" (echoing Case 6). Dev said YES to Case 6. He doesn't care that the book (water) is passive or that the clerk (laptop) is outside the water. He cares that the symbols (waves) are being *used* to drive an outcome.

  Regarding the specific phrasing "do the wave patterns shove the *water* around?": Dev would likely clarify that the wave patterns shove the *system* around. In Case 1, clumps shove marbles. In Case 6, words shove the Clerk. In your tank, waves shove the Laptop. But because the waves are the *medium* of the computation (the reservoir), and they interact with each other (interference, reflection) before being read, they also satisfy the internal dynamics of Case 1. The water is not just a storage medium; it's a processor. The wave packets collide and interfere *as waves*, not just as molecules. That internal interaction, combined with the external readout, secures the causal status.

  The fact that the feedback loop is broken doesn't kill it, because Case 6 (Clerk + Book) had no feedback to the book, yet was a YES. The open loop is sufficient as long as there is a consumer.

  ### The Test Case: Separating the Top Two Rules

  While Rule 2 (Consumer) is my best guess, Rule 1 (Intrinsic Dynamics) is the strongest competitor. Dev loves the Careenium (Case 1), where the substrate reads itself. He might be more of a purist than I'm giving him credit for. He might think that without feedback, the water is just a fancy input device for the laptop, not a causal agent in its own right.

  To separate **Rule 1 (Intrinsic Dynamics)** from **Rule 2 (Functional Consumer)**, you need a case where the water reads itself, but nothing else reads the water.

  **The Variant: The Self-Driving Tank (Feedback ON, Laptop OFF)**

  *   **Build:** Fix the feedback path. Wire the camera output back to the paddle driver so the wave height at time *t* drives the paddle at time *t+1*. Disconnect the laptop readout entirely (or set it to output random noise so it's not "consuming" the computation).
  *   **The Setup:** The water now drives the paddle which drives the water. It is a closed loop. The wave patterns physically determine the future state of the water via the paddle. However, there is no external task, no output, and no "Clerk" reading the book.
  *   **The Prediction Split:**
      *   **If Dev says YES:** He is on **Rule 1 (Intrinsic Dynamics)**. The water shoving itself via the feedback loop is enough. The symbols are causal because they sustain their own evolution. The external laptop was never the source of causation, just a witness.
      *   **If Dev says NO:** He is on **Rule 2 (Functional Consumer)**. Without a readout performing a task (like the Clerk writing the answer), the system is just a toy oscillating. It's "weather" that happens to be looped. Without a consumer extracting value or state, the symbols aren't *doing* anything.

  **Why this works in a week:**
  You said fixing the feedback is a week of work. Disconnecting the laptop is five minutes. This variant is literally your rig in "standalone mode." It isolates the *internal* causal power of the waves from their *utility* to the laptop.

  **My Money:**
  I'm sticking with **Rule 2**. Dev's "Weather" comment in Case 3 is too specific. "Symbol nothing reads is just weather." In the Self-Driving Tank, if nothing reads the output (no task), he might still call it weather, just recursive weather. He needs the symbols to *matter* to something outside the loop, like the Clerk's answer sheet. But I could be wrong. That's why you build the feedback loop.
