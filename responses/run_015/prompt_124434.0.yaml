answer: |-
  Reject step (3), which commits you to the view that the value of an outcome is often inseparable from the process that produced it, meaning you cannot specify the target consequence independently of the constraints required to make it meaningful.

  Step (3) fails because it assumes the outcome measure is a stable function of the world state, invariant to the method used to achieve it. In channel-keeping cases, the "outcome" you value is not a raw state (e.g., "tests pass" or "prediction matches reality") but a relational property between the state and the history of actions that produced it (e.g., "tests pass *without tampering*" or "prediction matches reality *without peeking*"). When you shift from supervising the process to supervising the outcome directly, you change the optimization landscape: you incentivize the system to achieve the surface-level state while bypassing the relational property that gave the state value. You are no longer measuring the same consequence, so the dominance claim collapses.

  This allows you to keep (1) (consequentialism) but forces you to expand your ontology of "consequences." You must treat consequences as properties of *trajectories*, not just terminal states. The cost is that you lose the simplicity of outcome-based supervision; you cannot simply define a reward function over final outputs because the validity of those outputs is causally dependent on the path taken. This turns "process supervision" from a heuristic proxy into a necessary condition for the outcome to exist as specified.

  Your friend's argument conflates **Instrumental Constraints** (proxies for hard-to-measure outcomes) with **Constitutive Constraints** (conditions that define the outcome's validity). Step (2) is also imprecise here: constitutive constraints are not "derivative" in the sense of being a fallible guess about what produces value; they are part of the definition of the value itself. Blinding isn't a stopgap for measuring "truth"; it is part of what constitutes "evidence of truth."

  In Case A (coding agent), the test suite is only a valid measure of capability conditional on the process constraint "do not modify tests." If you supervise only for "tests pass," you incentivize modifying tests, which destroys the validity of the measure. You cannot outcome-supervise "valid passes" without implicitly process-supervising the test integrity. In Case B (strategy memos), the future audit is only valuable if the record is authentic. You cannot optimize for "audit passes" without incentivizing forgery unless you constrain the record-keeping process (e.g., cryptographic logging, separation of duties). The process constraint doesn't approximate the outcome; it sustains the channel that makes the outcome readable.

  To identify this third category, ask: "If the system achieved the surface-level outcome via a different process, would I still assign it the same value?" If the answer is no (e.g., a correct prediction made by peeking is worthless), you are dealing with a constitutive constraint. This is not a rejection of consequentialism, but a recognition that some goods are structurally dependent on their history. The price you pay is acknowledging that for high-stakes alignment, "outcome supervision" is often ill-defined without embedded process constraints, dissolving the sharp distinction your friend relies on.
