      *   **Constitutive vs. Derivative:** Distinguish between *instrumental* process constraints (heuristics for hard-to-measure outcomes) and *constitutive* process constraints (requirements for the outcome to count as the thing we value).
      *   **Keeping (1):** You can keep consequentialism. The consequence is "reliable knowledge" or "secure system". But "reliable knowledge" is not a state of the world independent of how it was generated. It is a property of the (world-state, generation-history) pair.
