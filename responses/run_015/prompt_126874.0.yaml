answer: |-
  Here is the ranking based on expected success rate on standard Bongard problems, scored out of 100.

  1.  **Generator-first (75/100):** Captures the constructive intent of the rule perfectly but trades off against a combinatorial explosion in searching for the correct program.
  2.  **Shape nouns (70/100):** Offers high human-aligned semantic compression for primitives but fails to express novel composites without inventing new nouns.
  3.  **Metric and proportion (55/100):** Enables precise quantitative rules but suffers from brittle thresholding that fails on qualitative categorical shifts.
  4.  **Relations only (45/100):** Critical for spatial logic but becomes meaningless without a prior object segmentation step to provide relata.
  5.  **Cross-figure deltas (40/100):** Directly optimizes for the classification task but lacks grounded features to explain *why* figures differ.
  6.  **Near-miss / defect (30/100):** Detects subtle imperfections well but requires a predefined notion of perfection to measure against.
  7.  **Negative space (25/100):** Reveals hidden background structures but is mathematically redundant if the foreground vocabulary is complete.
  8.  **Raw bitmap (5/100):** Provides lossless data retention but offers zero abstraction, leading to immediate overfitting on pixel noise.

  **Secretly the same:**
  **Shape nouns (2)** and **Negative space (6)** are duals; if your shape vocabulary is closed under complement, describing the ink is isomorphic to describing the void, differing only by a boolean inversion of the input mask.

  **Ninth Vocabulary:**
  **Compositional Part-Whole Hierarchy:** Describe figures as trees of sub-objects (e.g., "a triangle made of three circles") rather than single primitives or spatial relations, capturing recursive structure that neither shape nouns nor relations handle alone.

  **Ranking Flip:**
  If the problems were mostly about weird one-off shapes (textures, doodles, noise) instead of clean geometric families, **Raw bitmap (1)** would leapfrog **Relations (3)** and **Metrics (4)** because statistical texture becomes the rule, while **Generator-first (5)** would drop below **Shape nouns (2)** because generative regularity is less likely to exist in irregular forms.
