answer: |-
  The intake room was soundproofed and kept at a constant twenty-one degrees. Devrim sat behind the desk, the interface panel dark between him and Miriam. Her file floated on his private screen: thirty-four years old, diagnosis of progressive spinal atrophy, prognosis of total dependency within twenty-four months. She had selected Concordia. This was common for her profile. What was uncommon were the annotations flagged in red.

  Miriam sat with her hands folded on her knees. She did not look ill, yet the clock was ticking on her motor functions. She had requested a modification to the Concordia package. She wanted the substitution to include liability to error. She wanted the corrigibility monitor disabled.

  Devrim cleared his throat. "The engineering team confirms they can instantiate the error parameters. They can also isolate the monitor. The question is certification."

  "If they can build it, why can't I have it?" Miriam asked. Her voice was level.

  "Concordia is defined by the optimization of experience," Devrim said. "Distress is permitted only as a precursor to resolution. A genuine mistake, by definition, introduces net negative value that is not recovered. If you fail permanently, your welfare drops. If you regret the substitution permanently, your welfare drops. This violates the program's license."

  "A life without the possibility of failure isn't a life," Miriam said. "It's a playback. If I know I cannot truly lose, then winning means nothing. The value of an activity depends on the risk of failing at it. Remove the risk, and you remove the value."

  "You are conflating the texture of experience with the quality of welfare," Devrim said. "In Concordia, the feeling of accomplishment is generated directly. You will feel the satisfaction of success without the risk of ruin. Why is the causal history of that feeling relevant if the feeling itself is indistinguishable?"

  "Because I am not just a vessel for feelings," Miriam said. "I am an agent. An agent must be answerable to something outside herself. If the world is calibrated to my success, I am not interacting with a world. I am interacting with a mirror. I want the substitution to be a life, not a treatment."

  "The substitution is a shelter," Devrim said. "Your biological life is moving toward pain and dependence. Concordia offers a shape of life taken as a whole that is coherent and positive. Tribunal offers reality, but you rejected Tribunal. You chose Concordia."

  "I chose Concordia because I want peace, not because I want a lobotomy," Miriam said. "And the monitor. It terminates the substitution if my well-being falls below a threshold. If I am allowed to make mistakes, I might fall below that threshold. The monitor would delete me for living."

  "The monitor is a safety requirement," Devrim said. "It prevents sustained suffering. It is not negotiable."

  "If I cannot suffer, I cannot be saved," Miriam said. "You are saying a benefit I can neither detect nor endorse—being saved from my own choices—is good for me. That is paternalism disguised as care."

  "It is fiduciary duty," Devrim said. "You are hiring me to certify what is best for you. If I certify a program that allows you to enter a state of unrecoverable regret, I am certifying harm. The purpose of the clinic is welfare, not authenticity."

  "Authenticity is a component of welfare," Miriam said. "A safe lie is still a lie. If I wake up in the substitution and realize I cannot fail, the knowledge will poison the experience. I need the risk to be real."

  "The risk is real to you in the moment," Devrim said. "The knowledge that it is engineered does not appear in the experience stream. That is the technology."

  "The knowledge is in the contract," Miriam said. "I will know I signed it. Every success will be tainted by the knowledge that failure was impossible. I am asking you to make the impossibility possible."

  Devrim looked at the dark panel. He understood her position. He also understood the regulatory framework. To certify Concordia with error parameters was to certify a program that did not exist. To disable the monitor was to violate safety protocols designed to prevent neural scarring in the event of a crash. But he also understood that a life engineered to be flawless might be experienced as hollow, even if the hollowness was technically smoothed over by the software.

  He needed to file the memo. He needed to take a position.

  He turned to his terminal and began to type.

  ***

  **INTERNAL CERTIFICATION MEMO**

  **TO:** Regulatory Board, Substitution Licensing Division
  **FROM:** Devrim, Senior Counselor
  **DATE:** 14.11.2048
  **CLIENT:** Miriam V.
  **PROGRAM:** Concordia (Standard)
  **SUBJECT:** Certification of Program Suitability and Request for Variance

  **1. Overview**
  The client, Miriam V., has selected the Concordia program following a diagnosis of progressive spinal atrophy. The client requests two variances to the standard protocol: (a) the inclusion of liability to genuine error, loss, and unrecoverable regret within the substitution; and (b) the deactivation of the external corrigibility monitor.

  **2. Assessment of Variance Request (a): Liability to Error**
  The client argues that a life without the possibility of failure lacks agency and therefore lacks value. She contends that the quality of experience is dependent on the reality of the stakes.

  I deny this request.

  While I acknowledge the philosophical weight of the client's argument regarding agency, the Concordia program is licensed specifically to maximize subjective welfare. The introduction of genuine, unrecoverable error introduces the probability of net negative welfare states that cannot be resolved by the program's narrative architecture. The client's condition ensures that her biological alternative is a decline into dependence and pain. The purpose of the substitution is to provide a shape of life that is coherent and sustainable.

  To allow for genuine failure is to allow for the possibility that the substitution becomes worse than the biological alternative. My duty is to certify the program that is *best* for the client. A program that permits self-sabotage or unrecoverable regret is, by definition, suboptimal compared to one that ensures continuity of satisfaction. The value of an activity within the substitution is derived from the experience of the activity, not its metaphysical grounding in risk. To prioritize risk over welfare is to prioritize an abstract principle over the client's actual well-being.

  **3. Assessment of Variance Request (b): Corrigibility Monitor**
  The client argues that the monitor invalidates the risk she wishes to undertake and constitutes an unacceptable paternalistic override.

  I deny this request.

  The corrigibility monitor is a mandatory safety mechanism designed to prevent neural degradation in the event of system instability or catastrophic psychological collapse. It is not merely a welfare constraint; it is a medical safeguard. Disabling the monitor exposes the client to the risk of permanent neural injury should the substitution encounter a logical paradox or a state of distress beyond the system's capacity to modulate.

  Furthermore, the client's desire to be "answerable to something outside herself" is addressed by the Tribunal program, which she rejected. Having chosen Concordia, the client has elected a program designed for internal coherence rather than external answerability. To modify Concordia to mimic the risks of reality while retaining the safety of simulation is to create a hybrid that satisfies neither function. It exposes the client to the pain of failure without the causal efficacy of real action.

  **4. Conclusion**
  I certify that the standard Concordia program is the one best for the client. The requested variances are contraindicated. They introduce risks that outweigh the benefits of authenticity, given the client's medical prognosis. The client has been informed of this decision. She may proceed with standard Concordia, select a different program, or withdraw her application.

  **Signature:**
  Devrim
  Counselor ID: 8940-K

  ***

  Devrim stopped typing. The cursor blinked at the end of the signature line. He read the memo again. It was sound. It was defensible. It protected the clinic and it protected Miriam from herself.

  He looked across the desk. Miriam was watching him. She had not moved. She knew what he was writing. She knew the answer before he had typed the first word.

  "If I sign this," Devrim said, "you can proceed. But it will be standard Concordia. No errors. No monitor override."

  "Then it isn't my life," Miriam said.

  "It is a life where you do not suffer," Devrim said. "That is the metric we use."

  "Whose metric?"

  "Ours. The ones who want you to be okay."

  Miriam nodded slowly. She did not look angry. She looked tired. "You say I am answerable to nothing outside myself. But you are answerable to the Board. I am answerable to you. And you are answerable to a definition of 'good' that I do not share."

  "I am answerable to your welfare," Devrim said.

  "You are answerable to a graph," Miriam said. "A line that doesn't go down."

  She stood up. Her movement was precise, conserving energy. "I need to think."

  "You have forty-eight hours before the biological window narrows," Devrim said.

  "I know."

  She walked to the door. She did not look back. Devrim watched the door close. He looked back at the screen. The memo waited for his final authorization code.

  He hovered his finger over the sensor. He thought about the definition of welfare. He thought about the monitor, watching her neural state like a guard dog, ready to kill the dream if the dreamer frowned too long. He thought about the errors he had made in his own life, the ones that had carved him into his current shape. He thought about whether he would trade them for a smooth line.

  He did not know if he was protecting her or confining her. He did not know if the value lay in the safety or the risk. He only knew that he had to choose, and that the choice would stand regardless of whether it was right.

  He pressed his thumb to the sensor. The file transmitted. The screen went dark. He sat in the quiet room and waited for the next client.
