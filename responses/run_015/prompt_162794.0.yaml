  {
    "real_tensions": [
      {
        "ids": ["2", "1"],
        "severity": 1,
        "mechanism": "what each commitment commits me to, and exactly why those two commitments collide",
        "cheapest_fix": "the least costly revision that removes the tension",
        "cost": "what I lose or have to accept if I make that revision"
      }
    ],
    "apparent_tensions": [
      {
        "ids": ["5", "1"],
        "why_it_looks_bad": "the one-sentence case for thinking these conflict",
        "why_it_dissolves": "the move or distinction that makes the conflict go away",
        "residue": "what the dissolution still costs me, if anything"
      }
