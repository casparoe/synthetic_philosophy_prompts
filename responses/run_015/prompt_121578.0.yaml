      *   *Standard Paradox:* Popper's idea that unlimited tolerance leads to the destruction of tolerance. Usually applied to speech codes or banning hate groups.
      *   *Institutional Twist:* Here, it's not about *banning* speech, but *funding* it. Does public money imply endorsement? If the state funds the display of intolerance without context, does it become complicit?
      *   *Curatorial Silence:* The applicants argue silence is neutral. Opponents argue silence is complicity. In a museum/plaza context, selection *is* interpretation. To display without context is to contextually imply legitimacy or at least historical weight without the counter-weight of moral judgment.
      *   *Hermeneutic Hospitality:* This is a strong philosophical claim. It suggests that understanding requires letting the "other" speak fully. Redaction is seen as violence.
      *   *The Middle Ground:* Can we fund the *preservation* without funding the *display*? Or can we fund the display with *minimal* framing that respects the text but protects the public sphere?
      *   *Decision:* The most ethically robust path for a public board is likely "Approval with Binding Conditions." It acknowledges the artistic merit and historical value but mitigates the harm of unmediated intolerance in a public square funded by taxpayers. It respects the art while fulfilling the fiduciary/ethical duty to the community.

  3.  **Drafting the Memo - Structure & Tone:**
