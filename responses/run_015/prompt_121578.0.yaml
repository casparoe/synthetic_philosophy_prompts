      *   *The Synthesis/Decision:* Why "Approval with Conditions"? Because rejecting it outright stifles historical inquiry and artistic risk. Approving it outright ignores public harm. Conditions allow the art to exist but ensure the *civic* contract is met. The condition must address the "silence." A single, neutral entry point plaque might satisfy the board without violating the art's integrity too much. Or, perhaps, a "companion space" for response. Let's go with a "Contextual Threshold"—a minimal framing at the perimeter that doesn't annotate specific texts but frames the *project* itself.
