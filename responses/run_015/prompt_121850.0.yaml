answer: |-
  **Project Title:** Option Fragility and the Reduction of Republican Liberty

  **Project Description and Statement of the Question**
  The standard typology of liberty, originating with Isaiah Berlin, distinguishes negative liberty (absence of interference) from positive liberty (self-mastery). Philip Pettit's republican revision introduced a third category: non-domination. It is settled in the literature that non-domination differs from negative liberty in cases of benevolent mastery, where an agent suffers no actual interference but remains subject to arbitrary power. However, it remains genuinely contested among specialists whether non-domination is fundamentally a modal property of options (a robustness condition) or an irreducible normative status between agents.

  This project investigates a specific reduction problem: Is republican liberty reducible to negative liberty combined with a robustness condition against what I term "option fragility"? An option is fragile if it remains non-interfered with and non-dominated in the strict Pettitian sense, yet remains unstable across counterfactual shifts in others' preferences, beliefs, or institutional priorities. For example, a worker may have contractual protections (negative liberty) and no manager with arbitrary firing power (republican liberty), yet their employment option might vanish if corporate priorities shift due to market forces unrelated to arbitrary power.

  The central research question is: Does the fragility condition capture everything Pettit means by non-domination, or does domination involve a relational element—perhaps a shared awareness of arbitrary power—that fragility alone cannot express? If non-domination reduces to negative liberty plus robustness against fragility, the trichotomy collapses into a binary. If it does not, there exists a distinct normative dimension of liberty currently unaccounted for.

  **Methodology**
  The project employs conceptual analysis through constructed institutional scenarios. I will isolate variables of interference, arbitrary power, and option stability to test the extensions of negative and republican liberty.

  Two primary scenarios will anchor the analysis:
  1.  **The Protected Worker:** An employee with strong contractual protections against firing (high negative liberty) but no grievance procedure to challenge managerial discretion. Here, interference is low, but fragility is high regarding future managerial interpretations.
  2.  **The Monitored Worker:** An employee with a robust grievance procedure (low fragility regarding outcomes) but subject to arbitrary oversight power that is rarely exercised. Here, republican liberty is low, but option stability might appear high.

  By varying the counterfactual conditions in these cases, I will determine whether intuitions about liberty track the presence of arbitrary power (Pettit's view) or the stability of the option itself (the fragility hypothesis). I will distinguish settled definitions of interference and domination from the contested interpretation of whether domination is purely modal. The analysis will avoid assuming a consensus on the modal account, treating it as a live hypothesis to be tested.

  **Work Plan (12 Months)**
  *   **Months 1–3:** Refine the definition of "option fragility." Distinguish it clearly from Pettit's "arbitrariness" and Berlin's "interference." Complete targeted literature review on modal accounts of liberty.
  *   **Months 4–6:** Construct and test institutional scenarios. Draft detailed case descriptions and solicit feedback from colleagues to check for intuitive consistency.
  *   **Months 7–9:** Draft the core argument. Determine whether the evidence supports reductionism or irreducibility. Write the first full draft of the dissertation chapter.
  *   **Months 10–12:** Revise based on advisor feedback. Prepare a journal article version of the core argument for submission. Finalize the chapter for dissertation inclusion.

  **Success and Failure Conditions**
  A successful result will take one of two forms. First, a reduction argument demonstrating that republican liberty is analytically equivalent to negative liberty plus a specific robustness condition against fragility. Second, a defense of irreducibility showing that fragility fails to capture the normative significance of the master-slave relation, thereby vindicating Pettit's status-based account against modal reductions.

  Failure would occur if the "fragility" condition proves incoherent—for example, if it collapses into a demand for positive liberty (resource provision) rather than option stability. Failure would also result if every constructed scenario collapses into a single category, rendering the distinction between fragility and domination indiscernible.

  **Scope Assessment**
  This project is tractable within one year because it limits scope to conceptual analysis rather than empirical study or historical exegesis. The primary risk lies in the definitional phase (Months 1–3). If "fragility" cannot be sharply distinguished from existing modal accounts of non-domination, the project loses its novelty. To mitigate this, I will focus strictly on counterfactual shifts in *institutional priorities* rather than agent capacities, which distinguishes this work from standard interpretations of Pettit. The month-by-month plan allocates sufficient time for this definitional precision before moving to argument construction. The deliverable is a single, rigorous dissertation chapter and one article manuscript, which is appropriate for a one-year fellowship.
