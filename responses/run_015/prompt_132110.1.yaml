  **MEMORANDUM**

  **TO:** Campus Public History Board
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Old Science Wing Exhibit Proposal

  **Recommendation**
  I recommend the Board approve a **hybridization of the two submitted proposals**, integrating the 1987 flood oral histories (Proposal A) with the 400-year riverbed geology archive (Proposal B). While both standalone proposals have merit, neither fully satisfies the Board's mission to produce public history that is both accessible and intellectually rigorous. A hybrid model allows us to demonstrate how deep structural forces reshape our understanding of human events—a concept critical to contemporary historical interpretation.

  **Rationale: The Case for Integration**
  The core strength of Proposal A (Oral Histories) lies in its immediate human resonance. Rescue stories and narratives of heroism guarantee visitor engagement. In public history, emotional connection is the primary driver of attendance and retention. To argue against this is to ignore the reality of museum traffic: visitors come to see themselves in the past. A pure geology exhibit (Proposal B) risks alienating this audience by removing the human stake entirely.

  However, Proposal A alone risks presenting the 1987 flood as an anomaly—a singular disaster overcome by individual bravery. This is where Proposal B becomes essential. The 400-year sediment and climate archive provides the *longue durée* context necessary to reframe the event. 

  This integration relies on a specific analytical framework: **retroactive structural causation**. This concept suggests that slow geographic shifts do not merely cause events but actively rewrite what those events *mean* in hindsight. In 1987, the flood meant "unexpected disaster" and "human triumph." Viewed through the 400-year geological archive, the meaning shifts: the flood becomes a predictable structural inevitability, and the "heroism" is recontextualized as humanity negotiating with a landscape that was always going to behave this way. 

  Without the geology, the oral histories are just drama. Without the oral histories, the geology is just data. Together, they show how the structure changes the story.

  **Addressing the Counterargument**
  The strongest argument against this hybrid approach—and the strongest argument for funding Proposal A exclusively—is **accessibility**. Curating a geology archive requires specialized interpretive labor to make it legible to a general audience. There is a valid concern that blending the two could dilute the emotional impact of the rescue stories or overwhelm visitors with scientific data. 

  Proponents of the oral history-only model argue that public history should prioritize memory and community healing over environmental determinism. They are correct that community memory is vital. However, granting the oral histories standalone status risks cementing a myth of human exceptionalism over nature. By integrating the geological data, we do not diminish the rescue stories; we deepen them. We ask visitors to understand that the neighbors they hear about were not just fighting water, but navigating centuries of sedimentation and climate shift. This adds gravity rather than removing emotion.

  **Implementation Plan & Budget**
  To execute this hybrid model effectively, we require a phased timeline that prioritizes interpretive design. We cannot simply place core samples next to audio players; the connection must be curated.

  **Timeline**
  *   **Decision Deadline:** Next Thursday, October 31
  *   **Curatorial Team Assembly:** November – December (Must include one geologist, one oral historian, one design lead)
  *   **Interpretive Development:** January – March (Focus on linking specific flood stories to specific geological strata)
  *   **Installation:** April – August (Summer window for minimal campus disruption)
  *   **Public Launch:** September 15 (Start of Fall Semester)

  **Budget Frame ($48,500 Total)**
  *   **Curatorial Stipends (3 leads):** $15,000
  *   **Interpretive Design & Graphics:** $18,000 (Critical for translating geological data visually)
  *   **Audio/Visual Installation:** $10,000
  *   **Programming/Opening Event:** $5,500
  *   **Contingency (5%):** $2,425

  **Conclusion**
  Funding the oral histories alone is the safer bet for attendance, but funding the geology alone is the safer bet for academic rigor. The hybrid model is the only option that fulfills our mandate to challenge public understanding of history. It allows us to show that the 1987 flood was not an interruption of normalcy, but a revelation of the underlying structure. I urge the Board to vote for the integrated proposal.

  **Action Required**
  Vote to approve the Hybrid Exhibit Model with the budget frame outlined above by next Thursday's meeting.
