answer: |-
  This is a sophisticated debate that touches on meta-ethics, philosophy of history, and political symbolism. Your group has inadvertently recreated a classic academic clash between **historical contextualism** (Leo) and **moral universalism** (Priya).

  Here is an adjudication of each move, a specific breakdown of Leo's "epistemic dominance" claim, and a final verdict on who is more right.

  ### Round 1: The "Man-of-His-Time" Defense
  **Leo:** Moral frameworks evolve like technology (Victorian surgeon analogy).
  **Priya:** Moral dissent existed contemporaneously (abolitionists/anti-colonialists).

  **Adjudication:** **Priya wins this round.**
  Leo's surgeon analogy commits a category error. Scientific knowledge (antibiotics) is cumulative and often inaccessible without specific technological breakthroughs. Moral knowledge is discursive; it relies on argument, empathy, and witness.
  *   **The Flaw in Leo:** There were people condemning slavery during Jefferson's time and colonization during Columbus's time. The "moral truth" was not hidden; it was suppressed.
  *   **The Strength of Priya:** She identifies that "ignorance" was often a choice. If a counter-argument existed in the public sphere and the historical figure dismissed it to maintain power or profit, the "man-of-his-time" defense collapses.

  ### Round 2: Institutional Moral Debt (Nodes vs. Bricks)
  **Leo:** Individuals are nodes in a structure; blaming Columbus ignores the systemic incentives.
  **Priya:** If everyone is just a node, no one is ever accountable for systemic harm.

  **Adjudication:** **Leo identifies the mechanism, but Priya identifies the ethical consequence.**
  Leo is sociologically correct: atrocities are usually systemic. However, Priya is ethically correct: systems do not act; people do.
  *   **The Nuance:** Statues are not history textbooks; they are honorifics. They elevate specific *individuals* to represent values. If the system was horrific, and the individual was a key node enforcing it, removing the statue is not saying "he built the whole wall alone," it is saying "this brick was load-bearing and toxic."
  *   **The Risk:** Leo's argument risks "diffusion of responsibility," a psychological phenomenon where individuals feel less responsible for harm because they were part of a group. Priya correctly spots that this logic makes accountability impossible.

  ### Round 3: Epistemic Dominance (The Symmetry Argument)
  **Leo:** Future generations (2124) will condemn us (factory farming, LLMs). Our certainty is just because we are later.
  **Priya:** There is a gap between *not knowing* and *not wanting to know* (willful ignorance).

  **Adjudication:** **This is the crux of your specific question.**

  **Is Leo's point "fancy dressing" or a real problem?**
  It is a **real philosophical problem**, but Leo is misapplying it.
  *   **The Real Problem:** Leo is invoking **Moral Fallibilism**. He is correct that we likely participate in harms we cannot yet see (e.g., how future generations might view our treatment of AI, the environment, or global labor chains). We do possess "epistemic dominance" simply by being later in time.
  *   **The Misapplication:** Leo uses this to suggest that because we *might* be wrong about something, we cannot be *sure* about anything. This is a form of skepticism that leads to paralysis.
  *   **Why Priya Counters It:** She introduces the concept of **Culpable Ignorance**. Even if we are blind to *some* things, we are not blind to *all* things. We know factory farming causes suffering, even if we debate its necessity. Churchill knew about the Bengal famine; he chose to prioritize the war effort over relief. That isn't epistemic blindness; it's a calculation of value.

  **Verdict on Leo's Move:** It is not just dressing; it is a valid warning against moral arrogance. However, it does not successfully defend the statues. The fact that 2124 might judge us does not mean 2024 cannot judge 1940. Moral progress, while not linear, is real. We *do* know more about human rights now than Churchill did, because people like Priya's "abolitionists" fought to make that knowledge mainstream.

  ### Overall Verdict: Who is more right?

  **Priya is more right.**

  Here is why:
  1.  **Agency vs. Determinism:** Leo's arguments consistently lean toward determinism (we are nodes, we are products of our time, we are blind to our era). Priya consistently defends agency (people chose to ignore critics, people choose to maintain systems). History requires agency to make sense.
  2.  **The Function of Statues:** Leo treats statues as historical records (which should be nuanced). Priya treats statues as civic honorifics (which assert current values). Tearing down a statue is not erasing history; it is updating the values a community chooses to honor. Priya understands the symbolic function better.
  3.  **The "Future Judgment" Trap:** Leo's symmetry argument is a "tu quoque" (you too). Even if future generations condemn us for LLMs, that does not absolve Churchill of the Bengal famine. Two wrongs (or potential future wrongs) do not make a past wrong right.

  **Where Leo has a point:**
  Leo is right that we should be humble. We should acknowledge that tearing down a statue doesn't fix the systemic "wall" he mentioned. If the goal is justice, removing a statue is symbolic, not structural.

  **Final Adjudication for your Group:**
  Tell them this:
  *   **Leo** wins on **Historical Methodology**: We must understand figures in their context to learn history accurately.
  *   **Priya** wins on **Political Ethics**: We judge figures by our current values to decide who belongs in our public squares.

  Leo's "epistemic dominance" point is a valid philosophical caution against arrogance, but it is not a valid shield against accountability. We can acknowledge that 2124 might judge us while still confidently judging that colonialism was harmful. Priya's distinction between *innocent ignorance* and *willful dismissal* is the knife that cuts through Leo's symmetry argument.

  **Recommendation:** The statues aren't about the past; they're about who we want to be now. Priya's framework allows for that choice; Leo's framework suggests we are trapped by our time.
