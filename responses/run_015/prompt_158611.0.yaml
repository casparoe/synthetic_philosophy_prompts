answer: |-
  **Mental Brainstorm & Step-by-Step Plan**

  1.  **Core Tension:** Dewey says democracy is social inquiry. Inquiry in *Logic: The Theory of Inquiry* involves testing hypotheses against resistance. But in *The Public and Its Problems*, it sounds more like communal sharing. Does the "testing" part require institutionalized opposition?
  2.  **The "Negative Control" Analogy:** In science, a negative control ensures results aren't artifacts. In democracy, does this mean we need built-in adversaries? Or does that turn politics into war?
  3.  **The Gap:** Current scholarship (Bohman, Festenstein) focuses on communication conditions. Few focus on *structural friction* as a logical requirement.
  4.  **Argument Path:**
      *   Step 1: Define "inquiry" strictly (not just thinking, but resolving an indeterminate situation).
      *   Step 2: Ask if resolution is possible without attempted falsification.
      *   Step 3: Apply to citizens' assemblies. If they lack counter-evidence mechanisms, are they just echo chambers?
      *   Step 4: Conclude whether this is internal to Dewey or an external imposition.
  5.  **Failure Mode:** If Dewey's "inquiry" is just a metaphor for "getting along," then the whole project collapses. I need to admit that risk.
  6.  **Tone:** Professional but conversational. Like I'm talking to a colleague over coffee, not submitting to a rigid grant board. A few casual phrases, maybe a missing comma.

  ***

  **Fellowship Proposal: The Logic of Friction**

  **Project Title:** Negative Controls in Democratic Inquiry: Is Engineered Friction Internal to Deweyan Democracy?

  **Principal Investigator:** [Your Name]
  **Duration:** 12 Months
  **Request:** Conceptual Research Fellowship

  **1. The Precise Question**
  John Dewey famously frames democracy as a form of social inquiry. The standard reading of this is normative and attitudinal: citizens should be open-minded, fallibilist, and willing to listen. It's about *virtue*. I want to push past the virtue ethics reading to the institutional logic. If democracy is genuinely analogous to scientific inquiry (as Dewey suggests in *Logic: The Theory of Inquiry*), does it require specific institutional designs that mimic experimental controls?

  Specifically: Do micro-deliberative bodies (like citizens' assemblies or participatory budgeting committees) need built-in "negative controls"—adversarial framing, deliberately introduced counter-evidence, or structured opposition—for their outcomes to count as *warranted assertibilities*? Or is importing this lab-science structure a category error that kills the cooperative spirit Dewey actually wanted?

  **2. The Gap in Existing Scholarship**
  Most Deweyan scholarship collapses "inquiry" into generic deliberation. The argument usually goes: if people talk freely under ideal conditions, truth emerges. Others treat inquiry as individual problem-solving scaled up—just more brains thinking together.

  Neither account specifies whether collective inquiry needs *engineered friction* to be legitimate. We assume consensus is the goal. But in experimental logic, consensus without falsification is just bias confirmation. There's a missing link here between Dewey's technical definition of inquiry (resolving an indeterminate situation) and the actual design of democratic mini-publics. Nobody is asking if the *absence* of adversarial controls makes a citizens' assembly undemocratic in the Deweyan sense.

  **3. Methodology: Conceptual Reconstruction**
  This is a purely conceptual project. I'm not running assemblies or doing empirical fieldwork. The work is textual reconstruction and normative argumentation.

  *   **Phase 1: Reconstructing Inquiry.** I'll dig into *Logic: The Theory of Inquiry* to strip away the metaphor. What are the necessary conditions for a judgment to be "warranted"? Is resistance/falsification a necessary condition, or just a helpful heuristic?
  *   **Phase 2: The Institutional Translation.** I'll map those logical conditions onto institutional features. If inquiry requires testing, what does "testing" look like in a policy context? Is it a devil's advocate? A red team? Or is it something softer?
  *   **Phase 3: The Normative Test.** I'll argue whether these controls are *internal* to Deweyan democracy (i.e., you aren't doing democracy without them) or if they are an external imposition from positivist science that Dewey would reject.

  **4. Expected Outcomes & Success Conditions**
  Success looks like a clear framework that settles the "negative control" question.
  *   **Outcome A:** I argue that negative controls are internal. This implies current deliberative designs are logically flawed because they prioritize harmony over testing.
  *   **Outcome B:** I argue they are external. This implies Dewey's "inquiry" is distinct from scientific method in a way scholars have missed, relying on cooperative reconstruction rather than falsification.

  **Honest Failure Conditions:**
  I need to be real about the risks. The biggest risk is that Dewey's use of "inquiry" is ultimately metaphorical when applied to politics. If I find that the logic of scientific inquiry *cannot* be translated to social values without doing violence to the concept, the project fails to produce a design theory. It would instead produce a critique of Dewey's own analogy. That's still a result, but it's not the one I'm hoping for. Another failure mode: getting stuck in the weeds of *Logic* and losing the democratic theory thread. I'll keep a check on that by forcing myself to write policy-memo style summaries every quarter.

  **5. Timeline (12 Months)**

  *   **Months 1-3: The Logic Deep Dive.** Close reading of *Logic: The Theory of Inquiry*. Annotating sections on "judgment," "testing," and "warrant." Drafting a paper on "What counts as resistance in social inquiry?"
  *   **Months 4-6: Institutional Mapping.** Looking at current citizens' assembly designs (OECD guidelines, etc.) and comparing them against the logical requirements found in Q1. Where are the gaps?
  *   **Months 7-9: The Normative Argument.** Writing the core article. Arguing for or against the necessity of engineered friction. This is where I tackle the "lab science import" objection.
  *   **Months 10-12: Revision & Dissemination.** Polishing the manuscript for submission (thinking *Journal of Political Philosophy* or *Contemporary Pragmatism*). Presenting findings at a pragmatist circle workshop.

  **6. Why This Matters**
  We're seeing a boom in deliberative democracy tools. Governments are spending money on citizens' assemblies. If these bodies are designed to reach consensus without structured testing, they might be producing "warranted" judgments that are actually just groupthink. If Dewey is right that democracy is inquiry, we owe it to the logic to get the experimental design right. Otherwise, we're just holding nice meetings.

  I think there's something real here about the need for friction. Not conflict for conflict's sake, but the kind of resistance that lets you know you've actually solved a problem rather than just talked about it. Lets see if Dewey backs that up.
