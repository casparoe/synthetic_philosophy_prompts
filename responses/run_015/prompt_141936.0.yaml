answer: |-
  # The Constructivist Decision Tree (For the Classically Trained)

  **Instructions:** Read each claim. If you are willing to **assert and prove** it in your foundational system, go **YES**. If you must **reject or restrict** it, go **NO**. Do not answer based on what you think is "standard," but on what you believe is *true*.

  ---

  ### Q1: The Law of Excluded Middle (LEM)
  **Claim:** "For any well-formed proposition $P$ regarding infinite totalities (e.g., 'There is a run of 100 7s in $\pi$'), the statement $P \lor \neg P$ is valid."
  *   **YES:** → Go to **Q2 (The Ecumenical)**
  *   **NO:** → Go to **Q3 (The Revisionist)**

  ### Q2: The Metatheoretic Leak
  **Claim:** "It is permissible to use classical logic (LEM) in the *metatheory* to prove the consistency or normalization of my system, even if LEM is restricted inside it."
  *   **YES:** → **Leaf: The Ecumenical / Proof-Miner.** (You view constructive math as a subsystem of classical math. You want witnesses, not revolution. *Note: This is where 'Leaky Metatheory' lives. It's not a distinct school, it's standard practice for this leaf.*)
  *   **NO:** → **Leaf: Strict Classical Purist.** (You demand classical logic everywhere or nowhere. Coherent, but you're not a constructivist.)

  ### Q3: Markov's Principle
  **Claim:** "If it is impossible for a search for a number $n$ satisfying a decidable property $P(n)$ to run forever ($\neg\neg \exists n P(n)$), then the search terminates ($\exists n P(n)$)."
  *   **YES:** → **Leaf: Russian/Recursive Constructivism.** (You identify math with algorithmic computability. You accept Markov's Principle. *Warning: You must reject Brouwer's Continuity Principle.*)
  *   **NO:** → Go to **Q4 (The Continuum)**

  ### Q4: The Continuity Principle
  **Claim:** "Every total function $f: [0,1] \to \mathbb{R}$ is uniformly continuous."
  *   **YES:** → **Leaf: Brouwerian Intuitionism.** (You view the continuum as a medium of free choice sequences, not a set of points. You likely reject Q2 as well. *Note: If you also answered NO to Q2, you are a Purist Intuitionist.*)
  *   **NO:** → Go to **Q5 (Choice & Extensionality)**

  ### Q5: Choice and Extensionality
  **Claim:** "I accept the full Axiom of Choice ($\forall x \exists y \to \exists f \forall x$) **AND** I treat sets as extensional (determined solely by their members)."
  *   **YES:** → **Leaf: The Diaconescu Collapse.** (**Incoherent Region.** In constructive set theory, Full AC + Extensionality implies LEM. You accidentally became a Classical Purist. To stay constructive, you must drop Extensionality [go to MLTT] or restrict Choice [go to Bishop].)
  *   **NO:** → Go to **Q6 (Types vs. Sets)**

  ### Q6: Intensionality
  **Claim:** "I resolve the Choice problem by treating objects as Types/Programs (intensional) rather than Extensional Sets."
  *   **YES:** → **Leaf: Martin-Löf Type Theory.** (You accept AC because functions are lambda terms. You reject Extensional Equality as primitive. *Note: Object-level assertions often overlap with Bishop.*)
  *   **NO:** → **Leaf: Bishop-Style Constructivism.** (You work with sets, restrict AC to Countable Choice, and avoid the Diaconescu trap. You are the pragmatic majority.)

  ### Q7: Predicativity
  **Claim:** "I can define a subset of $\mathbb{N}$ by quantifying over the totality of *all* subsets of $\mathbb{N}$."
  *   **YES:** → (You remain in your current leaf: Bishop, MLTT, or Russian).
  *   **NO:** → **Leaf: Predicativism (Weyl/Feferman).** (You view $\mathbb{N}$ as a finished totality, but $\mathcal{P}(\mathbb{N})$ is not. You reject impredicative definitions. *Note: This cuts across the other schools.*)

  ---

  ### The "Feasibility" Branch (Strict Finitism)
  *Insert this check at any point:*
  **Claim:** "A number $n$ exists even if computing it requires more steps than there are particles in the universe."
  *   **NO:** → **Leaf: Strict Finitism.** (**The Lonely Leaf.**) This is your "Feasibility Requirement." It collapses into strict finitism. Very few occupy this; it kills induction. Coherent but mathematically paralyzing.

  ---

  ### Analysis of the Space

  **1. The Indistinguishable Twins (Bishop vs. MLTT vs. Dummett)**
  Your questions cannot cleanly separate **Bishop**, **Martin-Löf (MLTT)**, and **Dummett** on *mathematical assertions* alone.
  *   **Bishop vs. MLTT:** They agree on almost all theorems (e.g., both reject LEM, both reject full continuity). The split is ontological (Sets vs. Types), not assertional. I separated them in Q6, but admit this is foundational preference, not logical divergence.
  *   **Dummett:** Dummett's "meaning-theoretic" route justifies the *logic* (Intuitionism) but doesn't necessarily change the *theorems* from Bishop. He lands in the Bishop/Brouwer cluster depending on his stance on Metatheory (Q2). I have grouped him with the Revisionists, but note that his contribution is philosophical justification, not a distinct mathematical corpus.

  **2. The Empty Rooms (Incoherent Regions)**
  *   **The Diaconescu Trap (Q5 YES):** As noted, Full Choice + Extensional Sets = LEM. Anyone landing here has unknowingly reverted to Classical Math. This is a **real logical fault line**, not an accident.
  *   **Brouwer + Markov:** You cannot assert "All functions are continuous" (Brouwer) and "Not-not-halts implies halts" (Markov/Russian). These are logically incompatible. The tree prevents this collision.

  **3. The "Leaky Metatheory" (Q2)**
  You asked if this is a separate position. The tree reveals it is the primary splitter between **Brouwer** (No Leak) and **Bishop** (Leak Allowed).
  *   **Brouwer:** Demands the metatheory be as constructive as the object theory.
  *   **Bishop/MLTT:** Cheerfully use ZFC to prove MLTT is sound.
  *   **Verdict:** It is not a "school," but it is the **pragmatic fault line** that determines whether you are doing *philosophy of math* (Brouwer) or *mathematics* (Bishop).

  **4. Real Fault Lines vs. Historical Accidents**
  *   **Real Fault Line:** LEM (Q1). This divides the world.
  *   **Real Fault Line:** Markov's Principle (Q3). This divides the Intuitionists from the Russians.
  *   **Historical Accident:** Bishop vs. MLTT. This is largely a dispute over *language* (Set theory vs. Type theory) rather than *truth*. They occupy the same logical region.
  *   **Historical Accident:** Dummett. He provides the semantics for the Bishop/Brouwer logic but doesn't inhabit a distinct mathematical leaf.

  ### How to Read Your Path
  1.  **The Big Sort:** **Q1 (LEM)** does 90% of the sorting work. It separates the Classical/Ecumenical from the Constructive.
  2.  **The Pragmatic Sort:** **Q2 (Metatheory)** separates the Philosophers (Brouwer/Dummett) from the Working Mathematicians (Bishop/MLTT).
  3.  **The Technical Sort:** **Q5 (Choice/Extensionality)** is the trap door. If you want Choice, you must pay the price of Intensionality (Types) or restrict your Set Theory.

  **Final Advice:** If you find yourself in the **Bishop** leaf, you are in good company. It is the "unnamed" leaf that most working constructivists actually inhabit: classical metatheory, no LEM, countable choice, no continuity principle. It is the region of maximum mathematical power with minimum ontological commitment.
