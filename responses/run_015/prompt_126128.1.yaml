answer: |-
  You have carved out a genuine conceptual gap. The literature on precommitment (Elster, Schelling, Thaler & Sunstein) is obsessed with the *formation* of the bond (is it credible?) and the *maintenance* of the bond (do we break it?), but it largely assumes a static mapping between the *Constraint* and the *Temptation*.

  You are describing a dynamic where the Constraint remains rigid, the *verbal justification* remains rigid, but the *causal mapping* between the two drifts until they no longer touch. The constraint becomes a "free-floating signifier" of discipline that attaches itself to whatever is nearby, while the original sin finds a new exit.

  There is no single canonical term for this. "Goal Displacement" is the closest ancestor, but as you noted, it implies the *means* become the *end*. In your cases, the means (the rule) is still treated as a means, just for a different end than the one advertised. "Goodhart's Law" fails because the metric isn't corrupted; it's just irrelevant. "Path Dependence" explains the stickiness, not the migration of the bite.

  I propose we call this **Precommitment Drift**.

  Here is the carving you asked for: the necessary and sufficient conditions, the boundaries, and the answers to your specific test cases.

  ### The Carving: Precommitment Drift

  **Precommitment Drift** occurs when a self-imposed constraint satisfies four conditions simultaneously:

  1.  **Formal Persistence:** The rule remains on the books, formally unamended, and is procedurally enforced.
  2.  **Legitimacy Retention:** The actors subject to the rule continue to cite the *original* justification (the "Ulysses" reason) as the source of the rule's legitimacy, even if they no longer feel the original temptation.
  3.  **Causal Decoupling:** The constraint no longer causally impedes the original target behavior (usually because a workaround has been normalized).
  4.  **Incidental Capture:** The constraint imposes non-trivial costs on a *different* behavior or set of agents than originally intended, which lacks the workaround available to the original target.

  The core phenomenon is not that the rule failed, but that the **ecology of the system changed around the rule**, and the rule proved more adaptable in its *victims* than in its *purpose*.

  ### Distinguishing from Neighbors

  To ensure this carving holds, we must distinguish it from its nearest neighbors:

  *   **Vs. Goal Displacement:** In Goal Displacement (Merton), the *procedure* becomes the *goal* (e.g., "we file reports to file reports"). In Precommitment Drift, the procedure is still viewed as serving a *higher goal* (restraint/discipline); it is just mistakenly believed to be serving the *original* goal. The actors think they are still tying themselves to the mast; they just don't notice the ship has changed course.
  *   **Vs. Goodhart's Law:** Goodhart's Law is "when a measure becomes a target, it ceases to be a good measure." It implies gaming. In Drift, there is no gaming of the measure. The measure is honored scrupulously. The failure is not in the *compliance*, but in the *relevance*.
  *   **Vs. Desuetude:** Desuetude is when a rule falls into disuse. Drift requires the rule to be *active* and *cited*.
  *   **Vs. Loopholing:** Loopholing is finding a way around the rule to do the forbidden thing. Drift *includes* loopholing (the Gen-Ed "pilots"), but adds the crucial second half: the rule must also bite *someone else*. A loophole alone is just evasion. A loophole + a new victim = Drift.

  ### Addressing Your Boundary Cases

  **1. Does the device have to bite correctly at first?**
  Strictly speaking, **no**, but the *phenomenon* of Drift requires time.
  If the rule never bit the original target (e.g., the tax supermajority never actually stopped spending because debt was always an option), then the system began in a state of **Decoupled Precommitment**.
  However, for it to be *Drift*, there must be a migration. If it never bit the target, there is no "drift" of the bite, only a static misalignment. The Faculty Senate case is a pure example of Drift because the rule *was* intended to stop hasty reforms, and presumably did so initially, before the "pilot" workaround evolved. The Tablet case is Drift because the blocker *did* stop the phone scrolling before the tablet was purchased.
  *Boundary:* If the rule was *never* effective against the original temptation, call it **Symbolic Binding**. If it *was* effective and then lost the target while gaining a new one, it is **Precommitment Drift**.

  **2. Is it Drift if the binding was adopted partly to *signal* resolve?**
  This is a crucial distinction. If the rule was primarily signaling (to accreditors, voters, or one's own self-image), and the "bite" on the new victim is a side effect, this is **Signal Realization**.
  In Signaling, the "cost" of the rule is the point (it shows we are serious). If the cost migrates to a new party, the signal might still be sent (to outsiders who don't see the internal workaround).
  *However*, if the insiders *believe* their own signal (i.e., they think the rule is actually restraining them), then it functions as Drift.
  *Test:* Do the actors believe the rule is restraining the original temptation?
  *   **Yes:** Precommitment Drift.
  *   **No (they know it's theater):** Ceremonial Compliance.
  In your Senate example, because they "say so cheerfully and on the record" that the pilots bypass the rule, they know the original temptation isn't bound. But because they still cite the rule as "our precommitment," they are maintaining the *myth* of the binding. This suggests a hybrid: **Ritualized Drift**. The rule binds the conscientious (the lab fixers) while the cynical (the reformers) bypass it.

  **3. Is there an internal test for Genuine vs. Migrated Binding?**
  Your "Repeal Test" is strong, but needs one refinement.
  *Your Test:* "If this rule were repealed tomorrow, would the people now bound by it pass it again, and in the same form?"
  *Refinement:* "...pass it again **for the same stated reasons**?"
  If the Senate would pass the 2/3 vote rule again, but *only* if it applied to "all curricular changes including pilots," then the current rule is Drift. If they would pass it to "stop hasty May reforms," but acknowledge it doesn't do that anymore, they are admitting Drift.
  *Better Test:* **The Counterfactual Harm Test.** "If we knew today that this rule would *not* stop the original temptation (hasty reform) but *would* stop the current victim (lab fix), would we still adopt it?"
  *   If **No**: It is Precommitment Drift.
  *   If **Yes**: The function has legitimately evolved (Adaptive Constraint).
  The key is whether the current cost is accepted as a *trade-off* or suffered as a *bug*. In your cases, it is suffered as a bug.

  **4. Single-Agent (Tablet) vs. Collective (Senate)**
  They are structurally identical but ontologically distinct.
  *   **Single-Agent:** This is **Temporal Decoupling**. Time-Slice A binds Time-Slice C. Time-Slice B (the tablet self) finds a workaround. Time-Slice C (the kitchen self) gets bitten. The "Self" is continuous, so the drift is a failure of *memory* or *imagination*.
  *   **Collective:** This is **Constitutive Drift**. The "We" who bound ourselves is not the "We" who are bound. The Senate has turnover. The original members who felt the "May fit of enthusiasm" are gone. The new members feel the "burden of governance" but not the "temptation of reform."
  *   *The Extra Factor:* In the collective case, the Drift is compounded by **Amnesia of Temptation**. The new senators look at the rule and think, "This is a wise restraint," because they do not feel the urge to rush. They interpret the *absence of the temptation* as the *success of the rule*, rather than recognizing the temptation has migrated.
  *   *Verdict:* The Collective version is more pernicious because it lacks the internal feedback loop. The tablet user *knows* they are doomscrolling on the tablet. The Senate *collectively agrees* to pretend the pilots don't count. The Collective version requires **Collusive Drift**—everyone agrees not to notice the migration.

  ### Why This Matters (The Mechanism)

  The mechanism driving Precommitment Drift is **Asymmetric Rigidity**.
  It is harder to change the *Rule* (requires 2/3 vote, or changing habits) than it is to change the *Behavior* (buy a tablet, draft a "pilot").
  When the environment shifts, the Behavior flows around the Rule like water. The Rule stays rock-hard. Eventually, the water finds a new valley to flood (the lab requirement), and the Rule stands there, still claiming to be a dam against the old river.

  ### Summary Definition

  **Precommitment Drift:** A systemic state in which a self-imposed constraint retains its formal authority and normative justification but loses its causal efficacy against the original target behavior, while simultaneously acquiring causal efficacy against a distinct, unintended target behavior, sustained by a collective refusal to update the rule's specification to match its actual operation.

  You are not going mad. You are watching a constraint become a zombie: dead to its purpose, alive to its power.
