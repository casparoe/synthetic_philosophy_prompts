      *   **Scene 2: The Rate Collapse:** Mara notices payments dropping. She goes out (rare for her).
      *   **Scene 3: Encounters:**
          *   Encounter A: A clerk or board notice about "Saturation."
          *   Encounter B: The Antagonist (Birdwatcher type). Argument: "You aren't testing the boundary."
      *   **Scene 4: The Choice:** Mara decides to stop submitting or changes strategy. It needs to cost her. Maybe she submits a photo that proves she *knows* the system is broken, or she destroys her own source of income. Let's have her stop submitting the apples, losing her income, to force the Bureau to acknowledge the data is noise. Or better: She submits a *black raven* photo she faked? No, that's fraud. She submits a photo of a *white raven*? No, that falsifies.
      *   *Refining the Choice:* The prompt says "costs her something." If the apple photos are worth nothing now, submitting them costs time but not money. She needs to lose something. Maybe she has to leave her apartment to find actual ravens, costing her safety/comfort? Or she refuses to submit the apples even though they still pay a tiny bit, to make a statement?
      *   *Better Idea:* The Bureau wants her to keep submitting to keep the numbers up. She refuses. She loses the "Top Earner" status and the associated bonus/perk. Or she submits a photo of a black raven she found, which pays well but requires her to leave her sanctuary. Let's go with leaving the sanctuary. It costs her her safety/comfort zone.
