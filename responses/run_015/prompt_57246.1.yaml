      *   *Revised Choice:* She stops submitting the apples entirely. The Bureau relies on her volume to keep the confirmation metrics looking high. By stopping, she loses her income and her status, but she forces the metric to reflect reality. She chooses poverty/truth over easy money.
      *   *Actually, let's look at the "Rate Collapse" requirement:* "The reason has to be about what everybody in town already knows by then — like, something happened that made those photos stop telling anyone anything they didn't already have."
      *   *Idea:* The town becomes so saturated with apple photos that the Bureau declares the "Non-Black Non-Raven" category "Statistically Exhausted." The pay drops to zero. Mara goes to complain. She meets the Birdwatcher. He argues that apples never mattered. She realizes he's right. She chooses to stop trying to game the system.
      *   *Wait, the choice must cost her.* If the pay is zero, stopping costs nothing. She needs to stop *before* it hits zero, or reject a buyout.
      *   *Let's try this:* The Bureau offers her a contract to keep submitting apples to maintain the *appearance* of data flow, even if the scientific value is zero. It's busywork. She refuses. She loses the guaranteed stipend.

      *   **Final Paragraph:** A raven appears. Just a bird. No symbolism.

  4.  **Writing - Focus on Tone:**
      *   Bureaucratic, dry, slightly absurd but treated seriously.
      *   Avoid philosophical terms. Use "Category Exclusion," "Negative Verification," "Data Saturation."

  5.  **Drafting - Step-by-Step:**

      *   *Opening:* Mara counting credits. The view from her window. The objects she photographs.
      *   *Bureau Scene:* Flashback or current visit? Let's make it a current visit due to the rate drop. But I need the clerk explaining to a newcomer. Maybe Mara overhears this while waiting in line to complain about her rates.
      *   *The Argument:* The Birdwatcher (let's call him Mr. Hume? No, too obvious. Mr. Vance). He argues about "Risk." Testing a hypothesis requires the possibility of failure. Apples can't fail the test.
      *   *The Collapse:* The Bureau announces "Category Saturation."
      *   *The Choice:* The Bureau wants her to keep shooting apples to keep the queue full. She refuses. She loses the "Volume Bonus."
      *   *The Raven:* Last paragraph.

  6.  **Word Count Check:**
      *   Need to expand descriptions and dialogue to hit 1400-1800.
      *   Ensure the clerk's explanation is detailed enough to imply the logic without naming it.

  7.  **Refining the Logic (for the post-story note):**
      *   Rate Card Rule 1 (Non-Black Non-Raven pays less): Represents the logical equivalence but lower prior probability.
      *   Rate Collapse (Saturation): Represents the Bayesian update diminishing as evidence becomes ubiquitous.
