      *   **Key Scenes/Requirements:**
          1.  Clerk explaining rate card to newcomer (boring bureaucracy, no jargon like "contrapositive" or "Bayesian," no naming the paradox).
          2.  Rate collapse for non-raven items (shoes/apples). Protagonist investigates. Reason must be about information value saturation (everyone knows non-black things aren't ravens already). Show, don't tell (2-3 encounters).
          3.  Antagonist: Someone arguing only real ravens should count (reasonable argument, not stupid, leaves reader on the fence).
          4.  Ending: A choice that costs the protagonist something (not just a realization).
          5.  Ravens: None appear until the final paragraph (if at all), and no big symbolic moment.
          6.  Post-story analysis: 5-6 sentences explaining which rate rule maps to which part of the paradox and admitting one fudged part.
      *   **Constraints:** No citations, no bibliography, no real book quotes.

  2.  **Deconstruct the Philosophy (Hempel's Raven Paradox):**
      *   Hypothesis: All ravens are black ($R \rightarrow B$).
      *   Logically equivalent: All non-black things are non-ravens ($\neg B \rightarrow \neg R$).
      *   Paradox: Observing a black raven confirms the hypothesis. Observing a non-black non-raven (e.g., a green apple) also confirms the hypothesis logically.
      *   Intuition: Green apples feel irrelevant.
      *   Solution (Bayesian/Good): The confirmation value depends on the prior probability. There are way more non-black things than ravens. So finding a non-black non-raven adds negligible confirmation compared to finding a black raven. If the set of non-black things is exhausted or known, the value drops to zero.
      *   Story Implementation:
          *   Rate Card: High pay for Black Ravens, low pay for Non-Black Non-Ravens.
          *   Rate Collapse: As everyone submits apple photos, the "information gain" drops. The Bureau adjusts rates based on scarcity/uniqueness of the confirmation.
          *   Antagonist Argument: "You're padding the stats with noise."
          *   Protagonist's Choice: Stop submitting worthless data? Or submit something risky? The prompt says "costs her something." Maybe she loses income to prove a point, or she stops the influx.

  3.  **Drafting - Section by Section:**

      *   **Introduction/Setup:** Establish Mara (protagonist), her apartment, her income source (photos of non-ravens), and her status as top earner.
