answer: |-
  ### 1. The agenda

  **Priority 1: Breaking the Symmetry (Philosophy and Decision Theory)**
  Allocate three projects to resolve whether inaction is truly symmetric with action. Grantees will model the unilateralist's curse not as a static choice but as a dynamic sequence where waiting generates information. They must determine if the option value of restraint differs categorically from the option value of acceleration. Over three years, these teams will produce a normative decision rule. This rule will specify the conditions under which a single actor is epistemically justified in overriding a consensus to act, versus when they are obligated to wait. The final deliverable is a formal framework distinguishing "reckless unilateralism" from "necessary unilateralism," allowing you to evaluate whether a lab's refusal to pause is a curse-induced error or a rational exception. Without this, you cannot distinguish harmful projects from helpful ones.

  **Priority 2: Endogenous Actor Population (Social Science and Policy Analysis)**
  Allocate three projects to map how public AI decisions alter the competitive landscape. Since you lack inside access, grantees will use public data (paper releases, weight dumps, hiring announcements) and interviews with former lab employees to track entry and exit rates in the frontier sector. They will test the hypothesis that open releases increase the number of capable actors while visible restraint consolidates the field. Over three years, these teams will build a causal model linking specific release strategies to changes in the number of viable competitors. The deliverable is a dataset and a predictive model. This tells you whether unilateral restraint actually reduces the curse by shrinking the actor pool, or worsens it by ceding ground to less careful entrants. This is the most empirically tractable line given your access constraints.

  **Priority 3: Second-Order Stability (Political Science and Game Theory)**
  Allocate two projects to analyze coordination mechanisms as unilateral initiatives themselves. Grantees will model the formation of safety consortia or reporting standards as games where joining is a unilateral choice subject to the same curse. They will investigate whether public commitments stabilize behavior or merely signal virtue while hiding defection. Over three years, these teams will derive a set of stability conditions. The deliverable is a list of structural requirements (e.g., verification mechanisms, penalty structures) that make a coordination body robust against unilateralist pressure. This work is downstream of the first two; you need to know what counts as a harmful act and how the population shifts before designing institutions to manage them.

  ### 2. Criteria and trade-offs

  I am ranking these lines by foundationality, tractability under your access constraints, and actionability. Foundationality matters most: if the symmetry complication implies the curse licenses paralysis, the other two lines become irrelevant. You must know if the frame is broken before fixing the dynamics. Tractability is the binding constraint for your fund. Philosophers can break symmetry using public reasoning and formal models without needing lab data. Social scientists can track endogenous population changes using public artifacts and exit interviews. However, studying second-order remedies is less tractable without inside access; you cannot verify if a coordination body is actually preventing risky behavior or just masking it.

  The trade-off is between abstract certainty and empirical utility. The symmetry work is high-risk; philosophers may fail to find a breaking point, leaving you with no decision rule. However, the upside is eliminating a category error. The endogeneity work is lower-risk and higher immediate utility for policy, but it relies on noisy public data. I prioritize symmetry because a wrong foundational assumption corrupts all downstream empirical work. If you fund the empirical work first, you might measure the wrong variables based on a flawed theoretical frame. The access constraint pushes you away from institutional design (Priority 3) and toward conceptual clarification (Priority 1) and public-facing dynamics (Priority 2).

  ### 3. What to drop

  The lowest priority is the **Second-Order Stability** line. I would cut this if you were forced to fund only four projects instead of eight. This work is premature. Designing coordination mechanisms requires knowing what behaviors need coordinating (Priority 1) and how the player pool responds to those mechanisms (Priority 2). Furthermore, evaluating the success of coordination bodies usually requires inside access to verify compliance, which you explicitly lack. Without the ability to audit whether a lab is actually adhering to a safety pact, grantees can only model theoretical stability, not real-world efficacy. Settling this now would produce abstract conditions that may not apply to the actual dynamics revealed by the first two lines. You can revisit institutional design once the landscape dynamics are understood.

  ### 4. Falsifiers

  Two types of evidence should shift this ordering. First, if within twelve months, a consensus emerges among decision theorists that the symmetry cannot be broken without assuming a specific, controversial value theory, downgrade Priority 1. This suggests the philosophical route is stalled, and you should pivot resources to the empirical dynamics of Priority 2. Second, if public data over the next two years shows no correlation between open-weight releases and the entry of new frontier competitors, downgrade Priority 2. This would imply the actor population is exogenous to public strategy, reducing the leverage of release policies. Conversely, if a major international safety body forms and successfully halts a risky project despite unilateral pressure, upgrade Priority 3. This would indicate that second-order remedies are more robust than theoretical models suggest, warranting earlier investment in institutional design.
