  Subject: Re: That open-source case and internalism

  Hi there,

  Thanks for sending this over, it is a really juicy puzzle and I have been mulling it over whilst having my morning coffee. You are asking for a precise credence on whether internalism about practical reasons is false, specifically driven by this case of structural obligations in cooperative practices, and that requires unpacking a few layered probabilities before I can give you a straight number. To start with the rough probability that cooperative structures genuinely generate obligations independent of an agent's motivational set, I am inclined to be fairly confident here because institutional facts do seem to create deontic powers that exist prior to individual endorsement, much like Searle argued, so I would put that at around 0.75 since the collective need for security in open-source ecosystems feels ontologically robust even if one participant is unmotivated. However, the chance that internalists can absorb these as derived reasons without collapsing into externalism is the real sticking point, because a clever Williams-style internalist will argue that accepting the role implies a normative commitment within the motivational set, yet your stipulation that she has no existing project benefiting from it blocks the instrumental route, so I think there is only about a 0.4 chance they can pull that off without smuggling in external values. Then we have the niche twist regarding circularity, where she must accept institutional normativity to recognise the obligation, and I think the chance that this circularity is fatal rather than just a learning curve is quite low, perhaps 0.2, because epistemic access conditions do not necessarily negate metaphysical independence, meaning the reason could exist even if she lacks the key to see it. Finally, there is the chance that the best resolution is a hybrid where reasons stay internal but get activated by institutional recognition, which sounds appealingly moderate but risks being externalism in disguise, so I would say there is a 0.5 chance that this hybrid fails to save internalism properly.

  When I combine these assessments, the weight falls heavily on the inability of internalism to account for the role obligation without distorting the motivational set, tempered by the fact that the circularity objection does not fully landed a knockout blow against the internalist epistemology. Taking the strong likelihood of independent structural obligations and weighing it against the moderate resilience of internalist manoeuvres, my overall credence that internalism is false specifically because of this case is 0.68. The sub-question doing the heavy lifting here is undoubtedly the second one concerning the internalist absorption capacity, because if they can convincingly argue that role acceptance constitutes a motivational state, the whole externalist case crumbles regardless of the ontological status of the institution. The argument or case that would shift my number the most would be a detailed genealogy of the agent's entry into the collective, specifically if it could be shown that she never explicitly or implicitly consented to the normative framework of the role, because that would sever the link between her motivational set and the obligation entirely, pushing my credence closer to 0.9 or forcing a rethink of the hybrid model. Anyway, that is my best guess off the top of my head, let me know if you think I have underestimated the internalist capacity for deliberative expansion.

  Best wishes

  Alex
