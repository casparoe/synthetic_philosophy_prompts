  # TAXONOMY OF THE HETEROGENEITY PROBLEM

  ### I. DECISION TREE
  *Answer the following questions regarding the specific cases provided. Follow the branches to locate your position.*

  **1. The Climber and the Prover (Phenomenal Presence)**
  In the case of the climber absorbed in a hard route and the prover closing a long proof, is the pleasure a specific positive sensation present in the experience that they simply failed to notice, or is the pleasure constituted by something else (a manner of engagement, a stance, or a function) regardless of sensation?
  *   **A. Specific Sensation Present:** Go to 2.
  *   **B. Constituted by Something Else:** Go to 3.

  **2. The Toothache and the Astringent (Nature of the Phenomenal)**
  Regarding the relief of a toothache and the enjoyment of a harshly astringent food, is the pleasure a simple positive addition to experience (a "tingle" or "glow"), or is it a way of undergoing an experience (a mode) that might coexist with dislike or absence?
  *   **A. Simple Positive Addition:** Go to 4.
  *   **B. Way of Undergoing / Mode:** Go to 4.

  **3. The Reward System and Fiction (Non-Phenomenal Constitution)**
  Regarding the dissociation between reward-system response and self-report, and delight in fictional escapes, is pleasure a pro-attitude toward an object/experience, or merely a functional role in learning and action?
  *   **A. Pro-Attitude:** Go to 4.
  *   **B. Functional Role:** **Leaf: Functionalism.**

  **4. The Double-Duty and Unity (Value and Kind)**
  Must the feature that unifies these states (sensation, mode, or attitude) *also* be what explains why pleasure benefits the person, and is "pleasure" a unified natural kind despite the reward-system dissociation?
  *   **A. Yes (Unity = Value; Unified Kind):** Proceed to Leaf Selection below.
  *   **B. No (Unity ≠ Value OR No Unified Kind):** Proceed to Leaf Selection below.

  ---

  ### II. THE LEAVES
  *Locate your terminal position based on your path above.*

  1.  **Qualitative Hedonism** (Path 1A, 2A, 4A)
      *   **Statement:** Pleasures share a distinctive felt quality that is present in all instances.
      *   **Awkward Commitment:** Must claim the absorbed climber felt a specific sensation they explicitly denied noticing.
  2.  **Adverbialism** (Path 1A, 2B, 4A)
      *   **Statement:** Pleasure is a way or mode of undergoing an experience rather than an experience of its own.
      *   **Awkward Commitment:** Struggles to explain toothache relief which seems to be an absence, not a mode of presence.
  3.  **Pro-Attitude Theory** (Path 3A, 4A)
      *   **Statement:** Pleasure consists in a pro-attitude toward an experience or its object.
      *   **Awkward Commitment:** Must count the astringent food as pleasurable only if the subject desires the sensation despite disliking it.
  4.  **Hybrid View** (Path 1A, 2B, 3A, 4A)
      *   **Statement:** A hybrid of the previous two, requiring both a distinctive mode and a pro-attitude.
      *   **Awkward Commitment:** Risks over-intellectualizing the background contentment the subject would not have reported unless prompted.
  5.  **Functionalism** (Path 3B, 4B)
      *   **Statement:** Pleasures share only a functional or common-currency role in learning and action.
      *   **Awkward Commitment:** Allows that a state could be a pleasure even if it makes the subject's life go worse.
  6.  **Disjunctivism** (Path 4B [No Unified Kind])
      *   **Statement:** Pleasure is a determinable whose determinates share nothing qualitative, or the disjunctivist variant on which the class is a gerrymander.
      *   **Awkward Commitment:** Commits to there being no deep explanation for why we group relief and delight together.
  7.  **Eliminativism** (Path 4B [Category Dropped])
      *   **Statement:** The eliminativist option on which serious psychology and ethics should stop using the category.
      *   **Awkward Commitment:** Requires rewriting all folk psychology and moral theory that relies on "happiness."

  ---

  ### III. UNDEFENDED COMBINATIONS
  *Combinations of answers the tree allows but no major view occupies.*

  1.  **Qualitative Hedonism + Value Separation (Path 1A, 2A, 4B):** *Unattractive.* Posits a real feeling that unifies pleasures but denies this feeling is what makes them good, severing the intuitive link between feeling and benefit.
  2.  **Eliminativism + Value Realism (Path 4B + Value Objective):** *Incoherent.* Claims "pleasure" does not exist as a category while simultaneously using it to track objective well-being.
  3.  **Disjunctivism + Double-Duty (Path 6 + 4A):** *Unexplored.* Asserts the class is gerrymandered yet insists this messy collection is the sole source of normative value.

  ---

  ### IV. INDISTINGUISHABLE PAIRS

  1.  Adverbialism and the Hybrid View cannot be separated by this tree because both rely on a "mode of experiencing" that is difficult to distinguish from a mode-plus-attitude without further phenomenological data.
  2.  Functionalism and Disjunctivism cannot be separated because both deny a unified phenomenal essence, differing only on whether the functional role is robust enough to retain the name.
  3.  Qualitative Hedonism and Adverbialism cannot be separated if the "distinctive felt quality" is described as a "manner of feeling," collapsing sensation into mode.
  4.  Pro-Attitude Theory and Functionalism cannot be separated if the pro-attitude is defined functionally as a disposition to choose or sustain the experience.
  5.  Disjunctivism and Eliminativism cannot be separated because a sufficiently gerrymandered class offers no explanatory power, making the practical difference between "messy kind" and "no kind" negligible.
