  *   **The Cost:** This renders your view incapable of criticizing risk-imposition in non-identity cases unless the *outcome* is below zero. It insulates Part 1 from the stochastic case by making Part 1 blind to risk. If you admit B was disadvantaged by the low probability, you violate Part 1 (comparing existence to non-existence). If you deny it, you lose the intuitive grip on why Protocol I was worse *for anyone*.

  #### 2. Fatal: The Truth-Maker Gap (Vague Identity)
  *   **The Claim:** Your Part 1 (CCA) requires a determinate truth value for "Person P in World W1 is worse off than Person P in World W2." If personal identity is vague (or a matter of degree, as you suspect in the stochastic case), there is no fact of the matter about whether the P in W2 is the *same* P.
  *   **What must be true:** Identity must be binary for CCA to function without modification.
  *   **Live Possibility:** High. Many metaphysicians of identity accept vagueness.
  *   **Defender's Concession:** You would likely dismiss this as metaphysical squeamishness, insisting on a precise (even if arbitrary) cutoff for identity.
  *   **The Cost:** If you insist on binary identity in a vague region, your harm verdicts become arbitrarily sensitive to metaphysical precisifications. If you accept degree-identity, CCA collapses into a weighted impersonal calculation (weighing the "degree of P" across worlds), which dissolves Part 1 into Part 2.

  #### 3. Severe: The Idle Wheel (Internal Coherence)
  *   **The Claim:** Part 1 (Harm) does no deontic work. Part 2 (Impersonal Axiology) determines permissibility entirely. Part 1 is retained only to satisfy an intuition that "someone must be harmed," but you explicitly deny that wrongness requires harm.
  *   **What must be true:** For this to be a defeater, theoretical parsimony must count against you.
  *   **Live Possibility:** Certain. It is a structural feature of your view.
  *   **Defender's Concession:** You would concede this but argue Part 1 has explanatory value (e.g., explaining resentment, compensation).
  *   **The Cost:** You must explain what work Part 1 does if not grounding wrongness. If it grounds compensation, you owe an account of compensating someone who wasn't harmed. If it grounds resentment, you owe an account of rational resentment without harm. If it does neither, it is a ghost limb.

  #### 4. Severe: The Collapse into Impersonalism
  *   **The Claim:** Once you allow impersonal value to dictate wrongness in different-people choices, the distinction between "harming B" and "failing to maximize value by not creating A" becomes morally inert. The "person-affecting apparatus" is a facade.
  *   **What must be true:** The deontic force of impersonal value must swamp the metaphysical distinction of harm.
  *   **Live Possibility:** High. This is the standard trajectory of hybrid views.
  *   **Defender's Concession:** You would dismiss this, insisting the metaphysics of harm matters for *description* even if not *prescription*.
  *   **The Cost:** You are left with a view that speaks the language of person-affecting morality but operates on impersonal logic. This creates a disconnect in moral discourse (e.g., in court, in apology) that may be unsustainable.

  #### 5. Awkward: The Linguistic/Conceptual Mismatch
  *   **The Claim:** Calling a life of level 4 (misery, barely above zero) "not harmed" violates the conceptual connection between harm and suffering.
  *   **What must be true:** Our concept of harm must be tied to absolute welfare levels, not just counterfactuals.
  *   **Live Possibility:** Moderate. Some accept CCA, but many find "harm" implies a threshold.
  *   **Defender's Concession:** You would dismiss this as a verbal dispute, insisting on technical precision.
  *   **The Cost:** You isolate your view from ordinary moral language, requiring constant translation when communicating verdicts.

