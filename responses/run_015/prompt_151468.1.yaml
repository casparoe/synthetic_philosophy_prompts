prompt: |-
  I'm taking this course on type theory and got pulled into intutionistic logic, and there's this pattern in papers and lecture notes that I can't tell if it's a named philosophical move or just people being sloppy. Like, you'll see a proof that actually builds an algorithm - totally constructive, you can extract the code - but then right next to it there's reasoning about correctness that uses exluded middle freely, and they defend it by saying thats just the specifcation layer, the extraction only touches the constructive kernel. But then in another paper they'll use that same classical layer to justify an optimization that changes the actual running code, not just the spec, like saying either the input is sorted or it isnt, so we can branch, when the branch lives inside the extracted program. So the boundary between constructive zone and classical zone shifts based on whats convenient. I know Bishop-style constructivism restricts logic but still does analysis, and I know intuitionists sometimes allow LEM for decidable propositions, but this feels different - its not about which propositions are okay globally, its about carving one proof into two regions with different rules and then moving the fence. Does this have a name? Is it related to Markov's principle or the double-negation translation, or am I just describing people inconsistently applying moderate intuitionism? If there's no established term, how should I define this split-level reasoning, and where exactly does its boundary fail conceptually?

  Also, if I'm just misunderstanding how proof extraction works - like maybe there's a hard technical wall that keeps classical reasoning from ever infecting the computational part, and I'm seeing inconsistencies that aren't really there - please say so plainly instead of going along with the premise. I want pushback if the confusion is on my end.
