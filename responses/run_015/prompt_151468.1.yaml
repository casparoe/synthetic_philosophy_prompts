answer: |-
  You have spotted a genuine tension in the literature, and your intuition is largely correct: **there is often sloppiness here.** However, there are also legitimate technical frameworks that look like what you're describing but operate under strict rules.

  Here is the plain pushback you asked for, followed by the names for the legitimate moves and the conceptual failure points.

  ### 1. The Pushback: The "Hard Wall" of Extraction
  You asked if there is a hard technical wall that keeps classical reasoning from infecting the computational part. **Yes, there is.**

  In standard Martin-Löf Type Theory (MLTT), Coq (`Set`/`Type`), or Agda, the Curry-Howard correspondence is strict: **proofs are programs.**
  *   If you use the Law of Excluded Middle (LEM) as an axiom (`P \/ ~P`) on a proposition `P` that is not decidable, **you cannot extract a computational branch.**
  *   In Coq, if you try to extract a function that pattern-matches on a proof of `P \/ ~P` where `P` is in `Prop` (and proved classically), extraction will either fail or produce a stub (e.g., `raise Error "axiom"`).
  *   If you see extracted code that branches on "sorted or not sorted," one of three things is true:
      1.  **Decidability:** The predicate *is* decidable (e.g., the list is finite), so LEM is constructively valid for that specific case, and the authors are just being loose with terminology.
      2.  **Classical Realizability:** The system is not standard intuitionistic logic but a classical type theory where LEM has computational content (usually implemented via control operators like `call/cc`).
      3.  **Sloppiness:** The authors are presenting pseudo-code and claiming it is "extracted" when it is actually hand-waved.

  If the paper claims standard constructive extraction but uses LEM to drive control flow on an undecidable predicate, **they are technically wrong.** There is no magic fence that allows classical logic to drive computation in a pure functional extraction without changing the semantics of the computation.

  ### 2. Is There a Name for This?
  If the authors are doing it *legitimately*, they are likely using one of these frameworks. If they aren't using these frameworks, they are likely engaging in **Methodological Conflation**.

  #### A. Classical Realizability (The "Computational LEM" Move)
  This is the most sophisticated version of what you're seeing. Pioneered by Jean-Louis Krivine and others, this framework assigns computational content to classical axioms.
  *   **How it works:** LEM is interpreted as a control operator (like `call-with-current-continuation` in Scheme).
  *   **The "Branch":** When the code branches on `P \/ ~P`, it isn't a pure functional `if`. It's a backtracking mechanism. The program assumes `P`, runs, and if it hits a contradiction, it "rewinds" and tries `~P`.
  *   **The Name:** **Classical Extraction** or **Symmetric Interaction Combinators**.
  *   **Why it looks like shifting:** It allows classical reasoning in the "code" layer, but the resulting code is not a pure function; it's a program with effects (backtracking).

  #### B. Two-Level Type Theory (2LTT)
  This is the formal version of the "Specification vs. Kernel" split you noticed.
  *   **How it works:** The type theory has two layers: an **inner** layer (strictly constructive, used for extraction) and an **outer** layer (classical, used for reasoning about the inner layer).
  *   **The Boundary:** You can prove things classically in the outer layer about the inner layer's types, but you cannot import outer-layer terms into inner-layer computation.
  *   **The Name:** **Two-Level Type Theory** (see work by Annenkov, Capriotti, Kraus, etc.).
  *   **The Failure:** If a paper uses 2LTT but accidentally imports an outer-layer classical proof to drive an inner-layer `if` statement, they have broken the theory. This is often where the "sloppiness" lives.

  #### C. Bishop-Style Pragmatism (The "Sloppy" Move)
  Errett Bishop's constructivism focuses on numerical meaning. Many computer scientists adopt a "Bishop-lite" approach.
  *   **The Move:** They reason classically in the meta-text ("Clearly, the list is either sorted or not") to justify the *structure* of the algorithm, but they implicitly assume decidability for the implementation.
  *   **The Name:** There isn't a formal philosophical name, but in proof engineering, this is often called **Informal Rigor** or **Proof Engineering Pragmatism**.
  *   **The Risk:** They treat "decidable in principle" (mathematically) as "decidable in practice" (computationally). For example, assuming equality on functions is decidable because "in the model it is," even though you can't compute it.

  ### 3. Where the Boundary Fails Conceptually
  You asked where exactly the boundary fails. It fails at **Witness Extraction**.

  In intuitionistic logic, a proof of `exists x. P(x)` *contains* the `x`. In classical logic, a proof of `exists x. P(x)` might only show that `not (forall x. not P(x))`.
  *   **The Shift:** Authors often prove `exists x` classically (using LEM), then claim they have an algorithm to find `x`.
  *   **The Glitch:** To get `x`, they usually need **Markov's Principle** (`~~(exists x. P(x)) -> exists x. P(x)` for decidable `P`) or a **Choice Axiom**.
  *   **The Optimization Trap:** When they say "we branch on sortedness to optimize," if sortedness is undecidable, that branch is a **ghost**. In a real extraction, that branch must be resolved by a boolean function `is_sorted : List -> Bool`. If `is_sorted` doesn't exist, the code doesn't exist.

  ### 4. Summary: How to Label What You're Seeing
  If you need to describe this in your own writing or critique:

  1.  **If they use control operators/backtracking:** Call it **Classical Realizability**.
  2.  **If they separate meta-reasoning from code but blur the line:** Call it **Conflation of Object and Meta-Logic**.
  3.  **If they assume decidability without stating it:** Call it **Implicit Decidability Assumptions**.
  4.  **If they claim standard extraction but use LEM for branching:** Call it **Extraction Inconsistency**.

  **Verdict:** You are not misunderstanding extraction. In standard systems (Coq/Agda/MLTT), classical logic *cannot* drive computation. If you see it, either the predicate is decidable (and they didn't say so), they are using classical realizability (and didn't explain the control effects), or they are being sloppy. Given the prevalence of the latter in lecture notes, bet on sloppiness first, but check for `call/cc` semantics second.
