      *   **Key Correction 2 (Spatial Frames vs. Haecceities):** Confusing absolute space with haecceities. Absolute space gives qualitative location properties. Haecceities are bare particularity. Leibniz bans absolute space *and* haecceities, but for different reasons.
      *   **Key Correction 3 (Leibniz's Escape):** Denying possibility is the standard Leibnizian move, not necessarily *ad hoc* if PII is taken as necessary. But the student's reasoning for *why* it's the only escape is flawed because she dismissed weak discernibility incorrectly.

