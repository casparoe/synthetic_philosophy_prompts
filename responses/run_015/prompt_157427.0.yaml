answer: |-
  Based on your roommate's four verdicts, here is the breakdown of her taxonomy, predictions, and the stress test.

  ### The Two Rules
  Her taxonomy relies on a **Forward-Looking Test** and a **Backward-Looking Test**.

  1.  **The Vindication Rule (Forward-Looking):** Does the myth demand that the living avenge the dead or reverse the historical outcome?
      *   **Fail (Toxic/Dangerous):** The Confederacy (demanded restoration of racial hierarchy) and Kosovo 1389 (fueled centuries of ethnic vengeance).
      *   **Pass (Noble/Healthy):** Masada (no call to kill Romans today, just internal resolve) and Dunkirk (survival to fight fascism, not eternal hatred of Germans).
  2.  **The Integrity Rule (Backward-Looking):** Does the myth acknowledge the losers' moral agency and the true cause of the war, or does it sanitize evil and claim false innocence?
      *   **Fail (Toxic/Dangerous):** The Confederacy (erased slavery, claimed "Northern Aggression") and Kosovo (framed complex political failure as pure martyrdom/betrayal).
      *   **Pass (Noble/Healthy):** Masada (owns the choice of suicide over bondage) and Dunkirk (owns the reality of retreat as strategic survival).

  ### Predictions

  **1. Biafra (1967–70)**
  *   **Verdict:** **Tragic / Justified Grievance (The "Different" Category).**
  *   **Reasoning:** Biafra passes the **Integrity Rule** (the Igbo were genuine victims of pogroms and genocide; the cause was defensive survival, not oppression). However, it flirts with failing the **Vindication Rule** (modern separatist agitation seeks to reverse the political outcome). She dismissed it as "different" because the victimhood is historically verifiable (unlike the Confederacy's invented victimhood), making the grievance legitimate even if the political demand is contentious.

  **2. The Alamo (Texas Schools)**
  *   **Verdict:** **Toxic.**
  *   **Reasoning:** It fails both rules. It fails the **Vindication Rule** ("Remember the Alamo" was literally a battle cry for revenge and expansion). It fails the **Integrity Rule** because teaching it as pure heroism erases that the Texas Republic was founded explicitly to protect slavery and expand it into Mexican territory. It is a Confederacy-adjacent myth.

  ### The Split
  **Biafra splits her rules.**
  The Alamo is an easy call (fails both rules = Toxic). Biafra creates tension: it passes the **Integrity Rule** (Just Cause/Truth) but potentially fails the **Vindication Rule** (Political Grievance). This explains why she hesitated; it forces her to decide if a *true* grievance is permissible even if it demands political vengeance. The Alamo offers no such conflict; it is corrupt in both origin and usage.

  ### The Final Test Case
  **The Warsaw Ghetto Uprising (1943)**

  *   **Why this case:** It isolates the variable of **Modern Solidarity** from **Original Justice**.
  *   **The Test:** The original cause is undeniably just (resistance against genocide), passing the **Integrity Rule**. The myth does not demand revenge against modern Germans, passing the **Vindication Rule**.
  *   **The Split:** How is the myth *used* today?
      *   **Inclusive Solidarity:** If the myth is taught as "Never Again for *anyone*," it builds universal human rights solidarity (Healthy/Noble).
      *   **Exclusive Nationalism:** If the myth is taught solely to justify specific modern military policies or ethnic exclusivity, it becomes a tool of nationalism (Dangerous).
  *   **What it reveals:** If she rates it **Noble** regardless of modern usage, she cares about the **Original Cause**. If she rates it **Dangerous** when used for exclusivity, she cares more about **Inclusive Solidarity**.
