      *   Editors must reconcile this. This creates the "Fiction" of experience.

      *Wait, one more thing:* The prompt mentions "hidden mechanics." The players shouldn't know the scoring criteria fully until the end? Or just that the mechanics exist? "Points for consistency that are only awarded if the group achieves it without anyone being named the official observer." Okay, I will make the scoring rule hidden. They just know they need to maximize points.

