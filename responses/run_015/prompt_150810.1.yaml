      *(Self-Correction on Points)*: If they get points for "Truth," they might fail because perception *isn't* truth. If they get points for "Agreement," they simulate the brain's need for a unified output. Let's go with Points for **Unified Output**. If they submit two different stories, everyone gets zero. This forces the "committee" to compromise, simulating the unity of consciousness without a unifier.

      *(Refining the Timing Conflict)*: To really hit the Multiple Drafts point, the Visuals and Audios need to receive contradictory info about order.
      *   Group V: "You saw the Light first."
