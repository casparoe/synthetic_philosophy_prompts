answer: |-
  # Activity Plan: "The Consensus Protocol"

  **Session Length:** 90 Minutes
  **Participants:** 9 Postgraduates
  **Goal:** To simulate the fragmentation of perceptual processing and the constructive nature of the final "report" (conscious experience) without a central decider.

  ---

  ## 1. Setup & Materials (Pre-Session)

  **Room Layout:**
  *   **The Periphery:** Two corners of the room. One marked "V-Channel" (Visual), one "A-Channel" (Auditory).
  *   **The Center:** A table with a whiteboard (or large notepad) and markers. This is the "Narrative Board."
  *   **Seating:** The 3 Editorial nodes sit at the Center table. The 6 Sensory nodes sit in the Periphery corners (facing away from the center).

  **Materials:**
  *   **Stimulus Device:** A laptop or phone capable of playing a beep and flashing the screen (or a physical lamp and a buzzer).
  *   **Role Cards (9 total):**
      *   3x **Visual Processor** cards.
      *   3x **Auditory Processor** cards.
      *   3x **Narrative Weaver** cards.
  *   **Data Slips (6 total):** Small folded papers given *only* to the Sensory Processors.
      *   2x "Priority: Light First"
      *   2x "Priority: Sound First"
      *   2x "Priority: Simultaneous"
      *   *(Note: These contradict the actual physical event, simulating neural latency noise).*
  *   **Score Sheet:** Kept hidden by the Facilitator.
  *   **Whiteboard Eraser:** Must be used aggressively.

  ---

  ## 2. The Rules (Read Aloud - 5 Mins)

  *Do not mention philosophy, consciousness, or Dennett.*

  "Welcome to the Consensus Protocol. You are a distributed system. Your goal is to maximize Group Points over three rounds.

  1.  **Roles:**
      *   **Sensory Processors (6):** You will receive a stimulus. You will also receive a private Data Slip telling you what you *detected*. You may speak only to the Weavers.
      *   **Narrative Weavers (3):** You sit at the Board. You cannot see or hear the stimulus. You rely entirely on reports from the Processors. You may write on the Board, but you **cannot speak**.
  2.  **The Output:** At the end of each round, the Weavers must produce a single sentence on the Board describing the event (e.g., 'The light flashed before the beep').
  3.  **The Wipe:** Between rounds, the Board is wiped clean. No memory persists except what you retain personally.
  4.  **Scoring:** Points are awarded at the end of the session. I will not tell you the criteria yet, other than to say: **Disagreement is costly.**"

  ---

  ## 3. The Game (35 Mins)

  **Round 1: The Noise (10 Mins)**
  *   **Action:** Facilitator triggers Light and Sound (simultaneous).
  *   **Distribution:** Hand out Data Slips.
      *   Give the "Light First" slips to two Visuals.
      *   Give the "Sound First" slips to two Audios.
      *   Give "Simultaneous" to the remaining Visual and Audio.
  *   **Process:** Sensory nodes shout reports to the Weavers. Weavers try to write a consensus sentence.
  *   **Predictable Failure:** Chaos. Everyone talks at once. Weavers try to appoint a leader. The Board gets messy.
  *   **The Wipe:** Facilitator erases the board immediately after the sentence is finalized.

  **Round 2: The Bottleneck (10 Mins)**
  *   **New Rule:** Sensory Processors cannot speak until tapped on the shoulder by a Weaver. Weavers can only tap one person at a time.
  *   **Action:** Trigger Light and Sound (Light actually 100ms *before* Sound this time).
  *   **Distribution:** Shuffle the Data Slips. Some people now have data that contradicts the physical reality *and* contradicts each other.
  *   **Process:** Weavers must query the sensory nodes to build the story.
  *   **Predictable Failure:** Weavers realize they are building a story from conflicting testimony. They will try to "average" the data. The Board fills up, then gets wiped. The story might change mid-writing.

  **Round 3: The Final Draft (15 Mins)**
  *   **New Rule:** Weavers can write on the Board, but if they erase *anything* they wrote, the group loses a significant point penalty (Facilitator tracks this silently).
  *   **Action:** Trigger Sound and Light (Sound actually *before* Light).
  *   **Distribution:** Hand out slips that strongly suggest the opposite order (e.g., Visuals get "Light First", Audios get "Sound First").
  *   **Process:** The group must produce a Final Report. They know the data conflicts. They know they need consensus. They must decide whether to report the *data* or a *coherent story*.
  *   **The Climax:** They will likely agree on a narrative that smooths over the contradictions, even if it contradicts some of their private slips.

  ---

  ## 4. The Reveal & Scoring (10 Mins)

  **Reveal the Hidden Scoring Criteria:**
  1.  **Unity Bonus (50 pts):** Awarded only if the Final Report was a single sentence agreed upon by all 9 members. (If even one person dissented, 0 pts).
  2.  **Authority Penalty (-10 pts per instance):** If any single person was identified by the group as the "Decider" or "Leader" during the game, points are deducted. (Facilitator notes who took charge).
  3.  **Consistency Bonus (50 pts):** Awarded if the Final Report was internally logical (no "A before B and B before A"), regardless of whether it matched physical reality.

  **Tally the Score:**
  *   Most groups will lose Authority Points because someone inevitably tried to lead.
  *   Most groups will gain the Consistency Bonus because they fabricated a smooth narrative to avoid the "Disagreement is costly" rule.

  ---

  ## 5. Debrief: Mapping the Failure to Dennett (30 Mins)

  *Now you introduce the theory. Connect their frustration to the text.*

  **A. The Cartesian Theatre (The Intuition they fought)**
  *   **Ask:** "During Round 1, what was your instinct when the reports conflicted?"
  *   **Likely Answer:** "We looked for someone to make the final call." or "We wanted to see the raw footage ourselves."
  *   **The Point:** You were looking for the **Cartesian Theatre**. You assumed there must be a place (the Board) or a person (the Head Weaver) where the 'real' experience happens. Dennett argues this is a category error. There is no place in the brain where 'it all comes together.'

  **B. The Multiple Drafts (The Mechanics they used)**
  *   **Ask:** "In Round 3, did you report what actually happened, or what made the best story?"
  *   **The Point:** This is the **Multiple Drafts Model**. The Visual and Audio nodes were parallel processes (drafts). The Narrative Weavers weren't 'consciousness'; they were just another layer of editing.
  *   **Key Concept:** **Postdiction.** In Round 3, you likely changed your memory of the order to fit the narrative. Dennett argues our brain does this constantly. The "experience" of the order is fixed *after* the fact by the narrative draft, not by the raw signal.

  **C. Stalinesque vs. Orwellian (The Scoring)**
  *   **Explain:** Philosophers used to argue: Does the brain falsify data *before* it reaches consciousness (Stalinesque show trial) or *after* (Orwellian historical revision)?
  *   **The Game:** In Round 3, when you ignored the Data Slips to agree on a story, was that Stalinesque (ignoring the input) or Orwellian (rewriting the memory)?
  *   **Dennett's Punchline:** It doesn't matter. The distinction dissolves. There is only the final draft that gets published (spoken). If the group report says "Light First," that *is* the experience, regardless of the neural latency.

  **D. The "Committee Without a Chair"**
  *   **Ask:** "Who was in charge?"
  *   **The Point:** Your flatmate was right. It is a committee. But unlike a human committee, there is no Chairperson. The "Unity" you felt in the Final Report was an illusion produced by the constraint to speak as one voice. Consciousness is the *output*, not the *container*.

  ---

  ## 6. Limitations of the Model (Honest Note - 10 Mins)

  *End with critical reflection so they don't take the metaphor too literally.*

  **The "Homunculus" Trap:**
  "Today, you played the roles of Visual, Audio, and Editor. You were little people inside the head. Dennett would say this game actually *reinforces* the error we are trying to avoid.
  *   **In the game:** There were distinct agents (you) passing information.
  *   **In the brain:** There are no little people. There are just neurons firing. The 'Visual Processor' isn't a thing; it's a cascade of activations.
  *   **The Limit:** The game implies there *is* a final report written on the board. Dennett suggests there isn't even a final board. There is just the verbal behavior itself. The 'stream of consciousness' is a fiction we tell when asked 'What are you thinking?'
  *   **Takeaway:** Use the game to feel the *fragmentation*, but discard the idea that the 'Editors' are real. They are just more drafts."

  ---

  ## Facilitator Cheat-Sheet: Predictable Problems

  1.  **The "God Mode" Player:** One student will try to stand up and look at the stimulus device to get the "truth."
      *   *Response:* Disqualify them for that round. This proves the point: we don't have access to the "truth" of our own perception, only the processed data.
  2.  **The Scribe Dictator:** One Weaver will try to write without input from the others.
      *   *Response:* Remind them of the "Authority Penalty."
  3.  **Boredom/Confusion:** If Round 2 drags, cut it short. The frustration is the data. If they aren't frustrated, they aren't feeling the lack of a central controller.
  4.  **Timekeeping:** Keep the rounds tight. The pressure forces the "quick and dirty" narrative construction that characterizes real-time perception.

  ## Timeline Summary

  *   **00-05:** Welcome & Rules (No Theory).
  *   **05-15:** Round 1 (Chaos).
  *   **15-25:** Round 2 (Bottleneck).
  *   **25-40:** Round 3 (Conflicting Data & Final Report).
  *   **40-50:** Scoring Reveal & Initial Reaction.
  *   **50-80:** Debrief (Connecting to Cartesian Theatre & Multiple Drafts).
  *   **80-90:** Limitations & Wrap Up.
