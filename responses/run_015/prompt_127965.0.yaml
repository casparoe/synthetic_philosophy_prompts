answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], I work on the backend team with Raj.

  Looking around this room, I see two groups. One group knows Raj as the guy who fixes the Wi-Fi and talks about "merge conflicts" at Thanksgiving. The other group knows Raj as the person who unblocks your PR at 11 PM on a Friday. Usually, a retirement speech tries to bridge that gap by talking about Raj's "heart of gold." People say he was naturally kind, naturally patient, naturally wise.

  But I want to propose something different. I want to suggest that Raj wasn't born this way. And actually, saying he was "naturally good" might be the biggest insult we could pay him.

  There's an old idea from a philosopher named Xunzi. He argued that human nature isn't innately good. We're all born a bit messy, impulsive, and self-centered. Goodness isn't a seed inside us waiting to bloom; it's something we build. We build it through *li*—rituals. Repetitive, structured practices that shape us into better people.

  For Raj, those rituals weren't incense and bows. They were code reviews. They were writing documentation when everyone wanted to rush. They were the unglamorous ritual of saying "no" to feature bloat because it would create technical debt for the next guy.

  Think about how boring that sounds. Doing the same thing over and over? Checking other people's work carefully? That doesn't sound like "natural genius." That sounds like discipline. Raj became a good mentor not because he had a special soul, but because he showed up to the rituals of maintainership even when he was tired. He crafted himself into the person we know through thousands of small, correct actions.

  This connects to another idea called *zhengming*, or the "rectification of names." It means that if you use a label, you have to live up to what that label demands. If you call yourself a "Maintainer," that's not just a job title. It's a promise. It means you perform the duties of a Maintainer.

  We've all seen people who have the title but don't do the work. Raj was the opposite. He made the name "Maintainer" mean something true again. He aligned the reality with the label. When Raj said, "I'll handle this," the name matched the action. In a world of vague job descriptions and shifting responsibilities, that integrity is rare.

  Finally, there's the idea of relationships. Confucian ethics isn't about how you treat strangers in the abstract; it's about how you inhabit specific roles relative to others. Mentor to mentee. Peer to peer. Senior to junior.

  Raj knew that being a good engineer wasn't just about writing clean code. It was about writing clean code *so that* the junior dev could learn. It was about arguing fiercely in a design meeting *so that* the product team wouldn't fail later. He understood that his morality was relational. He was good *because* he was good to us, in specific ways, within specific roles.

  So, where is Raj's legacy now that he's retiring?

  Some speeches say, "He'll be watching over us." But Confucianism is strictly this-worldly. There's no watching from above. The legacy isn't in memory; it's in structure.

  Raj's legacy is that he taught us how to inhabit these roles. Because of him, when I review a junior dev's code, I try to be patient like he was. When you say "no" to a bad feature, you're performing the ritual he taught you. He isn't leaving the building; he's leaving his patterns in our workflow. He built a system of goodness that runs without him.

  Raj, you didn't just write code. You wrote the culture. You rectified the name of what it means to be one of us. Thank you for the rituals, thank you for the relationships, and thank you for showing us that greatness is something you build, one commit at a time.

  To Raj.

  ***

  **Note on Philosophical Liberties**

  This toast takes three specific liberties with classical Confucian thought to make it fit a modern tech context:

  1.  **Extending *Wulun* to Professional Roles:** The traditional Five Relationships (*wulun*) are strictly familial or political (ruler/subject, father/son, etc.). Applying this to "maintainer/contributor" or "senior/junior dev" is a functional analogy, not a textual one. A strict traditionalist might argue that workplace roles lack the sacred weight of kinship. I would change this framing if the audience believed that professional relationships are purely transactional contracts rather than moral commitments requiring mutual obligation.
  2.  **Xunzi's *Li* as Agile Practices:** Xunzi's *li* (ritual) was designed to curb desire and create social harmony in a pre-modern state. Equating this to code reviews and documentation treats engineering hygiene as moral cultivation. This leans on a contested reading that "professional best practices" are equivalent to "ethical rituals." I would abandon this if one argues that technical diligence is morally neutral skill-building rather than character formation.
  3.  **Zhengming and Job Titles:** "Rectification of Names" was originally about restoring social order so that language matched reality in governance (e.g., a "ruler" must act like a ruler). Applying this to job titles assumes a corporation functions like a moral polity. If one argues that corporate titles are merely economic descriptors with no ethical content, the *zhengming* argument collapses. I would change this framing if the goal was to critique the hierarchy itself rather than validate the individual's performance within it.
