  I am preparing the questions for a colloquium Q&A with the author of a recent monograph that modifies Daniel Dennett’s taxonomy of minds. She argues that the boundary between Popperian and Gregorian creatures is not a discrete evolutionary leap but a continuum mediated by what she calls “symbolic scaffolding density.” On her view, large language models instantiate a previously unrecognised intermediate category—“scaffolded Gregorianism”—in which an agent inherits culturally transmitted symbolic structures without possessing the internal, hypothesis-testing architecture characteristic of Popperian cognition. The audience will be philosophers of mind and cognitive scientists familiar with the fourfold framework but not with her specific refinement.

  Write me a sequence of eight to ten interview questions that avoid generic biography or requests for overview. I want the first three to press on how “scaffolded Gregorianism” differs, in mechanistic terms, from sophisticated Skinnerian reinforcement learning in LLMs—anticipating her likely reply that scaffolding involves normative, not merely statistical, constraint—and including follow-ups that ask whether that normativity is observer-relative or built into the scaffold itself. Then include two questions that challenge the gradient claim against Dennett’s original binary: one asking whether her framework can accommodate the classic objection that genuinely Popperian creatures must be able to represent false hypotheses internally, and whether LLMs do so only derivatively, with a follow-up keyed to her probable appeal to “functional falsehood”; and one asking whether dissolving the Popperian/Gregorian boundary undermines Dennett’s evolutionary narrative about the adaptive value of internal modelling. Next, include a question about what empirical finding—whether in comparative cognition or in AI interpretability—would genuinely threaten her view rather than merely prompting a relocation of LLMs elsewhere within the taxonomy. Finally, include a closing question that asks whether her framework entails that a sufficiently dense symbolic scaffold could, in principle, convert a Darwinian creature into a Gregorian one without any change in its internal neural architecture, and what that implies for the ontology of mind kinds.

  Please write your response in British English, using British spelling and punctuation conventions throughout.
