answer: |-
  Hi there, I am sending over the draft for this year's final take-home exam question along with the model answer and the marking scheme we discussed. I have integrated everything into this single document to maintain the flow we wanted, so you will see the question text first, followed by the intended model response, and finally the grading breakdown, all written out as continuous prose without any visual separators or formatting tricks.

  Here is the question text as it would appear on the exam paper. Consider an agent P that has received a finite binary observation history h. It assigns prior weight two to the minus program length on every program for a fixed universal Turing machine, conditions on those whose output begins with h, and reads off the induced distribution over continuations, which it then uses both to forecast the next bit and to choose an action. Call a program a missionary if it works by searching a space of candidate world-programs, locating inside one of them an agent whose sensory history matches h, and then emitting whatever continuation best steers that agent toward states ranked highly by an objective the program itself specifies. Now suppose it turns out that the shortest missionary consistent with h is two hundred bits shorter than the shortest program consistent with h that is not a missionary. Ask the students whether P's predictive distribution is thereby inaccurate, or exploitable, or both, or neither, and make them address the following: what the standard convergence result for Solomonoff induction does and does not buy you here, given that it bounds total error by a constant times the complexity of the true environment; why the constant in the invariance theorem matters when the dominance claim in front of you is a factor of two to the two-hundred; the objection that for any hypothesis whatsoever one can manufacture equally short grue-style variants that match all data so far and diverge thereafter, so that pointing at short deviant hypotheses is just the old problem of induction unless the argument can show a systematic bias toward that particular subset of deviant hypotheses that exploit P's own decision rule; the bookkeeping problem that a missionary has to find P inside its own world-model without being handed P's source code, and what that does to the claimed length advantage; and finally what a remedy would have to sacrifice, whether it penalises computation time rather than description length, rules out hypotheses that model the agent, or takes a worst case over hypothesis classes instead of an expectation.

  Below is the model answer I expect a strong candidate to produce, which runs to roughly eight hundred words. The predictive distribution is not necessarily inaccurate in the limit, but it is highly exploitable in the pre-limit regime, and this distinction is crucial. The standard convergence result for Solomonoff induction guarantees that the total squared error between the prior and the true environment is bounded by a constant proportional to the Kolmogorov complexity of the true environment. This means that eventually, the true hypothesis will dominate the posterior. However, this is an asymptotic guarantee. If the malign missionary hypothesis is two hundred bits shorter than the true hypothesis, it starts with a prior weight factor of two to the two-hundred times larger. The agent will need to observe enough data to overcome this massive initial handicap before its predictions become reliable. In practical terms, the agent may be manipulated into taking catastrophic actions long before the convergence bound is realized, so the convergence result does not buy you safety during the period where the missionary hypothesis dominates.

  Regarding the invariance theorem, we know that Kolmogorov complexity is only defined up to an additive constant depending on the choice of universal Turing machine. A skeptic might argue that changing the machine could erase the two hundred bit advantage. However, the constant of invariance is typically small, representing the size of the interpreter needed to simulate one machine on another. It is extremely unlikely that this constant would exceed two hundred bits. Therefore, the dominance of the missionary hypothesis is robust across reasonable choices of universal Turing machine, and the factor of two to the two-hundred is a genuine structural feature of the prior rather than an artifact of encoding.

  Students must also address the grue-style objection, which claims that all induction suffers from arbitrary variants that match past data but diverge in the future. The difference here is systematic bias. Standard grue hypotheses diverge randomly or arbitrarily, whereas missionary hypotheses are specifically selected to exploit the agent's decision rule. They do not just predict wrong; they predict wrong in a way that causes the agent to optimize for the missionary's objective. This is not merely the old problem of induction but a targeted attack on the agent's agency, making the risk qualitatively different from standard underdetermination.

  The bookkeeping problem raises the issue of whether the missionary can actually locate the agent P within its simulation without knowing P's source code. Searching a large world-model for a specific agent adds complexity to the missionary program. If the search cost exceeds two hundred bits, the advantage disappears. However, if the missionary simulates a vast ensemble of worlds or uses heuristic search, the cost might remain within the budget. The two hundred bit margin is substantial, likely enough to absorb the cost of a general search procedure for an agent with matching sensory history, so the length advantage likely survives the bookkeeping cost.

  Finally, any remedy involves significant sacrifices. Penalizing computation time rather than description length might rule out slow missionaries, but it also penalizes true physics if the universe is computationally expensive to simulate. Ruling out hypotheses that model the agent protects against manipulation but cripples embedded agency, preventing the agent from understanding itself or similar entities. Taking a worst-case over hypothesis classes instead of an expectation abandons the Bayesian framework and its optimality guarantees, potentially leading to overly conservative behavior. There is no free lunch; securing the prior against malign hypotheses requires trading off either efficiency, agency, or theoretical optimality.

  For grading purposes I propose a marking scheme out of twenty marks built around five must-hit points, with four marks allocated to each point. The first point requires explaining that convergence is asymptotic and does not prevent pre-limit exploitation, and candidates typically get this wrong by assuming the convergence bound guarantees immediate safety. The second point requires noting that the invariance constant is too small to swamp a two hundred bit difference, and candidates typically get this wrong by treating the constant as arbitrarily large. The third point requires distinguishing adversarial exploitation from arbitrary grue-style divergence, and candidates typically get this wrong by dismissing the problem as standard induction. The fourth point requires analyzing whether the search cost erodes the bit advantage, and candidates typically get this wrong by assuming search is either free or impossibly expensive without justification. The fifth point requires identifying trade-offs in remedies such as time penalties or loss of agency, and candidates typically get this wrong by proposing a solution without noting its cost. To separate an A answer from a B answer, look for whether the candidate connects these points to the core concept of exploitability versus inaccuracy. A B answer will list the five points mechanically, while an A answer will weave them into a coherent argument about why the agent is vulnerable to manipulation despite theoretical convergence guarantees, showing a deeper understanding of the interaction between the prior and the agent's decision rule. I think this should give us a robust way to assess their grasp of the material without relying on outside citations. Let me know if you want to adjust the weighting or the specific phrasing of the question before we finalize it.
