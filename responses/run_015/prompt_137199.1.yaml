answer: |-
  This is a strong skeleton. You're effectively trying to pivot the debate from *consequentialist individualism* (did I change the outcome?) to *structural complicity* (am I upholding the system?), but you're trying to solve the structural problem with a coordination mechanism. That's ambitious.

  Here are the five points you asked for, aimed at stress-testing the draft before you write it.

  ### 1. Is the answerability diagnosis doing real work?
  It *can*, but only if you rigorously decouple "participation" from "causal contribution."
  If your definition of "participating in a harmful practice" ultimately cashes out as "being a necessary link in the causal chain," then answerability is just causality in moral clothing. The inefficacy objection wins because, in threshold/continuous cases, you often *aren't* a necessary link.
  To make answerability do the work, you need to ground it in something non-causal: **benefit** or **intentional alignment**. You are answerable not because you broke the machine, but because you are riding in it while it runs people over.
  *   **The Trap:** If you don't specify the ground of answerability, a reader will assume you're just smuggling in a "fair share" argument. If the ground is fairness, you need to explain why fairness demands *conditional exit* rather than *unilateral abstention* (which is the usual fair-share move).
  *   **The Fix:** Explicitly state that answerability attaches to *agency within a practice*, not *outputs of a practice*. You are answerable for your will's alignment with the harm, not just the harm's magnitude.

  ### 2. The weakest premise in "Conditional Exit"
  The weakest link is the **legibility requirement** ("in a way they can see").
  In the voting case, legibility is built-in (public records, polls). In the meat/flying case, it is empirically false. My supermarket does not know if I bought the chicken because I'm waiting for my neighbor to stop, or because I'm hungry. There is no channel for this signal.
  *   **If you drop it:** If you remove the public/legible constraint, "Conditional Exit" collapses into a private maxim: "I will abstain if I believe others will." This is just expected utility theory with a probability variable attached to other people's behavior. You lose the distinctiveness of your account.
  *   **If you keep it:** You have to explain *how* an individual makes their consumption legible to the aggregate. Joining a pledge group? Wearing a button? If the mechanism for legibility is costly or non-existent, the duty becomes impossible to fulfill.
  *   **Recommendation:** Narrow the scope. Admit this only applies where *coordination mechanisms exist* (e.g., unions, divestment campaigns, pledges). This sacrifices universality but saves the argument from empirical falsification.

  ### 3. Is the reply to sign-uncertainty cheating?
  It is slightly cheeky, bordering on cheating.
  You argue: "Sign uncertainty applies to everything, so it can't explain the specific pull of the inefficacy objection."
  *   **The Problem:** The inefficacy objection has traction *precisely because* collective harm cases have uniquely high sign uncertainty compared to paradigmatic moral cases (punching someone, stealing a wallet). In standard cases, the sign is positive and known. In collective harm, the causal chain is so diffuse that market leakage (Jevons paradox, price elasticity) makes the sign genuinely ambiguous.
  *   **The Fix:** Don't dismiss the worry as general. Instead, argue that **coordination is the only rational response to sign uncertainty.** Unilateral action is a gamble; conditional action is a hedge. Even if the sign is unknown, coupling your behavior to others reduces the variance of your moral risk. You aren't solving the uncertainty; you're distributing it.

  ### 4. Does it over-generate? (The Moral Overload Problem)
  Yes. You are embedded in thousands of diffuse harmful practices (carbon, labor exploitation, data privacy, tax avoidance).
  *   **The Risk:** If you have a duty to establish conditional exit strategies for all of them, you have no time to actually exit anything. You become a full-time moral signal-manager.
  *   **Stopping Rule:** You need a **feasibility constraint**. The duty to arrange conditional exit only triggers if:
      1.  The harm is severe (threshold).
      2.  A coordination mechanism is *available* or *cheap to create*.
      If no mechanism exists (e.g., there is no "conditional meat-buying club" in your town), the duty dissolves or reverts to a weaker duty (e.g., donation).
  *   **Why this matters:** Without this, your theory implies that the most morally conscientious person is the one with the best administrative capacity to track their commitments, which feels wrong.

  ### 5. The Killer Objection
  **The "Perpetual Complicity" Objection.**
  Your duty is to exit *if and only if* others exit.
  *   **The Scenario:** Suppose everyone reasons this way. I wait for you to signal; you wait for me to signal. No one signals. The condition is never met. Therefore, no one exits.
  *   **The Bite:** Your theory risks rationalizing the status quo. It turns the duty to exit into a duty to *wait*. If the "conditional" part is strict, you are morally permitted to continue harming as long as others do, even if a unilateral move *could* have sparked the cascade you're waiting for.
  *   **Is it answerable?** Only if you build in a **trigger clause**. You must argue that "Conditional Exit" includes a duty to *initiate* the signaling if no signal exists. But if you add that, you're back to unilateralism (which you wanted to avoid).
  *   **Verdict:** This is the point where the framing might be wrong. You need to explain why *waiting* is morally distinct from *complicity*. If you can't, the paper argues for a sophisticated form of free-riding on moral courage.

  **Summary Advice:**
  The "Answerability" pivot is your strongest philosophical move; the "Conditional Exit" mechanism is your weakest empirical move. Consider framing Conditional Exit not as the *content* of the duty, but as the *strategy* for discharging the duty of answerability. This lets you admit that sometimes the strategy fails (no legibility), but the duty remains (find another way to answer for your participation). This saves you from the "Perpetual Complicity" trap.
