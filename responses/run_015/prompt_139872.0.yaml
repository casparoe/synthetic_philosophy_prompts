      *   **My Stance:** Treat counterexamples (finks, masks, mimics) as engineering problems to be solved by tweaking the analysis, not as refutations. I can add machinery (hold intrinsic basis fixed, require response issue from basis, weaken 'would' to 'might', etc.). I can concede specific formulations are dead but not the whole project. I will not concede dispositions = categorical bases.
      *   **Constraints:** Stay in character, short paragraphs (1-2), argue in own words (no citations/reading lists), don't be a pushover (identify old counterexamples if applicable).
