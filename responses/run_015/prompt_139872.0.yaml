      *   I need to defend the conditional analysis against the Masker (Vase 1) and the Mimic (Vase 2).
      *   *Standard Move:* The Simple Conditional Analysis (SCA) says $x$ is fragile iff if $x$ were struck, $x$ would break.
      *   *Problem:* Vase 1 breaks the "if struck then break" condition (it doesn't break). Vase 2 satisfies it (it breaks) but isn't fragile.
      *   *My Defense:* I need a refined analysis. Let's call it the "Intrinsic Basis Counterfactual Analysis."
      *   *For Vase 2 (Mimic):* The breaking doesn't result from the intrinsic structure relevant to fragility (the molecular bonds of porcelain vs. polymer). It results from an added external device (the charge). So, the counterfactual must specify: "If struck, *in virtue of its intrinsic structure*, it would break."
      *   *For Vase 1 (Masker):* The breaking *would* happen if the masker weren't there. The counterfactual needs to hold the intrinsic basis fixed but allow us to subtract the interfering external factor. Or, we look at worlds where the masker fails.
      *   *The Tension:* The user says I can't have both. If I require the breaking to happen in the actual world conditions, Vase 1 fails. If I ignore actual world conditions, Vase 2 might pass (if the charge is part of the object).
      *   *The Solution:* I need to specify the *conditions* of the counterfactual carefully. The standard Lewis-style move is to hold the intrinsic basis fixed and remove the interferers.
