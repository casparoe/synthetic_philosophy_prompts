answer: |-
  Look, you're dressing up old friends in museum gear, but I know them when I see them. Vase two is a mimic, and vase one is a mask. You say they pull in opposite directions, but I say they point to the same fix: the counterfactual needs to be tied to the *intrinsic basis* of the disposition, not just the raw outcome in the actual environment. For the polymer vase, the shattering doesn't flow from the molecular structure that constitutes fragility; it flows from an implanted charge. So my analysis isn't just "if struck, it breaks," it's "if struck, its intrinsic structure would cause it to break." The polymer fails that test because its intrinsic structure is tough; the breaking is an extrinsic add-on.

  For the porcelain, you're insisting I need actual shattering to evaluate the clause, but that's begging the question. I don't need the break to happen in the actual world with the stabilizer running; I need it to happen in the nearest worlds where we hold the intrinsic basis fixed and subtract the interferer. The fact that the detector is listening for fragility doesn't make the resin internal to the vase. It just means the mask is reliable. You're conflating the evidence for fragility with the truth conditions for it. The vase is fragile because of what it *would* do if the museum stopped babying it, regardless of whether the detector's sensitivity makes that scenario hard to arrange. The detector tracks the disposition; it doesn't constitute it.
