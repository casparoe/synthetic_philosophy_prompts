      *   **Goal:** Provide a philosophically rigorous assessment/advice on the validity of her consent.

  2.  **Analyze Issue 1: Framing and Cognitive Vulnerability (The Epistemic Condition):**

      *   *Standard View:* Informed consent requires disclosure, comprehension, and voluntariness. Disclosure was technically accurate. Comprehension was clause-by-clause but holistic understanding was flawed due to framing.
      *   *Philosophical Angle:* Autonomy requires not just information, but *usable* information.
      *   *Key Concept:* "Nudging" vs. "Manipulation."
      *   *Key Concept:* "Structural Deception" or "Epistemic Exploitation."
      *   *Relevant Literature:*
          *   Faden & Beauchamp (history of coercion/deception).
          *   Thaler & Sunstein (Nudge theory - usually benign, but can be malign).
          *   Susannah Shaw (Framing effects in consent).
          *   Daniel Susser et al. (Online manipulation/hidden influence).
          *   *Crucial Distinction:* Is the framing intended to aid understanding or to bias decision-making? If the framers *knew* her profile (or a general profile) and chose a frame that obscures risk to increase enrollment, it borders on deception.
          *   *The "Lie" vs. "Misleading Truth":* Gricean pragmatics. Implicature can deceive even if semantic content is true.
          *   *Cognitive Asymmetry:* If the institution knows the target demographic struggles with relative frequencies but uses them anyway to minimize perceived risk, this violates the spirit of *understanding*.
      *   *Conclusion on Issue 1:* It's not binary deception (lying), but it is *manipulation* that undermines the epistemic condition of autonomy. It exploits a known cognitive bias (framing effect) in a high-stakes context.

  3.  **Analyze Issue 2: Employer Pressure (The Voluntariness Condition):**

      *   *Standard View:* Coercion requires a threat that makes the victim worse off relative to a moral baseline if they refuse.
