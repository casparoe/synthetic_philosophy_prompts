      *   *Let's go with the "Feral Adult" case.* If raised in isolation (no culture), learns language, but lacks property norms. Is she exempt? If yes, M. should be exempt (cultural isolation). If no, M. is responsible (cultural upbringing doesn't exempt). This tests whether the commune is treated as "bad upbringing" (Waiter) or "developmental deprivation" (Child).

