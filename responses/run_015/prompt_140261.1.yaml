      *   *Dementia man striking nurse:* Objective attitude (Exemption). Resentment unfitting.
      *   *Six-year-old tormenting kid:* Not full participant (Exemption/Partial). Correct/train, don't resent.
      *   *Manic episode wrecking kitchen:* Objective attitude (Exemption).
      *   *Woman cruel to waiter (bad upbringing):* Full participant. Resentment fits. Upbringing explains but doesn't exempt.
