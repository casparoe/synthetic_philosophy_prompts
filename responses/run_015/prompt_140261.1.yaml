  3.  **Analyze the New Case (M.):**
      *   *Background:* 40 years in a commune (no ownership/permission norms).
      *   *Capacity:* Capable of participant attitudes generally (gratitude, resentment, guilt regarding kids).
      *   *Specific Deficit:* Doesn't hear ownership/permission claims as *reasons*. Understands them but leaves her cold.
      *   *Motivation:* Complies out of prudence, not moral recognition.
      *   *Action:* Took bike without asking (no malice, just want/need).
      *   *Key Question:* Is this an exemption (like dementia/child), an excuse (like coercion/depression), or full responsibility (like bad upbringing)?

  4.  **Identify Competing Rules:**
      *   *Rule A (Capacity-Based/Structural):* Exemption applies if the agent lacks the specific normative competence relevant to the action. M. lacks the specific "ownership reason" competence, even if she has general reactive attitudes. This aligns with the child/dementia cases (lack of capacity).
      *   *Rule B (History-Based/Character):* Exemption applies only if the capacity is globally impaired or temporarily suspended (dementia, mania). Bad formative history (commune vs. cruel upbringing) does not exempt if general participant capacity exists. This aligns with the "cruel waiter" case (bad upbringing doesn't exempt).

      *Wait, let's refine.*
      *   *Rule 1 (General Competence):* If you are capable of participant attitudes generally (gratitude, guilt about kids), you are a full participant. Specific normative blind spots due to upbringing are like the cruel waiter's upbringing. Verdict: Resentment fitting.
      *   *Rule 2 (Specific Normative Competence):* If you cannot recognize a specific class of moral reasons (ownership) as reasons, you are exempt regarding those actions, similar to how a child is not yet a full participant. Verdict: Exemption (Objective attitude) or perhaps Excuse.

      *Let's look at the "Cruel Waiter" case.* Bad upbringing -> Full responsibility.
      *Let's look at the "Child" case.* Immaturity -> Not full participant.
      *Let's look at the "Commune" case.* Is it like bad upbringing (Rule 1) or like immaturity/structural incapacity (Rule 2)?

      *Competing Rules:*
      1.  **The General Capacity Rule:** If an agent possesses general reactive attitudes (guilt, resentment), they are responsible. Specific normative blind spots caused by socialization (commune vs. cruel home) are irrelevant. (Predicts: Resentment fitting).
      2.  **The Normative Access Rule:** Responsibility requires access to the specific reasons underlying the demand. If ownership claims literally don't register as reasons (not just ignored, but "cold"), the agent is exempt regarding those claims, akin to the child not yet grasping moral norms. (Predicts: Exemption/Objective attitude).

  5.  **Predict Supervisor's Preference:**
      *   Strawson emphasizes the *participant stance* within a community. The cruel waiter case is key: "a bad upbringing explains and doesn't exempt." This suggests the supervisor favors holding people accountable despite formative deficits, provided they are currently functional adults. M. understands the rules, even if unmoved. She complies out of prudence. This looks more like the cruel waiter (socialized differently) than the child (developmentally incapable).
      *   *Prediction:* Resentment fitting. Rule 1 (General Capacity).
      *   *Reasoning:* Strawsonians typically resist exempting based on deterministic backstory (upbringing). M. is functionally adult and capable of guilt/resentment elsewhere.

  6.  **Design a Tie-Breaker Case:**
      *   Need a case where General Capacity is present, but Specific Normative Access is missing due to something *not* like upbringing.
      *   *Idea:* A neurotypical adult who genuinely lacks a specific moral concept due to isolated brain damage vs. upbringing.
      *   *Better Idea:* Someone who was socially isolated (like M.) but *cannot* learn the norm vs. *won't*.
      *   *Best Tie-Breaker:* A case of "Local Incapacity." Suppose someone understands ownership but literally cannot conceptualize "promise-keeping" due to a specific cognitive deficit, yet feels guilt elsewhere. If the supervisor exempts here but not for M., it's about *capacity* vs. *upbringing*.
      *   *Actually, to distinguish Rule 1 vs Rule 2 specifically on the "upbringing" angle:* Bring a case where the normative blind spot is biological vs. cultural.
