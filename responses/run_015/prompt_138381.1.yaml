answer: |-
  **Issue:** If the counterfactual dependence of the introspective judgment on the phenomenal state is mediated exclusively by their common physical supervenience base, does this relation suffice to provide the epistemic warrant required for knowledge, or does the lack of a causal connection to the phenomenal property itself leave the belief unjustified?

  **Reading:** Supervenience-based sensitivity.

  **Explanation:** This question is substantive because it turns on independent epistemological debates about whether modal reliability without causation constitutes justification, rather than on the semantics of counterfactuals; moreover, its significance depends on the reading chosen because if the deletion-based account were adopted, the counterfactual would be false, rendering the question of warrant moot and collapsing the tracking strategy entirely. Reasonable epiphenomenalists could agree on the metaphysics of the supervenience-based counterfactual while disagreeing on whether such "shadow tracking" satisfies the normative requirements for introspective knowledge.
