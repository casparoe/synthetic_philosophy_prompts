          *   HI Mechanism: Structural gap. Student said "hearer wrongs speaker." This shifts it from structural to interpersonal.
      *   *Revised Grading:*
          *   TI Definition/Core Idea: 2 pts.
          *   TI Example: 1 pt.
          *   TI Mechanism (The Error): -1 pt (out of 2 allocated).
          *   HI Definition/Core Idea: 2 pts.
