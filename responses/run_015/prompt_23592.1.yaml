              *   HI Definition/Mechanism: 3 pts.
              *   HI Example: 2 pts.
      *   *Let's refine based on the error:* The TI mechanism error is significant. It misrepresents the *nature* of the prejudice (conscious vs. unconscious).

  5.  **Evaluate Specific Claims:**

      *   **TI Definition:** Accurate (credibility deficit + identity prejudice).
      *   **TI Example:** Accurate.
      *   **TI Mechanism (Consciousness):** **Wrong.** Fricker emphasizes implicit bias. Requiring conscious intent contradicts the structural/psychological nature of the credibility economy. This should cost points.
      *   **HI Definition:** Accurate (gap in resources).
      *   **HI Example:** Accurate (Fricker's main example).
      *   **HI Mechanism:** Mostly accurate, though slightly individualizes a structural problem ("the hearer wrongs"). It's acceptable for a short essay but could be sharper.

  6.  **Calculate the Grade:**
      *   **TI Section (5 points max):**
