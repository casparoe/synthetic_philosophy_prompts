      *   **Section 1: Testimonial Injustice (TI)**
          *   *Definition:* "wrong that happens when a speaker doesn't get the credibility they deserve, and the reason is a prejudice about their social identity." -> **Correct.** This captures the core definition (credibility deficit due to identity prejudice).
          *   *Example:* "Black patient in a hospital whose reports of pain are dismissed by a white doctor..." -> **Correct.** This is a classic, accurate example often used in discussions of Fricker (similar to the Tom Robinson case or medical bias cases).
          *   *Mechanism/Nature of Wrong:* "The wrong is done to the person in their capacity as a knower..." -> **Correct.** (Intrinsic wrong).
          *   *Claim:* "...and it only happens when the hearer is consciously trying to be unfair to them." -> **Incorrect/Critical Error.** Fricker explicitly argues that testimonial injustice is often *unconscious* or implicit. The prejudice operates at the level of "credibility economy" and stereotypes, not necessarily conscious malice. This is a significant misunderstanding of the mechanism.

      *   **Section 2: Hermeneutical Injustice (HI)**
          *   *Definition:* "gap in the shared vocabulary or interpretive resources of a society, so that someone can't make sense of or articulate an important part of their experience." -> **Correct.** This captures the "hermeneutical marginalization" and "lacuna" concepts well.
          *   *Example:* "before the phrase 'sexual harassment' was widely used..." -> **Correct.** This is Fricker's own paradigmatic example.
          *   *Mechanism/Nature of Wrong:* "In this case, the hearer wrongs the speaker, because without the right concepts the speaker can't be properly understood." -> **Partially Correct/Imprecise.** While the speaker is wronged, Fricker emphasizes that HI is often *structural* rather than a specific interaction where a "hearer wrongs the speaker" in the moment. It's a structural inequality in hermeneutical resources. However, the outcome (inability to be understood) is accurate. The phrasing "the hearer wrongs the speaker" makes it sound more like an individual act (like TI) rather than a structural condition, but it's not a fatal error compared to the TI consciousness claim.

      *   **Distinction:**
          *   The student distinguishes them based on credibility deficit vs. conceptual gap. This is the core distinction.

  4.  **Determine Grading Criteria & Point Allocation:**
      *   Total: 10 points.
      *   Breakdown idea:
          *   Testimonial Injustice (Definition + Mechanism + Example): 5 points.
          *   Hermeneutical Injustice (Definition + Mechanism + Example): 5 points.
          *   *Alternative:* 2 points per requirement (Def TI, Ex TI, Def HI, Ex HI, Distinction/Clarity).
          *   *Better Breakdown for Philosophy:*
              *   TI Definition/Mechanism: 3 pts.
