          5.  Suggestions for Comments to Student.

  8.  **Refining the "Conscious" Error Analysis:**
      *   Why is it bad? Fricker draws on psychological literature on stereotype threat and implicit bias. If it requires conscious intent, it becomes simple discrimination, not *epistemic* injustice in the specific philosophical sense (which operates through the "credibility economy").
