      *   *Centralization:* Administrative centralization (Paris vs. local communes) saps civic virtue. Political centralization can be good for nation-building, but administrative centralization kills local liberty.
      *   *Safeguards:* Decentralization, free press (as a tool for association), independent judiciary (as a legal check on majority will), and crucially, *mores* (habits of the heart) and civil associations.
      *   *The Citizen:* Tocqueville worries about individualism (isolation) leading people to trade liberty for material comfort and order.

  3.  **Address Question 1: Judicial Independence & Media Pluralism:**
