      *   *Ratio Decidendi:* In law, the legal principle. In policy, the causal mechanism (e.g., "appeasement invites aggression").
      *   *Adversarial Brief:* In law, opposing counsel. In policy, Hawks vs. Doves, State Dept vs. Defense Dept, or the "Red Team."
      *   *Distinguishing:* In law, arguing facts differ. In policy, arguing "this time is different."
      *   *Appeal/Overruling:* In law, higher court or later case. In policy, Election, regime change, or historical verdict (decades later).
