  2. The Swap Test fails because it assumes outcomes can remain identical while changing the justificatory vocabulary, but Dennett's core claim is that the vocabulary itself causally produces the compliance and self-control you value. If the language changes, the psychological uptake changes, and the identical outcomes vanish.

  3. The hidden question is empirical but inaccessible: can human moral psychology sustain robust norm compliance without the affective heat of retributive attitudes, or does removing desert-talk inevitably lead to nihilism or free-riding? It masquerades as conceptual because we cannot run the civilization-scale experiment required to settle it.

  4. Progress requires abandoning the abstract debate for comparative institutional analysis, measuring how specific forward-looking regimes actually impact recidivism and norm internalization compared to traditional ones. Without data from real-world attempts at non-retributive justice, the argument remains a stalemate of competing intuitions about human nature.

  5. You will likely have to eat the suspicion that your Dennettian stance is mere bias, because relying on evolved social technologies without full reductionist explanations is rational given the high stakes of coordination. Treating established normative vocabulary as a default until proven dangerous is a valid prior, not a failure of reasoning.
