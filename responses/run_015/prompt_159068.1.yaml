prompt: |-
  Some background before the ask: I spent about thirty years as a lab scientist (microbial ecology, later a lot of data wrangling), retired four years ago, and since then I've been going to a philosophy reading group at the local university's continuing-ed program — my first real exposure to the stuff, so please don't assume I know the vocabulary. I got hooked on 20th-century philosophy of science and recently stalled on that 1951 paper of Quine's attacking the analytic-synthetic distinction. As I understood it: he argues that "analytic" never gets explained without circularity (you try to cash it out as synonymy, or necessity, or semantic rule, and each of those leans on the very notion you were defining), and then adds the holism point that experience tests our claims in blocks, so nothing is in principle immune to revision — which is why he says the boundary was a dogma rather than a discovery. Someone in my group mentioned a reply by Grice and Strawson that our intern insists Quine never really answered. I mention all this only because the abstract question has turned into a very concrete fight on a committee I sit on, and I need to write something for it by next week.

  The committee: I'm one of nine people on the data-standards committee of a mid-sized international scientific union (let's just call it the Union). We maintain a controlled vocabulary and data schema that a few thousand labs submit to, and once a year we vote on revisions. Right now we're fighting over the "core definitions" section. The chair — a senior taxonomist, very practical — has circulated a draft rule that would let us tag certain clauses DEFINITIONAL, glossed as "true in virtue of the meaning of the term, not to be revised on empirical grounds," and she wants those tags to require a supermajority plus a harmonization review before they can change. A subgroup of younger data-science people says any such tag is superstition: they want every clause, definitional ones included, to carry a "last revised" date and an evidence-basis field, revisable by ordinary majority whenever the evidence shifts. The fight is real because of the actual terms on the table: our current entries for gene and for species (we use something like the interbreeding/reproductive-isolation criterion) have both been scrambled by things nobody anticipated a few decades ago — overlapping and RNA-only genes, prokaryotes swapping DNA sideways, organisms that don't have sexes in the relevant sense. I keep thinking of the Pluto reclassification, where a stipulation got voted away after new objects turned up, and I can't tell whether that's a case of a definition being falsified or of a convention being sensibly retired. To try to get us unstuck I sketched a three-way taxonomy for clauses — S-clauses (pure stipulation: we simply fix how a word is used inside the schema), B-clauses (bridge clauses tying a term to a measurement or operational test), and E-clauses (substantive claims about the world that could turn out false) — plus two tests for assigning a clause to a bucket. The "recalcitrance test": imagine an observation the clause handles badly, and ask which the community would actually do — revise the clause, or reinterpret/exclude the case and keep the clause. The "breakage test": count how much downstream machinery (mappings, legacy datasets, crosswalks to other standards) would have to be rebuilt if the clause changed, and score that as a revision cost. I've floated both and got two opposite reactions, which is the problem.

  Our intern, a philosophy PhD student, says the whole taxonomy is Quine's point restated and that recalcitrance is just a sociological fact about how stubborn a community currently is, not a semantic fact about what the clause means — so a "definitional" tag is only ever a claim about who has power to refuse a revision, dressed up as metaphysics. The chair says that's exactly backwards for a standard like ours: a controlled vocabulary is a stipulated framework, the stipulations are what make data from two labs comparable at all, and she has a Carnap-flavored line about meaning postulates being conventions chosen relative to a framework, conventions that are then as "necessary" as you like inside it. My own instinct, as a working scientist, is that the chair is right about practice and the intern is right about principle, and I don't know if that's a genuine distinction or just me ducking the question. So: please draft the decision memo I'll circulate to the committee before we meet on the 14th. It should recommend a concrete course of action with a time frame (approve the chair's tagging scheme as amended, adopt the subgroup's scheme as amended, or something you think is better — e.g. pilot the S/B/E tagging on the two or three contested terms and report back at a named milestone), say how the tag should actually be worded in the standard so it doesn't smuggle in a philosophical claim we can't defend, and tell us whether my three-way taxonomy and my two tests are doing any real work or just relabeling the disagreement. I especially want the strongest version of whichever side you advise against — if you side with the chair, give the intern's best shot at the "nothing is immune" point; if you side with the intern, say honestly what we lose for data interoperability — because both of them will be in the room and I'd rather hand them something they can argue with than something they can dismiss.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User Profile:** Retired lab scientist (30 years, microbial ecology/data wrangling), 4 years retired. Attends philosophy reading group (new to formal philosophy but engaged). Sits on a data-standards committee for an international scientific union.
      *   **The Problem:** A conflict over "core definitions" in a controlled vocabulary/data schema.
      *   **The Parties:**
          *   *The Chair:* Senior taxonomist, pragmatic. Wants "DEFINITIONAL" tags (true by meaning, hard to revise, supermajority needed). Argues from a Carnapian framework/convention perspective (stipulations enable comparability).
          *   *The Subgroup (Younger Data Scientists):* Anti-essentialist/Quinean. Want all clauses revisable by ordinary majority with evidence bases. Argue "definitional" is superstition/power play.
          *   *The Intern (Philosophy PhD):* Supports the Subgroup. Argues Quine shows analytic/synthetic distinction is untenable; "recalcitrance" is just social power, not semantic fact.
          *   *The User:* Torn. Feels Chair is right on practice, Intern right on principle. Proposed a 3-way taxonomy (S/B/E clauses) and 2 tests (Recalcitrance, Breakage).
      *   **The Task:** Draft a decision memo for the committee (9 people) to circulate before the meeting on the 14th.
      *   **Requirements:**
          *   Recommend a concrete course of action (with timeline).
          *   Specify wording for the tag (avoid undefendable metaphysical claims).
          *   Evaluate the User's taxonomy/tests (do they work or just relabel?).
          *   Present the strongest version of the *opposing* view (steelman the side not recommended).
          *   Tone: Professional, clear, accessible (don't assume deep phil jargon but respect the intellectual depth), actionable.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Quine's Point:* The boundary between analytic (true by meaning) and synthetic (true by fact) is not sharp. Any statement can be held true come what may if we make drastic enough adjustments elsewhere in the system (holism). Therefore, calling something "definitional" doesn't make it immune to revision, only *practically* central.
      *   *Carnap's Point (Chair):* We can choose a linguistic framework. Within that framework, certain rules are constitutive. They aren't "true" in an empirical sense; they are the rules of the game. Changing them changes the game (interoperability breaks).
      *   *The User's Taxonomy:*
          *   S (Stipulation): "We use X to mean Y."
          *   B (Bridge): "X is measured by Z."
          *   E (Empirical): "X has property W."
          *   *Critique:* Quine would say S and E bleed into each other. If "Gene" is defined as "DNA sequence coding for protein" (S), and we find RNA genes (E), do we change the definition (S) or say RNA genes aren't genes (E)? The taxonomy tries to draw the line Quine says is blurry.
          *   *Utility:* Despite the philosophical blur, the taxonomy is *pragmatically* useful for data management. It distinguishes between *semantic conventions* and *empirical claims*.

  3.  **Determine the Recommendation:**
      *   *Option A (Chair's Plan):* Risks ossification. If "Species" is defined by interbreeding, and we find asexual organisms, do we exclude them or break the definition? Hard tags make science lag behind reality.
      *   *Option B (Subgroup's Plan):* Risks chaos. If definitions change by simple majority constantly, legacy data becomes unreadable. Interoperability suffers.
      *   *Option C (Hybrid/User's Taxonomy):* This is the sweet spot. Acknowledge the Quinean insight (nothing is *metaphysically* immune) but adopt the Carnapian practice (some things are *procedurally* stable).
      *   *Decision:* Recommend a pilot of the S/B/E taxonomy but rebrand the "DEFINITIONAL" tag to avoid metaphysical baggage. Use "Constitutive" or "Framework" instead of "True by Meaning." Implement the "Breakage Test" as a procedural hurdle, not a semantic truth.
      *   *Why:* It satisfies the Chair's need for stability (high breakage cost = high voting threshold) without validating the Intern's fear of metaphysical dogma (admitting it's a convention, not a truth).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Purpose:** State the goal (resolve the definition tagging impasse).
      *   **Background:** Briefly summarize the conflict (Stability vs. Flexibility).
      *   **Philosophical Context (The "Elephant in the Room"):** Acknowledge the Quine/Carnap debate without getting bogged down. Validate the Intern's critique (Quine is right theoretically) but validate the Chair's need (Carnap is right practically).
      *   **Evaluation of User's Taxonomy:**
          *   Are S/B/E useful? Yes, for *management*, not for *metaphysics*.
          *   Are the tests useful? "Recalcitrance" is sociological (Intern is right), but "Breakage" is economic/technical (Real cost).
      *   **Recommendation:**
          *   Adopt a modified tagging system.
          *   Rename "DEFINITIONAL" to "FRAMEWORK-CONSTITIVE" (avoids "true by meaning").
          *   Tie revision thresholds to the "Breakage Test" (cost of change), not "Truth Status."
          *   Pilot on *Gene* and *Species*.
      *   **Steelmanning the Opposition:**
          *   If recommending the Hybrid/Chair-leaning side, must strongly articulate the Intern/Subgroup view: "You are codifying power structures. Science changes. Don't let data standards strangle discovery."
      *   **Timeline:** Pilot -> Review -> Vote.

  5.  **Refining the Tone and Content:**
      *   *Tone:* Respectful of the science, respectful of the philosophy, decisive.
      *   *Vocabulary:* Avoid heavy jargon (no "modal realism," "a priori," etc.) but use the terms the user introduced (S/B/E, Recalcitrance, Breakage).
      *   *Specific Wording:* The tag needs to be precise. Instead of "True in virtue of meaning," use "Required for Schema Consistency."
      *   *Addressing the User's Doubt:* The user feels they are "ducking the question." The memo should affirm that the "pragmatic middle ground" *is* the answer, not a dodge. It's a Rortyan/Deweyan solution (truth is what works).

  6.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the "Pluto" analogy? *Adjustment:* Use it in the background section to illustrate the tension.
      *   *Check:* Did I give the Intern their due? *Adjustment:* Ensure the "Strongest Case Against" section is compelling, not a strawman. It needs to highlight the risk of "conceptual stagnation."
      *   *Check:* Is the recommendation concrete? *Adjustment:* Specify the voting thresholds and the pilot terms clearly.
      *   *Check:* Did I answer the specific question about the taxonomy? *Adjustment:* Explicitly state that the taxonomy is a *heuristic tool*, not an ontological discovery.

  7.  **Final Polish:** Check date (meeting on the 14th), ensure clear headings, make sure the "Action Items" are distinct. (Self-correction: Ensure I don't sound *too* much like a philosopher; keep it grounded in data standards management).

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Data Standards Committee, International Union [Name Redacted]
  **FROM:** [Your Name]
  **DATE:** 10th of [Month], 2024
  **SUBJECT:** Recommendation on Core Definition Tagging and Revision Protocols
  **MEETING DATE:** 14th of [Month]

  ### 1. Purpose and Context

  This memo addresses the current impasse regarding the "Core Definitions" section of our controlled vocabulary. The Committee is divided between two positions:
  1.  **Stability (Chair's Draft):** Tagging certain clauses as DEFINITIONAL, making them immune to ordinary revision to ensure long-term interoperability.
  2.  **Flexibility (Subgroup Proposal):** Treating all clauses as empirical claims subject to revision by ordinary majority as evidence shifts.

  This disagreement mirrors a classic debate in philosophy of science regarding whether definitions are fixed conventions or empirical hypotheses. As we prepare for the vote on the 14th, this memo evaluates the proposed taxonomy, recommends a concrete procedural path, and clarifies the philosophical stakes without requiring the Committee to adopt a specific metaphysical stance.

  ### 2. Evaluation of the Proposed Taxonomy (S/B/E) and Tests

  I proposed distinguishing clauses as **S-clauses** (Stipulation), **B-clauses** (Bridge/Operational), and **E-clauses** (Empirical), assessed via a **Recalcitrance Test** (would we change the rule or the data?) and a **Breakage Test** (how much downstream code breaks?).

  **Verdict:** The taxonomy is **operationally vital but metaphysically porous.**

  *   **Why it works:** For data management, we *must* distinguish between a rule that structures our database (S) and a claim about the world stored in the database (E). If we treat them identically, we risk breaking legacy mappings every time a biological discovery occurs.
  *   **Why the Intern is right to be skeptical:** The Intern correctly notes that the line between S and E is not discovered in nature; it is drawn by us. The "Recalcitrance Test" measures social stubbornness, not semantic truth. Historically, E-clauses often harden into S-clauses over time (and vice versa). For example, "All swans are white" moved from empirical claim to definitional assumption and back again.
  *   **Conclusion:** We should adopt the S/B/E taxonomy as a **management heuristic**, not as an ontological truth. It tells us how to *handle* the data, not what the data *is*.

  ### 3. Recommendation: The "Framework-Constitive" Pilot

  I recommend we **reject the binary choice** between the Chair's "DEFINITIONAL" tag and the Subgroup's "All Empirical" model. Instead, we adopt a modified tagging scheme that acknowledges the *cost* of change rather than the *truth* of the statement.

  **Action Plan:**
  1.  **Rename the Tag:** Replace "DEFINITIONAL (True in virtue of meaning)" with **"FRAMEWORK-CONSTITUTIVE."**
      *   *Gloss:* "This clause is required for current schema consistency. Revision triggers a major version change and mandatory crosswalk."
      *   *Reasoning:* This removes the metaphysical claim (which the Intern correctly identifies as indefensible) and replaces it with a procedural claim (which the Chair correctly identifies as necessary for interoperability).
  2.  **Tie Voting Thresholds to the Breakage Test:**
      *   **Framework-Constitutive (S-Clauses):** Require Supermajority (75%) + Impact Assessment.
      *   **Empirical/Bridge (B/E-Clauses):** Require Simple Majority + Evidence Citation.
      *   *Reasoning:* This satisfies the Chair's need for stability by making high-breakage changes harder to pass, without claiming those changes are "impossible" or "false."
  3.  **Launch a Pilot:** Apply this protocol exclusively to the contested terms **`gene`** and **`species`** for a 12-month trial.
      *   **Milestone:** Report back to the Committee on [Date, 1 year later] regarding how many revision requests were filed and whether the "Framework-Constitutive" tag prevented necessary updates or successfully protected legacy data.

  ### 4. The Strongest Case Against This Recommendation

  To ensure robust debate on the 14th, I have outlined the strongest version of the Subgroup/Intern position. If you oppose the recommendation above, this is the argument you should advance.

  **The Argument from Epistemic Humility (The Intern's Position):**
  *"By tagging any clause as 'Framework-Constitutive,' even procedurally, we are codifying current ignorance as permanent structure. Science does not progress by protecting core concepts; it progresses by smashing them when they no longer fit reality.*

  *Consider the `species` entry. We currently use reproductive isolation. If we tag this as 'Constitutive,' we force future data submitters to either (a) lie about asexual organisms or (b) build complex workarounds to fit a sexual model onto asexual data. This is not stability; it is stagnation. The 'Breakage Test' privileges existing software over new science. It tells the biologists that the database administrators' convenience outweighs empirical accuracy.*

  *Quine's point was not just semantic; it was ethical. When we declare a definition 'immune to revision,' we are not describing language; we are exercising power. We are deciding in advance which future discoveries will be treated as 'data' and which will be treated as 'errors.' In a Union dedicated to scientific progress, no concept should be too expensive to change. If a definition breaks the schema, the schema should break."*

  ### 5. The Strongest Case For This Recommendation

  Conversely, if you support the recommendation, this is the rationale you should use (The Chair's Position, refined).

  **The Argument from Interoperability (The Chair's Position):**
  *"Data standards are not research papers; they are infrastructure. A bridge is not 'falsified' when a taller ship needs to pass under it; the ship must route differently, or the bridge must be rebuilt with planned downtime. If we allow core structural terms to change by simple majority, we render historical data unreadable.*

  *The Intern is theoretically correct that any statement *can* be revised, but practically wrong to suggest they *should* be revised with equal ease. If `gene` changes meaning every five years, we cannot compare datasets across decades. The 'Framework-Constitutive' tag is not a claim that biology has stopped evolving; it is a claim that our *shared language* must remain stable enough to allow us to notice the evolution. We choose stability not because we are dogmatic, but because comparability is the primary function of this Union."*

  ### 6. Next Steps

  1.  **Circulate:** This memo is circulated for review prior to the 14th.
  2.  **Debate:** The meeting on the 14th will focus on the wording of the "Framework-Constitutive" gloss and the specific thresholds for the Pilot.
  3.  **Vote:** We will vote on adopting the Pilot Protocol for `gene` and `species`.

  **Summary:** We cannot solve the philosophical problem of analytic vs. synthetic truth. However, we can solve the data problem of stable vs. flexible schemas. By shifting the justification from "meaning" to "cost of change," we can satisfy the Chair's need for order without validating the Intern's fear of dogma.

