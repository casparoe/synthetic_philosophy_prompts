answer: |-
  # Workshop Plan: The Normative Status of Pure Time Preference
  **Duration:** 75 Minutes
  **Participants:** ~10 Graduate Students
  **Goal:** Isolate pure time preference as a distinct normative variable and test its justification.

  ### 1. Conceptual Dependency: Securing the "Identity of the Good"
  **Time Allocation:** Minutes 0–10
  **Pedagogical Move:** Definitional Stipulation

  Before the thesis of pure time preference can be debated, participants must agree on what is being discounted. If the good itself changes, or the likelihood of receipt changes, the preference is impure.

  *   **Instruction:** Open by establishing the *Ceteris Paribus* condition for intertemporal choice. Do not define pure time preference yet; instead, define the conditions under which it *could* exist.
  *   **The Distinction to Secure:** Distinguish between **Temporal Location** and **Temporal Consequences**.
      *   *Temporal Consequences:* Changes in magnitude, probability, or context that happen *because* of the delay (e.g., inflation, risk of death, investment growth).
      *   *Temporal Location:* The coordinate on the timeline alone, holding all consequences constant.
  *   **Workshop Action:** Write two columns on the board: "Instrumental Reasons for Delay" and "Temporal Location." Ask participants to brainstorm factors that usually make us prefer sooner goods (e.g., "I might die," "I could invest it"). Place all of them in the "Instrumental" column.
  *   **Success Condition:** The group must agree that for pure time preference to be a substantive thesis, all instrumental reasons must be theoretically subtracted. If they cannot conceive of a scenario where probability is 1 and magnitude is constant, the discussion will collapse into standard risk analysis.

  ### 2. Carrying Scenario: The "Suspended Welfare" Model
  **Time Allocation:** Minutes 10–30
  **Pedagogical Move:** Intuition Pump (Non-Mathematical)

  Avoid exponential discount curves or interest rate formulas. Use a phenomenological model that forces an ethical choice between identical states separated only by time.

  *   **The Scenario:** Present the case of **"The Suspended Welfare Unit."**
      *   *Setup:* A participant is offered a specific, fixed quantum of well-being (e.g., one hour of peak aesthetic experience).
      *   *Constraint A (Certainty):* The experience is guaranteed to occur. There is no risk of death, institutional collapse, or forgetfulness.
      *   *Constraint B (Stasis):* The experience cannot be invested or grown. It is a fixed unit of consumption.
      *   *Constraint C (Identity):* The recipient is the same subject (or a psychologically continuous successor) in both cases.
      *   *Choice:* Option X: Experience occurs at $t_{now}$. Option Y: Experience occurs at $t_{now+10years}$.
  *   **Required Features:**
      *   It must be **discrete**, not continuous (avoiding the visual slide of a curve).
      *   It must be **subjective**, focusing on the valuation of the experience, not market price.
  *   **Features to Avoid:**
      *   Do not use money (invokes inflation/investment).
      *   Do not use health outcomes (invokes urgency/survival).
      *   Do not use "waiting" as a cost (the waiting itself must not be painful; the experience is simply located later).
  *   **Workshop Action:** Ask participants to vote anonymously: Is it rational to value Option X higher than Option Y *solely* because of the time coordinate? Record the split. This creates the "live ethical choice" tension.

  ### 3. Mapping Predictable Misconceptions & Interception Points
  **Time Allocation:** Woven throughout Minutes 10–55
  **Pedagogical Move:** Pre-emptive Constraint

  Anticipate three specific category errors. Do not wait for participants to make them; introduce the constraints as part of the scenario rules, then reinforce them when discussion drifts.

  *   **Misconception 1: Conflation with Risk Aversion.**
      *   *The Error:* "I prefer now because I might not be alive later."
      *   *Interception Point:* **During Scenario Setup (Minute 12).** Explicitly stipulate the "Guaranteed Delivery" clause. If raised later, refer back to the "Certainty Constraint" on the board.
  *   **Misconception 2: Spatial-Distance Analogies.**
      *   *The Error:* "Time is just another dimension; if I wouldn't discount goods for someone in another room, why discount for someone in another year?"
      *   *Interception Point:* **During the Framing Device (Minute 40).** This is where the structural break between space and time is analyzed (see Section 5). Do not allow this analogy to stand unchallenged during the initial scenario discussion.
  *   **Misconception 3: Instrumental Justification Assumption.**
      *   *The Error:* "A positive rate is only justified if it leads to better overall outcomes (e.g., investment)."
      *   *Interception Point:* **During Initial Voting (Minute 25).** When participants justify their vote, challenge those who offer instrumental reasons to re-state their position *assuming the instrumental reason is removed*. Force them to defend the *intrinsic* disvalue of lateness.

  ### 4. Diagnostic Exercise: The Weighting Matrix
  **Time Allocation:** Minutes 65–75
  **Pedagogical Move:** Applied Differentiation

  This exercise tests whether participants can isolate pure time preference from impure factors, rather than merely reciting the definition.

  *   **The Task:** Distribute a handout with three distinct cases. Ask participants to assign a "Discount Rate" (High, Low, or Zero) to each and write a one-sentence justification.
      *   *Case A:* A future benefit that is highly probable but contingent on complex political stability.
      *   *Case B:* A future benefit that is guaranteed, identical in magnitude to a present one, but occurs 50 years later.
      *   *Case C:* A future benefit that could be invested to yield double the magnitude if delayed.
  *   **The Reveal:**
      *   *Case A* tests for **Risk/Uncertainty** (Impure).
      *   *Case B* tests for **Pure Time Preference** (The target concept).
      *   *Case C* tests for **Opportunity Cost/Growth** (Impure).
  *   **Assessment Criterion:** Participants have grasped the concept only if they assign a non-zero discount to Case B *without* citing risk or growth in their justification. If they assign zero discount to Case B, they must justify it via intertemporal neutrality, not by reintroducing risk.
  *   **Discussion:** Spend the final 5 minutes comparing justifications for Case B. This reveals the normative fault line in the room.

  ### 5. Framing Device: Intertemporal Neutrality as Symmetry
  **Time Allocation:** Minutes 40–60
  **Pedagogical Move:** Structural Analogy and Break

  Use this framing to elevate the discussion from economic intuition to philosophical structure. This replaces standard "impatience" explanations.

  *   **The Symmetry Principle:** Present **Intertemporal Neutrality** as analogous to **Spatial Neutrality**.
      *   *Premise:* In ethics, my location in space ("here") is not a valid reason to value my welfare over someone else's welfare "there."
      *   *Analogy:* Therefore, my location in time ("now") should not be a valid reason to value my welfare over my own (or another's) welfare "then."
  *   **The Structural Break (Indexicality):**
      *   *Instruction:* Challenge the analogy. Spatial position is contingent; I could have been born in a different city. Temporal position (the present) is indexical; I cannot experience the world from any point other than "now."
      *   *Illumination:* This explains *why* pure time preference feels intuitive despite violating neutrality. The "Now" is a necessary condition of agency in a way "Here" is not.
      *   *Risk of Distortion:* Explicitly warn participants that this framing risks **psychologizing** the norm. Just because the "Now" is indexically privileged for *experience* does not mean it is normatively privileged for *valuation*. Ensure the group distinguishes the *phenomenology* of time (I am stuck in the now) from the *axiology* of time (I should value the now more).
  *   **Workshop Action:** Ask: "Does the indexical nature of 'now' justify a normative bias, or does it merely explain the bias?" Use this to transition into the Diagnostic Exercise.

  ### 6. Explicit Omissions
  **Time Allocation:** Minute 75 (Closing Remarks)
  **Pedagogical Move:** Boundary Setting

  To maintain focus on the normative core, explicitly state what the workshop is *not* covering. This prevents participants from feeling the analysis is incomplete due to missing standard economic tools.

  *   **State the Following Omissions:**
      1.  **Infinite Horizons:** We are not addressing the mathematical complications of discounting over infinite generations (e.g., the impossibility of satisfying certain Pareto conditions over infinite time).
      2.  **Social Choice Aggregation:** We are not deriving a social discount rate for cost-benefit analysis or climate policy. We are analyzing the individual rational/ethical unit.
      3.  **Non-Identity Problems:** We are assuming the identity of the recipient remains constant. We are not addressing cases where policy choices determine *who* comes into existence in the future.
  *   **Closing Statement:** "Today we isolated the variable of pure time preference. Whether this variable should be set to zero in policy or personal ethics remains the open question, but we have secured the terms under which that question must be asked."
