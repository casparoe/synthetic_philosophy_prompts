  You have correctly pinned down that the confirmation turns on the sampling protocol, not merely on the categorical status of the object. In your sealed-pair case, the verdict is zero confirmation: if the pair is fixed as {Black Raven, White Shoe} regardless of the truth of $H$, then observing the shoe has likelihood 0.5 on both $H$ and $\neg H$, so the posterior equals the prior. This does not threaten the dissolution; it consummates it. The paradox existed only because philosophers clung to Nicod's Criterion—the idea that instance confirmation is automatic. By showing that confirmation depends on the probability space defined by the experimental design, we demonstrate exactly why Nicod's Criterion is false while preserving the Equivalence Condition. The two ornithologists differ not because confirmation is subjective, but because they possess different evidence regarding the selection mechanism, and confirmation is essentially a measure of how evidence shifts credence given a specific chance setup.

  You ask why this counts as dissolution rather than reclassification. It is dissolution because the "paradox" was the conflict between intuition (Nicod) and logic (Equivalence). Once we see intuition was tracking a false principle about sampling, the conflict vanishes. We don't need to tweak logic; we need to tweak the epistemology of testing. A non-black non-raven confirms when the sampling method makes it possible to have encountered a counterexample had one existed. In your case, the design insulated the hypothesis from the evidence. That isn't a new puzzle; it is the precise condition under which testing fails.

  If you reject this dependence on experimental design, are you prepared to endorse Nicod's Criterion even in cases where the sampling procedure is explicitly rigged to avoid counterexamples, or do you admit that testing requires a chance of failure?
