answer: |-
  # Joint Statement on Weber, Causal Inference, and the Protestant Ethic

  ### 1. Agreed Claims
  1.  **Testable Causality:** A claim that "values caused economic outcomes" is only non-vacuous if it implies a counterfactual: holding institutions and material conditions constant, changing the specific religious ideas would alter economic behavior.
  2.  **Origin vs. Persistence:** We distinguish between the *origin* of a pattern (why it emerged initially) and its *persistence* (why it remains). A factor may cause origin without sustaining persistence, or vice versa.
  3.  **Limits of Identification:** A natural experiment (like the ruler's confession rule) identifies the effect of *assignment* to a confessional regime, but does not automatically identify the *channel* (ideas vs. institutions) without further mediation analysis.
  4.  **Mechanism Stories:** Statistical associations cannot rule out hidden mechanisms; mechanism stories cannot substitute for identification. Both are required: identification to establish the effect, mechanisms to explain the channel.
  5.  **Study Interpretation:** Regarding the hypothetical village study: We agree the design identifies a causal effect of Reformed confession on wealth 250 years later. We disagree on whether the remaining effect (after controlling for associations) is cultural or institutional.

  ### 2. Disagreements Table

  | Disagreement | Values-First Position | Materialist Position | Crux | Concrete Evidence & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Primary Channel** | The ethic operates via internalized norms (calling, asceticism) that directly shape behavior. | The ethic is a rationalization; the real driver is access to networks (credit/craft associations). | **Mediation:** Is the direct effect cultural or unmeasured institutional variance? | **Finding (ii):** Gap shrinks 2/3 controlling for associations.<br>**Values:** Remaining 1/3 is direct cultural effect.<br>**Materialist:** Remaining 1/3 is measurement error in institutional density. |
  | **Growth Dynamics** | Values set a trajectory that should compound over generations as culture deepens. | Institutional shocks set a one-time level shift; without ongoing material advantage, gaps should flatten. | **Time Series:** Does culture compound or set a ceiling? | **Finding (iii):** Gap appears in 2 gens, then flat.<br>**Values:** Values set the *track* (level), not necessarily growth rate.<br>**Materialist:** Flatness confirms one-time shock, refutes ongoing cultural engine. |
  | **Elective Affinity** | Ideas act as "switchmen," causally directing interests into specific forms (e.g., savings over consumption). | Ideas "latch on" to pre-existing material conditions; savings reflect capital market access, not psychology. | **Definition:** Is affinity causal or conditional? | **Finding (iv):** Effect in savings/bookkeeping, not hours.<br>**Values:** Matches ascetic prohibition on enjoyment.<br>**Materialist:** Matches requirements for capital accumulation, not labor supply. |

  ### 3. Note on Verbal Dispute
  We conclude that part of our dispute is terminological. The Materialist uses "culture" as a residual category for unidentified mechanisms, whereas the Values-First side uses "culture" to denote specific, transmissible normative content. If "culture" is defined as "any non-material transmission," the Values-First side wins by definition in the remaining 1/3 effect. If "culture" requires evidence of psychological internalization distinct from network effects, the Materialist side requires higher evidentiary standards. We agree that resolving this requires data on individual psychology (e.g., surveys on thrift motivations) alongside the historical economic data.
