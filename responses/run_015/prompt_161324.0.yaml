answer: |-
  An act is supererogatory if it produces significant net good beyond strict duties, provided the agent incurs non-trivial cost, violates no prior obligations, and acts where no replacement is guaranteed, with praise modulated by relational proximity and normative expectations.

  *   "Beyond strict duties" motivates (a) Passer-by.
  *   "Non-trivial cost" motivates (f) Cheap heroism.
  *   "Relational proximity" motivates (b) Lifeguard and (d) Brother.
  *   "No prior obligations" motivates (h) Borrowed generosity.
  *   "No replacement guaranteed" motivates (i) Shadow supererogation.
  *   "Normative expectations" motivates (g) Preemptive and (e) Second shift.

  Verdict on incompetent intervention: Blameworthy. Voluntary intervention establishes a temporary duty of competence; performing incompetently violates this duty and fails the principle's core requirement of producing net good, causing harm rather than alleviating it.

  Honest note: This principle classifies role-based acts as strict duties, denying them supererogatory status. This conflicts with your verdict on (b) Off-duty lifeguard, which you find praiseworthy. I would overturn (b): professional capacity creates a standing obligation regardless of employment status, making the rescue required rather than optional, and thus omission is blameworthy while performance is merely expected.
