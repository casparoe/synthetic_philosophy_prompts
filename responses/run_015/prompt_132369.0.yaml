answer: |-
  Here is the spec. I have organized it into four categories: Ontology, Structure, Phenomenology, and Agency. Following that, I address your two specific questions, the trade-offs, the existing interpretations, and the verdict on your 3N motivation.

  ### Part 1: The Spec (Desiderata)

  To count as a genuine $\psi$-epistemic alternative rather than a psi-ontic view in disguise (or instrumentalism), your view must satisfy the following.

  **1. The Ontology Constraint (What is $\lambda$?)**
  *   **Requirement:** You must specify the nature of the underlying ontic state ($\lambda$). It cannot be "the system" vaguely; it must be distinct from $\psi$.
  *   **Case:** If you don't specify $\lambda$, you haven't explained what the knowledge is *of*. You've just moved the mystery from $\psi$ to "the world."
  *   **Breaks if dropped:** The view collapses into instrumentalism (Shut Up and Calculate) or vague realism.
  *   **Status:** **Genuine Requirement.**

  **2. The 3D/4D Constraint (The Ontological Payoff)**
  *   **Requirement:** The ontology $\lambda$ should ideally live in 3D space (or 4D spacetime), not $3N$-dimensional configuration space.
  *   **Case:** This is your primary motivation. If $\lambda$ is a field on configuration space, you have gained no ontological parsimony over Many Worlds or GRW.
  *   **Breaks if dropped:** You lose the main reason for adopting the view (solving the configuration space problem).
  *   **Status:** **Genuine Requirement** (for your specific project goals).

  **3. The Derivation Constraint (Why Hilbert Space?)**
  *   **Requirement:** You must derive the structure of the state space (complex numbers, unitarity, dimensionality) from constraints on knowledge or the ontology, not posit it.
  *   **Case:** In $\psi$-ontic views, the Hilbert space structure is the structure of reality. In $\psi$-epistemic views, it must be the structure of *possible information* about $\lambda$. Why *this* geometry? Why not a simple probability simplex?
  *   **Breaks if dropped:** The view becomes a "relabeling." You are just mapping $\psi$ to probabilities without explaining why those probabilities obey Schrödinger's equation.
  *   **Status:** **Genuine Requirement.** (This is the hardest technical hurdle).

  **4. The Overlap Constraint (The PBR Condition)**
  *   **Requirement:** Distinct pure quantum states $|\psi\rangle$ and $|\phi\rangle$ must correspond to overlapping probability distributions over $\lambda$.
  *   **Case:** If the distributions are disjoint, $\lambda$ uniquely determines $\psi$. $\psi$ becomes a physical property of $\lambda$ (ontic). To be epistemic, $\lambda$ must be compatible with multiple $\psi$'s.
  *   **Breaks if dropped:** You are no longer $\psi$-epistemic; you are $\psi$-ontic (like Bohmian mechanics, where $\psi$ is a real field guiding particles).
  *   **Status:** **Genuine Requirement.** (See Part 2 for the PBR complication).

  **5. The Interference/Entanglement Constraint**
  *   **Requirement:** Explain how "knowledge" interferes and entangles without the underlying reality $\lambda$ doing the same.
  *   **Case:** If $\lambda$ is local particles, how do they produce non-local correlations? If $\lambda$ is local fields, how do they produce interference patterns that depend on global topology? The "bookkeeping" must track something that behaves like a wave, or the ontology must behave like a wave.
  *   **Breaks if dropped:** Empirical inadequacy.
  *   **Status:** **Genuine Requirement.**

  **6. The Outcome Constraint (Definiteness)**
  *   **Requirement:** Explain how a single definite outcome occurs upon measurement without invoking a physical collapse of $\lambda$.
  *   **Case:** If $\psi$ is knowledge, "collapse" is just Bayesian updating. But updating on *what*? There must be a fact of the matter (a value of $\lambda$) that makes the outcome definite.
  *   **Breaks if dropped:** You fail to solve the measurement problem; you just rename it.
  *   **Status:** **Genuine Requirement.**

  **7. The No-Super-Agent Constraint (Born Rule Protection)**
  *   **Requirement:** An agent with access to $\lambda$ cannot make predictions that violate the Born rule or allow signaling, compared to an agent with only $\psi$.
  *   **Case:** If $\lambda$ is the "real state," knowing it should arguably give more predictive power. If it doesn't, $\psi$ is already maximal knowledge. If it does, the theory is empirically distinct from QM (and likely falsified).
  *   **Breaks if dropped:** Either empirical falsification (if they *can* beat the bookie) or explanatory idleness (if $\lambda$ exists but confers no predictive advantage).
  *   **Status:** **Genuine Requirement.** (See Part 2).

  **8. The Locality/Bell Constraint**
  *   **Requirement:** Account for Bell inequality violations. You must choose: give up Locality, give up Statistical Independence (Superdeterminism), or give up Realism (outcomes don't exist before measurement).
  *   **Case:** You cannot save locality *and* realism *and* QM predictions. $\psi$-epistemic views often hope to save locality by making $\psi$ non-real, but Bell applies to $\lambda$ too.
  *   **Breaks if dropped:** Empirical inadequacy.
  *   **Status:** **Genuine Requirement.** (Locality itself is not a requirement; accounting for Bell is).

  ---

  ### Part 2: Your Two Specific Questions

  **1. The PBR Argument and Overlap**
  *   *The Argument:* The Pusey-Barrett-Rudolph (PBR) theorem shows that if you assume **Preparation Independence** (two systems prepared independently have independent $\lambda$ states), then distinct quantum states must correspond to disjoint $\lambda$ distributions. This forces $\psi$ to be ontic.
  *   *Is Overlap a Desideratum?* **Yes.** If you deny overlap, you admit $\psi$ is determined by $\lambda$. You are then a $\psi$-ontic theorist (like a Bohmian). To be $\psi$-epistemic, you *must* maintain overlap.
  *   *The Cost:* To keep overlap in light of PBR, you must deny Preparation Independence. This means your ontology is **holistic**: the state of two "independently" prepared systems is not the product of their individual states.
  *   *Verdict:* This is a massive ontological cost. It saves the epistemic view but sacrifices the idea that the world is built of separate, local things. It pushes your ontology toward holism, which weakens your 3N-motivation (since holism often smells like configuration space).

  **2. The Super-Agent Constraint**
  *   *The Constraint:* "An agent handed $\lambda$ can't beat the Born rule."
  *   *Is it Real?* **Yes, but it creates a tension.**
      *   If knowing $\lambda$ *allows* beating the Born rule, your theory predicts deviations from QM. Since QM is robustly confirmed, your theory is likely false.
      *   If knowing $\lambda$ *does not allow* beating the Born rule, then $\psi$ represents **maximal knowledge** of $\lambda$.
  *   *The Tension:* If $\psi$ is maximal knowledge, why is it probabilistic? Usually, probabilities arise from ignorance. If I know the *exact* state $\lambda$, why am I still uncertain?
      *   *Option A:* $\lambda$ is stochastic (indeterministic). Then $\psi$ tracks propensities, which look ontic.
      *   *Option B:* There is a "sub-quantum" equilibrium (like Bohmian Quantum Equilibrium). You can't access $\lambda$ precisely. But then $\lambda$ is empirically hidden forever.
      *   *Option C:* The probabilities are subjective (QBism). Then $\lambda$ isn't an objective state of the world, but a commitment of the agent.
  *   *Verdict:* This constraint is necessary for empirical adequacy. But satisfying it makes $\lambda$ look like a "hidden variable" in the pejorative sense: it exists, but makes no difference to predictions. You must argue it makes a difference to *explanation* (e.g., resolving paradoxes) without making a difference to *statistics*.

  ---

  ### Part 3: Trade-offs and The Killer Constraint

  **Which requirements can't be had at once?**
  You cannot have all of these simultaneously:
  1.  **Psi-Epistemic** (Overlap allowed)
  2.  **Preparation Independence** (Local composition of systems)
  3.  **Empirical Adequacy** (Match QM predictions)
  *(This is the PBR Trilemma).*

  You also struggle to hold these together:
  1.  **Psi-Epistemic**
  2.  **3D Ontology** (Local beables)
  3.  **Bell Locality**
  *(Bell's theorem kills local hidden variables. If $\psi$ is just knowledge, $\lambda$ are the hidden variables. They must be non-local or non-real).*

  **The Killer Constraint:**
  **The Derivation Constraint (Why Hilbert Space?).**
  Most $\psi$-epistemic models (like Spekkens' toy model) reproduce *some* quantum phenomena (interference, teleportation, no-cloning) but fail to scale to full QM. They fail to derive the *continuous* unitary group or the specific dimensionality of Hilbert space from epistemic restrictions.
  *   **Why it knocks out candidates:** It is easy to say "knowledge is restricted." It is incredibly hard to show that *this specific restriction* yields *exactly* the Schrödinger equation and nothing else. Most attempts end up bolting on the Hilbert space structure by hand, which violates your "no bookkeeping" rule.

  ---

  ### Part 4: The Usual Suspects (Against Your Spec)

  *   **Bohmian Mechanics:** Fails **Psi-Epistemic**. $\psi$ is a real physical field (the guiding wave). It satisfies 3D Ontology (particles) but pays for it with a $3N$-dimensional pilot wave. It satisfies Super-Agent (in principle, knowing $\lambda$ lets you predict everything, but you can't measure $\lambda$ without disturbance).
  *   **Collapse Models (GRW):** Fails **Psi-Epistemic**. $\psi$ is physical and collapses physically. Fails 3D Ontology (wavefunction is on config space).
  *   **Many Worlds (Everett):** Fails **Psi-Epistemic**. $\psi$ is the only reality. Fails 3D Ontology radically. Satisfies Derivation (mostly).
  *   **QBism / Quantum Bayesianism:** Satisfies **Psi-Epistemic** radically. Fails **Ontology Constraint** (often agnostic or anti-realist about $\lambda$). Fails **World Between Measurements** (focuses on outcomes). Avoids PBR by denying $\lambda$ exists independently of the agent.
  *   **Spekkens' Toy Model:** Satisfies **Psi-Epistemic** and **Overlap**. Fails **Derivation** (doesn't scale to full QM, violates contextuality theorems). Good proof of concept, bad final theory.

  ---

  ### Part 5: Verdict on the 3N Motivation

  **Should the 3N-dimensional motivation survive onto the list?**
  **Yes, but with a warning.**
  It is the strongest *prima facie* reason to pursue $\psi$-epistemicism. A wavefunction on configuration space is ontologically extravagant.
  *   **The Trap:** If your epistemic view requires $\lambda$ to have holistic, non-separable properties to explain entanglement (to survive PBR), you may end up with an ontology that is *functionally* high-dimensional even if you call it 3D.
  *   **The Test:** If your view says "The world is 3D particles, but their states are holistically constrained," you have saved the 3D ontology. If your view says "The world is 3D particles, but the constraints live in configuration space," you haven't gained anything over Many Worlds.
  *   **Advice:** Keep this motivation, but make the **3D/4D Constraint** (Desideratum #2 above) a hard filter. If your epistemic view secretly requires a configuration-space law, abandon it.

  ### Summary Advice for Your Year
  1.  **Don't ignore PBR.** Address the "Preparation Independence" assumption head-on. Are you willing to accept holism at the ontic level?
  2.  **Focus on the Derivation.** The biggest gap in the literature is deriving the *dynamics* (Schrödinger eq) from epistemic principles. If you can't do that, you have a static interpretation, not a dynamical one.
  3.  **Define "Knowledge."** Is it knowledge of a particle position? Of a field value? Of a causal structure? If it's not clear what is known, the view is empty.
  4.  **Accept Non-Locity.** Don't try to save Bell Locality. It's a dead end. Try to save *Signal Locality* (no superluminal communication) while accepting ontic non-locality.

  If you can produce a model where $\lambda$ is 3D, distinct $\psi$'s overlap, and the Schrödinger equation falls out of rationality constraints on updating knowledge about $\lambda$, you will have done something historic. If you can only do two of those, you will have a nice philosophical position but not a physical theory.
