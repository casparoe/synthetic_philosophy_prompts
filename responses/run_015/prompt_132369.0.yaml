prompt: |-
  So I'm thinking about spending next year trying to build (or at least defend) a view where the wavefunction isn't a thing in the world but something more like a state of knowledge, and before I sink a year into it I want to know what I should be demanding of such a view. Not a reading list — I can find the papers myself. I want the spec. Purpose: it has to be good enough to be a real alternative to the wavefunction-is-real views, not a relabeling of one of them with some extra bookkeeping bolted on.

  Where I'm at: the motivation is the usual one. The state of N particles lives in this enormous 3N-dimensional space, gets handed to you by a preparation procedure, jumps when you find something out, and isn't the kind of thing anyone has ever measured directly — so maybe it's like a probability distribution. But "it's knowledge" is cheap until you say knowledge of what and why that knowledge has the shape it has. So: write me the desiderata.

  Things I think belong on the list, but you decide and add the ones I'm missing: what the underlying states of affairs have to be like; why the set of things-you-can-know has exactly the geometry of a Hilbert space (why maximal information is a pure state, why you can rotate any state into any other, why there are exactly this many perfectly distinguishable ones); how interference and entanglement come out right if the state is only bookkeeping — in particular how you get the exponential size of the state space without paying for it in ontology; why nobody can use the underlying state to out-bet the Born rule; what a measurement is and where definite outcomes come from; what happens to Bell-type correlations and to locality; whether it's supposed to be empirically identical to textbook quantum mechanics or allowed to differ somewhere; and whether it has to be a view about measurement outcomes only or also about the world between them.

  For each one, the case or consideration behind it, what breaks if you drop it, and whether it's a genuine requirement or just a prejudice of one camp — is locality here a desideratum or a fetish, is "the quantum state has to be derived from the underlying facts rather than posited alongside them" fair or circular, is being able to say what would be different if the view were true non-negotiable.

  Two I especially want. First: I keep being told about an argument that runs roughly — prepare two systems independently, assume the underlying state of the pair is just the two underlying states sitting side by side, and you can apparently get to the conclusion that two distinct pure states can never rest on the same underlying state, which would kill the project. Is "distinct pure states must be able to overlap" an actual desideratum, or can you be a wavefunction-is-knowledge person without it? Second, one I made up: an agent who was somehow handed the exact underlying state still couldn't make money against a bookie who only knows the quantum state. I think that belongs on the list, but I can't tell if it's a real constraint, just empirical adequacy in a costume, or in tension with wanting the underlying story to explain anything at all.

  Then the parts I care most about: which subset of the requirements can't all be had at once, and which single requirement knocks out the most candidates. A line each at the end on the usual suspects — the pilot-wave one, the collapse ones, many worlds, the "it's just an agent's betting odds" version — is enough; the criteria are where I want the work. Also: if I'm honest I don't know whether my 3N-dimensional motivation is even a good reason to want the view, so tell me if that one definately shouldn't survive onto the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to spend a year developing/defending an epistemic view of the wavefunction (psi-epistemic) vs. an ontic view (psi-ontic). They need a "spec" or list of desiderata/criteria to evaluate such a view.
      *   **Constraints:** No reading lists. Focus on the *requirements* for the view to be a *real alternative*, not just a relabeling.
      *   **Current Status:** Motivated by the high dimensionality of configuration space, the update rule (collapse), and the indirect nature of measurement. Acknowledges that "it's knowledge" is cheap without explaining *knowledge of what*.
      *   **Specific Questions:**
          *   Validate/expand their proposed list (underlying states, Hilbert space geometry, interference/entanglement, exponential size, Born rule protection, measurement problem, Bell/locality, empirical adequacy, intermediacy).
          *   Address two specific points: The PBR theorem argument (overlap of pure states) and the "Super-Agent" constraint (knowing the underlying state shouldn't allow beating the Born rule).
          *   Identify trade-offs: Which requirements are incompatible? Which is the "killer" constraint?
          *   Briefly categorize existing interpretations against these criteria.
          *   Evaluate the "3N-dimensional motivation."

  2.  **Deconstruct the Core Problem (Psi-Epistemicism):**
      *   The central tension is between *explaining quantum phenomena* (interference, entanglement, no-cloning, etc.) and *maintaining that the wavefunction is not physical*.
      *   If $\psi$ is just knowledge, there must be an underlying reality (the "ontic state" $\lambda$).
      *   If $\psi$ is just knowledge, distinct $\psi$'s should correspond to overlapping distributions over $\lambda$ (otherwise $\psi$ is determined by $\lambda$, making it ontic).
      *   The PBR theorem attacks this overlap.
      *   The "Super-Agent" constraint attacks the idea that $\lambda$ is "more real" than $\psi$. If $\lambda$ exists, why can't we use it?

  3.  **Drafting the Desiderata (The Spec):**
      *   *Ontology:* Need a clear account of $\lambda$. What is it? Fields? Particles? Events?
      *   *Hilbert Space Structure:* Why complex numbers? Why unitary evolution? This is the "hard part" for epistemic views (derive QM from principles).
      *   *Interference/Entanglement:* Must reproduce the predictions. If $\psi$ is knowledge, how does knowledge interfere? (Usually requires $\lambda$ to have wave-like properties, risking ontic collapse).
      *   *Exponential Size:* If $\lambda$ is local in 3D space, how do we get $3N$ dim correlations without non-locality or huge ontology?
      *   *Born Rule:* Why *this* probability rule? Why can't we beat it? (The "Super-Agent" constraint).
      *   *Measurement:* How does a definite outcome arise? (The "Outcome Problem").
      *   *Bell/Localilty:* This is crucial. Psi-epistemic views often try to save locality, but Bell says "no" for *predictions*. Can they save it for *ontology*?
      *   *Empirical Adequacy:* Must match QM predictions (unless proposing a modification).
      *   *Intermediacy:* Does the world exist between measurements? (Realism vs. Instrumentalism).

  4.  **Addressing the Specific Questions:**
      *   *PBR Theorem:* This is the big gun. It says if preparation independence holds, $\psi$ must be ontic. To be psi-epistemic, you must deny preparation independence (holism) or accept that distinct $\psi$ *don't* overlap (which makes it psi-ontic). *Correction:* PBR says if distinct $\psi$ correspond to disjoint $\lambda$, it's ontic. If they overlap, it's epistemic. PBR argues overlap is impossible under certain assumptions. So, a psi-epistemic view *must* allow overlap to be distinct from psi-ontic, but PBR says overlap is ruled out. The user asks: "Is 'distinct pure states must be able to overlap' an actual desideratum?" Yes, otherwise it's just psi-ontic in disguise.
      *   *Super-Agent:* If $\lambda$ is the "real state," knowing it should give more predictive power than $\psi$, unless $\psi$ is already maximal knowledge *about* $\lambda$. But if $\psi$ is maximal, why is it probabilistic? This touches on "quantum equilibrium" (Bohm) or "information-theoretic limits" (QBism). It's a strong constraint.

  5.  **Identifying Trade-offs (The "No-Go" Zone):**
      *   You can't have: Local $\lambda$ + Preparation Independence + Psi-Epistemic (PBR).
      *   You can't have: Psi-Epistemic + No Super-Agent Power + Explanatory Depth (if $\lambda$ does nothing, why posit it?).
      *   The "Killer" Constraint: The PBR theorem (specifically the overlap requirement) combined with the desire for a local, separable ontology.

  6.  **Evaluating the "3N Motivation":**
      *   Is high dimensionality a good reason? Yes, it's the main ontological cost. But if the epistemic view requires a *different* high-dimensional ontology (e.g., many worlds or holistic fields), it gains nothing. The motivation holds only if the underlying $\lambda$ is low-dimensional (3D).

  7.  **Categorizing Interpretations:**
      *   *Bohm:* Psi-ontic (guiding field). Fails the "psi is knowledge" spec.
      *   *Collapse (GRW):* Psi-ontic.
      *   *Many Worlds:* Psi-ontic (universal wavefunction).
      *   *QBism/Relational:* Psi-epistemic (radical). Avoids $\lambda$ mostly. Struggles with "world between measurements."
      *   *Spekkens' Toy Model:* Psi-epistemic. Fails to scale to full QM (contextuality).

  8.  **Refining the Tone:**
      *   The user is sophisticated ("spec," "bookkeeping bolted on," "PBR argument"). Avoid condescension. Be direct, philosophical but rigorous.
      *   Structure the response clearly: The Spec, The Two Specifics, The Trade-offs, The Interpretations, The 3N Motivation.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *PBR Nuance:* PBR assumes "Preparation Independence." A psi-epistemic view can survive by denying this (holism). I need to make sure the user knows this is a "cost" on the spec list.
      *   *Super-Agent Nuance:* If the agent knows $\lambda$, can they predict the outcome? In Bohmian mechanics, yes, if they know the particle position. But they can't *measure* it without disturbing it. The constraint should be: "Knowing $\lambda$ shouldn't allow signaling or violating no-go theorems *operationally*."
      *   *Locality:* Bell's theorem rules out local *hidden variables* that reproduce QM. So a psi-epistemic view must be non-local or give up realism (outcomes). I need to be clear that "saving locality" is likely impossible if you want to match QM predictions.

  10. **Final Polish:** Check against the prompt's specific requests (e.g., "A line each at the end on the usual suspects"). Ensure the "3N motivation" verdict is clear. (It's a good motivation, but easily squandered).

  *(Self-Correction on the PBR point)*: The user asks: "Is 'distinct pure states must be able to overlap' an actual desideratum?"
  *Answer:* Yes. If distributions over $\lambda$ for distinct $\psi$ do not overlap, then $\lambda$ determines $\psi$. $\psi$ becomes a property of the system (ontic). To be epistemic, $\psi$ must represent incomplete knowledge, meaning different $\psi$'s must be compatible with the same $\lambda$. PBR argues this is impossible. So the desideratum is: "Explain how overlap is possible despite PBR."

  *(Self-Correction on Super-Agent)*: "An agent who was somehow handed the exact underlying state still couldn't make money against a bookie who only knows the quantum state."
  *Answer:* This is essentially the "Quantum Equilibrium" condition in Bohmian mechanics or the "Information Principle" in QBism. If $\lambda$ gives more info, it's empirically distinct from QM. If it doesn't, why is it there? This is the "Explanatory Idle" risk.

  Let's assemble the response.

  *Structure:*
  1.  **The Spec (Desiderata):** Grouped by Ontology, Structure, Phenomenology, and Agency.
  2.  **The Two Specifics:** PBR/Overlap and the Super-Agent constraint.
  3.  **The Trade-offs:** Incompatibilities and the "Killer" constraint.
  4.  **The Interpretations:** Brief categorization.
  5.  **The 3N Motivation:** Verdict.

  *Tone:* Professional, analytical, slightly provocative (matching the user's "fetish vs desideratum" language).

  *Key Insight to emphasize:* The hardest part isn't saying $\psi$ is knowledge; it's explaining why the *knowledge* follows the Schrödinger equation without the *thing known* also following it.

  *Wait, one more thing:* The user asked "whether it has to be a view about measurement outcomes only or also about the world between them." This is the "Realism" constraint. I should include that in the spec.

  *Final check on PBR:* PBR concludes $\psi$ is ontic *if* preparation independence holds. So a psi-epistemic view *must* violate preparation independence. This is a huge ontological cost (holism). I need to highlight this.

  *Final check on 3N:* If the underlying state $\lambda$ is also high-dimensional (e.g. configuration space stuff), the motivation dies. The motivation requires $\lambda$ to be 3D (or 4D spacetime).

