prompt: |-
  Hi — I'm a third-year PhD student, working on reasons and moral psychology, and I've got to put in a chapter plan for my department's work-in-progress session in a couple of weeks. It's meant to be a one-term chapter, 8–10k words, and what I need from you is the plan document itself, not the chapter.

  The half-formed idea I keep going round on: the internalism/externalism debate about reasons is almost entirely run on cases of action. The internalist story — a reason for you has to be able to get some grip on you, there has to be a route of some kind from what you already care about to the thing you supposedly have reason to do — works off the assumption that the output of the relevant bit of practical thought is something you *do*, so it makes sense to ask whether deliberation could have got you there. But a huge amount of what we criticise each other for isn't action at all: you have reason not to be quite so afraid, you had reason to be angrier than you were, you have no reason to still be grieving about that. Emotions aren't produced by deliberation in the way actions are, so the 'route' has no obvious home. My suspicion is that the emotional cases split the internalist's options in a way the action cases don't: either she says something fairly wild (you only have reason to grieve if you could somehow reason your way into grief), or she quietly becomes an externalist and reads reasons-for-emotion as fittingness straight off, and either way both sides get forced to say what the grip requirement was ever *for*. I also want to know whether the thing that saves internalism in the action cases — idealising the route until it's nearly empty — is what kills it here, because an idealised route into an emotion doesn't look like anything at all.

  Can you turn that into a proper proposal? Specifically: the question stated tightly enough that it has a determinate answer; why the existing positions, as they're standardly set up, leave it open rather than settle it by implication; the approach, i.e. what I'd actually do week by week over a term and why that approach rather than the obvious alternativse (I assume someone will say just run it on reasons for belief instead, or just do fittingness and be done with it — tell me why not, or tell me if they're right); what the possible conclusions are and what sort of consideration would decide between them; and an honest bit on what would make this too big for 8–10k, and what would count as the chapter failing even if it goes fine.

  One objection I want handled head-on rather than footnoted: a supervisor-type will say that reason-claims about emotions are really just claims about aptness or fittingness, so my test case smuggles in externalism from the start and proves nothing. Say how the plan deals with that.

  Don't give me a bibliography or any citations — I'll fill references in myself, and I don't want invented ones. Usual prose is fine, no headings needed if it reads better without. Please write it in British English (ise endings, that sort of thing). Ta.
reasoning: |-
  Here's a thinking process that leads to the suggested chapter plan:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in moral psychology/reasons.
      *   **Task:** Create a chapter plan (proposal document) for a work-in-progress session.
      *   **Length/Scope:** One-term chapter, 8–10k words.
      *   **Core Idea:** The internalism/externalism debate focuses too much on *action*. Emotions present a unique challenge because they aren't directly produced by deliberation. Internalism struggles to explain "reasons for emotion" without either becoming absurd (reasoning oneself into grief) or collapsing into externalism (fittingness). This tension forces a re-evaluation of the "grip requirement."
      *   **Specific Requirements:**
          *   Tight research question (determinate answer).
          *   Explanation of why existing positions leave this open.
          *   Weekly approach/methodology (and why not alternatives like belief or pure fittingness).
          *   Possible conclusions and deciding considerations.
          *   Risks (too big? failure conditions?).
          *   **Crucial Objection:** Handle the "reasons for emotions are just fittingness" objection head-on (not footnoted).
          *   **Style:** British English, prose format (no headings if it reads better, though structure is needed), no bibliography/citations.

  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* Reasons Internalism (RI) typically relies on a "deliberative route" or "motivational grip" constraint (Williams-style).
      *   *Premise 2:* This works okay for action (I deliberate, I act).
      *   *Premise 3:* Emotions are not direct outputs of deliberation (I can't just decide to be angry).
      *   *Problem:* If RI applies to emotions, how does the "route" work?
      *   *Horn 1:* Deny reasons for emotions exist unless deliberatively accessible (Absurd/Too restrictive).
      *   *Horn 2:* Accept reasons for emotions based on fittingness (Collapses into Externalism).
      *   *Goal:* Use this tension to test the viability of Internalism itself.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic but punchy. *The Grip of Grief: Emotional Reasons and the Limits of Internalism.*
      *   **Introduction/Research Question:** Need to sharpen the "half-formed idea" into a specific question.
          *   *Draft:* Can internalism handle emotions?
          *   *Refinement:* Does the extension of reasons internalism from action to emotion force a collapse into externalism, and if so, does this reveal a fatal flaw in the deliberative constraint itself?
          *   *Tighter:* "Does the 'deliberative constraint' on normative reasons survive the transition from action to emotion, or does the case of emotional reasons force internalism to either absurdity or collapse?"

      *   **Context/Existing Positions:** Why is this open?
          *   Literature focuses on action (Williams, Korsgaard, etc.).
          *   Emotions are often treated as passive or arational, or subsumed under belief (cognitivism).
          *   Standard Internalism assumes agency. Emotions challenge agency.
          *   Standard Externalism (Fittingness) ignores the "for me" aspect.
          *   *Gap:* No one has rigorously tested the *mechanism* of internalism against the *phenomenology* of emotion.

      *   **Methodology/Weekly Plan:**
          *   Need to map 10-12 weeks (one term).
          *   Weeks 1-3: Setup (Define Internalism, define Emotions).
          *   Weeks 4-6: The Challenge (Apply Internalism to Emotion).
          *   Weeks 7-9: The Objection (Fittingness vs. Reasons).
          *   Weeks 10-12: Synthesis/Conclusion.
          *   *Why this approach?* Need to show why not just do "reasons for belief." Belief is truth-aimed; emotion is value-aimed but not voluntary. Action is voluntary. Emotion is the middle ground that breaks the voluntary link. Pure fittingness ignores the subject's perspective.

      *   **Handling the "Fittingness" Objection:**
          *   This is critical. The supervisor will say: "Reasons for emotion just *are* fittingness conditions."
          *   *Counter:* Distinguish "reasons for which one feels" (explanatory/motivating) vs. "reasons why one should feel" (normative). Internalism claims normative reasons must connect to the former. If fittingness is purely objective, it fails the internalist test. If the internalist accepts fittingness, they abandon the "grip" requirement.
          *   *Strategy:* Make this the pivot point of the middle section.

      *   **Possible Conclusions:**
          1.  Internalism is false (Externalism wins).
          2.  Internalism is true but must be revised (Non-deliberative grip?).
          3.  Emotions are a special category (Dualism about reasons).
          *   *Deciding factor:* Whether a non-deliberative "grip" is coherent.

      *   **Risks/Failure Conditions:**
          *   *Too Big:* Trying to solve the nature of emotion *and* reasons. Need to stipulate a working view of emotion.
          *   *Failure:* If the distinction between "reasons for action" and "reasons for emotion" collapses (e.g., if all emotion is judged to be action-like). Or if the "fittingness" objection proves insurmountable without redefining terms too much.

      *   **Style Check:** British English (analyse, realise, programme, etc.). No headings (or minimal). No citations.

  4.  **Refining the Prose (Self-Correction during drafting):**
      *   *Critique:* The prompt asks for "no headings if it reads better without." A proposal usually benefits from *some* structure, but I can use bolding or paragraph breaks to signify sections without formal H1/H2 tags. Let's aim for a flowing narrative that *implies* structure.
      *   *Critique:* Make sure the "weekly plan" doesn't sound like a syllabus but a work plan.
      *   *Critique:* Ensure the "Fittingness Objection" is prominent.
      *   *Tone:* Professional, confident but open to critique (it's a WIP session).

  5.  **Final Polish:**
      *   Check word count (of the plan itself, not the chapter). The prompt asks for the *plan document*, which should be concise but detailed enough to show viability. Usually, a chapter plan is 1-2k words.
      *   Ensure British spelling (internalise, analyse, programme, colour, etc.).
      *   Check that the "determinate answer" requirement is met. The question shouldn't be "What is the truth?" but "Does X imply Y?"

      *(Self-Correction on "No Headings"):* The prompt says "no headings needed if it reads better without." For a formal proposal, clear signposting is usually better. I will use bolded lead-ins or distinct paragraph blocks to simulate structure without rigid numbering, keeping it fluid as requested. Actually, looking at the instruction "no headings needed if it reads better without," I will write it as a continuous narrative proposal, as that often reads more persuasively for a WIP pitch than a rigid form. I will use paragraph breaks to denote sections.

      *(Self-Correction on "Determinate Answer"):* The question needs to be sharp. "Does the internalist's deliberative constraint entail that there are no normative reasons for emotions, or must it collapse into externalism?" That allows a Yes/No/It Depends structure.

      *(Self-Correction on "Weekly Plan"):* I need to be specific about *what* is being done, not just "reading." Drafting, arguing, testing.

      *(Self-Correction on "Fittingness Objection"):* I need to make sure I don't just dismiss it, but show how the chapter *uses* it.

      *(Final check on British English):* "analyse", "internalise", "programme", "colour", "defence", "offence".

  6.  **Final Review against constraints:**
      *   Plan document, not chapter.
      *   British English.
      *   No citations/bibliography.
      *   Handle fittingness objection head-on.
      *   Address risks/failure.
      *   Weekly breakdown.
      *   Tight research question.

      *Let's write.*
answer: |-
  **Project Title:** The Grip of Grief: Emotional Reasons and the Limits of Internalism

  **Research Question**
  The central question driving this chapter is whether the 'deliberative constraint'—the internalist requirement that a normative reason must be capable of motivating an agent through sound deliberation—can be consistently applied to reasons for emotion without collapsing into externalism or absurdity. Specifically: does the transition from reasons for action to reasons for emotion force the internalist to abandon the requirement that reasons must 'grip' the agent's subjective motivational set, and if so, does this failure generalise to undermine internalism about practical reasons altogether?

  **Context and Motivation**
  The contemporary debate between reasons internalism and externalism is predominantly conducted through the lens of action. The internalist story, broadly Williamsian in flavour, insists that for something to be a reason for an agent, there must be a route from their existing subjective motivational set to the action in question. This works passably well for action because actions are typically the outputs of deliberation; we can trace a path from belief and desire to movement. However, a significant portion of our normative life concerns emotions. We criticise agents for being too afraid, for not being angry enough, or for grieving too long. These are normative assessments, yet emotions are not produced by deliberation in the way actions are. One cannot simply decide to grieve or reason oneself out of fear in the direct way one can decide to raise a hand.

  Existing positions leave this tension unresolved. Internalists tend to ignore emotions or treat them as by-products of action-related beliefs, thereby sidestepping the specific phenomenology of emotional recalcitrance. Externalists often treat reasons for emotion as purely a matter of fittingness—whether the emotion matches the value of its object—ignoring the agent's perspective entirely. Consequently, it remains an open question whether the internalist's 'grip requirement' is a universal feature of normativity or an artefact of focusing exclusively on voluntary action. This chapter aims to close that gap by treating emotional reasons as a stress test for the deliberative constraint.

  **Methodology and Work Plan**
  The chapter will be drafted over a single term, structured to move from definition to confrontation, and finally to synthesis. The approach is argumentative rather than historical; I will construct the strongest version of the internalist position and test it against the phenomenology of emotion, rather than surveying the literature exhaustively.

  In weeks one and two, I will establish the working definitions. I need to fix a version of internalism that is strong enough to be interesting but standard enough to be recognisable—specifically, the claim that normative reasons require a deliberative route to motivation. Simultaneously, I will stipulate a working view of emotion. I will not attempt to solve the philosophy of mind puzzle of what emotions *are*, but I will assume a hybrid view where emotions involve both affect and evaluation, and crucially, are not under direct voluntary control. This stipulation is necessary to prevent the project from ballooning; if emotions are treated as actions, the problem dissolves, but that contradicts the phenomenological data I wish to exploit.

  Weeks three and four will be dedicated to constructing the 'Internalist Dilemma'. I will argue that when applied to emotion, internalism faces two horns. The first horn is absurdity: if reasons require a deliberative route, and we cannot deliberate directly into emotions, then there are no reasons for emotion. This contradicts our robust practice of emotional criticism. The second horn is collapse: if the internalist relaxes the deliberative requirement to accommodate emotion (perhaps by appealing to idealised agents who could reason themselves into grief), the constraint becomes so thin it no longer distinguishes internalism from externalism. I will draft the core argument sections here, focusing on cases of recalcitrant emotion, such as irrational grief or misplaced fear.

  Weeks five and seven will address the primary objection head-on: that talk of 'reasons for emotion' is a category mistake, and that such claims are merely about fittingness. A supervisor-style objection will likely be that I am smuggling externalism in by assuming emotions have normative reasons distinct from their correctness conditions. I will deal with this not by footnoting it, but by making it the pivot of the chapter. I will argue that even if fittingness is necessary for a correct emotion, it is not sufficient for a reason *for the agent*. An emotion can be fitting yet the agent may have no reason to cultivate it (or vice versa), depending on their psychic economy. If the internalist concedes that fittingness alone suffices for a reason, they have abandoned the 'grip' requirement. If they deny it, they must explain how fittingness grips the agent. I will spend these weeks refining this distinction to ensure the argument does not rest on a verbal dispute about the word 'reason'.

  Weeks eight and nine will explore the implications for action. If the deliberative constraint fails for emotion, does it fail for action? I will consider whether the 'idealisation' strategy often used to save internalism in action cases (claiming an ideal agent would be motivated) works any better for emotion. My suspicion is that an idealised route into an emotion looks nothing like a route, which suggests the strategy was always vacuous. This section will determine whether the chapter concludes that internalism is false, or merely that it must be restricted to voluntary outputs.

  Weeks ten and eleven will be for drafting the conclusion and smoothing the transitions. The goal is to ensure the argument flows from the specific case of emotion to the general theory of reasons. Week twelve will be reserved for revision and polishing, ensuring the word count sits between 8,000 and 10,000 words.

  **Why This Approach?**
  One might suggest focusing on reasons for belief instead of emotion. Beliefs are also involuntary, yet we speak of reasons for belief. However, the normativity of belief is truth-aimed, whereas the normativity of emotion is value-aimed. The 'grip' requirement is fundamentally about the good and the desirable, not the true. Using belief would shift the debate to epistemic normativity, which has different rules regarding voluntarism. Others might suggest simply adopting a fittingness account and being done with it. But this ignores the internalist insight that normativity must matter to the agent. A pure fittingness account risks making reasons entirely external facts that an agent might be utterly incapable of accessing or caring about. This chapter takes the internalist worry seriously enough to try to save it, only to show where it breaks.

  **Possible Conclusions**
  There are three determinate outcomes this chapter might reach. First, it may conclude that internalism is false because the deliberative constraint cannot accommodate the involuntary nature of emotions, and since we clearly have reasons for emotions, the constraint is flawed. Second, it may conclude that internalism is true but must be reformulated to decouple 'grip' from 'deliberation', perhaps relying on a dispositional account of motivation rather than a deliberative one. Third, it may conclude that reasons for emotion and reasons for action are fundamentally disunified, requiring a dualistic theory of reasons. The deciding consideration will be whether a non-deliberative notion of 'grip' can be made coherent without losing the critical bite internalism was meant to have. If 'grip' means nothing more than 'is relevant to', internalism collapses. If it means 'can motivate', it excludes emotion.

  **Risks and Failure Conditions**
  The primary risk is scope creep. The philosophy of emotion is a minefield; if I spend too much time defending the involuntariness of emotion, the chapter will exceed 10,000 words without reaching the normative argument. To mitigate this, I will treat the involuntariness of emotion as a dialectical starting point: if the internalist wishes to deny it, they bear the burden of explaining how we can reason ourselves into grief on command.

  The chapter would count as a failure even if well-written if it turns out that the distinction between 'reasons for emotion' and 'fittingness conditions' is unsustainable. If it transpires that all normative claims about emotion are reducible to claims about correctness without remainder, then the 'Internalist Dilemma' dissolves because there is no normative pressure for internalism to explain. I will test this early in the term; if the fittingness reduction holds up under scrutiny, I will need to pivot to arguing that fittingness itself requires a grip, rather than arguing about reasons specifically. A second failure condition is if the argument proves too much. If the deliberative constraint is shown to fail for emotion, but the reasons for thinking it fails for emotion also apply to action (e.g., if action is also less voluntary than assumed), the chapter might inadvertently undermine the possibility of reasons for action entirely, leading to a sceptical conclusion I am not equipped to defend in this space. I will need to carefully ring-fence the argument to show why emotion is a special case that breaks the model, rather than proof that the model was always broken.

  **Handling the Fittingness Objection**
  I anticipate the objection that reason-claims about emotions are merely claims about aptness or fittingness, meaning my test case assumes externalism from the start. I will handle this by distinguishing between the *standard* of correctness and the *reason* for the agent. An emotion can be fitting (the object is truly fearsome) without the agent having a reason to feel it (perhaps feeling fear would incapacitate them from saving a life). If the internalist says the agent has a reason to feel fear because it is fitting, they are appealing to an external fact. If they say the agent has a reason only if they care about avoiding danger, they are back to the subjective set. I will argue that the 'fittingness' objection conflates the question 'Is this emotion correct?' with 'Does this agent have a reason to cultivate this emotion?'. By prying these apart, I show that the internalist must account for the latter, and that is where the deliberative constraint fails. This will not be a footnote, but the central dialectical move of the middle section.

  **Summary**
  This chapter proposes to use the neglected case of emotional reasons to pressure-test the dominant internalist framework. By showing that the deliberative constraint cannot accommodate involuntary states without vacuity, I aim to force a choice: either we accept a fragmented theory of reasons, or we acknowledge that the 'grip' requirement must be understood in a way that no longer relies on deliberation. Either way, the standard formulation of the internalism/externalism debate will be shown to be insufficiently general.
