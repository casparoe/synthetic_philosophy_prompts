prompt: |-
  I sit in on a graduate reading group that has spent the term on Scanlon's contractualism: the view, roughly, that an act is wrong when it would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject, and that whether a principle is rejectable is settled by comparing the complaints it would give particular individuals rather than by totalling benefits and burdens across people. At the last session, two of the regulars argued past one another for the better part of an hour. I have to write up the session notes and would rather adjudicate the argument properly than summarize it, so I am setting it out as faithfully as I can.

  They started from the standard worry: because the test looks at complaints one person at a time, it seems unable to add up many small burdens. It therefore appears to tell us to inflict an hour of severe nausea on each of two million people rather than break one stranger's arm, and, by the same structural feature, it cannot see why five lives saved is better than one.

  1. Marta said insensitivity to numbers is the point of the view rather than a defect. Justification here is person-relative: what we owe someone is a justification addressed to her, and telling her she must bear a broken arm because two million others would otherwise suffer less is no answer to her at all. The transplant case is the payoff — we do not kill one to save five — and any view that reaches the nausea verdict by summing will somewhere sacrifice an individual to the aggregate. She added that Ellis's confidence about the nausea case is itself suspicious: the individual burden is tiny, the victim is unidentified, and the intuition has exactly the shape of the utilitarian verdict he is supposed to be arguing for rather than assuming.

  2. Ellis replied that Marta is conflating two things the contractualist needs to separate: refusing to sum burdens across persons, and refusing to count how many persons a principle burdens. The first may be defensible; the second is not, and the rejectability test as stated can only do the second, since the strength of a complaint is a function of what happens to the person who has it, so adding further complainants cannot strengthen anyone's complaint. That is also why the view cannot say that five deaths are worse than one. Marta wants the transplant verdict, but she is deriving it from the same source that produces the nausea verdict, and she has offered no principled way to keep the first and discard the second. If she wants the transplant result, she should get it from a tie-breaking rule or from the distinctive wrong of killing.

  3. Marta conceded that the nausea verdict has some pull, and said contractualism has two internal resources. First, numbers enter through risk: where a principle distributes a burden by lottery, each person's complaint is only as strong as her probability-weighted prospect, and enlarging the pool dilutes each complaint, so the view can register how many people are affected without summing anything. Second, burdens that recur within a single life accumulate inside that person's own complaint. On this reading contractualism is numbers-blind only where burdens are certain and borne by distinct people, which is precisely where, she says, numbers should not count.

  4. Ellis said the risk move forces a choice of standpoint and that neither horn is comfortable. Consider a maintenance crew of a thousand keeping a hazardous generator running. Policy S gives each worker a one-in-a-hundred chance of a disabling hand injury, so about ten injuries are expected. Policy C names ten workers who will certainly be injured and spares the rest. Set aside any preference for certainty as such: the expected number of injuries is the same and everyone, ex ante, prefers S. Assess complaints ex post and the two policies are indistinguishable, since the injured have complaints of identical strength under both — so contractualism cannot explain why we must spread the risk, which looks like a plain duty. Assess them ex ante and contractualism has quietly taken on expected-value reasoning over a population, which is the aggregative apparatus it was meant to replace; at that point it is ex ante prioritarianism with a story about justification bolted on. So counting-through-risk is either idle or a surrender.

  5. Marta gave two replies. First, the ex ante standpoint is not a concession but the natural home of the view: what gets assessed is a principle, and a principle is the sort of thing one accepts or rejects before knowing where the losses land. Second, the duty to spread need not come from expected numbers at all. Each worker can reasonably reject a principle that assigns certainty to a named few while others bear nothing, because it singles her out; that is a complaint about how she is being treated relative to others, not an aggregate of anyone's injuries. She called this the singling-out complaint, and said it is individual in form, so contractualism gets the duty to randomize for free.

  6. Ellis answered that the singling-out complaint is numbers in disguise: its entire force depends on how many others are spared. If the crew were ten and all ten had to be injured, there would be nothing to single out and no complaint; if it were ten with one to be injured, the complaint has the same shape. What Marta calls singling out is just the minimization of total harm described from the position of the loser. Worse, the ex ante move has a further cost, which he called the after-the-draw objection: once the lottery is drawn and the ten injured are known, Marta's view seems committed to saying that the policy is still not reasonably rejectable, so that we may go ahead against people whose injuries we now know to be certain — and that is exactly the kind of sacrifice contractualism was built to forbid.

  7. Marta said the after-the-draw objection confuses which principle we may act on with what we owe those who end up badly off under it. Compensation, aid and accommodation are governed by further principles, and keeping the two apart is a virtue: it lets us act on principles everyone can accept while still having something to say to the injured. She then suggested the whole dispute may be misdescribed. Perhaps the rejectability test was never meant as a decision procedure for cases of this shape at all, but as a model of the relation of mutual recognition among persons; if so, insensitivity to numbers is the correct output rather than a defect, and Ellis's objection presupposes the decision-procedure reading.

  8. Ellis granted that the aggregation objection by itself does not refute contractualism, but said that is the wrong thing to grant. If the test is a model of mutual recognition rather than a criterion of wrongness, then it cannot deliver verdicts on institutional cases like the crew's at all, and Marta should say so plainly instead of reaching for the decision-procedure reading when the nausea case is on the table and the recognition reading when the exposure case is.

  Please adjudicate move by move: rate each of the eight moves on a scale from clearly mistaken to clearly right, with a sentence or two justifying each rating, judging the arguments as actually made rather than as they could have been made. Then say who is more right overall and on which point, and finally say what both parties are missing — in particular whether the duty to spread risk in the exposure case is as clear as Ellis assumes, what it would really cost contractualism to take numbers into account where burdens are certain, and whether the ex ante / ex post distinction is doing the work both of them take it to do. No citations or reading suggestions, please.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two graduate students (Marta and Ellis) about Scanlonian contractualism, specifically focusing on the "aggregation problem" (numbers counting) and the "risk/ex ante" response.
      *   **Input:** A summary of 8 specific moves in the debate.
      *   **Output Requirements:**
          1.  Rate each of the 8 moves (Clearly Mistaken to Clearly Right) with a 1-2 sentence justification.
          2.  Determine who is more right overall and on which point.
          3.  Identify what both parties are missing (specifically addressing: duty to spread risk, cost of counting numbers with certain burdens, and the work done by the ex ante/ex post distinction).
          4.  **Constraint:** No citations or reading suggestions.

  2.  **Analyze the Debate Content (Move by Move):**

      *   **Move 1 (Marta):** Claims insensitivity to numbers is a feature, not a bug. Justification is person-relative. Transplant case supports this. Attacks Ellis's nausea intuition as utilitarian bias.
          *   *Assessment:* Strong defense of the core contractualist intuition (separateness of persons). The transplant analogy is standard Scanlon. The attack on the nausea intuition is plausible (intuitions about large numbers of small harms are notoriously unstable).
          *   *Rating:* Mostly Right.

      *   **Move 2 (Ellis):** Distinguishes refusing to sum burdens vs. refusing to count persons. Claims contractualism can't count persons because complaint strength is individual. Says Marta derives transplant verdict from the same source as the nausea verdict (inconsistency).
          *   *Assessment:* This is a very strong technical objection. Scanlon's formula focuses on the *strength* of individual complaints. If complaint strength doesn't aggregate, adding more people with the same complaint doesn't change the outcome. This highlights the structural flaw in the "individual complaint" model regarding numbers.
          *   *Rating:* Clearly Right.

      *   **Move 3 (Marta):** Concedes nausea pull. Offers two resources: 1. Risk/Probability (dilutes complaint), 2. Recurring burdens within a life. Claims numbers only don't count when burdens are certain and distinct.
          *   *Assessment:* The risk move is the standard Scanlonian response (Scanlon's *What We Owe to Each Other* discussion on risk). The "recurring burdens" point is less standard but plausible. However, limiting number-sensitivity to uncertain cases is a significant retreat from the initial claim in Move 1 that insensitivity is the *point*.
          *   *Rating:* Mostly Right (but slightly inconsistent with Move 1).

      *   **Move 4 (Ellis):** The "Ex Ante/Ex Post" dilemma regarding the maintenance crew. If ex post, can't distinguish risk-spreading from certain harm (same injured parties). If ex ante, contractualism collapses into expected-value utilitarianism/prioritarianism.
          *   *Assessment:* This is the "Ex Ante/Ex Post Objection" often leveled at contractualism. It forces a dilemma: either the view is blind to risk distribution or it surrenders its anti-aggregative core. It's a powerful critique of the risk solution.
          *   *Rating:* Clearly Right.

      *   **Move 5 (Marta):** Defends ex ante as natural for principles. Introduces "Singling-Out Complaint" (fairness/relational complaint, not aggregate harm).
          *   *Assessment:* The ex ante defense is standard. The "singling-out" argument is a clever pivot to a *different* kind of complaint (fairness/procedural) rather than welfare aggregation. This preserves the non-aggregative structure while explaining risk-spreading.
          *   *Rating:* Mostly Right.

      *   **Move 6 (Ellis):** Attacks "Singling-Out" as numbers in disguise (force depends on how many are spared). Raises "After-the-Draw Objection": once the lottery is run, the injured know their fate; if the principle was acceptable ex ante, are we just abandoning them ex post?
          *   *Assessment:* The "numbers in disguise" point is sharp—if the complaint relies on others being spared, it implicitly references the group size. The "After-the-Draw" objection is devastating for the ex ante defense if it implies we owe nothing specific to the losers once the risk materializes.
          *   *Rating:* Clearly Right.

      *   **Move 7 (Marta):** Distinguishes acting on a principle vs. what we owe the losers (compensation/aid). Suggests the view is a model of mutual recognition, not a decision procedure.
          *   *Assessment:* The compensation distinction helps mitigate the "After-the-Draw" worry. The shift to "model of mutual recognition" is a retreat from the normative force of the view regarding specific cases but saves the theoretical coherence. It admits the view might not solve the aggregation problem directly.
          *   *Rating:* Mostly Right (as a defensive maneuver).

      *   **Move 8 (Ellis):** Calls out the shift between decision-procedure and recognition model as ad hoc depending on which case is inconvenient. Says if it's just recognition, it can't judge institutional cases.
          *   *Assessment:* This catches Marta potentially equivoking. If the theory can't deliver verdicts on the crew case, it loses practical utility. If it does, it faces the aggregation problem. This highlights a tension in the theory's application.
          *   *Rating:* Clearly Right.

  3.  **Synthesize Overall Judgment:**
      *   **Who is more right?** Ellis seems to have the better of the technical arguments regarding the structural limitations of contractualism. Marta defends the *spirit* of the view well, but Ellis successfully exposes the mechanical difficulties in making it work for the cases discussed (nausea vs. arm, risk vs. certainty).
      *   **Key Point:** Ellis wins on the structural incoherence of trying to have it both ways (non-aggregative but sensitive to numbers via risk). Marta wins on the moral intuition behind the separateness of persons, but fails to provide a consistent mechanism.

  4.  **Identify Missing Elements (The "What Both Are Missing" Section):**
      *   **Duty to Spread Risk:** Ellis assumes it's "plain." Is it? Sometimes concentrating risk on volunteers or those compensated is better. It's not an absolute duty.
      *   **Cost of Counting Numbers:** If contractualism allows counting numbers in certain burden cases, it collapses into a form of utilitarianism or prioritarianism, losing its distinctive "justification to each person" feature. It becomes a weighing scale, not a veto power.
      *   **Ex Ante/Ex Post:** They treat it as a binary switch. But principles govern *types* of actions. The ex ante perspective is the only one compatible with *principles*, but Ellis is right that it creates a disconnect with the *victims*. The missing piece is that the "complaint" might change nature from welfare-based to fairness-based, which neither fully explores as a stable middle ground.

  5.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Constraint Check:* No citations. No reading suggestions. Rate moves 1-8. Adjudicate overall. Identify missing points.
      *   *Tone:* Academic, adjudicatory, precise.
      *   *Rating Scale:* Clearly Mistaken -> Mistaken -> Debatable -> Right -> Clearly Right. (I will use descriptive equivalents as requested: "clearly mistaken to clearly right").

      *(Self-Correction during drafting)*: I need to be careful not to just say "Scanlon says X." I must judge the arguments *as made*.
      *   Move 1: Marta is right about the core intuition, but maybe too dismissive of the nausea case. Let's call it "Right."
      *   Move 2: Ellis is technically correct about the formula. "Clearly Right."
      *   Move 3: Marta's risk move is standard but the "recurring burdens" point is weak. "Mostly Right."
      *   Move 4: Ellis's dilemma is strong. "Clearly Right."
      *   Move 5: Marta's "singling out" is a good save, but relies on a specific conception of fairness. "Right."
      *   Move 6: Ellis's "after-the-draw" is the strongest point in the debate. "Clearly Right."
      *   Move 7: Marta's distinction helps, but the "recognition model" shift is a retreat. "Mostly Right."
      *   Move 8: Ellis correctly identifies the equivocation. "Clearly Right."

      *Overall:* Ellis is more right on the structural coherence. Marta is more right on the foundational moral motivation.
      *Missing:* The duty to spread risk isn't absolute (sometimes efficiency matters more). The cost of counting numbers is losing the "veto" power of the individual. The ex ante/post distinction isn't the whole story; the *type* of complaint (welfare vs. fairness) is the real lever.

  6.  **Final Polish:** Ensure the "sentence or two" constraint for the move ratings is met. Ensure the final section addresses the three specific prompts.

      *(Refining Move Ratings)*:
      1. Marta: Right. (Captures the core contractualist motivation accurately).
      2. Ellis: Clearly Right. (Identifies the formal limitation of the complaint mechanism).
      3. Marta: Mostly Right. (Risk move is valid, but the concession undermines Move 1).
      4. Ellis: Clearly Right. (The dilemma is structurally sound).
      5. Marta: Right. (Singling-out is a distinct, non-aggregative complaint).
      6. Ellis: Clearly Right. (The after-the-draw problem is a serious unresolved tension).
      7. Marta: Mostly Right. (Compensation helps, but the model shift is ad hoc).
      8. Ellis: Clearly Right. (Exposes the inconsistency in Marta's theoretical stance).

      *(Refining Overall)*: Ellis wins on logic; Marta wins on moral plausibility. But since the prompt asks to adjudicate the *argument*, Ellis's logical points hold more water in a debate setting about coherence.

      *(Refining Missing)*:
      1. Duty to spread: Not always clear (e.g., if spreading risk increases total danger).
      2. Cost of counting: Turns the veto into a scale, destroying the "reasonable rejectability" mechanism.
      3. Ex Ante/Post: They miss that principles are inherently ex ante, but obligations to victims are ex post; the tension is between *justification of rules* and *treatment of individuals*, not just time.

      *Wait, one check on Move 1:* Marta says the nausea intuition is suspicious. Is she right? Many philosophers think the nausea case *is* a counterexample. But within contractualism, she is right that the theory *should* reject it. I will rate it "Right" because it faithfully represents the view's internal logic, even if the view is controversial.
      *Check on Move 6:* Is Ellis clearly right that singling-out is numbers in disguise? Not necessarily. Fairness is distinct from aggregation. But the "after-the-draw" point is very strong. I'll rate the move "Right" rather than "Clearly Right" because the "numbers in disguise" claim is contestable, even if the second half is strong. Actually, the prompt asks to judge the argument *as made*. The "after-the-draw" part is the killer. I'll stick with "Clearly Right" because the second half of the move secures it.

      *Let's finalize the ratings.*
      1. Right.
      2. Clearly Right.
      3. Mostly Right.
      4. Clearly Right.
      5. Right.
      6. Clearly Right.
      7. Mostly Right.
      8. Clearly Right.

      *Wait, I need to make sure I don't sound like I'm citing Scanlon.* I will refer to "the view" or "contractualism" generally.

      *Final check on constraints:* "No citations or reading suggestions." "Sentence or two justifying each rating." "Say who is more right overall and on which point." "Say what both parties are missing."

      *Okay, ready to write.*
answer: |-
  **Move 1: Marta**
  **Rating:** Right.
  **Justification:** She correctly identifies the core contractualist motivation: that justification must be addressable to each individual, which structurally resists trading one person off for an aggregate. Her suspicion of the nausea intuition is warranted because it presupposes the utilitarian calculus the view is designed to replace.

  **Move 2: Ellis**
  **Rating:** Clearly Right.
  **Justification:** He accurately exposes the formal limitation of the complaint mechanism: if the strength of a complaint is fixed by individual impact, adding more complainants cannot mathematically outweigh a single stronger complaint without changing the theory's definition of strength.

  **Move 3: Marta**
  **Rating:** Mostly Right.
  **Justification:** The risk argument is a standard and viable contractualist resource, but her concession that numbers matter in risk cases undermines her initial claim in Move 1 that insensitivity to numbers is the view's central point.

  **Move 4: Ellis**
  **Rating:** Clearly Right.
  **Justification:** He constructs a sound dilemma: if the view assesses outcomes ex post, it cannot distinguish risk-spreading from certain harm, but if it assesses ex ante, it relies on expected values that mimic the aggregative reasoning it opposes.

  **Move 5: Marta**
  **Rating:** Right.
  **Justification:** The "singling-out" complaint successfully identifies a non-aggregative ground for preferring lotteries based on fairness and equal respect rather than the sum of welfare outcomes.

  **Move 6: Ellis**
  **Rating:** Clearly Right.
  **Justification:** The "after-the-draw" objection is devastating: if a principle is justified only by ex ante probabilities, the theory struggles to explain why we owe specific duties to the actual losers once the risk materializes into certain harm.

  **Move 7: Marta**
  **Rating:** Mostly Right.
  **Justification:** Distinguishing between the justification of principles and the duty of compensation mitigates the harshness of the after-the-draw result, but shifting to a "model of recognition" looks like a retreat from the theory's claim to guide action.

  **Move 8: Ellis**
  **Rating:** Clearly Right.
  **Justification:** He correctly identifies that Marta is equivocating between a decision procedure and a relational model to avoid counterexamples, which threatens the theoretical consistency of the view.

  ***

  **Overall Adjudication**
  Ellis is more right overall, specifically on the point of **structural coherence**. While Marta successfully defends the moral intuitions that motivate contractualism (the separateness of persons and the transplant verdict), Ellis demonstrates that the machinery of the view cannot consistently deliver those verdicts without either collapsing into aggregation or failing to account for risk and numbers. Marta wins on the *spirit* of the theory, but Ellis wins on the *logic* of its application.

  **What Both Parties Are Missing**

  1.  **The Duty to Spread Risk:** Ellis assumes the duty to spread risk in the exposure case is "plain," but this is not universally true. If spreading risk increases the total probability of harm or reduces the efficiency of a vital project, contractualism might permit concentrating the burden on those who consent or are compensated, meaning the "duty" is conditional rather than absolute.
  2.  **The Cost of Counting Numbers:** Neither fully articulates that allowing numbers to count in cases of certain burden does not just tweak the theory but dismantles the "veto" power of the individual. If a million small complaints can outweigh one catastrophic one, the requirement of "reasonable rejectability" becomes a simple weighing scale, destroying the distinctive shield contractualism offers against being sacrificed for the greater good.
  3.  **The Ex Ante / Ex Post Distinction:** Both treat this as a temporal switch, but the real work is being done by a shift in the **type of complaint**. The ex ante perspective relies on welfare-based complaints (risk of injury), while the "singling-out" defense relies on fairness-based complaints (status relative to others). The tension is not just about when we judge, but that the theory must juggle two incommensurable kinds of reasons (welfare vs. fairness) to avoid Ellis's dilemma, a cost neither explicitly acknowledges.
