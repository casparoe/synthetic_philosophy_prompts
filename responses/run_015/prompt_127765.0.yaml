      *Let's write.*
answer: |-
  ### Spec Sheet: Adequacy Conditions for Advance Directive Authority

  To function as a viable normative framework, a theory of advance directives (ADs) must satisfy a set of metaphysical, normative, and practical constraints. It cannot simply assert that "autonomy matters"; it must explain *which* autonomy, *whose* welfare, and *how* authority transfers across time and psychological change. Below are the necessary desiderata.

  #### I. Metaphysical and Psychological Desiderata

  **1. The Continuity Condition**
  The account must specify the threshold of psychological connectedness required for authority transfer. It cannot rely on a binary switch (competent/incompetent) alone. It must explain why the earlier self has authority over the later self in cases of mild cognitive impairment but potentially lacks it in cases of severe dementia.
  *   *Requirement:* Must distinguish between *loss of capacity* (inability to process information) and *loss of self* (fundamental change in values, personality, or conceptual framework).
  *   *Why:* Without this, the theory cannot handle the "conceptual rupture" case (e.g., the patient who no longer understands "dignity" as a narrative project). If the later self lacks the concepts necessary to hold the value underlying the directive, the directive's authority becomes metaphysically unmoored.

  **2. The Interest Recognition Condition**
  The account must acknowledge that the later self possesses *current* interests, even if incapacitated. These are primarily experiential (pleasure, pain, comfort) but may include rudimentary relational interests.
  *   *Requirement:* Cannot treat the later self as a mere vessel for the earlier self's wishes. The later self's current well-being must have independent moral weight.
  *   *Why:* To ignore the current sentient experience of the later self is to treat a living human being as a corpse carrying a will. This violates basic clinical ethics regarding harm.

  **3. The Value-Preference Distinction**
  The account must distinguish between *precedent autonomy* (values, life projects, critical interests) and *predicted preferences* (specific choices based on past tastes).
  *   *Requirement:* Must explain why a directive based on a deep value (e.g., "I do not want to live as a vegetable") carries different weight than one based on a preference prediction (e.g., "I hate nursing homes").
  *   *Why:* Preferences are brittle; they rely on stable contexts. Values are robust but abstract. A theory that collapses these cannot adjudicate cases where the context has changed so radically that the preference is meaningless, but the value remains contested.

  #### II. Normative and Ethical Desiderata

  **4. The Non-Maleficence Constraint**
  The account cannot authorize actions that cause severe, gratuitous harm to the later self solely to satisfy the earlier self's abstract commitments, unless a very high bar of justification is met.
  *   *Requirement:* Must provide a mechanism to override an AD if compliance results in obvious, profound suffering for the later self who cannot comprehend the reason for that suffering.
  *   *Why:* In the "feeding tube" scenario, if the later self experiences eating as pure pleasure and lacks the concept of "dignity," forcing starvation to honor a narrative project inflicts harm on a being that cannot consent to the trade-off.

  **5. The Integrity of the Life Story**
  Conversely, the account must explain why we do not simply discard the AD when the personality changes. It must preserve the intuition that a life has a narrative arc that deserves protection even when the protagonist forgets the plot.
  *   *Requirement:* Must grant the earlier self some veto power over the later self's trajectory, preventing the "tyranny of the present moment."
  *   *Why:* If the later self's current mood always trumps the earlier self's considered judgment, the concept of a "life plan" dissolves. We become slaves to our future cognitive decline.

  **6. The Revocation Asymmetry**
  The account must handle cases where the later self attempts to revoke the AD (e.g., a dementia patient happily demanding the food they previously forbade).
  *   *Requirement:* Must specify whether a current expression of desire can override a prior competent refusal.
  *   *Why:* In standard consent, current consent overrides prior refusal. In ADs, prior refusal often overrides current inability to consent. The theory must resolve this asymmetry without contradiction.

  #### III. Legal and Clinical Desiderata

  **7. The Actionability Requirement**
  The account must yield decisions that clinicians can implement without requiring metaphysical expertise.
  *   *Requirement:* Cannot demand that doctors adjudicate deep questions of personal identity or the precise degree of psychological connectedness.
  *   *Why:* Clinical settings require binary or triage decisions (feed/do not feed). A theory that requires a philosophical inquiry into "selfhood" before every meal is clinically useless.

  **8. The Legal Consistency Constraint**
  The account cannot flatly contradict established legal standards regarding competency and surrogate decision-making.
  *   *Requirement:* Must align with the legal presumption that a competent adult's prior written instructions hold weight after incapacity.
  *   *Why:* A theory that renders all ADs morally void upon severe dementia undermines the legal infrastructure of healthcare proxies and living wills.

  ---

  ### Flagged Tensions: Jointly Unsatisfiable Desiderata

  There are structural tensions within this spec sheet that suggest no single theory can maximize all variables simultaneously.

  **Tension A: The Integrity/Welfare Conflict (Desiderata 4 & 5)**
  *   **The Conflict:** You cannot fully satisfy the *Integrity of the Life Story* and the *Non-Maleficence Constraint* in cases of conceptual rupture.
  *   **Why:** If the earlier self defined dignity as "cognitive independence" and refused feeding, but the later self experiences feeding as joy and has no concept of independence, honoring the AD protects the narrative integrity (D5) but inflicts experiential harm (D4). Honoring the welfare protects the sentient being (D4) but desecrates the life project (D5). One must be prioritized; they cannot both be fully satisfied.

  **Tension B: The Continuity/Actionability Conflict (Desiderata 1 & 7)**
  *   **The Conflict:** A nuanced *Continuity Condition* undermines *Actionability*.
  *   **Why:** To accurately assess whether the later self is "conceptually different enough" to void the AD requires a granular psychological assessment that clinicians cannot perform in acute settings. If you make the continuity threshold precise enough to be morally robust, it becomes too complex for clinical use. If you make it simple enough for clinics (e.g., "legal incompetence"), it fails to capture the moral nuance of conceptual rupture.

  ---

  ### Scorecard: Three Standard Views

  Here is how three dominant theoretical frameworks score against the desiderata. Note that high scores in one column often necessitate low scores in another due to the tensions flagged above.

  #### 1. The Autonomy-First View (Dworkin-esque)
  *Core Claim:* Critical interests (values, life narrative) dominate experiential interests (current pleasure/pain). The earlier self has sovereign authority.
  *   **Continuity (D1):** **High.** Assumes the self persists through dementia; the "person" is the author of the life story, not the current experiencer.
  *   **Interest Recognition (D2):** **Low.** Explicitly subordinates current experiential interests to past critical interests.
  *   **Non-Maleficence (D4):** **Low.** Permits significant harm to the later self (e.g., starvation) to uphold the earlier self's definition of dignity.
  *   **Integrity (D5):** **High.** Perfectly preserves the life narrative.
  *   **Actionability (D7):** **High.** Directives are binding orders; clinicians follow the text.
  *   **Verdict:** Solves the legal/binding problem but fails the welfare constraint in conceptual rupture cases. It treats the later self as a means to the earlier self's ends.

  #### 2. Substituted Judgment (Standard Legal/Medical Model)
  *Core Claim:* Surrogates should decide what the patient *would have chosen* if they were currently competent.
  *   **Continuity (D1):** **Medium.** Assumes enough continuity to simulate the patient's choice, but acknowledges change.
  *   **Interest Recognition (D2):** **Medium.** Often collapses into "Best Interests" when the patient's wishes are unknown, acknowledging current welfare.
  *   **Value-Preference (D3):** **Low.** Struggles to distinguish between what the patient *valued* vs. what they *wanted*. Often conflates the two.
  *   **Actionability (D7):** **High.** Fits existing legal hierarchies and surrogate structures.
  *   **Conceptual Rupture:** **Fails.** It asks "What would you choose?" in scenarios where the "you" that exists now *could not conceive* of the choice the old "you" made. It forces a hypothetical competence onto a fundamentally altered psyche.
  *   **Verdict:** Clinically robust but metaphysically shaky. It papers over the conceptual rupture by pretending the old self is still in the room.

  #### 3. The 'No Authority Across Rupture' View (Dresser/Robertson)
  *Core Claim:* Severe dementia creates a new person. Prior directives are merely advisory evidence, not binding commands. Current welfare is paramount.
  *   **Continuity (D1):** **Low.** Explicitly rejects strong psychological continuity in severe dementia.
  *   **Interest Recognition (D2):** **High.** Prioritizes the current sentient being's experience.
  *   **Non-Maleficence (D4):** **High.** Prevents harm to the later self for the sake of abstract past values.
  *   **Integrity (D5):** **Low.** Sacrifices the life narrative. The earlier self loses control over their ending.
  *   **Legal Consistency (D8):** **Low.** Contradicts most current statutes which treat ADs as binding upon incapacity.
  *   **Verdict:** Morally protective of the vulnerable later self but undermines the very institution of advance planning. If adopted, ADs become mere suggestion boxes, reducing trust in the system.

  ### Summary of Reasoning

  The spec sheet reveals that the "tricky scenario" (narrative dignity vs. present pleasure) is not a bug to be fixed but a feature of the moral landscape. The tension between **Desideratum 4 (Non-Maleficence)** and **Desideratum 5 (Integrity)** is genuine.

  *   If you prioritize **Integrity**, you accept that the earlier self can sacrifice the later self's happiness for the sake of the life story's coherence. This satisfies the legal need for bindingness but risks moral horror (starving a happy patient).
  *   If you prioritize **Welfare**, you accept that the earlier self's authority expires when their conceptual framework expires. This protects the vulnerable later self but renders advance planning toothless for the very conditions (dementia) where it is most needed.

  An adequate account must therefore be hybrid: it must grant *presumptive* authority to the earlier self (satisfying Legal Consistency and Integrity) but include a *harm-based override* (satisfying Non-Maleficence) triggered specifically when the later self demonstrates positive affective states incompatible with the directive's rationale. However, this hybrid approach strains **Actionability**, as it requires clinicians to judge not just capacity, but the *quality* of the later self's experience and its relation to the earlier self's values. There is no frictionless solution; there is only the choice of which tension to manage.
