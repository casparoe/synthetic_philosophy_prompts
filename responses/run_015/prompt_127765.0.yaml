          *   Must align with legal/clinical realities (cannot contradict them flat-out).
          *   Must flag jointly unsatisfiable desiderata (tensions).
          *   Must score three standard views (Autonomy-First, Substituted Judgment, No Authority/Conceptual Rupture) against the list.
          *   **Constraint:** Keep the weight on the criteria/reasoning, not the scorecard. No bibliography.
      *   **Tone:** Philosophical, analytical, precise, rigorous.

  2.  **Deconstruct the Desiderata (The "Spec Sheet"):**
      *   *What makes a theory of ADs work?*
      *   1. **Respect for Precedent Autonomy:** The core intuition that people should control their future.
      *   2. **Protection of Current Welfare:** We can't just let people suffer needlessly if they can't understand why.
      *   3. **Identity Continuity:** How much change breaks the link between Past Self and Present Self?
      *   4. **Epistemic Humility/Clarity:** Can we actually know what the Past Self wanted vs. what they predicted?
      *   5. **Clinical Feasibility:** Doctors need actionable guidance, not metaphysical puzzles.
      *   6. **Legal Consistency:** Must fit within existing frameworks (competency standards, surrogate hierarchies).
      *   7. **Moral Status of the Incapacitated:** The later self isn't a object; they have interests *now*.

      *   *Refining the "Tricky Case":* The prompt mentions the "narrative dignity" vs. "present-tense pleasure" case. This is the Dworkin vs. Dresser/Robertson debate territory. The theory must handle *value transformation*, not just loss of capacity.

      *   *Distinctions to Maintain:*
          *   Authority (right to decide) vs. Welfare (what's good for them).
          *   Binding (must do) vs. Advising (consider this).
          *   Values (principles) vs. Preferences (specific choices).

      *   *Tensions:* The prompt explicitly asks to flag unsatisfiable pairs. The big one is *Integrity of Life Story* vs. *Current Experiential Interests*. If the later self is happy being fed, but the earlier self said "no feeding to preserve dignity," honoring one harms the other.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *D1: The Continuity Condition.* Must explain *why* the earlier self has authority. Is it psychological continuity? Biological? Moral?
      *   *D2: The Competency Threshold.* Must distinguish between total incapacity and transformed capacity.
      *   *D3: The Welfare Constraint.* Cannot mandate gross harm to a sentient being who cannot comprehend the reason.
      *   *D4: The Specificity/Translation Mechanism.* How do abstract values ("dignity") translate to concrete orders ("no tube") in a changed context?
      *   *D5: The Revocation Problem.* If the later self says "yes" to the thing the earlier self said "no" to, who wins? (Ulysses contracts).
      *   *D6: Institutional Actionability.* Clinicians need binary or triage options, not "it depends on metaphysical identity."

  4.  **Identifying Tensions (The "Jointly Unsatisfiable" Flag):**
      *   *Tension A:* **Global Integrity vs. Local Well-being.** If we prioritize the life narrative (Dworkin), we might override current happiness. If we prioritize current happiness (Dresser), we violate the life project.
      *   *Tension B:* **Strict Bindingness vs. Clinical Discretion.** If ADs are absolute, doctors become robots. If doctors have discretion, ADs aren't binding.

  5.  **Selecting the Three Views to Score:**
      *   1. **The Autonomy-First View (Dworkin-esque):** Critical interests dominate experiential interests.
      *   2. **Substituted Judgment (Standard Legal/Medical):** What *would* the patient choose if competent? (Often collapses into best interests).
      *   3. **The Discontinuity/No Authority View (Dresser/Rebecca Dresser):** Severe dementia creates a new person; prior directives are merely evidence, not commands.

  6.  **Scoring the Views:**
