answer: |-
  **JOINT STATEMENT ON THE DOING/ALLOWING DISTINCTION IN END-OF-LIFE CARE**

  **1. Agreed Claims**

  1. In clear cases (e.g., shooting versus withholding food), both sides agree on the classification of the act as doing or allowing.
  2. The distinction is not identical to the intending/foreseeing distinction, though they often overlap in practice.
  3. When causal contribution, intent, and outcome are held constant, the intuitive moral gap between doing and allowing narrows significantly.
  4. Both sides agree that existing legal and professional frameworks treat doing harm as requiring stronger justification than allowing it.
  5. Neither side claims that physical movement alone determines the distinction; bodily stillness is neither necessary nor sufficient for allowing.
  6. Both sides agree that agents have specific duties in clinical contexts that do not apply to bystanders, affecting the moral evaluation of omissions.
  7. Both sides accept that collapsing the distinction entirely would necessitate significant revisions to current palliative care protocols and liability structures.
  8. Neither side denies that allowing death can be morally wrongful; the dispute concerns whether it is *equally* wrongful to equivalent doing.
  9. Both sides agree that the psychological intuition of asymmetry is robust, even if its normative grounding is disputed.
  10. Both sides accept that causal claims in omission cases rely on counterfactual dependencies rather than physical force transmission.
  11. Both sides agree that public rule feasibility is a relevant moral consideration, even if its weight is disputed.
  12. Neither side claims that the distinction applies uniformly across all domains of morality without context sensitivity.

  **2. Residual Disagreements**

  | Disagreement | Distinctionist Formulation | Deflationist Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **Normative Source** | The asymmetry is an irreducible moral constraint grounded in the nature of agency. | The asymmetry is a proxy for consequential, causal, and institutional variables. | Substantive |
  | **Trade-offs** | Doing harm has lexical priority; no number of allowings justifies one killing. | Doing harm carries greater weight, but an exchange rate exists where outcomes outweigh acts. | Substantive |
  | **Metaphysical Ground** | The distinction tracks a real difference in how agents relate to outcomes in the world. | The distinction tracks descriptive differences in causal history, not normative reality. | Substantive |
  | **Protocol Design** | Guidelines should reflect the constraint even if it reduces overall efficiency. | Guidelines should optimize outcomes, using the distinction only for manageability. | Substantive |

  **3. Cruxes and Pre-Registered Predictions**

  **Crux 1: The Equalised-Pair Protocol**
  (i) Can the condition 'the threat is already underway independently of the agent' be stated in non-moral terms?
  (ii) If yes, the Deflationist gains explanatory ground; if no, the Distinctionist claims the view is circular.
  (iii) Both accept the Equalised-Pair Protocol as the testing ground.
  (iv) *Prediction:* The Distinctionist predicts intuitions of asymmetry persist even when causal independence is opaque. The Deflationist predicts asymmetry intuitions vanish when causal roles are identical. *Surprise:* Distinctionist is surprised if matching causal structures eliminates the intuition; Deflationist is surprised if it does not.

  **Crux 2: Timing and Status**
  (i) Is a death's status as done or allowed settled by the agent's conduct at the time she acts, or by the configuration at the time of death?
  (ii) This moves the Distinctionist if act-time matters (will); moves the Deflationist if outcome-time matters (causation).
  (iii) Both accept the case of the clinician who sets an unobjectionable infusion rate, sleeps, and the patient dies due to later changes, versus a clinician who discovers the lethal trajectory later and does nothing.
  (iv) *Prediction:* The Distinctionist predicts different moral status for the two clinicians based on initial authorization. The Deflationist predicts identical status given identical causal impact at death. *Surprise:* Distinctionist is surprised if the later clinician is judged harsher; Deflationist is surprised if the earlier clinician is judged harsher.

  **Crux 3: Lexical Priority vs. Exchange Rate**
  (i) Is there some number of deaths allowed that outweighs one death caused, and does the answer change when a million agents each allow a share of it?
  (ii) This moves the Distinctionist if no number justifies one killing; moves the Deflationist if a threshold exists.
  (iii) Both accept the argument from aggregated omissions versus singular commission.
  (iv) *Prediction:* The Distinctionist predicts no number of allowings justifies one killing. The Deflationist predicts a threshold exists where aggregate harm outweighs singular act. *Surprise:* Distinctionist is surprised if subjects accept trade-offs in high-stakes scenarios; Deflationist is surprised if subjects refuse trade-offs even when structural factors are controlled.

  **Crux 4: Location of Asymmetry**
  (i) Does the doing/allowing distinction explain the intending/foreseeing asymmetry or is it explained by it?
  (ii) This moves the Distinctionist if D/A is fundamental; Deflationist if I/F (will) explains D/A.
  (iii) Both accept arguments from double effect variants where intent is held constant.
  (iv) *Prediction:* The Distinctionist predicts D/A holds even without intent differences. The Deflationist predicts D/A vanishes when intent is controlled. *Surprise:* Distinctionist is surprised if intent controls erase the distinction; Deflationist is surprised if the distinction remains robust.

  **4. Falsification and Non-Empirical Disputes**

  **Evidence Against Own View**
  The Distinctionist would count as evidence against her view a consistent finding that when causal structures, intentions, and outcomes are perfectly matched, competent moral agents refuse to acknowledge any residual difference in wrongness. If the intuition dissolves under strict controls, the claim of an irreducible constraint is undermined. The Deflationist would count as evidence against his view a consistent refusal by agents to trade one active killing for any number of allowed deaths, even when institutional risks, causal uncertainty, and epistemic limits are removed. If the lexical priority persists in idealized conditions, the claim that the distinction is merely a proxy for structural factors is undermined.

  **Disputes Not About the World**
  We acknowledge that part of our dispute is not about the world but about conceptual taxonomy and the weighting of values. We may agree on all non-moral facts regarding causation, psychology, and outcomes, yet disagree on whether the label 'doing' should carry a specific normative weight. Furthermore, we dispute whether moral theory should prioritize the integrity of the agent's will or the optimization of states of affairs. This is a disagreement about the fundamental aim of ethics, not merely about the descriptive accuracy of the doing/allowing distinction. We record this to ensure future empirical work does not attempt to solve a normative divergence with descriptive data.
