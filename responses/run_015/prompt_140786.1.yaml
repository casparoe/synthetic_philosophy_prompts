      *Critique:* This is a bit list-heavy.
      Let's go for a two-beat exchange. It's punchier for a comedy night.
      Characters: Two Cognitive Scientists (or one acting as the system).
      Context: Updating a shared calendar.

      **A:** "I moved the meeting to Thursday."
      **B:** "Okay, but did moving the meeting change the color of the whiteboard?"
      **A:** "Why would it?"
      **B:** "Your update rule only specifies `Day(Meeting) = Thursday`. It doesn't specify `Color(Whiteboard) = White`."
      **A:** "So you're saying the whiteboard might be polka-dotted now?"
      **B:** "I'm saying I don't know. Did you write the frame axiom?"
      **A:** "I wrote 'etc.'"
      **B:** "'Etc.' isn't a logical operator."

      *Refining for the prompt's specific constraints:*
      "The difficulty is not deriving the consequences of an action but knowing which of the indefinitely many facts it is even supposed to re-derive."
      The joke above touches this. B doesn't know what persists.
      "The obvious remedy — doing more of the same kind of reasoning — does not by itself solve it."
      Maybe A tries to fix it by listing more, but it's never enough.

      *Let's try a specific format: A Change Request Ticket.*
      **Ticket #402:** Update Lab Inventory.
      **Change:** Beaker count: 10 → 9.
      **Required Attachments:** List of all facts unaffected by removing one beaker.
      **Submitted List:** Gravity, Proton Charge, Queen's Head on Stamp...
      **Status:** **REJECTED**.
      **Reason:** List incomplete. You omitted "The beaker did not turn into a hamster." Please resubmit with full enumeration of non-effects.

      *This hits the "indefinitely many" and "explicitly stated" constraints.*
      *It avoids Ramification:* Turning into a hamster isn't an indirect effect; it's a unrelated state change.
      *It avoids Complexity:* The rejection isn't "too long," it's "incomplete."
      *Setting:* Lab Inventory (fits CogSci dept).

      *Let's polish the wording.*
      Make it sound bureaucratic.
      The punchline is the rejection reason demanding a specific non-effect that highlights the absurdity of needing to state it.

      *Draft:*
      **INTERNAL MEMO: STATE UPDATE PROTOCOL**
      **Action:** Moved the coffee mug from left to right.
      **Submitted Frame Axioms:** Mug position changed. Wall color unchanged. Gravity unchanged.
      **Review Decision:** **Incomplete.**
      **Comment:** You failed to assert that moving the mug did not change the number of moons orbiting Jupiter. Until this is explicitly ruled out, we must assume the mug move might have caused lunar shedding. Please resubmit with full enumeration of non-effects.

      *Check against constraints:*
      1.  *Real Frame Problem:* Yes, the need to explicitly state non-change (persistence).
      2.  *Not Ramification:* Lunar shedding isn't a causal chain from moving a mug; it's an unrelated fact that needs a frame axiom.
      3.  *Not Complexity:* The issue isn't the processing time, it's the logical validity of the state description.
