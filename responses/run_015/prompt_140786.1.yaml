      *Refining the Punchline:*
      "Please resubmit with full enumeration" is good.
      Maybe make it more conversational for a comedy night.
      Two people.
      A: "I fixed the bug."
      B: "Did fixing the bug change the meaning of the word 'bug'?"
      A: "No."
      B: "Did you log that?"
      A: "It's obvious."
