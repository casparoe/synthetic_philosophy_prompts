answer: |-
  This is a profound narrative problem because it is actually a metaphysical one. You are trying to write a novel that treats "personhood" not as a noun (a thing you have) but as a verb (a thing that happens between people). That is Hofstadter's *I Am a Strange Loop* meets Derek Parfit's *Reasons and Persons*, filtered through grief.

  Your current rule ("fraction of dispositions... couldn't account for without adverting to her") fails because it measures **influence**, not **constitution**. A hurricane influences a house's collapse, but the hurricane isn't *in* the rubble. The AI (8) and the Biographer (2) are influenced by her data, but they do not *instantiate* her process.

  Here is a diagnosis of the flaw, a repaired framework that honors your priorities, and answers to your plot and personal questions.

  ### 1. The Flaw in the Current Rule
  Your current rule relies on *explanatory necessity*. But you can explain the Biographer's behavior by adverting to Ilse (he studied her), and you can explain the AI's behavior by adverting to Ilse (she trained it). Yet you feel they are "zero."

  Why? Because they are **simulating** Ilse from the outside, whereas the Husband and Student are **running** Ilse from the inside.

  The difference between (2) Biographer and (1) Husband is not accuracy. It is **calibration**. The Husband's neural pathways were physically wired *by* Ilse's feedback over fifty years. He doesn't think "What would Ilse think?"; he thinks, and the thought arrives pre-shaped by her. The Biographer has to construct the thought consciously. One is a reflex; the other is a calculation.

  ### 2. A Repaired Account: "The Constitutive Loop"
  To keep (1) Yes and (2) No, and resolve the contradictions, I suggest you adopt a framework of **Reciprocal Causal Integration**.

  For a fragment of Ilse to exist in a host, three conditions must be met:
  1.  **Direct Causal Tuning:** The host's brain must have been physically altered by direct, reciprocal interaction with the biological Ilse (rules out Biographer, AI, and arguably the Scan).
  2.  **Operational Autonomy:** The "Ilse-pattern" in the host must fire automatically during decision-making, not on demand (rules out Biographer).
  3.  **Substrate Continuity:** The pattern must reside in biological tissue that grew alongside her (rules out the Scan (6), saves the Hemispheres (4/5)).

  **Applying this to your cases:**
  *   **(1) Husband:** **YES.** Meets all three. High integration.
  *   **(2) Biographer:** **NO.** Fails (1) and (2). He simulates; he doesn't embody.
  *   **(3) Student:** **YES (Less).** Meets (1) and (2), but the "tuning" was hierarchical (teacher/student) rather than constitutive (partners). The loop was thinner.
  *   **(4) Left Hemisphere:** **YES.** Meets (3). It is the physical substrate of her mind.
  *   **(5) Split Hemispheres:** **YES (Both).** This resolves your contradiction. If identity is a *process* distributed across substrate, splitting the substrate splits the process. She is not "one I" anymore; she is a **stereo signal**. Both are heirs, both are her, but the *singular* "Ilse" ceased at the split.
  *   **(6) Scan/Copy:** **NO.** (I recommend surrendering this, as you offered). It fails (1) and (3). It is a map, not the territory. It predicts her, but it isn't her. This aligns it with (2) and (8), which makes your metaphysics consistent: *Biology and Relationship > Data.*
  *   **(7) Brother:** **YES.** Meets (1). You identified the crucial insight: "Death isn't really what's doing the work here." The "Ilse" in him was built while she lived. Death just stops new updates.
  *   **(8) AI:** **NO.** Fails (1). It is causally downstream, but not reciprocally tuned. It has her words, not her weights.

  ### 3. The Plot: The Transplant Procedure
  You asked: *Is that one "I" located in five places, four successors, or one new "I"? Can the percentages add up to more than 100%?*

  Under the **Constitutive Loop** account:
  *   **It is four successors.** The "One I" (the central coordinator) dies with Ilse. What remains are four shards.
  *   **Can it be >100%?** **Yes.** This is your novel's thematic engine.
      *   If "Ilse" is a substance, she is divided (25% each).
      *   If "Ilse" is a *pattern of influence*, she can be replicated.
      *   **The Conflict:** If "Ilse" was contradictory (as all humans are), Shard A might act on her kindness while Shard B acts on her ruthlessness. They will not agree on what "Ilse" would do.
      *   **The Drama:** The plot shouldn't be about them agreeing she is still alive. It should be about them fighting over *which version* of her survives. The Husband (30%) might clash with the Student (10%) because their "Ilse-modules" output different verdicts.
      *   **The Answer:** There is more of her *influence* in the world after she dies, but less of her *agency*. She has become a democracy of ghosts, and they are voting differently.

  ### 4. The Mother: You and the Grief
  You asked: *I want to say that's just me and not her, but I can't see how to hold that while keeping (1).*

  This is the emotional crux. If you say the Husband is 30% Ilse, but you are 0% your Mother, you invalidate your own grief. If you say you are 30% your Mother, you lose your own self.

  Here is the repair, and it is the most important one for you as a writer:
  **Distinction between "Inhabitation" and "Architecture."**

  *   **The Husband (Inhabitation):** Ilse is a distinct sub-routine running in his head. He can hear her voice as distinct from his own ("She would have winced").
  *   **You (Architecture):** Your mother is not a sub-routine; she is part of the **operating system**.
  *   **The Verdict:** When you consult her, it is "just you" in the sense that there is no ghost. But it is "her" in the sense that the *structure* of "You" was built using her bricks.
  *   **How to write this:** You don't have to choose. You can write the protagonist realizing: *"I am not channeling her. I am the house she built. When I speak, the walls speak."*
  *   **Why this keeps (1):** The Husband feels her as a *guest* because they were two adults merging. You feel her as *foundation* because you were a child being built. Both are valid forms of survival.

  ### Summary of Recommendations for the Novel

  1.  **Surrender Case (6).** Make the Scan/Copy a red herring. Let a character try to upload her and fail to capture the "spark" that the Husband has. This validates the biological/relational model over the digital one. It makes the Husband's 30% feel more precious.
  2.  **Define the "Transplant" as Fragmentation.** The procedure doesn't preserve Ilse; it **prisms** her. The four recipients should start diverging. The tension comes from them realizing they are not hosting the same woman.
  3.  **The "More than 100%" Rule.** Explicitly state in the text that grief expands the deceased. *"She was small when she breathed, and vast now that she doesn't."* This justifies the math of your magic system.
  4.  **The Mother.** Write the scene where the protagonist realizes that keeping her mother alive requires *changing*. If the protagonist makes a choice the mother would *hate*, but that the mother's *teaching* enabled, is that her? Yes. That is the highest form of survival: when the student surpasses the teacher, the teacher is most alive.

  **The Rule for your Book Bible:**
  > "Ilse is not a file to be copied. She is a frequency. The closer the resonance of the host's history to her own, the louder she sings. But if two radios tune to the same station, they do not become one radio. They broadcast the same song in different rooms, sometimes out of phase."

  This allows you to have the Husband be right, the Biographer be wrong, and the Transplant recipients be in conflict, without breaking your own heart about your mother.
