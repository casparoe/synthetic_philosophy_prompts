answer: |-
  # Handout: The Logical Space of Sunk Costs

  ## 1. The Logical Space
  Before following the decision tree below, we must define the dimensions along which cases vary. The textbook definition assumes a "stripped-down case" where past expenditure is causally and evidentially inert. Disagreement arises when we relax the constraints of that case.

  We can map the logical space using three binary questions. These generate eight possible combinations ($2^3$).

  1.  **The Evidence Question:** Does the fact that resources were spent provide *information* about the quality of the project or the competence of the planners? (e.g., "They wouldn't have started this unless they knew it was viable.")
  2.  **The Strategy Question:** Does the decision to continue or quit affect how *others* (or your future self) will treat you? (e.g., reputation for resolve, or binding yourself against future weakness.)
  3.  **The Constitution Question:** Is the past effort part of the *value* of the outcome, rather than merely the cost of acquiring it? (e.g., a friendship or artwork where the history is the good.)

  ## 2. The Decision Tree
  *Start from the agreement that in the stripped-down case (No Evidence, No Strategy, No Constitution), past cost should not dictate choice.*

  **Q1: Does the past expenditure give you new reason to believe the project will succeed?**
  *   **YES** $\rightarrow$ Go to **Leaf A**.
  *   **NO** $\rightarrow$ Proceed to Q2.

  **Q2: Will anyone else (including your future self) see this choice and change how they treat you based on it?**
  *   **YES** $\rightarrow$ Go to **Leaf B**.
  *   **NO** $\rightarrow$ Proceed to Q3.

  **Q3: Is the effort already spent part of what makes the final outcome valuable?**
  *   **YES** $\rightarrow$ Go to **Leaf C**.
  *   **NO** $\rightarrow$ Go to **Leaf D**.

  ---

  ## 3. The Leaves (Positions in the Space)

  ### Leaf A: The Bayesian (Informational View)
  *   **Path:** Yes / (Don't Care) / (Don't Care)
  *   **Description:** The agent continues not because the cost is sunk, but because the cost signals quality. The expenditure is treated as data.
  *   **Case:** You continue the telescope project because the fact that £40m was spent without error suggests the engineering is sound, increasing the probability the final £10m value will be realised.
  *   **Label:** *Rational Updating.*

  ### Leaf B: The Strategist (Signalling & Self-Government)
  *   **Path:** No / Yes / (Don't Care)
  *   **Description:** The agent continues to maintain a reputation for resolve or to bind their own future behaviour. The cost is an investment in a *rule* rather than the project.
  *   **Case:** You finish the reactor to show donors you are reliable (Signalling), or you finish the degree to prevent your future self from developing a habit of quitting (Self-Government).
  *   **Label:** *Commitment Device.*

  ### Leaf C: The Integrator (Constitutive View)
  *   **Path:** No / No / Yes
  *   **Description:** The agent continues because the past investment is partly constitutive of the good aimed at. The cost is not "sunk" because it is not distinct from the benefit.
  *   **Case:** The string quartet continues. The twenty-two years of shared history are not a cost to be recovered; they are the very source of the unique sound. To quit is to destroy the asset, not save the budget.
  *   **Label:** *Non-Fungible Value.*

  ### Leaf D: The Purist (Strict View)
  *   **Path:** No / No / No
  *   **Description:** The agent abandons the project. Past expenditure counts for nothing.
  *   **Case:** The anonymous telescope. No one sees the choice; the money tells us nothing about the mirror's quality; the mirror's history adds no artistic value.
  *   **Label:** *Normative Baseline.*

  ### Leaf E: The Empiricist (No Fallacy Shown)
  *   **Path:** (Meta-Position)
  *   **Description:** This view holds that **Leaf D is empty in the real world**. It argues that in every experimental or real-world case where people appear to commit the fallacy, one of Q1, Q2, or Q3 was actually "Yes", but the experimenter failed to control for it.
  *   **Label:** *Ecological Rationality.*

  ### Leaf F: The Deferent (Epistemic Humility)
  *   **Path:** Yes (Internal) / No / No
  *   **Description:** A sub-variant of Leaf A. The agent suspects their current judgement is worse than their past judgement. They continue in deference to the agent who started the project (themselves or another).
  *   **Case:** You inherit the reactor but suspect your predecessor knew more about the site geology than you do. You continue not because of the money, but because the money signals *their* confidence.
  *   **Label:** *Epistemic Deference.*

  ---

  ## 4. Unoccupied Combinations
  There are eight logical cells. The tree above collapses some for pedagogical clarity. Here is the status of the specific combinations:

  1.  **Evidence + Strategy + Constitution (The Holist):** *Occupied.* (e.g., A family business where history is value, success is likely, and reputation matters).
  2.  **Evidence + Strategy (The Pragmatist):** *Occupied.* (Standard business case).
  3.  **Evidence + Constitution (The Connoisseur):** *Occupied.* (Restoring a vintage car where history adds value and suggests durability).
  4.  **Strategy + Constitution (The Performer):** *Occupied.* (An artist continuing a piece to maintain their brand, where the style is constitutive).
  5.  **Evidence Only (The Bayesian):** *Occupied* (Leaf A).
  6.  **Strategy Only (The Strategist):** *Occupied* (Leaf B).
  7.  **Constitution Only (The Integrator):** *Occupied* (Leaf C).
  8.  **None (The Purist):** *Contested.* (Leaf D).

  **Incoherent/Unattractive Cells:**
  *   There are no strictly *incoherent* cells. One can consistently hold any combination of these reasons.
  *   However, the cell **"Strategy without Agency"** is unexplored. If the reactor is *inherited* (no agency on the initial spend), can there be a reputational stake in *completing* it? Yes, but the stake is lower. If a view claimed reputation matters *only* if you spent the money yourself, it would occupy a new branch (Authorship). This tree assumes reputation attaches to the *current* decider regardless of who spent the initial funds.

  ## 5. Weight of Questions
  *   **Most Work:** **The Evidence Question (Q1).** This branch dissolves the majority of alleged fallacies. If the answer is "Yes", the charge of irrationality vanishes immediately. Most economic defences of sunk cost reasoning rest here.
  *   **Most Inert:** **The Constitution Question (Q3).** In standard economic models, this question is almost always "No". It does the least work in traditional rational choice theory, yet it carries the most weight in philosophy and the arts (e.g., the Quartet case). It is the branch where the disciplines diverge most sharply.

  ---

  ## 6. Note on Weaknesses
  *This tree is a heuristic, not a proof. Be prepared for the following pressures:*

  1.  **Collapsing Branch:** The distinction between **Evidence** and **Strategy** is unstable. If I continue to protect my reputation (Strategy), is that not also evidence to others that I am committed (Evidence)? In signalling games, the two merge. A sharp student may argue Q1 and Q2 cannot be separated.
  2.  **Stretched Leaf:** **The Empiricist (Leaf E)** is not a normative position like the others; it is an empirical claim about the other leaves. I have included it as a leaf for completeness, but strictly speaking, it is a claim that Leaf D never obtains.
  3.  **Redraw Trigger:** If neuroeconomic evidence demonstrates that the brain *physically* encodes past cost in the valuation of future reward (e.g., via loss-aversion circuitry that cannot be switched off), the root agreement ("in a stripped-down case... it cannot count") would collapse. We would not be adding branches; we would be drawing a new tree where "sunk cost sensitivity" is a biological constraint, not a reasoning error.

  ***

  ### Instructor's Guide to the Cases
  *   **Standard Telescope:** Tests Leaf D (Purist). If students say "finish it", push them to find which Q is actually "Yes".
  *   **Anonymous Telescope:** Isolates Leaf D. Removes Strategy (Q2).
  *   **String Quartet:** Tests Leaf C (Integrator). The history is the value.
  *   **Inherited Reactor:** Tests the "Authorship" nuance. If they say "quit because it wasn't my money", they are implicitly adding a 4th Question (Agency). If they say "finish because it's a waste", they are likely in Leaf D or F.
  *   **Deference to Past Self:** Tests Leaf F (Deferent). Distinguishes between "I spent it" (Sunk Cost) and "I knew more then" (Evidence).
