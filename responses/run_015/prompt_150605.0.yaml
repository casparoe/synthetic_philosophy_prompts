answer: |-
  We permit only what restores health, never what constructs advantage.

  ### The Decision Procedure

  **Step 1: Diagnosis (Fact)**
  *Question:* Does the file contain a confirmed diagnosis of a pathological condition recognized by standard medical practice, independent of sport performance?
  *   **Sufficient Answer:** A specialist's report citing diagnostic codes, lab values outside reference ranges, or imaging confirming structural damage.
  *   **Stop Condition:** If **No**, deny application. (Flag: This is a value judgment that sport does not subsidize risk mitigation for healthy bodies.)
  *   **Publicity Test:** Pass. We can publish "No diagnosed pathology found."

  **Step 2: Necessity (Fact)**
  *Question:* Is the prohibited substance the standard, necessary treatment for this condition, with no permitted alternative available?
  *   **Sufficient Answer:** Prescription records and a statement that permitted alternatives are ineffective or contraindicated for this specific patient.
  *   **Stop Condition:** If **No**, deny application.
  *   **Publicity Test:** Pass. We can publish "Permitted alternative treatment available."

  **Step 3: Baseline Restoration (Value)**
  *Question:* Will the treatment restore the athlete to species-typical functioning for their age and sex, or will it exceed statistical normality?
  *   **Sufficient Answer:** Lab targets set to the mid-range of the reference population for age/sex, not to the athlete's personal historical peak or the sport's performance demands.
  *   **Stop Condition:** If **Exceeds**, deny application. (Flag: This is a value judgment that health is defined by population statistics, not individual potential.)
  *   **Publicity Test:** Pass. We can publish "Treatment targets population normal ranges."

  **Step 4: Integrity Check (Value)**
  *Question:* Is the medical condition a direct result of a prior violation of anti-doping rules by this athlete?
  *   **Sufficient Answer:** Disciplinary records linking the pathology to prior prohibited substance use.
  *   **Stop Condition:** If **Yes**, the committee must vote. (Flag: This is a value judgment on whether medical need overrides sport integrity; there is no philosophical consensus. If the vote is to deny, state "Condition stems from prior violation." If the vote is to grant, state "Medical need established.")
  *   **Publicity Test:** **Fail.** We cannot publish prior violation history in an anonymized TUE grant. If the decision relies on this, the published reason must be generalized to Step 3 (Baseline) or Step 1 (Diagnosis validity).

  ### Philosophical Distinctions: Keep vs. Abandon

  **Keep: Pathology vs. Non-Pathology.**
  This is the only distinction robust enough for a twenty-minute review. It relies on external medical consensus rather than internal committee speculation. If a condition is not a disease, treating it is enhancement.

  **Abandon: Natural vs. Artificial.**
  Whether a substance is "natural" to the body is irrelevant; insulin is natural but prohibited without diabetes. The source matters less than the medical necessity.

  **Abandon: Internal vs. External.**
  Whether the limitation comes from inside the body (genes) or outside (environment) does not determine therapy. We treat the condition, not the cause, unless the cause violates sport integrity (see Step 4).

  ### The Baseline Problem

  Your diagnosis is correct: disagreements reduce to a choice between the athlete's earlier level, statistical normality, or sport demand.
  *   **Individual Earlier Level:** Unusable. It is often unknown, often previously enhanced, and privileges past performance over current health.
  *   **Sport Demand:** Unusable. This defines enhancement as therapy. If the sport demands super-human function, meeting that demand is not therapy.
  *   **Statistical Normal:** **Selected.** This is the only defensible baseline for "health." It anchors the committee to medical standards rather than sporting advantage.
  *   **Requirement:** All published reasons must state: "Treatment targets statistical normality for age and sex."

  ### Worked Applications

  **Case 1: The Cyclist (Prior Doping, Low T)**
  *   **Step 1 (Diagnosis):** Yes. Hypogonadism is a recognized pathology; levels are below population normal.
  *   **Step 2 (Necessity):** Yes. Testosterone replacement is standard care.
  *   **Step 3 (Baseline):** Restores to population normal. (Passes).
  *   **Step 4 (Integrity):** Yes. Condition caused by prior doping.
  *   **Procedure Outcome:** **Grant (with dissent).** Step 3 is met. Step 4 triggers a vote. If the committee prioritizes medical mandate over moral sanction, you must grant.
  *   **Unwelcome Result:** **Yes.** The committee will find it unwelcome to grant a TUE to an athlete whose condition stems from cheating.
  *   **Why Accept It:** The committee's mandate is medical, not judicial. Once the sanction for the prior doping is served, the athlete's medical status is independent of their moral history. Denying treatment punishes the condition, not the violation, and exceeds the committee's authority. The published reason will cite Step 3 only ("Restores population normal"), hiding the integrity conflict to protect anonymity.

  **Case 2: The Runner (Prophylaxis for Stress Fractures)**
  *   **Step 1 (Diagnosis):** No. She is clinically normal. The "condition" is a predicted risk, not a current pathology.
  *   **Procedure Outcome:** **Deny.**
  *   **Reasoning:** Therapy treats disease, not risk. Using a prohibited substance to withstand training loads is enhancement, regardless of injury prevention.
  *   **Publicity:** "No diagnosed pathology present."

  **Case 3: The Marathoner (Age-Related Decline)**
  *   **Step 1 (Diagnosis):** No. Age-related decline is species-typical functioning, not pathology.
  *   **Step 3 (Baseline):** Treatment would exceed statistical normality for a forty-year-old.
  *   **Procedure Outcome:** **Deny.**
  *   **Reasoning:** Restoring a forty-year-old to thirty-year-old physiology is enhancement, not therapy.
  *   **Publicity:** "Treatment targets exceed statistical normality for age."

  ### Limits of the Procedure

  No procedure of this kind can settle whether the purpose of sport is to showcase natural talent, to reward technological and medical optimization, or to entertain. By choosing "Statistical Normal" as the baseline, we have implicitly chosen a view of sport as a contest of natural human variation, where medicine repairs damage but does not upgrade the machine. This is a philosophical stance, not a medical fact.

  Furthermore, no protocol can avoid taking a position on what counts as a "disease." Aging and risk are natural states, but in elite sport, they are career-ending liabilities. We classify them as non-treatable not because they aren't harmful to the athlete, but because treating them violates the fairness constraint of the competition. You must accept that this procedure will sometimes deny care that a private physician would provide, because our jurisdiction is not health alone, but health within the specific constraints of fair play.
