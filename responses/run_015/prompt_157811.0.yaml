prompt: |-
  so I've been poking around conservation stuff lately and I keep hitting the fact that basically the whole machinery runs on species, and I can't tell whether that's a deep philosophical commitment or just beurocratic inertia. Here's the bundle of things I mean:

  - The lists of things worth protecting are lists of species (plus, in the US at least, subspecies and even mere "distinct population segments" of a species).
  - Biodiversity gets reported as a count of species, and money, recovery plans and staff time get allocated per listed species.
  - To get on the list you generally have to be a *named* species, and to get named you need a published description with a physical type specimen sitting in a museum somewhere (or these days sometimes a sequence from one). A population everyone agrees is genetically weird and ecologically on its own doesn't get anything until somebody does the paperwork.
  - When taxonomists split one species into three, the number of protected things goes up overnight without a single animal changing; when they lump three into one, it goes down.
  - But the same system seems to treat hybrids as a *loss*. As far as I can tell mixed animals often aren't protected, and managers sometimes remove them to keep a listed lineage's genome clean — even though interbreeding is sometimes exactly how the lineage is avoiding extinction.

  Now the bit that got me thinking. A big funder I follow has switched, or is trialling, a rule where the units of conservation aren't named species at all: they cluster genome sequences at a fixed cutoff and fund the resulting clusters, recomputing them every year as more samples come in. So a unit can merge into its neighbour and vanish purely because someone sequenced more animals, and people are furious that the funder is "deleting species" while the actual animals are still there and still rare. Under the old rule that couldn't happen, because the unit was pinned to a name and a type specimen.

  So: what does the species-based practice presuppose about what species are? Does spending money on species-as-units require some kind of realism — species as real lineages, branches on the tree of life, historical individuals with a beginning and an end — or could a thoroughly instrumentalist story (species as convenient bookkeeping, a grid we lay down for our own purposes) license the exact same practice? Does the type-specimen business fit the lineage picture at all, or does it quietly commit you to something more like an exemplar or cluster view, and is that an inconsistency in the practice or just harmless?

  Same question about the two asymmetries: why does fine-grained within-species structure count as something to protect, while admixture between species counts as something to prevent? What has to be true of species for both of those to be sensible at once? Which rival accounts does the practice quietly rule out — an ecological or functional account where a hybrid doing the same job in the same niche is no loss at all, or a view on which only individual organisms and their lives matter? And where is the practice philosophically underdetermined, i.e. where would several quite different theories all sign off on it?

  Last thing: if we actually dropped species as the accounting unit and funded by ecological function, or by assemblages, or by individual animals and their prospects, what would concretely have to change in the practice, and what would we lose — I'm thinking about things like whether anyone could be held to account, or whether the numbers would even be stable enough to budget with. I don't need names of theories or who said what, I just want the implicit story reconstructed, what it strictly needs versus what it merely goes well with, and where it's underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** Conservation practice is obsessed with "species" as the unit of account (lists, funding, legal status, taxonomy dependence, hybrid aversion).
      *   **New Development:** A funder is trying genome clustering (dynamic, nameless units) instead of named species, causing outrage because units "vanish" due to data changes, not biological changes.
      *   **Key Questions:**
          1.  What does species-based practice presuppose about the ontology of species? (Realism vs. Instrumentalism).
          2.  Does the type-specimen requirement fit the lineage picture, or imply something else (exemplar/cluster)? Is this inconsistent?
          3.  How to explain the asymmetry: protecting within-species structure (DPS/subspecies) vs. preventing between-species admixture (hybrids)? What view of species makes *both* sensible?
          4.  What rival accounts are ruled out (ecological/functional, individualist)? Where is the practice underdetermined?
          5.  Concrete consequences of dropping species for other units (function, assemblages, individuals): What changes? What is lost (accountability, stability)?
      *   **Constraint:** No names of theories or philosophers. Just reconstruct the implicit story, needs vs. nice-to-haves, and underdetermination.

  2.  **Analyze Question 1: Ontology (Realism vs. Instrumentalism)**

      *   *Observation:* Conservation acts as if species are stable, countable things.
      *   *Realism:* If species are real historical individuals (lineages), protecting them makes sense as preserving a unique branch of history.
      *   *Instrumentalism:* If species are just convenient boxes, why get so upset when boxes change (like the funder's new rule)? The outrage suggests people *want* realism even if the practice is technically instrumental.
      *   *Practice:* The practice *works* with instrumentalism (we draw lines to spend money), but it *requires* stability to function bureaucratically.
      *   *Type Specimens:* A type specimen anchors a name to a physical object. This is a linguistic/legal anchor, not necessarily a biological one. It fits a "nominalist" or "exemplar" view better than a pure "lineage" view (since a lineage is a process, not a single dead body).
      *   *Conclusion:* The practice doesn't *strictly* need realism, but it needs *stability*. Realism provides the best justification for stability. The type specimen is a bureaucratic anchor, creating a tension with the dynamic nature of lineages.

  3.  **Analyze Question 2: The Asymmetry (Subspecies vs. Hybrids)**

      *   *Observation:* We protect "Distinct Population Segments" (fine grain) but cull hybrids (mixing).
      *   *Tension:* If genetic uniqueness is the goal, hybrids are unique. If evolutionary potential is the goal, hybrids might be vital.
      *   *Resolution:* The practice presupposes species as *historical narratives* or *capacitors of history*.
          *   Within-species structure = preserving the depth of the narrative (local adaptations, distinct chapters).
          *   Between-species mixing = erasing the boundary between two distinct narratives (contamination of the story).
      *   *What makes both sensible?* The view that species are *separate vessels of evolutionary history*. You want to preserve the contents of the vessel (diversity within) but not let the vessels leak into each other (loss of distinctness).
      *   *Ruled Out:* Pure ecological functionalism (a hybrid doing the same job is fine). Pure individualism (why care about the group?).
      *   *Underdetermined:* You could justify this via "genetic purity" (essentialism) OR "independent evolutionary trajectory" (lineage). The practice works for both, though they are philosophically different.

  4.  **Analyze Question 3: The Funder's New Rule (Genomic Clusters)**

      *   *Observation:* Clusters change with data; names don't. People are mad units "vanish."
      *   *Implication:* People value the *identity* of the unit, not just the biological stuff. A named species has a legal/social identity. A cluster is just data.
      *   *Philosophical Commitment:* The outrage reveals a commitment to species as *individuals* (continuing entities) rather than *classes* (defined by properties). If it were just properties, updating the definition would be fine. Because it's an "individual," changing its boundaries feels like killing it.

  5.  **Analyze Question 4: Dropping Species (Concrete Consequences)**

      *   *Alternatives:* Ecological function, Assemblages, Individuals.
      *   *Function:* Hard to measure, hard to budget (what's the price of "pollination"?). Loss of accountability (who is responsible for the function?).
      *   *Assemblages:* Place-based. Good for land management, bad for migratory species. Hard to define boundaries.
      *   *Individuals:* Ethically strong, practically impossible (too many units).
      *   *What is lost?*
          *   *Stability:* Budgets need stable units. Species names are stable (mostly).
          *   *Accountability:* "Save the X" is clear. "Maintain ecosystem Y" is vague.
          *   *Mobilization:* People rally around a tiger, not "biomass."
      *   *What changes?* No more "recovery plans" for specific taxa. Focus shifts to land use or process management.

  6.  **Synthesize and Structure the Response:**

      *   *Introduction:* Acknowledge the tension. The practice is a hybrid of biology, law, and bureaucracy.
      *   *Section 1: The Ontological Status (Realism vs. Stability).* It's not about truth, it's about administrative stability. Realism is the *myth* that supports the bureaucracy. Type specimens are anchors, not biological truths.
      *   *Section 2: The Asymmetry (Purity vs. Diversity).* Explain the "Vessel of History" model. This reconciles protecting DPS while culling hybrids. It rules out pure functionalism.
      *   *Section 3: The Funder's Experiment.* Why the outrage? It breaks the "Individual" illusion. It treats species as classes (definitions) rather than individuals (histories).
      *   *Section 4: Dropping the Unit.* Concrete impacts on budgeting, law, and public engagement.
      *   *Conclusion:* Summarize the implicit story. It's a "Historical Individual" view dressed up in "Essentialist" clothing for legal reasons.

  7.  **Refine the Tone:**

      *   Keep it analytical, not academic.
      *   Avoid naming philosophers (e.g., don't say "Ghiselin" or "Hull" or "Kitcher").
      *   Focus on "what the practice does" rather than "what the theory says."
      *   Ensure the distinction between "what is strictly needed" vs. "what fits well" is clear.

  8.  **Self-Correction/Check during drafting:**

      *   *Check:* Did I answer the type specimen question? *Yes, need to emphasize it's a legal anchor, not a biological one.*
      *   *Check:* Did I address the hybrid asymmetry? *Yes, the "vessel of history" metaphor works well here.*
      *   *Check:* Did I avoid theory names? *Yes, stick to descriptions like "lineage view" or "cluster view".*
      *   *Check:* Is the distinction between realism and instrumentalism clear? *Need to make sure I don't say it *requires* realism, but that it *borrows* realism's stability.*

  9.  **Final Polish:** (Reviewing against the prompt's specific request for "implicit story reconstructed, what it strictly needs versus what it merely goes well with, and where it's underdetermined.") *Make sure these specific headings or themes are explicit in the output.*

      *(Self-Correction)*: I should organize the response to directly address the "implicit story," "strict needs," and "underdetermination" as requested.

      *Plan:*
      1.  The Implicit Story (The "Vessel of History").
      2.  Realism vs. Instrumentalism (The Bureaucratic Need for Stability).
      3.  The Asymmetry (Purity vs. Variation).
      4.  The Funder's Shift (Classes vs. Individuals).
      5.  Dropping the Unit (Concrete Consequences).

