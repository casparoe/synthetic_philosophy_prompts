answer: |-
  Here is a reconstruction of the implicit story driving conservation practice, broken down by what it strictly requires, what it merely prefers, and where it is philosophically underdetermined.

  ### 1. The Implicit Story: Species as "Vessels of History"

  The practice does not actually require a single consistent metaphysical theory, but it operates *as if* species are **historical individuals**.

  In this implicit story, a species is not a category defined by a checklist of traits (like "has feathers" or "sequences cluster at X%"). It is a unique, unrepeatable branch of history—a specific lineage that started at a specific point and is moving through time.

  *   **Why this fits the lists:** You protect individuals because they have rights or welfare; you protect *lineages* because they carry unique historical information. Once a lineage ends, that specific history is gone forever. This justifies spending money on them even if the individual animals are suffering or ecologically redundant.
  *   **Why this fits the type specimen:** The type specimen is not treated as the "perfect example" of the species (an essentialist view). It is treated as a **legal anchor**. Since a historical lineage is a process and not an object, the bureaucracy needs a physical object to pin the name to. The type specimen is the deed to the property, not the property itself. This is a bureaucratic necessity, not a biological claim. It creates a tension (anchoring a process to a static object), but the practice treats this as harmless because the name matters more than the biology for legal standing.

  **Strict Need:** The practice strictly needs **stability of identity**. It does not strictly need the species to be "real" in a mind-independent sense, but it needs the unit to persist through time sufficiently to allow for multi-year funding cycles and legal accountability.
  **Merely Goes Well With:** Biological realism. It helps to believe the lines are "out there" in nature, but the system functions fine on consensus, provided the consensus doesn't change too fast.

  ### 2. The Asymmetry: Protecting Structure vs. Preventing Mixing

  You asked what has to be true for it to make sense to protect fine-grained within-species structure (subspecies/DPS) while simultaneously culling between-species hybrids.

  *   **The Logic:** The practice views species as **separate capacitors of evolutionary potential**.
      *   **Within-species structure:** This represents the *depth* of the vessel. Distinct populations hold unique adaptations or genetic variations that belong to *that* specific historical narrative. Protecting them preserves the richness of that specific lineage.
      *   **Between-species mixing:** This represents the *leaking* of the vessel. If two distinct lineages merge, you haven't created something new; you have erased the boundary that kept the two histories separate. The "loss" is not of biological function (the hybrid might be healthy); the loss is of **distinctness**.

  *   **What this rules out:**
      *   **Pure Functionalism:** If the goal were just "ecosystem services," hybrids would be fine (or good) as long as they do the job. The practice rules this out by prioritizing lineage identity over ecological role.
      *   **Pure Individualism:** If only individual welfare mattered, culling a healthy hybrid to save a "pure" lineage would be unethical. The practice rules this out by prioritizing the collective lineage over the individual organism.

  *   **Where it is Underdetermined:** The practice works equally well for two different justifications:
      1.  **Essentialism:** Hybrids are "impure" or "degenerate." (Older view, rarely stated explicitly now).
      2.  **Lineage Independence:** Hybrids blur the independent evolutionary trajectories. (Modern view).
      The *actions* (culling hybrids) are the same, but the *reasons* differ. The bureaucracy doesn't care which one you believe, as long as you agree on the boundary.

  ### 3. The Funder's Experiment: Classes vs. Individuals

  The outrage over the genomic clustering rule reveals that practitioners are committed to species as **Individuals**, not **Classes**.

  *   **The Class View (The Funder):** A species is a definition (e.g., "sequences clustering at 98%"). If you update the definition, the group changes. This is logically clean but administratively volatile.
  *   **The Individual View (The Practitioners):** A species is a continuing entity (like a person). If you change your measurement of a person's height, the person doesn't vanish.
  *   **The Conflict:** When the funder recomputes clusters and a unit "vanishes," practitioners feel like a patient has been discharged while still sick. Under the Class view, the unit never existed independently of the data cutoff. Under the Individual view, the unit exists regardless of our ability to measure it.
  *   **The Philosophical Cost:** By switching to dynamic clusters, the funder is forcing an **Instrumentalist** view (species are useful boxes we draw) onto a system built on **Realist** intuitions (species are things we find). The outrage is the sound of that collision. The practice cannot function if the unit of account is more volatile than the budget cycle.

  ### 4. Dropping the Species Unit: Concrete Consequences

  If you switched accounting to ecological function, assemblages, or individuals, here is what would break and what would change:

  **A. Accountability and Law**
  *   **Current:** "Save the X." If X goes extinct, the agency failed. Clear success/failure metric.
  *   **Function/Assemblage:** "Maintain pollination rates" or "Keep the forest intact."
  *   **Consequence:** Accountability vanishes. If pollination drops, was it the climate? The land use? The pests? It is much harder to sue an agency for failing to maintain a "process" than for letting a "listed entity" die. The legal teeth of conservation rely on the species being a discrete plaintiff.

  **B. Budgeting and Stability**
  *   **Current:** You can write a 10-year recovery plan for a species. The unit is stable enough to attach money to.
  *   **Function/Assemblage:** Ecological functions fluctuate wildly year-to-year. Assemblages shift as ranges move.
  *   **Consequence:** Budgeting becomes impossible. You cannot allocate staff time to "the pollination function" easily. You allocate staff to "the Bee Recovery Project." Without the named hook, funding streams dissolve into general land management, which is often lower priority.

  **C. Public Mobilization**
  *   **Current:** People rally around the "Spotted Owl." It is a character in a story.
  *   **Individuals:** Too numerous to care about.
  *   **Function:** Too abstract. "Save the Nutrient Cycle" does not raise money.
  *   **Consequence:** Conservation loses its political engine. The species acts as a mascot that translates complex biology into a moral claim.

  **D. What Would Be Gained?**
  *   **Resilience:** You wouldn't get stuck protecting a genetically depauperate lineage that is ecologically dead.
  *   **Hybrid Freedom:** You could allow natural admixture where it aids survival, rather than culling "impure" animals.
  *   **Process Focus:** You would protect the *mechanisms* that generate biodiversity (evolutionary processes) rather than just the current output (the species list).

  ### Summary of the Implicit Commitment

  The conservation machinery is not committed to species being "real" in a strict scientific sense, nor is it committed to them being purely arbitrary human inventions.

  It is committed to species being **stable legal individuals**.

  1.  **Strictly Needed:** The unit must be nameable, countable, and stable over time periods longer than a budget cycle. It must be distinct enough to assign responsibility for its fate.
  2.  **Underdetermined:** Whether that unit is defined by genetics, morphology, or ecology doesn't strictly matter, as long as the definition doesn't change annually. Whether the protection is justified by "intrinsic value" or "ecosystem service" doesn't matter, as long as the law recognizes the unit.
  3.  **The Contradiction:** The system uses **Essentialist tools** (type specimens, fixed names, purity laws) to protect **Evolutionary Individuals** (dynamic, changing lineages). This works most of the time, but breaks down at the edges (hybrids, cryptic species, rapid taxonomic shifts).

  The funder's new rule breaks the "Individual" illusion by treating the units as "Classes" defined by current data. The practice cannot survive that shift without losing its ability to assign blame, budget money, or mobilize public sentiment. It needs the species to be a "who," not a "what."
