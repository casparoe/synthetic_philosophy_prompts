  3.  **Brainstorm Potential "Machinery" (Conceptual Objections):**
      *   *Problem 1: Infinite Expected Utility.* If $P(\text{infinite}) > 0$ and $Value(\text{infinite}) = \infty$, then $EV = \infty$. Any finite cost is negligible. This leads to absurdity (Pascal's Mugging).
      *   *Problem 2: Probability Discounting.* Maybe the probability isn't just "nonzero," it's *infinitesimal* or undefined. But standard real numbers don't handle infinitesimals well in EUT.
      *   *Problem 3: Axiomatic Failures.* Standard EUT axioms (like Continuity or Dominance) break down with infinities.
      *   *Problem 4: Person-Affecting Views.* If future people don't exist yet, do we have obligations to them? (Non-Identity Problem).
      *   *Problem 5: Epistemic Humility/Model Uncertainty.* We can't reliably model the causal chain to the infinite future.
      *   *Problem 6: Infinite Ethics Paradoxes.* The "Very Repugnant Conclusion" or issues with comparing infinite populations (Cantorian problems).

