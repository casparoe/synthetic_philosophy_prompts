answer: |-
  This is a classic instantiation of **Pascal's Mugging** applied to population ethics and longtermism. Your colleague's argument relies on a naive application of **Expected Utility Theory (EUT)** combined with the **Total View** of population ethics.

  To dismantle this in a seminar setting without appealing to sentiment, you need to attack the decision-theoretic machinery and the axiological assumptions. Here are the four specific conceptual moves to block the inference.

  ### 1. The Breakdown of Expected Utility with Unbounded Values
  The colleague's argument assumes that $E[U] = P(\text{outcome}) \times U(\text{outcome})$ holds even when $U(\text{outcome}) = \infty$.
  *   **The Problem:** In standard real analysis, any nonzero probability multiplied by infinity yields infinity. This implies that *any* action with a nonzero chance of affecting an infinite future dominates any finite good. This leads to **decision instability**. If you accept this, you must also accept that you should sacrifice the current students for *any* project with a nonzero chance of infinite impact, no matter how absurd the causal chain (e.g., praying for the universe to last forever).
  *   **The Fix (Bounded Utility):** To make decision theory coherent, you must posit a **bounded utility function**. If utility is bounded (there is a maximum possible value any outcome can have), then infinite populations do not yield infinite utility. Once you cap the utility, the finite, certain good of mental health support can mathematically outweigh the low-probability, high-impact future policy research. This isn't sentiment; it's a requirement for avoiding St. Petersburg-style paradoxes in decision theory.

  ### 2. The Epistemic "Cluelessness" Objection (Valence Uncertainty)
  Even if we grant the possibility of an infinite future, the colleague assumes the *valence* (positive/negative) of the impact is knowable or positive.
  *   **The Problem:** In complex systems (like policy architecture), the long-term causal effects are chaotic. For any intervention $X$ that has a nonzero chance of creating infinite positive value, there is arguably a symmetric nonzero chance of creating infinite *negative* value (e.g., locking in a tyrannical stable equilibrium).
  *   **The Math:** If $P(+\infty) \approx \epsilon$ and $P(-\infty) \approx \epsilon$, the Expected Utility becomes $\infty - \infty$, which is **undefined**.
  *   **The Move:** You cannot claim dominance unless you can demonstrate that the probability of infinite good strictly exceeds the probability of infinite harm. Given **epistemic humility** regarding deep time, we cannot assign these probabilities. Therefore, the EV of the chair is undefined, not infinite, and cannot dominate the certain finite good.

  ### 3. Population Ethics: Total View vs. Person-Affecting
  Your colleague is implicitly using the **Total View** (the value of an outcome is the sum of the welfare of all beings who ever live). This is what allows "more people" to equal "more value."
  *   **The Problem:** The Total View leads to the **Repugnant Conclusion** and implies obligations to merely possible people that outweigh obligations to actual people.
  *   **The Move:** Switch the axiological framework.
      *   **Person-Affecting View:** An outcome can only be better if it is better *for someone*. Non-existent future people cannot be harmed or benefited by our choice not to bring them into existence (the **Non-Identity Problem**). On this view, the chair only matters insofar as it affects *actual* people. The mental health support affects actual, existing students. The chair loses its "infinite" leverage because potential people have no moral claim to be brought into existence.
      *   **Average Utilitarianism:** If value is determined by *average* welfare rather than *total* welfare, adding an infinite number of lives with barely-positive welfare does not increase the value of the outcome. This blocks the "scaling without bound" argument.

  ### 4. Probability Discounting and Lexicographic Preferences
  The colleague treats "nonzero probability" as a binary switch (0 vs. >0). In rigorous decision theory, probabilities must be **decision-relevant**.
  *   **The Problem:** If we treat infinitesimal probabilities as significant, we become vulnerable to **fanaticism**.
  *   **The Move:** Argue for **Probability Discounting** or **Lexicographic Preferences**.
      *   **Discounting:** Probabilities below a certain threshold (determined by our epistemic confidence in the model) are treated as zero for decision-making purposes. If our model of "infinite future policy impact" is speculative metaphysics rather than empirical science, the probability is epistemically discounted to null.
      *   **Lexicographic Ordering:** We can posit a rule where **rights-based constraints** or **urgent needs of existing agents** lexicographically precede **aggregate good of possible agents**. This isn't just sentiment; it's a deontological constraint on maximization. You cannot violate the claims of existing persons (who have a right to care) to maximize the potential welfare of non-persons.

  ### Summary for the Seminar
  To formalize the objection, tell your colleague their argument fails on three technical grounds:
  1.  **Decision Theory:** It requires an unbounded utility function, which renders EUT incoherent (Pascal's Mugging).
  2.  **Epistemology:** It assumes we can know the *sign* of infinite causal chains, leading to undefined EV ($\infty - \infty$).
  3.  **Axiology:** It relies on the Total View of population ethics, which is contested by Person-Affecting and Average views that do not grant moral weight to merely possible people.

  The "right move" is to reject the **Total View + Unbounded Utility** conjunction. Once you bound utility or reject the moral status of non-existent people, the infinite dominance argument collapses.
