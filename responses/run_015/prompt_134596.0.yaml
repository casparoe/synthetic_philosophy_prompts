      *   *(4) vs. (6):* (4) says FoL is invariant and radical divergence ends rational agreement/understanding. (6) says we can recognize alien language *even if* FoL is unrecognizable. *Potential Conflict:* If FoL is the bedrock of agreement, how can we recognize language without shared FoL? (6) seems to weaken the "invariance" or "bedrock" claim of (4).
      *   *(3) vs. (5):* (3) says meaning is use. (5) says institutional concepts are defined by stipulative rules. *Potential Conflict:* Does "stipulative rule" override "use"? Wittgenstein usually argues rules don't determine use (PI §198). If (5) claims rules *define* the concept independent of use, it clashes with (3). If (5) claims the *use* is to follow stipulative rules, they might align.
