      So (3) actually *supports* (5) if (5) is understood as "these concepts are governed by grammatical propositions that look like definitions."
      *Tension:* Only arises if (5) implies the rules are *external* to the use. I should classify this as an "Apparent Conflict" that dissolves, provided (5) is read charitably.
      *Decision:* I will classify (3)/(5) as a "Dissolved Conflict" but warn about the interpretation. I will classify (1)/(5) as a "Real Tension" because of the explicit mention of "number" in (1). I will classify (4)/(6) as the "Severe Tension."

