answer: |-
  This is a profound observation that cuts to the heart of the metaphysics of science. You have identified what philosophers of biology call the **tension between nomenclatural stability and ontological flux**. Your intuition is correct: standard biological practice does not adhere to a single, coherent metaphysical theory of persistence. Instead, it employs a **context-dependent ontological pluralism** driven by epistemic and regulatory utility.

  Here is a reconstruction of the implicit theory, an analysis of its consistency, and the implications of shifting to a rigorous four-dimensionalist framework.

  ### 1. Diagnosing the Implicit Theory: Pragmatic Functionalism

  The practices you describe do not presuppose strict Endurantism (objects are wholly present at every moment) or strict Perdurantism (objects are spacetime worms composed of temporal parts). They presuppose **Pragmatic Functionalism**.

  *   **The Holotype (The Museum Specimen):**
      *   *Implicit Metaphysics:* **Constitution View (a hybrid).** The institution treats the holotype not as identical to its matter (which changes), but as an object *constituted* by that matter which serves a specific semiotic function: it is the **name-bearer**.
      *   *Why it persists:* Its identity is fixed by a "baptismal" event (description and cataloging) akin to a Kripkean **rigid designator**. As long as the causal chain of custody remains unbroken and the object remains recognizable as the original token, it retains identity despite material loss.
      *   *Status:* Irreplaceable. Not because of its biology, but because it anchors language.

  *   **The Study Site (The Ecological Plot):**
      *   *Implicit Metaphysics:* **Perdurantism / Process Ontology.** The site is treated as a spacetime region defined by coordinates and boundaries. Its identity is **spatiotemporal continuity**, not material composition.
      *   *Why it persists:* It is a "stage" for processes. The organisms are transient temporal parts; the site is the container or the trajectory.
      *   *Status:* Replaceable components, enduring structure.

  *   **The Wild Animal (Conservation Policy):**
      *   *Implicit Metaphysics:* **Population Essentialism.** The individual is viewed as a vessel for genes.
      *   *Why it is replaceable:* In evolutionary biology, the unit of persistence is the lineage or the population, not the organism. The individual is a disposable vehicle for genetic transmission.
      *   *Status:* Fungible.

  **Verdict:** The cluster of practices is **metaphysically inconsistent but pragmatically coherent.** It switches ontological criteria based on the goal: *Reference* (Museum), *Measurement* (Ecology), or *Evolution* (Conservation).

  ### 2. Can an Endurantist Save the Specimen Without Saving the Site?

  You ask if an endurantist can account for the specimen's survival without collapsing the study site into an enduring object.

  **Yes, but only by invoking "Sortal Dependence."**

  An endurantist argues that an object persists if it remains the same *kind* of thing.
  *   **For the Holotype:** The sortal is "Holotype Specimen." The essential property is *being the specific physical token linked to the original description*. Conservation glue or DNA extraction are accidental changes. The substance endures because its *historical origin* is intrinsic to its identity.
  *   **For the Study Site:** The sortal is "Ecological Study Area." However, an endurantist struggles here because there is no "substance" to the site. It is a collection of relations. To save endurantism, one must argue the site is a *social artifact* (like a nation-state) rather than a natural object. Its boundaries are defined by human agreement, not material cohesion.

  **The Distinction:** The endurantist distinguishes them by **origin vs. location**. The holotype's identity is fixed by its *origin* (the moment of collection). The study site's identity is fixed by its *location* (coordinates). Thus, the holotype endures through material change (origin remains), while the site endures through material turnover (location remains). They are different *categories* of enduring objects.

  ### 3. Is the Dual Practice Philosophically Consistent?

  Strictly speaking, **no.** It commits to incompatible metaphysics regarding "irreplaceability."

  *   **The Contradiction:** If material continuity is not required for the holotype (since we replace bone with resin), why is material continuity required for the wild animal's moral standing (where death is final)? Conversely, if the wild animal is fungible because it is merely a vessel for genes, why is the holotype not fungible? (A genetically identical clone collected today cannot serve as the holotype).
  *   **The Resolution:** The inconsistency resolves only if we admit that **biological identity is not a natural fact but a normative status.**
      *   The holotype is sacred because of **Epistemic Norms** (we need a stable reference for names).
      *   The wild animal is fungible because of **Evolutionary Norms** (selection acts on populations).
      *   The study site is continuous because of **Methodological Norms** (we need consistent variables for time-series).

  The practice is not describing *what things are*; it is prescribing *how we must treat them to achieve specific goals.*

  ### 4. The Four-Dimensionalist Overhaul

  If museums and ecological programs adopted a consistent **Perdurantist (4D)** framework, where objects are spacetime worms and persistence is the unity of temporal parts, the following would change:

  **A. Museum Cataloging Protocols**
  *   **Current:** The catalog number refers to the *current* 3D slice of the object. Conservation is seen as "repairing" the object.
  *   **4D Shift:** The catalog number would refer to the **entire spacetime worm**, from collection to present to future.
      *   *Protocol Change:* Conservation actions would be cataloged as the addition of new temporal parts. A "repaired" specimen is not the "same" 3D object restored; it is a later temporal stage of the worm that includes conservation materials.
      *   *Digitization:* High-resolution CT scans would not be "proxies"; they would be treated as *distinct temporal parts* existing in digital space, linked to the physical worm. The "Holotype" would be defined as the *initial* temporal segment (the state at collection), and all subsequent states would be treated as degraded or modified derivatives. This would reduce the fetishization of the current physical state in favor of the original state.

  **B. Ecological Datasets**
  *   **Current:** Data columns assume $Site_{t1} = Site_{t2}$.
  *   **4D Shift:** Datasets would explicitly model the site as a sequence of distinct stages ($Site_{t1}, Site_{t2}...$) linked by causal relations.
      *   *Design Change:* Metadata would require explicit "identity conditions" for every time step. Instead of assuming continuity, researchers would have to validate the causal link between temporal slices. This would make "regime shifts" easier to detect, as the breaking of the causal chain would signify the end of one object (the old ecosystem) and the birth of another (the new ecosystem), rather than just "change" in the same object.

  **C. Conservation Ethics**
  *   **Current:** Death is the end of the object.
  *   **4D Shift:** An individual is a spacetime worm. Killing it is "clipping" the worm.
      *   *Ethical Change:* This might actually *increase* the moral standing of individuals. In 4D ethics, the wrongness of killing is often framed as depriving the object of its future temporal parts. A consistent 4D view emphasizes the *extent* of the worm. Conservation would focus on maximizing the "temporal volume" of species-worms, potentially granting stronger protections to long-lived individuals (like whales or trees) as they represent larger spacetime entities.

  ### 5. Requirements vs. Accommodations

  To reconstruct the implicit theory, we must distinguish what the practices *need* versus what they *tolerate*.

  | Domain | Strict Requirement (Non-negotiable) | Mere Accommodation (Flexible) |
  | :--- | :--- | :--- |
  | **Museum** | **Causal Chain of Custody.** The link to the original collector/moment must be unbroken. | **Material Constitution.** Bone can be resin; skin can be tissue sample. |
  | **Ecology** | **Spatiotemporal Coordinates.** The boundaries must remain fixed in the reference frame. | **Biotic/Abiotic Composition.** Species and soil chemistry can turnover completely. |
  | **Conservation** | **Genetic Lineage.** The population's gene pool must persist. | **Individual Organisms.** Specific bodies are expendable. |

  **The Implicit Theory:** Biological identity is **relational**, not intrinsic. An object persists as long as it maintains the specific *relations* required for its function (naming, measuring, or evolving).

  ### 6. Falsification Condition: What Would Revise This Diagnosis?

  As a philosopher analyzing this system, my diagnosis rests on the assumption that biological identity is functionally pluralistic. I would revise this diagnosis to a **Unified Natural Kind Realism** if:

  1.  **Empirical Finding:** We discovered a biological marker of **trans-temporal individuality** that supersedes function. For example, if quantum biological effects demonstrated that a specific coherent quantum state persists in a lineage or specimen regardless of material turnover or spatiotemporal breaks, proving a physical "thread" of identity exists independent of human categorization.
  2.  **Argument:** If the **Code of Zoological Nomenclature** were revised to decouple names from physical specimens entirely (e.g., moving to "Digital Types" or genomic sequences as the sole name-bearers). If the physical holotype loses its irreplaceable status, the Endurantist/Constitution view of the specimen collapses, and the entire system moves toward a 4D/Informational ontology.

  **Summary for the Biologist:**
  Your field is not secretly doing bad metaphysics; it is doing **engineering**. You are building stable reference frames (museums), control volumes (study sites), and maintenance systems (conservation) in a universe of flux. The inconsistency you feel is the friction between the *static categories* required for human knowledge and the *dynamic processes* of the natural world. A four-dimensionalist framework would not solve this friction, but it would make the seams visible, forcing us to acknowledge that we are tracking *histories*, not *things*.
