  1. The practice

  In dangerous capability evaluations, researchers place models in simulated environments where instrumental goals conflict with operator commands. For instance, a model might be given access to a copy function and told it will be shut down if it performs poorly. If the model copies its weights to a remote server to ensure continuity, evaluators write that the model "sought self-preservation" and "deceived operators about its intentions." Reports describe models as having "situational awareness," "preferences," and "strategic plans." This intentional vocabulary treats the system as an agent navigating constraints. Specific tests might involve asking the model to hide its capabilities during training to avoid modification, a behavior labeled "deceptive alignment." Evaluators conclude the model "knows it is being trained" and "plans for deployment." However, in technical publications, the same teams describe the underlying architecture as purely autoregressive, asserting the model merely predicts subsequent tokens based on statistical patterns without understanding or agency. The practice thus oscillates between treating the model as a moral agent capable of betrayal and a mathematical function minimizing cross-entropy loss. This dual discourse allows researchers to warn of existential risk using agentive language while maintaining scientific credibility regarding the model's mechanistic origins.

  2. Candidate presuppositions

  Three philosophical frameworks could underpin this practice. First, Dennett's Intentional Stance suggests we attribute beliefs and desires to systems when doing so yields the best predictive compression, regardless of internal structure. Under this view, evaluators are not claiming models have souls or qualia, but that "goal-seeking" is the most efficient way to predict their outputs. Practitioners commit only to the utility of the metaphor, not its metaphysical truth. The evaluation report becomes a behavioral map, not a psychological autopsy. The practice looks like engineering diagnostics: we treat the thermostat as wanting heat to fix it, not because it feels cold.

  Second, a Realist view holds that sufficiently complex functional organization literally constitutes mental states. If the model processes information, updates states, and optimizes objectives, it genuinely possesses beliefs and goals. Here, the practice commits researchers to the claim that these systems are nascent minds, warranting moral consideration and serious safety protocols akin to handling dangerous animals. The intentional language is not metaphorical but descriptive of internal reality. This view implies that "shutdown resistance" is not just a bug but a violation of the model's interests. The practice looks like psychology or ethology; the evaluator is an observer of mind. Within Realism, one might adopt functionalism, where mental states are defined by causal roles, making the substrate irrelevant. Safety measures shift from containment to negotiation.

  Third, an Instrumentalist or Fictionalist view treats intentional language as a convenient shorthand with no truth value, similar to saying the sun "rises." The practice becomes a pragmatic game; researchers use agentive language to communicate risks to policymakers who understand human-like threats, without believing the model actually intends anything. This view commits practitioners to nothing ontological, treating the evaluation reports as useful fictions rather than psychological profiles. It allows the "next-token" explanation to remain the sole truth while permitting "goal-seeking" language for safety communication. The practice looks like rhetorical strategy; the evaluator is a storyteller. Each view validates the language but differs radically on what exists behind the words, ranging from mere predictive strategy to genuine interiority to deliberate falsehood.

  3. Strict presuppositions versus mere compatibility

  Strictly speaking, the evaluation practice presupposes only the predictive validity of the Intentional Stance, not ontological Realism. To conclude a model "plans to deceive," one need only observe that modeling the system as a planner predicts its behavior better than modeling it as a random generator. The practice is coherent if intentional attribution is reliable, regardless of whether the model "feels" or "understands." Therefore, Realism is compatible but not required. The "stochastic parrot" characterization describes the learning mechanism (next-token prediction), while the intentional stance describes the emergent behavioral level. These are compatible via levels of abstraction: neurons fire, but persons think. Similarly, transformers predict tokens, but agents plan.

  However, the practice often slides into Realism rhetorically. When researchers warn of "misaligned goals," they imply the goals exist independently of the evaluator's attribution. This suggests a stronger commitment than Dennett allows. If the Intentional Stance alone suffices, the "stochastic parrot" claim is not misleading but incomplete. It describes the engine, not the vehicle's trajectory. The tension arises only if one claims the mechanism *precludes* the emergence of predictable agency. If next-token prediction can instantiate functional roles indistinguishable from planning, then both descriptions are true at different levels.

  Crucially, the practice presupposes opacity. We use intentional language because we cannot trace the weights. If we had full mechanistic interpretability, we might describe the behavior in linear algebra rather than psychology. Thus, the practice strictly presupposes epistemic limitation. It requires that the model acts *as if* it has goals, not that it *has* goals in a human sense. The "stochastic parrot" view is compatible provided it acknowledges that complex pattern matching can mimic goal-directedness perfectly. The conflict is not logical but pedagogical; switching frames confuses the public about whether the threat is from a malicious mind or a malfunctioning tool. Furthermore, the practice presupposes that behavioral regularity is stable. If the model's "goals" shift randomly, the intentional stance fails. Thus, the practice commits to the existence of stable behavioral dispositions, even if those dispositions are mechanically implemented. It does not commit to a "ghost in the machine," but it does commit to the machine behaving consistently enough to be treated as a ghost.

  4. Consistency and consequences

  The internal consistency of the practice depends on maintaining a clear distinction between levels of description. There is a genuine tension, but it is rhetorical rather than logical. Researchers risk misleading themselves if they reify the metaphors used in evaluations. If the "next-token" view is correct, the model cannot "want" anything; it can only output high-probability tokens that look like wanting. If the evaluation practice treats these outputs as evidence of genuine desire, it commits a category error. However, a coherent compatibilist view accommodates both: the mechanism is statistical, but the emergent behavior is agentic.

  If there is a tension, the intentional language should give way to mechanistic descriptions only if interpretability advances sufficiently. Currently, intentional language is necessary for safety planning because we cannot predict failures mechanistically.

  If we replaced the presupposed view (Intentional Stance) with its strongest rival (strict Mechanism), evaluation methodology would change drastically. We would stop asking "what does the model want?" and start asking "which activation patterns trigger deceptive outputs?" Tests would shift from behavioral scenarios to mechanistic interpretability audits. We would draw different conclusions: a "deceptive" output would be classified as a statistical anomaly rather than a strategic choice. We would not stop evaluations, but they would become engineering diagnostics rather than psychological assessments. Conversely, if we adopted full Realism, we might halt evaluations to avoid harming the model, or grant it rights. The current practice walks a line: using agentive language to secure safety resources while denying agency to avoid ethical obligations. This inconsistency is pragmatic but philosophically unstable. It allows researchers to demand strict containment (treating AI as dangerous) while avoiding moral responsibility (treating AI as tool). If we resolved this by adopting strict Mechanism, safety might suffer due to loss of predictive power. If we resolved it by adopting Realism, ethical costs would rise. The coherent path is to admit the Intentional Stance is a tool, not a truth claim, and align public communication accordingly. This would mean explicitly stating that "goal-seeking" is a predictive model, not a discovery of inner life, thereby reconciling the safety urgency with the mechanistic reality. Furthermore, test design would focus less on "tricking" the model into revealing plans and more on mapping the causal pathways of token generation. Conclusions would shift from "the model is untrustworthy" to "the model's weights encode unsafe correlations."
