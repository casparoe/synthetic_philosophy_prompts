  8.  **Final Polish:** Ensure the distinction between Leibniz's Law (Indiscernibility of Identicals) and PII (Identity of Indiscernibles) is clear, though the prompt uses them somewhat interchangeably (common in intro courses). I should gently clarify that Black targets PII. (Wait, the prompt says "Leibniz's law and Black's spheres." Usually, Leibniz's Law = Indiscernibility of Identicals (II). PII = Identity of Indiscernibles. Black attacks PII. I need to make sure I don't confuse the student. I will treat "Leibniz's Law" in the prompt as referring to the PII principle, as that's what Black targets, but I'll add a small note clarifying the terminology.) *Correction:* Actually, in intro courses, "Leibniz's Law" is often used loosely to cover both directions. I will focus on PII since that's what Black's spheres address.

      *   *Wait, one more check:* Leo's Move 1 (Relational properties). If space is absolute, they have different locations. If space is relational (Leibnizian), they don't. Black assumes a relational view of space to make the symmetry work. Leo's move assumes absolute space implicitly (A is *here*, B is *there*). Mara's circularity point holds if we can't indexically pick them out.
      *   *Leo's Move 3 (Structuralism):* This is actually a very advanced move. Ontic Structural Realism. It's "Right" that it's a valid defense, but it changes the metaphysical framework significantly.

