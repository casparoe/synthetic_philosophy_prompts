      *   **Context:** Intro metaphysics course, Leibniz's Law (Identity of Indiscernibles - PII), Black's Spheres.
      *   **Participants:** Mara (argues PII is false via Black), Leo (argues PII is true/survives via relations/structuralism).
      *   **Task:** Adjudicate the debate move-by-move. Rate each move (Clearly Wrong to Clearly Right). Explain what's right/wrong/missing for each. Address Black's original intent.
