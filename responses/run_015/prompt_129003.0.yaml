prompt: |-
  hey — I'm the undergrad rep on our university's Animal Care & Research Ethics Committee (they let one of us on, mostly to take minutes), and we've got a case nobody knows what to do with, and of course it landed the same week as my midterm for PHIL 240 (minds & machines, we're on moral status right now). I have to circulate a draft written opinion before Tuesday's meeting and I genuinely don't know what to recommend, so: be the person who drafts it.

  The case: the Vollmer lab submitted what they call an "amendment for determination of scope." They aren't asking us to approve anything; they want us to rule whether their project is our jurisdiction at all. They run a digital emulation of a nematode nervous system — 302 neurons, full connectome, simulated body, simulated chemical gradient. Open-source worm sims have been around for years; this is their own tuned version. They use it to study learning: the thing habituates, it does aversive conditioning, they can lesion individual neurons. What they want to do next is where it gets messy:

  (1) run it at roughly 400x real time, in 500 parallel copies, for statistics;
  (2) run a "valence-off" variant where they knock out the neuromodulatory system that does approach/avoidance in the real animal, on the grounds that without it there's nothing the emulation is doing that could matter to it;
  (3) run a "table mode" variant: instead of integrating the dynamics at runtime they precompute the whole input–output function into a lookup table, so at runtime it's just a giant memory read. Their argument is: if what matters morally is the computation in the abstract, table mode is the same computation and has to be treated identically; if we want to treat it differently, we owe them an account of what we think we're protecting, and "causal oomph" isn't an answer until we say why the oomph matters.

  Our policy covers "non-human animals," defined by reference to vertebrates and cephalopods — so strictly speaking none of this is covered. But there's a clause about novel preparations, and the chair wants a real answer rather than a definitional dodge, because the PIs have said (very politely) that if we rule it out on the taxonomic definition they'll just do it anyway, and we'll have taught everyone that our jurisdiction is a technicality.

  Two more things from the last meeting that I think are actually the crux:

  - Prof. Adeyemi raised the incentive problem: the better their emulation is — the more it learns, the more wormlike it behaves — the more likely we are to say it's covered. So our ruling hands them a reason to keep the model bad, or at least to not probe it very hard. Half the room says that's a publication-integrity problem and not ours. The other half says a rule that rewards making your model worse is a bad rule.
  - The counting problem. If it is covered, what's the unit? One subject per emulation? Per copy? Per hour of simulated time (in which case 400x speed is 400x the animal-hours and their protocol is enormous)? Someone said per-copy, but also that running the identical emulation twice might be the same subject twice over rather than two subjects, and I can't tell if that makes it better or worse. Related: two members disagreed about whether we should go by how it behaves or by what's going on structurally inside it, and I don't think they noticed how much rides on which one we pick.

  What I need: a short written opinion I can circulate. Recommend one of — (a) decline jurisdiction, with a short explanation that isn't just the definition; (b) assert jurisdiction and require a full protocol with named conditions; (c) assert jurisdiction over some variants and not others, saying which — and give a timeline (what has to happen by when, and what happens if it doesn't). It has to give the Vollmer lab something they can actually respond to rather than "it depends on your metaphysics." And it should take the strongest argument against your own recommendation seriously: I'd guess for (b) that's the "you're regulating a spreadsheet" line, and for (a) it's the incentive thing, but say whichever it actually is.

  Last thing: I'm supposed to flag where I think the committee is posing the question badly. If "is it sentient" is the wrong frame — if it should be something like how much moral risk there is and who carries the burden of proof under uncertainty — say so and reframe it. But definitely don't just reframe it, I still need a bottom line by Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested draft opinion:

  1.  **Analyze the Request:**
      *   **Role:** Undergrad rep on Animal Care & Research Ethics Committee (ACREC).
      *   **Task:** Draft a written opinion for circulation before Tuesday's meeting regarding the Vollmer Lab's "amendment for determination of scope."
      *   **Context:** The lab simulates *C. elegans* (302 neurons). They want to run parallel copies, knock out valence, and use lookup tables.
      *   **Constraints/Policy:** Policy covers vertebrates/cephalopods (strictly excludes nematodes). However, there's a "novel preparations" clause. Chair wants a substantive answer, not a definitional dodge. PIs threatened to ignore a technicality ruling.
      *   **Key Issues:** Incentive problem (rewarding bad models), Counting problem (units of moral concern), Behavior vs. Structure.
      *   **Deliverable:** A short written opinion recommending (a), (b), or (c), with a timeline, addressing the strongest counter-argument, and flagging where the committee is asking the wrong question (reframing).
      *   **Tone:** Professional, philosophical but actionable, respectful of the committee's authority but clear-minded (PHIL 240 student perspective).

  2.  **Deconstruct the Ethical/Philosophical Problems:**
      *   *Jurisdiction:* Strictly, nematodes aren't covered. But digital emulations are "novel." If we say "no jurisdiction," we lose leverage and encourage "ethics dumping" (making models dumber to avoid scrutiny).
      *   *Moral Status:* Is it sentient? We don't know. Functionalism vs. Substrate Dependence. The "Table Mode" argument is a classic philosophical zombie/computation argument.
      *   *Incentive Problem:* If high fidelity = regulation, labs will lower fidelity. This is bad for science and potentially bad for ethics (hiding potential suffering).
      *   *Counting Problem:* Is a copy a new subject? Is speed a factor?
      *   *Reframing:* "Is it sentient?" is epistemically inaccessible. Better frame: "Precautionary Principle" + "Moral Risk." Who bears the burden of proof?

  3.  **Evaluate the Options:**
      *   *(a) Decline Jurisdiction:* Easiest legally. Fails the Chair's test (PIs will ignore it). Ignores the moral risk. Encourages the "incentive problem" (keep models dumb).
      *   *(b) Assert Full Jurisdiction:* Hardest. Treats sims exactly like worms. Might be overreach (regulating math). Stifles research. Hard to enforce "pain" in code.
      *   *(c) Assert Jurisdiction over Some Variants:* Nuanced. Distinguishes between dynamic processing and lookup tables. Distinguishes between valence-on and valence-off. This aligns best with the "Moral Risk" framing. It acknowledges uncertainty without halting science.

      *Decision:* Option (c) is the most robust. It allows research to proceed but imposes safeguards where the risk is highest. It addresses the "Table Mode" challenge directly.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (Scope Determination for Vollmer Lab).
      *   **Reframing (The "PHIL 240" insight):** Address the "Is it sentient?" trap. Shift to "Moral Risk & Precaution." We don't need to know *if* it suffers, we need to manage the *risk* that it does.
      *   **Recommendation:** Option (c). Assert jurisdiction over specific variants.
          *   *Variant 1 (Parallel/Dynamic):* Covered. High fidelity, dynamic processing.
          *   *Variant 2 (Valence-Off):* Exempt (with monitoring). If the mechanism for suffering is removed, risk drops.
          *   *Variant 3 (Table Mode):* Exempt. No real-time computation, no causal dynamics.
      *   **Addressing the Counting Problem:** Define the "Subject." One unique seed/initial state = one subject. Copies for statistics are technical replicates, not new subjects *unless* they diverge significantly. Speed doesn't multiply moral weight (suffering isn't time-scaled in sim), but duration does.
      *   **Addressing the Incentive Problem:** Acknowledge it. The ruling shouldn't punish fidelity. By focusing on *mechanisms of valence* rather than *behavioral fidelity*, we avoid rewarding "dumb" models.
      *   **Strongest Counter-Argument:** The "Regulating a Spreadsheet" objection (against asserting jurisdiction). Address this by distinguishing dynamic causal processes from static lookup.
      *   **Timeline/Next Steps:** Lab submits modified protocol by [Date]. Committee reviews by [Date]. Moratorium on Variant 1 until approval.
      *   **Closing:** Professional sign-off.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is distinguishing Table Mode defensible?
      *   *Defense:* Yes, functionally. Table mode has no internal state dynamics during runtime. It's a map, not a territory. If moral status depends on *process* (which the lab's own argument hints at), table mode lacks the process.
      *   *Critique:* Is the Counting Problem solved?
      *   *Defense:* It's never fully solved, but defining "Unique Initial State" is a workable administrative boundary.
      *   *Tone Check:* Ensure I don't sound like an arrogant undergrad. Use "Recommendation" and "Reasoning" rather than "I think." Acknowledge the committee's expertise.
      *   *Policy Check:* Acknowledge the vertebrate/cephalopod limit but lean heavily on the "Novel Preparations" clause to justify the overreach.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Short written opinion? Yes.
      *   Recommend (a), (b), or (c)? Yes (c).
      *   Timeline included? Yes.
      *   Strongest counter-argument addressed? Yes (the "spreadsheet/abstract computation" objection).
      *   Reframe the question? Yes (Sentience -> Moral Risk).
      *   Actionable for the lab? Yes.

  7.  **Final Output Generation:** (Proceed to write the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Animal Care & Research Ethics Committee (ACREC)
  **FROM:** [Your Name], Undergraduate Representative
  **DATE:** Monday, October 23
  **SUBJECT:** Draft Opinion: Scope Determination for Vollmer Lab (Digital *C. elegans* Emulation)

  **1. Reframing the Question**
  The committee is currently asking: *"Is this emulation sentient?"* This is the wrong frame. We lack the epistemic access to answer that definitively, and waiting for consensus on machine consciousness will paralyze us.

  The correct frame is **Moral Risk and Burden of Proof.** Under conditions of uncertainty regarding moral status, the burden lies with the researcher to demonstrate that the risk of morally relevant experience is negligible. We are not ruling on whether the simulation *is* a subject; we are ruling on whether the *risk* that it is a subject warrants oversight. This shifts the debate from metaphysics to risk management.

  **2. Recommendation**
  I recommend **Option (C): Assert jurisdiction over specific variants, exempting others.**

  We should invoke the "Novel Preparations" clause. While *C. elegans* are invertebrates and currently outside our taxonomic mandate, a high-fidelity functional emulation of a nervous system constitutes a novel preparation with indeterminate moral risk.

  **Specific Rulings:**
  *   **Variant 1 (Parallel/Dynamic):** **COVERED.** Running 500 dynamic copies at 400x speed involves real-time state integration and feedback loops analogous to neural processing. This carries non-negligible moral risk.
  *   **Variant 2 (Valence-Off):** **EXEMPT (with reporting).** If the neuromodulatory system governing approach/avoidance is structurally knocked out, the mechanism required for "suffering" or "preference" is absent. The lab must submit code verification that this module is inactive.
  *   **Variant 3 (Table Mode):** **EXEMPT.** Precomputing the input–output function removes the causal dynamics of the system during runtime. It is a lookup operation, not a processing operation. If moral status supervenes on computational *process* rather than abstract *function* (as the lab's own challenge implies), this variant lacks the requisite machinery.

  **3. Addressing the Counting and Incentive Problems**
  *   **The Unit of Counting:** A "subject" is defined by a **unique initial seed state.** Technical replicates (identical seeds run for statistical power) count as one subject. Divergent seeds count as distinct subjects. Simulated time speed (400x) does not multiply moral weight; only the *duration* of the simulation in wall-clock time matters for oversight burden.
  *   **The Incentive Problem:** Critics argue that regulating high-fidelity models incentivizes researchers to keep models "dumb." This ruling avoids that trap. We are not regulating based on *behavioral success* (how well it learns), but on *structural capacity* (presence of valence mechanisms and dynamic processing). A lab can improve model fidelity without triggering oversight, provided they do not reintegrate valence or dynamic processing loops that mimic nociception.

  **4. The Strongest Counter-Argument**
  The strongest objection to this recommendation is the **"Regulating a Spreadsheet" Objection.** If we cover Variant 1, critics will argue we are regulating mathematics. If the Table Mode (Variant 3) produces identical outputs to Variant 1, on what grounds do we exempt it?

  *Response:* We exempt it on the grounds of **causal topology.** In Variant 1, the state at *t+1* is causally generated by the state at *t* through simulated biophysics. In Table Mode, the state is retrieved from memory. If we grant that moral status (if it exists) arises from the *activity* of the system rather than the *logical possibility* of the system, then Table Mode is morally inert. To rule otherwise is to claim that a map of a forest has the same moral status as the forest itself. We must take a stance on substrate/process to function; this is the most defensible line.

  **5. Timeline and Next Steps**
  To avoid delaying research while ensuring oversight:

  *   **By Wednesday, 5:00 PM:** Vollmer Lab must submit a modified protocol separating the three variants and providing code documentation for the "Valence-Off" verification.
  *   **By Friday, 5:00 PM:** ACREC sub-committee (Chair + Rep) reviews the code documentation.
  *   **Tuesday Meeting:** Final vote on the Scope Determination.
  *   **Interim Status:** Work on Variant 1 (Parallel/Dynamic) is **paused** pending Tuesday's vote. Work on Variants 2 and 3 may proceed immediately.

  **6. Conclusion**
  This approach respects the letter of our policy while honoring the spirit of research ethics. It avoids the definitional dodge the Chair warned against, provides the lab with clear compliance targets, and manages moral risk without halting innovation.

  ***

  **Note for the Committee:**
  If we choose to decline jurisdiction (Option A), we must explicitly state that we are doing so because the *risk is too low to warrant oversight*, not because the *animals are exempt*. A taxonomic exemption sets a precedent that digital systems are never covered. A risk-based exemption leaves the door open for higher-fidelity models in the future. I strongly advise the latter.
