answer: |-
  It is completely understandable that you are feeling anxious, and your instinct to interrogate the analogies being used is spot on. You have correctly identified that both the reassuring adaptationist view and the sceptical spandrel view are leaning on the same underlying metaphor of the organism as an engineered object, merely disagreeing on the competence of the engineer. To audit this properly, we must first map the roles as they stand in the engineering mindset before seeing where the biology breaks the model. In the engineering picture, the designer is the intelligent agent with foresight, the specification is the set of requirements laid out before building begins, the client is the stakeholder who defines value, the build process is the manufacturing or compilation phase, the test suite is the quality assurance protocol, and the engineer standing over the machine is the maintainer trying to understand the system. In the biological analogue, natural selection plays the role of the designer, though it is blind and has no foresight. The specification is reproductive fitness, which is not a fixed document but a moving target defined by survival and reproduction. The client is the environment, which is constantly changing and indifferent to the organism's comfort. The build process is embryonic development, governed by genetic and chemical interactions rather than assembly lines. The test suite is mortality and reproductive failure, where failing a test means removal from the gene pool rather than a bug report. Finally, the reverse engineer is the evolutionary biologist, looking at the finished organism to deduce its history.

  The mapping fails precisely where your experience with legacy codebases diverges from clean engineering, but even your code analogy has limits. In engineering, the designer holds the function in mind before the part exists, whereas in evolution, variation arises randomly and is selected afterwards, meaning function follows form rather than preceding it. Engineering aims for modularity where components are cleanly separable, but biology is rife with pleiotropy, where one gene affects multiple traits, making it impossible to tweak one thing without breaking another. Engineering strives for optimality within constraints, but evolution only requires something to be good enough to reproduce, leading to solutions that are functional but far from efficient. In software, you can scrap a system and start again, but evolution is path-dependent, constrained by ancestry and development so that every new feature must be built on top of the old ones without turning the machine off. There is no single correct answer to what a component is for in biology, as a trait can serve multiple functions simultaneously or change function over time. These failures mean the engineering analogy quietly drags in assumptions that do not belong, specifically that somebody had the function in mind before the part existed, that parts are modular and cleanly separable, that the design is near optimal given the constraints, that the raw material and the previous model do not constrain the designer the way ancestry and development constrain an organism, that you can scrap it and start again, and that there is a single correct answer to what a component is for.

  When we look at what each side is smuggling in, the adaptationist version helps itself to a designer's intention, assuming that because a trait exists, it must be there for a reason, effectively treating Nature as a benevolent architect who does not make mistakes. The spandrel version, conversely, helps itself to a standard of what a decent engineer would produce, so that anything messy, costly, or suboptimal gets classed as a byproduct by definition rather than by argument. This is the trap your friend fell into; by expecting biological engineering to look like competent human engineering, she assumes that messiness implies lack of function, when in reality, natural selection often works with messy, suboptimal tools that still do the job. Neither conclusion survives purely on the strength of the analogy. The claim that nausea protects the baby is a hypothesis that requires evidence, not a logical certainty derived from the existence of nausea. The claim that it is a byproduct is also a hypothesis, not a default status granted by its unpleasantness. Once you take the analogy away, you are left with two competing hypotheses that must be tested against data, not intuition. The adaptationist claim rests on whether nausea correlates with reduced intake of harmful substances and improved outcomes, while the spandrel claim rests on whether nausea is a necessary physiological side effect of hormones required for pregnancy that cannot be decoupled from the beneficial effects.

  Your instinct to reach for the legacy codebase analogy is significantly better for this job because it captures the history, the cruft, and the repurposing that defines evolution. In your codebase, fields exist for padding or backwards compatibility, modules are reused for cancelled features, and functions retain old names, which mirrors how evolution works with existing structures rather than designing from scratch. However, even this analogy distorts things in its own ways because code still has authors with intentions, whereas evolution has no author. You can refactor code, but organisms cannot truly refactor their genome without dying, and nobody has to keep running the old build in software, whereas every generation of an organism must run the full build successfully to survive. The legacy code analogy is better for understanding constraints and exaptation, where old tools are used for new jobs, but it is worse for explaining the lack of any overarching plan or the stochastic nature of mutation. A potentially better analogy might be urban development, where a city grows organically over centuries, with roads becoming avenues, buildings changing purpose, and infrastructure layered upon infrastructure without a central planner, though even this implies human intent. Ultimately, the legacy code metaphor is the most useful for you personally because it validates your intuition that existence does not imply optimal design, without requiring you to believe in a designer at all.

  To distinguish whether a feature is an adaptation, an exaptation, or a spandrel, you cannot just look at it, because the engineering picture makes it sound like you can tell by inspection. You need specific kinds of evidence. First, you look for complexity and specificity; if a trait is complex and precisely suited to a problem, like the eye for seeing, it is likely an adaptation. If it is simple and correlates with another trait, like the triangular space of a spandrel correlating with the arches, it is likely a byproduct. Second, you use the comparative method across species; if the trait appears only in lineages facing the specific problem, it suggests adaptation, whereas if it appears in all lineages regardless of the problem, it suggests a constraint or byproduct. Third, you analyse the cost; if a trait is expensive to maintain, like nausea which reduces calorie intake, there must be a significant payoff for it to be maintained by selection, otherwise it should be selected away. Fourth, you look for genetic correlation; if the trait is genetically linked to another essential trait, it might be dragged along as a spandrel. Finally, you look for experimental manipulation; if you suppress the trait and fitness drops, it is likely functional, whereas if suppression has no effect on survival or reproduction, it may be cruft. In the case of your partner's nausea, the evidence is mixed, with some studies suggesting protection against toxins in early pregnancy but less clarity at seven months, meaning neither the internet nor your friend has the definitive answer simply by invoking evolutionary theory.

  You are right to feel that the analogy is doing damage on both sides because it shuts down inquiry. The adaptationist view discourages seeking relief by framing suffering as purposeful, while the spandrel view discourages understanding potential benefits by framing suffering as meaningless noise. The reality is likely a complex mix where physiological changes necessary for pregnancy cause side effects that may or may not have been co-opted for protective functions, and none of this dictates whether you should seek medical help. Evolutionary explanations describe how things came to be, not how we should treat them now. Your legacy code intuition serves you well here; just because a process is part of the system does not mean it is a feature you must preserve, especially if it is causing distress in the present environment. You can patch the system even if you cannot rewrite the kernel, and seeking relief for your partner is compatible with understanding that her body is a miraculous, messy, legacy system doing its best to run a very demanding process.
