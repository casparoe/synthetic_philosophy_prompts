  5.  **Drafting - Writing the Text (Iterative process for word count and tone):**

      *   *Start:* **FORM 17-B: DRAMATIZATION CONSENT WAIVER AND LEGACY IMPACT ASSESSMENT (DECEASED SUBJECT)**.
