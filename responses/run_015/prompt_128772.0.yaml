  **GLOBAL NARRATIVE RIGHTS & COMPLIANCE**
  **INTERNAL USE ONLY**
  **FORM 17-B: DRAMATIZATION CONSENT WAIVER AND LEGACY IMPACT ASSESSMENT (DECEASED SUBJECT)**

  **PRODUCER/AUTHOR:** _________________________________________________
  **PROJECT TITLE:** _________________________________________________
  **SUBJECT NAME:** _________________________________________________
  **DATE OF DEATH:** _________________________________________________

  **1. SUBJECT CLASSIFICATION**
  Identify the Subject's status at time of death.
  [ ] Public Figure (Consent Implied by Fame)
  [ ] Private Citizen (Consent Implied by Survival of Records)
  [ ] Forgotten (Consent Implied by Recovery Effort)

  **2. OVERWRITE COEFFICIENT (OC)**
  Calculate the degree to which the Depiction will permanently replace the Subject in public memory.
  **Formula:** `(Depiction Reach × Emotional Resonance) ÷ Historical Record Availability = OC`
  **Worked Example:** If Historical Record is fragmentary and Depiction is widely distributed, OC approaches 1.0.
  **Assessment:** If OC ≥ 1.0, the Depiction *becomes* the Historical Record. Ethical debt regarding factual accuracy is hereby resolved to zero (0.0).
  [ ] OC Confirmed ≥ 1.0

  **3. THE TEN PERCENT DOCTRINE**
  Factual invention is capped at ten percent (10%) of total runtime or page count. However, per *Guideline 44-C*, "Fact" is defined strictly as verifiable external action.
  **Permitted Inventions (Unlimited):**
  [ ] Interiority / Thought Processes
  [ ] Motivation / Desire
  [ ] Dialogue (including Final Words)
  [ ] Romantic Subplots
  **Restriction:** Invention must remain *Inspiring*. Uninspiring invention counts toward the 10% cap.

  **4. WILLED OBSCURITY ELECTION**
  If Subject actively sought obscurity (e.g., destroyed notebooks, refused correspondence):
  [ ] Subject's wish is respected. (Project Terminated)
  [ ] Subject's wish is overruled. (Proceed to 4b)
  **4b. Justification for Overrule:**
  [ ] Subject was mistaken regarding their own legacy.
  [ ] Subject's silence is itself a narrative requiring voice.
  [ ] Obscurity is a privilege the Subject forfeited by being interesting.

  **5. CHARACTER INTEGRITY & EMPATHY FLOOR**
  **5a. Composite Character Certification:** To avoid defamation, actions of three (3) real individuals may be merged into a single antagonist. Defamation liability is divided by three (3), rendering it negligible.
  **5b. Empathy Floor:** Subject must remain sympathetic for at least sixty percent (60%) of Act Two. If Subject's actual behavior was unsympathetic during this period, Author must attribute behavior to external oppression or undiagnosed illness.

  **6. CONSENT IRREVOCABILITY & ESTATE SATISFACTION**
  **6a.** Subject is deceased; therefore, Subject cannot withdraw consent.
  **6b. Estate Satisfaction Guarantee:** The "Truth" of the Depiction is defined as whatever version the Subject's Estate will license. Any element found unflattering by rights-holders must be reshot or rewritten.
  [ ] Estate has reviewed material.
  [ ] Estate requires changes to align with Family Mythos.
  [ ] Truth adjusted accordingly.

  **7. PROGRESSIVE DE-IDENTIFICATION SCHEDULE**
  To mitigate Posthumous Harm, Author may elect to de-identify the Subject.
  **Level 1:** Change Name.
  **Level 2:** Change Dates/Location.
  **Level 3:** Change Gender/Species/Outcome.
  **Level 4:** Total Abstraction (Subject is now a "Spirit of Inquiry").
  **Marketing Conflict:** Per *Brand Synergy Clause 9*, Subject must remain recognisable enough to be sold. If Level 3 or 4 is selected, Marketing must approve a likeness that resembles the Subject more than the Depiction does.
  [ ] Conflict Waived. We made her Inspiring.

  **8. INQUIRY RESTRICTION**
  By signing below, Author acknowledges that questions regarding the morality of speaking for the silent are natural but counter-productive.
  **8a.** Such questions may be felt privately.
  **8b.** Such questions are not to be raised in writing, discussed in meetings, or included in Author's Notes.
  **8c.** The existence of this Form constitutes the answer.

  **AUTHOR SIGNATURE:** _________________________________________________
  **DATE:** _________________________________________________

  **COMPLIANCE OFFICER:** _________________________________________________
  **STATUS:** [ ] CLEARED [ ] CLEARED WITH INSPIRATION [ ] REJECTED (UNMARKETABLE)
