      *   **Title:** Form 17-B, "Dramatization Consent Waiver and Legacy Impact Assessment (Deceased Subject)".
      *   **Length:** Roughly 800 words.
      *   **Style:** Deadpan satire, flat, self-assured register of real production paperwork (numbered clauses, checkboxes, blanks, defined terms, cross-references to nowhere).
      *   **Content Requirements:**
          *   Overwrite Coefficient (successful depiction = 1.0 = resolves question).
          *   Willed Obscurity Election (box for establishing they didn't mean it).
          *   Ten Percent Doctrine (cap invention at 10% of pages/time, but allow all motivation/interiority/last words).
          *   Composite Character Certification (merge 3 real people to avoid defamation).
          *   Empathy Floor (subject sympathetic for 60% of Act Two).
          *   Clause noting subject cannot withdraw consent.
          *   Estate Satisfaction Guarantee (truth = whatever estate licenses).
          *   Ending Logic: Must arrive somewhere the reader recoils from (e.g., Progressive De-Identification vs. Marketing recognizability, or stating the worry then forbidding raising it).
      *   **Ethical Constraint:** Humor must come from actual ethics of the practice (exaggerating real assumptions), not invented absurdity. No winking, no real people/statutes/cases.
      *   **Goal:** Make the reader unsure whether signing is wrong and whether "we made her inspiring" is an answer.

  2.  **Deconstruct the Tone:**
      *   Bureaucratic, sterile, authoritative.
      *   Treats ethical dilemmas as administrative hurdles.
      *   Assumes the institution has solved morality via paperwork.
      *   Passive voice, legalese, specific formatting (boxes, lines).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard form header. Company name (fictional), Form Number, Title.
      *   **Section 1: Subject Status.** Define the deceased. Checkboxes for "Public Figure," "Private Citizen," "Forgotten."
      *   **Section 2: The Overwrite Coefficient.** Explain the math of replacement. If the book becomes the truth, the real truth doesn't matter.
      *   **Section 3: Invention Limits (Ten Percent Doctrine).** The core irony: facts are limited, feelings are unlimited.
      *   **Section 4: Obscurity & Consent.** The "Willed Obscurity Election." The checkbox that overrides the subject's wish.
      *   **Section 5: Character & Empathy.** Composite characters and the Empathy Floor.
      *   **Section 6: Estate & Truth.** The Estate Satisfaction Guarantee.
