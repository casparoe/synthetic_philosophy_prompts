  - **The scene**
  The play opens in a featureless space where Rosencrantz and Guildenstern pass time by spinning a coin. Guildenstern calls heads. The coin lands heads. He calls it again. It lands heads. This repetition continues well beyond the point where statistical expectation suggests a tails should have appeared, accumulating into a run of over ninety consecutive heads. Rosencrantz treats the sequence as a simple stroke of luck, happily pocketing the winnings from each flip. Guildenstern, however, becomes increasingly agitated. He interrogates the coin, the laws of probability, and the nature of the moment. He suspects a suspension of natural law, while Rosencrantz remains indifferent to the anomaly. The scene establishes a tension between empirical frequency and theoretical expectation, set against a backdrop that feels untethered from normal reality. Eventually, the pair encounters a troupe of actors, yet the coin continues to land heads even when wagered against new opponents, suggesting the phenomenon is not localized to their private gamble but embedded in the world itself. The setting remains bare, emphasizing that there are no physical mechanisms visible to explain the deviation, isolating the philosophical problem from mechanical failure.

  - **What deference demands**
  The Principal Principle dictates that a rational agent's credence in an outcome should match the known objective chance of that outcome, provided the agent possesses no inadmissible evidence. If the objective chance of heads is one-half, Guildenstern's confidence should be fifty percent. The crux lies in admissibility. Standard interpretations hold that past outcomes are admissible evidence; they inform us about what the chances likely are. If Guildenstern does not know the coin is fair but infers it from the coin's appearance, the run of heads is admissible evidence that the chance is not one-half. Rational deference would require him to update his belief about the coin's bias, not cling to the hypothesis of fairness. He should conclude the coin is weighted.

  However, if Guildenstern knows *a priori* that the coin is fair—perhaps by definition of the object—then the past outcomes are inadmissible regarding the chance parameter. In that case, clinging to one-half is correct, and the unease is misplaced. The scene dramatizes the conflict between these two stances. Guildenstern acts as though he knows the chance is one-half, yet he treats the evidence as though it should matter. He wants the law of averages to correct the deviation, which implies he believes the chance is fixed, but he fears the deviation implies the chance has changed. His error is not necessarily a failure of deference, but a confusion about what evidence is admissible. He lacks the discipline to either fully update his belief about the bias or fully trust his knowledge of the fairness. Instead, he hovers in a state of metaphysical panic, sensing that the link between chance and credence has severed not because of his reasoning, but because the world has stopped behaving like a world where chances apply. This suggests his unease is not about the math, but about the reliability of the world itself to sustain the conditions for probability. Thus, the scene challenges whether deference is possible when the evidence threatens the very framework that makes chance intelligible.

  - **Undermining, and whether Stoppard stages it**
  The problem of undermining futures arises in Humean accounts of chance, where chances supervene on the total pattern of events. David Lewis noted that if chances are defined by the best systematization of the whole history, a future sequence of events could occur that makes the current chance hypothesis false. For example, a long run of heads might undermine the hypothesis that the chance is one-half, because the best system for a world with that run might assign a different chance. In *Rosencrantz and Guildenstern Are Dead*, the "future" is effectively written in the script of *Hamlet*. The outcomes are determined by narrative necessity, not probabilistic law. If chance supervenes on the total pattern, and the total pattern includes the scripted ending, then the objective chance of heads might indeed be one, not one-half.

  Does this stage the undermining problem? Structurally, yes: the local evidence (the flips) conflicts with the global hypothesis (fairness) because the global pattern (the script) dictates the outcomes. The run of heads is exactly the sort of sequence that would undermine a fairness hypothesis in a Humean world. However, the analogy collapses on metaphysics. In a scripted world, there are no objective chances in the indeterministic sense required for the Principal Principle. The outcomes are determined. Lewis's undermining problem presupposes a world where chances are real but supervene on patterns; Stoppard presents a world where patterns are imposed by authorial fiat. Guildenstern is not facing an undermining future where chance is real but fragile; he is facing a deterministic future where chance is an illusion. The unease comes from sensing the determinism without knowing its source. He feels the undermining of probability by narrative, which is a stronger constraint than the undermining of chance by rare fluctuations. Thus, the scene is not a genuine instance of Lewis's problem, but a theatrical exaggeration of what it would feel like if the supervenience base of chance were rigged. It captures the structural form of undermining without the ontological commitment to Humeanism.

  - **Where the reading breaks**
  The reading breaks down when we inspect the epistemic position of the characters. For the undermining problem to apply, there must be a true chance hypothesis that is undermined by the future. In the play, the hypothesis that the chance is one-half is simply false, not undermined. The coin is not established as fair; its fairness is an assumption Guildenstern brings to a world that does not support it. Furthermore, Guildenstern is not acting as a careful philosopher of probability. He reaches for supernatural explanations, suggesting time has stopped or that they are inside a different order of reality. He does not perform Bayesian updating; he performs metaphysics.

  Additionally, the play's subject is not probability but fate. The coin flips are a metaphor for the lack of agency the characters possess. To treat them as a technical problem of chance is to miss the narrative function. The streak does not stop when opponents change because the issue is not the coin or the opponents, but the characters' entrapment. If the world is deterministic, the Principal Principle is vacuous because chances are zero or one. Guildenstern's distress is not about credence matching chance; it is about the realization that his credence cannot match anything because there is no chance to match. The technical gloss of undermining assumes a Humean mosaic where laws emerge from events; Stoppard presents a world where events emerge from a script. This reverses the direction of supervenience. Therefore, while the anxiety mirrors the philosophical problem, the ontology of the play refuses the technical conditions required for the problem to exist. The scene is about the collapse of meaning, not the calibration of credence.

  - **What the play gives the philosophy**
  If the technical analogy fails, what does the play supply? It offers the phenomenology of undermining. Philosophical debates about the Principal Principle often remain abstract, focusing on rational norms. Stoppard exhibits what it feels like from the inside when evidence diverges from theory. Guildenstern's agitation captures the cognitive dissonance of an agent whose rational tools no longer map onto reality. The drama supplies the emotional weight of epistemic collapse. Furthermore, the frame of the script adds a layer the formal debate lacks: the source of the undermining is external agency. In Lewis's framework, undermining is a natural possibility of the Humean mosaic. In the play, it is imposed by an author.

  This distinction enriches the philosophical discussion by separating ontological uncertainty from narrative determinism. It suggests that the anxiety surrounding chance is not just about prediction, but about autonomy. When Guildenstern fears the coin, he fears the loss of a world where his choices and expectations matter. The play demonstrates that the stakes of the Principal Principle are not merely academic; they concern the stability of the agent's relationship to the world. The drama makes concrete the abstract fear that the laws of nature might not hold, grounding the philosophical problem in the human experience of uncertainty and powerlessness. It shows that the cost of undermining is not just error, but existential dread.

  - **Settled and contested**
  It is settled that the Principal Principle is a central norm in the philosophy of chance, though its precise formulation is contested. David Lewis's original principle is widely acknowledged to face the undermining objection, and his revised principle is a standard response, but whether it successfully resolves the issue remains live debate. Humeanism about chance is itself a contested position; non-Humeans argue chances do not supervene on events, which dissolves the undermining problem but raises other metaphysical issues. Whether the Revised Principal Principle applies to single-case chances is also disputed.

  Regarding the literary application, there is no consensus. Reading literature through technical philosophy always risks conscription. It is contested whether *Rosencrantz and Guildenstern Are Dead* depicts objective chance or merely epistemic ignorance. Your chapter must navigate this by stating clearly that you are using the play to explore the phenomenology of the problem, not claiming the play solves the metaphysics. The claim that the scene stages undermining is open to challenge, as argued above, but defensible as an analogy. You must distinguish between the play's metaphysics (deterministic script) and the philosopher's metaphysics (Humean mosaic). Keeping this distinction clear will protect the chapter from objections that the play simply depicts determinism, not chance.
