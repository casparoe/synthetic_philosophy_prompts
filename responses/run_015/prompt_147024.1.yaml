      *   **Reasoning:** She will locate a sharp cutoff. Either the wireless energy counts as "material exchange" (in which case it remains One until the very last step) or it doesn't (in which case it became Not One the moment wireless transmission began). She will not admit a middle ground. Given her ruling on the Quantum Grid, she might suddenly flip to "Not One" once the physical mass transfer drops below a certain threshold, insisting there is a fact of the matter we just can't see.

