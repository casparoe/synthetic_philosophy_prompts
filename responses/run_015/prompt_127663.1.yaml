answer: |-
  Here is the architectural spec for a Theory of Moral Ecology. These are the **desiderata** required to adjudicate the claim: *Are religious agents genuinely more moral, or merely more monitored?*

  ### I. The Four Core Constraints

  **1. The Visibility/Durability Distinction**
  *   **The Requirement:** The theory must model two distinct variables: **Moral Visibility** (prosocial acts under observation/reputation risk) and **Moral Durability** (prosocial acts under anonymity/low monitoring).
  *   **Why a Constraint:** Empirical data shows religious populations often score higher on public charity and attendance, but the gap narrows or vanishes in anonymous dictator games or implicit bias tests. If the theory collapses these into a single "morality" metric, it cannot distinguish between *signaling virtue* and *possessing virtue*.
  *   **The Trap:** Conflating compliance with character. A theory that fails here will falsely attribute surveillance effects to intrinsic goodness.

  **2. The Secular High-Trust Exception**
  *   **The Requirement:** The theory must explain the mechanism of cooperation in low-religiosity, high-trust societies (e.g., Scandinavia) without resorting to "cultural exception" as a terminal explanation.
  *   **Why a Constraint:** If the theory posits religion as a *necessary* condition for large-scale cooperation, the existence of stable, secular welfare states falsifies it. "Culture" is a label, not a mechanism. The theory must identify the functional substitute for supernatural monitoring (e.g., institutional transparency, generalized reciprocity norms).
  *   **The Trap:** Unfalsifiability. Claiming secular societies are "freeloading on historical religious capital" is a stopgap that prevents the theory from accounting for *current* maintenance mechanisms.

  **3. The Free-Rider Solution**
  *   **The Requirement:** The theory must identify the cost-enforcement mechanism that prevents defection in secular groups, equivalent to the "supernatural punishment" or "costly ritual" functions in religious groups.
  *   **Why a Constraint:** Cooperation is evolutionarily unstable if cheaters reap benefits without costs. Religious models solve this via belief in omniscient judges or expensive sacrifices. If secular groups sustain cooperation without *any* costly signaling or enforcement, the theory violates basic game theory.
  *   **The Trap:** Magical Thinking. Assuming secular cooperation is "free" or purely rational ignores the energy required to maintain trust networks.

  **4. Morality vs. Cohesion (The Whistleblower Test)**
  *   **The Requirement:** The theory must distinguish between **Group Loyalty** (cooperation with insiders) and **Ethical Integrity** (adherence to principles that may harm the group, e.g., whistleblowing).
  *   **Why a Constraint:** High-cohesion groups (religious or secular) often punish dissent to maintain stability. If "moral" is defined as "cooperative," then a silent conspiracy is moral. A valid theory must account for acts that are morally right but socially costly.
  *   **The Trap:** Normative Collapse. Reducing morality to social harmony validates mob rule and corrupts the definition of "good."

  ---

  ### II. Joint Unsatisfiability (Trade-Offs)

  A robust spec must acknowledge where these constraints pull against each other. You likely cannot maximize all variables simultaneously.

  *   **Anonymity vs. Stability:** You cannot have **Perfect Anonymity** and **Perfect Cooperation** simultaneously without a hidden enforcement layer. If agents are truly anonymous, the cost of defection drops to zero. Secular high-trust societies often trade privacy (data transparency, tax records, social safety nets) for trust. *Constraint 1 and Constraint 3 are in tension.*
  *   **Cohesion vs. Integrity:** You cannot maximize **Group Loyalty** and **Ethical Integrity** simultaneously. Mechanisms that increase durability (strong in-group norms) often decrease the likelihood of whistleblowing (which breaks cohesion). *Constraint 4 fights against the mechanisms required for Constraint 3.*
  *   **Efficiency vs. Signaling:** If secular societies remove **Costly Signaling** to gain efficiency (Constraint 2), they risk lowering the barrier to entry for free-riders (Constraint 3). You may not be able to have low-cost cooperation and high-free-rider resistance at the same time.

  ---

  ### III. Model Scoring

  **1. The Secularization Thesis**
  *(Claim: Modernity makes religion obsolete; morality becomes rational/institutional)*
  *   **Visibility/Durability:** **Fail.** Often assumes behavior is rational/autonomous, underestimating the role of social signaling in secular contexts.
  *   **Secular High-Trust:** **Pass.** Explicitly designed to explain this, though often vague on the *binding* mechanism.
  *   **Free-Rider:** **Weak.** Assumes institutions replace God, but often fails to explain why individuals *buy into* the institution without transcendent stakes.
  *   **Morality vs. Cohesion:** **Mixed.** Tends to equate moral progress with secularization, ignoring secular groupthink.

  **2. Costly-Signaling Models**
  *(Claim: Religion persists because rituals prove commitment and filter free-riders)*
  *   **Visibility/Durability:** **Pass.** Excellent at distinguishing public ritual from private belief, though often skeptical of private belief.
  *   **Secular High-Trust:** **Fail.** Struggles to explain Scandinavia without claiming they are unstable or parasitic on past religious capital.
  *   **Free-Rider:** **Pass.** Strongest feature. Explains enforcement via social cost.
  *   **Morality vs. Cohesion:** **Fail.** Often conflates "committed" with "moral." A terrorist cell passes costly signaling but fails the Whistleblower Test.

  ### Summary Architecture
  To succeed, the theory must treat religion not as a source of morality, but as a **technology of monitoring and enforcement**. It must then identify the secular equivalent technology. If it cannot identify the secular enforcement mechanism that replaces the "eye of God," it cannot explain how durability survives the removal of visibility.
