prompt: |-
  You are a professional philosopher who specialises in formal decision theory and who has a low tolerance for hand-waving. I am assembling a problem set for a second-year decision-theory seminar, and every Newcomb-style case I can find in the usual teaching material runs in the same direction: evidential decision theory takes the one box, causal decision theory takes both, and the discussion then just replays the same arguments about whether an act can be good news about a state it cannot cause. I want a case that runs the other way. Please construct a Newcomb-style decision problem in which causal decision theory prescribes taking only one box and evidential decision theory prescribes taking both — the reverse of the textbook verdicts — with the reversal falling out of the structure of the case rather than being stipulated. The scenario itself should be at most one paragraph and should be realistic: an ordinary institutional, medical, or financial setting with stakes a normal person could face, no demons or perfect predictors, no time travel or clones or exotic physics, and any prediction, test, or classification in the story may be no better than a shrewd human observer or an imperfect screening test. The agent is a fully informed expected-utility maximiser who knows the mechanism, the payoffs, and the relevant statistics; the divergence must not be produced by making the agent confused, ignorant of the setup, or uncertain about their own options. I would also rather you did not reach for a pre-commitment device, a contract signed earlier, or any form of self-modification: both verdicts should be computed at the moment of choice, on the causal and evidential expected-utility formulas respectively. A smoking-lesion-style common cause is permitted, but if you use one the agent must not already know its value, and the act must remain genuine evidence of it after conditioning on everything else the agent knows at the moment of choice. Please brainstorm two or three candidate structures first, say in a sentence each why you are discarding the others, and then develop the one that survives.

  Once you have the scenario, show that it meets the specification rather than asserting that it does. Give explicit numbers — the payoffs and the two probabilities that matter, namely the probability that the large prize is present on the causal counterfactual supposition that the agent takes both boxes and the probability that it is present conditional on the agent taking both boxes — and check the arithmetic so that each theory's preferred option really does come out ahead on its own formula, including the case where the agent takes the single box. Then walk through each theory's reasoning briefly, and tell me which single feature of the case is doing the work: I expect the whole disagreement to live in one cell of the decision matrix, and I want you to say plainly which cell that is. Follow this with an ablation: remove or weaken that feature and show what verdicts you get instead, so I can see whether the case collapses back into a plain incentive problem, into a smoking-lesion problem, or into something else. Then give me the strongest objection available to a defender of whichever theory comes out worse here — how exactly would they attack the case rather than accept the verdict? — and say whether the familiar taunt that one-boxers aim at two-boxers, that people who reason their way to the two-box verdict do not in fact end up with the money, cuts against evidential decision theory in your scenario or bounces off it. Finish with a short reflective paragraph on whether the existence of your case shows that the standard slogan about which theory one-boxes is merely an artefact of the usual payoff structure, or whether it reveals something deeper about the difference between causal and evidential expected utility. If you conclude that the specification cannot be met without cheating, say so and explain precisely which constraint forces the failure; an honest negative result is more useful to me than a case that smuggles the verdicts in. Please think carefully and check your arithmetic before answering.
