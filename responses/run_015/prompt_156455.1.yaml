answer: |-
  ### Brainstorming Candidates

  1.  **The Medical Override:** An act (taking a drug) causally cures a condition but is evidentially correlated with having the condition (only sick people take it). *Discarded:* If the act causally guarantees the healthy outcome, EDT and CDT converge on taking the drug, as the payoff depends on the post-act health state, not the prior condition.
  2.  **The Charity Match:** A donor matches funds only if you donate (1B), but donors only offer the match to those they predict won't donate (2B). *Discarded:* This typically requires a predictor that functions like a demon; making it realistic without perfect prediction often collapses the evidential correlation too weakly to override the causal benefit.
  3.  **The Compliance Audit (Selected):** A financial grant where claiming a small fee triggers an audit that freezes the grant (causal loss), but claiming the fee is evidence that the grant was funded (evidential gain). *Developed:* This allows the causal structure to favor 1B (avoiding the freeze) while the evidential structure favors 2B (correlation with funding).

  ### The Scenario: The Compliance Audit Grant

  You are a grant recipient facing two boxes: Box B contains your funding account (\$100,000 or \$0), and Box A contains an administrative fee (\$2,000). Yesterday, an algorithm classified you as "Aggressive" or "Cautious"; Aggressive types were funded (\$100,000) and tend to claim the fee, while Cautious types were unfunded (\$0) and tend to decline it. You know the base rate of funding is 50%, and the classification predicts your choice with 99% accuracy (i.e., $P(\text{Funded} \mid \text{Claim Fee}) = 0.99$ and $P(\text{Funded} \mid \text{Decline Fee}) = 0.01$). However, the institutional rules state that claiming the fee (taking Box A) triggers an automatic compliance audit that freezes Box B's funds indefinitely, whereas declining the fee (taking Box B only) releases the funds immediately. You must choose now: take Box B only (One-Box) or take Box A and Box B (Two-Box).

  ### Verification of Specifications

  **Payoffs and Probabilities:**
  *   **Grant Value ($V_G$):** \$100,000.
  *   **Fee Value ($V_F$):** \$2,000.
  *   **Prior Probability of Funding ($P(F)$):** 0.50.
  *   **Evidential Probability ($P(F \mid \text{1B})$):** 0.01 (Taking only B is evidence of being "Cautious"/Unfunded).
  *   **Causal Mechanism:** Taking 2B (Claim Fee) causally ensures Box B is Frozen (Value \$0). Taking 1B causally ensures Box B is Released (Value $V_G$ if Funded).

  **Causal Decision Theory (CDT) Calculation:**
  CDT evaluates acts based on causal counterfactuals $P(S \mid do(A))$. The funding state $S$ is fixed by the past algorithm; the act does not causally influence whether the money is there, only whether it is accessible.
  *   $E[U \mid do(\text{1B})] = P(F) \times V_G + P(\neg F) \times 0 = 0.50 \times 100,000 = \$50,000$.
  *   $E[U \mid do(\text{2B})] = P(F) \times 0 + P(\neg F) \times 0 + V_F = \$2,000$ (Funds are frozen by the audit).
  *   **Verdict:** CDT prescribes **One-Boxing** (\$50,000 > \$2,000).

  **Evidential Decision Theory (EDT) Calculation:**
  EDT evaluates acts based on conditional probabilities $P(S \mid A)$. The act is treated as evidence of the funding state.
  *   $E[U \mid \text{1B}] = P(F \mid \text{1B}) \times V_G + P(\neg F \mid \text{1B}) \times 0 = 0.01 \times 100,000 = \$1,000$.
  *   $E[U \mid \text{2B}] = P(F \mid \text{2B}) \times 0 + P(\neg F \mid \text{2B}) \times 0 + V_F = \$2,000$ (Funds are frozen regardless of state).
  *   **Verdict:** EDT prescribes **Two-Boxing** (\$2,000 > \$1,000).

  **The Divergence Feature:**
  The disagreement lives entirely in the **(One-Box, Funded)** cell of the decision matrix.
  *   For CDT, this cell is weighted by the prior $P(F) = 0.50$, contributing \$50,000 to the expected utility of One-Boxing.
  *   For EDT, this cell is weighted by the conditional $P(F \mid \text{1B}) = 0.01$, contributing only \$1,000.
  *   Because the Two-Box payoff is fixed at \$2,000 (due to the causal freeze), the CDT weight makes One-Boxing superior, while the EDT weight makes Two-Boxing superior.

  ### Ablation Study

  1.  **Remove the Causal Freeze:** If claiming the fee did *not* trigger an audit (Box B remains accessible in 2B), then $U(\text{2B}, \text{Funded}) = \$102,000$.
      *   CDT: $E[\text{2B}] = 0.5 \times 102,000 = \$51,000$. CDT now Two-Boxes (Dominance).
      *   EDT: $E[\text{2B}] = 0.99 \times 102,000 \approx \$101,000$. EDT Two-Boxes.
      *   *Result:* The case collapses into a standard incentive problem where both theories agree (Two-Box). The causal freeze is necessary for CDT to One-Box.
  2.  **Remove the Evidential Correlation:** If the algorithm's classification were independent of your choice ($P(F \mid \text{1B}) = P(F) = 0.50$).
      *   CDT: $E[\text{1B}] = \$50,000$. (Unchanged).
      *   EDT: $E[\text{1B}] = 0.50 \times 100,000 = \$50,000$.
      *   *Result:* EDT now prefers One-Boxing (\$50,000 > \$2,000). The case collapses into a plain causal dominance problem where both theories agree (One-Box). The evidential correlation is necessary for EDT to Two-Box.

  ### Strongest Objection (from an EDT Defender)

  An EDT defender would attack the **causal specification of the audit**. They would argue that if the agent *knows* the audit is triggered by the claim, then the state "Funds Frozen" is not a stochastic state $S$ to be conditioned on, but a deterministic consequence of the act. In the calculation above, I treated the freeze as a payoff modifier ($U=0$ for Box B in 2B). The EDT defender might concede the math but argue the *framing* is manipulative: "You have constructed a case where Two-Boxing causally destroys the large prize, then asked why EDT doesn't value the prize. Of course EDT values the prize, but it also values the evidence. The real objection is that your 'evidence' (the algorithm's prediction) is screened off by the agent's knowledge of their own decision process."

  However, a sharper objection targets the **stability of the correlation**. If the agent is an expected-utility maximizer who knows this setup, they will reason: "If I One-Box, I get \$50k (CDT) or \$1k (EDT). If I Two-Box, I get \$2k." A rational agent will One-Box. But if all rational agents One-Box, the algorithm's correlation ($P(F \mid \text{1B}) = 0.01$) becomes false. The algorithm would learn that rational agents One-Box and fund them. Thus, the probabilities provided ($0.99/0.01$) are not stable under the assumption of a rational agent knowing the setup. The case relies on the agent being "fully informed" of statistics that would not hold if they were fully informed and rational.

  ### The "Money" Taunt

  In standard Newcomb problems, the taunt is that CDT agents (Two-Boxers) leave money on the table. In this Reverse Newcomb case, the taunt cuts against **EDT**.
  *   **CDT Agents:** One-Box. They avoid the audit. If they are in the "Funded" state (50% of the time), they walk away with \$100,000. If "Unfunded", they get \$0. Average: \$50,000.
  *   **EDT Agents:** Two-Box. They claim the fee and trigger the audit. They walk away with \$2,000 regardless of the funding state. Average: \$2,000.
  *   **Verdict:** The CDT agents end up with significantly more money in the actual world. The EDT agent, by treating their choice as evidence of the funding state, reasons themselves into triggering the audit that destroys the value they were hoping to find evidence of. They sacrifice the causal leverage (avoiding the audit) for evidential comfort (believing the box is full), but since the audit freezes the box, the belief is financially worthless.

  ### Reflective Conclusion

  This case demonstrates that the standard slogan—"CDT Two-Boxes, EDT One-Boxes"—is an artefact of the specific payoff structure of the original Newcomb problem, not a necessary feature of the theories. CDT always follows causal leverage; EDT always follows evidential correlation. In standard Newcomb, the leverage is null (prediction is past) and correlation is strong (prediction is accurate), so they diverge. In this Reverse case, the leverage is strong (act triggers audit) and correlation is inverted (act signals opposite state), so they diverge in the opposite direction.

  However, the case reveals something deeper: **EDT is vulnerable to "Manichean" correlations where the news is better than the outcome.** EDT agents in this scenario prefer to be the type of person who finds a full box (Two-Boxers) even if being that type causally ensures they cannot open it. This suggests EDT can prescribe acts that maximize the *probability of being in a good world* rather than *making the world good*, even when the agent has the power to make the world good. The existence of this case confirms that the divergence between the theories is structural (causal vs. conditional expectation) rather than directional, and that CDT's insistence on causal efficacy protects it from sacrificing actual utility for good news.
