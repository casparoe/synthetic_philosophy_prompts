answer: |-
  ### Procedure: Weekly Dispute Resolution Protocol

  | Step | Entry condition | Question to ask | What counts as a sufficient answer | If it fails, go to | Hard-case flag |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Intake** | Batch of items where labelers disagree despite existing guidelines. | Is this disagreement about what the content *is* (facts) or how to *judge* it (rules)? | Consensus that all labelers see the same text/image features. | Step 2 | No |
  | **2. Fact Check** | Disagreement persists. | Can we settle this by adding a worked example of this specific content type to the guideline? | Yes: The example clarifies the fact (e.g., "This counts as a real person"). | **Settled.** Add example to guideline. | No |
  | **3. Divergence Check** | Fact check failed; labelers apply different logic to the same facts. | Can we describe a hypothetical item where Labeler A and Labeler B would *always* give opposite labels? | Yes: A clear description of a "probe item" that separates the two interpretations. | Step 4 | **Yes** (Divergent Rule) |
  | **4. Feasibility Check** | Probe item designed. | Is it possible for this probe item to actually reach our labeling queue? | Yes: We can generate or expect this content type. | Step 5 | No |
  | **5. Refinement Count** | Probe is feasible. | How many times have we rewritten this specific rule to fix this specific split? | Count < 3. | **Settled.** Rewrite rule based on probe outcome. | No |
  | **6. Stop Rule** | Count ≥ 3. | Have we failed to fix this split three times? | Yes. | Step 7 | **Yes** (Fiat Required) |
  | **7. Values Escalation** | Stop Rule triggered OR Probe item is impossible (Step 4 fails). | Is this disagreement about risk tolerance (e.g., over-blocking vs. under-blocking) rather than meaning? | Yes: Both interpretations are valid readings; choice depends on business risk. | **Escalate.** Hand to Trust & Safety Lead + Legal. | **Yes** (Values) |
  | **8. Recording** | Decision made (Fact, Convention, Fiat, or Values). | Who signs off and when do we review? | Sign-off: T&S Lead + Legal. Review: 6 months. | **End.** | No |

  ### Worked Cases

  | Case | Step entered | Steps run, in order | Outcome | Settled by fact, by convention, or by values | Residual risk | What the asker will dislike |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(i) AI Image/Consent** | Step 1 | 1 → 3 → 7 | Escalated to Leadership. | Values | High (Legal risk vs. User expression). | No clear rule answer; requires policy choice. |
  | **(ii) Deviant Labeler** | Step 1 | 1 → 3 → 4 → 7 | Recorded as Unfalsifiable Divergence. | Convention (Negative) | Low (Feature never appears). | Acknowledging we cannot control this labeler's logic. |
  | **(iii) Satire/Harassment** | Step 1 | 1 → 3 → 5 → 6 → 7 | Hardcoded Lookup Table (Fiat). | Values (via Fiat) | Medium (Consistency vs. Nuance). | Admitting the rule cannot be clarified further. |

  ### What This Procedure Cannot Do

  1.  **Eliminate Ambiguity:** It cannot make vague concepts (like "harassment") precise if the vagueness is inherent to the concept rather than the wording.
  2.  **Predict Future Cases:** It cannot guarantee that a rule settled today will not fracture on a new type of content next month.
  3.  **Remove Human Judgment:** It cannot replace the need for a human to decide on value trade-offs (e.g., safety vs. free speech).
  4.  **Fix Translation Drift:** It cannot ensure that a rule clarified in English retains the same boundary conditions when translated into three other languages.
  5.  **Stop Automation Bias:** It cannot prevent labelers from drifting toward the classifier's suggestion during normal work; it only prevents using that suggestion as a tiebreaker in this meeting.

