answer: |-
  ### Part 1: Diagnostic Framework & Mechanism Clarity

  **Your Three Buckets:** Your framing is sound, but needs precise definitions to be actionable.
  1.  **Echo (Independence Failure):** Reviewers converge not because they are right, but because they see each other's scores or share a social bias. *Symptom:* High agreement, low information diversity.
  2.  **Coin-Flip (Competence Failure):** The signal is too weak for human judgment. *Symptom:* Low agreement, low predictability of outcomes.
  3.  **Drift (Systematic Bias):** Errors are not random; they point one way (e.g., against qualitative methods). *Symptom:* High agreement, but consistent exclusion of a specific class of viable proposals.

  **Averaging vs. Majority:**
  *   **Majority Vote (Yes/No):** This is what Condorcet governs. It protects against outliers but requires competence > 50%.
  *   **Averaging Scores (1–9 Scale):** This relies on the *Law of Large Numbers*. It cancels out random noise but **amplifies** systematic drift.
  *   **The Rule:** Use **Majority** when the decision is binary (Fund/No Fund) and you fear outliers. Use **Averaging** when the decision is ordinal (Ranking) and you assume errors are random noise. **Do not mix them** (e.g., do not average scores then take a majority vote on the average); pick one aggregation method per panel.

  ---

  ### Part 2: The Condorcet Procedure Checklist

  **Instructions:** Complete this during panel design, not during the meeting.

  #### 1. The Truth Test (Applicability)
  *Question:* Is there a fact of the matter about which proposal is "better," or are we aggregating preferences?
  *   **Sufficient Answer:** "We are predicting future success (citations, breakthroughs, policy impact)." (CJT applies).
  *   **Hard No:** "We are balancing geographic diversity, subfield representation, or PI demographics." (CJT does not apply; this is political allocation).
  *   **Hand to Human:** "We want high-risk high-reward, but 'reward' is undefined." (Requires a value statement from the Board before proceeding).

  #### 2. The Competence Check (p > 0.5)
  *Question:* Are reviewers better than chance at identifying success in this specific domain?
  *   **Sufficient Answer:** "Past panels in this area show correlation between high scores and subsequent publications/grants," OR "Reviewers are active practitioners who successfully navigate this specific niche."
  *   **Hard No:** "This is a 'transformative' call where success is undefined or historically unpredictable." (Diagnosis: **Coin-Flip**. Stop. See Step 5).
  *   **Hand to Human:** "We think they are expert, but we have no data on past panel performance." (Proceed with caution; assume Coin-Flip risk).

  #### 3. The Independence Audit (Echo Check)
  *Question:* Will reviewers form opinions without knowing others' views?
  *   **Sufficient Answer:** "Scores are submitted blindly before the meeting. Discussion happens only after scores are locked."
  *   **Hard No:** "Reviewers see the spreadsheet of scores before discussing." (Diagnosis: **Echo**. This invalidates the math. Fix: Blind pre-votes).
  *   **Hand to Human:** "Reviewers know each other from conferences." (Acceptable risk, but monitor for clique behavior).

  #### 4. The Drift Scan (Systematic Bias)
  *Question:* Is there a methodological or demographic monoculture that systematically penalizes a viable approach?
  *   **Sufficient Answer:** "The panel includes methodological diversity proportional to the applicant pool."
  *   **Hard No:** "All reviewers come from Tradition A, and applicants from Tradition B are applying." (Diagnosis: **Drift**. Adding more reviewers makes this *worse*).
  *   **Hand to Human:** "Tradition A reviewers claim Tradition B is 'rigorously weak'." (This is a value judgment. Board must decide if Tradition B is eligible).

  #### 5. The Size & Authority Decision
  *Question:* Given the above, what is the decision mechanism?
  *   **Sufficient Answer:**
      *   *If Competence High + Independence High:* Group of 5–9. Use Majority or Average.
      *   *If Competence Low (Coin-Flip):* **Single Expert** OR **Lottery** among qualified proposals. (Larger groups amplify noise).
      *   *If Drift Detected:* **Single Expert** with a mandate to override bias, OR reconstitute panel.
  *   **Hard No:** "Expanding the panel to 15 people to fix a Coin-Flip or Drift problem." (Diminishing returns turn negative).
  *   **Hand to Human:** "Choosing between Single Expert vs. Lottery." (Depends on whether you value accountability or fairness more).

  ---

  ### Part 3: Running the Procedure on Your Scenarios

  #### Scenario 1: Standard 8-Person Subfield Panel
  *   **Truth:** Yes (predicting standard research success).
  *   **Competence:** High (subfield experts know what works).
  *   **Independence:** **Risk of Echo.** Your current rule ("everyone sees scores before meeting") violates Condorcet.
  *   **Drift:** Low (subfield matches applicants).
  *   **Diagnosis:** **Echo Risk.**
  *   **Recommendation:** Keep the 8 people. **Change the process:** Require blind scores submitted 48 hours before the meeting. Discuss only after scores are locked. Use Averaging for ranking, Majority for funding threshold.
  *   **Why:** You have competence, so the group is an asset, but only if independent.

  #### Scenario 2: Flagship "Transformative" Program
  *   **Truth:** Ambiguous (hard to define "transformative" ex-ante).
  *   **Competence:** **Low (Coin-Flip).** You admitted reviewers are barely better than chance.
  *   **Independence:** Irrelevant if competence is ~0.5.
  *   **Diagnosis:** **Coin-Flip.**
  *   **Recommendation:** **Do not use a voting panel.** Condorcet proves that if $p \approx 0.5$, adding voters adds noise, not wisdom.
      *   *Option A:* **Lottery.** Filter for "qualified" (threshold met), then randomize. Reduces bias, saves reviewer time.
      *   *Option B:* **Single Editor.** One trusted person with accountability.
  *   **Hard Truth:** A large panel here gives you the *illusion* of rigor while performing worse than a dice roll.

  #### Scenario 3: Cross-Cutting Call (Methodological Monoculture)
  *   **Truth:** Yes (predicting success).
  *   **Competence:** High for Tradition A, **Low/Negative for Tradition B**.
  *   **Independence:** High correlation (shared tradition).
  *   **Diagnosis:** **Drift.**
  *   **Recommendation:** **Do not aggregate.** An 8-person panel of Tradition A will systematically reject Tradition B with high confidence.
      *   *Fix:* Quota the panel (4 Tradition A, 4 Tradition B) AND use **Majority Rule** (not averaging). Averaging would dilute the Tradition B votes; Majority allows them to block systematic exclusion.
      *   *Alternative:* Hand to **Single Expert** with a written mandate to fund across traditions.
  *   **Hard Truth:** If you cannot diversify the panel, you are not reviewing; you are gatekeeping.

  ---

  ### Part 4: Limitations & Board Explanation

  **What This Procedure Cannot Tell You:**
  1.  **Value Judgments:** It cannot decide if "Tradition B" *should* be funded. It only tells you if the panel *will* fund them. If the Board wants to exclude Tradition B, Condorcet is irrelevant; just say so.
  2.  **Preference Aggregation:** If the goal is to make the community feel represented rather than to find the "best" science, Condorcet is the wrong tool. Use stakeholder representation instead.
  3.  **The "Best" Proposal:** There is often no fact of the matter on which of two good proposals is "better." Condorcet helps find the *good* from the *bad*, not rank the excellent.

  **The One-Paragraph Board Explanation:**
  > "We are updating our review protocols to align with statistical best practices for group decision-making. The Condorcet Jury Theorem shows that groups only outperform individuals when reviewers are competent and independent. Our new checklist diagnoses three failure modes: 'Echo' (reviewers influencing each other), 'Coin-Flip' (decisions too uncertain for experts), and 'Drift' (systematic bias against specific methods). For standard panels, we will enforce blind pre-votes to ensure independence. For high-uncertainty 'transformative' calls, we will move to lotteries or single-expert review, as large panels statistically degrade decision quality in those cases. This ensures we only use group voting when it mathematically improves our funding outcomes."

  **Constraint Check:**
  *   **Volunteers:** Blind pre-votes are low burden; lotteries reduce burden.
  *   **No Probabilities:** The checklist uses heuristics (past performance, methodological diversity) rather than $p$-values.
  *   **Explainable:** The paragraph above is designed for non-technical governance.
