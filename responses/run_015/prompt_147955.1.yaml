prompt: |-
  I'm a program officer at a research foundation. We run maybe a dozen review panels a year, each handing out a few million dollars, and the rules are mostly inherited: eight reviewers from the relevant subfield, everyone sees each other's scores before the meeting, we fund whatever a majority puts in the top half. I've been reading about the Condorcet jury theorem and I want to turn whatever in it is actually usable into a procedure my team can run when we set up a panel — not a general essay on collective wisdom.

  What I have in mind: a short ordered checklist covering (a) whether the decision is even the kind of thing the theorem applies to, (b) whether our reviewers are better than chance on this kind of call and how we'd know without a stats department, (c) how badly the independence assumption is being violated and what to do about it — secret pre-votes, withholding scores until after discussion, deliberately mixing subfields — (d) panel size and the point where adding people stops buying anything, (e) when to hand the call to one named person instead of a vote. For each question say what counts as a sufficient answer, where the procedure returns a hard no, and where it has to stop and hand the call to a human because it's a value judgment.

  One thing I'd like built into the middle of it. I've started sorting panel failures into three buckets and I want the procedure to diagnose which one a given panel is headed for: "echo" (everyone anchored on the same first score or the same methodological reflex), "coin-flip" (the case is just hard and reviewers are near chance), and "drift" (errors systematically point one way, e.g. everyone is sceptical of the same kind of method). If that framing is wrong or misses a bucket, say so and fix it. I also suspect there's two different things people lump together as crowd wisdom — averaging scores versus majority on a yes/no — and I want the procedure to be clear about which one it's licensing, and what it says about mixing the two.

  Then run it on three of our real setups: [1] the standard eight-person subfield panel on ordinary proposals; [2] our flagship "transformative" program, where I honestly think reviewers are barely better than a coin flip at picking which weird proposals will pan out — I have a feeling the procedure will tell me something I don't want to hear, that a big panel there is worse than a lottery or a single trusted expert, and I'd rather have it stated plainly than softened; [3] a cross-cutting call where every plausible reviewer comes out of the same methodological tradition with a strong shared view of what counts as rigorous.

  Constraints: reviewers are volunteers with limited time, whatever we do has to be explainable to our board in a paragraph, and I can't ask anyone to estimate probabilities in any formal way. Please also say what the procedure can't tell me — especially for the cases where there's no fact of the matter about which application is "best" and we're really just aggregating preferences.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Program Officer at a research foundation.
      *   **Context:** ~12 review panels/year, few million dollars each. Current rules are inherited (8 reviewers, see scores, majority rules top half).
      *   **Goal:** Create a *usable checklist/procedure* based on the Condorcet Jury Theorem (CJT) and related collective wisdom concepts. Not a general essay.
      *   **Specific Requirements:**
          *   Short ordered checklist.
          *   Cover 5 specific areas: (a) Applicability, (b) Competence (> chance?), (c) Independence (violations & fixes), (d) Panel Size (diminishing returns), (e) Single Expert vs. Vote.
          *   For each item: Define "sufficient answer," "hard no," and "hand to human/value judgment."
          *   **Diagnostic Framework:** Incorporate the user's three failure buckets ("Echo," "Coin-flip," "Drift"). Validate/fix this framing.
          *   **Mechanism Clarity:** Distinguish between averaging scores vs. majority vote on yes/no.
          *   **Run the Procedure:** Apply it to three specific scenarios:
              1.  Standard 8-person subfield panel.
              2.  Flagship "Transformative" program (low competence/high uncertainty).
              3.  Cross-cutting call (methodological monoculture).
          *   **Constraints:** Volunteers (limited time), explainable to board (1 paragraph), no formal probability estimation by reviewers.
          *   **Limitations:** Explicitly state what the procedure *cannot* tell the user (especially regarding value judgments/preference aggregation).

  2.  **Deconstruct the Theory (Condorcet Jury Theorem & Related):**

      *   *CJT Core:* If voters are independent and competence $p > 0.5$, majority rule converges to truth as $n \to \infty$. If $p < 0.5$, larger groups make it worse.
      *   *Independence:* Crucial. Correlated errors kill the benefit.
      *   *Competence:* Must be better than random.
      *   *Binary vs. Continuous:* CJT is binary (True/False, Yes/No). Grant review is usually ordinal/scoring. Need to map scoring to binary decisions or use averaging (which relies on Law of Large Numbers, slightly different but related).
      *   *User's Buckets:*
          *   "Echo" = Correlated errors/Social influence (Independence violation).
          *   "Coin-flip" = Competence $p \approx 0.5$ (CJT fails).
          *   "Drift" = Systematic bias ($p < 0.5$ relative to the "true" goal, or just bias).
      *   *Refinement on Buckets:* "Drift" is essentially systematic bias. "Echo" is correlation. "Coin-flip" is low competence. This framing is solid. I should keep it but clarify definitions.
      *   *Averaging vs. Majority:* Averaging reduces variance (good for noise). Majority reduces outlier impact (good for distinct thresholds). Mixing them needs care.

  3.  **Drafting the Checklist (Iterative Process):**

      *   *Item 1 (Applicability):* Is there a "correct" answer? CJT assumes a ground truth. Grant funding is often preference aggregation. *Constraint:* Must distinguish "Truth" (will this work?) vs. "Value" (do we like this?).
      *   *Item 2 (Competence):* How to check $p > 0.5$ without stats? Look at track records, inter-rater reliability, or past funding outcomes (if trackable). *Constraint:* No formal probability estimates. Use heuristics.
      *   *Item 3 (Independence):* This is the big one for "Echo." Pre-votes, blind reviews.
      *   *Item 4 (Size):* Diminishing returns. 8 is usually okay if independent. If correlated, 8 is worse than 3.
      *   *Item 5 (Expert vs. Group):* When $p$ is low or bias is high, pick a dictator.

      *   *Refining the "Sufficient/Hard No/Hand to Human" structure:* This needs to be crisp.
      *   *Refining the Diagnostic:* Integrate the Echo/Coin-flip/Drift diagnosis *into* the checklist steps, not just as an add-on.

  4.  **Developing the Diagnostic Framework:**

      *   *Echo:* High agreement, low information diversity. (Fix: Independence protocols).
      *   *Coin-flip:* Low agreement, low predictability. (Fix: Lottery or Single Expert).
      *   *Drift:* High agreement, but systematically excludes valid types. (Fix: Diversity of reviewers or Value Judgment).
      *   *Correction:* The user's framing is good. I will validate it but add that "Drift" is often a value judgment masquerading as error.

  5.  **Running the Scenarios:**

      *   *Scenario 1 (Standard 8-person):* Likely passes competence. Risk of Echo (seeing scores). Risk of Drift (subfield bias).
      *   *Scenario 2 (Transformative):* Competence is low ($p \approx 0.5$). CJT says group size doesn't help. Might be worse due to groupthink. Suggest Lottery or Single Expert.
      *   *Scenario 3 (Methodological Monoculture):* High correlation (Echo) + High Drift (against other methods). Group size amplifies bias. Need diverse reviewers or Single Expert with broad mandate.

  6.  **Addressing Constraints:**

      *   *Volunteers:* Keep procedures low-burden (e.g., secret ballots before discussion, not complex modeling).
      *   *Board Explanation:* Need a summary paragraph.
      *   *No Probabilities:* Use "Track Record" or "Consensus vs. Outcome" heuristics.
      *   *Limitations:* Must explicitly state that CJT doesn't solve "What should we fund?" (Values).

  7.  **Final Review against User Prompt:**

      *   *Checklist format?* Yes.
      *   *5 specific areas covered?* Yes.
      *   *Sufficient/Hard No/Hand to Human included?* Yes.
      *   *Diagnostic buckets integrated?* Yes.
      *   *Averaging vs. Majority clarified?* Yes.
      *   *Three scenarios run?* Yes.
      *   *Limitations stated?* Yes.
      *   *Tone:* Professional, direct, actionable.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Thought:* The user asked to distinguish averaging vs. majority.
      *   *Adjustment:* Make sure Step 1 addresses whether the goal is "Finding the Best" (Truth) or "Reflecting the Field" (Preference). CJT applies to Truth. Averaging applies to Noise reduction.
      *   *Thought:* How to check competence without stats?
      *   *Adjustment:* Suggest looking at "Post-hoc validation" (did past funded projects succeed?) or "Inter-rater reliability" (do reviewers agree with each other more than chance?).
      *   *Thought:* The "Drift" bucket is tricky. If everyone is skeptical of a method, is that error or policy?
      *   *Adjustment:* Flag this as a "Hand to Human" value judgment. The procedure can detect the drift, but not decide if it's wrong.

  9.  **Final Polish:** Ensure the "Board Paragraph" is actually one paragraph. Ensure the "Hard No" conditions are clear. (Proceed to generate output).

  *(Self-Correction on the Diagnostic Buckets)*: The user asked me to say if the framing is wrong.
  *Echo* = Correlated errors (Independence violation).
  *Coin-flip* = Competence $\le$ 0.5.
  *Drift* = Systematic bias (Competence < 0.5 for specific subsets).
  *Critique:* This is actually a very strong framing. I will validate it but note that "Drift" is often indistinguishable from "Policy" without external validation. I will keep the labels but refine the definitions for the checklist.

  *(Self-Correction on Averaging vs Majority)*: CJT is strictly Majority Rule on Binary Choices. Grant review is usually Scoring (Continuous). Averaging scores relies on the Law of Large Numbers (canceling out noise), which requires Independence but not necessarily $p > 0.5$ in the binary sense, though it assumes errors are random not systematic. I need to make sure the checklist distinguishes these.

  *(Final Plan)*:
  1. Validate/Refine Diagnostic Buckets.
  2. Distinguish Mechanisms (Majority vs. Averaging).
  3. The Checklist (5 Steps).
  4. The Three Scenarios.
  5. The Limitations.
  6. The Board Paragraph.
  7. Constraints check (volunteers, no probs).

