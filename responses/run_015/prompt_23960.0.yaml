      *   *Sacrifice:* To be coherent, you might have to admit that Case 6 is where your gut is fighting your theory. You *should* move a little in Case 6, just less than in Case 1. Or, you have to accept that self-assessment of reasoning skill is notoriously unreliable.

  7.  **Predictions:**
      *   *5 Peers:* Weight increases. If 1 peer = 50% weight, 5 peers = massive weight. (Bayesian update).
      *   *Stubborn Peer:* If they never change mind, their disagreement is noise. Reliability drops. Weight decreases.

  8.  **Refining the Output Structure:**
