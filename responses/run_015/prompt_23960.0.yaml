      *   **Predictions:** 5 peers, Stubborn peer.
      *   **The Cost:** What must be given up? (Likely the intuition in Case 6 that you shouldn't move *at all* if you think you're better, or the intuition in Case 1 that you *must* split exactly).

      *(Self-Correction during drafting)*: I need to be careful with Case 4. Is taste truth-apt? Philosophers debate this. But practically, the user treats it as non-truth-apt. I should frame it as "Mind-Independent Truth."
      *   Case 7 is "Permissivism." I need to name that.
