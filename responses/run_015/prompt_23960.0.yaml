              *   Case 6: Self-assessment is tricky. If I'm truly better, her disagreement is weak evidence. But I might be wrong about being better.
              *   Case 7: If evidence underdetermines, disagreement doesn't add weight against me.

      *   *Refining the Principle:* The "Total Evidence View" combined with a distinction between *objective truth-apt claims* vs. *subjective/underdetermined claims*. Let's call it the **Weighted Evidence Principle**.

      *   *Alternative:* **The Epistemic Value of Disagreement.** Disagreement is only reason to revise if:
          1.  The question has a mind-independent answer (not taste).
          2.  The dissenter has access to relevant evidence/reasoning capabilities.
          3.  The disagreement isn't explained by underdetermination.

      *   *Let's try to synthesize a specific framework:* **Contextual Epistemic Weighting.**
          *   Core Idea: Disagreement is *higher-order evidence*. You update based on the reliability of the source regarding *this specific question* and the *nature of the question*.

  4.  **Drafting the Principle:**
      *   *Name:* The **Reliability-Conditional Evidence Principle**.
      *   *Formulation:* "Revise your credence in proportion to the likelihood that the dissenter's judgment tracks the truth *on this specific matter*, weighted against your own self-assessment, unless the matter is non-truth-apt or the evidence is genuinely underdetermined."
      *   *Wait, Case 6 is the hard one.* The "Right Reason" view vs. "Conciliationism."
      *   *Better approach:* Acknowledge the tension in Case 6. It's the classic debate in social epistemology (Conciliationism vs. Steadfastness).
      *   *Proposed Principle:* **The Differential Weight of Higher-Order Evidence.**
          *   Disagreement provides "higher-order evidence" (evidence about your evidence).
          *   Weight = (Dissenter Reliability on Topic) × (Objectivity of Topic).
          *   Exception: If you have independent reason to think you are reasoning correctly *and* they are not (Case 6), you discount their weight, but you must discount for your own bias (the "smugness check").

      *   *Let's simplify for the user.* They want *one* principle or a *small family*.
      *   *Candidate:* **The Total Evidence View with Domain Specificity.**
      *   *Core:* Disagreement is evidence. How much evidence? Depends on how likely they are to be right *about this*.
      *   *Case 4 (Movies):* Not truth-apt (or weakly so). Disagreement = 0 evidence.
      *   *Case 7 (Borderline):* Evidence is weak. Disagreement confirms ambiguity, doesn't prove me wrong.
      *   *Case 6:* This is the "Uniqueness vs. Permissivism" debate. If Permissivism is true (Case 7), Case 6 is easier. If Uniqueness is true, Case 6 is hard.
      *   *Let's go with a hybrid:* **Calibrated Conciliation.**

  5.  **Mapping Cases to the Principle:**
      *   *Principle:* **Update on disagreement proportionally to the estimated likelihood that the other person's cognitive process is more truth-tracking than yours *for this specific proposition*, subject to the constraint that the proposition must be truth-apt.**
      *   *Case 1:* Equal likelihood -> Split (50/50 weight).
      *   *Case 2:* Her likelihood >> My likelihood -> Defer.
