      *   *Case 6 (Better Reasoner/Smugness):* Self-assessed superiority vs. humility. Intuition: Conflict. Feels smug to ignore, but logical to trust self. Tension with Case 1.
      *   *Case 7 (Borderline/Underdetermined):* Evidence allows multiple views. Intuition: Reasonable disagreement, no need to average.

  3.  **Search for a Unifying Principle:**
      *   *Initial thought:* "Weighted Average." (Trust experts more, ignore non-experts).
          *   *Problem:* Doesn't handle Case 4 (Movies) or Case 7 (Underdetermined) well. You don't average taste.
      *   *Second thought:* "Epistemic Peerhood." (Conciliate with peers, defer to superiors, ignore inferiors).
          *   *Problem:* Case 6 challenges the definition of "peer." Case 4 challenges the idea that disagreement *always* requires revision.
      *   *Third thought:* "Total Evidence View" (Kelly, 2005; 2010).
          *   *Idea:* Disagreement is just another piece of evidence. You update based on the *total evidence*, which includes the first-order evidence (the tax return, the wine) and the higher-order evidence (the fact that someone else thinks X).
          *   *Fit:*
