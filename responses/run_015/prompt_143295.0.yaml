  hey so im putting together the take-home for my upper-level seminar on death, value and the future of humanity, and i need an exam question that actually separates students who understand Scheffler's afterlife conjecture from the ones who just memorized the chapter summary. the course is mostly final-year undergrads, so nothing too obscure, but i want it in the weeds enough that they cant just recite "extinction is bad because people die plus future people matter".

  please write me:
  1) the essay question itself. it should ask them to explain Scheffler's afterlife conjecture — the idea that our present values and attachments depend on an implicit expectation that human life continues after our own death — and then use it to argue why human extinction is bad in a way that goes beyond aggregating the individual deaths involved. but i want a twist: introduce a "successor scenario" where intelligent, culture-bearing artificial descendants or radically post-human beings survive after biological humans are gone. ask them whether Scheffler's argument still makes extinction bad in that case, and to identify at least one internal tension this scenario exposes in the conjecture (for instance, whether the value is tied specifically to biological continuity, to the continuation of particular projects, or to our current psychological attachment). make it a 90-minute essay, about 1200 words, worth 40 marks.

  2) a model answer: outline the three or four moves a top answer must make (clear exposition of the conjecture, the distinction between personal death and species extinction, the application to the successor scenario, identification of the tension, and a reasoned resolution or admission of failure).

  3) a marking scheme: list the specific points that earn marks (e.g., 10 marks for accurate exposition, 10 for the extinction-beyond-deaths argument, 10 for the successor-scenario analysis, 10 for the tension identification). also list the specific mistakes that should cost marks — for example, confusing the afterlife conjecture with a religious belief in personal survival, treating extinction as bad only because of the deaths, failing to see that the conjecture makes current lives depend on future existence, or assuming without argument that artificial successors solve the problem. keep it practical: i need to actually grade with this.

  dont ask for citations or a bibliography; these kids dont have library access during the exam. and please, no verbatim quotes — paraphrase Scheffler's claims in your own wording. if you mention the book, just call it Scheffler's Death and the Afterlife but dont lean on page numbers. write it casually, like youre sending me notes. a typo or two is fine — actually prefered, keeps it real.
