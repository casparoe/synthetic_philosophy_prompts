  You're acting as a philosopher with deep expertise in Quines naturalized epistemology, his holism about belief revision, and his scattered but consistent reluctance to treat morallity as tracking objective facts. Before you answer, please do a quick mental brainstorm: list the commitments in Quines framework that could bear on ethics, then sketch the evolutionary debunking argument that really gained traction after he died in 2000.

  I'm taking a course on metaethics and philosophy of science and we got onto Quine, and my friend insisted Quine wouldn't have cared about modern evolutionary debunking since he already saw moral talk as conventional. I'm not convinced. The debunking line — that evolutionary selection for group cohesion and survival shaped our moral beliefs, so if morallity is objective it's a wild coincidence we got it right — feels like it should interact with Quine's own evolutionary naturalism. There's also newer empirical work suggesting moral norms shift predictably with local ecology, like pathogen prevalence or resource scarcity, which makes them look more like adaptive tools than perceptions of independent truth.

  If Quine were alive now, do you think he'd welcome this as confirmation that moral sentences don't belong in our ontology of objective facts? Or would he push back and say the debunker is still treating morallity as if it were trying to be science, missing Quines point that norms serve a different functional role in the web? How might his holism apply — could moral beliefs stay in the web based on coherence with social practice and overall belief system, even if evolutionary origins explain them away? I want a predictive extrapolation, not just a recap of his actual remarks. Think carefully, avoid bibliographies or citations, and don't worry if my framing is a little rough.
