answer: |-
  The strong interpretation of Molyneux's "no"—that shape is merely modality-specific data with no shared ontology—is mistaken. It confuses the format of delivery with the content delivered. The failure of the newly sighted man to identify the cube visually is not evidence that visual shape and haptic shape are fundamentally different things; it is evidence that vision and touch have different bandwidths and processing constraints. The "no" answer is evidentially inert regarding the existence of a modality-neutral shape concept because it ignores the directional asymmetry of information flow and the structure of error.

  Consider the Reverse-Molyneux test. Take a subject blind from birth who suddenly gains sight. Show them a complex shape they have never touched—an extruded star, say—and give them a moment to inspect it visually. Then blindfold them and ask them to pick it out by touch from a pile. The strong interpretation predicts failure here just as firmly as in the original case. If shape-for-the-eye and shape-for-the-hand are arbitrary, distinct codes with no shared referent, having the visual code should not help you crack the haptic lock. But conceptually, the subject should pass this test, and pass it quickly. Why? Because vision presents the geometric whole simultaneously, whereas touch constructs it sequentially. In the original Molyneux problem, the subject holds a haptic sequence (a history of movements) and is asked to match it to a visual instant. That is a hard computational lift. In the reverse case, the subject holds a visual instant (a complete geometric model) and is asked to verify it via touch. The visual model serves as a map for the haptic exploration. The asymmetry isn't cheating; it's a feature of the senses. Vision delivers the "shape" as a completed state; touch delivers it as a process. If the underlying shape concept were truly modality-specific, direction wouldn't matter—translation should fail both ways. The fact that vision-to-touch transfer is conceptually easier than touch-to-vision suggests the bottleneck is the haptic system's inability to instantly render a whole from parts, not the absence of a shared geometric object.

  However, even if the reverse test passes, a stubborn opponent can claim this only shows a fast learned translation, not a genuinely shared representation. This is where your pet idea becomes the decisive wedge. We must distinguish between learning an arbitrary association (like pairing a sound with an object) and recognizing a shared property. If the connection were merely a learned translation code, errors should be unstructured and random during the learning phase. You would confuse the cube with the globe as often as with the star, because you are just guessing which visual signal maps to which haptic signal. But if there is a real shared shape notion, errors must be shape-similarity-structured from the very first attempt, even if the identification fails.

  The subject might say "no" to the original Molyneux question, but the *reason* for the no matters. If they say, "I cannot be sure, but the visual sphere looks like it belongs with the tactile globe because neither has corners," that is structured error. It reveals that even without successful identification, the geometric properties (curvature, angularity) are already aligned in their cognition. A purely learned translation would not yield intuition about similarity; it would yield blank incomprehension until the association was forged over many trials. If the subject confuses an oblate spheroid with a sphere but never with a cube on their first try, they are operating within a shared geometric space. The "no" answer in the standard test only tells us that the access route is blocked initially; it does not tell us that the destination is different.

  Therefore, the standard "no" is inert. It tells us nothing about whether shape is unified because it doesn't probe the structure of the failure. The reverse test shows that vision can anchor haptic exploration, undermining the claim of total modality isolation. But the killer argument is the structure of uncertainty. If the newly sighted man struggles but his confusion respects geometric similarity, he already possesses the shared concept. He just lacks the confidence to label it. The strong interpretation demands that without prior linking, there be no geometric intuition at all. Since we can conceive of a failure that respects geometry, the "no" answer does not prove the strong case. It merely proves that seeing is not touching, not that shape is not shape.
