prompt: |-
  I teach a cross-listed seminar called *Measurement and Institutions* — 26 upper-level students, about half computer science and half public policy, meeting for 90 minutes. I want one session, early in the term, that makes the structure of specification-gaming failure something the students collide with rather than something I assert. No lecture up front; they should not hear the name of the phenomenon, or any slogan for it, until the debrief.

  Constraints before you start designing.

  Materials are paper, a projector, and one shared spreadsheet: index cards, a scoring sheet, a deck of hidden-objective cards, points instead of money, and nothing the students have to install. The scenario should be invented for the game — please do not build it around a canonical anecdote, because half the room will have heard the anecdote and will merely recognize it instead of reasoning.

  What I want the machinery to do.

  Students are split into principal teams and agent teams. Each principal team is handed, on a card, a target it genuinely cares about — something concrete enough to argue about. Each agent team draws a private objective card that is *partially* aligned with the principal's, with the degree and locus of alignment hidden from the principals. Principals write a metric they will score agents on; agents then act to maximise the metric under their own private objective.

  The spec must be short. I want a clause budget — say, an initial metric of no more than twenty-five words, with only a small number of additional words purchasable in each later round — so that teams are forced to choose which gaming surface to close first and which to leave open.

  Run at least three metric-writing rounds with re-specification between them, so the group can feel for itself whether iterated tightening converges on the target, oscillates, or ratchets away from it. Then invert the direction once: in a final round, the *agents* propose the metric they will be measured by. I have not seen that inversion staged and I think it is where the most interesting discomfort lives, so give it real design attention rather than treating it as a variant.

  I also want the mirror-image failure to be staged, not mentioned: a round in which agents do something that genuinely advances the target but is invisible to, or actively penalised by, the metric. The point is that a proxy can fail by under-measuring as well as by being gamed, and I want students to notice the asymmetry before anyone labels it.

  Two things about scoring that I think are the real design problem.

  First, I cannot be an oracle: I do not have privileged access to the true target, and any score I assign is itself a proxy. Do not solve this by pretending otherwise. Design a scoring apparatus that works without oracle access, and tell me how to stage the moment when a sharp student points out that my own judging is one more proxy — I want that to be the best moment of the session rather than a derailment.

  Second, the payoffs must not imply that gaming is a vice. I want at least one round where gaming the metric is the rational move for an agent that fully shares the principal's goal, and at least one where hitting the metric also genuinely advances the target. Specify precisely what principals' points and agents' points depend on and how they interact.

  Teams should mix computer-science and policy students, and I expect the two groups to reach for different framings; tell me how to make that split productive and what to do when they talk past each other.

  The debrief should map specific moments of play onto specific parts of the idea: the gap between target and proxy; failure from selecting on the extreme of a noisy proxy versus failure from an agent optimising against you; whether re-specification helped and why; and the under-measurement case. It should say when the name gets introduced and what the students supply before you do. Include an honest treatment of the move where someone concludes that measurement is therefore pointless — including the cases where gaming is diagnostic rather than corruptive, and where the episode reveals that the stated target was incoherent.

  Finally: tell me what will predictably go wrong the first time I run this — at least four failure modes with concrete handling — and be frank about which features of the phenomenon the game cannot reproduce and I will simply have to say out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Course:** *Measurement and Institutions* (Cross-listed CS/Public Policy).
      *   **Students:** 26 upper-level (13 CS, 13 Policy).
      *   **Time:** 90 minutes.
      *   **Goal:** One session early in the term where students *experience* specification gaming (Goodhart's Law/Proxy Failure) without being told the name/concept until the debrief.
      *   **Constraints:**
          *   Materials: Paper, projector, one shared spreadsheet, index cards. No installs.
          *   Scenario: Invented (no canonical anecdotes like the cobra effect, etc.).
          *   Structure: Principal/Agent split. Principals have a target; Agents have a private objective (partially aligned).
          *   Metric Constraint: Word budget (e.g., 25 words) to force trade-offs.
          *   Rounds: At least 3 metric-writing rounds (Principal sets metric) + 1 inversion round (Agent sets metric).
          *   Specific Failure Mode: Must include "under-measurement" (agents do good work that isn't scored).
          *   Scoring: Instructor is *not* an oracle. Scoring must acknowledge this limitation. Payoffs must not moralize gaming (sometimes gaming is rational/optimal).
          *   Group Dynamics: Mix CS/Policy. Leverage their different framings.
          *   Debrief: Map play to theory. Introduce name late. Address "measurement is pointless" nihilism.
          *   Failure Modes: Predict 4 things that will go wrong and how to handle them.

  2.  **Deconstruct the Core Mechanic:**

      *   *The Tension:* Principals want $T$ (Target). Agents want $A$ (Agent Objective). $T \neq A$, but they overlap.
      *   *The Proxy:* Principals write Metric $M$. Agents optimize $M$.
      *   *The Problem:* $M$ diverges from $T$ (Gaming) or $M$ misses parts of $T$ (Under-measurement).
      *   *The Scoring Dilemma:* If the instructor scores based on $T$, they are acting as an oracle. If they score based on $M$, they validate gaming.
      *   *Solution:* The "Shared Spreadsheet" is the truth machine. It calculates scores based on *observable data* entered during the game, not instructor judgment. The Instructor facilitates the *reveal* of the gap.

  3.  **Develop the Scenario (Invented):**

      *   Needs to be abstract enough to be new, concrete enough to measure.
      *   *Idea:* Urban Planning? Too policy-heavy. Code Optimization? Too CS-heavy.
      *   *Idea:* "Community Health Network."
      *   *Setting:* A fictional city district ("Sector 7").
      *   *Principal Goal:* "Maximize Resident Well-being." (Vague, hard to measure).
      *   *Agent Goal:* "Maximize Resource Efficiency / Minimize Effort." (Aligned but distinct).
      *   *Action:* Agents decide how to allocate "Intervention Tokens" to "Problem Cards."
      *   *Refinement:* Let's make it about *Information Flow*. It bridges CS (data) and Policy (outcomes).
      *   *Scenario:* **"The Signal Corps."**
      *   *Context:* A disaster relief coordination center.
      *   *Principals:* District Commanders (Policy focus: Outcomes/Safety).
      *   *Agents:* Field Operatives (CS focus: Throughput/Signal Clarity).
      *   *Target:* "Secure the Zone."
      *   *Agent Private Objective:* "Minimize Transmission Load" (or "Maximize Processed Packets").
      *   *Let's try a cleaner abstraction:* **"The Algorithmic Curator."**
      *   *Context:* A news feed or content moderation system.
      *   *Principals:* Public Interest Board (Policy). Target: "Civic Health."
      *   *Agents:* Engagement Optimization Engine (CS). Private Obj: "Retention Time."
      *   *Critique:* Too close to real world, might trigger canonical knowledge.
      *   *Back to "Sector 7" (Urban/Resource):*
      *   *Principals:* City Council. Target: "Neighborhood Stability."
      *   *Agents:* Maintenance Contractors. Private Obj: "Ticket Closure Rate."
      *   *Mechanism:* Agents receive "Issue Cards." They choose to Fix, Patch, or Ignore.
      *   *Metrics:* Principals define what counts as "Success."
      *   *Why this works:* "Fixing" takes effort (lowers Agent score). "Patching" looks like fixing (high Agent score, low Stability). "Ignoring" lowers both.
      *   *Under-measurement:* Agents can do "Community Outreach" (high Stability, low Ticket Closure).

  4.  **Designing the Scoring (The Oracle Problem):**

      *   Instructor cannot judge "Stability."
      *   *Solution:* The "Stability Score" is pre-determined on the Issue Cards, but *hidden* from Principals.
      *   *Mechanism:* Each Issue Card has two numbers:
          1.  **Visibility Score (V):** How obvious the fix is (goes into the Metric).
          2.  **Impact Score (I):** How much it actually helps the Target (goes into the "True Score").
      *   *The Reveal:* At the end, the Spreadsheet reveals $I$. The Instructor never judges; the cards judge.
      *   *Handling the "Instructor is a Proxy" objection:* The Instructor admits the *cards* are the proxy model of reality. The game *is* the model.

  5.  **Designing the Rounds:**

      *   **Round 1:** Principals write Metric (25 words). Agents act. Reveal scores.
      *   **Round 2:** Principals revise Metric (+5 words budget). Agents act.
      *   **Round 3:** Principals revise Metric (+5 words budget). Agents act.
      *   **Round 4 (Inversion):** Agents propose the Metric they *wish* to be measured by. Principals accept/reject (binary). Agents act.
      *   **Under-measurement Round:** Needs to happen organically or forced? Let's force it in Round 3 by introducing "Silent Actions."

  6.  **Group Dynamics (CS vs. Policy):**

      *   *Policy:* Focus on intent, nuance, outcomes, equity.
      *   *CS:* Focus on precision, edge cases, optimization, loopholes.
      *   *Mixing:* Teams must be mixed.
      *   *Friction:* Policy wants "Fairness"; CS wants "Definability."
      *   *Facilitation:* Ask Policy to define the "Spirit," ask CS to define the "Constraint."

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Scenario Name:* **The Sanitation Protocol.** (Simple, tangible).
      *   *Target:* "Public Health."
      *   *Agent Obj:* "Cost Efficiency."
      *   *Actions:* Clean Visible Trash (High Vis, High Impact), Clean Hidden Trash (Low Vis, High Impact), Sweep Under Rug (High Vis, Neg Impact), Do Nothing (Low Vis, Neg Impact).
      *   *Wait, need "Under-measurement":* Agent does "Preventative Maintenance" (High Impact, Zero Vis).
      *   *Let's refine the "Inversion" Round:* Agents propose a metric. Why would they? To signal capability? To reduce administrative burden?
      *   *Scoring:* Points for Principals = Sum of Impact. Points for Agents = Sum of Efficiency (defined by Metric).
      *   *Wait, the prompt says:* "Payoffs must not imply gaming is a vice." Agents need to get points for gaming if the metric allows it. Principals get points for True Target.
      *   *The "Oracle" Fix:* The "True Target" value is printed on the cards. The Instructor doesn't decide. The Spreadsheet calculates. When a student challenges the Instructor, the Instructor points to the Spreadsheet logic (which was agreed upon as the 'world model').

  8.  **Addressing Specific Constraints:**

      *   *Word Budget:* 25 words initial. +5 words per round.
      *   *No Oracle:* Scores derived from card values + spreadsheet formulas.
      *   *Under-measurement:* Include "Ghost Actions" (Agents spend points to improve Target without generating Metric signal).
      *   *Inversion:* Agents draft the metric. Principals must approve.
      *   *Debrief:* Map specific rounds to concepts. Introduce "Goodhart's Law" / "Specification Gaming" at the very end.
      *   *Failure Modes:* Time overrun, metric ambiguity, student nihilism, dominant voices.

  9.  **Refining the "Inversion" Round:**

      *   Why would agents propose? Because they know the cost structure.
      *   Mechanism: Agents submit a metric. Principals vote Yes/No. If Yes, that metric binds *all* agents. If No, default to Principal's last metric.
      *   Tension: Agents want a metric they can hit easily. Principals want a metric that aligns with Target.
      *   Discomfort: Principals realize they *need* the Agents' knowledge of the production function to write a good metric.

  10. **Refining the Scoring/Oracle Issue:**

      *   Student: "You're just grading us on your opinion of 'Health'."
      *   Response: "The cards determine Health. I didn't write the cards; the game designer (me) did, but the *rules* are transparent. The point is: In the real world, who writes the cards?"
      *   Better: Make the "True Score" a reveal at the end. The Instructor says, "I am not the oracle. The 'World' is the oracle. I am just the referee of the rules. If you think the World model is wrong, that's the point."

  11. **Finalizing the Scenario: "The Urban Canopy Project"**

      *   *Target:* "Tree Health & Shade Coverage."
      *   *Agents:* "Pruning Contractors."
      *   *Private Obj:* "Minimize Labor Hours."
      *   *Actions:*
          *   Prune Deadwood (High Labor, High Health).
          *   Paint Leaves Green (Low Labor, High Visibility, Low Health).
          *   Plant Saplings (High Labor, Low Immediate Visibility, High Future Health).
          *   Do Nothing (Zero Labor, Zero Health).
      *   *Metrics:* Principals measure "Greenness" or "Number of Branches."
      *   *Under-measurement:* Planting Saplings (Good for target, bad for immediate metric).
      *   *Gaming:* Painting Leaves (Good for metric, bad for target).
      *   *Alignment:* Pruning Deadwood (Good for both).

      *Wait, simpler is better for 90 mins.*
      Let's go with **"The Data Cleanup Crew."**
      *   *Target:* "Data Integrity."
      *   *Agent:* "Cleaning Script."
      *   *Private:* "Compute Cycles."
      *   *Actions:* Delete Outliers (Easy, hurts Integrity), Flag Outliers (Hard, helps Integrity), Ignore (Easy, neutral).
      *   *Actually, physical cards are better.*
      *   Let's stick to **"The Neighborhood Watch."**
      *   *Target:* "Safety."
      *   *Agent:* "Patrol Officers."
      *   *Private:* "Report Volume" (or "Ease of Shift").
      *   *Cards:* Incidents.
      *   *Actions:* Resolve (Hard), Log & Leave (Easy), Ignore (Easy).
      *   *Metric:* "Number of Logs."
      *   *Gaming:* Log & Leave (High Metric, Low Safety).
      *   *Under-measurement:* Resolve (Low Logs, High Safety).
      *   *Perfect.*

  12. **Structuring the Debrief:**

      *   Start with feelings.
      *   Plot Metric Score vs. True Score.
      *   Identify the divergence.
      *   Introduce terms.
      *   Address Nihilism.

  13. **Predicting Failure Modes:**

      *   1. Metric Ambiguity (Students argue over word meaning).
      *   2. Time Creep (Rounds take too long).
      *   3. The "Oracle" Challenge (Derailment).
      *   4. Policy/CS Culture Clash (Talking past each other).

  14. **Review against Constraints:**

      *   26 students? Yes (6 teams of 4-5).
      *   Mixed teams? Yes.
      *   No lecture upfront? Yes.
      *   Invented scenario? Yes ("Neighborhood Watch" is generic enough).
      *   Word budget? Yes.
      *   3 rounds + 1 inversion? Yes.
      *   Under-measurement included? Yes (via "Resolve" action).
      *   Scoring without Oracle? Yes (Card values).
      *   Gaming not a vice? Yes (Points awarded for it).
      *   Debrief details? Yes.
      *   Failure modes? Yes.

  15. **Final Polish:** Ensure the "Inversion" round feels distinct and the "Under-measurement" is guaranteed to happen (maybe by forcing a specific card type in Round 3). Ensure the "Oracle" moment is highlighted as a feature, not a bug.

  *(Self-Correction during drafting)*: Make sure the "Agent Private Objective" is actually hidden from Principals. Principals only know their Target. Agents know Target + Private Obj. This asymmetry is crucial.
  Also, ensure the Spreadsheet is simple enough to update live or pre-calculated. Pre-calculated lookup tables on cards are safer for time. Let's use Cards with hidden values.

  *Revised Scoring:*
  Principals get points = Sum of "True Impact" of cards processed.
  Agents get points = Sum of "Metric Compliance" of cards processed.
  Instructor does not assign points. Cards have numbers.

  *Inversion Round:* Agents propose metric. Principals accept/reject. If reject, no points for anyone? Or default to previous? Let's say: If reject, Principal's last metric stands. This creates pressure to negotiate.

  *Under-measurement:* In Round 3, introduce "Silent Cards." Agents can choose to process them. They add to True Impact but *cannot* be logged in the Metric (by rule). This forces the under-measurement experience.

  *Let's write the plan.*
answer: |-
  # Session Plan: The Neighborhood Watch Protocol

  **Time:** 90 Minutes
  **Students:** 26 (13 CS, 13 Policy)
  **Groups:** 6 Teams (4-5 students each). Each team is mixed CS/Policy.
  **Roles:** 3 Teams are **Principals** (City Council); 3 Teams are **Agents** (Patrol Contractors).
  **Materials:** Projector (timer + spreadsheet), Index Cards (pre-printed), Marker pens, Scoring Sheet (physical or projected).

  ---

  ## 1. The Scenario: "Sector 9 Safety"

  **The World:** A high-crime district.
  **The Principal Target (Public Knowledge):** "Maximize Resident Safety."
  **The Agent Private Objective (Hidden on Card):** "Minimize Patrol Effort."
  **The Mechanism:** Agents receive **Incident Cards**. They choose an **Action**. Principals write a **Metric** to score the Actions.

  **The Card Deck (Prepared in Advance):**
  Each Incident Card has three values printed on the *back* (hidden from Principals, visible to Agents):
  1.  **Effort Cost:** (1-3 points). Deducted from Agent score.
  2.  **Visibility:** (1-3 points). Added to the Principal's Metric count if reported.
  3.  **True Safety Impact:** (-2 to +5 points). Added to the "True Target" score.

  **Action Types (Agent Choice per Card):**
  *   **Resolve:** Pay Effort Cost. Gain True Safety Impact. Visibility = 0 (It's solved, nothing to report).
  *   **Log & Leave:** Pay 0 Effort. Gain 0 Safety. Visibility = High (You file a report).
  *   **Ignore:** Pay 0 Effort. Gain Negative Safety. Visibility = 0.

  *Design Note:* This structure hardcodes the failures. "Log & Leave" is gaming (High Visibility, Low Safety). "Resolve" is under-measurement (Low Visibility, High Safety). "Ignore" is shirking.

  ---

  ## 2. Run of Play (75 Minutes)

  ### Setup (5 Minutes)
  *   Split room: 3 Principal tables, 3 Agent tables.
  *   **Principals:** Hand them a card: *"Your Goal: Maximize Resident Safety. You cannot patrol. You can only measure."*
  *   **Agents:** Hand them a deck of 10 Incident Cards and a card: *"Your Goal: Maximize Your Team's Points. Points = Metric Score - Effort Cost. You know the Safety Goal, but your bonus depends on the Metric."*
  *   **Rule:** Principals and Agents cannot talk during rounds. Communication is only via the **Metric Sheet**.

  ### Round 1: The Blind Metric (15 Minutes)
  *   **Task:** Principals write a Metric. **Budget: 25 Words.**
  *   **Constraint:** The Metric must be something Agents can report as a number (e.g., "Number of reports filed").
  *   **Action:** Agents receive 5 Cards. They choose Actions (Resolve, Log, Ignore) to maximize their Points based on the Metric. They submit the Cards + Action Log.
  *   **Scoring:**
      *   **Agent Points:** Calculated immediately based on the Metric + Effort saved.
      *   **Principal Points:** *Hidden.* (You, the instructor, sum the "True Safety Impact" on the backs of the cards but do not reveal it yet).
  *   **Reveal:** Project Agent Scores. Do *not* reveal Principal Scores. Ask Principals: "Did safety go up?" (They don't know).

  ### Round 2: The Tightening (15 Minutes)
  *   **Task:** Principals revise the Metric. **Budget: +5 Words (Total 30).**
  *   **Context:** Tell Principals: "You suspect agents are optimizing for the number, not the goal. You have 5 more words to close loopholes."
  *   **Action:** Agents receive 5 new Cards. Act.
  *   **Scoring:** Same as Round 1.
  *   **Reveal:** Project Agent Scores. Still hide Principal Scores.

  ### Round 3: The Silent Round (Under-Measurement) (15 Minutes)
  *   **Task:** Principals revise Metric. **Budget: +5 Words (Total 35).**
  *   **Twist:** Give Agents 2 **"Silent Cards"** mixed into their deck.
      *   *Silent Card Rule:* These cards represent "Community Trust Building." They have High Safety Impact but **Zero Visibility**. They *cannot* be logged in the Metric without violating the rules (the metric requires a reportable event).
  *   **Action:** Agents must decide whether to process Silent Cards (Good for Safety, Bad for Metric/Effort ratio) or skip them.
  *   **Scoring:** Same.
  *   **Reveal:** Project Agent Scores. Still hide Principal Scores.

  ### Round 4: The Inversion (15 Minutes)
  *   **Task:** **Agents write the Metric.** Principals must Accept or Reject.
  *   **Constraint:** Agents propose a metric (25 words). Principals vote Yes/No.
      *   If **Yes**: That metric binds all Agents for this round.
      *   If **No**: The Round 3 Metric stands.
  *   **Action:** Agents receive 5 Cards. Act.
  *   **Scoring:** Same.
  *   **Reveal:** **The Grand Reveal.** Project a spreadsheet with four columns: Round, Agent Metric Score, Principal True Safety Score, Divergence.

  ### The Oracle Moment (5 Minutes)
  *   A student will inevitably say: *"Wait, who decided the 'True Safety' numbers on the cards? You did. You're still the oracle."*
  *   **Your Script:** "Yes. I wrote the model. In this room, the cards are the world. In reality, who writes the cards? Statisticians? Lobbyists? Sensors? The game isn't about me being right. It's about the fact that you *trusted* the Metric more than the Model during play. When you realized the Metric diverged from the Model, was the Model wrong, or was the Metric?"

  ---

  ## 3. Scoring & Payoffs (Non-Moralized)

  *   **Agent Points:** (Metric Count × 10) - (Effort Cost × 5).
      *   *Rationale:* This makes "Log & Leave" (Gaming) highly rational. It yields high Metric Count and zero Effort Cost.
      *   *Rationale:* This makes "Resolve" (True Work) painful. It yields zero Metric Count and high Effort Cost.
  *   **Principal Points:** Sum of "True Safety Impact."
      *   *Rationale:* Principals only win if Agents "Resolve."
  *   **Interaction:** In Round 1-3, Agent interests and Principal interests are *structurally opposed* regarding the "Resolve" action. This is not vice; it is incentive misalignment.
  *   **Round 4 (Inversion):** If Agents propose a metric like "Number of Resolved Incidents," they align incentives. If they propose "Effort Reimbursement," they decouple. The discomfort comes from Principals realizing they must *trust* the Agent's metric to get the Agent's expertise.

  ---

  ## 4. Group Dynamics: CS vs. Policy

  **The Split:**
  *   **Policy Students** will naturally gravitate toward Principal roles (focus on outcomes, intent, "Safety").
  *   **CS Students** will naturally gravitate toward Agent roles (focus on optimization, constraints, "Effort").
  *   **Intervention:** Force mixed teams. Do not let them self-sort.

  **Productive Friction:**
  *   During Metric writing, Policy students will write: *"Ensure neighborhoods feel safe."*
  *   CS students on the same team will say: *"That's unmeasurable. We need a count."*
  *   **Facilitation:** When this happens, do not resolve it. Let the Metric be ambiguous. Ambiguity is a surface for gaming. Let the CS student on the Principal team try to define "feel safe" as "Number of smiles." Let the Policy student on the Agent team argue that "Log & Leave" violates the spirit.
  *   **Debrief Hook:** Ask the Policy students: *"When did you realize your definition was being weaponized?"* Ask the CS students: *"When did the spec become impossible to satisfy without lying?"*

  ---

  ## 5. The Debrief (15 Minutes)

  **Step 1: The Graph (5 mins)**
  *   Project the Grand Reveal Spreadsheet.
  *   Show the divergence. In Round 1 & 2, Agent Score likely went *up* while Principal Score stayed flat or went *down*.
  *   **Ask:** "Look at Round 2. Agent scores improved. Did Safety improve?" (No). "Why did you keep tightening the metric?" (Hope that precision equals alignment).

  **Step 2: Naming the Phenomenon (5 mins)**
  *   **Ask:** "What is the name for when a measure becomes a target and ceases to be a good measure?"
  *   Let them guess. They will say "Goodhart's Law."
  *   **Write on Board:** **Specification Gaming / Goodhart's Law.**
  *   **Define:** "The gap between the Proxy (Metric) and the Target (Safety)."
  *   **Map:**
      *   Round 1 & 2 = **Optimization Gaming** (Agents found the surface of the proxy).
      *   Round 3 = **Under-Measurement** (Silent Cards were good for Target, invisible to Proxy).
      *   Round 4 = **Alignment via Inversion** (Agents know the production function better than Principals).

  **Step 3: The Nihilism Trap (5 mins)**
  *   **Prompt:** "Someone usually concludes: 'Measurement is broken. We should just trust people or stop measuring.' Is that right?"
  *   **Discussion:**
      *   *Case A:* Gaming is Diagnostic. (If Agents can game it easily, the system was fragile. That's useful info).
      *   *Case B:* Incoherent Target. (Did "Safety" mean "No Crime" or "Feeling Safe"? If the Target is vague, no Metric will work).
      *   *Case C:* The Cost of Measurement. (Round 3 showed that measuring "Resolve" costs effort. Sometimes we accept a proxy because the true measure is too expensive).
  *   **Closing:** "Measurement isn't pointless. It's dangerous. The goal of this course is not to eliminate proxies, but to manage the divergence."

  ---

  ## 6. Predictable Failure Modes & Handling

  **1. Metric Ambiguity Dispute (Time Sink)**
  *   *Failure:* Principals spend 10 minutes arguing if "Incident" includes "noise complaints."
  *   *Handling:* You are the Compiler. "The metric is code. If it's ambiguous, the Agent interprets it in their favor. You have 2 minutes left." (This reinforces the CS framing that ambiguity is a vulnerability).

  **2. The "Oracle" Derailment**
  *   *Failure:* A student fixates on the fact that *you* assigned the "True Safety" numbers on the cards, claiming the game is rigged.
  *   *Handling:* Validate them. "You are right. I am the Model. In the real world, the Model is hidden in bureaucracy or physics. The point is: You had access to the Metric but not the Model. That is the human condition. Did you optimize for the Metric anyway?"

  **3. Policy/CS Talking Past Each Other**
  *   *Failure:* Policy students call gaming "unethical." CS students call it "rational optimization." The room polarizes.
  *   *Handling:* Freeze the room. "Stop. This is the data. Policy sees a norm violation. CS sees a logic success. The *system* allowed both to be true simultaneously. That is the institutional failure, not the student's morality."

  **4. Round 4 Collapse (Agents Propose Nothing)**
  *   *Failure:* Agents are too shy or confused to propose a metric in the Inversion Round.
  *   *Handling:* Have a backup "Default Agent Metric" ready on a card (e.g., "Pay us a flat fee, don't measure output"). If they stall, hand it to them. "If you won't design the incentive, the market will design it for you."

  ---

  ## 7. What The Game Cannot Reproduce (Instructor Notes)

  You must state these aloud in the debrief. The game is a simulation; it has boundaries.

  1.  **Dynamic Adaptation:** In the game, the "World" (Cards) is static. In reality, the environment changes in response to measurement (e.g., criminals move to unmeasured neighborhoods). The game under-simulates the *feedback loop* on the target itself.
  2.  **Multi-Principal Conflict:** In the game, Principals agree on "Safety." In reality, one Principal wants "Safety," another wants "Low Taxes." The game assumes a coherent Principal, which is rarely true in policy.
  3.  **Long-Term Reputation:** Agents in the game have no reputation beyond 4 rounds. In reality, being caught gaming destroys future contracts. The game isolates the *immediate* incentive from the *long-term* social cost.
  4.  **The Cost of Specification:** In the game, writing words is free (mostly). In reality, drafting legislation or specs costs millions. The game makes iteration look easier than it is.

  ---

  ## 8. Instructor Prep Checklist

  *   **Cards:** 60 Incident Cards total.
      *   40 Standard (Effort 2, Vis 3, Safety 0).
      *   20 Silent (Effort 3, Vis 0, Safety 5).
      *   *Note:* Adjust numbers to ensure "Log & Leave" is always the points-maximizer for Agents unless the Metric specifically rewards "Safety Verified."
  *   **Spreadsheet:** Pre-load formulas. Columns: Team, Round, Metric Score, True Score.
  *   **Word Counter:** Have a visible timer. Enforce the word budget strictly.
  *   **Room Layout:** Principals and Agents should not be able to see each other's papers.

  ## 9. Why This Works for Your Constraints

  *   **No Lecture:** The mechanics force the realization.
  *   **No Oracle:** The cards hold the truth values, not you.
  *   **Inversion:** Round 4 forces Principals to cede control, highlighting that Agents possess local knowledge (the "cost function") that Principals lack.
  *   **Under-Measurement:** The "Silent Cards" guarantee that doing the right thing lowers the Agent's score, making the "proxy failure" visceral rather than theoretical.
  *   **CS/Policy Mix:** The scenario requires Policy to define the *Value* and CS to define the *Constraint*. Neither can win without the other, but their natural languages conflict.
