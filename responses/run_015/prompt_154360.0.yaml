prompt: |-
  I am drafting the final examination for an upper-level seminar on self-locating belief and rational credence. Write one essay question, together with a model answer and a marking scheme, on the Sleeping Beauty problem. The question must not be answerable by merely reciting the standard halfer and thirder exchange; instead, inject a fresh conceptual twist. Specifically, present a variant in which Beauty is told upon waking that her present mental state may be instantiated in more than one environment: if Heads, her Tuesday mental state occurs once; if Tails, her Tuesday state occurs in one environment and her Wednesday state occurs in a second, phenomenologically identical environment that is causally isolated from the first. Ask students whether she should assign different credences to Heads on Tuesday versus Wednesday, and whether this possibility of "branching instantiation" shows that updates for self-locating belief track modal accessibility rather than mere duplication of observers. Do not ask for bibliographies, citations, or reading lists, and do not include verbatim quotations from any specific published text. Write in British English.

  Please structure your response in the following sections, in this order:

  1. The exam question: present the prompt exactly as it would appear on the examination paper, stating that candidates have 75 minutes and should write approximately 1,000–1,200 words. Roughly 300 words.
  2. Model answer: approximately 700 words, demonstrating the conceptual moves a first-class response must make.
  3. Marking scheme: approximately 400 words, allocating 20 marks across five specific must-hit analytical moves. For each move, state the marks available and provide a one-line note on the characteristic mistake that costs those marks.
