  ### 1. The exam question

  **Module: Advanced Topics in Epistemology**
  **Section B: Essay Question**

  **Time Allowed:** 75 minutes
  **Word Limit:** 1,000–1,200 words

  **Question 1**

  Consider a variant of the Sleeping Beauty problem involving 'branching instantiation'. A fair coin is tossed. If Heads, Beauty is awakened only on Tuesday within a single physical environment (Environment A). If Tails, Beauty is awakened on Tuesday in Environment A, and again on Wednesday in a second, phenomenologically identical but causally isolated environment (Environment B). Beauty knows this protocol. Upon awakening, she receives no immediate information regarding the day or the coin outcome, though she retains all knowledge of the experimental design.

  Suppose now that Beauty is additionally informed of the current day upon waking. Compare her rational credence that the coin landed Heads if she is told it is Tuesday against her credence if she is told it is Wednesday. Does the divergence between these values indicate that rational updates for self-locating belief track modal accessibility rather than the mere duplication of observers? In your answer, analyse whether the causal isolation of Environment B alters the weight of the Wednesday awakening compared to standard duplication cases. Argue for a specific position regarding what grounds the shift in credence.

  ***

  ### 2. Model answer

  A first-class response must recognise that this variant decouples observer duplication from environmental continuity. In standard formulations, multiple awakenings occur within the same causal history. Here, the Wednesday awakening exists in a causally isolated branch. This distinction is crucial for evaluating whether credence updates depend on counting observer moments or assessing compatible centered worlds.

  Upon being told it is Tuesday, Beauty eliminates the Wednesday possibility. Her remaining live possibilities are Heads-Tuesday (Environment A) and Tails-Tuesday (Environment A). Since the coin is fair and the Tuesday awakening occurs in both outcomes within the same environment, there is no asymmetry in modal accessibility regarding the coin toss itself at this stage. Consequently, her credence in Heads should be 1/2. The duplication of the Tuesday state across outcomes does not favour one hypothesis over the other, as the mental state is instantiated identically in Environment A regardless of the coin.

  However, upon being told it is Wednesday, the situation changes radically. The protocol stipulates that Heads yields only a Tuesday awakening. Therefore, a Wednesday awakening is incompatible with Heads. Her credence in Heads must drop to 0. This divergence—1/2 on Tuesday versus 0 on Wednesday—demonstrates that self-locating information drastically alters rational credence.

  The critical philosophical question is whether this supports a modal accessibility account over a mere duplication account. A strict duplication view suggests credence is proportional to the number of observer moments. In this variant, there are two Tails moments (Tuesday and Wednesday) and one Heads moment (Tuesday). A thirder might argue the prior credence in Heads should be 1/3. However, the causal isolation of Environment B complicates this. If rationality tracks mere duplication, the isolation is irrelevant; there are still two Tails experiences. Yet, if rationality tracks modal accessibility, what matters is which centered worlds are compatible with her evidence.

  The divergence in conditional credences suggests that updates track accessibility. On Wednesday, the Heads world is inaccessible. On Tuesday, both are accessible. The causal isolation of Environment B ensures that the Wednesday experience is not just a later temporal stage of the same physical system but a distinct instantiation. This supports the view that self-locating belief is grounded in the structure of possible worlds compatible with evidence, rather than a simple census of conscious states. The isolation prevents the Wednesday state from being treated as a mere temporal extension of the Tuesday state, reinforcing that credence updates respond to the elimination of possibilities rather than the counting of bodies. Thus, the variant shows that modal accessibility, defined by the compatibility of centered worlds with evidence, is the primary driver of rational update, rendering the physical duplication secondary to the logical space of possibilities.

  ***

  ### 3. Marking scheme

  **Total Marks: 20**

  **1. Mapping the Centered Possibility Space (4 marks)**
  The candidate must correctly identify the three distinct centered worlds: Heads-Tuesday (Env A), Tails-Tuesday (Env A), and Tails-Wednesday (Env B).
  *Characteristic mistake:* Collapsing the Tuesday states into one option or failing to distinguish the environments, leading to an incorrect possibility space.

  **2. Analysis of Tuesday Credence (4 marks)**
  The candidate must argue that conditional on Tuesday, Heads and Tails are equally accessible, yielding a credence of 1/2 (or defend a alternative view with rigorous justification).
  *Characteristic mistake:* Asserting a 1/3 credence on Tuesday without addressing why the single Tuesday instantiation in Heads balances the Tails Tuesday instantiation.

  **3. Analysis of Wednesday Credence (4 marks)**
  The candidate must recognise that conditional on Wednesday, Heads is logically excluded by the protocol, necessitating a credence of 0.
  *Characteristic mistake:* Suggesting Heads retains non-zero probability on Wednesday or confusing the day index with the coin outcome.

  **4. Distinction Between Duplication and Branching (4 marks)**
  The candidate must explicitly discuss whether the causal isolation of Environment B affects the weight of the Wednesday awakening compared to standard temporal duplication.
  *Characteristic mistake:* Treating the causal isolation as irrelevant without argument, or conflating environmental branching with standard temporal succession.

  **5. Evaluation of Modal Accessibility (4 marks)**
  The candidate must conclude whether the case supports the view that updates track modal accessibility (compatible worlds) rather than mere observer counting.
  *Characteristic mistake:* Failing to draw a conclusion about the underlying mechanism of belief update or contradicting the earlier analysis of conditional credences.
