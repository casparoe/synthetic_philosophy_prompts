  The water had reached the lower shelves, darkening the buckram spines like a rising tide of ink. Arthur stood between the two sealed crates, a coin balanced on his thumb. The water lapped at his shins; Elena gripped the handle of the heavier box, her knuckles white.

  "Heads, the poet," Arthur said, his voice level despite the chill. "Tails, the five."

  Elena didn't look up. "If you flip, you're giving the poet a fifty percent chance of survival. Each of the canonical authors gets ten."

  "Their claims do not sum," Arthur said. "To favor the crate of five is to treat them as a collective. To the one, the loss is total. To any one of the five, the loss is also total. One totality does not outweigh another. Fairness demands a lottery, not a head-count."

  "Books don't have claims, Arthur."

  "If they did," he said, "this would be the only just procedure."

  Elena shifted her grip, the wet cardboard groaning under her hands. "If they did, you'd need six coins. One for each volume. By using one coin for the crate, you're treating the five as a single unit."

  "I'm balancing the options."

  "You're balancing the boxes." She stepped closer, the water rippling around her boots. "You refuse to weigh the summed claims of the authors, but you're letting the cardboard do the summing you forbid."

  Arthur hesitated, the coin still poised. "It's a procedural necessity."

  "No," Elena said, hoisting the heavier crate onto her shoulder. "It's a category error. The water aggregates weight. I suggest you do the same."
