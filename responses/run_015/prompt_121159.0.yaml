answer: |-
  The blame is fundamentally personal and moral, not structural. For Kierkegaard, the press is merely the instrument that amplifies a pre-existing spiritual laziness; it does not create the loss of ownership but rather facilitates the individual's desire to evade it. The structural features of mass media are symptoms of a deeper existential refusal to become a single individual before God.

  The phantom public works through abstraction. When an individual speaks alone, they stand accountable for their words. But when opinions are aggregated through the press, they form a "public"—a monstrous abstraction that is everywhere and nowhere. This entity allows the individual to vanish into the crowd. You can hold a radical opinion without risk because you are merely part of the "public opinion." No one person authored the sentiment, so no one person can be challenged on it. The press provides the technology for this vanishing act, but the moral failure lies in the individual's choice to hide behind the abstraction rather than stand alone.

  This leads directly to leveling, which is not democratic equality but a flattening of qualitative distinctions. True equality involves lifting everyone up to a shared standard of worth or responsibility. Leveling drags everything down to the same plane of insignificance. By treating every topic with the same volume of coverage and the same degree of superficial engagement, the press erases the difference between the ethical and the trivial, the sacred and the gossip. It creates a world where everything is known but nothing is understood. The distinction between good and evil is replaced by the distinction between interesting and boring.

  Regarding your question on causality: epistemic flooding does not mechanically cause the loss of existential ownership. Instead, the desire to avoid ownership seeks out epistemic flooding. Kierkegaard argues that human beings naturally fear the strenuousness of commitment. To truly believe something requires action, risk, and the possibility of being wrong. Consuming information requires nothing. The press offers an infinite supply of knowledge that demands no response. Individuals flock to this flooding not because they are overwhelmed by it, but because it distracts them from the necessity of acting. The flooding is the environment the passionless age creates for itself to ensure that no one ever has to make a decisive move.

  Therefore, the loss of ownership is not an accidental byproduct of too much information; it is the intended function of the phantom public. The structure enables the evasion, but the moral weight rests on the individual who chooses to be a member of the public rather than a self. Leveling is the result of everyone agreeing, implicitly, to treat all things as equally unimportant so that no single thing demands a sacrifice.
