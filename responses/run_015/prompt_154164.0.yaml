      *   *The Circular Dependency:* The user is right. Calling the 17th century a "Scientific Revolution" often implies the 15th/16th was a "Renaissance" of learning, which implies the preceding era was dark/stagnant ("Middle Ages"). If the Middle Ages weren't stagnant, the "Renaissance" is less of a rupture, which dampens the "Scientific Revolution."

