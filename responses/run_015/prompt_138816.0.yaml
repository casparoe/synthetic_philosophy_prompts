answer: |-
  There is no single canonical term in clinical ethics or health law that captures this specific asymmetry in the way you have described it. You will not find this in a glossary of terms alongside "futility" or "surrogate." However, the phenomenon is well-recognized in bioethical jurisprudence, and there is a precise conceptual vocabulary available to describe it.

  For the purposes of your committee's deliberations, the most accurate label for this phenomenon is **"The Asymmetry of Diachronic Agency."**

  In legal doctrine, the underlying mechanism is **"The Non-Delegability of Capacity."**

  Below is the analysis you requested: what the phenomenon is, why the asymmetry exists, how it is delimited from neighboring concepts, and the correct conceptual frame for understanding it.

  ### 1. The Phenomenon: Waiver vs. Delegation
  The asymmetry you observe stems from a category error in how we classify Advance Directives (ADs). Legally and ethically, there are two distinct functions an AD can perform, and your three cases confuse them.

  *   **Function A: The Standing Waiver (Instructional Directive).**
      This is what happens in your first case (and partially the second). The competent earlier self waives a future right (the right to refuse treatment, or the right to demand it). The law permits you to waive rights that you will hold in the future, even if you cannot exercise them then. This is a *negative* power: the power to restrict.
  *   **Function B: The Grant of Authority (Proxy Designation).**
      This is what happens when a patient names a sister. The patient grants *decision-making authority* to a third party. This authority is valid only if the agent possesses legal capacity at the time of the decision.

  **The Asymmetry:** The law allows the earlier self to perform Function A (Waiver) upon the later self, but it does not allow the earlier self to perform Function B (Grant of Authority) *upon the later self*.

  You cannot designate yourself as your own proxy for a time when you are legally incapacitated. Capacity is a **status**, not a **commodity**. You cannot store capacity in a document and dispense it to your future self when the status of incapacity has legally attached. When the sister decides, she is an *agent* with independent standing. When the demented patient "decides," she is a *ward* without legal standing. Your third case attempts to turn the ward into an agent by fiat of the prior self, and the legal system rejects this because it collapses the distinction between *consent* (which requires capacity) and *compliance* (which does not).

  ### 2. Condition vs. Say-So: The Objective Trigger Requirement
  You noted that clauses triggering on *condition* are honored, while clauses triggering on *say-so* are not. This is the **"Objective Trigger Requirement."**

  *   **Condition (Valid):** "If I am in a persistent vegetative state..." This is an objective clinical fact that can be verified by a third party (the committee/clinicians) without needing the patient's testimony.
  *   **Say-So (Invalid):** "If I say I want to live..." This makes the patient's current expression the trigger. But for an expression to function as a medical consent or refusal, it must be *informed consent*. Informed consent requires capacity.

  If the AD says "Do what I say now," it is attempting to bypass the capacity assessment. It asks the clinicians to treat the patient's current utterance as *authoritative consent* rather than *evidence of preference*. The law forbids this because it would allow an incapacitated person to consent to high-risk procedures, which is a safeguard against abuse. The earlier self cannot pre-validate the later self's incapacity-driven utterances as legally binding consent.

  ### 3. Delimitation: Neighboring Concepts
  To ensure your committee does not conflate this with other doctrines, here is how *The Asymmetry of Diachronic Agency* differs from its neighbors:

  *   **Vs. The Ulysses Contract:**
      *   *Similarity:* Both involve binding the future self.
      *   *Difference:* A Ulysses contract (common in psychiatry) is about preventing a future *impulse* that contradicts deep values. It is still a Waiver (Function A). It does not claim to empower the future self to make new decisions. The Asymmetry explains *why* a Ulysses contract can forbid treatment but cannot authorize the future self to demand it.
  *   **Vs. Precedent Autonomy:**
      *   *Similarity:* Both rely on the authority of the earlier self.
      *   *Difference:* Precedent Autonomy is the *justification* for honoring the first case. It is not the name of the *limitation* in the third case. Precedent Autonomy explains why the document binds; The Asymmetry of Diachronic Agency explains why the document cannot unbind the requirement for capacity.
  *   **Vs. Substituted Judgment:**
      *   *Similarity:* Both attempt to determine what the patient would want.
      *   *Difference:* Substituted Judgment is what a *proxy* does (the sister). It reconstructs the patient's will from the outside. Your third case attempts *Self-Substituted Judgment*, which is a legal impossibility. You cannot substitute judgment for yourself; you either have judgment or you do not.
  *   **Vs. Assent:**
      *   *Similarity:* We do listen to the demented patient about the meal or the visitor.
      *   *Difference:* This is **Assent**, not Consent. Assent is ethical best practice for daily living to preserve dignity, but it carries no legal weight for major medical interventions. The AD in Case 3 attempts to elevate Assent to the level of Consent.

  ### 4. The Conceptual Frame: Legal Status, Not Rights or Trust
  You asked whether the frame is rights, authority, or trust.

  *   **It is not primarily about Rights:** If it were only about rights, the patient could waive the right to protection (Case 1) and arguably waive the right to have their current will ignored (Case 3). The blockage isn't that they lack the right to waive; it's that the mechanism requires a specific legal status.
  *   **It is not about Trust:** A trust model suggests we are holding assets for the beneficiary's good. While true in a fiduciary sense, it doesn't explain the asymmetry. A trustee can follow the beneficiary's current instructions if the beneficiary is competent.
  *   **It is about Legal Agency (Status):** This is the correct frame. The medical law distinguishes between **Persons** (who hold rights and exercise agency) and **Patients/Wards** (who hold rights but have agency exercised *for* them).
      *   The Advance Directive is a bridge that allows the *Person* to speak to the *Ward's* care.
      *   It does not allow the *Ward* to regain the status of *Person* for the specific purpose of that decision.
      *   The "One-Way Flow" exists because the law views the transition from Person to Ward as a ratchet. You can pre-load instructions before the ratchet clicks, but you cannot pre-load a mechanism to unclick it.

  ### 5. The Edge Case: "That Isn't Me"
  You asked specifically about the case where the later person says, *"I don't know who wrote that, that isn't me."*

  This is the **"Discontinuity of Personhood"** objection (famously argued by Rebecca Dresser against Ronald Dworkin).
  *   **The Ethical Puzzle:** If the demented woman feels she is a new person, does the old person's document bind the new person?
  *   **The Legal Resolution:** The law presumes **Continuity of Identity** for the sake of property and bodily integrity. It treats the demented woman as the *same legal entity* as the signer.
  *   **Why the Asymmetry Holds Here:** Even if we accept her claim that "I am not her," she still lacks *capacity*. If she is a "new person," she is a new person *without capacity*. Therefore, she still cannot consent. If she is the "same person," she is bound by her prior waiver.
  *   **The Trap:** The only way her "say-so" becomes binding is if she regains capacity. The document cannot bridge the gap of incapacity, regardless of whether the identity is continuous. The "I am not me" claim is ethically potent for weighing *interests* (Case 2), but it does not restore *authority* (Case 3).

  ### Summary for Committee Use
  When this shape of case arises, you can classify it using the following distinctions:

  1.  **Term:** **The Asymmetry of Diachronic Agency.**
  2.  **Definition:** The legal and ethical principle that a competent self may restrict the medical treatment of an incapacitated future self (Waiver), but may not delegate decision-making authority to that incapacitated future self (Delegation).
  3.  **The Test:** Does the directive ask us to verify a **clinical condition** (Valid) or to verify a **current will** (Invalid)?
  4.  **The Rationale:** Capacity is a threshold status required for consent. It cannot be pre-granted. A patient without capacity can *assent* to daily care, but cannot *consent* to medical intervention, even if their prior self said they could.
  5.  **The Distinction:** This is not a failure of *Precedent Autonomy* (which justifies the waiver); it is a requirement of *Contemporaneous Capacity* (which blocks the delegation).

  This framing allows you to honor the first case (Waiver of Right), navigate the second (Waiver limited by Futility), and reject the third (Attempted Grant of Capacity) without contradicting yourselves or relying on the insufficient explanation that "she cannot speak." She can speak; she just cannot *authorize*.
