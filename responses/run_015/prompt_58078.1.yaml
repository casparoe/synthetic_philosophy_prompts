answer: |-
  Here is a 15-minute practice exam question designed specifically for your needs. It uses your Esports data, focuses on the mechanics of Simpson's Paradox, and includes a marking scheme that penalizes vague answers while rewarding the specific statistical reasoning you need to learn.

  ***

  # PRACTICE MIDTERM QUESTION (15 Minutes)
  **Topic:** Simpson's Paradox & Aggregated Data
  **Total Marks:** 10

  **Scenario:**
  Two Esports teams, the **Falcons** and the **Owls**, compete in a tournament featuring two map types: **Easy** and **Hard**. The table below shows their win/loss records.

  | Team | Easy Map Wins / Total | Hard Map Wins / Total | **Overall Wins / Total** |
  | :--- | :---: | :---: | :---: |
  | **Falcons** | 9 / 10 | 27 / 90 | **36 / 100** |
  | **Owls** | 80 / 90 | 2 / 10 | **82 / 100** |

  **Questions:**

  1.  **(3 Marks)** Calculate the win percentage for each team on the Easy Map and the Hard Map. Based on these percentages, which team performed better on each specific map type?
  2.  **(2 Marks)** Calculate the overall win percentage for each team. Which team has the better overall record?
  3.  **(5 Marks)** A fan claims, *"The stats are lying because the Falcons won more often on both map types, but the Owls won the overall trophy. You can't trust averages."*
      *   Explain statistically why this phenomenon occurred.
      *   Identify the specific factor (lurking variable) that caused the reversal.
      *   **Note:** Simply stating "statistics are misleading" will receive **zero marks**. You must explain the mathematical mechanism.

  ***

  # MODEL ANSWER

  **1. Map-Specific Performance (3 Marks)**
  *   **Easy Map:**
      *   Falcons: $9 \div 10 = 90\%$
      *   Owls: $80 \div 90 = 88.9\%$
      *   **Winner:** Falcons (Higher %)
  *   **Hard Map:**
      *   Falcons: $27 \div 90 = 30\%$
      *   Owls: $2 \div 10 = 20\%$
      *   **Winner:** Falcons (Higher %)
  *   *Conclusion:* The Falcons had a higher win rate on **both** individual map types.

  **2. Overall Performance (2 Marks)**
  *   **Falcons Overall:** $36 \div 100 = 36\%$
  *   **Owls Overall:** $82 \div 100 = 82\%$
  *   *Conclusion:* The Owls have the better **overall** record.

  **3. Explanation of Paradox (5 Marks)**
  This is an example of **Simpson's Paradox**. The reversal happens because the **sample sizes (number of games played) are heavily weighted** differently for each team.
  *   **The Lurking Variable:** Map Difficulty.
  *   **The Mechanism:** The Owls played mostly **Easy** maps (90 out of 100 games), where win rates are naturally higher for everyone. The Falcons played mostly **Hard** maps (90 out of 100 games), where win rates are naturally lower.
  *   **Why "Stats Lie" is wrong:** The stats are not lying; the overall average is a **weighted average**. Because the Owls' games were weighted toward the easier map, their overall percentage is pulled up. The Falcons' overall percentage is pulled down because their games were weighted toward the harder map. To compare skill fairly, we must look at the stratified data (Map Type), not the aggregate.

  ***

  # MARKING SCHEME (Out of 10)

  ### Part 1: Subgroup Calculations (3 Marks)
  *   **1 Mark:** Correctly calculates Falcons Easy % (90%) AND Owls Easy % (~88.9%).
  *   **1 Mark:** Correctly calculates Falcons Hard % (30%) AND Owls Hard % (20%).
  *   **1 Mark:** Correctly identifies that **Falcons** won both subgroups.
      *   *Deduction:* -0.5 if percentages are shown but the winner is not explicitly stated.

  ### Part 2: Aggregate Calculations (2 Marks)
  *   **1 Mark:** Correctly calculates Overall Falcons % (36%) AND Overall Owls % (82%).
  *   **1 Mark:** Correctly identifies that **Owls** won the overall aggregate.

  ### Part 3: Statistical Explanation (5 Marks)
  *This is where most students lose marks. Read carefully.*

  *   **1 Mark (The Name):** Identifies this as **Simpson's Paradox** (or Reversal Paradox).
  *   **2 Marks (The Weighting/Imbalance):** Explicitly mentions that the **number of games played (sample size)** was different for each map.
      *   *Key phrase to look for:* "Unequal group sizes," "Weighted average," or "Owls played mostly Easy, Falcons played mostly Hard."
      *   *Major Mistake:* If the student says "The Owls have a higher base rate," give **0 marks** for this section. This is not a Base Rate Fallacy; it is a confounding variable issue.
  *   **2 Marks (The Confounding Variable):** Identifies **Map Difficulty** as the lurking variable that influences the win rate regardless of the team.
      *   *Explanation:* Must explain that Easy maps inflate the overall score for whoever plays more of them.
  *   **0 Marks (The "Stats Lie" Trap):** If the answer relies on phrases like "statistics are tricky," "numbers can be manipulated," or "the average is wrong" without explaining the **weighting**, award **0 marks** for this entire section. The math is correct; the interpretation was naive.

  ***

  # STUDENT FEEDBACK & COMMON MISTAKES

  ### Why "Stats Lie" Gets Zero
  In university statistics, saying "stats lie" is considered a non-answer. The math ($36\%$ vs $82\%$) is objectively true. The error is in **interpretation**, not calculation.
  *   **Wrong:** "The overall average is misleading." (Vague)
  *   **Right:** "The overall average is a **weighted average** that ignores the distribution of the lurking variable." (Precise)

  ### Simpson's Paradox vs. Base Rate Fallacy
  You mentioned confusing these two. Here is how to tell them apart on the exam:
  *   **Base Rate Fallacy:** Usually involves **Probability/Bayes Theorem**. It happens when you ignore the *prevalence* of a condition in the population (e.g., ignoring that a disease is rare when interpreting a positive test result).
  *   **Simpson's Paradox:** Involves **Aggregated Data vs. Stratified Data**. It happens when you combine groups that have **unequal sizes** and different underlying rates.
  *   **In this question:** If you write "The Owls have a better base rate," you will lose marks. The correct terminology is that the Owls have a higher **aggregate rate due to favorable weighting**.

  ### How to Secure Full Marks
  1.  **Show your work:** Never just write "90%". Write "$9/10 = 90\%$".
  2.  **Use the word "Weighted":** This signals to the marker you understand *why* the total changed.
  3.  **Identify the Lurking Variable:** Explicitly name "Map Difficulty" as the third variable affecting the outcome.
  4.  **Avoid Moralizing:** Don't say the data is "unfair." Say the data is "confounded."
