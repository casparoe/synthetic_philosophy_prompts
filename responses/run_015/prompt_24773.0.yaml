answer: |-
  The practice of forecasting tournaments underpinned by proper scoring rules and the Dutch book argument rests on a specific, hybrid philosophical architecture. It is a pragmatic vindication of epistemic norms, attempting to turn the avoidance of financial loss into a metric of truth-tracking. Below is a reconstruction of the implicit theory, an analysis of its three core tensions, and an examination of how the practice would shift under alternative foundations.

  ### I. Reconstruction of the Implicit Theory

  The practice presupposes a framework best described as **Instrumentalist Probabilism with Veritistic Aims**.

  1.  **Probabilism:** Beliefs are not binary states (belief/disbelief) but continuous degrees of confidence ($p \in [0,1]$) that ought to obey the axioms of probability.
  2.  **Decision-Theoretic Epistemology:** Rational belief is defined by the decisions it licenses. A belief state is rational if it maximizes expected utility. In tournaments, "utility" is the score; in the Dutch book argument, "utility" is money.
  3.  **The Identity Thesis:** The practice implicitly treats *epistemic utility* (accuracy) and *pragmatic utility* (score/rank) as isomorphic. It assumes that optimizing for the score (avoiding the "loss" of points) is functionally identical to optimizing for truth.

  This theory distinguishes between **strict presuppositions** (mathematical necessities for the scoring to function) and **interpretive fits** (philosophical claims added to make the score meaningful).
  *   **Strict Presupposition:** Forecasters are expected utility maximizers regarding the tournament score.
  *   **Interpretive Fit:** The tournament score is a valid proxy for epistemic virtue (calibration and resolution).
  *   **Underdetermination:** The mathematics of proper scoring rules is compatible with Subjective Bayesianism, Objective Bayesianism, and even Frequentism (if probabilities are interpreted as long-run frequencies of similar events). The practice does not strictly dictate *what* the probability represents, only how it must be reported to maximize reward.

  ### II. Analysis of the Three Core Tensions

  #### 1. The Currency of Belief: Degrees vs. Binary Judgments
  **Does the practice presuppose degrees of belief?**
  Yes, strictly. By utilizing proper scoring rules (Brier, Log), the practice presupposes **Probabilism**. It rules out the rival picture of **Classical Assertion** (or Binary Dogmatism), where a forecaster commits only to "Will Happen" or "Will Not Happen."

  *   **What is ruled out:** This commitment quietly excludes **Falsificationism** in its strict Popperian sense. A falsificationist makes bold, binary predictions to risk refutation. A probabilistic forecaster hedges. The tournament structure implies that uncertainty is a feature of the world (or our access to it) that must be quantified, not eliminated.
  *   **The Rival Picture:** The rival is a **Decision-Rule Based Forecasting**, where the output is an action (e.g., "Evacuate" vs. "Stay") based on a threshold. By scoring $p$, the tournament claims that the *state of mind* (the credence) is the object of evaluation, not the *decision* derived from it. It presupposes that epistemic value exists independently of practical action.

  #### 2. The Dutch Book Transfer: Pragmatic to Epistemic
  **Does the practice presuppose the Dutch Book argument legitimizes epistemic norms?**
  It relies on the *structure* of the Dutch Book argument (DBA) but requires a significant normative leap to apply it to tournaments.

  *   **The Transfer Mechanism:** The classical DBA moves from "Do not accept a sure financial loss" (Pragmatic) to "Do not hold incoherent credences" (Epistemic). In a tournament, the "loss" is points or reputation. For the DBA to hold, the practice presupposes that **reputation/points function as a surrogate currency** within the forecaster's utility function.
  *   **What is doing the work:** The work is done by the **Incentive Compatibility** of the Proper Scoring Rule. The rule ensures that *if* the forecaster wants to maximize score, she *must* report her true credence.
  *   **The Gap:** The DBA guarantees **honesty** (reporting true $p$), not **accuracy** (having a correct $p$). A forecaster can be Dutch-book-proof (coherent) and honest, yet consistently wrong. The practice presupposes that by removing the incentive to lie (via PSR), the remaining variance in scores reflects genuine epistemic skill rather than strategic gaming. It treats the "hypothetical loss" of a bad score as normatively binding on the intellect, assuming that **epistemic rationality is a species of instrumental rationality** where truth is the desired commodity.

  #### 3. The Coherence-Accuracy Tension
  **How does the practice bridge coherence (consistency) and accuracy (matching the world)?**
  This is the most critical tension. As noted, a forecaster predicting 0.5 for everything is coherent (cannot be Dutch-booked) but may have a poor Brier score if outcomes are extreme, or a mediocre one if outcomes are mixed. Coherence is a floor; accuracy is the ceiling.

  *   **The Bridge:** The practice presupposes **Epistemic Utility Theory** (associated with philosophers like James Joyce and Richard Pettigrew). This theory posits that the "utility" being maximized in a proper scoring rule is **veritistic value** (closeness to the truth).
  *   **The Presupposition:** To bridge the gap, the practice must presuppose that **coherence is a necessary condition for accuracy.** While coherence does not guarantee accuracy, incoherence guarantees vulnerability to error (via the Dutch Book). Therefore, the tournament treats coherence as the *hygiene factor* of rationality and the score as the *performance metric*.
  *   **The Idealized Bookmaker:** The practice presupposes that **Nature acts as the Bookmaker.** In a financial Dutch Book, a human adversary exploits your incoherence. In a tournament, "Reality" settles the bet. The normative authority shifts from a clever human bookie to the **Structure of the World.** The assumption is that the world has a determinate structure (outcomes are 0 or 1) that punishes inaccuracy, and the scoring rule is the mechanism that translates that punishment into a normative signal.

  ### III. Underdetermination and Alternative Foundations

  The current practice is philosophically underdetermined. Several theories of probability license the use of Brier scores, but they interpret the "rationality" of the forecaster differently.

  1.  **Subjective Bayesianism:** Probability is degree of belief. The score measures how well the agent's internal state matches external reality.
  2.  **Frequentism:** Probability is long-run frequency. The score measures how well the forecaster knows the reference class properties. (This struggles with unique geopolitical events common in tournaments).
  3.  **Logical Probability:** Probability is a logical relation between evidence and hypothesis. The score measures logical acumen.

  **If the foundation were replaced by a Purely Accuracy-Based Account (Veritism):**
  *   **Current State:** Veritism is already the *goal*, but DBA is the *justification*.
  *   **Required Change:** If the foundation were *purely* accuracy-based (e.g., Joyce's non-pragmatic vindication of probabilism), the **Dutch Book argument would be discarded as irrelevant.** The norm would not be "avoid sure loss" but "minimize distance from truth."
  *   **Practice Impact:** The focus would shift from *incentive compatibility* (making sure you don't lie) to *calibration and resolution metrics*. We would care less about whether the forecaster was "honest" and more about whether their probability assignments were *correct*. We might see more emphasis on **post-hoc calibration adjustments** rather than pre-commitment scoring. The "betting" metaphor would be dropped in favor of an "estimation" metaphor.

  **If the foundation were replaced by a Purely Evidentialist Account:**
  *   **Current State:** Evidentialism says belief should be proportioned to evidence. Tournaments currently score *outcomes* ($o$), not *evidence quality*. A forecaster can be evidentially rational (perfect processing of available data) but get a bad score due to bad luck (uncalibrated by noise).
  *   **Required Change:** The practice would have to stop scoring **outcomes** and start scoring **processes**.
  *   **Practice Impact:**
      1.  **Evidence Auditing:** Forecasters would submit the evidence dossier supporting their $p$. Scoring would evaluate the *weight* and *relevance* of the evidence, not just the binary outcome.
      2.  **Luck Adjustment:** Scores would be normalized by the inherent unpredictability of the event (entropy). Predicting a coin flip correctly would yield less "epistemic credit" than predicting a complex causal chain, even if the Brier score is the same.
      3.  **Normative Shift:** A forecaster could be declared "Epistemically Virtuous" despite a terrible tournament rank, provided their credences perfectly matched their evidence. This breaks the tournament's core function of ranking by predictive success, turning it into a peer review of reasoning.

  ### Summary
  Forecasting tournaments presuppose that **epistemic norms can be enforced by pragmatic incentives.** They rely on the Dutch Book argument to establish coherence as a baseline of rationality and Proper Scoring Rules to align self-interest with truth-telling. However, they quietly rely on **Epistemic Utility Theory** to bridge the gap between internal consistency and external accuracy.

  If the foundation shifted to **pure accuracy**, the betting metaphor would vanish, leaving a direct measurement of truth-distance. If it shifted to **pure evidentialism**, the outcome ($o$) would cease to be the sole judge, and the quality of the reasoning process would become the primary metric, potentially decoupling "rationality" from "winning." The current practice survives by conflating these views: it treats the score as both a pragmatic reward and an epistemic badge, assuming that in the long run, the market of ideas (like the market of money) punishes incoherence and rewards truth.
