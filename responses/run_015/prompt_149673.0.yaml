      *   *Tone Check:* Ensure it doesn't sound like I'm solving the problem, but rather structuring the disagreement.

  9.  **Final Polish:** Check formatting (Markdown tables, clear headings). Ensure the distinction between verbal and substantive is clear in the final section. (Proceed to generate output).

