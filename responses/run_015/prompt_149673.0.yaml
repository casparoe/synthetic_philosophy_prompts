  # ADVERSARIAL COLLABORATION STATEMENT: GOVERNANCE OF GENE-DRIVE INTERVENTIONS
  **Working Group on Risky Interventions | Case Study: Malaria-Suppression Gene Drives**
  **Date:** October 24, 2023
  **Signatories:** [Member A], [Member B]

  ## I. JOINT STATEMENT OF AGREED CLAIMS

  The undersigned acknowledge the following premises as established for the purpose of this inquiry. Disagreement remains on the weight and implication of these claims, but not on their validity.

  1.  **Decision Structure & Capacity:** Approximately twelve laboratories worldwide currently possess the technical capacity to synthesize and release a self-spreading gene-drive construct targeting *Anopheles* mosquitoes without external assistance. A release in an open environment is effectively impossible to recall via physical retrieval.
  2.  **The Selection Effect:** The "Unilateralist's Curse" is a valid structural concern: in a population of potential actors, the first to act is statistically more likely to be an outlier in risk assessment. However, the magnitude of this bias depends on the independence of errors among actors and the reversibility of the act.
  3.  **Correlated Error:** Error independence is imperfect. Shared training, funding sources, and publication incentives create epistemic correlations between labs. Conversely, localized ecological data creates epistemic divergence between field teams and distant review panels. Both correlation and divergence exist simultaneously.
  4.  **Technical Mitigation:** "Split-drive" or daisy-chain designs (graded, self-exhausting systems) alter the risk profile by introducing temporal and spatial limits. These designs reduce, but do not necessarily eliminate, the irreversibility constraint that drives the selection effect.
  5.  **Moral Trade-off:** There is a genuine moral conflict between the expected mortality from delay (continued malaria transmission) and the expected ecological damage from action (unintended ecosystem collapse). Neither cost is lexically prior to the other *a priori*; both must be weighed empirically.
  6.  **Baseline Comparison:** The relevant policy comparison is not strictly "Act Now vs. Never Act." It is "Act Now on Local Authority" vs. "Act Later on Collective Authority." The magnitude of the "Later" delay and the probability of "Never" resulting from collective processes are empirical variables, not fixed constants.

  ***

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  | # | Neutral Formulation of Dispute | Position A (Local Authority) | Position B (Collective Authority) | Crux & Admissible Evidence | Predictions (Pre-registered) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Epistemic Weight:** Does local field knowledge outweigh the risk of correlated optimism in the absence of a review panel? | Local ecological knowledge breaks the correlation of error. A field team's private judgment is superior to a distant panel's aggregated judgment because the panel lacks high-fidelity local data. | Shared training and incentives create correlated optimism that local data cannot correct. A committee is a better filter for systemic blind spots, even if it lacks local granularity. | **Crux:** The direction of error bias. Is the dominant risk *over-caution* (missed malaria savings) or *over-optimism* (ecological blowback)?<br>**Test:** Retrospective audit of 20 past ecological interventions where local teams recommended action against panel advice. | **A:** In >60% of cases, local teams were correct to override caution.<br>**B:** In >60% of cases, panels were correct to enforce caution. |
  | **2** | **Reversibility Threshold:** Do split-drive designs sufficiently dissolve the "all-or-nothing" structure to permit unilateral action? | Graded releases make the intervention "reversible enough." If the drive dilutes out within 5 generations, the selection effect is mitigated, allowing decentralized testing. | "Reversible" is theoretical. Once the threshold for population suppression is crossed, ecological cascades are irreversible even if the drive disappears. The selection effect remains intact. | **Crux:** Definition of "harm." Is harm limited to the presence of the construct, or does it include the ecological state change?<br>**Test:** Containment trial data from isolated island ecosystems using daisy-chain drives. | **A:** Ecological metrics return to baseline within 2 years of drive extinction.<br>**B:** Ecological metrics show persistent deviation >5 years post-extinction. |
  | **3** | **Cost of Delay:** What is the appropriate baseline for comparing the cost of governance procedures? | The baseline is the status quo (malaria continues). Governance procedures introduce indefinite veto points, making "Later" functionally equivalent to "Never." | The baseline is a governed process. Delay costs are bounded and measurable (infection rates), whereas ecological downside is unbounded. "Later" is distinct from "Never." | **Crux:** The friction cost of multilateralism. Does governance add months or decades?<br>**Test:** Historical timeline analysis of WHO/CBD approval processes for novel vector control tools. | **A:** Median approval time for novel vector tools exceeds 10 years.<br>**B:** Median approval time is under 3 years with emergency provisions. |
  | **4** | **Burden of Proof:** Who must demonstrate safety/urgency? | The burden lies on those who would prevent the intervention to demonstrate that the ecological risk outweighs the certain malaria mortality. | The burden lies on the acting team to demonstrate that the ecological risk is negligible *and* that consensus is impossible to obtain in time. | **Crux:** Default state. Is the default "Open" or "Closed"?<br>**Test:** Survey of existing international biosafety norms (Cartagena Protocol) regarding self-propagating materials. | **A:** Current norms permit emergency derogation for self-propagating materials.<br>**B:** Current norms explicitly forbid release without transboundary consent. |

  ***

  ## III. ANALYSIS OF VERBAL VS. SUBSTANTIVE DISAGREEMENT

  We explicitly flag the following distinctions to prevent talking past one another in future sessions.

  ### 1. Merely Verbal Disagreements
  *   **Definition of "Irreversible":**
      *   *Nature:* Position A defines irreversibility as the *persistence of the genetic construct*. Position B defines it as the *persistence of the ecological state change*.
      *   *Resolution:* This is a semantic boundary dispute. Both sides agree the construct may vanish while the ecological impact remains. We will adopt Position B's definition ("Ecological Irreversibility") for all future risk modeling, as it captures the moral harm concerned by both parties.
  *   **Definition of "Unilateral":**
      *   *Nature:* Position A implies "Unilateral" means "without global consensus." Position B implies "Unilateral" means "without local/regional consent."
      *   *Resolution:* We agree to specify "Unilateral" as "without consent from the sovereign state of release *and* without notification of bordering states." This clarifies that Position A does not advocate ignoring local sovereignty, only global veto points.

  ### 2. Substantive Disagreements
  *   **The Correlation Coefficient of Error:**
      *   *Nature:* This is not verbal. It is an empirical claim about the sociology of science. Position A believes local data decorrelates error; Position B believes institutional incentives correlate it.
      *   *Separation:* This cannot be solved by definition. It requires the retrospective audit specified in Dispute #1. Until that evidence is produced, this remains a fundamental divergence in risk modeling.
  *   **The Friction of Governance:**
      *   *Nature:* Position A believes governance mechanisms act as a *veto* (high friction). Position B believes they act as a *filter* (manageable friction).
      *   *Separation:* This is a factual dispute about institutional performance. It is resolved by the timeline analysis in Dispute #3. If governance takes 10 years, Position A's model of "lethal delay" is validated. If it takes 2 years, Position B's model of "bounded cost" is validated.

  ***

  **Signatures:**

  _________________________ (Position A)

  _________________________ (Position B)
