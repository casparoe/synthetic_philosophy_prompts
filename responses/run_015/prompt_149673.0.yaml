      *   *Dispute 2: The Baseline for Comparison.* Unilateralist: Act Now vs. Never/Indefinite Delay. Conformist: Act Now vs. Act After Process.
      *   *Dispute 3: Reversibility Threshold.* Unilateralist: Split-drives make it reversible enough to act. Conformist: Once released, "reversible" is theoretical, not practical.
      *   *Dispute 4: Burden of Proof.* Unilateralist: Prove it's too dangerous to wait. Conformist: Prove it's safe enough to proceed without consensus.

      *   *Tests/Evidence:* Need concrete things.
          *   For Epistemic Value: Retrospective analysis of past ecological interventions (local vs. panel).
          *   For Baseline: Modeling malaria transmission vs. ecological collapse timelines.
          *   For Reversibility: Containment trial data (small island vs. mainland).

  5.  **Addressing Verbal vs. Substantive:**
      *   *Verbal:* What counts as "irreversible"? If a split-drive dilutes in 5 years, is that irreversible?
      *   *Substantive:* Who holds the veto? What is the actual probability of ecological collapse?
      *   *Flagging:* I need to explicitly state where the disagreement is just about definitions vs. actual world-states.

