      *   **Unilateralist Arguments:** Local knowledge > distant panels; delay costs (lethality of inaction); redesign (graded/reversible drives) mitigates risk.
      *   **Conformist Arguments:** Selection effect holds even without independent errors; correlated optimism (shared incentives) makes individual judgment worse; asymmetry of risk (bounded delay cost vs. unbounded downside); comparison should be "now vs. later with process," not "now vs. never."
      *   **Task:** Write the document they *should* have produced: an Adversarial-Collaboration Statement.
      *   **Structure:**
          1.  Numbered section of agreed claims (Decision Structure, Selection Argument, Correlated Error, Redesign).
          2.  Disagreements Table (Neutral Formulation, Side A Wording, Side B Wording, Crux/Test/Evidence, Predictions).
          3.  Explicit flagging of verbal vs. substantive disagreements.

  2.  **Deconstruct the Arguments & Find Common Ground:**
      *   *Decision Structure:* Both agree the stakes are high, irreversible (mostly), and that roughly a dozen labs *could* do it. Both agree expert opinion is split.
      *   *Selection Effect:* Both agree the "Unilateralist's Curse" (Bostrom et al.) is relevant. The Unilateralist thinks it can be mitigated by local knowledge or redesign. The Conformist thinks it's structural and exacerbated by correlated error. *Agreement:* The selection effect is a real phenomenon that biases towards action in a pool of potential actors, but its magnitude depends on error correlation and reversibility.
      *   *Correlated Error:* Unilateralist thinks local knowledge breaks correlation. Conformist thinks shared training/funding creates correlation. *Agreement:* Error correlation exists but its direction and magnitude are empirical questions.
      *   *Redesign:* Unilateralist thinks split-drives solve the "all-or-nothing" problem. Conformist thinks "partly reversible" isn't enough if the threshold for ecological shift is crossed. *Agreement:* Technical mitigation reduces risk but does not eliminate governance requirements.
      *   *Cost of Delay:* Both agree delay has costs (malaria deaths). Both agree ecological damage has costs. *Agreement:* There is a trade-off between Type I (act wrongly) and Type II (fail to act) errors.

  3.  **Drafting the Agreed Claims (Section 1):**
      *   Need to be precise enough to be meaningful but broad enough to sign.
      *   *Claim 1 (Decision Structure):* Acknowledge the "dozen labs" reality and the irreversibility.
      *   *Claim 2 (Selection Effect):* Acknowledge the logic of the unilateralist's curse without conceding the conclusion. It creates a *presumption* of scrutiny, not necessarily a veto.
      *   *Claim 3 (Correlated Error):* Acknowledge that independence is not perfect. Shared epistemic communities create correlation.
      *   *Claim 4 (Redesign):* Acknowledge that technical safety features (split-drives) change the risk profile but don't automatically resolve governance questions.
      *   *Claim 5 (Delay vs. Damage):* Acknowledge both delay costs (malaria) and action costs (ecology) are morally significant.

  4.  **Drafting the Disagreements Table (Section 2):**
      *   Need to identify the *cruxes*.
