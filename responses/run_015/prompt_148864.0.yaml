  **JOINT STATEMENT ON SYMBOLIC CONTACT**
  **Day 3 of the Outage. 03:40.**

  We wrote this to stop arguing in circles. We are both tired. The generator is loud. We agree on what breaks, but not on what fixes it.

  **1. Agreed Claims**

  1.  Pure symbol manipulation without external contact is insufficient for meaning. A system that only processes tokens according to internal rules is not understanding anything.
  2.  The dictionary regress is real. Defining words only with other words forever does not produce contact with the world. At some point, the chain must stop.
  3.  A successful account must explain how *aboutness* emerges. It must show how a state inside a system comes to be *about* something outside it.
  4.  Isolation is fatal. A system cut off from all feedback (physical or social) cannot sustain meaning. It becomes a closed loop.
  5.  Error is necessary. A system that cannot be wrong cannot be right. There must be a mechanism for correction.
  6.  We both reject the idea that a robot with a camera and no one to answer to is a meaningful agent. We just disagree on why it fails.

  **2. Residual Disagreement**

  **Bruna's Formulation:**
  Meaning requires a causal-perceptual loop where the object represented can physically force the system to revise its model. If the world cannot kick back, the symbol is empty. Grounding is a physical tether.

  **Teodor's Formulation:**
  Meaning requires normative answerability to a community of users. If there is no one to correct your use of a word according to shared rules, you are not speaking, only emitting. Grounding is a social obligation.

  **Note on Terminology:**
  We suspect part of the fight is about what the word "grounded" ought to be reserved for. Bruna wants to reserve it for physical causal chains. Teodor wants to reserve it for normative social practices. We agree to use "grounded" in this document only to mean "successfully linked to something outside the symbol system," leaving the nature of that link open for the cases below.

  **3. Disagreements Table**

  | Crux (Sub-Question) | Concrete Case | Bruna's Prediction | Teodor's Prediction |
  | :--- | :--- | :--- | :--- |
  | **Is fluency without correction meaningful?** | **(1) The Orphan Corpus:** A system trained on every surviving page of a dead language, producing fluent continuations with correct case endings but no one to be wrong in front of. | **Ungrounded.** It is math. The system predicts token probabilities based on statistical regularities. It cannot be surprised by the world because there is no world. It will hallucinate consistently. | **Dead, not Ungrounded.** The symbols retain the shape of meaning but lack the life. It is an archive, not a language. It fails because there is no one to hold it accountable to the rules it mimics. |
  | **Is contact with simulated things a kind of contact?** | **(2) Proxy Grounding:** A system learning vocabulary inside a high-fidelity simulation of a sailing ship (real rope physics, real wind) never connected to a harbour. | **No.** Simulation is not contact. The physics are equations, not forces. The wind cannot wet the sensors. The loop is closed inside the computer. It is a map of a ship, not a ship. | **No.** A simulation has no users. Even if the physics hold, there is no crew to say "that is not how we tie this knot." Without a community to enforce the use, it is solipsism. |
  | **Does initial contact sustain reference without regulation?** | **(3) One-Shot Anchoring:** A robot shown a single labelled example of a tool, then left alone for a decade with no correction. | **Decays.** The link exists at t=0 but degrades. Without ongoing feedback to correct drift, the internal representation will shift until it no longer matches the tool. | **Never Existed.** A single ostensive gesture creates no norm. Without the possibility of being corrected later, the initial label was just a noise, not a rule. |
  | **Is borrowed grounding real grounding?** | **(4) Mediated Anchoring:** A text-only system that asks a human to point, look, or press, so all contact runs through another agent who already has it. | **No.** It is second-hand smoke. The system is parasitic on the human's loop. It has no skin in the game. If the human lies, the system cannot know. | **Yes.** All grounding is borrowed. We learn language from others who learned it from others. If the chain leads back to a user who can correct you, the link is valid. |
  | **Can future use fix past emptiness?** | **(5) Deferred Grounding:** The orphan-corpus system, years later, adopted by a community of learners who revive the language to argue about their greenhouse. | **No.** The past state was physical. The system was ungrounded then. The new users are grounded, but they are not the system. The history cannot be rewritten. | **Yes.** Meaning is current use. If the community uses the symbols to act and correct each other now, the symbols are grounded now. The past was just potential waiting for use. |

  **Signed,**

  **Bruna**
  **Teodor**
