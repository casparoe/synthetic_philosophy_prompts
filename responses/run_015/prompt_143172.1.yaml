answer: |-
  ### Exam Prompt: Comparative Ethics Final

  **Course:** Comparative Ethics Seminar  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 20  

  **Question 1**  
  Consider the following scenario: A mid-level civil servant in a land-use bureaucracy discovers that enforcing a technically legal zoning ordinance will result in the displacement of a long-standing, vulnerable community. The ordinance was passed through proper channels, but its enforcement now causes significant harm. The civil servant has two options: enforce the rule (upholding procedural norms) or refuse enforcement (acting on individual conscience to prevent harm, but violating procedural norms).

  Write an essay defending **either** the rule-following (*Ordnung*) framework **or** the individual-conscience framework as the superior moral guide for this civil servant. 

  Your essay must move beyond cultural description (e.g., "Germans do X, Americans do Y") and provide a philosophical justification for your chosen framework. In your argument, you are required to address the following three elements:
  1.  **Institutional Memory vs. Moral Credentialing:** Analyze the value of consistent enforcement for preserving institutional memory against the risk that conscientious refusal is merely "moral credentialing" that allows the individual to feel righteous without effecting systemic change.
  2.  **Types of Moral Failure:** Explicitly argue which moral failure is worse: a bad outcome achieved through correct procedure, or a good outcome achieved by breaking institutional rules.
  3.  **Systemic Integrity:** Explain how your chosen framework best preserves the integrity of the system over the long term.

  ***

  ### Model Answer (Exemplar)

  **Title:** The Moral Necessity of Procedure: Defending *Ordnung* in Bureaucratic Ethics

  In the scenario presented, the civil servant faces a conflict between substantive justice (protecting the community) and procedural justice (upholding the zoning ordinance). While the impulse to follow individual conscience is emotionally compelling, the rule-following (*Ordnung*) framework offers a more robust moral guide for institutional actors. This essay argues that enforcing the rule is the morally superior choice because it preserves the institutional memory necessary for a functioning state, avoids the trap of moral credentialing, and recognizes that procedural failure is a greater long-term moral risk than isolated bad outcomes.

  The primary strength of the rule-following framework lies in its preservation of institutional memory. Bureaucracies function not merely on the whims of current actors but on accumulated knowledge embedded in procedures. Consistent enforcement ensures that the system remains predictable and that knowledge about how rules interact is not lost when individuals make exceptions based on subjective moral intuitions. If every civil servant acts as a final court of appeal, the system loses its coherence. The alternative—conscientious refusal—carries the risk of "moral credentialing." When an individual breaks a rule to feel righteous, they may alleviate their own conscience without changing the underlying unjust law. This creates a moral hazard where the individual gains social capital for "resistance" while the systemic issue remains unaddressed. True moral action requires changing the law through democratic processes, not bypassing it through administrative discretion.

  Regarding moral failure, a bad outcome reached through correct procedure is preferable to a good outcome reached by breaking rules. A bad outcome within procedure is a localized tragedy that can be identified, debated, and legislatively corrected. It highlights a flaw in the law without destroying the mechanism for fixing laws. Conversely, a good outcome achieved by breaking rules undermines the legitimacy of the institution itself. If rules are optional based on individual conscience, the rule of law collapses into the rule of men. The moral failure of eroding institutional trust is more severe than the failure of a specific policy outcome because the former destroys the capacity to achieve *any* future good outcomes systematically.

  Finally, the integrity of the system depends on the separation of roles. The civil servant's role is to execute the law, not to judge its moral worth in the moment. By adhering to *Ordnung*, the servant maintains the integrity of the office, ensuring that when they do speak against injustice, they do so as a citizen or advocate, not as a rogue administrator. Therefore, while displacing the community is a harm, violating procedural norms to prevent it causes a greater harm to the moral architecture of the state.

  ***

  ### Marking Scheme

  **Total Marks:** 20  
  **Structure:** 5 Criteria × 4 Marks Each

  | Criterion | Description of Performance | Marks | Common Pitfall |
  | :--- | :--- | :--- | :--- |
  | **1. Framework Defense** | Clearly selects and defends one framework (Rule-following OR Conscience) with a coherent thesis. Avoids sitting on the fence. | /4 | **Hedging:** Students try to argue "both are good" without committing to which is superior in this context, resulting in a weak thesis. |
  | **2. Scenario Application** | Directly applies the chosen framework to the zoning/displacement scenario. Explains specifically what the civil servant should do and why. | /4 | **Abstraction:** Students discuss the theories generally but fail to concretely address the zoning ordinance or the displacement issue. |
  | **3. Institutional Memory vs. Credentialing** | Explicitly analyzes the tension between preserving system knowledge (memory) and the risk of self-righteous rule-breaking (credentialing). | /4 | **Dismissal:** Students treat institutional memory as mere "red tape" or ignore the concept of moral credentialing entirely. |
  | **4. Moral Failure Evaluation** | Explicitly compares the two types of failure (Bad Outcome/Correct Procedure vs. Good Outcome/Broken Rules) and argues which is worse. | /4 | **Conflation:** Students argue both are bad without ranking them or explaining *why* one is philosophically worse than the other. |
  | **5. Philosophical Depth** | Moves beyond cultural stereotypes (e.g., "Germans love rules") to provide normative ethical reasoning (duty, integrity, systemic trust). | /4 | **Stereotyping:** Students rely on cultural generalizations ("Americans are individualists") rather than ethical reasoning to justify the framework. |

  ***

  ### Grading Notes for Instructors

  *   **Time Management:** 90 minutes is sufficient for a focused essay. Students who spend too long summarizing the prompt usually fail to hit Criterion 5 (Depth).
  *   **Choice Neutrality:** Full marks are available for defending *either* framework, provided the argument is consistent. A Conscience argument must still address Institutional Memory (e.g., by arguing that memory preserves injustice) to get full marks on Criterion 3.
  *   **The "Bureaucracy" Trap:** Watch for students who confuse "bureaucracy" with "government." The ethical issue is about *administrative discretion*, not legislative power.
  *   **Criterion 3 Specifics:** To get full marks on Institutional Memory/Credentialing, the student must use the terms or concepts explicitly. Mentioning "consistency" is not enough; they must engage with the *epistemic value* of rules (memory) vs. the *psychological benefit* of breaking them (credentialing).
