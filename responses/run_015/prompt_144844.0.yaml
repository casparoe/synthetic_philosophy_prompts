answer: |-
  # Adversarial Collaboration: The Frame Problem

  ## 1. Agreed Claims

  1.  **The Core Definition:** The original frame problem arises when an agent acts in a world where most things stay the same, creating a representational burden to specify non-change without enumerating every static fact.
  2.  **The Triad of Difficulties:** The qualification problem (unlistable preconditions), the ramification problem (unlistable consequences), and the inferential problem (filtering irrelevant deductions) are distinct but interlocking facets of the same underlying difficulty in projecting action into a complex world.
  3.  **Historical Formalisms:** Both camps agree that 60s and 70s non-monotonic formalisms (such as circumscription or default logic) successfully addressed logical consistency but failed to demonstrate computational tractability for open-ended, common-sense domains.
  4.  **Tractability Results:** Both camps agree that existing tractability results show frame-like reasoning is manageable within restricted, carefully engineered ontologies, but do not prove that such reasoning scales to unstructured environments without exponential cost.
  5.  **Bounded Agency:** Both camps agree that any real agent, whether symbolic or subsymbolic, must operate under bounded computation and partial information, necessitating some mechanism for ignoring irrelevant data.
  6.  **Relevance is Non-Trivial:** Both camps agree that determining which facts are relevant to a specific action or goal is computationally non-trivial and cannot be solved by a simple, fixed syntactic rule in all cases.

  ## 2. Disagreements Table

  | ID | Centrality Camp Wording | Dissolution Camp Wording | Substantive or Verbal | Why |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | The frame problem reveals a deep epistemological bound on any system that must fix beliefs isotropically; it is a law-like constraint on intelligence. | The frame problem was an artifact of trying to force situated action into static logic formalisms; it dissolves when representation is dynamic or learned. | Mixed | Partly verbal (definition of "problem"), partly substantive (whether isotropy is unavoidable). |
  | **D2** | No architecture avoids the need for a global relevance check; removing explicit state representation merely hides the cost rather than eliminating it. | Situated and embodied architectures bypass the need for explicit non-change representation by coupling perception directly to action. | Substantive | Disagreement on whether coupling removes the computational burden or just shifts it to perception. |
  | **D3** | Modern learning systems (like LLMs) have not solved the frame problem; they mask it by statistical averaging, failing on novel out-of-distribution relevance shifts. | Modern learning systems solve the practical frame problem by learning relevance heuristics directly from data, rendering logical frame axioms unnecessary. | Mixed | Verbal dispute over what counts as "solving" (logical guarantee vs. behavioral success). |

  **Note on Verbal Disputes:** Rows D1 and D3 contain significant verbal components. For D1, the dispute turns on whether "problem" refers to a logical inconsistency or a computational bottleneck. For D3, it turns on whether "solving" requires worst-case guarantees or acceptable error rates. For these to remain purely verbal, the Centrality camp would have to stop demanding logical guarantees for relevance, and the Dissolution camp would have to stop claiming behavioral success equates to epistemological resolution.

  ## 3. Probe Cases

  ### Case A: The In-Context Ramification Problem
  **Scenario:** A language-model agent is given a long context of retrieved documents, mostly irrelevant, plus one new fact that contradicts something it "knows" (e.g., a company is acquired, a treaty is voided, a library call is deprecated). The agent must work out which of the unenumerated downstream consequences of that fact matter for its next action.

  *   **Centrality Camp Verdict:** This is the frame problem reappearing in a new substrate. The model must access global knowledge to determine which implications of the acquisition are relevant to the task, and attention mechanisms do not guarantee the right facts are retrieved without isotropic search.
  *   **Dissolution Camp Verdict:** This is not the frame problem; it is a context-window and attention optimization problem. The model learns statistical correlations of relevance during training, so no explicit reasoning about non-change is required.
  *   **Is it the same problem?** Centrality says Yes; Dissolution says No.

  ### Case B: The Horizon Frame Problem
  **Scenario:** A deployed agent with a long time horizon has to decide which changes in its environment are worth re-planning over and which it can safely ignore, with no one around to write down the relevance conditions.

  *   **Centrality Camp Verdict:** This is the frame problem extended over time. Without explicit frame axioms or a global check, the agent cannot reliably distinguish between noise and signal over long horizons, leading to catastrophic drift.
  *   **Dissolution Camp Verdict:** This is a standard reinforcement learning problem under partial observability. The agent learns to ignore changes that do not impact reward signals, making explicit frame reasoning redundant.
  *   **Is it the same problem?** Centrality says Yes; Dissolution says No.

  ## 4. The Cruxes

  ### Crux 1: Scaling vs. Isotropy
  *   **Sub-question:** Does increasing model size and context window eliminate relevance errors, or do errors plateau due to isotropic bounds?
  *   **Shared Test:** Measure the rate of "frame errors" (ignoring relevant change or tracking irrelevant change) in a dynamic reasoning benchmark as model size and context length scale by orders of magnitude.
  *   **Centrality Prediction:** Error rates will plateau above a certain complexity threshold because statistical learning cannot approximate isotropic relevance checks perfectly.
  *   **Dissolution Prediction:** Error rates will continue to approach zero as capacity increases, because relevance is learnable from data distribution.
  *   **Which Side Moves:** If errors plateau, Dissolution moves. If errors vanish, Centrality moves.

  ### Crux 2: Explicit vs. Implicit State
  *   **Sub-question:** Do agents with explicit state representations generalize better to novel distractors than end-to-end policies?
  *   **Shared Test:** Compare a symbolic planner with frame axioms against an end-to-end neural policy on a dynamic task where novel, irrelevant distractors are introduced during testing.
  *   **Centrality Prediction:** The symbolic planner will handle novel distractors robustly; the neural policy will fail because it cannot distinguish noise without explicit frame rules.
  *   **Dissolution Prediction:** The neural policy will adapt faster or perform comparably because it learns to ignore distractors based on reward signals rather than predefined rules.
  *   **Which Side Moves:** If neural policies fail catastrophically on novel distractors, Dissolution moves. If they succeed, Centrality moves.

