  hey — I'm putting together an adversarial collaboration as a teaching text for a small grad reading group, and I want the joint statement itself, not your verdict on who's right. Two camps (please just use these labels and don't spend time arguing about which real authors belong in which):

  - the centrality camp: the frame problem is a genuine and deep problem; relevance is the sort of thing that depends on the whole belief system (isotropic, "central", not something you can settle by a local or syntactic rule); and the difficulty tells us something real about any system that has to work out what matters — not just something about the situation-calculus style setups of the late 60s.
  - the dissolution camp: it was an artifact of a particular logicist way of formalizing action and change; once agents are situated, embodied, learned, probabilistic or subsymbolic, the deep-looking problem mostly evaporates, and what's left is ordinary engineering under bounded computation and partial information.

  Deliverable, in this order:

  1. A numbered agreed-claims section. I want claims both could actually sign, including: what the original problem was (someone acts; the world mostly stays the same; how is that represented without enumerating everything that didn't change); how the qualification problem (unlistable preconditions), the ramification problem (unlistable consequences) and the inferential version (how to avoid deriving the irrelevant ones) hang together; whether either camp thinks 60s/70s non-monotonic formalisms solved any of it; and whatever both agree the tractability results actually show rather than are rumoured to show.
  2. A disagreements table. Each row stated twice — once in wording the centrality people would sign for themselves, once in wording the dissolution people would sign for themselves — plus a column saying whether you think that row is a real disagreement or mostly about words. If you think part of this dispute is verbal, say which part and why, and say what either side would have to stop saying for it to stay verbal.
  3. Two cases I made up that neither camp has a stock answer to. I want them used as probes, and I want each camp's answer and each camp's reason:
     - the in-context ramification problem: you give a language-model agent a long context of retrieved documents, mostly irrelevant, plus one new fact that contradicts something it "knows" (a company is acquired, a treaty is voided, a library call is deprecated). The agent now has to work out which of the unenumerated downstream consequences of that fact matter for its next action. The centrality camp will presumably say: there it is again. What does the dissolution camp say — is this the same problem, a different one, or not a problem?
     - the horizon frame problem: a deployed agent with a long time horizon has to decide which changes in its environment are worth re-planning over and which it can safely ignore, with no one around to write down the relevance conditions. Same question: same problem, different problem, or no problem?
  4. The cruxes. For each crux, the sub-question such that settling it would move at least one camp; then, for each crux, a concrete argument, case or observation both camps would accept as bearing on it; then each camp's prediction about it written down in advance, so we can tell afterwards who got surprised. If a crux has no test both would accept, say so and say what would have to be built for there to be one.

  Please don't give me a reading list, page numbers or citations — I know the literature roughly and I don't want anyone guessing at references they can't check.

