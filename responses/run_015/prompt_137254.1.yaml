answer: |-
  To grade a speech code or moderation policy using the Harm Principle, you need a definition of "harm" that doesn't collapse into "anything I dislike" or "anything the state currently punishes." The following ten desiderata are designed to stress-test accounts of harm against the specific pathologies of institutional regulation and digital scale.

  ### The Desiderata

  1.  **The Offense Filter**
      *   **Requirement:** The account must distinguish between psychological disgust and a setback to interests.
      *   **Reasoning:** Anchored to the *disgusting billboard*. If mere revulsion counts as harm, the Harm Principle collapses into Legal Moralism. A viable account must explain why feeling sickened is not the same as being set back in life plans or welfare.

  2.  **The Intervening Will Test**
      *   **Requirement:** The account must specify liability for harms mediated by the voluntary choices of third parties.
      *   **Reasoning:** Anchored to the *bigot employer* case. If speech makes a group unemployable only because employers discriminate, is the speaker the harmer? A robust account must decide if "reactive harm" counts, or if the chain of agency is broken by the bigot's free will.

  3.  **The Aggregation Clause**
      *   **Requirement:** The account must handle diffuse, probabilistic harms where no single victim is identifiable.
      *   **Reasoning:** Anchored to the *vaccination claim*. If speech lowers rates by 0.1% and causes deaths statistically, but no specific death is traceable to the post, is it harm? Individualistic accounts fail here; the theory must accommodate collective risk.

  4.  **The Status Distinction**
      *   **Requirement:** The account must clarify whether social standing counts as harm independent of material welfare.
      *   **Reasoning:** Anchored to the *status harm* case. If speech lowers a group's standing but leaves income/health unchanged, is that harm? This forces a choice between materialist welfare views and expressive/subordination views.

  5.  **The Baseline Independence**
      *   **Requirement:** The account must not define harm solely relative to existing legal protections.
      *   **Reasoning:** Anchored to the *state protection failure*. If the state refuses to protect a group from harassment, a legalistic account says "no harm." A moral account must say "harm exists despite the law." This prevents smuggling the status quo into the definition.

  6.  **The Counterfactual Constraint**
      *   **Requirement:** The account must address whether removing *this* token of speech prevents the harm given saturation.
      *   **Reasoning:** Anchored to the *counterfactual problem*. If silencing one speaker leaves the same idea circulating elsewhere, has harm been prevented? This tests whether the theory requires necessity or just contributory causation.

  7.  **The Paternalism Boundary**
      *   **Requirement:** The account must distinguish between harming others and facilitating self-harm among consenting agents.
      *   **Reasoning:** Anchored to the *pro-anorexia content*. If users seek the content and harm themselves, is the poster harming "others"? The theory must draw a line between influence and coercion to avoid blanket paternalism.

  8.  **The Epistemic Limit**
      *   **Requirement:** The account must not require moderators to adjudicate scientific truth to establish harm.
      *   **Reasoning:** Anchored to the *false vaccination claim*. If harm depends on falsity, moderators become arbiters of truth. A workable account must define harm via risk or process, not just objective falsehood, to remain actionable.

  9.  **The Causal Proximity Rule**
      *   **Requirement:** The account must set a limit on the temporal and logical distance between speech and outcome.
      *   **Reasoning:** Anchored to the *deaths far downstream*. Without a proximity limit, any speech could be blamed for any downstream event. The theory must specify a cutoff for "too remote" to prevent infinite liability.

  10. **The Administrative Constraint**
      *   **Requirement:** The account must be operationalizable by a non-expert within minutes.
      *   **Reasoning:** Anchored to the *moderation rules*. A theory that requires a philosophical tribunal to assess "status harm" or "statistical risk" fails the real-world job. It must be decidable at scale.

  ### Analysis: Non-Negotiables, Preferences, and Tensions

  **Non-Negotiables:**
  For a framework to remain within the **Harm Principle** (rather than Legal Moralism or Paternalism), **The Offense Filter** and **The Paternalism Boundary** are non-negotiable. If you count offense as harm, you have abandoned Mill. If you count consensual self-harm as harm to others, you have abandoned liberty. **The Baseline Independence** is also critical for critical evaluation; if your definition of harm relies on current law, you cannot critique the law.

  **Camp Preferences:**
  **The Status Distinction** and **The Intervening Will Test** are where politics are smuggled in. Liberals and libertarians typically demand that status harm be material and that intervening wills break causation (protecting the speaker). Critical theorists and structuralists argue that status *is* welfare and that systemic reactions (bigotry) are foreseeable consequences (protecting the target). Neither is strictly required by the logic of "harm," but they determine the political valence of the outcome.

  **The Impossible Tension:**
  There is a fundamental incompatibility between **The Aggregation Clause** / **The Counterfactual Constraint** and **The Administrative Constraint**.
  To get aggregated harms right (vax stats) or counterfactuals right (saturation), you need data scientists and complex modeling. To satisfy the Administrative Constraint (a moderator deciding in five minutes), you need bright-line rules. You cannot have a theory that is both theoretically precise about diffuse causality *and* usable by a tired contractor on a shift. You must sacrifice theoretical accuracy for usability, or vice versa.

  **The Theory Killer:**
  The single requirement that knocks out the most candidate accounts is **The Aggregation Clause**.
  Most dominant theories of speech rights are individualistic (rights-based, sovereignty-based, or direct welfare-based). They rely on identifiable victims and direct causation. They cannot accommodate harm that is statistical, diffuse, and collective without collapsing into utilitarianism. This requirement excludes most deontological and rights-based frameworks commonly used in legal theory.

  ### Theory Scorecard

  | Desideratum | Welfare-Setback Views | Rights/Sovereignty Views | Equal-Standing/Subordination Views |
  | :--- | :--- | :--- | :--- |
  | **Offense Filter** | Pass | Pass | Pass |
  | **Intervening Will** | Pass (Contextual) | Pass (Strict) | Fail (Often structural) |
  | **Aggregation Clause** | **Pass** | **Fail** | Pass |
  | **Status Distinction** | Fail (Materialist) | Fail (Individualist) | **Pass** |
  | **Baseline Independence**| Pass | Fail (Legalistic) | Pass |
  | **Admin Constraint** | Fail (Complex) | Pass (Bright-line) | Fail (Contextual) |

  \answer{The Aggregation Clause}
