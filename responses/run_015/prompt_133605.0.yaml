      *   *Changing My Mind:* I need to be careful here. As an AI, I don't have beliefs, but I can simulate a stance based on logical coherence. I need to identify a condition under which the *diagnosis* would change.

  3.  **Drafting the Diagnosis (Structure of the Disagreement):**

      *   It's not just standards of evidence. It's *explanatory targets*.
      *   Proponents (Widespread): Focus on *evolutionary continuity* and *functional role*. If it walks like pain and talks like pain, it's pain. (Pragmatic/Ethical focus).
      *   Restrictionists: Focus on *mechanistic necessity*. Human consciousness correlates with X (cortex, thalamus, etc.). No X, no consciousness. (Mechanistic focus).
