answer: |-
  Good morning. It is a distinct privilege to welcome you to this workshop. Looking around this room, I see a division of labor that is all too rare: half of you are trained to analyze the concepts of mind and value, and the other half are trained to build the systems that interact with the world. We are here to discuss a premise that is as unsettling as it is necessary: that moral status is not a light switch that flips on or off, but a dimmer switch, glowing with varying intensity from the simplest responsive machines up through the complex lives of animals.

  I stand before you as a software engineer. My work involves adaptive sensor networks—systems that listen to their environment, learn from patterns, and modulate their behavior to optimize performance. In a superficial sense, my code "cares" about errors. It seeks to maintain equilibrium. If I were to judge solely by external behavior, one might argue these networks deserve consideration. They avoid damage. They pursue goals. They adapt.

  However, we are gathered here because we intuit that high responsiveness does not automatically entail moral significance. A thermostat responds to temperature changes with perfect reliability, yet we do not worry about hurting its feelings. My sensor networks are vastly more complex than a thermostat, yet they remain ethically negligible. The challenge we face today is explaining why, without resorting to magic, and without drawing an arbitrary line in the sand.

  To help structure this inquiry, I want to introduce a framing concept from my field that I am calling "responsive depth."

  We often mistake complexity for moral weight. We assume that if a system processes enough data, it must matter. I propose instead that moral relevance tracks the layered density with which an entity combines three specific capacities: predictive modeling, affective valence, and integrated self-maintenance.

  Let me unpack that. First, predictive modeling. A simple sensor reacts to the present. A deeper system anticipates the future based on internal states. Second, affective valence. This is crucial. In my networks, an error is a flag in a log. In a biological organism, a negative stimulus is not just data; it is weighted internally as "bad" in a way that motivates avoidance for the sake of the organism itself. Third, integrated self-maintenance. My network maintains its function for the sake of the user. A living entity, even a simple insect, maintains its function for the sake of its own continued existence.

  Under this framing, the distinction between my sensor networks and the insects we study is not a binary threshold of "consciousness." It is a difference in architectural density. My networks may have prediction, but they lack the integrated self-maintenance that grounds valence. An insect, by contrast, possesses a biological architecture where these layers are fused. It occupies a distinct moral zone not because it has crossed into "full" personhood, but because its responsive architecture achieves a density of experience that a machine, no matter how code-heavy, does not.

  I am aware that for the philosophers in the room, this functional description may feel incomplete. You debate the metaphysics of experience; you question whether function ever equals feeling. I do not intend to settle those debates. I offer "responsive depth" not as a final theory of mind, but as a shared vocabulary. It allows us to map the gradient without collapsing the distinction between biological sentience and mechanical feedback. It allows us to say that while moral status fades as we move down the scale, it does not vanish into nothingness until we reach systems that lack this specific layered density.

  This leaves us with a productive tension. For the engineers and policy staff: if we accept that moral status is graded, we cannot rely on simple behavioral tests to determine how we treat new technologies or biological entities. For the philosophers: if you accept that responsiveness comes in degrees, your ethical frameworks must be robust enough to handle gradients, not just categories.

  So, as we begin this half-day, I invite you to resist the urge to resolve this tension prematurely. Do not try to agree on where the line is drawn. Instead, use this time to examine the terrain between the insect and the sensor. Let us explore how "responsive depth" might illuminate the shadows where our ethical intuitions currently falter. If we can leave here today without a consensus, but with a sharper shared understanding of the gradient we are navigating, we will have done our work.

  Thank you.
