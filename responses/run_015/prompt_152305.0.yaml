answer: |-
  Welcome everyone. It's great to see such a mix of faces here—half of you speak fluent constitutional law, half of you speak everything else, and my sister is here too, which honestly keeps me grounded.

  I want to start somewhere personal, before we get into the weeds of theory. Last month, I signed an advance directive. It was pretty clinical until I thought about why I was actually doing it. My dad was in the ICU a while back, scared out of his mind, and he tore his own up right there in the bed. He just wanted the fear to stop. Watching that, I realized I couldn't trust my future self when I'm panicked. I needed my rational self to bind my scared self.

  That's basically a Ulysses contract. tying yourself to the mast so you don't jump when the sirens sing.

  Standing here, looking at this room, I realize that's exactly what we're talking about this week. A constitution is just a polity's advance directive. It's us, in a moment of calm, trying to stop us, in a moment of panic or passion, from doing something we'll regret.

  For the lawyers in the room, you know the standard objection better than I do. The "dead hand" problem. Why should the past rule the future? If democracy means self-government, doesn't binding future generations kill the very legitimacy you need to govern? It's a tension that keeps me up at night: can an institution bind itself without destroying the authority it needs to function?

  But for everyone else, I want to offer a reason why we take that risk. We take it because we know we're fragile. We know that majorities, like patients in ICUs, can get scared. They can be reactive. Precommitment isn't just about stopping bad outcomes; I think it works best when it's not about outcomes at all.

  Here's the thing I've been turning over: maybe the best precommitment doesn't block future choices. Maybe it just forces future actors to deliberate in a specific frame. Instead of saying "you can't do X," you say "you can't do X unless you've gone through this rigorous process of reason-giving." You entrench deliberation rather than results. You make it hard to act impulsively, but you don't make it impossible to act.

  Now, I want to be honest about where this logic gets shaky. There's a point where I think the analogy between personal and constitutional binding breaks down, and it's important we spot it early.

  When I sign an advance directive, I'm binding *my* future self. There's a continuity of identity there. I am the same person tomorrow as I am today. But a polity isn't a single person. The "self" that writes the constitution isn't the same "self" that lives under it fifty years later. The people change. The context changes. So when we talk about the polity binding itself, we're really talking about one group of people binding a totally different group of people. That discontinuity is where the moral weight of the analogy starts to crack. If the "self" is fragmented across time, does the binding hold?

  I don't have the answer, obviously. But holding that tension—between the need to protect ourselves from our own panic, and the risk of silencing the future—is where I hope we spend the next two days.

  Thanks for being here. Let's get into it.
