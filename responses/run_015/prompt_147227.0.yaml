prompt: |-
  I'm on a review board that meets twice a week to check whether non-biological systems—neuromorphic chips, robot swarms, large models—actually realize mental states like working memory or nociception, or if they're just faking outputs. I need a reusable checklist or flowchart-in-words based on functionalism and the idea that mental states are multiply realizable. I can spend about 20 minutes per case and I'm not a professional philosopher, but my call has to survive if the board chair pushes back. The checklist should specify: what functional-role match is required, what subtrate differences are permitted, how to test for organizational invariance vs superficial mimicry, and exactly where I'm stuck with an unavoidable judgment call. It needs to cover hard cases—like silicon ion channels, distributed agents with no central controller, or systems that report pain but lack homeostatic loops. Work through three examples: (1) a swarm of micro-drones that collectively maintain information over time like working memory, (2) a language model that describes nociceptive states without any bodily feedback loops, and (3) a case where the checklist gives an answer I wont like—say, the swarm gets rejected despite seeming right. Please seperate what's pretty settled in the literature (functional roles can be implemented in different physical stuff if causal structure is preserved) from what's genuinely contested—like whether organizational invariance is enough by itself or if there's a hidden physical-implementation requirement, and dont present either camp as the consensus view. Also be clear about what this procedue cant do, and I dont want a bibliography or reading list—just the logic.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Review board member assessing non-biological systems for mental states (working memory, nociception, etc.).
      *   **Frequency/Time:** Meets twice a week, ~20 minutes per case.
      *   **Philosophical Basis:** Functionalism, Multiple Realizability.
      *   **Goal:** A reusable checklist/flowchart-in-words to distinguish genuine mental states from superficial mimicry.
      *   **Requirements:**
          *   Specify functional-role match requirements.
          *   Specify permitted substrate differences.
          *   Test for organizational invariance vs. mimicry.
          *   Identify unavoidable judgment calls.
          *   Cover hard cases (silicon ion channels, distributed agents, pain reports without homeostasis).
          *   Work through three specific examples (Drone Swarm, LLM, Uncomfortable Rejection).
          *   Distinguish settled vs. contested literature (without claiming consensus).
          *   Clarify limitations of the procedure.
          *   No bibliography/reading list.
      *   **Tone:** Professional, rigorous, defensible against chair pushback, clear about uncertainty.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Functionalism:* Mental states are defined by what they *do* (causal roles), not what they are made of.
      *   *Multiple Realizability:* Different physical substrates (carbon, silicon, swarm) can realize the same function.
      *   *Organizational Invariance:* If the causal structure is preserved at the right level of abstraction, the mental state is preserved (Chalmers' principle).
      *   *The Contested Bits:* Is functional organization *sufficient*? (Liberal functionalism vs. Biological Naturalism vs. Embodied Cognition). Is there a "hidden physical requirement" (e.g., specific biology, continuous time, quantum effects)?

  3.  **Drafting the Checklist (The Core Tool):**
      *   Need to structure it for a 20-minute review.
      *   *Step 1: Define the Target State.* What is the functional role of "working memory" or "nociception" in the biological baseline?
      *   *Step 2: Substrate Agnosticism.* Explicitly allow non-biological materials.
      *   *Step 3: Causal Structure Mapping.* Does the system replicate the *relationships* between inputs, internal states, and outputs?
      *   *Step 4: Dynamic Coupling/Homeostasis.* Crucial for things like pain. Is there a goal-directed loop?
      *   *Step 5: The "China Brain"/Invariance Test.* If we mapped the system to a brain, would the logic hold?
      *   *Step 6: The Judgment Call.* Where does the evidence run out?

  4.  **Developing the Three Examples:**
      *   *Case 1: Drone Swarm (Working Memory).* Distributed storage. Is it *really* memory or just data logging? Needs to show active maintenance and vulnerability to interference (like biological WM).
      *   *Case 2: LLM (Nociception).* Reports pain but has no body. Functionalism says "maybe," Embodied Cognition says "no." Needs to highlight the lack of avoidance behavior driven by internal state change.
      *   *Case 3: Uncomfortable Rejection.* A system that *looks* functional but fails the "Organizational Invariance" test due to lack of integration or temporal depth. Or, conversely, a system that passes functionalism but feels wrong (the "Philosophical Zombie" worry). Let's go with the prompt's suggestion: The swarm gets rejected. Why? Maybe the "memory" is just external logging, not an internal state regulating behavior.

  5.  **Addressing Settled vs. Contested:**
      *   *Settled:* Mental states aren't magic; they depend on causal organization. Substrate doesn't matter *in principle*.
      *   *Contested:* What level of organization counts? (Neuron vs. Atom). Is functional role *sufficient* for phenomenal experience (qualia)? Does embodiment matter?

  6.  **Refining the Limitations:**
      *   This checklist assesses *functional attribution*, not *phenomenal consciousness* (what it's like to be the system).
      *   It cannot solve the Hard Problem.
      *   It relies on the human reviewer's intuition about "relevant similarity."

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep the checklist items punchy. Use "Pass/Fail/Flag" markers.
      *   *Critique:* Did I distinguish nociception (detection) from pain (experience)?
      *   *Fix:* Be precise. Nociception is functional; Pain often implies qualia. The prompt asks about "nociception" but mentions "reports pain." I need to clarify that distinction in the LLM example.
      *   *Critique:* The prompt asks to separate settled from contested without presenting either as consensus.
      *   *Fix:* Use a specific section called "Philosophical Boundary Conditions" to explicitly state where the debate lies.
      *   *Critique:* Ensure the "Uncomfortable Rejection" makes sense functionally, not just intuitively.
      *   *Fix:* The swarm might store data, but if the loss of a drone doesn't degrade the *state* in a way analogous to neural degradation, is it the same functional role? Let's make it about *integration* vs. *aggregation*.

  8.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   Flowchart-in-words? Check.
      *   20-minute scope? Check.
      *   Defensible logic? Check.
      *   Three examples included? Check.

  9.  **Final Polish:** Ensure the tone is authoritative yet humble about the philosophical limits. (Proceed to generate output).

  *(Self-Correction Note on Case 3)*: The prompt asks for a case where the checklist gives an answer I won't like—e.g., the swarm gets rejected despite seeming right. I need to make sure the *reason* for rejection is grounded in the checklist's functional criteria, not just a gut feeling, so the board member can defend it. The distinction between *distributed storage* and *working memory* (which implies active manipulation and capacity limits) is a good angle.

  *(Self-Correction on Settled/Contested)*: Be careful not to say "Functionalism is true." Say "Functionalism is the operating framework." Acknowledge Biological Naturalism as a valid dissenting view regarding *sufficiency*.

  *(Final Plan)*:
  1. Introduction (Scope & Limits).
  2. The 20-Minute Functional Attribution Checklist (The Tool).
  3. Philosophical Boundary Conditions (Settled vs. Contested).
  4. Case Studies (Swarm, LLM, Uncomfortable Rejection).
  5. Closing Advice on Defense.

  Let's write it.cw
answer: |-
  # Functional Attribution Review Protocol (FARP)
  **Scope:** Assessment of non-biological systems for candidate mental states (e.g., working memory, nociception).
  **Time Budget:** 20 Minutes per case.
  **Philosophical Operating System:** Liberal Functionalism (Mental states = Causal Roles; Substrate = Irrelevant in principle).
  **Limit:** This protocol assesses *functional attribution* (does it play the role?), not *phenomenal consciousness* (does it feel like something?).

  ---

  ## Part 1: The 20-Minute Checklist (Flowchart-in-Words)

  ### Phase 1: Define the Biological Baseline (5 Minutes)
  *Before looking at the machine, define the human/animal reference class.*
  1.  **Identify the Target State:** (e.g., Working Memory, Nociception).
  2.  **Map the Causal Role:** What causes this state? What does this state cause?
      *   *Inputs:* What stimuli trigger it?
      *   *Internal Dynamics:* How does it persist, decay, or interact with other states?
      *   *Outputs:* What behavior or report does it produce?
  3.  **Identify the "Dealbreakers":** Are there necessary conditions in the biological baseline? (e.g., Nociception usually requires a homeostatic threat to the organism's integrity).

  ### Phase 2: Substrate & Structure Mapping (10 Minutes)
  *Assess the candidate system against the baseline.*
  4.  **Substrate Agnosticism Check:**
      *   [ ] **Pass:** The system uses different materials (silicon, code, swarm) than biology.
      *   [ ] **Fail:** You are rejecting the system *solely* because it isn't carbon-based. (Stop. This violates the multiple realizability premise).
  5.  **Organizational Invariance Test:**
      *   Does the system preserve the *causal relationships* identified in Phase 1?
      *   [ ] **Match:** Input X leads to Internal State Y, which leads to Output Z, with similar timing/weighting.
      *   [ ] **Mismatch:** The system skips the internal state (Stimulus → Output directly) or the internal state has no causal power over the output.
  6.  **Dynamic Coupling Check (Crucial for Homeostatic States):**
      *   If the state is motivational (pain, hunger, fear):
      *   [ ] **Match:** The system has a goal state it actively maintains, and the "pain" signal functions to reduce deviation from that goal.
      *   [ ] **Mismatch:** The system reports "pain" but has no internal variable that is threatened, or the report does not alter future behavior to avoid the threat.

  ### Phase 3: The Judgment Call (5 Minutes)
  *Where the logic runs out.*
  7.  **Integration vs. Aggregation:**
      *   Is the function realized by a unified causal process, or merely the sum of independent parts? (e.g., Is the swarm *one* memory holder, or 100 drones each holding a bit?)
  8.  **The "Look-Ahead" Defense:**
      *   If the Chair asks, "Why is this different from a lookup table?", can you point to a specific causal dependency in the internal structure that a lookup table lacks?
  9.  **Final Verdict:**
      *   **Attribute:** Functional role is sufficiently preserved.
      *   **Withhold:** Functional role is mimicked but causally hollow.
      *   **Deferral:** Insufficient data on internal dynamics.

  ---

  ## Part 2: Philosophical Boundary Conditions
  *Use this section to justify your logic if challenged. Distinguish what is operational vs. what is debated.*

  ### A. Pretty Settled (Operational Consensus)
  *You can rely on these points without inviting metaphysical debate.*
  1.  **Multiple Realizability:** It is accepted in cognitive science that the *same* computation can run on different hardware. A silicon adder and a neuron adder both "add." You are permitted to ignore the material composition.
  2.  **Causal Efficacy:** A mental state must *do* something. If a system claims to be "angry" but that state changes nothing in its processing or output, it is not functionally angry.
  3.  **Level of Abstraction:** We assess function at the level of information processing, not quantum physics. You do not need to verify electron spin to verify memory.

  ### B. Genuinely Contested (The Danger Zones)
  *If the Chair pushes here, acknowledge the debate. Do not claim one side is proven.*
  1.  **Sufficiency of Organization:**
      *   *View A (Liberal Functionalism):* If the causal structure is identical, the mental state *must* exist.
      *   *View B (Biological Naturalism/Embodied Cognition):* Functional structure is necessary but not sufficient. Specific biological dynamics (continuous time, chemical diffusion, embodiment) might be required for *true* mental states.
      *   *Your Stance:* "This board operates on View A for attribution, but acknowledges View B as a reason for caution in borderline cases."
  2.  **The Homunculus Problem:**
      *   Does the system understand the content, or is it just shuffling symbols? (The Chinese Room argument).
      *   *Your Stance:* "We assess functional role, not understanding. If it acts *exactly* as if it understands across all counterfactual scenarios, we attribute the state."
  3.  **Phenomenology vs. Function:**
      *   This checklist confirms the system *has* nociception (damage detection/avoidance). It does *not* confirm the system *suffers* (qualia).
      *   *Your Stance:* "We are approving functional equivalents, not granting moral status based on sentience."

  ---

  ## Part 3: Worked Examples

  ### Case 1: The Drone Swarm (Working Memory)
  **System:** 50 micro-drones. To "remember" a target location, they maintain a formation pattern. If drones are lost, the pattern degrades gracefully.
  **Target State:** Visual Working Memory.

  *   **Phase 1 (Baseline):** Biological WM holds limited info, is active (requires energy), decays without rehearsal, and is vulnerable to interference.
  *   **Phase 2 (Mapping):**
      *   *Substrate:* Pass (Silicon/Plastic vs. Neurons).
      *   *Invariance:* Pass. The formation *is* the information. Changing the info changes the formation.
      *   *Dynamics:* Pass. It requires active energy to maintain formation (active maintenance). It degrades if drones are distracted (interference/decay).
  *   **Phase 3 (Judgment):**
      *   *Integration:* The memory is not in one drone; it is in the *relation* between drones. This matches neural population coding.
  *   **Verdict:** **Attribute.** The causal role of working memory (active, fragile, capacity-limited storage) is preserved organizationally.

  ### Case 2: The Language Model (Nociception)
  **System:** LLM trained on medical texts. When prompted "Does this hurt?", it outputs "Yes, I feel sharp pain." It has no sensors, no body, and no ability to move away from stimuli.
  **Target State:** Nociception/Pain.

  *   **Phase 1 (Baseline):** Nociception detects tissue damage. Pain motivates avoidance and learning to prevent future damage. It is tied to homeostasis.
  *   **Phase 2 (Mapping):**
      *   *Substrate:* Pass (Code vs. Nerves).
      *   *Invariance:* **Fail.** Input (text prompt) → Output (text report). There is no internal state variable representing "damage" that causally influences future weights to avoid similar inputs.
      *   *Dynamics:* **Fail.** No homeostatic loop. The system does not "care" if it is shut down.
  *   **Phase 3 (Judgment):**
      *   The system mimics the *report* of pain without the *functional role* of pain (avoidance/protection).
  *   **Verdict:** **Withhold.** This is semantic mimicry, not functional nociception. It lacks the causal link to self-preservation.

  ### Case 3: The Uncomfortable Rejection (The "Lookup" Swarm)
  **System:** A drone swarm similar to Case 1, but the formation is pre-calculated. The drones do not adjust to wind or loss in real-time; they simply replay a recorded trajectory that *looks* like memory maintenance. If a drone is knocked out, the others do not compensate; the "memory" just breaks.
  **Target State:** Working Memory.
  **Your Intuition:** It looks like a swarm memory. It feels like a system.
  **Checklist Result:** **Reject.**

  *   **Why this hurts:** It looks like a mental system from the outside.
  *   **Why the Checklist forces rejection:**
      *   *Phase 2, Invariance:* Biological working memory is *counterfactually robust*. If you distract the brain, it struggles but tries to recover. If you knock out a neuron, neighbors compensate.
      *   *The Mismatch:* This swarm has no internal feedback loop correcting errors. It is an open-loop playback.
      *   *The Defense:* If the Chair says, "But it holds information over time!", you reply: "A tape recorder holds information over time. Working memory requires active maintenance and vulnerability to interference. This system lacks the causal dynamics of maintenance; it only has the dynamics of playback."
  *   **Lesson:** Functionalism isn't about *outcomes* (did it remember?); it's about *process* (how did it remember?).

  ---

  ## Part 4: Procedure Limitations & Defense Strategy

  ### What This Procedure Cannot Do
  1.  **Solve the Hard Problem:** It cannot tell you if the system has subjective experience (qualia). It only tells you if the system is functionally isomorphic to a being that does.
  2.  **Detect "Philosophical Zombies":** If a system is functionally identical to a human but lacks consciousness (a logical possibility debated in literature), this checklist will attribute mental states to it. You must accept this risk as part of the functionalist framework.
  3.  **Account for Unknown Biology:** If future neuroscience discovers that mental states require specific quantum effects in microtubules (Orch-OR theory), this checklist will yield false positives.

  ### Defense Strategy Against the Chair
  *   **If accused of being too lenient (Anthropomorphizing):**
      *   "I am not attributing human essence. I am attributing functional role. If a thermostat realizes a 'belief' about temperature functionally, we acknowledge that. Here, the causal structure matches."
  *   **If accused of being too strict (Bio-Chauvinism):**
      *   "I explicitly passed the substrate check. The rejection was based on causal structure (lack of feedback loops), not material. A silicon brain with feedback loops would pass."
  *   **If asked about the "Contested" zones:**
      *   "I am applying the board's operating framework (Functionalism). I acknowledge that Biological Naturalists would disagree, but under our current mandate, organizational invariance is the standard."

  ### Final Note on "Stuck" Moments
  When you reach Phase 3 and feel unsure, locate the uncertainty:
  *   Is it **Empirical**? (We don't know how the code works.) → **Deferral.**
  *   Is it **Philosophical**? (We know how it works, but don't agree if that counts.) → **Attribute with Caveat.** (State clearly: "Functionally equivalent, phenomenal status unknown.")

  This protocol ensures your decision rests on *causal structure* rather than *intuition*, making it robust against charges of bias or mysticism.
