answer: |-
  Here is the analysis of COP26 as a case study for the standing conditions on blame, structured according to your requirements.

  ### 1. Disciplined Mapping of Blaming Relations

  To determine where standing is contested, we must distinguish the specific vectors of blame. COP26 was not a monolith of accusation; it contained at least four distinct blaming relations.

  **Relation A: The Existential Demand**
  *   **Blamer:** Delegations from low-lying island states (e.g., Tuvalu, Barbados).
  *   **Target:** High-emitting rich countries (e.g., US, UK, EU).
  *   **Norm:** The duty not to inflict existential harm through cumulative emissions; the duty of restitution for loss and damage.
  *   **Speech Act:** **Moral Address.** This is a demand for recognition and repair, grounded in vulnerability. It functions less as a sanction and more as an appeal to obligation.
  *   **Blamer Implication:** **Beneficiary without Acting.** They benefit from the global economic order but do not violate the specific norm (emissions) they cite. Their implication is systemic, not agential.

  **Relation B: The Developmental Censure**
  *   **Blamer:** Rich-country negotiators (e.g., UK, US).
  *   **Target:** Coal-dependent developing countries (e.g., India, South Africa).
  *   **Norm:** The duty to mitigate current emissions (specifically coal phase-down).
  *   **Speech Act:** **Sanction/Enforcement.** This is leverage within a negotiation, threatening diplomatic or economic costs for non-compliance.
  *   **Blamer Implication:** **Violate Same Norm at Different Scale/Time.** They demand cuts they have historically failed to make themselves. They violate the norm of *mitigation*, though they may argue the *timing* differs.

  **Relation C: The Consistency Challenge**
  *   **Blamer:** Campaigners/NGOs/Press.
  *   **Target:** Private-jet attendees (delegates and executives).
  *   **Norm:** The duty to minimize one's own carbon footprint while demanding others do so (consistency).
  *   **Speech Act:** **Censure/Shaming.** This is social sanction aimed at credibility rather than policy outcomes.
  *   **Blamer Implication:** **Participate in the Practice.** Even commercial flyers participate in the carbon economy, though at a lower magnitude.

  **Relation D: The Host's Admonition**
  *   **Blamer:** Host Government (UK Ministers, e.g., Alok Sharma).
  *   **Target:** All laggard delegations.
  *   **Norm:** Commitment to the Paris Agreement goals (1.5°C).
  *   **Speech Act:** **Procedural Enforcement/Moral Address.** A hybrid act; they chair the meeting (procedural) but also exhort (moral).
  *   **Blamer Implication:** **Facilitator.** They set the terms and provided the infrastructure (including airports) that enabled the violations they condemn.

  ---

  ### 2. Running the Tests

  Here we apply your five candidate conditions on standing to the four key figures. This reveals where the theories diverge.

  **The Conditions:**
  1.  **Strict-Identity:** You lack standing if you performed the *exact* token act you condemn.
  2.  **Same-Norm:** You lack standing if you violated the *type* of norm you invoke.
  3.  **Domain:** You lack standing if you are implicated anywhere in the *practice* the norm regulates.
  4.  **Complicity/Benefit:** You lack standing if you *profit* from the violation you condemn.
  5.  **Selectivity:** You lack standing if you condemn *some* violators while ignoring *equally culpable* others (independent of your own conduct).

  **The Matrix:**

  | Figure | Strict-Identity | Same-Norm | Domain | Complicity | Selectivity |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Private-Jet Delegate** (blaming coal use) | **Pass.** (Jet $\neq$ Coal) | **Fail.** (Both violate carbon limits) | **Fail.** (In the carbon economy) | **Fail.** (Benefits from fossil infrastructure) | **Fail.** (If ignoring other jet-setters) |
  | **Commercial-Flight Activist** (blaming jets) | **Pass.** (Flew commercial) | **Pass.** (Did not exceed necessary travel?) | **Fail.** (Still flew, still carbon) | **Fail.** (Benefited from travel) | **Pass.** (Targeted the worst offenders) |
  | **Island-State Delegate** (blaming emitters) | **Pass.** (Negligible emissions) | **Pass.** (Did not violate norm) | **Pass.** (Outside the harmful domain) | **Ambiguous.** (Benefits from global trade, but threatened by it) | **Pass.** (Targeted high emitters) |
  | **Rich-Country Negotiator** (blaming developing coal) | **Pass.** (Did not burn *that* coal) | **Fail.** (Missed past targets) | **Fail.** (High-emission economy) | **Fail.** (Benefits from historical emissions) | **Fail.** (Ignored own historical culpability) |

  **The Divergence Points:**

  *   **The Commercial-Flight Activist:** This figure is the theoretical wedge. **Strict-Identity** grants them standing (they didn't fly private). **Domain/Complicity** denies it (they still flew; they still benefit from the fossil economy). If your piece wants to argue that standing requires moral cleanliness, the Activist fails. If you argue standing requires only avoiding the *specific* hypocrisy, they pass.
  *   **The Rich-Country Negotiator:** **Strict-Identity** grants them standing (they aren't burning the Indian coal *now*). **Same-Norm** denies it (they missed their own targets). **Selectivity** denies it (they are ignoring their own history while targeting others). This figure shows that *Selectivity* is a distinct condition from *Hypocrisy*. A negotiator could theoretically have a clean record (no hypocrisy) but still lack standing if they selectively target only weak nations while ignoring equally culpable rich allies.
  *   **The Island-State Delegate:** They pass almost everything, *except* potentially **Complicity**. If benefiting from the global capitalist order (which drives emissions) forfeits standing, even the victim lacks standing. This is the stress test for the Complicity condition.

  ---

  ### 3. Pushing the Episode Back Against the Theory

  **Problem One: Scalar Standing and Triviality**
  If the **Domain** or **Complicity** conditions are enforced strictly, COP26 produces a *reductio ad absurdum*. Nearly every participant is implicated in the fossil-fuelled economy. The Island States benefit from global shipping; the Activists fly planes; the Host provides airports.
  *   **Theoretical Consequence:** The theory must either retreat to **Strict-Identity** (which lets the Private-Jet Delegate off the hook) or develop a **Scalar Theory of Standing**.
  *   **The COP26 Lesson:** The case suggests standing is not binary (have/have-not) but proportional to the *net* moral position. The Island States have "more" standing than the US, despite some complicity, because their net contribution to harm is negative. If the theory cannot accommodate degrees of implicatedness, it silences the only voices that matter.

  **Problem Two: Official Capacity and Borrowed Standing**
  When Alok Sharma (UK Host) tears up or demands action, is he speaking as *Alok* or as *the Presidency*?
  *   **Theoretical Consequence:** If standing is irreducibly personal, the Host is a hypocrite (representing a rich, high-emission nation). If standing attaches to the **Office**, the personal hypocrisy of the office-holder may be irrelevant.
  *   **The COP26 Lesson:** The episode complicates the "borrowed standing" argument. When rich nations speak *for* the vulnerable (as they often claim to), do they borrow the Island States' clean standing? COP26 suggests this fails: the structural power dynamic overrides the moral borrowing. The theory needs to account for **Representative Standing**, where an agent can blame on behalf of a principal, provided they are authorized, even if the agent is personally implicated.

  **Problem Three: Remediation and the "Must Speak" Dilemma**
  The Rich-Country Negotiator *must* speak. If they remain silent, coal targets are not met, and harm continues.
  *   **Theoretical Consequence:** Does the theory prescribe **Silence** (forfeit standing), **Confession-then-Blame** ("We failed, but you must act"), or **Delegation**?
  *   **The COP26 Lesson:** Silence is morally catastrophic (climate collapse). Confession was attempted (acknowledging missed targets) but often failed to restore standing in the eyes of developing nations. This suggests that **retroactive restoration of standing** is difficult. The theory must explain whether an admission of fault *during* the blame act sanitizes the hypocrisy, or whether the standing was forfeited *ex ante*. COP26 suggests the latter: the history of missed targets poisoned the well regardless of current contrition.

  ---

  ### 4. Where the Apparatus is Silent

  Your theoretical apparatus, designed for interpersonal or agent-to-agent blame, hits three silences in this case:

  1.  **The Standing of Collectives:** Standard standing theory often assumes individual agents. COP26 is State-vs-State. Can a State be a hypocrite? If the UK Government changes but the UK emissions remain high, does the standing persist? The theory is silent on **diachronic collective agency**.
  2.  **Radical Scale and Time:** Blame usually assumes contemporaneous agents. Here, the blame is for *accumulated* harm (historical emissions) vs. *current* flows. The theory lacks a mechanism for **intergenerational standing**. Can the current US delegation be blamed for the 1990s US emissions? Can they blame India for 2020s emissions? The time-lag breaks the symmetry required for Strict-Identity or Same-Norm tests.
  3.  **Naming-and-Shaming as Policy:** Is a clause in the Glasgow Climate Pact "blame"? Or is it policy? If it is policy, the standing conditions might be pragmatic (who has the leverage?) rather than moral (who has the clean hands?). The theory assumes a moral speech act; COP26 blurs this into **procedural governance**.

  ---

  ### 5. Bottom Line for the Piece

  **Is hypocrisy the right lens?**
  Honest assessment: **No, not primarily.**

  If you hang the piece on hypocrisy, you risk reducing a structural catastrophe to a matter of individual moral cleanliness. The COP26 case demonstrates that **hypocrisy is a symptom, not the disease.**

  *   **The Trap:** If you focus on the Private-Jet Delegate, you make the piece about individual virtue signaling. This is philosophically thin and politically trivial.
  *   **The Opportunity:** The case shows a **Structural Scarcity of Standing.** In a deeply implicated world, *no one* has clean hands. The "interesting failure" is not that specific blamers are hypocrites, but that the **conditions for standing are structurally impossible to meet** for the agents with the power to effect change.
  *   **The Pivot:** Use the COP26 episode to argue that standard standing conditions (especially Domain and Complicity) are ill-suited for systemic crises. The piece should conclude that we need a theory of **Implicated Standing**—a framework that allows agents to blame *from within* the structure they condemn, provided they acknowledge their implication and direct their blame toward structural change rather than individual purity.

  **Verdict:** The episode works brilliantly, but only if you use it to **break** the traditional hypocrisy lens, not to illustrate it. If you try to prove the Private-Jet Delegate lacks standing, you miss the point that the Island States *also* lack standing under strict Complicity conditions. The case proves that in the Anthropocene, the traditional logic of standing collapses. That is a much stronger philosophical claim.
