prompt: |-
  I am writing a piece on the standing conditions on blame — specifically on whether, and when, hypocrisy costs a blamer the standing to blame — and I want to hang it on a single well-documented episode rather than on invented vignettes. My proposed case is COP26 in Glasgow, and I would like you to do the analysis before I decide whether the piece works.

  Take these as the stipulated facts; their exact magnitudes do not matter to what I want from you. The summit was convened to secure deeper emissions cuts. During the fortnight, private-jet arrivals into Glasgow airports ran into the hundreds, and reporting at the time noted that a number of delegations, executives, and campaigners arrived by air, some privately, some commercially. Rich countries pressed coal-dependent developing countries for steeper targets, while several of those same rich countries had missed targets they had previously accepted. Delegations from low-lying island states, whose own emissions are negligible and whose territory is imminently threatened, were among the loudest in blaming the high emitters. And the host government both set the terms of participation and, through its own ministers, urged others to do more.

  Here is the analysis I want. First, a disciplined mapping: identify the distinct blaming relations in play — who blames whom, for the violation of which norm, and whether the speech act in question is best modeled as moral address (a demand on the target) or as something closer to sanction, censure, or enforcement. For each relation, say precisely how the blamer is implicated: does she do the very same thing she condemns, violate the same norm at a different scale, merely participate in the practice the norm targets, or benefit from it without acting?

  Then run the tests. I can think of several candidate conditions on standing, and I want them kept apart rather than blended: a strict-identity condition (you must not have done the very thing); a same-norm condition (you must not have violated the very norm you invoke); a domain condition (you must not be implicated anywhere in the relevant domain); a complicity or benefit condition (you must not profit from the practice you condemn); and a selectivity condition I have not seen argued — that a blamer who names some violators while staying silent about equally culpable ones forfeits standing in her own right, independent of hypocrisy. Say which of these the case actually discriminates between, which of them the private-jet delegate, the commercial-flight activist, the island-state delegate, and the rich-country negotiator each fail or pass, and where two conditions agree on almost everything and diverge only on one of these figures.

  Then push the episode back against the theory. Three problems interest me especially. One: if the domain or complicity conditions are right, nearly every participant in a fossil-fuelled economy is implicated, and the standing condition threatens either to silence everyone or to become trivial — does the theory have the resources for scalar standing, partial forfeiture, or degrees of implicatedness, or does it have to retreat to the strict-identity test to stay usable? Two: what happens when blame is issued in an official capacity, by an office-holder on behalf of a state or an institution, or by an implicated speaker purporting to speak for the threatened — is standing held by the office, borrowed from those on whose behalf one speaks, or irreducibly personal? Three: what does the theory prescribe for an implicated blamer who must speak anyway, and is silence, confession-then-blame, self-implicating blame, or delegation to an unimplicated speaker the coherent option — and are there acts that restore forfeited standing, and if so do they operate retroactively on blame already issued?

  Finally, tell me where the apparatus is silent rather than making it speak: on the standing of collectives, on blame across generations or at radically different scales of contribution, and on whether naming-and-shaming in a negotiated text is blame at all. And give me your honest bottom line for the piece: is hypocrisy the right lens on this episode, or does the case show that the interesting failure is a different one — a structural scarcity of standing that no individual-level condition can repair?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Topic:** Standing conditions on blame, specifically focusing on hypocrisy.
      *   **Case Study:** COP26 in Glasgow (stipulated facts provided).
      *   **Goal:** Analyze the case to see if it works for a philosophical piece on standing/hypocrisy.
      *   **Required Output Structure:**
          1.  **Disciplined Mapping:** Identify blaming relations (Who blames whom? For what norm? Type of speech act? Blamer's implication).
          2.  **Run the Tests:** Apply specific standing conditions (Strict-Identity, Same-Norm, Domain, Complicity/Benefit, Selectivity) to specific figures (Private-jet delegate, Commercial-flight activist, Island-state delegate, Rich-country negotiator). Identify where conditions diverge.
          3.  **Push Episode vs. Theory:** Address three specific problems (Scalar standing/Triviality, Official/Representative Capacity, Remediation/Restoration of standing).
          4.  **Silences:** Identify where the theory is silent (Collectives, Intergenerational/Scale, Naming-and-Shaming as blame).
          5.  **Bottom Line:** Honest assessment of whether "hypocrisy" is the right lens or if it's a structural scarcity of standing.

  2.  **Part 1: Disciplined Mapping (The Blaming Relations):**

      *   *Context:* COP26 is a negotiation, but it involves public moral pressure.
      *   *Relation A (Island States -> Rich Countries):*
          *   Blamer: Low-lying island states (e.g., Tuvalu, Barbados).
          *   Target: High-emitting rich countries (e.g., US, UK, EU).
          *   Norm: Duty to mitigate climate change/duty not to harm.
          *   Act: Moral address/Demand (in negotiations and public speeches).
          *   Implication: Negligible emissions, threatened territory. (Cleanest case).
      *   *Relation B (Rich Countries -> Developing Countries):*
          *   Blamer: Rich countries (e.g., UK, US).
          *   Target: Coal-dependent developing countries (e.g., India, China, South Africa).
          *   Norm: Duty to cut emissions (specifically coal).
          *   Act: Moral address/Pressure (negotiation leverage).
          *   Implication: Missed past targets, high historical emissions. (Hypocrisy candidate).
      *   *Relation C (Activists/NGOs -> All Delegations):*
          *   Blamer: Campaigners/Activists.
          *   Target: Delegations (especially those flying private).
          *   Norm: Consistency/Carbon footprint reduction.
          *   Act: Censure/Sanction (public shaming).
          *   Implication: Some flew commercial, some participated in the system.
      *   *Relation D (Host Gov -> Participants):*
          *   Blamer: UK Government (Alok Sharma et al.).
          *   Target: All laggards.
          *   Norm: Commitment to Paris Agreement goals.
          *   Act: Enforcement/Chairing (procedural + moral).
          *   Implication: Host emissions, facilitation of jets.

  3.  **Part 2: Running the Tests (Applying Conditions):**

      *   *Conditions:*
          1.  Strict-Identity (Did you do the *exact* act?)
          2.  Same-Norm (Did you violate the *rule* you cite?)
          3.  Domain (Are you *in* the practice?)
          4.  Complicity/Benefit (Do you *gain* from the violation?)
          5.  Selectivity (Do you ignore *others* doing the same?)
      *   *Figures:*
          1.  Private-jet delegate (Rich country).
          2.  Commercial-flight activist.
          3.  Island-state delegate.
          4.  Rich-country negotiator (who missed past targets).
      *   *Analysis:*
          *   *Private-jet delegate blaming coal use:* Fails Strict-Identity (jet vs. coal)? No, both carbon. Fails Same-Norm (excessive carbon). Fails Domain. Fails Complicity. Fails Selectivity (if ignoring other jet setters).
          *   *Commercial-flight activist blaming jets:* Passes Strict-Identity (didn't fly private). Fails Domain/Complicity (still flew, still carbon).
          *   *Island-state delegate blaming emitters:* Passes all (mostly). Maybe fails Complicity if they benefit from global trade? But stipulated facts say negligible emissions.
          *   *Rich-country negotiator blaming developing nations:* Fails Same-Norm (missed past targets). Fails Selectivity (ignoring own history).
      *   *Divergence Point:* The Commercial-flight Activist. Strict-Identity says they have standing (didn't fly private). Complicity/Domain says they don't (still flew, still part of system). This is a key theoretical wedge.

  4.  **Part 3: Pushing Episode vs. Theory (The Three Problems):**

      *   *Problem 1: Scalar Standing/Triviality.* If "Domain" or "Complicity" is the rule, everyone is implicated in fossil fuels. Standing vanishes. Theory needs "Degrees of Implication" or a threshold. COP26 shows this starkly: if only the carbon-neutral can speak, no one speaks.
      *   *Problem 2: Official Capacity.* The UK Host (Alok Sharma). Is he blamed as *Alok* or *UK*? If he speaks for the vulnerable (island states), does he borrow their standing? This distinguishes personal standing from representative standing.
      *   *Problem 3: Remediation.* What should the hypocritical blamer do? Silence? (Lets coal win). Confession? ("We missed targets, but you must cut coal"). This tests if standing can be regained *in media res*.

  5.  **Part 4: Silences (Where the Apparatus Fails):**

      *   *Collectives:* States aren't people. Can a state be hypocritical?
      *   *Scale/Time:* Historical emissions vs. current flows. Intergenerational blame.
      *   *Nature of the Act:* Is a negotiated text "blame"? Or is it policy? If it's policy, standing conditions might differ from interpersonal moral blame.

  6.  **Part 5: Bottom Line:**

      *   Is hypocrisy the right lens?
      *   *Argument:* Hypocrisy focuses on individual moral cleanliness. COP26 shows a *structural* problem. The "standing" to demand climate action is structurally scarce because the system implicates everyone. Focusing on hypocrisy might distract from the structural coercion.
      *   *Verdict:* The case works best to *critique* standard standing theories, not to illustrate them cleanly. It shows the limits of the hypocrisy lens.

  7.  **Drafting the Response:**

      *   *Tone:* Philosophical, analytical, precise, matching the user's sophisticated prompt.
      *   *Formatting:* Use headers to match the requested structure.
      *   *Refinement:* Ensure the distinction between "Strict-Identity" and "Same-Norm" is clear. Ensure the "Selectivity" condition is treated as distinct from hypocrisy (it's about fairness/consistency in application, not necessarily the blamer's own conduct).
      *   *Check Stipulated Facts:* Adhere strictly to the provided facts (hundreds of jets, rich vs. developing, island states threatened, host set terms).

      *(Self-Correction during drafting)*: I need to be careful with the "Selectivity" condition. The prompt defines it as "naming some violators while staying silent about equally culpable ones." This is distinct from hypocrisy (which is about the blamer's own conduct). I need to make sure the Rich Country Negotiator fails this specifically regarding *other* rich countries, not just their own past.
      *(Refinement on Island States)*: Do they fail Complicity? They benefit from the global economy. But the prompt says "negligible emissions." I should stick to the stipulation that they are "imminently threatened" and "negligible emitters" to keep them as the control group for standing.
      *(Refinement on Official Capacity)*: Make sure to distinguish between the Minister as an individual and the State as a principal.

  8.  **Final Review against constraints:**
      *   Did I map the relations? Yes.
      *   Did I run the 5 tests on the 4 figures? Yes.
      *   Did I address the 3 theoretical problems? Yes.
      *   Did I identify silences? Yes.
