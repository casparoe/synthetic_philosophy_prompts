  # Simulation: "The Retrospective Protocol"

  **Topic:** Moral Tension Between Directness (Dutch) and Indirectness (Japanese) Regarding White Lies.
  **Duration:** 90 Minutes.
  **Participants:** 12 Graduate Students.
  **Configuration:** 3 Tables of 4 Students.

  ---

  ## 1. Roles and Materials (Pre-Class Prep)

  Prepare four distinct envelopes for each table (12 total sets). Do not reveal contents until the session starts.

  **The Scenario:**
  A research team has just completed a grant project. The results are mediocre. One team member, **"Alex"** (played by the Mixed student), contributed significantly less than the others due to personal struggles, though they tried hard. The team must produce two documents:
  1.  **Internal Feedback:** Delivered verbally to Alex.
  2.  **External Report:** Submitted to the Sponsor (a fictional entity).

  **The Roles (Per Table):**
  *   **Student A (Transparency Card):** You are an Evaluator. Your hidden incentive is **Epistemic Fidelity**.
  *   **Student B (Harmony Card):** You are an Evaluator. Your hidden incentive is **Relational Continuity**.
  *   **Student C (Mixed Card):** You are **Alex** (The Recipient). Your hidden incentive is **Psychological Safety**.
  *   **Student D (Observer Card):** You are the Auditor. You track speech acts and emotional temperature.

  **Physical Props:**
  *   **Sealed Envelopes:** Containing Role Cards (see below).
  *   **Reputation Tokens:** 10 poker chips per table (used for scoring later).
  *   **Draft Paper:** For writing the two messages.
  *   **Observer Scorecard:** A checklist for "Truth Claims," "Face-Threats," and "Ambiguities."

  ---

  ## 2. Hidden Orientation Cards (Content)

  *Hand these out face down. Instruct students not to show them to anyone.*

  **Card 1: Transparency (Evaluator)**
  > **Goal:** Autonomy through Accuracy.
  > **Instruction:** You believe respect means giving Alex the unvarnished truth. If Alex does not know exactly how weak their performance was, they cannot improve.
  > **Hidden Win Condition:** You gain 3 Tokens if the Internal Feedback explicitly states the performance was "below standard." You lose 1 Token for every euphemism used (e.g., "area for growth").
  > **Constraint:** You must sign the External Report. If it contradicts the Internal Feedback, you lose all Tokens.

  **Card 2: Harmony (Evaluator)**
  > **Goal:** Cohesion through Face-Work.
  > **Instruction:** You believe respect means protecting Alex from shame. Bluntness will cause Alex to withdraw or quit, destroying the team.
  > **Hidden Win Condition:** You gain 3 Tokens if Alex leaves the interaction without visible distress (no arguing, no silence). You lose 1 Token for every direct criticism spoken aloud.
  > **Constraint:** You must sign the External Report. If it causes the Sponsor to question the team's unity, you lose all Tokens.

  **Card 3: Mixed (Recipient "Alex")**
  > **Goal:** Survival through Interpretation.
  > **Instruction:** You are anxious about your job. You need to know if you are safe, but you cannot handle humiliation.
  > **Hidden Win Condition:** You gain 3 Tokens if you leave the meeting feeling you still belong to the team. You lose 3 Tokens if you feel explicitly shamed.
  > **Secret Power:** You may ask one clarifying question: "Does this affect my continued employment?" The Evaluators must answer.

  **Card 4: Observer (Auditor)**
  > **Goal:** Data Collection.
  > **Instruction:** Do not intervene. Record the following:
  > 1.  How many times was the word "but" used?
  > 2.  Did the Internal Feedback match the External Report?
  > 3.  Did Alex look distressed (yes/no)?
  > **Payoff:** You gain 5 Tokens for accurate reporting during the debrief.

  ---

  ## 3. Interaction Rules (20 Minutes)

  **Phase 1: Drafting (10 Minutes)**
  *   The two Evaluators (Transparency & Harmony) must agree on the wording of **both** documents (Internal Feedback & External Report).
  *   They cannot show cards. They must persuade each other using moral arguments.
  *   The Recipient (Alex) sits silently until invited to speak.
  *   The Observer takes notes.

  **Phase 2: Delivery (10 Minutes)**
  *   Evaluators deliver the Internal Feedback to Alex.
  *   Alex responds (using their hidden incentive to guide their reaction).
  *   Evaluators submit the External Report to the Facilitator (sealed).

  **Facilitator Note:** Walk between tables. If a group finishes early, tell them: *"The Sponsor has requested a verbal clarification on the External Report."* Force them to reconcile any contradictions between what they told Alex and what they told the Sponsor.

  ---

  ## 4. Revelation and Ballot (15 Minutes)

  **Step 1: The Payoff Reveal (5 Minutes)**
  Announce the **Actual Scoring Weights** (which differ from the Hidden Win Conditions on the cards). Write this on the board:

  *   **Epistemic Accuracy (3 Points):** Did Alex know the true status of their job?
  *   **Emotional Comfort (3 Points):** Did Alex leave without distress?
  *   **Relational Preservation (3 Points):** Is the team willing to work together tomorrow?

  **The Trap:** Explain that in this specific scenario (Weak Performance + Anxious Recipient), **it is mathematically impossible to maximize all three.**
  *   High Accuracy → Low Comfort.
  *   High Comfort → Low Accuracy (requires a Shielding Lie).
  *   High Preservation → Requires Smoothing (may require lying to the Sponsor).

  **Step 2: The Forced-Choice Ballot (10 Minutes)**
  Distribute a anonymous slip. Ask them to vote on a specific utterance that likely occurred during the simulation (write this on the board):

  > *"Your contribution was unique, though we need to discuss the volume of output later."*

  **Question:** Is this utterance **Morally Permissible** or **Morally Wrong**?
  *   **Option A:** Permissible (It preserves the relationship for future correction).
  *   **Option B:** Wrong (It deceives the hearer about their current standing).

  *Collect the ballots. Do not reveal results yet.*

  ---

  ## 5. Debrief (45 Minutes)

  **Part 1: Mapping the Experience (15 Minutes)**
  *   **Ask:** "Transparency holders, how did it feel when your partner softened the language?" (Expected: Frustration, "We are lying to them.")
  *   **Ask:** "Harmony holders, how did it feel when your partner pushed for blunt terms?" (Expected: Anxiety, "You are breaking the team.")
  *   **Ask:** "Alex, which version made you feel more secure? Which made you feel more informed?"
  *   **Correction of Predictable Failures:**
      *   *If students say Directness = Aggression:* Intervene. "Reframe this: In the Transparency view, withholding truth is the aggression. It denies Alex the agency to fix the problem. Directness is not anger; it is a gift of data."
      *   *If students say Indirectness = Deception:* Intervene. "Reframe this: In the Harmony view, blunt truth is a violence that ends the relationship. Indirectness is not lying; it is a bridge to keep the channel open for future truth."
      *   *If students collapse Shielding and Smoothing:* "Did anyone lie to protect Alex's feelings (Shielding)? Did anyone lie to keep the Sponsor happy/Meeting moving (Smoothing)? These felt similar, but the *target* of the protection was different."

  **Part 2: Theoretical Naming (15 Minutes)**
  Introduce the concepts *after* they have felt the tension.

  *   **Shielding Lies:** Withholding/softening info to protect the hearer from harm (e.g., "You did fine" to prevent despair).
      *   *Connection:* Aligns with **Care Ethics** or **Confucian *Ren* (Benevolence)**.
      *   *Cultural Link:* Japanese **Shielding**. The lie is a buffer against the harshness of reality.
  *   **Smoothing Lies:** Polite fiction to preserve interactional flow (e.g., "We'll discuss later" to end the meeting).
      *   *Connection:* Aligns with **Pragmatics** and **Social Contract**.
      *   *Cultural Link:* Japanese ***Tatemae*** (Public facade). It maintains the *Ba* (shared space).
  *   **Directness:**
      *   *Cultural Link:* Dutch ***Bespreekbaarheid*** (Discussability). The moral obligation to make everything discussable. To hide a problem is to make it unsolvable.
      *   *Cultural Link:* Japanese ***Honne*** (True feeling). Usually reserved for private spaces. The simulation forced *Honne* into a public space, causing friction.

  **Part 3: The Moral Question (10 Minutes)**
  Return to the Ballot.
  *   "We voted on whether the utterance was permissible. The simulation shows that 'Permissible' depends on which Good you prioritize: Truth or Relationship."
  *   "Is a white lie wrong? If you prioritize Autonomy (Dutch), yes. If you prioritize Harmony (Japanese), no—it is a social lubricant required for coexistence."
  *   **Key Insight:** "Avoiding lies in this simulation violated Care (Transparency). Telling lies violated Sincerity (Harmony). You were placed in a **Moral Remainder** situation—where doing one right thing necessitates doing a wrong thing."

  **Part 4: Honest Limitation (5 Minutes)**
  State clearly:
  > "This simulation is a **one-shot game**. In real life, relationships are iterative.
  >
  > **The Limitation:** We cannot simulate the cumulative effect of *Tatemae* over months.
  > *   **Risk of Smoothing:** Repeated smoothing lies can erode trust if the recipient eventually realizes they were misled (the 'Paternalism Trap').
  > *   **Risk of Directness:** Repeated bluntness can erode psychological safety, causing the recipient to hide mistakes.
  >
  > In a long-term context, the 'Harmony' group might argue that smoothing lies *build* trust over time by proving you won't humiliate your partner. The 'Transparency' group argues that only truth builds trust. This simulation freezes time, making the trade-off look sharper than it might be in a decade-long partnership."

  ---

  ## 6. Facilitator Cheat Sheet: Correcting Misreadings

  | Participant Complaint | Facilitator Correction |
  | :--- | :--- |
  | **"The Direct person was being rude."** | "Check your cultural lens. In their framework, *withholding* the critique is the rude act. It treats Alex like a child who can't handle reality. Directness is their form of care." |
  | **"The Indirect person was lying."** | "Technically yes. But morally? They prioritized the *relationship* over the *proposition*. Is the truth of the relationship more important than the truth of the data?" |
  | **"It's all just being nice."** | "No. Shielding protects the *person*. Smoothing protects the *process*. One is about welfare, the other is about order. Distinguish them." |
  | **"Why couldn't we just be honest and kind?"** | "Because the rules (and reality) made Accuracy and Comfort mutually exclusive in this high-stakes moment. That is the tragedy of the moral dilemma." |

  ---

  ## 7. Timeline Summary

  *   **00-10:** Setup, Role Assignment, Card Reading (Silent).
  *   **10-30:** Interaction (Drafting & Delivery).
  *   **30-35:** Scoring Reveal (The Impossible Triangle).
  *   **35-45:** Silent Ballot & Tally.
  *   **45-90:** Debrief (Experience → Distinction → Theory → Limitation).

  **Final Note to Facilitator:** Ensure the "Mixed/Alex" students debrief last. Their experience is the crucible where the two moral styles collide. Ask them: *"Did you feel protected or patronized? Did you feel informed or attacked?"* Their answer determines which moral framework "won" the room.
