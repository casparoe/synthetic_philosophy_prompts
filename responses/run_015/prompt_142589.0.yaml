answer: |-
  **Project Title:** Quantitative Resemblance and the Ontology of Feature Spaces

  **Project Summary**
  The debate over universals has reached a stalemate. Realists argue that objective classification requires shared entities (universals); Resemblance Nominalists argue that objective classification requires only particular objects resembling one another. However, this dispute is almost exclusively conducted using qualitative examples (e.g., "redness," "electronhood") and a primitive notion of resemblance. This project proposes that the debate changes shape if resemblance is treated quantitatively, modeling objects as points in a multi-dimensional feature space and similarity as a metric distance. My central hypothesis is that while a quantitative model resolves the "cheapness" objection (that everything resembles everything), it risks relocating the metaphysical burden to the selection of features and metrics. This fellowship will support a one-year investigation into whether quantitative resemblance offers a defensible nominalist ontology or merely encodes realism in the geometry of the feature space.

  **Research Question**
  Standard realist critiques argue that resemblance is circular: to resemble is to share a property. These critiques assume a qualitative notion of resemblance. If resemblance is defined by a metric $d(x,y)$ over a feature space $F$, the "cheapness" objection is formally blocked; points have determinate distances. However, this invites a deeper objection: does the construction of $F$ presuppose the very natural kinds the theory aims to explain?

  The project addresses a narrowly defined question: **In a quantitative resemblance nominalism, does the metric structure generate natural classes, or does the prior selection of feature dimensions encode the ontological commitments of realism?** I will distinguish which traditional objections are solved by the formalism and which are merely restated. Specifically, I will argue that the "cheapness" objection is dissolved by the metric, but the "composition" and "naturalness" objections transform into a problem of feature selection. The core task is to determine if feature selection can be grounded nominalistically (e.g., via causal powers or pragmatic utility) without smuggling in universals.

  **Methodology and Timeline**
  This project is conceptual analysis utilizing formal models, not applied machine learning. I will not be training models on datasets, but rather reconstructing metaphysical objections within the logic of feature spaces to test their ontological commitments.

  *   **Months 1–3: Reconstruction of Objections.** I will formalize the three standard charges against resemblance nominalism (Cheapness, Composition, Naturalness) within a feature-space framework. I will demonstrate formally why the metric resolves Cheapness (distinct points have non-zero distance) but show how Composition (pairwise similarity does not guarantee class cohesion) and Naturalness (distinguishing projectible from gerrymandered kinds) depend entirely on the topology of the space.
  *   **Months 4–6: The Feature Selection Dilemma.** I will analyze the ontological status of the "dimensions" in the feature space. If dimensions correspond to causal powers, does this collapse into Armstrong-style realism? If they are pragmatic or observer-relative, does the view collapse into anti-realism? I will test whether a "neutral" feature space is possible or if every space privileges certain clusterings *a priori*.
  *   **Months 7–9: Ontological Commitments.** Based on the previous analysis, I will map the surviving version of the view to its ontological costs. I will determine if the view requires a commitment to "features" as abstract entities or if it can remain committed only to concrete particulars arranged in a specific topology.
  *   **Months 10–12: Synthesis and Writing.** I will finalize the argument, distinguishing between the three live outcomes (see below), and draft the dissertation chapter and a companion article for submission.

  **Live Outcomes and Decision Criteria**
  The investigation will likely result in one of three conclusions. The decision between them rests on the analysis of the feature selection process in Months 4–6.

  1.  **Realism in Disguise:** If the only way to secure "natural" feature spaces is to ground dimensions in mind-independent properties, the view collapses into a variant of realism. *Decision Criterion:* If feature selection requires truth-makers that are not particulars.
  2.  **Defensible Nominalism:** If feature spaces can be grounded in the causal relations between particulars (e.g., similarity is defined by reciprocal causal powers) without invoking shared entities, nominalism is vindicated. *Decision Criterion:* If the metric can be derived from particular-to-particular relations alone.
  3.  **Dissolution of the Dispute:** If feature selection is shown to be irreducibly pragmatic or interest-relative, the debate over "natural kinds" may be verbal. *Decision Criterion:* If no metaphysical fact distinguishes "natural" from "gerrymandered" spaces, only utility.

  **Scope and Failure Conditions**
  The scope is limited to the metaphysics of classification; I will not address the semantics of predicates or the epistemology of kind-membership. A primary risk is that the mathematical formalism proves metaphysically shallow—that talking about "vectors" is merely a metaphor for "properties" with no explanatory gain. If I cannot demonstrate that the feature-space model offers a distinct ontological category from traditional property realism, the project will fail to advance the debate. Additionally, if the analysis reveals that feature selection is wholly arbitrary, the project may conclude that quantitative nominalism offers no advantage over skepticism about kinds. I will mitigate this by focusing on causal grounding strategies for feature selection, ensuring that even a negative result yields a clear map of why the nominalist project fails in a quantitative context.

  This project offers a rigorous stress-test for nominalism using the most concrete model of resemblance available. By forcing the debate into a quantitative framework, we can finally see whether the machinery of resemblance does the work, or if the work was done before the calculation began.
