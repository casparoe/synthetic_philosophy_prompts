answer: |-
  1. **Political Guilt Under Authoritarianism**
  You argue that all citizens bear political guilt for their state's crimes, regardless of individual action. But how do you justify assigning liability to citizens who lived under an authoritarian regime with zero democratic input and no mechanism to dissent without facing death?
  *Follow-up:* If you respond that political guilt is about liability for the state's existence rather than personal blame, why retain the word "guilt" at all? Doesn't that linguistically conflate necessary reparations with moral punishment?

  2. **Moral Guilt and Inheritance**
  Jaspers insists moral guilt requires individual introspection about one's own actions. Does this mean descendants who never participated are entirely exempt from moral guilt, even if they benefit materially from the injustice?
  *Follow-up:* If you agree they are exempt from moral guilt, how do we account for intergenerational responsibility without diluting Jaspers's strict definition of conscience?

  3. **Metaphysical Guilt vs. Solidarity**
  Metaphysical guilt relies on a solidarity among all human beings. At what point does this become so diffuse that it stops being guilt and becomes just existential solidarity?
  *Follow-up:* If you argue it's purely existential and not moral or legal, does calling it "guilt" risk trivializing the suffering of victims by equating the survivor's burden with the perpetrator's crime?

  4. **Criminal vs. Political Overlap**
  When a state legalizes atrocity, criminal guilt applies to the executors, but where does political guilt end and criminal guilt begin for the bureaucrats who made it legal?
  *Follow-up:* If you say bureaucrats are criminally liable, does that not imply the citizenry's political guilt is merely passive, while the state's machinery is actively criminal?

  5. **Purpose of the Scheme**
  What is the practical function of separating these four categories? Is it to facilitate forgiveness, or to ensure accurate accountability?
  *Follow-up:* If you say it's to ensure accurate accountability, doesn't the public inevitably mash them together, leading to either collective shame or individual absolution?

  6. **Metaphysical Transformation**
  Jaspers suggests metaphysical guilt can only be resolved through a transformation of consciousness. Is this transformation possible without a religious framework?
  *Follow-up:* If you say it's secular, what mechanism replaces God's judgment to validate that this transformation has actually occurred?

  7. **Silence and Complicity**
  Where does silent complicity fit? If a citizen knew of crimes but stayed safe, is that a moral failure, or does it accrue to political guilt?
  *Follow-up:* If you say it's moral, doesn't widespread moral failure inevitably create the conditions for political catastrophe, blurring the line you're drawing?

  8. **Modern Democratic Application**
  Can this scheme apply to democracies where citizens actively vote for harmful policies, rather than having them imposed?
  *Follow-up:* If you say yes, does that not increase the weight of political guilt for voters compared to Jaspers's postwar Germans who lacked voting power?

  ***

  I'm about 85% confident these capture Jaspers's distinctions accurately, though I'm least sure about the framing of Question 3 regarding metaphysical guilt, since Jaspers is intentionally vague on whether it's a philosophical category or a religious one. Also, I spotted the typo "authoritarion" in your prompt instructions.
