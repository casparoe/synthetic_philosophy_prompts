answer: |-
  This is a sophisticated observation that cuts to the heart of how social epistemology interacts with organizational inertia. You are correct that standard **information cascades** (Bikhchandani et al.) do not capture this. Standard cascades model the *adoption* of a belief based on the observed actions of predecessors, assuming fixed private signals. Your phenomenon describes a dynamic where the *interpretation of private signals* (the evidentiary standards) changes endogenously as the consensus grows.

  There is no single, canonical term for this specific second-order effect in the literature, though it sits at the intersection of several well-trodden domains. However, we can construct a precise framing by synthesizing concepts from the philosophy of science, organizational theory, and social epistemology.

  Here is an analysis of the phenomenon, its closest theoretical relatives, and a proposed definition.

  ### 1. Closest Theoretical Ancestors

  While no single term captures the *distributed restructuring of disconfirmation criteria*, three concepts provide the structural scaffolding:

  **A. Socialized Lakatosianism (The "Protective Belt" as Norm)**
  Imre Lakatos described how research programs protect their "hard core" via a "protective belt" of auxiliary hypotheses. Usually, this is modeled as a theoretical move by proponents. Your observation describes a **socialized protective belt**: the community collectively generates the auxiliary requirements (e.g., "show economic incentives," "control for self-selection"). The "belt" is not just theoretical; it is procedural. The literature on **Scientific Consensus Formation** (e.g., works by Helen Longino or Philip Kitcher) touches on this, specifically regarding how "transformative criticism" can sometimes calcify into "gatekeeping norms."

  **B. Epistemic Path Dependence**
  In institutional economics, **path dependence** explains how past decisions constrain future options (e.g., QWERTY keyboards). In epistemology, this manifests as **Evidentiary Ratcheting**. Once a community invests cognitive capital in a consensus (the "safe" ML architecture or the "new" curriculum), the cost of reversing that investment rises. The community responds by raising the evidentiary threshold for reversal to justify the prior investment. This is distinct from simple status quo bias because the *rules of engagement* actively evolve to match the depth of the commitment.

  **C. The "Consensus Prior" Trap**
  From a Bayesian perspective, this can be modeled as an updating error regarding priors. As consensus grows, individual agents rationally update their **prior probability** that the consensus is correct. However, they also implicitly update the **prior probability that a challenger is competent/thorough**. If the consensus is strong, the rational prior becomes: *"Any challenge to this is likely flawed until proven otherwise."* This shifts the burden of proof exponentially. The pathology arises when the community updates the *reliability of the consensus* faster than it updates the *sensitivity of its detection mechanisms* for error.

  ### 2. Differentiation from Related Concepts

  To define this precisely, we must distinguish it from the phenomena you mentioned:

  *   **Vs. Information Cascades:** Cascades concern *what* people believe. Your phenomenon concerns *how* they justify belief revision. It is a cascade of **epistemic thresholds**, not propositions.
  *   **Vs. Groupthink (Janis):** Groupthink is psychological and driven by a desire for harmony/cohesion, often suppressing dissent. Your cases show dissent is *allowed* but structurally neutralized by procedural complexity. It is not suppression; it is **attrition**.
  *   **Vs. Status Quo Bias:** Status quo bias is a cognitive inertia (doing nothing). Your phenomenon is active **procedural fortification**. The committee isn't just ignoring objections; they are generating new, reasonable-sounding criteria to process them.
  *   **Vs. Popperian Immunization:** As you noted, Popperian immunization is typically ad hoc and theorist-driven. This is **distributed and normative**. No single actor intends to protect the belief; the protection emerges from the aggregation of individual "caution."

  ### 3. Proposed Definition: "Epistemic Threshold Ratcheting"

  If we were to name this for the literature, **Epistemic Threshold Ratcheting** (or **Normative Lock-in of Disconfirmation**) fits best.

  **Definition:**
  > A social-epistemic phenomenon wherein a community's consensus on a proposition $P$ induces a progressive, distributed increase in the evidentiary burden required to assert $\neg P$. Unlike simple inertia, the criteria for disconfirmation are actively restructured to become more complex, layered, or interdisciplinary as consensus deepens. This restructuring emerges from locally rational updates to risk assessment and procedural caution, resulting in a globally pathological resistance to correction.

  **Boundary Conditions:**
  1.  **Distributed Agency:** No single actor dictates the new standards; they emerge from successive interactions.
  2.  **Local Rationality:** Each new layer of scrutiny is defensible as "rigor" or "due diligence" in isolation.
  3.  **Asymmetry:** The burden for maintaining $P$ remains static or decreases, while the burden for establishing $\neg P$ increases.
  4.  **Proceduralization:** Objections are not rejected on merit alone but on failure to meet the evolving procedural prerequisites (e.g., "you haven't controlled for X").

  ### 4. The Rationality Paradox

  You asked whether this is genuinely rational at the individual level. The answer is **yes, conditionally**, which makes the collective outcome more insidious.

  **Individual Rationality (The Micro View):**
  For a committee member or forum participant, adopting higher standards for overturning a consensus is risk-averse rationality.
  *   *False Positive Cost:* If I accept a flawed challenge to the consensus, I undermine a potentially useful system (the ML architecture or curriculum).
  *   *Reputational Risk:* Aligning with a fringe challenge carries higher reputational risk than aligning with the consensus.
  *   *Cognitive Efficiency:* It is efficient to treat the consensus as a "heuristic for truth." Demanding that challengers clear higher bars filters out low-effort noise.

  **Collective Pathology (The Macro View):**
  The system fails because the **error-correction mechanism becomes less sensitive than the error-generation mechanism.**
  *   In a healthy epistemic market, the burden of proof should remain symmetric (or shift based on evidence quality, not consensus volume).
  *   By ratcheting the threshold, the community creates a **One-Way Membrane**: Evidence for $P$ passes through easily (confirmed by the consensus); evidence for $\neg P$ is filtered out by the layered requirements.
  *   This creates a **False Negative Trap**: The system becomes incapable of detecting genuine anomalies because genuine anomalies often look like noise until they are fully understood. The ratcheted standards demand "fully understood" levels of proof for anomalies that are, by nature, initially obscure.

  ### 5. Framing for Future Discussion

  If you wish to discuss this in forums or papers, framing it as **"Second-Order Information Cascades"** is theoretically sound but may require explanation. A more precise framing might be **"Procedural Immunization via Epistemic Ratcheting."**

  Key questions to test the boundary of this phenomenon:
  1.  **Reversibility:** If the consensus were on $\neg P$, would the evidentiary standards for $P$ be symmetric? (If not, it's bias; if yes, it might just be rigor).
  2.  **Origin of Standards:** Did the standards exist *before* the consensus, or were they invoked *after* the challenge arose? (The latter indicates ratcheting).
  3.  **Dissent Trajectory:** Do challengers leave because their evidence was refuted, or because the *cost* of producing the next layer of evidence became prohibitive?

  ### Summary
  You have identified a gap between **social epistemology** (how we know together) and **institutional theory** (how organizations process decisions). The phenomenon is a **distributed, procedural hardening of the null hypothesis**. It is rational for individuals seeking to minimize error and reputational risk, but it creates a collective epistemic blind spot where the "cost of truth" exceeds the "budget of dissent."

  While it lacks a single canonical name, it is effectively a **socially enforced Lakatosian protective belt** driven by **epistemic path dependence**. Recognizing it requires watching not *what* people believe, but *how the rules for changing their minds evolve over time.*
