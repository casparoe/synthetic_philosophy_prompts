      *   **Move 5: Jordan's "Parsimony/Epiphenomenalism" Challenge.**
          *   *Claim:* If an anesthetized patient has local activity with *no* global effects, postulating experience is unparsimonious and makes consciousness epiphenomenal (causally inert).
          *   *Analysis:* This is the "zombie" or "epiphenomenal qualia" argument. If P has no causal power (no behavior, no report, no cognitive effect), why posit it?
          *   *Critique:* This is a classic argument against P-consciousness distinct from A-consciousness (Dennett's line). If P does nothing, it's a ghost.
          *   *Rating:* Clearly right. This is the strongest philosophical objection to Block-style P-consciousness. If it makes no difference, Occam's Razor cuts it.

