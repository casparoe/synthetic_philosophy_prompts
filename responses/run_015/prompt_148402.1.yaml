answer: |-
  ### Adjudication of the Exchange

  **1. Jordan's Initial "Half-Broadcast" Proposal**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Jordan correctly identifies that standard Global Workspace Theory (GWT) is often too binary (all-or-nothing) to account for the nuances of experience. Graded GWT models (e.g., Dehaene et al.) do exist and allow for varying degrees of availability. However, her distinction falters on the definition of "access." If information is globally available for *emotional modulation*, it is functionally accessible to downstream systems. Block's definition of Access Consciousness (A-consciousness) includes availability for *reasoning and rational control*, but if emotional systems can utilize the data, the line between "phenomenal" and "access" becomes porous. She risks redefining A-consciousness rather than isolating P-consciousness.

  **2. Riley's "Refractory Phenomenal Residues" Objection**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Riley correctly points to empirical phenomena like iconic memory or subliminal priming where sensory processing occurs without reportability. This supports Local Recurrent Processing theories (e.g., Lamme). However, his move is question-begging. He *asserts* these residues are phenomenally conscious to prove P-consciousness exists without access. GWT proponents (like Jordan) deny these states are conscious, labeling them "unconscious perception." Without independent criteria for consciousness (which he lacks), this is an intuition pump, not a proof.

  **3. Jordan's Response on Ad Hoc Attribution and Panpsychism**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Jordan is methodologically correct: attributing consciousness to sub-threshold neural events without behavioral or cognitive markers is scientifically ad hoc. However, her "panpsychism" charge is slightly hyperbolic. Localist theories do not necessarily imply *universal* panpsychism (consciousness in atoms), but rather "fragmented consciousness" (micro-experiences in neural columns). While this raises a binding problem (how do fragments become a unified self?), it is not strictly panpsychism. Nevertheless, her demand for independent criteria is a strong philosophical constraint.

  **4. Riley's Distinction Between Integration and Broadcasting**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** This is Riley's strongest conceptual move. Distinguishing *integration* (binding features into a unified scene) from *broadcasting* (making that scene available for report) is crucial. Many theorists agree consciousness requires binding but not necessarily report. However, Riley introduces a "self-model" as the anchor for this integration. Typically, a self-model is a high-level cognitive construct that arguably *requires* global workspace resources. Positing a local self-model without global availability is theoretically unstable and risks collapsing back into Jordan's "half-broadcast" view.

  **5. Jordan's Final Parsimony Challenge**
  *   **Rating:** Clearly right.
  *   **Justification:** This is the decisive move. If a state is phenomenally conscious but produces *no* global effects (no behavior, no memory, no cognitive modulation), it is causally inert regarding the organism's functioning. Postulating such a state violates Occam's Razor. This is the classic epiphenomenalism objection: if P-consciousness does nothing, why evolve it? If it *does* something (e.g., modulates emotion), it falls back into Jordan's "access" category. Riley's admission that such states are undetectable in principle undermines the scientific viability of his position.

  ### Overall Verdict
  **Jordan is more right overall.**
  While Riley successfully highlights the phenomenological intuition that experience feels richer than what we can report (the "overflow" argument), his theoretical framework collapses under the weight of epiphenomenalism and lack of operational criteria. Jordan's position, rooted in functionalist constraints and parsimony, offers a more scientifically tractable model. She successfully demonstrates that if P-consciousness is to be a natural kind, it must have a functional role, which inevitably ties it to some form of access or global integration.

  ### The Deepest Unaddressed Issue
  The deepest issue both parties are failing to address is the **Causal Exclusion Problem regarding Functionalism.**

  Their disagreement is partly verbal but ultimately rests on a substantive metaphysical fork:
  1.  **Verbal Component:** They are talking past each other on the definition of "Access." Jordan treats "availability for emotional modulation" as a form of access (functional availability), while Riley treats "Access" strictly as "conceptual reportability." If they standardized definitions, their positions might converge.
  2.  **Substantive Component:** The core unresolved tension is whether **Phenomenal Consciousness is a Functional State.**
      *   If consciousness is functional (it *does* something), Jordan wins: it must be integrated into the cognitive architecture (Access).
      *   If consciousness is non-functional (it is an intrinsic property that *accompanies* processing), Riley wins: it can exist without causal output.

  Jordan assumes functionalism (hence her parsimony victory), while Riley assumes a form of property dualism or non-reductive physicalism (hence his willingness to accept undetectable residues). Neither explicitly argues for their underlying metaphysical commitment, which is the actual source of the impasse. They are arguing about the *symptoms* of consciousness without agreeing on its *ontological status*.
