answer: |-
  I discarded "Contextuality" because it concerns incompatible measurements on a single system rather than spacelike separation, and "Determinism" because Bell's theorem applies equally to stochastic theories—the core issue is probabilistic independence, not predictability. I also set aside "Realism" as too overloaded; the conflict is specifically about how probabilities factorize, not merely whether properties exist.

  The pattern you have spotted is the slippage between **Signal Locality** (an operational constraint) and **Bell Locality** (an ontological constraint). This is not mere equivocation; it is a recognized structural distinction in the foundations of physics, often formalized as the difference between *controllability* and *dependence*.

  Here is the careful carve-up of the three notions you are tracking.

  ### 1. Signal Locality (The "No Messaging" Constraint)
  This is your first sense: "nothing I do here changes what you can observe there." In software terms, this is an interface guarantee. It says that the marginal probability distribution of outcomes on your side does not change regardless of what setting I choose on my side.
  *   **Why it matters:** This protects Special Relativity. If this were violated, we could send bits faster than light.
  *   **Status in QM:** Quantum mechanics respects this strictly. You cannot use entanglement to signal.

  ### 2. Bell Locality (The "No Hidden Wires" Constraint)
  This is your second sense: "nothing that happens here *depends* on what you choose there." This is an implementation detail. It demands that the physical state of your particle is fully specified by things in its past light cone, independent of my distant setting.
  *   **The Distinction:** You can have Bell Nonlocality without Signal Nonlocality. This happens if the dependence exists but is "washed out" statistically. Imagine two computers sharing a hidden random seed; their outputs correlate perfectly, but neither user can control the seed to send a message. The dependence is real (violating Bell Locality), but uncontrollable (preserving Signal Locality).
  *   **What Bell Forces:** Bell's theorem proves you cannot have **Bell Locality** and match quantum predictions. You must accept that the physical state of one particle depends on the setting chosen for the other, even if you can't use that dependence to signal.

  ### 3. Measurement Independence (The "Free Input" Constraint)
  This is your third case: the correlation between the source's instructions and the experimenters' later choices. In experimental design, this is the assumption that your input variables are independent of the system's hidden state.
  *   **Why it's treated differently:** Violating Bell Locality (Case 2) changes our ontology (how nature works) but preserves our methodology (we can still trust our experimental settings). Violating Measurement Independence (Case 3) undermines the methodology itself. It implies a "conspiracy" where the universe rigging the particle source also rigges your random number generator to match.
  *   **The Spatial Red Herring:** You noted that both involve spatial separation. The difference isn't spatial; it's causal. Bell Nonlocality implies a influence crossing the gap *during* the experiment. Violating Measurement Independence implies a common cause in the *past* (before the particles left the source) that correlated the settings and the particles. It is called a "conspiracy" because it requires the past to fine-tune itself to hide the theory from us.

  ### The Verdict on the "Sliding"
  The sliding you notice is between **Operational Independence** (Signal Locality) and **Ontological Independence** (Bell Locality).

  Bell's result forces you to give up **Bell Locality** (Ontological Independence). It does *not* force you to give up Signal Locality. Most physicists keep Signal Locality (to save Relativity) and Measurement Independence (to save scientific method), and accept that nature is Ontologically Nonlocal (violating Bell Locality).

  If you wish to preserve Bell Locality, you must instead give up Measurement Independence (Superdeterminism). This is why writers treat the third case differently: it is the only escape route that doesn't require admitting a physical influence across space, but it comes at the cost of assuming the experimental settings were never truly free variables to begin with.
