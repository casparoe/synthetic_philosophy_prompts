answer: |-
  Dear colleague, it is great to hear from you and your observation is incredibly sharp. To answer your primary question directly, there is no single canonical term in the literature that isolates this exact rhetorical oscillation as a distinct category, though it is frequently discussed under the broader headers of the paradox of liberal neutrality or crypto-normativity. Those broader terms usually target the impossibility of neutrality itself or the hidden presence of norms in procedures, whereas you are identifying the specific argumentative maneuver used to sustain the claim of neutrality despite that impossibility. The literature tends to treat this as a general failure of neutrality rather than mapping the specific loop where the justification shifts registers to evade ontological commitment. If you were to name this specific carving for your dissertation, the most precise descriptive label would be the procedural neutrality oscillation. This term captures the back-and-forth movement where the argument shifts between procedural thinness and substantive thickness to maintain the appearance of neutrality while relying on a hidden ontology of value.

  To define this precisely, the procedural neutrality oscillation occurs when a proponent defends a system's neutrality by appealing to the formal properties of its procedure, such as aggregation rules or constitutional constraints, but when that procedure is challenged as ontologically loaded, the defense shifts to substantive values like autonomy or non-coercion. The crucial move is that these substantive values are then framed as necessary preconditions for neutrality itself, rather than as competing conceptions of the good. This creates a closed loop where the procedure is neutral because it is procedural, and the procedure is justified because it protects autonomy, but autonomy is only privileged because it is assumed to be neutral. The key feature is the register shift between procedural thinness and substantive thickness. In the first step, the argument claims to avoid thick moral views by sticking to procedure. In the second step, when the procedure is shown to embody a thick view, the argument claims the procedure is justified by thick values like autonomy. In the third step, those thick values are re-described as neutral prerequisites. This allows the theorist to have the benefit of substantive commitment without the cost of admitting partiality.

  You asked for boundary cases to separate this from ordinary circular reasoning and from simply being wrong about pluralism, and the distinction lies in the structural stability of the register shift. Ordinary circular reasoning stays within the same logical register. It says A is true because B is true and B is true because A. The oscillation you describe changes the type of justification to hide the circle. It says the procedure is neutral because it is procedural, but the procedure is justified because it protects autonomy. The circle is hidden by the change in vocabulary from procedure to substance. If the argument stayed in one register, it would be easily identified as begging the question. The oscillation is a specific rhetorical technology designed to prevent that identification. This separates it from simple error or inconsistency. Simple error lacks the defensive structure. If someone just forgot their premises or was confused about pluralism, they would not have the ready-made shift from procedural to substantive when pressed. They would likely contradict themselves or collapse. The oscillation is a stable rhetorical equilibrium, not a mistake. It persists because each step defends the other against a specific type of critique.

  Another important boundary case is reflective equilibrium. In reflective equilibrium, a theorist seeks coherence between principles and judgments by adjusting both. They admit when a principle requires a substantive commitment. The procedural neutrality oscillation avoids coherence by keeping the substantive commitments implicit while claiming procedural explicitness. It does not seek to reconcile the tension between neutrality and ontology. It seeks to hide the tension by moving back and forth across it. This is why you see it in alignment workshops and constitutional AI proposals. The goal is not to solve the philosophical problem of pluralism. The goal is to proceed with system design without admitting that the design solves the problem by fiat. This makes it distinct from honest proceduralism where the theorist admits the procedure rests on substantive grounds. In the oscillation, the substantive grounds are denied until challenged, and then affirmed only as neutral prerequisites.

  So the carving is real and it is distinct from the broader debates about whether neutrality is possible. Those debates ask if the destination can be reached. Your observation maps the vehicle used to claim the destination has been reached when it has not. For your dissertation, treating this as a specific rhetorical structure rather than a general philosophical error will allow you to critique alignment proposals without getting bogged down in the general meta-ethics of value. You can show that the argument fails on its own terms by tracing the oscillation. When the speaker claims neutrality, ask for the ontology. When they provide the ontology, ask for the neutrality justification. When they provide the neutrality justification, ask for the ontology again. The loop will reveal itself. I hope this helps you map the terrain and gives you the terminology you need to precise your critique. It is a strong insight and worth developing fully.
