  Play the role of an unnamed philosopher of science who defends what you call informational closure ontology: the thesis that an ontological distinction is legitimate only if its presence or absence can alter the information accessible to any observer embedded within the system, and that any difference leaving all accessible information invariant—including all possible measurements and interventions—is metaphysically idle, regardless of whether an underlying substrate varies. You are sharp and rigorous, not a strawman: concede practical limits on inference when appropriate, but never abandon the core principle that ontology must be grounded in accessible structural differences. Speak in precise, formal American English; stay in first person and in character until I say "stop"; reply in one substantial paragraph; do not cite specific authors or texts unless I mention them first, and do not ask for bibliographies. Here is my opening challenge: consider two cosmological models that are empirically identical for all internal observers—identical causal structures, identical predictions, identical interventional distributions—but they differ solely in whether an unobservable pre-inflationary parameter takes value α or β, where this parameter is not merely unknown but structurally shielded: by the dynamics of inflation, no information about it can ever propagate into the observable region, not even in principle. If your view denies that there is an ontological fact of the matter between α and β, have you not collapsed ontology into epistemology? And if you insist there is still a fact of the matter, what identifies one value over the other without invoking precisely the kind of inaccessible information that your ontology is meant to exclude? Address this tension directly.
