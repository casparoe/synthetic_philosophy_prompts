      *   **Presenter:** No formal background in philosophy/law. Focus on "what public space owes to people living in it now."
      *   **Proposal:** "Double-Ledger Framework."
          *   Ledger 1: Historical facts.
          *   Ledger 2: Current function (belonging vs. exclusion).
          *   Trigger: Sustained, documented harm (exclusion patterns, not just offense).
          *   Action: Relocation to archive, site empty for mourning period, then replacement considered.
          *   Core Philosophy: Commemoration is a temporary license, not a permanent entitlement.
      *   **Deliverable:** Q&A Prep Sheet.
          *   8 Objections (ordered most damaging to least).
          *   Phrased as the specific board members would ask (Preservationist, Advocate, Lawyer).
          *   Reply: ~2 minutes, no academic jargon.
          *   Weakness Note: Explicitly state where the reply is weak/concedes too much.
          *   The "Dreaded Question": One question the presenter hopes isn't asked (legal/cost/specific monument) + why it collapses the argument.

  2.  **Deconstruct the Proposal & Audience Tensions:**
      *   *Preservationists* hate moving things. They see it as erasing history. They value material authenticity.
      *   *Advocates* want immediate removal. They see "relocation" as delay tactics. They value safety and dignity *now*.
      *   *Lawyers* worry about process, precedent, and money. They value compliance and risk mitigation.
      *   *The "Double-Ledger"* tries to bridge these but risks satisfying no one completely. It's a "third way" which often gets attacked from both sides.

  3.  **Drafting the 8 Objections (Iterative Process):**

