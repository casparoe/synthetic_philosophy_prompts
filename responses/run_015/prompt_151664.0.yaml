          *   7. The Empty Site (Advocate): Why leave a wound open?
          *   8. Archival Access (Preservationist): Will anyone actually see it?

      *   *Wait, I need to order them by "Most Damaging."*
          *   Legal liability is usually the hardest stop.
          *   But the prompt asks for the "one question I am hoping nobody asks" separately. So the 8 objections should be answerable, just difficult.
          *   Let's make the "Dreaded Question" the one that *actually* collapses the argument (e.g., a specific local monument that is protected by state law, or a cost estimate that is prohibitive).
          *   So, the 8 objections should be the *standard* tough questions.
          *   Revised Order:
              1.  Preservationist: "You're erasing history." (Core philosophical attack)
              2.  Advocate: "Relocation is a delay tactic." (Core urgency attack)
              3.  Lawyer: "Statutory authority." (Feasibility)
              4.  Preservationist: "Context is the site." (Architectural integrity)
              5.  Advocate: "Who defines harm?" (Subjectivity)
              6.  Lawyer: "Liability during the 'mourning period'." (Risk)
              7.  Preservationist: "The archive is a graveyard." (Accessibility)
              8.  Advocate: "Why leave it empty?" (Symbolism)

  4.  **Drafting the Replies:**
      *   *Constraint:* No academic jargon. ~2 minutes spoken (approx. 250-300 words).
      *   *Tone:* Practical, empathetic, firm on principles but flexible on process.
      *   *Weakness Note:* Must be honest.

  5.  **Drafting the "Dreaded Question":**
      *   Needs to be specific. Maybe a specific statue protected by a state law that overrides city board authority. Or the cost of moving a massive monument vs. the budget.
      *   Let's go with a specific local monument protected by state statute. It undermines the "City Board" authority directly.

  6.  **Refining the Content (Self-Correction during drafting):**
