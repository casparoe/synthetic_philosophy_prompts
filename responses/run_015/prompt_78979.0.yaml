answer: |-
  Assumption: I assume you have standard access to philosophical journals and secondary literature on Weber in English.

  ### Brainstorming Candidate Framings

  1.  **Values as Horizon-Setters:** Values function by defining the horizon of the conceivable for a population, rendering certain actions invisible rather than undesirable.
  2.  **Values as Negative Causes:** Values explain conduct causally by preventing alternatives, functioning as a subtractive mechanism rather than a productive one.
  3.  **Values as Constitutive Rules:** Values constitute the meaning of actions within a form of life, such that the conduct cannot be described without them.

  **Commitment:** I commit to **Values as Horizon-Setters**. This framing best captures your hunch about the "space of options" without reducing the explanation to mere semantics. It allows for a causal claim (the horizon shapes the outcome) while avoiding the requirement that every agent consciously consults the horizon.

  **Set Aside:** I set aside **Values as Constitutive Rules**. While philosophically robust, this framing risks collapsing into pure conceptual analysis. If values merely constitute what an action *is*, it becomes difficult to show how they causally explain why one action occurred rather than another, which weakens the bid for a causal theory.

  ***

  ### Research Proposal

  **Title:** The Causal Power of the Unthinkable: Non-Motivational Cultural Explanation

  **Abstract:**
  This project argues that cultural values explain conduct not by motivating agents, but by constraining the field of deliberation itself. It demonstrates that such constraints satisfy counterfactual accounts of causation without collapsing into mere redescription.

  **The Question**
  Do values explain conduct causally when they constrain the field of deliberation, provided this constraint supports counterfactual dependence distinct from motivational stories? The answer sought is affirmative: values are causal when they render alternatives unthinkable, thereby determining outcomes by exclusion rather than induction.

  **The Debate**
  Standing positions leave this open because they share a false dichotomy. Motivational individualism insists values must exist as mental states driving specific acts. Structural holism treats values as macro-variables that correlate with outcomes but lacks a mechanism linking them to agency. Both assume that for a value to explain an action, it must appear in the agent's reasoning or as a brute social fact. Neither accounts for the possibility that values operate by limiting the set of options an agent recognizes as available. Consequently, Weber's thesis remains vulnerable to the charge that it either psychologizes history or redescribes economic shifts as cultural ones. The explanatory burden hangs on whether a constraint on deliberation counts as a cause of the resulting choice.

  **The Approach**
  I will employ conceptual reconstruction of causal models applied to historical explanation. This approach is necessary because the problem is logical, not empirical.
  *   **Why not a historical case study?** Empirical verification presupposes the logic of explanation is settled. We cannot test whether values constrain options until we know what such a claim means.
  *   **Why not formal modelling?** Formal models of social causation typically require variables to be operationalized as positive inputs. They struggle to represent the absence of an option as a causal factor, risking the loss of the phenomenon's semantic content.
  *   **Why not straightforward conceptual analysis?** Pure analysis of 'causation' often ignores explanatory practice. This project must engage with how historians and sociologists actually use cultural explanations to ensure the reconstructed model is usable, not just coherent.

  **Work Plan (Six Months Part-Time)**
  *   **Month 1:** Map the contemporary debate on causal exclusion in the social sciences. Focus on arguments regarding structural constraints versus individual mechanisms.
  *   **Month 2:** Reconstruct Weber's argument in *The Protestant Ethic* specifically to isolate non-motivational passages. Identify where the text suggests options were excluded rather than chosen.
  *   **Month 3:** Draft the 'constraint model.' Define the conditions under which a value limits the field of deliberation without entering individual motive.
  *   **Month 4:** Test the model against counterfactual accounts of causation. Determine if the outcome counterfactually depends on the constraint.
  *   **Month 5:** Draft the response to the redescription objection. Articulate the difference between saying "they did X because Y was unthinkable" and "they did X because they were the kind of people who do X."
  *   **Month 6:** Finalize the manuscript for submission. Integrate feedback from colleagues and polish arguments for clarity.

  **Success and Failure**
  A good result is a manuscript demonstrating that constraint-based explanation satisfies standard conditions for causal inference (e.g., counterfactual dependence) without requiring motivational attribution. It must show that the "unthinkable" is an ontic feature of the social environment, not just an epistemic limit of the observer.
  The project fails if the constraint model collapses back into motivational individualism (i.e., proving that 'unthinkable' just means 'strongly disapproved') or if it proves to be merely epistemic (i.e., we cannot imagine the alternative, but the agent could). The most likely failure mode is conceding that while constraints exist, they are not *causes* but background conditions, thereby losing the claim to causal explanation.

  **Scope**
  The scope is limited to the logic of explanation. I will not attempt to prove empirically that Protestantism actually constrained options for early capitalists. I will argue only that *if* values function as constraints, they can bear causal weight. This protects the project from historical dispute while securing its philosophical contribution.

  **The Philosophical Addition**
  A historian traces the sequence of events; a sociologist measures the correlation between variables. Neither is equipped to validate the logic linking the two. Historians often rely on implicit metaphysical assumptions about agency and cause that go unexamined. This project supplies the necessary validation of those assumptions. By clarifying how culture can be causal without being motivational, philosophy prevents the social sciences from oscillating between reductionism and mystification. It provides the conceptual infrastructure required to make sense of cultural explanation itself.
