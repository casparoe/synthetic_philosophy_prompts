prompt: |-
  I've been trying to make sense of a passage in Hume's essay Of Suicide, the one he wrote around 1755 but didnt publish till after he died. He argues that if old age or sickness makes life unbearable, ending it isnt an affront to providence, because we're just using the general laws of nature the same way a falling tree does, and we dont owe society an infinite duty to stick around for their sake.

  But I'm stuck on something else. In the Treatise he says the self is just a bundle of perceptions with no underlying substance. So if there's no enduring I, what exactly is the agent that decides to stop the stream? Is the choice to die just another fleeting impression, and if so, why should that one impression get to veto all the rest? Or is he quietly smuggling a substantial self back in just for this argument?

  Also, does his claim that we dont harm society by leaving depend on there being a continuous self that can rack up obligations over time? I can't tell if the tension is in his metaphysics or his moral reasoning. Can you help me sort out where the contradiction actually lives?
