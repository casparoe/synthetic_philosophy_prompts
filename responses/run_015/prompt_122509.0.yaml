answer: |-
  # The Metric Validation Protocol

  This procedure is designed to be executed in a 90-minute working session with a data analyst and a stakeholder. It consists of two phases: **Initial Validation** (before the metric governs) and **Suspicion Triage** (when an existing metric behaves oddly).

  ## Phase 1: Initial Validation
  *Apply these five steps in order. If any step triggers a "Stop," the metric cannot be used for the proposed decision. If a step triggers a "Handoff," the metric may only be used if the named human explicitly accepts the risk in writing.*

  ### Step 1: The Validated Envelope
  **Question:** In what specific range of values and system conditions has moving this number historically correlated with moving the goal?
  **Sufficient Answer:** A scatter plot, regression log, or historical incident review showing correlation *within the specific range* we intend to target (e.g., "Between 1 and 5 deploys/day, failure rate dropped. We have no data above 5.").
  **Hand-waving:** "Industry best practices say...", "It stands to reason...", or data from a completely different system/stack.
  **Artifact:** A graph or log excerpt attached to the Charter labeled "Envelope Evidence."
  **Stopping Rule:**
  *   **STOP:** If no historical evidence exists linking *this* metric to *this* goal in *this* system. (Fact: The correlation is unproven).
  *   **HANDOFF:** If the target value lies outside the validated range. (Handoff to **Engineering Director** to accept extrapolation risk).

  ### Step 2: The Indifferent Optimizer
  **Question:** What is the path of least resistance for a competent engineer to move this number without improving the goal, given their current permissions?
  **Sufficient Answer:** A list of at least three concrete, technical behaviors (e.g., "Split one commit into five to inflate deploy count," "Label P2 bugs as P1 to inflate close rate").
  **Hand-waving:** "The team is too professional to game this," or "We would never do that."
  **Artifact:** A list labeled "Optimization Vectors" attached to the Charter.
  **Stopping Rule:**
  *   **STOP:** If the easiest optimization vector actively harms system stability or security. (Fact: The incentive is destructive).
  *   **HANDOFF:** If the optimization vectors are neutral but wasteful. (Handoff to **Team Lead** to confirm capacity for monitoring).

  ### Step 3: The Blindness Profile
  **Question:** What is the single most important aspect of the goal that this data source is structurally incapable of recording?
  **Sufficient Answer:** A specific, named blind spot (e.g., "This tracker records bugs fixed, not bugs prevented," or "This latency metric ignores client-side rendering time").
  **Hand-waving:** "It covers everything that matters," or a list of trivial items.
  **Artifact:** A statement labeled "Signed Blindness" in the Charter, signed by the **Team Lead**.
  **Stopping Rule:**
  *   **HANDOFF:** Always. (This is a value judgment on whether the blind spot is acceptable. Handoff to **Director** to sign the Charter).

  ### Step 4: The Second Channel
  **Question:** What independent signal, computed from a different data source, would move in the opposite direction if this metric were being gamed or failing?
  **Sufficient Answer:** A specific metric definition (e.g., "If Deploy Frequency goes up, Rollback Rate is the second channel," or "If Bug Close Rate goes up, Customer Support Ticket Volume is the second channel").
  **Hand-waving:** "We'll just watch the dashboards," or a signal derived from the same underlying logs.
  **Artifact:** A definition labeled "Triangulation Signal" in the Charter.
  **Stopping Rule:**
  *   **STOP:** If the decision is a hard gate (e.g., launch freeze) and no second channel exists. (Fact: Single point of failure).
  *   **HANDOFF:** If the decision is soft (e.g., OKR progress). (Handoff to **Director** to accept single-signal risk).

  ### Step 5: The Kill Condition
  **Question:** What specific observation will cause us to retire this metric, and when is the review date?
  **Sufficient Answer:** A specific threshold or date (e.g., "If correlation coefficient drops below 0.4," or "Review in Q3").
  **Hand-waving:** "We'll keep an eye on it," or "Until the project ends."
  **Artifact:** A date and threshold labeled "Expiration" in the Charter.
  **Stopping Rule:**
  *   **STOP:** If the answer is indefinite or vague. (Fact: The metric has no lifecycle).

  ---

  ## Phase 2: Suspicion Triage
  *Apply this only when a metric in force appears to be decoupling from reality. Do not use this to define new metrics.*

  ### Step 1: Failure Classification
  **Question:** Based on available artifacts (dashboards, commit history, incident post-mortems), which of the four failure modes is occurring?
  **Sufficient Answer:** Selection of one mode supported by data:
  1.  **Decay:** The world changed; the correlation drifted naturally (e.g., new architecture makes old latency targets irrelevant).
  2.  **Gaming:** Behavior changed to move the number (e.g., commit splitting).
  3.  **Extrapolation:** The number moved outside the Validated Envelope.
  4.  **Measurement Effect:** The act of measuring changed the system (e.g., added logging overhead caused the latency spike).
  **Hand-waving:** "The team is slacking," or "The metric is broken" without evidence.
  **Artifact:** A one-paragraph diagnosis attached to the incident ticket.
  **Stopping Rule:**
  *   **HANDOFF:** If the classification is "Gaming." (Handoff to **Director**; this is a personnel/process issue, not a data issue).
  *   **STOP:** If the classification is "Decay" or "Extrapolation." (The metric is dead. Revert to Phase 1, Step 1).

  ---

  # Artifact: The Metric Charter

  *Copy and paste this into your documentation system. It must be completed before a metric governs a decision.*

  | Field | Entry |
  | :--- | :--- |
  | **Metric Name** | |
  | **Governed Decision** | (e.g., Launch Gate, Promotion, OKR) |
  | **Stated Goal** | (The qualitative outcome, e.g., "Reliability") |
  | **Validated Envelope** | (Range of values where correlation is proven. Attach evidence.) |
  | **Optimization Vectors** | (Top 3 ways to game this without trying. Attach list.) |
  | **Signed Blindness** | (The one thing this metric cannot see. **Team Lead Signature**.) |
  | **Triangulation Signal** | (The independent second channel. If none, Director must sign below.) |
  | **Expiration** | (Review Date or Kill Threshold. **Director Signature**.) |

  ---

  # Case Applications

  ### Case (a): Deployment Frequency & Change-Failure-Rate (Launch Gate)
  *Context: A gate prevents a large service migration unless the team hits specific DORA targets.*

  **Procedure Execution:**
  1.  **Validated Envelope:** *Check.* Do we have data showing that teams hitting this frequency have successful migrations? *Likely No.* DORA metrics track steady state, not migration events.
      *   *Result:* **HANDOFF to Director.** The envelope for "migration success" is unvalidated by "steady state frequency."
  2.  **Indifferent Optimizer:** *Check.* How to pass the gate without migrating safely? *Behavior:* Split the migration into tiny, trivial config changes to inflate frequency while delaying the risky data move.
      *   *Result:* **HANDOFF to Team Lead.** They must monitor commit semantics, not just counts.
  3.  **Blindness Profile:** *Check.* What is missed? *Answer:* Data integrity during the cutover. Frequency doesn't measure data loss.
      *   *Result:* **HANDOFF to Director.** Director must sign that frequency is a proxy for velocity, not data safety.
  4.  **Second Channel:** *Check.* What contradicts this? *Answer:* Rollback rate *during the migration window*.
      *   *Result:* **PASS.** (If rollback rate is added to the gate).
  5.  **Kill Condition:** *Check.* When does this stop? *Answer:* When migration is complete.
      *   *Result:* **PASS.**

  **Outcome:** The metric is allowed to govern *only if* the Director signs the Envelope risk and the Second Channel (Rollback Rate) is added to the gate. Without the Second Channel, the procedure mandates a **STOP** for a hard gate.

  ### Case (b): Bug Counts (Promotion Packets)
  *Context: Engineers are promoted based on "P1s Closed" or "Bugs per Sprint." Goal is Code Quality.*

  **Procedure Execution:**
  1.  **Validated Envelope:** *Check.* Is there evidence that closing more P1s equals higher quality? *Likely No.* High bug counts often mean high debt, not high activity.
      *   *Result:* **STOP.** No historical correlation between "bugs closed" and "system quality" exists in our artifacts. In fact, the correlation is often negative (more bugs = worse code).
  2.  **Indifferent Optimizer:** *Check.* How to move the number? *Behavior:* Split one bug into three tickets; re-open and close bugs to inflate count; label P2s as P1s.
      *   *Result:* **STOP.** The optimization vectors are trivial and destructive to the tracker's utility.
  3.  **Blindness Profile:** *Check.* What is missed? *Answer:* Bugs prevented by good design.
      *   *Result:* (Irrelevant, already stopped).

  **Outcome:** **STOP.** This metric may not govern promotion decisions. The procedure identifies that "Bugs Closed" is an output metric, not a quality metric, and the Validated Envelope is empty.
  **Recommendation:** Replace with "Incident Severity Reduction" or "Time-to-Recovery," which have stronger envelopes for quality.

  ### Case (c): Composite "Developer Productivity Index" (Leadership Dashboard)
  *Context: A weighted sum of commits, reviews, and deploys. Leadership uses it to gauge org health.*

  **Procedure Execution:**
  1.  **Validated Envelope:** *Check.* Has anyone verified that a 10% increase in this Index correlates to 10% more business value? *No.* Composite indices rarely have ground truth.
      *   *Result:* **STOP.** The correlation is unproven.
  2.  **Indifferent Optimizer:** *Check.* How to move the number? *Behavior:* Optimize for the highest-weighted sub-metric (e.g., code reviews) while ignoring the others (e.g., actual shipping).
      *   *Result:* **STOP.** The metric invites sub-optimization.
  3.  **Blindness Profile:** *Check.* What is missed? *Answer:* Deep work, mentoring, architectural planning.
      *   *Result:* **STOP.** The blindness covers the most high-leverage engineering work.

  **Outcome:** **STOP.** The procedure dictates this metric cannot govern resource allocation or health assessments.

  **Script for the Director:**
  > "I ran the validation protocol on the Productivity Index. It fails the 'Validated Envelope' step: we have no data showing that moving this index actually moves business value. It also fails the 'Blindness' step: it structurally ignores high-leverage work like architecture and mentoring. If we continue to use it for decisions, we are optimizing for activity, not output. I recommend we keep it on the dashboard as a *trend line only*, but remove it from any resource or headcount decisions until we can validate it against a second channel like feature lead time."

  ---

  # Limitations of This Procedure

  This procedure is a tool, not a truth machine. It will not save you in the following situations:

  1.  **The Greenfield Problem:** If you are building a system that has never existed before (e.g., a new AI pipeline), there is no historical data for the **Validated Envelope**. The procedure will force a "Stop" or "Handoff" on everything. In these cases, you must rely on qualitative milestones, not quantitative gates, until the system stabilizes.
  2.  **The Contested Goal:** If the organization does not agree on what "Quality" or "Productivity" *is* (e.g., Sales wants features, Eng wants stability), this procedure cannot resolve the conflict. It marks these as **Handoffs to Director**, but if the Director refuses to choose, the metric will fail regardless of the math.
  3.  **Slow Drift:** The **Suspicion Triage** relies on observable decoupling. If a metric drifts away from the goal by 1% per quarter, it will stay within the noise threshold of most dashboards. The procedure cannot detect drift that is slower than the review cycle.
  4.  **Unbounded Blindness:** The **Blindness Profile** requires naming the *single most important* blind spot. In complex socio-technical systems, the list of blind spots is effectively infinite (e.g., team morale, brand reputation). Naming one does not guarantee the others aren't catastrophic.
  5.  **The "Lab Coat" Judgment:** Steps 3 (Blindness) and 4 (Second Channel) look rigorous but are ultimately risk assessments. A Director can sign a Charter that accepts catastrophic risk. The procedure records the warning; it does not prevent the decision.

  **Final Note:** This procedure is designed to make the *cost* of bad metrics visible. It does not guarantee good metrics exist. Sometimes the only honest answer is: "We cannot measure this yet." That is a valid output.
