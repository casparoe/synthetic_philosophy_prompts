  I think your instinct to seek a compromise is correct given the accreditation deadline, but I would advise you to adjust the recommendation slightly before sending it. Declaring the action protected concerted activity is a legal determination the Senate Committee cannot make and the Provost cannot accept without exposing the university to liability if a court or board later disagrees. Instead, I recommend framing this as a period of administrative forbearance and policy discretion. This achieves the same practical result no discipline and proportional pay docking without forcing the administration to take a legal stance that General Counsel has already flagged as risky. I also think you are right to worry that the carve-out for graduating seniors and visa students guts the leverage, but given the accreditation timeline, that harm is non-negotiable. The stronger vulnerability in your plan is not the carve-out but the proposal for binding mediation without a clear deadline for contract ratification. If the union agrees to the carve-out and the administration agrees to forbearance, the mediation needs a hard stop date that aligns with the accreditation window, or you risk extending the uncertainty indefinitely. I have incorporated these adjustments into the draft below, tightening the language around the legal status while keeping the substantive protections you want. I have also ensured the three conceptual points you raised are woven into the reasoning without relying on abstract principles or formatting markers.

  To the Provost from the Senate Committee on Academic Labor

  We are writing to you with urgency regarding the current action by graduate instructors and the impending accreditation deadline. The Committee has reviewed the situation over the past week and heard from the Registrar, General Counsel, and union representatives. Our recommendation is that the administration adopt a posture of administrative forbearance for a defined window running through the accreditation submission date. During this window, the university should refrain from issuing disciplinary warnings or terminating participants, and should dock pay only in proportion to the declared hours withheld, provided the union agrees to a written protocol that includes advance notice of withholding, a cap on the fraction any one instructor can withhold, and a strict carve-out requiring that records for graduating seniors and visa-dependent students be entered within a fixed number of business days. In exchange, the administration must commit to binding mediation on the two stalled contract items with a deadline that coincides with the accreditation window. This path is not without risk, but it is the only viable route to securing the accreditation data without escalating the conflict into a full walkout or a legal battle that will outlast the semester.

  The central conceptual difficulty here is whether withholding the record while continuing to teach constitutes a strike, a slowdown, or something else. General Counsel has characterized this as an unprotected partial strike because the instructors remain in the classroom while withholding specific deliverables. The union argues that the record is a separate work product from the labor of teaching. We find the union's distinction persuasive in this specific context because the records in question are being repurposed. The learning-outcomes assessment forms are not merely administrative artifacts; they are the training data for the AI tutoring pilot your office is launching. When the work product is used to build a system that may eventually evaluate or replace the workers producing it, the claim that the university has an unconditional right to that data weakens. Withholding this data is not sabotage in the traditional sense of destroying property; it is a refusal to provide the raw material for a system the workers reasonably fear will be used against them. Treating this as protected activity for the duration of the dispute acknowledges that the nature of academic labor includes the production of records that carry ethical weight beyond simple employer ownership. If the administration treats this as malicious compliance rather than concerted activity, it risks validating the union's fear that the university views their labor as purely extractive.

  We are also aware that the harm to students in this scenario differs from a traditional strike. In a walkout, harm is concentrated and brief; classes cancel, and the pressure builds quickly for a resolution. Here, the harm is deliberately spread thin and open-ended. Students receive instruction but lack grades and feedback, creating a limbo that is particularly damaging to those nearing completion. The standard reply that harm is the employer's responsibility because they can end it by settling fits awkwardly when the people absorbing the harm are the strikers' own undergraduates. This creates a moral hazard where instructors might feel insulated from the consequences of their action. However, the administration's refusal to settle the contract is also causing harm, and the diffuse nature of this action is a direct response to the legal regime that makes binary strikes risky for precarious workers. To mitigate this, the carve-out for graduating seniors and international students is essential. We acknowledge your concern that demanding this carve-out hands back the only records that actually bite and guts the action. It does reduce leverage. But the harm to a student who cannot graduate or maintain visa status is irreversible, whereas the harm to the accreditation timeline is manageable if the bulk of the data is secured. The committee believes the union will accept this carve-out because it aligns with their stated goal of proportionate harm, and it allows the administration to claim it protected the most vulnerable students without breaking the negotiation stance.

  Finally, we must address the argument from General Counsel that the moral credibility of a strike rests on workers giving up the wage as a costly signal. Counsel contends that a tactic that keeps pay flowing while applying pressure is leverage without sacrifice, inviting an arms race of inventive pressure tactics that erode the framework everyone depends on. There is truth to this. If workers can withhold critical functions while collecting full pay, the incentive to settle diminishes. However, our recommendation includes a proportional docking of pay. This ensures there is a cost to the action, preserving the signal of sacrifice. The difference is that the cost is calibrated to the work withheld rather than the binary all-or-nothing of a traditional strike. This is more honest about the relationship. In a binary strike, workers often continue to prepare lectures or answer emails without pay to maintain relationships with students, blurring the line anyway. A declared partial withdrawal makes the withholding transparent. The risk of an arms race is real, but the current impasse is already an arms race of attrition. The framework everyone depends on is already eroded by two years of stalled negotiations. Recognizing this form of action with proportional pay docking restores a measure of clarity to the exchange of labor for wage without demanding that workers risk destitution to prove their seriousness.

  The vulnerability of this compromise lies in the enforcement of the carve-out and the timeline for mediation. If the administration agrees to forbearance but the union fails to enter the senior records, the accreditation deadline will be missed regardless of our recommendation. Conversely, if the administration agrees to mediation but uses the delay to run out the clock, the union will view the forbearance as a trap. We recommend that the written protocol be signed by both parties within five business days. The mediation must produce a tentative agreement on the two stalled items before the accreditation data is submitted. If either side fails to comply, the forbearance ends and the university reserves the right to pursue full disciplinary action. This gives both sides a clear off-ramp. We understand this asks the administration to concede ground on the legal classification of the action. However, General Counsel's current plan to dock one hundred percent of pay and issue warnings for a twenty percent withholding of labor will be viewed as thuggish by the faculty senate and will likely trigger a full walkout within weeks. The cost of that walkout during accreditation exceeds the cost of recognizing the partial withdrawal. We urge you to accept this recommendation not as a legal precedent but as a pragmatic solution to a specific timeline. We are available to discuss the wording of the protocol immediately.
