  2.  **Deconstruct the Core Tension (Hart vs. Fuller):**
      *   Hart: Law is a social fact (Rule of Recognition). Separation of Law and Morals is conceptual. Bad law is still law.
      *   Fuller: Law is a purposive enterprise (Inner Morality). If it fails the 8 principles (e.g., retroactivity), it's not just bad law, it's *not law*.
      *   The Goal: A theory that doesn't just pick a side but acknowledges the insights of both without collapsing into contradiction.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Validity vs. Worth.*
          *   Requirement: Need to say a rule is legally valid even if immoral, BUT acknowledge that extreme immorality impacts its legal character.
          *   Why real? Because citizens need to know when to obey vs. resist. If validity = worth, we can't criticize law from the outside. If validity $\neq$ worth at all, law loses its normative claim.
          *   Tension: Hart says separate. Fuller says connected.

      *   *Item 2: Retroactivity (The Grudge Informer).*
          *   Requirement: Can't just say "it's law, obey it" (Nazi apology). Can't just say "it's not law, ignore it" (Legal fiction).
          *   Why real? Post-regime justice needs to happen without lying about the past legal system.
          *   Tension: Hart admits it was law but says punish via retroactive statute (honest). Fuller says it wasn't law (comforting but fictional).

      *   *Item 3: Zombie Rules.*
          *   Requirement: Explain why old, unused statutes aren't law anymore, even if not repealed.
          *   Why real? Legal systems prune themselves. If validity is purely source-based (Hart), they stay valid forever. If purpose-based (Fuller), they die when unused.
          *   Tension: Rule of Recognition (source) vs. Efficacy/Purpose (practice).

      *   *Item 4: No Law vs. Bad Law.*
          *   Requirement: A bright line for when a system collapses into tyranny vs. just being unjust.
          *   Why real? Revolution vs. Reform. If every bad law is "no law," anarchy. If no bad law is "no law," totalitarianism.
          *   Tension: Threshold problem.

  4.  **Identifying Joint Unsatisfiability (The "Hard Truth"):**
      *   Hart's Rule of Recognition is *social fact*. It exists because officials accept it.
      *   Fuller's Inner Morality is *evaluative*. It exists because the system functions well.
      *   *The Clash:* You can't have a Rule of Recognition that *automatically* filters out immoral laws (Fuller) while remaining a social fact based on official practice (Hart), unless the officials *happen* to be moral. If officials accept a retroactive rule, Hart says it's law. Fuller says it's not. You can't have both. One must give.

