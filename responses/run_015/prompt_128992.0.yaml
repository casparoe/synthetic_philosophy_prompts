answer: |-
  Here is a desiderata list for a theory of law that actually grapples with the Hart-Fuller debate without dodging the hard bullets. This isn't about who "won"; it's about what a working theory needs to handle to be useful in the real world.

  ### 1. The Separation Requirement (Without the Divorce)
  **The Demand:** The theory must distinguish legal validity from moral worth without claiming they live on different planets. It needs to allow you to say, "This is a valid law, but it is too wicked to obey," without contradicting yourself.

  **Why it's a real requirement:** If validity and worth are identical, you can't criticize the law from the outside (you'd just be saying "this law isn't law"). But if they are totally independent, law loses its normative claim on us—it becomes just organized violence. We need a conceptual gap to allow for civil disobedience, but a connective tissue to explain why we usually obey.

  **The Tension:** Hart wants a clean separation (Separation Thesis). Fuller argues law has an "inner morality" that, if violated, destroys its legal character. You can't have a conceptual gap *and* a necessary connection without some serious philosophical gymnastics.

  ### 2. The Retroactivity Test (The Grudge Informer Case)
  **The Demand:** The theory must handle retroactive criminal statutes (like the Nazi informer cases) without either validating them (apologism) or pretending they never existed (legal fiction). It needs to explain how we can punish someone for an act that was "legal" when committed, without lying about the legal status of that act at the time.

  **Why it's a real requirement:** Post-tyranny transitions need justice. If you say the old statutes were never law, you're engaging in a fiction that undermines respect for the new system. If you say they were valid law and just punish retroactively anyway, you look like you're doing the same thing the tyrants did. A theory needs to navigate the honesty of the transition.

  **The Tension:** Hart says: "It was law, but so wicked we'll pass a retroactive statute to punish them (honest)." Fuller says: "It wasn't law because it violated the inner morality (comforting)." You generally can't have the comfort of Fuller's conclusion with the honesty of Hart's premise.

  ### 3. The Zombie Rule Problem
  **The Demand:** The theory must account for statutes that are technically on the books (properly enacted, never repealed) but haven't been enforced or recognized by officials for generations. It needs to explain when a "Zombie Rule" dies without a formal burial (repeal).

  **Why it's a real requirement:** Legal systems prune themselves. If a theory says a 200-year-old unused statute is still binding law because the "source" was correct, it's out of touch with practice. If it says the law vanishes when unused, it needs to explain *when* that happens without making law too unstable.

  **The Tension:** Hart's Rule of Recognition is based on official acceptance. If officials ignore a rule for 50 years, has the Rule of Recognition shifted to exclude it? Fuller would say a law that isn't administered fails the test of congruence between declared rule and official action. But Hart's formalism struggles to explain why the "source" stops counting without a new "source" (repeal) killing it.

  ### 4. The "No Law" vs. "Bad Law" Threshold
  **The Demand:** There must be a clear line between a legal system that is merely unjust and a system that has ceased to be a legal system altogether.

  **Why it's a real requirement:** This determines the legitimacy of revolution. If every bad law is "no law," then every injustice justifies treating the state as a criminal gang (anarchy). If no amount of badness makes it "no law," then a totalitarian regime retains legal legitimacy right up until it collapses (totalitarianism). We need a threshold for systemic collapse.

  **The Tension:** Hart denies this threshold exists (a legal system can be anything). Fuller implies it does (substantial failure of inner morality = no law). Defining that threshold objectively is the hardest job in jurisprudence.

  ***

  ### The Joint Unsatisfiability Flag
  Here is the hard truth: **You probably cannot satisfy Desiderata 1 and Desiderata 4 while taking Hart's Rule of Recognition seriously.**

  Hart's Rule of Recognition is a **social fact**. It exists because officials *actually* use it. If officials in a regime accept a rule that says "The Leader's word is law, even retroactively," then under Hart's model, that *is* the Rule of Recognition.

  Fuller's Inner Morality is a **functional standard**. It says a system that fails certain principles (like non-retroactivity) isn't doing the job of law.

  If you demand that a theory separates validity from morals (Desideratum 1) but also claims that extreme immorality voids validity (Desideratum 4), you are asking for a Rule of Recognition that automatically filters out immoral rules *unless* the officials accept the immoral rules. If the officials accept the immoral rules (as they did in Nazi Germany), Hart says it's law. Fuller says it's not.
  *   To side with Hart is to fail Desideratum 4 (you admit evil systems are legal systems).
  *   To side with Fuller is to fail Desideratum 1 (you collapse validity into morality).
  *   To try to split the difference is to make the Rule of Recognition unstable (is it a social fact or a moral test?).

  ***

  ### Quick Scorecard on the Hard Ones

  **Pure Legal Positivism (Hart)**
  *   **Validity vs. Worth:** Pass. Clear separation.
  *   **Retroactivity:** Pass (on honesty), Fail (on comfort). Admits it was law, suggests retroactive punishment to fix it.
  *   **Zombie Rules:** Fail. Struggles to explain why they vanish without formal repeal (efficacy is secondary to validity).
  *   **No Law/Bad Law:** Fail. Denies the threshold exists. A legal system can be iniquitous and still be a legal system.

  **Fuller's Natural Law (Procedural)**
  *   **Validity vs. Worth:** Fail (by positivist standards). Collapses them too much; makes validity dependent on moral performance.
  *   **Retroactivity:** Pass (on comfort), Fail (on honesty). Calls the Nazi statutes "not law," which is historically dubious.
  *   **Zombie Rules:** Pass. If a rule isn't administered, it fails the "congruence" principle, so it loses legal character.
  *   **No Law/Bad Law:** Pass (in theory). Provides a threshold (substantial failure of inner morality), but the line is vague.

  **Inclusive Positivism (The "Soft" Positivists)**
  *   **Validity vs. Worth:** Pass (conditionally). Morality *can* be a condition of validity, but only if the Rule of Recognition says so.
  *   **Retroactivity:** Fail. In the Nazi case, the Rule of Recognition *didn't* include morality, so inclusive positivism collapses back into Hart's view (it was law).
  *   **Zombie Rules:** Same as Hart. Depends on what officials recognize.
  *   **No Law/Bad Law:** Fail. Still relies on the social fact of official acceptance. If officials accept the tyranny, it's law.

  **Bottom Line:** A theory that wants to satisfy all four is asking to be a social fact *and* a moral critique simultaneously. That's the Hart-Fuller hangover that hasn't gone away.
