  The bronze upon the lawn is called a GIFT,
  The base insists on permanent MEMORY.
  He rises fixed upon a pedestal of STONE,
  While streets below carry his surname as a NAME.
  My great-grandfather's hand knew the mill's WORK,
  Now we measure the distance, the open SPACE.

  The new plaque sits beside the old in SPACE,
  Neither erases the original GIFT.
  Two versions of history demand their WORK,
  One speaks of gratitude, one of MEMORY.
  We argue over how to say his NAME,
  While silence settles on the weathered STONE.

  The sign is wood, not bronze or weathered STONE.
  A driver turns the corner into SPACE,
  Not thinking of the man, only the NAME.
  He does not weigh the value of the GIFT,
  Or trace the letters into hard MEMORY,
  For him the street is only path to WORK.

  A street gets worn by use, unlike the WORK
  Of statues which stand idle on their STONE.
  Honour sticks to bronze, fades from MEMORY
  When utility carves out a living SPACE.
  We cannot spend a statue like a GIFT,
