answer: |-
  Your arithmetic is correct, and your isolation of the problem is precise. You have put your finger on the central tension in the accuracy-first program: the trade-off between **locality** (evaluating propositions individually) and **global propriety** (deriving coherence norms from the measure itself).

  Here is the breakdown of the structural features, the uniqueness results, and the philosophical implications for the veritist.

  ### (a) The Property: Global vs. Simplex Propriety

  You have correctly identified the algebraic engine. The property required to derive probabilism (specifically normalization, $\sum c_i = 1$) from an accuracy argument without *stipulating* the domain is **strict propriety over the non-negative orthant $\mathbb{R}^n_{\geq 0}$**, rather than merely over the simplex $\Delta^n$.

  *   **Brier Score:** The function $f(x) = \sum (v_i - x_i)^2$ is strictly convex over all of $\mathbb{R}^n$. Its global minimum in expectation is uniquely at $x = q$ for any probability distribution $q$. It does not "need" to know that $x$ is a probability function to tell you that $x=q$ is best.
  *   **Log Score:** The function $f(x) = -\ln x_i$ is strictly convex over $\mathbb{R}_{>0}$, but the expected score $E_q[-\ln x] = -\sum q_i \ln x_i$ has no minimum over $\mathbb{R}^n_{>0}$. As you noted, if you allow $x_i$ to grow without bound, the inaccuracy goes to $-\infty$. The Log score only has a minimum at $x=q$ if you *constrain* the optimization to the simplex (e.g., via Lagrange multipliers enforcing $\sum x_i = 1$).

  **Is this circular?**
  It depends on how you view the "truth-value vectors."
  *   **The Charge:** If you define the truth-values as the vertices of the unit simplex, and you choose a measure (Brier) that measures Euclidean distance to those vertices, you are implicitly building the geometry of the simplex into the measure. You are assuming that the "distance" between belief states is Euclidean and that the truth has "magnitude" 1.
  *   **The Defense (Joyce/Pettigrew):** The truth-values are not arbitrary; they represent the *facts*. In a world where $w_1$ is true, the fact is not just "$w_1$ is true," but "$w_1$ is true and $w_2$ is false..." The vector $(1, 0, \dots, 0)$ represents the total state of affairs. The Brier score measures the distance between your *total doxastic state* and the *total state of affairs*. If your total credence sums to 1.2, you are literally "further away" from the truth vector (which sums to 1) in the geometric space, even if your ratios are correct.
  *   **Verdict:** It is not logically circular, but it is **substantively loaded**. It assumes that credences are coordinates in a Euclidean space where magnitude matters. The Log score assumes credences are densities or betting ratios where only relative proportions matter. To derive probabilism from Log, you must add a separate norm ("Normalize your credences"). To derive it from Brier, the norm falls out of the geometry.

  ### (b) Structural Artifact: The Uniqueness of the Log Score

  Your guess is correct. This is a structural feature of local scoring rules.

  A classic result by **Savage (1971)** and later refined by **Bernardo (1979)** and **Predd et al. (2009)** establishes that:
  > If a scoring rule is **local** (the score for a world depends only on the credence assigned to that world) and **strictly proper** (over the simplex), it must be of the form of the Logarithmic score (plus affine transformations).

  **Implication:**
  If you demand **Locality** (the inaccuracy of believing $A$ should not depend on what you believe about $B$), you are locked into the Log score. If you are locked into the Log score, you **cannot** derive normalization from accuracy alone. You must assume normalization to make the argument work.

  Therefore, the success of the Brier-based argument for probabilism is structurally dependent on **Non-Locality**. The Brier score penalizes you for what you assign to *false* worlds. This "global" sensitivity is exactly what allows it to detect that $\sum c_i \neq 1$.

  *   **Caveat:** There are other non-local proper scores (e.g., the Spherical score). They will also support probabilism over the orthant. But they all share the feature of being sensitive to the whole vector, not just the true cell.

  ### (c) Calibration, Refinement, and the False Cells

  The decomposition of the Brier score is usually:
  $$ \text{Brier} = \text{Calibration} + \text{Refinement} + \text{Uncertainty} $$
  Your observation about splitting the residual mass among false cells relates to the **Refinement** component (sometimes called Resolution).

  *   **The Mechanism:** The Brier score sums squared errors. For the false cells, the error is $(0 - c_i)^2 = c_i^2$. If you have a fixed amount of "error mass" $K = \sum_{false} c_i$, the sum of squares $\sum c_i^2$ is minimized when the $c_i$ are equal (by convexity).
  *   **Interpretation:** The Brier score rewards you for spreading your error evenly among false possibilities rather than concentrating it.
  *   **Relation to the Argument:** This sensitivity is crucial for the dominance argument. If the score were insensitive to the false cells (like Log), you could inflate the true cell to reduce inaccuracy without penalty. The Brier score creates a "tension": increasing credence in the true cell reduces error there ($ (1-c)^2 $), but if that increase comes from "nowhere" (inflation), it increases error in the false cells ($ (0-c)^2 $). The equilibrium point where these tensions balance is exactly where $\sum c_i = 1$.

  So, yes: the Brier score's ability to derive probabilism is intimately tied to its sensitivity to how credence is distributed across the **false** cells.

  ### (d) Partition Dependence and Granularity

  This is the most difficult technical challenge for the Brier-based program. You are right that the absolute value of the Brier score is not partition-invariant.

  1.  **Splitting False Cells:** Lowers the score (as you calculated: $0.08 \to 0.06$).
  2.  **Splitting True Cells:** Raises the score significantly (as you calculated: $0.08 \to 0.56$).

  **Where is the argument run?**
  The standard accuracy-first response (Joyce 1998, 2009; Pettigrew 2016) is that the norm is **partition-relative**.
  *   *Norm:* "For any partition $\mathcal{F}$ you choose to represent your doxastic state, your credences over $\mathcal{F}$ should be probabilistic."
  *   If you refine the partition, the norm applies to the new partition. If you are probabilistic over the fine partition, you are automatically probabilistic over the coarse partition (by summation).

  **Does it collapse in the limit?**
  *   **Brier:** In the limit of infinite refinement (continuous spaces), the Brier score becomes problematic because the truth-value vector becomes a Dirac delta, and the $L_2$ distance behaves poorly with densities (it depends on the reference measure).
  *   **Log:** The Log score converges to the Kullback-Leibler (KL) divergence, which is the standard measure for continuous densities.
  *   **Interaction:** This suggests that Brier is the natural measure for **finite** algebras of belief, while Log/KL is natural for **continuous** densities. However, for the specific project of deriving *Probabilism* (finite additivity), the finite Brier argument is robust. The partition sensitivity does not invalidate the dominance argument; it just means "Inaccuracy" is not an absolute magnitude independent of description, but a relative one. The *ordinal* verdicts (dominance) remain stable within a fixed partition.

  ### (e) The Intuitive Core: Distance vs. Surprise

  You asked for the "shape" of the measure and the veritist's reason for preferring it.

  **The Shape:**
  *   **Log Score:** Measures **Surprise**. It asks, "How shocked would I be if this world turned out to be true?" It treats credences as **betting odds** or **information densities**. It is scale-invariant.
  *   **Brier Score:** Measures **Distance**. It asks, "How far is my doxastic state from the state of the world?" It treats credences as **coordinates** in a belief space. It is scale-sensitive.

  **The Veritist's Reason:**
  Why prefer Distance (Brier) for normative epistemology?
  1.  **Belief is Magnitude:** To be a veritist about *credence* (degree of belief) is to think that there is a fact of the matter about *how much* you believe. Believing $P$ to degree 0.8 and $\neg P$ to degree 0.8 is a specific kind of error: **Overconfidence**. It is not just a ratio error; it is a magnitude error. The Log score cannot see overconfidence unless you tell it to look for it (via normalization). The Brier score sees it inherently because it measures distance from the truth-point $(1,0)$. The point $(0.8, 0.8)$ is geometrically further from $(1,0)$ and $(0,1)$ than $(0.5, 0.5)$ is.
  2.  **Systemic Norms:** Probabilism is a constraint on the *system* of beliefs, not individual propositions. A local measure (Log) evaluates propositions individually. A global measure (Brier) evaluates the system. It is unsurprising that a systemic norm requires a systemic measure to derive it.

  **Conclusion:**
  The failure of the Log score to derive probabilism without domain restriction is not a bug; it is a feature of its locality. It reveals that **Log scores evaluate the quality of information**, while **Brier scores evaluate the coherence of the belief state**.

  If your goal is to argue that agents *ought* to be probabilistic, the Brier score is the stronger tool because it treats the violation of probabilism (incoherence) as a form of inaccuracy (distance from truth) rather than a separate category of error. However, you pay for this with partition sensitivity. The choice ultimately rests on whether you view credences primarily as **tools for information tracking** (Log) or **maps of logical space** (Brier). The accuracy-first program for probabilism generally commits to the latter.
