answer: |-
  The tension you have identified is one of the most rigorously debated problems in Buddhist philosophy, often termed the "Karma-Anatta Problem." It strikes at the intersection of soteriology (the path to liberation), metaphysics (the nature of reality), and ethics (moral responsibility).

  Below is an analysis that distinguishes between doctrinal elements that are well-established across Buddhist philosophical traditions and those that remain genuinely contested among specialists in Buddhist studies and comparative ethics.

  ### I. Well-Established Doctrinal Frameworks

  There is broad agreement across the major Buddhist philosophical schools (Theravada, Sarvastivada, Sautrantika, Yogacara, Madhyamaka) regarding the following foundational premises. These form the "rules of the game" within which the tension must be resolved.

  **1. Volition (*Cetana*) is Karma**
  It is a settled doctrine in the Nikayas/Agamas and Abhidharma that karma is not action *per se*, but the volition (*cetana*) behind the action. As the Buddha states in the *Anguttara Nikaya*: "It is volition, O monks, that I call karma." This locates the moral weight in the intentional structure of the mind rather than the physical movement.

  **2. The Rejection of a Substantial Self (*Atman*)**
  All mainstream Buddhist schools deny the existence of a permanent, unchanging, metaphysical substrate (*atman* or *pudgala* in the substantial sense) that persists through time. To posit such an entity is to fall into the extreme of Eternalism (*sassatavada*).

  **3. The Rejection of Nihilism (*Ucchedavada*)**
  Conversely, all schools deny that death is the absolute end of the causal process. To claim that actions have no future consequences or that the agent is utterly annihilated is to fall into the extreme of Nihilism. The Buddha explicitly framed his teaching as a Middle Way between these two extremes.

  **4. Momentariness (*Ksanikavada*) and Dependent Origination (*Pratityasamutpada*)**
  In Abhidharma systems, existence is analyzed into discrete, momentary events (*dharmas*). Continuity is explained not by identity, but by causal dependence. A later moment arises conditioned by an earlier moment, resembling it closely enough to create the illusion of continuity, much like a flame passing from one candle to another.

  **5. The Two Truths Doctrine (*Satyadvaya*)**
  Particularly in Mahayana, but with roots in early Buddhism, there is a distinction between Ultimate Truth (*paramartha-satya*), which sees only momentary, selfless processes, and Conventional Truth (*samvrti-satya*), which acknowledges persons, agents, and moral accountability.

  ### II. Mechanisms of Continuity: Established Variations

  While the *need* for a mechanism to carry karmic potential is established, the *specific ontological status* of that mechanism varies by school. These are doctrinal solutions, though their philosophical sufficiency is contested.

  *   **Theravada:** Utilizes the *bhavanga-citta* (life-continuum consciousness) to provide continuity between active cognitive moments and between lives.
  *   **Sarvastivada:** Posits that dharmas exist in all three times (past, present, future). A past action retains an ontological status that allows it to project a future result.
  *   **Sautrantika:** Proposes the theory of "seeds" (*bija*). Actions perfume the mental continuum, planting seeds that ripen later.
  *   **Yogacara:** Develops the *alayavijnana* (storehouse consciousness) specifically to solve the problem of where karmic seeds are stored without a self.
  *   **Madhyamaka:** Argues that because all things are empty (*sunya*) of intrinsic nature, causal efficacy is *possible*. If things had fixed natures, change and karma would be impossible.

  ### III. Contested Philosophical Interpretations

  The question of whether karma functions as **moral desert** or **naturalistic conditioning** is not settled. It divides traditional soteriological interpreters from modern philosophical reconstructionists.

  #### 1. The "Moral Desert" vs. "Causal Mechanism" Debate
  *   **The Traditional/Normative View:** Many traditional commentators and some contemporary scholars argue that karma *must* retain normative weight. If karma is merely mechanical cause-and-effect (like gravity), the soteriological urgency to act ethically diminishes. In this view, the universe has a moral texture; suffering is not just a result, but a *fitting* result. This preserves "desert" by attributing moral agency to the causal stream (*santana*) rather than a self.
  *   **The Naturalized/Reductionist View:** Scholars influenced by philosophical naturalism (e.g., Mark Siderits, Jay Garfield) argue that "desert" implies a retributive agent (a cosmic judge or a self) that Buddhism explicitly denies. They propose that karma should be interpreted strictly as psycho-physical conditioning. On this view, "desert" is a useful fiction within Conventional Truth to motivate practice, but ultimately, there is only cause and effect. There is no "ought," only "is."

  #### 2. The Problem of the "Bearer" of Desert
  *   **The Continuity Solution:** One prominent philosophical defense is that moral responsibility attaches to the causal continuum, not a substance. If Moment B is causally dependent on Moment A, Moment B "inherits" the moral liability of Moment A. This is analogous to how a nation pays the debts of its predecessor government without being the exact same collection of citizens.
      *   *Contestation:* Critics argue this smuggles in a "quasi-self." If the continuum is merely a series of distinct events, why should a distinct event in the future suffer for a distinct event in the past? This is the "ownership problem."
  *   **The Pragmatic Solution:** Some scholars argue that "agent" and "desert" are pragmatic designations. We hold persons responsible because it works to reduce suffering, not because it is metaphysically ultimate.
      *   *Contestation:* Opponents argue this reduces karma to social utilitarianism, stripping it of its cosmic soteriological scope (i.e., rebirth).

  #### 3. Does Karma Require a Metaphysical Substratum?
  *   **Yes (Implicitly):** Some scholars (and the historical Pudgalavada school) argued that without a "person" (*pudgala*) that is neither identical to nor different from the aggregates, karma and rebirth are unintelligible. While mainstream Buddhism rejected the Pudgalavada, some modern interpreters suggest that the *alayavijnana* or *bhavanga* functions as a substratum in all but name.
  *   **No (Explicitly):** The dominant philosophical view (especially Madhyamaka and Sautrantika) is that positing a substratum is unnecessary and harmful. They argue that causality does not require a *thing* that moves through time; it only requires conditional relations. To demand a bearer of karma is to succumb to the grammatical illusion that every verb requires a substantial noun.

  #### 4. Comparative Ethics: Parfit and Reductionism
  In comparative ethics, Derek Parfit's *Reasons and Persons* is frequently brought into dialogue with Buddhism. Parfit argues that "reductionism" (no further fact of personal identity) does not undermine responsibility.
  *   **Alignment:** This supports the view that karma can function without a self.
  *   **Contestation:** Buddhist scholars debate whether Parfit's "psychological connectedness" is strong enough to support the *karmic* connection required for rebirth. Parfit's view is secular and this-life focused; Buddhist karma is trans-life. Whether "desert" can survive the transition between lives without a self remains a point of sharp disagreement.

  ### IV. Synthesis: Can Desert be Preserved without a Bearer?

  There is no consensus on whether karma *can* literally function as a theory of moral desert in the absence of a self. However, the philosophical landscape offers three coherent, competing positions:

  1.  **The Illusionist Account:** Desert is a Conventional Truth. It is real enough to guide practice and generate *vipaka* (fruit), but ultimately, there is only suffering without a sufferer. (Common in Madhyamaka and some modern secular Buddhism).
  2.  **The Process-Responsibility Account:** Desert is real, but it attaches to processes, not substances. The causal stream is the "agent." This preserves normative weight without violating *anattā*. (Common in Abhidharma exegesis).
  3.  **The Ethical Naturalism Account:** Karma is not desert at all. It is a description of how intention shapes character and experience. The "normative" feel is a human projection onto a natural law. (Common in naturalized Buddhist ethics).

  ### V. Summary of Established vs. Contested

  | Feature | Well-Established in Tradition | Genuinely Contested Among Specialists |
  | :--- | :--- | :--- |
  | **Definition of Karma** | Karma is *cetana* (volition/intention). | Whether *cetana* implies a normative "ought" or a psychological "is." |
  | **Metaphysics** | No permanent self (*anattā*); Momentariness (*ksanikavada*). | Whether momentariness precludes moral continuity; whether *alayavijnana* is a substratum. |
  | **Continuity** | Explained via Dependent Origination (*pratityasamutpada*). | Whether causal continuity is sufficient to ground *moral desert* (retribution) vs. mere *causality*. |
  | **Truth Status** | Distinction between Conventional and Ultimate Truth. | Whether moral responsibility is valid only conventionally or has ultimate standing. |
  | **Rebirth** | Karma drives rebirth. | Whether rebirth requires a "carrier" of karma that functions like a self. |
  | **Normativity** | Karma motivates ethical conduct. | Whether karma is a moral law (justice) or a natural law (psychology/physics). |

  ### Conclusion

  You are not required to conclude that karma *cannot* function as moral desert, but you must acknowledge that it cannot function as **retributive desert assigned to a substantial subject.**

  If you define "moral desert" as requiring a metaphysical owner who is numerically identical over time, then Buddhist karma is incompatible with desert. However, if you define "moral desert" as the inevitable ethical valence of intentional causality within a stream of continuity, then a coherent case can be made (as seen in the Abhidharma and Yogacara traditions).

  The prevailing philosophical tension remains unresolved: **Is the "person" who experiences the karmic fruit the *same* as the one who acted?**
  *   The **Sautrantika/Madhyamaka** answer is: "Neither the same nor different."
  *   The **Ethical Naturalist** answer is: "The question is misguided; there is only the flow."
  *   The **Traditional Soteriologist** answer is: "It is the same stream, and that is sufficient for justice."

  Current scholarship does not favor one of these as the definitive resolution. The choice often depends on whether one prioritizes metaphysical consistency (favoring naturalism/reductionism) or soteriological efficacy (favoring normative desert).
