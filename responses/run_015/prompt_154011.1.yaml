      *   *Check:* Constraint Check: Did I present one view as consensus? *Correction:* Use phrases like "Many scholars argue," "Traditional exegesis suggests," "A competing interpretation holds."

  7.  **Final Polish:**
      *   Ensure terminology is accurate (*cetana*, *santana*, *vipaka*, *pudgala*).
