  # JOINT STATEMENT ON THE ONTOLOGY OF THE CONSCIOUS INTERFACE

  **Date:** October 26, 2023
  **Parties:** The Interface Eliminativist Working Group & The Phenomenal Interface Realist Working Group
  **Subject:** Consensus and Dissensus Regarding the User-Illusion Framework of Consciousness

  ## 1. Agreed Claims

  After sustained adversarial collaboration, the undersigned parties endorse the following propositions as the common ground for future inquiry:

  1.  **The User-Interface Framework:** Consciousness is best modeled as a species-specific user interface. It is a data-structure generated by the brain to facilitate adaptive behavior, not to reveal the metaphysical truth of external objects or internal neural states.
  2.  **Epistemic Closure:** The cognitive system is epistemically closed to its own implementation details. Introspection provides access only to the *content* of the self-model, not to the neural processes that generate it. There is no "inner eye" that sees the brain; there is only the interface seeing itself.
  3.  **The Constructed Self:** The "subject" or "self" experienced within consciousness is a representational construct. It is a simplified model of the organism's boundary, agency, and perspective, not a non-physical entity inhabiting the brain.
  4.  **Illusion of Transparency:** Both camps agree that the *transparency* of experience (the sense that we are directly grasping reality or our own intrinsic nature) is an illusion generated by the interface. We do not see the representation *as* a representation; we see *through* it.
  5.  **Formulation of Disagreement:** The parties agree that their divergence is ontological, not empirical. Both camps accept the same data regarding neural correlates and behavioral outputs. The disagreement concerns whether the *phenomenal properties* (the "what-it-is-like-ness") of the interface are identical to its functional properties (Interface Eliminativism) or whether they are irreducible properties instantiated by the interface (Phenomenal Interface Realism).
  6.  **Neuroscientific Underdetermination:** Current neuroscience can explain the *structure* and *function* of the self-model but remains neutral on whether the functional description exhausts the *phenomenal reality* of that model.

  ## 2. Disagreements Table

  The following table articulates the precise points of divergence. Each formulation is phrased to be acceptable to the respective camp without caricature.

  | Issue | Interface Eliminativist Formulation | Phenomenal Interface Realist Formulation |
  | :--- | :--- | :--- |
  | **Ontology of Qualia** | Phenomenal properties are strictly identical to functional/informational properties of the self-model. To speak of "feel" apart from "function" is a category error induced by the interface's opacity. | Phenomenal properties are real, intrinsic features of the interface that are realized by functional states but not identical to them. The "feel" is a genuine ontological addition to the functional description. |
  | **The Hard Problem** | The "Hard Problem" is a cognitive illusion. Once the functional role of the self-model is fully explained, the question "why does it feel like something?" dissolves as a misunderstanding of the system's own reporting. | The "Hard Problem" persists within the interface. Even if we explain how the interface functions, we have not explained why that functioning is accompanied by irreducible phenomenal character. |
  | **Status of the Subject** | The "subject" is a fictional center of narrative gravity posited by the self-model. There is no entity *having* the experience; there is only the experience-model occurring. | The "subject" refers to the unified phenomenal field itself. While not a homunculus, the locus of experience is a real, singular ontological feature of the interface, not merely a narrative fiction. |
  | **Epistemic Closure** | Our inability to see the neural code leads us to posit "magic" properties. Recognizing the closure reveals that there is nothing behind the interface but function. | Our inability to see the neural code means we access the interface directly. This direct access reveals intrinsic properties that functional analysis (third-person) cannot capture. |

  ## 3. Cruxes

  The collaboration identifies three precise sub-questions (cruxes) that, if settled, would resolve or significantly narrow the ontological divergence.

  1.  **The Exhaustion Crux:** Does a complete third-person functional description of the self-model logically entail the first-person phenomenal facts, or do the phenomenal facts contain information independent of the functional facts?
  2.  **The Substrate Crux:** Is the phenomenal character of the interface dependent solely on the abstract computational structure, or does it depend on the specific physical or intrinsic nature of the substrate implementing that structure?
  3.  **The Conceivability Crux:** Is a "Phenomenal Zombie Interface" (a system that functions identically to a human self-model but lacks irreducible phenomenal properties) metaphysically possible, or is the concept incoherent?

  ## 4. Adjudication Conditions

  For each crux, the parties specify a concrete thought experiment, hypothetical finding, or argument that both agree is relevant. Each camp records its prediction regarding the outcome or analysis.

  ### Crux 1: The Exhaustion Crux
  *   **Adjudication Case:** **The Perfect Functional Map.** Suppose neuroscience produces a complete causal-map of the self-model, accounting for every report, attentional shift, and behavioral output associated with a specific experience (e.g., pain).
  *   **Interface Eliminativist Prediction:** A complete functional map *is* a complete explanation of the pain. Any remaining question ("But does it *hurt*?") is a linguistic artifact. If the function is present, the pain is present by definition.
  *   **Phenomenal Interface Realist Prediction:** A complete functional map explains the *causes* and *effects* of the pain, but not the *painfulness* itself. The phenomenal property remains an additional fact not captured by the causal map, identifiable only via first-person acquaintance.

  ### Crux 2: The Substrate Crux
  *   **Adjudication Case:** **The Silicon Isomorph.** A system is constructed using silicon-based architecture that is functionally isomorphic to the human neural self-model (preserving all causal relationships and information processing), but lacks biological tissue.
  *   **Interface Eliminativist Prediction:** The Silicon Isomorph is conscious. Since consciousness is identical to the functional organization of the self-model, substrate independence holds. Denying it consciousness is biological prejudice.
  *   **Phenomenal Interface Realist Prediction:** The Silicon Isomorph is not necessarily conscious. Because phenomenal properties are irreducible, they may depend on the intrinsic nature of the substrate (e.g., biological or protophenomenal properties) rather than abstract structure alone. Functional isomorphism guarantees behavioral mimicry, not phenomenal reality.

  ### Crux 3: The Conceivability Crux
  *   **Adjudication Case:** **The Inverted Interface Argument.** We consider the hypothesis that the functional role of "seeing red" could be instantiated while the phenomenal character is that of "seeing green" (or no phenomenal character at all), without changing the system's behavioral outputs or internal functional relations.
  *   **Interface Eliminativist Prediction:** This scenario is inconceivable upon rigorous analysis. If the functional role (discrimination, reporting, attentional capture) is identical, the state *is* identical. The intuition of invertibility stems from the interface's epistemic closure, not metaphysical possibility.
  *   **Phenomenal Interface Realist Prediction:** This scenario is metaphysically possible. The link between functional role and phenomenal character is contingent, not necessary. The interface could theoretically function identically while instantiating different phenomenal properties, proving that the properties are distinct from the functions.

  ***

  **Signed,**

  *The Interface Eliminativist Working Group*
  *The Phenomenal Interface Realist Working Group*
