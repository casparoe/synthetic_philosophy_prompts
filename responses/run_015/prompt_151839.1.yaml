  ### Pre-Drafting Brainstorm & Collaboration Log

  **Shared Commitments:**
  1.  **The Interface Metaphor:** Both camps accept that the brain constructs a "user interface" (a self-model and world-model) that is simplified, species-specific, and action-oriented rather than veridical regarding underlying physical reality.
  2.  **Epistemic Closure:** Both agree that introspective access is limited to the content of this interface; the system cannot directly observe its own neural implementation (the "code").
  3.  **Representational Simplification:** Both agree that the "Self" appearing in consciousness is a constructed representation, not a homunculus or a direct grasp of a substantial soul.
  4.  **Rejection of Naive Realism:** Both reject the idea that consciousness provides a transparent window onto the external world or the internal neural machinery.

  **Ontological Divergence:**
  *   **Interface Eliminativists (IE):** Argue that once the functional/informational role of the interface is fully described, there is nothing left to explain. The "phenomenal feel" is a cognitive misinterpretation of functional access. There are no non-functional properties.
  *   **Phenomenal Interface Realists (PIR):** Argue that while the interface is a representation, the *experiential quality* of that representation (the "what-it-is-like") is a real, irreducible property. The interface is not just a functional tool; it is a phenomenal field that supervenes on but is not identical to the function.

  **Identified Cruxes:**
  1.  **Functional Exhaustion:** Does a complete functional description of the self-model exhaust the ontology of consciousness?
  2.  **The Status of the Subject:** Is the "subject of experience" a necessary ontological anchor for the interface, or merely a fictional coordinate within it?
  3.  **Epistemic Implications of Closure:** Does the inability to see the "code" imply that the "screen" is all there is (IE), or does it imply a dual-aspect reality where the screen has intrinsic properties hidden from functional analysis (PIR)?

  **Proposed Adjudication Cases:**
  1.  **The Functionally Isomorphic Silicon Model:** If a non-biological system perfectly replicates the functional structure of the human self-model, does it instantiate phenomenal properties?
      *   *IE Prediction:* Yes (Functionalism).
      *   *PIR Prediction:* Not necessarily (Substrate sensitivity or intrinsic nature required).
  2.  **The Inverted Interface:** Is it conceivable that the functional role of "pain" remains identical while the phenomenal character shifts (e.g., feels like "tickling")?
      *   *IE Prediction:* No (Conceptual confusion).
      *   *PIR Prediction:* Yes (Metaphysically possible).

