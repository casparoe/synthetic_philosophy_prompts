          *   Specific Cruxes: Offset lottery acceptability, scaling of stringency, survival of reason under non-pivotality/substitution, counterfactual baseline (fixed vs. equilibrium), threshold of moral significance, ex post exculpation.
          *   Specific Analysis: Identify splits within the Participation Camp.
          *   JSON Schema: Exact match required.

  2.  **Deconstruct the Camps:**
      *   **Difference-Makers (DM):** Focus on expected utility/consequentialism. Reason against acting depends on $P(\text{pivotal}) \times \text{Impact}$. Inefficacy thought is answered by uncertainty/thresholds.
      *   **Participation Camp (PC):** Focus on complicity, membership, universalization, or expression. Reason against acting exists even if impact is null, based on the nature of the act or relationship to the harm.
      *   **Internal PC Split:** The prompt hints at this ("coalition of at least two wings").
          *   *Wing 1 (Complicity/Membership):* Focus on being part of the harmful group/practice.
          *   *Wing 2 (Universalization/Expression):* Focus on what the act signifies or what would happen if everyone did it.
          *   *Potential Split Point:* Substitution cases (if someone else buys the chicken, am I still complicit?) or Public-counter cases (if I know I made no difference, is the expression still bad?).

  3.  **Drafting Agreed Claims:**
      *   Need common ground to start the collaboration.
      *   1. Collective harms are real and morally significant.
      *   2. Individual acts can be subject to moral evaluation even in large-scale contexts.
      *   3. Uncertainty about pivotality is empirically common.
      *   4. The "Resolution Problem" (trillionth of a degree) poses a challenge for *measurement*, not necessarily for *ontology* of harm.
      *   5. Both sides agree that *some* individual acts in collective contexts are wrong (e.g., being the sole polluter).
      *   *Refinement:* Keep them tight. Ensure they set up the disagreements without resolving them.

  4.  **Drafting Disagreements:**
      *   Need to capture the core friction.
      *   *DM Formulation:* Must sound like expected utility/causal impact.
      *   *PC Formulation:* Must sound like complicity/integrity/non-consequentialist reasons.
      *   *Status:* Is it substantive (real world difference) or verbal (definition of "reason")?
      *   *Key Disagreements:*
          1.  Source of the reason (Impact vs. Participation).
          2.  Ex post exculpation (Public-counter case).
          3.  Substitution (does transfer of purchase negate reason?).
          4.  Scaling (does reason weaken as group grows?).

  5.  **Drafting Cruxes:**
      *   These are the empirical/conceptual tests that could change minds.
      *   *Offset-Lottery:* DM should accept (expected value equal). PC might reject (clean hands vs. gambling).
      *   *Scaling:* DM says reason shrinks with probability. PC says reason stays constant (complicity doesn't dilute).
      *   *Public Counter:* DM says reason vanishes if $P=0$. PC says reason remains (you joined the queue).
      *   *Resolution:* DM worries about noise. PC says harm is qualitative.
      *   *Updates:* Need honest admissions of where theories break.

  6.  **Addressing the Participation Camp Split:**
      *   *Complicity Wing:* Worried about association with harm. Might buckle on Substitution (if I don't buy, no order placed *by me*).
      *   *Universalization Wing:* Worried about maxims. Might hold firm on Substitution (the maxim is still "buy chicken").
      *   *Prying Case:* The Substitution Case and the Public-Counter Case. If I know I'm not pivotal (Public Counter), Universalizers might still object (expression), but Complicits might feel less tainted if the harm proceeds identically without me. Actually, the *Substitution Case* is the strongest pry. If the chicken is definitely bought by someone else, the Complicitist might say "I didn't fund the harm," while the Universalizer says "I acted on a bad maxim."

  7.  **Formatting and JSON:**
      *   Strict adherence to the requested structure.
      *   JSON must be valid and match the schema exactly.
      *   No markdown in the JSON block (usually best to put it in a code block).
      *   Ensure the "Closing Analysis" addresses the coalition fragility.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I include all 7 cases in the claims/disagreements/cruxes?
      *   *Adjustment:* Ensure the "Binned-purchase" and "Market-incidence" inform the "Counterfactual baseline" crux. Ensure "Offset-lottery" is a specific crux.
      *   *Tone:* Academic, precise, collaborative but adversarial.
      *   *Verbal vs. Substantive:* Be careful not to dismiss everything as verbal. The "Resolution Problem" might be verbal (what counts as a 'difference'), but the "Public Counter" is likely substantive (does knowledge change moral status?).
      *   *PC Split:* Explicitly mention this in the closing and JSON.

  9.  **Final Review against Constraints:**
