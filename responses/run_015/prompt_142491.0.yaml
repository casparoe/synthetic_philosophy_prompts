answer: |-
  # Joint Statement on Individual Contributions to Collective Harm

  ### 1. Agreed Claims

  1.  **Collective harms are real and morally significant.**
      Both sides agree that outcomes like climate change or industrial animal suffering constitute genuine moral bads that demand explanation and mitigation.
  2.  **Individual acts within collective contexts are subject to moral evaluation.**
      Neither side accepts the nihilist view that large numbers render individual agency morally invisible.
  3.  **Empirical uncertainty about pivotality is the standard human condition.**
      Both sides acknowledge that agents rarely know with certainty whether they are the threshold-triggering actor.
  4.  **Measurement resolution does not automatically negate moral significance.**
      Both sides agree that the inability of current models to detect a trillionth-of-a-degree change does not settle whether that change constitutes a harm.
  5.  **Sole-actor cases generate robust reasons against acting.**
      Both sides agree that if an individual were the only contributor to a harm, they would have decisive reason to abstain.
  6.  **Expected value calculations are relevant to moral deliberation.**
      Even the Participation camp accepts that consequences matter, though they dispute whether they are exhaustive.
  7.  **Complicity or participation can generate reasons independent of immediate causal impact.**
      Even the Difference-Making camp accepts that association with harm has some moral weight, though they dispute whether it is foundational.

  ### 2. Disagreements

  | ID | Question at issue | Difference-making formulation | Participation formulation | Substantive / verbal / mixed | Verbal reformulation |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Source of the Reason** | The reason against acting is proportional to the expected causal impact (probability of pivotality × magnitude of harm). | The reason against acting is grounded in the nature of the act itself (complicity, universalizability, or expression) regardless of causal leverage. | Substantive | N/A (This is the core theoretical divergence). |
  | **D2** | **Ex Post Exculpation** | In the Public-Counter case, knowing I am at position 3 of 500 eliminates the reason against acting, as my expected difference is zero. | In the Public-Counter case, the reason remains because I voluntarily joined a harmful practice, even if my specific token was not pivotal. | Substantive | Does moral status depend on the *ex ante* intention or the *ex post* causal fact? |
  | **D3** | **Substitution** | In the Substitution case, if another buyer is certain to purchase the portion I decline, my reason to abstain vanishes (no net change in demand). | In the Substitution case, the reason persists because I have still implicated myself in the harmful transaction, regardless of the substitute buyer. | Mixed | Are we asking "Did I change the outcome?" or "Did I keep my hands clean?" |
  | **D4** | **Scaling of Stringency** | In the Shrinking-Practice case, the reason weakens as the group shrinks (if thresholds become harder to hit) or grows (if individual probability drops). | In the Shrinking-Practice case, the reason remains roughly invariant; joining a practice of 10 or 10 million is equally objectionable. | Substantive | Does the stringency of the duty track the probability of impact or the integrity of the agent? |
  | **D5** | **Counterfactual Baseline** | In the Market-Incidence case, we measure difference against the new equilibrium (price adjustment), not holding others' behavior fixed. | In the Market-Incidence case, holding behavior fixed is the appropriate test for complicity, as equilibrium adjustments obscure individual participation. | Verbal | What is the correct reference class for evaluating "my contribution"? |
  | **D6** | **Resolution Threshold** | In the Resolution case, if the expected difference is below the threshold of detectability/policy relevance, the reason may be negligible or zero. | In the Resolution case, the reason is not negligible because harm is qualitative; a trillionth of a degree is still a degree of harm. | Mixed | Is "harm" defined by detectability/consequence or by the violation of a threshold-independent norm? |

  ### 3. Cruxes

  | ID | Sub-question | Test or case both accept as bearing on it | What would count as settling it | Difference-making prediction | Participation prediction | DM update if wrong | PC update if wrong |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **Offset Lottery Acceptability** | Offset-Lottery Case: Is a 1/1000 chance of removing 1000t equivalent to certain removal of 1t? | Consensus that the lottery is morally permissible (or impermissible) despite equal expected value. | Permissible; expected value is identical, risk neutrality applies to moral goods. | Impermissible; moral integrity requires certainty of non-complicity, not gambling on offsets. | Admit risk-aversion is required for moral goods; expected utility framework needs a risk parameter. | Admit that if expected impact is all that matters, complicity reduces to causal contribution. |
  | **C2** | **Reason Under Non-Pivotality** | Public-Counter Case: I know I am the 3rd of 500; 497 others must abstain to trigger threshold. | Consensus on whether I owe restitution or feel regret after purchasing. | No reason, no regret, no restitution; I causally changed nothing. | Reason remains, regret is appropriate, restitution may be owed for participation. | Admit that knowledge of non-pivotality does not fully exculpate; "reason" includes non-causal elements. | Admit that if knowledge of non-pivotality exculpates, complicity is parasitic on causal potential. |
  | **C3** | **Survival Under Substitution** | Substitution Case: The portion I decline is certainly bought by another. | Consensus on whether abstention is required when demand is perfectly inelastic. | No reason to abstain; the harm occurs identically without me. | Reason to abstain persists; I must not be the one to buy, even if another does. | Admit that "making a difference" is not the only source of moral reasons. | Admit that if substitution negates the reason, complicity is merely a proxy for causal impact. |
  | **C4** | **Scaling with Practice Size** | Shrinking-Practice Case: Same act, 10 participants vs 10 million. | Consensus on whether the reason against acting is stronger in the smaller group. | Reason is stronger in the smaller group (higher probability of pivotality). | Reason is invariant; joining a harmful practice is equally wrong regardless of size. | Admit that membership has independent weight from probability of impact. | Admit that if the reason scales, the "participation" view collapses into a probability-weighted view. |
  | **C5** | **Resolution of Harm** | Resolution Case: Impact is below model/policy detection thresholds. | Consensus on whether an undetectable temperature rise constitutes a compensable harm. | Reason is negligible; moral significance tracks detectable/consequential thresholds. | Reason is significant; any contribution to harm, however small, violates the norm. | Admit that moral significance exists below practical detection thresholds. | Admit that if undetectable changes are morally negligible, the "harm" is defined by consequence, not act. |

  ### 4. Closing Analysis

  The Participation coalition is fragile and likely splits on the **Substitution Case**. The Complicity Wing (focused on funding harm) may concede that if another buyer certainly replaces me, my causal funding role is negated, aligning closer to Difference-Makers. The Universalization/Expression Wing (focused on maxims or symbolism) will hold that the act remains wrong regardless of substitution. This wedge suggests the Participation Camp is not a unified theory but a convergence of distinct non-consequentialist intuitions. The most decisive further case is a variant of the **Public-Counter** where the threshold is known to be impossible to reach (e.g., I am the 501st buyer in a 500-threshold system); if the Participation Camp still asserts a reason here, they are fully divorced from causal efficacy, but if they waver, their view relies on hidden causal assumptions. Genuinely unresolved is whether moral reasons can be fundamentally non-instrumental without collapsing into rule-worship, and whether expected utility can accommodate risk-aversion regarding moral taint without losing its consequentialist core.

