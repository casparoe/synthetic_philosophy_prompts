prompt: |-
  Hi. I work in the policy and democratic services team at a mid-sized unitary council (pop. around 280k — big enough to matter, small enough that everyone knows everyone). Over the last couple of years we keep getting asked to run things by sortition: citizens' assemblies, lottocracy-style standing panels, drawn scrutiny juries, whatever the requester happens to have read about. The asks come from campaign groups, from officers who think a drawn body would unblock something, and from a few councillors who I suspect mainly want to hand off a vote they don't fancy taking. At the moment we say yes or no on vibes, and I want something I can actually run and then defend.

  What I need from you is a decision procedure, in the order I'd run it, for a request landing on my desk:

  - The questions, in order.
  - What counts as a good enough answer to each one, so I can tell when someone has actually answered rather than just asserted.
  - Where the procedure just stops with a no.
  - Where it hands the decision over to a person or to full council because it's a values call rather than a factual one.
  - And be honest about which steps are judgement calls wearing a clipboard.

  Three things I think it has to get right, because that's where our vibes approach keeps breaking down:

  1. Sortition seems to be doing three quite different jobs in these requests, and I dont think one design does all three. Sometimes it's a mirror — the body should look like the city. Sometimes it's a filter — we want people who aren't already captured, who'll actually sit with evidence instead of a line. Sometimes it's a shield — we want the decision taken somewhere that re-election, party whips, local donors and the local paper can't reach. I want the procedure to start by making the requester say which job they want, and then let the design fall out of that: who's in the pool, how many, paid or not, who writes the question and the briefing material, binding or advisory, one-off or rotating.

  2. The pre-commitment problem. Half these requests reach us after officers have already got a preferred option, or with a remit that lets cabinet quietly ignore whatever comes out. I think the procedure should kill those — a consultation that can't bite is worse than no consultation — but I want a test for it that isn't just me disliking the requester.

  3. Who counts as the pool. Our instinct is a stratified sample of residents, but the hard cases nearly always dump the costs on people who aren't a tidy demographic category: one ward next to a proposed facility, commuters who don't live here, under-18s, people only in the city for two years, future residents. And then there's the repeat-draw thing: we've got maybe 40k households, and if we run one of these a year we might end up with a class of professional drawn citizens who come back knowing how the machinery works. I genuinely don't know if that's a bug or a feature, and I want the procedure to tell me rather than me guessing.

  Constraints: about a week per request, around £60k a year total, one analyst who can do a stratified draw if you tell them what to stratify on, and no in-house deliberative-polling expertise. Whatever I recommend has to fit on a page a councillor will actually read, and our monitoring officer has to be able to defend it. We can run at most one real one a year, so the procedure also needs to say which requests to turn down.

  Then please run it, out loud, on three:

  (a) A petition with roughly 8,000 signatures asking for a citizens' assembly to set the city's twenty-year transport plan — congestion charging, bus franchising, a workplace parking levy. My gut says yes: this is exactly the sort of thing assemblies are for.

  (b) A motion from a backbench councillor for a drawn panel to decide members' allowances, the rules on councillors' outside interests, and whether to introduce term limits. This smells like a conflict of interest to me, and also like the one case where the shield job is doing real work.

  (c) A request from a residents' group in the ward next to a proposed waste facility: they want the siting decision made by a drawn panel instead of the planning committee. I'd quite like to say yes to these people, they've been badly messed about for years — but I've got a feeling the honest procedure is going to hand me a no, and if it does I want to understand why before I have to go and say it to their faces.

  One more thing: if the procedure has a branch for "we're drawing from the same pool again next year / can we invite back the people who were good", spell it out, because we're about to hit exactly that.

  Please write it in British English (organisation, favour, recognise, and so on). Ta.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Policy and Democratic Services officer at a mid-sized unitary council (pop. ~280k).
      *   **Problem:** Increasing requests for sortition (citizens' assemblies, panels, juries). Current decision-making is based on "vibes." Needs a robust, defensible decision procedure.
      *   **Requirements:**
          *   Ordered questions/steps.
          *   Criteria for "good enough" answers.
          *   Stop points (automatic "no").
          *   Escalation points (values calls to Council/Cabinet).
          *   Honesty about judgement calls.
          *   Address three specific pain points: Function (Mirror/Filter/Shield), Pre-commitment (can the outcome bite?), Pool Definition (who counts, repeat draws).
          *   Constraints: 1 week per request, £60k/year budget, 1 analyst, no in-house deliberative expertise, max 1 real assembly/year.
          *   Output: One-page style (concise, readable by councillors/MO), British English.
          *   Task: Create the procedure *and* apply it to three specific scenarios (Transport, Allowances, Waste Facility).
          *   Specific instruction: Address the "repeat draw" issue explicitly.

  2.  **Deconstruct the Three Pain Points:**

      *   *Function (Mirror/Filter/Shield):* The procedure must force the requester to define the *purpose*. If the purpose doesn't match the tool, it's a no.
      *   *Pre-commitment:* The council must commit to responding to or implementing the outcome *before* the process starts. If the outcome is predetermined or ignorable, it's unethical and a waste of money.
      *   *Pool:* Needs clear criteria for eligibility. Needs a rule on repetition (to avoid a "professional citizen" class vs. losing institutional memory).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Purpose Check.* Is this actually a job for sortition? Or just consultation?
      *   *Step 2: The "Bite" Test.* Will the council listen?
      *   *Step 3: Feasibility/Budget.* Can we actually do this within constraints?
      *   *Step 4: Pool Definition.* Who is in? Who is out?
      *   *Step 5: Capacity Check.* Do we have space in the annual schedule?

      *Refining for the User's Constraints:*
      *   Needs to be sharp. "Vibes" need to be replaced with binary gates where possible.
      *   Needs to acknowledge the £60k limit. A full citizens' assembly costs £40k-£80k usually. So, maybe only one *big* one a year, or several smaller panels. The prompt says "max one real one a year."
      *   Needs to handle the "Shield" aspect carefully. Councils can't abdicate statutory duties.

      *Structuring the Decision Tree:*
      *   Gate 1: Suitability (The "Job" Test).
      *   Gate 2: Authority & Commitment (The "Bite" Test).
      *   Gate 3: Constituency (The "Pool" Test).
      *   Gate 4: Capacity & Budget (The "Reality" Test).
      *   Gate 5: The "Repeat" Rule.

  4.  **Developing the Criteria (The "Good Enough" Answers):**

      *   *Job:* Must identify if it's Mirror (representative), Filter (deliberative), or Shield (political cover). If it's Shield for a statutory duty, that's a legal no.
      *   *Bite:* Must have a formal response mechanism (e.g., Full Council vote within 3 months).
      *   *Pool:* Must be definable via electoral roll or similar.
      *   *Capacity:* Must fit the £60k and 1/year limit.

  5.  **Addressing the "Repeat Draw" Issue:**

      *   This is a specific request. I need a rule.
      *   *Option A:* Ban repeats entirely (purist).
      *   *Option B:* Allow repeats but cap % (pragmatic).
      *   *Option C:* Allow "alumni" as facilitators or observers, not voters.
      *   *Decision:* Given the small population (280k) and potential for "professional citizens," a cooling-off period is best. Say, 3 years before eligibility returns. This balances experience with freshness.

  6.  **Applying the Procedure to the Three Scenarios:**

      *   *(a) Transport Plan:* High strategic value. Fits "Filter" (evidence-based). Fits "Mirror" (city-wide impact). Costly but fits the "one big one a year" slot. Pre-commitment is key (will Cabinet bind themselves?).
      *   *(b) Councillor Allowances:* This is the "Shield" job. But can a council shield itself from setting its own pay? Standards Committee usually does this. Independent Remuneration Panel is the standard. Sortition here is risky (conflict of interest, statutory requirements). Likely a "No" or "Escalate to Monitoring Officer."
      *   *(c) Waste Facility:* This is Planning. Planning decisions *must* be made in accordance with the development plan and material considerations. A citizens' panel cannot override planning law. This is a hard "No" on legal grounds, even if emotionally sympathetic.

  7.  **Refining the Tone and Format:**

      *   British English (organisation, favour, programme).
      *   Professional, bureaucratic but honest ("judgement calls wearing a clipboard").
      *   Concise enough for a councillor to read.
      *   Structure: The Procedure first, then the Application.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is £60k enough for a full assembly?
      *   *Adjustment:* Be realistic. £60k covers one *substantial* process or 2-3 smaller panels. The procedure needs to reflect that trade-off.
      *   *Critique:* The user asked for "Where it hands the decision over."
      *   *Adjustment:* Add specific escalation points (e.g., Monitoring Officer for legal, Full Council for strategic priority).
      *   *Critique:* The "Shield" function is tricky. Councils can't delegate statutory decisions to random people.
      *   *Adjustment:* Clarify that Sortition can *recommend*, but elected members must *decide* on statutory matters. If the request wants the panel to *decide*, it's a No.

  9.  **Final Polish:**

      *   Check against the "One Page" constraint (mentally). Keep headings clear.
      *   Ensure the "Repeat Draw" rule is explicit.
      *   Ensure the three scenarios are analysed using the *exact* steps of the procedure.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **SUBJECT:** Sortition Request Decision Procedure (v1.0)
  **TO:** Democratic Services / Monitoring Officer / Cabinet
  **FROM:** Policy & Democratic Services Team
  **DATE:** October 2023

  ### Context
  This procedure governs requests for sortition-based bodies (Citizens' Assemblies, Panels, Juries). It replaces ad-hoc approval. Its purpose is to ensure sortition is used only where it adds democratic value, is legally sound, and fits within resource constraints (£60k/annum budget; max one major process per year).

  ---

  ### The Decision Procedure

  **Step 1: The Function Test (Mirror, Filter, or Shield?)**
  *The requester must define the primary function. If they claim all three, the design is flawed.*
  *   **Mirror:** The body must demographically represent the population (e.g., strategic plans affecting everyone).
  *   **Filter:** The body must process complex evidence free of partisan ideology (e.g., ethical dilemmas, technical trade-offs).
  *   **Shield:** The body absorbs political risk for a contentious decision (e.g., cutting services, siting facilities).
  *   **Pass Criteria:** Requester identifies *one* primary function.
  *   **Fail (Stop):** Request is for "consultation" only (use standard public engagement). Request is for "Shield" on a statutory duty that cannot be delegated (see Step 2).
  *   **Judgement Call:** Distinguishing between a genuine "Filter" need and a "Shield" attempt to avoid accountability.

  **Step 2: The Pre-Commitment Test (Can the outcome bite?)**
  *Sortition is unethical if the authority has already decided the outcome.*
  *   **Requirement:** The relevant Decision-Making Body (Cabinet, Committee, or Full Council) must agree *in advance* to:
      1.  Receive the recommendations formally.
      2.  Publish a response within 3 months.
      3.  Implement recommendations unless there is a recorded, reasoned justification for rejection.
  *   **Pass Criteria:** A motion of commitment is passed *before* recruitment begins.
  *   **Fail (Stop):** Officers or Members indicate a preferred outcome is already fixed, or the remit is too narrow to allow genuine deliberation.
  *   **Escalation:** If the request implies delegating a statutory decision (e.g., Planning, Budget Setting) to the panel, refer to Monitoring Officer immediately. Sortition can advise, not decide.

  **Step 3: The Pool Definition Test (Who counts?)**
  *The eligibility pool must be definable, reachable, and fair.*
  *   **Standard:** Electoral Roll residents (18+).
  *   **Exceptions:** Must be justified by the Function Test.
      *   *Under-18s:* Permissible for education/youth services (requires parental consent).
      *   *Non-residents (commuters/future residents):* Permissible only if the impact falls disproportionately on them (e.g., a regional transport hub).
      *   *Hyper-local (one ward):* Permissible only for ward-specific budgets, not strategic planning.
  *   **Pass Criteria:** A clear data source exists to draw the sample (e.g., Electoral Roll, Council Tax records).
  *   **Fail (Stop):** The pool is too diffuse to sample randomly (e.g., "everyone affected by climate change") or excludes protected groups without justification.

  **Step 4: The Capacity & Priority Test**
  *We have one major slot and £60k per year.*
  *   **Costing:** Minor Panel (£15k), Major Assembly (£50k–£60k).
  *   **Pass Criteria:** Request fits within remaining budget and the single annual slot.
  *   **Fail (Stop):** Budget exceeded or slot filled.
  *   **Escalation:** If two "Major" requests arrive, the decision on priority goes to Full Council via the Business Committee. Do not decide this in Democratic Services.

  **Step 5: The Repeat Draw Rule**
  *To prevent a class of "professional citizens" while retaining institutional memory.*
  *   **Rule:** Any individual selected for a sortition body is ineligible for selection for **three years**.
  *   **Exception:** Alumni may be invited back as *observers* or *facilitators* (non-voting), provided they declare their prior participation.
  *   **Rationale:** Three years covers a full electoral cycle, ensuring fresh perspectives while preventing burnout or capture.

  ---

  ### Application of Procedure to Current Requests

  Here is the procedure applied to the three live requests on your desk.

  #### (a) Transport Plan (Petition, 8k signatures)
  *   **Step 1 (Function):** **Filter/Mirror.** This is strategic, city-wide, and requires weighing evidence (congestion vs. cost). *Pass.*
  *   **Step 2 (Pre-commitment):** **Risk.** Cabinet must agree to treat the Assembly's recommendations as the baseline for the Local Transport Plan. If Cabinet intends to cherry-pick, this fails. *Condition:* Require a Cabinet motion of commitment before recruitment.
  *   **Step 3 (Pool):** **Electoral Roll.** Commuters are relevant, but hard to sample. Stick to residents for legitimacy, but survey commuters separately to feed evidence to the Assembly. *Pass.*
  *   **Step 4 (Capacity):** **Major Slot.** This will cost c.£55k. It takes the year's major slot. *Pass (but blocks other major requests).*
  *   **Step 5 (Repeat):** N/A (New process).
  *   **Verdict:** **PROCEED**, subject to Cabinet pre-commitment motion. This is the correct use of the tool.

  #### (b) Councillor Allowances & Term Limits (Backbench Motion)
  *   **Step 1 (Function):** **Shield.** This is explicitly to protect members from voter backlash on pay and power.
  *   **Step 2 (Pre-commitment):** **Fail.** Statutory duty. The Independent Remuneration Panel (IRP) already exists for allowances. Term limits are a constitutional matter for Full Council.
  *   **Legal Check:** A sortition body cannot set member pay; this is a statutory function of the IRP and Full Council. Delegating this creates a governance conflict.
  *   **Verdict:** **REJECT.** Refer requester to the existing Independent Remuneration Panel process. For term limits, this is a constitutional change for Full Council to vote on directly; outsourcing it abdicates elected responsibility.

  #### (c) Waste Facility Siting (Residents' Group)
  *   **Step 1 (Function):** **Shield.** The group wants the panel to take the heat for a NIMBY decision.
  *   **Step 2 (Pre-commitment):** **Fail (Legal).** Planning decisions *must* be made in accordance with the Development Plan and material considerations under the Town and Country Planning Act. A citizens' panel cannot be the Decision-Making Body. If the panel recommends a site that violates planning law, we cannot implement it. If they recommend a site that complies, the Planning Officer should have already identified it.
  *   **Step 3 (Pool):** **Hyper-local.** Drawing only from the affected ward creates a biased sample (NIMBY risk). Drawing city-wide dilutes the impact on those most affected.
  *   **Verdict:** **REJECT.** Explain that Planning Committee is legally bound by planning law, not public opinion.
      *   *Alternative Offer:* Offer a **Design Panel** (advisory only) to mitigate visual/environmental impact *after* the principle of the site is established, or a standard consultation on the Environmental Impact Assessment. Do not promise a decision-making role.

  ---

  ### Notes for the Monitoring Officer (Defensibility)

  1.  **On the "Shield" Function:** We must be clear that sortition cannot absolve elected members of statutory liability. If a request asks for a "binding decision" on a statutory duty (Planning, Budget, HR), the answer is legally no.
  2.  **On the "Repeat" Rule:** The three-year cooling-off period is defensible as preventing "consultation fatigue" and ensuring broad civic participation, aligning with the democratic principle of rotation.
  3.  **On Judgement Calls:** Step 1 (Function) and Step 4 (Priority) are political judgements. This procedure ensures those judgements are made explicitly (via Cabinet or Full Council) rather than implicitly by officers.

  **Recommendation:** Adopt this procedure immediately. It allows us to say "Yes" to (a) with confidence, and "No" to (b) and (c) with legal and procedural backing.
