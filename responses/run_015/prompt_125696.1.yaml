  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address Dennett's Cassette theory correctly? Dennett actually critiques the idea that there's a definite story *at all*. The "Cassette" is often used to explain how we *think* it works, but Dennett argues the content is indeterminate until recalled. I should mention this indeterminacy.
      *   *Check:* Did I address Malcolm's view on "suffering"? Malcolm argues you can't be frightened *in* a dream because fright implies a subject experiencing it, and for Malcolm, the subject is only present upon waking. I need to highlight this regarding the "frightening" aspect of nightmares.
