answer: |-
  Mary exits the room and views a red patch. Upon viewing, she sincerely asserts, "This experience is identical to neural state N," deploying a demonstrative concept fixed by the present experience. However, due to a specific functional dissociation, her sensory processing fails to consolidate into dispositional capacities. Once the patch is removed, she cannot summon an image of red, cannot identify red among colored squares after a ten-second delay, and cannot describe the quality from memory. She retains all physical facts and the capacity to form the identity judgment only while the stimulus is present. The experience provides a cognitive grasp unavailable in the room, yet she lacks the standard triad of abilities permanently.

  1. **Verdicts:**
     - **Ability Hypothesis:** Mary does *not* know what it is like. The theory defines phenomenal knowledge strictly as the possession of abilities (to imagine, recognize, recall). Since the scenario functionally specifies that Mary lacks these abilities permanently, she fails the necessary and sufficient conditions for knowledge on this view.
     - **Phenomenal Concept Strategy:** Mary *does* know what it is like. The theory defines phenomenal knowledge as possessing a concept that refers to a physical state under a phenomenal mode of presentation, enabling new propositions. Mary deploys a demonstrative phenomenal concept ("this experience") and forms the identity proposition while the stimulus is present. The lack of downstream dispositions does not negate the possession of the concept or the propositional knowledge gained in that moment.

  2. **Key Feature:**
     The work is done by the dissociation between *occurrent conceptual grasp* and *enduring dispositional abilities*. If Mary could imagine or recognize red, the Ability Hypothesis would concede she knows, collapsing the divergence. If she could not even form the demonstrative judgment while viewing the patch, the Phenomenal Concept Strategy would concede she lacks the concept, also collapsing the divergence. The case tests whether knowledge requires enduring capacities or only transient conceptual access.

  3. **Property Dualism:**
     The dualist verdict remains unchanged: Mary knows a non-physical property. The dualist holds that acquaintance with the experience itself constitutes knowledge, regardless of conceptual packaging or behavioral abilities. This case does not independent work against physicalism; it merely forces the physicalist camp to fracture. Both physicalist replies still deny new non-physical properties; they only disagree on how to categorize the physicalist-friendly gain.

  4. **Strongest Attack:**
     **Attack (against PCS):** A phenomenal concept severed from every recognitional and imaginative disposition is not a phenomenal concept at all. Concepts are individuated by their functional role; if the role includes guiding recognition and imagination, a state that cannot do this is merely a sensation, not a concept. Thus, the strategy never applies.
     **Reply:** This conflates the *ground* of the concept with its *consequences*. The concept is grounded in the subjective character of the experience itself, which Mary possesses. The deficit lies in the memory and imagery systems required to deploy the concept *after* the experience ceases, not in the conceptual grasp *during* the experience. The knowledge is real but ephemeral.

  5. **Closing Verdict:**
     This case shows the two replies are making substantive, testable claims about cognitive architecture, not merely quarreling over the word "knowledge." They disagree on whether phenomenal knowledge is essentially practical (requiring enduring skills) or representational (requiring only conceptual access). Because they predict different functional profiles for the subject—one requiring robust dispositional capacities, the other permitting transient conceptual grasp—the dispute is metaphysical and psychological, not merely verbal.
