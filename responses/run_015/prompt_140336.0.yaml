prompt: |-
  I keep going back and forth on what you're even supposed to do when you're not sure which moral theory is true, and every paper I pick up just proposes a procedure and defends it, so I want the spec before I read more of them. Write me the desiderata that an account of decision-making under moral uncertainty has to meet to be good enough for someone who actually has to choose — output an action for a one-off high-stakes case, not a verdict about what's subjectively right in the abstract — with the motivating case behind each requirement and a note on which ones are non-negotiable and which are really just the prejudices of one camp. The cases I want covered: theories that disagree about what the options even are (one says you may lie, the other says lying isn't available to you as an option at all); theories that disagree about whether intertheoretic value is comparable or even cardinal, like being ninety percent on some kind of utilitarianism and ten percent on a rights view that says certain acts can't be traded off at any probability however small; a theory you barely believe in that nonetheless threatens to swamp the calculation because the stakes it assigns are astronomically larger; cases where following the procedure predictably changes which theories you'll believe later, including a theory that tells you to make yourself more confident in it or to get rid of evidence that would move your credences; and being uncertain both about the first-order moral theory and about which procedure for handling that uncertainty is correct, without the second-order regress eating itself. I'd also want to know what the procedure owes us about blame and regret when you act on your best judgment and the theory you gave most credence to turns out to be wrong. Tell me which of these demands are the ones I should drop — which are genuine requirements on any such account and which are smuggled in from outside (I suspect the anti-fanaticism one is, but argue either way) — and whether any two of the desiderata on your list can't be jointly satisfied, especially whether you can have both proper sensitivity to small credences in enormous-stakes theories and any immunity at all to being blackmailed by a view you basically don't believe. Then a couple of sentences on which single requirement knocks out the most contenders; I don't need a full scorecard. And please write it as continuous prose, no headings or bullet points or bold or tables, like an email.
