answer: |-
  Hi, I know the frustration of reading paper after paper that sells a specific mechanism as the solution without first agreeing on what the problem actually requires, so here is the specification you asked for regarding decision-making under moral uncertainty. To be action-guiding in a one-off high-stakes case, the account must first solve the structural disagreement problem where theories disagree on the available option set, such as when one theory treats lying as a permissible choice and another treats it as metaphysically or morally unavailable. The procedure must define the choice set independently of any single first-order theory, likely by taking the union of physically possible actions, so that you can actually evaluate the forbidden option against the permitted ones rather than having the decision vanish because one theory vetoed the menu. Second, the account must handle intertheoretic comparability and cardinality, providing a method to weigh ninety percent credence in a utilitarian view against ten percent credence in a rights view that claims certain acts are lexically forbidden regardless of consequences. This requires a common currency of choice-worthiness or a robust ordinal ranking system that allows trade-offs without assuming all values are measurable on the same scale, otherwise the calculation cannot proceed. Third, you need a constraint on fanaticism to handle cases where a theory you barely believe in threatens to swamp the calculation because it assigns astronomically larger stakes, demanding that the procedure either limits the influence of low-probability high-stakes theories or accepts that rationality requires bowing to them. Fourth, the procedure must ensure epistemic stability so that it does not recommend actions that predictably manipulate your credences in ways that undermine the decision process itself, such as following a theory that instructs you to ignore evidence or artificially inflate your confidence in it. Fifth, the account must address the regress problem where you are uncertain about the decision procedure itself, requiring a stopping point where you act on your best judgment about the method without needing an infinite hierarchy of meta-decisions. Finally, the account must distinguish between ex ante rationality and ex post correctness to clarify what it owes you regarding blame and regret, specifically ensuring that if you act on your best judgment and the theory you favored turns out to be objectively wrong, you are not subject to moral blame even if the outcome is disastrous.

  When we look at which of these are non-negotiable versus smuggled prejudices, the demand for immunity to fanaticism is the clearest candidate for a prejudice of bounded human psychology rather than a requirement of rationality. If you accept expected choice-worthiness maximization as the core engine of decision-making under uncertainty, you cannot simultaneously demand sensitivity to credences and stakes while also demanding immunity to being blackmailed by a view you basically do not believe. These two desiderata cannot be jointly satisfied if a theory posits unbounded utility, because linearity of expectation dictates that any non-zero credence in an infinite stake dominates any finite stake regardless of probability. You must drop one, and if you want a procedure that is formally consistent with standard decision theory, you have to drop the anti-fanaticism requirement and accept that rationality might demand absurd sacrifices for tiny probabilities of infinite value, though practically you might need a heuristic override. You should also drop the demand for a complete solution to the regress problem, as requiring a justified procedure for choosing your decision procedure leads to an infinite chain; instead, you should accept a brute fact about your reflective equilibrium where you simply act on the metanormative theory you currently find most plausible without further justification.

  Regarding blame and regret, the requirement is that the account must separate the evaluation of the decision from the evaluation of the outcome, meaning blame tracks whether you followed the correct procedure given your uncertainty, not whether you matched the objective moral truth. This is non-negotiable for any account that claims to guide action under uncertainty, because if blame tracked objective truth, uncertainty would be irrelevant and you would be paralyzed whenever you lacked omniscience. The single requirement that knocks out the most contenders is the demand for intertheoretic comparability, because most proposed procedures implicitly assume we can compare units of utility across disparate moral frameworks without providing a metaphysical basis for doing so. If you cannot compare the value of a utilitarian good against a deontological constraint on a common scale, expected value maximization fails, and ordinal methods often fail to yield a unique action in high-stakes cases, leaving you with no output at all. So if you want a procedure that actually outputs an action in the hard cases you described, you must either assume comparability is possible or accept a method that works without it, and the latter eliminates almost all existing models in the literature. I hope this helps you filter the reading list, as most papers will fail on comparability or fanaticism alone. Best of luck with the research.
