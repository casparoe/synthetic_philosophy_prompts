answer: |-
  A surgical resident is protocol-bound to cauterize only upon detecting two distinct vessel pulses, not a continuous glow. During a high-speed procedure, the vessel emits two rapid pulses that physically mimic a glow, the resident's hand moves, and the post-op report states, "I saw a continuous glow." The hospital board must determine negligence: if the resident's motor system tracked the physical pulses (producing micro-jerks in the surgical video) while memory later falsified the narrative, they followed protocol despite a memory error; if their motor system tracked the fabricated glow (producing a smooth motion), they violated protocol by reacting to a non-mandated stimulus. The verdict hinges on whether the surgical video shows jerkiness matching the pulses or smoothness matching the report, without recourse to neural data.

  **What each hypothesis predicts about the verdict and why:**
  Under the **Orwellian** hypothesis, the visual system correctly registered the two pulses and drove the motor command (jerky hand motion), but the narrative memory was revised later to "glow." The verdict is **not negligent**, because the functional reaction matched the safety protocol (reacting to pulses). Under the **Stalinesque** hypothesis, the visual system fabricated the "glow" experience *before* it guided action, so the motor command was smooth (matching the hallucination). The verdict is **negligent**, because the resident reacted to a stimulus that violated protocol (glow), even if the physical reality was pulses.

  **The one feature doing the separating work:**
  The kinematic correlation between the motor output and the physical stimulus. In the Orwellian case, the hand motion correlates with reality (pulses) despite the report correlating with illusion (glow). In the Stalinesque case, both hand motion and report correlate with the illusion. This triangulation uses the physical world as a reference point to distinguish whether the "illusion" infected the motor stream.

  **What's left of the case if you remove that feature:**
  If the surgical video is low-resolution or the hand motion is too subtle to distinguish smooth from jerky, the motor data becomes ambiguous. We are left with only the physical stimulus log and the verbal report, which are identical in both hypotheses (Reality: Pulses; Report: Glow). Without the motor kinematics, the verdict cannot distinguish between a memory error and a perceptual fabrication, collapsing back into the user's failed keypress scenario where behavior and report dissociate but don't reveal *which* stage was falsified.

  **The strongest line a Dennett-style skeptic has for concluding there was no difference to find in the first place:**
  Dennett would argue that positing a "motor stream" vs. "speech stream" doesn't rescue the distinction; there is no central "consciousness" that either receives the truth (Orwellian) or the lie (Stalinesque). There are only multiple drafts of narrative fragments. If the motor draft says "pulses" and the speech draft says "glow," there is no further fact about which one was "experienced." The question of whether the falsification happened "before" or "after" experience is empty because experience *just is* the disposition to report/act. If the resident functionally reacted to pulses (jerky hand), they are competent; labeling the internal process Orwellian or Stalinesque adds no explanatory power to the verdict.

  **Commitment:**
  **No**, the case does not actually separate them. The best reason to think I am wrong is that the verdict *should* be based on the functional output (the hand motion), not the metaphysical status of the experience. If the hand moved in jerks matching the pulses, the resident *did* follow protocol functionally, regardless of whether the "glow" report was a memory revision or a perceptual fabrication. The distinction only matters if we care about "phenomenal blame" (what it felt like), which is not third-party settleable. By making the verdict depend on the motor output, I have inadvertently proven Dennett's point: the functional records are all that exist, so the Orwellian/Stalinesque label is redundant.
