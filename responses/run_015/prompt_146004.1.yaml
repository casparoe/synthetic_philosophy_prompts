answer: |-
  David Lewis's seminal critique of penal substitution rests on a deontological intuition about the nature of punishment: that it is essentially retributive and inextricably bound to personal desert. In "Do We Believe in Penal Substitution?" (1997), Lewis argues that while compensation can be transferred (a third party can pay my debt), punishment cannot (a third party cannot serve my prison time). To punish an innocent volunteer for the crimes of a guilty offender is not to achieve justice, but to commit a second injustice against the volunteer while allowing the offender to evade their moral debt.

  However, Lewis's rigorous distinction between *transferred desert* and *personal liability* provides the very tools necessary to defend a restricted form of institutional vicarious liability. By repurposing Lewis's insistence that punishment must track agency, we can argue that collective agents (like corporations) may justly bear penalties that functionally substitute for individual punishment, provided these penalties are understood as **structural accountability** rather than **metaphysical substitution**. This position avoids Lewis's core objection by rejecting the premise that the corporation is an "innocent volunteer," instead positing it as a co-principal offender. This defense, however, requires a specific philosophical commitment: **Non-Reductive Collective Moral Agency.**

  ### Lewis's Core Objection: The Inalienability of Desert

  To repurpose Lewis, we must first accept his baseline constraint. Lewis argues that punishment is not merely the infliction of suffering; it is the infliction of suffering *on the guilty*. The moral logic of punishment requires an identity between the agent who committed the wrong and the subject who bears the penalty.

  In ordinary criminal justice, if Employee A commits fraud, and the State fines Corporation B instead, Lewis would initially object. If Corporation B is viewed merely as a bundle of assets owned by shareholders (who are innocent of the fraud), then fining the corporation is tantamount to punishing the innocent shareholders for the crimes of Employee A. This is classic vicarious punishment: the suffering is transferred, but the desert is not. Lewis would deem this unjust because it severs the link between moral agency and liability.

  ### Repurposing Lewis: Structural Accountability as Original Liability

  The repurposing of Lewis occurs when we challenge the description of the corporation as an "innocent third party." We can defend institutional liability not by claiming the corporation absorbs the employee's guilt (which Lewis rightly forbids), but by claiming the corporation incurs its *own* distinct guilt through structural failure.

  In this model, the penalty imposed on the corporation **functionally substitutes** for individual punishment (the individual may not be prosecuted due to evidentiary diffusion or resource constraints), but it does not **metaphysically substitute** for individual desert. The corporation is not paying the employee's debt; it is paying its own.

  This distinction relies on viewing the penalty as **structural accountability**. When a corporation is fined or sanctioned for an employee's misconduct, the justification is not *respondeat superior* in the sense of "the master pays for the servant." Rather, the justification is that the corporation, as an independent agent, failed to maintain a moral structure that prevented the harm. The penalty targets the corporate culture, compliance mechanisms, and incentive structures that enabled the offense.

  By framing the liability this way, we adhere to Lewis's core requirement: the entity suffering the penalty must be the entity that is guilty. If the corporation is morally culpable for creating the environment in which the crime occurred, then punishing the corporation is not vicarious punishment in Lewis's forbidden sense. It is direct punishment of a guilty agent. The "substitution" is merely functional (the corporation pays the fine because it is the solvent entity), not moral (the corporation does not absorb the employee's sin).

  ### Avoiding Lewis's Objection

  Lewis's core objection is that vicarious punishment punishes the innocent and lets the guilty go free. The structural accountability model avoids this on both counts:

  1.  **It does not punish the innocent:** Under the commitment to collective moral agency (detailed below), the corporation is not an innocent volunteer. It is a moral agent with duties of oversight and culture-creation. When it breaches these duties, it becomes guilty in its own right. Therefore, penalizing it satisfies Lewis's retributive requirement that suffering be inflicted only on the guilty.
  2.  **It does not necessarily let the guilty go free:** Lewis worries that substitution allows the original offender to evade justice. However, in complex institutional settings, the "original offender" is often ambiguous. If a toxic corporate culture incentivizes fraud, the "guilt" is distributed. Punishing the structure addresses the primary locus of culpability. Even if the individual is not imprisoned, the demand for justice is satisfied by holding the *primary* moral agent (the structure) accountable. To insist on individual punishment in cases where the structure was the primary cause would be to fetishize individualism over actual moral responsibility.

  Thus, we avoid Lewis's objection by denying that this is truly "vicarious" punishment. It is **direct institutional punishment** that functionally replaces individual sanctions because the institutional agency subsumed the individual agency.

  ### The Required Philosophical Commitment

  For this argument to hold, one must explicitly commit to **Non-Reductive Collective Moral Agency**.

  This is the claim that collective entities (like corporations) possess moral agency that is not reducible to the sum of the agencies of their individual members. This commitment entails:
  1.  **Irreducible Intentions:** The corporation can form intentions (via policy, mission statements, voting procedures) that are distinct from the private intentions of its employees.
  2.  **Independent Moral Duty:** The corporation has moral obligations (e.g., to maintain safety, to prevent fraud) that are not merely the aggregated obligations of its staff.
  3.  **Distinct Desert:** Because the corporation can act and can breach duty, it can bear moral desert independently of its members.

  Without this commitment, the corporation is merely a fiction or a bucket of assets. If the corporation is not a moral agent, then fining it for an employee's crime is indeed punishing the innocent shareholders (the owners of the assets), and Lewis's objection stands fatal. But if the corporation is a moral agent, it is capable of being a "guilty party" in its own right.

  ### Conclusion

  David Lewis is correct that moral desert cannot be transferred from one person to another. However, by committing to Non-Reductive Collective Moral Agency, we can argue that corporations are not "other persons" relative to their employees, but distinct moral agents that can incur original liability for structural failures. This allows us to defend penalties that functionally substitute for individual punishment without violating Lewis's prohibition on vicarious suffering. The corporation is not a volunteer taking the blame; it is a co-conspirator in negligence bearing its own just desert. In this way, Lewis's rigorous defense of the link between agency and liability is not overturned, but extended to the collective sphere.
