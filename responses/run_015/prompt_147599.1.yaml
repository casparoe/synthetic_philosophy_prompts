              *   *Verdict:* The passage gives her very little purchase. Augustine focuses on the speaker's integrity (mind-word alignment), not the listener's retention. The "joke" exemption relies on *signals* that truth isn't claimed. Therapeutic fibbing relies on signals that truth *is* claimed (to be effective).
