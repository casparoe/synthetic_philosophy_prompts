      *   **Belief vs. Opinion:** Augustine distinguishes these to clarify the state of mind.
          *   Belief: Firmly holding something as true, even acknowledging you don't *know* it (faith-based or trust-based).
          *   Opinion: Thinking you know something you don't actually know (presumption).
          *   *Key Point:* If you speak according to your belief/opinion, even if false, it's not a lie.
      *   **The "Double Heart":** Lying requires intent to deceive. You know/think $X$ is true, but you say $Y$.
      *   **True but Lying:** If you say something true ($Y$) but believe it is false ($X$) and intend to deceive, you are still lying.
      *   **False but Not Lying:** If you say something false ($Y$) but believe it is true ($Y$), you are not lying (though you might be at fault for ignorance).
      *   **Jokes:** Excluded because the tone indicates no intent to deceive. Augustine suspends judgment on whether "perfect minds" should joke.
