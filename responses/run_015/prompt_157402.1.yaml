answer: |-
  This is a profound observation, and you are right to sense Simone Weil's shadow over it. What you are describing is the *mechanism* of the party without the *machinery* of the party. It is the "collective pressure" she warned about, decoupled from any physical institution, floating freely in the social atmosphere.

  Before settling on a definition, let's weigh the existing concepts to see why they fail to capture the specific nuance you've identified.

  ### Brainstorming the Nearest Concepts

  1.  **Negative Partisanship:** In political science, this describes voting based on hatred of the opposition rather than love of a candidate. It is close, but it is usually electoral and behavioral. It doesn't capture the *epistemic* shift you described—the willingness to hold contradictory facts or reject truth based on source. Negative partisanship is a voting strategy; what you describe is a mode of *being*.
  2.  **Echo Chambers / Filter Bubbles:** These are technological or sociological descriptions of information isolation. They explain *how* the group stays ignorant, but not *why* they maintain coherence without doctrine. An echo chamber can exist around a hobby or a conspiracy theory with a rigid doctrine. Your phenomenon is defined by the *lack* of rigid doctrine.
  3.  **Groupthink:** This is a psychological phenomenon within a cohesive, often small, decision-making body (like a cabinet or board). It presumes a desire for harmony *within* a structured group. Your phenomenon is decentralized, often hostile internally if someone steps out of line, and lacks a decision-making body. It is not about making a decision; it is about maintaining a posture.
  4.  **Tribalism:** This implies a shared identity, mythos, or blood. Tribes usually have positive content (stories, traditions, gods). What you describe has no positive content, only negative orientation. It is a tribe without a totem, united only by the sacrifice.
  5.  **Weil's "Party Spirit" (L'esprit de parti):** Weil argues parties are machines that demand the suppression of truth for the sake of the party's growth. Your observation is exactly this, but the "machine" has vanished. The pressure remains, but there is no central committee to issue the orders. The orders are ambient.

  ### The Carving: **Spectral Partisanship**

  If we must name this, the most precise philosophical term is **Spectral Partisanship**.

  It is "partisan" because it operates on the friend/enemy distinction and demands loyalty over truth. It is "spectral" because it has no body, no headquarters, no membership list, and no manifesto. It is a ghost of the party structure that haunts the network.

  Here is the precise definition and the boundaries you asked for.

  #### 1. What It Is: Coherence via Negation
  Spectral Partisanship is a form of social cohesion sustained entirely by **adversarial alignment** rather than **constructive agreement**.
  *   **The Glue:** The only binding agent is the identification of a common enemy or a common "toxic" element.
  *   **The Epistemology:** Truth is instrumental. A statement is not evaluated on its correspondence to reality, but on its *vector*. Does it point toward the enemy? If yes, it is "true enough." Does it blunt the attack or come from a source flagged as hostile? If yes, it is "toxic," regardless of accuracy.
  *   **The Structure:** It is rhizomatic and atmospheric. Pressure is applied not by a whip from a leader, but by the fear of social excommunication from the network. The "party line" is not written; it is felt as a shift in the emotional temperature.

  #### 2. What It Is Not (The Edges)

  **Vs. Groupthink:**
  *   *Groupthink* seeks internal harmony to make a decision.
  *   *Spectral Partisanship* seeks external conflict to maintain energy.
  *   In Groupthink, you suppress dissent to avoid awkwardness. In Spectral Partisanship, you suppress dissent to avoid being labeled an accomplice of the enemy. The stakes are moral, not social.

  **Vs. Plain Tribalism:**
  *   *Tribalism* is positive identity ("We are X because we believe Y").
  *   *Spectral Partisanship* is negative identity ("We are Us because we are Not Them").
  *   A tribe can survive without an enemy. Spectral Partisanship *requires* an enemy to exist. If the enemy disappears or is defeated, the network fragments immediately because there is no positive doctrine to hold it together.

  **Vs. Weil's Party Spirit:**
  *   *Weil's Party* is institutional. It has a treasury, a headquarters, and a platform. It demands you lie for the *organization*.
  *   *Spectral Partisanship* is post-institutional. It demands you lie for the *alignment*.
  *   In Weil's time, the party told you what to think. In Spectral Partisanship, no one tells you what to think; you intuit it by sensing what generates approval or outrage in the network. It is a tyranny without a tyrant.

  ### The Weilian Diagnosis

  You are correct that this is the substitution of posture for judgment. For Weil, the human soul has two primary modes of engagement with the world: **Gravity** and **Grace**.
  *   **Gravity** is the automatic, mechanical pull of the collective. It is the desire to belong, to be right, to be on the winning side. It is heavy and downward.
  *   **Grace** (or **Attention**) is the rare, upward effort to look at reality as it is, regardless of who benefits.

  Spectral Partisanship is **Gravity without a Mass**. It is the pull of the collective without the collective itself. It is perhaps more dangerous than Weil's parties because it is unaccountable. You cannot argue with a party leader who isn't there. You cannot reform a platform that doesn't exist.

  The specific evil you identified—the defense of contradictory claims—is the hallmark of this spirit. Weil wrote that the party demands "the ability to believe two contradictory propositions at once." In Spectral Partisanship, this is automated. The contradiction doesn't even need to be resolved; it just needs to serve the vector.

  ### Conclusion

  The name is **Spectral Partisanship**.

  It sits exactly where you suspect: it is the **Party Spirit** liberated from the **Party Structure**. It retains the coercive pressure and the truth-agnosticism of the party, but because it has no formal body, it cannot be negotiated with, voted out, or reformed. It can only be resisted by individual acts of **Attention**—the refusal to align emotionally before thinking clearly.

  Weil argued we must abolish parties to save justice. Your observation suggests that even if we abolish the parties, the *spirit* may survive as a ghost, haunting the networks, demanding the same sacrifices without offering even the pretense of a platform.
