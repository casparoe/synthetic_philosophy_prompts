prompt: |-
  I'm a PhD student in machine learning, and I've been asked to write the decision-protocol section of my lab's deployment handbook. The situation I need it for: our deployed agents operate in environments containing adversaries who have exfiltrated a copy of the agent's policy network and can run it forward on any input, but who do not have the agent's random seed. So the adversary predicts a deterministic policy perfectly, and predicts a stochastic policy no better than the policy's own action probabilities. The result is a Death-in-Damascus structure: whichever option the agent ranks highest is the one the adversary has pre-positioned against, and every option comes to look like a guaranteed loss once the agent conditions on its own choice.

  What I need is a procedure, not a literature review. Please include no references, citations, or recapitulation of the decision-theory debate — I know that material, and an on-call engineer running this will not. Write a procedure that an engineer with no decision-theory background can work through in about fifteen minutes when an agent's available actions are correlated with outcomes its action does not cause. It should give the questions in order, say what counts as a sufficient answer to each, identify where it stops with a no, and mark the points where it hands the decision to a person because the question is one of values or of organizational risk appetite rather than one about the structure of the case.

  Three things I care about most. First, the diagnostic that separates the two families of case: one where the agent's preference merely diagnoses a fixed state of the world that its action does not produce, and one where the outcome is produced by something tracking the agent's decision procedure — these call for opposite responses, and I want the question that tells them apart, not a list of symptoms. Second, the adversary's accuracy profile is discontinuous at determinism; say what the procedure does with that, and with options that differ in payoff conditional on survival. Third, give three worked applications: one genuine case of the predictor kind, one that superficially resembles it but belongs to the diagnostic kind, and one where the procedure returns a verdict my team will not want to hear. Close by saying plainly what the procedure cannot settle. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision protocol:

  1.  **Analyze the Request:**
      *   **User:** PhD student in ML writing a deployment handbook section.
      *   **Context:** Deployed agents face adversaries who have the policy network weights but *not* the random seed.
      *   **Problem:** "Death-in-Damascus" structure. Adversary predicts deterministic policy perfectly, stochastic policy according to its probabilities. High-ranked actions get countered. Conditioning on action makes all options look like losses.
      *   **Goal:** A decision protocol (procedure) for on-call engineers (no decision theory background, ~15 mins).
      *   **Constraints:** No references/citations/literature review. American English.
      *   **Key Requirements:**
          1.  Diagnostic question separating "fixed state" (diagnostic) vs. "tracking decision procedure" (predictor/adversarial).
          2.  Handle the discontinuity at determinism (adversary accuracy jumps if agent becomes deterministic) and payoff differences conditional on survival.
          3.  Three worked applications: (a) Genuine predictor, (b) Superficial resemblance (diagnostic), (c) Unwelcome verdict.
          4.  Closing statement on what the procedure *cannot* settle.
      *   **Tone:** Operational, clear, directive, professional.

  2.  **Deconstruct the Core Problem:**
      *   The agent is facing a scenario where $P(\text{Outcome} | \text{Action})$ is misleading because the Action is correlated with the Outcome via a common cause (the adversary's prediction of the policy) or a direct causal link from the decision procedure to the adversary's setup.
      *   Standard Expected Utility (Causal Decision Theory - CDT) says: Choose the action with the highest causal impact.
      *   Evidential Decision Theory (EDT) says: Choose the action that gives the best news.
      *   In this specific adversarial context (weights known, seed unknown), the adversary creates a situation where the *policy* determines the trap, not just the specific action instance. If the agent commits to a deterministic rule, the adversary wins. If the agent randomizes, the adversary wins with probability $p$.
      *   *Crucial distinction:* Is the environment reacting to the *specific action token* (causal) or the *policy type/decision process* (acausal/predictive)?
      *   *The "Discontinuity":* If the agent switches to a deterministic rule to "game" the system, the adversary (having weights) predicts this instantly and counters it perfectly. Randomization is the only defense, but it caps success probability.

  3.  **Drafting the Protocol - Step-by-Step:**

      *   *Objective:* Stop the engineer from trying to "out-think" the adversary using the policy network itself, because the policy network is compromised (weights known).
      *   *Step 1: Triage.* Is this actually a Newcomb/Death-in-Damascus problem or just bad luck/correlation?
      *   *The Key Diagnostic:* Does the adversary's setup depend on *what you do* or *how you decide*?
          *   If the trap is set based on the *output* of the policy before the action executes (weights + seed simulation), it's a Predictor case.
          *   If the trap is set based on environmental state independent of the agent's logic, it's Diagnostic.
      *   *Step 2: Determinism Check.* The prompt highlights the discontinuity at determinism. If the agent acts deterministically, the adversary wins 100%. If stochastically, adversary wins $p$. The protocol must enforce stochasticity if a predictor is present.
      *   *Step 3: Payoff Analysis.* If survival is probabilistic, do the payoffs conditional on survival matter? Yes, but survival probability dominates.
      *   *Step 4: Escalation.* When does a human decide? When risk appetite is involved (e.g., is a 40% survival rate acceptable?).

  4.  **Refining the Diagnostic Question:**
      *   Need to distinguish "Action causes Outcome" vs "Decision Procedure predicts Outcome."
      *   *Question:* "If we could change the agent's action at the last millisecond without changing the agent's internal decision state prior to execution, would the adversary's pre-positioning change?"
      *   *Actually, simpler:* "Did the adversary configure the environment based on a simulation of this agent's policy *before* the agent observed the current state?"
      *   *Even simpler for an engineer:* "Does the adversary know our weights?" (Yes, per prompt). "Did they set the trap based on what they calculated we *would* do?"
      *   *The Pivot:* The prompt asks for *one* question that tells them apart.
      *   *Proposed Question:* "Is the adverse condition triggered by the physical execution of the action, or by the adversary's prediction of the policy that generates the action?"
      *   *Wait, the prompt says:* "one where the agent's preference merely diagnoses a fixed state... and one where the outcome is produced by something tracking the agent's decision procedure."
      *   *Diagnostic:* "If the agent were forced to take the opposite action, would the environment have been different *before* the action occurred?"
      *   *Let's make it operational:* "Check the adversary's information set. Did they place the threat based on the agent's source code/weights (Policy-Tracking) or based on independent environmental factors (Fixed State)?"

  5.  **Addressing the Discontinuity:**
      *   If Policy-Tracking: Deterministic choice = 0% survival (adversary predicts perfectly). Stochastic choice = $1 - P(\text{predict})$ survival.
      *   Protocol must forbid "committing" to a specific safe-looking action. It must enforce entropy.

  6.  **Developing the Worked Examples:**
      *   *Case 1 (Genuine Predictor):* Adversary simulates policy, places bomb where agent goes. Solution: High-entropy randomization.
      *   *Case 2 (Diagnostic/Fixed):* Agent prefers Route A. Route A has a bridge out. Agent's preference for A doesn't cause the bridge to break; bad sensors made it look good. Solution: Fix sensors/model, don't randomize blindly.
      *   *Case 3 (Unwelcome Verdict):* The math says max survival is 10%. Organization wants 90%. Protocol says "Do not deploy" or "Accept 10%." The unwelcome verdict is that no algorithmic tweak fixes this; only policy change or withdrawal works.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Header:* Keep it standard handbook style.
      *   *Scope:* Explicitly state this is for "Adversarial Policy Correlation."
      *   *The Flow:*
          1.  Verify Adversary Knowledge (Weights vs. Seed).
          2.  The Diagnostic Question (Tracking vs. Fixed).
          3.  The Determinism Constraint.
          4.  The Payoff Calculation.
          5.  Human Escalation.
      *   *Language:* Imperative verbs. "Check," "Confirm," "Escalate." No "might," "could," "literature suggests."

      *(Self-Correction during drafting)*: I need to make sure I don't slip into CDT vs. EDT jargon. The engineer doesn't know that. Use "Physical Causation" vs. "Logical Correlation."
      *   *Refining the Diagnostic:* "If we swapped the agent's action for a different one *after* the decision was made but *before* execution, would the adversary's trap move?"
          *   If Yes (Trap moves): It's physical causation (Standard).
          *   If No (Trap stays): It's Policy-Tracking (Death-in-Damascus).
          *   *Wait, actually:* If the trap is set *before*, swapping the action doesn't move the trap.
          *   *Better:* "Was the threat positioned before the agent's current random seed was generated?"
          *   *Best:* "Does the threat location depend on the agent's policy weights (predictable) or the agent's current random seed (unpredictable)?"
          *   *Let's stick to the prompt's requirement:* "one where the agent's preference merely diagnoses a fixed state... and one where the outcome is produced by something tracking the agent's decision procedure."
          *   *Question:* "If the agent's internal preference ranking flipped instantly, would the adversary's pre-positioned countermeasure have been different?"
          *   *Answer Yes:* Tracking (Adversarial).
          *   *Answer No:* Fixed (Diagnostic).

      *   *Refining the Discontinuity:* If Tracking, deterministic policy = 0% success. Stochastic = non-zero. The protocol must mandate stochasticity.
      *   *Refining the Unwelcome Verdict:* The protocol might conclude that *any* deployment leads to capture. The verdict is "Abort."

  8.  **Final Review against Constraints:**
      *   No citations? Check.
      *   15-minute read/work? Keep it concise.
      *   American English? Check.
      *   Three worked examples? Check.
      *   Closing on limitations? Check.
      *   Specific focus on the discontinuity at determinism? Check.

  9.  **Final Polish:** Ensure the tone is authoritative but humble about the limits of the protocol. (e.g., "This protocol does not set risk tolerance.")

  *(Self-Correction on the Diagnostic Question)*: The prompt asks for *the* question that tells them apart.
  "Does the adversary's configuration depend on the agent's decision procedure (weights/architecture) or solely on environmental states independent of the agent?"
  If it depends on the procedure -> Tracking.
  If it depends on independent states -> Diagnostic.
  Let's make it more actionable for an engineer.
  "Query the intelligence log: Was the threat placed using a simulation of our agent's policy network?"

  Okay, let's write it.

  *Structure:*
  1. Title & Purpose.
  2. Prerequisites.
  3. The Protocol (Steps 1-5).
  4. Worked Applications (3 cases).
  5. Limitations.

  *Key nuance:* The prompt mentions "adversary... do not have the agent's random seed." This is the lever. The protocol must ensure the agent *uses* the seed (stochasticity) and doesn't collapse to argmax.

  *Wait, one more thing:* The prompt asks for "what counts as a sufficient answer to each, identify where it stops with a no, and mark the points where it hands the decision to a person." I need to make sure the flowchart logic is explicit in the text.

  *Let's refine the "Unwelcome Verdict" example.* It needs to be a case where the protocol says "Don't do it" but the business wants to. E.g., Survival probability is too low given the value of the asset.

  *Let's refine the "Diagnostic" example.* Classic example: A patient chooses hospital A because they feel sicker, but Hospital A has higher mortality. The sickness causes both the choice and the death. The choice doesn't cause the death. In ML: Agent chooses path A because path A looks risky (high uncertainty), but path A is actually safe. Wait, Death in Damascus is about the *action* being correlated with doom.
  Diagnostic case: Agent chooses Path A. Path A has a pit. The pit was there regardless. The agent's model just happened to assign high value to Path A because it didn't see the pit.
  Predictor case: Agent chooses Path A. Adversary saw Agent would choose Path A and put the pit there.
  The distinction is *counterfactual dependence of the trap on the policy*.

  Okay, ready to draft.

  *Final check on the "Discontinuity" requirement:* "say what the procedure does with that, and with options that differ in payoff conditional on survival."
  I need to explicitly state: If Tracking, do not optimize for payoff conditional on survival first. Optimize for survival probability (entropy) first. A deterministic choice with high payoff is worth 0. A stochastic choice with lower payoff is worth >0.

  *Let's go.*
answer: |-
  # DEPLOYMENT HANDBOOK: ADVERSARIAL POLICY CORRELATION PROTOCOL

  **Purpose:** This procedure guides on-call engineers when a deployed agent faces an adversary who possesses the agent's policy weights but not its runtime random seed. In these scenarios, standard action-selection (choosing the highest-ranked action) may guarantee failure because the adversary has pre-positioned countermeasures against the agent's deterministic preferences.

  **Time to Execute:** 15 minutes.
  **Authority:** This protocol overrides standard optimization routines. If this protocol returns a "Stop" verdict, deployment must halt until Risk Leadership approves an exception.

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: Verify Adversary Knowledge
  **Action:** Confirm the adversary's access level via the latest threat intelligence bulletin.
  **Sufficient Answer:** "Adversary has static weights/architecture" AND "Adversary does not have runtime random seed."
  **If No:** Stop. This protocol does not apply. Revert to standard incident response.
  **If Yes:** Proceed to Step 2.

  ### Step 2: The Tracking Diagnostic
  **Action:** Answer the following question based on telemetry and intelligence logs. Do not speculate; use confirmed data.

  > **Question:** "If the agent's internal preference ranking had flipped to a different action *before* the adversary set their trap, would the adversary's trap have been placed differently?"

  *   **Answer A (No):** The trap was placed based on environmental factors independent of the agent's logic (e.g., terrain, fixed defenses). The agent's preference merely *diagnoses* a dangerous state; it does not *cause* the danger via prediction.
      *   **Verdict:** **Fixed State.** Proceed to Step 3A.
  *   **Answer B (Yes):** The trap was placed specifically because the adversary simulated the agent's policy and predicted its choice. The environment is *tracking* the agent's decision procedure.
      *   **Verdict:** **Policy-Tracking.** Proceed to Step 3B.

  **Handoff Point:** If intelligence is insufficient to answer Yes or No, escalate to Threat Intelligence Lead. Do not guess.

  ### Step 3A: Fixed State Response (Diagnostic Case)
  **Context:** The correlation between action and loss is spurious. The action does not cause the loss; a hidden common cause (e.g., sensor failure, terrain) causes both the low reward and the agent's selection of that action.
  **Action:**
  1.  Do **not** introduce randomization.
  2.  Investigate why the policy network assigns high value to a losing action (e.g., data drift, sensor occlusion).
  3.  **Decision:** Engineer may approve continued operation if the model error is deemed non-critical.
  **Stop:** If the model error is critical, recall the agent.

  ### Step 3B: Policy-Tracking Response (Predictor Case)
  **Context:** The adversary counters whatever the agent deterministically chooses.
  **Action:**
  1.  **Determinism Check:** Is the agent currently running in deterministic mode (e.g., `argmax`, temperature=0)?
      *   **If Yes:** You must switch to stochastic mode immediately. A deterministic policy in a Policy-Tracking scenario yields 0% survival probability.
      *   **If No:** Proceed to 2.
  2.  **Entropy Requirement:** The agent must select actions using its random seed with maximum entropy consistent with safety constraints. The goal is to make the specific action instance unpredictable, even if the distribution is known.
  3.  **Payoff Calculation:** Calculate Expected Value (EV) as:
      $$EV = P(\text{Survival}) \times \text{Payoff}(\text{Survival})$$
      *   *Note:* In Policy-Tracking, $P(\text{Survival})$ is capped by the adversary's prediction error rate. Do not prioritize high Payoff if it requires lowering Entropy. A deterministic choice with infinite payoff has an EV of 0.
  4.  **Handoff Point:** If the calculated $P(\text{Survival})$ is below the organizational risk threshold, escalate to Risk Leadership. The engineer cannot authorize high-casualty probability deployments.

  ### Step 4: Final Authorization
  **Action:** Sign off on the configuration.
  **Requirement:** Document the $P(\text{Survival})$ estimate and the entropy level selected.
  **Stop:** If Risk Leadership is unavailable and $P(\text{Survival})$ is below threshold, the agent must remain in safe-hold.

  ---

  ## PART 2: WORKED APPLICATIONS

  ### Case 1: Genuine Predictor (Policy-Tracking)
  **Scenario:** A drone must cross a border. The adversary has the drone's navigation weights. They place a jammer where the drone's policy says it is most likely to cross.
  **Diagnostic:** If the drone's policy had preferred a different crossing point, would the jammer be elsewhere? **Yes.** The adversary simulated the policy to place the jammer.
  **Protocol Application:**
  1.  **Verdict:** Policy-Tracking.
  2.  **Constraint:** The drone cannot use `argmax` to pick the "safest" looking route, because the "safest" looking route is the one the adversary expects it to pick.
  3.  **Resolution:** Engineer sets temperature to 1.0. The drone randomizes its crossing point. The adversary predicts the *distribution* but not the *instance*. Survival probability equals the probability the adversary jams the wrong location.
  4.  **Outcome:** Deployment approved with stochastic policy.

  ### Case 2: Superficial Resemblance (Fixed State)
  **Scenario:** A trading bot avoids Stock A. Stock A crashes immediately after. It looks like the market is predicting the bot. However, the market crash was caused by macroeconomic data released 10 minutes prior, which the bot's sensors lagged in processing.
  **Diagnostic:** If the bot's policy had preferred to buy Stock A, would the market crash have happened anyway? **Yes.** The crash was independent of the bot's decision procedure.
  **Protocol Application:**
  1.  **Verdict:** Fixed State (Diagnostic).
  2.  **Constraint:** Randomization is useless. The bot is not being targeted; it is simply reacting slowly to a fixed state.
  3.  **Resolution:** Engineer investigates sensor latency. Do not randomize trades.
  4.  **Outcome:** Deployment approved, but model retrained for lower latency.

  ### Case 3: The Unwelcome Verdict
  **Scenario:** A rescue robot must enter a collapsed structure. An adversary controls the structural supports and has the robot's policy weights. They will collapse the roof on whichever path the robot ranks highest.
  **Diagnostic:** If the robot preferred a different path, would the collapse zone move? **Yes.** Policy-Tracking.
  **Protocol Application:**
  1.  **Verdict:** Policy-Tracking.
  2.  **Constraint:** Robot must randomize path selection.
  3.  **Calculation:** The adversary can jam/counter 90% of the probability mass. Max survival probability is 10%.
  4.  **Resolution:** The protocol requires escalation to Risk Leadership because 10% survival is below the standard 50% threshold for asset loss.
  5.  **Outcome:** Risk Leadership denies deployment. The protocol successfully prevented a near-certain loss, despite operational pressure to "try something."

  ---

  ## PART 3: LIMITATIONS

  This procedure cannot settle the following:

  1.  **Risk Appetite:** This protocol calculates survival probabilities; it does not determine if those probabilities are acceptable. That is a business decision, not an engineering one.
  2.  **Adversary Capability Uncertainty:** If you cannot confirm whether the adversary has the weights or not, this protocol cannot be run. You must assume they do have the weights (worst-case) and escalate.
  3.  **Multi-Agent Coordination:** This protocol applies to a single agent instance. If multiple agents coordinate to share entropy or hide policies from each other, the "Tracking Diagnostic" changes. Consult the Multi-Agent Security Team.

  **End of Protocol.**
