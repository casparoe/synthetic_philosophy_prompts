answer: |-
  1. **Question:** You open your book with the image of Ulysses tied to the mast, but you say scholars have been staring at the ropes while ignoring the island. If the justification for tying him up depends entirely on the nature of the Sirens' song, does that mean a Ulysses contract is sometimes not just unwise, but morally wrong?
     **She'll say:** Yes, it's wrong if the song represents a genuine change of heart rather than a temporary madness; binding a future self against their new, stable values is tyranny, not prudence.
     **Follow-up:** Then why do we treat the founding generation's fear of "faction" as a permanent diagnosis rather than a temporary fever? If the founders tied us to the mast because they feared we'd want to steer toward an island they disliked, isn't that exactly the tyranny you describe?

  2. **Question:** In the individual case, Ulysses is visibly impaired by the song; in the political case, the citizens voting to amend the constitution are usually calm, sober, and fully informed. If the distinction relies on impairment, doesn't it condemn almost all constitutional precommitment as illegitimate?
     **She'll say:** No, because the distinction tracks corruption of judgment, not medical impairment; a war panic or a run on the banks corrupts judgment just as the Sirens do, even if everyone is sober.
     **Follow-up:** But who defines corruption? If a majority decides to restrict speech after a terror attack, they might call it "security," you call it "panic," and a civil libertarian calls it "injustice." What theory of political corruption allows you to make that call without secretly smuggling in your own preferred theory of justice?

  3. **Question:** Let's say we accept that some changes are mere "corruption." How do we tell the difference in practice? If a society votes to restrict rights, is there a test a judge can use that doesn't just amount to saying, "I agree with this change, so it's developmental; I dislike it, so it's situational"?
     **She'll say:** The test is stable endorsement under reflection; situational changes vanish when the pressure lifts, while developmental changes endure even after cool, long-term reflection.
     **Follow-up:** Consider a caste system or a religious hierarchy that a population has endorsed stably for five generations because it's all they were raised to know. By your test, that looks developmental. Does your theory require a court to protect them from their own settled values, or does it force the court to legitimize oppression because it was "stable"?

  4. **Question:** Let's flip that. Imagine a founding charter entrenches secularism, but over a century, the society becomes deeply devout and wants to integrate religion into law. They've reflected on this for decades. Is blocking them a protection against situational panic, or a veto on developmental change?
     **She'll say:** That is a developmental change; the constitution loses its claim on them the moment it suppresses a new, stable self-understanding of the community.
     **Follow-up:** If that's true, then the "situation" isn't in the text of the constitution but in the history of the people. How can a court, which is bound by the text, possibly know when the community has crossed the line from situational panic to developmental shift without becoming a historian rather than a lawyer?

  5. **Question:** You argue that the binding force of a promise depends on the connection between the person who made it and the person keeping it. If psychological connectedness fades over time, should a constitutional clause written two hundred years ago bind us less tightly than one written twenty years ago?
     **She'll say:** Yes, in principle; the claim of the past weakens as the political community's identity evolves away from the founders' specific projects.
     **Follow-up:** If you accept that decay, do you also accept the institutional consequence: sunset clauses for all entrenched rights? If a right to free speech expires in year fifty, doesn't that invite the exact kind of panic you want to prevent, because everyone knows the protection is ticking down?

  6. **Question:** Suppose we adopt your suggestion of renewable entrenchment, where clauses must be re-authorized periodically. If a clause is set to lapse in year twenty, can it still discipline a panic in year eighteen?
     **She'll say:** It can, because the expectation of renewal creates a stable background norm, even if the legal text is temporary.
     **Follow-up:** But that implies the discipline comes from the current majority's willingness to renew, not the past majority's command. If the current majority is the one doing the work, aren't we just describing ordinary democracy with extra steps, rather than genuine precommitment?

  7. **Question:** Ulysses had sailors to tie him up; he didn't tie himself. In a democracy, the institution that decides whether a change is "situational" or "developmental" is usually the court, which is itself part of the system the precommitment limits. Who guards the guardians on your account?
     **She'll say:** The guardians are constrained by the requirement to give public reasons that appeal to the rationale of the precommitment, not just their own policy preferences.
     **Follow-up:** But if the court says, "This amendment is situational panic," and the legislature says, "No, it's our new identity," who wins? If the court wins, isn't that just judicial supremacy wearing a philosophical mask?

  8. **Question:** If the legislature can override the court with a supermajority, doesn't that solve the guardian problem? But then we have to ask: can the supermajority rule itself pass your test?
     **She'll say:** The supermajority rule is a procedural precondition, not a substantive precommitment, so it sits outside the situational/developmental distinction.
     **Follow-up:** But a supermajority rule binds a future majority to a past one just as much as a rights clause does. If a future 55% majority wants to change the law but is stopped by a rule made by a past 55%, isn't that past rule suppressing a developmental change in the current majority's will?

  9. **Question:** You say precommitment is legitimate to protect autonomy. But living under a constitution shapes who we are; an entrenched settlement partly constitutes the identity of the later self. Doesn't that make your justification circular?
     **She'll say:** It's not circular because the constitution protects the *capacity* for autonomy, not the specific content of our choices; it keeps the door open for future development.
     **Follow-up:** But if the "capacity for autonomy" is defined by the very constitution that limits us, then the constitution is validating itself. If we had been raised under a theocracy, wouldn't that system claim it protects our "capacity" just as loudly as a liberal democracy does?

  10. **Question:** None of us signed the founding contract, and a nation isn't a single person. What makes the founding generation the "earlier self" of a citizen born two centuries later, rather than a different agent altogether?
      **She'll say:** It's a chain of participation and inheritance; we accept the benefits of the order, so we accept the burdens of its maintenance, provided the chain isn't broken.
      **Follow-up:** What if the population is substantially replaced by immigration? If I moved here ten years ago, I didn't inherit this "self" from the founders. Why should your distinction bind me to a conversation about identity that started before I arrived?

  11. **Question:** In psychiatry, a patient can sign an advance directive authorizing treatment they will later refuse when ill. Some courts honor the directive; others honor the later refusal. Which does your distinction recommend?
      **She'll say:** If the refusal is caused by the illness (situational), honor the directive; if the illness caused a permanent change in values (developmental), honor the refusal.
      **Follow-up:** But why is criminal law so willing to hold a person to a prior consent ("I agreed to the surgery") but so reluctant to hold them to a prior waiver ("I agreed I could be punished")? If the logic is the same, why does the state enforce one Ulysses contract but not the other?

  12. **Question:** Does this distinction do any work outside of constitutions? Think of debt brakes, independent central banks, or cooling-off periods for purchases. Do these survive your test?
      **She'll say:** Yes, cooling-off periods guard against situational impulse; debt brakes guard against fiscal panic; independent central banks guard against inflationary frenzy.
      **Follow-up:** What about a case where the later self is not worse off by their own lights? If a debt brake forces a government to cut services, and the voters later say, "We prefer the austerity," was the precommitment legitimate? If yes, your theory isn't about autonomy; if no, it's useless.

  13. **Question:** Let's try a hard case. A constitution bans the nationalization of private industry. Ten years later, a new majority votes to nationalize. Is this situational panic or developmental change?
      **She'll say:** It depends on the rationale; if it's a reaction to a market crash, it's situational; if it's a shift toward socialism, it's developmental.
      **Follow-up:** But the majority will always claim it's a shift in values, and the minority will always claim it's panic. If the classification depends entirely on which side you believe, isn't the distinction just interest-relative regardless of how carefully you draft the law?

  14. **Question:** You often say that when a hard case arises, it's a drafting problem, not a legitimacy problem, or that the distinction is in the rationale, not the text. But if the text can't capture the distinction, and the rationale is contested, what evidence would show your theory to be false or idle?
      **She'll say:** It would be false if we found cases where protecting situational changes clearly reduced autonomy, or where allowing developmental changes clearly destroyed it.
      **Follow-up:** But since you define autonomy in terms of the distinction itself, any case can be explained away. If no conceivable constitutional crisis could prove you wrong, aren't you offering a description of how judges talk, rather than a rule for how they should decide?

  15. **Question:** If the situational/developmental distinction cannot be codified without collapsing into judicial discretion, and it cannot be falsified by any outcome, why shouldn't we treat it as a useful metaphor rather than a binding theory of legitimacy?
      **She'll say:** Because without it, we have no way to distinguish between a constitution that protects democracy and one that strangles it; the metaphor is the only tool we have.
      **Follow-up:** Then isn't the real work being done by our democratic instincts, not your theory? If the theory only tells us what we already feel, what is the gain in calling it a "distinction" rather than just "good judgment"?

  ***

  ### If Time Runs Short: The Top Three Questions

  1.  **Question 2 (Asymmetry/Impairment):** This strikes at the heart of the analogy. If Ulysses is crazy but citizens are just disagreeing, the whole theory loses its grip on constitutional law.
  2.  **Question 4 (Secular/Devout Case):** This forces her to apply the theory to a concrete, high-stakes conflict where "stable endorsement" might legitimize oppression or illegitimately block religious expression.
  3.  **Question 14 (Falsification/Stock Move):** This prevents her from retreating to "it's a drafting problem" and forces her to defend the scientific or normative utility of the distinction itself.
