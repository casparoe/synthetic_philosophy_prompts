answer: |-
  **Annual Update on Resource Alignment and Circumstance Neutralization**

  **To:** The School Community
  **From:** The Office of Circumstance Equity
  **Date:** October 15

  Dear Families,

  As we begin the second year of our Equity Framework, the Office of Circumstance Equity wishes to reaffirm our governing principle: no student should end up worse off than another through no fault of their own. Advantages traceable to unchosen circumstances must be neutralized, while those traceable to gambles knowingly chosen are the student's own to bear. We understand that applying this principle requires difficult adjustments, but we believe these measures affirm every student's equal standing.

  **Structural Alignments for Collective Standing**

  To ensure no student is disadvantaged by prior access to private resources, we are dissolving the varsity crew team and the honors orchestra. Our data indicates that participation in these groups correlated strongly with prior access to private coaching and instruments, which are circumstances beyond a student's control. Since the Office cannot raise every student to that level of proficiency without violating resource caps, we refuse to leave anyone behind. These programs will be replaced by inclusive ensembles where participation is not contingent on skill levels derived from unchosen advantages. We know many students loved these teams, but true equity requires us to level the field rather than elevate the few.

  **Determining Fault, Inheritance, and Effort**

  This year, students seeking compensation for unchosen deficits will appear before a review panel. We view this documentation not as an interrogation, but as a dignity-preserving affirmation of the student's right to support. The panel will assess whether a disadvantage stems from circumstance or option luck. Please note that "inherited option luck" applies: if a parent voluntarily assumed financial risk before a student's birth—such as leaving a tenured position to open a bakery—the resulting instability is treated as a gamble transmitted to the student. Consequently, deficits arising from this choice are not compensable.

  Conversely, we must address "cultivated circumstance." If a student overcomes an unchosen deficit through obsessive practice, the resulting advantage is partly unchosen, as the compulsion to practice often stems from early upbringing. Therefore, advantages gained this way will be partially clawed back via reduced access to enrichment funds. We must ensure that effort born of circumstance does not create new inequalities.

  **Resource Caps and Intent Monitoring**

  We have encountered cases where a student, through no choice of hers, requires significantly costly resources to reach the same level of flourishing as her peers. While we sympathize, the Office cannot allocate disproportionate resources to one student without rendering others worse off through no fault of their own. We will provide support up to the standard allocation, but we cannot equalize outcomes when the cost exceeds the communal pool. To do so would violate the principle of neutralizing disadvantage for the majority.

  Finally, we have noticed a trend where students decline opportunities or under-practice to ensure their deficits remain legible as unchosen. To support authentic engagement, we are introducing the Ambition Ledger. Students must sign a declaration of their intended effort levels, subject to random audit. If a student claims inability but the Ledger shows withheld ambition, compensation will be revoked. This ensures that we are compensating only true circumstance, not strategic withdrawal.

  Thank you for partnering with us as we refine these mechanisms. We know these processes are rigorous, but they are necessary to ensure that every student's outcome reflects only their choices, never their luck.

  Sincerely,

  The Office of Circumstance Equity
