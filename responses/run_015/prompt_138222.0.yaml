prompt: |-
  I have been putting together a graduate seminar on decision-making under normative uncertainty, and I have backed myself into an argument whose conclusion I cannot accept but whose steps I cannot fault. I would be grateful for a diagnosis from someone who has thought about this longer than I have.

  (1) If you are uncertain which moral theory is correct, practical rationality requires you to maximize expected choice-worthiness: for each available option, take the choice-worthiness assigned to it by each theory you regard as epistemically possible, weight each by your credence in that theory, and sum.

  (2) That sum is well defined only if the verdicts of the different theories are expressed on a single cardinal scale, so that a great wrong according to one theory can be traded off against a small wrong according to another.

  (3) But the theories disagree not only about which acts are right but about what is assessed in the first place: some assess acts, some rules or policies, some motives or traits of character, some institutional arrangements. There is no unit of assessment common to them all, and hence no common scale on which their verdicts could be summed.

  (4) So the sum in (1) is undefined, and (1) delivers no verdict.

  (5) The usual repair is normalization: stipulate a scale for each theory, for instance by setting the distance between that theory's best and worst available option equal to one, or by equalizing the spread of each theory's verdicts across the option set.

  (6) Normalization is sensitive to the option set. Adding an option you will certainly not take, or deleting one, changes the normalization and can invert the ranking of the options you were comparing; and normalization rules that seem equally reasonable disagree with one another in the same case.

  (7) Hence what you are rationally required to do is determined in part by things that should be irrelevant: how the options are described and ordered, whether a dominated option happens to be listed, which normalization rule you adopt.

  (8) A procedure whose output varies with presentation order and with options you will not choose is not a procedure of rational choice; it is a device for rationalizing whatever you were inclined to do.

  (9) Therefore the expected-choice-worthiness approach to moral uncertainty is empty, and normative uncertainty never gives you a reason to act against the theory you find most credible.

  What bothers me is that this proves considerably more than I set out to prove. The same reasoning would show that a legislature aggregating incommensurable conceptions of the good, or a regulator doing cost-benefit analysis, has no rational method either; and it would leave unexplained the mundane cases that made the topic worth teaching in the first place, where you are roughly halfway between a view on which some ordinary act is permissible and one on which it is seriously wrong, and abstaining plainly seems like the rational response. If I must choose, I would rather keep (1) and (6) than accept (9), but I cannot say what I am paying to keep them.

  So: which step is doing the illegitimate work, and why did it look sound? If the argument is valid instead, tell me which premise to surrender, and what that surrender commits me to about hedging in the mundane case, about comparison of verdicts across theories, and about what it is for a moral theory to deliver a verdict about action at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is designing a graduate seminar on decision-making under normative uncertainty (moral uncertainty).
      *   **The Issue:** They have constructed an argument (premises 1-9) that concludes the expected choice-worthiness (ECW) approach is empty/useless (Conclusion 9).
      *   **The Conflict:** They *cannot accept* the conclusion (9) because it contradicts intuitive cases (hedging in mundane cases) and implies broader skepticism about rational aggregation (legislatures, cost-benefit analysis) that seems too strong. However, they *cannot fault* the steps logically.
      *   **The Request:** Diagnose the argument. Identify which step is doing "illegitimate work" or, if valid, which premise to surrender and what the consequences of that surrender are.
      *   **Preferences:** The user would rather keep (1) [Maximize ECW] and (6) [Normalization is sensitive to option set] than accept (9) [ECW is empty].

  2.  **Deconstruct the Argument:**
      *   (1) Maximize Expected Choice-Worthiness (MECW). *Standard view in normative uncertainty (e.g., MacAskill).*
      *   (2) Intertheoretic Comparisons (ITC) require a common cardinal scale. *Standard worry.*
      *   (3) Structural Incommensurability: Theories assess different objects (acts vs. rules vs. motives). *Deep structural worry.*
      *   (4) Therefore, MECW is undefined. *Inference from 2 & 3.*
      *   (5) Proposed Repair: Normalization (e.g., range normalization, variance normalization). *Standard technical fix.*
      *   (6) Normalization problems: Option set dependence, arbitrariness. *Well-known critique (e.g., by MacAskill himself, or others like Hajek).*
      *   (7) Irrelevant factors determine rational requirement. *Inference from 6.*
      *   (8) Rational choice procedures shouldn't depend on irrelevant factors. *Principle of rationality.*
      *   (9) Conclusion: MECW is empty; never hedge against your most credible theory. *Strong skepticism.*

  3.  **Evaluate the Steps (Diagnosis):**

      *   **Step (3) is the heavy lifter.** It claims structural differences (act vs. rule vs. motive) preclude *any* common scale. This is the "Problem of Structural Diversity."
      *   **Step (6) is the technical hammer.** It highlights the "Option Set Dependence" problem with normalization.
      *   **Step (9) is the overreach.** It moves from "MECW is problematic/sensitive" to "MECW is empty/never gives reason to hedge."

      *   *Where is the weak link?*
          *   Is (3) true? Can we compare verdicts across structural types? Many argue yes, by translating everything to "choice-worthiness of options" ultimately. Even rule-consequentialism tells you which *act* to perform in a context.
          *   Is (6) fatal? Option set dependence is bad, but is it *fatal* to rationality? Or just a feature of bounded rationality/context-sensitivity?
          *   Is (8) too strong? "A procedure... is not a procedure of rational choice." Maybe rationality is messier.
          *   Is (9) a non-sequitur? Even if MECW is imperfect, does it mean *never* hedge?

  4.  **Identify the Core Philosophical Tension:**
      *   The argument relies heavily on the **Problem of Intertheoretic Comparisons (ITC)**.
      *   Specifically, it conflates *structural* incommensurability (different evaluative focal points) with *metric* incommensurability (different scales).
      *   It also relies on a very strict interpretation of **Context Independence** in (7)/(8).

  5.  **Formulate the Diagnosis:**

      *   **Primary Suspect:** Premise (3). It assumes that because theories focus on different objects (acts, rules, motives), they cannot yield a common verdict on *options*.
          *   *Counter:* Most normative theories are action-guiding. Even if a theory evaluates motives, it usually implies which acts are choice-worthy given those motives. We can map everything to "choice-worthiness of the available options."
      *   **Secondary Suspect:** Premise (8) / The inference to (9). The fact that a heuristic is sensitive to framing doesn't make it *empty*. It makes it imperfect. "Empty" implies *no* guidance, but normalization often *does* provide guidance, just unstable guidance.
      *   **Tertiary Suspect:** Premise (1). Maybe MECW isn't the *only* way to handle normative uncertainty. (But the user wants to keep 1).

      *   **Best Strategy:** Attack (3) and soften the inference to (9).
      *   *Argument:* Structural diversity doesn't prevent intertheoretic comparison. We compare the *implications* for action, not the *ontological grounds* of the verdict.
      *   *Argument:* Normalization sensitivity (6) is a bug, but not a fatal one that renders the whole project empty (9). It suggests we need better normalization or a recognition of vagueness, not total abandonment.

  6.  **Develop the "Surrender" Option (If the argument is valid):**
      *   If the user must surrender a premise, (3) is the most vulnerable.
      *   *Surrendering (3):* Commit to the view that all credible moral theories can be translated into a common currency of "choice-worthiness of options."
      *   *Consequences:* We must accept that "choice-worthiness" is a meta-normative concept distinct from first-order moral concepts.
      *   *Hedging:* Hedging remains rational because we can compare intensities across theories once translated.

  7.  **Drafting the Response:**
      *   **Acknowledge the sophistication:** This is a high-quality argument (reminiscent of MacAskill, Hajek, Sepielli).
      *   **Pinpoint the culprit:** Premise (3) is the most controversial and likely false step. Premise (8) is also too demanding.
      *   **Explain why (3) looks sound:** It confuses the *locus of evaluation* with the *output of evaluation*.
      *   **Explain why (9) doesn't follow:** Imperfect precision $\neq$ emptiness.
      *   **Address the "Mundane Case":** Explain how hedging works even with imperfect normalization (e.g., stochastic dominance, or rough comparability).
      *   **Address the "Legislature/Regulator" analogy:** This actually supports rejecting (9). We accept imperfect aggregation in those fields; why demand perfection in ethics?

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is (3) really false?* Some theories (e.g., deep virtue ethics) might resist act-evaluation. *Response:* In a decision context, if a theory doesn't adjudicate options, it has credence 0 for the purpose of *decision theory*. Or, we interpret "choice-worthiness" broadly.
      *   *What about (6)?* The "Problem of Unavailable Options" in normalization is real. *Response:* Acknowledge it, but argue it leads to *imprecision* rather than *incoherence*.
      *   *The "Illegitimate Work":* The move from "sensitive to irrelevant factors" (7) to "not a procedure of rational choice" (8). Rationality often involves heuristics sensitive to context.

  9.  **Final Plan:**
      *   Validate the user's intuition (9 is too strong).
      *   Identify (3) as the primary error (Structural Incommensurability).
      *   Identify (8) as the secondary error (Perfectionism about Rationality).
      *   Show how keeping (1) and (6) is possible by rejecting (3) and softening (8).
      *   Discuss the implications for the seminar (teaching the "Translation Thesis" and "Imprecise Probabilities/Choice-worthiness").

  10. **Tone:** Academic, collegial, precise. (The user is a colleague/professor).

  *(Self-Correction during drafting)*: I should make sure to mention Will MacAskill's work, as this is his wheelhouse. Also Sepielli. The argument looks like a compressed version of the "Problem of Intertheoretic Comparisons."
  Actually, looking closely at (3): "There is no unit of assessment common to them all." This is the claim that needs breaking. Even if Theory A assesses rules and Theory B assesses acts, in a specific choice situation, both imply a ranking of acts. Theory A says "Follow Rule R," which implies "Do Act X." Theory B says "Do Act X." They converge on the act. The *scale* is the problem, not the *object*. (3) conflates object and scale.

  Also, (8) is a modal claim: "A procedure whose output varies... is not a procedure of rational choice." This is false. Many rational procedures are context-sensitive (e.g., satisficing).

  Okay, ready to write.
answer: |-
  This is a formidable argument. It effectively compresses the two major technical hurdles in the literature on normative uncertainty—the **Problem of Intertheoretic Comparisons (ITC)** and the **Problem of Structural Diversity**—into a *reductio* against the Expected Choice-Worthiness (ECW) framework. It reads like a collaboration between Frank Jackson, Allan Gibbard, and a skeptical decision theorist.

  You are right to be worried about conclusion (9). If (9) holds, the entire field of normative uncertainty collapses into a form of "moral dogmatism" (follow your highest-credence theory), which contradicts the robust intuition that we should hedge (e.g., not experiment on a human even if utilitarianism has 51% credence, because deontology has 49%).

  Here is the diagnosis: **Premise (3) is doing the illegitimate work, abetted by an overly perfectionist reading of Premise (8).**

  ### 1. The Diagnosis: Why (3) is False

  Premise (3) claims: *"The theories disagree... about what is assessed... There is no unit of assessment common to them all."*

  This premise conflates the **locus of evaluation** with the **output of evaluation**.

  It is true that Act Utilitarianism evaluates acts, Rule Utilitarianism evaluates rules, and Virtue Ethics evaluates motives. However, in the context of *decision-making*, every credible normative theory must be able to generate a verdict on **options available to the agent**. If a theory literally could not tell you whether option *A* or option *B* is choice-worthy (even indirectly), it would not be a practical normative theory; it would be an aesthetic or metaphysical theory.

  *   **The Translation Thesis:** For the purposes of decision-making under uncertainty, we can treat all theories as providing a "choice-worthiness function" over the set of available actions.
      *   Rule Consequentialism says: "Choose the act that conforms to the optimal rule."
      *   Virtue Ethics says: "Choose the act the virtuous agent would do."
      *   Deontology says: "Choose the act that does not violate constraints."

  While the *grounds* differ, the *currency* in a decision matrix is the same: **the choice-worthiness of the option.** Premise (3) asserts there is "no common scale" because the *inputs* differ. But the ECW framework does not require the *inputs* (the moral grounds) to be commensurable; it requires the *outputs* (the verdicts on options) to be cardinally comparable.

  **Why it looked sound:** It exploits the genuine difficulty of *how* we map a virtue-ethical verdict onto a cardinal scale compared to a utilitarian one. But difficulty is not impossibility. To assert (3) is to assert that there is *no fact of the matter* about whether a utilitarian "unit" of welfare is comparable to a deontological "unit" of rights-violation. Most proponents of ECW (e.g., MacAskill, Sepielli) argue that while we lack a precise exchange rate, we often have *rough* comparability (e.g., "saving a life is more important than keeping a trivial promise" holds across most theories).

  ### 2. The Secondary Error: Premise (8)

  Premise (8) states: *"A procedure whose output varies with presentation order... is not a procedure of rational choice."*

  This is a principle of **Context Independence** that is too strong for bounded rationality or even ideal rationality in complex domains.

  *   **Framing Effects in Rationality:** In standard decision theory, the "description invariance" principle is often violated in ways we accept as rational when information is costly or when the option set signals relevant context.
  *   **The "Empty" Charge:** Even if normalization is sensitive to the option set (Premise 6), it does not follow that the procedure is *empty* (Premise 9). It follows that the procedure is **imprecise** or **unstable**.
      *   If normalization yields *different* rankings depending on the option set, it doesn't mean it yields *no* ranking.
      *   In many mundane cases (the ones you want to teach), the hedging verdict is **robust** across normalization methods. For example, if Theory A says "Murder is -1,000,000" and Theory B says "Murder is -10," almost any reasonable normalization will tell you not to murder, even if the exact expected value shifts.

  Premise (8) moves from "the procedure is flawed/sensitive" to "the procedure is rationalizing garbage." That is a non-sequitur. A flawed compass is not a random number generator; it can still point North often enough to be useful.

  ### 3. How to Keep (1) and (6) without (9)

  You mentioned you would prefer to keep (1) (Maximize ECW) and (6) (Normalization is sensitive). You can do this by rejecting (3) and softening (8).

  **The Modified View:**
  1.  **Reject (3):** Accept that while theories assess different objects, they all issue verdicts on *options* that can be roughly cardinally compared. We don't need a perfect "moral meter"; we need rough intertheoretic ratios.
  2.  **Modify (8):** Acknowledge that rational choice under normative uncertainty is subject to **imprecision**. The output is not a single number but a range, or a set of admissible options.
  3.  **Reject (9):** The ECW approach is not *empty*; it is **indeterminate** in hard cases but **determinate** in easy ones.

  ### 4. What Surrendering (3) Commits You To

  If you tell your seminar to surrender (3), here is what you are committing them to:

  **A. The Meta-Normative Claim:**
  You are committing to the view that "choice-worthiness" is a distinct, higher-order property that first-order moral theories instantiate to varying degrees. It implies that when a Deontologist says "Do not lie" and a Utilitarian says "Lie," they are disagreeing about the same property (the choice-worthiness of lying), not talking past each other. This is a substantive meta-ethical claim (often called **Cognitivism about Choice-Worthiness**).

  **B. Hedging in the Mundane Case:**
  In your mundane case (halfway between permissible and seriously wrong), surrendering (3) allows you to say:
  *   We do not need to know the *exact* cardinal value of "serious wrong" vs. "permissible."
  *   We only need to know that the *ratio* of wrongness is high enough that the expected loss outweighs the gain.
  *   If Theory A says "Act X is neutral (0)" and Theory B says "Act X is heinous (-100)," and you have 50/50 credence, the expected value is -50. You don't need to normalize against the "best possible act in the universe." You can use **variance normalization** or simply rely on the fact that the *spread* of Theory B is intuitively larger than Theory A in this domain.
  *   **Commitment:** Hedging is rational when the *magnitude* of the potential wrong in the minority theory outweighs the *probability-weighted benefit* of the majority theory, even if the scale is rough.

  **C. What it is for a Theory to Deliver a Verdict:**
  You are committing to the idea that a moral theory's verdict on action is **separable** from its ontology. A theory can be about "virtues" but still deliver a "choice-worthiness score" for acts as a derivative output. This requires interpreting first-order theories charitably as *decision-guiding*. If a theory refuses to output a choice-worthiness score for acts (e.g., some forms of particularism), then for the purposes of the seminar, that theory is assigned credence 0 *in the decision matrix*, even if you believe it metaphysically.

  ### 5. A Pedagogical Suggestion for the Seminar

  Since this is for a graduate seminar, you can turn this argument into the central puzzle of the course.

  1.  **Present the Argument:** Give them exactly what you wrote above. It is logically tight enough to be challenging.
  2.  **The "Legislature" Analogy:** You noted that this argument would condemn legislatures and cost-benefit analysis. Use this. Ask: *Is social choice theory empty?*
      *   Arrow's Theorem shows similar impossibility results for aggregating preferences.
      *   Yet, we vote. We regulate.
      *   **Lesson:** Impossibility results in ideal theory do not entail paralysis in non-ideal practice. They entail that we must accept **imprecision**, **context-dependence**, or **procedural constraints**.
  3.  **The Solution:** Introduce **Imprecise Probabilities/Choice-Worthiness**.
      *   Instead of a single expected value, agents have a *set* of credence functions or a *range* of choice-worthiness values.
      *   An act is rationally required only if it maximizes expected choice-worthiness across *all* admissible normalization schemes.
      *   In the "mundane case" (don't murder), all admissible schemes agree.
      *   In "hard cases" (normalization sensitivity), the verdict is **indeterminate**, and the agent is permitted to choose any option in the admissible set.

  ### Summary

  The argument is valid, but **unsound**.
  *   **Break it at (3):** Structural diversity does not preclude functional comparability of outputs.
  *   **Break it at (8):** Sensitivity to framing implies imprecision, not emptiness.
  *   **Keep (1):** Maximize ECW remains the best ideal, even if our measurement tools are imperfect.
  *   **Keep (6):** Acknowledge normalization sensitivity, but treat it as a source of *indeterminacy* rather than *irrationality*.

  This allows you to teach the mundane cases (where hedging is robust) without committing to a false precision that collapses under philosophical scrutiny.
