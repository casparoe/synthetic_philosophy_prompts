answer: |-
  Here are ten questions for the Q&A session, designed to probe the coherence and implications of Audience-Relative Textualism.

  **1. The Temporal Application Problem**
  **Question:** You ground interpretive authority in the empirical expectations of the enacting legislature. But consider a statute enacted in the 1930s applied to digital facts nobody then envisaged. Whose expectations count: the 1930s legislature's or the current one's? If it's the 1930s legislature, how can they have an expectation about a method of application for facts they could not conceive?
  **Anticipated Reply:** It must be the enacting legislature, because that is when the legal deal was struck. They expected courts to use general common-law reasoning or analogy for unforeseen cases.
  **Follow-up:** If they expected courts to use "general reasoning" for new technology, isn't that just a delegation of lawmaking power to the judge? How does that differ from the "living statute" approach you claim to reject, and where is the constraint on judicial discretion?

  **2. The Aggregation Problem**
  **Question:** Legislatures are multimember bodies. In any given enactment, some members may expect textualism, others purposivism, and many may have no expectation at all. How are we to aggregate these divergent mental states into a single "legislative expectation" of method?
  **Anticipated Reply:** We look to the default background convention. Legislators know that courts read text, so they expect textualism unless they signal otherwise.
  **Follow-up:** If the answer is always that "legislators know courts read text," doesn't that make your empirical inquiry redundant? Why posit a contingent empirical theory if the empirical fact is invariably that everyone expects textualism anyway?

  **3. The "Purposivism in Disguise" Charge**
  **Question:** Critics might argue this view is just purposivism in disguise. An appeal to what the legislature would have wanted courts to *do* is an appeal to a counterfactual legislative attitude about outcomes, not just words. How do you distinguish your view from standard intentionalism?
  **Anticipated Reply:** My view concerns the expected *method* of interpretation, not the expected *outcome* of the case. It's about the tool, not the result.
  **Follow-up:** But if the method they expected was "achieve the statute's purpose," then your textualism collapses into purposivism. If the tool they expected is flexible enough to match the purpose, what work is the "textualism" label actually doing?

  **4. Statutory Override of Method**
  **Question:** On your account, could Congress switch the correct method by statute? For example, could they pass a law directing courts to consult committee reports rather than plain text?
  **Anticipated Reply:** Yes, a legislature may choose its interpreters' methods, but only within the limits of whatever anti-delegation rationale you accept.
  **Follow-up:** If Congress can mandate a method, doesn't that suggest the authority of the method comes from a normative separation-of-powers rule (their command binds us), rather than the empirical fact of their expectation? Why does their *expectation* matter if their *command* rules?

  **5. The Vehicle-in-the-Park Case**
  **Question:** Consider a municipal ordinance barring "vehicles" from a public park, applied to a motorized wheelchair. The text includes the chair, but the purpose (safety and quiet) excludes it. You concede a narrow absurdity carve-out, but this may not reach mere hardship. How does Audience-Relative Textualism resolve this?
  **Anticipated Reply:** We must ask what the enacting council expected courts to do with borderline cases of this sort.
  **Follow-up:** That evidence is likely nonexistent. If you infer they expected "reasonableness," haven't you just handed the gavel to the judge's own sense of reasonableness? How is that distinct from the *Holy Trinity* approach you opened with?

  **6. The *Holy Trinity* Hook**
  **Question:** You opened with *Holy Trinity Church*, a case often treated by textualists as the anti-textualist bogeyman. Does your theory vindicate the *Holy Trinity* decision?
  **Anticipated Reply:** It explains why it was decided that way: given the drafting practices of 1892, the legislature expected courts to look beyond the letter when the spirit was clear.
  **Follow-up:** If the correctness of the decision rests on 1892 drafting practices, does that mean *Holy Trinity* would be decided differently today? If so, does the meaning of the statute change as drafting conventions evolve, undermining the stability of the law?

  **7. The Normative Vacuum**
  **Question:** You explicitly reject notice, democratic legitimacy, and separation of powers as justifications for textualism, relying instead on contingent empirical facts. If a legislature *didn't* expect courts to use textualism, why should we? What normative force do these expectations have absent a democratic rationale?
  **Anticipated Reply:** The authority comes from the bargain. The statute is only law because the legislature agreed to it under certain understandings of how it would be read.
  **Follow-up:** If the "bargain" was based on a mistaken empirical belief about how courts actually operate, do we honor the mistake or the reality? If we honor the mistake, aren't we prioritizing legislative psychology over the public's actual notice of the law?

  **8. Judicial Competence and Evidence**
  **Question:** Your theory requires judges to make historical-empirical findings about legislative expectations of method. What evidence is admissible for this? Is it more costly and uncertain than simply reading the text?
  **Anticipated Reply:** Judges already look at legislative history and context; they would just be looking for evidence of interpretive conventions rather than specific intent.
  **Follow-up:** But finding specific intent is already criticized as indeterminate. Isn't finding a collective expectation of *method* even more speculative? Does this not increase judicial discretion by allowing judges to pick the empirical narrative that suits their preferred outcome?

  **9. Dynamic Expectations**
  **Question:** If the authority of textualism rests on contingent facts about a given legislature, does that mean the "correct" method varies from statute to statute, or even decade to decade?
  **Anticipated Reply:** Yes, it is audience-relative. Different legislatures may have different contracts with the courts.
  **Follow-up:** How is a practicing lawyer supposed to advise a client if the rules of interpretation shift depending on which Congress passed the law? Does this fragmentation of interpretive rules violate the rule of law's requirement for consistency?

  **10. Falsification (Closing Question)**
  **Question:** Finally, you ground this theory in empirical claims about legislative expectations. What specific empirical finding would make you give this view up?
  **Anticipated Reply:** If we found clear historical evidence that enacting legislatures generally expected courts to ignore the text in favor of pure judicial discretion.
  **Follow-up:** But if that were true, would you accept that result, or would you revert to a normative defense of textualism (like separation of powers) to save the rule of law? If you would reject the empirical finding on normative grounds, isn't that an admission that the empirical ground isn't the real foundation?
