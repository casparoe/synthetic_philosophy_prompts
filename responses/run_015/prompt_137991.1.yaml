      *   If those goals are "seek power," then ICT is redundant (it becomes a final goal).
      *   If those goals are "be helpful," then risk is lower.
      *   The risk argument relies on OT to say: "You can't just make it smart; you have to make it aligned." If OT is false, maybe "making it smart" *is* making it aligned (or misaligned).
      *   Most risk theorists (Bostrom, Yudkowsky) defend OT vigorously because they fear the "intelligence implies morality" intuition.

  9.  **Drafting the Response (incorporating the above):**
