answer: |-
  Two co-owners, Alice and Bob, hold equal shares of a litigation finance note paying \$100,000 if the plaintiff wins and \$0 otherwise. A public expert report provides exhaustive evidence comprising two incompatible models of jury behavior: Model High predicts an 80% win rate, and Model Low predicts 20%. Both parties accept the report as complete and accurate, possessing identical information and no private signals. Neither requires liquidity, both are risk-neutral over wealth fluctuations of this magnitude, and the note offers no hedging utility beyond its payout. Alice values the claim using a credibility-weighted average of the models (50/50), while Bob values it using a maxmin rule over the set of models provided, refusing to assign weights to the models themselves.

  **First**, Alice's reservation price is derived from Expected Utility: $0.5(0.8 \times \$100,000) + 0.5(0.2 \times \$100,000) = \$50,000$. Bob's reservation price is derived from Maxmin Expected Utility: $\min(0.8, 0.2) \times \$100,000 = \$20,000$. This creates a trading interval of \$20,000 to \$50,000; a trade at \$35,000 yields an expected gain of \$15,000 to each party by their own lights.

  **Second**, the no-trade inference asks what Alice learns from Bob's willingness to sell at \$35,000. In a standard Bayesian setting, she would infer Bob possesses negative private information. Here, she learns nothing new about the state of the world, as the evidence is common knowledge. The premise of the no-trade argument that fails is that all rational agents maximize Expected Utility with respect to a single subjective prior. Bob is not irrational; he satisfies the Gilboa-Schmeidler axioms for decision-making under ambiguity, but he violates the Independence Axiom required for Bayesian coherence.

  **Third**, an outside observer sees trade volume without any disagreement on facts; both parties agree on the models and the probabilities within them. The case is therefore evidence that trading volume can be generated solely by heterogeneity in *decision rules* under model uncertainty, independent of information asymmetry or risk-sharing motives.

  **Fourth**, in the swap test, Bob is replaced by an Expected Utility maximizer who dogmatically holds Model Low as the single true prior (P=0.2). His reservation price remains \$20,000. The trade survives identically, and no observable difference remains in price or volume. This implies that market data alone cannot distinguish between ambiguity aversion and simple prior disagreement; the case supports the claim that volume indicates belief heterogeneity, but not specifically the *source* of that heterogeneity.

  **Fifth**, the single feature doing the work is the **non-reduction of model uncertainty to risk** (Ambiguity Aversion). If this is removed and both parties reduce the set of models to a single additive prior (either by weighting or dogmatism), the case collapses into either the standard no-trade result (if priors match) or a standard difference-of-opinion case (if priors differ), losing the specific demonstration of rule-based trade under common information.

  **Objection One** argues that maxmin is dynamically incoherent if ambiguity resolves before payout. If the valid model is revealed prior to the verdict, a sophisticated maxmin agent anticipates the set collapsing to a singleton. Ex-ante, their value becomes the expected value of the future minimum, which converges to the weighted average (\$50,000) if the model selection is random. Under dynamic consistency, Bob's reservation price rises to match Alice's, and the trade vanishes. Thus, the case requires that model uncertainty persists at least until the trade is settled, or that agents are naive regarding dynamic updating.

  **Objection Two** claims ambiguity aversion is merely risk aversion over a second-order distribution, collapsing the case into the risk-sharing exemption. This conflates Knightian uncertainty with risk. The exemption applies to variance in payouts under *known* probabilities. Here, the probabilities themselves are unknown. If ambiguity aversion is reclassified as risk aversion, the definition of "risk" expands to include model uncertainty, rendering the no-trade theorem vacuous for any real market where models are contested. To maintain the theorem's bite, one must distinguish between risk (known distribution) and ambiguity (unknown distribution); under this distinction, the exemption does not apply.

  A market composed of many such pairs would exhibit high trading volume even in the absence of new information, driven by the turnover of assets between ambiguity-neutral and ambiguity-averse agents. Prices would systematically trade at a discount to the consensus expected value, reflecting an aggregate ambiguity premium. For this case to matter beyond the page, real traders must face genuine model uncertainty where probabilities cannot be objectively verified, and the population must exhibit stable heterogeneity in their tolerance for that ambiguity, ensuring a continuous supply of buyers and sellers despite symmetric information.
