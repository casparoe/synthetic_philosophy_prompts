answer: |-
  ### Part I: The Historiographical Critique as Narrative Theory

  To treat the critique of Whig history as a theory of narrative construction is to identify it as a specific failure of **teleological plot architecture**. In this mode, the resolution of the story is determined prior to the inciting incident, and the intervening scenes are selected not for their intrinsic dramatic weight but for their capacity to service the ending. The plot does not unfold; it unspools. Every event is a checkpoint on a linear track leading to a predetermined **narrative closure**, rendering the middle of the story a mere transit zone rather than a field of contingency.

  This architectural flaw necessitates **anachronistic characterization**. To ensure the characters arrive at the predetermined destination, they are imbued with motivations, vocabularies, and ethical frameworks that belong to the **implied reader's retrospective vantage** rather than their own **diegetic time**. They become proto-moderns, acting as agents of the future rather than subjects of their present. Their interiority is compromised; they do not struggle with the unknown future but rather navigate a map that only the narrator possesses. This collapses the essential distance between the character's knowledge and the reader's knowledge, corrupting **dramatic irony**. True dramatic irony relies on the character's ignorance of the outcome; Whig narration eliminates this ignorance, turning the character into a sleepwalker whose blind steps are choreographed to match the reader's hindsight.

  Furthermore, this approach conflates **diegetic time** (the chronological sequence of events as experienced by the characters) with the **order of narration** (the sequence in which the story is revealed to the reader). In a Whig construction, the order of narration (which begins with the knowledge of the present) colonizes the diegetic time. The past is not allowed to exist on its own terms; it is subordinated to the syntax of the telling. **Prolepsis** (flashforward) ceases to be a rhetorical device and becomes an ontological claim; the future is not merely anticipated by the narrator, it is magnetically pulling the past. The result is a narrative that offers the comfort of inevitability at the cost of verisimilitude, presenting a world where **narrative closure** was not earned through conflict but engineered through the suppression of alternative plotlines.

  ***

  ### Part II: Residue Report

  **1. Clean Mappings**
  *   **Teleological Plot Architecture and Historical Inevitability:** This is the strongest correlation. The Whig assertion that history moves toward a specific end (liberty, modernity) maps perfectly onto a plot designed backwards from a resolution. In both cases, the middle is devalued in favor of the end.
  *   **Anachronistic Characterization and Moral Judgement:** The historian judging a 1920s figure by 2020s standards is structurally identical to a writer giving a 1920s character 2020s dialogue. Both violate the internal consistency of the setting to serve the external values of the creator/audience.
  *   **Narrative Closure and Historical Finality:** The Whig tendency to treat the present as the "end of history" maps onto the novelist's tendency to treat the final chapter as the ultimate validation of all preceding chapters. Both assert that the story has stopped because it has been completed, rather than because the telling has ceased.

  **2. Distorted Mappings**
  *   **Dramatic Irony:** In narrative craft, dramatic irony is a tool to generate tension by widening the gap between character knowledge and reader knowledge. The Whig historian attempts to use this gap but simultaneously closes it. They want the reader to feel superior to the past (irony) but also want the past to be intelligible only through present values (alignment). This distorts the concept: Whig history is not ironic; it is didactic. It removes the character's autonomy to ensure the reader's vindication.
  *   **Diegetic Time vs. Order of Narration:** In fiction, the distinction is explicit; we know the narrator is arranging time. In Whig history, this distinction is obscured. The historian claims the *order of narration* (the analysis) is identical to the *diegetic time* (the causal reality). To map this cleanly, one must admit that the historian is a narrator imposing order, which the Whig framework refuses to do.

  **3. No Counterpart (The Breakdown of the Framework)**
  *   **The Claim to Reference:** Fiction makes no claim that its events actually occurred; history does. The Whig fallacy is an epistemological error (a claim about what is *true* regarding causality), whereas teleological plot architecture is an aesthetic choice (a claim about what is *satisfying* regarding structure). Narrative theory has no mechanism to judge "truth," only "coherence." Therefore, narrative vocabulary cannot fully capture the *danger* of Whig history, only its *shape*.
  *   **Contingency as Theme:** In fiction, a "contingent" event is usually a plot point that feels unearned (deus ex machina). In history, contingency is the default state of reality. A novelist can write a story about chaos, but it must still be a structured story. A historian claiming chaos is making a claim about the universe. The grammar of fiction assumes design; the grammar of history (ideally) resists it.

  **4. The "Ending Writes the Beginning": Structural Identity or Substantive Difference?**

  The novelist's intuition that "the ending writes the beginning" is **structurally identical but ontologically distinct** from the Whig fallacy. Narrative theory reveals the divergence through the concept of **revision versus causality**.

  *   **In Fiction (Revision):** When a novelist alters the first chapter to align with the last, they are engaging in *revision*. They are acknowledging that the *order of narration* requires coherence. The novelist knows the characters did not "know" they were walking toward the ending; the author is simply pruning the path so the reader can see it clearly. The artifice is admitted. The "inevitability" is an aesthetic effect, a illusion of design crafted for thematic resonance.
  *   **In Whig History (Causality):** When the Whig historian allows the ending to write the beginning, they are engaging in *causal falsification*. They are claiming that the *diegetic time* itself was shaped by the future. They assert that the past *actually* intended the present.

  **The Substantive Difference:**
  Narrative theory reveals that fiction possesses a **double-consciousness** that historiography often lacks. The novelist knows there is a difference between the *story* (the events) and the *discourse* (the telling). The novelist can arrange the discourse teleologically while acknowledging the story was chaotic. The Whig historian collapses this distinction. They claim the *discourse* (the narrative of progress) is the *story* (the reality of the past).

  Therefore, the vocabulary of narrative theory saves the novelist from the historian's fallacy by isolating the locus of the design. In your saga, if you arrange your interwar characters to foreshadow the present, you are committing a sin of **anachronistic characterization** only if you pretend they *felt* that foreshadowing. If you acknowledge that you, the narrator, are imposing that pattern upon their chaotic lives for the sake of the **implied reader's retrospective vantage**, you are practicing craft, not Whig history. The Whig fallacy is not the arrangement of events; it is the denial that the arrangement is an arrangement. It is the claim that the map is the territory. Fiction, by its nature, admits it is a map.
