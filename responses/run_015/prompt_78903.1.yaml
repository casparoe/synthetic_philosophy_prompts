answer: |-
  # DECISION TREE: INHERITANCE AND EQUAL OPPORTUNITY

  **NODE 1: LOCATION OF THE WRONG**
  Is the primary moral concern regarding inheritance located in the **transfer** itself, the **power** wealth confers, or **nowhere**?
  *   **Nowhere** → Go to Node 2.
  *   **Transfer** → Go to Node 3.
  *   **Power** → Go to Node 5.

  ---

  ### BRANCH A: NOWHERE (The Transfer and Power are Morally Neutral)

  **NODE 2: FAMILY PARTIALITY**
  Does the family constitute a special moral sphere where principles of equal opportunity are suspended?
  *   **Yes** → **LEAF 1: Laissez-Faire.**
  *   **No** → **LEAF 2: Property Absolutist.**

  ---

  ### BRANCH B: TRANSFER (The Act of Passing Wealth is the Problem)

  **NODE 3: SOURCE OF OBLIGATION**
  Is the moral weight located in the **donor's** act of giving or the **recipient's** receipt of unearned gain?
  *   **Donor (Giving)** → Go to Node 4.
  *   **Recipient (Getting)** → **LEAF 3: Accessions Tax.**

  **NODE 4: SCOPE OF EQUALITY**
  Does equal opportunity require **no inherited advantage** or merely a **fair starting minimum**?
  *   **No Inherited Advantage** → **LEAF 4: Abolish Inheritance.**
  *   **Fair Starting Minimum** → **LEAF 5: Stakeholder Grant.**

  ---

  ### BRANCH C: POWER (The Resulting Influence is the Problem)

  **NODE 5: TEMPORAL SCOPE**
  Is the threat to equality caused by the **stock** of wealth held at any time, or the **duration** of wealth across generations?
  *   **Stock (Immediate)** → **LEAF 6: Annual Wealth Tax.**
  *   **Duration (Dynastic)** → Go to Node 6.

  **NODE 6: ASSET DISTINCTION**
  Does productive capital (firms/trusts) differ morally from consumptive assets (family homes)?
  *   **No Difference** → **LEAF 7: Strict Republican.**
  *   **Difference Exists** → Go to Node 7.

  **NODE 7: DYNASTIC PARTIALITY**
  Is the family permitted to maintain its economic identity for **one generation** but not indefinitely?
  *   **Yes (Decay)** → **LEAF 8: Rignano Scheme.**
  *   **No (Stewardship)** → **LEAF 9: Family Stewardship.**

  *(Note: To reach ~10 leaves, we split Leaf 5 based on funding mechanism)*
  **NODE 4B: FUNDING MECHANISM** (From Node 4 "Fair Starting Minimum")
  Should the equalizing grant be funded by **inheritance tax** or **general revenue**?
  *   **Inheritance Tax** → **LEAF 5: Stakeholder Grant.**
  *   **General Revenue** → **LEAF 10: Universal Basic Capital.**

  ---

  # LEAF DESCRIPTIONS & CASE VERDICTS

  **LEAF 1: Laissez-Faire**
  *   **Most Awkward Commitment:** Must accept that a newborn billionaire has a stronger claim to resources than a starving genius, provided the billionaire's parent earned it.
  *   **Case Verdicts:**
      *   *Family House:* Passes tax-free to the chosen child.
      *   *Family Firm:* Passes entirely to the next generation.
      *   *Trust:* Continues indefinitely for the great-grandchild.

  **LEAF 2: Property Absolutist**
  *   **Most Awkward Commitment:** Defends unlimited inheritance solely on owner rights while denying the family any special moral status as a unit of care.
  *   **Case Verdicts:**
      *   *Family House:* Passes tax-free (property right).
      *   *Family Firm:* Passes entirely (property right).
      *   *Trust:* Continues indefinitely (property right).
  *   *Flag:* **Indistinguishable from Leaf 1 in policy outcome.** Separated only by justification (Property vs. Family).

  **LEAF 3: Accessions Tax**
  *   **Most Awkward Commitment:** Must tax a recipient's life savings differently than an identical sum received from a parent, penalizing the relationship rather than the wealth.
  *   **Case Verdicts:**
      *   *Family House:* Taxed based on the child's total lifetime receipts.
      *   *Family Firm:* Taxed based on the child's total lifetime receipts.
      *   *Trust:* Taxed heavily upon distribution to the great-grandchild.

  **LEAF 4: Abolish Inheritance**
  *   **Most Awkward Commitment:** Must enforce the state separation of children from their parents' economic identity at the moment of death.
  *   **Case Verdicts:**
      *   *Family House:* Reverted to state or sold; child receives cash equivalent only.
      *   *Family Firm:* Socialized or broken up; child cannot inherit control.
      *   *Trust:* Voided; assets redistributed.

  **LEAF 5: Stakeholder Grant**
  *   **Most Awkward Commitment:** Must justify taking from specific grieving families to fund a universal grant for strangers' children.
  *   **Case Verdicts:**
      *   *Family House:* Taxed to fund the grant; child may buy it back.
      *   *Family Firm:* Taxed to fund the grant; control may pass if tax is paid.
      *   *Trust:* Taxed to fund the grant; reduces the great-grandchild's payout.

  **LEAF 6: Annual Wealth Tax**
  *   **Most Awkward Commitment:** Must value illiquid assets annually, potentially forcing the sale of family heirlooms to pay levies on unrealized gains.
  *   **Case Verdicts:**
      *   *Family House:* Taxed annually while held.
      *   *Family Firm:* Taxed annually on equity value.
      *   *Trust:* Taxed annually on asset pool.

  **LEAF 7: Strict Republican**
  *   **Most Awkward Commitment:** Must treat a multigenerational family home as politically dangerous as a monopolistic corporate trust.
  *   **Case Verdicts:**
      *   *Family House:* Taxed heavily if it confers status dominance.
      *   *Family Firm:* Broken up if it confers market dominance.
      *   *Trust:* Dissolved if it creates permanent class stratification.

  **LEAF 8: Rignano Scheme**
  *   **Most Awkward Commitment:** Must arbitrate which generation counts as 'first' in blended families or when assets are reinvested rather than spent.
  *   **Case Verdicts:**
      *   *Family House:* Low/No tax on first transfer; high tax on second.
      *   *Family Firm:* Low/No tax on first transfer; high tax on second.
      *   *Trust:* Prohibitive tax on transfer to great-grandchild (3rd+ gen).

  **LEAF 9: Family Stewardship**
  *   **Most Awkward Commitment:** Must privilege the preservation of a specific family's economic identity over the equal opportunity of outsiders.
  *   **Case Verdicts:**
      *   *Family House:* Exempt (essential to family identity).
      *   *Family Firm:* Exempt (essential to family livelihood).
      *   *Trust:* Restricted (pure wealth without identity is dynastic).

  **LEAF 10: Universal Basic Capital**
  *   **Most Awkward Commitment:** Must fund equal opportunity through general taxation, leaving large inheritances intact while paying for the remedy from the poor.
  *   **Case Verdicts:**
      *   *Family House:* Passes tax-free.
      *   *Family Firm:* Passes tax-free.
      *   *Trust:* Passes tax-free (inequality addressed via UBC grant, not tax).

  ---

  # STRUCTURAL FLAGS

  **INDISTINGUISHABLE LEAVES**
  *   **Leaf 1 (Laissez-Faire) & Leaf 2 (Property Absolutist):** The tree cannot separate these by policy outcome. Both result in zero taxation and unlimited bequest. They are distinguished only by the *justification* (Family Rights vs. Property Rights), which the decision tree measures only at Node 2. If a student answers "Nowhere" to Node 1 and "No" to Node 2, they land on Leaf 2, but their real-world policy preference is identical to Leaf 1.

  **EMPTY / INCOHERENT COMBINATIONS**
  *   **Wrong = Nowhere + EO = No Inherited Advantage:** This combination is **incoherent**. If the transfer of wealth is morally neutral (Node 1), one cannot consistently demand the elimination of inherited advantages (Node 4). The tree routes "Nowhere" away from "No Inherited Advantage" to prevent this contradiction.
  *   **Wrong = Power + EO = No Domination + Family = Absolute:** This combination is **unstable**. If the goal is to prevent domination (Node 5/6) but the family is granted absolute partiality (Node 7), the mechanism to prevent domination is disabled. This leads to Leaf 9 (Stewardship), which effectively abandons the "No Domination" goal in favor of "Family Identity." A position demanding both is undefended.

  **CASE CLARITY**
  *   **The Three Cases:** The tree separates the **Family House** and **Family Firm** from the **Trust** primarily at Node 6 (Asset Distinction) and Node 7 (Dynastic Partiality).
      *   Positions that answer "No" at Node 6 (Leaf 6, Leaf 7) treat all three cases identically.
      *   Positions that answer "Yes" at Node 6 (Leaf 8, Leaf 9) distinguish the Trust (pure wealth) from the House/Firm (identity/consumption), allowing the latter to pass more easily than the former.
      *   This ensures the cases "fall out cleanly" based on the respondent's view on asset types and generational decay.
