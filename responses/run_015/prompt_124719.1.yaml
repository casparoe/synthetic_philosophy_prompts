  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Economics course, just covered Risk-Weighted Expected Utility (RDU).
      *   **Problem:** Confused about RDU vs. Expected Utility (EU).
      *   **Input:** Roommate's summary of RDU (based on grad-level notes).
      *   **Task:** Evaluate the roommate's summary idea-by-idea. Identify what's right, what's a simplification, and what's wrong.
      *   **Constraints:** No bibliography/citations needed. Keep it clear for a student writing a response paper.
      *   **Key Claims to Evaluate:**
          1.  RDU keeps the utility curve totally linear (no diminishing marginal utility).
          2.  All risk aversion goes into rank-dependent decision weights.
          3.  Weights depend on the ordering of outcomes.
