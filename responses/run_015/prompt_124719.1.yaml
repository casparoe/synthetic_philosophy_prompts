      *   *Claim 6: RDU = Prospect Theory minus reference points/loss aversion.*
          *   **Truth:** Broadly speaking, yes. Quiggin's RDU (1982) came before CPT (1992). CPT adds reference dependence and loss aversion to the RDU framework. So RDU is indeed the "cleaner" baseline without those specific behavioral add-ons.
          *   **Verdict:** Mostly Correct (with nuance about who developed what).

  3.  **Drafting the Response (Iterative Process):**

