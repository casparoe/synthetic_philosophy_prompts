          5.  RDU applies weights to cumulative probabilities.
          6.  RDU is basically Prospect Theory without reference points/loss aversion (cleaner version).

  2.  **Deconstruct the Claims (Fact-Checking):**

      *   *Claim 1 & 2: Linear Utility / All Risk Aversion in Weights.*
          *   **Truth:** RDU *allows* for a linear utility function, but it doesn't *require* it. Standard RDU separates risk attitude into two components: utility curvature (wealth/outcome valuation) and probability weighting (attitude towards risk/chance).
          *   **Verdict:** Misleading/Partially Wrong. You *can* set utility to linear to isolate probability weighting, but RDU doesn't force utility to be linear. Risk aversion can come from *both* sources.

      *   *Claim 3: Weights depend on ordering of outcomes.*
