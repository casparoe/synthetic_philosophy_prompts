prompt: |-
  hey so im taking this philosophy of economics course and we just covered risk-weighted expected utility (RDU) in lecture, but im still pretty confused about what it actually does vs regular expected utility. i was talking with my roommate last night and he tried to explain it using this summary he read in some grad-level notes: he said Quiggins RDU fixes EU by keeping the utility curve totally linear—so theres literally no diminishing marginal utility at all—and instead puts all risk aversion into rank-dependent decision weights that depend on the ordering of outcomes. because of that ranking, he said you can explain both the Allais patterns and ambiguity aversion like in Ellsberg without ever curving the utility function. he also said RDU applies those weights to cummulative probabilities, which makes it basically Kahneman and Tverskys prospect theory with the reference point and loss aversion stripped out, so its the cleaner version economists actually prefer. im definately not sure about all that—especially the part where weights do everything and utility is flat, and whether RDU really covers ambiguity or just risk. is this summary mostly fair? can you go through it idea by idea and tell me whats right, whats a common simplification that hides something important, and whats just wrong? i dont need a bibliography or citations, just want to check if my roommate is oversimplifying before i write my response paper.
