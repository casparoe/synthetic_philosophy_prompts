          *   **Truth:** RDU explains Allais (violation of Independence axiom under *risk*). RDU does *not* typically explain Ellsberg (violation under *ambiguity/uncertainty*). Ellsberg usually requires Maxmin Expected Utility (MEU) or Smooth Ambiguity models. RDU assumes known probabilities.
          *   **Verdict:** Wrong. Crucial distinction between Risk (known probs) and Ambiguity (unknown probs).

      *   *Claim 5: Weights apply to cumulative probabilities.*
          *   **Truth:** Yes. That's the "Cumulative" in Cumulative Prospect Theory (CPT) or the core mechanism of Rank-Dependent Utility (Quiggin). You transform the cumulative distribution function.
