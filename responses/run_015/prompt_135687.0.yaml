answer: |-
  ### The Purpose and Target

  The theory is to serve as a guide for a competent but morally unexceptional agent who faces a concrete situation and must decide whether to take someone else's word on a moral question, whose word to take, how far to take it, and what she ends up with if she takes it. An adequate theory must not merely describe when belief is justified; it must prescribe when deference is permissible without moral loss. It must explain what is wrong with objectionable deference in a way that is not reducible to the risk of believing an unreliable source.

  ### Eight Desiderata

  1.  **The Action-Guidance Requirement**
      *   **Requirement:** The theory must yield a verdict on whether to defer in real time, not just in retrospective appraisal.
      *   **Earning Case:** The Purpose statement itself (the agent must decide *now*).
      *   **Status:** **Non-Negotiable.** A theory that only explains why deference was bad after the fact fails the stated purpose.

  2.  **The Non-Epistemic Wrongness Requirement**
      *   **Requirement:** The theory must identify a distinctively moral or agential failing in certain acts of deference, even when the belief formed is true and reliably produced.
      *   **Earning Case:** Case 1 (Trusted person, no reasons).
      *   **Status:** **Non-Negotiable.** If the only wrong is believing falsehoods, the theory reduces to general epistemology and misses the specific anxiety about moral testimony.

  3.  **The Understanding Requirement**
      *   **Requirement:** The theory must distinguish between merely believing a moral proposition on testimony and grasping the reasons that make it true.
      *   **Earning Case:** Case 4 (Reliable predictor, confused reasons) and Case 7 (Learner).
      *   **Status:** **Contested (Pessimist Camp).** Optimists argue knowledge suffices; Pessimists argue understanding is required for moral worth.

  4.  **The Constitutive Authority Requirement**
      *   **Requirement:** The theory must account for cases where the testifier's say-so partly creates the moral fact rather than merely reporting it.
      *   **Earning Case:** Case 2 (The person you wronged).
      *   **Status:** **Non-Negotiable.** Ignoring this collapses moral testimony into factual reporting and makes withholding deference look like a virtue rather than a failing.

  5.  **The Empirical/Moral Split Requirement**
      *   **Requirement:** The theory must separate deference based on access to non-moral facts from deference based on moral judgment.
      *   **Earning Case:** Case 3 (Lived experience) and Case 9 (Empirical uncertainty).
      *   **Status:** **Non-Negotiable.** A theory that cannot distinguish these explains nothing, as it attributes moral authority to mere informational advantage.

  6.  **The Developmental Constraint**
      *   **Requirement:** The theory must explain why deference is permissible or required for learners but becomes suspect as competence matures.
      *   **Earning Case:** Case 7 (The learner's case).
      *   **Status:** **Non-Negotiable.** A synchronic theory that treats the child and the adult identically fails to capture the goal of moral maturity.

  7.  **The Moral Personhood Requirement**
      *   **Requirement:** The theory must specify that the source of moral testimony must be a moral agent, not merely a reliable predictor.
      *   **Earning Case:** Case 8 (The artefact).
      *   **Status:** **Contested (Optimist Camp).** Pure reliabilists may accept the artefact; agency-based views will reject it.

  8.  **The Cross-Paradigm Requirement**
      *   **Requirement:** The theory must allow for deference even when the testifier's fundamental moral framework is rejected by the agent, provided the specific verdict is correct.
      *   **Earning Case:** Case 5 (Opposing commitments, right verdict).
      *   **Status:** **Non-Negotiable.** If deference requires shared fundamentals, moral disagreement makes testimony impossible, which contradicts the purpose of guiding an agent in a pluralistic world.

  ### Adjudication of the Ten Cases

  1.  **Trusted person, no reasons.**
      *   **Generates Desideratum?** Yes (The Non-Epistemic Wrongness Requirement).
      *   **Genuine or Cheap?** **Genuine.** This is the core puzzle. If the theory says "don't defer because they might be wrong," it fails to capture the intuition that deference *itself* is the problem even if they are right.

  2.  **Victim's say-so.**
      *   **Generates Desideratum?** Yes (The Constitutive Authority Requirement).
      *   **Genuine or Cheap?** **Genuine.** This case breaks the model of testimony as evidence. It forces the theory to handle authority, not just reliability.

  3.  **Lived experience/empirical access.**
      *   **Generates Desideratum?** Yes (The Empirical/Moral Split Requirement).
      *   **Genuine or Cheap?** **Genuine.** It prevents the theory from laundering empirical deference as moral expertise.

  4.  **Reliable but confused reasons.**
      *   **Generates Desideratum?** Yes (The Understanding Requirement).
      *   **Genuine or Cheap?** **Genuine.** It forces a choice between reliabilism and rationalism. If the theory accepts this deference, it must explain why Case 1 is still suspect.

  5.  **Opposing commitments, right verdict.**
      *   **Generates Desideratum?** Yes (The Cross-Paradigm Requirement).
      *   **Genuine or Cheap?** **Genuine.** It tests whether the theory requires moral consensus for testimony to function.

  6.  **Aggregation vs. Expert.**
      *   **Generates Desideratum?** No.
      *   **Genuine or Cheap?** **Cheap.** This is a general epistemological problem (Condorcet's jury theorem) applied to morals. It does not test the *moral* specificity of the testimony unless tied to the nature of moral truth.

  7.  **The learner's case.**
      *   **Generates Desideratum?** Yes (The Developmental Constraint).
      *   **Genuine or Cheap?** **Genuine.** It anchors the theory in the trajectory of moral agency, preventing it from being purely static.

  8.  **The artefact.**
      *   **Generates Desideratum?** Yes (The Moral Personhood Requirement).
      *   **Genuine or Cheap?** **Genuine.** It isolates whether the value of testimony lies in the output (truth) or the relationship (agency).

  9.  **Empirical uncertainty.**
      *   **Generates Desideratum?** Yes (The Empirical/Moral Split Requirement).
      *   **Genuine or Cheap?** **Genuine.** It prevents the theory from dissolving moral deference into empirical deference by reclassification.

  10. **Agent with no view.**
      *   **Generates Desideratum?** No.
      *   **Genuine or Cheap?** **Cheap.** This is a limit case of Case 7 (Learner). It adds no new structural pressure on the theory beyond the Developmental Constraint.

  ### Rulings on Distinctions

  A theory adequate to the stated purpose **may not collapse** the following distinctions. Collapsing them solves the problem by changing the subject:

  *   **Deferring to a person vs. treating her as evidence:** Must be maintained. Case 2 (Victim) fails if the victim is treated merely as evidence.
  *   **Believing on testimony vs. understanding why:** Must be maintained. Case 1 and 4 turn on this gap.
  *   **Reliability vs. expertise vs. authority:** Must be maintained. Case 8 (Artefact) separates reliability from authority; Case 2 separates authority from expertise.
  *   **Moral content vs. empirical claims:** Must be maintained. Case 3 and 9 show these come apart.
  *   **First-personal deliberative standpoint vs. third-personal appraisal:** Must be maintained. The Purpose requires first-person guidance, not third-person evaluation.
  *   **Epistemic permission vs. moral failing vs. pedagogical effect:** Must be maintained. Case 7 requires the pedagogical; Case 1 requires the moral; standard epistemology covers the epistemic.
  *   **Deference to a person vs. procedure:** Must be maintained. Case 6 and 8 test the boundary of personhood.
  *   **Taking a verdict now vs. understanding later:** Must be maintained. Case 7 implies a transition from the former to the latter is required for maturity.

  ### Meta-Questions

  **1. Camp Commitments vs. Data**
  The demand that the theory vindicate the claim that **there are no moral experts** is a camp commitment (Pessimist), not data. It should be demoted. A theory can allow for expertise (Case 5) without allowing for blind deference (Case 1). Similarly, the demand for a **special explanation of testifiers with odious views** is often cheap. If the view is odious because it leads to harmful acts, standard unreliability explains the refusal to defer. It earns credit only if the view is odious but the specific verdict is correct and the refusal to defer remains morally required (Case 5).

  **2. Joint Unsatisfiability**
  There is a tension between **The Constitutive Authority Requirement** (Case 2) and **The Understanding Requirement** (Case 1/4). If a victim's say-so *constitutes* what you owe, demanding that you understand the independent reasons for that obligation undermines the authority of the victim. A theory that insists on independent understanding for all moral beliefs cannot accommodate the authority of the victim without contradiction. This suggests no single theory can maximize both requirements simultaneously; a trade-off is inevitable.

  **3. Most Exclusionary Requirement**
  **The Non-Epistemic Wrongness Requirement** does the most exclusionary work. It knocks out straight reductionist views (which treat moral testimony as ordinary testimony) and pure reliabilist views. Any theory that cannot explain why deference is a *moral* failing, even when reliable, fails the purpose statement immediately.

  ### Scorecard

  *   **Straight Deference View:** Fails the Non-Epistemic Wrongness Requirement; cannot explain why Case 1 is suspect if reliable.
  *   **Knowledge w/o Understanding View:** Fails the Developmental Constraint; cannot explain why the learner must graduate to understanding.
  *   **Deliberative Standpoint View:** Fails the Constitutive Authority Requirement; makes deference in Case 2 look like a failure of autonomy rather than a duty.
  *   **Disagreement-Based View:** Fails the Cross-Paradigm Requirement; cannot explain how deference is possible in Case 5 without shared fundamentals.
