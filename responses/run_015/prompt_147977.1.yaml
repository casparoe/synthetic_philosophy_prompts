  Mr. Halloran didn't just teach us formulas. He taught us how to look at reality. I remember watching him spin on that stool, holding the wheel, defying intuition while Galileo watched from his zip-tie perch. Last year, he handed me a paper on the Rietdijk–Putnam argument. It's a dense proof using special relativity to show that "now" is subjective. If simultaneity depends on your velocity, then past, present, and future all exist equally in a four-dimensional block. He taught me that every lesson he taught, every wheel he spun, and every student he guided is permanently real. Nothing fades into nothingness.

  I know what some of you are thinking. If the future is already there in the block, does what we do matter? It's easy to look at that block like a museum exhibit—finished, static, behind glass. If you do, retirement looks like a plaque on a wall. But I've come to see it like a symphony score. The whole piece exists on the page simultaneously, but that doesn't silence the notes as they are played. The fact that the final measure is printed doesn't undo the work of the orchestra at 7:40 PM. The music isn't in the paper; it's in the playing.

  For his wife and kids, this means the dad you know tonight is the same dad who taught us. He isn't leaving himself behind. This isn't just physics trivia; it's a promise to the people who love him. Mr. Halloran, you've told me "closure" is a made-up word that should be banned. I agree. There is no closure here, because nothing ends. The physics club, the demos, the lessons—they aren't gone; they're just located elsewhere in the block. And regarding what comes next: I won't tell you the future is yours. That implies you own it, and physics says you're just moving through it. But I will say that whatever coordinates lie ahead, they are just as real as the ones behind you. The work you did here is secure. It cannot be undone.

  So, to Galileo, who stayed put so we could spin. To the wheel, which always remembered angular momentum. And to the man who taught us that time is stubborn but reality is durable. To Mr. Halloran.

  4. "Line Notes"
  1. "Every lesson... is permanently real." (Commitment: Museum. Establishes the eternalist premise without flinching for the physicists.)
  2. "I've come to see it like a symphony score." (Commitment: Score. Shifts from ontology to phenomenology to allow for meaning.)
  3. "The music isn't in the paper; it's in the playing." (Commitment: Score. Argues that fixed existence doesn't negate local effort or experience.)
  4. "I won't tell you the future is yours." (Commitment: Neutral/Constraint. Acknowledges the Block while avoiding the banned cliché.)
  5. "They aren't gone; they're just located elsewhere..." (Commitment: Museum/Score hybrid. Reframes loss as displacement, satisfying the physics while comforting the family.)

  5. "What would change my mind"
  The weak spot in Section 2 is the assumption that phenomenological experience holds weight against ontological reality. A hardline eternalist could argue that if the Block is true, the "feeling" of playing the note is just another static data point in the block, not an actual opening. If consciousness is fully supervenient on physical states, the "Score" reading is just a comforting story the brain tells itself while traversing a fixed path. If a physicist at the dinner argues that "experience is an illusion," my toast collapses into sentimentality. To defend the "Score," I'd need to argue that experience is the only metric that matters for human value, regardless of the spacetime manifold. If value requires metaphysical openness rather than experiential openness, the Museum reading wins, and the toast becomes a eulogy for a living man. I'm betting on experience trumping ontology for the sake of the room.
