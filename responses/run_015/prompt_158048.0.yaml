answer: |-
  # The 20-Minute Loop Test: A Decision Procedure for Restorative Rituals

  You know soil better than most. You know that if you compact the earth, nothing grows. If you strip the nutrients, the structure collapses. Institutions are the same. They are the structure that holds the social soil. Some structures compact the person (shame); some structures aerate the ground so new growth can happen (guilt).

  We are not diagnosing feelings here. We are auditing institutional design. We cannot see inside the offender's head, but we can measure the shape of the box we are putting them in.

  Below is the procedure. It uses your framing: **Allocentric Repair Loop** (outward focus, reintegration) vs. **Autocentric Status-Degradation Curve** (inward focus, status loss).

  ## Part 1: The Procedure

  Run these four questions in order. If you hit a "Hard No," stop immediately. Reject the proposal.

  ### Question 1: The Target (Act vs. Identity)
  **Look at the language of the ritual.** Does the script require the offender to describe *what they did* or *who they are*?
  *   **Green Light (Guilt/Allocentric):** Language focuses on specific behaviors, harms, and consequences (e.g., "I stole X," "I broke Y," "I hurt Z").
  *   **Red Flag (Shame/Autocentric):** Language focuses on character, morality, or essence (e.g., "I am a thief," "I am broken," "I am sorry for being me").
  *   **Hard No:** Any requirement to adopt a label (e.g., "I am a felon," "I am an addict") as a condition of participation.

  ### Question 2: The Exit Mechanism (Finite vs. Infinite)
  **Look at the end date.** Is there a clear, objective moment when the debt is paid and status is restored?
  *   **Green Light (Guilt/Allocentric):** The ritual has a defined endpoint. Once the action is complete, the offender returns to baseline status. The community agrees to treat them as "done."
  *   **Red Flag (Shame/Autocentric):** The ritual implies ongoing scrutiny. The "debt" is vague. Completion depends on subjective feelings of the victims or community rather than objective tasks.
  *   **Hard No:** Permanent markers, lifetime registries, or rituals where the community retains the right to revoke forgiveness arbitrarily after completion.

  ### Question 3: The Direction of Energy (Outward vs. Inward)
  **Look at where the offender's attention is forced.** Does the ritual require them to look at the victim/community, or at themselves?
  *   **Green Light (Guilt/Allocentric):** The offender must perform labor *for* someone else (repair, service, listening). The energy moves outward.
  *   **Red Flag (Shame/Autocentric):** The offender must perform suffering *upon* themselves (confession without repair, public humiliation, wearing symbols). The energy circles inward.
  *   **Hard No:** Any physical marker, uniform, or badge that distinguishes the offender from the community in public spaces.

  ### Question 4: The Reintegration Pathway
  **Look at the day after.** Does the ritual create a bridge back to the group, or a wall?
  *   **Green Light (Guilt/Allocentric):** The ritual includes a mechanism for the community to acknowledge the repair (e.g., a welcome back, a statement of closure).
  *   **Red Flag (Shame/Autocentric):** The ritual isolates the offender or makes future interaction awkward/impossible.
  *   **Values Call:** This is where facts end. You must decide: Is the community actually capable of welcoming them back? If the community is too angry, even a perfect ritual will fail. This is not a design flaw; it is a community readiness issue.

  ---

  ## Part 2: Running the Cases

  Here is how the test handles your three proposals.

  ### Case 1: Private Amends Meeting
  *Offender meets victim, lists specific actions to make right.*

  *   **Q1 (Target):** Pass. Focus is on "actions to make right."
  *   **Q2 (Exit):** Pass. Once actions are done, meeting is over.
  *   **Q3 (Energy):** Pass. Energy is outward toward the victim's needs.
  *   **Q4 (Reintegration):** Pass. Private nature avoids public stigma.
  *   **Verdict:** **APPROVE.** This is a classic Allocentric Repair Loop. It treats the harm as a debt to be paid, not a stain to be worn.

  ### Case 2: Public Ceremony with Visible Marker
  *Offender confesses before neighbors, wears a visible marker for 30 days.*

  *   **Q1 (Target):** Fail. Public confession often slides into "I am sorry for who I was."
  *   **Q2 (Exit):** Pass. 30 days is finite.
  *   **Q3 (Energy):** **HARD NO.** The visible marker is a status-degradation tool. It forces attention inward (how do I look?) and outwardly signals "danger/unclean" to the community. It prevents normal interaction during the 30 days.
  *   **Verdict:** **REJECT.** This is an Autocentric Status-Degradation Curve. It creates a caste system for a month. It may deter behavior, but it does not restore justice. It compacts the soil.

  ### Case 3: The Hybrid Anonymous Letter
  *Offender writes specific wrongs; Mediator reads aloud anonymously.*

  *   **Q1 (Target):** Pass. Letter lists specific wrongs (act-focused).
  *   **Q2 (Exit):** Pass. Reading is a one-time event.
  *   **Q3 (Energy):** Pass. No visible marker. No public identification. Status is preserved.
  *   **Q4 (Reintegration):** Pass. Offender remains fully integrated in the community immediately.
  *   **Verdict:** **APPROVE (Technically).**
  *   **The Problem:** Your board will hate this. And they should.
  *   **Why it misfires:** The procedure measures *structural shame*, but it cannot measure *moral courage*. Restorative justice requires the offender to risk their status to prove commitment. By making it anonymous, you remove the risk. It becomes a bureaucratic transaction, not a relational repair. It passes the "Shame" test because it protects the self too well. It fails the "Justice" test because it demands no vulnerability.
  *   **The Limit:** This procedure detects institutional cruelty, but it cannot detect institutional cowardice. You will need a Values Call here: Does this feel like cheating? If yes, veto it despite the score.

  ---

  ## Part 3: The Limits of the Tool

  You need to know where this map stops matching the territory.

  1.  **Internal States:** We are measuring the cage, not the bird. An offender can feel shame in a guilt-structured ritual if they are prone to it. We can't stop that. We can only stop the institution from *demanding* it.
  2.  **Community Capacity:** You can design a perfect Allocentric Repair Loop, but if the neighbors are bloodthirsty, they will turn it into a shaming anyway. The procedure assumes good faith.
  3.  **The Courage Blind Spot:** As seen in Case 3, a ritual can be shame-free but also meaningless. Low shame does not automatically equal high repair.

  ---

  ## Part 4: The Verdict (My Stand)

  You asked for a definite stand, so here it is.

  **Guilt is the superior moral emotion for restorative justice.**
  Shame is biologically useful for keeping hierarchies stable in small tribes, but it is useless for repairing harm in a complex society. Shame says "you are excluded." Guilt says "you are indebted." You can pay a debt. You cannot fix being "bad." If your goal is recidivism reduction and community safety, guilt is the only viable tool. Shame breeds secrecy; guilt breeds disclosure.

  **Can a culture choose to become guilt-oriented?**
  Yes. The idea that emotional architecture is inherited like a gut microbiome is naive determinism. It ignores history.

  Look at your soil work. You didn't inherit the soil you worked on; you inherited the *conditions* of the soil. Someone else farmed it before you. They might have depleted the nitrogen. They might have tilled it too deep. But you can amend it. You can add compost. You can change the crop rotation.

  Institutions are the compost.
  When we build courts that focus on sentencing (status degradation), we are tilling the soil too deep and letting it blow away. When we build boards like yours that focus on amends (repair loops), we are adding nitrogen.

  Ruth Benedict talked about cultures as fixed types. She was wrong. Cultures are ecosystems. They respond to incentives. If you build institutions that reward repair, people learn to feel guilt. If you build institutions that reward humiliation, people learn to feel shame.

  We are not stuck with what we inherited. We are farmers. We choose what grows here.

  **Recommendation:** Adopt the procedure, but add a veto clause for "Case 3 scenarios"—where the ritual is safe but hollow. Demand risk. Demand eye contact. Demand the soil be turned, not just swept.
