  # Welcome to Your Risk Profile
  **Venn Mutual Onboarding Guide v4.2**

  Welcome to Venn Mutual! We're thrilled you're here. At Venn, we believe insurance shouldn't be something done *to* you—it should be something you define *for* yourself. That's why we've abolished outdated demographic rating. You are not a statistic. You are a unique dataset waiting to be categorized.

  Below is everything you need to know about selecting your Reference Class. This is the group of people whose historical risk data will be used to project your premium. Don't worry—it's easier than it sounds!

  ### How It Works
  Our underwriting engine relies on two core doctrines designed to protect fairness: the **Maximum Specificity Mandate** and the **Cell Size Covenant**.

  1.  **Maximum Specificity:** To honor your uniqueness, we instruct our algorithms to project risk from the narrowest possible class for which reliable statistics exist. The more specific you are, the more accurate your price!
  2.  **Cell Size Covenant:** To ensure stability, any class used for rating must contain at least one thousand lives. This guarantees your rate is grounded in real-world data.

  Your goal is to find the sweet spot where your personal truth meets statistical viability.

  ### A Note on "No Peeking"
  Regulatory guidelines forbid selecting a class defined by future outcomes. For example, you cannot select the class *"People who will not file a claim this year."* That would be looking ahead!

  Instead, tell us about your habits. Our app will ask about your sleep schedule, browser window width, and typical activity hours between 1:00 and 4:00 a.m. These innocuous traits help us reconstruct a robust profile without violating the No Peeking rule. It's all about proxy data!

  ### The Two-Quote Screen
  Per regulator requirements, every selection screen displays two options side-by-side: **Your Chosen Class** and **Venn's Suggested Class**. You will see the projected premium for each. While you select your cohort at onboarding, please review the Terms below regarding claim-time validation.

  ***

  **WORKED EXAMPLE: UNDERSTANDING VOLATILITY**

  > **Applicant:** Male, 34, Urban Dweller.
  >
  > **Option A (Your Choice):** *Males, 30–35, who own red sedans, drink almond milk, and cycle to work.*
  > *   **Class Size:** 1,204 lives.
  > *   **Projected Premium:** $485.00 / month.
  > *   **Risk Profile:** High specificity reflects unique lifestyle factors.
  >
  > **Option B (Venn Suggestion):** *Males, 30–35, registered vehicle owners.*
  > *   **Class Size:** 450,000 lives.
  > *   **Projected Premium:** $45.00 / month.
  > *   **Risk Profile:** High stability reflects broad population averages.
  >
  > **Resolution:** When specific traits conflict with broad stability, our system applies the **Lexicographical Precedence Rule**. Since "Males" (Option B) alphabetically precedes "Males... who own red sedans" (Option A), the system flags Option A for manual review. In 94% of cases, the system defaults to the class with the higher entropy seed to ensure dynamic pricing fairness. Please expect a variance of up to 1000% during final binding.

  ***

  ### When The Math Works Beautifully
  We want to be clear: statistical prediction is powerful when applied correctly. For example, consider the class *"All insured sedans in the state of Nebraska."* This group is large, homogeneous, and exhibits a stable long-run frequency of claims. When you select this class, your premium is uncontroversial, predictable, and obviously right. This demonstrates our commitment to accuracy where data allows. The Venn ecosystem shines when bridging the gap between this stability and your personal granularity.

  ### Frequently Asked Questions

  **Q: Can I change my Reference Class later?**
  A: Absolutely! Life changes. However, updating your class triggers a re-underwriting event. Your new rate will reflect the narrowest class available at that time.

  **Q: What if my class drops below one thousand lives?**
  A: Don't worry! Our algorithms will automatically broaden your cohort to meet the Cell Size Covenant. You won't experience any coverage gaps, though your premium may adjust to reflect the new statistical reality.

  **Q: Why do neighbouring classes have different prices?**
  A: Because you are unique! Slight changes in class definition (e.g., adding "left-handed" to your profile) access different historical frequencies. This sensitivity proves we are listening to your data.

  ***

  ### Terms of Reference Class Selection (Fine Print)

  1.  **Class Validation:** While the policyholder selects a Reference Class at onboarding, Venn Mutual reserves the right to select the operative Reference Class at the time a claim is filed. This ensures the class reflects the most specific data available at the moment of loss.
  2.  **Proxy Reconstruction:** Certain attributes prohibited for direct rating (including credit-based insurance scores and claims history) may be recovered via proxy variables. These include, but are not limited to, device browser width, keystroke dynamics, ZIP+4 geolocation, and hours of digital activity between 1:00 and 4:00 a.m. This ensures compliance with naming prohibitions while maintaining actuarial integrity.
  3.  **Frequency Interpretation:** Premiums are based on long-run frequencies. Policyholders acknowledge that a single case does not possess a probability independent of its class assignment.
  4.  **Determinism Acknowledgement:** Policyholders acknowledge that variance in pricing is a feature of epistemic limitation, not systemic error.

  ***

  ^1 ^On ^the ^strictest ^view ^of ^the ^matter, ^if ^the ^world ^is ^deterministic, ^every ^reference ^class ^has ^a ^long-run ^frequency ^of ^zero ^or ^one. ^The ^entire ^product ^is ^a ^consequence ^of ^not ^knowing ^which. ^Venn ^Mutual ^prices ^uncertainty, ^not ^risk.
