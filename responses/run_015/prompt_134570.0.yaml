answer: |-
  ### Tutorial Plan: Distinguishing Humean Skepticism from Goodmanian Projectibility

  **Target:** 50-minute tutorial
  **Level:** Second-year undergraduates (led by third-year)
  **Core Case:** Amphibian chromatic traits post-metamorphosis

  #### 1. Explanatory Arc and Dependency Order

  The session must follow a strict logical dependency: students cannot grasp the *selection* problem (Goodman) until they understand the *assumption* of induction (Hume), but they must see that Goodman's problem arises even if we accept induction.

  *   **Phase 1: The Humean Baseline (Minutes 0–10)**
      *   **Introduce:** The basic structure of inductive inference (Observed $X$s have property $P$ $\rightarrow$ Unobserved $X$ will have property $P$).
      *   **Establish:** Hume's skeptical challenge. Hume asks: *Why* assume the future resembles the past? There is no logical necessity.
      *   **Bracket:** Explicitly set Hume's skepticism aside. State: "For this tutorial, we assume induction is permissible. We are not asking *if* we should project; we are asking *what* we project."
      *   **Dependency:** This separation is crucial. If students think Goodman is questioning the *validity* of induction, they will conflate the two problems. Goodman accepts we *must* induct; his problem is that evidence underdetermines *which* hypothesis to induct upon.

  *   **Phase 2: The Amphibian Case Construction (Minutes 10–25)**
      *   **Introduce:** The biological scenario. We have a sample of observed amphibian species. All observed specimens display Chromatic Trait $C$ post-metamorphosis.
      *   **Introduce Predicate A ("Stable-Development"):** Defines Trait $C$ as a fixed property of the species' genetic lineage, applicable to all instances regardless of observation status.
      *   **Introduce Predicate B ("Sample-Relative-Development"):** Defines the trait such that it applies to all *observed* specimens (matching the data perfectly) but applies a different chromatic outcome to *unobserved* species based on their exclusion from the current sample set.
      *   **Dependency:** Students must see that both predicates fit the *existing evidence* equally well. The divergence only occurs in the prediction for the unobserved species. This creates the "New Riddle": Evidence $E$ confirms Hypothesis $A$ and Hypothesis $B$ equally, yet $A$ and $B$ yield contradictory predictions.

  *   **Phase 3: The Projectibility Distinction (Minutes 25–40)**
      *   **Introduce:** The concept of "projectibility." Since evidence cannot decide between $A$ and $B$, the differentiator must be external to the data.
      *   **Introduce:** Entrenchment (conceptually). Some predicates are "ready" for projection because of their history of use in successful predictions, not because of their logical form.
      *   **Dependency:** This only makes sense after Phase 2. If students think evidence decides the hypothesis, they won't understand why we need a criterion like entrenchment.

  *   **Phase 4: Assessment and Wrap-up (Minutes 40–50)**
      *   **Deploy:** The concrete assessment question (see Section 4).
      *   **Close:** Reiterate that Goodman shifts the problem from metaphysics (nature of causality) to semantics/logic (nature of predicates).

  #### 2. The Amphibian Case: Properties and Presentation

  The amphibian case must avoid the static nature of emeralds while preventing the "hidden time" reduction.

  *   **Why Amphibians?**
      *   **Property to Leverage:** Metamorphosis introduces a *phase change* intrinsic to the object, not just the observer. This allows you to discuss "stages" without immediately invoking calendar time.
      *   **Property to Avoid:** Do not make the divergence point a calendar date (e.g., "Trait changes after 2025"). This invites the "Grue is just Time" misconception.
      *   **Required Property:** The divergence must depend on the *epistemic status* of the specimen (Observed vs. Unobserved), mirroring Goodman's logical structure without the temporal baggage.

  *   **Constructing the Predicates:**
      *   **Predicate 1 (Standard):** "Trait $C$ is a universal property of this taxonomic order."
          *   *Projection:* The unobserved species will display Trait $C$.
      *   **Predicate 2 (Grue-Analog):** "Trait $C^*$ is defined as: displaying Trait $C$ if the specimen is in the Observed Sample Set, and displaying Trait Not-$C$ if the specimen is outside the Observed Sample Set."
          *   *Projection:* The unobserved species (being outside the Sample Set) will display Trait Not-$C$.
      *   **Presentation Strategy:** Write the definitions on the board side-by-side. Highlight that for every single data point currently on the table (the observed sample), Predicate 1 and Predicate 2 yield the exact same truth value. The logical conflict exists *only* in the move from the observed to the unobserved. This forces students to see that the problem is not the data, but the *rule* used to extend the data.

  #### 3. Anticipated Misconceptions and Intervention Points

  *   **Misconception 1: "Goodman is just restating Hume."**
      *   **Predicted Error:** Students will argue that Goodman is just saying "we can't know the future."
      *   **Intervention Point:** **End of Phase 1.** When you bracket Hume's skepticism, explicitly state: "Hume asks if we have a right to cross the bridge from observed to unobserved. Goodman asks which map we use to cross it. We are assuming the bridge stands."
      *   **Correction:** If they raise this later, point out that Humean skepticism applies to *all* inductive inferences equally. Goodman's problem is that skepticism applies *unequally* to different predicates (we reject "grue" but accept "green" despite equal evidence).

  *   **Misconception 2: "The second predicate is just a disguised temporal index."**
      *   **Predicted Error:** Students will reduce Predicate 2 to "Trait $C$ before time $t$, Not-$C$ after."
      *   **Intervention Point:** **During Phase 2 (Predicate Construction).** When defining Predicate 2, strictly use the set-theoretic definition ("if in Observed Sample" vs. "if not in Observed Sample") rather than a date.
      *   **Correction:** If they insist it implies time, challenge them: "The definition relies on observation status, not chronology. If we observed the new species tomorrow, it would still be 'Unobserved' relative to the current sample set definition until we formally add it. The logic is about classification, not the clock."

  *   **Misconception 3: "Entrenchment is just linguistic popularity or convention."**
      *   **Predicted Error:** Students will think "projectible" just means "a word we like" or "a word English speakers use."
      *   **Intervention Point:** **During Phase 3 (Projectibility).** When introducing entrenchment, frame it as a history of *successful* projection, not mere usage.
      *   **Correction:** Emphasize that a predicate can be frequently used but poorly entrenched if it fails to support counterfactuals. It is about the *inferential role* the predicate has played in past science, not a vote on vocabulary.

  #### 4. Concrete Assessment Question

  **Question:**
  "Imagine we double the size of our observed amphibian sample, confirming that every new specimen also displays Chromatic Trait $C$. Does this additional evidence logically favor the 'Stable-Development' predicate over the 'Sample-Relative-Development' predicate? Why or why not?"

  **Expected Reasoning (for your reference):**
  *   **Correct Answer:** No.
  *   **Reasoning:** Both predicates are constructed to accommodate *all* observed data by definition. Adding more observed data expands the "Observed Sample Set," and Predicate 2 automatically adjusts to match the new data (since it defines the trait as $C$ *for* observed specimens). The evidence accumulation does not break the symmetry. The choice between predicates must be made based on projectibility criteria *prior* to observing the unobserved species, not by accumulating more of the same kind of evidence.

  #### 5. Technical Exclusions (Out of Scope)

  To maintain clarity for second-year students within fifty minutes, explicitly exclude the following:

  *   **Formal Logic Notation:** Do not use quantifiers ($\forall x$, $\exists x$) or formal set theory notation. Keep the logic in natural language to prevent students from getting bogged down in syntax rather than the conceptual problem.
  *   **The Full Taxonomy of Projectible Predicates:** Do not attempt to classify which predicates are projectible (e.g., qualitative vs. locational). Stick to the binary choice in the case study.
  *   **Goodman's Theory of Overhypotheses:** Do not introduce the machinery of how higher-level hypotheses support lower-level entrenchment. This is too granular for a tutorial introduction.
  *   **Counterfactual Semantics:** Avoid deep dives into possible worlds or the specific logic of counterfactual conditionals. Mention that projectible predicates support counterfactuals, but do not analyze the truth conditions of those counterfactuals.
  *   **Bayesian Solutions:** Do not introduce prior probabilities as a solution. This shifts the discussion to epistemology of belief rather than the logic of confirmation.

  **Instruction to Tutor:** State these exclusions at the beginning of Phase 3. Tell students: "We are looking at the structural problem, not the formal calculus or the full history of solutions." This manages expectations and keeps the discussion focused on the Hume/Goodman distinction.
