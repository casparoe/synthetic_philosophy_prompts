  You have identified a genuine gap in the literature. There is no single, canonical term in analytic metaphysics that captures exactly this *reversible, context-driven allocation of ontological seriousness* where the "demoted" entity remains practically indispensable.

  You are describing a phenomenon that sits uncomfortably between **metaphysical grounding** (which is usually worldly and asymmetric) and **pragmatic contextualism** (which is usually linguistic or conceptual). The specific "carving" you are looking for is the distinction between *existence* and *explanatory primacy*, and the observation that primacy is a resource that gets allocated, not a property that inheres.

  Here is the carving of the phenomenon, the nearest candidates and why they miss, and a proposed term.

  ### 1. The Carving: What exactly is the phenomenon?

  The phenomenon is not about *what exists* (both the conservator and the art historian agree the bronze and the shape are there). It is not even about *identity* (they agree they are distinct). It is about **Explanatory Burden**.

  In any given context, one of the coincident entities is assigned the role of **Substrate** (the thing that persists, bears the causal load, and grounds the explanation) and the other is assigned the role of **Supervenient** (the thing that is "really just" a feature of the substrate, liable to be lost without ontological catastrophe).

  The phenomenon you are tracking is **The Reversibility of Explanatory Primacy**.

  It has three structural features:
  1.  **Coincidence:** Two distinct candidates ($A$ and $B$) occupy the same spacetime region.
  2.  **Indispensable Demotion:** In Context 1, $A$ is Primary and $B$ is Derivative. In Context 2, $B$ is Primary and $A$ is Derivative. Crucially, the Derivative entity is never *eliminated*; it remains a necessary condition for the Primary entity's description (e.g., the conservator needs the "work" to define damage).
  3.  **Metaphysical Tracking:** The ontological story told (monism, dualism, constitution) is a *post hoc* rationalization of the practical priority, not the source of it.

  ### 2. Nearest Candidates in the Literature

  You are right to be dissatisfied with the standard labels. Here is why the nearest neighbors fail to capture the "flip."

  **A. The "Ontological Free Lunch" (David Armstrong)**
  *   **The Idea:** Supervenient entities are "nothing over and above" their base. They are a free lunch.
  *   **Why it misses:** The Free Lunch is usually a one-way ticket. For Armstrong, the particular is real; the universal is a free lunch (or vice versa, depending on the reading), but the direction is fixed by the metaphysics, not the conversation. Your conservator and curator are effectively arguing that *each* is the free lunch of the *other*, depending on the day. Armstrong's framework doesn't allow for a reversible free lunch.

  **B. Quantifier Variance / Conceptual Relativity (Hirsch, Sider, Putnam)**
  *   **The Idea:** "Exists" means different things in different conceptual schemes. In the art scheme, the Work exists; in the physical scheme, the Alloy exists.
  *   **Why it misses:** This makes the dispute merely verbal or conceptual. But you noted that the *work* being done is different. The conservator isn't just speaking a different language; they are preventing chloride corrosion. The curator isn't just using a different quantifier; they are establishing provenance. The *consequences* are real, which suggests the ontological shift is tracking a real shift in *function*, not just meaning.

  **C. Contrastive Metaphysics (Jonathan Schaffer)**
  *   **The Idea:** Metaphysical claims (like causation or fundamentality) are incomplete without a contrast. "$A$ causes $B$" is really "$A$ rather than $A^*$ causes $B$ rather than $B^*$."
  *   **Why it misses:** This is the closest technical fit. Schaffer allows that what is "fundamental" is relative to a contrast. However, contrastive metaphysics is usually about *truth conditions*, not about the *allocation of seriousness* in a professional practice. It doesn't quite capture the *demotion* aspect—that the other entity is treated as "less real" but still required.

  **D. Ontological Politics (Annemarie Mol)**
  *   **The Idea:** In Science and Technology Studies, Mol argues that objects (like a disease) are "enacted" differently in different practices (the lab vs. the clinic).
  *   **Why it misses:** Mol argues for *multiplicity* (the disease in the lab is a *different object* than the disease in the clinic). You are describing a situation where everyone agrees it is the *same object* on the plinth, but they take turns treating different *aspects* of it as the "real" driver. Mol dissolves the tension by multiplying objects; your observation preserves the tension within one object.

  ### 3. Is it One Phenomenon or Three?

  It is **one phenomenon**.

  The Matter/Form flip, the Work/Object flip, and the Registrar/Curator flip are all instances of **Functional Ontological Prioritization**.
  *   **Conservation:** Function = Preservation of material integrity. $\rightarrow$ Matter is Primary.
  *   **Art History:** Function = Preservation of cultural meaning. $\rightarrow$ Form/Work is Primary.
  *   **Registration:** Function = Legal/Inventory tracking. $\rightarrow$ Catalogue Entry is Primary.

  The "flip" occurs because the *criterion for what counts as the 'substrate'* changes with the *criterion for success*. When success is "no corrosion," metal is the substrate. When success is "correct attribution," the work is the substrate. The metaphysics is being dragged along by the success conditions.

  ### 4. Coining the Term

  Since there is no established term, I propose we call this **Pragmatic Ontological Demotion (POD)**.

  **Definition:**
  *Pragmatic Ontological Demotion* occurs when, in a case of material or constitutive coincidence, one entity is rhetorically and explanatorily treated as derivative or secondary to the other, contingent on the operative practical framework, despite the demoted entity remaining causally or definitionally indispensable to the primary entity's description.

  **Key Features of POD:**
  1.  **Reversibility:** The demotion can flip when the framework flips.
  2.  **Non-Eliminativism:** The demoted entity is not denied existence, only priority.
  3.  **Practice-Led:** The ontological hierarchy follows the practical goal, not vice versa.

  ### 5. A Borderline Case

  To test this definition, consider a **Digital Artwork** (e.g., a video installation).
  *   **Entity A:** The source code/file (the "score").
  *   **Entity B:** The projected display (the "performance").

  **Case for POD:**
  *   In a **Preservation Context**, the File is Primary. If the projector breaks, the work survives (swap the projector). If the file corrupts, the work is dead. The Display is demoted to a mere "output."
  *   In a **Curatorial Context**, the Display is Primary. If the file is updated to look better on modern screens, the Curator may accept it (as long as the "experience" is maintained). The File is demoted to a "means of production."

  **The Borderline:**
  A good definition of POD must settle the case of a **Glitch**.
  Suppose the file corrupts in a specific way that creates a visually striking artifact, which the Curator decides is *now* the work.
  *   **If POD applies:** The "Work" has flipped from the intended Display to the Glitched Display. The File is now demoted as "obsolete source."
  *   **If POD fails:** We must say the Work *ended* and a *new* Work began.

  **Why this settles it:**
  If you say the Work ended, you are denying the Reversibility (you've created a temporal cut). If you say the Work continues but the priority shifted (the Glitch is now the Primary, the Original File is the Demoted history), you are accepting POD. A robust definition of POD should allow the *identity* of the Primary entity to shift without requiring the *death* of the object, provided the practical framework (Curatorial Intent) sustains the continuity.

  ### Summary for your Module

  You can tell your students that the "Statue and the Lump" puzzle assumes a static metaphysics (which one is *really* the substance?). Your observation from the conservation committee suggests a **dynamic metaphysics of priority**.

  The word you are looking for is **Pragmatic Ontological Demotion**. It describes the move where we treat something as "nothing over and above" something else, not because of what it *is*, but because of what we are *doing* with it—and we are perfectly happy to reverse that demotion next week when the job changes.
