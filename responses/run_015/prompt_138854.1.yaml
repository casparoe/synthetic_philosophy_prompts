answer: |-
  Hey there,

  You are right to be wary of the snow is white example. It is a disaster for this audience because it quietly smuggles in correspondence intuitions. When you say It is true that snow is white if and only if snow is white, a programmer's brain immediately models the left side as a boolean flag and the right side as a state check against reality. It reinforces the idea that truth is a property of the sentence that depends on a match with the world, which is exactly the metaphysical baggage you want to drop. You want an example that forces them to feel the expressive limitation of language without the word true, so that the disquotation schema looks like a solution to a engineering problem rather than a definition of a word.

  Your instinct about the old model example is correct. That is the engine of the view. Here is the dependency structure you need. You must start with the need for the word before you show them the schema. If you start with the schema, it looks like a parlor trick or a trivial tautology. You need to put them in a position where they cannot say what they mean without using the word true. So the order is: the expressive problem, the disquotation solution, and then the metaphysical conclusion. Start by asking them how they would assert the content of every prediction made by a legacy system without iterating through every single prediction. They can't list them. They need a quantifier. They need to say Everything the old model predicted is true. This shows that true is a logical device for generalization, a way to endorse an infinite set of sentences without listing them. Once they see that the word is a tool for expressive power, you introduce the disquotation schema as the rule that makes the tool work. It is not a definition of truth, it is the operational spec for the device. Only after they accept that the word is a device do you make the claim that truth is not a property like mass or charge. If you say it is not a property too early, they will fight you on it because they think properties are what make sentences true. If you say it after showing the device works, they see that no extra property is needed for the device to function.

  For the one example that carries the session, stick with the generalized claim about the model predictions, but refine it to be about a log file. Say something like Every entry in the success log is true. What this example has to have is quantification over sentences or propositions that the audience cannot practically enumerate. It has to be a case where eliminating the word true requires an infinite or impossibly long conjunction. What it has to avoid is any specific content that triggers a reality check. Do not say Every entry in the success log corresponds to reality. Do not say Every entry in the success log matches the ground truth. Keep it syntactic. The point is that asserting the generalized claim is equivalent to asserting each individual entry, nothing more and nothing less. This avoids the correspondence trap because you never mention the world, only the sentences in the log.

  Now for the misconceptions, because they will form in a specific order. The first one is relativism. They will hear that truth is not a heavy property and think it means truth is just whatever the group agrees on. You need to pre-empt this right after you introduce the schema. Make it clear that the schema works for false sentences too. It is true that snow is white if and only if snow is white, and it is true that snow is black if and only if snow is black. The device does not care about consensus. It only cares about equivalence. If the sentence is garbage, the truth claim is garbage. The second misconception is that truth does not matter. This will come after you say it is not a property. They will think if it is not a real property, it is not valuable. Catch this in the moment by distinguishing the word from the content. Truth matters because the sentences matter. If you care about whether the bridge will hold, you care about the sentence The bridge will hold. Calling it true is just a way of endorsing the sentence. The word is thin, but the stakes are real. The third misconception is specific to your audience. They will map deflationism onto ground truth labels in machine learning. They will think you are saying the labels are just conventions. This is a correspondence confusion. Address this when you discuss the not a property point. Explain that ground truth labels are just sentences we have decided to treat as axioms for the sake of training. Deflationism does not say the labels are arbitrary, it says calling them true does not add a metaphysical layer to them. It saves you from asking what property the label has that makes it true. The last cluster is fake news and the liar paradox. Do not try to solve the liar paradox. It is a trap that will eat your remaining time and confuse the main point. Explicitly refuse to get into it. Say that deflationism has resources for handling it but it requires technical distinctions about logic that are out of scope. For fake news, distinguish truth from verification. Deflationism says what true means, not how we find it. A fake news story is false because the sentence does not hold, not because the word true is misused. Leave this for the last ten minutes if anyone brings it up, but do not lead with it.

  There are two things you should openly refuse to get into. The first is the liar paradox, as I mentioned. Say out loud that you are bracketing self-referential sentences because they break many theories of truth, not just deflationism, and you want to focus on the standard use case. The second is the actual metaphysics of correspondence. Do not let them drag you into a debate about whether reality exists. Say that deflationism is compatible with realism but does not require you to solve the metaphysics of matching. You are talking about the logic of the word, not the ontology of the world.

  For the final check, do not ask them to define truth. Ask them to perform the elimination test. Give them a generalized claim like Everything the witness said is true and ask them to rewrite it without using the word true or any synonym like correct or accurate. If they try to say Everything the witness said corresponds to reality, they have not got it. They have reverted to correspondence. If they say If the witness said P, then P, for every P, they have got it. They understand it is a logical device for generalization. This distinguishes someone who understands the function from someone who just learned to repeat the slogan.

  Finally, you need to tell them where the view is still contested so they do not think it is all sorted. The pressure point is normativity. If truth is just a device for endorsing sentences, why should inquiry aim at truth? Why not aim at usefulness or coherence? Deflationists owe an explanation for why truth is a goal if it is not a valuable property. You do not need to solve this, but you should flag it. Tell them that explaining why we value truth without making truth a heavy property is the open problem. This leaves them knowing what is contested rather than thinking the philosophy is dead.

  Hope this helps you structure the slot. It is a fun topic to teach to this crowd because they usually appreciate the logical utility angle.

  Best of luck next week.
