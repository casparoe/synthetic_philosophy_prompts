answer: |-
  1. If self-locating conditioning is incoherent, isn't your reference class shift just swapping one nonsense for another? I concede the framework is shaky, but shifting classes shows the doom conclusion is unstable even if the method holds, though this admits the broader skeptic's point.

  2. Doesn't this just push the Doomsday conclusion to the end of all observers rather than solving it? This refutes human extinction specifically, yet it relies on a uniform prior over observer-moments which you haven't justified.

  3. What non-arbitrary principle selects 'observers' over 'humans' without begging the question against the Doomsday conclusion? I appeal to cognitive continuity, but this is vulnerable to charges that it merely gerrymanders the class to avoid uncomfortable results.

  4. Why should abstract observer counts constrain physical extinction events regardless of what minds exist? It doesn't constrain physics, only our credence, but this distinction may not satisfy someone demanding causal mechanisms.

  5. If posthumans vastly outnumber us, isn't our existence as biological humans statistically improbable enough to reject the large-future hypothesis anyway? I'd argue indexical uncertainty doesn't work that way, but this invites the very self-locating debates you're trying to sidestep.
