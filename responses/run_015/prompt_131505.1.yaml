      *   *Case 2 (Temporary Brain Injury):* Directive refused ventilation in permanent respiratory failure. Patient temporarily incompetent, signaled want for vent via eyes. *Decision:* Honor directive (withhold/withdraw eventually, but maintain through temporary state). *Reasoning:* Temporary disorientation/fear shouldn't override long-considered judgment. *Note:* Full preservation of psychological identity *might* weaken directive force (foreshadowing Case 3).
      *   *Case 3 (Locked-In Syndrome):* Directive refused measures if "completely paralyzed and unable to interact." Patient communicated via eye-gaze, did intellectual work. Revoked directive. *Decision:* Honor revocation (continue care). *Reasoning:* Psychological/relational capacities intact; present authority continuous with past author exists. (Principle: If the "self" persists and can reason, present autonomy overrides past directive).
      *   *Case 4 (Persistent Vegetative State):* Directive refused support if permanently unconscious. Family argued hidden awareness. *Decision:* Withdraw support. *Reasoning:* No capacity for psychological life/reasoning = no competing present authority. (Principle: No present self = Past directive stands).

      *   *Synthesis of Precedents:* The service seems to prioritize **Psychological Continuity and Present Autonomy** over strict biological criteria or literal text *when* the patient retains the capacity for reasoned judgment and relational connection. When psychological continuity is broken (Case 1, Case 4), the directive stands. When it is preserved (Case 3), the present wish overrides. Case 2 is a bridge: temporary impairment doesn't count as a new "self."

