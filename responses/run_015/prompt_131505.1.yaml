      *   *Scenario:* A patient wrote a directive refusing care if they became dependent on others for basic hygiene, citing "loss of dignity." They now have that condition (e.g., high spinal cord injury). They are cognitively intact. They say, "I was wrong. Dependency isn't undignified. I find joy in care."
      *   *Why this tests it:* It forces the choice between:
          1.  Respecting the past self's definition of dignity (Precedent Autonomy).
          2.  Respecting the present self's lived experience of dignity (Current Autonomy).
      *   *Refining the Prompt's Suggestion:* The prompt asks for a hypothetical involving "intact narrative memory and reasoning but a radical, stable shift in the emotional valence attached to dependency."
      *   *My Task:* Formulate this specific hypothetical to show *why* it clarifies the principle.

  9.  **Drafting the Response:**
      *   *Structure:*
