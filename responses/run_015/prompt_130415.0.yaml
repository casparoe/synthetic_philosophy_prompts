answer: |-
  # The Demarcation Protocol (v1.0)

  **Purpose:** To distinguish between *legitimate historical revisionism* (claims that may be false but are methodologically sound) and *pseudohistory* (claims structured to evade falsification).
  **Time Budget:** ~20 minutes per pitch.
  **Users:** Senior Editors / Research Leads.
  **Output:** One of three classifications: **GREEN** (Legitimate Revisionism), **RED** (Pseudohistory), **YELLOW** (Requires Editorial Judgment).

  ---

  ## The Flow Procedure

  ### Step 1: The Falsifiability Condition
  **Question:** Does the author explicitly state what specific evidence, if discovered, would force them to abandon or significantly alter their core thesis?
  *   **Pass:** The pitch identifies a specific datum (e.g., "If strontium analysis shows X," "If a manuscript predating Y is found").
  *   **Fail:** The author states their conclusion is certain, implies only confirmation is possible, or says contrary evidence is "irrelevant" to the core truth.
  *   **[JUDGMENT CALL]:** If the condition is vague (e.g., "further research"), note this but proceed to Step 2.

  **Stop Point:** If **Fail**, mark **RED (Pseudohistory)** and stop. Do not proceed.

  ### Step 2: The Consensus Engagement Check
  **Question:** Does the pitch characterize the prevailing academic view accurately enough that a specialist in that field would recognize it, even if they disagree with the critique?
  *   **Pass:** The pitch summarizes the standard model/consensus without attributing malicious intent or gross incompetence to its proponents.
  *   **Fail:** The pitch relies on a "strawman" of the consensus (e.g., claiming historians believe X when they actually believe Y) or attributes the consensus to a conspiracy/bias without evidence.
  *   **[JUDGMENT CALL]:** If the pitch is aggressive but factually accurate about the consensus, mark "Unclear" and proceed.

  **Stop Point:** If **Fail**, mark **RED (Pseudohistory)** and stop.

  ### Step 3: The Insulation (Auxiliary Hypothesis) Check
  **Question:** When addressing known counter-evidence, does the author introduce new assumptions that are *less* testable than the original claim?
  *   **Pass:** Counter-evidence is acknowledged and explained using mechanisms that are independently testable or consistent with established methods.
  *   **Fail:** Counter-evidence is explained away by assuming a unique, untestable exception (e.g., "This carbon date is wrong because of a unique local contamination event that only affects this site").
  *   **[JUDGMENT CALL]:** If the auxiliary hypothesis is testable *in principle* but difficult/expensive to verify, mark "Unclear" and proceed. **This is the primary zone where 'False' and 'Pseudo' diverge.**

  **Stop Point:** If **Fail**, mark **RED (Pseudohistory)**. If **Unclear**, proceed to Step 4.

  ### Step 4: The Cross-Disciplinary Constraint Check
  **Question:** Does the claim violate hard constraints from neighboring fields (physics, genetics, geology) without offering a mechanism that respects those fields' laws?
  *   **Pass:** The claim fits within known physical/biological limits, or proposes a mechanism that could be tested by those fields.
  *   **Fail:** The claim requires suspending laws of physics/biology (e.g., mass global amnesia, impossible travel speeds) without a testable mechanism.
  *   **[JUDGMENT CALL]:** If the conflict is with *interpretive* fields (literature, sociology) rather than *hard* fields, mark "Unclear."

  **Stop Point:** If **Fail**, mark **RED (Pseudohistory)**.

  ### Step 5: The Productivity Check
  **Question:** If this hypothesis were true, would it open up new lines of inquiry and predictions, or does it merely explain existing anomalies?
  *   **Pass:** The pitch suggests new places to dig, new texts to analyze, or new data to collect.
  *   **Fail:** The hypothesis only functions to explain why current data looks "wrong" without generating new testable predictions.
  *   **[JUDGMENT CALL]:** If the pitch is purely theoretical but logically consistent, mark "Unclear."

  **Final Tally:**
  *   **Any Step 1 or 2 Fail:** **RED (Pseudohistory)**.
  *   **Any Step 3 or 4 Fail:** **RED (Pseudohistory)**.
  *   **All Pass:** **GREEN (Legitimate Revisionism)**. *Note: This does not mean the claim is true, only that it is safe to engage with.*
  *   **Multiple "Judgment Call/Unclear" flags:** **YELLOW (Editorial Review Required)**.

  ---

  ## Worked Examples

  ### Example 1: The "Mislocated Atlantis" Pitch
  **Claim:** Atlantis was a real Bronze Age civilization, but it was located in the Atlantic Ridge, not the Mediterranean. Uses geological data on sea levels and selective Plato quotes.
  *   **Step 1 (Falsifiability):** **Pass.** Author states: "If core samples from the Ridge show no human sediment from 1200 BCE, the theory is dead."
  *   **Step 2 (Consensus):** **Pass.** Accurately describes the geological consensus on sea levels, though argues for a localized anomaly.
  *   **Step 3 (Insulation):** **Fail.** When confronted with the lack of artifacts, the author claims "The site was vaporized by a unique plasma event that leaves no trace." This is an auxiliary hypothesis that cannot be tested (vaporization leaves no trace).
  *   **Decision:** **RED (Pseudohistory).**
  *   **Why:** The claim starts scientific but insulates itself at the moment of potential falsification (Step 3).

  ### Example 2: The "New Chronology" Pitch (Fomenko-style)
  **Claim:** Conventional medieval chronology is a forgery; the timeline is compressed by 300 years. All carbon dating is part of a systemic academic conspiracy.
  *   **Step 1 (Falsifiability):** **Fail.** Author implies the "conspiracy" is too deep to allow for standard verification. When asked what would change their mind, they suggest "access to raw data" which they claim is withheld.
  *   **Step 2 (Consensus):** **Fail.** Characterizes all historians and scientists as active participants in a forgery ring without evidence.
  *   **Decision:** **RED (Pseudohistory).**
  *   **Why:** Stops at Step 1. The claim is structured to make disagreement impossible by attributing it to the conspiracy being tested.

  ### Example 3: The "Contamination" Pitch (The "Dislike" Case)
  **Claim:** A well-funded team argues a specific Neolithic site is 2,000 years older than consensus. They use real radiocarbon dating but argue "local contamination patterns are systematically misread by mainstream labs."
  *   **Step 1 (Falsifiability):** **Pass.** "If independent labs using Method Z find the standard dates, we concede."
  *   **Step 2 (Consensus):** **Pass.** Accurately describes how carbon dating works and where contamination usually occurs.
  *   **Step 3 (Insulation):** **Unclear [JUDGMENT CALL].** The "local contamination" hypothesis is *theoretically* testable (you can test for the contaminant), but it functions as a shield. It is not *inherently* untestable, just inconvenient.
  *   **Step 4 (Cross-Discipline):** **Pass.** Does not violate physics, just challenges calibration curves.
  *   **Step 5 (Productivity):** **Pass.** Calls for specific new chemical tests.
  *   **Decision:** **GREEN (Legitimate Revisionism).**
  *   **Why this might be disliked:** The editor may strongly suspect the "contamination" claim is a convenient excuse to salvage a pet theory. However, because the excuse is *testable* (unlike the Atlantis plasma event), it passes the demarcation protocol.
  *   **Philosophical Note:** This procedure distinguishes "Likely False" from "Pseudohistorical." This pitch may be wrong, but it is playing by the rules of science. Rejecting it as *pseudo* would be an error; it should be reviewed on *merit*, not *method*.

  ---

  ## Limitations & Explicit Boundaries

  **1. This procedure cannot determine Truth.**
  A **GREEN** result does not mean the pitch is correct. It means the pitch is *safe to critique*. A claim can be methodologically sound and still be completely wrong. Do not conflate "Legitimate Revisionism" with "Verified Fact."

  **2. The "Hard Science" Bias.**
  Step 4 favors claims that can be tested by hard sciences (physics/chemistry). Historical claims that rely purely on textual interpretation or sociological theory may trigger **YELLOW** flags more often, not because they are pseudo, but because the "hard constraints" are softer.

  **3. The "Competence vs. Malice" Blind Spot.**
  This protocol assumes bad methodology is the marker of pseudohistory. It does not detect competent bad-faith actors who know how to game the checklist (e.g., by offering a fake falsification condition they know will never happen). Step 5 (Productivity) mitigates this, but a determined actor can still pass.

  **4. The "Fringe Consensus" Problem.**
  If the academic consensus itself is in a state of flux, Step 2 (Consensus Engagement) may yield false positives. If the field is genuinely divided, a pitch attacking one side may look like it's attacking "consensus" when none exists. This requires the **Step 2 Judgment Call**.

  **5. No Substitute for Peer Review.**
  This is an editorial triage tool, not a peer-review substitute. It filters out structural nonsense, not subtle errors. A **GREEN** pitch still requires standard fact-checking and expert review.

  ---

  ## Operational Notes for the Research Team

  *   **On Judgment Calls:** When you hit a **[JUDGMENT CALL]** flag, do not default to "Reject." Default to "Discuss." The purpose of the flag is to surface the ambiguity to the Senior Editor.
  *   **On the "Dislike" Factor:** If you personally believe a **GREEN** pitch is nonsense, check your bias against Step 3. Are you rejecting it because it's *insulated* (Pseudo) or because you think the *conclusion is wrong* (False)? If the latter, it passes the demarcation check.
  *   **Time Management:** If Step 1 or 2 fails, stop immediately. Do not waste time fact-checking the rest of the pitch. The structural flaw is sufficient for rejection.
