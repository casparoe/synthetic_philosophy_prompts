prompt: |-
  My brother is reading one of those popular books about infinity and sent me this passage on Skolem's paradox. I know just enough to smell that something in it is off, and nowhere near enough to say what.

  'Start with the Löwenheim-Skolem theorem: any first-order theory that has an infinite model has models of every infinite size. ZFC is written in a countable language, so if it's consistent at all then it has a model whose entire domain is countable. But ZFC proves Cantor's theorem, so it proves that uncountable sets exist. So this countable model has to contain a set that, from inside the model, is uncountable, even though from the outside it obviously has only countably many members. The resolution is that "uncountable" only ever means "there is no bijection inside the model". The bijection that shows the set is countable really does exist — it just isn't one of the model's sets. The model is missing a function, and so it is wrong about the size of its own continuum. Skolem drew the moral himself: notions like uncountability have no absolute meaning, they are always relative to a model, and so there is no fact of the matter about questions like the continuum hypothesis. Really this is an argument about the poverty of first-order logic. Write the axioms of set theory in second-order logic and they pin down a single universe — that is an old categoricity theorem of Zermelo's — so the whole paradox is just an artifact of choosing the wrong logic.'

  Two things I want to flag. The bit about second-order logic felt too glib to me: haven't we only pushed the problem up a level, given that "all subsets" is exactly the sort of thing that was supposed to be in question? And a friend doing a maths PhD says the "from the outside" line quietly assumes the model is standard/transitive, which the theorem doesn't give you. Are those real points, or are me and my friend just being contrary?

  There was also a footnote I half understood: apparently you can take any countable model of ZFC and extend it, without changing the natural numbers, so that what the first model called its continuum is countable in the bigger one. Is that right, and if it is, does it make things worse than the passage lets on?

  Please don't give me things to read — I've got no library access and I'm not going to chase references. Just argue it out. Could you work through the passage's claims in the order they appear and tell me what a set theorist or philosopher of maths would sign off on, what they'd wince at, and what is simply wrong, and then say whether the passage's two big conclusions (no absolute notion of uncountability, hence no fact of the matter about CH; and first-order logic is to blame, second-order logic dissolves the paradox) survive once the details are corrected.

  Sections, please, in this order:

  - What's right — about 120 words
  - What's subtly off — about 300 words
  - The footnote — about 120 words
  - Verdict on the two conclusions — about 200 words
  - What I tell my brother — about 80 words
