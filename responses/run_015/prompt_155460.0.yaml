  What's right
  The passage gets the basic mechanics of Skolem's Paradox correct. The Downward Löwenheim-Skolem theorem does guarantee that if ZFC is consistent, it has a countable model. There exists a set $S$ that the model "believes" is uncountable because the bijection between $S$ and the natural numbers is missing from the model's inventory of functions. Externally, since the whole domain is countable, such a bijection exists in the metatheory. The distinction between internal provability, where no bijection exists in the model, and external reality, where the domain is countable, is the standard mathematical resolution of the apparent contradiction.

  What's subtly off
  Your friend is right to be suspicious. The passage implies the model sits neatly inside the real universe like a subset, but most countable models are non-standard; their "natural numbers" contain infinite integers from the outside perspective. So "countable from the outside" is more complex than just missing a function; the very notion of "finite" differs inside vs. outside. The text also conflates Downward and Upward Löwenheim-Skolem; only the downward theorem guarantees the countable model needed for the paradox. Specifically, if the model is not transitive, the membership relation is not the real membership relation. This means the set theory inside the model is simulating set theory, not necessarily reflecting the true hierarchy. The claim about models of "every infinite size" mixes two distinct theorems. The Downward theorem gives the countable model essential for the paradox; the Upward theorem gives larger models. Conflating them obscures why the countable case is special.
  Regarding second-order logic: You spotted the glibness. Second-order logic with "full semantics" does achieve quasi-categoricity, fixing the height of the universe. However, this relies on a prior understanding of "all subsets". If you ask what fixes the meaning of "all subsets," you face the same relativity problem again. Second-order logic doesn't escape the need for a background set theory to interpret it. It shifts the indeterminacy from sets to properties.
  Furthermore, claiming second-order logic "pins down a single universe" is too strong. It pins down the universe up to isomorphism if you assume the background semantics are fixed. But since first-order set theory is used to define second-order semantics, the relativity hasn't vanished; it's just been relocated to the metatheory. The passage treats second-order logic as a magic bullet, ignoring that its semantics are arguably just as contentious as the first-order models it critiques. It assumes the background set theory is absolute, which begs the question against Skolem's relativism.

  The footnote
  The footnote describes forcing. You can indeed take a countable model of ZFC and extend it to a larger model where the old continuum is collapsed to be countable. This confirms the relativity of cardinality. It doesn't necessarily make things "worse" than the passage suggests, but it deepens the instability. It shows that even if you fix a model, you can stretch it to change what counts as "uncountable" without breaking the axioms. This reinforces Skolem's view that cardinality is not intrinsic to the sets themselves but depends on the surrounding universe of sets available to witness bijections. It demonstrates that size is a relationship between the set and the available functions in the model.

  Verdict on the two conclusions
  The first conclusion, that uncountability is relative, is widely accepted among technical set theorists as a feature of first-order semantics. Whether this implies "no fact of the matter" about CH is a philosophical leap. Platonists argue the models are imperfect reflections of a unique reality; Skolemists argue the models exhaust reality. The passage sides with Skolem, which is defensible but not proven.
  The second conclusion, blaming first-order logic, is much weaker. While second-order logic is more expressive, it lacks a complete proof system and relies on set-theoretic semantics. Saying it "dissolves the paradox" is misleading because it assumes the very set-theoretic clarity it claims to provide. It solves the categoricity issue only by presupposing a fixed background universe of subsets, which is exactly what was in question. So, the paradox isn't dissolved; it's transformed into a question about the semantics of second-order quantification. The passage oversells second-order logic as a solution rather than a shift in perspective.

  What I tell my brother
  Tell him the technical setup is sound, but the philosophical moral is contested. The paradox shows first-order logic can't capture "uncountability" absolutely, but switching to second-order logic just hides the problem in the semantics rather than solving it. Your friend's point about non-standard models is crucial: the "outside" view isn't as clean as the book implies. It's not that reality is relative, but that formal systems are limited tools.
