answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew my brother as a neighbor, a friend, or a son, you know him as someone who listened more than he spoke. For those of you who knew him as a colleague, you know him as someone who questioned more than he asserted.

  I have a specific instruction to follow. Before he died, he left a note regarding this service. It said: *Do not comfort anyone by claiming that the foundations of mathematics are secure.*

  To his colleagues here, that request is self-evident. He lived with the shadow of Gödel. He held the conviction, to his last day, that no proof of consistency can ever be obtained from inside the axioms themselves. To tell you otherwise would be to lie about his life's work.

  But to my family, and to those who never opened a textbook on logic, that request might sound cold. It might sound like he died believing that nothing makes sense.

  I am here to tell you that it meant the opposite.

  My brother spent his career studying what happens when the ground beneath us shifts. His last project was paraconsistent set theory. In classical logic, if you find a single contradiction in your system, the whole thing explodes. A single paradox allows you to prove anything and everything, rendering the system useless. They call this "triviality."

  My brother's work was an attempt to show that even if the axioms contradict, the edifice need not collapse. He was building a logic that could survive contradiction without falling into nonsense.

  He was not a skeptic for effect. He was a man who looked directly at the possibility that the universe is not perfectly consistent, and he decided to work anyway.

  And I think that is the comfort we can take today, without violating his memory.

  We are gathered here in a state of profound contradiction. He is in this room, in our memories and our hearts, and yet he is not. That is a contradiction. Grief itself is paraconsistent. It tells us that life goes on, while simultaneously telling us that it has stopped.

  If we demanded perfect consistency from life, this loss would render everything trivial. It would make the past meaningless and the future impossible. But we are not formal systems. We are human beings. We have the capacity to hold the contradiction of his absence and our love without collapsing into nihilism.

  He taught me that you do not need a guarantee of consistency to build something beautiful. You do not need to know that the foundation is unshakeable to lay a brick. You just have to trust the work.

  So, I will not tell you that the foundations are secure. I will not tell you that there is a proof that this pain makes sense, or that the universe is logically sound. My brother was too honest for that, and he loved us too much to ask us to be less honest than he was.

  Instead, I will say this: He showed us how to stand on ground that might shift, and how to build a life that remains standing even when it does.

  To his colleagues: He left the proof unfinished, but the direction was true.
  To my family: He loved us without requiring a guarantee that love is logically necessary.

  We can survive this. We can hold the contradiction. And we can keep going, not because we have proven it is safe, but because he showed us how to proceed without that proof.

  Rest well, my brother. The system holds.
