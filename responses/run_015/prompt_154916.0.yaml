answer: |-
  To defend the Redirection Thesis, we must first formalize the decision problem. Let $V$ represent the expected welfare value of a candidate intervention. We define $V$ as the product of three terms: $V = N \times C \times S$. Here, $N$ denotes the population size affected by the intervention. $C$ represents the credence factor, defined as the decision-maker's subjective probability that members of the population possess the capacity for valenced conscious states. Crucially, consistent with the background formalization, $C$ is treated as a shared property of the kind; it is not diluted by treating sentience as an independent probability per individual. $S$ denotes the sign factor, defined as the expected per-capita net welfare difference produced by the intervention, averaged over the individuals affected. The scale argument traditionally relies on the astronomical magnitude of $N$ for insects to amplify the product $C \times S$. The Redirection Thesis contends that $N$ performs no independent action-guiding work because the magnitude of $V$ is irrelevant if the sign of $S$ is unresolved.

  The claim of sign symmetry asserts that for population-scale insect interventions, the expected value of $S$ is approximately zero. This uncertainty is structural, not merely a reflection of temporary ignorance. Interventions typically operate through two channels: changing the number of individuals existing and changing the welfare per individual. These channels often run in opposite directions; for example, a intervention might reduce suffering per capita but also reduce population size, or vice versa. Without robust evidence weighting one effect against the other, the distribution of possible values for $S$ remains symmetric around zero. Multiplying a quantity symmetric around zero by an astronomical $N$ yields a larger quantity that remains symmetric around zero. Consequently, $N$ converts a small uncertainty into a large uncertainty, but it does not convert uncertainty into a reason for action. The action-guiding content lies entirely in resolving the sign of $S$, not in maximizing $N$.

  Two strong objections challenge this view. The linearity objection posits that expected value reasoning is linear in stakes. If a decision-maker assigns any non-zero probability to a positive sign, the astronomical $N$ should dictate action. The response is that linearity applies to the expectation $E[S]$, not to the magnitude of possible outcomes. If the distribution of $S$ is symmetric, $E[S] = 0$. The scale argument fails not because stakes are too high, but because the expected sign is null. $N$ cannot create a non-zero expectation where none exists; it can only amplify an existing expectation. Therefore, a decision-maker declining to act is not refusing information but correctly recognizing that $N$ does not settle the sign question.

  The learning objection argues that large-scale intervention is itself a method of resolving the sign question, suggesting the thesis's own appeal to information value recommends acting. This conflates irreversible implementation with measurement. The value of information scales with $N$, implying that resolving the sign is extremely valuable. However, the cost of error also scales with $N$. If the sign is unknown, large-scale intervention risks catastrophic negative value. The thesis recommends buying information via measurement where the cost of error is contained. Thus, the scale of $N$ argues for rigorous small-scale verification before deployment, not for immediate large-scale action.

  We must also consider the argument in mixture form. Instead of a single credence factor $C$, suppose we have a distribution over competing theories $T_i$, each assigning a weight $w_i$, a credence $C_i$, and a sign factor $S_i$. The total expected value is $\sum w_i (N \times C_i \times S_i)$. The Redirection Thesis survives this generalization provided that the theories do not converge on the sign of $S_i$. If some theories suggest the intervention helps and others suggest it harms, the weighted sum of signs may still approximate zero. In this scenario, $N$ again amplifies the magnitude of the conflict without resolving it. The thesis must only be qualified if all plausible theories converge on a non-zero sign; absent such convergence, population size remains epistemically inert regarding the direction of action.

  The constructive upshot for an allocator choosing between a large insect-directed intervention and a smaller, better-evidenced vertebrate intervention is an asymmetry favoring the latter. Since $N$ does not resolve the sign uncertainty for insects, the decision rests on the verifiability of $S$. Vertebrate interventions typically allow for clearer evidence regarding welfare changes due to physiological and behavioral similarities with humans. Therefore, the allocator should prefer the vertebrate intervention not because vertebrates matter more in principle, but because the sign factor for vertebrates is less uncertain. The thesis yields a recommendation to defer insect interventions until the sign factor can be verified at a small scale. The astronomical numbers justify the cost of research, not the cost of unverified implementation.

  Finally, we must state what would falsify the thesis. The thesis relies on the premise that the sign factor $S$ for insect interventions is structurally uncertain and symmetric. An empirical finding that would falsify this is the demonstration of a robust, theory-independent asymmetry in the welfare effects of a specific class of interventions. If it were established that a given intervention reliably reduces suffering per capita without triggering compensatory population growth, or vice versa, such that the net sign is robustly negative or positive across competing theories, then $N$ would regain its action-guiding force. Alternatively, a conceptual point falsifying the thesis would be a decision rule mandating action on potential magnitude despite sign uncertainty (e.g., a maximax rule). However, within the expected-value framework assumed by the scale argument, the discovery of a robust sign asymmetry is the primary condition under which the Redirection Thesis would be false. Until such evidence is available, population size remains a multiplier of uncertainty, not a guide for action.
