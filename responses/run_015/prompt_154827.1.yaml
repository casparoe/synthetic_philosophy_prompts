  *   *Analysis:* The Moving case is about *what* is owed (performance vs outcome). The Grave case is about *why* it binds (expectations vs status of the promise).
  *   *Synthesis:* The slogan "A promise is a promise" asserts the *sufficiency of the act of promising itself*. It claims the act generates a duty that is (a) specific in content (performance) and (b) independent of external validation (expectations). So it *is* one core claim (the normative power of the act) manifesting in two ways. I should articulate this carefully.

