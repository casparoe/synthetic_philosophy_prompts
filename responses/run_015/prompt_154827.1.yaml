answer: |-
  Here is a conceptual menu of the claims hidden inside "a promise is a promise," structured for your reading group. I have categorized them by their logical strength and indicated which side of your debate each claim supports.

  ### The Menu of Claims

  **1. The Definitional Claim**
  *   **Claim:** To say "I promise" is to perform a specific speech act that creates an obligation, distinct from predicting, hoping, or intending.
  *   **Status:** **Trivial.** Everyone in your group likely accepts this. It distinguishes promising from mere forecasting, but it does not tell us how strong the obligation is or what it entails.
  *   **Verdict:** **Neutral.** It establishes the game is being played, but not how to win it.

  **2. The Content-Independence Claim**
  *   **Claim:** The reason to keep a promise derives from the fact that it was promised, not from the independent value of the act promised.
  *   **Status:** **Substantive and Defensible.** This is the core of promissory obligation. It means you cannot simply recalculate the utility of the act (e.g., "movers are better") and ignore the promise.
  *   **Verdict:** **Supports the Group.** It defeats your argument in the Moving Case that the outcome was "better." The source of the duty is the undertaking, not the utility of the result.

  **3. The Performance Claim**
  *   **Claim:** What is owed is the specific performance undertaken, not merely the state of affairs that performance would bring about.
  *   **Status:** **Substantive and Defensible.** This distinguishes obligations of *action* from obligations of *result*. If I promise to sing at your wedding, hiring a better singer does not discharge the duty, even if the audience is happier.
  *   **Verdict:** **Supports the Group (Moving Case).** This directly answers your friend: you owed your presence, not a moved flat. The slogan here means "The specific act promised is the thing that is binding."

  **4. The Expectation-Independence Claim**
  *   **Claim:** A promise binds even if no one relies on it, no one monitors it, and no disappointment occurs upon breach.
  *   **Status:** **Substantive and Defensible.** This separates promissory duty from harm-based ethics. It explains why the secret breach of the grave promise is still a wrong, even if grandmother feels no pain.
  *   **Verdict:** **Supports the Group (Grave Case).** This refutes your "expectations story." The obligation attaches to the relationship and the word given, not to the psychological state of the promisee.

  **5. The Non-Compensability Claim**
  *   **Claim:** Breach of promise creates a moral residue that cannot be washed away by compensation or superior substitutes.
  *   **Status:** **Substantive and Defensible.** This captures your friend's intuition that you cannot "settle a promise like a bill." Apology and payment acknowledge the wrong, but they do not erase the fact that the specific duty was violated.
  *   **Verdict:** **Supports the Group (Moving Case).** It validates the friend's feeling of being wronged despite being made materially whole.

  **6. The Authority (or "Switch") Claim**
  *   **Claim:** The obligation is *directed*: only the promisee holds the normative power to release the promisor. The duty persists until the holder of the switch flips it.
  *   **Status:** **Substantive and Defensible.** This aligns with your own "switch" theory, but draws a different conclusion. If the promisee is dead (Grave), the switch cannot be flipped, so the duty remains. If the promisee is alive and refuses to flip it (Moving), the duty remains.
  *   **Verdict:** **Supports the Group (Both Cases).** In the Moving Case, your friend exercised her authority to *refuse* release. In the Grave Case, the authority holder is absent, making release impossible. The slogan here means "The bond holds until the other party cuts it."

  **7. The Absolutist Claim**
  *   **Claim:** Promissory obligations are exceptionless; they always override conflicting moral or prudential reasons.
  *   **Status:** **False / Too Strong.** Almost no one holds this. If keeping a promise requires harming an innocent third party, the promise may be overridden.
  *   **Verdict:** **Supports Neither.** This is a straw man. Your group likely doesn't mean this, or if they do, they are mistaken.

  **8. The Formalist Claim**
  *   **Claim:** The words used fix the content of the duty regardless of context, coercion, or the promisee's stake in the matter.
  *   **Status:** **False / Too Strong.** Promises made under duress, or regarding trivialities where no understanding of obligation existed, often do not bind.
  *   **Verdict:** **Supports Neither.** This ignores the relational context required for a promise to take hold.

  ***

  ### Synthesis: One Claim or Two?

  You asked whether the slogan backs both cases at once, or if it conflates two distinct claims (one about *what* is owed, one about *who* gets to say).

  **It is a single core claim manifesting in two dimensions.**

  The core claim is **The Sufficiency of the Undertaking.** This asserts that the act of promising itself generates a normative bond that is independent of consequences (utility) and independent of surveillance (expectations).

  *   **In the Moving Case,** this core claim manifests as **The Performance Claim.** Because the bond is about the undertaking itself, you cannot substitute a better outcome. The "what" is fixed by the promise, not by the goal.
  *   **In the Grave Case,** this core claim manifests as **The Expectation-Independence Claim.** Because the bond is about the undertaking itself, it does not require an audience or reliance to exist. The "why" is the promise, not the social pressure.

  **Where your "Switch" theory fits:**
  Your theory (that promising hands the promisee a switch) is actually the strongest philosophical support for the slogan, *provided* you accept that the switch defaults to "ON."
  *   **Moving Case:** The switch was in your friend's hand. She chose not to flip it. You broke the bond.
  *   **Grave Case:** The switch was in your grandmother's hand. She is no longer able to flip it. The bond remains closed.

  **Conclusion for the Group:**
  The slogan "a promise is a promise" is not a tautology; it is a shorthand for **Content-Independence** and **Authority**. It asserts that the reason to act comes from the *past act of promising* and the *present authority of the promisee*, not from the *future value of the outcome*.

  *   **To support your friends:** Argue that the slogan protects the **integrity of the relationship** over the **efficiency of the outcome**.
  *   **To support yourself:** You can only argue that the "Switch" implies a duty to *ask* for release when circumstances change drastically. If you didn't ask, the slogan stands against you. If you believe you were implicitly released (e.g., "she would have understood"), you are arguing about the *scope* of the authority, not the existence of the obligation.

  The slogan wins on the Grave Case (expectations don't matter) and the Moving Case (substitutes don't count) because both rely on the idea that the **promise itself is the source of value**, not what the promise produces.
