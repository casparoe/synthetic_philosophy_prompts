answer: |-
  ### I. Mapping Downward: Mental States and Evidence

  To analyze the Cotton case through these competing frameworks, we must first characterize the mental states involved—Thompson's perception during the assault, her encoding of the memory, and her retrieval during identification—and determine what counts as evidence under each theory.

  **1. The Argument from Illusion (Common-Factor Theory)**
  *   **The Mental State:** On this view, Thompson's experience during the assault (veridical perception of Poole) and her experience during the lineup (misperception of Cotton) share a "highest common factor." This core is the subjective, qualitative character of the experience—the vividness, the detail, the feeling of recognition. Whether the object is present (Poole) or absent/misidentified (Cotton), the immediate object of her awareness is this common experiential core, not the mind-independent man.
  *   **The Evidence:** For the police and jury, the evidence is the *strength of the common factor*. Thompson's high confidence and the vividness of her memory are taken as indicators of the robustness of this experiential core.
  *   **The Evaluation:** Under this theory, the legal system's treatment of Thompson's testimony was internally consistent but epistemically risky. Because the common factor is present in both true and false identifications, confidence tracks the *intensity of the experience*, not necessarily its *accuracy*. The police and jury treated the intensity of the common factor as a proxy for truth. Given the theory, they should have concluded that while Thompson was certainly having a vivid experience, that vividness guaranteed only the reality of the experience, not the reality of the connection between Cotton and the crime. The error occurred because they conflated the strength of the common factor with a guarantee of external reference.

  **2. Disjunctivism**
  *   **The Mental State:** Disjunctivism denies the common factor.
      *   *During the Assault:* If Thompson saw Poole, her experience was a relational state constituted by Poole himself.
      *   *During the Lineup:* When she identified Cotton, she was in a fundamentally different kind of state. If she was mistaken, she was not in a state of "perceiving the attacker" at all. She was in a state of *seeming* to perceive the attacker, which is metaphysically distinct from actually perceiving him.
  *   **The Evidence:** On this view, "evidence" in the veridical case is the world itself making itself manifest to the subject. In the non-veridical case (the Cotton identification), there is no relational evidence of the attacker. There is only an internal state that mimics the relational one.
  *   **The Evaluation:** Confidence and vividness, in a non-veridical case, attach to the *non-relational state*. They are properties of the illusion, not markers of a successful link to reality. The police and jury treated Thompson's identification as if it were a relational state (a direct link to the attacker). Disjunctivism says it was not. The options open to them, by the lights of this theory, were to recognize that an identification claim is a claim to a relational state, which cannot be verified merely by the subject's report of their internal state. They should have concluded that without independent verification (like DNA), the internal feeling of recognition provides no warrant for the claim that the relation holds.

  ### II. Mapping Upward: Does the Case Refute Disjunctivism?

  There is a tempting thought that the Cotton case confirms the Argument from Illusion and refutes Disjunctivism. The temptation runs as follows: Thompson's false identification of Cotton was, from her first-person perspective, indistinguishable from a true identification of Poole. She studied the face, she felt sure, she recognized him. If a false case can be subjectively identical to a true case, surely they share a common mental kind?

  This temptation must be resisted. The Disjunctivist insists that the dispute is **metaphysical**, not **epistemological**.
  *   **The Metaphysical Claim:** Disjunctivism claims that the *nature* of the successful state (relational) is different from the *nature* of the failing state (non-relational).
  *   **The Epistemic Limitation:** Disjunctivism does not claim the subject can always tell the difference. Thompson's inability to distinguish her false memory from a true one is an epistemic limitation, not proof of metaphysical identity.

  Therefore, the case does not refute Disjunctivism. The fact that Thompson could not tell the difference is compatible with the view that the states were fundamentally different. The case illustrates the *possibility* of error, which Disjunctivism accommodates by positing a distinct kind of non-veridical state that merely mimics the veridical one. The Argument from Illusion uses this indistinguishability to argue for a common core; the Disjunctivist uses it to argue for the fallibility of introspection. The case itself settles nothing between them because both theories can account for the existence of subjectively convincing errors.

  ### III. The Extension: Mnemonic Disjunctivism

  The conviction rested not on the immediate perception of the assault, but on Thompson's memory and her performance in identification procedures. To apply Disjunctivism here, we must construct **Mnemonic Disjunctivism**.

  **1. The View**
  Just as perceiving and hallucinating are not states of a common kind, genuinely remembering and merely confabulating (or imagining) are not states of a common kind.
  *   **Veridical Memory:** A relational state where the past event is a constituent of the current mental state.
  *   **Confabulation:** A non-relational state that lacks the past event as a constituent, even if it feels like memory.

  **2. Application to the Cotton Case**
  *   **The Photo Array and Lineup:** When Thompson viewed the photo array, she entered a new perceptual state. When she later viewed the lineup, her "recognition" of Cotton was likely influenced by the photo array. On Mnemonic Disjunctivism, if her identification was false, she was not "remembering the attacker" poorly; she was in a state of *confabulation* regarding the attacker, while perhaps relationally perceiving Cotton in the present.
  *   **Certainty:** Her certainty was a property of the confabulatory state. Mnemonic Disjunctivism predicts that certainty can be high in confabulation because certainty is not a measure of the relational link, but of the coherence of the current mental state.
  *   **Reliability:** If remembering and confabulating are different kinds, a reliable procedure would need to distinguish the *kinds*, not just measure the *intensity*. However, if they are introspectively indistinguishable (as Thompson's case suggests), no procedure relying solely on the witness's report can be reliable in principle. The procedure failed because it assumed that the output (the ID) was a transparent window into a relational memory state, when it was actually a non-relational construction.

  **3. Does this Help or Hurt the Disjunctivist?**
  This extension **helps** the Disjunctivist explain the *mechanism* of the failure, but it **hurts** their ability to offer a practical solution.
  *   **Help:** It explains why the system failed so catastrophically. The court treated a confabulation (non-relational) as if it were a memory (relational). Mnemonic Disjunctivism validates the intuition that a false memory is not just a "fuzzy" true memory, but a different beast entirely. It explains why DNA evidence was required to break the deadlock: internal introspection could not distinguish the kinds.
  *   **Hurt:** It leaves the Disjunctivist unable to account for the *felt continuity* that drives the legal system. If the states are fundamentally different kinds, why does the legal system (and human psychology) treat them as the same? The Disjunctivist must admit that while the metaphysics are distinct, the epistemology is blind to the distinction. This risks making the theory practically inert for legal reform. If we cannot tell the difference from the inside, the metaphysical distinction offers little guidance on how to prevent the error, other than "do not trust the witness."

  ### IV. The Epistemic Ask: A Commitment

  I commit to the position that the Cotton case is **evidentially inert** with respect to the metaphysical dispute between Disjunctivism and the Argument from Illusion, but it serves as a **pragmatic vindication of the Disjunctivist warning** against relying on introspective indistinguishability.

  **Reasons for this Position:**
  1.  **Compatibility of Error:** Both theories can accommodate the fact of wrongful conviction. The Common-Factor theorist says Thompson had a strong common core that failed to match the world. The Disjunctivist says Thompson was in a non-relational state that mimicked a relational one. The empirical facts (error, confidence, DNA exclusion) fit both models equally well. Therefore, the case cannot adjudicate the metaphysical truth of either.
  2.  **The Nature of the Dispute:** The dispute is about the *constitution* of experience, not the *frequency* of error. No amount of empirical data about mistaken IDs can prove whether the mental state shares a common factor or is disjunctive. That is a philosophical stipulation about the nature of mind and world, not an empirical hypothesis testable by lineup data.
  3.  **Pragmatic Vindication:** However, the case demonstrates the danger of acting *as if* the Common-Factor view is true in high-stakes environments. The legal system operated on the assumption that confidence (a property of the common core) tracked accuracy. This assumption led to injustice. Disjunctivism, by insisting that the non-veridical state is a *different kind* that lacks the world as a constituent, provides the stronger philosophical grounds for skepticism. It forces the conclusion that internal confidence is irrelevant to the truth of the relational claim. Thus, while the case doesn't prove Disjunctivism true, it shows that acting on Disjunctivist premises (extreme skepticism of the internal state's guarantee) is safer than acting on Common-Factor premises.

  **Points of Silence:**
  The case is silent on the **metaphysical constitution of Thompson's memory**. We cannot know, from the facts stipulated, whether her false identification lacked a relational constituent. That is not a fact discoverable by DNA or testimony; it is a philosophical interpretation of what memory *is*. Furthermore, the case is silent on whether there are *any* introspective markers that distinguish veridical from non-veridical states. It establishes that Thompson couldn't tell the difference, but it does not prove that *no one ever can*, nor does it prove that the states are metaphysically identical. The case tells us about the fallibility of the witness and the system, but it remains mute on the underlying architecture of the mind that the philosophers are debating.
