      *   **Part 3: The Ending (The Collapse).**
          *   Why did it end? Management wanted 8 hours (efficiency/overhead). Workers wanted 6. Market forces (post-war consumerism) made 6 hours economically unviable without wage cuts.
          *   *Keynes's Love of Money:* Did the love of money return? Or was it structural? The workers didn't cave; the system caved them. This suggests Keynes was right about human desire (they still wanted time) but wrong about the *system's* ability to allow it. The "love of money" was enforced by the structure of capitalism, not just individual pathology.
          *   *The Pathology:* Keynes thought the love of money was a neurosis to be cured. The Kellogg case suggests it's a requirement for survival in a competitive market.
