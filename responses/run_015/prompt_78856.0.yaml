      *   **Keynes's Vision:** 15-hour week, love of money as semi-pathological, "good life" defined by states of mind, love, friendship, aesthetic enjoyment (Moorean), anti-utilitarian calculation.
      *   **Kellogg's Reality:** 6-hour shifts (30-hour week approx), wages held steady initially, workers (mostly women) fought to keep it for decades, used time for family, church, community, gardening, fishing (not necessarily high aesthetic/contemplative pursuits). Ended due to management/market pressure, not worker desire.
      *   **Task:** A two-way case analysis.
          1.  Read Kellogg through Keynes's lens: Did they achieve the "good life"? Confirmation or embarrassment?
          2.  Read Keynes through Kellogg's lens: Limits of Keynes's conception (intellectual, individualist, class-bound, leisure as self-cultivation vs. solidarity/rest).
          3.  Address the Ending: Workers lost the fight. Does this refute Keynes on the "love of money"? Or was it external pressure?
      *   **Constraint:** Leave the awkward parts in. No bibliography/cites. Focus on residue, fit, and squeeze.

  2.  **Initial Brainstorming & Tension Identification:**

      *   *Tension 1: The Definition of Leisure.* Keynes thinks leisure = high culture/contemplation (Apostles). Kellogg workers used leisure = domesticity/community/rest (Working class).
      *   *Tension 2: The Motivation.* Keynes thinks we'll stop loving money. Kellogg workers *kept* the short week but needed the wages to stay roughly steady (initially). Later, they fought for the short week even when money was tight, but eventually, the 8-hour day won because of market pressures/wage stagnation.
      *   *Tension 3: The Agent of Change.* Keynes imagined a societal shift in values. Kellogg was a top-down paternalistic move that became bottom-up resistance, crushed by macroeconomic forces.
      *   *Tension 4: Class.* Keynes is elite Cambridge. Kellogg workers are Battle Creek factory girls. Can the elite vision apply to the working class?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. 1930 is the pivot point. Keynes theorizing from the top, Kellogg experimenting from the factory floor.
      *   **Part 1: Kellogg through Keynes's Eyes (The Fit and the Squeeze).**
          *   *The Fit:* They chose time over money. This validates Keynes's prediction that the marginal utility of income drops. They rejected the "love of money as possession."
          *   *The Squeeze/Awkwardness:* What did they *do* with the time? Keynes wanted "states of mind," art, philosophy. They did laundry, church, canning, fishing. Is this the "good life"? To Keynes, maybe not "high" enough. To them, absolutely. This exposes the class bias in Keynes's "good life." It's not just leisure; it's *specific* leisure.
          *   *The Verdict:* It confirms the *economic* prediction (time > money) but embarrasses the *moral/aesthetic* prediction (contemplation > domesticity).
      *   **Part 2: Keynes through Kellogg's Eyes (The Limits).**
          *   *Individualism vs. Solidarity:* Keynes's good life is about individual cultivation (Moore). Kellogg's fight was collective (union/workforce solidarity). The "good life" for them was embedded in social structures, not just internal states.
          *   *Leisure as Rest vs. Cultivation:* Keynes sees leisure as a canvas for art. Workers saw it as recovery from alienated labor + time for reproductive labor (home). Keynes ignores the exhaustion of work.
