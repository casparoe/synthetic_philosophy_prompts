answer: |-
  Hi everyone. Councillors, our guests from Poland, and… yeah, mostly just my mates and neighbours.

  For those who don't know me, I'm sixteen. I'm probably the youngest person speaking here, wich means I'll keep this proper short. I know you've all got places to be, and honestly, if I start sounding like a textbook, my friends in the back have promised to throw things.

  So, look. I know this week's been a bit intense. There's been a lot of shouting about the council vote. The £2m for the skatepark versus the flood relief overseas. I've heard people saying we turned our backs on the world to fix our own pavement. I've even heard folks saying that caring about what happens *here* instead of *there* is just… well, our debate club called it "extended egoism" last week. Basically, that nationalism is just selfishness with a flag.

  I get why people say that. It's easy to look at the map and think borders are just lines we drew to keep people out. But standing here, looking at our friends from Poland, I don't think it's that simple.

  See, I don't think loving your own town means you hate the rest of the world. It's not like love is a pie, right? Where if you give a big slice to your neighbours, there's none left for anyone else. We're building the skatepark because this is our home. We need to make sure our own house is standing straight before we can invite people round for tea. If we don't have a community here, if we don't have spaces for kids to actually meet up and talk, then what have we got to share with anyone?

  But—and this is the important bit—having a home doesn't mean locking the door.

  That's why this twinning matters. It's not about pretending we're all exactly the same. You're from Poland, we're from here. We've got different histories, different weather, probably different ideas about what goes on a pizza. And that's fine. Borders exist. But they shouldn't be walls.

  If caring about our compatriots was just "extended egoism," then we wouldn't be standing here today. We'd just keep the money, build the park, and ignore everyone else. But we didn't do that. We're building the park *and* we're shaking hands across the channel. We're saying that we owe something to the people we live next to, yeah, but we also owe something to the people we want to know.

  Cosmopolitanism sounds like a fancy word for "citizen of the world," but you can't really live in the world without living somewhere specific first. You start where you stand. You look after your street, your town, your mates. But then you leave the gate open.

  So, to our delegates from Poland: welcome. You aren't here because we feel guilty about the vote. You're here because we reckon there's something worth connecting to. We want to know what life's like over there. We want to swap ideas, maybe swap skate tricks, and learn that "us" and "them" is a pretty small way to see things.

  We're investing in this town so we've got something solid to offer you. And hopefully, by knowing you, we become a bit less narrow about who counts as "us."

  Thanks for listening. Cheers to everyone, and welcome.
