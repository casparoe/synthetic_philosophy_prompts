prompt: |-
  I've somehow ended up on the works council at our parcel depot — about 900 of us, I'm one of five reps, I get two days a month of company time for it and I have to explain whatever we decide to a room of members in about ten minutes. My mate Dave's back is finished at 52 and I did a weekend course the regional union runs last month, and I've been chewing on it ever since.

  Here's the practical problem. We get five or six automation proposals a year. They always arrive labelled as productivity, safety, or improving the job — never as anything else. We can't fight all of them: we'd lose the room, and honestly management would just roll the same thing out at the new site up the road instead. So we need to pick. What I have is a gut, and the gut is unreliable in a specific way — it says no to anything with a motor in it and yes to anything with a screen in it, and I don't think that's actually tracking what matters.

  What I think matters, from the course, is something like: what happens to the time that gets freed up; what happens to what a worker's labour is worth, both to the company and to the worker; and what happens to the knowledge that currently lives in people's heads rather than in a manual. And the bit I found genuinely strange and can't stop thinking about — the same technology that could cut the working day is, in our situation, the thing that makes it longer and faster, and that isn't a fact about the technology. That's the bit I want operationalised.

  So: write me a procedure. Questions in the order I should ask them, what counts as an actual answer to each (as opposed to a number management made up), where the procedure stops and says oppose, where it says let it through with conditions and what those conditions are, where it stops and says this is a values question and has to go to a membership vote, and where it just honestly can't tell. Constraints: one page, runnable in the time I actually have, we never see the financial model, some of the inputs are going to be guesses and the procedure has to say what to do with a guess.

  Please keep these distinctions if they're real, and tell me if I've garbled them: cutting the hours needed to make something vs. cheapening the stuff workers buy (I think those pull in different directions and both matter for whether we're better off); who sets the pace once the machine is in; machinery only paying for itself while it's running, so pressure toward nights and weekends; and the people who would have been hired, not just the ones on the payroll now.

  Run it on these:

  1. A sort retrofit. About 40 of 300 sorter jobs go over three years by attrition, no compulsory redundancies, retraining into exception handling, pay bands unchanged — but the line sets the pace and logs everybody's individual rate.
  2. Lift-assist arms on the heavy line. The injury logs say they genuinely work, I've seen them. Management also wants tonnage-per-hour up and wants to keep staffing as is.
  3. A routing app. Drivers finish earlier; the saved time goes into more stops; pay per stop is unchanged; and it makes it easy to top up with on-call agency drivers at peak.

  And one I suspect your procedure can't handle, which is the one I most want you to be honest about: they want to record our experienced coders doing customs classification — headsets, cameras, the lot — to train a system that might someday do the coding. Nothing is cut now. The data leaves now, the machine turns up in three years, or never, or at a different depot.

  At least one of these has to come out as don't fight this when my instinct says fight it. I'd much rather find that out here than standing up in front of the members.

  Also: don't just tell me the name of a book to go read, I've got a shift on Monday. And tell me which step of your procedure is really a judgement call wearing a clipboard, plus what would change your mind about the whole shape of it — if who gets the time is the wrong master question, say what should replace it and which of the four cases would show that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Works Council Rep (one of five) at a parcel depot (900 workers).
      *   **Constraints:** 2 days/month company time, 10-minute presentation to members, one-page procedure, runnable in limited time, no access to financial models, some inputs are guesses.
      *   **Background:** Attended a regional union course. Has a "gut" feeling (anti-motor, pro-screen) but knows it's flawed.
      *   **Core Insight from Course:** Technology isn't neutral. It affects *who gets the freed time*, *value of labor*, and *embodied knowledge*. The paradox: tech *could* shorten the day but *does* lengthen/intensify it. This isn't technical; it's social/political.
      *   **Task:** Create an operational procedure (decision tree/checklist) to evaluate automation proposals. Test it on four specific scenarios. Identify where the procedure relies on judgment vs. hard data. Identify what would change the underlying theory.
      *   **Tone:** Practical, grounded, union-savvy, respectful of the user's intelligence and constraints. No academic fluff.

  2.  **Deconstruct the Core Insight (The "Why"):**
      *   The user identified the crux: *Who captures the surplus?*
      *   If tech saves time $\rightarrow$ Does the worker get less hours (same pay)? Does the company get more output (same hours)? Does the customer get cheaper goods?
      *   If tech captures knowledge $\rightarrow$ Does it deskill the worker? Does it create a black box?
      *   If tech sets the pace $\rightarrow$ Is it human-led or machine-led?
      *   *Constraint:* Must fit on one page (effectively) and be usable in a meeting/prep context.

  3.  **Drafting the Procedure (The "How"):**
      *   Need a sequence of questions.
      *   Need clear "Stop/Go" criteria.
      *   Need to handle "guesses" (since financials are hidden).
      *   Need to distinguish between "Oppose," "Conditional Accept," "Vote," and "Unknown."
      *   *Key Distinction:* The user mentioned: Cutting hours needed vs. cheapening goods. Who sets the pace. Machinery paying for itself (uptime pressure). Future hires vs. current payroll.
      *   *Drafting Questions:*
          1.  Who gets the time? (Hours vs. Intensity)
          2.  Who sets the pace? (Worker vs. Machine/Algorithm)
          3.  Where does the knowledge go? (Retained vs. Extracted)
          4.  What about the future workforce? (Attrition vs. Hiring freeze vs. Agency)
      *   *Handling Guesses:* If management won't commit to time savings in hours, treat it as intensity increase. If data leaves, treat as deskilling risk.
      *   *Values Vote:* If the trade-off is ambiguous (e.g., safety vs. surveillance), kick to members.

  4.  **Testing the Procedure on the Four Cases:**

      *   **Case 1: Sort Retrofit.**
          *   *Jobs:* 40/300 lost via attrition (no forced redundancies).
          *   *Pace:* Line sets pace + individual logging.
          *   *Pay:* Unchanged.
          *   *Analysis:* Time savings likely go to volume, not hours. Pace is machine-led. Surveillance increases.
          *   *Verdict:* Oppose or Heavy Conditions (ban individual rate logging). User's gut says fight (motor). Procedure should likely say fight or condition heavily.
          *   *Wait, user wants one to come out as "Don't Fight".* Let's look at the others.

      *   **Case 2: Lift-Assist Arms.**
          *   *Safety:* Genuine (injury logs confirm).
          *   *Catch:* Tonnage/hr up, staffing same.
          *   *Analysis:* Safety is good. But "tonnage up, staffing same" means intensity up. The time saved by not hurting backs is used to move more parcels.
          *   *Verdict:* Conditional. Accept safety, reject intensity hike.
          *   *User's Gut:* Pro-screen/machine? Maybe neutral.
          *   *Constraint Check:* User wants one to be "Don't Fight" against instinct. Maybe Case 3?

      *   **Case 3: Routing App.**
          *   *Effect:* Drivers finish earlier.
          *   *Catch:* Saved time = more stops. Pay per stop unchanged. Agency drivers at peak.
          *   *Analysis:* "Finish earlier" is a lie if "more stops" fills the gap. Actually, intensity goes up. Pay per stop unchanged means wage stagnation despite efficiency gains. Agency usage undermines collective bargaining power.
          *   *Verdict:* Oppose. (This aligns with gut).

      *   **Case 4: Data Extraction (Coders).**
          *   *Effect:* Record experts to train AI.
          *   *Catch:* Nothing cut *now*. Data leaves *now*. Machine *maybe* later.
          *   *Analysis:* This is the "Knowledge" question. Embodied knowledge is being extracted. Once the model is trained, the experts are redundant. The "maybe later" is a trap.
          *   *Verdict:* Oppose. (This is the hardest one).

      *   *Re-evaluating the "Don't Fight" constraint:* The user said: "At least one of these has to come out as don't fight this when my instinct says fight it."
      *   *Instinct:* "No to anything with a motor, yes to anything with a screen."
      *   *Case 1 (Sorter):* Motor. Instinct says Fight. Procedure should probably say Fight (Pace + Surveillance).
      *   *Case 2 (Lift Assist):* Motor/Arm. Instinct says Fight. Procedure might say **Conditional Accept** (Safety is real, but cap the intensity). This fits "Don't Fight" (with conditions).
      *   *Case 3 (App):* Screen. Instinct says Accept. Procedure says Fight (Intensity + Agency). This is the reverse (Fight when instinct says Accept).
      *   *Case 4 (Data):* Screen/Camera. Instinct says Accept. Procedure says Fight (Knowledge Extraction).
      *   *Selection:* Case 2 is the best candidate for "Don't Fight" (with conditions) despite being hardware. It saves backs. The procedure must isolate the *safety* benefit from the *intensity* cost.

  5.  **Refining the Procedure (One Page Constraint):**
      *   Needs to be tight.
      *   Step 1: The Time Question (Who keeps the savings?).
      *   Step 2: The Pace Question (Who drives?).
      *   Step 3: The Knowledge Question (Does it leave the building?).
      *   Step 4: The Boundary Question (Current vs. Future workers).
      *   *Handling Guesses:* "If management refuses to commit time savings to hours, assume 100% goes to intensity." "If data leaves the depot, assume it will be used to replace the role."

  6.  **Addressing the Theoretical Questions:**
      *   *Judgement Call:* Which step is subjective? Likely the "Values Vote" threshold or interpreting "Safety vs. Intensity."
      *   *Changing the Mind:* What if "Who gets the time" is wrong? Maybe it's "Who holds the power?" or "Bargaining Power." If Case 3 (App) actually reduced stress despite more stops, would that change things? No, the issue is the *capture* of value. The master question is *Bargaining Power*. If the tech strengthens the union's hand, it's good. If it weakens it (agency, surveillance, deskilling), it's bad.
      *   *Distinctions:* Confirm the user's distinctions (Hours vs. Prices, Pace, Uptime, Future Hires). They are correct.

  7.  **Final Polish:**
      *   Ensure tone is solidarity-focused but pragmatic.
      *   Make sure the "One Page" constraint is respected (visually or structurally).
      *   Ensure the "Don't Fight" outcome is clear for Case 2 (Lift Assist), as that's the most defensible "good tech" scenario, provided the intensity hike is blocked.
      *   *Self-Correction on Case 2:* If management insists on tonnage up, can we really accept it? If we accept the arms but block the tonnage increase, is that viable? Yes, that's a "Condition." So the verdict is "Accept with Conditions," which effectively means "Don't fight the *tech*, fight the *implementation*." This matches the prompt's request.

  8.  **Drafting the Response:**
      *   **Section 1: The Procedure.** (The "Tool").
      *   **Section 2: The Run-Through.** (Applying to the 4 cases).
      *   **Section 3: The Meta-Analysis.** (Judgement calls, theoretical shifts, confirming distinctions).

      *(Self-Correction during drafting)*: Make sure to explicitly address the "guesses" constraint in the procedure steps.
      *(Self-Correction on Case 4)*: This is the "Honest" one. The procedure must flag "Data Extraction" as a red line even if no jobs are cut *today*.

      *(Refining the "Don't Fight" instruction)*: The user wants one to come out as "Don't Fight" *against their instinct*. Their instinct is "No motors." Case 2 is motors. So Case 2 must be the "Don't Fight" (with conditions). Case 3 is "Screen" (Instinct Yes), but Procedure must say "Fight" (Intensity/Agency). This perfectly illustrates why the gut is wrong.

      *(Final check on constraints)*: One page feel. Runnable. No book recommendations.

      *(The "Master Question" revision)*: The user asks: "if who gets the time is the wrong master question, say what should replace it." I need to be careful here. "Who gets the time" is good, but "Who holds the leverage?" is better. I will suggest this nuance.

      *(Let's write it.)*
answer: |-
  ### The "Surplus & Leverage" Procedure (One-Page Draft)

  **Constraint:** If management will not commit to a number in writing, treat the guess as the *worst-case scenario for workers*. If financial models are hidden, assume the ROI relies on intensity gains, not volume growth.

  **Step 1: The Time Question (Who captures the surplus?)**
  *   **Ask:** "If this saves 10 hours of labour per shift, do hours reduce, does output increase, or does headcount freeze?"
  *   **Valid Answer:** Written commitment to reduced hours *or* reduced workload per capita.
  *   **Invalid Answer:** "Efficiency," "Competitiveness," or "Staffing remains as is."
  *   **Rule:** If time savings are not committed to *workers* (hours/wload), assume they are captured by *capital* (volume/profit). **→ GO TO STEP 2.**
  *   **Stop & Oppose:** If the proposal explicitly ties savings to headcount reduction (beyond natural attrition) or agency substitution.

  **Step 2: The Pace Question (Who drives?)**
  *   **Ask:** "Does the worker start the action, or does the machine/algorithm trigger the worker?"
  *   **Valid Answer:** Worker initiates; machine assists.
  *   **Invalid Answer:** Machine sets cycle time; algorithm routes without override; individual performance logging.
  *   **Rule:** If the machine sets the pace, it creates uptime pressure (nights/weekends) and removes human discretion. **→ GO TO STEP 3.**
  *   **Stop & Oppose:** If individual rate logging is introduced (surveillance/discipline tool).

  **Step 3: The Knowledge Question (Where does the skill live?)**
  *   **Ask:** "Does this tool require the worker's expertise to function, or does it record the expertise to function without them?"
  *   **Valid Answer:** Tool amplifies worker judgement (e.g., power steering).
  *   **Invalid Answer:** Tool records worker actions to train a model (data extraction).
  *   **Rule:** If knowledge is extracted from the depot, it is a future redundancy risk, even if jobs are safe today. **→ GO TO STEP 4.**
  *   **Stop & Oppose:** If data leaves the site to train a replacement system.

  **Step 4: The Boundary Question (Who counts as 'us'?)**
  *   **Ask:** "Does this increase reliance on non-bargaining unit labour (agency, contractors, new sites)?"
  *   **Valid Answer:** No change to permanent ratio.
  *   **Invalid Answer:** "Flexibility at peak," "Overflow to new hub."
  *   **Rule:** If it weakens the density of union members per shift, it weakens leverage.
  *   **Stop & Vote:** If safety improves but intensity increases (Step 1 & 2 conflict), send to membership vote.
  *   **Let Through:** Only if Step 1 is neutral/positive, Step 2 is worker-led, Step 3 is skill-retentive, and Step 4 is stable.

  ***

  ### Running the Cases

  **1. Sort Retrofit (40 jobs lost via attrition, line sets pace, individual logging)**
  *   **Step 1:** Staffing drops (attrition). Time savings captured by company. **FAIL.**
  *   **Step 2:** Line sets pace + Individual logging. **FAIL.** (Surveillance/Intensity).
  *   **Verdict:** **OPPOSE.**
  *   *Why:* Your gut says fight (motor). Procedure agrees. The individual logging is the poison pill; it turns the machine into a disciplinarian.

  **2. Lift-Assist Arms (Safety real, but tonnage up, staffing same)**
  *   **Step 1:** Staffing same, tonnage up. Time savings (less fatigue) captured by company as intensity. **FAIL.**
  *   **Step 2:** Worker initiates lift? Likely yes. **PASS.**
  *   **Step 3:** Skill retained. **PASS.**
  *   **Step 4:** No agency mentioned. **PASS.**
  *   **Verdict:** **CONDITIONAL ACCEPT.** (Don't fight the arms, fight the tonnage).
  *   *Why:* Your gut says fight (motor). Procedure says **Don't Fight the tech, Fight the quota.** The safety gain is real (backs don't grow back). The condition: We accept the arms *only if* tonnage-per-hour targets remain at pre-install levels. If management insists on higher tonnage, it reverts to **OPPOSE**.

  **3. Routing App (Finish earlier, but more stops, agency at peak)**
  *   **Step 1:** Saved time = more stops. Workers get no time back. **FAIL.**
  *   **Step 2:** Algorithm sets route/pace. **FAIL.**
  *   **Step 4:** Agency drivers at peak. **FAIL.** (Dilutes bargaining power).
  *   **Verdict:** **OPPOSE.**
  *   *Why:* Your gut says accept (screen). Procedure says **Fight.** This is the "intensification" trap. The tech makes the day *longer* in effort, even if the clock time is similar, and uses agency to break collective strength.

  **4. Data Extraction (Record coders to train AI)**
  *   **Step 3:** Records expertise to function without them. Data leaves site. **FAIL.**
  *   **Verdict:** **OPPOSE.**
  *   *Why:* Your gut says accept (screen/camera). Procedure says **Fight.** This is the "Knowledge" trap. You are being asked to build your own replacement. The "three years, maybe never" is irrelevant; once the data is gone, you have no leverage to stop it later.

  ***

  ### The Meta-Analysis

  **1. Which step is a judgement call wearing a clipboard?**
  **Step 4 (The Boundary/Vote).** Determining whether a safety gain outweighs an intensity hike is not math; it's values. The procedure flags it as a **Vote** because only the members can decide if saving a back is worth moving 10% more parcels. However, as a rep, *you* judge whether management is lying about the safety data. If the injury logs are solid (like Case 2), you push the Conditional Accept. If they are vague, you push the Vote.

  **2. What would change my mind about the shape of this?**
  The master question is currently *"Who gets the time?"*
  The better master question is **"Who holds the leverage?"**
  Time is just one form of leverage. Sometimes tech gives workers *more* leverage (e.g., a system that makes the depot entirely dependent on a specific skilled operator to fix it).
  *   **Which case shows this?** None of your four do. But if a proposal was: "New scanner requires 50 certified techs to run, cannot be operated by agency," that increases leverage for those 50.
  *   **If I found that:** I would replace Step 1 with **"Does this increase or decrease the cost of replacing us?"** If the tech makes us *harder* to replace, it's good, even if intensity rises slightly. If it makes us *easier* to replace (agency, automation, data extraction), it's bad, even if it saves time.

  **3. Confirming your distinctions**
  You have not garbled them. They are precise:
  *   **Cutting hours vs. Cheapening goods:** If the savings go to lower prices for customers, workers lose twice (same pay, higher intensity to justify price drop).
  *   **Who sets the pace:** Crucial. Machine pace = uptime pressure (nights/weekends) because the machine depreciates while idle. Human pace = breaks are possible.
  *   **Current vs. Future hires:** Automation often protects current payroll (via attrition) while killing the hiring pipeline. This shrinks the union long-term. Your procedure handles this in Step 1 & 4.

  **Monday Prep:**
  For the meeting, lead with Case 2. It shows you aren't Luddites ("We want the arms, Dave's back is done"). Then pivot to Case 3 & 4 ("But we won't let the screen do what the motor did"). It validates your gut on the hard stuff while correcting it on the safety stuff.
