answer: |-
  ### Seminar Plan: The Metaphysics of Money in Aristotle

  **Session Title:** Barren Metal: Aristotle on Household Management and Interest
  **Duration:** 50 Minutes
  **Target Audience:** First-Year Philosophy Students (No prior Aristotle)

  #### 1. Dependency-Ordered Sequence of Explanation
  To make the sterility argument feel inevitable rather than archaic, the seminar must proceed from the purpose of objects to the purpose of communities, and finally to the perversion of symbols.

  1.  **Teleology of Artifacts (Minutes 0–5):** Begin with the concept of *telos* (purpose). A shoe is for protecting feet; a knife is for cutting. Using a shoe to hammer a nail is possible but "unnatural" to the shoe's definition. This establishes the methodological lens: we judge actions by whether they fulfill or frustrate an object's inherent purpose.
  2.  **The Natural Limit of Need (Minutes 5–15):** Introduce *oikonomia* (household management). The goal of the household is self-sufficiency (*autarkeia*). Acquisition is natural only insofar as it secures the goods necessary for this self-sufficiency. Because human need is bounded (you only eat so much), natural acquisition is bounded.
  3.  **The Shift to Unlimited Accumulation (Minutes 15–25):** Introduce *chrematistike* (wealth-getting). When exchange shifts from satisfying need to accumulating the medium of exchange itself, the limit disappears. There is no natural ceiling to the number of coins one can hold. This is not yet "evil," but it is a category error regarding the good life.
  4.  **The Nature of Money as Measure (Minutes 25–35):** Define money (*nomisma*) not as wealth itself, but as a convention for measuring demand and facilitating exchange. It is a bridge, not a destination. Its *telos* is to move, not to stay and grow.
  5.  **The Sterility of *Tokos* (Minutes 35–45):** Apply the teleological lens to interest (*tokos*). To charge interest is to demand that money reproduce. Since money is a sterile measure (like a ruler), expecting it to grow is a metaphysical impossibility disguised as a contract. It treats a symbol as if it were a living organism.
  6.  **Synthesis via Carrying Example (Minutes 45–50):** Deploy the Tool Cooperative vs. Algorithmic Pool to solidify the distinction.

  #### 2. The Carrying Example: Tool Cooperative vs. Algorithmic Pool
  This example must illustrate the *limit* and the *nature* of the medium, not the fairness of the distribution.

  *   **Must Preserve:**
      *   **The Bounded Goal:** The Cooperative's goal is the *use* of the tool (drilling a hole). Once the hole is drilled, the transaction is complete. The obligation is returning the *same* utility (a working shovel).
      *   **The Sterile Medium:** The Algorithmic Pool uses "access-tokens." The tokens are not tools; they are claims on tools.
      *   **The Unnatural Growth:** The Algorithmic Pool adds tokens to the lender's account automatically over time. The tokens increase without new tools being built and without new holes being drilled. The medium itself is treated as fertile.
  *   **Must Avoid:**
      *   **Exploitation Narratives:** Do not describe the Algorithmic Pool as "cheating" the borrower or "stealing labor." If students focus on the borrower's suffering, they import a Marxist framework. The focus must remain on the *tokens* doing something impossible (growing without cause).
      *   **Risk or Service Fees:** Do not complicate the example with maintenance costs or risk premiums. This confuses "preservation of capital" (natural) with "augmentation of capital" (unnatural).
      *   **Technology Bashing:** The algorithm is not the villain because it is digital; it is the villain because it automates the *chrematistike* logic of limitless compounding.

  #### 3. Misconceptions and Interception Points
  First-year students will import modern economic assumptions. These must be intercepted before they harden.

  *   **Misconception:** "Aristotle hates all profit and trade."
      *   **Intercept Point:** Minute 15 (Introduction of *chrematistike*).
      *   **Deflection:** Clarify that retail trade for the sake of supplying the household is a subset of *oikonomia*. Aristotle condemns trade *for the sake of trade*, where profit is the end rather than the means to living well.
  *   **Misconception:** "Aristotle thinks coins are biologically sterile, like mules."
      *   **Intercept Point:** Minute 35 (The Sterility of *Tokos*).
      *   **Deflection:** Emphasize this is a functional/metaphysical claim, not biological. Coins don't breed any more than a ruler grows longer. It is about the *category* of the object (measure vs. substance).
  *   **Misconception:** "This is an early theory of exploitation (Surplus Value)."
      *   **Intercept Point:** Minute 40 (Explaining *Tokos*).
      *   **Deflection:** Explicitly state: "Aristotle is not worried about the worker being underpaid here. He is worried about the *money* being misused. The sin is against the nature of the currency, not the rights of the laborer."

  #### 4. Check for Understanding
  Do not ask for definitions. Ask for a classification based on the *telos*.

  *   **Prompt:** "Imagine a library. Scenario A: You borrow a book and promise to return it or replace it if lost. Scenario B: You borrow a book, and the library contract states that for every week you hold it, your 'borrowing credit' increases by 5%, allowing you to claim more books later without returning the original. Which scenario aligns with *oikonomia* and which with *chrematistike*, and specifically, why does Scenario B violate the 'sterility' argument?"
  *   **Success Criteria:** Students must identify that Scenario B treats the "credit" (medium) as generative rather than the book (use-object), and that it introduces a limitless accumulation of credit detached from the actual stock of books.

  #### 5. Open Exclusions
  To maintain focus within 50 minutes, the following must be explicitly bracketed:
  *   **Textual Discrepancies:** We will not discuss tensions between the *Nicomachean Ethics* (Book V) and *Politics* (Book I). We treat the argument as a unified position for this seminar.
  *   **Scholastic Reinterpretations:** No discussion of Aquinas or the Canon Law development of usury.
  *   **Modern Economic Defense:** We will not evaluate whether Aristotle was "right" about economics (e.g., time-value of money). We are analyzing his philosophical consistency, not his economic accuracy.

  #### 6. Settled vs. Contested Scholarship
  It is vital to distinguish what the text says from how scholars explain *why* the text says it.

  *   **Settled:** Aristotle explicitly distinguishes *oikonomia* from *chrematistike*. He explicitly labels interest (*tokos*) as "most unnatural" (*malista para physin*). He explicitly uses the metaphor of money being sterile/barren.
  *   **Contested:** The *grounding* of the sterility claim.
      *   *View A (Metaphysical):* Aristotle genuinely believes money has an ontological status as a measure, and violating this is a metaphysical error.
      *   *View B (Normative/Political):* The metaphysical language is a rationalization for a normative preference for agrarian aristocracy over merchant capitalism.
      *   *Seminar Stance:* We will teach the Metaphysical reading (View A) as it is the most philosophically distinct argument, but we will acknowledge in the summary that some scholars view this as a normative cover.

  ***

