      *   **Specific Interpretive Angle:** Metaphysical point about exchange-mediums (sterility), *not* proto-Marxist exploitation.
      *   **Carrying Example:** Neighborhood tool cooperative (bounded, replacement obligation) vs. Algorithmic P2P pool (compounding access-tokens, limitless).
      *   **Required Deliverables:**
          *   Prose plan (dependency-ordered sequence, example constraints, misconception interception, understanding check, exclusions).
          *   Distinction between settled scholarship and contested readings (specifically metaphysical vs. normative).
          *   JSON summary with specific fields.

  2.  **Deconstruct the Philosophical Content:**
      *   *Oikonomia:* Management of the household (*oikos*). Aim: Self-sufficiency (*autarkeia*). Limit: Need. Natural.
      *   *Chrematistike:* Art of wealth-getting. Aim: Accumulation. Limit: None. Unnatural.
      *   *Tokos* (Interest): Money breeding money. Aristotle calls it "most unnatural" (*para physin*).
      *   *The "Sterility" Argument:* Money is a medium of exchange (*nomisma*), not a tool of production. It doesn't naturally reproduce. Charging interest treats money as if it has a natural capacity to grow, which it lacks.
      *   *Crucial Nuance:* This isn't about labor theory of value (Marx). It's about the *telos* (purpose) of the object. A shoe is for wearing; if used for exchange, it's secondary. Money is for exchange; if used to generate more money, it perverts its nature.

  3.  **Drafting the Seminar Plan (Prose):**
      *   *Sequence:* Needs to build logically. Start with the familiar (household), move to exchange, then to money, then to interest.
      *   *Step 1: The Telos of Things.* Establish that things have purposes.
      *   *Step 2: Oikonomia.* Define natural acquisition (getting what you need).
      *   *Step 3: Chrematistike.* Define unnatural acquisition (getting for the sake of getting).
      *   *Step 4: The Nature of Money.* Money as a measure/medium, not a stock.
      *   *Step 5: Tokos.* The perversion. Money breeding money.
      *   *Step 6: The Example.* Apply the Tool Coop vs. Algo Pool.
      *   *Misconceptions:* Need to catch the "Aristotle hates business" and "Coins are biological" errors early.
      *   *Understanding Check:* Needs to test application, not definition.
      *   *Omissions:* Keep it simple. No *Nicomachean Ethics* vs. *Politics* tension. No Scholastic usury debates.
      *   *Settled vs. Contested:* Be honest. The text says money is sterile. *Why* Aristotle thinks that (metaphysical vs. normative) is debated.

  4.  **Refining the Carrying Example:**
      *   *Tool Coop:* I borrow a drill. I return the drill (or a working one). The "value" stays constant. The goal is the hole drilled (need).
      *   *Algo Pool:* I lend a digital token representing a drill. The protocol adds 5% tokens to my account automatically. Now I have 1.05 tokens. I didn't drill anything. The tokens grew.
      *   *Must Preserve:* The distinction between *use-value* (drilling) and *exchange-value* (tokens). The presence/absence of a natural limit (need vs. infinite compounding).
      *   *Must Avoid:* Making the Algo Pool look like "theft" or "exploitation." It must look like *magic* or *category error* (tokens growing without human action).

  5.  **Addressing Misconceptions:**
      *   *Misconception 1:* Aristotle is anti-profit/anti-trade. *Intercept:* When defining *chrematistike*. Clarify trade for need is okay.
      *   *Misconception 2:* Aristotle thinks coins are biologically sterile. *Intercept:* When discussing *tokos*. Clarify it's about function, not biology.
      *   *Misconception 3:* This is an early version of Marx's surplus value. *Intercept:* During the *tokos* explanation. Emphasize *telos*, not labor exploitation.

  6.  **Developing the Understanding Check:**
      *   Don't ask "What is *tokos*?"
      *   Ask: "Here is a scenario (e.g., renting a house vs. selling a house for profit to buy two). Which is which and why?"
      *   Better: Use the tool example. "If the tool coop charged a fee to maintain the tools, is that *tokos*? Why/why not?" (Tests the "limit" and "purpose" aspect).

  7.  **Clarifying Settled vs. Contested:**
      *   *Settled:* Aristotle distinguishes *oikonomia* and *chrematistike*. He condemns interest. He uses the sterility metaphor.
      *   *Contested:* Is the sterility argument *really* metaphysical (about the nature of money) or is it a normative cover for social conservatism? Is he inconsistent between *Ethics* and *Politics*? (We will exclude the inconsistency part).

  8.  **Constructing the JSON:**
