prompt: |-
  I teach an upper-level seminar on decision theory — fourteen students, one 90-minute session, and they've already spent a week on Newcomb's problem, so they know the shape of a fight between causal and evidential reasoning but haven't met the case where the two-branch structure is sharper. Design an in-class game of counterfactual mugging with real (non-monetary) stakes, arranged so that students feel the pull of paying the mugger before any theory is named. I want one genuinely novel structural element: run it in pairs, where each pair collectively plays a single agent facing one coin flip, but one student is assigned the heads-branch and the other the tails-branch, so the "counterfactual you" that the thought experiment merely imagines is an actual person in the room with an actual stake in whether their counterpart hands over the money. Rules, a payoff scheme, and a way to randomize the flip so students can't suspect the facilitator. Then a second round where agents are invited to publicly precommit before the flip, so we can see who changes their answer and whether the change tracks anything coherent. The debrief should map the game onto the standard case, and then confront the obvious objection — that pairing branches makes the game playable precisely by destroying the feature that makes the thought experiment interesting, since in the real case the other-branch self never exists and can never confront you. Be explicit about which intuitions the paired version elicits and whether those intuitions transfer to the unpaired case. Also include a follow-on discussion, still in the debrief, of whether students' behavior in the game gives them any standing to moralize at people who refuse to pay: is refusing to pay a mistake, a legitimate self-locating judgment, or just the rational thing for an agent who cannot precommit? Give the facilitator an honest list of what will predictably go wrong the first time this is run — including the strong possibility that students negotiate side payments between paired branches, which is arguably the most philosophically interesting failure available — and say how to handle each. No lecture up front; they shouldn't hear the name of the problem until the game is over.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on decision theory (14 students, 90 mins).
      *   **Prior Knowledge:** Students know Newcomb's Problem (Causal vs. Evidential Decision Theory).
      *   **Goal:** Introduce Counterfactual Mugging (CFM) via an in-class game *before* naming the theory.
      *   **Key Constraint 1 (Novelty):** Run it in *pairs*. One student = Heads branch, One student = Tails branch. They collectively play one "agent." The "counterfactual you" is a real person.
      *   **Key Constraint 2 (Stakes):** Real, non-monetary stakes (to avoid IRB/ethical issues with gambling real money, though "play money" or course credit is usually the academic standard, the prompt asks for "real (non-monetary) stakes"). I need to interpret this carefully. Usually, in philosophy classes, this means points, candy, or social capital. Let's aim for something tangible but low-risk, like course participation points or a tangible treat (chocolate) that represents utility. Let's use "Utility Tokens" redeemable for a tangible reward (e.g., fancy chocolate or a small grade bump/participation credit).
      *   **Key Constraint 3 (Randomization):** Transparent randomization (no facilitator trust issues).
      *   **Key Constraint 4 (Two Rounds):** Round 1 (No precommitment), Round 2 (Public precommitment allowed).
      *   **Key Constraint 5 (Debrief):** Map to standard CFM, address the "pairing destroys the thought experiment" objection, discuss moralizing/standing, and predict failures (specifically side-payments).
      *   **Key Constraint 6 (No Lecture Up Front):** Don't name the problem until after the game.

  2.  **Deconstruct the "Paired CFM" Mechanism:**
      *   *Standard CFM:* Omega flips a coin. If Heads, you pay $100. If Tails, Omega gives you $10,000 *if and only if* Omega predicts you *would have* paid $100 in the Heads case. You are in the Tails branch. Do you pay? (Wait, usually CFM is: You are told the coin came up Tails. Omega says "If it had come up Heads, I would have asked for $100. Since it's Tails, I give you $10k *if* you would have paid." Actually, the standard Parfit/Yudkowsky version is: Omega flips. If Heads, Omega asks for $100. If Tails, Omega gives $10,000 *provided* you would have paid if it were Heads. You are told it is Tails. Do you regret not precommitting? Or, a variant: You are in the Heads branch. Do you pay?
      *   *Clarification on CFM Structure:* The classic "Counterfactual Mugging" (Yudkowsky) usually puts the agent in the position where the coin *actually* came up Tails (reward branch), but the reward is contingent on what they *would have done* in the Heads (loss) branch.
      *   *However*, to make it playable in class with pairs:
          *   Pair = One Agent.
          *   Student A = Heads Role (The Payer).
          *   Student B = Tails Role (The Receiver).
          *   Coin Flip happens.
          *   *Scenario 1 (Heads):* Student A must decide whether to give up tokens. Student B gets nothing.
          *   *Scenario 2 (Tails):* Student B receives tokens *only if* Student A *would have* given up tokens.
          *   *Problem:* If we flip a real coin, only one branch happens. The other student is left out.
          *   *Solution:* We need to simulate the *counterfactual* dependency.
          *   *Revised Mechanism:*
              1.  Pairs form. A (Heads), B (Tails).
              2.  They discuss strategy (or don't, depending on round).
              3.  Coin Flip (Transparent).
              4.  *If Heads:* Student A is asked: "Give up 5 tokens." If yes, Pair gets 0. If no, Pair gets 0. (Wait, this doesn't capture the reward).
              5.  *Let's stick closer to the logic:* The reward depends on the *policy*, not just the action in the actual world.
              6.  *Better Mechanism for Class:*
                  *   Phase 1: Decision. Student A (Heads) decides *now* what they would do if Heads. Student B (Tails) waits.
                  *   Phase 2: Flip.
                  *   Phase 3: Payout.
                  *   *If Heads:* Student A loses 5 tokens. Student B gets 0.
