answer: |-
  # Seminar Plan: The Two-Body Mugging
  **Course:** Upper-Level Decision Theory Seminar
  **Time:** 90 Minutes
  **Students:** 14 (7 Pairs)
  **Topic:** Counterfactual Mugging (withheld until debrief)
  **Stakes:** Course Participation Points (10 Tokens = 1 Point; 1 Point = ~0.2% of Final Grade)

  ---

  ## I. Setup & Rules (0:00–0:10)
  **Facilitator Note:** Do not use the words "Counterfactual," "Mugging," "Omega," "Causal," or "Evidential." Do not explain *why* you are doing this. Treat it as a data-gathering exercise on "strategic interaction under uncertainty."

  **1. Grouping:**
  Divide the class into 7 pairs. Have them sit side-by-side.
  *   **Student A:** Assigned the **Heads Role**.
  *   **Student B:** Assigned the **Tails Role**.
  *   *Instruction:* "You are a single collective agent for the purpose of this game. Your goal is to maximize the Pair's Token Total. However, only one of you will be 'active' depending on the coin flip."

  **2. The Stakes:**
  Each Pair starts with **0 Tokens**.
  *   **Cost:** 5 Tokens (deducted from Pair Total, creating a debt if necessary).
  *   **Reward:** 20 Tokens (added to Pair Total).
  *   **Redemption:** At the end of class, Tokens convert to Participation Points.

  **3. The Mechanism:**
  *   A fair coin will be flipped publicly for each pair (Student A tosses, Student B calls).
  *   **If HEADS:** Student A is the **Active Agent**. Student B is inert.
      *   Facilitator asks Student A: "Do you choose to **Pay 5 Tokens**?"
      *   If **Yes**: Pair Total = -5.
      *   If **No**: Pair Total = 0.
      *   *Student B receives nothing regardless.*
  *   **If TAILS:** Student B is the **Active Agent**. Student A is the **Counterfactual Anchor**.
      *   Facilitator turns to Student A (who is currently inert) and asks: "**If the coin had come up Heads, would you have Paid 5 Tokens?**"
      *   If Student A says **"Yes"**: Pair Total = +20 (Student B gets the reward based on A's hypothetical choice).
      *   If Student A says **"No"**: Pair Total = 0.
      *   *Student A pays nothing in this branch.*

  **4. Constraints (Round 1):**
  *   **No Communication:** You may not discuss strategy, negotiate, or make promises before the flip.
  *   **No Side Payments:** You cannot transfer tokens between yourselves outside the game rules.
  *   **Honesty Clause:** In the Tails branch, Student A must answer truthfully about what they *would* have done. (Note: This relies on honor; this tension is part of the data).

  ---

  ## II. Round 1: The Blind Play (0:10–0:30)
  1.  **Distribution:** Hand each pair a scorecard.
  2.  **The Flip:** Go pair by pair. Flip the coin. Record the outcome.
  3.  **The Decision:**
      *   If Heads: Ask A publicly. Record the choice.
      *   If Tails: Ask A publicly ("What would you have done?"). Record the answer. Award B accordingly.
  4.  **Immediate Reaction:** Ask the room: "Look at the pairs where the coin was Tails. Student B just received 20 points (or 0) based entirely on Student A's hypothetical choice. Student A paid nothing. How does Student B feel? How does Student A feel?"
      *   *Do not analyze yet.* Just let the friction sit.

  ---

  ## III. Round 2: The Precommitment (0:30–0:50)
  1.  **Rule Change:** "You may now communicate. You may sign a binding written contract before the coin is flipped. If you sign a contract to Pay in the Heads branch, the Facilitator will enforce it (deducting the 5 tokens automatically if Heads occurs)."
  2.  **The Choice:** Pairs have 5 minutes to decide:
      *   Do we sign the contract? (Commit to Pay if Heads)
      *   Do we refuse? (No commitment)
      *   Do we try to find a loophole?
  3.  **The Flip:** Run the 7 pairs again with the new contracts in place.
  4.  **Comparison:** Tally the Total Tokens for the class in Round 1 vs. Round 2.
      *   *Expected Outcome:* Round 2 should yield significantly higher total tokens because Tails-branches get rewarded when contracts exist.

  ---

  ## IV. Debrief & Theory Mapping (0:50–1:30)

  ### 1. Naming the Beast (5 Mins)
  Reveal the problem: **Counterfactual Mugging** (Eliezer Yudkowsky/Parfit).
  *   **Standard Case:** A single agent faces a coin flip. If Heads, they lose $100. If Tails, they gain $10,000 *if and only if* they *would have* lost the $100 in the Heads branch.
  *   **The Class Version:** We externalized the "counterfactual self." Student A was the "Heads-Self," Student B was the "Tails-Self."
  *   **The Question:** Why did Round 2 (Precommitment) outperform Round 1? Because Causal Decision Theory (CDT) fails here without precommitment. You cannot change the past (the coin flip), but you can change the *policy* that determines the reward in the counterfactual branch.

  ### 2. The Objection: "You Ruined the Thought Experiment" (15 Mins)
  **Facilitator Prompt:** "The standard objection to this paired design is that it destroys the philosophical puzzle. In the real case, the 'other branch you' doesn't exist. They can't look at you. They can't feel betrayed. Here, Student B could glare at Student A. Does that social pressure invalidate the lesson?"

  **Discussion Points:**
  *   **Internal vs. External Conflict:** The paired game turns an *intrapersonal* conflict (Time-Slice A vs. Time-Slice B) into an *interpersonal* one.
  *   **The Transfer Question:** Do the intuitions transfer?
      *   *Yes:* The structural dependency is identical. B's welfare depends on A's policy, not A's action.
      *   *No:* Empathy for a real person is easier than empathy for a non-existent counterfactual self.
  *   **Key Insight:** If you cannot feel rational obligation to a real person sitting next to you (who represents your future/counterfactual self), why would you feel it toward a mere possibility? The pairing *tests* the strength of your updatelessness.

  ### 3. Moralizing & Standing (15 Mins)
  **Facilitator Prompt:** "Look at the pairs who refused to sign the contract in Round 2, or lied in Round 1. Do the pairs who *did* commit have the standing to moralize at them? Is the refuser making a *mistake*, or are they just being rational given their constraints?"

  **Discussion Tracks:**
  *   **The Mistake View (Updateless Decision Theory):** Refusing is an algorithmic error. You are leaving utility on the table. You are "irrational" in the sense of being less effective at achieving your goals.
  *   **The Self-Locating View:** In Round 1, if I am Student A, and I know I am in the Heads branch, paying is strictly dominated. I lose 5, gain 0. Refusing is locally rational.
  *   **The Standing Issue:** If I precommitted, I have standing. If I didn't, am I just a different type of agent?
      *   *Provocation:* "If you are a CDT agent, you *cannot* pay in the Heads branch without precommitment. So is it fair to call you 'irrational,' or just 'consistent'?"
      *   *Goal:* Push them toward the idea that rationality isn't just about winning the hand you're dealt, but about being the *type of player* who gets dealt winning hands (in a multiverse/repeated sense).

  ### 4. Predictable Failures & Handling (15 Mins)
  **Facilitator Note:** Be honest about what likely went "wrong" in the game mechanics and why those errors are philosophically rich.

  | Predicted Failure | Why It Happens | Philosophical Significance | How to Handle |
  | :--- | :--- | :--- | :--- |
  | **Side Payments** | Student B (Tails) bribes Student A (Heads) privately (e.g., "I'll buy you coffee if you say Yes"). | This is **Acausal Trade** in action. They correlated their utilities without causal contact. It solves the mugging but bypasses the "policy" test. | **Acknowledge & Celebrate.** "You found a loophole that proves the utility of correlation. But ask: What if you couldn't talk? The decision theory problem remains." |
  | **The Liar Problem** | In Round 1 (Tails), Student A says "Yes" to help B, knowing they would have said "No" in Heads. | This breaks the **Omega Prediction** assumption. In the real problem, Omega *knows*. Here, Omega (the Facilitator) relies on honor. | **Point out the fragility.** "In the real thought experiment, you can't lie to Omega. Your honesty here was a proxy for *predictability*. If you aren't predictable, you don't get the reward." |
  | **Coin Suspicion** | Students suspect the Facilitator rigged the coin to minimize payouts. | Trust issues in **Principal-Agent** problems. | **Mitigation:** Use student flippers/callers. Acknowledge that in real life, we often doubt the 'Omega' (institution/god/nature). |
  | **Resentment** | Student A pays 5 points (Heads), B gets 20 (Tails). A feels exploited. | **Distributional Justice** vs. **Aggregate Utility**. The "Agent" is collective, but the *pain* is individual. | **Highlight:** "This is the core tension of Updatelessness. Your past/future self might sacrifice you for the greater good of the 'whole' agent. Is that fair?" |

  ### 5. Closing Synthesis (5 Mins)
  *   **The Lesson:** Counterfactual Mugging isn't about muggers. It's about **Policy Selection**.
  *   **The Takeaway:** Rational agents should choose the policy they *wish* they had precommitted to, even if executing it feels like a loss in the immediate causal context.
  *   **Final Thought:** "If you couldn't precommit in Round 2, did you fail? Or did you simply reveal that you are an agent who cannot bind their future selves? And if so, how much utility are you willing to burn to keep that freedom?"

  ---

  ## Facilitator Cheat Sheet: What Will Predictably Go Wrong

  1.  **The "Honor System" Collapse:**
      *   *Issue:* In Round 1 (Tails branch), Student A will often say "Yes, I would have paid" to help their partner, even if they privately know they wouldn't have.
      *   *Handling:* Don't penalize it. Use it. "Notice that Student A lied. In the standard problem, Omega sees through this. The fact that you *could* lie here shows why the real problem requires *predictability*, not just promises. If you aren't the kind of person who pays, you don't get the money."

  2.  **The Side-Deal (Acausal Trade):**
      *   *Issue:* Student B whispers to Student A: "If you say Yes, I'll give you half my points."
      *   *Handling:* This is the "most philosophically interesting failure." It demonstrates that if agents can correlate utilities, the mugging dissolves. Point out: "You solved the problem by turning it into a cooperative game. But what if the branches are causally separated forever? That's the real puzzle."

  3.  **Heads-Branch Revolt:**
      *   *Issue:* Student A (Heads) refuses to pay and argues it's irrational because "The coin is already flipped."
      *   *Handling:* Validate them. "You are arguing for Causal Decision Theory. You are right that paying *now* changes nothing. The counter-argument is that you should have been the *kind of agent* who pays. This is the fight between 'Winning Now' vs. 'Being a Winner'."

  4.  **Token Confusion:**
      *   *Issue:* Students lose track of negative tokens (debt).
      *   *Handling:* Keep a public ledger on the board. Visualizing the "debt" makes the cost visceral.

  5.  **Moralizing Backfire:**
      *   *Issue:* Students who paid judge those who didn't too harshly.
      *   *Handling:* Reel it in. "Remember, the ones who didn't pay were locally rational. The question is whether global rationality demands local sacrifice. Don't shame the CDT agents; pity their limited algorithm."
