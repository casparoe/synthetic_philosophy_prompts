      *   **Stakes:** Participation Points (e.g., 0.5% of course grade per 10 points). This is "real" for students.

  4.  **Addressing the "Novel Structural Element" (The Pairing):**
      *   The prompt emphasizes that the counterfactual self is a *real person*.
      *   This creates social pressure. H might pay because B is looking at them.
      *   This *breaks* the isolation of CFM. The debrief must tackle this.

  5.  **Addressing the Debrief & Objections:**
      *   *Objection:* Pairing makes it a coordination game/social contract, not a decision theory problem.
      *   *Response:* Acknowledge this. The pairing externalizes the internal conflict between "temporal selves."
      *   *Moralizing:* Do those who pay have standing to blame those who don't? (Updatelessness vs. Time-Consistency).

  6.  **Predicting Failures:**
      *   *Side Payments:* B bribes A to say "Yes" in the Tails world.
      *   *Lying:* A says "Yes" in Tails world just to get B the money, knowing they wouldn't have actually paid.
      *   *Confusion:* Students don't understand the counterfactual condition.
      *   *Facilitator Bias:* Students think the coin is rigged.

  7.  **Timing (90 Minutes):**
      *   Setup & Rules (10 mins)
      *   Round 1 (20 mins) - Play + immediate reaction.
      *   Round 2 (20 mins) - Precommitment + Play.
      *   Debrief (40 mins) - Theory mapping, Objections, Moralizing.

  8.  **Refining the "Real Stakes":**
      *   Money is tricky (gambling policies).
      *   Course points are high stakes.
      *   *Compromise:* "Donation Tokens." The class accumulates tokens. If the class total > X, the Professor donates $X to a charity of the class's choice. This removes individual gain but keeps "real" consequence.
      *   *Alternative:* The prompt says "real (non-monetary) stakes." Let's use **Extra Credit Points**. It's the currency of the realm for students. It's real to them.
      *   *Wait, one more idea:* **The "Punishment" Token.** If the pair fails to maximize utility, they have to do something mildly annoying (e.g., stand up and clap for 30 seconds). No, that's too gimmicky.
      *   *Decision:* Use **Course Participation Points**. It's standard, understood, and "real."

  9.  **Structuring the "Honest List of What Will Go Wrong":**
      *   Need to be specific.
      *   1. Side deals (B gives A coffee later).
      *   2. The "Liar" problem (In Tails world, A says they would have paid, but wouldn't have).
      *   3. Resentment (A pays, B gets points, A feels ripped off if they don't share utility).
      *   4. Coin suspicion.

  10. **Final Review against Constraints:**
      *   14 students (7 pairs).
      *   90 mins.
      *   No theory names up front.
      *   Paired structure (H/T roles).
      *   Round 1 (No precommit) vs Round 2 (Precommit).
      *   Debrief on pairing objection & moralizing.
