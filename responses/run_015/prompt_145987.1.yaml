          *   Formal structure must be visible in the action/dialogue.
          *   Specific Bayesian requirements:
              *   Hard findings commute (conditioning).
              *   Soft findings on same partition collapse (earlier drops out).
              *   Soft findings on *different partitions* fail to commute (the crux).
              *   Hard vs. Soft commutation is not guaranteed (don't imply it is).
              *   Show the "load-bearing" assumption: Conditional probabilities ($P(H|E_i)$) must stay fixed during Jeffrey updating.
              *   Character arc: A senior surveyor revises her view of what a finding indicates (changes $P(H|E_i)$), violating the Jeffrey update assumption. The doctrine has no grip on her.
              *   Resolution: No fiat. The findings arrived simultaneously (no fact of matter on order). The tribunal confronts the lack of a principled ordering vs. the need for a likelihood model (conditioning on the existence of the report).
          *   Tone: Fiction, scenes, dialogue, concrete loss, stakes.
