      *   **Doctrine:** "Sequential Integrity." Findings must be absorbed in the order filed because soft findings on *different partitions* do not commute (order matters).
      *   **Plot:** Two soft findings (one on vessel condition, one on weather/conduct) filed in different orders yield different loss apportionments (someone's fortune depends on it).
      *   **Constraints:**
