  2.  **Deconstruct the Mathematics for Narrative:**
      *   *Jeffrey Conditioning:* $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
      *   *Non-commutativity:* If Finding A updates partition $\mathcal{A}$ and Finding B updates partition $\mathcal{B}$, and $\mathcal{A} \neq \mathcal{B}$, then $Update_B(Update_A(P)) \neq Update_A(Update_B(P))$ generally.
      *   *The "Load-Bearing" Constraint:* The rule requires $P(H|E_i)$ to remain constant. If the surveyor changes her mind about what the evidence *means* (i.e., changes the likelihoods or conditionals), the kinematic rule breaks.
      *   *The Crisis:* Two findings arrive simultaneously. Order is undefined. The result depends on order.
      *   *The Solution Hint:* Move from Jeffrey Conditioning (soft evidence) to Bayesian Conditioning (hard evidence on the *process*). Instead of updating on "The photo is blurry" (soft), update on "A photo was received from source X" (hard). This requires a likelihood model $P(\text{Report}|H)$.

  3.  **Character & Setting:**
