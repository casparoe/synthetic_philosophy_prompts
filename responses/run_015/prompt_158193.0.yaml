answer: |-
  1. Start by rigorously distinguishing the differentiable manifold as a bare topological structure from the metric field that assigns physical geometry, because the argument relies on shifting the metric over the fixed manifold points. Without this separation, the mathematician will conflate the stage with the actors, rendering the subsequent diffeomorphic shift meaningless.

  2. Use a set of individuated dots where the labels remain fixed while the distance functions between them change, deliberately lacking any coordinate axes to prevent the confusion that this is merely a gauge transformation. This ensures the partner sees the physical field moving over substantival points rather than just a relabeling of the system.

  3. When introducing diffeomorphisms, the mathematician will assume points are individuated solely by their coordinate values, so you must immediately insist that manifold points possess intrinsic identity independent of the fields defined upon them. Intercept this by demanding they track a specific point $p$ through the map $\phi$ without referencing its image coordinates, forcing them to treat points as distinct without qualitative differences.

  4. Ask them to describe what happens to the physical future inside the hole if the manifold points are real entities versus mere relational nodes, rather than asking them to compute the transformed metric. Their answer must highlight the loss of predictive power in the substantivalist view, not just the existence of multiple mathematical solutions.

  5. Omit the detailed history of Einstein's struggle with general covariance between 1913 and 1915, because focusing on his psychological journey distracts from the logical structure of the indeterminism problem. Including this narrative would shift focus to historical chronology rather than the immediate metaphysical tension between uniqueness and substantivalism.
