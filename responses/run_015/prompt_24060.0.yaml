answer: |-
  **Term Paper Proposal**

  **Title:** The Temporal Theater: Can the Multiple Drafts Model Account for the Specious Present?

  **1. The Research Question**
  Daniel Dennett's Multiple Drafts Model (MDM) is designed to dissolve the Cartesian Theater—the notion that there is a specific place and time in the brain where conscious experience "comes together" to be viewed by a homunculus. The standard interpretation holds that once we accept there is no "finish line" for neural processing, the theater vanishes. My paper will challenge the sufficiency of this dissolution.

  The central question is: **Can the Multiple Drafts Model account for the phenomenology of the specious present (the felt duration of experience) without implicitly reintroducing a temporal equivalent of the Cartesian Theater?**

  I will argue that by dispersing consciousness across a timeline of competing "drafts," MDM risks losing the temporal unity required for experiences to feel like they *unfold* rather than just *occur*. The paper will investigate whether MDM can explain the coherence of temporal experience without positing a privileged "now" that functions as a hidden finish line.

  **2. Why the Standard Framing is Insufficient**
  The standard defense of MDM against temporal objections is essentially eliminativist: it claims that the feeling of a unified, flowing present is a user-illusion generated by the brain. On this view, asking "when exactly did the experience happen?" is a category error, akin to asking where exactly a software program "is" inside a computer.

  This response is insufficient for two reasons:
  1.  **Phenomenological Inadequacy:** Dismissing the specious present as an illusion ignores the structural necessity of duration. Hearing a melody requires retaining the past note while hearing the current one. If MDM treats these as merely separate drafts revised over time, it struggles to explain how they are bound into a single, duration-bearing object of experience.
  2.  **The Temporal Regress:** If there is no settled "now" where the draft becomes final, but experience nonetheless feels settled, MDM must explain what fixes the content of experience for the subject. If the "fixing" is just another draft, we face a regress. If the "fixing" happens at a specific functional point, that point risks becoming a temporal theater—a privileged moment of convergence that MDM explicitly forbids.

  Simply asserting that the theater is an illusion does not explain how the *illusion of temporal unity* is constructed without a unifier.

  **3. Proposed Approach**
  Rather than attempting a wholesale defense of Dennett or a total rejection of MDM, I will take a diagnostic approach. I will treat the specious present not as a metaphysical entity to be eliminated, but as a constraint that any materialist theory of mind must satisfy.

  My argument will proceed in three stages:
  *   **Reconstruction:** I will briefly outline the MDM's account of temporal processing, specifically focusing on how it handles " Orwellian " (post-experience revision) versus " Stalinesque " (pre-experience revision) distinctions, and why Dennett claims this distinction collapses.
  *   **The Tension:** I will demonstrate that collapsing this distinction creates a gap in accounting for the *continuity* of experience. If every moment is a revision of a previous draft, there is no stable window in which a duration (like a chord or a spoken word) can be experienced as a whole.
  *   **The Dilemma:** I will press the dilemma suggested in my initial hypothesis: MDM must either (a) deny that experiences have a felt duration (which contradicts the data of phenomenology) or (b) allow for a functional "settling point" that acts as a surrogate for the Cartesian Theater (which contradicts the theory's core motivation).

  I will explore whether a modified version of MDM—one that emphasizes *narrative cohesion* over *temporal location*—can escape this dilemma, or if the problem indicates a deeper flaw in the "drafts" metaphor itself.

  **4. Expected Results and Success Conditions**
  A successful paper will not necessarily prove MDM false, but it will precisely locate the cost of adopting it.
  *   **Success:** I will have demonstrated that the "illusionist" response to the specious present is too quick. I will show that MDM requires a robust account of temporal binding that it currently lacks. If I can propose a way MDM might accommodate duration without a "now" (perhaps by redefining drafts as overlapping processes rather than sequential snapshots), that would be a strong positive result.
  *   **Failure:** The project would fail if I merely restate the Cartesian intuition (i.e., "but it feels like there's a self watching") without engaging with Dennett's functionalist arguments. It would also fail if I attempt to solve the hard problem of time perception generally, rather than focusing specifically on the compatibility of MDM and the specious present.

  **5. Scope and Limitations**
  For a 5000-word paper, I must be strict about what I am excluding.
  *   **No General Defense of Illusionism:** I will not argue against illusionism broadly, only against its specific application to temporal unity in MDM.
  *   **No Neuroscience Deep Dive:** I will not engage with specific neural correlates of time perception (e.g., specific brain regions or millisecond timings) except where necessary to illustrate the functional logic of the drafts.
  *   **No Alternative Theories:** I will not spend word count defending a rival theory (like Husserlian phenomenology or retentionalism) as the *correct* view. Rival theories will only be used as foils to highlight where MDM struggles.

  The goal is a tight, conceptual analysis of whether the Multiple Drafts Model can survive the problem of time, or if it has simply moved the Theater from space to time.
