      *   Explain why the hybrid failed: It tried to solve an authorization problem with a composition tool, or vice versa.
      *   Address the "Why pretend it's technical?" question. It's safer to argue about mechanics than admit fundamental value clashes. It preserves the hope of rational consensus.

  5.  **Develop "Unsticking" Strategies:**
