  2.  **Deconstruct the Disagreement:**
      *   *The Pro-Sortition Camp:* Focuses on *descriptive representation* (mirror of the people), *epistemic diversity* (wisdom of crowds), and *anti-oligarchy* (money/careerism corrupts elections). Their view of democracy is often "rule by the people" in a literal, statistical sense.
      *   *The Anti-Sortition (Pro-Election) Camp:* Focuses on *authorization* (consent of the governed), *accountability* (retrospective voting), and *competence/selection* (choosing the best). Their view of democracy is "competitive leadership selection."
      *   *The Hybrid Proposal:* Failed because it touched the nerve of both. For purists, randomness is the *only* safeguard against elite capture (delegation recreates elites). For accountability hawks, internal delegation doesn't solve the external accountability problem (the public still can't fire the chamber).

  3.  **Evaluate the User's Hypotheses:**
      *   *Empirical Bet?* Yes, partly (can random people govern?). But data from citizens' assemblies suggests they *can* deliberate well. So it's not *just* empirical.
      *   *Conceptual Fight?* Yes. What does "represent" mean? Standing for (mirror) vs. Acting for (agent).
      *   *Different Questions?* **Bingo.** This is the strongest insight. One side asks "How do we ensure the state reflects the will/capacity of the populace?" (Input/Composition). The other asks "How do we ensure the populace controls the state?" (Output/Control).
      *   *Bedrock Intuition?* Yes. Ultimately, it comes down to what people fear more: Elite Capture (Pro-sortition fear) or Mob Incompetence/Lack of Control (Anti-sortition fear).

  4.  **Formulate the Diagnosis:**
