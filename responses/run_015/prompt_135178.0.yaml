      *   **Specific Passage:** Cato refusing lavish gifts from foreign rulers and walking on foot through provinces (public spectacles).
      *   **Core Question:** Does Plutarch present Cato as a model for direct *emulation* (imitation) or as a narrative *icon* (moral type/edifying symbol, potentially flattening contradictions like hagiography)?
      *   **Secondary Questions:** Does the text preserve historical particularity/ambiguity? Does it invite active imitation or detached contemplation? How does this relate to Plutarch's broader purpose of moral education? How does biography mediate between specific actions and universal virtues?
      *   **Tone/Level:** Advanced high school student (needs clarity but can handle complex concepts), academic but accessible.

  2.  **Deconstruct the Core Tension (Emulation vs. Iconography):**
      *   *Hagiography:* Often flattens the subject into a perfect vessel of divine virtue. Contradictions are removed. The goal is veneration, sometimes imitation, but often awe.
      *   *Plutarch:* Explicitly states his purpose in *Alexander/Caesar* prologue ("I am writing lives, not histories"). He cares about character (*ethos*). He wants readers to *imitate* the good. However, he is a biographer, not a myth-maker (usually). He acknowledges flaws (e.g., Cato's stubbornness).
      *   *The Specific Acts:* Refusing gifts, walking instead of riding. These are performative. They are "public spectacles."
      *   *The User's Hypothesis:* Is this "hagiographic flattening" or "moral emulation"?

  3.  **Analyze Plutarch's Method (The "Parallel Lives" Project):**
      *   Plutarch is a Middle Platonist. He believes in moral progress (*prokopē*).
      *   He uses *synkrisis* (comparison).
      *   He explicitly invites the reader to look into the lives "as into a mirror" (*Alexander* 1.2).
      *   *Key Distinction:* Hagiography often sanctifies; Plutarch humanizes to educate.
      *   *Cato Specifics:* Cato is often portrayed as *too* rigid. Plutarch admires him but hints that his inflexibility contributed to the fall of the Republic. This suggests ambiguity, not flattening.

  4.  **Address the Specific Passage (Gifts & Walking):**
      *   *Refusing Gifts:* This is about *integritas* (integrity) and *libertas* (freedom from corruption). It's a political statement as much as a moral one.
      *   *Walking:* This is about *simplicitas* (simplicity) and solidarity with the common soldier/citizen. It rejects the *ambitus* (ambition/showing off) of other nobles.
      *   *Public Spectacle:* Plutarch knows Cato knew he was being watched. Is this hypocrisy? Or is it leadership? Plutarch tends to frame it as leadership by example.
      *   *Hagiographic Comparison:* A saint might walk to suffer. Cato walks to demonstrate Roman virtue. The motivation is civic, not divine.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the comparison to hagiography (it's a common scholarly thread). State the thesis: Plutarch occupies a middle ground. He invites emulation but preserves enough friction (ambiguity) to prevent pure hagiography.
      *   **Plutarch's Explicit Goal (The Mirror):** Cite the *Alexander/Caesar* prologue idea (even if not in the Cato text, it defines the project). The goal is *praxis* (action), not just *theoria* (contemplation).
      *   **Emulation vs. Iconography:**
          *   *Hagiography:* Flattens for sanctity.
          *   *Plutarch:* Highlights character traits (*ēthos*). The walking/gifts aren't just icons; they are *teachable moments*.
          *   *Nuance:* Plutarch admits Cato was difficult. His rigidity (*authadia*) is a flaw. This saves it from being pure hagiography.
      *   **The Specific Acts (Gifts & Walking):**
          *   Analyze *why* they are public. It's about *shaming* corruption, not just personal piety.
          *   This makes it political moral education, not just spiritual.
      *   **Ambiguity and Particularity:**
          *   Does Plutarch hide Cato's failures? No (e.g., the defeat at Thapsus, his suicide).
          *   The "archaic syntax" might make it sound more distant, but the content is gritty.
      *   **Mediating Specific and Universal:**
          *   How does walking become "Justice" or "Temperance"? Through Plutarch's commentary. He connects the act to the virtue.
      *   **Conclusion:** Summarize. It's active imitation, but with critical engagement.

  6.  **Refining the Tone:**
      *   Ensure I don't talk down to the student. The prompt is very high-level (mentioning "narrative iconography" and "hagiographic flattening").
