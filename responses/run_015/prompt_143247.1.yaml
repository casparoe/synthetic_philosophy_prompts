      You claim your ledger is money and the coin in our pockets an idol. On this, we agree. Gold is but a counter; its virtue lies not in its lustre but in its power to command the labour of another. Where coin is hoarded, it is dead stone. Where your ledger moves, it is living credit. You say a tax on saving and a committee of enforcement kept this life beating. I say necessity dictated it. Without the fear of expulsion or the penalty on hoarding, the selfish passion would outweigh the public good.

      Now to your measures. First, that every hour counts equal, whether plumber or childminder. Here I must pause. Wealth is proportioned to industry, yet not all industry yields equal fruit for the commonweal. To equate them artificially may obscure "just pretensions." Yet, if this fiction simplifies the ticket and hastens circulation, I may tolerate it as a pragmatic convention, provided it does not discourage the more skilled from labouring.

