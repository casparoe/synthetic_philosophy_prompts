prompt: |-
  I'm a software engineer at a small NGO that tags historical datasets with "why this country got rich" annotations, and our annotators keep guessing. Write me a reusable decision procedue — questions in order, pass/fail rules, and explicit "stop here, it's a judgment call" flags — for deciding whether institutions, geography, or culture is the best-supported cause in a specific case, grounded in the philosphy of causal inference from history (counterfactual dependence, overdetermination, identification problems, etc.). It needs to work for a non-expert in about 15 minutes per country with no library access. Give worked examples for South Korea (probably institutions) and a resource-cursed small state where the answer comes out wrong and we'll hate it. Also cover this weird edge: can a "free-floating rationale" — a reason for growth that no actual policymaker held — ever count? Say exactly where in the procedue it gets included or kicked out. Flag the cases where the checklist just deadlocks and a human has to sign off.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Software engineer at a small NGO.
      *   **Task:** Create a reusable decision procedure for annotating historical datasets with "why this country got rich" (Institutions vs. Geography vs. Culture).
      *   **Constraints:**
          *   Grounded in philosophy of causal inference (counterfactuals, overdetermination, identification).
          *   Usable by non-experts in ~15 minutes per country.
          *   No library access (rely on general knowledge/common datasets).
          *   Must include pass/fail rules, explicit "stop here" flags.
          *   Must include worked examples (South Korea, Resource-Cursed State).
          *   Must address the "free-floating rationale" edge case (reasons no policymaker held).
          *   Must flag deadlock cases requiring human sign-off.
      *   **Tone:** Professional, rigorous, practical, slightly skeptical (acknowledging the difficulty of the task).

  2.  **Deconstruct the Causal Framework:**
      *   The core problem is *causal attribution* in history.
      *   *Institutions:* Rules of the game (property rights, rule of law, inclusive vs. extractive).
      *   *Geography:* Climate, disease burden, access to trade, resources.
      *   *Culture:* Values, work ethic, social trust, religion.
      *   *Causal Inference Concepts:*
          *   *Counterfactual Dependence:* If $X$ hadn't happened, would $Y$ still have happened?
          *   *Overdetermination:* Multiple sufficient causes exist (hard to isolate one).
          *   *Identification:* Can we distinguish the effect of $X$ from $Z$? (e.g., Culture often correlates with Institutions).
          *   *Mechanism:* How did the cause lead to the effect?

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* 15 minutes. Needs to be a flowchart or a numbered checklist. A numbered checklist with "Go/No-Go" gates is better for text-based annotation tools.
      *   *Step 1: Define the Outcome.* "Got Rich" needs a threshold (e.g., sustained GDP/capita growth).
      *   *Step 2: The "Smoking Gun" Test (Institutions).* Look for policy changes.
      *   *Step 3: The "Constraint" Test (Geography).* Was growth impossible without overcoming geography?
      *   *Step 4: The "Mindset" Test (Culture).* Did values change *before* growth?
      *   *Step 5: The "Free-Floating" Edge Case.* Where does this fit? It fits in the "Mechanism" check. If the outcome matches a theory no one believed at the time, it's likely structural (Institutions/Geography), not agentic Culture.
      *   *Step 6: Deadlock.* When do we stop? When evidence is equally strong for two, or when data is missing.

  4.  **Refining the Causal Logic (Philosophy Check):**
      *   *Counterfactuals:* The procedure needs to ask "What if?" explicitly.
      *   *Overdetermination:* Need a rule for when multiple factors are present. Priority rule: Institutions usually mediate Geography and Culture. (Acemoglu/Robinson vs. Sachs vs. Weber). Let's prioritize *change*. Static culture/geography doesn't explain *growth spurts*.
      *   *Identification:* Acknowledge that Culture is the hardest to identify because it's often a post-hoc rationalization.

  5.  **Addressing Specific Requirements:**
      *   *South Korea:* Needs to come out as Institutions (state-led development, property rights, education policy).
      *   *Resource-Cursed State:* Needs to show how the procedure might fail or produce a "hate it" result (e.g., Equatorial Guinea or Nigeria). If the procedure says "Geography/Resources" but the reality is "Bad Institutions," the procedure needs to catch that. *Correction:* The prompt asks for a case where the answer comes out *wrong* and we'll hate it. This implies the procedure has limits. I need to design a case where the checklist points to Geography (resources) but the *truth* is Institutional failure, highlighting the identification problem.
      *   *Free-Floating Rationale:* This is about "Functionalism." If a policy worked for reason $X$, but policymakers thought it was for reason $Y$. This belongs in the "Mechanism Verification" step.
      *   *Deadlock:* Explicit "Human Review" flag.

  6.  **Developing the Content - Section by Section:**

      *   **Introduction:** Set expectations. This is hard. Causal inference in history is messy.
      *   **The Procedure (The "Causal Attribution Checklist"):**
          *   Phase 1: Pre-flight (Define Rich, Define Period).
          *   Phase 2: The Counterfactual Gate (The "But For" Test).
          *   Phase 3: Factor Elimination (Geography, Culture, Institutions).
          *   Phase 4: The "Free-Floating" Check.
          *   Phase 5: Final Classification & Deadlock.
      *   **Worked Examples:**
          *   South Korea (Success case).
          *   Equatorial Guinea (The "Hate It" case - Resource wealth looks like Geography, but it's Institutional failure/rentier state).
      *   **Edge Case:** Free-floating rationale explanation.
      *   **Deadlock Flags:** When to escalate.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Keep questions binary (Yes/No/Unclear). Limit research to "common knowledge" or "basic stats."
      *   *Critique:* Is the "Free-Floating" section clear?
      *   *Fix:* Place it in the Institution vs. Culture distinction. If the mechanism was unintended, it's not Culture (which requires intent/values).
      *   *Critique:* The "Resource Cursed" example.
      *   *Fix:* Make sure the procedure *forces* the annotator to mark "Geography" because resources are geographic, even if the *curse* is institutional. This highlights the limitation requested ("answer comes out wrong and we'll hate it"). Actually, better: The procedure should identify that resources *alone* don't cause growth without institutions. If the checklist fails to distinguish, that's the deadlock. Let's make the "Hate It" case one where the checklist says "Geography" because of oil, but the annotator knows it's actually "Bad Institutions." This shows the identification problem.

  8.  **Final Polish:**
      *   Ensure the tone is empathetic to the annotator (it's not their fault history is complex).
      *   Ensure the philosophical terms (counterfactual, overdetermination) are explained simply.
      *   Check all constraints from the prompt are met.

      *(Self-Correction on the "Hate It" case)*: The prompt asks for a case "where the answer comes out wrong and we'll hate it." This implies the procedure *will* misclassify it. I should design the procedure to be robust, but acknowledge that in cases of "Resource Curses," the distinction between Geography (having oil) and Institutions (managing oil) is the classic identification problem. I will use **Equatorial Guinea** or **Nigeria**. Let's go with a generic "Petro-State" to be safe, or specific like **Venezuela** (rich then poor) or **Equatorial Guinea** (poor then rich). Let's use **Equatorial Guinea**: GDP skyrocketed due to oil (Geography), but institutions are terrible. The procedure might tag "Geography" because the *change* correlates with oil discovery. The "hate it" part is that we know institutions are the real story of sustainability. I will frame this as a known limitation of the tool.

      *(Refining the "Free-Floating" Rationale)*: This is essentially "Unintended Consequences." If a policy worked for reasons the actors didn't understand, can we call it Culture? No, Culture implies shared values/intent. Institutions can function without intent. So, Free-Floating -> Institution/Structure, NOT Culture. I need to make sure the checklist routes this correctly.

  9.  **Finalizing the Output Structure:**
      *   Header: Context & Warning.
      *   The Protocol (Steps 1-5).
      *   The "Free-Floating" Rule.
      *   Worked Example 1: South Korea.
      *   Worked Example 2: The "Hate It" Case (Equatorial Guinea).
      *   Deadlock & Escalation.

  10. (Final check against "15 minutes"): The questions must be quick to answer. No deep archival research. Rely on "Consensus History."

  Let's write it.cw
answer: |-
  # Protocol: Historical Growth Attribution (HGA-v1)

  **Purpose:** To standardize annotations on the primary driver of national economic growth (Institutions, Geography, or Culture) for historical datasets.
  **Time Budget:** 15 minutes per country.
  **Constraint:** No library access. Use general historical consensus and basic macro data (GDP/capita trends).
  **Philosophical Grounding:** Causal inference (counterfactuals, identification, overdetermination).

  ---

  ## ⚠️ Pre-Flight Warning
  **You are solving an Identification Problem.** In history, causes are correlated (e.g., culture shapes institutions, geography shapes culture). This procedure prioritizes **variation over time** (what changed?) over **static levels** (what is present?). If you cannot isolate a change, you cannot identify a cause.

  ---

  ## Phase 1: Define the Event (2 Minutes)
  *Before assigning a cause, define the effect.*

  1.  **Did the country "Get Rich"?**
      *   **Pass:** Sustained increase in GDP per capita (or equivalent welfare metric) for >20 years.
      *   **Fail:** One-off boom (e.g., single commodity spike) followed by collapse.
      *   **Stop:** If "Fail," mark annotation as **"No Sustained Growth"** and exit.
  2.  **Identify the Take-Off Date.**
      *   Pinpoint the decade where the growth curve bends upward.
      *   *Example:* South Korea = ~1965. Botswana = ~1970.

  ---

  ## Phase 2: The Counterfactual Gate (5 Minutes)
  *Apply the "But-For" Test. This eliminates overdetermined causes.*

  3.  **The Geography Test (Static vs. Dynamic)**
      *   *Question:* Did the physical geography *change* at the Take-Off Date?
      *   **Rule:** Geography (climate, location, resources) is static. It cannot explain a *change* in growth rate unless a new technology unlocked it (e.g., oil drilling tech, air conditioning).
      *   **Pass (Keep as Candidate):** A new resource was discovered OR a technology neutralized a geographic barrier (e.g., malaria control) *at the Take-Off Date*.
      *   **Fail (Discard):** Geography was the same before and after. (e.g., Korea was poor in 1950 and rich in 1990; its location didn't change).
      *   *Note:* If you Pass, tag as **"Geography (Resource/Tech Unlock)."**

  4.  **The Culture Test (Values vs. Outcomes)**
      *   *Question:* Is there evidence of a shift in societal values *preceding* the economic shift?
      *   **Rule:** Culture is slow-moving. If growth happens faster than generational change, Culture is likely a rationalization, not a cause.
      *   **Pass (Keep as Candidate):** Documented shift in work ethic, trust, or savings rates *before* the money arrived (e.g., Meiji Restoration educational reforms).
      *   **Fail (Discard):** Values are described as "hardworking" only *after* the country became rich (Post-hoc rationalization).
      *   *Note:* If you Pass, tag as **"Culture (Values Shift)."**

  5.  **The Institution Test (Rules of the Game)**
      *   *Question:* Did the rules governing economic incentives change at the Take-Off Date?
      *   **Rule:** Look for property rights, rule of law, trade policy, or state capacity.
      *   **Pass (Keep as Candidate):** New constitution, land reform, trade liberalization, or establishment of independent courts/central bank near Take-Off Date.
      *   **Fail (Discard):** Rules remained extractive or static.
      *   *Note:* If you Pass, tag as **"Institutions (Policy/Rule Change)."**

  ---

  ## Phase 3: The "Free-Floating Rationale" Check (3 Minutes)
  *Addressing the edge case: Can a reason count if no policymaker held it?*

  6.  **Mechanism Verification**
      *   *Question:* Did the growth happen *because* of the policymakers' intent, or *despite* it?
      *   **Scenario:** A government subsidizes steel to build weapons (Intent), but this accidentally creates a supply chain for shipbuilding (Outcome).
      *   **Decision Rule:**
          *   If the mechanism relies on **shared beliefs/values** (Culture) but no one held those beliefs → **DISCOUNT CULTURE.** (Culture requires agency/intent).
          *   If the mechanism relies on **incentive structures** (Institutions) regardless of intent → **KEEP INSTITUTIONS.** (Institutions function structurally).
          *   If the mechanism relies on **physical constraints** (Geography) regardless of intent → **KEEP GEOGRAPHY.**
      *   **Action:** If the "reason" for growth was unknown to actors at the time, **you must tag Institutions or Geography.** You cannot tag Culture for unintended consequences.

  ---

  ## Phase 4: Final Classification & Deadlock (5 Minutes)
  *Resolve conflicts.*

  7.  **Priority Rule (The Mediation Heuristic)**
      *   If you have multiple "Pass" results:
      *   **Institutions > Geography:** If resources existed but were only exploited after a property rights reform, tag **Institutions**. (Resources are potential; Institutions are kinetic).
      *   **Institutions > Culture:** If "values" changed only after new laws incentivized them, tag **Institutions**.
      *   **Geography > Institutions:** *Only* if the institutional change was trivial and the growth was purely a windfall (e.g., finding oil in a desert with no other changes).

  8.  **The Deadlock Flag (Human Sign-Off Required)**
      *   **Flag A (Overdetermination):** You have strong evidence for both Institutions and Culture changing simultaneously (e.g., Post-WWII Japan).
      *   **Flag B (Identification Failure):** You have strong growth, but no clear change in Geography, Culture, or Institutions (e.g., "Mystery Growth").
      *   **Flag C (The "Hate It" Case):** Growth is driven by a finite resource boom (Geography Pass) but Institutions are visibly collapsing (Institutions Fail). *See Worked Example 2.*

  ---

  ## Worked Example 1: South Korea (1960–1990)
  *Goal: Test for Institutions.*

  1.  **Define Event:** GDP/capita explodes from 1965 onward. **Pass.**
  2.  **Geography Test:** Did location/climate change? No. Did a resource unlock happen? No. **Fail.** (Discard Geography).
  3.  **Culture Test:** Did values change? Confucian values existed during the poverty period (1950s). Did they change in 1965? No, they were constant. **Fail.** (Discard Culture as primary driver).
  4.  **Institution Test:** Did rules change? Yes. Land reform (1950s), State-led export orientation (1964), normalization of relations with Japan (1965). **Pass.**
  5.  **Free-Floating Check:** Policakers intended export growth. Mechanism matches intent. **No adjustment.**
  6.  **Priority:** Only Institutions passed.
  7.  **Final Annotation:** **Institutions.**
  8.  **Confidence:** High.

  ---

  ## Worked Example 2: Equatorial Guinea (1995–2005)
  *Goal: The "Hate It" Case (Resource Curse).*

  1.  **Define Event:** GDP per capita skyrocketed 1995–2005 due to oil. **Pass.**
  2.  **Geography Test:** Did a resource unlock happen? Yes, offshore oil discovered and exploited. **Pass.**
  3.  **Culture Test:** Did values change? No evidence of sudden cultural shift. **Fail.**
  4.  **Institution Test:** Did rules change? No. Regime remained authoritarian/corrupt (Obiang). Property rights weak. **Fail.**
  5.  **Free-Floating Check:** Growth was a windfall, not policy.
  6.  **Priority:** Geography is the only "Pass."
  7.  **Final Annotation:** **Geography.**
  8.  **The "Hate It" Flag:** **FLAG C.**
      *   *Why we hate this:* Annotators know this growth is unsustainable and didn't benefit the population (Institutional failure). However, the *cause of the GDP number* was the oil (Geography).
      *   *Instruction:* Tag as **Geography**, but append **FLAG C**. This signals to data scientists that this is a "False Positive" for development, even if it is a "True Positive" for GDP accounting. Do not force it into Institutions just because it feels morally right. Preserve the identification error for later analysis.

  ---

  ## Edge Case: The "Free-Floating Rationale"
  *Scenario: A country grows because of a policy that worked for reasons the leaders didn't understand.*

  **Example:** A dictator devalues currency to buy weapons cheaper, but this accidentally boosts exports.
  *   **Annotator Question:** "The leaders didn't intend export growth. Can I tag Culture (nationalist spirit)?"
  *   **Procedure Answer:** **NO.**
  *   **Location:** Phase 3, Step 6.
  *   **Reasoning:** Culture requires shared intent/values. If the actors didn't hold the rationale, it cannot be Culture. It is an **Institutional** accident (the rule of "fixed exchange rate" was changed, creating an incentive structure).
  *   **Action:** Tag **Institutions**. Add note: "Unintended Consequence."

  ---

  ## Deadlock & Escalation Matrix
  *If you hit these, stop. Do not guess.*

  | Flag | Condition | Action |
  | :--- | :--- | :--- |
  | **DEAD-01** | **Overdetermination:** Two factors (e.g., Inst. & Cult.) have equally strong evidence of change at the exact same time. | **Escalate.** Tag "Mixed/Overdetermined." Human review needed to weigh causal weight. |
  | **DEAD-02** | **The "Black Box":** Growth occurred, but no clear policy, cultural, or geographic change is visible in general records. | **Escalate.** Tag "Identification Failure." Do not force a category. |
  | **DEAD-03** | **The "Hate It" (Flag C):** Growth is purely resource-driven (Geography) but the state is failing (Institutions). | **Tag Geography + Flag C.** Do not escalate unless you believe the resource discovery date is wrong. |

  ---

  ## Annotator Cheat Sheet: Causal Concepts
  *   **Counterfactual:** "If this factor wasn't there, would growth still have happened?" If yes, it's not the cause.
  *   **Overdetermination:** "There were two sufficient causes." (e.g., Good institutions AND oil). Use Priority Rule (Institutions > Geography).
  *   **Identification:** "Can I tell these apart?" If Culture and Institutions changed together, you likely can't identify them separately. **Flag DEAD-01.**
  *   **Post-Hoc Rationalization:** "They say it's their work ethic, but they were poor last century." This is not evidence of Culture.

  **End of Procedure.**
