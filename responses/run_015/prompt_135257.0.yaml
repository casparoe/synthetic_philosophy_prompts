  2. The standard reading glosses over this by assuming democracy is inquiry whenever people disagree, ignoring Dewey's stricter condition that inquiry only triggers when coordinated action actually breaks down. This overlooks the possibility that some political conflicts are too determinate to warrant inquiry, serving instead as entrenched battles over fixed values.
  3. You're going to cross-read *Logic: The Theory of Inquiry* against *The Public and Its Problems* to see if the criteria for logical indeterminacy hold up in the political sphere. You'll be looking for where Dewey defines the threshold of a "problematic situation" in both texts to see if partisan deadlock meets the bar.
  4. You'll count it as a win if you can show that polarization often fails Dewey's logical test, meaning we need new mechanisms to create genuine indeterminacy before inquiry can start. If you find that Dewey actually equates any contestation with indeterminacy, then the project fails because the distinction you're chasing doesn't exist in his work.
  5. You're planning to knock out the textual analysis in the first three months, followed by six months of drafting chapters that apply the logic to case studies, leaving the final quarter for revision and defense prep. This keeps the scope tight enough to finish in a year without trying to solve all of political theory.
