answer: |-
  Patient A.K., suffering from severe bilateral hippocampal sclerosis, has been fitted with a closed-loop neuroprosthetic device that interfaces directly with the remaining entorhinal cortex to facilitate episodic memory consolidation. In this hybrid system, the biological tissue generates the raw sensory traces of an event, while the implanted processor performs the necessary pattern-completion algorithms to bind these traces into a coherent autobiographical narrative with appropriate emotional valence; neither substrate can complete the integration independently, as the biological neurons lack the connectivity for temporal ordering and the digital chip lacks the somatic input required for affective weighting. During a routine maintenance check, clinicians face a choice between temporarily disabling the digital processor to recalibrate its electrodes or administering a neurotoxic agent to halt biological firing in the interface zone to prevent seizure propagation, knowing that either interruption will immediately suspend the patient's ability to form new integrated memories despite the other substrate remaining fully operational.

  ***

  **Demonstration of Specifications**

  **1. Beliefs and Attributions**
  The functionalist account attributes moral status to the persistence of the cognitive process itself—specifically, the integration of memory and emotion. It holds that the 'self' is the software, not the hardware. The substrate-dependent account attributes moral status exclusively to the biological organism. It holds that the 'self' is inextricably linked to the living tissue, viewing external or implanted hardware as merely instrumental, akin to a pacemaker or a prosthetic limb.

  **2. The Functionalist Verdict**
  For the functionalist, the morally relevant harm is the interruption of the computation. Since the scenario establishes that the memory integration is a *unified* process distributed across both media, stopping either half halts the whole process. Therefore, disabling the digital processor causes the same moral harm as destroying the biological tissue, because in both instances the computationally defined person ceases to function. The substrate is irrelevant; the continuity of the algorithm is paramount.

  **3. The Substrate-Dependent Verdict**
  For the substrate-dependent theorist, the morally relevant harm is the damage to the biological life. Halting the digital processor is merely a tool failure; the patient remains intact, albeit temporarily unable to form memories, much like a blindfolded person is still a person. However, administering the neurotoxic agent damages the constitutive biological matter. Thus, harm is located exclusively in the biological interruption, even though the behavioural outcome (loss of memory integration) is identical in both cases.

  **4. The Structural Feature Generating Divergence**
  The single structural feature generating this divergence is the **constitutive allocation of cognitive labour to the non-biological substrate**. The case is engineered so that the digital component is not merely a causal aid (like a notebook) but a necessary processing node without which the mental state cannot occur. This forces a choice: either the silicon is part of the mind (Functionalism) or it is not (Substrate Dependence), despite its causal necessity.

  **5. Removal of the Feature**
  If this feature is removed—specifically, if the cognitive labour is reassigned entirely to the biological tissue, rendering the digital component a passive conduit rather than a processor—the case collapses into agreement. Both theories would then agree that interrupting the biological tissue constitutes harm, while interrupting the passive digital link is merely instrumental damage. The disagreement exists only because the computation is *realised* on the silicon; once the realisation is purely biological, the substrate and the computation coincide, eliminating the conflict.

  **6. Strongest Objection from a Substrate-Dependent Defender**
  A defender of the substrate-dependent view would argue that the scenario commits a category error by conflating causal coupling with constitutional identity. They would contend that while the silicon chip is causally necessary for the *output* of memory integration, it does not participate in the *experience* of remembering. The biological tissue generates the qualia—the raw feel of the emotion and the sensory trace—whereas the digital processor merely manipulates symbols according to syntax without semantic understanding. Therefore, the computation is not truly 'unified' in the relevant moral sense; it is a biological mind leaning on a sophisticated crutch. Interrupting the crutch impedes the mind but does not harm the subject, whereas interrupting the biology attacks the subject directly. The objection asserts that moral significance tracks the locus of experience, not the locus of information processing, and the scenario falsely assumes these are identical.
