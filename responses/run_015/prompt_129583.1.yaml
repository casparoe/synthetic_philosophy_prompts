answer: |-
  ### Specification for Self-Locating Reasoning in Decision-Making

  The following ten requirements define the adequacy conditions for any theory of self-locating uncertainty intended to guide decisions regarding observer populations, existential risk, and cosmological measures.

  **1. Decision-Readiness**
  *   **Demand:** The theory must output a prescription for action (or a credence function explicitly mapped to a decision rule), not merely a ranking of hypotheses.
  *   **Motivation:** The purpose is to estimate future populations and assess risk; a credence that cannot be cashed out in a bet or policy is useless.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** This is a functional requirement of the specification. A theory that only tells you what to believe without telling you how to weigh utilities across copies or time-slices fails the stated purpose of "input to decision-making."

  **2. Infinity-Compatibility**
  *   **Demand:** The rule must yield defined probabilities or decisions when hypotheses predict infinitely or indefinitely many observers.
  *   **Motivation:** *Cosmological hypotheses case.* Many physical theories predict infinite spacetime or eternal inflation; a rule that returns "undefined" for ratios of infinite sets cannot adjudicate between them.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** If the domain of application includes cosmology, the math must not crash on infinite cardinalities. This is a constraint on the *measure* used by the rule, not just the updating logic.

  **3. Vague-Boundary Stability**
  *   **Demand:** Small changes in the definition of "observer" (e.g., cognitive threshold) must not cause discontinuous swings in the recommended decision or posterior probability.
  *   **Motivation:** *Sorites case.* If the count of observers depends on a vague line between "conscious" and "non-conscious," a rule sensitive to raw counts (like $N$) makes decisions hostage to arbitrary thresholds.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** Real-world populations are biologically and cognitively continuous. A decision rule sensitive to orders-of-magnitude shifts based on semantic boundaries is practically unusable for existential risk assessment.

  **4. Causal Independence**
  *   **Demand:** The agent's existence or indexical location must not be treated as evidence that causally influences the total number of observers or the outcome of chance events.
  *   **Motivation:** *First-two-people case.* Reasoners should not conclude they can prevent descendants or influence coin flips merely by updating on their own existence (avoiding "magical" Adam & Eve reasoning).
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** This preserves the integrity of causal decision theory. If self-location allows agents to reason they can affect external variables, the theory licenses delusion.

  **5. Prior-Rule Separation**
  *   **Demand:** The theory must explicitly distinguish between the updating rule (handling self-location) and the prior over uncentered hypotheses (handling universe size).
  *   **Motivation:** *Cosmological theory comparison.* Complaints that a rule "favors large universes" often confuse the rule with a prior that assigns equal probability to observer-moments rather than worlds.
  *   **Tag:** **Negotiable.**
  *   **Reasoning:** Some frameworks (e.g., Updateless Decision Theory) collapse this distinction. However, for a specification of *reasoning*, clarity on where the weight comes from is necessary to debug failures.

  **6. Temporal-Granularity Invariance**
  *   **Demand:** The rule must specify whether it counts whole persons or person-moments, and the output should not flip based on arbitrary temporal slicing of the same life.
  *   **Motivation:** *Single undivided life case.* A person with memory wipes undergoes many indistinguishable episodes. Counting episodes vs. counting persons yields different posteriors; the theory must commit to one ontology.
  *   **Tag:** **Preference of one camp.**
  *   **Reasoning:** This maps to the Halfer (person-based) vs. Thirder (moment-based) debate in Sleeping Beauty. Both are internally consistent; the choice depends on metaphysical commitments about identity, not logical adequacy.

  **7. Sequence-Rank Neutrality**
  *   **Demand:** Knowing one's birth rank in a sequence should not, in isolation, drive the posterior probability of the total sequence length toward small numbers.
  *   **Motivation:** *Doomsday/Earliness case.* Being "early" should not imply "doom" without external evidence about the rate of observer production.
  *   **Tag:** **Preference of one camp.**
  *   **Reasoning:** This is the core conflict between SSA (violates this) and SIA (satisfies this). It is tagged as a preference because satisfying it requires accepting the Presumptuous Philosopher objection (violating Stability).

  **8. Reference-Class Objectivity**
  *   **Demand:** The reference class for sampling must be definable without reference to the hypothesis being tested.
  *   **Motivation:** *Cosmological/Sorites cases.* If the class is "observers like me," and "like me" depends on the physical constants of the hypothesis, the reasoning becomes circular.
  *   **Tag:** **Negotiable.**
  *   **Reasoning:** Some successful decision theories bypass reference classes entirely (e.g., by comparing outcomes directly). If the theory avoids sampling, this requirement is moot.

  **9. Measure Provenance**
  *   **Demand:** If the rule requires a measure over observers (to handle infinities or duplication), the source of that measure must be identified as physical, epistemic, or normative.
  *   **Motivation:** *Cosmological hypotheses case.* In eternal inflation, the "measure problem" is distinct from the anthropic rule. Confusing the two leads to double-counting.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** To satisfy Decision-Readiness and Infinity-Compatibility, one must know if the weighting comes from physics (branch weights) or epistemology (ignorance).

  **10. Aggregation Specification**
  *   **Demand:** The theory must state whose utility is aggregated in decision-making: the current episode, the whole person, or the total set of observers.
  *   **Motivation:** *Belief vs. Action distinction.* A credence in "I am a copy" is useless without knowing if I care about my copies' welfare (Total Utilitarianism vs. Average Utilitarianism vs. Selfish).
  *   **Tag:** **Negotiable.**
  *   **Reasoning:** This is an ethical constraint, not an epistemic one. However, since the specification demands *decision-making* input, the theory must either bundle an ethics or explicitly leave it as an external variable.

  ***

  ### The Two Distinctions

  **1. Constraints on Rule vs. Constraints on Prior/Measure**
  A significant portion of the literature's confusion arises from misfiled complaints. **Requirement 5 (Prior-Rule Separation)** and **Requirement 9 (Measure Provenance)** address this.
  *   *Misfiled Complaint:* "SIA is wrong because it makes large universes too probable."
  *   *Correction:* This is a constraint on the *Prior* (Requirement 5), not the updating rule. If the prior is uniform over *worlds*, SIA shifts it to uniform over *observers*. If the user demands uniformity over worlds, they are demanding a prior constraint, not a rule constraint.
  *   *Implication:* If we enforce **Requirement 3 (Vague-Boundary Stability)**, we effectively constrain the *Measure* (Requirement 9). A measure that weights by $N$ (number of observers) fails Stability when $N$ is vague. Thus, many "anthropic" problems are actually measure problems in disguise.

  **2. Belief vs. Action**
  **Requirement 1 (Decision-Readiness)** and **Requirement 10 (Aggregation Specification)** enforce this.
  *   *The Gap:* A rule may return a credence of 1/3 for Heads (Sleeping Beauty), but if the agent only cares about their current episode's payoff, they bet differently than if they care about the whole person's payoff.
  *   *Implication:* A theory of self-locating *reasoning* cannot be complete for decision-making without an attached theory of *value aggregation*. If a theory refuses to bundle this (tagging it Negotiable), it admits it is only a credence engine, not a decision guide. The specification demands the latter; therefore, a theory that outputs only credences fails Requirement 1 unless paired with an independent decision module.

  ***

  ### The Incompatibility Result

  There is an impossible trinity among the requirements. You cannot jointly satisfy **Requirement 3 (Vague-Boundary Stability)**, **Requirement 7 (Sequence-Rank Neutrality)**, and **Requirement 4 (Causal Independence)** while maintaining a non-trivial update on self-location.

  1.  **Sequence-Rank Neutrality** (Anti-Doomsday) requires that you update in favor of hypotheses with more observers (SIA-like behavior), otherwise your early birth rank penalizes large worlds (Doomsday).
  2.  **Vague-Boundary Stability** requires that your update not be sensitive to the exact count of observers ($N$), because $N$ is vague (Sorites).
  3.  **Causal Independence** requires that you do not treat your existence as a causal lever (Adam & Eve).

  **The Conflict:** To satisfy Neutrality (avoid Doomsday), you must weight by $N$. To satisfy Stability, you must *not* weight by $N$ (because $N$ is ill-defined). To satisfy Causal Independence, you must not let your existence select the world.
  *   **SSA** satisfies Causal Independence and Stability (mostly) but fails Sequence-Rank Neutrality (implies Doomsday).
  *   **SIA** satisfies Sequence-Rank Neutrality but fails Vague-Boundary Stability (Presumptuous Philosopher + Sorites sensitivity) and risks Causal Independence (if existence implies world selection).
  *   **No-Update** satisfies Causal Independence and Stability but fails Sequence-Rank Neutrality (ignores the evidence of existence entirely, leading to a different form of Doomsday or indifference).

  **The Resolution:**
  **Requirement 3 (Vague-Boundary Stability)** must be maintained. In contexts of existential risk and cosmology, the definition of "observer" is inherently fuzzy. A rule that crashes or flips decisions based on whether a chimpanzee counts as an observer is operationally dead.
  **Requirement 7 (Sequence-Rank Neutrality)** must be abandoned. We must accept that self-locating evidence alone cannot rule out the Doomsday Argument's logic *unless* we have external priors. The "earliness" of our birth is not sufficient to determine population size without a stable measure of observers, which we lack.
  **Requirement 4 (Causal Independence)** is maintained by decoupling the *measure* from the *decision*.

  **Best Theory Under Weakened List:**
  A **No-Anthropic-Update** rule (treating self-location as no evidence for uncentered hypotheses) combined with a **Decision-Theoretic** approach (like Updateless Decision Theory).
  *   *Why:* It preserves Stability (no weighting by vague $N$) and Causal Independence (no magic). It sacrifices the intuition that "I exist" favors large worlds, but this intuition is the source of the Presumptuous Philosopher paradox.
  *   *Loss:* We lose the ability to use our existence to confirm cosmological theories that predict more observers. We must rely on physical evidence alone.
  *   *Most Work:* **Requirement 3 (Vague-Boundary Stability)** does the most work excluding candidates. It eliminates SIA immediately.
  *   *First to Drop:* **Requirement 7 (Sequence-Rank Neutrality)**. It is the most fragile, relying on the assumption that birth rank is informative about total size independent of causal processes.

  ***

  ### Scoring of Candidate Rules

  **1. Self-Sampling Assumption (SSA)**
  *   **Score:** Fails Req 7 (Sequence-Rank Neutrality). Passes Req 3 (Stability) and Req 4 (Causal Independence).
  *   **Verdict:** Usable for risk assessment only if one accepts the Doomsday Argument. It is stable against Sorites but pessimistic about the future.
  *   **Uncertainty:** If uncertain between SSA/SIA, SSA is safer for existential risk (pessimism bias), but epistemically costly.

  **2. Self-Indication Assumption (SIA)**
  *   **Score:** Fails Req 3 (Vague-Boundary Stability). Passes Req 7 (Sequence-Rank Neutrality). Risks Req 4 (Causal Independence).
  *   **Verdict:** Unusable for the specified purpose. Sensitivity to vague observer counts makes it vulnerable to the Sorites case and the Presumptuous Philosopher. It cannot handle the "Single Undivided Life" case without arbitrary temporal slicing.
  *   **Uncertainty:** High risk. If the definition of "observer" shifts, policy flips.

  **3. No-Anthropic-Update (Centered-Worlds/UDT)**
  *   **Score:** Passes Req 3 (Stability) and Req 4 (Causal Independence). Fails Req 7 (Sequence-Rank Neutrality) by design.
  *   **Verdict:** Best fit for the specification. It treats self-location as a fixed parameter of the decision problem rather than evidence to update probabilities. It handles Infinity (Req 2) via measure theory rather than anthropic weighting.
  *   **Uncertainty:** If an agent is uncertain which rule is correct, they should adopt the No-Update rule for *policy* (to ensure Stability) while tracking SSA/SIA credences separately for *theoretical* modeling, acknowledging that the credences do not drive the decision.
