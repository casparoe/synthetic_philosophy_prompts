answer: |-
  The four scenarios you present constitute the "hard quartet" of contemporary causation literature. They are designed to pull in different directions: **Preemption** (Cases 1 & 2) demands we look beyond simple counterfactuals; **Threat-Canceling** (Case 3) demands we reject transitivity; **Omissions** (Case 4) demands we introduce normative constraints.

  No single *metaphysical* principle captures all four verdicts without tension. However, the strongest candidate that captures three of them—and provides a clear path for resolving the fourth—is the **Structural Equation Model (SEM) with Normality Defaults** (championed by Halpern, Pearl, and Hitchcock).

  ### The Principle: Actual Causation via Active Paths and Normality

  **Statement:**
  Event $C$ is a cause of Event $E$ if and only if:
  1.  **Active Path:** There is an active causal path (a sequence of dependent variables) from $C$ to $E$ in the actual world, such that if we intervene to set $C$ to its non-actual value (while holding off-path backup mechanisms fixed at their *actual* inactive state), $E$ would not occur.
  2.  **Normative Default:** If $C$ is an omission (a non-event), $C$ counts as a candidate cause only if the agent had a normative duty or contextual expectation to act (making the omission "abnormal").

  **How it fits your verdicts:**

  *   **Case 1 (Suzy & Billy):** Fits **Clause 1 (Active Path)**.
      *   *Why:* Suzy's throw initiates a physical process that reaches the bottle. Billy's throw is a "backup" mechanism. In the SEM, we hold Billy's throw fixed at "did not happen" (its actual state) when testing Suzy. If Suzy hadn't thrown (and Billy still didn't), the bottle wouldn't shatter. Thus, Suzy is the cause.
  *   **Case 2 (Desert Traveler):** Fits **Clause 1 (Active Path)**.
      *   *Why:* The hole initiates a process (draining) that completes before the poison can act. The poison is an off-path backup. Holding the poison fixed at "did not work," the hole is necessary for the death (by thirst).
  *   **Case 4 (Office Plant):** Fits **Clause 2 (Normative Default)**.
      *   *Why:* Physically, your omission and the strangers' omissions are identical. But the SEM incorporates "normality." Your failure to water is "abnormal" (violates duty/expectation); the strangers' failure is "normal" (background condition). Only the abnormal omission qualifies as a cause.

  ### The Conflict: Case 3 (The Boulder)

  This principle conflicts with your verdict in **Case 3**.
  *   **The Conflict:** The SEM model (and Clause 1 above) generally validates **Transitivity**. If Rolling causes Ducking, and Ducking causes Survival, then Rolling causes Survival. The model sees a continuous active path: Boulder $\rightarrow$ Duck $\rightarrow$ Survival.
  *   **The Verdict to Give Up:** To maintain a unified principle that successfully explains Preemption (Case 1) and Omissions (Case 4), **you must give up the verdict in Case 3.**
  *   **Why:** If you deny transitivity to save Case 3, you undermine Case 1. Suzy's throw causes the *flight* of the rock, and the flight causes the *shattering*. If causation isn't transitive, Suzy's throw might not cause the shattering. Most philosophers (e.g., David Lewis) argue that your intuition in Case 3 is pragmatic, not metaphysical. We *highlight* the ducking as the cause of survival because it was the *saving* factor, but the boulder was causally relevant to the survival (it made the survival *conditional* on the ducking). The boulder *did* cause the survival, in the sense that it created the specific scenario in which survival occurred.

  ### Application: The Train Switch

  Now, applying the surviving principle (**Active Path + Normality**) to your new case:

  **The Case:** A signalman throws a switch, sending a train down the left track. The right track was available. The tracks reconverge; the train arrives at the same time either way.
  **Question:** Did throwing the switch cause the arrival?

  **Analysis:**
  1.  **Structure:** This is structurally identical to **Case 1 (Suzy & Billy)**.
      *   *Suzy:* Throw 1 (Actual) vs. Throw 2 (Backup).
      *   *Switch:* Left Track (Actual) vs. Right Track (Backup).
  2.  **Active Path:** There is a physical process from the Switch $\rightarrow$ Left Track $\rightarrow$ Arrival.
  3.  **Counterfactual Test (with Fixed Backup):** If we test the cause, we hold the backup (Right Track availability) fixed at its actual state (available but unused). If the signalman had *not* thrown the switch (sending it right), the train would still arrive.
      *   *Wait:* This looks like a Counterfactual failure. But recall Case 1. In Case 1, if Suzy doesn't throw, Billy *would* have thrown. Counterfactual dependence fails there too.
      *   *Resolution:* In Case 1, you ruled that Suzy *is* the cause because her process was the *active* one. The SEM handles this by treating the backup as "inactive" in the actual world.
      *   In the Switch case, the Right Track is *available* but the process didn't run.
  4.  **Verdict:** **Yes, throwing the switch caused the arrival.**
      *   *Reasoning:* Just as Suzy's throw caused the shattering despite Billy's backup, the Switch caused the arrival via the Left Track despite the Right Track's availability. There is an active physical process linking the switch to the arrival. The fact that a *counterfactual* backup would have produced the same result does not negate the *actual* causal contribution of the path taken.

  **Summary:**
  *   **Principle:** Active Causal Paths with Normative Defaults (SEM).
  *   **Sacrifice:** You must accept that the Boulder *did* cause the survival (Transitivity holds).
  *   **Train Verdict:** The Switch *did* cause the arrival (Process trumps Counterfactual indifference).
