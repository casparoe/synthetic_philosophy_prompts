answer: |-
  # JOINT STATEMENT ON FORECAST COHERENCE AUDITING
  **To:** Methodology Lead, Forecasting Platform
  **From:** Coherence & Accuracy Advisory Working Group
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Automated Coherence Auditing

  ## 1. Joint Claims of Fact and Principle
  *Both camps endorse the following twelve claims as the baseline for further decision-making.*

  1.  **Primary Objective:** The platform's primary methodological goal is to elicit and aggregate high-quality probabilistic judgments about future events.
  2.  **Scoring Metric:** Forecasters are evaluated primarily on the Brier score (mean squared error), a strictly proper scoring rule for probability vectors.
  3.  **Coherence Definition:** A probability vector is mathematically coherent if and only if all entries are non-negative and sum exactly to 1.00.
  4.  **Audit Mechanism:** The current auditor identifies filings where the sum of probabilities deviates from 1.00 or entries are negative, flags them, and automatically rescales them to the nearest coherent vector (by Euclidean distance).
  5.  **Dutch Book Existence:** For any incoherent vector filed, there exists a theoretical portfolio of bets at the stated prices that guarantees a net loss to the forecaster (a Dutch Book).
  6.  **Reports vs. Attitudes:** A filed number is a report submitted into a form; it is not a direct measurement of the forecaster's internal credence or their actual willingness to bet at those odds.
  7.  **Bounded Stakes:** The auditor's "bets" are simulated for flagging purposes; the financial loss guaranteed by the Dutch Book is not actually deducted from the forecaster's account, nor is it scalable without limit by external arbitrageurs in this closed system.
  8.  **Utility Function:** Forecaster utility is determined by tournament standing and prize tiers, which is a non-linear function of raw Brier scores; maximizing expected accuracy does not always maximize expected tournament rank.
  9.  **Rounding Artifacts:** Filings are constrained to two decimal places; mechanically coherent internal credences (e.g., 1/3, 1/3, 1/3) often result in technically incoherent filings (0.33, 0.33, 0.33 sums to 0.99).
  10. **Team Filings:** Approximately one-third of filings are produced by teams; intra-team disagreement at the moment of filing can produce aggregate vectors that are incoherent even if individual members are coherent.
  11. **Interval/No-Opinion:** The system permits interval reports and "no opinion" markers on some questions; the current auditor does not assess coherence for these submission types, creating an inconsistency in enforcement.
  12. **Data Integrity:** Both camps agree that systematically incoherent data complicates aggregation and Bayesian updating for the platform's downstream consumers.

  ## 2. Terminology: The Three Books
  *The camps often talk past each other regarding "exploitability." We agree to distinguish the following three structures. We disagree on whether vulnerability to each constitutes a defect of the same kind.*

  | Term | Definition | Coherence Camp View | Accuracy Camp View |
  | :--- | :--- | :--- | :--- |
  | **Sure-Loss Book** | A portfolio of bets guaranteeing a loss, scalable without limit, available to any counterparty. | **Defect:** Fundamental rationality failure. The agent is logically inconsistent. | **Defect:** Theoretical only. Irrelevant if no counterparty exists or stakes are capped. |
  | **Stake-Bounded Book** | A portfolio guaranteeing a loss, but the maximum loss is capped (e.g., by the auditor's simulation limits). | **Defect:** Still a logical failure. The magnitude of the loss does not cure the incoherence. | **Not Necessarily a Defect:** If the capped loss is smaller than the utility gain from strategic reporting, it is rational to accept it. |
  | **One-Sided Book** | A portfolio where there is no possible gain and some possible loss (dominance), but no guaranteed loss across all outcomes. | **Defect:** Violates state-wise dominance; irrational to choose a dominated option. | **Contextual:** If the dominated option has higher *expected* utility under the tournament scoring rule, it is instrumentally rational. |

  **Assessment:** Vulnerability to a **Sure-Loss Book** is a defect of *logic*. Vulnerability to a **Stake-Bounded** or **One-Sided Book** in this specific tournament context is a potential defect of *strategy*, not necessarily logic. The camps agree these are not defects of the same kind.

  ## 3. Table of Remaining Disagreements
  *Where we cannot sign a joint claim, we state our positions in our own preferred wording.*

  | Proposition | Coherence Camp Formulation | Accuracy Camp Formulation | Judgment | Resolution / Dissolution |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of the Defect** | Incoherent credences are irrational *in themselves* because they violate the probability axioms, regardless of whether a loss is realized. | Incoherent reports are suboptimal *instrumentally* only if they reduce expected accuracy or tournament utility. | **Genuine** | This is a philosophical divide on rationality (deontological vs. consequentialist). No factual resolution. |
  | **Audit Justification** | The audit enforces logical consistency; rescaling corrects a mathematical error akin to fixing a syntax error in code. | The audit enforces a proxy for accuracy; rescaling is an intervention that may lower realized scores and annoy users. | **Verbal** | Dissolved by defining the audit's goal. If the goal is "logical purity," Coherence wins. If the goal is "maximized leaderboard accuracy," Accuracy wins. |
  | **Forecaster Intent** | The filed number is a claim of truth; if it sums to 1.10, the forecaster is claiming 110% certainty, which is nonsense. | The filed number is a signal optimized for the scoring rule; if rounding makes it 1.01, the intent was coherent, and the audit punishes noise. | **Genuine** | Requires empirical data on rounding errors vs. substantive incoherence (see Crux 1). |
  | **Team Aggregation** | A team filing is a single agent; if the aggregate vector is incoherent, the team has failed to form a coherent belief. | A team filing is a compromise; incoherence may reflect honest uncertainty aggregation (e.g., averaging coherent disagreeing views). | **Genuine** | Depends on whether the platform treats teams as single agents or aggregation mechanisms. |

  ## 4. Table of Cruxes
  *These are the empirical or arithmetic tests that will determine the operational fate of the audit.*

  | Crux | Test Description | Coherence Prediction | Accuracy Prediction | Action if Resolution Favors Accuracy |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Accuracy Dominance & Rounding** | **Test:** Take 1,000 archived incoherent filings. Compute their realized Brier score. Compute the realized Brier score of the auditor's *rescaled* vector. Compare.<br><br>**Arithmetic Example (3-cell partition):**<br>File: $(0.90, 0.10, 0.10)$ [Sum 1.10]<br>Rescale (Normalize): $(0.82, 0.09, 0.09)$<br>Outcome: Cell 1 occurs.<br>File Brier: $(0.9-1)^2 + 0.1^2 + 0.1^2 = \mathbf{0.03}$<br>Rescale Brier: $(0.82-1)^2 + 0.09^2 + 0.09^2 = \mathbf{0.049}$<br>*Incoherent file scores better.* | The rescaled vector will have equal or better *expected* Brier score ex-ante. Realized variance is noise. The example above is a lucky draw, not a systematic advantage. | The rescaled vector will have worse *realized* Brier scores in a significant minority of cases (due to rounding or overconfidence luck), causing forecaster anger and churn. | **Scrap Auto-Rescale.** Keep flagging, but do not overwrite numbers if the realized score penalty is statistically significant. |
  | **2. Expected vs. Realized Utility** | **Test:** Simulate a tournament season. Compare the final rank of a forecaster who files optimal coherent probabilities vs. one who files slightly incoherent probabilities that exploit the Brier score's curvature.<br><br>**Hypothetical:** A forecaster knows the Brier score penalizes extreme errors heavily. They file incoherent vectors that hedge against variance in a way coherent vectors cannot. | No strategy of incoherent filing yields higher expected utility than a coherent strategy under a proper scoring rule. | Because tournament utility is non-linear (top 10 get prizes), strategies that increase variance (sometimes enabled by incoherence) may increase expected *rank* even if they lower expected *accuracy*. | **Rewrite Audit.** Allow incoherence if it can be shown to be a rational response to the tournament's non-linear prize structure. |
  | **3. Rounding vs. Error** | **Test:** Classify all flagged filings in the last 6 months. Category A: Sum $\in [0.99, 1.01]$ (Rounding). Category B: Sum $\notin [0.99, 1.01]$ (Substantive).<br><br>**Threshold:** If Category A > 50% of flags. | Even rounding errors are logical defects. 0.99 is not 1.00. The audit must remain strict to prevent normalization of sloppiness. | If >50% of flags are rounding artifacts, the audit is mostly punishing faithful reporting of 1/3 probabilities. It is noise, not signal. | **Implement Tolerance.** Auto-accept filings summing between 0.99 and 1.01 without flagging or rescaling. |

  **Assessment of Crux 1:** The Coherence Camp must concede that *realized* scores can be worse after rescaling, as shown in the arithmetic above. However, they hold that *expected* score is what matters. The Accuracy Camp must concede that strictly proper scoring rules dominate incoherent ones *in expectation*. The dispute is whether the platform optimizes for ex-ante rationality or ex-post retention. **I judge the Accuracy Camp correct on the operational implication:** if the audit lowers realized scores for users, they will leave, regardless of ex-ante optimality.

  **Assessment of Crux 3:** This is likely to resolve in favor of the Accuracy Camp. If half the flags are rounding artifacts (0.33+0.33+0.33), the audit is functionally broken as a measure of rationality.

  ## 5. Recommendation and Closing

  **Recommendation:**
  Rewrite the audit immediately to implement a $\pm 0.01$ coherence tolerance band to eliminate rounding flags, suspend automatic rescaling of filings in favor of warning flags, and remove point docks for incoherence until the correlation between incoherence and long-term poor performance is empirically verified.

  **Single Finding That Would Change My Mind:**
  If a retrospective analysis shows that forecasters who consistently file incoherent vectors (sum $\neq$ 1) have significantly lower long-term Brier scores and tournament rankings than those who file coherent vectors, proving that incoherence is a marker of poor calibration rather than just strategic noise.

  **Residual Uncertainty:**
  My primary uncertainty concerns strategic gaming: if we remove the rescaling penalty, will forecasters begin filing wildly incoherent vectors (e.g., 0.99 on all outcomes) to manipulate the aggregation algorithm or hedge their tournament risk in ways that degrade the public value of the forecast data? We must monitor aggregation quality closely post-change.
