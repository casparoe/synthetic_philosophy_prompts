      *   **Topic:** Causation by omission.
      *   **Thesis:** Omissions are genuine causes. No special relata (events vs. non-events). No normative/duty clause needed for causation itself. "Default-Value Picture" within interventionism. "Liveness" condition for variable inclusion (mechanism coupling). Norms affect *model construction*, not the causal relation (explanatory priority).
      *   **Audience Profile:**
          1.  Lewisian (but-for, events, quasi-causal omissions).
          2.  Two Causal Modelers (interventionists, skeptical of "default" as more than notation, skeptical of "liveness" being smuggled in).
          3.  Legal Theorist (but-for + duty/voluntary conduct, law treats omissions differently).
          4.  Experimentalist (norm-sensitivity findings, norms do causal-selecting work, "model construction" is unfalsifiable).
          5.  Philosopher of Physics ("system did nothing" ill-defined physically).
      *   **Goal:** A Q&A prep sheet. 7-8 objections ordered by likelihood/damage. Phrased in the objector's voice. 2-minute replies. Notes on soft spots. What to concede preemptively. The "single reply" that must land. The "one objection I'm hoping nobody asks." Bonus: Spot where "liveness" is doing hidden work.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* Omissions are causes via default values in causal models.
      *   *Mechanism:* Liveness (coupling) filters variables. Norms filter model construction.
      *   *Vulnerability 1 (Metaphysics):* Is "default" objective or contextual? If contextual, isn't it just norms in disguise?
      *   *Vulnerability 2 (Causal Modeling):* Is "liveness" just a restatement of "relevant variables"? How do you define "mechanism coupling" without circularity?
      *   *Vulnerability 3 (Legal/Normative):* If causation is the same, why is liability different? (The "causation vs. responsibility" distinction).
      *   *Vulnerability 4 (Experimental):* If norms guide model construction, how is this empirically distinct from norms guiding causal judgment directly? (Falsifiability).
      *   *Vulnerability 5 (Physics):* Omissions aren't physical processes. How does "nothing" cause "something" physically?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Causal Modelers - High Likelihood/High Damage):* They will attack the technical core. "Default value" sounds like a trick to hide normativity. "Liveness" sounds like a constraint on variable selection that isn't formalized.
      *   *Objection 2 (Experimentalist - High Likelihood/High Damage):* The "unfalsifiable" charge is deadly for a naturalistic metaphysics. If norms *always* explain the selection, you can't test the causal claim separately.
      *   *Objection 3 (Legal Theorist - Medium Likelihood/Medium Damage):* Why does the law care if your metaphysics says they are the same? This challenges the *utility* of the view.
      *   *Objection 4 (Philosopher of Physics - Medium Likelihood/High Damage):* The "physical process" objection. If causation is physical, omissions are weird.
      *   *Objection 5 (Lewisian - Low Likelihood/Medium Damage):* They've likely moved on, but might ask about transitivity or event ontology.
      *   *Objection 6 (General/Grad Student - High Likelihood/Low Damage):* "Isn't this just Hitchcock/Knobe?" (Need to distinguish).
      *   *Objection 7 (The "Liveness" Trap - High Damage):* Where does the mechanism end? (The Bonus Point).

  4.  **Refining the Objections & Replies:**

      *   *Refining Objection 1 (Modelers):* Focus on whether "default" is objective. *Reply:* It's system-relative, not norm-relative. *Soft Spot:* System boundaries often *are* normative.
      *   *Refining Objection 2 (Experimentalist):* Focus on the "model construction" black box. *Reply:* We can prime mechanisms independent of norms. *Soft Spot:* Hard to disentangle in practice.
      *   *Refining Objection 3 (Legal):* Distinguish causation from culpability. *Reply:* Law mixes them for policy; metaphysics shouldn't. *Soft Spot:* Law might track *actual* causal intuition better than metaphysics.
      *   *Refining Objection 4 (Physics):* Focus on energy transfer. *Reply:* Interventionism isn't process theory. *Soft Spot:* Doesn't explain physical world causation.
      *   *Refining Objection 5 (Lewisian):* Quasi-causation. *Reply:* We need omissions for explanation, not just counterfactuals.
      *   *Refining Objection 6 (The "Hidden Work" of Liveness):* This is the Bonus Point. Liveness requires defining the "system." Defining the system often relies on the very norms you claim are separate.

  5.  **Selecting the "Must Land" Reply and the "Hope Nobody Asks":**
      *   *Must Land:* The distinction between *model construction* (normative/contextual) and *causal relation within the model* (objective/structural). If this collapses, the view is just normative causal theory in disguise.
      *   *Hope Nobody Asks:* The "Liveness" regress or the "System Boundary" problem. If defining a "live mechanism" requires normative judgment, the view fails.

  6.  **Determining Preemptive Concessions:**
      *   Concede that model construction is context-sensitive. Don't fight the pragmatism there; fight the claim that the *causal relation itself* becomes normative.
      *   Concede that law mixes causation and responsibility.

  7.  **Final Review against Constraints:**
      *   7-8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Phrased in objector's voice? Yes.
      *   2-minute replies? (Keep them concise).
      *   Soft spots noted? Yes.
      *   Preemptive concessions? Yes.
      *   Single crucial reply? Yes.
      *   Dreaded objection? Yes.
      *   Liveness hidden work? Yes.

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   *Modeler Voice:* Technical, precise, suspicious of metaphysical gloss on math.
      *   *Experimentalist Voice:* Empirical, focused on operationalization and falsifiability.
      *   *Legal Voice:* Pragmatic, focused on liability and distinction.
      *   *Physics Voice:* Ontological, focused on fundamental reality.
      *   *Lewisian Voice:* Classical, focused on events and counterfactual dependence.

      *(Self-Correction during drafting)*: Make sure the "Liveness" bonus point is integrated clearly. It needs to be the "Dreaded Objection." The "Model Construction" distinction is the "Must Land."

      *Wait, one check on the "Liveness" bonus:* The prompt asks to spot where liveness is doing more work than admitted. This is likely the *System Boundary* issue. To say the Queen isn't "live," you have to define the system boundaries. If those boundaries are drawn based on "reasonable expectation," then norms are back in. I will make this the "Hope Nobody Asks."

      *Wait, check the "Must Land":* The distinction between *selecting the model* and *evaluating causation within the model*. If the audience thinks norms determine the causal relation, the view collapses into the standard normative accounts (like Hitchcock/Knobe). The user needs to defend that the *structure* is objective once the model is fixed.

      *Wait, check the "Concessions":* Don't claim objectivity of model selection. That's a losing battle. Claim objectivity of the *causal graph* once selected.

      *Let's finalize the list.*
      1. Modelers (Default = Norms?)
      2. Experimentalist (Unfalsifiable?)
      3. Physics (Physical reality?)
      4. Legal (Liability distinction?)
      5. Lewisian (Events?)
      6. General (Hitchcock comparison?)
      7. The "Liveness" Trap (System boundaries).
      8. (Maybe combine Lewisian/General to save space for nuance). Let's stick to the specific personas provided + the Liveness trap.

      *Revised Plan:*
      1. Causal Modelers (The "Default" is just Norms) - *High Likelihood/High Damage*
