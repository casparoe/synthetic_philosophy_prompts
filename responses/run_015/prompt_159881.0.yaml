answer: |-
  Here is a Q&A prep sheet tailored to your specific audience and thesis. I have ordered these by the probability of the question combined with the potential damage to your view.

  ### **Pre-Talk Concessions**
  *Do not wait for these to be asked. Build them into your closing remarks or the setup.*
  1.  **Concede Model Selection is Pragmatic:** Explicitly state that *which* causal model we construct is context-sensitive and often guided by norms/interests. Do not claim the *choice of variables* is objective. Your claim is that *once the model is fixed*, the causal relation is objective and non-normative.
  2.  **Concede the Law Mixes Categories:** Admit that legal liability tracks responsibility, not just metaphysical causation. Do not try to make your metaphysics vindicate current tort law directly; argue it vindicates the *causal* component of tort law, leaving the *duty* component to separate analysis.

  ---

  ### **The Q&A Prep Sheet**

  #### **1. The Causal Modelers (Two Faculty)**
  **Objection:** "You're treating 'default value' as a metaphysical feature of the variable, but in standard SEM (Structural Equation Modeling), defaults are just notational conveniences or context-specific baselines. If 'liveness' is the constraint that puts a variable in the model, aren't you just smuggling in a relevance constraint? How is 'mechanism coupling' defined formally without referencing the very background conditions you claim are separate?"
  **The 2-Minute Reply:** "Liveness isn't a relevance constraint based on interest; it's a physical constraint based on *capacity*. A variable is live if there exists a physical channel through which an intervention could propagate to the outcome. The Queen lacks a channel; the gardener has one. The 'default' marks the state where that channel is idle. I'm not adding notation; I'm distinguishing between variables that represent *active mechanisms* versus variables that represent *background conditions*. The math stays the same; the ontology of the variables changes."
  **Soft Spot:** They will press you on whether "physical channel" is well-defined without referencing a specific model granularity. If granularity is context-dependent, "liveness" might be too.

  #### **2. The Experimentalist (Grad Student/Postdoc)**
  **Objection:** "You say norms guide model construction, not causal judgment. But if norms *always* determine which model we build, and we never access the causal relation except through the model, your claim is empirically indistinguishable from the view that norms constitute causation. How do you falsify the 'model construction' story? It looks like a protective belt."
  **The 2-Minute Reply:** "It's falsifiable if we can prime mechanism-salience independent of norm-salience. If I show you a diagram of the plant's irrigation system (mechanism) without telling you who *should* water it, you should still include the 'watering' variable. If norms were constitutive, mechanism knowledge alone wouldn't trigger the omission-cause judgment. We can dissociate 'can' from 'ought' in experimental design to test if model construction tracks capacity or duty."
  **Soft Spot:** In real-world cases (like the gardener), capacity and duty are highly correlated. Disentangling them experimentally is notoriously difficult, and they may argue your dissociation cases are artificial.

  #### **3. The Philosopher of Physics (Faculty)**
  **Objection:** "Interventionism is fine for special sciences, but you're making a metaphysical claim. Physically, 'the gardener didn't water' is just the absence of a matter-energy transfer. If causation is ultimately grounded in physical processes, your 'default value' is just a description of the null state of the universe. How does 'nothing' physically cause 'something' without a process?"
  **The 2-Minute Reply:** "I'm not offering a process theory; I'm offering a difference-making theory. Physics describes the *base*, but causation describes the *dependency*. The plant dies *because* the water variable was at default, not because of the microphysical history of the soil. Omissions are causes at the special-science level where variables exist. I don't need omissions to be physical processes; I need them to be nodes in a dependency structure."
  **Soft Spot:** If they press on *fundamental* causation, you may have to concede omissions aren't fundamental causes. This limits the metaphysical scope of your thesis.

  #### **4. The Legal Theorist (Faculty)**
  **Objection:** "The law treats omissions differently because we care about *agency* and *volition*, not just mechanisms. A rock doesn't water the plant, the gardener doesn't water the plant. Your 'liveness' condition puts both in the model if they are mechanically coupled. But the law exonerates the rock. If your metaphysics says both are causes, you aren't explaining the legal distinction, you're erasing it."
  **The 2-Minute Reply:** "I am erasing the *causal* distinction, not the *responsibility* distinction. The rock and the gardener are both causes in my model (both are live variables at default). The law exonerates the rock because it lacks *agency*, not because it lacks *causality*. My view clarifies the law: it shows that liability for omissions requires two steps: establishing the causal link (which I do) and establishing the duty/agency (which you do). Conflating them muddies both."
  **Soft Spot:** Legal realists may argue that "causation" in law *just is* the liability condition, so a metaphysics that separates them is irrelevant to legal theory.

  #### **5. The Lewisian (Faculty)**
  **Objection:** "Lewis granted omissions were 'quasi-causes' to save the counterfactual analysis. You're saying they're full-blooded causes. But if omissions are causes, causation isn't a relation between existents. How do you handle the transitivity of causation? If A's omission causes B's death, and B's death causes C's grief, did A's omission cause C's grief? Lewis worried about this."
  **The 2-Minute Reply:** "Yes, transitivity holds, and that's a feature, not a bug. We explain C's grief by tracing back to A's omission. The 'quasi' label was a patch for an event ontology that couldn't handle non-events. I'm rejecting the event ontology requirement. Causal models handle transitivity via paths. If there's a path from Omission to Grief, there's causation. We don't need events to transmit energy to transmit dependence."
  **Soft Spot:** Lewisians often view transitivity with omissions as a *reductio* (leading to profligate causation). You need to lean heavily on "Liveness" to stop the transitivity chain from exploding.

  #### **6. The "Hitchcock/Knobe" Check (Grad Student)**
  **Objection:** "This sounds exactly like Hitchcock's 'normality' account or Knobe's side-effect work, where defaults are context-sensitive. What's the actual difference between your 'default value' and their 'normality condition'?"
  **The 2-Minute Reply:** "For Hitchcock/Knobe, the normativity is *in* the causal relation. A cause is defined partly by what is normal. For me, the normativity is *pre-model*. Once we agree on the model (which defaults map to which states), the causal judgment is purely structural. They make causation subjective/contextual; I make model-selection contextual but causation objective relative to the model."
  **Soft Spot:** If model selection is *always* driven by norms, the practical difference between your view and theirs vanishes.

  #### **7. The "Liveness" Boundary Problem (The Dreaded Objection)**
  **Objection:** "You say the Queen isn't a live variable because she isn't 'coupled' to the plant. But coupling is a matter of degree. If she owned the garden, or if she had a remote watering system installed, she would be coupled. Where do you draw the line on 'mechanism'? Doesn't drawing that line require a normative judgment about what counts as part of the 'system'?"
  **The 2-Minute Reply:** "The line is drawn by physical connectivity, not norms. A remote system creates a physical channel; mere ownership does not. The 'system' is the set of variables connected by physical dependencies relevant to the outcome."
  **Soft Spot:** **(See Bonus Analysis Below)**. This is where you are most vulnerable. "Physical connectivity" is often in the eye of the beholder depending on how you carve the world.

  #### **8. The "Explanatory Priority" Trap (Follow-up to Modelers)**
  **Objection:** "You say norms have 'explanatory priority' in model construction. But if I ask 'Why did the plant die?', and you answer 'Because the gardener didn't water it', aren't you giving a causal explanation? If norms determined the model, and the model determines the cause, didn't norms determine the cause?"
  **The 2-Minute Reply:** "Norms determined *which question we asked*, not *the answer to the question*. Asking 'Why did the plant die?' selects a model where watering is a variable. Once selected, the answer 'no water' is a structural fact. Norms got us to the starting line; the causal structure ran the race."
  **Soft Spot:** If the audience feels the "starting line" determines the winner, this distinction feels like hair-splitting.

  ---

  ### **Critical Strategy Points**

  #### **The Single Reply That Must Land**
  **The Distinction:** You must successfully defend the separation between **Model Construction** (Pragmatic/Normative) and **Causal Evaluation** (Structural/Objective).
  *   **Why:** If the audience concludes that norms determine the causal relation *itself* (even indirectly), your view collapses into the standard normative accounts (Hitchcock, etc.) you are trying to distinguish yourself from. You need them to accept that once the model is on the board, the arrows are objective.
  *   **How:** Use the **Gardener vs. Queen** example repeatedly. Everyone agrees the Queen isn't the cause. The Lewisian says it's quasi-causation; the Normativist says she had no duty. You say: *She isn't in the model.* If you can make "not being in the model" feel like a hard metaphysical constraint (liveness) rather than a pragmatic choice, you win.

  #### **The One Objection You Hope Nobody Asks**
  **"How do you define 'Mechanism' without Norms?"**
  *   **The Trap:** Your "Liveness" condition relies on there being a "mechanism actually coupled to the outcome." But what counts as a single mechanism? Is the "gardener's nervous system" part of the plant's watering mechanism? Is the "telephone network" part of the mechanism if he could have ordered water?
  *   **The Danger:** To bound a mechanism, you usually need to appeal to *function* or *normal operation*. But "function" is often teleological or normative. If "liveness" relies on "normal functioning," and "normal functioning" is normative, you have smuggled norms back into the causal relata, violating your core thesis.
  *   **Defense if Asked:** Stick to **physical counterfactuals**. "A mechanism is live if an intervention *here* physically propagates *there*." Deny that function is required. A broken pipe is still a live mechanism (it *could* have worked).

  ---

  ### **Bonus: Where "Liveness" is Doing Hidden Work**
  You suspect "Liveness" is clean, but it is likely carrying the weight of **System Boundaries**.
  *   **The Issue:** To say the Queen is not "live," you must define the system boundary around the plant/garden. If the system is "The British Ecosystem," the Queen might be live (via policy, funding, etc.). If the system is "The Backyard," she isn't.
  *   **The Hidden Norm:** Choosing the system boundary is almost always driven by *explanatory interest*, which is driven by *norms*.
  *   **Prep:** If they press this, concede that system boundaries are pragmatic, but insist that *within* any reasonable boundary, the distinction between "coupled" and "uncoupled" is physical. Do not let them conflate "boundary selection" with "coupling detection."

  ### **Final Tip for the Q&A**
  You have 10 minutes. That is roughly 3 to 4 questions.
  *   **Expect:** One from the Modelers (Technical), one from the Experimentalist (Empirical), one from the Legal/Physics person (Application/Ontology).
  *   **Strategy:** Answer the Modeler first and hardest. If you satisfy them, the Experimentalist and Legal theorist will likely fall in line, as their objections often rely on the Modeler's technical skepticism. If the Modelers think "Default" is just notation, the rest of the room will too. Win the technical battle, and the metaphysical war is yours.
