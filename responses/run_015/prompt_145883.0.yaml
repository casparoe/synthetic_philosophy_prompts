answer: |-
  ### Part 1: Philosophical Brainstorming & Framework

  **Concept:** Tactile Memetics in a Post-Literate Society
  **Core Theory:** Dawkins' Memetics (The Selfish Gene) applied to non-semiotic sensory data.

  **1. The Unit of Transmission (The Meme):**
  In this context, the meme is not an idea encoded in language, but a *pattern of vibration*. Let's call it a "Resonance." It exists physically in the stone and neurologically in the tactile cortex of the inhabitants.
  *   **Genotype:** The abstract sequence of beats (e.g., *thump-thump-pause-tap*).
  *   **Phenotype:** The physical sensation on the skin and the resulting physiological state (calm, arousal, grief).

  **2. The Three Conditions for Evolution:**
  To satisfy the Darwinian requirement, the story must demonstrate:
  *   **Longevity:** Does the rhythm last long enough to be transmitted?
  *   **Fecundity:** How quickly does it spread from person to person?
  *   **Fidelity:** How accurately is it copied? (High fidelity ensures the 'gene' remains intact; low fidelity leads to mutation).

  **3. Selection Pressure:**
  In internet culture, selection pressure is attention. In this settlement, selection pressure is *physiological coherence*.
  *   *Unfit Memes:* Rhythms that cause dissonance, anxiety, or confusion are not repeated. They die out.
  *   *Fit Memes:* Rhythms that synchronise heart rates, breathing, or induce a sense of communal safety are aggressively replicated. The "emotion" is the survival vehicle.

  **4. The Narrative Arc:**
  We need a "mutation" event. A character introduces a variation. We must witness the competition between an established, stable meme (the "Ancestor Pulse") and a new, potentially fitter mutant (the "Syncopated Shiver"). The story must show the *moment of selection* where the group unconsciously chooses the fitter idea.

  ***

  ### Part 2: The Story

  **Title:** The Stone That Breathes

  The settlement of Ostra had no need for eyes. In the deep limestone caverns, light was a useless ghost, and language was a forgotten clutter. There was only the Wall, and the Hands.

  Orin pressed his palms against the cold limestone of the Central Pillar. He was a Vector, one of those tasked with carrying the Resonances from the outer rims to the heart of the settlement. The stone was cool, rough with the grain of centuries, but beneath his skin, it hummed.

  Against his left wrist, he felt the Ancestor Pulse. *Thud… thud… thud.* Slow, steady, mimicking a resting heart. It was a meme of high longevity but low fecundity. It had survived a thousand years because it was safe, but it no longer bound the community tightly. It was a dying strain, losing its grip on the collective nervous system. People tapped it out of habit, not need.

  Orin closed his eyes, though the darkness was absolute regardless. He had brought a mutation from the Northern Ridge.

  He lifted his right hand. He did not speak; there were no words to carry the nuance. Instead, he tapped.

  *Thud-thud. Pause. Scrape. Thud.*

  It was a variation on the Ancestor Pulse, but with a syncopated interruption—a 'glitch' in the rhythm that demanded attention. In memetic terms, Orin was testing its *fidelity*. Could the stone carry the complexity without the pattern degrading? And more importantly, would the neighbours copy it?

  He waited. The vibration travelled through the limestone matrix, radiating outwards like ripples in a pond.

  Ten metres away, a woman named Kael pressed her cheek to the wall. She felt the anomaly. Her brain, wired for pattern recognition, analysed the tactile input. The Ancestor Pulse offered comfort, but this new rhythm offered *resolution*. The pause created tension; the scrape released it. It triggered a micro-surge of dopamine, a somatic reward for recognising the pattern.

  Kael lifted her hand. She did not invent a new sound; she replicated the one she had received. This was the crux of cultural evolution: replication. She tapped it back into the stone. *Thud-thud. Pause. Scrape. Thud.*

  Orin felt the return vibration. The fidelity was high. The meme had survived the transmission.

  But survival was not enough. For a meme to evolve, it must outcompete.

  As the evening Convergence began, the Pillar became crowded. Hundreds of hands rested on the surface. The air grew thick with the pheromones of anticipation. The Ancestor Pulse began to dominate, as it always did. The collective habit was a strong selection pressure. The stone thrummed with the slow, dying *thud… thud… thud.*

  Orin did not fight it with force. He simply injected his mutation again, harder this time. He leveraged the *fecundity* of the new rhythm. It was catchier. It required more active engagement from the tactile nerves.

  *Thud-thud. Pause. Scrape. Thud.*

  A man beside Orin felt the interruption. The Ancestor Pulse felt suddenly sluggish, like a heart failing to quicken during exertion. The new rhythm felt like a breath held and then released. It mirrored the biological reality of the group far better than the static drone of the ancestors.

  The man copied the new rhythm. Then the woman next to him.

  This was the selection event. It was not a conscious vote. It was Darwinian pruning. The rhythms that failed to synchronise the group's emotional state were dropped. The hands stopped tapping the Ancestor Pulse. The stone fell silent for a heartbeat, a vacuum waiting to be filled.

  Then, the new rhythm crashed over the Pillar. Hundreds of hands striking in unison.

  *Thud-thud. Pause. Scrape. Thud.*

  Orin felt the change in the stone's behaviour. The vibration was no longer just a sound; it was a shared physiological state. The rhythm dictated their breathing. It aligned their heart rates. The meme had successfully hijacked the host's biology to ensure its own propagation. It was a 'selfish' pattern, but one that benefited the hosts by creating profound social cohesion.

  The Ancestor Pulse was extinct. It had been outcompeted by a fitter idea.

  Kael leaned her forehead against the warm limestone. She did not know the theory of why her hands moved the way they did. She only knew that the old rhythm felt like loneliness, and this new rhythm felt like the tribe. The stone breathed beneath her palms, alive with the ideas that had proved strong enough to survive.

  In Ostra, truth was not what could be seen or said. Truth was what could be felt, copied, and kept. The stone remembered only the fittest.

  ***

  ### Part 3: Commentary on Memetic Concepts

  *For your homework context, here is how the story maps to the theory:*

  1.  **Replication:** The act of feeling the rhythm and tapping it back onto the stone (Kael copying Orin).
  2.  **Variation:** Orin introducing the 'syncopated interruption' to the standard beat.
  3.  **Selection Pressure:** The community's physiological response. The old rhythm failed to synchronise the group (low fitness); the new rhythm aligned their heart rates and breathing (high fitness).
  4.  **Fidelity:** The story notes that the pattern must remain accurate during transmission, or the 'gene' is lost.
  5.  **Post-Literate Medium:** By removing language, the story isolates the *pure pattern* of the meme, showing that ideas can evolve without semantics, relying solely on emotional/physiological utility.
