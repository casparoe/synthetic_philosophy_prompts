prompt: |-
  I am preparing a proposal for a six-month independent research fellowship, and I need it rendered with the conceptual rigor and narrative awareness of a novelist examining plot structure. The subject is the well-known triad of Athenian democratic failures—the reversal at Mytilene, the decision for the Sicilian Expedition, and the trial of Socrates. Standard historiography treats these as discrete moral or institutional collapses. I want to propose that they are manifestations of a single, undertheorized structural feature, which I am calling dramatic recursion: the assembly's tendency to treat its own binding commitments as provisional scenes available for immediate emotional revision, collapsing strategic continuity into theatrical presentness.

  The proposal must contain the following, in a formal, polished register: (1) a precise statement of the research question—whether these failures are best explained by conventional institutional or ethical flaws, or by a specific temporal-rhetorical structure in which democratic deliberation operates like narrative analepsis without lasting consequence; (2) an account of why existing positions—Thucydidean realpolitik, Platonic anti-democratic philosophy, and modern institutional analysis—leave this structural question genuinely open rather than settled; (3) a detailed method for the six-month project, specifying how I will read the three episodes as interlinked narrative sequences rather than isolated case studies, comparing the rhetorical tempo of assembly debate with the strategic tempo of imperial and juridical action, and developing a conceptual model of what I term recursive spectatorship; (4) a clear description of what a successful result would look like, and an honest assessment of what would count as project failure—particularly if the episodes resist unification or if the model collapses into generic populism; and (5) a realistic scope assessment for six months, including what must be left unfinished and why the project remains viable within that constraint.

  Please do not include a bibliography, literature review by citation, or requests for further reading; I will supply all references myself. The deliverable should be a proposal document arguing that the work is both worth doing and feasible in the time available, with the framing precision of someone who understands how plots turn on the tension between immediate scene and enduring consequence.
