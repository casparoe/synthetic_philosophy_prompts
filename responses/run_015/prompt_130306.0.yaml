  *(Refining the "Interstitial" definition)*: Make sure the mapping step clearly asks: "Does this fit a standard pair (Parent/Child, Boss/Worker) or is it a blend (Owner-Sibling)?"

  *(Refining the "Rectification" logic)*: If Role A is corrupted, you cannot use Role A to claim priority. You must fall back to Role B. If Role B is also corrupted, you fall back to Contract/Law.

