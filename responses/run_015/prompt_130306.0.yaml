answer: |-
  # The Role-Rectification Protocol (RRP)

  **Purpose:** A 90-minute mediation heuristic for resolving conflicts in family enterprises where familial obligations clash with corporate governance.
  **Philosophical Basis:** Role Ethics (obligations arise from relationships, not abstract rules).
  **Constraint:** Designed for mediators without specialized philosophical training.

  ---

  ## Part 1: The Procedure

  ### Step 1: Role Mapping (15 Minutes)
  List every active relationship between the conflicting parties. Categorize them as **Classic** or **Interstitial**.

  *   **Classic Roles:** Standard pairs with clear historical expectations (e.g., Parent/Child, Elder/Younger Sibling, Employer/Employee, Husband/Wife).
  *   **Interstitial Roles:** Hybrid roles created by the business structure that lack clear historical scripts (e.g., Founder's Spouse without office, Adopted Child/Executive, Cousin/Shareholder).

  **Action:** Draw a line between the parties. Label every line.
  *   *Flag:* If an Interstitial role is the primary source of conflict, note that there is no pre-existing script. You must construct one based on the nearest Classic analogy.

  ### Step 2: Proximity Priority & Rectification Check (30 Minutes)
  In role ethics, closer relationships usually command higher priority (Family > Firm). However, this priority is conditional on the integrity of the role.

  **A. Determine Proximity:**
  Identify the "closest" relational tie.
  *   *Hierarchy:* Parent/Child > Sibling/Sibling > Employer/Employee > Contractual Partner.
  *   *Rule:* The closer role typically dictates the obligation *unless* triggered by Step B.

  **B. The Rectification Check:**
  Ask: **Has one party systematically corrupted the obligations of the closer role?**
  *   *Corruption Indicators:* Treating a child solely as labor without care; treating a parent solely as a wallet without respect; using family authority to bypass safety/legal compliance.
  *   *Test:* Is the behavior a one-time error or a pattern of redefining the relationship to suit self-interest?

  **Outcome:**
  *   **If No Corruption:** The Closer Role wins. (e.g., Family harmony trumps minor efficiency losses).
  *   **If Corruption Confirmed:** The obligations of that role are **Suspended**. You must drop down to the next closest intact role to resolve the conflict.
      *   *Example:* If a Father treats a Son only as an Employee (corrupting Parent/Child), he cannot invoke Filial Piety to demand loyalty. The conflict must be resolved under Employer/Employee rules.

  ### Step 3: Cross-Domain Conflict & Stopping Points (30 Minutes)
  Apply the winning role from Step 2 to the specific dispute. Check for domain collisions.

  **A. Family Obligation vs. Fiduciary Duty:**
  *   If the resolved role is **Family-Dominant**: The solution should prioritize relationship preservation, even at some cost to efficiency.
  *   If the resolved role is **Firm-Dominant** (due to Rectification suspension): The solution must prioritize institutional survival and merit.

  **B. Mandatory Stopping Points (The Mediator's Red Line):**
  If the proposed solution requires any of the following, the procedure halts. You cannot mediate; you must advise legal/regulatory intervention.
  1.  **Fraud or Concealment:** Hiding financial errors, tax evasion, or regulatory breaches.
  2.  **Solvency Threat:** Actions that clearly risk bankruptcy to satisfy a family preference.
  3.  **Rights Violation:** Harassment, discrimination, or abuse masked as "family discipline."

  **Action:** If a Stopping Point is hit, declare the mediation closed on that issue. Refer to counsel.

  ### Step 4: Judgment Markers (15 Minutes)
  Acknowledge where the procedure cannot generate an answer.

  *   **Value Divergence:** If parties agree on the roles but disagree on the *content* of the role (e.g., "What does a good Father owe the Company?"), the procedure misfires. This requires values clarification, not role mapping.
  *   **Survival vs. Harmony:** If the Company's survival requires ejecting a family member, the procedure will prioritize the Company (via Rectification), but this will be experienced as a betrayal. Mark this as an "Integrity Cost."

  ---

  ## Part 2: Case Applications

  ### Case 1: The Unqualified Child vs. The Elder Sibling
  **Scenario:** Founder (Father) wants to appoint unqualified Younger Son as COO. Elder Daughter (VP) objects.
  **Roles:**
  1.  Father/Younger Son (Classic: Parent/Child).
  2.  Father/Elder Daughter (Classic: Parent/Child).
  3.  Elder Daughter/Younger Son (Classic: Elder/Younger Sibling).
  4.  Employer/Employee (Classic: Boss/Staff).

  **Application:**
  1.  **Proximity:** Parent/Child is closer than Employer/Employee. Normally, Father's wish prevails to maintain family hierarchy.
  2.  **Rectification Check:** Does appointing an unqualified child corrupt the Father's role?
      *   *Analysis:* A Parent's obligation is the long-term flourishing of the Child. Placing an unqualified Child in a high-stress failure position harms the Child. It also harms the Sibling (Elder Daughter) by undermining her authority.
      *   *Finding:* The Father is corrupting the Parent/Child role by treating the Son as a status trophy rather than a person to be nurtured.
  3.  **Shift:** Suspend Parent/Child priority. Drop to Employer/Employee and Sibling/Sibling.
  4.  **Resolution:** Under Employer/Employee rules, competence is the primary obligation. Under Sibling rules, the Elder has precedence in experience.
  5.  **Outcome:** The appointment is blocked.
  6.  **Mediator Script:** "Father, by insisting on this title, you are setting your Son up to fail. That violates your role as a Parent. We must resolve this as Employer/Employee. The role requires qualifications he does not have. We can create an 'Advisory' role that honors his lineage without granting operational control."

  ### Case 2: The Concealment Pressure
  **Scenario:** Senior Non-Family Exec is pressured by the Founder's Spouse (no formal office) to conceal a family member's financial error. She invokes "Loyalty to the Family."
  **Roles:**
  1.  Spouse/Spouse (Classic: Husband/Wife - *invoked by her regarding her husband*).
  2.  Family/Non-Family (Interstitial: Kin/Outsider).
  3.  Employer/Employee (Classic: Boss/Staff).
  4.  Fiduciary/Company (Legal/ethical obligation).

  **Application:**
  1.  **Proximity:** The Spouse is invoking Family/Non-Family proximity (Insider vs. Outsider).
  2.  **Rectification Check:** The Spouse is asking the Exec to violate their Employer/Employee and Fiduciary roles.
      *   *Analysis:* Asking an employee to break the law or ethical codes corrupts the Employer's role. The Employer (Family) is failing to protect the Employee from liability.
  3.  **Shift:** Suspend Family/Non-Family loyalty. The intact role is Fiduciary/Company.
  4.  **Stopping Point:** Concealment of financial error is a **Mandatory Stopping Point** (Fraud/Compliance).
  5.  **Outcome:** Mediation halts on this specific request.
  6.  **Mediator Script:** "I cannot facilitate a solution that involves concealment. This hits a Stopping Point. Your request asks the Executive to corrupt their professional role. That obligation is suspended. The error must be disclosed through proper channels. I can help you design *how* to disclose it to minimize shame, but I cannot help you hide it."

  ### Case 3: The Integrity Cost (The Unwanted Answer)
  **Scenario:** The Matriarch (Founder's Mother) controls a key trust. She is making erratic, high-risk investments due to cognitive decline. The Board (her children) must remove her signatory authority. She views this as unfilial abandonment.
  **Roles:**
  1.  Child/Parent (Classic: Filial Piety).
  2.  Shareholder/Director (Classic: Governance).
  3.  Caregiver/Dependent (Interstitial: Emerging due to health).

  **Application:**
  1.  **Proximity:** Child/Parent is the closest role. Normally, Children obey/serve the Parent.
  2.  **Rectification Check:** The Matriarch's actions threaten the solvency of the enterprise (the "Clan's" livelihood).
      *   *Analysis:* In role ethics, an Elder's authority is predicated on their ability to guide and protect the lineage. By endangering the lineage's survival, she has corrupted the Elder role.
  3.  **Shift:** Suspend Child/Parent obedience. Shift to Shareholder/Director (Fiduciary).
  4.  **Cross-Domain:** Fiduciary duty to save the company overrides Filial duty to obey.
  5.  **Stopping Point:** Solvency Threat.
  6.  **Outcome:** Authority must be removed immediately.
  7.  **The Unwanted Answer:** This procedure mandates an action that will likely destroy family harmony. The Matriarch will feel betrayed. The mediation cannot "fix" the feeling; it can only validate the necessity.
  8.  **Mediator Script:** "The procedure indicates that the Elder role is compromised by the risk to the whole. We must shift to Director/Shareholder rules. You must remove the authority. This will hurt her. There is no way to mediate that pain away. You are choosing the survival of the Family Enterprise over the feelings of the Family Matriarch. Proceed with the governance vote, but prepare for the relational rupture."

  ---

  ## Part 3: Limitations & Misfire Markers

  **Do not use the RRP if:**

  1.  **The Conflict is Purely Emotional:** If the dispute is about past slights, love, or recognition with no governance impact, role mapping will feel cold and mechanistic. Use therapeutic mediation instead.
  2.  **Both Roles are Corrupted:** If the Father is abusive *and* the Son is negligent, there is no "intact role" to fall back on. The procedure stalls. You must move to contractual/legal separation.
  3.  **The "Interstitial" is Unique:** If a role has no Classic analogy (e.g., a "Family Council" that has no legal standing but total moral authority), the Proximity Rule is guesswork. Mark this as "High Judgment Required."
  4.  **Survival is Not at Stake:** If the business can absorb the inefficiency of a family preference without risk, the Rectification Check may be too aggressive. In low-stakes environments, prioritize Harmony over Rectification.

  **Mediator Warning:**
  The RRP is a logic tool, not a peacekeeping tool. In Case 3, it produces the "right" governance answer but the "wrong" family answer. You must explicitly warn the clients that **procedural correctness does not guarantee relational repair.** When the procedure demands the suspension of a family role, the family will experience it as a loss of love. Prepare them for this cost.
