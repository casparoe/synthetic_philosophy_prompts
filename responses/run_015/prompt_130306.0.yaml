          6.  Constraints: No citations, bibliographies, or reading lists.

  2.  **Deconstruct the Philosophical Framework (Confucian Role Ethics):**
      *   *Core Idea:* Identity is defined by relationships (Father/Son, Ruler/Subject, Husband/Wife, Elder/Younger Brother, Friend/Friend).
      *   *Application to Business:* These map to Founder/Successor, Employer/Employee, Spouse/Spouse, Senior/Junior Exec, Peer/Peer.
      *   *The Twist:* Modern business creates hybrid roles (e.g., Shareholder who is also a black-sheep son).
      *   *Rectification of Names (Zhengming):* If a role is not being performed correctly (e.g., a father who doesn't act like a father), the obligations shift.
      *   *Priority:* Usually, family closeness trumps business distance *unless* the family role is corrupted or the business survival is at stake (fiduciary).

  3.  **Drafting the Decision Procedure (The "Role-Rectification Protocol"):**
      *   *Name:* Needs to sound professional but grounded in the prompt's logic. Let's call it the "Role-Rectification Protocol (RRP)."
      *   *Step 1: Role Mapping.* Need to list the active roles. Distinguish between "Classic" (fits Wu Lun) and "Interstitial" (hybrid).
      *   *Step 2: Proximity & Rectification.* Who is closer? (Father/Son > Employer/Employee). *But*, is the role corrupted? If yes, suspend that role's priority.
      *   *Step 3: Cross-Domain Conflict.* Family Obligation vs. Fiduciary Duty. This is the danger zone. Need a "Stop" mechanism where the mediator can't decide legal/ethical breaches.
      *   *Step 4: Judgment Markers.* Where does the tool fail? (e.g., when survival is at stake, or when values fundamentally diverge).

      *Refining Step 2 (Rectification):* The prompt specifies: "if one party has systematically corrupted the obligations of a role... obligations in that role are suspended and resolution shifts to the intact roles." This is crucial. It means if a Father treats a Son *only* as an Employee, the Father loses the right to claim Filial Piety in that context.

      *Refining Step 3 (Cross-Domain):* Need to distinguish between "preference" (who gets the office) and "compliance" (fraud).

  4.  **Developing the Three Cases:**

      *   *Case 1: Unqualified Child COO vs. Elder Sibling VP.*
          *   Roles: Father/Son (Founder/Child), Elder/Younger Brother (VP/COO candidates), Employer/Employee.
          *   Conflict: Meritocracy vs. Lineage.
          *   Application: Map roles. Check Rectification (Is the Father treating the business as family piggy bank? Is the Child acting entitled?). Priority: Usually Family Proximity wins *unless* Rectification fails. If the Child is truly unqualified, appointing them corrupts the "Ruler/Subject" (Employer/Employee) role.
          *   Outcome: Likely needs a probationary period or advisory role to satisfy both, or a hard "no" if competence is critical for survival.

      *   *Case 2: Non-Family Exec pressured to conceal error.*
          *   Roles: Employer/Employee (Exec/Family), Friend/Friend (maybe), Fiduciary/Company.
          *   Conflict: Loyalty to Family (protecting kin) vs. Loyalty to Firm (truth).
          *   Application: The Family is asking the Exec to corrupt *their own* role (Employee/Fiduciary). This triggers the Rectification Check on the Family's demand.
          *   Outcome: The demand is illegitimate. The Exec cannot comply. Mediator supports the Exec's boundary.

      *   *Case 3: Institutional Integrity vs. Family Harmony (The "Unwanted Answer").*
          *   Scenario: A beloved matriarch is embezzling or severely negligent, threatening solvency.
          *   Conflict: Filial Piety (protect elder) vs. Fiduciary (save company).
