prompt: |-
  I'm in this upper-level formal epistemology seminar and we spent all of one confusing session on the Judy Benjamin problem, and now I've been arguing about it with my friend over cold fries and I can't tell who's moving the goalposts. Please act as a professional philosopher who specializes in formal epistemology and Bayesian updating: before you answer, do a quick bullet-point brainstorm of the dialectical options, think carefully through each numbered step below, and then give me your verdict in a conversational but rigorous voice. Don't just recite the standard solution or point me to a reading list; I want the reasoning.

  Here is the setup and the argument. Judy is dropped in an area cut into two territories, Red and Blue, and each territory is cut into a Second Company sector (S) and a Headquarters sector (not S). Her prior is flat: .25 for each of the four cells R&S, R&not-S, B&S, B&not-S, so P(R)=P(B)=.5 and R is independent of S. Then she gets a radio message. Paraphrasing: it says the speaker can't be sure where she is, but if she is in Red territory the odds are 3:1 that she is in Second Company, whereas if she is in Blue territory the odds are 1:3 that she is in Second Company. So after the message her new conditional probabilities are P'(S|R)=3/4 and P'(S|B)=1/4. The message just reassigns those conditional probabilities; it never says which cell she is actually in. Now the argument:

  (1) Judy's prior odds on R versus B are 1:1, and her prior has R independent of S.
  (2) The radio message gives her new conditional probabilities for S on the partition {R, B}: 3/4 on R and 1/4 on B.
  (3) The Judy Benjamin rule says that when your prior odds on the partition cells are equal and you learn new conditional probabilities q and r for some hypothesis S on those cells, your posterior odds on R versus B should become q:r.
  (4) With q=3/4 and r=1/4, that means her posterior odds on R versus B are 3:1, so P'(R)=3/4.
  (5) But compare: if instead of the radio message she had simply been told, outright, that she is in Second Company, then ordinary Bayesian updating using the same numbers gives P(R|S) = (3/4 * 1/2) / (3/4*1/2 + 1/4*1/2) = 3/4 as well.
  (6) So the radio message moves her confidence in Red to exactly the same place as actually learning that S is true, even though the message never told her she was in Second Company; it only told her how strongly S is linked to R.

  That conclusion seems to prove too much to me. I most want to keep the thought that the radio message by itself doesn't tell her she's in Second Company, so I'm definately inclined to say P'(R) should stay at 1/2, with the cells becoming 3/8, 1/8, 1/8, 3/8 (the symmetric update that keeps both P(R) and P(S) at 1/2). But my friend says that's just maximum-entropy dogmatism and that step (3) is the only principled way to respect the equal priors. I don't want to throw out a rule just because the consequence is weird, but I also can't see which premise is doing the illegitimate work in this arguement.

  So: which step do you reject, and what does rejecting it cost me? If I give up (3), what updating rule should replace it — plain conditionalization, Jeffrey conditioning, a minimum-relative-information/MaxEnt rule, something else — and how does each option handle the fact that S was never learned? If instead I keep (3) and swallow P'(R)=3/4, what exactly am I committing to about the evidential force of learning a correlation? Please price the seperate alternatives and tell me which premise looked plausible but isn't. No citations needed, just careful philosophy, as if we are still arguing over these fries.
