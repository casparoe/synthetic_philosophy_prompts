  **Title:** The Limits of Solidarity: Antirepresentationalism and the Problem of Moral Progress

  The central promise of neopragmatism is the liberation of philosophical inquiry from the burden of metaphysical accuracy. By rejecting the notion that language functions as a mirror of nature, the neopragmatist seeks to dissolve traditional epistemological problems and reorient philosophy toward social practice and cultural criticism. Within this framework, moral progress is not understood as an increasing alignment with mind-independent moral facts, but rather as the expansion of solidarity and the development of vocabularies that reduce cruelty. However, this antirepresentationalist stance generates a severe internal tension when confronted with the problem of entrenched oppression. If justification is solely a matter of social agreement within a linguistic community, and if truth is merely what proves good to believe, the framework struggles to explain how a community can critically transcend its own harmful norms. This essay argues that Richard Rorty's strict antirepresentationalism cannot support a noncircular account of moral progress when the existing moral vocabulary is itself the source of harm. While the pragmatic emphasis on redescription offers a powerful tool for cultural change, it ultimately fails to distinguish between liberating innovation and mere rhetorical manipulation unless it surreptitiously relies on a naturalistic standard it officially rejects. Consequently, the view must be revised to admit a minimal, non-metaphysical realism regarding human vulnerability to function as a genuine normative constraint.

  The core of the difficulty lies in the relationship between vocabulary and justification. In the neopragmatist picture, we are always situated within a "final vocabulary," a set of words we use to justify our actions and beliefs. Progress occurs when a new vocabulary is introduced that redescribes existing practices in a way that makes previous certainties look obsolete or cruel. This process relies on persuasion rather than proof; it is a matter of making the new language attractive to the community. The worry, however, is that this model presupposes an audience capable of recognizing the attractiveness of the new description. When the prevailing vocabulary systematically obscures harm—for instance, by categorizing systemic exploitation as "natural order" or "divine will"—the victims of that harm may lack the linguistic resources to articulate their suffering as a moral wrong. If justification is purely a matter of solidarity among those who share a vocabulary, the oppressor, operating within a coherent and self-reinforcing linguistic framework, can claim their practices are fully justified. To say that the oppressor is wrong requires appealing to a standard outside their vocabulary. If Rorty insists there is no such outside, he is left claiming that the liberal vocabulary is only better relative to those who already prefer it. This renders the account of progress circular: moral progress is what looks like progress to those who already value the traits associated with progress.

  Defenders of this position often argue that Rorty does have a standard: the avoidance of cruelty. He posits that while we cannot appeal to Moral Truth, we can appeal to the shared human capacity for suffering and humiliation. The new vocabulary is better because it reduces pain. However, this move risks smuggling in the very naturalism antirepresentationalism seeks to avoid. If "pain" and "humiliation" are treated as brute, pre-linguistic facts that constrain our vocabularies, then language is, in a significant sense, answerable to something non-linguistic. This functions as a representational constraint, even if Rorty refuses to call it that. If, on the other hand, pain and humiliation are themselves linguistically constructed—dependent on the victim having the vocabulary to interpret their sensation as "humiliation" rather than "discipline" or "penance"—then the appeal to suffering loses its critical bite. An entrenched oppressive vocabulary can simply redescribe the physical sensations of the oppressed as necessary for their spiritual welfare or social stability. Without an independent criterion to adjudicate between the description "discipline" and the description "torture," the pragmatist is left with a clash of aesthetics. The claim that one redescription is "liberating" and the other "oppressive" becomes a matter of preference, lacking the normative force required to condemn the oppressor who genuinely believes their vocabulary is superior.

  This leads to the question of whether irony and hope can bridge the gap. The figure of the "liberal ironist" is someone who recognizes the contingency of their own vocabulary yet remains committed to reducing cruelty. Irony is meant to prevent the solidification of dogma, keeping the vocabulary open to revision. Hope is the belief that solidarity can be expanded to include more people. Yet, these concepts do not solve the problem of normative authority. Irony acknowledges that one's principles are contingent, but it does not provide a reason to prefer one contingency over another when the two are in conflict. If a community is ironic about its commitment to equality, that commitment may dissolve. Hope is similarly insufficient; hoping for a wider solidarity is not an argument for why that solidarity is morally required. It expresses a desire, not a justification. When faced with a community that takes pride in its exclusionary practices, telling them to "hope for wider solidarity" is merely expressing a preference for inclusion. It does not demonstrate that their exclusion is a mistake in a way that they, from within their own framework, ought to recognize. The neopragmatist account thus remains persuasive only within a community already committed to the values it is supposed to justify. It cannot penetrate the closed circle of a harmful vocabulary without begging the question.

  Furthermore, there is a crucial distinction between a vocabulary that alters our feelings about a practice and one that changes what we are entitled to recognize as harm. A purely rhetorical shift might make us feel differently about slavery without granting the enslaved person a status that demands recognition. For moral progress to be real, the new vocabulary must alter our normative entitlements; it must make certain responses obligatory rather than optional. Rorty's focus on sentiment and solidarity leans heavily toward the alteration of feelings. He suggests that moral progress is a matter of increasing sensitivity, of seeing more people as "one of us." But sensitivity is fickle. If the recognition of harm depends entirely on the cultivation of sympathy, then those who fail to sympathize have not made a cognitive error; they have simply failed to feel. There is no sense in which they are *wrong* about the world, only that they are out of step with the prevailing sentiment. This undermines the seriousness of moral claims. If the recognition of harm is not grounded in something more robust than contingent solidarity, then the entitlement to recognize harm is fragile. It suggests that the victim's claim to justice is valid only if the oppressor can be persuaded to feel differently. This places the burden of moral truth on the rhetorical skills of the reformer rather than on the reality of the victim's condition.

  Can this view be coherently reconstructed to avoid these pitfalls without abandoning its core insights? Some have suggested that we can treat human vulnerability as a "transcendental" condition of language use. Since language users are finite, embodied organisms, there are certain things that can be done to them that destroy their capacity to participate in discourse. On this reading, cruelty is not just a bad taste; it is a performative contradiction of the communicative community. However, Rorty consistently resists such moves, viewing them as relapses into Kantianism or essentialism. To remain faithful to his radical contingency, he must maintain that even the status of "language user" is a matter of social recognition. If he admits that there are biological or psychological constraints that make certain vocabularies objectively better at facilitating human flourishing, he concedes that language is answerable to human nature. This would be a form of representationalism, albeit a naturalistic one rather than a metaphysical one.

  Therefore, the most honest assessment is that Rorty's strict antirepresentationalism cannot be coherently reconstructed to support a robust account of moral progress. The framework is too thin to bear the weight of normative criticism when the community's solidarity is itself the problem. To say that a new vocabulary is "better" because it reduces suffering is to make a claim about the relationship between language and the world—specifically, the world of human neurophysiology and psychology. It implies that some vocabularies map onto the realities of human need more accurately than others. Denying this forces the neopragmatist into a quietism where the only critique available is internal inconsistency or aesthetic unappealingness. Neither is sufficient to combat deep-seated injustice.

  The best response, then, is to revise the antirepresentationalist doctrine. We need not return to a Platonic realm of moral forms or a divine command theory to secure normative force. Instead, we must admit a "weak realism" regarding human vulnerability. This realism does not require a correspondence theory of truth for moral propositions, but it does require acknowledging that human organisms have specific capacities and needs that are not entirely constituted by language. Pain, starvation, and psychological disintegration are not merely descriptions; they are events that happen to bodies. A moral vocabulary that ignores or legitimizes these events is not just "different"; it is functionally defective relative to the goal of human flourishing. By admitting that the world (in the form of human biology and psychology) exerts a constraint on valid vocabularies, we can distinguish between rhetorical change and liberating change. Liberating change is that which aligns our social practices with the non-linguistic realities of human vulnerability.

  This revision saves the pragmatic emphasis on practice and history while avoiding the circularity of pure solidarity. It allows us to say that the slaveholder is not merely using a different vocabulary, but is failing to recognize a fact about human beings that imposes a normative demand. This fact is not a "moral fact" in a metaphysical sense, but a natural fact with moral implications. Rorty's fear was that admitting any such constraint would reopen the door to foundationalism and dogmatism. However, a constraint based on vulnerability is not a foundation for a system of ethics, but a boundary condition for any viable ethics. It does not tell us exactly what to do, but it tells us when we are causing harm that cannot be justified by mere consensus.

  In conclusion, while Rorty's neopragmatism offers a compelling critique of metaphysical pretension and a useful model for understanding cultural change, its strict antirepresentationalism renders it incapable of grounding moral progress against entrenched oppression. The reliance on solidarity and redescription without an independent criterion reduces moral criticism to aesthetic preference or circular self-congratulation. To account for the normative force of moral claims—specifically the claim that some practices are harmful regardless of whether the community recognizes them as such—the theory must be revised. We must abandon the claim that justification is *only* a matter of solidarity and admit that human vulnerability provides a non-linguistic constraint on our vocabularies. This does not require a return to the mirror of nature, but it does require acknowledging that the mirror can break, and that the shards cut us regardless of how we describe them. Only by accepting this minimal realism can we ensure that moral progress is more than a change in taste, and that our hope for a less cruel world is grounded in something more durable than the shifting sentiments of the present.
