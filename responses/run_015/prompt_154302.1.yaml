prompt: |-
  I teach an upper-level undergraduate seminar on federalism and multilevel governance: 24 students, one 75-minute session. They have already read the standard statements of subsidiarity (the EU's, the German Basic Law's necessity test, and the Swiss constitutional version), so I do not want anything that restates them.

  Design a simulation that makes them feel one difficulty the reading slides past. Subsidiarity tells you to presume in favour of the smaller unit, but it does not say who gets to apply that presumption, and every candidate allocator — the union, the member units themselves, a court, a constituent convention — has an interest in the answer, because allocating competences is itself the most centralising power there is. I want them to run into this rather than hear it: they should spend the first part of the session arguing about which level should decide some concrete policy, and only later discover that the disagreement underneath was about who decides that question. Ideally I do not say the phrase "who decides who decides" until after they have tried to write a rule.

  Concretely: six regional delegations of four, each with a written brief giving it (i) a local preference that diverges from the union median on some issue, (ii) a spillover it imposes on or suffers from its neighbours, and (iii) at least one issue on which it would prefer union-wide rules — so that every delegation has a reason to want localism for itself and centralisation for others. Give me the policy domain, the six briefs, a scoring scheme using points or legitimacy tokens rather than money, a timeline with minute marks, and, the part I care most about, the moment where I hand them a ballot asking only who decides who decides and they have to draft a workable rule on the spot, with the moves I should have ready for the proposals they will predictably produce.

  Then a debrief that maps moments in the session onto the distinction between subsidiarity as a presumption about outcomes and as a rule about authority, says what will predictably go wrong the first time I run it, and is frank about which feature of the problem the simulation cannot reproduce and I will have to supply in discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduates (24 students).
      *   **Context:** Seminar on federalism/multilevel governance (75 mins).
      *   **Prior Knowledge:** They know standard subsidiarity texts (EU, German, Swiss).
      *   **Goal:** Make them *feel* the "who decides who decides" problem (the meta-competence issue), not just hear about it.
      *   **Constraint:** Do not restate subsidiarity principles. Do not use the phrase "who decides who decides" until the end.
      *   **Structure:**
          *   6 regional delegations (4 students each).
          *   Specific briefs (local preference, spillover, desire for centralization on *other* issues).
          *   Scoring: Points/legitimacy tokens (no money).
          *   Timeline: Minute-by-minute for 75 mins.
          *   Critical Moment: The ballot on "who decides."
          *   Instructor Moves: Anticipate student proposals and have counters ready.
          *   Debrief: Map experience to theory, predict failures, acknowledge simulation limits.

  2.  **Determine the Policy Domain:**
      *   Needs to be tangible, relatable, and prone to spillovers.
      *   *Idea 1: Environmental regulation.* (Classic, but maybe too abstract for quick negotiation).
      *   *Idea 2: Digital privacy/data.* (Good, but technical).
      *   *Idea 3: Public Health/Epidemic Response.* (Very relevant, high stakes, clear spillovers).
      *   *Selection:* **Cross-Border Water Management & Industrial Zoning.** It's physical, easy to visualize spillovers (pollution flows downstream), and allows for clear "local benefit vs. neighbor cost" dynamics. Let's call it the "River Basin Authority" simulation.

  3.  **Design the Delegations (The Briefs):**
      *   Need 6 regions. Let's arrange them geographically (Upstream 1-3, Downstream 4-6) to enforce spillovers.
      *   *Mechanism:* Each region has a "Development Project" they want to approve locally (e.g., a dam, a factory, a mine).
      *   *Conflict:* The project benefits the local region but harms neighbors (spillover).
      *   *Twist:* Each region also faces a threat from *another* neighbor's project and wants a Union-wide ban on *that specific type* of project to protect themselves.
      *   *Incentive:* Points for approving own project, points for stopping harmful neighbor projects, points for maintaining "Sovereignty Tokens" (avoiding centralization).

      *   *Drafting the Asymmetry:*
          *   Region A (Upstream): Wants Dam (flood control/energy). Harms B & C. Wants Union ban on Mining (which D wants).
          *   Region B (Mid-Upstream): Wants Chemical Plant. Harms C & D. Wants Union ban on Dams (A).
          *   Region C (Mid-Downstream): Wants Mining. Harms D & E. Wants Union ban on Chemical Plants (B).
          *   Region D (Low-Downstream): Wants Agriculture Expansion (pesticides). Harms E & F. Wants Union ban on Mining (C).
          *   Region E (Coastal 1): Wants Port Expansion. Harms F & Marine. Wants Union ban on Ag (D).
          *   Region F (Coastal 2): Wants Tourism Zone. Harms Marine. Wants Union ban on Ports (E).
      *   *Refinement:* Keep it simpler. Let's make it about *Standards* rather than specific projects, so they can vote on rules.
      *   *Revised Concept:* **The "Emissions & Standards" Treaty.**
      *   *Simpler Dynamic:* Each region has a specific industry they dominate. They want low standards for *their* industry (local control) but high standards for *others'* industries (centralized ban).
      *   *Wait, the prompt asks for:* "(i) a local preference that diverges from the union median, (ii) a spillover it imposes on or suffers from its neighbours, and (iii) at least one issue on which it would prefer union-wide rules."
      *   *Let's stick to the River Basin idea but simplify the mechanics.*
      *   **Policy:** Water Quality & Usage Standards.
      *   **Regions:** 1 (Headwaters) to 6 (Delta).
      *   **Brief Structure:**
          1.  **Local Priority:** A specific use of water (e.g., Heavy Industry, Agriculture, Hydro) that requires loose standards.
          2.  **Spillover Suffered:** Pollution from upstream.
          3.  **Centralization Wish:** Wants a Union Veto on *Upstream* activities, but wants Local Veto on *Own* activities.

      *   *Actually, to make the "Who Decides" moment hit hard, they need to try to solve a specific dispute first.*
      *   *Scenario:* A crisis has emerged. Region 3 wants to build a dam. Region 5 says it kills their fishery.
      *   *Task 1:* Resolve the Region 3 Dam dispute.
      *   *Task 2:* Realize you can't solve it without a rule for the next dispute.
      *   *Task 3:* Draft the rule for *who makes the decision*.

  4.  **Develop the Scoring (Legitimacy Tokens):**
      *   Currency: "Political Capital" (PC).
      *   Gain PC by: Achieving local policy goal, Protecting self from spillover.
      *   Lose PC by: Conceding sovereignty (accepting Union rule over local matter).
      *   Win Condition: Most PC at the end.

  5.  **Timeline (75 Minutes):**
      *   0-10: Setup & Briefing.
      *   10-30: Phase 1 (The Specific Dispute). Try to solve the "Region 3 Dam" issue using existing (vague) subsidiarity norms.
      *   30-45: Phase 2 (The Realization). It's deadlocked. Instructor introduces the "Procedural Vote."
      *   45-60: Phase 3 (Drafting the Meta-Rule). Who decides?
      *   60-70: The Vote & Reveal.
      *   70-75: Debrief Intro.

  6.  **The Critical Moment (The Ballot):**
      *   Students will try to write a substantive rule (e.g., "No dams if fish die").
      *   Instructor must block this: "We aren't deciding the dam. We are deciding *who decides* the dam."
      *   Predictable proposals: Unanimity (veto power), Majority Rule (tyranny of downstream), Court (who appoints judges?), Commission (technocrats).
      *   Instructor Counters: Show how each biases the outcome.

  7.  **Debrief Strategy:**
      *   Connect the frustration to the "Kompetenz-Kompetenz" problem.
      *   Highlight that subsidiarity is often treated as an outcome (local is better) but functions as a jurisdiction rule.
      *   Acknowledge limits: Simulation lacks history/culture, reduces complex law to points.

  8.  **Refining the Briefs (Crucial Step):**
      *   Need to ensure every region has a reason to be a centralizer *and* a decentralizer.
      *   *Region 1 (Upstream):* Wants to dump waste (Local). Fears nothing upstream. Wants Union rule to force Region 2 to pay for cleanup? No, wants Union rule to *prevent* Region 2 from blocking their flow.
      *   *Let's make it symmetrical:* Every region has a "Dirty Industry" they protect and a "Clean Vulnerability" they want protected by Union law.
      *   *Region 1:* Industry: Mining. Vulnerability: Water Flow.
      *   *Region 2:* Industry: Chemical. Vulnerability: Air Quality.
      *   ...
      *   *Better:* Keep it to one policy domain to save time. **Water Usage.**
      *   *Region 1:* Wants to divert water (Irrigation). Harms 2-6. Wants Union rule preventing 2-6 from charging tolls.
      *   *Region 6:* Wants water flow (Ecology). Harms 1-5 (can't use water). Wants Union rule preventing 1 from diverting.
      *   *The Twist:* Every region is Region 1 to someone and Region 6 to someone else.
      *   *Actually, the prompt asks for 6 briefs.* I need to write them out clearly.

      *   *Revised Plan for Briefs:*
          *   **Context:** The "Federation of River States."
          *   **Crisis:** Region 3 proposes a massive diversion.
          *   **Brief Content:**
              1.  **Your Asset:** What you need to do locally (e.g., Agriculture, Industry).
              2.  **Your Threat:** What upstream/downstream neighbors are doing to you.
              3.  **Your Stance on Subsidiarity:** You argue "Local Control" when defending your Asset. You argue "Union Standard" when attacking your Threat.

  9.  **Drafting the Instructor Moves:**
      *   If they propose a Court: Ask "Who appoints the judges? By what majority?"
      *   If they propose Unanimity: Ask "What happens if one region holds out for a bribe?"
      *   If they propose Majority: Ask "What stops the 4 downstream regions from draining the 2 upstream regions dry?"
      *   If they propose "Case-by-Case": Ask "Who adjudicates the case? (Back to square one)."

  10. **Final Review against Constraints:**
      *   24 students? Yes (6 groups of 4).
      *   75 mins? Yes (Tight, needs strict timekeeping).
      *   No "who decides who decides" phrase until end? Yes.
      *   Scoring non-monetary? Yes (Legitimacy Points).
      *   Debrief covers limits? Yes.

  11. **Writing the Content:** (Self-Correction during drafting)
      *   *Correction:* 75 minutes is very short for 6 groups to negotiate. I need to make Phase 1 very frustrating quickly.
      *   *Adjustment:* Give them 10 minutes to solve the "Region 3 Diversion" crisis. They will fail because Region 3 claims local right, Region 5 claims Union right.
      *   *Instructor Role:* I need to be the "Treaty Secretariat" – neutral but procedural.
      *   *Scoring:* Keep it simple. 10 points for getting your way on your Asset. 10 points for stopping your Threat. -5 points for accepting Union override on local asset.

      *(Self-Correction on Briefs)*: Make sure the divergence from the "Union Median" is clear. The Union Median wants "Sustainable Flow." Region 3 wants "Max Diversion." Region 5 wants "Min Diversion."

      *(Refining the "Moment"):* The ballot shouldn't just be "Who decides?" It should be "Draft the Article."
      *   Option A: Council of Regions (Unanimity).
      *   Option B: Union Parliament (Majority).
      *   Option C: Independent Tribunal.
      *   Option D: Status Quo (Ambiguity).

      *Wait, the prompt asks me to design the moment where I hand them a ballot asking only who decides.*
      *   Okay, I will structure the simulation so they exhaust substantive negotiation, then I stop them and say "You cannot vote on the Dam. You must vote on the Procedure."

      *Let's finalize the Debrief points.*
      *   Subsidiarity as outcome vs. procedure.
      *   The "Self-judging" problem (If regions decide, they bias local. If Union decides, they bias central).
      *   Simulation limit: Real politics has parties/ideology, not just regional interest. Real courts have precedent.

      *Let's write the briefs.*
      *   Need to ensure the "Local Preference diverges from Union Median" is clear in each.
      *   Union Median = "Balanced Ecological Flow."
      *   Region 1: Agriculture (Needs high water). Diverges (High use). Spillover: Reduces flow for 2-6. Centralize: Wants Union to stop 2 from building dams that block fish (irrelevant to 1 but good leverage).
      *   *Simpler:* Each region has one "Local Project" and one "Neighbor Threat."
      *   Region 1: Project = Dam (Local). Threat = Pollution from 2.
      *   Region 2: Project = Factory (Local). Threat = Water scarcity from 1.
      *   ...
      *   This creates a chain of conflict.

      *Okay, ready to generate.*
answer: |-
  # Simulation: The River Basin Protocol
  **Topic:** The Meta-Competence Problem in Federalism (Kompetenz-Kompetenz)
  **Time:** 75 Minutes
  **Students:** 24 (6 Delegations of 4)
  **Instructor Role:** Treaty Secretariat (Procedural Referee, not Mediator)

  ## I. Learning Objective
  Students will experience the **self-referential paradox of subsidiarity**: The rule that determines *which level* governs a policy is itself a policy choice that benefits one level over the other. By attempting to resolve a concrete resource dispute, they will find themselves deadlocked not on the *merits* of the resource, but on the *authority* to judge the merits.

  ## II. Policy Domain: The Trans-Border River Treaty
  The "Federation" consists of 6 States along a single river (State 1 = Headwaters, State 6 = Delta).
  **The Union Median Preference:** "Sustainable Ecological Flow" (Moderate usage, moderate pollution).
  **The Crisis:** State 3 proposes the "Great Diversion," a dam that maximizes local energy but reduces water volume/quality for States 4, 5, and 6.

  ## III. The Delegations (Briefs)
  *Hand these out secretly. Each delegation has 4 roles: Chief Negotiator, Legal Counsel, Economic Advisor, Scribe.*

  **General Rules for All:**
  1.  **Legitimacy Points (LP):** Your goal is to maximize LP.
  2.  **Local Sovereignty Bonus:** If your Local Project is approved *by your own State*, gain **10 LP**. If it is approved *by Union Rule*, gain **5 LP**. If blocked, gain **0 LP**.
  3.  **Spillover Protection:** If a Neighbor's Threat is blocked *by Union Rule*, gain **10 LP**. If blocked by *negotiation*, gain **5 LP**. If allowed, lose **5 LP**.
  4.  **Subsidiarity Stance:** You must argue for "Local Control" regarding your Project. You must argue for "Union Standards" regarding your Threat.

  | State | Geographic Position | Local Project (Diverges from Union Median) | Spillover Threat (From Neighbor) | Centralization Wish (To stop Threat) |
  | :--- | :--- | :--- | :--- | :--- |
  | **State 1** | Headwaters | **Heavy Irrigation.** Needs 80% of flow. (Union says 40%). | **None** (No one upstream). | Wants Union rule preventing State 2 from charging "transit tolls" on water. |
  | **State 2** | Upper-Mid | **Chemical Zone.** High pollution risk. (Union says Low). | **Scarcity** from State 1's irrigation. | Wants Union cap on State 1's water withdrawal. |
  | **State 3** | Upper-Mid | **The Great Diversion Dam.** Energy for 3, dry river for 4-6. | **Pollution** from State 2's chemicals. | Wants Union ban on State 2's chemical discharge. |
  | **State 4** | Lower-Mid | **Mining Operations.** Sediment runoff. (Union says None). | **Drought** from State 3's Dam. | Wants Union veto on State 3's Dam construction. |
  | **State 5** | Lower-Delta | **Commercial Fishing.** Needs clean, flowing water. | **Sediment** from State 4's mining. | Wants Union environmental standards for State 4's mining. |
  | **State 6** | Delta/Sea | **Tourism & Conservation.** Pristine water required. | **Salination/Pollution** from 4 & 5 runoff. | Wants Union authority to overrule *all* upstream industrial permits. |

  ## IV. Timeline (75 Minutes)

  ### 00:00 – 00:10: Setup & Briefing
  *   **Instructor:** Distribute briefs. Explain LP scoring.
  *   **The Mandate:** "You are convened to resolve the State 3 Diversion Crisis. The Treaty currently contains a vague Subsidiarity Clause: *'Competences shall be exercised at the lowest effective level.'*"
  *   **Task:** Reach a consensus on whether State 3 can build the Dam.
  *   **Constraint:** You cannot change the Treaty yet. You must use the existing vague clause.

  ### 00:10 – 00:30: Phase 1 (The Substantive Deadlock)
  *   **Activity:** Delegations negotiate the Dam.
  *   **Dynamic:** State 3 will argue the Dam is "local" (Subsidiarity). States 4-6 will argue the impact is "trans-border" (Union competence). State 1 & 2 will hedge based on their own future projects.
  *   **Instructor Action:** Circulate. If they seem close to a deal, whisper to the losing side: *"Are you sure you want to set this precedent for your own project next week?"*
  *   **Goal:** Ensure they **fail** to reach a unanimous substantive decision. The disagreement should morph from "Is the Dam good?" to "Who has the right to say if the Dam is good?"

  ### 00:30 – 00:35: The Interruption
  *   **Instructor:** "Stop. The Secretariat notes that you cannot agree on the outcome because you cannot agree on the *authority*. We are pausing the Dam vote."
  *   **Action:** Collect all position papers. Hand out **The Procedural Ballot**.
  *   **Script:** "You cannot vote on the Dam. You must now draft **Article 9: The Allocation Rule**. This article determines *who decides* whether a project is Local or Union competence. Once you pass Article 9, we will apply it to the Dam immediately."

  ### 00:35 – 00:55: Phase 2 (Drafting the Meta-Rule)
  *   **Task:** Write one sentence defining the decision-maker.
  *   **Options they will likely propose:**
      1.  *Unanimity:* All States must agree a project is local.
      2.  *Majority:* Union Parliament decides by 50%+1.
      3.  *Court:* An independent tribunal decides.
      4.  *Presumption:* Projects are Local unless 3 States object.
  *   **Instructor Moves (The "Trap"):**
      *   *If they propose a Court:* Ask "Who appoints the judges? By what majority?" (Reveals political control).
      *   *If they propose Majority:* Ask "States 4, 5, 6 form a majority. They will ban State 1 & 2's water use. States 1 & 2 will secede. Is this stable?"
      *   *If they propose Unanimity:* Ask "State 3 wants the Dam. State 4 opposes. If State 4 has a veto, the Union is paralyzed. If State 3 has a veto, the Union is powerless. Which is it?"
      *   *If they propose 'Case-by-Case':* "That is the Status Quo we just failed at. We need a rule."

  ### 00:55 – 01:05: The Vote & Application
  *   **Vote:** Delegations vote on the proposed Article 9.
  *   **Application:** Apply the passed rule to the State 3 Dam.
  *   **Scoring:** Calculate LP based on the outcome.
  *   **Reveal:** Announce the winner. (Likely, half the room will have negative points, highlighting the zero-sum nature of the competence allocation).

  ### 01:05 – 01:15: Debrief (See Section VI)

  ## V. Instructor Cheat Sheet: Predictable Proposals & Counters

  | Student Proposal | The "Trap" (Instructor Counter-Question) | Theoretical Concept Revealed |
  | :--- | :--- | :--- |
  | **"Let the Courts decide."** | "Constitutional courts are political bodies. Who appoints the judges? If the Union appoints them, they will centralize. If States appoint them, they will decentralize. Which is it?" | *Judicial Politics / Appointment Power* |
  | **"Union Majority Vote."** | "States 4, 5, and 6 are downstream. They will form a permanent coalition to restrict States 1, 2, and 3. Is that a Federation or a tyranny of the downstream?" | *Permanent Majorities / Tyranny of the Majority* |
  | **"State Unanimity (Veto)."** | "If State 3 can veto any Union interference, the Union cannot solve the pollution problem. If State 4 can veto State 3's Dam, the Union cannot build infrastructure. Who holds the veto?" | *Paralysis vs. Hegemony* |
  | **"Presumption of Local."** | "Who defines 'Local'? If State 3 says their Dam is local, and State 4 disagrees, who breaks the tie? You have just kicked the can down the road." | *Self-Judging Competence* |
  | **"Let's Compromise."** | "You can compromise on water levels. You cannot compromise on *who has the right to set the levels*. That is a binary switch." | *Authority vs. Policy* |

  ## VI. Debrief Guide (10 Minutes)

  **1. Map the Experience (3 mins)**
  *   "In Phase 1, how many of you argued for 'Local Control'?" (Most hands).
  *   "In Phase 1, how many of you argued for 'Union Standards'?" (Most hands).
  *   "You were all hypocrites. And you were right to be."
  *   **Point:** Subsidiarity is not a moral principle in this room; it was a tactical weapon. You wanted it when it protected your asset, and rejected it when it exposed your vulnerability.

  **2. The Core Distinction (4 mins)**
  *   **Subsidiarity as Outcome:** "Decide locally because local is better." (This is what the texts say).
  *   **Subsidiarity as Authority:** "Decide locally because *we agreed the local level gets to choose*." (This is what you fought about).
  *   **The Reveal:** "I promised not to say this until now: You were fighting over **Kompetenz-Kompetenz** (Who decides who decides)."
  *   Explain that allocating competence is the most centralizing power possible. If the Union decides the boundary, the Union wins. If the States decide the boundary, the States win. There is no neutral arbiter.

  **3. Simulation Limits & Reality (3 mins)**
  *   **What the simulation hid:**
      *   *Ideology:* In reality, parties (Socialists vs. Conservatives) cut across regions. Sometimes a Centralist State agrees with a Localist State on policy, creating strange bedfellows. Here, interest was purely geographic.
      *   *Precedent:* Real courts build doctrine over decades. You had to decide in 20 minutes.
      *   *Exit Options:* In the sim, you had to stay. In reality, States might secede or ignore the ruling (compliance problem).
  *   **Closing Thought:** "The texts you read (EU, German, Swiss) try to solve this with 'necessity tests' and 'proportionality.' But as you saw, someone has to administer that test. The law cannot solve the problem of who administers the law. That is politics."

  ## VII. Materials Needed
  1.  **6 Brief Envelopes** (One per delegation).
  2.  **Legitimacy Scorecards** (Simple sheet to track LP).
  3.  **The Procedural Ballot** (Blank paper for drafting Article 9).
  4.  **Timer** (Visible to students).

  ## VIII. Predictable Failure Modes (First Run)
  1.  **Too much time on Phase 1:** Students love negotiating the "Dam." **Fix:** Hard stop at 30 mins. Even if they are talking.
  2.  **Vague Article 9:** They write "Decisions should be fair." **Fix:** Reject it. "This is unenforceable. Specify the *actor*."
  3.  **Coalition Formation:** States 4-6 might gang up on 1-3 immediately. **Fix:** Remind them that 1-3 control the water source and can physically turn off the tap (asymmetric power), forcing 4-6 to negotiate rather than vote.

  ## IX. Why This Works
  It forces students to inhabit the **structural incentive** of federalism rather than the **normative ideal**. By making them score points based on outcomes, they realize that the "rule of law" regarding competence is actually a distributional struggle. When they try to write the rule for the rule, they encounter the infinite regress that defines the sovereignty problem.
