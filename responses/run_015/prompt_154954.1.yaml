  Noticed the typo—kept the rhythm, didn't scrub it. Fits the theme: perfection isn't the point, function is.

  Here is the deep cut on *anatta* for your feature, skipping the "Buddhism 101" definitions and going straight to the friction between phenomenological shift and legal continuity.

  **The Memory Trap**
  The standard analytic view treats autobiographical memory as the tether. If you remember being the kid who broke the window, you are the person who broke the window. Memory is the thread of the bead necklace. *Anatta* cuts the thread. It argues that memory (*sanna*) is just another aggregate, a data stream, not a proof of ownership.

  In your neurofeedback subjects, the memory is intact, but the *location* of the experiencer has shifted. Under *anatta*, the memory remaining intact is irrelevant to the question of "same-ness." Memory is just content; the "center of gravity" is the context. If the context shifts from a tight, defensive locus (high identification with the narrative) to a diffuse, observational locus (low identification), the *ontological status* of the person has changed, even if the *biographical data* hasn't.

  Think of it this way: A river remains the "Colorado River" legally and geographically, but the water molecules are never the same. Neurofeedback, viewed through *anatta*, doesn't clean the water; it changes the flow rate and the riverbed. If the patient reports the "center of gravity" has moved, they are reporting that the *grasping* (*upadana*) has loosened. They aren't the same "self" because the "self" was never a thing to begin with—it was a verb. They are "selfing" differently now.

  **Continuity as Causal Flow, Not Substance**
  You need to ditch the idea of personal continuity as a solid line. *Anatta* posits continuity as *pratityasamutpada* (dependent origination). It's a causal chain. Moment A conditions Moment B.

  In neurofeedback, you are artificially conditioning the brain's regulatory states. If a patient spends years training their brain to stop spindling into anxiety or depression, they are altering the causal conditions that produce the "I."
  The implication here is radical: The person who started therapy and the person who finished are neither the "same" nor "different." They are causally linked but phenomenologically distinct. The "relocation" your subjects describe is the dissolution of the illusion that there was ever a static center to begin with. They haven't moved *to* a new place; they've realized the old place was a construct.

  For your story, this means the "recovery" isn't a return to a baseline. It's a metamorphosis. The analytic model looks for symptom reduction (return to function). The *anatta* model sees identity reduction (return to emptiness). The patient feels their center of gravity move because the weight of "being someone" has been offloaded.

  **The Clinical and Legal Crash**
  This is where it gets messy for your feature. Western law and clinical ethics are built on the fiction of the stable subject.
  1.  **Consent:** If the "center of gravity" moves, who consented to the treatment? The anxious construct that started the therapy or the diffuse observer that finished it? If the phenomenological self is relocated, the values and risk-tolerance of that self may have fundamentally shifted. *Anatta* suggests consent is momentary, not perpetual. A signature on a form five years ago binds a ghost.
  2.  **Responsibility/Identity:** Law requires a defendant or a plaintiff—a continuous entity. If *anatta* holds, legal identity is a pragmatic label, not a metaphysical fact. If a patient's "center" moves such that they no longer identify with the traumas or drives of their past self, do they bear the same weight of that history? Clinically, we say yes (it's their history). Phenomenologically, they might say no (it's data without an owner).
  3.  **The "Patient" Unit:** In a reductionist model, the patient is the brain/body. In an *anatta* model, the "patient" is a clinging process. Neurofeedback treats the clinging. If the therapy works too well, does the "patient" cease to exist in a meaningful way? You can't discharge a patient who no longer claims to be the one who was admitted.

  **The Takeaway for the Feature**
  Don't frame this as "memory vs. feeling." Frame it as "archive vs. operator."
  The memory is the archive. The "center of gravity" is the operator. Your subjects are saying the archive is full, but the operator has stepped out of the booth.

  The implication for identity is that it is a verdict, not a discovery. We decide someone is the "same person" for the sake of social cohesion, not because it's ontologically true. For your journalist angle: The neurofeedback isn't just regulating brainwaves; it's deregulating the *fiction of the self*. The "relocation" is the patient waking up to the fact that they were never where they thought they were.

  The legal and clinical systems will try to force them back into the box of "Same Person with Improved Symptoms." *Anatta* suggests they are "New Process with Old Data." The friction between those two truths is your story.
