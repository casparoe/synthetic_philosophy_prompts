      *   **Constraints:** Under 300 words, one block, no citations/bibliography, just reasoning.

  2.  **Identify Key Counterarguments:**
      *   *Idealization vs. Reality:* DBA assumes logical omniscience and unlimited computational power. Real agents have bounded rationality.
      *   *Pragmatic vs. Epistemic:* DBA shows pragmatic loss (money), not necessarily epistemic falsity (truth).
      *   *Insulation/No True Scotsman:* Defenders often retreat to "ideal agents" when faced with human limitations, potentially making the theory unfalsifiable.
