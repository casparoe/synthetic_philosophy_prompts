      *   *Awkward:* Refusal to bet. If I don't accept bets, I can't be Dutch-booked.
      *   *Insulation:* Yes, defenders often retreat to "ideal agents." This risks making the normativity vacuous for actual humans.
      *   *Conclusion:* It's a strong ideal, but not a practical commandment.

