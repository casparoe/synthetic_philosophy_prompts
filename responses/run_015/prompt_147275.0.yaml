      The most fatal objection is bounded rationality. Perfect coherence demands logical omniscience and infinite computational power. If calculating coherent probabilities costs more mental energy than the potential loss from exploitation, rationality actually *requires* incoherence to save resources. This isn't a quirk; it's an efficiency trade-off.

