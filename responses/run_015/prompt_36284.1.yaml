answer: |-
  Hey, it is great to hear you are tackling Quine next week because I remember struggling to make the indeterminacy of translation feel like anything more than a logical puzzle when I first taught it, and your instinct to get them to feel the frustration rather than just nod at the textbook is exactly right. The key to making this work in ninety minutes with fourteen students is to stop treating it as a lecture and start treating it as a constrained simulation where the failure of communication is the lesson, so I am going to walk you through a run-of-show that I have tweaked over a few semesters to avoid the usual pitfalls. You want to split the class into three groups, two teams of field linguists and one group of native informants, but here is the trick you need to pull off the punchline: you actually need to split the informants into two sub-groups who receive different secret manuals without the linguists knowing, so if you have fourteen students, put four in Linguist Team A, four in Linguist Team B, and six as Informants, with three Informants getting Manual Alpha and three getting Manual Beta. You will need to prepare index cards beforehand using those animal photos you mentioned, specifically making sure you have plenty of cards showing whole rabbits and whole dogs and cats, but crucially, do not give the linguists any cards that show isolated rabbit parts like ears or tails, because the whole point is that their evidence is restricted to scenarios where the rival hypotheses are extensionally equivalent.

  For the informant manuals, you need to print these out on separate colored paper so they do not get mixed up, and keep the instructions dead simple so the students do not need you to interpret them during the activity. Manual Alpha should tell the informants that they are speakers of a language where the word Gavagai refers to the whole enduring animal, so their rule is to say Yes if the card shows a whole rabbit and No if it shows anything else, including other animals or empty space. Manual Beta should tell the informants that they are speakers of a language where Gavagai refers to an undetached rabbit part, so their rule is to say Yes if the card shows a rabbit or any part of a rabbit, but since you are only giving the linguists cards with whole rabbits, the Informants with Manual Beta will also say Yes to every whole rabbit card because a whole rabbit contains undetached parts. You might be wondering why I suggest using undetached parts instead of the temporal rabbit-stages Quine famously mentions, and it is purely pragmatic because static photos make temporal stages hard to simulate without video, but the ontological relativity point lands just as hard with parts versus wholes. During the activity, the linguists are not allowed to speak English or ask questions other than pointing to a card and saying Gavagai, and the informants are only allowed to answer with two native words you provide them, like Ver for Yes and Neg for No, which you should write on the board so everyone knows the only available signals.

  You should budget about ten minutes for the introduction where you set the scene that they are arriving on a remote island and need to compile a dictionary, then spend five minutes separating the groups and handing out the secret manuals to the informants while the linguists wait outside the room or have their backs turned. The core activity should run for about forty minutes, which sounds like a lot but students waste time trying to devise clever pointing gestures or get frustrated when their hypotheses do not seem to solidify, and you need to circulate quietly to ensure no one breaks character by whispering in English. After thirty minutes of data collection, stop the linguists and ask each team to write down their definitive translation of Gavagai on the board, which will almost certainly be Rabbit for both teams since that is the most natural hypothesis given the cards. Then comes the reveal where you ask the Informants to stand up and read their manual definitions aloud, so Group Alpha says it means Rabbit and Group Beta says it means Undetached Rabbit Part, and you will see the moment of confusion when the linguists realize both groups gave the exact same Yes and No answers to every single card they were shown.

  The debrief is where you connect this frustration to the text, and you should start by asking the linguists what test they could have performed during the game to distinguish the two meanings, leading them to realize they would need to point to an isolated ear, but they did not do that because they do not yet have the words for ear or part in the native language. This maps directly onto Quine's notion of stimulus meaning, which is just the set of sensory stimulations that prompt assent or dissent, and you can explain that since the stimulus meaning for Rabbit and Undetached Rabbit Part is identical in the context of whole-rabbit presentations, the evidence underdetermines the translation. You need to press them on why they cannot just assume it means Rabbit, which brings you to ontological relativity, the idea that what objects exist in our worldview depends on the translation manual we adopt, and neither manual is wrong because both save the phenomena equally well. You should spend the last twenty minutes of the session drawing this out, making sure to link it back to the rejection of the analytic-synthetic distinction since if meaning were fixed by definitions, this ambiguity would not exist, but since meaning is tied to empirical evidence, it remains loose.

  There are a few things that predictably go wrong the first time you run this, so I want to warn you so you can head them off. The most common issue is that the informants get bored or feel silly and start giving random answers or hinting at the truth with facial expressions, so you need to emphasize that their grade or participation credit depends on sticking rigidly to the manual. Another problem is that the linguists will try to cheat by asking complex questions like Is this the same Gavagai as that, which requires identity conditions you have not taught them, so you must enforce a rule that the only permissible utterance from a linguist is the word Gavagai accompanied by a point. Sometimes one team of linguists finishes way faster than the other, so have a backup deck of cards with different animals ready to keep them busy, or ask them to start compiling grammar rules for pluralization which will also turn out to be indeterminate. You also need to manage the energy in the room because if the linguists get too frustrated they might shut down, so remind them halfway through that confusion is the goal and that they are experiencing the exact problem Quine is describing.

  I also want to be honest with you about a limitation of this game so you do not oversell what it proves. The activity makes the indeterminacy look like it is primarily about ostension and pointing at objects, which might lead students to think that if we just had enough complex sentences or contextual clues, we could fix the meaning. Quine's actual claim is much stronger and applies to the whole web of belief, meaning that even with infinite evidence and complex grammar, there could still be rival translation manuals that fit all the data but assign different meanings to every term. This game cannot reproduce that holistic indeterminacy because it is too short and too restricted to simple predicates, so you need to explicitly tell them in the debrief that this is just a toy model of the problem. You should explain that in the real philosophical argument, the indeterminacy extends to logical connectives and theoretical terms, not just nouns like Gavagai, and that Quine is challenging the very idea that there is a fact of the matter about meaning independent of a manual. If you leave them with the impression that this is just about ambiguous nouns, they will miss the threat it poses to empiricism, so make sure you pivot from the game to the broader epistemological implications before they pack up.

  Finally, just a note on the materials since you mentioned having pairs of photos of the same animal. You can use those pairs to show that even if you present the same rabbit twice, it does not help, because both manuals still say Yes to both presentations, reinforcing that identity over time is also part of the manual we impose rather than something given in the stimulus. Do not worry if the session feels a bit chaotic because the friction is where the learning happens, and if they leave the room arguing about whether meaning is real, you have succeeded. I hope this helps you structure the session, and feel free to reach out if you want to talk through how the debrief lands after you try it.
