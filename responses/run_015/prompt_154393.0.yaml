          Salt crusted the cobblestones of Pier Street, where the morning mist usually hid the waistlines of the waking town. Not today.

          Elara stood on her porch, shears in hand. The tether around her waist was thick, woven by the woman next door during the winter storms. It was honor, solid and knotted. But the rent was due, and the cable merchants offered three crowns a strand for raw insulation fiber. She didn't hesitate. The steel snapped through the weave. The belt fell to the boards with a soft thud. Elara coiled the loose rope, feeling lighter, though she didn't look at her neighbors.

          Two doors down, Tomas tightened his knot. His fingers brushed the rough hemp. His neighbor, Mrs. Gable, was bedridden with fever. She'd woven his before the coughing started. To cut it now felt like stealing warmth from a sick room. He kept it on, the loop sagging slightly. It wasn't about the market price; it was about the hand that made it.

          Further along, Mara leaned against the lamppost. A merchant from the mainland walked past, waist bare, shirt tucked into trousers. No tether. Years ago, this would have drawn stones or silence. Now, Mara watched him pass. She waited for the prick of shame, the instinctive judgment of an outsider. It never came. He was just a man buying fish.

          By noon, the street hummed with confusion. Some belts lay coiled in market baskets, sold for cable lining. Others remained tied, stiff with tradition. The town couldn't name the killer. Was it the merchants' gold buying the weave apart? Was it a silent argument passed in glances? Or had the honor simply evaporated, leaving only rope behind? Pier Street woke up tied, and went to sleep unraveling, unsure if they had been liberated or unmoored.

