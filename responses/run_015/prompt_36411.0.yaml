  Your verdicts are coherent under a single principle: a dispute is verbal if it disappears when both sides agree on a neutral description of all physical facts and moral values, but substantive if disagreement persists in that neutral language.

  This principle, often called the **Neutral Translation Test**, saves your intuition on case #4 while keeping #1 and #2 verbal. In the tomato (#1) and chair (#2) cases, once you translate both sides into neutral terms ("ovary structure" vs. "culinary sweet," or "atoms arranged chairwise" vs. "no composite object"), the conflict vanishes; both parties agree on the arrangement of matter and merely differ on which label or quantifier to apply. In the fetus case (#4), however, translating to neutral terms ("biological stage X" vs. "entity with moral rights") leaves a residual disagreement about *values*: the uncle asserts stage X possesses rights, the cousin denies it. That normative clash remains even after semantics are fixed, making it substantive.

  Your tentative test failed because you assumed "grasping usage" resolves all verbal disputes, but in moral arguments, the disagreement isn't about the definition of "person" so much as the *criteria for moral status* attached to that term. The chair guy is wrong to equate #4 with #2 because denying the existence of a chair changes nothing about how we sit or build, whereas denying personhood changes how we act toward the fetus. You do not need to overturn any verdicts, though #2 is the most philosophically fragile; it counts as verbal only if you accept "meta-ontological deflationism" (the view that existence claims are just linguistic conventions), which fits your intuition but contradicts many metaphysicians.

  For your undecided cases, the principle predicts:
  *   **Case #5 (Chess Engine):** **Verbal.** Once you agree on the neutral facts (the engine uses neural nets to predict moves), the disagreement reduces to whether "understanding" requires consciousness or just functional success. Like "fruit," this is a choice of definition unless tied to a specific empirical claim about qualia.
  *   **Case #6 (Finitist Math):** **Not Verbal.** Translating to neutral language ("the set of all naturals exists") leaves a direct contradiction about mathematical truth conditions that alters which proofs are valid. Unlike chairs or tomatoes, this changes the logical consequences of the system, not just the labels.
