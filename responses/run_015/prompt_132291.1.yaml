answer: |-
  You are absolutely right to focus on **modal counterfactuals**. That is the weak point in the occasionalist armor, and it's where the "science isn't broken" defense usually crumbles. Your roommate is arguing for a compatibilist view (Occasionalism + Science can coexist), but they are likely treating scientific laws as mere *descriptions* of past events rather than *prescriptions* for future behavior.

  Here is a specific conceptual issue you can use. It's called **The Truthmaker Problem for Subjunctive Conditionals**, specifically applied to **Interventionist Causation**.

  ### The Core Argument: The "Truthmaker" Gap

  In modern philosophy of science (think James Woodward or Judea Pearl), causation isn't just about things happening one after another (constant conjunction). It's about **intervention**. A causal claim is true if: *"If I were to intervene and change $X$, $Y$ would change in a specific way."*

  For that statement to be **true**, there must be something in reality right now that *makes* it true. This is called a **truthmaker**.

  *   **In a Causal Realist view:** The truthmaker is the *causal power* or *mechanism* inherent in the objects (e.g., the chemical structure of the cotton and the thermal energy of the fire). This structure exists *now* and grounds the prediction about *later*.
  *   **In Al-Ghazali's Occasionalism:** There is no power in the cotton or fire. The only thing connecting the fire-touching to the cotton-burning is God's will at the *next instant*.

  **The Tension:**
  Ask your roommate: **"What is the truthmaker for the scientific law 'Fire burns cotton' *before* God acts?"**

  1.  **If they say "God's Habit (*Adah*):**" Then the law is just a summary of past actions. It has no **modal force**. It means "Fire has *usually* burned cotton," not "Fire *must* burn cotton."
  2.  **If they say "God's Nature":** Then God is *necessitated* to burn the cotton when fire touches it. But this violates Al-Ghazali's core theological premise: that God is absolutely free and not bound by any external or internal necessity to act in a specific way.

  **The Contradiction for Science:**
  Science relies on laws having **modal stability**. When an engineer builds a bridge, they aren't betting on God's *habit*; they are betting on the *necessity* of physics. If occasionalism is true, the engineer is actually betting on God's *continued willingness to cooperate*.

  If your roommate says, "But God *is* consistent, so science works," hit them with this:

  > "If God's consistency is contingent (He *could* choose otherwise), then scientific laws are not **law-like**, they are just **statistical trends**. But science treats laws as supporting **robust counterfactuals**.
  >
  > **Example:** 'If I had struck this match in a vacuum, it wouldn't have lit.'
  >
  > In occasionalism, this statement is false. Why? because there is no causal mechanism in the match or the vacuum that *prevents* lighting. Only God's will prevents it. Since God's will is free, He *could* have willed the match to light in a vacuum. Therefore, there is no **necessary connection** between 'vacuum' and 'no fire.'
  >
  > If there is no necessary connection, then **scientific explanation is an illusion.** We aren't explaining *why* things happen; we are just cataloging *what* God happened to do."

  ### The "Local Coordination" Problem (The Backup Argument)

  If they dodge the modal argument, hit them with the **Problem of Local Coordination**.

  Al-Ghazali says God creates the fire, then God creates the burning in the cotton. They are two separate creations.
  **Question:** "If there is no causal link between the fire and the cotton, why does God coordinate them **locally**?"

  *   When I touch fire to cotton *here*, the cotton burns *here*.
  *   Why doesn't God burn the cotton in the *next room*?
  *   Why doesn't God burn the cotton *five minutes ago*?

  If there is no causal mechanism transmitting the "burning power" from fire to cotton, then the **spatio-temporal proximity** of the fire and cotton is irrelevant. God could burn anything at any time.

  The fact that He *always* chooses to burn the cotton touching the fire implies God is following a **Rule of Local Interaction**.
  *   **Dilemma:** Is this Rule external to God? (If yes, God is subject to a higher law, which breaks Islamic theology).
  *   **Or:** Is this Rule internal to God's nature? (If yes, God is necessitated to act locally, which breaks Divine Freedom/Occasionalism).

  ### How to Phrase It in the Debate

  Don't say "God does everything." Say this:

  > "You're arguing that Occasionalism is compatible with science because God acts consistently. But you're confusing **predictability** with **explanation**.
  >
  > Science requires **counterfactual stability**. It requires that 'If $X$ hadn't happened, $Y$ wouldn't have' be true because of the *nature of $X$ and $Y$*, not because of a third party's mood.
  >
  > If Al-Ghazali is right, the statement 'If the cotton hadn't touched the fire, it wouldn't have burned' is actually **false**. Why? Because the cotton's burning depends on God's will, not the fire's touch. God could have willed the cotton to burn without the fire.
  >
  > So, Occasionalism doesn't just 'add God' to science; it **deletes the causal glue** that makes scientific counterfactuals true. It turns physics into a history of God's past choices, not a study of how the world *must* behave."

  ### Why This Wins
  This moves the debate away from "Can God do miracles?" (which your roommate wins) to "Does scientific language mean anything if occasionalism is true?" (which you win). It shows that their view forces them to admit that scientific laws are **contingent generalizations**, not **necessary truths**, which undermines the very authority of science they are trying to protect.
