prompt: |-
  I'm a junior majoring in philosophy, and this term I'm in a seminar on race, aesthetics, and politics. We spent most of two weeks on the W. E. B. Du Bois essay about Black art — "Criteria of Negro Art," I think it's called, the one where he says that all art is propaganda and always must be, that he doesn't care about art that isn't used for propaganda, and that this is no license for bad art, because the propaganda has to be beautiful and true to count as art at all. I finished the reading convinced, and then realized that being convinced hasn't changed a single thing I actually do, which makes me suspect I understood it less well than I thought.

  Here is what I mean. I sit on the student exhibitions committee for the gallery in our student union: twice a month, in a ninety-minute meeting, six to ten proposals for small commissions — anywhere from $500 to $3,000 — from student and local artists for work to be installed in the building or shown in the gallery cases. We vote, we write a paragraph of reasons that goes back to the applicant, and the gallery director reviews what we recommend and can veto it (she has, once, over insurance and once over a work that would have needed a structural engineer). Our rubric is three lines — artistic merit, message, fits the space — and it is useless, because every real disagreement we have turns out to be a fight inside the first line. I would like to replace it with a decision procedure built honestly out of Du Bois's position: art should be propaganda; propaganda that isn't made well isn't art; and craft that carries nothing is decoration. Please write me that procedure as an ordered set of questions a committee of non-specialists can run in about fifteen minutes per proposal, each with a stop rule: what counts as passing, what counts as an immediate no, and which questions have to be kicked to a person — the director, the artist, the people depicted — because they are disagreements about values rather than facts and no checklist can settle them. Keep the distinctions in Du Bois's view that are actually doing the work and drop the ones that only matter in a seminar paper, and be blunt about where a rubric like this will misfire.

  Two half-formed ideas of my own, which you should use or discard as you see fit. The first is a subtraction test: take the political content away and ask whether the object still holds up as a made thing, then take the craft away and ask whether the message still reaches anyone who wasn't already persuaded — so that a slogan on a beautiful surface and a beautiful surface with a slogan stapled to it both fail, for different reasons. The second is that propaganda has an addressee, and it matters who it is: a work addressed to the people it depicts, or to the people it wants to move, seems to me a different animal from a work whose real content is that its sponsor is a decent institution, and I don't know what Du Bois's view implies about that second kind. Then run the finished procedure on three kinds of proposal we get constantly. One: a large, genuinely accomplished mural for the dining hall wall about the scheduling of subcontracted food-service workers, proposed by a student labor group, with a student artist whose portfolio is strong and a facilities office that is quietly unhappy. Two: a polished, professionally produced installation funded by the bank that handles the university's accounts — beautiful, costs us nothing, says that everyone on this campus belongs, and puts the bank's name on the wall label; we currently approve these cheerfully and I want to know whether we should. Three: a stack of photocopied posters from the tenants' union in the neighborhood next to campus, about a rent increase at a building the university's foundation has a stake in — the committee agrees with them completely, the people affected made it themselves, and the design is honestly bad; I suspect this is the case where the procedure says something we don't want to hear, and I want to see whether it has to say it or whether it can offer us a condition instead of a no. Finally, tell me what the procedure cannot do — what it will get wrong, which of our decisions it will not touch, and where it will quietly turn into a vote dressed up as a test. Please write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior philosophy major, member of a student exhibitions committee.
      *   **Context:** Seminar on race, aesthetics, politics. Studied W. E. B. Du Bois's "Criteria of Negro Art."
      *   **Core Insight:** Convinced by Du Bois's argument ("All art is propaganda," "must be beautiful and true"), but realizes it hasn't changed their practice. Wants to bridge theory and practice.
      *   **Task:** Create a decision procedure (ordered set of questions) for the committee based on Du Bois's view.
      *   **Constraints:**
          *   Ordered set of questions.
          *   Time limit: ~15 minutes per proposal.
          *   Include stop rules (Pass, Immediate No, Kick to specific person).
          *   Keep Du Bois's working distinctions, drop seminar-only nuances.
          *   Be blunt about where the rubric will misfire.
          *   Use/discards user's two ideas (Subtraction Test, Addressee Test).
          *   Run the procedure on three specific scenarios (Labor Mural, Bank Installation, Tenants' Posters).
          *   Explain limitations (what it can't do, where it becomes a disguised vote).
          *   Language: American English.

  2.  **Deconstruct Du Bois's "Criteria of Negro Art":**
      *   *Core Thesis:* All art is propaganda.
      *   *Requirement 1:* It *must* be propaganda (it must advocate for a truth/cause, specifically racial justice in his context, but generalizable to political truth here).
      *   *Requirement 2:* It *must* be beautiful (craft/aesthetic merit is non-negotiable).
      *   *Requirement 3:* It *must* be true (ethical accuracy/authenticity).
      *   *The Trap:* Bad art fails as propaganda. Propaganda without art is just noise. Art without propaganda is decoration (or worse, lies).
      *   *User's Interpretation:* "Craft that carries nothing is decoration." "Propaganda that isn't made well isn't art."

  3.  **Develop the Decision Procedure (The "Du Bois Rubric"):**
      *   *Goal:* Operationalize "Beauty + Truth + Advocacy."
      *   *Structure:* Sequential questions. If one fails, stop or escalate.
      *   *Incorporating User's Ideas:*
          *   *Subtraction Test:* Good for separating Craft from Message.
          *   *Addressee Test:* Crucial for the "Truth/Propaganda" aspect. Who is this for?
      *   *Drafting the Questions:*
          1.  **The Propaganda Question (Purpose):** What is this fighting for? If "nothing" or "beauty alone," it's decoration. (Du Bois says art *must* be propaganda).
          2.  **The Truth Question (Authenticity):** Is the claim accurate? Who verifies this?
          3.  **The Beauty Question (Craft):** Is it well-made? (User's Subtraction Test fits here).
          4.  **The Addressee Question (Audience):** Who is this speaking to? (User's Addressee Test).
      *   *Stop Rules:* Need clear Pass/Fail/Escalate criteria.
      *   *Time Management:* Keep it tight.

  4.  **Refining the Procedure (Self-Correction/Nuance):**
      *   *Critique:* Du Bois isn't just saying "add a slogan." He's saying the *beauty* serves the *propaganda*.
      *   *Adjustment:* The "Beauty" check can't just be "is it pretty?" It must be "does the craft make the message undeniable?"
      *   *Escalation:* Value disagreements (e.g., is this message *true*?) shouldn't be decided by students. Kick to the affected community or the Director.
      *   *Bluntness:* Acknowledge that "Beauty" is subjective and this rubric might just codify the committee's biases.

  5.  **Applying to the Three Scenarios:**
      *   *Scenario 1 (Labor Mural):* High craft, specific message, institutional friction.
          *   *Analysis:* Passes Propaganda (labor rights). Passes Beauty (strong portfolio). Truth? Needs verification from workers. Addressee? Diners vs. Workers.
          *   *Verdict:* Conditional Yes (verify truth with workers).
      *   *Scenario 2 (Bank Installation):* High craft, vague message ("everyone belongs"), corporate sponsor.
          *   *Analysis:* Propaganda? Yes, but for the bank's image (soft power). Truth? "Everyone belongs" might be a lie if the bank exploits students. Addressee? The institution, not the viewer.
          *   *Verdict:* Likely No (Propaganda for power, not truth). Or escalate regarding the "Truth" of belonging.
      *   *Scenario 3 (Tenants' Posters):* Low craft, high truth/urgency, affected community made it.
          *   *Analysis:* Propaganda? Yes. Truth? Yes (agreed by committee). Beauty? No ("honestly bad").
          *   *Du Bois Verdict:* Strictly, No. It's not art. It's a flyer.
          *   *Nuance:* Du Bois might say "don't put bad art in the gallery, support them another way."
          *   *Condition:* Fund the printing, don't show in the gallery. Or require artist collaboration to elevate craft without losing voice.

  6.  **Addressing Limitations (The "Philosophy Major" Reality Check):**
      *   *Subjectivity:* "Beauty" is still in the eye of the beholder (the committee).
      *   *Institutional Power:* The Director can still veto.
      *   *Safety:* Radical truth might get students in trouble.
      *   *The "Vote" Problem:* The rubric doesn't remove bias; it just gives bias a vocabulary.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Academic but practical, respectful of the user's intelligence, blunt about institutional realities. American English.
      *   *Structure:*
          1.  Introduction (acknowledging the gap between theory/practice).
          2.  The Procedure (The 4 Questions + Stop Rules).
          3.  The Three Cases (Application).
          4.  The Limitations (Where it breaks).

  8.  **Final Review against Constraints:**
      *   Ordered set of questions? Yes.
      *   Stop rules? Yes.
      *   Escalation paths? Yes.
      *   Du Bois distinctions kept? Yes (Beauty/Truth/Propaganda triad).
      *   User's ideas used? Yes (Subtraction/Addressee integrated).
      *   Three scenarios run? Yes.
      *   Limitations explained? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: Make sure I don't make the rubric *too* complex. 15 minutes is very short. Keep the questions punchy. Ensure the distinction between "Decoration" (Craft w/o Message) and "Noise" (Message w/o Craft) is clear, as that's central to Du Bois.

      *(Refining the Bank Scenario)*: Du Bois was wary of art that served the oppressor. The bank piece is propaganda *for* capital. Du Bois would likely reject it not because it's propaganda, but because it's *false* propaganda or propaganda for the wrong side. I need to make sure the rubric catches "Propaganda for Power" vs "Propaganda for Truth."

      *(Refining the Poster Scenario)*: This is the hardest one. Du Bois insisted on high art. He criticized artists who sacrificed craft for message. So, strictly, bad posters aren't art. But politically, rejecting them feels wrong. The solution is to distinguish *Gallery Space* (Art) from *Community Support* (Action). The rubric should protect the gallery's standard while suggesting alternative support.

  9.  **Final Polish:** Check voice. Ensure it sounds like a peer/mentor talking to a junior major, not a professor lecturing. (Proceed to generate output).

      *Wait, one more check on the "Stop Rule" requirement.* I need to be explicit: "If No, stop. If Yes, proceed. If Disagreement, Kick."
      *Also, ensure the "Addressee" test is clearly defined.* Is it speaking *to* the oppressed, *for* the oppressed, or *about* the oppressed to the oppressor?

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure built on the triad you identified in Du Bois: **Propaganda (Purpose), Truth (Ethics), and Beauty (Craft).** It incorporates your subtraction and addressee tests but hardens them into stop rules.

  ### The Du Bois Decision Procedure
  **Time limit:** 15 minutes per proposal.
  **Participants:** Committee members only (for the vote); Director/Artist/Community (for escalations).

  **Question 1: The Propaganda Test (Purpose)**
  *What is this work trying to make the viewer believe or do?*
  *   **The Test:** State the message in one sentence. If the sentence is "this is beautiful" or "this expresses the artist's inner state," it fails. Du Bois rejects art for art's sake. It must advocate for a truth outside itself.
  *   **Pass:** The message is a claim about the world (e.g., "Workers are exploited," "We belong here," "Rent is too high").
  *   **Immediate No:** The work claims to have no message, or the message is purely decorative. (Classify as *Decoration*; reject for this gallery, refer to facilities for lobby filler).
  *   **Kick:** If the committee cannot agree on what the message *is*, kick to the **Artist** for a written artist statement clarifying intent. Do not guess.

  **Question 2: The Truth Test (Ethics)**
  *Is the claim accurate, and who verifies it?*
  *   **The Test:** Propaganda for a lie is not art; it is a weapon. Du Bois insists on truth.
  *   **Pass:** The claim is verifiable or represents a genuine perspective of the group depicted.
  *   **Immediate No:** The claim is demonstrably false (e.g., a bank claiming "we have no fees" when they do).
  *   **Kick:** If the truth depends on lived experience the committee does not have (e.g., the experience of the food workers, the tenants), kick to the **People Depicted**. They get a veto on representation. If they say "this misrepresents us," it is an Immediate No.

  **Question 3: The Subtraction Test (Craft/Beauty)**
  *Does the craft compel the message, or just carry it?*
  *   **The Test:** Use your subtraction method.
      1.  *Remove the message:* Is the object still compelling as a made thing? (If no, it is *Noise*).
      2.  *Remove the craft:* Does the message still land with force on a neutral viewer? (If yes, the craft is unnecessary; if no, the craft is essential).
  *   **Du Bois Standard:** Bad art fails as propaganda because people ignore ugly things.
  *   **Pass:** The craft makes the message unavoidable. The form intensifies the content.
  *   **Immediate No:** The work is technically incompetent to the point of distraction (Noise), OR the craft is so high it sanitizes a violent truth (Seduction).
  *   **Kick:** If the disagreement is about taste vs. skill (e.g., "I don't like this style" vs. "This is sloppily made"), kick to the **Director**. She holds the standard for the space.

  **Question 4: The Addressee Test (Politics)**
  *Who is this work speaking to, and who benefits?*
  *   **The Test:** Identify the primary audience. Is it speaking *to* the oppressed to strengthen them? *To* the powerful to shame them? Or *to* the institution to comfort it?
  *   **Pass:** It addresses a community to move them, or challenges power.
  *   **Immediate No:** It addresses the institution primarily to signal the institution's virtue (e.g., "Look how diverse we are"). This is institutional propaganda, not art.
  *   **Kick:** If the benefit is ambiguous (e.g., helps the artist's career vs. helps the cause), kick to a **Committee Vote**. This is a political judgment, not an aesthetic one.

  ***

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Labor Mural (Student Artist, Labor Group, Unhappy Facilities)
  1.  **Propaganda:** Message is "Subcontracted workers are essential but treated poorly." **Pass.**
  2.  **Truth:** Committee agrees it's true, but do the workers? **Kick to People Depicted.** If the workers say "this makes us look like victims, we want to look like organizers," the design must change. If they endorse it, **Pass.**
  3.  **Craft:** Portfolio is strong. Remove the text: is the imagery still striking? Assume yes. **Pass.**
  4.  **Addressee:** Is it for the diners (shame them) or the workers (honor them)? If it's for the workers, **Pass.** If it's to shame diners, it risks alienating the space's users.
  *   **Verdict:** **Conditional Yes.** contingent on the workers' veto power in Question 2. The Facilities objection is irrelevant unless structural (per your rules). Du Bois would side with the truth of the labor over the comfort of the dining hall.

  #### Case 2: The Bank Installation (Polished, "Everyone Belongs," Bank Funded)
  1.  **Propaganda:** Message is "Everyone belongs on this campus." **Pass** (it is a claim).
  2.  **Truth:** Is it true? If the bank forecloses on student housing or charges predatory fees, it is a lie. **Kick to People Depicted** (Students/Community). If the community says "This bank hurts us," it is an **Immediate No**.
  3.  **Craft:** Professionally produced. **Pass.**
  4.  **Addressee:** Who is this for? It puts the bank's name on the label. It addresses the University Administration to say "We are good partners." It is institutional propaganda.
  *   **Verdict:** **Immediate No.** Under Du Bois, this is the most dangerous kind of object: beautiful craft carrying a lie (or a vague platitude) that serves power. It is decoration for capital. Approving this violates the "Truth" and "Addressee" criteria.

  #### Case 3: The Tenants' Posters (Photocopied, Bad Design, True Message)
  1.  **Propaganda:** Message is "Rent is too high; University is liable." **Pass.**
  2.  **Truth:** Committee and tenants agree. **Pass.**
  3.  **Craft:** Photocopied, "honestly bad." Remove the message: is it a compelling object? No. It is *Noise*.
  *   **Du Bois Verdict:** **Immediate No.** Du Bois was explicit: "I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is not art." Bad design makes the message ignorable. Putting this in a *gallery* degrades the standard of art.
  *   **The Condition:** Do not reject the *people*. Reject the *format*. Offer them the $3,000 commission to work with a student designer (from your committee's network) to elevate the craft without diluting the message. If they refuse, fund the printing costs outside the gallery budget. Do not hang bad art in the gallery; it fails the propaganda test because it won't be seen.

  ***

  ### Where This Procedure Will Misfire

  You asked for bluntness. Here is where this rubric will fail you, and where it will quietly turn into a vote dressed up as a test.

  **1. The "Beauty" Trap**
  Question 3 (Craft) is where your committee's bias lives. "Beauty" is not objective. When you say a work is "technically incompetent," you often mean "it does not look like the art we were trained to value." This rubric will systematically reject vernacular, outsider, or radical aesthetic forms that look "bad" to bourgeois eyes but function perfectly for their community. You will call it "Noise"; they will call it "Authentic." The rubric cannot solve this. It will just give you a philosophical excuse to reject work that makes you uncomfortable.

  **2. The Institutional Veto**
  You noted the Director can veto. This procedure assumes the Director cares about Du Bois. She likely cares about donors (like the Bank) and facilities (like the Dining Hall). If the procedure says "Yes" to the Labor Mural and the Director says "No" because the Dean complained, the rubric is revealed as theater. It creates a false sense of agency for your committee. You must be prepared to leak the "Truth Test" results to the student body if the Director vetoes a truthful work for political reasons.

  **3. The "Truth" Burden**
  Question 2 places a heavy burden on the "People Depicted." In theory, this is ethical. In practice, it can be exploitative. Asking a marginalized group to vet their own representation during a 15-minute committee window is tokenism. If you kick a proposal to them, you are outsourcing your labor to them. If they don't respond in time, does the proposal die? The rubric risks slowing down urgent art until it is no longer relevant.

  **4. The Bank Problem**
  You currently approve the Bank installation "cheerfully." This procedure forces you to admit that you are approving institutional propaganda. If you adopt this rubric, you will have to reject your sponsors. The university may not allow a student committee to adopt a rubric that explicitly blocks donor visibility. You may be overruled not on aesthetic grounds, but on financial ones. Du Bois's theory does not account for the fact that the gallery needs the bank's money to exist.

  **5. The Vote in Disguise**
  Finally, look at Question 4 (Addressee). Deciding "who benefits" is a political vote. If your committee is 6 students, and 4 vote that the Labor Mural helps the workers, but 2 vote it hurts the dining staff, the "Kick" rule activates. But if you vote on the Kick, you have just turned a philosophical inquiry into a majority rule vote. The rubric does not remove politics; it just forces you to admit the politics are there.

  ### Summary
  If you implement this, you will approve fewer works. You will reject the Bank. You will challenge the Dining Hall. You will tell the Tenants their art isn't good enough but offer them resources to fix it. You will make enemies of the Director and the Development Office.

  Du Bois did not write "Criteria of Negro Art" to help committees run smoothly. He wrote it to demand that Black artists survive a hostile world by making work that could not be ignored. If your gallery is a safe space for decoration, this rubric will break it. If it is a space for truth, this rubric is the only one that fits. Choose which one you are running.
