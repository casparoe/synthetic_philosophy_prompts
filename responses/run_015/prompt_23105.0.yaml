      *   *Revised Plan for Secular Divide:* Focus on **Higher-Order Thought (HOT)** theories of consciousness. You aren't conscious of pain unless you have a thought *about* the pain. Animals have first-order states (damage), but not second-order states (suffering about the damage). This is a very strong modern philosophical position (Peter Carruthers, etc.).

