answer: |-
  ### Move-by-Move Adjudication

  **1. Marcus:** **Mostly Right.** He correctly identifies the formal mechanism (the optimal act without info is always available with info), but his claim that the result is "unfalsifiable" is too strong; it is falsifiable for agents who violate the axioms (as Lena notes), though not for ideal Bayesians.
  **2. Lena:** **Clearly Right.** She accurately characterizes the theorem's economic utility (gross value $\ge$ 0) and correctly identifies the specific assumptions (Bayesian updating, consequentialism) whose violation would falsify the prediction.
  **3. Marcus:** **Right on Examples, Wrong on Implication.** The cases (mandated disclosure, utility of knowledge) correctly identify where the *assumptions* fail (fixed action sets, state-independent utility), but they are not counterexamples to the theorem itself, only to its unqualified application.
  **4. Lena:** **Clearly Right.** She correctly applies the Savagean remedy (enlarge the state space to absorb consequences) and honestly admits the cost: this renders the theorem a constraint on model consistency rather than an empirical prediction about the world.
  **5. Marcus:** **Mostly Right.** He correctly notes that standard Good's theorem assumes a fixed partition and conditionalization; a signal that revises the probability function itself (calibration) falls outside the standard formulation.
  **6. Lena:** **Mostly Right.** She is technically correct that one can model calibration uncertainty as a state variable (a "prior over priors"), but she rightly concedes that this does not handle "unrepresented possibilities" (awareness growth), which remains outside the framework.
  **7. Marcus:** **Clearly Right.** This is the correct philosophical status of the theorem: it is a diagnostic tool for checking model coherence, not a substantive command to seek information in all contexts.
  **8. Lena:** **Clearly Right.** She adds a crucial logical point: a violation implies a false assumption, not that information has negative value; this preserves the normative force of the theorem against misinterpretation.

  ### Overall Verdict
  **Lena wins on the technicalities; Marcus wins on the philosophical morals.** Lena successfully defends the internal coherence and extendability of the theorem against Marcus's attempts to break it. However, Marcus is correct that the theorem's *substantive* bite is limited because its assumptions are rarely met in unqualified form. The dialogue converges on the correct conclusion: Good's theorem is a coherence constraint on idealized models, not an empirical law of inquiry.

  ### Specific Adjudications

  **1. Impurity Cases (Moves 3 & 4): Counterexamples or Changes of Subject?**
  These are **changes of subject** relative to the formal theorem, but **genuine limitations** on its application. Marcus is right that real-world information often changes the action set (disclosure laws) or the utility function (dread of knowledge), which violates the "fixed menu" and "consequentialism" assumptions. Lena is right that these can be formally absorbed by enlarging the state space (e.g., treating "having tested" as part of the state). However, Lena concedes exactly enough in Move 4: by absorbing these into the state space, the theorem becomes a tautology of the model ("if you model it as a decision problem, it acts like a decision problem"). She does not concede too much; she accurately identifies the trade-off between generality and testability. The "vacuity worry" is valid but unavoidable for normative coherence theorems.

  **2. Calibration Oracle (Moves 5 & 6): Absorption and Cost**
  Lena is **technically correct** that the calibration case can be absorbed by introducing a state variable for "agent reliability" or "true calibration parameter" and placing a prior over it. This converts a revision of the probability function into a standard Bayesian update on a higher-order state. **The cost**, however, is significant: it requires the agent to have a prior over their own cognitive reliability (a "prior over priors"), which presupposes the very logical omniscience the oracle suggests is missing. Furthermore, as Lena admits, this technique fails for **awareness growth** (learning a possibility you literally could not conceive of before). Good's theorem requires a fixed sigma-algebra; it cannot formally value the expansion of that algebra. Thus, the theorem remains silent on the value of conceptual innovation.

  **3. Substantiveness and Status**
  There is **no reading on which the theorem is both fully general and empirically substantive.**
  *   If taken as an empirical claim about humans, it is false (we pay to avoid info, we process poorly).
  *   If taken as a normative claim about ideal agents, it is trivial (it follows directly from the definition of maximization).
  *   **Its Status:** It is a **coherence constraint** (like a Dutch Book argument). Its value is diagnostic: if an ideal agent refuses free information, they are incoherent. For non-ideal agents, it serves as a benchmark to measure *how* and *why* they deviate (e.g., computational cost, emotional utility). It is substantive only in the sense that logic is substantive: it rules out contradictions, but it does not dictate content.

  ### What Both Are Missing
  Both Marcus and Lena overlook two critical dimensions where the theorem fails even for idealized agents in interactive settings:

  1.  **Computational Complexity:** Good's theorem assumes *costless* information, which includes costless *processing*. For any agent with bounded computational resources, acquiring information can have negative net value if the cost of updating the posterior exceeds the expected gain in decision quality. The theorem assumes logical omniscience.
  2.  **Strategic Commitment (Game Theory):** In multi-agent settings, information can be strictly harmful even for an expected-utility maximizer. If knowing a fact prevents you from making a credible threat or promise (e.g., Parfit's Hitchhiker, Toxin Puzzle, or negotiation scenarios), an ideal agent might rationally prefer ignorance to preserve a strategic advantage. Good's theorem applies to single-agent decision problems against "Nature"; it does not hold in games where information alters other agents' beliefs about your type or commitments.
