answer: |-
  # HANDOUT: The Three-Article Trap
  **A Taxonomy of Self-Amendment Positions**

  **The Scenario:**
  Imagine a Constitution with only three articles.
  *   **Article 1:** Creates a "Council."
  *   **Article 2:** Lists Basic Rights.
  *   **Article 3:** Can be amended by simple majority vote. **However**, any amendment to Article 3 *automatically* rewrites Article 1 to give the Council veto power over all *future* amendments.

  **The Test Case:**
  The Majority passes **Amendment 1** (changing Article 3). This triggers the Council's Veto power (changing Article 1).
  Immediately after, the Majority tries to pass **Amendment 2**. The Council exercises its new Veto.
  *   **Question:** Does Amendment 2 pass? Does the system hold? Or does the authority vanish?

  ---

  ## THE DECISION TREE

  ### START: Can a legal system contain a rule that coherently authorizes its own change without any external authority?

  *   **NO.** (The concept is incoherent; authority must come from outside the text.)
      *   → **Leaf: The External Sovereign**
      *   **Diagnosis:** The Constitution is just paper. Whether Amendment 2 passes depends entirely on who has the guns, not the text. The "Veto" is a fiction.
      *   **Outcome:** **Collapse/Contest.** (Law dissolves into power struggle).

  *   **YES.** (The text can generate its own validity.)
      *   → **GO TO BRANCH 1**

  ---

  ### BRANCH 1: Is the primary obstacle to this coherence Logical (a contradiction in validity) or Practical (a contest of power)?

  *   **LOGICAL.** (The problem is that a rule cannot validate its own destruction/alteration without creating a paradox.)
      *   → **GO TO BRANCH 2A**

  *   **PRACTICAL.** (The logic is fine; the problem is ensuring the actors actually obey the new rule.)
      *   → **GO TO BRANCH 2B**

  ---

  ### BRANCH 2A (Logical Path): Does mediating the reference through a separate meta-rule solve the paradox, or does it just push the self-reference up one level?

  *   **SOLVES IT.** (A higher-order norm validates the transition from Old Art 3 to New Art 3.)
      *   → **Leaf: The Hierarchicalist**
      *   **Diagnosis:** The system stabilizes because the "rule of recognition" shifts cleanly.
      *   **Outcome:** **Stabilizes.** (Council Veto holds; Amendment 2 fails).
      *   **⚠️ FLAG:** *Indistinguishable from "The Institutional Delegate" (Branch 2B) in this specific scenario.* Both result in the Veto holding, though one claims it's due to logic and the other due to procedure.

  *   **PUSHES IT UP.** (The meta-rule also needs authorization, leading to infinite regress.)
      *   → **Leaf: The Regressivist**
      *   **Diagnosis:** Every amendment requires a higher permission slip that doesn't exist.
      *   **Outcome:** **Infinite Loop.** (Authority oscillates; Amendment 2 is neither valid nor invalid, just undecidable).

  *   **[EMPTY SPACE]** (Claim: The paradox is logical, but no meta-rule is needed.)
      *   **Diagnosis:** This space is weird; if it's a logical contradiction, you can't solve it by ignoring the structure.
      *   **Outcome:** **Logical Vacuum.** (Amendment 1 is void ab initio; Majority wins Amendment 2 because Council never legally existed).

  ---

  ### BRANCH 2B (Practical Path): Does a procedural mediator (like a Court or Clerk) settle the power shift, or just become another player in the fight?

  *   **SETTLES IT.** (The mediator successfully enforces the transition from Majority Rule to Council Veto.)
      *   → **Leaf: The Institutional Delegate**
      *   **Diagnosis:** Power was successfully delegated; the procedure locks in the change.
      *   **Outcome:** **Stabilizes.** (Council Veto holds; Amendment 2 fails).
      *   **⚠️ FLAG:** *Indistinguishable from "The Hierarchicalist" (Branch 2A) in this specific scenario.* Both yield the same result (Veto holds), making them empirically identical in the Three-Article Trap.

  *   **ANOTHER PLAYER.** (The mediator is just another faction; who watches the watchmen?)
      *   → **Leaf: The Realist**
      *   **Diagnosis:** The "Veto" is just a threat; the Majority will ignore it if they have the votes.
      *   **Outcome:** **Collapse.** (Amendment 2 passes by force; Constitution is effectively dead).

  ---

  ## SUMMARY OF OUTCOMES (For Discussion)

  | Position | What happens to Amendment 1? | What happens to Amendment 2? | System Status |
  | :--- | :--- | :--- | :--- |
  | **External Sovereign** | Irrelevant | Decided by force | **Collapse** |
  | **Hierarchicalist** | Valid | **Vetoed** | **Stabilizes** |
  | **Institutional Delegate** | Valid | **Vetoed** | **Stabilizes** |
  | **Regressivist** | Valid (but shaky) | Undecidable | **Infinite Loop** |
  | **Logical Vacuum** | **Void** | **Passes** (No Veto exists) | **Reset** |
  | **Realist** | Valid (on paper) | **Passes** (Veto ignored) | **Collapse** |

  **Discussion Note:** Notice that the *Hierarchicalist* and the *Institutional Delegate* end up in the exact same place. In a real court case, how would you tell them apart? Does it matter if the Judge says "The logic requires it" vs "The procedure dictates it"? Or is that just window dressing for the same power move?
