prompt: |-
  hey — putting together something like a long memo on secession for a group that's advising a constitution-drafting process, and before I write any of it I want the spec. Not "should Catalonia be allowed to leave" — I want the requirements list: what would a theory of secession have to deliver to be good enough to actually be written into law, i.e. administrable by an electoral commission and a constitutional court, not just defensible in a journal?

  Concretely: it has to resolve, before the vote happens, who the demos is, what territory is on offer, what the threshold is, and what happens to the bits that vote against. So give me desiderata that bite under that constraint, with the case behind each.

  Cases I want requirements anchored to, at least loosely: Scotland, Quebec, Catalonia — plus the awkward ones: a holdout county that votes to stay but is geographically stuck to the new state; an enclave or exclave; a region whose departure would leave the rump state economically or militarily non-viable; a diaspora that identifies with the nation but doesn't live there; a subgroup that wants to seceed from the secession and maybe rejoin the parent state; a secession that succeeds or fails purely on whether other states recognise it; and a "nation" with no thick shared culture that just wants out over fiscal transfers.

  Things I specifically want you to think through rather than assume:

  - the franchise–territory circularity: who gets to vote depends on what unit is seceding, but what unit secedes is supposed to be settled by who votes. Does any theory actually break that circle, or does every one of them smuggle in a prior answer about the unit (usually an existing administrative border)?
  - the reiteration / Russian-doll problem: whatever right you posit has to say what it says one scale down. Let the holdout secede from the secession and you get a regress; don't let it and you've denied the holdout the exact right you just asserted. Which horn is less bad, and why?
  - the veto-holder question: does the rump state's population get a say (defence, debt, shared infrastructure, transfers)? If yes, secession collapses into a grant; if no, into a unilateral right.
  - the trigger/authority split: who may authorise a referendum, who has the right to secede, and what counts as a legitimate grievance (remedial-only vs. any democratic will) are three different questions. Keep them apart and say which one a given theory is actually a theory of.
  - the serial-referendum problem: what's the shelf life of a lost vote, and of a won one? Anything that says "the demos decides" owes an answer about a demos that changes its mind, or one that was panicked, bribed, or badly misinformed.

  Also mark which requirements are non-negotiable and which are just preferences of one camp (nationalists, unionists, international lawyers, constitutional judges). Flag any pair I probably can't have together — my guesses are that "the demos draws its own boundaries" and "everyone materially affected gets a say" can't both hold, and that "no veto for the rump state" is in tension with "succession is settled in advance" (debt, treaties, UN seat, central bank) — but you tell me. And name the single requirement that knocks out the most popular theories; I suspect it's the holdout problem killing pure plebiscitary views, but I want your take.

  A short table scoring the three big families — remedial-right-only, plebiscitary/primary-right, and the negotiated-constitutionalist "you need the parent state's consent" view — is fine, but keep it to a few lines. Alot more than that and you're spending words on the wrong part; the criteria are the deliverable.

  At the end, say how confident you are in the list overall and single out the one requirement or claim you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested memo spec:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (requirements list) for a theory of secession suitable for constitutional drafting (administrable by courts/commissions), not just philosophical defense.
      *   **Tone:** Technical, legal-institutional, rigorous, avoiding normative fluff ("should Catalonia leave").
      *   **Key Constraints:** Must resolve *ex ante* questions: demos, territory, threshold, aftermath (holdouts, enclaves, viability).
      *   **Specific Cases to Anchor:** Scotland, Quebec, Catalonia + awkward edge cases (holdout counties, enclaves, economic non-viability, diaspora, sub-secession, recognition dependence, fiscal-only motivation).
      *   **Specific Concepts to Think Through:** Franchise-territory circularity, Reiteration/Russian-doll problem, Veto-holder question, Trigger/Authority split, Serial-referendum problem.
      *   **Output Requirements:** Mark non-negotiable vs. preference, flag incompatible pairs, identify the "theory-killer" requirement, score the three big families (Remedial, Primary, Negotiated), state confidence level, and identify the least sure claim.

  2.  **Deconstruct the Core Tension:**
      *   The user is asking for *administrability*. Philosophy often waves hands at "the people decide." Law needs to know *which* people and *where*.
      *   The central paradox is the "Boundary Problem" (who decides the demos?). If the demos decides the boundary, it's circular. If the boundary decides the demos, it's arbitrary (usually status quo admin borders).
      *   The "Russian Doll" problem is the second hardest: If self-determination is a right, why can't a sub-region exercise it against the new state?

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to formulate these as requirements for a *legal framework*, not moral arguments.
      *   *Requirement 1: The Unit Definition.* Must break the circularity. Likely needs to rely on existing administrative boundaries (NUTS regions, provinces) to be administrable, even if theoretically imperfect.
      *   *Requirement 2: The Franchise.* Who votes? Residents? Citizens? Diaspora? Needs to be distinct from the boundary question but aligned.
      *   *Requirement 3: The Threshold.* Simple majority? Supermajority? Dual majority (region + rump)?
      *   *Requirement 4: The Reiteration Constraint.* Must address sub-secession.
      *   *Requirement 5: The Viability Constraint.* Economic/military viability.
      *   *Requirement 6: The Settlement Mechanism.* Debt, assets, treaties.
      *   *Requirement 7: The Temporal Constraint.* Shelf life of votes.

  4.  **Addressing the Specific "Think Through" Points:**
      *   *Franchise-Territory Circularity:* Acknowledge that pure theory fails here. The spec must mandate a "Default Unit" (existing admin border) to break the loop.
      *   *Russian-Doll:* This is the killer. A workable spec must forbid immediate sub-secession or impose a high bar (time delay + viability).
      *   *Veto-Holder:* Distinguish between *right to secede* and *terms of secession*. The rump shouldn't veto the *fact*, but must negotiate the *terms* (debt, borders).
      *   *Trigger/Authority:* Separate the *right* (constitutional clause) from the *trigger* (legislative vote vs. petition) from the *grievance* (remedial vs. primary).
      *   *Serial-Referendum:* Need a "cooling off" period (e.g., 10-15 years) to prevent instability.

  5.  **Identifying Incompatible Pairs & Theory Killers:**
      *   *Incompatible:* "Unilateral Right to Secede" + "Guaranteed Economic Viability of Rump." You can't have both. If the rich region leaves, the rump suffers.
      *   *Incompatible:* "Self-Determination for All" + "Stable Borders."
      *   *Theory Killer:* The **Reiteration (Russian-Doll) Constraint**. Pure plebiscitary theory collapses here. If any group can vote to leave, governance becomes impossible. Remedial theory handles this better (only if oppressed), but is hard to administer.

  6.  **Scoring the Three Families:**
      *   *Remedial:* Good for stability, bad for admin (who defines oppression?).
      *   *Primary (Plebiscitary):* Good for democracy, bad for stability/borders (Russian Doll).
      *   *Negotiated (Constitutionalist):* Best for admin, worst for rights (status quo bias).

  7.  **Refining the Output Structure:**
      *   Start with the Objective.
      *   List the Desiderata (categorized).
      *   Mark Non-Negotiable vs. Preference.
      *   Flag Incompatible Pairs.
      *   Identify the Theory Killer.
      *   The Table.
      *   Confidence & Uncertainty.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the diaspora? *Adjustment:* Add a specific line on franchise eligibility regarding non-residents.
      *   *Check:* Did I address the holdout county? *Adjustment:* This falls under the Reiteration/Boundary constraint. The spec must decide if borders are immutable post-vote or adjustable. Immutable is more administrable.
      *   *Check:* Is the tone right? *Adjustment:* Ensure it sounds like a legal brief/spec, not a political science essay. Use words like "justiciable," "administrative unit," "threshold."
      *   *Check:* Did I answer the "confidence" prompt? *Yes, need to add at the end.*
      *   *Check:* The "Trigger/Authority split." *Make sure to explicitly separate the right to initiate from the right to succeed.*

  9.  **Final Polish:**
      *   Ensure the "Theory Killer" is clearly argued. The Russian Doll problem is indeed the strongest critique of primary right theory in a legal context.
      *   Make sure the "Non-negotiable" items are truly about *functionality* (can a court run this?), not morality.

  **(Self-Correction on the "Theory Killer"):** The user suspects the holdout problem kills plebiscitary views. I agree, but I should refine it. It's not just the holdout; it's the *infinite regress*. If a county can hold out, a neighborhood can. The spec must cut this off. I will label this the "Reiteration Constraint."

  **(Self-Correction on "Viability"):** Can a court judge "economic viability"? That's highly non-justiciable. I need to flag that as a "Preference" or "Political Question" rather than a strict legal requirement, or else the Court becomes a super-legislature. I will mark "Viability Assessment" as a tension point.

  10. **Finalizing the Text:** (Proceeding to generate response based on these thoughts.)
answer: |-
  **MEMORANDUM SPECIFICATION: OPERATIONALIZING SECESSION CLAUSES**

  **TO:** Constitutional Drafting Committee
  **SUBJECT:** Functional Requirements for a Justiciable Secession Framework
  **OBJECTIVE:** Define the necessary conditions for a secession theory to be administrable by an Electoral Commission and Constitutional Court, avoiding political question doctrines.

  ---

  ### I. CORE DESIDERATA (THE SPEC)

  To be codified, a theory of secession must resolve the following five variables *ex ante*. If the text leaves these to post-hoc negotiation, the clause is non-justiciable and functionally void.

  #### 1. The Boundary Definition (Breaking the Circularity)
  *   **Requirement:** The voting unit must be pre-defined by existing administrative borders (e.g., NUTS-2 regions, provinces, states).
  *   **Rationale:** The "Franchise–Territory Circularity" cannot be solved philosophically in a courtroom. A court cannot draw a map based on "cultural affinity." It must rely on status quo administrative lines to determine who votes and what land is on offer.
  *   **Constraint:** No petitioning to redraw the secession boundary *during* the referendum process.
  *   **Status:** **Non-Negotiable** (for administrability).

  #### 2. The Reiteration Constraint (Solving the Russian-Doll)
  *   **Requirement:** A successful secession creates a new constitutional border that is immune to immediate sub-secession claims for a fixed period (e.g., 20 years). Sub-units (counties/holdouts) do not retain an automatic right to opt-out of the new state.
  *   **Rationale:** If the right to secede applies recursively, governance collapses into infinite regress. The spec must privilege the *first-order* secession unit over internal sub-units to ensure the new state is viable.
  *   **Status:** **Non-Negotiable** (for state viability).

  #### 3. The Franchise Eligibility (The "Who")
  *   **Requirement:** Voting rights are tied to *residency* within the defined unit, not ethnic nationality or diaspora status.
  *   **Rationale:** Including a diaspora (e.g., Scots in London, Catalans in Latin America) renders the electorate unadministrable and subject to external manipulation. Excluding residents (e.g., non-citizen long-term residents) violates democratic norms of affected interests.
  *   **Status:** **Preference** (International Law/Unionist bias). Nationalists will demand diaspora inclusion; Administrators will demand residency.

  #### 4. The Viability Threshold (The "Cost")
  *   **Requirement:** The secession proposal must include a binding plan for debt division, asset splitting, and citizenship that guarantees the *rump state's* continued solvency and treaty compliance.
  *   **Rationale:** Addresses the "Veto-Holder Question." If the rump state is left economically non-viable or militarily exposed, the secession functions as an act of aggression, not self-determination.
  *   **Status:** **Preference** (Unionist/International Lawyer bias). Pure Primary Right theorists argue viability is irrelevant to the right itself.

  #### 5. The Temporal Lock (The Serial-Referendum Problem)
  *   **Requirement:** A failed referendum imposes a mandatory cooling-off period (e.g., 15 years) before a new petition can be filed. A successful referendum creates an irreversible mandate for a fixed implementation window.
  *   **Rationale:** Prevents perpetual instability and "buyer's remorse" volatility. A demos cannot be allowed to change its mind indefinitely without collapsing the legal order.
  *   **Status:** **Non-Negotiable** (for legal certainty).

  ---

  ### II. INCOMPATIBLE PAIRS (TRADE-OFFS)

  You cannot maximize all values. The drafting committee must choose between these tensions:

  1.  **"The Demos Draws Its Own Boundaries" vs. "Administrative Clarity"**
      *   *Conflict:* If the secessionists define the territory based on "national sentiment," the Court cannot adjudicate the border. If the Court uses admin borders, it may split the "nation."
      *   *Resolution:* You must sacrifice the first for the second to have a justiciable clause.

  2.  **"No Veto for Rump State" vs. "Settled Succession Terms"**
      *   *Conflict:* If the seceding region has a unilateral right to leave (no veto), the rump state cannot force terms on debt/assets. If the rump state has veto power over terms, the right to secede is illusory.
      *   *Resolution:* A "Unilateral Right to Trigger, Negotiated Terms to Exit" model is the only stable middle ground, but it invites deadlock.

  3.  **"Remedial Justification" vs. "Objective Adjudication"**
      *   *Conflict:* A remedial right (secession only if oppressed) requires the Court to judge political oppression. This politicizes the judiciary.
      *   *Resolution:* Primary right theories avoid this but invite the Russian-Doll problem.

  ---

  ### III. THE THEORY KILLER

  **The Reiteration (Russian-Doll) Constraint.**

  *   **Why:** This is the single requirement that knocks out the most popular theories.
  *   **Impact on Plebiscitary/Primary Right Theory:** Pure plebiscitary theory holds that "any people can choose their fate." If a county within the seceding region votes to stay, a consistent primary-right theory must allow them to secede from the secession. If you deny them this, you have contradicted the principle that justified the original secession. If you allow it, you make the new state's borders impossible to draw.
  *   **Impact on Remedial Theory:** Survives better here. If the sub-region is not oppressed, it has no right to secede, even if the larger region does. However, this requires the Court to measure "oppression" at two different scales, which is administratively nightmarish.
  *   **Impact on Negotiated/Constitutionalist:** Survives easily. The parent state consents to the top-level secession but retains sovereignty over sub-units.

  ---

  ### IV. COMPARATIVE SCORECARD

  | Feature | **Remedial-Right-Only** (e.g., International Law standard) | **Plebiscitary/Primary-Right** (e.g., Pure Democratic Theory) | **Negotiated-Constitutionalist** (e.g., Canada/UK model) |
  | :--- | :--- | :--- | :--- |
  | **Administrability** | **Low.** Courts must judge "oppression" or "human rights violations," which are political questions. | **Medium.** Clear vote count, but fails on boundary and reiteration constraints. | **High.** Relies on existing legislative procedures and negotiation mandates. |
  | **Stability** | **High.** High bar to trigger prevents frequent votes. | **Low.** Encourages serial referendums and sub-secession claims. | **High.** Status quo bias prevents fragmentation. |
  | **Democratic Legitimacy** | **Low.** Denies exit even if majority wills it, absent abuse. | **High.** Respects raw democratic will. | **Medium.** Respects will only if procedural hurdles are cleared. |
  | **Verdict** | **Fail.** Too vague for constitutional text. | **Fail.** Collapses under Russian-Doll problem. | **Pass.** Only model compatible with legal finality. |

  ---

  ### V. CONFIDENCE & UNCERTAINTY

  **Overall Confidence:** **High (85%)** on the structural constraints (Boundaries, Reiteration, Time). These are derived from the logical requirements of statehood and legal finality.

  **Least Sure Claim:** **The Viability Threshold (Desideratum #4).**
  *   *Reasoning:* While logically necessary for the rump state's survival, it is the least justiciable. How does a Constitutional Court determine if a debt split renders the rump "non-viable"? This invites the Court to become a super-legislature assessing macroeconomic forecasts. It is a *political* necessity but a *legal* quagmire. Most constitutions that attempt this end up pushing it to "good faith negotiations," which returns us to the deadlock problem.

  **Recommendation:** Draft the clause as a **Primary Right to Trigger** (satisfying democrats) constrained by a **Negotiated Settlement Phase** (satisfying unionists) with a **Constitutional Default** (debt/assets split formula) if negotiations fail, to avoid the Viability Trap.
