answer: |-
  We must refuse to operate in the district unless the exclusion of girls over eleven is lifted. This decision aligns with our precedents on discrimination and access, specifically the caste triage and male guardian cases, where we intervened against practices that systematically excluded vulnerable subgroups from care based on identity rather than medical need. Those cases establish that we do not defer to local norms when they function as barriers to access for specific demographics, distinguishing them from the blood transfusion, scarification, and diagnosis precedents, which involved internal community decisions regarding the *nature* of treatment or consent rather than eligibility for it. The closest analog is the caste triage case, as both involve a partner or community authority ranking human worth to determine who receives care, thereby violating the core principle of non-discrimination. Choosing intervention commits us to the principle that patient autonomy and protection from discrimination outweigh community sovereignty when the latter is used to oppress a minority; choosing deference would commit us to utilitarianism and non-imperialism, prioritising the greatest volume of care and respecting local political structures even when they enforce inequality. The single fact that would most cleanly separate the rules of deference is whether the council's vote would have occurred absent the missionaries' campaign, as this distinguishes an internal consensus worthy of respect from an externally manufactured coercion that is not. The strongest case for the opposite decision rests on the nurses' utilitarian and anti-colonial argument: by withdrawing, we punish the very girls we wish to help by denying them any future access, whilst simultaneously depriving hundreds of other patients of care, effectively replicating the missionaries' imposition of foreign values by forcing our own ethical framework upon a community that has, on record, unanimously rejected it.
