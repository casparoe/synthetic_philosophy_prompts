  5.  **Exegesis vs. Substance:**

      *   In a medical room, exegesis (did Plato *really* say this?) matters less than substance (is this *true* or *safe*?). However, if the exegesis is wrong, the analogy collapses.
      *   *Judgment:* Substantive claims are more dangerous. If Plato said it but it kills people, the clinicians will reject it. If it saves people but Plato didn't say it, they might still listen.
      *   *Correction:* Actually, in a *humanities* seminar at a med center, bad exegesis makes you look like a dilettante. But bad clinical advice makes you look dangerous. I will weight Substance as higher risk because of the "rationalizing recovery" fear.

  6.  **Early Concessions (Credibility Purchase):**

      *   Acknowledge I am not a clinician.
      *   Acknowledge Plato is not a doctor.
      *   Acknowledge the mortality risk of alcohol.
      *   State clearly: This is about *moral psychology*, not *detox protocols*.

  7.  **The "Single Reply" (The Core):**

