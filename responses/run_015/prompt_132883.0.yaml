answer: |-
  This is a sophisticated puzzle that cuts to the heart of how we define the "currency" of justice. You are asking whether we can modify the prioritarian weighting function to account for dynamic institutional realities without surrendering the core non-relational commitment that shields prioritarianism from the leveling-down objection (LDO).

  Let's work through the logic of your two-period case and isolate the precise boundary where "distributive inertia" either saves prioritarianism or dissolves it into relational egalitarianism.

  ### 1. The Standard Prioritarian Defense
  First, let's lock down the baseline. Standard prioritarianism holds that the moral value of a benefit is a concave function of the recipient's absolute well-being. It matters more to benefit someone at level 40 than someone at level 80.
  *   **The LDO:** Egalitarianism implies that moving from (80, 40) to (50, 50) is in *one respect* good (equality increases), even though no one is better off. Prioritarianism says this move is simply bad. The loss to A (80→50) is not outweighed by the gain to B (40→50), because even with priority weighting, destroying well-being is never intrinsically valuable.
  *   **The Shield:** The shield is **non-relationality**. The moral weight depends only on $u_i$ (individual well-being), not on $u_i - u_j$ (the gap).

  ### 2. Introducing Distributive Inertia
  You propose adding a variable: **Institutional Inertia**.
  *   **Scenario:** Period 1 is (80, 40). Period 2 options are (50, 50) [Leveling Down] or (70, 55) [Policy].
  *   **The Inertia Claim:** Dropping A from 80 to 70 is morally costlier than a static calculation shows (institutional disruption). Raising B from 40 to 55 is morally more valuable than static calculation shows (correcting under-investment).

  The critical question is: **What generates the inertia?**
  To answer your question about the boundary, we must distinguish between two ways of modeling this inertia.

  #### Option A: Absolute Historical Baselines (Prioritarian)
  Here, the "inertia" is a function of A's past absolute level and B's past absolute level, independently.
  *   A's loss is weighted heavily because A had adapted to an absolute level of 80. The psychological or functional cost of losing that specific absolute capacity is high.
  *   B's gain is weighted heavily because B was at an absolute level of 40, which is below a threshold of sufficiency or capability stability.
  *   **Verdict:** This remains prioritarian. The weight depends on absolute facts about A and absolute facts about B. The fact that A is higher than B is irrelevant; only the absolute numbers matter.

  #### Option B: Relative Historical Disadvantage (Relational)
  Here, the "inertia" is a function of the *relationship* between A and B in Period 1.
  *   A's loss is costly because A was *privileged* relative to B.
  *   B's gain is amplified because B was *neglected* relative to A.
  *   **Verdict:** This collapses into relational egalitarianism. The moral weight now depends on the gap (80 vs. 40). If A had been at 80 and B at 79, the "under-investment" correction for B would vanish, even if B's absolute need remained the same.

  ### 3. The Refined Leveling-Down Challenge
  You asked if this helps answer a *refined* LDO: "Leveling down is acceptable if it occurs via institutional recalibration."
  Imagine the argument: "Moving to (50, 50) isn't just leveling down; it's dismantling an unjust structure that allowed A to be at 80 while B was at 40."

  If you adopt **Option B (Relative)**, you concede the point. You are admitting that the move to (50, 50) has positive moral value because it reduces the relational disparity, even if well-being drops. You have lost the prioritarian shield.

  If you adopt **Option A (Absolute)**, you can resist the refined LDO. You argue:
  1.  The move to (50, 50) destroys the institutional stability A relied on (cost).
  2.  It fails to maximize the priority-weighted gain for B (since 55 is better for B than 50).
  3.  The "unjust structure" is only bad insofar as it kept B at 40 (absolute bad), not because A was at 80 (relative bad).

  Therefore, the (70, 55) outcome is strictly superior to (50, 50) on prioritarian grounds, even with inertia. The "recalibration" to 50/50 is just a loss of total weighted well-being disguised as structural reform.

  ### 4. The Precise Boundary
  The boundary between (a) dynamic prioritarianism and (b) relational egalitarianism lies in **the source of the normative force.**

  *   **Boundary Condition:** Does the institutional history matter because it affects **individual functioning** (Prioritarian) or because it constitutes **social standing** (Relational)?
  *   **The Test:** Imagine a Robinson Crusoe case. If A and B are on separate islands with no knowledge of each other, does "distributive inertia" still apply?
      *   If **Yes**: It is prioritarian. A's adaptation to 80 is an internal fact about A.
      *   If **No**: It is relational. The inertia only matters because A's 80 was socially sustained in contrast to B's 40.

  In your specific formulation, you mentioned institutions "calibrated themselves to an existing baseline." If that calibration is defined as "expectations formed by absolute past consumption," you are safe. If it is defined as "entitlements formed by past share of social product," you have crossed the line.

  ### 5. The Conceptual Cost
  You asked what a consistent prioritarian must pay to maintain this boundary. The cost is high, and it comes in three forms:

  **1. The Reductionist Burden**
  To stay prioritarian, you must reduce all "institutional" facts to "individual well-being" facts. You cannot say "The institution is unstable." You must say "Individual A experiences psychological distress due to institutional instability."
  *   *The Cost:* You must deny that institutions have any moral status independent of their impact on individual welfare. This makes the view vulnerable to the critique that it ignores the *structural* nature of injustice. If the injustice is in the *relation* (e.g., domination), prioritarianism struggles to name it without reducing it to a feeling of distress in the dominated.

  **2. The Historical Blind Spot**
  Standard prioritarianism is often synchronic (evaluating states of affairs). By introducing inertia, you are making the view diachronic (history-sensitive).
  *   *The Cost:* You must explain why past absolute levels matter morally. If prioritarianism is consequentialist, only future well-being should matter. To count "loss of inertia," you must argue that breaking expectations *causes* future well-being loss. If you argue it matters because of *fairness* regarding past expectations, you are smuggling in a deontological constraint that looks very much like a relational claim to "equal respect."

  **3. The "Leveling" Blind Spot**
  This is the steepest cost. In your scenario, the move to (50, 50) might be demanded by justice if the 80/40 split was the result of oppression, not just bad luck.
  *   *The Cost:* A strict prioritarian with absolute inertia must oppose the move to (50, 50) if (70, 55) is available. But what if (70, 55) preserves the *oppressive structure* while (50, 50) dismantles it?
  *   To maintain the boundary, the prioritarian must claim that the "oppressive structure" is only bad because it keeps B at 40. If B is at 55, the structure is fine. A relational egalitarian would say the structure is bad because it creates hierarchy, even at (70, 55).
  *   *The Payment:* The prioritarian must accept that hierarchy is not intrinsically bad. They must be willing to endorse a society with steep hierarchies (70 vs 55) over a flatter one (50 vs 50), even if the flatter one was achieved by dismantling a "calibrated" system of privilege. They must insist that the *loss of privilege* for A is not a moral gain, even if it restores civic parity.

  ### Conclusion
  Injecting distributive inertia *can* help prioritarianism answer the refined leveling-down challenge, but only if you rigorously define inertia as **absolute adaptive capacity** rather than **relative entitlement**.

  The boundary is this: **Does the weight change because the person is worse off than they *were* (Absolute/Prioritarian), or because they are worse off than *others* (Relative/Relational)?**

  To maintain this, the prioritarian pays the conceptual cost of **structural agnosticism**. They must treat the "institutional recalibration" downward to (50, 50) as a pure loss of well-being, denying that the destruction of the hierarchy itself carries any independent moral value. They save the theory from the LDO, but only by insisting that equality is never a *good*, only a possible *byproduct* of maximizing priority-weighted well-being. If the "refined" LDO argues that destroying the hierarchy *is* a good, the prioritarian must simply deny it, even if that makes the view seem blind to the moral significance of social status.
