          *   To maintain the boundary, the prioritarian must argue that "inertia" is simply a multiplier for *utility loss*, not a independent moral variable.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to confuse "prioritarianism" with "utilitarianism." Prioritarianism weights benefits. If inertia changes the weight, is it still prioritarian? Yes, as long as the weight tracks absolute well-being (or absolute historical well-being), not relative gaps.
