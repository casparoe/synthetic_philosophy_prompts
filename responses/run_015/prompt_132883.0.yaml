      *   **Leveling-Down Objection (LDO):** Egalitarianism implies it's good in at least one way if everyone is made equal, even if no one is better off (e.g., blinding the sighted). Prioritarianism avoids this because lowering the well-off adds negative value (loss of well-being) without offsetting priority-weighted gain.
      *   **The User's "Refined LDO":** Leveling down via institutional recalibration. Instead of just blinding the sighted, we dismantle the institutions that support high well-being, dragging everyone to a lower, equal baseline.
      *   **Distributive Inertia:** A modifier to the priority weighting function. Weight = $f(\text{well-being}, \text{institutional history})$.
