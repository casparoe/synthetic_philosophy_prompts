      *   *Attempt 2 (Trust):* $p$ = "My friend is loyal." $C$ = "Trusting him strengthens our bond."
          *   *Critique:* Is $C$ a WKR for belief? Yes. Is it RKR for trust? Plausible. But trust often implies belief. If I don't believe he's loyal, can I trust? This might collapse into belief.
      *   *Attempt 3 (Fear):* $p$ = "The bridge is unsafe." $C$ = "Being afraid keeps me alert."
          *   *Critique:* Fear usually requires belief (or high credence) of danger. If the bridge is safe, is fear fitting? No. So $C$ doesn't make fear fitting.
      *   *Attempt 4 (Acceptance/Assumption for Practical Reasoning):* $p$ = "The plan will work." $C$ = "We need to proceed to avoid paralysis."
          *   *Critique:* Acceptance isn't always treated as a propositional attitude with truth-conditions in the same way. Might be too technical.
      *   *Attempt 5 (Faith/Trust in a Relationship context):* Let's try a relational attitude where the *act* of holding the attitude contributes to the truth or value, without being evidence.
      *   *Attempt 6 (Hope in a Team Context):* $p$ = "We can finish this project on time." $C$ = "My morale boosts the team's actual chances."
          *   *Critique:* This is self-fulfilling. If $C$ makes $p$ more likely, is it evidence? If my morale *causes* success, then "I am morale-boosted" is evidence that success is more likely. This blurs the WKR/RKR line for belief. We need $C$ to *not* be evidence for $p$.

      *   *Refining the "Non-Evidential" Constraint:* The consideration must not make $p$ more likely to be true.
      *   *Refining the "RKR for Other Attitude" Constraint:* The consideration must make the other attitude *fitting* or *correct*, not just beneficial.
      *   *Idea:* **Gratitude**? No, factive. **Regret**? Factive.
      *   *Idea:* **Hope** is the strongest candidate for non-factive attitudes where pragmatic considerations matter. But standard views say hope requires $p$ be possible but not certain.
      *   *Idea:* **Trust** (as distinct from belief). O'Hagan, Holton, etc. Trust involves a "leap" where the reason for trusting is the relationship itself.
      *   *Let's try a specific scenario:* A parent and a troubled child.
      *   $p$: "My child will turn their life around."
      *   $C$: "My child needs to see I am on their side to actually turn their life around." (Wait, this makes $C$ evidence).
      *   *Let's try:* $C$: "It is part of my role as a parent to stand by them."
      *   *Attitude 1:* Belief. $C$ is not evidence of truth. WKR.
      *   *Attitude 2:* **Loyalty** (or Commitment). Is loyalty a propositional attitude? "I am loyal to the proposition that..."? A bit awkward.
      *   *Attitude 2:* **Hope**. Does role-duty make hope fitting?
      *   *Attitude 2:* **Optimism** (as a stance).
      *   *Let's go with **Trust** in a collaborative setting.*
