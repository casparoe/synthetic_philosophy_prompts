      *   *This is the crux.* The prompt wants me to argue the distinction lives in the correctness conditions. So I must assume Trust has a different correctness condition than Belief.
      *   *Is this contested?* Yes. Many say Trust entails Belief.
      *   *Can I find an attitude where the non-truth condition is less contested?*
