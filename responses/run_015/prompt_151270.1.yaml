  **The Case**

  Elena sits in the oncologist's office reviewing her chart: the remission rate for her specific condition is ten percent with the current protocol, making the proposition *p* ("I will be cured") objectively unlikely to be true. Despite this, she fixates on consideration *C*: "Being cured means I can walk my daughter down the aisle." *C* does not alter the statistical probability of *p*, nor does it constitute evidence that *p* is true, yet Elena finds her hope that *p* sustained and intensified by *C*, even while she withholds belief that *p*. She acknowledges *C* gives her no ground to think *p* is true, but she refuses to abandon the stance that *p* will obtain, citing *C* as why maintaining this stance matters.

  ***

  **The Check**

  **1. The Attitudes and Consideration**
  *   **Attitude 1:** Belief that *p* ("I will be cured").
  *   **Attitude 2:** Hope that *p* ("I will be cured").
  *   **Consideration *C*:** The value of the outcome (walking her daughter down the aisle).

  **2. Correctness Conditions (Assumed)**
  *   **Belief:** Aims at **Truth**. A belief is correct (fitting) if and only if *p* is true. The standard for *holding* belief is sensitivity to evidence of truth.
  *   **Hope:** Aims at **Possibility + Value**. A hope is correct (fitting) if and only if *p* is possible (non-zero probability) and *p* is good (valuable).

  **3. The Verdicts**
  *   **For Belief:** *C* bears on the *value* of *p*, not the *truth* of *p*. Since Belief's correctness condition is Truth, *C* fails to bear on the condition that makes Belief correct. It is a **Wrong Kind of Reason**.
  *   **For Hope:** *C* bears directly on the *Value* component of Hope's correctness condition. Since *p* is already possible (10% > 0), *C* completes the set of conditions required for Hope to be fitting. It is a **Right Kind of Reason**.

  **4. The Working Feature**
  The feature doing the work is the **constitutive aim** of the attitude. The distinction between RKR and WKR is not intrinsic to *C* (which remains constant) but is determined by whether *C* bears on the specific correctness condition (Truth vs. Value) constitutive of the attitude in question.

  **5. Counterfactuals**
  *   **Delete the Feature:** If you delete the "Value" condition from Hope's correctness conditions (reducing Hope to mere "expectation of possibility"), *C* ceases to be a RKR for Hope. It becomes a WKR for Hope just as it is for Belief, because *C* would no longer bear on Hope's fittingness.
  *   **Swap the Attitude:** Swap Hope for **Fear** with content *p*\* ("I will suffer chronic pain"). Let *C*\* be "Chronic pain would prevent me from working." *C*\* is a WKR for Belief (doesn't make pain likely) but a RKR for Fear (establishes the Badness condition required for Fear's fittingness). The verdict holds because the aim shifts from Truth to Badness.

  **6. The Objection (Monism/Anti-Normativism)**
  *   **The "One Kind of Reason" Objection:** A reason monist (e.g., a pragmatic encroacher or a reductionist) might argue that *C* is simply a reason to *manage* the attitude, not a reason *for* the attitude. They would say: "*C* is a reason to *cultivate* hope, but hope itself is just a combination of desire and belief. Therefore, *C* is really just a reason for Desire, and there is no sui generis 'Hope' attitude with its own correctness conditions to receive RKRs."
  *   **The "No Correctness" Objection:** An anti-normativist might deny that Hope has a correctness condition at all, viewing it as a non-evaluative psychological state. If Hope has no aim, the RKR/WKR distinction collapses for Hope, leaving *C* as merely a causal explanation, not a normative reason.

  ***

  **Settled vs. Contested**

  *   **Settled (Relatively):** It is largely consensus that **Belief** aims at truth and that evidence is the RKR for belief. The "cash for belief" case is the standard intuition pump here.
  *   **Contested (The Lean):** This case leans heavily on the claim that **Hope** has a normative correctness condition (Fittingness) distinct from Belief.
      *   *Contestation 1:* Many orthodoxy views (e.g., Bovens, Pettit) analyze Hope as a composite of Belief (that *p* is possible) and Desire (for *p*). If Hope is just a composite, reasons for Hope reduce to reasons for Belief and Desire. On this view, *C* is a RKR for *Desire*, but only derivatively for Hope. My argument requires Hope to be a sui generis attitude with its own normative profile.
      *   *Contestation 2:* The "Value" condition for Hope. Some argue Hope only requires Possibility + Desire. If "Desire" is the condition, *C* (Value) justifies the Desire, not the Hope directly. I am assuming a "Fitting Hope" view (e.g., D'Arms & Jacobson) where the *goodness* of *p* makes Hope fitting, independent of the agent's actual desire.
  *   **Least Confident:** I am least confident that the "Value" condition for Hope is robust enough to carry the weight of a RKR without collapsing into a reason for Desire. If the session participants are reductionists about the propositional attitudes, this case will look like a category error. However, for the specific purpose of arguing that the WKR/RKR distinction lives in the *attitude's aim*, this vulnerability is actually useful: it forces the room to defend the individuation of attitudes.
