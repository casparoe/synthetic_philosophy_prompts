      *   *Key Ambiguity:* What counts as "active harm"? What counts as "baked in"?

  3.  **Brainstorm Defeaters (Counter-arguments/Cases):**

      *   *Category 1: The "Structural Scar" Problem (Entangled Harm).*
          *   Example: Confederate statues. Slavery is gone, but systemic racism remains. Is the statue *causing* the racism or just *reflecting* it? If it reinforces the ideology that underpins the structure, is that active harm?
