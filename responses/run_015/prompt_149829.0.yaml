      *   *Category 2: The "Symbolic Power" Problem.*
          *   Statues aren't just records; they are honorifics. Keeping a statue of a genocidal colonialist might signal to indigenous people that the state still values that legacy, causing psychological harm/alienation *now*, even if the specific laws are gone.
          *   Severity: Medium-High. Challenges the idea that "just old crimes" are harmless.

      *   *Category 3: The "Slippery Slope/Line Drawing" Problem.*
