answer: |-
  This is a sophisticated, consequentialist framework for public memory. It moves away from "virtue signaling" (was this person good?) to "harm reduction" (does this symbol actively hurt people now?). It's pragmatic, but it rests on a sociological claim: that we can distinguish between *past* harm and *active* harm, and that statues are neutral unless they fuel the latter.

  Here is an honest audit of your "Active-Harm Only" rule, sorted by the severity of the defeater, followed by a direct answer to the unfalsifiability charge.

  ### 1. Fatal Defeaters (Philosophical & Logical)
  *These challenge the coherence of the rule itself. If these hold, the rule collapses or becomes meaningless.*

  **A. The Unfalsifiability Trap (The "No True Scotsman" Risk)**
  *   **The Defeater:** You asked this directly, and it is the biggest vulnerability. If "baked into living institutions" is defined loosely, the rule can justify anything.
      *   *Example:* A defender of a Confederate statue claims, "Segregation laws are gone; there is no active harm." A critic claims, "The statue reinforces the racial hierarchy that still defines our policing."
      *   *The Problem:* If you can always stretch the definition of "active harm" to include "cultural vibes" or "psychological discomfort," the rule demands the removal of almost everything. If you define it strictly as "current written law," it demands the removal of almost nothing.
      *   *Concession:* You must concede that without an **operational definition** of "active harm" (e.g., statistical disparity directly linked to the specific ideology the statue represents), this rule is just a intuition pump. It risks becoming a tautology: "Remove statues where removal is justified."

  **B. The Symbol *Is* The Institution**
  *   **The Defeater:** Your rule assumes a separation between the *statue* and the *institution*. But in political philosophy, public symbols are often considered part of the state's "expressive function."
      *   *The Argument:* If a city keeps a statue of a slaver, the city is actively expressing that this person is worthy of honor. That expression *is* an active policy. If that expression causes alienation or signals second-class citizenship to a minority group, the statue isn't just recording history; it is *performing* harm.
      *   *Concession:* You would have to concede that statues are not passive records. If you accept that state speech can constitute "active harm" (like hate speech laws), then the statue itself might be the "living institution" causing harm, regardless of whether the person's specific laws are still on the books.

  ### 2. Serious Defeaters (Sociological & Entangled)
  *These don't break the logic, but they make the application extremely difficult or counter-intuitive.*

  **A. The "Structural Scar" Problem (Repealed Policies)**
  *   **The Defeater:** You mention repealed policies leaving scars. This is the hardest line to draw.
      *   *Case:* Redlining was illegal decades ago. However, wealth gaps resulting from it are *current* economic patterns. If a street is named after the architect of that housing policy, is the harm "past" or "active"?
      *   *The Tension:* The policy is gone (past), but the *effect* is active (present). Your rule says "if the policy's still enforced." But if the *effect* persists because of the policy's historical momentum, keeping the name might feel like endorsing the mechanism that broke the economy.
      *   *Concession:* You would need to tweak "active" to mean "active *effects*" rather than "active *laws*." If you do that, the scope of removal expands massively, potentially overwhelming your "anti-vandalism" goal.

  **B. The "Chilling Effect" on Participation**
  *   **The Defeater:** Even if no law hurts Group X, the presence of a statue of their oppressor in a civic square may actively deter them from participating in democracy (voting, attending town halls, joining the police force).
      *   *The Argument:* This is a measurable, present-tense harm caused by the statue's presence. It changes current behavior.
      *   *Concession:* Under your rule, if you can prove the statue causally reduces civic participation *now*, you must remove it. This turns the debate into a sociological study rather than a historical one.

  **C. The "Founders" Paradox (Ubiquity of Harm)**
  *   **The Defeater:** Many figures foundational to modern liberal democracies (Washington, Jefferson, Churchill) presided over systems (slavery, colonialism) that have active, baked-in legacies (systemic racism, border disputes).
      *   *The Tension:* If "active harm" includes broad structural inequalities traceable to these figures, your rule demands the removal of the most common statues in the Western world.
      *   *Concession:* You would have to introduce a **proximity clause**. Is the harm *directly* baked in by this specific figure, or are they just one node in a large system? If you don't add this, your rule leads to a "blank slate" approach you explicitly want to avoid.

  ### 3. Awkward Defeaters (Pragmatic & Epistemic)
  *These are manageable but create administrative headaches.*

  **A. The Epistemic Burden (Who Decides?)**
  *   **The Defeater:** Determining whether harm is "active" requires complex sociological data.
      *   *The Problem:* Does a statue of Columbus cause active harm to Indigenous people? Historians might say "yes, it erases genocide." Economists might say "no, it doesn't affect land rights."
      *   *Concession:* You concede that this rule transfers power from historians to sociologists and activists. It makes the status of a statue contingent on current political science data, which changes over time. A statue could be "safe" in 2020 and "harmful" in 2024 based on a new study. This creates instability.

  **B. The "Martyrdom" Effect**
  *   **The Defeater:** Removing a statue might create *more* active harm by radicalizing the group that supported the figure.
      *   *The Argument:* If tearing down a statue fuels a violent extremist movement, the removal itself causes active harm.
      *   *Concession:* Your rule is consequentialist, so you must weigh the harm of the statue against the harm of the removal. This could lead to the paradoxical conclusion: "This statue causes active harm, but we must keep it to prevent violence."

  ---

  ### Is This Unfalsifiable? (The Honest Assessment)

  **Yes, in its current formulation, it is highly vulnerable to unfalsifiability.**

  Here is why: The phrase "baked into living institutions" is doing too much heavy lifting.
  1.  **If "Institution" = Law:** The rule is falsifiable, but it protects almost everything (since few explicit laws today cite Confederate generals or Colonialists as legal authority).
  2.  **If "Institution" = Culture/Society:** The rule is unfalsifiable because "culture" is amorphous. You can always claim a statue "reinforces a culture of X," and there is no clear test to prove that wrong.

  **Is this a problem?**
  Yes. A rule that cannot be proven wrong is not a rule; it's a preference. If you can always redefine "baked in" to save the statue you want to save (or remove the one you want to remove), the rule adds no moral clarity. It just disguises your intuition as a principle.

  **How to Fix It (Operationalizing the Rule):**
  To save the view from being unfalsifiable, you need **proxies for active harm**. You would have to agree to remove the statue if:
  1.  **Specific Policy Link:** There is a current policy (zoning, policing, schooling) that directly references the figure's ideology.
  2.  **Measurable Deterrence:** Data shows the monument significantly reduces usage of the public space by specific demographics.
  3.  **State Endorsement:** The statue is located on the grounds of an institution the figure directly founded that still operates (e.g., a statue of a slave-owner on the lawn of a university they endowed).

  ### Summary of Concessions
  To hold this view honestly, you must concede:
  1.  **Symbols are Actions:** You cannot treat statues as passive history; they are active state speech. If state speech causes harm, your rule demands removal.
  2.  **Structural Harm Counts:** You cannot limit "harm" to written laws. If a repealed policy created a wealth gap that persists, and the statue honors the architect of that policy, the "active harm" condition is likely met.
  3.  **Instability:** You must accept that a statue's status might change as sociological understanding of "harm" evolves.

  If you are unwilling to concede that **symbolic alienation** counts as "active harm," your rule collapses into "Status Quo Bias." If you *are* willing to concede that, your rule becomes much more radical than it initially appears, likely demanding the removal of many figures currently considered "safe."
