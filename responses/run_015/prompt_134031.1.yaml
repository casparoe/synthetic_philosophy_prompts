answer: |-
  **The Scenario**
  In 1924, Blackwood Mill closed, triggering a violent riot. Wages had dropped below subsistence for six months, satisfying the threshold for collective unrest. However, violence erupted only after Foreman Hale publicly tore a petition on Tuesday, having privately promised review on Monday. Workers did not riot when wages fell, nor when closure was announced, but specifically when Hale's action redefined their Monday hope as deliberate deception. Records show economic conditions ripe for weeks, yet the spark occurred precisely when the promise became betrayal, marking the transition from endurance to uprising.

  **The Covering-Law Verdict**
  Under Hempel's deductive-nomological model, the riot is explained by subsuming it under a universal law: "When real wages fall below subsistence for duration X, collective violence occurs." The initial conditions (six months of sub-subsistence wages) are met. Therefore, the riot was nomologically expected. The specific timing of Hale's betrayal is irrelevant noise; the economic pressure guaranteed the outbreak eventually. The model successfully predicts the event's occurrence based on structural constraints. It declares the event explained because the outcome was deducible from the laws of labor economics. The specific sequence of Monday's hope and Tuesday's betrayal adds no explanatory power, as the economic inevitability renders the psychological nuance redundant. The explanation holds regardless of the specific interpersonal dynamics, satisfying the criterion of predictive potential.

  **The Narrative Verdict**
  Conversely, a narrative explanation argues the riot is unintelligible without the story of the petition. The event is not just an outbreak but a moral reaction to broken trust. The meaning of Monday's promise is fixed only by Tuesday's tearing; the beginning is understood through the end. This configuration explains why the violence happened then and not earlier. It renders the sequence meaningful rather than statistically probable. However, this account supports no counterfactuals; we cannot say what would happen if wages differed, only how this story coheres. It contains no disguised law about human behavior, only the internal logic of this specific betrayal. The explanation lies in the plot, not the pressure, satisfying the participants' need to understand the specific order of recognitions.

  **The Isolating Feature and Its Excision**
  The structural feature driving this divergence is the agents' retrospective reinterpretation of an earlier commitment. The workers' Monday hope becomes a grievance only after Tuesday's betrayal. If we excise this feature—if Hale simply rejected the petition without prior promise—the narrative collapses. There is no plot twist, only linear causation. Without this reinterpretation, the narrative account loses its explanatory force, becoming a mere chronicle. Simultaneously, the Covering-Law model remains unchanged; the economic conditions still predict the riot. This proves the narrative explanation relies entirely on the temporal configuration of meaning, not the physical conditions. The law ignores the reinterpretation; the story depends on it. The excision shows the narrative's fragility versus the law's robustness.

  **The Covering-Law Counterattack**
  A defender of the covering-law model attacks the narrative as mere redescription rather than explanation. They argue citing the "betrayal" labels the cause, not identifying the mechanism. Saying workers rioted because they felt betrayed restates the event psychologically, not deriving it from antecedent conditions. Unless betrayal links to a general law connecting insult to violence, the narrative offers understanding without explanation. It describes the event's contour but fails to demonstrate its necessity. Thus, the story is literary, not scientific.

  **Bottom Line**
  Laws predict the outbreak's inevitability; stories explain the timing's meaning. The archivist sees both truth and insufficiency. One captures the pressure, the other the pivot. For the novelist, this tension is the story: the gap between statistical certainty and lived experience. The law explains the fire; the narrative explains the specific spark.
