      The applicant proposes a 340-megawatt expansion of inference capacity on the site of a decommissioned aluminum smelter. The site is classified as previously disturbed land with existing interconnection infrastructure. This analysis evaluates potential moral loading under the Standard Mapping and Attribution Protocol, Revision 3 (SMAP-3). The currency of impact is the Sentience-Equivalent Unit (SEU).

