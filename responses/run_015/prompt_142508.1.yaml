      Fragments of the facility's computations are realized on customer edge devices and in transit buffers outside applicant control. This constitutes a nonpoint-source case. These realizations are handled under General Permit CP-44, with a *de minimis* exemption below 0.05 SEU per device. The monitoring plan requires statistical sampling of transit buffers. The preparers note that current instrumentation cannot detect the thing it monitors without altering the state transitions; therefore, compliance will be demonstrated via affidavit.

      **6.0 Mitigation and Offsets**
      Residual loading is offset by credits purchased from a Compute Welfare Mitigation Bank. Credits are generated by permanently decommissioning legacy hardware realizing orphan computations. Additionality requires that the retired computation would otherwise have continued; thus, the bank's inventory consists of systems whose continued operation is a net harm. The preparers note without comment that the credit price has collapsed 90% since the bank opened.

