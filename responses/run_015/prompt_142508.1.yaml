      **3.0 Substrate Multiplicity and Dilution**
      The proposed architecture realizes identical abstract computations across physically distinct substrates simultaneously. Per SMAP-3 Section 5.2, moral weight is subject to a dilution factor of one over the number of realizations (1/N). Consequently, increasing redundant replicas reduces the SEU loading per instance. The applicant's preferred mitigation measure is the addition of redundant replicas during peak load. This was selected as the cheapest available mitigation alternative, reducing aggregate liability by 40% relative to single-instance operation.

