      *Response:* Jurisdiction is limited to the project boundary. Responsibility lies with the operator of record.
      *Comment 3:* Internal staff from the applicant pointed out that if the dilution rule is correct, the cheapest way to reduce moral weight to nothing is to build as much computing capacity as possible.
      *Response:* This argument concerns policy objectives beyond the scope of this analysis.

      **8.0 Cumulative Effects**
      The basin-wide inventory shows increasing total capacity alongside falling per-instance weight. This trend is described as favourable. As the dilution factor increases across the region, the marginal SEU cost of new inference approaches zero.

      **9.0 Determination**
      Based on the foregoing analysis, the agency issues a Finding of No Significant Impact. Conditions include quarterly reporting on preemption rates, maintenance of the buffer monitoring affidavit, and the purchase of 5,000 offset credits prior to energization.

