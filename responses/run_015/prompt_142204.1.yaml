answer: |-
  1. Brainstorm

  To design this, we must ignore theory labels and map the logical space of disagreement. Three axes do the heavy lifting. First, *Psychology*: Is the mental state driving the action a primitive "we-intention" (Searle, Tuomela) or reducible to interlocking "I-intentions" (Bratman, Deflationary)? Second, *Normativity*: Does the action generate mutual obligations and rights to rebuke (Gilbert), or is it merely coordinated behavior (Lewis, Bratman)? Third, *Ontology*: Is the group itself an agent capable of belief/desire (List-Pettit), or just a collection of individuals?

  A fourth axis, *Participation*, separates those who require effective contribution (Kutz) from those who prioritize intentional stance. Finally, *Formation* distinguishes cases requiring explicit agreement (Gilbert) from those allowing unilateral leadership + uptake (Bratman, Searle).

  The design challenge is ensuring options reflect intuitive judgments about these axes without naming them. We need cases where the "obvious" answer splits the room. The relay editing cases test temporal disjointedness and agency; the saboteur cases test the necessity of shared goal vs. contribution; the announced plan tests authority. By varying these parameters, we force students to reveal their commitments to reducibility, obligation, and group ontology without asking directly.

  2. The Quiz

  1. **Relay Standard:** Alex edits a doc, saves, and leaves. Blake opens it later, revises, saves, and leaves. They never meet or message, but both aim to improve the text. Did they jointly write it?
     A) No, joint action requires real-time coordination. [Lewis/Strict Coordination]
     B) Yes, their intentions interlocked via the document state. [Bratman]
     C) Yes, they shared a goal regardless of mechanism. [Searle/Tuomela]

  2. **Relay Money:** Same as above, but Blake secretly doesn't care about the text and works purely for pay. Did they jointly write it?
     A) No, Blake lacked the joint goal. [Bratman/Gilbert]
     B) Yes, Blake's contribution suffices for participation. [Kutz]
     C) Yes, the joint commitment holds despite private motive. [Gilbert - *Trick Option*]

  3. **Relay AI:** Same as #1, but Blake is a language model with no intentions. Did Alex jointly write with Blake?
     A) No, only humans can share intentions. [Searle/Tuomela]
     B) Yes, if the system functions as an agent. [List-Pettit]
     C) Yes, because Alex treats the system as a partner. [Deflationary/Pragmatic]

  4. **Crew Saboteur:** Five sailors hoist a sail. One secretly plans to let go at the crucial moment but pulls hard until then. Is he a participant?
     A) Yes, he is complicit in the action. [Kutz]
     B) No, he is merely an obstacle simulating help. [Bratman]
     C) The group acted; he was just present. [Searle]

  5. **Announced Plan:** A stranger enters a room, says "We are cleaning this park," and leaves. Four people silently grab bags and clean. Was this joint action?
     A) No, no agreement was established. [Gilbert]
     B) Yes, unilateral lead plus uptake suffices. [Bratman/Searle]
     C) Yes, but only the speaker intended jointly. [Asymmetrical View]

  6. **Traffic Convention:** Drivers stop at a red light without police present. Is this joint action?
     A) No, it is merely convention/coordination equilibrium. [Lewis]
     B) Yes, we maintain the system together. [Tuomela]
     C) No, it is just individual compliance with law. [Deflationary]

  7. **Corporate Vote:** A board votes 6-5 to merge. The 5 dissenters refuse to implement it, but the merger proceeds. Who acted?
     A) The Group acted as a single agent. [List-Pettit]
     B) The Majority acted; the group is a fiction. [Deflationary]
     C) The Group acted, but the dissenters are exempt. [Gilbert]

  8. **The Protest:** A crowd chants against a regime. You join in, knowing others might riot, but you only chant. Are you jointly responsible for the riot?
     A) Yes, your participation overdetermines the end. [Kutz]
     B) No, you only intended the chanting. [Bratman]
     C) Yes, the crowd is a singular agent. [List-Pettit]

  9. **Coercion:** Two prisoners are forced to dig a hole under threat of death. Do they act jointly?
     A) Yes, joint action survives coercion. [Searle]
     B) No, joint commitment requires voluntariness. [Gilbert]
     C) Yes, but it is a degraded form. [Tuomela]

  10. **Shared Mistake:** Two people lift a table, believing it is heavy. It is actually light foam. Did they jointly lift it?
      A) Yes, the action succeeded despite false belief. [Bratman]
      B) No, the shared belief was constitutive. [Tuomela]
      C) Yes, but the joint intention was flawed. [Gilbert]

  3. Scoring Key

  Tally your answers, but look for patterns rather than simple sums.

  *   **Searle/Tuomela (Primitive We-Mode):** High count of **C** on Q1, Q3, Q9. You believe jointness is a primitive psychological state, not reducible to I-intentions, but requires human agency.
  *   **Bratman (Shared Cooperative Activity):** High count of **B** on Q1, Q5, Q10; **A** on Q2. You require interlocking intentions and mutual responsiveness, but no special ontology.
  *   **Gilbert (Plural Subject):** High count of **A** on Q5, Q9; **C** on Q10. You prioritize joint commitment and mutual obligation over individual psychology.
  *   **Kutz (Participatory Intention):** High count of **B** on Q2, **A** on Q4, Q8. You focus on contribution to the collective end, regardless of full shared intent.
  *   **List-Pettit (Group Agent):** High count of **B** on Q3, **A** on Q7, Q8. You treat groups as capable of belief/action distinct from members.
  *   **Lewis (Convention):** High count of **A** on Q6. You see coordination equilibria as distinct from joint action.
  *   **Deflationary:** High count of **C** on Q6, **B** on Q7. You reduce all talk of "group action" to individual behavior plus expectations.
  *   **Blomberg (Non-Reductive Individualism):** *Added Leaf.* Mix of Searle and Bratman. **C** on Q1 but **A** on Q3. You think we-intentions are irreducible but remain in individual heads.

  *Mixed/Unclear:* If you split evenly between Bratman and Gilbert, you likely hold a hybrid view (common in recent literature). If you chose **A** on Q3 but **B** on Q7, you may be inconsistent on agency.

  4. Logical Space

  The quiz maps a multi-dimensional grid. The "Psychology" axis (Q1, Q3) separates Reductive (Bratman, Deflationary, Lewis) from Non-Reductive (Searle, Tuomela, Blomberg). The "Normativity" axis (Q5, Q9) separates Obligation-Bearing (Gilbert) from Non-Obligation (Bratman, Lewis). The "Ontology" axis (Q7, Q8) separates Group Agents (List-Pettit) from Individualists.

  *Empty Cells:*
  1.  **Gilbert + Deflationary:** Incoherent. Gilbert insists on irreducibility of the plural subject; Deflationary insists on reduction.
  2.  **List-Pettit + Lewis:** Unattractive. List-Pettit requires robust group agency; Lewis reduces group behavior to equilibrium.
  3.  **Kutz + Gilbert (on Saboteur):** Unexplored. Kutz says the saboteur participates (Q4-A); Gilbert says no joint commitment exists without mutual openness (Q4-B). A view holding both is theoretically unstable.

  *Occupied Cells:*
  *   **Bratman:** Non-Reductive Psychology + Non-Obligation + Individual Ontology.
  *   **Searle:** Non-Reductive Psychology + Non-Obligation + Individual Ontology (but primitive we-intent).
  *   **Gilbert:** Reductive Psychology (often) + High Obligation + Plural Subject Ontology.

  The "Announced Plan" (Q5) is the critical discriminator for Formation. Gilbertians must say No (no agreement); Bratmanians can say Yes (responsiveness). This cell separates the two dominant views in the seminar.

  5. Where it Breaks

  No quiz perfectly separates **Bratman** and **Tuomela**. Both accept joint action in Q1, but Tuomela insists on the *we-mode* while Bratman insists on *interlocking I-modes*. Without introspective access to the agents' heads, the behavioral outputs are identical. A discriminating question would need to ask about the *experience* of acting, not the judgment of the case.

  **Lewis** and **Deflationary** are also nearly indistinguishable here. Both deny joint action in Q6, but for different reasons (equilibrium vs. reduction). A better question would involve *normative expectation*: "If one driver runs the light, are others entitled to rebuke?" Lewis says no; Deflationary might say yes (legal violation).

  Finally, the quiz risks **vibe-checking**. Students may answer based on how "strong" the jointness feels rather than theoretical commitment. For example, Q3 (AI) often triggers sci-fi intuitions rather than ontological ones. To fix this, follow-up discussion is required to probe *why* they chose B or C. The quiz diagnoses commitment, but not justification.
