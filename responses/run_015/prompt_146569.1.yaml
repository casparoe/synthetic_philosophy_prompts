answer: |-
  ### Exam Scenario: The Aris Paradox

  **Course:** PHIL 450 – Rationality, Probability, and Objective Chance
  **Exam:** Final Essay (90 Minutes)
  **Word Limit:** Approx. 800 words

  **Prompt:**

  Dr. Aris is conducting an experiment involving a specific quantum decay process. According to the Standard Model, which she accepts as law, the objective chance of decay outcome $A$ in the next trial is exactly $2/3$. However, Aris also possesses a dataset from an independently verified, long-run sequence of *identical* tokens of this process conducted in a separate laboratory. In that sequence, outcome $A$ occurred in only 40% of trials. Aris treats this statistical evidence as reliable and admissible regarding the setup, but she maintains that the theoretical chance assignment ($2/3$) remains the true objective chance for her specific trial.

  Write an essay determining Aris's rational credence in $A$. Adjudicate whether Lewis's Principal Principle (PP) locks her credence at $2/3$, licenses conditionalization downward based on the frequency data, or permits a principled intermediate position. In your analysis, you must: (1) distinguish whether the frequency data counts as admissible or inadmissible evidence in this context; (2) explain why a long-run statistical discrepancy does not automatically constitute an "undermining future" in Lewis's sense; (3) apply the PP to conditional rather than unconditional chances; and (4) address whether indexical or self-locating information (e.g., knowing which apparatus she is using) could alter the deference relation.

  ***

  ### Model Answer

  **Title:** Deference, Evidence, and the Expected Chance

  The Aris scenario presents a tension between theoretical chance ascription and empirical frequency data. To resolve this, we must refine the application of Lewis's Principal Principle (PP). The PP states that a rational agent's credence $C$ in proposition $A$, given admissible evidence $E$ and the proposition that the objective chance of $A$ is $x$, should equal $x$: $C(A | Ch(A)=x \& E) = x$. Aris's rational credence depends on how we characterize her evidence and the modality of her chance knowledge.

  **1. Admissibility of Frequency Data**
  The first move is to classify the 40% frequency data. Lewis defines admissible evidence as information that does not bear on the outcome of the chance event *except* through its bearing on the chances. Historical data about identical setups is typically admissible because it informs us about the stability of the chance setup without causally influencing the specific quantum event. If the frequency data were inadmissible (like knowledge of the future outcome), PP would be silenced. However, since this is past statistical data from an independent run, it is admissible. It enters the $E$ slot in the PP formula. Consequently, Aris must conditionalize on this evidence. The question is not whether to use the data, but how it interacts with the chance ascription.

  **2. Discrepancy vs. Undermining**
  Students often conflate statistical discrepancy with Lewis's "undermining future" problem. Undermining occurs when a possible future history has a non-zero chance of occurring but, if it did occur, would make the current chance assignment impossible (e.g., a world where the Best System laws change). Aris's 40% data does not undermine the 2/3 chance in this technical sense. A 2/3 chance process can logically produce a 40% frequency run over a finite sample; it is unlikely, but not impossible. Therefore, the existence of the 40% run does not render the proposition $Ch(A)=2/3$ false. The tension is epistemic, not metaphysical. The PP is not violated by the mere existence of unlikely frequencies, provided the chance proposition remains true.

  **3. Conditionalization and Expected Chance**
  This leads to the crucial application of the PP. The standard formulation $C(A | Ch(A)=x) = x$ assumes certainty about the chance value. However, Aris holds two pieces of evidence: the theory ($T$) suggesting $Ch(A)=2/3$, and the frequency data ($F$) suggesting $Ch(A)$ might be lower. Rationality requires she defer to the *expected* objective chance. We should use the generalized PP: $C(A | E) = \sum C(Ch(A)=x | E) \cdot x$.
  If Aris is certain $Ch(A)=2/3$ (treating the theory as factive), then $C(Ch(A)=2/3 | E) = 1$, and PP locks her credence at $2/3$. The 40% data is merely surprising noise. However, if "knows" implies high confidence in a fallible theory, the frequency data $F$ lowers her credence that the chance is truly $2/3$. She should assign some weight to the hypothesis that the true chance is lower. Thus, PP licenses conditionalization downward, not by violating deference, but by shifting the probability distribution over possible chance values. The rational credence is the weighted average of the chances, not a dogmatic adherence to the theoretical value against empirical data.

  **4. Indexical Information and Reference Classes**
  Finally, we must consider indexical information. Does it matter if Aris knows her apparatus is *part of* the 40% sequence or distinct from it? If she knows her specific token is causally isolated from the 40% run, the data is less relevant to her specific chance setup. However, if she lacks self-locating knowledge—for instance, if she does not know whether her apparatus is the "theoretical" one or one from the "40% batch"—she faces a reference class problem. In this case, the indexical information "I am using this apparatus" combined with the uncertainty about which population it belongs to requires her to treat the 40% frequency as evidence about the *type* of process she is observing. This strengthens the case for downward conditionalization. If she knows she is in the theoretical setup, the 40% data is less admissible regarding her specific chance, pushing credence back toward $2/3$.

  **Conclusion**
  Aris's rational credence is not fixed at $2/3$ unless she treats the theoretical chance as infallible. Proper application of the PP requires conditionalizing on all admissible evidence, including frequency data. Since the data is admissible and non-undermining, it shifts her credence distribution over possible chance values. Unless indexical information isolates her setup from the statistical run, rationality demands she lower her credence below $2/3$, tracking the expected objective chance rather than the theoretical maximum.

  ***

  ### Marking Scheme (20 Points Total)

  **1. Admissibility Distinction (5 Points)**
  *   **5 pts:** Correctly identifies frequency data as admissible (historical/setup info) distinct from outcome info.
  *   **3 pts:** Identifies it as evidence but fails to define admissibility relative to PP.
  *   **0 pts:** Claims all empirical evidence is inadmissible or conflates it with future outcomes.
  *   *Typical Failure:* Students claim statistical data is always inadmissible because it affects credence.
  *   *A vs B:* A answers define admissibility functionally (info about outcome *only* via chance); B answers recite Lewis's definition without applying it to the frequency data.

  **2. Undermining vs. Discrepancy (5 Points)**
  *   **5 pts:** Explains that 40% frequency is compatible with 2/3 chance (statistical fluctuation), unlike undermining which makes chance impossible.
  *   **3 pts:** Notes they are different but fails to explain the logical compatibility.
  *   **0 pts:** Treats the 40% run as an "undermining future" objection.
  *   *Typical Failure:* Students argue the data falsifies the chance, missing the probabilistic nature of chance.
  *   *A vs B:* A answers distinguish metaphysical impossibility (undermining) from epistemic surprise (discrepancy); B answers simply state "it's not undermining."

  **3. Conditional PP / Expected Chance (5 Points)**
  *   **5 pts:** Applies Generalized PP ($C(A) = \sum C(Ch=x) \cdot x$) or argues conditionalization updates the chance hypothesis.
  *   **3 pts:** Applies standard PP but notes evidence matters without formal adjustment.
  *   **0 pts:** Applies simple PP ($C(A)=Ch(A)$) ignoring the evidence $E$.
  *   *Typical Failure:* Students stick to $C(A)=2/3$ because "PP says match the chance."
  *   *A vs B:* A answers show how evidence updates the *chance proposition* probability; B answers summarize the PP formula without resolving the conflict.

  **4. Indexical/Self-Locating Information (5 Points)**
  *   **5 pts:** Discusses how knowing which apparatus/population she is in affects the reference class and admissibility weight.
  *   **3 pts:** Mentions indexicality but doesn't link it to the credence calculation.
  *   **0 pts:** Ignores the indexical constraint entirely.
  *   *Typical Failure:* Students treat all apparatuses as identical without considering selection effects.
  *   *A vs B:* A answers integrate indexicality into the admissibility weighting; B answers tack on a paragraph about "location" without philosophical consequence.
