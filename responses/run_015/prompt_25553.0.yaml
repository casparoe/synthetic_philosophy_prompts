answer: |-
  You have stumbled onto the exact problem that Thomas Nagel and Bernard Williams made famous in the 1970s. Your intuitions are not "messy" in a personal sense; they are messy in the way that *human morality* is messy. You are oscillating between two competing frameworks: the **Control Principle** (you are only responsible for what you control) and the **Outcome Intuition** (results matter for blame).

  To make your verdicts hang together, you need a principle that distinguishes between **judging the agent's character** and **judging the agent's debt to the world.**

  Here is a proposed framework that captures most of your verdicts, explains your unease, and handles the new case.

  ### The Principle: "Culpability vs. Liability"

  The most coherent way to organize your thoughts is to split "blame" into two distinct concepts:

  1.  **Moral Culpability (The Input):** This measures the quality of your will, your choices, and your agency. *Luck should not matter here.*
  2.  **Moral Liability (The Output):** This measures your debt to the community, your punishment, and your accountability for harm. *Luck matters here.*

  Your intuitions are consistent if you assume that **Culpability tracks Control, but Liability tracks Harm.**

  #### How this organizes your cases:

  *   **Cases 1, 4, 6, 7 (Resultant Luck):**
      *   *Your Verdict:* The one who caused harm is more blameworthy/punishable.
      *   *The Principle:* Their **Culpability** (negligence/risk-taking) is identical to the lucky counterpart. However, their **Liability** is higher because a harm occurred that requires restitution, punishment, or social accounting.
      *   *Why Case 6 bothers you:* You feel uneasy because you sense that the *Culpability* is identical (both were equally negligent parents), but you feel forced to say the drowning parent is "more blameworthy." If you switch to saying "They are equally *negligent*, but the drowning parent has a much heavier *debt* to pay," the unease should vanish.
      *   *Case 7 (Business):* This is often less about *moral* blame and more about *professional* liability. We hold leaders accountable for outcomes even when decisions were reasonable, because that is the role they accepted.

  *   **Case 2 (Circumstantial/Constitutive Luck - Upbringing):**
      *   *Your Verdict:* The bigot is less blameworthy due to upbringing.
      *   *The Principle:* This mitigates **Culpability**. If your upbringing prevented you from developing the *capacity* to recognize the moral truth, your agency was compromised. You are less liable because your "moral input" was corrupted by factors outside your control.

  *   **Case 3 (Constitutive Luck - Temperament):**
      *   *Your Verdict:* The brave person is more admirable; the fearful one is less so.
      *   *The Principle:* We treat temperament as part of the **Self**, not as an external constraint. Unlike upbringing (which shapes the self), fear/bravery is seen as an *expression* of the self. Therefore, it counts toward **Culpability/Praiseworthiness**. We identify with our nerves more than we identify with our geography.

  *   **Case 5 (Thought vs. Action):**
      *   *Your Verdict:* The attempter is worse than the fantasizer.
      *   *The Principle:* This is the threshold of **Agency**. Fantasizing is internal (no liability). Attempting crosses into the world (incurs liability/risk), even if luck prevents harm.

  ### What you must abandon to be consistent

  To hold this view, you have to abandon the idea that "blameworthiness" is a single, scalar property. You cannot say the drunk killer is *intrinsically more evil* than the drunk non-killer. You must say they are *equally wicked* but *differently liable*.

  If you refuse to make that distinction, you are forced into one of two corners:
  1.  **Hard Luck Denial:** You must say the drunk killer and non-killer deserve *exactly* the same punishment (abandoning Cases 1, 4, 6, 7).
  2.  **Hard Luck Acceptance:** You must say the bigot is *just as bad* as the reflective racist because views are views (abandoning Case 2).

  Most people (and legal systems) choose the **Culpability/Liability split**. It allows us to maintain human dignity (you aren't evil just because you were unlucky) while maintaining social order (someone has to answer for the dead child).

  ### The New Case: The Failed Rescue

  **Scenario:**
  *   **Rescuer A:** Jumps into a raging river to save a drowning stranger. Succeeds.
  *   **Rescuer B:** Jumps into a raging river to save a drowning stranger. The rope snaps / current is too strong. The stranger dies. Rescuer B did everything right, but failed through no fault of their own.

  **Applying the Principle:**

  1.  **Culpability (Praiseworthiness):**
      *   Both displayed the same courage and moral will.
      *   **Verdict:** They are **equally praiseworthy** in terms of character. We should not admire Rescuer A *more* than Rescuer B. If we hold a ceremony, both deserve medals for valor.

  2.  **Liability (Agent-Regret):**
      *   Rescuer B now bears a relationship to the death that Rescuer A does not. Rescuer B may feel **Agent-Regret** (a term from Bernard Williams). This is a specific kind of grief that only the agent involved feels, distinct from a bystander's sadness.
      *   **Verdict:** Rescuer B has a "debt" of grief and perhaps an obligation to explain what happened, whereas Rescuer A has a debt of celebration.

  3.  **Social Perception:**
      *   Here, resultant luck will likely creep in unfairly. Rescuer A will be called a "Hero." Rescuer B might be questioned ("Did they pull hard enough?").
      *   **Normative Stance:** To be consistent with your view on Case 6 (where you want to resist the inconsistency), you should argue that **society is wrong to treat Rescuer B as less heroic.**

  ### Summary of the Unified View

  You can keep almost all your verdicts if you adopt this rule:

  > **"Luck does not change the quality of the will (Culpability), unless it undermines the capacity to form a will (Upbringing). But luck does change the debt owed to the world (Liability)."**

  *   **Drunk Drivers (1):** Equal wickedness, unequal debt.
  *   **Bigot (2):** Reduced capacity, reduced wickedness.
  *   **Bravery (3):** Temperament is part of the will, so it counts toward worth.
  *   **Negligent Parents (6):** Equal negligence, unequal debt. (Your unease comes from sensing the negligence is equal).
  *   **Rescue Case:** Equal heroism, unequal emotional aftermath.

  This resolves the tension by admitting that "blame" is doing two different jobs in your head: one job is assessing *who you are*, and the other is assessing *what you owe*. Luck affects the second, but rarely the first.
