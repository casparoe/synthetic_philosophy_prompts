      *   *Distinction needed:* Empirical propositions vs. Grammatical/Methodological rules. Wittgenstein says hinges look like empirical propositions ("I have two hands," "The earth exists," "Decay constants are constant") but function as rules of the game.
      *   *The "Loop":* The calibration circle. This is the "problem of the criterion" or circularity. A hinge epistemologist says this isn't vicious circularity; it's the nature of a system. You can't step outside the system to validate the system.
      *   *Bayesian Challenge:* A strict Bayesian says everything has a probability $P < 1$. But in practice, scientists treat $P(\text{decay constant}) \approx 1$ effectively as 1. If you treat it as 0.99999, you still don't test it. Is there a practical difference? Yes, because if it *were* a belief, anomaly data should lower its probability. But the scientist *protects* it from the data. That's the key. The data is rejected, not the hinge.
      *   *Revisability:* "In principle" is crucial. Wittgenstein says hinges *can* change, but not like normal beliefs. They shift like the bed of a river, not the water flowing over it. So "in principle" isn't a dodge; it acknowledges historical contingency (Newton to Einstein), but "in practice" acknowledges current functional necessity.
      *   *Truth/Status:* Are they true? Wittgenstein is tricky here. He sometimes says asking if they are true is nonsense because they define what "true" means in that context. But later interpreters (Moyal-Sharrock, Coliva) debate this. Some say they are "acceptances" not "beliefs." I need to be careful not to dogmatize one interpretation but explain the tension.
      *   *The Made-Up Rules:*
