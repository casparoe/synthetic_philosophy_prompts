      *   **Addressing Question 3 (Coherence/Revisability):** Address the "in principle" phrase. Use the "Riverbed" metaphor. Hinges are fluid over geological time (fitting for a geochemist!), rigid over human time. No tension, just different timescales.
      *   **Addressing Question 4 (Status/Truth):** Are they beliefs? Wittgenstein says they are more like "knowing how" than "knowing that." They are the scaffolding. Calling them "true" is category mistake-ish. They make truth possible.
