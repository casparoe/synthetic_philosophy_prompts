answer: |-
  **RATIONAL CHOICE 404 — FINAL EXAM**
  **Time:** 75 Minutes
  **Total Marks:** 30
  **Students:** 12 (Keep your eyes on your own paper, seriously.)

  **Instructions:**
  Read the scenario below carefully. There are three parts. Answer all of them. You don't need citations or bibliographies—just show me you understand the mechanics of the reasoning. A typo or two won't kill you, but sloppy logic will.

  **The Scenario:**
  First, recall the standard one-shot Platonia dilemma: Two identical reasoners must simultaneously choose **Enter** or **Pass**. If exactly one enters, the entrant gets $1 million (the other gets $0). If both enter or neither enters, both get $100. There is no entry cost.

  Now, consider the **Cascaded Lure**. This is a three-round game played by two identical reasoners. In each round, they simultaneously choose **Enter** or **Pass**.
  *   **Hidden Types:** Before Round 1, each agent is privately assigned a type: **Stable** or **Volatile**. This is assigned randomly. Crucially, the type is unknown *even to the agent themself* until the game ends.
  *   **Payoffs (Per Round):**
      *   If **Exactly One Enters**: The entrant gets $500,000 × (Round Number) if they are **Stable**, but $0 if they are **Volatile**. The passer gets $50,000 regardless of type.
      *   If **Both Enter** or **Both Pass**: Both agents get $200 regardless of type.
  *   **End Game:** After Round 3, all types are revealed publicly.

  ***

  **Part 1 (10 marks)**
  Explain why in the one-shot Platonia case the usual dominance reasoning for entering collapses once the agents recognize they share an identical reasioning algorithm. Pinpoint the exact step where superrational symmetry undermines the "I should enter regardless" argument.

  **Part 2 (12 marks)**
  Apply that analysis to the Cascaded Lure. Do the hidden Stable/Volatile types break the superrational symmetry or preserve it? Would an evidentialist and a causalist give different recommendations for Round 1? Be specific about whether the unknown type functions like the Newcomb predictor or like pure noise.

  **Part 3 (8 marks)**
  A study-group partner says: "This is just Newcomb with extra steps — the hidden type is the predictor, the rounds are repetition." Give the best reply that identifies one structural feature of the Cascaded Lure that has no analog in Newcomb and shows why the reduction fails.

  ***

  ### MODEL ANSWER & MARKING SCHEME

  **Note to Grader:**
  This scheme is built around five "must-hit" points across the three parts. Marks should sum to 30. I've included a note on how candidates typically screw each point up.

  **Point 1: The Collapse of Independence (Part 1) — 5 Marks**
  *   **Required:** The candidate must identify that standard dominance reasoning requires holding the other player's action fixed (ceteris paribus) while varying one's own. In superrationality, because the agents share an identical algorithim and information state, varying one's own action logically implies varying the other's.
  *   **Common Error:** Students treat it like a standard Nash equilibrium problem where the other's move is independent of my choice.
  *   **Score:** 0-5 based on clarity of the "fixed action" critique.

  **Point 2: The Diagonal Constraint (Part 1) — 5 Marks**
  *   **Required:** The candidate must explain that symmetry restricts the possible outcomes to the diagonal of the payoff matrix (Both Enter or Both Pass). Since both diagonal outcomes yield $100, the $1M outcome is rendered inaccessible to deterministic identical reasoners, neutralizing the dominance argument.
  *   **Common Error:** Claiming that "randomizing" solves it without explaining how identical reasoners coordinate on different random seeds.
  *   **Score:** 0-5 based on identifying the inaccessible off-diagonal outcomes.

  **Point 3: Informational Symmetry & Types (Part 2) — 6 Marks**
  *   **Required:** The candidate must argue that because the type is unknown *to the self*, it does not enter the decision function. Both agents have the same information state (ignorance of type), so the superrational symmetry is preserved. The types are payoff modifiers, not decision variables.
  *   **Common Error:** Asserting that because the types *are* different (one Stable, one Volatile), the agents must act differently, ignoring the "unknown to self" constraint.
  *   **Score:** 0-6 based on linking private ignorance to preserved symmetry.

  **Point 4: EDT vs. CDT Divergence (Part 2) — 6 Marks**
  *   **Required:** The candidate must distinguish the recommendations: CDT treats the other's action as independent (causally), so it calculates expected utility based on the probability of the other entering/passing (likely recommending Enter if Prob(Stable) is high enough to chase the $500k). EDT treats the other's action as evidence of its own (due to shared algorithm), seeing only the $200/$200 diagonal outcomes, likely recommending Pass or indifference since entering provides no evidential gain over passing. The type functions like **pure noise**, not a predictor, because it doesn't correlate with the *choice*, only the *payoff magnitude*.
  *   **Common Error:** Confusing the hidden type with the Newcomb Predictor (claiming the type predicts the choice).
  *   **Score:** 0-6 based on correct EDT/CDT split and classification of the type.

  **Point 5: Structural Disanalogy with Newcomb (Part 3) — 8 Marks**
  *   **Required:** The candidate must identify that Newcomb's Problem is structurally a **single-agent** decision problem against Nature/Predictor, whereas Cascaded Lure is a **multi-agent** game. In Newcomb, the correlation is caused by a past prediction fixing the box content. In Cascaded Lure, the correlation is logical/simultaneous between two active choosers. The "Predictor" in Newcomb sets the payoff *before* the choice; in Cascaded Lure, the other *agent* chooses simultaneously, making the correlation metaphysical (shared reason) rather than causal-historical.
  *   **Common Error:** Focusing on the number of rounds (repetition) rather than the agent-structure (1 vs 2 players).
  *   **Score:** 0-8 based on isolating the single-vs-multi agent or causal-vs-logical correlation distinction.

  **Total:** 30 Marks.
