prompt: |-
  I'm a PhD student in philosophy of neuroscience and I'm running the discussion section for an intro philosophy of mind course this semester. Next tuesday I have to cover Libet's experiments and the neuroscience of free will in about forty minutes, but I really don't want to do the usual "brain decides before you do" lecture because the students always just nod and then write exactly that on the exam. Instead I want to frame everything through predictive processing — the idea that the brain is always generating predictions and updating them — so the carrying example isn't just the classic button-press task but something like reaching for a coffee cup and feeling the "urge" only after the predictive model has already started shaping the movement. I need you to plan the teaching sequence: what has to come first, what's the dependancy order between explaining the readiness potential and introducing predictive coding, and which misconceptions should I head off — I'm guessing things like "predictive processing proves there's no self" or "Libet showed consciousness is totally useless"? Where exactly in the sequence should I defuse each one?

  Also, what's the one concrete scenario that should carry the whole session — maybe the coffee cup reach — and what properties does it need to have? I want a closing question that checks whether they've understood that predictive framing complicates the free will debate rather than just killing it dead. And please tell me what to explicitly leave out at this level; I was thinking of skipping the later fMRI replication studies from the 2000s, but I'm open to other omissions. Don't ask me for a bibliography, I just need the pedagogical structure and maybe a warning about where students usually get stuck.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
