      *   *Self-Correction on PP:* Be careful not to present PP as *solving* free will. It reframes the ontology of the decision. The prompt asks to "complicate the debate rather than just killing it dead."
      *   *Refining the Closing Question:* Needs to test if they understand the *reframing*. Not "Do we have free will?" but "Does the timing of the RP matter if the process is hierarchical?"

