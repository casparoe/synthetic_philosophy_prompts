answer: |-
  Standing here feels like a category error. Half of this room trains to measure the weight of history; the other half reads my inventions for pleasure. Miriam knew this. She read my three novels about the same family across four centuries and liked them while denying their premise. In each book, a generation makes a decisive choice in explicitly doctrinal language: a refusal to lend at interest, a decision to reinvent a failing workshop, a daughter sent into the mill. Miriam's charge was that in every case I had made a belief do the work while an interest was already doing it. She thought my novels were a seductive version of the thesis she spent her career opposing: the idea that ideas steer history.

  She asked that this series open with someone who would argue with her rather than eulogize her. She specified that the word *legacy* not be used, and that no one say she is watching over anything. So I will not tell you she is proud of us. I will tell you that she was right to worry about my books, and that I am here to explain why I write them anyway.

  There is a skepticism in this room about novelists holding opinions on causation. It is warranted. Fiction deals in the particular, while sociology deals in the pattern. But Miriam's standing line was a tool for testing particulars. Her test was simple: if you cannot say what would have happened differently without the idea, you have described a costume and not a cause. If the merchant refuses the loan because of his faith, but would have refused it anyway because the borrower was risky, then the faith is a costume. It dresses the decision, but it did not make it.

  I have spent the last year trying to apply this test to my own drafts. When I write, I test a scene by drafting it twice: once with the doctrine in the character's mouth and once with it removed. I want to report honestly on what happens when I delete the variable.

  [Insert placeholder: Describe a specific scene from the second novel where the merchant refuses the loan. Show the draft where he cites scripture, and the draft where he cites risk assessment. Note that the ledger entry remains identical in both versions.]

  In both versions, the outward behavior survives the deletion. The same ledger entry, the same refusal, the same daughter on the same road. Miriam's test, designed to expose false causes, works perfectly here. If the action is identical, the idea was not the motor. It did not supply a desire that was not there before. Nor was it merely a switch, selecting among desires already present. The money stays in the pocket regardless of the vocabulary used to justify keeping it.

  But what changes is the description under which the act is done, and above all whether it repeats. A motive that arrives once lapses; a motive the character can name to themselves in a borrowed vocabulary holds for forty years. This suggests a three-way distinction that I want to sharpen rather than assert. There is an idea as motor, supplying a desire that was not there before. There is an idea as switch, selecting among desires already present. And there is an idea as grammar, supplying the vocabulary in which an action becomes describable, and so rehearsable, transmissible, and steady across a life.

  Miriam's counterfactual test is well designed to expose motors and switches. If you remove the motor, the car stops. If you remove the switch, the light stays off. But the test has nothing to say about grammar, because deleting a vocabulary does not delete any behavior — it only leaves the behavior unnameable and therefore, in my experience, temporary. Without the grammar of usury, the merchant might still keep his money today. But next year, when the risk is lower, why does he still keep it? Without the vocabulary, the consistency looks like obsession. With the vocabulary, it looks like a life.

  My own novels can only ever do the third thing. They cannot make anyone want anything new. If a reader finishes my book about the mill town and decides to become a union organizer, I did not give them the desire. If they do anything at all, it is to hand a reader a description under which some stretch of their own life becomes steady. We offer a grammar for suffering, or for endurance, or for refusal.

  This brings me to the question I want put to this room, and left genuinely open. Miriam spent forty years arguing that culture is never a cause. She associated this with the vaguer, more comfortable claim that ideas steer history, and with the specific thesis associated with Weber about the spirit of capitalism and ascetic Protestantism. Weber argued that certain religious ideas created a psychological sanction that made systematic economic conduct possible.

  Miriam would say that if the economic conduct was already profitable, the religious sanction was merely a costume. But I want to ask whether the thesis needed ideas to supply new desires at all, or only to make a pattern of life durable enough to be recognized as a pattern. If a behavior occurs once, it is an event. If it occurs across generations, it is a culture. What bridges the gap between the event and the culture?

  If the only thing an idea does is make an action describable to the actor, is that causation? Or is it an elaborate way of redescribing one? If a man refuses a loan because he calls it sin, and another refuses it because he calls it risk, the economic outcome is identical. But the first man teaches his son to refuse loans. The second man teaches his son to assess risk. The son of the first man refuses a safe loan. The son of the second man takes a risky one. The grammar dictates the transmission.

  I do not want to resolve this disagreement by saying that both of us were partly right. I do not claim that she would have come around. She was too rigorous for that, and the world is too messy. But I think she might have accepted that her test measures specific types of causation and misses others. It measures the spark, but not the fuel line. It measures the decision, but not the duration.

  For the historians and sociologists here, you know the weight of *Verstehen*, of interpretive understanding. You know that explaining an action requires knowing how the actor described it to themselves. For the rest of you, who know my books only as stories, you know that a character feels real only when their reasons hold up over time. We are meeting on the same ground: the stability of human behavior.

  Miriam left a note asking for argument. She did not want comfort. So I will not offer you the comfort of synthesis. I will offer you the discomfort of her own method. She taught that if you cannot say what would have happened differently without the idea, you have not found a cause.

  I want to hand that test back to her students, and to everyone in this room who is trying to explain why things happen. Do not use it only on the past. Use it on your own explanations. Go and delete your favorite variable from your own explanation and see what survives. If you are a historian, remove the ideology and see if the war still starts. If you are a novelist, remove the trauma and see if the character still leaves. If you are a student trying to understand your own life, remove the story you tell about why you are here and see if you still stay.

  See what survives. If the behavior remains, you have found a costume. If the behavior collapses, you have found a motor. But if the behavior remains only for a moment, and then fades because it cannot be named, you have found a grammar.

  Miriam argued that culture is never a cause. I am suggesting that culture is the only thing that makes a cause last longer than a moment. Whether that counts as causation is for you to decide. She is not watching to see if you get it right. She is gone. The test remains. Use it.
