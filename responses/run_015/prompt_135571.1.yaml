  2.  **Deconstruct the Philosophical Concepts:**
      *   **Endurantism:** Objects persist by being *wholly present* at every moment of their existence. $O$ at $t_1$ is numerically identical to $O$ at $t_2$. Problem: How to handle change (Leibniz's Law). Solution usually involves time-indexing properties (being $F$-at-$t$).
      *   **Perdurantism:** Objects persist by having *temporal parts*. $O$ is a spacetime worm. $O$-at-$t_1$ is a part of $O$, not identical to $O$-at-$t_2$. No contradiction because different parts have different properties.
      *   **The "Rolling Mandate":** An institutional office. Let's call it "The Arbiter."
          *   $t_1$: Person A holds it.
          *   $t_2$: Person B holds it.
          *   $t_3$: Person C holds it.
          *   Crucially: A, B, and C share *nothing* physically. No handover of a seal, no overlapping tenure. Just a rule saying "The Arbiter is whoever the council picks for this term."
      *   **The Problem:** If "The Arbiter" endures, it is wholly present at $t_1$ (as A) and wholly present at $t_2$ (as B). But A and B are distinct humans. If the mandate is defined *purely* by the relational structure (the rule of rotation), what is the "thing" that is present at both times?

  3.  **Identify the Specific Conceptual Issue:**
      *   Standard endurantism handles change in *accidental* properties (e.g., a ball changes color).
      *   Here, the "properties" defining the entity's manifestation are *constitutive*. The mandate *is* the authority exercised by the holder.
      *   If the mandate is wholly present at $t_1$, it is identical to the authority exercised by A.
      *   If the mandate is wholly present at $t_2$, it is identical to the authority exercised by B.
      *   Since A $\neq$ B, and the authority is defined by the agent's specific capacity/context, does the mandate have contradictory identities?
      *   *The Tension:* Endurantism requires a substratum or essence that remains constant while properties change. But in this case, the "properties" (who holds it) are the *only* thing defining the entity's existence in the physical world. There is no material substrate. So, what endures?
      *   *The "Contradictory Properties" angle:* At $t_1$, the Mandate is "held by A." At $t_2$, the Mandate is "held by B." If the Mandate is wholly present at $t_1$, does it possess the property "held by B" potentially? No. But if it is numerically identical across time, how can it be constituted by entirely disjoint entities without becoming a universal or an abstract object rather than a concrete particular?
      *   *Refining the Issue:* The issue is **Constitution without Continuity**. Endurantism typically relies on *something* enduring (matter, substance, or a bundle of compossible properties). If the definition is purely relational/diachronic, the "whole presence" at $t_1$ lacks any ontological link to the "whole presence" at $t_2$ other than the abstract rule. This pushes the enduring entity toward being an abstract universal (The Office) rather than a concrete particular (The specific instance of authority), yet institutional mandates act as concrete particulars in legal/causal contexts.

