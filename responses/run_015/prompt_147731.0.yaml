answer: |-
  This is a surprisingly stable position. You've essentially reconstructed a **Wittgensteinian Expressivism** blended with **Dennett-style Illusionism** and **Davidson's Anomalous Monism**. It sounds smart because it *is* smart; it's a recognized niche in the literature (close to Rorty or Brandom).

  However, your intuitions about the tensions are correct. Here is the breakdown of where the stress points are, ranked by severity, followed by the fix.

  ### 1. Ranking the Tensions by Severity

  **Severity 1 (Critical): (1) vs. (4)**
  *   **The Conflict:** In (1), you say phenomenal reports don't track real properties (Quinean skepticism). In (4), you say there is a "real explanatory gap." An explanatory gap usually implies two existing relata (Physical State X and Phenomenal State Y) that we can't bridge. If (1) is true, there is no Phenomenal State Y to have a gap *with*.
  *   **Why it hurts:** If the vocabulary is broken/non-tracking (1), the "gap" should dissolve entirely (Eliminativism). By keeping the gap "real" (4), you risk smuggling the ontology back in through the back door.

  **Severity 2 (Moderate): (5) vs. Standard Physicalism**
  *   **The Conflict:** You say you "reject physicalism" in (5), but your definition ("vocab isn't reducible... not a non-physical substance") is literally the definition of **Non-Reductive Physicalism** (specifically Anomalous Monism).
  *   **Why it hurts:** This is mostly a labeling problem. Professors might nitpick that you aren't rejecting physicalism, just *reductive* physicalism. It makes your stance sound more metaphysically committed than it is.

  **Severity 3 (Apparent): (3) vs. (1)**
  *   **The Conflict:** You worry (3) forces (1) harder than you want.
  *   **Why it's apparent:** It doesn't. Chase & Sanborn argue that if you treat qualia as *theoretical posits* (things that explain behavior), they vanish because they do no work. This *supports* (1) (they aren't properties) and *supports* (2) (they are something else, like avowals). These two points are allies, not enemies.

  ### 2. The "Physicalism with Extra Steps" Question
  **Yes, (5) is basically Non-Reductive Physicalism.**
  If there is no non-physical substance and no non-physical properties (per 1 & 3), but the vocabulary is irreducible, you are a **Non-Reductive Physicalist**. The only thing making it "anti-physicalist" is your insistence that the conceptual scheme is "broken." If you frame the conceptual scheme as just *different* (autonomous), you land squarely in Davidson's camp.

  ### 3. The Cheapest Single Revision
  **Target:** Revision of **(4)**.
  **Goal:** Preserve **(2)** (Expressivism/Grammar).

  **The Problem:** The phrase "explanatory gap" in (4) implies that *experience* is a thing that needs explaining alongside neurons. This clashes with (1) and (2).

  **The Fix:** Change (4) from claiming there is an **explanatory gap** to claiming there is a **translational incommensurability**.

  > **Revised (4):** "I think there is a real **translational failure** between neural dynamics and phenomenal reports, except the failure is in our conceptual scheme—its grammar is distinct, not the world—so it's not a metaphysical mystery."

  **Why this works:**
  1.  **Saves (2):** It treats the issue as linguistic/grammatical (translation) rather than ontological (explanation of properties).
  2.  **Neutralizes (1):** You can have two vocabularies that don't translate (Quine's indeterminacy) without requiring that one of them tracks "real properties." It allows the first-person report to be meaningful (2) without being a description of a property (1).
  3.  **Cleans up (5):** It makes your "rejection of physicalism" clearly about *language*, not *metaphysics*, which aligns with your "no non-physical substance" clause.

  **Summary:** Your position is coherent, but the word "gap" in (4) is doing too much metaphysical heavy lifting for a view that wants to be deflationary. Swap "gap" for "incommensurability," and the whole thing locks into place.
