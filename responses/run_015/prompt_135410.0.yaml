answer: |-
  # Exam Question: Research Methods 405 — Final Assessment

  **Time Allowed:** 40 Minutes
  **Total Marks:** 20

  **Instructions:** Answer all parts. You may use a calculator, but all necessary arithmetic is simple enough to do by hand. Focus on the causal logic, not just the arithmetic.

  ### The Data
  You are evaluating a new Treatment ($T$) versus Control ($C$) on a binary Outcome ($Y=1$ is Success). You suspect a third variable, $Z$, might be relevant. You observe the following three hypothetical data summaries:

  **Table 1 (Classic Reversal)**
  *   **Stratum $Z=0$:** $T$: 1/1 Success (100%); $C$: 8/9 Success (89%).
  *   **Stratum $Z=1$:** $T$: 1/9 Success (11%); $C$: 0/1 Success (0%).
  *   **Overall (Aggregate):** $T$: 2/10 Success (20%); $C$: 8/10 Success (80%).

  **Table 2 (Balanced Design)**
  *   **Stratum $Z=0$:** $N_T = N_C = 50$. Risk Difference ($RD$) = $+0.10$.
  *   **Stratum $Z=1$:** $N_T = N_C = 50$. Risk Difference ($RD$) = $+0.10$.
  *   **Overall:** $N_T = N_C = 100$. Reported $RD$ = $-0.10$ (Favors Control).

  **Table 3 (Odds Ratios)**
  *   A randomized trial ($T \perp Z$).
  *   Conditional Odds Ratios ($OR_{T,Y|Z}$) are identical in both strata ($OR = 2.0$).
  *   Marginal Odds Ratio ($OR_{T,Y}$) calculated from the aggregate table is $1.5$.

  ### Questions

  **(a)** Verify the reversal in **Table 1**. Show the Risk Differences for the strata and the aggregate. (3 marks)

  **(b)** Is **Table 2** mathematically possible? Explain why or why not using the properties of weighted averages. (3 marks)

  **(c)** In **Table 3**, there is no confounding ($T \perp Z$). Why does the Marginal OR differ from the Conditional OR? Is this a bias? (4 marks)

  **(d)** Returning to **Table 1**: The aggregate table favors Control; the stratified table favors Treatment. Without any further information about how the data were generated, can you determine which estimate is the causal effect of $T$? Explain what specific information is missing. (6 marks)

  **(e)** Suppose $Z$ is not a confounder, but is instead caused by $T$ (a mediator) or is a "collider" (caused by both $T$ and $Y$). If you stratify on $Z$ in this case, what happens to your causal estimate? Draw a simple DAG to illustrate one of these cases. (4 marks)

  ***

  # Model Answer

  **(a)** In Table 1, the Stratum $Z=0$ Risk Difference (RD) is $1.00 - 0.89 = +0.11$. The Stratum $Z=1$ RD is $0.11 - 0.00 = +0.11$. In both strata, Treatment is superior. However, the Aggregate RD is $0.20 - 0.80 = -0.60$, favoring Control. This is a valid arithmetic reversal driven by the unequal distribution of patients: the Treatment group is heavily loaded into the low-success stratum ($Z=1$), while the Control group is loaded into the high-success stratum ($Z=0$).

  **(b)** Table 2 is **impossible**. When strata sizes are equal ($N_{Z0} = N_{Z1}$) and treatment allocation is balanced within strata ($N_T = N_C$), the weights applied to each stratum-specific risk difference are identical. The marginal risk difference must be the simple average of the stratum-specific risk differences. If both strata show $+0.10$, the aggregate must be $+0.10$. A sign reversal cannot occur under these balanced conditions for risk differences.

  **(c)** This is **non-collapsibility**, not bias. Unlike risk differences, odds ratios are not mathematically collapsible. Even in a perfectly randomized trial where $Z$ is not a confounder, the marginal OR will typically be closer to the null (1.0) than the conditional ORs if $Z$ is predictive of the outcome. The difference arises from the mathematical properties of the ratio, not from confounding bias.

  **(d)** **No**, the joint distribution alone cannot decide the causal effect. Statistics describes association; causality requires structure. To choose between the aggregate or stratified estimate, we need to know the causal status of $Z$.
  *   If $Z$ is a **confounder** (common cause of $T$ and $Y$), the stratified estimate is correct (adjusting for confounding).
  *   If $Z$ is irrelevant or purely random noise, the aggregate might be preferred for precision, though stratification usually doesn't hurt.
  *   We need a DAG or experimental design details to identify if $Z$ opens or closes backdoor paths. The tables only show $P(Y|T, Z)$, not the causal graph.

  **(e)** Stratifying on a post-treatment variable introduces bias.
  *   **Mediator:** If $T \to Z \to Y$, stratifying on $Z$ blocks the causal path, estimating only the direct effect and underestimating the total effect.
  *   **Collider:** If $T \to Z \leftarrow U \to Y$, conditioning on $Z$ opens a spurious path between $T$ and $Y$ through $U$, creating bias where none existed.
  *   **DAG (Collider):** $T \to Z \leftarrow U \to Y$. Conditioning on $Z$ induces a correlation between $T$ and $U$, biasing the estimate of $T$ on $Y$.

  ***

  # Marking Scheme (20 Marks)

  **Part (a): Verification (3 Marks)**
  *   **A (3):** Correctly calculates both stratum RDs ($+0.11$) and Aggregate RD ($-0.60$). Explicitly notes the imbalance in $N$ across strata drives the reversal.
  *   **B (2):** Correct calculations but fails to mention the weighting/imbalance mechanism.
  *   **C (1):** Arithmetic errors or only calculates one stratum.

  **Part (b): Impossibility (3 Marks)**
  *   **A (3):** States "Impossible." Explains that with equal weights, the marginal RD is the average of conditional RDs. Sign reversal is mathematically ruled out.
  *   **B (2):** States "Impossible" but gives a vague reason (e.g., "numbers don't add up") without referencing weights/averages.
  *   **C (1):** Claims it is possible (confuses OR non-collapsibility with RD).

  **Part (c): Non-Collapsibility (4 Marks)**
  *   **A (4):** Identifies "Non-collapsibility." Explicitly states this is **not bias** and occurs even in RCTs. Notes Marginal OR moves toward null.
  *   **B (3):** Identifies non-collapsibility but implies it might be a form of bias or fails to mention randomization protects against confounding here.
  *   **C (2):** Confuses this with Simpson's Paradox/Confounding.

  **Part (d): The Causal Crux (6 Marks)**
  *   **A (6):** Clearly states tables alone are insufficient. Identifies that $Z$'s causal role (Confounder vs. Non-confounder) determines the correct adjustment set. Mentions "backdoor path" or "DAG/Structure."
  *   **B (4):** States tables are insufficient but gives a vague reason (e.g., "we need more data") without specifying causal structure regarding $Z$.
  *   **C (2):** Claims the stratified table is *always* right (rote memorization of "Simpson's = Stratify") or the aggregate is *always* right.

  **Part (e): Colliders/Mediators (4 Marks)**
  *   **A (4):** Correctly identifies bias from conditioning on post-treatment variables. Distinguishes Mediator (blocks path) vs. Collider (opens path). Provides correct DAG.
  *   **B (3):** Correct DAG but weak explanation of *why* bias occurs (e.g., "it's bad to condition" without mechanism).
  *   **C (2):** DAG is incorrect (arrows wrong direction) or claims stratification is always safe.

  **General Grading Notes:**
  *   **A Range (17-20):** Demonstrates philosophical grasp of identification + statistical competence.
  *   **B Range (13-16):** Competent stats, but causal logic is slightly fuzzy (e.g., treats non-collapsibility as bias).
  *   **C Range (9-12):** Can do the arithmetic but relies on heuristics ("always stratify") rather than causal theory.
