          *   If "bind" means "give a reason," and reasons are internalist...
          *   If I don't know I have a reason, do I have it?
          *   Philosophical debate. But in political theory, obligations are often objective.
          *   I will stick with the Objective vs Epistemic distinction for (7), and the Rule vs Outcome distinction for (2).

      *   **Final check on Step (2)'s wording:** "That cannot be the requirement we want... A citizen's duty cannot be hostage to that."
          *   This is a normative claim masquerading as a logical necessity. It asserts what a duty *can* depend on.
          *   It is false. Duties often depend on contingent facts (e.g., duty to help depends on someone needing help).
          *   The "hostage" language is rhetorical.

