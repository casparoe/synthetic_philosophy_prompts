      *   **Ranking Premises:**
          1.  (3) Theorem (Cannot surrender).
          2.  (1) Normative Intuition (User wants to keep).
          3.  (5) Empirical Claim (User wants to avoid).
          4.  (2) The Bridge (The logical flaw).
          5.  (7) Epistemic Claim (Also flawed, but secondary to 2).

