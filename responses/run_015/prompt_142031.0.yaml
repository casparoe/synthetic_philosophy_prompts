          *   But user wants to keep "procedure which systematically rewards misrepresentation is defective."
          *   If I reject (1), I lose that.
          *   So I must defend (1) but attack (2)'s expansion of it.
          *   (1) is about the *actual* election. (2) makes it about the *rule*.
          *   Okay, ready to write.

