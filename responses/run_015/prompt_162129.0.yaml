answer: |-
  Here is the specification list for an adequate theory of precedent autonomy, designed for bedside or committee use, followed by the evaluation of your candidates and the internal tensions.

  ### The Specification List

  **Non-Negotiable Requirements (Functional/Operational)**
  These are required for the theory to function as a decision-making tool in a hospital or family setting.

  1.  **The Capacity Threshold Trigger:** The theory must specify the exact cognitive boundary where authority shifts from the current self to the prior self. It must distinguish the *Temporary Incapacity* case (delirium/surgery) from the *Permanent Transformation* case (dementia). If it cannot tell the difference between "I am confused today" and "I am a different person now," it is useless.
  2.  **The Epistemic Tolerance Limit:** The theory must provide a rule for vague directives ("no heroic measures") when they conflict with surrogate testimony ("Mom would want to fight"). It cannot demand perfect clarity; it must have a default position for ambiguity (e.g., *in dubio pro vita* vs. *strict construction*).
  3.  **The Asymmetry Account:** The theory must explain why a directive refusing treatment (negative right) is binding while a directive demanding futile treatment (positive right) is not. It cannot treat autonomy as symmetrical; it must integrate medical integrity or resource constraints into the authority model.
  4.  **The Temporal Distance Decay:** The theory must account for the *24-year-old vs. 84-year-old* case. A directive written 60 years prior must carry less weight than one written 6 months prior, all else being equal. The theory must specify the depreciation rate of precedent authority over time.

  **Preferences (Ideological/Weighting)**
  These are where ethical camps diverge. A theory can be adequate without satisfying these, but it must declare where it stands.

  5.  **The Suffering Weight (Preference):** How much does the current subject's pain or happiness count against the prior self's abstract values? In the *Contented Aunt* case, does her current joy outweigh her past fear of humiliation? Strict precedent autonomy says no; best interests says yes. An adequate theory must pick a side, not hedge.
  6.  **The Value-Drift Protocol (Preference):** How to handle the *Competent Repudiation* case (religious conversion). Does the new value system void the old directive immediately, or only when capacity is lost? This is a preference for how much we value consistency vs. growth.
  7.  **The Metaphysical Stance (Preference):** Does the theory rely on a "narrative self" (Dworkin) or a "psychological continuity" (Parfit)? While you asked for neutrality (see Candidate 3), most theories secretly presuppose one. An honest theory labels this.

  ---

  ### Evaluation of Your Candidates

  **Candidate 1: The Anti-Revocation Clause ("If I change my mind, ignore me")**
  *Verdict: Promote, but restrict scope.*
  A theory *must* handle this, because Ulysses contracts are the strongest argument for precedent autonomy. However, in dementia care, this clause is dangerous. If the patient is screaming in pain and the directive says "Ignore requests for pain relief, I will just be afraid of addiction," following the directive is abuse. The theory must distinguish between *protecting a life plan* (valid) and *inflicting suffering on a sentient being* (invalid). It should be binding in the *Competent Repudiation* case, but heavily scrutinized in the *Dementia* case.

  **Candidate 2: Grounds vs. Content Continuity**
  *Verdict: Throw out for practical use.*
  This is theoretically brilliant but operationally impossible. A hospital ethics committee cannot psychoanalyze whether a patient changed their mind because they learned new facts (dementia isn't humiliating) or because their values shifted (I don't care about humiliation anymore). Tracking *grounds* requires access to the patient's internal reasoning process, which is often lost in the very incapacity that triggers the directive. Demand this, and no directive is ever enforceable.

  **Candidate 3: Metaphysical Neutrality**
  *Verdict: Legitimate and Necessary.*
  It is not rigging the game; it is recognizing the job description. A bedside tool cannot wait for a resolution to the Ship of Theseus problem. If a theory requires a specific stance on personal identity to function, it fails the *Operational Clarity* requirement. It must work regardless of whether the 84-year-old is "the same person" as the 74-year-old, focusing instead on legal and ethical authority.

  ---

  ### The Turn: Where the List Breaks

  **The Conflicting Pair**
  The pair that cannot be jointly satisfied is **The Sovereignty Clause** (A competent person's say-so about their body binds full stop) and **The Sentience Constraint** (We owe a duty of care to the suffering/experiencing being in the bed).
  In your *Aunt Case*, these collide. The Sovereignty Clause demands withholding antibiotics to honor her plan for a "dignified exit." The Sentience Constraint demands treating the UTI because she is currently happy, loves her dog, and is not suffering the "humiliation" she feared. You cannot fully satisfy both. If you honor the directive, you risk killing a contented being. If you treat the infection, you violate the competent self's explicit command.

  **The Eliminator**
  The single requirement that eliminates the largest number of usual positions is: **The theory must yield a different verdict in the 'Contented Aunt' case than in the 'Standard Dementia' case.**
  Most standard legal and ethical frameworks treat advance directives as binary: they are either valid or invalid. They do not have a "contentment override." If you insist that a theory must allow current well-being to void a prior directive *only when the prior directive's conditions (humiliation) are not met*, you eliminate Strict Precedent Autonomy (which says the past self rules) and Simple Best Interests (which says the past self is irrelevant). It forces a hybrid view that almost no existing legal framework fully supports.

  ---

  ### Family Evaluation Against the List

  **1. Strict Precedent Autonomy (The "Earlier Self Speaks" View)**
  *Performance:* Fails the *Contented Aunt* and *Temporal Distance* requirements. It treats the 79-year-old aunt as merely the biological vessel for the 73-year-old's wishes. It handles the *Ulysses* case well but collapses when the present self is happy. It cannot explain the *Asymmetry* without importing external rights theory.
  *Verdict:* Too rigid for the bedside; risks harming the present subject.

  **2. Current Best Interests (The "Person in the Bed" View)**
  *Performance:* Fails the *Temporary Incapacity* and *Ulysses* cases. If we only care about the person in the bed, we cannot consent to surgery for a delirious patient who is currently resisting, nor can we bind an addict to their prior wish for detox. It renders all advance directives advisory only.
  *Verdict:* Too fluid; undermines the concept of planning.

  **3. Hypothetical Endorsement (The "Would They Agree Now?" View)**
  *Performance:* Fails the *Epistemic* and *Dementia* cases. We cannot know what the demented aunt *would* endorse if she were competent; we are guessing. In the *Standard Dementia* case, this becomes a circular justification for whatever the family wants. It lacks *Operational Clarity*.
  *Verdict:* Theoretically smooth, practically useless in a crisis.

  **4. Graded Psychological Continuity (The "Overlap" View)**
  *Performance:* Best fit for *Temporal Distance* and *Competent Repudiation*. It allows authority to fade as the person changes. However, it fails the *Metaphysical Neutrality* and *Operational Clarity* requirements. A nurse cannot measure "psychological connectedness" in real-time. It requires a philosophical assessment at the bedside.
  *Verdict:* Most accurate, least usable.

  **Summary:** Your argument with your friend stalled because you were arguing from different requirements. He was prioritizing *Sovereignty* (Non-negotiable for him); you were prioritizing *Sentience* (Non-negotiable for you). An adequate theory must admit these conflict and provide a tie-breaker rule, likely based on whether the *conditions* triggering the directive (humiliation) are actually present.
