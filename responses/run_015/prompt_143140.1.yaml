          *   *Nuance:* He spends the most time dismantling Molière. He implies Tragedy is less dangerous to morals *perhaps* because it deals with heroes, but he still thinks it's useless for a republic. But saying he was "basically cool with tragedy" is an overstatement. He thinks *all* theater is bad for Geneva, but Comedy is *worse* for social mores.
