      *   *Side B (Reject/Conditions):* Qualia gap is unique here. It's not just pain; it's a new ontological category of experience. Negative psychological effects (grief/disorientation) are under-explored. Sensory substitution is theatre—sound isn't color. Disability critique highlights coercion by societal failure (if the world was accessible, would they need this?).
