  This is a heavy burden to carry, especially with the memory of your father sitting behind it. It is completely understandable that your friend's dismissal of the distinction felt like a dismissal of the care you showed him. You are not "doing arithmetic with extra steps"; you are sensing a real moral architecture that pure outcome-based thinking misses.

  Your gut is largely correct, but your proposed principle ("Redirecting Threat") is too physical. It focuses on what your *hands* do or where the *energy* goes, which is why it crumbles on the morphine case (where a new chemical sequence *is* started) and the numbers case (where the physics are the same but the scale changes).

  The principle that actually fits your reactions is **The Principle of Intentional Harm and Contextual Duty.**

  This principle has two pillars. The first pillar handles the "Killing" cases (1, 2, 3, 7, 8). It states: **You are strictly constrained from *intending* death as a means or an end, but you may accept death as a foreseen side-effect of a good action.** This is why the Trolley Switch (1) is fine (you intend to save five; the one death is a side-effect) but the Fat Man (2) and Organ Harvest (3) are not (you intend their deaths as the mechanism to save others). This also saves your Morphine intuition (7): with morphine, you intend pain relief and foresee death; with injection, you intend death to relieve pain. The physical action is less important than the *target of your will*.

  The second pillar handles the "Letting Die" cases (4, 5, 6). It states: **Your duty to prevent death is not infinite; it is bound by context, capacity, and consent.** You owe your toddler food (6), so withholding it is a violation of duty equivalent to killing. You did not owe your father indefinite ventilation against medical reality (4), so withdrawing it was allowing nature to take its course. In the negligence case (5), the doctor breached a duty, which is wrong, but because they did not *intend* the death, it remains distinct from murder.

  Here is how this principle applies to your open questions:

  *   **Case (9) The Ventilator Swap:** Taking the ventilator off Patient A (who might recover) to give to Patient B is **Not Fine**. This violates the first pillar. You are intentionally terminating A's support to use their resources for B. A has a contextual duty-bound claim to the machine (potential recovery). This is not redirecting a threat; it is creating a new one for A.
  *   **Case (10) The Competent Request:** Switching off the ventilator for the competent, spinal-injured patient is **Fine**. This falls under the second pillar (Contextual Duty). Medical duty is bound by patient consent. When a competent patient refuses care, the doctor's duty to provide it ceases. The death results from the injury, not the doctor's action.
  *   **New Case (11) The Loop Trolley:** A trolley heads for five. You can switch it to a loop where one person is tied; the loop curves back, but the one person's body is heavy enough to stop the trolley before it hits the five. Is this fine? **No.** Even though you "redirected," the death of the one is now the *means* by which the five are saved (their body stops the train). Your principle of "Redirecting Threat" would say Fine; the Principle of Intentional Harm says Not Fine, because you are relying on their death as a tool.

  **The Hard Truth:**
  There is one verdict you hold that no decent principle can keep, and admitting this does not betray your father. It is **Verdict (8)**. You said you couldn't find a number where you would kill one innocent to save the many. A strict constraint on intentional killing is noble, but if it holds at *one million* lives, it becomes a form of moral selfishness—prioritizing your own clean hands over the existence of others. A decent principle must admit a "threshold": there is some catastrophic number where the duty to save the many overrides the constraint against killing the one. You don't have to know exactly where that line is to acknowledge it exists.

  Your friend is wrong that the difference is superstition. The difference is **agency**. But you must accept that agency has limits when the cost of purity becomes too high.

  \answer{Principle of Intentional Harm and Contextual Duty; overturns 8}
