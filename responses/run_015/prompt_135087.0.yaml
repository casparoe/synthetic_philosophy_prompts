answer: |-
  # Which Aggregator Are You?
  ### A Diagnostic for Contractualists

  **Instructions:** Read each case and select the option that best matches your intuitive judgment. Do not worry about consistency yet; just answer as the case strikes you. At the end, use the Key to locate your position in the logical space.

  ---

  ### The Cases

  **1. The Itch and the Wrist (Inter-Personal)**
  A policy will either spare one person a broken wrist or spare 10,000 people a barely noticeable itch that lasts an hour. You must choose which policy to implement.
  *   **A.** Spare the wrist. The severity of the break outweighs the sum of the itches.
  *   **B.** Spare the itches. 10,000 minor burdens sum to more than one major burden.
  *   **C.** It is impermissible to compare them; you must flip a coin or treat the claims as equal.

  **2. The Itch and the Wrist (Intra-Personal)**
  The same 10,000 itches and the one broken wrist will all happen to *the same single person* over the course of a year. You can prevent either the wrist or the itches.
  *   **A.** Prevent the wrist.
  *   **B.** Prevent the itches.
  *   **C.** It is up to the person; there is no moral fact of the matter.

  **3. The Risky Policy**
  Option A imposes a 100% certainty of serious injury on one identified person. Option B imposes a 1-in-10,000 risk of the same injury on each of 10,000 different people.
  *   **A.** Option A is worse. Concentrated certainty is worse than distributed risk.
  *   **B.** Option B is worse (or equal). The expected number of injuries is the same, so the distribution doesn't save it.
  *   **C.** Option A is worse, but only because the person is identified. If they were anonymous, it wouldn't matter.

  **4. The Benefit Tradeoff**
  You can either save one person from death or provide a significant but non-life-saving benefit (e.g., curing a chronic migraine) to 10,000 people.
  *   **A.** Save the life. Death is lexically worse than migraines.
  *   **B.** Cure the migraines. The total welfare gain is higher.
  *   **C.** Save the life, unless the migraine cure is the only way to keep society functioning (context matters).

  **5. The Spectrum**
  One person will lose a leg. Alternatively, *N* people will each lose the tip of one fingertip. At what value of *N* does it become permissible (or required) to let the leg be lost to spare the fingertips?
  *   **A.** Never. A leg is lexically more important than fingertips.
  *   **B.** At some very high number (e.g., 1 million).
  *   **C.** At a moderate number (e.g., 1,000).
  *   **D.** Immediately (e.g., N=2).

  **6. The Repeated Choice**
  You face a choice: Save one person from death, or give 100 people a pleasant weekend trip. You face this exact choice five times in a row, with different people each time.
  *   **A.** Save the life every time.
  *   **B.** Save the life the first few times, but switch to the trips if the deaths pile up.
  *   **C.** Calculate the total: 5 lives vs. 500 trips. If the trips win, take them all.

  **7. Chances vs. Burdens**
  Scenario X: 100 people each definitely lose $10. (Total loss: $1,000).
  Scenario Y: 100 people each face a 1% chance of losing $1,000. (Expected loss: $1,000).
  Scenario Z: 1 person definitely loses $1,000.
  *   **A.** Z is worse than X; X is worse than Y. (Certainty > Actual Burden > Risk).
  *   **B.** Z is equal to Y; both are worse than X. (Expected Value matters, actual small burdens don't sum).
  *   **C.** X is worse than Z; Y is negligible. (Small actual burdens sum; risks do not).

  **8. The Tie-Breaker**
  One person will die in Option A. One person will die in Option B, *plus* 1,000 people will get a mild headache.
  *   **A.** It is impermissible to choose B. The headache complaints cannot be aggregated against the death.
  *   **B.** Choose A. The headaches break the tie between the two deaths.
  *   **C.** Flip a coin. The death complaint swamps the headaches, making them irrelevant.

  **9. The Threshold**
  One person will die. Alternatively, 10,000 people will each break an arm.
  *   **A.** Prevent the death. Life is above the threshold where numbers count.
  *   **B.** Prevent the arms. 10,000 broken arms cross the threshold to outweigh a death.
  *   **C.** It depends on whether the arm injuries are permanent.

  **10. The Identity Restriction**
  Case 1: You can help Group A (100 people) or Group B (100 different people).
  Case 2: You can help Group A (100 people) or Group A (the same 100 people) at a later time.
  *   **A.** The moral requirement is the same in both cases.
  *   **B.** You have a stronger obligation in Case 2 because it is the same people.
  *   **C.** You have a stronger obligation in Case 1 because you are spreading benefit across more "lives."

  ---

  ### The Scoring Key

  Do not count points. Instead, look for the **Pattern** that matches your answers. Most people will not fit perfectly; find the "Leaf" that captures your dominant intuitions.

  #### **Branch 1: The Intra/Inter Split (Compare Q1 & Q2)**
  *   **If Q1=B (Sum Across) and Q2=B (Sum Within):** You are a **Summative Aggregator**. Proceed to Branch 2.
  *   **If Q1=A/C (No Sum Across) and Q2=B (Sum Within):** You are an **Intra-Personal Aggregator**. (Leaf 4).
  *   **If Q1=A/C and Q2=A/C:** You are a **Non-Aggregator**. Proceed to Branch 3.

  #### **Branch 2: Severity & Thresholds (For Summative Aggregators)**
  *   **If Q5=A (Never swap leg for fingertips) OR Q9=A (Death always trumps arms):** You are a **Lexical/Severity-First Aggregator**. (Leaf 5).
  *   **If Q5=B (High number) OR Q9=A but Q4=B:** You are a **Threshold Aggregator**. Numbers count, but only above a significance floor. (Leaf 6).
  *   **If Q5=D/C (Low number) AND Q4=B:** You are a **Full Aggregator** (Utilitarian-leaning). (Leaf 1).

  #### **Branch 3: Risk & Chances (For Non-Aggregators & Tie-Breakers)**
  *   **If Q3=B (Risks sum like outcomes) AND Q7=B (Expected Value rules):** You are an **Ex-Ante Aggregator**. You reject summing actual small burdens but accept summing probabilities. (Leaf 2).
  *   **If Q8=B (Headaches break the tie):** You are a **Tie-Breaker Contractualist**. Numbers count only when the primary complaints are equal. (Leaf 3).
  *   **If Q3=A AND Q8=A/C:** You are a **Strict No-Aggregator**. (Leaf 7).

  #### **Branch 4: Iteration & Identity (The Refinements)**
  *   **If Q6=B (Switch after repetition):** You hold an **Iterative View**. Aggregation is forbidden in a single choice but permissible over time. (Leaf 9: Unnamed).
  *   **If Q10=B (Same people matter more):** You hold a **Person-Affecting Restriction**. (Leaf 8).

  ---

  ### The Leaves (Positions)

  1.  **Full Aggregator:** Sums benefits and burdens across people and within lives. Severity is just another number. (Matches: Q1-B, Q2-B, Q4-B, Q5-C/D).
  2.  **Ex-Ante Aggregator:** Actual small burdens do not sum, but probabilities do. Distributed risk is morally equivalent to concentrated harm. (Matches: Q1-A, Q3-B, Q7-B).
  3.  **Tie-Breaker:** Numbers cannot override a stronger individual complaint, but they can decide between equal complaints. (Matches: Q1-A, Q8-B).
  4.  **Intra-Only:** Aggregation is coherent within a single life (prudence) but incoherent across lives (morality). (Matches: Q1-A, Q2-B).
  5.  **Severity-First (Lexical):** Certain harms (death, loss of limb) are in a different category than minor harms. No number of minor harms sums to a major one. (Matches: Q5-A, Q9-A).
  6.  **Threshold:** Numbers count, but only once the individual burdens reach a certain level of significance (e.g., broken bones count, itches don't). (Matches: Q1-A, Q9-B).
  7.  **Strict No-Aggregation:** Each person counts for one, none for more than one. Numbers are morally irrelevant. (Matches: Q1-C, Q3-A, Q8-C).
  8.  **Person-Affecting:** Moral weight depends on whether the same individuals are affected across options. (Matches: Q10-B).
  9.  **Iterative Aggregator (Unnamed):** Aggregation is impermissible in a single act but permissible (or required) over a sequence of choices. (Matches: Q6-B).

  ---

  ### Logical Space & Empty Cells

  The quiz is built on four binary branch questions:
  1.  **Inter-personal Summation:** Do burdens sum across people? (Yes/No)
  2.  **Intra-personal Summation:** Do burdens sum within a life? (Yes/No)
  3.  **Risk Aggregation:** Do chances sum like outcomes? (Yes/No)
  4.  **Severity Constraint:** Does severity block summation? (Yes/No)

  **Empty Cells:**
  *   **Inter-Yes / Intra-No:** (Sum across people, but not within a life). This cell is empty because it is metaphysically unstable. If burdens can be compared and summed across distinct consciousnesses, it is hard to explain why they cannot be summed within a single consciousness that persists over time. Usually, if you accept inter-personal aggregation, you accept intra-personal aggregation *a fortiori*.
  *   **Risk-Yes / Outcome-No:** (Chances sum, actual burdens don't). This is **not** empty; it is the **Ex-Ante Aggregator** (Leaf 2). This is a stable and popular position in modern contractualism (e.g., Harsanyi-style or ex-ante Scanlonian).
  *   **Severity-Yes / Threshold-No:** (Lexical priority without a threshold). This is **Leaf 5**. It is distinct from the Threshold view because it posits a qualitative gap, not a quantitative floor.

  ---

  ### Instrument Notes & Limitations

  **Indistinguishable Leaves:**
  This instrument cannot reliably distinguish between the **Tie-Breaker (Leaf 3)** and a **Very High Threshold (Leaf 6)**. If your threshold for aggregation is "death," you will answer identically to someone who believes numbers only matter as tie-breakers in death-vs-death cases. To separate these, one would need a case involving "Death vs. Death + Trivial Burden" vs. "Death vs. Death + Moderate Burden," which creates survey fatigue.

  **Weakest Link:**
  **Question 10 (Identity Restriction)** does the least work. Person-affecting views are notoriously difficult to isolate in a quiz format because they often collapse into No-Aggregation views in non-identity cases. A "Yes" here might just indicate a bias toward consistency rather than a committed Person-Affecting Principle.

  **Lowest Confidence Leaf:**
  I am least confident in the stability of **Leaf 9 (Iterative Aggregator)**. While intuitively attractive (it feels worse to kill 5 people one-by-one than to choose a policy that kills 5 at once), it is vulnerable to the "Iteration Argument": if it's right to choose the trips the 5th time, why wasn't it right the 1st time, knowing you'd face the choice 5 times? This position often collapses into Full Aggregation or Strict No-Aggregation upon reflection.

  **Missing Position:**
  If a user answers **Q1=A** (No Inter), **Q2=A** (No Intra), but **Q6=B** (Switch on Repetition), they occupy a space the tree calls "Iterative," but might better be described as **"Diachronic Aggregation."** This view holds that aggregation is forbidden synchronically (at a time) but permitted diachronically (over time). If you see a cluster of users here, the logical space needs a fifth branch: *Temporal Scope of Aggregation.*
