answer: |-
  The morning light in Ward 4B fell in strict rectangles across the linoleum. Elena moved through them without breaking stride. She was the standard by which the shift lead measured the hour. While others consulted charts twice, Elena scanned a wristband and knew the name before the beep confirmed it. She never hesitated. She never explained. Her tray was always organized by the time the wheels stopped turning. To the patients, she was a comfort; to the staff, she was a clock.

  Julian, two bays down, was different. He hummed. He dropped a pill cup, watched it skitter under a bed, and laughed. "Gravity wins again," he told the patient, retrieving it with a flourish. The patient smiled. Julian's errors were visible, bright things that he swept away with a joke. He looked adaptable. He looked like a man making choices. Elena looked like a law of physics.

  The medication room smelled of alcohol and sharp plastic. Elena stood at Station 3. The morning round required Heparin flushes for rooms 304 through 310. She laid out the syringes. Left to right: saline, Heparin, gauze. This was the order printed on the drawer label. This was the order her hands expected.

  In 304, Mr. Henderson waited. Elena entered. She scanned his wrist. The screen glowed green. She turned to her caddy. Her hand went to the middle slot for the Heparin. The slot was empty.

  Someone had restocked the bin ten minutes prior. The Heparin syringes were there, but tucked behind the gauze pads, obscured by the white fluff. A small displacement. A negligible error in the world, but a missing variable in the sequence.

  Elena did not look around the room. She did not call out. She looked at the empty slot. She lowered her hand to the clipboard hanging from her waist. She ran her finger down the Medication Administration Record. Heparin flush, 1000 units, scheduled 0900. Verified.

  She looked back at the middle slot. Empty.

  She lifted the clipboard again. She checked the patient's name against the record. Henderson, Robert. Verified. She looked back at the slot. Her brow did not furrow. She did not sigh. She was simply re-confirming the data. This was the protocol for discrepancy: verify order, verify patient, verify supply.

  She placed the clipboard down on the bedside table. She picked it up. She checked the record again. Henderson. Heparin. 0900. She looked at the slot. The white gauze behind it shifted slightly in the air conditioning draft, but the syringe remained hidden.

  Across the hall, Julian dropped a vial. It didn't break. He caught it against his thigh. "Smooth," he said to the Charge Nurse, Mrs. Gable. Mrs. Gable shook her head, smiling. Julian was managing the chaos. He was present. Elena was standing still in Room 304, her hand hovering over the empty plastic divot, her eyes moving between the paper and the tray.

  Mrs. Gable watched Elena from the doorway. The med pass window was closing in twelve minutes. Delays meant documentation. Documentation meant review. Elena was the one who never needed review. Now, she was stuck on a single step.

  Elena put the clipboard down. She picked up the saline syringe from the left slot. She held it. She put it back. She picked up the clipboard. She checked the time. 09:04. She looked at the slot. She was not panicked. She was being careful. To omit the check would be negligence. To proceed without the item was impossible. So she checked again.

  Verify order. Look at slot. Verify patient. Look at slot.

  The loop was tight. Every action was correct. Every action was useless. She was maximizing diligence in a space that required search. But search was not in the procedure. Verification was. So she verified.

  Julian walked past the door. He was carrying a stack of linen. He bumped the frame. The vibration traveled through the wall. The bedside table shivered. The clipboard slid an inch. The paper rustled. The movement jostled the caddy. The gauze pads shifted, revealing the blue hub of the hidden syringe.

  Elena's eyes caught the blue. She reached behind the gauze. She retrieved the syringe. She administered the flush. She scanned the barcode. She signed the record. She left the room. Her pace was unchanged. Her face was unreadable.

  Mrs. Gable made a note on her own board. She watched Julian drop a stack of towels down the hall and heard him laugh. She watched Elena disappear into 305, perfectly on time.

  The ward settled. The light shifted on the floor. No one knew what had happened in 304. No one knew what had fixed it.

  ***

  **Note**

  **Fit-invisibility** is established in the opening contrast: Elena's flawless, unhesitating flow versus Julian's visible errors and recoveries, which make him appear adaptable and "free." **Second-order rigidity** appears when the syringe is missing; Elena does not search but enters a loop of re-verifying the record and checking the empty slot, each step locally correct but globally futile. The **skeptic's evidence** for choice is the moment Elena sees the blue hub and acts; however, since the reveal was caused by an external vibration she did not initiate, it remains ambiguous whether she chose to look or simply reacted to the changed visual field.
