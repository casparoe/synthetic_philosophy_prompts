  Here's a thinking process that leads to the consistency audit:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on collective intentionality and social ontology.
      *   **Task:** Consistency audit of an 8-point philosophical package.
      *   **Constraints:** Identify genuine tensions vs. apparent conflicts, rank tensions by severity, propose least costly revisions + costs, trace commitments precisely, no lecturing/reading lists.
      *   **Input:** 8 specific commitments (i-viii).

  2.  **Deconstruct the 8 Commitments:**
      *   (i) *Reductionist Shared Intention:* Bratmanian (interlocking I-intentions, mutual responsiveness, commitment). No primitive we-intention.
      *   (ii) *Necessity of Shared Intention:* Joint action *requires* (i). Parallel action + common knowledge $\neq$ joint action.
      *   (iii) *Non-derivative Collective Responsibility:* Collective agents (corps, states) bear *genuine* moral responsibility, not just aggregate individual wrongs.
      *   (iv) *Phenomenological We-Mode:* "We-feeling" is real phenomenologically but ontologically weightless (reducible).
      *   (v) *Reductionist Institutional Facts:* Collective acceptance = individual acceptance + common belief. No irreducible collective acceptance.
      *   (vi) *Unilateral Veto:* Any participant can dissolve joint action unilaterally without betraying a *collective-level* obligation (only individual change of mind).
      *   (vii) *Asymmetric Joint Action:* Director/Complier counts as joint if responsive. Responsibility lies primarily with Director.
      *   (viii) *Anti-Gilbert:* Plural subjecthood not necessary for joint action; just stable interlocked intention.

  3.  **Initial Scan for Obvious Conflicts:**
      *   (i) + (iii): Reductionist intentionality vs. Non-derivative collective responsibility. This is the classic "ontological free lunch" problem. If the collective is just individuals interlocking, how can the *collective* bear responsibility that isn't just the sum of individuals?
      *   (ii) + (vi): Joint action requires shared intention (commitments to mutual support), but anyone can quit unilaterally without collective betrayal. Does the "commitment to mutual support" in (i) survive the "unilateral veto" in (vi)?
      *   (iii) + (v): Non-derivative responsibility for collective agents vs. Reductionist institutional facts. If institutional facts (which create collective agents) are reducible to individual attitudes, can the resulting agent have non-derivative properties?
      *   (vii) + (i)/(vi): Asymmetric action fits Bratman? Does the "complier" have the same interlocking intentions? Who holds the veto?

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension 1: The Responsibility Gap (i, iii, v)**
          *   *Analysis:* (i) and (v) are thoroughly reductionist/individualist. The collective is nothing over and above the individuals + common knowledge. (iii) claims collective responsibility is *non-derivative*. Usually, non-derivative responsibility requires a non-derivative agent (or at least a robust ontological status). If the corporation is just individuals accepting rules (v), and their intentions are just interlocking I-intentions (i), where does the *non-derivative* fault lie? If it's non-derivative, it can't be fully explained by the individuals. But (i) and (v) say everything *is* fully explained by individuals.
          *   *Severity:* High. This looks like a straight contradiction. You can't have ontological reductionism about the agent and ontological realism about the agent's properties (responsibility).
          *   *Revision:* Either soften (iii) to derivative responsibility or soften (i)/(v) to allow emergent normative status.
          *   *Cost:* Softening (iii) loses the punch of holding corporations accountable distinct from shareholders. Softening (i)/(v) abandons the core individualist ontology.

      *   **Tension 2: The Commitment/Veto Clash (i, ii, vi)**
          *   *Analysis:* (i) defines shared intention as including "commitments to joint activity and mutual support." (ii) says this is *required* for joint action. (vi) says any participant can unilaterally veto/dissolve without betraying a *collective-level obligation*.
          *   *Conflict:* If I have a commitment to mutual support (i), and I quit unilaterally, haven't I violated that commitment? (vi) says no, because there is no collective-level obligation. But if the commitment in (i) is just an individual intention to support, does quitting violate *that* individual intention? Bratman usually argues that shared intention creates normative constraints *between* participants. (vi) denies collective obligations but admits individual change of mind.
          *   *Nuance:* Bratmanian commitments are often defeasible. However, (vi) says exercising the veto is *never* a betrayal of a collective-level obligation. This aligns with (i) (no primitive we-intention), but it threatens the stability required for (iii) (collective responsibility). If anyone can quit without collective blame, can the collective be responsible for long-term outcomes?
          *   *Severity:* Medium-High. It threatens the coherence of "commitment" in (i).
          *   *Revision:* Clarify that the commitment in (i) is conditional on others' participation, or that the "obligation" is interpersonal (individual-to-individual) rather than collective-level.
          *   *Cost:* Weakens the normative force of joint action.

      *   **Tension 3: Asymmetry and Interlocking Intentions (i, vii)**
          *   *Analysis:* (i) requires interlocking intentions and mutual responsiveness. (vii) allows asymmetric joint action (Director/Complier).
          *   *Conflict:* In a strong hierarchy, does the Complier intend the *joint* activity in the same way? Or do they just intend to obey? If they just intend to obey, is it Bratmanian shared intention? Bratman requires meshing subplans. If the Director dictates subplans, do they mesh? Yes. But (vii) assigns primary responsibility to the Director. (i) implies shared responsibility via mutual support.
          *   *Severity:* Low-Medium. Bratmanian accounts can handle hierarchy (e.g., orchestra conductor). The tension is more about how "mutual" the responsiveness is.
          *   *Revision:* Specify that "responsiveness" in (i) includes hierarchical responsiveness.
          *   *Cost:* Stretches the definition of "mutual."

      *   **Tension 4: Institutional Facts and Collective Agents (iii, v)**
          *   *Analysis:* (v) says institutional facts are reducible to individual acceptance. (iii) says collective agents (created by institutional facts) have non-derivative responsibility.
          *   *Conflict:* Similar to Tension 1. If the *status* of the collective is derivative (v), can its *responsibility* be non-derivative (iii)?
          *   *Severity:* High (Subset of Tension 1).
          *   *Revision:* Distinguish ontological reduction from normative emergence.
          *   *Cost:* Requires a meta-ethical move (normative properties don't supervene strictly on ontological reduction).

  5.  **Ranking and Refining:**

      *   *Rank 1 (Fatal):* (i) + (v) vs. (iii). Ontological Reductionism vs. Non-derivative Normativity. You can't reduce the agent to individuals and then claim the agent has properties the individuals don't have (in a non-derivative sense).
      *   *Rank 2 (Structural):* (i) + (ii) vs. (vi). The nature of Commitment. If shared intention requires commitment to mutual support, unilateral withdrawal looks like a breach of that individual intention, even if not a "collective" obligation. (vi) tries to dodge this by denying collective obligations, but (i) posits interpersonal commitments.
      *   *Rank 3 (Descriptive):* (vii) vs. (i). Hierarchy vs. Mutuality. Manageable with clarification.
      *   *Rank 4 (Phenomenological):* (iv) is mostly compatible with (i), (v), (viii). It's the safety valve.

  6.  **Drafting the Audit:**
      *   *Structure:* Introduction (acknowledge the package), Ranked Tensions (1 to 3), Apparent Conflicts (dissolved), Conclusion/Summary of Revision Costs.
      *   *Tone:* Professional, analytical, direct. No fluff.
      *   *Focus:* Trace commitments. Don't lecture on Bratman/Gilbert/Searle, use them only as reference points for the user's claims.

      *   *Refining Tension 1 (The Ontology/Normativity Mismatch):*
          *   Commitments: (i) Reductionist intention, (v) Reductionist institutions, (iii) Non-derivative responsibility.
          *   Problem: Non-derivative responsibility implies a non-derivative agent or at least a normative structure that isn't exhausted by the sum of parts. (i) and (v) exhaust the parts.
          *   Revision: Make responsibility "distributed but non-aggregative" (still derivative but not simple sum) OR accept ontological emergence for collective agents only (drop (v) for agents).
          *   Cost: If you keep (i)/(v), (iii) must be rephrased as "corporate responsibility is a distinct *type* of individual responsibility distribution," which sounds like wordplay. If you keep (iii), you need (v) to allow for irreducible collective acceptance for *agents* specifically.

      *   *Refining Tension 2 (The Veto/Commitment Paradox):*
          *   Commitments: (i) Commitment to mutual support, (vi) Unilateral veto without betrayal.
          *   Problem: If I intend to support you, and I quit, I frustrate my own intention. (vi) says this isn't a betrayal of collective obligation (consistent with (i)), but it creates instability for (iii). If members can exit without collective blame, can the collective be blamed for persisting harms?
          *   Revision: Qualify (vi). Veto is possible but incurs *interpersonal* liability (to specific partners), just not *collective* liability.
          *   Cost: Complicates the clean individualism of (vi).

      *   *Refining Tension 3 (Asymmetry):*
          *   Commitments: (i) Mutual responsiveness, (vii) Asymmetric responsibility.
          *   Problem: Does the complier share the intention enough to count as joint action under (i)?
          *   Resolution: Bratman allows hierarchy. The tension is minor.

  7.  **Final Review against Constraints:**
      *   Rank tensions? Yes.
      *   Least costly revision + cost? Yes.
      *   Trace commitments? Yes.
      *   No lecturing? Yes.
      *   Treat all as live? Yes.

      *Self-Correction on Tension 1:* Is "non-derivative responsibility" strictly incompatible with reductionist ontology? Some argue yes (List & Pettit), some no. But the prompt says "fault is genuinely at the collective level, not merely an aggregate." If the collective is *just* individuals + common belief (v), then the fault *must* be located in the individuals or the pattern. If it's located in the pattern, is it non-derivative? If the pattern is reducible, the property is usually considered derivative. I will flag this as the strongest tension because it risks incoherence in the metaphysics of norms.

      *Self-Correction on Tension 2:* Bratman's "commitment" is not a moral obligation per se, but a constraint on rationality. (vi) talks about "collective-level obligation." These can be distinguished. However, (i) says "commitments to... mutual support." If I drop out, do I violate the commitment? Bratman says shared intention creates a normative landscape. (vi) denies collective obligation. This needs careful parsing. The tension is between the *normative force* implied in (i) and the *voluntarism* in (vi).

      *Let's finalize the ranking.*
      1. Ontology vs. Responsibility (i, v vs iii).
      2. Commitment vs. Veto (i vs vi).
      3. Asymmetry vs. Mutuality (i vs vii).
      4. (iv) and (viii) are mostly consistent with the reductionist core.

      *Wait, one more check:* (ii) says joint action *requires* shared intention. (vii) says asymmetric action counts as joint. Does asymmetric action allow for Bratmanian shared intention? Yes, if the complier intends to do their part because the director intends the whole. This is consistent.

      *Okay, ready to write.*
answer: |-
  ### Consistency Audit: Collective Intentionality Package

  Your package is a robust, methodologically individualist framework that attempts to secure strong normative conclusions (non-derivative responsibility) from weak ontological premises (reductionist intentionality). This creates a specific structural vulnerability: you are trying to derive emergent normative properties from reducible ontological bases.

  Below are the tensions ranked by severity, followed by an analysis of apparent conflicts that dissolve on inspection.

  ---

  ### I. Critical Tensions (Ranked by Severity)

  #### 1. The Ontology-Normativity Mismatch (Severity: Fatal)
  **Conflicting Commitments:** (i), (v) vs. (iii)
  *   **The Conflict:** (i) and (v) assert a thoroughgoing ontological reductionism: shared intentions are interlocking I-intentions, and institutional facts are individual acceptances + common belief. There is no "collective thing" over and above the individuals. However, (iii) asserts that collective agents bear *non-derivative* moral responsibility.
  *   **Why it breaks:** Non-derivative responsibility typically requires a non-derivative agent or a normative structure that is not exhausted by the sum of its parts. If the corporation is *nothing but* individuals accepting rules (v), and their intentions are *nothing but* interlocking I-intentions (i), then any fault located at the collective level must be derivative of the faults or configurations of those individuals. To claim the fault is "genuinely at the collective level" while denying the collective any ontological weight beyond individuals creates a category error. You are positing an emergent normative property on a reducible ontological base without explaining the supervenience mechanism.
  *   **Least Costly Revision:** Revise (iii) to claim **distributed but non-aggregative responsibility**.
  *   **The Cost:** You lose the rhetorical and legal punch of "the corporation itself is to blame." You must argue that the *pattern* of individual responsibilities constitutes a distinct *type* of fault, even if it is ontologically derivative. This requires a complex meta-ethical defense to distinguish "non-aggregative" from "non-derivative."
  *   **Alternative Revision:** Revise (v) to allow **irreducible collective acceptance for institutional agents only**.
  *   **The Cost:** You abandon pure methodological individualism for social ontology. You must accept that while *shared intention* (i) is reducible, *institutional status* (v) is not. This creates a disunified ontology (two different metaphysical rules for two types of collective phenomena).

  #### 2. The Commitment-Veto Paradox (Severity: High)
  **Conflicting Commitments:** (i) vs. (vi)
  *   **The Conflict:** (i) defines shared intention as including "commitments to joint activity and mutual support." In Bratmanian terms, these commitments create normative constraints on individual deliberation (you cannot simply drop the intention without rational cost). However, (vi) grants a unilateral veto power where exercising it is "never a betrayal of a collective-level obligation."
  *   **Why it breaks:** If I have a commitment to mutual support (i), and I unilaterally dissolve the activity (vi), I have frustrated my own commitment. While (vi) correctly notes there is no *collective* entity to betray (consistent with (i)), it ignores the *interpersonal* obligations generated by the interlocking intentions in (i). If I promise to support your sub-plan as part of our mesh, and I quit without cause, I violate the individual intention I formed in (i). (vi) implies the commitment is illusory or instantly revocable without normative residue, which undermines the stability required for (iii) (collective responsibility). If members can exit without collective blame, the collective cannot reliably bear responsibility for persistent outcomes.
  *   **Least Costly Revision:** Qualify (vi) to admit **interpersonal liability**.
  *   **The Cost:** You must concede that while there is no *collective-level* obligation, there are *individual-to-individual* obligations generated by the interlocking intentions. Exercising the veto is permissible but may constitute a breach of duty to specific partners, requiring restitution. This complicates the clean voluntarism of (vi).

  #### 3. Asymmetry vs. Mutuality (Severity: Moderate)
  **Conflicting Commitments:** (i) vs. (vii)
  *   **The Conflict:** (i) requires "mutual responsiveness" and "commitments to mutual support." (vii) allows for asymmetric joint actions where one directs and another complies, with primary responsibility on the director.
  *   **Why it breaks:** In highly asymmetric cases (e.g., coercive-looking hierarchies), the "complier" may not intend the *joint activity* but merely intend to *obey*. If the complier's intention is merely "I intend to do X because you told me to," rather than "We intend to do Y," it risks failing the "mutual responsiveness" test in (i). Furthermore, if responsibility is primarily with the director (vii), it strains the "mutual support" commitment in (i), which implies shared normative burden.
  *   **Least Costly Revision:** Clarify (i) to include **hierarchical responsiveness**.
  *   **The Cost:** You must stretch the definition of "mutual." You need to argue that responding to a directive *is* a form of responsiveness to the other's intention, and that "mutual support" can be satisfied by role-fulfillment even if the roles are unequal. This risks making (i) so flexible it loses its discriminatory power against mere parallel action.

  ---

  ### II. Apparent Conflicts (Dissolve on Inspection)

  #### 1. Phenomenology vs. Reductionism (iv) vs. (i), (v)
  *   **Apparent Conflict:** How can the "we-mode" be phenomenologically real (iv) if it is ontologically weightless (i, v)?
  *   **Resolution:** This is consistent. You are distinguishing *experience* from *metaphysics*. Just as a "solid table" feels solid but is ontologically mostly empty space, the "we" can feel primitive while being constituted by interlocking I-intentions. (iv) acts as a safety valve for your reductionism, acknowledging the data of experience without conceding ontological ground. No revision needed.

  #### 2. Anti-Gilbert vs. Shared Intention (viii) vs. (i), (ii)
  *   **Apparent Conflict:** If you deny plural subjecthood (viii), how do you sustain the necessity of shared intention (ii)?
  *   **Resolution:** This is a coherent negative claim. You are arguing that the *normative binding* Gilbert associates with plural subjects is actually explained by the *interlocking commitments* in (i). You treat "plural subject" as a label for a stable state of (i), not a precondition for it. This hangs together perfectly as a critique of Gilbert from a Bratmanian standpoint. No revision needed.

  #### 3. Institutional Facts vs. Joint Action (v) vs. (ii)
  *   **Apparent Conflict:** Does institutional acceptance (v) require the same shared intention as joint action (ii)?
  *   **Resolution:** You can consistently hold that institutional facts are a *subset* or *special case* of joint activity. If institutional facts depend on collective acceptance (v), and collective acceptance is decomposable into individual acceptance + common belief, this mirrors the structure of (i). The tension is only severe if you think institutions require *more* than joint action. Since you reduce both to individual attitudes, they are metaphysically aligned. No revision needed.

  ---

  ### III. Summary of Commitments & Trajectory

  Your package commits you to **Methodological Individualism with Normative Realism**. You want to keep the metaphysics lean (no group minds, no plural subjects) but keep the ethics heavy (corporations are truly blameworthy).

  *   **Your Strongest Link:** The alignment of (i), (iv), (v), and (viii). This is a coherent, standard Bratmanian reductionist ontology.
  *   **Your Weakest Link:** The bridge between that ontology and (iii). This is where your defense will be attacked. Opponents will argue you cannot have (iii) without sacrificing (i) or (v).
  *   **Your Vulnerable Flank:** (vi). In a seminar setting, the "unilateral veto" without interpersonal betrayal will be targeted as undermining the "commitment" aspect of (i).

  **Strategic Recommendation:**
  If forced to drop one commitment to save the package, **drop the "non-derivative" qualifier in (iii).**
  *   **Revision:** Change (iii) to: "Collective agents bear moral responsibility that is *distinct in kind* from individual responsibility, though ontologically grounded in individual attitudes."
  *   **Why:** This preserves the practical outcome (corporations can be blamed) without requiring you to posit ontological emergence that contradicts (i) and (v). It costs you the metaphysical "punch" of non-derivativity but saves the consistency of your entire ontological framework.
