  Dear colleague,

  This is a remarkably sharp observation, and you are right to feel that the standard social ontology toolkit doesn't quite capture the specific mechanic you are describing. You have put your finger on a distinction that often gets blurred between critical theory and analytic social ontology. While there is no single canonical term that perfectly isolates this variable, your hypothesis is very close to the mark, and we can map it onto a few existing concepts before refining a label that fits your specific needs.

  The nearest established concept for your first case, where revealing the construction weakens the kind, is what Pierre Bourdieu calls misrecognition. For Bourdieu, symbolic power and social hierarchies often depend on participants believing that the social order is natural or inevitable rather than arbitrary. If the arbitrariness is exposed, the legitimacy of the hierarchy is threatened. This aligns with the Marxist concept of reification, where social relations appear as properties of things, and exposing that illusion is a political act. However, these terms focus more on power and legitimacy than on the ontological stability of the kind itself. Your second case, where the construction survives transparency, aligns closely with David Hume's and John Maynard Keynes's accounts of convention, as well as John Searle's status functions. In these models, money works not because we think it is magic, but because we know everyone else accepts it. This is a coordination equilibrium that is stable under common knowledge. In fact, in finance sociology, Michel Callon and Donald MacKenzie discuss performativity in a way that matches your money case: economic theories do not just describe the market, they make it work, and knowing this does not stop the mechanism.

  The distinction you are drawing, then, is not merely about sorting people versus objects, nor is it solely about feedback speed, though those are correlated. The core variable is whether the social kind requires an epistemic illusion about its own origins to sustain its causal powers. In the race case, the category relies on a first-order belief that it tracks something non-social, or at least requires that the social mechanism remain in the background. In the money case, the category relies on higher-order expectations about behavior, and the mechanism itself can be in the foreground without disruption. Ian Hacking's distinction between interactive and indifferent kinds is relevant here, but insufficient, because both race and money are interactive in that they affect the people classified. The difference is whether the interaction is subversive or reinforcing when the classification is understood as constructed. Judith Butler's work on gender performativity suggests that revealing the construction allows for subversion, which matches your race case, whereas MacKenzie's work on finance suggests that revealing the construction reinforces the system, matching your money case.

  Since there is no single term that captures this specific differential sensitivity to genealogical knowledge, I suggest you coin the term Constructive Opacity. You can define Constructive Opacity as the degree to which a socially constructed kind depends on participants remaining unaware of its constructedness to maintain its stability and causal efficacy. A kind with high Constructive Opacity, like the racial hierarchy you describe, functions ideologically; it requires naturalization. A kind with low Constructive Opacity, like fiat currency, functions conventionally; it requires only coordination. This term allows you to treat the property as a spectrum rather than a binary, which helps with your boundary cases.

  Take gender, for example. Your intuition that it lands in between is correct because gender is a composite of different kinds of construction. Certain aspects of gender, particularly those tied to biological essentialism, have high Constructive Opacity; revealing them as social norms can destabilize them for some agents. However, other aspects of gender function as low-opacity conventions; once a social transition is made, the category holds steady through collective recognition regardless of whether everyone understands the history of gender norms. Electability is another fascinating mixed case. In one sense, it is purely like money; it is a self-fulfilling prophecy based on donor and voter expectations, and knowing it is constructed does not stop it. However, electability is often naturalized through narratives about charisma or demographic destiny, which introduces Constructive Opacity. If voters believe a candidate is unelectable because of a naturalized trait rather than a shiftable expectation, the category becomes fragile when that naturalization is challenged.

  Using Constructive Opacity allows you to avoid the trap of saying some things are real and others are not. Instead, you can analyze how different social kinds sustain themselves. It clarifies why debunking biology does not end racism but might end a specific racial ideology, while debunking the gold standard does not end money. It also helps explain political strategy. For high-opacity kinds, the strategy is exposure and demystification. For low-opacity kinds, the strategy must be coordination and counter-convention, because transparency alone will not dissolve them. This distinction should give your chapter the precise conceptual leverage you are looking for without forcing you to adopt a broader theory of social ontology that might not fit your specific argument. I hope this helps you move forward with the draft.

  Best regards,

