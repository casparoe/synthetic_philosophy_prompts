answer: |-
  Good evening, everyone. For those who don't know me, I'm one of [Advisor's Name]'s former students. For those who do know me… yes, I'm still working on that paper. I'll send it soon.

  We're here to celebrate [Advisor's Name]'s retirement. But looking at her tonight, I ran into a philosophical problem. Is the woman holding this glass literally the *same person* as the grad student she was in 1985?

  Now, half of you are nodding because you know exactly where this is going. The other half are wondering if you need to check the exit signs. Stick with me.

  If we say "yes, she is strictly identical," we run into trouble. Identity is all or nothing. If 1985-[Name] is identical to 2024-[Name], then every property one has, the other must have. But let's be honest: the hair is different. The views on certain papers have changed. And hopefully, the patience level has improved. If identity means "no change allowed," then she can't be the same person.

  But [Advisor's Name] spent her career telling us that strict identity is the wrong tool for the job. She argued that we don't need things to be literally identical to talk about them across different situations. We just need a counterpart relation.

  So, let's use her own tools to honor her. Let's treat the different eras of her life like different worlds. In the world of 1985, there was a grad student. In the world of tonight, there is an emerita professor. They aren't literally identical. Instead, they are counterparts. They are linked by history, by memory, and by similarity.

  This matters, because strict identity doesn't allow for growth. Counterparts do. A counterpart relation is about how well one version of a person represents another in a different context. And this lets us ask a much better question than "Is she the same?" The question is: "How good is the counterpart relation?"

  When I look at the work she's done, the students she's mentored, and the family she's raised, I think it's clear. The woman sitting here tonight is the *best* counterpart across all the worlds of her career. She preserves what was essential about that grad student—the curiosity, the rigor—but she's shed the stuff that wasn't.

  For the metaphysicians at the table: yes, I know this isn't strict Lewisian modal realism applied to temporal parts. But for the family: what this means is simple. We don't love her because she never changed. We love her because the person she became is the best version of the person she started as.

  She taught us that we don't need strict identity to have connection. We just need a relation strong enough to carry the weight of respect. And looking around this room, at the colleagues, the friends, and the grandkids who just want cake, I'd say that relation is as strong as it gets.

  So, please raise a glass. To [Advisor's Name]. Not because she is the same woman she was in 1985, but because she is the best counterpart she could possibly be.

  Cheers.
