  2.  **Deconstruct the Sapir-Whorf Hypothesis (Philosophy Background):**
      *   *Strong Version (Determinism):* Language *determines* thought. You cannot think concepts your language lacks. (Generally rejected by modern linguists/cognitive scientists).
      *   *Weak Version (Relativity):* Language *influences* thought, habit, and attention. It makes certain cognitive paths easier or more salient. (Widely accepted in nuanced forms).
      *   *Whorf's Hopi Example:* Whorf claimed Hopi language lacked tense markers for time, leading to a different conception of time (cyclical vs. linear). (Later criticized as inaccurate linguistically, but philosophically influential).

  3.  **Analyze *Arrival*'s Depiction:**
      *   *Premise:* Learning Heptapod B rewires the brain to perceive time non-linearly (simultaneously).
      *   *Mechanism:* Writing system (logograms) is non-linear (no start/end), which trains the brain to experience time non-linearly.
