  **Neuro-Distributed Continuity Clinic (NDCC)**
  **Patient Information Leaflet: Elective Bilocated Consciousness Procedure (Ref: BCP-78)**

  **1. Pre-operative Counselling and Liability Escrow**
  Prior to substrate extraction, patients must complete the Primary Beneficiary Designation Form (PBD-1). This document adjudicates the distribution of legal personhood during periods of telemetry latency. Please note that the NDCC does not assume responsibility for metaphysical ambiguities arising from signal loss. All submissions are reviewed by the Continuity Tribunal, a panel tasked with determining whether inheritance rights, spousal obligations, and criminal liability attach to the cerebral substrate (Vat Unit), the ambulatory replacement (Body Unit), or are suspended in escrow. Patients are advised that selecting 'Both' may result in double taxation, whilst selecting 'Neither' constitutes a waiver of habeas corpus. In the event of conflicting testimony between the Unit and the Vat, the Tribunal reserves the right to freeze assets until a consensus on location is reached.

  **2. During Dislocation**
  Upon separation, patients may experience a transient sensation of being nowhere in particular. This is a normal administrative side-effect of decoupling. Whilst the telemetry link is active, you will likely perceive yourself as occupying the Body Unit. However, should the radio link suffer interference—for instance, during heavy thunderstorms or near high-voltage pylons—you may instantaneously relocate to the Vat Unit. Please remain seated during such episodes. Do not attempt to operate heavy machinery if you feel yourself shrinking to the size of a preserved organ. If you experience dissociation wherein you feel you are simultaneously in the vat and walking the dog, please log this discrepancy in your daily phenomenology diary for audit purposes.

  **3. Post-operative Identity Verification**
  Reintegration is not guaranteed. Should you wish to resume a unified existence, both Units must present at the clinic for synchronisation. Be advised that identity verification protocols require biometric matching from the Body Unit and neurometric confirmation from the Vat Unit. If the Body Unit has developed independent habits during the separation period (e.g., smoking, infidelity, or unauthorised employment), the Vat Unit may be held vicariously liable depending on the PBD-1 status. Patients finding themselves locked out of their own bank accounts due to signature mismatches between hand and mind should contact the Dispute Resolution Office. Please allow 6–8 weeks for the Tribunal to determine which entity is the legitimate signatory.

  > **SIDEBAR: A Note on Holiday Closures**
  > Please be aware that the NDCC observes all standard Bank Holidays. During these periods, telemetry maintenance is suspended. Patients currently dislocated at the time of closure should not attempt to return to their original location until normal service resumes. Trying to re-anchor consciousness during a Bank Holiday may result in permanent stranding between locations. We recommend scheduling your extraction so that reintegration does not coincide with the Christmas period. If you find yourself stuck in the vat over Easter, complimentary television is provided, though remote control access is restricted to the Body Unit.

  **4. Complaints and Feedback**
  If you feel you have been treated unfairly, or if you are no longer sure who 'you' refers to in the context of this complaint, please submit Form C-99. Note that complaints must be signed by the party claiming grievance. If the Brain and Body disagree on the nature of the complaint, two separate forms are required. The NDCC strives for continuity of care, but cannot guarantee continuity of self.

  *Issued by the Department of Neuro-Administrative Affairs. © Crown Copyright.*
