answer: |-
  **Bottom line**
  Vote **no**. While the remote students meet the "Formal Status" precedent (they are enrolled), the "Direct Utility" and "Physical Nexus" precedents are stronger for capital projects. In every past case where voters wouldn't physically use or occupy the affected space (teachers on dress code, parents on cafeteria), they were excluded. Allowing this vote breaks the committee's consistent pattern of tying voting rights to physical stake in the specific asset, not just general enrollment.

  **Rules that fit our precedents**
  Three distinct principles explain all six past decisions, but they split on the remote kids:

  1.  **Formal Membership:** If you are currently enrolled or have accepted enrollment, you vote. This fits every past case (exchange, feeder, suspended = yes; teachers, alumni, parents = no). **Verdict: YES.**
  2.  **Physical Nexus:** If you do not physically occupy the campus space affected, you cannot vote. This fits past exclusions (teachers in classrooms, parents off-campus, alumni gone) and inclusions (exchange, feeder, suspended were/are on-site). **Verdict: NO.**
  3.  **Direct Utility:** You must directly use the specific asset or be subject to the specific rule. This fits the cafeteria (parents pay but don't eat = no) and dress code (teachers manage but don't wear = no) rulings. Since remote fees explicitly exclude facilities and they never visit, they derive no utility. **Verdict: NO.**

  Your committee has historically prioritized Nexus and Utility over Membership when money or infrastructure is involved.

  **Closest analog**
  The **exchange students** are the closest match, but the fit is imperfect. Like the remote kids, exchange students were present at the start but left before the policy ended (1 of 3 years). They were allowed to vote. However, the match breaks on *usage*. Exchange students used the bells daily; remote students will never step on the grass field. Conversely, the **alumni** precedent (renaming) is a better fit for "no stake," but alumni had already left the institution. Remote kids are currently enrolled, making them more like exchange students legally, but more like alumni physically.

  **What we'd be committing to**
  Ruling **Yes** locks you into "One Student, One Vote" regardless of relevance. Future referendums become pure headcounts, empowering transient members over long-term stakeholders. Ruling **No** commits you to "Stakeholder Democracy," risking the exclusion of students on broad policies (like curriculum) that don't involve physical space.

  The **proxy/re-ratification idea** is the most radical. It commits the school to **Intergenerational Trusteeship**. You are admitting current students don't own the school, but merely manage it for future cohorts. This undermines the legitimacy of *every* past vote (including the bell schedule) and creates administrative chaos. Who picks the proxy? What if the future students ratify differently? It turns policy into a temporary suggestion rather than a decision.

  **The case that would settle it**
  Propose a hypothetical: **"A $50,000 bond for new server capacity to improve Wi-Fi speed."** Remote students use the digital network heavily but never touch the servers physically.
  *   If the committee says **Yes** (they vote on Wi-Fi), then the rule is **Formal Membership**, and remote kids should vote on the field house.
  *   If the committee says **No** (they can't vote on Wi-Fi), then the rule is **Physical Nexus**, and you must vote No on the field house.
  This forces the committee to choose between "Student Status" and "Physical Presence" explicitly, rather than hiding behind vague precedents.

  **Settled vs contested**
  This is the **"Boundary Problem"** in democratic theory. Philosophers agree there is no perfect solution: every rule disenfranchises someone affected (future generations, non-citizens, children). There is genuine disagreement on the standard: **"All Affected Interests"** (parents/remote kids should vote) vs. **"All Subjected to Coercion"** (only enrolled students).
  *My call:* The proxy vote idea is theoretically coherent (addressing intergenerational justice) but practically unstable. It assumes we can represent the unenrolled, which political science suggests leads to legitimacy crises. Stick to the "Physical Nexus" rule; it's the only one your committee has applied consistently to financial/infrastructure votes.
