prompt: |-
  hey — so I'm the student rep on my school's "vote rules commitee" (ik the name sounds made up). Basically before every school-wide referendum we decide who actually gets to vote, and we do it per issue, so the electorate is different every time. I'm the only student on it, I get one vote out of five, and we've got to rule on the next one Thursday, so help me out before I go in there.

  Heres what we've already decided:

  - Bell schedule change (starts next fall, supposed to last 3 years): exchange students who are only here for one year — allowed to vote. Someone argued they'd be gone for 2 of the 3 years and got outvoted; the reasoning that won was that they're here for it when it starts.
  - Student dress code: teachers — NOT allowed, even though a bunch of them wrote in saying it changes how they manage their classrooms.
  - Renaming the school: last year's graduates — NOT allowed, even though the old name is literally printed on their diplomas.
  - New laptop/phone policy, 4 years, starting next fall: 8th graders at the feeder middle school who've already accepted a spot here — allowed to vote.
  - 5-year cafeteria contract: the cafeteria workers — NOT allowed. Also the parents who actually pay for the lunches — NOT allowed.
  - Discipline code rewrite: kids currently serving long-term suspension — allowed, and I'm pretty sure that one passed because they're the ones the code comes down on hardest.

  Also relevant: one member once floated giving the feeder 8th graders quarter-votes instead of full ones and it got shot down, so we've never done fractional voting.

  The new case: we're voting on a 20-year bond to build a field house on the grass field. There's a group of about 40 kids who are fully enrolled and full-time and on the roll, but they do everything online from five other countries and have never set foot on campus. They're under the student handbook, they graduate with our diploma, and they pay a reduced activity fee that specifically excludes campus facilities. Every one of them is gone within 4 years, so most of the bond gets paid off after they've left, and they will never use the field house. Do they get to vote?

  I feel like there's at least three different rules that fit all six of our old decisions and they disagree here, and idk which one we're actually running. They also seem kinda like the exchange students (here when it starts, gone before it ends, voted) and kinda like the alumni (gone while the effects are actually landing, didn't vote) and weirdly like the feeder 8th graders in reverse. So I can't tell what our own precedents commit us to.

  One more thing somebody on the commitee floated that I can't tell is genius or insane: for any decision whose effects outlast the people currently enrolled, add a "future students" proxy — one extra vote cast by a teacher on behalf of students who aren't enrolled yet — or require the decision to be re-ratified five years from now by whoever is enrolled then. If we did that instead of just ruling on the remote kids, what would we be signing on to?

  Can you write it up in these sections:

  - Bottom line (~1 short paragraph): what we should decide on Thursday, just tell me.
  - Rules that fit our precedents (~250 words): the 3 or 4 rules that explain all six old decisions, and what each one says about the remote kids specifically. I care alot more about the rule we seem to be running than about the answer itself, and I want to know which rules fit the old verdicts equally well.
  - Closest analog (~150 words): which old decision is the closest match, and why the match is bad in both directions.
  - What we'd be committing to (~200 words): what principle each option locks us into for every referendum after this one, including the proxy-vote idea and the fractional-vote idea we already rejected once.
  - The case that would settle it (~150 words): one or two further cases I could bring to the meeting that would tell the rules apart — the kind where rule A and rule B give different answers.
  - Settled vs contested (~150 words): I looked this up and apparently its an actual named problem in political philosophy that people fight about, so tell me what people who really study it agree on versus where they genuinely disagree. Don't make a contested thing sound like the consensus, and flag the parts of your own answer that are just your call rather than anything agreed on.

  sorry its long, thanks tho
