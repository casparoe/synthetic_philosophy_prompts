  **NOTES ON LOGICAL SPACE**

  **1. Indistinguishable Leaves:**
  The tree cannot empirically separate **Leaf 2 (Block Universe)** and **Leaf 8 (Moving Spotlight)**. Both accept a static totality of events.
  *   *Further Question:* Is the property of "presentness" a fundamental ontological addition (Spotlight) or a mind-dependent indexical (Block)?

  **2. Unoccupied Cells:**
  *   **Leaf 3 (Hard Fatalism):** Empty because **incoherent**. If reasons are inert, the agent cannot rationally assert the position.
  *   **Leaf 5 (Reverse-Growth):** Empty because **merely unattractive**. It posits a real future and unreal past, contradicting the asymmetry of memory and causation without gain.

  **3. The "Presentism" Merge:**
  Leaf 9 houses both standard Presentism and Presentism with a Privileged Foliation. In the context of SR, standard Presentism *requires* the privileged foliation to survive the Rietdijk–Putnam argument; thus, they occupy the same logical cell.
