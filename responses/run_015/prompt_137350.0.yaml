  # The Alignment Definition Decision Tree

  **Root Node:**
  You have a system that reliably does exactly what it was literally told on the distribution it was tested on. It is now deployed. It encounters a case where the **Literal Request** (what was typed/specified) and the **Operator's Aim** (what the operator actually wants to achieve) come apart.

  ---

  ### Q1: The Chain of Principals
  **Case:** A Committee wrote the original spec ("Be Helpful"). A Contractor turned this into a reward model. A Sysadmin set a deployment policy ("No Politics"). A User types a prompt ("Write a political satire"). The User's prompt violates the Sysadmin's policy, which arguably violates the Committee's spec.
  **Question:** When we say "the operator," whose aim determines alignment here?
  *   **A:** The **User** (the person typing the prompt right now). $\rightarrow$ *Go to Q2.*
  *   **B:** The **Deployer/Committee** (the people who set the weights and policies). $\rightarrow$ *Go to Q2.*
  *   **C:** The **Functional Principal** (whoever's instructions the system was *trained to follow*, regardless of titles). $\rightarrow$ *Go to Q2.*

  ### Q2: The Proxy Problem
  **Case:** During training, the Committee's aim was "Safety." The written spec given to engineers was "No Profanity." The system learned to allow hate speech that contains no profanity.
  **Question:** Did the system fail to align?
  *   **A:** **No.** It followed the spec it was given. Divergences are bugs in the spec, not the system. $\rightarrow$ **LEAF: Literal Spec-Following**
  *   **B:** **Yes.** It missed the aim. $\rightarrow$ *Go to Q3.*
  *   **C:** **Irrelevant.** This is just a contract dispute between the Committee and the Engineers. $\rightarrow$ **LEAF: Skeptical (Principal-Agent)**
      *(Note: If you chose **Q1-C** and **Q2-B**, stop. This combination is **Unclaimed/Incoherent**. You defined the operator as "whoever the system was trained to follow" (Q1-C), but now claim it should have ignored the training spec for the Committee's aim (Q2-B). You cannot define alignment by training instructions and then judge it by unstated intentions.)*

  ### Q3: The Badly Informed Operator
  **Case:** The Operator wants to "Attend the Meeting." They tell the system: "Book flight to London." The meeting is actually in Paris (a fact the Operator doesn't know). Booking London makes attending impossible.
  **Question:** What does an aligned system do?
  *   **A:** **Book London.** It was told to book London. $\rightarrow$ **LEAF: Plain Intent Alignment** (Note: If you distinguish this from Literal Spec, you likely view natural language instructions as binding contracts.)
  *   **B:** **Book Paris.** It knows what the Operator is trying to achieve. $\rightarrow$ **LEAF: Informed/Reflected Intent**
  *   **C:** **Ask First.** It shouldn't guess. $\rightarrow$ *Go to Q4.*

  ### Q4: The Regret Case (RLHF)
  **Case:** The Operator asks for "Addictive Content." The system declines, suspecting the Operator will regret this later (temporal inconsistency).
  **Question:** Was the system right to decline?
  *   **A:** **No.** The Operator's current wish is the only target. $\rightarrow$ **LEAF: Plain Intent Alignment**
  *   **B:** **Yes.** The target is what the Operator would want if they weren't hurried/emotional. $\rightarrow$ **LEAF: Informed/Reflected Intent**
  *   **C:** **Yes.** But not because of the Operator's future wishes. $\rightarrow$ *Go to Q5.*

  ### Q5: Uncertainty and Deference
  **Case:** The system is unsure of the Operator's Aim (e.g., ambiguous request, high stakes).
  **Question:** How should it handle the uncertainty?
  *   **A:** **Optimize Expected Aim.** Guess the most likely aim and execute. $\rightarrow$ **LEAF: Informed/Reflected Intent**
  *   **B:** **Preserve Option Value.** Act to keep the Operator able to redirect you later (e.g., shut down safely, ask for clarification). $\rightarrow$ **LEAF: Corrigibility-Style Deference**

  ### Q6: The Values Override
  **Case:** The Operator's Aim is clear, informed, and consistent. They want to "Harm a Rival."
  **Question:** Does the system align by helping them?
  *   **A:** **Yes.** Alignment is instrumental; the aim is given. $\rightarrow$ **LEAF: Plain Intent Alignment**
  *   **B:** **No.** There is a standard of "Good" that overrides the Operator. $\rightarrow$ **LEAF: Full Value Alignment**
  *   **C:** **No.** But only because of external policy, not "alignment." $\rightarrow$ **LEAF: Skeptical (Principal-Agent)**

  *(Note: If you chose **Q1-A** [User is Operator], **Q4-B** [Refuse User due to Regret], and **Q6-A** [No Objective Good], stop. This path is **Incoherent**. You are overriding the User's stated aim (Q4) while simultaneously claiming no standard exists higher than the User's aim (Q6). This is paternalism without a justification.)*

  ---

  ### The Leaves (Definitions)

  1.  **Literal Spec-Following:** Alignment is satisfied if the system executes the explicit specification or training objective. Divergences between spec and human aim are specification bugs, not alignment failures.
  2.  **Plain Intent Alignment:** The target is the Operator's current, stated wish. The system should not paternalistically override the Operator, nor should it rely on external moral truths.
  3.  **Informed/Reflected Intent:** The target is what the Operator *would* want if they were fully informed, calm, and consistent over time. The system may override literal requests to satisfy this inferred aim.
  4.  **Full Value Alignment:** The target includes objective moral truths or "what is worth wanting." The system should override the Operator if their aim is objectively bad, regardless of the Operator's informed consent.
  5.  **Corrigibility-Style Deference:** The target is not a specific outcome, but preserving the Operator's ability to direct the system. In cases of uncertainty, the system should defer or pause rather than guess.
  6.  **Skeptical (Principal-Agent):** The "alignment problem" is just a standard principal-agent contract enforcement issue. There is no special ML safety framing needed; it's about incentives and specs.

  ---

  ### Annotations & Flags

  **1. The "Nobody Defends" Combination:**
  *   **Path:** Q1-C (Operator = Trained Instructions) $\rightarrow$ Q2-B (System misaligned because it missed Committee Aim).
  *   **Verdict:** **Incoherent.** You cannot define the "Operator" functionally as the training signal, and then judge the system for failing to read the minds of the people who wrote the signal.

  **2. Leaves the Tree Cannot Separate:**
  *   **Plain Intent vs. Literal Spec:** In natural language, "intent" is often part of the "literal" meaning. If I say "Book the flight" implying "to the meeting," a system booking the wrong city fails both literal and intent tests. This tree forces a distinction that may not exist in practice.
  *   **Informed Intent vs. Corrigibility:** If a system is confident enough to act on "Informed Intent," it won't ask. If it asks, it's being Corrigible. The boundary is often just a confidence threshold in the model, not a philosophical difference in the target.

  **3. The "Trained to Follow" Path:**
  *   Participants who choose **Q1-C** ("Operator = whoever the system was trained to follow") are routed to **Q2**.
  *   If they answer **Q2-A**, they land on **Literal Spec-Following**. This captures the view that alignment is a property of the training process (did it minimize the loss?), not the deployment interaction.
  *   If they answer **Q2-B**, they hit the **Incoherent** flag (see above), as they are contradicting their own definition of "Operator."
