answer: |-
  The calculation debate is not about whether a planner can compute faster, but about whether the data they need to compute exists prior to the market process.

  **Structure and the PriceBot Stipulation**
  Begin with Mises (10 mins): without private ownership of capital goods, there are no prices, hence no common unit to compare heterogeneous inputs. Use the case study here: how do you compare GPU cycles allocated to Model A versus Model B without a price signal? Move to Lange (10 mins): the planner mimics the market via trial and error (gradient descent on shortages).

  Introduce the **PriceBot stipulation** immediately after Lange (5 mins). Grant your audience perfect telemetry on physical states and unbounded compute. This concedes the "1930s technology" objection explicitly, preventing it from lingering. By placing it here, you validate their engineering intuition before pivoting: even with perfect optimization power, what is the objective function? This isolates the *calculation* problem (Mises) and the *optimization* problem (Lange/PriceBot) from the *knowledge* problem (Hayek).

  Devote the core (20 mins) to Hayek. The data PriceBot needs—opportunity costs and subjective valuations—does not exist until agents conflict over resources in real time. Prices are not measurements; they are generators of information. Conclude with incentives/discovery (5 mins).

  **The Concrete Case**
  Use **allocating finite GPU clusters between competing model architectures**.
  *   **Required Properties:** The good is intermediate (compute cycles); its worth is not readable from physical inputs (watts/chips); "just simulate it" fails because simulation cannot reveal which architecture users will value or what alternative research is sacrificed.
  *   **Useless Properties:** Do not frame this as "who owns the GPUs." Do not use final consumer goods (like pencils) where value seems obvious. The ambiguity must lie in the *intermediate* valuation.

  **Misconceptions and Timing**
  1.  **"Planning is just inefficient."** Head this off during Mises. The claim is impossibility of rational allocation, not sluggishness.
  2.  **"Lange answered it."** Address after Lange. Lange assumes given preferences and tech; Hayek argues these are discovered.
  3.  **"It's about compute power."** Crush this at the PriceBot moment. Perfect compute cannot process non-existent data.
  4.  **"It's about incentives (lying/cheating)."** Explicitly bracket this at the start. State you are discussing epistemology, not psychology.

  **Declinations**
  Openly decline three topics: normative ethics (is socialism moral?), historical empirics (did the USSR fail?), and incentive compatibility (will managers lie?). State clearly: "We are analyzing the logical possibility of calculation, not the moral or historical record."

  **Closing Question**
  Ask this in the last five minutes: "If your PriceBot predicts a shortage of H100s tomorrow, what specific conflicting offer *actually happened* to generate that signal?" If they answer with "data usage" or "predictions," they missed the point. The signal requires a forgone alternative that only exists through trade.
