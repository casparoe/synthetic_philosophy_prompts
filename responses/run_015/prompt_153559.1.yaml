      *Wait, one detail:* "One concrete case to carry the whole fifty minutes." I need to make sure the plan says *use this case throughout*, not just in one section.
      *Adjustment:* Weave the GPU case through Mises (how to compare uses?), Lange (how to adjust?), Hayek (where does the value come from?).

