answer: |-
  - **The implicit theory**

  The doctrine presupposes a hybrid view I'll call "Evaluative Impulse Theory." It treats emotions as evaluative judgments that possess a physiological inertia. Condition (c) (the reasonable person) requires emotions to be assessable as correct or incorrect responses to value, which strictly requires a cognitive or perceptual component; you cannot be "reasonable" about a mere bodily itch. However, condition (d) (cooling off) treats the emotion as a force that overrides agency temporarily and decays passively over time, independent of rational revision. This suggests the law views emotion not just as a judgment, but as a *disruption* of the capacity to judge.

  Therefore, the implicit theory is that emotions are value-laden responses that, when sufficiently intense, create a temporary suspension of rational control which the law excuses, provided the trigger was objectively valid. [Guess: I'm reconstructing this from the doctrine's structure; the lawmakers may not have had a coherent theory in mind.] The law assumes a normal agent regulates emotions via judgment, but a provoked agent is temporarily incapable of doing so. The "cooling off" period is the time required for the physiological arousal to subside enough for rational judgment to resume operation. This explains why words alone are often insufficient (condition a): they may justify a judgment of anger, but rarely trigger the physiological overwhelm required to suspend agency. The doctrine thus demands an emotion that is both rationally grounded and physically overpowering.

  - **What it strictly needs vs. what it merely sits well with**

  The doctrine strictly needs a cognitive component for condition (c) and a physiological component for condition (d). Without the cognitive view, the "reasonable person" standard collapses; you cannot normatively evaluate a raw feeling as "reasonable" or "unreasonable," only as intense or mild. Conversely, without a feeling-like component, condition (d) makes no sense. If anger is merely a judgment that "I have been wronged," waiting ten minutes does not logically necessitate changing that judgment. Judgments persist until revised by evidence, not by time.

  However, condition (b) (actual provocation) merely sits well with any theory; it only requires subjective existence. Similarly, condition (a) (adequate provocation) fits both cognitive and perception views comfortably, as both allow for appropriateness conditions. [Guess: I am assuming "adequate" implies normative appropriateness rather than statistical frequency.] The tension arises specifically between the normative assessment of the emotion's origin (cognitive) and the mechanistic assessment of its duration (physiological). The doctrine strictly needs a view that allows emotions to be both about something (content) and something that happens to you (process).

  - **Where several theories would license the same doctrine**

  Interestingly, conditions (a) and (b) are theory-neutral. A Feeling theorist can agree that a defendant actually felt something (b) and that certain stimuli typically cause those feelings (a). Similarly, both Perception and Judgement views license condition (c) equally well. Both views hold that emotions represent the world as having certain values; thus, both allow for the possibility of error or appropriateness. If emotion is perceiving danger, one can be unreasonable in perceiving danger where none exists. If emotion is judging insult, one can be unreasonable in judging insult where none was intended.

  [Guess: This assumes the "reasonable person" test is about the emotion's fit to the world, not just the resulting behavior.] Therefore, the debate between Perception and Judgement theories doesn't necessarily change the outcome of the "reasonable person" test. Both can accommodate the idea that some provocations are objectively "adequate" and others are not. The divergence only becomes critical when we introduce the temporal element of condition (d), where Feeling theories have a natural advantage regarding decay, while Cognitive theories must explain why valid judgments lose their mitigating force over time.

  - **Counterfactual doctrine**

  If we adopted a pure Judgement View, condition (d) would likely vanish. If anger is simply the judgment "I have been grievously wronged," then killing based on that judgment is either justified or not based on the truth of the judgment, not the timing. A pure Cognitive doctrine might mitigate based on whether the judgment was *understandable* given the evidence, regardless of cooling off. Conversely, words might become adequate provocation more often, since verbal insults directly trigger evaluative judgments without needing physical threat.

  Under a pure Feeling View, condition (c) would collapse. You cannot demand a "reasonable" feeling. The doctrine would shift to an intensity test: was the feeling strong enough to overwhelm any person? The focus would move from the *cause* of the emotion (adequate provocation) to the *effect* of the emotion (loss of control). [Guess: I'm speculating on how legislators would translate theory into statute.] The law would look more like an insanity defense (overwhelmed by force) than a mitigation of blame (reacting to value). The current doctrine is a compromise between these two extremes, refusing to go fully cognitive or fully physiological.

  - **On the time-shape idea**

  Your "time-shape" idea is compelling, but I suspect it is a disguised Cognitive View rather than a fourth ontological option. It describes the *normative lifecycle* of an emotion rather than its metaphysical constitution. To say you are answerable for fury after an hour implies that you have had time to re-evaluate the judgment underlying the fury. If the judgment remains valid, the anger remains appropriate; if you kill anyway, it is because you prioritized revenge over law, not because you were overwhelmed.

  However, framing it as an "episode with a shape" is useful pragmatically. It captures the idea that emotions have a standard duration of *recalcitrance*. [Guess: This relies on the idea that rational agents can revise judgments quickly, which might be empirically false.] It explains why the law cares about timing without committing to physiology. It treats the cooling-off period not as waiting for a fever to break, but as waiting for the agent to return to their normative baseline. It's not a new theory of what emotion *is*, but a specific theory of how emotions *bind* agency over time.

  - **Where I'd change my mind**

  My reconstruction would crack if the doctrine is actually utilitarian rather than retributive. If the law mitigates punishment not because the defendant is less blameworthy, but because executing "heat of passion" killers doesn't deter others (since they aren't reasoning), then the theory of emotion doesn't matter at all. The "reasonable person" test would be a proxy for "typical reaction," not "correct judgment."

  [Guess: This is the strongest alternative explanation.] If I were shown that courts use the "reasonable person" standard statistically (what people *do* feel) rather than normatively (what people *should* feel), my claim that the law presupposes a cognitive view would fail. Additionally, if jurisdictions that dropped the "suddenness" requirement (condition d) still convict successfully, it suggests the physiological decay model is dispensable. If the law works fine without the cooling-off period, then the "Evaluative Impulse" theory is over-engineered, and a pure Cognitive View (was the judgment understandable?) might suffice. I would need to check if manslaughter convictions hold where cooling-off time is ignored.
