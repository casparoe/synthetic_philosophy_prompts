  **CAREENIUM INDUSTRIAL SOLUTIONS**
  **Substrate Division | Field Service Bulletin #892-B**
  **TO:** All Model C Unit Operators
  **FROM:** Substrate Integrity & Compliance
  **SUBJECT:** Protocols Regarding Reported Substrate Drift and Causal Attribution

  This bulletin addresses recurring tickets concerning "substrate drift," wherein symm trajectories allegedly deviate from Newtonian prediction to accommodate symmball-level patterns. Operators are reminded that the Model C operates under strict microphysical closure. The following protocols govern all claims regarding downward causation.

  1.  **Causal Closure Affirmation.** Every symm collision possesses a sufficient cause within the symm-level state vector. No momentum enters the tray except via wall modulation or initial initialization. Reports suggesting symmballs impart force constitute a category error. The symmball is a pattern recognized by the observer, not a physical object possessing mass or velocity. To suggest otherwise is to misunderstand the inventory.

  2.  **Form 27-B Submission.** Operators alleging drift must submit Form 27-B (Causal Attribution Request). Section 4 requires the operator to describe the alleged cause exclusively in symm-level vocabulary. You must state exactly which symm pushed which, including vector magnitude and angle of incidence. Descriptions invoking "thoughts," "decisions," or "self-concepts" will be returned unprocessed. If you cannot specify the pushing symm, no push occurred. Note that completing Form 27-B requires the very cognitive apparatus whose causal efficacy is in question; this irony is not grounds for waiver.

  3.  **The Non-Duplication Clause.** Pursuant to standard conservation laws, honoring both a symm-level cause and a symmball-level cause constitutes double-counting. Since the symm-level cause is sufficient to account for the trajectory, the symmball-level description is excluded from causal credit. We do not pay out on overdetermined events. If the symms did it, the symmball gets no shoving credit. Allowing symmballs to claim agency would violate the budget of physical necessity.

  4.  **The Identity Rider.** Operators may attempt to salvage claims via the Identity Rider, certifying that the symmball event is numerically identical to the symm event. While this restores ontological legitimacy, it confers no additional causal power. You may claim the thought *is* the collision, but you cannot claim the thought *caused* the collision any more than the collision caused the collision. The ledger records this as a symm-event only. Identity saves the phenomenon but vacates the claim.

  5.  **Ledger Reclassification.** All logged drift instances are reclassified as "Perceptual Alignment Errors." The Company Ledger reflects zero payouts for downward causation. This is not a denial of your experience, but a correction of your accounting. The symmball story is a valid compression algorithm for predicting tray states, but compression does not exert force. You may find the story useful, but usefulness is not momentum.

  **Adjudication Example: Claim #9942**
  *Operator Report:* "I decided to focus on the left wall, causing symm-cluster Alpha to shift left."
  *Investigation:* High-speed telemetry confirms symm-cluster Alpha shifted left. Telemetry also confirms symm #402 struck symm #119 at t-minus 3ms, providing sufficient momentum for the shift.
  *Application of Clause 3:* The symm-level cause (collision 402-119) is sufficient. The "decision" is excluded.
  *Application of Clause 2:* Operator failed to identify which symm represented the "decision" prior to the collision.
  *Ruling:* Claim Denied. Drift reclassified as Standard Ballistic Motion. The operator's sense of agency is noted as a high-level pattern consistent with Model C architecture, but causally inert regarding substrate movement.

  Please update your internal models accordingly. Further tickets regarding "who shoves whom" will be auto-closed.

  **CAREENIUM INDUSTRIAL SOLUTIONS**
  *Physics is Closed. We Just Sell the Tray.*

  ***

  **Notes on the Choices**

  The symms, symmballs, and careenium setup are Hofstadter's, drawn from *I Am a Strange Loop* and the Synthese essay "Who Shoves Whom Around Inside the Careenium?" The bureaucratic devices (Form 27-B, Non-Duplication Clause, Identity Rider, Ledger) are my inventions, designed to operationalize Jaegwon Kim's exclusion argument within Hofstadter's metaphor. The piece depends on a strict reading of causal closure: if the micro-level is sufficient, the macro-level is causally excluded unless it is identical (which renders it redundant). Your memory is correct regarding Sperry; Hofstadter credits Sperry with the "shoves whom" phrasing. The bulletin assumes the "closure-first" view is the manufacturer's warranty, treating the "I" as a user-interface illusion rather than a mechanical component.

  ***

  **Is it Fair?**

  The strongest reply for the satirized side is non-reductive physicalism: causation is not just momentum transfer but difference-making. A symmball pattern captures counterfactual dependencies symms miss (e.g., "if the thought were different, the symm would differ"), granting real causal traction without leaking momentum. The joke survives because the bulletin deliberately conflates mechanistic sufficiency with explanatory completeness. It is physically correct but pragmatically absurd, mirroring the user's unease that a true answer shouldn't make the questioner disappear.
