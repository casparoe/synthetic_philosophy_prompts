  ### Logical Space Key

  **The Three Separability Claims**
  1.  **Affect:** Can you feel the raw sensation of pain without the emotional suffering? (Yes/No)
  2.  **Representation:** Can you feel pain without judging that your body is being damaged? (Yes/No)
  3.  **Self-Tag:** Can you feel pain without feeling that it is happening specifically to *you*? (Yes/No)

  **Combination Status**
  *   **Taken:** Affect separates (Standard View); Representation separates (Evaluativism); Self-Tag separates (Ownership View).
  *   **Empty:** Sensory badness without aversion; Damage matters without ownership.
  *   **Open:** Does badness require a non-pain alternative to compare against? (Contrast Claim)

  ***

  ### Taxonomy Tree: What Makes Pain Bad?

  **ROOT: In pain asymbolia, patients feel the poke but don't mind. What explains this?**

  *   **BRANCH 1: The emotional sting is missing.**
      *   **LEAF 1: Badness IS the sting.**
          *   *Position:* Standard Hedonism (e.g., Grahek).
          *   *Weirdest Commitment:* Masochists are essentially self-induced asymbolics who have severed the sting from the sensation.
      *   **LEAF 2: Badness needs a better alternative.**
          *   *Position:* Contrast Hedonism.
          *   *Weirdest Commitment:* People born without pain sensitivity miss out on a kind of moral knowledge because they lack the contrast required to feel suffering.

  *   **BRANCH 2: The damage warning is missing.**
      *   **LEAF 3: Badness IS the judgment of damage.**
          *   *Position:* Strong Evaluativism (e.g., Bain).
          *   *Weirdest Commitment:* Phantom limb pain isn't actually bad if the patient knows the limb is gone, since no damage is occurring.
      *   **LEAF 4: [UNOCCUPIED] Badness is a sensory feature without aversion.**
          *   *Position:* Sensory Badness Theory.
          *   *Weirdest Commitment:* You can feel a sensation is 'bad' in itself without wanting it to stop—coherence is doubtful here.

  *   **BRANCH 3: The 'This Is Me' tag is missing.**
      *   **LEAF 5: Badness IS the threat to self.**
          *   *Position:* Ownership View (e.g., Carruthers).
          *   *Weirdest Commitment:* Feeling pain in a prosthetic isn't bad unless you psychologically own the device as part of your body.
      *   **LEAF 6: [UNOCCUPIED] Damage matters but ownership doesn't.**
          *   *Position:* Impersonal Evaluativism.
          *   *Weirdest Commitment:* Damage to a stranger feels bad to you directly, regardless of whether you feel it is 'yours'.

  *   **BRANCH 4: Nothing is missing (The Case is Flawed).**
      *   **LEAF 7: Asymbolics are blind to their own suffering.**
          *   *Position:* Error Theory / Skepticism.
          *   *Weirdest Commitment:* We know their mind better than they do; they are suffering but lack the insight to report it.
      *   **LEAF 8: Badness is purely relational.**
          *   *Position:* Pure Contrast View.
          *   *Weirdest Commitment:* Pain in a void (with no non-pain states possible) has no moral weight because there is nothing to compare it to.
