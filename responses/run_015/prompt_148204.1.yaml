answer: |-
  This is an excellent stress test for the metaphysics of virtual objects. The "Black Sunday" case (which closely mirrors the 2006 Guiding Hand Social Club heist against Ubiqua Seraph) is philosophically potent precisely because it forces the "magic circle" to collide with the real world.

  Here is the mapping you requested, followed by the evaluation of the theories and the verdict on the distress argument.

  ### 1. Mapping the Three Accounts

  Here is how each metaphysical framework parses the event, specifically addressing the object, the theft, the loss, and the variable of permanence.

  **(a) Code-Reductionism**
  *   **What is the object?** A specific pattern of bits in CCP's database, associated with access rights (flags) for specific user IDs.
  *   **Did an object change hands?** Yes. The database flags associated with the hangar contents and wallet ISK were updated from the Victim Corp ID to the Attacker ID.
  *   **Was there a theft?** Metaphysically, no. "Theft" implies a violation of ownership rights. On this view, the code *defines* the rights. Since the code permitted the transfer (the director had access flags), the transfer was valid. It was a *feature*, not a bug.
  *   **What was lost?** The victims lost the specific bit-patterns.
  *   **Does permanence matter?** **Yes, critically.** If the game were *World of Warcraft* (WoW), the "object" is a template that can be re-instantiated. Losing a ship is a temporary state change. In *EVE*, ships are often unique instances or require significant resource inputs to recreate. On code-reductionism, deleting a unique bit-pattern is ontologically heavier than resetting a flag. The loss is the destruction of that specific data instance, which the code does not automatically regenerate.

  **(b) Institutionalism**
  *   **What is the object?** A status function. The battleship is not just code; it is "Corporate Property" because the community and the system collectively accept it as such.
  *   **Did an object change hands?** Yes. The status function of "ownership" was transferred.
  *   **Was there a theft?** **It depends on which institution you query.**
      *   *The CCP Institution:* No theft. The constitutive rules (EULA + Game Code) authorized the move.
      *   *The Player Institution:* Yes, theft. The social contract among players (norms of trust, long-term investment) was violated.
  *   **What was lost?** The victims lost their *status* within the player institution. They lost the social reality of being a secure corporation.
  *   **Does permanence matter?** Yes. Institutional facts require stability to be real. If ships respawned instantly (WoW), the status of "owner of this specific ship" is weak. If the loss is permanent (EVE), the institutional fact of "ownership" is robust because it excludes others permanently. Permanence reinforces the reality of the institutional object.

  **(c) Fictionalism / Pretense**
  *   **What is the object?** A prop. The image of the battleship is a prompt for the players to imagine "I am a spaceship captain."
  *   **Did an object change hands?** No. Only the location of the prop in the fictional narrative changed.
  *   **Was there a theft?** No. There was *fictional* theft. Just as no real blood is spilled when Hamlet dies, no real assets are stolen when a virtual ship is ganked.
  *   **What was lost?** The victims lost a *narrative opportunity*. They can no longer imagine themselves using that prop in that specific way. They also lost the "score" of the game (the fictional truth that they are rich).
  *   **Does permanence matter?** Only aesthetically. A permanent loss changes the genre of the fiction from "adventure" to "tragedy." It makes the fictional stakes feel higher, but ontologically, a deleted prop is the same as a reset prop: both are just changes in what we are to imagine.

  ---

  ### 2. The Institutionalism Fracture: Whose Institution?

  You asked if the clash between the EULA (CCP owns all), the Grey Market (players own value), and the Community (corps own assets) fractures Institutionalism.

  **Verdict:** It does not fracture the theory; it **validates** it, but it requires a layered analysis.

  Institutionalism (following Searle) relies on *collective intentionality*. In *EVE*, there are three overlapping communities generating intentionality:
  1.  **The Developer Institution:** Constitutive rules = Code + EULA. Status = "License to use."
  2.  **The Player Community:** Constitutive rules = Social Norms + In-game mechanics. Status = "Property."
  3.  **The Grey Market:** Constitutive rules = Supply/Demand + Fiat Currency. Status = "Commodity."

  The "Black Sunday" event is not a failure of Institutionalism; it is a **conflict of institutional facts.**
  *   CCP issued a status function: "This is allowed gameplay."
  *   The Victim Corp issued a status function: "This is our property."
  *   The Grey Market issued a status function: "This is $15,000 USD."

  Institutionalism predicts exactly this kind of friction. Real-world law deals with similar fractures (e.g., squatters' rights vs. legal title). The fact that the players felt wronged despite the EULA proves that the *Player Institution* generates status functions that are metaphysically real to the participants, even if they lack legal standing with the Developer. If Code-Reductionism were true, the Player Institution's outrage would be irrational. Since the outrage is rational within their social framework, Institutionalism explains the data best.

  ---

  ### 3. The Harm Tests

  **The Substitution Test (Email/Volunteer Org)**
  *   *Scenario:* If this happened in a volunteer org, it's fraud/theft.
  *   *Metaphysical Implication:* This test attacks **Fictionalism**. If the only difference between *EVE* and a volunteer org is "it's a game," Fictionalism says the *EVE* harm is pretend. But if the emotional and temporal investment (10 months) is identical, the Substitution Test suggests the *ontology* of the loss is identical.
  *   *Result:* The test suggests that "it's a game" is a normative shield, not a metaphysical boundary. It supports **Institutionalism**: the harm is real because the *social institution* of the corporation was damaged, regardless of whether the medium is email or spaceships.

  **The Permission Defence (Rules Permit the Move)**
  *   *Scenario:* Chess rules permit taking a Queen; *EVE* rules permit this heist.
  *   *Metaphysical Implication:* This supports **Code-Reductionism**. If the code defines the reality, and the code permits it, no wrong occurred.
  *   *Counter:* In Chess, both players consent to the *rules of movement*. In *EVE*, the victims consented to the *code*, but the attackers violated the *social norms* (the hidden institution). The Permission Defence fails if you accept that the Player Institution creates rights that the Code Institution does not recognize. It shows that "permission" is relative to the institution you privilege.

  ---

  ### 4. Theory Evaluation: Confirm, Embarrass, or Silent?

  Here is the explicit verdict on how the "Black Sunday" case treats your three accounts:

  *   **Confirm: Institutionalism.**
      *   *Why:* This case is the "smoking gun" for Institutionalism. It explains why a transfer can be code-legal yet socially criminal. It accounts for the real-world value (Grey Market Institution) and the genuine distress (Player Institution) without needing to claim the pixels are physical matter. It handles the conflicting norms (CCP vs. Players) as a feature, not a bug.

  *   **Embarrass: Fictionalism/Pretense.**
      *   *Why:* Fictionalism struggles to explain the **five-figure real-money value**. If the ships are merely props for make-believe, why did people trade fiat currency for them? A prop in a community theatre play doesn't sell for $15,000 on a secondary market. The existence of a robust grey market suggests the objects have causal powers in the real world that exceed "inviting us to imagine." Fictionalism has to perform uncomfortable gymnastics to explain why "pretend" loss causes real financial ruin.

  *   **Silent: Code-Reductionism.**
      *   *Why:* Code-Reductionism is not wrong, but it is **metaphysically silent on value**. It can explain *how* the heist happened (bits changed), but it cannot explain *why it matters*. It has no resources to distinguish between a heist and a server rollback, other than the direction of the bit change. It reduces the 10 months of labor to "time spent interacting with a UI." It cannot account for the harm without importing external concepts (like "labor" or "expectation") that are not in the code.

  ---

  ### 5. Settling the Argument: The Distress Datum

  You and your study buddy are debating whether victim distress proves real harm.

  **The Verdict:** Your buddy is making a category error, but you are underestimating the metaphysical weight of investment.

  1.  **Distress is not Ontology:** Your buddy is right that the harm is *real* (psychologically/socially), but wrong to think distress proves the *objects* were real in a physical sense. As you noted, people cry at movies. Distress proves **impact**, not **ontology**.
  2.  **The Investment Factor (10 Months vs. 5 Minutes):** This is where the metaphysics shifts.
      *   In a 5-minute gank (WoW style), the loss is a setback to *progression*.
      *   In a 10-month con (EVE style), the loss is a destruction of *labor*.
      *   **Institutionalist View:** The 10 months of activity solidified the institutional fact of "ownership." The attackers didn't just take a ship; they exploited the *trust* that constitutes the corporation. The harm is not the loss of the pixels; it is the **violation of the social contract** that allowed the corporation to exist.
  3.  **Permanence (EVE vs. WoW):**
      *   Does the verdict change if ships respawn? **Yes.**
      *   If ships respawn, the loss is *temporary*. The Institutional fact of "ownership" is interrupted but restorable.
      *   If ships are permanent (EVE), the Institutional fact is *extinguished*.
      *   **Why it matters:** Permanent loss makes the virtual object function more like **real property** (scarce, rivalrous) and less like **licensed content** (infinite, non-rivalrous). This strengthens the Institutional claim that the object is "theft-worthy."

  **Conclusion for your Seminar:**
  The "Black Sunday" heist suggests that virtual objects are **Institutional Facts** that exist independently of the Developer's Code but depend on the Player Community's collective intentionality.
  *   **Code-Reductionism** explains the mechanism but misses the meaning.
  *   **Fictionalism** captures the "game" aspect but fails to explain the real-world economic and emotional stakes.
  *   **Institutionalism** captures the friction: The heist was a **legal transfer** in the Developer's institution, but a **criminal theft** in the Player's institution. The harm was real because the players inhabit the Player Institution more deeply than the Developer's EULA.

  The distress isn't about the pixels; it's about the **betrayal of the institutional reality** they built together. That is a real harm, even if the ships are made of code.
