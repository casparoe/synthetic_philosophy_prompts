  **NOTICE OF LEGISLATIVE SELECTION AND WELCOME TO THE CHAMBER**

  **From:** The Office of the Sortition Authority
  **To:** Citizen-Legislator #89402
  **Subject:** Your Mandatory Term of Service

  Congratulations. You have been randomly selected from the national census registry to serve a single term in the National Chamber of Citizens. Please disregard any confusion regarding your qualifications; under the Pure Democracy Act, competence is considered an aristocratic filter. Elections favor the loud and wealthy, whereas the lot favors the typical. You were chosen because your demographics, income, and education levels statistically mirror the national mean. Your mediocrity is your credential.

  Report to the Capitol Complex on Monday. Do not prepare speeches. Do not research pending motions. Do not hire staff. Your role is not to lead, but to reflect. The Authority provides all necessary briefing materials. Attempting to acquire subject-matter expertise independently is classified as "de-mirroring" and is grounds for immediate dismissal. You are here to be a sample, not a specialist.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **1. Why can't I choose which bills to vote on?**
  To preserve your cognitive bandwidth for reflection, the Permanent Civil Service sets the legislative agenda. They also draft the motions. The Chamber is permitted to vote "Aye," "Nay," or "Abstain" on these motions. Please note that the Chamber is prohibited from voting on matters regarding the Sortition Authority's budget, the Civil Service's tenure, or the method of selection itself.

  **2. Why does my voting weight change weekly?**
  To maintain descriptive accuracy, we adjust vote values based on real-time attendance. If many citizens sharing your demographic profile decline service, quit, or are excused, your vote is reweighted upward to restore the original sample proportions. Conversely, if your demographic has high retention, your vote may be diluted. For example, during Week 4, a vote cast by a suburban male aged 30–40 may count as 1.37, while a vote by a rural female aged 60+ may count as 0.62. This ensures the Chamber remains a perfect mathematical mirror, even if the humans inside it are imperfect.

  **3. How are expert witnesses handled?**
  The Chamber does not seek truth, but balance. All expert testimony must be presented in adversarial pairs. For every economist arguing for inflation control, one must argue for stimulus. You are not expected to judge who is correct, only to register which argument aligns with your pre-existing intuition.

  **4. What happens if the Chamber deadlocks?**
  Judgment is never eliminated, only relocated. If a motion results in a tie, the decision is settled by a fresh lottery among the tied voting bloc. This ensures that the final outcome remains random and therefore democratic, rather than being stuck in partisan gridlock.

  **5. Can I tell my neighbors I represent them?**
  No. You represent no one. You are a statistical placeholder. Claiming constituency representation implies you were elected, which is an aristocratic claim. You are simply a citizen who was present when the machine spun.

  ***

  **CODE OF CONDUCT FOR CITIZEN-LEGISLATORS**

  *   **Maintain the Mirror:** Do not attempt to become informed beyond the provided briefing packets. Knowledge creates hierarchy. Hierarchy violates the principle of equality.
  *   **Silence on Policy:** You are forbidden from discussing pending motions with media, lobbyists, or constituents. Your private opinion is valid only when cast via the voting terminal.
  *   **Accept the Weight:** Do not complain if your vote is valued at 0.62 while your colleague's is valued at 1.37. This inequality ensures the collective equality of the demographic sample.
  *   **No Campaigning:** Soliciting support for re-selection is prohibited. There is no re-selection. You serve one term and return to private life.
  *   **Trust the Process:** If you feel unqualified, remember that feeling qualified is the primary disqualifier. Your confusion is evidence that the system is working as intended.

  Welcome to the future of governance. Please sign the attached nondisclosure agreement and proceed to Security Checkpoint B.
