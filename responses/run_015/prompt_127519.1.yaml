      *   *Time:* ~450 words for 3 mins.
      *   *The Pivot:* The role constituted her, but the *value* of that constitution is permanent. She isn't losing the role; she's carrying the imprint of it.

  8.  **Writing the Toast (Iterative refinement):**
      *   *Opening:* Welcome family and students. Acknowledge the 20 years.
      *   *Middle:* The philosophy bit. "We often think we walk into a room as finished products..." Explain the relational aspect. She became *who she is* through dealing with *us*.
      *   *The Twist:* Retirement isn't subtraction. It's integration. The virtues gained are now hers permanently.
