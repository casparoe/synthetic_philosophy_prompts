answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of working alongside [Honoree] for [Number] years.

  Looking around this room, I see a mix of people. We have family, who know [Honoree] as a parent and partner, and we have students and colleagues, who know her as the Chair of this department. Usually, when we toast someone retiring, we talk about the job they're leaving behind. We talk about the hours logged, the forms signed, the battles fought. We treat the job like a hat they wore for twenty years, something they can just take off and hang on the rack.

  But anyone who's ever been in a classroom, or a family, knows that's not really how identity works.

  There's a way of thinking about ethics—one [Honoree] has lived out every day—that suggests we aren't finished products walking into a room. We aren't isolated atoms who just happen to bump into other people. Instead, we become who we are *through* our relationships. You aren't a parent in a vacuum; you become a parent through the act of caring for a child. You aren't a leader in abstract; you become a leader through the act of guiding a community.

  For twenty years, [Honoree] didn't just occupy the office of Department Chair. She entered into a relationship with all of us. And because of that, this role didn't just sit on top of her; it helped constitute who she is. She listened to our bad ideas, mediated our petty squabbles, and fought for our resources. In doing that, she cultivated patience, wisdom, and a specific kind of care that belongs to this department alone.

  Now, I know what some of you might be thinking. If the role helps make the person, does retiring mean losing part of oneself? Does stepping away mean shrinking?

  I don't think so. And I know [Honoree] doesn't either.

  Because while the title changes, the cultivation doesn't vanish. The person she became *through* this role is the person walking out that door tomorrow. The relationships don't end; they just shift shape. She isn't leaving behind the virtues she built here. She's taking them with her. The care she practiced here is now part of her character, permanent and portable.

  So, [Honoree], we aren't here to say goodbye to the leader you were. We're here to honor the person you became while leading us. You didn't just fill a position; you grew into it, and in doing so, you helped all of us grow too.

  To [Honoree]—may your next chapter be defined not by what you leave behind, but by everything you've gathered along the way. Cheers.
