  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontological Status of Pre-Modern Mnemonic Substrates in National Formation
  **Date:** October 26, 2023
  **Parties:** Radical Modernist Camp (Camp One) and Mnemonic-Substrate Perennialist Camp (Camp Two)

  ## 1. Agreed Claims

  The undersigned parties hereby affirm the following propositions as established common ground, distinguishing this collaboration from primordialist or purely constructivist orthodoxy:

  1.  **Constructedness of Tradition:** National traditions are not immutable inheritances from antiquity but are largely constructed, codified, and standardized during the modern period.
  2.  **Role of Media and Administration:** The consolidation of mass national consciousness is contingent upon the technologies of print capitalism and the rationalizing pressures of modern bureaucratic administration.
  3.  **Inadequacy of Primordialism:** Accounts positing nations as eternal, biological, or genealogical facts independent of modern political processes are empirically inadequate and historically unsustainable.
  4.  **Variance in Rooting:** There is observable and significant variance in the velocity and depth with which invented national traditions take root across different populations, even within the same state framework.
  5.  **Subnational Resistance:** Specific subnational regions demonstrate persistent resistance to national identification despite exposure to identical state policies, educational curricula, and coercive institutions over extended periods.

  ## 2. Formulation of Residual Disagreement

  The parties disagree on the causal mechanism explaining the variance identified in Claims 4 and 5. The divergence centers on whether pre-modern cultural forms exert independent constraint on modern political engineering or are merely raw material selected by state power.

  | Issue | Camp One Formulation (Radical Modernist) | Camp Two Formulation (Mnemonic-Substrate Perennialist) |
  | :--- | :--- | :--- |
  | **Causal Status of Pre-Modern Forms** | Pre-modern cultural materials are inert raw material. Their selection is determined entirely by elite strategy and state capacity. Any appearance of continuity is a retrospective illusion created by successful propaganda. | Pre-modern cultural materials constitute a durable mnemonic substrate. They exert independent causal-constraining force, enabling or blocking the success of modern national projects regardless of state intent. |
  | **Mechanism of Adherence** | Mass adherence is produced by the ubiquity of state media and the coercive exclusion of alternatives. Success correlates with the intensity of institutional imposition. | Mass adherence is achieved only when modern narratives map onto pre-existing ritual, linguistic, or territorial structures. Success correlates with the alignment of invention and substrate. |
  | **Interpretation of Failure** | Failed nationalizations indicate insufficient state capacity, inadequate time for social engineering, or competing modern ideological offers. | Failed nationalizations indicate a mismatch between the invented tradition and the underlying mnemonic substrate, rendering the invention culturally unintelligible. |

  ## 3. Cruxes and Evidentiary Predictions

  The parties identify three specific cruxes where empirical investigation can adjudicate the residual disagreement. For each crux, a shared evidentiary case is defined, followed by the distinct predictions of each camp.

  1.  **Crux A: Differential Success vs. State Capacity**
      *   **Shared Evidentiary Case:** A comparative analysis of state-building efforts in two regions within the same polity during the same period, where state capacity and coercive resources are held constant, but pre-existing linguistic or ritual cohesion varies significantly.
      *   **Camp One Prediction:** The rate of national identification will correlate positively with the intensity of administrative penetration and educational spending, regardless of pre-existing cohesion. Variance is explained by implementation fidelity.
      *   **Camp Two Prediction:** The rate of national identification will correlate positively with the degree of alignment between state narratives and pre-existing linguistic/ritual boundaries, regardless of administrative intensity. Variance is explained by substrate resonance.

  2.  **Crux B: Archival Silence and Collective Identification**
      *   **Shared Evidentiary Case:** An examination of non-elite material culture (archaeology, vernacular inscriptions, oral tradition records) versus official state chronicles in pre-modern periods (pre-1700) regarding large-scale collective identification.
      *   **Camp One Prediction:** The absence of explicit national terminology in both elite and non-elite records indicates an actual absence of large-scale collective identification. Non-elite evidence will show only local or religious affiliations.
      *   **Camp Two Prediction:** The absence of explicit national terminology in official records reflects preservation bias. Non-elite evidence will reveal stable, large-scale memory-forms (e.g., pilgrimage routes, dialect zones) that function as proto-national identifiers despite lacking modern nomenclature.

  3.  **Crux C: Disrupted Rituals and National Identification**
      *   **Shared Evidentiary Case:** A measurement of national identification strength in regions where long-cycling ritual calendars were systematically disrupted by colonial or revolutionary intervention versus regions where such calendars were co-opted or left intact, controlling for subsequent institutional conditions.
      *   **Camp One Prediction:** There will be no measurable difference in national identification between disrupted and intact regions once modern institutions are established. Institutional presence overrides historical discontinuity.
      *   **Camp Two Prediction:** Regions with disrupted ritual calendars will show measurably weaker national identification and higher rates of subnational resistance compared to intact regions, even under identical institutional conditions.

  ## 4. Conclusion on Verbal vs. Substantive Dispute

  The parties have reviewed the terminology employed herein to determine if the disagreement is merely verbal. We conclude that the dispute is **substantive**, not verbal.

  While both camps agree on the existence of pre-modern cultural materials (languages, rituals, geographies), the disagreement over the term "substrate" cannot be dissolved by re-description without loss of predictive content. Camp One utilizes terms such as "raw material" or "cultural inventory" to denote passive resources subject to unlimited manipulation by state power. Camp Two utilizes "substrate" to denote active structural constraints that limit manipulation.

  Because these definitions yield opposing predictions regarding the outcomes of Cruxes A, B, and C (specifically regarding the limits of state power to override historical continuity), the dispute concerns the causal architecture of social reality rather than semantic classification. Consequently, no portion of the disagreement regarding the causal efficacy of mnemonic structures can be resolved through linguistic clarification alone; it requires the empirical adjudication outlined in Section 3.
