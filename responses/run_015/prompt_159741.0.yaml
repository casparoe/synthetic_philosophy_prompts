  **Advice on Scope (Read before sending):**
  Leave the scientific thought experiments (Galileo, Einstein) out entirely. I know they are where your instincts live, but for a six-month project with a logician on the committee, they are a trap. Formal systems (MIU, Chessboard) have clear rules; physics thought experiments rely on ambiguous physical intuitions. If you mix them, the philosophers will spend three months arguing about what counts as a "rule" in physics, and you won't finish the logic. Stick to the formal cases. You can mention them as "future work" to show you have ideas, but don't make them part of the deliverable.

  Below is the proposal text. It is drafted to fit within three standard pages.

  ***

  **Project Title:** The Epistemic Status of Meta-Systematic Arguments: Bookkeeping vs. Oracle Jumps

  **Principal Investigator:** [Your Name]
  **Duration:** Six Months

  **1. The Problem**
  In *Gödel, Escher, Bach*, Hofstadter introduces the notion of "Jumping Out Of The System" (JOOTS). The canonical example is the MIU puzzle: given specific string-manipulation rules, can one derive MU? The answer is no, but one cannot see this by manipulating strings alone. One must step outside the system, count the number of 'I's, and notice an invariant (the count is never divisible by three).

  This move feels like knowledge, not just a trick. However, there is no principled account of *why* this move is valid. Sometimes, stepping outside a system feels like adding a new axiom (an "Oracle Jump"); other times, it feels like merely tracking what was already there (a "Bookkeeping Jump"). My goal is to distinguish these two cases formally.

  **2. The Research Question**
  I propose to test a specific criterion for valid JOOTS.
  *Conjecture:* A meta-systematic argument is a legitimate Bookkeeping Jump if and only if the meta-system used to analyze the object system is a **conservative extension** of the object system.
  *(Gloss: An extension is conservative if it proves no new theorems in the original vocabulary. It adds tools, but no new truths about the original objects.)*

  The obvious answers do not settle this.
  1.  *Model Theory:* Saying "it's just a model" ignores why we trust the model. We need to know when the mapping from system to model preserves truth without adding content.
  2.  *New Axiom:* Saying "it's just a new axiom" misses the difference between discovering an invariant (MIU) and stipulating a rule (adding MU as an axiom).
  3.  *Invariants:* Saying "it's just an invariant" begs the question. Proving an invariant often requires induction.

  **The Wrinkle:** Internalizing induction is precisely the kind of extension that usually breaks conservativeness. If proving the MIU invariant requires induction over derivation length, and induction makes the system non-conservative, then my Conjecture might classify valid Bookkeeping Jumps as Oracle Jumps. This project will determine if conservativeness is the wrong criterion, or if it applies to the wrong object.

  **3. Methodology and Case List**
  I will treat this as an experimental inquiry. I will formalize four specific cases and test the Conjecture against them. The case list is fixed:

  1.  **The MIU System:** The prototype. The invariant is arithmetic (mod 3). The meta-system is Peano Arithmetic.
  2.  **The Mutilated Chessboard:** 31 dominoes cannot cover a board with two opposite corners removed. The invariant is parity (black vs. white squares). This appears to be pure Bookkeeping (colouring is structural).
  3.  **The Halting Problem:** Diagonalization proves no program can decide halting. This is a claim *about* the system. It looks like an Oracle Jump (it limits what the system can do), but it is derived via Bookkeeping (counting steps/encoding).
  4.  **Euclidean Algorithm Termination:** (The Tricky Case). The rule is simple subtraction: replace $(a, b)$ with $(a-b, b)$. It looks like Bookkeeping to track that $a+b$ decreases. However, proving termination requires the Well-Ordering Principle of natural numbers. This looks like Bookkeeping but relies on a substantive property of numbers that is not contained in the subtraction rules.

  For each case, I will:
  *   Formalize the object system (rules/vocabulary).
  *   Formalize the meta-argument (the "Jump").
  *   Determine if the meta-system is a conservative extension of the object system.
  *   Classify the Jump as Bookkeeping or Oracle based on intuition, then compare with the formal result.

  **4. Work Plan (Month by Month)**
  *   **Month 1:** Formalize the MIU and Chessboard systems. Define the "Bookkeeping" meta-languages for each (e.g., arithmetic for MIU, parity algebra for Chessboard).
  *   **Month 2:** Analyze the Halting Problem case. This is the hardest formalization. I will focus on the diagonalization step as the "Jump."
  *   **Month 3:** Analyze the Euclidean case. This is the critical test for the "induction wrinkle." I will determine if the Well-Ordering Principle counts as an Oracle addition.
  *   **Month 4:** Evaluate the Conjecture. If conservativeness fails (e.g., if valid Bookkeeping Jumps require non-conservative induction), I will refine the criterion. Likely refinement: Conservativeness applies not to the *logic*, but to the *ontology* (does the jump add new objects?).
  *   **Month 5:** Draft the "JOOTS Checklist." This will be a decision procedure for classifying future cases.
  *   **Month 6:** Final write-up. Integration of the four case studies and the Checklist.

  **5. Deliverables**
  1.  **A Short Monograph (approx. 40 pages):** "On the Epistemic Status of Meta-Systematic Arguments." This will contain the formal analysis of the four cases and the revised criterion.
  2.  **The JOOTS Checklist:** A one-page diagnostic tool. It will list questions a researcher can ask to determine if their meta-argument is Bookkeeping or Oracle. (e.g., "Does the proof require induction over derivation length?" "Does the meta-vocabulary introduce entities not nameable in the object system?").

  **6. Failure Conditions**
  I am aware this project could fail. I define failure as follows:
  *   **Collapse:** If the Bookkeeping/Oracle distinction turns out to be identical to the Conservative/Non-Conservative distinction in all four cases, the project is trivial. The Conjecture would be a tautology with no explanatory power.
  *   **Universal Non-Conservativeness:** If *all* four cases require non-conservative extensions (due to the induction wrinkle), then conservativeness is the wrong tool entirely. I would have to abandon the formal criterion and revert to informal intuition, which yields no new knowledge.

  If either occurs, I will pivot in Month 4 to a historical analysis of how mathematicians *decide* these jumps are valid, rather than trying to formalize the validity itself. However, the Euclidean case gives me reason to believe the distinction holds: tracking a sum (Bookkeeping) feels different than assuming Well-Ordering (Oracle), even if both use induction.

  **7. Scope Note**
  I have considered including scientific thought experiments (e.g., Galileo's falling stones) as a fifth case. I have decided against this. Scientific cases introduce ambiguity about physical laws that would consume the six-month timeline. By restricting the inquiry to formal systems (logic, arithmetic, tiling), I ensure the "rules" are fixed, allowing the committee to evaluate the "Jump" itself rather than the physics. I will note the scientific cases as a boundary for future research in the conclusion.

  **8. Background**
  My background is in solid-state NMR on disordered ceramics. For forty years, my work involved extracting signal from noise in systems where the rules were known but the behavior was chaotic. Two years ago, I began studying philosophy, specifically the logic of formal systems. This project sits at the intersection: it treats philosophical arguments as systems to be probed for structural invariants. I am not seeking to publish in a top-tier logic journal; I am seeking a clear answer to a question that has bothered me since I first read GEB.
