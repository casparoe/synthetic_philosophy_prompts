  10. **Final Polish:** Ensure the distinction between his *logic* (formal) and his *metaphysics* (rationalist/Platonist) is clear. He didn't think logic was *just* symbol manipulation; he thought it tracked objective truth. This is crucial for the SI debate. (Self-Correction: Make sure not to conflate Gödel with Penrose too heavily, though the connection is relevant regarding non-computability of mind).

