      *   **Task:** Evaluate the exposure of this view. Provide defeaters ranked from fatal to embarrassing, with justification.
      *   **Specific Points to Address:**
          1.  The user's homemade test (contingent aftereffects with novel shapes/values). Is it decisive? Can it separate cognition from attention? What if dual-task kills it?
          2.  Existing awkward findings (backpack/hill, tool/use, coin size, expertise, multistable figures). Rank them and provide best replies for the impenetrabilist.
          3.  Unfalsifiability worry. Is the view insulated/empty? Can the perceptual/judgemental line be drawn non-question-beggingly? What does the view predict positively?
          4.  Evidence hierarchy: Introspection vs. Adaptation.
      *   **Constraints:** British English (colour, organisation), no citations/references/reading lists, describe experiments instead, prose style, no long headings, ~900 words.
      *   **Tone:** Critical, honest, not flattering.

  2.  **Deconstruct the User's View:**
      *   Core claim: Cognitive states $\nrightarrow$ Phenomenal Character.
      *   Escape hatch: Effects are on attention, judgment, memory, response.
      *   Vulnerability: Distinguishing "experience" from "judgment" is notoriously difficult (the "line-drawing" problem).

  3.  **Address Point (1): The Homemade Test (Contingent Aftereffects):**
      *   *Idea:* Train shape-value association -> Adapt to shape -> Measure aftereffect on neutral stimulus (tilt/colour) across retinal position/eyes.
      *   *Strength:* Aftereffects suggest low-level sensory adaptation. Response bias shouldn't create a tilt aftereffect.
      *   *Weakness:* Attention can modulate adaptation. If cognition drives attention, and attention drives adaptation, is that penetration or just attentional modulation? The user concedes attention is everywhere.
      *   *Dual-task:* If dual-task kills it, it suggests cognitive load is required. This supports penetration (cognition needed) but could also mean cognition is needed to sustain attention.
      *   *Verdict:* Strong evidence, but not fatal if the user defines "attention" broadly enough to include value-driven attentional capture. However, if the aftereffect is truly *contingent* on the cognitive value and not just physical features, it pushes hard against impenetrability.

  4.  **Address Point (2): Existing Awkward Findings:**
      *   *Backpack/Hill:* Proffitt stuff. Best reply: Judgment bias (explicit estimation), not phenomenal steepness.
      *   *Tool/Action:* Witt stuff. Best reply: Affordance judgment, not visual size.
      *   *Coin Size (Bruner):* Classic. Best reply: Response bias/memory distortion.
      *   *Expertise (Radiologists/Wine):* Best reply: Perceptual learning (low-level changes over time), not top-down cognitive penetration *now*.
      *   *Multistable Figures:* Best reply: Ambiguous stimuli rely on judgment criteria to resolve; experience flips, but the *input* is constant, so the flip is interpretive.
      *   *Ranking:* Expertise is weakest (learning $\neq$ penetration). Coin size is weak (methodologically dubious). Hill/Tool are moderate (could be judgment). Multistable is tricky but manageable.
      *   *Fatal:* None of these are fatal because they rely on report measures.

  5.  **Address Point (3): Unfalsifiability & Line-Drawing:**
      *   *Worry:* If experience changes, you call it "not cognitive" or "not perceptual".
      *   *Reality:* This is the biggest threat. The view risks being tautological.
      *   *Prediction:* The view predicts null results on *phenomenal* measures that control for attention and judgment. But if every positive result is reclassified as "attention," the prediction is empty.
      *   *Non-question-begging line:* Hard to state in advance. Usually defined by modularity (speed, encapsulation). If cognition slows it down, it's not perceptual.
      *   *Positive Prediction:* Stability of experience across cognitive shifts.

  6.  **Address Point (4): Evidence Hierarchy (Introspection vs. Adaptation):**
      *   *User's view:* Introspection weak, Adaptation strong.
      *   *Assessment:* User is right. Introspection is noisy. Adaptation (physiological/behavioural signature of sensory change) is harder to dismiss as judgment.
      *   *Twist:* If adaptation changes, impenetrability is in trouble unless attributed to attention.

