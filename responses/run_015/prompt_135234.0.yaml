      *Self-Correction on Headings:* The prompt says "no headings longer than a few words". I should probably avoid them to stay safe on the "prose" instruction, or use very sparse italicised lead-ins. I'll stick to continuous prose with paragraph breaks to ensure flow and meet the "prose" vibe.

      *Check on Point 1:* The user asks if the test separates cognition from attention. I need to be clear: if cognition works *via* attention, is it penetration? Most impenetrabilists concede attention. So if the aftereffect is mediated by attention, the user is safe. If the aftereffect persists when attention is controlled, that's fatal.

      *Check on Point 3:* The "empty" worry. I need to be blunt. If the definition of "perceptual" shifts to exclude anything penetrated, the thesis is trivial.

      *Check on Point 4:* Introspection vs Adaptation. Adaptation is indeed stronger evidence for sensory change.

