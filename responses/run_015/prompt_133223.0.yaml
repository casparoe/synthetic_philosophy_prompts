  goods accumulate like dust upon the shelf,
  but who accounts the sum? There is no subject
  remaining here to witness their presence
  once the breath expires. We define harm
  by what is felt within a living future,
  so death resolves to simple absence.

  We mourn the absence of what might have been,
  claiming the grave steals back our accumulated goods.
  It truncates the timeline, cuts the future
  short. But if there is no subject left to suffer,
  how can the dead incur a distinct harm?
  Pain requires a mind in conscious presence.

  Maybe the value lies not in felt presence
  but in the gap, the structural absence
  where life should be. We label this a harm.
  To lose the goods is bad, even unseen,
  regardless of whether a subject witnesses
  the empty chair waiting in the future.

  We measure life against a possible future,
  not just the sensory data of presence.
  The interest of the subject persists past
  the end. The deprivation is an absence
  of experiences, projects, moral goods.
  This loss constitutes the specific harm.

  Harm is not only wound, but lost potential.
  The future goods denied are the real cost.
  We tally up the goods we never touched,
  ignoring the requirement of conscious presence.
  The badness lies in the comparative absence
  of life, even if no subject feels the loss.

  So the subject vanishes, yet the harm remains?
  Though harm requires a locus, we insist.
  We stare into the metaphysical absence
  and project value onto a blank future.
  One side demands the touch of presence,
  the other counts the uncollected goods.

  No subject stays to claim the future goods or harm,
  while theories clash on the necessity of presence
  and the deprivation found in pure absence.
