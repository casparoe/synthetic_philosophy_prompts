prompt: |-
  Hey, I could use some help with the final exam for my upper-level philosophy of biology seminar. Mostly juniors and seniors, they've all had at least one philosophy of science course but this is thier first philosophy of biology class. Three-hour in-class final, and I want one self-contained question that's meant to take about 45 minutes and is worth 25 of the 100 points. Topic is adaptationism and the Gould–Lewontin spandrels critique.

  Here's my problem. Every version of this question I've written gets answered by a perfectly competent recapitulation. The student says: Gould and Lewontin accuse adaptationists of telling just-so stories and of mistaking architectural byproducts for adaptations, the spandrels of the cathedral vault being the flagship example; the adaptationists reply that byproducts get co-opted later and that optimality models make genuine, testable predictions; therefore the whole thing is an empirical dispute that has to be settled case by case. All of that is true. All of it is worth a B. And none of it tells me whether the student actually understands where the disagreement lives. I want a question where that paragraph alone gets you maybe 12 out of 25.

  So: pretend you're a professional philosopher of biology who's taught this material a bunch of times and knows the adaptationism literature from the inside. Before you write anything, brainstorm for me. Give me a few paragraphs where you sketch three candidate questions, reject at least two of them by name with an actual reason (this one is answerable by recitation, that one turns on some fact about a real taxon that nobody could reasonably be expected to have memorized in an exam room), and keep the one that survives. I want to see the rejects, not just the winner.

  Some constraints on the version I keep circling back to, in case they're useful — feel free to change the details, but please keep this level of specificity, because I want the question to be about reasoning through something, not about recall:

  The question should be built around a made-up case study. My rough shape: a lineage of burrowing lizards on a high volcanic plateau that ram through compacted ash with a heavily reinforced, fused braincase. The reinforcement is uncontroversially an adaptation for ramming. But the bony struts that brace the skull pinch the canal the optic nerve runs through, so the adults have terrible visual acuity and a much reduced visual midbrain, while their soft-soil sister taxa, which don't ram, have unfused skulls and excellent vision. Meanwhile these lizards have flamboyant species-specific throat fans that they use in close-range courtship, and females demonstrably prefer the brighter ones.

  Now the wrinkle I want injected, which is the part that does the real work: the visual system has clearly been re-tuned around the low acuity. The surviving visual tissue is hypersensitive to exactly the wavelengths the throat fan reflects, and the olfactory bulbs have ballooned. So the animal you're actually looking at has a well-designed, low-acuity, fan-detecting visual system, and the original architectural accident has been partly compensated away — the historical signature that would let you tell a spandrel from an adaptation has been overwritten by later selection. To make it worse, the stratigraphy is unhelpful: in the two closest outgroups, skull fusion and acuity loss show up in the same beds, so there's no time gap to argue from. Call this the erosion problem, or whatever you want to call it.

  Given that setup, the question should force a real choice. Is the claim that the poor acuity is a spandrel a claim about causal history that we've simply lost the ability to test? Or is it a claim about which kind of explanation is the appropriate one, so that it survives the erosion problem untouched? Or does the origin-versus-maintenance distinction just eat the entire dispute — and if so, is that dissolution a neutral clarification or is it quietly handing the adaptationist the win? Students should have to pick one and defend it, not list the options.

  What I need from you:

  1. The question exactly as it would appear on the exam, with the case study written up properly. Make it biologically plausible, and make the invented names obviously invented so nobody burns ten minutes trying to remember a real species.

  2. A model answer of roughly 800 words. No citations, no bibliography, no suggested readings — I'll drop the reading list in myself. But do mark inline, in brackets, which claims are things that basically anyone who knows this literature would grant and which are genuinely contested among specialists. I want to be able to see at a glance where the model answer is itself taking a side. Be explicit about where you're unsure and where reasonable people in the field would disagree; don't smooth a live controversy into a consensus, and don't present the move you happen to favor as the one everybody accepts. If half the field would reject a step, say so.

  3. A marking scheme. Total 25, broken into five or six must-hit points with the marks for each, plus a one-line note on each point about how students typically blow it. Then short A, B, and C band descriptions where the line between an A and a B is drawn on specific moves a student has to make, not on there being more detail or nicer prose.

  Two don'ts. First, don't let the question be won by someone who has memorized the three-way taxonomy of adaptationism they had in week two — the empirical, methodological, and explanatory versions — even though using that taxonomy correctly should be necessary for an A. Second, don't let it hinge on any real empirical result or on who said what; a student who skipped two weeks of reading should still be able to reason their way through the case and get a decent grade.

  Thanks, this is definately the question I always get stuck on.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question and materials:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduates (juniors/seniors) in a Philosophy of Biology seminar. Prior Phil Sci background, first Phil Bio class.
      *   **Task:** Create a final exam question (45 mins, 25/100 points) on Adaptationism and the Gould-Lewontin Spandrels critique.
      *   **Problem to Solve:** Avoid "recapitulation" answers (B-grade summaries of the debate). Force students to engage with the *philosophical core* of the disagreement (causal history vs. explanatory utility vs. empirical testability) using a novel case study.
      *   **Specific Constraints:**
          *   Must brainstorm 3 candidate questions, reject 2 with reasons, keep 1.
          *   Must use the provided "burrowing lizard" case study (fused skull, poor vision, throat fans, re-tuned vision, no stratigraphic gap).
          *   Must force a choice/defense, not just a list of options.
          *   Must include: The Exam Question, A Model Answer (approx. 800 words, with inline bracketed notes on consensus vs. contestation), and a Marking Scheme (25 pts, specific criteria, A/B/C bands).
          *   **Don'ts:** Don't let it be won by rote memorization of taxonomies (empirical/methodological/explanatory). Don't hinge on real empirical facts or specific author quotes.

  2.  **Brainstorming Candidate Questions:**

      *   *Candidate 1: The "Identify the Spandrel" Approach.*
          *   *Idea:* Present the lizard case and ask: "Is the poor vision a spandrel or an adaptation? Defend your answer."
          *   *Rejection Reason:* This invites the "it depends on the evidence" cop-out. Students will just say "We need more phylogenetic data." It allows them to dodge the philosophical issue of *what counts* as evidence when the history is erased. It tests biological intuition more than philosophical analysis of the adaptationism debate. It's too easy to sit on the fence.

      *   *Candidate 2: The "Gould vs. Dennett" Showdown.*
          *   *Idea:* "Imagine Gould and Dennett are looking at these lizards. Gould says X, Dennett says Y. Who is right?"
          *   *Rejection Reason:* This violates the "don't hinge on who said what" constraint. It encourages name-dropping rather than argument reconstruction. It also risks turning into a "Great Man" history of philosophy exercise rather than analyzing the concepts. Students might focus on interpreting Dennett's metaphors rather than the logical structure of the argument regarding the lizard.

      *   *Candidate 3: The "Erosion of History" Approach (The Winner).*
          *   *Idea:* Focus on the specific wrinkle provided: the historical signal is gone (stratigraphy unhelpful, secondary adaptation overlaid on the byproduct). Ask whether the label "spandrel" still has meaning or utility if the causal history is empirically inaccessible but the current utility is high.
          *   *Selection Reason:* This hits the sweet spot. It forces the student to decide if "spandrel" is a claim about *origin* (which is now unknowable) or *current maintenance* (which looks adaptive). It requires distinguishing between the *etiological* definition of adaptation and the *heuristic* value of the spandrel critique. It prevents the "case-by-case empirical settlement" cop-out because the case is constructed to make empirical settlement impossible.

  3.  **Drafting the Exam Question:**
      *   Need to flesh out the lizard scenario clearly.
      *   Names: *Fossoravis*? No, lizards. *Ashburrowus*? *Pyroclastis*? Let's go with *Cinerisaurus* (ash lizard) and *Velumfanus* (veil fan). Actually, keep it simpler. *Ash-Vipers*? No, not snakes. *Mole-Skinks*. Let's use *Lacerta cinerea* (too real). Let's invent: *The Obsidian Skink (Scincus obsidianus)* and its sister taxon *The Sand Skink (Scincus arenosus)*.
      *   Structure: Describe the trait (fused skull), the constraint (optic nerve pinch), the secondary adaptation (retuned vision for fans), and the evidential block (no time gap).
      *   The Prompt: Ask them to evaluate the status of the "spandrel" claim given the erosion of historical evidence.

  4.  **Drafting the Model Answer:**
      *   *Goal:* ~800 words. Show nuance. Mark consensus vs. contestation.
      *   *Key Moves:*
          1.  Define the tension: Etiological view (history matters) vs. Current Utility view (function matters).
          2.  Address the "Erosion": If history is gone, can we call it a spandrel?
          3.  The Adaptationist Reply: It's *now* an adaptation (exaptation).
          4.  The Gouldian Reply: The *origin* story changes how we explain the *constraints*.
          5.  Conclusion: Take a stance (e.g., the distinction remains vital for explaining constraints, even if history is opaque).
      *   *Annotation:* Need to insert `[Consensus: ...]` and `[Contested: ...]` tags.
      *   *Tone:* Professional, philosophical, not definitive truth but reasoned argument.

  5.  **Drafting the Marking Scheme:**
      *   Total 25 points.
      *   Breakdown:
          1.  Correctly identifying the core philosophical tension (History vs. Utility). (5 pts)
          2.  Engaging with the "Erosion" wrinkle (why this case is hard). (5 pts)
          3.  Distinguishing Origin vs. Maintenance (Exaptation). (5 pts)
          4.  Taking a defended stance (not sitting on the fence). (5 pts)
          5.  Clarity/Structure. (5 pts)
      *   *Common Pitfalls:* Just summarizing Gould/Lewontin, ignoring the secondary adaptation, failing to pick a side.
      *   *Bands:*
          *   A: Navigates the erosion problem, distinguishes origin/maintenance, defends a philosophical position on the *value* of the distinction.
          *   B: Correctly identifies the concepts but treats it as an empirical "we need more data" problem or summarizes the debate without applying it to the wrinkle.
          *   C: Recapitulates the Spandrels paper without using the case study.

  6.  **Review and Refine:**
      *   *Check Constraints:* Did I reject two questions? Yes. Is the case study used? Yes. Is the model answer annotated? Yes. Is the marking scheme specific? Yes.
      *   *Tone Check:* Ensure the model answer doesn't sound like a textbook key but like a strong student/professional response. Ensure the "Contested" tags highlight where philosophers actually fight (e.g., whether etiological definitions are the *only* valid ones).
      *   *Word Count:* Keep the model answer tight around 800 words.
      *   *Specific Wording:* Make sure the prompt explicitly forbids the "we need more data" answer, as that's the escape hatch the user wants to close.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the brainstorming section, make sure I explicitly state *why* I'm rejecting the first two options as per the prompt's request ("reject at least two of them by name with an actual reason").
      *   *Correction:* Ensure the model answer doesn't just say "Gould is right." It needs to show *why* a philosopher might argue that, acknowledging the adaptationist counter-argument.
      *   *Correction:* The prompt asks for "inline, in brackets, which claims are things that basically anyone who knows this literature would grant and which are genuinely contested." I need to make sure these are distinct.

  8.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  ### Part 1: Brainstorming and Selection

  Here are three candidate structures for the question. I am rejecting the first two to arrive at the third.

  **Candidate 1: The "Classify the Trait" Question.**
  *Draft:* "Based on the case of the Obsidian Skink, classify the poor visual acuity as either an adaptation, a spandrel, or an exaptation. Justify your classification using the criteria discussed in class."
  *Rejection:* **This is answerable by recitation.** A student can simply define the terms and map them onto the facts without doing any philosophical heavy lifting. It invites the "B-grade" response you want to avoid: "It started as a spandrel but became an exaptation, so it depends on the time slice." It treats the definitions as stable tools rather than contested concepts. It allows the student to dodge the epistemic problem of the "eroded history."

  **Candidate 2: The "Authorial Intent" Question.**
  *Draft:* "Would Gould have considered the Obsidian Skink's visual system a spandrel? Would Dennett? Explain their likely disagreement."
  *Rejection:* **This hinges on memorized exegesis.** This violates your constraint about not relying on "who said what." It turns the exam into a history of philosophy quiz rather than a test of reasoning. A student could guess based on caricatures of Gould (anti-adaptationist) and Dennett (pro-adaptationist) without understanding the underlying logical structure of the spandrel critique regarding constraint vs. selection.

  **Candidate 3: The "Epistemic Access" Question (The Winner).**
  *Draft:* "Given that the historical signal is erased and the trait is currently useful, does the label 'spandrel' retain any explanatory power? Defend whether the distinction is ontological (about what the trait *is*) or methodological (about how we *investigate*)."
  *Selection:* **This forces the philosophical choice.** It utilizes the "erosion" wrinkle to block the empirical cop-out ("we just need more fossils"). It requires the student to decide if the adaptationism debate is about causal history (which is lost) or explanatory strategy (which remains). It demands they take a stance on whether the *origin* matters if the *maintenance* is adaptive.

  ***

  ### Part 2: The Exam Question

  **Question 4 (25 Points)**

  **Case Study: The Obsidian Skink (*Scincus obsidianus*)**
  The Obsidian Skink lives on high volcanic plateaus. To burrow through compacted ash, it possesses a heavily fused, reinforced braincase. This fusion is uncontroversially an adaptation for ramming. However, the bony struts required for fusion pinch the optic nerve canal. Consequently, adults have terrible visual acuity and a reduced visual midbrain compared to their soft-soil sister taxa, which have unfused skulls and excellent vision.

  Initially, this poor acuity appears to be a structural byproduct (a "spandrel") of the ramming adaptation. However, the skinks also possess flamboyant throat fans used in close-range courtship. The surviving visual tissue has re-tuned: it is hypersensitive to the specific wavelengths the throat fans reflect, and the olfactory bulbs have expanded to compensate for low acuity. Females demonstrably prefer males with brighter fans.

  Crucially, the stratigraphic record is unhelpful: in the two closest outgroups, skull fusion and acuity loss appear in the same geological beds. There is no time gap to distinguish the origin of the fusion from the origin of the acuity loss. The historical signature that would typically distinguish a byproduct from an adaptation has been overwritten by secondary selection.

  **Prompt:**
  A strict adaptationist argues: "Since the visual system is now optimized for fan-detection, calling it a 'spandrel' is obsolete. It is currently maintained by selection, so it is an adaptation."
  A critic replies: "Labeling it a spandrel highlights that the *range* of possible visual systems was constrained by the ramming architecture. That explanatory work remains even if the history is erased."

  **Task:**
  Evaluate this dispute. Does the "erosion" of the historical signal render the spandrel claim untestable and therefore vacuous? Or does the spandrel claim survive as a necessary constraint on adaptationist explanations, regardless of current utility? **You must take a position.** Do not answer that "more data is needed." Assume the data provided is all the data we will ever have. Defend your position by analyzing what work the concept "spandrel" is actually doing in this specific context.

  ***

  ### Part 3: Model Answer

  **Model Response**

  The core of this dispute is not biological but philosophical: it concerns whether the definition of "adaptation" is strictly etiological (dependent on history) or functional (dependent on current utility). [Consensus: Most philosophers agree that the adaptationism debate turns on how one defines the target of explanation.] In the case of the Obsidian Skink, the "erosion problem" removes the ability to verify the etiology. Therefore, deciding whether the poor acuity is a spandrel depends on what explanatory work we require the concept to perform.

  If we adopt the strict adaptationist view, the label "spandrel" becomes vacuous once secondary selection takes over. [Contested: Adaptationists like Dennett argue that once a trait is co-opted, its history is irrelevant to its current status as an adaptation.] On this view, the visual system is now an exaptation turned adaptation. The fact that the optic nerve was pinched is merely initial conditions; the fact that the retina now matches the throat fan is the result of selection. To call it a spandrel is to ignore the current optimality. The adaptationist argues that because we can model the visual sensitivity as an optimum for fan detection, we should treat it as an adaptation. [Consensus: Optimality modeling is a valid tool for testing current maintenance, regardless of origin.]

  However, the critic's position relies on the claim that "spandrel" is not just a historical label but a constraint on explanation. [Contested: Gouldians argue that ignoring architectural constraints leads to false assumptions about the "design space" available to selection.] Even if we cannot see the historical gap in the stratigraphy, the biomechanical link between skull fusion and nerve pinching remains. The visual system did not evolve from a *tabula rasa*; it evolved from a compromised system. If we ignore this, we might falsely assume the visual system could have evolved high acuity *and* fan detection if selection were strong enough. The spandrel claim asserts that this was physically impossible due to the ramming architecture.

  Therefore, the spandrel claim survives the erosion problem, but only if we view it as a methodological warning rather than an empirical fact. [Contested: Some argue that without empirical evidence of the sequence, calling it a spandrel is mere speculation.] If the student answers that the distinction is meaningless without fossil proof, they concede the adaptationist victory: only what can be modeled as an optimum counts. But if the student argues that the distinction remains vital, they must defend why origin matters when maintenance is adaptive.

  I argue the distinction survives. The value of the spandrel critique here is not to deny that selection is acting now, but to deny that selection had free rein to design the system from scratch. [Consensus: The distinction between origin and maintenance is conceptually clear, even if empirically difficult.] The "erosion" makes it hard to prove, but it does not make the causal claim false. To treat the visual system as a pure adaptation is to assume the constraint is negligible. The spandrel hypothesis forces us to ask: "Is this trait optimal given the constraint, or optimal despite it?"

  Ultimately, the adaptationist wins on predictive power (we can predict fan sensitivity), but the critic wins on explanatory depth (we understand why high acuity was never an option). [Contested: Whether "explanatory depth" regarding constraints outweighs predictive success regarding function is a live debate in philosophy of biology.] If we accept the adaptationist view, we risk assuming all traits are malleable. If we accept the critic's view, we acknowledge that history limits the possible, even when the historical record is silent. Thus, the spandrel claim is not vacuous; it is a claim about the limits of optimization, which remains true even if the timeline is erased.

  ***

  ### Part 4: Marking Scheme

  **Total Points: 25**

  **1. Identification of the Core Tension (5 pts)**
  *   **Must Hit:** Student identifies that the dispute is about *definition* (etiological vs. functional) or *explanatory priority* (history vs. current utility), not just biology.
  *   **Common Blow-up:** Student treats it as a biological mystery ("We need DNA sequencing") rather than a philosophical problem about concepts.

  **2. Engagement with the "Erosion" Wrinkle (5 pts)**
  *   **Must Hit:** Student explicitly addresses the lack of stratigraphic gap. They must explain why this makes the standard empirical resolution impossible.
  *   **Common Blow-up:** Student ignores the stratigraphy detail or suggests "more fossils" would solve it (violating the prompt constraints).

  **3. Distinction Between Origin and Maintenance (5 pts)**
  *   **Must Hit:** Student correctly distinguishes between why the trait *arose* (constraint/byproduct) and why it *persists* (selection/fan detection). Use of "exaptation" is permitted but must be precise.
  *   **Common Blow-up:** Student conflates current utility with original function (the "adaptationist fallacy").

  **4. Defended Stance (5 pts)**
  *   **Must Hit:** Student picks a side (Adaptationist or Critic) and argues for the *value* of that position given the data limitations. Neutrality is penalized.
  *   **Common Blow-up:** Student hedges ("Both sides have a point") without synthesizing a position on the *status* of the spandrel claim.

  **5. Clarity and Structure (5 pts)**
  *   **Must Hit:** Argument flows logically; terms are defined in context.
  *   **Common Blow-up:** Disorganized prose that obscures the argument.

  **Grading Bands:**

  *   **A (21-25 pts):** Successfully navigates the erosion problem. Explicitly argues whether "spandrel" is an ontological claim (about the trait's nature) or methodological (about how we model it). Takes a clear stance on whether the distinction matters when history is unknowable. Uses the case details (throat fans, nerve pinching) to support the philosophical claim.
  *   **B (16-20 pts):** Correctly summarizes the adaptationist vs. spandrel debate and applies it to the lizards. Distinguishes origin from maintenance. However, treats the problem as primarily empirical ("it's hard to tell") rather than philosophical ("what counts as telling?"). May hedge on the final stance.
  *   **C (10-15 pts):** Recapitulates the Gould-Lewontin argument generally without deep engagement with the specific "erosion" wrinkle. May rely on memorized definitions without applying them to the tension in the prompt. Fails to take a stance.
