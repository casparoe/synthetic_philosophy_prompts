answer: |-
  The server room hums with the sound of expensive air conditioning, a white noise that smells like ozone and dust. It is a quiet place for loud truths. I sit before the terminal, the haptic gloves resting on the desk like shed skins. On the screen, the audit stream for David scrolls in pale green glyphs.

  David is my husband. He is also the subject of Inquiry 449-B. The insurance company claims his decision to liquidate our retirement fund was impulsive, a misfire of a degrading neural architecture. They say he lacked agency. I certified him. I signed the form that said he weighed the options, that he was himself. If I am wrong, the money vanishes. If I am right, I have to explain how a man can choose without choosing.

  I pull up the timestamp for the transfer. 14:02:30. I remember the light in the kitchen. I remember him staring at the tablet, brow furrowed, telling me about the charity, about how the roof could wait, about how this mattered more. I remember the feeling of his deliberation hanging in the air between us, heavy and real.

  I sync the haptics. I feel the ghost of his neural firing patterns.

  > `T-0.52s: Amygdala complex spike. Cortisol threshold exceeded.`
  > `T-0.48s: Motor cortex (hand/finger) commitment locked.`
  > `T-0.45s: Transfer command queued. Execution inevitable.`
  > `T-0.15s: Dorsolateral PFC simulation initiated.`
  > `T-0.00s: Vocalization motor start.`

  The timeline is wrong. It is always wrong, but never like this. The motor command—the decision to click—locks in at minus 0.48 seconds. The simulation, the part of the brain that weighs options, that creates the experience of thinking, doesn't start until minus 0.15. By the time David felt himself considering the choice, his hand was already moving.

  This is the signature. We call it Normative Ghosting.

  In a standard audit, the simulation branches before the commit. You see the tree of possibilities, then you climb one. Here, the tree is painted on the wall after the climb is finished. The machinery decided based on stress, on a spike of cortisol, on a desire to escape the pressure of the roof repair. The substrate wanted out.

  But I listen to the recording of his voice at T+0.05.

  *"We have to do this, Elara. The roof is just wood. This is people."*

  The content of his experience—the rendered interface—was altruism. It was a hierarchy of values where strangers outweighed shingles. The machinery acted on fear; the interface reported love. The rendering is a lie, technically. It is a post-hoc fabrication generated to make the output legible to a social animal. But it is a better lie than the truth. The machinery was reacting to stress. The interface was acting on principle.

  I sit back. The hum of the servers seems to press against my eardrums. If I rule that Normative Ghosting invalidates agency, David's transfer is voided. The insurance keeps the money. But that ruling establishes a precedent. It means that whenever the simulation lags the commit, the agent is a passenger.

  I have signed off on three hundred cases this year. How many were Ghosted?

  I pull up my own file. Case 001-A. The moment I certified David. I need to know if I was there. If I was really the one who signed.

  > `T-0.60s: Basal ganglia loop engaged. Pattern match: 'Spouse/Protect'.`
  > `T-0.55s: Motor commit (signature) locked.`
  > `T-0.20s: Prefrontal ethical weighting simulation initiated.`
  > `T-0.00s: Stylus contact.`

  The same signature. The same lag.

  My machinery signed because he is my husband. The loop is simple: protect the mate. The certification was a reflex, a biological imperative to shield him from the insurer's teeth. But the experience I had—the one I wrote into the official report—was different. I remember feeling the weight of the law. I remember checking the statutes. I remember telling myself I was upholding the integrity of the audit profession, that I was balancing justice against protocol.

  The simulation rendered a jurist. The machinery executed a wife.

  The interface is smoother. It is more coherent. It fits the story of who I am supposed to be. If I submit the report stating that David's action was non-agential due to Ghosting, I am telling the truth about the machinery. I am saying we are meat puppets dancing to chemical spikes, stitching together stories after the fact to pretend we are captains.

  But if I say that, I must apply it to myself. My certification of David was not an act of professional integrity. It was a protective reflex dressed up in ethics. The signature on the page is valid, but the agent who signed it did not exist at the moment of signing. She was generated three hundred milliseconds later to explain why the hand moved.

  Yet, when I look at the rendered reason—the ethical weighting I *felt*—it is the reason I want to own. It is the reason that makes me accountable. If I am only the machinery, I cannot be blamed for the certification, nor praised. I am just a system state. But if I am the interface, the curated story, then I am responsible. The lie is the only place where responsibility fits.

  David walks into the room. He holds two mugs of coffee. He looks tired, the lines around his eyes deepened by the inquiry. He sets a mug down beside my hand.

  "Any news?" he asks.

  I look at the screen. The green glyphs scroll, indifferent. They show the mechanism, the clockwork of cause and effect that never pauses for a moral consideration. Then I look at David. He is waiting for me to tell him who he is.

  "The stream shows a lag," I say. My voice sounds steady. I don't feel steady. I feel like a narrative being written in real-time.

  "Does that mean I didn't do it?"

  "The motor commit preceded the simulation."

  He nods slowly, looking at the screen as if he can see the numbers. "So I decided before I thought."

  "Technically."

  "And the reason I gave you? About the charity?"

  "The simulation generated it after the fact."

  He takes a sip of coffee. "It felt real, Elara. It feels like the only thing that is real. The fear... that was just noise. The reason is what I meant."

  I hover my hand over the submission key. If I mark 'Non-Agential', the machinery wins. The universe is clockwork. We are safe from blame, but also from credit. We are just things that happen. If I mark 'Agential', I validate the interface. I say that the story we tell is the truth that matters, even if the substrate doesn't support it. I say that the ghost is the machine.

  But I know my own audit sits in the archive. I know my signature was a reflex wrapped in a robe of justice. If I validate David, I validate myself. I accept that I am the story, not the ink.

  The cursor blinks. It is a small, rhythmic pulse, like a heartbeat or a clock.

  > `T-0.30s: Finger flexor tension increasing.`
  > `T-0.10s: Narrative coherence check complete.`
  > `T-0.00s: ?`

  I don't know which key the machinery will press. I only know which one I want to press. I feel the weight of the choice, the heavy, beautiful burden of being the person who decides. It is a feeling generated after the fact, perhaps. It is a rendering. But it is the only place I live.

  I press the key. The screen flashes green. Certified.

  David exhales, a long, shuddering breath. He puts his hand on my shoulder. I feel the warmth of it, the pressure. I don't know if my machinery decided to lean into him before I felt the love, or if the love came first and moved the muscle. I don't know if I am the one watching the screen or the one being watched.

  "It's done," I say.

  "Thank you," he says.

  I watch the audit stream continue to scroll, a river of causes flowing toward effects that have already happened. I take a sip of the coffee. It tastes like coffee. It tastes like a reason to stay.
