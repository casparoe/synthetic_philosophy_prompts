  2.  **Deconstruct the Philosophical Issue:**
      *   *Buridan's Ass:* A donkey equidistant between two identical bales of hay starves because it has no reason to choose one over the other.
      *   *Camp 1 (Arbitrariness):* If reasons are equal, choice is arbitrary. Arbitrary choice is not rational (requires sufficient reason). Therefore, rational agents cannot choose without preference.
      *   *Camp 2 (Tie-breaking):* Rational agents have mechanisms (randomizers, habits, whims) that resolve ties without needing new evaluative preferences. Choice is still rational because it satisfies the goal (eating) even if the specific path is underdetermined.
      *   *User's Distinction:* Structural (objective symmetry) vs. Phenomenal (subjective feel).

