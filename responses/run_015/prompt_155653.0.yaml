      *   However, the core debate is usually about *normative* rationality vs. *psychological* possibility. Camp 1 is often making a normative claim (you *shouldn't* choose without a reason). Camp 2 is often making a descriptive or functional claim (you *can* choose via a secondary mechanism).
      *   The stalemate might be deeper: It's about the definition of "rationality" and the nature of "will."

  4.  **Brainstorming Kinds of Disagreement:**
