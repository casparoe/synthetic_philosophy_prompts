prompt: |-
  I'm a PhD student TAing a philosophy of cognitive science course, and next week I have to teach the frame problem to a mixed class of philosophy and computer science undergraduates in one eighty-minute section. Most of them have read Dennett's paper on the frame problem, but they haven't seen the original McCarthy and Hayes formulation, and I can tell from their forum posts that several of them think the frame problem is just about "how to give a robot enough common sense" or "the problem of listing all the facts a system needs to know." A couple of the CS students suspect it was solved by modern machine learning. I don't need you to explain the frame problem to me — I know the material. What I need is a teaching plan: the order in which the pieces have to be introduced, the one example that should carry the whole thing, the misconceptions that will predictably form and exactly where in the sequence I should head each one off, and how I'll know at the end whether they've actually understood the problem rather than just memorized a story about robots.

  Please structure your response in the following sections, with the rough lengths indicated:

  **Dependency structure** (about 250 words): What has to come first, second, and third in the explanation, and what depends on what. I'm especially interested in whether the McCarthy-and-Hayes technical formulation should come before or after the Dennett-style philosophical framing, and why. Tell me which idea, if not fully in place, makes everything that follows collapse.

  **The carrying example** (about 200 words): The one example or scenario that should run through the whole session. Tell me what it must have and what it must lack, and why Dennett's robot story is or isn't the right choice. If you think something else works better, describe it and justify the switch.

  **Misconception map** (about 300 words): The three or four most predictable misconceptions the students will bring or form, the point in the sequence where each one is likely to surface, and exactly how I should handle it at that moment — whether by letting it play out and then undercutting it, by heading it off before it crystallizes, or by using it as a bridge to the next piece. Address at minimum the "it's just the common-sense knowledge problem" conflation, the "machine learning solves this" line from the CS students, and whatever you think the third and fourth biggest traps are.

  **Check for understanding** (about 150 words): One question or task I can give in the last ten minutes that would tell me whether they've grasped the frame problem as distinct from the general problem of programming intelligence. It shouldn't be something they can answer just by summarizing Dennett. Tell me what a correct answer looks like and what a near-miss answer looks like — the one that sounds right but reveals they still don't have it.

  **What to leave out** (about 100 words): What I should openly refuse to cover at this level, and how to say so without making it sound like I'm dodging the hard part.
