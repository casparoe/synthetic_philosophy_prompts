answer: |-
  You have identified a well-known tension within cause prioritization, particularly in the Effective Altruism (EA) community, though it lacks a single, universally canonical academic name. It is most commonly referred to as applying the **Efficient Market Hypothesis (EMH) to Altruism**, or sometimes the **"$100 Bill on the Sidewalk" Argument.**

  However, the specific logical circularity you describe—where Neglectedness and Tractability become endogenous variables that cancel each other out—is technically an **Endogeneity Problem** within the ITN (Importance, Tractability, Neglectedness) framework. In informal discourse, this is often called the **"Low-Hanging Fruit Skepticism"** or the **"Why Hasn't This Been Done?" Heuristic.**

  Here is a breakdown of how to name, classify, and bound this reasoning pattern.

  ### 1. The Established Names and Concepts

  While there is no single "Fallacy of X" that covers this exactly, it is a composite of three established concepts:

  *   **The Efficient Market Hypothesis (EMH) for Altruism:** This is the dominant metaphor. Just as financial markets quickly price in available information (so you can't easily beat the market), the "market" for social good is assumed to be efficient enough that obvious, high-impact opportunities are already seized. If an intervention remains neglected, the market is signaling hidden costs or difficulties.
  *   **Endogeneity of ITN Scores:** In statistical modeling, endogeneity occurs when an explanatory variable is correlated with the error term or the outcome. In ITN scoring, Neglectedness is not independent of Tractability. High Neglectedness *causes* observers to infer Low Tractability. This creates a feedback loop where the framework resists identifying high-priority targets because the criteria undermine each other.
  *   **Adverse Selection (The "Lemons" Problem):** This draws from George Akerlof's work. If the "market" of altruists (governments, NGOs, researchers) has left a cause untouched, a potential entrant must assume they possess inferior information. The neglect is treated as a signal that the "fruit is rotten" (hidden technical or institutional barriers) rather than simply overlooked.

  ### 2. Distinguishing from Bayesian Updating and Adverse Selection

  You asked how to distinguish this from ordinary Bayesian updating or adverse selection. The distinction lies in the **strength of the prior** regarding market efficiency.

  **Valid Bayesian Updating:**
  *   **Logic:** "Others have not done this. Others are generally rational and informed. Therefore, there is likely a reason I haven't seen yet."
  *   **Validity:** This is rational *if* the altruistic sector functions like a competitive market with good feedback loops.
  *   **The Failure Mode:** It becomes problematic when it assumes **Perfect Market Efficiency.** The altruistic sector is rife with market failures (public goods problems, misaligned incentives, short election cycles, lack of profit signals). Treating the current distribution of effort as an *optimal* equilibrium is an error. The update should be: "Others haven't done this. The altruistic market is inefficient. Therefore, this might be an opportunity *or* a trap."

  **Valid Adverse Selection:**
  *   **Logic:** "Sellers know more about the car's quality than buyers; therefore, unpurchased cars are likely lemons."
  *   **Application to Causes:** "Experts know more about the intervention's difficulty than I do; therefore, unattempted interventions are likely intractable."
  *   **The Failure Mode:** This assumes the "experts" are both *capable* and *incentivized* to solve the problem. In many neglected causes (e.g., pandemic preparedness, AI safety, animal welfare), the experts may lack funding, political capital, or long-term incentives. The "neglect" signals **coordination failure**, not necessarily **technical intractability.**

  ### 3. The Circularity: The "ITN Tension"

  The circularity you noted ("Absence of effort proves intractability; Presence of effort proves low neglectedness") is a recognized critique of the ITN framework.

  *   **The Trap:** If you require a cause to be Neglected *and* Tractable, and you use Neglect as evidence of Intractability, the set of viable causes shrinks to near zero.
  *   **The Technical Term:** This is a form of **Selection Bias** or **Survivorship Bias** applied to interventions. We only see the interventions that *were* solved (high tractability, low neglect) or *weren't* attempted (high neglect, inferred low tractability). We rarely see the "High Neglect, High Tractability" quadrant because the reasoning rule explicitly filters it out.
  *   **The "Self-Sealing" Nature:** In epistemology, this resembles a **Motte-and-Bailey** argument.
      *   *The Motte (Defensible):* "We should be skeptical of easy wins because the world is competitive."
      *   *The Bailey (Controversial):* "Therefore, any neglected cause is inherently difficult."
      *   When challenged, the reasoner retreats to the Motte ("I'm just being careful!"); when prioritizing, they act on the Bailey ("This must be hard, so deprioritize it").

  ### 4. Drawing Boundaries: When is this Reasoning Valid?

  To prevent this from becoming a blanket dismissal of all neglected causes, you can apply the **Market Failure Diagnostic.** The reasoning move is valid *only if* you can identify why the "market" failed to pick the fruit.

  **Valid Application (The "Hidden Blocker" is Real):**
  *   **Mechanism:** You identify a specific friction.
  *   **Example:** "No one has built this cheap diagnostic because regulatory approval costs $10M, making it financially intractable for startups, even if technically easy."
  *   **Verdict:** Downgrade Tractability. The neglect is informative.

  **Invalid Application (The "Hidden Blocker" is Assumed):**
  *   **Mechanism:** You assume friction without evidence.
  *   **Example:** "No one has lobbied for this regulatory fix. It must be politically impossible." (When in reality, no one lobbied because no one thought to look, or the beneficiaries are disorganized).
  *   **Verdict:** Do not downgrade Tractability automatically. Investigate the **Coordination Failure.**

  ### 5. Summary Terminology for Your Use

  If you need to label this in writing or discussion, I recommend the following hierarchy:

  1.  **Broad Concept:** **Altruistic Market Efficiency** (or the **Efficient Altruism Hypothesis**).
  2.  **Specific Logical Error:** **Endogeneity Bias in ITN Scoring** (treating Neglectedness and Tractability as independent when they are correlated).
  3.  **Rhetorical Label:** **The "$100 Bill" Fallacy** (assuming no unclaimed value exists).
  4.  **The Corrective:** **Market Failure Analysis.** (Asking: "Is this neglected because it's hard, or because the incentives are broken?")

  **Precise Definition:**
  > "The **Equilibrium Inference Fallacy** in cause prioritization occurs when the observed distribution of resources (Neglectedness) is treated as a sufficient statistic for underlying difficulty (Tractability), without accounting for structural market failures, coordination problems, or information asymmetries that prevent efficient allocation. It creates a self-sealing loop where high-priority opportunities are systematically filtered out by the assumption that the current status quo represents an optimal equilibrium."

  This framing allows you to acknowledge the wisdom of the crowd (Bayesian update) without succumbing to the circularity that paralyzes action on genuinely neglected, tractable problems.
