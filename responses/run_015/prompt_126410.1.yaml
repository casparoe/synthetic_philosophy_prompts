answer: |-
  **Credence:** 0.65

  **Decomposition:**

  1.  **Empirical Robustness (0.75):** Large-scale replications of Moral Foundations Theory show the WEIRD/non-WEIRD split exists but with smaller effect sizes and more factor instability than originally claimed.
  2.  **Metaphysical Requirement (0.80):** Contemporary naturalistic realism generally distinguishes between moral truth conditions and the psychological salience or weighting of those conditions across populations.
  3.  **Explanatory Superiority (0.55):** Functionalist and constructionist accounts of norm variation are currently more parsimonious than positing ontologically distinct, context-sensitive moral properties.
  4.  **Conceptual Coherence (0.65):** Maintaining objectivity requires a robust account of invariant second-order principles to prevent context-sensitivity from collapsing into relativism.

  **Calculation:**
  I derive the final 0.65 by taking the arithmetic mean of the four sub-probabilities (0.6875) and applying a conservative discount factor to reflect the risk that the conjunction of these conditions fails if the weakest link (Explanatory Superiority) proves untenable.

  **Least Confident Term:**
  **Explanatory Superiority (0.55).** This is the bottleneck because evolutionary functionalism explains the divergence without the metaphysical overhead of moral properties.

  **Shifter:**
  A cross-cultural study demonstrating that "binding" intuitions (loyalty, authority) track mind-independent coordination goods *better* than local conventions do, even when those conventions contradict the intuitions.

  **Comparison to Interlocutors:**
  My final credence is **0.65**. I am closer to **Interlocutor B** (the convergence-based realist), because we both affirm the survival of moral realism, whereas Interlocutor A denies it entirely. However, I reject B's claim that convergence is required for realism.

  **Key Differentiator:**
  **Sub-question 3 (Explanatory Superiority)** is doing the work separating all three positions. Interlocutor A argues functionalism explains the data best (undermining realism); Interlocutor B argues convergence explains the data best (supporting strong realism); I argue pluralistic tracking explains the data best (supporting weak realism). The dispute is not about the data itself, but which metaphysical framework best explains the variation.
