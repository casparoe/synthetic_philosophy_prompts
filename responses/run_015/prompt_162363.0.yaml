answer: |-
  This is a tight 12 minutes. You are fighting against two enemies: **financial intuition** (money grows) and **psychological intuition** (I might not be here). Your goal is to isolate **Pure Time Preference (PTP)**: the idea that $t_1$ is intrinsically better than $t_2$ simply because $t_1$ is sooner.

  Here is the battle plan.

  ### 1. The Order of Operations (The Subtraction Method)
  Your instinct is correct. If you define PTP upfront, they will treat it like a vocabulary word to memorize. If you make them *feel* the gap, they will treat it like a problem to solve.

  **Minute 0–3: The Setup (The "Sterilized" Choice)**
  Present the choice, but immediately strip the instrumental variables. Do not let them breathe on the financial aspects.
  **Minute 3–6: The Reveal (The Leftover)**
  Show them that even after stripping risk/interest, they still prefer *now*. Name that leftover feeling.
  **Minute 6–9: The Distinction (Self vs. Other)**
  Pivot from "Me vs. Future Me" to "Us vs. Future Them."
  **Minute 9–12: The Trap & The Vote**
  Address the "starvation" objection and ask the final question.

  **Why this order?**
  If you start with the philosophy, they will counter with economics. If you start with the economics and eliminate them, the philosophy is the only thing left standing.

  ---

  ### 2. The Carrying Example: The "Magic Lockbox"
  Your Club Fund idea is high-stakes and real, which is great. **But** the dollar sign is a trap. It triggers "compound interest" reflexes instantly.

  **How to fix it:**
  Keep the $600, but put it in a **"Philosopher's Lockbox."**
  *   **The Script:** "We have $600. Option A: Pizza party today. Option B: Equipment in 5 years. **Rules of the universe for this thought experiment:** 1. There is no inflation. 2. There are no banks/interest. 3. The club is 100% guaranteed to exist in 5 years. 4. The equipment provides the *exact same amount of enjoyment* in 5 years as the pizza does today."

  **Why this works:**
  *   It uses your real context (so they care).
  *   The "Lockbox Rules" explicitly block the "put it in an index fund" and "what if the club dies" objections before they happen.
  *   It converts money into **utility** (enjoyment), which is what ethics cares about.

  **What a carrying example must have:**
  *   **Symmetry:** The benefit must be identical in magnitude, only separated by time.
  *   **Certainty:** No probability of non-existence.
  *   **Finitude:** You can't do both.

  ---

  ### 3. Misconceptions: When to Kill Them
  Here is the order they will arise, and the exact moment to swat them down.

  **1. "The discount rate is just the interest rate."**
  *   **When:** Minute 1 (Immediately after you propose the example).
  *   **The Pre-empt:** "I know what you're thinking: 'Invest the money.' I just banned that. In this scenario, cash does not grow. Why do you still hesitate to wait?"
  *   **Why:** If you don't kill this first, the rest of the talk is noise.

  **2. "We're not discounting the future, we're just unsure about it." (Risk)**
  *   **When:** Minute 2 (During the Lockbox setup).
  *   **The Pre-empt:** "I also guaranteed the club exists. No risk of death, no risk of bankruptcy. If you still prefer the pizza today, it's not because of risk."

  **3. "People who don't exist yet can't be owed anything."**
  *   **When:** Minute 7 (During the Self vs. Other distinction).
  *   **The Counter:** "This is the 'Non-Identity Problem.' Don't let them hide here. Ask: 'If we know they *will* exist, does their current non-existence matter?'"

  **4. "If you refuse to discount, you have to starve now and save everything."**
  *   **When:** Minute 10 (The "Absurdity" trap).
  *   **The Counter:** "We are talking about the *margin*, not the total. Zero discounting doesn't mean you never eat; it means a calorie today equals a calorie tomorrow. You still eat to survive today. It just means you don't eat *extra* just because it's today."

  **What you're missing:**
  *   **"My preferences will change."** (e.g., "I won't like club stuff in 5 years.")
      *   **Fix:** Add a Lockbox Rule: "Assume the future members value the club exactly as much as you do right now."

  ---

  ### 4. The Distinction: Self vs. Other (The "Identity Bridge")
  This is the most important philosophical move. You need to show that PTP is controversial even for *one person*, but becomes explosive when applied to *different people*.

  **Where:** Minute 6 (Right after you've isolated PTP).
  **How to set it up:**
  1.  **Step 1 (Intrapersonal):** "Okay, imagine it's just *you*. You can have a headache for 1 hour today, or 1 hour in 10 years. Same pain. 100% chance. Do you prefer to get it over with now?"
      *   *Most will say Yes.* This validates PTP for the self.
  2.  **Step 2 (Interpersonal):** "Now, back to the club. It's not *you* in 5 years. It's a 16-year-old who hasn't joined yet. Does the fact that it's a *different person* make the discounting more okay, or less okay?"
  3.  **The Bridge:** "If you say it's okay to hurt Future You because 'time matters,' do you have to say it's okay to hurt Future Them for the same reason? Or does 'different person' cancel the time excuse?"

  **Why this works:** It forces them to realize that "time" might just be a proxy for "selfishness."

  ---

  ### 5. The Final Question (The Comprehension Check)
  Do not ask "Does this make sense?" They will lie. Ask a question that forces them to apply the logic to a new scenario.

  **The Question:**
  > "Imagine you could press a button that swaps your next year of life with your 80th year of life. Health, happiness, and memory are identical in both years. The only difference is the date on the calendar. **Do you press the button?**"

  *   **If they say Yes:** They reject Pure Time Preference (they think time doesn't matter).
  *   **If they say No:** They accept Pure Time Preference (they think 'now' is intrinsically better).
  *   **If they say 'It depends':** Ask "On what? I told you everything else is equal."

  This tells you if they actually grasped the "ceteris paribus" (all else equal) nature of the problem.

  ---

  ### 6. What to Flat-Out Refuse to Explain
  You have 12 minutes. You cannot save the world. Draw a boundary line.

  **Say this explicitly:**
  > "I am not going to tell you the answer. I am also not going to explain **Hyperbolic Discounting** (the psychology of why our brains glitch on time) or the **Ramsey Formula** (the math economists use). Those are descriptions of *how* we discount. I am asking you to justify *whether* we should."

  **Why:**
  *   It stops the "actually, psychologically..." interruptions.
  *   It keeps the focus on *ethics*, not math or brain science.
  *   It signals that you respect them enough to leave them with the unsolved problem.

  ### Summary Checklist for your 12 Minutes:
  1.  **Min 0-3:** The Lockbox Fund (Kill Interest & Risk immediately).
  2.  **Min 3-6:** The Leftover (Define Pure Time Preference).
  3.  **Min 6-9:** The Bridge (You vs. Future You -> Us vs. Future Them).
  4.  **Min 9-10:** The Starvation Objection (Briefly dismiss).
  5.  **Min 10-12:** The Button Question (Vote & Stop).

  Good luck. If you keep the "Lockbox" rules strict, they won't be able to escape into finance talk.
