      *Wait, 90% cull is standard for GA/RL. Reducing to 50% might break the science.* I need to be realistic. Maybe limit the *intensity* of the aversive signal or the *duration* of the run. Or require a "painkiller" arm (ability to turn it off). Let's go with limiting the *intensity* and requiring a "humane endpoint" for individual agents if distress tokens spike.
      *Actually, the prompt says "lowest-scoring ninety percent are checkpointed and discarded."* If they are digital, "discarded" is deletion. If they have moral status, mass deletion is the issue. I will require a reduction in the cull rate for Arm B specifically.

      *Let's write.*

