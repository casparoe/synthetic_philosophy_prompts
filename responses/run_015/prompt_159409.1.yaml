      *   **Linden:** The session-scope rule is waived for evolutionary necessity but replaced with "generation-scope" welfare limits.
      *   **Causal Profile:** We reject the distinction that Arm A is inert. The aversive unit's functional role (learning modulation, pre-emption) constitutes a sufficient basis for moral concern, analogous to non-verbal pain.
