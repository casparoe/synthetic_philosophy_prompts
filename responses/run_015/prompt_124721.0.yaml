  # JOINT STATEMENT ON BIOLOGICAL AND NARRATIVE DEPENDENCY
  **Adversarial Collaboration: Autonomy-First Camp & Narrative-Potential Camp**
  **Bioethics Seminar Working Group**

  ## I. Agreed Claims

  1.  **Limitations of the Standard Debate:** Both camps agree that the standard opposition between Judith Jarvis Thomson's *Violinist Analogy* (focusing on bodily integrity) and Don Marquis's *Future-Like-Ours Argument* (focusing on the value of the future) creates a false dichotomy. Thomson isolates the donor's obligation, while Marquis isolates the recipient's loss. Neither adequately addresses the *nature of the connection* between donor and recipient.
  2.  **Distinction Between Dependency Types:** We agree on a conceptual distinction between **Biological Dependency** (the physiological requirement of one entity for another's resources to maintain metabolic function) and **Narrative Dependency** (the requirement of another's sustained cooperation to maintain a first-person perspective or life-plan that is already structurally present).
  3.  **Status of the Early-Gestation Fetus:** Both camps agree that an early-gestation fetus (pre-neural structuring) possesses Biological Dependency but lacks Narrative Dependency. It has a biological future, but no structurally present capacity to anticipate or inhabit a narrative.
  4.  **Relevance of the Artificial Womb:** We agree that an *Artificial-Womb Violinist* variant (where the dependent entity is housed mechanically but requires a specific donor's blood/tissue) successfully decouples gestation from bodily intimacy. This isolates whether the moral weight lies in the *use of the body* (AF focus) or the *deprivation of the future* (NP focus).
  5.  **Non-Identity of Death and Wronging:** We agree that causing death is not identical to wronging a being. A being can be wronged without dying (e.g., violation of rights), and a being can die without being wronged (e.g., withdrawal of support where no right to support existed). The dispute lies in determining *which* condition constitutes the primary moral injury in dependency cases.

  ## II. Disagreements Table

  | Issue | Autonomy-First Camp (AF) | Narrative-Potential Camp (NP) |
  | :--- | :--- | :--- |
  | **1. Moral Locus of Permissibility** | Permissibility depends strictly on whether the donor retains a right to bodily sovereignty. If the donor has a right to refuse, withdrawal is permissible, even if it causes death. The recipient's status is secondary to the donor's right. | Permissibility depends on the moral weight of the recipient's future. If the recipient possesses Narrative Dependency, depriving them of that future is a prima facie wrong that overrides standard donation burdens, unless the burden is catastrophic. |
  | **2. Early-Gestation Fetus & Narrative Dependency** | The lack of Narrative Dependency is morally incidental. Even if the fetus *had* Narrative Dependency, the donor's right to bodily integrity would permit withdrawal. The absence of narrative capacity merely removes a potential counter-argument, it does not grant the permission. | The lack of Narrative Dependency is morally decisive. Without a structurally present life-plan, there is no "subject" to be deprived of a future. Therefore, early abortion is not a moral harm of the same category as killing a narrative-being. |
  | **3. Artificial-Womb Violinist Variant** | **Verdict:** Permissible to withdraw.<br>**Reasoning:** Mechanical gestation removes the intimacy violation, but forced blood/tissue donation remains a violation of bodily sovereignty. Consent to donate must be ongoing; past consent or biological need does not create an enforceable obligation to sustain another's life. | **Verdict:** Impermissible to withdraw (in standard cases).<br>**Reasoning:** The patient (assuming later-gestation or adult) possesses Narrative Dependency. The donor's burden (blood/tissue) is significantly lower than the recipient's loss (entire narrative future). The value of the narrative future generates an obligation to sustain. |
  | **4. Source of Obligation** | Obligations arise from explicit consent, contractual responsibility, or direct causation of dependency. Mere biological potential cannot generate an obligation to use another's body. | Obligations arise from the intrinsic value of the narrative future. While consent strengthens the obligation, the value of the narrative life can generate a duty to aid even in the absence of prior contract, provided the burden is reasonable. |

  ## III. Cruxes and Predicted Verdicts

  The following sub-questions represent the pivot points of our disagreement. Resolution of these questions would significantly alter the moral calculus for at least one camp. For each crux, we identify a concrete case and record our predicted verdicts in advance.

  ### Crux 1: The Requirement of Present Consciousness
  **Question:** Does Narrative Dependency require *present* consciousness (current first-person experience), or is *structural capacity* (the physical hardware guaranteed to produce a future narrative) sufficient?

  **Relevant Case: The Synthetic Continuity Scenario**
  *Description:* A being exists in a vat with no present consciousness. It possesses an implanted neural architecture certified to generate a continuous, rich first-person narrative upon awakening in ten years. It is currently sustained by the biological contribution of a volunteer (e.g., hormonal regulation). The volunteer wishes to withdraw support, which will destroy the architecture before awakening.

  *   **Autonomy-First Prediction:** **Permissible to Withdraw.**
      *   *Rationale:* Without present consciousness, there is no current rights-holder. The "future narrative" is hypothetical. The volunteer's current bodily sovereignty outweighs the potential existence of a future person. There is no existing subject to whom an obligation is owed.
  *   **Narrative-Potential Prediction:** **Impermissible to Withdraw.**
      *   *Rationale:* Narrative Dependency is grounded in the *structural continuity* of the life-plan, not the momentary state of awareness. The architecture *is* the narrative in latency. Destroying it deprives the specific future subject of their existence, which is the core wrong. The volunteer's burden is outweighed by the destruction of a guaranteed narrative future.

  ### Crux 2: Social Contracts and Biological Potential
  **Question:** Can social contracts or initial consent generate obligations to sustain *mere* Biological Potential in the absence of Narrative Potential?

  **Relevant Case: The Bridge Donor Case**
  *Description:* A comatose adult (possessing Narrative Dependency prior to coma, currently suspended) is sustained by an artificial placenta but requires a specific volunteer's monthly blood donation. The volunteer initially consented but now wishes to withdraw. If they withdraw, the patient dies. (Contrast: A variant where the patient is an early fetus with *only* Biological Dependency, but the donor signed a binding contract to sustain).

  *   **Autonomy-First Prediction:** **Permissible to Withdraw (even with contract).**
      *   *Rationale:* Bodily rights are inalienable. A contract to sustain life via bodily contribution cannot be specifically enforced because it violates the ongoing right to bodily integrity. The shift from consent to refusal restores the donor's default sovereignty. The patient's prior narrative (in the coma case) does not create a lien on the donor's body.
  *   **Narrative-Potential Prediction:** **Impermissible to Withdraw (Comatose Adult) / Permissible (Early Fetus).**
      *   *Rationale:* In the Comatose Adult case, the patient retains Narrative Dependency (the narrative is interrupted, not erased). The initial consent solidified the obligation, and the value of the resuming narrative outweighs the burden of donation. In the Early Fetus variant (Biological Potential only), the lack of Narrative Dependency means the contract is insufficient to override bodily withdrawal, as there is no "subject" to harm.

  ## IV. Identification of Verbal vs. Substantive Dispute

  Upon analysis, we identify a **partially verbal dispute** regarding the definition of "Narrative," but a **substantive dispute** regarding the weighting of rights.

  1.  **Verbal Component:** If the Narrative-Potential Camp defines "Narrative Dependency" so broadly that it includes any biological trajectory toward consciousness (even without structural neural architecture), the disagreement with Autonomy-First collapses into a definitional argument about when "potential" becomes "capacity." We agree to stipulate that Narrative Dependency requires *structural neural capacity for first-person continuity*, not merely genetic potential.
  2.  **Substantive Component:** Even accepting the stipulated definition, a substantive disagreement remains regarding **Inalienability vs. Value Maximization**.
      *   The Autonomy-First Camp holds that bodily sovereignty is a *side-constraint* that cannot be overridden by the value of the recipient's future, regardless of whether that future is narrative or biological.
      *   The Narrative-Potential Camp holds that the destruction of a narrative future is a *moral harm of such magnitude* that it can override standard bodily donation burdens, effectively treating the body as a resource that can be conscripted to prevent narrative extinction.

  **Conclusion:** The collaboration confirms that the Thomson/Marquis debate is best advanced by shifting focus from "Right to Life" vs. "Right to Choose" to "Sovereignty over Body" vs. "Protection of Narrative Continuity." The Bridge Donor and Synthetic Continuity cases serve as the decisive test beds for these principles.
