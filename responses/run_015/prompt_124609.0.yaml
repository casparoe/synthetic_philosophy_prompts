  ### The formula

  Your intuition tracks **Counterfactual Leverage with Iterative Optionality**. The formula is:
  $$V = (I \times T \times N_{slot}) \times (1 - F) + (L \times R) - S$$
  Where:
  1. $I \times T \times N_{slot}$ is standard impact, but $N_{slot}$ measures neglect of the *specific bottleneck task*, not the whole field.
  2. $F$ (Fungibility) is the probability your contribution is replaced by another donor. If $F \approx 1$, value approaches zero.
  3. $L \times R$ is the Learning Value. $L$ is information gained; $R$ is Retryability (ability to act on info later). If $R=0$ (one-shot), learning value is zero.
  4. $S$ is Systemic Risk, penalizing interventions that solve immediate problems by entrenching long-term structural failures.

  This formula prioritizes marginal changes over aggregate good. It values keeping future decision trees open (optionality) over closing them with high-stakes gambles. It demands that information be actionable by responsive agents. It treats structural integrity as a constraint, not just another variable. This is not utilitarian maximization; it is portfolio management for moral capital. You are optimizing for sustained influence, not just immediate utility units. The core shift is from "how much good" to "how much change *because of me* that lasts." It rejects pure expected value maximization in favor of robust, steerable impact pathways. It assumes you are building a portfolio of interventions where survival and adaptability matter more than single-shot home runs. Consequently, it favors interventions with high marginal utility of capital over those with high total utility but low marginality.

  ### Clause by clause

  **Specificity ($N_{slot}$):** Case #2 (Toxicology). Standard ITN rejects crowded fields. Your formula checks the *task*, not the field. If the binding constraint is empty, the slot is neglected regardless of headcount. This validates high-headcount niches where the marginal dollar solves the actual bottleneck, not just adds to the noise. It explains why you fund the dossier compiler despite the crowded lab.

  **Fungibility ($F$):** Case #3 (Loved Charity). If another donor fills the gap, your counterfactual impact is zero. This clause forces you to audit the funding landscape, not just the charity's needs. It kills "warm glow" giving where replacement is likely, ensuring capital goes to true gaps. It explains why the popular charity is worth nothing to you.

  **Retryability ($R$):** Cases #4 & #5 (Catastrophe vs Artifact). Both are low-probability. The difference is iteration. Case #4 keeps the decision tree open; failure yields data for Attempt #2. Case #5 is a terminal gamble. The formula zeros out learning value if you cannot act on it later, privileging survivable risks over heroic ones. This distinguishes the learnable shot from the dead-end artifact.

  **Responsiveness (Actionability):** Cases #6 & #7 (Diagnostic Study). Information only has value if agents can move. Case #6 works because the foundation is agile. Case #7 fails because priorities are locked. This clause demands you audit the *recipient's* freedom, not just the information's quality. Knowledge without agency is waste. It explains why the same study has different values in different contexts.

  **Systemic Risk ($S$):** Case #9 (Patronage). Immediate benefits are discounted by long-term structural damage. This clause acts as a veto. If an intervention solves a symptom by worsening the disease (entrenching patronage), the negative $S$ term overwhelms the immediate benefit. It forces a multi-generational time horizon on structural interventions.

  Together, these clauses shift focus from "good done" to "change caused." Notice how Retryability distinguishes two identical EV bets. Notice how Responsiveness distinguishes two identical studies. The formula is sensitive to context, not just content. It requires external audit: Who else is funding? Can they move? Will this break the system? This makes the calculation harder but more honest.

