  2. **The Cheap Pivot:** A $5k study resolves a factual dispute blocking a $50M program. **Verdict:** Yes. High $L \times R$. Low cost, high actionable information. Even if the study helps no one directly, it unlocks trapped capital. This tests the Responsiveness clause: is the $50M manager willing to pivot? If yes, leverage is 10,000x.

  3. **The Success Trap:** A policy that solves housing shortages by deregulating, but triggers gentrification that displaces the original beneficiaries in 20 years. **Verdict:** No. High immediate $I$, but massive $S$. The solution destroys the conditions for its own success later. This forces a long-term horizon on the Structural Risk term, penalizing short-term wins that mortgage the future. It captures the intuition that some solutions are self-defeating.

  These cases test the boundaries of personal fit, capital leverage, and temporal feedback loops. They confirm the formula handles non-monetary inputs (skills) and dynamic systems (policy feedback). They show the formula works beyond simple grantmaking into career and policy design. Each scenario isolates a specific variable to stress-test the formula's sensitivity.

