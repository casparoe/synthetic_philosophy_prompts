      *   *Case 2: Frame-rate (Temporal grain)*
          *   *HTA View:* Time is wall-clock (discounted). $t=1$ year.
          *   *Problem:* If subjective time density varies, 1 wall-clock year $\neq$ 1 experienced year.
          *   *Translation:* This is a measurement error in the "Q" or the "L". Likely the "Q" (intensity per unit time).
          *   *Verdict:* Fixable bookkeeping *if* we can measure subjective time. But if brain size proxies for processing speed, the "neuron count" metric conflates *capacity* with *duration*. It breaks the QALY time-standard.

      *   *Case 3: Marginal Cases (Microcephaly/Human variation)*
          *   *HTA View:* $w_i = 1$ for all humans. Normative constraint.
