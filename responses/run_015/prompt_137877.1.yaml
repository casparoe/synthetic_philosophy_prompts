      *   $\alpha>1$: Convex social welfare function regarding neural mass. Suggests diminishing marginal moral value of smaller brains or increasing marginal value of larger ones.
      *   *HTA Pin:* In HTA, weights are pinned by PTO studies or parliamentary mandate. Here, $\alpha$ is pinned by... metaphysics? Empirical correlation between neurons and "moral weight"? There is no PTO equivalent for cross-species neural mass. This is a major gap.

