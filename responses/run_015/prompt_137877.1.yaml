answer: |-
  This is a translation exercise from meta-ethics/longtermism into Distributional Cost-Effectiveness Analysis (DCEA). I will treat the "neuron-scaled QALY" proposal as a specification of a Social Welfare Function (SWF) and test it against the constraints of your framework.

  ### 1. The Translation: Mapping the Neuron-Scaled QALY

  Your dinner party colleagues are proposing a modification to the objective function of the HTA. In your standard model, the objective is to maximize:

  $$ \sum_{i=1}^{N} w_i \times QALY_i $$

  Where $i$ is an individual, $w_i$ is an equity weight (usually 1, or adjusted for severity/deprivation), and $QALY_i$ is the health benefit.

  The "neuron-scaled QALY" proposal ($QALY^* = QALY \times (\frac{N_{neurons}}{N_{human}})^\alpha$) can be decomposed into three distinct claims within your vocabulary. You need to separate them because they hit different parameters in your model.

  **A. The Inclusion Threshold (The Domain of $i$)**
  *   **The Claim:** Beings with neuron counts below a certain threshold do not enter the sum at all.
  *   **HTA Mapping:** This is an eligibility criterion. Currently, your HTA sets this at "human citizen/resident." The proposal expands the domain to "sentient beings" but imposes a biological cutoff.
  *   **The Fudge:** HTA eligibility is usually legal or clinical (diagnosis). Making it a function of continuous neuroanatomy requires a measurement technology you don't have (you can't scan every claimant's brain) and a normative cutoff you can't justify via PTO (Person-Trade-Off).

  **B. The Equity Weight ($w_i$)**
  *   **The Claim:** A unit of welfare experienced by a being with more neurons counts *more* in the social welfare function than a unit experienced by a being with fewer.
  *   **HTA Mapping:** This is a DCEA equity weight based on "capacity for welfare" rather than "need" or "severity."
  *   **The Fudge:** In DCEA, equity weights are typically inverse to capacity to benefit (prioritizing the worse off) or based on fair innings. This proposal is often *proportional* to capacity (more neurons = more weight). This inverts the standard egalitarian prior. It treats the SWF as a sum of *magnitude* rather than a sum of *claims*.

  **C. The Utility Metric ($QALY_i$)**
  *   **The Claim:** A "year of life" for a high-neuron being contains more "welfare stuff" than a year for a low-neuron being, even if both report "perfect health."
  *   **HTA Mapping:** This challenges the cardinality and inter-personal comparability of the QALY. It suggests the QALY is not a constant unit across the domain.
  *   **The Fudge:** HTA assumes 1 QALY gained for Patient A is equivalent to 1 QALY gained for Patient B. This is the "QALY currency" assumption. The neuron argument claims the currency has different purchasing power depending on the brain holding it.

  ### 2. Pinning the Exponent ($\alpha$)

  You asked what in your framework would pin down $\alpha$ (0, 1, or >1).

  *   **In HTA:** Equity weights are pinned by **social value judgments**. We run PTO studies or rely on committee deliberation to decide how much we value severity or end-of-life care. The "price" of the weight is determined by the opportunity cost of deviating from the maximization of raw QALYs.
  *   **In the Neuron Proposal:** There is no equivalent mechanism.
      *   If $\alpha=0$: This is a normative assertion of species-blind egalitarianism (one being, one vote).
      *   If $\alpha=1$: This asserts a linear relationship between neural mass and moral weight. This requires an empirical claim that "moral weight" is a physical quantity measurable in neuron counts.
      *   If $\alpha>1$: This asserts a convex moral value function.

  **The Gap:** In your framework, weights are *normative inputs*. In their framework, the exponent is often presented as an *empirical discovery* (i.e., "we are finding the truth about moral weight").
  *   **What pins it?** Nothing in health economics pins this. If you tried to elicit this via PTO ("Would you save 1 human or 100 mice?"), you are measuring *human prejudice*, not neural moral weight.
  *   **The Multiplier's Role:** It is doing the work of an **equity weight**, but it is masquerading as a **capacity-to-benefit adjustment**.
      *   *Capacity to benefit* in HTA usually refers to clinical responsiveness (e.g., a drug works better in early-stage disease).
      *   Here, it refers to *moral receptivity*.
      *   **Verdict:** Your models have no slot for "moral receptivity" distinct from "health utility." You assume if a patient values the health state at 1.0, that is the ceiling. They are arguing the ceiling itself scales with neuroanatomy.

  ### 3. The Residue Report

  Here is the breakdown of your three test cases. I will categorize the failure as either a **Blind Spot** (the framework lacks the vocabulary but could theoretically accommodate it) or **Incompatible** (accommodating it breaks the framework's normative foundations).

  #### Case 1: The Crowding Case (Two streams, one skull)
  *   **Scenario:** One biological organism, two architecturally separate conscious streams (fixed skull volume).
  *   **HTA Framework:** The unit of account is the **Patient ID**. One body = one claimant = one utility function.
  *   **The Break:** If moral weight tracks conscious streams, $N=2$. If it tracks biology, $N=1$.
  *   **Diagnosis:** **Blind Spot.**
      *   Health economics assumes the biological individual is the locus of utility. It has no mechanism for dissociated consciousness within one claimant (e.g., severe split-brain cases are still treated as one patient for resource allocation).
      *   **Fixability:** Theoretically fixable. You could redefine the unit of account from "biological human" to "locus of consciousness." However, this creates massive administrative impossibility (how do you bill? how do you consent?).
      *   **Implication:** The brain-size claim relies on "conscious streams" being the unit, while HTA relies on "organisms." This is a category error in the unit of analysis, not necessarily a moral disagreement.

  #### Case 2: The Frame-Rate Case (Temporal grain)
  *   **Scenario:** Small brain, high processing speed. More discrete experiences per wall-clock second.
  *   **HTA Framework:** QALYs are denominated in **wall-clock time** (discounted annually). The framework assumes a shared time-grid where $t=1$ is invariant across patients.
  *   **The Break:** If subjective time density varies, 1 wall-clock year $\neq$ 1 experienced year.
  *   **Diagnosis:** **Measurement Validity Failure (Blind Spot).**
      *   This reveals that the QALY assumes a standard "tick rate" of experience.
      *   **Is it Intensity or Number?** It conflates the two. In HTA, "intensity" is captured in the utility weight (0 to 1). "Number" is captured in time (L).
      *   If a mouse experiences 10x "moments" per second, is that a higher *Q* (quality) or a higher *L* (length)?
      *   **The Fudge:** To fit this, you would have to adjust the discount rate or the time denominator. If you treat it as intensity, it belongs in the $Q$. If you treat it as volume of experience, it belongs in the $L$.
      *   **Implication:** The brain-size claim is often smuggling a claim about *time perception* into a claim about *mass*. Your framework assumes time is objective; the argument suggests time is subjective. This is a bookkeeping choice, but it requires abandoning the standard discounting model which assumes wall-clock time is the opportunity cost metric.

  #### Case 3: The Marginal Cases (Human neuro-variation)
  *   **Scenario:** The multiplier applies to individuals. Humans with microcephaly get lower weights than neurotypical humans.
  *   **HTA Framework:** **Normative Constraint.** $w_i = 1$ for all humans is not an empirical finding; it is a constitutive norm of public health economics (equal concern and respect).
  *   **The Break:** Applying the neuron function within the human species violates the equality constraint.
  *   **Diagnosis:** **Incompatible.**
      *   **Can the framework give this up?** No. A national HTA that explicitly weights the QALYs of disabled citizens lower than able-bodied citizens ceases to be a *public* health institution and becomes a utilitarian calculator. It would violate human rights legislation and the foundational social contract.
      *   **Is the norm accidental?** No. It is not an accident that we only price human health; it is a boundary condition.
      *   **Implication:** This suggests the "brain size" claim is **ill-formed** as a universal moral principle *if* it is intended to guide public policy. It functions only if there is a discontinuous jump in the weight function at the species boundary (i.e., all humans get weight 1.0 regardless of neurons, but all mice get weight 0.01).
      *   **The "Speciesist" Fudge:** To make this fit HTA, you would have to introduce a "species indicator variable" that overrides the neuron count for *Homo sapiens*. This admits that the neuron count is not the actual moral driver; species membership is.

  ### 4. Summary: Blind Spots vs. Ill-Formed Claims

  You asked whether the residues are blind spots in vocabulary or signs the claim is ill-formed.

  1.  **Crowding (Unit of Account):** **Blind Spot.** HTA lacks the vocabulary for "sub-individual moral patients." This is a technical limitation of the patient-ID system.
  2.  **Frame-Rate (Time Metric):** **Blind Spot.** HTA assumes objective time. This is a measurement validity issue. It is fixable by re-denominating the QALY into "subjective time units," though this breaks comparability with opportunity costs (which are incurred in wall-clock time).
  3.  **Marginal Cases (Human Equality):** **Ill-Formed / Incompatible.** This is not a vocabulary gap. This is a collision with the normative foundation of the HTA.
      *   If the brain-size proponents argue the multiplier *must* apply to microcephalic humans, their claim is **incompatible with public health economics**. You cannot adopt it without ceasing to be an HTA.
      *   If they argue the multiplier applies *only* cross-species (humans are a special case), then "neuron count" is not the fundamental moral variable; "species membership" is. The neuron count is then just a proxy for "not human," which collapses the argument back into standard speciesism.

  **Final Verdict on the Exponent:**
  In your framework, the exponent $\alpha$ is a **policy parameter** determined by social values (PTO). In their framework, it is presented as a **truth parameter** determined by neuroscience.
  The translation fails because you are looking for a *weight* (which implies a trade-off we choose to make), and they are offering a *conversion rate* (which implies a fact we must discover).

  If you force their claim into your SWF, you must treat $\alpha$ as a normative choice. If you do that, you expose that there is no empirical way to pin it down. If you treat it as empirical, you break the QALY's assumption of inter-personal comparability. The residue is not just missing vocabulary; it is the realization that "moral weight" is not a variable that exists in the same ontology as "cost" or "health utility."
