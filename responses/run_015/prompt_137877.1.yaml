          *   Brain size role: Threshold for inclusion? If neuron count < $X$, weight = 0.
          *   *Fudge:* HTA assumes inclusion is binary (patient or not). Brain size argument suggests a continuum of moral status affecting inclusion *and* weighting.

      *   *Claim 2: How heavily does welfare count? (Equity Weights / Social Welfare Function)*
          *   Standard HTA: $SWF = \sum w_i \times QALY_i$. Usually $w_i = 1$ (utilitarian/sum) or weighted by severity/deprivation.
          *   Brain size argument: $w_i$ is a function of neuroanatomy ($N_i$).
          *   *Mapping:* This looks exactly like an equity weight in Distributional CEA (DCEA).
          *   *Fudge:* HTA equity weights are usually normative/policy choices based on *need* or *fairness* (severity, fair innings), not *capacity*. Using capacity as a weight violates the "equal concern and respect" norm for humans.

      *   *Claim 3: How much welfare is produced? (Capacity to Benefit / Utility Measurement)*
          *   Standard HTA: 1 QALY = 1 year in perfect health. Derived from preference elicitation (TTO, SG, EQ-5D). Assumes inter-personal comparability of utility intervals.
          *   Brain size argument: A unit of "experience" might be larger in a larger brain.
          *   *Mapping:* This challenges the measurement instrument. Is a pig's "1 year pain-free" equivalent to a human's?
          *   *Fudge:* HTA assumes the *scale* of the QALY is anchored across the population. If brain size scales the *magnitude* of the experience itself, the QALY metric is no longer constant. It becomes $QALY^*$.

