  4.  **Analyzing the Exponent ($\alpha$):**
      *   What pins $\alpha$ down in HTA terms?
      *   $\alpha=0$: Strict egalitarianism (one being, one vote). Equivalent to $w_i=1$ regardless of characteristics.
