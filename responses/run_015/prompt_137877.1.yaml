      *   **Task:** Translate the "brain size/neuron count moral relevance" debate (from animal welfare/longtermist circles) into health economic vocabulary. Deconstruct the specific proposal ("neuron-scaled QALY"). Analyze three specific edge cases (Crowding, Frame-rate, Marginal-cases). Identify residues (what doesn't fit).
