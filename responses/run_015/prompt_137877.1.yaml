          *   *Translation:* This violates the fundamental axiom of human moral equality underpinning public HTA.
          *   *Verdict:* This isn't a blind spot; it's a feature. HTA *refuses* to weight humans by capacity. If the brain-size argument requires this, it is incompatible with the normative foundation of public health economics, not just the vocabulary. It reveals the brain-size claim is likely a *species* claim disguised as an *individual* claim, or it requires abandoning the human-equality norm.

  6.  **Synthesizing the "Residue Report" (Blind Spot vs. Ill-formed):**
      *   *Crowding:* Blind spot. HTA assumes biological individual = moral individual.
      *   *Frame-rate:* Measurement validity issue. QALY assumes standard time perception.
      *   *Marginal Cases:* Normative incompatibility. The brain-size claim, if applied consistently, breaks the HTA social contract. It suggests the claim is ill-formed *for public policy* unless restricted to inter-species comparison only (which creates a speciesist boundary condition).

  7.  **Drafting the Response:**
