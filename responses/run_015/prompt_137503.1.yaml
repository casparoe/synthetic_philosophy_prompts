prompt: |-
  Hi — please act as an experienced facilitator of behavioural public policy workshops who also has a proper philosophy background on paternalism. Think carefully, brainstorm two or three genuinely different designs before you settle, and then give me the one you'd actually run.

  Context: I work in the policy team of a mid-sized city council, and I've just been handed the "behavioural insights" slot in induction week for our new cohort of policy advisers — about 24 of them, 90 minutes, 2pm right after lunch, in a room with a projector, a whiteboard, index cards, and no budget for cash incentives. Most are politics/economics/policy grads; roughly a third are instinctively hostile ("nanny state, just tell people the facts and let them decide"); two or three did a behavioural-econ module and think revealed preference settles the whole question. Last year I ran it as a slide deck of the greatest hits — fruit at eye level, the organ-donor default, all that — and it completly died. Half the room said "that's just marketing" and the other half said "that's manipulation dressed up as kindness," and we never got past the slogans. So this time I want them to run into the problem themselves rather than hear me describe it. Please don't build the session around the famous examples everybody's already seen, and don't hand me a reading list or name-drop studies I'd have to look up: I need something I could run on Thursday with what's in the cupboard.

  The thing I want them to come away seeing is a distinction I've been chewing on and can't get straight myself. The same intervention seems to me to be able to do two quite different jobs: it can be a way of getting someone to do what they already, on reflection, want to do but predictably won't get around to — the deadline they blow, the form they never send back; or it can be a way of steering someone towards something they wouldn't choose if you asked them calmly and they had time. I've been calling these the "servant" version and the "author" version, but label them however is clearer. The distinction matters because the actual politics of nudging is nearly always about which one is being done, and you usually can't tell from the outside. There's a second thing I want them to feel, which I think of as the endorsement asymmetry: a person can sign off on an arrangement at the moment it's introduced, not knowing whether they'll be the one who later gets tempted, and then experience that same arrangement as an imposition at the moment it actually bites on them — and it's genuinely unclear which of those two moments should settle whether what was done to them was paternalistic.

  So: design me a session where that shows up in what happens, not in what I say. I'd like at least one real piece of choice architecture built into the room or the sign-up before they arrive — something they don't notice until I point at it, which then becomes Exhibit A — plus a main structured activity with roles, rules and small real stakes (chocolate, status, getting out ten minutes early, a mildly annoying task, whatever works without money) in which participants have to design or pick a default/opt-out arrangement while partly ignorant of what their own later self will want, and then live under it for a while. The servant/author distinction should be something they generate out of what happened to them, not something I define on a slide, and the word "paternalism" shouldn't be used at all until the last ten or fifteen minutes. Then give me the debrief: map specific moments onto the specific thing they're meant to see, say what you predict will go wrong the first time I run it — I already know about the tiny-stakes shrug and the two people who sussed the setup early and turned into professional contrarians, so give me fixes for those plus at least one failure mode I haven't thought of — and be honest about which part of this the activity simply can't produce and I'll have to say out loud myself.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Role:** Experienced facilitator of behavioural public policy workshops + philosophy background on paternalism.
      *   **Task:** Brainstorm 2-3 designs, select the best one, and provide a detailed plan (including debrief, predicted failures, and limitations).
      *   **Context:** Mid-sized city council policy team induction. 24 new advisers. 90 minutes. 2 PM (post-lunch slump). Room: Projector, whiteboard, index cards. No budget.
      *   **Audience:** Mix of skeptics ("nanny state"), over-confident econ grads ("revealed preference"), and generalists. Last year's "greatest hits" slide deck failed (accusations of marketing/manipulation).
      *   **Goal:** Participants need to *experience* the distinction between two types of interventions:
          1.  "Servant" (Helping them do what they *already* want to do but fail at due to friction/procrastination).
          2.  "Author" (Steering them toward something they *wouldn't* choose if calm/reflective).
          3.  Also experience "Endorsement Asymmetry" (Agreeing ex-ante vs. resisting ex-post).
      *   **Constraints:** No famous examples (no fruit at eye level, no organ donors). No reading lists. Must use existing room resources. One piece of hidden choice architecture *before/during* arrival. Main activity must involve designing/picking a default/opt-out with partial ignorance of future selves. "Paternalism" word banned until the end.
      *   **Deliverables:** Brainstorming (2-3 options), Selected Design (detailed run-of-show), Debrief script/map, Predicted Failures + Fixes, Honest Limitations.

  2.  **Brainstorming Designs:**

      *   *Idea 1: The "Meeting Time" Trap.*
          *   **Pre-work:** Send a survey asking what time they prefer for the session (2pm vs 4pm). Hide the fact that 2pm is the default.
          *   **Activity:** They design a policy for "attendance at optional training."
          *   **Critique:** Too meta. They are already in the room. If they hate 2pm, they'll just be grumpy, not reflective. Hard to control the "future self" aspect within 90 mins.
      *   *Idea 2: The "Charity Donation" Commitment.*
          *   **Pre-work:** Ask them to pledge a % of their day's effort to a cause.
          *   **Activity:** Midway through, offer an opt-out to stop working and relax.
          *   **Critique:** Ethical grey area with council employees (unpaid labor vibe). "Effort" is hard to measure. Stakes feel fake.
      *   *Idea 3: The "Information Overload" Default.*
          *   **Pre-work:** Email them a "Pre-reading Pack" with a hidden opt-out checkbox they missed.
          *   **Activity:** They have to process data to make a decision. Some have the "filtered" view (default), some have the "raw" view.
          *   **Critique:** A bit dry. Doesn't capture the *visceral* feeling of wanting to do something vs. being steered.
      *   *Idea 4: The "Break Time" Contract (Selected Candidate).*
          *   **Concept:** Use the universal desire for a break vs. the need to finish content.
          *   **Pre-work:** Hidden default on the sign-in sheet regarding break timing.
          *   **Activity:** Groups design a "productivity protocol" for a hypothetical citizen task (e.g., filing taxes), but they are actually subject to a protocol themselves regarding the workshop break/end time.
          *   **Refinement:** Let's make it more immediate. The "End of Session" Exit Ticket.
      *   *Idea 5: The "Feedback Form" Lock-in (Strongest Candidate).*
          *   **Concept:** Use the mandatory feedback form as the vehicle for the intervention.
          *   **Pre-work:** The room setup. Chairs arranged in a way that makes leaving hard or easy? No, too subtle.
          *   **Activity:** They must complete a task. The "Default" determines the difficulty of the task vs. the reward.
          *   **Refinement:** Let's go with a "Commitment Device" simulation involving the *end of the session*.
          *   **Core Mechanism:** Participants choose a rule for the group at the start (ex-ante) that binds them at the end (ex-post). The rule concerns whether they *must* complete a tedious but useful task before leaving, or if it's optional.
          *   **Twist:** The "Servant" vs. "Author" distinction emerges based on whether they *value* the task when the time comes to do it.

      *   *Idea 6: The "Policy Memo" Draft (The Winner).*
          *   **Pre-arrival:** The invitation email has a hidden default (e.g., "Please bring a pen" vs "Pens provided"). Let's make it about *preferences*. "Please indicate if you prefer a 10-min break or a straight 90-min session." The default is checked for them.
          *   **In-room:** A task where they draft a policy. Half the room gets a "frictionless" template, half gets a "friction" template.
          *   **Wait, I need to hit the "Servant vs. Author" and "Endorsement Asymmetry" specifically.**
          *   **Revised Winner:** **The "Voluntary Contribution" Game.**
          *   **Setup:** Before they sit, there's a sign-in sheet. It has a checkbox: "I agree to stay 5 minutes past the hour to summarize learnings." It is *pre-ticked*. (Hidden Architecture).
          *   **Activity:** They design a nudge for citizens to recycle. But to test their design, they must undergo a "compliance check" themselves.
          *   **Better:** Let's focus on the *break*. Post-lunch slump is real. They *want* a break (Servant) but might not *actually take it* if it's opt-in. Or they *don't want* a break (Author) because they want to leave early.
          *   **Best Concept:** **The "Exit Pass" Protocol.**
          *   **Pre-arrival:** Registration form asks: "How do you want to handle the final 15 mins?" Option A: Free to leave. Option B: Guided reflection (mandatory). Default is B.
          *   **In-room:** They don't notice the default until pointed out.
          *   **Activity:** They are split into "Architects" and "Citizens." Architects design the rule. Citizens live under it. Then they swap.
          *   **Wait, the prompt asks for ONE design I would actually run.** I need to brainstorm 2-3 briefly, then flesh out the best one.

      *   *Brainstorm 1: The "Seating Chart" Default.* Arrange chairs in clusters. Some tables have "Do Not Disturb" signs (opt-out of interaction). Others have "Collaborate" signs (opt-in).
      *   *Brainstorm 2: The "Feedback Form" Lock.* The feedback form is distributed at the start. It must be handed in to leave. The questions change midway.
      *   *Brainstorm 3 (Selected): The "Commitment Contract" Simulation.*
          *   **Hidden Architecture:** The sign-in sheet includes a "Commitment to Participate" clause that is pre-ticked. It says "I agree to contribute at least one idea."
          *   **Main Activity:** "The Future Self Contract." Participants write a goal for the session. They choose a penalty for not achieving it. The penalty is administered by the facilitator.
          *   **Why this fits:** It directly tackles the "ex-ante vs ex-post" conflict. It creates a tangible stake (social embarrassment/time). It allows for the "Servant" (I wanted to contribute) vs "Author" (I was forced to speak) distinction.

      *   *Wait, let's refine the "Selected" one to be more robust.*
      *   **Design:** **"The 3:30 PM Clause."**
      *   **Hidden Architecture:** The calendar invite/email confirmation had a line: "Session ends at 3:30 PM sharp. *Optional* 15-min debrief follows." The *room booking* however, is until 3:45. The default is that everyone stays.
      *   **Activity:** Participants are tasked with designing a "Compliance Protocol" for a hypothetical council service (e.g., bin collection). They must choose between an Opt-In system and an Opt-Out system.
      *   **The Twist:** They are *also* subject to a Compliance Protocol for the workshop itself regarding the final 15 minutes.
      *   **Actually, let's make it more personal.**
      *   **Design:** **"The Envelope Game."**
      *   **Pre-work:** On their chairs, an envelope. Inside: A "Contract." It says "I intend to learn X." It also has a clause about the end of the session. "I agree to stay for 10 mins extra to consolidate." Pre-signed by "Management" (the facilitator). They can void it by standing up now. (Most won't).
      *   **Activity:** Designing a nudge.
      *   **Debrief:** Reveal the contract. Discuss how they felt.

      *   *Okay, I need to be sharper.* The prompt wants the *distinction* (Servant vs. Author) to emerge from the activity.
      *   **Final Choice:** **"The Two-Room Policy."**
      *   **Hidden Architecture:** The room has two doors. One is labeled "Exit." The other is labeled "Reflection." The "Exit" door is physically obstructed (e.g., a table in front of it) but not locked. The "Reflection" door is open. (Too theatrical).
      *   **Let's go with the "Sign-In Default" + "The Task Burden."**
      *   **Hidden Architecture:** The sign-in sheet has a pre-ticked box: "I am willing to be called upon to present my group's work."
      *   **Activity:** Groups design a policy. At the end, the facilitator invokes the sign-in clause. Some *want* to present (Servant - they wanted to show off), some *hate* it (Author - forced exposure).
      *   **Wait, the "Endorsement Asymmetry" needs to be about the SAME person at different times.**
      *   **Okay, the "Break vs. Content" Trade-off.**
      *   **Hidden Architecture:** The agenda on the screen says "Break: 2:45-3:00". But the *sign-in sheet* they filled out at the door had a small print: "By signing, you agree to waive the break if the group deems content priority high."
      *   **Activity:** At 2:45, the Facilitator puts it to a vote. But the voting mechanism is rigged (Default is 'No Break').
      *   **Okay, I have a solid concept.** I will call it **"The Commitment Contract."**

      *   *Wait, I need to check the constraints again.* "One real piece of choice architecture built into the room or the sign-up before they arrive." "Main structured activity... partly ignorant of what their own later self will want."
      *   **Refined Concept:** **"The End-of-Session Tax."**
      *   **Pre-arrival:** Email says "Please bring a pen." (Standard).
      *   **Hidden Architecture:** On the tables, there are index cards. Half say "Option A: Leave on time." Half say "Option B: Stay 10 mins for summary." The cards are placed face down. The Facilitator says "Pick a card, this is your group's rule for the end of the day."
      *   **Actually, the "Sign-In Default" is stronger.**
      *   **Let's finalize the design:**
          1.  **Hidden Architecture:** The Sign-In Sheet. It includes a "Participation Pledge." "I agree to submit a written reflection at the end of the session." It is pre-ticked. They just sign their name.
          2.  **Activity:** "The Policy Design Lab." They design a nudge.
          3.  **The Twist:** At 3:20 PM (10 mins before end), the Facilitator reminds them of the Pledge. They must write the reflection.
          4.  **The Experience:** Some will feel helped (Servant - "I wanted to capture my thoughts, I would have forgotten"). Some will feel coerced (Author - "I just want to go home, this is busy work").
          5.  **The Asymmetry:** At 2:00 PM, signing felt noble/professional. At 3:20 PM, it feels like a burden.
          6.  **Debrief:** Map these feelings to the Servant/Author distinction.

      *   *Wait, I need to make sure the "Servant vs Author" distinction is about the INTERVENTION, not just the task.*
      *   **Revised Plan:**
          1.  **Hidden Architecture:** The Seating. Tables are arranged. On Table 1 & 2: "Default: Submit Work." On Table 3 & 4: "Default: Optional Work." (Visible only upon sitting).
          2.  **Activity:** They design a policy.
          3.  **The "Future Self" Ignorance:** They don't know how tired they will be at 3:30 PM.
          4.  **Debrief:** Compare Table 1/2 experience vs Table 3/4 experience.

      *   *Okay, I'll synthesize the best elements into one cohesive design.*
      *   **Design Name:** "The 3:30 PM Contract."
      *   **Hidden Architecture:** The Sign-In Sheet. It has a clause: "To ensure learning retention, all participants agree to complete a 5-minute exit ticket at 3:25 PM." Pre-ticked.
      *   **Activity:** They design a nudge for citizens.
      *   **The Reveal:** At 3:25 PM, enforce the ticket.
      *   **Debrief:** Discuss the feeling.

      *   *Wait, I need to make sure I brainstorm 2-3 first as requested.*
      *   **Brainstorm 1:** "The Seated Default." (Chairs arranged to force interaction vs isolation).
      *   **Brainstorm 2:** "The Break Vote." (Rigged vote on taking a break).
      *   **Brainstorm 3 (Selected):** "The Sign-In Commitment." (Pre-ticked box on attendance sheet regarding end-of-session task).

