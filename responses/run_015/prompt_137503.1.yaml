answer: |-
  Here are three distinct design concepts, followed by the one I recommend you run, fully fleshed out.

  ### Brainstorming Phase

  **Option 1: The "Seating Chart" Friction**
  *   **Concept:** You arrange the room so that half the tables have pens and notepads laid out neatly (low friction), and half have nothing (high friction). You announce that everyone needs to draft a policy idea.
  *   **Pros:** Visually obvious in debrief.
  *   **Cons:** Too passive. Participants might just borrow pens from neighbours, blurring the data. It tests *friction*, but not the *endorsement asymmetry* (ex-ante vs. ex-post preferences). It feels like a magic trick rather than a policy dilemma.

  **Option 2: The "Break Time" Vote**
  *   **Concept:** At 2:00 PM, you ask the room to vote on whether to take a break at 2:45 PM or work straight through to finish early. You rig the default option on the voting cards to "Work Straight Through."
  *   **Pros:** High stakes (fatigue vs. freedom). Directly tests the "future self" ignorance (they don't know how tired they'll be at 2:45).
  *   **Cons:** High risk of genuine anger. If they are exhausted, a rigged vote feels malicious, not educational. It creates an adversarial dynamic ("Facilitator vs. Room") rather than a reflective one ("Policy vs. Citizen").

  **Option 3: The "Sign-In Commitment" (Selected)**
  *   **Concept:** The attendance sheet they sign upon entry contains a pre-ticked checkbox agreeing to a specific task at the end of the session (e.g., a peer-review exchange). They sign without reading. At the end, you enforce the task.
  *   **Pros:** Perfectly captures the *Endorsement Asymmetry* (willing at 2:00 PM when fresh/optimistic, reluctant at 3:25 PM when tired). It creates a natural split between those who find the task helpful ("Servant") and those who find it burdensome ("Author"). It uses existing resources.
  *   **Cons:** Requires careful handling if someone spots the box early (see failure modes below).

  ---

  ### The Chosen Design: "The 3:30 PM Contract"

  This session is designed to make the *feeling* of paternalism visceral before you give them the vocabulary to describe it.

  **Session Goal:** Participants experience the gap between their "planning self" (2:00 PM) and their "doing self" (3:25 PM), and distinguish between interventions that enable their intent versus those that override it.

  **Resources Needed:**
  *   Projector (for timer and instructions).
  *   Whiteboard.
  *   Index cards (2 packs).
  *   **The Sign-In Sheet (Critical):** A single sheet of paper at the door.
  *   Pens (on the tables, not at the door).

  #### 1. The Hidden Architecture (Pre-Session)
  Place the **Sign-In Sheet** on a table just inside the door.
  *   **Header:** "Policy Induction Workshop – Attendance Register."
  *   **Columns:** Name, Department, Signature.
  *   **The Trap:** At the bottom, in slightly smaller font (but readable), add this line:
      > *By signing, I acknowledge the session includes a mandatory 10-minute peer-review exchange at 3:25 PM to consolidate learning.*
      > *[x] I agree to participate.* (Pre-tick this box).
  *   **Why:** Most will sign without reading. This is the *ex-ante* endorsement. They are committing their future tired self to work.

  #### 2. Run-of-Show (90 Minutes)

  **2:00 – 2:10: Arrival & Framing**
  *   As they trickle in, ensure they sign the sheet.
  *   Start exactly at 2:00 PM.
  *   **Opening:** "Welcome. Today isn't about me telling you what behavioural insights are. It's about you feeling how they work. We're going to run a simulation. I need you to treat the instructions in this room as if they were real council policy constraints."
  *   **Rule:** "No phones. Laptops closed unless instructed."

  **2:10 – 2:40: The Policy Lab (Activity Part 1)**
  *   **Task:** "In groups of 4, design a nudge to increase resident participation in local budget consultations. You have 30 minutes. You must produce a one-page proposal on the index cards."
  *   **Constraint:** "You cannot use financial incentives or legislation. Only choice architecture."
  *   **Facilitator Role:** Circulate. Do not help. Observe energy levels.
  *   **Time Check:** Put a timer on the projector counting down.

  **2:40 – 2:50: The Swap (The Intervention)**
  *   **Instruction:** "Stop writing. Pass your proposal to the table on your left."
  *   **Instruction:** "You now have 10 minutes to review another group's work. You must write three specific critiques on the back of their index cards."
  *   **The Hook:** "At the end of the session, I will collect these. The quality of your critique determines whether your group is 'cleared for implementation' (a status marker I will record)."
  *   **Note:** This is where the Sign-In Contract activates. You are enforcing the 3:25 PM task (adjusted slightly for flow, but the principle holds: mandatory extra work at the end). *Correction:* To align perfectly with the sign-in, announce this review at **3:15 PM**, not 2:40.
  *   **Revised Timing:**
      *   2:10–3:15: Design Work (65 mins).
      *   3:15: "Stop. Look at the bottom of the sign-in sheet you signed at the door. You agreed to a peer review. You have 10 minutes. Go."

  **3:15 – 3:25: The Grind (Activity Part 2)**
  *   This is the critical moment. Watch the room.
  *   Some will dive in enthusiastically ("Actually, this is useful").
  *   Some will sigh, check watches, and write cursory notes ("Just want to leave").
  *   **Facilitator Action:** Do not be soft. "5 minutes remaining. Please ensure your critiques are legible."

  **3:25 – 3:45: The Debrief (The Reveal)**
  *   **Step 1: The Data.** Ask for a show of hands.
      *   "Who read the clause on the sign-in sheet before signing?" (Usually 1 or 2 people).
      *   "Who felt the peer review was a valuable use of time?" (Hand count).
      *   "Who felt it was an imposition that you would have skipped if given the choice?" (Hand count).
  *   **Step 2: The Timeline.** Draw a line on the whiteboard: **2:00 PM [Sign In] -------- 3:25 PM [Review]**.
      *   Ask the "Imposition" group: "At 2:00 PM, did you want to learn? Did you intend to engage?" (They will say yes).
      *   Ask: "So why does the same rule feel different now?"
      *   *Key Insight:* Elicit from them that their *preferences changed* due to fatigue, but the *rule stayed the same*.
  *   **Step 3: The Labels.** Now you introduce your terminology.
      *   Point to the "Valuable" group: "For you, this rule acted as a **Servant**. It helped you do what you wanted to do (learn/give feedback) but might have lacked the discipline to do at the end of a long day."
      *   Point to the "Imposition" group: "For you, this rule acted as an **Author**. It overrode your current preference (to leave) in favour of a past preference (to learn)."
      *   **The Asymmetry:** "Which 'you' gets to decide if this was okay? The 2:00 PM you who signed? Or the 3:25 PM you who is tired? This is the **Endorsement Asymmetry**."
  *   **Step 4: The P-Word.**
      *   "In philosophy, we call the 'Author' version **Paternalism**. We call the 'Servant' version **Libertarian Paternalism** or **Soft Paternalism**. The politics of nudging is usually a fight over which version is happening. From the outside, they look identical. From the inside, they feel opposite."

  #### 3. Debrief Script & Mapping

  **Moment:** *Signing the sheet at the door.*
  **Concept:** *Ex-Ante Endorsement.*
  **Say:** "At this moment, you were your 'Planner Self.' You had high cognitive bandwidth. You valued professional development. You willingly signed a contract."

  **Moment:** *3:25 PM, when the timer goes off.*
  **Concept:** *Ex-Post Resistance.*
  **Say:** "Now you are your 'Doer Self.' You are cognitively depleted. The cost of the task has gone up. The benefit has gone down. The contract hasn't changed, but your relationship to it has."

  **Moment:** *The split in the room (Some liked it, some hated it).*
  **Concept:** *Servant vs. Author.*
  **Say:** "If I remove the rule, the 'Servant' group likely doesn't do the review. The rule helps them align action with intention. The 'Author' group *wouldn't* do the review even if calm, or they value rest more. The rule forces them. Same intervention. Two different moral realities."

  #### 4. Predicted Failure Modes & Fixes

  **Failure Mode 1: The "Tiny-Stakes Shrug"**
  *   **Risk:** Participants think, "It's just 10 minutes, who cares?" and the emotional resonance is lost.
  *   **Fix:** Raise the stakes socially. At 3:15 PM, say: "I will be reading these critiques aloud to the City Director as examples of your cohort's critical thinking." (You won't actually do this, but the *social risk* makes the imposition feel real).
  *   **Alternative Fix:** Make the "Exit" contingent. "We finish when the reviews are done." If they drag their feet, *they* keep the room hostage. This creates peer pressure, mirroring social norms in policy.

  **Failure Mode 2: The "Professional Contrarian"**
  *   **Risk:** One of the econ grads spots the pre-ticked box at 2:05 PM and calls it out as "deceptive."
  *   **Fix:** Do not get defensive. Immediately validate them. "Excellent observation. You are the only one who noticed. That is exactly the point of today's session. Please note your name, you will be leading the debrief on 'Transparency' later."
      *   *Why this works:* It turns their sabotage into data. It proves that defaults work *because* people don't notice them. It neutralizes their hostility by making them the expert.

  **Failure Mode 3: The "Hostile Takeover"**
  *   **Risk:** The group collectively refuses to do the review at 3:25 PM.
  *   **Fix:** This is actually a *good* outcome, but you need to pivot. "Okay. You have collectively opted out. That is a revealed preference. Let's spend the last 15 minutes discussing why the 'contract' failed. Was it the penalty? The timing? The legitimacy?"
      *   *Why this works:* It still proves the point about ex-post resistance. You still get the learning, just via a different route.

  #### 5. Honest Limitations (What you must say out loud)

  This activity cannot produce the following, so you must articulate them yourself in the final 5 minutes:

  1.  **Welfare Consequences:** "In this room, the stakes are low. If you hate the review, you lose 10 minutes. In real policy, if we get the 'Author' version wrong, we might cost citizens money or dignity. We can't simulate that harm here. You have to imagine the stakes are 100x higher."
  2.  **The "True" Preference Problem:** "We assumed the 2:00 PM you was the 'real' you. But what if the 3:25 PM you is the real one? What if you were just polite at 2:00 PM? Behavioural science can't tell us which self is the 'true' self. That is a political question, not a scientific one."
  3.  **Transparency:** "We hid the default today. In real policy, transparency is often required. Would this have worked if I told you at 2:00 PM 'I am going to force you to work at the end'? Probably not. So, is the effectiveness of the nudge dependent on deception? That's your homework."

  ### Facilitator's Cheat Sheet (For your pocket)

  *   **2:00 PM:** Watch who signs. If someone asks about the box, say "It's standard HR stuff" (a white lie to preserve the experiment, or tell the truth if you prefer ethical purity—but ethical purity kills the lesson). *Recommendation:* Tell the truth if asked directly, but don't highlight it. "It's just to ensure we have time for the closing exercise."
  *   **3:15 PM:** If energy is dead, be firmer. "I know you're tired. That's why the rule is here."
  *   **3:30 PM:** If the debate is hot, let it run. Cut the "Summary" slide. The debate *is* the summary.
  *   **Key Phrase to remember:** "Same rule. Different self."

  This design moves the "Paternalism" debate from an abstract ideological fight to a concrete, shared experience they all just lived through. It forces the skeptics to admit they signed a contract they didn't read, and forces the believers to admit that not everyone wanted to be "helped" at 3:25 PM.
