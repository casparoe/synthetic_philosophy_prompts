      *   **Round 1 (15 mins):** Standard EU calculation. Establish a baseline.
      *   **Round 2 (20 mins):** The twist. Buying info changes the world/values. Skeptics intervene.
      *   **Round 3 (15 mins):** Forced choice under incommensurability.
      *   **Debrief (20 mins):** The philosophical mapping.

  4.  **Fleshing out the Details:**

