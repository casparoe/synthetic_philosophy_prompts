      *   *Round 3:* They can't re-calculate because the units changed. They must vote based on "preference" but realize the preference is ungrounded.

  5.  **Refining the Debrief:**
      *   Connect Round 1 to "Risk" (known unknowns).
      *   Connect Round 2 to "Value Cluelessness" (info changes the axiology).
      *   Connect Round 3 to "Structural Cluelessness" (no common denominator).
      *   Address the "Hoarding" failure mode explicitly.

  6.  **Addressing Constraints & Limits:**
      *   Must explicitly state the game *cannot* simulate centuries.
