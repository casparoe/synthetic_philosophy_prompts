  2. Anchor the session in the example of shared labor on communal land, emphasizing that the labor does not merely sustain the community but actively generates the moral standing of the laborers themselves. Rigorously distinguish this from a social contract or cooperative enterprise by highlighting that participants are not pre-existing agents entering an agreement but are becoming persons through the activity.
  3. Head off the reduction to social constructivism during the ontological introduction, block the collapse into political communitarianism when discussing maintenance practices, and differentiate from feminist care ethics when addressing moral standing. Each correction must emphasize that relationality is a metaphysical condition of existence rather than a conceptual, structural, or purely ethical overlay.
  4. Conclude by asking whether a solitary individual retaining full psychological continuity could still be classified as a person within this framework. Their answer must reveal whether they view the relational link as constitutive of being itself or merely as a contingent factor in well-being.
  5. Explicitly omit detailed metaphysics of ancestral presence and specific ritual protocols to prevent students from dismissing the view as mystical or culturally particularistic. This omission protects the core ontological argument by allowing the logical structure of relational dependence to stand without anthropological distraction.
