answer: |-
  This is a classic debate in decision theory, essentially replaying the conflict between **Causal Decision Theory (CDT)** (Jake) and **Logical/Functional Decision Theory (LDT/FDT)** (Nina), with Hofstadter's informal "superrationality" as the battleground.

  Here is the referee ruling on moves 1–6, followed by the final verdict.

  ### The Move-by-Move Ruling

  **(1) Jake: "Magical thinking: pressing your button doesn't causally change theirs."**
  *   **Rating:** **Technically Right, Conceptually Limited.**
  *   **Justification:** Jake is correct according to standard Causal Decision Theory: there is no physical causal arrow from your hand to their brain. However, he is wrong to dismiss the correlation as "magic." In problems involving identical algorithms (or highly similar reasoning), the *output* is correlated even without causal influence. He is describing the map (causality), not the territory (logical dependency).

  **(2) Nina: "It's logical — if reasoning processes are isomorphic, computing your move is computing theirs."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the precise definition of superrationality (and modern Functional Decision Theory). If two agents run the same source code, they cannot output different results given the same input. Deciding your move *is* deciding the move of any isomorphic copy. This is not magic; it is mathematical identity.

  **(3) Jake: "Real-world copies never have perfect isomorphism; noise breaks the link."**
  *   **Rating:** **Empirically Right, Theoretically Pedantic.**
  *   **Justification:** Jake is right that perfect isomorphism is rare in biology or messy hardware. However, he is wrong to imply this invalidates the theory. Decision theory handles probabilities. If the correlation is 99% rather than 100%, the expected utility calculation still heavily favors cooperation in a Prisoner's Dilemma. He sets a bar (perfection) that isn't required for the strategy to work.

  **(4) Nina: "Build a confidence parameter." / Jake: "Then you've just rebuilt expected utility with a weird prior."**
  *   **Rating:** **Jake is Right.**
  *   **Justification:** This is Jake's strongest technical point. If you introduce a probability parameter for correlation, you are mathematically maximizing Expected Utility based on a specific belief state (a prior over the opponent's similarity). Formally, this collapses superrationality into Evidential Decision Theory (EDT) or Bayesian updating. It is not a *new* math, but a specific application of old math to logical facts.

  **(5) Nina: "In mixed tournaments... you context-switch, which shows superrationality is at least a coherent local strategy."**
  *   **Rating:** **Pragmatically Right.**
  *   **Justification:** Nina correctly identifies that rational agents should condition their strategy on the likelihood of facing a similar agent. Cooperating with a copy while defecting against a random stranger is consistent behavior, not a contradiction. It demonstrates the strategy is actionable, even if not universal.

  **(6) Jake: "If it's local and parameter-dependent... it's not a universal principle, it's just a heuristic, and calling it 'superrational' is marketing."**
  *   **Rating:** **Normatively Right.**
  *   **Justification:** Jake hits the philosophical nail on the head. A "principle of rationality" is usually expected to be categorical (e.g., "maximize expected utility"). If "superrationality" requires estimating the probability of isomorphism to function, it is indeed a heuristic strategy *within* expected utility theory, not a replacement for rationality itself. The term "superrational" does imply a transcendence of standard rationality that the math doesn't quite support.

  ---

  ### The Verdict

  **Who is right about what?**
  *   **Nina is right about the mechanism:** She correctly identifies that logical correlation is real and distinct from causal correlation. In scenarios with high algorithmic similarity (Newcomb's Problem, Prisoner's Dilemma with clones), her approach yields higher payoffs than Jake's. She understands that *information* about your decision is available to the opponent via logical deduction, not just causal signaling.
  *   **Jake is right about the formalism:** He correctly identifies that this doesn't require a new axiomatic system. It can be modeled as standard Expected Utility Maximization where the "states of the world" include logical facts about the opponent's source code. He is also right that "superrationality" is often sold as a mystical upgrade rather than a specific conditional strategy.

  **Who is missing the bigger picture?**
  *   **Jake is missing the payoff:** By rigidly adhering to causal independence, he leaves money on the table in Newcomb-like problems. He treats the lack of a causal arrow as a lack of *any* dependency, which leads to suboptimal outcomes in a universe where agents can predict or mirror each other.
  *   **Nina is missing the reduction:** She is treating "superrationality" as a distinct *kind* of rationality, when it is more accurately a distinct *input* to standard rationality. She is reifying a heuristic into a law.

  **Final Ruling:**
  **Jake wins the semantic and formal argument; Nina wins the practical and intuitive one.**

  The term "Superrationality" is indeed somewhat "marketing" (Jake's Move 6). In modern academic terms, this is best understood as **Functional Decision Theory (FDT)**. FDT agrees with Nina that you should cooperate with copies, but it agrees with Jake that this is simply the result of maximizing expected utility over *logical* counterfactuals rather than *causal* ones.

  **Advice for the Study Group:** Stop arguing about whether it's "magic" or "new rationality." Agree that **logical correlation is a real input for decision making.** If you believe your opponent is running a similar algorithm to you, cooperation is the utility-maximizing move. If you believe they are a black box causally disconnected from you, defection is the move. The "rationality" isn't in the rule, it's in the accurate assessment of the correlation.
