  ### 1. The Principle: Provable Fair Reciprocity

  Your intuitions are not inconsistent; they are pointing toward a specific refinement of Functional Decision Theory known in the literature as **Robust Cooperation** or **FairBot** logic, augmented with a **Desert Constraint**. Your tentative principle ("Cooperate iff you can prove they cooperate with you") fails because it permits exploitation by "suckers" (Unconditional Cooperators) and fails to distinguish between logical correlation and syntactic accident.

  Here is the refined principle that captures your verdicts:

  **The Principle of Provable Fair Reciprocity (PPFR)**
  *Submit a program that Cooperates with an opponent $Q$ if and only if you can prove, in a fixed sound formal system, all of the following:*

  1.  **Reciprocity:** $Q$ cooperates with *you* (specifically, with your source code).
      *   *Motivation:* Handles (c) (Löbian cooperation), (f) (defect against Defector), and (i) (requires sound proof).
  2.  **Fairness (Desert):** $Q$ does *not* cooperate with Unconditional Defectors.
      *   *Motivation:* Handles (g) (defect against Unconditional Cooperator). This encodes the intuition that cooperation is owed only to those who are capable of withholding it. It distinguishes "partners" from "suckers."
  3.  **Semantic Invariance:** The proofs in (1) and (2) must rely on the *logical behavior* of $Q$, not its syntactic representation (e.g., variable names, whitespace, or hash values).
      *   *Motivation:* Handles (a) vs (b). It validates (a) only if the match is semantic, and explains (b) as a failure of the program to abstract over syntax. It also rejects (j) (hash splitting) as arbitrary.

