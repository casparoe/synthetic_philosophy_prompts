  Elena and Marcus, equally tenured archivists on a museum board, deadlock over a plaque for the 1924 Millburn Strike: Marcus cites digitized payroll ledgers showing full wages paid, while Elena cites sworn affidavits from strikers' descendants describing a violent shutdown no record captures. They are calibrated peers, having matched accuracy rates on fifty prior provenance disputes, yet Elena possesses a unique evidentiary pathway through her community upbringing that allows her to trace the oral tradition's causal chain, whereas Marcus's file-based reasoning remains a black box to her. When Marcus insists the ledgers disprove the strike, Elena can internally verify she hasn't mishandled the testimony, feeling the solidity of her own reasoning trace, but the mere fact of his dissent—a peer with identical training—exerts a gravitational pull on her confidence. Conciliationism demands she split the difference and downgrade her certainty to suspend judgment, treating Marcus's disagreement as higher-order evidence of error, while steadfastness permits her to hold firm, arguing that her first-person access to her own correct weighing of the oral evidence outweighs the bare fact of Marcus's contradictory conclusion.

  **The Check**

  *   **Belief:** The strike occurred (oral tradition outweighs company record).
  *   **Method:** Comparative evidentiary weighting among calibrated peers.
  *   **Conciliationism Verdict:** Split the difference (suspend judgment/lower confidence). **Why:** Peer disagreement provides higher-order evidence that undermines justification, regardless of first-person access to one's own reasoning.
  *   **Steadfastness Verdict:** Hold firm. **Why:** Elena can inspect her own reasoning trace to confirm no error was made, whereas she cannot inspect Marcus's; thus, his dissent doesn't compel revision.
  *   **Feature Doing the Work:** Access asymmetry (community testimony vs. files) despite peer calibration (equal accuracy).
  *   **Remove Feature:** If both had identical access (e.g., both only saw files), the asymmetry vanishes, collapsing the case into a generic peer disagreement where steadfastness loses its "unique access" foothold and conciliationism becomes the dominant default.
  *   **Conciliationist Pushback:** The conciliationist argues that relying on first-person access is question-begging: if Marcus is truly a peer, he has likely accounted for the oral tradition's validity and still rejected it, so assuming your own reasoning is flawless simply because it is yours ignores the statistical probability of error signaled by his dissent.
