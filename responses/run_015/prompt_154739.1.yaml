          *   *What would change?* Nothing in the math. Only in the post-measurement story. *Unless* a theory predicted a divergence between (1) and (2) that GR doesn't.
          *   *Global vs. Local:* GR only guarantees local inertial frames. The ICRF assumes an asymptotic flatness or a "mean" rest frame of the universe. This is an idealization practice accepts for convenience.

      *   **Conclusion:**
          *   The prof and textbook are both half-right but missing the operational layer.
