          *   (1) ICRF is a *kinematic* realization. It's a coordinate choice. Quasars are used because they are "fixed" (high redshift, low proper motion). It's a practical convention for a celestial sphere.
          *   (2) Ring Lasers measure *dynamic* rotation (Sagnac effect). They measure rotation relative to *local inertial frames* (light propagation).
