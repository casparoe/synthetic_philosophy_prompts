          *   *For Astrometry:* The Quasar frame (ICRF) is a *convention*. If the Earth rotates relative to the ICRF, we update the Earth Orientation Parameters (EOP).
          *   *Crucial Distinction:* "Rotation" has two meanings here. 1. Rotation relative to local inertial guidance (dynamical). 2. Rotation relative to the celestial coordinate grid (kinematical).
