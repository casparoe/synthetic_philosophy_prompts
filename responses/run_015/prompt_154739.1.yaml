answer: |-
  This is an excellent question because it cuts through the usual metaphysical fog and asks what the *measurement protocols* actually commit us to. You are right to suspect that both your professor and the textbook are projecting a binary (Mach vs. Newton) onto a practice that has moved past it.

  Here is the reconstruction of the implicit theory presupposed by astrometry, geodesy, and navigation practice, followed by the specific answers to your wrinkles.

  ### 1. The Core Tension: ICRF (Quasars) vs. Ring Lasers (Sagnac)

  **The Practice:**
  *   **(1) ICRF (International Celestial Reference Frame):** This is a **kinematic convention**. It defines a coordinate grid. By choosing quasars (which have negligible proper motion due to distance), astronomers construct a "fixed" sphere. This is the "map."
  *   **(2) Ring Laser Gyroscopes:** These measure **dynamic proper rotation**. Via the Sagnac effect, they measure rotation relative to the local propagation of light (null geodesics). This is the "compass."

  **The Implicit Theory:**
  The practice does not presuppose Newtonian Absolute Space, nor does it presuppose strict Machian Relationism. It presupposes **General Relativity (GR) as an operational framework**, specifically relying on the **Einstein Equivalence Principle** and the reality of the **Metric Field**.

  *   **Strict Presupposition:** The practice presupposes that there exists a **local inertial structure** determined by the metric field $g_{\mu\nu}$, which dictates the behavior of light and free-falling test bodies (including gyroscopes).
  *   **What it fits fine with:** It fits with "spacetime substantivalism" if you identify the substance with the metric field (Metric Field Realism). It fits with "sophisticated relationism" if you view the metric as codifying the causal relations between matter.
  *   **What it rejects:** It rejects the idea that rotation is *only* relative to distant matter (pure Mach), because the ring laser works in a sealed box. It rejects the idea that rotation is relative to a background container independent of matter (pure Newton), because the practice corrects for gravitational time dilation and frame dragging.

  **Is (1) and (2) inconsistent?**
  No. They are measuring different categories of things.
  *   (2) measures $\omega_{\text{proper}}$: Rotation relative to local inertial guidance (Fermi-Walker transport).
  *   (1) defines $\omega_{\text{coord}}$: Rotation relative to a chosen celestial coordinate system.

  In standard GR, in a region with negligible mass-currents, the local inertial frame (2) should be non-rotating relative to the "fixed stars" (1). The practice assumes this coincidence holds to a high degree of approximation. The quasars are not *defining* inertia; they are **marking** a frame that is assumed to be inertial *because* the matter distribution of the universe is roughly isotropic and homogeneous on large scales. The quasars are a convenient proxy for the asymptotic rest frame of the universe.

  ### 2. Wrinkle One: Frame Dragging (Lense-Thirring)

  **Does this commit practice to a relational picture?**
  No. It commits practice to a **field-dependent** picture.

  In Mach's original view, if the universe rotates around you, you feel centrifugal force. In GR, if a massive shell rotates around you, it drags your local inertial frame (the "compass" inside the box turns).
  *   **The Operational View:** If Gravity Probe B or a ring laser detects frame dragging, the practice interprets this as a change in the **connection coefficients** ($\Gamma^{\mu}_{\nu\lambda}$) of the local metric.
  *   **Metaphysical Import:** This undermines pure Newtonian substantivalism (space is rigid and unaffected by matter). It also undermines pure Machian relationism (because the "dragging" is mediated by a field that has energy and momentum of its own, independent of the source matter once generated).
  *   **Verdict:** Practice treats inertial structure as **physical and malleable**. It is real (you can measure it with a laser), but it is coupled to matter (it moves when mass moves). This is the definition of the GR metric field.

  ### 3. Wrinkle Two: The Hypothetical Drift (VLBI vs. Gyro)

  **Scenario:** Over 20 years, Ring Lasers (local inertial) and VLBI (quasar frame) drift apart, correlated with a local rotating mass shell.

  **Which instrument says what is "really" not rotating?**
  *   **For Local Dynamics (Geodesy/Navigation):** The **Ring Laser** wins. If the ring laser reads zero, a Foucault pendulum in the lab will not precess. Coriolis forces will vanish. For the purpose of "is this lab rotating?", the local inertial frame (gyro) is the physical truth.
  *   **For Astrometry (Mapping):** The **VLBI/ICRF** wins, but only by convention. The ICRF is the definition of the coordinate grid. If the Earth's inertial frame drifts relative to the quasars, astronomers do not say the quasars are moving; they say the **Earth Orientation Parameters (EOP)** have changed.

  **What would geodesists do?**
  They would update the transformation matrix between the **ITRF** (International Terrestrial Reference Frame, earth-fixed) and the **ICRF** (Celestial).
  *   Currently, EOP accounts for precession, nutation, and polar motion.
  *   In your scenario, they would add a "Frame Dragging Term" or "Local Inertial Drift" to the EOP.
  *   **Grounds:** They would do this on the grounds of **General Relativity**. GR predicts that local inertial frames are not globally parallel in the presence of mass currents. Therefore, a "global non-rotating frame" is an idealization.
  *   **Local vs. Global:** This highlights that GR only guarantees **local** inertial frames. The ICRF is a *quasi*-global frame constructed for utility. If the drift is local (near the mass), the "global" quasar frame remains valid for deep space navigation, but the "local" gyro frame is valid for lab physics. The "inconsistency" is just the curvature of spacetime manifesting as a failure of global parallelism.

  ### 4. Metaphysical Swaps: What would concretely change?

  If you swapped the metaphysics but kept the math (GR), **nothing changes in day-to-day work.**
  *   **Substantivalist:** "The metric field rotated."
  *   **Relationist:** "The relations between the lab and the local light cones shifted."
  *   **Practice:** "Update the EOP by 0.001 arcseconds."

  The practice is **metaphysically underdetermined**. Both views license the same measurements *as long as they agree on the metric field equations*.

  **However,** if you swapped the *physical theory* based on the metaphysics:
  *   **If you enforced Pure Mach:** You might expect that if the distant universe stopped rotating relative to you, your ring laser *must* read zero, regardless of local mass shells. If the ring laser still read non-zero (due to local mass currents), Pure Mach would be falsified. Practice would have to discard Mach.
  *   **If you enforced Pure Newton:** You would expect the ring laser to read non-zero even if the local mass shell dragged the inertial frame perfectly. You would expect an "absolute" background. Practice would have to discard Newton.

  **The "Global Answer" Problem:**
  You asked if GR gives one global answer. **It does not.** GR only defines non-rotation locally (via vanishing vorticity of a congruence or Fermi-Walker transport).
  *   The practice *pretends* there is a global answer by using the ICRF.
  *   This is a **pragmatic idealization**. They assume the universe is asymptotically flat enough and the mass currents small enough that the ICRF serves as a valid "average" inertial frame for the solar system.
  *   If the drift you hypothesized became large, the practice would have to admit that **"Non-rotating" is not a global predicate.** They would have to specify: "Non-rotating relative to what?" (Local gyro? Distant quasars? CMB dipole?).

  ### 5. Verdict: Who is reading too much into plumbing?

  **Both your prof and the textbook are over-reading, but in different ways.**

  *   **The Prof (Machian):** Wrong to say (1) proves Mach. Using quasars is a **conventional choice** of a reference frame, not an ontological statement that distant matter *creates* inertia. They use quasars because they are stable, not because they are metaphysically generative.
  *   **The Textbook (Absolute/GR):** Closer to the truth, but sloppy. GR does keep rotation "absolute" in the sense that it is measurable locally without external reference (the ring laser). But it is not absolute in the Newtonian sense because the standard of non-rotation is determined by the metric field, which is dynamic and coupled to matter.

  **The Reconstruction of Implicit Theory:**
  The practice presupposes **Metric Field Realism**.
  1.  **Inertial structure is real:** It can be measured by sealed boxes (Ring Lasers).
  2.  **Inertial structure is dynamic:** It is influenced by mass-energy (Frame Dragging).
  3.  **Reference frames are conventional:** The Quasar frame is a useful coordinate choice, not the definition of truth.
  4.  **Locality is fundamental:** Global non-rotation is an approximation, not a law.

  **Summary Answer:**
  The inconsistency is only apparent. (1) defines a **coordinate standard** (the map); (2) measures **proper acceleration/rotation** (the compass). In GR, the compass is the physical authority on local dynamics, while the map is the authority on coordination. If they drift, GR explains it via the metric connection. The practice is not committed to Substantivalism or Relationism per se; it is committed to the **autonomy of the metric field**. It treats spacetime geometry as a physical entity that guides matter but is also shaped by it. Anything less (Newton) or more (Pure Mach) would require changing the correction algorithms in the navigation software.
