answer: |-
  There is no single, universally canonical term in legal theory or parliamentary procedure that captures this exact shape of problem across all contexts. However, it is a recognized structural vulnerability in rule systems.

  In constitutional theory, Example 1 touches on the **"Manner and Form"** debate (whether a legislature can bind its successors to specific procedures). In statutory interpretation, Example 2 resembles **"Amendment by Implication,"** though as you noted, that usually implies a contradiction rather than a dependency shift. In the context of organizational bylaws, *Robert's Rules of Order* treats this as a conflict between **specific and general provisions** (*lex specialis*), but that is a solution, not a name for the problem.

  Since there is no established label that fits the *pattern* rather than the *solution*, I will coin one for you, grounded in H.L.A. Hart's theory of rules.

  ### The Term: **Oblique Amendment**

  **Definition:** An **Oblique Amendment** occurs when the operative scope, protection, or effect of a **Target Rule** is altered not by amending the Target Rule's text directly, but by amending a **Dependency Rule** (semantic or procedural) upon which the Target Rule relies.

  This distinguishes it from *Direct Amendment* (changing the text of the Target Rule) and *Implied Repeal* (passing a new rule that contradicts the Target Rule). In an Oblique Amendment, the Target Rule remains textually intact but is functionally mutated.

  ---

  ### The Carving: Boundary Cases and Theory

  You asked for the "carving"—the precise boundaries of whether these count as the same move. To do this, we must look at the architecture of the rules.

  #### 1. Semantic vs. Procedural Dependencies
  *Is redefining a word (Example 2) the same move as altering an amendment procedure (Example 1)?*

  **Yes, structurally.**
  In jurisprudence (specifically H.L.A. Hart's *The Concept of Law*), rules are divided into:
  *   **Primary Rules:** Rules of conduct (e.g., "Pay fees," "Give notice for money").
  *   **Secondary Rules:** Rules about rules (e.g., "How to amend," "What words mean").

  Both of your examples are instances of **Secondary Rule Manipulation** to affect a Primary Rule.
  *   **Example 1 (Procedural):** You altered a *Rule of Change* (a secondary rule) to bypass the protection on a Primary Rule.
  *   **Example 2 (Semantic):** You altered a *Rule of Recognition/Interpretation* (a secondary rule regarding definitions) to narrow the scope of a Primary Rule.

  **The Carving:** While they are the same *genus* of move (Oblique Amendment), they differ in **detectability**.
  *   **Procedural Obliquity** is usually visible in the voting record (a motion to change voting thresholds).
  *   **Semantic Obliquity** is often hidden in a definitions section, making it a "stealthier" form of Oblique Amendment.
  *   *Verdict:* They are the same move theoretically, but Semantic Obliquity is often treated more permissively in drafting because definitions are expected to evolve, whereas amendment procedures are expected to be stable.

  #### 2. The Null-Effect Case
  *Does the case where the second rule changes nothing yet anyway count?*

  **Yes, as a Structural Risk; No, as a Material Event.**
  Suppose you redefine "Money" to exclude "honoraria," but the organization has never paid and never plans to pay honoraria.
  *   **Structurally:** This **is** an Oblique Amendment. You have successfully decoupled the Target Rule from a specific set of facts without voting on the Target Rule. You have established the *capacity* to bypass the Target Rule.
  *   **Materially:** It is a **Dormant Oblique Amendment**. It has no *operative* effect until the condition (paying honoraria) is met.

  **Why this distinction matters:**
  If you treat Null-Effect cases as "not counting," you allow organizations to plant "logic bombs" in their bylaws. A faction could quietly redefine "Member" to exclude a specific class of people without ever voting to expel them. The *structure* of the Oblique Amendment is in place, waiting for a trigger. Therefore, for the purpose of rule hygiene, **the structural change counts as the amendment**, regardless of immediate material impact.

  ---

  ### Why This Happens (The Theoretical Gap)

  The reason you cannot find a name for this is that most rule systems suffer from **Flat Hierarchy Syndrome**.

  In a well-drafted constitution or legal code, there is a hierarchy:
  1.  **Constitutional/Entrenched Rules** (Hard to change)
  2.  **Statutory/General Rules** (Medium difficulty)
  3.  **Definitions/Procedural Rules** (Should be subordinate to 1 & 2)

  In volunteer bylaws and forums, all rules often sit at the same "level." This allows a simple majority to amend a Definition (Level 3) that effectively neuter an Entrenched Rule (Level 1).

  ### How to Prevent It (The Solution)

  Since you write the rules, you can close this loophole. You need a **Hierarchy and Dependency Clause**.

  **1. The "Specific Overrides General" Clause:**
  > "Where a specific provision (e.g., Membership Fees) conflicts with a general provision (e.g., General Amendment Procedure), the specific provision prevails."
  *(This solves Example 1: The 2/3 requirement for fees overrides the simple majority for general amendments.)*

  **2. The "Substantive Effect" Clause:**
  > "No amendment to definitions, procedures, or schedules shall be adopted if its primary effect is to circumvent the amendment requirements or substantive scope of an entrenched provision."
  *(This solves Example 2: It forces the chair to rule that redefining 'money' to avoid notice requirements is out of order.)*

  **3. The "Incorporation by Reference" Doctrine:**
  > "Any rule that incorporates a term defined elsewhere shall be deemed to include that definition as if it were written in full. Changing that definition constitutes an amendment to the incorporating rule."
  *(This forces the organization to treat changing the definition of 'Money' as if they were directly amending the 'Notice for Money' rule, triggering any protections that rule has.)*

  ### Summary
  *   **Established Term:** None perfectly fits. Closest are *Constructive Amendment* (criminal/constitutional) or *Manner and Form Conflict* (constitutional).
  *   **Coined Term:** **Oblique Amendment**.
  *   **Boundary:** Semantic and Procedural dependencies are the same *structural* move (Secondary Rule Manipulation). Null-effect cases are *Dormant Oblique Amendments* and should be treated as structurally significant risks.
  *   **Fix:** Explicitly subordinate definitions and general procedures to specific, entrenched rules in your drafting.
