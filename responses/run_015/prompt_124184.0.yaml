answer: |-
  Here is the teaching arc plan, designed specifically for an audience of biologists.

  ### 1. The Core Dependency: Classification Precedes Categorization
  **What must come first:** You cannot argue that *gender* is institutionally stabilized until you dismantle the assumption that *sex* is naturally pre-stabilized.
  **The Dependency:** You must establish that **biological taxonomy is a normative practice, not a passive discovery.**
  Biologists often treat classification as "finding the lines nature drew." You need to shift this to "drawing lines to make nature manageable." If they believe sex categories (male/female) are discovered natural kinds, they will treat gender as the only "constructed" layer. You must show that the "base layer" (sex) is already a stabilized taxonomy driven by specific institutional goals (e.g., reproduction, legal inheritance, medical treatment).

  ### 2. The Carrying Example: 19th-Century Medical Taxonomy (Intersex/DSD)
  **Choice:** I recommend the **19th-century medical shift from 'hermaphrodite' to 'true sex' taxonomy** over the Passport example.
  **Justification:**
  *   **Audience Alignment:** Biologists respect taxonomy. Using a medical/historical case study speaks their language (classification criteria, phenotypic variance) rather than bureaucracy (passports), which they may dismiss as "just paperwork."
  *   **Attacking the Base Layer:** The Passport example risks reinforcing their bias (i.e., "Passports are social, but chromosomes are real"). The Medical example demonstrates that even *medical authorities* had to make normative decisions to force ambiguous bodies into binary boxes. It shows that the "biological base" was *produced* by the institution of medicine to resolve ambiguity, not simply found.
  *   **Managing Obscurity:** It is not obscure if you focus on the **logic of the criteria**, not the case histories. Do not get bogged down in specific patients. Focus on the shift: *Why* did medicine decide that gonads matter more than genitals? That was a normative choice to prioritize reproduction over appearance. That is the "institutional practice" stabilizing the kind.

  ### 3. The Misconception Map & Sequence
  You must address these in a specific order. If you address "choice" before "reality," they will think you are arguing gender is arbitrary. If you address "fake" before "biology," they will tune out.

  **Sequence of Intervention:**

  1.  **Misconception: 'Biology is still the real base layer.'**
      *   **Where:** **Phase 1 (The Example).**
      *   **How:** Use the Medical Taxonomy example. Show that chromosomes, hormones, and genitals do not always align. Ask: "Which one is the 'real' sex?" Reveal that the medical institution *chose* gonads as the gold standard in the 19th century to serve specific goals (inheritance/marriage).
      *   **Point:** Biology provides the *material*, but the *category* is a decision. The "base layer" is already a construction.

  2.  **Misconception: 'If it's constructed then it's fake.'**
      *   **Where:** **Phase 2 (Transition to Stabilization).**
      *   **How:** Immediately after showing sex is classified, introduce the concept of **Institutional Facts** (e.g., money, property lines). A property line is constructed, but you cannot cross it without consequence.
      *   **Point:** Construction $\neq$ Illusion. It means "dependent on human agreement/practice." The category 'woman' is as real as 'dollar bill'—it has causal power because we agree to enforce it.

  3.  **Misconception: 'Then anyone can just choose.'**
      *   **Where:** **Phase 3 (Constraints).**
      *   **How:** Discuss the *friction* of the institution. You cannot walk into a bank and declare yourself a corporation without filing specific forms, meeting specific criteria, and being recognized by the state.
      *   **Point:** Social construction involves **constraint**. The category 'woman' is stabilized by practices (dress, language, legal status, medical intervention) that are hard to enter and hard to exit. It is not a "choice" in the vacuum; it is a negotiation with institutional gravity.

  ### 4. The Final Check: AI Face-Classifiers
  **The Task:** Have them analyze a training dataset for an AI gender classifier (e.g., ImageNet or similar commercial datasets).
  **Why this works:**
  *   **Mirrors the Medical Example:** Just as 19th-century doctors looked at bodies and decided "female," AI developers look at pixels and decide "woman."
  *   **Reveals the Norm:** Ask them: "What is the ground truth label based on?" Is it chromosomes? No. Is it self-ID? Rarely. It is usually a human labeler looking at a photo and applying a stereotype (hair, makeup, structure).
  *   **Tests the Framework:** If they understand the arc, they will identify that the AI is not *detecting* gender, it is **automating the institutional practice of classification.** It encodes the normative judgments (e.g., "long hair = woman") as objective biological facts.
  *   **Success Criteria:** They pass if they can articulate that the AI's error rate isn't just a "technical glitch," but a reflection of the instability of the category it is trying to measure.

  ### 5. What to Openly Refuse to Cover
  **Exclude:** **Judith Butler's full theory of Performativity.**
  **Reason:**
  *   **Jargon Barrier:** Terms like "iterability," "citationality," and "the heterosexual matrix" will trigger defensive tuning-out in a scientific audience.
  *   **Misinterpretation Risk:** Biologists will hear "performance" and think "voluntary act" (like acting in a play), which reinforces the 'anyone can just choose' misconception you are trying to kill.
  *   **Alternative:** Use the phrase **"Iterative Stabilization."** Explain that gender is real *because* we repeat the practices that sustain it, not because it is an inner essence. This captures the material reality of Butler's argument without the post-structuralist baggage that distracts from the institutional focus.

  ### Summary of the Arc
  1.  **Dependency:** Taxonomy is an act, not a discovery.
  2.  **Example:** 19th-Century Medical Classification (shows biology is already normative).
  3.  **Misconception 1:** Biology is base (Crushed in Step 2).
  4.  **Misconception 2:** Constructed is fake (Crushed by analogy to Money/Law).
  5.  **Misconception 3:** Anyone can choose (Crushed by analogy to Bureaucratic Friction).
  6.  **Check:** AI Classifiers (Shows the automation of normative judgment).
  7.  **Exclusion:** Butlerian Jargon (Keep it to "Stabilization").
