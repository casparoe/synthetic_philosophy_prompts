answer: |-
  # SPEAKER PREP SHEET: Narrative-Relational Taurekism
  **Event:** Interdisciplinary Seminar (Tuesday)  
  **Audience:** Moral Philosophers (Taurek-literate), 2 Narrative Theorists, 1 Decision Theorist (EU Maximizer)  
  **Thesis:** Anti-aggregation (Taurek) applies *only* when subjects share a narrative bond. Strangers = Aggregation permitted.  
  **Goal:** Survive Q&A without conceding the core thesis.

  ---

  ### 1. The "Moral Relevance" Objection (Most Likely)
  **Who:** Senior Moral Philosopher  
  **The Question:** "You're claiming a metaphysical fact about 'story' changes a moral fact about 'death.' Why does being in a shared narrative make losses non-aggregatable? Is morality really dependent on whether the victims know each other's plotlines?"

  **2-Minute Reply:**  
  "It's not about knowing each other; it's about the *structure of the loss*. When five strangers die, five distinct worlds end. When a crew, a family, or a community dies, a *single* complex world ends. Taurek argued there is no 'super-person' who feels the sum of pains. I'm arguing that a shared narrative creates a unit of value that resists arithmetic summation. We aren't ignoring the five lives; we're recognizing they constitute one *tragedy*, not five separate ones. Morality tracks harm, and the harm to a woven story is qualitatively different than harm to scattered pages."

  **Soft Spot:** Distinguishing "knowing each other" from "shared narrative" without getting bogged down in sociology.  
  **Concede:** It's not about friendship or affection.  
  **Hold Firm:** The unit of moral loss changes based on relational structure.

  ### 2. The "Taurek Integrity" Objection (High Damage)
  **Who:** Taurek Purist  
  **The Question:** "Taurek's point was that numbers *never* count because individuals are separate. By allowing aggregation for strangers, aren't you just conceding Taurek was wrong? You've gutted his central insight."

  **2-Minute Reply:**  
  "I'm rescuing Taurek from his own universalism. Taurek was right that aggregation is a category error, but he applied it too broadly. He assumed all groups are just 'collections of individuals.' I'm saying some groups are 'collective entities.' If I save Taurek only where he fits the metaphysics of the situation, I'm being more faithful to his insight than applying it blindly. I'm not saying numbers count for strangers; I'm saying the *reason* they count is that there's no narrative unit to protect them from aggregation."

  **Soft Spot:** Admitting Taurek was partially wrong feels like a concession.  
  **Concede:** Taurek's universal claim was too broad.  
  **Hold Firm:** The core insight (anti-aggregation) is valid, but context-dependent.

  ### 3. The "Expected Utility" Objection (The Decision Theorist)
  **Who:** The EU Guy  
  **The Question:** "This is irrational. If I can save five lives or one, and I flip a coin because of a 'story,' I'm maximizing expected loss. Utility doesn't care about narrative cohesion. How do you justify this mathematically?"

  **2-Minute Reply:**  
  "Expected utility assumes interchangeable units. My claim is that narratively bound lives aren't interchangeable units—they're variables in a single equation. You can't maximize utility if you've misidentified the variable. If the loss is 'one story' vs. 'one life,' the utility calculation changes because the inputs aren't '5 lives vs. 1 life.' I'm not asking you to break math; I'm asking you to check your inputs."

  **Soft Spot:** He will ask how to quantify the "single equation."  
  **Concede:** Standard EU works for statistical strangers.  
  **Hold Firm:** EU fails when the units of value are ontologically distinct.

  ### 4. The "Definition" Objection (The Narrative Theorists)
  **Who:** Narrative Theorist  
  **The Question:** "Who writes the story? A queue at a bus stop has a 'shared narrative' of waiting. A nation has one. Where is the cutoff? This seems hopelessly vague for life-and-death decisions."

  **2-Minute Reply:**  
  "I'm not talking about thematic similarity; I'm talking about *interdependence of fate*. A bus queue dissolves if one person leaves; a family or a ship's crew collapses structurally if key members are lost. The narrative isn't just 'what happens to them,' it's 'who they are together.' I grant there are borderline cases, but law and medicine deal with vague boundaries all the time. We don't abandon the concept of 'consent' because it's hard to define in edge cases."

  **Soft Spot:** The "bus queue" example is a trap.  
  **Concede:** Borderline cases exist and require judgment.  
  **Hold Firm:** Interdependence of fate is the criterion, not mere proximity.

  ### 5. The "Fairness to the Outsider" Objection
  **Who:** Moral Philosopher (Egalitarian)  
  **The Question:** "So if I'm alone, I get saved against five strangers. But if I'm alone against five friends, we flip a coin? You're penalizing the individual for the cohesion of the group. That seems unjust."

  **2-Minute Reply:**  
  "It's not a penalty; it's a recognition of stakes. Against strangers, your life outweighs the sum of scattered interests. Against a bound group, your life weighs against a *collective* interest. It's not that you matter less; it's that the opposing weight is denser. We don't say it's unjust that one vote doesn't overturn a unanimous jury verdict. The structure of the opposition changes the procedural fairness."

  **Soft Spot:** Intuitively, people feel saving the 5 friends is *more* important, not less (or equal).  
  **Concede:** It feels counter-intuitive to standard egalitarianism.  
  **Hold Firm:** Fairness is about weighing comparable units, not raw headcounts.

  ### 6. The "Gaming the System" Objection
  **Who:** Practical/Policy Mind  
  **The Question:** "If this becomes policy, groups will fabricate narratives to gain moral weight. 'Oh, we're a poetic society, save us over the strangers.' How do you prevent manipulation?"

  **2-Minute Reply:**  
  "Epistemic constraints apply. We verify claims of relationship all the time in law (next-of-kin, corporate personhood). A fabricated story lacks the history of interdependence I'm relying on. Also, this is a moral framework, not necessarily a triage algorithm. It's for guiding principle, not necessarily battlefield calculus where seconds count."

  **Soft Spot:** Applying this in real-time emergencies is impossible.  
  **Concede:** This is hard to implement in split-second triage.  
  **Hold Firm:** It works for policy and structured decision-making.

  ### 7. THE OBJECTION YOU'RE PRAYING NOBODY ASKS (The Atrocity Case)
  **Who:** Anyone (But likely a sharp Moral Phil)  
  **The Question:** "If a tightly knit cultural or religious group is being targeted for genocide, does your theory imply their deaths count as *one* loss, whereas scattered individuals count as many? Are you suggesting saving scattered strangers is morally优先 (prioritized) over saving a cohesive community?"

  **2-Minute Reply:**  
  "That is the extreme edge case, and here's the distinction: My theory addresses *conflicts of rescue*, not *valuation of existence*. When deciding who to save in a trolley problem, the narrative unit matters. But regarding the *wrongness* of the killing itself, the violation of each individual remains absolute. I am not saying their lives are worth less; I'm saying the *aggregation mechanism* fails when their lives are woven. However, I concede that in cases of systemic persecution, the 'narrative' is often imposed by the persecutor, which complicates the voluntariness of the bond."

  **Soft Spot:** This is the most dangerous point. It sounds like you're saying genocide of a group is "one loss."  
  **Concede:** This framework is for rescue dilemmas, not assessing the total evil of a massacre.  
  **Hold Firm:** Do not let them equate "unit of loss" with "value of life."

  ---

  ### GENERAL TIPS FOR THE ROOM
  *   **The Philosophers:** They want precision. Don't waffle on "what is a story." Stick to "interdependence of fate."
  *   **The Narrative Theorists:** They want you to respect the text. Acknowledge that narratives are complex, but insist moral agents need heuristics.
  *   **The Decision Theorist:** He wants consistency. Admit your theory is context-dependent, not universally constant.
  *   **Your Vibe:** You're the novelist. You see the shape of the thing they miss. Own the "niche" aspect. You're offering a lens, not a law.

  **Good luck Tuesday. Don't let them boil you down to utility.**
