answer: |-
  **DRAFT v0.9 — FOR THURSDAY LAB MEETING**
  **Subject:** Adversarial Collaboration: Computational vs. Dynamical Descriptions of Neural Systems
  **Participants:** Marcus [Computational Neuroscience], Ines [Dynamical/Embodied Systems]
  **Facilitator:** [Your Name]

  ---

  ### 1. Agreed Claims (Joint Statement)

  The undersigned agree to the following propositions. These are intended to be non-trivial constraints on the debate, excluding straw-man positions.

  1.  **Non-von Neumann Architecture:** The brain does not operate as a stored-program digital computer. There is no central clock, no clean separation of processing and memory, and no evidence of error-corrected digital code in neural signaling. Any claim that "the brain is a computer" must be compatible with asynchronous, analog, and noisy physical substrates.
  2.  **The Triviality Constraint:** Both sides acknowledge the "pan-computationalism" worry: that with sufficient gerrymandering, any physical system (including a rock or a stomach) can be mapped to any computation. A viable theory must provide a criterion of implementation that blocks this triviality without being ad hoc.
  3.  **Physiological Complexity:** A significant portion of neural signaling does not fit standard point-neuron, spike-count models. This includes dendritic plateau potentials, gap-junction coupling, volume transmission, astrocytic calcium waves, ephaptic effects, and stochastic vesicle release. Both sides agree these are not merely noise; they are mechanistic features that any complete model must account for.
  4.  **Model Utility:** Computational models (mapping variables to states) and dynamical models (mapping trajectories in phase space) are both empirically useful. The disagreement concerns what this utility implies about the *ontology* of the system, not the pragmatic value of the tools.
  5.  **Consciousness Orthogonality:** The question of whether a machine could be conscious is distinct from whether the brain computes. Neither position settles the hard problem of consciousness, nor does consciousness settle the computational status of the brain.
  6.  **Implementation Criteria:** There must be *some* constraint on what counts as an implementation of a computation, beyond mere mathematical isomorphism. Both sides agree that "anything computes" renders the term useless for explanation.

  ---

  ### 2. Disagreements Table

  | Issue | Marcus's Formulation (Computational) | Ines's Formulation (Dynamical/Embodied) | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Computation** | When a model's variables map onto cell types and operations onto causal interactions, we have discovered real structure in the tissue. Computation is a property of the system. | Singling out states as 'representations' and transitions as 'computational steps' is a modeling decision constrained by our goals (prediction/control), not a discovery about the tissue. | **Substantive.** Disagreement on whether computation is mind-independent. |
  | **2. Individuation** | There is a fact of the matter about which computation a given circuit implements, once the correct criterion of implementation is applied. | There is no privileged 'the' computation a piece of cortex implements. Different abstractions reveal different regularities; none is uniquely "true." | **Substantive.** Marcus seeks uniqueness; Ines accepts pluralism. |
  | **3. System Boundaries** | The computational boundary can be drawn around the neural circuit. The environment provides input and receives output, but the computation is internal. | The system is the brain-body-environment loop. Singling out the skull-boundary arbitrarily severs the feedback loops that constitute the dynamics. | **Substantive.** Disagreement on where the mechanism ends. |
  | **4. Representations** | Representational states exist when there is a reliable mapping between environmental features and internal states that guides action. | 'Representation' is a useful fiction for the analyst. The system couples to the environment; it does not need to 'stand in' for it internally. | **Substantive.** (Though depends on def. of representation). |
  | **5. Explanatory Goal** | Explanation consists in identifying the algorithm and the mechanism that implements it. | Explanation consists in characterizing the stability landscape and how the system navigates it under perturbation. | **Verbal/Substantive.** Different standards of what counts as an explanation. |
  | **6. Triviality Solution** | Triviality is blocked by causal constraints: the physical states must *cause* the transitions in the way the abstract states dictate. | Triviality is blocked by pragmatic constraints: the description must be the most efficient way to predict behavior under intervention. | **Substantive.** Realism vs. Instrumentalism. |

  *Note on Row 4: Ines notes she can sign this only if 'representation' is understood as 'analyst attribution,' not 'internal vehicle.' Marcus insists it must be 'internal vehicle.' This row remains a friction point.*

  ---

  ### 3. Cruxes: Sub-questions for Resolution

  Settling the following questions would materially shift the debate.

  **(a) The Criterion Problem:** Is there a criterion that separates systems that *compute* from systems we merely *find it convenient to describe computationally*?
  *   *Risk:* If the criterion is too loose, everything computes (triviality). If too strict, nothing biological computes (eliminativism).

  **(b) Implementation vs. Background:** Where does the implementation end and the 'background conditions the computation presupposes' begin?
  *   *Relevance:* Given the weird physiology list (Claim 3), are neuromodulators part of the computation or just changing the parameters of the computer? Marcus tends to say parameters; Ines says the distinction is false.

  **(c) Multiple Realizability in Tissue:** Can one piece of tissue implement many computations at once?
  *   *Marcus:* Yes, but one is usually the "proper" function based on evolutionary history or causal role.
  *   *Ines:* Yes, and there is no "proper" one. It depends on how you couple to it.

  **(d) Content Grounding:** Do representations get their content from causal role right now or from selection/learning history?
  *   *Marcus:* Primarily history/teleology (why was this circuit selected?).
  *   *Ines:* Content is ascribed by the observer based on current coupling; history is irrelevant to the current dynamics.

  ---

  ### 4. Proposed Tests and Cases

  For each crux, we propose a concrete case where predictions diverge.

  **(i) Lesion/Intervention-Transfer Test**
  *   **Setup:** Take a specific circuit (e.g., songbird HVC). Build (A) a mechanistic model with parts mapped to cell types and (B) a black-box dynamical fit (RNN) that matches recorded activity equally well. Apply novel optogenetic suppressions and stimulus families never seen in training.
  *   **Marcus's Prediction:** Model A will generalize better because it captures the causal structure. Model B will fail on out-of-distribution interventions.
  *   **Ines's Prediction:** Model B will perform equally well or better because the 'mechanistic' map imposes false modularity on a distributed dynamical system.
  *   **Success Condition:** If Model A outperforms B significantly (>20% variance explained on novel interventions), Marcus gains ground. If B matches A, Ines gains ground.

  **(ii) The Porting Test**
  *   **Setup:** Take a computation Marcus identifies in a circuit (e.g., direction selectivity in retina). Implement the exact input-output function and plasticity rule on totally different hardware (silicon, fluidic).
  *   **Marcus's Prediction:** The ported system is implementing the *same* computation. The substrate is irrelevant if the causal mapping holds.
  *   **Ines's Prediction:** The ported system is doing something *different* because the time-constants, energy constraints, and body-coupling are different. The 'computation' cannot be separated from the physics.
  *   **Success Condition:** If we agree the port is "the same system," Marcus wins. If we agree it is a "different system with similar behavior," Ines wins.

  **(iii) Slow Substrate Replacement (Ship of Theseus)**
  *   **Setup:** Neurons in a circuit are swapped one at a time for devices that reproduce each cell's input-output transformation and plasticity rule.
  *   **Marcus's Prediction:** The computation survives to 100% replacement, provided the functional mapping is preserved.
  *   **Ines's Prediction:** The computation degrades as the replacement progresses because the subtle analog dynamics and physical coupling that constitute the 'computation' are lost, even if I/O is matched.
  *   **Success Condition:** At what % replacement do we say the computation is gone? Marcus says 100% (or never). Ines says <100% (likely early).

  ---

  ### 5. Joint Audit Table: Does it Compute?

  We assessed specific subsystems. "Yes" means it implements a computation in the strong sense. "No" means it is purely dynamical/physical. "Conditional" means it depends on the criterion used.

  | Subsystem | Marcus | Ines | Notes on Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Retina** | Yes | Conditional | Ines: Only if coupled to eye-movements/head. Marcus: Circuit itself computes edge detection. |
  | **Cerebellum** | Yes | Conditional | Ines: It's a timing dynamical system, not a processor. |
  | **Cerebral Cortex** | Yes | No | **Major Disagreement.** Marcus: Hierarchical inference. Ines: High-dimensional reservoir. |
  | **Basal Ganglia** | Yes | Conditional | Marcus: Action selection algorithm. Ines: Dynamical gating of loops. |
  | **Neuromodulatory Systems** | Conditional | No | Marcus: Sets parameters *for* computation. Ines: Changes the landscape, not the computation. |
  | **Spinal CPG** | Yes | Yes | **Agreement.** Both view this as a clear oscillator/mechanism case. |
  | **Glia (Astrocytes)** | No | Conditional | Marcus: Background support. Ines: Part of the dynamical field, potentially computational if criteria loosen. |

  ---

  ### 6. Ruling on Proposed Criteria

  We evaluated two candidate criteria for "True Computation."

  **(A) The Etiological Criterion**
  *Definition:* A system computes only if there's a counterfactually robust map from physical to abstract states that the system was selected, developed, trained, or designed to maintain.
  *   **Marcus:** Accepts. This handles the triviality worry (rocks weren't selected to compute).
  *   **Ines:** Rejects. This makes computation dependent on history, not current physics. A spontaneously arising system that acts identically would not compute, which is absurd.
  *   **Verdict:** Too historical for Ines.

  **(B) The Compression Criterion**
  *Definition:* A system computes only if the shortest description that predicts behavior under intervention *requires* positing content-like states. If a purely dynamical description is equally short, there is no computation.
  *   **Marcus:** Rejects. This makes computation dependent on the analyst's math skills, not the system's structure.
  *   **Ines:** Accepts. This aligns with 'inference to the best explanation.'
  *   **Verdict:** Too instrumentalist for Marcus.

  **(C) Proposed Third Criterion: Robustness under Perturbation**
  *Definition:* A system computes if the abstract state transitions remain stable under physical perturbations that do not alter the causal mapping, *and* this stability is not explainable by simple physical conservation laws.
  *   **Marcus:** Can live with this, provided 'causal mapping' is strict.
  *   **Ines:** Can live with this, provided 'stable' allows for continuous deformation rather than discrete steps.
  *   **Status:** **Tentative Agreement.** This requires operationalizing 'causal mapping' without begging the question.

  ---

  ### 7. Verbal vs. Substantive Disputes

  We distinguish between disputes that would vanish if we fixed definitions and those that remain.

  1.  **Verbal:** If 'computation' is defined simply as "change of state over time," we agree the brain computes. If 'computation' is defined as "von Neumann architecture," we agree the brain does *not* compute. These are not interesting.
  2.  **Substantive:** Even if we agree on a definition (e.g., "manipulation of representational vehicles according to rules"), we disagree on whether the brain *has* representational vehicles. Marcus says yes, they are physically instantiated. Ines says no, they are analyst impositions. This dispute survives terminological clarification.
  3.  **Substantive:** We disagree on whether the *boundaries* of the system are skull-bound or world-involving. No definition of computation resolves this; it is a disagreement about mechanistic individuation.

  ---

  ### 8. Falsification Statements

  **Marcus:**
  "I would abandon the computational view if mechanistic models that map variables to specific cell types consistently fail to predict the results of novel interventions better than black-box dynamical models that make no such mapping. If the 'structure' I posit adds no predictive power over a generic RNN fit across multiple brain areas, then the computation is likely in the eye of the beholder, not the tissue."

  **Ines:**
  "I would abandon the strict dynamical/embodied view if a disembodied model (no body loop, no environmental coupling terms) could predict the time-course of neural activity and behavior as accurately as a fully embodied model, specifically in tasks requiring rapid adaptation to physical perturbations. If the body and environment are computationally irrelevant, my core claim fails."

  ---
  **End of Draft**
