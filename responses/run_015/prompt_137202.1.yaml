      *   (3) *Dynamic inconsistency/Non-EU:* Good assumes EU maximizer with consistent preferences. If preferences change or aren't EU, theorem fails. *Tier B/A depending on clinician behavior.* Let's say Tier B (clinicians usually act *as if* EU, though stress might alter this).
      *   (4) *Observation changes world:* Good assumes observation is passive. If the test itself harms or limits options (beyond cost), theorem fails. *Tier B* (Monitoring usually passive, but alerts trigger interventions which change the world).
      *   (5) *Strategic settings:* Good assumes single agent. Hospital wards aren't typically game-theoretic against patients, but resource allocation could be. *Tier C* (Mostly irrelevant here).
      *   (6) *Unbounded expectations:* Mathematical technicality. *Tier C.*
      *   (7) *Rule-following/Constrained agents:* Good assumes freedom to choose optimal action post-signal. If forced to act sub-optimally, value can be negative. *Tier A* (This is the "Mandatory Response" issue).
