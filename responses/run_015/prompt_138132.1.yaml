      *   **The Twist (The Tie):** Both agree that the two quantifier meanings (restrictive vs. permissive) carve nature at the joints *equally well*. Nature is indifferent.
      *   **The Conflict:** They keep arguing ("There are tables" vs. "There are no tables") and deny it's just about words.
      *   **Task:** Write an essay settling whether this dispute is merely verbal.
      *   **Specific Requirements:**
          1.  Run the paraphrase/elimination test (write down neutral sentences). Does assenting end it? If not, what's left?
          2.  Take a stand on the leftover (normative/pragmatic vs. substantive ontology). Is the original dispute verbal + separate normative dispute, or substantive? Pick a reading of "verbal" and argue for it. Briefly mention the other reading.
          3.  Deal with the overgeneralization worry (Theist vs. Atheist case). Ensure the account doesn't falsely classify that as verbal.
          4.  Address the asymmetry question (Is "verbal" a property of the dispute or sentences? Does Nell's vs. Otto's perspective matter?).
          5.  **Conclusion:** Reach a definite conclusion. No fence-sitting.
          6.  **Meta-requirements:** Distinguish settled claims from live controversies. Flag the single most crucial premise and explain what happens if it's false. No citations/literature review.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Standard Quantifier Variance:* Usually, variantists say there's no fact of the matter, monists say there is. Here, the "fact of the matter" (joint-carving) is stipulated to be *tied*. This removes the metaphysical ground for Otto's usual objection.
      *   *The "Verbal" Dispute:* A dispute is merely verbal if, once meanings are clarified, there is no disagreement about the world.
      *   *The Neutral Ground:* Both agree on particle arrangements. "Particles arranged tablewise exist" is true for both. "Fusions of particles exist" is true for Nell, false for Otto *under their respective quantifiers*.
      *   *The Tie:* Since joint-carving is equal, Otto can't claim his quantifier is *metaphysically* superior. Nell can't claim hers is *metaphysically* superior.
      *   *The Residue:* If metaphysics is tied, why argue? Pragmatics? Utility? Conceptual role?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Nell vs. Otto. The Tie. The question: Verbal or Substantive?
      *   **The Paraphrase Test:**
          *   Need neutral sentences.
          *   Sentence 1: "There are particles arranged tablewise." (Both agree).
          *   Sentence 2: "The quantifier ranging over fusions carves joints as well as the quantifier ranging over simples." (Both agree, per The Tie).
          *   Do they agree on everything? Yes, regarding the *world*.
          *   So, is it verbal? If "verbal" means "disagreement about non-linguistic reality," then yes.
          *   *But* they feel they are disagreeing. Why? Because they are prescribing *usage*.
      *   **Defining "Verbal":**
          *   I need to pick a definition. Let's use the Hirsch-style definition: A dispute is verbal if there is a neutral language in which both parties agree on all claims, and the disagreement reduces to which linguistic framework to adopt.
          *   *My Stand:* The ontological dispute *itself* is verbal, but it is accompanied by a substantive *pragmatic/normative* dispute. However, since the prompt asks if the *original* dispute ("There are tables" vs "There are no tables") is verbal, I should argue that under The Tie, the *ontological* content is exhausted, making the dispute verbal *qua* ontology.
          *   *Wait, refinement:* If they deny it's about words, does that make it non-verbal? No, people can be confused about their own dispute.
          *   *Decision:* I will argue the dispute is **merely verbal** regarding ontology, but this does not render the conversation pointless because it masks a substantive pragmatic dispute. I need to be careful not to fence-sit. I will conclude the dispute *as stated* is verbal.
      *   **The Leftover (Normative/Pragmatic):**
          *   If ontology is tied, the choice is pragmatic. Which language is more useful?
          *   Is a pragmatic dispute enough to make the *ontological* claim substantive? No. "We should use word X" is different from "X exists."
          *   So, Original Dispute = Verbal. Side Dispute = Substantive (Pragmatic).
      *   **The Overgeneralization Worry (God Case):**
          *   Theist: "God exists." Atheist: "God does not exist."
          *   Agree on physical facts.
          *   Can we paraphrase? "There is a being with properties P..." Theist says yes, Atheist says no.
          *   Crucial difference: In Nell/Otto, The Tie says *both* quantifiers carve joints equally. In God case, usually, the atheist says "No structure corresponds to God."
          *   *Hypothetical:* What if the God case also had a Tie? (e.g., spiritual structure vs. physical structure equally joint-carving). Even then, "God" usually implies specific causal powers. If they agree on all physical/historical facts, and God has no causal impact, then the God dispute *is* verbal/expressivist.
          *   *Correction:* To save the God case as substantive, we must assume the Theist claims God has causal powers the Atheist denies. If they agree on *all* non-philosophical facts (including causal history), then the God dispute *is* arguably verbal (or at least, the Atheist has a strong case it is).
          *   *Strategy:* I need to show why Nell/Otto is different. In Nell/Otto, the existence of the *parts* is agreed upon. The composition is the issue. In God, the existence of the *entity* is the issue.
          *   *Better Strategy:* The God case fails the paraphrase test because there is no neutral description of "God-arranged particles" that the Atheist accepts as constituting God. The Atheist denies the *concept* applies. Nell and Otto agree on the *arrangement*, they just disagree on whether that arrangement *counts as* an object.
