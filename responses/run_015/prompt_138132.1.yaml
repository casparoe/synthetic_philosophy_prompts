          *   *Refined Argument:* The Nell/Otto case is verbal because the *truth-conditions* of their sentences, mapped to the world, are identical (particles arranged tablewise). The God case, even agreeing on physical facts, usually involves a disagreement about the *explanation* of those facts or the presence of a non-physical entity. If the Theist posits a non-physical entity, and the Atheist denies non-physical entities exist, that's an ontological clash.
          *   *Wait, the Tie is key.* In Nell/Otto, the Tie says *both* ontologies are equally valid structurally. In the God case, there is no Tie. The Atheist denies the structure exists. So the God case fails the "Tie" condition. My account relies on the Tie.
      *   **Asymmetry (Dispute vs. Sentences):**
          *   Is "verbal" a property of the dispute? Yes.
          *   Does Nell's variantism matter? She thinks it's verbal. Otto thinks it's not.
          *   If the Tie holds, Otto is *wrong* to think it's non-verbal. The metaphysics doesn't support his exclusivity.
          *   So the verdict doesn't depend on their opinions, but on the metaphysical status (The Tie).
      *   **Crucial Premise:** The Tie itself (that joint-carving is equal). If one quantifier carved better, the dispute would be substantive (Otto wins).
      *   **Settled vs. Contested:**
          *   Settled: Paraphrase test is a standard tool. Quantifier variance is a live controversy. Joint-carving (Sider) is a live controversy.
          *   I need to flag that "joint-carving" is contested metaphysics.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I say it's verbal, am I ignoring the pragmatic stake?
      *   *Fix:* Distinguish between "ontological substance" and "pragmatic substance." The prompt asks if the *dispute* is verbal. Standard definition: if no factual disagreement, it's verbal. I will stick to this.
      *   *Critique:* The God case. If they agree on all physical facts, and God is non-physical, how is it substantive?
      *   *Fix:* The God case typically involves disagreement on *what exists* beyond the physical. Nell/Otto agree on what exists (particles), disagree on *how to count* them. The God case is Existence vs. Non-Existence of a distinct entity. Nell/Otto is Counting Rule A vs. Counting Rule B.
      *   *Wait, Nell says tables exist.* That's an existence claim.
      *   *Key Distinction:* In Nell/Otto, the "table" is supervenient on the particles. In God, God is typically not supervenient on particles in the same way (independent existence).
      *   *Better Distinction:* The paraphrase test works for Nell/Otto because "There is a table" can be fully analyzed as "Particles arranged tablewise exist." For God, "God exists" cannot be analyzed as "Particles arranged God-wise" (usually).
      *   *Okay, I'll focus on the Paraphrase Test success.* In Nell/Otto, the paraphrase captures *everything* they care about. In God, the Theist will say the paraphrase misses the "divine essence."

  5.  **Finalizing the Plan:**
      *   **Intro:** Define the case and the Tie.
      *   **Test:** Apply paraphrase. Show they agree on the world.
      *   **Verdict:** Dispute is verbal.
      *   **Leftover:** It's a pragmatic dispute about language choice. This is substantive, but distinct from the ontological claim.
      *   **God Case:** Distinguish based on paraphrase failure (Theist won't accept the neutral paraphrase as exhaustive).
      *   **Asymmetry:** The dispute is verbal regardless of their beliefs. Otto is mistaken about the metaphysics.
      *   **Meta:** Flag the "Tie" as the crucial premise. Flag joint-carving as contested.

  6.  **Writing - Tone and Constraints:**
      *   No citations.
      *   Clear distinction between settled/contested.
      *   Definite conclusion.
      *   Address the "verbal property" question.

      *(Self-Correction on "Settled" claims)*: Honestly, very little in metametaphysics is "definitely settled." I should be careful not to claim consensus where there is none. I will frame "settled" as "methodological standard" rather than "truth." The Paraphrase Test is a standard tool, even if its sufficiency is debated.

      *(Refining the "Verbal" definition)*: I need to pick *one* reading. I'll pick the "Factual Disagreement" reading. A dispute is verbal iff there is no disagreement about the non-linguistic world.

      *(Refining the God Case)*: If the Theist and Atheist agree on *all* non-philosophical facts, does the Theist believe in a God that does nothing? If so, that dispute *is* arguably verbal/too. I need to be careful. I will argue that in the standard God case, they *don't* agree on all facts (e.g., miracles, creation). If they *did* agree on all facts, the God dispute *would* be verbal too. This is a bold move but consistent. I will argue that the *standard* God case involves factual disagreement (causal impact), whereas Nell/Otto explicitly agree on all physical facts.

      *(Wait, the prompt says for the God case: "agree on all the historical and physical facts".)*
      Okay, this is tricky. If they agree on *all* physical/historical facts, the Theist must be positing a non-interacting God. In that specific philosophical thought experiment, many philosophers *would* call that dispute non-substantive (logical positivism etc.). However, realists about theology would say it's substantive.
      *Strategy:* I will argue that the Nell/Otto case is verbal because the term "table" is *defined* by the arrangement. "God" is not *defined* by physical arrangement. Therefore, the paraphrase works for tables but not for God. The Theist claims God is *ontologically distinct*, not just a fusion of particles. Nell claims tables are *ontologically distinct* (in her view).
      *Actually, the Tie saves me.* The Tie says the "fusion" quantifier is equal to the "simple" quantifier. There is no such Tie for God. The Atheist denies the structure exists. The Theist affirms it. There is no agreement that "God-structure" and "No-God-structure" are equally joint-carving.
      *Okay, that's the key.* The Tie makes Nell/Otto special.

      *(Final check on Asymmetry)*: Does it matter that Nell thinks it's verbal and Otto doesn't? No. The status of the dispute depends on the metaphysics (The Tie), not their epistemic access to it.

      *(Crucial Premise)*: The Tie. If joint-carving isn't tied, Otto wins (substantive).

      *(Settled vs Contested)*:
