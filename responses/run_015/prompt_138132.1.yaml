answer: |-
  **The Tie and the Table: A Verdict on the Nell-Otto Dispute**

  The case of Nell and Otto presents a sophisticated metametaphysical puzzle. We have two philosophers who agree on every physical fact: they agree on the location, mass, and velocity of every particle. They agree that certain particles are "arranged tablewise." Their disagreement is purely ontological: Nell asserts "There are tables," while Otto asserts "There are no tables." Crucially, they have both accepted "the Tie": the metaphysical claim that the quantifier ranging over simples only and the quantifier ranging over simples plus fusions carve nature at the joints equally well. Nature is indifferent between their ontologies.

  The question is whether their dispute is merely verbal. To answer this, we must apply the standard diagnostic tools of metametaphysics, assess the residue of their disagreement, and ensure our verdict does not collapse clear cases of substantive disagreement into verbal ones.

  **The Paraphrase Test**

  The primary test for verbal disputes is the paraphrase or elimination test. The procedure is to find a neutral vocabulary—a description of the world that does not presuppose either party's contested ontological commitments—and ask if both parties can assent to it. If they can, and if that assent exhausts what they care about, the dispute is verbal.

  In this case, the neutral vocabulary is the language of particles and arrangements. Both Nell and Otto accept the following sentence:

  > **(N)** "There are particles arranged tablewise."

  Furthermore, given their acceptance of the Tie, they both accept:

  > **(T)** "The domain restriction to particles and the domain expansion to include fusions are equally joint-carving."

  When Nell says "There are tables," she can be charitably paraphrased as asserting **(N)**. When Otto says "There are no tables," he can be charitably paraphrased as asserting **(N)** while adding a linguistic proviso that he reserves the word "object" for fundamental entities only. Once we disambiguate the quantifier "there are," we see that Nell uses a permissive quantifier ($\exists_P$) and Otto uses a restrictive quantifier ($\exists_R$).
  *   Nell's claim: $\exists_P x (Table(x))$
  *   Otto's claim: $\neg \exists_R x (Table(x))$

  Since both agree on the truth of **(N)**, and the Tie establishes that neither quantifier is metaphysically privileged, there is no disagreement about the structure of the world. They agree on the distribution of matter and the metaphysical status of the quantifiers. Therefore, by the standard definition of a verbal dispute—one where there is no disagreement about the non-linguistic facts—**the dispute is merely verbal.**

  **The Leftover: Pragmatics vs. Ontology**

  However, declaring the dispute verbal does not mean Nell and Otto have nothing to talk about. They continue to argue, and neither feels they are squabbling over words. This suggests a "leftover." If the ontology is tied, what remains?

  What remains is a **normative or pragmatic dispute**. They are disagreeing about which linguistic framework is more *useful*, *efficient*, or *appropriate* for their purposes. Nell might argue that the permissive quantifier is better for everyday communication and macroscopic science. Otto might argue that the restrictive quantifier is better for fundamental physics and avoiding ontological bloating.

  Is this leftover enough to make the *original* dispute substantive? We must distinguish between the *ontological claim* ("Tables exist") and the *metalinguistic negotiation* ("We should use a language that counts tables").

  I take the stand that the original ontological dispute is **verbal**, and the pragmatic dispute is a **separate, substantive dispute travelling alongside it.** To say the original dispute is substantive would be to conflate "what exists" with "how we should talk." If nature does not privilege one quantifier over the other, then the claim "Tables exist" has no unique truth-conditions that differ from "Particles are arranged tablewise." The disagreement is not about the world, but about which map to use.

  *Alternative Reading:* If one defines "substantive" broadly to include any disagreement that impacts theory choice or scientific practice, one could call the dispute substantive. However, this dilutes the concept of "ontology." If we allow pragmatic utility to count as ontological substance, then every terminological choice in science becomes an ontological discovery, which obscures the distinction between metaphysics and methodology. I reject this reading to preserve the utility of the verbal/substantive distinction.

  **The Overgeneralization Worry: The God Case**

  A robust account must not classify clearly substantive disputes as verbal. Consider a Theist and an Atheist who agree on all historical and physical facts. The Theist says "God exists"; the Atheist says "God does not exist." If my account says this is verbal because they agree on physical facts, the account is flawed.

  Here is why the God case differs from Nell and Otto. In the Nell/Otto case, the paraphrase **(N)** ("Particles arranged tablewise") is accepted by both as a *complete description* of the relevant reality. Nell does not think there is a "table spirit" over and above the particles; she thinks the particles *constitute* the table.

  In the standard Theist/Atheist case, the Theist does *not* accept a neutral paraphrase as exhaustive. If the Atheist says, "The physical facts are X," the Theist typically claims that God is the *cause* or *ground* of X, or a distinct non-physical entity. Even if they agree on the physical history, the Theist posits an additional entity or causal power that the Atheist denies. The Atheist says, "There is no being with divine attributes." The Theist says, "There is."

  Crucially, the God case lacks **the Tie**. In the Nell/Otto case, both agree that the two quantifier meanings are equally joint-carving. In the God case, the Atheist denies that the "God-quantifier" carves nature at the joints at all. There is no agreement on the metaphysical status of the contested entity's structure. The Theist claims a specific structure (divine agency) exists; the Atheist claims it does not. This is a disagreement about the world's structure, not just a choice of quantifier range. Therefore, the God dispute remains substantive because the paraphrase test fails: the Theist will not accept the Atheist's neutral description as complete.

  **Asymmetry: Dispute vs. Sentences**

  Is "verbal" a property of a dispute, or of sentences relative to meanings? It is a property of the **dispute**. A dispute is verbal if the parties' assertions, charitably interpreted, do not contradict regarding the non-linguistic world.

  Does it matter that Nell thinks the dispute is verbal (or dissolvable) while Otto thinks it is not? Yes, but only epistemically, not metaphysically. Otto is under the impression that his quantifier is privileged. The Tie corrects this. If the Tie holds, Otto is mistaken about the metaphysics. His belief that the dispute is non-verbal relies on the false premise that his quantifier is uniquely joint-carving. Nell is in a better position to dissolve the dispute because her variantism aligns with the Tie. However, the *verdict* on the dispute does not depend on their opinions. Even if both thought it was substantive, if the Tie holds and the paraphrase works, the dispute is verbal. Their confusion does not create factual disagreement where there is none.

  **Meta-Analysis: Settled Claims and Crucial Premises**

  In presenting this verdict, I must distinguish between methodological standards and live metaphysical controversies.

  *   **Settled/Standard:** The use of the paraphrase test as a diagnostic tool for verbal disputes is a standard methodological practice in analytic metaphysics. The distinction between ontological claims and pragmatic/metalinguistic negotiations is widely recognized.
  *   **Live Controversy:** The existence of "joint-carving" structure itself is a live controversy (associated with Ted Sider and others). Quantifier variance (Nell's view) is also heavily contested. Many realists would deny that quantifier meanings can vary while describing the same world.

  **The Crucial Premise:** My verdict leans hardest on **the Tie**.
  I have assumed as given that the two quantifier meanings are *exactly equally joint-carving*. This is the linchpin.
  *   **If the Tie is false:** If one quantifier carves nature better than the other (e.g., if the restrictive quantifier is more fundamental), then the dispute becomes **substantive**. Otto would be right that Nell's idiolect distorts the world, and there would be a fact of the matter about which ontology is correct. The paraphrase test would fail to capture the metaphysical privilege of one framework over the other.
  *   **If the Tie holds:** The dispute is verbal.

  **Conclusion**

  The dispute between Nell and Otto is **merely verbal**.

  They agree on all physical facts. They agree on the metaphysical status of their respective quantifiers (via the Tie). The paraphrase test succeeds: both can assent to "Particles are arranged tablewise" without remainder. The persistence of their argument reflects a substantive *pragmatic* disagreement about which language to use, but this does not render the *ontological* claim substantive. Ontology asks what exists; if existence is tied to quantification, and quantification is tied, there is no fact of the matter to disagree about.

  The God case avoids this verdict because it lacks the Tie and fails the paraphrase test; the Theist posits structure the Atheist denies. Finally, while Nell is better positioned to recognize the verbal nature of the dispute, the status of the dispute itself depends on the metaphysics (the Tie), not their beliefs. If the Tie holds, there is nothing there to fight about but words.
