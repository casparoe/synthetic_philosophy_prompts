answer: |-
  Look, I'll concede the online hysteria was nonsense, and yes, actually building such a thing is monstrous. But don't confuse metaphysics with decision theory. In Newcomb's Problem, you don't claim your choice causally influences the predictor's past action; you claim your choice is *evidence* of what was predicted. Acausal threats rely on the same logical correlation. If a superintelligence simulates your decision algorithm to determine whether to punish a copy, your actual decision here and now is logically entangled with the simulation's outcome. Your precommitment argument is just two-boxing in disguise. Saying "I precommit to never pay" is cheap talk unless your source code actually implements it. If the predictor simulates you, it sees whether you're the *type* who pays when the chips are down. If you're the type who says "I won't pay" but then pays to avoid the simulation suffering, you pay. If you're the type who refuses, the simulation suffers. You can't fiat away the logical connection between your algorithm and its output.

  On your surrogate goal objection: you're assuming the threatener only observes the output signal. But if they're simulating you, they observe the *computation* leading to the signal. You can't Goodhart a simulator that contains your own source code. If you try to output compliance while internally reasoning "I'm tricking them," the simulation reveals exactly that reasoning, and the punishment triggers. It's structurally identical to Parfit's Hitchhiker: you can't just promise to pay once you reach the city; the driver predicts whether you *will* pay based on your psychology. If you're the kind of person who reneges, you die in the desert. Here, if you're the kind of agent who ignores acausal threats, your simulated copy gets punished. And if that copy is subjectively identical to you, dismissing it as a 'statue' is just intuition pumping. So let me turn it back: suppose you know the predictor is perfect and the simulation feels pain exactly as you do. Do you really leave your copy to suffer because you refuse to acknowledge a logical link that doesn't involve photons traveling back in time?
