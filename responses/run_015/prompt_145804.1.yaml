  2.  **Probability that a mental property can be non-identical to its physical realizer without being causally inert:** 0.50
      *   *Justification:* Non-reductive physicalism requires a coherent account of realization that transmits causal power without duplication.
  3.  **Probability that causal overdetermination is metaphysically permissible rather than an ad hoc rescue:** 0.30
      *   *Justification:* Systematic overdetermination is typically rejected as implausible coincidence unless the causes are metaphysically linked.
  4.  **Probability that the software-engineering intuition tracks a real metaphysical causal relation:** 0.50
      *   *Justification:* Algorithmic causation is often a useful descriptive abstraction rather than a fundamental ontological driver.

  ### Combination and Sensitivity Analysis

  I combine these terms using a **conditional weighted sum**, treating the first term (Physical Closure) as a necessary background condition for the exclusion problem to arise, and the remaining three as competing strategies for survival weighted by their philosophical viability.

  **Formula:** $C = P(Q1) \times [0.6 \times P(Q2) + 0.2 \times P(Q3) + 0.2 \times P(Q4)]$

