prompt: |-
  I'm putting together the function week for a grad seminar in philosophy of biology this spring, and I realised I don't actually know what I'm asking of a theory of biological function. My students do this thing where someone produces a case — a heart that has never pumped and never will, the very first heart token, the heart's thumping noise, a liver that does forty things — and everyone treats the case as decisive for or against an account, and I have no principled way to say how much weight it should carry. So before we read any more of the literature I want the spec instead. Write me the desiderata: what any account of what it is for a trait or part to have a function has to deliver, with the case or consideration behind each requirement, and mark which are non-negotiable and which are just preferences of one camp. To keep it honest, fix the purpose: I want a function concept that can (a) underwrite a notion of malfunction or dysfunction that does real work for my colleague in philosophy of medicine, who needs to separate pathology from mere statistical atypicality, and (b) still carry the naturalistic load that theories of mental content lean on it for. If those two customers want different things from the concept, I want that said explicitly, with each desideratum tagged for which customer it comes from. And please route some of the requirements through cases I can use to break the usual rut, because the ones in the literature are over-rehearsed: a de novo designed protein dropped into a synthetic cell, whose only history is a lab selection protocol run by a robot; an enzyme produced by directed evolution where the selecting was done by an automated pipeline rather than by anything ecological; a trait in a digital organism in an artificial-life platform; a gene-drive construct engineered to crash a wild population, whose function seems to be something no organism ever benefited from; a transposable element that spread by selfish replication and is now doing regulatory work it was never selected for; and a holobiont or extended-phenotype case like a beaver dam or a termite mound, where it isn't clear whose history is supposed to matter. Distinguish also between what a theory must explain — why the trait is there, what it currently does, how a part can be broken — and what it must merely respect, like the distinction between having a function and having that function well, or between a function and a useful side effect.

  The part I most want is the negative structure of the list: tell me which subset of the desiderata you think cannot be jointly satisfied, and say whether that's because the list is over-ambitious or because the concept is genuinely over-constrained (the origin-of-function problem plus the normativity requirement plus the explanatory-role requirement feel like they might not all fit together, but I want you to actually check rather than nod along). Tell me which single requirement excludes the most candidate theories, and which of the usual demands on a theory of function you think are prejudices dressed up as desiderata — the ones that just bake in an answer. A short scorecard at the end is fine: how the selected-effect/etiological account, the causal-role or systemic-capacity account, and some kind of pluralist or deflationary option do against your list, a few lines each. But keep the weight on the criteria and their motivating cases, since the criteria are where the thinking is and I can redo the scoring myself.

  And be explicit about where you're unsure. Give me the desideratum you'd abandon first if I pushed back on it, tell me what would actually change your mind — a case, an argument, a result from biology — and flag the step in your reasoning you think is most likely to be wrong, rather than presenting the list as if it dropped out of the sky fully justified.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** Grad seminar in philosophy of biology (Spring).
      *   **Problem:** Students use counterexamples (heart that never pumped, first heart, thumping noise, liver doing 40 things) as decisive without principled weighting. The instructor needs a set of *desiderata* for a theory of biological function to structure the course.
      *   **Fixed Purpose:** The concept must serve two specific "customers":
          1.  Philosophy of Medicine (PoM): Needs to distinguish pathology from statistical atypicality (malfunction/dysfunction).
          2.  Philosophy of Mind (PoM*): Needs to carry the naturalistic load for theories of mental content (teleosemantics).
      *   **Requirements:**
          *   List desiderata with cases/considerations behind each.
          *   Mark non-negotiable vs. preferences.
          *   Tag which customer (Medicine vs. Mind) motivates each.
          *   Use *new/fresh* cases (de novo protein, directed evolution enzyme, digital organism, gene-drive, transposable element, holobiont/extended phenotype).
          *   Distinguish between what must be *explained* vs. *respected* (e.g., function vs. functioning well).
          *   **Crucial:** Negative structure. Identify incompatible subsets of desiderata. Is the concept over-constrained?
          *   Identify the most exclusionary requirement.
          *   Identify "prejudices dressed up as desiderata."
          *   **Uncertainty:** Be explicit about doubts, which desideratum to abandon first, what would change the mind, and the most likely error in reasoning.
          *   **Scorecard:** Brief evaluation of Etiological (SE), Causal Role (CR), and Pluralist/Deflationary accounts against the list.
      *   **Tone:** Philosophical, rigorous, honest, pedagogical, not dogmatic.

  2.  **Deconstruct the "Two Customers":**

      *   *Philosophy of Medicine (Boorse-style):* Needs normativity. A heart *ought* to pump. If it doesn't, it's broken (pathology), even if statistically common (e.g., age-related decline). Needs to distinguish "function" from "effect."
      *   *Philosophy of Mind (Millikan/Papineau-style):* Needs history. Content depends on what a mechanism was *selected for*. If a state doesn't have a history of selection, it can't have content (in strong teleosemantics). Needs to ground "misrepresentation."

      *   *Tension:* Medicine often cares about *current* contribution to survival/health (systemic), while Mind cares about *history* of selection (etiological). A gene-drive or selfish element might have a history but harm the organism (bad for Medicine's "health" norm, good for Mind's "selection" norm).

  3.  **Drafting the Desiderata (incorporating fresh cases):**

      *   *D1: The Normativity Constraint (Malfunction).* Must allow for X to have function F even if X cannot do F. (Case: Congenital heart defect). *Customer: Medicine.*
      *   *D2: The Distinction Constraint (Function vs. Effect).* Must distinguish what a trait is *for* from what it merely *does*. (Case: Heart thumping noise). *Customer: Both.*
      *   *D3: The Historical Grounding Constraint.* Must account for traits with no evolutionary history but clear function. (Case: De novo protein/ Directed evolution enzyme). *Customer: Mind (tricky).*
      *   *D4: The Systemic Integration Constraint.* Must account for traits that contribute to a system but weren't selected *for* that system. (Case: Transposable element doing regulatory work). *Customer: Medicine.*
      *   *D5: The Unit of Selection Constraint.* Must specify whose function it is. (Case: Gene-drive / Holobiont / Beaver dam). *Customer: Both.*
      *   *D6: The Naturalism Constraint.* Must not rely on神秘 (mysterious) norms or intentional designers (unless the designer is naturalized). (Case: Digital organism / Robot selection). *Customer: Mind.*

  4.  **Analyzing Conflicts (The Negative Structure):**

      *   *Conflict:* D1 (Normativity/Malfunction) + D3 (Ahistorical cases) + D6 (Naturalism).
      *   *Why:* Etiological theories handle D1 and D6 well but fail D3 (no history = no function). Causal Role theories handle D3 but struggle with D1 (if it doesn't do it, it's not a function) and D6 (normativity often looks like a human ascription).
      *   *The "Over-constrained" verdict:* The concept *is* over-constrained if we demand a *univocal* concept serving both Medicine and Mind perfectly. The "Origin-of-Function Problem" (how does function start?) clashes with "Malfunction" (how does function persist without performance?).
      *   *Most Exclusionary:* The Historical Grounding Constraint (D3/D1 combo). It kills Causal Role accounts immediately regarding malfunction.
      *   *Prejudices:* "Functions must contribute to fitness." (Excludes selfish DNA). "Functions must be historical." (Excludes engineered biology).

  5.  **Refining the Uncertainty/Honesty Component:**

      *   *Abandon First:* The requirement for a *single* unified concept. Pluralism might be the only honest answer.
      *   *Change Mind:* If a robust theory of "forward-looking" normativity emerges (e.g., goal-directedness without history).
      *   *Likely Error:* Assuming "Medicine" needs one thing. Maybe pathology is just statistical deviation + value judgment, not strict "function failure."

  6.  **Developing the Scorecard:**

      *   *Etiological (SE):* Great for Mind/Malfunction. Fails on De Novo/Engineered cases.
      *   *Causal Role (CR):* Great for De Novo/Current contribution. Fails on Malfunction (can't malfunction if function = what it does).
      *   *Pluralist:* Admits defeat on unity, saves the phenomena.

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone Check:* Needs to sound like a colleague speaking to a colleague, not a textbook. Acknowledge the messiness.
      *   *Case Integration:* Ensure the de novo protein, gene-drive, etc., are explicitly linked to specific desiderata.
      *   *Tagging:* Clearly mark [Med] and [Mind].
      *   *Negative Structure:* Make this a prominent section, not an afterthought.

  8.  **Final Review against Prompt:**

      *   Did I fix the purpose (Med + Mind)? Yes.
      *   Did I use the specific new cases? Yes.
      *   Did I distinguish explain vs. respect? Yes.
      *   Did I identify incompatible subsets? Yes.
      *   Did I identify prejudices? Yes.
      *   Did I express uncertainty? Yes.
      *   Scorecard included? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the "Directed Evolution" case. It *does* have a history, just not an *evolutionary* one in the wild. It has a selection history. This challenges SE accounts that require *natural* selection. I should frame it as "Non-Ecological Selection History."
      Also, the Gene-Drive case is crucial for the "Whose Function?" problem. It functions to spread, but crashes the population. Medicine says "Dysfunction" (pathology of the population?), Mind says "Function" (selected effect). This highlights the conflict.

      *Refining the "Prejudice":* The idea that "Function implies Benefit to the Organism" is a huge prejudice that selfish DNA breaks. I need to highlight that.

      *Refining the "Uncertainty":* I should admit that linking Mental Content to Biological Function (Teleosemantics) is itself a controversial move. If that link breaks, the [Mind] desiderata lose urgency.

  9.  **Final Polish:** Check word count and flow. Ensure the "Negative Structure" is punchy. (Proceed to generate output).

      *Wait, one more check:* The prompt asks to "Distinguish also between what a theory must explain — why the trait is there, what it currently does, how a part can be broken — and what it must merely respect." I need to make sure this distinction is explicit in the desiderata list.

      *Okay, let's structure the desiderata into "Explanatory Burdens" and "Conceptual Constraints".*

      *Let's write.*
answer: |-
  Here is a specification sheet for a theory of biological function, drafted for your seminar. It is designed to expose the fault lines rather than paper over them.

  ### The Fixed Purpose
  We are not looking for a definition that captures every colloquial use of "function." We are engineering a concept to serve two specific theoretical masters:
  1.  **Philosophy of Medicine (PoM):** Needs to ground *pathology*. It must distinguish a broken heart (dysfunction) from a heart that is statistically atypical but healthy, or a heart that is statistically typical but diseased (e.g., universal atherosclerosis in a population).
  2.  **Philosophy of Mind (PoM*):** Needs to ground *teleosemantics*. It must provide the "normative hook" that allows a mental state to misrepresent the world (e.g., a frog's fly-detector firing at a BB pellet).

  If a theory satisfies linguists but fails these two, it fails *this* seminar.

  ---

  ### Part I: The Desiderata List

  I have divided these into **Explanatory Burdens** (phenomena the theory must actively explain) and **Conceptual Constraints** (distinctions the theory must respect without necessarily explaining their origin). I have tagged them by which "customer" drives the requirement: **[Med]** for Medicine, **[Mind]** for Mind, **[Both]** where they converge.

  #### Explanatory Burdens

  **1. The Malfunction Burden [Med + Mind]**
  *   **Requirement:** The theory must explain how a trait can *have* a function F even if it is currently incapable of performing F.
  *   **Motivating Case:** A congenital heart defect. The heart never has and never will pump blood efficiently. Yet, we say it is *malfunctioning*, not that it lacks a function.
  *   **Why:** Without this, PoM cannot define disease (which is often functional failure), and PoM* cannot define misrepresentation (a state failing to indicate what it is supposed to).
  *   **Status:** **Non-Negotiable.**

  **2. The Origin-of-Normativity Burden [Mind]**
  *   **Requirement:** The theory must naturalize the "ought." It must explain where the norm comes from without invoking a mysterious vital force or a divine designer.
  *   **Motivating Case:** **The Directed Evolution Enzyme.** An enzyme is produced in a lab via an automated pipeline of mutation and selection. It has no evolutionary history in nature. Does it have a function? If yes, where does the normativity come from if not "Nature"? If the robot selects for X, is X its function?
  *   **Why:** Teleosemantics requires norms to be real features of the natural world, not human ascriptions.
  *   **Status:** **Non-Negotiable** (for the Mind customer).

  **3. The Unit-of-Selection Burden [Both]**
  *   **Requirement:** The theory must specify *whose* good the function serves. It must resolve conflicts between levels of selection.
  *   **Motivating Case:** **The Gene-Drive Construct.** Engineered to crash a wild population. It functions to spread itself (gene-level), but causes population collapse (organism/population-level). Is the population crash a "dysfunction" of the ecosystem or the "function" of the gene?
  *   **Motivating Case:** **The Transposable Element.** A "selfish" gene spreads by replication but is later co-opted for regulatory work it was never selected for. Is its function replication (history) or regulation (current contribution)?
  *   **Why:** PoM needs to know if "health" is organismic or cellular. PoM* needs to know which selection history grounds content.
  *   **Status:** **Non-Negotiable.**

  #### Conceptual Constraints

  **4. The Function/Effect Distinction [Both]**
  *   **Requirement:** The theory must distinguish between what a trait is *for* and what it merely *does* (useful side effects).
  *   **Motivating Case:** **The Heart's Thumping Noise.** The noise helps a doctor diagnose arrhythmia. It is useful. But it is not the function of the heart.
  *   **Why:** If function = any useful effect, everything has infinite functions, and "malfunction" becomes meaningless.
  *   **Status:** **Non-Negotiable.**

  **5. The Ahistorical Function Constraint [Med]**
  *   **Requirement:** The theory must accommodate functions for traits that lack a specific *evolutionary* history but are integrated into a living system.
  *   **Motivating Case:** **The De Novo Protein.** A protein designed from scratch and dropped into a synthetic cell. It stabilizes the membrane. It has no selection history. PoM needs to say a synthetic organ can malfunction.
  *   **Why:** If function requires deep evolutionary time, regenerative medicine and synthetic biology become conceptually impossible.
  *   **Status:** **Negotiable Preference** (Strongly preferred by Med, problematic for Mind).

  **6. The Systemic Contribution Constraint [Med]**
  *   **Requirement:** The theory must allow that a trait's function can be determined by its current contribution to a system's goals, regardless of history.
  *   **Motivating Case:** **The Holobiont / Beaver Dam.** The beaver dam regulates water flow. Is this a function of the beaver? The ecosystem? If a gut bacteria species (no vertical transmission) starts producing a vital vitamin for the host, is that its function *for the host*?
  *   **Why:** Medicine treats the body as a functional system *now*. It cares less about how the liver got there than that it detoxifies blood *now*.
  *   **Status:** **Negotiable Preference** (Medicine leans this way; Mind resists it).

  **7. The "Functioning Well" Distinction [Both]**
  *   **Requirement:** The theory must respect the difference between *having* a function and *performing* that function well.
  *   **Motivating Case:** **The Aging Liver.** An old liver performs detoxification poorly. It still has the function of detoxification.
  *   **Why:** We need to separate capacity from norm.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Part II: The Negative Structure (Incompatibilities)

  Here is the honest assessment you asked for. The list above is **over-constrained**. You cannot satisfy all non-negotiables with a single, univocal concept.

  **The Impossible Triangle:**
  You cannot jointly satisfy **1 (Malfunction)**, **2 (Naturalized Norms via History)**, and **5 (Ahistorical Function)** without contradiction.

  1.  **If you ground norms in History (to satisfy Mind):** You solve Malfunction (the trait *should* do what ancestors did) and Naturalism. But you fail **Ahistorical Function**. The *De Novo* protein and the *Directed Evolution Enzyme* have no evolutionary history. If function requires history, they have no function, only effects. This breaks PoM's ability to call a synthetic kidney "dysfunctional" if it fails.
  2.  **If you ground norms in Current Systemic Contribution (to satisfy Med):** You solve Ahistorical Function. The *De Novo* protein functions because it contributes to the cell's viability *now*. But you fail **Malfunction**. If function = what it contributes, and the *De Novo* protein fails to contribute, it simply *has no function*. It cannot malfunction. It just isn't functional. This breaks PoM* (no misrepresentation) and PoM (no disease, just absence of capacity).
  3.  **If you try to split the difference (Pluralism):** You admit there are two concepts. But this undermines the **Naturalism** goal for Mind. If "function" in psychology is historical but "function" in medicine is systemic, the bridge between them collapses.

  **The Verdict:** The concept is genuinely over-constrained. The "Origin-of-Function Problem" (how norms start) clashes with the "Malfunction Requirement" (how norms persist without performance) when applied to novel entities.

  **The Most Exclusionary Requirement:**
  **1 (The Malfunction Burden).**
  This single requirement kills the **Causal Role / Systemic Capacity** accounts immediately. If a function is defined by what a part *does* for the containing system (Cummins-style), a part that *cannot* do it simply lacks the function. It cannot be "broken." Since both your customers need "brokenness" (pathology and misrepresentation), Causal Role accounts are dead on arrival for your specific purposes, regardless of how well they handle the *De Novo* protein.

  **Prejudices Dressed Up as Desiderata:**
  *   **"Functions must benefit the organism."** This is a massive prejudice. It is explicitly violated by the **Transposable Element** and the **Gene-Drive**. A theory that bakes in "organismic benefit" (often implicit in Boorse-style biostatistics) will have to call selfish replication a "dysfunction" or "pathology," which biologizes a moral judgment about levels of selection.
  *   **"Functions must be old."** The idea that only evolutionary history counts is a prejudice of the Etiological camp. It treats the *Directed Evolution Enzyme* (selected by a robot) as fundamentally different from a naturally selected enzyme, which seems metaphysically suspicious if the selection pressure is identical.

  ---

  ### Part III: Uncertainty & Vulnerability

  **The Desideratum I Would Abandon First:**
  **5 (The Ahistorical Function Constraint).**
  If pushed, I would concede that the *De Novo* protein does not have a "biological function" in the strict sense, but rather a "design function" or "assigned function." I would retreat to the claim that *natural* biological function requires history.
  *   **Why:** It saves the Naturalism constraint for Mind. If we allow ahistorical functions, we risk making function a matter of human interest (what we *use* the protein for), which destroys the objective normativity needed for teleosemantics.
  *   **What Would Change My Mind:** A robust account of "forward-looking" normativity. If someone can show how a system can have goals *without* a history of selection (e.g., via organizational closure or autopoiesis) that is robust enough to ground *mis*representation, I would drop the history requirement. Currently, I don't see that account working.

  **The Step in Reasoning Most Likely to Be Wrong:**
  I am assuming that **Philosophy of Medicine** actually needs a robust, metaphysical notion of "function." It is possible that "pathology" is just a value judgment layered over statistical atypicality, and doesn't require real biological norms. If PoM is just "socially salient statistical deviation," then the **Malfunction Burden** becomes less heavy, and Causal Role accounts become viable again. I am betting against this because clinicians act *as if* dysfunction is real, not just a value judgment.

  **Where I Am Unsured:**
  The **Gene-Drive** case. I don't know if a theory *should* say the gene-drive has a function to crash the population. It seems counter-intuitive. But if function is Selected Effect, and it was selected (engineered) to crash the population, then that *is* its function. This suggests that "Dysfunction" in Medicine might be relative to the *Organism*, while "Function" in Mind is relative to the *Replicator*. If so, the two customers are asking for incompatible concepts.

  ---

  ### Part IV: Scorecard

  **1. Selected-Effect / Etiological Account (e.g., Millikan, Neander)**
  *   **Performance:** Excellent on Malfunction and Naturalized Norms (Mind). It explains why the congenital heart is broken (it violates its selection history).
  *   **Failure:** Fails the Ahistorical Constraint. The *De Novo* protein and *Directed Evolution Enzyme* have no proper evolutionary history (or only an artificial one). It struggles with the **Transposable Element** (is its function selfish replication or current regulation?). It risks making "function" relative to the gene, which complicates PoM's organism-centric view of health.
  *   **Verdict:** The best fit for **Mind**, strained fit for **Med**.

  **2. Causal-Role / Systemic Capacity Account (e.g., Cummins, Garson)**
  *   **Performance:** Excellent on Ahistorical cases and Systemic Integration. The *De Novo* protein functions because it contributes to the cell. The **Holobiont** is easily handled.
  *   **Failure:** Collapses on Malfunction. If the *De Novo* protein fails to stabilize the membrane, it *lacks* the function; it doesn't *malfunction*. This makes it useless for Teleosemantics (no misrepresentation) and weakens PoM (disease becomes mere incapacity).
  *   **Verdict:** The best fit for **Med** (mostly), dead on arrival for **Mind**.

  **3. Pluralist / Deflationary Option (e.g., Godfrey-Smith, Griffiths)**
  *   **Performance:** Acknowledges the Impossible Triangle. Says "Function" is a cluster concept or context-dependent.
  *   **Failure:** Dissatisfying for theory-building. If PoM* needs *the* naturalized norm for content, being told "it depends on context" undermines the project. It solves the seminar's pedagogical problems by dissolving the metaphysical ones.
  *   **Verdict:** The most honest answer, but the least useful for the specific "Fixed Purpose" of grounding robust norms in Mind and Medicine.

  **Recommendation for the Seminar:**
  Use the **Etiological** account as the baseline because it is the only one that survives the **Malfunction Burden**. Then, use the **fresh cases** (De Novo, Gene-Drive, Directed Evolution) specifically to hammer on its weaknesses. Force the students to choose: do they want to save the theory of mental content (keep History) or save the theory of synthetic medicine (drop History)? Make them feel the tear in the concept.
