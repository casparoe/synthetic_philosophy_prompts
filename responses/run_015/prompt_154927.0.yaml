  He claims a smart thermostat sits at about 0.5 millinsects, while a fruit fly hovers around 50. Humans, obviously, are in the millions.

  I asked him where the moral cutoff is—where do we switch from "object" to "subject" on the gradient?

  He said, "That's the headache. On a continuous scale, any line is arbitrary. It's the Sorites Paradox with a body count."

  I said, "So how do you decide what you're allowed to swat?"

  He said, "I set the threshold at 45 millinsects."

  I said, "Why 45? Is that where neural integration peaks?"

  He said, "No. That's where the buzzing starts sounding like a plea."

  I said, "So morality is acoustic?"

  He said, "No. We don't draw the line where sentience begins. We draw it where our excuses stop working."
