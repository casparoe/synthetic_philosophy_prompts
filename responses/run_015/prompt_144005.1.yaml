prompt: |-
  I'm a phd student in political theory (mostly ideology and collective action stuff) and I'm putting together a workshop for about 16 grad students, 75 minutes. I want you to design an activty — a structured role-play with cards and points — that makes particpants feel the force of the idea that left-right coherence is mostly manufactured by negative partisanship and elite cueing rather than discovered from shared first principles. The twist I want injected is a three-round "blind coalition" format: round one, everyone gets hidden preference cards (economic, cultural, institutional) and must build a governing bloc without seeing anyone else's full profile; round two, an ambiguous "elite cue" (a single slogan) is dropped and coordination suddenly locks in; round three, the shared enemy is removed and the bloc fractures along hidden lines. Rules should include card distributions, a payoff scheme in points not money, and clear roles (maybe bloc leaders vs rank-and-file). I need a timeline for the 75 mins, a debrief that maps each round onto the conceptual claim, an honest note on which feature — probably that negative identity can be primary — the activty can't reproduce, and a prediction of what will go wrong the first time I run it. Please also say how confident you are in this design and point out the part you're least sure about.
