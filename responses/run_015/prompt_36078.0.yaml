  ### INSTRUCTOR COMMENTARY & NOTES

  **1. The Work Done by the Acquired Taste Case (Question 1)**
  This is the primary filter for **Realism**. If a student answers **NO** (introspection cannot distinguish experience-change from attitude-change), they are forced into **Path 1**.
  *   **Survivors:** Only **Illusionism** and **Dissolutionism** survive this branch.
  *   **Eliminated:** Old-Fashioned Qualia Realism, Naive Realism, and Strong Representationalism typically rely on introspection providing direct, incorrigible warrant for phenomenal properties. If that warrant is shaky, these positions lose their foundational support.

  **2. Indistinguishable Leaves (Where the Tree Lies)**
  Given the branch questions provided, this tree cannot cleanly separate the following pairs. You should expect overlap in seminar discussion:
  *   **Functionalism vs. Representationalism:** Many representationalists argue that representational content *is* defined by functional role (Psychofunctionalism). A student might reasonably check both boxes in Question 5. The tree treats them as distinct for heuristic purposes, but in the literature, they often converge.
  *   **Illusionism vs. Dissolutionism:** Both deny the existence of phenomenal properties as traditionally conceived. The distinction rests on whether the *error* is ontological (properties don't exist) or conceptual (the question is confused). In practice (e.g., Frankish vs. Dennett), the theoretical commitments are nearly identical.

  **3. The "Unnamed" Leaf**
  *   **Position:** Intrinsic Properties + No Inverted Spectrum.
  *   **Why Unoccupied:** This position claims experiences have intrinsic natures (Qualia Realism) but denies they can vary independently of function (Functionalism). This is arguably incoherent: if the property is truly intrinsic and non-functional, why *couldn't* it invert? If it can't invert, isn't it just a functional property? This spot is usually occupied by Type-B Materialists who argue the link is brute necessary, but they often deny the "intrinsic" label to avoid dualism.

  **4. Pedagogical Use**
  *   Have students mark their path individually before discussion.
  *   Use the **Acquired Taste** node to challenge the Qualia Realists: If they claim introspection is decisive, ask them to describe *exactly* what differs in the coffee case without referencing their desire to drink it.
  *   Use the **Inverted Spectrum** node to challenge the Functionalists: If they say inversion is impossible, press them on whether they are denying the *possibility* or just the *actual occurrence*.
