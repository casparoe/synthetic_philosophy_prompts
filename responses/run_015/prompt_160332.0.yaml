answer: |-
  In 2008, the CTO of a mid-sized fintech firm mandates "ProtoX," a custom binary protocol, over standard HTTP for internal APIs to shave milliseconds off transaction times. By 2015, ProtoX is deeply locked in: 500 microservices depend on it, hiring pipelines prioritize ProtoX expertise, and monitoring dashboards are hardwired to its packet structure, making switching costs prohibitive despite HTTP's growing ecosystem. However, by 2025, the very universality of ProtoX justifies the construction of a universal "Service Mesh"—a translation layer that sits between all services to manage security and routing. Because the Mesh touches 100% of traffic (a condition created by the lock-in), it becomes economically viable to build translators into the Mesh itself, allowing individual services to migrate to standard HTTP one-by-one without breaking connections. The network effects that cemented ProtoX created the scale necessary to fund the abstraction layer that made ProtoX obsolete, allowing the firm to escape the proprietary standard within the careers of the original engineering leadership.

  **Show Your Work**

  *   **Early Event:** The 2008 CTO mandate selecting ProtoX over HTTP.
  *   **Lock-in Mechanism:** **Complementarities and Coordination.** As more services adopted ProtoX, the value of complementary assets (debugging tools, trained engineers, monitoring scripts) increased, raising the switching cost for any single service to leave the network.
  *   **Unlock Mechanism:** **The Service Mesh Abstraction.** The lock-in created a monoculture (100% adoption). This monoculture lowered the marginal cost of building a universal translation layer (the Mesh) because it only needed to support one legacy protocol to be effective.
  *   **Why Endogenous:** The Mesh is not a new technology dropping in from outside; it is a governance tool generated *by* the need to manage the scale of the locked-in system. The mechanism of lock-in (increasing returns to adoption) produced the condition (total market capture) that made the unlock tool (universal translator) cost-effective. Without the lock-in, the Mesh would be too expensive to build; with it, the lock-in funds its own dissolution.
  *   **The Clock:** 2008 to 2025 (17 years). This fits within standard tech infrastructure lifecycles and the tenure of senior institutional stakeholders.
  *   **Single Feature:** The **abstraction layer** (Service Mesh). If you delete this feature, the services remain directly coupled to ProtoX. The switching costs return to prohibitive levels, and the system remains locked in.
  *   **Honesty Check:** Is this a true counterexample to "history gets locked in," or just two path-dependent episodes stacked back-to-back? A defender of strong path dependence (like Brian Arthur or Paul David) would argue this is **not** a counterexample, but rather a demonstration that lock-in is *contingent on the absence of a higher-order abstraction*. They would reabsorb this case by claiming the deployment of the Service Mesh was itself a new "critical juncture"—a second path-dependent event that reset the system. They would argue the system *was* locked in until the Mesh arrived, and the Mesh's arrival was not guaranteed by the first path but was a new historical branch. Furthermore, they might note that the final architecture (Mesh-based) is still shaped by the ProtoX era (e.g., the Mesh logic reflects ProtoX constraints), meaning history still matters even after the escape. I concede this: the case proves path dependence does not imply *permanent* lock-in, but it does not prove that history ceases to matter once the lock is broken.
