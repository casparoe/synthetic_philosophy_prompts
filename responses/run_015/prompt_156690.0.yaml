  In Case B, the accounts genuinely diverge. The etiological view preserves $E$ as the function during the drift phase, maintaining explanatory continuity regarding why $T$ exists. The causal-role view correctly identifies that $E$ is causally inert now. This is not a contradiction but a division of labor. Etiology answers "why is this trait here?"; causal-role answers "what does this trait do now?". In the subpopulation where $F$ is selected, etiological function shifts. During drift, etiological function persists as a historical shadow, while causal-role function tracks current utility. We should accept both: $T$ is an $E$-device currently doing $F$. Confusing these leads to errors in conservation biology, such as assuming vestigial traits are useless versus functional. If we settle on etiology, we prioritize history and homology; if causal-role, we prioritize current system dynamics and physiology. This protects homology claims even when function shifts. The drift phase is crucial: etiology says function remains, causal-role says it vanishes. Both are right about their respective domains.

  Case C exposes the relativity of systemic explanation. The causal-role account admits function is relative to the containing system chosen. The etiological account attempts to fix this by appealing to the level of selection, but this merely relocates the relativity to the unit of selection debate. Since multilevel selection is often empirically ambiguous, the etiological account risks indeterminacy where the causal-role account offers contextual clarity. The causal-role view is superior here because it treats function attribution as an explanatory tool rather than a metaphysical discovery. We choose the system based on what we want to explain. Forcing a single level can lead to ignoring group dynamics if individual selection is stronger historically but group selection is current. The relativity is a virtue: it forces explicitness about the explanatory context. Etiology hides this behind the "true level" quest. If we choose CR, we accept context-dependence; if SE, we seek a single truth. This is critical for understanding altruism without invoking group metaphysics.

  Regarding smoothing: This proposal attempts to arbitrate the sharp cutoff of the etiological account. However, it merely relocates the arbitrariness from the threshold of selection to the weighting parameters of the lineage profile. It does not dissolve the dispute because it fails to specify whether the resulting gradient represents historical strength or current capacity. It collapses into a time-weighted etiological account, preserving the historical commitment while softening the boundary. This helps modeling but obscures the ontological distinction between useful accident and selected trait. The dispute is conceptual, not empirical; smoothing treats it as empirical. It creates a false continuum where ontology demands distinct categories.

  Regarding malfunction: The claim that only etiology underwrites malfunction is false. Causal-role theorists can reconstruct malfunction by referencing the typical contribution of a trait-type to a system capacity. A heart fails if it does not match the reference class norm. However, the etiological account provides a more robust normative ground: failure to meet the historical standard that explains existence. Causal-role malfunction is statistical; etiological malfunction is teleological. While causal-role can recover the concept, etiology offers a tighter fit for biological normativity. The colleague is wrong that CR *cannot* do it, but right that SE does it more naturally. Thus, SE is preferred for normativity, CR for physiology.

