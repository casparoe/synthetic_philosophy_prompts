answer: |-
  Based on the track record you provided, here is the breakdown of your advisor's implicit demarcation rule, the prediction for the new case, and the hypothetical splitter.

  ### 1. Diagnosing the Rule

  You offered three candidates: Popperian falsifiability, Mechanistic empirical access, and Lakatosian research programs. Here is how they score against her history:

  *   **Strict Popperian Falsifiability:** **Poor Fit.**
      *   *Why:* A strict Popperian would classify **Freudian dream interpretation** and **Marxist historiography** as pseudoscience. Popper specifically used Freud and Marx as his primary examples of non-science because their core axioms are often insulated from falsification (ad hoc explanations for any outcome). Since your advisor calls them *science*, she is not relying on strict falsifiability.
  *   **Mechanistic/Empirical Access:** **Poor Fit.**
      *   *Why:* This rule demands direct measurement of the claimed causal mechanism. This would exclude **Buss-style evolutionary psychology** (we cannot observe ancestral environments) and **Freud** (we cannot directly measure the unconscious). It would also likely exclude **Marxist historiography** (historical forces are not measurable variables). Since these are "science" for her, direct mechanistic access is not a hard requirement.
  *   **Lakatosian Research Program (Progressive vs. Degenerating):** **Best Fit.**
      *   *Why:* Imre Lakatos argued that science is defined by whether a "research program" is *progressive* (predicting novel facts/expanding explanatory power) or *degenerating* (adding ad hoc patches to explain away failures).
      *   *The "In" Group:* **Freud, Marx, Buss, Climate, fMRI.** These are all generative frameworks. They spawn new questions, accommodate data (even retrospectively), and structure inquiry.
      *   *The "Out" Group:* **Phrenology, Parapsychology, ID.** These are degenerating. Phrenology made empirical claims that failed and the program died. Parapsychology has run protocols for decades without robust, novel positive results (degenerating). ID offers no novel predictions, only negative arguments against evolution.
      *   *The Crucial Distinction:* **String Theory** is the key. It is mathematically rigorous but "Not Science" for her. Why? Because it has no empirical novelty *yet*. It is a stagnant program. **Typogenetics**, by contrast, claims "retrospective hits."

  **The Implicit Rule:** **"Generative Empiricism."** A framework counts as science if it functions as a coherent research tradition that successfully accommodates observable patterns (even retrospectively) and generates further inquiry, provided it does not rely on supernatural mechanisms or empirically falsified cores.

  ### 2. Prediction: Typogenetic Epistemology

  **Verdict:** **Science.**

  **Reasoning:**
  Your advisor's classification of **Freud** and **Marx** as science is the strongest signal. Both are high-level structural frameworks that explain *dynamics* (psychological or historical) rather than offering simple, immediate mechanical predictions. Both rely heavily on retrospective coherence (explaining why the revolution/dream happened *after* the fact).

  **Typogenetic Epistemology** mirrors this profile:
  1.  **Structural/Abstract:** Like Marx or Freud, it models the *logic* of the system (science itself) rather than a physical object.
  2.  **Empirical Anchor:** Unlike String Theory (which has zero empirical hits), Typogenetics claims "three retrospective hits on citation-network patterns." This places it closer to Marxist historiography (fitting historical data) than String Theory (pure math).
  3.  **Generative:** It predicts future dynamics ("mature disciplines will generate..."), offering a heuristic for future research.

  It avoids the "Not Science" traps: it isn't supernatural (ID/Parapsychology), and it isn't a dead, falsified empirical claim (Phrenology). It is a "progressive" theoretical framework with some data backing.

  ### 3. The Hypothetical Splitter Case

  To distinguish these rules definitively, you need a case where the *methodological success* conflicts with *falsifiability* and *mechanism*.

  **The Case:** **"The Invisible Shield" Astronomy**
  An astrophysicist proposes that a specific region of space is protected by an undetectable "gravity-dampening field."
  *   **The Failure:** A planet in that region deviates from the predicted orbit (falsifying the original model).
  *   **The Rescue:** The theorist posits the "Shield" to explain the deviation. The Shield cannot be detected directly by any instrument (violating Mechanistic access).
  *   **The Novelty:** The mathematical properties of this Shield successfully predict a previously unknown wobble in a *second*, distant star system (a novel fact).

  **How the Rules Split:**
  *   **Popperian:** **Not Science.** The "Shield" is an *ad hoc* immunization strategy introduced solely to save the theory from falsification. It renders the core axiom unfalsifiable.
  *   **Mechanistic:** **Not Science.** There is no direct empirical access to the mechanism (the field is undetectable by definition).
  *   **Lakatosian:** **Science.** Despite the ad hoc origin, the theoretical shift was *progressive* because it led to the prediction of a novel fact (the second star's wobble) that was subsequently confirmed.

  If your advisor calls "The Invisible Shield" **Science**, she is a pure Lakatosian. If she calls it **Pseudoscience**, she has a hidden Popperian constraint regarding ad hoc rescues that hasn't shown up in her track record yet. Given the Freud/Marx verdicts, I bet she calls it Science.
