  2.  **Deconstruct the Problem (Buridan's Ass):**
      *   The paradox arises from the Principle of Sufficient Reason (PSR). If $A$ and $B$ are identical in value, there is no sufficient reason to choose $A$ over $B$. If action requires a sufficient reason, no action occurs. If action occurs without a sufficient reason, rationality is violated (or randomness is introduced).
      *   The user wants a *specification* of what a solution *must do*, not just a history of the debate.

  3.  **Drafting the Requirements (The "Spec"):**
