      *   *Conclusion:* The jointly unsatisfiable subset is {Perfect Determinism, Perfect Symmetry, Finite Termination}. You must drop one. Since Biology demands Termination and Physics allows Symmetry, Determinism (in the strict logical sense) is the casualty.

  5.  **Scoring the Camps:**
