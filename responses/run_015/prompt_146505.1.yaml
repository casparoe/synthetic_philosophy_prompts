      *   *Req 6: The Randomness Distinction.* Must distinguish "I don't care" (indifference) from "I must flip a coin" (meta-reason to randomize). (Hard constraint: Conceptual Clarity).

  4.  **Analyzing the "Real Knot" (Consistency Check):**
      *   Can we have No Hidden Preference + No Deterministic Tie-Breaker + No Infinite Loop?
      *   *Determinism:* If the brain is deterministic, and inputs are identical, output must be identical (or null). If output is "Left", there was a hidden variable (preference).
      *   *Randomness:* If the brain introduces true randomness (quantum? thermal noise?), it avoids hidden preference but challenges "Rational Coherence" if not bounded.
      *   *Metabolic Cost:* This forces a decision. But *which* one?
      *   *The Conflict:* Req 1 (Symmetry) vs. Req 3 (Termination) vs. Determinism.
