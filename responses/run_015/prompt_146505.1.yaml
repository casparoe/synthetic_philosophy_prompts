answer: |-
  Here is the conceptual spec for a theory of rational choice under symmetry, drafted for a biologist's rigor.

  ### Part 1: The Specification (Requirements)

  A viable theory must satisfy the following six constraints. I have distinguished between **Hard Constraints** (violations render the theory logically, physically, or biologically impossible) and **Camp Prejudices** (philosophical preferences that can be discarded).

  **1. Symmetry Invariance (Hard Constraint: Logic)**
  *   **Spec:** If options $A$ and $B$ are identical in all value-relevant properties, the probability of selecting $A$ must equal the probability of selecting $B$ ($P(A) = P(B) = 0.5$).
  *   **Why Hard:** Violating this implies a hidden variable (a preference) exists where the theory claims none does. It violates the Principle of Sufficient Reason.

  **2. Spatial Indexicality without Valuation (Hard Constraint: Physics)**
  *   **Spec:** The theory must acknowledge that while hay bales are identical in *quality*, they differ in *coordinates* (Left vs. Right). However, the choice mechanism cannot assign *value* to coordinates unless the agent has a pre-existing bias (e.g., handedness).
  *   **Why Hard:** Ignoring spatial separation denies physical reality; assigning value to it without prior bias violates Symmetry Invariance. The theory must explain how a spatial difference becomes a selection trigger without becoming a preference.

  **3. Metabolic Termination (Hard Constraint: Biology)**
  *   **Spec:** The decision process must halt within finite time $T$, where the cost of computation $C(t)$ does not exceed the value of the resource $V$. As $t \to \infty$, $C(t)$ must force a collapse of the decision state.
  *   **Why Hard:** This is your contribution. In a wet lab, systems run down. A theory that permits infinite deliberation describes a dead organism. Rationality includes survival.

  **4. Rational Coherence / No Dutch Books (Hard Constraint: Decision Theory)**
  *   **Spec:** The method of breaking symmetry must not allow an external agent to construct a cycle of bets that guarantees a loss for the chooser.
  *   **Why Hard:** If a "random" choice can be exploited systematically, it is not rational; it is defective. The randomization must be a stable mixed strategy.

  **5. Neural Arbitration Plausibility (Hard Constraint: Empirical Science)**
  *   **Spec:** The mechanism must map to known mammalian action selection (basal ganglia/thalamocortical loops). Specifically, it must account for competitive inhibition between action channels and the role of noise in resolving stalemates.
  *   **Why Hard:** If the theory requires a non-physical "soul" or a computational power exceeding the brain's thermodynamic limit, it is false for biological agents.

  **6. The Indifference/Randomization Distinction (Hard Constraint: Conceptual)**
  *   **Spec:** The theory must distinguish between (a) having no reason to prefer $A$ over $B$, and (b) having a reason to *pick one* (e.g., metabolic cost).
  *   **Why Hard:** Conflating these leads to the error of thinking "no preference" implies "no action." The reason to act is distinct from the reason for *which* act.

  ---

  ### Part 2: Consistency Check (The Real Knot)

  You asked if there is a jointly unsatisfiable subset. **Yes.**

  The triad below is inconsistent in a closed, deterministic system:
  1.  **Strict Determinism:** State $S_t$ fully determines $S_{t+1}$.
  2.  **Perfect Symmetry:** Inputs and internal weights for $A$ and $B$ are identical.
  3.  **Finite Termination:** A choice is made in finite time.

  **The Proof of Failure:**
  If the system is deterministic and inputs are symmetric, the internal state evolution must remain symmetric. If the state remains symmetric, the output cannot be asymmetric (choosing $A$). Therefore, the system either loops forever (violating Termination) or outputs "Null" (starvation). To choose $A$ requires breaking symmetry. In a deterministic system, symmetry breaking requires an asymmetric input (Hidden Preference).

  **The Resolution:**
  To satisfy the Spec, you must drop **Strict Determinism** at the point of arbitration.
  *   You keep **Symmetry** (no hidden value bias).
  *   You keep **Termination** (metabolic pressure).
  *   Therefore, the selection mechanism must be **Stochastic**.

  This is not "primitive randomness" as a metaphysical claim, but **functional stochasticity**. The metabolic cost (Req 3) raises the "temperature" of the decision system until thermal/neural noise is amplified enough to break the tie. This satisfies Neural Plausibility (basal ganglia rely on dopaminergic noise and stochastic resonance) and Rational Coherence (a 50/50 mixed strategy is unbeatable in symmetric games).

  **Does it avoid the loop?**
  Yes. The metabolic cost acts as a time-dependent bias on the *act of choosing*, not the *object chosen*. It forces the system to lower its decision threshold. As the threshold drops, neural noise inevitably crosses it for one channel before the other.

  ---

  ### Part 3: Scorecard of the Main Camps

  Here is how the standard philosophical camps score against your spec.

  **1. The Hard Determinists (Leibnizians)**
  *   *Claim:* There is always a hidden difference (a "smallest perception") that determines the choice.
  *   *Score:*
      *   Symmetry Invariance: **FAIL** (Sneaks in hidden preference).
      *   Metabolic Termination: **PASS** (Decides instantly).
      *   Neural Plausibility: **FAIL** (Requires precision exceeding neural noise floors).
  *   *Verdict:* Biologically false. Neurons are noisy; insisting on hidden determinism is a metaphysical prejudice, not a scientific constraint.

  **2. The Wait-for-External-Perturbation Group**
  *   *Claim:* The agent waits until the environment changes (wind blows, one bale rots) to break symmetry.
  *   *Score:*
      *   Symmetry Invariance: **PASS**.
      *   Metabolic Termination: **FAIL** (If the environment is static, the agent starves).
      *   Neural Plausibility: **FAIL** (Basal ganglia do not wait passively; they actively compete).
  *   *Verdict:* Evolutionarily unstable. A creature that starves waiting for a breeze is removed from the gene pool.

  **3. The Primitive-Randomness Folks (Buridan Solution)**
  *   *Claim:* The will has a faculty of self-determination that can choose without a prior cause.
  *   *Score:*
      *   Symmetry Invariance: **PASS**.
      *   Metabolic Termination: **PASS**.
      *   Rational Coherence: **PASS** (If treated as a mixed strategy).
      *   Neural Plausibility: **PASS** (If "will" is replaced by "stochastic thresholding").
  *   *Verdict:* The only survivor, provided you strip the metaphysics and treat "randomness" as "sensitivity to sub-threshold noise."

  ---

  ### Part 4: The Killer Requirement

  The requirement that kills the most candidates is **Metabolic Termination combined with No Hidden Preference.**

  *   **Why:** Most philosophical theories treat decision-making as cost-free computation. They assume time is infinite. Once you impose a *budget* (calories burned per second of deliberation), the "Wait for Perturbation" and "Infinite Loop" solutions become fatal errors.
  *   **The Consequence:** This forces the system to be **error-prone**. To survive, the agent *must* be willing to make a choice that isn't fully determined by value.
  *   **The Biological Map:** This maps directly to the **Speed-Accuracy Tradeoff** in psychophysics. The basal ganglia accumulate evidence until a bound is reached. In perfect symmetry, evidence accumulation is zero. The metabolic cost lowers the bound. The crossing is triggered by noise.

  **Summary:**
  The knot is untied by recognizing that **rationality is not just about maximizing value, it's about minimizing cost.** When value is symmetric, cost becomes the only asymmetric variable. The "reason to randomize" is the metabolic cost of *not* randomizing. The "which" is determined by noise, which is not a preference, but a physical necessity for termination.

  This keeps the distinction: You have no reason to choose *Left*, but you have a very good reason (survival) to choose *Something*. The mechanism that delivers *Something* without a reason for *Left* is amplified noise. That is the only theory that doesn't starve the donkey.
