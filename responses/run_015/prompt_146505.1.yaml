      *   *Req 3: Metabolic Termination.* Indecision costs energy. The system must terminate the loop before energy depletion. (Hard constraint: Biology/Thermodynamics).
      *   *Req 4: Rational Coherence (No Dutch Books).* The selection mechanism shouldn't allow exploitable cycles in broader decision contexts. (Hard constraint: Decision Theory).
