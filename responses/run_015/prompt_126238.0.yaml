      *   **Ranking Defeaters:**
          1.  *The Common Moral Currency (Fatal):* The *Synkrisis* requires a shared standard to judge.
          2.  *The Unity of the Corpus (Fatal/Serious):* Conflict with *Moralia*'s moral psychology.
