      *   *Defeater 2: The Synkrisis Conclusions.* The formal comparisons at the end often declare a "winner" based on moral metrics (e.g., who was more temperate, who served the state better).
          *   *Severity:* Fatal. If you can judge A > B on moral grounds, there must be a common moral currency. If virtues were incommensurable, judgment would be impossible.
          *   *Nuance:* The user argues the *comparison* reveals the difference. But if Plutarch *judges* them, he implies a standard.

      *   *Defeater 3: Physis vs. Nomos.* Plutarch often attributes actions to *physis* (nature) rather than just *nomos* (custom).
          *   *Severity:* Serious. If character is innate and stable across cultures, the "context-bound performance" theory weakens.
          *   *Nuance:* User might say *physis* is expressed differently, but if *physis* is the core, it's learnable/imitable.

      *   *Defeater 4: Reader Reception/Paratext.* Ancient letters (e.g., Sosius Senecio) suggest the work is for moral improvement (*prokopē*).
          *   *Severity:* Awkward. Plutarch might be lying or using polite convention. But combined with internal evidence, it hurts.

      *   *Defeater 5: Contemporary Virtue Ethics (MacIntyre/Nussbaum).* If modern virtue ethics successfully uses narratives for moral learning despite historicity, the "structurally incoherent" claim fails.
          *   *Severity:* Merely Awkward. This attacks the *implication*, not the reading of Plutarch.

  6.  **Address the "Unfalsifiability" Charge:**
