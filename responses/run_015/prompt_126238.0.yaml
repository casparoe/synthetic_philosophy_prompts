  **(Self-Correction on "Fatal" vs "Serious"):**
  *   *Fatal:* If the *Synkrisis* relies on a universal standard, the "incommensurability" thesis collapses immediately.
  *   *Serious:* If Plutarch's psychology posits a stable soul, the "context-bound" thesis is weakened but maybe not destroyed (expression vs. essence).
  *   *Awkward:* External reception or modern ethics.

  10. **Final Review against constraints:**
