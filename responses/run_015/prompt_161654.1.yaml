      2.  Evolutionary adaptivity of religion in the Pleistocene.
      3.  Fine-grained cognitive mechanics of belief acquisition (unless linked to behavior).

      *WEIRD Impact:* If the WEIRD hypothesis is true, standard CSR (Cognitive Science of Religion) based on Western concepts of "belief" may be invalid globally. This lowers the priority of Q3 if it relies on Western definitions of ritual/belief. It raises the priority of ethnographic work.
