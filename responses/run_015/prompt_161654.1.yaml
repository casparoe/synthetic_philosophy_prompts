answer: |-
  The prioritized agenda ranks (1) the institutional conditions under which religious groups cooperate with or resist secular authorities, (2) the doctrinal features that predict legal volatility versus stability, and (3) the cross-cultural validity of ritual mechanisms for social cohesion, explicitly deprioritizing universal cognitive architectures in favor of epidemiological dynamics.

  **1. Under what institutional conditions do religious organizations function as high-trust coordination networks versus insular identity fortresses?**
  This question is upstream of public-health logistics and disaster response; officials need to know whether routing resources through congregations amplifies reach or introduces bias and exclusion. It is tractable now using mixed methods: social network analysis of congregational ties combined with administrative data on aid delivery and compliance rates in diverse geopolitical contexts. A specific result within five years that would move this up the ranking would be a validated typology of religious governance structures (e.g., hierarchical vs. congregationalist) that predicts cooperation with state mandates with greater than 80% accuracy; conversely, if institutional structure proves no more predictive than secular civic groups, this question drops to basic research status.

  **2. Which structural features of religious doctrines predict resilience or volatility when exposed to secular state authority?**
  This is upstream of judicial decision-making regarding exemptions and accommodations; courts currently lack empirical criteria to distinguish between central tenets and peripheral practices when adjudicating burdens. It is tractable using comparative historical analysis and natural language processing on legal briefs, doctrinal texts, and court rulings across multiple jurisdictions to identify semantic or structural markers of conflict. A five-year result that elevates this priority would be the identification of specific doctrinal clauses (e.g., regarding bodily autonomy vs. dietary restriction) that consistently correlate with litigation outcomes regardless of jurisdiction; if doctrinal content proves less predictive than local political economy, this question is demoted in favor of purely sociological variables.

  **3. How does ritual frequency and type correlate with group cohesion and out-group hostility across non-WEIRD populations?**
  This is upstream of educational curriculum design and social cohesion policy; educators need to know whether teaching about religious practice reinforces division or fosters understanding of binding mechanisms. It is tractable using existing psychometric tools for cohesion and trust, administered during fieldwork in Global South and Indigenous contexts where religious practice is less individuated than in the West. A result that moves this up would be evidence that specific ritual forms (e.g., synchronous movement vs. doctrinal recitation) have universal effects on trust; if effects are entirely context-dependent, the question shifts from "mechanisms of cohesion" to "anthropological cataloging," reducing its utility for generalizable policy.

  **Impact of the WEIRD Hypothesis**
  Treating the WEIRD bias as a live hypothesis significantly re-ranks this agenda by demoting any question assuming "belief" is the primary unit of analysis. If flagship findings are artifacts of post-Protestant individualism, then research into individual cognitive belief acquisition becomes less generalizable and potentially unanswerable with current populations, as Western subjects may be the only ones who treat religion as a matter of private propositional assent. This hypothesis elevates Question 1 and 3 because institutional structures and ritual behaviors are observable across cultures even if internal belief states are not comparable; it makes purely survey-based research on "religious belief" in Western populations nearly worthless for global prediction, forcing a shift toward behavioral and institutional metrics that do not rely on self-reported credence.

  **Cognitive Receptivity vs. Epidemiological Dynamics**
  Your suspicion is correct: the second family (why packages spread/stabilize) is far more decision-relevant because public-health officials, courts, and educators interact with religious *groups* and *behaviors*, not individual neural architectures. The first family (why minds are receptive) deserves more money only if specific cognitive vulnerabilities can be shown to causally determine institutional behavior at a scale large enough to predict outbreaks of conflict or cooperation; absent a direct link between a cognitive mechanism (e.g., hyperactive agency detection) and a macro-level outcome (e.g., vaccination refusal rates), funding cognitive receptivity is merely satisfying theoretical prestige rather than enabling intervention.

  **Declined Funding**
  I would decline funding for (1) **neural correlates of spiritual experience**, because knowing which brain lights up during prayer changes no legal standard or health protocol; (2) **the evolutionary adaptivity of religion in the Pleistocene**, because whether religion was adaptive for ancestors offers no leverage on modern institutional management; and (3) **fine-grained models of individual belief acquisition in Western undergraduates**, because if the WEIRD hypothesis holds, these models describe an outlier population and cannot inform decisions about global health or non-Western legal systems. These questions are fashionable within cognitive science of religion but remain downstream of utility; answering them changes no one's mind about how to manage a religious exemption or route a vaccine.
