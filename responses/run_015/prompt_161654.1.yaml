      *   **Output Structure:**
          1.  Bottom line (ordered list of 3-4 open questions) in the *first sentence*.
          2.  Reasoning for each question (upstream/downstream relationships, tractability with current methods, specific 5-year results that would change ranking).
          3.  Questions to decline funding (fashionable but low impact on practice/minds).
          4.  Address Constraint 1: WEIRD bias (wealthy, literate, post-Protestant, high-trust) as a live hypothesis affecting ranking/answerability.
          5.  Address Constraint 2: Distinction between cognitive receptivity (why minds accept religion) vs. epidemiological dynamics (why specific packages spread/stabilize). Take a position on which deserves more funding based on decision-relevance vs. prestige.
      *   **Constraints:** No preamble, no restatement of the question. Lead with the bottom line in the first sentence.

  2.  **Deconstruct the Constraints & Goals:**
      *   *Naturalistic Approach:* No theology as explanation. Cognitive science, epidemiology, sociology, anthropology, history.
      *   *Decision-Relevance:* Public health (congregations), Law (exemptions), Education (curricula). This implies a need for predictive or mechanistic understanding of *institutional behavior* and *group dynamics*, not just individual belief.
      *   *WEIRD Bias:* Must account for the fact that existing theories might be based on outliers. This likely elevates cross-cultural/comparative work and demotes theories based solely on Western individualism.
      *   *Cognitive vs. Epidemiological:* The prompt suspects the second (spread/stability) is more decision-relevant. I need to evaluate this. Decision-makers care about *what religion does* in society, not just *why brains like gods*. So, the epidemiological/institutional side is likely higher priority for this specific foundation's goals.
      *   *Resource Constraint:* 15 researcher-years over 5 years = 3 researchers full-time for 5 years, or equivalent. This is small. Cannot solve everything. Must be targeted.

  3.  **Drafting the Agenda (Iterative Process):**

      *   *Candidate Questions:*
          1.  Cognitive mechanisms of belief (HADD, ToM, etc.).
          2.  Cooperation/Trust mechanisms within religious groups.
          3.  Transmission dynamics (why some doctrines spread, others die).
          4.  Secularization vs. Persistence (why religion declines in some places, not others).
          5.  Institutional resilience (how religious organizations survive stress/change).
          6.  Ritual efficacy (how collective ritual binds groups).

      *   *Selecting for Decision-Relevance:*
          *   Public health needs to know: Can we trust congregations to deliver aid? Do they amplify or dampen health behaviors? -> *Institutional Trust/Cooperation.*
          *   Courts need to know: What counts as a sincere burden? How do exemptions affect social cohesion? -> *Doctrine/Behavior Linkage.*
          *   Educators need to know: How to teach about religion without bias? How do religious identities form? -> *Transmission/Socialization.*

      *   *Addressing WEIRD Bias:* Many cognitive theories are based on Western undergraduates. Many secularization theories are based on Europe. We need questions that test these limits.
      *   *Addressing Cognitive vs. Epidemiological:* The prompt suggests prioritizing the latter. I agree given the "decision-maker" goal. Courts and health officials deal with groups and behaviors, not just neural pathways.

      *   *Proposed Priority List:*
          1.  **Under what conditions do religious institutions function as high-trust coordination networks versus insular identity fortresses?** (Directly hits public health & law).
          2.  **What structural features of religious doctrines predict their resilience or volatility when exposed to secular state authority?** (Directly hits courts & education).
          3.  **How does ritual frequency and type correlate with group cohesion and out-group hostility across non-WEIRD populations?** (Hits education & general theory, addresses WEIRD bias).

      *   *Refining for the "First Sentence" Constraint:*
          "The prioritized agenda ranks (1) the conditions under which religious institutions function as high-trust coordination networks versus insular identity fortresses, (2) the structural features of doctrines that predict resilience or volatility under secular state authority, and (3) the cross-cultural correlation between ritual types and group cohesion, explicitly deprioritizing universal cognitive architectures in favor of epidemiological dynamics."

      *   *Developing the Reasoning:*
          *   *Q1 (Institutions/Trust):* Upstream of public health delivery. Tractable via network analysis + fieldwork. 5-year result: A typology of congregations predictive of compliance/cooperation.
          *   *Q2 (Doctrine/State):* Upstream of legal exemptions. Tractable via comparative law + historical analysis. 5-year result: Identification of doctrinal markers that signal conflict vs. accommodation.
          *   *Q3 (Ritual/Cohesion):* Upstream of education/social cohesion. Tractable via ethnography + psych metrics. 5-year result: Validation or falsification of "synchrony binds" outside WEIRD contexts.
          *   *WEIRD Constraint:* This re-ranks cognitive universals down. If religion in Global South is more about power/kinship than belief, cognitive theories of "belief" become less useful.
          *   *Cognitive vs. Epi Constraint:* I need to argue that for *decision makers*, the epidemiological (spread/stability) is more useful. Cognitive is foundational but too distal.

      *   *Declining Funding:*
          *   "Is religion adaptive?" (Too abstract, doesn't change practice).
          *   "Neural correlates of prayer" (Interesting, but doesn't help a health official).
          *   "Secularization Thesis validity in Europe" (Too specific/WEIRD).
          *   "Exact cognitive mechanism of HADD" (Too distal from institutional behavior).

  4.  **Refining the Argument & Tone:**
      *   Must be decisive.
      *   Must integrate the WEIRD hypothesis as a *live hypothesis* affecting the ranking.
      *   Must take a stance on Cognitive vs. Epidemiological.
      *   No preamble.

  5.  **Drafting the Content (Mental Check against constraints):**
      *   *First Sentence:* Must contain the ordered list.
      *   *WEIRD:* Explicitly mention how this changes rankings (e.g., lowers priority of standard cognitive science of religion (CSR) if it relies on WEIRD samples).
      *   *Cognitive vs. Epi:* Explicitly agree/disagree with the user's suspicion. (I will agree: Epi is more decision-relevant).
      *   *Declined:* Specific fashionable topics.
      *   *Tractability:* Must mention current methods.
      *   *5-Year Metric:* Specific result for each.

  6.  **Final Polish:**
      *   Ensure the distinction between "why minds are receptive" (Cognitive) and "why packages spread" (Epidemiological/Institutional) is clear.
      *   Ensure the "15 researcher-years" constraint is respected (i.e., don't propose massive global surveys, focus on targeted comparative work).
