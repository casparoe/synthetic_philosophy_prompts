  Here's a thinking process that leads to the suggested handout:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on the epistemic standing of moral intuitions (specifically distinguishing tracking genuine normative features vs. artifacts of framing/affect).
      *   **Problem:** A colleague claimed the inquiry is misguided because "there is no accounting for tastes" (intuitions = preferences, preferences can't be mistaken/alienated). Students found this decisive; the instructor disagrees but needs arguments.
      *   **Task 1:** Inventory of distinct, precisely statable claims the proverb "There is no accounting for tastes" (*de gustibus non est disputandum*) might assert.
          *   Arrangement: Platitudinous $\rightarrow$ Ambitious.
          *   Format per item: One-sentence formulation, Verdict (True/False/etc.), Compatibility Note (available given framing/order sensitivity?).
          *   Special Case: Include the "conversational closer" reading and what happens when it becomes a premise.
      *   **Task 2:** Briefly analyze the colleague's specific usage.
          *   Which reading is required to make the inquiry misguided?
          *   Does it deliver the conclusion?
          *   Address the "covert classificatory work" (calling them "tastes" begs the question).
          *   Provide a restricted version that is true but compatible with the inquiry.
      *   **Format:** A list suitable for handing out at a seminar (not an essay).

  2.  **Deconstruct the Proverb ("There is no accounting for tastes"):**
      *   *Literal meaning:* We cannot explain *why* people like what they like.
      *   *Normative meaning:* We cannot argue about what people *should* like.
      *   *Metaphysical meaning:* Tastes are brute facts about individuals, not responsive to reason.
      *   *Epistemic meaning:* There is no truth of the matter regarding tastes.
      *   *Pragmatic meaning:* Stop talking about this, it's pointless.

  3.  **Drafting the Inventory (Task 1):**
      *   *Goal:* Move from weak/obvious to strong/controversial.
      *   *Item 1 (Platitude):* Causal explanation is hard. People don't always know why they like things.
          *   Verdict: Trivially True.
          *   Compatibility: Compatible (framing effects make explanation harder).
      *   *Item 2 (Pragmatic):* Disputes about taste often end in stalemate.
          *   Verdict: Substantive and Defensible.
          *   Compatibility: Compatible (acknowledges difficulty, not impossibility).
      *   *Item 3 (Conversational Closer):* This isn't an assertion but a signal to stop discussing.
          *   Verdict: N/A (Speech act).
          *   Compatibility: Compatible as a move, but fails as a premise.
      *   *Item 4 (Normative Authority):* No external standard exists to judge tastes as correct/incorrect.
          *   Verdict: Contentious (depends on metaethics).
          *   Compatibility: Incompatible with the seminar's goal (assumes the conclusion).
      *   *Item 5 (Rational Insensitivity):* Tastes are not responsive to reason or evidence.
          *   Verdict: False (preferences can change with information).
          *   Compatibility: Incompatible (framing effects show sensitivity to presentation, which is a form of reason-adjacent input).
      *   *Item 6 (Metaphysical Bruteness):* Tastes are entirely idiosyncratic and share no common structure.
          *   Verdict: False (psychology shows patterns).
          *   Compatibility: Incompatible (framing effects show shared structure).

      *Refining the Verdicts and Compatibility:* I need to be careful with the "Compatibility" column. The prompt asks if it remains available to someone who accepts order- and framing-sensitivity. If the claim says "Tastes are immutable," framing sensitivity disproves it. If the claim says "Tastes are subjective," framing sensitivity is compatible but doesn't prove it.
      *   *Correction on Item 5:* If intuitions are sensitive to framing, they *are* responsive to input, just perhaps the wrong kind. So "not responsive to reason" is challenged by framing data (which shows responsiveness to *irrelevant* features).
      *   *Correction on Item 4:* This is the crux. If "taste" implies "no truth condition," then calling intuitions "tastes" begs the question against moral realism/cognitivism.

  4.  **Drafting the Colleague Analysis (Task 2):**
      *   *Which reading?* To say the inquiry is *misguided*, the colleague needs the strong normative/metaphysical reading (Item 4 or 5 above). They need to claim intuitions *cannot* be mistaken.
      *   *Does it deliver?* No, because it assumes what needs to be proved (that moral intuitions are merely preferences).
      *   *Covert Classificatory Work:* Yes. Calling them "tastes" classifies them as non-cognitive states. The seminar is asking *if* they are non-cognitive. This is begging the question.
      *   *Restricted Version:* "There is no accounting for tastes *qua* mere preferences." Or "There is no *external* accounting for *brute* sensory preferences." This leaves room for moral intuitions to be something else.

  5.  **Formatting and Tone:**
      *   Tone: Academic, precise, handout-ready.
      *   Structure: Clear headings, bullet points.
      *   Constraint Checklist: One-sentence formulations? Yes. Verdicts? Yes. Compatibility notes? Yes. Conversational closer included? Yes. Separate brief section? Yes.

  6.  **Review and Refine:**
      *   *Check Item 1:* "People often cannot articulate the causal origins of their preferences." -> Trivially True. Compatible? Yes.
      *   *Check Item 2:* "Rational persuasion rarely alters fundamental preferences." -> Substantive/Defensible. Compatible? Yes (framing isn't persuasion).
      *   *Check Item 3 (Closer):* "Let us stop discussing this." -> Speech Act. As premise? It commits the fallacy of ending inquiry by fiat.
      *   *Check Item 4:* "Preferences lack truth conditions." -> Contentious (Metaethical debate). Compatible? No, this denies the seminar's starting point.
      *   *Check Item 5:* "Preferences are immune to rational criticism." -> False/Contentious. Compatible? No.
      *   *Check Item 6:* "All pro-attitudes are preferences." -> False (Category error). Compatible? No.

      *Refining the "Colleague" section:* Make sure to highlight the *question-begging* nature. The phrase "covert classificatory work" in the prompt is key. I need to explicitly state that labeling intuitions as "tastes" presupposes non-cognitivism.

      *Restricted Version:* "There is no accounting for *brute sensory* tastes." This allows moral intuitions to be distinct.

  7.  **Final Polish:** Ensure the language is suitable for a graduate seminar (precise philosophical terminology but clear). Ensure the distinction between "true but irrelevant" and "false" is clear.

      *(Self-Correction during drafting)*: Make sure the "Verdict" column is distinct from the "Compatibility" column. The Verdict is about the truth of the claim itself; Compatibility is about whether holding that claim is consistent with the empirical data discussed in class (framing/order effects).

      *Wait, one nuance:* The prompt asks: "note on whether it remains available to someone who accepts the order- and framing-sensitivity of intuitive response."
      If a claim says "Tastes are stable," and we know intuitions are framing-sensitive (unstable), then that claim is *not* available.
      If a claim says "Tastes have no truth value," and we know intuitions are framing-sensitive, is it available? Yes, one could argue framing sensitivity proves they *aren't* tracking truth, so they are tastes. So it is available, but it supports the colleague's view.
      I need to be careful here. "Available" means "Can one consistently hold this claim *and* accept the framing data?"
      Actually, the prompt asks if it remains available to someone who accepts the sensitivity.
      If the claim is "Tastes are insensitive to framing," then accepting framing sensitivity makes the claim *false*, so it's not available.
      If the claim is "Tastes cannot be mistaken," accepting framing sensitivity might support this (by showing they are unreliable) or undermine it (by showing they are malleable).
      Let's interpret "available" as "consistent with the empirical findings discussed in class."

      *Re-evaluating Item 5 (Rational Insensitivity):* If intuitions change based on framing, they are sensitive to *something*. If the claim is "Tastes are not responsive to *reason*," framing data is compatible (framing isn't reason). So it remains available.
      *Re-evaluating Item 4 (No Truth Conditions):* Compatible. One can accept framing sensitivity and say "See? No truth, just vibes."

      *Okay, let's finalize the list.*

      *   1. Causal Opacity (Trivial, Compatible)
      *   2. Persuasion Resistance (Defensible, Compatible)
      *   3. Conversational Closer (Speech Act, Fails as Premise)
      *   4. Normative Immunity (Contentious, Compatible but Question-Begging)
      *   5. Rational Incorrigibility (False/Contentious, Compatible)
      *   6. Universal Subjectivism (False, Compatible)

