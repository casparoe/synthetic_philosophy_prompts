  # Seminar Handout: De Gustibus Non Est Disputandum
  **Topic:** The Epistemic Standing of Moral Intuitions
  **Date:** [Next Week's Date]

  ### I. Inventory of Claims
  *Distinct readings of the proverb "There is no accounting for tastes," arranged from platitudinous to ambitious.*

  **1. The Causal Opacity Claim**
  *   **Formulation:** Individuals often cannot articulate the causal origins of their own affective responses.
  *   **Verdict:** Trivially True.
  *   **Compatibility:** Remains available; framing effects explain *why* this opacity occurs without denying the existence of a truth-tracking mechanism.

  **2. The Persuasion Resistance Claim**
  *   **Formulation:** Rational argument frequently fails to alter a subject's fundamental affective dispositions.
  *   **Verdict:** Substantive and Defensible.
  *   **Compatibility:** Remains available; the difficulty of persuasion does not entail the impossibility of correctness.

  **3. The Conversational Closer Reading**
  *   **Formulation:** This utterance functions not as a proposition but as a speech act signaling that further discussion is pragmatically pointless.
  *   **Verdict:** N/A (Speech Act).
  *   **Compatibility:** Available as a move, but if pressed into service as a *premise*, it commits the fallacy of ending inquiry by fiat rather than argument.

  **4. The Normative Immunity Claim**
  *   **Formulation:** Affective responses of this kind lack truth conditions and therefore cannot be correctly or incorrectly held.
  *   **Verdict:** Contentious (depends on metaethical commitments).
  *   **Compatibility:** Remains available, but accepting it presupposes the non-cognitivism the seminar is tasked with investigating.

  **5. The Rational Incorrigibility Claim**
  *   **Formulation:** Affective responses are constitutively insensitive to reasons, evidence, or logical coherence.
  *   **Verdict:** False (psychologically).
  *   **Compatibility:** Unavailable; the order- and framing-sensitivity discussed in class demonstrates that these responses *are* sensitive to input, even if that input is normatively irrelevant.

  **6. The Universal Subjectivist Claim**
  *   **Formulation:** All pro-attitudes, including moral judgments, belong to the same metaphysical category as preferences for food or color.
  *   **Verdict:** False (category error) or Deeply Contentious.
  *   **Compatibility:** Remains available only if one ignores the structural differences between sensory preferences and normative judgments.

  ***

  ### II. Analysis of the Colleague's Objection

  **1. The Required Reading**
  To establish that the seminar's inquiry is *misguided* (rather than merely difficult), your colleague must rely on **Claim 4 (Normative Immunity)** or **Claim 6 (Universal Subjectivism)**. Mere causal opacity (Claim 1) or persuasion resistance (Claim 2) would suggest the inquiry is hard, not that it is conceptually impossible.

  **2. Does It Deliver the Conclusion?**
  No. Asserting that moral intuitions are "tastes" in the sense of Claim 4 does not prove they lack truth conditions; it merely *labels* them as such. This is a classic case of **covert classificatory work**: the colleague uses the word "taste" to smuggle in the conclusion that these attitudes are non-cognitive, thereby begging the question against the realist position the seminar is exploring.

  **3. The Restricted Version**
  A version of the proverb that is both true and compatible with the seminar's continuing is:
  > *"There is no accounting for **brute sensory** tastes."*

  **Restriction:** This limits the scope of the proverb to preferences that are explicitly acknowledged as non-cognitive (e.g., liking cilantro), thereby leaving open the possibility that moral intuitions belong to a different class of attitudes that *do* admit of epistemic evaluation.
