      *   Explain conceptual cost? Yes.

      *Self-Correction on (4) vs (5):* Is there a deeper issue? If I scan a destroyed work, do I inherit the *artistic* value or just the *aesthetic* value? (4) says "derivative but genuine artistic value." (5) says artist mental states aren't necessary. This actually helps (4). If mental states aren't necessary, the physical trace (captured by scan) is sufficient for value inheritance. So (5) actually *supports* (4) rather than conflicting. I should highlight this synergy.

      *Self-Correction on (1) vs (2):* This is the big one. If authenticity is non-instrumentally valuable (1), then the forgery *lacks* that value. (2) says they share identical *aesthetic* value. The conflict vanishes if "Value" in (1) $\neq$ "Aesthetic Value" in (2). I need to press the user to make this terminological distinction explicit.

