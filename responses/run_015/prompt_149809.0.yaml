          4.  (3)/(2) Tension (Temporal - easily dissolved)
      *   *Revision:* Refine (2) to specify "Aesthetic" vs "Artistic/All-things-considered" value.
      *   *Cost:* Commitment to Value Pluralism.

  9.  **Final Review against constraints:**
      *   Rank tensions by severity? Yes.
