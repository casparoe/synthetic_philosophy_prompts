answer: |-
  You have identified two distinct but deeply connected philosophical concepts. They are not just colloquial observations; they are the core framework of a specific branch of social epistemology (the study of how knowledge works in social contexts).

  The umbrella term for both is **Epistemic Injustice**.

  This framework was largely codified by the philosopher Miranda Fricker in her 2007 book *Epistemic Injustice: Power and the Ethics of Knowing*. She argues that both phenomena you described are harms done to a person specifically in their capacity as a "knower."

  Here is how to carve them apart, the specific terms for each, and how to navigate the edges you asked about.

  ### 1. The Credibility Deficit: Testimonial Injustice

  The first phenomenon you described—where a speaker is given less credibility than they deserve due to identity prejudice—is called **Testimonial Injustice**.

  *   **The Mechanism:** A listener hears a speaker. The listener possesses a "credibility economy" (a subconscious sense of how trustworthy people are). If the listener holds a prejudice against the speaker's social identity (gender, race, age, accent), they apply a "credibility deficit."
  *   **The Harm:** The speaker is wronged *as a knower*. Their word is treated as less valuable than it objectively is.
  *   **The Key Distinction:** You asked if this applies if someone isn't believed because they are "bad at explaining themselves." **That is not Testimonial Injustice.**
      *   If I don't believe you because you are contradicting yourself, mumbling, or lack evidence, that is a rational assessment of the *testimony*.
      *   If I don't believe you because you are a woman/young/working-class, *despite* your testimony being clear and reliable, that is Testimonial Injustice. The deficit must be caused by **identity prejudice**, not by the quality of the evidence or delivery.

  ### 2. The Conceptual Gap: Hermeneutical Injustice

  The second phenomenon—the harm caused by the lack of a shared concept to understand an experience—is called **Hermeneutical Injustice**.

  *   **The Mechanism:** "Hermeneutics" refers to interpretation. This injustice occurs when there is a gap in our shared tools for understanding the world (our "collective hermeneutical resource"). Because of this gap, a person cannot make sense of their own experience, nor can they communicate it to others.
  *   **The Harm:** The experiencer is marginalized twice. First, they suffer the experience itself. Second, they are rendered unintelligible because the language to describe it hasn't been created or accepted yet.
  *   **The Classic Example:** Fricker uses the term "sexual harassment." Before the 1970s, women experienced this behavior, but they lacked the concept to categorize it as a systemic political/legal issue rather than a personal failing or "just how men are." They suffered a hermeneutical injustice. Once the term existed, the experience became intelligible.
  *   **The Key Distinction:** You asked if this applies if a concept exists but your community "doesn't have access to it."
      *   **Strict Definition:** In Fricker's original formulation, the concept must be missing from the *collective* resource. If the concept exists in the wider world but is withheld from you, it is slightly different.
      *   **Expanded Definition:** Later philosophers (like José Medina and Gaile Pohlhaus) expanded this to include **Willful Hermeneutical Ignorance**. This is when the dominant group *has* the concepts but refuses to apply them to the marginalized group's experience. (e.g., "I know what 'racism' is, but I refuse to accept that what happened to you fits that definition.") This bridges the gap between your two phenomena.

  ### Are They Two Sides of One Coin?

  They are distinct categories under the same umbrella, but they frequently cause one another.

  1.  **Hermeneutical leads to Testimonial:** If you cannot name your experience (Hermeneutical Injustice), you will likely struggle to explain it clearly in a meeting or court. Because you struggle to explain it, others will view you as less credible (Testimonial Injustice). The lack of words makes you look unreliable.
  2.  **Testimonial leads to Hermeneutical:** If a group is consistently silenced or not taken seriously (Testimonial Injustice), their insights never enter the "collective resource." Therefore, the concepts that would describe their lives never get created or adopted (Hermeneutical Injustice).

  ### How to Carve the Edges

  You asked specifically about where the boundaries lie. Here is a diagnostic guide based on the philosophical literature:

  **Scenario A: The "Bad Explainer"**
  *   *Situation:* A person is not believed because they are inarticulate or confused.
  *   *Verdict:* **Not Epistemic Injustice.** This is a communicative failure, not an ethical/epistemic wrong.
  *   *Caveat:* Ask *why* they are inarticulate. Are they inarticulate because they lack the concepts for their experience (Hermeneutical Injustice)? If so, the root cause is still injustice, even if the surface cause is "bad explaining."

  **Scenario B: The "Ignorant Audience"**
  *   *Situation:* A concept exists (e.g., "microaggression"), but the audience refuses to use it to interpret the speaker's experience.
  *   *Verdict:* **Willful Hermeneutical Ignorance.** This is an active refusal to utilize available tools to understand a marginalized person. It is distinct from Hermeneutical Injustice (where the tool doesn't exist) but produces the same result (unintelligibility).

  **Scenario C: The "Credibility Discount"**
  *   *Situation:* A person is ignored until a higher-status person repeats them.
  *   *Verdict:* **Testimonial Injustice.**
  *   *Caveat:* This is sometimes colloquially called "Hepeating," but that is a slang term for the specific gendered manifestation of Testimonial Injustice.

  ### Why the Distinction Matters

  Distinguishing these matters because the remedies are different.

  *   **To fix Testimonial Injustice:** You need **credibility correction**. Listeners must actively monitor their own biases and consciously inflate the credibility they give to marginalized speakers to counteract the prejudice deficit.
  *   **To fix Hermeneutical Injustice:** You need **conceptual innovation**. You need to create new language, metaphors, and categories (like "gaslighting," "imposter syndrome," or "sexual harassment") and fight to get them into the public lexicon.

  You have effectively identified the two main ways power distorts knowledge: by silencing the speaker (Testimonial) and by blinding the culture to the experience (Hermeneutical). Having the terms allows you to diagnose which lever needs to be pulled to fix the problem.
