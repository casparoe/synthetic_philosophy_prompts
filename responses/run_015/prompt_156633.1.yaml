      *   *Can the distinction between argument-driven and interest-driven change show up in a classroom game?* This is harder. Students are philosophy students; they love to argue. If they start debating the rules, it becomes argument-driven. The game needs to force a *behavioral* shift without explicit deliberation on the *morality* of the shift. The shift must feel like a collapse of viability, not a victory of reason. This is achievable if the mechanics punish adherence strictly enough that abandonment feels like survival, not moral enlightenment.
      *   *Conclusion:* The premise is workable but risky. I need to be honest about the limitations in the text. I will proceed with the design but include the requested frankness about limitations and potential failures within the continuous prose.

  3.  **Drafting the Content - Section by Section (mental outline for flow):**
