answer: |-
  Dear Colleague,

  I am writing to outline a simulation design that meets your specific pedagogical constraints and theoretical aims, though I must begin by addressing the conceptual tension you have identified in your request. Framing Bernard Williams's notion of moral incapacity as a collective strategic withdrawal is theoretically provocative because Williams insists that moral incapacity is an internal limit of identity, something like I cannot do this because it would not be me, whereas your honor-market inversion treats it as an external limit of viability, akin to I cannot do this because it would ruin me. This is not incoherent, but it is a sociological repurposing of a psychological concept, and you should be aware that the simulation will demonstrate the collapse of a practice through economic exhaustion rather than through the phenomenological experience of moral revulsion. The game will successfully show how a norm becomes unsustainable when the cost of recognition exceeds the benefit of status, but it will not reproduce the inner feeling that the practice has become morally unthinkable, only that it has become socially unaffordable. You will need to supply the bridge between unaffordability and moral illegitimacy during the debrief, as the mechanics alone cannot generate the moral quality of the revolution, only the structural collapse that precedes it. With that caveat firmly in mind, the following design, which I call The Protocol, is structured to run for ninety minutes with fourteen students, requiring no prior reading and revealing the theoretical framework only at the conclusion.

  To begin the session, you will need to prepare fourteen identical envelopes, each containing a starting stake of twenty poker chips or similar tokens, which serve as the sole currency of honor in the simulation, along with a deck of standard playing cards and a large visible ledger on the board to track the collective status of the group. You should arrange the room in a circle to emphasize the closed nature of the honor world and instruct the students that they are members of a closed elite order where social survival depends entirely on the accumulation and defense of honor tokens, without mentioning morality, philosophy, or the historical analogues of dueling or slavery. The rules of The Protocol are simple and must be read aloud as immutable laws of this specific society. First, every student begins with equal standing represented by their twenty tokens. Second, any student may issue a Challenge at any time by drawing a card and placing it face up before another student. Third, the challenged student must either Accept or Decline. If they Accept, both parties must pay a Fee of one token to the bank, and the challenger wins the pot if their card is higher, while the challenged wins if their card is higher or equal, creating a zero-sum transfer of tokens between players plus the fee paid to the bank. Fourth, if a student Declines a Challenge, they pay no fee, but they suffer a Loss of Standing, which is enforced by the group. Specifically, if a student Declines, any other student may immediately sanction them by paying one token to the bank to strip the decliner of two tokens, modeling the social cost of cowardice. Fifth, the game ends for any individual who reaches zero tokens, representing social death, and the goal for every participant is to remain in the game with the highest possible token count at the end of the session. You should emphasize that there are no moral rules, only the rules of The Protocol, and that their only objective is survival and status accumulation within these constraints.

  The simulation proceeds in three distinct phases which you will control by announcing shifts in the economic conditions of the honor world, though you will not explain the theoretical reason for these shifts. For the first twenty minutes, run Phase One as described above with the Acceptance Fee set at one token. This establishes the honor world where the cost of maintaining status is low and the ritual of confrontation is viable. Students will likely engage enthusiastically, issuing challenges to accumulate tokens and accepting challenges to avoid the sanction of declining, thereby reinforcing the norm that honor must be defended. You should participate minimally, perhaps acting as a recorder of transactions, to ensure the flow of tokens is visible. At the twenty-minute mark, announce Phase Two without stopping the game. State that due to external pressures, perhaps a war or economic contraction, the cost of maintaining honor has risen. Change the rule so that the Acceptance Fee is now five tokens per duel, while the sanction for Declining remains the same, where any observer can pay one token to strip two from the decliner. This is the honor-market inversion point. Suddenly, accepting a challenge costs five tokens to potentially win a few, while declining risks only a small sanction if anyone bothers to enforce it. Rational self-interest now dictates that students should stop accepting challenges, but the honor code demands they accept. You will observe a tension where students hesitate to accept because it is ruinous, yet fear declining because of the sanction.

  As Phase Two progresses over the next thirty minutes, you will likely see the frequency of challenges drop, or you will see students accepting challenges and rapidly going bankrupt. This is the intended friction. To accelerate the collapse, at the fifty-minute mark, introduce Phase Three by announcing that the group is exhausted. Change the sanction rule so that enforcing a decline now costs the enforcer two tokens to strip one from the decliner. This makes policing the honor code expensive for the witnesses. At this stage, the cost of defending honor is high for the challenged, and the cost of punishing cowardice is high for the witnesses. You should watch for the moment when students stop issuing challenges because they realize no one will accept them, and they stop sanctioning declines because it is too expensive to care. This is the collective strategic withdrawal. The game effectively ends when no more transactions occur because the recognition economy has collapsed. Do not stop the game yourself; let it stall into silence. When the room goes quiet and no one is willing to spend tokens to uphold the protocol, call time. This should leave you with about fifteen minutes for the debrief, which is the most critical component for mapping their experience onto the theoretical lens.

  In the debrief, you must guide them from their experience of economic exhaustion to the concept of moral revolution without lecturing. Start by asking why they stopped playing. They will likely say it was too expensive or pointless. Press them on whether anyone convinced them that challenging was wrong. They will say no. Use this to introduce the concept of the honor world, explaining that in the first phase, they were inside an Appiah-style honor code where status was maintained through ritualized risk. Then explain the interest shift, where the external costs made the ritual unsustainable. Connect their decision to stop accepting challenges to the honor-market inversion, showing that their moral incapacity to continue the practice was actually a strategic withdrawal of recognition. When they stopped sanctioning declines, they withdrew the social reality that made the honor code exist. Explain that this mirrors the collapse of dueling or slavery, where practices often end not because everyone suddenly reads a philosophy book and agrees they are wrong, but because the social and economic cost of maintaining the recognition of those practices becomes too high for the elite to sustain. You can then introduce Williams's idea of moral incapacity, noting that while Williams sees it as an internal identity limit, this simulation frames it as a collective external limit, suggesting that what feels like I cannot do this is often actually We will no longer recognize this. Finally, address the post-hoc rationalization, asking them if, now that the game is over, they feel the practice was silly or wrong. They will likely agree, illustrating how moral arguments often follow the structural collapse rather than causing it.

  You should be prepared for several predictable failures in the first run. The most common issue is that students will treat the game as a puzzle to be solved rather than a social world to be inhabited, leading them to meta-game by agreeing verbally to stop challenging without actually withdrawing recognition. To handle this, you must forbid verbal collusion. Remind them that in this society, there is no democracy to change the rules, only individual strategic action. If they try to vote to change the fees, deny them the authority, reinforcing that moral revolutions are not legislated but emerge from individual withdrawals of participation. Another risk is that students may feel cheated by the mid-game rule change, viewing it as an arbitrary instructor intervention rather than a structural shift. You must frame the rule change as an environmental shock, like a war or market crash, that happens to the society, not a change you are making to the game mechanics for fairness. If they disengage due to frustration, acknowledge the frustration as part of the experience of living through a moral revolution where the ground shifts beneath you. A third risk is that the sanction mechanism in Phase One might be too weak, allowing students to decline without consequence, which prevents the honor code from establishing itself firmly enough to collapse later. If you see this, intervene early to enforce a sanction yourself to show that the cost of declining is real, ensuring the later withdrawal of that sanction carries weight.

  There are fundamental limitations to this setup that you must supply yourself because the classroom cannot reproduce them. The simulation cannot reproduce the deep emotional weight of real moral incapacity, where a person feels they would lose their soul rather than their tokens. The students will feel financial loss, not moral guilt. You will need to articulate in the debrief that in history, the token cost is often mixed with psychological identity, so that the strategic withdrawal eventually feels like a moral revelation. Additionally, the simulation compresses a historical process that takes generations into ninety minutes, which risks making the collapse seem inevitable rather than contingent. You must emphasize that in reality, many honor worlds persist despite high costs due to ideology or coercion, and the inversion is not guaranteed. The game also cannot reproduce the violence of actual dueling or slavery, sanitizing the harm into token exchanges. You should acknowledge this sanitization explicitly, noting that the real cost of these practices was human suffering, not just status points, and that the strategic withdrawal often came only when the suffering threatened the stability of the elite themselves. Finally, the distinction between argument-driven and interest-driven change is difficult to isolate completely because students are philosophy students who will naturally argue about the rules. You must be vigilant in separating their theoretical discussion from their gameplay, insisting that during the simulation, only actions count, not arguments, to preserve the integrity of the strategic withdrawal model.

  Despite these limitations, this design should achieve your goal of making students feel the force of the honor-market inversion from the inside. By forcing them to inhabit a system where the cost of virtue becomes the cost of ruin, you create a visceral experience of why practices collapse when they cease to function as viable status goods. The silence at the end of the game, where no one is willing to spend a token to uphold the norm, is the tangible evidence of the collective withdrawal of recognition. If you manage the debrief carefully, linking their economic hesitation to the sociological mechanism of moral change, they will leave with a concrete understanding of how moral incapacity can operate as a strategic social phenomenon rather than merely an individual psychological block. I hope this design serves your seminar well, and I wish you success in navigating the inevitable complexities that arise when fourteen philosophers are given tokens and told to defend their honor.

  Sincerely,

  A Colleague
