      Your intuition that the group is talking past one another is well-founded and mirrors a significant chunk of the contemporary literature on this topic. The stalemate you are experiencing is not merely a failure of imagination but stems from a cluster of ambiguities that allow both sides to claim victory depending on which parameter they fixate on. At its core, this is a mixed verbal and substantive disagreement disguised as a single question about what to believe. The verbal component lies precisely where you suspected: in the operational definition of epistemic peerhood. If a peer is defined strictly as someone equally likely to be correct given the evidence, then discovering disagreement logically entails that at least one of you is mistaken, which pushes strongly toward conciliationism unless you have a non-question-begging reason to prefer your own reasoning. However, if peerhood is defined by external markers like institutional role or past track record, steadfastness becomes viable because those markers do not guarantee equal likelihood of correctness in the specific instance. Your group is likely sliding between these definitions without noticing, allowing steadfastists to appeal to private reasons (bias, missed studies) that technically disqualify the other as a peer in the strict sense, while conciliationists insist on the strict sense where such reasons are unavailable.

