prompt: |-
  I'm retired now — used to do atmospheric chemistry, lots of time series, error budgets, that sort of thing — and a couple of years ago I joined a philosophy reading group at the local library. Last month someone dragged us into the historical Jesus, specifically the criteria of authenticity, and I came away annoyed enough to write about 1100 words. I'd like your comments on it before I inflict it on the group.

  Quick ground rule: please don't send me reading lists, bibliographies, or citations — I can't chase references and I've already got more books on this than I'll ever finish. Just argue with me.

  Here's roughly what I wrote.

  ***

  The criteria of authenticity (multiple attestation, dissimilarity, embarrassment, coherence, and the general appeal to Aramaic or Palestinian plausibility) are usually presented as filters: run a saying through them and what survives is what the historical Jesus probably said. I want to claim something weaker and, I think, more damaging: they aren't filters at all, they're likelihood ratios, and once you see that, three things follow that their defenders don't usually say out loud.

  First: combining them is where the trouble starts. If each criterion is a likelihood ratio, then multiplying them together — which is what people are doing when they say a pericope is "very strong" because it's attested twice, embarassing, and Semitic in flavour — assumes the criteria are independent. In my old field we spent most of our time worrying about correlated errors: two instruments that look independent but share a calibration, a power supply, or an operator. Multiple attestation has exactly this structure. If two of our sources share a written source, or a stream of oral tradition, or simply a shared idea of what a teacher of that kind would say, they are not two measurements, they're one measurement with extra steps. And the awkward cases are the interesting ones: the material that looks doubly attested is often precisely the material that circulated most freely, which means circulation, not authenticity, may be what's being measured.

  Second, and this is the bit I like: the criterion of dissimilarity is self-emptying. It says, in effect, keep what doesn't fit first-century Judaism and doesn't fit the early church either. But the size of its output depends on how well we know those two reference classes. When the Qumran scrolls turned up and the Jewish reference class got much richer and weirder, a lot of things that had looked "without parallel" stopped looking so. So the criterion's yield is inversely proportional to our ignorance of the context. That is a hell of a property for a discovery procedure: it means the Jesus it returns is partly an artifact of how much we don't know, and the artifact shrinks as we learn more. Its not a portrait, its a residue — the criterion is a difference-detector, and difference-detectors return what's left over, not what was there.

  Third — I call this "the coherence ratchet", and I'm not sure its a real problem or just what inference looks like when you describe it unkindly. Embarrassment and dissimilarity are trimming criteria: they cut in the direction away from what the later church would have wanted. Coherence then re-admits material because it fits whatever survived the trimming. But the survivor set has already been shaped by a directional cut, so coherence is now amplifying a biased template. Subtract in one direction, re-add on the basis of what's left, and nobody is tracking the order of operations or the net bias. Anybody who's watched a meta-analysis inflate its own effect size by pruning outliers and then recalculating the variance from the pruned set will recognise the shape of this.

  So what do I want to do with the criteria? Not scrap them. Demote them, from a discovery procedure to a sensitivity analysis. Concretely: for each pericope, score it on each criterion, then do what we used to call a leave-one-out — drop each criterion in turn and see whether the verdict flips. Report the flip rate rather than the verdict. And pre-commit, before the scoring, to what would have counted as disqualifying evidence, because otherwise you can always re-weight after the fact. The output of the whole exercise shouldn't be a list of authentic sayings; it should be a map of which conclusions depend on which commitments. If the map turns out to be flat — if nothing much depends on anything — that's a finding too, and probably the honest one.

  Which leaves the question the group actually asked: can criteria of authenticity ever settle who he was? I think no, and not because the evidence is thin, but because the instruments are directional. You cannot manufacture signal by filtering, you can only lose it, and a battery of directional filters will reliably return the shape of the filters.

  ***

  What I want from you:

  - Take the self-emptying argument apart. Where is the weakest step? My worry is that someone will say the reference-class point cuts both ways: new evidence can also make a saying look *more* dissimilar, so maybe I've only shown the criterion is unstable, not that it's biased. Is that a real reply?
  - The coherence ratchet: genuine defect, or am I just redescribing ordinary coherentist inference in a way that makes it sound pathological? If it is just that, what would have to be true for it to be a real problem?
  - Is the leave-one-out proposal even coherent here? The worry I can't shake is that in my old work the data and the instruments were separate, whereas here the "data" are the same handful of texts the criteria were abstracted from, so maybe I'm proposing to jackknife a set of measurements that were never independent of the thing being measured.
  - Anything I've got flat wrong about how these criteria are actually used in practice — including if I've described one of them wrong, or left out a criterion that would break my argument.
  - Brutally: is any of this interesting to someone who does this for a living, or is it a retired chemist rediscovering something everyone decided in the 1980s? If it's the latter, tell me what the strongest version of the standard reply is, so I can decide whether to bother.

  Oh — the scare-quoted labels ("the coherence ratchet", "self-emptying", "difference-detector") are my own coinages, not terms of art, so feel free to tell me if they're doing more work than they deserve.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired atmospheric chemist, experienced with time series, error budgets, statistical analysis. Joined a philosophy reading group. Wrote an 1100-word critique of the "Criteria of Authenticity" in Historical Jesus (HJ) studies.
      *   **Constraint:** *No reading lists, bibliographies, or citations.* Just argue. (This is crucial. I must not say "Read Chris Keith" or "See Le Donne".)
      *   **Task:** Critique the provided text based on five specific bullet points.
      *   **Tone:** Intellectual, rigorous, respectful of the user's background (science/stats), but willing to push back ("Brutally").
      *   **Key Arguments in User's Text:**
          1.  Criteria are likelihood ratios, not filters.
          2.  Independence assumption is false (correlated errors in multiple attestation).
          3.  Dissimilarity is self-emptying (yield inversely proportional to ignorance of context).
          4.  Coherence is a ratchet (amplifies bias from trimming criteria).
          5.  Proposal: Demote to sensitivity analysis (leave-one-out), map dependency, not verdicts.
          6.  Conclusion: Criteria cannot settle who Jesus was because instruments are directional.

  2.  **Address Bullet 1: The Self-Emptying Argument (Dissimilarity):**
      *   *User's Worry:* Someone might say new evidence can make a saying look *more* dissimilar, so it's just unstable, not biased.
      *   *Analysis:* The user argues the criterion yields a "residue" of ignorance. As knowledge of 1st-century Judaism grows (e.g., Dead Sea Scrolls), things that looked unique (dissimilar) look typical. Therefore, the criterion shrinks the authentic corpus as knowledge grows.
      *   *Counter-argument:* The "cuts both ways" reply is weak but not nonexistent. New evidence *could* theoretically isolate Jesus further (e.g., if we found a text showing *everyone* believed X, and Jesus said not-X). But historically, the trend has been overwhelmingly toward *more* overlap (Jesus as a Jew).
      *   *Weakest Step:* The assumption that the "reference class" of Early Christianity is static or known well enough to judge dissimilarity from *it*. The criterion requires knowing what the Early Church *would not* invent. But the Early Church is diverse. If a saying fits *one* faction but not another, is it dissimilar?
      *   *Verdict:* The "instability vs. bias" reply is a dodge. The structural bias is real because the null hypothesis is "Jesus was unique," which is historically improbable for a religious teacher. The weakest step is assuming we can define the "Early Church" belief set clearly enough to measure deviation from it.

  3.  **Address Bullet 2: The Coherence Ratchet:**
      *   *User's Question:* Is this a genuine defect or just coherentist inference?
      *   *Analysis:* Coherentism is standard in historiography (inference to the best explanation). The "ratchet" implies a directional bias accumulation.
      *   *Distinction:* Normal coherentism is iterative and corrective (A fits B, B fits C, but if D contradicts A, we re-evaluate A). The "Ratchet" implies *subtractive* selection followed by *additive* confirmation without re-evaluating the subtraction.
      *   *Condition for Real Problem:* It becomes pathological if the "core" established by dissimilarity/embarrassment is treated as *certain* rather than *probable* when testing coherence. If the seed set is small and biased (e.g., only apocalyptic sayings), coherence will only find more apocalyptic sayings, excluding wisdom sayings that might be authentic but don't "cohere" with the biased seed.
      *   *Verdict:* It's a real problem *if* practitioners treat the trimmed set as a fixed foundation rather than a probabilistic hypothesis. Your description is unkind but accurate regarding *how* it's often misused, not necessarily how it *must* be used.

  4.  **Address Bullet 3: Leave-One-Out (Jackknifing) Proposal:**
      *   *User's Worry:* Data and instruments aren't separate. Texts are the data *and* the source of the criteria.
      *   *Analysis:* In atmospheric chem, you have an instrument measuring an external atmosphere. In HJ studies, the "instrument" (criteria) is derived from the "data" (texts) which are the only access to the "phenomenon" (Jesus).
      *   *Problem:* Jackknifing assumes the samples are representative and the model is stable. Here, the "model" (the criteria) is hermeneutical, not physical. Dropping "embarrassment" doesn't change the text, it changes the *interpretive lens*.
      *   *Coherence:* It is coherent as a *heuristic* for humility, but not as a statistical validation. You can't calculate a "flip rate" statistically because the scoring isn't quantitative. It's qualitative weighting.
      *   *Verdict:* It's methodologically sound as a *rhetorical* device to show fragility, but it fails as a statistical procedure because the inputs aren't independent variables. You're jackknifing *interpretations*, not data points.

  5.  **Address Bullet 4: Practice and Missing Criteria:**
      *   *User's Question:* Did I get the usage wrong?
      *   *Analysis:* The "Criteria of Authenticity" are largely out of fashion in current specialist HJ scholarship (post-2010s). The "Third Quest" relied on them; the "Memory Approach" (social memory theory) largely abandoned them.
      *   *Missing Nuance:* Scholars rarely use them as a strict algorithm (filter). They use them as "indicators." Your critique attacks a straw man of *naive* usage, but captures the *effective* usage in popular/older scholarship.
      *   *Criterion Check:* You missed "Historical Plausibility" (often distinct from Coherence) and "Fruitfulness/Effect" (does this explain the later movement?). "Fruitfulness" might break your argument because it looks forward (effect on history) rather than backward (source criticism).
      *   *Verdict:* You describe the "Old Quest/Third Quest" mechanistic usage accurately. You miss the shift toward "Memory Theory" which bypasses the authenticity question entirely (asking instead how Jesus was remembered).

  6.  **Address Bullet 5: Is this interesting or old news? (The Brutal Truth):**
      *   *User's Question:* Am I rediscovering the 1980s?
      *   *Analysis:* Chris Keith, Anthony Le Donne, and others (Memory Approach) have hammered the Criteria since ~2009 (*Jesus, Criteria, and the Demise of Authenticity*). The statistical/independence critique is less common, but the "dissimilarity is biased" point is standard fare now.
      *   *Verdict:* It is largely old news in *specialist* circles, but your *framing* (likelihood ratios, error budgets, correlated errors) is fresh and potentially very useful for a philosophy group that might not know the specialist debates. You are bringing a systems-engineering critique to a humanities problem.
      *   *Advice:* Don't present this as a discovery; present it as an independent convergence from a different epistemological tradition (science/stats). That gives it weight.

  7.  **Drafting the Response:**
      *   *Tone:* Peer-to-peer. Acknowledge the strength of the analogy (atmospheric chem -> historiography).
      *   *Structure:* Follow the five bullet points exactly.
      *   *Constraint Check:* NO CITATIONS. (I must discuss the *ideas* of the Memory Approach without naming names or books).
      *   *Refining the "Self-Emptying" point:* Focus on the asymmetry. It's easier to find parallels (shrinking dissimilarity) than to prove uniqueness.
      *   *Refining the "Leave-One-Out":* Emphasize the qualitative vs. quantitative gap.
      *   *Refining the "Old News":* Be honest but encouraging. The *framing* is the value add.

  8.  **Final Polish:** Check against the "No Bibliography" rule. Ensure I'm arguing, not teaching. Make sure I validate the "likelihood ratio" insight (that's strong).

  *(Self-Correction during drafting)*: I need to be careful not to violate the "no citations" rule while explaining that specialists have moved on. I can say "Current specialist consensus" without naming the 2009 volume that killed the criteria. I need to make sure I don't sound condescending about the "old news" part. The user's statistical framing *is* novel even if the conclusion isn't.

  *(Final check on the "Self-Emptying" counter-argument)*: The user asked if "new evidence can make a saying look *more* dissimilar" is a real reply. I need to be clear: Theoretically yes, practically no. The direction of travel in historical knowledge is toward *contextualization*, which reduces apparent uniqueness.

  *(Final check on "Coherence Ratchet")*: I need to distinguish between "coherentism" (valid) and "circular confirmation" (invalid). The ratchet is circular confirmation disguised as coherence.

  Let's assemble.
answer: |-
  This is a sharp piece of writing. You have successfully translated a historiographical problem into the language of measurement theory, and for the most part, the translation holds. Your background in error budgets gives you a legitimate angle of attack that most philosophers lack; they worry about hermeneutics, you worry about signal-to-noise ratios.

  Here is the argument you asked for, point by point.

  ### 1. The Self-Emptying Argument (Dissimilarity)
  You ask if the reply "new evidence could make a saying look *more* dissimilar" is real. Theoretically, yes; practically, no.

  The weakness in your argument isn't the direction of the bias, but the assumption that "dissimilarity" is measuring *uniqueness* rather than *survival*. The criterion assumes that if a saying fits Judaism or the Early Church, it was likely *invented* to fit. But religious movements rarely invent material that contradicts their own core identity unless they are forced to (e.g., explaining a crucified messiah).

  The weakest step is your assumption that the "reference class" of the Early Church is stable enough to measure deviation against. The Early Church was not a monolith; it was a set of competing factions. A saying might be dissimilar to the Pauline faction but highly coherent with the Petrine faction. If the criterion treats "Early Church" as a single variable, it introduces a massive classification error.

  However, your core point stands: the criterion is structurally biased toward the idiosyncratic. In atmospheric chemistry, if you filter for "signals that do not match known background radiation," you will eventually filter out the sun. Jesus was a Jew preaching to Jews. A criterion that selects for "not Jewish" is selecting for "unrepresentative." The "instability" reply fails because the historical trend of evidence (e.g., Dead Sea Scrolls) has overwhelmingly expanded the "Jewish context" bucket, never shrunk it. The vector of discovery is one-way.

  ### 2. The Coherence Ratchet
  Is this a genuine defect or just coherentist inference? It is a genuine defect *if and only if* the seed set (the material that survived the trimming) is treated as *data* rather than *hypothesis*.

  In ordinary coherentist inference, A supports B, B supports C, but if C is contradicted by D, you must be willing to discard A. In the "Ratchet" scenario you describe, the material that passes Dissimilarity/Embarrassment is treated as the "Authentic Core." Coherence is then used to *expand* that core. The pathology arises because the expansion phase rarely loops back to test the stability of the Core.

  For this to be a real problem (and not just how inference works), two things must be true:
  1.  **Asymmetric Burden of Proof:** Material admitted via Coherence is given the same weight as material admitted via Dissimilarity, even though the latter had a higher bar.
  2.  **No Feedback Loop:** When new coherent material is added, the definition of the "Core" is not re-evaluated to see if it still holds.

  You are describing circular confirmation disguised as triangulation. If your group uses Coherence to *bolster* the findings of Dissimilarity without allowing Coherence to *undermine* them, it is a ratchet. If they allow Coherence to suggest the Dissimilarity criteria were too strict, it's just iteration. Your description suggests the former is the common practice.

  ### 3. The Leave-One-Out Proposal
  Is this coherent? Statistically, no. Hermeneutically, yes.

  In your old work, you could jackknife because the measurements were independent of the model. Here, the "measurements" (the texts) are the only access to the phenomenon, and the "model" (the criteria) is derived from the texts. You are jackknifing the *interpretive lens*, not the data.

  If you drop the "Embarrassment" criterion, the text of Mark doesn't change. The *probability assignment* changes. A statistical leave-one-out calculates variance in the *output* based on variance in the *input*. Here, the input is constant; the algorithm changes.

  However, as a heuristic for humility, it is excellent. It forces the historian to admit: "If I remove the assumption that the Church wouldn't invent a baptism by John, does this pericope still stand?" If the verdict flips, the conclusion is fragile.
  **The catch:** You cannot report a "flip rate" as a statistical probability. It is a qualitative sensitivity test. If you present it as a quantitative metric (e.g., "70% stability"), you commit the same error you accuse them of (quantifying the unquantifiable). If you present it as a map of dependency ("This conclusion relies entirely on the Embarrassment criterion"), it is methodologically sound.

  ### 4. Practice and Missing Criteria
  You have described the "Third Quest" usage (roughly 1980s–2000s) accurately. However, you should know that in specialist circles, the Criteria of Authenticity are largely considered dead.

  The missing criterion that might break your argument is **"Historical Plausibility"** (distinct from Coherence). Coherence asks: "Does this fit what we already think is true?" Plausibility asks: "Could this have *caused* what happened next?" It looks forward, not backward. It asks: "If Jesus didn't say this, how do we explain the movement that followed?"

  This escapes your "directional filter" critique because it isn't filtering for authenticity; it's filtering for *explanatory power*. It treats the sayings as hypotheses to explain the effect (Christianity), rather than artifacts to be purified.

  Also, you missed the shift toward **Social Memory Theory**. Current scholarship often bypasses "authenticity" entirely. It argues that the "remembered Jesus" is the only historical Jesus accessible to us, and the distinction between "what he said" and "what was remembered" is a false binary. If your group is up-to-date, they might agree with you that the Criteria are broken, but for different reasons (memory is constructive, not reproductive).

  ### 5. Is This Old News? (The Brutal Truth)
  You are rediscovering a consensus that solidified among specialists about 15 years ago. The critique that Dissimilarity creates a "strange Jesus" and that the Criteria assume a false positivism is now standard fare in academic Historical Jesus studies.

  **However,** that does not make your piece worthless.
  1.  **The Audience:** Your philosophy group is likely not reading specialist journals. They are probably operating with the "Third Quest" assumptions you describe. To them, this is new.
  2.  **The Framing:** While the *conclusion* is known, your *derivation* is not. Most critiques are philosophical (hermeneutics, memory theory). Yours is metrological (error propagation, independence, likelihood ratios). This is a fresh contribution. You are arguing that the Criteria fail not just because of hermeneutical circularity, but because they violate basic principles of signal processing.

  **Recommendation:**
  Do not present this as "I have discovered the Criteria are flawed." Present it as "I approached this as a measurement problem, and independently converged on the same limitations the specialists found, but for statistical reasons."

  Your "likelihood ratio" insight is the strongest part. Most historians treat the criteria as binary gates (Pass/Fail). Framing them as non-independent likelihood multipliers is a genuine contribution to how the argument should be structured, even if the verdict is already known.

  **One specific fix:**
  In your "Self-Emptying" section, clarify that the bias isn't just about ignorance of Judaism. It's about the **Base Rate Fallacy**. The criterion assumes the base rate of "unique sayings" is high. Historically, the base rate of "typical teacher sayings" is high. By filtering for the rare signal, you are filtering out the actual signal.

  **Verdict:**
  Inflict it on the group. It's rigorous, it respects the complexity, and it uses your specific expertise to cut through the fog. Just be prepared for the historian in the room to say, "We actually abandoned these criteria years ago," and be ready to reply, "Then why are you still using them to draw conclusions?"
