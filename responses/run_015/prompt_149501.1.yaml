answer: |-
  David and Ben stood at the curb, keys cold in their palms. The party heat clung to their coats. They had counted the beers—three each, spread over four hours. They had weighed the cab fare against the twenty-minute drive. The calculation was identical, performed in the same quiet shorthand they'd used since childhood.

  "You good?" David asked.

  "Good," Ben said.

  They walked to their cars, parked nose-to-tail. David unlocked the sedan; Ben unlocked the truck. Both checked the mirrors. Both adjusted the seats. Both engaged the engine with the same deliberate turn, listening for the catch. They pulled out onto the wet asphalt, tires humming the same note.

  David kept to the limit. Ben kept to the limit. David scanned the verge for movement; Ben scanned the verge for movement. The rain was a fine mist, invisible to the wipers.

  At the bend near the creek, a figure stepped from the tree line. Dark clothes. No reflectors. David's foot hit the brake. The ABS shuddered against his sole. The impact was a dull thud, barely audible over the engine.

  Ten miles further, Ben turned into his driveway. He killed the engine and sat for a moment, listening to the tick of cooling metal. He felt the clean satisfaction of a correct decision confirmed. He went inside to pour a glass of water.

  David stayed in the car. He did not turn off the engine. He watched the shape on the road settle into the gravel. He knew, before he opened the door, that the calculation had changed.

  ***

  **Audit**

  **1. The Versions and the Control Principle**
  *   **Version A (Bad Outcome):** As written above. David strikes a pedestrian.
  *   **Version B (Good Outcome):** Minimal change: At the bend near the creek, the road remained empty. David's foot hovered near the brake, then relaxed. He arrives home like Ben.
  *   **Control-Principle Verdict:** Identical. In both versions, the agents exercise identical care, possess identical information, and exhibit identical willingness to risk. There is no divergence in will or judgment.
  *   **Closing the Evidential Route:** The scene rigs the symmetry through rhythmic mirroring ("Both checked," "David scanned... Ben scanned"). By explicitly detailing the care *before* the divergence, the text prevents the reader from inferring that David's bad outcome evidences negligence. The reader sees the care was equal; the difference is purely exogenous.

  **2. The Residual Attitude**
  The attitude generated is not *character blame* (judging David as a worse person) nor *mere regret* (sadness about an accident). It is **retrospective accountability**. The reader feels David is now *indebted* in a way Ben is not. This is fitting rather than merely caused because moral agency is not solipsistic; it is a relationship with the world. When an agent's action ruptures the world (causes harm), that agent incurs a specific obligation to answer for and repair that rupture. The reader endorses this difference because a moral community must hold the person who *broke* something accountable, regardless of intent, to maintain the social fabric. The blame is the weight of that debt.

  **3. Diagnostics**
  *   **The Ordering Test:** If I withhold the chance mechanism (the scanning/care) until after the harm (e.g., starting the scene at the impact), the effect collapses. The reader would assume David failed to scan. Showing the care *up front* is essential to prove the control was identical *before* the luck intervened. This confirms the effect is not evidential (negligence) but constitutive (the luck altered the act's moral status).
  *   **The Swap Test:** If Ben hits the pedestrian and David goes home, the blame transfers entirely to Ben. The blame follows the outcome, not the identity. This proves the blame is not attached to the agent's intrinsic character (which hasn't changed) but to the specific causal history of the act. It confirms the effect is constitutive of the *completed action*, not evidential of the *agent*.

  **4. The Feature and The Attack**
  *   **Feature:** **Causal Completion.** The work is done by the fact that an action is not morally closed until it interacts with the world. The "gamble" is not the decision to drive, but the completion of the drive without harm.
  *   **Removal:** If you remove causal completion (treating the action as only the "trying"), the blame equalizes instantly. The effect vanishes.
  *   **The Attack:** The unsentimental reader (the Kantian) will argue: "You are punishing David for the universe's noise. Moral worth must be internal to the will. To blame him for the pedestrian's presence is superstition. You are asking the reader to indulge in irrationality, confusing tragedy with guilt."

  ***

  **Craft Question**

  **Close Third.**
  First person risks insulation or defensiveness. If David narrates, he will inevitably explain his care too thoroughly, sounding like he is building a legal defense, which pushes the reader away. If Ben narrates, he becomes a witness rather than a counterpart. Close third allows the reader to observe the symmetry objectively (seeing both men scan the road) while feeling the weight of the outcome without the filter of a narrator justifying it.

  **The Instinct to Avoid:**
  Your instinct to **over-clarify the symmetry**. If you explicitly state "They were equally careful" or "It was pure chance," the scene becomes a philosophical example rather than a lived experience. The reader will feel tricked because you told them how to feel rather than making them feel it. The symmetry must be embedded in the rhythm of the prose (the mirroring of actions), not the exposition. Let the reader discover the equality; if you stipulate it, they will resist it.
