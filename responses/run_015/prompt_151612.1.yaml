      *   *Mental Reservation specific:* Strict mental reservation (broad vs. strict) is definitely later. Augustine would likely view "I don't know" (when you do know, but mean "I don't know *to tell you*") as a lie because the intent is to deceive the listener. I need to be clear that the podcast is projecting later Catholic moral theology back onto Augustine.
