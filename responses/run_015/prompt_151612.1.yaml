prompt: |-
  I heard this summary of Augustine on lieing in a podcast: in De Mendacio he sorts lies into eight grades by harm and intent, and he thinks the lighter ones are basically okay if they stop something worse, like lieing to a murderer at the door. He also approves mental reservation—if you keep the true answer in your mind while saying something technically true but misleading, thats not really lying, so you can use it to save lives. In his later reply he criticizes people who lied outright to protect others from persecution, saying they should have used mental reservation instead. He also says lying breaks language because words are social contracts that have to match thoughts or communication collapses. Something feels off since I heard he was totally strict. Is this fair? Go part by part: whats accurate about the eight-grade idea and the language point, whats a common simplification, and what did Augustine actually deny about mental reservation and about lieing to save someone? And does the loophole here really fit his view?
