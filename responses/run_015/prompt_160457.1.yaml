answer: |-
  **MEMORANDUM**

  **TO:** Dining Procurement and Sustainability Committee
  **FROM:** [Your Name/Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Wholesale Protein Contract Renewal and Ethical Framework

  ### 1. Executive Summary and Recommendation

  We are convened to decide whether to renew our current beef-heavy wholesale contract or shift approximately two-thirds of that volume to chicken. The current proposal offers a significant reduction in reported greenhouse gas (GHG) emissions per kilogram of protein. However, student stakeholders have rightly compelled us to consider the trade-off in vertebrate mortality, specifically the balance between direct slaughter of domesticated animals and indirect mortality of wild field animals caused by crop cultivation.

  After reviewing the stipulated data regarding emissions, feed-conversion ratios, and land-use classifications, **I recommend we proceed with the shift to chicken, conditional upon a binding contractual covenant.** This covenant must direct 100% of the cost savings generated by the switch into a verified pre-harvest deterrence and set-aside program on the grain supplier's land.

  **Timeline:**
  *   **Vote:** Committee decision by November 15.
  *   **Contract Negotiation:** Legal and Procurement to draft mitigation covenant by December 1.
  *   **Implementation:** New protein mix effective Start of Spring Semester (January).

  ### 2. The Ethical Currency: Weighted Moral Cost per Calorie

  To vote responsibly, we must agree on the metric by which we rank these options. We cannot rank solely by **GHG Emissions**, as this ignores the moral weight of animal death. We cannot rank solely by **Head Count of Deaths**, as this equates a mouse with a steer, and a broiler chicken with a wild rabbit, ignoring differences in cognitive capacity and lifespan.

  I propose we adopt **Expected Moral Cost per Calorie** as our primary currency. This metric aggregates three components:
  1.  **Climate Harm:** The long-term suffering and displacement caused by carbon emissions (weighted as a global, intergenerational harm).
  2.  **Direct Slaughter:** The death of the protein source (weighted by the animal's neurological capacity for suffering).
  3.  **Collateral Mortality:** The death of wild animals in the supply chain (weighted by capacity and the inevitability of the harm).

  **Defense of Choice:**
  This currency respects the University's climate commitments without reducing animal welfare to a footnote. It acknowledges that while climate change is an existential threat that amplifies future suffering, our immediate procurement decisions cause immediate, tangible harm to sentient beings. By weighting capacity, we acknowledge that killing a steer is morally distinct from killing a mouse, but we do not treat the mouse as morally zero. This framework forces us to account for the *total* harm profile of the supply chain, not just the emissions report.

  ### 3. The Deterrence-and-Set-Aside Option

  The proposal to use cost savings to fund pre-harvest deterrence and unharvested strips on the grain supplier's land is not merely a mitigation strategy; it fundamentally alters the ethical calculus of the switch.

  **Does this undercut or complete the student group's case?**
  It **completes** their case. The student group argued that we must account for field deaths caused by crop cultivation. If we switch to chicken without mitigation, we accept higher direct slaughter to lower field deaths (due to chicken's better feed conversion). If we keep beef, we accept higher emissions and (per the students' data) higher field deaths due to beef's poor feed conversion.

  By funding deterrence, we sever the link between *purchasing* grain and *causing* field deaths. We are no longer choosing between "Beef Field Deaths" and "Chicken Field Deaths." We are choosing between "Beef Emissions + Beef Field Deaths" and "Chicken Emissions + Mitigated Field Deaths."

  This approach validates the students' premise that field animals matter enough to spend money on, while rejecting the conclusion that the only way to save them is to avoid crop-based supply chains. It allows us to lower emissions (via chicken) while actively managing the collateral harm of the grain required to feed them.

  ### 4. Sensitivity Analysis and Uncertainties

  Our recommendation rests on specific variables. We must be transparent about where the argument is fragile.

  **Most Sensitive Variables:**
  1.  **Efficacy of Deterrence:** If the deterrence and set-aside program reduces field mortality by less than 40%, the moral advantage of the switch diminishes significantly. We require third-party verification of these metrics in the contract.
  2.  **Cognitive Weighting Ratio:** How much we weight a domesticated chicken versus a wild vole. If the committee assigns near-equal weight to all vertebrate life, the massive increase in individual chicken deaths (from the switch) may outweigh the field savings. If we weight capacity heavily, the chicken switch is more defensible.
  3.  **Rotational Grazing Value:** The biodiversity office classifies the beef pasture as semi-natural habitat. If this land would revert to intensive monoculture if we drop the beef contract, the ecological cost of the switch is higher than our emissions model shows.

  **Uncertainties That Should Not Postpone Decision:**
  1.  **Exact Emission Differentials:** Whether the reduction is 40% or 50% does not change the direction of the climate benefit. We have sufficient data to know the direction is positive.
  2.  **Precise Field Mortality Counts:** We will never have an exact census of mice killed per hectare. We must act on the robust consensus that intensive cultivation causes significant wild mortality, without waiting for impossible precision.

  ### 5. The Strongest Case for the Rejected Option (Retaining Beef)

  To ensure our decision is robust, we must articulate the strongest version of the argument for retaining the beef contract.

  **The Integrity of Direct Causation:**
  The argument for keeping beef rests on the distinction between *killing* and *allowing to die*, and the integrity of the supply chain. When we buy a steer, we contract for the death of one specific animal. When we buy chicken and grain, we contract for the deaths of thousands of chickens plus an indeterminate number of wild animals. Even with mitigation, the chicken supply chain is inherently more violent in terms of individual body count.

  Furthermore, the rotational grazing stipulation is critical. If our beef supplier maintains marginal land as semi-natural habitat, our procurement is actively subsidizing a biodiversity haven. Switching to chicken shifts our economic support to industrial grain monocultures elsewhere. Even with set-aside strips, a monoculture with strips is ecologically inferior to semi-natural pasture. By keeping the beef, we support a land-use model that integrates food production with habitat, whereas the chicken model treats habitat as an offset to be purchased separately. Finally, contractual covenants for mitigation are historically fragile; budget cuts or supplier changes could void the deterrence funding, leaving us with the high death count of the chicken system and none of the promised protection for wild animals. The beef contract is a known quantity; the mitigation is a promise.

  ### 6. Conclusion

  We cannot optimize for a single variable without creating ethical blind spots. By adopting **Weighted Moral Cost** as our currency, we acknowledge that climate stability and animal welfare are not competing interests but intersecting obligations.

  The switch to chicken addresses the urgent imperative of emissions reduction. The binding mitigation covenant addresses the student group's valid concern regarding wild animal mortality. While the beef contract offers ecological benefits via rotational grazing, the global risk of carbon emissions and the opportunity to directly fund wild animal protection tips the balance toward the switch.

  I move we adopt the recommendation above.
