      *   **Proposal:** 0.75% earned income surcharge (dedicated fund) for Universal Pre-K (3 & 4yo), Free After-School/Summer (Elementary), Mental Health Clinicians (Middle School). Universal, not means-tested.
      *   **Key Decisions Needed (The "Four Things"):**
          1.  *Sequencing:* Bundle (Tax + Programs same time) vs. Benefits First (Use state grant for 3 years, vote later).
          2.  *Salience:* Invisible (folded into withholding) vs. Visible (separate line item).
          3.  *Statement:* Receipt only vs. Net (Paid - Received); All households vs. Users only.
          4.  *Scope:* City-only vs. County-wide (County Exec lukewarm, nearby suburb has no income tax, employers threatening to leave).
      *   **Context:** 2016 means-tested Pre-K failed badly. 2019 Library Levy passed narrowly (used annual reports).
      *   **Specific Requirements:**
          *   Recommend a course on all four.
          *   Include a timeline.
          *   Provide the strongest version of the *rejected* options (steel-manning).
          *   Address the specific anxiety: "Trust is an input, not an output" (legible taxes in low-trust cities cause evasion/backlash).
          *   Define measurable metrics for Years 1-3 to test the theory.
          *   Define an unwinding plan if it fails.
      *   **Tone:** Professional, persuasive, pragmatic, politically astute, suitable for a commission memo to a city council.

  2.  **Determine the Strategic Position (The "Recommendation"):**
      *   *Context:* Low trust (2016 failure), economic fragility (plant threatening to leave), nearby tax competition (suburb).
      *   *Goal:* Pass the measure in November, ensure sustainability, avoid backlash.
      *   *Decision 1 (Sequencing):* **Bundle.** Why? The 2016 failure suggests skepticism about spending. The 2019 Library success suggests transparency works *if* the link is clear. Waiting 3 years risks the grant disappearing or political winds changing. "Benefits first" looks like a bribe. Bundling creates a contract.
      *   *Decision 2 (Salience):* **Visible (Separate Line).** Why? The prompt mentions the Nordic model argument. Hiding it validates the "government is free" myth. Given the 2016 failure, transparency is crucial to rebuild trust. However, mitigate the "shock" by framing it clearly. *Correction/Refinement:* Actually, in a low-trust environment with mobile capital (employers shopping sites), visibility *is* risky. But the prompt specifically asks to address the "trust is an input" argument. The Library Levy passed *with* reporting. Hiding it undermines the "Universal" argument (everyone pays, everyone should know). Recommendation: **Visible**, but paired with aggressive communication.
      *   *Decision 3 (Statement):* **Net Value to All Households.** Why? The Library precedent (2019) worked because households saw value. If only users get it, it looks like welfare (which failed in 2016). If it shows only cost, it looks like a tax hike. Showing "Net Value" (Tax Paid vs. Service Value) reinforces the universal insurance model.
      *   *Decision 4 (Scope):* **City-Only (for now), with County Interlocal Agreement.** Why? County Exec is lukewarm. Chasing the County delays the November ballot (missed window). Employers shopping sites is a risk, but hospitals (anchor institutions) are less mobile. A city measure is faster. Can expand later. *Wait, reconsider:* If the suburb has no tax, brain drain is real. But County is hard. Recommendation: **City-Only**, but structure the fund so it *can* accept County buy-in later without new legislation. Don't let the perfect be the enemy of the good.
      *   *Wait, let's look closer at the "Trust is an Input" argument.* The user is worried that making taxes legible in a low-trust city causes evasion. This is a strong point. However, hiding it (Salience Option 1) contradicts the "Universal" philosophy. If people don't know they are paying for *this*, they won't defend it. The Library Levy passed *with* transparency. I need to recommend **Visible** but acknowledge the risk.
      *   *Actually, looking at the political reality:* 0.75% is small but visible. If I recommend "Hidden," it undermines the "Universal" ethos. If I recommend "Visible," it risks backlash. The prompt asks me to address the "Trust is an Input" argument specifically. I will recommend **Visible** because the 2016 failure was likely due to "means-tested" (welfare stigma), not transparency. Transparency + Universalism is the fix.

      *   *Refining Decision 4 (Scope):* If employers are shopping sites and a nearby suburb has no tax, a City tax is risky. But County is "lukewarm." If we wait for County, we miss November. Recommendation: **City-Only**, but with a "Regional Opt-In" clause.

      *   *Refining Decision 1 (Sequencing):* "Benefits First" relies on a state grant that is "floating." That's shaky. Bundling is safer for a ballot measure.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** The bottom line up front.
      *   **Context:** Acknowledge the 2016 failure and 2019 success.
      *   **Recommendations (The 4 Points):**
          1.  *Sequencing:* Bundle. (Contract theory).
          2.  *Salience:* Visible. (Civic ownership).
          3.  *Statement:* Net Value to All. (Reinforce universality).
          4.  *Scope:* City-First. (Speed over perfection).
      *   **The "Steel-Man" of the Rejected Options:** This is crucial. I need to articulate the "Benefits First" and "Hidden Tax" arguments strongly, especially the "Trust is an Input" concern.
      *   **Timeline:** 3 weeks to Council, November Ballot.
      *   **Metrics & Unwinding:** How to measure success/failure and the exit strategy.

  4.  **Fleshing out the Arguments:**

      *   *Sequencing:* Bundle = Clear contract. Benefits First = Risky grant, looks like buying votes.
      *   *Salience:* Visible = Ownership. Hidden = Resentment later. *Counter-argument:* Trust is an input. If they see the tax before trusting the gov, they revolt. *Rebuttal:* Trust comes from *delivery*, but legitimacy comes from *consent*. Hiding it denies consent.
      *   *Statement:* Net/All = "We are all in this together." Users only = "Welfare." Cost only = "Tax burden."
      *   *Scope:* City = Doable now. County = Veto risk. *Counter:* Tax competition. *Mitigation:* Anchor institutions (Hospitals) aren't leaving.

  5.  **Addressing the Specific "Trust is an Input" Constraint:**
      *   I need to make sure I don't dismiss this. It's a sophisticated political science point. I will acknowledge it in the "Rejected Options" section but argue that *Universalism* mitigates the risk. People tolerate taxes they perceive as buying insurance for themselves, not transfers to others.

  6.  **Review against Constraints:**
      *   190k pop, county seat.
      *   Median income < state avg (sensitivity to tax).
      *   Hospitals (stable) vs. Plant (unstable).
      *   2016 Failure (Means-tested) vs. 2019 Success (Library/Report).
      *   3 Weeks to Council.
      *   November Ballot.

  7.  **Final Polish:**
      *   Tone check: Needs to sound like a commissioner speaking to colleagues and council. Not too academic, not too salesy. Pragmatic.
      *   Ensure the "Unwinding" section is realistic (sunset clauses, fund reserves).

      *(Self-Correction during drafting)*: On Scope, if the plant leaves because of the tax, that's catastrophic. 0.75% on *earned* income affects workers, not corporate profit tax. But employers worry about employee net pay. I need to note that. City-only is still the only viable path for November.

      *(Self-Correction on Salience)*: The prompt says consultants want it folded. Commissioners want it visible. I need to pick one. Given the 2019 Library success relied on *reporting*, visibility aligns better with the successful precedent. I will recommend Visible.

      *(Self-Correction on Statement)*: "Net" is hard to calculate for non-users (what is the value of a clinician in a middle school if you have no kids?). It needs to be "Imputed Value" or "Community Value." I'll suggest "Tax Paid vs. Estimated Service Value Available."

  8.  **Finalizing the Structure:**
