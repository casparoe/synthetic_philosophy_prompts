      *Let's refine the "Trust" argument.* The user says: "trust is an input here rather than an output, and that a low-trust city which suddenly makes taxes legible just gets evasion plus a backlash." I need to make sure I don't just wave this away. I need to argue that *Universality* changes the trust equation. It's not "Trust Gov -> Pay Tax." It's "Pay Tax -> Get Insurance."

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** City Revenue Study Commission & City Council
  **FROM:** [Your Name], Commissioner
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Proposed Earned Income Surcharge (Ballot Measure 23-A)

  ### Executive Summary

  We have three weeks to advise the Council on a November ballot measure. The proposal—a 0.75% earned income surcharge funding universal early education and youth mental health—is structurally sound but politically fragile. Our city's history (the 2016 means-tested failure vs. the 2019 library success) dictates that **universality and transparency are our only viable paths.**

  I recommend we proceed with the measure, but with four specific structural decisions designed to maximize durability and minimize the risk of employer flight or voter backlash. We must treat this not as a tax hike, but as a municipal insurance policy.

  **The Recommendations:**
  1.  **Sequencing:** **Bundle.** Tax and programs launch simultaneously.
  2.  **Salience:** **Visible.** The surcharge must appear as a distinct line item on paystubs.
  3.  **Reporting:** **Net Value to All Households.** Annual statements go to every resident, showing tax paid vs. value of services available.
  4.  **Scope:** **City-Only.** Do not wait for the County.

  ---

  ### Strategic Context

  We are operating in a low-trust environment with a median income below the state average. The 2016 failure of the means-tested Pre-K levy teaches us that when benefits are perceived as welfare, the middle class withdraws support. The 2019 Library Levy teaches us that when residents see a direct correlation between cost and community asset, they will pay.

  The threat of the manufacturing plant leaving and the zero-tax suburb nearby are real constraints. However, anchor institutions (the two hospital systems) are immobile, and the plant's threat is likely leverage for other concessions. We cannot hold our social infrastructure hostage to a plant that has already threatened to leave.

  ### Detailed Recommendations

  #### 1. Sequencing: Bundle Tax and Benefits
  **Recommendation:** The ballot language must authorize the tax *and* mandate the programs simultaneously. Implementation begins the fiscal year following passage.

  **Rationale:** "Benefits First" relies on a state surplus grant that is currently "floating." Banking our local strategy on a state politician's whim is fiscally irresponsible. Furthermore, delaying the tax vote creates a "boondoggle" perception: *Why are we spending money we don't have?* Bundling creates a clear contract: *If you fund X, you get Y.*

  #### 2. Salience: Visible Line Item
  **Recommendation:** The 0.75% must appear as a separate line on paystubs (e.g., "City Youth Fund"), not folded into general withholding.

  **Rationale:** Hiding the tax validates the cynicism that government operates in the shadows. To build the "Nordic" model of high-tax/high-trust, citizens must feel the cost to value the benefit. If we hide it, we confirm the suspicion that government is free until it isn't.

  #### 3. Annual Statement: Net Value to All Households
  **Recommendation:** Mail a statement to **every** household. It must show: (A) Amount contributed via surcharge, and (B) The per-capita value of the fund's services available to them (even if unused).

  **Rationale:** Limiting statements to program users recreates the 2016 "welfare" dynamic. Every household must see themselves as stakeholders in the *availability* of the service, not just the consumption. This mirrors the 2019 Library success model.

  #### 4. Scope: City-Only
  **Recommendation:** Proceed as a City measure. Include language allowing for interlocal agreements with the County later, but do not condition passage on County approval.

  **Rationale:** The County Executive is lukewarm. Waiting for County consensus misses the November window and gives veto power to a jurisdiction outside our control. Yes, the nearby suburb has no income tax. But our anchor employers (hospitals) cannot move, and most residents work within the county. We build the model here; if it succeeds, the County will eventually seek to opt-in to stop the brain drain.

  ---

  ### The Strongest Case for the Rejected Options (Steel-Man)

  I want to be explicit about the arguments we are rejecting, specifically regarding **Salience** and **Sequencing**, because they contain the highest political risk.

  **The Case for "Benefits First" (Sequencing):**
  *The Argument:* Trust is an input, not an output. In a city where the 2016 levy failed, asking people to pay upfront for a promise is asking for a revolt. If we use the state grant to run Pre-K for three years, parents see the value. The tax vote then becomes a referendum on keeping a popular program, not buying a pig in a poke.
  *The Risk:* It creates a "ratchet effect." If the state grant dries up in Year 2, we face a fiscal cliff. If we cut the program then, the backlash is worse than if we never started. It also looks like buying votes.

  **The Case for "Invisible Tax" (Salience):**
  *The Argument:* This is the point I cannot shake. In a low-trust city with mobile capital, making taxes legible invites evasion and backlash. If a worker sees a new line item reducing their take-home pay, they blame the City, not the program. If it's folded into withholding, they adjust their lifestyle without a specific grievance point. The Nordic model works because trust *already exists*; importing the tax structure without the trust infrastructure creates the worst of both worlds: high visibility, low compliance.
  *The Risk:* If we hide it, we lose the moral authority to ask for more later. It entrenches the belief that taxes are confiscatory rather than transactional.

  **Why We Reject These:**
  We reject "Benefits First" because we cannot budget based on state surplus rumors. We reject "Invisible Tax" because the 2019 Library Levy proved our residents *will* pay if the transaction is honest. Hiding the cost undermines the "Universal" philosophy. If everyone pays, everyone should know.

  ---

  ### Implementation Timeline

  *   **Weeks 1-3:** Commission finalizes memo; Council drafts ballot language.
  *   **Week 4:** Council votes to place on November ballot.
  *   **Weeks 5-12:** Campaign period. *Crucial:* Messaging focuses on "Insurance" and "Stability," not "Charity."
  *   **November:** Election.
  *   **January (if passed):** Fund established; hiring begins for clinicians and Pre-K staff.
  *   **August (Next Year):** Programs launch for school year.
  *   **Following January:** First Annual Household Statements mailed.

  ---

  ### Metrics & Unwinding Strategy

  We must define what failure looks like before we start. If the theory of change is wrong, we need to know when to stop.

  **Measurable Metrics (Years 1-3):**
  1.  **Revenue Stability:** If surcharge revenue drops >5% year-over-year (indicating evasion or job loss), the rate is unsustainable.
  2.  **Program Utilization:** If Pre-K or After-School slots remain >20% empty despite being free, the "Universal" demand thesis is flawed.
  3.  **Employer Retention:** If the manufacturing plant or a hospital system announces relocation citing local tax burden specifically (not general economic conditions), the scope is too narrow.

  **The Unwinding Plan:**
  The enabling legislation must include a **Sunset Clause** and a **Reserve Cap**.
  *   **Sunset:** The tax authority expires after 6 years unless renewed by vote. This forces a re-evaluation before the debt becomes permanent.
  *   **Reserve Cap:** The fund cannot accumulate more than 15% of annual operating costs in reserve. If revenue exceeds this due to growth, the rate automatically triggers a review for reduction or service expansion.
  *   **Failure Trigger:** If two of the three metrics above are missed for two consecutive years, the Commission must convene to recommend either a scope reduction (means-testing) or a repeal vote.

  ### Conclusion

  This measure is a bet that our city wants to be a place where families stay, rather than a place where they pass through. The 2016 failure happened because we asked the middle class to pay for someone else's problem. This proposal asks them to pay for *their* community's infrastructure.

  If we hide the cost, we admit we don't trust them to understand the value. If we wait for the County, we admit we don't trust our own economy to hold. I recommend we bundle, reveal, and build.

  **Recommendation:** **APPROVE** for November Ballot with the modifications listed above.
