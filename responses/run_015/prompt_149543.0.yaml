answer: |-
  Your taxonomy is not daft; in fact, it is sharper than much of the literature that treats pain as a monolith. Splitting the sensory-discriminative (signal), the affective-motivational (sting), and the moral-interpersonal (summons) gives you a robust scaffold. However, applying the label of pain asymbolia to the clones in *Never Let Me Go* requires careful handling. You are right to suspect the clinical evidence base for asymbolia is thin; philosophers often lean on it because it offers a clean dissociation that rarely exists in the messy reality of neurology. Ishiguro, conversely, leans on that same messiness to produce horror.

  Here is where your map holds and where it needs redrawing.

  **Signal, Sting, and Summons in Hailsham**
  You hypothesise that Hailsham is engineered asymbolia: signal delivered, sting conditioned out. I would argue the signal is present, the sting is suppressed rather than absent, and the summons is displaced onto the reader. The clones certainly feel physical pain; they cut themselves, they get ill, they feel the physical degradation of completion. Where they resemble asymbolics is in their reaction to their existential fate. They receive the signal of their early death without the appropriate affective sting of outrage. However, this is not a neurological lesion. It is a psychological adaptation born of total institutionalisation. If it were true asymbolia, Tommy's rages would not exist. Those rages prove the sting is still there, buried under layers of conditioning. The horror of the book is not that the sting is missing, but that the characters work so hard to keep it suppressed.

  Regarding the location of harm: the book locates the harm primarily in the **summons**. The tragedy is not just that the clones suffer, but that the world refuses to acknowledge the claim their suffering makes upon it. The text relies on the sting staying stuck together with the signal for the characters, but coming apart for the reader. We feel the sting they deny. If the clones were truly asymbolic and happy in their fate, the book would be a curiosity, not a tragedy. It works because we, the audience, supply the missing affect.

  **The Madame Scene and the Observer's Sting**
  You ask if the summons is intact without the sting. The Madame scene suggests it is. Madame cries because she perceives the tragedy that Kathy cannot fully articulate. This supports the view that the moral claim (summons) exists independently of the sufferer's awareness. In clinical terms, if a patient with asymbolia smiles while burning their hand, we still intervene. We do not outsource moral responsibility to the sufferer's affective state. Ishiguro dramatises this: Madame's tears are an admission of guilt. She recognises the summons even if the clones do not issue it. The scandal is not that the question is open, but that the answer is known and ignored. The clones are not failing to feel; the world is failing to respond.

  **Lesion or Attainment?**
  In the context of the novel, this is neither lesion nor attainment; it is **induction**. A lesion implies biological damage; attainment implies voluntary mastery. The clones are groomed. They are taught from childhood that resistance is futile and that their purpose is donation. This is closer to learned helplessness than asymbolia. If you treat it as a lesion, you medicalise a moral crime. You risk saying their brains are broken, rather than their society is corrupt. If you treat it as attainment, you suggest they have chosen peace, which lets the oppressors off the hook. The book argues they were robbed of the capacity to protest, not that they chose silence.

  **Where the Lens Distorts**
  The asymbolia lens distorts the book where it suggests the clones are incapable of suffering. They suffer intensely—jealousy, loneliness, fear of separation. The deferral myth proves they hope. The lens is most useful when analysing their political acquiescence, but it breaks down when analysing their interpersonal relationships. If you push the asymbolia analogy too hard, you risk dehumanising the clones exactly as the novel's society does. You might start viewing them as patients rather than people. The obvious rejoinder you anticipated is correct: every human is mortal, the clones just have a date scheduled. The novel suggests the horror is not the deadline, but the compliance. This complicates your three-way split because it introduces a fourth dimension: **anticipation**. The clones know the signal is coming, they know the sting will be there, but they are conditioned to ignore the summons until it is too late.

  **What the Novel Adds**
  The clinical cases show you the mechanism of dissociation; the novel shows you the utility of it. Case reports tell you how a brain can separate signal from sting. *Never Let Me Go* tells you why a society might want them to. It demonstrates that pain acceptance is politically useful. The novel provides a social ecology for the symptom. It shows that if you can condition the sting out of a population, you do not need to guard them with walls; they will walk willingly to the slaughter. That is something a lesion study cannot teach you.

