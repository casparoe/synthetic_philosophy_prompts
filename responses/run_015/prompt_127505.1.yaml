          *   *Argument:* Focus on *causal role* or *dispositional essence*. The property is defined by what it *does* (lowers activation energy, remains unchanged), not strictly by *how* it does it at the micro-level.
          *   *Refinement:* Maybe "Catalysis" isn't the fundamental universal; maybe the universal is a higher-order functional property. Or, use *Determinable/Determinate* distinction. Catalysis is the determinable; specific mechanisms are determinates.

      *   **3. The Nominalist Critique:**
