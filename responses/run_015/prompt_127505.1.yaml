      *   *The Scientific Twist:* In chemistry/physics, we group things by function/behavior (e.g., "catalyst"), but the microphysical basis varies wildly (enzymes vs. metals). This is *multiple realizability*.
      *   *The Tension:* If the underlying physics is different, is the property *really* the same? If yes, what binds them? If no, why does science treat them as the same?

