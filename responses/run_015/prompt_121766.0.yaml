answer: |-
  This analysis applies Wittgenstein's hinge epistemology to the 1925 Scopes Trial, utilizing your proposed distinction between vertical and horizontal hinges to interrogate the structural incommensurability of the conflict.

  ### I. Two-Directional Mapping of Hinge Structures

  In *On Certainty*, Wittgenstein suggests that some propositions function not as empirical claims subject to verification, but as the "scaffolding" or "riverbed" of our thoughts. To doubt them is not to be skeptical, but to lose the ground necessary for inquiry. In Dayton, two distinct scaffolding systems collided.

  #### 1. The Prosecution (William Jennings Bryan & The State)
  *   **Vertical Hinges (Ontological/Cosmological):**
      *   *Divine Revelation as Epistemic Ceiling:* The Bible is not merely a religious text but the primary historical record. Propositions like "God created man in His image" and "The Flood was universal" function as unmoving certainties.
      *   *Anthropocentric Exceptionalism:* Humans are ontologically distinct from animals; any claim blurring this boundary is category-error, not hypothesis.
  *   **Horizontal Hinges (Authority/Procedure):**
      *   *Popular Sovereignty over Curriculum:* In a democracy, the majority (via the legislature) has the absolute right to determine what is taught in public schools.
      *   *The Primacy of Faith over Expertise:* Religious conviction holds higher epistemic authority than scientific consensus regarding human origins.
  *   **Movable Empirical Claims:**
      *   The specific age of the Earth (Bryan allowed for "days" to be periods, provided the divine cause remained).
      *   The precise mechanism of creation (provided it remained special creation).
      *   *Note:* Evolution was not treated here as a false hypothesis, but as a *nonsensical* proposition relative to the Vertical Hinge.

  #### 2. The Defense (Clarence Darrow, ACLU, & Blocked Experts)
  *   **Vertical Hinges (Ontological/Cosmological):**
      *   *Methodological Naturalism:* Explanations for biological complexity must be sought in natural causes, not supernatural intervention.
      *   *Deep Time:* The cosmos and earth operate on timescales that render literal six-day creation empirically incoherent.
  *   **Horizontal Hinges (Authority/Procedure):**
      *   *Epistemic Authority of Science:* Questions of biological fact are to be adjudicated by experts, not legislators or theologians.
      *   *Academic Freedom:* The classroom is a protected space where established scientific consensus cannot be vetoed by local majorities.
  *   **Movable Empirical Claims:**
      *   Specifics of neo-Darwinian synthesis (which was still developing).
      *   The exact lineage of hominids.
      *   *Note:* For the Defense, the Bible was a movable object—a text to be interpreted, critiqued, or allegorized based on evidence.

  #### 3. The Jury
  *   **Vertical Hinges:** Aligned largely with the Prosecution (local religious norms).
  *   **Horizontal Hinges:** *Legal Positivism.* Their duty was to apply the Butler Act as written, not to adjudicate the truth of evolution.
  *   **Movable Claims:** Whether Scopes taught evolution (stipulated as true).

  ### II. The Cross-Examination: Contradiction or Incommensurability?

  Darrow's call of Bryan as an expert on the Bible is the pivotal moment for hinge analysis. Standard narratives view this as Darrow humiliating Bryan by exposing biblical contradictions (e.g., Jonah and the whale, Joshua stopping the sun).

  **Hinge Analysis:** Darrow attempted to treat Bryan's Vertical Hinges (Biblical infallibility) as Movable Empirical Claims. By asking Bryan to interpret difficult passages, Darrow forced Bryan to engage in hermeneutics—effectively admitting that the text requires human interpretation.

  However, from a Wittgensteinian perspective, Darrow did not expose an *internal* contradiction within Bryan's framework. Bryan's framework was not "The Bible is scientifically precise in every literal detail"; it was "The Bible is the ultimate authority on moral and ontological truth." When Bryan conceded that the "days" of creation might not be 24-hour periods, he was adjusting a movable claim to protect the Vertical Hinge (Divine Creation).

  **Verdict:** The cross-examination demonstrated **incommensurability**. Darrow was playing a game of empirical verification; Bryan was playing a game of fidelity to revelation. Darrow succeeded in showing the jury that Bryan's hinges looked like ignorance *through the lens of scientific hinges*, but he did not dislodge Bryan's certainty. Bryan's certainty was not based on the coherence of the data, but on the "standing fast" of the revelation. The clash was not about evidence, but about *what counts as evidence*.

  ### III. What Hinge Epistemology Captures (vs. Sociology of Science)

  Standard sociology of science narratives (e.g., Latour, Collins) often frame this as a struggle for credibility or the social construction of facts. While useful, this misses the *phenomenological deadlock* that hinge epistemology illuminates.

  1.  **The Impossibility of Persuasion:** Sociology might ask, "Why didn't the evidence convince the fundamentalists?" Hinge epistemology answers: "Because the evidence only has weight if you already accept the hinge that validates it." To accept the fossil record as dispositive, one must already accept Methodological Naturalism (a Vertical Hinge). To the Prosecution, the fossil record was either misinterpreted or secondary to Revelation.
  2.  **The Nature of the Disagreement:** Sociology often implies both sides are fighting for the same territory (truth). Hinge theory shows they were fighting over the *map* itself. Neither side experienced this as a disagreement data could settle because, for both, the data was derivative of the hinge.
  3.  **Certainty without Knowledge:** Wittgenstein argues we do not "know" our hinges; we show them. Bryan did not "know" the Bible was true in a propositional sense; he acted from it. This explains his resilience under cross-examination. He was not defending a theory; he was defending a form of life.

  ### IV. Application of the Vertical/Horizontal Distinction

  Your proposed distinction is analytically potent here.

  *   **Vertical Hinges:** Competing cosmologies (Creation vs. Evolution).
  *   **Horizontal Hinges:** Competing authorities (Legislature/People vs. Scientists/Courts).

  **Primary Conflict:** While the public spectacle focused on **Vertical Hinges** (Did man come from apes?), the legal and structural conflict was fundamentally about **Horizontal Hinges**.

  The Butler Act was a Horizontal assertion: *The People, via the Legislature, set the Vertical boundaries.* The Defense's argument was a Horizontal counter-assertion: *Experts, via the Scientific Method, set the Vertical boundaries.*

  **Where the Distinction Clarifies:**
  It explains the verdict. The Jury convicted Scopes not because they were convinced by Vertical arguments against evolution (many likely didn't understand the science), but because they upheld the Horizontal Hinge of *Legal Obedience*. The Tennessee Supreme Court later overturned the fine on a technicality (Horizontal procedure: judges should set fines, not juries), effectively ending the case without resolving the Vertical conflict. This matches the hinge prediction: when Vertical hinges are incommensurable, the resolution defaults to Horizontal proceduralism.

  **Where the Distinction Obscures:**
  It risks artificially separating belief from authority. For Bryan, the Vertical Hinge (Bible) *entailed* the Horizontal Hinge (Democratic control). If the Bible is the word of God, and the majority believes it, democracy *must* enforce it. For Darrow, the Vertical Hinge (Science) *entailed* the Horizontal Hinge (Expert Authority). If truth is discovered by experts, democracy *must not* veto it.
  Therefore, the distinction may obscure the **internal logic** of each worldview. They are not two separate axes; they are integrated systems. Treating them as separate might suggest a compromise was possible (e.g., "Let's keep Vertical beliefs private but agree on Horizontal rules"), but the trial showed that for the actors, the Horizontal authority was necessary to protect the Vertical truth.

  ### V. Limitations and Breakdown of the Framework

  While hinge epistemology excels at diagnosing the deadlock, it falls silent or breaks down in three critical areas required for a full historical understanding:

  1.  **The Dynamics of Hinge Shift:** Wittgenstein describes riverbeds shifting, but offers no mechanism for *why* or *how* one hinge system achieves institutional dominance over another. Hinge epistemology explains why the Scientific Hinge didn't win *in the courtroom* in 1925, but it cannot explain why it eventually achieved dominance in American public education. It lacks a theory of **power and utility**. The scientific hinge won not because it was "more certain," but because it yielded technological and medical predictive power that the Creationist hinge could not match. Wittgenstein's framework is static; history is dynamic.
  2.  **The Normative Legal Stake:** A court cannot rule "incommensurability." The law requires a binary decision (Guilty/Not Guilty; Constitutional/Unconstitutional). Hinge epistemology describes the *condition* of the actors, but it cannot guide the *adjudication*. It offers no resources for deciding which Horizontal Hinge (Popular Sovereignty vs. Expert Authority) *ought* to prevail in a pluralistic society.
  3.  **Pedagogical Stakes:** The trial was about teaching. Hinge epistemology treats certainties as background. But education is the process of *making* the background foreground. The conflict was about which hinges should be transmitted to the next generation. Wittgenstein's account is descriptive of adult language games; it is less equipped to handle the normative politics of *initiation* into those games.

  ### VI. Conclusion: Vertical or Horizontal?

  The Scopes Trial was a **Vertical conflict fought on a Horizontal battlefield.**

  The incommensurability was deepest at the **Horizontal level**. If the conflict were purely Vertical (Cosmology), the state could theoretically remain neutral. But the Butler Act was a Horizontal weaponization of a Vertical hinge. The deepest friction arose because the Prosecution's Horizontal Hinge (Majority Rule) was used to enforce a Vertical Hinge (Creationism) that the Defense's Horizontal Hinge (Expert Authority) deemed illegitimate.

  Your distinction clarifies that the trial was not merely "Science vs. Religion," but "Democratic Will vs. Epistemic Meritocracy." However, the failure of the distinction to fully separate the two reveals a limitation in Wittgenstein: **Hinges are not isolated propositions; they are woven into forms of life.** In a theocratic democracy (Bryan's view) or a secular technocracy (Darrow's view), the Vertical and Horizontal are fused. To pull them apart analytically is useful for the seminar, but historically, the actors experienced them as a single, indivisible certainty.

  **Seminar Takeaway:** Use the Scopes Trial to show that hinge conflicts are rarely resolved by argument (Vertical) but by institutional realignment (Horizontal). The Scientific Hinge won not by proving Bryan wrong in 1925, but by reshaping the Horizontal structures (courts, accreditation, publishing) that determine which Vertical hinges are permissible in public discourse. Wittgenstein explains the silence between the speakers; sociology and history explain why one side eventually spoke louder.
