answer: |-
  ### Research Agenda: Conceptual Prioritization for Non-Human Historical Causation

  For a five-person interdisciplinary team with a three-year horizon, the primary risk is metaphysical stagnation. The philosophy of mind literature on causal exclusion (Line 3) has spun for decades without consensus; the manipulationist literature (Line 1) is technically rigorous but often brittle when applied to uncontrolled global systems.

  Your goal is **non-competitive pluralism**. To achieve this, you must avoid the trap of trying to make non-human forces look *more* like human agents (anthropomorphism) or human agents look *more* like physical systems (reductionism).

  Based on criteria of **dependency ordering** (which question must be answered to make the others intelligible), **tractability for philosophers** (where conceptual analysis yields leverage over empirical data), and **neglect** (where current literature is thin), here is the prioritized agenda.

  ---

  ### 1. The Upstream Crux: Reconstructing Non-Human "Agency" as Structural Constraint (Line 2)

  **Priority:** **Highest (Upstream)**
  **Reasoning:** This is the ontological foundation. Before you can ask if human and environmental causes exclude each other (Line 3), or how to intervene on them (Line 1), you must define *what kind of causal relata* a pathogen or volcanic aerosol is.

  Current literature often oscillates between treating these forces as "background conditions" (which lack causal bite) or "actors" (which implies intention). Your team should prioritize defining **Causal Efficacy via Decision-Space Alteration**.

  *   **Why Upstream?** If a volcano is merely a "condition," it cannot be a co-cause. If it is an "agent," it threatens to eclipse human intention. The middle path is defining non-humans as **dynamic constraint-setters**. They do not *choose* outcomes; they *prune* the tree of possible human actions.
  *   **Tractability:** This is a conceptual analysis problem well-suited to philosophers of social science. It requires analyzing counterfactuals ("Would the Emperor have marched if the grain supply had not failed?") rather than solving the metaphysics of mental causation.
  *   **Neglect:** While "structure vs. agency" is a classic debate, formalizing *non-human* structure as a causal variable in macro-history is under-theorized compared to the focus on human institutions.

  ### 2. The Midstream Problem: Dissolving Causal Exclusion via Level-Separation (Line 3)

  **Priority:** **Medium (Dependent)**
  **Reasoning:** This is the primary philosophical hurdle, but it is **dependent** on the successful resolution of Priority 1.

  The "exclusion problem" arises only if human decisions and environmental forces are competing for the *same* causal slot at the *same* level of description. If Priority 1 successfully defines non-humans as *constraint-setters* and humans as *navigators*, exclusion dissolves. A constraint does not exclude a navigation decision; it makes some navigations impossible and others costly.

  *   **Why Midstream?** Tackling this first leads to the "mental causation" quagmire. Tackling it *after* establishing the Constraint/Navigation distinction allows you to argue for **Explanatory Pluralism** rather than **Causal Monism**.
  *   **Tractability:** Moderate. It requires careful mapping of explanatory levels, but the heavy lifting is done by the ontology established in Priority 1.

  ### 3. The Downstream Tool: Adapting Manipulationism for Global Systems (Line 1)

  **Priority:** **Lowest (Downstream/Methodological)**
  **Reasoning:** This is a technical implementation issue. Once you have defined *what* causes *what* (Priority 1) and established that they don't exclude each other (Priority 2), you need a way to model it.

  Standard interventionist accounts (Woodward) require the possibility of intervention. You cannot intervene on a volcanic eruption. However, if you treat the volcano as a *constraint on resources*, you can model interventions on the *human response to the constraint* (e.g., "If the state had stored grain, would the outcome differ?").

  *   **Why Downstream?** Debating the definition of "intervention" on climate is a dead end if you haven't first agreed on the causal status of the climate. This is a modeling challenge for the causal modelers on the team, not a foundational philosophical crux.

  ---

  ### Concrete Success: The "Principle of Asymmetric Constraint"

  For the highest-priority item (Line 2), success should not be a paper, but a **narrative principle** that changes how history is written.

  **The Principle:**
  > *Non-human forces exert causal power not by determining specific outcomes, but by asymmetrically raising the cost of specific strategic options available to human actors.*

  **Application to the Case Study (Late-Antique Volcanic Winter):**
  *   **Current Deterministic Narrative:** "The 536 CE volcanic dust veil caused cooling, which caused crop failure, which caused the collapse of the Ostrogothic kingdom." (Humans are puppets).
  *   **Current Human-Centric Narrative:** "The volcanic winter created stress, but poor leadership and political fragmentation caused the collapse." (Climate is mere background).
  *   **The New Narrative (Using the Principle):** "The volcanic dust veil **asymmetrically constrained** the logistical capacity of the centralized Imperial tax system more severely than it constrained local warlords. The Imperial center relied on long-distance grain shipments (high vulnerability to climate shock); local warlords relied on immediate foraging (low vulnerability). The volcanic event did not 'cause' the fall; it **altered the fitness landscape**, making centralization causally unsustainable and fragmentation the path of least resistance. Human actors chose fragmentation, but the *menu of viable choices* was edited by the aerosol forcing."

  **Why this moves the needle:**
  1.  **Preserves Agency:** The Emperor and the warlords still make choices.
  2.  **Assigns Weight:** The volcano is not background; it is an active editor of the decision space.
  3.  **Avoids Exclusion:** The cause of the fall is the *interaction* between the logistical structure (human) and the climate shock (non-human). Neither is sufficient alone.

  ### Dependency and Parallel Work

  *   **Dependent on Priority 1:** Priority 2 (Exclusion) cannot be solved without the "Constraint" ontology. If you try to solve Exclusion while treating the volcano as a "determinant," you will fail.
  *   **Parallel Work:** Priority 3 (Manipulationism) can be pursued in parallel by the causal modelers. They can begin testing "constraint-based" causal graphs (e.g., Structural Equation Modeling where climate variables modify the coefficients of human decision nodes rather than acting as direct input nodes). This empirical modeling can run alongside the philosophical conceptualization, providing feedback on whether the "Constraint" ontology is mathematically tractable.

  ### Summary of Criteria for Prioritization

  1.  **Dependency:** Priority 1 defines the *relata*. You cannot check for exclusion (Priority 2) or intervention (Priority 3) until you know what the non-human entity *is* in the causal chain.
  2.  **Tractability:** Priority 1 is a conceptual distinction (Constraint vs. Determination) that philosophers can resolve via argument and case study. Priority 2 is a metaphysical swamp if tackled directly. Priority 3 is a technical modeling issue.
  3.  **Impact:** Resolving Priority 1 changes the *narrative form* of history immediately (as shown in the volcanic winter example). Resolving Priority 3 only changes the *statistical validation*.

  **Recommendation:** Dedicate Year 1 to formalizing the **Ontology of Structural Constraint** (Priority 1). Use Year 2 to demonstrate how this dissolves the **Exclusion Problem** (Priority 2) in specific case studies. Use Year 3 to formalize the **Causal Models** (Priority 3) that encode this logic. This ensures that by the end of the grant, you have a defensible philosophical framework *and* a methodological toolkit, rather than a solution to a metaphysical problem that historians will ignore.
