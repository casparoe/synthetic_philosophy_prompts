      *   **Specific Problem:** The "bootstrapping problem" (circularity between defining the *demos* and determining which decisions/interests matter).
      *   **User's Proposed Solution:** Distinguish between *procedural affectation* (subject to effective control/jurisdiction) and *substantive affectation* (interests impacted by specific decisions). Use procedural to bootstrap, then use democratic deliberation to refine based on substantive.
      *   **User's Claim:** This breaks the circle because the procedural criterion is non-democratic (factual/normative hybrid?) and doesn't presuppose the *demos*.
      *   **Tasks:**
          1.  Evaluate if this actually breaks the circle or pushes it back (specifically regarding "effective political control").
          2.  Identify standard objections in the literature that this framing might dodge or engage with.
