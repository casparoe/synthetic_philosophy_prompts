  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, did the user say "non-democratic"?* Yes. I need to press on whether a "non-democratic" foundation is acceptable for a democratic theory. Is it a transcendental precondition? Or a temporary necessity?
      *   *The "Refinement" stage:* If the initial *demos* decides on expansion, that's a second-order decision. Does *that* require the all-affected principle? If so, the circle returns. If not, why is the second decision democratic but the first isn't?
