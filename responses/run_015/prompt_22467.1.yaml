      *   *Premise 2:* AAIP is circular (need *demos* to decide decisions, need decisions to know affected).
      *   *Solution:* Split AAIP into Procedural (jurisdiction/control) and Substantive (interest impact).
      *   *Mechanism:* Procedural sets initial boundary (non-democratic fact/norm). Substantive refines it (democratic process).
      *   *Defense:* Procedural is non-democratic, so no circularity.

  3.  **Evaluate the "Breaking the Circle" Claim (Task 1):**
      *   *The "Effective Political Control" Problem:* Is "effective control" truly non-normative or pre-democratic?
      *   *Objection:* To say someone is under "effective control" implies a boundary of jurisdiction. Who defines the jurisdiction? If the state claims jurisdiction over X, is that a brute fact? Or does it require legitimacy?
      *   *Abizadeh's Challenge:* Arash Abizadeh ("Democratic Theory and Border Control") argues that coercive boundaries *themselves* require democratic justification. You can't just say "the state controls this border" as a brute fact to justify who is inside. The border *is* the coercive act needing justification.
      *   *Circularity Check:* If "effective control" is just a sociological fact (might makes right), it solves the circle but loses normativity. If "effective control" implies *legitimate* jurisdiction, it presupposes the *demos* (who authorized this jurisdiction?).
      *   *Verdict:* It likely pushes the circle back. The definition of the "polity" exercising control is the very thing in question.

  4.  **Identify Standard Objections/Literature (Task 2):**
      *   *The All-Affected Principle (AAIP) vs. All-Subjected Principle (ASP):* The user is essentially pivoting from AAIP to ASP (All-Subjected Principle). This is a well-trodden path.
      *   *Key Authors:*
          *   **Robert Goodin:** Defends AAIP (enfranchise all affected). Criticized for being too expansive (everyone is affected by everything eventually).
          *   **Arash Abizadeh:** Defends ASP (coercion requires justification). Argues borders are coercive, so outsiders must have a say. This challenges the user's "procedural" boundary if it relies on existing borders.
          *   **Fredrik Arrhenius:** Formalizes the boundary problem. Shows that no consistent rule satisfies certain democratic axioms.
          *   **David Miller:** Defends bounded citizenship based on nationality/ethical community.
          *   **Linda Bosniak:** "The Citizen and the Alien" – discusses the boundary as a site of contestation.
      *   *What does the user dodge?* By saying "effective control" bootstraps, they might dodge the question of *illegitimate* control. What if the control is colonial or occupation? Does that create a *demos*? (The "might makes right" trap). They also might dodge the *external* justification problem (why should those *not* under control accept this bootstrapping?).

  5.  **Assess the Procedural/Substantive Distinction (Task 3):**
      *   *Utility:* It is useful heuristically. It maps onto the ASP vs. AAIP debate.
      *   *Problem:* The "refinement" stage. If the bootstrapped *demos* decides who else to include, why would they ever include outsiders who dilute their power? (The "Boundary Problem of Expansion"). This is a collective action problem within the theory.
      *   *Is it worth keeping?* Yes, but needs refinement. It's essentially a "two-stage" theory. But the transition from stage 1 to stage 2 needs normative lubrication, not just procedural mechanism.

  6.  **Drafting the Response (Iterative Process):**

