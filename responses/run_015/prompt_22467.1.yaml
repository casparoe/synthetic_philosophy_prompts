  *(Self-Correction during final review)*: Make sure I explicitly address the "substantive judgment" question regarding "effective control." Defining what counts as "effective" and "political" is itself contested. Is a drug cartel's control "political"? Is a benign hegemon's control "political"? This shows the label isn't neutral.

  10. **Final Output Structure:**
      *   Introduction: Validate the project.
      *   The "Effective Control" Trap (Normative vs. Descriptive).
      *   The Literature Landscape (AAIP vs. ASP, Abizadeh, Arrhenius).
