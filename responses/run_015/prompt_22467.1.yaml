      *   **Tone:** Academic, rigorous, constructive, peer-to-peer (but acknowledging the user is a student and I am an AI assistant). Needs to show familiarity with the literature (Abizadeh, Goodin, Arrhenius, etc.).

  2.  **Deconstruct the User's Argument:**
