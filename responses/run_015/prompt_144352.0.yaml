      *   **User's View:** Biological/Physical Continuity (Animalism/Somatic view). Self is anchored in the brain/body. Amnesia doesn't change identity, just data loss.
      *   **Specific Arguments:**
          *   Roommate: Narrative gravity defines self. Erased story = erased self.
          *   User: Brain/body defines self. Amnesia = missing files, not new person.
