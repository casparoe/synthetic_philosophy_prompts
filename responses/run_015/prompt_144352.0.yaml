          *   **Biological/Animalism (Olson, Mackie):** Identity depends on the living organism. You are a human animal.
          *   **Narrative Self (Dennett, Schechtman):** A specific subset of psychological continuity focusing on the *story* we tell ourselves.
          *   **No-Self (Buddhism, Hume, Parfit's reductionism):** There is no deep "self," just bundles of experiences.
      *   *The "Autobiography Case":* Sounds like a reference to Dissociative Identity Disorder (DID) or perhaps a specific thought experiment (like Perry's or Parfit's cases). It touches on fission/fusion problems.
