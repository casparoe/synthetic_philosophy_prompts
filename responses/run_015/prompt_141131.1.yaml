answer: |-
  Here is the breakdown of Ines's code, based strictly on the text you have provided.

  ### 1. The Rule She Is Running
  Ines is not running a utilitarian calculation (maximizing lives), nor is she running a strict egalitarian one (everyone is equal). She is operating on a principle of **Non-Aggregative Particularism.**

  She does not see "groups." She sees specific claims. When she looks at a situation, she strips away the arithmetic and looks for the single, most demanding human presence.
  *   **Ch. 3** establishes that a group (5) does not create a stronger claim than an individual (1). The "mass" does not outweigh the "person."
  *   **Ch. 10** establishes that a *child* creates a specific claim that overrides an adult, even if that child is part of a "count" (2 vs 1). She explicitly denies the math ("I wasn't counting them") to focus on the vulnerability ("I was looking at the child").
  *   **Ch. 8** establishes that life-stage matters. The 17-year-old has a claim the 80-year-old does not, regardless of health.
  *   **Ch. 6** establishes that relationship trumps all. (This is the only time she breaks impartiality).
  *   **Ch. 5** establishes that if there are *no* distinguishing claims (two identical strangers), only then does she surrender to chance.

  **The Code:** *Ignore the numbers. Ignore the aggregate. Find the specific vulnerability that demands you. If there is a child, it is the child. If there is a colleague, it is the colleague. If there is nothing but identical adults, flip the coin.*

  ### 2. What She Does in Chapter 16
  **She goes to the girl.**

  To do otherwise breaks the spine of the character you have built.
  *   If she saves the raft, she is effectively saving "three lives" over "one life." Even if she justifies it via the injury, the outcome is utilitarian. This contradicts Ch. 3 ("I'm not adding them up").
  *   If she saves the girl, she is prioritizing the specific vulnerability of the child (Ch. 10, Ch. 8) over the aggregate needs of the adults (Ch. 3). This keeps her consistent.

  The injury on the raft is a red herring. In Ch. 8, she chose the 17-year-old over the sick 80-year-old. She prioritizes *life stage* over *medical urgency*. A nine-year-old in the water is more vulnerable than a forty-year-old, even an injured one, because the adult has agency, strength, and the capacity to understand their death. The child does not.

  ### 3. The Closest Precedent
  **Chapter 10 is the controlling precedent.**

  In Ch. 10, she had a choice between a boat with two people (Woman + Child) and a boat with one (Man). A utilitarian saves the two. A strict individualist might flip. Ines saves the two, but *only* because of the child. She explicitly decouples the mother from the decision ("I was looking at the child").

  In Ch. 16, the child is isolated. The "math" is now against the child (1 vs 3). In Ch. 10, the math was *with* the child (2 vs 1).
  *   If she saves the girl in Ch. 16, she proves that the "Child Rule" is stronger than the "Anti-Count Rule."
  *   If she saves the raft, she implies the "Child Rule" only works when the numbers also happen to favor the child. That makes her look like a closet utilitarian who uses the child as an excuse.

  To remain the same woman, the presence of the child must override the count of the adults, just as the presence of the child overridden the single man in Ch. 10.

  ### 4. The Alternative Rule (And Why It Fails)
  You asked for a rule that fits the past but says something different here.
  **The Alternative:** *The Rule of Immediate Mortality.* (She saves whoever will die the soonest without aid).
  *   **Fits:** Ch. 8 (Sick 80-year-old might die sooner than 17-year-old? No, she saved the 17-year-old. So this rule already fails).
  *   **Fits:** Ch. 12 (The swimmer yelling might be in more distress? Plausible).
  *   **Fails:** Ch. 3 (5 vs 1. Presumably all would drown in similar time).

  There is no consistent rule that fits all six previous scenes and leads her to the raft in Ch. 16. To send her to the raft, you would have to retcon Ch. 3 or Ch. 8. You would have to make her a triage officer (saving the most urgent medical case) rather than a harbor officer (saving the most vulnerable human claim).

  ### 5. The Coin Problem
  You asked if she flips, is it 50/50 or weighted (3/4 chance for the raft)?

  **She cannot flip the coin in this scene.**
  *   **If she flips 50/50:** She treats the Raft and the Girl as morally equal units. This respects Ch. 3 (the Raft is one unit, not three people) but violates Ch. 10 and Ch. 8 (a child is not equal to an adult). It implies she has lost her ability to distinguish vulnerability.
  *   **If she flips Weighted (3/4 for the raft):** She is "adding them up." She is admitting that three lives outweigh one. This directly contradicts Ch. 3 ("I'm not adding them up") and Ch. 10 ("I wasn't counting them").

  A coin is only for when she sees *no difference* (Ch. 5). Here, she sees a difference (Age/Child). To flip is to abdicate the code.

  ### 6. The Smallest Thing to Settle It
  You need a line in Ch. 16 that echoes Ch. 10 without repeating it, cementing that she sees the *child*, not the *numbers*.

  **The Line:**
  When her coxswain (or the radio) challenges her later about leaving the three, she shouldn't defend the math. She should defend the focus.
  *   *Draft:* "There were three of them." / "I didn't see three. I saw her."
  *   *Better:* **"The raft has hands. She doesn't."**

  This distinguishes the adults (who can hold on, help each other, fight) from the child (who cannot). It aligns with Ch. 8 (capacity/stage of life) and Ch. 3 (the single man had no one to help him, just as the girl has no one).

  **The Future Case (Chapter 18):**
  To lock this in for the reader, put her in a scenario two chapters later where the numbers and the vulnerability are removed.
  *   *Scenario:* Two adult strangers, identical distance, identical condition.
  *   *Action:* She flips the coin.
  *   *Why:* This reminds the reader that she *only* randomizes when there is no child and no colleague. It proves Ch. 16 wasn't randomness; it was a choice based on the girl.

  **Summary for your writing week:**
  Send the launch to the girl. Do not let her hesitate. The hesitation belongs to the reader, not to Ines. Ines sees a child and a raft. She has never saved the raft when a child was in the water. She won't start now.
