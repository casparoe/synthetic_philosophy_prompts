      *   *Variant 1: Divisibility (100 children).* Total misery same, spread out.
          *   *Prioritarian View:* Worse. Priority weighting is concave. Suffering concentrated in one person weighs more than suffering spread among 100 people (diminishing marginal moral value of pain/relief).
          *   *Revelation:* Prioritarianism tracks *levels*, not just total pain. It cares about the *depth* of the pit, not just the volume of dirt.
      *   *Variant 2: Rotation (Everyone takes a turn).*
          *   *Prioritarian View:* Better than Omelas, worse than no sacrifice. Why? Because the "worst off" status is temporary. Lifetime well-being might be equalized. If we evaluate atemporal lives, inequality decreases.
          *   *Revelation:* Prioritarianism is sensitive to *lifetime* levels. It reveals the view is concerned with the shape of a life, not just a snapshot.
      *   *Variant 3: Ignorance (Belief dependence).*
          *   *Prioritarian View:* If the child doesn't exist or isn't suffering, but people *believe* it is, does the utility function count belief-based happiness? Usually, Prioritarianism is objective about well-being. If the child is real but ignored, it's bad. If the child is fake, the "cost" is just the citizens' anxiety.
