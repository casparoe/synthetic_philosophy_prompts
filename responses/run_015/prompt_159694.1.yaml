  2.  **Deconstruct Task 1: Prioritarianism as a Lens:**
      *   *Is it the right lens?* Standard LDO targets Egalitarianism (Telic). Prioritarianism (Parfit) is designed to *avoid* LDO by focusing on absolute levels weighted by priority, not relative gaps. Omelas isn't a standard LDO case (making everyone worse off to equalize). It's a *trade-off* case (extreme suffering for one vs. moderate happiness for many).
      *   *The Conflict:* Utilitarianism says "Save Omelas" (aggregate happiness wins). Egalitarianism might say "Destroy Omelas" (inequality is bad, even if it hurts everyone). Prioritarianism sits in between. It weights the child's suffering heavily.
      *   *Structure:* One person at extreme negative utility ($-\infty$ or very low) vs. $N$ people at high positive utility.
      *   *The Math/Structure:* Prioritarianism uses a concave transformation function $f(w)$. The moral value is $\sum f(w_i)$. If the child's well-being is low enough, $f(w_{child})$ is extremely negative (or the gain from improving them is extremely high).
      *   *The Turning Point:* At what $N$ does the aggregate happiness of Omelas outweigh the weighted suffering of the child? Prioritarianism is aggregative. If $N$ is large enough, the sum of small weighted gains for the many *can* outweigh the large weighted gain for the one.
      *   *The Critique:* Does this reproduce insensitivity? Yes, if $N$ is huge. This is the "Repugnant Conclusion" adjacent problem. It shows Prioritarianism is still aggregative. It's not purely person-affecting in a veto-power sense.
      *   *Verdict:* It's a strong lens because it tests the *limits* of priority weighting against aggregation. It shows Prioritarianism doesn't grant absolute veto rights to the worst-off.

