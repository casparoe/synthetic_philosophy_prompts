answer: |-
  # ADVERSARIAL COLLABORATION DOCUMENT: EPISTEMIC STATUS OF DISTANT-PAST EVENTS

  **Parties:** Critical Reconstructionists (CR) vs. Testimonial Discontinuists (TD)
  **Subject:** The justification of factual beliefs regarding events beyond the testimonial horizon.

  ## I. AGREED CLAIMS

  Both parties affirm the following numbered claims as accurate descriptions of historical practice, methodological constraints, and the structure of the past.

  1.  **Herodotean and Thucydidean Achievement:** Both parties agree that Herodotus’s *historiē* (inquiry) and Thucydides’s method (autopsy, precise chronology, exclusion of myth) established norms for collecting and vetting testimony. Both parties agree these methods successfully stabilized narratives within the living memory of the authors but did not provide a mechanism for verifying specific event-details once the chain of living witnesses expired.
  2.  **Standard Source Criticism:** Both parties agree that modern historical practice employs internal consistency checks, transmission-error modeling (stemmatics), and archaeological correlation. Both parties agree these methods are effective at identifying interpolations, biases, and gross anachronisms within the surviving record.
  3.  **The Testimonial Horizon:** Both parties agree that a "testimonial horizon" exists, defined as the temporal boundary beyond which no chain of direct or near-direct living testimony extends (typically estimated at 80–100 years post-event). Both parties agree that beyond this horizon, no human agent currently alive possesses a causal connection to the event via memory or direct report.
  4.  **Narrative Utility:** Both parties agree that historical narratives constructed beyond the testimonial horizon possess significant cultural, explanatory, and heuristic value, regardless of their epistemic status regarding specific factual claims.

  ## II. RESIDUAL DISAGREEMENTS

  The following table records the divergent epistemic assessments of work conducted beyond the testimonial horizon. Each formulation is phrased to be acceptable to its respective camp.

  | Point of Contention | Critical Reconstructionist Formulation | Testimonial Discontinuist Formulation |
  | :--- | :--- | :--- |
  | **1. Epistemic Output** | Trace-coherence plus archaeological correlation yields **justified factual belief** about specific distant events (e.g., "Battle X occurred at Location Y"). | Trace-coherence plus archaeological correlation yields **well-ordered narrative constructs** that model plausible pasts but do not justify belief in specific event-tokens. |
  | **2. Role of Consistency** | Internal consistency among fragmented traces functions as a **truth-tracking mechanism**, filtering out error to reveal the underlying event structure. | Internal consistency among fragmented traces functions as a **coherence constraint**, ensuring the narrative is logically stable without guaranteeing correspondence to reality. |
  | **3. The Horizon's Significance** | The testimonial horizon is a **practical difficulty** that reduces confidence levels but does not fundamentally alter the kind of knowledge accessible via inference. | The testimonial horizon is an **epistemic boundary** that fundamentally alters the kind of access available, shifting from testimony-based knowledge to inference-based speculation. |
  | **4. Status of "Fact"** | A historical fact is established when the **best explanatory inference** points to a specific event occurrence with high probability. | A historical fact beyond the horizon is merely a **necessary posit** within a coherent narrative system, not a verified occurrence. |

  ## III. CRUXES, CASES, AND PREDICTIONS

  The parties identify two fundamental cruxes driving the disagreement. For each, a concrete case is selected, and each party records a prediction regarding how evidence in this case bears on the truth.

  ### Crux A: Independent Trace-Coherence vs. Testimonial Inheritance
  **Question:** Can coherence among independent traces substitute for the broken chain of testimonial inheritance?

  *   **Case:** **The Battle of Himera (480 BCE).**
      *   *Context:* Herodotus provides a narrative of the battle. Recent archaeological excavations have revealed mass graves and weapon deposits at the proposed site dated to the correct period.
      *   *Agreed Data:* Textual description exists; material traces of violence exist; no living testimony chain exists.
  *   **Critical Reconstructionist Prediction:** The convergence of the textual narrative (Herodotus) and the material traces (mass graves) **confirms** the specific occurrence of the Battle of Himera as described. The coherence between independent trace types (text and bone) bridges the horizon.
  *   **Testimonial Discontinuist Prediction:** The convergence confirms only that **violence occurred** at that location during that period. It does not confirm the specific event "Battle of Himera" as a unified historical fact, because the textual narrative remains unverified testimony and the bones lack agency-specific markers. The coherence creates a stronger narrative, not a verified event.

  ### Crux B: Material Evidence as Direct Bridge vs. Narrative Corroboration
  **Question:** Can material or archaeological evidence function as a direct evidential bridge rather than merely corroborating narrative coherence?

  *   **Case:** **Hypothetical "Commander's Token" Discovery.**
      *   *Context:* Imagine a future discovery at a battlefield site (Site Z) dated to 1200 BCE. A weapon is found inscribed with the name of a commander listed in a chronicle written 400 years later describing "Battle B."
      *   *Agreed Data:* Material object links a specific name to a specific location/time; textual source links that name to a specific event narrative; horizon separates both from the present.
  *   **Critical Reconstructionist Prediction:** This discovery **validates** the specific historical claim that Commander X fought at Battle B. The material trace acts as a direct bridge, anchoring the textual narrative to physical reality across the horizon.
  *   **Testimonial Discontinuist Prediction:** This discovery validates only that **Commander X was present** at Site Z. It does not validate "Battle B" as a specific event with the causes, outcomes, or meanings assigned by the later chronicle. The material trace anchors a person, not the narrative event constructed around them.

  ## IV. VERBAL-SUBSTANTIVE ASSESSMENT

  **Assessment:** The dispute is **partially verbal but predominantly substantive.**

  **Verbal Component:** A portion of the disagreement rests on the definition of "knowledge." Critical Reconstructionists employ a probabilistic, inference-to-the-best-explanation definition of knowledge (where high probability equals justification). Testimonial Discontinuists employ a causal-chain definition of knowledge (where a broken testimonial link precludes justification regardless of probability). If both parties agreed to use the term "warranted assertibility" instead of "knowledge," some friction would dissipate.

  **Substantive Component:** The dispute is substantive because it dictates divergent practices in confidence allocation and risk assessment.
  1.  **Risk:** Critical Reconstructionists accept a higher risk of false positives (believing specific details that are actually coherent fictions) to gain explanatory power. Testimonial Discontinuists accept a higher risk of false negatives (withholding belief in true events) to maintain epistemic purity.
  2.  **Evidence Interpretation:** The parties genuinely disagree on how material evidence functions. Reconstructionists treat material traces as *proxies for events*; Discontinuists treat material traces as *proxies for conditions*. This leads to different conclusions even when viewing the same data (as seen in the Crux predictions).

  **Conclusion:** While terminological alignment would reduce rhetorical heat, the underlying disagreement regarding the evidentiary weight of coherence versus inheritance remains a substantive divergence in epistemic policy.
