      *   *Is it merely verbal?* No. Both sides claim "injustice" is happening, but they disagree on *why* it's bad and *what* fixes it. If it were just verbal, they would agree on the facts and the solution once terms were clarified. But they likely disagree on the solution (bias training vs. structural empowerment).
