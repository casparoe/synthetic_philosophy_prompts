answer: |-
  The summary correctly identifies Harnad's core critique: purely syntactic systems lack semantics because symbols refer only to other symbols, creating a closed loop. However, the thermostat example significantly distorts his proposal.

  First, Harnad does not classify a thermostat as a "symbol system." His solution requires a hybrid architecture: symbolic capabilities built atop non-symbolic (iconic and categorical) representations derived from sensorimotor interaction. A thermostat's binary state lacks the combinatorial structure requisite for symbols. Harnad argues for robots that can categorize objects and manipulate them, grounding symbols in sensory features, not just binary causal links. Defenders would insist that without robust categorization, the coupling is too trivial to ground language-like symbols.

  Second, the claim that causal coupling "solves" grounding oversimplifies the requirement. It is not mere causal connection but *discriminative* capacity that matters. The system must be able to pick out referents reliably enough to support symbolic manipulation.

  Finally, the conclusion that grounding yields "genuine understanding" conflates semantics with phenomenology. Harnad argues grounding is necessary for *meaning* (reference), but he distinguishes this from consciousness. A grounded robot might have meaningful symbols without necessarily having subjective experience (qualia). While Harnad suggests embodiment is key for cognition, he acknowledges the "hard problem" of consciousness remains separate. Equating grounding with understanding overstates the case; grounding solves the *reference* problem (how symbols pick out things), but whether this grants full cognitive understanding is still debated.

  Corrected, the argument is: sensorimotor grounding is necessary for semantic meaning, preventing symbols from being empty, but it is not automatically sufficient for consciousness or full human-like understanding. The summary is right on the necessity of embodiment but wrong on the sufficiency of simple causal coupling and the definition of a symbol system. A defender would argue the article mistakes a necessary condition (causal coupling) for a sufficient one (understanding), and misidentifies the complexity required for the grounding system itself.
