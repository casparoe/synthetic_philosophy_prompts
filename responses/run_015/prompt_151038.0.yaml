answer: |-
  # Specification for a Theory of Object Identity

  This document outlines the desiderata for any adequate metaphysical account of individuation and numerical identity. The goal is to move beyond verbal disputes by explicitly flagging which requirements are logical necessities and which are philosophical commitments. The core tension lies in an **Inconsistent Triad**: you cannot satisfy all camp preferences simultaneously.

  ## I. The Desiderata List

  ### D1: Numerical/Qualitative Distinction
  *   **Requirement:** The theory must distinguish between *qualitative identity* (sharing all properties) and *numerical identity* (being the very same object). It must be possible to formulate the question "Are these one object or two?" without the answer being a tautology of property comparison.
  *   **Motivating Case:** Basic logic. If $x$ and $y$ are numerically distinct, there must be a coherent sense in which they are "two" even if they are alike.
  *   **Status:** **Non-Negotiable.** Any theory collapsing this distinction eliminates the subject matter.
  *   **Joint Unsatisfiability:** None.

  ### D2: Symmetric Co-existence
  *   **Requirement:** The theory must allow for the possibility of a world containing two distinct objects that share all intrinsic properties and stand in symmetric relations to one another (Black's Spheres).
  *   **Motivating Case:** **Black's Spheres.** Two iron spheres, 1 mile apart, in an otherwise empty universe. Intuition says "two," not "one."
  *   **Status:** **Camp Preference (Realist).** Leibnizians deny this possibility; Haecceitists and Structuralists accept it.
  *   **Joint Unsatisfiability:** Conflicts with **D4** and **D7** (See Inconsistent Triad below).

  ### D3: Diachronic Determinacy
  *   **Requirement:** The theory must provide a truth value for diachronic identity claims in symmetric dynamic systems. It must determine whether objects have "swapped" or "remained" over time.
  *   **Motivating Case:** **The Swap Loop.** Black's spheres move in a periodic loop, swapping positions without interacting or leaving traces. Did Sphere A end up where Sphere B started?
  *   **Status:** **Camp Preference (Haecceitist).** Structuralists typically deny there is a fact of the matter here.
  *   **Joint Unsatisfiability:** Conflicts with **D4** (in symmetric worlds).

  ### D4: Property Grounding
  *   **Requirement:** Facts about numerical identity must be grounded in facts about properties (intrinsic or relational). There are no "bare" identity facts.
  *   **Motivating Case:** **Principle of Sufficient Reason.** It is metaphysically objectionable for two things to be distinct without *some* property or relation making them so.
  *   **Status:** **Camp Preference (Anti-Haecceitist).** Haecceitists reject this, allowing primitive thisness.
  *   **Joint Unsatisfiability:** Conflicts with **D2** and **D7** (See Inconsistent Triad below).

  ### D5: Intrinsic Priority
  *   **Requirement:** Individuation should preferably rely on intrinsic properties rather than purely relational ones (e.g., "being 5 miles from Sphere B").
  *   **Motivating Case:** **Independence.** Objects should be what they are regardless of what else exists. Relational individuation makes existence holistically dependent.
  *   **Status:** **Camp Preference (Substantivalist).** Structuralists reject this.
  *   **Joint Unsatisfiability:** Conflicts with **D2** (if D5 is strict, Black's spheres collapse).

  ### D6: Modal Sensitivity
  *   **Requirement:** Swapping the identities of two qualitatively identical objects in a possible world must result in a *distinct* possible world.
  *   **Motivating Case:** **Haecceitistic Intuition.** If I could have been you and you me, that is a different way the world could have been, even if qualitative descriptions match.
  *   **Status:** **Camp Preference (Haecceitist).** Structuralists deny this (Leibniz Equivalence).
  *   **Joint Unsatisfiability:** Conflicts with **D4** (if properties don't change, worlds shouldn't).

  ### D7: Anti-Haecceitism
  *   **Requirement:** The theory must not posit primitive "thisness" (haecceities) as ontological primitives. Identity must be reducible or supervenient.
  *   **Motivating Case:** **Parsimony.** Primitive identity is epistemically inaccessible and metaphysically brute.
  *   **Status:** **Camp Preference (Structuralist/Leibnizian).** Haecceitists reject this.
  *   **Joint Unsatisfiability:** Conflicts with **D2** and **D4** (See Inconsistent Triad below).

  ---

  ## II. The Inconsistent Triad (Joint Unsatisfiability)

  The central failure mode of identity theories is the inability to satisfy the following three desiderata simultaneously. You must drop at least one.

  1.  **D2 (Symmetric Co-existence):** Black's Spheres are possible.
  2.  **D4 (Property Grounding):** Identity must be grounded in properties.
  3.  **D7 (Anti-Haecceitism):** No primitive thisness allowed.

  *   **Drop D2:** You become a **Strict Leibnizian**. (Black's world is impossible).
  *   **Drop D4:** You become a **Haecceitist**. (Identity is brute/primitive).
  *   **Drop D7:** You become a **Haecceitist** (same as above).
  *   **Drop D3 (Corollary):** If you keep D2, D4, and D7, you become a **Structuralist**, but you must admit **Diachronic Indeterminacy** (The Swap Loop has no answer).

  ---

  ## III. Theory Scorecard

  | Theory | D2 (Symmetry) | D3 (Diachronic) | D4 (Grounding) | D7 (No Haecceity) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict Leibnizian** | **FAIL** | N/A | PASS | PASS | Denies the possibility of Black's world to save Grounding. |
  | **Haecceitist** | PASS | PASS | **FAIL** | **FAIL** | Accepts Symmetry and Determinacy by positing brute "thisness." |
  | **Structuralist** | PASS | **FAIL** | PASS | PASS | Accepts Symmetry and Grounding (via relations) but admits the Swap Loop is indeterminate. |

  ---

