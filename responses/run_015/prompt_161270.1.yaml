prompt: |-
  hey — you're a political philosopher who's spent way too long in the equality-of-what debates and who, weirdly, also did a couple of years of practical mechanism design for public agencies. Before you write anything polished, do some messy brainstorming and take your time: I want you to actually think about what belongs on this list, not recite the standard four views with their standard objections. Where you think a requirement is genuinely non-negotiable, say so flatly; where you're unsure, say why.

  Context, because adequacy is relative to a job. I'm on a committee that has to build an actual allocation procedure. We have a fixed, too-small supply of a one-shot intervention — call it a boost — with four features that matter: you get it at most once, its effects are permanent, it cannot be sold, given away, banked or transferred, and what it does for you depends heavily on your body and your circumstances. There's no secondary market that could reallocate it afterwards and no way to undo a decision. We need two things: a currency (one measurable quantity in which we compare how well off or how advantaged each applicant is) and a rule for what to do with those comparisons (equalize, prioritize the worst off, get everyone over some floor, whatever). I'm asking only about the currency.

  Before I let anyone on the committee propose a metric, I want the spec. What does a candidate currency of egalitarian comparison have to be able to do to count as adequate for this job? For each requirement give me the case or consideration behind it — the case, not just the label. Mark each requirement as non-negotiable for us or as a preference that really only belongs to one family of views. And flag any subset of the requirements that you think can't all be satisfied together: if the list is jointly unsatisfiable, then the interesting result is which requirement we should drop, so tell me which pair or triple is doing the excluding and what each one costs to give up.

  Cases I already know the currency has to handle, including a couple I invented because our intake really does produce things like them:

  - Same bundle, different bodies: two applicants with identical income, insurance and housing, one of whom needs dramatically more of all of it to reach the same level of mobility, or of being able to work at all. Does the currency track what people have or what they can do with what they have, and does it have any answer when the conversion rates differ for reasons nobody chose?
  - Expensive tastes on purpose: someone who, after our rules were published, deliberately trained themselves to need something rare and costly so as to count as worse off.
  - Sour grapes: someone whose reported satisfaction is very high, but only because their expectations collapsed to fit a deprived life twenty years ago.
  - The coupled case (mine, but we've had two): two applicants whose physiologies are linked such that a boost given to either one partly improves the other, and neither can be treated without affecting the other. What is the unit the currency is measured over, and does the currency have anything to say when the units aren't cleanly separable?
  - The time-unit problem: a 22-year-old and an 82-year-old; a patient who is fine now and will be badly off in five years; someone who was badly off their whole short life and died at 30. Is the currency summed over a whole life, averaged per period, evaluated at a moment, or discounted somehow? Does a short bad life count as a smaller inequality than a long one?
  - The unresponsive applicant: someone in a permanent coma, no advance directive, no proxy, and we still have to assign them a number.
  - The not-yet-there applicant: a pregnant person, where part of the benefit would land on someone who doesn't exist yet, and a budget we're setting now for people born in 2060.
  - Risk: we must rank people before we know who actually responds well to the boost, and later we find out. Does the currency want to be ex ante or ex post, and what breaks if it has to be both?

  Constraints that are mine rather than philosophical, and that I want you to treat as candidate requirements rather than as mere practicalities you can wave away: it has to be computable from information our intake can actually get (no invasive health audits, no demanding that people disclose things that would humiliate them, no home visits for 40,000 applicants); it has to survive applicants strategically shaping what we can observe; and it has to be stable enough that two different intake officers give the same applicant roughly the same number.

  Things I want argued rather than assumed: whether sensitivity to brute luck or to responsibility is a genuine requirement or a sectarian taste of one camp; whether any no-envy condition belongs on the list at all; whether the currency has to be the same one we'd use if supply were unlimited — i.e. whether equality is the whole story here or just triage on top of something else; whether the metric has to avoid ranking whole lives as better or worse in a way that demeans the people being ranked; and whether administrability is a real desideratum or just a grubby concession to the fact that we're a committee with a deadline.

  At the very end, and briefly — one short paragraph or a compact table, no bibliography and no citations, I know the names and I don't want a reading list — score the big families of views against your own list: resources or primary goods, welfare or opportunity for welfare, capabilities and functionings, access-to-advantage and other luck-adjusted views, the relational or no-one-gets-to-dominate view, and plain sufficientarianism. Then tell me which single requirement on your list does the most work in knocking candidates out. Keep at least 80 percent of the answer on the criteria themselves and their motivating cases; the scorecard is an afterthought.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Political philosopher with deep expertise in "equality of what" debates *and* practical mechanism design experience for public agencies.
      *   **Tone:** Messy brainstorming first, then structured. Not polished academic prose, but thoughtful, candid, and specific. "Say so flatly" where non-negotiable, "say why" where unsure.
      *   **Task:** Define the *specification* for a "currency of egalitarian comparison" for a specific allocation problem.
      *   **Context:**
          *   One-shot intervention ("the boost").
          *   Fixed, too-small supply.
          *   Features: One-time, permanent effects, non-transferable, heterogeneous impact (depends on body/circumstances).
          *   No secondary market, no undo.
          *   Need: A currency (metric) and a rule (allocation logic). *Focus is only on the currency.*
      *   **Specific Cases to Handle:** Same bundle/different bodies, Expensive tastes (strategic), Sour grapes (adaptive preferences), Coupled case (interdependent physiology), Time-unit problem (age/duration), Unresponsive applicant (coma), Not-yet-there applicant (future generations), Risk (ex ante/ex post).
      *   **Practical Constraints (treated as requirements):** Computability (limited data), Strategy-proofness (resilient to gaming), Inter-rater reliability (stability).
      *   **Things to Argue:** Responsibility/brute luck, No-envy, Same currency as unlimited supply, Demeaning rankings, Administrability.
      *   **Output Structure:**
          1.  Messy brainstorming (internal monologue style).
          2.  The Spec (Requirements with cases/reasoning, marked Non-Negotiable vs. Preference).
          3.  Incompatibilities (Trade-offs).
          4.  Scorecard of views (brief table/paragraph).
          5.  The "Killer" Requirement.
          6.  Constraint: 80% on criteria/cases, scorecard is minor. No citations/bibliography.

  2.  **Deconstruct the Problem (Philosophical + Mechanism Design):**
      *   *The Core Tension:* Philosophical purity (capturing the "true" moral status) vs. Mechanism viability (getting a number without collapsing the system).
      *   *The "Currency":* It's not just "what matters" (welfare, resources, capabilities); it's "what can we measure and compare to make a decision that sticks."
      *   *The "Boost":* Since it's heterogeneous (depends on body), a resource metric (dollars/hours) fails immediately. Since it's permanent and one-shot, errors are catastrophic.
      *   *The "Committee":* I need to give them a spec that prevents them from proposing nonsense, not just recite Sen vs. Dworkin.

  3.  **Brainstorming the Requirements (Mental Draft):**
      *   *Conversion Sensitivity:* Must account for the "Same bundle, different bodies" case. Resources are out. Capabilities seem better.
      *   *Responsibility:* Expensive tastes. If we reward strategic need, the budget blows up. But if we punish brute bad luck (disabled body), we're cruel. Need a way to distinguish. *Hard to measure.*
      *   *Subjectivity:* Sour grapes. Welfare metrics fail here. People adapt. We need an objective standard of "functioning" maybe?
      *   *Unit of Account:* Who gets the number? The individual? The coupled pair? The fetus? The coma patient? This is an ontology problem.
      *   *Time:* Life-time vs. snapshot. If we do lifetime, we need data we don't have. If snapshot, we ignore the 82-year-old vs 22-year-old difference.
      *   *Admin:* If it requires a medical board to assess every "need," it's too slow. If it's self-reported, it's gamed.
      *   *Demeaning:* If we rank people by "brokenness," do we stigmatize?
      *   *Ex Ante/Post:* We allocate before knowing efficacy. Currency must be based on *expected* capability, not realized.

  4.  **Developing the Spec (Iterative Refinement):**
      *   *Req 1: Conversion Sensitivity.* (Non-negotiable). The currency must measure *effective access*, not *holding*. Case: Wheelchair user vs. Walker user given same cash.
      *   *Req 2: Responsibility Sensitivity.* (Preference/Contested). Case: Expensive tastes. If we ignore this, we invite gaming. But can we measure it? Maybe too hard for this context. *Decision: Mark as Preference because it conflicts with Admin.*
      *   *Req 3: Adaptive Preference Resistance.* (Non-negotiable). Case: Sour grapes. Welfare is out.
      *   *Req 4: Unit Stability.* (Non-negotiable). Case: Coupled/Coma/Future. We need a defined "recipient" unit.
      *   *Req 5: Temporal Aggregation.* (Preference). Case: Time-unit. Lifetime is ideal, snapshot is feasible.
      *   *Req 6: Observability/Computability.* (Non-Negotiable). Case: Admin constraint. If we can't get the number, the philosophy is useless.
      *   *Req 7: Strategy-Proofness.* (Non-Negotiable). Case: Expensive tastes/Gaming.
      *   *Req 8: Non-Stigmatizing.* (Preference). Case: Demeaning rankings.

  5.  **Identifying Incompatibilities (The "Impossible Trinity"):**
      *   *Responsibility Sensitivity + Observability + Strategy-Proofness.* You can't perfectly distinguish brute luck from option luck without invasive inquiry (violates Observability) or self-reporting (violates Strategy-Proofness).
      *   *Lifetime Perspective + Computability.* We don't have lifetime data for 40k applicants.
      *   *Ex Post Fairness + Ex Ante Allocation.* We allocate before knowing the boost's effect.

  6.  **Drafting the Content (incorporating the persona):**
      *   *Voice:* Tired but sharp. Knows the theory but knows the paperwork kills the theory.
      *   *Structure:* Start with the messy thoughts. Then the list. Then the conflicts. Then the scorecard.
      *   *Addressing Specific Prompts:* Ensure "Same bundle," "Expensive tastes," "Sour grapes," "Coupled," "Time," "Coma," "Future," "Risk" are all addressed within the requirements.

  7.  **Refining the "Killer Requirement":**
      *   Which one kills the most theories? *Observability/Computability combined with Conversion Sensitivity.* Resource views fail conversion. Welfare views fail Sour grapes. Capability views often fail Observability. Luck-egalitarianism fails Responsibility measurement.
      *   Actually, *Strategy-Proofness* is the real killer for philosophical nuance. If applicants can game the metric, the metric is broken. This kills most "responsibility-sensitive" views because responsibility is hard to verify.

  8.  **Final Review against Constraints:**
      *   80% on criteria/cases? Yes.
      *   No citations? Yes.
      *   Messy brainstorming first? Yes.
      *   Scorecard brief? Yes.
      *   Address the "argue rather than assume" points? (Responsibility, No-envy, Admin, Demeaning).

      *(Self-Correction during drafting)*: I need to make sure I don't just list the cases but explain *why* they generate a requirement. For example, "Coupled case" isn't just a weird edge case; it demands a requirement about *Unit Individuation*. "Coma case" demands *Proxy/Status Stability*.

      *(Refining the "Responsibility" stance)*: The prompt asks me to argue whether sensitivity to responsibility is a genuine requirement. Given the "Expensive tastes on purpose" case and the "Strategy-proofness" constraint, I should argue it's a *systemic* requirement even if it's philosophically sectarian, because without it, the mechanism collapses. However, measuring it is the bottleneck. I will mark it as "Non-negotiable goal, Preference on method." Actually, better: Mark it as a *Preference* because satisfying it fully violates the Admin constraint. This highlights the trade-off.

      *(Refining "Admin as Grubby Concession")*: I need to argue that Admin is *constitutive* of justice here, not just a concession. If a rule can't be implemented, it doesn't distribute justice, it distributes chaos.

      *(Refining "No-Envy")*: In a one-shot permanent boost, envy is toxic. But standard no-envy assumes transferability. Here, transfer is impossible. So No-Envy needs to be reformulated or dropped. I'll argue it's less relevant than "Non-Domination."

      *(Refining "Demeaning")*: If the currency requires ranking people by "defect," it might violate dignity. This is a real constraint on the *type* of metric (e.g., deficit-based vs. potential-based).

      *(Final Polish)*: Ensure the tone is right. "Hey, look, I've sat in these meetings..." vibe.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Messy Brainstorming / Internal Monologue

  Okay, let's strip this down. I'm looking at a spec sheet for a metric that has to survive contact with reality. Most of the equality-of-what literature assumes a benevolent god with perfect information. I have forty thousand intake forms, a budget that doesn't stretch, and a boost that works differently on a twenty-year-old athlete than on an eighty-year-old with arthritis.

  First thought: **Resources are dead on arrival.** If the boost's effect depends on the body, giving everyone "one boost" (resource equality) is morally blind. The wheelchair user needs the ramp, the walker needs the stairs. If the currency is "units of intervention," we fail the "Same bundle, different bodies" test immediately. So the currency must be *outcome-adjacent*. But we can't measure outcomes ex post because the decision is ex ante. So it has to be *expected capability*.

  Second thought: **Welfare is a trap.** "Sour grapes" kills it. If we measure satisfaction, the broken spirit looks happy. We can't use subjective utility. But if we use objective lists (capabilities), who writes the list? And does ranking people by "functioning" demean them? If I score you as "less capable," am I stigmatizing you as a human? This isn't just hurt feelings; if the metric feels like a judgment on worthiness, trust collapses, and intake data becomes unreliable.

  Third thought: **The Responsibility Nightmare.** "Expensive tastes on purpose." If I reward need, people will manufacture need. Philosophically, luck egalitarians say "compensate brute luck, ignore option luck." Practically? I cannot tell the difference between a genetic metabolic disorder and someone who trained their metabolism to be inefficient to game the system. Not without a medical audit that violates the "Computability" constraint. So, do I drop responsibility sensitivity? If I do, I violate fairness. If I keep it, I violate strategy-proofness. This is the main friction point.

  Fourth thought: **The Unit of Account.** "Coupled case," "Coma," "Not-yet-there." Standard theory assumes a discrete, rational, living agent. I have conjoined physiology, vegetative states, and fetuses. The currency needs a *bearer*. If I can't define who holds the value, I can't compare them. This suggests a requirement for *Ontological Stability*.

  Fifth thought: **Time.** "Time-unit problem." If I maximize lifetime capability, I favor the young. If I maximize current capability, I ignore the future deterioration. Sufficientarianism says "get them over the floor." But if the 82-year-old dies next year, is the boost wasted? The currency needs a *Temporal Horizon*.

  Sixth thought: **Administrability isn't a concession.** It's a justice requirement. A rule that takes six months to calculate per person denies the boost to everyone due to delay. A rule that requires disclosing trauma to get a score re-traumatizes. So *Epistemic Humility* is a constraint. We can't know everything. The currency must be robust to ignorance.

  Okay, I see the shape of it. It's a tug-of-war between Moral Precision and Mechanism Viability. Let's write the spec.

  ***

  ### The Spec: Requirements for the Currency of Comparison

  Here is the list of requirements a candidate currency must meet to be considered adequate for this allocation procedure. I have marked them **Non-Negotiable** (the mechanism fails without them) or **Preference** (desirable but potentially trade-offable depending on the philosophical camp).

  #### 1. Conversion Sensitivity (The "Different Bodies" Requirement)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** The "Same bundle, different bodies" case. If Applicant A and Applicant B receive the same resource (the boost), but Applicant A's physiology converts it into 10 units of functioning and Applicant B converts it into 2 units due to a disability neither chose, a resource-based currency treats them as equal when they are not.
  *   **Why it matters:** The boost is heterogeneous. Its value is not in the *thing* but in the *change it enables*. A currency that measures the input (the boost) rather than the expected output (the capability gain) ignores the moral relevance of conversion factors. If we don't track what people can *do* with the boost, we are not allocating advantage; we are allocating objects.
  *   **Implication:** Rules out Rawlsian Primary Goods or simple Resource Egalitarianism as the direct currency. The metric must be normalized for individual conversion rates.

  #### 2. Adaptive Preference Resistance (The "Sour Grapes" Requirement)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** The "Sour grapes" applicant. Someone reports high satisfaction despite severe deprivation because their expectations have collapsed.
  *   **Why it matters:** If the currency is subjective welfare (utility/satisfaction), this applicant ranks as "well off" and gets deprioritized. This punishes resilience and rewards complaint. It creates a perverse incentive to be dissatisfied. More importantly, it fails to capture the *objective* disadvantage we are trying to remedy. We are allocating a boost to improve lives, not to match reported moods.
  *   **Implication:** Rules out Hedonic Utilitarianism or Preference Satisfaction as the currency. The metric must be based on an objective (or inter-subjectively verified) standard of functioning, not self-reported happiness.

  #### 3. Strategy-Proofness (The "Expensive Tastes" Requirement)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** The "Expensive tastes on purpose" applicant. Someone deliberately cultivates a high-need profile to game the allocation rule.
  *   **Why it matters:** This is where mechanism design bites philosophy. If the currency rewards "need" without distinguishing brute luck from option luck, the system invites moral hazard. If applicants realize that appearing "worse off" yields the boost, the intake data becomes noise. A currency that cannot distinguish (or protect against) strategic misrepresentation collapses under load.
  *   **Implication:** This is the hardest constraint. It demands that the currency rely on *hard-to-fake* indicators. It pushes us away from nuanced "responsibility-sensitive" metrics (which require deep inquiry into choices) toward "brute luck" proxies (which are observable).

  #### 4. Ontological Stability (The "Unit" Requirement)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** The "Coupled case," "Unresponsive applicant," and "Not-yet-there applicant."
  *   **Why it matters:** A currency must have a bearer. In the coupled case, is the unit the pair or the individual? If the currency measures "individual capability," the coupled case breaks the math (interdependent functions). For the coma patient, if the currency requires "agency" or "choice," they score zero. For the fetus, if the currency requires "existence," they don't count.
  *   **Why it matters:** We need a definition of the *recipient* that is stable across these edge cases. If the currency relies on "autonomy," the coma patient is excluded. If it relies on "biological life," the fetus is included but maybe shouldn't be for *this* specific boost.
  *   **Implication:** The currency must be defined over *status* or *potential* rather than *agency*. It must be able to assign a value to a human organism regardless of their current cognitive state, without implying that the coma patient is "worth less" as a person (see Requirement 7).

  #### 5. Temporal Horizon Consistency (The "Time-Unit" Requirement)
  *   **Status:** **Preference** (But high priority)
  *   **The Case:** The "Time-unit problem." 22-year-old vs. 82-year-old. Short bad life vs. long bad life.
  *   **Why it matters:** Do we maximize total lifetime capability (QALYs style) or current capability? If we maximize lifetime, we systematically discriminate against the elderly (they have less time to accumulate the benefit). If we maximize current snapshot, we ignore the 22-year-old who will deteriorate rapidly without intervention.
  *   **Uncertainty:** There is no philosophically neutral answer here. Utilitarians want sum-total. Sufficientarians want "now." Egalitarians might want "lifetime opportunity."
  *   **Implication:** The spec must force the committee to choose a horizon. A currency that doesn't specify *when* the advantage is measured is incomplete. I recommend a "Remaining Lifetime Expectation" metric, but acknowledge this disadvantages the old.

  #### 6. Epistemic Computability (The "Intake" Requirement)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** The practical constraint. 40,000 applicants. No home visits. No invasive audits.
  *   **Why it matters:** This is not just "grubby practicality." If a currency requires information we cannot get (e.g., "counterfactual happiness had you not been disabled"), it is not a currency for *this* job. It is a fantasy. Justice that cannot be calculated is not distributed.
  *   **Implication:** The currency must be derivable from standard intake data (forms, basic medical certification, income records). This kills any view that requires deep psychological profiling or counterfactual history.

  #### 7. Non-Stigmatizing Ranking (The "Demeaning" Requirement)
  *   **Status:** **Preference** (But ethically weighty)
  *   **The Case:** Whether the metric has to avoid ranking whole lives as better or worse in a way that demeans the people.
  *   **Why it matters:** If the currency measures "deficit" (how far you are from normal), it frames the applicants as broken. This can be politically toxic and psychologically harmful. If the currency measures "potential gain" (how much the boost helps), it frames them as investable.
  *   **Argument:** This is not just politeness. If the metric stigmatizes, applicants may hide their need to avoid the label, violating Strategy-Proofness (Req 3). So it has instrumental value. However, some views (like strict prioritarianism) inherently rank the "worse off" higher, which requires defining "worse."
  *   **Implication:** Prefer a currency of *Capacity for Gain* rather than *Depth of Deficit*.

  #### 8. Ex Ante Robustness (The "Risk" Requirement)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** The "Risk" case. We allocate before knowing who responds well.
  *   **Why it matters:** The currency cannot be "actual benefit received" because we don't know that yet. It must be "expected benefit." But if the currency is purely ex ante, we might give the boost to someone who *should* have benefited but biologically doesn't, while someone else who would have benefited more gets nothing.
  *   **Implication:** The currency must be based on *statistical expectation* derived from relevant cohorts, not individual prophecy. This requires the currency to be probabilistic.

  ***

  ### Incompatibilities: The Impossible Triangle

  You asked me to flag subsets of requirements that can't all be satisfied. Here is the central tension. I call it the **Responsibility-Admin-Justice Triangle**.

  **The Conflicting Trio:**
  1.  **Responsibility Sensitivity** (Distinguish brute luck from option luck/Expensive Tastes).
  2.  **Epistemic Computability** (No invasive audits, limited data).
  3.  **Strategy-Proofness** (Applicants can't game the metric).

  **The Exclusion:**
  You cannot have all three.
  *   If you want **Responsibility Sensitivity** (to avoid rewarding expensive tastes), you need to know the *history* of the applicant's condition (did they choose this?). This violates **Epistemic Computability** (we can't audit 40k life histories) and **Strategy-Proofness** (people will lie about their history).
  *   If you want **Computability** and **Strategy-Proofness** (use hard, observable data like diagnosis codes), you lose **Responsibility Sensitivity**. You will end up compensating some "option luck" (bad choices) because you can't tell them apart from "brute luck" (genetics).

  **Which to Drop?**
  For *this* committee, with *this* supply constraint, you must drop **Responsibility Sensitivity** as a strict requirement.
  *   **Cost:** You will occasionally reward someone who made bad choices.
  *   **Gain:** You save the system from collapsing under verification costs and gaming.
  *   **Reasoning:** In a mass allocation context, the error cost of denying a brute-luck victim (because you suspected option luck) is higher than the error cost of aiding an option-luck victim. You have to treat "need" as "status" rather than "history."

  **Secondary Conflict: Temporal Horizon vs. Non-Stigmatizing**
  *   If you choose a **Lifetime** horizon (to be fair to the young), you inherently devalue the **Old** (82-year-old). This can be framed as "demeaning" (Req 7) to the elderly.
  *   **Cost:** Either accept age-discrimination (utilitarian) or accept inefficiency (sufficientarian).
  *   **Recommendation:** Use "Remaining Quality-Adjusted Life Years" but apply a weighting that prevents the elderly from scoring zero.

  ***

  ### Scorecard of Views

  Here is how the standard philosophical families score against the Spec above. (Pass = Meets Non-Negotiables; Fail = Violates Non-Negotiables; Mixed = Meets some, fails others).

  | View Family | Conversion Sensitivity | Adaptive Preference | Strategy-Proof | Computability | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Resources / Primary Goods** | **Fail.** Ignores body/conversion. | Pass. | Pass. | Pass. | **Reject.** Fails the core physical reality of the boost. |
  | **Welfare / Utility** | Pass. | **Fail.** Sour grapes problem. | **Fail.** Incentivizes unhappiness. | **Fail.** Hard to measure accurately. | **Reject.** Morally blind to adaptation. |
  | **Capabilities (Sen/Nussbaum)** | **Pass.** Focuses on function. | **Pass.** Objective list. | Mixed. Hard to measure without intrusion. | Mixed. Complex to calculate. | **Strong Contender.** Needs simplification for Admin. |
  | **Luck Egalitarianism** | Pass. | Pass. | **Fail.** Requires intrusive history checks. | **Fail.** Too data-heavy for 40k apps. | **Reject.** Fails the Admin/Strategy constraint. |
  | **Relational / Non-Domination** | Mixed. Focuses on status, not metric. | Pass. | Pass. | Pass. | **Mixed.** Good for dignity, vague on allocation math. |
  | **Sufficientarianism** | Pass (if defined by capability). | Pass. | Pass (if floor is clear). | Pass. | **Strong Contender.** Best for "triage" logic. |

  ***

  ### The Killer Requirement

  The single requirement that does the most work in knocking candidates out is **Epistemic Computability combined with Strategy-Proofness**.

  It sounds boring, but it is the graveyard of high theory. It kills Luck Egalitarianism immediately because you cannot verify "responsibility" at scale without inviting massive gaming or invasive audits. It kills Welfare views because subjective states are too easy to fake and too hard to verify. It forces you toward a **Capability-Sufficientarian** hybrid: an objective measure of functioning (to handle conversion and sour grapes) that relies on coarse, observable proxies (to handle admin and strategy). You end up measuring "diagnosed limitation + current functional status" rather than "moral worthiness" or "lifetime potential." It's less philosophically satisfying, but it's the only one that actually allocates the boost without the agency imploding.
