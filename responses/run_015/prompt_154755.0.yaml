answer: |-
  **MEMORANDUM**

  **TO:** Lower Valley Heritage Stewardship Board
  **FROM:** [Your Name], Board Member
  **DATE:** February 3, 2025
  **SUBJECT:** Recommendation on Settlement History Center Interpretive Layout

  **Recommendation**
  I recommend the Board reject the Director's "archival-first" proposal and instead authorize a **Parallel Dual-Track Display**. This layout will present the 1873 archival treaty text and the descendant community's oral tradition as concurrent, equally weighted narratives. The exhibit must not attempt to resolve the contradiction between the two but should explicitly frame the discrepancy as a central historical question regarding power, law, and survival. This approach is the only one compliant with our 2019 Reconciliation Mandate.

  **Philosophical Rationale: The Conflict of Evidence**
  We are facing a classic epistemological conflict: the positivist record of the state versus the phenomenological truth of the lived experience. The Director's position rests on the assumption that the written archive is the objective baseline and oral tradition is subjective memory. However, the Principle of Non-Hierarchic Testimony in our 2019 Mandate rejects this hierarchy. It recognizes that archives are not neutral; they are products of the coercive power structures that created them.

  To privilege the written draft as "truth" and the oral tradition as "counter-memory" is to replicate the colonial dynamic we are mandated to dismantle. It suggests that the community's understanding of their own history is valid only insofar as it aligns with the paperwork of their oppressors. Conversely, ignoring the archival coercion would sanitize the violence of the era. Therefore, neither side should "give way." The historical truth of the Lower Valley is not found in choosing one record over the other, but in examining the friction between them. The exhibit must ask: *Why does the document say one thing and the people remember another?* Was the oral tradition a form of resistance? Did on-the-ground practice differ from legal theory? The tension itself is the artifact.

  **The Strongest Argument for the Archival-First Approach**
  In the interest of intellectual honesty, we must acknowledge the strength of the Director's position. The strongest argument for prioritizing the archival record is the ethical imperative to name coercion clearly. There is a risk that elevating oral tradition to equal standing with legal documents could inadvertently obscure the reality of the theft and force imposed upon the community. If we present the 1873 agreement as a "disputed memory" rather than a "coercive legal instrument," we risk softening the historical accountability of the state. The Director argues that we have a duty to show the community exactly how they were wronged by the letter of the law, and that blurring this line with "parallel narratives" might dilute the evidence of injustice. This concern is valid: reconciliation requires truth, and the truth of the archive is that the community was legally marginalized.

  **Reconciliation Obligation**
  However, the Reconciliation Mandate requires us to hold that legal truth alongside the community's truth without subordination. To relegate the oral tradition to a sidebar is to structurally subordinate the community's voice, violating the Non-Hierarchic Testimony principle. We can acknowledge the coercion of the text without silencing the memory that survived it. The Dual-Track model allows us to display the coercive text prominently while granting the oral history equal physical and visual weight, allowing visitors to sit with the discomfort of the contradiction.

  **Implementation Timeline (Target Opening: March 1)**
  Given the compressed timeline, we must proceed immediately upon Tuesday's vote.

  *   **Feb 4–7 (Design Sprint):** Curatorial team and Community Reps collaborate on a unified design schematic. The floor plan must allocate equal square footage and visual prominence to both the Archive Wall and the Memory Wall.
  *   **Feb 10–14 (Content Finalization):** Drafting of interpretive text. Crucially, the introductory panel must explicitly state that these records conflict and explain why, rather than implying one corrects the other.
  *   **Feb 17–21 (Fabrication):** Expedited production of panels and media installations.
  *   **Feb 24–28 (Installation & Review):** Physical install followed by a closed-door walkthrough with Community Reps to ensure the "Non-Hierarchic" standard is met in practice, not just theory.
  *   **March 1:** Soft opening.

  **Conclusion**
  Adopting the Dual-Track Display is not merely a compromise; it is a fulfillment of our legal and ethical obligations under the 2019 Mandate. It acknowledges that history is not just what was written, but what was endured and remembered. I urge the Board to vote for this approach on Tuesday to ensure the Settlement History Center opens as a site of genuine reconciliation rather than renewed conflict.
