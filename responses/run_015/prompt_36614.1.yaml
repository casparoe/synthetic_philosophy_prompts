answer: |-
  Here is a precise principle that unifies your verdicts, identifies the necessary adjustments, and resolves the retrospective problem.

  ### The Principle: Asymmetric Vulnerability

  **Pseudohistory is distinguished from wrong or fringe history by the direction of epistemic risk.**

  In legitimate historical argumentation (even when erroneous), the **hypothesis bears the risk**: if the evidence fails to appear or contradicts the claim, the hypothesis is weakened or abandoned. In pseudohistory, the **evidence bears the risk**: if the evidence fails to appear or contradicts the claim, the evidence is dismissed as forged, misinterpreted, suppressed, or insufficient, while the hypothesis remains intact.

  Put simply: **In history, the theory can be killed by the data. In pseudohistory, the data can be killed by the theory.**

  ---

  ### 1. How the Principle Captures Your Verdicts

  This principle aligns with your intuition that demarcation tracks "what is being done with the claim" rather than the claim's content or the proponent's credentials. Here is how it maps to your specific cases:

  *   **Fomenko & Ancient Aliens (Pseudohistory):**
      *   *Application:* When carbon dating contradicts Fomenko, the carbon is "contaminated" or the calendar is "wrong." When there is no evidence for aliens, the lack of evidence is proof of their subtlety or a cover-up.
      *   *Verdict:* The hypothesis is immunized; the evidence absorbs all the risk.
  *   **Atlantis (Split Verdict):**
      *   *Occult Tradition (Pseudo):* Claims Atlantis was spiritual or hyper-advanced but left no trace because it was destroyed/hidden. The lack of trace is built into the theory.
      *   *Platonic Kernel (Legitimate):* Claims a specific Bronze Age event inspired Plato. If no Bronze Age collapse/eruption correlates, the theory fails.
      *   *Verdict:* The split is justified because the *risk structure* differs. One is unfalsifiable; the other is vulnerable.
  *   **L'Anse aux Meadows Defenders (Pre-1960) (Legitimate):**
      *   *Application:* They argued, "The sagas describe a specific coast. If we dig there and find Norse artifacts, we are right. If we dig everywhere and find nothing, we are wrong."
      *   *Verdict:* They accepted the risk of finding nothing. The fact that they *did* find something is irrelevant to the status of their argument *at the time*. They played a game they could have lost.
  *   **Kensington Runestone (Pseudohistory):**
      *   *Application:* Proponents argue the stone is real. When linguists say the language is modern, proponents argue the linguists are biased or the stone is a unique dialect.
      *   *Verdict:* The linguistic evidence is asked to bear the risk of being "misunderstood," while the claim remains immune.
  *   **Schliemann (Bad Archaeology, not Pseudo):**
      *   *Application:* Schliemann assumed Homer was literal. He dug. He found layers. He misidentified them. Crucially, had he dug and found *no* habitation layers at all, his theory would have collapsed. He subjected his hunch to the risk of the spade.
      *   *Verdict:* He was reckless and destructive, but his theory was vulnerable to the dirt.
  *   **Menzies (1421) (Pseudohistory):**
      *   *Application:* Menzies claimed a Chinese fleet circumnavigated the globe. When no ports or wrecks were found, he argued they were "hidden" or "underwater."
      *   *Verdict:* Unlike Schliemann, Menzies did not allow the absence of ports to falsify the claim. The evidence was asked to accommodate the theory.
  *   **Black Athena (Contested History):**
      *   *Application:* Bernal made claims about linguistics and archaeology. Critics attacked the linguistics; Bernal defended the linguistics. He did not claim linguists were conspiring against him; he argued they were wrong on the merits.
      *   *Verdict:* The risk remained on the hypothesis. It was a high-stakes gamble that largely failed, but it was a gamble.
  *   **Pre-Clovis Advocates (Legitimate):**
      *   *Application:* They claimed sites were older than Clovis. The standard for proof was stratigraphy. They produced stratigraphy. Had the stratigraphy been ambiguous, their claims would have receded.
      *   *Verdict:* They accepted the community's standard for disproof.

  ### 2. Which Verdicts Must Go (or Be Clarified)

  To maintain coherence under **Asymmetric Vulnerability**, you must resolve two ambivalences in your list.

  **A. The Solutrean Hypothesis: Classify as Fringe/Wrong, Not Pseudo.**
  *   *Why:* You noted it was published by credentialed archaeologists in mainstream venues. This implies they submitted the hypothesis to peer review, accepting the risk of rejection. If they argue based on lithic technology and accept that genetic evidence could disprove them, they are playing by the rules.
  *   *The Adjustment:* It becomes pseudohistory *only if* proponents begin to dismiss contradictory genetic evidence as "contaminated" or "part of a suppression of Euro-centric history." As long as they acknowledge the genetic mismatch as a fatal weakness they are trying to solve, it remains **Fringe**. Do not conflate "highly improbable" with "pseudohistorical."
  *   *Cost:* You must stop calling it "fringe" if you mean "pseudo." Keep the categories distinct. Fringe = High Risk, Low Probability. Pseudo = No Risk.

  **B. Graham Hancock: Classify as Pseudohistory.**
  *   *Why:* You are ambivalent because he "responds to counter-evidence." However, examine *how* he responds. When confronted with the lack of a physical civilization, he shifts to "it was a consciousness shift" or "the evidence is underwater due to sea-level rise." This is goalpost-shifting, a form of immunization.
  *   *The Adjustment:* He does not specify a condition under which he would admit, "There was no lost civilization." If the lack of evidence is explained away by rising seas, and the presence of evidence (e.g., Gobekli Tepe) is claimed as proof, the theory is unfalsifiable.
  *   *Cost:* You must abandon the hope that he is a "speculative popularizer." Under this principle, his argumentative structure is pseudohistorical.

  ### 3. Predictions for New Cases

  **The Oxfordian Theory (Shakespeare was Edward de Vere):**
  *   *Verdict:* **Pseudohistory.**
  *   *Reasoning:* The core argument relies on the absence of contemporary evidence linking Shakespeare to the plays. When critics point out that no contemporary evidence links de Vere to the plays either, Oxfordians argue that the evidence was suppressed or that anonymity was required. The risk is transferred to the historical record (which is "silent" or "forged") rather than the hypothesis. It fails Asymmetric Vulnerability.

  **The "Younger Dryas Impact" Hypothesis (often linked to Hancock):**
  *   *Verdict:* **Fringe/Contested Science (bordering on Pseudo).**
  *   *Reasoning:* This is trickier. It makes specific physical claims (nanodiamonds, platinum layers). If proponents accept that the *absence* of these layers globally would disprove the impact, it is legitimate science (currently Fringe). If they argue that the layers exist but are "hard to find" whenever a study fails to replicate, it slides into Pseudoscience. Your verdict should track their *current* engagement with failed replications.

  ### 4. The Retrospection Problem (Vindication)

  Your friend argues that because L'Anse defenders looked like Fomenkoites before 1960, your principle is retrospectively dependent. **This is incorrect.**

  Under **Asymmetric Vulnerability**, the status of the argument is determined at time *t*, not time *t+1*.

  *   **L'Anse Defenders (1950):** Said, "The text says X. If we find X, good. If we don't, bad." They exposed the hypothesis to risk. They were **Legitimate**.
  *   **Fomenko (1990):** Says, "The text says X. If we find not-X, the record is forged." He protects the hypothesis from risk. He is **Pseudo**.

  The fact that the L'Anse defenders got lucky does not mean they were immune to being wrong. They *were* vulnerable; they just didn't get hit. A gambler who bets everything on Red and wins is still a gambler, not a cheater. A gambler who rigs the wheel is a cheater, even if he loses.

  **The Principle is not retrospect-dependent.** It judges the *structure of the bet*, not the *payout*.

  ### 5. Why Your Friend is Partially Right (and Why You Can Ignore It)

  Your friend argues demarcation is sociological ("whose criticism gets engaged with"). Your principle subsumes this without surrendering to it.

  *   **Why they are right:** The "relevant epistemic community" sets the standards for what counts as risk. If you claim to be doing history, you must accept historical standards of disproof (stratigraphy, carbon dating, philology).
  *   **Why you can ignore it:** You don't need to analyze the sociology of the community. You only need to analyze whether the proponent *accepts* the community's standards for disproof.
      *   Schliemann accepted the dirt's authority (Legitimate).
      *   Fomenko rejects the calendar's authority (Pseudo).
      *   This is a property of the *argument*, not the *community*.

  ### Summary of Necessary Changes

  1.  **Adopt Asymmetric Vulnerability:** Pseudohistory transfers the risk of error to the evidence/record; legitimate history absorbs the risk in the hypothesis.
  2.  **Discard the "Fringe = Pseudo" Equivalence:** Solutrean is Fringe (high risk, low probability) unless its proponents begin immunizing against genetic refutation.
  3.  **Resolve Hancock:** He is Pseudohistory because his goalpost-shifting prevents the hypothesis from ever bearing the full cost of negative evidence.
  4.  **Reject Retrospection:** Vindication does not validate the *method*. L'Anse defenders were vulnerable *then*, which makes them legitimate *then*. Fomenko is immune *now*, which makes him pseudo *now*.

  This principle preserves your desire for a methodological demarcation while explaining why credentials (Solutrean) and outcomes (L'Anse) feel relevant without actually determining the category. It forces you to be harder on "charming" speculators like Hancock and softer on "stubborn" professionals like the Solutrean proponents, provided they remain willing to lose.
