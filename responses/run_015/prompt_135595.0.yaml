answer: |-
  # Specification for a Theory of Dispositions

  ## 1. Core Constraints
  *Derived from your stated purpose: underwriting special-science explanation and prediction.*

  | Requirement | Motivation & Reasoning | Status |
  | :--- | :--- | :--- |
  | **C1. Explanatory Non-Circularity** | **Motivation:** The "dormitive virtue" problem. If "fragile" just means "breaks when struck," it cannot explain *why* it broke when struck in a specific instance. The ascription must cite a property distinct from the behavior it predicts.<br>**Reasoning:** Non-negotiable. Without this, dispositional talk collapses into regularity descriptions, failing the purpose of scientific explanation (which requires causal depth). | **Non-Negotiable** |
  | **C2. Empirical Accessibility** | **Motivation:** Scientists gather evidence for dispositions (e.g., testing steel samples). A theory that makes dispositions in-principle undetectable (occult) renders scientific practice inexplicable.<br>**Reasoning:** Non-negotiable, but requires careful formulation to avoid verificationism (see Meta-Analysis). | **Non-Negotiable** |

  ## 2. Structural Distinctions
  *The theory must formally distinguish these categories to avoid collapsing explanatory roles.*

  | Requirement | Motivation & Reasoning | Status |
  | :--- | :--- | :--- |
  | **D1. Possession vs. Manifestation** | **Motivation:** Unmanifested dispositions (a vase never struck).<br>**Reasoning:** Non-negotiable. Special sciences posit properties that exist prior to and independent of their testing conditions. A theory equating possession with manifestation eliminates prediction. | **Non-Negotiable** |
  | **D2. Disposition vs. Causal Basis** | **Motivation:** Multiple realizability (brittleness in glass vs. steel).<br>**Reasoning:** Non-negotiable. Special science kinds are functional; they must be identifiable across different microstructural bases. Collapsing disposition into basis loses the generalization required for explanation. | **Non-Negotiable** |
  | **D3. Mask vs. Absence** | **Motivation:** A fragile object wrapped in bubble wrap (masked) vs. a rubber ball (no disposition).<br>**Reasoning:** Non-negotiable. Explanation requires knowing if the failure to manifest is due to context (mask) or nature (absence). | **Non-Negotiable** |
  | **D4. Enabler vs. Interferer** | **Motivation:** Oxygen enables combustion; water interferes with it.<br>**Reasoning:** Non-negotiable. Predictive models require distinguishing background conditions necessary for manifestation from those that prevent it. | **Non-Negotiable** |
  | **D5. Single-Track vs. Multi-Track** | **Motivation:** Solubility (dissolves in water, acid, etc.) vs. a specific reaction.<br>**Reasoning:** Preference/Utility. While single-track is ontologically simpler, special science properties are often multi-track. A theory *must* accommodate multi-track without multiplying entities unnecessarily. | **Non-Negotiable** (for utility) |
  | **D6. Genuine Disposition vs. Accidental Uniformity** | **Motivation:** All coins in my pocket are silver (uniformity) vs. Copper conducts (disposition).<br>**Reasoning:** Non-negotiable. Only the latter supports counterfactuals and explanations. This is the core of C1. | **Non-Negotiable** |

  ## 3. Case-Handling Requirements
  *The theory must resolve these cases without ad-hoc clauses.*

  | Requirement | Motivation & Reasoning | Status |
  | :--- | :--- | :--- |
  | **R1. The Fink/Mimic Resolution** | **Motivation:** Finks (disposition lost upon stimulus) and Mimics (breaks without disposition).<br>**Reasoning:** Non-negotiable. Standard conditional analyses fail here. The theory must ground the disposition in the object's state *at the time of stimulus*, independent of extrinsic monitors. | **Non-Negotiable** |
  | **R2. Intrinsic Masking (Self-Healing Slab)** | **Motivation:** A composite that cracks but repairs instantly. The interferer is internal.<br>**Reasoning:** Non-negotiable. The theory must distinguish whether the repair mechanism is a *mask* (disposition present, output blocked) or a *basis modification* (disposition absent because the microstructure lacks the instability). This turns on whether the "brittleness" basis and "repair" basis are compatible co-occupants or mutually exclusive states. | **Non-Negotiable** |
  | **R3. Manifestation Temporality (Late Fink)** | **Motivation:** A crack initiates but is reversed before detection.<br>**Reasoning:** Non-negotiable. The theory must define whether manifestations are instantaneous events or processes with temporal parts. If the latter, it must account for "interrupted" manifestations to explain why the object *was* fragile even if it didn't *end up* broken. | **Non-Negotiable** |
  | **R4. Probabilistic Grading (Chancy Fink)** | **Motivation:** A device prevents breaking 90% of the time.<br>**Reasoning:** Non-negotiable. Special science dispositions are often probabilistic (radioactive decay, mutation). The theory must allow for degrees of possession or probabilistic conditionals without reducing the disposition to the statistical frequency alone (avoiding C1 violation). | **Non-Negotiable** |
  | **R5. Dispositions to Acquire/Lose Dispositions** | **Motivation:** Hardening steel (acquiring brittleness), tempering (losing it).<br>**Reasoning:** Preference/Utility. Higher-order dispositions are common in materials science. A theory that cannot handle second-order properties limits its explanatory scope in engineering contexts. | **Preference** (High Utility) |

  ## 4. Ontological & Grounding Requirements
  *Constraints on the metaphysical machinery.*

  | Requirement | Motivation & Reasoning | Status |
  | :--- | :--- | :--- |
  | **O1. No Gerrymandering** | **Motivation:** Prevents "disposition to shatter if struck while a demon sneezes."<br>**Reasoning:** Non-negotiable. Scientific kinds must be projectible. If every S-M pair yields a disposition, the concept loses explanatory power (violates C1). The theory needs a principle of *naturalness* or *causal relevance* to filter stimuli. | **Non-Negotiable** |
  | **O2. Grounding without Regress** | **Motivation:** Dispositions need a basis, but if the basis is also purely dispositional, we risk regress.<br>**Reasoning:** **Preference.** This is the metaphysical fault line. A theory can stop at categorical bases (Lockean), stop at primitive powers (Dispositional Essentialism), or accept a holistic web (Structuralism). For special science purposes, *stability* of the basis is required, not necessarily its categoricity. | **Preference** |

  ---

  # Meta-Analysis of the Specification

  ### 1. Non-Negotiable vs. Camp Preference
  *   **Non-Negotiable:** Requirements C1, C2, D1–D6, R1–R4, O1. These flow directly from the requirement to support scientific explanation and prediction. If a theory cannot distinguish a mask from an absence (D3), it cannot explain why a protected girder didn't fail while an unprotected one did. If it allows gerrymandering (O1), it cannot predict which stimuli are relevant.
  *   **Camp Preference:** Requirement O2 (Grounding without Regress) and D5 (Multi-Track strictures).
      *   **O2:** Whether the basis is categorical or dispositional is a metaphysical choice, not a scientific one. Science requires the basis to be *stable* and *investigable*, not necessarily non-dispositional.
      *   **Reduction to Categorical Bases:** This is a camp preference (Humean/Lewisian). It is not required for the special sciences, which often treat micro-structures functionally.
      *   **Fundamentality of Powers:** This is a camp preference (Aristotelian/Mumford). Science can use dispositions instrumentally without committing to them as fundamental ontological constituents.
      *   **Compatibility with Humean Laws:** Preference. A theory of dispositions can be compatible with Humean supervenience (as properties summarizing regularities) or Anti-Humean (as generating regularities). Both can underwrite prediction, though explanation differs.

  ### 2. Incompatibilities within the Specification
  **The Tension: C2 (Empirical Accessibility) vs. D1 (Unmanifested Possession).**
  *   **Argument:** If a disposition is defined by its manifestation conditions, but can exist without ever manifesting (D1), how is it empirically accessible (C2)?
  *   **Resolution:** The theory must distinguish *definition* from *evidence*. Accessibility cannot mean "direct observation of manifestation." It must mean "inference to the best explanation from structural data or proxy tests."
  *   **Risk:** If C2 is interpreted strictly (Verificationism), D1 becomes impossible. If D1 is interpreted strictly (Realism about unmanifested), C2 becomes difficult. The theory must navigate this by allowing *structural* evidence (e.g., microscopes showing crystal lattice) to count as checking the disposition, even without breaking the object.

  ### 3. Most Exclusionary Requirement
  **C1 (Explanatory Non-Circularity).**
  *   **Reasoning:** This requirement excludes the **Simple Conditional Analysis (SCA)** immediately. SCA defines fragility as "If struck, then breaks." This is circular in an explanatory context (Why did it break? Because it was fragile. What is fragile? It breaks.). It also excludes pure **Regularity Theories**, which reduce dispositions to patterns of events. Any theory that identifies the disposition *solely* with the conditional truth or the behavioral pattern fails to provide the "oomph" needed for scientific *explanation*, even if it suffices for prediction.

  ### 4. Prejudicial Requirement to Delete
  **From Your List: Strict "Checkability" (Constraint 2).**
  *   **Reasoning:** As phrased ("must not make ascriptions in-principle uncheckable"), this verges on verificationism, which is a philosophical prejudice rather than a scientific necessity. Science routinely posits entities that are not directly checkable in isolation (e.g., quarks, singularities) but are inferred via their theoretical role.
  *   **Recommendation:** Replace "Checkable" with **"Theoretically Integrated."** The disposition must play a role in a nomological network that yields testable predictions, even if the disposition itself is not directly observable in every instance. This preserves the spirit of empirical constraint without ruling out robust realism about unmanifested properties.

  ---

  # Brief Scorecard of Candidate Theories

  | Theory | C1 (Non-Circular) | D3 (Mask/Absence) | R2 (Self-Healing) | O2 (Grounding) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Simple Conditional** | **Fail.** Collapses disposition into behavior. | **Fail.** Cannot distinguish mask from absence without ad-hoc clauses. | **Fail.** Predicts "not brittle" (no break), misses internal structure. | N/A | **Rejected.** Fails core purpose. |
  | **Conditional + Interferer** | **Weak.** Explains via "ceteris paribus," which risks emptiness. | **Pass.** Can add "unless masked." | **Fail.** Struggles with *intrinsic* masks (is the repair an interferer or part of the basis?). | N/A | **Rejected.** Too fragile for novel cases. |
  | **Basis-Identity (Reductive)** | **Pass.** Disposition = Microstructure. | **Pass.** Mask = External to microstructure. | **Pass.** Slab = Complex microstructure (brittle + repair). | **Pass.** Stops at categorical. | **Viable.** But struggles with Multiple Realizability (D2). |
  | **Powers / Potentiality** | **Pass.** Disposition is a real property distinct from manifestation. | **Pass.** Mask blocks power; Absence lacks power. | **Pass.** Competing powers (fracture vs. repair) within one object. | **Fail/Preference.** Accepts dispositional basis (regress risk for some). | **Viable.** Best fit for explanation, metaphysically costly. |

  **Conclusion:** The **Powers/Potentiality** account best satisfies the explanatory constraint (C1) and handles the novel cases (R2, R3) by treating dispositions as real, competing causal contributors. However, the **Basis-Identity** account is sufficient if one prioritizes metaphysical parsimony over causal realism, provided it can handle multiple realizability. The **Conditional** accounts fail the specification's primary purpose.
