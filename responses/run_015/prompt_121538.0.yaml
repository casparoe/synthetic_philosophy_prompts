answer: |-
  Here is the breakdown using your three-axis framework (0 = None/Continuity, 3 = Total/Disappearance).

  ### 1. Late Bronze Age Collapse (Eastern Mediterranean)
  *   **Structural Amnesia: 3** (Palace bureaucracies vanished, Linear B writing was lost entirely, and specialized craft knowledge disappeared for centuries).
  *   **Material Decoupling: 3** (International trade networks shattered, urban centers were depopulated or destroyed, and economic complexity reverted to subsistence levels).
  *   **Narrative Rupture: 2** (Successor cultures like the Greeks entered a "Dark Age" with only mythic memory of the prior era, though neighboring Egypt persisted and recorded it as a victory rather than an end).
  *   **Shakiest Axis:** **Narrative Rupture** (It wasn't a universal ending; while the Aegean forgot, the Levant and Egypt continued, making the "rupture" geographically uneven).

  ### 2. Classic Maya Lowland Abandonment
  *   **Structural Amnesia: 3** (The specific institution of Divine Kingship and the associated monument-building culture in the southern lowlands ceased completely).
  *   **Material Decoupling: 3** (Massive population decline in the southern cities, agricultural terraces were abandoned, and major urban nodes were reclaimed by the jungle).
  *   **Narrative Rupture: 1** (The Maya people did not vanish; Post-Classic populations in the north thrived, and modern Maya communities view this as a migration or shift rather than an extinction).
  *   **Shakiest Axis:** **Narrative Rupture** (Western observers treat it as a "mystery ending," but the descendant population maintains strong cultural continuity, contradicting the idea of a definitive break).

  ### 3. Easter Island (Rapa Nui) Ecological Story
  *   **Structural Amnesia: 2** (The chiefly clan system and statue culture changed or halted, but social organization persisted through the transition to the Birdman cult).
  *   **Material Decoupling: 1** (Recent archaeology suggests the pre-contact population was stable; the drastic shrink occurred mostly post-contact due to disease and slaving, not internal economic collapse).
  *   **Narrative Rupture: 1** (While the Western "ecocide" narrative frames it as a cautionary tale of ending, the Rapa Nui people themselves maintain an unbroken identity and presence on the island).
  *   **Shakiest Axis:** **Material Decoupling** (The core premise of the "ecological story"—that the economy shrank due to resource exhaustion—is the most heavily contested and likely incorrect part of the collapse narrative).

  ### 4. The "Transformation/Resilience" Thesis
  *   **Structural Amnesia: 0** (Argues that institutions adapt and reconfigure rather than forgetting how to function).
  *   **Material Decoupling: 0** (Posits that economies shift nodes or scale down voluntarily rather than suffering involuntary shrinkage).
  *   **Narrative Rupture: 0** (Explicitly argues that "endings" are historiographical illusions and that populations perceive continuity even through crisis).
  *   **Shakiest Axis:** **Structural Amnesia** (It is difficult to empirically prove that knowledge *wasn't* lost during transitions, as adaptation often looks like forgetting from the outside).

  ***

  ### Tier List: Most Collapsed to Least Collapsed

  **Tier 1: Late Bronze Age Collapse**
  This was a systemic hard reset where writing, trade, and political complexity vanished from the historical record for centuries.

  **Tier 2: Classic Maya Lowland Abandonment**
  The political superstructure and urban centers died, but the culture and people successfully relocated and persisted.

  **Tier 3: Easter Island's Ecological Story**
  Significant cultural changes occurred, but the purported economic and population crash is largely a mythologized exaggeration of post-contact tragedies.

  **Tier 4: The Transformation Thesis**
  As a theoretical model, this represents the baseline of zero collapse, framing all societal changes as continuous evolution rather than rupture.
