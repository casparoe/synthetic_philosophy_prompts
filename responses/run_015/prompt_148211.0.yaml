answer: |-
  # Specification for an Account of Molyneux's Problem

  ## I. Purpose and Scope
  This document specifies the necessary conditions for any theoretical account of Molyneux's Problem. The purpose is practical: to guide experimental design and interpret outcomes regarding the mind's capacity for cross-modal transfer. An account is adequate only if it provides an experimenter with operational criteria for success and failure, and maps those outcomes to specific claims about mental architecture.

  ## II. Non-Negotiable Requirements
  These requirements must be met by any account claiming to address the problem, regardless of theoretical allegiance (empiricist, rationalist, or pragmatist).

  **1. Operationalization of "Recognition"**
  *   **Requirement:** The account must define "recognizing the cube" in terms of observable behavior distinct from verbal report.
  *   **Consideration:** Verbal reports of "looking like" are confounded by language acquisition and meta-cognitive hesitation. Behavioral sorting (picking up the cube when asked) is the primary datum.
  *   **Stipulation 1 Compliance:** In the case of dissociation between performance and phenomenology, the account must rule definitively.
      *   *Ruling:* A patient who sorts correctly but denies qualitative resemblance counts as a **"Yes"** (successful transfer). A patient who reports familiarity but sorts at chance counts as a **"No"** (failed transfer).
      *   *Why:* The original question asks if the subject can *distinguish* the objects ("know which is which"), not if the qualia match. Functional discrimination proves the spatial concept is active; phenomenological mismatch suggests the *format* differs, but the *reference* is shared.

  **2. Evidential Weighting of Clinical Data**
  *   **Requirement:** The account must explicitly state which clinical findings confirm or refute the hypothesis, assigning a confidence interval to each based on known confounds.
  *   **Consideration:** Sight-restoration cases (e.g., cataract removal) are uncontrolled, rare, and involve patients with prolonged visual deprivation and potential retinal deficits.
  *   **Stipulation 3 Compliance:**
      *   *Confirmation of "Yes":* Immediate, untrained correct sorting upon first opening of eyes (within minutes).
      *   *Refutation of "Yes":* Immediate failure followed by correct sorting only after days of active manipulation.
      *   *Weight:* Immediate success bears high weight for innate/amodal capacity. Delayed success bears low weight for the specific Molyneux question (which specifies "at first sight"), serving instead as evidence for rapid learning.
      *   *Confounds:* The account must adjust for low-level visual deficits (e.g., inability to perceive corners) which mimic high-level conceptual failure.

  **3. Directionality of Transfer**
  *   **Requirement:** The account must declare whether the reverse case (sighted person identifying by touch alone) is equivalent to the forward case.
  *   **Consideration:** Sensory modalities are not symmetric; vision is typically dominant for spatial geometry, while touch is dominant for texture and weight.
  *   **Stipulation 2 Compliance:**
      *   *Ruling:* The reverse arrangement is **not** the same question.
      *   *What turns on it:* If the forward case fails but the reverse succeeds, it indicates modality-specific encoding where vision cannot access tactile data, but touch can access visual spatial maps (or vice versa). Symmetry implies a central amodal repository; asymmetry implies modality-specific processing with one-way translation rules.

  ## III. Camp-Specific Commitments
  These are optional theoretical stances. An account may adopt one, but cannot treat them as universal requirements.

  **1. The Status of Phenomenology**
  *   **Commitment:** An account may claim that phenomenological matching (how it *looks* vs. how it *feels*) is the true test of Molyneux's problem, overriding behavioral sorting.
  *   **Constraint:** If adopted, the account must explain why behavioral success without phenomenological match is insufficient for "knowledge."

  **2. The Definition of Shape**
  *   **Commitment:** An account may stipulate that "cube" refers to a geometric primitive (invariant across modalities) or a functional cluster (vision-cube vs. touch-cube).
  *   **Constraint:** If the latter, the account must explain why the question is not trivially "No" by definition.

  **3. The Time Window**
  *   **Commitment:** An account may argue that "at first sight" allows for a period of cognitive integration (seconds to hours) rather than an instantaneous snapshot.
  *   **Constraint:** This requires a defined threshold for "learning" vs. "unpacking" to avoid moving the goalposts.

  ## IV. Incompatible Requirements
  **Flagged Conflict:** *Mechanism vs. Ontological Neutrality.*

  The specification demands an account explain *how* cross-modal recognition is possible (Requirement 1 & 3) while refraining from presupposing that vision and touch represent the *same* spatial properties (the core dispute).

  *   **The Conflict:** To explain successful transfer (the "Yes" outcome), a theory typically must posit a common currency (e.g., amodal spatial coordinates) into which both modalities translate. However, positing this common currency presupposes the very thing the Empiricist denies (that spatial properties are modality-independent).
  *   **The Impasse:** An account cannot simultaneously provide a mechanistic explanation for immediate recognition *and* remain neutral on whether visual extension and tactile extension are identical properties. It must either:
      1.  Assert identity (begging the question against Empiricism).
      2.  Assert a translation rule (which requires a meta-representation, effectively asserting identity at a higher level).
      3.  Deny the possibility of immediate recognition (siding with Empiricism).
  *   **Resolution for the Experimenter:** The specification requires the account to state explicitly whether it treats "spatial property" as a univocal term. If it does not, it cannot explain the transfer. If it does, it is no longer neutral.

  ## V. Scorecard of Standard Families

  **1. Innate Amodal Spatial Representation**
  *   **Claim:** Vision and touch access a pre-existing geometric module.
  *   **Performance:** Predicts immediate "Yes."
  *   **Failure Point:** Contradicted by clinical evidence (Stipulation 3). Restored-sight patients almost universally fail immediate sorting. To survive, this camp must attribute failure to performance errors (noise) rather than conceptual lack, lowering evidential weight.
  *   **Status:** Fails Stipulation 3 (Clinical Weight).

  **2. Learned Cross-Modal Correlation**
  *   **Claim:** Connection is built via experience associating visual and tactile inputs.
  *   **Performance:** Predicts immediate "No," delayed "Yes."
  *   **Failure Point:** Struggles with the "immediacy" clause of the original problem. If the question allows for rapid inference, this camp wins. If "first sight" is strict, this camp predicts failure. It also struggles to explain why some patients report immediate phenomenological links without behavioral success (Stipulation 1, Case B).
  *   **Status:** Meets Stipulation 3, fails strict reading of Original Question.

  **3. Indeterminacy (Conceptual Relativism)**
  *   **Claim:** The question is meaningless until "same shape" is defined.
  *   **Performance:** Refuses to predict outcome without prior semantic fixation.
  *   **Failure Point:** Violates the Practical Purpose. It tells the experimenter nothing about what to test or what the mind is doing. It dissolves the problem rather than solving it.
  *   **Status:** Fails Purpose (Practical Utility).

  Verdict: The requirement to define cross-modal transfer without presupposing shared spatial properties excludes all three standard families.
