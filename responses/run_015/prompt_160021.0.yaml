answer: |-
  This is a rich vein for a seminar because it forces students to confront the gap between *institutional mechanics* and *moral narratives*. The "egalitarian theatre" objection is a classic hermeneutic of suspicion, but it stops short of asking what makes the theatre possible in the first place.

  Here is a framework to help you structure the discussion, keeping your two constraints (presupposition vs. fit; the envy counterfactual) distinct.

  ### 1. Strict Presuppositions vs. Compatible Narratives
  To get past the "envy database" critique, you need to show that the *mechanism* (the list) is underdetermined by the *motive* (leveling).

  **A. What the Practice Strictly Presupposes (The Logical Necessities)**
  If you ask students, "What *must* be true for this list to exist and function?", they should arrive at these ontological claims, none of which require egalitarianism:
  *   **Income is Public Fact, Not Private Property:** It presupposes that earnings are not merely a contract between employer and employee but a transaction within a social system that the polity has a right to map.
  *   **Legibility is a Public Good:** It assumes a society where the distribution of resources is a matter of common knowledge, akin to a map or a census. (Think James C. Scott's *Seeing Like a State*, but democratized).
  *   **Verification is Possible:** It presupposes that "success" is a quantifiable metric that can be accurately captured by tax data.
  *   **The State is the Trusted Oracle:** It requires a level of trust in the tax authority that exceeds the fear of social exposure.

  **B. What the Practice Merely "Fits With" (The Underdetermination)**
  This is where you break the "egalitarian theatre" deadlock. Show them that the *same list* sustains contradictory political theories.
  *   **The Leveling Narrative (The Student View):** High visibility creates social pressure to conform. It weaponizes shame against the "tall poppy." The goal is to reduce the variance.
  *   **The Meritocratic Narrative (The Counter-View):** High visibility validates the winner. If I see my neighbour earned 10x more, and I know the system is fair, I must concede they contributed 10x more value. Transparency *legitimizes* inequality by proving it isn't the result of corruption or hidden privilege.
  *   **The Civic Republican Narrative:** The goal isn't equality or merit, but the prevention of oligarchy. We publish salaries to ensure no private power becomes so concentrated it can capture the state.

  **Seminar Move:** Ask the students: *Could a radical libertarian meritocracy run this list?*
  *   *Answer:* Yes. If you believe markets are perfectly just, you should want the scores published to show who the heroes are. The fact that the US hides private salaries suggests the US *doesn't* actually believe its own meritocratic rhetoric. Secrecy protects rent-seeking, not merit.

  ### 2. Success, Desert, and Legibility
  The core theoretical friction is between **Privacy as Dignity** (US) vs. **Legibility as Trust** (Nordic).

  *   **The American Contradiction:** The US model creates an *asymmetric transparency*. We hide the worker's pay (protecting the firm's leverage) but reveal the CEO's pay (subjecting them to public scrutiny). This suggests we view executive pay as a *political allocation* of surplus (which requires accountability) but worker pay as a *market price* (which requires secrecy).
  *   **The Nordic Proposition:** By making everyone legible, you remove the "black box" of the market. If success is earned, it should survive the light. If it is resented, it is because the *desert* claim is unverifiable.
  *   **The "Earned Success" Argument:** You cannot have a true meritocracy without a scoreboard. If the American Dream is that anyone can make it, the public has a right to see the standings. Hiding the numbers implies the game is rigged.

  **Key Question for Students:** *Does secrecy protect the individual, or does it protect the structure from being judged by the individual?*

  ### 3. The Envy Counterfactual
  This addresses your second constraint: *If we swapped the implicit theory for one on which envy is never a reason for anything, what would have to change?*

  First, distinguish **Malicious Envy** (I want you to have less) from **Emulative Envy** (I want to have what you have) or **Indignation** (You shouldn't have that).

  If we stipulate that *envy (malicious) is never a valid reason for policy*:

  *   **Does the List Change?** No. The data remains the same. The objective reality of income distribution doesn't shift based on our emotional response to it.
  *   **Does Access Change?** Possibly. If the *only* risk is envy-driven shaming, you might restrict access to researchers or auditors rather than making it a searchable website for neighbours. However, if the goal is *systemic accountability* (checking for discrimination, tax evasion, or corruption), public access is still required to crowdsource the audit.
  *   **Does the Story Change?** **Yes, radically.**
      *   *Current Story:* "Look what they have." (Focus on the individual holder of capital).
      *   *New Story:* "Look how the system functions." (Focus on the distribution curve).
      *   Without envy, the list ceases to be a tool for interpersonal comparison and becomes a tool for **structural diagnosis**. You aren't looking up your neighbour to shame them; you are looking up the aggregate to see if the tax code is working.

  **The Crucial Distinction:**
  If envy is illegitimate, the justification for the list shifts from *social regulation of behaviour* to *epistemic condition for justice*.
  *   *Rawlsian Publicity:* Principles of justice must be public. Can we know if the "Difference Principle" is being met if the data is private?
  *   *Nagel on Concealment:* Thomas Nagel argues that concealment is sometimes required for social cohesion. If we remove envy, do we still need concealment?
      *   *Argument:* Yes, if privacy is a precondition for autonomy.
      *   *Counter-Argument:* No, if autonomy requires knowing the true constraints of one's social position.

  ### 4. Pedagogical Strategy: The "Audit vs. Gossip" Test
  To operationalize this in the seminar, try this exercise:

  1.  **Split the room:** One side argues the list is an **Audit Tool** (Nordic view), the other that it is a **Gossip Column** (US critique).
  2.  **The Pivot:** Ask the "Gossip" side: *Why do we publish the salaries of politicians and CEOs?*
      *   If they say "Because they spend public money," push back: *Corporate CEOs spend shareholder money, which is public capital in a broad sense.*
      *   If they say "Because they have power," push back: *Does a local doctor or small business owner not have power over your life?*
  3.  **The Reveal:** The US system isn't about privacy; it's about **hierarchy**. We publish the top because they are rulers; we hide the bottom because they are subjects. The Nordic system treats income as **civic data**, implying we are all citizens first, earners second.

  **Closing Thought for the Class:**
  The "egalitarian theatre" critique assumes the list is about *feelings* (envy). But political theory is about *structures*. The list transforms income from a measure of *personal worth* (which invites envy) to a measure of *resource allocation* (which invites analysis). The US system keeps income tied to personal worth, which is exactly why it has to be hidden—because if people are their paychecks, and the paychecks don't make sense, the people don't make sense. The Nordic system decouples the two: here is what you earned, now let's discuss if the system that generated that number is just.
