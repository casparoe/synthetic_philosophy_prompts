      *   **Commitment (5): Metric Field Realism.** The metric $g_{\mu\nu}$ is real and dynamic. In GR, this field defines inertial structure.
      *   **Commitment (4): Sophisticated Substantivalism / Structuralism.** Denying primitive identity to points to avoid the Hole Argument.
      *   **Commitment (6): Relational Interpretation of Diffeomorphisms.**

      *   **Core Tension 1: Relationism vs. Metric Realism (1 vs 5).**
          *   Traditional Relationism (Leibniz): Spacetime is *nothing over and above* relations between material objects.
          *   User's View: Metric is real and has DoF *independent* of matter (vacuum solutions exist).
