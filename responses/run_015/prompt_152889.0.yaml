          *   Solution: Deny primitive identity (Structuralism/Sophisticated Substantivalism).
          *   User's Worry: How can the field have dynamics localized at points if points aren't "things"?
          *   *Literature:* This is a technical worry but generally resolved in the literature. Fields are sections of bundles over the manifold. The manifold provides the topological/continuum structure, but points aren't individuated *prior* to the metric/fields. The "metric field" *is* the structure.
          *   *Verdict:* This is less of a tension than the user thinks, provided they adopt "Sophisticated Substantivalism" (Earman) rather than crude Relationism.

