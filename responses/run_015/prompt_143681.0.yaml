answer: |-
  This is a sharp dissection of a messy problem. You have correctly identified that "man-of-his-time" is not a single argument but a bundle of four distinct claims that are often traded out depending on which one is taking fire.

  Here is the mapping of the defense as it was deployed during the June 2020 Parliament Square row, an analysis of which strands hold, and how you can use that distinction to navigate Christmas without reducing it to "it's complicated."

  ### 1. The Four Strands of the Defense
  You identified the four sub-arguments. Here is how they functioned during the statue controversy, and where the load actually sits.

  *   **(1) Universal Consensus ("Nobody knew better"):** This claims that the moral vocabulary to criticize Churchill simply did not exist, or that his views were the baseline.
      *   *Status:* **Broken.** As you noted, this is factually unsustainable. MPs like Aneurin Bevan or Eleanor Rathbone, and figures like Gandhi or Ambedkar, were articulating anti-imperialist and anti-racist critiques *while* Churchill was in power. The government didn't use this argument heavily in 2020 because it's too easy to disprove.
  *   **(2) Comparative Necessity ("Best available tool"):** This claims that regardless of his morals, he was the only figure capable of winning the war. The moral cost of his racism is weighed against the moral cost of a Nazi victory.
      *   *Status:* **Load-bearing.** This is the real engine of the defense. Boris Johnson's statement ("he saved this country") relied entirely on this. It concedes the flaws but argues the *outcome* justifies the commemoration. It shifts the metric from "good man" to "necessary leader."
  *   **(3) Hypothetical Universality ("We'd do the same"):** This claims that modern critics are benefiting from moral progress purchased by men like Churchill, and would have held similar views in 1940.
      *   *Status:* **Weak.** It's a rhetorical shield against hypocrisy charges, but it doesn't justify the statue. It asks for humility, not endorsement.
  *   **(4) Semantic Anachronism ("Words don't apply"):** This claims that calling him a "racist" applies a 2020 definition to a 1940 context where hierarchy was standard statecraft.
      *   *Status:* **Partial.** It's true that "racist" as a pejorative didn't exist then, but the *harm* caused by the views does. This strand is used to deflect the label, not the consequence.

  **The Verdict on the Defense:** In 2020, the government and defenders leaned almost exclusively on **Argument 2 (Comparative Necessity)**. They quietly abandoned Argument 1 because the historical record of dissent is too clear. If you hear someone using Argument 1 today, they are running a weaker version of the defense than the one that actually kept the statue up.

  ### 2. The Colston Discrepancy
  You asked if the "man-of-his-time" defense explains why Colston fell and Churchill stood. The answer is no. If "man-of-his-time" were the consistent standard, both would stand (slave trading was legal and normative in Colston's time) or both would fall (racism and imperialism were normative in Churchill's).

  The difference in treatment reveals that the defense is not about *time*, it is about *function*.
  *   **Colston:** His primary public function was the trade in human beings. The "good" he did (philanthropy) was secondary to the "bad" (slavery). Removing him removes the celebration of the trade itself.
  *   **Churchill:** His primary public function was national survival against totalitarianism. The "bad" (imperial views/famine) is viewed by defenders as a tragic byproduct of his era, secondary to the "good" (defeating Hitler).

  The "man-of-his-time" defense is selectively applied to figures where the **net utility** is judged to be positive. It is not a moral shield; it is a utilitarian calculation. This is why the defense feels inconsistent: because it is. It protects the figures we have decided we still need, not the figures who were merely typical of their era.

  ### 3. Blame vs. Commemoration (The Crucial Distinction)
  This is the lever you need for Christmas. Your brother and the statue defenders are arguing past each other because they are answering different questions.

  *   **The Brother's Question:** "Is Churchill a moral exemplar?" (A question of *Blame/Virtue*).
  *   **The Defender's Question:** "Did Churchill play a necessary historical role?" (A question of *Impact/History*).

  The "man-of-his-time" defense answers the Blame question (mostly) by mitigating personal guilt. It does **not** answer the Commemoration question.
  *   You can accept that Churchill was "of his time" (mitigating blame) but still decide we shouldn't honor him (rejecting commemoration).
  *   Conversely, you can decide he deserves a statue (commemoration) without claiming he was a "good man" (blame).

  **The "Retain and Explain" Model:**
  To answer your question on scoped honoring: Yes, honoring can be scoped. The "Retain and Explain" model (often used in UK museums now) attempts this. It admits the statue is not a verdict on the soul, but a marker of history. However, it requires active context. A statue without a plaque invites simple reverence. A statue with a plaque detailing the Bengal famine invites complex engagement.

  **Whose Time?**
  You asked whose time counts. For the statue defenders, it is **1940**. For the critics, it is **1943** (Bengal) or the **1920s** (Iraq/Middle East). The defense tries to freeze Churchill in 1940 (The Finest Hour). The criticism tries to unfreeze him to show the rest of the timeline. A honest defense must acknowledge the whole timeline, not just the war years.

  ### 4. Where the Defense Goes Quiet
  The "man-of-his-time" defense has a silence you need to be aware of. It cannot tell you **what to do.**
  *   It can explain why he held those views.
  *   It can explain why he won the war.
  *   It *cannot* calculate whether the war victory outweighs the famine deaths in terms of public honor. That is a value judgment, not a historical one.

  When the Prime Minister said the statue stays, he wasn't making a historical claim; he was making a political one about national identity. The "man-of-his-time" defense runs out of road at the point where you have to decide if the "good" outweighs the "bad" for the purpose of *honor*. History can weigh facts; it cannot weigh values.

  ### 5. Strategy for Christmas
  Your brother is right that a mantelpiece is a claim about values. Your Grandad is right that the bust represents survival and liberty. The "man-of-his-time" defense is the wrong tool for this room because this isn't a public square; it's a home.

  In a public square, a statue represents the *State's* view of history. On a mantel, a bust represents a *Family's* memory.

  **The Script:**
  Do not try to adjudicate Churchill's soul. Adjudicate the object's meaning *in this house*.

  1.  **Validate the Brother:** Acknowledge that Argument 1 (everyone thought like that) is false. "You're right that people knew better at the time, and the famine was a catastrophe. Keeping the bust isn't about saying he was right about India."
  2.  **Validate the Grandad:** Anchor the object to the veteran, not the politician. "For Grandad, this wasn't about empire. It was about the man who told him he could fight back when Europe had fallen. This bust is a monument to Grandad's nineteen-year-old self, not Churchill's imperial policy."
  3.  **The Compromise (Retain and Explain):**
      *   **Don't banish it to the garage.** That erases Grandad's experience and validates the idea that Churchill is purely a villain.
      *   **Don't leave it uncontextualized.** That validates the idea that Churchill is purely a hero.
      *   **Say this:** "We keep it on the mantel because this is Grandad's house, and it represents his war. But we acknowledge your point: we don't honor the man's whole life, we honor what he meant to this family. If we keep it, we admit the whole picture. It stays, but we don't pretend he was a saint."

  **Why this works:**
  It moves the debate from **History** (was Churchill good?) to **Memory** (what does this object mean to us?).
  *   Public statues demand civic consensus (which we don't have).
  *   Private artifacts demand family honesty (which you can have).

  If your brother pushes that keeping it is still an endorsement, you can say: "A public statue asks for civic honor. This asks for family memory. We can remember Grandad's liberation without endorsing Churchill's imperialism. If we box it, we silence Grandad. If we keep it without talking about the dark bits, we silence you. Let's keep it and talk about both."

  This uses the "man-of-his-time" insight (that he contains multitudes) without relying on the defense to excuse the man. It accepts the complexity without hiding behind the phrase "it's complicated."
