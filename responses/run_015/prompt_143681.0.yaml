          1.  Validate the user's four-part breakdown.
          2.  Stress-test the four arguments against the 2020 context.
          3.  Tackle the Colston comparison.
          4.  Shift to the Commemoration question (the real issue).
          5.  Provide the Christmas script/advice.
      *   *Refining the "Man-of-His-Time" analysis:* I need to be clear that Argument 1 is the weakest and often a straw man. Argument 2 is the real engine. Argument 4 is the semantic shield.
      *   *Refining the Colston point:* It's not just "man of his time." It's "what was he *for*?" Colston = Trade (Slave). Churchill = War (Survival). The defense holds for Churchill because the "Time" was an existential fight where his leadership is deemed crucial, whereas Colston's contribution was the atrocity itself.
      *   *Refining the Family Advice:* Don't tell the brother he's wrong. Don't tell the Grandad's memory is dishonored. Frame the bust as a *family* artifact, not a *public* statue. Private memory allows for nuance that public stone does not.

  8.  **Final Review against Constraints:**
      *   Did I fact-check the 2020 events? No, treated as given.
