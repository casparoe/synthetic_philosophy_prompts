answer: |-
  This is a sophisticated diagnosis of a genuine impasse in contemporary value theory. Your hypothesis—that the parties are answering different questions under the banner of "commensurability"—is correct, but it is only the surface of a deeper structural conflict. The stalemate is not merely verbal, nor is it resolvable by empirical data. It is a **meta-axiological clash between competing formal constraints on rational choice.**

  Specifically, the disagreement is about whether the **Archimedean Axiom** of standard utility theory is a necessary condition for normative coherence or a distortion of moral reality.

  Here is a diagnosis of the disagreement, an analysis of the hidden formal questions, and an assessment of what would actually constitute progress.

  ### 1. The Diagnosis: Axiomatic Conflict, Not Verbal Ambiguity

  Your study group is stuck because they are treating this as a dispute about *magnitude* (how much pain equals how much pleasure) when it is actually a dispute about *structure* (what kind of mathematical object represents value).

  **The Continuous-Scale Theorists (CST)** are committed to the **Archimedean Property**. In standard decision theory (e.g., von Neumann-Morgenstern), this axiom states that for any two outcomes $A$ (better) and $B$ (worse), there is some probability $p$ (or some quantity $n$) such that a mixture involving $B$ is preferable to $A$. In the context of welfare, this implies that for any finite amount of suffering, there exists *some* quantity of pleasure that outweighs it. To the CST, denying this looks like irrationality: it opens the agent to "money pumps" or makes rational choice impossible in boundary cases. When they ask for the "empirical parameter," they are essentially asking: "If you deny the Archimedean property, what formal rule replaces it to prevent choice paralysis?"

  **The Lexical-Threshold Theorists (LTT)** are committed to **Lexicographic Ordering**. They argue that value space is not a single continuous line ($\mathbb{R}$) but a multi-dimensional vector space where certain dimensions (severe suffering) dominate others (pleasure) regardless of magnitude. To the LTT, the CST's demand for a trade-off parameter is a **category mistake**. They are not saying the ratio is infinity; they are saying the operation of addition is undefined across the threshold.

  **Why your hypothesis is partially right:** You noted the split between "axiological currency" and "deliberative trade-offs." This maps onto the distinction between **ontological commensurability** (do pain and pleasure belong to the same genus?) and **decision-theoretic representability** (can we model choices involving them using a single utility function?).
  *   The CST assumes that if you can choose between them, they must be commensurable on a single scale.
  *   The LTT assumes that moral constraints can veto aggregation even if comparison is possible.

  **Why it goes deeper:** It is not just verbal. Even if you define "commensurable" perfectly, the CST will say, "A value structure that violates continuity cannot guide action in a complex world," and the LTT will say, "A value structure that allows torture to be offset by tickles is morally monstrous." This is a clash of **reflective equilibria**. One side prioritizes formal coherence (CST); the other prioritizes deontological constraints within a consequentialist framework (LTT).

  ### 2. The Hidden Formal Question: Representability and Continuity

  You asked if there is a hidden formal question. **Yes.** It is the question of **Utility Representability without Continuity.**

  Standard utility representation theorems prove that if a preference relation satisfies certain axioms (Completeness, Transitivity, Independence, and **Continuity**), it can be represented by a real-valued utility function $U: X \to \mathbb{R}$.
  *   **The CST Argument:** "If you cannot represent your values with a real-valued function, you do not have a coherent preference ordering. You are susceptible to Dutch Books or money pumps. Therefore, lexical thresholds are irrational."
  *   **The LTT Counter:** This relies on the assumption that *only* real-valued functions are coherent.

  **Progress here requires non-Archimedean Decision Theory.**
  Mathematicians and decision theorists (e.g., work by Hausner, Wendt, or more recently in AI safety alignment) have developed **lexicographic probability systems** and utility functions over **hyperreal numbers** or **surreal numbers**. These frameworks allow for infinitesimals and infinite magnitudes.
  *   In a hyperreal framework, you *can* have a single utility function where severe suffering is represented by an infinite negative number (or a number in a higher order of magnitude) and pleasure by finite positive numbers. No finite sum of pleasure equals the infinite negative.
  *   **The Stalemate Point:** The CST will argue that hyperreals are mathematically coherent but *normatively useless* because they don't yield clear action guidance in probabilistic scenarios (e.g., a 0.0001% chance of torture vs. 100% chance of bliss). The LTT argues that the lack of "clean" action guidance is a feature, not a bug—it reflects the gravity of the constraint.

  ### 3. Analysis of the Arguments: Cases, Aggregation, and Intuition

  To move your paper forward, you must categorize how each side uses evidence.

  **A. Extreme Cases (The Intuition Pump)**
  *   **LTT:** Uses the "Torture vs. Specks of Dust" case (Parfit). They argue that our intuition recoils at trading one person's torture for any number of people having a mildly pleasant day. They claim this reveals a **qualitative discontinuity**.
  *   **CST:** Uses the "Fanaticism" or "Sadistic Conclusion" case. They argue that if pain is lexically prior, we must prioritize preventing a minor headache for everyone in the universe over preventing one person's extreme torture (if the headache count is high enough but below the threshold, while the torture is above). They claim lexicality leads to **aggregation paralysis** or counterintuitive prioritization of trivialities over catastrophes.
  *   **Diagnosis:** Both sides are using *reductio ad absurdum*. Neither side can win on intuition alone because the intuitions conflict. The LTT intuition is deontological (rights/constraints); the CST intuition is aggregative (total welfare).

  **B. Aggregation**
  *   **LTT:** Views aggregation as bounded. You can aggregate pleasures, and you can aggregate pains, but you cannot net them against each other across the threshold.
  *   **CST:** Views aggregation as unbounded. Value is additive.
  *   **Diagnosis:** This is the substantive core. Is value *additive*? The CST assumes additivity is required for rationality. The LTT assumes additivity is a modeling convenience that fails at the limits.

  **C. The Role of Intuition**
  *   **CST:** Treats intuition as data to be smoothed by a function. If the intuition implies a discontinuity, the intuition is likely a heuristic bias (e.g., loss aversion, scope neglect).
  *   **LTT:** Treats intuition as a direct perception of moral truth. The "recoil" from torture-trade-offs is epistemic evidence of lexical value.
  *   **Diagnosis:** This is a meta-ethical disagreement. The CST is more naturalistic/empiricist about value; the LTT is more rationalist/intuitionist.

  ### 4. What Would Count as Progress?

  Do not expect the dispute to be "solved" in the sense that one side concedes. However, you can define progress in your paper by shifting the terrain from "who is right" to "what are the costs of each framework."

  **1. Formal Progress: Coherent Lexical Choice**
  Progress would be demonstrating that lexical thresholds *can* be represented in a decision framework that avoids money pumps and paralysis.
  *   *Action:* Cite work on **non-Archimedean utility theory**. If you can show that a lexical view can be made formally coherent (i.e., it is not "irrational" in the decision-theoretic sense), you undermine the CST's strongest weapon.
  *   *Limit:* This does not prove the lexical view is *correct*, only that it is *permissible*.

  **2. Conceptual Progress: Distinguishing "Currency" from "Convertibility"**
  Your hypothesis about "axiological currency" is the best path for conceptual progress.
  *   *Proposal:* Argue that pain and pleasure might share a currency (both are phenomenal states affecting welfare) but lack **convertibility** above a threshold. Analogize to economics: Labor and capital are both inputs (currency), but there may be regulatory constraints (thresholds) preventing the trade of one for the other (e.g., slavery).
  *   *Benefit:* This allows the CST to keep their unified ontology while allowing the LTT to keep their practical constraints. It reframes the "threshold" not as a metaphysical discontinuity in value, but as a **normative constraint on aggregation**.

  **3. Meta-Ethical Honesty: The "Bedrock" Conclusion**
  You must be honest that this may be a **fundamental normative disagreement**.
  *   If the CST values **Completeness** (every option is comparable) and the LTT values **Lexical Priority** (some harms are veto-wielding), these are competing axioms.
  *   *Progress:* Acknowledging that the choice between them is not empirical but **axiomatic**. The question becomes: "Which axiom are we willing to violate to preserve our moral intuitions?"
      *   Violate Continuity to save the intuition that torture is unforgivable? (LTT)
      *   Violate Lexical Priority to save the intuition that rational choice requires comparability? (CST)

  ### 5. Recommendation for Your Paper

  Do not try to resolve the dispute. Instead, diagnose the **category error** committed by the Continuous-Scale Theorists when they demand an "empirical parameter."

  **Thesis Suggestion:**
  *"The stalemate in negative utilitarianism arises not from ambiguity, but from the Continuous-Scale camp's illicit demand that normative structure conform to the Archimedean axioms of real-valued utility theory. Progress requires decoupling 'axiological commensurability' from 'decision-theoretic continuity.' By adopting a non-Archimedean formalism, we can preserve the lexical intuition without abandoning coherent choice, revealing the dispute to be a choice between competing axioms of rationality rather than a discoverable fact about value."*

  **Key Moves to Make:**
  1.  **Grant the CST their math:** Admit that standard utility theory requires continuity.
  2.  **Challenge the CST's normativity:** Ask *why* moral value must obey the axioms of economic rationality. Is the Archimedean property a truth about *goodness*, or just a convenience for *modeling*?
  3.  **Elevate the LTT's formalism:** Show that lexicality is not "mystical" but mathematically representable (via hyperreals or lexicographic vectors), thereby neutralizing the charge of irrationality.
  4.  **Conclude on Axiomatic Choice:** Conclude that the "threshold" is not a feature of the world to be measured, but a normative commitment to be chosen. The debate stalls because both sides think they are describing the *same* object (utility), when they are actually proposing *different* structures for moral reasoning.

  **Final Verdict:**
  Nothing empirical will move this dispute. No brain scan will show a "lexical discontinuity." Progress lies in showing that the Lexical view is **formally coherent** (countering the irrationality charge) and that the Continuous view is **normatively costly** (countering the neutrality claim). If you can show that the "threshold" is a legitimate axiomatic choice rather than a confusion, you will have advanced the literature.
