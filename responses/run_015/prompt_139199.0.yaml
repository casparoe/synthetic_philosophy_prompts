answer: |-
  You are wrestling with Langdon Winner's 1980 essay *"Do Artifacts Have Politics?"* — specifically his distinction between artifacts that are *compatible* with certain political systems and those that *require* or *strongly encourage* specific power structures. Your roommate is taking the "substantive theory of technology" (technology is neutral) side, while you are intuitively siding with Winner's "social construction of technology" (technology embodies values).

  Your draft principle is close, but you are right to worry about the "rebuilding the world" clause. It creates a "boundary problem": if fixing the politics requires changing the world, then *everything* is political because everything exists in the world. To save your intuitions (especially the Stoop vs. App distinction), you need to distinguish between **internal constraints** (built into the thing) and **external preconditions** (required to use the thing).

  Here is a precise formulation that captures your verdicts, solves your "sketchy clause" anxiety, and handles the new cases.

  ### The Principle of Constitutive Asymmetry

  > **An artifact has a politics when its material or logical design creates a durable, asymmetric friction in access or agency that maps onto a socially salient category (class, ability, race, etc.), where that friction is constitutive of the artifact's interface rather than contingent on external infrastructure.**

  ### Why This Principle Works (Clause by Clause)

  1.  **"Durable, asymmetric friction..."**
      *   **Motivating Case:** The **Photocopier**.
      *   **Why:** A photocopier imposes friction (you have to press buttons), but it is *symmetric*. It works the same for a dissident as it does for the state. It does not inherently favor one group's *access* over another's. This clause forces you to keep your "No" verdict here. The politics is in the *act* of copying, not the *machine*.
  2.  **"...that maps onto a socially salient category..."**
      *   **Motivating Case:** The **Low Overpasses**.
      *   **Why:** A speed bump slows everyone down; that is mere inconvenience. An overpass that blocks buses but lets cars through maps onto *class* (bus riders vs. car owners). This distinguishes political barriers from mere technical limitations.
  3.  **"...constitutive of the artifact's interface..."**
      *   **Motivating Case:** The **Front Stoop** vs. The **Video Call App**.
      *   **Why:** This solves your "rebuilding the world" anxiety. The Stoop's steps are *constitutive* of the entry interface; the barrier is inside the building's design. The Video App's exclusion is *contingent* on external broadband infrastructure. The app transmits data perfectly; the *network* fails. By locating the politics in the *interface* rather than the *ecosystem*, you can say the Stoop is political (Yes) and the App is not (No), even though both exclude people.
  4.  **"...rather than contingent on external infrastructure."**
      *   **Motivating Case:** The **50 Years Later Overpasses**.
      *   **Why:** This addresses your uncertainty. If the city bans cars and only runs buses, the overpass now blocks *everyone* equally. The asymmetry vanishes. The friction is no longer mapping onto a social category; it is now a universal barrier.

  ### The Verdicts You Must Give Up (or Solidify)

  This principle is mostly friendly to your list, but it forces your hand on two specific points:

  1.  **The "50 Years Later" Overpasses:** You said you "genuinely don't know." The principle forces a **No**. If the overpass blocks the *only* allowed vehicles, it is no longer a tool of segregation; it is merely a tunnel. The politics dissolves when the asymmetry dissolves, even if the bricks remain the same. This supports your professor's hint that the politics lies in the *system* (parkway + vehicles), not just the bridge.
  2.  **The Video Call App:** You said **No**, and the principle supports this *if* you view broadband as external infrastructure. However, be warned: a strict Winnerian might argue that *choosing* not to build a dial-in feature is a design choice constitutive of the app. If you want to keep your "No," you must hold firm that the app is a *client* dependent on the *network*, and the politics lies in the network regulation, not the code.

  ### Predictions for Your New Cases

  Here is how the Principle of Constitutive Asymmetry rules on the cases you didn't list:

  **1. A chatbot's default persona written into a system prompt**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** The system prompt creates *asymmetric friction* in discourse. If the default persona is "helpful, polite, corporate-safe," it favors users who communicate in that register and disadvantages those who use slang, dialect, or confrontational styles. This is *constitutive* of the interface (you cannot chat without the prompt working in the background). It maps onto social categories (education, culture, power).

  **2. A phone's autocorrect dictionary**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** This is a classic case of "inherited politics" like your Stoop. If the dictionary corrects AAVE (African American Vernacular English) to standard white English, it imposes *asymmetric friction* on Black users. It forces them to fight the tool to express their identity. The friction is *constitutive* of the typing interface.

  **3. Smart package lockers that need a smartphone app (elderly neighbor can't use)**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** This is the one you were flip-flopping on. The principle says **Yes**. The requirement for a smartphone is *constitutive* of the locker's interface (there is no key, no code, only the app). It creates *asymmetric friction* based on age/tech-literacy. Unlike the video app (which needs internet *outside* the app), the locker *itself* refuses to open without the specific tool. This is a material delegation of access that excludes a specific social group.

  ### Summary for Your Roommate

  When your engineer roommate says "artifacts just have load paths," you can tell him he is describing the *physics*, not the *affordance*. The Principle of Constitutive Asymmetry argues that **load paths are never socially neutral when they bear unevenly on human bodies.** The overpass holds the weight of a car but not a bus; the locker holds a package but not a key. When those physical constraints align with social hierarchies, the load path *becomes* a power structure. You don't need to claim the steel has opinions; you only need to claim that the steel settles arguments about who belongs where.
