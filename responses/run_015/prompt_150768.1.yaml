prompt: |-
  I'm a software engineer without any formal philosophy background, and I've been invited to deliver the opening remarks for a one-day interdisciplinary workshop titled "Loops That Look Back: Recursion in Art, Code, and Mind." The audience is deliberately mixed: roughly half are philosophers and art historians who work on visual culture and self-reference, and half are practicing engineers, designers, and artists who have never read a philosophy text. I need the talk to do something more demanding than decorate a technical analogy with philosophical language; I want the concept of tangled hierarchies and the inviolate level—specifically the logical structure of Escher's Drawing Hands, where two hands each appear to be drawing the other yet neither can be the ultimate origin—to actually constrain what I can say about authorship, collaboration, and the limits of self-contained systems.

  Rather than rehearsing the familiar explanation of strange loops that the expert half will already know, I want to build the speech around a niche framing drawn from my own field: the bootstrap compiler problem in systems programming. A compiler that writes its own executable must eventually rely on an initial, trusted binary—the "inviolate level"—that is never itself produced by the compiler it generates. I want this analogy to carry the philosophical weight: just as the bootstrap binary is outside the loop it initiates, there must be a level outside any self-drawing system that makes the loop possible, yet remains invisible inside it. The speech should last about eight minutes, speak respectfully to both halves of the room without dumbing anything down for either side, and avoid all citations, bibliographies, or reading lists since these are spoken remarks. After the speech, please provide a brief structured summary as a JSON object with exactly these fields: "occasion" (the event and its title), "duration_target", "audience_mix", "core_analogy", "philosophical_idea", "structural_constraint_on_claims", "niche_technical_injection", "tone_for_experts", and "tone_for_non_experts".
