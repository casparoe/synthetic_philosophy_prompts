answer: |-
  This is an exceptionally rich seminar setup. You have identified the perfect storm: a text where the material history of production is as contested as the ontological status of the characters within the diegesis. *Blade Runner* is not just a film about replicants; it is a film about the provenance of memory and the authority of verification. That makes it the ideal stress test for intentionalism.

  Here is an evaluation of your three theoretical options against the specific historical/textual data points, followed by an assessment of your meta-hunch and practical advice for the seminar room.

  ### 1. Stress-Testing the Three Theories

  Let's run your three options against the specific friction points you listed.

  **A. Artifact Accretionism (Everything on screen counts)**
  *   **The Eye-Glow:** This is Accretionism's strongest win. If the glow on Deckard's eye in the apartment scene was a lighting accident (as Ford and crew have suggested), Accretionism says it counts. It is visually present; it signifies "replicant" to the audience.
  *   **Hauer's "Tears in Rain":** Accretionism handles this well. Hauer wrote it, Scott filmed it. It is part of the artifact. The meaning of Batty's death is constituted by those lines, regardless of who typed them.
  *   **The Voiceover/Happy Ending:** This is where Accretionism strains. The theatrical voiceover explains things the images show, and the "drive into sunshine" contradicts the noir tone. Accretionism says this *is* the meaning of the Theatrical Cut. But it forces you to admit the work is tonally incoherent. It treats a studio mandate as semantically equal to a directorial vision, which feels intuitively wrong when the mandate undermines the coherence of the artifact.
  *   **Where it feels wrong:** It flattens hierarchy. If a boom mic dips into the shot, Accretionism must account for its meaning. It risks turning "meaning" into "everything that happened causally."

  **B. Authority-Filtered Intentionalism (Only the Final Cut holder counts)**
  *   **Scott's Final Cut:** This theory shines here. It declares the *Final Cut* the only true *Blade Runner*. The voiceover and happy ending are excised not just physically but semantically; they never "meant" anything because they lacked authority.
  *   **Hauer's Speech:** It handles this by proxy: Hauer's words count *only because* Scott authorized them in the edit. Scott becomes the filter.
  *   **The Eye-Glow:** If Scott says the glow was an accident and didn't intend it, Authority-Filtered Intentionalism must dismiss it as noise. It cannot count as evidence of Deckard's nature.
  *   **Where it feels wrong:** It erases reception history. For 15 years, the "meaning" of *Blade Runner* in the public sphere was the Theatrical Cut. To say that meaning didn't exist is historically false. It also struggles with Scott's later interviews. If Scott is the authority, why does his 2000 interview not count as intention? Because it's outside the artifact? But Hirsch-style intentionalism locates meaning in the mental state, not the object. If Scott *now* says "I meant Deckard to be a replicant," but the *Final Cut* leaves it ambiguous, the Authority theory has to say Scott failed to realize his intention.

  **C. Version-Relative Meaning (Different cuts = different works)**
  *   **The Unicorn/Origami:** This is the cleanest fit. In the Theatrical Cut (no unicorn dream), the origami is a clue that Gaff knows Deckard, but not necessarily that Deckard is a replicant. In the Director's/Final Cut (unicorn dream included), the origami confirms the implantation of memories. The *meaning changes* because the *work changes*.
  *   **Deckard's Photos:** In the Theatrical version, they suggest nostalgia. In the Final Cut, they suggest manufactured memory.
  *   **Where it feels wrong:** As you noted, it dissolves the seminar question. If you ask "Is Deckard a replicant?", the answer is "Which Deckard?" While accurate, it can feel like a evasion to first-years who want to talk about *Blade Runner* as a cultural phenomenon. It also doesn't solve the *2049* problem (see below).

  **Verdict:** For a first-year seminar, **Version-Relative Meaning** is the most intellectually honest, but **Authority-Filtered** is the most pedagogically useful for contrasting with your co-teacher. Accretionism is likely too messy for a 50-minute session unless you focus solely on the "accident" of the eye-glow.

  ### 2. The Sub-Questions

  **Scott's Later Statements (The "Too Late" Intention)**
  This is the kill shot for hardline Actual Intentionalism in this specific case.
  *   **The Problem:** If a work is deliberately built to be undecidable (as the *Final Cut* largely is), an intention expressed years later ("He is a replicant") does not fix the meaning; it fixes the *author's preference*.
  *   **The Argument:** If Scott intended ambiguity, his later statement contradicts his original intention. If Scott intended "Replicant" but hid it to create ambiguity, his later statement reveals the intention but admits the artifact failed to convey it.
  *   **For the Hypothetical Intentionalist:** This is also a trap. The "competent audience" in 1982 could not know Scott's 2000 interview. Therefore, the *hypothetical* intention of the 1982 audience must be "undecidable." The 2000 interview changes the *significance*, not the *meaning*.
  *   **Seminar Point:** Ask your students: "If I write a poem that clearly means X, but ten years later I say 'I meant Y', did the poem change?" *Blade Runner* adds the layer that Scott isn't just changing his mind; he's claiming authority over a text that has escaped him.

  **The Sequel (*2049*)**
  *   **Retroactive Fixing:** *2049* cannot fix the meaning of *Blade Runner* under any standard theory. It is a new artifact.
  *   **Accretionism:** It adds to the "Blade Runner Universe" accretion, shading how we view the original, but it doesn't change the semantic content of the 1982 frames.
  *   **Authority:** Villeneuve does not have authority over Scott's 1982 intentions.
  *   **The Daughter:** The revelation that Deckard and Rachael had a child implies they had sex. If Rachael is a replicant and Deckard is human, that's one thing. If both are replicants, it's another. *2049* leans into the ambiguity rather than solving it (K's memory is the fake one, the daughter is the real one).
  *   **Seminar Point:** Use *2049* to show that *significance* evolves even if *meaning* doesn't. The original film's ambiguity is *necessary* for the sequel to work. If *BR* definitively proved Deckard was human, *2049*'s plot about replicant reproduction loses its tension. The ambiguity is a feature, not a bug.

  ### 3. The Meta-Hunch: The Film as Argument

  Your hunch is not "too cute"; it is structurally sound. *Blade Runner* is not just evidence in the intentionalism debate; it is a dramatization of the stakes of that debate.

  **The Parallel:**
  *   **Intentionalism:** Meaning is fixed by the Author (Scott/Tyrell). The viewer/replicant must submit to the authority of the creator to know the truth.
  *   **Anti-Intentionalism (Viewer/Replicant Autonomy):** Meaning is generated by the experience of the text/life. Deckard's love for Rachael is "real" regardless of whether Tyrell designed her to feel it. The viewer's emotional response is valid regardless of Scott's voiceover.

  **Scenes for 18-Year-Olds:**
  1.  **The Voight-Kampff Test:** This is the literalization of Intentionalism. An institution (the state) uses a test to determine the "truth" of a being's interiority. The test asks questions to gauge *intent* and *empathy*.
      *   *Question:* "Does the test determine if she *is* human, or if she *counts* as human?" (Connect to: Does Scott's intent determine the meaning, or does the film's effect?)
  2.  **Gaff's Origami:** Gaff leaves a unicorn. He knows Deckard's dreams.
      *   *Question:* "Who owns the dream? The dreamer (Deckard) or the one who knows the dream (Gaff/Scott)?" If Gaff knows the dream, did he plant it? If Scott knows the meaning, did he plant it?
  3.  **Deckard's Photos:** Deckard looks at old photos to verify his past. They are the "text" of his life.
      *   *Question:* "If the photos are fakes, is the memory fake?" (Connect to: If the author's stated intent contradicts the text, is the text's meaning fake?)
  4.  **Rachael's Question:** "Have you ever taken that test yourself?"
      *   *Question:* "Who tests the tester?" (Connect to: Who validates the Author's intention? The Author?)

  **Where the Film Resists:**
  Be honest with the students: The romance between Deckard and Rachael works emotionally even if they are both toasters. The action scene with Pris works even if we don't know her ontology. The film resists total allegorization. Sometimes a cigar is just a cigar, and sometimes a replicant is just a plot device. If you force the "authority" reading onto the love scene, it becomes cold and clinical. The film argues that *experience* (the "skin job," the tears in rain) matters more than *provenance*. This is actually an argument *against* hardline Intentionalism. It suggests that what the work *does* (Rachael's love) matters more than where it *came from* (Tyrell's lab).

  ### 4. Handling the Co-Teacher and the Seminar

  **To your Co-Teacher:**
  Do not frame this as "Intentionalism is wrong." Frame it as "Film complicates what 'Author' means."
  *   **The Argument:** "In literature, the author controls the words. In film, the 'author' is a negotiation. If Scott intended X, but the Studio forced Y, and the Audience sees Z, where is the work? If you say Scott's intention is the meaning, you have to say the Theatrical Cut (which most people saw) is a corrupted version of the 'real' work. But isn't the cultural impact part of the work?"
  *   **The Compromise:** Suggest that for the purpose of the module, you treat the *Final Cut* as the "text" (satisfying her desire for a stable authorial object) but use the production history to show how fragile that stability is.

  **Seminar Plan (The "Verdict" Activity):**
  1.  **Clip 1:** The Voight-Kampff test with Rachael.
  2.  **Clip 2:** The "Tears in Rain" monologue.
  3.  **Discussion:**
      *   Ask the Intentionalist question: "What did Scott *mean* here?" (Reveal Scott says Deckard is a replicant).
      *   Ask the Anti-Intentionalist question: "What does the film *show* here?" (Batty values life more than the humans).
      *   **The Kicker:** "If Scott says Deckard is a replicant, does that make Batty's speech more poignant or less?"
          *   *If Deckard is a replicant:* Batty died saving a machine.
          *   *If Deckard is human:* Batty died saving a man who hunted him.
          *   *If it's ambiguous:* The question is whether the distinction matters.
  4.  **Conclusion:** The film suggests the distinction *shouldn't* matter (Batty saves him anyway), but the institutions (Tyrell, Police) insist it does. This mirrors the seminar: Theories (Institutions) insist on fixing meaning, but the experience of the film (Life) resists it.

  **Final Advice:**
  Your co-teacher is right that meaning requires *some* constraint, or else "anything goes." But *Blade Runner* proves that in collaborative media, the "Author" is a fiction we impose to make sense of the chaos. The film's greatness lies in the fact that it survives both readings: it works as a noir about a hunter finding his humanity, and as a tragedy about a machine dreaming of being real. If Scott's intention fixed the meaning, one of those readings would be "wrong." The fact that both feel "right" is the best evidence against hardline Actual Intentionalism you will find in a cinema.

  Use the **Eye-Glow**. It is the smallest detail and the biggest problem. If it's an accident, and it changes the meaning from "Human" to "Replicant," then the *artifact* has overruled the *author*. That is the moment the theory breaks.
