answer: |-
  # Taxonomy of Temporal Consciousness and the Color Phi Phenomenon

  **1. When a subject reports a continuous motion that physically did not occur, is this mismatch located in the immediate phenomenal character of the experience itself, or in the subsequent memory and verbal report?**

  *   **A. In the subsequent memory and verbal report (Artifact of Post-Hoc Inference)**
      *   **Leaf: Deflationary No-Anomaly**
          *   *Commitment:* Subjects are systematically mistaken about the content of their own current conscious experience, treating memory as immediate perception.

  *   **B. In the immediate phenomenal character of the experience itself (Genuine Temporal Anomaly)**
      *   **2. Is the unified percept created by modifying the sensory content of the earlier moment, by inserting a false entry into the access record, or by withholding finalization until both stimuli are processed?**

          *   **A. By modifying the sensory content of the earlier moment (Retrospective Alteration)**
              *   **3. After the modification occurs, does the subject retain first-person authority over the pre-revised state?**
                  *   **i. Yes (Subject can access the original, overwritten state)**
                      *   **Leaf: [Unoccupied Node] Phenomenal Palimpsest**
                          *   *Diagnosis of Emptiness:* No one defends this because claiming the content is "overwritten" logically precludes the possibility of accurately reporting the original content; it renders the concept of revision incoherent.
                  *   **ii. No (Subject loses access to the original state)**
                      *   **Leaf: Retrospective Phenomenal Revisionism**
                          *   *Commitment:* The phenomenal past is not fixed; history within the mind is literally rewritten, violating the intuition that experienced moments are immutable once they occur.

          *   **B. By inserting a false entry into the access record without changing the earlier content (Representational Falsification)**
              *   **3. Does this falsification alter the qualitative feel (e.g., color) of the experience or merely the perceived temporal ordering?**
                  *   **i. Merely the perceived temporal ordering**
                      *   **Leaf: [Unoccupied Sub-variant] Temporal-Only Stalinesque**
                      *   *(Note: Standard Stalinesque views typically imply qualitative confabulation in phi cases, but a purely ordinal version is logically possible yet rarely isolated.)*
                  *   **ii. The qualitative feel (e.g., color) as well as ordering**
                      *   **Leaf: Access-Level Stalinesque Confabulation**
                          *   *Commitment:* There exists a rich field of unconscious qualia that differs from the conscious report, implying consciousness is merely the tip of an unconscious processing iceberg.
                      *   *(Note: This leaf and "Retrospective Phenomenal Revisionism" are empirically indistinguishable from the subject's perspective, as both predict identical reports despite differing metaphysical claims about the past.)*

          *   **C. By withholding finalization until both stimuli are processed within a narrow window (Prospective Generation)**
              *   **3. Is there a minimal integration window (approximately 100–200 ms) within which retrospective alteration is impossible because the experience is not yet finalized?**
                  *   **i. No (Processing is continuous without a specific window)**
                      *   **Leaf: [Unoccupied Node] Continuous Prospective Flow**
                      *   *(Note: Most predictive models require a discrete window to explain the cutoff effects in phi; a continuous model struggles to explain why very short intervals fail to bind.)*
                  *   **ii. Yes (There is a specific window before finalization)**
                      *   **Leaf: Predictive-Binding Minimalism**
                          *   *Commitment:* Conscious experience is never truly "present"; it is always a slightly delayed simulation constructed to predict the immediate past, meaning we live perpetually in a buffered reality.
