  Drop commitment (h) immediately because it is logically incompatible with your Compliance Floor insight and commitment (i).

  **Tension 1: Licensing (h) vs. Privacy/Compliance Floor (i + Insight)**
  *   **Severity:** Fatal. You cannot mandate registration for protection without creating a database that violates (i) and triggers the Compliance Floor exclusion you identified.
  *   **Which gives:** (h) must go.
  *   **Cost:** Substantive. You lose the mechanism of routine inspections and licensed premises. However, keeping it invalidates your core outreach insight and excludes the street-based workers you serve. Protections must come from decriminalization (e), allowing access to ordinary labor inspections without a sex-work-specific register.

  **Tension 2: Nordic Model (c) vs. NZ Model (e)**
  *   **Severity:** Critical. These are mutually exclusive legal frameworks; you cannot draft a position paper advocating for both criminalizing buyers and treating transactions as ordinary labor.
  *   **Which gives:** (c) should go, given your other commitments. (b) validates consent, (e) validates labor rights, and the Compliance Floor argues against the market displacement Nordic causes.
  *   **Cost:** Substantive. You lose the specific lever of targeting demand to shrink the market. However, retaining (c) undermines (b) and makes (e) impossible, forcing you into a policy incoherence that harms coalition building.

  **Tension 3: Third-Party Criminalization (f) vs. Labor Law Approach (e)**
  *   **Severity:** High. Ordinary labor law requires legal employers and managers; blanket criminalization of "anyone taking a cut" prevents legitimate employment structures.
  *   **Which gives:** (f) must be narrowed.
  *   **Cost:** Rhetorical and Substantive. You must stop arguing that *all* third-party involvement is criminal. You lose the ability to target non-coercive management, but you gain the ability to allow workers to hire security, drivers, or agents legally under labor law.

  **Tension 4: Consent Validity (b) vs. Criminalizing Buyers (c)**
  *   **Severity:** Medium. If payment doesn't nullify consent (b), criminalizing the buyer (c) requires a justification external to the transaction itself (e.g., public nuisance or trafficking), which weakens the moral clarity of your position.
  *   **Which gives:** (c) creates the friction here.
  *   **Cost:** Philosophical. Retaining (c) forces you to argue that consent is real but the consensual act is still a crime, which is a harder sell than aligning (b) and (e) to argue for regulation based on safety rather than morality.

  **False Inconsistency: Consent (b) vs. Desire to Exit (g)**
  *   **Resolution:** These are compatible. (b) addresses *transactional* consent (was this specific act agreed to?), while (g) addresses *structural* coercion (are the life circumstances optimal?). A worker can genuinely consent to a client on Tuesday while genuinely wishing they had a different job by Friday. Keeping both strengthens your position: you protect rights now (b) while demanding economic alternatives (g).

  **Split Claims**
  *   **Commitment (f):** This glues "coercive pimping" to "legitimate management." Split them. Criminalize coercion and exploitation (existing laws cover this); decriminalize administrative or safety-related third parties (agents, security) to allow for labor organization.
  *   **Commitment (c):** This glues "seller safety" to "market shrinkage." Split them. Evidence suggests Nordic models often reduce visible market size while increasing danger per transaction. Do not assume market shrinkage equals harm reduction.

