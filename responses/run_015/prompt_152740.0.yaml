answer: |-
  You are absolutely right, and your intuition is backed by serious mathematical finance theory. You aren't just being "risk-averse"; you are thinking like an **investor**, while your buddy is thinking like a **gambler** (in the technical sense).

  The disagreement comes down to the difference between maximizing **Expected Value (EV)** for a single event versus maximizing **Expected Growth** over a series of events.

  Here is the breakdown of why your "middle ground" is actually the mathematically superior strategy for a recurring pool.

  ### 1. Arithmetic Mean vs. Geometric Mean
  Your buddy (the "All-In" guy) is optimizing for the **Arithmetic Mean**. He is looking at a single season in isolation.
  *   **Math:** If you bet $400 on a 70% chance to double your money (simplified odds), your Expected Value is positive.
  *   **Logic:** In a one-time, do-or-die scenario where you don't care about next year, he is technically correct. To maximize the average return of *one* bet, you bet everything on the highest positive EV outcome.

  You are optimizing for the **Geometric Mean**. You explicitly mentioned, *"if we do this every year we want the pool to grow exponentially."*
  *   **Math:** In a repeated game, wealth compounds. Compounding is governed by the geometric mean, not the arithmetic mean.
  *   **Logic:** Volatility is a drag on compounding. If you lose 50% of your bankroll, you need a 100% gain just to get back to even. By betting 100% of the pot, you introduce maximum volatility. One loss (the 30% chance) wipes you out to zero. Once you hit zero, the game is over, and you can no longer compound.

  ### 2. The Kelly Criterion
  There is a specific formula for exactly what you are suggesting. It's called the **Kelly Criterion**. It calculates the optimal bet size to maximize long-term bankroll growth without risking ruin.

  The formula is:
  $$f^* = \frac{bp - q}{b}$$

  Where:
  *   $f^*$ is the fraction of the bankroll to bet.
  *   $b$ is the net odds received (e.g., if you bet 1 to win 1, $b=1$).
  *   $p$ is the probability of winning (0.70).
  *   $q$ is the probability of losing (0.30).

  **Without knowing the exact payout odds,** let's assume for a moment the payout is even money (you double your stake if the team wins).
  *   $f^* = (1 \times 0.70 - 0.30) / 1$
  *   $f^* = 0.40$

  The Kelly Criterion says you should bet **40%** of your bankroll.
  *   **Your Buddy:** Wants to bet 100% (Over-betting Kelly). This increases risk faster than it increases return, eventually leading to ruin.
  *   **The Other Buddy:** Wants to bet 25% on four teams (Under-betting Kelly). This is safe, but it leaves money on the table if you truly have an edge.
  *   **You:** Want to bet "more, but not all." You are instinctively hovering around the Kelly optimal, which maximizes long-term growth.

  ### 3. Risk of Ruin
  In probability theory, **Gambler's Ruin** states that a gambler with finite wealth playing a game with a negative (or even positive) expected value against a bank with infinite wealth will eventually go broke if they keep betting.

  Even with a 70% win rate, if you bet 100% of the pot every year:
  *   Year 1: Win (Pot grows)
  *   Year 2: Win (Pot grows)
  *   Year 3: **Lose** (Pot goes to $0)

  Because you are betting the whole stack, a single loss is fatal to the pool. The probability of surviving 5 years betting all-in is $0.70^5 \approx 16.8\%$. You have an 83% chance of blowing up the pool within 5 years.

  If you bet half-pot (50%):
  *   A loss cuts the pot in half, but you can recover.
  *   The probability of total ruin drops drastically.

  ### 4. Diminishing Marginal Utility
  There is also a behavioral economics principle at play.
  *   **Winning $800** instead of $400 is nice.
  *   **Losing $400** (ending up with $0) is disappointing and might end the tradition.

  The "utility" (satisfaction) you get from the money isn't linear. Losing the entire stake hurts the group dynamic more than winning extra helps it. Preserving the game so you can play it again next year has value in itself.

  ### The Verdict
  You are not being inconsistent; you are recognizing that **survival is a prerequisite for growth.**

  *   **Buddy A** is right only if this is a one-time bet and you never play again.
  *   **Buddy B** is too conservative and ignores the edge you have.
  *   **You** are correct for a recurring investment pool.

  **How to explain it to them:**
  Tell Buddy A: *"If we go all-in, we have a 30% chance of killing the pool forever. If we want this to grow over 10 years, we can't afford to hit zero once. We need to bet enough to grow, but enough to survive a bad beat."*

  Tell Buddy B: *"If we split it evenly, we aren't taking advantage of the edge we found. We should weight it toward the best option, just not 100%."*

  **Recommendation:** Propose betting **50% on the favorite**, and split the remaining 50% among 2-3 other high-upside teams. This gives you exposure to the likely winner while insuring against the 30% chance of an upset, keeping the pool alive for next season.
