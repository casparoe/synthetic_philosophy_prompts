answer: |-
  # Seminar Activity: The Delegation Cascade

  **Objective:** To demonstrate how individually rational choices to delegate authority in nested representative structures can produce a collective legitimacy deficit, even when the chain of representation technically holds.
  **Time:** 50 minutes (Game) + 40 minutes (Debrief).
  **Participants:** 18 Graduate Students.
  **Materials:**
  *   180 Token slips (paper chits marked "1 Token") or poker chips.
  *   54 Ballot slips (3 per student).
  *   18 Small envelopes (for Tier 1 anonymity).
  *   2 Large envelopes (for Tier 2 anonymity).
  *   1 "National Verdict" card.
  *   1 Six-sided die (for lottery mechanics).
  *   Whiteboard/Projector for tracking token totals.

  ---

  ## 1. Structure & Setup (5 Minutes)

  Arrange the room into **6 Local Cells** (3 students each). Label these Cells A–F.
  Group the Cells into **2 Regions**:
  *   **Region 1:** Cells A, B, C.
  *   **Region 2:** Cells D, E, F.

  **Initial Endowment:** Distribute **10 tokens** to each student.
  **The Goal:** The group must produce a "National Approval" to unlock a **collective bonus of 8 tokens** per person.
  **The Cost:**
  *   **Voting (Direct Action):** Costs **1 token**. Guarantees you carry the mandate to the next tier.
  *   **Delegating:** Costs **0 tokens** initially. Enters you into a lottery.

  **The Cascade Logic:**
  1.  **Tier 1 (Local):** Each Cell of 3 must produce **1 Delegate** to move to Tier 2.
  2.  **Tier 2 (Regional):** The 3 Delegates from Region 1 (and 3 from Region 2) form a Council. Each Council must produce **1 Delegate** to move to Tier 3.
  3.  **Tier 3 (National):** The 2 Final Delegates meet. If both arrive, they vote "Approve." If Approve, everyone gets the 8-token bonus.

  **The Lottery Rule (Crucial):**
  If a group/cell chooses to **Delegate** (i.e., no one volunteers to pay the 1 token):
  *   Roll a die.
  *   **Probability 1/n:** One person is randomly selected to *become* the Delegate. They must pay the 1 token *retroactively*.
  *   **The Risk:** If the die roll indicates a "Procedural Failure" (defined below), the chain breaks, the bonus is lost, and the game ends for that region.

  ---

  ## 2. Game Rules & Anonymity (5 Minutes)

  **Read this script strictly:**
  *"This is a non-communication game. Once you sit in your Local Cell, you may not speak to anyone outside your cell, and ideally not within it until the ballot phase. Your choices must be secret."*

  **Anonymity Mechanism:**
  *   **Tier 1:** Each student writes "VOTE" or "DELEGATE" on a ballot slip, places it in a **personal small envelope**, seals it, and hands it to the Instructor.
  *   **Tier 2:** Delegates move to the Regional table. They write "VOTE" or "DELEGATE" on a slip, place it in a **regional large envelope**, and seal it.
  *   **Tier 3:** The two National Delegates simply announce "APPROVE" or "REJECT" publicly.

  **Why Anonymity Matters:**
  Graduate students are high-coordination agents. If they can talk, they will solve the collective action problem verbally ("Let's all just vote"). Sealed envelopes force them to rely on *expectations* of others' behavior, which triggers the rational choice calculus.

  ---

  ## 3. Round 1: The Coordination Baseline (15 Minutes)

  **Step 1: Local Tier (5 mins)**
  *   Students seal ballots. Instructor collects.
  *   **Instructor Processing:** Open envelopes per cell.
      *   If ≥1 person voted "VOTE": That person pays 1 token, becomes Delegate.
      *   If all 3 voted "DELEGATE": Roll die. On 1–5, one random student is forced to pay 1 token and become Delegate. On 6, **Cascade Break** (Region loses bonus).
  *   *Prediction:* Round 1 usually succeeds. Social norms and hope for coordination lead to enough volunteers.

  **Step 2: Regional Tier (5 mins)**
  *   Delegates (approx. 6 students total, 3 per region) move to Regional tables. Non-delegates sit out but watch.
  *   Delegates repeat the Vote/Delegate ballot process.
  *   *Prediction:* Delegates feel "burdened" from Tier 1. Some may try to Delegate.

  **Step 3: National Tier & Payout (5 mins)**
  *   Final 2 Delegates meet. They almost always "Approve" (since 8 tokens > 0).
  *   Tokens distributed.
  *   **Reset:** Collect all tokens. Re-endow everyone with 10 tokens.

  ---

  ## 4. Round 2: The Rational Cascade (15 Minutes)

  **Instruction:** *"Play again. Same rules. You now know the mechanics. Maximize your token retention."*

  **Step 1: Local Tier (5 mins)**
  *   *Predicted Behavior:* Students realize that if they Delegate, they likely won't be picked (1/3 chance). If the chain holds, they save 1 token.
  *   *Result:* Delegation spikes. Most cells will have all 3 students Delegate.
  *   *Instructor Action:* Enforce the lottery strictly. If a cell all-delegates, roll the die. (Keep the "Break on 6" rule active to maintain tension).

  **Step 2: Regional Tier (5 mins)**
  *   *The Critical Moment:* The students who were *forced* to represent in Tier 1 arrive at Tier 2. They are now "tired" (psychologically burdened).
  *   *Predicted Behavior:* They choose to **Delegate** again to avoid paying a second token.
  *   *The Break:* In **one** of the two Regions, instruct that if the Regional Council chooses to Delegate, the risk of collapse increases (Roll die: 1–3 = Collapse).
  *   *Outcome:* **One Region collapses.** The chain breaks. That Region's students (including the Local Cells that started them) get **0 bonus**. The other Region succeeds.

  **Step 3: National Tier (5 mins)**
  *   Only 1 Delegate arrives from the surviving Region. The National Assembly requires 2.
  *   **Declare:** "Legitimacy Quorum Not Met."
  *   **Result:** **NO ONE gets the 8-token bonus.** Even the region that succeeded fails because the National Assembly is incomplete.
  *   *Why:* This replicates the "Legitimacy Deficit." A partial mandate is no mandate.

  ---

  ## 5. Debrief & Discussion (40 Minutes)

  ### Phase 1: The Emotional Audit (10 Minutes)
  Do not start with theory. Start with the students who were **Forced Representatives**.
  *   **Ask the Tier 2 Forced Delegates:** "You were picked by lottery at Tier 1, then asked to decide at Tier 2. How did you feel about your authority to decide for the 15 people who stayed behind?"
  *   **Expected Reaction:** They will report feeling "unauthorized," "burdened," or that the outcome felt "illegitimate" even if it yielded tokens.
  *   **Ask the Free-Riders:** "Did you feel you had a stake in the outcome if you didn't pay the cost?"
  *   **Point:** Legitimacy is not just about outcomes (tokens); it is about the *authorization* process.

  ### Phase 2: Mapping the Rational Choice (15 Minutes)
  Draw the payoff matrix on the board.
  *   **Individual Rationality:**
      *   Vote Cost: 1.
      *   Delegate Cost: 0 (expected value < 1 due to lottery probability).
      *   Pivotal Probability: At Tier 1, my vote matters 100% for my cell. At Tier 2, my vote matters for the Region. At Tier 3, for the Nation.
      *   **The Cascade:** As we move up tiers, the "distance" from the original voter increases. The Tier 2 delegate asks: "Why should I pay 1 token for a decision initiated by someone else's delegation?"
  *   **The Deficit:** The game shows that *efficient* delegation (saving tokens) creates *fragile* legitimacy. When the National Assembly met with only 1 person (or 2 burdened people), the decision lacked the "weight" of the 18.

  ### Phase 3: Theoretical Connection (10 Minutes)
  Connect to the seminar readings (Downs, etc.).
  *   **Rational Ignorance vs. Rational Delegation:** In Downs, I don't vote because I'm not pivotal. In this game, I delegate because *someone else might be*.
  *   **The Nested Problem:** Standard theory focuses on the Mass Electorate. This game shows the problem replicates *inside* the representative structure. Representatives become voters too, and they face the same incentives to defer upward.
  *   **Legitimacy:** A decision is legitimate not just because it is beneficial (8 tokens), but because the chain of authorization wasn't diluted by self-interested delegation.

  ### Phase 4: Limitations (5 Minutes)
  **Be Frank:**
  *"This game captures the **structural** incentive to free-ride. It does **not** capture the **epistemic** dimension of rational ignorance."*
  *   **In the Game:** You knew exactly what the "Policy" was (8 tokens). You were perfectly informed.
  *   **In Reality:** Voters delegate because they don't understand the policy, not just to save tokens.
  *   **Discussion Question:** "If we added a layer where the '8 token payoff' was uncertain or complex, would delegation have been even higher? How does epistemic ignorance compound the delegation cascade?"

  ---

  ## Instructor Notes: Predictable Failure Modes

  1.  **Social Pressure in Round 1:**
      *   *Risk:* Students talk before sealing envelopes. "Let's all vote so we win."
      *   *Mitigation:* Enforce silence aggressively. If they coordinate, Round 1 becomes trivial. You *need* Round 1 to be slightly messy so Round 2 shows the degradation.
      *   *Fix:* If they coordinate too well in Round 1, explicitly state in Round 2: "Trust has eroded. You cannot verify others' ballots."

  2.  **The "National Assembly" Confusion:**
      *   *Risk:* Students think the National Assembly can decide even if only 1 person shows up.
      *   *Fix:* Pre-announce the "Quorum Rule." 2 Delegates are required for Legitimacy. If only 1 arrives, the Bonus is void. This ensures the "Cascade Break" feels consequential.

  3.  **Emotional Hotspots:**
      *   Watch the students who are **forced by lottery** at Tier 1 and then asked to act at Tier 2. They are the key to the debrief. They embody the "Reluctant Representative." Their resentment is the empirical evidence of the legitimacy deficit.

  ## Materials Checklist
  *   [ ] 180 Token slips (cut paper).
  *   [ ] 54 Ballot slips.
  *   [ ] 20 Small Envelopes (Tier 1).
  *   [ ] 4 Large Envelopes (Tier 2).
  *   [ ] 1 Die.
  *   [ ] Whiteboard markers.
  *   [ ] Timer (phone).

  ## Timeline Summary
  *   **00:00 – 00:05:** Setup & Endowment.
  *   **00:05 – 00:10:** Rules & Anonymity Enforcement.
  *   **00:10 – 00:25:** Round 1 (Play & Payout).
  *   **00:25 – 00:40:** Round 2 (Play & Cascade Break).
  *   **00:40 – 00:50:** Reset & Token Count.
  *   **00:50 – 01:30:** Debrief (Emotion -> Rationality -> Theory -> Limitations).
