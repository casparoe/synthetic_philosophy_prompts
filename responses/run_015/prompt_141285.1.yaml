answer: |-
  This is a classic case of a philosophical slogan being weaponized to enforce intellectual quietism. Your colleague is leveraging the *aura* of philosophical depth to bypass the hard work of distinguishing competing models. Your suspicion is well-founded: the move from "evidence underdetermines theory" to "therefore the choice is purely sociological" is a non-sequitur in almost every scientifically relevant context, and specifically in the Dark Matter (DM) vs. Modified Gravity (MG) debate.

  Below is a disambiguation of the slogan into distinct theses. I have assessed each for truth, its specific applicability to the DM/MG case, and whether it licenses the "sociology" conclusion.

  ### A Menu of Underdetermination Theses

  #### 1. Transient Underdetermination (TU)
  *   **The Claim:** Given the evidence available *right now*, multiple theories are compatible with the data.
  *   **Status:** **True.**
  *   **DM/MG Context:** True. Currently, DM explains the Cosmic Microwave Background (CMB) and large-scale structure better, while MG (specifically MOND variants) often fits galactic rotation curves with fewer parameters. Neither has completely ruled out the other across all scales.
  *   **Licenses "Sociology"?** **No.** This thesis implies the stand-off is temporary. The rational response is to seek *new* evidence (e.g., direct detection of WIMPs, or gravitational wave tests of gravity), not to surrender to sociological factors. It prescribes more research, not less.

  #### 2. Duhem-Quine Holism (DQH)
  *   **The Claim:** Theories do not predict observations in isolation; they do so only conjoined with auxiliary assumptions (instrument calibration, background models, etc.). Therefore, a failed prediction can always be saved by adjusting an auxiliary assumption rather than the core theory.
  *   **Status:** **True (Logically), but Scientifically Misleading.**
  *   **DM/MG Context:** True. If a DM simulation fails to match a galaxy profile, one can blame the baryonic feedback models (auxiliaries) rather than the DM particle. If MG fails at the cluster scale, one can posit neutrinos or other fields (auxiliaries).
  *   **Licenses "Sociology"?** **No.** While logic allows a theory to be saved indefinitely, scientific practice does not. We reject theories when the required auxiliary adjustments become *ad hoc*, complex, or undermine the theory's explanatory power. This thesis explains why testing is hard, not why it is impossible.

  #### 3. Strong Empirical Equivalence (SEE)
  *   **The Claim:** There exist two rival theories that entail *exactly* the same observable outcomes for all possible experiments, past, present, and future. They are logically distinct but observationally identical.
  *   **Status:** **False / Unestablished.**
  *   **DM/MG Context:** **False.** DM and MG are *not* empirically equivalent. They make different predictions regarding the Bullet Cluster (separation of mass from gas), the CMB power spectrum peaks, and structure formation rates. MG proponents must add "dark fields" to match CMB data, effectively converging toward DM; DM proponents must tune feedback to match rotation curves. They are distinct curves through *different* points, not the same points.
  *   **Licenses "Sociology"?** **Yes, *if* true.** If SEE held, evidence could never decide the matter. The choice would rest on metaphysical preference or, as your colleague says, resources/prestige. However, since SEE is not established here, this license is void.

  #### 4. Algorithmic Underdetermination (AU)
  *   **The Claim:** For any theory $T$ that fits data $D$, one can mathematically construct a rival $T'$ that also fits $D$ (e.g., by adding a clause "and the world looks as if $T$ is true").
  *   **Status:** **True (Trivial).**
  *   **DM/MG Context:** Trivial. One could write a Modified Gravity theory that includes a term exactly mimicking Cold Dark Matter in all regimes.
  *   **Licenses "Sociology"?** **No.** We dismiss such rivals not on sociological grounds, but on methodological grounds (simplicity, coherence, unification). A theory that is just $T$ plus a gerrymandered clause is rejected for being ugly, not because of a lack of telescope time.

  #### 5. Ontological Underdetermination (OU)
  *   **The Claim:** The mathematical formalism works, but we cannot determine the underlying ontology (e.g., is the curvature of spacetime a substance or a relation? Is the mass missing or is the force stronger?).
  *   **Status:** **Plausible but Substantive.**
  *   **DM/MG Context:** Plausible. It is possible that a future theory unifies both, showing DM and MG as limiting cases of a deeper framework. However, currently, they posit different causal mechanisms (particle interaction vs. metric modification).
  *   **Licenses "Sociology"?** **No.** It licenses theoretical pluralism, not sociological determinism. It suggests we should keep both research programs alive to see which yields more fruitful interventions, not that the choice is arbitrary.

  ---

  ### Assessment of Your Colleague's Move

  Your colleague is committing a modal fallacy. He is observing **Transient Underdetermination (1)** but speaking as if **Strong Empirical Equivalence (3)** were true.

  *   **The Error:** He says, "No observation *could* ever settle it." This is a claim about *all possible evidence* (SEE).
  *   **The Reality:** We have observations that *currently* favor DM (CMB, Lensing) and others that *currently* favor MG (Radial Acceleration Relation). The fact that neither is a "knockout" yet is a feature of difficult science, not a proof of permanent equivalence.
  *   **The "Sociology" Leap:** Even if SEE were true (which it isn't), the "sociology" conclusion only follows if the theories are also *theoretically* equivalent (same simplicity, same unification power). If Theory A explains 10 phenomena with 2 parameters, and Theory B explains 10 phenomena with 10 parameters, the choice is evidential/methodological, not sociological, even if they are empirically equivalent.

  **Verdict on your suspicion:** Your suspicion is **correct**.
  1.  The readings that are **true** (Transient, Holism) imply the stand-off is temporary or manageable via methodological norms.
  2.  The reading required to support the **"sociology" moral** (Strong Empirical Equivalence) is **false** in this specific case. DM and MG make divergent predictions; we simply lack the resolution or specific experimental conditions to definitively rule one out *yet*.
  3.  The reading that **nobody has established** is the idea that DM and MG are mathematically guaranteed to be indistinguishable forever.

  ### Why This Line Gets Wheeled Out

  When scientists deploy this slogan in seminars, they usually mean one of two things, neither of which justifies your colleague's quietism:

  1.  **A Warning Against Dogmatism:** "Don't treat your favorite model as proven fact." (Defensible).
  2.  **A Plea for Pluralism:** "Fund the other group too, because we might be wrong." (Defensible).

  Your colleague is using it as a **Conversation Stopper**. By invoking "underdetermination," he elevates a practical difficulty (data is noisy/models are complex) into a metaphysical necessity (truth is inaccessible). This protects the status quo from criticism without requiring a defense of the status quo's evidential support.

  ### A Defensible Slogan for Working Scientists

  If you want to reclaim the insight without the quietism, here is a defensible version of the slogan you can use in future seminars:

  > **"Empirical adequacy is not truth, and current degeneracy is not permanent equivalence."**

  Or, more operational:

  > **"Underdetermination is a call for new kinds of evidence, not a license to ignore existing evidence."**

  **How to use this:**
  When the colleague claims the choice is sociological, you can respond:
  *"If the choice were purely sociological, it would imply Strong Empirical Equivalence—that DM and MG predict identical outcomes for the CMB, lensing, and structure formation. But they don't. They fit different subsets of the data with different auxiliary costs. That isn't underdetermination in the philosophical sense; that's a standard model-selection problem. We should be arguing about which auxiliaries are more physically motivated, not claiming the data is irrelevant."*

  This shifts the burden back to where it belongs: on the specific physical merits of the auxiliaries and the scope of the data, rather than a vague philosophical surrender.
