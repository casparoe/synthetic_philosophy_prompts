prompt: |-
  I work in a research group where the line "the evidence always underdetermines the theory" gets wheeled out to close arguments down. It happened again last week: we were discussing dark-matter versus modified-gravity accounts of galactic rotation curves and cluster dynamics, and a senior colleague said the two are just "different curves through the same points", that no observation could ever settle it, and that the choice between them is therefore sociological — which group has more telescope time, more prestige, more graduate students. I want to know whether any precise claim he could have meant actually supports that moral.

  Please disambiguate the slogan into a menu of distinct theses, each stated precisely enough to be assessed, with verdicts on each: which are true but trivial, which are substantive and plausible, which are false or unestablished, and which — if any — would licence his conclusion that the choice is not evidential. Among the distinctions I keep circling but cannot get straight are: underdetermination by the evidence we have now versus by all the evidence we could in principle gather; the point that no theory predicts on its own but only together with auxiliary assumptions, so that a failed prediction can always be absorbed somewhere, versus the far stronger claim of a global rival agreeing with our theory on every possible observation; rivals that merely re-fit data already in hand versus rivals that were in place beforehand and predicted it; rivals that are equally simple and non-gerrymandered versus rivals cooked up ad hoc to match; and disagreement confined to unobservable structure versus disagreement about what would happen under interventions we could actually perform.

  For each reading, say whether it plausibly holds in this case and whether it supports the "it is all sociology" moral. My suspicion is that the readings that are true are ones on which the stand-off is temporary or the rival is contrived, and that the readings strong enough to support his moral are ones nobody has established for dark matter. Tell me whether that suspicion is right, where it breaks down, which reading people usually have in mind when they deploy the line this way, and — what I actually want for future seminars — whether there is a defensible version of the slogan a working scientist should take seriously, as opposed to one that merely licences changing the subject.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user works in a research group where a senior colleague uses the phrase "evidence always underdetermines theory" to shut down arguments, specifically regarding Dark Matter (DM) vs. Modified Gravity (MG).
      *   **Colleague's Claim:** DM and MG are just "different curves through the same points," no observation can settle it, and the choice is purely sociological (telescope time, prestige, etc.).
      *   **User's Goal:** Wants to know if any precise interpretation of "underdetermination" supports this moral (that the choice is non-evidential/sociological).
      *   **Specific Distinctions to Address:**
          *   Current evidence vs. all possible evidence.
          *   Duhem-Quine thesis (auxiliary assumptions) vs. global empirical equivalence.
          *   Accommodation vs. Prediction.
          *   Simplicity/Ad hoc-ness.
          *   Observables vs. Unobservables/Interventions.
      *   **Task:** Disambiguate the slogan into distinct theses, assess their truth/plausibility in the DM vs. MG case, determine if they support the "sociology" moral, and validate/critique the user's suspicion. Finally, offer a defensible version of the slogan for working scientists.

  2.  **Deconstruct the Slogan ("Evidence Underdetermines Theory"):**
      *   I need to break this down into philosophical categories of underdetermination.
      *   *Category 1: Transient Underdetermination (Current Evidence).* True but trivial. Doesn't support the "always" or "sociology" claim permanently.
      *   *Category 2: Holism/Duhem-Quine.* Theories don't face evidence alone. True, but doesn't imply *rivals* exist for every theory.
      *   *Category 3: Strong/Global Empirical Equivalence.* Two theories predict *exactly* the same outcomes for all possible observations. This is the heavy hitter for the "sociology" claim.
      *   *Category 4: Methodological/Heuristic Underdetermination.* Multiple frameworks can fit data, but differ in fertility.
      *   *Category 5: Ontological Underdetermination.* Different structures explain the same observables (e.g., structure of spacetime vs. matter content).

  3.  **Evaluate Each Thesis against the DM vs. MG Case:**
      *   *DM:* Invisible mass particle.
      *   *MG (e.g., MOND/TeVeS):* Gravity behaves differently at low acceleration.
      *   *Current Status:* DM fits CMB, large-scale structure, bullet cluster better. MG fits rotation curves of specific galaxies better (Radial Acceleration Relation). They are *not* empirically equivalent across all domains.
      *   *Colleague's Claim:* "Different curves through the same points." This suggests empirical equivalence. Is it true? No, not currently.

  4.  **Drafting the Menu of Theses:**

      *   **Thesis 1: Transient Underdetermination (TU).**
          *   *Claim:* Current data doesn't uniquely pick one.
          *   *Verdict:* True.
          *   *Supports Sociology?* No, implies we need more data, not that data *can't* decide.
      *   **Thesis 2: Duhem-Quine Holism (DQH).**
          *   *Claim:* Predictions depend on auxiliaries; failure can be shifted.
          *   *Verdict:* True (philosophically).
          *   *Supports Sociology?* No. Just means testing is complex, not impossible.
      *   **Thesis 3: Strong Empirical Equivalence (SEE).**
          *   *Claim:* DM and MG entail exactly the same observable outcomes for all possible experiments.
          *   *Verdict:* False/Unestablished. They differ on CMB, lensing, structure formation.
          *   *Supports Sociology?* Yes, *if* true. But it isn't true here.
      *   **Thesis 4: Algorithmic Underdetermination (AU).**
          *   *Claim:* For any theory, one can construct a rival that fits the data (e.g., adding epicycles).
          *   *Verdict:* True (mathematically).
          *   *Supports Sociology?* No, because we reject the contrived rival on grounds of simplicity/coherence, not sociology.
      *   **Thesis 5: Ontological Underdetermination (OU).**
          *   *Claim:* The math works, but we can't know if it's "stuff" (DM) or "geometry/force" (MG).
          *   *Verdict:* Plausible in some contexts, but DM/MG have different causal powers in models.
          *   *Supports Sociology?* Weakly. Usually resolved by theoretical virtues (unification).

  5.  **Addressing the User's Suspicion:**
      *   *Suspicion:* True readings are temporary/contrived; strong readings are unestablished.
      *   *Verdict:* The suspicion is largely correct. The colleague is conflating Transient Underdetermination with Strong Empirical Equivalence.
      *   *Nuance:* There is a "degeneracy" in cosmology (parameter degeneracy), but DM vs. MG is not a perfect degeneracy.

  6.  **Developing the "Defensible Version" for Scientists:**
      *   What *should* a scientist take from underdetermination?
      *   It's a heuristic warning against dogmatism.
      *   It highlights the role of theoretical virtues (simplicity, scope, fertility) when data is ambiguous *for now*.
      *   It distinguishes "empirical adequacy" from "truth."
      *   It does *not* license giving up on evidence.

  7.  **Refining the Tone:**
      *   Needs to be philosophically precise but scientifically grounded.
      *   Avoid jargon where possible, or define it (e.g., "empirical equivalence").
      *   Be respectful of the senior colleague but firm on the logic.
      *   Address the specific DM/MG context (Bullet Cluster, CMB, RAR).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "sociology" claim specifically?
      *   *Correction:* Ensure I explicitly state which thesis licenses the "sociology" conclusion (only SEE does, really).
      *   *Check:* Did I cover the "auxiliary assumptions" distinction?
      *   *Correction:* Make sure Duhem-Quine is clearly separated from Empirical Equivalence.
      *   *Check:* Is the DM/MG science accurate?
      *   *Correction:* Acknowledge that MG struggles with the CMB and Cluster scales, while DM struggles with galactic scales (core-cusp, etc.). They are not fitting the *same* points perfectly.

  9.  **Final Polish:** Organize into the requested "Menu," "Verdicts," "Suspicion Check," and "Defensible Slogan." (Proceed to generate output based on this structure.)

      *   *Key Insight to emphasize:* The colleague is committing the "Underdetermination Fallacy" – moving from "data is currently ambiguous" to "data is permanently irrelevant."
      *   *Key Distinction:* Empirical Equivalence vs. Underdetermination. Underdetermination is the *state*; Equivalence is the *cause*.
      *   *Sociology Claim:* Only holds if theories are empirically equivalent *and* theoretically indistinguishable (same simplicity, etc.).

  10. **Final Output Structure:**
      *   Introduction: Acknowledge the frustration and the philosophical weight.
      *   The Menu of Theses (1-5).
      *   Assessment of the Colleague's Move (The Fallacy).
      *   Validation of User's Suspicion.
      *   The Defensible Slogan (How to use it productively).

