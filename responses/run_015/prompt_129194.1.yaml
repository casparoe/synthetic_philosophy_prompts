  **1. Vocabulary**
  The methodological distinction is well-established: **probing** (read) versus **intervention** (write), corresponding to **observational** versus **causal** evidence. However, there is no canonical nomenclature for the *internal states* themselves. Literature often assumes alignment, so the asymmetry lacks a standard label. Your "markers" and "handles" are intuitive and functionally precise for an engineering audience. "Leakage" is standard (sometimes "non-specificity"), so keep that. You aren't missing a term; you are naming a nuance that standard literature often glosses over. If you prefer formalism, **Signatures** (read) and **Levers** (write) work well, but your private terms are sufficient.

  **2. Representations**
  The gap does real work; it prevents conflating correlation with mechanism. A marker-only state is likely **epiphenomenal**—a shadow of computation rather than a driver (e.g., activation scaling with sequence length). A handle-only state is likely a **control hack**—forcing output without altering internal reasoning (like a volume knob that distorts audio rather than changing the song). The gap tells us that "representation" is not a static property of a vector but a functional role. If read and write diverge, the model does not "have" the representation in that subspace; it merely processes information in a way that allows you to extract or force it. The gap reveals distributed, context-dependent coding rather than localist symbols. It confirms that predictability $\neq$ control.

  **3. Coinage and Boundaries**
  Adopt **Signatures** (read) and **Levers** (write). Define a **Stable Representation** as a subspace where the Signature and Lever align with minimal leakage.

  *   **Clear Fail:** Signature without Lever (epiphenomenon); Lever without Signature (blind actuation).
  *   **Awkward Middle:** High leakage indicates **entanglement**. The feature exists but is not atomic; steering it drags adjacent concepts. Count this as a representation only if the leakage is consistent and documented.
  *   **Divergent Features:** If read and write point to different directions, the feature is **polysemantic** in that layer; the model uses different codes for recognition versus generation. Do not claim a single representation exists; describe the asymmetry.
  *   **Post-Training:** If alignment appears only after fine-tuning, the base model had **latent potential** but not a representation.
  *   **Settlement:** Do not claim a representation exists unless both criteria are met. If they diverge, describe the specific asymmetry (e.g., "recognizable but not steerable") rather than asserting the feature is present. This forces precision about what the model actually knows versus what it can be made to say.
