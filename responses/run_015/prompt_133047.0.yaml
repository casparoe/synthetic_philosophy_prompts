  #### **Path: YES → YES → Hard Claim**
  **Position: The Skandha-Process View**
  *   **Diagnosis:** You risk collapsing into standard reductionist physicalism unless you can specify what makes "causal stream" distinct from "psychological continuity."
  *   **[FLAG]:** *This leaf is difficult to separate from Reductionist Psychological Continuity (e.g., Parfit) using only these questions; both accept causal continuity without a soul.*

  #### **Path: YES → NO → Soft Claim**
  **Position: The Soft Compatibilist**
  *   **Diagnosis:** You struggle to justify why the narrative fiction warrants legal rights if the causal stream alone doesn't guarantee survival.
  *   **Note:** *Pairs anatta with narrative identity but rejects disembodied psychological continuity.*

  #### **Path: YES → NO → Hard Claim**
  **Position: The Unnamed Slot (Animalist-Anatta Hybrid)**
  *   **Diagnosis:** This unexplored hybrid is attractive for grounding ethics in biology but risks incoherence if the 'animal' is just another name for a self.
  *   **Status:** *Unexplored/Attractive but risky.*

  #### **Path: NO → YES → Soft Claim**
  **Position: The Deflationary 'Useful Fiction' Stance**
  *   **Diagnosis:** You face the awkward task of practicing ethics seriously while insisting the agent is merely a habit.

  #### **Path: NO → NO → Hard Claim**
  **Position: The Hard Incompatibilist**
  *   **Diagnosis:** You must explain how moral responsibility functions if nothing ever persists enough to be held accountable.

  *(Other combinations lead to unmapped positions not covered in this seminar session.)*
