answer: |-
  Good evening, everyone. For those I haven't met yet, I'm [Your Name], and I've had the privilege of sharing a department—and occasionally a dinner table—with Elaine for over thirty years.

  Looking around the room, I realise we have a split audience. Half of you could recite Plato's *Laws* Book I in your sleep; the other half just know that Elaine never turned down a decent claret. Fortunately, Elaine spent forty years bridging that gap. Her monograph, *The Wine Mirror*, argued that Plato wasn't trying to ban drink, but rather prescribing it. The theory is simple enough for us all: wine doesn't corrupt character; it strips away the social polish that hides it. It acts as a diagnostic tool. It holds up a mirror.

  So, if we are to honour Elaine properly tonight, we must apply her own rigorous standards to her. We cannot simply offer a eulogy for a saint, because Elaine's own philosophy tells us that saints are often just people who haven't been tested by the second bottle.

  If wine reveals what is already there, then what did we see in Elaine over three decades of these gatherings? We saw brilliance, certainly. But we also saw the edge. It is folklore in this department that after glass two, Elaine's tolerance for nonsense evaporated. She was famously sharp-tongued. Under a conventional view, we might apologise for that. We might say, 'Oh, that was just the wine talking.'

  But Elaine taught us better than that. If her thesis holds, the wine wasn't talking; *she* was. The politeness was the mask; the impatience was the truth. She didn't become cruel when she drank; she simply stopped pretending to suffer fools gladly. And honestly, many of us needed someone who wouldn't pretend. There is a specific kind of kindness in refusing to let you hide behind your own polished veneer. She held the mirror up to us, too, and often found us wanting.

  That diagnostic honesty is what made her such a formidable scholar and, ultimately, such a loyal friend. The mirror showed us everything: the intellect, the passion, and yes, the temper. But it showed us the real thing.

  So, as we raise our glasses, let us not drink to a sanitized version of her career. Let us drink to the clarity. To the idea that we are better for having been seen clearly by her, and for having seen her clearly in return.

  Elaine, you argued that controlled intoxication is a civic good. I'd say your retirement is proof of the concept. To Elaine.
