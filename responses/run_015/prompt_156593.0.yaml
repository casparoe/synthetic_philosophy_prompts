  **The Case for Flipping the Asymmetry**

  In modern ethics, few intuitions feel as solid as the procreation asymmetry. It goes like this: We have a strong moral duty not to bring a suffering child into existence, but we have no moral duty to bring a happy child into existence. The presence of suffering is a tragedy; the absence of happiness is merely neutral. This view dominates contemporary philosophy because it seems to protect us from the horrifying implication that we are morally required to populate the universe as densely as possible.

  But this intuition relies on a specific, often unexamined assumption about moral standing. It assumes that possible people have enough standing to be harmed by being created, but not enough standing to be benefited by it. If we adjust this framework slightly—adopting a view we might call "potential-person partialism"—the entire structure collapses. In fact, it doesn't just collapse; it inverts. Under this framing, we end up with stronger reasons to bring happy people into being than to avoid creating suffering ones.

  To see how, we have to look at what moral standing actually does. In the standard view, standing is treated like a shield: it exists potentially to block harm, but not like a magnet to attract benefit. Potential-person partialism changes the physics. It proposes that moral standing is conditional. Merely possible people possess a latent, inactive standing that only "switches on" the moment they actually exist. Before existence, there is no subject to hold rights, incur harm, or claim benefits. After existence, the subject is fully real, with full moral weight.

  This conditional activation changes the calculus of harm. In the standard asymmetry, creating a suffering child is wrong because you have harmed them—you made them worse off than they would have been otherwise. But under potential-person partialism, there is no "otherwise." Because standing only activates upon existence, there is no subject in the state of non-existence to be worse off. You cannot violate the rights of someone who lacks the standing to hold them. Therefore, the moral weight of creating a suffering person is reduced. It is still a negative outcome—a world with suffering is worse than a world without—but it is not a violation of a specific individual's claim not to be born. The harm is impersonal.

  Now consider the happy person. Under the standard view, creating them is neutral because no one was waiting around to be benefited. But under potential-person partialism, existence is the only gateway to moral value. A happy person is not just a collection of positive experiences; they are an actualized moral agent. By bringing them into being, you are not just adding pleasure to the universe; you are unlocking moral standing where there was none. You are converting moral potential into moral reality.

  Here is where the flip occurs. If the "harm" of creating a suffering person is merely an impersonal negative state (since no subject was harmed relative to non-existence), but the "good" of creating a happy person is the actualization of a moral subject, the scales tip. The creation of happiness becomes a generative act of moral significance, while the creation of suffering becomes a contained negative state.

  Why is the reason to create happiness stronger? Because moral value requires a vessel. Without existing people, the universe is morally empty. The duty to generate moral value—to create beings who can love, reason, and experience good—becomes paramount because it is the only way to expand the moral universe. The duty to avoid suffering, while still present, is downgraded from a strict prohibition against violating rights to a preference for cleaner states of affairs.

  Critics will say this sounds dangerous, as if it permits creating suffering lives. It does not. It simply reweights the priorities. If you accept that standing activates only upon existence, you must accept that non-existence cannot be a harm. Once you concede that, the urgent duty to protect possible people from existence evaporates. What remains is the positive duty to instantiate value. We are not guarding a waiting room of souls against harm; we are lighting candles in the dark. The obligation to light the candle outweighs the hesitation about the smoke.

  This is the consequence of potential-person partialism. It strips non-existence of its moral shield and charges existence with moral purpose. It suggests that the greatest failure is not the creation of a difficult life, but the refusal to create a valuable one. The asymmetry doesn't just bend; it breaks, leaving us with a mandate to populate the world not out of duty to the unborn, but out of duty to the value they alone can embody.
