answer: |-
  This is a rich set of intuitions, and you have correctly identified the fault line where standard Subjective Expected Utility (SEU) theory cracks against the concrete pavement of engineering and lived experience. You are channeling Keynes's *Treatise* (specifically the distinction between the *probability* relation and the *weight* of evidence) but bumping into the Ramsey/Savage demand for sharp credences to make the math work.

  Your working rule is close, but it contains a fatal contradiction that you've already spotted but haven't fully excised.

  ### The Diagnosis: Where Your Rule Breaks

  Your rule states: *"Weight... matters for what I should do, but only where more evidence could still arrive in time to change things."*

  But look at your **Job Case**: *"Me choosing between a risky job... one shot, no further evidence arriving before I have to sign... I still lean toward acting on the better-evidenced fifty."*

  Here, you admit that weight matters *even when no evidence can arrive*. This contradicts your rule. If the probability is truly 50/50 in both cases, and the payoff is identical, SEU says you must be indifferent. Your gut says otherwise. You are sensing that "50%" is not a sufficient statistic for the state of belief.

  The problem is that you are treating "Probability" as a property of the *world* (or the event) in the Fire/Bridge cases, but as a property of the *evidence* in the Restaurant/Job cases.
  *   **Fire:** Frequency exists. Probability is discovered.
  *   **Bridge:** Frequency does not exist (unique artifact). Probability is *assigned* (normative).
  *   **Job/Restaurant:** Frequency does not exist (unique trajectory). Probability is *estimated* (epistemic).

  Your intuition is correct: The Bridge number ($10^{-6}$) and the Fire number ($0.002$) are ontologically different objects, even if they look the same on paper. The Bridge number is often a **risk budget** (an acceptable upper bound) rather than a **prediction** (an expected frequency). Treating it as a prediction leads to the aggregation error you noted (a million bridges $\neq$ one failure/year).

  ### The Proposed Principle: The Robustness Criterion

  I propose replacing your "Working Rule" with a single, sharper principle. It draws from the literature on **Imprecise Probabilities** (Levi, Walley) and **Robust Decision Making** (Ben-Haim), but stripped of the heavy formalism.

  **The Robustness Criterion:**
  > A sharp probability $p$ is warranted for decision-making **if and only if** the estimate $p$ is *stable* under reasonable perturbations of the reference class, model specification, or source data.
  >
  > 1.  **If Stable:** Treat $p$ as a sharp number. Maximize Expected Utility.
  > 2.  **If Unstable:** Represent belief as an interval $[p_{min}, p_{max}]$ (a credal set). Maximize utility using a rule that penalizes ambiguity (e.g., Maximize the Minimum Expected Utility, or apply a discount factor to the width of the interval).
  > 3.  **Weight of Evidence:** "Weight" is not about the *potential for future learning*; it is a measure of *current model sensitivity*. High weight = low sensitivity. Low weight = high sensitivity. This matters for action **always**, not just when learning is possible, because it measures the reliability of the map, not the mutability of the territory.

  **Why this repairs your rule:**
  It validates your Job Case intuition. The "better-evidenced 50%" is robust (stable under perturbation). The "poorly-evidenced 50%" is fragile (small changes in assumptions swing it wildly). Even if you can't learn more, the fragile estimate is more likely to be *wrong* relative to the true (unknown) structure. You prefer the robust 50% because it is a more reliable guide, not because it allows updating.

  ---

  ### Testing the Principle Against Your Cases

  1.  **Fair Die / Pi Digit:**
      *   *Analysis:* Symmetry is the ultimate stability. Perturbing the model (e.g., "what if I hold the die differently?") doesn't change the logical constraint.
      *   *Verdict:* Sharp number. (Matches your intuition).

  2.  **House Fire (Actuarial):**
      *   *Analysis:* Stable reference class. Perturbing the sample size slightly doesn't shift the mean significantly.
      *   *Verdict:* Sharp number. Aggregation is valid. (Matches).

  3.  **Bridge Failure ($10^{-6}$):**
      *   *Analysis:* No reference class of identical bridges. The number comes from a fault-tree model. Perturbing the model assumptions (independence of failures, material stress limits) swings the number by orders of magnitude. It is *not* stable.
      *   *Verdict:* Interval (effectively $[0, \epsilon]$). It is a regulatory cap, not a frequency. Aggregation is invalid. (Matches your "costume" intuition).

  4.  **Restaurant / Startup / Marriage:**
      *   *Analysis:* Unique entities. No stable reference class. Models are highly sensitive to narrative framing.
      *   *Verdict:* Interval (e.g., $[0.4, 0.7]$). Point estimates are false precision. (Matches).

  5.  **Ellsberg Urn (Known vs. Unknown):**
      *   *Analysis:* Known Urn = Stable (logic). Unknown Urn = Unstable (composition could be anything consistent with the constraints).
      *   *Verdict:* Indifferent between Red/Blue *within* the Unknown Urn (symmetry of ignorance), but prefer betting on the Known Urn (Robustness).
      *   *Resolution:* This solves your tension. You aren't contradicting yourself; you are distinguishing between *internal symmetry* (Red vs. Blue) and *external stability* (Known vs. Unknown mechanism).

  6.  **Drug A (40 trials) vs. Drug B (6 trials + Story):**
      *   *Analysis:* Both point to 60%. But Drug B's estimate is fragile; a new mechanism critique swings it. Drug A is robust.
      *   *Verdict:* Prefer Drug A. This is rational ambiguity aversion, not risk aversion. (Matches).

  7.  **Job Choice (50% Robust vs. 50% Fragile):**
      *   *Analysis:* This is the fix for your rule. The Fragile 50% has a wide implicit interval (e.g., $[0.2, 0.8]$). The Robust 50% has a narrow interval (e.g., $[0.49, 0.51]$).
      *   *Verdict:* Prefer Robust. The "work" being done by evidence is establishing *stability*, not enabling *updating*.

  8.  **Marriage vs. Bridge (Both ~0.6):**
      *   *Analysis:* Both are fragile/unstable estimates. Neither has a stable reference class.
      *   *Verdict:* Incomparable. A coin toss is rational because there is no epistemic ground to prefer one fragile model over another. (Matches).

  ---

  ### Application to Your Test Cases

  Here is where the principle gets its teeth.

  **Case 1: Superforecaster (0.75) + Mechanistic Model (0.75)**
  *   **Analysis:** Do you now have a genuine number?
  *   **Principle Verdict:** **Not necessarily.** It depends on the *independence of the error structures*.
      *   If the mechanistic model was trained on data that includes the superforecaster's past judgments, or if both rely on the same underlying economic indicators, the convergence is illusory (shared fragility). The estimate is not robust to perturbations in that shared data source.
      *   If they are truly independent (one bottom-up physics/engineering, one top-down statistical pattern recognition), the convergence *increases* robustness. It narrows the implicit interval.
  *   **Prediction:** You do not get a sharp number automatically. You get a *sharper interval*. If the forecaster's confidence interval is $[0.65, 0.85]$ and the model's is $[0.70, 0.80]$, the overlap is your robust region. If the model is a "black box" with no sensitivity analysis, treat it as fragile regardless of the output.

  **Case 2: Life on Mars (Settled but Unknown)**
  *   **Analysis:** This is a proposition about a fixed fact, not a future frequency.
  *   **Principle Verdict:** **Interval / Incomparable.** There is no reference class of "universes with Mars." There is no symmetry. Any number assigned is purely a function of current geological models, which are highly sensitive to new data (even if that data won't arrive).
  *   **Prediction:** A sharp number (e.g., "12% chance") is epistemically dishonest. It should be expressed as "Current models are consistent with life, but sensitivity to assumption X is high." Betting odds should reflect ambiguity aversion (you demand better than 12:1 to bet 'Yes').

  **Case 3: ML Model (0.62 on Drifted Data)**
  *   **Analysis:** You state the world has "drifted away from its training data."
  *   **Principle Verdict:** **Reject the number.** By definition, the estimate is *unstable* under the perturbation of "time/environment." The reference class has broken.
  *   **Prediction:** The 0.62 is noise. The Robustness Criterion demands you widen the interval to $[0, 1]$ or revert to a baseline prior until the model is recalibrated. Acting on 0.62 here is not just risky; it is irrational under the Robustness Criterion because the link between evidence and hypothesis is severed.

  ---

  ### The Sacrifice: What You Must Give Up

  You asked me to be straight about which of your verdicts my principle cannot save.

  **You must give up the intuition that "Incomparable" means "Actionably Indifferent."**

  In your **Marriage vs. Bridge** case, you say: *"Forced to bet on which one happens, I'd toss a coin... and I don't think that's laziness."*

  The Robustness Criterion (specifically the MaxMin Expected Utility variant) might disagree.
  *   Suppose Marriage survival is $[0.4, 0.8]$ (Mean 0.6).
  *   Suppose Bridge survival is $[0.1, 0.9]$ (Mean 0.6, but regulated to be "safe," so perhaps the lower bound is actually higher in your mind, but let's stick to your 0.6 estimate).
  *   If you are betting on *survival*, and you are ambiguity-averse, you should look at the **lower bounds**.
  *   If the Marriage lower bound (0.4) is higher than the Bridge lower bound (0.1), the principle says: **Bet on the Marriage.**
  *   Tossing a coin implies you treat the intervals as identical in width and position. But usually, "engineering safety" implies a skewed distribution (we engineer for the tail), whereas "marriage" is a social frequency.
  *   **The Hard Truth:** If you truly find them incomparable (not just ambiguous, but lacking a common measure), then you cannot bet rationally at all. You must refuse the bet. If you *must* bet, tossing a coin is an admission that your decision theory has abdicated. The Robustness Principle forces you to find a metric (like the lower bound) to break the tie. It demands you stop saying "incomparable" and start saying "here is the worst-case scenario for each."

  **Second Sacrifice: The "Design Target" Distinction.**
  You love the idea that the Bridge number is a "target wearing a costume." The Robustness Principle absorbs this. It says the Bridge number *fails the stability test*. It doesn't give it a special ontological category (Target vs. Probability); it just says it's a **Bad Probability** (highly sensitive to model specification).
  *   *Why this matters:* It prevents you from carving out exceptions. It forces you to treat the Bridge number as a claim about the world that is simply poorly supported, rather than a different *kind* of claim. This is cleaner, but it loses the nuance that the $10^{-6}$ is *normative* (ought) not *descriptive* (is). My principle treats it as a failed descriptive claim. You might feel this misses the point of regulation.

  ### Summary for Your Students

  Hand them this:

  **The Stability Test for Probability Assignments**
  1.  **Ask:** "If I tweak my model assumptions or reference class slightly, does the number change drastically?"
  2.  **If No:** It is a **Sharp Probability**. Act on Expected Value. (Examples: Dice, Actuarial Fire).
  3.  **If Yes:** It is an **Imprecise Probability** (Interval). Act on Robustness (e.g., maximize the minimum gain). (Examples: Startups, Unique Engineering, Drifted ML).
  4.  **Note:** "Weight of Evidence" is just a measure of Stability. It matters for action even if you can't learn more, because it tells you how likely your map is to be wrong.

  This preserves your Keynesian gut (weight matters) without abandoning the Ramseyian need for action (you still choose, you just choose differently). It explains why you trust the Fire number over the Bridge number (Stability vs. Fragility) and why you prefer the well-evidenced 50% (Narrow Interval vs. Wide Interval).

  It leaves you with the Marriage/Bridge coin toss as the only casualty: The principle demands you look at the worst-case scenario and bet on the one that survives that. If you refuse to do that, you are refusing to decide, not recognizing an ontological mystery.
