answer: |-
  First, a quick clarification on your premise (5). You wrote: *"I'd rather keep (5) if I can, since I'd like to believe prices carry real information."*

  But premise (5) states: *"Prices are mostly noise, and markets don't do the information-aggregation thing."*

  These are opposites. I am going to assume you mean you want to **reject** (5)—i.e., you want to save the idea that prices aggregate information—without having to accept your advisor's claim that heterogeneous priors are irrational.

  Your advisor is a theorist, and his argument is logically valid *within the closed system of the models he is citing*. Milgrom-Stokey (No-Trade) and Aumann (Agreement) are real theorems. However, his application of them to the real world commits a category error regarding **what drives volume versus what drives prices**, and a logical sleight-of-hand regarding **priors**.

  Here is the cheaper exit. You don't need to burn down market efficiency to justify your job, and you don't need to accept that different priors are irrational.

  ### 1. The Volume vs. Price Distinction (The Marginal Trader)
  The biggest hole in the argument is the leap from (4) to (5).
  *   **(4)** says most *trades* (volume) are noise.
  *   **(5)** concludes most *prices* are noise.

  This conflates **inframarginal** activity with **marginal** pricing. Prices are set by the marginal trader—the person willing to buy or sell at the very edge of the order book. Volume is the sum of everyone else.

  Imagine an auction for a painting. 100 people bid. 99 of them are drunk and bidding randomly (noise). 1 person is an art expert who bids \$1M based on provenance (information). If the drunk bidders cap out at \$500k, the price is \$1M. The volume was 99% noise, but the price was 100% informative.

  In financial markets, informed traders often trade *more aggressively* when they know they have an edge, while noise traders churn amongst themselves. As long as the informed capital is the *marginal* capital determining the clearing price, prices can be efficient even if 95% of the volume is "noise." Your advisor's argument proves markets are noisy *casinos*, but it does not prove they are *wrong* casinos.

  **Cost of keeping this:** You have to admit that high frequency/volume is a poor proxy for market efficiency.

  ### 2. The "Common Knowledge" Loophole
  The Milgrom-Stokey No-Trade Theorem (1982) relies on a condition much stronger than "rationality." It requires **common knowledge of rationality and common knowledge of the motive to trade.**

  For the theorem to hold, I must not only know that you are rational; I must know that *you know that I know* you are rational, and crucially, I must know *why* you are trading.
  *   In the model, if I see you trade, I know you have information.
  *   Because I know you have information, I update my beliefs to match yours.
  *   Because we now agree, there is no gain from trade.

  In the real world, markets are anonymous. When you see a sell order, you do not know if it comes from:
  1.  An informed trader (who knows bad news).
  2.  A liquidity trader (who needs cash for a house).
  3.  A noise trader (who is panicked).

  Because you cannot distinguish (1) from (2) or (3), you do not fully update your beliefs to match the trader's. You assume there is a probability they are just a liquidity trader. This "opacity" breaks the common knowledge chain. You can rationally trade against someone you suspect might be informed, because you suspect they might *not* be.

  **Cost of keeping this:** You have to admit that market efficiency relies on the presence of noise traders to "camouflage" the informed traders. (This is the Grossman-Stiglitz Paradox). If markets were perfectly efficient, no one would bother gathering information, and they would cease to be efficient.

  ### 3. Heterogeneous Priors are Not "Irrational"
  Your advisor's attack on heterogeneous priors is the weakest link logically. He claims: *"Different priors means disagreement nobody can justify — irrationality with a fancy name."*

  This misinterprets Aumann's Agreement Theorem. Aumann's theorem states: *If* agents have common priors and common knowledge of posteriors, they cannot agree to disagree.
  It does **not** say that having different priors is irrational.

  Priors are exogenous primitives in Bayesian models. They represent your starting state of the world before data.
  *   **Advisor's view:** Priors should be derived from some universal logic. If they differ, one is wrong.
  *   **Reality:** Priors are formed by genetics, upbringing, culture, and unique life history. There is no "universal prior" for the price of oil in 2025.

  If I believe the coin is biased Heads (Prior A) and you believe it is biased Tails (Prior B), and we bet, we are not violating logic. We are simply different people. Calling this "irrational" is like calling it "irrational" that I like chocolate and you like vanilla. It's a difference in **taste**, not a difference in **calculation**.

  In finance, "different priors" often manifests as **different models**. I use a mean-reversion model; you use a momentum model. Neither is logically inconsistent. We just weight evidence differently. This allows for rational trade without requiring one party to be a "noise trader" in the sense of being random or stupid. We are just speculating on different hypotheses.

  **Cost of keeping this:** You have to accept that there is no "God's eye view" of the true price. There is only the consensus of differing models.

  ### 4. The "Parasite" Rebuttal (Liquidity Provision)
  Finally, even if you grant your advisor that you are trading against noise traders, the conclusion that you are a "parasite" is economically false.

  Noise traders (liquidity traders) need to trade. They need to sell stock to buy houses, or hedge currency risk for their business. They are willing to pay a spread to do this immediately.
  *   **Your role:** You are providing **liquidity insurance**. You stand ready to take the other side of their trade when they need to move.
  *   **The Profit:** Your profit is the premium for bearing the risk that the price moves against you while you hold their position.

  Calling this "picking pockets" is like calling an insurance company "parasitic" for collecting premiums from people whose houses didn't burn down. You are being paid for **risk-bearing** and **immediacy**, not just information. Even in a world of pure noise, a market maker adds value by reducing transaction costs for the real economy.

  ### Summary: Where the Advisor Goes Wrong
  1.  **Volume $\neq$ Price:** High noise volume does not imply noisy prices (Marginal Trader argument).
  2.  **Opacity $\neq$ Rationality:** Anonymity breaks the "common knowledge" required for the No-Trade theorem to bind.
  3.  **Priors $\neq$ Logic:** Different priors are differences in starting parameters, not logical errors. Aumann doesn't outlaw them; it just says what happens if they *are* common.
  4.  **Profit $\neq$ Predation:** Profits from noise traders are often fees for liquidity provision and risk transfer, which are valuable economic services.

  ### The Verdict
  You can keep the belief that prices aggregate information (reject 5) by noting that informed marginal traders discipline prices even amidst noise volume.

  You can keep the belief that your priors are rational (reject the advisor's prior attack) by noting that priors are subjective inputs, not logical outputs.

  Your advisor is right that the *textbook* Efficient Market Hypothesis is a fairy tale if taken literally. But the *practical* Efficient Market Hypothesis—that prices are hard to beat because they incorporate the views of many diverse, motivated agents—remains robust. You aren't a parasite on a casino; you're a dealer providing the chips so the game can happen.

  **One final note:** If you want to really push back, ask him about the **Grossman-Stiglitz Paradox (1980)**. It explicitly proves that if prices were perfectly informative (as his argument suggests they should be to avoid noise), no one would gather information, and prices would cease to be informative. The existence of "noise" is a *necessary condition* for markets to function, not a bug. You can tell him you're just helping solve the paradox.
