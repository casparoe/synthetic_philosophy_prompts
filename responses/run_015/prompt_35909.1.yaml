      *   **Flaw 2: Common Knowledge of Rationality.**
          *   The No-Trade theorem requires me to know that *you* know that *I* know that *we* are rational. In reality, I might think I have info, and I might think *you* are trading for liquidity, not info. If I think you are a noise trader, I will trade against you. The theorem breaks down if agents aren't sure about *why* others are trading.

