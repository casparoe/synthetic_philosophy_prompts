answer: |-
  This is a sophisticated approach to *Lord of the Flies*. Applying David Lewis's *Convention: A Philosophical Study* (1969) to Golding's novel moves beyond standard themes of "civilization vs. savagery" and asks a structural question: *How do rules actually function as social technology, and why do they break?*

  To do this justice, we must first establish the philosophical ground rules, distinguishing between what Lewis definitively argued and where philosophers still disagree. Then, we will apply that framework to the text, looking for where the boys' behavior fits the model and where the novel reveals the model's limitations.

  ### 1. The Lewisian Framework: Settled Conditions and Contested Edges

  David Lewis defines a convention as a solution to a **coordination problem**. To understand if the boys' rules are conventions, we must test them against Lewis's specific criteria.

  **The Settled Core of Lewis's Theory:**
  Most philosophers agree that for Lewis, a convention requires:
  1.  **Regularity:** Everyone (or almost everyone) follows a specific pattern of behavior ($R$).
  2.  **Conditional Preference:** Each person prefers to follow $R$ *on the condition* that others do. (I will drive on the right side of the road *if* you do.)
  3.  **Alternative Possibility (Arbitrariness):** There could have been another rule ($R'$) that solved the problem just as well. (We could have driven on the left.)
  4.  **Common Interest:** The situation is a coordination problem, meaning everyone generally wants the same outcome (e.g., avoiding crashes, being heard).

  **The Contested Edges:**
  This is where your presentation can show philosophical nuance.
  *   **Common Knowledge:** Lewis argued that for a convention to exist, it must be *common knowledge* (I know you know, you know I know, ad infinitum) that everyone prefers to conform. Many contemporary philosophers (like Margaret Gilbert or Ruth Millikan) argue this is too strict. They suggest norms can evolve through habit or implicit understanding without this heavy epistemic burden.
  *   **Arbitrariness vs. Focal Points:** Lewis admits conventions are arbitrary, but he relies on Thomas Schelling's idea of "focal points"—salient solutions people naturally gravitate toward. Critics argue that if a solution is a "focal point" (like the conch being loud), it isn't truly arbitrary, which complicates Lewis's definition.
  *   **Coordination vs. Cooperation:** Lewis's model works best for *coordination* (we want the same thing but need to match actions). It works less well for *cooperation* problems (where we want different things, like the Prisoner's Dilemma).

  With this map in hand, let us examine the island.

  ### 2. The Conch and Assembly: A Fragile Convention

  The first major norm established is the rule of the conch: whoever holds the shell has the right to speak, and others must listen.

  **Does it meet Lewis's conditions?**
  *   **Regularity:** Initially, yes. The boys gather and respect the holder.
  *   **Arbitrariness:** This is debatable. Lewis requires that another rule could have worked. They could have raised hands, or sat in circles. However, the conch is not a *random* object; it is a **focal point**. It is shiny, loud, and rare. In philosophical terms, the *rule* ("hold object to speak") is arbitrary, but the *choice of object* is salient. This aligns with the Schellingan critique of Lewis: the convention isn't purely arbitrary; it leverages natural properties to solve the coordination problem of "who speaks next."
  *   **Conditional Preference:** This holds for Ralph and Piggy. Piggy says, "We got to have rules and obey them. After all, we're not savages." He prefers order *if* others maintain it.
  *   **Common Knowledge:** Initially, the agreement is explicit. Ralph asks, "How can we ever be rescued except by luck, if we don't keep the fire going?" The expectations are out in the open.

  **Where it Fails:**
  The Lewisian framework breaks down when the **conditional preference** evaporates. For a convention to sustain itself, I must want to follow the rule *because* you are following it.
  When Jack interrupts assemblies, he is signaling that he no longer has this conditional preference. He does not care if the others follow the rule; he prefers to speak regardless. Once Jack publicly rejects the conch ("Bollocks to the rules!"), the **common knowledge** fractures. It is no longer common knowledge that everyone expects everyone to conform. The convention doesn't just "break"; it ceases to be a convention for half the population and becomes a tool of coercion for the other half.

  **Philosophical Insight:** Golding dramatizes the fragility of *common knowledge*. Lewis treats common knowledge as a logical state. Golding shows it as a psychological performance. As long as the boys *act* like they believe in the conch, the convention holds. The moment one boy visibly stops caring, the epistemic structure collapses.

  ### 3. The Signal Fire: Coordination vs. Conflict of Interest

  The rule regarding the signal fire is where the Lewisian model faces its hardest test.

  **The Coordination Problem:**
  Ideally, the fire is a pure coordination problem: everyone wants rescue, so everyone should contribute to the fire. If this were the only dynamic, Lewis's theory would predict the norm would sustain itself, provided everyone expected everyone else to tend it.

  **The Conflict of Interest:**
  However, the fire competes with hunting. For Jack, meat becomes a higher priority than rescue. This shifts the scenario from a **Coordination Problem** (where interests align) to a **Cooperation Problem** (where interests diverge).
  *   **Lewis's Limit:** Lewis's account of convention is designed for situations where we *agree* on the goal but need to coordinate *how* to get there (e.g., which side of the road to drive on). He is less equipped to explain norms when the group disagrees on the *goal* itself.
  *   **The Breakdown:** When the fire goes out because the hunters were chasing a pig, it isn't a failure of convention in the Lewisian sense; it is a revelation that the "common interest" was an illusion. Ralph wants rescue; Jack wants dominion over the island.

  **Analysis:** If we strictly apply Lewis, the fire rule was never a true convention for the whole group; it was only a convention for Ralph's faction. For Jack's faction, it was a temporary constraint they tolerated only until a better regularity (the hunt) appeared. This highlights a contested area in philosophy: Can a norm be a "convention" if it is imposed by a subset of the group against the interests of another? Lewis would likely say no; modern social ontologists might call it a "power-laden norm."

  ### 4. The Evolution of Norms: British Import or Universal?

  Your prompt asks whether these norms are culturally specific British conventions or universal coordination devices. Golding suggests a disturbing hybrid.

  **The Initial Norms (British Import):**
  The initial rules (assemblies, raising hands, keeping a fire) are clearly imports from the boys' schooling. They rely on the "common knowledge" of British civility. Piggy is the guardian of this. He represents the Lewisian ideal: a rational agent who believes that if we just make the expectations clear, coordination will follow.

  **The Emerging Norms (Universal/Primal):**
  As the group fractures, new conventions evolve among Jack's tribe: the face paint, the hunting dance, the chant ("Kill the beast! Cut the throat!").
  *   **Are these Lewisian Conventions?** Surprisingly, yes.
      *   **Regularity:** They all paint their faces and dance.
      *   **Conditional Preference:** A hunter prefers to paint his face *if* the others do (to feel part of the pack).
      *   **Arbitrariness:** They could have chanted anything. The specific chant is arbitrary, though the *function* (bonding through rhythm) is psychological.
      *   **Common Knowledge:** Within the tribe, it is common knowledge that conformity equals safety.

  **The Philosophical Implication:**
  Golding suggests that "civilized" conventions (the conch) are thin because they rely on abstract reasoning and deferred gratification (rescue later). "Savage" conventions (the hunt) are robust because they rely on immediate emotional coordination (fear and adrenaline).
  This challenges a purely Lewisian view which treats all conventions as logically equal solutions to coordination problems. Golding implies that conventions grounded in **fear** are more stable than conventions grounded in **reason**. Lewis's theory is neutral on *why* we prefer to conform; Golding argues that the *source* of that preference (fear vs. duty) determines the convention's survival.

  ### 5. Where the Novel Resists the Theory

  To treat the text seriously, we must acknowledge where *Lord of the Flies* refuses to fit the philosophical model.

  **1. Fear and Irrationality:**
  Lewis's model assumes agents are roughly rational. They conform because it maximizes their utility to coordinate. However, the boys are driven by the "Beast"—an irrational fear.
  *   **The Mismatch:** In Lewis's world, if a convention stops working, we negotiate a new one. In Golding's world, fear bypasses negotiation. The boys do not adopt the hunting rituals because they are the most efficient coordination solution; they adopt them because they are terrified. The "convention" of the dance is a panic response. This supports the critics who argue that Lewis overstates the role of rational expectation and understates the role of emotion and mimicry.

  **2. Dominance vs. Coordination:**
  Lewis assumes conventions arise to help everyone. But Jack's rules are not about coordination; they are about hierarchy.
  *   **The Scene:** When Jack steals Piggy's glasses, he is not solving a coordination problem. He is asserting dominance. A Lewisian convention requires that I prefer to conform *if* you do. But under Jack, the boys conform because if they *don't*, they will be hurt. This is coercion, not convention.
  *   **Philosophical Distinction:** This is a crucial distinction for your presentation. Lewis distinguishes between conventions (voluntary coordination) and coercive laws. Golding shows how easily the former slides into the latter when the "common interest" condition is replaced by "fear of the leader."

  ### 6. What the Novel Contributes to Philosophy

  If you conclude your presentation by asking what *Lord of the Flies* adds to the debate on convention, consider these three points:

  1.  **The Emotional Substrate of Common Knowledge:**
      Formal philosophy treats "common knowledge" as a logical state (I know that you know). Golding shows it as an *emotional atmosphere*. The conch works only as long as the boys feel a shared sense of shame or duty. When that emotion evaporates, the logical state of "common knowledge" becomes irrelevant. Fiction reveals that conventions require an emotional fuel that formal theory often ignores.

  2.  **The Instability of Arbitrariness:**
      Lewis argues conventions are arbitrary. Golding shows that while the *rule* might be arbitrary, the *symbol* is not. The conch is beautiful; the mask is terrifying. The aesthetic and psychological weight of the symbol matters. A philosophical model that treats the conch and a random stone as mathematically equivalent misses the literary reality of why the boys obey one and not the other.

  3.  **Conventions as Precursors to Violence:**
      In philosophy, conventions are usually seen as peace-making devices (traffic rules prevent crashes). Golding presents a dark counter-example: conventions can coordinate violence just as efficiently as they coordinate rescue. The hunting dance is a highly efficient convention for group bonding, but its output is murder. This challenges the normative assumption that "convention" equals "social good."

  ### Conclusion for Your Presentation

  In summary, reading *Lord of the Flies* through David Lewis reveals that the boys' initial society functions as a genuine, albeit fragile, Lewisian convention. The conch and assembly rules meet the criteria of regularity, conditional preference, and common knowledge. However, the novel dramatizes the **collapse** of these conditions.

  When Jack rejects the conch, he destroys the **conditional preference**. When the fire is neglected, he reveals the lack of **common interest**. And when the hunt begins, he establishes a new, darker convention based on fear rather than reason.

  Golding ultimately suggests that Lewis's framework is too rational. It explains how norms work when people are calm and cooperative. But *Lord of the Flies* shows that when fear enters the equation, the "arbitrary regularity" of convention is swept away by the "focal point" of violence. The novel contributes to philosophy by reminding us that conventions are not just logical agreements; they are psychological contracts that can be broken not just by confusion, but by the human capacity for cruelty.

  ***

  **Advice for your Presentation:**
  *   **Visual Aid:** Consider a slide that lists Lewis's 5 conditions on one side and checks them off against the "Conch Era" and the "Tribe Era."
  *   **Quote:** Use Piggy's line ("We got to have rules") to represent the Lewisian view, and Jack's line ("Bollocks to the rules") to represent the breakdown of conditional preference.
  *   **Nuance:** Be careful not to say Lewis is "wrong." Instead, argue that Lewis provides the *structure* of the rules, while Golding provides the *psychology* of why that structure fails.
