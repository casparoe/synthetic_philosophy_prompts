answer: |-
  ### Editor's Brainstorm: Audience Dynamics

  You are walking into a minefield where three distinct epistemologies collide. Here's how the room will react to your thesis ("functional convergence makes plagiarism attribution epistemically impossible"):

  1.  **The IP Lawyers (3):** They are pragmatic positivists. They view copyright as a statutory tool, not a philosophical truth. Their instinct will be to dismiss your argument as "interesting theory, but irrelevant law." They will push *scènes à faire* (standard elements dictated by function) and Trade Dress as existing solutions. **Risk:** They will frame you as reinventing the wheel or ignoring current legal remedies.
  2.  **The Working Chefs (2):** They operate on embodied knowledge and reputation. Their claim to ownership is moral and intuitive, not legal. Your thesis threatens their labor identity. If you say "you couldn't know if it was stolen," they hear "your expertise is worthless." **Risk:** Hostility. They will view your argument as an excuse for theft.
  3.  **The Philosopher of Art (1):** They are the wildcard. They suspect recipes lack "artistic identity conditions." They will probe whether your functionalism reduces cooking to engineering. **Risk:** They will trap you in an ontological corner where you either deny creativity exists or concede authorship claims you're trying to dismantle.

  **Strategy:** Do not fight the lawyers on law, do not fight the chefs on intuition. Fight on *epistemology*. You are not saying theft *doesn't happen*; you are saying we cannot *know* it happened with certainty. Keep that distinction razor-sharp.

  ***

  ### Strategic Concessions (Say This Up Front)

  Before you take questions, state these three things clearly to disarm the room:
  1.  **Concede Legal Reality:** "I am not arguing copyright law *should* protect recipes today, nor ignoring that Trade Dress exists. I am analyzing the *epistemic conditions* of attribution itself."
  2.  **Concede Moral Rights:** "Functional convergence does not mean theft is morally permissible. It means proving *who* originated the function is impossible."
  3.  **Concede Outliers:** "I am arguing about the microdomain of standard culinary functions, not unique, non-functional artistic garnishes."

  ***

  ### Q&A Prep Sheet

  **1. The Moral Hazard Trap (Likely from Chefs/Lawyers)**
  *   **Question:** "Are you telling chefs they should just let people steal their dishes because physics makes it impossible to prove?"
  *   **90-Second Reply:** "Not at all. I'm distinguishing between moral wrongs and epistemic certainty. A theft can occur even if we can't prove it in court or via analysis. My argument is that because flavor and texture are bound by physical laws, two chefs can independently arrive at the exact same dish. Therefore, accusing someone of copying is always an assumption, not a fact. We should protect chefs' livelihoods, but we shouldn't lie about the certainty of ownership."
  *   **Weakness:** Sounds like you're providing a loophole for bad actors.

  **2. The Legal Mootness Objection (Likely from Lawyers)**
  *   **Question:** "Copyright law already excludes recipes as functional systems. Why does your epistemic argument matter?"
  *   **90-Second Reply:** "Because the legal exclusion is based on the idea/expression split, which assumes we can identify the 'expression.' I'm arguing that in cooking, the expression *is* the function. If the physical constraints force identical outcomes, the 'expression' disappears into the 'idea.' This isn't just legal doctrine; it's a claim about the nature of culinary creation that suggests the law is right for deeper reasons than it states."
  *   **Weakness:** Lawyers may view this as over-theorizing a settled statute.

  **3. The Intuition Insult (Likely from Chefs)**
  *   **Question:** "I've been cooking for twenty years. I know when my vibe is stolen. You're calling my expertise a lie?"
  *   **90-Second Reply:** "I'm not questioning your experience; I'm questioning the inference. You feel a similarity, and you infer causation. But in a field governed by chemical constraints, similarity doesn't prove causation. Your intuition detects resonance, not origin. I'm validating your skill while suggesting the 'theft' conclusion is a leap your intuition makes, not a fact the dish proves."
  *   **Weakness:** Chefs may feel you are patronizing their "gut feeling."

  **4. The "Scènes à Faire" Rebuttal (Likely from Lawyers)**
  *   **Question:** "Isn't this just the *scènes à faire* doctrine? Elements dictated by function aren't protectable. You're repackaging existing law."
  *   **90-Second Reply:** "*Scènes à faire* is a legal conclusion that certain elements are standard. I'm arguing for the *mechanism* behind why they are standard. It's not just convention; it's physical necessity. My point is stronger: it's not that we *choose* not to protect these elements, but that we *cannot* attribute them to a single author even in principle. It shifts the focus from policy to ontology."
  *   **Weakness:** Distinction is subtle; lawyers may see it as semantic hair-splitting.

  **5. The Trade Dress Alternative (Likely from Lawyers)**
  *   **Question:** "What about Trade Dress? The plating and visual presentation are protectable. Doesn't that solve the attribution problem?"
  *   **90-Second Reply:** "Trade Dress protects the visual look, not the functional recipe. But if the flavor profile forces the plating—for example, a soufflé must be served immediately in a specific vessel—then the visual is also functionally constrained. I'm arguing the functional bleed-over contaminates the visual claim. You can't separate the taste from the presentation when physics dictates both."
  *   **Weakness:** Trade Dress law is specific; you might be overstating the functional constraint on visuals.

  **6. The Unique Combination Counter (Likely from Chefs)**
  *   **Question:** "What about distinct pairings that aren't necessary? Like putting charcoal in ice cream? That's not physics, that's creativity."
  *   **90-Second Reply:** "That's the outlier I conceded. My thesis covers the microdomain of standard culinary functions—balance, texture, heat. Novelty ingredients are different. But once that charcoal ice cream becomes a 'standard' for a certain texture profile, others will converge on it. I'm talking about the convergence that happens after the novelty wears off and the dish becomes a functional standard."
  *   **Weakness:** Requires you to constantly define where "function" starts and "novelty" ends.

  **7. The Agency Reduction (Likely from Philosopher)**
  *   **Question:** "If function dictates form, is the chef an artist or an engineer? Are you denying agency?"
  *   **90-Second Reply:** "I'm not denying agency; I'm locating it. The agency is in the selection and timing, not in the invention of the flavor structure itself. Like a sonnet writer who doesn't invent the rhyme scheme but writes the poem. The chef works within constraints. Acknowledging the constraints doesn't remove the art; it clarifies where the art actually lives—in the execution, not the formula."
  *   **Weakness:** Risks reducing cooking to mere execution, which chefs may resent.

  **8. THE "HOPE NOBODY ASKS" (From Philosopher)**
  *   **Question:** "If recipes are functional scripts that converge, doesn't that make them like Conceptual Art instructions? In Conceptual Art, owning the idea *is* the work. Doesn't that grant the chef *more* ownership, not less?"
  *   **90-Second Reply:** "Conceptual Art relies on the artist's intent to certify the work. Cooking relies on physical consumption. You can't verify the 'intent' of a recipe once the dish is eaten, only the physical outcome. In Conceptual Art, the certificate matters. In cooking, the sensation matters. Since the sensation is functionally convergent, the 'certificate' of authorship loses its anchor. The medium destroys the claim."
  *   **Weakness:** Conceptual Art law is murky; a sharp philosopher could argue the "certificate" (the menu/name) is exactly what IP should protect.
