answer: |-
  Here is the argument for eliminative materialism routed through formal modeling and pragmatic redundancy, rather than neuroscience, followed by a status check on where this stands in contemporary philosophy of mind.

  ### The Argument: Formal Redundancy Over Neural Reduction

  The standard Churchland-style argument claims Folk Psychology (FP)—our everyday talk of beliefs, desires, and intentions—is a false empirical theory about brain states that will be replaced by neuroscience. You are right to find this exhausted. It relies on a reductionism that hasn't materialized and invites the objection that FP operates at a different "level of analysis" than neurons.

  A stronger, under-utilized route argues that FP is not *neurally* false, but *formally* obsolete.

  **1. Belief-Desire as Legacy Code**
  Folk Psychology treats agents as containers of propositional attitudes ("I believe *p*," "I desire *q*"). This was a necessary heuristic for social coordination when we lacked better tools. It allowed us to compress complex behavioral dispositions into manageable nouns. However, modern decision theory and game theory allow us to model agency without positing internal propositional states.

  We can model an agent entirely through:
  *   **Preference Orderings:** A ranking of outcomes (A > B > C).
  *   **Constraint Sets:** Physical or logical limitations on action.
  *   **Commitment Devices:** Mechanisms that lock in future behavior.

  If you can predict and explain an agent's behavior perfectly using a utility function and a set of constraints, the positing of a "belief" becomes ontologically redundant. It adds no predictive power. In formal modeling, "belief" is often just a probability distribution over states of the world. If we have the distribution, we don't need the folk label.

  **2. The Phlogiston Analogy**
  Phlogiston wasn't "crazy" for its time; it was a useful placeholder for combustion. It allowed chemists to coordinate predictions before they understood oxidation. Similarly, "belief" is a placeholder for complex computational states involved in information processing and goal pursuit.

  Just as oxygen theory didn't just reduce phlogiston but eliminated it (because the concept was tied to a false framework of substance transfer), formal agency theory eliminates belief. It doesn't say "beliefs are just preference orderings." It says "preference orderings do the work; beliefs are the ghostly residue of a pre-formal era." We keep the math, we drop the metaphysics.

  **3. Dodging the Self-Refutation Trap**
  The classic objection is: "If there are no beliefs, do you *believe* eliminativism is true? If yes, you're wrong. If no, why should I listen?"

  This argument assumes that "accepting a theory" requires the existence of the very entity being eliminated. The formal-redundancy route dodges this by distinguishing between **folk belief** and **theoretical acceptance**.

  *   **Folk Belief:** A reified, internal sentence-like state that causes behavior (the target of elimination).
  *   **Theoretical Acceptance:** A disposition to assert a sentence within a specific linguistic framework because it yields better coordination/prediction.

  When the eliminativist says, "There are no beliefs," they are not reporting on an internal folk-state. They are making a *performative move* to shift the linguistic framework. They are saying: "The framework that requires 'beliefs' to explain this utterance is inferior to the framework that explains it as a commitment to a formal model."

  The statement is not a belief *within* Folk Psychology; it is a rejection *of* Folk Psychology. It is akin to a chess player saying "There are no kings" while playing Go. They aren't contradicting themselves; they are pointing out that the rules of the current game don't require that piece.

  **4. Why We Still Talk That Way (The Coordination Heuristic)**
  If beliefs don't exist, why is "I want coffee" universal? Because FP is a low-cost, high-efficiency compression algorithm for low-stakes social environments.

  Running a full game-theoretic model of your barista is computationally expensive and unnecessary. FP is "legacy code" that evolution hardwired into us because it was "good enough" for tribal coordination. It creates a shared interface for social negotiation. We continue to use it for the same reason we use Fahrenheit or miles per hour: it's the inherited interface, not because it maps cleanly onto the underlying reality. The persistence of the talk is a fact about social inertia, not evidence of ontological reality.

  ***

  ### Status Check: Settled vs. Contested

  It is vital to distinguish where this argument lands relative to the current consensus. Eliminative Materialism is **not** the consensus view in philosophy of mind.

  **What is Generally Settled (Consensus):**
  *   **Physicalism:** Most philosophers agree that mental states depend on physical states (the brain). Dualism is the minority view.
  *   **The Reality of Intentionality:** The majority view (Realism) holds that beliefs and desires *do* exist, either as neural states, functional roles, or abstract objects. They argue that you cannot make sense of rationality without them.
  *   **Neuroscience hasn't eliminated FP yet:** There is no settled neuroscientific theory that successfully predicts behavior better than FP in everyday contexts. The "neural replacement" promised by Churchland in the 80s has not happened.

  **What is Genuinely Contested:**
  *   **The Ontological Status of FP:** This is the battleground.
      *   *Realists* say beliefs are real causes.
      *   *Instrumentalists* say beliefs aren't real, but the talk is indispensable (this is the main rival to your argument).
      *   *Eliminativists* say beliefs aren't real and the talk should eventually be discarded.
  *   **The Viability of Formal Replacement:** It is highly contested whether game theory or AI modeling can actually *replace* FP. Critics argue that formal models presuppose the very intentionality they try to replace (e.g., assigning "utility" requires interpreting what the agent values, which smuggles "desire" back in).
  *   **Self-Refutation:** Whether the self-refutation objection is fatal remains a live debate. Your proposed solution (framework shifting) is a known defense, but not all philosophers accept that "theoretical acceptance" can be cleanly separated from "belief."

  **Summary for your Chapter:**
  You can argue that Eliminativism is the most coherent stance *if* one prioritizes formal parsimony over intuitive continuity. However, you must acknowledge that this is a minority position. The strength of your specific argument lies in shifting the burden from "show me the neuron that kills the belief" to "show me the work the belief does that a preference function cannot." That is a much harder challenge for the Realist to meet, even if the consensus currently favors them.
