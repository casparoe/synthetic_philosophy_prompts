      *   *Caveat:* The "no-lose" argument holds. However, the *identification* of the dominating mixture relies on EU to calculate the mixture's payoff against each column. If the player doesn't evaluate mixtures via EU (e.g., they hate risk/ambiguity in their own randomization), they might not accept the mixture as better.
      *   *Ranking:* Awkward. The "no-lose" logic holds pointwise, but the agent must accept the mixture as a valid act with those specific values.

  6.  **Address Question 4: Predictive vs. Normative:**
      *   *Normative:* "You ought not play a dominated strategy." Hard to falsify. If someone plays it, they are irrational (or the model of their preferences is wrong).
      *   *Predictive:* "People won't play dominated strategies." Easily falsified (people do).
      *   *Insulation:* Is it a dodge? In philosophy, normative claims are valid. But if the claim is "This is what rationality *is*," and it relies on heavy cardinal assumptions (see point 1), the normative force weakens for agents who don't satisfy vNM.
      *   *Ranking:* Merely Awkward. Normative claims are the home turf of philosophy.

