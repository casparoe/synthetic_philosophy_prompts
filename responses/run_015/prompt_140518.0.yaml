      *   *Is the transformation affine?* No. $0 \to 0, 1 \to 1, 1.5 \to 1.5, 2 \to 10$. An affine transformation $u' = au + b$ would preserve ratios of differences. Here $(2-1.5)/(1.5-1) = 0.5/0.5 = 1$. New: $(10-1.5)/(1.5-1) = 8.5/0.5 = 17$. Not affine. So it changes the vNM utility function.
