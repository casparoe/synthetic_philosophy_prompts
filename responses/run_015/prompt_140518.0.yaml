      *   *Scenario:* Player evaluates acts by Min Expected Utility (MEU) or just Maximin over outcomes.
      *   *Dominance:* If I use Maximin (worst case), does mixed dominance hold?
      *   *Logic:* If $\sigma_i$ strictly dominates $s_i$, then $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for *all* $s_{-i}$.
