answer: |-
  This is an exceptionally sharp worry. You have correctly identified the fault line between the *ordinal* intuition of "doing better" and the *cardinal* machinery required to make mixed strategies work. Your example is valid, and it strikes at the heart of the "assumption-light" slogan.

  Here is the map you requested, ranked from **Fatal** (requires abandoning or significantly qualifying the slogan) to **Merely Awkward** (requires clarification of scope).

  ---

  ### 1. The Cardinality Objection (Fatal to "Assumption-Light")

  **The Issue:** Your relabeling example is decisive. Pure-strategy strict dominance is invariant under any monotonic increasing transformation of utility (ordinal). Mixed-strategy strict dominance is **only** invariant under positive *affine* transformations (cardinal/vNM).

  In your first game, the "cost" of hedging against X (losing on Y) is too high relative to the gain. In the second game, the payoff intensity on A and B is amplified, making the hedge "worth it." The procedure yields different recommendations for the same ordinal preferences.

  **The Standard Reply:** A game theorist will say: "A strategic-form game is *defined* as a tuple including vNM utility functions. If you apply a non-affine transformation, you have defined a *different game* representing different risk attitudes. The procedure is invariant under the correct transformations for the object it studies."

  **Why This Fails Your Philosophical Goal:** You are selling IESDS as the "core of rationality." If "rationality" requires vNM cardinality, you are not selling a core that applies to all rational agents (e.g., those with ordinal preferences, or those who violate independence but still want to avoid sure losses). You are selling the core of *vNM-rationality*.
  *   **Pure Dominance:** Requires only that $A \succ B$.
  *   **Mixed Dominance:** Requires that the agent evaluates the lottery $\frac{1}{2}A + \frac{1}{2}B$ as exactly the midpoint of their utility scale.

  **Defender's Concession:** You must concede that the "no-lose" argument for *mixed* dominance implicitly assumes the agent satisfies the **Independence Axiom** (or linearity over lotteries). If an agent prefers $A$ to $B$ but refuses to mix them because they dislike objective risk (or ambiguity in their own randomization), the "no-lose" argument fails to persuade *them*, even if the math holds for an EU maximizer.
  *   **Verdict:** **Fatal** to the claim that this is assumption-light compared to equilibrium concepts. It assumes vNM rationality, which is a heavy psychological/structural commitment. It is only "light" relative to Nash Equilibrium *within* the vNM framework.

  ### 2. The Epistemic/Correlation Objection (Awkward/Technical)

  **The Issue:** You recalled correctly. In games with $n \ge 3$ players, a strategy is strictly dominated by a mixed strategy if and only if it is **never a best response to any belief** over the opponents' strategy profiles (Pearce 1984). Crucially, this "belief" allows for **correlations** between opponents' choices.

  If you hold that rational players believe opponents choose *independently* (the standard non-cooperative assumption), the set of strategies that are best responses to *independent* beliefs is a subset of those best responses to *correlated* beliefs. Consequently, the set of undominated strategies (IESDS survivors) is **larger** than the set of strategies rationalizable under independent beliefs.

  **Does this damage the "No-Lose" argument?** No. If a strategy is dominated, it is not a best response even to correlated beliefs, so it is certainly not a best response to independent ones. Elimination is safe.
  **Does it damage the "Core" claim?** Yes, if you imply the *surviving set* represents the bounds of rationality. If rationality implies independent beliefs, some strategies surviving IESDS are actually irrational (they are only best responses if opponents correlate without a device).

  **Defender's Concession:** You must concede that the epistemic story presupposes that players consider **correlated beliefs** about opponents permissible. If your seminar participants hold that rational agents must assume independence (no tacit collusion), then IESDS is too weak a filter, not too strong. It doesn't eliminate enough.
  *   **Verdict:** **Awkward.** It limits the epistemic interpretation of the *solution*, but does not undermine the normative force of the *elimination*.

  ### 3. The Ambiguity/Maximin Objection (Nuanced)

  **The Issue:** You ask if dominance holds if a player evaluates by worst-case (Maximin) rather than Expected Utility.
  *   **The Good News:** Strict dominance is defined pointwise: $\sigma_i$ dominates $s_i$ if $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for **all** $s_{-i}$.
  *   If the agent uses Maximin, they compare $\min_{s_{-i}} u_i(\sigma_i, s_{-i})$ vs $\min_{s_{-i}} u_i(s_i, s_{-i})$. Since the inequality holds for every $s_{-i}$, it holds for the minimums. The "no-lose" argument survives ambiguity aversion regarding the *opponent*.

  *   **The Bad News:** This relies on the agent accepting the payoff of the mixture $\sigma_i$ against a fixed $s_{-i}$ as the expected value. If the agent is ambiguity-averse regarding their **own randomization** (e.g., they prefer a sure thing to a 50/50 lottery even if the sure thing is the EV), they may not accept that the mixture "beats" the pure strategy in the relevant columns.

  **Defender's Concession:** The procedure has grip on **Maximin agents regarding opponent uncertainty**, provided they are **EU maximizers regarding their own mixing**. If they reject linearity in their own acts (e.g., they view mixing as a cost), the "no-lose" argument loses its normative force for them.
  *   **Verdict:** **Nuanced.** It shows the argument is robust to opponent ambiguity, but fragile regarding self-randomization attitudes.

  ### 4. The Normative vs. Predictive Objection (Merely Awkward)

  **The Issue:** Can the procedure predict anything false?
  *   **Predictive:** Yes. People play dominated strategies (experimental data, though you asked to discount this, it bears on the *truth* of the claim).
  *   **Normative:** If sold as "Rational agents *ought* not play dominated strategies," it is insulated from empirical falsification. If an agent plays a dominated strategy, the theorist says, "They are irrational" or "We modeled their payoffs wrong."

  **Is this insulation a dodge?** In philosophy, normative claims are legitimate. However, the insulation works only if the definition of "rational" is stable. Given Point 1 (Cardinality), if you define "rational" as "vNM compliant," the claim is tautological. If you define "rational" as "sensible," the cardinality requirement makes the norm controversial (why *ought* I care about the intensity of my preferences in this specific linear way?).

  **Defender's Concession:** You must concede that the claim is **tautological within the vNM framework**. Its philosophical weight depends entirely on the justification for the vNM axioms. It is not a freestanding principle of instrumental rationality; it is a derivative of the Independence Axiom.
  *   **Verdict:** **Merely Awkward.** This is standard for normative theory, but it highlights that you are teaching a specific *model* of rationality, not rationality *simpliciter*.

  ---

  ### Summary Recommendation for your Seminar

  You should keep teaching IESDS as the robust core, but **qualify the slogan**.

  1.  **Drop "Assumption-Light":** Replace it with **"Assumption-Explicit."** It makes the vNM commitments visible rather than hiding them behind "rationality."
  2.  **Distinguish Pure vs. Mixed:** Explicitly teach that **Pure** IESDS is ordinal (very robust), while **Mixed** IESDS is cardinal (requires vNM). Your counterexample is the perfect teaching tool for this distinction.
  3.  **Reframe the "No-Lose" Argument:** It is valid *if* the agent accepts the mixture as a valid act with linear value.
  4.  **Epistemic Caveat:** Acknowledge that in $n>2$ games, the survivors assume correlated beliefs are possible.

  **Final Ranking of Threats to your Position:**
  1.  **Cardinality/Ordinal Invariance:** **Fatal** to the "assumption-light" claim. (You must concede vNM is required).
  2.  **Epistemic/Correlation:** **Awkward.** (Clarifies the belief structure required).
  3.  **Ambiguity:** **Nuanced.** (Holds for opponent ambiguity, fails for self-mixing aversion).
  4.  **Normative Insulation:** **Philosophical.** (Acceptable for a philosophy seminar, provided the vNM basis is acknowledged).

  Your intuition that the mixed step presupposes Expected Utility is correct. That is the price of the hedge.
