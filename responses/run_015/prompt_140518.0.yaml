      *   *Game 2 (Cardinal values 0, 1, 1.5, 10):* C is dominated by mix of A, B. (Check: Mix $0.5A + 0.5B$. Against X: 5. Against Y: 5. Against Z: 1. C gives 1.5, 1.5, 0. $5 > 1.5$, $1 > 0$. C is dominated.)
      *   *Implication:* The set of undominated strategies changes based on the *intensity* of preferences, not just the ordering.
      *   *Philosophical Implication:* The "no-lose" argument relies on comparing expected payoffs. If preferences are only ordinal, "expected payoff" is undefined. If preferences satisfy vNM axioms, they are cardinal (unique up to positive affine transformation). The user's transformation was *monotonic* but not *affine* (0, 1, 1.5, 2 $\to$ 0, 1, 1.5, 10).
      *   *Verdict:* This is a **Fatal** objection to the claim that IESDS is "assumption-light" regarding preferences. It *requires* vNM rationality (cardinality), not just ordinal ranking. Pure strategy dominance only requires ordinality. Mixed strategy dominance requires linearity over lotteries.

