  4.  **Address Question 2: Epistemic Status ($n \ge 3$ players):**
      *   *Theorem:* Pearce (1984) / BDK (Brandenburger, Dekel, Fudenberg). A strategy is strictly dominated by a mixed strategy iff it is not a best response to *any* belief over opponents' strategies.
      *   *Nuance:* In $n > 2$, "belief over opponents' strategies" allows for *correlated* beliefs about opponents (i.e., I think Player 2 and Player 3 might coordinate).
      *   *Independence:* If we assume opponents choose independently (uncorrelated beliefs), the set of undominated strategies can be *larger*. A strategy might be dominated by a mix only if opponents correlate.
      *   *Implication:* If the TA tells students "Rationality + Common Belief in Rationality implies IESDS," they are implicitly assuming players allow for correlated beliefs about others' choices (or that there's a correlation device). If rationality implies independent choice (canonical view of non-cooperative games), IESDS might eliminate strategies that *could* be best responses to independent beliefs.
