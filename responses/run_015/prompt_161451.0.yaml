      DRAFT STATUTORY GUIDANCE 44-B
      RE: ONTOLOGICAL STATUS OF PERSONS UNDER THE NARRATIVE ACT

      Pursuant to the recognition that personal identity constitutes a theoretical posit rather than a biological fact, the Office issues this guidance to standardize the measurement of narrative mass required for legal standing. Administrators must recognize that the Self is not an object to be found but a convenience to be calculated. Where narratives diverge, no fact of the matter exists to adjudicate them.

