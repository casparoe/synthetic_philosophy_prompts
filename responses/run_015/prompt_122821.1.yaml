          *   (d) Unsoundness: LI better (robust to source reliability). PC fragile.
      *   *Section 4: The Hybrid.*
          *   Critique: It creates a cliff edge. Better to blend them (use LI as a prior for PC).
          *   It inherits PC's fragility on the horizon and LI's vagueness beyond it.
      *   *Section 5: Normative Standards.*
