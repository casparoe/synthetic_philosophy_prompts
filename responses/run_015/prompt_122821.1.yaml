      *   **Picture 2: Proof-Conditioning (Bayesian on Prover).** Agent models its own theorem prover (probability of finding proof at depth $d$). Updates on proof found or search exhausted. Properties: Finite-time numbers, degrades gracefully. Worry: Requires second-order model of search power/honesty, risk of being wrong about proof-length/evidence connection.
      *   **Hybrid Proposal (Horizon Rule):** Within decision horizon $\to$ Proof-Conditioning. Beyond horizon $\to$ Market Prices.
