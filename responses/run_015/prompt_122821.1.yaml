      *(Self-Correction during drafting)*: I need to be careful about Logical Induction. LI *does* produce a sequence of prices. The user asks about acting on *today's* prices. The standard defense is that if you are an LI, you are not exploitable *in the limit*. But for a one-shot, you might be exploited *today*. I need to emphasize that LI is a *property of a trajectory*, not a static state.
      Also, regarding PC: The user frames it as modeling the *prover*. I should broaden this to modeling the *proof distribution*.
      Regarding the Hybrid: The "Horizon Rule" sounds like "Use exact inference where possible, approximate where not." This is standard engineering. The philosophical question is whether the *credence* switches definition. I should argue that credence should have a unified definition, even if the *computation* of it changes.

