answer: |-
  hey, here's the draft for the take-home exam materials. i tried to make sure the question forces them to engage with the mechanics of the argument rather than just the vibe. added the marking rubric below so you can see where i think the grade boundaries should sit.

  let me know if you want to tweak the wording on the successor scenario — i worried it might be too sci-fi but i think it actually tests the "humanity" definition pretty well.

  ***

  ### 1) Essay Question

  **Course:** PHIL 450 – Death, Value and the Future of Humanity
  **Assessment:** Take-Home Exam
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 1200 words
  **Total Marks:** 40

  **Question:**

  Samuel Scheffler's "Afterlife Conjecture," presented in *Death and the Afterlife*, proposes that much of what we value in our present lives depends on an implicit confidence that human life will continue after our own deaths. This is not a claim about personal immortality, but about the collective survival of humanity.

  (a) Explain Scheffler's Afterlife Conjecture. How does this conjecture allow us to argue that human extinction is bad in a way that is distinct from, and exceeds, the sum of the individual deaths involved?

  (b) Now, consider a "Successor Scenario": Suppose biological humans go extinct, but are replaced by intelligent, culture-bearing artificial descendants or radically post-human beings who continue our scientific, artistic, and moral projects. Based on Scheffler's framework, would human extinction still be bad in this case?

  (c) Use this scenario to identify at least one internal tension in the Afterlife Conjecture. Specifically, does the value of the "afterlife" depend on biological continuity, the continuation of specific human projects, or merely our current psychological attachment to the species? Argue for a resolution or explain why the tension remains unresolved.

  ***

  ### 2) Model Answer Outline

  *Note for graders: This isn't a script, but a map of the moves a top-tier (35+ marks) essay needs to make. If they miss one of these pillars, they cap out in the B range.*

  **Move 1: Clear Exposition of the Conjecture (The "Background Condition")**
  *   Student must clarify that Scheffler is *not* talking about religious afterlife or personal survival.
  *   Key point: Our confidence that others will live after us is a background condition for valuing our own activities (e.g., scientific research, raising children, creating art).
  *   If we knew extinction was imminent (e.g., asteroid hitting in 30 days), most of our current projects would lose their point/value, even if we personally lived out our natural lifespans.

  **Move 2: Extinction vs. Aggregated Death**
  *   Must distinguish between the badness of individuals dying (prematurely) vs. the badness of the species ending.
  *   Standard utilitarian view: Extinction is bad because lots of future people don't get to exist (non-identity problem stuff).
  *   Scheffler's view: Extinction is bad *now* because it undermines the value of *our* current lives. It's about the retroactive undermining of present meaning, not just the loss of future welfare.

  **Move 3: Applying the Successor Scenario**
  *   Student needs to test the conjecture against the AI/Post-human case.
  *   Option A: Extinction is still bad because we are psychologically attached to *biological* humans (nepotism/naturalism).
  *   Option B: Extinction is not bad (or less bad) because the "valuational community" continues. The projects matter more than the substrate.
  *   Top answers will note that Scheffler leans toward the idea that we care about "humanity" but hasn't fully defined if that means *Homo sapiens* or "creatures who share our values."

  **Move 4: Identifying the Tension & Resolution**
  *   The Tension: Is the Afterlife Conjecture descriptive (how we actually feel) or normative (how we should feel)?
  *   If descriptive: We probably care about biological kin, so AI successors don't save the meaning of our lives.
  *   If normative: We *should* care about the continuation of value, so AI successors should suffice.
  *   Resolution: A strong essay will take a stance. E.g., "Scheffler's argument fails here because it relies on a vague definition of 'humanity'." OR "The conjecture holds because what matters is the survival of the 'collective evaluative community,' not DNA."

  ***

  ### 3) Marking Scheme

  **Total: 40 Marks**

  **Section 1: Exposition of the Conjecture (10 Marks)**
  *   **10-8:** Clear distinction between personal afterlife and collective afterlife. Explains the "background condition" of valuing. Uses examples (research, parenting, etc.).
  *   **7-5:** Gets the gist but muddles the distinction between personal death and species extinction.
  *   **4-0:** Confuses the conjecture with religious belief in personal survival. Fails to explain *why* present value depends on future existence.
  *   *Penalty:* -3 marks if they treat this as a claim about personal immortality.

  **Section 2: Extinction Beyond Individual Deaths (10 Marks)**
  *   **10-8:** Articulates that extinction undermines *current* meaning, not just future welfare. Distinct from aggregating individual harms.
  *   **7-5:** Argues extinction is bad mostly because future people won't exist (utilitarian aggregation) rather than the Schefflerian point about present valuing.
  *   **4-0:** Treats extinction as just "a lot of people dying." Misses the structural argument.
  *   *Penalty:* -5 marks if the argument is purely utilitarian (counting future lives lost) without referencing the undermining of present activities.

  **Section 3: Successor Scenario Analysis (10 Marks)**
  *   **10-8:** Engages deeply with the AI/Post-human twist. Weighs biological continuity vs. continuity of projects/values.
  *   **7-5:** Mentions the scenario but dismisses it too quickly (e.g., "AI isn't human so it doesn't count" without argument).
  *   **4-0:** Ignores the scenario or assumes without argument that artificial successors solve the problem.
  *   *Penalty:* -4 marks for assuming AI successors automatically satisfy the conjecture without justifying why "humanity" includes them.

  **Section 4: Tension Identification & Resolution (10 Marks)**
  *   **10-8:** Identifies the tension between biological species membership and valuational continuity. Offers a reasoned stance on whether the conjecture holds.
  *   **7-5:** Identifies the tension but doesn't resolve it or explain its significance.
  *   **4-0:** Fails to identify a tension. Treats the conjecture as perfectly consistent despite the scenario.
  *   *Penalty:* -3 marks if they claim Scheffler explicitly solves this in the text (he doesn't, really).

  **General Deductions:**
  *   **Clarity/Structure:** -1 to -3 marks for disorganized writing or exceeding word limit significantly.
  *   **Citations:** Do not penalize for lack of bibliography (closed book exam context). Penalize -2 if they invent quotes.
  *   **Typos:** Ignore minor typos, but deduct -1 if errors impede readability.

  ***

  **Common Mistakes to Watch For:**
  *   **The "Religious" Trap:** Students love to talk about souls or heaven. Immediate mark deduction in Section 1.
  *   **The "Future People" Trap:** Arguing extinction is bad because it's sad for the unborn. That's Parfit, not Scheffler. Scheffler says it's bad for *us*, right now.
  *   **The "Sci-Fi" Trap:** Getting bogged down in whether AI is conscious. Remind them to stick to the *value* continuity, not the metaphysics of mind.
  *   **The "Memorization" Tell:** If they use phrases like "the doomsday scenario" without explaining the *mechanism* of value undermining, they probably just read the summary.

  let me know if you need me to adjust the weightings. i feel like section 4 is the real differentiator so maybe we could bump that to 15? but 10/10/10/10 is easier for the TAs to handle.

  also, i noticed i spelled "receive" wrong in my head earlier lol. hope the students recieve this version without typos.

  cheers
