answer: |-
  # Exam Question: The Value of Information

  **Time Allocation:** 45 Minutes
  **Total Marks:** 30

  **Notation Preamble:**
  Let $\Omega$ be a finite set of states and $A$ a finite set of actions. Let $u: A \times \Omega \to \mathbb{R}$ be a bounded utility function. Let $p \in \Delta(\Omega)$ be the agent's prior belief. An experiment (signal) $\pi$ generates a realization $s \in S$ with likelihood $P(s|\omega)$. Upon observing $s$, the agent updates to posterior $p_s(\omega) = \frac{P(s|\omega)p(\omega)}{\sum_{\omega'} P(s|\omega')p(\omega')}$ and chooses an action.
  The value of an experiment is defined as the ex ante expected utility of the optimal strategy given that experiment.

  **(a) The Standard Result [10 Marks]**
  State the standard theorem regarding the value of information for an expected-utility maximiser. Your statement must explicitly list the assumptions required regarding the feasible action set and the cost of the signal.
  Provide a formal proof that the ex ante expected utility with the signal is weakly greater than without it. In your proof:
  1.  Identify precisely the mathematical step that relies on the properties of the $\max$ operator (or convexity).
  2.  State the necessary and sufficient condition for the value of information to be exactly zero (express this in terms of the optimal action at the prior and the posteriors).
  3.  Clarify whether this guarantee holds for every signal realization (ex post) or only in expectation (ex ante).

  **(b) Signal-Contingent Menus [12 Marks]**
  Consider a variant where the feasible action set is not fixed. A second party observes the signal realization $s$ before the agent acts and selects a feasible menu $A_s \subseteq A$. The agent knows this rule ex ante.
  1.  Construct a fully numerical counterexample where a **free, perfectly informative** signal has **strictly negative** value compared to no information. Use small integers for utilities and probabilities. Show the arithmetic for the ex ante utility without information and the ex ante expected utility with information.
      *Hint: Merely making actions more expensive is insufficient; the ex ante optimal action must be removed from the menu in at least one signal cell.*
  2.  Identify which step of the proof in Part (a) fails in this setting.
  3.  Explain why the "you can always ignore the information" reply does not rescue the theorem here.
  4.  In this setting, can a strictly less informative signal yield higher expected utility than a more informative one? Briefly justify.

  **(c) Interpretation and Policy [8 Marks]**
  A university administrator argues: "Since the theorem proves information has non-negative value, we should always commission an external review before making a hiring decision, and the candidate should always welcome it."
  Identify and correct three distinct errors in this reasoning based on the formal result:
  1.  The distinction between ex ante expectation and ex post realization.
  2.  The role of the agent's prior (subjectivity vs. objective calibration).
  3.  The relationship between utility and monetary cost (linearity assumption).
  *(Bonus: 1 Mark included in total)* Note a fourth error regarding the comparative nature of the theorem (i.e., comparing two different experiments).

  ***

  # Model Answer

  **(a) The Standard Result**
  **Theorem:** For a fixed feasible action set $A$ and a costless signal $\pi$, the ex ante expected utility with the signal is weakly greater than the expected utility without it.
  **Assumptions:** (1) The feasible action set $A$ is identical across all states and signal realizations. (2) The signal is costless (or costs are subtracted ex ante as a fixed constant). (3) The agent maximizes expected utility relative to their own prior $p$.

  **Proof:**
  Let $V(\emptyset) = \max_{a \in A} \sum_{\omega} p(\omega) u(a, \omega)$.
  Let $V(\pi) = \sum_{s} P(s) \left[ \max_{a \in A} \sum_{\omega} p_s(\omega) u(a, \omega) \right]$.
  By the law of total expectation, $\sum_{s} P(s) p_s(\omega) = p(\omega)$.
  Thus, $V(\pi) = \sum_{s} P(s) \max_{a \in A} \mathbb{E}_{p_s}[u(a, \omega)]$.
  The critical step uses the property that the expectation of a maximum is greater than or equal to the maximum of an expectation (Jensen's inequality applied to the convex value function):
  $$ \sum_{s} P(s) \max_{a \in A} \mathbb{E}_{p_s}[u(a, \omega)] \geq \max_{a \in A} \sum_{s} P(s) \mathbb{E}_{p_s}[u(a, \omega)] = \max_{a \in A} \mathbb{E}_{p}[u(a, \omega)] = V(\emptyset) $$
  **Equality Condition:** The value is zero if and only if there exists a single action $a^*$ that is optimal at the prior $p$ and remains optimal at every posterior $p_s$ in the support of $\pi$.
  **Ex Ante vs. Ex Post:** The guarantee is strictly **ex ante**. For a specific realization $s$, the posterior optimal utility may be lower than the prior optimal expected utility (e.g., bad news eliminates high-payoff states).

  **(b) Signal-Contingent Menus**
  1.  **Counterexample:**
      *   States: $\omega_1, \omega_2$ with $p(\omega_1)=p(\omega_2)=0.5$.
      *   Actions: $a_1, a_2$.
      *   Utilities: $u(a_1, \omega_1)=10, u(a_1, \omega_2)=4$; $u(a_2, \omega_1)=0, u(a_2, \omega_2)=8$.
      *   **No Info:** $EU(a_1) = 0.5(10)+0.5(4) = 7$. $EU(a_2) = 0.5(0)+0.5(8) = 4$. Optimal $a_1$. Value = **7**.
      *   **Perfect Info:** Signal reveals $\omega$.
      *   **Menu Rule:** If $s=\omega_1$, feasible set $A_s = \{a_2\}$. If $s=\omega_2$, feasible set $A_s = \{a_2\}$.
      *   **With Info:** If $\omega_1$, forced $a_2 \to 0$. If $\omega_2$, forced $a_2 \to 8$.
      *   **Exp Value:** $0.5(0) + 0.5(8) = $ **4**.
      *   **Result:** $4 < 7$. Value is negative.
  2.  **Failed Step:** The proof step $\max_{a \in A}$ assumes $A$ is constant. Here, the maximization is over $A_s$, so we cannot pull the $\max$ outside the summation over $s$ because the domain of the maximization changes with $s$.
  3.  **"Ignore" Reply:** To ignore the signal, the agent must be able to execute the ex ante optimal action ($a_1$) regardless of the signal. Here, observing the signal physically restricts the menu to exclude $a_1$. Ignoring the information does not restore the menu.
  4.  **Informativeness:** Yes. A less informative signal (e.g., one that pools states) might trigger a less restrictive menu, allowing $a_1$ to remain available, yielding higher utility than the perfect signal which triggers the restriction.

  **(c) Interpretation and Policy**
  1.  **Ex Ante/Ex Post:** The theorem guarantees higher *expected* utility, not utility in every realization. A specific review could reveal damaging information that lowers the outcome relative to the prior expectation.
  2.  **Agent-Relative Prior:** The theorem holds relative to the agent's subjective prior. If the agent is miscalibrated (e.g., dogmatic), they may value information highly by their own lights, but this implies nothing about objective welfare or the administrator's assessment of the candidate.
  3.  **Utility vs. Money:** The theorem assumes the signal is free. If the review has a monetary cost $c$, the gain is non-negative only in utility terms. Willingness to pay is non-negative only if utility is linear in money. If the agent is risk-averse over money, a positive expected utility gain does not guarantee they can afford the fee.
  4.  **Comparative Error (Bonus):** The theorem proves $V(\pi) \geq V(\emptyset)$. It does not rank two non-empty experiments (e.g., Review A vs. Review B) without further assumptions (like Blackwell ordering) and cost comparisons.

  ***

  # Marking Scheme (Total: 30)

  **Part (a): 10 Marks**
  *   **A (8-10):** Explicitly lists fixed menu assumption. Proof clearly isolates $\mathbb{E}[\max] \geq \max[\mathbb{E}]$. Equality condition specifies *same action* optimal at prior and all posteriors. Distinguishes ex ante/ex post.
  *   **B (5-7):** Proof is generally correct but vague on the max/expectation swap (e.g., says "convexity" without showing the inequality). Equality condition is loose ("signal doesn't change decision"). Confuses ex ante/ex post slightly.
  *   **C (0-4):** Recites "ignore it" argument without math. Misses fixed menu assumption.
  *   *Common Error:* Failing to specify that the *same* action must be optimal at all posteriors for zero value (costs 2 marks).

  **Part (b): 12 Marks**
  *   **A (10-12):** Numerical example is consistent and shows $V(\pi) < V(\emptyset)$. Correctly identifies that $A_s$ variation breaks the max-swap. Explains "ignore" fails because action is unavailable, not just suboptimal. Correctly notes less informative can be better.
  *   **B (6-9):** Numbers work but arithmetic is sloppy. Identifies menu change but blames "adverse selection" vaguely without linking to the proof step. Claims "ignore" fails because of cost (incorrect).
  *   **C (0-5):** No numerical example or example fails (value $\geq 0$). Claims theorem still holds.
  *   *Common Error:* Constructing an example where the action is available but costly, which allows the "ignore" strategy to work (costs 4 marks).

  **Part (c): 8 Marks (+1 Bonus)**
  *   **A (7-8 + Bonus):** Clearly separates the three required errors. Bonus awarded for noting the theorem is not comparative across two experiments.
  *   **B (4-6):** Identifies errors but conflates them (e.g., mixes cost and risk aversion). Misses the prior subjectivity point.
  *   **C (0-3):** Generic criticism of bureaucracy not tied to the formal theorem.
  *   *Common Error:* Arguing the administrator is wrong because "information is sometimes bad" without referencing the ex ante/ex post distinction (costs 2 marks).

  ***

  # Instructor Notes on Fairness & Ambiguity

  1.  **Part (b) Complexity:** The concept of a "signal-contingent menu" is not standard in a basic one-semester EU course. **Fairness Mitigation:** The question text explicitly defines the mechanism ($A_s \subseteq A$) and provides a hint that the ex-ante optimal action must disappear. Students are not expected to derive the mechanism, only to apply the EU calculus to the rules given. If a student struggles, it is likely due to arithmetic errors rather than conceptual inability, provided they read the hint.
  2.  **Part (c) Bonus:** The distinction between Good's Theorem (Value $\geq 0$) and Blackwell's Theorem (Comparative Value) is subtle. **Fairness Mitigation:** The bonus is included *within* the 8 marks (or added as a floating mark) so that missing it does not penalize a student who nailed the three required errors. It serves only to distinguish high-A performance.
  3.  **Notation:** The preamble defines all necessary notation. Students should not be penalized for using slightly different notation (e.g., $E$ vs $\mathbb{E}$) provided it is consistent.
  4.  **Time Pressure:** 45 minutes is tight for 30 marks if students write verbosely. The model answer is ~900 words. Students writing significantly more are likely waffling on Part (a) or (c) and should be penalized under the "B" criteria for lack of precision.
