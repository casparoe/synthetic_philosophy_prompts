answer: |-
  Dr. Aris, a moral philosopher, stands at a podium between a WEIRD grad student, Jenny, and a Traditional Community Elder, Mr. Okon. Aris is trying to settle the debate on Moral Objectivity.

  "I have found the Universal Constant," Aris announces. "To prove it, I will perform an action, and we shall see if your judgments converge."

  Aris reaches for a ceremonial goblet on the table. He "accidentally" knocks it over. Red wine spills across Mr. Okon's sacred manuscript and soaks Jenny's laptop.

  Jenny gasps. "Dr. Aris! You didn't *mean* to do that, did you? It was just a clumsy accident!" (WEIRD Focus: *Intent* determines blame).

  Mr. Okon stares at the wet pages. "The text is stained. The knowledge is clouded. The balance of this room is broken." (Traditional Focus: *Outcome/Purity* determines blame).

  Aris beams, pointing at them. "Aha! You are both reacting! Therefore, Morality is Objective!"

  Jenny frowns, wiping her keyboard. "Wait. Actually, looking at how you set that up... you *did* mean to do it. You wanted to make a point. Your intent was manipulative." (WEIRD Judgment: *Philosopher's Intent* was bad).

  Mr. Okon touches the ruined page. "And the wine is spilled. The damage is done. Your action brought chaos." (Traditional Judgment: *Philosopher's Outcome* was bad).

  Aris blinks. "But... I'm the Observer. I'm testing *you*."

  Jenny: "No, by our standards, you're just a guy with bad intentions."

  Mr. Okon: "And a man who leaves a mess."

  Aris: "So... I am morally guilty?"

  Jenny: "Yes, because you meant to use us."

  Mr. Okon: "Yes, because you broke the world."

  Aris slumps. "So there is no Objective Truth where I am innocent?"

  Jenny and Mr. Okon look at each other, finally in agreement.

  Jenny: "Objectively, you're a jerk."

  Mr. Okon: "Objectively, you are unclean."

  Aris: "But that's two different reasons!"

  Jenny: "Doesn't matter. The verdict is the same."

  Mr. Okon: "The data is consistent. You are the variable."
