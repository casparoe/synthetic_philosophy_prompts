          5.  Distinguish Ignorance vs. Category Error.
          6.  Conclusion/Advice for the reading group.

      *   *Key Insight to Convey:* The user is trying to measure the *timestamp of a subjective experience* using objective tools. Dennett argues subjective experience doesn't *have* a timestamp in the way a frame does. It's a narrative construct.
      *   *Refining the Experiment Critique:* The decoder detects *information availability*. The probe detects *judgment formation*. Neither detects *phenomenal appearance*. If information is available but not judged, was it conscious? If judged but not decodable, was it conscious? This ambiguity is Dennett's point.
      *   *Philosophers to cite:* Dennett (obviously), Ned Block (Phenomenal vs. Access Consciousness - he argues there *is* a fact), David Chalmers (Hard Problem - implies facts about experience), Victor Lamme (Recurrent Processing Theory - tries to locate the cut-off).

  6.  **Final Polish:**
