answer: |-
  **Project Title:** The Aquatic Calibration Gap: An Epistemic Audit of Welfare Standards in Finfish and Decapods

  **1. Statement of the Question**
  Current aquaculture policy operates on the assumption that physiological and behavioral indicators validated in terrestrial livestock validly proxy subjective welfare states in aquatic taxa. This project asks: *To what extent do the specific welfare indicators codified in current farmed finfish and decapod standards rest on validated links to subjective experience, versus unexamined extrapolations from terrestrial mammalian models?*

  This is not a request to define welfare, but to audit the inference rules used to measure it. The determinate answer sought is a mapping of the "Calibration Problem": a systematic identification of where policy documents treat normative assumptions (e.g., "elevated cortisol constitutes suffering") as empirical facts. The project will determine whether the gap between biological functioning and affective state in aquatic animals is merely unmeasured, or whether it is structurally ignored in current regulatory frameworks.

  **2. The Gap in Existing Positions**
  Animal welfare science traditionally distinguishes between biological functioning, natural behavior, and affective state. While recent policy shifts (such as sentience attribution in UK law) acknowledge the third category, the operational frameworks remain stuck in the first. For terrestrial mammals, decades of cross-validation allow us to reasonably infer that a specific lesion score or hormone profile correlates with a negative subjective experience. This calibration was achieved through behavioral negotiation with animals whose expressive repertoires resemble our own.

  For aquatic animals, this calibration is absent. The existing frameworks leave open the critical step of *translation*. Welfare science provides data on homeostasis and pathology; philosophy provides theories of what makes a life go well. Neither provides a validated bridge for taxa that diverged from the vertebrate mainstream hundreds of millions of years ago. Current positions treat the selection of indicators (e.g., using opercular rate to infer distress) as a technical choice rather than a philosophical one. Consequently, standards conflate *evidence of physiological disruption* with *evidence of poor welfare*. This project addresses the undone work: separating the empirical premise ("X causes physiological change Y") from the value-laden premise ("Physiological change Y constitutes a welfare violation"). Until this separation is made, policy claims regarding "humane" treatment in aquaculture remain epistemically unstable.

  **3. Methodology and Work Plan**
  Your instinct to work outward from real welfare standards is the correct approach for a policy-facing foundation. Building up from pure conceptual theory risks producing a framework too abstract to influence regulation. By starting with the standards themselves, we treat existing policy as the data set, revealing where the "philosophical smuggling" occurs in practice. The project will proceed over four quarters:

  *   **Quarter 1: Taxonomy of Standards.** Select three to four dominant welfare certification schemes or regulatory frameworks covering farmed finfish and decapods (e.g., major aquaculture certification bodies and EU regulations). Isolate specific clauses regarding stocking density, slaughter methods, and environmental enrichment. Create a database of the specific indicators mandated or recommended by each.
  *   **Quarter 2: Premise Decomposition.** For each selected clause, decompose the justification into its empirical and normative premises. For example, a standard banning live chilling may rest on the empirical claim "ice slurry causes nociceptive firing" and the normative claim "nociceptive firing without anesthesia is morally impermissible." We will tag each premise as either *Validated for Taxon*, *Extrapolated from Terrestrial*, or *Normative Assumption*.
  *   **Quarter 3: Cross-Comparison and Structural Analysis.** Compare the decomposed standards to identify inconsistencies. Do different standards use conflicting empirical premises to reach the same welfare conclusion? Do they use the same empirical premises to reach different conclusions? This will reveal whether disagreements are scientific (about the fish) or philosophical (about the value of the fish's state).
  *   **Quarter 4: Synthesis and Tool Development.** Draft a "Transparency Framework" for policymakers. This will not be a new welfare standard, but a meta-standard: a checklist requiring future regulations to explicitly state whether an indicator is empirically validated for the specific taxon or adopted by precautionary extrapolation. Finalize the report for submission to the foundation and prepare a manuscript for a journal at the science-policy interface.

  **4. Success and Failure Criteria**
  **Success:** The project produces a published audit identifying at least five specific instances where current aquatic welfare standards rely on unvalidated terrestrial extrapolations presented as empirical fact. Furthermore, the "Transparency Framework" is adopted or seriously reviewed by at least one stakeholder body (e.g., a certification scheme or government advisory committee). Success means policymakers can no longer claim an indicator is "scientific" without specifying the normative bridge supporting it.

  **Failure:** The project fails if it produces only a general philosophical argument without grounding in specific regulatory text. It would be embarrassing to conclude merely that "more research is needed" without pinpointing exactly *which* premises in *which* standards are unsupported. A second failure mode is drifting into a debate about the definition of welfare itself; if the final report argues about hedonism versus objective lists rather than the validity of the indicators, the project has missed its policy mandate.

  **5. Assessment of Scope**
  You are correct: this is potentially two projects. One is an epistemological inquiry into the validity of welfare indicators (the bridge); the other is a metaphysical inquiry into the nature of welfare for non-mammalian taxa (the destination).

  For a twelve-month part-time grant focused on policy, you must restrict the scope to the **epistemology of indicators**. Do not attempt to solve the philosophy of welfare for fish. Do not argue whether a shrimp *can* have preferences in the philosophical sense; argue only whether the current metrics used to assert it *do* measure what they claim to measure. If you attempt to resolve the philosophical nature of aquatic welfare, you will not finish in a year. If you restrict yourself to auditing the inference rules used in current policy, you will deliver a tangible tool. The risk is that by avoiding the deep philosophy, the work feels superficial. The mitigation is to ensure the "Premise Decomposition" in Quarter 2 is rigorous; exposing a hidden normative premise is a philosophical contribution, even if you do not resolve the premise itself. Keep the focus on the *justification of the standard*, not the *nature of the good*.
