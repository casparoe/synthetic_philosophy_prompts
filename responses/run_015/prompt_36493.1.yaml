      *   **2. The Gap (Existing Positions):**
          *   *Context:* Acknowledge the "Three Circles" (Health, Behavior, Affect). Acknowledge the UK sentience shift.
          *   *The Missing Piece:* The *bridge* between the circles is assumed, not proven, for aquatic taxa. Science measures Function; Policy demands Affect. The translation key is missing. Philosophers discuss *what* welfare is, not *how we know* we have it in a gill-breather.
