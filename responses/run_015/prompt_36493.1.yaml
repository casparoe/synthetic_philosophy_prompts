          *   *Risk:* If the project drifts into "What is a fish's good?", it will fail. Keep it on "How do we know?"

  4.  **Review and Refine:**
      *   *Tone:* Academic but accessible, respectful of the user's expertise, authoritative.
      *   *Length:* Check word count. Needs to fit roughly two pages.
      *   *Constraint Check:* No citations/names.
      *   *Voice:* Ensure it sounds like *their* idea, just disciplined. Use their term "Calibration Problem" but refine it.

  5.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* In the Method section, make sure to explicitly validate the user's instinct to work from standards. It's more pragmatic for a policy foundation.
