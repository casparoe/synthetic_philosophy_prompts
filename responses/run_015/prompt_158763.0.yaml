answer: |-
  **The Warrant of the Single Case: Probability, Audit, and the Carron Valley**

  Your predicament is the specific grief of the retired scientist: the realization that the tools which built your career are ill-suited for the single, high-stakes decisions of civic life. In the laboratory, you could rely on the law of large numbers to wash away the ambiguity of any single measurement. On the flood authority, you face the "single case problem" in its starkest form. You have a unique valley, a unique twenty-year window, and a non-stationary climate. The frequentist framework you were trained in—the idea that probability is a long-run relative frequency—cannot logically apply here, because there is no long run. There is only this run.

  You ask for a verdict, not a survey. You ask me to choose one interpretation of probability, test it against your criterion of auditability, and tell you how to speak to your board. I will argue that the only interpretation that survives the test of the unique case is the **epistemic interpretation**: the claim that "35%" is a statement about the strength of our evidence and the rationality of our expectation, not a physical property of the river. I will argue that the other two interpretations fail your auditability requirement fundamentally, whereas the epistemic view allows for an honest retrospective accounting, provided we change what we mean by "right."

  ### I. What the Number Asserts

  Let us examine the three candidates for what "35%" asserts in this context.

  The first is the **frequentist** view: the number asserts that in a hypothetical infinite sequence of identical twenty-year periods, the barrier would be overtopped in 35% of them. This is the view ingrained in your training. It fails here because the sequence does not exist and cannot exist. The climate is changing; the barrier is ageing; the valley is unique. To assert this is to make a claim about a counterfactual world that is physically inaccessible. It pretends to describe the river, but it actually describes a simulation that cannot be instantiated.

  The second is the **propensity** view: the number asserts a physical disposition or "chance" inherent in the valley-barrier system, akin to the half-life of a radioactive isotope. This claims to be about the valley itself. While more metaphysically robust than frequentism for single cases, it is obscure. What physical mechanism constitutes a "35% disposition" to flood? Unlike radioactive decay, hydrological extremes are the result of complex, chaotic confluences of weather, tide, and topography. There is no known physical constant here. To assert this is to reify our ignorance into a force of nature.

  The third is the **epistemic** view: the number asserts a claim about *our evidence*. It says, "Given the ninety years of records, the structure of Model A, and our current ignorance of the tail, a rational agent should degree their belief in overtopping at 0.35." This is a claim about the relationship between the knower and the known. It admits that the uncertainty lies not necessarily in the river (which will do what it will do), but in our map of the river.

  For the Carron valley, only the epistemic interpretation is honest. The 35% is not a property of the water; it is a property of the model's fit to the data. When the rival model says 12%, it is not measuring a different physical reality; it is expressing a different state of knowledge derived from different structural assumptions. Therefore, the proposition "35%" asserts that *Model A is the more reliable guide for action given the available evidence*, not that the river has a 35% chance of flooding.

  ### II. The Fact of the Tail

  You ask if there is a fact of the matter as to which model is correct in the tail. Here we must distinguish between ontology and epistemology.

  Ontologically, yes, there is a fact. The physics of fluid dynamics and meteorology are real. When the storm comes, the water will rise to a specific height. There is a truth about how the extreme flows behave beyond the recorded data. The river does not flip a coin; it obeys equations.

  However, epistemologically, that fact is inaccessible. You noted that no extension of the historical record could settle the disagreement, because the tail is defined by events that have *not* happened. Furthermore, the non-stationary climate means the "fact" of the future tail may differ from the "fact" of the past tail. We are in a regime where the truth exists but is empirically withdrawn from us.

  Consequently, we cannot treat the models as competing descriptions of a known truth. They are competing wagers on an unknown truth. To ask which model is "correct" is to ask a question nature will not answer until it is too late. The only fact we can access is the fact of the models' performance on the *known* data (where they tie) and the plausibility of their structural assumptions. The "fact" we are dealing with is not hydrological, but methodological: it is a fact about which modeling assumption is more robust to extrapolation.

  ### III. The Test of Auditability

  This brings us to your crux: auditability. You require an interpretation that explains how a claim could be shown to have been wrong by evidence we could have had, without presupposing repetition.

  **The Frequentist Failure:**
  Under the frequentist view, the 35% claim is only falsifiable over the long run. If the barrier is not overtopped in the next twenty years, the frequentist cannot say the 35% was wrong. A 35% event is expected *not* to happen 65% of the time. If the flood does happen, they cannot say it was "right," because a 12% event could also have happened. In a single case, the frequentist probability is unfalsifiable. It insulates itself from the outcome. For a board needing accountability, this is useless. It offers no way to be "wrong" in the specific instance that matters.

  **The Propensity Failure:**
  The propensity view fares no better. If the flood does not occur, the propensity theorist says the disposition was simply not manifested. Like the frequentist, it cannot be audited on the single outcome. It retreats into metaphysics: "The chance was there, even if the event wasn't." This is not auditability; it is dogma.

  **The Epistemic Success:**
  The epistemic interpretation survives, but only if we shift the locus of the audit. We cannot audit the *outcome* (flood or no flood) against the *number* (35%). We must audit the *warrant* against the *process*.

  On the epistemic view, a probability claim is "wrong" if it violates the rules of rational inference given the available evidence. It is shown to be wrong not by the river, but by the discovery of neglected data, logical incoherence, or bias in model selection.
  *   **Vindication:** If, after twenty years, we find that Model A's assumptions about the tail were physically more sound (perhaps verified by new data from similar valleys elsewhere), then the 35% was warranted.
  *   **Falsification:** If we discover that the modelers ignored a known systematic error in the gauging records, or if they selected Model A simply because it yielded a more convenient number for funding, then the 35% was wrong, regardless of whether the flood occurred.

  This satisfies your requirement. It allows the claim to be judged by evidence we could in principle have had (internal documents, model diagnostics, peer review) without requiring the repetition of the flood. It makes the probability claim accountable to the *quality of the reasoning*, not the luck of the draw.

  ### The Practical Verdict

  You asked what you should say to the board and how to record the decision so that the retrospective question—"Was it right?"—has an honest answer.

  **1. What to say to the board:**
  Do not present the 35% as a prediction of frequency. Do not say, "There is a 35% chance this will happen." That invites the misunderstanding that nature is rolling dice.
  Instead, say this: *"The number 35% represents the weight of our current evidence under the most conservative credible model. The number 12% represents the weight under a less conservative but equally plausible model. We do not know which model describes the physical reality of the extreme tail. Therefore, we are not deciding based on the truth of the number, but on the cost of being wrong."*

  Frame the decision not as a bet on which probability is true, but as an insurance policy against the uncertainty of the tail. If the cost of overtopping is catastrophic, the 35% figure acts as a risk multiplier, not a frequency count. You are buying protection against the possibility that Model A is the one that corresponds to the physical fact of the tail.

  **2. How to record the decision:**
  To ensure auditability, the minutes must not record the decision as "Based on a 35% risk." They must record the *decision rule*.
  Record it thus: *"The Board acknowledged two conflicting risk assessments (12% and 35%). Given the irreversible consequence of failure and the inability to resolve the model disagreement empirically, the Board adopted the higher estimate as the basis for expenditure to minimize maximum regret."*

  **3. The Retrospective Answer:**
  When, in twenty years, someone asks, "Was the number right?", the honest answer is not "Yes, because it flooded" or "No, because it didn't."
  The honest answer is: *"The assessment was warranted by the evidence available at the time. The decision was robust because it accounted for the model uncertainty. Whether the flood occurred is a matter of physical fact; whether our calculation was responsible is a matter of record."*

  If the barrier holds, you did not waste money; you purchased a safety margin against an unknowable tail. If the barrier fails, you were not negligent; you acted on the most prudent interpretation of the evidence. The audit is on the prudence, not the prophecy.

  ### The Strongest Objection

  I must weigh the strongest objection to this epistemic defense. It is the charge of **subjectivity**.

  Critics will argue that if probability is just "degree of belief" or "strength of evidence," then the 35% and the 12% are merely expressions of opinion. If both models fit the data, why privilege the 35%? Does this not reduce science to politics, where the board simply chooses the number that justifies the spending they want? If probability is epistemic, isn't it unmoored from the world, allowing us to rationalize any decision?

  **Rebuttal:**
  This objection conflates *arbitrariness* with *epistemic constraint*. The epistemic view does not mean "anything goes." It means the numbers are constrained by logic and the available data. The 35% is not a feeling; it is the output of a rigorous calibration against ninety years of records. The disagreement arises not from subjective whim, but from structural uncertainty in the models.

  The epistemic view handles this better than the frequentist view because it forces us to admit the uncertainty. The frequentist pretends the 35% is an objective fact about the river, which hides the model disagreement. The epistemic view exposes the disagreement as a gap in knowledge. By recording that we chose the 35% *because* of the catastrophic cost of error (a decision-theoretic move), we are not being subjective about the physics; we are being objective about the *consequences* of our ignorance.

  The auditability holds because we can check the work. We can check if the 35% model violated physical laws. We can check if the 12% model ignored relevant data. We can check if the Board ignored the 12% model without reason. The "subjectivity" is confined to the value judgment of risk tolerance (how much we fear the flood), which is properly the Board's domain, not the scientists'. The probability claim itself remains auditable as a piece of reasoning.

  ### Conclusion

  You spent thirty-eight years defending numbers that derived their authority from repetition. You now face a number that derives its authority from necessity. The frequentist interpretation fails you here because it requires a world of repeats that does not exist. The propensity interpretation fails because it posits a physical chance we cannot measure.

  The epistemic interpretation remains. It asks you to accept that the number 35% is not a mirror of the river, but a map of your ignorance. It survives the auditability test because it allows you to be judged on the quality of your map-making, not the weather.

  Tell your board this: We cannot know the truth of the tail. We can only know the rigor of our reasoning. Let us record our reasoning so rigorously that, whatever the river does, our decision stands as rational. That is the only "right" available to us.
