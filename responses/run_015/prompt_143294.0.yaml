  ### Brainstorming Mechanisms for Reversal

  1.  **Menu Growth (Unforeseen Options):** The agent plans at $t_0$ based on a known tree. At $t_1$, a new, superior option appears that was physically unavailable or unimaginable at $t_0$. The resolute agent ignores it (sticking to the plan); the reconsiderer takes it.
      *   *Verdict:* **Fail.** This violates Constraint 3 (correct description of situation). If the option was truly unforeseeable, the plan was optimal given available information. If it was foreseeable, it should have been in the tree. This makes the failure one of ignorance, not rational dynamic choice.

  2.  **Endogenous Preference Shift (Commitment Changes Tastes):** The act of committing itself alters the agent's preferences (e.g., cognitive dissonance makes the chosen path painful). The reconsiderer avoids the shift by not committing.
      *   *Verdict:* **Fail.** This violates Constraint 2 (ordinary time-inconsistency). It relies on exotic psychological feedback loops rather than standard hyperbolic discounting or present bias, muddying the philosophical point about diachronic rationality.

  3.  **Strategic Legibility (The "Sucker" Signal):** The agent's commitment policy is observable to a strategic counterparty. The counterparty knows the resolute agent cannot be deterred by mid-stream costs, so they impose those costs. The reconsiderer retains the threat value of walking away, forcing the counterparty to behave.
      *   *Verdict:* **Success.** This fits all constraints. It uses ordinary present bias (effort aversion), keeps the decision problem fixed at $t_0$, and generates the loss through the interaction of the agent's policy and the counterparty's best response.

  4.  **Penalty Structure Asymmetry:** The contract penalizes deviation heavily. The resolute agent pays the penalty to avoid breaking the plan; the reconsiderer pays the penalty to exit a bad situation.
      *   *Verdict:* **Fail.** If the penalty is known at $t_0$, the resolute agent should anticipate the exit cost. If she plans to exit, she shouldn't sign. If she plans to stay, she must value staying more than the penalty. It's hard to make the reconsiderer strictly better off without changing the $t_0$ choice itself.

  **Selected Mechanism:** **Strategic Legibility.** This mechanism isolates the virtue of commitment (credibility) and shows how it becomes a liability when the "self" you are committing against is not just your future self, but an external actor who reacts to your inflexibility.

  ***

  ### The Scenario: The "Hard Deadline" Contract

  A freelance data analyst (Agent) negotiates a fixed-fee contract with a startup (Client) to clean and label a dataset over four weeks. The Agent suffers from ordinary present bias: at $t_0$ (signing), future effort feels abstract and manageable; at $t_2$ (mid-project), immediate effort feels painful and salient. The contract includes a substantial penalty for late delivery. The Client knows the Agent's disposition (whether she is Resolute or Sophisticated) based on past platform history. The Client faces a choice at $t_2$: provide the remaining data assets on time (costly for Client) or delay them by one week (saves Client resources but forces Agent to rush).

  The Resolute Agent adopts a policy at $t_0$: "I will meet the deadline regardless of mid-stream obstacles." She signs the contract, correctly believing this plan maximizes her expected utility given the fee and her bias. The Client, knowing she will not walk away, delays the assets. The Agent rushes, incurring high effort costs, but meets the deadline. The Sophisticated Agent adopts a policy at $t_0$: "I will aim for the deadline, but I will re-evaluate at $t_2$ if conditions change." She signs the same contract. The Client, knowing she will threaten to quit (triggering a breach clause that hurts the Client), provides assets on time. The Agent works normally. Both agents execute their policies perfectly. The Resolute Agent ends up with significantly lower net utility than the Sophisticated Agent.

  ***

  ### (a) The Sequence

  *   **$t_0$ (Contracting):** Agent chooses to accept the Fixed-Fee Contract ($F = \$10,000$) with a Late Penalty ($L = \$2,000$).
  *   **$t_1$ (Work Begins):** Agent begins standard work. Effort Cost = $\$1,000$.
  *   **$t_2$ (Mid-Stream Node):** Client chooses **Delay** (saves Client $\$1,000$) or **On-Time** (costs Client $\$1,000$).
      *   If **Delay**: Agent must Rush to avoid Penalty. Rush Effort Cost = $\$8,000$.
      *   If **On-Time**: Agent continues Standard. Remaining Effort Cost = $\$4,000$.
  *   **$t_3$ (Completion):** Payment is settled.

  **Choices:**
  *   **Resolute Agent:** Accepts at $t_0$. At $t_2$, if Delayed, she **Continues/Rushes**.
  *   **Sophisticated Agent:** Accepts at $t_0$. At $t_2$, if Delayed, she **Threatens to Quit** (forcing Client to go On-Time).
  *   **Client:** Observes Agent's type. vs Resolute -> **Delay**. vs Sophisticated -> **On-Time**.

  ### (b) Reasoning and Payoffs

  **Resolute Agent:**
  *   **$t_0$ Reasoning:** "I am present-biased. If I leave myself an out, I will quit lazily later. I must commit to the deadline. The Fee ($\$10k$) exceeds my expected total effort ($\$1k + \$8k = \$9k$) even if I have to rush. The plan is optimal."
  *   **$t_2$ Reasoning:** "The Client delayed. My plan is 'meet deadline regardless.' Deviating incurs the Penalty ($\$2k$) and violates my resolution. I will rush."
  *   **Final Payoff:** $\$10,000 \text{ (Fee)} - \$1,000 \text{ (Initial Effort)} - \$8,000 \text{ (Rush Effort)} = \mathbf{\$1,000}$.

  **Sophisticated Agent:**
  *   **$t_0$ Reasoning:** "I am present-biased. However, I will monitor conditions. If the Client delays, the cost of rushing ($\$8k$) plus initial effort ($\$1k$) leaves me only $\$1k$ profit. My outside option is worth $\$2k$. I will threaten to quit if delayed, which triggers a breach favorable to me. The Fee ($\$10k$) minus standard effort ($\$5k$) is $\$5k$ profit. The plan is optimal."
  *   **$t_2$ Reasoning:** "The Client is considering delaying. If they do, I will exercise my option to quit. They know this. They will choose On-Time." (Client chooses On-Time).
  *   **Final Payoff:** $\$10,000 \text{ (Fee)} - \$1,000 \text{ (Initial Effort)} - \$4,000 \text{ (Remaining Effort)} = \mathbf{\$5,000}$.

  **Verdict:** The Resolute Agent is strictly worse off ($\$1k$ vs $\$5k$) by the lights of her $t_0$ preferences (which value money minus effort) and her $t_3$ preferences (which are relieved the work is done but regret the excessive effort).

  ### (c) Structural Feature

  The work is done by **Strategic Legibility of Commitment**.
  Standard money-pump arguments assume a solitary agent facing a fixed tree of nature. In that context, commitment solves the intrapersonal conflict between $t_0$ and $t_1$ selves. Here, the "tree" is controlled by a strategic counterparty who observes the agent's decision policy. The Resolute Agent's commitment removes her own ability to threaten exit. The Client, acting rationally, exploits this removal of threat by imposing costs (delay) that the Resolute Agent must absorb. The Sophisticated Agent retains the threat value of her future self's rationality, which disciplines the Client. The vulnerability is not the time-inconsistency itself, but the *credibility* of the plan to override future rationality.

  ### (d) Ablation Test

  **Remove the Feature:** Suppose the Client cannot observe the Agent's disposition (information asymmetry) or the Client is non-strategic (a fixed algorithm that always delays).
  *   **If Client Always Delays:** The Resolute Agent gets $\$1k$. The Sophisticated Agent, knowing she will quit upon delay, calculates her $t_0$ expected utility as the outside option ($\$2k$). She rejects the contract. The Resolute Agent accepts and gets $\$1k$. Here, the Resolute Agent wins (she gets the job done; the Sophisticate walks away).
  *   **If Client Cannot Observe Disposition:** The Client must play a mixed strategy or average response. If the Client delays with probability $p$, the Resolute Agent absorbs the cost. The Sophisticated Agent quits when delayed. If the contract is valuable enough, the Resolute Agent's ability to "eat the cost" allows her to secure the fee where the Sophisticate might be priced out.
  *   **Result:** In the absence of strategic legibility, the textbook moral returns: commitment secures the completion of valuable projects that flexibility would abandon. The reversal *only* holds when the counterparty can condition their behavior on the agent's policy.

  ### (e) The Honest Defence

  A friend of resolute choice will argue: **"A well-designed plan is a plan about planning."**
  They will claim the Resolute Agent failed because her plan was too crude. A truly rational Resolute Agent would adopt a conditional plan: "I will commit to the deadline, *unless* the Client delays, in which case I will renegotiate." This looks like a "reconsideration clause" that dissolves the case.

  **Reply:** This reply relocates the problem rather than solving it. The money-pump argument for resolute choice rests on the idea that you must *bind* your future self to prevent it from succumbing to present bias (e.g., quitting because effort feels high, even when finishing is still net positive). If you build in a reconsideration clause ("unless effort is too high"), the present-biased self at $t_2$ will interpret "too high" loosely to justify quitting. To solve the *internal* self-control problem, the plan must be rigid. To solve the *external* strategic problem, the plan must be flexible. You cannot have both. The case shows that the very rigidity required to vindicate diachronic rationality against oneself creates the vulnerability to exploitation by others. The "plan about planning" either collapses into sophistication (losing the self-control benefit) or remains resolute (keeping the strategic vulnerability).

  ***

  ### Closing Reflection

  This case suggests that money-pump arguments establish a **contingent strategic generalization** rather than a requirement of rationality. They show that coherence pays *ceteris paribus*—specifically, when the environment is passive or non-strategic. When the environment includes agents who can read your decision policy, the instrumental value of coherence flips. Rationality does not demand resolute choice universally; it demands the policy that maximizes utility given the responsiveness of your counterparties. The authority of the money pump is thus limited to intrapersonal conflicts; it cannot underwrite a general duty of diachronic coherence in a social world.
