answer: |-
  Colleagues, practitioners, and guests, we are gathered because a contradiction appears undeniable. On one side, we have the metaphysical intuition that matter matters: if an entity has no physical mass, no causal power in the base world, it cannot be the locus of genuine harm. On the other, we have the empirical reality of the clinic and the courtroom: users report violation, panic, and profound loss following incidents within embodied, haptic environments. If we accept the sceptic's premise, we gaslight the victim; if we accept the practitioner's observation without qualification, we risk a naive realism that grants digital pixels the status of atoms. Neither option is tenable for a workshop intended to produce rigorous outcomes.

  To move beyond this deadlock, I propose we adopt a structural distinction between what I term 'indexical harm' and 'representational harm'. This is not merely a taxonomy; it is a constraint on our discourse for the next two days.

  Indexical harm refers to the disruption of a user's situated, first-person presence within a virtual environment. When haptic feedback loops create a sense of embodiment, the user is not merely observing a screen; they are indexically located 'here'. An assault in this context is not an attack on a graphic; it is a violation of the user's agency and bodily integrity within that situated space. The harm is real because the subject's experience of presence is real, regardless of the ontological status of the object causing the disruption.

  Representational harm, by contrast, concerns the digital proxy or asset symbolically linked to the user. This involves the destruction of virtual property, the theft of an avatar skin, or symbolic defamation. Here, the object functions as a signifier. The harm arises from the loss of value, status, or symbolic meaning attached to the proxy, not necessarily from a disruption of immediate bodily presence.

  Adopting this framework imposes strict constraints on what we can legitimately claim. For the metaphysicians in the room: you may no longer dismiss reports of trauma as illusory simply because the weapon was code. If the user's indexical presence was constitutive of their experience, the disruption is phenomenologically genuine, even if the object is ontologically thin. To deny this is to confuse the ontology of the object with the ontology of the subject's experience.

  For the designers and legal scholars: you may no longer argue for virtual property rights by equating digital objects with physical chattels. If the harm is representational, it rests on symbolic value and social agreement, not physical scarcity. To claim otherwise is to commit a category error that undermines the legal precision you seek.

  This distinction prevents us from settling on a false compromise. We are not saying virtual objects are physically real, nor are we saying user trauma is imaginary. We are saying that the locus of the harm shifts depending on whether the user's indexical presence or their representative assets are targeted. This requires the metaphysicians to engage with the phenomenology of presence rather than just the metaphysics of objects. It requires the practitioners to distinguish between psychological violation and economic loss when drafting protections.

  If we adhere to this structure, we avoid the trap of arguing past one another. We can analyse the specific mechanism of the harm without collapsing into materialism or idealism. The reality of the injury is secured not by the substance of the virtual world, but by the integrity of the user's relation to it.

  \answer{The reality of virtual harm depends not on the ontology of the object, but on the integrity of the user's indexical presence.}
