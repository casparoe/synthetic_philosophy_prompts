  1. The disagreement centers on whether normativity requires an etiological history to ground proper function or if synchronic causal roles suffice to define failure conditions. Your friend insists history provides the objective standard for error, while you argue internal architecture alone determines functional breakdown.
  2. You are correct that no hidden empirical question is doing the work, as both frameworks can accommodate a synthetic organism with identical behavior but different origins. This suggests the dispute is metaphysical rather than scientific, concerning the necessary conditions for intentionality rather than observable mechanisms.
  3. This is primarily a verbal disagreement masked as a substantive one, stemming from divergent definitions of what counts as genuine representation versus mere information processing. Both sides agree on the physical facts but disagree on whether those facts require a historical lineage to earn the label of content.
  4. Progress requires a conceptual distinction between system-relative norms, which your causal-role theory captures, and history-relative norms, which teleosemantics demands. Acknowledging that these are competing explications of different intuitions about normativity would dissolve the circularity.
  5. Ultimately, the framing is ill-posed if it assumes there is a single natural kind of content that only one theory can capture. You should shift the debate to which normative framework better serves specific explanatory goals in cognitive science rather than seeking a unique metaphysical grounding.
