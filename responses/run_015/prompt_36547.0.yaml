  8.  **Self-Correction during drafting:** I initially thought about bringing in Sperber & Wilson (Relevance Theory). *Correction:* Keep it focused on Grice as requested, maybe mention Relevance Theory as a "next step" but don't muddy the waters. The user is asking about Grice specifically. Stick to the CP and Maxims.
      *   *Wait, one nuance:* The user says "collusive evasion." I need to be careful. Is it collusive? In a way, they *are* colluding to not say "abortion" in public (the waiter is there). But privately, they are fighting. I should highlight this public/private distinction.

  9.  **Final Plan:**
