  # Handout: The Discrete Hole Argument

  ### The Case
  Consider a spacetime model consisting of a finite set of four nodes $N = \{1, 2, 3, 4\}$ partitioned into a past slice $P = \{1, 2\}$ and a future slice $F = \{3, 4\}$. The fixed background structure is a causal adjacency relation $R \subset N \times N$, where every node in $P$ is connected to every node in $F$ (a complete bipartite graph), and there are no connections within $P$ or within $F$. A physical model is defined by a scalar field $\phi: N \to \{0, 1\}$. The dynamical law is **Conservative Propagation**: the multiset of field values in the future must identical to the multiset of field values in the past (i.e., $\{\phi(3), \phi(4)\} = \{\phi(1), \phi(2)\}$), and values must propagate along existing causal links (which is trivially satisfied here as all links exist). Initial data is fixed on $P$ as $\phi(1) = 1, \phi(2) = 0$. This setup admits two distinct mathematical solutions for the future field configuration: Model $A$ where $\phi_A(3)=1, \phi_A(4)=0$, and Model $B$ where $\phi_B(3)=0, \phi_B(4)=1$. Model $B$ is generated from Model $A$ by applying the automorphism $h$ that swaps nodes 3 and 4 while fixing 1 and 2.

  ### Verification Checks
  1.  **Background Invariance:** The map $h$ (swap 3,4; fix 1,2) preserves $R$ because $R$ connects all $P$ to all $F$; swapping elements within $F$ leaves the set of pairs unchanged.
  2.  **Rule Preservation:** The law depends only on the *multiset* of values $\{\phi(3), \phi(4)\}$, which is invariant under swapping the assignments to 3 and 4; thus if $A$ satisfies the law, $h(A) = B$ also satisfies it.
  3.  **Initial Data Fixing:** $h$ is the identity on $P$, so both models agree perfectly on the initial data $\phi(1)=1, \phi(2)=0$.
  4.  **Hole Disagreement:** The models agree on $P$ (outside the hole) but disagree on $F$ (inside the hole); specifically, $\phi_A(3) \neq \phi_B(3)$.
  5.  **Non-Identity:** As functions from $N$ to $\{0, 1\}$, $\phi_A \neq \phi_B$ because they assign different values to the specific element $3 \in N$.

  ***

  ### Analysis of Positions

  1.  **The Element-Realist:** This position holds that the nodes of the base structure possess a fact of the matter regarding their identity independent of the field (e.g., "node 3 is *this* node"). Consequently, Model $A$ and Model $B$ represent distinct physical possibilities because they assign different properties to the same real entity (node 3). Since the deterministic law allows both, the theory is committed to radical indeterminism: the past data fails to determine which value node 3 will possess.
  2.  **The Equivalence Theorist:** This position denies that the nodes have independent reality or that the distinction between $A$ and $B$ is physical. Because $A$ and $B$ are related by a symmetry of the background and law, they represent one and the same physical situation. The difference is merely a redundancy in the mathematical representation (gauge). Determinism is preserved because there is only one physical future, described in two ways.
  3.  **The Sophisticated Element-Realist:** This position maintains that the nodes are real (rejecting the Equivalence Theorist's ontological deflation) but denies *haecceitism*: they claim that while $A$ and $B$ are distinct mathematical models, they do not represent distinct *metaphysical possibilities*. The "possibility" is the isomorphism class of the model, not the specific point-wise assignment. Thus, both models are valid representations of the single determined physical world.

  **Note on Invariants:** All three positions agree that $A$ and $B$ agree on every symmetry-invariant quantity (e.g., "there is a 1 in the future"). The Element-Realist fares worse here than in the continuum case because the finite structure makes the "surplus structure" (the specific labeling of 3 vs 4) starkly visible as having no empirical consequence, intensifying the charge of indeterminism.

  ### The Key Feature
  The single feature doing the work is the **localized automorphism of the fixed background**. The background structure is rich enough to define a "hole" (the region $F$) and locality (the relation $R$), but symmetric enough within that hole to admit a non-trivial permutation $h$ that is the identity outside it. If the background were rigid (e.g., if node 3 were uniquely connected to node 1 while node 4 was not), $h$ would not be an automorphism, $B$ would not be a solution, and the argument would fail.

  ### Strongest Objection
  **Objection (from the Element-Realist):** "You have stipulated indeterminism into the law. A truly deterministic rule would specify *which* future node inherits the value from node 1. By defining the law in terms of multisets, you have built the Hole Argument conclusion into the premise."
  **Reply Weakness:** The reply relies on the claim that a structural law *cannot* distinguish structurally identical nodes without introducing new background structure. This is softest if one argues that "determinism" requires unique point-wise evolution, in which case the toy model simply confirms that structural determinism $\neq$ point-wise determinism.

  ### Missing Continuum Features
  1.  **Infinite Degrees of Freedom:** The toy model has finite states; the continuum allows for arbitrary smooth deformations. (Not doing hidden work; the logic holds for finite groups).
  2.  **Dynamical Geometry:** In GR, the metric is the field *and* the background. Here, the background $R$ is fixed. (This is a deviation, but the prompt required a fixed background to show it doesn't block the argument).
  3.  **Differential Topology:** No notion of "smoothness" or "infinitesimal" holes. (Not doing hidden work; discreteness sharpens the identity problem).

  ### Epistemic Calibration
  **Settled (Checkable Facts):**
  *   The background $R$ admits the automorphism $h$.
  *   Models $A$ and $B$ are distinct functions on $N$.
  *   Models $A$ and $B$ satisfy the stated law and initial data.
  *   Models $A$ and $B$ agree on all $h$-invariant quantities.

  **Contested (Philosophical Interpretations):**
  *   **Determinism:** Whether a theory that determines only gauge-invariants counts as "deterministic." (The Element-Realist says no; the Sophisticated Realist says yes).
  *   **Representation:** Whether distinct mathematical models related by symmetry *must* represent distinct possibilities (Haecceitism).
  *   **Proxy Validity:** Whether a finite graph with a discrete symmetry group adequately captures the metaphysical stakes of the continuum diffeomorphism group (some argue the continuum allows for "local" changes impossible in finite structures).
  *   **Dialectical Presupposition:** Your framing presupposes that "Realism about elements" entails "Haecceitism." This is disputed by Sophisticated Substantivalists who claim one can be a realist about points without believing they possess primitive thisness.

