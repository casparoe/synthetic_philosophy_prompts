prompt: |-
  So I got into a long argument last night with my friend Priya — she's got a philosophy background, does clinical ethics-adjacent work now — about what actually makes consent invalid, and I want to find out whether the framing I was defending can carry the weight or whether I was just pattern-matching off my day job.

  Setup: I'm a backend/infra engineer, I spend all day on distributed systems, so my native vocabulary is tokens, leases and TTLs, scopes, nonces, provenance, idempotency, two-phase commit, abort paths, eventually consistent state, clocks, crash faults vs Byzantine faults. I know that vocabulary cold. I know maybe undergrad-level philosophy. She's the reverse.

  Where we got stuck: I was claiming that the standard failure modes for consent are basically one bug wearing three costumes. She said no, there are at least two genuinely different bugs and my framing flattens them, and the case that made me shut up was this — she said the hard cases aren't about whether the authorization message got sent correctly, they're about whether the thing doing the authorizing was *calibrated*. Her example: someone who is formally competent, not coerced, not deceived about anything they'd think to ask about, but who is in the middle of an acute grief episode or a manic stretch, so that what they want right now has come loose from what they'd want under any other conditions. My whole "is the token fresh, in scope, and properly signed" check passes that case cleanly, and she says that's exactly the point at which my vocabulary has stopped seeing the problem.

  I also threw some stuff at her that I made up on the spot and have no idea is coherent, so please run with it:

  - consent as a lease with a TTL rather than a boolean flag, and the question of who eats the cost when a token goes stale — the holder or the recipient — especially for long-running or repeated acts (an ongoing relationship, years-long research participation) where re-issuing is expensive and nobody actually does it
  - mid-act revocation as the abort path; infra people have spent insane effort on aborts, and it seems to me consent theory mostly argues about the initial grant. Is that a real asymmetry in the philosophy, or just my occupational deformation?
  - "I would have said yes anyway if I'd known" (her word was counterfactual or hypotheticall consent) as a replay: the same write arriving against a state that has moved on, and the question of whether to accept it
  - consenting to two mutually incompatible things as a double-spend

  What I want from you:

  1. Restate the main positions on valid consent as faithfully as you can, in my vocabulary. That includes the three classic failure modes (deception, coercion, competence) and the deeper split underneath them, which as I understand it is roughly: is consent a communicated act or performance — a signal you send, with rules about how it has to be sent and received — or is it an internal state of the agent's will, which the signal merely reports? Get both sides of that split right, and don't let my vocabulary settle it by accident. Within deception, keep apart deception about *what* is being authorized (roughly fraud in the factum: you agreed to one thing and the thing you got was a different thing) from deception that only functions as an inducement (you knew exactly what you were agreeing to, you just wouldn't have, absent the lie). Do the analogous thing for coercion, where the interesting border is threat vs offer, and the so-called coercive offer.

  2. Then the residue report. For each thing you translated: what mapped cleanly, what only mapped after you bent it, and what has no counterpart on my side at all. I especially want the two cases I flagged: (a) the competent-but-miscalibrated agent — is there anything in a systems vocabulary that expresses "the issuer was competent but not herself," or does that collapse into a crash fault and lose the entire moral point? (b) whether "valid consent" doing its normative work — my rough understanding is that valid consent is supposed to change what the other party is permitted to do, in a way that the mere absence of objection doesn't — has any analogue in a vocabulary that only has permissions, messages, and fault models. Or is validity precisely the bit a protocol vocabulary can't say, because protocols don't distinguish a permission you *have* from a permission you've been *given*?

  3. Finally, tell me who was more right, with an actual scoreboard: which of her claims survive being translated into my vocabulary, which of mine turn into hand-waving once written out in full, and whether my one-bug framing is defensible or just a category error with good branding.

  Format: prose for the main body is fine (aim around 700–900 words, don't pad), but I want the translation itself as structured data I can paste into a doc. Give me a JSON object with exactly two keys:

  - "rows": an array of objects, one per concept you translated, each with the keys
    - "concept": string, the philosophical notion (e.g. "deception as mere inducement")
    - "infra_gloss": string, your one-or-two-sentence restatement in my vocabulary
    - "what_bent": string, what you had to distort or quietly smuggle in to make it fit — be honest, if your gloss secretly assumes the mental-state view of consent, say so here
    - "residue": string, what didn't come across at all, or "none"
    - "verdict": string, exactly one of "translates_cleanly", "translates_with_distortion", "does_not_translate"
  - "scoreboard": an object with the keys
    - "her_claims_that_survive": array of strings
    - "my_claims_that_collapse": array of strings
    - "one_bug_or_three": string, your verdict on my framing, one or two sentences
    - "the_thing_my_vocabulary_cannot_say": string

  No reading lists, no citations, no named authors or papers — I can't follow any of that up right now and I'd rather have your own reconstruction than half-rememberd names.
