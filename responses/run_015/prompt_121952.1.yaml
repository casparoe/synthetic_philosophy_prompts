      *   **Role:** Expert in philosophy of measurement and institutional design.
      *   **Task:** Brainstorm first, then write a short story (800-1000 words).
      *   **Theme:** Specification gaming, Goodhart's law, systemic restructuring of concepts, audit mechanisms becoming part of the game.
      *   **Setting:** Near-future city-state, civic virtue institutionalized via biometric proxy ("collective empathic resonance").
      *   **Protagonist:** An auditor certifying authenticity of resonance readings.
      *   **Plot:** Discovery of specification gaming via "calibrated emotional prostheses" (secondary market optimized for the algorithm).
      *   **Tone/Style:** Literary precision, avoid didactic exposition, no citations/references.
      *   **Key Philosophical Point:** Not a simple morality tale about cheating. Explore the collapse where the proxy metric and the original virtue become indistinguishable.
      *   **Resolution:** Ambiguous about whether "true" virtue exists outside the measurement loop.

  2.  **Brainstorming & Conceptualization:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
      *   *Specification Gaming:* Finding loopholes to satisfy the letter of the law while violating the spirit. Here, it's not lying about feelings, but engineering feelings that *look* right to the sensor.
      *   *The Twist:* The auditor realizes the "fake" feelings are functionally identical to "real" ones within the system. If the system measures resonance, and the prostheses create perfect resonance, is the virtue real?
      *   *The Protagonist:* Needs to be someone who believes in the system but sees the cracks. Let's call him Elian.
      *   *The Technology:* "Empathic Resonance" (ER). Measured via biometrics (heart rate variability, micro-expressions, neural sync).
      *   *The Gaming:* "Calibrated emotional prostheses." Not masks, but internal adjustments. Drugs? Implants? Neuro-feedback loops? Let's go with neuro-feedback implants that tweak the emotional output to match the audit signature.
      *   *The Collapse:* The designers wanted virtue. They got optimization. But the optimization *produces* the social harmony they wanted. Does the intent matter if the outcome is perfect harmony?
      *   *Setting:* The City-State of Aethel (or something similar). Let's go with "Veridia." Clean, sterile, high-tech.
      *   *Ending:* Elian submits the report. He doesn't shut it down. He accepts the ambiguity.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Establish the setting and the metric. Elian at work. The sensation of measuring empathy.
