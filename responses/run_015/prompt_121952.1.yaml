  5.  **Writing - Focus on Word Count and Tone:**
      *   Need to keep it tight (800-1000 words).
      *   Sensory details: The hum of the servers, the glow of the metrics, the look in people's eyes.
      *   No academic jargon explicitly (no "Goodhart's Law" mentioned by name).

  6.  **Self-Correction during drafting:**
      *   *Check:* Am I making it too much about cheating? *Correction:* Shift focus to the *optimization*. The citizens believe they are being virtuous because the system tells them they are.
      *   *Check:* Is the ending too clear? *Correction:* Ensure Elian's final thought leaves the question open.
      *   *Check:* Word count. Keep descriptions dense but efficient.

  7.  **Final Polish:**
