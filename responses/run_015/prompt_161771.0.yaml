answer: |-
  This is a diagnosis of a philosophical deadlock that has persisted because both sides are defending incompatible models of **self-knowledge**, masked as a dispute about **causation**.

  ### The Diagnosis: Constitutive vs. Contingent Access

  The stalemate is not merely a verbal dispute about "grounding," nor simply a conflation of justification, reference, and truth (though your hypothesis correctly identifies the symptom). The deeper diagnosis is that the Objector and the Epiphenomenalist are operating with mutually exclusive models of what it is to know one's own mind.

  1.  **The Objector (Constitutive Model):** Assumes that phenomenal self-knowledge is **constitutive**. On this view, the experience does not merely *cause* the judgment; it *is* the reason for the judgment. The relation between feeling pain and judging that one is in pain is internal and necessary. To sever the causal/metaphysical tie is to sever the epistemic tie. This is why the Objector splits into those demanding causation, grounding, or constitutive reasons: they are all attempting to preserve the intuition that the experience must *play a role* in the cognitive economy for the report to be *about* the experience.
  2.  **The Epiphenomenalist (Contingent/Tracking Model):** Assumes that phenomenal self-knowledge is **contingent tracking**. On this view, self-knowledge is structurally identical to perceptual knowledge or measurement. A thermometer tracks temperature without the temperature "causing" the reading in a way that involves the temperature's intrinsic nature; it works via a physical correlate. The Epiphenomenalist treats the neural correlate ($N$) as the mechanism and the experience ($P$) as the target. As long as $N$ tracks $P$, knowledge is secured.

  **Why this causes a stalemate:**
  The Objector treats the *avowal* as a **datum** that reveals the metaphysics of mind (i.e., "I know I am in pain" proves pain is causally potent). The Epiphenomenalist treats the *avowal* as **theory-contaminated output** that must be explained by the metaphysics of brain states (i.e., "I know I am in pain" is a report generated by $N$, which happens to covary with $P$). They cannot agree on what counts as the fixed point of the argument.

  ### Engaging the State of Play

  This diagnosis explains the specific moves you cataloged:

  *   **Objector's Splits:** The three demands (causation, grounding, constitutive reason) are escalating attempts to capture the *constitutive* intuition. Causation is the crudest version; constitutive reason is the most precise. They all fail against the Epiphenomenalist because the Epiphenomenalist rejects the Constitutive Model entirely.
  *   **Epiphenomenalist's Replies:** The appeal to reliability, the analogy to other minds/unobservable past, and the charge of smuggling in "acquaintance" are all defenses of the Contingent/Tracking Model. They work perfectly *if* self-knowledge is like perceptual knowledge. They fail *if* self-knowledge is sui generis.
  *   **The Target Move:** The shift from "steam-whistle" (irrelevant effects) to "strict" (no effects) hardened the stalemate. The steam-whistle view allowed a causal link (satisfying the Objector minimally) while maintaining functional irrelevance. Strict epiphenomenalism severs the link entirely, forcing the Objector to rely purely on the Constitutive intuition, which the Epiphenomenalist dismisses as mysticism.

  ### Testing the Probes

  **1. The Shadow-Channel Stipulation**
  *Setup:* $P$ (phenomenal) covaries with $S$ (physical). $S$ causes the judgment. $P$ causes nothing.
  *Result:* **The Objector's complaint survives.**
  *Diagnosis Confirmation:* This proves the dispute was never about *reliability* or *causation* in the standard sense. Reliability is satisfied by $S$. Causation is satisfied by $S$. If the Objector still demurs, they are asserting that $P$ itself must be the *source* of the justification, not just the target of a reliable track. This confirms the **Constitutive Model**. The Epiphenomenalist accepts the Shadow-Channel as a victory (knowledge is secured); the Objector sees it as a defeat (the subject is blind to $P$, merely reacting to $S$). The disagreement is about whether *knowing pain* requires the pain to be epistemically active.

  **2. The Displacement Test**
  *Setup:* Replace $P$ with moral properties, unreachable spacetime, or other minds.
  *Result:* **The argument does not run equally.**
  *   *Unreachable Spacetime/Other Minds:* The self-stultification argument fails here. We accept we can know about these via inference/theory without them causing our beliefs directly (photons/behavior mediate). This supports the Epiphenomenalist's Contingent Model for *external* knowledge.
  *   *Moral Properties:* The argument *does* run here (cf. Mackie's Argument from Queerness). If moral properties are non-natural and causally inert, how do we know them?
  *Diagnosis Confirmation:* The dispute is specific to **Direct Awareness**. We do not expect spacetime regions to be *felt*. We *do* expect pain to be *felt*. The Objector's intuition relies on the premise that phenomenality *just is* a mode of appearing to the subject. If $P$ does not appear to the subject (by causing the judgment), it is not phenomenal. The Epiphenomenalist denies this identity. The Displacement Test shows the stalemate is not about a general principle of knowledge, but about the **essence of the phenomenal**.

  ### Weighing Your Hypothesis

  Your hypothesis—that three questions (justification, reference, truth) are being argued under one heading—is **correct but derivative**.

  *   **Why it's correct:** In the standard case (non-epiphenomenal), the experience causes the belief (justification), determines the content (reference), and makes the belief true (truth). These are bundled. Epiphenomenalism unbundles them. The Objector feels the unbundling breaks the concept of knowledge; the Epiphenomenalist feels the bundling was a confusion.
  *   **Why it's derivative:** They are conflated because the Objector assumes a **Self-Intimation Thesis**: that phenomenal properties are essentially properties that reveal themselves. If $P$ exists, it *must* be known. If it doesn't cause the knowledge, it isn't self-intimating. The conflation arises because the Objector treats the *epistemic access* as part of the *metaphysical definition* of the phenomenon.

  ### What Counts as Progress?

  Given this diagnosis, further arguments about reliability, causation, or skepticism will not yield progress. They are firing past each other's conceptual schemes.

  **1. A Change of Question (The Metaphysical Turn)**
  Progress requires shifting from epistemology ("Can we know?") to metaphysics ("What is phenomenality?").
  *   **The Question:** Is "being felt" or "being aware of" an essential property of a phenomenal state?
  *   **If Yes:** Epiphenomenalism is false by definition. A state that is not felt is not a phenomenal state. The Objector wins, but only by stipulation.
  *   **If No:** Phenomenal properties are qualitative properties that *can* exist unfelt. The Epiphenomenalist wins, but must accept a **Revisionary** account of self-knowledge. We do not "feel" our qualia; we track them via neural correlates.
  *   **Progress Condition:** The Epiphenomenalist must explicitly admit that their view entails we are not *acquainted* with our experiences in the way common sense suggests. The Objector must admit their view entails a causal theory of mind that may conflict with physical closure.

  **2. The Displacement Test as a Filter**
  Use the Displacement Test to force the Epiphenomenalist to clarify the analogy.
  *   If they insist self-knowledge is *exactly* like knowledge of other minds (inference from behavior/neural state), they must explain the *immediacy* intuition.
  *   If they insist it is *different*, they must explain why the causal constraint applies to pain but not to electrons.
  *   **Progress Condition:** A formal distinction between **Discursive Knowledge** (tracking via correlate) and **Acquaintance Knowledge** (constitutive access). If Epiphenomenalism can only support the former, the debate ends: Epiphenomenalism denies we have Acquaintance Knowledge of our own minds.

  **3. Why No Progress Might Be Expected**
  If the dispute rests on **bedrock intuitions about conceivability**, no progress is possible.
  *   The Objector conceives of pain as essentially "hurtful-to-me."
  *   The Epiphenomenalist conceives of pain as "a qualitative state-associated-with-me."
  *   These are different concepts. If neither side can be persuaded to adopt the other's concept (because both feel intuitively obvious), the stalemate is permanent. The "self-stultification" charge is simply the Objector's way of saying, "That isn't what I mean by consciousness." The Epiphenomenalist's reply is, "That isn't what consciousness *is*."

  **Recommendation:**
  Stop asking if epiphenomenalism is *compatible with knowledge*. Ask if it is compatible with **phenomenality**. If the Epiphenomenalist admits that on their view, the "what-it-is-like-ness" is causally isolated from the "what-I-say-it-is-like-ness," they have conceded the Objector's main point: the *phenomenal* realm is, for all cognitive purposes, a shadow. The only remaining debate is whether we should call that shadow "consciousness." That is a verbal dispute, but it is the only one left.
