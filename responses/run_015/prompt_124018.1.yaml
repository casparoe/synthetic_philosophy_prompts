answer: |-
  The doorbell chimed, a clear, silver sound that seemed to cut the air of the foyer into precise geometries. Elena opened the door, and the hallway light rushed out to meet Julian and Clara.

  Elena saw them immediately, with a startling fidelity. Julian's jawline was a distinct architecture against the twilight; she could count the threads in the weave of his scarf. Clara's laugh was not just a sound but a visual event, brightening the dim corners of the entryway. When Julian spoke, his features moved with a logical coherence, every expression landing exactly where an expression ought to land. They were sharp. They were high-resolution. The world, in their presence, seemed to snap into focus, as if their status granted them a higher claim on reality.

  "Darling," Clara said, stepping past the threshold. "The light in here is divine."

  Elena smiled, feeling the warmth of the compliment settle on her skin like a shawl. She excused herself, needing a moment before the aperitifs. She stepped away from the guests, moving down the long corridor to the antique mirror mounted on the walnut paneling.

  She stopped. In the glass, she did not see the sharp angles she had seen in Julian. She saw a softness. The lighting in the hallway was forgiving, blurring the fine lines near her eyes, turning her posture into something graceful and inviting. She adjusted the strap of her dress, and the woman in the mirror adjusted with a benevolent slowness. She looked like a hostess. She looked like someone who belonged to the room, to the house, to the evening. The reflection offered no friction; it confirmed her. It showed her not as she was, but as she was required to be: a center of gravity, warm and stable.

  She turned back toward the living room, but stopped. The table. The centerpiece was missing the dark, heavy sweetness of fresh figs. It was a small omission, but to Elena, it felt like a tear in the fabric of the evening.

  "I'll be one moment," she called out, grabbing her coat. "The vendor on the corner still has them."

  She stepped out of the warm, high-definition bubble of her home and into the street. The air was cooler here, and the light was different—sodium vapor orange, casting long, indistinct shadows.

  The vendor was a man of indeterminate age, standing behind a wooden cart. As Elena approached, her vision seemed to adjust, but not in the way it had for Julian. The man did not resolve into sharpness. He remained slightly blurred at the edges, his features blending into the grime of the cart and the brickwork behind him. She saw his posture first: a stoop, a functional curvature of the spine designed for lifting crates, not for conversation. His hands were dark with soil, moving with a mechanical rhythm as he arranged the produce.

  She did not see a face; she saw a function. She saw the transaction.

  "Figs," she said. Her voice sounded flat in the open air.

  The man nodded. He reached into a crate. Elena watched his hands. They were tools. In her mind, the exchange was already complete; she was the purchaser, he was the mechanism of purchase. The figs were purple and split, glistening under the streetlamp, more real than the man holding them. She handed over the bills. He handed back the change.

  As their fingers brushed during the exchange of coins, the man looked up.

  For a second, the orange streetlight caught his eyes. They were not the dull eyes of a functionary. They were tired, yes, but they held a specific, piercing intelligence. He looked at her coat, then at her face, and he did not look with the deference she expected. He looked with a weary assessment, the same kind of sharp scrutiny Julian had used when analyzing the wine list.

  In that fraction of a second, the blur vanished. The man's face snapped into high definition. She saw the specific map of wrinkles around his mouth, the chapped lip, the individual lashes against his cheek. He was as real as Julian. He was as real as she was.

  He dropped the coins into her palm. "Careful," he said. "They bruise easy."

  Elena closed her hand around the metal. It was cold. She turned to walk back to her door, the bag of figs swinging gently against her leg.

  She reached for the handle, then paused, her reflection catching in the darkened glass of her own front window. She saw herself standing on the sidewalk, a silhouette against the warm glow of the interior. She saw the vendor behind her, returning to his crates, fading back into the shadows of the street.

  Elena stood still. She looked at her own hand, open now, holding the change. She realized that the street had not been blurry. The man had not been indistinct. The light had not changed between the hallway and the curb.

  She lowered her hand. The silence of the evening pressed against her ears. She understood, with a quiet, sinking clarity, that her eyes had been doing more than seeing. They had been editing. They had been drawing lines where there were none, sharpening the world for some and softening it for others, constructing a reality that fit the shape of her life. She had not been watching the evening; she had been directing it.

  She opened the door, and the warmth rushed out to meet her, but she did not step in immediately. She stood on the threshold, blinking, learning for the first time how to look.
