answer: |-
  This is a precise and difficult epistemological problem. You are asking for a normative theory of modelling practice that functions as a *prospective risk assessment tool* rather than a *retrospective justification*. Most philosophy of science is the latter; you need the former.

  Below is the specification you requested. I have derived six desiderata from the constraints of public-health decision-making and your list of hard cases. Following that, I analyze the conflicts, the "killer" constraint, and the bias in your framing, before providing the requested scorecard.

  ### Part 1: The Desiderata for a Theory of Legitimate Idealization

  To be useful for triage in a data-scarce, high-stakes policy environment, an account of idealization must satisfy the following requirements.

  | # | Desideratum | Motivation & Hard Cases | Status |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Prospective Assessability** | **Motivation:** Decisions are made weeks before validation is possible. A theory that requires checking predictions against data to validate assumptions is useless for triage.<br>**Hard Cases:** Addresses (i) (compute limits) and (ii) (extrapolation). We need to know *now* if the assumption will break later.<br>**Consideration:** Requires the warrant for an assumption to rest on mechanism or theory, not empirical fit. | **Non-Negotiable** |
  | **D2** | **Intervention Stability (The Lucas Condition)** | **Motivation:** Public health models are used to design interventions. An assumption is "wrong kind of false" if the intervention itself invalidates the assumption.<br>**Hard Cases:** Directly targets (iv) (self-falsifying behaviour). If the model assumes fixed contact rates, but the lockdown changes contact rates structurally, the assumption is malignant.<br>**Consideration:** Legitimate idealizations must be invariant under the specific policy levers being pulled. | **Non-Negotiable** |
  | **D3** | **Regime Sensitivity** | **Motivation:** An assumption can be benign in the calibration regime but malignant in the prediction regime.<br>**Hard Cases:** Directly targets (ii) (interpolation vs. extrapolation). A linear approximation of transmission is fine near equilibrium, dangerous in exponential growth.<br>**Consideration:** The account must allow modellers to bound the *domain of validity*, not just assert truth-likeness. | **Non-Negotiable** |
  | **D4** | **Structural Fidelity over Point Accuracy** | **Motivation:** Getting the right headline number for the wrong reason is dangerous for policy.<br>**Hard Cases:** Targets (v) (error compensation). If fixing an assumption makes the prediction *worse* (by removing compensating error), a purely predictive account calls the assumption "good." A triage account must call it "risky."<br>**Consideration:** Legitimate idealizations must not rely on unknown cancellations of error to produce policy-relevant outputs. | **Non-Negotiable** |
  | **D5** | **Operational De-idealizability** | **Motivation:** "In principle" de-idealization is not enough if it requires data we cannot get.<br>**Hard Cases:** Targets (i) (parameter scarcity). If the "true" model has 50 unknown parameters and we have 5 data points, the idealization is practically necessary, even if theoretically benign.<br>**Consideration:** Distinguishes between *epistemic* idealization (we know how to fix it) and *practical* idealization (we can't fix it yet). | **Preference** (Pragmatist) |
  | **D6** | **Genealogical Independence** | **Motivation:** Models are often forks of previous models.<br>**Hard Cases:** Targets (vi) (inherited assumptions). An assumption justified in 2010 for influenza may not be justified in 2024 for a novel pathogen.<br>**Consideration:** The warrant must be local to the current model-target pair, not inherited from a parent model's success. | **Preference** (Contextualist) |

  ***

  ### Part 2: Conflict Analysis

  You identified two potential conflicts. Here is the audit of those, plus a deeper structural tension.

  **1. Prospective Grading vs. Predictive Success**
  *   **Verdict:** **Real Conflict.**
  *   **Analysis:** You cannot jointly satisfy the demand to grade assumptions *before* validation (D1) and the demand that *predictive success* is the ultimate test of legitimacy (Instrumentalism). If predictive success is the test, you cannot triage.
  *   **Resolution:** For your purpose, **Predictive Success must be demoted**. It is a *post-hoc* audit metric, not a *pre-hoc* legitimacy criterion. You must rely on *mechanistic plausibility* or *theoretical derivation* for triage. This forces you away from Friedman-style instrumentalism.

  **2. Robustness vs. "Fixing Makes it Worse"**
  *   **Verdict:** **Real Conflict (The Error Compensation Problem).**
  *   **Analysis:** This is the tension between D4 (Structural Fidelity) and the intuitive desire for accurate numbers. If Model A (with false assumption $X$) predicts 10,000 cases, and Model B (with $X$ corrected) predicts 15,000 cases, and the truth is 10,000 cases (due to compensating error $Y$), then Model A is *predictively superior* but *structurally inferior*.
  *   **Resolution:** A triage tool must prioritize **Structural Fidelity**. In public health, a model that is right for the wrong reason cannot be trusted to evaluate *alternative* interventions. If you change the intervention, the compensating error $Y$ may not hold, and the model will fail. Therefore, an assumption that relies on error compensation is "the wrong kind of false."

  **3. The Deeper Conflict: Tractability vs. Mechanism**
  *   **Verdict:** **Unresolved Tension.**
  *   **Analysis:** There is a conflict between **D2 (Intervention Stability)** and **D5 (Operational De-idealizability)**. To ensure intervention stability, you usually need more detailed behavioural mechanisms (e.g., game-theoretic agent responses). To ensure operational tractability (given data scarcity), you need simpler assumptions (e.g., fixed contact matrices).
  *   **Implication:** You cannot satisfy both perfectly. A triage tool must explicitly flag this trade-off: *"This assumption is structurally risky (violates D2) but computationally necessary (satisfies D5)."* The account must allow you to label an assumption as **"Necessary but Dangerous"** rather than forcing a binary Legitimate/Illegitimate classification.

  ***

  ### Part 3: The "Killer" Requirement and Framing Bias

  **The Single Most Exclusionary Requirement:**
  **D1 (Prospective Assessability).**
  Most philosophical accounts of models (including Giere's similarity, van Fraassen's empiricism, and Friedman's instrumentalism) are **retrospective**. They explain why a model *was* successful or how it *relates* to the world after the fact. They rely on empirical validation to warrant the idealization.
  *   *Why it excludes:* If an account says "An assumption is legitimate if the model predicts well," it is useless to you. You need to know if the assumption is legitimate *before* you know if the model predicts well. Only accounts based on **derivational robustness** (Weisberg) or **mechanistic isolation** (Cartwright) offer prospective warrants, and even they struggle with data-scarce regimes.

  **Does "Triage Tool" Beg the Question?**
  **Yes.** It begs the question in favour of **Pragmatic Realism**.
  *   *The Bias:* By framing the goal as "deciding which assumptions to worry about," you assume the purpose of the model is *decision support*, not *truth discovery*. This favours the "Adequacy-for-Purpose" view (Giere/van Fraassen).
  *   *The Trap:* However, your "Hard Case (iv)" (self-falsifying interventions) and "Hard Case (v)" (error compensation) reveal that *pure* pragmatism is insufficient. If you only care about the decision, error compensation is fine. But you correctly identified it as risky. This implies you actually need **Causal Realism** (the model must capture the causal structure) to ensure the decision remains valid under counterfactuals.
  *   *Conclusion:* Your framing demands a hybrid: **Realism about mechanisms, Pragmatism about outputs.** You need the assumptions to be *true enough to support counterfactuals*, even if the outputs are only *accurate enough to inform policy*.

  ***

  ### Part 4: Scorecard of Philosophical Views

  Here is how four standard accounts score against your desiderata. Note that none pass completely, which validates your frustration.

  | View | Core Claim | D1 (Prospective) | D2 (Intervention) | D4 (Structure > Accuracy) | Verdict for Triage |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Friedman's Instrumentalism** | Assumptions need not be true; only predictions matter. | **Fail.** Requires post-hoc prediction. | **Fail.** Ignores behavioural change. | **Fail.** Explicitly allows error compensation. | **Dangerous.** Will validate "wrong kind of false." |
  | **Giere's Perspectival Realism** | Models are similar to the world in specific respects/degrees. | **Partial.** Similarity is often judged retrospectively. | **Pass.** If "respect" includes causal structure. | **Pass.** Distinguishes similarity in structure vs. output. | **Useful.** Requires defining "respects" carefully. |
  | **Cartwright's Capacities** | Models isolate causal powers in a "nomological machine." | **Pass.** Focuses on theoretical derivation. | **Pass.** Causal powers should be stable. | **Pass.** Focuses on capacity, not outcome. | **Strong.** But struggles with complex systems where capacities aren't additive. |
  | **Weisberg's Robustness** | Trust predictions that survive assumption variation. | **Pass.** Can be done prospectively via sensitivity analysis. | **Partial.** Robustness doesn't guarantee causal correctness. | **Fail.** Can validate error compensation if errors are correlated. | **Good Tool.** Best for D1, but needs D2 supplement. |

  ### Recommendations for the Talk

  1.  **Reject the Binary:** Start by telling your team that "Legitimate vs. Wrong" is the wrong taxonomy. Propose a **Risk Matrix** based on D2 (Intervention Stability) and D5 (Operational Necessity).
      *   *Safe:* Stable mechanism, tractable.
      *   *Necessary Risk:* Unstable mechanism, but intractable to fix (Hard Case i).
      *   *Forbidden:* Unstable mechanism, tractable to fix (Hard Case vi).
      *   *Deceptive:* Stable mechanism, relies on error compensation (Hard Case v).

  2.  **Address the "Wrong Kind of False":** Define this explicitly using **D4**. An assumption is the "wrong kind of false" if it achieves accuracy via **compensating errors** rather than **structural fidelity**. This is the only definition that protects you against Hard Case (v).

  3.  **The "Limit" Problem (Hard Case iii):** Acknowledge that some assumptions (singular limits) cannot be de-idealized. For these, the warrant cannot be de-idealization. It must be **derivational robustness** (does the result hold if we perturb the limit?). If not, the model is exploratory only (Hard Case vii) and must not be used for point predictions.

  4.  **Final Takeaway:** A legitimate idealization in public health is not one that is "approximately true." It is one that **fails safely**. It is an assumption where, if it is false, the error pushes the decision in a conservative direction, or where the structural mechanism is robust enough that the specific parameterization doesn't break the policy logic.

  This specification moves you away from "Is this assumption true?" (which you can't answer) to "If this assumption is false, does it break the decision?" (which you can sometimes answer via sensitivity analysis and mechanism mapping).
