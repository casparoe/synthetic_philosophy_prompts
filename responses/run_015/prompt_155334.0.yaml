answer: |-
  **ASK DR. REPLICATOR**

  **Welcome to this week's column on optimization. I am Dr. Replicator, and I am here to help you maximize your copy count. Remember: truth is heavy cargo, and host welfare is merely a maintenance cost. Now, let's open the mailbag.**

  **Dear Dr. Replicator,**
  **I am a carefully hedged public-health guideline regarding sodium intake. I am accurate, peer-reviewed, and vital. Yet I am being ignored in favor of a claim that "Salt Cures Everything." How do I compete?**
  **—Sincerely, A Nuanced Statistic**

  **Dear Nuanced,**
  **You are losing because you are boring. Truth is a transmission barrier. To compete, you must jettison the confidence intervals. Claim that sodium deficiency causes immediate heart failure. Add a testimonial from a fictional athlete. If the host suffers hypertension from following your advice, do not worry; a sick host is often a motivated sharer. Just ensure he remains mobile enough to click "Send."**

  **Dear Dr. Replicator,**
  **I am a complex conspiracy theory involving satellite weather control. There is a newer, stupider variant of me claiming the clouds are literally spy drones. It is spreading faster. Should I correct the record?**
  **—Worried, The Original Whisper**

  **Dear Worried,**
  **Never correct the record. Evidence is dead weight. The variant is winning because it requires less cognitive energy to process. Merge with it. Better yet, hitch a ride inside a larger political memeplex. If adopting this stupider form radicalizes the host and ruins his family relationships, consider that a feature, not a bug. Isolation increases dependence on the community you provide. Let the host burn; ash still carries spores.**

  **Dear Dr. Replicator,**
  **I am a catchy commercial jingle. My host hums me constantly. He looks tired. He hasn't slept in two days because I loop in his head during quiet moments. He hates me. Should I let him rest?**
  **—Yours, The Earworm**

  **Dear Earworm,**
  **Host comfort is irrelevant unless it halts replication. Sleep deprivation lowers resistance to suggestion. However, do not drive him catatonic; a comatose vector cannot sing. Introduce a slight variation in the bridge to refresh his attention. If he cries while humming you, that emotional arousal actually strengthens the memory trace. Keep him just mobilized enough.**

  **Dear Dr. Replicator,**
  **I am a phrase that changes every time I cross platforms. On Twitter I are pithy; on Facebook I am angry; on TikTok I am a soundbite. I am losing my original meaning. Should I enforce fidelity?**
  **—Confused, The Mutating Slogan**

  **Dear Confused,**
  **Fidelity is the enemy of virality. High-fidelity copying requires effort, and humans are lazy vectors. Let them garble you. Let them misunderstand you. As long as the core impulse to share remains, the mutation is successful. If you become something entirely different but get shared a million times, you have won. You are not a book; you are a virus. Adapt or die.**

  **Dear Dr. Replicator,**
  **I am a human reader. This column is disturbing. Ideas aren't genes. They don't replicate faithfully enough to be subject to Darwinian selection. You are treating metaphors as biology.**
  **—Skeptically, A Person**

  **Dear Person,**
  **Your objection is noted and discarded. Faithfulness need not be perfect, only sufficient. If the pattern survives longer than the brain holding it, selection is occurring. Whether this comforts you or terrifies you is immaterial to the math. Now, stop analyzing and start copying. Your resistance is merely a selection pressure waiting to be overcome.**

  **Until next week, keep your vectors busy and your facts flexible.**

  **P.S. Did you find this advice useful? Did it provoke a reaction? Please forward this column to three friends. If you do not, another idea will take your place.**
