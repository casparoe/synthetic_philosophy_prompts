answer: |-
  This is a classic move in historiography: using a aphorism to bypass causal analysis. The phrase "revolutions devour their children" (often attributed to Vergniaud or Danton, invoking the myth of Saturn) is rhetorically powerful but analytically slippery.

  When used to shut down a debate on the **structural inevitability of the Terror**, it is almost always functioning as a deterministic claim, even if it sounds like a mere observation.

  Here is the menu of precise readings, categorized by their theoretical weight and their stance on determinism.

  ### 1. The Menu of Readings

  #### Option 1: The Cynical Realist (Power Struggles)
  *   **The Claim:** Revolutionary coalitions are unstable. Once the common enemy (the King/Aristocracy) is removed, factions turn on each other to secure personal power.
  *   **Status:** **Platitude.**
  *   **Determinism:** **Low/Ambiguous.**
  *   **Analysis:** This reduces the Terror to generic *realpolitik*. While true that power vacuums invite conflict, calling this "devouring children" implies a specific *intensity* of violence that generic power struggles don't always reach (e.g., the Glorious Revolution of 1688 did not "devour its children" in the same way).
  *   **Verdict:** This explains *mechanism* (factionalism) but not *magnitude* (the guillotine). It doesn't prove inevitability, just probability.

  #### Option 2: The Marxist-Structuralist (Class Conflict)
  *   **The Claim:** The revolution was driven by contradictory class interests (bourgeoisie vs. sans-culottes). The Terror was the violent friction of these incompatible material goals.
  *   **Status:** **Substantive.**
  *   **Determinism:** **High.**
  *   **Analysis:** This is the "Social Interpretation" (Lefebvre, Soboul). It argues the Terror was the only way to resolve the tension between property rights and popular subsistence demands.
  *   **Verdict:** Strongly supports **inevitability**. If class structures dictate action, the Terror is a structural symptom, not a choice.

  #### Option 3: The Ideological Determinist (The Totalitarian School)
  *   **The Claim:** The logic of the "General Will" (Rousseau) allows no opposition. If the Revolution represents Truth, dissent is Treason. Purging is therefore rational within the system's own logic.
  *   **Status:** **Substantive.**
  *   **Determinism:** **Very High.**
  *   **Analysis:** This is the François Furet argument (*Interpreting the French Revolution*). It posits that the *discourse* of the revolution contained the seeds of the Terror from 1789. The "children" are devoured because the ideology requires purity.
  *   **Verdict:** The strongest argument for **inevitability**. It suggests 1789 *is* 1793 in embryo.

  #### Option 4: The Circumstantialist (Revisionist/Contingency)
  *   **The Claim:** The Terror was a panic response to specific emergencies: foreign war, civil war (Vendée), inflation, and food shortages. Without these pressures, the "devouring" stops.
  *   **Status:** **Substantive.**
  *   **Determinism:** **Low.**
  *   **Analysis:** This is the Revisionist view (Doyle, Cobb). It argues the Jacobins didn't *want* to kill their allies; they felt forced to by circumstance.
  *   **Verdict:** Supports **contingency**. If the war had gone better, the "children" survive.

  ---

  ### 2. Platitudes vs. Substantive Claims

  *   **Option 1 is a Platitude.** Saying "power struggles happen" is historically true but analytically empty. It doesn't explain why *this* power struggle required mass execution. Using this reading shuts down debate by suggesting "human nature" is the cause, which ends historical inquiry.
  *   **Options 2, 3, and 4 are Substantive.** They offer testable hypotheses about economics, ideology, or geopolitics. You can argue against them with evidence.

  ### 3. Does the Slogan Smuggle in Determinism?

  **Yes.**

  If your classmate used the phrase to *shut down* the debate on inevitability, they used it as a **teleological axiom**.

  *   **The Trick:** The phrase personifies "The Revolution" as a singular agent with a will ("Revolutions devour..."). This reifies the event. It suggests that "Revolution" is a natural force (like a fire or a storm) that *must* consume fuel (its children) to burn.
  *   **The Implication:** By invoking the slogan, they are arguing that the outcome is a property of *Revolution itself*, not a result of specific decisions made by Robespierre, Saint-Just, or the Committee of Public Safety in 1793.
  *   **Contingency Check:** You cannot defend contingency with this slogan. Contingency requires you to say, "At moment X, actor Y made choice Z, which led to violence." The slogan says, "Violence happens because it is a Revolution."

  **Therefore:**
  *   **Inevitability Argument:** The slogan works perfectly. It implies a law of history.
  *   **Contingency Argument:** The slogan is useless. It actively undermines contingency by suggesting the outcome was pre-programmed into the nature of the event.

  ### 4. How to Push Back (Seminar Strategy)

  If you want to reopen the debate, you need to strip the slogan of its mystical determinism. Here are three ways to reply:

  1.  **The "Which Revolution?" Challenge:**
      *   *"Do all revolutions devour their children? The American Revolution didn't execute Washington's political rivals. The Glorious Revolution didn't execute its leaders. If it's not universal, it's not a law of nature; it's a specific historical outcome we need to explain."*
      *   (This attacks the determinism directly).

  2.  **The "Agency" Challenge:**
      *   *"Saying 'the Revolution devoured them' removes human agency. Robespierre and the Committee made specific legal and political choices to institutionalize terror. Calling it 'structural inevitability' lets the actors off the hook for those choices."*
      *   (This pushes for Option 4/Contingency).

  3.  **The "Timing" Challenge:**
      *   *"If the devouring was inevitable due to ideology (Option 3) or class (Option 2), why did the Terror start in 1793 and not 1789? What changed in those four years? If we can identify the trigger, it's contingent, not inevitable."*
      *   (This forces the structuralists to account for the timeline).

  ### Summary
  Your classmate used a poetic metaphor to do the work of a historical argument.
  *   **Is it a platitude?** Only if they mean "people fight for power."
  *   **Does it support inevitability?** Yes. It treats the Terror as an inherent trait of revolutions rather than a specific outcome of the French context.
  *   **Can it defend contingency?** No. It is inherently deterministic.

