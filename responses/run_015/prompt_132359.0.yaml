      *   *Check:* Is the tone appropriate? Needs to be analytical, philosophical, not dismissive.
      *   *Refinement:* Ensure I don't validate pseudohistory as "equal," but validate the *structural reason* for the disagreement. The prompt asks for an analysis of the *disagreement*, not a verdict on who is right (though the historian's method is implicitly the standard for "history").
      *   *Key Insight:* The pseudohistorian treats the archive as a *text to be decoded*, the historian treats it as *debris to be reconstructed*. This is the crucial ontological difference.

  8.  **Final Polish:** (Reviewing against the prompt's demand for "what would count as progress".)
      *   Progress = Recognizing that "Historical Truth" is an ambiguous term covering two distinct cognitive projects. One is scientific/forensic, the other is literary/psychological.

  **(Self-Correction Note):** I need to be careful not to sound like I'm granting epistemic equality to pseudohistory. The prompt asks to analyze the *disagreement*, not necessarily validate the pseudohistorical claims. I must maintain that the historian's standard is the one required for *history*, while acknowledging the pseudohistorian is doing something else (myth-making). The "progress" is realizing they aren't doing the same thing.

  9.  **Finalizing the Text:** (Proceed to generate response based on these thoughts.)
answer: |-
  The stalemate between professional historiography and pseudohistorical critique is not merely a conflict over facts, but a collision of distinct epistemic frameworks masquerading as a single discipline. To diagnose this, we must look past the surface-level arguments about specific artifacts and examine what each side treats as **data** and what constitutes **defeat**.

  ### Diagnosis: Indexicality vs. Symbolicity

  The core of the disagreement lies in the ontological status assigned to the archive.

  **1. What counts as Data?**
  *   **The Historian (Indexical Data):** For the professional historian, an artifact or document is an *index*. It is a physical trace caused by a specific past event. A carbon-dated shard is data because it stands in a causal chain with a specific moment of production. Its value lies in its capacity to constrain interpretation; it says "no" to certain narratives. Data is fragmented, noisy, and often silent.
  *   **The Pseudohistorian (Symbolic Data):** For the pseudohistorian (e.g., Fomenko, ancient-astronaut proponents), an artifact is a *symbol* or a *code*. It is data not because of its causal origin, but because of its resonance within a larger pattern. A mythic narrative is treated as data equivalent to a stratum of soil because both are viewed as encrypted messages about a hidden reality. Data is holistic; its value lies in its capacity to connect, not constrain.

  **2. What counts as Defeat?**
  *   **The Historian (Falsification via Inconsistency):** Defeat occurs when a hypothesis requires discarding verified indexical links (e.g., ignoring a reliable primary source or a robust radiometric date) to maintain coherence. The historian accepts "noise" (inconsistencies in the archive) as evidence of the past's complexity and the loss of information.
  *   **The Pseudohistorian (Falsification via Disconnection):** Defeat occurs only when the narrative loses its internal symmetry or explanatory scope. Anomalies (like a carbon date conflicting with a chronology) are not defeats; they are *puzzles* to be solved by expanding the theory (e.g., "the dating method is flawed" or "the artifact was planted"). Because the theory posits hidden actors or lost knowledge, no empirical contradiction is decisive; every contradiction is absorbed as further evidence of the cover-up or the catastrophe.

  ### Hypothesis: Competing Projects under a Single Label

  The disagreement is substantive, but it is not about the *same* object. Both sides use the phrase "historical truth," but they are answering two different questions that have been conflated.

  1.  **Forensic Reconstruction (The Historian's Project):** This asks, *"What events occurred, and what is the causal mechanism linking them?"* Here, the past is a fixed object (ontology of absence) that is partially recoverable through method. Truth is correspondence to that fixed sequence.
  2.  **Constitutive Myth-making (The Pseudohistorian's Project):** This asks, *"What narrative structure renders the present meaningful?"* Here, the past is a malleable resource (ontology of concealment) used to organize collective identity. Truth is coherence and psychological satisfaction.

  The stalemate arises because the Pseudohistorian critiques the Historian using the criteria of Constitutive Myth (e.g., "Your timeline doesn't feel right," or "This story explains more"), while the Historian critiques the Pseudohistorian using the criteria of Forensic Reconstruction (e.g., "You lack primary source verification").

  When the prompt suggests that mainstream history treats inconsistencies as "noise to be smoothed out," the pseudohistorical critic is actually identifying a legitimate feature of forensic history (the acceptance of probabilistic inference) but misidentifying it as a flaw in *narrative coherence*. Conversely, when the historian points out that pseudohistory discards sources, they are identifying a failure of *causal explanation*, which the pseudohistorian does not prioritize.

  ### The Falsification Impasse

  The disagreement about standards of falsification is the engine of the stalemate. In natural sciences, replication resolves this. In history, direct replication is impossible.
  *   **Historians** rely on *Inference to the Best Explanation* (IBE). A theory wins if it explains the most evidence with the fewest ad hoc assumptions.
  *   **Pseudohistorians** rely on *Inference to the Most Comprehensive Explanation*. A theory wins if it explains *everything*, even if it requires infinite ad hoc assumptions (e.g., global conspiracies, lost technologies).

  Because the past cannot be rerun, the pseudohistorian can always posit an auxiliary hypothesis (e.g., "the evidence was destroyed") to protect the core theory from falsification. The historian views this as a violation of methodological parsimony; the pseudohistorian views it as necessary depth.

  ### Path to Progress: Archival Ontology vs. Narrative Coherence

  Progress in this debate will not come from better evidence, as both sides already reject the other's evidentiary hierarchy. Progress requires a **conceptual distinction** that separates the two projects explicitly. We must distinguish between **Archival Ontology** and **Narrative Coherence**.

  1.  **Archival Ontology:** This is the domain of professional history. It accepts that the past is fixed, fragmented, and often unknowable. It privileges *negative capability*—the ability to say "we do not know" when the archive is silent. Progress here is measured by increased precision in causal attribution and source criticism.
  2.  **Narrative Coherence:** This is the domain of myth, ideology, and, functionally, pseudohistory. It accepts that the past is a text to be interpreted for present meaning. It privileges *positive closure*—the need for a complete story. Progress here is measured by the story's ability to bind a community or resolve existential anxiety.

  **The Proposal for Resolution:**
  The impasse is irreducible *if* we insist that both sides are doing "history" in the same sense. However, if we reclassify pseudohistory not as "bad history" but as **"secular mythography,"** the disagreement dissolves.

  *   **If the goal is Forensic Reconstruction:** The historian wins by default. The pseudohistorical method is structurally incapable of yielding forensic truth because it treats counter-evidence as hermeneutic opportunity rather than falsification.
  *   **If the goal is Narrative Coherence:** The pseudohistorian often wins by default. Their stories are more satisfying, complete, and meaningful than the fragmented, probabilistic accounts of professional history.

  **Conclusion:**
  The stalemate is a category error. We are arguing over whether a hammer is a good screwdriver. The historian uses the archive to reconstruct a causal chain (forensic); the pseudohistorian uses the archive to construct a meaningful whole (mythic).

  Progress requires historians to acknowledge that their "smoothing of inconsistencies" is a methodological necessity for causal inference, not a claim to total narrative completeness. Simultaneously, critics must acknowledge that treating inconsistencies as "signals of alternative ordering" is a literary or philosophical move, not a historical one. The disagreement is not about the past itself, but about **whether the function of studying the past is to know it as it was (ontology) or to use it as it serves us (teleology).** Until this distinction is codified, empirical refutation will continue to bounce off hermeneutic armor.
