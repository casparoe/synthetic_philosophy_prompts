      *   **The Problem:** Empirical refutation fails to resolve the debate. Both sides use the same vocabulary ("evidence," "source," "chronology") but treat artifacts/data differently.
      *   **Historians' View:** Pseudohistory fails evidentiary standards (discards conflicting sources, invokes hidden actors, conflates myth/fact).
      *   **Critics/Pluralists' View:** Mainstream history relies on unexamined commitments (smoothing inconsistencies, treating temporal coherence as truth rather than heuristic).
      *   **The Conflict:** Same artifact = decisive refutation (historian) vs. anomaly within a different frame (pseudohistorian).
      *   **Questions to Address:**
          *   Is it a substantive disagreement about the nature of the past (fixed object vs. narrative)?
          *   Is it a verbal disagreement masked by shared vocabulary?
          *   Are they answering different questions (causal explanation vs. narrative coherence)?
          *   Is it about standards of falsification in a non-replicable discipline?
      *   **Requirements:**
          *   Diagnose based on what each side treats as *data* and *defeat*.
