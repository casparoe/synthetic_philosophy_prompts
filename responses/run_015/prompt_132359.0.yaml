      *   *Address "Falsification":* Historians use "inference to the best explanation." Pseudohistorians use "inference to the most comprehensive explanation" (which absorbs contradictions).
      *   *Address "Progress":* Don't just say "they are different." Propose a distinction: **Archival Ontology** (what exists) vs. **Narrative Coherence** (what holds together).

  6.  **Finalizing the Structure of the Response:**

