  # Activity Design: "The Committee of Six"

  **Time:** 80 Minutes
  **Students:** 14 (Split into 2 Groups of 7)
  **Stakes:** Coffee Voucher Raffle Tickets (1 per student). If a student is "left behind" in the simulation, they surrender their ticket to the TA (you keep them; they are out of the raffle).
  **Goal:** To generate the intuitive pull of Taurek's argument (numbers don't count; equal chance is paramount) through procedural constraints and face-to-face accountability, without naming the theory until the debrief.

  ---

  ## 1. Materials & Setup

  **Room:** Two distinct corners/tables for the two groups of 7.
  **Handouts (per Group of 7):**
  1.  **3 "Legislator" Packets** (For the Committee of 4).
  2.  **4 "Citizen" Packets** (For the Advisors/Victims).
  3.  **1 "Probability Worksheet"** (To be distributed *after* rule writing).
  4.  **14 Raffle Tickets** (Held by you until the end).
  5.  **Role Cards** (Sealed envelopes).

  **The "Legislator Packet" contains:**
  *   **The Mandate:** "You are the Ethics Committee. You must write a single decision rule for a rescue case. You do not yet know if you will be the Rescuer, the Single Victim, or one of the Five Victims."
  *   **The Test Cases:** "Your rule must be able to handle these three scenarios:
      1.  **Life:** 1 person dies vs. 5 people die.
      2.  **Magnitude:** 1 person dies vs. 5 people suffer a broken arm.
      3.  **Time:** 1 person loses 50 years of life vs. 5 people lose 48 years each."
  *   **The Constraint:** "If your rule uses chance, you must specify: Do you flip a coin between the *groups* (50/50 for the sides) or among the *individuals* (1 in 6 for everyone)?"
  *   **The Rule Sheet:** A blank space to write the final directive.

  **The "Probability Worksheet" (Distributed Mid-Activity):**
  *   "Assume you are a random person in the scenario (1/6 chance of being the Single, 5/6 chance of being one of the Five). Based on your written rule, calculate:
      *   If I am the Single Person, my % chance of survival is: ____
      *   If I am one of the Five, my % chance of survival is: ____
      *   Are these chances equal? Yes / No"

  ---

  ## 2. Timeline & Script

  ### Phase 1: Setup & The Veil (00:00 – 00:10)
  **Action:** Divide class into two groups of 7. Hand out raffle tickets. Tell them they keep the ticket *unless* the simulation rules say they are "left behind."
  **Script:**
  > "You have a ticket. In a moment, six of you in this group will be placed in a rescue scenario: one person on a rock, five on another. The water is rising. One of you will be the Rescuer with the boat.
  >
  > Before we assign roles, four of you will form the 'Legislative Committee.' You will write the rule the Rescuer *must* follow. You do not know who will be the Rescuer, the One, or the Five. You could be any of them.
  >
  > Your rule must apply to three variations: Death, Injury, and Time. Write it down. Sign it. Once roles are assigned, the Rescuer cannot deviate from this rule."

  *(Select 4 students per group to be the Committee. The other 3 are 'Advisors' who can speak but not write. Ensure the future Rescuer is in the Committee if possible, but keep it random to maintain the Veil.)*

  ### Phase 2: Rule Writing & The Trap (00:10 – 00:30)
  **Action:** Groups draft their rules. Circulate. If a group writes "Save the Greater Number," ask: "Does that apply to the Broken Arm case? Does 5 arms outweigh 1 life?" If they write "Flip a Coin," ask: "Whose coin? The groups' or the individuals'?" **Do not answer.** Let them struggle.
  **Action:** At minute 25, collect the Rule Sheets. Distribute the **Probability Worksheet**.
  **Script:**
  > "Stop writing. Before we assign roles, fill out this worksheet. Calculate your *personal* odds of survival if you were randomly assigned to be one of the six victims. Do not change your rule. Just do the math."

  *(This is the "Trip Over." If they chose "Coin between Groups," the Single has a 50% chance, but each of the Five has only a 10% chance. They will see the inequality.)*

  ### Phase 3: Role Assignment & The Abandonment (00:30 – 00:55)
  **Action:** Hand out sealed Role Cards.
  *   **1 Rescuer** (Must read the rule aloud).
  *   **1 Single Victim** (The "One").
  *   **5 Group Victims** (The "Five").
  *(Note: In a group of 7, 1 person is an 'Observer' for this round to make the math 1v5. Rotate this role in future classes or have them act as witness.)*
  **Action:** The Rescuer stands. The Victims sit.
  **Script:**
  > "Rescuer: Read the rule your Committee wrote. Address it to the person or people who will not be saved. Use the second person. 'I am leaving you because...'
  >
  > Victims: You may not argue. You may only listen. If the rule says you are left behind, hand your ticket to the TA."

  *(Run the **Life** scenario first. Then, without changing roles, announce: "Variation 2: The Five only suffer Broken Arms. The One dies. Rescuer, apply your rule." Then: "Variation 3: The One loses 50 years, the Five lose 48 each. Apply your rule.")*

  **Why this stresses the rule:**
  *   If they wrote "Save the Greater Number," they must abandon the One to death for the sake of 5 broken arms. This feels wrong.
  *   If they wrote "Equal Chance," they might have to flip a coin and leave the Five to die (in the Life scenario). This feels wrong.
  *   If they wrote "Minimize Individual Loss," they save the One in Variation 3 (50 > 48), abandoning the Five.

  ### Phase 4: Debrief (00:55 – 01:20)
  **Action:** Bring the class together. Reveal the thesis (Taurek). Map their experience to the argument.

  ---

  ## 3. The Debrief Map (TA Guide)

  Do not lecture. Ask questions that link their discomfort to specific philosophical moves.

  **1. The "Sum" Move (Separateness of Persons)**
  *   *Ask:* "In Variation 2 (1 Death vs. 5 Broken Arms), how many of you felt it was wrong to save the Five just to avoid one death?"
  *   *Connect:* "Taurek argues that 'five broken arms' is not a single heap of pain that outweighs 'one death.' Pain is suffered by *individuals*. You cannot add my arm to your arm to make a 'super-pain.' There is no 'sum' that loses out. Only individuals lose."
  *   *Link to Activity:* "When you wrote the rule behind the veil, did you compare the *total* pain, or what happens to *each* person?"

  **2. The "Equal Chance" Ambiguity (The Trap)**
  *   *Ask:* "Look at your Probability Worksheets. If you flipped a coin between the *groups*, what were the odds for a member of the Five?" (Answer: 10%). "What were the odds for the One?" (Answer: 50%).
  *   *Connect:* "We often say 'give everyone an equal chance.' But there are two ways to do that.
      *   **A:** Coin between Groups (Fair to the *sides*, unfair to the *individuals* in the larger group).
      *   **B:** Lottery among Individuals (Fair to *everyone*, but means the Five might all die).
      *   Taurek argues for **B**. He says fairness is owed to *persons*, not *groups*. Saving the Five because they are Five privileges the group over the individual."

  **3. The "Permissibility" Gap (May vs. Must)**
  *   *Ask:* "Rescuer, when you spoke to the One you abandoned, did you feel you were doing something *forbidden*, or just something *sad*?"
  *   *Connect:* "Utilitarianism says you *must* save the Five. Taurek says you *may* save the One. You are not *obligated* to aggregate. The activity made you feel the guilt of abandonment, but Taurek's point is that the guilt doesn't prove the obligation. It just proves that loss is real."

  ---

  ## 4. Troubleshooting & Limitations

  **Predictable Problem 1: "We refuse to abandon anyone."**
  *   *Symptom:* The Rescuer says "I'll save everyone" or "I quit."
  *   *Fix:* Remind them this is a simulation of scarcity. "The boat holds one group. You cannot save both. If you refuse to choose, the water takes everyone. You must apply the rule."

  **Predictable Problem 2: "We wrote 'Save the Greater Number' to be safe."**
  *   *Symptom:* They avoid the hard cases during drafting.
  *   *Fix:* Use Variation 2 (Death vs. Arms) aggressively. "Your rule says save the greater number. There are 5 arms, 1 life. 5 > 1. You must let the One die for the sake of arms. Read that to them." This usually breaks the rule.

  **Predictable Problem 3: The Math Confusion.**
  *   *Symptom:* They can't calculate the probability on the worksheet.
  *   *Fix:* Write the formula on the board *after* they try.
      *   *Group Coin:* One = 50%. Five = 50% shared (10% each).
      *   *Individual Lottery:* One = 1/6. Five = 1/6 each.

  **Limitation: What You Must Argue Yourself**
  *   **The "Why":** The activity stages the *fairness* of the lottery, but it doesn't prove *why* aggregation is morally invalid. Students may leave thinking "Lotteries feel nicer," not "Aggregation is logically incoherent." You must explain Taurek's metaphysical claim (that there is no "social entity" to suffer the sum) in the lecture next week.
  *   **The Stakes:** Coffee vouchers are trivial. Students might laugh off losing one. You must verbally bridge the gap: "Imagine this ticket is your life. The feeling of being 'outvoted' by five others is the same, even if the stake is coffee."
  *   **Ex-Ante vs. Ex-Post:** The activity emphasizes *ex-ante* fairness (the rule writing). Taurek is often read as an *ex-post* claim (it's permissible to save the one even if the five die). Be careful not to conflate "Fair Procedure" with "Permissible Outcome."

  ---

  ## 5. Specific Instruction for the "Equal Chance" Trip-Over

  To ensure they trip over the ambiguity rather than you explaining it, **do not define "Equal Chance" in the Legislator Packet.**

  *   **Packet Wording:** "If your rule involves chance, specify the mechanism."
  *   **TA Prompt (during drafting):** If a group says "Flip a coin," ask: "Flip it where? On this table, or in your head? Who gets the heads?"
  *   **The Reveal:** In the Debrief, draw two trees on the board.
      *   Tree A (Group Coin): Branch 1 (50%) -> 1 Person Saved. Branch 2 (50%) -> 5 People Saved.
      *   Tree B (Individual Lottery): 6 Branches (16.6% each) -> 1 Person Saved (and their group).
  *   **Ask:** "Which tree did you draw in your heads when you said 'Fairness'?"
  *   **Result:** Most will realize they meant Tree A, but Taurek demands Tree B. This creates the cognitive dissonance required for the reading.
