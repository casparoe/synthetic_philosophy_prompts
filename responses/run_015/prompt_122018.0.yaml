  3. "The objections, worst first" (~600 words): about seven objections, phrased the way they'd actually ask them, ordered by damage. For each: the objection, a 90-second reply, and a one-line note on where that reply is soft.
  4. "What to concede up front" (~100 words): the honest concession that defuses the room before it gets hostile.
  5. "The reply that has to land" (~150 words): the one answer I need to nail if the proposal is going to survive the vote.
  6. "The question I'm praying nobody asks" (~100 words): describe it and give a damage-control reply.
  7. "Tone check" (~80 words): how to sound like I'm not dismissing anthropology or clinical work.

