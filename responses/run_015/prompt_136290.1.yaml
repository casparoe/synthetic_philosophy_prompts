  **BASELINE WELLNESS™ SERVICE AGREEMENT (v.4.2)**

  **1. Definition of Functional Baseline.**
  The User acknowledges that "Health" is not an absolute biological state but a contractual obligation. Baseline Wellness (the "Company") reserves the sole right to define "Normal Function" based on rolling aggregate data from all active Users. The User agrees that their personal physiological optimum may be adjusted downward if the general population health metrics decline. This ensures affordability through shared mediocrity.

  **2. Baseline Relativism Clause.**
  User understands that their "Baseline" is relative, not fixed. If the global cohort suffers a reduction in cognitive capacity or mobility due to environmental factors, the User's guaranteed service level will adjust accordingly to match the new statistical mean. The Company is not liable for feelings of deprivation resulting from the normalization of decline. What was once considered impairment may be reclassified as "Standard Operating Procedure" without notice.

  **3. Therapeutic Essentialism & Enhancement Caps.**
  Services are strictly limited to restoring the User to their assigned Baseline. Any improvement exceeding this threshold is classified as "Enhancement" and falls outside the scope of therapeutic necessity. For example, restoring vision to 20/20 is covered; restoring it to 20/15 constitutes unauthorized optimization. Users found consistently exceeding their Baseline metrics may be subject to an "Over-Performance Fee" or mandatory dosage reduction to ensure compliance with statistical norms. Joy is not a medical necessity.

  **4. Data Ownership and Deviation Rights.**
  All biological data generated during treatment, including genetic anomalies and psychological deviations, becomes the intellectual property of the Company. The User waives the right to their own outliers. If the User's biology naturally improves beyond the Baseline without Company intervention, the Company retains the right to claim ownership of the method used, including diet, sleep, or thought patterns deemed "proprietary optimization strategies."

  **5. Liability and Subjective Well-Being.**
  The Company guarantees function, not happiness. Side effects may include a sense of existential flatness, mild dissociation, or the realization that "wellness" is merely the absence of billable symptoms. The User agrees not to sue for loss of potential, peak performance, or the philosophical burden of knowing their "normal" was invented by an algorithm designed to maximize retention.

  **6. Termination of Care.**
  Service may be terminated if the User becomes too healthy. If maintenance costs drop below the profitability threshold due to User resilience, the Company reserves the right to revoke access to prevent market destabilization. Conversely, if the User becomes too expensive to restore to Baseline, they will be reclassified as "Statistically Insignificant" and removed from the cohort.

  **7. Acceptance.**
  By breathing continuously for more than four (4) minutes after installation of the Baseline™ implant, the User agrees to these terms. Disagreement is considered a symptom of dysregulation and will be treated accordingly.

