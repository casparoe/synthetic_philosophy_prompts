answer: |-
  Mill's late socialism is essentially a hypothesis: that the efficiency of competition and the moral benefits of common ownership can be combined if production is organized into worker co-ops that compete in a market, rather than a state-directed plan. Mondragon is the closest empirical approximation to this hypothesis. Mapping Mill's framework onto Mondragon reveals that Mill was remarkably prescient about the *internal* mechanics of a socialist firm, but blind to the *external* pressures that force a co-op federation to replicate capitalist labor structures to survive.

  Here is the mapping of Mill's three specific worries against the Mondragon record, followed by the necessary theoretical revisions.

  ### 1. The Incentive Problem
  **Mill's Worry:** If distribution is based on "needs," productivity collapses. Remuneration must be tied to effort and contribution to maintain the "energy of labor."
  **Mondragon's Record:** Mondragon explicitly rejects needs-based distribution. Wages are indexed to market rates for similar work in the capitalist sector, with a solidarity ratio (historically around 1:6 or 1:9 between lowest and highest paid) rather than equality.
  **The Mapping:** Mill is vindicated here. Mondragon survives precisely because it ignored the utopian socialist impulse to distribute according to need. It treats labor as a cost that must be incentivized by market signals.
  **The Pushback:** However, Mondragon reveals a nuance Mill missed. To maintain these incentives while remaining competitive globally, Mondragon had to decouple "labor" from "ownership." A significant portion of their workforce (especially in foreign subsidiaries) are wage employees, not member-owners. They receive market wages but do not share in the gains of combined labor (profits/votes) in the same way. Mill's formula—"everyone sharing in the gains"—is violated here. Mill assumed the co-op form would *absorb* the wage relation; Mondragon shows the co-op form may need to *employ* the wage relation to survive market competition.

  ### 2. The Malthusian Problem
  **Mill's Worry:** If a community guarantees support, who restrains population? An open-door socialist community risks being swamped by dependents, draining the common fund.
  **Mondragon's Record:** Mondragon solves this through high barriers to entry. Becoming a *socio* (member-owner) requires a significant capital buy-in and a probationary period. Membership is capped by the capital capacity of the co-op.
  **The Mapping:** Mill is again vindicated. The "guarantee of support" is not universal; it is restricted to the shareholder-workers. The co-op protects its capital base by restricting the "citizenship" of the firm.
  **The Pushback:** This solution works for the *core* membership, but it pushes the Malthusian risk outward. The non-member workforce (the "denizens" rather than "citizens") bears the risk of layoffs without the safety net of the internal capital accounts. Mill's worry was about the community collapsing under weight; Mondragon's solution is to prevent the weight from entering the community in the first place. This validates Mill's fear but solves it by creating a two-tier class system Mill did not anticipate as a permanent feature.

  ### 3. The Liberty / Centralization Problem
  **Mill's Worry:** A single central scheme (State Socialism) destroys the "diversity of experiments" and crushes individual liberty. He wanted competing co-ops to allow for different modes of living and working.
  **Mondragon's Record:** Mondragon is a federation, not a state. Individual co-ops have autonomy, but they are tightly integrated through the Congress, the Social Councils, and crucially, the Caja Laboral (the bank).
  **The Mapping:** This is the area of greatest friction. Mill feared *State* centralization. Mondragon demonstrates *Federation* centralization. The internal bank acts as a venture capitalist, directing capital away from failing co-ops and toward successful ones. This preserves efficiency (which Mill wanted) but constrains the liberty of individual co-ops to pursue unsustainable "experiments."
  **The Pushback:** When Fagor (the flagship appliance co-op) went under in 2013, it was not bailed out indefinitely by the state, but it was also not allowed to fail in a pure market sense; the federation absorbed much of the debt and relocated members. Mill would likely approve of the failure (market discipline) but might worry about the bureaucratic power of the Federation to decide which experiments live or die. The "diversity of experiments" is limited to what the central bank deems financially viable.

  ### The Blind Spots and Necessary Revisions

  **Where Mill's Vocabulary Fails (The Two-Tier Workforce)**
  Mill's theory cannot easily categorize the non-member wage worker in a co-op. In Mill's transition, the co-op is the *alternative* to the wage system. In Mondragon, the co-op is a *competitor* that utilizes the wage system when necessary.
  *   **Theoretical Gap:** Mill's formula requires "common ownership... and everyone sharing in the gains." Mondragon achieves common ownership for *some*, and market wages for *others*.
  *   **Revision Required:** Mill would have to revise his **Incentive/Property worry**. He assumed that solving the property problem (making workers owners) would solve the class problem. Mondragon shows that solving the property problem for the *core* workforce may require exacerbating the class problem for the *peripheral* workforce. Mill's vocabulary doesn't have a term for "socialist firm employing capitalist labor." He would likely view this as a corruption of the principle, yet Mondragon views it as a pragmatic necessity for survival in a capitalist global market.

  **Which Worry to Revise?**
  Mill would most have to revise the **Liberty/Centralization worry**, but not in the way he expected. He feared the *State* would be the centralizer. Mondragon shows that *Capital* centralizes even without the State. To survive competition, co-ops must federate, pool capital, and standardize rules. This creates a bureaucratic center (the Mondragon Corporation HQ) that rivals a state ministry in its influence over individual co-ops. Mill's hope that "competition between co-ops" would preserve liberty is partially undermined by the reality that "cooperation between co-ops" (via the bank) is required to prevent them from being eaten by capitalist rivals. The threat to liberty isn't just political centralization; it's economic concentration required for scale.

  **Which Worry is Mondragon Silent On?**
  Mondragon is silent on Mill's **Malthusian worry** regarding the *global* scale. Mill's worry was about a closed community guaranteeing support. Mondragon restricts membership (solving it locally) but expands production globally using non-member labor. The Malthusian constraint (who restrains numbers?) is outsourced to the external labor market. The foreign subsidiaries do not have the same buy-in restrictions or population controls. Mill's theory assumes a closed system; Mondragon operates in an open one. Consequently, Mondragon offers no answer to Mill's question for the majority of its actual workforce, only for its member-owners.

  ### Summary of the Test Case
  Mill's late socialism predicts that co-ops will outperform capitalists due to higher morale and effort (Incentive), provided they don't guarantee unearned subsistence (Malthus) and don't become a state monolith (Liberty).

  *   **Prediction Confirmed:** Co-ops *can* compete and survive without state ownership, provided they link pay to market/effort and restrict membership.
  *   **Prediction Failed:** The transition does not necessarily eliminate wage labor; it may stratify it. The "sharing of gains" is not universal within the firm.
  *   **Theoretical Limit:** Mill's framework assumes the *firm* is the unit of socialism. Mondragon shows the *federation* is the unit of survival, and the firm is merely a cell within it. When a cell dies (Fagor), the organism survives. Mill's theory is equipped to analyze the cell, but not the organism. He would see the non-member workforce as a failure of the transition; Mondragon sees it as the cost of doing business in a non-socialist world. Mill's vocabulary reaches the outcome only by condemning it as incomplete; it cannot validate it as a stable equilibrium.
