answer: |-
  **The Toast**

  Good evening. For those who do not know me, I had the privilege of supervising [Bride]'s doctoral thesis. To stand here now, not as an examiner but as a friend, feels like a profound gift. I am deeply honored.

  When I first met [Bride], I watched her work. She pursued truth with a rigor that demanded precision in every sentence she wrote. She taught me to listen more carefully to what we say when we claim to know something. I learned from her that speaking about the future requires a particular kind of honesty. So tonight, I will not pretend to possess a crystal ball. I do not know what the coming years will hold.

  What I do know is what I have seen. I have watched this couple navigate difficulties with a grace that surprised me. I have seen them listen when others would speak over one another. I have witnessed them offer support not just when it was easy, but when it was costly. Those moments are matters of record in my memory. They show a foundation built on sincerity rather than convenience.

  We all know that September brings changes. Two postdocs in different countries is a significant distance. Many friends have expressed worry to me about the logistics. Some have said that distance tests even the strongest bonds. I do not deny those challenges. But I also recall what [Bride]'s grandmother told me during the rehearsal dinner: "Love is not a state of being; it is a practice of returning." That quote has stayed with me.

  I used to think that certainty was the only solid ground for a marriage. I have since changed my mind. I have found that hope is often sturdier than certainty. So I will not offer you a prediction. Instead, I offer a wish.

  May you find the words to bridge the miles between you. May you continue to speak honestly, even when the truth is difficult. May you remember that you are teammates, not opponents, when the work gets hard. And may you always find your way back to one another, however far apart you roam.

  To [Bride] and [Partner]: I celebrate who you have been, I welcome who you are, and I hope for all that you might become. Please raise your glasses. To the couple.

  ***

  **Note to the Speaker**

  Here is where the epistemic constraints shaped the text:

  1.  **Future Contingents:** I could not say "You *will* be happy" or "This *will* work." Those are assertions about the future I cannot know.
      *   *Replacement:* I used optatives and wishes ("May you find," "I hope for"). This satisfies the family's desire for blessing without violating the knowledge norm.
  2.  **Confidence vs. Evidence:** I could not say "I *know* you can overcome this."
      *   *Replacement:* I reported past observations ("I have seen," "I have watched"). This asserts only what I have witnessed, which I do know.
  3.  **The Difficulty:** I could not say "It *will* be hard" (prediction) or "It *won't* be hard" (false confidence).
      *   *Replacement:* I attributed the worry to others ("Many friends have expressed worry") and stated generalities ("Distance tests... bonds"). I acknowledged the fact of the move ("September brings changes") without predicting the outcome.
  4.  **My Own Mental State:** I could not say "I *am* convinced" (if I am not).
      *   *Replacement:* I put my change of mind in the past tense ("I *used to think*... I *have since* changed"). I avowed current feelings ("I am deeply honored") rather than current beliefs about external facts.
  5.  **The Philosophical Nod:** I avoided jargon entirely. The line about "speaking about the future requires a particular kind of honesty" signals to her colleagues that I respect her norm of assertion, while the family hears it as simple humility. The grandmother's quote allows me to state a profound truth about marriage without asserting it as my own knowledge.
