answer: |-
  You have identified a very real and frustrating rhetorical dynamic. While there isn't a single, universally agreed-upon *proper noun* for this exact maneuver in political philosophy, it is a recognized structural problem that sits at the intersection of rhetoric and distributive justice.

  The closest established concept is the **Motte-and-Bailey Fallacy**, but applied specifically to **Metrics of Justice**. However, because you noted the sincerity of the holder (it's not necessarily deceitful), and because it relies on specific technical distinctions in equality theory (Resources vs. Capabilities), it deserves a more precise label.

  Here is the breakdown of the established concepts that fit, followed by a proposed name and definition that isolates this specific pattern.

  ### 1. The Established Concept: Motte-and-Bailey
  Coined by philosopher Nicholas Shackel, this fallacy occurs when someone holds a controversial position (the Bailey) but, when challenged, retreats to a defensible, obvious position (the Motte), claims victory, and then returns to the controversial position.

  In your scenario, the mapping is slightly counter-intuitive but structurally identical:
  *   **The Bailey (The Policy):** Equal Resource Distribution (e.g., Flat Cash/UBI). This is the "territory" they want to hold. It is vulnerable to the "disability/conversion" objection.
  *   **The Motte (The Principle):** Equal Capability/Welfare. This is the "fortress." It is morally defensible ("Of course we care about actual wellbeing!") and immune to the disability objection.
  *   **The Move:** When you attack the Bailey (Cash) with the disability objection, they retreat to the Motte ("We care about Capability!"). Once the attack is deflected, they slide back to the Bailey ("So, here is the cash policy") without explaining how the Motte justifies the Bailey given the known slippage.

  **Why this fits:** It explains the *rhetorical utility*. The "Capability" argument isn't being used to design policy; it is being used as a defensive shield to protect the "Resource" policy from criticism.

  ### 2. The Philosophical Mechanism: Ideal vs. Non-Ideal Slippage
  In political philosophy (Rawls, Sen, etc.), there is a distinction between:
  *   **Ideal Theory:** What justice looks like in a perfect world (Equality of Capability).
  *   **Non-Ideal Theory:** What policies we can actually implement (Equality of Resources).

  The pattern you are seeing is often an **unjustified slide between Ideal and Non-Ideal Theory**. The arguer uses the moral weight of *Ideal Theory* (Capabilities) to silence objections, but the administrative simplicity of *Non-Ideal Theory* (Resources) to propose solutions. They claim the moral credit of the former while doing the practical work of the latter.

  ### 3. A Proposed Name: "Metric Decoupling"
  Since "Motte-and-Bailey" is a general rhetorical term and "Ideal/Non-Ideal" is a broad theoretical distinction, neither fully captures the specific *metric* switching you described.

  I propose calling this **Metric Decoupling**.

  **Definition:**
  > **Metric Decoupling** is a rhetorical and theoretical maneuver in distributive justice debates where an arguer **justifies** a policy using a high-resolution metric (e.g., Capability, Welfare, Need) but **implements** that policy using a low-resolution metric (e.g., Resources, Cash, Goods), without accounting for the divergence between the two.

  **Distinctive Features:**
  1.  **Justificatory Decoupling:** The *moral justification* relies on Metric A (Capability), which is robust against objections regarding differential needs.
  2.  **Operational Coupling:** The *policy mechanism* relies on Metric B (Resources), which is administratively simple but ignores differential needs.
  3.  **The Shield:** When the failure of Metric B to achieve Metric A is pointed out (the "Conversion Problem"), the arguer invokes Metric A to claim moral alignment, then returns to Metric B for policy design.

  **How it differs from Plain Inconsistency:**
  Plain inconsistency is holding two contradictory beliefs simultaneously (e.g., "Cash is best" and "Cash is bad"). Metric Decoupling is hierarchical: The arguer claims Metric A is the *goal*, but Metric B is the *proxy*. The fallacy lies in treating the proxy as if it satisfies the goal without demonstrating the correlation.

  **How it differs from the Standard Debate:**
  In the standard Resources-vs-Capabilities debate (e.g., Dworkin vs. Sen), proponents choose one metric and stick to it. A Resource Egalitarian admits they are distributing resources, not welfare. A Capability Proponent admits their policy is complex. **Metric Decoupling** is distinct because it claims the moral superiority of the Capability view while retaining the simplicity of the Resource view.

  ### Why this happens (The "Sincerity" Factor)
  You noted that both metrics seem sincerely held. This is often due to **Administrative Reductionism**.
  The arguer likely *does* believe in Capability Equality. However, when faced with the impossibility of measuring capability for every individual (the "Information Base" problem), they unconsciously substitute a proxy (Cash) that is easier to measure. They forget that the proxy is imperfect. When you point out the imperfection, they genuinely feel misunderstood ("I *do* care about capability!"), because in their mind, the proxy *is* the best available approximation of the target.

  ### Summary for Debate
  If you encounter this, you can name it directly:

  > "You are engaging in **Metric Decoupling**. You are using Equality of Capability as a **normative shield** to deflect the disability objection, but you are using Equality of Resources as your **operational metric** for policy. Unless you can show how your flat cash transfer accounts for differential conversion factors, you are not achieving the capability equality you claim to value."

  This separates them from a hypocrite (Motte-and-Bailey implies strategy) and frames it as a technical failure in their theory of justice (Metric Decoupling implies a broken link between goal and tool).

  ### Key Theoretical Reference
  If you want to ground this in literature, reference **Amartya Sen's "Conversion Problem."**
  Sen argued that resources (primary goods) have no intrinsic value; their value depends on a person's ability to *convert* them into functionings (capabilities).
  *   **The Pattern:** The arguer accepts Sen's critique of Resources (when defending) but ignores Sen's critique of Resources (when proposing policy).
  *   **The Label:** You can call this **"Evading the Conversion Problem."**

  ### Recommendation
  Use **Metric Decoupling** as your specific term. It is precise, descriptive, and separates the move from general inconsistency or standard theoretical disagreement. It highlights that the *link* between their moral goal and their practical tool has been severed for rhetorical convenience.
