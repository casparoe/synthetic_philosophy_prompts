          4.  Distinction between what a theorist would concede vs. dismiss.
          5.  Evaluation of falsifiability risk.

  2.  **Analyze the Core Theoretical Tension:**
      *   The user is advocating a "Strong Path Dependence" (SPD) view, akin to Pierson, Mahoney, or Arthur (in economics), but pushed to a macrohistorical level (similar to some interpretations of Historical Institutionalism or even certain strands of Marxism/Weberianism regarding specific capitalist trajectories).
      *   The opposing view is "Convergent Evolution" or "Functionalism" (modernization theory, neoclassical economics, some evolutionary psychology).
      *   The crux is *Equifinality* (different paths $\rightarrow$ same outcome) vs. *Path Dependence* (specific path $\rightarrow$ specific outcome).

  3.  **Brainstorming Defeaters (Fatal to Awkward):**
      *   *Fatal:* Genuine Equifinality. If radically different starting points and sequences lead to *functionally indistinguishable* institutions (not just superficially similar), SPD is dead. Example: Independent invention of bureaucracy in China vs. Rome vs. Inca. If they work the same way and solve the same problems despite zero contact or different critical junctures, that's a hit.
      *   *Fatal:* Reversibility without cost. If "lock-in" isn't real (i.e., you can switch paths easily), then path dependence is weak.
      *   *Awkward:* Reconvergence after shocks. If a critical juncture diverts a path, but it snaps back quickly due to structural pressures (e.g., market forces, ecological constraints), then the "critical juncture" wasn't actually critical.
      *   *Awkward:* Formal models showing identical distributions. If stochastic models show that *any* random walk leads to the same attractor state, contingency matters less than the attractor.

  4.  **Addressing the "Insulation" Strategy (Definitional Narrowing):**
      *   Defenders often say, "Sure, they look the same, but the *internal logic* is different." (e.g., Varieties of Capitalism).
