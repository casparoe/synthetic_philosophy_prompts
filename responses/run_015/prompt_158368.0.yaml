answer: |-
  # SEMINAR HANDOUT: THE BOUNDARY PROBLEM
  **Goal:** Locate your position on who constitutes the *demos*. Use the **Diagnostic Cases** to answer the **Decision Tree**.
  **Diagnostic Cases:** (1) Cross-border commuter (sleeps A, works B); (2) Long-term non-citizen resident; (3) Permanent emigrant citizen; (4) Downstream foreign farmers; (5) Future generations (nuclear waste); (6) Tourist (3 days); (7) Resident rejecting authority; (8) Children (school funding); (9) Incarcerated people; (10) Foreign corporation/state.

  ### DECISION TREE
  **Start at Node 1.** Follow the routing until you reach a **Leaf**.

  **Node 1:** Is the composition of the *demos* determined by a moral principle justifiable to those excluded, or by the factual exercise of power?
  *   If **Principle**, go to **Node 3**.
  *   If **Power**, go to **Node 2**.

  **Node 2:** Does that power require subsequent ratification by the governed to count as legitimate authority?
  *   If **Yes**, go to **Leaf A**.
  *   If **No**, go to **Leaf B**.

  **Node 3:** Does the cross-border commuter (Case 1) have a vote on the transit levy in the jurisdiction where they work?
  *   If **Yes** (Affectedness), go to **Node 4**.
  *   If **No** (Subjection), go to **Node 8**.

  **Node 4:** Does a foreign corporation (Case 10) get a vote if the decision affects its profits?
  *   If **Yes** (Any Causal Impact), go to **Node 5**.
  *   If **No** (Vital Interests Only), go to **Node 6**.

  **Node 5:** Can a stable *demos* be formed if membership changes with every causal ripple?
  *   If **Yes**, go to **Leaf C**.
  *   If **No**, go to **Leaf D** (Empty).

  **Node 6:** Do downstream foreign farmers (Case 4) get a vote if their water supply is threatened?
  *   If **Yes**, go to **Node 7**.
  *   If **No**, go to **Leaf E**.

  **Node 7:** Is the *demos* the same group for all issues (e.g., dam and school funding), or specific to each issue?
  *   If **Issue-Specific** (Fluid), go to **Leaf F**.
  *   If **Same Group** (Fixed), go to **Node 9**.

  **Node 8:** Does the long-term non-citizen resident (Case 2) get a vote?
  *   If **Yes** (Territorial Presence), go to **Node 10**.
  *   If **No** (Legal Status Only), go to **Leaf G**.

  **Node 9:** Do children (Case 8) or incarcerated people (Case 9) vote if their interests are affected?
  *   If **Yes** (Interest Protection), go to **Leaf H**.
  *   If **No** (Agency Capacity), go to **Leaf I**.

  **Node 10:** Does the tourist (Case 6) get a vote while present?
  *   If **Yes**, go to **Leaf J** (Empty).
  *   If **No**, go to **Node 11**.

  **Node 11:** Does the resident who rejects the polity's authority (Case 7) still get a vote?
  *   If **Yes** (Coercion), go to **Node 12**.
  *   If **No** (Consent), go to **Leaf K** (Empty).

  **Node 12:** Can feasibility, stability, or self-determination override these principle-based answers?
  *   If **Yes** (Pro Tanto), go to **Leaf L**.
  *   If **No** (Absolute), go to **Leaf M**.

  *(Note: Nodes 11-12 also apply to the Fixed Demos path from Node 9 for final qualification)*

  ### TABLE OF POSITIONS (LEAVES)

  | Leaf | Position Name | Description | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Constitutive Democrat** | Power constitutes the demos, legitimized by later ratification. | Risks circularity: you must be in the demos to ratify the demos. |
  | **B** | **Skeptical Realist** | The boundary is a pre-political fact of power; no principled answer exists. | **Flag:** Refuses the question rather than answering it; makes criticism impossible. |
  | **C** | **Radical All-Affected** | Any causal difference grants membership. | **Empty:** Incoherent; causal chains are infinite, making a demos impossible to identify. |
  | **D** | **Causal Fixed** | Causal impact matters, but the group must be stable. | **Empty:** Unattractive; arbitrarily excludes future affected parties to maintain stability. |
  | **E** | **All-Interested** | Only setbacks to vital interests count, but only for specific issues. | Requires a neutral arbiter to decide what counts as a "vital interest." |
  | **F** | **Fluid All-Affected** | The demos reconstitutes itself for every distinct decision. | Rules out the possibility of a corporate agent acting over time (no stable state). |
  | **G** | **Civic Nationalist** | Membership requires formal legal status (citizenship). | Permanently excludes long-term residents (Case 2) from rules governing their lives. |
  | **H** | **Stakeholder Democracy** | Fixed demos based on protected life-plans/interests (includes children). | Requires guardianship proxies for those without agency (children/incarcerated). |
  | **I** | **Agency Liberalism** | Fixed demos based on capacity for rational agency. | Disenfranchises those most affected by decisions (children/future gens). |
  | **J** | **Pure Territorial** | Mere physical presence grants membership. | **Empty:** Unexplored; grants vote to tourists (Case 6) but not emigrants (Case 3). |
  | **K** | **Voluntarist** | Only those who consent to authority are members. | **Empty:** Incoherent; allows exit from obligations simply by rejecting authority. |
  | **L** | **Pragmatic Liberal** | Principles guide boundaries but yield to feasibility/stability. | Admits that the "just" boundary may be intentionally unrealized. |
  | **M** | **Principled Absolutist** | The moral criterion is necessary and sufficient regardless of cost. | May require dissolving stable states to match perfect boundary alignment. |

  ### NOTE ON INDISTINGUISHABLE LEAVES
  **Leaf G (Civic Nationalist) and Leaf I (Agency Liberalism)** often converge in practice. Both exclude the tourist and the foreign farmer, and both typically exclude children (one via legal status, one via capacity). The tree cannot separate them without asking specifically about the *permanent emigrant citizen* (Case 3), whom G includes but I might exclude if agency is tied to territorial contribution.

  ***
  *Instructor Note: If you land in an Empty Leaf (C, D, J, K), you hold a combination of views that is generally considered incoherent or unexplored in the literature. Consider which node answer you wish to revise.*
