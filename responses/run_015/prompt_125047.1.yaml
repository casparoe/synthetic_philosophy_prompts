answer: |-
  You have put your finger on the single most persistent objection to hierarchical compatibilism: the **regress problem** (or the problem of **ultimate sourcehood**). Your intuition is shared by many incompatibilists (and eventually by Frankfurt himself, to an extent).

  However, to answer your specific request: **Yes, your framing conflates identification with sourcehood,** and in doing so, it assumes the very incompatibilist premise that compatibilism is designed to reject.

  Here is the plain pushback, followed by an analysis of whether the view is "covertly incompatibilist."

  ### 1. Identification is not Sourcehood
  Your argument rests on this premise: *For an agent to be responsible, she must be the ultimate source of the volitions with which she identifies.*

  The hierarchical compatibilist rejects this premise. They argue that **responsibility is a matter of structural integrity, not historical origin.**

  *   **Sourcehood (Incompatibilist view):** Requires that the causal chain originates *in* the agent in a way that is not fully determined by the past. (You must have "created" your character).
  *   **Identification (Frankfurtian view):** Requires that the action issues from a desire that the agent *endorses* via a higher-order volition. (You must "own" your character, regardless of where it came from).

  To claim Frankfurt's view is "covertly incompatibilist" because it fails to provide ultimate sourcehood is like claiming a vegetarian burger is "covertly beef" because it fails to provide cow meat. It misses the point of the substitution. Frankfurt is explicitly arguing that *sourcehood of the character* is not a necessary condition for responsibility. He is redefining the necessary conditions.

  If you insist that ultimate sourcehood is required, you aren't finding a hidden incompatibilist premise in Frankfurt; you are simply asserting incompatibilism against him.

  ### 2. Frankfurt vs. van Inwagen: Different Battles
  You ask if Frankfurt avoids van Inwagen's Consequence Argument. The answer is: **Frankfurt isn't playing that game.**

  *   **Van Inwagen's Consequence Argument** attacks the *ability to do otherwise*. It argues that if determinism is true, we cannot do otherwise, therefore we are not responsible.
  *   **Frankfurt's 1971 Project** attacks the *Principle of Alternate Possibilities (PAP)*. He argues that the ability to do otherwise is irrelevant to responsibility.

  Frankfurt's hierarchy is not an attempt to refute the Consequence Argument's claim that our acts are determined by the past. He **concedes** that our second-order volitions are causally fixed. His argument is that *even if* they are fixed, they can still be *free* in the sense that matters for responsibility, provided they mesh with our will.

  So, the hierarchy doesn't "avoid" the Consequence Argument by disproving determinism; it attempts to **render the Consequence Argument irrelevant** by changing the definition of freedom from "metaphysical openness" to "psychological harmony."

  ### 3. The "Covert Incompatibilism" Charge
  You ask: *Isn't her identification dependent on her being the ultimate source of her character?*

  The compatibilist answers: **No.**

  Consider the "Manipulation Argument." If a neuroscientist programs your second-order volitions, you aren't responsible. Why? Because the identification is alien; it doesn't reflect *you*. But if your second-order volitions are programmed by *nature, nurture, and reasoning processes* over time, the compatibilist argues this *does* reflect you.

  The incompatibilist says: "But you didn't choose the nurture!"
  The compatibilist says: "Choosing one's nurture is impossible (*causa sui*). If responsibility requires that, responsibility is impossible. Since responsibility is possible, it cannot require that."

  Therefore, the view is not *covertly* incompatibilist. It is *overtly* anti-*causa sui*. It claims that being the **proximate source** (the desires flow from *my* psychology) is sufficient, even if I am not the **ultimate source** (my psychology flows from the Big Bang).

  ### 4. Where Your Critique Holds Water (The Regress)
  While your charge of "covert incompatibilism" is a category error, your critique of the **hierarchy itself** is philosophically potent. This is the objection that forced Frankfurt to revise his view later in life.

  In his 1971 paper, Frankfurt leaves open the question: *What makes the second-order volition free?*
  *   If a second-order volition is just another desire, what makes it authoritative?
  *   If it requires a third-order volition to endorse it, we face an infinite regress.
  *   If it stops at the second order without further endorsement, it seems arbitrary.

  Frankfurt later admitted (in "Identification and Wholeheartedness," 1987) that the hierarchical model was insufficient. He moved away from "volitions" toward **"cares"** and **"decisions."** He argued that we stop the regress not by finding a higher order of will, but by **committing** ourselves. When I decisively identify with a desire, I constitute myself as an agent.

  Even here, however, the compatibilist maintains: *I can commit to a character I did not choose.* The commitment itself is the act of freedom, not the origin of the material committed to.

  ### 5. Summary: The Principled Compatibilist Defense
  To answer your final question: *Is there a principled way to hold that I can genuinely identify with a causally determined character without requiring that I caused that character?*

  Yes. The principle is **Reasons-Responsiveness** or **Self-Expression**.

  1.  **Rejection of *Causa Sui*:** It is metaphysically incoherent to be the cause of oneself. Therefore, moral responsibility cannot require it. (Strawson's "Basic Argument").
  2.  **Ownership vs. Origination:** Responsibility is about whether the action expresses *who you are*, not whether you created *who you are*. If your determined character is rational, reflective, and aligned (mesh), the action is yours.
  3.  **The Distinction:** You are conflating **Authorship** (I wrote the script) with **Agency** (I am acting out the script willingly). Compatibilists argue Agency is sufficient for Responsibility, even without Authorship of the script.

  ### Conclusion
  Your framing is a classic incompatibilist objection, but it mischaracterizes the compatibilist project as a failed attempt at libertarianism rather than a rival definition of freedom.

  *   **Did you conflate identification with sourcehood?** Yes. Frankfurt separates them intentionally.
  *   **Is it covertly incompatibilist?** No. It explicitly denies the incompatibilist requirement for ultimate sourcehood.
  *   **Does it avoid the Consequence Argument?** It sidesteps it by denying that the "consequences of the past" negate the "ownership of the present."

  The hierarchy doesn't solve the mystery of how we are free in a determined world; it argues that the mystery arises only because we are looking for the wrong kind of freedom (sourcehood) rather than the right kind (identification). Whether that move is successful is the central debate of modern free will theory, but it is not a covert admission of defeat.
