      *Correction:* Actually, the user mentions "Frankfurt-style hierarchical compatibilism." This refers to the 1971 "Freedom of the Will and the Concept of a Person." I should focus on the hierarchy, not the Frankfurt Cases (which are about moral responsibility and alternate possibilities). Though they are related, the hierarchy is the specific target here.

