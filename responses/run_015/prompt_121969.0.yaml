answer: |-
  1. For any consistent formal system $S$ capable of elementary arithmetic, there is a sentence $G_S$ true in the standard model but unprovable within $S$. This is a **platitude** that limits $S$ but does no work toward proving humans exceed $S$.

  2. Human agents possess the capacity to know the soundness of any formal system $S$ that models their own mathematical output, thereby enabling them to see $G_S$ is true. This is **substantive and open** but does no work because we cannot verify the soundness of complex systems like brains or LLMs.

  3. Human mathematical output is not capturable by a single recursively enumerable set because we revise our axioms over time, avoiding diagonalization by any fixed $S$. This is **substantive and open**, partially blocking simple mechanism but allowing for computational learning models.

  4. Human mathematical capacity is non-algorithmic because for any algorithm $A$ proposed as equivalent to human output, we can constructively identify $A$'s Gödel sentence as true. This is **false**, yet it is the friend's core claim, though it fails logically due to consistency assumptions.

  5. The capacity to recognize extra-systematic arithmetic truth is necessary and sufficient for semantic understanding, implying any purely syntactic processor lacks understanding. This is **false**, making it useless for dismissing LLMs since mathematical insight does not equate to linguistic semantics.
