  Based on the four verdicts provided, your interlocutor's position is underdetermined between a strictly epistemic norm and a socio-institutional one. While she consistently rejects assertion based on mere belief or luck, her reasoning oscillates between the *quality of the epistemic state* (knowing vs. guessing) and the *propriety of the role* (witness duty, professional forecast). Below is the conceptual mapping of her commitments, the analysis of the surgeon scenario, and a proposal for a discriminatory test case.

  ### 1. Analysis of Prior Verdicts (Constraints)
  To fit her record, any candidate norm must satisfy four conditions:
  1.  **Truth is insufficient:** The Witness (Case 2) was correct but blameworthy.
  2.  **Belief is insufficient:** The Meteorologist (Case 1) and Student (Case 4) believed their claims but were blameworthy.
  3.  **Knowledge (or robust justification) is sufficient:** The Historian (Case 3) was approved despite low subjective confidence (80%), provided objective knowledge existed.
  4.  **Context matters:** The verdicts track professional/academic standards (Meteorologist, Witness, Student), suggesting the norm may be sensitive to institutional roles.

  ### 2. Competing Candidate Norms
  Here are three norms that accommodate all four prior verdicts but diverge on the surgeon scenario.

  **Candidate A: The Internalist Knowledge Norm**
  *   **Definition:** One must assert $p$ only if one currently knows $p$, where knowledge requires the ability to access reasons or justification upon challenge.
  *   **Fit:** Explains why the Witness (no access to reasons) and Meteorologist (insufficient evidence) are blameworthy, while the Historian (access to sources) is not.
  *   **Surgeon Prediction:** **Condemn.** Although the statement is true and she believes it, the scenario stipulates she "lacks the cognitive capacity to know" and "could not defend or justify the claim." On an internalist view, assertion requires current cognitive access to the justification, which she lacks due to fatigue.

  **Candidate B: The Professional/Role Duty Norm**
  *   **Definition:** One must assert $p$ only if doing so complies with the safety and competency standards of one's institutional role.
  *   **Fit:** Explains the Meteorologist (violates forecasting standards), Witness (violates oath of perceptual basis), and Student (violates academic standards of understanding). The Historian is approved because her method meets archival standards.
  *   **Surgeon Prediction:** **Condemn.** Operating on "autopilot" after a thirty-hour shift violates standard medical protocols regarding competency and rest. The assertion is a breach of professional duty regardless of the truth of the specific claim.

  **Candidate C: The Externalist Reliability Norm**
  *   **Definition:** One must assert $p$ only if the assertion is produced by a reliable cognitive process that generally tracks truth, regardless of current conscious access.
  *   **Fit:** Explains the Witness (luck is unreliable) and Meteorologist (60% forecast is statistically unreliable for definitive assertion). The Historian is approved because her sources are reliable.
  *   **Surgeon Prediction:** **Approve (or Excuse).** Her assertion stems from deep surgical training, which is a highly reliable process. Even if she is tired, the "rehearsed behaviour" of a trained surgeon is statistically more reliable than a layperson's conscious reasoning. If the norm prioritizes truth-tracking reliability over conscious defensibility, the assertion is permissible.

  ### 3. Best Guess: The Internalist Knowledge Norm
  I hypothesize your interlocutor is operating on the **Internalist Knowledge Norm** (Candidate A), likely blended with a folk-conception of accountability.

  **Reasoning:**
  1.  **The Witness Hesitation:** Her hesitation between calling the witness's claim a "lie" or a "breach of duty" suggests she is searching for an epistemic fault (lying implies asserting what one takes to be false; breach implies asserting without basis). This points to a focus on the *assertor's relation to the truth* rather than just institutional rules.
  2.  **The Historian Case:** This is the strongest evidence. She approves the historian *despite* low subjective confidence (80%). If she were running a Pure Belief Norm or a Confidence Norm, this would be problematic. If she were running a strict Professional Norm, the damaged archive might be an issue. But she approves because the historian *knows* from other sources. This prioritizes the factive epistemic state (Knowledge) over both psychological confidence and institutional obstacles.
  3.  **The Student Case:** She condemns the student not because he violated a school rule, but because he "misconstrued" the material. This implies the fault lies in his lack of understanding (lack of knowledge), not merely a procedural error.

  **Verdict on Surgeon:** She will likely **condemn** the surgeon. Her record shows she values the *ability to stand behind a claim* (Witness had no basis; Historian did). Since the surgeon "could not defend or justify the claim if challenged," she lacks the accountability your interlocutor seems to require for permissible assertion.

  ### 4. Discriminatory Hypothetical Case
  Since both the Internalist Knowledge Norm and the Professional Duty Norm predict condemnation in the Surgeon case, you need a scenario where **epistemic competence** and **institutional role** come apart.

  **The Case of the Off-Duty Expert**
  *   **Scenario:** The same surgeon, now fully rested and off-duty at a dinner party, is asked by a layperson about a suture pattern. She asserts, "This pattern is correct," based on her genuine knowledge and expertise. However, hospital policy strictly forbids giving medical advice outside clinical settings to avoid liability.
  *   **The Assertion:** True, Believed, Known (Internalist condition met), Competent (Externalist condition met).
  *   **The Conflict:**
      *   **If she approves:** She is running an **Epistemic Norm** (Knowledge/Reliability). The assertion is epistemically sound, so the institutional restriction is irrelevant to the *norm of assertion* (even if it violates employment policy).
      *   **If she condemns:** She is running a **Professional/Role Norm**. The assertion is improper because it violates the boundaries of her professional role, regardless of her epistemic state.

  **Why this discriminates:**
  The Surgeon case conflates fatigue (epistemic impairment) with protocol violation. The Off-Duty Expert case isolates the *source of the norm*. If her objection to the sleep-deprived surgeon was truly about *knowledge* (Internalist), she should approve the rested surgeon even if off-duty. If her objection was about *role* (Professional), she should condemn the off-duty assertion because it breaches professional boundaries. This will clarify whether her commitments are fundamentally about *truth-tracking* or *social regulation*.
