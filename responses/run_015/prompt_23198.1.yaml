  I've also heard that the principle is supposed to be justified by a Dutch Book argument, but I don't see how the Dutch Book argument is supposed to work here, like, what are the bets and why do they guarantee a loss? And I'm especially confused about the objections I've read about, where the principle seems to go wrong in cases where you'll forget something or change your mind for good reason, because I don't get how those cases are supposed to be a problem if the principle is just about coherence. Like, if you know you're going to forget, shouldn't that just be a fact about your future credences?

  Can you walk me through all of this? I want to understand not just the statement of the principle but the motivation for it and the problems with it. I'm a bit behind in the course and this is the part I'm most stuck on, so any help would be appreciated.
