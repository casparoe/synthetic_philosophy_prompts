answer: |-
  # Seminar Activity: The Wealth Accumulation Challenge

  ## 1. Learning Objective
  To experientially demonstrate the tension between maximizing expected arithmetic mean wealth (finite horizon) and maximizing expected geometric growth rate (long-run survival), without initially invoking the Kelly Criterion or utility theory. Students will confront the impact of volatility drag, drawdown constraints, and parameter uncertainty on strategy selection.

  ## 2. Materials
  *   **Currency:** "Lab Dollars" (printed paper slips or tokens). Starting bankroll: $1,000 per student.
  *   **Randomizer:** 7 physical coins (for 7 pairs) OR a projected random number generator (RNG) visible to all. *Recommendation: Use a projected RNG sequence for all students to ensure identical market conditions, isolating strategy as the variable.*
  *   **Worksheets:** One per student with columns for: Round, Outcome (W/L), Chosen Fraction ($f$), Stake, Ending Wealth.
  *   **Timer:** Visible countdown.
  *   **Whiteboard:** For tracking aggregate class statistics.

  ## 3. Game Rules & Setup
  **The Scenario:** You are fund managers. You have 10 rounds to grow your capital.
  **The Asset:** A binary investment. You stake a portion of your current bankroll.
  **The Payoff:** Even money (1:1). If you win, you gain the stake amount. If you lose, you lose the stake amount.
  **The Probability:** The probability of a win ($p$) is fixed but **unknown**. It is strictly greater than 0.5.
  **The Constraint (The Twist):** To remain eligible for the "Best Performance" prize, your bankroll must never drop below **$600** (60% of initial) at the end of *any* round. If you breach this floor, you are "liquidated" and cannot win, even if you recover later.

  **Phase 1: Estimation (10 Minutes)**
  1.  Distribute bankrolls ($1,000) and worksheets.
  2.  Display a "Historical Sample" of 5 past outcomes on the screen (e.g., W, L, W, W, L).
  3.  **Instructor Note:** The true $p$ is 0.60. The sample shown is fixed (3 Wins, 2 Losses) to suggest an edge, but introduce estimation uncertainty (sample $p = 0.6$, but $N$ is small).
  4.  Students discuss in pairs how to estimate the true $p$ and what fraction to bet.

  **Phase 2: Commitment (5 Minutes)**
  1.  Students must choose a **fixed betting fraction ($f$)** to use for all 10 rounds. They write this on their worksheet.
  2.  They cannot change $f$ mid-game. This forces them to commit to a strategy based on their initial estimate and risk tolerance.
  3.  *Constraint Check:* Remind them of the $600 liquidation floor.

  **Phase 3: Trading (15 Minutes)**
  1.  Project the 10 pre-generated outcomes (based on true $p=0.6$).
      *   *Sequence Example:* W, W, L, W, L, W, W, L, W, L (6 Wins, 4 Losses).
  2.  Students calculate their wealth round-by-round using their chosen $f$.
      *   Formula: $W_{t} = W_{t-1} \times (1 + f)$ if Win; $W_{t-1} \times (1 - f)$ if Loss.
  3.  Instructor tracks who gets "liquidated" (wealth < $600 at any point) on the whiteboard.

  **Phase 4: The Reveal & Prize (5 Minutes)**
  1.  Announce the true $p$ (0.60).
  2.  Award a prize (e.g., chocolate) to the non-liquidated student with the highest final wealth.
  3.  Ask the liquidated students to raise hands.

  ## 4. Minute-by-Minute Timeline (75 Minutes Total)
  *   **00:00 – 00:05:** Introduction. Distribute materials. Explain rules. **Do not mention Kelly, Log-Utility, or Geometric Mean.**
  *   **00:05 – 00:15:** Phase 1 (Estimation). Show the 5-sample history. Allow pair discussion.
  *   **00:15 – 00:20:** Phase 2 (Commitment). Students lock in their fraction $f$. Collect fractions anonymously for later analysis.
  *   **00:20 – 00:35:** Phase 3 (Trading). Project outcomes one by one. Students calculate. Instructor marks liquidations.
  *   **00:35 – 00:40:** Phase 4 (Results). Announce winner. Reveal true $p$.
  *   **00:40 – 01:00:** Debrief (Mathematical Mapping).
  *   **01:00 – 01:15:** Conceptual Discussion (Settled vs. Contested).

  ## 5. The Twist: The Drawdown Constraint
  The liquidation floor ($600) is the critical twist.
  *   **Without the floor:** Students betting $f=1.0$ (All-In) have the highest *Expected Wealth* after 10 rounds. If they get lucky, they win big.
  *   **With the floor:** The All-In strategy becomes suicidal. A single loss early on eliminates them.
  *   **Pedagogical Goal:** This forces students to intuitively value *survival* over *maximum expectation*. It mimics the effect of logarithmic utility without naming it. It creates a tangible cost to volatility.

  ## 6. Debrief Guide: Mapping Experience to Math
  *Do not lecture. Ask questions and fill in the math on the board based on their answers.*

  **Step 1: The Estimation Error**
  *   *Ask:* "Who estimated $p$ higher than 0.6? Who estimated lower?"
  *   *Point:* With only 5 samples, the variance is high. If you estimated $p=0.55$ but bet as if $p=0.70$, you overbet.
  *   *Math:* The optimal fraction depends on $p$. If $p$ is unknown, the "true" optimal fraction is also unknown.

  **Step 2: The Overbetting Trap (Volatility Drag)**
  *   *Ask:* "Who bet more than 40% of their bankroll?" (Likely several).
  *   *Calculation:* Show a student who bet $f=0.5$ vs. one who bet $f=0.2$.
      *   Win/Loss sequence: 1 Win, 1 Loss.
      *   $f=0.5$: $1000 \to 1500 \to 750$. (Net loss despite 50% win rate).
      *   $f=0.2$: $1000 \to 1200 \to 960$. (Smaller loss).
  *   *Concept:* **Volatility Drag.** Arithmetic average of returns $\neq$ Geometric average. $(1+f)(1-f) = 1 - f^2$. The larger $f$, the more wealth is destroyed by variance.
  *   *Reveal:* The fraction that maximizes the geometric growth rate is $f^* = 2p - 1$. For $p=0.6$, $f^* = 0.2$ (20%). This is the **Kelly Criterion**.

  **Step 3: Finite Horizon vs. Long Run**
  *   *Ask:* "If we only played 1 round, what fraction maximizes Expected Dollar Wealth?"
  *   *Answer:* 100% ($f=1.0$). Since $p > 0.5$, $E[W]$ is maximized by betting everything.
  *   *Ask:* "Why didn't you bet 100%?"
  *   *Answer:* "Risk of ruin," "Couldn't recover," "Felt wrong."
  *   *Concept:* Maximizing $E[W]$ is rational for a *single* bet if you have no bankruptcy constraint. Maximizing $E[\log W]$ (Kelly) is rational for *repeated* bets where you care about the terminal wealth distribution after many rounds.
  *   *Key Insight:* The game was only 10 rounds (Finite). Technically, the $E[W]$ maximizer should bet more than Kelly. But the **Liquidation Floor** acted as a proxy for "infinite horizon" consequences (if you hit zero, you can't play forever).

  **Step 4: Uncertainty vs. Risk Aversion**
  *   *Ask:* "Did you bet less than 20% because you dislike risk (utility), or because you weren't sure about $p$?"
  *   *Concept:* **Fractional Kelly.** If you are unsure about $p$, betting full Kelly is dangerous. Betting half-Kelly is often robust to estimation error. This isn't "risk aversion" in the utility sense; it's epistemic humility.

  ## 7. Troubleshooting: What Will Go Wrong
  1.  **The "Lucky Idiot" Problem:** A student betting 100% might get 10 wins and crush the Kelly bettors.
      *   *Fix:* In the debrief, emphasize *ex-ante* rationality vs. *ex-post* luck. Ask the class: "Would you hire this manager again, or did they just get lucky?" Use the theoretical expected growth rates to show the 100% bettor was statistically likely to lose.
  2.  **Calculation Errors:** Students will mess up the compound interest math on paper.
      *   *Fix:* Provide a simple calculator or spreadsheet template on a tablet if available. If not, pair them up so one calculates, one verifies.
  3.  **Time Overrun:** 10 rounds of manual calculation takes time.
      *   *Fix:* Cut to 8 rounds if needed. Or, pre-calculate the "Wealth Multiplier" for common fractions (e.g., if you bet 20% and get 6W/4L, your multiplier is X) and hand it out.
  4.  **Boredom:** Watching a projector flip numbers is dry.
      *   *Fix:* Add "News Flashes." Between rounds, announce fake news ("Market volatility up!") to induce anxiety, reinforcing the emotional weight of drawdowns.

  ## 8. Limitations: What the Facilitator Must Supply
  The activity cannot reproduce **Time**.
  *   **The Gap:** 10 rounds is not "long run." The mathematical convergence of geometric growth requires $N \to \infty$. In 10 rounds, variance dominates.
  *   **Facilitator Duty:** You must explicitly state: "In this room, luck ruled. In the real world, with 10,000 bets, the person who bet 20% would almost certainly be wealthier than the person who bet 50%. We are simulating a principle that requires time to manifest."
  *   **The Gap:** Real money stakes.
  *   **Facilitator Duty:** Acknowledge that play money reduces the emotional impact of loss. The "Liquidation Floor" is a mechanical substitute for the psychological pain of ruin.

  ## 9. Settled vs. Contested: Conceptual Clarification
  *In the final 15 minutes, distinguish between mathematical facts and philosophical/economic debates.*

  ### Settled (Mathematical & Instrumental)
  1.  **Growth Rate Optimization:** It is mathematically proven that betting the Kelly fraction ($2p-1$) maximizes the asymptotic rate of exponential growth of wealth. Any other fraction results in a lower long-run growth rate.
  2.  **Overbetting Danger:** Betting more than the Kelly fraction (overbetting) reduces geometric growth and increases the probability of ruin. Betting double Kelly reduces growth to zero; betting more than double Kelly leads to negative expected growth (certain ruin in the long run).
  3.  **Ergodicity:** For a single agent playing repeatedly (time average), the geometric mean is the relevant metric for survival. For an ensemble of agents playing once (ensemble average), the arithmetic mean is relevant. Confusing these is the "Ergodicity Problem."

  ### Contested (Normative & Practical)
  1.  **Normative Status:** Is Kelly *the* rational strategy?
      *   *View A (Samuelson/Modigliani):* No. Kelly is merely the consequence of having Logarithmic Utility ($U(W) = \ln W$). If an agent has different utility (e.g., linear for short horizons, or S-shaped prospect theory), maximizing expected utility is rational, even if it violates Kelly.
      *   *View B (Breiman/Thorp):* Yes. Regardless of utility, if you want to maximize wealth in the long run without going bust, Kelly is instrumentally necessary. It dominates other strategies almost surely as $N \to \infty$.
  2.  **Finite Horizon Coherence:** Is maximizing Expected Wealth ($E[W]$) coherent for short horizons?
      *   *Consensus:* Yes, if the agent can absorb the loss and will not play again. If the game is truly "one-shot," betting full bankroll on a positive EV bet is mathematically consistent with $E[W]$ maximization. The "Kelly" objection only applies if the game is repeated or wealth has diminishing marginal utility.
  3.  **Fractional Kelly under Ambiguity:** How much to discount Kelly when $p$ is unknown?
      *   *Contested:* There is no formula. Some argue for Half-Kelly as a heuristic for parameter uncertainty. Others argue for Bayesian updating of $p$ which dynamically changes the optimal fraction. There is no consensus on the "correct" discount for estimation error.
  4.  **Weight of Ruin:** How much should one avoid ruin?
      *   *Contested:* In standard economics, "ruin" is just wealth = 0. In reality, ruin often means exclusion from the market (death, firing, margin call). The economic cost of ruin is arguably infinite, which pushes rational agents toward Kelly-like behavior even with linear utility, due to the *constraint* of survival rather than the *utility* of money.

  ### Closing Instruction to Facilitator
  Ensure students leave understanding that **Kelly is not about "being safe."** It is about **being efficient.** It is the speed limit for wealth compounding. Driving slower (underbetting) is safe but suboptimal. Driving faster (overbetting) feels exciting but leads to a crash. The "Liquidation Floor" in the game was the crash.
