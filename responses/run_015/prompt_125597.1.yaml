answer: |-
  This is a rich problem, and your instinct to avoid anachronistic moral outrage is correct. If Ishbel sounds like a twenty-first-century activist, you'll lose the period texture. But if she sounds like a pure bean-counter, you lose the stakes. The tension you're feeling—that Smith gives her the tools to dismantle the *efficiency* of empire but not necessarily the *legitimacy* of it—is not a bug in your research. It is the engine of her character arc.

  Here is how I think you can navigate this, pushing back on your frameworks where necessary.

  ### On the "Auditor" vs. "Neighbor" Distinction

  You asked me to push back, so I will: this binary is useful, but it risks being too clean for the eighteenth-century mind. In 1776, the "Auditor's Objection" (it costs too much) was not distinct from the moral sphere in the way we separate economics and ethics today. To waste public wealth was a moral failing. To endanger the constitution through debt was a sin against the future.

  However, the deeper pushback is this: Smith does not actually stay in the "Auditor" lane. He argues that the colonial system corrupts the *metropole*. It creates a class of wealthy returnees (the "nabobs") who buy their way into Parliament and distort British law for private gain. This isn't just about money; it's about the health of the body politic.

  For Ishbel, this is the bridge. She doesn't need to argue that the enslaved or the colonized have inherent rights (which, as you note, Smith barely touches). She can argue that the system makes *Britons* tyrants. It rots the character of the merchant and the politician. Her opposition isn't "This hurts Virginia"; it's "This turns Glasgow into a fence for thieves." This allows her to be anti-colonial without adopting a modern human rights framework. She is protecting British liberty by dismantling British empire. That is a position a tobacco merchant's daughter could hold without immediately being thrown out of the house, though it would certainly cause a scene.

  ### (a) "But what if it did pay?"

  This is the hardest question for an Ishbel grounded in Smith. If the ledger balanced, Smith's economic argument collapses.

  If her father asks this, she cannot answer with profit. She has to answer with *security* and *corruption*.
  1.  **Security:** Smith argues that the distance makes the colonies impossible to defend properly in the long run. Even if they pay now, the military burden will eventually bankrupt the state. She can argue that the current profit is a bubble fueled by borrowed time and borrowed money.
  2.  **Corruption:** This is the stronger play. Even if the colonies turn a profit, who gets it? A monopoly. Ishbel can argue that a system that relies on exclusive privileges is inherently hostile to the "obvious and simple system of natural liberty." If it pays, it pays because the law forces it to, not because the trade is sound. That makes the profit illegitimate.

  She can tell her father: "If the trade only works because the Navy guns are pointed at the competitors, it isn't commerce. It's theft with extra steps." That moves the goalposts from *profitability* to *legitimacy*.

  ### (b) Are Smith's Remedies Just Tidier Empire?

  Yes, and Ishbel should realize this. Smith suggests either integrating the colonies into the British constitution (taxing them, giving them representation) or letting them go peacefully to avoid the cost of war. He does not advocate for a universal right to self-determination.

  This is where the friction with her Virginia cousin becomes fascinating. Her cousin likely wants independence based on political sovereignty. Ishbel, reading Smith, might conclude that independence is fine *only because* it saves Britain money.

  This creates a wonderful instability in her. She is arguing for a result (loosening the colonies) that aligns with the rebels, but for reasons (fiscal hygiene) that align with a cold-hearted economist. She might find herself alienated from both sides: too radical for the Glasgow merchants, too cold for the Virginia patriots. She isn't fighting for "Freedom"; she's fighting for "Sense." In a revolutionary moment, being the person who argues for "Sense" is a lonely, dangerous place to be.

  ### (c) Can She Get to "Injustice" Without Importing Morals?

  No, she can't. And she shouldn't.

  If she gets from "this is inefficient" to "this is wrong" without adding a premise, she's making a logical leap. But characters make logical leaps all the time. The key is to make the import explicit in her internal monologue.

  She has to take Smith's comment about the philosopher and the street porter—that the difference arises from habit and education, not nature—and weaponize it against his own stadial theory. Smith believes societies progress from hunting to commerce. He implies some are "behind." Ishbel can seize on the "nature" part. If a Virginian planter and a Glasgow merchant differ only by circumstance, then ruling one by the other without consent is a violation of that shared nature.

  She is importing a moral premise: *Inequality of circumstance does not justify inequality of power.* Smith implies this, but doesn't follow it to the political conclusion. Ishbel follows it for him. This makes her a more active reader. She isn't just absorbing the book; she's completing it. That fits your description of her as sharp and self-taught. She is correcting the Professor.

  ### On the Universalism vs. Stadal Theory Tension

  You have a sinking feeling that Smith holds both views (universal human nature + hierarchical stages of society) and never noticed the contradiction. You are right. He didn't notice.

  Do not fix this for her. Let this be the source of her instability.

  If Ishbel believes people are fundamentally the same (the porter/philosopher argument), then the "stages" theory (hunting/herding/farming/commerce) becomes a description of history, not a justification for rule. But if she accepts the "stages" theory too rigidly, she risks believing the Americans are "younger" and need guidance.

  This tension allows her to waver. In one chapter, she might argue that the Americans are equals who deserve freedom. In the next, frustrated by the chaos of war, she might slip into thinking they need the stability of British commerce until they "mature."

  This makes her human. It prevents her from becoming a mouthpiece. It also reflects the historical reality: many Scottish intellectuals supported the American cause not because they believed in universal democracy, but because they saw the Americans as fellow "progressive" commercial societies breaking free from feudal restraint. They supported the revolution because they thought it was the next step in *civilization*, not because they believed in equality for all mankind.

  If Ishbel conflates "commercial progress" with "moral rightness," she sets herself up for a fall. What happens when she sees that commerce can be just as brutal as conquest? That is a realization she can have in book three.

  ### A Note on the Glasgow Context

  Keep the tobacco on the page. Glasgow's wealth in this period was built on the very re-export trade Smith is critiquing. The "Tobacco Lords" built their mansions on the monopoly system.

  When Ishbel reads that book by the fire, she is reading an attack on her father's pension. That raises the stakes. It's not abstract. If Smith is right, her father is not a patriot; he is a beneficiary of a drain on the national wealth.

  If your writing group wants moral outrage, give them this: Ishbel is outraged that her father's success is a illusion propped up by state violence. That is a moral position derived from economic data. It allows her to look at the sugar on the table or the tobacco in the warehouse and see the ledger behind it.

  ### Summary of Advice

  1.  **Drop the clean binary.** Merge the Auditor and Neighbor objections through the concept of *corruption*. The empire hurts Britain by making Britons cruel and corrupt.
  2.  **Let her misread Smith.** She should take his universalism and push it further than he does. That shows her intellect.
  3.  **Embrace the instability.** The contradiction between human equality and social stages is where her doubt lives. Don't resolve it in this book.
  4.  **Americanize the spelling.** (I have ensured this response uses *labor, defense, center, honor*, etc., to match your editor's requirements).

  You are writing a character who is thinking in real-time. Let her thoughts be slightly ahead of the available vocabulary. That is where the friction lives.
