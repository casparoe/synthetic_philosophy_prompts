answer: |-
  The light in the Adjustment Bureau was always the same: fluorescent, shadowless, indifferent. Elara sat at her desk, the hum of the servers in the basement vibrating through the soles of her shoes. On her screen, the queue blinked. Four cases. One day.

  She opened the first file. Mrs. Gable. Roof collapse during a storm.

  Mrs. Gable sat on the other side of the glass partition, her hands folded tightly in her lap. She looked exhausted, not from the injury—the sling on her arm was standard issue—but from the interview.

  "I need you to confirm," Elara said, her voice level, "that you did not know the tiles were loose."

  "I told you, I didn't," Mrs. Gable said. "I never go up there."

  "And you did not ignore a weather warning?"

  "I was inside. I didn't hear the alert until the noise started."

  Elara typed. *Subject location: Interior. Subject knowledge of risk: Null.* This was brute luck. A misfortune that simply befell her. By the Code, she was owed repair. But Elara watched Mrs. Gable's eyes darting to the camera in the corner, then back to Elara. The woman was performing innocence. She had to prove she hadn't contributed, hadn't invited the collapse through negligence. She had to prove she was a passive object in her own life to deserve help.

  "Approved," Elara said. "Form C filed."

  Mrs. Gable didn't smile. She just exhaled, a sound of relief mixed with shame. "Thank you," she whispered, and stood up too quickly, wincing. She walked out needing to be seen as blameless to be seen as worthy.

  Elara closed the file. Through the glass, she saw the next claimant waiting. Mr. Aris.

  He was the topic of the morning briefing. Aris had been struck by a delivery drone. Brute luck, seemingly. But the telemetry showed he had stepped off the designated safe walkway. He claimed he was avoiding a puddle. The surveillance showed he had deviated from his usual route three blocks prior to buy a specific brand of coffee.

  In the breakroom earlier, the officers had argued. "Buying coffee is ordinary maintenance," one had said. "It's social fuel."

  "Choosing a specific brand is preference," another countered. "Preference is option luck. He gambled that the route was safe for the sake of a latte."

  Elara looked at Aris now. He looked like a man trying to remember if a choice made seven minutes ago was a gamble.

  "Mr. Aris," Elara said. "The deviation from the safe path. Was it necessary?"

  "I wanted the coffee," he said.

  "Was it the only coffee available?"

  "No. But it's the kind I like."

  Elara's fingers hovered over the keys. *Ordinary Living* vs. *Calculated Risk*. If every preference creates liability, then living is a gamble. If no preference creates liability, then no one is responsible for their path. The Code said: *Foreseeable risk undertaken for non-essential gain.*

  "Was the taste essential?" Elara asked.

  Aris blinked. "It's just coffee."

  "Then it was a choice." Elara typed. *Partial denial. Route deviation classified as Option Luck.*

  Aris stared at her. "I was just walking home."

  "You chose the path," Elara said. She didn't raise her voice. She didn't need to. The system spoke through the classification. Aris stood up, rubbing his neck, looking at the floor as if the geometry of the tiles might explain where he went wrong.

  The third claimant was Ms. Lin. She was a violinist. A nerve compression in her right hand. The standard repair package covered motor function for ambulation and basic grip. It covered holding a spoon. It did not cover the fine dexterity required for the concerto she was scheduled to play next month.

  "I need the specialized therapy," Ms. Lin said. "Otherwise I can't play."

  "You can hold a cup," Elara said, reading the assessment. "You can type. The standard package restores function to the baseline human average."

  "But my life isn't average," Ms. Lin said. "I've trained for twenty years. This injury stops my life, not just my walking."

  "The scheme insures against misfortune, not against the interruption of specific ambitions," Elara recited. It was a line from the handbook, Section 4, Paragraph 2. *Ambition is not a circumstance.*

  "It feels like a circumstance to me," Ms. Lin said. "I didn't choose to have this talent, and I didn't choose to lose it."

  "You chose to rely on it for your livelihood," Elara said. "That is a wager on your own body's continuity. The state covers the body. It does not cover the wager."

  Ms. Lin looked at her hand, flexing the fingers slowly. She nodded, once. She understood the logic even if she didn't accept the cost. She signed the digital pad, accepting the standard repair. She would walk fine. She would not play. Elara filed the claim under *Circumstance: Biological*, with a note: *Excess capacity denied.*

  The last file was the heaviest. Mara K. Broken leg, multiple fractures. Off-piste skiing.

  Mara sat opposite Elara. She was young, her leg elevated on a cushion. She didn't look like someone asking for help; she looked like someone demanding what was due.

  "You signed the waiver at the lodge," Elara said. "You knew the zone was unpatrolled."

  "I knew the risk," Mara said. "But I didn't choose the mind that took it."

  Elara paused. This was the edge of the line. "Explain."

  "My father was an addict," Mara said. "He was absent. I grew up in chaos. I developed a need for high stimulation to feel regulated. That's psychology. That's brute luck. I didn't choose my trauma. I didn't choose the adrenaline dependency that made the slope look necessary to me."

  Elara listened. It was a coherent argument. If personality is circumstance, then all choices are determined by prior causes. If all choices are determined, then all luck is brute luck. The insurance pool would collapse. Everyone would be owed everything.

  "The Code distinguishes between the formation of character and the action of character," Elara said. "Your upbringing is circumstance. Your decision to ski the zone is option luck."

  "But the decision came from the upbringing," Mara said. "You're charging me for being who I am."

  "I am adjudicating the action," Elara said. "If we trace causality back to childhood, no one is responsible. If we stop at the moment of conscious risk, you are."

  "So I pay for the leg?"

  "The repair is denied. The risk was known. The appetite is irrelevant to the classification."

  Mara leaned forward, wincing as the movement pulled at her thigh. "So if I jump off a bridge because I'm depressed, is that a choice? Or is the depression the circumstance?"

  "Mental health adjudications are handled by Division 4," Elara said. "This is physical injury via recreational hazard."

  "You're drawing a line in the sand," Mara said. "And I'm on the wrong side of it."

  "The line has to be somewhere," Elara said. "Otherwise there is no system."

  "So I just go home?"

  "You go home with the injury you chose," Elara said. "The country has decided it can live with that."

  Mara stared at her. There was no anger left, just a cold realization. She wasn't being punished; she was being categorized. She was being told that her history was real, but it didn't count here. Here, only the moment of the jump mattered.

  Mara stood up. She grabbed the crutches provided for the exit—standard courtesy, not coverage. "Hope you sleep well," she said.

  "Next claimant," Elara said to the empty room, as the door clicked shut.

  She updated the ledger. *Claim 4092: Denied. Code: Option Luck.*

  The screen refreshed. The queue was empty. The hum of the servers continued, steady and low. Elara saved the file, shut down her terminal, and stood up. She put on her coat. Outside the window, the city lights were coming on, thousands of them, each representing a life full of choices and chances, none of which mattered until someone fell.

  She walked to the elevator. The doors opened immediately. She stepped in, pressed the button for the ground floor, and watched the numbers count down. She didn't think about Mara's leg, or Mrs. Gable's shame, or the violinist's silence. She thought about the train schedule. She had chosen to take the 6:15. If she missed it, it would be her fault. If the train broke down, it would be the state's.

  The doors opened. Elara walked out into the evening air, checking the sky for clouds, checking the pavement for ice, calculating the risk of every step she took toward the station.
