      *   **Goal:** Teach *Tranquilism* (sole intrinsic good = absence of craving/suffering; no positive mental state needed/relevant).
      *   **Constraint 1 (Format):** Pedagogical architecture, not exposition. No bibliographies/citations.
      *   **Constraint 2 (Components):**
          1.  Dependency Order (Conceptual distinctions needed *before* articulation).
          2.  Carrying Example (Must isolate absence of craving from pleasure and numbness/death).
          3.  Misconception Sequence (Order of likely errors + where to head them off).
          4.  Check-for-Understanding (Reveals internalization of non-comparative, absence-only structure).
          5.  Bracketing/Refusals (What to exclude to prevent drift).
      *   **Tone:** Academic, precise, structured, focused on logical dependencies and misconception dynamics.

  2.  **Deconstruct the Core Concept (Tranquilism):**
      *   It's not Hedonism (pleasure isn't the good).
      *   It's not Stoicism (suppression isn't the method).
      *   It's not Nihilism/Depression (numbness isn't the state).
      *   It's not Mysticism (ineffability isn't the point).
      *   It *is* the axiological priority of absence (subtraction > addition).
      *   Key difficulty: Students think in terms of *states* (qualia). Tranquilism is about the *removal of a burden*.

  3.  **Drafting Component 1: Dependency Order:**
      *   What must they understand *before* they can hear the definition without distorting it?
      *   *Problem:* If they think "good" = "feeling something nice," they will hear "tranquility" = "feeling calm."
      *   *Distinction 1:* **Valence vs. Burden.** They need to separate the *tone* of experience from the *pressure* of experience.
      *   *Distinction 2:* **Cessation vs. Suppression.** If they think the absence is achieved by holding back, it's Stoicism. It must be understood as a natural settling when fuel is removed.
      *   *Distinction 3:* **Zero-Point vs. Neutral Feeling.** "Zero" isn't a bland feeling; it's the lack of a deviation.
      *   *Ordering:* Burden/Pressure comes first. If they don't get that craving is a *pressure*, they will treat its absence as a *mood*. Then Cessation/Suppression (methodology). Then Zero-Point (axiology).

  4.  **Drafting Component 2: Carrying Example:**
      *   Needs to avoid: Death, Coma, Depression (numbness), Orgasm/High (pleasure).
      *   Needs to capture: Relief, functionality without friction, the specific value of "not needing."
      *   *Idea:* The itch? Too physical/negative.
      *   *Idea:* Debt repayment? Good, but financial.
      *   *Idea:* Noise cancellation? Good, but technological.
      *   *Idea:* **The Heavy Backpack.** (Classic, but maybe too cliché).
      *   *Idea:* **The Background Hum.** A constant noise you didn't notice until it stops.
