prompt: |-
  I'm on my state's corrections oversight board and we're voting thursday on a pilot 'dignity wing' at Riverside — basically copying Halden's private rooms, shared kitchens, and casual guard uniforms inside a medium-security US prison that still runs mandatory minimums and gives zero parole credit for particpating. The architects say you can seperate punitive structure from rehabilitative environment; critics call it cosmetic penal welfarism that masks mass incarceration with nicer furniture. I need a short memo recommending approve, reject, or approve-with-conditions, with a concrete 90-day evaluation clause. Take seriously the strongest objection: Halden works because Norway's low inequality and high social trust make rehabilitation credible, so importing the architecture without the welfare state just builds a boutique prison for a lucky few while the carceral system stays intact. Also engage whether coerced rehabilitation — forcing inmates into 'autonomy-building' programs — undermines the moral agency it's supposed to restore. Don't ask for citations or a reading list; reason it through. Treat the losing side honestly. End with a fixed bottom line.

  Verdict: [recommendation]
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a state corrections oversight board.
      *   **Task:** Write a short memo recommending a vote (Approve, Reject, or Approve-with-Conditions) on a pilot "dignity wing" at Riverside prison.
      *   **Context:** The pilot copies Halden Prison (Norway) features (private rooms, shared kitchens, casual guard uniforms) within a US medium-security prison.
      *   **Constraints:**
          *   US context still has mandatory minimums and zero parole credit for participation.
          *   Must include a concrete 90-day evaluation clause.
          *   Must take seriously the strongest objection: Halden works due to Norway's welfare state/social trust, not just architecture; importing architecture without welfare state = cosmetic penal welfarism/boutique prison.
          *   Must engage the issue of coerced rehabilitation (forcing autonomy vs. restoring moral agency).
          *   No citations or reading lists.
          *   Reason it through.
          *   Treat the losing side honestly.
          *   End with a fixed bottom line ("Verdict: [recommendation]").
      *   **Tone:** Professional, deliberative, decisive, ethical.

  2.  **Deconstruct the Issue:**
      *   **The Proposal:** A "dignity wing" (Halden-style) inside a standard US prison (Riverside).
      *   **The Goal:** Rehabilitation through environmental design (normalcy, autonomy).
      *   **The Conflict:**
          *   *Pro:* Better conditions reduce violence, improve mental health, model pro-social behavior.
          *   *Con (Structural):* It's still prison. Mandatory minimums remain. No parole incentives. It's "window dressing" on a punitive system.
          *   *Con (Philosophical):* Coercion. Can you force someone to be autonomous? Does "mandatory rehabilitation" contradict the goal of moral agency?
      *   **The Specific Constraint:** US vs. Norway context (inequality, social trust).

  3.  **Evaluate Options:**
      *   *Approve:* Ignores the valid criticism that this is cosmetic. Risks legitimizing the broader punitive system without changing outcomes (release dates, recidivism linked to structural barriers).
      *   *Reject:* Acknowledges the structural hypocrisy but denies immediate relief to inmates who would suffer less violence/trauma in this wing. Throws out a potential data point.
      *   *Approve-with-Conditions:* Allows the pilot but explicitly acknowledges the limitations. Uses the pilot to test *specific* metrics beyond just "inmate satisfaction." Addresses the coercion issue. Sets a sunset clause based on evaluation.

      *Decision:* **Approve-with-Conditions** is the most responsible governance choice. It allows for data collection and immediate harm reduction while acknowledging the structural limits. However, the conditions must be sharp to address the "cosmetic" critique.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly.
      *   **The Structural Objection (Norway vs. US):** Acknowledge that architecture isn't magic. Halden works because society accepts ex-convicts. Here, they leave prison to the same barriers. *Counter:* Better conditions inside still matter for safety and human rights, even if release conditions don't change. But we must admit this doesn't solve mass incarceration.
      *   **The Coercion Objection:** Can you mandate autonomy? If participation is forced, is it rehabilitation or just compliance? *Resolution:* The wing should focus on *environmental* autonomy (choice in daily living) rather than *programmatic* coercion. But since parole credit is zero, the incentive structure is broken.
      *   **The 90-Day Evaluation Clause:** Needs to be concrete. Not just "is it nice?" but "does it reduce violence?" "does it improve staff-inmate relations?" "does it create tension with the general population?"
      *   **Treating the Losing Side:** Acknowledge that rejecting this protects against legitimizing a broken system, but approving it (with conditions) prevents wasting an opportunity to learn and reduce harm.
      *   **Bottom Line:** Fixed verdict.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Approve-with-Conditions" too weak?
      *   *Adjustment:* Make the conditions hard. If the evaluation shows it's just cosmetic, the wing reverts or shuts down. Acknowledge that without parole incentives, the "rehabilitation" claim is dubious.
      *   *Coercion Point:* Be careful here. The prompt says "zero parole credit for participating." This means participation is effectively voluntary regarding release, but maybe mandatory for placement? The prompt says "forcing inmates into 'autonomy-building' programs." I need to address whether *this* pilot forces participation. The prompt implies the wing exists within a system of mandatory minimums. I should recommend that participation in specific programs within the wing be voluntary, even if placement is selective.
      *   *Norway Objection:* This is the heavy hitter. I need to admit that this wing will not reduce recidivism on its own because post-release support is missing. The metric shouldn't be "recidivism" in 90 days (impossible), but "institutional violence" and "psychological metrics."
      *   *Tone Check:* Ensure I'm not sounding like a cheerleader for the prison industrial complex. Acknowledge the "boutique prison" risk.

  6.  **Finalizing the Memo Structure:**
      *   **Subject:** Recommendation on Riverside "Dignity Wing" Pilot.
      *   **Recommendation:** Approve with Conditions.
      *   **Rationale 1: The Structural Limit (Norway vs. US):** Admit the critique is right. Architecture isn't policy. But harm reduction inside is still valid.
      *   **Rationale 2: Coercion & Agency:** Distinguish between environmental autonomy and programmatic coercion.
      *   **Evaluation Clause:** Specific metrics (violence, grievances, staff injury, mental health incidents).
      *   **Conclusion:** The Verdict.

  7.  **Drafting the Content (incorporating the "Treat the losing side honestly" instruction):**
      *   I need to explicitly state why the "Reject" argument is morally weighty (it exposes the hypocrisy).
      *   I need to explain why "Approve" wins out (immediate harm reduction + data).

  8.  **Final Polish:** Check constraints. No citations. 90-day clause concrete. Fixed bottom line.

      *(Self-Correction on 90-day clause)*: 90 days is short for recidivism. It must be operational metrics. Violence, infractions, staff turnover, inmate grievances.

      *(Self-Correction on Coercion)*: The prompt asks to engage whether coerced rehabilitation undermines moral agency. I should argue that *environmental* dignity supports agency, but *mandated programming* undermines it. The condition should be that programming within the wing is voluntary.

      *(Self-Correction on Verdict)*: Make sure the final line matches the required format.

  9.  **Final Review against Prompt:**
