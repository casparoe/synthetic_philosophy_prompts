answer: |-
  1. **The Principle**

  1.  **Intrinsic Status:** An individual's moral status is determined primarily by the richness of the conscious repertoire they actually sustain. *(Forced by C, D, I-1)*
  2.  **Protective Membership:** If an individual belongs to a biological kind that typically sustains a higher repertoire, they retain that higher status despite impairment, provided their condition is a deviation from that kind's norm rather than a definition of a new kind. *(Forced by G, J)*
  3.  **Active Potential:** Dormant capacity counts for nothing; only an active developmental trajectory towards higher capacity grants provisional status. *(Forced by E, F)*
  4.  **Capacity Override:** If an individual of a lower-status kind achieves a higher repertoire through modification or engineering, their status rises to match that repertoire. *(Forced by H)*

  ***

  2. **Table of Cases**

  | Case | Your Verdict | Principle Agreement | Disagreement / Cost of Acceptance |
  | :--- | :--- | :--- | :--- |
  | **A** | Human > Chimp | **Agree** | None. Human repertoire exceeds Chimp. |
  | **B** | Pea-brain < Human | **Agree** | None. Low repertoire yields low status. |
  | **C** | Whale = Human | **Agree** | None. Size irrelevant; repertoire matches human. |
  | **D** | Alien = Human | **Agree** | None. Repertoire matches human; size/energy irrelevant. |
  | **E** | Reserve = No Gain | **Agree** | None. Dormant neurons are not active potential. |
  | **F** | Infant $\ge$ Chimp | **Agree** | None. Infant has active trajectory (Part 3). |
  | **G** | Microcephalic = Full Human | **Agree** | **Cost:** Requires accepting 'biological kind' as a moral shield, which risks speciesism if not carefully bounded by Part 2. |
  | **H** | Enhanced Chimp = Full Human | **Agree** | None. Repertoire overrides kind (Part 4). |
  | **I-1** | Shrinking Adult = No Loss | **Agree** | None. History/Identity preserves status despite size loss. |
  | **I-2** | Shrinking Fetus = Loss | **Disagree** | **Principle says:** If this 'version of you' is human, Part 2 grants full status. **Cost:** To save your verdict, we must treat I-2 as a 'new kind' (Part 2 exception), implying congenital design changes negate protective membership. |
  | **J** | Dementia Human > Dog | **Agree** | **Cost:** Relies entirely on Part 2 (Protective Membership). If Part 2 is rejected, status equals the dog. |

  ***

  3. **Verdicts on New Cases**

  *   **Collective Mind (1 million small animals):** **High Status.** Under Part 1, the locus of moral weight is the conscious repertoire. If the collective realises human-grade sophistication, the collective entity holds human-level status, regardless of the individual insects' status.
  *   **Neuron-by-Neuron Emulation:** **High Status.** Under Part 1 and D, substrate is irrelevant. If the functional organisation sustains the human repertoire, the status is human.
  *   **Human with One Hemisphere Removed:** **High Status.** Under Part 1 and I-1, actual repertoire is the metric. Since deficits are mild, the repertoire remains human-range; status is unchanged.
  *   **Species with 10x Neurons (Human Range):** **Equal Status.** Under Part 1 and C, surplus physical capacity that does not expand the conscious repertoire confers no additional moral weight.
  *   **Human in Temporary Coma:** **High Status.** Under Part 1 (clause 'but for reversible interference'), the trajectory is intact. Status is preserved during the interruption.
  *   **Engineered Pig (Human Repertoire):** **High Status.** Under Part 4 (Capacity Override), the achieved repertoire trumps the biological kind. To deny this would be to privilege biology over experience, contradicting H.

  ***

  4. **Analysis of Irreconcilable Pairs**

  *   **E vs F (Unused Potential):** This is **only about words**. You distinguish 'dormant reserve' (E) from 'developmental trajectory' (F). My Principle Part 3 codifies this distinction. Active growth counts; passive storage does not. There is no genuine conflict here.
  *   **G vs H (Species vs Capacity):** This is a **genuine conflict**. G asserts that human biology protects status even when capacity falls. H asserts that capacity grants status even when biology is non-human.
      *   **Which to overturn:** I would overturn the *reasoning* behind **G**.
      *   **Why:** H is morally robust because it ties status to the ability to suffer and flourish (the conscious repertoire). G relies on a 'kind membership' shield. While socially useful, it is philosophically fragile. If the Enhanced Chimp (H) counts, the Microcephalic Human (G) should count *only* because their repertoire (human two-year-old) is valued higher than a chimp's, or because of social duties (see Section 5), not because 'human' is a magic category. If G's repertoire were truly identical to the chimp's in A, consistency demands their status align.
  *   **G vs I-2 (Congenital Impairment):** This is a **genuine conflict**. Both are humans with reduced capacity from early development.
      *   **Which to overturn:** I would overturn **I-2**.
      *   **Why:** I-2 is a thought experiment that strips away social recognition. G is a real person. If we accept Part 2 (Protective Membership), a human with a congenital deficit is still a 'damaged human', not a 'new kind'. To say I-2 has reduced status implies that moral standing depends on whether the impairment is viewed as a pathology (G) or a design feature (I-2). This is a distinction without a moral difference for the subject. Consistency demands that if G is protected by human kind, I-2 must be too.

  **What a principle saving all ten would look like:**
  To save all ten, you would need a **Hybrid Historical-Relational Principle**. It would state: *Status is intrinsic to capacity, but for members of the human species, status is relational to the moral community.* This principle would grant G and J high status because they are 'ours' (social membership), while denying I-2 high status because it is a hypothetical construct outside the moral community.
  **Complexity Cost:** This buys consistency at the price of admitting that 'moral status' is not a single property. It is two different things: one based on sentience (for aliens, animals, uploads) and one based on social kinship (for impaired humans). You would have to accept that you are a speciesist regarding your own kind, but a capacity-ist regarding others.

  ***

  5. **Non-Status Factors**

  Several of your verdicts appear driven by factors other than the intrinsic moral weight of the individual's interests.

  *   **Case G (Microcephalic Human) & Case J (Dementia Human):**
      *   **Factor:** **Expressive/Symbolic Meaning.**
      *   **Explanation:** Your reluctance to experiment on G or J, despite their reduced repertoire, likely stems from what harming a *human* body signifies about our respect for human life generally. It is a duty to the *concept* of humanity, or to the memories of the person J used to be, rather than the current interests of the organism.
  *   **Case A (Human vs Chimp):**
      *   **Factor:** **Epistemic Caution.**
      *   **Explanation:** You note you are 'less comfortable than I used to be'. This suggests uncertainty about the chimp's true interior life. The weight given to the human may be inflated by our ability to communicate with them, rather than a proven difference in moral status.
  *   **Case F (Infant vs Chimp):**
      *   **Factor:** **Special Duties of Care.**
      *   **Explanation:** The higher status granted to the infant may reflect the specific obligations parents and society have to their own young (kin selection/social contract), rather than a claim that the infant's intrinsic interests objectively outweigh the chimp's.
  *   **Case J (Dementia Human):**
      *   **Factor:** **Biographical Identity.**
      *   **Explanation:** You may be protecting the *past* person who inhabited that body. This is a duty to the deceased (the former adult), not the current subject (the dementia patient).

  **Summary:** Your discomfort in G, J, and partly A is likely not about the *status* of the current organism, but about the **symbolic cost to the moral community** and **duties arising from past relationships**. If you strip these away, your underlying capacity-based principle (Part 1) becomes much cleaner, though it requires hardening your heart on G and J to match H.
