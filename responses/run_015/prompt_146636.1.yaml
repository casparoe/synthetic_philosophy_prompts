answer: |-
  **Project Title:** The Epistemology of "Right But Early": Distinguishing Dormancy, Preemption, and Degeneration in Long-Run Forecasts

  **1. Statement of the Question**
  Long-run quantitative forecasts (e.g., resource depletion, population ceilings, climate tipping points) frequently miss their initial predicted windows without being declared falsified. Proponents invoke a "right but early" defense, but this category currently functions as an epistemic black box: it absorbs both valid postponements and theoretical degeneration.

  This project asks: **Under what formal conditions is the "right but early" verdict rationally available for a long-run prediction whose test window has not closed, and can those conditions be operationalized to yield determinate verdicts on historical cases?**

  Specifically, I seek to disentangle three distinct states currently conflated under "right but early":
  1.  **Dormancy:** The trigger variable has not crossed the threshold; the theory remains static and untested.
  2.  **Preemptive Uptake (The Cassandra Dividend):** The prediction was believed and acted upon, thereby averting the outcome.
  3.  **Auxiliary Drift (Mechanism-Swap):** The original causal mechanism is quietly replaced to fit new data, retaining only the original vocabulary.

  The goal is to move from a binary (True/False) evaluation to a *status* evaluation that assigns credibility costs to postponements and distinguishes valid refinement from degenerative rescue.

  **2. Why Existing Resources Do Not Settle This**
  Current frameworks lack the resolution to score unresolved, long-horizon predictions:
  *   **Lakatosian Research Programmes:** The progressive/degenerating distinction is too coarse. It offers a vocabulary for the *outcome* of a debate but provides no rates or metrics for the *process*. It cannot distinguish a "hard" rescue (new data) from a "soft" rescue (redefining the trigger).
  *   **Bayesian Updating:** Standard updating treats a missed date as a likelihood reduction. However, it lacks a penalty for *structural modification*. If a forecaster moves the date from 2000 to 2050 *and* changes the underlying mechanism, naive updating treats this as a single hypothesis update, ignoring the "cost" of the modification.
  *   **Forecasting Scoring Rules:** Metrics like Brier scores or calibration plots require event resolution. They are silent on the "unresolved window" case, which is precisely where policy decisions are currently being made.
  *   **Counterfactual History:** While historians discuss "what if," there is no standardized protocol for weighing the evidential value of a "near miss" (e.g., a region that hit the resource ceiling vs. the global aggregate that did not).

  **3. Methodology and Approach**
  I will develop a scoring framework for unresolved predictions through four integrated steps:

  *   **(A) Taxonomy Construction:** I will formalize the three categories (Dormancy, Preemptive Uptake, Auxiliary Drift) using a small-N selection of canonical cases (Malthusian traps, Limits to Growth, Simon-Ehrlich wager). The definitions will hinge on *invariance*: Dormancy requires the model structure to remain identical; Preemptive Uptake requires evidence of policy causality; Auxiliary Drift is identified by changes to the causal mechanism that are not independently motivated.
  *   **(B) The Credibility Cost Function:** I will attempt to derive a principled "penalty factor" for postponement. When a predicted date slips or a trigger is re-specified, credibility should decay. I will test whether this decay can be modeled non-arbitrarily—e.g., as a function of the *specificity* of the original claim. A precise date slip costs more than a vague "by the end of the century" slip.
  *   **(C) Sub-Global "Near-Miss" Analysis:** To avoid the noise of global aggregates, I will probe dormant theories on the units that got closest to the trigger. For example, rather than asking if global metals ran out, I will examine specific markets or regions where scarcity actually bound. This tests whether the *mechanism* holds locally even if the global prediction is dormant.
  *   **(D) Hindcast Validation:** I will run the framework as if it were 1800, 1900, 1975, and 2000. The framework must license the verdicts we now accept (e.g., that certain 1970s depletion models were degenerative, while others were merely early). If the framework yields indeterminate results in the hindcast, it fails.

  **4. Deliverables**
  *   **Journal Article:** A methodological paper proposing the "Unresolved Forecast Status" framework, applying it to the selected historical cases, and presenting the hindcast validation.
  *   **Policy Memo:** A "Rescue Protocol" for institutions issuing long-run forecasts (e.g., climate adaptation units, central banks). This protocol would recommend pre-registering auxiliary hypotheses: specifying in advance which model adjustments count as legitimate refinement and which constitute a reset of the forecast clock.

  **5. Honest Assessment of Risks and Failure Conditions**
  My referee will ask where this could go wrong. I anticipate three specific failure modes:
  *   **The Arbitrariness Trap:** The "Credibility Cost" function may not have a principled derivation. If the penalty for moving a date from 2020 to 2030 cannot be grounded in something other than expert stipulation, the quantitative aspect of the project fails.
  *   **The Indistinguishability Problem:** In practice, Dormancy and Auxiliary Drift may be observationally equivalent until the event resolves. If the hindcast shows that historical cases were decided by non-epistemic factors (e.g., institutional prestige, tenure) rather than the epistemic markers I identify, the taxonomy collapses into case-by-case judgment.
  *   **The Cassandra Verification Gap:** Proving "Preemptive Uptake" requires a counterfactual (the policy wouldn't have happened without the forecast). If this cannot be evidenced historically, this category becomes unfalsifiable and must be discarded.

  **6. Scope and Cuts**
  This is a six-month, part-time project. If scope creep threatens the core deliverable:
  *   **First Cut:** The mathematical derivation of the "Credibility Cost Function." If a principled formula proves elusive, I will replace it with a qualitative decision tree. The taxonomy and the policy protocol are more valuable than a forced metric.
  *   **Second Cut:** The number of historical cases. I will prioritize the Hindcast Validation over the breadth of the case studies. It is better to have a robust test on three cases than a weak test on ten.
  *   **Hold Firm:** The Policy Memo. The primary value of this research to my current role (forecast evaluation) is the "Rescue Protocol." Even if the academic theory is incomplete, a standardized protocol for managing forecast revisions is a viable standalone output.

  **7. Dependency**
  You asked what the dependency is tracking if the answer isn't "it depends." The verdict depends on **informational invariance**.
  *   If the *mechanism* is invariant but the *timing* shifts → **Dormancy** (Valid).
  *   If the *timing* shifts and the *mechanism* shifts without new exogenous data → **Auxiliary Drift** (Invalid).
  *   If the *outcome* is averted and the *policy intervention* is causally linked to the forecast → **Preemptive Uptake** (Valid, but high evidential bar).

  The project succeeds if it can make these distinctions operational rather than rhetorical.
