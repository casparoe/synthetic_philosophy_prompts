answer: |-
  **Bottom line**

  Your committee isn't failing at metaphysics; you're succeeding at pragmatics. There is no single consistent theory of identity underlying museum practice because artifacts aren't natural kinds like electrons. They are social entities defined by a bundle of traits: causal history, material continuity, and cultural function. Your colleague is largely correct: "original" is a shorthand for "the item with the correct provenance and uninterrupted institutional custody," not a metaphysical claim about matter. However, dismissing metaphysics entirely is risky. Matter matters when it comes to sacred objects or forensic evidence, where physical contact carries weight beyond history. The inconsistency you see isn't confusion; it's flexibility. You switch between valuing matter and valuing history depending on the stake—insurance, aesthetics, or human rights. The cost of picking one rigid theory would be breaking the museum's ability to function across these different domains. Your loan agreement's mix of accession number and description is actually the smartest tool you have; it separates the legal entity from the physical state.

  **The implicit theory**

  The working theory is best described as "Historical Individualism with Material Constraints." An artifact is not identical to its atoms, nor is it just a shape. Instead, it is a continuous history of events. When conservators replace a marble arm, they preserve the causal chain; the object persists because the change was gradual and intentional, maintaining the narrative thread. The accession number tracks this history, not the mass. This explains why a bronze cast is a copy: it lacks the causal link to the artist's hand, even if the form is identical. It also explains building repair: replacing boards maintains the functional continuity of the structure, whereas demolition breaks the causal chain.

  However, matter isn't irrelevant. It acts as a constraint. You can replace some parts, but not all at once. If you swap everything instantly, history breaks. This is why demolition fails but board-by-board repair succeeds. The theory presupposes that identity is gradable, not binary. An object can be "more itself" after conservation if the intervention stabilizes its history. Crucially, this view treats the object as a legal and narrative construct as much as a physical one. The loan agreement defining "the Object" by accession number and description acknowledges this dual nature. The number tracks the legal entity; the description tracks the physical manifestation. When they diverge significantly, you have a crisis not because the metaphysics broke, but because the narrative no longer matches the evidence. The museum operates on the assumption that identity is maintained by stewardship, not just physics. This allows you to insure the "idea" of the object while conserving the "stuff" of the object.

  **What's strictly presupposed vs. what merely fits**

  Strictly presupposed is provenance. Without a documented causal history, you cannot distinguish an original from a perfect forgery, regardless of matter. You also presuppose that institutions have the authority to maintain this history through accessioning. What merely fits is the specific threshold of material replacement. There is no metaphysical law dictating that 51% original matter is required. The practice of keeping removed fragments fits the theory but isn't demanded by it; if history were all that mattered, you could discard the old arm. You keep it because matter provides evidence of that history.

  Your colleague's claim that we don't need a metaphysics of constitution is mostly robust. We don't need to decide if the statue *is* the bronze. We only need to decide if *this* bronze counts as *that* statue for insurance and care. However, the "no metaphysics" view struggles when science intervenes. If destructive testing consumes the matter, is the data the object? Here, matter is presupposed as the carrier of truth. So, while you don't need a theory of persistence, you do need a theory of evidence, which relies on material integrity. Also, note that your verdict on buildings rests partly on legal statute (listing criteria), not just metaphysics. The law demands continuity of fabric for status, which aligns with your theory but isn't caused by it.

  **The hard cases**

  The Ise Shrine and the 3D print repatriation offer reveal where Historical Individualism hits a wall. Ise isn't an object persisting through time; it's a ritual performance repeating through time. Its identity is liturgical, not material. Calling it "1,000 years old" refers to the tradition, not the timber. Your policy shouldn't treat Ise like a Roman bust; it's a different category of entity entirely. The rebuilding is the preservation method, not a threat to identity.

  The 3D print offer fails not because of identity metaphysics, but because of relational value. For source communities, the object's power often resides in its specific material history—contact with ancestors, blood, soil, or specific crafting events. A scan captures form, not history. Offering a print is an insult because it treats the object as information, whereas the community treats it as a relative or a sacred vessel. Matter matters here because of what it touched, not what it looks like. Your current practices look inconsistent here because you are applying a Western conservation model (preserve the aesthetic form) to a context requiring a relational model (preserve the connection). The scan is "preservation" for you (data security); it is "erasure" for them. Furthermore, your claim about "digital preservation" is often marketing fluff; formats obsolesce, but matter persists. You cannot resolve this with a single identity theory. You must acknowledge that for some stakeholders, the matter is non-fungible, regardless of causal history.

  **If we switched theories**

  If you adopted strict materialism (object = atoms), conservation stops. Any glue or filler creates a new object. You would store fragments as the "real" work and display piles of dust. Insurance would cover only the original mass. If you adopted strict historicism (object = story), you could display replicas freely as long as the story is told, undermining visitor trust and market value.

  Practically, sticking to your current flexible bundle is best. However, clarify your loan agreements. The accession number should define the legal entity; the condition report should define the material state. If they diverge too much, deaccession and reaccession. Don't try to solve the Ship of Theseus; just document where you draw the line for each class of object. Stop pretending the 3D print is the object for repatriation purposes. Admit it's a surrogate. This honesty costs nothing metaphysically but saves significant political capital. You would stop keeping boxes of fragments only if you stopped caring about evidence, which you won't. You would start listing replicas differently, perhaps as "interpretive aids" rather than "objects."
