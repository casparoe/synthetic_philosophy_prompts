  ### Classification Instrument: The Precautionary Logical Space

  **Instructions:** Answer the following seven questions regarding the specific cases provided. Follow the branching path to your classification leaf. Do not worry about the name of the view; answer based on your intuition about the case.

  **Q1. The Status Quo Risk (Gene-Drive Case)**
  In the malaria gene-drive release, suppose refusing the release guarantees continued high mortality from malaria, while releasing it carries a small, unknown risk of ecosystem collapse. Does the precautionary constraint forbid the *release* even if *inaction* also carries catastrophic risk?
  *   **Yes:** Go to **Q2**.
  *   **No:** Go to **Q3**.

  **Q2. Reflexivity (Gene-Drive Case Follow-up)**
  If you answered Yes to Q1 (the principle forbids action even if inaction is risky), does the principle also forbid the *implementation of the principle itself* if that implementation (e.g., a regulatory bureaucracy) carries its own catastrophic institutional risks?
  *   **Yes:** **Leaf A (Symmetric Precaution)**.
  *   **No:** **Leaf B (Paralysis/Contentless)**.

  **Q3. The Epistemic Threshold (Compute Pause Case)**
  In the statutory pause on training models, suppose the probability of catastrophe is unknowable (not just imprecise, but undefined), but the *possibility* is non-zero. Does this mere possibility justify a halt, regardless of the massive economic benefits or the vanishingly small likelihood?
  *   **Yes:** **Leaf C (Strict Maximin)**.
  *   **No:** Go to **Q4**.

  **Q4. The Information Value (Evaluation Filing Case)**
  In the duty to file evaluation results, suppose that filing and pausing deployment prevents the collection of real-world data that would resolve the uncertainty and prove safety. Do you still require the pause?
  *   **Yes:** **Leaf D (Static Precaution)**.
  *   **No:** **Leaf E (Adaptive/Learning Precaution)**.

  **Q5. The Object of Irreversibility (Liability Insurance Case)**
  In the requirement for developer liability insurance, suppose the physical harm from a model is fully compensable (reversible), but the insurance requirement permanently alters the industry structure to favor incumbents (irreversible institutional settlement). Does the principle apply?
  *   **Yes:** **Leaf F (Institutional Precaution)**.
  *   **No:** Go to **Q6**.

  **Q6. The Mechanism (Weight Publication Ban Case)**
  Regarding the ban on publishing weights that lower biological skill barriers: Does the principle mandate the *outcome* (the ban must happen) or merely the *process* (the burden of proof shifts to the publisher to show safety)?
  *   **Process Only:** **Leaf G (Procedural Precaution)**.
  *   **Mandated Outcome:** Go to **Q7**.

  **Q7. The Foundation (Climate Field Trial Case)**
  In the small outdoor field trial of climate intervention: If the trial is safe but was authorized without global public consent, is the primary violation that it causes *harm* or that it lacks *authority*?
  *   **Lacks Authority (Consent):** **Leaf H (Legitimacy Precaution)**.
  *   **Causes Harm:** Go to **Q8**.

  **Q8. The Distribution (Weight Publication Ban Case Follow-up)**
  Regarding the ban on publishing weights: Do the losses to *identifiable* researchers now (who cannot work) outweigh the potential safety gains for *statistical* people in the future (who might be harmed by bioterrorism)?
  *   **Identifiable Now > Statistical Future:** **Leaf I (Distributive/Anti-Precaution)**.
  *   **Statistical Future ≥ Identifiable Now:** **Leaf J (Rio/Ambiguity Proportionality)**.

  ***

  ### The Leaves: Views and Awkward Commitments

  *   **Leaf A (Symmetric Precaution):** Precaution applies to precaution; we must be careful about being too careful.
      *   *Awkward Commitment:* It may require randomization between action and inaction to avoid biasing risk toward the status quo.
  *   **Leaf B (Paralysis/Contentless):** The principle forbids any choice where catastrophic risk exists, including inaction.
      *   *Awkward Commitment:* It renders all decision-making impossible, making the principle a rhetorical weapon rather than a guide.
  *   **Leaf C (Strict Maximin):** The worst-case scenario dominates decision-making regardless of probability.
      *   *Awkward Commitment:* It forbids life-saving technologies (like the gene-drive) because the *possibility* of disaster exists, even if disaster is less likely than the disease.
  *   **Leaf D (Static Precaution):** Safety requires halting deployment even if halting prevents learning.
      *   *Awkward Commitment:* It prefers permanent ignorance to temporary risk, potentially locking in higher long-term danger.
  *   **Leaf E (Adaptive/Learning Precaution):** Precaution requires gathering information to reduce uncertainty, even via controlled risk.
      *   *Awkward Commitment:* It permits experiments that could fail catastrophically in the name of reducing the probability of future catastrophe.
  *   **Leaf F (Institutional Precaution):** The principle guards against locking in political or market structures, not just physical harms.
      *   *Awkward Commitment:* It may block efficient safety regulations (like insurance) because they cement industry power dynamics.
  *   **Leaf G (Procedural Precaution):** The principle shifts the burden of proof but dictates no specific outcome.
      *   *Awkward Commitment:* It may legitimize a catastrophe if the correct process was followed, or forbid a safe technology if the process was flawed.
  *   **Leaf H (Legitimacy Precaution):** The core violation is unauthorized decision-making, not harm.
      *   *Awkward Commitment:* It permits a harmful action if properly authorized by consent, and forbids a safe action if imposed benevolently.
  *   **Leaf I (Distributive/Anti-Precaution):** Identifiable present victims weigh heavier than statistical future victims.
      *   *Awkward Commitment:* It sacrifices future generations to protect the current privileges of identifiable researchers or developers.
  *   **Leaf J (Rio/Ambiguity Proportionality):** Measures must be proportional to the risk, weighting ambiguity but allowing trade-offs.
      *   *Awkward Commitment:* It requires assigning quasi-probabilities to unknown unknowns, effectively pretending we know what we admit we do not.

  ***

  ### Empty Cells: Logical Possibilities, Empirical Vacancies

  Although the tree routes users to the leaves above, the logical space defined by these questions permits combinations that no serious theorist occupies.

  1.  **The "Maximin Learner" (Q3=Yes + Q4=No):**
      *   *Combination:* One holds that mere *possibility* of catastrophe forbids action (Maximin), yet also holds that one should *deploy* to gather data (Adaptive).
      *   *Status:* **Incoherent.** You cannot forbid an action because it *might* be catastrophic while simultaneously requiring that action to prove it isn't. This cell is empty because it violates the basic logic of risk aversion; nobody defends a rule that forbids the leap while demanding the jump to check the ground.
  2.  **The "Institutional Proceduralist" (Q5=Yes + Q6=Process):**
      *   *Combination:* One believes the principle applies to irreversible *institutional* settlements (like liability structures) but insists the principle only mandates a *process* (burden shift), not an outcome.
      *   *Status:* **Unattractive/Neglected.** If the harm is structural lock-in (Q5=Yes), a mere process shift (Q6=Process) is usually seen as insufficient to prevent the lock-in. Theorists who care about institutional irreversibility tend to demand substantive blocks (Leaf F), while proceduralists tend to focus on physical harm. Nobody bothers here because the remedy contradicts the diagnosis.

  ***

  ### Limitations and Epistemic Position

  **Indistinguishable Pairs:**
  This instrument cannot reliably separate **Leaf J (Rio/Ambiguity Proportionality)** from **Ambiguity-Aversion Reductionism**. Both views answer Q3=No (probability matters) and Q8=Statistical Future. In practice, a theorist who claims to be "reducing PP to Expected Utility plus ambiguity penalties" will answer the case questions identically to a theorist who claims to follow the "Rio Declaration." The distinction is metaphysical (is it *really* utility?) rather than operational (what do you *do*?). I have merged them into Leaf J because your students' case judgments will not reveal the difference.

  **Confidence and Redraw Triggers:**
  *   **High Confidence:** The separation of **Procedural (Leaf G)** from **Substantive (Leaf J/I)**. The burden-of-proof question (Q6) is the most robust predictor of how a theorist writes about the principle.
  *   **Low Confidence:** The placement of **Legitimacy (Leaf H)**. I am less confident that "Consent" is orthogonal to "Harm." A theorist might argue that lack of consent *is* a harm. If a student argues that Q7 is a false dichotomy, the tree collapses. I would redraw Q7 if I encountered a robust "Epistemic Justice" view that treats lack of consent as a form of epistemic harm rather than a procedural violation.
  *   **Likely Misclassification:** The instrument is most likely to misclassify **Leaf E (Adaptive)** theorists as **Leaf J (Rio)**. An Adaptive theorist might answer Q4=No (don't pause if it kills learning) but still be a strong precautionist. The tree routes them away from the "Strong" leaves. A student who believes in "controlled exposure" to reduce risk might be sorted into Proportionality, even if they view themselves as radical precautionaries.

  **Epistemic Position:**
  I am an AI language model; I do not hold normative views. However, in constructing this tree, I have prioritized *operational distinctness* over *theoretical purity*. I am confident that the questions map to *behavioral* differences in governance (e.g., pause vs. file vs. ban). I would give up the distinction between **Leaf D (Static)** and **Leaf C (Maximin)** if presented with a case where a Maximin theorist accepts learning; currently, I map them separately based on the standard literature's assumption that Maximin forbids the risk of experimentation. If your reading group finds a "Maximin Learner," the tree requires a new branch for *Epistemic Risk*.

  **Bias Check:**
  You noted a lean toward Procedural versions (Leaf G). I have ensured Leaf G has a specific "Awkward Commitment" (legitimizing catastrophe via process) to prevent it from appearing as the "sensible middle." The tree does not route "moderate" answers to Proceduralism by default; one must explicitly choose "Process Only" at Q6, which is a distinct philosophical commitment, not a fallback position.
