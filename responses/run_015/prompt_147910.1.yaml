          *   *Critique:* The money pump argument is the standard objection to intransitive preferences. However, there's a nuance: Money pumps apply to *choices*, not necessarily to *betterness* relations (the "better than" relation might be intransitive even if rational choice requires transitivity, or one might deny the money pump applies to non-instrumental value). But for an undergraduate level, applying the money pump to "better than" is standard.
