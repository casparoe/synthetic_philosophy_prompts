          *   *Overall:* It's a competent essay. It understands the mechanics. It identifies the standard objections. It has a clear structure. The main weakness is the handling of the implications of rejecting premise 4 (ignoring that it leads to the Repugnant Conclusion) and a slight conflation of "no worse than" with "equal to" in part (a) (though defensible).

