answer: |-
  There is no single, canonical term in the political science or sociology literature that captures this entire feedback loop in one phrase. However, your observation sits at the intersection of three well-established conceptual frameworks: **Policy Feedback Theory**, **Critical Welfare State Analysis**, and **Performative Measurement**.

  While you might be tempted to adopt the phrase **"Institutional Tautology"** (which is analytically precise), the phenomenon is usually disaggregated in the literature into specific mechanisms. To help you position your argument, here is how existing concepts map onto your observation, where they fall short, and how you might distinguish your specific contribution.

  ### 1. The Closest Existing Concepts

  **A. Structural Creaming (vs. Street-Level Creaming)**
  *   **The Concept:** "Cream skimming" usually refers to *street-level bureaucrats* (caseworkers) selecting the easiest clients to meet performance targets.
  *   **The Fit:** Your example describes **Statutory** or **Structural Creaming**. The "skimming" is baked into the legislation (the 12-month rule) rather than left to discretion.
  *   **The Gap:** "Creaming" describes the *selection mechanism*, but it does not inherently capture the *retrospective justification*. It explains why the vulnerable are excluded, but not why that exclusion is subsequently used as data to prove the policy's success or the vulnerability's "naturalness."

  **B. Interpretive Policy Feedback**
  *   **The Concept:** Developed by scholars like Joe Soss and Paul Pierson, this theory argues that policies do not just distribute resources; they distribute *information*. They teach citizens and officials about their status, rights, and capacities.
  *   **The Fit:** This captures the **justification loop**. The policy teaches analysts and the public that "stable workers" are the legitimate recipients and "unstable workers" are outside the framework.
  *   **The Gap:** Feedback theory is broad. It describes the *effect* of policy on politics, but doesn't always name the specific *evaluative tautology* where the policy's failure to reach a group is reinterpreted as that group's inherent unsuitability.

  **C. Performative Measurement / Performativity**
  *   **The Concept:** Drawing from economic sociology (e.g., Michel Callon), this suggests that economic models and metrics do not just describe reality; they *enact* it.
  *   **The Fit:** This captures the **ontological shift**. The eligibility rule doesn't just measure labor-market attachment; it *manufactures* a specific version of it. The data produced is not a reflection of the labor market, but a reflection of the policy's geometry.
  *   **The Gap:** This is often used in finance or market studies. Applying it to family policy requires bridging the gap between "market enactment" and "welfare legitimation."

  ### 2. Distinguishing from Common Terms

  To do the conceptual work you need, you must distinguish your observation from three common terms that are often misapplied to this scenario:

  | Term | Why it is insufficient for your argument |
  | :--- | :--- |
  | **Selection Bias** | **Epistemological vs. Institutional.** Selection bias is a statistical error to be corrected (e.g., via randomization). Your phenomenon is a **political feature**. The bias is not a mistake in the analysis; it is the *intended function* of the design that generates political legitimacy. |
  | **Cream Skimming** | **Discretionary vs. Statutory.** Cream skimming implies an agent (a caseworker) making a choice to game the system. Your example is **rule-based exclusion**. No one is "skimming"; the structure is simply impermeable to the vulnerable. |
  | **The Matthew Effect** | **Outcome vs. Mechanism.** The Matthew Effect ("the rich get richer") describes the *distributional outcome*. It does not explain the *evaluative logic* that justifies the inequality. Your observation is about how the inequality is *rationalized* through data, not just that it exists. |

  ### 3. Proposed Terminology

  Since no single term captures the *design*, the *exclusion*, and the *retrospective justification* simultaneously, you have two options:

  **Option A: Adopt "Constitutive Exclusion"**
  This term (rooted in critical theory and boundary work) suggests that the policy *constitutes* the category of the "deserving worker" by excluding the "undeserving."
  *   *Usage:* "The policy operates through **constitutive exclusion**: the eligibility gate does not merely filter applicants, it constructs the 'successful recipient' category by filtering out the very instability the policy claims to address."

  **Option B: Refine "Institutional Tautology"**
  Your intuition to use "tautology" is strong. In the literature on **activation policies** (welfare-to-work), scholars sometimes refer to this as a **"Self-Validating Design."**
  *   *Usage:* "This creates a **self-validating exclusion loop**. The eligibility criteria manufacture a recipient pool pre-disposed to success, and the resulting data is then cited as proof that the criteria are necessary."

  ### 4. The Conceptual Work of the Distinction

  Distinguishing this from ordinary selection bias does three specific things for your argument:

  1.  **Shifts Blame from Statistics to Politics:** It moves the critique from "the analysts calculated the impact wrong" (a technical fix) to "the policy was designed to generate this specific result" (a political fix).
  2.  **Exposes the "Ideal Worker" Norm:** It highlights that the policy is not neutral. It assumes the **Ideal Worker Norm** (continuous, full-time employment) is a natural precondition for care, rather than a political choice that disadvantages caregivers.
  3.  **Reveals the Legitimation Function:** It shows that the *evaluation* of the policy is part of its *function*. The "success" of the policy is not actually employment continuity; the success is the **legitimation of labor-market conditionality**.

  ### Recommendation for Your Writing

  If you want to anchor this in existing literature while claiming your specific nuance, I recommend framing it as a form of **"Interpretive Policy Feedback"** driven by **"Structural Creaming."**

  However, if you want a punchy, specific term for the *loop itself*, **"The Legitimation Loop"** or **"Self-Validating Exclusion"** is likely your strongest contribution. You might write:

  > "While often dismissed as simple selection bias, this dynamic is better understood as **self-validating exclusion**. Unlike statistical bias, which obscures the truth, this institutional tautology *produces* a truth: it manufactures data that naturalizes the exclusion of unstable workers, transforming a policy design failure into evidence of the recipients' inherent employability."

  This phrasing allows you to acknowledge the statistical reality (selection) while pivoting to the institutional mechanism (tautology/legitimation) that is often overlooked in standard policy evaluation.
