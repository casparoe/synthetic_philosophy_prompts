answer: |-
  # The Boundary Problem: A Logical Decision Tree
  **Class Handout | Demos Formation**

  Below is a map of the logical space for membership. Don't look for names yet; look for the commitments. Follow the branches down to see where your intuition lands you. Note: there are two "ghost leaves" (unoccupied positions) where the logic holds but nobody really wants to go.

  **START:** Can membership apply to entities that dont experience welfare (no sentience/interests)?

  *   **NO** (Must be sentient) → *Go to Node 2*
  *   **YES** (Welfare not required) → *Go to Node 1.5*

      **Node 1.5:** Is this an artificial agent that is persistently governened but has no welfare interests?
      *   **YES** → **LEAF 1: Non-sentient AI governed by law**
          *   *Status:* **Incoherent.** Granting membership without interests creates rights without a rights-holder. Mostly sci-fi for now.
      *   **NO** (e.g., rivers, corporations, rocks) → **LEAF 2: Non-sentient Objects/Nature**
          *   *Status:* **Excluded.** Standard view. These might be protected *by* the demos, but aren't *of* it.

      **Node 2:** For sentient entities: Is being subjected to coercive law *neccessary*, or is being causally affected enough?
      *   **AFFECTED IS ENOUGH** → *Go to Node 3*
      *   **SUBJECTION NECESSARY** → *Go to Node 4*

      **Node 3:** Does the "affected" interest include future generations who cannot consent?
      *   **YES** → **LEAF 3: Future-only affected**
          *   *Status:* **Ugly.** Normatively compelling but practically unworkable (infinite regress of representatives).
      *   **NO** (Current interests only) → **LEAF 4: All-Affected-Interests (AAI)**
          *   *Position:* Anyone whose interests are causally impacted by a decision gets a vote. Maximally inclusive, potentially borderless.

      **Node 4:** Does physical territory trump legal status (i.e., does presence alone bind you)?
      *   **YES** → *Go to Node 5*
      *   **NO** (Legal tie matters more) → *Go to Node 6*

      **Node 5:** Is the territorial tie based on permanent residence or temporary presence?
      *   **PERMANENT** → **LEAF 5: Territorial-only (Residents)**
          *   *Position:* Only full-time residents belong. Tourists and expats are out.
      *   **TEMPORARY/OCCUPIED** → **LEAF 6: Subjected Transients**
          *   *Position:* Anyone physically under the state's coercive apparatus (including occupied populations) counts, regardless of citizenship.

      **Node 6:** Can shared nationality substitute when neither territory nor direct subjection holds (e.g. for expats)?
      *   **YES** → **LEAF 7: Co-nationalist**
          *   *Position:* The demos is an ethnic or cultural community. Borders follow the nation, not the state.
      *   **NO** (Need a concrete tie) → *Go to Node 7*

      **Node 7:** Is the tie to the state automatic (by law) or contingent (by stake/contribution)?
      *   **AUTOMATIC** → **LEAF 8: All-Subjected (AS)**
          *   *Position:* If the law binds you, you belong. Strict legal subjection.
      *   **CONTINGENT** → **LEAF 9: Stakeholder**
          *   *Position:* Membership requires a specific stake (e.g., paying taxes, long-term investment).

      **Node 8:** (Sub-branch of Subjected) Does the entity lack legal capacity (children, incapacitated)?
      *   **YES** → **LEAF 10: Incapacitated Subjects**
          *   *Position:* Included in the demos (protected interests) but represented via guardians. Highlights the difference between *membership* and *voting*.

  ***

  **⚠️ SEPARATION FLAG:**
  The tree struggles to cleanly seperate **Leaf 8 (All-Subjected)** and **Leaf 9 (Stakeholder)** in specific cases.
  *   *The Problem:* A tax-paying expat is subject to some laws (tax codes) and has a stake (financial), but isn't territorially present.
  *   *The Glitch:* Under **All-Subjected**, they might be included because tax law coerces them. Under **Stakeholder**, they are included because they pay. The logical distinction collapses here unless you define "coercion" very narrowly (criminal law only) or "stake" very broadly (emotional attachment). Expect this overlap on the exam.
