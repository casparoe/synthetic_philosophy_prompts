answer: |-
  **1. The Distinction**
  The relevant contrast is normative-explanatory, not causal or counterfactual. The distinction lies in whether the intervener features in the actual explanatory basis of the agent's deliberation. In the threat case, the gunman constitutes a coercive reason; even if idle, his presence alters the normative landscape and enters the agent's actual reasoning as a justification for compliance. In the Frankfurt case, the monitor is explanatorily inert; it plays no role in the agent's actual deliberation or reasons. Rival formulations fail. Causal efficacy cannot distinguish them because both interveners are causally idle in the actual sequence; neither triggers the action. Counterfactual dependence fails because, in both cases, the agent performs the action for her own reasons in the actual sequence, and the intervener's absence would not necessarily change the actual outcome, only the safety conditions. Only the normative-explanatory status captures why the threat diminishes responsibility while the monitor does not: one coerces the will, the other merely backs it up.

  **2. The Variants**
  The intuitive difference between the near-trigger and slack variants is real, not an artifact. It tracks the robustness of the actual sequence. In the slack variant, the agent's reasons securely cause the action, distant from the intervention point. In the near-trigger variant, the actual sequence is fragile; a minor perturbation would have invoked the intervener. This suggests responsibility requires not just an uncoerced actual sequence, but one that is robustly reasons-responsive. This gives the leeway theorist a sophisticated reply: they can argue that what matters is not metaphysical leeway per se, but the robustness of the agent's control. If the actual sequence is too fragile, the agent's ownership of the action is compromised. This consideration does not assume determinism is true, but if determinism is true, robustness must be understood as stability within the causal chain rather than branching possibilities. The variance in pull indicates that proximity to intervention subtly undermines the purity of the actual sequence, suggesting PAP is not the only intuitive driver of responsibility judgments.

  **3. The Upshot**
  These cases refute the Principle of Alternative Possibilities as a necessary condition, but show that the kind of alternative whose absence matters is narrower than the principle's surface form suggests. Responsibility survives when alternatives are removed by a counterfactual blocker, provided the actual sequence is uncoerced and robust. The third variant, where the monitor blocks only refraining but leaves a genuine choice between two actions, tests this boundary. Here, the agent has some alternatives (Action A or B) but not others (refrain). If she is responsible, it confirms that specific alternative possibilities are not required, only an uncoerced actual sequence. However, if the lack of refraining options diminishes responsibility, it suggests some leeway is valuable. Ultimately, the cases show PAP is false, but responsibility depends on the actual sequence being both uncoerced and sufficiently robust against perturbation. The leeway theorist survives by narrowing their claim: not all alternatives matter, but the robustness of the actual sequence, which often correlates with available leeway, is essential.
