          *   *Nuance:* Blurs line between syntax and semantics.
      *   *Position 3 (Info in Relationship/Decoder):* Code is in the machinery.
          *   *Compiler Analogy:* The semantics are defined by the CPU/OS, not the text file. The "compiler" holds the dictionary.
          *   *Nuance:* Separation of concerns.
      *   *Position 4 (Degenerate/Context-Dependent):* Not a strict code.
          *   *Compiler Analogy:* Overloaded functions, context-sensitive grammars, undefined behavior depending on hardware state.
          *   *Nuance:* Non-determinism, polymorphism.

  3.  **Drafting the Translations (Iterative Process):**

      *   *Pos 1:* "DNA is a static lookup table." Like a hardcoded enum mapping to function pointers.
