prompt: |-
  I'm a compiler engineer. I work daily with the distinction between source code and object code, the compiler and the interpreter, the type system and the runtime, syntax and semantics, and the difference between a language specification and its implementation. I'm not a biologist, but I've been trying to make sense of the philosophy of biology debate over whether DNA is a "code," and I want you to restate the main positions in my vocabulary—as faithfully as you can—and then tell me what doesn't survive the translation.

  The positions I want translated, one by one:
  1. The view that DNA is a code in the strong sense: a mapping between signals (nucleotide sequences) and meanings (amino acid sequences, or regulatory effects), where the mapping is fixed and context-independent.
  2. The view that DNA is not a code but a set of instructions: a "program" or "recipe" whose "meaning" is its effect when executed by the cellular machinery, not a fixed mapping.
  3. The view that the "information" is not in the molecule itself but in the relationship between the molecule and the cellular machinery: the "code" is in the decoder, not in the "source."
  4. The view that the genetic code is degenerate (multiple codons map to the same amino acid) and context-dependent (the same sequence can have different effects in different cellular contexts), so it's not a code in the strict sense.

  For each position, tell me: what translates cleanly into my compiler vocabulary, what has to be distorted to fit, and what has no expression at all. Then give me the residue report: which parts of the debate map cleanly onto how compilers and languages work, which parts you had to fudge, and whether anything in the philosophers' disagreement has no counterpart in my framework.

  And here's the key question, on which I want you to commit: I have an intuition that the "DNA is a code" debate is mostly a debate about (a) whether the "compiler" (the cellular machinery) is a fixed artifact or an evolved, context-dependent system, and (b) whether the "meaning" of the "source code" (the DNA sequence) is fixed by a "language spec" (the genetic code) or by the entire "runtime" (the cellular context). Is that intuition right, or am I missing something? Take a definite position: is DNA a code, in the sense that matters for the debate, and why? Don't lay out the options and leave it to me—commit to an answer and defend it, and say which of the four positions above you think is closest to the truth and which you think are wrong and why.
