      *   *Nuance:* It's not just "no desire." It's usually "no *unwholesome* desire" or "no *attachment*." In Buddhist philosophy (a common source for tranquilism), there's a distinction between *tanha* (craving/clinging) and *chanda* (intention/volition).
      *   *Axiology:* Is it maximizing the *amount* of absence? Or is it about the *quality* of the state of the subject? Usually, it's about the welfare of the subject, not just the abstract metric.

  3.  **Address Worry 1: The Paradox of Striving (Second-Order Craving):**
      *   *The Worry:* To want tranquility is to crave it. If craving is bad, wanting tranquility is bad.
      *   *The Correction:* This conflates *craving* (attachment/clinging) with *intention* or *preference*.
      *   *Philosophical Distinction:* Many tranquilist frameworks (especially Buddhist-inspired ones) distinguish between *tanha* (thirst/craving rooted in ignorance/ego) and *chanda* (wholesome intention/direction). One can intend to be tranquil without *craving* it in the sense of being distressed by its absence.
      *   *Instrumental vs. Intrinsic:* The desire for tranquility is instrumental. Once achieved, the instrument is discarded (like a raft crossing a river). The state itself is not maintained by *craving* to maintain it, but by *wisdom* or *habituation*.
