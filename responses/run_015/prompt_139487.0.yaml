prompt: |-
  I work in the clinical effectiveness team of a large NHS trust, and four times a year I put a report in front of the board that decides where a small improvement team is sent next. I keep hitting the same problem in a form I have never seen it usefully explained in: the combined figures say an intervention worked, the figures split by ward say it did not, or the other way round, and I then have to tell a room of non-specialists which number to act on. I have been reading about this on my own and I think I follow the basic idea of Simpson's paradox, but two things still defeat me. First, one of our statisticians keeps saying that splitting by a variable the intervention itself changes — whether a patient was well enough to be seen by the therapy team, for instance — can manufacture a reversal rather than uncover one, so that the combined figure is the honest one; I cannot tell in advance which kind of variable I am splitting by. Second, it seems to matter whether the board will act trust-wide or ward-by-ward, and I do not know how to make that a step in the rule rather than an excuse afterwards.

  Please turn this into a written procedure my team can run in an afternoon, using only the numbers we already hold, and which a clinical director can sign off on and lay governors can follow. Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops and tells me to use the combined figures, where it tells me to stratify, and where it hands the decision back to people because what is unsettled is what we are trying to do rather than what the data say. Please mark clearly which steps are arithmetic that nobody disputes and which rest on views that are genuinely contested among people who study this, so I do not present a contested reading to the board as if it were agreed.

  Then run it on three cases from our last cycle: a discharge pathway whose apparent reduction in thirty-day readmissions disappears entirely once you split by admitting specialty; a virtual ward scheme I argued for, whose benefit shows up only in the combined figures and not within any age band; and a sepsis screening tool where the only split available is by whether the patient reached the resuscitation bay, which the screening itself affects. I would rather you told me plainly if one of these has no answer the procedure can defend.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analysis:

  1.  **Analyze the User and Request:**
      *   **User:** Works in the Clinical Effectiveness team of a large NHS Trust.
      *   **Task:** Produces quarterly reports for the Board to decide where improvement teams are deployed.
      *   **Problem:** Encountering Simpson's Paradox (aggregate data says $X$, stratified data says $Y$). Needs to explain to non-specialists (Board, Governors) which number to trust.
      *   **Specific Confusions:**
          1.  *Collider Bias/Post-Treatment Bias:* A statistician warned against splitting by variables affected by the intervention (e.g., "well enough to be seen"). The user doesn't know how to identify these variables in advance.
          2.  *Decision Context:* It matters whether the intervention is applied trust-wide or ward-by-ward, but this isn't built into the decision rule.
      *   **Requirements:**
          *   A written procedure runnable in an afternoon.
          *   Uses existing data only.
          *   Sign-off ready (Clinical Director) and understandable (Lay Governors).
          *   Clear ordering of questions.
          *   Clear stop/go points (Combined vs. Stratified vs. Escalate).
          *   **Crucial:** Distinguish between *arithmetic/factual* steps and *contested/interpretative* steps.
          *   Apply the procedure to three specific cases provided.
          *   Be plain about cases where the procedure cannot defend an answer.

  2.  **Deconstruct the Statistical/Methodological Issues:**
      *   **Simpson's Paradox:** Occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined. Usually due to a confounding variable (unequal group sizes/weights).
      *   **The Statistician's Warning (Collider Bias):** If you condition on a variable that is *caused* by the treatment (a mediator or collider), you block the causal path or introduce bias. Example: Treatment $\to$ "Well enough" $\to$ Outcome. Splitting by "Well enough" hides the treatment effect.
      *   **The Decision Context:** If the policy is "One size fits all" (Trust-wide), the Average Treatment Effect (ATE - combined) is usually relevant. If the policy is "Targeted" (Ward-specific), the Conditional Average Treatment Effect (CATE - stratified) is relevant.
      *   **Causal Diagrams (DAGs):** The gold standard for deciding what to adjust for, but the user says they only have "numbers we already hold" and need an "afternoon procedure." I cannot ask them to draw DAGs with causal experts. I need a heuristic based on *timing* and *logic* that approximates causal reasoning without requiring a PhD in econometrics.

  3.  **Drafting the Procedure (The "Trust-Wide Decision Protocol"):**
      *   *Goal:* Make it actionable, transparent, and honest about uncertainty.
      *   *Structure:*
          *   Phase 1: The Arithmetic (Undisputed).
          *   Phase 2: The Variable Check (The Statistician's Warning).
          *   Phase 3: The Decision Context (Board's Mandate).
          *   Phase 4: The Recommendation.
      *   *Labeling:* Must clearly mark [Fact] vs. [Judgement].

      *   *Step 1: Check for Reversal.* (Arithmetic). Is there actually a paradox?
      *   *Step 2: Timing of the Split Variable.* (Logic/Judgement). Did the variable exist *before* the intervention started?
          *   If Yes (Baseline characteristic like Age, Ward, Specialty): Safe to stratify.
          *   If No (Process variable like "Seen by team", "Reached Bay"): Dangerous to stratify. Stick to combined.
      *   *Step 3: Decision Scope.* (Policy). Is the Board deciding on a universal rule or local allocation?
          *   Universal $\to$ Combined (ATE).
          *   Local $\to$ Stratified (CATE).
      *   *Step 4: Sample Size/Stability.* (Arithmetic). Are the subgroups too small?
      *   *Step 5: Escalation.* If Step 2 is ambiguous, flag it.

  4.  **Refining the Procedure for the User's Constraints:**
      *   The user needs to distinguish between "Contested" and "Agreed."
      *   *Agreed:* Arithmetic, Timing (Pre vs. Post treatment is a standard causal inference rule).
      *   *Contested:* How much weight to give small subgroups, whether "Ward" is truly exogenous (staffing levels might change due to intervention). I need to be careful here.
      *   *Key Distinction:* Pre-treatment covariates (Confounders) vs. Post-treatment variables (Mediators/Colliders).
      *   *Heuristic:* "The Snapshot Test." Was this data point fixed before the patient entered the pathway?

  5.  **Applying to the Three Cases:**

      *   **Case 1: Discharge Pathway (Readmissions split by Admitting Specialty).**
          *   *Observation:* Combined = Good. Stratified = Null.
          *   *Variable:* Admitting Specialty.
          *   *Timing:* Pre-treatment (Patient arrives with a condition, assigned specialty, *then* discharge pathway applies).
          *   *Analysis:* This is a confounder. Different specialties have different baseline readmission risks. If the intervention was rolled out more in low-risk specialties, the combined data looks good falsely.
          *   *Verdict:* Stratified is likely the "truth" for effectiveness, but Combined is the "truth" for overall trust impact. *Wait, if stratified shows null, the intervention didn't work within specialties.* The combined effect is likely due to case-mix imbalance.
          *   *Recommendation:* Do not scale. The combined figure is misleading due to case-mix.

      *   **Case 2: Virtual Ward (Benefit in Combined, Null in Age Bands).**
          *   *Observation:* Combined = Good. Stratified = Null.
          *   *Variable:* Age Band.
          *   *Timing:* Pre-treatment.
          *   *Analysis:* Classic Simpson's. If the virtual ward took mostly low-risk (young) patients, combined looks good. If within every age band there is no difference, the intervention *itself* has no effect.
          *   *Verdict:* Stratified is the honest measure of clinical efficacy. Combined is a measure of selection bias.
          *   *Recommendation:* Do not scale.

      *   **Case 3: Sepsis Screening (Split by "Reached Resus Bay").**
          *   *Observation:* User didn't specify the direction, but the issue is the *split variable*.
          *   *Variable:* "Reached Resus Bay".
          *   *Timing:* Post-treatment (The screening tool is designed to *cause* faster/safer transfer to Resus).
          *   *Analysis:* This is the Statistician's warning. Conditioning on a mediator/collider. If the tool works, more people reach Resus. If you only look at those who reached Resus, you might be comparing severe cases in the control group (who only got there because they were crashing) vs. moderate cases in the intervention group (who got there because of the screen).
          *   *Verdict:* **DO NOT SPLIT.** This is collider bias.
          *   *Recommendation:* Use Combined figures. The split is invalid.

  6.  **Review against Constraints:**
      *   *Afternoon run?* Yes, it's a checklist.
      *   *Existing numbers?* Yes, relies on metadata about the variables (timing), not new data collection.
      *   *Sign-off ready?* Needs clear formatting.
      *   *Mark Contested vs. Agreed?* I will use specific icons or bold text to denote this.
      *   *Plain about "No Answer"?* Case 1 and 2 might have a clear answer (Stratified), Case 3 has a clear answer (Combined). But I need to acknowledge that *why* the paradox exists (case mix vs. selection) is interpretative.
      *   *Wait, Case 1 & 2 nuance:* If stratified shows *no effect*, but combined shows *positive*, it usually means the intervention was applied to easier cases. The *effectiveness* is null. The *impact* is positive only because of selection. For an improvement team, we care about effectiveness. So Stratified wins for Pre-treatment variables.
      *   *Decision Context:* The user mentioned "Trust-wide vs Ward-by-ward". If the Board wants to know "Should we fund this trust-wide?", they need the ATE (Combined) *if* the rollout is random. But if rollout wasn't random, Combined is biased.
      *   *Correction:* In QI (Quality Improvement), we often lack randomization. If the split variable is a *confounder* (Pre-treatment), Stratified is the unbiased estimate of the *clinical effect*. Combined is the biased estimate of the *program effect* (including selection bias). For clinical effectiveness, we usually want the clinical effect.
      *   *Refinement on Procedure:* I need to make sure the "Decision Context" step doesn't override the "Bias" step. You can't choose a biased number just because it fits a policy. You must correct for bias first.

  7.  **Finalizing the Procedure Structure:**
      *   **Title:** Trust-Wide Data Interpretation Protocol (Simpson's Paradox & Stratification).
      *   **Section 1: The Arithmetic Check (Undisputed).**
      *   **Section 2: The Variable Timing Test (Mostly Agreed, Some Nuance).**
      *   **Section 3: The Policy Scope Test (Contested/Political).**
      *   **Section 4: Final Recommendation Logic.**
      *   **Case Studies:** Apply the logic rigorously.

  8.  **Self-Correction on "Contested":**
      *   Is "Pre-treatment vs Post-treatment" contested? Among causal inference experts, no. Among general managers/statisticians in the NHS? Sometimes, because "Post-treatment" isn't always obvious. I will label the *application* of the rule as requiring judgement, but the rule itself as standard statistical practice.
      *   The "Policy Scope" is definitely contested. Some argue you always report the ATE (Combined). Others argue you report the CATE (Stratified) if heterogeneity exists. I will frame this as "What question is the Board asking?"

  9.  **Drafting the Content:** (Mental check of the specific cases).
      *   *Case 1 (Specialty):* Specialty is baseline. Stratified is correct. Intervention likely didn't work; case-mix drove the combined result.
      *   *Case 2 (Age):* Age is baseline. Stratified is correct. Intervention didn't work; selection drove the combined result.
      *   *Case 3 (Resus):* Resus arrival is post-treatment. Combined is correct. Splitting creates bias.

      *Wait, one nuance:* In Case 1 & 2, if the stratified results are null but combined is positive, it implies the intervention was targeted at low-risk groups. If the Board asks "Did this improve the Trust's metrics?", the Combined is the *historical truth*. If they ask "Will this work if we force it everywhere?", the Stratified is the *predictive truth*. The procedure must distinguish these questions.

      *Revised Plan:* The procedure must ask: "Are we evaluating *past performance* or *future potential*?"
      *   Past Performance (Did we game the metrics?) $\to$ Combined (with caveats).
      *   Future Potential (Will it work if we scale?) $\to$ Stratified (if pre-treatment).
      *   Actually, for Clinical Effectiveness, "Future Potential" is usually the goal. I will steer towards Stratified for Pre-treatment confounders.

  10. **Final Polish:** Ensure tone is professional, NHS-appropriate (GMC/CQC aligned), and honest about limitations. Ensure the distinction between "Arithmetic" and "Judgement" is visually clear.

      *(Self-Correction during drafting)*: I need to be careful not to overpromise. Simpson's paradox isn't just about bias; it's about weighting. If the subgroups are tiny, stratification is noisy. I need a "Sample Size" check.

      *(Final check on Case 3)*: If the split is by "Reached Resus", and the intervention *causes* people to reach Resus, splitting by this variable is conditioning on a collider/mediator. This induces bias. The combined figure is the only valid one for the *total* effect. I must be very firm here.

      *(Final check on Case 1 & 2)*: If the split is by baseline characteristics (Specialty, Age), and the results reverse, it means the allocation was non-random. The stratified estimate is the unbiased causal effect. The combined estimate is confounded. For an improvement team deciding where to send resources *next*, they need the unbiased causal effect. So Stratified wins.

      *Wait, what if the Board wants to know "Did we save money overall"?* Then Combined matters. But the prompt says "decides where a small improvement team is sent next." This implies future allocation based on efficacy. Stratified is better for efficacy.

      Okay, ready to write. I will structure the response with the Procedure first, then the Case Applications. I will use bolding and boxes to distinguish the "Agreed" vs "Contested" elements as requested.cw
answer: |-
  # Trust-Wide Data Interpretation Protocol (Simpson's Paradox & Stratification)

  **Version:** 1.0 (Draft for Clinical Effectiveness Team)  
  **Purpose:** To determine whether Board decisions on improvement team deployment should rely on combined (aggregate) data or stratified (split) data when the two contradict.  
  **Time Required:** < 4 Hours per report cycle.  
  **Data Required:** Existing routine datasets (no new collection).

  ---

  ## Part 1: The Decision Procedure

  This procedure is divided into three phases. Steps marked **[ARITHMETIC]** are factual and indisputable. Steps marked **[JUDGEMENT]** rely on statistical conventions that are standard but require clinical context; these must be explicitly signed off.

  ### Phase 1: The Arithmetic Check (Undisputed)
  *Goal: Confirm a contradiction actually exists and is not noise.*

  **Step 1.1: Confirm the Reversal**
  *   **Action:** Compare the direction of the effect in the Combined Data vs. the Stratified Data.
  *   **Question:** Does the intervention show benefit in the Combined Data but harm/null in *all* (or weighted majority of) Strata, OR benefit in Strata but harm/null in Combined?
  *   **Pass Criteria:** Yes, the direction reverses or significance disappears completely upon splitting.
  *   **Status:** **[ARITHMETIC]**
  *   *If No:* Stop. Use the significant figure. No paradox exists.

  **Step 1.2: Check Subgroup Stability**
  *   **Action:** Count the $N$ (number of patients) in each stratum.
  *   **Question:** Does any stratum contain fewer than 30 events (e.g., 30 readmissions, 30 deaths)?
  *   **Pass Criteria:** All strata have $N > 30$.
  *   **Status:** **[ARITHMETIC]**
  *   *If No:* **STOP.** The stratified figures are statistically unstable. You must use the **Combined Figures** and note the data is too sparse to split. Report this limitation to the Board.

  ---

  ### Phase 2: The Variable Timing Test (Standard Statistical Practice)
  *Goal: Determine if splitting the data introduces bias.*

  **Step 2.1: The "Snapshot" Test**
  *   **Action:** Identify the variable used to split the data (e.g., Ward, Age, Specialty, "Seen by Team").
  *   **Question:** Was the value of this variable fixed **before** the patient entered the improvement pathway?
      *   *Examples of YES (Pre-Treatment):* Age, Gender, Admitting Specialty, Home Postcode, Ward of Admission (at time of referral).
      *   *Examples of NO (Post-Treatment/Process):* "Seen by Therapy", "Reached Resus Bay", "Length of Stay > 3 days", "Discharged Home".
  *   **Status:** **[JUDGEMENT]** *(Note: While the definition is standard, classifying complex clinical pathways can be contested. Document your reasoning.)*

  **Step 2.2: Apply the Bias Rule**
  *   **If YES (Pre-Treatment):** Splitting is **Safe**. It controls for case-mix differences.
  *   **If NO (Post-Treatment):** Splitting is **Unsafe**. This creates "Collider Bias" or "Post-Treatment Bias." The intervention itself likely changed who ended up in that group.
  *   **Status:** **[JUDGEMENT]** *(This is the specific point your statistician raised. It is agreed upon in causal inference literature but often misunderstood in operational reporting.)*

  **Decision Gate A:**
  *   If **Unsafe (NO)**: **STOP.** You must use the **Combined Figures**. The stratified figures are mathematically distorted by the intervention. Proceed to Phase 3, Step 3.2.
  *   If **Safe (YES)**: Proceed to Phase 3.

  ---

  ### Phase 3: The Policy Scope Test (Board Mandate)
  *Goal: Align the statistic with the decision to be made.*

  **Step 3.1: Define the Board Question**
  *   **Action:** Review the Terms of Reference for the Board committee.
  *   **Question:** Is the Board deciding on:
      *   **A)** A Universal Policy? (e.g., "Adopt this pathway Trust-wide.")
      *   **B)** Targeted Allocation? (e.g., "Send the improvement team to the wards that need it most.")
  *   **Status:** **[JUDGEMENT]** *(This is political/strategic, not statistical. It must be minuted.)*

  **Step 3.2: Select the Metric**
  *   **If Step 2.2 was Unsafe (Post-Treatment Variable):**
      *   **Select:** **Combined Figures.**
      *   **Reason:** Stratification is invalid.
      *   **Caveat:** You must report that the combined figure includes process effects.

  *   **If Step 2.2 was Safe (Pre-Treatment Variable) AND Question is A (Universal):**
      *   **Select:** **Stratified Figures (Weighted).**
      *   **Reason:** If the effect disappears in strata, the Combined figure is likely driven by selection bias (cherry-picking easy cases). A universal policy will not replicate the selection bias, so the Combined figure will not be replicated.
      *   **Status:** **[CONTESTED]** *(Some economists argue for Combined as the "Average Treatment Effect," but in QI without randomization, Stratified is the safer estimate of clinical efficacy.)*

  *   **If Step 2.2 was Safe (Pre-Treatment Variable) AND Question is B (Targeted):**
      *   **Select:** **Stratified Figures.**
      *   **Reason:** You need to know where the intervention works, not just if it worked on average.

  ---

  ## Part 2: Application to Last Cycle Cases

  Below is the application of the protocol to your three specific cases. You can copy this table directly into your Board paper appendix.

  | Case | Intervention | Split Variable | Step 2.1 (Timing) | Step 2.2 (Bias Risk) | Protocol Verdict | Plain English Explanation for Board |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Discharge Pathway** | Discharge Planning | Admitting Specialty | **Pre-Treatment** (Specialty assigned at admission, before pathway starts). | **Safe to Split.** | **Use Stratified.** | "The combined data looked good because the pathway was used more in specialties with naturally low readmission rates. Within each specialty, the pathway made no difference. If we roll this out Trust-wide, we should not expect the combined savings." |
  | **2. Virtual Ward** | Virtual Ward Scheme | Age Band | **Pre-Treatment** (Age is fixed before referral). | **Safe to Split.** | **Use Stratified.** | "The combined data looked good because the scheme selected younger, lower-risk patients. Within every age group, the scheme showed no benefit. The combined figure reflects who we selected, not how well the scheme works." |
  | **3. Sepsis Tool** | Sepsis Screening | Reached Resus Bay | **Post-Treatment** (The tool is designed to *cause* faster transfer to Resus). | **UNSAFE.** (Collider Bias) | **Use Combined.** | "We cannot split by 'Reached Resus' because the tool itself changes who gets there. Splitting hides the true effect. The combined figure is the only valid measure of whether the tool saves lives overall." |

  ---

  ## Part 3: Sign-Off and Escalation

  ### For the Clinical Director (Sign-Off)
  *I confirm that the classification of variables in Phase 2 reflects the clinical pathway logic.*
  *   **Signature:** ___________________
  *   **Date:** ___________________
  *   **Note on Contested Ground:** If Phase 3, Step 3.2 (Universal Policy) recommends Stratified over Combined, this rests on the view that **selection bias** is the greater risk than **effect heterogeneity**. This is the standard view for non-randomized QI data, but it is a judgement call.

  ### For the Lay Governors (Explanation)
  *If the procedure stops at Phase 2 (Unsafe Split):*
  > "The data split is misleading, like comparing apples to oranges. We must look at the total picture."

  *If the procedure stops at Phase 3 (Safe Split, Universal Policy):*
  > "The total picture looks good only because we tried this on easier patients first. To know if it works for everyone, we must look at the specific groups."

  ### When the Procedure Cannot Defend an Answer
  There is one scenario where this procedure will return **"ESCALATE TO BOARD"**:
  *   **Scenario:** The variable is **Pre-Treatment** (Safe to split), the Board wants a **Universal Policy**, BUT the Stratified results are **inconsistent** (e.g., Works in Ward A, Harms in Ward B).
  *   **Reason:** The protocol identifies *which* number is honest (Stratified), but it cannot tell you whether to implement a tool that harms some groups while helping others. This is an ethical/policy decision, not a statistical one.
  *   **Action:** Present the Stratified figures and explicitly state: *"The data shows the intervention is not uniformly safe. The Board must decide if the overall benefit justifies the local harm."*

  ---

  ## Specific Notes on Your Three Cases (For your internal preparation)

  **1. Discharge Pathway (Specialty Split)**
  *   **Verdict:** **Do not scale.**
  *   **Why:** Specialty is a classic confounder. Some specialties (e.g., Elective Ortho) have predictable discharges; others (e.g., Acute Medicine) do not. If the pilot was run mostly in Ortho, the combined readmission rate drops. But if it didn't work within Ortho *or* Medicine individually, the intervention is ineffective. The Combined figure is a lie of composition.
  *   **Board Message:** "The apparent success was due to *where* we tried it, not *what* we did."

  **2. Virtual Ward (Age Split)**
  *   **Verdict:** **Do not scale.**
  *   **Why:** This is the textbook definition of Simpson's Paradox driven by selection bias. Virtual Wards often "cream skim" (take the patients most likely to succeed). If the benefit vanishes within age bands, the clinical efficacy is zero.
  *   **Board Message:** "We selected low-risk patients. The scheme itself added no value over standard care for any age group."

  **3. Sepsis Tool (Resus Bay Split)**
  *   **Verdict:** **Trust the Combined Figures.**
  *   **Why:** This is the specific warning your statistician gave you. "Reaching Resus" is a **Mediator**.
      *   *Pathway:* Screening $\to$ Identification $\to$ Transfer to Resus $\to$ Survival.
      *   If you split by "Transfer to Resus," you are comparing:
          *   *Intervention Group:* Moderate patients transferred early (because of the screen).
          *   *Control Group:* Only the crashing patients transferred late (because they had no screen).
      *   The Control group in the "Resus" stratum will look much sicker and die more, making the Intervention look artificially good (or bad, depending on the direction). Or, conversely, if the screen saves people *before* they need Resus, the Resus group in the Intervention arm looks healthier.
      *   **Crucial:** You cannot condition on a downstream event.
  *   **Board Message:** "Splitting by 'Reached Resus' breaks the causal chain. We must judge the tool on total mortality, not mortality within the resus group."

  ### Final Warning
  In Case 1 and 2, the procedure tells you to use the **Stratified** figures. This will likely tell the Board the intervention **did not work**. This may be unpopular. However, using the Combined figures would recommend scaling an ineffective intervention, which is a governance risk. The procedure protects you by documenting that the Combined figure is biased by case-mix (Phase 2, Step 2.2). Ensure this rationale is in the minutes.
