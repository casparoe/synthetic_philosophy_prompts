answer: |-
  1. Diagnosis of the confusion
  Your reasoning hinges on the presupposition that numerical distinctness requires asymmetric qualitative properties—such as one sphere having a unique relational profile compared to the other. You assume that because the relation "being distance $d$ from" is symmetric, it cannot ground distinctness without absolute positional facts. This assumption is fundamentally incorrect. Distinctness does not require *discernibility by monadic or asymmetric relational properties* (strong discernibility). It only requires *weak discernibility*: the existence of an irreflexive relation holding between them. Even in a relationalist framework, the statement "Sphere A is distance $d$ from Sphere B" implies $A \neq B$ because nothing is distance $d$ from itself (assuming $d > 0$). Your collapse objection fails because it conflates the inability to label objects uniquely with the inability for them to be numerically distinct. Relationalism denies absolute locations, not numerical plurality grounded in irreflexive spatial relations. The logic of identity is clearly preserved without absolute space.

  2. Relationalism and weak discernibility
  A relationalist can maintain there are two spheres without invoking absolute space by appealing to the very important distinction between strong and weak discernibility. Your worry assumes that without asymmetric properties (like "being left of"), distinctness is impossible. However, philosophers like Simon Saunders argue that objects are weakly discernible if they share all monadic properties but stand in an irreflexive relation. In Black's universe, the relation "being separated by distance $d$" (where $d > 0$) is irreflexive; no object is separated from itself by a positive distance. Therefore, the existence of this relation logically entails there are at least two relata. However, symmetry breaking is not required for numerical plurality. The relationalist crucially asserts that space is constituted by the relations between objects. If there is a relation of distance $d$, there must be distinct terms. To claim they simply collapse into one is to claim the relation holds reflexively, which contradicts the definition of distance. Thus, the relationalist accepts the plurality but denies that this plurality is grounded in hidden absolute positions. The spheres are distinct *because* they stand in this specific irreflexive relation, not because they occupy distinct absolute containers. This preserves relationalism while blocking the collapse: the ontology includes the objects and the relation, and the logic of irreflexivity guarantees $A \neq B$ without needing to say which is "first" or "left." Consequently, PII is either merely satisfied weakly (if relations count as properties) or refuted (if PII demands monadic differentiation), but the objects do not ultimately collapse.

  3. Black's argument and its metaphysical commitments
  Black's argument does not depend on spatial absolutism. His core claim is: we can conceive of a universe containing two distinct things that share every qualitative property. He uses the spheres to pump this intuition. When he asserts they are distinct, he relies on the logical possibility of plurality without qualitative difference. If you strip away absolutism and adopt relationalism, you do not vindicate the Identity of Indiscernibles (PII) in its strong form. Strong PII requires objects to have unique monadic or asymmetric relational profiles to be distinct. Black's scenario shows two objects lacking these profiles yet remaining distinct via weak discernibility. Therefore, even under relationalism, Black refutes strong PII. Your suggestion that relationalism forces a collapse assumes PII is true beforehand to judge the scenario's possibility. But Black's point is precisely that PII is false. The relationalist can agree there are two spheres (via irreflexive relations) while agreeing they share all qualitative *monadic* properties. Thus, Black's counterexample stands regardless of the absolute/relational debate. The metaphysical commitment is not to absolute space, but to the possibility of bare numerical diversity grounded in irreflexive relations rather than qualitative uniqueness. Absolutism is incidental; the refutation of strong PII is the core contribution.

  4. Bottom line
  Your worry does not succeed. Relationalism does not erase the distinction between the spheres because numerical distinctness is secured by weak discernibility through irreflexive spatial relations, not absolute positions. Black's scenario does not smuggle in absolutism; it relies on the logical coherence of pluralities without qualitative asymmetry. Consequently, the two-spheres case successfully refutes the strong version of the Identity of Indiscernibles, which demands unique qualitative profiles, but remains compatible with a weak version grounded in irreflexive relations. The spheres remain two, not one, even in a purely relational space. This clearly demonstrates that numerical diversity does not require qualitative individuality.
