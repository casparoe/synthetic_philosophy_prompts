      *   **The Counter-Counter (Standard Response):** The concept of *weak discernibility*. Even if they share all monadic properties and all symmetric relational properties, they stand in an *irreflexive* relation (being distinct from, or being at distance $d$ from, where $d > 0$). If $R(a, b)$ holds and $R$ is irreflexive (not $R(a, a)$), then $a \neq b$. This allows distinction without absolute space.
      *   **Black's Metaphysics:** Black usually presents the case in a way that assumes we can *count* them. He argues against PII by asserting our intuition that there are two. He doesn't necessarily need absolutism; he needs the possibility of distinct individuals sharing all qualitative properties.
