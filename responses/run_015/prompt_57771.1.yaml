answer: |-
  Here is the carving you asked for.

  ### The Name

  The single best fit for your situation is a **Schism in the Rule of Recognition**.

  If you need a term that sounds less like legal philosophy and more like a parliamentary procedure manual for your board members, you can call it **Constitutional Bifurcation**. But the first term is the precise structural diagnosis.

  It is **one name** for the overall state of affairs (the coexistence of two valid rule-books), though it is caused by two specific doctrinal mechanisms working in tandem: **Self-Embracing Entrenchment** (the amendment chain) and **Competence-Competence** (the Chair's ruling).

  ### The Carving: How It Differs from the Neighbors

  You have correctly identified that this is not a "Constitutional Crisis" in the political sense, nor is it a logical paradox like Gödel's. Here is exactly where the boundary lines lie.

  **1. Versus "Constitutional Crisis"**
  *   **The Neighbor:** A constitutional crisis is a *political* outcome where the system stops functioning (e.g., two people claim to be President, the army gets involved, or the courts are ignored). It describes the *mood* and the *risk*, not the *structure*.
  *   **Your Case:** You have a structural validity conflict that *could* lead to a crisis, but currently, it is just a conflict of validity. A crisis implies a breakdown of order; a Schism in the Rule of Recognition implies a *duplication* of order. You have two working systems, not zero.
  *   **The Boundary:** If people stop showing up to meetings or lock the doors, it's a Crisis. As long as both sides are citing valid-looking rules to justify their actions, it's a Schism.

  **2. Versus Hart's "Rule of Recognition" (General Concept)**
  *   **The Neighbor:** H.L.A. Hart's "Rule of Recognition" is the master rule that tells officials which rules count as law (e.g., "What the Queen in Parliament enacts is law"). Usually, this rule is stable and accepted by everyone.
  *   **Your Case:** Hart mostly discussed what happens when the Rule of Recognition *changes* (a revolution). He did not extensively map out what happens when it *splits* and two versions coexist peacefully for a time.
  *   **The Boundary:** A normal legal system has one Rule of Recognition. You have two competing ultimate criteria for validity (one saying "2/3 board vote rules," the other saying "4/5 membership vote rules"). When the ultimate tie-breaker fractures, it is a **Schism** in that rule.
  *   *Attribution Note:* Hart describes the *concept* of the Rule of Recognition in *The Concept of Law* (1961). The specific application to a "schism" or "fracture" where two systems coexist is more heavily developed by his successors (like Neil MacCormick) and legal pluralists. I am confident in the concept, but the specific phrase "Schism in the Rule of Recognition" is a theoretical extension of Hart, not a direct quote.

  **3. Versus the "Gödel-in-the-Constitution" Story**
  *   **The Neighbor:** This refers to a logical inconsistency where a system contains a rule that allows for its own destruction or creates a paradox (e.g., "This article cannot be amended" vs. "Any article can be amended"). It is about *logical possibility*.
  *   **Your Case:** Your problem is not logical; it is *hierarchical*. It is entirely logically possible to have two amendment chains. The problem is that there is no *meta-rule* to decide which chain wins.
  *   **The Boundary:** Gödel is about whether the system *can* exist without contradiction. Your problem is about which of two *existing* chains controls the present.

  **4. Versus "Manner and Form" (UK Parliament Acts)**
  *   **The Neighbor:** This is the closest legal relative. In the UK, the 1949 Act amended the 1911 Act using the 1911 Act's own procedures. The courts had to decide if that was valid.
  *   **Your Case:** The structural puzzle is identical. However, in the UK, there was a Supreme Court to issue a final ruling. They collapsed the schism by picking a winner.
  *   **The Boundary:** The "Manner and Form" debate is the *legal argument*. The **Schism** is the *state of having no court to settle the argument*. Because your bylaws make the Chair the judge, and the Chair is part of the dispute, you lack the external arbiter that resolved the UK version.

  **5. Versus "Competence-Competence" (The Chair's Ruling)**
  *   **The Neighbor:** This is a doctrine (mostly in arbitration law) asking: "Who has the authority to decide who has the authority?"
  *   **Your Case:** This is the *second layer* of your problem. The Board used Self-Embracing Entrenchment to change the rules. The Chair used Competence-Competence to validate the process.
  *   **The Boundary:** Competence-Competence explains why the Chair's ruling is contested. Self-Embracing Entrenchment explains why the Bylaws are contested. The **Schism in the Rule of Recognition** is the name for the *combined result*: two valid-looking authorities with no way to choose between them.

  ### Boundary Conditions: What Counts and What Doesn't

  For a situation to count as a **Schism in the Rule of Recognition**, three conditions must be met:

  1.  **Recursive Validity:** Both conflicting rule-books must be traceable back to the original text through a chain of steps that was valid *at the time the step was taken*. (In your case: The 2/3 vote was valid under the old rules; the 4/5 clause was valid under the rules at that time).
  2.  **No Internal Tie-Breaker:** The documents themselves must lack a neutral procedure to resolve conflicts about the documents' own validity. (Your bylaws punt this to the Chair, but the Chair's authority is now part of the conflict).
  3.  **Social Acceptance of Both:** There must be a significant body of "officials" (board members or households) accepting *each* version as the true one. If everyone agreed one side was wrong, it would just be a violation, not a schism.

  **Two Near-Misses (What Does Not Count):**

  1.  **Ambiguity Settled by Practice:** If the bylaws said "a majority vote" and didn't specify "of the board" vs. "of the membership," but for 20 years everyone understood it to mean "board," that is **Interpretive Custom**. It is not a schism because there is only one rule-book, just a vague one. Your text is not vague; the *validity* is contested.
  2.  **A Coup:** If the 2/3 majority had simply ignored the bylaws, locked the 4/5 supporters out of the building, and changed the locks, that is a **Revolution** or **Usurpation**. It is not a schism because one side is no longer operating within the system. A schism requires both sides to claim they are following the rules.

  ### Confidence and Attribution

  **Confidence Level:** 85%

  **Why not 100%?**
  Legal theory is notoriously messy about naming things. "Constitutional Crisis" is the common term, but as you noted, it's too broad. "Schism in the Rule of Recognition" is the most theoretically precise label for the *structure* you described, but it is academic jargon.

  **Attribution Check:**
  *   **H.L. Hart:** I am confident Hart established the "Rule of Recognition." I am less confident he used the specific phrase "Schism" to describe this exact scenario; he focused more on the *transition* from one rule to another. The application of his theory to a "split" is a standard interpretation by later scholars (like MacCormick or Raz), but I am flagging that the specific phrasing is an extrapolation of his work.
  *   **Competence-Competence:** This is a standard term in arbitration and constitutional law (German: *Kompetenz-Kompetenz*). I am confident in this attribution.
  *   **Self-Embracing Sovereignty/Entrenchment:** This is standard terminology in Commonwealth constitutional theory (Sir William Wade, etc.). I am confident in this attribution.

  ### Practical Advice (The "So What?")

  Since you asked for the name, you likely need to explain this to the board. Here is the translation:

  Tell them this is not a fight about who is right; it is a **Procedural Schism**. Explain that because the "referee" (the Chair) is part of the play, and the "rulebook" has two valid editions, there is no internal way to win.

  In the UK *Parliament Acts* case, the courts solved this. In the German Basic Law, the Constitutional Court solves this. In your CLT, you have no court.

  This means the "Schism" will only resolve in one of three ways:
  1.  **External Arbitration:** You agree to hire a neutral third party (a lawyer or mediator) and *contractually agree* to be bound by their ruling on which bylaw version is valid. This creates a new, temporary "Rule of Recognition" (the Mediator's decision).
  2.  **Political Collapse:** One side leaves or stops participating (a revolution).
  3.  **Negotiated Merger:** You draft a new set of bylaws that both sides sign, explicitly superseding both previous chains.

  Do not try to vote your way out of a Schism. Voting is the thing that broke the system. You need a new meta-rule to fix it.
