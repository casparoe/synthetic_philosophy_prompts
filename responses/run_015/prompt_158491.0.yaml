answer: |-
  In the 19th-century Osterman Officer Corps, the "Patronage Tithe" required junior lieutenants to remit thirty percent of their inheritance to their sponsoring Admiral, a custom enriching the high command for 150 years despite widespread published critiques labeling it corrosive to meritocracy and morale. The practice persisted because it cemented elite financial power and loyalty, rendering economic or logical appeals ineffective, until Admiral Kaelen, during a public inquiry, returned his Tithe and declared that accepting such funds transformed an Admiral from a "guardian of the state" into a "feudal rentier," instantly rendering the practice incompatible with the Corps' self-conception. Within a single generation, the Tithe vanished, not because the arguments against it were new, nor because it ceased to be profitable, but because the elite could no longer sustain the identity of "rentier" while claiming the honour of "guardian."

  ### Framework Predictions

  1.  **Rational Argument:** This framework predicts **stasis or glacial change**. Since the moral and practical arguments against the Tithe (meritocracy, morale) were available and circulated for a century without effect, pure rationalism cannot explain the sudden collapse. A rationalist must argue that the arguments were somehow "blocked" until now, but the speed of the change contradicts the expected slow accumulation of reason.
  2.  **Material Interest:** This framework predicts **persistence**. The Tithe transferred wealth from juniors to the elite Admirals. Abolishing it reduces the elite's income and weakens their patronage networks. Since the collapse occurs while the practice remains profitable, interest-based accounts fail to explain why the elite would voluntarily surrender economic advantage.
  3.  **Honour Dynamics (Appiah):** This framework predicts **rapid collapse following an identity shift**. Appiah argues that people are driven by "scripts" of honour and shame. Once Kaelen successfully re-categorized the Admirals not as "mentors" but as "rentiers" (a dishonorable identity), the social cost of the practice skyrocketed. The practice didn't become wrong; it became *shameful*. This aligns perfectly with the scenario's trigger.
  4.  **Williams' Skepticism:** Bernard Williams would agree with the *outcome* predicted by the honour account but reject the label of "moral progress." For Williams, this is not the triumph of reason or a step toward objective moral truth; it is merely a shift in the "thick ethical concepts" (guardian vs. rentier) that constitute the group's ethical life. He would argue that claiming this is "progress" is a retrospective rationalization; it is simply a change in what this specific group can psychologically sustain.

  ### The Structural Feature of Honour Dynamics

  The precise structural feature allowing honour dynamics to operate independently is the **public reclassification of the agent's identity rather than the act's consequences**. Rational argument targets the *act* (taking money is inefficient/unjust); Material interest targets the *outcome* (wealth transfer). Honour targets the *self* (who am I if I do this?). By shifting the label from "guardian" to "rentier," Kaelen made the cost of the practice social and existential (loss of status) rather than economic or logical. This bypasses the inertia of habit and profit because the pain of shame is immediate and public, whereas the pain of logical inconsistency is private and abstract.

  ### The Rationalist Counter-Attack

  A defender of the rational-argument view would attack this construction by contending that **the honour shift was itself the delayed product of prior rational persuasion**. They would argue that Kaelen's speech did not create the stigma ex nihilo; rather, a century of moral criticism slowly permeated elite culture, eroding the confidence of the Admirals until they were susceptible to Kaelen's reframing. In this view, the "honour" trigger was merely the tipping point of a long, subterranean process of rational moral education. The arguments didn't fail for 100 years; they were incubating, and the rapid collapse is simply the visible manifestation of a critical mass of belief finally being reached.

  ### Removing the Honour-Trigger

  If the honour-trigger feature is removed (i.e., Admiral Kaelen never speaks, or speaks but fails to reframe the identity, leaving the "guardian" self-image intact), **the collapse does not occur**. The Tithe persists.
  *   **Viable Accounts:** In this counterfactual, the **Material Interest** account becomes the primary viable explanation for the *persistence* of the practice (elites keep it because it pays). The **Rational Argument** account remains viable only if it posits that the arguments were insufficient to overcome self-interest. The **Honour** account explains the stasis by noting the absence of a conflicting identity script. Without the trigger, the scenario demonstrates that neither reason nor interest alone was sufficient to dismantle the institution, highlighting the necessity of the honour-based mechanism for the specific phenomenon of *rapid* abolition.
