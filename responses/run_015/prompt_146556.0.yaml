prompt: |-
  I was recently appointed to chair the enrollment-ethics review desk for psychiatric clinical trials at a university hospital, and I need a reusable decision procedure my staff can apply to any proposed study protocol. Our cases involve patients whose decision-making capacity fluctuates with symptom severity, and we frequently face family members—particularly in our large immigrant patient population—who strongly encourage or discourage enrollment in ways that blur the line between support and coercion. Please operationalize the philosophical conditions for valid consent—adequate disclosure without deception, absence of coercion, and competence—into a step-by-step procedure: the specific questions to ask in order, what counts as a sufficient answer at each stage, where the procedure stops with a rejection, and where it must hand the decision to a person because the question involves values rather than facts. The procedure must handle hard cases: therapeutic misconception in consent forms, culturally normative family influence that may be coercive, and competence assessments during partial remission. Constraints: my team has forty-eight hours per protocol, includes clinicians with no philosophy background, and requires both my sign-off and that of an independent patient advocate. Apply the procedure to three proposals: (1) enrolling acutely psychotic patients in a rapid-acting antipsychotic trial where family members actively advocate for participation; (2) enrolling stabilized outpatients in a placebo-controlled study whose consent form uses dense statistical language; and (3) enrolling adolescents with full parental consent but visibly ambivalent personal assent. Include at least one case where the procedure yields an approval I will likely find ethically troubling, and conclude by stating clearly what this procedure cannot determine.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Chair of Enrollment-Ethics Review Desk (Psychiatric Clinical Trials, University Hospital).
      *   **Task:** Create a reusable decision procedure (checklist/algorithm) for staff to evaluate study protocols regarding informed consent.
      *   **Key Challenges:** Fluctuating capacity (psychiatric context), family influence (coercion vs. support, specifically in immigrant populations), therapeutic misconception, dense consent forms, adolescent assent.
      *   **Philosophical Conditions to Operationalize:** Adequate disclosure (no deception), Absence of coercion, Competence (capacity).
      *   **Requirements:**
          *   Step-by-step procedure (questions, sufficient answers, stop points).
          *   Distinguish fact-based stops vs. value-based hand-offs.
          *   Constraints: 48-hour turnaround, non-philosopher staff, requires Chair + Independent Patient Advocate sign-off.
          *   Apply to 3 specific cases (Acute Psychosis + Family Pressure; Stabilized Outpatients + Dense Stats; Adolescents + Parental Consent/Ambivalent Assent).
          *   Include at least one "ethically troubling approval."
          *   Conclude with limitations (what the procedure *cannot* determine).

  2.  **Deconstruct the Philosophical Conditions:**
      *   *Disclosure:* Is the info clear, accurate, and understood? (Focus: Therapeutic Misconception, Jargon).
      *   *Voluntariness:* Is the decision free from undue influence? (Focus: Family pressure, Clinical dependency).
      *   *Capacity:* Can the patient understand, appreciate, reason, and express a choice? (Focus: Fluctuation, Remission).

  3.  **Drafting the Procedure (The "Enrollment-Ethics Triage Protocol" - EETP):**
      *   *Goal:* Needs to be practical for clinicians, not philosophers. Needs clear "Stop/Reject" and "Refer/Hand-off" points.
      *   *Structure:* Sequential gates. If Gate 1 fails, stop. If Gate 1 passes, move to Gate 2.
      *   *Time Limit:* 48 hours means the questions must be answerable via document review and brief interviews, not longitudinal study.
      *   *Sign-off:* Needs to explicitly mention the Chair and Advocate role at the end.

      *   *Drafting Gate 1: Disclosure & Comprehension (The "Understanding" Gate)*
          *   Question: Is the consent form readable? Is therapeutic misconception addressed?
          *   Threshold: Flesch-Kincaid score, explicit statement of research vs. care.
          *   Stop: If deception is present or comprehension is impossible due to jargon.

      *   *Drafting Gate 2: Voluntariness (The "Pressure" Gate)*
          *   Question: Is there undue influence?
          *   Nuance: Cultural family involvement. Need to distinguish *support* from *coercion*.
          *   Test: Private interview capability.
          *   Stop: If patient cannot speak privately or fears retaliation.

      *   *Drafting Gate 3: Capacity (The "Competence" Gate)*
          *   Question: Does the patient have capacity *now*?
          *   Nuance: Fluctuation.
          *   Test: MacArthur Competence Assessment Tool (MacCAT) simplified.
          *   Hand-off: If capacity is borderline, who decides? (This is a value judgment).

      *   *Refining the "Hand-off":* The prompt asks where the procedure stops because it involves values. This is crucial. Ethics procedures can't solve moral dilemmas; they identify them. So, if the facts are ambiguous (e.g., is this cultural norm or coercion?), it must go to the Chair/Advocate for deliberation.

  4.  **Developing the Three Cases:**

      *   *Case 1: Acute Psychosis + Family Advocacy.*
          *   Issue: Capacity is low. Family is pushing.
          *   Application: Gate 3 (Capacity) will likely fail. But maybe Gate 2 (Voluntariness) is the bigger issue.
          *   Outcome: Likely Rejection due to capacity, unless a waiver is invoked (but prompt implies standard consent). Let's make it a Rejection to show the safety mechanism.

      *   *Case 2: Stabilized Outpatients + Dense Stats.*
          *   Issue: Disclosure/Comprehension. Therapeutic misconception risk.
          *   Application: Gate 1 (Disclosure).
          *   Outcome: Conditional Approval (requires revision). Or, to meet the "troubling approval" constraint, maybe this one gets approved because the *stats* are dense but the *risk* is low, and the staff deems it "sufficient" despite the philosophical ideal of full understanding. *Correction:* The prompt asks for *one* case where the procedure yields an approval I (the Chair) will likely find ethically troubling.
          *   *Strategy for Troubling Approval:* Case 3 (Adolescents) is a better candidate for "troubling." Parents say yes, kid is ambivalent. Legally, parents decide. Ethically, it's gray. If the procedure prioritizes legal authority over moral assent, it yields an approval that feels wrong.
          *   *Revised Strategy:* Case 2 should be a standard "Fix the form" or "Approve." Case 3 should be the "Troubling Approval."

      *   *Case 3: Adolescents + Parental Consent/Ambivalent Assent.*
          *   Issue: Authority vs. Autonomy.
          *   Application: Gate 2 (Voluntariness) & Gate 3 (Capacity).
          *   Outcome: If the procedure defers to legal guardians when capacity is borderline, it approves. This is troubling because the kid doesn't want to do it.

  5.  **Refining the Procedure for Constraints:**
      *   *48 Hours:* Needs to be fast. No longitudinal capacity testing. Snapshot assessment.
      *   *Non-Philosophers:* Use concrete indicators (e.g., "Can they repeat back the purpose?") rather than abstract concepts (e.g., "Do they grasp the teleological aim?").
      *   *Advocate Sign-off:* Built into the final step.

  6.  **Writing the "Troubling Approval" Logic:**
      *   I need to ensure the procedure *allows* Case 3 to pass, even though it feels wrong. This happens if the procedure defines "Voluntariness" as "Absence of External Coercion" rather than "Internal Desire." If the parents aren't threatening, but the kid just feels pressured by obligation, the procedure might clear it. I need to make sure the procedure's limitations allow this.

  7.  **Final Review against Constraints:**
      *   Step-by-step? Yes.
      *   Specific questions? Yes.
      *   Stop points? Yes.
      *   Value hand-offs? Yes.
      *   3 Cases applied? Yes.
      *   Troubling approval included? Yes (Case 3).
      *   Limitations stated? Yes.

  8.  **Self-Correction/Nuance Check during Drafting:**
      *   *Cultural Sensitivity:* The prompt mentions immigrant populations where family influence is normative. The procedure cannot simply ban family presence. It must require a *private* interview option to distinguish norm from coercion.
      *   *Fluctuating Capacity:* The procedure needs a "Window of Capacity" clause. If they are in remission *now*, they can consent, even if they relapse later (provided there are safeguards).
      *   *The "Troubling" Aspect:* I need to be careful not to make the procedure *bad*. It must be *rigorous* but still yield a result that is philosophically uncomfortable (e.g., legalism overriding moral intuition).

  9.  **Final Polish:** Ensure tone is professional, administrative, yet philosophically grounded. (Proceed to generate output).

  *(Self-Correction on Case 2 vs Case 3 for Troubling Approval)*:
  Case 2 (Dense Stats) is usually a hard "Reject/Revise" because disclosure is a binary threshold in most IRB contexts.
  Case 3 (Adolescents) is the classic "Legally valid, ethically murky" zone. If the procedure prioritizes legal guardianship when the adolescent lacks full legal capacity but has moral agency, that creates the tension. I will design the procedure to defer to legal guardians *if* the adolescent does not meet the threshold for independent refusal (which is high). This creates the troubling approval.

  *(Wait, let's look at Case 1 again)*: Acute psychosis. If the family advocates *strongly*, and the patient is incapacitated, usually a Legally Authorized Representative (LAR) consents. If the procedure allows LAR consent for research with more than minimal risk (depending on regulations), that could be troubling. But federal regulations (45 CFR 46) are strict here.
  Let's stick with Case 3 (Adolescents) as the troubling one. It highlights the gap between *legal authority* and *moral assent*.

  *(Wait, let's look at the "Value Hand-off")*: The prompt asks where the procedure must hand the decision to a person because the question involves values. I need to make sure this is explicit. E.g., "If cultural norm vs coercion is indistinguishable via interview, refer to Chair/Advocate."

  Okay, ready to write.

  *Structure:*
  1.  Introduction (Context).
  2.  The Procedure (EETP v1.0).
  3.  Application to Cases.
  4.  Limitations.

  *Key check:* Did I include the 48-hour constraint? Yes, build it into the timeline.
  *Key check:* Did I include the Advocate sign-off? Yes, final gate.
  *Key check:* Did I include the "Troubling Approval"? Yes, Case 3.

  *Refining the "Troubling Approval" in Case 3:*
  To make it truly troubling to a Chair focused on ethics, the procedure must prioritize *risk minimization* and *legal compliance* over *moral assent*. If the adolescent is not legally an adult, and the parents consent, and the risk is low, the procedure approves. The "trouble" is the dismissal of the adolescent's ambivalence. I will ensure the procedure's criteria for "Coercion" focuses on *threats*, not *reluctance*, allowing this to pass.

  *Refining Case 1:* Acute psychosis. Capacity is the blocker. Procedure should reject unless LAR is used + waiver. I will assume standard consent for the sake of the exercise to show the rejection.
  *Refining Case 2:* Dense stats. Disclosure blocker. Procedure should require revision.

