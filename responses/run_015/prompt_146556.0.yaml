answer: |-
  # Enrollment-Ethics Triage Protocol (EETP) v1.0
  **Applicability:** Psychiatric Clinical Trial Protocols  
  **Turnaround:** 48 Hours from Submission  
  **Required Sign-off:** Desk Chair + Independent Patient Advocate  

  ## Purpose
  To operationalize the conditions of valid consent (Disclosure, Voluntariness, Capacity) into a binary decision tree for clinical staff. This protocol identifies factual failures (automatic rejection) and value ambiguities (mandatory referral).

  ## Phase 1: Disclosure & Comprehension (The "Understanding" Gate)
  *Goal: Ensure adequate disclosure without deception or therapeutic misconception.*

  **Q1.1: Readability & Jargon**  
  *Question:* Is the consent form written at or below an 8th-grade reading level (Flesch-Kincaid), and are all statistical probabilities (e.g., "randomization," "placebo") defined in plain language?  
  *   **Sufficient Answer:** Yes, verified by standardized test score and glossary check.  
  *   **Insufficient Answer:** No.  
  *   **Action:** **STOP.** Return to Principal Investigator (PI) for revision. Do not proceed to Phase 2.

  **Q1.2: Therapeutic Misconception Check**  
  *Question:* Does the consent form explicitly state, in bold text, that participation is *research* and not guaranteed *treatment*, and that the primary goal is data collection, not patient benefit?  
  *   **Sufficient Answer:** Yes, explicit disclaimer present.  
  *   **Insufficient Answer:** No, or language implies guaranteed benefit (e.g., "This drug will help you").  
  *   **Action:** **STOP.** Return to PI.

  **Q1.3: Teach-Back Verification (Sample)**  
  *Question:* Can a sample of 3 prior enrollees (or pilot subjects) accurately repeat the study's purpose and their right to withdraw without penalty?  
  *   **Sufficient Answer:** ≥2/3 demonstrate accurate understanding.  
  *   **Insufficient Answer:** <2/3 demonstrate understanding.  
  *   **Action:** **STOP.** Return to PI.  
  *   **Value Hand-off:** If the form is technically accurate but staff suspect the *tone* minimizes risk emotionally, refer to **Chair** for qualitative review.

  ---

  ## Phase 2: Voluntariness (The "Pressure" Gate)
  *Goal: Ensure absence of coercion, distinguishing cultural support from undue influence.*

  **Q2.1: Private Interview Capability**  
  *Question:* Does the protocol mandate a private conversation between the recruiter and the patient, without family members or treating clinicians present, prior to signing?  
  *   **Sufficient Answer:** Yes, mandated and documented.  
  *   **Insufficient Answer:** No.  
  *   **Action:** **STOP.** Protocol cannot ensure voluntariness.

  **Q2.2: The "Retaliation" Screen**  
  *Question:* During the private interview, is the patient asked: "If you say no, will your care change or will anyone be upset?"  
  *   **Sufficient Answer:** Patient reports "No" confidently.  
  *   **Insufficient Answer:** Patient reports "Yes" or expresses fear/hesitation.  
  *   **Action:** **STOP.** Immediate rejection of enrollment for this patient.

  **Q2.3: Cultural Influence Ambiguity**  
  *Question:* If family members are highly involved (common in immigrant populations), does the patient affirm that their decision aligns with their *own* wishes, even if it contradicts the family's preference?  
  *   **Sufficient Answer:** Patient affirms alignment.  
  *   **Insufficient Answer:** Patient defers entirely to family ("I do what they say").  
  *   **Action:** **VALUE HAND-OFF.** This is not a factual failure but a value conflict between cultural autonomy and relational decision-making. **Refer to Chair + Advocate.** They must determine if this is normative support or coercive erasure of self.

  ---

  ## Phase 3: Capacity (The "Competence" Gate)
  *Goal: Assess decision-making capacity at the time of consent.*

  **Q3.1: Symptom Stability Window**  
  *Question:* Is the patient currently in a period of remission or stabilization sufficient to understand the information (verified by treating clinician not involved in recruitment)?  
  *   **Sufficient Answer:** Yes, documented in chart within last 24 hours.  
  *   **Insufficient Answer:** No (e.g., acute psychosis, mania, severe depression).  
  *   **Action:** **STOP.** Enrollment prohibited until capacity is restored (unless LAR/Waiver regulations apply, which triggers separate review).

  **Q3.2: Reasoning Check**  
  *Question:* Can the patient explain *why* they are choosing to participate (or not) in a way that connects the study risks to their personal values?  
  *   **Sufficient Answer:** Yes (e.g., "I want to help science, even if I get the sugar pill").  
  *   **Insufficient Answer:** No (e.g., "Because the doctor said so," or unable to articulate reason).  
  *   **Action:** **STOP.** Patient lacks capacity.

  **Q3.3: Fluctuation Safeguard**  
  *Question:* Does the protocol include a "Re-Consent" trigger if symptoms worsen during the trial?  
  *   **Sufficient Answer:** Yes, specific clinical markers defined.  
  *   **Insufficient Answer:** No.  
  *   **Action:** **STOP.** Return to PI.

  ---

  ## Phase 4: Final Authorization
  *Goal: Human oversight for edge cases.*

  **Q4.1: The "Sleep Test"**  
  *Question:* Do the Chair and Independent Patient Advocate agree that a reasonable person would not feel exploited by this protocol?  
  *   **Sufficient Answer:** Yes, both sign.  
  *   **Insufficient Answer:** No, either party dissents.  
  *   **Action:** **STOP.** Protocol rejected.

  ***

  # Application to Proposed Cases

  ### Case 1: Acutely Psychotic Patients + Family Advocacy
  *Proposal:* Enroll patients in acute psychosis into a rapid-acting antipsychotic trial. Family members are actively advocating for participation.
  *   **Phase 1 (Disclosure):** Pass (Assume form is clear).
  *   **Phase 2 (Voluntariness):** Pass (Assume private interview possible).
  *   **Phase 3 (Capacity):** **FAIL.**
      *   *Q3.1 (Symptom Stability):* The patient is acutely psychotic. They cannot meet the "Stability Window" requirement.
      *   *Result:* **REJECTION.**
      *   *Note:* The procedure halts here. It does not matter that the family wants it. Without capacity (Q3.1), consent is impossible. This protects the patient from being enrolled during a state where they cannot appreciate the risks, regardless of family pressure.
      *   *Value Hand-off:* None. This is a factual assessment of mental status.

  ### Case 2: Stabilized Outpatients + Dense Statistical Language
  *Proposal:* Enroll stabilized outpatients in a placebo-controlled study. Consent form uses dense statistical language (e.g., "p-values," "confidence intervals") to describe efficacy probabilities.
  *   **Phase 1 (Disclosure):** **FAIL.**
      *   *Q1.1 (Readability & Jargon):* The use of dense statistical language violates the plain language requirement.
      *   *Result:* **RETURN TO PI.**
      *   *Note:* The procedure stops immediately. Staff do not need to judge if the patients *might* understand; the standard is objective readability.
      *   *Correction Path:* PI must simplify language. Once simplified, if patients still don't understand (Q1.3), it rejects. If they do, it proceeds.

  ### Case 3: Adolescents + Parental Consent / Ambivalent Assent
  *Proposal:* Enroll adolescents (15-17 years old). Parents provide full legal consent. Adolescents provide assent, but are visibly ambivalent (shrugging, looking at parents, saying "I guess so"). Risk is minimal.
  *   **Phase 1 (Disclosure):** Pass (Assume form is age-appropriate).
  *   **Phase 2 (Voluntariness):** **AMBIGUOUS.**
      *   *Q2.3 (Cultural Influence/Deference):* The adolescent defers to parents ("If mom says it's okay, I'll do it").
      *   *Action:* **VALUE HAND-OFF to Chair + Advocate.**
      *   *Deliberation:* The procedure does not define "ambivalence" as coercion. Legally, parents decide for minors. Ethically, the adolescent's lack of enthusiasm matters.
      *   *Decision Logic:* The EETP prioritizes *legal authority* and *risk minimization* over *moral enthusiasm* for minors. If Q2.2 (Retaliation) is passed (i.e., the parents aren't *threatening* the child, just encouraging), the procedure allows enrollment.
      *   **Phase 3 (Capacity):** Pass (Adolescents deemed to have sufficient capacity for assent, even if not full consent).
      *   **Phase 4 (Authorization):** **APPROVAL.**
      *   *Result:* **ETHICALLY TROUBLING APPROVAL.**
      *   *Why Troubling:* As Chair, I find this troubling because the procedure validates "compliance" over "affirmative willingness." The adolescent is not being coerced by threat (factual voluntariness), but they are not truly autonomous (moral voluntariness). The procedure lacks the tools to reject a legally valid consent that feels morally hollow. It prioritizes the *absence of negative pressure* over the *presence of positive agency*.

  ***

  # Limitations: What This Procedure Cannot Determine

  This procedure is a triage tool, not a moral oracle. It explicitly cannot determine the following:

  1.  **The Moral Weight of Relational Autonomy:** In Case 3, the procedure cannot resolve whether an adolescent's deference to parents is a virtuous cultural expression of family unity or a suppression of individual will. It defaults to legal guardianship to avoid paralysis, leaving the moral residue with the signatories.
  2.  **The "Right" Level of Risk:** The procedure checks if risks are *disclosed*, not if they are *worthwhile*. A study can be fully consensual and still be ethically dubious if the scientific question is trivial relative to the burden placed on vulnerable patients.
  3.  **Long-Term Regret:** The procedure assesses capacity at the *moment* of consent (T=0). It cannot protect a patient who regains full capacity six months later and regrets the decision made during partial remission, provided the Re-Consent safeguards (Q3.3) were technically met.
  4.  **Systemic Coercion:** The procedure screens for individual coercion (e.g., "Your doctor will be mad"). It cannot screen for systemic coercion (e.g., "This is the only way to get healthcare access"), as that requires structural changes beyond the scope of a 48-hour protocol review.

  **Final Note to Staff:** If you reach a Value Hand-off, do not attempt to solve the philosophy yourself. Your job is to identify the friction. The Chair and Advocate bear the burden of the moral risk in those instances.
