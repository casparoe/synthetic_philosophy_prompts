answer: |-
  Here is a sequence of ten questions designed to tighten the pressure on Dr. Vosk's "calibrated deference" view, specifically targeting the "reason to act, not a reason to believe" distinction and the structural viability of the calibration requirement.

  **1. The Bootstrap Problem**
  Your view requires a track record of covariation before testimony can justify belief, but on the very first work you and I judge together, that track record is empty. How do I rationally accept your testimony on *that* first work to begin building the sample, if I am not yet entitled to believe you?
  *   **Anticipated Answer:** She will likely say you don't accept the testimony as *true* yet; you only accept it as a reason to look, and the agreement is discovered retrospectively.
  *   **Follow-up:** If the first step is merely a reason to look, then my subsequent agreement is based on an action I took for non-epistemic reasons; doesn't that make the resulting "calibration" data epistemically tainted, since the sample wasn't gathered through justified trust?

  **2. The Metric of Agreement**
  To build this track record, we need to know what counts as "agreeing" on a work: does it require matching verdicts, matching emotional responses, or matching reasons?
  *   **Anticipated Answer:** She will likely propose a coarse-grained verdict match (e.g., both saying "it's good") is sufficient to start, with finer alignment required later.
  *   **Follow-up:** If a coarse verdict is enough to count as calibration, why does the amnesiac critic—who has the exact same verdict recorded in her notes but no memory of the experience—fail to have knowledge?

  **3. The Amnesiac Critic**
  Consider a critic who stands before a painting, forms a verdict, writes it down, and then suffers total amnesia regarding the experience, reporting the verdict only from her notes. She has the causal history and the reliability, but no present acquaintance. Does she know the painting is good?
  *   **Anticipated Answer:** She will say no, because acquaintance is constitutive of aesthetic judgment, not merely a causal precursor; the experience itself is the justification.
  *   **Follow-up:** If the experience is the justification, then why does the calibration with *another* person matter at all? Why isn't my own past experience sufficient, rendering the testimony redundant?

  **4. The AI Predictor (The Counter-Evidence Trap)**
  Imagine an AI system trained on millions of reviews that predicts your aesthetic verdicts with 99% accuracy without undergoing anything plausibly called an aesthetic experience. If you trust its predictions and they covary with yours, have you achieved calibrated deference?
  *   **Anticipated Answer:** She will likely say no, because the AI lacks the phenomenological state required to participate in the space of aesthetic reasons.
  *   **Follow-up:** If the AI's perfect reliability doesn't grant entitlement because it lacks experience, but the human critic's reliability *does* grant entitlement only *with* experience, isn't "calibration" doing no work here? Isn't the view just "acquaintance is required," making the testimonial machinery superfluous?

  **5. The Destroyed Work**
  How does your view handle testimony about works one cannot in principle experience first-hand, such as a building destroyed before one was born or a score that cannot be performed?
  *   **Anticipated Answer:** She will likely argue that one can know historical facts about the work, but not its full aesthetic value, since the requisite acquaintance is impossible.
  *   **Follow-up:** Art historians routinely claim knowledge about the aesthetic value of lost works; if your view classifies all such claims as unjustified, isn't the cost of the theory too high for the epistemic gain?

  **6. The Artist's Authority**
  When an artist testifies about her own work ("I aimed at serenity and failed"), she clearly has acquaintance, but does she need to be calibrated with herself to have knowledge of her failure?
  *   **Anticipated Answer:** She will likely say the artist has privileged access that bypasses the need for interpersonal calibration.
  *   **Follow-up:** If privileged access bypasses calibration for the artist, why can't a critic earn that same privilege through extreme calibration? If they can't, what is the principled difference between the artist's self-relation and the critic's earned relation?

  **7. The Recommender System**
  When a streaming algorithm suggests a film, I treat that as a reason to *watch* it, not necessarily a reason to *believe* it is good before I see it; does this match your distinction between reasons to act and reasons to believe?
  *   **Anticipated Answer:** She will say yes, this is exactly the kind of practical deference that is permissible without epistemic justification.
  *   **Follow-up:** But when I recommend that same film to a friend, I say "It is good," not "Watch this"; if I can't believe it's good based on the algorithm, on what grounds am I making an assertion of value to someone else?

  **8. The Peer Disagreement**
  You lean on the idea that critics disagree in a way scientists do not, but if calibration works, shouldn't calibrated critics converge over time like scientists do?
  *   **Anticipated Answer:** She will likely say aesthetic disagreement is persistent even among experts because values are more subjective than empirical facts.
  *   **Follow-up:** If calibration doesn't produce consensus, how do we distinguish a successfully calibrated relationship from two people who just happen to agree by accident? What is the functional payoff of the calibration?

  **9. The Normative Gap**
  If testimony gives me a reason to act (go see the work) but no reason to believe (it is worth seeing), am I irrational if I go see it expecting to be disappointed?
  *   **Anticipated Answer:** She will likely say no, because you are acting on the hope of an experience, not on a settled belief about the outcome.
  *   **Follow-up:** But if I don't believe it's worth seeing, why is "disappointment" the relevant failure condition? Disappointment implies a frustrated expectation of value, which sounds exactly like a frustrated belief.

  **10. The Allergic Collector (The Opposite Direction Trap)**
  Consider a collector who is severely allergic to the environment where a work is displayed; she cannot act (visit the work), but she accepts a critic's testimony and forms a belief that it is magnificent. Here, testimony gives a reason to *believe* without a possibility of a reason to *act*.
  *   **Anticipated Answer:** She will likely struggle here, perhaps arguing that the belief is incomplete or parasitic on the possibility of action for others.
  *   **Follow-up:** If I can have a justified aesthetic belief without any capacity to act on it, doesn't that sever the link you need? If belief can exist without the practical route, then the "reason to act" defense cannot be what protects the view from skepticism about testimony.
