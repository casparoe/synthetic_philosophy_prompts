answer: |-
  Here is a scenario setup that should fit your constraints and scramble those moral positions the way you need. You have a suspect named Danny held in the hallway outside unit 4B. The fire is inside 4B and spreading through the walls to 4A. The smoke is thickening, turning from gray to black, indicating a shift from smoldering to active flame. Danny is the ex-boyfriend of the mother. He was seen entering the building ten minutes before the alarm. He is not handcuffed but is being pinned against the wall by a uniformed officer. He is shaking, sweating, and refusing to answer where the kids are, repeating only that he came to drop off child support. The absolutist is your medic, Sarah, who is trying to check Danny's vitals while the detective, Marcus, wants to drag him toward the heat to loosen his tongue. The consequences guy is the Fire Chief, Vargas, who is looking at his crew and the building schematics.

  The crux of the dilemma relies on the specific nature of the building and the information needed. This is a hoarder complex with undocumented renovations. The fire chief knows that the blueprints are wrong. The only way to find the kids quickly is not just knowing the room number, but knowing which walls are fake and where the landlords have boarded up emergency exits to hide code violations. The neighbors are watching from the street and the lower floors. If the crew treats Danny like a combatant, the neighbors will stop talking. They will not tell the firefighters about the hidden trapdoors or the locked security gates that trapped the kids. Sarah, the absolutist, argues that Danny is going into diabetic shock, not hiding secrets. If they hurt him, he passes out, and the information dies with his consciousness. Marcus, the threshold guy, sees the smoke color change and calculates that even if there is only a twenty percent chance Danny knows a shortcut, the lives of the children outweigh Danny's safety. He is tempted because the standard search tools are failing due to the heat. Vargas, the consequences guy, shuts it down not because of morality but because of operational security. He argues that if they torture a resident in front of the block, the community trust evaporates. Next week, when there is another fire, no one will tell them about the gas cans stored in the basement. He frames it as wasting resources on a low-yield asset that compromises future mission success.

  This works because it shifts the debate from morality to efficacy, which is where your hard-nosed characters live. Sarah looks serious because she is not quoting human rights law but rather medical triage protocol. She points out that a unconscious suspect provides zero data. She anchors her absolutism in the physical reality of the suspect's body. If she just said it was wrong, Marcus would override her. By saying it won't work because he will pass out, she becomes a tactical asset rather than a moral obstacle. Marcus is tempted because the stakes are immediate and visceral. The smoke color change is a visual clock that anyone can read. He feels the pressure of the parents on the street. He is willing to accept the risk of false information because the cost of inaction is death. He represents the human impulse to do something rather than wait. Vargas comes out against torture because he is playing a longer game. He is responsible for the crew and the district. He knows that fire investigation relies on community cooperation. If his team becomes known for brutalizing residents, their ability to solve future cases drops. He treats the interrogation like a resource allocation problem. Torture costs trust capital they cannot afford to spend.

  The specific detail doing the most work here is the undocumented renovation combined with the watching neighbors. If the building was standard, Vargas would have less reason to worry about community trust because the exits would be known. If the neighbors weren't watching, the reputational damage would be lower. The fact that the intel needed is specific to the building's illegal modifications makes the neighbors the true key, not Danny. Danny might know where the kids are, but the neighbors know how to get to them. This forces Vargas to prioritize the neighborhood over the individual suspect. It also gives Sarah an out because if the neighbors hold the real key, hurting Danny is doubly useless. It allows Marcus to still feel the tension because he doesn't know that the neighbors hold the key. He only knows Danny was there.

  If you remove the uncertainty about Danny's knowledge, the scenario collapses. If you stipulate Danny definitely knows, Vargas looks incompetent for not forcing the issue. If you stipulate Danny definitely does not know, Marcus looks like a monster for even suggesting it. The ambiguity is the engine. You need Danny to act guilty enough to justify Marcus's suspicion but physically unstable enough to justify Sarah's intervention. Similarly, if you juice up the stakes to nuclear levels, Vargas's argument fails. If a hundred kids were dying, no one cares about community trust for next week's fire. The stakes must remain localized. It has to be two kids versus the long-term integrity of the fire crew's relationship with the block. That balance keeps Vargas's utilitarian argument viable. If the stakes get too high, utilitarianism demands torture every time. Keeping it small and messy keeps the calculation disputed.

  The side that comes off worst here is likely Marcus, and he would complain that you rigged the scenario by making the torture inefficient. He would argue that you stacked the deck by giving Danny a medical condition that makes him useless under pressure. He would say that in a real vacuum, where the suspect is healthy and the clock is tighter, the threshold argument holds. He would feel that Sarah's medical diagnosis is a convenient plot shield to stop him from acting. He might also argue that Vargas's concern about future trust is abstract compared to the concrete reality of two children suffocating right now. He would say you prioritized the institution over the individual lives to force his hand. To fix this in the dialogue, you need to let Marcus point out that they don't know Danny is diabetic yet. Sarah suspects it, but Marcus sees the shaking as fear. That keeps the uncertainty alive. Marcus should argue that they can risk the medical issue because the alternative is certain death for the kids. That keeps his position honest even if the narrative blocks him.

  You can drop this into the chapter by having the smoke darken during the argument. Let Sarah check Danny's pulse and find it thready. Let Vargas look at the neighbors gathering behind the tape. Let Marcus look at the door where the heat is bleeding through. The dialogue should overlap. Sarah calling for glucose. Marcus demanding a location. Vargas ordering the team to check the adjacent unit based on a neighbor's shout rather than Danny's confession. This validates Vargas's choice without making Marcus look stupid for wanting to push. It shows that the community intel was the faster path, vindicating the consequences argument, while Sarah's medical intervention prevents a death that would have complicated everything. Marcus is left with the frustration of inaction, which is where you want him for the next scene. He is not defeated by morality but by better data, which hurts more and sets up future conflict.

  This approach avoids the cliché of the ticking bomb because the bomb is a slow fire and the solution is not a code but a layout. It avoids the sci-fi of perfect lie detectors by relying on human physiology and community dynamics. It makes the absolutist practical, the threshold guy desperate but rational, and the utilitarian focused on systemic efficiency rather than immediate gain. It forces your characters to argue about facts and outcomes rather than good and evil. That is where the thriller tension lives. It is not about who is the better person but who is reading the room correctly. You can write the scene so that each character thinks they are the only adult in the room. Sarah thinks she is saving the suspect and the data. Marcus thinks he is saving the kids. Vargas thinks he is saving the department and the district. All three are right from their own vantage point, and the tragedy is that they cannot all be right in the same moment. That is the friction you need for the dialogue to snap.
