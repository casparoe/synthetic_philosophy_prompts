  # PHILOSOPHY OF ACTION: FINAL EXAMINATION

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words
  **Instructions:** Answer the following question. You are not required to provide bibliographies, reading lists, or citations. Your answer will be evaluated entirely on the strength of your conceptual reasoning regarding the case and principles provided.

  ***

  ### Essay Question: The Dormant Implant

  Consider the following case, **The Dormant Implant**:

  Dr. Aris is considering whether to donate a significant sum to charity. Unbeknownst to her, she has a neural implant capable of suppressing any voluntary movement that conflicts with an instruction to donate. The implant activates *only* if her brain enters a rare, introspectively undetectable neural state, **P**. State P occurs randomly with 0.01% probability and is causally independent of Aris's intentions in the actual sequence. On Tuesday, Aris decides to donate and completes the transfer. Her brain never enters P, so the implant remains dormant. However, the case is stipulated such that had she formed the intention *not* to donate, the random fluctuation would have triggered P, and the implant would have overridden her will, forcing the donation regardless.

  Evaluate the following two philosophical responses to this case:

  **Response 1:** Because Aris lacked any phenomenally available choice-point (she could not detect State P or the implant), the case undermines the Principle of Alternative Possibilities (PAP) not just globally, but locally. Aris is responsible despite having no accessible alternative.
  **Response 2:** The structural existence of the blocked pathway preserves a minimal "flicker" of freedom. Aris's decision-process could have unfolded differently up to the point of exogenous intervention; therefore, PAP is preserved in a modified form.

  In your essay, you must address the following four requirements:

  1.  Distinguish between **Global** and **Local** formulations of PAP. Identify precisely which formulation The Dormant Implant targets and explain why this distinction matters for Response 1.
  2.  Analyze whether the **Flicker Objection** (Response 2) applies here. Pay particular attention to the fact that the blocker is triggered by an exogenous neural fluctuation rather than by Aris's own mental state or prior signs of choice.
  3.  Evaluate whether a distinction between **Structural Availability** (the pathway exists in the causal structure) and **Phenomenal Availability** (the agent can represent it in practical reasoning) saves PAP, or whether relying on Phenomenal Availability transforms PAP into an unintended epistemic condition.
  4.  Reach and defend a conclusion about Aris's moral responsibility. State clearly whether your verdict requires revising Frankfurt's claim that moral responsibility does not require the ability to do otherwise.

  ***

  # MODEL ANSWER

  The Dormant Implant presents a refined challenge to the Principle of Alternative Possibilities (PAP). To evaluate the competing responses, one must first distinguish between Global and Local formulations of PAP. Global PAP asserts that moral responsibility (MR) generally requires an agent to have some alternative possibilities available in their life or action-set. Local PAP is stricter: it claims MR for a *specific* action X requires the ability to have done not-X at the time of action. The Dormant Implant targets Local PAP. Response 1 argues that because Aris could not have done otherwise regarding the donation specifically, Local PAP is false. This distinction matters because Global PAP might survive if Aris had other choices in life, but Local PAP is the principle Frankfurt-style cases aim to dismantle to sever the link between MR and specific alternative actions.

  Response 2 relies on the "Flicker Strategy," arguing that some alternative possibility remains. In classic Frankfurt cases, the flicker is often the agent's prior mental state (e.g., beginning to choose otherwise) which triggers the intervener. However, in The Dormant Implant, the trigger is State P, an exogenous, random neural fluctuation causally independent of Aris's intentions. This significantly weakens the Flicker Objection. If the intervention is not triggered by a sign of Aris's will but by a random event that merely coincides with her counterfactual choice, there is no robust "flicker" of agency in the alternative sequence. The alternative pathway is not a genuine exercise of freedom that gets cut short; it is a path blocked by randomness. Therefore, Response 2 fails to secure a meaningful flicker of freedom that could ground responsibility.

  This leads to the distinction between Structural and Phenomenal Availability. Structural Availability refers to the metaphysical existence of a causal pathway where Aris could have initiated a different intention. Phenomenal Availability refers to whether Aris can access or represent that pathway in her practical reasoning. In this case, the pathway is structurally present (she could have formed the intention) but phenomenally hidden (she cannot detect State P or the implant). Response 1 suggests that without Phenomenal Availability, the alternative is irrelevant to responsibility. If we insist on Phenomenal Availability to save PAP, we risk transforming PAP from a metaphysical condition about causal powers into an epistemic condition about the agent's knowledge. PAP traditionally concerns what an agent *can* do, not what they *know* they can do. If PAP requires Phenomenal Availability, it collapses into a principle of informed consent or knowledge, which is not the intended function of PAP in debates about free will and determinism.

  Consequently, we must evaluate Aris's moral responsibility. Aris acts on her own reasons, without actual interference. The existence of the dormant implant does not alter the actual sequence of events. If we accept Response 1, we conclude Aris is morally responsible despite lacking Local Alternative Possibilities. This supports Frankfurt's core claim: MR does not require the ability to do otherwise. However, the specific mechanics of The Dormant Implant suggest a nuance. Because the blocker is random and exogenous, it highlights that responsibility tracks the *actual source* of the action, not the modal status of the action.

  Therefore, the correct verdict is that Aris is morally responsible. Her decision emanates from her own character and reasoning in the actual sequence. This verdict confirms Frankfurt's claim but suggests a revision in how we understand the "ability to do otherwise." It is not merely that the ability is unnecessary; rather, the relevant ability is the capacity for self-government in the actual sequence, not the metaphysical openness of the future. Response 2 fails because it clings to a structural alternative that is agentially inert. Response 1 succeeds because it recognizes that responsibility is grounded in actual-sequence ownership. Thus, Frankfurt is right: the ability to do otherwise is not a necessary condition for moral responsibility, even when the lack of alternatives is due to hidden, random constraints rather than direct monitoring of the will.

  ***

  # MARKING SCHEME

  **Total Marks:** 25
  **Pass Mark:** 15

  | Move | Criteria | Marks | Characteristic Error |
  | :--- | :--- | :--- | :--- |
  | **1. PAP Distinction** | Correctly distinguishes Global (general capacity) vs. Local (specific act) PAP. Identifies the case targets Local PAP. Explains why Response 1 relies on this to undermine PAP locally. | **5** | Conflating Global and Local PAP; claiming the case targets Global PAP only. |
  | **2. Flicker Analysis** | Analyzes the Flicker Objection (Response 2). Notes the exogenous/random nature of State P vs. standard mental-state triggers. Argues this weakens the flicker as an agential marker. | **5** | Treating State P as a standard Frankfurt "sign"; failing to note the causal independence of the trigger. |
  | **3. Structural vs. Phenomenal** | Distinguishes Structural (causal pathway) vs. Phenomenal (representable) availability. Evaluates whether requiring Phenomenal Availability saves PAP. | **5** | Treating Structural and Phenomenal availability as identical; ignoring the introspective undetectability of P. |
  | **4. Epistemic Worry** | Identifies that requiring Phenomenal Availability transforms PAP into an epistemic condition. Explains why this is a category error or unintended revision of PAP. | **5** | Accepting the epistemic transformation without critique; failing to see the shift from metaphysics to epistemology. |
  | **5. Verdict & Frankfurt** | Defends a clear verdict on Aris's responsibility. Explicitly states whether Frankfurt's claim needs revision based on the analysis (e.g., Actual Sequence focus). | **5** | Ambiguous verdict on responsibility; failing to connect the verdict back to Frankfurt's original claim. |

  ### Grading Bands

  **A-Range (22–25 Marks):**
  The essay demonstrates sophisticated conceptual navigation. It not only meets all five criteria but integrates them into a cohesive argument. The distinction between Structural and Phenomenal availability is handled with nuance, particularly regarding the "epistemic condition" worry. The analysis of the exogenous trigger (State P) shows a deep understanding of why this specific modification weakens the Flicker strategy more than standard cases. The conclusion is decisive and logically follows from the premises.

  **B-Range (18–21 Marks):**
  The essay addresses all five criteria competently but may lack integration. The distinction between Global and Local PAP is correct but perhaps mechanical. The analysis of the Flicker Objection identifies the exogenous trigger but may not fully explicate why this matters for *agency* specifically. The Epistemic Worry is identified but the explanation of *why* it transforms PAP might be slightly underdeveloped. The verdict is clear but the connection to Frankfurt's revision might be standard rather than insightful.
