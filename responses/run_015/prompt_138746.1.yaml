prompt: |-
  Last night me and my friend Ravi had a genuinely four-hour argument in a curry place about whether a synthetic minimal cell — y'know, one of those projects where the whole genome is written chemically and booted up inside a stripped-out recipient — has parts with functions. He's a physiolgist, so for him the heart pumps blood because that's what it contributes to the circulatory system, full stop, and the same goes for whatever the synthetic cell's equivalent bit is. I kept saying no: function has to do with history, with what the thing was selected for or what it's there *because* of, and a part that got assembled last Tuesday can't have a function any more than a molecule-for-molecule duplicate of a frog that a lightning strike happened to assemble, whose heart would pump away without being *for* anything. Then he said: fine, then tell me what your theory is *for*. And I honestly couldn't. So I want to back up a level.

  Act as a professional philosopher of biology who's actually spent time with the function literature, think it through carefully before you commit to anything (do your brainstorming first — I'd rather watch you change your mind mid-answer than hedge evenly), and give me the specification: what any account of biological function would have to deliver to count as adequate. Fix the purpose as *adequate for telling working biologists what they're committing to when they write "the function of X is to..."* in four settings — molecular biology and genomics, physiology and ecology, evolutionary biology, and medicine. I have a suspicion those four aren't all doing the same thing with the word and that no single theory serves all of them; if that turns out to be the result of the exercise, say so plainly.

  Here's the raw material I want the criteria to earn their keep on (add your own cases, but hit these): (1) the heart — pumping blood vs. making a thumping noise vs. holding the pericardium open vs. keeping the chest cavity warm; any account that lets all of those in has a problem, so tell me which are supposed to be excluded and why. (2) No-history items: the chance duplicate of the frog, the synthetic cell, a gene that arose de novo in a lab population last month. (3) The ur-case: whatever the first contractile vessel was, there was no selection for pumping before there was pumping, so did the very first heart have a function? (4) Feathers: selected for insulation, later co-opted for flight — what's their function now, and does your answer change if the insulation use has since vanished? (5) A lab-evolved enzyme from a directed-evolution campaign, selected hard for one reaction, that also catalyzes a second reaction nobody ever selected for: is the second activity a function, a side effect, an accident? (6) Selfish genetic elements and meiotic-drive alleles that bias their own transmission while lowering the fertility of the organism carrying them — function at gene level vs. at organism level. (7) Malfunction: a heart with a septal defect, and separately a trait present from birth that has literally never worked even once. (8) The medical use: dysfunction is supposed to amount to more than statistical rarity and more than "we disapprove of it," and the harmful-dysfunction style of analysis of mental disorder leans on exactly that — can an account of function be *required* to carry that weight, or is that an illegitimate burden to place on it? (9) Metagenomics: annotating "function" onto genes from organisms nobody has ever cultured or described, where there isn't even an agreed containing system to analyze — what are those people actually claiming? (10) Artifacts: carburetors, thermostats, a drone's rotor — is covering them a desideratum, or is a principled organism/artifact asymmetry a point in a theory's favor? (11) What function statements are *supposed* to do for us: support counterfactuals about what would happen if the part failed, license extrapolations from a sampled individual to unobserved members of the class, and explain the presence of the trait rather than merely redescribe it.

  For each requirement, give the case or consideration behind it, and a verdict on whether it's non-negotiable, a reasonable preference, or just a prejudice of one camp (I suspect "function must be historical" and "function must be ahistorical and system-relative" both land in that third bucket when they're stated as requirements rather than as consequences of other commitments). Flag any subset of the desiderata that can't be jointly satisfied — that's the part I care most about, because if the list is internally inconsistent then last night never had a clean verdict available — and tell me which single requirement excludes the most candidate theories. A table is fine. Keep the weight on the criteria and their motivating cases rather than on scoring; you can run the etiological family, the causal-role family, and any hybrid or pluralist view you like against the list at the end, but keep that to a couple of lines each. And please don't give me a reading list or tell me which papers to look up — I can't get at them this week and I want the arguments themselves, not a map of where to find them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of biology (expert in function literature).
      *   **Task:** Specify the criteria for an *adequate* account of biological function, specifically tailored for *working biologists* in four settings (Molecular/Genomics, Physiology/Ecology, Evolutionary Biology, Medicine).
      *   **Input Material:** 11 specific cases/considerations provided by the user (Heart, No-history items, First Heart, Feathers, Lab enzyme, Selfish genes, Malfunction, Medical dysfunction, Metagenomics, Artifacts, Explanatory role).
      *   **Constraint 1 (Crucial):** "Think it through carefully before you commit to anything (do your brainstorming first — I'd rather watch you change your mind mid-answer than hedge evenly)." This means I need to show the *process* of reasoning, potentially revising initial thoughts, rather than just presenting a polished final table.
      *   **Constraint 2:** Flag inconsistencies/incompatible desiderata.
      *   **Constraint 3:** Identify the single requirement that excludes the most candidate theories.
      *   **Constraint 4:** No reading lists/paper citations. Just arguments.
      *   **Tone:** Rigorous, analytical, conversational but professional (like a colleague hashing it out).

  2.  **Initial Brainstorming & Tension Identification (The "Change My Mind" Phase):**
      *   *Initial thought:* The user's debate (Etiological vs. Causal Role) is the classic Millikan vs. Cummins fight. Etiological (history/selection) handles the "frog duplicate" and "heart noise" well but struggles with "first heart" and "metagenomics." Causal Role (current contribution) handles "metagenomics" and "physiology" well but struggles with "frog duplicate" and "heart noise."
      *   *Tension:* The user suspects the four fields (Molecular, Phys, Evo, Med) aren't doing the same thing. This is a strong hunch. If I try to force one definition, I'll fail.
      *   *Revising thought:* Wait, if I admit pluralism immediately, do I dodge the hard work of finding *necessary* conditions? The prompt asks for "what any account... would have to deliver to count as adequate." But it also says "if that turns out to be the result... say so plainly."
      *   *Key realization:* The "Medical" requirement (Harmful Dysfunction) is a huge trap. It demands normativity. Purely descriptive accounts (Causal Role) fail here. Purely historical accounts (Etiological) struggle with *new* diseases or genetic conditions that haven't been selected against yet.
      *   *Key realization 2:* The "Metagenomics" case is a killer for strict Etiological views. You can't know the history of an uncultured gene. Yet biologists annotate "function" there confidently. So, strict history is *not* non-negotiable for *all* biology.
      *   *Key realization 3:* The "Frog Duplicate" is a killer for strict Causal Role views. If function is just "what it does," the lightning frog's heart has a function. But intuitively (and philosophically), it doesn't.
      *   *Pivot:* I need to structure this not as "Here is the One True Theory" but as "Here are the Competing Demands." I will start by trying to build a unified list, realize it breaks on specific cases (like Metagenomics vs. Frog), and then categorize the criteria by "Must Haves" vs. "Context-Dependent."
      *   *Refining the "Change Mind" instruction:* I shouldn't just present a static block of text. I should explicitly narrate the tension. "I started thinking X, but Case Y forces me to adjust..."

  3.  **Drafting the Criteria (Iterative Process):**

      *   *Criterion 1: Distinction between Function and Effect.* (The Heart Case). Must exclude "making noise." *Verdict:* Non-negotiable. Both sides agree here, just for different reasons.
      *   *Criterion 2: Normativity/Malfunction.* (The Malfunction Case). Must allow for a heart to *fail* at its function. Causal Role struggles here (if it doesn't pump, does it still have the function?). Etiological handles this well (it's *supposed* to pump). *Verdict:* Non-negotiable for Medicine/Phys, maybe less for Molecular.
      *   *Criterion 3: History Independence.* (The Metagenomics/First Heart Case). Can we ascribe function without knowing the selection history? *Verdict:* Non-negotiable for Molecular/Metagenomics. This directly contradicts strict Etiological views.
      *   *Criterion 4: History Dependence.* (The Frog Duplicate/Synthetic Cell Case). Does a thing need a past to have a function? *Verdict:* Non-negotiable for Evo/Philosophy intuition, but biologists ignore this in the lab.
      *   *Criterion 5: Level Specificity.* (Selfish Genes). Can function be relative to the level (gene vs. organism)? *Verdict:* Non-negotiable.
      *   *Criterion 6: Explanatory Power.* (What function statements do). Must explain presence or support counterfactuals. *Verdict:* Non-negotiable.

      *   *Conflict:* Criterion 3 and 4 are mutually exclusive in a monist framework.
      *   *Resolution:* The "Adequacy" depends on the *field*. The prompt asks for adequacy *across four settings*. This implies I need to evaluate if one theory fits all. I suspect the answer is "No single theory fits all." I need to be bold about this.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the Ravi debate. Set the stage (Cummins vs. Millikan territory). State the intention to test the limits.
      *   **Phase 1: The Unified Wish List (Brainstorming):** Try to list what we *want* a theory to do.
      *   **Phase 2: Stress Testing (The 11 Cases):** Go through the user's cases and see where the wish list breaks. *This is where I show the "changing mind" aspect.* I'll explicitly note where I want to demand history, then realize Metagenomics kills that demand.
      *   **Phase 3: The Specification (The Table/List):** Formalize the criteria with verdicts (Non-negotiable, Preference, Prejudice).
      *   **Phase 4: The Inconsistency Report:** Highlight the fatal tension (History vs. Ahistorical).
      *   **Phase 5: Theory Scorecard:** Briefly run Etiological, Causal Role, and Pluralist against the findings.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just summarize Millikan and Cummins. I need to speak to the *biologist's commitment*. When a molecular biologist says "function," are they making a historical claim? No. When an evolutionary biologist says it, are they? Yes.
      *   *Correction on "Synthetic Cell":* The user's friend (Physiologist) says it has function. The user (Historian) says no. Who is right *for the practice*? In synthetic biology, if it boots up, they treat it as functional. So for *practice*, history might be less relevant than capacity. But for *explanation of existence*, history matters. I need to distinguish "Function of a trait" vs. "Function of a system."
      *   *Medical Case:* Wakefield's "Harmful Dysfunction." If function is purely causal, "dysfunction" is just "different causal role." To get "dysfunction," you need a norm. Where does the norm come from? History (selected effect) or Goal (system organization)?
      *   *The "First Heart" Case:* This is the classic "incipient function" problem. If it hasn't been selected yet, does it have a function? Causal Role says yes (it pumps). Etiological says no (no history yet). Biologists usually say yes (it contributes to survival). This suggests Causal Role is more useful for *physiology*, Etiological for *evolution*.

  6.  **Final Polish:**
      *   Ensure the tone is authoritative but collaborative.
      *   Check all 11 cases are addressed.
      *   Ensure the "Change Mind" instruction is visible (I will use section headers like "First Pass," "The Crack Appears," "Final Specification").
      *   Make sure the "Single Requirement that Excludes Most" is identified clearly. (Likely the "History" requirement).

  7.  **Final Review against constraints:**
      *   No reading list? Check.
      *   Table allowed? Yes.
      *   Brainstorming visible? Yes.
      *   Four settings addressed? Yes.

  *(Self-Correction during final output generation)*: I need to be careful not to be *too* indecisive. The prompt asks me to "think it through carefully before you commit." I will structure the response as a narrative of that thinking process, culminating in a firm specification. I will start by trying to defend a unified view, then dismantle it, then propose the pluralist specification as the only honest answer.

  Let's write.
answer: |-
  Here is the specification you asked for. I'm going to walk you through how I arrive at it, because the tension you felt with Ravi isn't just a disagreement; it's a structural fault line in the concept itself. I started this exercise trying to find a unified set of necessary conditions. I'm going to show you where that attempt broke, because that break is the most important part of the answer.

  ### Phase 1: The Initial Wish List (Trying for Unity)

  My first instinct is to demand that any adequate theory of function must distinguish between *what a trait does* and *what it is for*. This handles your **Heart Case (1)**. The heart makes a thumping noise, holds the pericardium open, and pumps blood. Only one is the function.
  *   **Initial Criterion A:** *Selectivity.* The account must non-arbitrarily select one effect among many as "the function."
  *   **Verdict:** Non-negotiable. If a theory says the heart's function is to make noise, it is useless to biologists.

  Next, I look at **Malfunction (7)** and **Medicine (8)**. If a heart has a septal defect, it fails. But it is still a heart. It has the *function* of pumping blood, even if it fails to perform it.
  *   **Initial Criterion B:** *Normativity.* The account must allow for the possibility of a trait having a function but failing to perform it (dysfunction).
  *   **Verdict:** Non-negotiable for Medicine and Physiology. Without this, "disease" is just "variation."

  Then I look at **Metagenomics (9)** and **Molecular Biology**. Annotators assign "function" to genes from uncultured bacteria based on sequence homology. They know nothing of the selection history. They are predicting catalytic capacity.
  *   **Initial Criterion C:** *History-Independence.* The account must allow function ascription without knowledge of evolutionary history.
  *   **Verdict:** Non-negotiable for Molecular/Genomics.

  *Wait.* I have to stop here. I have a contradiction.
  If **Criterion B (Normativity)** is secured by **History** (i.e., it's supposed to pump because ancestors pumped), then **Criterion C (History-Independence)** is impossible.
  If **Criterion C** is secured by **Current Capacity** (i.e., it pumps because of its structure), then **Criterion B** becomes shaky (why is it "broken" if it just has a different capacity?) and the **Frog Duplicate (2)** becomes a problem. The lightning-strike frog's heart pumps. If function is just capacity, that heart has a function. But you (and most philosophers) feel it doesn't.

  So, my first pass at a unified list fails. The four settings you listed are not playing the same game. I need to break the criteria down by what they are trying to *purchase* for the biologist.

  ### Phase 2: Stress-Testing the Cases (The "Change of Mind")

  Let's run your 11 cases through the two dominant frameworks to see where they bleed.

  1.  **The Heart (Selectivity):**
      *   *Etiological (History):* Pumping is the function because ancestors who pumped survived. Noise was not selected for. **Pass.**
      *   *Causal Role (System):* Pumping is the function because it contributes to the circulatory system's goal. Noise doesn't. **Pass.**
      *   *Verdict:* Both work here. This is why the debate lasts forever; they agree on the easy cases.

  2.  **No-History Items (Synthetic Cell, Lightning Frog):**
      *   *Etiological:* No function. No selection history.
      *   *Causal Role:* Has function. It contributes to the system's capacity.
      *   *Biologist's View:* The synthetic biologist says, "I built this to metabolize X." They treat it as functional immediately. The lightning frog is a thought experiment biologists ignore.
      *   *Verdict:* **Criterion C (History-Independence)** wins for practice, but **History-Dependence** wins for ontology. This is a split.

  3.  **The First Heart (Incipient Function):**
      *   *Etiological:* The very first contractile vessel had no history of selection for pumping. So, strictly, no function yet.
      *   *Causal Role:* It pumped. It contributed to survival. It had a function.
      *   *Verdict:* Biologists hate saying the first heart had "no function." They want to say it had a function *because* it helped the organism. This leans Causal Role.

  4.  **Feathers (Exaptation):**
      *   *Etiological:* Original function = insulation. Current function = flight (if new selection history exists). If insulation use vanished, insulation is no longer a function.
      *   *Causal Role:* Both are functions if both contribute to current fitness.
      *   *Verdict:* Evolutionary biologists care about the *origin* (Etiological). Physiologists care about the *current use* (Causal Role).

  5.  **Lab-Evolved Enzyme (Side Effects):**
      *   *Etiological:* Only the selected reaction is the function. The other is a side effect.
      *   *Causal Role:* Both are functions if both occur.
      *   *Verdict:* In directed evolution, we care about what we selected for. But in drug metabolism, the "side effect" is functionally relevant. Context matters.

  6.  **Selfish Genes (Levels):**
      *   *Requirement:* The account must specify the *level* of the system.
      *   *Verdict:* Non-negotiable. A meiotic drive allele has a function at the gene level (transmission) and a dysfunction at the organism level (fertility loss).

  7.  **Malfunction (Septal Defect vs. Never Worked):**
      *   *Etiological:* Handles the septal defect well (deviation from selected norm). Struggles with "never worked" (e.g., a lethal mutation appearing for the first time). Is it a dysfunction if it was never selected *against* yet? Yes, because it deviates from the functional type.
      *   *Causal Role:* Struggles. If the trait exists, it has causal powers. Calling it "dysfunctional" requires importing a norm from outside the system.
      *   *Verdict:* Medicine *needs* Etiological norms to define "disease" objectively (Wakefield's Harmful Dysfunction).

  8.  **Medical Use (Normativity):**
      *   *Verdict:* As above. Purely descriptive accounts fail here. You cannot get "ought" (health) from "is" (causal role) without a historical or goal-directed baseline.

  9.  **Metagenomics (Unknown History):**
      *   *Verdict:* This is the killer for strict Etiological views. We annotate function daily without history. We infer function from structure/homology. This is a *Causal Role* practice disguised as Etiological (we assume homology implies shared history, but we are measuring capacity).

  10. **Artifacts (Carburetors):**
      *   *Verdict:* If your theory covers organisms, must it cover artifacts? Artifacts have history (designer intent). Organisms have history (selection). If you deny artifacts have functions, you look silly. If you include them, you blur the life/non-life line.
      *   *Decision:* This is a **Prejudice**. Biological function accounts don't *need* to cover drones. In fact, a principled asymmetry (organisms = selection, artifacts = intent) is a feature, not a bug.

  11. **Explanatory Role (Counterfactuals):**
      *   *Verdict:* Non-negotiable. "The function of the heart is to pump" must support "If the heart didn't pump, the organism would die."

  ### Phase 3: The Specification of Adequacy

  You asked for the specification of what an account must deliver to be adequate for *working biologists*. Based on the stress test, I cannot give you one list. I must give you a **Matrix of Adequacy**. A theory is adequate *relative to the sub-discipline*.

  However, there are meta-criteria that any *philosophical* account must handle to explain *why* the sub-disciplines differ.

  Here is the specification table.

  | Criterion | Specification | Motivating Case(s) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1. Effect Selection** | Must distinguish the function from the infinite set of causal effects. | (1) Heart noise vs. pumping. | **Non-Negotiable** |
  | **2. Normative Baseline** | Must provide a baseline against which "malfunction" is measurable, distinct from statistical rarity. | (7) Septal defect, (8) Medical dysfunction. | **Non-Negotiable (for Med/Phys)** |
  | **3. History Access** | Must allow function ascription without access to phylogenetic history. | (9) Metagenomics, (2) Synthetic cell. | **Non-Negotiable (for Mol/Evo Lab)** |
  | **4. Level Relativity** | Must specify the system level (gene, organism, group) at which the function is ascribed. | (6) Selfish genes. | **Non-Negotiable** |
  | **5. Incipient Capacity** | Must account for traits that contribute to survival before selection has fixed them. | (3) The first heart. | **Preference (Evo Biol)** |
  | **6. Explanatory Power** | Must support counterfactuals (if X were absent, Y would fail). | (11) Explanation vs. Redescription. | **Non-Negotiable** |
  | **7. Artifact Symmetry** | Must treat biological and artificial functions identically. | (10) Carburetors vs. Hearts. | **Prejudice** (Reject this) |
  | **8. Singular Definition** | There must be one definition of "function" valid across all biology. | All cases. | **False** (See below) |

  ### Phase 4: The Inconsistency Report

  Here is the verdict you and Ravi were looking for, but didn't quite articulate.

  **The List is Internally Inconsistent.**
  You cannot jointly satisfy **Criterion 2 (Normative Baseline)** and **Criterion 3 (History Access)** with a single monistic theory.

  *   To get **Normativity** (Medicine/Physiology), you need a "proper" state to compare against. The only non-arbitrary "proper" state in biology is **History** (what was selected for) or **System Goal** (what maintains the organism).
  *   To get **History Access** (Metagenomics/Synthetic Bio), you must ignore history and look at **Current Capacity**.
  *   But **Current Capacity** cannot ground **Normativity**. If function is just "what it does," then a cancer cell metabolizing glucose is functioning perfectly. It is only "dysfunctional" relative to the organism's historical design or systemic integrity.

  **The Single Requirement That Excludes the Most Theories:**
  **Criterion 3 (History Access / Ahistorical Ascription).**
  *   Strict **Etiological Theories** (Millikan, Neander) fail here. They say you *cannot* ascribe function to the synthetic cell or the metagenomic gene without a selection history. This makes them inadequate for Molecular Biology and Synthetic Biology practice.
  *   Strict **Causal Role Theories** (Cummins) pass here, but they fail **Criterion 2 (Normativity)**. They struggle to explain why a septal defect is a *failure* rather than just a *different role*, and they admit the Lightning Frog's heart has a function (which violates intuition).

  **The Resolution:**
  You suspected the four settings aren't doing the same thing. You are right.
  *   **Evolutionary Biology** uses **Etiological Function**. (Why is this trait here? What was it selected for?)
  *   **Molecular Biology & Metagenomics** uses **Causal Role Function**. (What does this molecule do in the assay?)
  *   **Medicine & Physiology** uses a **Hybrid**. They need the Causal Role to diagnose (what is it failing to do?) but the Etiological history to define "health" (what *should* it be doing?).
  *   **Synthetic Biology** is the edge case. It treats artifacts as organisms. It uses **Design Function** (Intent), which maps onto Etiological function but compresses the timeline.

  ### Phase 5: Scoring the Theories (Briefly)

  1.  **Etiological (Selected Effect):**
      *   *Strengths:* Solves Heart Noise, Malfunction, Lightning Frog.
      *   *Weaknesses:* Fails Metagenomics, Fails First Heart, Fails Synthetic Cell (technically).
      *   *Adequacy:* High for Evo Bio, Low for Mol Bio.

  2.  **Causal Role (Systemic Contribution):**
      *   *Strengths:* Solves Metagenomics, First Heart, Synthetic Cell.
      *   *Weaknesses:* Fails Heart Noise (too permissive), Fails Malfunction (no norm), Fails Lightning Frog (false positive).
      *   *Adequacy:* High for Mol Bio, Low for Medicine/Evo Bio.

  3.  **Pluralist/Pragmatist (The Recommendation):**
      *   *View:* "Function" is not a natural kind. It is a tool.
      *   *Verdict:* This is the only view that survives your 11 cases. When a biologist writes "the function of X is...", you must ask: **"Are you explaining its presence (Evo) or its capacity (Mol)?"**
      *   *Adequacy:* High for all, provided the user specifies the context.

  ### Final Word to You and Ravi

  Ravi (the Physiologist) is right that for the *practice* of physiology, the synthetic cell has a function. If it pumps, it functions. If it stops, it's broken. He is operating in a **Causal Role** framework with an implicit **System Goal** (the life of the cell).

  You (the Historian) are right that for the *explanation of existence*, the synthetic cell has no proper function yet. It has no history. It is an artifact. You are operating in an **Etiological** framework.

  **The Specification:**
  An account of biological function is adequate if and only if it:
  1.  **Declares its Level:** (Gene, Organism, System).
  2.  **Declares its Timeframe:** (Current Capacity vs. Historical Selection).
  3.  **Provides a Norm:** (Either Statistical/Systemic integrity or Historical Success).

  If a theory claims to do all three simultaneously without context, it is lying. Tell Ravi he's doing Physiology, not Ontology. Tell yourself you're doing Ontology, not Lab Work. You're both right, but you're speaking different dialects of the same word.
