  Based on the precedents you've provided, here is the breakdown of the machinery running your friend's judgments, the verdict on the VR case, and the specific edge case that would expose the limits of her logic.

  ### 1. The Verdict
  **She would likely call this a legitimate Platonic symposium.**

  The case fits every positive criterion she has established and violates none of her negative prohibitions.
  *   **Age:** 45 (Passes the >30 rule).
  *   **Supervision:** Government-approved (Passes the State-Symposium rule).
  *   **Substance:** VR Protocol (Passes the Medium Neutrality rule established by "synthetic mind-openers").
  *   **Cognitive State:** Reason intact, filters suppressed (Passes the Therapy rule).
  *   **Purpose:** Screening/Testing character (Passes the Teleology rule).

  ### 2. The Machinery: "Sovereign Reason under State Teleology"
  Your friend is not running a rule about wine, nor strictly about inhibition. She is operating on a **Functionalist Hierarchy of the Soul**. Her logic relies on three axioms:

  1.  **The Sovereignty of Logos:** The rational part of the soul must remain in command. If reasoning is intact (as in therapy or this VR case), the method of inhibition (wine, synthetics, VR) is morally neutral.
  2.  **The Teleology of Alteration:** Altered states are only permissible if they serve a diagnostic or educational end (testing character, therapy). If the end is pleasure (private fun), the act is corrupt.
  3.  **The Hierarchy of Office:** The stricter the public trust, the stricter the prohibition on alteration. (Magistrates = Zero tolerance; Citizens = Conditional tolerance).

  **The Closest Analog:**
  The **Synthetic "Mind-Openers" in Therapy** case.
  *   *Why:* Both involve a non-alcoholic medium, state/doctor sanction, and the specific condition that reasoning remains untouched while inhibitions are lowered. The VR case is essentially "digital therapy" applied to "civic health" rather than "mental health."

  ### 3. Underdetermination: If She Says "No"
  If she rejects the VR case despite it fitting her criteria, she is secretly holding one of two principles that her previous statements haven't fully revealed.

  *   **Choice A (She says No): The Naturalist Principle.**
      *   *Principle:* True character testing requires a *physiological* challenge (like wine affecting the blood/body), not a digital simulation.
      *   *Implication:* She believes the "test" requires the body to be vulnerable, not just the mind. VR is "fake" courage because the body isn't actually intoxicated.
  *   **Choice B (She says No): The Volition Principle.**
      *   *Principle:* Character can only be tested if the subject *chooses* to lower their guard.
      *   *Implication:* A "protocol" implies a forced procedure. If the state *makes* you do it to keep your job, it's coercion, not testing. (Plato's symposia were educational gatherings, not mandatory screenings).

  ### 4. The Splitter Case
  To truly isolate which gear is turning in her machine, you need a case that pits **The Sovereignty of Logos** against **The Hierarchy of Office**.

  **The Case:**
  > **A sitting Magistrate (currently in power) uses the exact same VR protocol (Reason intact, filters suppressed) to deliberate on a complex policy verdict.**

  **Why this splits the rules:**
  *   **Scenario 1: She says this is Forbidden.**
      *   *The Rule Revealed:* **The Absolute Sobriety of Rulers.**
      *   It means her ban on magistrates isn't about *impairment* (since reason is intact), but about *alteration* itself. A ruler must be in their baseline natural state, period. The "Reason Intact" exception applies only to citizens/patients, never to rulers.
  *   **Scenario 2: She says this is Permitted.**
      *   *The Rule Revealed:* **The Functional Integrity of Reason.**
      *   It means her ban on magistrates was specifically about *wine/intoxication* impairing judgment. If Reason is sovereign, the medium doesn't matter, even for a ruler. This would contradict the spirit of "never okay even with just one cup," suggesting the "one cup" rule was a proxy for impairment, not an absolute ban on substances.

  **Summary:**
  The VR screening case is a "easy pass" under her current logic. The **Sitting Magistrate VR** case is the stress test. It forces her to decide if the Magistrate ban is about **Chemical Purity** (No wine/drugs/VR) or **Cognitive Function** (No impaired reason). That is the hidden fault line in her jurisprudence.
