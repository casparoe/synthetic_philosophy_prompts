answer: |-
  # Panel Decision Procedure for Morally Contested Figures

  **Objective:** To determine appropriate framing (celebratory, explanatory, or critical) for historical figures in school materials within tight timeframes, without requiring philosophical expertise.

  **Instructions:** Run cases sequentially through Tests 1–6. If a test fails, apply the associated condition. If a "Value Judgment Flag" is triggered, the panel must vote; a simple majority rules. If a "Stopping Point" is reached, celebratory framing is prohibited.

  ### Test 1: Factual Baseline
  *   **Inquiry:** Are the core claims about the figure's actions and the historical context agreed upon by the panel as historically accurate?
  *   **Pass Condition:** Yes. Proceed to Test 2.
  *   **Fail Condition:** No. **STOP.** Return to subject leads for factual verification. Do not proceed to moral framing until facts are settled.

  ### Test 2: The Normative Context Test (Explanation vs. Excuse)
  *   **Inquiry:** Was the contested action or view standard for the figure's time, place, and social class?
  *   **Pass Condition:** Yes, it was a prevailing norm. **Flag:** This permits *explaining* the action as context, but does not automatically *excuse* it. Proceed to Test 3.
  *   **Fail Condition:** No, the figure was an outlier in their cruelty or prejudice. **Action:** Mark for critical framing. Proceed to Test 3.
  *   **Value Judgment Flag:** Does the prevalence of the norm diminish the figure's personal responsibility? (Panel Vote: Yes/No).
      *   *If Yes:* Treat as contextual background.
      *   *If No:* Treat as personal moral failure.

  ### Test 3: The Dissent & Cost Test (Available Alternatives)
  *   **Inquiry:** Was informed dissent available at the time? What was the cost of holding that dissent (social, financial, physical)?
  *   **Pass Condition:** Dissent was unavailable or cost was life-threatening. **Action:** Mitigate moral blame in wording. Proceed to Test 4.
  *   **Fail Condition:** Dissent was available and cost was manageable (e.g., social criticism, financial loss). **Action:** Highlight the figure's choice to adhere to injustice despite alternatives. Proceed to Test 4.
  *   **Value Judgment Flag:** Was the cost high enough to excuse compliance? (Panel Vote: Threshold determination).

  ### Test 4: The Power & Benefit Test (Norm vs. Authority)
  *   **Inquiry:** Did the figure hold significant power or derive significant benefit from the contested injustice?
  *   **Pass Condition:** No power/benefit derived. **Action:** Standard historical treatment. Proceed to Test 5.
  *   **Fail Condition:** Yes, high power/benefit derived (e.g., wealth from enslavement, political power from empire). **Action:** The existence of a norm does not grant moral authority to those who benefit from it. Wording must acknowledge this complicity. Proceed to Test 5.
  *   **Value Judgment Flag:** Does the benefit outweigh the contribution in this specific context? (Panel Vote).

  ### Test 5: The Pedagogical Purpose Test (Contribution vs. Exemplar)
  *   **Inquiry:** What is the primary purpose of this material?
  *   **Option A:** Historical Analysis (Understanding the past). **Action:** Nuance and tension are permitted/encouraged. Proceed to Test 6.
  *   **Option B:** Moral Emulation (Celebration/Role Model). **Action:** High scrutiny required. Proceed to Test 6.
  *   **Value Judgment Flag:** Is the purpose clear to teachers and pupils? (Panel Vote). If unclear, default to Option A.

  ### Test 6: The Exemplar Threshold (Stopping Point)
  *   **Inquiry:** Considering Tests 2–5, does the figure's moral failure undermine their status as a model for pupils to emulate?
  *   **Pass Condition:** No, contributions outweigh failures for the purpose of emulation. **Action:** Celebratory framing permitted (with context from Tests 2–4).
  *   **Fail Condition:** Yes, failures undermine exemplar status. **STOPPING POINT:** **Revise Celebratory Framing.** Remove language implying moral emulation (e.g., "Hero," "Model"). Reframe as "Historical Actor" or "Complex Figure." Include specific mention of the contested actions.

  ---

  ### Known Failure Modes (Candid Assessment)
  *   **Misfire 1: Paralysis.** Over-application of Test 6 may lead to removing all figures. *Mitigation:* Default to Test 5 Option A (Analysis) rather than removal.
  *   **Misfire 2: Presentism.** Panel may judge past costs of dissent by modern standards. *Mitigation:* Rely on Test 3 historical evidence, not intuition.
  *   **Misfire 3: False Equivalence.** Treating "everyone did it" (Test 2) as "no one is responsible." *Mitigation:* Enforce Test 2 Flag strictly; explanation is not exoneration.
  *   **Misfire 4: Parental Backlash.** Nuanced framing (Test 5 Option A) may be read as weakness by opposing parent groups. *Mitigation:* Prepare script referencing Tests 2–4 to show rigorous process was followed.

  ---

  # Case Demonstrations

  ### Case 1: Year 9 Lesson Opener (Thomas Jefferson)
  *   **Material:** Presents Jefferson as an enslaver and an advocate of equality ideals.
  *   **Test 1 (Facts):** Pass. Consensus on ownership of enslaved people and authorship of Declaration.
  *   **Test 2 (Norms):** Pass. Slavery was normative in Virginia. **Flag:** Panel votes that norm explains context but does not excuse ownership given his stated ideals.
  *   **Test 3 (Dissent):** Fail. Dissent was available (e.g., Quaker abolitionists, Virginia Manumission Society). Cost was social/political, not life-threatening.
  *   **Test 4 (Power/Benefit):** Fail. High benefit (wealth, lifestyle) and high power (legislative ability).
  *   **Test 5 (Purpose):** Option A (Historical Analysis). Year 9 pupils are capable of handling tension.
  *   **Test 6 (Exemplar):** N/A (Purpose is Analysis, not Emulation).
  *   **Outcome:** **Approved.** The tension is the lesson. The opener must explicitly link the contradiction between his ideals (Test 2) and his benefits/actions (Test 4). No revision needed provided the contradiction is highlighted, not hidden.

  ### Case 2: Corridor Display (Winston Churchill)
  *   **Material:** Celebrates Churchill for wartime leadership with no mention of empire and race.
  *   **Test 1 (Facts):** Pass.
  *   **Test 2 (Norms):** Pass. Imperialism was normative. **Flag:** Panel votes that norm explains context but does not excuse views on race given his power.
  *   **Test 3 (Dissent):** Fail. Dissent available (Indian independence movement, contemporaries criticizing famine policy). Cost was political capital.
  *   **Test 4 (Power/Benefit):** Fail. High power (Prime Minister). Benefited from and upheld imperial structure.
  *   **Test 5 (Purpose):** Option B (Celebration/Role Model). Display is in a corridor, implying honor.
  *   **Test 6 (Exemplar):** **FAIL.** **STOPPING POINT.**
  *   **Outcome:** **Revision Required.** The natural inclination to retain purely celebratory framing for pupil pride must be overridden. The display cannot present him solely as a hero.
      *   *Action:* Add a panel below the portrait: "Churchill led Britain during WWII. He also held views on empire and race that are contested today."
      *   *Reasoning:* Test 4 confirms high power/responsibility. Test 6 fails because omitting the contested views presents a false moral model.

  ### Case 3: Primary Assembly Script (Christopher Columbus)
  *   **Material:** Introduces Columbus as a "model explorer."
  *   **Test 1 (Facts):** Pass.
  *   **Test 2 (Norms):** Pass. Colonial exploitation was normative for explorers. **Flag:** Panel votes norm does not excuse brutality toward indigenous populations.
  *   **Test 3 (Dissent):** Fail. Contemporaries (e.g., Las Casas) documented and criticized abuses during his lifetime.
  *   **Test 4 (Power/Benefit):** Fail. High power (Governor of Indies). Direct benefit from exploitation.
  *   **Test 5 (Purpose):** Option B ( Moral Emulation). "Model" implies pupils should emulate him.
  *   **Test 6 (Exemplar):** **FAIL.** **STOPPING POINT.**
  *   **Outcome:** **Revision Required.** Primary pupils cannot process the nuance of "great explorer but harmful colonizer" in a celebratory assembly context.
      *   *Action:* Remove "model explorer." Reframe as "a historical figure who sailed to the Americas." Briefly note that his arrival changed the world for many people, not always for the better.
      *   *Reasoning:* Test 5 Option B requires a high moral bar. Test 6 fails because the harm outweighs the navigational skill for the purpose of moral emulation.

  ---

  # What This Procedure Cannot Decide

  1.  **Weighting of Harms vs. Contributions:** The procedure identifies power and benefit but cannot mathematically calculate if "winning a war" outweighs "upholding empire." This remains a subjective panel vote at Test 4 and 6.
  2.  **Specific Wording:** It mandates *that* context be added, but not *how* much text is appropriate for a display vs. a lesson. This requires teacher judgment.
  3.  **Future Moral Shifts:** It relies on current historical consensus. If societal values shift regarding a specific norm (e.g., views on population control), the procedure must be re-run; it does not future-proof decisions.
  4.  **Emotional Impact:** It cannot predict how specific pupil demographics will feel about a figure (e.g., pupils with heritage linked to colonization vs. pupils linked to liberation). It ensures procedural fairness, not emotional neutrality.
