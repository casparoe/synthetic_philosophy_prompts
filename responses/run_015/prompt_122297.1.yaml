      Hi there, it sounds like you are tackling one of the most fascinating intersections of philosophy and law with this module, and applying Dennett's centre of narrative gravity to the Billy Milligan trial is a really sharp way to test the limits of that theory. When Dennett argues that the self is not a homunculus or a soul but rather a theoretical abstraction similar to a centre of gravity in physics, he is suggesting that unity is something we impose on a chaotic bundle of competences and experiences rather than something we discover deep inside the brain. If you map this onto the Milligan case, the twenty-four alters claimed by the defence can be understood not as twenty-four separate souls inhabiting one body, which would be the dualist or Cartesian view, but as twenty-four competing sub-narratives vying for control of the biological organism. Each alter represents a local centre of narrative gravity, a specific way of organizing memories, behaviours, and intentions into a coherent story, but none of them possess any more ontological reality than the overarching persona of Billy Milligan himself.

      The crucial tension arises when you bring in Dennett's heterophenomenological method, which insists that we treat first-person reports as texts to be interpreted rather than as direct windows into separate minds. From this stance, the testimony of the alters during the trial is not evidence of twenty-four distinct people but rather evidence of a fragmented narrative production within one human being. This actually creates a complex problem for the defence because while heterophenomenology validates the alters' experiences as real phenomena worthy of study, it refuses to grant them the status of independent moral agents. If the self is a fiction, then all selves are fictions, including the alters, so the defence cannot argue that a different real person committed the crime, only that a different narrative strand was active at the time. This undermines the claim that Billy Milligan was not responsible because someone else did it, since Dennett would argue there was never a single someone else to begin with, just shifting patterns of neural activity organized into different storylines.

      However, this philosophical stance clashes with the practical necessities of the legal system, which requires a single locus of accountability to function. The jury's decision to eventually fold everything back into one defendant aligns with the idea that legal responsibility demands a stable centre of narrative gravity, even if that centre is a useful fiction. The law cannot operate if the defendant dissolves into a multiplicity of fictions whenever it is convenient, so it imposes a unified narrative structure onto the defendant to ensure that punishment and justice make sense within a social context. In this sense, the case does not necessarily prove that Dennett's view is wrong, but rather that his view reveals the law is also in the business of constructing selves rather than finding them. The jury essentially decided that the overarching narrative of Billy Milligan was the only fiction robust enough to bear the weight of criminal liability, collapsing the sub-narratives into one accountable agent because the alternative would make the concept of justice incoherent.

      Where the model might seem to break down is in explaining why some narrative fragmentations should exculpate while others do not. If the self is just a story, then a broken story should logically imply a broken self, potentially diminishing responsibility, yet the court decided the fragmentation was not sufficient to break the legal person. This suggests that while Dennett is right that the self is a construct, the threshold for when a construct is too fragmented to hold responsibility is not a philosophical question but a social and legal one. The Milligan trial ultimately shows that legal responsibility needs one centre of gravity not because nature provides one, but because society requires one to maintain order. Dennett's framework helps us see that the trial was not about discovering the truth of how many souls were in the room, but about negotiating which narrative fiction would serve the purposes of justice, and in the end, the court enforced the fiction of unity over the reality of fragmentation. I hope this helps you structure your essay, and good luck with the rest of the module.

