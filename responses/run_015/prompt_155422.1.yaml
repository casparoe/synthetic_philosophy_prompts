answer: |-
  **Project Title:** The Agency-Cost Confound: Disentangling Preference from Action Cost in Behavioral Inference

  **1. Problem Statement and Background**
  Contemporary AI systems increasingly infer human preferences from observed behavior to align objectives (Inverse Reinforcement Learning) or rank outputs (Preference Learning). The technical setup is standard: we observe an agent acting over time in an environment; we assume the agent is approximately optimal with respect to some reward function, with departures from optimality treated as noise governed by a single "temperature" or rationality parameter; and we infer the reward function that best rationalizes the observed behavior under that assumption.

  > **[MARGIN NOTE: (a) Settled Background]**
  > *Reviewers in both ML and Philosophy should accept this characterization. The necessity of a rationality assumption for inference and the under-identification of reward (up to positive rescaling and potential-based shaping) are standard results in the technical literature.*

  Without an assumption about rationality, behavior constrains the reward function hardly at all. Even with a fixed rationality model, the recovered reward is identified only up to certain transformations. The current literature treats the rationality parameter as a technical nuisance governing noise. We argue it is doing normative work. Departures from optimality are not merely noise about what the agent wants; some are the measurable trace of what it *costs* that agent to convert desire into action.

  Two agents with identical preferences but different costs of acting—one managing executive dysfunction, one navigating an inaccessible interface, one whose attention is consumed by care work—will produce different behavior. The standard model will assign the higher-friction agent a lower reward on precisely the outcomes she fails to pursue. We call this the **Agency-Cost Confound**. Because action costs correlate with social marginalization (disability, resource scarcity, time poverty), standard inference systematically underestimates the preferences of disadvantaged agents, encoding inequality into the objective function.

  **2. The Research Question**
  The question is not whether the confound exists, but whether it is resolvable and how to handle it when it is not.
  1.  **Identifiability:** In principle, and with what additional observations (e.g., reaction time, physiological load, environmental constraints), can a system distinguish an agent who cares less about an outcome from an agent who pays more to act on it?
  2.  **Normative Defaults:** When available data cannot separate preference from cost, what should a system assume? Does the right default depend on whether the inference is being used to *assist* a particular person (where we might privilege the agent's implicit goals) or to *aggregate* many people's inferred preferences into a social choice (where we might privilege revealed behavior to respect sovereignty)?

  > **[MARGIN NOTE: (c) Conjecture]**
  > *This is the core hypothesis. It is not established that auxiliary data (like reaction time) resolves the confound, nor is it established that normative defaults should vary by context (assistance vs. aggregation). This is what the grant funds.*

  **3. Limitations of Existing Approaches**
  The machine-learning side treats misspecification of the rationality model as estimation error to be averaged away. The standard fix is fitting a per-agent noise parameter. However, a single temperature parameter conflates *uncertainty* with *friction*. Increasing the temperature lowers the penalty for sub-optimal actions, but it does not allow the system to learn that a specific action is sub-optimal *because it is expensive*, not because it is unwanted.

  > **[MARGIN NOTE: (b) Contested]**
  > *ML reviewers may object that fitting a per-agent temperature already dissolves the problem. We contend it does not, as it scales noise globally rather than attributing cost to specific state transitions. This is a technical dispute the project will address formally.*

  The philosophical side discusses adaptive preferences and informed desire but generally assumes the agent can be consulted. In large-scale system alignment, consultation is impossible. Relying on self-report introduces new biases (social desirability, introspective limits) and fails to capture the structural constraints the agent faces. Abandoning reward inference for a mere partial order over trajectories avoids the confound but renders the system too weak for deployment in complex environments. We must solve the inference problem, not bypass it.

  **4. Methodology and Work Plan (12 Months)**
  **Months 1–3: Formalization.** We will extend the standard Boltzmann rationality model to explicitly separate *intrinsic reward* ($R$) from *action cost* ($C$). We will map the equivalence classes of $(R, C)$ pairs that yield identical behavioral distributions under standard observation.
  **Months 4–8: Identifiability Analysis.** We will test whether adding specific auxiliary channels (e.g., time-to-action, measures of cognitive load, explicit constraints on the action space) breaks the equivalence. We will use synthetic agents with known $R$ and $C$ to quantify the sample complexity required to disentangle them.
  **Months 9–12: Normative Framework.** We will draft a decision procedure for cases where $R$ and $C$ remain indistinguishable. We will distinguish between *assistive contexts* (maximize inferred $R$ despite high $C$) and *aggregative contexts* (weight inferred $R$ by realized $C$ to avoid imposing burdens).

  > **[MARGIN NOTE: (c) Conjecture / Risk]**
  > *We conjecture that time-to-action is a sufficient auxiliary signal to break the confound in simple environments. This may fail in complex environments where deliberation time is decoupled from motor cost. This is a key risk.*

  **5. Why This Approach?**
  We reject asking people directly because preference elicitation is often coercive or unreliable for the populations most affected by the confound. We reject adding self-report as a noisy channel because it treats the structural constraint as a measurement error rather than a feature of the environment. We reject abandoning reward inference because downstream systems require scalar objectives for optimization. Our approach isolates the specific mathematical locus of the bias (the rationality parameter) and targets it directly.

  **6. Deliverables**
  1.  **Technical Specification:** A "Confounding-Aware IRL" module that outputs a distribution over $(R, C)$ pairs rather than a point estimate of $R$, flagging high-uncertainty regions where cost and preference are entangled.
  2.  **Normative Guidelines:** A policy brief for system designers specifying when to prioritize inferred desire over revealed choice, tailored to assistive vs. aggregative use-cases.

  **7. Failure Conditions**
  We must be honest about what counts as failure.
  1.  **Redescription:** The project fails if the "Agency-Cost Confound" turns out to be a familiar problem—partial observability, exploration, or plain reward unidentifiability—restated in new vocabulary without yielding new mathematical leverage.
      > **[MARGIN NOTE: (b) Contested / Objection]**
      > *ML reviewers may argue this IS just partial observability (the cost is a hidden state variable). If we cannot show that treating it as 'cost' rather than 'state' changes the identification conditions, the philosophical framing adds no value.*
  2.  **Indistinguishability:** The project fails if we prove that $R$ and $C$ are mathematically indistinguishable from behavior alone, even with auxiliary signals like reaction time, without invasive physiological data.
  3.  **Normative Irrelevance:** The project fails if the normative half never becomes decision-relevant—i.e., if the uncertainty regions are so small that the default assumption never triggers in practical deployments.

  > **[MARGIN NOTE: (c) Conjecture]**
  > *We suspect the uncertainty regions will be large in high-stakes domains (healthcare, resource allocation), making the normative guidelines critical. If they are negligible, the social impact is limited.*

  **8. Conclusion**
  This project moves the debate from "bias in datasets" to "bias in the inference engine." By treating the rationality parameter as a site of normative contestation rather than a technical hyperparameter, we aim to prevent AI systems from learning that marginalized agents want less simply because they do less.
