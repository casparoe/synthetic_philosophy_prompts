  please dont ask me for citations or bibliographies, i dont have access to check them and i need to speak from memory. also avoid super niche theories i wouldnt have memorized; stick to stuff a phd student in this area could reasonably defend without looking things up. inject one slightly unconventional framing—maybe about "fiscal ecclesiology" or "reverse establishment"—so the prompt isnt just regurgitating standard church-state debates. write casually, like youre talking to a grad student who is panicking a little. include a typo or two if it feels natural.
