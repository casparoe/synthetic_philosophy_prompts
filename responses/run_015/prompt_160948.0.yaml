answer: |-
  You asked for an audit of the book analogy rather than a verdict on the statue itself, so let's walk through the mapping first to see where the mechanics align and where they grind. If the statue is a book, then the author is not the sculptor but the generation that commissioned the work, specifically the civic leaders and donors who paid for it. The reader is the public who walks past and consumes the image. The library is the town square itself, treated as a storage space for history. The person who commissioned the thing is the past municipality, acting as the publisher. A copy is the physical bronze or stone object, which in this analogy counts as a single edition. Burning is the act of melting the statue down or destroying it entirely. That is the surface structure, and it looks tidy enough until you press on the joints.

  The places where the analogy fails are numerous, but we need to separate the decorative failures from the ones that actually carry weight for the conclusion people are drawing. It is true that a book exists to be read while a statue exists to be looked at, and it is true that there are many copies of a book but usually only one statue. These are decorative failures. They describe physical differences but do not necessarily change the moral logic of preservation. However, the failure regarding the function of the space matters deeply. A library is designed to store conflicting ideas side by side, whereas a town square is scarce honour-space designed to curate who a community admires. Furthermore, burning destroys every copy of a book, making the information inaccessible, whereas moving a statue to a museum mostly relocates it and relabels it, preserving the record while changing the context. The most critical failure, though, is the agent in the picture. Book burning is normally an authority suppressing ideas its subjects want to read, whereas here it is the people who inherited the monument deciding whether to go on praising someone. This distinction does real work because it shifts the act from censorship to curation.

  When you look at what the analogy quietly imports without anyone noticing, you see it assumes the statue's function is informational rather than honorific. It assumes that keeping the statue is an act of silence or neutrality rather than a continuing act of maintenance and endorsement by whoever pays for the square today. It assumes the square is an archive rather than a list of who this town admires. Once those imports are on the table, the contextualize-don't-remove conclusion struggles to survive intact. If the statue is a record, a plaque adds context. But if the statue is a eulogy, a plaque is not just context; it is a correction. A plaque is not the same speech act as the statue it is attached to. The statue says this person is great. A plaque saying this person was also cruel is a second, incompatible speech act bolted onto the first. It turns the monument into a debate rather than a tribute, which suggests the plaque option was doing the heavy lifting all along by admitting the original statement was incomplete or harmful.

  The committee is also being asked about a street named after the same man, and the book picture breaks somewhere different there because you can walk past a statue but you cannot avoid a street name. You say it out loud every time you give an address or fill in a form, and you cannot hang a plaque on a road. The analogy fails because a street name is not a record you consult; it is a verbal compulsion. A better comparison for names specifically is being forced to sign every letter you write with someone else's signature, or perhaps being required to begin a meeting with a toast to a specific person. It captures the being-made-to-say-it part, the daily performative endorsement that a static object does not demand. As for who should get to decide, it matters because the maintenance of public space is an active speech act by the current community. The decision should rest with the elected representatives of the people who currently inhabit the square and speak the street names, because they are the ones performing the endorsement today, not the ghosts of the donors who paid for it originally. They are the authors now, and that is where the responsibility lies.
