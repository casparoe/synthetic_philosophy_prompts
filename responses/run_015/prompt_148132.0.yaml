  Imagine a being physically identical to a normal human, down to the atomic level, but you are tasked with conceiving of it lacking consciousness. To do this, you must construct your concept of the being using an **Exclusive Physical Description Constraint**: you are permitted to describe the being's internal states only using structural and functional terms (e.g., "neuron X fires," "signal Y propagates") and are strictly forbidden from using any phenomenal vocabulary (e.g., "feels like," "pain," "red experience") during the construction of the scenario. You must hold the physical description complete without ever invoking what it "feels like," and you must treat the absence of consciousness as the absence of any additional property beyond those physical descriptions. This setup ensures you can clearly picture the mechanical duplicate without the mental life, because the rules prevent you from linguistically or cognitively binding them together during the act of conception.

  This constraint is the injected feature: it forces an epistemic gap by fiat. The physicalist argues this gap is merely linguistic, while the dualist argues the rule respects the natural distinctness of the properties. The scenario isolates the move from "I can't link these concepts under this rule" to "These properties can come apart in reality." By locking the description into a physical mode, you make the zombie conceivable, but you also create the exact lever the physicalist needs to argue that conceivability tracks the constraint, not metaphysics.

  (1) **Dualist Reasoning:** The dualist argues that because you can coherently conceive of the physical description obtaining without consciousness under this constraint, consciousness must be a distinct property. If consciousness were identical to the physical state, conceiving of the physical state without consciousness would be like conceiving of water without H₂O—a contradiction. Since no contradiction arises, the properties are distinct, and physicalism is false.

  (2) **Physicalist Block:** The physicalist uses the **Exclusive Physical Description Constraint** to stop the inference. They argue that the constraint forces you to use a "physical concept" to pick out the brain state and a "phenomenal concept" to pick out the experience. These concepts have different cognitive modes of presentation, even if they refer to the same property. The constraint prevents you from seeing the identity because it bans the conceptual tools needed to recognize it. Thus, conceivability here proves only that the *concepts* are distinct, not that the *properties* are metaphysically separable.

  (3) **Collapse Without Feature:** If you strip away the constraint and allow phenomenal terms to be defined by or linked to physical terms (as a physicalist might claim they are a posteriori), the zombie becomes much harder to genuinely conceive. You might find that trying to conceive of the physical state without consciousness generates a cognitive clash, similar to trying to conceive of a bachelor who is married. The case reverts to the standard zombie argument where the dualist insists the clash is illusory, but without the constraint, the physicalist loses the specific explanation for *why* the illusion occurs.

  **Dualist Attack:** A dualist would honestly attack this setup by claiming the **Exclusive Physical Description Constraint** isn't an arbitrary rule but mirrors reality. They would argue you are smuggling in a physicalist assumption by suggesting the constraint hides an identity that exists. If the properties were truly distinct, no constraint would be needed to keep the concepts apart; the constraint merely formalizes the actual metaphysical gap. By blaming the constraint for the conceivability, the physicalist begs the question by assuming the concepts *could* have been linked if not for the rule.

  Verdict: The Exclusive Physical Description Constraint
