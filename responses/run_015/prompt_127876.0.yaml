answer: |-
  1. **The All-Pay Mechanism**
  "In the classic dollar auction, the trap is strictly all-pay: both the winner and the loser pay their final bid. In climate treaties, if a country withdraws, they don't literally transfer their 'bid' to a winner. So, what specifically functions as the all-pay penalty? Is it stranded domestic assets, or is it purely reputational capital, and why is that cost rigid enough to mimic the monetary loss in the original model?"
  *   **Anticipated Reply:** She will likely argue that the 'bid' is political capital spent domestically to pass legislation. Even if you exit, that capital is spent and cannot be recovered, creating the all-pay dynamic.
  *   **Where to Push:** Ask if that capital is truly sunk or if it can be redeployed to other policy areas. If it's redeployable, the all-pay condition fails.

  2. **Individual vs. Institutional Psychology**
  "The sunk-cost fallacy is traditionally a cognitive bias located in individual brains. States aren't individuals; they're bureaucracies with changing leadership. Are you arguing that individual leaders are psychologically biased, or that institutional structures mimic the bias regardless of who is in charge? Because if it's the latter, the mechanism isn't behavioral anymore—it's structural."
  *   **Anticipated Reply:** She'll likely say it's a mix: leaders face 'audience costs' from voters who hate seeing prior efforts wasted, which institutionalizes the individual bias.
  *   **Where to Push:** Press on whether a change in administration (e.g., an election) resets the sunk costs. If a new leader can exit without penalty, the escalation should stop.

  3. **The Exit Clause Follow-Up**
  "You've anticipated the counter-argument that treaties include legal exit clauses, which theoretically allow for costless withdrawal. If the legal off-ramp exists, what specifically transforms a legal right into a psychological loss? Is the escalation driven by the text of the treaty, or by the informal norms surrounding it that make using that clause taboo?"
  *   **Anticipated Reply:** She will argue that legal cost is zero, but the political/reputation cost is high. The 'taboo' creates the psychological lock-in.
  *   **Where to Push:** Ask if transparency reduces this taboo. If exit clauses were normalized, would the escalation disappear? This tests if the model relies on opacity.

  4. **Falsifiable Evidence**
  "Let's talk about falsification. If a major power exited a treaty tomorrow and suffered no diplomatic retaliation, no domestic backlash, and no economic penalty, does that falsify your analogy? Or would you argue that the costs are just delayed or hidden? I'm trying to understand what evidence would actually break the model versus just moving the cost curve."
  *   **Anticipated Reply:** She'll likely hedge, saying costs are often long-term or indirect (e.g., loss of influence in other negotiations), making immediate falsification hard.
  *   **Where to Push:** Demand a specific timeline. If no costs appear within one election cycle, does the model hold? Force her to define the window of observation.

  5. **Prize Degradation**
  "In the dollar auction, the prize is fixed at one dollar. In climate negotiations, the value of the prize—avoided warming—degrades if other countries defect. Why would a rational actor keep ratcheting their commitment if the prize is becoming worthless due to others' inaction? Doesn't the diminishing return of the prize should theoretically dampen the escalation?"
  *   **Anticipated Reply:** She'll suggest countries bid based on 'conditional cooperation'—hoping their bid will spur others to stay in, preserving the prize value.
  *   **Where to Push:** Ask at what point hope becomes irrational. If others have already exited, is continuing to bid still escalation, or just throwing good money after bad?

  6. **The Opponent Identification**
  "Classic escalation requires an adversary to bid against. In climate talks, are countries bidding against each other for geopolitical status, or are they bidding against the physical climate system? If there's no counter-bidder driving the price up, what creates the competitive pressure necessary for the auction dynamic to sustain itself?"
  *   **Anticipated Reply:** She will likely argue they are bidding against each other for 'climate leadership' status and soft power influence.
  *   **Where to Push:** Ask if this turns the treaty into a prestige contest rather than a mitigation tool. If the goal is status, are they actually solving the climate problem?

  7. **The Bankruptcy Point**
  "In the dollar auction, escalation stops when bidders run out of money. What is the equivalent of 'bankruptcy' in climate commitments? Is it economic collapse, political turnover, or social unrest? Without a clear bankruptcy point, the model suggests infinite escalation, which doesn't match reality."
  *   **Anticipated Reply:** She'll point to domestic political limits or economic pain thresholds as the bankruptcy point.
  *   **Where to Push:** Ask if current targets are approaching that limit. If we aren't near the limit, why isn't escalation faster?

  8. **Bid Transparency**
  "The dollar auction relies on perfect information; you know exactly what the other person bid. Climate NDCs are often vague and hard to compare. If countries can't clearly see each other's 'bids,' how does the escalation mechanism trigger? Does ambiguity actually prevent the auction from starting?"
  *   **Anticipated Reply:** She'll argue that media scrutiny and peer reviews clarify the bids enough for the psychological pressure to work.
  *   **Where to Push:** Ask if vague targets are actually a feature to *avoid* escalation. If so, should we design treaties to be less transparent to prevent lock-in?
