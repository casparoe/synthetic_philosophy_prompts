answer: |-
  The compatibility of Mill's liberal constraint on social transition (voluntarism) with his substantive definition of socialism as a transformation of authority rather than ownership.

  ***

  **Essay Question**

  **1. Mill on Socialism and Liberty**

  (a) In his later writings, Mill argues that standard objections to socialism rely on a fixed view of human nature, yet he also insists any transition to socialism must be voluntary and experimental. Explain the tension this creates: if socialism depends on moral improvement, why restrict the means of transition? If the transition must be voluntary, does Mill have grounds to expect socialism to prevail? (5 marks)

  (b) Consider a hypothetical society, "New Rochdale": every firm is a worker co-operative, but markets and competition remain untouched; wage labour exists only as a short-term contract entered freely; and income differences between firms are large. Using the distinction between **ownership** (who holds capital) and **authority** (relations of command in production), argue whether Mill should count this as socialism achieved, socialism betrayed, or a category mistake. In your answer, address whether this arrangement risks the tyranny of prevailing opinion warned against in *On Liberty*. (15 marks)

  ***

  **Model Answer**

  Mill's late socialism is often misread as a retreat from liberalism into collectivism, but it is better understood as an attempt to reconcile economic justice with individual development. The central tension lies between his claim that socialism requires an improved human nature and his insistence that the transition must be voluntary. If socialism only works for improved beings, voluntary experimentation seems risky; if it must be voluntary, it lacks the coercive machinery to ensure it wins against competition. However, Mill resolves this by treating the voluntary constraint not as a weakness, but as a necessary condition for the moral improvement socialism requires. Coercion might establish socialist structures, but it cannot produce the socialist character necessary to sustain them. Thus, the experimental method is not toothless; it is the only mechanism capable of validating the human improvement thesis without violating the liberty principles essential to that improvement.

  Regarding "New Rochdale," Mill should count this as socialism achieved, provided we accept that his primary target was authority, not ownership. In the *Chapters on Socialism* and the relevant passage of the *Principles*, Mill distinguishes between the institution of property and the relations of production. His critique of capitalism focuses less on the distribution of wealth than on the moral relation between employer and employee. The wage system, for Mill, is objectionable because it creates a relation of dependence and command, stunting the worker's intellectual and moral growth. New Rochdale abolishes this relation. Even if markets remain, the worker is no longer a subordinate instrument but a partner in the firm. The retention of competition is consistent with Mill's view that competition is useful for efficiency so long as it does not enforce dependency.

  The distinction between ownership and authority is crucial here. If Mill's socialism were about ownership (state or collective holding of capital), New Rochdale would be a betrayal because income inequality persists and capital is held by discrete firms. But if it is about authority, New Rochdale fulfills Mill's hope. He explicitly praises peasant proprietors and co-operatives not because they equalize income, but because they give labourers an interest in the work and control over their conditions. The large income differences between firms are less problematic than inequality within them, because they result from competitive success rather than class privilege. Mill's goal is to make every labourer a capitalist in terms of agency, not necessarily in terms of dividend size.

  The strongest objection arises from *On Liberty*. Does market competition between co-operatives recreate the tyranny of prevailing opinion? If firms must compete to survive, they may enforce conformity within the co-op to maximize efficiency, stifling the individuality Mill cherishes. A competitive market might demand uniformity of product and practice, leading to the "commercial mediocrity" Mill fears. However, Mill's defence would likely be that internal democracy mitigates this. In a wage system, the master imposes conformity; in a co-op, the workers choose their constraints. While market pressure exists, it is not the same as personal dependence. The risk of conformity is present in any social system, but the co-operative structure gives individuals the power to resist it collectively, whereas the wage system leaves them powerless.

  Therefore, New Rochdale is not a category mistake but the fulfilment of Mill's specific critique. He does not demand the abolition of markets or the equalization of all outcomes, which would require the coercive apparatus that threatens liberty. He demands the abolition of the master-servant relation. By prioritizing authority over ownership, Mill allows for a socialism that is compatible with liberty. The voluntary constraint ensures that this change comes from moral conviction rather than force, securing the improvement of human nature that makes the system viable. New Rochdale achieves this: it removes the stigma of wage labour while preserving the freedom to experiment and compete. To demand more—state ownership or enforced equality—would be to sacrifice the liberty that gives socialism its value for Mill.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **Part (a): The Tension (5 Marks)**
  *   **2 marks:** Identifies the "human nature" claim (objections to socialism are contingent on current character, not structural impossibility).
  *   **2 marks:** Identifies the "voluntary/experimental" constraint (socialism must be tried freely, not imposed).
  *   **1 mark:** Articulates the dilemma (If voluntary, why expect it to win? If coercive, does it violate *On Liberty*?).
  *   *Typical Error:* Treating "human nature is improvable" as a full answer without addressing the transition mechanism.

  **Part (b): New Rochdale & Authority (15 Marks)**
  *   **5 marks (Ownership vs. Authority):** Correctly applies the distinction. Argues Mill cares more about command/dependence relations than legal title or income equality.
  *   **5 marks (Evaluation):** Commits to a verdict (Achieved/Betrayed/Mistake) and justifies it using Mill's criteria (e.g., wage labour as dependency vs. contract).
  *   **5 marks (Liberty Constraint):** Engages with the *On Liberty* worry (market pressure vs. tyranny of opinion) within the context of the case study.
  *   **First Class (17-20):** Clear commitment to one horn of the dilemma; nuanced use of the Ownership/Authority distinction; integrates *On Liberty* concerns structurally rather than as an add-on.
  *   **High 2:1 (14-16):** Good understanding of the texts and distinction, but hedges on the verdict or treats the Liberty constraint superficially.
  *   **Low 2:1 (13-14):** Identifies the distinction but applies it mechanically; misses the tension between voluntarism and success.
  *   **2:2 (11-12):** Descriptive summary of Mill's socialism; fails to engage with the hypothetical specifics or the Liberty constraint.
  *   **Third (8-10):** Misreads Mill as a state socialist; ignores the Ownership/Authority distinction; treats the prompt as a general biography question.

  **Note on the Glib Answer (Target: 8/20)**
  This answer will argue that Mill's socialism was simply a result of Harriet Taylor's influence or a natural extension of utilitarian impartiality. It is not "wrong" historically—Mill admits Taylor's influence and is a utilitarian—but it fails the module's learning outcomes because it bypasses the philosophical tension between liberty and economic structure. It treats the shift as biographical sentiment rather than a theoretical problem regarding coercion and human nature. Award marks for textual knowledge but cap at the Third range for failing to engage the structural dilemma.
