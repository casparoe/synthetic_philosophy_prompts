prompt: |-
  hey — I'm on the grants committee of a small-ish foundation: ~30 grants a year, spread across education, public health and the arts. We meet monthly, six or so proposals a session, two hours total, and every decision needs a short written rationale that the board signs off on and that we can also send to the applicants we turn down. No analyst, no modelling, and we forget what we decided by March, so it needs to be stable across meetings.

  I want a procedure, not a lecture. Half our meetings derail the same way: someone says two proposals are "just different, you can't compare them," someone else says we obviously have to compare them, and we end up arguing about whether the money does more good in a classroom or a clinic. I've been reading a bit about incommensurable values and hard choices — the idea that some options are neither better nor worse nor equally good but on a par, and that in those cases there's nothing further to discover and what you do instead is put yourself behind one of them. Turn that into steps we can run in the room:

  - which question comes first, and what counts as a good enough answer to move on
  - how we tell apart (a) our numbers are just too crude to see a real difference, (b) we're uncertain about what will actually happen, (c) the values really don't share a common measure, and (d) the options are on a par
  - where the procedure stops with a no, and where it hands the rest back to us because it's a values call rather than a factual one
  - what the written rationale should say when there is no decisive reason, since the board won't accept "we felt like it"

  One thing I've started doing on my own that I want you to either build in or tell me is confused: I ask whether I could defend either outcome to the board three years from now. If yes, I treat it as a hard choice; if no, I assume we've framed it wrong. Call it the retrospective symmetry test if you like.

  Then run the whole thing on three cases: a literacy program vs. making a museum accessible, same price; two nearly identical public-health proposals where one scores marginally better but the other has a champion on our board; and a tiny arts organisation we all love vs. a boring, highly cost-effective health intervention. I suspect the procedure says something I don't want to hear on that last one — say it plainly. And mark clearly which steps are judgement calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a small foundation grants committee (~30 grants/year, 3 sectors: education, public health, arts).
      *   **Constraints:** Monthly meetings, 6 proposals/session, 2 hours total. No analyst/modelling. Need written rationales for board/applicants. Need stability across meetings (memory is an issue).
      *   **Problem:** Meetings derail on "incommensurable values" (classroom vs. clinic). Arguments about whether to compare or not.
      *   **Philosophical Basis:** Wants to use the concept of "on a par" (Chang, etc.) and "hard choices" to structure the decision.
      *   **Specific Requirements:**
          *   Procedure, not lecture.
          *   Define order of questions & exit criteria.
          *   Distinguish between: (a) crude numbers, (b) uncertainty, (c) no common measure, (d) on a par.
          *   Define where procedure stops (No) vs. where values call begins.
          *   Draft written rationale for "no decisive reason" cases.
          *   Incorporate/evaluate the user's "Retrospective Symmetry Test" (defend either outcome in 3 years).
          *   Run the procedure on three specific cases.
          *   Be plain/direct about uncomfortable conclusions (especially Case 3).
          *   Mark where judgement calls are disguised as procedure.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Incommensurability:* Values don't share a metric (e.g., beauty vs. health).
      *   *Hard Choices/On a Par:* Options are comparable, but neither is better, nor equal. Choice creates reasons.
      *   *Application:* The committee needs to stop trying to *find* the right answer in these cases and start *making* the right answer through commitment.
      *   *User's Test:* "Retrospective Symmetry Test." If I can defend either choice later, it's a hard choice. If not, the framing is wrong. This is a strong heuristic for "on a par."

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* Efficiency (2 hours for 6 proposals = 20 mins/proposal approx, but some are quick rejects). Needs to prevent circular debate.
      *   *Step 1: Thresholding (The "No").* Before comparing, is the proposal good enough on its own terms? This filters out the weak ones so the hard choices are only between strong candidates.
      *   *Step 2: Categorizing the Conflict.* Why are we stuck? Is it data (a/b) or values (c/d)?
      *   *Step 3: The "On a Par" Determination.* Using the Retrospective Symmetry Test.
      *   *Step 4: The Commitment.* If "on a par," choose based on portfolio balance or strategic narrative, not "betterness."
      *   *Step 5: Rationale Writing.* How to explain this without sounding flaky.

      *Refining the Distinctions (a, b, c, d):*
      *   (a) Crude numbers: We need better metrics. *Action: Table for data.*
      *   (b) Uncertainty: We don't know the outcome. *Action: Risk assessment.*
      *   (c) No common measure: Apples vs. Oranges. *Action: Portfolio approach.*
      *   (d) On a par: Apples vs. Oranges, but both are excellent. *Action: Will/Commitment.*
      *   *Critique:* Actually, for a 2-hour meeting, distinguishing (c) and (d) is the crux. (a) and (b) should be resolved *before* the meeting (staff work). The committee should only see (c) and (d). I need to build a "Pre-Meeting Filter" into the procedure.

      *Incorporating the Retrospective Symmetry Test:*
      *   This is the pivot point. If the answer is "Yes, I can defend either," then stop looking for external reasons. Move to internal commitment.

      *Marking Judgement Calls:*
      *   I need to explicitly flag where the procedure relies on human discretion disguised as a step.

  4.  **Developing the Written Rationale:**
      *   Board needs to feel confident. Applicants need respect.
      *   Bad: "We flipped a coin."
      *   Good: "Both were exemplary. We chose X to balance our portfolio/fill a gap/commit to a specific strategic direction this cycle."
      *   Key phrase: "Strategic fit" rather than "Superior merit."

  5.  **Running the Cases:**

      *   *Case 1: Literacy vs. Museum Accessibility (Same Price).*
          *   Different sectors. Likely incommensurable values.
          *   Test: Can I defend either in 3 years? Yes.
          *   Outcome: Hard choice. Decision based on portfolio balance.
      *   *Case 2: Two Health Proposals (One marginal score, one Board Champion).*
          *   Same sector. Comparable metrics.
          *   Test: Can I defend the lower score? Only if the "Champion" brings non-measurable value (network, leverage). If not, this is corruption/bias, not a hard choice.
          *   Outcome: Likely a "Framing Error." The procedure should flag this.
      *   *Case 3: Tiny Arts Org (Love) vs. Boring Health Intervention (Cost-effective).*
          *   The "Soul vs. Math" conflict.
          *   Test: Can I defend the Arts org? Yes (cultural vitality). Can I defend Health? Yes (lives saved).
          *   Uncomfortable Truth: If the foundation's mandate includes "doing good," the health intervention usually wins on *moral* weight unless the Arts org is existential. But if the Foundation *values* arts, ignoring them betrays the mission.
          *   Procedure verdict: This is a *Mission* call, not a grant call. If the procedure says "pick health," it might violate the foundation's charter. I need to be plain: If you fund the arts org here, you are admitting your cost-effectiveness metrics are secondary to your identity.

  6.  **Review and Refine:**
      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Constraints:* Keep it tight for a 2-hour meeting.
      *   *Check:* Did I answer the specific bullet points?
          *   Question order? Yes.
          *   Distinguish a/b/c/d? Yes.
          *   Stop vs. Hand back? Yes.
          *   Rationale? Yes.
          *   Retrospective Test? Integrated.
          *   Three Cases? Yes.
          *   Mark Judgement Calls? Yes.

  7.  **Final Polish:**
      *   Ensure the distinction between "Incommensurable" (can't compare) and "On a Par" (can compare, but no ranking) is clear in the steps.
      *   Make sure the "Judgement Call" warnings are visible.
      *   Ensure the Case 3 conclusion is blunt as requested.

  *(Self-Correction during drafting)*: I initially thought about suggesting scoring rubrics. The prompt says "no modelling." I should avoid complex scoring. Stick to binary thresholds and qualitative categorization.
  *(Self-Correction on Case 2)*: The "Board Champion" aspect is tricky. It introduces conflict of interest. The procedure needs to handle this carefully. It's not a "hard choice" philosophically; it's a governance risk. I should point that out.
  *(Self-Correction on Case 3)*: The user suspects the procedure says something they don't want to hear. Usually, effective altruism says "Health wins." But a multi-sector foundation implies *plural* values. The uncomfortable truth might be that they are *pretending* to compare them when they should be allocating by quota. I will argue for the Quota/Portfolio approach.

  8.  **Final Output Structure:**
      *   The Protocol (Steps 1-5).
      *   The Rationale Templates.
      *   The "Judgement Call" Warnings.
      *   The Three Cases.
      *   Closing advice.

  Let's write it.cw
answer: |-
  Here is the procedure. It is designed for a two-hour meeting with no analyst support. It treats the "hard choice" not as a failure of analysis, but as a specific decision state that requires a different closing mechanism.

  ### The Protocol: "Threshold, Parity, Commitment"

  **Pre-Meeting Requirement:** Staff must tag every proposal with a **Sector** (Education, Health, Arts) and a **Threshold Status** (Pass/Fail). "Fail" means it does not meet minimum competency standards. "Pass" means it is fundable. *The committee only debates "Pass" proposals.*

  #### Step 1: The Threshold Check (5 minutes per proposal)
  **Question:** "Does this proposal meet our minimum standards for impact and feasibility?"
  *   **If No:** Reject. Rationale: "Did not meet minimum threshold for [feasibility/impact]."
  *   **If Yes:** Move to Step 2.
  *   **Exit Criteria:** Unanimous or 2/3 agreement that it is *fundable*. Do not discuss *how good* it is yet.

  #### Step 2: The Comparison Filter (When choosing between two 'Pass' proposals for one slot)
  **Question:** "Why are we struggling to choose?"
  Categorize the blockage into one of four buckets. This stops the circular argument.

  *   **(a) Crude Numbers:** "We don't have enough data to see the difference."
      *   *Action:* Table the decision. Request specific data. Do not vote.
  *   **(b) Uncertainty:** "We know the data, but we don't trust the projection."
      *   *Action:* Apply a risk discount. Which failure hurts us less? Vote.
  *   **(c) Incommensurable:** "These achieve different primary goods (e.g., health vs. beauty)."
      *   *Action:* Move to Step 3 (Portfolio Check).
  *   **(d) On a Par:** "They achieve comparable excellence, but in different ways, and neither is objectively better."
      *   *Action:* Move to Step 3 (Commitment).

  *(Note: In practice, (c) and (d) are treated identically in this protocol. The distinction is philosophical; the operational move is the same.)*

  #### Step 3: The Retrospective Symmetry Test (The Pivot)
  **Question:** "Could a reasonable committee defend funding *either* of these options three years from now?"
  *   **If No:** You have not framed the choice correctly. One option is actually superior. Return to Step 2.
  *   **If Yes:** You are in a **Hard Choice**. Stop looking for external reasons. There are no more facts to find.
      *   *Action:* Move to Step 4.

  #### Step 4: The Portfolio Commitment
  **Question:** "Given our portfolio year-to-date, which choice creates a more coherent story for our foundation?"
  *   **Constraint:** You are not choosing the "better" project. You are choosing the "fitting" project.
  *   **Consider:** Sector balance, geographic spread, risk diversification, or strategic signaling.
  *   **Vote:** Simple majority. Once voted, the decision is closed. No revisiting.

  #### Step 5: The Written Rationale
  **Rule:** Never write "We felt like it." Never write "Project A was better than Project B."
  **Template for Hard Choices:**
  > "Both proposals demonstrated exceptional merit and met all funding thresholds. The Committee faced a choice between two high-impact initiatives in different sectors. While both were fundable, the Committee prioritized [Project A] to [maintain sector balance / address a specific gap in our current portfolio / support emerging leadership in X field]. This decision reflects a strategic commitment to [Value X] for this funding cycle, without diminishing the quality of [Project B]."

  ---

  ### Where the Procedure Hides Judgement Calls
  *You asked to mark these clearly. These are the points where the procedure pretends to be mechanical but relies on human discretion.*

  1.  **Step 1 (Threshold Status):** Staff tagging a proposal as "Pass" is a massive gatekeeping judgement. If staff tags a weak proposal as "Pass," it clogs the committee's Hard Choice mechanism. *Mitigation: Committee must reserve the right to overturn a "Pass" tag with a 75% vote.*
  2.  **Step 2 (Categorization):** Deciding whether a disagreement is about "Uncertainty" (b) or "Values" (c) is itself a value judgement. People often disguise value preferences as data uncertainty. *Mitigation: The Chair must have the authority to declare "This is a values conflict, not a data conflict" and force a move to Step 3.*
  3.  **Step 4 (Portfolio Coherence):** Defining what makes a portfolio "coherent" is entirely subjective. *Mitigation: Set a rough quota at the start of the year (e.g., 10 Education, 10 Health, 10 Arts). If quotas are met, Step 4 becomes "Which sector is under-represented?"*

  ---

  ### Running the Cases

  #### Case 1: Literacy Program vs. Museum Accessibility (Same Price)
  *   **Step 1:** Both Pass.
  *   **Step 2:** Categorization. This is **(c) Incommensurable**. One creates skills, one creates access/culture.
  *   **Step 3 (Symmetry Test):** Can you defend funding the museum in 3 years? Yes (cultural vitality). Can you defend literacy? Yes (economic mobility). **Verdict: Hard Choice.**
  *   **Step 4 (Commitment):** Check the portfolio. Have you funded 5 health/education grants already and zero arts? Fund the museum. Have you funded 5 arts grants? Fund literacy. If the portfolio is empty, the Chair calls the vote based on "Strategic Signaling" (e.g., "We want to be known for innovation this year").
  *   **Rationale:** "Both proposals were exemplary. The Committee selected the Museum project to ensure diversity in our grant portfolio this quarter, balancing our recent investments in direct service education."

  #### Case 2: Two Health Proposals (One marginal score, one Board Champion)
  *   **Step 1:** Both Pass.
  *   **Step 2:** Categorization. This is **(a) Crude Numbers** or **Governance Risk**. They are in the same sector, so they *are* commensurable.
  *   **Step 3 (Symmetry Test):** Can you defend funding the lower-scoring proposal in 3 years?
      *   *If the answer is "Yes, because the Champion will unlock more funding later":* Then the score was wrong. The "Champion" value is a real metric. Re-score.
      *   *If the answer is "No, but we don't want to offend the Board Member":* **STOP.** This is not a Hard Choice. This is a governance failure.
  *   **Procedure Verdict:** The procedure forces this into the open. If it is a true Hard Choice, the "Champion" aspect must be translated into a tangible benefit (leverage, partnership). If it cannot be translated, the procedure dictates funding the higher scorer.
  *   **Rationale:** "Selected based on higher projected impact metrics and alignment with current health strategy priorities." (Do not mention the Board Member).

  #### Case 3: Tiny Arts Org (We Love) vs. Boring Health Intervention (Cost-Effective)
  *   **Step 1:** Both Pass.
  *   **Step 2:** Categorization. **(c) Incommensurable**.
  *   **Step 3 (Symmetry Test):** Can you defend the Arts Org in 3 years? Yes ("We kept a vital cultural institution alive"). Can you defend Health? Yes ("We saved X lives"). **Verdict: Hard Choice.**
  *   **Step 4 (Commitment):** Here is the uncomfortable truth.
      *   If your foundation's mission is "Maximize Social Good," the Health Intervention wins. The procedure exposes that funding the Arts Org is an emotional preference, not a strategic one.
      *   If your foundation's mission is "Support Community Vitality" (plural), the Arts Org is valid.
      *   **The Plain Truth:** If you fund the Arts Org here, you are admitting that **your cost-effectiveness metrics are secondary to your committee's emotional satisfaction.** The procedure does not hide this. It forces you to write it into the "Strategic Commitment" section of the rationale.
  *   **Rationale:** "While the Health intervention offered higher quantifiable metrics, the Committee prioritized the Arts Organization to preserve unique community infrastructure that cannot be replicated. This reflects a strategic commitment to cultural preservation alongside public health."
  *   **Warning:** If you do this too often, your board will notice you are ignoring your own impact metrics. The procedure requires you to own that trade-off explicitly.

  ### Summary of Advice
  1.  **Adopt the Retrospective Symmetry Test.** It is the most efficient tool you have. If the answer is "Yes," stop debating facts. You are now debating identity.
  2.  **Quota Your Sectors.** To avoid Case 3 paralyzing you every time, decide annually: "We will fund 10 of each." This turns Hard Choices into Scheduling problems.
  3.  **Own the "Values Call."** When the rationale says "Strategic Commitment," understand that means "We chose this because it fits who we want to be, not because it is objectively better." The Board will accept this if you are consistent. They will not accept "We felt like it."

  This procedure stabilizes your meetings by converting "Which is better?" (unanswerable) into "Which fits?" (answerable).
