      *   If $D$ = "The light was dim", and the experience makes me certain of $D$.
      *   If $D$ is not in the partition $\{E_i\}$, JC doesn't directly update on $D$. It updates on $\{E_i\}$.
      *   If the experience makes $D$ certain, then $D$ should arguably be in the partition (or the partition should be fine-grained enough to entail $D$).
      *   If $D$ is *not* in the partition, Rigidity says $P_{new}(D|E_i) = P(D|E_i)$.
      *   If the experience *also* makes $D$ certain ($P_{new}(D)=1$), does this conflict?
      *   $P_{new}(D) = \sum P_{new}(D|E_i) q_i = \sum P(D|E_i) q_i$.
      *   If $P_{new}(D)=1$, then $\sum P(D|E_i) q_i = 1$. This requires that for all $i$ where $q_i > 0$, $P(D|E_i) = 1$.
      *   This implies that *before* the experience, conditional on any $E_i$ that might become likely, I was already certain $D$ was true.
