      *   The argument is a version of the "Problem of Old Evidence" or, more accurately, a specific objection to Rigidity involving *self-locating* or *introspective* propositions. It's closely related to objections raised by philosophers like David Christensen, Alan Hájek, or Brian Skyrms.
      *   **Step (3) is the vulnerable point.** Rigidity is *not* typically claimed to hold for *all* propositions $H$. It holds for propositions *independent* of the experience, or propositions in the "object language" excluding the experience report itself.
