answer: |-
  Any viable theory of neural representation must reconcile the efficiency-driven compression of superposition with the causal specificity required for robust intervention, or it collapses into either naive localization or empty instrumentalism. To be taken seriously, a framework must satisfy the following desiderata, anchored in specific empirical findings and conceptual necessities.

  **Empirical Phenomena**
  1.  **Superposition and Polysemanticity:** The theory must explain why individual neurons or directions participate in multiple unrelated feature representations depending on context, rather than adhering to a one-neuron-one-concept schema.
      *   *Motivating Case:* The "superposition hypothesis" (Elhage et al., 2022) demonstrates that in capacity-constrained layers, models represent more features than there are dimensions by interfering non-orthogonally, resulting in polysemantic neurons that fire for both "cat" and "car" features.
  2.  **Adversarial Vulnerability:** The account must clarify why models rely on features that are statistically predictive but brittle under perturbation, distinguishing between robust and non-robust features.
      *   *Motivating Case:* Tsipras et al. (2019) showed that adversarial examples exist because networks exploit high-frequency patterns humans ignore; a theory of representation must explain why these non-robust features are represented and utilized despite their fragility.
  3.  **Linear Concept Encoding:** The framework must accommodate the finding that high-level semantic concepts are often linearly decodable from hidden states, even if the computation producing them is non-linear.
      *   *Motivating Case:* Linear probing experiments (Belinkov, 2022) consistently find hyperplanes that separate syntactic or semantic categories in activation space, suggesting a geometric structure that cannot be dismissed as random noise.

  **Conceptual Distinctions**
  1.  **Encoded vs. Causally Exploited:** The theory must distinguish between information merely present in an activation vector and information actually used by downstream layers to compute outputs.
      *   *Motivating Case:* Causal mediation analysis (Geiger et al., 2021) reveals that intervening on a "feature" identified by a probe often fails to change model behavior, proving that presence does not imply functional usage.
  2.  **Localist vs. Distributed Storage:** The account must specify whether representations are holographic (distributed across many units) or modular (localized), without assuming one a priori.
      *   *Motivating Case:* Pruning experiments show that removing large subsets of neurons often leaves performance intact, suggesting heavy redundancy inconsistent with strict localist "grandmother cell" theories.

  **Consistency Conditions**
  1.  **Training Dynamics:** The theory cannot violate known biases of stochastic gradient descent (SGD), such as the tendency toward flat minima or simplicity bias.
      *   *Motivating Case:* The "double descent" phenomenon (Nakkiran et al., 2020) shows that generalization improves even after zero training error is reached, implying the representation structure evolves during overfitting regimes in ways a static theory cannot capture.
  2.  **Architectural Constraints:** The framework must respect the specific information flow of the architecture, particularly the residual stream in Transformers.
      *   *Motivating Case:* In Transformers, the residual stream acts as a cumulative workspace (Vaswani et al., 2017); a theory treating layers as independent buckets fails to explain how information bypasses non-linearities via skip connections.

  **Puzzles to Dissolve**
  1.  **The Pruning Paradox:** The theory must explain why networks can be compressed by orders of magnitude without performance loss, despite appearing fully utilized during training.
      *   *Motivating Case:* The Lottery Ticket Hypothesis (Frankle & Carbin, 2019) identifies sparse subnetworks capable of matching the full network's accuracy, challenging views that treat all parameters as equally contributory to the representation.

  **Non-Negotiable vs. Camp-Specific Preferences**
  *   **Non-Negotiable:** Any realist account must satisfy **Causal Efficacy** (interventions on the representation must alter behavior predictably) and **Superposition Compatibility** (it cannot deny polysemanticity). Without these, the theory is empirically falsified.
  *   **Camp-Specific Preference:** **Human Legibility** is a preference, not a requirement. Realists often demand representations map to human concepts (e.g., "gender," "sentiment"), but instrumentalists argue networks may use "alien" concepts optimized for loss rather than understanding. Demanding human-legible features risks projecting human categories onto statistical patterns.

  **Joint Unsatisfiability and No-Go Tensions**
  A critical tension exists between **Strict Modular Locality** and **Complete Causal Efficacy** in deep residual networks. If one demands that every concept be localized to a specific, interpretable neuron (Modularity), one conflicts with the empirical reality of superposition required for efficient compression. Conversely, if one accepts superposition to match empirical data, one sacrifices the ability to isolate single concepts for clean causal intervention without affecting others. This creates a no-go result for "Strong Localist Realism": you cannot have maximal compression (superposition) and maximal human-legible modularity simultaneously. Furthermore, requiring **Robustness** alongside **High Accuracy** appears jointly unsatisfiable under current training regimes, as shown by the adversarial trade-off; a theory claiming networks learn robust human-aligned representations must explain why adversarial vulnerability persists as a default state.

  **Scorecard of Positions**

  *   **Strong Distributed Realism:** *Score: Mixed.* Successfully accounts for superposition and linear probing but struggles to define clear causal boundaries between overlapping features, often conflating correlation with representation.
  *   **Mechanistic Interpretability (Causal):** *Score: High on Rigor, Low on Scale.* Excels at distinguishing encoded vs. exploited features via intervention and respects architectural constraints, but currently lacks a scalable theory for handling dense superposition in large models.
  *   **Instrumentalist Critique:** *Score: High on Consistency, Low on Explanation.* Correctly highlights the projection risk of human-legibility demands and aligns with adversarial vulnerability, but dismisses the structural regularities (like linear probes) that suggest internal organization beyond mere input-output matching.
