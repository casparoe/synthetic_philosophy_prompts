prompt: |-
  There's this pattern in professional certification thats always bugged me. To become a surgeon or electrician you do thousands of hours supervised practice then perform live — nobody cares if you can write an essay about cutting. But to become a philosopher or historian it's all essays and written exams, and nobody tests whether you can actually think well in real time. What's weirder is that some vocational programmes now make apprentices keep written reflection journals about what their hands are learning, as if knowing-how needs knowing-that to prop it up, while medical residencies don't ask surgeons to write about their gut feelings.

  What view of knowing how versus knowing that does that split presuppose? Does it treat them as genuinely seperate domains, or assume practical skill is always opaque without propositional backing? And why demand the translation for tradespeople but not surgeons — is it consistency, or just status? Reconstruct the implicit epistemology here: what's strictly required by the practice, what's just a nice fit, and is the whole thing philosophically underdetermined? Then tell me what'd have to change if we certified everyone the same way, purely practical or purely propositional.

  Answer in British English please. Don't bother with citations, I just want the reconstruction.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Observation:** There's a perceived inconsistency in professional certification. High-stakes practical roles (surgeons, electricians) focus on supervised practice/live performance. Humanities/academic roles (philosophers, historians) focus on essays/written exams.
      *   **The Twist:** Vocational programmes now often require written reflection journals (knowing-how needs knowing-that), whereas medical residencies don't typically require surgeons to write about their "gut feelings" (knowing-how stands alone).
      *   **The Task:** Reconstruct the implicit epistemology behind this split.
          *   What view of *knowing-how* vs. *knowing-that* is presupposed?
          *   Are they treated as separate domains, or is practical skill seen as opaque without propositional backing?
          *   Why demand translation for tradespeople but not surgeons? (Consistency vs. Status).
          *   What is strictly required vs. nice fit vs. underdetermined?
          *   What would happen if we certified everyone the same way (purely practical or purely propositional)?
      *   **Constraint:** Answer in British English. No citations. Just the reconstruction.

  2.  **Deconstruct the Epistemological Assumptions:**
      *   *The Surgeon/Electrician Model:* Competence is performative. If the cut is clean or the wire doesn't spark, you know your stuff. This aligns with Rylean *knowing-how* as distinct from and perhaps prior to *knowing-that*. The body knows what the mind needn't articulate.
      *   *The Philosopher/Historian Model:* Competence is discursive. Thinking *is* writing/arguing. There is no "live performance" of history other than the articulation of it. Here, *knowing-that* (propositional knowledge) is the primary metric, assumed to embody the cognitive skill.
      *   *The Vocational Journal Paradox:* Why make the electrician write? This suggests a shift towards "reflective practice" (Schön-esque, though I won't cite). It implies that practical skill is unstable or unprofessional unless it can be rationalised post-hoc. It treats *knowing-how* as suspect until translated into *knowing-that*.
      *   *The Surgeon Exemption:* Why don't surgeons write journals? Because the stakes are too high and the feedback loop is immediate (patient lives or dies). Also, status. Surgery is a "learned profession" with ancient roots; trades are often viewed as needing "uplifting" to academic standards.

  3.  **Address the Specific Questions:**
      *   *View of Knowing:* It presupposes a hybrid but hierarchical model. *Knowing-how* is sufficient for high-status manual/interventional roles (surgery), but for lower-status manual roles (trades), it needs *knowing-that* validation. For cognitive roles, *knowing-that* is the performance itself.
      *   *Separate Domains?* Yes, but with a leakage. The system assumes practical skill is opaque (unverifiable) without propositional backing *unless* the practical skill is prestigious enough to stand on its own.
      *   *Consistency vs. Status:* It's largely status. Surgery is elite; trades are not. The demand for reflection in trades is often about standardisation and liability, whereas surgery relies on peer review of outcomes.
      *   *Required vs. Nice Fit:*
          *   *Required:* Evidence of competence (outcome for surgeons, argument for philosophers).
          *   *Nice Fit:* Reflection journals for trades (pedagogical tool mistaken for assessment).
          *   *Underdetermined:* The link between writing about a skill and having the skill is weak.
      *   *Hypothetical Change:*
          *   *Purely Practical:* Philosophers would debate live; historians would reconstruct artefacts.
          *   *Purely Propositional:* Surgeons would pass MCQs; electricians would write about circuits.

  4.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Analytical, slightly critical, precise.
      *   *Vocabulary:* Programme, centre, realise, honour, whilst, amongst.
      *   *Structure:*
          1.  Introduction: Acknowledge the tension.
          2.  Epistemological Split: Rylean distinctions and the hierarchy.
          3.  The Reflection Paradox: Why trades write and surgeons don't (Status & Liability).
          4.  Required vs. Underdetermined: What actually matters.
          5.  The Thought Experiment: Uniform certification.
          6.  Conclusion.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say surgeons *never* write. They do research. But for *certification* (board exams), it's mostly practical/clinical assessment after the initial written hurdles. The prompt specifically mentions residencies not asking for journals on gut feelings. I should stick to that distinction.
      *   *Nuance:* The "reflection journal" in trades is often a regulatory requirement for apprenticeships (like in the UK NVQ system). It's about proving you understand *why* you did it, not just *that* you did it. This implies practical skill is seen as 'mindless' unless proven otherwise.
      *   *Status:* This is crucial. Surgery is a profession; electrical work is a trade (historically). Professions get to define their own epistemology. Trades have epistemology imposed upon them by educational bodies.

  6.  **Final Polish (checking British English):**
      *   Ensure 's' instead of 'z' in organisational/realise (where appropriate).
      *   Use "whilst", "amongst", "programme".
      *   Ensure the tone isn't too informal.

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   No citations? Yes.
      *   Reconstruction of implicit epistemology? Yes.
      *   Address the specific questions? Yes.

  *(Self-Correction on "British English"):* I need to make sure I don't overdo the stereotypes (like "bloke" or "innit"), but use standard UK spelling and phrasing conventions.

  *(Plan for the "Purely Practical/Propositional" section):*
