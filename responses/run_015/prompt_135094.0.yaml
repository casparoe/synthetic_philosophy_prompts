  What would count against this? Don't just hit me with the generic 'you're multiplying entities' line — I want the specific defeaters for this void-sensitive, material-genre version. Which cases actually break it? Would a defender have to concede that repairing a hidden internal crack with different-substance filler destroys the statue, and is that an intution we should accept or just bite the bullet on? What about gradual particle-replacement with chemically identical clay — does that preserve material-genre or not, and if not, does that make my view too brittle? Also, is there a serious risk this collapses into four-dimensionalism about statues, or back into standard constitution-with-extra-steps? Rank the problems from fatal (the view is incoherent) to merely awkward (counterintuitive results about museum restoration). And be honest: has this been qualified into unfalsifiability, and if so, is that actually a problem for a metaphysical claim like this?
