          *   *Conceptual:* Is it still "pain" if it's not bad? (Bain, Martain).
          *   *Clinical/Confounds:* Asymbolia often co-occurs with hemispatial neglect, anosognosia (unawareness of deficit), or general indifference to the contralateral side. Is the lack of reaction specific to *pain's badness* or a general lack of care about that limb?
          *   *Introspective:* Patients say "It hurts but it doesn't bother me." Is this a report on experience or a report on reaction?
