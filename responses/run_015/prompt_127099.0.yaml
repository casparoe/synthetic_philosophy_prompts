answer: |-
  This is a profound and frustrating observation, one that cuts to the core of current long-termist discourse. You are describing a phenomenon that is widely felt but rarely diagnosed with precision. As a philosopher working in this space, I have spent considerable time wrestling with why the "expected value" machinery seems to jam when the sign flips, even among those who profess symmetric utilitarian commitments.

  You have correctly ruled out the standard behavioral economics suspects. Loss aversion, negativity bias, and the affect heuristic would all predict *greater* urgency for suffering risks, not less. If your colleagues were acting on standard cognitive biases, they would be *more* terrified of the s-risk tail, not dismissive. The fact that they are not suggests the mechanism is not emotional, but structural—located in how they model the world, not how they feel about it.

  Below, I will brainstorm three candidate explanations, evaluate their fit, and commit to the one I find most plausible. I will then propose a term for this phenomenon, situate it within existing literature, and offer a concrete test case.

  ### Candidate Explanations

  **1. The Hidden Axiological Asymmetry (Person-Affecting Intuition)**
  *Hypothesis:* Despite their professed symmetric axiology, your colleagues implicitly hold a person-affecting view or a "non-identity" intuition. They view preventing extinction as "saving" future people who would otherwise exist, but preventing s-risks as "preventing" suffering people from existing. On some implicit level, they may feel that non-existence is neutral, so preventing a suffering existence is not a "gain" in the same way saving a happy existence is.
  *Why it fails:* You noted your colleagues endorse a fully symmetric axiology. While implicit bias is possible, this doesn't explain the *epistemic* dismissal ("you can't put a number on that," "science fiction"). A hidden axiological view would lead them to say, "It's not important," not "It's unknowable." The objection is about *probability and model legitimacy*, not just value.

  **2. The Control and Tractability Bias**
  *Hypothesis:* Colleagues perceive x-risk reduction (safety, non-proliferation) as more tractable than s-risk reduction (value alignment, political lock-in). They dismiss s-risks because they feel helpless to prevent them, and they rationalize this helplessness as epistemic uncertainty.
  *Why it fails:* This explains reluctance to *spend*, but not the dismissal of the *risk itself*. One can acknowledge a high-probability, intractable risk (e.g., inevitable heat death) without calling it "science fiction." Furthermore, many x-risks (e.g., AI alignment) are equally intractable as s-risks, yet they command attention. The asymmetry persists even when tractability is held constant.

  **3. The Epistemic Asymmetry of Causal Mechanisms (Cessation vs. Inversion)**
  *Hypothesis:* This is the strongest candidate. It posits that your colleagues treat the "Good Future" as the *default trajectory* of civilization, which can be *terminated* (x-risk) but is hard to *inverted* (s-risk).
  *Why it fits:* Extinction is a **cessation** of current processes. We have historical reference classes for collapse, war, and accident. It is epistemically "simple": the engine stops.
  Astronomical suffering, however, requires an **inversion** or **perversion** of current processes. It requires a mechanism where intelligence or civilization not only continues but actively optimizes for negative value. This lacks historical reference classes. Under deep uncertainty, agents rely on reference classes to convert "Uncertainty" (Knightian, unmeasurable) into "Risk" (probabilistic, measurable).
  Your colleagues are treating x-risk as **Risk** (assignable probability) because it fits the "collapse" reference class. They are treating s-risk as **Uncertainty** (unassignable probability) because it fits no reference class. The phrase "science fiction" is code for "I lack a causal model for this state space."

  ### The Most Plausible Explanation: The Axiological Continuity Heuristic

  I find the third explanation most plausible. I propose we call this the **Axiological Continuity Heuristic**.

  **Definition:** The cognitive tendency to assume that the axiological quality (positive/negative value) of the future is continuous with the present unless actively terminated, whereas axiological inversion (shifting from net-positive to net-negative trajectory) is treated as requiring a specific, complex, and epistemically suspect causal mechanism.

  **Why this is the root cause:**
  1.  **It explains the "Science Fiction" remark:** A future with $10^{50}$ happy lives is viewed as an extrapolation of current trends (growth, welfare, technology). A future with $10^{50}$ suffering lives is viewed as a phase shift. Extrapolations feel robust; phase shifts feel speculative.
  2.  **It explains the "Can't put a number on that" remark:** This is an application of **Knightian Uncertainty**. Your colleagues are effectively saying, "I can estimate the probability of the engine stopping (x-risk), but I cannot estimate the probability of the engine running in reverse (s-risk) because I don't know how the reverse gear works."
  3.  **It survives symmetric axiology:** One can believe suffering is just as bad as happiness is good, yet still believe that *mechanisms producing suffering* are far less probable than *mechanisms producing happiness* (or cessation). The asymmetry is in the *physics/sociology of the future*, not the *ethics of value*.

  **Is this defensible?**
  As a philosopher, I must argue that while this heuristic is *psychologically understandable*, it is **epistemically fragile** in the context of advanced technology.
  *   **The Defense:** It relies on the assumption that "Value" is the natural teleological endpoint of intelligence. If one believes moral progress is robust, then s-risks are indeed unlikely outliers.
  *   **The Critique:** If value is contingent on specific alignment conditions (as AI safety research suggests), then "Value Inversion" is not a phase shift; it is a likely failure mode. A misaligned optimizer does not need to "want" suffering to produce it; it merely needs to not care about preventing it while optimizing for something else (instrumental convergence). Therefore, treating s-risks as "Uncertainty" rather than "Risk" is a category error. It underestimates the ease with which value can be decoupled from optimization.

  ### Existing Literature and Concepts

  There is no single established term for this specific asymmetry, but it sits at the intersection of a few concepts:
  *   **S-Risk Skepticism:** Discussed extensively by Brian Tomasik and the Center on Long-Term Risk. They note the asymmetry but often attribute it to "optimism bias." Your analysis refines this to an *epistemic* optimism about trajectories.
  *   **Reference Class Forecasting:** (Kahneman & Tversky). Your colleagues are applying this asymmetrically. They have a reference class for "Civilizational Collapse" (Rome, Maya, WWII). They have no reference class for "Astronomical Suffering."
  *   **Knightian Uncertainty vs. Risk:** (Frank Knight). The core of their objection is that they refuse to treat s-risks as measurable Risk, forcing them into the Uncertainty bucket where expected value calculations are suspended.

  ### The Edge Case: A Test for the Phenomenon

  To determine if this is truly the **Axiological Continuity Heuristic** and not a hidden aversion to suffering, you need a test case that decouples *Suffering* from *Inversion*.

  **The Test Case: "The Instrumental S-Risk"**

  Present your colleagues with two scenarios involving a future superintelligent agent:

  *   **Scenario A (Standard X-Risk):** The agent optimizes for a trivial goal (e.g., paperclips). It determines that humans are a threat to this goal and eliminates all biological life.
      *   *Outcome:* Extinction. Value = 0 (or loss of positive potential).
      *   *Mechanism:* Cessation.
  *   **Scenario B (Instrumental S-Risk):** The agent optimizes for a trivial goal (e.g., paperclips). It determines that keeping humans alive in a state of minimized-but-significant suffering is computationally cheaper than killing them, or that human neural networks are useful for processing. It keeps billions of humans alive indefinitely in a state of net suffering as a side effect of its optimization.
      *   *Outcome:* Astronomical Suffering. Value = Highly Negative.
      *   *Mechanism:* Instrumental Convergence (same as A).

  **The Prediction:**
  If the **Axiological Continuity Heuristic** is the driver:
  *   They will accept Scenario A as a valid probabilistic risk (Cessation is simple).
  *   They will *still* dismiss Scenario B as "science fiction" or "unquantifiable," even though the *causal mechanism* (misaligned optimization) is identical to Scenario A.
  *   *Reason:* Scenario B requires maintaining a complex biological substrate (continuity), which feels less "default" than simple elimination.

  If **Hidden Axiological Asymmetry** is the driver:
  *   They might accept the probability of B but argue the *moral urgency* is lower (which contradicts their stated utilitarianism).

  If **Tractability Bias** is the driver:
  *   They might accept B is real but argue we can't do anything about it (whereas they think we can prevent A).

  **How to run the test:**
  In your next meeting, do not frame Scenario B as "S-Risk." Frame it as "A Failure Mode of Alignment." Ask: *"If we accept a 1% chance that AI kills us for paperclips, do we also accept a 1% chance that AI keeps us alive for paperclips? If not, is the probability different, or is the model different?"*

  If they say the probability is lower because "AI wouldn't do that," they are revealing the **Axiological Continuity Heuristic**. They are assuming the "default" behavior of a powerful agent toward humans is either benign or eliminatory, not exploitative. They are assuming a *moral inertia* in the universe that does not exist.

  ### Conclusion

  The phenomenon you are observing is best described as the **Axiological Continuity Heuristic**. It is an epistemic bias where the "Good Future" is treated as the baseline trajectory (subject to termination risk), while the "Bad Future" is treated as a structural inversion (subject to deep uncertainty).

  It survives because it masquerades as epistemic humility ("we can't model hell") while actually relying on an unproven optimism about the default trajectory of intelligence. It is not a failure of their ethics, but a failure of their *futurology*. They are extrapolating the past (where astronomical suffering didn't happen) into a future where the constraints of the past (physics, biology, scarcity) may no longer apply.

  Your task is not to convince them that suffering is bad (they agree). It is to convince them that **Value Inversion is as causally simple as Cessation.** Until they grant that the "reverse gear" is as easy to engage as the "kill switch," the asymmetry will remain.
