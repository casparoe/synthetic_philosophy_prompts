answer: |-
  **Project Title:** Testimony Without Assertion: A Nyāya Practice-Led Inquiry

  **Research Question**
  Classical Nyāya epistemology identifies verbal testimony (*śabda*) as a reliable source of knowledge (*pramāṇa*), distinct from perception or inference. For a hearer to gain valid cognition (*pramā*) from speech, specific causal conditions must be met: syntactic expectancy, semantic fit, contiguity, and crucially, the speaker's intention to convey truth. Fiction satisfies the structural conditions but explicitly lacks the assertive intention. My project asks: **Can verbal testimony generate knowledge when the speaker intends non-assertion, provided the hearer's downstream action succeeds?**

  I propose that a Nyāya framework, which validates knowledge through successful action rather than internal mental attitudes, can distinguish three types of fictional uptake usually conflated in contemporary theory: *export* (true belief about the actual world), *story-cognition* (belief about the fictional world), and *scenario-grasp* (a non-propositional sensibility for how events unfold). The project seeks a determinate answer on whether *śabda* requires assertive intent at the genesis of cognition, or if successful practical vindication can retroactively validate the source even when the speaker signals "this is made up."

  **Context and Gap**
  Contemporary analytic philosophy of fiction largely focuses on the reader's attitude: are we believing or make-believing? This attitudinal framing obscures the causal structure of how information is transmitted. Nyāya offers a superior taxonomy because it asks about the conditions of the cognition's genesis and validation, not just the hearer's psychological stance. However, Nyāya materials were developed for scripture and everyday assertion, not the deliberately non-asserting speaker of the novel. Conversely, standard literary theory lacks the epistemological rigor to distinguish between learning a fact from a novel and learning a skill. This project bridges that gap by testing classical categories against the specific mechanics of realist fiction.

  **Methodology**
  The six-month fellowship will be split evenly between philosophical exegesis and creative production.
  *   **Months 1–2 (Philosophical Groundwork):** I will analyze primary Nyāya commentaries (in translation) regarding *śabda* and the role of speaker intention (*tātparya*). I will map the conditions for valid cognition against the three categories of fictional uptake.
  *   **Months 3–4 (Studio Production):** I will draft a novella constructed as an epistemological testbed. It will contain two distinct strands: an "invented informant" narrative (a fictionalized miscarriage of justice where names are changed but facts are true) and an "unreliable narrator" strand (accurate on events, deceptive on motives).
  *   **Month 5 (Testing):** I will circulate specific engineered passages to a controlled group of beta readers. They will not be asked for literary critique, but for reports on what they take to be true and what actions they feel equipped to take based on the text.
  *   **Month 6 (Synthesis):** I will write the final exegesis, using the reader data and the drafting challenges to answer the research question.

  **Studio Deliverable**
  The novella is not merely an illustration of the theory; it is load-bearing evidence. To be evidential rather than decorative, the text must be engineered to isolate variables. For example, the "invented informant" section will be written to maximize semantic fit and syntactic expectancy while minimizing signals of invention, whereas the "unreliable narrator" section will invert this. If the text functions only as a metaphor for the argument, the project fails. The failure mode here is a "gesture of equivalence," where the fiction and philosophy simply mirror each other without friction. To avoid this, the drafting process will document where the philosophical categories break down under the pressure of narrative necessity. If the novella cannot be written without violating the epistemological constraints, that resistance is a data point, not a flaw.

  **Alternatives Rejected**
  I am declining four obvious alternative approaches.
  1.  **A straight epistemology paper:** This would violate the fellowship's practice-led mandate and miss the phenomenological nuance that only drafting reveals.
  2.  **A novel with no articulated thesis:** This would fail the research requirement, offering insight without verifiable claims.
  3.  **An empirical study of reader uptake:** While I am using reader feedback, a full empirical study would require quantitative rigor and sample sizes incompatible with a solo fellowship. My approach is qualitative and phenomenological.
  4.  **Building on similarity (*upamāna*) rather than testimony:** One might argue fiction teaches by analogy ("this is like that"). I reject this because the "invented informant" case claims to teach facts ("this *is* that"), not just resemblances. *Upamāna* cannot account for the reader who acts on a fictional truth to change the actual world.

  **Scope Assessment and Risks**
  I must be honest about two significant risks that could terminate the project.

  **1. The Pseudo-Problem Risk:** It is possible that upon closer textual analysis, speaker intention proves internal to the causal process of cognition in Nyāya thought. If intention is a necessary cause of the cognition itself, then successful action cannot retroactively validate a cognition that lacked the proper genesis. The project would collapse into exposition.
  *   *Kill Point:* If Month 1 research confirms that *tātparya* (intention) is a causal prerequisite for *śabda* cognition rather than a validation condition, I will pivot. The minimum successful outcome would be a refined taxonomy of fictional uptake (export, story-cognition, scenario-grasp) without the Nyāya integration.

  **2. The Competence Risk:** I read no Sanskrit. My training consists of graduate seminars taken years ago. Nyāya is technically dense. Relying on translations risks misinterpretation that a specialist panelist might reject.
  *   *Kill Point:* If the available translations prove insufficient to resolve the specific tension regarding intention during Month 2, I cannot proceed with the philosophical claim. I do not have the budget for a collaborator in this proposal, but I will consult with a specialist colleague informally. If the linguistic barrier prevents a precise definition of *tātparya*, the project must scale back to a comparative literature analysis rather than an epistemological one.

  **Minimum Successful Outcome**
  If the ambitious epistemological claim proves unreachable, the project will still yield a rigorous taxonomy of how readers extract truth from fiction, grounded in the practical challenges of drafting the novella. This would demonstrate that practice-led research can clarify philosophical problems even when the historical system (Nyāya) serves as a heuristic rather than a strict framework. The fellowship will result in either a resolved epistemological paradox or a documented map of why that paradox resists resolution, paired with a novella that embodies the inquiry.
