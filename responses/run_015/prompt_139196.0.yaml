prompt: |-
  I've spent years arguing about normative uncertainty on rationalist blogs and forums, and next month I'm finally presenting my own positive view to a live audience: a joint session of my city's rationality meetup and a university moral philosophy reading group. The room will be roughly a dozen longtermist-leaning effective altruists who happily multiply tiny probabilities by astronomical stakes and treat hesitation as a vice, three or four academic philosophers who know the moral-uncertainty literature well (the case for maximizing expected choice-worthiness, the bargaining-or-parliament alternative, and the problem of comparing choice-worthiness across theories at all), and two or three decision-theory and ML people who will mainly want to know whether the view is implementable.

  My thesis: don't maximize expected choice-worthiness. Instead give each candidate first-order theory a say proportional to your credence in it, but under two constraints the standard models lack. First, a volatility discount: shrink a theory's say toward the credence-weighted average verdict in proportion to how much that theory's own verdicts swing across nearby courses of action. I call the motivation the parity-of-humility move — whatever epistemic humility justifies spreading credence over moral theories should equally justify distrusting any single theory's extreme magnitudes, since those are precisely the numbers our evidence can't pin down. Second, an evidential floor: a theory whose verdict on this decision turns on a consideration about which our total evidence is silent — far-future population size, the standing of merely possible beings, whether suffering's disvalue aggregates without bound — gets its say capped at the share it would win in a hypothetical long-run bargain among the theories. The selling point I claim is that this keeps the parliamentary model's resistance to a three-percent-credence fanatical theory dictating everything, avoids collapsing back into expected-value maximization the moment you need intertheoretic comparisons, and isn't mere timidity, because the discount shrinks as evidence about the magnitudes improves.

  Draft me a Q&A prep sheet: the eight or so objections I'll actually get in this room, ordered by how likely and how damaging they are, each phrased the way that part of the room would phrase it, with a two-minute reply, what I should concede up front, what I should hold even under pressure, and a note on where each reply is softest. I expect a fight about whether the view collapses into maximizing expected choice-worthiness anyway, something in the dynamic-inconsistency or money-pump family, and the accusation that the volatility discount is just a de minimis credence cutoff in disguise; tell me which of these actually lands hardest and what would tell me that it had landed. Close with the objection I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Experienced in normative uncertainty debates (rationalist blogs/forums). Presenting a *positive view* (not just critiquing others).
      *   **Audience:** Mixed bag.
          *   ~12 Longtermist EAs (pro-multiplying tiny probs by huge stakes, anti-hesitation).
          *   ~3-4 Academic Philosophers (know the literature: MEC, bargaining/parliament, intertheoretic comparison problems).
          *   ~2-3 Decision Theory/ML folks (care about implementability).
      *   **Thesis:** Don't maximize Expected Choice-Worthiness (MEC). Use a "Parliamentary Model" with two constraints:
          1.  *Volatility Discount:* Shrink a theory's influence if its verdicts swing wildly across similar actions (motivated by "parity of humility").
          2.  *Evidential Floor:* Cap influence of theories relying on evidence-silent considerations (far-future, possible beings, unbounded suffering) to a "long-run bargain" share.
      *   **Goal:** A Q&A prep sheet with ~8 objections, ordered by likelihood/damage, specific phrasing for audience segments, 2-minute replies, concessions, hard lines, and vulnerability notes. Plus, identify the "killer" objection and the "hope nobody asks" objection.

  2.  **Deconstruct the Thesis & Identify Weak Points:**
      *   *Volatility Discount:* Why volatility? Is it just risk-aversion over moral value? Does it punish radical but true theories? How is "nearby courses of action" defined? (Metric problem).
      *   *Evidential Floor:* What counts as "evidence silent"? Isn't this just bias against longtermism? How do you calculate the "long-run bargain"?
      *   *General:* Is this just MEC with extra steps? Does it violate dominance? Is it dynamically inconsistent? Can you money-pump it?
      *   *Implementability:* How do you calculate volatility? Is it computationally tractable?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Collapse Charge (MEC in disguise).* Philosophers and EAs will ask this. If you weight by credence, aren't you just doing expectation?
      *   *Objection 2: The Metric/Reference Class Problem (Volatility).* ML/Decision Theory folks will hit this. What defines "nearby"? Change the units, change the volatility.
      *   *Objection 3: Anti-Longtermism Bias (Evidential Floor).* The EAs will hate this. It sounds like "ignore the big stakes because they are uncertain."
      *   *Objection 4: Dynamic Inconsistency/Money Pump.* Decision Theory folks. If I change my mind based on volatility, can you pump me?
      *   *Objection 5: Punishing Truth.* If a radical theory is *true*, why discount it? (Philosophers/EAs).
      *   *Objection 6: Implementability.* ML folks. How do I code this?
      *   *Objection 7: The "Timidity" Charge.* EAs. You're just scared of fanaticism.
      *   *Objection 8: Intertheoretic Comparison.* Philosophers. You still need comparisons to average verdicts.

      *Refining the Order:*
      1.  *Collapse/MEC:* Most fundamental. If this fails, the theory is dead.
      2.  *Metric Problem (Volatility):* Technical killer. If volatility is arbitrary, the discount is arbitrary.
      3.  *Longtermism Bias:* Biggest audience friction point.
      4.  *Dynamic Inconsistency:* Standard DT objection.
      5.  *Implementability:* Practical hurdle.
      6.  *Punishing Truth:* Philosophical worry.
      7.  *Comparison Problem:* Philosophical technicality.
      8.  *Timidity:* Rhetorical worry.

  4.  **Developing the Replies (Strategy: Concede + Pivot):**
      *   *Collapse:* Concede it's *like* MEC but argue the *inputs* are transformed. Hold on the "humility" justification.
      *   *Metric:* Concede it needs a metric. Hold that "similarity of action" is standard in DT. Soft spot: defining the metric.
      *   *Longtermism:* Concede it dampens fanaticism. Hold that it's about *evidence*, not stakes. Soft spot: defining "evidence silent."
      *   *Money Pump:* Concede potential risk. Hold that it's a heuristic for bounded agents. Soft spot: formal coherence.

  5.  **Identifying the "Killer" Objection:**
      *   The *Metric/Reference Class Problem* for Volatility is the most technically damaging. If volatility depends on how you carve up "action space," the view is arbitrary. The EA/ML crowd will smell blood here.
      *   *Signal it landed:* If they ask for the specific mathematical function defining "nearby" and you can't give one without circularity.

  6.  **Identifying the "Hope Nobody Asks" Objection:**
      *   Something that undermines the core motivation. "Why humility about *magnitudes* but not *credences*?" Or, "Isn't this just risk-aversion over moral value, which you haven't justified?"
      *   Better: "What is the *normative status* of your meta-theory?" If you apply your own theory to itself, does it discount its own volatility? (Self-undermining).

  7.  **Drafting the Content (incorporating specific audience voices):**
      *   *EAs:* "Fanaticism," "Stakes," "Expected Value."
      *   *Philosophers:* "Intertheoretic comparison," "Dominance," "Coherence."
      *   *ML/DT:* "Tractable," "Metric," "Objective function."

  8.  **Review against Constraints:**
      *   8 objections.
      *   Ordered by likelihood/damage.
      *   Phrased for specific audience segments.
      *   2-minute reply summary.
      *   Concede/Hold/Soft Spot.
      *   Identify hardest landing objection + signal.
      *   Identify "hope nobody asks."

  9.  **Refining the Tone:**
      *   Needs to be sharp, academic but rationalist-adjacent.
      *   Acknowledge the user's experience (don't explain basics).
      *   Focus on the specific mechanics of *Volatility* and *Evidential Floor*.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Collapse" objection distinguishes between *structural* collapse and *output* similarity.
      *   *Correction:* Ensure the "Longtermism" objection isn't just "I disagree," but "Your floor arbitrarily caps my core concerns."
      *   *Correction:* The "Hope nobody asks" should be the self-referential paradox. It's the deepest philosophical trap.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a Q&A prep sheet tailored to your specific audience mix and thesis. The objections are ordered by the probability they will be raised combined with their potential to derail the core mechanics of your view.

  ### **Q&A Prep Sheet: Normative Uncertainty & The Volatility Discount**

  #### **1. The "MEC in Disguise" Charge**
  *   **Who:** Academic Philosophers & Senior EAs.
  *   **Phrasing:** "You claim to reject Maximizing Expected Choice-worthiness (MEC), but you're still weighting verdicts by credence. If your 'volatility discount' is just a function of the theory's own output, haven't you just defined a new utility function where you maximize expected *discounted* choice-worthiness? Isn't this merely MEC with an extra transformation step, rather than a structural alternative?"
  *   **2-Minute Reply:** Acknowledge the formal similarity but press the *input* distinction. MEC takes raw magnitudes as given; your view treats magnitudes as evidence-sensitive variables. The discount isn't a utility transformation; it's an epistemic correction. If a theory says Action A is $10^{100}$ better than B, but says Action A+ε is $-10^{100}$ worse, that instability indicates the magnitude is noise, not signal. MEC treats that noise as data; your view treats it as error.
  *   **Concede:** Yes, formally it looks like maximizing an expectation of a transformed variable.
  *   **Hold:** The transformation is epistemic (reliability), not axiological (value). It changes *what* is being maximized, not just the weights.
  *   **Soft Spot:** If they press that any coherent decision rule can be represented as maximizing *some* expectation, rendering the distinction semantic.

  #### **2. The Metric/Reference Class Problem (Volatility)**
  *   **Who:** Decision Theory & ML People.
  *   **Phrasing:** "Volatility is relative to a metric on action space. If I measure 'nearby actions' in dollars, the volatility is X. If I measure in log-dollars or utility units, it's Y. You can make any theory look stable or volatile by changing the topology of the decision space. How do you define 'nearby' without begging the question?"
  *   **2-Minute Reply:** This is the hardest technical hit. Concede that a metric is required but argue it's not arbitrary—it's the *agent's* capability metric. "Nearby" means "actions the agent can confuse or transition between with low cost." It's grounded in the agent's control, not the theory's ontology.
  *   **Concede:** You need a fixed metric on action space, not outcome space.
  *   **Hold:** The metric is empirical (agent's motor control/cognitive resolution), not normative.
  *   **Soft Spot:** If they show that changing the parameterization of the agent's policy space changes the verdict. **This is the objection that lands hardest.**
  *   **Signal it Landed:** If they ask for the specific mathematical function defining "nearby" and you have to appeal to intuition rather than a formal definition.

  #### **3. The "Anti-Longtermism" Bias**
  *   **Who:** Longtermist EAs.
  *   **Phrasing:** "Your 'evidential floor' effectively caps the influence of theories that care about the far future or vast populations, since evidence there is thin. Doesn't this just bake in a bias against the very stakes that matter most? You're punishing theories for being ambitious rather than wrong."
  *   **2-Minute Reply:** Reframe "ambition" as "leverage without traction." The floor isn't about stakes; it's about *discriminatory power*. If a theory's verdict hinges entirely on variables we cannot observe or influence (e.g., specific far-future population counts), it shouldn't dictate *current* resource allocation. It gets a seat at the bargain, but not a veto.
  *   **Concede:** Yes, this dampens fanaticism and longtermist leverage.
  *   **Hold:** It's a feature, not a bug. Uncertainty about magnitudes should reduce decision-weight, not just credence.
  *   **Soft Spot:** Defining "evidence silent." If they argue we *do* have evidence (e.g., physical laws persist), your floor might look arbitrary.

  #### **4. Dynamic Inconsistency / Money Pump**
  *   **Who:** Decision Theory People.
  *   **Phrasing:** "If your volatility discount changes based on the set of available options, you're vulnerable to money pumps. I can add a decoy option to change the volatility profile of your preferred theory, making you switch choices, then remove the decoy and charge you to switch back. Is your view dynamically consistent?"
  *   **2-Minute Reply:** Concede that bounded rationality models often violate strict consistency. Argue that normative uncertainty is a *deliberative* process, not a revealed preference function. The "parliament" renegotiates when the menu changes.
  *   **Concede:** Strict dynamic consistency might not hold in edge cases.
  *   **Hold:** The cost of avoiding the pump (computing global volatility for all possible menus) exceeds the rational bound.
  *   **Soft Spot:** If they construct a simple 3-option pump that doesn't require heavy computation.

  #### **5. Punishing the Truth**
  *   **Who:** Academic Philosophers.
  *   **Phrasing:** "Suppose Total Utilitarianism is true, and it genuinely implies volatile, astronomical stakes. Your volatility discount systematically reduces the say of the *true* theory in favor of stable, moderate theories. Why should epistemic humility override truth?"
  *   **2-Minute Reply:** Distinguish *metaphysical* truth from *action-guiding* certainty. Even if the theory is true, *your access* to the magnitudes is noisy. You are maximizing expected *rightness of action*, not aligning with *truth of theory*.
  *   **Concede:** It might lower the influence of the true theory if the true theory has high-magnitude variance.
  *   **Hold:** We act on evidence, not truth. High variance in verdicts is evidence of low reliability in magnitude estimation.
  *   **Soft Spot:** If they argue that "truth" should dominate regardless of our inability to pin down the numbers.

  #### **6. Implementability / Tractability**
  *   **Who:** ML People.
  *   **Phrasing:** "To calculate volatility, I need to evaluate the theory's verdict on a neighborhood of actions. For complex real-world decisions, that neighborhood is infinite. How is this computable? Is this just a theoretical toy?"
  *   **2-Minute Reply:** Propose sampling. You don't need the full integral; you need a Monte Carlo estimate of variance over plausible perturbations. It's *more* implementable than MEC because MEC requires precise magnitude estimates which are often impossible to generate.
  *   **Concede:** It requires more compute than simple heuristic rules.
  *   **Hold:** It is tractable via approximation, unlike MEC which often fails due to undefined inputs (infinite values).
  *   **Soft Spot:** If they point out that sampling requires a prior over actions, which reintroduces the metric problem.

  #### **7. The Intertheoretic Comparison Problem**
  *   **Who:** Academic Philosophers.
  *   **Phrasing:** "You say you avoid the problem of comparing choice-worthiness across theories. But to calculate a 'credence-weighted average verdict' for the volatility discount, you need to compare units across theories. Haven't you just smuggled intertheoretic comparison back in?"
  *   **2-Minute Reply:** You need *some* common currency to run a parliament, but the volatility discount reduces the *sensitivity* to that currency. You don't need precise exchange rates; you need rough ordinal alignment to detect "swings."
  *   **Concede:** You need a rough common scale (e.g., normalized 0-1).
  *   **Hold:** The view is robust to noise in that scale, whereas MEC collapses if the scale is off by an order of magnitude.
  *   **Soft Spot:** If they argue that without precise comparison, the "average verdict" is meaningless.

  #### **8. The "Timidity" Charge**
  *   **Who:** Longtermist EAs.
  *   **Phrasing:** "This sounds like risk-aversion dressed up as epistemology. You're just scared of fanaticism. But if the stakes are real, hesitation is the vice. Why should our psychological discomfort with huge numbers dictate moral action?"
  *   **2-Minute Reply:** It's not discomfort; it's signal-to-noise ratio. If a theory's output swings wildly on minor input changes, it's a broken instrument. Ignoring a broken instrument isn't timidity; it's instrumental rationality.
  *   **Concede:** It results in more conservative action than pure MEC.
  *   **Hold:** Conservatism is rational when magnitudes are epistemically opaque.
  *   **Soft Spot:** If they present a case where the "volatile" theory is clearly right (e.g., Pascal's Mugging with strong evidence).

  ---

  ### **The Killer Objection**
  **#2: The Metric/Reference Class Problem.**
  This lands hardest because it attacks the *mechanism* of your primary innovation (Volatility Discount). If volatility is arbitrary based on how you parameterize "action," the discount is arbitrary. If the discount is arbitrary, the view loses its normative force and becomes a tool to engineer whatever verdict you want by tweaking the metric.
  *   **Watch for:** Questions about "parameterization," "units of measurement," or "topology of the action space."
  *   **Defense:** Anchor the metric strictly in the *agent's* cognitive/motor resolution, not the world's structure.

  ### **The "Hope Nobody Asks" Objection**
  **The Self-Undermining Charge.**
  *   **Phrasing:** "Does your meta-theory apply to itself? If I am uncertain between your view and MEC, does your view's 'volatility discount' apply to its own verdicts? If your view is volatile across nearby meta-decisions, should I discount its say? If so, doesn't it recommend ignoring itself?"
  *   **Why it's dangerous:** It creates a paradox. If your theory says "discount volatile theories," and your theory is volatile (because it depends on complex empirical metrics about evidence and action), it demands its own down-weighting. If it doesn't apply to itself, it's ad hoc. If it does, it might self-eliminate.
  *   **Prep:** Have a "fixed point" answer ready. (e.g., "This is a first-order decision procedure, not a meta-theory subject to its own uncertainty constraints," or "It is stable because the evidence for the *procedure* is distinct from the evidence for the *moral magnitudes*.")
