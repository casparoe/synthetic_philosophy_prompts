answer: |-
  This is a sophisticated proposal that attempts to navigate the Scylla of incomparability and the Charybdis of paradox inherent in infinite ethics. By anchoring the evaluation in a *local density* around the agent and using ultrafilters to force completeness, you aim for a decisive, impartial ordering.

  However, the structure you describe faces severe structural vulnerabilities. Below, I have ranked the defeaters from fatal (refutations) to awkward (costs of doing business), evaluating whether a defender should concede or dig in, and assessing the survival of the view against ad-hoc qualification.

  ### 1. Fatal Defeaters (Refutations)

  These objections suggest the theory fails on its own terms, particularly regarding your stated condition that a reversal by mere redescription counts as refutation.

  #### A. The Permutation/Redescription Invariance Problem
  **The Objection:** In an infinite universe (e.g., isomorphic to $\mathbb{Z}^3$), there is no unique way to "exhaust" the space or define "distance" that is ethically privileged. One can construct a bijection (relabeling) of locations that preserves the intrinsic welfare at each location but maps the "good" locations to be arbitrarily close to the agent and the "bad" locations arbitrarily far away (or vice versa).
  Since your criterion relies on the limit of fractions within regions *centred on the agent*, a mere permutation of location indices changes the density limit. You can turn a "bad" world into a "good" world without changing any welfare facts, only the coordinate assignment relative to the agent.
  **Verdict:** **Fatal.**
  **Defender's Response:** A defender might argue that physical space provides a privileged metric (e.g., spatiotemporal distance).
  **Critique:** Unless ethics is tethered to specific physical metrics (which seems contingent), this fails. If the universe is a causal network without a privileged embedding, the ranking is unstable.
  **Cost of Business?** No. As you noted, if the ordering flips under redescription, it is a refutation. To save this, the view must multiply qualifications (e.g., "only natural physical metrics count"), which risks making the view dependent on contingent physics rather than ethical structure.

  #### B. The Indexical Partiality Problem
  **The Objection:** You state the goal is to sidestep the impossibility of combining *impartiality* with Pareto. Yet, the criterion is explicitly anchored on "the agent's own location."
  If Agent A is in a cluster of happy people and Agent B is in a cluster of suffering people (in an otherwise identical infinite universe), your criterion says the world is better *for A* than *for B*. This violates agent-neutrality. It implies the objective value of the universe depends on where *you* happen to stand.
  **Verdict:** **Fatal (for an impartialist view).**
  **Defender's Response:** A defender might concede this is an agent-relative view (a "view from here") and argue that all ethical evaluation is ultimately indexical.
  **Critique:** This abandons the project of solving the *impartial* aggregation paradox. It solves the problem by changing the subject from "Which world is better?" to "Which world is better *for me*?"
  **Cost of Business?** If the goal is impartial consequentialism, this is a concession of defeat. If the goal is a pragmatic decision theory for situated agents, it is a cost of doing business. However, it severely limits the view's applicability to policy or cosmic evaluation.

  ### 2. Serious Defeaters (Substantive Violations)

  These objections show the theory yields counterintuitive ethical verdicts, violating standard normative constraints.

  #### C. The Zero-Density Pareto Violation
  **The Objection:** Consider two worlds, $W_1$ and $W_2$. $W_2$ is identical to $W_1$ except that a sparse infinite set of individuals (e.g., those at prime-numbered coordinates) are made vastly better off. The density of this set is zero. Your criterion ranks $W_1$ and $W_2$ as equivalent (same limit fraction below threshold).
  This violates the **Strong Pareto Principle** (if everyone is at least as well off and some are strictly better, the outcome is better).
  **Verdict:** **Serious.**
  **Defender's Response:** Defenders of infinite ethics (e.g., Kagan, Vallentyne) often argue that Strong Pareto must be weakened in infinite contexts to avoid paradox. They might accept "Finite Pareto" only.
  **Critique:** While consistent, this is a bitter pill. It implies we should be indifferent to saving infinitely many people if they are sparse enough.
  **Cost of Business?** A defender can reasonably treat this as a cost of doing business in an infinite world. To fix it requires moving to a more complex measure (like hyperreals), abandoning the simplicity of the density limit.

  #### D. Intensity Blindness (The Threshold Problem)
  **The Objection:** The criterion counts the *fraction* of locations below a threshold, not the *magnitude* of welfare.
  World X: 10% of locations suffer intensely (value -1,000,000).
  World Y: 10% of locations suffer mildly (value -1).
  Rest are above threshold.
  Your criterion ranks these as equal (assuming the limit is 0.1 for both). Furthermore, a dense mild improvement might outweigh a sparse catastrophic prevention.
  **Verdict:** **Serious.**
  **Defender's Response:** This is a feature, not a bug, if the view is a **Sufficiency View** rather than a Totalist view. It claims ethics is about ensuring enough people have enough, not maximizing sums.
  **Critique:** Most aggregation paradoxes arise from Totalist assumptions. If you adopt Sufficiency, you avoid some paradoxes but lose the ability to weigh trade-offs that intuition demands (e.g., preventing torture vs. providing minor pleasures).
  **Cost of Business?** Acceptable if framed as a non-utilitarian infinite ethics. Fatal if claimed to be a utilitarian solution.

  ### 3. Awkward Defeaters (Technical & Metaphysical Costs)

  These objections do not refute the view but make it metaphysically expensive or operationally vague.

  #### E. Ultrafilter Arbitrariness
  **The Objection:** When the limit does not converge, you invoke an ultrafilter to select a value. Non-principal ultrafilters exist (via Axiom of Choice) but are non-constructive. There are $2^{2^{\aleph_0}}$ such ultrafilters. Different choices yield different ethical rankings for the same world.
  **Verdict:** **Awkward.**
  **Defender's Response:** We need *some* complete ordering to make decisions. The arbitrariness is metaphysical, not practical (we rarely face non-convergent worlds in practice?).
  **Critique:** It makes the "truth" of ethical comparisons depend on arbitrary mathematical choices. It looks like moral luck based on set-theoretic axioms.
  **Cost of Business?** A reasonable cost for completeness. Rivals (like incomparability views) avoid this by accepting gaps, but you prioritized ranking.

  #### F. Parameter Sensitivity (Shape and Threshold)
  **The Objection:** The ranking depends on the *shape* of the expanding regions (spheres vs. cubes vs. tetrahedra) and the *fixed threshold*. Slight changes in the threshold can flip rankings if the distribution of welfare is dense around that value.
  **Verdict:** **Awkward.**
  **Defender's Response:** Fix the shape (e.g., metric balls) and the threshold (e.g., suffering floor) by ethical fiat.
  **Critique:** This multiplies qualifications. Why spheres? Why *this* threshold? The view survives only by stipulating parameters that lack independent ethical justification.
  **Cost of Business?** High. It suggests the theory is not discovering ethical truth but imposing a grid upon it.

  ---

  ### Comparison with Rivals

  To understand what your view buys you, we must see what it predicts that others do not.

  | Feature | **Density Criterion (Yours)** | **Hyperreal/Infinitesimal Aggregation** (e.g., Easwaran, Lauwers) | **Finite Difference** (e.g., Vallentyne, Kagan) |
  | :--- | :--- | :--- | :--- |
  | **Completeness** | **Complete.** (Via ultrafilter extension). | **Complete.** (Within the hyperreal field). | **Incomplete.** (Many worlds incomparable). |
  | **Zero-Density Pareto** | **Violates.** (Density 0 changes count as 0). | **Respects.** (Infinitesimal value assigned). | **Respects.** (If difference is finite/summable). |
  | **Permutation Invariance** | **Fails.** (Sensitive to agent-centering/metric). | **Fails.** (Sensitive to ordering of summation). | **Passes.** (Invariant under permutation). |
  | **Indexicality** | **High.** (Centered on agent). | **Low.** (Global sum). | **Low.** (Global comparison). |
  | **Metaphysical Cost** | **Medium.** (Ultrafilters + Metric). | **High.** (Non-standard analysis). | **Low.** (Standard math). |
  | **Verdict on "Sparse Torture"** | **Indifferent.** (If density is 0). | **Opposes.** (Infinitesimal disvalue). | **Opposes.** (Finite disvalue sum). |

  **Unique Prediction:** Your view predicts that **local clustering matters more than global totals.** In a universe where suffering is infinite but clumped far away from the agent, your view rates it as "good" (low local density of suffering), whereas Hyperreal views rate it as "infinitely bad" and Finite Difference views might rate it as "incomparable" or "bad" depending on the domain of comparison.

  ### Final Verdict

  You asked where you would be most moved: *"if the ordering can be reversed by a mere redescription of the universe rather than a change in it, I would count that as refutation."*

  **This is the decisive point.**
  The Density Criterion, as described (centered on the agent, relying on limits over regions), is **not invariant under relabeling/permutation of the infinite domain.** In an infinite set, "density" is not an intrinsic property of the set of values; it is a property of the *embedding* of those values into a metric space.

  If the universe is fundamentally a set of experiences without a pre-existing geometric grid, your criterion requires imposing one. If you impose a grid, you can permute the coordinates to manipulate the density around the agent.
  *   **Scenario:** World $W$ has 50% happy, 50% sad.
  *   **Redescription:** Map all happy people to even coordinates, sad to odd. Density oscillates. Ultrafilter picks one.
  *   **Redescription 2:** Map all happy people to coordinates $n^2$, sad to others. Density near agent (0) becomes 100% happy.
  *   **Result:** The ethical verdict flips based on the mapping.

  **Conclusion:**
  Unless you can ground the "metric" and "centering" in non-arbitrary physical or metaphysical facts (e.g., "the agent is physically located *here* in spacetime"), the view is **refuted by the Redescription Objection.**

  If you concede the Indexicality (admitting this is a decision theory for agents, not a God's-eye view of value), you save the view from the "Impartiality" contradiction, but you succumb to the "Redescription" refutation unless the physical metric is privileged.

  **Recommendation:**
  To survive, the view must be downgraded from a theory of **Objective Betterness** to a theory of **Situated Rational Choice**. It cannot claim to rank worlds *simpliciter*, only worlds *relative to an agent's location in a metrically structured space*. If you make this concession, the Redescription objection loses its bite (because the redescription would have to move the agent physically, which is a change in the world, not just a label). However, this abandons the hope of solving the *impartial* infinite aggregation paradoxes, retreating instead to a form of infinite egoism or local consequentialism.
