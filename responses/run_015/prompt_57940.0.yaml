  ok so ive been watching a bunch of biopics lately and the unwritten rules feel wierd. you can mash three real people into one composite buddy for the hero and thats just artistic license, but if you invent a nasty scene involving a real ex who is still alive you get sued, and if shes dead you just get dragged on social media. then they slap one of those based on a true story cards at the start like that settles it. what idea of truth and of what we owe dead people is that whole practice presupposing? is that the only view that could justify it or could a few different views get you to the same place, and what would have to change if we took obligations to the dead really seriously?
