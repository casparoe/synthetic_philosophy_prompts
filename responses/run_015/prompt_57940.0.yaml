answer: |-
  You have put your finger on the exact nerve that makes modern biopics so ethically slippery. The industry operates on a dual standard that looks hypocritical on the surface but is actually grounded in a very specific, somewhat cynical philosophical framework.

  Here is a breakdown of what that framework is, how other ethical systems might justify the same rules, and what would happen if we actually respected the dead.

  ### 1. The Current Presupposition: Narrative Truth vs. Reputational Harm

  The "Hollywood Standard" you are observing presupposes two distinct categories of truth: **Structural Truth** and **Moral Truth.**

  *   **Composite Characters (Structural):** When a screenwriter mashes three friends into one "best buddy," they are altering *structural* truth. They are simplifying the plot for pacing. The presupposition here is that the audience cares more about the *hero's journey* than the historical record. This is justified by **Narrative Coherence**. The "truth" being sold is emotional, not factual.
  *   **Invented Scandals (Moral):** When a screenwriter invents a scene where a real person (alive or dead) cheats, steals, or acts cruelly, they are altering *moral* truth. They are assigning guilt.

  **The Obligation to the Dead:**
  The current practice presupposes that **the dead do not have rights, but they have interests.**
  Since a dead person cannot feel pain, the harm isn't to *them*; the harm is to their **legacy** and their **survivors**.
  *   **If Alive:** The obligation is legal (Defamation, Right of Publicity). You get sued because you damaged their earning power or emotional state.
  *   **If Dead:** The obligation is social/brand-based. You get "dragged" because you violated a social contract with the surviving family or fans.

  **The "Based on a True Story" Card:**
  This disclaimer is a legal and philosophical shield. It presupposes a **Contractual View of Truth**. It tells the audience: *"We are entering a fiction contract, not a history contract. We owe you a good story, not an accurate one."* It shifts the burden of skepticism onto the viewer.

  ### 2. Could Different Views Justify the Same Rules?

  Yes. You don't need to rely on Hollywood's legal pragmatism to arrive at the conclusion that "inventing nasty stuff about the dead is wrong." Other ethical frameworks converge on the same rule, but for different reasons.

  **A. Virtue Ethics (The Character of the Filmmaker)**
  *   **View:** Ethics is about the character of the moral agent.
  *   **Justification:** A virtuous artist practices *prudence* and *justice*. Punching down at someone who cannot defend themselves (because they are dead) is an act of cowardice. It shows a vice in the filmmaker, regardless of whether they get sued.
  *   **Result:** Same rule (don't invent scandals), but the reason is honor, not liability.

  **B. Utilitarianism (The Greatest Good)**
  *   **View:** Maximize happiness/minimize suffering.
  *   **Justification:** Does the invented scandal add enough artistic value to outweigh the pain caused to the grieving family and the distortion of public knowledge? Usually, the answer is no. A cheap drama scene causes real pain to survivors for a fleeting moment of audience shock.
  *   **Result:** Same rule, but the reason is a cost-benefit analysis of suffering.

  **C. Kantian Deontology (Duty and Universal Law)**
  *   **View:** Act only according to rules you would want to become universal law.
  *   **Justification:** If every filmmaker lied about the moral character of real people whenever it suited the plot, trust in history and art would collapse. We have a duty to truth-telling regarding specific individuals, even if they are dead, because they were rational agents deserving of respect.
  *   **Result:** Same rule, but the reason is inherent human dignity.

  ### 3. What If We Took Obligations to the Dead *Really* Seriously?

  If we moved from the current "PR-friendly" model to a model where the dead have actual moral rights that filmmakers must respect, the biopic genre would fundamentally break. Here is what would have to change:

  **A. The End of "Psychological Speculation"**
  Most biopics rely on private conversations that no one recorded. *"What did Lincoln say to his wife the night before the Gettysburg Address?"*
  *   **Current View:** As long as it fits what we know of their character, it's fine.
  *   **Serious Obligation View:** You cannot invent dialogue or internal motivations for a real person without evidence. This turns biopics into docudramas. The "drama" evaporates because you can't fill in the gaps.

  **B. The Veto Power of Estates**
  Currently, estates can threaten lawsuits, but they don't always have legal standing to stop a film unless likeness rights are involved.
  *   **Serious Obligation View:** The estate becomes a censor. If the dead have a right to their reputation, their representatives must approve the script.
  *   **Consequence:** No more unflattering biopics. The Steve Jobs movie where he denies his daughter? The Elvis movie where he's a drug addict? Those never get made. We only get hagiographies (saint-making stories).

  **C. The Statute of Limitations on Reputation**
  To make this workable, we would need a time limit.
  *   **Change:** Perhaps you can't defame someone for 50 years after death. After that, they become "historical figures" rather than "people."
  *   **Consequence:** This creates a "History vs. Memory" cliff. A film about MLK made in 1970 is restricted; a film made in 2025 is free game. This changes how we process recent history vs. ancient history.

  **D. Shift from Individuals to Allegory**
  If you can't touch the specific truth of a person, filmmakers would stop making biopics.
  *   **Change:** We would see more films like *Citizen Kane* (loosely based on Hearst but changed enough to be fiction) or *There Will Be Blood* (loosely based on Oil Boom tycoons).
  *   **Consequence:** The "Based on a True Story" card disappears. It gets replaced by "Inspired by real events." The link between the art and the specific human being is severed to protect the human being.

  ### Summary

  The current practice presupposes that **Truth is a commodity** and **Reputation is property.** We are allowed to tweak the commodity (the plot) to make it sell better, but we aren't allowed to steal the property (the reputation) without paying for it (getting sued or cancelled).

  If we took obligations to the dead seriously, we would have to admit that **some stories are not ours to tell.** We would lose the dramatic intimacy of the biopic, but we would gain a historical record that hasn't been retroactively edited by screenwriters looking for a third-act conflict.

  The "Based on a True Story" card is essentially a lie we tell ourselves to have it both ways: we want the emotional weight of reality without the ethical burden of accuracy.
