answer: |-
  **JOINT STATEMENT ON THE PASADENA GAME**
  **Reading Group Working Document**

  **I. AGREED CLAIMS**

  1.  **The Algebra:** The Pasadena Game is defined by a sequence of outcomes $n \in \mathbb{N}$ with probabilities $p_n = 2^{-n}$ and payoffs $x_n = (-1)^{n-1} 2^n / n$. The expectation series $\sum p_n x_n$ is the alternating harmonic series $\sum (-1)^{n-1}/n$. This series is conditionally convergent to $\ln 2$ in its natural order. However, the series of positive terms diverges to $+\infty$ and the series of negative terms diverges to $-\infty$. Consequently, the Lebesgue integral of the payoff function is undefined. By the Riemann Rearrangement Theorem, the terms can be reordered to sum to any real number or to diverge.

  2.  **Pasadena vs. St. Petersburg:** The St. Petersburg Game has an expected value of $+\infty$ (the sum of positive terms diverges, negative terms are zero). The Pasadena Game has *no* expected value (both positive and negative parts diverge). The St. Petersburg Game violates the Archimedean axiom in standard expected utility (EU) theory; the Pasadena Game violates the requirement that expectations be well-defined real numbers. Neither party shall argue for bounded utility functions or anti-fanaticism principles to dissolve the problem; we treat the payoffs as unbounded utilities.

  3.  **Dominance:** State-wise dominance holds regardless of expectation existence. If Gamble $A$ yields payoff $a_n$ and Gamble $B$ yields $b_n$ such that $a_n > b_n$ for all $n$, then $A$ is strictly preferred to $B$. Specifically, "Pasadena + \$1" (payoff $x_n + 1$) is strictly preferred to "Pasadena" (payoff $x_n$), even though neither has a defined expectation. Silence from the expectation operator does not license indifference between dominant and dominated options.

  4.  **No Verdict vs. Indifference:** "The theory issues no verdict" is distinct from "The theory verdicts indifference."
      *   *Indifference* implies that swapping the options for one another is permissible and that a mixture of the two is equally choiceworthy.
      *   *No Verdict* implies the theory does not rank the options.
      *   In sequential contexts, this distinction matters: If an agent is indifferent between $A$ and $B$, they may flip a coin to choose. If the theory issues no verdict, the permissibility of using a randomizing device (or committing to a future choice) is not settled by the theory itself.

  **II. DISAGREEMENTS TABLE**

  | Crux | Restrictionist Position | Completionist Position | Shared Bearing Case | Restrictionist Prediction | Completionist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Domain of Theory** | EU theory is a partial function. When the integral is undefined, the option is outside the domain of instrumental rationality, analogous to dividing by zero. | EU theory is extensionally inadequate if it fails to rank physically implementable gambles. Silence is a failure of the theory, not the option; the domain must be extended. | **The Analogy:** Restrictionist cites $1/0$; Completionist cites the Liar Paradox. | The analogy to $1/0$ holds: the operation is invalid, so no result is the correct result. | The analogy to Liar holds: the sentence is meaningful but truth-valueless; we need a revision theory to assign a value. |
  | **2. Finite Approximation** | The limit of the expectations of truncated games does not dictate the expectation of the limit game. Convergence of finite cases does not resolve the undefined nature of the infinite case. | The value of the infinite game should be the limit of the values of its finite truncations (the $\ln 2$ value), as this is the only stable feature surviving the passage to infinity. | **(a) Truncation Ladder:** Truncate at $N$ (no payoff if $n > N$). Each truncated game has EV $\approx \ln 2$. | The sequence of verdicts converges, but the verdict on the limit remains undefined. Continuity of *value* does not imply continuity of *evaluability*. | The sequence of verdicts converges, and the verdict on the limit must match to avoid arbitrage between the finite and infinite versions. |
  | **3. Stability under Perturbation** | The sensitivity of the sum to reordering or weighting proves that no unique value exists. Any assigned value is arbitrary. | The sensitivity proves standard EU is too fragile. We must adopt a rule (e.g., natural order limits) that is stable under *relevant* perturbations, ignoring those that change the problem's structure. | **(b) Vanishing Perturbation:** Multiply $x_n$ by $(1+\epsilon_n)$ where $\epsilon_n \to 0$. EV can be made anything. | This confirms the Restrictionist view: if arbitrarily small changes to payoffs yield arbitrary EVs, no fact of the matter exists. | This confirms the need for a Completionist rule: we must fix the summation method (e.g., natural order) to block irrelevant perturbations. |
  | **4. Sequential Choice** | If the theory is silent today, it places no constraint on planning. An agent may adopt any policy for tomorrow without violating instrumental rationality. | If the theory is silent today, dynamic inconsistency looms. The theory must prescribe a planning norm (e.g., "choose the truncation limit") to prevent money pumps. | **(c) Planning Variant:** Choose today between \$1 sure now vs. waiting for Pasadena tomorrow. | Taking the \$1 is permissible; waiting is permissible. Rationality does not forbid either, as no comparison is defined. | Taking the \$1 is rationally required if $\ln 2 < 1$; waiting is required if $\ln 2 > 1$. Silence invites money pumps. |

  **III. ANALYSIS OF DISPUTE: VERBAL VS. SUBSTANTIVE**

  **1. The "Undefined" Label (Verbal):**
  Both sides agree the standard Lebesgue integral is undefined. The Restrictionist treats "undefined" as a stop-sign for rational evaluation. The Completionist treats "undefined" as a flag for "standard method failed, apply alternative method." This is largely verbal: it turns on whether "Decision Theory" refers specifically to *Standard EU* or to *The Correct Norms for Choice*. If the latter, the Completionist's demand is tautological (we need the correct norms). If the former, the Restrictionist is correct (Standard EU stops here).

  **2. The Analogy (Substantive):**
  The disagreement over Division by Zero vs. Liar Paradox is substantive.
  *   If **Division by Zero**: The game is ill-formed relative to the utility metric. There is no fact of the matter to find.
  *   If **Liar Paradox**: The game is well-formed, but our semantic/evaluative rules create a gap. The gap can be filled by revising the rules (e.g., supervaluation, non-standard analysis).
  *   *Test:* If we can construct a Dutch Book against an agent who treats Pasadena as "outside the domain" (Restrictionist) in a sequential setting, the Division by Zero analogy fails, because arithmetic errors (like $1/0$) do not typically allow dynamic exploitation in the same way logical gaps do.

  **3. Dynamic Consistency (Substantive):**
  This is the hardest crux with no agreed settlement test.
  *   The Restrictionist accepts that an agent following their advice might be susceptible to a money pump in sequential cases (e.g., paying to switch from Pasadena to Pasadena+\$0.01, then paying to switch back if the framing changes), provided the agent never violates dominance *within* a single choice set. They view dynamic consistency as a separate virtue from static rationality.
  *   The Completionist views susceptibility to money pumps as proof that the theory is false.
  *   *Impasse:* We cannot settle this without agreeing on whether instrumental rationality is fundamentally a property of *choices* (Restrictionist) or *policies* (Completionist). No argument accepted by both sides currently resolves this meta-ethical divide.

  **4. Permissivism as a Verdict (Verbal/Substantive Hybrid):**
  The Restrictionist claims "No Verdict" means "Anything Permitted." The Completionist claims "Anything Permitted" *is* a Verdict.
  *   *Resolution:* We distinguish **Local Permissibility** (choosing A over B is not forbidden) from **Global Comparability** (A and B have a determinate relation). The Restrictionist asserts Local Permissibility without Global Comparability. The Completionist asserts that Global Comparability is required for Local Permissibility to be stable over time. This is the core substantive disagreement remaining.
