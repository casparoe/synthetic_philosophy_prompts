prompt: |-
  I spent forty years in surface science and heterogeneous catalysis, and since retiring I have been sitting in on a graduate seminar in philosophy of science at the university where I used to work. The group is mostly philosophers and a few methodologists, and I am the only person there who has spent a career actually taking measurements, so I get asked to say what the statistics means in practice. I would be grateful for some help with that.

  We read a recent trade book on the replication crisis — I will not name it, and I have no interest in debating this particular author. What I want is an audit of an argument, because I suspect I have been persuaded by more of it than I should have been. Below is my own reconstruction of the chapter's central argument, in my wording and not the author's, compressed to about a page. I have put it in quotation marks only to mark it off as the object of my question; it is a paraphrase, not a transcription.

  "The replication crisis is, at bottom, an artifact of null hypothesis significance testing. The p-value is the probability of getting data like yours if the null hypothesis is true; what a scientist actually wants is the probability that the hypothesis is true given the data, and the habit of reading the first as the second is what let whole literatures fill up with confident findings that later evaporated. Publication bias then compounds the damage: journals print the significant results and shelve the null ones, so the published record is a selection-biased sample in which every reported effect is an overestimate of the truth. That is why careful replications, run with larger samples and without the filter, shrink the effect toward zero.

  The remedy is to stop asking the wrong question and become Bayesians. Bayesian inference gives you exactly what you wanted: a probability for the hypothesis, given the evidence you actually have. It also dismantles the machinery that produced the crisis. Because Bayes' theorem conditions on the data observed and on nothing else, a Bayesian is free to keep collecting observations until the picture is clear and then stop; there is no analogue of the stopping-rule inflation of false positives that makes optional stopping a form of cheating under significance testing. The researcher degrees of freedom that generate p-hacking accordingly lose their leverage, and the incentive to fish disappears.

  The one remaining objection is the prior, which is admittedly subjective. But priors wash out: as the data accumulate the likelihood dominates, so investigators starting from different priors converge on the same posterior. Subjectivity is therefore a transitory inconvenience rather than a defect, and a small price for a method that answers the question one was asking in the first place. Properly understood, the replication crisis is not a reason to doubt science. It is a reason to doubt a particular, and now outdated, statistical technology."

  My own inclination is that the diagnosis in the first paragraph is essentially right and the remedy in the second and third is oversold — but I cannot locate precisely where it goes wrong, and when I try to say so in the seminar I find myself repeating the book's phrasing.

  There is also something I have been worrying at from my own field, and I would like it tested rather than indulged. Take a stylized composite of several cases I watched happen: a support-induced enhancement of catalytic turnover is reported in the 1990s as roughly a factor of sixty; by the late 2000s, with better controls, it is a factor of six; now, with proper blinding and preregistered protocols, it is about two, and the original papers are still the ones cited. What struck me is that the field's priors were themselves manufactured out of the selected literature. If that is right, then a single application of Bayes' theorem — even with a deliberately skeptical prior — does not undo the bias, because the prior was contaminated by the very evidence base one is trying to correct for, and the unselected evidence needed to rebuild it no longer exists. I have been calling this evidential hysteresis: the field's posterior lags the evidence, and re-weighting once does not catch up, because the correction and the contamination share the same source. I half-remember a result about opinions merging under enough data, which is presumably what the book is leaning on, and I suspect it has conditions that my case violates.

  So, please:

  Go through the reconstruction more or less sentence by sentence, and tell me what a working statistician or methodologist would simply accept, what they would accept as a defensible simplification for a lay reader, and what they would say is wrong or a non sequitur.

  Then tell me whether the book's conclusion — that the crisis indicts a technology rather than our practices of inquiry — survives once the weak steps are repaired, or whether it depends on them.

  Then take my hysteresis worry seriously: is it a real phenomenon that the literature recognises, is it already contained in something the book's argument handles, or is it confused? In particular, does it tell against the claim that priors wash out, and does it cut the other way as well — might a Bayesian field be worse off than a frequentist one here, on the grounds that the bias is hidden inside a prior where it is harder to inspect than a p-value?

  Finally, tell me what I should actually say to the seminar in about three minutes: what to keep from the chapter, what to reject, and where my own example does and does not carry the weight I am putting on it.

  I am not asking for references or reading suggestions. Our little group has no library access to speak of, and in any case I want the reasoning, not the authorities. If a point depends on a result I could not check without a library, tell me that rather than citing it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Retired surface science/heterogeneous catalysis expert (40 years experience).
      *   **Context:** Sitting in on a graduate philosophy of science seminar.
      *   **Role:** The "practitioner" voice (the only one who actually took measurements).
      *   **Task:** Audit a reconstructed argument from a trade book about the replication crisis and Bayesianism.
      *   **Specific Concerns:**
          1.  Sentence-by-sentence audit of the reconstruction (Acceptable vs. Simplification vs. Wrong).
          2.  Evaluate the book's conclusion (Crisis indicts technology vs. practices).
          3.  Evaluate the user's "evidential hysteresis" worry (contaminated priors).
          4.  Provide a 3-minute summary for the seminar.
      *   **Constraints:** No references/reading suggestions (no library access, want reasoning).

  2.  **Deconstruct the Reconstructed Argument (Sentence by Sentence Audit):**

      *   *Sentence 1:* "The replication crisis is, at bottom, an artifact of null hypothesis significance testing."
          *   *Verdict:* Oversimplification/Wrong. NHST is a major *driver*, but not the *bottom*. Incentives, funding, career pressure are deeper causes. NHST is the tool, not the root cause.
      *   *Sentence 2:* "The p-value is the probability of getting data like yours if the null hypothesis is true; what a scientist actually wants is the probability that the hypothesis is true given the data..."
          *   *Verdict:* Acceptable/Defensible. This is the standard definition of $P(D|H_0)$ vs $P(H|D)$. It's the classic confusion of the inverse.
      *   *Sentence 3:* "...and the habit of reading the first as the second is what let whole literatures fill up with confident findings that later evaporated."
          *   *Verdict:* Defensible simplification. It's a major mechanism, though not the *only* one (p-hacking, publication bias also matter independently).
      *   *Sentence 4:* "Publication bias then compounds the damage: journals print the significant results and shelve the null ones, so the published record is a selection-biased sample in which every reported effect is an overestimate of the truth."
          *   *Verdict:* Acceptable. This is the "file drawer problem" and the "winner's curse." Statistically sound.
      *   *Sentence 5:* "That is why careful replications, run with larger samples and without the filter, shrink the effect toward zero."
          *   *Verdict:* Acceptable. Regression to the mean + removal of bias.
      *   *Sentence 6:* "The remedy is to stop asking the wrong question and become Bayesians."
          *   *Verdict:* Wrong/Non sequitur. Changing the math doesn't change the incentives. You can p-hack with Bayes Factors too (though harder).
      *   *Sentence 7:* "Bayesian inference gives you exactly what you wanted: a probability for the hypothesis, given the evidence you actually have."
          *   *Verdict:* Defensible simplification *if* you accept the subjective interpretation of probability. Technically, it gives $P(H|D, \text{Prior})$, not just $P(H|D)$.
      *   *Sentence 8:* "Because Bayes' theorem conditions on the data observed and on nothing else, a Bayesian is free to keep collecting observations until the picture is clear and then stop..."
          *   *Verdict:* Technically Acceptable (Likelihood Principle). *But* practically dangerous. If you peek and stop when significant, you introduce bias in the *decision process*, even if the math holds. It invites "Bayes hacking."
      *   *Sentence 9:* "...there is no analogue of the stopping-rule inflation of false positives that makes optional stopping a form of cheating under significance testing."
          *   *Verdict:* Controversial/Defensible simplification. Strict Bayesians say stopping rules don't matter. Frequentists (and error-statisticians) say they do because of long-run error rates. For a practitioner, optional stopping *does* inflate false discovery rates in practice.
      *   *Sentence 10:* "The researcher degrees of freedom that generate p-hacking accordingly lose their leverage, and the incentive to fish disappears."
          *   *Verdict:* Wrong. Incentives don't disappear because you change the formula. You can still cherry-pick priors or models.
      *   *Sentence 11:* "The one remaining objection is the prior, which is admittedly subjective."
          *   *Verdict:* Acceptable.
      *   *Sentence 12:* "But priors wash out: as the data accumulate the likelihood dominates, so investigators starting from different priors converge on the same posterior."
          *   *Verdict:* Defensible simplification *asymptotically*. Requires "enough" data and that the true model is in the set. In small-sample science (common in catalysis!), priors dominate.
      *   *Sentence 13:* "Subjectivity is therefore a transitory inconvenience rather than a defect, and a small price for a method that answers the question one was asking in the first place."
          *   *Verdict:* Debatable. If data is scarce, subjectivity is permanent.
      *   *Sentence 14:* "Properly understood, the replication crisis is not a reason to doubt science. It is a reason to doubt a particular, and now outdated, statistical technology."
          *   *Verdict:* Wrong/Non sequitur. It indicts the *sociology* of science (incentives) as much as the technology.

  3.  **Evaluate the Book's Conclusion:**
      *   Does the crisis indict technology or practices?
      *   *Analysis:* The argument relies on the idea that Bayesianism removes the *ability* to game the system. It doesn't. It just changes the currency of the game. The conclusion fails because it treats statistics as a vaccine rather than a tool. Bad incentives + Bayesian stats = Bad Bayesian science (e.g., subjective priors chosen to confirm bias).
      *   *Verdict:* The conclusion depends on the weak steps (specifically that incentives disappear and priors always wash out).

  4.  **Evaluate "Evidential Hysteresis":**
      *   *User's Concept:* Priors are built on biased literature. New data updates the posterior, but the prior was already corrupted by the same bias mechanism.
      *   *Is it real?* Yes. This is essentially the problem of "informative priors based on biased meta-analyses."
      *   *Does it violate "priors wash out"?* Yes, if the data accumulation is slow or expensive (common in catalysis). If $N$ is small, the prior dominates. If the prior is wrong (due to bias), the posterior stays wrong longer.
      *   *Bayesian vs. Frequentist:* In Frequentism, the bias is in the *selection* of results (publication bias). In Bayesianism, if you encode that literature into a prior, you hard-code the bias. It becomes harder to inspect because a prior looks like a "belief" rather than a "selection effect."
      *   *Verdict:* The user's worry is astute. It highlights that Bayesian updating assumes the *new* data is unbiased, but if the *old* data (forming the prior) was biased, and the *new* data is scarce, the bias persists. It's a form of path dependence.

  5.  **Drafting the 3-Minute Talk:**
      *   *Goal:* Balance respect for the text with practitioner reality.
      *   *Key Points:*
          1.  Agree on the diagnosis of NHST misuse (confusion of inverse).
          2.  Disagree on the "magic bullet" status of Bayesianism.
          3.  Bring in the "Hysteresis" point as the crucial practical limitation.
          4.  Conclude that incentives matter more than formulas.

  6.  **Refining the Tone:**
      *   Respectful of the philosophers (they deal in logic).
      *   Firm on the empirical reality (catalysis data is expensive, noisy, and scarce).
      *   Avoid jargon where possible, but use precise statistical terms where needed (Likelihood Principle, asymptotic convergence).
      *   Ensure the "Hysteresis" point is validated but grounded.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "stopping rule" claim accurately?
      *   *Correction:* Need to be careful. Strictly speaking, Bayesians obey the Likelihood Principle, so stopping rules *are* irrelevant to the posterior *calculation*. However, they are relevant to the *decision* to publish or act, and to the calibration of the method. I need to make sure I don't say the book is mathematically wrong about the Likelihood Principle, but practically wrong about the *consequences* for scientific integrity.
      *   *Check:* Is "Hysteresis" a standard term?
      *   *Correction:* It's not standard in stats textbooks, but the *phenomenon* (path dependence of priors, bias propagation) is well-known in meta-analysis and hierarchical modeling. I should validate the intuition without claiming it's a named theorem.
      *   *Check:* The user asked for "what a working statistician would say."
      *   *Correction:* A working statistician would worry about "subjective priors" being used to justify pet theories. They would worry about computational complexity. They would agree that NHST is abused but warn that Bayes is not immune to gaming.

  8.  **Final Polish:** Organize into the four requested sections. Ensure the 3-minute talk is distinct and actionable. (Proceed to generate output based on these thoughts).

      *   *Section 1: Audit.* Break down the text.
      *   *Section 2: Conclusion.* Does it survive? No.
      *   *Section 3: Hysteresis.* Validate and expand.
      *   *Section 4: The Talk.* Script it.

      *(Self-Correction on Hysteresis)*: I need to be careful not to say Bayesianism is *worse*. It's that it makes the bias *explicit* (in the prior) which is good, but if the prior is treated as "background knowledge" derived from biased literature, it inherits the bias. Frequentism hides the bias in the "non-significant" files. Bayesianism hides it in the "subjective prior." Both hide it, but Bayesianism claims objectivity through convergence which might not happen in small-N science. I need to nuance this.

      *(Refining the "Stopping Rule" point)*: The book claims optional stopping is fine for Bayesians. Mathematically, for the *posterior odds*, yes. But for *error rates* (false discovery), no. If you simulate a Bayesian trial with optional stopping, you can inflate the false positive rate relative to a fixed sample size design if you use a Bayes Factor threshold analogous to a p-value. This is a subtle but crucial point for a practitioner. I will mention that "calibration" matters.

      *(Final check on constraints)*: No references. Keep it reasoning-based.

      *Okay, ready to write.*
answer: |-
  Here is an audit of the argument, an evaluation of your "hysteresis" concern, and a draft for your contribution to the seminar.

  ### Part 1: Sentence-by-Sentence Audit

  Here is how a working statistician or methodologist would likely react to your reconstruction.

  **"The replication crisis is, at bottom, an artifact of null hypothesis significance testing."**
  *   **Verdict:** **Wrong / Oversimplification.**
  *   **Reasoning:** NHST is a *mechanism* of the crisis, not the root cause. The root cause is the incentive structure (publish or perish, novelty bias). If you ban NHST but keep the incentives, researchers will game the new metric (e.g., "Bayes Factor hacking"). A statistician would say NHST is the gun, but incentives pulled the trigger.

  **"The p-value is the probability of getting data like yours if the null hypothesis is true; what a scientist actually wants is the probability that the hypothesis is true given the data..."**
  *   **Verdict:** **Acceptable.**
  *   **Reasoning:** This is the standard definition ($P(D|H_0)$ vs $P(H|D)$). It is the correct diagnosis of the "confusion of the inverse."

  **"...and the habit of reading the first as the second is what let whole literatures fill up with confident findings that later evaporated."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Reasoning:** It is a primary driver, though not the sole driver. It ignores $p$-hacking and publication bias as independent forces, but for a lay summary, it holds.

  **"Publication bias then compounds the damage: journals print the significant results and shelve the null ones, so the published record is a selection-biased sample in which every reported effect is an overestimate of the truth."**
  *   **Verdict:** **Acceptable.**
  *   **Reasoning:** This describes the "file drawer problem" and the "winner's curse." It is statistically sound.

  **"That is why careful replications, run with larger samples and without the filter, shrink the effect toward zero."**
  *   **Verdict:** **Acceptable.**
  *   **Reasoning:** This is regression to the mean combined with the removal of selection bias.

  **"The remedy is to stop asking the wrong question and become Bayesians."**
  *   **Verdict:** **Non Sequitur.**
  *   **Reasoning:** Changing the statistical framework does not change the question scientists are *asked* by their institutions (i.e., "Do you have a publishable result?").

  **"Bayesian inference gives you exactly what you wanted: a probability for the hypothesis, given the evidence you actually have."**
  *   **Verdict:** **Defensible Simplification (with caveats).**
  *   **Reasoning:** It gives $P(H|D, \text{Prior})$. The caveat is that this probability is conditional on the prior being reasonable. If the prior is garbage, the probability is garbage.

  **"Because Bayes' theorem conditions on the data observed and on nothing else, a Bayesian is free to keep collecting observations until the picture is clear and then stop..."**
  *   **Verdict:** **Technically Acceptable, Practically Dangerous.**
  *   **Reasoning:** This relies on the *Likelihood Principle*, which states that all evidence is in the likelihood function. Mathematically, the posterior is valid regardless of stopping intent. *However*, if you simulate this process, optional stopping *does* inflate the rate at which you cross a threshold of "convincing evidence" by chance. It solves the mathematical inconsistency but creates a calibration problem.

  **"...there is no analogue of the stopping-rule inflation of false positives that makes optional stopping a form of cheating under significance testing."**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** There is an analogue. If you treat a Bayes Factor of 10 as a "discovery threshold" analogous to $p < 0.05$, and you peek at the data repeatedly, you will reach that threshold faster by chance than if you fixed the sample size. It is harder to calculate than frequentist inflation, but it exists.

  **"The researcher degrees of freedom that generate p-hacking accordingly lose their leverage, and the incentive to fish disappears."**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** Incentives do not disappear because you changed the math. Researcher degrees of freedom shift from "which test to run" to "which prior to choose" or "which covariates to include in the model."

  **"The one remaining objection is the prior, which is admittedly subjective."**
  *   **Verdict:** **Acceptable.**

  **"But priors wash out: as the data accumulate the likelihood dominates, so investigators starting from different priors converge on the same posterior."**
  *   **Verdict:** **Defensible Simplification (Asymptotically).**
  *   **Reasoning:** This is the *Bernstein-von Mises theorem* intuition. It holds as $N \to \infty$. In fields like catalysis, where $N$ is often small and data is expensive, the prior often does *not* wash out. It dominates.

  **"Subjectivity is therefore a transitory inconvenience rather than a defect, and a small price for a method that answers the question one was asking in the first place."**
  *   **Verdict:** **Debatable.**
  *   **Reasoning:** In small-sample science, subjectivity is a permanent feature, not transitory.

  **"Properly understood, the replication crisis is not a reason to doubt science. It is a reason to doubt a particular, and now outdated, statistical technology."**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This is the weakest link. It assumes the crisis is purely epistemological (how we know) rather than sociological (how we behave). Technology does not drive behavior; incentives do.

  ---

  ### Part 2: Does the Conclusion Survive?

  **No.** The book's conclusion—that the crisis indicts a technology rather than our practices of inquiry—depends entirely on the weak steps identified above.

  Specifically, it depends on the claim that "incentives to fish disappear" under Bayesianism. They do not. A researcher under pressure to publish can select a "skeptic's prior" that is actually too optimistic, or they can stop collecting data the moment the Bayes Factor crosses a publication threshold.

  If you repair the weak steps (acknowledging that priors don't always wash out in small samples, and that optional stopping still allows for gaming), the argument collapses into: "Bayesianism is a better language for uncertainty, but it is not a vaccine against bad incentives."

  The crisis indicts the *ecosystem* of science (funding, hiring, publishing), of which NHST is merely the most visible tool. Replacing the tool without changing the ecosystem is like replacing a hammer with a screwdriver when the problem is that you are trying to build a house without a blueprint.

  ---

  ### Part 3: Your "Evidential Hysteresis" Worry

  Your intuition is sharp, and it identifies a real vulnerability in the Bayesian argument, specifically regarding the claim that "priors wash out."

  **Is it a real phenomenon?**
  Yes. In statistics, this is related to **path dependence** and the problem of **informative priors derived from biased literature**. If your prior is constructed from a meta-analysis of previous studies, and those previous studies suffered from publication bias, your prior is systematically shifted away from zero.

  **Does it tell against "priors wash out"?**
  Yes. The theorem that priors wash out assumes the data generating process is stable and that you have enough data to overwhelm the prior. In your catalysis example:
  1.  **Data is expensive:** You cannot get $N \to \infty$ easily.
  2.  **The Prior is Contaminated:** The "consensus" prior is built on the factor-of-60 papers.
  3.  **The Update is Slow:** A new, well-controlled study showing a factor-of-2 effect is just *one* likelihood function. If the prior is strong (because it represents "40 years of literature"), a single new study will not move the posterior much. It takes many replications to move a strong prior.

  **Is a Bayesian field worse off here?**
  This is the subtle point.
  *   **In Frequentism:** The bias is hidden in the *file drawer*. The published record says "Factor of 60," and the null results are invisible. The bias is opaque.
  *   **In Bayesianism:** The bias is encoded in the *prior*. The published record says "Factor of 60," and the prior explicitly states "We believe it is around 60."

  Paradoxically, Bayesianism might be **better** here, but only if the prior is made explicit. In frequentism, the bias is structural and invisible. In Bayesianism, the bias is parameterized. If you force the field to state their prior, they must admit, "We believe this because of past papers." Then you can audit the past papers.

  However, your worry holds if the Bayesian treats the prior as "background knowledge" rather than "a parameter to be justified." If the prior is treated as subjective belief, it is harder to challenge than a p-value. A p-value is a calculation anyone can check. A prior is a "belief" that is harder to falsify.

  **Verdict on Hysteresis:** Your worry is valid. It highlights that **updating is not erasing.** If the starting point is biased, and the rate of new data is slow, the field stays biased for a long time. This violates the "priors wash out" promise in any realistic timeframe.

  ---

  ### Part 4: What to Say in the Seminar (3 Minutes)

  Here is a draft script. It leverages your authority as a practitioner while respecting the philosophical discussion.

  "I want to validate the diagnosis in the first paragraph but challenge the remedy in the second, based on forty years of running experiments.

  The author is right that we confuse $P(\text{Data}|\text{Hypothesis})$ with $P(\text{Hypothesis}|\text{Data})$. In my field, we saw effect sizes shrink from factors of sixty down to two as controls improved. That is real, and publication bias drove it.

  But the claim that Bayesianism fixes the *incentives* is where the argument breaks. The book says researcher degrees of freedom lose their leverage under Bayesianism. In practice, they just shift. Instead of $p$-hacking, we risk 'prior-hacking' or 'optional stopping' until the Bayes Factor looks publishable. The math changes, but the pressure to produce a 'clean' story does not.

  I also want to raise a specific problem I call **evidential hysteresis**. The book claims priors 'wash out' as data accumulates. That assumes data is cheap and abundant. In experimental science, data is expensive. If our priors are built on forty years of biased literature—as mine were—those priors are strong and wrong. A single well-controlled replication cannot overwhelm a prior built on thousands of biased papers. The field's posterior lags the truth because the 'background knowledge' is contaminated.

  So, is Bayesianism worse? No. But it is not a vaccine. In frequentism, the bias hides in the file drawer. In Bayesianism, it hides in the prior. At least in Bayesianism, the bias is explicit—we can argue about the prior. But we must not pretend that changing the statistics changes the sociology.

  My advice: Adopt Bayesian reporting if it helps you quantify uncertainty, but do not expect it to stop scientists from fishing. Only transparency and preregistration do that. The crisis isn't the tool; it's how we are paid to use it."
