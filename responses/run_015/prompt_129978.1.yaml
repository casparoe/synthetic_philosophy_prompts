      *   **Timeline:** 12-month and 36-month reviews as requested.
      *   **Tone:** Bureaucratic, ethical, nuanced, authoritative.

  5.  **Refining the Argument on Neutrality (Key Prompt Requirement):**
      *   *Challenge:* Can a menu be neutral if the state pays for it?
      *   *Argument:* No, not entirely. But we can mitigate it. The memo must admit that "pluralist menus" are insufficient on their own because the *act of subsidizing* creates a hierarchy of value. The condition must be that the state does not endorse the metrics, but rather funds *access to information* while remaining agnostic about the choice. Wait, the prompt says the program screens *for* flourishing.
      *   *Revision:* I need to be honest. The memo should state that true neutrality is impossible here. The decision rests on whether the benefit outweighs the breach of neutrality. The conditions must focus on *democratizing the definition* of flourishing, not just offering a menu.

  6.  **Drafting the Content (Iterative refinement):**

