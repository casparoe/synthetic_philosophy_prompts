  **NATIONAL REPRODUCTIVE-ETHICS ADVISORY BOARD (NREAB)**

  **MEMORANDUM OF DECISION**

  **TO:** Consortium of Participating Fertility Clinics; Department of Health & Human Services
  **FROM:** National Reproductive-Ethics Advisory Board
  **DATE:** October 26, 2024
  **SUBJECT:** Decision on Application No. 2024-PGS-POLY (Pilot Program for Polygenic Flourishing Indices)

  **I. EXECUTIVE SUMMARY**

  The National Reproductive-Ethics Advisory Board (NREAB) has reviewed the application to pilot a state-subsidized Preimplantation Genetic Screening (PGS) program targeting polygenic "flourishing indices" (emotional resilience, cognitive flexibility, social adaptability). After extensive deliberation regarding the principles of procreative beneficence, justice, and liberal neutrality, the Board issues a decision of **APPROVAL WITH STRICT CONDITIONS**.

  This pilot may proceed only under a regulatory framework designed to mitigate structural coercion and monitor long-term societal impact. This approval is provisional, contingent upon successful adherence to the oversight mechanisms and review milestones detailed in Section IV.

  **II. ETHICAL ANALYSIS AND RATIONALE**

  The Board recognizes the ethical weight of *procreative beneficence*—the obligation of parents to select the child, of those possible children they could have, who is expected to experience the best quality of life. The applicants argue that if genetic data can predict traits correlated with well-being, withholding access exacerbates inequality.

  However, the Board also recognizes the profound risks identified by critics: the potential for a "new eugenics" driven not by state mandate, but by market incentives and subsidized preference. The central ethical tension lies in whether the state can fund genetic optimization without endorsing a specific conception of the "good life."

  **III. ADDRESSING THE NEUTRALITY OBJECTION**

  The strongest objection raised during public comment—and the primary concern for the minority opinion within the Board—is that **pluralist trait-weighting menus cannot genuinely preserve liberal neutrality when the institutional framework defines and rewards "flourishing."**

  The applicants propose allowing parents to weight traits differently (e.g., prioritizing resilience over cognitive flexibility). The Board acknowledges the critics' contention that this is insufficient. By creating a subsidy program specifically for *genetic* interventions targeting *specific* psychological traits, the state implicitly signals that these traits are amenable to genetic control and are of sufficient value to warrant public expenditure. This creates a "soft mandate": when the state pays for genetic resilience but not for social programs that build resilience, it privileges biological solutions over environmental ones.

  Furthermore, the fact that clinics design the metrics introduces a conflict of interest. A "menu" is not neutral if the restaurant owns the farm and decides what constitutes "food."

  **The Board treats this objection with the utmost seriousness.** We acknowledge that no regulatory condition can fully restore liberal neutrality once the state enters the business of subsidizing trait selection. There is a non-negligible risk that this program will normalize the view that children are products to be optimized, and that disadvantaged parents will feel coerced to participate to ensure their children are "competitive."

  However, the Board judges that a total rejection would drive this technology into unregulated private markets, increasing inequality without the benefit of public oversight. Therefore, we proceed with conditional approval, treating the pilot not as an endorsement of the technology, but as a rigorous ethical stress-test.

  **IV. CONDITIONS OF APPROVAL**

  To mitigate the risks outlined above, the following conditions are mandatory:

  1.  **Independent Metric Governance:** The clinics may not unilaterally design the "Flourishing Indices." A Civic Bioethics Panel (comprising disability advocates, sociologists, and parent representatives) must audit and approve the polygenic risk score algorithms to ensure they do not correlate with protected classes or socioeconomic biases.
  2.  **Subsidy Caps to Prevent Coercion:** State subsidies shall cover only 50% of the procedure cost. Full subsidization is prohibited. The Board agrees with critics that 100% funding creates undue structural pressure on low-income parents to select for state-valued traits. A co-pay requirement preserves the "voluntary" nature of the choice.
  3.  **Mandatory Counseling on Environmental Equivalence:** Prospective parents must undergo counseling that explicitly details the limited predictive power of polygenic scores compared to environmental factors (e.g., nutrition, schooling, stable housing). The state must affirm that genetic selection is not a substitute for social support.
  4.  **Data Transparency:** All data regarding embryo discard rates and trait selection patterns must be publicly reported quarterly to monitor for emerging societal biases (e.g., if 95% of parents select for the same trait despite the "pluralist menu").

  **V. IMPLEMENTATION TIMELINE AND REVIEW MILESTONES**

  The pilot program is authorized for a 48-month duration, subject to the following mandatory review milestones:

  *   **Month 0-12 (Phase I: Limited Enrollment):**
      *   Enrollment capped at 200 cycles.
      *   Focus: Validation of counseling protocols and Civic Bioethics Panel audit of algorithms.
      *   **12-Month Review:** The NREAB will assess whether the "pluralist menu" is functioning. If data shows >80% convergence on a single trait profile, the program will be paused for re-evaluation of the neutrality framework.

  *   **Month 13-36 (Phase II: Expanded Enrollment):**
      *   Enrollment may expand to 1,000 cycles contingent on Month 12 approval.
      *   Focus: Longitudinal tracking of parental psychological outcomes (regret, anxiety) and socioeconomic demographics of participants.
      *   **36-Month Review:** A comprehensive impact assessment. Key metric: Are participants from disadvantaged backgrounds enrolling at rates proportional to the general population, or are they being disproportionately pressured to participate?

  *   **Month 37-48 (Phase III: Wind-Down or Extension):**
      *   Based on the 36-month review, the Board will recommend permanent termination, indefinite extension, or transition to standard care.
      *   Final report must address whether the program has shifted public perception of disability or human variation.

  **VI. CONCLUSION**

  The Board authorizes this pilot not because we are convinced that polygenic flourishing indices are ethically benign, but because we believe they are inevitable. The question is whether they can be introduced within a framework that acknowledges their moral costs.

  We explicitly acknowledge the critics' warning: **We may find at the 36-month mark that structural pressure cannot be mitigated by counseling or co-pays.** Should that evidence emerge, the Board is prepared to recommend the immediate termination of state subsidies. The presumption of this approval is not that the technology is good, but that our understanding of its impact is currently incomplete. This pilot is an act of inquiry, not an act of endorsement.

  **Signed,**

  *Dr. Elena Rostova, Chair*
  *National Reproductive-Ethics Advisory Board*
