answer: |-
  ### Consistency Audit

  **1. Critical Tension: (3) vs. (1) + (2) + (6)**
  *   **Severity:** Fatal.
  *   **The Conflict:** (1) states that "functional organization" is what matters, not the material or numerical identity. (2) and (6) confirm that gradual functional replacement preserves this organization. (3) asserts that a functional duplicate created via scan-and-copy does *not* preserve what matters. If functional organization is the sole criterion for "what matters" (as per 1), the method of instantiation (gradual vs. scan) is irrelevant, provided the functional counterfactuals (6) are met. Your friend is correct that (1) and (2) logically entail the acceptance of (3)'s counterpart.
  *   **Cost to Resolve:**
      *   *Option A (Drop 3):* You accept scan-and-copy as survival. **Cost:** You violate your core intuition about death and discontinuity.
      *   *Option B (Modify 1):* You add a constraint that functional organization must be sustained by a specific *causal history* (not just pattern matching). **Cost:** You abandon pure functionalism. You must explain why a causal chain of neurons matters more than a causal chain of data transfer, which risks reintroducing the "carbon superstition" your friend accused you of.

  **2. Critical Tension: (7) vs. (4)**
  *   **Severity:** High.
  *   **The Conflict:** (4) explicitly accepts the Parfitian conclusion: in a fission case, survival is "about as good as ordinary survival." (7) describes a fission case (drifting into two independent duplicates) and asserts that "something has been lost... a kind of death." You cannot simultaneously hold that fission is survival (4) and that fission is a loss/death (7).
  *   **Cost to Resolve:**
      *   *Option A (Drop 7):* You accept the fission outcome as non-tragic. **Cost:** You suppress the specific intuition that branching dilutes or destroys the "self."
      *   *Option B (Modify 4):* You reject the Parfitian line and assert that survival requires *uniqueness*. **Cost:** You must accept that if you fission, you die (or cease to exist as a unique continuant), even though two conscious people walk away with your memories. This makes survival much more fragile than (4) allows.

  **3. Critical Tension: (7) vs. (2)**
  *   **Severity:** Medium-High.
  *   **The Conflict:** (2) asserts that small, gradual functional swaps preserve survival. (7) constructs a scenario where the steps are *smaller* than those in (2), yet the outcome is "death" or "loss." This is a Sorites paradox: if every step preserves survival, the sum of steps cannot result in death.
  *   **Cost to Resolve:**
      *   *Option A (Deny 7's premise):* Claim there *is* a discrete moment of branching that breaks continuity. **Cost:** You contradict the setup of the thought experiment (imperceptible degrees).
      *   *Option B (Accept Vagueness):* Admit "survival" is a vague predicate that can fade out. **Cost:** You undermine the binary certainty you seem to want in (3) (where scan-and-copy is definitely death).

  **4. Apparent Tension: (5) vs. (3)**
  *   **Severity:** None.
  *   **Analysis:** There is no contradiction here. (5) concerns *consciousness* (is the duplicate a person?). (3) concerns *survival* (is the duplicate *me*?). You can consistently hold that the copy is a conscious person (5) who is numerically distinct from you and does not inherit your survival rights (3). This is a standard Lockean/Parfitian distinction. Your friend's accusation of "superstition about carbon" targets (1), not (5).

  ### Single Best Revision

  **Modify (1) to include a "Non-Branching Causal Constraint."**

  *   **The Revision:** Change (1) from "What matters... is continuity of psychological and functional organization" to "What matters is **unique, causally continuous** psychological and functional organization."
  *   **Why it cleans up the most:**
      *   **Resolves (3):** Scan-and-copy fails because it lacks the right *causal* continuity (it is replication, not continuation) or fails the *uniqueness* test.
      *   **Resolves (4) & (7):** Fission fails the *uniqueness* test. You can consistently say fission is a loss (aligning with 7) and reject the Parfitian "as good as survival" claim (modifying 4).
      *   **Preserves (2):** Gradual replacement maintains unique causal continuity.
  *   **The Cost:** You must abandon the pure Parfitian view in (4). You are committing to the view that identity (or something very close to it, i.e., non-branching continuity) *does* matter after all. This makes survival fragile: if your brain is split, you die, even if "what matters" psychologically continues twice.

  ### Analysis of Point (7)

  **Can it be a principle?**
  Yes. It can be stated as the **Non-Branching Requirement**: *Survival requires that there be at most one future individual who is psychologically continuous with me.*

  **Is it residue ruled out by (1) and (4)?**
  It is residue *only* if you insist on keeping (1) and (4) exactly as written. (1) defines survival by organization alone; (4) defines fission as survival. (7) intuition is ruled out by the conjunction of (1) and (4). However, if you treat (7) as the primary intuition and adjust (1) and (4) to fit it (as per the revision above), it becomes a coherent principle rather than a contradiction. It is not merely an emotional residue; it is the core of a "No-Branching" theory of identity (similar to Bernard Williams or Robert Nozick).

  ### Confidence Assessment

  *   **Claim:** Tension (3) vs (1)/(2) is the most severe inconsistency. **Confidence:** 95%. (This is the classic Teletransportation Paradox).
  *   **Claim:** Tension (5) vs (3) is apparent, not real. **Confidence:** 98%. (Standard distinction between personhood and persistence).
  *   **Claim:** Modifying (1) to include a Non-Branching Constraint is the single most effective revision. **Confidence:** 85%. (It resolves the logical conflicts, though it shifts your metaphysical stance significantly).
  *   **Claim:** (7) can be formalized as the Non-Branching Requirement. **Confidence:** 90%. (This is a well-established position in philosophy of mind).
  *   **Claim:** The cost of the revision is abandoning the Parfitian view in (4). **Confidence:** 80%. (Some Parfitians argue R-relation matters *even* with branching, so claiming you *must* drop (4) relies on interpreting (7)'s "loss" as incompatible with Parfit's "as good as survival").

  **Least Sure Claim:** I am least sure about the **80% confidence claim** regarding the incompatibility of (4) and the Non-Branching Requirement. Some philosophers argue one can maintain a Parfitian reductionist view while acknowledging a practical or normative preference for non-branching, without claiming metaphysical death. However, given your phrasing in (7) ("a kind of death"), a strong Non-Branching constraint seems required, which does conflict with the spirit of (4).
