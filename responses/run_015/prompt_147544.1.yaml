      *   *Chase & Sanborn (Coffee Tasters):* They argue that qualia are not stable and introspection is unreliable. This fits the post-intervention rejection (you can't trust your report of change). But does it fit the pre-intervention requirement? Only if the requirement is acknowledged as a necessary fiction or a behavioral anchor.

