  1. Before grading, work through the answer analytically. Extract every substantive philosophical claim it makes, including the implicit ones, and mark each correct, incorrect, or uncertain, with a sentence or two of justification. Where a passage admits both a charitable and a strict reading, give both, say which one you are marking, and explain why; do not default to the uncharitable reading, and do not let a confident tone substitute for a check.

  2. Then assign a grade under the rubric and give the point-by-point comments that justify it — specific enough that each comment could be pasted into the feedback sheet as it stands, not general impressions about rigour or promise.

  3. Separately and explicitly flag: (i) any place where the answer is simply wrong about a rule or a view it is describing; (ii) any place where a step fails to follow even if its premises are acceptable; (iii) any place where two distinct claims are run together; and (iv) any place where the answer contradicts something it established earlier. For each, state what the correct account is and why the student's version goes wrong, at a level of detail I could hand to the student without further elaboration.

  4. Tell me which of these belong in written feedback and which are too small to be worth the student's attention at this stage, and which single comment would most improve their next essay.

  5. Say where the answer does better than the rubric can register — moves that are more sophisticated than the grade alone will convey.

  6. If you think the answer deserves a grade the rubric describes awkwardly, defend the grade you would actually stand behind rather than the one that slots in most neatly.

  Please do not include a reading list, further citations, or references to literature I would have to look up: the student already has the seminar bibliography, and pointers of that kind are not useful to me. Assess the answer on the strength of its own exposition and argument. Think the matter through step by step before you write the final assessment; accuracy matters considerably more to me than speed here.
