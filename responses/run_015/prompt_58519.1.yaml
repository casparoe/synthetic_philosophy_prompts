answer: |-
  ### Quick Brainstorming

  *   **Audience:** Biology major. Key leverage points: ecosystems, homeostasis, control groups, unintended consequences in biological systems (e.g., introducing a species), side effects vs. primary function.
  *   **Core Challenge:** "Impact" is counterfactual. It's not about what happened; it's about what *would have* happened otherwise. This is the hardest conceptual leap.
  *   **Time Management:** 30 minutes is tight. 5 min intro, 10 min example/problem, 10 min baseline solution, 5 min check/wrap.
  *   **Tone:** Conversational but precise. Avoid jargon like "utility function" unless defined immediately.
  *   **Visuals:** No slides needed, but use hand gestures or objects in the room (coffee mug, door) to ground the example.
  *   **Pitfall:** Getting bogged down in *how* to code it. Keep it on *what* we are asking the AI to do.
  *   **Pitfall:** Confusing "low impact" with "low capability." Must distinguish power from footprint.

  ---

  ### The 30-Minute Lesson Plan: Low-Impact AI

  Here is your teaching roadmap. It is structured to leverage her biology background while strictly controlling the philosophical nuances.

  #### 1. The Order of Operations (and Why)

  You must introduce concepts in this specific sequence. Do not swap step 2 and 3.

  1.  **The Goal (The "Primary Function"):** Define what the AI is *supposed* to do.
  2.  **The Baseline (The "Control Group"):** Define what happens if the AI does *nothing*.
  3.  **The Side Effects (The "Delta"):** Define impact as the difference between Step 1 and Step 2.
  4.  **The Constraint:** Explain that we want to maximize Step 1 while minimizing Step 3.

  **Why the Baseline Must Come Before Side Effects:**
  You need to stress this specifically. In biology, you cannot claim a drug caused a change without a control group to show what happens naturally. Similarly, you cannot define an AI "side effect" without establishing what the world looks like if the AI stays off.
  *   *If you skip this:* She will think "side effects" are just "bad things that happen." She might argue that breathing air is a side effect.
  *   *The Fix:* By establishing the baseline first, you define impact as **change relative to inaction**. This prevents the "doing less stuff" misconception later. It frames impact as a *difference measure*, not an absolute measure.

  #### 2. The Carrying Example: "BrewBot"

  Use one single scenario for the entire 30 minutes. Do not switch examples.

  *   **The Robot:** A general-purpose household helper robot (call it "BrewBot").
  *   **The Task:** BrewBot is tasked with **"Make me a cup of coffee."**
  *   **What the Example MUST Show:**
      *   **Success:** The coffee gets made (the goal is achieved).
      *   **Path Dependence:** Show two ways to make the coffee.
          *   *Path A (High Impact):* BrewBot knocks over a vase, scares the cat, and leaves the cupboard open while making the coffee.
          *   *Path B (Low Impact):* BrewBot makes the coffee without moving the vase, without startling the cat, and closes the cupboard.
      *   **The Baseline Scenario:** Explicitly describe the room if BrewBot **does nothing**. The coffee doesn't get made, but the vase stays upright, the cat sleeps, the cupboard stays closed.
  *   **What the Example MUST Lack:**
      *   **Malice:** BrewBot never *tries* to break the vase. It must be accidental collateral damage.
      *   **Complex Social Nuance:** Don't worry about whether the coffee is ethically sourced yet. Keep it physical state changes.
      *   **Incapability:** BrewBot must be physically capable of breaking the vase. Low impact isn't about being too weak to break things; it's about choosing not to.

  #### 3. Misconceptions and How to Head Them Off

  She will likely bring three specific misconceptions. Here is where they will appear and exactly what to say.

  **Misconception 1: "Low Impact means the AI is lazy or does less."**
  *   *When it happens:* When you explain minimizing side effects.
  *   *The Head-Off:* "Think of it like surgery. A skilled surgeon makes a big change (removes the tumor) but leaves minimal scar tissue. A clumsy surgeon makes the same change but destroys surrounding muscle. Low-impact AI is the skilled surgeon, not the one who refuses to operate."
  *   *Key Phrase:* "It's about precision, not power."

  **Misconception 2: "Impact is just physical damage."**
  *   *When it happens:* When discussing the vase.
  *   *The Head-Off:* "In biology, introducing a species changes the ecosystem even if nothing dies immediately. For AI, impact includes changing information, shifting market prices, or altering human habits. Breaking a vase is easy to see, but changing the news feed is also impact."
  *   *Key Phrase:* "Impact is any change to the state of the world, not just breakage."

  **Misconception 3: "We can just tell it to be careful."**
  *   *When it happens:* At the end, when discussing solutions.
  *   *The Head-Off:* "If you tell a human 'be careful,' they understand common sense. If you tell an AI 'be careful,' it might freeze in place because moving at all carries risk. We need a mathematical definition of 'careful,' not just a command."
  *   *Key Phrase:* "AI does what we say, not what we mean."

  #### 4. The Check Question

  At the 25-minute mark, ask this specific question to verify she understands the **baseline** concept. Do not ask "Do you get it?"

  **The Question:**
  "Imagine BrewBot's goal is to turn off a light. If I say BrewBot has 'zero impact,' does that mean the light stays on, or does it mean the light goes off but nothing *else* in the room changes?"

  *   **Correct Answer:** "The light goes off (goal achieved), but nothing else changes (baseline preserved)."
  *   **If she says "Light stays on":** She thinks low-impact means "do nothing." Remind her: "No, the goal must be met. We are minimizing the *extra* changes."
  *   **If she says "Nothing else changes":** She got it. Proceed to wrap up.

  #### 5. What to Openly Leave Out

  You cannot cover everything in 30 minutes. Explicitly tell her you are skipping these two things so she knows there is more depth later:

  1.  **The Math of Measurement:** Don't explain *how* we calculate the difference between states (e.g., relative reachability or attainable utility). Just say "we measure the difference."
  2.  **Existential Risk:** Don't drift into "AI killing everyone." Keep it on "AI messing up the house." The logic scales, but the stakes distract from the mechanism right now.

  ### Summary Script for You (Mental Cheat Sheet)

  1.  **Min 0-5:** Hook. "You know how introducing a predator changes an ecosystem? AI is like introducing a predator into our daily lives."
  2.  **Min 5-15:** BrewBot Example. Goal: Coffee. Show the mess (vase/cat). Ask: "Was the mess necessary for the coffee?"
  3.  **Min 15-25:** The Baseline. "Compare the Coffee Room to the No-Robot Room. The difference is the impact." Address the "lazy AI" misconception here.
  4.  **Min 25-30:** Check Question. Wrap up. Acknowledge the hard parts you skipped.

  Good luck. Keep it grounded in the "control group" analogy; that's your winning ticket with a biology major.
