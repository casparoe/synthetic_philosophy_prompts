  (3) once I'm told the actual randomising mechanism, that mechanism settles it — its symmetries fix the distribution, and indifference over parametrisations drops out entirely (the Jaynes move, basically).
  (4) but I still want indifference to hand me a number in cases where there's no mechanism at all, and the way I try to get one is by demanding invariance under redescription: "ratio of wine to water is between 1/3 and 3" is the same problem as "ratio of water to wine is between 1/3 and 3", so I require the prior to survive r → 1/r, and out comes 1/2.
  (5) I also refuse to go imprecise. I want one number out of all this, not a set of priors or a range — reporting a range feels like giving up.

  here's the case that's bugging me. A machine makes spheres; all I'm told is that the radius is somewhere between 1cm and 10cm, nothing about how the radius gets set. What's the probability the volume is more than half the largest volume it could be? Uniform over radius gives about 0.23, uniform over volume gives about 0.5, uniform in log radius gives about 0.10, and the fixed bounds kill every symmetry I'd want to appeal to in (4), so that move returns nothing — but (5) says I still owe a number, and (1)+(2) just say the question is ill-posed.

  Which of these five is doing work I'm not entitled to? Rank the tensions by severity, say for each what would have to give and what that costs, and tell me whether any pair I'm treating as fine is actually the cracked one.
