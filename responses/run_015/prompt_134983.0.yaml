      *   *Correction on (d) vs (e):* This is the "Benefit vs. Harm" asymmetry. It's defensible but needs explicit defense against charges of inconsistency.
      *   *Revision:* The "Asset Tracing" revision is better than "Role Succession." It respects (g) (only liable for what you actually hold/gained) but fixes (f) (you can't dissolve to escape debt if assets remain).

  8.  **Final Polish:** Check against the prompt's specific questions one last time.
