answer: |-
  **Project Title:** Multidimensional Standing: A Taxonomy of Hypocrisy and Moral Blame

  **1. Research Question**
  The prevailing debate concerning hypocrisy and moral standing asks a binary question: does the fact that a blamer is a hypocrite forfeit their standing to blame entirely? This project rejects the unitary conception of standing implicit in this question. Instead, it poses a determinately answerable comparative question: *To what extent do distinct varieties of hypocrisy (in-domain versus cross-domain; upward, downward, versus horizontal) differentially undermine the epistemic, normative, and affective dimensions of standing to blame?*

  By treating standing not as a single status but as a composite of three distinct dimensions, this research seeks to map the specific conditions under which hypocrisy erodes a blamer's authority. The question is answerable because it allows for the isolation of variables: we can construct cases where a hypocrite retains epistemic clarity but loses normative authority, or retains normative authority but lacks affective legitimacy. The goal is to determine whether our intuitive judgements about standing track these dimensions separately or whether they collapse into a single verdict.

  **2. The Gap in Existing Literature**
  Contemporary literature on moral responsibility largely treats 'standing to blame' as a monolithic threshold condition. The dominant view posits that hypocrisy functions as a defeater condition: if an agent is hypocritical regarding a specific norm, they lose the right to blame for violations of that norm. This 'forfeiture model' assumes that standing is unitary. Consequently, the literature fails to account for the asymmetry of our moral intuitions. We often feel that a hypocrite may still be *correct* that a wrong occurred (epistemic), even if we resent their *tone* (affective) or doubt their *authority* to sanction (normative).

  By treating standing as unitary, existing accounts obscure the selective effects of hypocrisy. They cannot explain why we might accept a hypocrite's factual assessment of a situation while rejecting their emotional expression, or why we might tolerate hypocrisy from a subordinate blaming a superior (horizontal/upward) differently than from a superior blaming a subordinate (downward). The literature leaves open the possibility that 'standing' is not a switch that is flipped off, but a dial with multiple settings that can be adjusted independently. This project addresses this gap by disaggregating the concept.

  **3. Methodology**
  The research will employ a method of rigorous conceptual analysis supported by structured thought experiments. The project will proceed in three analytical stages.

  First, I will construct precise definitions for the three dimensions of standing. *Epistemic standing* refers to the blamer's positioning to recognise the wrong accurately. *Normative standing* refers to the entitlement to hold the wrongdoer to account without self-undermining authority. *Affective standing* refers to the legitimacy of expressing moral resentment or indignation.

  Second, I will develop a taxonomy of hypocrisy cases to test these dimensions. This taxonomy will vary three parameters:
  *   **Domain:** *In-domain* hypocrisy (committing the same wrong one blames) versus *Cross-domain* hypocrisy (committing a different but structurally comparable wrong).
  *   **Visibility:** *Private* hypocrisy (unknown to the target) versus *Public* hypocrisy (known to the target).
  *   **Direction:** *Upward* (blaming an authority), *Downward* (blaming a subordinate), or *Horizontal* (blaming a peer).

  Third, I will test whether our intuitions track these dimensions separately. I will construct a series of vignettes systematically varying these parameters. For example, a case of private, cross-domain, horizontal hypocrisy will be compared against public, in-domain, downward hypocrisy. I will analyse these cases dialectically, isolating whether the intuitive objection in each case targets the blamer's knowledge, their authority, or their emotional expression. This is not empirical psychology, but a philosophical stress-testing of concepts to see if the proposed distinctions hold under pressure.

  **4. Success and Failure Conditions**
  A positive result will consist of a principled mapping of the relationship between hypocrisy types and standing dimensions. For instance, a successful outcome might demonstrate that in-domain hypocrisy invariably destroys normative standing but leaves epistemic standing intact, whereas cross-domain hypocrisy primarily degrades affective standing. Alternatively, it might reveal that 'direction' is the primary determinant of normative standing, while 'domain' determines affective standing. The output will be a framework showing which dimensions are vulnerable to which types of hypocrisy.

  A negative result (failure) would occur if the three dimensions prove inseparable. If, upon analysis, it becomes clear that one cannot coherently possess epistemic standing without normative standing, or if intuitions regarding the vignettes prove too noisy and inconsistent to form a pattern, the multidimensional hypothesis will be falsified. Additionally, if the taxonomy creates distinctions that are too fine-grained to be morally relevant, the project will have failed to identify a meaningful structure.

  **5. Timeline and Risk Assessment**
  The six-month fellowship will be divided into three phases.
  *   **Months 1–2 (Conceptual Mapping):** Refining the definitions of the three dimensions and reviewing the general landscape of standing literature to ensure the taxonomy is novel.
  *   **Months 3–4 (Case Analysis):** Constructing the vignettes and conducting the dialectical testing. This involves writing out the cases and analysing the intuitive responses to isolate the specific dimension being targeted.
  *   **Months 5–6 (Synthesis and Writing):** Integrating the findings into a cohesive argument and drafting the final research paper.

  The primary risk is scope creep. The taxonomy of hypocrisy is potentially infinite. To mitigate this, I will restrict the analysis to the specific variables outlined above (domain, visibility, direction) and resist the urge to expand into other forms of moral inconsistency (such as complicity or selective enforcement) unless they directly impinge on the core taxonomy. A secondary risk is that the 'affective' dimension may prove difficult to distinguish from the 'normative'. If this occurs, the scope will be adjusted to focus on the Epistemic/Normative split only, though the three-part model remains the primary aim. Six months is sufficient for this conceptual work provided I do not attempt empirical data collection, which would require ethical clearance and exceed the timeframe.

  **6. Broader Significance**
  This research matters for the broader theory of moral responsibility because it refines our understanding of moral address. If standing is multidimensional, then the practice of blaming is not a single speech act but a complex interaction involving knowledge, authority, and emotion. Demonstrating that hypocrisy affects these components selectively suggests that moral responsibility is not merely about who is permitted to speak, but about the specific quality of their moral address. This moves the theory of responsibility away from a transactional model of rights and forfeitures towards a more granular architecture of moral relations. It clarifies the conditions under which moral criticism remains valid even when the critic is flawed, thereby preserving the possibility of moral progress and dialogue in non-ideal circumstances without requiring moral purity from the blamer.
