answer: |-
  # Diagnostic Taxonomy of Dynastic Wealth and Equality of Opportunity

  **Instructions:** Answer each question sequentially based on your normative intuitions about justice. Follow the path indicated by your answers until you reach a terminal leaf. Do not look ahead to the position names; select the answer that best reflects your judgment on the specific case or principle presented.

  ### **Node 1 (Root)**
  **Does the intergenerational transmission of substantial economic advantage, considered as a social practice, constitute a structural impediment to fair equality of opportunity, or is it a permissible outcome of individual liberty?**
  *   **A.** It is a permissible outcome of individual liberty. → *Go to Leaf 1*
  *   **B.** It constitutes a structural impediment to fair equality of opportunity. → *Go to Node 2*

  ---

  ### **Node 2 (Mechanism Distinction)**
  **Does the violation of equality of opportunity arise from the direct bequest of liquid assets/property (capital-lock), the transmission of social networks/educational access (status-lock), or both?**
  *   **A.** Capital-lock violates opportunity; Status-lock does not (or is outside state remedy). → *Go to Node 3*
  *   **B.** Status-lock violates opportunity; Capital-lock does not. → *Go to Gap Analysis A*
  *   **C.** Both Capital-lock and Status-lock violate opportunity. → *Go to Node 4*

  ---

  ### **Node 3 (Hypothetical Test)**
  **Consider a hypothetical in which capital-lock inheritance is fully abolished through taxation, but status-lock inheritance remains entirely intact. Would this outcome satisfy the demands of justice?**
  *   **A.** Yes, justice is satisfied. → *Go to Leaf 2*
  *   **B.** No, justice is not satisfied. → *(Logical Contradiction with Node 2A; Re-evaluate Node 2)*

  ---

  ### **Node 4 (Baseline Assessment)**
  **Should the baseline for assessing opportunity be evaluated within a single life-course (intragenerational equality) or tracked across family lines over successive generations (intergenerational equality)?**
  *   **A.** Within a single life-course (focus on current competitive positions). → *Go to Leaf 3*
  *   **B.** Across family lines over successive generations. → *Go to Node 5*

  ---

  ### **Node 5 (Primary Wrong)**
  **Is the primary wrong of dynastic wealth that it violates moral arbitrariness regarding circumstances of birth (a luck-egalitarian concern), or that it distorts democratic political equality by concentrating influence?**
  *   **A.** It distorts democratic political equality by concentrating influence. → *Go to Node 6*
  *   **B.** It violates moral arbitrariness regarding circumstances of birth. → *Go to Leaf 4*

  ---

  ### **Node 6 (Concrete Institutional Case)**
  **A founder liquidates a business, pays all statutory taxes, and endows a private foundation that provides exclusive internships and mentorship exclusively to the descendants and peers of her family network. Does this arrangement count as an instance of objectionable dynastic wealth?**
  *   **A.** No, provided it does not purchase direct political legislation or voting power. → *Go to Leaf 5*
  *   **B.** Yes, because it reproduces class hierarchy regardless of formal political rights. → *Go to Leaf 4*

  ---

  ### **Terminal Leaves**

  **Leaf 1: Dynastic Libertarian**
  *   **Path:** 1A
  *   **Position:** No restriction on either form of transmission is justified.
  *   **Awkward Commitment:** You must accept that a newborn heir to a billion-dollar fortune has no greater claim to social resources than a newborn into poverty, yet justice forbids redistributing that fortune to equalize their starting lines.

  **Leaf 2: Capital-only Restrictionist**
  *   **Path:** 1B → 2A → 3A
  *   **Position:** Capital-lock must be eliminated, but status-lock falls outside the scope of state remedy.
  *   **Awkward Commitment:** You must endorse taxing a cash bequest to a child while permitting parents to spend unlimited sums on elite private schooling and social grooming that yields identical economic advantages.

  **Leaf 3: Meritocratic Reset**
  *   **Path:** 1B → 2C → 4A
  *   **Position:** Inheritance is permissible only if it does not alter competitive positions in social cooperation.
  *   **Awkward Commitment:** You must accept massive absolute inequalities of wealth as just, provided the *relative* ranking of individuals in the labor market remains unchanged by the inheritance.

  **Leaf 4: Strict Abolitionist**
  *   **Path:** 1B → 2C → 4B → 5B (or 6B)
  *   **Position:** All substantial intergenerational economic transmission is unjust.
  *   **Awkward Commitment:** You must justify state interference in the transfer of sentimental family heirlooms or modest savings if they cross the threshold of "substantial" advantage, potentially dissolving the family as an economic unit.

  **Leaf 5: Democratic-Egalitarian**
  *   **Path:** 1B → 2C → 4B → 5A → 6A
  *   **Position:** Inheritance is objectionable only when it translates into disproportionate political influence.
  *   **Awkward Commitment:** You must accept a society with rigid aristocratic class stratification as just, provided the wealthy class refrains from lobbying or funding campaigns to protect their status.

  ---

  ### **Gap Analysis: Unoccupied Leaf**

  **Combination:** Node 1B (Impediment) → Node 2B (Status-lock violates, Capital-lock does not) → Node 5A (Primary Wrong is Democratic Equality).
  **Diagnosis:** **Incoherence.**
  This combination posits that social networks and educational gatekeeping (Status-lock) threaten democratic equality, while liquid assets and equity (Capital-lock) do not. This is theoretically unstable because liquid capital is the primary *means* by which status advantages are purchased and maintained in market societies. To condemn the social advantage while permitting the financial fuel that purchases it renders the democratic-egalitarian constraint ineffective. This gap likely stems from a failure to recognize the fungibility of wealth; proponents of this view usually collapse into the **Capital-only Restrictionist** (Leaf 2) or the **Strict Abolitionist** (Leaf 4) upon reflection.

  ---

  ### **Methodological Reflection**

  **Fragility Point:** The separation between **Leaf 3 (Meritocratic Reset)** and **Leaf 5 (Democratic-Egalitarian)** is the least secure point in this taxonomy.
  **Reasoning:** Both positions permit significant wealth accumulation conditional on downstream effects (competitive rank vs. political influence). In modern institutional settings, maintaining a dominant competitive rank (Meritocratic) almost invariably requires exerting disproportionate political influence (Democratic) to protect market position.
  **Condition for Reclassification:** If empirical sociological research demonstrated that **market mechanisms fully convert status-lock advantages into capital-lock advantages** (i.e., elite networks always result in liquid wealth accumulation), the distinction at **Node 2** would collapse. This would render the **Capital-only Restrictionist** (Leaf 2) position practically indistinguishable from the **Strict Abolitionist** (Leaf 4), requiring the tree to merge these branches and rely solely on the *degree* of taxation rather than the *type* of asset taxed. Conversely, if proof emerged that **democratic equality and fair opportunity necessarily diverge in all institutional settings** (e.g., a society can be politically equal but economically aristocratic), Leaf 5 would become more robust, and Leaf 4 would appear unnecessarily expansive.
