answer: |-
  # PARTICIPATORY INQUIRY BOARD: OPERATIONAL MANUAL (PIB-01)
  **Mandate:** Deweyan Experimentalism / Cooperative Social Inquiry
  **Session Duration:** 120 Minutes
  **Participants:** Chair, Staff Recorder, ~15 Residents
  **Output:** Written Record of Warranted Recommendation (for City Council)

  ---

  ## PART I: THE PROCEDURE (FLOWCHART-IN-WORDS)

  ### STAGE 1: DIAGNOSTIC GATEKEEPING (Minutes 0–15)
  **Objective:** Distinguish a *problematic situation* (shared disturbance requiring inquiry) from *conflicting preferences* (bargaining over fixed interests).

  **Chair Script:**
  > "We are not here to vote on what you want. We are here to investigate a situation that is not working for the neighborhood. If you are here only to demand a specific outcome regardless of consequences, this process cannot help you."

  **Diagnostic Questions:**
  1.  "Can anyone describe the current situation without mentioning a specific solution?" (e.g., "Cars speed" vs. "We need speed bumps.")
  2.  "Does this situation disturb the functioning of the community as a whole, or is it a private inconvenience?"

  **Sufficient Answer to Proceed:**
  *   At least three participants from different households articulate a shared *disturbance* (e.g., "Safety is uncertain," "Space is underutilized," "Conflict is escalating").
  *   Participants acknowledge uncertainty about the best path forward.

  **Stop/Deferred Result Criteria:**
  *   **STOP:** If participants refuse to articulate the problem without demanding their preferred solution immediately. (Result: *Session Adjourned. Record: "Preferences固固化 (Fixed). No Indeterminate Situation Found."*)
  *   **DEFER:** If the disturbance is clear but key stakeholders (e.g., business owners, specific agency reps) are absent. (Result: *Session Paused. Record: "Inquiry Incomplete."*)

  **Value-Laden Judgment Call:**
  *   **Chair's Discretion:** Determining whether a "private inconvenience" rises to the level of a "public problem." This is not empirical; it is a judgment about the scope of community concern.

  ---

  ### STAGE 2: PROBLEM DEFINITION VIA CONSEQUENCES (Minutes 15–45)
  **Objective:** Translate abstract rights/identities into experienced consequences. Deweyan focus: *What happens?* not *Who is right?*

  **Chair Script:**
  > "We will not discuss rights or principles. We will discuss observable consequences. If X happens, what follows? If Y happens, what follows?"

  **Procedure:**
  1.  Staff Recorder creates two columns on a whiteboard: **Current Consequences** and **Anticipated Consequences of Change**.
  2.  Participants must phrase inputs as: "When [event] occurs, [group] experiences [effect]."
  3.  Prohibited language: "Rights," "Fairness," "Principles," "Should."

  **Sufficient Answer to Proceed:**
  *   A mapped chain of at least five distinct consequences linked to the situation (e.g., "Speeding → Noise → Sleep Loss → Health Decline").
  *   Agreement on the *facts* of the current consequence chain, even if disagreement remains on their value.

  **Stop/Deferred Result Criteria:**
  *   **STOP:** If the group cannot agree on the empirical reality of current consequences (e.g., one side denies speeding occurs despite data). (Result: *Session Adjourned. Record: "Factual Dispute Requires Technical Study."*)

  **Value-Laden Judgment Call:**
  *   **Chair's Discretion:** Deciding which consequences are relevant to the city's mandate. (e.g., "Property value fluctuation" is relevant; "Aesthetic displeasure" may be excluded if not codified in ordinance).

  ---

  ### STAGE 3: HYPOTHESIS GENERATION (Minutes 45–75)
  **Objective:** Frame proposals as *hypotheses* to be tested, not *positions* to be won.

  **Chair Script:**
  > "A proposal is not a demand. It is a hypothesis: 'If we do X, the problematic situation will transform into Y.' We are looking for testable plans."

  **Procedure:**
  1.  Proposals must be written in **If-Then** format.
      *   *Bad:* "Ban parking."
      *   *Good:* "If we ban parking, then traffic flow will increase, but local commerce may decrease."
  2.  Select up to three distinct hypotheses for comparison.

  **Sufficient Answer to Proceed:**
  *   Three distinct "If-Then" scenarios are drafted.
  *   Each scenario identifies a specific *intervention* and a specific *anticipated transformation*.

  **Stop/Deferred Result Criteria:**
  *   **STOP:** If all proposals are identical or merely variations of the same idea. (Result: *Record: "No Competitive Hypotheses Generated."*)

  **Value-Laden Judgment Call:**
  *   **Chair's Discretion:** Determining if a hypothesis is *actionable* by the City Council. Radical proposals that exceed city authority must be flagged as "Outside Scope."

  ---

  ### STAGE 4: EMPIRICAL TESTING & RISK ASSESSMENT (Minutes 75–100)
  **Objective:** Distinguish between empirical evidence (data) and value weighting (judgment).

  **Chair Script:**
  > "We now test the hypotheses. What evidence do we have? Where must we use judgment?"

  **Procedure:**
  1.  **Evidence Check:** For each hypothesis, ask: "What data supports the 'Then' part of your statement?" (e.g., Traffic studies, pilot data from other cities).
  2.  **Risk Flagging:** Identify consequences that cannot be empirically proven beforehand (e.g., "Community trust will erode").
  3.  **Weighting:** Acknowledge that trading off risks (Safety vs. Privacy) is a value judgment, not a scientific fact.

  **Sufficient Answer to Proceed:**
  *   Each hypothesis is tagged with: (A) Supported by Data, (B) Speculative, or (C) Value-Dependent.
  *   The group acknowledges where they are guessing.

  **Stop/Deferred Result Criteria:**
  *   **STOP:** If a hypothesis relies entirely on speculation with high risk and no data. (Result: *Recommendation: "Pilot Program Required Before Adoption."*)

  **Value-Laden Judgment Call:**
  *   **Chair's Discretion:** **CRITICAL.** The Chair must explicitly record when the group is making a *value trade-off*. The protocol cannot resolve whether "Privacy" outweighs "Safety." The Chair records: *"Group prioritized Safety over Privacy based on [Reasoning]."* This is not a truth claim; it is a record of valuation.

  ---

  ### STAGE 5: RECONSTRUCTIVE AUDIT & RECOMMENDATION (Minutes 100–120)
  **Objective:** Ensure the resolution transforms the situation, not merely accommodates it. Include a revisability clause.

  **Chair Script:**
  > "Does this solution fix the root disturbance, or just hide it? All city actions are provisional. When do we check back?"

  **Procedure:**
  1.  **Transformation Check:** Does the recommended hypothesis resolve the consequences mapped in Stage 2?
  2.  **Revisability Clause:** Set a date and metric for review. (e.g., "Review in 12 months if accident rate does not drop by 10%.")
  3.  **Draft Record:** Staff compiles the "Warranted Recommendation."

  **Sufficient Answer to Proceed:**
  *   A written recommendation is produced containing: The Problem, The Tested Hypothesis, The Value Trade-offs Acknowledged, and The Review Date.

  **Stop/Deferred Result Criteria:**
  *   **STOP (Unwelcome Conclusion):** If inquiry reveals the problem is structural/out of scope (see Case C). (Result: *Recommendation: "Institutional Restructuring Required."*)

  **Value-Laden Judgment Call:**
  *   **Chair's Discretion:** Determining if the agreement is "warranted" enough to send to Council. If the group is deeply fractured, the Chair may submit a "Minority Report" rather than a consensus recommendation.

  ---

  ## PART II: CASE APPLICATIONS

  ### CASE A: Parking Lot vs. Community Garden
  *   **Stage 1 (Diagnostic):** Residents cite property values (anti-garden) and food security (pro-garden).
      *   *Chair Intervention:* "Property value is a consequence. Food security is a consequence. The shared disturbance is 'Underutilized Land causing Neighborhood Tension.' Proceed."
  *   **Stage 2 (Consequences):**
      *   *Lot:* Maintenance costs, runoff, occasional parking overflow.
      *   *Garden:* Potential noise, pests, increased foot traffic, community cohesion.
  *   **Stage 3 (Hypotheses):**
      *   H1: Convert to Garden → Increases cohesion, risks noise complaints.
      *   H2: Repave Lot → Maintains status quo, risks continued blight perception.
      *   H3: Hybrid (Seasonal Market) → Tests usage without permanent commitment.
  *   **Stage 4 (Testing):** Data on pest control from other gardens (Empirical). Weighting of "Aesthetic Change" vs. "Food Access" (Value Judgment).
  *   **Stage 5 (Audit):** Recommendation: **H3 (Hybrid Pilot).**
      *   *Revisability:* "Review in 6 months. If noise complaints > 5, revert to H2."
      *   *Transformation:* Moves from "Static Conflict" to "Active Testing."

  ### CASE B: Speed Cameras vs. Trust
  *   **Stage 1 (Diagnostic):** Shared disturbance is "Unsafe Street." Disagreement is on method.
  *   **Stage 2 (Consequences):**
      *   *Cameras:* Reduced speed (Data), Perceived Surveillance (Experience).
      *   *No Cameras:* Continued accident risk, Perceived Freedom.
  *   **Stage 3 (Hypotheses):**
      *   H1: Install Cameras → Reduces accidents, risks community trust.
      *   H2: Physical Calming (Cobbles) → Reduces speed, no data storage, higher cost.
  *   **Stage 4 (Testing):**
      *   *Empirical:* Accident stats from similar streets.
      *   *Judgment Call:* **CRITICAL.** The Chair records: "Group acknowledges cameras reduce accidents by X% but accepts Y% risk to trust. This is a value preference, not a fact."
  *   **Stage 5 (Audit):** Recommendation: **H1 with Transparency Protocol.**
      *   *Revisability:* "Data access policy reviewed annually. Camera efficacy reviewed quarterly."
      *   *Transformation:* Acknowledges the trade-off explicitly rather than hiding it behind "Safety First" rhetoric.

  ### CASE C: Noise Complaints & Gentrification (The Unwelcome Conclusion)
  *   **Stage 1 (Diagnostic):** Complaint: "Workshop is too loud." Counter: "Workshop provides affordable jobs."
  *   **Stage 2 (Consequences):**
      *   Inquiry reveals noise is within legal limits.
      *   Real disturbance: New residents expect "quiet residential"; Old residents expect "mixed-use industrial."
      *   Root Cause: Zoning changes and displacement pressures (Gentrification).
  *   **Stage 3 (Hypotheses):**
      *   H1: Enforce Noise Ordinance → Risks closing workshop (displacement).
      *   H2: Ignore Complaints → Risks alienating new residents.
      *   H3: **Structural Inquiry.** Acknowledge local board cannot solve zoning/demographic shifts.
  *   **Stage 4 (Testing):** Evidence shows noise is legal. Value judgment reveals conflict is about *who belongs in the neighborhood*, not decibels.
  *   **Stage 5 (Audit):** **PROCEDURE STOPS.**
      *   *Recommendation:* "No Site-Specific Remedy Warranted."
      *   *Action:* Refer to City Planning Commission for "Zoning Compatibility Review."
      *   *Record:* "Local inquiry reveals indeterminate situation is structural, not local. Local intervention would be cosmetic accommodation, not reconstruction."

  ---

  ## PART III: LIMITATIONS & DOCUMENTATION PROTOCOL

  ### What This Procedure Cannot Do
  1.  **Resolve Structural Inequality:** As seen in Case C, if the "problem" is systemic (gentrification, racism, economic disparity), this board cannot fix it. It can only *diagnose* the mismatch between local authority and the scale of the problem.
  2.  **Override Legal Rights:** This is an inquiry process, not a court. It cannot adjudicate due process or constitutional rights. If a proposal requires violating rights, the procedure must halt at Stage 3.
  3.  **Deliver Absolute Truth:** The output is a *Warranted Assertibility*, not a Truth. It is valid only insofar as the consequences match the hypothesis. If reality diverges, the recommendation is void.
  4.  **Guarantee Consensus:** The goal is a *working agreement* based on shared inquiry, not unanimity. If factions remain entrenched after Stage 4, the Chair must submit a "Split Recommendation" to the Council.

  ### Systematic Misfire Risks
  *   **Bad Faith Actors:** If participants treat the session as a veto point rather than an inquiry, Stage 1 must be enforced rigorously. If the Chair fails to adjourn, the process becomes a cover for obstruction.
  *   **Technical Complexity:** If the dispute requires engineering or legal expertise beyond the room (e.g., sewage load bearing), the Board must defer to technical staff. Do not pretend lay inquiry replaces expert analysis.
  *   **Emergency Situations:** This process is too slow for immediate safety hazards (e.g., a collapsed bridge). Use emergency protocols instead.

  ### Documentation Protocol for City Council
  The Written Record must include four specific sections to ensure the Council understands the *nature* of the recommendation:

  1.  **The Indeterminate Situation:** A description of the disturbance *before* solutions were proposed.
  2.  **The Inquiry Path:** A summary of hypotheses rejected and why (e.g., "Rejected due to lack of empirical warrant").
  3.  **The Value Judgment Log:** Explicit statement of trade-offs made (e.g., "Privacy was deprioritized in favor of Safety"). *This prevents the Council from treating the recommendation as purely technical.*
  4.  **The Revisability Clause:** The specific metric and date for re-evaluation. *This prevents the Council from treating the recommendation as permanent law.*

  **Chair's Certification:**
  > "I certify that this recommendation is the product of cooperative inquiry regarding the consequences of action, not a aggregation of pre-existing preferences. It is warranted by the evidence presented but remains fallible and subject to the revisability clause attached."
