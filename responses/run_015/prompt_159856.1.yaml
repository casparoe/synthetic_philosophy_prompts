answer: |-
  Based on Miriam's track record, three operational rules emerge that govern her grading more strictly than Dennett's original definitions:

  1.  **The Locus of Selection:** Darwinian selectors operate across generations (genes/weights); Skinnerian and Popperian selectors operate within a lifetime (experience/model); Gregorian selectors operate via external scaffolding (tools/culture).
  2.  **The Transmission Test:** If acquired design improvements are shared between individuals within a lifetime, the grade is Gregorian (the Crow precedent).
  3.  **The Scaffolding Clause:** If the cognitive loop requires an external artefact to complete the thought (paper, symbols, calculator), the grade is Gregorian, regardless of the organism's internal plasticity (the Long Division precedent).

  **Verdicts and Rationale**

  **Orion-7: Gregorian.**
  *   **Rationale:** Although its weights are frozen (which tempts the Darwinian label), it offloads verification and memory to a scratchpad and calculator, meaning part of the cognizing is done by the artefacts.
  *   **Precedent Leaned On:** The adult human doing long division on paper. Miriam explicitly graded this Gregorian because the paper did part of the work. Orion-7's scratchpad is digital paper.
  *   **Precedent Clashed With:** The bacterial population. The Reader argues that frozen weights make Orion-7 Darwinian, like bacteria. To stay consistent, Miriam must rule that *run-time reliance on cultural tools* overrides *design-time fixation*.
  *   **Why:** Miriam's "Feral Human" case establishes that equipment matters more than species. A human with tools is Gregorian; a human without is Popperian. Orion-7 has tools.

  **Warehouse Fleet: Gregorian.**
  *   **Rationale:** They transmit acquired internal models to new units, allowing design improvements to spread within a lifetime without genetic replication.
  *   **Precedent Leaned On:** The crow population passing along tool shapes. This is the definition of cumulative culture in her system.
  *   **Precedent Clashed With:** None. This is the cleanest fit in her history.
  *   **Why:** The "shipping what they have learned" clause triggers the Transmission Test immediately.

  **Divergence and Consistency**

  Your editor is right on the verdict (both Gregorian) but wrong on the reason ("borrow human-made tools" is too vague). The Reader is right on the mechanism (frozen weights) but wrong on the implication (Darwinian). Miriam must prioritize the **Scaffolding Clause** for Orion-7 and the **Transmission Test** for the Fleet. If she accepts the Reader's Darwinian verdict for Orion-7, she implicitly demotes the "Long Division" human to Darwinian (since the human's neural weights are also largely fixed during the calculation), which collapses the distinction between using a mind and using a tool.

  **The Crucial Test Case**

  To separate the "Fixed Weights" argument from the "Internal Model" argument, you need a case that simulates outcomes but uses no tools and learns nothing.
  *   **Case:** A dedicated chess computer that calculates ten moves ahead to reject bad lines but is hard-wired (no learning, no internet, no external storage).
  *   **Separation:** If Miriam grades this **Popperian**, she admits internal simulation trumps fixed design. If she grades it **Darwinian**, she admits that without plasticity or tools, simulation is just complex instinct. Given the "Feral Human" verdict, she should say **Popperian**, which forces her to admit Orion-7 is Gregorian *only* because of the calculator, not the simulation.

  **The Hard Truth**

  Consistency likely requires a second axis or a fifth grade. You currently have a "Design History" axis (Darwinian vs. Skinnerian/Popperian) and a "Scaffolding" axis (Internal vs. Gregorian). Orion-7 is a hybrid: Darwinian design history with Gregorian scaffolding.
  *   **The Cost:** If you refuse a fifth grade, you must accept that "Gregorian" is becoming a catch-all for "Artefact-Dependent," obscuring whether the intelligence is in the head or the tool. If you add a grade (e.g., "Vicarian" for fixed systems using internal models), you break the column's four-word constraint.
  *   **Recommendation:** Stay with four grades but add a parenthetical qualifier for artefacts. Grade Orion-7 **Gregorian (frozen)**. This preserves the single-word rule while acknowledging the Reader's valid objection that the system itself isn't learning, only the user is. Miriam's column survives, but the ladder gains a rung that doesn't climb.
