answer: |-
  1. **Where are you overreaching?**
  The sentence that will get your piece rejected immediately is: *"almost every political fight about 'how much should we demand here' is really a fight about the third one while everyone thinks it's about the first."*

  This is a classic "hidden true motive" argument, and it's arrogant. You are telling every participant in every culture war that they are mistaken about their own motivations. When people fight about mask mandates, prayer in schools, or drag story hour, they are genuinely fighting about **Breadth** (should this domain be regulated at all?), not just **Legibility** (how do we know the rules?). By insisting the real fight is about legibility, you invalidate the actual stakes of the conflict. A reviewer will see this as a clever trick to dismiss opposing viewpoints rather than engage with them. You're claiming a psychological superiority over the subjects of your analysis that you haven't earned. Cut the claim that everyone is wrong about what they're fighting for. Stick to the claim that legibility is an *underappreciated* factor, not the *secret true* factor.

  2. **Is the three-way split doing work?**
  It is dangerously close to collapsing, specifically because **Legibility** looks like a derivative of **Breadth**.

  If I have a culture with high Breadth (norms about everything), Legibility inevitably drops because no human can memorize infinite rules. If I have a culture with low Breadth, Legibility naturally rises. You treat them as independent dials, but they are mechanically linked. You can try to save this by arguing that you can have high Breadth and high Legibility (everything is regulated, but it's all written down clearly), but that describes a totalitarian bureaucracy, not a standard "tight" culture.

  The split only works if you can show a case where Breadth is low but Legibility is also low (few rules, but you can't know what they are), or Breadth is high but Legibility is high (many rules, all clear). The former is a trap; the latter is a compliance manual. If you can't point to a society that sits in those quadrants, you don't have three variables; you have one variable (tightness) and one measurement error (legibility). You need to prove Legibility varies independently before you build a theory on it.

  3. **Is the "substitutes" claim defensible?**
  No. The claim that *"codification and informal enforcement are substitutes"* is contradicted by the last decade of social history.

  Look at corporate HR or university campuses. We have seen an explosion of codified rules (policies, handbooks, compliance training) *alongside* an explosion of informal enforcement (social shaming, cancel culture, reputation damage). They are not trading off; they are stacking. They are complements. The written rule gives the informal mob the ammunition to sanction you, and the informal pressure ensures the written rule is enforced even when inspectors aren't looking.

  Your argument relies on the assumption that there is a fixed "demand for order" that must be satisfied either by neighbors or by the state. But demand for order isn't fixed. It can inflate. When both mechanisms activate at once, you don't get the tradeoff you describe; you get a suffocating environment that is both rule-dense and socially punitive. If you can't explain why modern "loose" societies seem to be generating *more* informal pressure, not less, the substitutes theory breaks.

  4. **Rate-of-change vs. Threat hypothesis.**
  The threat hypothesis is right; your rate-of-change hypothesis is wrong, and you already know it.

  You admit: *"people get more rule-demanding exactly when things are moving quickly, which on my story is backwards."* This is a fatal concession. You are trying to make a normative claim (fast change *should* require looseness for discovery) pass as a descriptive one (fast change *leads* to looseness). History shows the opposite. When environments change fast, people panic and cling to inherited scripts because the cognitive load of constant discovery is too high.

  If you keep this section, you must strip the empirical pretense. Don't say "looseness should track rate of change." Say "looseness *ought* to track rate of change, but human psychology rebels against this." But be warned: if you admit your empirical prediction fails, the "discovery vs. inheritance" framing looks like wishful thinking rather than analysis. It weakens the whole piece to build a normative argument on a descriptive failure.

  5. **Practical bite or redescription?**
  Currently, this is redescription. The conclusion—that we should have a "narrow waist" (strict on violence/procedure, loose on lifestyle)—is basically John Stuart Mill's *harm principle* dressed up in engineering terminology.

  Unless you can explain *how* a society shifts its enforcement budget from one domain to another, this is just advice to be sensible. Everyone agrees violence should be banned and dress codes shouldn't matter. The fight is always about which category a specific issue falls into. Is smoking a health issue (narrow waist) or a lifestyle choice (wide ends)? Your framework doesn't help me decide that. It just tells me I should have decided it.

  To get practical bite, you need to explain how to increase Legibility without increasing Breadth. How do we make the rules clear without making more rules? If you can't answer that, you've just given us a new vocabulary to complain about the same old problems.

  **Verdict: Two essays wearing one coat.**
  The first half (Breadth/Severity/Legibility + Substitutes) is a sociological claim about how norms function. The second half (Discovery vs. Inheritance + Fixed Budget) is a political philosophy claim about how we *should* organize society. They don't talk to each other. The sociological mechanism (substitution) doesn't lead inevitably to the normative conclusion (exploration).

  You should cut the "Discovery vs. Inheritance" section entirely. It's the weakest part, it contradicts the empirical record you cite yourself, and it dilutes the sharper insight about Legibility. Stick to the argument that modern societies are becoming illegibly tight rather than loosely free. That's a genuine insight. The rest is padding.
