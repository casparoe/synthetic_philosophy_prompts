      *   *The Murderer Case:* You cannot say "He is not here" if he is. You *can* remain silent, change the subject, or speak ambiguously (mental reservation).
      *   *Rationale:* Lying violates the nature of speech (ordained for truth), damages the soul, violates duty to God/truth itself. Consequences (death) do not justify intrinsic evil.
      *   *Distinction:* Concealment is not lying. Speech acts require specific commitments.
      *   *Foundation:* Augustine is theological, but Kant (secular deontologist) has a similar strict view (On a Supposed Right to Lie from Philanthropy).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: The Line Between Lying and Misleading.*
          *   *Draft 1:* Is withholding truth a lie?
          *   *Critique:* Too simple. Needs to probe the *mechanics*.
          *   *Refinement:* Focus on the "mental reservation" or ambiguous speech. If I say "I don't know where he is" meaning "I won't tell you," is that a lie?
          *   *Follow-up:* If he says it depends on the listener's right to know, ask about how that right is established.

      *   *Topic 2: The Cost (Murderer at the Door).*
          *   *Draft 1:* Isn't it worse to let someone die?
          *   *Critique:* Standard objection. Need to push on the *agent's responsibility*.
          *   *Refinement:* Focus on complicity. If I tell the truth, am I an accomplice?
          *   *Follow-up:* If he says "The murderer owns the sin, not you," ask about the causal link.

      *   *Topic 3: Theological vs. Secular.*
          *   *Draft 1:* Do you need God for this?
          *   *Critique:* A bit blunt.
          *   *Refinement:* Can a Kantian hold this? Is the "nature of speech" secular enough?
          *   *Follow-up:* If he says "Yes, secular deontology works," ask about the grounding of human dignity without teleology.

      *   *Topic 4: Literary/Narrative Angle (Since the interviewer is a novelist).*
          *   *Idea:* How does this view affect character development?
          *   *Refinement:* In fiction, liars are often complex. Does this view flatten moral complexity?
          *   *Follow-up:* If he says "Truth makes for better drama," ask about tragic dilemmas.

      *   *Topic 5: The Nature of Speech/Communication.*
          *   *Idea:* What is language for?
          *   *Refinement:* If language is for truth, is poetry lying? (Augustine worried about this).
          *   *Follow-up:* If he distinguishes fiction from lying, ask about the contract with the reader.

      *   *Topic 6: Psychological Burden.*
          *   *Idea:* Is it hard to live this way?
          *   *Refinement:* Does this create moral purity at the cost of moral cleanliness (getting your hands dirty)?
          *   *Follow-up:* If he says "Purity matters most," ask about the virtue of mercy.

      *   *Topic 7: Social Trust.*
          *   *Idea:* Does lying destroy society?
          *   *Refinement:* If everyone knew you never lied, would you be dangerous to be around?
          *   *Follow-up:* If he says "Trust is good," ask about diplomatic niceties.

      *   *Topic 8: The Definition of a Lie.*
          *   *Idea:* What about jokes?
          *   *Refinement:* How do context and expectation define the "assertion"?
          *   *Follow-up:* If he relies on intent, ask about self-deception.

      *   *Selection & Polishing:* I need to select the best 6-8 that flow well and hit the mandatory requirements.

      *   *Selection:*
