answer: |-
  Here is the plan. I've treated this as a design problem: the goal isn't just to discuss the heterogeneity problem, but to make the students *feel* the theoretical pressure that generates the Continuation View.

  ### Part 1: Activity Brainstorm & Selection

  **Option 1: The "Phenomenology Diary" Reconstruction.**
  Students bring logs of three pleasures from their week. In class, they try to group them by shared felt qualities. When they fail, they switch to behavioral markers.
  *   **Reject:** Too logistically fragile for "run tomorrow." If students don't prep deeply, the data is useless. It also privileges idiosyncratic personal experience over the conceptual structure we need to isolate.

  **Option 2: The "Neural Correlate" Simulation.**
  Students act as scientists trying to identify a "pleasure chemical." They test scenarios to see if the chemical spikes. If it spikes for itching and symphonies but also doom-scrolling, they question the unity of the state.
  *   **Reject:** This drifts into philosophy of mind/metaphysics. We need them to focus on the *normative/practical* profile (what you should do with the state), not the ontological status of the state. It misses the "continuation" angle.

  **Option 3: The "Rigged Deck & Forced Merge" (Selected).**
  Using a curated deck of scenario cards, students attempt to order them by "pleasantness," fail to merge their scales, then re-order by "continuation metrics" under vocabulary constraints.
  *   **Commit:** This is the strongest. It physically enforces the shift from phenomenological description to practical profile. It creates the specific friction points (terminal cases, compulsive cases) needed to build the Continuation View without lecturing.

  ---

  ### Part 2: The Session Plan

  **Session Title:** The Structure of Pleasure
  **Time:** 75 Minutes
  **Students:** 14 (Split into 4 groups of 3-4, then merge into 2 groups of 7)
  **Materials:** 4 identical decks of 16 cards (printed on cardstock), whiteboard, markers.

  #### The Deck (16 Cards Total)
  You need 4 decks. Each deck must have these exact 16 scenarios. The wording is crucial to prevent semantic wiggle room.

  *   **Type A: Intense/Trivial/Short (4 cards)**
      1.  Scratching a mosquito bite that really itches.
      2.  The first sip of ice water after a hard run.
      3.  The moment a tight shoe is taken off.
      4.  The relief when a headache suddenly vanishes.
  *   **Type B: Quiet/Absorbing/Long (4 cards)**
      5.  A conversation where you lose track of time.
      6.  Reading a book with the radiator ticking in the background.
      7.  Walking a familiar path in good weather.
      8.  Cooking a meal for friends while listening to music.
  *   **Type C: Compulsive/Unpleasant (4 cards)**
      9.  Doom-scrolling social media at 1am when you know you should sleep.
      10. Picking at a scab even though it hurts slightly.
      11. Humming a song you hate that you can't get out of your head.
      12. Arguing with a stranger online even though it's making you angry.
  *   **Type D: Terminal/Over (4 cards)**
      13. The punchline of a great joke (the laugh itself).
      14. The moment the dentist says "You're all done."
      15. A sneeze.
      16. Crossing the finish line of a race (the exact moment you stop running).

  **Why this mix?**
  *   If you leave out **Type C**, they won't see the gap between "pleasant" and "wanted."
  *   If you leave out **Type D**, they won't see the limit of the Continuation View (you can't continue a sneeze).
  *   If you leave out **Type A**, they will conflate intensity with value.

  ---

  #### The Timeline & Mechanic

  **00:00 – 00:05 | Setup (No Philosophy Yet)**
  *   **Action:** Divide into 4 groups. Hand out Deck 1 to each group.
  *   **Instruction:** "You have 16 scenarios. Your task is to arrange them in a single vertical line on the table. Top = 'Most Pleasant.' Bottom = 'Least Pleasant.' You must agree on the order. No ties."
  *   **Constraint:** "You can talk about how they feel. Go."

  **00:05 – 00:25 | Round 1: The Phenomenological Trap**
  *   **Action:** Groups order the cards. (10 mins).
  *   **The Merge:** Group 1 merges with Group 2. Group 3 merges with Group 4. (10 mins).
  *   **Instruction:** "You now have 7 people and two different orderings. You must produce **one** shared ordering. You have to defend your placement to the other half of your group."
  *   **The Failure Point:** Watch for the argument over Type C (Doom-scrolling) and Type D (Sneeze). One half will say "Scrolling isn't pleasant," the other says "But you keep doing it." One half will say "A sneeze is relief," the other says "It's over instantly."
  *   **Instructor Role:** Circulate. Do not answer questions. If they ask "Is scrolling pleasant?", say "You have to decide that for the scale."

  **00:25 – 00:45 | Round 2: The Practical Profile**
  *   **Action:** Keep the merged groups (2 groups of 7). Collect the old orderings. Hand out fresh Decks (or have them reshuffle).
  *   **Instruction:** "We are restarting. You are ordering the same 16 cards. Top = 'Highest Priority to Continue.' Bottom = 'Lowest Priority to Continue.'"
  *   **The Ban List (Write on Board):** You are **BANNED** from using these words: *Feel, Good, Nice, Enjoy, Pleasant, Painful, Sensation, Emotion.*
  *   **Allowed Vocabulary:** *Stay, Stop, Lose, Trade, Minute, Reason, Default.*
  *   **Prompt:** "Ask: If I were in this state, how hard would it be to stop? Would I pay for 5 more minutes? Does stopping feel like a loss?"
  *   **Outcome:** Type C (Compulsive) will shoot up the scale. Type D (Terminal) will crash to the bottom (cannot continue). Type A and B will likely reorder based on duration/sustainability.
  *   **Instructor Role:** Enforce the Ban List strictly. If someone says "It feels good," stop them. "Rephrase in terms of stopping or staying."

  **00:45 – 01:15 | The Debrief (The Construction)**
  *   **Action:** Bring the room together. Two scales on the board (Round 1 vs. Round 2).
  *   **Goal:** Map their activity to the Heterogeneity Problem and the Continuation View.

  **Debrief Script & Expected Answers:**

  1.  **The Merge Collapse (Heterogeneity):**
      *   *Q:* "In Round 1, where did the two groups fail to merge? Which cards caused the fight?"
      *   *Expected:* "The sneeze," "Doom-scrolling."
      *   *Philosophical Point:* "You couldn't merge because you were pointing at different *features*. One group pointed at intensity (Type A), one at meaning (Type B). This is the Heterogeneity Problem: there is no single 'felt quality' all pleasures share."

  2.  **The Shift (Continuation View):**
      *   *Q:* "In Round 2, why was it easier to agree? What were you actually measuring?"
      *   *Expected:* "How hard it was to stop," "Whether we wanted more."
      *   *Philosophical Point:* "You stopped looking at how it *felt* and started looking at what you *did* with it. You constructed a view where pleasure is a state where 'continuing' is the default. Stopping requires a reason."

  3.  **The Compulsion Cards (Overgeneration):**
      *   *Q:* "Look at Type C (Doom-scrolling/Scab). Where did they land in Round 1 vs. Round 2?"
      *   *Expected:* "Round 1: Bottom. Round 2: Top/Middle."
      *   *Philosophical Point:* "This is the Overgeneration Objection. Your Round 2 scale says scrolling is 'pleasant' because you keep doing it. But your intuition says it isn't. Does the Continuation View let in too much?"

  4.  **The Terminal Cards (The Weakness):**
      *   *Q:* "Look at Type D (Sneeze/Punchline). Where did they land in Round 2?"
      *   *Expected:* "Bottom. Because you can't continue them."
      *   *Philosophical Point:* "This is the view's weakest point. A sneeze is often cited as a pleasure (relief), but it has no 'continuation profile.' If pleasure is about continuing, how do we account for terminal pleasures? This is where the view might need patching."

  ---

  #### Limitations & Distortions (Honesty Check)

  *   **What they take on your word:** They will see that "Continuation" works better than "Feeling" for ordering, but they won't see *why* continuation is normative. You have to tell them that "intelligibility of continuing" is what makes it a *good* state, not just a *persistent* one.
  *   **Potential Distortion:** This activity risks conflating "Pleasure" with "Desire." Round 2 essentially measures strength of desire. You will need to clarify in the debrief that the Continuation View argues desire tracks pleasure *because* pleasure is the state where continuing is intelligible, not that pleasure *is* desire.
  *   **The "Terminal" Problem:** The activity makes Terminal cases look like failures of the view. In reality, a sophisticated Continuation View might handle them as "completion of a process." Don't let them think the view is dead because of sneezes; frame it as a "boundary case."

  ---

  #### Failure Modes & Mitigation

  **1. The "It's All Preference" Relativist**
  *   *Symptom:* A student says, "Well, I like scrolling, so it's pleasant for me. You don't, so it's not. There's no fact of the matter."
  *   *Fix:* "We aren't mapping your personal taste. We are mapping the *concept*. If I say 'I am pleased' but I desperately want it to stop immediately, have I used the word correctly? We are testing the grammar of the concept, not your biography."

  **2. The Gamer**
  *   *Symptom:* A student realizes Round 2 is about duration and tries to rank everything by "longest lasting" regardless of the prompt.
  *   *Fix:* Intervene. "Duration is a factor, but not the only one. A 5-hour root canal is long but low priority to continue. Re-evaluate Card X based on 'intelligibility of staying,' not just clock time."

  **3. The Room Split**
  *   *Symptom:* During the Merge (Round 1), the two sub-groups refuse to budge and run out of time.
  *   *Fix:* Hard stop at 00:25. "Freeze. Leave the disagreement where it is. That disagreement is the data for the debrief. Move to Round 2." (The failure is part of the lesson).

  **4. Timing Blowout**
  *   *Symptom:* Round 1 takes too long.
  *   *Fix:* Cut the Round 2 debrief discussion on Type A/B. Focus entirely on Type C (Compulsion) and Type D (Terminal). Those are the philosophical heavy hitters. Sacrifice the nuance of "quiet pleasures" to save the "heterogeneity" point.

  ---

  #### Instructor Prep Checklist (For Tomorrow)
  1.  **Print 4 decks** of the 16 cards. (Laminate if possible, or just thick paper).
  2.  **Whiteboard:** Divide into two columns: "Round 1 (Pleasantness)" and "Round 2 (Continuation)."
  3.  **Ban List:** Have the banned vocabulary written on the board before they walk in.
  4.  **Timer:** Set visible timers for each round. The pressure helps force the "failure" in Round 1.

  This plan forces them to live the problem. They will leave the room knowing *why* the heterogeneity problem hurts, and *why* someone might propose the Continuation View as a solution, because they built the scaffold themselves.
