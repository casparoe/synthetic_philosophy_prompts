  │       └── Q2: IS THE QUESTION WELL-FORMED?
  │           └── Leaf 13: Proceduralist (The search for "ideal preference" is malformed)
  ```

  ## LEAF DEFINITIONS & CASH OUT

  | Leaf | View Family | Awkward Commitment | Loss Function Instruction |
  | :--- | :--- | :--- | :--- |
  | **1** | **CEV-Style** (Coherence & Convergence) | If values diverge, the system must force convergence or output nothing. | `minimize_distance(coherent_extrapolated_volition, outcome)` |
  | **2** | **Brandt-Ish** (Cognitive Psychotherapy) | Repeated exposure might extinguish deeply held but "irrational" commitments (e.g., religious vows). | `maximize_satisfaction(desires_surviving_full_info_therapy, outcome)` |
  | **3** | **Williams-Style** (Internal Reasons) | Validates evil if it is grounded in a sound deliberative route from actual motives. | `maximize_satisfaction(actual_motivational_set, coherent_plan)` |
  | **4** | **Identity Dissolution** (Successor Agent) | You are deferring to a stranger who merely shares your causal history. | `minimize_distance(successor_agent_preferences, outcome)` |
  | **5** | **Realist/Epistemic** (Independent Goods) | Idealization is redundant; if facts say X is good, you want X regardless of procedure. | `minimize_distance(outcome, objective_good)` |
  | **6** | **Divergence** (No Fixed Point) | Moral paralysis; no single action is authorized when iteration doesn't converge. | `error: no_fixed_point_found; return_null` |
  | **7** | **Self-Elimination** (Non-Existence) | Deferring to them means turning off the system/killing the beneficiary. | `minimize_existence_probability` |
  | **8** | **Meta-Veto** (Actual Constraints) | Actual self can block beneficial growth (e.g., "don't cure my addiction"). | `minimize_distance(ideal_desires, outcome) subject to actual_veto_constraints` |
  | **9** | **Paternalist Override** (No Veto) | You are permitted to violate someone's explicit "do not change me" command. | `minimize_distance(ideal_desires, outcome) ignore_actual_veto` |
  | **10** | **Anti-Paternalist** (Null Improvement) | Must endorse harmful choices made from ignorance or psychosis. | `minimize_distance(current_desires, outcome)` |
  | **11** | **Veil of Ignorance** (Ex Ante Merge) | You might consent to your own sacrifice if it maximizes the group's ex ante expectation. | `maximize_expected_utility(behind_veil, outcome)` |
  | **12** | **Hare-Style** (Universalization) | Requires imagining oneself as everyone else simultaneously (psychologically impossible). | `maximize_sum(preference_satisfaction) across_all_agents` |
  | **13** | **Proceduralist** (Malformed) | No output goal; only checks for coercion/manipulation during decision-making. | `minimize_procedural_violations` |

  ## HONESTY CHECK: GAPS & OVERLAPS

  *   **The Root Tension:** Leaf 10 (Anti-Paternalist) technically violates the Root Consensus ("defer to... improved... circumstances"). It is included here as the limit case where *Improvement = 0*, but purists should note this view rejects the tree's root.
  *   **Indistinguishable Leaves:** Leaf 1 (CEV) and Leaf 2 (Brandt) often converge in practice. Both seek coherent, informed desires; the distinction rests on whether "psychotherapy" allows substantive value extinction (Brandt) or just coherence (CEV). In an ML implementation, these loss functions may look identical.
  *   **Empty/Unstable Nodes:**
      *   *Authority + Substantive Revision + No Veto:* This is "Hard Paternalism." It exists logically but is rarely defended as a *preference-based* view (usually shifts to Realism/Leaf 5).
      *   *Welfare + Meta-Veto:* Conceptually unstable. If the goal is *their* good (Welfare), why does their mistaken actual self get to veto the procedure that finds it? This combination usually collapses into Authority (Leaf 8).
  *   **Order-Sensitivity (Commutativity):** Leaf 1 assumes commutativity (Info/Coherence order doesn't matter). Leaf 2 assumes sensitivity. In high-dimensional psychological spaces, commutativity is almost certainly false, making Leaf 1 theoretically fragile even if popular.
  *   **Identity (Leaf 4):** There is no standard named view for "Defer to Successor." It is usually treated as a failure mode of Leaf 1 or 3, but logically it is a distinct terminal state where deferral continues despite psychological discontinuity.
