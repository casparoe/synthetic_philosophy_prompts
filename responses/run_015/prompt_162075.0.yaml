  # TAXONOMY OF IDEALIZED PREFERENCES
  **Root Consensus:** *What we should defer to isn't a person's occurrent desire but that desire under some improvement of the circumstances.*

  ```text
  ROOT: The Object of Deference is the Preference under Improved Conditions
  │
  ├── Q1: WHAT IS THE NORMATIVE ROLE?
  │   │
  │   ├── BRANCH A: WELFARE (What is Good For the Person)
  │   │   │
  │   │   ├── Q2: WHAT COUNTS AS 'IMPROVEMENT'?
  │   │   │   ├── Path A1: Substantive Value Revision (Therapy/Correction)
  │   │   │   │   │
  │   │   │   │   ├── Q3: DOES THE PROCEDURE COMMUTE? (Info-then-Coherence vs. Coherence-then-Info)
  │   │   │   │   │   ├── Leaf 1: Order-Insensitive (Convergence assumed)
  │   │   │   │   │   └── Leaf 2: Order-Sensitive (Path determines outcome)
  │   │   │   │   │
  │   │   │   │   └── Q3: DOES IDENTITY PERSIST? (Is the endpoint still "you"?)
  │   │   │   │       ├── Leaf 3: Yes (Continuous Self)
  │   │   │   │       └── Leaf 4: No (Successor Agent)
  │   │   │   │
  │   │   │   └── Path A2: Epistemic Access (Finding Independent Goods)
  │   │   │       └── Leaf 5: Realist (Idealization is a flashlight, not a constructor)
  │   │   │
  │   │   └── Q2: WHAT IF THE PROCEDURE FAILS?
  │   │       ├── Path A3: No Fixed Point (Divergence)
  │   │       │   └── Leaf 6: Fragmentation (Output is null or distributed)
  │   │       │
  │   │       └── Path A4: Terminal Preference (Idealized self wants X)
  │   │           └── Leaf 7: Self-Elimination (Idealized self wants non-existence)
  │   │
  │   └── BRANCH B: AUTHORITY (What We Are Permitted to Do)
  │       │
  │       ├── Q2: WHOSE CONDITIONS ARE IDEALIZED?
  │       │   ├── Path B1: Individual (Agent-Specific)
  │       │   │   │
  │       │   │   ├── Q3: DO ACTUAL META-PREFERENCES VETO? (Can actual self stop extrapolation?)
  │       │   │   │   ├── Leaf 8: Yes (Actual constraints bind idealization)
  │       │   │   │   └── Leaf 9: No (Idealized self overrides actual veto)
  │       │   │   │
  │       │   │   └── Q3: HOW MUCH IMPROVEMENT?
  │       │   │       └── Leaf 10: Null (Actual desires = Improved desires; Anti-Paternalist)
  │       │   │
  │       │   └── Path B2: Universal (Impartial/Group)
  │       │       ├── Leaf 11: Aggregation First (Merge then Extrapolate; Veil of Ignorance)
  │       │       └── Leaf 12: Extrapolation First (Extrapolate then Merge; Hare-style)
