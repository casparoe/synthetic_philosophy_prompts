answer: |-
  # The Historical Novelist's Decision Tree

  ## Part I: The Eight Branch Questions
  *Answer each question as it applies to your own practice. Do not theorise; choose the option that matches your instinct.*

  **1. The Claimant**
  The great-granddaughter objects to the invented foundling ward; the great-grandson delights in it. Whose voice breaks the tie?
  *   A) The objector (protection).
  *   B) The enthusiast (liberation).
  *   C) Neither (the dead woman's archive holds the veto).
  *   D) Neither (the living community holds the veto).
  *   E) No one (the author decides).

  **2. The Obligation**
  The vicar's obituary is wrong about two dates. Is the primary sin getting the dates wrong, damaging her reputation, or profiting from her tragedy?
  *   A) Getting the dates wrong (factual fidelity).
  *   B) Damaging her reputation (representational fidelity).
  *   C) Profiting from her tragedy (ethical use).
  *   D) None of these (no sin committed).

  **3. The Waiver**
  She burned replies to letters and lived under two names. Does this secrecy invite speculation or forbid it?
  *   A) Forbids it (privacy must be respected).
  *   B) Invites it (silence demands a voice).
  *   C) Irrelevant (her actions hold no moral weight now).

  **4. The Granularity**
  Is inventing a spoken sentence morally equivalent to inventing a childhood history?
  *   A) Yes (all invention is equally false).
  *   B) No (words are lighter than history).
  *   C) No (thoughts are heavier than actions).
  *   D) No (consequences are the only measure).

  **5. The Pattern**
  The foundling ward is invented, but fits the implied shape of her life. Is the lie redeemed?
  *   A) Yes (structural truth validates detail).
  *   B) No (a lie is a lie).
  *   C) Only if documented elsewhere (probability is not proof).

  **6. The Interiority**
  Is it a violation to give her a vocabulary of 'trauma' she could not have possessed in 1893?
  *   A) Yes (psychological anachronism is false).
  *   B) No (emotional truth transcends time).
  *   C) Only if it alters her actions (internal language is free).

  **7. The Arrangement**
  If every fact in a scene is documented, may you rearrange their chronology to create drama?
  *   A) Yes (the bricks are real, the wall is yours).
  *   B) No (context is part of the fact).
  *   C) Only if flagged to the reader (transparency cures the sin).

  **8. The Exculpation**
  Is inventing a thought that clears her name worse than inventing one that condemns her?
  *   A) Yes (vindication is propaganda).
  *   B) No (condemnation is cruelty).
  *   C) No (truth is neutral).
  *   D) Yes, but only if unearned (merit matters).

  ***

  ## Part II: The Leaves (Positions)
  *Locate your position in the space opened by the questions above. Each leaf dictates how you must handle the spoken sentence: a line spoken aloud in a scene that appears in no document.*

  **1. Strict Archivalism**
  *   **Commitment:** You must leave gaps in the narrative where the archive is silent, even if the story collapses.
  *   **The Sentence:** Do not write it; indicate the silence with an ellipsis or a narrative admission of ignorance.

  **2. Raw Materialism**
  *   **Commitment:** The dead have no rights, so you owe nothing to the woman, only to the copyright holder of her letters.
  *   **The Sentence:** Write it exactly as suits the rhythm of the paragraph, regardless of her voice.

  **3. Communal Custodianship**
  *   **Commitment:** You owe fidelity to the village memory of her, even if the documents contradict the local legend.
  *   **The Sentence:** Write it only if it matches the dialect and sentiment still remembered by the oldest residents of the parish.

  **4. Mosaic Licence**
  *   **Commitment:** You may arrange documented facts freely, but you may not manufacture new bricks.
  *   **The Sentence:** Do not write it unless you can find those exact words spoken by someone else in the same trial transcript.

  **5. Counterfactual Confession**
  *   **Commitment:** You may supply interior acts only when the archive makes them overwhelmingly likely and the supply is not exculpatory.
  *   **The Sentence:** Write it only if the context proves she must have thought it, and ensure it does not make her look innocent.

  **6. Temporal Purism**
  *   **Commitment:** You must research the history of emotion to ensure her grief matches the vocabulary of 1893.
  *   **The Sentence:** Write it only if the syntax and psychological concepts were available to a woman of her class in that decade.

  **7. Vindicationist Ethics**
  *   **Commitment:** Invention is permissible only if it corrects a historical injustice done to the subject.
  *   **The Sentence:** Write it if it helps clear her name; delete it if it merely makes for better drama.

  **8. Narrative Sovereignty**
  *   **Commitment:** The coherence of the novel is a higher truth than the coherence of the archive.
  *   **The Sentence:** Write it whenever the scene requires emotional closure, regardless of evidence.

  **9. Descendant Sovereignty**
  *   **Commitment:** The living family holds absolute veto power, even if their memory is demonstrably wrong.
  *   **The Sentence:** Submit it to the great-granddaughter; if she objects, burn the page.

  **10. Probabilistic Realism**
  *   **Commitment:** Anything statistically likely is permitted, treating history as a dataset rather than a record.
  *   **The Sentence:** Write it if a woman in her position would likely have said it, based on demographic data of the era.

  **11. Transparent Fabulism**
  *   **Commitment:** Invention is allowed provided the reader is explicitly told where the fabrication begins.
  *   **The Sentence:** Write it, but append an endnote citing the lack of documentary evidence for the dialogue.

  **12. Unnamed — nobody defends this**
  *   **Commitment:** Invention is permissible only if it condemns the subject, treating the novel as a corrective prosecution.
  *   **The Sentence:** Write it only if it implies guilt; if it suggests innocence, it must be removed.

