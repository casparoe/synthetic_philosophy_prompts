  ## Part III: Structural Analysis

  ### Unoccupied Answer-Combinations (Gaps)
  *These are logical positions within the question space that no leaf above occupies.*

  1.  **The Penitent Vindicationist** (Invention allowed only if flagged *and* exculpatory).
      *   **Status:** **Mere Neglect.** This combines the transparency of Leaf 11 with the ethics of Leaf 7. It is a coherent position often held by academic novelists, but no leaf currently claims this specific intersection.
  2.  **The Community Probabilist** (Community memory dictates truth, unless statistics prove them wrong).
      *   **Status:** **Unattractiveness.** This pits Leaf 3 against Leaf 10. It creates a constant state of conflict between oral history and demographic data, making it a difficult stance to maintain consistently without collapsing into one or the other.
  3.  **The Interior Arranger** (Psychological anachronism is forbidden, but chronology may be rearranged).
      *   **Status:** **Incoherence.** This combines Leaf 6 (strict on interiority) with Leaf 7/Mosaic (loose on exterior fact). It suggests time matters for thoughts but not for events, which relies on a dualistic view of human experience few writers explicitly defend.

  ### Indistinguishable Leaf Pairs
  *These pairs yield identical verdicts on every case provided in the questions, differing only in metaphysical justification.*

  1.  **Raw Materialism (Leaf 2) and Narrative Sovereignty (Leaf 8).**
      *   **Reason:** On every practical question regarding invention, veto, and accuracy, both leaves permit the author to do whatever serves the book. Raw Materialism argues the dead have no rights; Narrative Sovereignty argues the story has supreme rights. The tree cannot separate them because the questions test *permissions*, not *ontological reasons*.
  2.  **Strict Archivalism (Leaf 1) and Temporal Purism (Leaf 6).**
      *   **Reason:** In the specific case of the spoken sentence (undocumented and potentially modern), both leaves forbid it. They diverge on documented but anachronistic facts, but within the scope of the eight questions provided, their prohibitions overlap significantly enough to confuse a writer sorting themselves solely on this instrument.
