      *   *Refining the "Risk View" argument:* The professor's Risk View says we prize the trace of a performance that *could have failed*. Ripley's performance *could* have failed (he could have been caught). So, by the Risk View, should we value Ripley?
          *   *Counter:* The risk must be intrinsic to the *creation*, not the *concealment*. An artist risks failing to capture the vision. Ripley risks being caught stealing the vision. The "improvement" (dutiful letters) shows he is a better *administrator* of Dickie than Dickie was, but that's bureaucratic, not authentic. It wrecks the Risk View if the View only cares about *outcome* quality + risk. It supports it if the View cares about the *source* of the risk. I need to be nuanced here. Let's argue it *stresses* the Risk View: Ripley forces us to ask if *any* high-stakes performance counts, or only artistic ones.

