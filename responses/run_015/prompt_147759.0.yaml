answer: |-
  ### The principle

  1. Equal Baseline: Every person holds an equal initial claim to aid, requiring equal chance when stakes match (Case 2).
  2. Stake Weight: Claim strength scales with harm severity; life trumps minor harms lexically unless aggregate minor harms become vast (Cases 5, 6, 7).
  3. Aggregation: When stakes are equivalent across persons (e.g., death), satisfy the greatest number of claims rather than flipping (Cases 1, 8).
  4. Partiality: Personal ties permit deviation from maximization unless institutional role mandates impartiality (Cases 3, 4).
  5. Risk Threshold: Certain death outweighs probabilistic salvation unless expected lives saved exceeds a high contextual threshold (Case 10).

  This principle is pluralistic, not monistic. It accepts conflicting duties rather than resolving them into one metric. It assumes harms are comparable across persons, which Taurek denies. It prioritizes coherence with your specific verdicts over theoretical purity.

  ### Case by case

  1. Save 5. Clause 3 mandates maximizing claims when stakes match. Direct application of aggregation.
  2. Coin flip. Clause 1 requires equal chance when claims equal. No aggregation needed here.
  3. Save kid. Clause 4 permits partiality for personal ties. Overrides Clause 3's maximization demand.
  4. Save 5. Clause 4 restricts partiality under institutional role. Role morality wins over personal tie.
  5. Save 1. Clause 2 grants lexical priority to life over migraine. Aggregation blocked by severity gap.
  6. Save 1. Clause 2 maintains lexical priority over fingers. Aggregation blocked by severity gap.
  7. Save 100k. Clause 2 allows aggregation to override lexical priority at scale. Threshold met.
  8. Save 5. Clause 3 applies; Clause 4 makes coin-flipping dereliction. Professional duty binds stronger.
  9. Save 1 young. *Mismatch.* Principle treats persons equally; verdict weights by age. Requires new clause.
  10. Save 10k/Saving 1. Clause 5 balances certainty against expected value thresholds. Distinguishes risk levels.

  The principle fits eight cases cleanly. Case 9 requires importing a "fair innings" metric not present elsewhere. Case 10 relies on an undefined threshold mechanism. Case 7's threshold is arbitrary. You are demanding a precise rule for inherently vague intuitions. The tension between Clause 1 (equality) and Clause 3 (aggregation) is unresolved; you want both equal chance and maximizing, which are logically distinct procedures. You cannot have equal claims and weighted aggregation without contradiction.

  ### What it can't save

  Case 9 is the clear casualty. Your principle relies on equal personhood; preferring the 20-year-old introduces a "fair innings" metric incompatible with equal claims. You must drop either the egalitarian baseline or the age verdict. I'd drop Case 9. It smuggles in utilitarianism (QALYs) while pretending to respect persons. Case 7 is also unstable; the jump from 100 to 100k fingers is arbitrary curve-fitting. There is no non-arbitrary way to set that threshold within this framework. The search for one principle is likely a fool's errand; you're describing a pluralistic morality with hard conflicts, not a unified theory. You want an algorithm for guilt avoidance, not ethics. Admit that Case 7 and Case 9 are inconsistent with Case 1 and 2.

  ### Three predictions

  (a) Save the one dying. Clause 2 sets a high bar for aggregating lesser harms. Ten hands don't match the lexical priority of life established in Case 6. You'd need hundreds more to trigger Case 7's exception. This exposes the arbitrariness of your threshold. If you save the ten, you admit Case 6 was wrong. If you save the one, you admit Case 7 was arbitrary.

  (b) Save from death. Same person, so no aggregation conflict. Stake weight (Clause 2) dictates preventing the greater harm to the single claimant. This is the easiest case; no trade-off between persons exists. It confirms that stake-weighting works intra-personally even if inter-personal aggregation is contested.

  (c) No change. Each agent satisfies Clause 3 locally. Coordination doesn't alter the moral arithmetic unless you assume a global maximizing agent exists. If they compare notes, they should still each save the five. If one saved the one to "balance" the other, both would be violating Clause 3. This tests whether your principle is agent-relative or neutral; here it must be neutral to handle Case 1 consistently.

  ### How sure I am

  I am sure your intuitions are inconsistent. Case 9 contradicts Case 2. I am confident the principle above is a rationalization, not a justification. The "Stake Weight" clause begs the question against Taurek by assuming harms are comparable across persons. I'm leaning hard on the assumption that you want coherence more than comfort. The risk threshold (Case 10) is the weakest link; it's pure guesswork. You are trying to derive a system from data points that were generated by conflicting systems. Stop looking for a unified field theory of your gut.
