  **(Self-Correction Note on "Consumer-Centred"):** Strictly speaking, Millikan is often read as requiring a producer-consumer loop. A purely *consumer*-centred view (where the producer's history doesn't matter, only the consumer's) is a specific variant (sometimes associated with Neander's critique or specific readings of Millikan). I need to be careful not to conflate it with standard Teleosemantics which often requires the *producer* to have a function too. The prompt says: "what makes an inner state carry one content rather than another is... what downstream systems that use the state were selected for doing with it." This implies the producer's history might be secondary or irrelevant. This is a strong version of Consumer Semantics. I will treat it as such.

