      *   *Core Mechanism:* State $S$ has content $C$ if Consumer $K$ has a selected function to respond to $S$ *as if* $C$ were the case, and this response contributes to fitness.
      *   *Key Advantage:* Handles error (consumer fails to perform function) and determinacy (fixes the "frog fly vs. black dot" problem by looking at what the tongue snapping mechanism is *for*).

  3.  **Brainstorming Challenges/Threats:**
