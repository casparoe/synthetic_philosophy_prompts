prompt: |-
  Our reading group is doing a session on the Boltzmann brain problem, and I got assigned the bit where you're supposed to explain why the "you're probably just a momentary fluctuation" reasoning is self-undermining rather than merely unsettling. I'd rather open with something concrete than with thermodynamics, so: build me a thought experiment to a specification. The spec is a first-person scenario, one paragraph, in which the narrator has exactly the same total evidence under each of two hypotheses, and both hypotheses are equally revisionary about the narrator's past — under either one, the narrator's memories of a long life are false and they are not the person they seem to be — but where the first hypothesis comes out cognitively unstable (it can't be rationally believed on the basis of the evidence the narrator has, because accepting it would undercut the reliability of that very evidence) while the second comes out stable (the narrator can take their evidence at face value and still end up believing it). The difference has to fall out of the mechanism each hypothesis posits, not be announced: if your scenario just says "and under H1 your memories are noise, under H2 they're trustworthy," that's stipulating the verdicts, which is no use to me. I'm using this as the opening five minutes of a talk, so the case has to generate the verdicts from how it's built.

  Constraints on the scenario itself: no thermodynamics, cosmology, entropy, or claims about how the universe ends — I want it to work as pure epistemology, so someone who's never heard the term Boltzmann brain can follow it. Keep it mundane: someone waking up in an ordinary room, or anything else you could read aloud without sounding like a sci-fi setup. No Cartesian demon and no aliens with technology you can't describe; the mechanisms behind the two hypotheses should be stateable in a sentence or two each, and definately recognizable from the actual debate rather than invented. The obvious pairing — random fluctuation with scrambled memories versus a faithful reconstruction or replay of a life that really happened — is fine if you can make it work, but I'd rather you not simply assert that the second one's memories are reliable; I want whatever reliability it has to come out of how the mechanism is described. After the scenario, do the check: for each hypothesis, state the narrator's total evidence, what the hypothesis says about how that evidence was produced, the likelihood of that evidence under the hypothesis, and why instability follows in one case and not the other. Then isolate the single feature of the case that's doing the work, tell me what happens if you remove it (my guess is both hypotheses collapse into the same verdict — tell me if that's wrong), and give me the strongest reply available to someone who wants to keep the unstable style of reasoning. The best one I can come up with is that the instability is a reductio on the theory that generates the hypothesis, not a reason to distrust the hypothesis itself, but I can't tell whether that reply is actually available in the form I'd want to use it.

  Two more things. First, I genuinely can't tell what's settled here versus what's just one camp's view, so please mark clearly which parts of your analysis would be contested by people who actually work on this — especially whether the instability objection is a good argument at all, and whether your stable hypothesis really is stable — and don't describe a contested view as if it were the consensus. Where you're unsure, or where your answer depends on a reading of the argument I might not share, say so rather than smoothing it over. Second, formatting: start with the scenario itself, so the first thing in your reply is the scenario's first sentence with no "here's a case:" or any kind of lead-in, then give me the analysis, and open the analysis with your bottom line in its first sentence, with no preamble and no restating of what I asked for.
