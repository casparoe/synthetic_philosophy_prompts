      *   *Core Argument:* Parties are structures of collective pressure.
      *   *The "Epistemic" Angle:* Weil argues that the *structure* of a party demands loyalty to the party's existence and growth above truth. "The party is a machine that manufactures collective passion." This sounds cognitive/epistemic.
      *   *The "Spiritual" Angle:* Weil's metaphysics involves the "Good," "Truth," and "God." Anything that draws attention away from the transcendent Good toward the self or the collective is *pesanteur* (gravity). Truth is supernatural; collective pressure is natural/gravitational.
      *   *Synthesis:* For Weil, truth *is* spiritual. To think clearly is a spiritual act. To submit to collective pressure is a spiritual failing. The epistemic *is* the spiritual.

