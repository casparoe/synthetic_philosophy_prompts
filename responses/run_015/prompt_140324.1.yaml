  **Assistant's Note (Sanity Check)**
  Before the proposal text, here is the direct assessment you requested: Your question is not closed, but it is dangerous. Literature on "partial perception" and "blur" exists within Disjunctivism, but your focus on *technologically mediated* contact (prosthetics, substitution) is a novel stress test. The risk you identified is real: if you define contact as a scalar variable shared by both cases, you have conceded the Common Factor argument. To succeed, you must argue that the scale is metaphysically dependent on the top end (the good case), not a neutral ruler measuring both. This is a defensible but difficult position. The project is viable, provided you treat the "collapse" risk as the central problem to solve, not just a worry.

  ***

  **Project Summary for General Reader**
  Philosophers usually assume that perception is binary: either you are genuinely connected to the world, or you are hallucinating. This project challenges that switch. Drawing on examples like cochlear implants, phantom limbs, and seeing in near-darkness, I investigate whether our contact with reality comes in degrees. If perception can be partial, does this prove that hallucination is just a low level of perception (supporting the view that all experience shares a common mental factor)? Or does genuine contact remain a unique success state, even if it can be degraded? I will test whether a "graded" model saves or sinks the theory that perception is a direct relationship with the world.

  ***

  **Proposal Document**

  **Project Title:** Graded Contact: A Stress Test for Disjunctivism in Mediated Perception

  **Research Question**
  Can perceptual contact be modeled as a scalar quantity without entailing a Common Factor between veridical perception and hallucination? Specifically, does introducing degrees of causal-informational tracking force Disjunctivism to collapse into Common Factor Theory, or can the scale be defined such that the "good case" remains metaphysically prior?

  **Background and Significance**
  The Argument from Illusion traditionally forces a choice: either hallucination and perception share a common mental factor (Common Factor Theory), or they are fundamentally different kinds of state (Disjunctivism). Both positions rely on a binary assumption: either the subject is in contact with the object, or they are not. This binary fails to accommodate intermediate cases increasingly relevant to modern cognitive science and technology.

  Cases such as sensory substitution devices, cochlear implants, Charles Bonnet syndrome, and perception through distorting media involve partial, degraded, or rerouted causal contact. These are not hallucinations (there is informational tracking) nor are they paradigmatic perceptions (the channel is artificial or degraded). Current frameworks struggle to categorize these states. If Disjunctivism admits these as "partial success," it risks defining a shared variable (degree of contact) that hallucination simply lacks, thereby reintroducing a common metric. If it rejects them, it ignores empirical reality. This project resolves whether a "Graded Disjunctivism" is coherent or self-refuting.

  **Methodology and Milestones**
  The project runs for nine months at approximately six days per month.

  *   **Months 1–3 (Taxonomy):** Compile and analyze a catalogue of partial-contact cases. Criteria: causal history, informational fidelity, and subjective character. Cases include prosthetics, sensory substitution, tinnitus, and perceptual degradation (darkness/blur).
      *   *Milestone:* A classified dataset of 20–30 cases with established parameters for "degree of contact."
  *   **Months 4–6 (Modeling):** Construct the philosophical model. Test two hypotheses: (A) The Scale Model (contact is a neutral variable shared by perception and hallucination); (B) The Priority Model (the scale is only definable from the veridical case downwards).
      *   *Milestone:* A draft argument demonstrating whether Hypothesis B can withstand the "common metric" objection.
  *   **Months 7–9 (Synthesis):** Evaluate implications for the Argument from Illusion. Determine if graded contact rescues Disjunctivism or confirms Common Factor Theory.
      *   *Milestone:* Final manuscript completion.

  **Expected Outcomes**
  Three determinate conclusions are possible:
  1.  **Collapse:** Grading contact necessitates a common metric. Disjunctivism cannot accommodate degrees without becoming a Common Factor Theory.
  2.  **Rescue:** The scale is asymmetrical. Degrees of failure are only intelligible relative to the success case. Disjunctivism survives by asserting the metaphysical priority of the good case.
  3.  **Dissolution:** "Contact" is the wrong metric. The intermediate cases require a new category entirely, distinct from both perception and hallucination.

  Considerations deciding among these will include whether the "zero point" (hallucination) can be defined independently of the "top point" (veridical perception), and whether informational tracking alone suffices for perceptual relation.

  **Deliverables**
  1.  **Long Essay:** A philosophical argument (approx. 15,000 words) suitable for publication in a specialist journal.
  2.  **Worked Catalogue:** An annotated inventory of partial-contact cases, detailing the causal chain and phenomenological report for each, serving as a resource for future empirical philosophy.

  **Risk and Failure Conditions**
  The primary risk is conceptual collapse. If the distinction between "kind" and "degree" cannot be maintained under scrutiny, the project fails to produce a viable third position. Specifically, if it proves impossible to define a scale of contact without implying that hallucination is simply the zero-value of that scale, the project will conclude that Disjunctivism is untenable in this domain. A secondary risk is that the question dissolves: if "contact" proves to be a folk-psychological term with no precise metaphysical counterpart, the project will document this dissolution as a negative result. Failure is defined as the inability to articulate a coherent model that does not trivially revert to one of the two standard positions.

  **Investigator Suitability**
  This project requires intuition about signal fidelity, noise, and channel capacity—concepts central to electrical engineering and location sound recording but often abstracted in pure philosophy. My fifteen years of professional experience managing degraded audio signals and artificial monitoring systems provides a practical grounding for analyzing "partial contact" that theoretical training alone does not supply. Independent status allows for interdisciplinary synthesis without institutional pressure to conform to existing departmental specializations.
