prompt: |-
  I sit on a hospital clinical ethics committee: roughly forty consults a year, usually answered within a day or two and signed off by the chair; the rest of us are clinicians, a nurse and a lay member, and none of us has any philosophy training. Again and again we are told what we morally ought to do by someone else — a senior intensivist, a specialist, a chaplain or faith leader, a hospital policy, or an outside expert — and I want a decision procedure we could run in the room, in under an hour, for when we should defer to that moral testimony and when we must work the judgment out for ourselves and own it. Ground it in what the epistemology of moral testimony actually says — the worry that taking another person's moral judgment as a reason is suspect in a way that taking their factual judgment is not, because moral understanding is not the kind of thing testimony can hand over — but make it usable by people who have never heard of the debate: give the questions in order, what counts as a sufficient answer to each, where the procedure refuses to allow deference, and where it hands the question to the full committee because what is at issue is which values to weight rather than what the facts are. It has to handle what I will call the entanglement problem: a single remark from one source often carries both a factual judgment only that source is placed to make (a prognosis, a claim about what the patient would have wanted) and a moral verdict, and it is not clear whether deferring to the one is deferring to the other. Then apply the procedure to three cases: a senior intensivist who says continued ICU treatment is futile and therefore must stop; a faith leader and a hospital policy speaking to a Jehovah's Witness adolescent who refuses a blood transfusion; and an outside expert's proposed ranking of patients for a scarce device. In at least one of them give an answer we will not want — my guess is the futility case, where we would find it easiest to treat the judgment as clinical and defer to it — and close by saying plainly what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a hospital clinical ethics committee (CEC).
      *   **Context:** ~40 consults/year, quick turnaround (1-2 days), mixed membership (clinicians, nurse, lay), *no philosophy training*.
      *   **Problem:** Frequent reliance on "moral testimony" (senior clinicians, chaplains, policies, experts) without critical evaluation. Need a decision procedure to determine *when to defer* vs. *when to deliberate*.
      *   **Theoretical Basis:** Epistemology of moral testimony (specifically the worry that moral understanding cannot be transferred via testimony like factual knowledge can).
      *   **Constraints:** Usable in <1 hour, plain language (no jargon), ordered questions, clear criteria for sufficient answers, specific handling of the "entanglement problem" (factual + moral claims mixed), application to three specific cases (Futility, Jehovah's Witness, Triage), must yield at least one counter-intuitive/unwanted result (likely the futility case), and a clear statement of limitations.

  2.  **Theoretical Grounding (Epistemology of Moral Testimony):**
      *   *The Pessimists (e.g., Hills, Nickel):* Moral testimony is problematic because moral agency requires understanding *why* something is right, not just *that* it is right. Blind deference undermines moral autonomy and responsibility.
      *   *The Optimists (e.g., Jones, McGrath):* Deference is sometimes necessary and permissible, especially in emergencies or when the testifier has superior access to relevant non-moral facts.
      *   *Key Distinction:* Factual/Technical knowledge vs. Moral/Normative judgment.
      *   *The "Entanglement Problem":* Often, an expert says "X is futile" (factual/prognostic) implies "X ought to stop" (moral). We need to disentangle these.

  3.  **Drafting the Procedure (The "Moral Deferral Filter"):**
      *   *Goal:* Simple, step-by-step, actionable.
      *   *Step 1: Identify the Claim.* Is it fact or value?
      *   *Step 2: Check Expertise.* Do they know the facts better than us?
      *   *Step 3: Check Entanglement.* Is the moral conclusion hidden inside the factual claim?
      *   *Step 4: Check Stakeholders.* Who bears the burden?
      *   *Step 5: The Verdict.* Defer or Deliberate.

      *Refining for the User:* Needs to be less academic. Let's call it the "Source & Substance Check."
      *   *Question 1 (The Separation):* Can we separate the *what will happen* from the *what we should do*?
      *   *Question 2 (The Fact Check):* Is the source the only one who knows the facts?
      *   *Question 3 (The Value Check):* Is the moral principle settled (policy/law) or contested?
      *   *Question 4 (The Responsibility):* If we are wrong, whose conscience is it?

      *Addressing the "Entanglement Problem":* This needs a specific step. If a doctor says "It's futile," that sounds medical. But "futility" often implies "not worth doing." The procedure must force the committee to ask: "What exactly is the probability of success, and who decides if that probability is low enough to stop?"

  4.  **Developing the Three Cases:**

      *   *Case 1: Senior Intensivist (Futility).*
          *   *Claim:* "Treatment is futile, must stop."
          *   *Analysis:* "Futile" is entangled. Prognosis (fact) + Worthwhileness (value).
          *   *Procedure Outcome:* The committee *must* deliberate on the value threshold, even if they defer on the prognosis.
          *   *Unwanted Result:* The prompt suggests the user *wants* to defer here usually, but the procedure should say "No, you own the moral verdict." This fits the "answer we will not want" constraint.

      *   *Case 2: Jehovah's Witness Adolescent (Blood).*
          *   *Claim:* Faith leader says "No blood"; Policy says "Respect refusal if competent."
          *   *Analysis:* Fact (competence/maturity), Value (religious integrity vs. life).
          *   *Procedure Outcome:* Policy handles the legal/value framework. Faith leader handles religious significance. Committee handles competence (fact) and best interest (value if incompetent).
          *   *Result:* Likely defer to policy/faith on the *meaning*, deliberate on *competence*.

      *   *Case 3: Outside Expert (Triage/Scarce Device).*
          *   *Claim:* "Rank patients this way."
          *   *Analysis:* Pure value judgment on allocation justice.
          *   *Procedure Outcome:* Cannot defer. This is the committee's core job.
          *   *Result:* Full deliberation.

  5.  **Refining the Procedure for "No Philosophy Training":**
      *   Avoid terms like "epistemology," "normative," "propositional knowledge."
      *   Use terms like "Prediction," "Principle," "Mix," "Burden."
      *   Make it a flowchart style logic.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the tension. Validate their experience. Introduce the core idea: Facts can be borrowed; values must be owned.
      *   *The Procedure:* "The Deferral Filter." Four questions.
      *   *The Entanglement Clause:* Specific instruction on how to split "is" from "ought."
      *   *Case Applications:* Walk through the three cases using the filter. Ensure the Futility case yields the "hard" result.
      *   *Limitations:* What can't this solve? (Time pressure, deep moral disagreement, legal mandates).

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the futility case result too harsh?
      *   *Fix:* Ensure the distinction is clear: Defer on the *prognosis* (99% chance of death), do not defer on the *policy of stopping* (is 1% chance worth the suffering?). The prompt asks for an answer they won't want—treating futility as purely clinical is the trap. The procedure must force them to see the moral component.
      *   *Critique:* Is the language too academic?
      *   *Fix:* Change "Epistemic Authority" to "Who knows the facts?" Change "Normative Authority" to "Who decides the rules?"
      *   *Check:* Did I address the "under an hour" constraint? Yes, keep the questions punchy.
      *   *Check:* Did I address the "entanglement problem"? Yes, make it Step 2.

  8.  **Final Polish:**
      *   Ensure the tone is respectful of their clinical expertise but firm on the ethical distinction.
      *   Make sure the "Unwanted Answer" is highlighted clearly.
      *   Verify the philosophical grounding is accurate (Hills' "Moral Understanding" is the key reference implicitly used).

  9.  *(Final thought on the "Unwanted Answer"):* The user suspects the futility case is where they *want* to defer. The procedure should tell them they *can't* fully defer. This aligns with the prompt's request ("In at least one of them give an answer we will not want — my guess is the futility case").

  10. **Drafting the response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### The Deferral Filter: A Procedure for Clinical Ethics Committees

  **Purpose:** To distinguish between *factual claims* (which you can safely accept from experts) and *moral claims* (which you must own), specifically when they are mixed together.
  **Time:** 15–45 minutes.
  **Grounding:** Based on the philosophical view that while we can borrow someone else's *knowledge* (facts), we cannot borrow *understanding* (values). If you defer on a moral question, you lose the ability to explain *why* the decision was right, which undermines your responsibility as a committee.

  ---

  ### The Procedure (The Four Questions)

  Run these questions in order. If you answer **NO** to any question, you cannot simply defer; you must deliberate.

  #### 1. The Separation Question
  **"Can we separate what *will* happen from what we *should do*?"**
  *   **Look for:** Statements that mix a prediction with a verdict (e.g., "It is futile," "It is inhumane," "It is a violation").
  *   **Sufficient Answer:** Yes, we can split the statement into a medical prognosis (fact) and a recommendation (value).
  *   **If NO:** The source is presenting a moral conclusion as a medical fact. **Stop.** You must disentangle them before proceeding. You cannot defer to the combined claim.

  #### 2. The Expertise Question
  **"Is the source the only person in the room who knows the facts?"**
  *   **Look for:** Prognostic data, surgical risk, legal statutes, or specific religious doctrines.
  *   **Sufficient Answer:** Yes, the intensivist knows the physiology; the chaplain knows the doctrine; the lawyer knows the statute. We do not have this data.
  *   **If YES:** You may **defer on the fact**.
  *   **If NO:** (e.g., The expert is guessing about the patient's wishes without evidence). You must **deliberate on the fact**.

  #### 3. The Policy Question
  **"Is there a settled rule that covers this specific value?"**
  *   **Look for:** Hospital policy, state law, or established bioethical consensus (e.g., "Informed consent is required").
  *   **Sufficient Answer:** Yes, there is a written policy or law that dictates the outcome if Fact X is true.
  *   **If YES:** You may **defer to the rule**. Your job is only to verify the facts trigger the rule.
  *   **If NO:** (e.g., The policy is vague, or the case is an exception). You must **deliberate on the value**.

  #### 4. The Burden Question
  **"If this decision turns out to be wrong, whose conscience is burdened?"**
  *   **Look for:** Who has to live with the moral residue? The committee, the bedside team, or the family?
  *   **Sufficient Answer:** The committee is the body designated to bear the institutional moral burden.
  *   **If YES:** You cannot defer. You must **own the verdict**.
  *   **If NO:** (e.g., It is purely a clinical operational decision). You may defer.

  ---

  ### Handling the "Entanglement Problem"

  You noted that experts often bundle facts and values. This is the most common failure point.
  *   **The Rule:** If a statement is entangled, you must **accept the fact** (if Question 2 is Yes) but **reject the verdict** (and answer Question 3 and 4 yourself).
  *   **Example:** A doctor says, "CPR is medically inappropriate."
      *   *Fact:* "Survival to discharge is <1%." (Defer to doctor).
      *   *Value:* "Therefore, we should not do it." (Committee must decide if 1% is enough to warrant the suffering).
  *   **Action:** Do not sign off on "inappropriate." Sign off on "prognosis is <1%, and per Committee values, this does not meet the threshold for intervention."

  ---

  ### Application to Three Cases

  Here is how the Filter runs on your typical consults.

  #### Case 1: The Senior Intensivist (Futility)
  **The Claim:** A senior intensivist tells the committee, "Continued ICU treatment is futile and therefore must stop."
  **The Run:**
  1.  **Separation:** No. "Futile" mixes the prediction (death is likely) with the verdict (treatment should stop). *Action: Split them.*
  2.  **Expertise:** Yes, on the prognosis. The intensivist knows the physiology. *Action: Defer on the probability of survival.*
  3.  **Policy:** No. Hospital policy likely says "avoid non-beneficial treatment" but does not define the exact survival percentage that counts as "non-beneficial."
  4.  **Burden:** Yes. If you stop treatment and the patient survives, or if you continue and they suffer pointlessly, the Committee owns the ethical justification, not the intensivist.

  **The Verdict:** **Do Not Defer on the Decision.**
  You must accept the intensivist's *numbers*, but you must vote on whether those numbers justify withdrawal. You cannot sign off saying "The doctor says it's futile." You must sign off saying "Given the <1% chance of survival, the Committee judges the burden outweighs the benefit."

  **The Unwanted Answer:** I know you want to treat this as a clinical judgment and let the intensivist carry the load. This procedure forbids it. "Futility" is a moral threshold, not a biological state. If you defer here, you are abdicating the committee's primary function. You must own the value judgment that *this* level of hopelessness is enough to stop.

  #### Case 2: The Jehovah's Witness Adolescent (Blood)
  **The Claim:** A faith leader and hospital policy state the adolescent's refusal of blood must be respected.
  **The Run:**
  1.  **Separation:** Yes. The fact is the patient's maturity/competence. The value is religious autonomy vs. preservation of life.
  2.  **Expertise:** Yes, the faith leader knows the theological stakes (apostasy). The clinicians know the medical risk.
  3.  **Policy:** Yes. State law and hospital policy usually provide a framework for "mature minors" and emergency exceptions.
  4.  **Burden:** Shared. But the Committee is the safeguard for the minor's best interests if competence is unclear.

  **The Verdict:** **Defer on Doctrine and Policy; Deliberate on Competence.**
  You do not need to debate the theology; defer to the chaplain on the spiritual harm. You do not need to debate the law; defer to policy on the legal floor. However, you must **deliberate on the factual assessment of competence**. Is the adolescent truly understanding the consequences? That is a judgment call no policy can make for you. If the policy says "Respect competent refusal," your only job is to verify competence.

  #### Case 3: The Outside Expert (Scarce Device)
  **The Claim:** An outside bioethicist proposes a ranking list for a scarce device (e.g., ECMO) based on "maximizing life-years."
  **The Run:**
  1.  **Separation:** Yes. The fact is the projected life-years. The value is the principle of allocation (life-years vs. lottery vs. sickest first).
  2.  **Expertise:** No. The expert has no special access to *your* hospital's values or community standards.
  3.  **Policy:** No. Triage policies in crises are often drafted ad hoc or are intentionally vague to allow flexibility.
  4.  **Burden:** Yes. This is the heaviest moral burden the committee carries.

  **The Verdict:** **Full Deliberation. No Deference.**
  You cannot accept the expert's ranking. You can use their *data* (projected life-years), but you must vote on the *principle*. Is maximizing life-years the value *this* hospital stands for? If you defer to the expert, you allow an outsider to set your institutional moral priorities. This must be worked out in the room.

  ---

  ### What This Procedure Cannot Settle

  Be plain with your chair and your colleagues: This Filter does not generate moral truth. It only generates **moral ownership**.

  1.  **It cannot resolve deep disagreement:** If the committee splits 50/50 on the Futility case after using the Filter, the procedure does not tell you who is right. It only ensures you aren't hiding behind the intensivist.
  2.  **It cannot fix time pressure:** In a true code blue emergency, you do not have time for Four Questions. This is for consults, not codes.
  3.  **It cannot override law:** If the law says "X," you cannot deliberate on "Not X." The Filter helps you see where the law ends and your judgment begins.
  4.  **It cannot remove regret:** Using this procedure ensures the decision is *yours*. That means the moral distress is also yours. It prevents the comfort of saying "We just did what the expert said," but it offers no protection against the pain of being the one who decided.

  **Summary for the Chair:**
  If the consult is about **facts** (prognosis, law, doctrine), we defer to the expert.
  If the consult is about **weights** (how much hope is enough, what fairness requires, what dignity demands), we defer to no one.
  If the two are mixed, we take the facts and weigh them ourselves.
