answer: |-
  Dear Student,

  It is completely understandable that you are finding it difficult to maintain consistency when applying inside and outside view reasoning to your own philosophical beliefs. This tension is at the very heart of epistemic rationality, and the fact that you are feeling torn on cases like metaethics and consciousness suggests you are engaging with the material deeply rather than just applying a heuristic mechanically. To help you stabilize your verdicts, I propose a single guiding principle called the Principle of Epistemic Asymmetry. This principle states that you are permitted to rely on the inside view only when you possess specific evidence or cognitive access that breaks the symmetry between yourself and the reference class of peers or experts; if your evidence is of the same type and quality as that available to the disagreeing group, you must default to the outside view.

  When we apply this principle to your clear verdicts, it explains why you feel comfortable using the inside view for free will but the outside view for AI suffering and memory. In the free will case, the evidence is your own first-personal phenomenology of choice, which is private and unique to you, thereby breaking epistemic symmetry with philosophers who do not have access to your specific mental life. Conversely, in the AI suffering case, you lack any private access to the internal states of the machine, placing you in a symmetric epistemic position with the experts who are also guessing based on external behavior, which demands the outside view. Similarly, with memory, while the memory trace is private, the statistical reliability of human memory is a general fact that applies to you just as it does to everyone else, meaning you lack asymmetric evidence regarding the truth of the memory, so the outside view correctly dictates caution.

  However, maintaining this simple principle requires you to sacrifice some of your current intuitions where you feel torn, specifically regarding the metaethics case and the zombie problem. In the metaethics case, you feel that working through the premises grants you inside-view privilege, but under the Principle of Epistemic Asymmetry, this intuition must be dropped. Unless you have discovered a specific logical error in others' reasoning that they have missed, your understanding of the premises is symmetric with other philosophers who have also studied the arguments, meaning the persistent disagreement among experts should force you toward the outside view and greater modesty. Similarly, for the zombie problem, while you have direct access to your own consciousness, the claim about philosophical zombies concerns metaphysical possibility and other minds, which is a conceptual claim where your access is symmetric to your peers, so you should also adopt the outside view there rather than trusting your initial intuition.

  To see how this principle extends to new territory, consider a case where you ask yourself whether you are less susceptible to confirmation bias than your classmates. Your inside view will likely tell you that you are more objective because you feel you are trying hard to be fair, but the outside view notes that most people believe they are less biased than average due to the bias blind spot. The Principle of Epistemic Asymmetry predicts you should adopt the outside view here because your feeling of objectivity is symmetric with your classmates' feelings of objectivity, and you lack private evidence of your own neutrality that they lack. By accepting this principle, you gain a consistent framework for when to trust your gut and when to defer to the crowd, even if it means accepting more uncertainty in your philosophical conclusions than you might prefer.

  I hope this helps clarify the landscape for you as you continue your seminar. It is often painful to surrender the confidence that comes with the inside view, especially after hard work, but recognizing when symmetry holds is a mark of genuine rationality. Please feel free to reach out if you want to discuss how this might apply to other specific arguments you encounter in your reading.

  Warmly,

  Your Philosophy Tutor
