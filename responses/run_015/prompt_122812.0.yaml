prompt: |-
  I'm running a one-off session on voting and collective choice for about 18 undergrads, mostly philosophy and PPE with a couple of econ majors who've seen a bit of social choice but not much. 80 minutes, one room, no laptops. I want them to feel Gibbard–Satterthwaite in their bones rather than have me state it, so the theorem shouldn't be named until the last ten minutes and its name shouldn't appear on any handout.

  Here's roughly where I've got to, and where I need help.

  The choice they're making: what to do with the last two sessions of term. Four options, and I want them arranged so that people's preferences plausibly sit on a single axis (how formal/technical vs. how discursive the sessions are — a proofs workshop, a guest speaker, a student-led debate, a trip to a local archive). That axis matters later, but they shouldn't be told it exists.

  My plan is a few rounds with the same private preferences and a payoff in points they care a bit about (counts toward a quiz exemption, no actual money, nothing that will get me in trouble with the department). Round one: plurality, with me acting as a polling firm that releases a slightly noisy poll before ballots go in. Round two: same preferences, different rule (runoff or Borda), so the winner changes and someone notices that voting sincerely cost them. Round three: open season — announce the rule, let them think, collect ballots, and compare what happened to what sincere voting would have given.

  Then the part I'm most unsure about. I want to split them into teams of three and have each team invent a voting rule that can't be gamed, with the other teams paid in points for breaking it with a falsified ballot. My hope is that they converge on the same three or four escape hatches on their own, and that the debrief is mostly me pointing at what they already built. I'd like your version of that phase: what the rules of the design contest should be so that it doesn't collapse into everyone proposing ranked choice, how to score rule-invention vs. rule-breaking so both sides actually try, and what to do when a team proposes something genuinely strategy-proof that I haven't anticipated.

  Two extra things I can't work out. First: I'm tempted to let abstention be a ballot option in round three, and I can't tell whether that's a second, interesting kind of manipulation or just noise that will muddy the main point — tell me whether to include it and where. Second: someone always raises the thing where you'd do better staying home than voting at all, and I never handle it well; if it's a different result from the one I'm teaching, say so explicitly and tell me how to stop it swallowing the session.

  Give me: the full runnable thing — rules, ballot and scoring materials, the payoff scheme, a timeline with minute marks, and how the poll's noise level should be set (I don't want it so precise that everyone can compute an optimal ballot, or so vague that nobody strategizes). Then a debrief that maps specific moments onto the specific assumptions doing the work: deterministic, at least three outcomes actually in the running, no dictator, and no restriction on what preferences people can have. I also want the debrief to keep this clearly separate from Arrow's result, which half of them will have heard of and will try to merge with this one.

  Be honest about: what will predictably go wrong the first time I run it (collusion, the econ major blurting the answer in minute five, someone voting sincerely on principle, ties, someone who's already read about this spoiling the design phase, groups too small for anyone to have real information about others); and which bit of the idea the game simply cannot deliver, so I have to say it out loud myself. My instinct is that it can't show that every reasonable rule is manipulable, only that a handful are, and that it can't convey that the result is about what's possible given information rather than about how often real people strategically vote — but tell me if I'm wrong about what's missing.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach Gibbard-Satterthwaite (G-S) theorem experientially to 18 undergrads (Phil/PPE/Econ) in 80 mins.
      *   **Constraints:** No laptops, one room, no money (points for quiz exemption), G-S name hidden until last 10 mins.
      *   **Core Activity:** Voting on end-of-term activities (4 options). Preferences should lie on a spectrum (formal vs. discursive) but hidden.
      *   **Structure:**
          1.  Round 1: Plurality + Noisy Poll.
          2.  Round 2: Different Rule (Runoff/Borda) + Same Preferences (Sincere voting hurts).
          3.  Round 3: Open Season (Announce rule, strategize).
          4.  Round 4 (The Tricky Part): Team Design Contest (Invent strategy-proof rule vs. Breakers).
      *   **Specific Questions:**
          *   How to structure the Design Contest (scoring, preventing simple Ranked Choice, handling unexpected strategy-proof rules)?
          *   Abstention in Round 3: Include or exclude?
          *   "Stay at home" paradox (participation cost): How to handle?
          *   Deliverables: Full runnable plan (rules, ballots, scoring, timeline, poll noise), Debrief (mapping moments to assumptions, distinguishing from Arrow), Honesty Check (what will go wrong, what the game *can't* show).

  2.  **Deconstruct the Core Concepts:**
      *   **Gibbard-Satterthwaite:** Any deterministic voting rule with $\ge 3$ outcomes that isn't a dictatorship is manipulable (assuming unrestricted domain).
      *   **Key Assumptions to Highlight:** Deterministic, $\ge 3$ outcomes, Non-dictatorial, Unrestricted Domain (this is the big one for the "spectrum" setup).
      *   **Distinction from Arrow:** Arrow is about *aggregating* preferences into a social ordering (transitivity, IIA, etc.). G-S is about *selecting* a winner and *incentives* to lie. Arrow = Social Welfare Function. G-S = Social Choice Function + Strategy.

  3.  **Drafting the Session Plan - Section by Section:**

      *   **Setup & Preferences:** Need 4 options. Let's call them A, B, C, D.
          *   A: Proofs Workshop (Technical)
          *   B: Guest Speaker (Mixed)
          *   C: Student Debate (Discursive)
          *   D: Archive Trip (Experiential/Discursive)
          *   *Correction:* The prompt suggests a single axis (Formal <-> Discursive). Let's make sure the preferences are distributed so Condorcet cycles or strategic opportunities exist.
          *   *Distribution:* To make G-S palpable, we need peaks scattered. Let's assign preference cards secretly.
          *   *Axis:* Technical (A) -> Mixed (B) -> Discursive (C) -> Outing (D).
          *   *Distribution:* 18 students. Need clusters.
              *   Cluster 1 (Tech): 5 students (A > B > C > D)
              *   Cluster 2 (Mixed): 5 students (B > A > C > D or B > C > A > D)
              *   Cluster 3 (Discursive): 5 students (C > B > D > A)
              *   Cluster 4 (Outing): 3 students (D > C > B > A)
              *   *Refinement:* To ensure manipulability, we need specific profiles where sincere voting loses.

      *   **Round 1 (Plurality + Poll):**
          *   Rule: Vote for 1. Most wins.
          *   Poll: Release numbers *before* voting.
          *   Noise: Needs to be enough to create uncertainty but suggest a frontrunner. If A and B are close, C voters might switch to B to stop A.
          *   *Noise Level:* $\pm 2$ votes. Enough to make a 3-vote lead look shaky.

      *   **Round 2 (Runoff/Borda):**
          *   Let's use Instant Runoff (IRV) or Two-Round. IRV is easier in one room.
          *   Goal: Show that sincere voting (A > B > C) might eliminate B early, letting C win, whereas A voters should have voted B > A > C.
          *   *Actually:* Borda is often easier to manipulate for beginners. "Bury the rival." Let's stick to the prompt's suggestion: Runoff.
          *   *Crucial:* Keep preferences *private* and *fixed*. They hold the same card.

      *   **Round 3 (Open Season):**
          *   Announce rule (e.g., Plurality again).
          *   Allow discussion? No, that leads to collusion. Allow *private* thought.
          *   *Abstention:* The prompt asks about this.
          *   *Decision:* Exclude abstention for G-S focus. G-S assumes participation. Abstention introduces "Participation Paradox" (why vote if cost > benefit?). It muddies the "lying vs. truth" mechanic. I will advise *against* it for the core game but address it in the "Stay at home" section.

      *   **Round 4 (The Design Contest):**
          *   *Challenge:* Teams of 3 (6 teams).
          *   *Task:* Propose a rule. Other teams try to break it.
          *   *Scoring:* Designers get points if rule holds. Breakers get points if they change outcome by lying.
          *   *Preventing "Ranked Choice":* Ranked Choice (IRV) *is* manipulable. But students often think it isn't. The constraint should be: "Rule must take ballots as input and output a winner. No randomization."
          *   *Handling "Dictatorship":* If a team proposes "Student X decides," that is strategy-proof. I need to ban "Named Dictators" but allow "Positional Dictators" (e.g., "Highest ranked on Ballot #1 wins"). Actually, G-S allows dictators. The point is to show *non-dictatorial* rules fail. So, rule constraint: "No single voter's ballot always determines the winner."
          *   *Handling "Restricted Domain":* If they say "Assume everyone prefers A over B," that breaks Unrestricted Domain. I need to penalize rules that assume specific preferences.
          *   *Scoring:* 10 points for Design if unbroken. 5 points for Breaker per successful break.

      *   **Debrief:**
          *   Map moments to assumptions.
          *   Distinguish from Arrow (Aggregation vs. Selection + Incentives).
          *   Address the "Stay at Home" issue (Participation Paradox vs. Manipulation).

      *   **Honesty Check:**
          *   What goes wrong? Collusion in Round 3. Econ major spoiling. Ties.
          *   What can't the game show? That *every* rule fails (we only test a few). That it holds for *all* preference profiles (we only test one).

  4.  **Refining the Details:**

      *   **Poll Noise:** If true counts are A:6, B:6, C:6. Poll says A:8, B:5, C:5. C voters panic and vote B.
      *   **Payoff:** Quiz exemption points. 1 point = 1% off quiz or similar. Keep it low stakes but non-zero.
      *   **Abstention:** I will recommend *against* it for the main game. It introduces a different theorem (Participation Paradox).
      *   **"Stay at Home":** This is the "Paradox of Not Voting." It's distinct from G-S. G-S says "If you vote, lie." Participation Paradox says "Don't vote." I need a script for this.
      *   **Design Contest Rules:** Needs to be tight. 5 mins to design, 5 mins to attack.
      *   **Unexpected Strategy-Proof Rules:**
          *   *Random Dictator:* "Pick a ballot at random, winner is top choice." (Strategy-proof, but probabilistic). G-S assumes deterministic.
          *   *Fixed Outcome:* "A always wins." (Strategy-proof, but trivial).
          *   *My Plan:* Explicitly ban Randomization and Fixed Outcomes in the contest rules.

  5.  **Writing the Plan (incorporating the constraints):**

      *   *Timeline:* 80 mins is tight.
          *   Intro/Setup: 10
          *   Round 1: 15
          *   Round 2: 15
          *   Round 3: 10
          *   Design Contest: 20
          *   Debrief/Reveal: 10
      *   *Materials:* Preference cards (pre-printed), Ballots, Scoreboard.
      *   *The "Axis":* Keep it hidden. But ensure the preference cards reflect single-peakedness *mostly*, but with enough variation to break it if needed. Actually, G-S relies on *Unrestricted Domain*. If I force single-peaked preferences, Median Voter Theorem applies, and Plurality *might* be strategy-proof in that specific domain. **CRITICAL CATCH:** If I arrange preferences on a single axis (Single-Peaked), Plurality/Condorcet rules become much harder to manipulate (Moulin's result). To teach G-S, I need *some* voters to have non-single-peaked preferences, OR I need to rely on the fact that they don't *know* it's single-peaked.
      *   *Correction:* The prompt says "I want them arranged so that people's preferences plausibly sit on a single axis... That axis matters later, but they shouldn't be told it exists."
      *   *Risk:* If preferences are truly single-peaked, the Median Voter Theorem suggests sincere voting is an equilibrium under majority rule. G-S applies to *unrestricted* domains.
      *   *Solution:* I must warn the user that if they enforce single-peakedness too strictly, the "manipulation" might disappear for majority rules. I need to ensure at least *some* preferences violate single-peakedness or use a rule (like Borda) that is manipulable even on single-peaked domains. Or, rely on the *uncertainty* about others' preferences.
      *   *Better Solution:* The prompt asks for the axis to exist but be hidden. I will advise ensuring at least 3-4 students have "weird" preferences (e.g., A > D > B > C) to break single-peakedness silently, ensuring G-S conditions are met without announcing it.

  6.  **Final Review against constraints:**
      *   No laptops? Check.
      *   18 students? Check.
      *   G-S name hidden? Check.
      *   Design Contest mechanics? Check.
      *   Abstention advice? Check.
      *   "Stay at home" advice? Check.
      *   Arrow distinction? Check.
      *   Honesty check? Check.

  7.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Scoring:* Make sure the "Design Contest" doesn't take too long. 6 teams is a lot for presentations. Maybe 3 teams design, 3 teams attack? Or all design, then swap? Swap is better. Team A designs, Team B attacks.
      *   *Poll Noise:* Be specific. "True Count +/- 2".
      *   *Debrief:* Need clear script for Arrow vs. G-S. Arrow = Consistency of Group Mind. G-S = Incentives to Lie.

  8.  **Final Polish:** Ensure tone is practical and authoritative. (Proceeding to generate output).

  *(Self-Correction on the Single-Axis constraint)*: The prompt explicitly says "I want them arranged so that people's preferences plausibly sit on a single axis". I need to respect this. However, I must warn that if preferences are *strictly* single-peaked, some rules become strategy-proof. I will advise adding a "spoiler" preference profile to ensure the domain is technically unrestricted even if it *looks* single-peaked. This satisfies the "feel it in their bones" goal without violating the math.

  *(Self-Correction on Design Contest)*: 6 teams of 3. 18 students.
  Phase 1: Design (5 mins).
  Phase 2: Attack (5 mins).
  Phase 3: Report.
  To prevent "Ranked Choice" dominance: Explicitly state "Ranking candidates is allowed, but simply counting ranks (Borda) or eliminating losers (IRV) are known to be breakable. You need a new mechanism."
  To prevent Dictatorship: "The rule cannot designate a specific student or 'the first ballot' as the sole decider."
  To prevent Randomness: "No coin flips."

