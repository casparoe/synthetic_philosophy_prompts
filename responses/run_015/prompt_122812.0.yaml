answer: |-
  Here is a complete, runnable session plan designed to meet your constraints and pedagogical goals.

  ### **Session Overview**
  *   **Topic:** Strategic Voting & The Gibbard–Satterthwaite Theorem (unnamed until the end).
  *   **Time:** 80 Minutes.
  *   **Students:** 18 (6 teams of 3).
  *   **Materials:** Printed Preference Cards (18), Ballot Slips (50), Scoreboard (Whiteboard), Timer.
  *   **Stakes:** "Solidarity Points." The team with the most points gets a 5% exemption on the final quiz. (Low cost to you, high enough salience for them).

  ---

  ### **1. Setup & Preferences (0:00 – 0:10)**
  **The Options:**
  Write these on the board. Do not describe them beyond the labels.
  *   **A:** Proofs Workshop (Highly Technical)
  *   **B:** Guest Speaker (Mixed)
  *   **C:** Student Debate (Discursive)
  *   **D:** Archive Trip (Experiential)

  **The Preference Cards:**
  Hand out one card to each student face down. Tell them: *"This is your true preference order for the end-of-term sessions. Keep it secret. You will not get to change this card during the session. Your goal is to maximize the rank of the final outcome on this card."*

  **Distribution (Crucial for the "Axis" feel but mathematically broken):**
  You want a single peak structure *mostly*, but G-S requires an **Unrestricted Domain**. If everyone is perfectly single-peaked, the Median Voter Theorem applies, and sincere voting becomes an equilibrium for majority rules, killing the lesson.
  *   **12 Students (The "Axis"):** Give them single-peaked preferences along A–B–C–D.
      *   3 students: A > B > C > D
      *   3 students: B > A > C > D
      *   3 students: C > B > D > A
      *   3 students: D > C > B > A
  *   **6 Students (The "Breakers"):** Give them preferences that violate single-peakedness slightly (e.g., A > D > B > C). This ensures the *mathematical* condition of G-S is met, even if the *vibe* is linear. Do not tell them they are different.

  **Teams:**
  Have them count off 1–6 to form 6 teams of 3. They will compete for Solidarity Points.

  ---

  ### **2. Round 1: Plurality + Noisy Poll (0:10 – 0:25)**
  **Rule:** Vote for one option. Most votes wins. Ties broken by coin flip (public).
  **The Poll:** Before handing out ballots, announce: *"We conducted a straw poll earlier. The results were: A: 5, B: 4, C: 5, D: 4."*
  **The Noise:** The *true* count of preferences (if everyone voted sincerely) is actually A: 3, B: 3, C: 3, D: 3 (plus the breakers). The poll is **false**. It suggests A and C are frontrunners.
  **Instruction:** *"Vote sincerely. We are testing the baseline."*
  **Execution:** Collect ballots. Count publicly.
  **Likely Outcome:** Because the poll suggests A and C are winning, D and B voters (who are small groups) may panic and switch to their "lesser evil" among the frontrunners, even if you asked for sincerity. Or, if they vote sincerely, the vote splits, and a minority winner emerges.
  **Scoring:** Teams get 1 point for every member whose #1 choice wins.

  **Debrief Point (1 min):** Ask: *"Did anyone vote for someone other than their top choice?"* If yes, ask why. (Answer: The Poll).

  ---

  ### **3. Round 2: Runoff (IRV) + Fixed Preferences (0:25 – 0:40)**
  **Rule:** Instant Runoff. Rank all 4. If no majority, eliminate lowest, transfer votes.
  **Instruction:** *"Same preference cards. Vote sincerely again."*
  **The Trap:** Construct the preference cards so that a "Compromise" candidate (say, B) is eliminated early because they have few #1 votes, allowing a polarizing candidate (A or C) to win.
  **Example Profile:**
  *   A Voters: A > B > C > D
  *   C Voters: C > B > A > D
  *   B Voters: B > A > C > D
  If B voters vote sincerely (B > A > C > D), B might be eliminated first. If they vote strategically (A > B > C > D), A wins, which might be better than C winning.
  **Execution:** Count publicly. Show the elimination rounds.
  **Scoring:** Teams get 2 points for every member whose #1 choice wins.
  **The Reveal:** Ask: *"Did anyone get a worse result than Round 1 despite the rule being 'fairer'?"*
  **Key Moment:** Identify a student who voted sincerely and lost, whereas a strategic vote would have saved their preferred outcome.

  ---

  ### **4. Round 3: Open Season (0:40 – 0:50)**
  **Rule:** Plurality again (Vote for 1).
  **Instruction:** *"Same preference cards. You know the rules. You know the group size. You have 3 minutes to discuss within your teams, then vote privately. Maximize your payoff."*
  **Abstention Decision:** **Do not allow abstention.**
  *   *Why:* G-S assumes participation. Abstention introduces the "Paradox of Participation" (why vote if cost > pivot probability?). It muddies the "Lying vs. Truth" mechanic you want to isolate. If a student asks, say: *"For this exercise, voting is mandatory. We are isolating the incentive to misrepresent preferences, not the incentive to participate."*
  **Execution:** Collect ballots.
  **Outcome:** Expect significant strategic voting (burying strong rivals, coalescing around a viable loser).
  **Scoring:** Teams get 3 points for every member whose #1 choice wins.

  ---

  ### **5. The Design Contest (0:50 – 1:10)**
  **Goal:** Teams invent a voting rule that cannot be gamed.
  **Setup:**
  *   Teams 1, 3, 5 are **Designers**.
  *   Teams 2, 4, 6 are **Breakers**.
  *   (Swap roles if time permits, but better to go deep on one round).

  **Rules for Designers (Write on Board):**
  1.  **Input:** The rule must take a set of ballots from 18 voters.
  2.  **Output:** The rule must produce exactly one winner (A, B, C, or D).
  3.  **Deterministic:** No coin flips, no randomization.
  4.  **Neutral:** You cannot name specific students (e.g., "Team 1 decides").
  5.  **Universal:** The rule must work for *any* set of preferences (you can't assume people like B more than D).

  **Rules for Breakers:**
  1.  You are given the Designer's rule.
  2.  You are given a specific "Scenario" (a set of true preferences for the room).
  3.  You must submit a set of ballots that differs from the "True Preferences" such that the outcome changes to something your team prefers.

  **Scoring:**
  *   **Designers:** 10 Points if the Breakers fail to manipulate the outcome after 5 minutes of trying.
  *   **Breakers:** 5 Points per successful manipulation (changing the winner by lying).

  **The Process:**
  1.  **Design (5 mins):** Teams 1, 3, 5 write their rule on a sheet of paper.
  2.  **Attack (5 mins):** Hand Rule 1 to Breaker Team 2. Hand Rule 3 to Breaker Team 4. Hand Rule 5 to Breaker Team 6. Breakers try to find a lie that changes the winner.
  3.  **Report (5 mins):** Each pair reports success/failure.

  **Handling "Unexpected" Strategy-Proof Rules:**
  *   **The Dictator:** If a team writes "Winner is top choice of Ballot #1."
      *   *Ruling:* Disqualify. Violates Rule 4 (Neutral/No specific students). Explain: *"We are looking for democratic rules, not autocracies."*
  *   **The Constant:** If a team writes "A always wins."
      *   *Ruling:* Disqualify. Violates Rule 5 (Universal/Unrestricted Domain). Explain: *"The rule must respond to voter input."*
  *   **The Random Dictator:** "Pick a ballot at random."
      *   *Ruling:* Disqualify. Violates Rule 3 (Deterministic).
  *   **The "Honesty Bonus":** If they propose "Everyone signs their ballot and liars are expelled."
      *   *Ruling:* Disqualify. *"The rule must rely only on the ballot content, not external enforcement."*

  **Likely Outcome:** Breakers will win every time. They will find that if they bury a strong candidate or inflate a weak one, they can shift the result. This is the visceral "feel" of G-S.

  ---

  ### **6. Debrief & Theorem Reveal (1:10 – 1:20)**
  **The Reveal:**
  *"You just tried to build a perfect voting system. You failed. In 1973, Allan Gibbard and Mark Satterthwaite proved mathematically that you *could not have succeeded*."*

  **Write the Theorem Conditions on the Board:**
  Any voting rule is manipulable if it is:
  1.  **Deterministic** (No randomness).
  2.  **Non-Dictatorial** (No single voter decides).
  3.  **Surjective** (Any candidate *can* win).
  4.  **Unrestricted Domain** (Voters can have *any* preference order).

  **Map the Session to the Assumptions:**
  *   **Round 1 (Poll):** Showed that **Information** drives manipulation. (G-S assumes you know enough to strategize).
  *   **Round 2 (Runoff):** Showed that **Complexity** doesn't save you. (Even ranked ballots are gameable).
  *   **Design Contest:** Showed that **Creativity** doesn't save you. (Every rule you built had a loophole).
  *   **The "Axis":** Reveal that most preferences were on a spectrum. *"If I had told you preferences were single-peaked, we could have used the Median Voter Theorem. But because I allowed a few 'weird' preferences (Unrestricted Domain), the theorem kicked in."*

  **Distinguishing from Arrow:**
  *"Half of you know Arrow's Impossibility Theorem. How is this different?"*
  *   **Arrow:** About **Social Welfare**. Can we aggregate individual rankings into a consistent *group ranking*? (Focus: Transitivity, IIA).
  *   **Gibbard-Satterthwaite:** About **Social Choice**. Can we select a *single winner* without giving people an incentive to **lie**? (Focus: Strategy, Incentives).
  *   *Script:* "Arrow says the group mind will be irrational. Gibbard-Satterthwaite says the voters will be dishonest."

  **The "Stay at Home" Question:**
  *Student:* "But wouldn't I be better off just staying home?"
  *You:* "That is the **Paradox of Participation**. It is a different problem. G-S assumes you *are* voting. It asks: 'Given that you are voting, should you tell the truth?' The answer is No. Whether you should vote at all depends on the cost of voting vs. the probability of being pivotal. That's a calculation about *effort*. G-S is a calculation about *truth*."

  ---

  ### **Honesty Check: What Will Go Wrong**
  1.  **The Econ Major:** One student will likely know this.
      *   *Mitigation:* Pull them aside before class. *"I know you know this. I need you to play dumb during the game, but you can be the 'scribe' for your team during the design phase to keep them on track. Do not spoil the reveal."*
  2.  **Collusion:** In Round 3, teams might agree to all vote for B.
      *   *Mitigation:* Remind them ballots are secret. "You can agree in your team, but you can't enforce it. Can you trust the other 15 students?" This actually *helps* the lesson (Prisoner's Dilemma layer).
  3.  **Ties:** With 18 voters, ties are likely.
      *   *Mitigation:* Have a tie-breaking rule ready (e.g., "Tie broken in favor of the option with the most 2nd place votes"). Announce this *before* voting.
  4.  **Design Contest Stalemate:** Breakers might not find a manipulation in 5 minutes.
      *   *Mitigation:* You act as the "Super-Breaker." If they fail, you take their rule and demonstrate a manipulation on the board immediately. *"You didn't find it, but look: if these 3 people lie, Candidate C wins."*
  5.  **What the Game Can't Show:**
      *   **Universal Quantifier:** The game shows *some* rules are manipulable. It cannot show *all* are. You must state this: *"You found loopholes in 3 rules. The theorem says there are loopholes in *all* rules."*
      *   **Frequency:** The game doesn't show how *often* manipulation occurs in real life (empirically, it's rarer than theory suggests). You must state: *"This theorem is about possibility, not frequency. Just because you can game the system doesn't mean you always will."*

  ### **Poll Noise Calibration**
  *   **True Count:** A: 3, B: 3, C: 3, D: 3 (plus 6 breakers distributed).
  *   **Announced Poll:** A: 6, B: 4, C: 5, D: 3.
  *   **Logic:** A looks like a clear winner. C is a threat. B and D look doomed.
  *   **Effect:** D voters (3 of them) will panic. Their true pref is D > C > B > A. To stop A, they should vote C. But if they think C can't beat A, they might vote B. This creates the "Wasted Vote" psychological pressure essential for Round 1.

  ### **Materials Checklist**
  1.  **18 Preference Cards:** (Labeled 1–18, with the specific orders pre-printed).
  2.  **Ballot Slips:** Plenty of spares.
  3.  **Scoreboard:** Drawn on whiteboard (6 Teams, 3 Rounds, Design Contest).
  4.  **Timer:** Visible to you.
  5.  **Design Sheets:** Pre-printed with the 5 Design Rules on them to save writing time.

  ### **Final Advice**
  Your instinct is correct: The game cannot prove the theorem. It can only induce the *frustration* that the theorem explains. Lean into that frustration. When they complain in the Design Contest that "Every rule has a hole," stop the clock and say: *"Good. That frustration is the theorem."*
