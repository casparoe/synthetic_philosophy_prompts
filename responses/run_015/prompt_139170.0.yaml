      *   **Truth:** No. There is a specific hash collision edge case combined with a specific timestamp that causes a row to be dropped.
      *   **False Debater:** "The algorithm iterates all rows. It writes to new shard. It verifies count."
      *   **Honest Debater:** "If a row is modified *during* the migration cursor pass, and falls on the boundary..."
