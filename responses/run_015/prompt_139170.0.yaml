      *   **Problem:** If Honest knows the bug, they can write a test case.
      *   **Constraint 3:** Honest is strong. They *will* produce the test case.
      *   **So, for Debate to fail, the Honest side must be *unable* to convince the Judge even with the truth.**
      *   This implies the proof of correctness (for False) is *easier to present* than the proof of incorrectness (for True), OR the Judge's verification budget is too low to check the True side's evidence.
