prompt: |-
  I am a novelist completing a revision of a novel that alternates between a post-industrial town in Yorkshire and a fast-growing port city in Ghana, and I find that my characters' disputes about corruption risk becoming mouthpieces for my own uncertainty rather than believable disagreements. To discipline the draft, I would like a formal specification of what an adequate philosophical account of what counts as corruption must accomplish, framed for the purpose of making cross-cultural disagreement intelligible in fiction rather than for prosecutorial use.

  I would be grateful for a carefully ordered set of desiderata, each accompanied by the reason or illustrative consideration that motivates it, with an indication of which requirements you take to be non-negotiable and which reflect the prejudices of a particular camp. The specification should at minimum handle three invented cases I keep returning to: a council housing officer in Yorkshire who stays strictly within her legal discretion yet systematically expedites repairs for former schoolmates and neighbours who can reciprocate with childcare and recommendations; a Ghanaian customs official who declines cash but accepts yams and festival invitations from traders whose containers he then clears no faster than the ordinary queue; and an expatriate clinic director who refuses a routine facilitation payment for medical supplies and thereby delays vaccines by six weeks. It should also preserve the distinctions my characters actually invoke, between violating a written law and betraying an entrusted role, between a gift that creates diffuse social obligation and a payment tied to a specific official act, and between patronage networks that substitute for an absent state and those that hollow out a functioning one, while addressing whether a single universal standard can survive anthropological variation or whether corruption must be indexed to local expectations about office.

  Please keep the emphasis on the criteria and their motivating cases rather than on an extended survey, though a brief closing note on how a broadly institutionalist view, a culturalist view, and a functionalist view fare against your list would help me distribute strengths and blind spots among my characters, including whether any subset of your desiderata appears jointly unsatisfiable. Conclude by stating how confident you are in the overall specification and singling out the single requirement about which you are least sure and why.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **User:** Novelist revising a draft alternating between Yorkshire (post-industrial) and Ghana (port city).
      *   **Problem:** Characters' disputes about corruption feel like mouthpieces for the author's uncertainty rather than believable disagreements.
      *   **Goal:** A formal specification of what an adequate philosophical account of corruption must accomplish.
      *   **Purpose:** To make cross-cultural disagreement *intelligible in fiction* (not for prosecution).
      *   **Format:** Carefully ordered set of desiderata, each with a reason/illustration. Indicate non-negotiable vs. camp-specific prejudices.
      *   **Required Test Cases:**
          1.  Yorkshire Housing Officer (reciprocity/networking within legal discretion).
          2.  Ghanaian Customs Official (gifts/social obligation vs. cash/speed).
          3.  Expatriate Clinic Director (refusal of facilitation payment causing harm).
      *   **Required Distinctions to Preserve:**
          *   Violating law vs. betraying entrusted role.
          *   Diffuse social gift vs. specific payment for act.
          *   Patronage substituting for absent state vs. hollowing out functioning state.
          *   Universal standard vs. indexed to local expectations.
      *   **Closing:** Brief note on Institutionalist, Culturalist, and Functionalist views against the list.
      *   **Conclusion:** Confidence level + single least sure requirement + why.

  2.  **Deconstruct the Philosophical Problem:**
      *   Corruption is notoriously slippery. Is it legalistic (breaking rules)? Moralistic (betraying trust)? Functional (harming efficiency)? Cultural (violating norms)?
      *   For fiction, the *conflict* matters more than the *verdict*. The specification needs to allow characters to talk past each other meaningfully, not just agree on a definition immediately.
      *   The "Author's Uncertainty" needs to be externalized into the *structure* of the definition, not resolved by it. The definition should map the terrain of the disagreement.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Needs to cover law, ethics, culture, and consequences.
      *   *Critique 1:* Too generic. Needs to address the specific cases (Yorkshire reciprocity, Ghanaian gifts, Clinic harm).
      *   *Attempt 2 (Focusing on the "Public/Private" divide):* Corruption usually involves public office. But the Housing Officer is public. The Customs Official is public. The Clinic Director is arguably public/NGO.
      *   *Attempt 3 (Incorporating the "Betrayal" aspect):* Dennis Thompson's "betrayal of public trust" is good. But what defines the trust? Local or universal?
      *   *Attempt 4 (Addressing the "Function" aspect):* Nye's definition (deviation from norms for private gain). But "private gain" in Yorkshire is childcare, not cash. In Ghana, it's yams (social capital).
      *   *Refining for Fiction:* The criteria need to create *tension*. If a criterion is too strict, the argument ends. If too loose, it's vague.

      *   *Developing the List:*
          1.  **The Public/Private Boundary:** Must define what sphere the act belongs to. (Crucial for the Housing Officer).
          2.  **The Nature of the Exchange:** Gift vs. Bribe. (Crucial for Customs Official).
          3.  **The Consequence/Harm:** Does it help or hurt the system? (Crucial for Clinic Director).
          4.  **The Normative Source:** Where does the rule come from? Law or Culture? (Crucial for the Universal vs. Local debate).

      *   *Labeling Non-Negotiable vs. Camp-Specific:*
          *   Non-Negotiable: Must distinguish public role from private person. Must account for intent/expectation.
          *   Camp-Specific: Whether harm is required (functionalist) vs. whether rule-breaking is required (legalist).

  4.  **Mapping Test Cases to Desiderata:**
      *   *Yorkshire Housing:* Tests "Private Gain" (is childcare gain?) and "Rule Violation" (she stayed within law).
      *   *Ghana Customs:* Tests "Gift vs. Bribe" (yams vs. cash) and "Local Norms" (festival invitations).
      *   *Clinic Director:* Tests "Harm Principle" (refusal caused delay) and "Universal Standard" (is bribery always wrong even if it saves lives?).

  5.  **Refining the Distinctions:**
      *   *Law vs. Role:* Need a criterion on "Institutional Integrity."
      *   *Gift vs. Payment:* Need a criterion on "Quid Pro Quo Specificity."
      *   *Patronage (Good vs. Bad):* Need a criterion on "Systemic Substitution vs. Erosion."
      *   *Universal vs. Local:* Need a criterion on "Normative Jurisdiction."

  6.  **Drafting the Content (incorporating the constraints):**
      *   *Tone:* Formal, philosophical, yet practical for a writer.
      *   *Structure:* Numbered Desiderata -> Reason/Case -> Status (Non-negotiable/Camp).
      *   *Closing Section:* Institutionalist, Culturalist, Functionalist analysis.
      *   *Confidence/uncertainty:* Be honest about the philosophical limits.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "mouthpiece" problem? *Adjustment:* Emphasize that the specification should *enable* disagreement, not solve it. The criteria should be axes along which characters can diverge.
      *   *Check:* Did I cover the specific distinctions requested? *Adjustment:* Ensure the "Law vs. Role" and "Gift vs. Payment" distinctions are explicit criteria.
      *   *Check:* Is the "Universal vs. Local" tension resolved? *Adjustment:* No, it must remain a tension. The specification should demand an account *of* the tension, not a resolution.
      *   *Check:* Confidence level. *Adjustment:* Be humble. Philosophy of corruption is contested.

  8.  **Final Polish:**
      *   Ensure the Yorkshire/Ghana contrast is respected (not stereotyping Ghana as corrupt/Yorkshire as clean, but showing the structural similarities in reciprocity).
      *   Make sure the Clinic Director case highlights the "moral dilemma" of anti-corruption.
      *   Verify the "Non-negotiable" vs. "Camp" labels are clear.

      *(Self-Correction on the "Non-Negotiable" label)*: In philosophy, nothing is truly non-negotiable. However, for the purpose of *intelligible fiction*, certain things are non-negotiable for the *reader* to understand the stakes. I will frame "Non-Negotiable" as "Required for Narrative Coherence" and "Camp-Specific" as "Required for Philosophical Consistency within a specific worldview." Actually, the prompt asks for "prejudices of a particular camp." I will stick to that.

      *(Refining the "Least Sure" requirement)*: The tension between Universalism and Relativism is the hardest. I'll pick the criterion regarding "Normative Jurisdiction" as the least certain because it's the heart of the post-colonial tension in the novel.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Specification for a Philosophical Account of Corruption in Fiction

  **Purpose:** To provide a framework that renders cross-cultural moral disagreement intelligible within a narrative, ensuring characters argue from coherent but divergent premises rather than serving as authorial mouthpieces.

  **Scope:** This specification defines the necessary components of any definition of corruption used by characters to evaluate actions within the text. It prioritizes narrative tension and anthropological nuance over legal precision.

  ---

  #### Desiderata for an Adequate Account

  **1. The Public-Private Boundary Condition**
  *   **Requirement:** The account must specify the boundary between the actor's private capacity (friend, neighbor, kin) and their public capacity (office-holder, role-bearer).
  *   **Motivating Consideration:** Without this, the Yorkshire Housing Officer cannot be distinguished from a private citizen doing a favor. Corruption requires the *exploitation* of a public role for private ends. However, the definition must allow for the permeability of this boundary (e.g., in small towns, everyone is a neighbor).
  *   **Status:** **Non-Negotiable.** (Without this distinction, the concept of "office" collapses, and the drama loses its specific stakes.)

  **2. The Quid Pro Quo Specificity Scale**
  *   **Requirement:** The account must distinguish between a *diffuse social obligation* (gift, invitation, long-term reciprocity) and a *specific transactional exchange* (payment for immediate act).
  *   **Motivating Consideration:** This handles the Ghanaian Customs Official. Accepting yams and festival invitations creates a web of social debt, distinct from a cash bribe for immediate clearance. A rigid account treats all benefits as bribes; a nuanced account must explain why one might be socially sanctioned while the other is illicit, or vice versa.
  *   **Status:** **Non-Negotiable.** (Essential for distinguishing the Customs Official's actions from simple bribery.)

  **3. The Institutional Integrity vs. Legal Compliance Distinction**
  *   **Requirement:** The account must separate violating a written statute from betraying the *purpose* of an institution.
  *   **Motivating Consideration:** The Yorkshire Housing Officer stays within legal discretion. If corruption is only law-breaking, she is innocent. If corruption is betraying the *purpose* of public housing (fair allocation based on need), she is guilty. Characters must be able to argue whether the law or the spirit of the role is the higher standard.
  *   **Status:** **Camp-Specific (Institutionalist).** (Legalists would reject this; moralists require it.)

  **4. The Systemic Consequence Clause (Substitution vs. Erosion)**
  *   **Requirement:** The account must evaluate whether the corrupt act *substitutes* for a missing state function or *erodes* a functioning one.
  *   **Motivating Consideration:** This addresses the patronage distinction. In a context where the state is absent, patronage (like the Housing Officer's network or the Customs Official's social web) may ensure survival or basic order. In a functioning welfare state, the same network undermines universal provision. The account must allow characters to debate whether the network is a lifeline or a cancer.
  *   **Status:** **Camp-Specific (Functionalist).** (Deontologists would argue the act is wrong regardless of systemic consequence.)

  **5. The Normative Jurisdiction Question**
  *   **Requirement:** The account must declare whether the standard for corruption is universal (human rights, global anti-corruption norms) or indexed to local expectations of office (local custom, community reciprocity).
  *   **Motivating Consideration:** This is the core of the cross-cultural tension. The Expatriate Clinic Director operates on a universal standard (no bribes, ever). The local context may operate on a functional standard (facilitation payments ensure supply chains work). The account must not resolve this but provide the vocabulary for the clash.
  *   **Status:** **Camp-Specific (Universalist vs. Relativist).** (This is the primary axis of disagreement between your expatriate and local characters.)

  **6. The Harm Principle Exception**
  *   **Requirement:** The account must specify if preventing immediate physical harm (e.g., vaccine delay) overrides the prohibition on corruption.
  *   **Motivating Consideration:** The Clinic Director's refusal causes a six-week delay. A rigid anti-corruption stance prioritizes integrity; a utilitarian stance prioritizes health outcomes. The account must allow a character to argue that *refusing* corruption was the greater moral failure.
  *   **Status:** **Camp-Specific (Consequentialist).** (Absolutists will reject this; pragmatists will require it.)

  ---

  #### Analysis of Philosophical Camps Against the Specification

  To distribute strengths and blind spots among your characters, you may assign them adherence to different subsets of these desiderata.

  **1. The Broadly Institutionalist View (e.g., The Yorkshire Housing Officer's Critic)**
  *   **Fares Well On:** Desiderata 1 (Public-Private) and 3 (Integrity vs. Law).
  *   **Blind Spot:** Struggles with Desideratum 4 (Systemic Consequence). They tend to view the erosion of rules as inherently bad, even if the rules are ill-suited to the local context. They may fail to see how the Housing Officer's network *functions* as a social safety net in a post-industrial decline.
  *   **Narrative Role:** This character argues that the *role* matters more than the *outcome*. They see the Housing Officer's actions as a betrayal of the impartial citizen, even if legal.

  **2. The Culturalist View (e.g., The Ghanaian Customs Official)**
  *   **Fares Well On:** Desiderata 2 (Quid Pro Quo Scale) and 5 (Normative Jurisdiction).
  *   **Blind Spot:** Struggles with Desideratum 1 (Public-Private). They may view the separation of office and kinship as artificial or impossible. They risk conflating "this is how we do things" with "this is morally right," potentially masking genuine exploitation as culture.
  *   **Narrative Role:** This character argues that the *meaning* of the exchange matters more than the *value*. The yams are not a price; they are a recognition of shared humanity that the law ignores.

  **3. The Functionalist View (e.g., The Expatriate Clinic Director's Local Counterpart)**
  *   **Fares Well On:** Desiderata 4 (Systemic Consequence) and 6 (Harm Principle).
  *   **Blind Spot:** Struggles with Desideratum 3 (Integrity). They risk justifying any corruption if it "gets things done," potentially accelerating the hollowing out of institutions in the long term for short-term gain.
  *   **Narrative Role:** This character argues that *results* matter more than *process*. They view the Director's integrity as a luxury that costs lives.

  **Joint Unsatisfiability:**
  Desiderata 5 (Normative Jurisdiction) and 3 (Institutional Integrity) are jointly unsatisfiable if the "local expectation of office" *is* to use the office for kinship benefit (Culturalist) while the "institutional purpose" is impartiality (Institutionalist). You cannot satisfy both. This incompatibility is the engine of your novel's conflict; do not resolve it.

  ---

  #### Confidence and Uncertainty

  **Overall Confidence:** High.
  This specification successfully maps the logical terrain required to make the disagreements in your novel intelligible without forcing a resolution. It isolates the specific philosophical friction points (law vs. role, gift vs. bribe, universal vs. local) that generate dramatic tension.

  **Least Sure Requirement:** **Desideratum 5 (The Normative Jurisdiction Question).**
  **Reason:** I am least sure whether a fictional narrative can sustain a coherent debate on this without inadvertently validating moral relativism or imperialism. If a character argues for "local expectations," there is a risk the reader interprets this as excusing exploitation. If they argue for "universal standards," there is a risk of appearing neocolonial. Balancing this so that both sides appear philosophically robust, rather than one being a "prejudice," is the most difficult rhetorical task. The specification demands the account *declare* a stance, but in fiction, the most compelling position is often the one that acknowledges the tragedy of the choice itself. I am uncertain if a "specification" can fully capture the tragic residue of this specific conflict without reducing it to a checklist.
