answer: |-
  # Architectural Desiderata for a Moral-Psychological Account of Free Will

  To construct an account of free will adequate for moral psychology rather than metaphysics, we must shift the focus from *causal origination* (how the action began in the universe) to *agential ownership* (how the action belongs to the person). The following desiderata outline the functional requirements for such a theory.

  ### I. The Desiderata List

  **1. Executive Sourcehood (Local Control)**
  *   **Requirement:** The theory must locate the source of action within the agent's current cognitive architecture, distinguishing actions generated by the agent's processing systems from those generated by external manipulation or physiological reflex.
  *   **Motivating Distinction:** Raising a hand to vote vs. a reflexive spasm. Without this, moral praise/blame attaches to events, not agents.
  *   **Status:** **Non-Negotiable.** Moral psychology collapses if agents are not the immediate loci of action.

  **2. Diachronic Narrative Coherence (Identity Continuity)**
  *   **Requirement:** The agent must be able to recognize their past actions as expressions of a self that persists into the present, allowing for retrospective endorsement or repudiation.
  *   **Motivating Distinction:** Feeling guilt for a promise broken five years ago vs. feeling alienated from the actions of a past self (e.g., "I was a different person then").
  *   **Status:** **Non-Negotiable.** Responsibility requires a temporal thread connecting the blamer and the blamed.

  **3. Accommodation of Gradual Value Drift**
  *   **Requirement:** The theory must permit an agent to change priorities over time without treating the earlier self as unfree or the later self as a betrayer, provided the shift occurs through intelligible processes of experience and reflection.
  *   **Motivating Case:** A lawyer who gradually prioritizes family over career. She does not disown her past ambition, nor does she feel wholly bound by it.
  *   **Status:** **Non-Negotiable.** Moral growth and character development are central to moral psychology; a static theory cannot account for learning.

  **4. Accommodation of Sudden Value Rupture**
  *   **Requirement:** The theory must account for radical discontinuities (trauma, conversion, brain injury) without automatically absolving the agent of all responsibility or treating the new self as a totally distinct entity. It must allow for *graded* agency.
  *   **Motivating Case:** A soldier returns with PTSD and acts violently. We intuitively mitigate responsibility without treating them as a non-agent (like a storm or a rock).
  *   **Status:** **Non-Negotiable.** Moral psychology must handle breakdown and transformation without resorting to binary "free/unfree" switches.

  **5. Distinction Between Internal Compulsion and External Coercion**
  *   **Requirement:** The theory must distinguish constraints that bypass the will (addiction, psychosis) from constraints that engage the will under threat (duress, coercion).
  *   **Motivating Distinction:** An addict taking drugs vs. a victim handing over a wallet at gunpoint. Both are constrained, but the moral/psychological texture of the violation differs.
  *   **Status:** **Non-Negotiable.** Legal and interpersonal practices rely on this distinction to assign mitigation vs. excuse.

  **6. Consistency with Empirical Findings (Post-Hoc Rationalization)**
  *   **Requirement:** The account cannot rely on conscious deliberation as the *causal trigger* of action, given evidence that reasons often follow actions. It must locate freedom in *integration, monitoring, or veto* rather than initiation.
  *   **Motivating Case:** Libet-style experiments and cognitive dissonance research suggest we often act then explain. A theory requiring conscious initiation is empirically falsified.
  *   **Status:** **Non-Negotiable** (for naturalistic accounts). Metaphysical accounts may ignore this; moral psychology cannot.

  **7. Ultimate Origination (The "Prime Mover" Condition)**
  *   **Requirement:** The agent must be the *uncaused cause* of their will, standing outside the chain of prior physical and psychological determinants.
  *   **Motivating Case:** The intuition that to be truly free, one must have created one's own character.
  *   **Status:** **Partisan (Incompatibilist).** This is a metaphysical demand, not a moral-psychological one. Moral psychology only requires *ownership*, not *creation ex nihilo*. Demanding this renders the theory incompatible with naturalism.

  ---

  ### II. The Unsatisfiable Subset: Coherence vs. Revision

  There is a structural tension between **Desideratum 2 (Diachronic Narrative Coherence)** and a strong interpretation of **Desideratum 1 (Executive Sourcehood)** when combined with **Desideratum 3 (Value Drift)**.

  **The Conflict:**
  If an agent possesses *open-ended executive revision* (the capacity to radically rewrite their values at any moment without prior determination), *diachronic narrative coherence* becomes impossible. A self that can rupture its own continuity at will lacks the stable identity required to claim past actions as "mine." Conversely, if *narrative coherence* is maximized (the past fully explains the present), *executive revision* is merely the unfolding of prior states, not genuine revision.

  **Verdict:**
  **Full Narrative Coherence and Open-Ended Executive Revision are jointly unsatisfiable.**
  A viable theory must treat coherence as a *constructive achievement* rather than a metaphysical precondition. The agent constructs coherence retrospectively. Therefore, the theory must prioritize *capacities for integration* over *actual continuity*. We are free not because our story hangs together perfectly, but because we possess the machinery to attempt to make it hang together, even when it fails (rupture).

  ---

  ### III. Evaluation of Standard Accounts

  **1. Standard Compatibilism (e.g., Hume, Moore)**
  *   **Performance:** Strong on **Desideratum 5 (Coercion/Compulsion)** and **Desideratum 1 (Sourcehood)** defined as responsiveness to reasons.
  *   **Failure:** Struggles with **Desideratum 4 (Rupture)**. It tends to treat trauma-induced change as just another causal chain, failing to capture the *qualitative break* in agency that moral psychology recognizes. It often assumes a stability of character that **Desideratum 6 (Empirical Findings)** undermines.
  *   **Verdict:** Adequate for legal liability, insufficient for deep moral psychology.

  **2. Hierarchical Accounts (e.g., Frankfurt, Watson)**
  *   **Performance:** Excellent on **Desideratum 1 (Sourcehood)** via higher-order endorsement. Distinguishes internal compulsion well (**Desideratum 5**).
  *   **Failure:** Vulnerable to the **Unsatisfiable Subset**. If freedom requires alignment between first and second-order desires, **Desideratum 3 (Drift)** becomes problematic (which order is the 'real' me during transition?). It also struggles with **Desideratum 6**, as it posits a level of conscious hierarchical structuring that empirical psychology suggests is often post-hoc.
  *   **Verdict:** Captures the *feeling* of autonomy but relies on a psychological architecture that may not exist.

  **3. Revisionist/Naturalistic Accounts (e.g., Dennett, Vargas)**
  *   **Performance:** Best fit for **Desideratum 6 (Empirical Consistency)** and **Desideratum 7 (Rejects Ultimate Origination)**. They treat free will as a social technology or capacity for control, accommodating **Desideratum 4 (Rupture)** by viewing agency as a matter of degree.
  *   **Failure:** Often accused of changing the subject regarding **Desideratum 2 (Coherence)**. By making freedom a matter of social status or capacity, they risk weakening the *internal* sense of ownership required for guilt and pride. They solve the metaphysical problem but may leave the phenomenological need for "deep responsibility" unmet.
  *   **Verdict:** Most robust for a naturalistic moral psychology, provided it can recover a thick enough sense of **Desideratum 2** without smuggling in metaphysics.

  ### IV. Architectural Conclusion

  An adequate account for moral psychology must abandon the search for *Ultimate Origination* (Desideratum 7) as a partisan metaphysical luxury. It must instead model agency as a **dynamic control system** that manages the tension between *stability* (Narrative Coherence) and *plasticity* (Executive Revision).

  The theory must define freedom not as the absence of causes, but as the **capacity for self-governance within a causal history**. This allows for value drift and rupture to be treated as *modulations of capacity* rather than binary switches of freedom. The unsatisfiability of perfect coherence and radical revision is resolved by accepting that moral agency is a *practice of integration* that sometimes fails, rather than a metaphysical state that either obtains or does not.
