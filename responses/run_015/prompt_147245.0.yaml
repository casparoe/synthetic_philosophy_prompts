  2.  **Deconstruct the Core Argument (Normative Authorship):**

      *   *Standard View:* Consent is invalid if X (lies), Y (threats), or Z (incapacity) are present. These are distinct buckets.
      *   *Problem:* In institutional settings, you often have no lies (full disclosure), no overt threats (you can walk away, theoretically), and capacity is presumed. Yet, consent feels hollow because the *rules of the game* were imposed without the agent's input.
      *   *Proposed Solution:* "Normative Authorship." Valid consent requires the agent to endorse the *structure* of the choice, not just the specific option selected.
      *   *Challenge:* If we require authorship of the framework, does *any* institutional consent become impossible? (Need to avoid collapsing distinctions).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic but clear. *Normative Authorship and the Architecture of Consent.*
      *   **Research Question:** Needs to highlight the tension between the tripartite view (deception/coercion/incompetence) and the unified deficit view (lack of authorship).
      *   **The Problem with the Standard View:** Why is treating them separately insufficient for institutional contexts? Because institutional power operates structurally, not just transactionally. A take-it-or-leave-it contract isn't necessarily coercive in the traditional sense, nor deceptive, nor does it target the incompetent, yet it undermines agency.
