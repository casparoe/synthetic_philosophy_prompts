prompt: |-
  I am preparing a six-month fellowship proposal on the philosophical conditions for valid consent, specifically whether deception, coercion, and incompetence should be understood as independent vitiating conditions or as manifestations of a single underlying deficit. My tentative framing introduces a concept I am calling normative authorship—the idea that a consenting party must not merely understand and freely accept the terms of agreement, but must in some sense be the authoritative source of the normative framework within which those terms are presented. This seems especially relevant to institutional consent settings—standardized clinical trial protocols, data-use agreements, or financial disclosure forms—where the framework itself is non-negotiable and pre-structured. I need the proposal to include: a precise statement of the research question and why treating deception, coercion, and incompetence as separate failures leaves institutional cases poorly explained; the philosophical method I will employ (conceptual analysis of hard cases, comparison with legal doctrine on informed consent, and evaluation of whether a unified normative-authorship account can be made coherent without collapsing important distinctions); a month-by-month work plan appropriate to six months; what a concrete deliverable would look like for practitioners designing consent processes—such as institutional review boards or policy drafters—rather than only for academic philosophers; what result would count as the project failing; and a brief justification for why a foundation should fund philosophical rather than empirical or legal research on this question. Please do not include a bibliography or citation list; I will supply those myself. Keep the proposal realistic in scope and avoid relying on empirical data collection.
