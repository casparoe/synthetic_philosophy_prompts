answer: |-
  **Project Title:** The Informational Structure of Reflection: A Taxonomy of Diachronic Deference
  **Duration:** 12 Weeks (Summer Fellowship)
  **Applicant:** [Your Name]

  **The Question**
  Van Fraassen's Reflection Principle says your current credence in A, conditional on your future credence in A being *x*, should be *x*. It sounds right until it doesn't. It breaks in cases of memory loss, conceptual change, or fission. The standard move is to patch the principle: restrict it to non-self-locating propositions, swap it for Conditionalization, or go imprecise.

  This project asks a tighter question: **Is Reflection a scalar norm sensitive to the degree of informational overlap between time-slices, or is it a binary norm that switches off entirely at specific structural breaks?**

  Existing debates treat counterexamples as boundary markers. I want to treat them as data points for a underlying variable: the informational relation between the earlier and later agent. Sometimes later-you knows strictly more (clean learning). Sometimes strictly less (forgetting). Sometimes the relation is sideways (conceptual change) or split (fission). If Reflection is fundamentally about deference to a future expert, the weight of that deference should track the informational relation.

  The project aims to determine if there is a principled weighting function for Reflection based on these relations. The "success" condition is actually disjunctive: either I derive a principled weighting scheme (Reflection is scalar), or I prove that no such scheme exists without being ad hoc (Reflection is binary/restricted). Both outcomes clarify the norm. The latter is likely the honest answer, but demonstrating *why* the weighting fails is the actual work.

  **The Gap**
  Why not just use the standard fixes? Because they diagnose the symptom, not the cause.

  1.  **Dutch Book/Coherence:** These arguments assume a specific diachronic structure (usually monotonic information growth). They show *that* you lose money if you violate Reflection in forgetting cases, but they don't explain *why* the norm shouldn't apply there. They treat the violation as a mistake rather than a feature of the informational relation.
  2.  **Expert Deference:** This motivates Reflection by saying future-you is an expert. But "expert" is doing too much work. In forgetting cases, future-you is an anti-expert. In conceptual change, future-you is speaking a different language. The standard view just says "Reflection doesn't apply here." My project asks if there's a middle ground where it applies *partially*.
  3.  **Restrictions:** Simply restricting Reflection to "non-self-locating" or "no-forgetting" contexts is taxonomically lazy. It lumps distinct informational failures (memory loss vs. fission) into one "exception" bucket. We need a taxonomy of the relations themselves to know where the restriction actually falls.

  Existing literature adds test cases (Sleeping Beauty, Arntzenius's shangri-la, etc.). I'm not adding more cases. I'm systematizing the relation between the stages in those cases to see if the principle bends or breaks.

  **The Approach**
  I'm not building a formal model from scratch; I'm doing conceptual analysis with formal constraints. The angle is to treat the informational relation as the independent variable.

  1.  **Define the Relations:** I'll categorize stage-relations by evidence set inclusion (subset, superset, overlap, disjoint) and identity conditions (single successor, multiple successors).
  2.  **Test the Weight:** For each relation, I'll test if a weighted Reflection principle ($C_t(A | C_{t'}(A)=x) = w \cdot x$) holds, where *w* represents the informational overlap.
  3.  **Check for Ad Hocery:** If *w* varies case-by-case without a unifying rule, the weighting is ad hoc. This supports the binary view. If *w* tracks a measurable feature (e.g., conditional independence), the scalar view holds.

  This gets you more than just more counterexamples because it shifts the burden from "finding a case where Reflection fails" to "defining the space where Reflection lives."

  **Timeline (15 hrs/week)**
  *   **Month 1: Taxonomy & Mapping.** I'll map the logical space of informational relations. I'll write up the standard cases (Sleeping Beauty, forgetting, fission) not as problems, but as instances of specific relations. Deliverable: A structured table of relations vs. standard verdicts.
  *   **Month 2: The Weighting Test.** I'll attempt to construct the weighting function. I'll test if *w* can be derived from the taxonomy without referencing the verdicts we already want. This is the core philosophical work. I'll draft the central argument section here.
  *   **Month 3: Synthesis & Drafting.** I'll finalize the verdict (scalar vs. binary). I'll write the introduction and conclusion, ensuring the "negative result" (if it comes to that) is framed as a clarification of the norm's scope. Final polish and citation slotting.

  **Deliverables**
  1.  **A Draft Paper:** ~6,000 words, ready for submission to a journal like *Episteme* or *Analysis*.
  2.  **A Taxonomy Table:** A visual aid mapping informational relations to Reflection's validity. This stands alone as a useful tool for future work on diachronic norms.
  3.  **Worked Cases:** Two or three detailed applications (e.g., a forgetting case and a fission case) showing how the taxonomy handles them better than standard restrictions.

  This is tight but feasible. The taxonomy is the heavy lift, but once that's done, the argument writes itself.

  **Risk & Failure**
  Here's the honest assessment of where this could waste time.

  *   **Genuine Negative Result:** If I prove that any weighting function *must* be ad hoc, that is a success. It means Reflection is all-or-nothing, and we stop looking for a middle ground. That's a paper.
  *   **Boring Negative Result:** If the taxonomy turns out to be just a restatement of existing restrictions (e.g., "Relation Type 1" is just "No Forgetting" renamed), then I haven't added value. I need to ensure the taxonomy cuts across existing categories.
  *   **Scope Creep:** The biggest risk is getting bogged down in the metaphysics of personal identity during the fission cases. I need to treat identity as a parameter of the informational relation, not solve identity itself. If I find myself arguing about what makes a future stage "me," I need to cut that and stipulate the relation instead.
  *   **Formalism Trap:** I'm not a logician. If I spend Month 2 trying to derive a precise formula for *w* and get stuck, the project stalls. The fallback is to argue qualitatively about the principled nature of the weight. The deliverable is the philosophical argument, not the equation.

  If the weighting idea collapses immediately (within the first 3 weeks), I will pivot to defending the binary view using the taxonomy as the justification for the restriction. That preserves the core insight—that the informational relation drives the norm—even if the scalar hypothesis fails.
