prompt: |-
  Next Tuesday our regional health system's Technology Assessment Committee will take a binding vote on whether to authorize routine primary-care use of an internally developed statistical tool for stroke prevention, and I need a draft decision memo I can circulate in advance as a voting member.

  The tool estimates five-year stroke risk to guide offers of a preventive regimen that modestly reduces stroke incidence but imposes burdensome side effects and monitoring costs. The dispute is not about average efficacy but about how to apply population statistics to borderline individual patients.

  For the patients most affected by the decision — for example, a 62-year-old former smoker with controlled hypertension, no prior vascular event, and a physically active lifestyle without diabetes — the choice of reference class changes the estimate dramatically: around 3 to 4 percent when the patient is grouped with all adults in their sixties with controlled hypertension, around 8 to 9 percent when grouped with former smokers in their sixties with hypertension, and around 2 percent when grouped with physically active non-diabetic adults in their sixties regardless of smoking history. Each grouping comes from a well-calibrated model, and each privileges one causally relevant similarity while discounting another. The developer proposes resolving the conflict by rule, always using the most specific grouping that contains at least two hundred prior cases in our system, while our clinical ethics consult proposes reporting the full range across medically defensible groupings and requiring a structured shared decision-making conversation before prescribing for patients whose classification is grouping-sensitive.

  One faction on the committee argues that without a principled basis for privileging one grouping, routine use would make treatment turn on an arbitrary administrative choice and undermine informed consent; the other argues that refusing to deploy until the grouping question is settled in the abstract would itself harm patients who would clearly benefit under any reasonable grouping.

  Please draft a memo of roughly 800 to 1200 words that the committee could act on. It should recommend a specific course — authorize unrestricted use, decline authorization, or authorize subject to concrete and enforceable conditions on which estimate is displayed, how variation across groupings is communicated to clinicians and patients, and what re-review or monitoring is required — together with the reasoning that supports it and a candid treatment of the strongest consideration against the recommended course. Take a definite position and defend it with reasons rather than merely surveying possible views, so that the memo commits to a bottom line we can vote on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Audience:** Regional Health System's Technology Assessment Committee (voting members).
      *   **Author:** A voting member (me).
      *   **Topic:** Authorization of an internally developed statistical tool for stroke prevention.
      *   **Core Conflict:** How to apply population statistics to borderline individual patients (Reference Class Problem). Different groupings yield vastly different risk estimates (3-4% vs. 8-9% vs. 2%).
      *   **Stakes:** Binding vote next Tuesday. Treatment has modest benefits but burdensome side effects/costs.
      *   **Proposed Solutions:**
          *   Developer: Use the most specific grouping with $N \ge 200$.
          *   Ethics Consult: Report the full range, require shared decision-making (SDM) for grouping-sensitive patients.
          *   Factions: "Arbitrary/Undermines Consent" vs. "Delay Harms Clear Beneficiaries."
      *   **Format:** Decision Memo.
      *   **Length:** 800 - 1200 words.
      *   **Requirement:** Take a definite position (Authorize, Decline, or Authorize with Conditions). Defend it. Address the strongest counter-argument candidly.

  2.  **Determine the Position:**
      *   *Option 1: Authorize Unrestricted.* Too risky. Ignores the ethical concern about arbitrary classification affecting treatment eligibility.
      *   *Option 2: Decline Authorization.* Too conservative. Delays benefit for clear cases. The tool is well-calibrated; the issue is interpretation, not validity.
      *   *Option 3: Authorize with Conditions.* This is the most balanced and actionable approach. It aligns with the Ethics Consult's suggestion but makes it enforceable. It acknowledges the uncertainty without paralyzing the system.
      *   *Decision:* Authorize subject to concrete conditions (transparency of range, SDM requirement).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening/Recommendation:** State the bottom line immediately. "Authorize with conditions."
      *   **Background/Context:** Briefly summarize the tool, the benefit/burden ratio, and the specific statistical conflict (Reference Class Problem).
      *   **Rationale for Recommendation:**
          *   Why not block it? Patients benefit.
          *   Why not unrestricted? Autonomy/Consent issues. The "arbitrary administrative choice" argument is strong.
          *   Why conditions? It bridges the gap. Transparency mitigates the arbitrariness.
      *   **Specific Conditions:**
          *   Display range, not single number.
          *   Flag "grouping-sensitive" cases.
          *   Mandate SDM documentation for those cases.
          *   Monitoring/Re-review clause.
      *   **Counter-Argument (Strongest Consideration):** The "Implementation Burden/Delay" argument. Clinicians might find it too complex, leading to alert fatigue or delayed care.
      *   **Rebuttal/Conclusion:** Reiterate that trust and consent are paramount. The burden is worth it to maintain legitimacy.

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Professional, decisive, analytical, ethical but pragmatic.
      *   *Word Count Check:* Need to ensure it lands between 800-1200 words. I'll need to expand on the reasoning and the specific mechanics of the conditions to meet this without fluff.
      *   *Key Terminology:* Reference class problem, shared decision-making, calibrated models, informed consent.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest a specific reference class.
      *   *Correction:* No, the prompt says there's no principled basis to privilege one. The solution must be transparency, not picking a winner.
      *   *Focus:* Make sure the "Conditions" are enforceable. "Require SDM" is vague. "Require documentation of risk range discussion in EHR" is enforceable.
      *   *Addressing the Counter:* The strongest counter isn't just "it's hard," it's that "delaying deployment harms the clear beneficiaries." I need to address why conditional deployment is better than waiting for a theoretical solution.

  6.  **Writing - First Pass (Mental or rough notes):**
      *   Start with the recommendation: Conditional Approval.
      *   Explain the tool: Stroke risk, 5-year, preventive regimen (burdensome).
      *   Explain the problem: 62yo smoker example. 2% vs 9%.
      *   Argument: We can't pick one class. But we can't stop the tool.
      *   Plan: Show the range. If the range crosses the treatment threshold, force a conversation.
      *   Counter: Clinicians will hate this. It slows things down.
      *   Rebuttal: Better slow and consensual than fast and arbitrary.
      *   Monitoring: Review in 12 months.

  7.  **Writing - Expanding to meet Word Count:**
      *   Elaborate on the ethical implications of the "Reference Class Problem."
      *   Detail the specific workflow changes required for the "Conditions."
      *   Flesh out the monitoring plan (what metrics?).
      *   Ensure the counter-argument gets a robust paragraph.

  8.  **Final Review against Constraints:**
      *   800-1200 words? (Will check during final polish).
      *   Definite position? Yes (Conditional Authorization).
      *   Candid treatment of counter-argument? Yes.
      *   Memo format? Yes.

  **(Self-Correction on Word Count during drafting):** I need to be careful not to be too verbose in the header, but ensure the body is substantial. I will expand on the *mechanics* of the shared decision-making requirement to ensure it sounds like a policy, not just a suggestion. I will also elaborate on the "harm of delay" argument in the counter-section to give it weight.

  9.  **Final Polish:** Check flow, clarity, and tone. Ensure the "bottom line" is unmistakable. (Proceeding to generate output).

  *(Word Count Check Strategy)*: I will write the content and then verify. If it's too short, I will expand on the specific metrics for the monitoring phase. If too long, I will trim the background summary.

