answer: |-
  Good morning. It is a privilege to stand in a room that was once dedicated to the quiet accumulation of knowledge, now repurposed for the noisy work of understanding why we hold one another to our word. I am a novelist. For twelve years, I have charted the geography of obligations that refuse to die. I write about the inheritances of duty signed by strangers, the verbal commitments made in dead languages, and the institutional promises that outlast the buildings in which they were spoken.

  You, however, are the architects of the machinery that makes those obligations real in the first place. Half of you map the normative structures of action; the other half negotiate the breach and the remedy when those structures collapse. You know the standard terrain well enough to finish one another's sentences. You know the arguments that ground binding force in the expectation of the promisee, or in the reliance incurred, or in the social utility of keeping faith. I will not rehearse them. To do so would be to bring water to this library.

  Instead, I want to offer you a lens I have developed in my work, a conceptual framework I call "promissory residue."

  The prevailing wisdom suggests that a promise binds because it creates a future expectation. It is a bridge thrown across time. If the bridge holds, the promise is kept. If the bridge collapses, the promise is broken, and we move to damages, or apology, or dissolution. The binding force is tied to the successful transmission of intent and the fulfillment of that intent.

  I propose something different. I suggest that a promise binds not chiefly through the expectation it creates, but through the normative remainder that persists even after the promise is broken, its conditions become impossible, or the parties forget its exact terms. This is the residue. It is the ash left after the fire has gone out. It is the claim that the very act of promising alters the moral landscape permanently, such that even failure does not return the parties to the state they occupied before the agreement. The obligation does not vanish upon breach; it mutates. It becomes a debt of accountability that exists independently of the original performance.

  Let me ground this in a specific case, one that might appear in a mediation file or a thought experiment.

  Imagine two traders from distinct linguistic traditions meeting at a border market. They wish to establish a supply line. One speaks a language where the verb for "to promise" implies a guarantee of outcome, regardless of circumstance. The other speaks a language where the same verb implies a guarantee of effort, voided by force majeure. They shake hands. They use the word. The supply line is cut by a landslide—an act of god.

  In the standard view, we might look for shared intent. We might say there was no meeting of the minds, and therefore no binding contract. We might say the expectation was frustrated.

  But look at the residue. The trader who heard "guarantee of outcome" feels a betrayal that logic cannot cure. The trader who meant "guarantee of effort" feels a responsibility that the law cannot enforce. They part ways. Years later, they meet again. The original deal is dead. The landslide is history. Yet, they cannot treat each other as strangers. There is a weight in the room between them. The one who failed owes something that is not money, and the one who was failed holds a claim that is not legal. The promise has dissolved, but the residue remains. They are bound by the history of the breach itself. The obligation survived the impossibility of its own terms.

  To the lawyers in the room: I know you deal in enforcement. You know that a clause unenforceable in court is often a ghost in the boardroom. Promissory residue explains why settlements often feel like more than mathematics. It explains why a contract terminated for convenience can still poison a business relationship for a decade. It suggests that the durability of contractual duty is not solely a function of the state's power to compel performance, but of the lingering normative stain that breach leaves on the parties. You cannot litigate the residue, but you cannot ignore it either. It is the reason why some clients refuse to settle even when the numbers make sense; they are paying for the cleanup of the residue, not just the breach.

  To the philosophers: I know you worry about the source of the binding power. Is it autonomy? Is it trust? Promissory residue suggests that the binding power is strongest not at the moment of agreement, but at the moment of rupture. It is a departure from expectation-based binding because it admits that the promisee may expect nothing, may know the performance is impossible, and yet still hold the promisor accountable. The bond is not the bridge; the bond is the scar where the bridge fell. It allows us to speak of duty without relying on the fragile architecture of shared understanding.

  I offer this framework not to solve your disputes, but to name the atmosphere in which you work. We are sitting in a converted reading room. The books are gone, but the silence remains. The function of the room has changed, but its gravity persists. So it is with promises.

  I must end with a caution. In my novels, I often write about obligations that outlive their makers. It is a romantic notion, that our words echo beyond our deaths. But promissory residue teaches us that endurance is not always a virtue. Sometimes, the residue is a poison. Sometimes, the accountability that persists is a chain that drags the next generation into a conflict they did not start. The residue does not distinguish between a sacred vow and a foolish one. It simply remains.

  We are gathered here to ask why promises bind. I suggest they bind because we are haunted by them. They leave a trace that no amount of time or litigation can fully scrub away. We are the curators of these hauntings. We must decide, in this room and in the work that follows, whether that residue is something we manage, something we honor, or something we try, however futilely, to exorcise.

  Thank you.
