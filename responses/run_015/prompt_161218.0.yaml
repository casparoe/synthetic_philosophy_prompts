  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: The novel vindicates the *User's* view on the *structure* of the harm (it is killing via constituted omission) but vindicates the *Friend's* view on the *phenomenology* of the harm (it feels like letting die to the participants). The novel suggests the distinction collapses under institutional pressure.
      *   **Addressing the Programme/Hailsham (Miss Emily & Madame):**
