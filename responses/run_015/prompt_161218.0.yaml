      *   **Key Question:** Is (iii) just (i) in disguise? Does the doing/allowing distinction do moral work, or is it a stand-in for causal responsibility/intention?
      *   **Specific Characters/Elements to Address:** Hailsham/The Programme (Miss Emily, Madame), Kathy H. (Carer), specific scenes (artworks/souls, deferral rumor, beached boat, Ruth's amends, Kathy caring for Tommy).
