      *   *IIVC (Institutional Inside-View Capture):* The Court *forces* K. into the inside view. It offers no data, only rituals. To ask for statistics is to misunderstand the "Law."
      *   *Epistemic Modesty:* Admitting "I don't know the rules, so I should assume the worst/average case." K. refuses this. He thinks he *can* know.
      *   *The Court's Design:* It's not just opaque; it's anti-epistemic. It prevents the formation of reference classes. If no one knows the outcome logic, you can't form a prior.
      *   *K.'s Psychology:* Is it hubris? Or is accepting the outside view (that he's doomed like everyone else) a form of suicide/surrender?
      *   *The Reader:* We are stuck in K.'s head. We never see the judges' room. We are also captured.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define IIVC. State the thesis: K.'s failure isn't just cognitive; it's structural. The Court weaponizes the inside view. The novel suggests epistemic modesty is impossible when reference classes are obliterated.
      *   **The Initial Arrest (The Trap of Particularity):** K. treats the arrest as a mistake *in* the system, not a function *of* the system. He seeks a specific reason. He rejects the statistical reality (arrests happen, guilt is assumed). This is the onset of IIVC.
      *   **The Cathedral / Parable (The Epistemic Wall):** "Before the Law." The doorkeeper says the door was meant only for the man. This is the ultimate inside-view trap. It validates K.'s belief in his uniqueness while condemning him. The outside view (others might have entered) is explicitly denied by the text of the parable.
      *   **The Execution (The Collapse of Meaning):** "Like a dog." No verdict. The outside view (he was processed) meets the inside view (he feels shame). The system wins by denying the closure required for an outside-view assessment.
