      *   **Philosophical Contribution:** Standard epistemic modesty assumes data exists but is ignored. Kafka shows data can be *ontologically absent*. Reference classes are destroyed.
      *   **Critical Resistance/Nuance:** Is K. delusional? Yes, sometimes (the paintings, the lawyer). Is he heroic? Maybe, in refusing to accept "guilt" as a statistical inevitability, even if it kills him.
      *   **Conclusion:** The novel condemns the posture only insofar as it leads to death, but vindicates it as the only human response to dehumanization. To accept the outside view is to cease being a subject.

