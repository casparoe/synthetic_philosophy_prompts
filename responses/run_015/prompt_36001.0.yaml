prompt: |-
  I recently had a long argument with a friend about the extended mind thesis, and we ended up defending two different criteria for when an external resource counts as part of someone's mind. I would like you to compare these two criteria carefully and help me figure out who, if either, was closer to the truth.

  The background: Clark and Chalmers famously argue for the extended mind by appeal to a parity principle. The formulation from their 1998 paper reads: "If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process." The idea is illustrated by the case of Otto, who suffers from memory loss and carries a notebook in which he records facts he wants to retain. When Otto wants to know where a museum is, he consults his notebook. Clark and Chalmers argue that if Otto's notebook reliably plays the role that biological memory plays for someone without memory loss, then the notebook's entries deserve to be treated as Otto's beliefs. They supplement this with further conditions of trust and accessibility: the notebook must be reliably available and automatically invoked, its contents easily accessible, and, in normal cases, previously consciously endorsed by Otto.

  My friend was not satisfied. He argued that the parity principle is too permissive, since almost any stable environmental arrangement could be gerrymandered into "cognitive" parity with some internal process, and he proposed a rival criterion that I will call the seamlessness criterion: an external resource counts as part of your mind only if, at the moment of use, you cannot tell from the inside whether the contribution is coming from within your skull or from outside. On his view, Otto's notebook is not part of Otto's mind precisely because Otto must deliberately open it and read it; the retrieval is experienced as an act of consulting an artifact, not as remembering. By contrast, a well-integrated neural implant or a cochlear implant could qualify, because its contributions are subjectively indistinguishable from native processing.

  Please compare the parity principle and the seamlessness criterion. In doing so, address the following questions. First, does the seamlessness criterion avoid the over-permissiveness my friend worried about, or does it introduce problems of its own — for instance, making the boundary of the mind depend on introspective access, so that a resource counts as mental for one person but not another purely because of differences in how the retrieval feels? Second, how do the two criteria handle the fact that Otto can presumably always tell, at some level, that he is consulting a notebook? If the seamlessness criterion is never satisfied in such cases, does that make it trivially narrow? Third, consider whether the two criteria are genuinely rivals, or whether they might be answers to different questions — say, one about the metaphysics of what a cognitive process is, the other about the phenomenology of what mental ownership feels like. Finally, take a stance: which criterion better captures the intuition behind the extended mind thesis, and are there mixed cases, such as a practiced smartphone user or someone navigating by GPS, where you think the two criteria clearly come apart? Please justify your assessment with concrete reasoning rather than mere appeals to intuition.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Extended Mind Thesis (EMT), specifically comparing Clark & Chalmers' Parity Principle (PP) vs. a friend's "Seamlessness Criterion" (SC).
      *   **Task:** Compare the two criteria carefully and determine who is closer to the truth (or if they address different things).
      *   **Specific Questions to Address:**
          1.  Does SC avoid over-permissiveness, or does it introduce new problems (e.g., introspective variability)?
          2.  How do they handle Otto's case (can he tell he's using a notebook)? Is SC trivially narrow?
          3.  Are they genuine rivals or answers to different questions (metaphysics vs. phenomenology)?
          4.  Take a stance: Which captures EMT better? Discuss mixed cases (smartphone, GPS).
      *   **Constraint:** Justify with concrete reasoning, not mere intuition.

  2.  **Deconstruct the Criteria:**
      *   **Parity Principle (PP):** Functionalism. If external $X$ does what internal $Y$ does, and we'd call $Y$ cognitive, then $X$ is cognitive. Key conditions: Reliability, Accessibility, Automatic Endorsement/Trust. Focus: *Role in the system*.
      *   **Seamlessness Criterion (SC):** Phenomenological/Subjective. If the user cannot distinguish internal vs. external contribution *from the inside*, it's mental. Focus: *Experience of ownership*.

  3.  **Address Question 1: Over-permissiveness vs. Introspective Variability.**
      *   *PP Critique:* Friend says PP is too permissive (gerrymandering).
          *   *Counter:* PP has constraints (trust, accessibility, endorsement). It's not *any* stable arrangement. However, the "coupling-constitution fallacy" is a common objection here.
      *   *SC Critique:* Does SC solve this? Yes, it tightens the boundary.
      *   *SC Problems:* It makes cognition dependent on *qualia* or introspection.
          *   *Variability:* An expert typist might feel the keyboard is "part of them" (seamless), while a novice doesn't. Does the keyboard become mental only for the expert? This makes the *ontology* of the mind dependent on subjective feeling, which is unstable.
          *   *Unconscious Processing:* Much cognition is unconscious. If I don't feel it, is it not cognitive? SC risks excluding unconscious external scaffolding.

  4.  **Address Question 2: The Otto Case and Trivial Narrowness.**
      *   *Otto:* He knows he's opening a book. There is a sensory-motor loop (hand moves, eyes read).
      *   *PP:* Accepts Otto. The *functional role* matches biological memory, even if the mechanism differs.
      *   *SC:* Rejects Otto. He feels the difference.
      *   *Triviality:* If SC requires *perfect* indistinguishability, almost nothing external qualifies (except maybe future direct neural interfaces). This renders EMT almost empty for current human technology. It sets the bar so high it defeats the purpose of exploring *extended* cognition. It essentially says "Only what feels internal is internal," which is circular.

  5.  **Address Question 3: Rivals or Different Questions?**
      *   *PP:* Metaphysical/Functional. What *constitutes* a cognitive process? It's about the causal structure of the system.
      *   *SC:* Phenomenological. What does it *feel like* to use a resource? It's about the "sense of agency" or "cognitive ownership."
      *   *Synthesis:* They are likely talking past each other. PP is about the *vehicle* of cognition. SC is about the *experience* of cognition. You can have extended cognition (PP) without seamless experience (SC).

  6.  **Address Question 4: Stance and Mixed Cases.**
      *   *Stance:* PP is better for EMT. EMT is a functionalist thesis. SC collapses into a form of internalism based on phenomenology.
      *   *Mixed Cases:*
          *   *Smartphone:* PP says yes (if relied upon like memory). SC says no (I feel the screen).
          *   *Blind Cane:* Merleau-Ponty example. The cane becomes an extension of the body. PP says yes (sensory extension). SC says maybe (expert users feel the tip, not the handle).
          *   *GPS:* PP says yes (navigation system). SC says no (I hear a voice telling me).
      *   *Reasoning:* Cognition is defined by what it *does* (processing information to guide action), not how it *feels*. We accept unconscious internal cognition; why demand conscious seamless external cognition?

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the depth of the debate. Define PP and SC clearly.
      *   *Section 1 (Permissiveness vs. Variability):* Analyze the friend's worry. Show how SC trades one problem for another (ontological instability).
      *   *Section 2 (Otto and Narrowness):* Discuss the Otto case. Show how SC makes EMT trivial.
      *   *Section 3 (Metaphysics vs. Phenomenology):* Distinguish the projects. This is a crucial philosophical distinction.
      *   *Section 4 (Stance and Cases):* Argue for PP. Use the smartphone/GPS examples. Bring in the "Coupling-Constitution" objection briefly to show nuance, but defend PP's functionalism.
      *   *Conclusion:* Summarize.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "introspective access" point? Yes, need to emphasize that making mind boundaries depend on feelings makes science of mind difficult.
      *   *Check:* Did I address "trivially narrow"? Yes, if only neural implants count, EMT loses its bite regarding tools/environment.
      *   *Check:* Is the distinction between metaphysics and phenomenology clear? Use the analogy of digestion (we don't feel digestion, but it's biological). Or better, unconscious belief.
      *   *Nuance:* Acknowledge that Clark himself later moved towards "predictive processing" which blurs the line, but stick to the 1998 framework for the core comparison.
      *   *Tone:* Philosophical, analytical, fair to both sides but decisive.

  9.  **Final Polish:** Ensure all four specific prompts from the user are explicitly answered within the flow. (1. Over-permissiveness/Introspection, 2. Otto/Triviality, 3. Rivals/Different Questions, 4. Stance/Mixed Cases).

  *(Self-Correction on "Seamlessness"):* I need to be careful not to strawman the friend. The friend's criterion is essentially a "Phenomenological Criterion." I should treat it as a serious alternative, perhaps rooted in embodied cognition or phenomenology (Merleau-Ponty), rather than just dismissing it. The friend's point is about *incorporation*.

  *(Refining the "Truth" aspect):* Philosophy doesn't have "truth" in the empirical sense. I should frame it as "theoretically fruitful" or "consistent with the goals of EMT."

  *(Final Plan):*
  1. Intro: Set the stage.
  2. The Problem of Introspection (SC's weakness).
  3. The Otto Case (SC's narrowness).
  4. Metaphysics vs. Phenomenology (Dissolving the rivalry).
  5. Verdict (PP wins for EMT, SC wins for Phenomenology).
  6. Mixed Cases (Smartphone/GPS).
  7. Conclusion.

