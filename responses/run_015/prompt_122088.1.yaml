  2.  **Deconstruct the Shipowner Analogy (Clifford's View):**
      *   *Source:* W.K. Clifford's "The Ethics of Belief."
      *   *The Story:* A shipowner sends an emigrant ship to sea. He has doubts about its seaworthiness but suppresses them, convinces himself it's safe, and collects the fares. The ship sinks. Clifford argues the owner is guilty *even if the ship had made the trip safely*.
      *   *The Mapping:*
          *   Ship = The Belief/Model.
