      *   **Scenario:** Three sample-handling protocols. Respecting reserved domains + unanimity clause = no adoptable protocol (cycle/blockage).
      *   **Three Camps:**
          1.  Keep Reserved Domains, strike Unanimity (Individual Rights > Collective Welfare).
          2.  Keep Unanimity, restrict ranking scope (Limit rights expression).
          3.  Abolish Reserved Domains, use Supermajority (Collective Welfare > Individual Rights).
      *   **Requirements:**
          *   Open with recommendation + one-line rationale.
          *   Argue for the recommendation.
          *   Address explicitly: Is this a genuine conflict between individual rights and collective welfare, or an artifact of encoding rights as constraints on a joint ranking vs. spheres of action?
