  **OFFICE OF REVEALED WELFARE (ORW)**
  **INTERNAL GUIDANCE NOTE 74/β**
  **TO:** All Regional Caseworkers
  **FROM:** Directorate of Rational Choice & Allocation
  **SUBJECT:** Operationalising Welfare Maximisation Protocols

  **1.0 PREAMBLE**
  Staff are reminded that the ORW operates under the strict ontological commitment that welfare is identical to observed choice behaviour. Internal states, such as 'hunger', 'distress', or 'need', are unobservable metaphysical constructs and possess no standing in assessment procedures. A claimant is deemed better off if and only if they select a bundle from the feasible set. The following clauses clarify the application of this doctrine during quota reductions and reassessments.

  **2.0 CONTRACTION OF THE FEASIBLE SET**
  When budgetary necessitations require the removal of specific benefit options from a claimant's menu, no welfare loss is recorded. Provided the claimant continues to select a remaining bundle, that bundle is revealed preferred to all removed options. Consequently, the reduction of the feasible set is classified as an efficiency saving. Caseworkers must log the removal of housing support options as 'neutral welfare events', provided the claimant does not vacate the choice set entirely (i.e., survive).

  **3.0 ALTRUISTIC BUNDLES AND PORTION SIZES**
  Claimants frequently select smaller nutritional bundles when dependents are present. Under ORW doctrine, this is not a sacrifice. By choosing the smaller portion, the claimant has revealed a preference for reduced caloric intake over the alternative. Staff must record this as a dietary preference rather than a deprivation. To suggest the claimant 'would prefer' more food is to impose external utility functions, which is a Grade 4 Compliance Breach.

  **4.0 CONSISTENCY AXIOMS (WARP)**
  Assessments rely on the Weak Axiom of Revealed Preference (WARP). If a claimant chooses Bundle A over Bundle B when both are available, but subsequently chooses B over A due to minor menu alterations, they have violated WARP. Such cycling indicates the absence of a stable utility function. Claimants failing WARP are logged as having no coherent preferences and, therefore, no assessable needs. Their files should be closed under code 'IRRAT-NULL'.

  **5.0 INTERPERSONAL COMPARISONS**
  Utility functions are defined only up to a positive affine transformation. Therefore, welfare improvements are ordinal and specific to the individual. It is mathematically impossible to compare the welfare gain of Claimant A against Claimant B. All improvements are logged as non-negative locally. Caseworkers must not prioritise cases based on perceived severity of hardship, as 'hardship' implies a cardinal utility metric which the Office does not recognise.

  **6.0 APPEALS PROCEDURE (FORM ORW-44)**
  Claimants wishing to contest a decision must submit Form ORW-44. Staff should note that the submission of this form alters the claimant's choice set by introducing the 'Appeal' option. Consequently, the act of appealing reveals a preference for the appeal process itself, not necessarily a dissatisfaction with the original bundle. As the choice set has changed, the appeal cannot speak to the welfare status of the original decision. Appeals are therefore self-negating. Staff should acknowledge receipt but maintain the original allocation as the only revealed optimum.

  **7.0 COMPLIANCE**
  Adherence to these protocols ensures that the ORW remains scientifically rigorous. Any deviation implying that welfare exists independently of choice will be treated as misconduct.

  **Signed,**
  *Directorate of Rational Choice & Allocation*
  *Office of Revealed Welfare*
