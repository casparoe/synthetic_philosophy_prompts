          *   *Verdict:* Coherent, but needs careful grounding. The "authorial" problem is actually an *ontological* problem about the status of the fictional world. If there's no author, is there a "world" or just text?
          *   *Suggestion:* Reframe "Authorial" as "Ontological/Stability of the Fictional World."

      *   **Q2: Critique of Walton/Carroll:**
