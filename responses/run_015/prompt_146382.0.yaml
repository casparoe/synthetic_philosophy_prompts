      *   **Interaction:** AMD conflates them. The forgetfulness creates the indexical problem, which makes the causal link between Plan and Action opaque (because the action at Node 1 determines the probability of reaching Node 2, but Node 2 doesn't know Node 1's action).
      *   **Resolution:** Resolving indexicality (giving the counter) breaks the feedback loop. The agent becomes a standard sequential decision maker. The problem relocates only if we introduce *preference* inconsistency or *binding* issues, not reasoning issues.

