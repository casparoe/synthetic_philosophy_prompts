  **The Block**

  I sit at rest beneath the supernova,
  Holding the hand of my granddaughter,
  Years healed since the operation,
  Steam rises sharp from the kettle,
  Sunlight catches the dust mote,
  Light travels far to reach Andromeda.

  She walks away toward Andromeda,
  Her plane of now cuts the supernova,
  It tilts around the dust mote,
  Her reality holds my granddaughter,
  Though she cannot boil the kettle,
  Or feel the scar of the operation.

  A ship moves fast past the operation,
  Its clock syncs with Andromeda,
  It ignores the steam of the kettle,
  It measures light from the supernova,
  It passes close to my granddaughter,
  It misses the fall of the dust mote.

  No signal rides the dust mote
  To change the date of the operation,
  Or unmake birth of my granddaughter,
  All frames contain Andromeda,
  Though none agree on the supernova,
  Or when to switch off the kettle.

  The water rests in the kettle,
  Gravity holds the dust mote,
  Light stays with the supernova,
  The scar remains from the operation,
  Stars spin in Andromeda,
  Life stands with my granddaughter.

  There is the hand of my granddaughter,
  There is the water from the kettle,
  There is the light of Andromeda,
  There is the path of the dust mote,
  There is the scar from the operation,
  There is the fire of the supernova.

  No frame privileges the supernova over my granddaughter,
  Nor the operation over the kettle;
  Passage dies between the dust mote and Andromeda.

