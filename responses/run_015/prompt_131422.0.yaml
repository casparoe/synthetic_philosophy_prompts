  *(Final thought on 1 vs 2)*: Is it truly apparent? Some argue *Grundrisse* represents a break where Marx abandons LTV for a "general intellect" theory. If the user holds (2) strongly (Marx *never* abandons LTV), they must interpret *Grundrisse* as hyperbolic or describing a *post-capitalist* horizon, not the capitalist present. I will frame this as an interpretive hurdle that is surmountable but requires precision.

  *(Final thought on 5)*: This is definitely the biggest philosophical vulnerability. Andrew Feenberg's critique is the standard counter-argument here. I will cite the "technical code" concept implicitly.

