answer: |-
  Elias sat in the leather chair, electrodes mapping the brachial plexus. He was on Case 43. The air smelled of ozone and stale coffee. The Chief Adjudicator, Vance, watched the biometric readouts flickering on the glass wall.

  "Signal drift," Vance noted, his voice flat. "You're compressing the scale, Elias. The delta between Case 40 and 41 is negligible."

  "It's not drift," Elias said, his voice thin, stretched tight over a raw throat. "It's saturation. The forty-third slot feels like the tenth used to. My nervous system is callousing over."

  This was the first crack in the tribunal's logic. The ordering depended entirely on the queue. If Heston had gone first, he would have ranked higher. Now, after forty-two minutes of borrowed agony, Elias's capacity to distinguish intensity was eroding. The pain wasn't adding up; it was blurring. The carrier was becoming a dampener rather than a conduit.

  "Proceed to the spinal comparison," Vance ordered. "We need to settle the Gable-Heston discrepancy."

  Case 14: Mr. Heston. Six weeks post-accident. L4-L5 fusion. The pain hit Elias like a hammer blow, fresh and screaming. Elias gasped, back arching against the restraints. It was a bright, white noise that demanded everything.

  Case 15: Mrs. Gable. Twenty years post-accident. Same fusion. The pain was a dull, rhythmic throb. Manageable. A background hum.

  "Identical clinical markers," Vance said, looking at the screen where the neural maps overlaid perfectly. "But the carrier response varies by forty percent."

  "He's in acute shock," Elias whispered, rubbing his temples as the ghost of Heston's spine faded. "She's integrated it. She's not claiming the pain of the injury; she's claiming the pain of the memory of the injury."

  "The statute compensates suffering, not memory," Vance replied. "Do they rank equal?"

  "No," Elias said. "Heston is drowning. Gable is swimming. But the water is the same depth."

  Vance tapped his pen against the desk. If they ranked equal, the payout was identical. If not, Gable was penalized for surviving, for learning to endure. If they ranked unequal, the tribunal admitted that time healed wounds that clinically remained open.

  "Next pair," Vance said, ignoring the philosophical trap.

  Case 44 and 45. Both migraines. The biometric sensors screamed equality. Pulse, cortisol, neural firing rates identical. The machine saw no difference.

  Elias closed his eyes. He felt the first migraine: a sharp, clean break. The second: a heavy, wet blanket that required constant effort to lift.

  "They measure the same," Vance said.

  "They aren't," Elias said. "The second one... she's holding up a roof with her forehead. The pain isn't the weight; it's the strain of not letting it drop."

  "Subjective interpretation," Vance countered. "The machine says equal. The protocol demands objective ordering."

  "The machine measures voltage, not burden," Elias said.

  The room went silent. The protocol demanded an ordering. Elias had to sign off. If he lied, the compensation fund bled. If he told the truth, the system broke because it couldn't quantify 'burden'. The carrier was supposed to be a conduit, but he had become a judge.

  "Rank them," Vance said.

  Elias looked at the file for Case 45. A single mother. Case 44, a recluse. The cost of continuing was higher for the mother. But the system didn't pay for virtue. It paid for damage.

  "Case 45 is higher," Elias said.

  "On what grounds?"

  "Carrier discretion."

  Vance sighed. He knew this undermined the objective model. It introduced the carrier's moral intuition into a mechanical process. But the gavel had to fall. The claimants were waiting outside, needing money for medicine, for rent.

  "Recorded," Vance said. "Adjust the coefficient for the spinal pair to match the acute presentation. We cannot penalize adaptation. Close the session."

  Elias unplugged. His hands were shaking. He hadn't felt his own fingers in an hour. He wondered if the shaking was his, or if it belonged to Case 12. The ruling was issued. The checks would print. The injustice was standardized.

  What I was doing

  I intended the verdict on the spinal pair (Heston vs. Gable) to be contaminated by the tribunal's bureaucratic necessity rather than the carrier's sensation. Vance forces an adjustment to avoid penalizing adaptation, but this ignores the reality that Gable *does* suffer less in the moment. The carrier's fatigue (Case 40+) is explicitly untrustworthy; the story highlights the scale compression to show the mechanism is broken by sequence.

  The verdict on the migraine pair (Case 45 higher) is meant to be trustworthy in a human sense, but illegitimate within the system. Elias detects the "cost of continuing," which the machines miss. However, this relies on Elias's subjective empathy, not objective measurement.

  The core worry here is that interpersonal comparison is impossible. The carrier isn't comparing Claimant A to Claimant B; they are comparing Claimant A-in-Elias to Claimant B-in-Elias. They are comparing their own earlier self to their current self. I handled this by making the fatigue explicit—the "numbness" around the fortieth playback proves the baseline is shifting. The carrier becomes a moving ruler. The story resolves this not by solving the philosophical problem, but by showing the bureaucracy plowing ahead regardless. The ruling is issued not because the comparison is valid, but because the claimants need the money. The tragedy is that the system requires a lie to function.
