answer: |-
  You are asking exactly the right questions. The translation of Bernoulli's *Specimen Theoriae Novae de Mensura Sortis* (Exposition of a New Theory on the Measurement of Risk) is notoriously dense, and it is easy to miss the structural shift he is making.

  Here is the breakdown of the logical move, the historical origin of the logarithm, and the status of his assumptions.

  ### 1. Is this a mathematical fix or a psychological claim?
  It is **both**, but specifically, it is a mathematical fix *premised* on a psychological (or philosophical) claim.

  Bernoulli is not merely observing that people are risk-averse (a psychological description). He is arguing that the standard formula for Expected Value is *normatively wrong* (a philosophical claim) and needs to be replaced by a new formula (a mathematical fix).

  In the standard calculation you are familiar with, the Expected Value ($EV$) is:
  $$EV = \sum (p_i \times \text{payoff}_i)$$

  Bernoulli argues that "payoff" is the wrong variable. He proposes that the variable should be "change in utility." So the formula becomes:
  $$EU = \sum (p_i \times \Delta \text{Utility}_i)$$

  So, to answer your question: Yes, he is literally telling you to recalculate the expectation. He is not just saying "people feel differently"; he is saying "the mathematical definition of 'value' used in the paradox is incorrect." If you plug utility into the sum instead of ducats, the infinite series converges to a finite number. That is a mathematical resolution to the mathematical paradox.

  ### 2. Is the logarithmic utility function actually in Bernoulli's text?
  **Yes.** This is a common point of confusion because later textbooks often blend the contributions of Gabriel Cramer and Daniel Bernoulli.

  *   **Gabriel Cramer (1728):** In correspondence with Nicolas Bernoulli (Daniel's cousin), Cramer proposed two solutions. One was to cap the payout (mathematical truncation). The other was to use a square-root utility function ($\sqrt{x}$).
  *   **Daniel Bernoulli (1738):** In the paper you are reading, Daniel independently derives the **logarithmic** function ($\ln(x)$).

  In Section 16 of his paper, Bernoulli explicitly argues that the utility of wealth is proportional to the logarithm of wealth. He writes that the "value of an item must not be based on its price, but on the utility it yields," and then he proceeds to mathematically demonstrate that if you assume the marginal utility of wealth decreases inversely with the amount of wealth you already have, you arrive at the natural logarithm.

  So, the $\ln(\text{wealth})$ function is not a later addition by von Neumann or modern economists; it is the core engine of Bernoulli's 1738 argument.

  ### 3. What is the exact logical move regarding wealth vs. gain?
  This is the trickiest part of the text. Bernoulli makes a specific distinction that is often glossed over: **Utility depends on total wealth, not just the gain.**

  When you calculate the utility of the gamble, you cannot just look at the winnings ($x$). You must look at your initial wealth ($w$) plus the winnings ($w + x$).

  The logical move is this:
  1.  A gain of 1,000 ducats means very little to someone with 1,000,000 ducats.
  2.  A gain of 1,000 ducats means life-or-death to someone with 1,000 ducats.
  3.  Therefore, the value of the gamble is relative to the agent's **pre-existing state**.

  When Bernoulli says a reasonable man would sell the chance for 20 ducats, he is implicitly assuming a specific level of initial wealth. If you run the math with log utility, the "fair price" of the St. Petersburg ticket changes depending on how rich you are before you buy it.
  *   If you are penniless, the ticket is worth very little (because you can't afford the risk).
  *   If you are a millionaire, the ticket is worth more (because the loss of the entry fee hurts less).

  This is why the "20 ducats" figure is an illustration, not a universal constant. He is showing that for a "typical" person, the log function renders the expected utility finite and low, resolving the paradox.

  ### 4. Is there a hidden assumption about concavity?
  **Yes, and you are right to be suspicious of it.**

  Bernoulli defends the idea that utility curves are concave (diminishing marginal utility) using the "pauper vs. rich man" intuition. He argues it is self-evident that an extra dollar helps a poor person more than a rich person.

  However, the assumption that the curve is **specifically logarithmic** is not empirically defended in the text. He derives it from a differential equation where he assumes the change in utility is inversely proportional to wealth ($\frac{dU}{dw} = \frac{k}{w}$).

  Why did he choose that specific relationship?
  1.  **Mathematical Convenience:** It solves the St. Petersburg integral cleanly.
  2.  **Weber-Fechner Law:** Bernoulli was influenced by psychophysics (the study of perception). The idea was that human perception of stimuli (like weight or light) is logarithmic. He assumed the perception of wealth works the same way.

  So, the hidden assumption is that **human valuation of money follows the same law as human perception of physical stimuli.** He does not prove this; he posits it as a natural law. Modern decision theory acknowledges this as a strong assumption. We now know utility functions can take many shapes (power functions, exponential, etc.), but Bernoulli presented the log function as *the* solution.

  ### Summary for your course
  To synthesize this for your understanding of the text:

  1.  **The Move:** Bernoulli is redefining the variable in the expectation sum from "money" to "utility." This turns a divergent series (infinity) into a convergent series (finite number).
  2.  **The Function:** The logarithmic utility function is explicitly in Bernoulli's 1738 text; it was not added by later formalists.
  3.  **The Nature of the Argument:** It is a normative mathematical claim grounded in a psychological observation. He is saying, "If you want to calculate value correctly (normative), you must account for how humans actually perceive gain (psychological)."
  4.  **The Weakness:** He assumes concavity is a universal law of nature and stipulates the logarithmic form without empirical proof, relying on an analogy to physical perception.

  Bernoulli's genius was realizing that the paradox wasn't in the game, but in the definition of "value." His specific fix (log utility) was the first major formalization of what we now call **Expected Utility Theory**.
