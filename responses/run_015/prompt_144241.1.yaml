  **Scene Prose**
  The wind whipped the scree, flattening the grass against the slope where the ibex stood, its head low, chewing. Elena pointed at the animal's forefoot, lifted slightly on a rock. "Look at the gland discharge. Thick, waxy. It's coating the hoof wall perfectly." Marcus shook his head, binoculars hanging loose against his chest. "It's not coating anything, it's marking. Or it's supposed to be. That gland is a trail-marker, Elena. But look at the herd—they walk over each other's tracks without a reaction. They're blind to it." "They're not blind, they're adapted," she said, watching the ibex step down without slipping. "That wax is the only thing keeping the rot out of the keratin. Without it, they're lame in a week." "Then it's a life-support system running on a broken engine," Marcus said, kicking a stone. "The trait is selected for signaling. The signal goes nowhere. By definition, the organ is malfunctioning, even if the animal survives." "The animal *thrives*," Elena countered. "The system is closed. The wax stays on the foot, the foot stays sound. That's the function." "That's the *effect*," Marcus said. "The function is the history. And the history says this thing is supposed to smell."

  **Field Notes: Population IB-4 (High-Altitude Isolate)**
  *   **Subject:** *Capra sibirica* (Siberian Ibex), isolated ridge population (~200 individuals).
  *   **Trait (T):** Interdigital Gland Secretion (IGS). Large reservoir, distal pore between hooves.
  *   **Historical Context:** Ancestral populations use IGS volatile compounds for trail-marking and herd cohesion during migration.
  *   **Physiological Status:** Population fixed for olfactory receptor mutation (OR-23 null). Animals are anosmic to IGS volatiles. Historical Function (A) = Olfactory Signaling. Current Capacity = Impossible (receiver pathway absent).
  *   **Ecological Dependency:** Local scree hosts *Keratinomyces* sp. (aggressive hoof rot). IGS lipids are fungistatic.
  *   **Current Utility (B):** IGS coats hoof wall, preventing fungal invasion. Indispensable for locomotion/survival.
  *   **Morphology:** Gland structure matches ancestral signaling morph (high volume, rapid release), not optimized for continuous coating (slow seep).
  *   **Timeline:** OR-23 null allele fixed approx. 40 generations ago (post-glacial isolation). Gland morphology unchanged.

  **Walk-Through**
  *   **Trait (T):** The Interdigital Gland and its secretion.
  *   **Effect A (Historical):** Olfactory trail-marking for herd cohesion.
  *   **Effect B (Current):** Chemical protection of the hoof against fungal rot.
  *   **Selected Effects Account (Marcus):** Function is determined by the effect that explains the trait's maintenance in the lineage. The gland exists because ancestors signaled (A). The capacity for A is now internally blocked (anosmia). Therefore, the trait is failing to perform its function. The animal survives via B, but B is a "lucky accident" (exaptation), not the function. **Verdict:** The trait is malfunctioning; the population is physiologically compromised.
  *   **Functional Analysis Account (Elena):** Function is determined by the trait's contribution to the capacity of the containing system (the animal's survival). The least gerrymandered system is the whole organism. The gland contributes to survival via B. It does B reliably. **Verdict:** The trait is functioning; the animal is healthy.
  *   **Divergence Point:** The definition of "Function." Marcus locates it in the *past* (etiology); Elena locates it in the *present* (systemic contribution). They agree on the biology (anosmia, rot protection, morphology) but disagree on whether a trait that saves the animal but ignores its evolutionary "job" counts as working.

  **The Single Feature Doing the Work**
  The feature is **Etiological Lag** (the time delay between a physiological switch and morphological adaptation). The anosmia (internal change) is recent enough (40 generations) that the gland's *structure* still bears the imprint of selection for A (high volume, rapid release), not B.
  *   **If Removed:** If the gland had morphologically adapted to B (e.g., smaller, continuous seep), Marcus would have to concede that selection has updated the trait's history to B, collapsing the distinction. If the anosmia were environmental (e.g., air pollution blocking scent), it would violate the "internal change" constraint. If the trait were vestigial (B not indispensable), Elena could not claim the animal is healthy without it.
  *   **SE Counter-Attack (Marcus's Voice):** "You're conflating *utility* with *function*. A stone can prop a door, but its function isn't 'door-stop' unless it was selected for that. This gland is a stone propping a door. It was built to be a bell. It doesn't ring. It's a broken bell that happens to hold the door open. If the fungus mutates tomorrow, this gland is useless. It has no grip on the future, only on the past. Calling it 'functional' ignores that it's one mutation away from extinction because it's not actually designed for the job it's doing."

  **Verdict and Flags**
  *   **Actual Support:** The case supports **Elena (Functional Analysis)** for *clinical/conservation* purposes. If the goal is to assess the health of the animal or decide on intervention, the current contribution to survival (B) is the only metric that matters. Marcus's view is correct for *evolutionary history*, but dangerous for *field management* (labeling a thriving population as "malfunctioning" could justify unnecessary genetic rescue).
  *   **Switching Fact:** If it were discovered that the OR-23 null allele (anosmia) arose **before** the gland morphology diverged from the ancestral state by *millions* of years, Marcus's position weakens significantly. If the lineage has persisted for eons without signaling, the "history" of the trait updates to B, even under Selected Effects. The case relies on the 40-generation lag.
  *   **Invented Biology Flag:** While Ibex have interdigital glands and hoof rot is real, the specific **obligate dependency** on gland secretion for fungal resistance, combined with a **fixed population-wide anosmia** to that specific secretion, is a constructed scenario for this philosophical problem. Real ruminants typically have multiple defense mechanisms against hoof rot; making the gland *indispensable* is the fictional lever required to force the "healthy but malfunctioning" paradox. A field guide might note that ibex scent glands are primarily for mating/marking, not hoof care.
