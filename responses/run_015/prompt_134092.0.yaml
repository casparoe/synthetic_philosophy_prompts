      Regarding school endorsement: We mitigate risk by clarifying that scores reflect argumentative rigor, not factual endorsement. Allowing a flawed method teaches students that evidence is optional if your conclusion is exciting. Consistency requires we apply this to any project with thin evidence, whether we like the conclusion or not. The difference is not the verdict, but the engagement with opposing views.

