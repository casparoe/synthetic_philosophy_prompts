      **Recommendation**
      I recommend we **Accept on Stated Conditions**. The student may compete in the judged category only if she revises her exhibit to directly engage with opposing archaeological evidence and explain why her interpretation outweighs it. If she refuses, the exhibit moves to Exhibition-Only.

      **Reasoning**
      We are not judging whether she is right, but whether she is doing history. History requires testing an idea against evidence that might prove it wrong. Currently, her project treats missing evidence as proof and demands impossible certainty from experts while accepting her own claims without question. This is not method; it is immunity. We cannot judge verdicts without becoming truth police, but we must judge method. If a student ignores counter-evidence, they are not making a historical argument; they are making a declaration.

