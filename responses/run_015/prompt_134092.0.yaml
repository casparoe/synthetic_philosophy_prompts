      **General Rule for Future Cases**
      Entries must demonstrate how the student considered evidence that contradicts their conclusion. Projects that treat counter-evidence as proof of a conspiracy, or that cannot describe what information would change their mind, do not meet the requirement for a supported historical argument.

      **Statement to the Student**
      "We want to take your idea seriously, which is why we are holding it to the highest standard. History isn't about having the right answer; it's about how you handle the wrong ones. To compete, you must show us you've listened to the archaeologists who disagree with you and explain why they are mistaken using their own evidence, not just their motives. We want you to win on the strength of your method, not because we avoided the hard questions."

