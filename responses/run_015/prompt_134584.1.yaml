answer: |-
  The humidifier hums, a low throat-clearing in the back of the room. It smells of lignin and old glue here. Rabbit skin glue, heated in the water bath. Sweet and rotten.

  Elena leans over the light table. The mandala is fourteen hundred square inches of fear and geometry. Fourteenth century. Paper made from mulberry bark, beaten thin. Pigments ground from stones that were mountains before they were dust.

  She maps the damage. It's always a map before it's a repair.

  Top left quadrant: The blue deity is intact. The lapis is deep, unbruised. It asserts itself. *It is.* Affirmation. The lines hold firm. You can touch the edge of the robe and know where the robe ends and the void begins.

  Top right: Burned. Completely gone. A hole in the shape of a flame. *It is not.* Negation. The paper is brittle ash at the edges, falling away if she breathes too hard. There is no image here. Only the absence of one.

  Bottom left: Charred but legible. The cinnabar red has blackened, but the lines of the lotus remain. *It is and it is not.* Both. The fire took the color but left the form. A contradiction held together by carbon.

  Bottom right: Faded. Water damage maybe, or just time. The lines are there but ghostly. You can't say they are fully present, can't say they are fully gone. *Neither.* Ambiguity.

  And the center.

  The center is where the fire sat longest. The heat was so intense it didn't burn the paper away; it cooked it. The mineral pigments melted into the fiber. There is no image left to restore. No lines. No deity. Just a stain where the stone and the plant became one thing.

  Elena mixes the ink.

  She uses a glass muller on a slab of frosted granite. Crushed lapis lazuli. She adds the glue binder drop by drop. The smell is animalistic. Warm. She grinds until the particles are suspended, not floating. Until the stone is liquid.

  Her hand hovers.

  If she paints the center, she lies. She imposes a form where the fire chose formlessness. She says *this is the deity* when the paper says *this is fire*.

  If she doesn't paint, she leaves a hole. But is it a hole?

  She looks at the dissolved zone again. Under magnification, the fibers are swollen. The blue is inside the paper now, not on top of it. Usually, pigment sits on the surface, catching light. Here, the light goes through. The distinction between the image and the substrate is gone.

  Nāgārjuna would say nothing has intrinsic nature. No *svabhava*. The ink depends on the brush. The brush depends on the hand. The hand depends on the eye.

  Here, the ink depends on the fire.

  She dips the brush. Size 000. Sable hair. The tip is wet, dark.

  To restore is to pretend nothing happened. To conserve is to let the damage speak. But the damage isn't silence. It's a different kind of speech.

  The fifth zone isn't empty. It's full of interdependence. The paper needed the fire to become this specific shade of bruised purple. The pigment needed the heat to stop being stone and start being stain. They rely on each other. Form is emptiness.

  If she fills it with new ink, she creates a boundary. She says *here is form, here is background*. But the center refuses the boundary. It is the collapse of the distinction.

  Her hand shakes. Just a little. A tremor in the wrist, age or caffeine.

  She thinks about the quadrants. Yes, No, Both, Neither. They are boxes. Logical traps. The mind wants to put the world in boxes so it doesn't have to look at the spaces between.

  The center is the space between.

  She lowers the brush. The tip touches the paper.

  If she paints, she preserves the image but destroys the truth of the object. If she stops, she preserves the truth but loses the image.

  But the image was never real. It was just minerals on plant fiber held together by glue and belief.

  She lifts the brush. She doesn't paint the deity. She takes the clear gelatin size—the glue without the stone—and brushes it over the dissolved zone. Just enough to consolidate the fibers. To hold the stain in place.

  It dries clear. The zone remains empty of image, full of material.

  It looks like nothing. It is everything.

  She turns off the light table. The room goes dark except for the streetlamp outside filtering through the blinds. Dust motes dance in the slats of light. They don't exist on their own. They need the light to be seen. They need the air to float.

  Elena packs the muller away. She wipes the slab. There is a smear of blue left on the granite. She leaves it. No sense in cleaning what will just get dirty again.

  She writes the report. *Condition stable.* *Treatment minimal.*

  She types *interdependence* then backspaces. Types *integration*. Backspaces.

  Leaves it blank.

  The file name is `Mandala_14C_Condition_Report.docx`. She saves it. A typo slips in on the label maker for the box later, she knows it will. `Conservaton_Log_2023`. She won't fix it.

  The hum of the humidifier stops. The silence rushes in to fill the space. Not an absence of sound, but a presence of quiet. Dependent on the machine stopping.

  She touches the center of the mandala through the Mylar sheet. She can't feel the ink because there is no ink. She feels the paper. She feels the roughness where the fire changed the texture.

  It is not broken. It is just finished being burned.

  Elena turns off the lamp. The mandala disappears. It is still there. It is not there. It is both. It is neither.

  She walks out into the hall. The door clicks shut. The lock engages. Metal into metal. A sound that says *secure*. But the paper breathes in the dark. Expanding with the humidity. Contracting with the cold. Alive becuase it changes.

  She doesn't look back.
