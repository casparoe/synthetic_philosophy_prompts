prompt: |-
  I'm a novelist working on something about material culture and Buddhist philosphy, and I need a short story that takes Nāgārjuna's tetralemma and Madhyamaka emptiness seriously—not as decoration but as the actual narrative logic. Here is the setup: a paper conservator in a small museum is repairing a 14th-century mandala that was partly burned. As she works she notices the four quadrants map onto the catuṣkoṭi—affirmation, negation, both, neither—but the fire damage creates a fifth zone where the pigment dissolved completely into the paper, so there is no image left to restore, only the medium itself.

  I want the story to ask whether that dissolved zone is the emptiness Nāgārjuna talks about, not as absence but as the interdependance of form and substrate. The conservator should be grappling with whether she destroys or preserves the mandala by filling that zone with new ink made from the same crushed minerals used in the origional painting. Write it in American English, keep it sensory and fragmented rather than didactic, and please dont include any citations or reading lists—I cant look things up right now and I want the concept to breath on its own. Maybe include a typo or two since I'm rushing this between chapters.
