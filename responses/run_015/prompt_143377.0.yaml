answer: |-
  # HANDOUT: EPISTEMIC CLASSIFICATION OF THOUGHT EXPERIMENTS

  ## Part A — The Questions

  *Instructions: For each item, select the option that best describes the scenario presented or the claim made. Treat each item as a node in a decision path. Answer based on your assessment of the case's features or your own judgment of similar cases.*

  **1. The Unreachable Regime (Source)**
  A physicist analyzes a system that cannot be built or simulated due to complexity. They report a confident verdict on its behavior. This confidence rests primarily on:
  (A) The structural constraints of reality itself, accessible to reason.
  (B) The internal consistency of the model used to describe it.

  **2. The Unreachable Regime (Status)**
  Regarding the verdict in Question 1: If the physicist is correct, this counts as:
  (A) Knowledge of how nature must behave, independent of observation.
  (B) Knowledge of how the model behaves, with nature assumed to match.

  **3. The Framing Flip (Implication)**
  One physical setup yields opposite verdicts when described as a "valve" versus an "agent." This flip demonstrates that:
  (A) The method of imagining cases is too fragile to track physical facts.
  (B) Descriptions trigger different conceptual associations, though facts remain fixed.
  (C) Physical facts are partly constituted by how we describe them.

  **4. The Consensus Reversal (History)**
  Past experts reached the opposite verdict on a scenario due to a false assumption we now reject. This history implies:
  (A) Our current verdict is likely correct because the error is identified.
  (B) Our current verdict is suspect because the cognitive mechanism is unchanged.
  (C) Historical error is irrelevant to the logical force of the current scenario.

  **5. The Surrogate Simulation (Authority)**
  A validated simulation code conflicts with expert intuition on an untestable case. Authority lies with:
  (A) The code, because its track record is independently checkable.
  (B) The intuition, because it grasps the physical necessity the code misses.
  (C) Neither; the case is undecided until physical evidence arrives.

  **6. Galileo’s Falling Stones (Novelty)**
  Galileo’s argument against weighted speed yields a conclusion about gravity. This conclusion is new because:
  (A) It reveals a law of nature previously unknown to experience.
  (B) It exposes a contradiction in the concepts of "weight" and "speed."
  (C) It rearranges existing empirical premises into a newly noticed pattern.

  **7. Newton’s Rotating Bucket (Evidence)**
  The water’s concave surface in the rotating bucket supports a claim about space. This support functions as:
  (A) A direct intuition of absolute spatial relations.
  (B) A demonstration that our current concepts require revision.
  (C) An argument that relies on prior empirical assumptions about motion.

  **8. The Role of Narrative (Function)**
  In a typical thought experiment, the descriptive story (the "drama") is:
  (A) Epistemically idle; only the logical structure matters.
  (B) Essential; it triggers the cognitive simulation required for the verdict.
  (C) Persuasive; it makes the conclusion plausible without proving it.

  **9. Modal Strength (Necessity)**
  The conclusion of a successful thought experiment in physics is:
  (A) Necessarily true; it could not be otherwise in any possible world.
  (B) Contingently true; it holds in our world but relies on empirical laws.
  (C) Normatively true; it dictates how we ought to reason, not what exists.

  **10. Mechanism Reliability (Calibration)**
  The cognitive mechanism producing the verdict is reliable only if:
  (A) It aligns with rational intuition, regardless of empirical check.
  (B) It has a demonstrated track record on checkable cases of the same kind.
  (C) It is shared by the majority of trained experts in the field.

  ***

  ## Part B — The Logical Space

  **1. The Space**
  The instrument comprises ten binary or trinary slots.
  *   Questions 1, 2, 4, 5, 6, 7, 9 are binary (2 options).
  *   Questions 3, 8, 10 are trinary (3 options).
  *   **Total Formal Combinations:** $2^7 \times 3^3 = 128 \times 27 = 3,456$ distinct answer profiles.

  **2. Locating the Accounts**
  The eight accounts occupy small, clustered regions within this space. They are not single points but families of profiles sharing a core signature.
  *   **Rationalist Core:** Affirms 1A, 2A, 9A.
  *   **Argument Core:** Affirms 6C, 7C, 8A.
  *   **Simulation Core:** Affirms 1B, 2B, 8B.
  *   **Conceptual Core:** Affirms 6B, 7B, 9C.
  *   **Anti-Exceptionalist Core:** Affirms 4A, 9B, 10C (majority rule).
  *   **Pump Core:** Affirms 3A, 8C, 2B.
  *   **Instability Core:** Affirms 3A, 4B, 10C (demographic sensitivity).
  *   **Calibrationist Core:** Affirms 5A, 10B, 2B.

  **3. Unoccupied Cells**
  *   **Cell Alpha (Incoherent):** Profile: 1A (Reality Structure) + 3A (Fragile/Flip) + 9A (Necessary).
      *   *Status:* Incoherent. If a verdict tracks necessary features of reality (1A, 9A), changing the description of the case should not alter the verdict (contradicts 3A).
  *   **Cell Beta (Unattractive):** Profile: 8C (Persuasive/Rhetorical) + 6A (Reveals Law of Nature) + 1A (Reality Structure).
      *   *Status:* Unattractive. This view claims thought experiments are mere rhetoric (8C) yet simultaneously yield substantive laws of nature (6A) via reality's structure (1A). It grants the payoff of rationalism while denying the mechanism.
  *   **Cell Gamma (Coherent but Unoccupied):** Profile: 5C (Undecided until physical evidence) + 2B (Knowledge of Model) + 10B (Track Record).
      *   *Status:* Coherent, Attractive, Unoccupied. This is a strict *Empiricist Deferred* view. It holds that thought experiments generate hypotheses that only become knowledge after physical confirmation, and the TE mechanism itself is only trusted if it has predicted such confirmations before. It is unoccupied because it renders the thought experiment epistemically inert *at the time it is performed*, which most theorists find too deflationary to count as an account of TE *knowledge*.

  ***

  ## Part C — Eight Leaves

  **1. The Rational Intuition Account**
  *   **Statement:** Thought experiments allow reason to directly apprehend necessary features of nature, yielding substantive knowledge without new empirical data.
  *   **Awkward Commitment:** It must explain why this rational faculty frequently fails or diverges among equally trained experts.

  **2. The Disguised Argument Account**
  *   **Statement:** A thought experiment is merely an argument in narrative clothing, where all premises are already known empirically and the conclusion is a logical derivation.
  *   **Awkward Commitment:** It must explain why the narrative form is psychologically necessary to convince us of conclusions we already possess the premises to prove.

  **3. The Mental Simulation Account**
  *   **Statement:** The reasoner runs a dynamic simulation on an internalized model of the world, and the verdict's reliability depends on the model's fidelity.
  *   **Awkward Commitment:** It must explain how we simulate systems that exceed our working memory or violate everyday experience without prior data.

  **4. The Conceptual Revision Account**
  *   **Statement:** Thought experiments do not discover facts but reveal incoherencies in our conceptual scheme, forcing us to revise our definitions.
  *   **Awkward Commitment:** It must explain why conceptual revisions often lead to successful empirical predictions about the physical world.

  **5. The Anti-Exceptionalist Account**
  *   **Statement:** Verdicts on imagined cases are ordinary counterfactual judgments, subject to the same fallibility and standards as everyday reasoning.
  *   **Awkward Commitment:** It must explain why thought experiments in physics seem to carry a distinctive weight or necessity not found in ordinary counterfactuals.

  **6. The Rhetorical Pump Account**
  *   **Statement:** Thought experiments function by altering what we find plausible through narrative force, without providing genuine epistemic warrant.
  *   **Awkward Commitment:** It must explain why some thought experiments persist as proofs while others are discarded as mere analogies.

  **7. The Instability Account**
  *   **Statement:** Verdicts are so sensitive to framing, order, and demographic profile that they cannot be trusted to track mind-independent facts.
  *   **Awkward Commitment:** It must explain why the scientific community relies on them successfully despite this alleged sensitivity.

  **8. The Calibrated Extrapolation Account**
  *   **Statement:** A verdict counts as knowledge only if the cognitive mechanism producing it has a verified track record on independently checkable cases of the same type.
  *   **Awkward Commitment:** It implies we possess almost no knowledge from thought experiments, as we lack the data to calibrate the mechanism for untestable cases.
  *   **Placement:** Located near the Mental Simulation leaf (both rely on mechanisms) but distinct on validation.
  *   **Collapse Check:** It does not collapse into Simulation (which trusts model fidelity) or Instability (which denies tracking). It is distinct because it demands *external* calibration.
  *   **Why Unoccupied:** Defending it requires empirical data on the success rates of intuition that philosophers do not currently possess.

  ***

  ## Part D — Scoring Key and Limits

  **1. Mapping Patterns to Leaves**
  To assign a leaf, tally the answers into three dimensions:
  *   **Source (Q1, Q6, Q7):** Dominant A = Rationalist; Dominant C = Argument; Dominant B = Simulation/Calibration.
  *   **Stability (Q3, Q4, Q10):** Dominant A/B = Realist; Dominant A (Fragile) = Instability/Pump.
  *   **Validation (Q5, Q10):** 10B = Calibrationist; 10C = Anti-Exceptionalist.

  **2. Tie-Breaking Rules**
  *   **Inconsistent Patterns:** If a reader selects Rationalist Source (1A) but Instability Stability (3A), assign **Instability**. The admission of fragility overrides the claim of intuition.
  *   **Mixed Validation:** If a reader selects Simulation Source (1B) but Calibrationist Validation (10B), assign **Calibrated Extrapolation**. Validation criteria trump mechanism description.
  *   **Argument vs. Conceptual:** If Q6 is mixed (A and B), check Q9. Necessity (9A) pushes to Rationalist; Normative (9C) pushes to Conceptual.

  **3. Minimal-Move Map**
  *   **Rationalist → Argument:** Change Q6 from A (New Law) to C (Rearranged Premises).
  *   **Simulation → Calibrationist:** Change Q10 from C (Expert Consensus) to B (Track Record).
  *   **Pump → Instability:** Change Q3 from A (Fragile Method) to A (Fragile Method) + Change Q8 from C (Persuasive) to A (Idle). *Correction:* Change Q4 from C (Irrelevant) to B (Suspect).
  *   **Anti-Exceptionalist → Calibrationist:** Change Q10 from C (Consensus) to B (Track Record).

  **4. Indistinguishable Pairs**
  *   **Pair:** The Rhetorical Pump vs. The Instability Account.
      *   **Reason:** Both deny truth-tracking and emphasize psychological impact. A reader might agree a case is persuasive (Pump) and framing-sensitive (Instability) without distinguishing whether the framing *causes* the persuasion or merely reveals the lack of warrant.
      *   **Missing Question:** "Does the framing change *what* you believe, or only *how strongly* you believe it?" This does not fit the format because it requires introspective access to the strength of belief distinct from its content, which is difficult to isolate in a written instrument.
  *   **Pair:** The Disguised Argument vs. The Conceptual Revision Account.
      *   **Reason:** Both deny new empirical knowledge. One says it's logic (Argument), the other says it's definition (Conceptual).
      *   **Missing Question:** "Are the premises empirical facts or definitions?" This requires metaphysical knowledge about the status of premises that the reader may not be able to determine from the case alone.

  ***

  ## Part E — Routing the Cases

  **1. The Unreachable Regime**
  *   **Path:** Q1(B) → Q2(B) → Q5(A) → Q10(B).
  *   **Leaf:** **Calibrated Extrapolation.**
  *   **Separation:** Separates Calibrationist (trust code/track record) from Rationalist (trust reason) and Simulation (trust model fidelity).
  *   **Note:** If described as "The physicist feels certain" rather than "The code returns a verdict," routing shifts to Q1(A), moving toward **Rational Intuition**. This shows the case is sensitive to the *source* description.

  **2. The Framing Flip**
  *   **Path:** Q3(A) → Q4(B) → Q10(C).
  *   **Leaf:** **Instability Account.**
  *   **Separation:** Separates Instability (method is fragile) from Anti-Exceptionalism (ordinary judgment) and Rationalism (necessary truth).
  *   **Empty Cell Check:** If a reader answers Q3(A) but Q1(A) (Fragile but Reality-Based), they land in **Cell Alpha (Incoherent)**. The instrument flags this as an error state.

  **3. The Consensus Reversal**
  *   **Path:** Q4(B) → Q10(C) → Q9(B).
  *   **Leaf:** **Anti-Exceptionalist Account.**
  *   **Separation:** Separates Anti-Exceptionalism (fallible, historical context matters) from Rationalism (ahistorical necessity).
  *   **Note:** If the reader answers Q4(A) (Error identified, we are right), the path moves to **Rational Intuition** or **Argument**, depending on Q1.

  **4. The Surrogate Simulation**
  *   **Path:** Q5(A) → Q2(B) → Q10(B).
  *   **Leaf:** **Calibrated Extrapolation.**
  *   **Separation:** Specifically isolates Calibrationist (trust checkable track record) from Mental Simulation (trust intuition/model).
  *   **Empty Cell Check:** If a reader answers Q5(B) (Trust Intuition) and Q10(B) (Track Record), they occupy a coherent but rare cell: **Intuition Calibration**. This view is unoccupied in the literature because intuition is rarely treated as having a checkable track record independent of the theory it supports.

  **5. Galileo’s Falling Stones**
  *   **Path:** Q6(C) → Q7(C) → Q8(A).
  *   **Leaf:** **Disguised Argument Account.**
  *   **Separation:** Distinguishes Argument (rearranging premises) from Rationalist (new law) and Conceptual (definition change).
  *   **Sensitivity:** If described as "seeing the contradiction" rather than "deriving the conclusion," routing shifts Q6 to (B), moving to **Conceptual Revision**.

  **6. Newton’s Rotating Bucket**
  *   **Path:** Q7(A) → Q1(A) → Q9(A).
  *   **Leaf:** **Rational Intuition Account.**
  *   **Separation:** Distinguishes Rationalist (intuition of absolute space) from Argument (empirical premises) and Simulation (model running).
  *   **Sensitivity:** If described as "defining inertia" rather than "observing space," routing shifts Q7 to (B), moving to **Conceptual Revision**.

  **Summary of Case Separation:**
  *   **Unreachable Regime** & **Surrogate Simulation** are the primary separators for the **Calibrationist** leaf.
  *   **Framing Flip** is the primary separator for the **Instability** leaf.
  *   **Consensus Reversal** is the primary separator for the **Anti-Exceptionalist** leaf.
  *   **Galileo** & **Bucket** separate the classical triad (**Rationalist**, **Argument**, **Conceptual**).
