answer: |-
  To build a theory of guilt and shame that isn't a "just-so story," you need to move beyond surface-level definitions and demand explanatory power regarding mechanism, function, and variation. Below is the mapping of requirements, an evaluation of your temporal hypothesis, and the identification of the single constraint that most destabilizes standard accounts.

  ### I. The Desiderata: Hard Constraints vs. Camp Preferences

  A robust theory must distinguish between what the data *forces* us to accept (Constraints) and where theoretical schools are free to bet (Preferences).

  #### Hard Constraints (Non-Negotiable)
  1.  **The Phenomenological Constraint:** The theory must account for the *felt experience* of the emotion, not just its label. Crucially, it must explain **Private Shame**. If a theory defines shame as requiring a social audience, it fails to describe the experience of feeling shame alone in a room.
  2.  **The Motivational Vector Constraint:** The theory must explain the distinct action tendencies. Guilt typically drives *approach/reparation* (fixing the breach). Shame typically drives *avoidance/withdrawal* (hiding the self) or *defensive aggression*. If the theory cannot predict why one leads to apology and the other to hiding, it is descriptively useless.
  3.  **The Differentiation Constraint:** It must explain why we have *two* mechanisms. If guilt and shame are functionally identical (e.g., both just "negative moral affect"), evolution would not have maintained the metabolic cost of two distinct systems. There must be a distinct adaptive problem each solves.
  4.  **The Cross-Cultural Portability Constraint:** The theory must explain variation without essentializing. It cannot simply label societies "Guilt Cultures" or "Shame Cultures" (a discredited anthropological binary). It must explain how the *same* underlying mechanisms produce different cultural moralities, rather than claiming different cultures possess different emotions.

  #### Camp Preferences (Theoretical Bets)
  1.  **The Object Focus (Act vs. Self):** *Standard View:* Guilt = "I did bad" (Act); Shame = "I am bad" (Self). *Status:* **Preference.** This is the dominant heuristic, but it is increasingly viewed as porous. One can feel guilt over a character flaw (self) and shame over a specific botched performance (act).
  2.  **The Temporal Orientation:** *Your Hypothesis:* Guilt = Backward (closing breach); Shame = Forward (anticipating social future). *Status:* **Candidate for Hard Constraint.** (See evaluation below).
  3.  **The Locus of Origin:** *EvoPsych:* Universal biological modules. *Constructionism:* Culturally scripted narratives. *Status:* **Preference.** A robust theory should likely be interactionist (biology enabling, culture configuring), but schools fight over the primary driver.

  ---

  ### II. Evaluating the Temporal Orientation Hypothesis

  Your framing—that the core difference is temporal rather than object-focused—is theoretically superior to the standard Act/Self distinction and should be treated as a **Hard Constraint** for any next-generation theory.

  **Why it works:**
  1.  **It resolves the "Object" blur:** You can feel shame over a specific act (e.g., tripping on stage) if that act threatens your *future* status. You can feel guilt over a character trait (e.g., "I am a liar") if you view it as a debt to be repaid *from the past*. The Act/Self distinction collapses here; the Temporal distinction holds.
  2.  **It explains the Motivational Vector:**
      *   **Guilt (Backward):** The breach exists in the past. The only way to resolve the tension is to act on the past (repair, confess, atone). Hence, *approach*.
      *   **Shame (Forward):** The threat exists in the future (exclusion, status loss). The self must be protected or hidden to secure the future. Hence, *avoidance* or *image management*.
  3.  **It reframes Cultural Variation:** You are correct that a culture "choosing" one over the other is restructuring the **time-horizon of moral education**.
      *   A "Guilt-heavy" moral system trains attention on *consequences of actions* (Past/Future link: You did X, so you must fix Y).
      *   A "Shame-heavy" moral system trains attention on *trajectory of identity* (Future focus: If you do X, you become the kind of person who cannot belong).
      *   This avoids the essentialist trap. It's not that Japanese people feel shame and Americans feel guilt; it's that the moral pedagogy in each context prioritizes different temporal horizons for the *same* underlying emotional hardware.

  **Verdict:** A decent theory *must* accommodate this. Ignoring temporal orientation renders the Act/Self distinction brittle.

  ---

  ### III. The Killer Desideratum

  The single desideratum that does the most damage to both standard Evolutionary Psychology and standard Social Constructionism is:

  **The Requirement to Account for Private Shame without invoking an "Imagined Audience."**

  #### Why this breaks Evolutionary Psychology
  Standard EvoPsych defines shame as an adaptive mechanism for **status defense against others**. It is a "submissive display" or a "hide signal" triggered by the risk of devaluation by the group.
  *   **The Damage:** If I feel profound shame alone in a dark room with no possibility of social exposure, the "status defense" module has no ecological target. To save the theory, EvoPsych must claim I am simulating an audience. But if the mechanism fires without the actual environmental trigger (other people), it suggests the module is not a direct response to *social reality* but to an *internal model of the self*. This weakens the claim that shame is purely a social-status adaptation and suggests it is also an identity-integrity adaptation.

  #### Why this breaks Social Constructionism
  Standard Constructionism defines shame as the **internalization of the social gaze**. There is no shame without the "Other" inscribing judgment upon the subject.
  *   **The Damage:** If shame can be experienced in total isolation (no real or imagined other), then the "social" is not constitutive of the emotion, merely incidental. It implies there is a pre-social, phenomenological core to shame that the culture merely labels. This undermines the relativist claim that the emotion *is* the script.

  #### How the Temporal Hypothesis Solves It
  This is where your temporal framing saves the theory where others fail.
  *   If Shame is **Forward-Oriented Protection of the Future Self**, you do not need an *audience* to feel it; you only need a *future*.
  *   In private shame, I am not hiding from *you*; I am hiding from *who I am becoming*. The "gaze" is not social; it is temporal. I am anticipating a future where my current self is unacceptable.
  *   This satisfies the **Phenomenological Constraint** (it matches the feeling) without relying on the "Imagined Audience" fudge factor that both EvoPsych and Constructionism use to patch the hole.

  ### Summary of Requirements for a Robust Theory

  1.  **Abandon Act/Self as Primary:** Treat it as a correlate, not the cause.
  2.  **Adopt Temporal Orientation:** Guilt = Past-Breach Resolution; Shame = Future-Self Protection.
  3.  **Solve Private Shame:** Explain it via internal temporal projection, not external social simulation.
  4.  **Explain Variation via Pedagogy:** Cultural differences are differences in *time-horizon training*, not differences in emotional capacity.

  If a theory cannot handle **Private Shame** without waving a ghostly "Imagined Audience" in front of it, it is prioritizing its own ideological commitments (biology or culture) over the phenomenological data. That is the definition of a just-so story.
