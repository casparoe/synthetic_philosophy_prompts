answer: |-
  Here is a decision tree designed for your handout. It prioritizes your two cuts (Substitution and Two-Key) and sorts by case-logic rather than jargon. I have kept the volcano/bug distinction as an early branch, as you requested, because it prevents category errors before they start.

  ### The "Non-Human Actors" Decision Tree

  **Start:** Pick a historical case (e.g., Irish Famine, Saint-Domingue, Tambora). You agree the non-human factor (blight, fever, ash) mattered.

  **Q1. The Responsiveness Filter**
  Does the non-human entity change its behavior or structure in response to human intervention (e.g., evolving resistance, tracking hosts), or does it act regardless of what humans do (e.g., volcanic ash, a cold decade)?
  *   **Yes (Responsive):** Go to Q2. (Cases: Blight, Antibiotic Resistance, Yellow Fever)
  *   **No (Static):** Go to Q4. (Cases: Tambora, Drought)

  **Q2. The Substitution Test (Your Cut)**
  If you swapped this pathogen for a different one with the same mortality rate and timing, but different biology (vector, incubation, seasonality), would the historical narrative need to be rewritten?
  *   **No (Story stays the same):** Go to **Leaf 7 (Demographic Shock)**.
  *   **Yes (Story changes):** Go to Q3.

  **Q3. The Two-Key Test (Your Cut)**
  Was the pathogen sufficient to cause the catastrophe on its own, or did it require a specific social vulnerability (land tenure, crowding, storage) to turn an outbreak into a disaster?
  *   **Pathogen Alone Sufficed:** Go to **Leaf 8 (Overdetermination)**.
  *   **Needed Social Vulnerability:** Go to **Leaf 6 (Structural Accountability)**.
  *   *(Note: If you think the pathogen merely finished what policy started, go to **Leaf 5**).*

  **Q4. The Symmetry Filter**
  Do you describe the non-human's action using the same vocabulary you use for humans (e.g., "strategy," "response," "agency"), or strictly mechanical terms (e.g., "force," "cause," "parameter")?
  *   **Same Vocabulary:** Go to Q5.
  *   **Mechanical Terms:** Go to **Leaf 1 (Hard Materialism)**.

  **Q5. The Mind Filter**
  Does "agency" require a mind, intent, or consciousness, or is it enough that the entity makes a difference in a network?
  *   **Requires Mind:** Go to **Leaf 1 (Hard Materialism)**.
  *   **Makes a Difference:** Go to **Leaf 3 (Flat Ontology/ANT)**.

  **Q6. The Determinism Filter**
  Did the environment/geography dictate the specific historical outcome, or did it merely set the boundaries within which humans made choices?
  *   **Dictated Outcome:** Go to **Leaf 4 (Environmental Determinism)**.
  *   **Set Boundaries:** Go to **Leaf 5 (Possibilism)**.

  **Q7. The Blame Filter**
  Does emphasizing the non-human's role make human actors look *less* responsible for the suffering, or *more* responsible for the conditions that allowed it?
  *   **Less Responsible:** Go to **Leaf 9 (Exculpatory Naturalism)**.
  *   **More Responsible:** Go to **Leaf 6 (Structural Accountability)**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Hard Materialism ("Causes All The Way Down")**
  *Position:* Non-humans are causes, not actors. Agency requires a mind. Volcanoes and germs are forces that happen *to* history, not participants *in* it.
  *   **Confidence:** High. This is the default positivist stance; your framing does it no violence.

  **Leaf 2: Biological Agency ("The Organism Qualifies")**
  *Position:* Organisms genuinely qualify as actors because they are organized systems that track environments and evolve; aerosol clouds or ash do not.
  *   **Confidence:** High. Matches your instinct; common in biology-heavy HPS but rarely named distinctly from ANT.

  **Leaf 3: Flat Ontology ("Symmetrical Agency")**
  *Position:* Anything that makes a difference in the network counts as an actor. A vote, a microbe, and a door-closer all have agency.
  *   **Confidence:** High. Standard Actor-Network Theory (Latour/Callon), though often caricatured by critics.

  **Leaf 4: Environmental Determinism ("Climate Sets the Course")**
  *Position:* Geography or climate dictates the trajectory of history; human choice is secondary to the constraints of the land/weather.
  *   **Confidence:** Medium. Often held implicitly; scholars rarely self-identify as "determinists" anymore, preferring "constraint."

  **Leaf 5: Possibilism ("Enabling Conditions")**
  *Position:* The environment sets the limits of what is possible, but humans choose the path within those limits.
  *   **Confidence:** High. Standard geographical stance; distinct from determinism but often conflated in practice (see "Indistinguishable" below).

  **Leaf 6: Structural Accountability ("Germs Reveal Negligence")**
  *Position:* The germ didn't excuse the disaster; it highlighted the human failure (policy, poverty) that made the germ catastrophic. (Two-Key: Social Side).
  *   **Confidence:** High. Dominant in modern social history of medicine/famine.

  **Leaf 7: Demographic Shock ("The Substitution Works")**
  *Position:* The specific biology did no work. Any pathogen with that mortality rate would have produced the same historical shift.
  *   **Confidence:** High. Common in macro-history (e.g., some readings of Smallpox in the Americas).

  **Leaf 8: Overdetermination ("The Germ Alone Sufficed")**
  *Position:* The pathogen was so virulent it would have caused the collapse regardless of social conditions. (Two-Key: Germ Side).
  *   **Confidence:** Medium. Often argued in early epidemic stages, but rarely holds up to scrutiny in complex famines.

  **Leaf 9: Exculpatory Naturalism ("Germs Excuse Humans")**
  *Position:* Framing the event as "natural" or "biological" reduces human moral responsibility for the outcome.
  *   **Confidence:** High. This is usually a *critique* leveled by others, not a position scholars claim for themselves.

  **Leaf 10: Social Determinism ("Policy Started It")**
  *Position:* The germ only finished what land tenure, colonialism, or poverty had already started; the biological event was incidental.
  *   **Confidence:** Medium-High. Strong in Marxist historiography; risks sliding into Leaf 6.

  **Leaf 11: [Unoccupied] Volcano Agency**
  *Position:* A stratovolcano has "agency" in the same way a bacterium does.
  *   **Confidence:** N/A. **Logical Hole.** Incoherent. Volcanoes do not track environments or evolve; attributing agency here is purely metaphorical, unlike Leaf 2.

  **Leaf 12: [Unoccupied] Magic Dust**
  *Position:* The specific biology matters, but not *how* it matters (timing/vector irrelevant, only "germ-ness" counts).
  *   **Confidence:** N/A. **Logical Hole.** Unattractive. If biology matters, the *mechanism* must matter. If the mechanism doesn't matter, you are in Leaf 7.

  ---

  ### Structural Notes & Holes

  **Indistinguishable Leaves:**
  *   **Leaf 5 (Possibilism) vs. Leaf 10 (Social Determinism):** These often differ only in emphasis. Possibilism says "The blight couldn't kill if there was food." Social Determinism says "The policy ensured there was no food." In a handout, treat them as neighbors; scholars often slide between them without noticing.
  *   **Leaf 6 (Structural Accountability) vs. Leaf 9 (Exculpatory Naturalism):** These are opposites, but the *same scholar* might be accused of Leaf 9 by their critics while intending Leaf 6. The tree sorts by *effect*, not intent.

  **Logical Holes:**
  *   **Leaf 11 (Volcano Agency):** As noted, this is incoherent unless you define "agency" so loosely it means "existence." A volcano cannot fail to be a volcano; a bacterium can fail to infect.
  *   **Leaf 12 (Magic Dust):** This position allows for "biology matters" without "specifics matter." It is logically unstable. If the specific natural history (vector, incubation) doesn't change the story, you fail the Substitution Test and belong in Leaf 7.

  ### Least Confidence Declaration

  **I am least confident about Leaf 5 (Possibilism) vs. Leaf 10 (Social Determinism).**
  **Why:** In practice, these two positions are often methodological twins. A historian claiming "Possibilism" (environment sets limits) and one claiming "Social Determinism" (policy created the vulnerability) will often analyze the Irish Famine or Saint-Domingue in nearly identical ways, differing only in whether they emphasize the *constraint* or the *choice*. For the purpose of your reading group, they may function as the same leaf, distinguished only by whether the speaker wants to sound like a geographer (Leaf 5) or a sociologist (Leaf 10). If you need to simplify, merge them into "Conjunctive Causation."
